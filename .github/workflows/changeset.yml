name: Changeset

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changeset:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Always: validate every pending changeset's frontmatter package name.
      # `changeset status` exits non-zero on a name that isn't in the workspace
      # (e.g. "@existential/catalog"), which otherwise makes the Release
      # workflow's `changeset version` abort and silently block all releases.
      - name: Validate changeset package names
        run: pnpm changeset status

      # Data PRs only: require a changeset to be present (and valid). With
      # --since, `changeset status` exits 1 when the workspace package changed
      # but no changeset was added — catching import PRs that forgot one.
      # Chore/dependency PRs (no data/*.yaml changes) are not required to add
      # a changeset, so this does not burden renovate or docs-only PRs.
      - name: Require a changeset when catalog data changes
        run: |
          if git diff --name-only origin/main...HEAD | grep -qE '^data/.*\.yaml$'; then
            echo "Data files changed — verifying a changeset is present and valid."
            pnpm changeset status --since=origin/main
          else
            echo "No data/*.yaml changes in this PR — changeset not required."
          fi
