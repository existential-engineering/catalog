name: Changeset

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changeset:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          # No authenticated git ops run after checkout (only local diff and
          # `changeset status --since=origin/main`), so don't leave the token
          # in .git/config while `pnpm install` runs PR-authored build scripts.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Catalog data PRs must ship a valid changeset. `changeset status
      # --since=origin/main` scopes the check to the changeset(s) THIS PR adds
      # and fails (non-zero exit) when either:
      #   * the changeset names a package that isn't in the workspace
      #     (e.g. "@existential/catalog") — the same error that aborts the
      #     Release workflow's `changeset version` and silently blocks every
      #     release; or
      #   * data changed but no changeset was added at all.
      # Chore/dependency PRs (no data/*.yaml change) are skipped, so this never
      # burdens renovate or docs-only PRs. `origin/main` is available because
      # the checkout above uses fetch-depth: 0.
      - name: Verify changeset for data changes
        run: |
          if git diff --name-only origin/main...HEAD | grep -qE '^data/.*\.yaml$'; then
            echo "Data files changed — validating this PR's changeset."
            pnpm changeset status --since=origin/main
          else
            echo "No data/*.yaml changes in this PR — changeset check skipped."
          fi
