name: URL Health Check

on:
  schedule:
    # Run weekly on Monday at 6 AM UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      force_recheck:
        description: "Force recheck all URLs (ignore cache)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

# Two jobs, split by what they hold, on the same reasoning as
# assign-ids.yml. `check-urls` runs `pnpm install` (the repo's lifecycle
# scripts) and then thousands of guarded requests to contributor-chosen
# URLs. Anything running in that job can read every credential the job
# references, so it references a read-only token and nothing else, and
# hands its one product, the refreshed cache, to `commit-cache` as an
# artifact. `commit-cache` is the only job that holds a contents-write
# token: it installs nothing, runs no script from the tree, checks the
# artifact is the JSON it expects, and pushes that one file.
jobs:
  check-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    outputs:
      cache: ${{ steps.cache.outputs.present }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The input is a workflow_dispatch boolean, so it reaches the shell
      # through env rather than `${{ }}` inside `run:`, like every other
      # value these workflows did not choose.
      - name: Run URL validation
        id: urls
        continue-on-error: true
        env:
          FORCE_RECHECK: ${{ inputs.force_recheck }}
        run: |
          if [ "$FORCE_RECHECK" = "true" ]; then
            pnpm validate-urls --update-cache --ignore-cache
          else
            pnpm validate-urls --use-cache --update-cache
          fi

      # Only the cache file is handed on. The first run may not create it.
      - name: Check for cache updates
        id: cache
        if: always()
        run: |
          if [ -f .github/url-cache.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload cache
        if: always() && steps.cache.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: url-cache
          path: .github/url-cache.json
          retention-days: 1
          if-no-files-found: error

      - name: Create or update issue for broken URLs
        if: steps.urls.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');

            // A Markdown table cell built from catalog data. The URL comes
            // from an entry a pull request merged, so it is data and not
            // markup: a newline ends the row, a pipe adds a column, a
            // backtick opens a code span, a bare @name notifies a real user
            // from a bot's comment, and [text](url) renders as a live link
            // this report appears to vouch for. Any of those lets an
            // accepted URL restructure the report or change whose name
            // appears to have written it.
            const cell = (s) => String(s)
              .replace(/[\u0000-\u001f\u007f-\u009f  ]+/g, ' ')
              .replace(/[\\`|<>@[\]()!]/g, (ch) => '\\' + ch)
              .trim() || '-';

            // Read the URL cache to get broken URLs
            let brokenUrls = [];
            try {
              const cache = JSON.parse(fs.readFileSync('.github/url-cache.json', 'utf-8'));
              for (const [url, entry] of Object.entries(cache.entries)) {
                if (entry.status === 'error' || (typeof entry.status === 'number' && entry.status >= 400)) {
                  brokenUrls.push({
                    url,
                    status: entry.status,
                    errorMessage: entry.errorMessage || `HTTP ${entry.status}`,
                    lastChecked: entry.lastChecked
                  });
                }
              }
            } catch (e) {
              console.log('Could not read URL cache:', e.message);
            }

            if (brokenUrls.length === 0) {
              console.log('No broken URLs found in cache');
              return;
            }

            const title = '🔗 Broken URLs detected';
            const body = `## Broken URLs Report

            The weekly URL health check found ${brokenUrls.length} broken URL(s):

            | URL | Status | Last Checked |
            |-----|--------|--------------|
            ${brokenUrls.map(u => `| ${cell(u.url)} | ${cell(u.status)} | ${cell(u.lastChecked)} |`).join('\n')}

            ### Next Steps

            1. Check if these URLs are temporarily down
            2. Update entries with corrected URLs
            3. Remove entries for discontinued products

            ---
            *This issue was automatically created by the URL Health Check workflow.*
            `;

            // Find existing issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'broken-urls'
            });

            const existingIssue = issues.find(i => i.title === title);

            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['broken-urls']
              });
              console.log('Created new issue for broken URLs');
            }

      - name: Close issue if no broken URLs
        if: steps.urls.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = '🔗 Broken URLs detected';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'broken-urls'
            });

            const existingIssue = issues.find(i => i.title === title);

            if (existingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                state: 'closed',
                body: existingIssue.body + '\n\n---\n✅ All URLs are now valid. Closing this issue.'
              });
              console.log(`Closed issue #${existingIssue.number}`);
            }

  commit-cache:
    needs: check-urls
    if: always() && needs.check-urls.outputs.cache == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # No `pnpm install` runs here, so no husky hooksPath gets configured
      # either; hooks are disabled below all the same.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Download cache
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: url-cache
          path: .github

      # The artifact was produced by a job that ran contributor-reachable
      # code, so it is data to check, not a file to trust: it has to parse
      # as the cache shape `scripts/lib/url-cache.ts` writes, and nothing
      # else may have changed.
      - name: Verify cache artifact
        run: |
          node -e '
            const fs = require("node:fs");
            const cache = JSON.parse(fs.readFileSync(".github/url-cache.json", "utf-8"));
            const ok = cache && cache.version === 1 && cache.entries && typeof cache.entries === "object" && !Array.isArray(cache.entries);
            if (!ok) { console.error("::error::url-cache.json is not a version 1 cache; refusing to commit it"); process.exit(1); }
          '
          if git status --porcelain | grep -vE '^.. \.github/url-cache\.json$'; then
            echo "::error::artifact changed something other than .github/url-cache.json; refusing to commit"
            exit 1
          fi

      - name: Commit cache updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/url-cache.json
          git diff --staged --quiet && exit 0
          git -c core.hooksPath=/dev/null commit -m "chore: update URL cache"
          git -c core.hooksPath=/dev/null push || echo "Push failed - may need manual intervention"
