name: Validate

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Validate YAML files
        run: pnpm validate

      - name: Validate translations
        run: pnpm validate:translations

      - name: Check JSON schemas are up to date
        run: |
          pnpm generate:schemas
          git diff --exit-code schema/json/ || (echo "::error::JSON schemas are out of date. Run 'pnpm generate:schemas' and commit the results." && exit 1)

      - name: Check formatting
        run: pnpm format:check

      - name: Check ID immutability
        if: github.event_name == 'pull_request'
        run: pnpm exec tsx scripts/check-id-immutability.ts origin/main

      - name: Build database (test)
        run: pnpm build 0
