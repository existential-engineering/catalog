name: Validate

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/**"
      # Dependency manifests trigger the audit job below. Without these a
      # renovate PR gets no Validate run at all, so a bump that breaks tsx,
      # vitest or better-sqlite3 only surfaces on the next data PR.
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/validate.yml"
  # Keep these paths in sync with the push trigger above.
  pull_request:
    branches: [main]
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Validate YAML files
        run: pnpm validate

      - name: Validate translations
        run: pnpm validate:translations

      - name: Check JSON schemas are up to date
        run: |
          pnpm generate:schemas
          git diff --exit-code schema/json/ || (echo "::error::JSON schemas are out of date. Run 'pnpm generate:schemas' and commit the results." && exit 1)

      - name: Check CONTEXT.md is up to date
        run: |
          pnpm generate:context
          git diff --exit-code schema/CONTEXT.md || (echo "::error::schema/CONTEXT.md is out of date. Run 'pnpm generate:context' and commit the result." && exit 1)

      - name: Check formatting
        run: pnpm format:check

      - name: Check ID immutability
        if: github.event_name == 'pull_request'
        run: pnpm exec tsx scripts/check-id-immutability.ts origin/main

      - name: Build database (test)
        run: pnpm build 0

  # Kept out of the validate job on purpose. `pnpm audit` goes red when an
  # advisory is published upstream, with no change to this repo. As the first
  # step of a single job it skipped every data check behind it, so the Validate
  # check was red on every open PR regardless of content (AUREO-781). Running it
  # as its own job means a fresh advisory blocks dependency hygiene without ever
  # masking whether the catalog data itself is valid.
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
