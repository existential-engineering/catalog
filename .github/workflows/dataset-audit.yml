name: Dataset Audit

on:
  schedule:
    # Run monthly on the 3rd at midnight UTC (staleness runs the 1st,
    # discontinued the 2nd — stagger to avoid colliding issue updates).
    - cron: "0 0 3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every audit appends its settled findings to findings/findings.jsonl
      # (see "Findings" in CLAUDE.md); the racks repo's file-findings.ts
      # carries that file into the catalog-submissions inbox, one issue per
      # finding, ever. The terminal reports are unchanged. Each audit is
      # `|| true`: a red audit must not stop the next one or the issue
      # update below, and the findings file is uploaded whatever happened.
      - name: Generate dataset audit
        id: audit
        run: |
          mkdir -p findings
          pnpm dataset:audit --json --findings findings > audit.json

      - name: Run the corpus audits with findings
        run: |
          pnpm power-input-audit --findings findings || true
          pnpm speaker-level-audit --findings findings || true
          pnpm capability-gaps --findings findings || true
          pnpm prose-layout-audit --findings findings || true
          wc -l findings/findings.jsonl || true

      - name: Upload findings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-findings
          path: findings/findings.jsonl
          if-no-files-found: ignore
          retention-days: 45

      - name: Create or update dataset audit issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const audit = JSON.parse(fs.readFileSync('audit.json', 'utf-8'));
            const dedent = (str) => str.replace(/^[ \t]+/gm, '');
            // A pipe is not the only thing in a catalog value that can
            // restructure this table: a newline ends the row, a backtick
            // opens a code span, a bare @name notifies a real user from a
            // bot's comment, and [text](url) renders as a live link this
            // report appears to vouch for. Names and descriptions come from
            // merged pull requests, so they are data rather than markup.
            const cell = (s) => String(s)
              .replace(/[\u0000-\u001f\u007f-\u009f\u2028\u2029]+/g, ' ')
              .replace(/[\\`|<>@[\]()!]/g, (ch) => '\\' + ch)
              .trim() || '-';

            const title = '🔎 Dataset Audit';
            const byCheck = audit.summary.byCheck;
            // Actionable = needs a data fix. Orphan manufacturers, thin
            // descriptions and stale prices are informational and large;
            // they don't gate the issue open/closed (otherwise it would
            // never close). Broken compatibleWith used to be counted here
            // and was always zero, since E206 fails validation on it.
            const actionable = byCheck.duplicateName + byCheck.duplicateUrl;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dataset-audit'
            });
            const existingIssue = issues.find(i => i.title === title);

            // Nothing actionable — close any existing issue and bail.
            if (actionable === 0) {
              console.log('Dataset audit found no actionable cross-entry issues');
              if (existingIssue) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  body: `✅ No actionable cross-entry issues as of ${audit.generatedAt}.`
                });
              }
              return;
            }

            const dupes = audit.findings.filter(f => f.check === 'duplicate-name');
            const dupeUrls = audit.findings.filter(f => f.check === 'duplicate-url');

            const coverageRows = Object.entries(audit.coverage).map(([name, c]) => {
              const p = (n) => c.total ? `${Math.round((n / c.total) * 100)}%` : '—';
              return `| ${name} | ${c.total} | ${p(c.withDescription)} | ${p(c.withUrl)} | ${p(c.withPrices)} | ${p(c.withVerification)} |`;
            }).join('\n');

            let body = dedent(`## Dataset Audit

            Generated: ${audit.generatedAt}

            Whole-dataset cross-entry checks (Tier 1). For an LLM review of the
            ambiguous subset, run \`/dataset-review\` locally.

            ### Summary

            | Check | Count | Action |
            |-------|-------|--------|
            | Duplicate-name groups | ${byCheck.duplicateName} | Merge, fold into \`variants\`, or disambiguate |
            | Duplicate-url groups | ${byCheck.duplicateUrl} | Merge, or give each entry its own product page |
            | Orphan manufacturers | ${byCheck.orphanManufacturer} | Informational — manufacturers with no products |
            | Thin descriptions | ${byCheck.thinDescription} | Informational — descriptions under 40 chars |
            | Makers with stale prices | ${byCheck.priceStaleness} | Informational — prices with no \`asOf\` or older than 18 months |
            | Flagged for LLM review | ${audit.summary.flagged} | \`/dataset-review\` |

            ### Coverage

            | Collection | Entries | Description | URL | Price | Verification |
            |------------|---------|-------------|-----|-------|--------------|
            ${coverageRows}

            `);

            if (dupes.length > 0) {
              body += dedent(`### Duplicate-name groups (${dupes.length})

              Same manufacturer + collection + normalized name. Review each: true duplicate (merge), cosmetic variant (fold into \`variants\`), or distinct product (disambiguate).

              <details>
              <summary>Click to expand</summary>

              | Collection | Name | Files |
              |------|------|------|
              ${dupes.slice(0, 100).map(f => `| ${cell(f.collection)} | ${cell(f.name)} | ${f.files.map(x => `\`${cell(x)}\``).join(' + ')} |`).join('\n')}
              ${dupes.length > 100 ? `\n*... and ${dupes.length - 100} more*` : ''}

              </details>

              `);
            }

            if (dupeUrls.length > 0) {
              body += dedent(`### Duplicate-url groups (${dupeUrls.length})

              Same collection + normalized \`url\`. Usually one product filed twice; otherwise each entry needs its own product page.

              <details>
              <summary>Click to expand</summary>

              | Collection | Files | Detail |
              |------|------|------|
              ${dupeUrls.slice(0, 100).map(f => `| ${cell(f.collection)} | ${f.files.map(x => `\`${cell(x)}\``).join(' + ')} | ${cell(f.detail)} |`).join('\n')}
              ${dupeUrls.length > 100 ? `\n*... and ${dupeUrls.length - 100} more*` : ''}

              </details>

              `);
            }

            body += dedent(`---
            *Automatically generated by the monthly dataset audit workflow.*
            `);

            if (existingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['dataset-audit']
              });
            }
