name: Discontinued Check

on:
  schedule:
    # Run monthly on the 2nd at midnight UTC (staleness runs on the 1st)
    - cron: "0 0 2 * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate discontinued report
        id: report
        run: |
          pnpm discontinued:report --json > discontinued.json

      - name: Create or update discontinued issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('discontinued.json', 'utf-8'));
            const dedent = (str) => str.replace(/^[ \t]+/gm, '');

            const title = '🗂 Discontinued Tagging Backlog';
            const tier1 = report.summary.supersededMissingCategory;
            const tier2 =
              report.summary.legacyWithoutDiscontinued +
              report.summary.verificationDiscontinuedMissingCategory;
            const totalGaps = tier1 + tier2;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'discontinued-backlog'
            });
            const existingIssue = issues.find(i => i.title === title);

            // No gaps — close any existing issue and bail.
            if (totalGaps === 0) {
              console.log('Catalog has no discontinued tagging gaps');
              if (existingIssue) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  body: `✅ All discontinued tagging gaps resolved as of ${report.generatedAt}.`
                });
              }
              return;
            }

            // Escape pipe characters that would break the markdown table.
            const cell = (s) => String(s).replace(/\|/g, '\\|');

            let body = dedent(`## Discontinued Tagging Backlog

            Generated: ${report.generatedAt}

            ### Summary

            | Metric | Count |
            |--------|-------|
            | Total entries | ${report.summary.totalEntries} |
            | Superseded products | ${report.summary.superseded} |
            | Tier 1 — superseded, missing \`discontinued\` category | ${tier1} |
            | Tier 2 — has \`legacy\` only | ${report.summary.legacyWithoutDiscontinued} |
            | Tier 2 — \`verification.status=discontinued\`, missing category | ${report.summary.verificationDiscontinuedMissingCategory} |

            **Tier 1 is auto-tag-safe:**

            \`\`\`bash
            pnpm discontinued:apply --apply
            pnpm format
            \`\`\`

            `);

            if (report.supersededMissingCategory.length > 0) {
              body += dedent(`### Tier 1 — Superseded, missing \`discontinued\` (${report.supersededMissingCategory.length})

              <details>
              <summary>Click to expand</summary>

              | File | Manufacturer | Name | Type |
              |------|------|------|------|
              ${report.supersededMissingCategory.slice(0, 100).map(c => `| \`${cell(c.file)}\` | ${cell(c.manufacturer)} | ${cell(c.name)} | ${cell(c.type)} |`).join('\n')}
              ${report.supersededMissingCategory.length > 100 ? `\n*... and ${report.supersededMissingCategory.length - 100} more*` : ''}

              </details>

              `);
            }

            body += dedent(`---
            *Automatically generated by the monthly discontinued check workflow.*
            `);

            if (existingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['discontinued-backlog']
              });
            }
