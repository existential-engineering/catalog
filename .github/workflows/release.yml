name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate before release
        run: pnpm validate

      - name: Create Release Pull Request or Tag
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          version: pnpm run version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build database
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm build

      - name: Generate checksum
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: sha256sum dist/catalog.sqlite > dist/catalog.sqlite.sha256

      - name: Generate SBOM
        if: steps.changesets.outputs.hasChangesets == 'false'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          artifact-name: catalog-sbom.spdx.json
          output-file: dist/catalog-sbom.spdx.json

      - name: Get package version
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: pkg
        run: echo "version=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: tag_check
        run: |
          if git rev-parse "${{ steps.pkg.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ steps.pkg.outputs.version }}
          name: Catalog ${{ steps.pkg.outputs.version }}
          generate_release_notes: true
          files: |
            dist/catalog.sqlite
            dist/catalog.sqlite.sha256
            dist/catalog-sbom.spdx.json
