name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate before release
        run: pnpm validate

      - name: Create Release Pull Request or Tag
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          version: pnpm run version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build database
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm build

      - name: Generate checksum
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: sha256sum dist/catalog.sqlite > dist/catalog.sqlite.sha256

      - name: Sign catalog with minisign
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
          CATALOG_SIGNING_KEY_PASSWORD: ${{ secrets.CATALOG_SIGNING_KEY_PASSWORD }}
        run: |
          curl -sL https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz | tar xz
          sudo install -m 755 minisign-linux/x86_64/minisign /usr/local/bin/minisign
          echo "$CATALOG_SIGNING_KEY" > /tmp/minisign.key
          VERSION=$(node -p "require('./package.json').version")
          echo "$CATALOG_SIGNING_KEY_PASSWORD" | minisign -S \
            -s /tmp/minisign.key \
            -m dist/catalog.sqlite \
            -t "catalog v${VERSION}"
          rm /tmp/minisign.key

      - name: Generate SBOM
        if: steps.changesets.outputs.hasChangesets == 'false'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          artifact-name: catalog-sbom.spdx.json
          output-file: dist/catalog-sbom.spdx.json

      - name: Get package version
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: pkg
        run: echo "version=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: tag_check
        run: |
          if git rev-parse "${{ steps.pkg.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ steps.pkg.outputs.version }}
          name: Catalog ${{ steps.pkg.outputs.version }}
          generate_release_notes: true
          files: |
            dist/catalog.sqlite
            dist/catalog.sqlite.sha256
            dist/catalog.sqlite.minisig
            dist/catalog-sbom.spdx.json
