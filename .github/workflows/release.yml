name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate before release
        run: pnpm validate

      - name: Create Release Pull Request or Tag
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build database
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm build

      - name: Build web index
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm build:index

      - name: Generate checksum
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          sha256sum dist/catalog.sqlite > dist/catalog.sqlite.sha256
          sha256sum dist/catalog-index.json > dist/catalog-index.json.sha256

      - name: Sign catalog with minisign
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
          CATALOG_SIGNING_KEY_PASSWORD: ${{ secrets.CATALOG_SIGNING_KEY_PASSWORD }}
        run: |
          curl -sL https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz | tar xz
          sudo install -m 755 minisign-linux/x86_64/minisign /usr/local/bin/minisign
          echo "$CATALOG_SIGNING_KEY" > /tmp/minisign.key
          VERSION=$(node -p "require('./package.json').version")
          echo "$CATALOG_SIGNING_KEY_PASSWORD" | minisign -S \
            -s /tmp/minisign.key \
            -m dist/catalog.sqlite \
            -t "catalog v${VERSION}"
          echo "$CATALOG_SIGNING_KEY_PASSWORD" | minisign -S \
            -s /tmp/minisign.key \
            -m dist/catalog-index.json \
            -t "catalog-index v${VERSION}"
          rm /tmp/minisign.key

      - name: Generate SBOM
        if: steps.changesets.outputs.hasChangesets == 'false'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          artifact-name: catalog-sbom.spdx.json
          output-file: dist/catalog-sbom.spdx.json

      - name: Get package version
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: pkg
        run: echo "version=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: tag_check
        run: |
          if git rev-parse "${{ steps.pkg.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ steps.pkg.outputs.version }}
          name: Catalog ${{ steps.pkg.outputs.version }}
          generate_release_notes: true
          files: |
            dist/catalog.sqlite
            dist/catalog.sqlite.sha256
            dist/catalog.sqlite.minisig
            dist/catalog-sbom.spdx.json
            dist/catalog-index.json
            dist/catalog-index.json.sha256
            dist/catalog-index.json.minisig
