name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # For build-provenance attestation of release artifacts
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate before release
        run: pnpm validate

      - name: Create Release Pull Request or Tag
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm run version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

      - name: Build database
        if: steps.changesets.outputs['has-changesets'] == 'false'
        run: pnpm build

      - name: Build web index
        if: steps.changesets.outputs['has-changesets'] == 'false'
        run: pnpm build:index

      - name: Generate checksum
        if: steps.changesets.outputs['has-changesets'] == 'false'
        run: |
          sha256sum dist/catalog.sqlite > dist/catalog.sqlite.sha256
          sha256sum dist/catalog-index.json > dist/catalog-index.json.sha256

      - name: Sign catalog with minisign
        if: steps.changesets.outputs['has-changesets'] == 'false'
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
          CATALOG_SIGNING_KEY_PASSWORD: ${{ secrets.CATALOG_SIGNING_KEY_PASSWORD }}
        run: |
          curl -sL https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz | tar xz
          sudo install -m 755 minisign-linux/x86_64/minisign /usr/local/bin/minisign
          echo "$CATALOG_SIGNING_KEY" > /tmp/minisign.key
          VERSION=$(node -p "require('./package.json').version")
          echo "$CATALOG_SIGNING_KEY_PASSWORD" | minisign -S \
            -s /tmp/minisign.key \
            -m dist/catalog.sqlite \
            -t "catalog v${VERSION}"
          echo "$CATALOG_SIGNING_KEY_PASSWORD" | minisign -S \
            -s /tmp/minisign.key \
            -m dist/catalog-index.json \
            -t "catalog-index v${VERSION}"
          rm /tmp/minisign.key

      - name: Generate SBOM
        if: steps.changesets.outputs['has-changesets'] == 'false'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          artifact-name: catalog-sbom.spdx.json
          output-file: dist/catalog-sbom.spdx.json

      # Sigstore build provenance for the release artifacts (SLSA). The
      # bundle is also attached to the release as catalog.intoto.jsonl so
      # consumers (and OpenSSF Scorecard) can verify it offline. Best-effort:
      # a bookkeeping step must never be able to break a release.
      - name: Attest build provenance
        if: steps.changesets.outputs['has-changesets'] == 'false'
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/catalog.sqlite
            dist/catalog-index.json

      - name: Stage provenance bundle for release
        if: steps.changesets.outputs['has-changesets'] == 'false' && steps.attest.outcome == 'success'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/catalog.intoto.jsonl

      - name: Get package version
        if: steps.changesets.outputs['has-changesets'] == 'false'
        id: pkg
        run: echo "version=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        if: steps.changesets.outputs['has-changesets'] == 'false'
        id: tag_check
        run: |
          if git rev-parse "${{ steps.pkg.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.changesets.outputs['has-changesets'] == 'false' && steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.pkg.outputs.version }}
          name: Catalog ${{ steps.pkg.outputs.version }}
          generate_release_notes: true
          files: |
            dist/catalog.sqlite
            dist/catalog.sqlite.sha256
            dist/catalog.sqlite.minisig
            dist/catalog.intoto.jsonl
            dist/catalog-sbom.spdx.json
            dist/catalog-index.json
            dist/catalog-index.json.sha256
            dist/catalog-index.json.minisig
