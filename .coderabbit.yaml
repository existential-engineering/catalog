language: en-US

reviews:
  # TEMPORARY, REMOVE BEFORE MERGE. This PR touches 792 files, 492 over
  # CodeRabbit's 300-file review cap, so it was skipped entirely. The data
  # files are machine-generated by `pnpm derive-capabilities`; the ~16
  # schema/scripts files are the ones that need review. Testing whether the
  # cap is counted after path_filters (undocumented either way).
  # This MUST come back out: without it, every future catalog import PR loses
  # the data/**/*.yaml path_instructions below, which are the whole review.
  path_filters:
    - "!data/**"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  path_instructions:
    - path: "data/**/*.yaml"
      instructions: |
        Focus on data quality. Check for:
        - Correct slug format (lowercase, hyphens only, no spaces)
        - Required fields present based on entry type (see CLAUDE.md)
        - Identifiers (bundle IDs) are recommended for software but not required — they are typically populated via sync
        - Valid URLs for url fields
        - If identifiers are present, check for proper bundle identifier formatting (reverse domain notation)
        - Categories should exist in schema/categories.yaml

        Field formatting conventions:
        - `manufacturer` must be a slug reference (lowercase-with-hyphens filename), NOT a display name
        - `details` must use block scalar `|-` with paragraphs separated by blank lines, NOT YAML arrays
        - `specs` must use block scalar `|-` with `- ` prefixed list items, NOT YAML arrays
        - `description` should use flow scalar format (Prettier auto-wraps)
        - Do NOT use `|` for block scalars; always use `|-` (strips trailing newlines)
        - Hardware `io` entries must use field order: name, signalFlow, category, type, connection, maxConnections, position
        - Hardware `io` entries should include `maxConnections` field
        - `url` and `links[].url` must be trimmed with no raw whitespace — percent-encode literal spaces as `%20`

        Semantic correctness (validation passes these; only a reviewer catches them — see CLAUDE.md):
        - `maxConnections` must NOT aggregate multiple physical jacks. Default is 1.
          A stereo pair is TWO ports (L and R), each `maxConnections: 1` — never one
          port with `2`. "Line Outputs 1-8" must be eight entries, not one entry with
          `maxConnections: 8`. Use `> 1` ONLY for a single connector that inherently
          carries multiple discrete channels (ADAT toslink = 8, DB25 = 8, MADI = 64).
          Flag any `maxConnections > 1` on 1/4-inch, 1/8-inch, xlr, combo jack, rca,
          5-pin din, usb, or thunderbolt.
        - Passive-loudspeaker inputs (speakON, binding-post, banana, euroblock,
          barrier/spring terminals) carry amplified signals — use `type: speaker-level`,
          NOT `type: line`. Line-level is for preamp/mixer outputs; a powered speaker
          input is speaker-level.
        - `versions` is release history ONLY (firmware/software point releases). It must
          NOT enumerate parallel SKUs, form factors, or model variants sold concurrently.
        - Cosmetic-only differences (color/finish, identical I/O and capabilities) belong
          in the hardware `variants` array, NOT in `versions`.
        - Genuine generational succession (MKI → MKII, Pro-C 2 → Pro-C 3) uses
          `supersedes` (the older product's ID). Sibling SKUs sold side by side get NO
          `supersedes` relationship.
        - Distinct concurrent SKUs (different I/O or capabilities) must each be their own
          top-level entry — never a nested `versions` entry.

        Check for potential duplicates:
        - Flag if product name is very similar to an existing entry
        - Flag if url matches another entry in the same collection
        - Flag if the same product might exist under a different slug/name
        - Software products should NOT be in manufacturers/ (they belong in software/)

        Translations and locale-specific content:
        - Links with locale indicators in titles (e.g., "User Manual (Spanish)") should use translations section instead
        - If a link title contains a language name in parentheses, it should be moved to translations.<locale>.links
        - Supported locales are defined in schema/locales.yaml (de, es, fr, ja, ko, pt-BR, zh)
        - For unsupported locales, either add the locale to schema/locales.yaml or keep as a general link

    - path: "schema/**/*.yaml"
      instructions: |
        Schema changes affect all data validation. Verify:
        - Backwards compatibility with existing entries
        - Consistent naming conventions

chat:
  auto_reply: true
