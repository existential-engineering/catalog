details: >-
  Wavetable presets and racks is the ultimate expansion for ableton wavetable.
  80 new wavetable racks for live feature a wide range of cross-genre sounds
  including future house plucks, cinematic pads, tropical house and pop keys,
  modern dubstep wobbles, drum and bass reeces and subs, edm synths, hip hop and
  trap leads, and future bass chords, as well as vintage analogue synths and
  classic dance sounds.


  Every rack has 8 controllers and mod wheel assigned to various parameters
  giving easy access to filter tweaks or full patch morphing. Each preset also
  comes with a MIDI clip to give an example of the sound. There's a wide range
  of chord progressions, riffs, and melodies.


  Because of the way ableton live handles files within a project, the product
  folder is shared as a project folder instead of creating an ableton live pack.
  This makes installing this pack easier. Full details are in the included user
  guide.


  To get the most out of these sounds, the presets are best used as racks which
  you will find in the "wavetable racks folder".
