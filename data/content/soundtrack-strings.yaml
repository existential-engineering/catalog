details: |-
  Most string libraries require endless tuning and tweaking of sections and divisi, losing focus on playability. Acustix soundtrack strings takes a different approach. All sections and divisi are carefully layed out and blended over the full range of the keyboard. This makes the string section playable as one instrument from the basses and cellos to the violas and violins.

  Most libraries have different patches for legato, staccato and marcato strings and these patches can't be easily stacked to create one playable instrument. They use either the key-velocity or the cc-controller to modulate the volume dynamics of the strings, making it impossible to play both legato and staccato at the same time. With acustix soundtrack strings you can combine/stack the legato/sordino and staccato/marcato strings patches without keyswitching, allowing a different and unique approach in playability.

  The key-velocity is used to modulate the attack dynamics (staccato/marcato), while the mod wheel (cc-controller) is used to modulate the volume dynamics (piano sordino/forte). This allows for any combination of legato/sordino/staccato/marcato at the same time: piano/forte sordino/legato and piano/forte staccato/marcato.

  This allows both a lush and lyrical warm sordino sound in the piano parts and a heroic and dramatic sound in the fortes without the cutting soaring sound of regular non-sordino strings. This character makes the acustix soundtrack strings perfectly suited for classical and soundtrack music.

  The acustix soundtrack strings is currently available in kontakt format. To be able to use the strings, you need kontakt 5 from native instruments.
