name: Ableton Drum Racks for Superior Drummer 3 Claustrophobic EZX
manufacturer: timbresandtones
primaryCategory: drum-sample-pack
description: Ableton drum racks for superior drummer 3 claustrophobic ezx
  features separate drum rack configurations designed for use with ableton live.
details: |-
  Ableton drum racks for superior drummer 3 claustrophobic ezx features separate ableton drum racks for all factory presets for the toontrack superior drummer 3 and claustrophobic ezx library for toontrack ezdrummer. These racks provide out of the box integration workflow between ableton live and toontrack superior drummer 3 using the toontrack libraries including a host of features ready to use for composition and performance using ableton push or similar controllers.

  12 ableton drum racks to instantly load the factory library "mix ready" presets with ableton mappings. 6 ableton live templates designed to host the multi channel output routing presets with track level audio routing from superior drummer 3 into ableton live.

  Colour coded pad design for visual performance and finger drumming. All racks use consistent drum rack colouring so you can visually and immediately spot your rides from your hi hat articulations. Vast array of instrument articulations ready to go in one massive layout using ableton push 64 pad layout mode.

  Ableton macros mapped to toontrack superior drummer macros with preset values for ease of use in push and simple to use automation programming. Singleout presets feature 6 ableton drum racks for all claustrophobic factory presets single audio output to a single ableton track. Multiout presets feature 6 ableton drum racks for all claustrophobic ezx presets in multiple audio channel output from the plug in to multiple ableton audio tracks using the 6 multi output ableton templates.

  Use the template racks and extend to your own toontrack superior drummer 3 claustrophobic ezx presets, swapping out individual sounds or articulations. You are 100% ready to go with the factory presets but there is no limitation to creating your own presets from these templates.
specs: |-
  - Ableton drum racks
  - Ableton live 9.5 or above
  - Ableton push integration
  - 12 ableton drum racks
  - 6 ableton live templates
  - 64 pad layout mode
  - Colour coded pad design
  - Ableton macros mapped to toontrack superior drummer macros
  - Singleout presets
  - Multiout presets
  - Multi-channel audio output routing
  - Macos and windows compatibility
