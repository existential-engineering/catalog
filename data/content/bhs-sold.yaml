details: |-
  BHS Sold is the th-u expansion library, signed by big hairy sounds, seeking to
  recreate the sound of '80s and '90s legendary guitarists, like steve lukather,
  lynch, moore, knopfler and michael landau, whose tone was based on soldano
  amplifiers.

  The library contains 179 rigs, captured using the following amplifiers:
  soldano slo-100 100w guitar head with the factory depth mod and mid-scoop mods
  which add bit more tone shaping possibilities to already perfect amp. The
  cleans are clear and robust. The crunch is an unsung hero of the amp, and are
  articulate and rocking'.

  Sold88 x88r tones were created using multiple speakers, mics and cabinets, and
  include rigs of other classic "sold" style tones. A hiwatt dr front end with
  an slo power section. The amp works just like a hiwatt other than the inputs
  for the normal and bright channels are linked to one input ala david gilmour.
  It is 100 watts running 5881/6l6 tubes.

  The library also includes 75 patches mainly focused on recreating the typical
  '80s and '90s setups. The bhs sold rig library adds a brand new modulation
  pedal into th-u. The micropitch effect reproduces the typical '80s and '90s
  chorusing effect obtained by detuning one channel over the other using a pitch
  shifter.

  You can load this rig library into the rig player component, available in any
  th-u version: th-u full, th-u rock, th-u metal, th-u funk and r&b, th-u slate
  edition, and th-u mobile.
specs: |-
  - 179 rigs
