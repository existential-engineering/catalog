details: |-
  Andrew Wade has been leading the charge of pop-punk and alternative rock production for over a decade, crafting breakthrough records for A Day To Remember, Neck Deep and Wage War. He produced A Day To Remember's debut And Their Name Was Treason and worked on their catalogue through Homesick , What Separates Me From You and Common Courtesy , from The Wade Studio in Ocala, Florida.

  For this second expansion pack, Andrew gathered his recent go-to tones from the studio and dialed them in for everything from fierce heavy metal to blissful cleans, along with a slew of bass tones ready to plug and play.

  Andrew's pack contains 60 captures.
