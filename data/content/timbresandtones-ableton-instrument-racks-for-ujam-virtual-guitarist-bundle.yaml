details: |-
  Ableton Instrument Racks for UJAM Virtual Guitarist Bundle of guitar libraries
  contains the entire iron, sparkle, silk and amber libraries mapped for ease of
  browsing, loading on Ableton push with each preset of the ujam virtual
  guitarist libraries saved as individual Ableton racks.

  As a result of this configuration, every pad is color coded to replicate the
  color scheme of the nks library on komplete control keyboards. Your ableton
  push now plays like a komplete kontrol!

  All ujam virtual guitarist iron, sparkle, silk and amber presets are mapped to
  ableton drum racks for load and performance on ableton push.

  Ableton push integration bridge for komplete kontrol enables browsing, loading
  and performing every preset from ableton push.

  Easily extend to your own virtual guitarist presets by saving as additional
  ableton racks.
