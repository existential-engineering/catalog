description: Remember that song where you couldn't tell if an instrument is a
  guitar or a piano? Neither do I. But now you will no longer forget. Because...
details: |-
  Using the magic of phase alignment, we tried to answer the curious question of what would happen if you align samples grabbed from different instruments. And with the excellent samples of flamestudios, freepats, patch arena and bigcat instruments, we present this one of a kind amalgamation of five different instruments squashed into a bass and a guitar.

  The library format is sfz and has been tested (and developed) with plogue sforzando. The samples themselves are in wav format. 144mb uncompressed. 44.1khz 16-bit.

  There are several sfz files provided: guitar and bass with a piano blended in: ambguitarpiano.sfz. Ambbasspiano.sfz. Ambbassguitarpiano.sfz: combined version for 88-key live-playing with the guitar shifted to higher keys. Key-switching controls whether there is more bass or more guitar. Less weirdness without the piano: ambguitar.sfz. Ambbass.sfz. Ambbassguitar.sfz. Lightweight versions of the above sampled in minor-thirds: xxx_lite.sfz.

  A MIDI controller with weighted keys or a MIDI-capable digital piano is recommended for live playing. Otherwise, a bit more bravery might be necessary.
specs: |-
  - Sfz format
  - Wav format samples
  - 144mb uncompressed
  - 44.1khz 16-bit
  - Plogue sforzando compatible
  - MIDI controller support
  - Weighted keys support
  - Digital piano compatible
  - Gnu general public license version 3 or later
