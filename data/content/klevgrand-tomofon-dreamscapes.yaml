details: |-
  Dreamscapes is an Expansion Pack for Klevgrand's Tomofon instrument, presented under the tagline "The Sky Isn't the Limit" and the line "Where sound becomes atmosphere".

  Slow-shifting, shimmering, and endlessly evolving, these patches live in the space between dream and reality. With inspiration drawn from vintage analog synths, Dreamscapes offers pads and other soft sounds that feel alive in your mix.

  The pack is pitched as genre-spanning: one moment adding weightless textures to a pop chorus, the next transforming into cinematic swells for a film score. Wherever they are placed, they are meant to expand the emotional depth of the music.

  The pack contains 31 Models and 46 Presets, and occupies 60.4 MB after installation.

  A license of Tomofon is required to use the expansion and is bought separately, or alternatively the installed iOS app. The Tomofon Expansion Pack works on both macOS/Windows and iOS.
