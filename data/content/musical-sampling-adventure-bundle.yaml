details: |-
  Adventure Bundle by Musical Sampling is a comprehensive instrument collection geared towards action and adventure scoring. Both adventure strings and adventure brass libraries feature a comprehensive set of patches specifically suited for exciting contexts, with the ability to quickly craft adventurous melodies in adventurous settings without any keyswitching.

  Adventure strings is the follow-up to soaring strings, performed by the same number of players and recorded in the same room with traditional seating arrangement. The library features a strong, passionate and relentlessly energetic performance aesthetic. Shorts were recorded from repetition phrases—a quick succession of notes at a procured tempo—with each note edited and programmed to be playable, resulting in patches that suit the context they were designed for.

  Adventure strings includes short articulations (spiccatos/staccatos/pizzicatos/marcatos), trills, tremolos, sustains, keyboard-spanning full strings instruments, and adventure patches. The library features morph stacking programming that allows any note length to sound natural, molto expressivo vibrato across the upper dynamic range, true fff sampling, to silence feature, adjustable humanization feature, and switchable crossfade/velocity control for short articulations.

  Adventure brass was recorded at the bridge in los angeles, a prominent scoring stage that has overseen a variety of television, film and game scoring projects since its opening in 2010. The library was created as a true workhorse brass library that is first and foremost fun to play, utilizing morph stacking programming techniques that allow you to perform lines on-the-fly without any keyswitching.

  Adventure brass features medium-sized sections (2 trumpets, 4 horns, 2 trombones, 1 tuba) designed to treat equally-well to both unison and harmonic passages with believable transparency when crossfading between dynamic layers. The library includes adjustable humanization feature, to silence feature, solo trumpet overlay feature, true playable repetitions for trumpets, and three microphone positions (close, room, mixed).
