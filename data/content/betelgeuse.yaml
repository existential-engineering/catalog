details: |-
  Betelgeuse is a collection of malevolent, dramatic and damaged sounds. A well
  balanced blend of organic and synth sounds specially designed for widescreen
  scores.

  Betelgeuse is the darkest collection for zebra2 at zensound, inspired by the
  music of ben frost (dark), hildur gudnadottir (chernobyl), kyle dixon and
  michael stein (stranger things), betelgeuse also uses pitch shifting
  techniques to bring that slightly unstable and drifting analogue feel.

  Blood pounding basses and basslines, suspenseful percussion loops, dramatic
  leads and pads, deep infernal soundscapes, dynamic and intriguing emotive
  sequences, sinister keys and mallets going out of tune, an amalgam of bizarre
  noises infused with tension and drama which are a delight for cinematic
  compositions.
