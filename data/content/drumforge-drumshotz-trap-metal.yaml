details: |-
  Drumshotz Trap Metal is a collection of mix-ready one-shot drum samples designed to add texture and flavor to your songs. Inspired by the innovative approach of the Trap Metal genre, this pack features 126 samples perfect for cross-genre sound design. Lay the foundation for chart-topping beats, or enhance the textures of your metal productions with ease.

  The pack includes 808 bass samples, melodic guitar loops, FX/atmosphere samples, hats, snares, kicks, rims, and claps — all delivered in 48kHz, 24-bit WAV format and compatible with any DAW or triggering program.

  Includes instant digital download, perpetual license, free lifetime updates, and unlimited customer support.
specs: |-
  - 126 samples total
  - 48kHz, 24-bit WAV format
  - 37 808 bass samples
  - 18 melodic guitar loops
  - 22 FX/atmosphere samples
  - 15 hat samples
  - 11 snare samples
  - 10 kick samples
  - 7 rim samples
  - 6 clap samples
  - Compatible with any DAW or triggering program
  - Perpetual license
  - Free lifetime updates
  - Instant digital download
