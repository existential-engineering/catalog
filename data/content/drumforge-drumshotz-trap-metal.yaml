description: A 126-sample collection inspired by the Trap Metal genre, combining 808 bass, kicks, snares, hats, rims, claps, FX and atmospheres with melodic guitar loops.
details: |-
  The team at Drumforge assembled this collection of mix-ready one-shot drum samples to add texture and flavor to a song, taking its cue from the innovative approach of the Trap Metal genre.

  The pack is aimed at cross-genre sound design, whether laying the foundation for a beat or reinforcing the textures of a metal production. Alongside the drum one-shots it includes 808 bass samples, FX and atmosphere elements, and melodic guitar loops.

  Drumshotz is a series of drum samples meant to enhance, blend, or replace drum sounds in a mix, and these can be mixed and matched with existing sample libraries or raw drum recordings.
specs: |-
  - 126 samples total in 48kHz, 24-bit WAV format
  - For use with any triggering program or DAW
  - 37 808 bass samples
  - 6 claps
  - 15 hats
  - 10 kicks
  - 7 rims
  - 11 snares
  - 22 FX/atmosphere
  - 18 melodic guitar loops
