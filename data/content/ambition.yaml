details: |-
  A new lens for big picture sound. Ambition inspires new vistas of musical exploration, and you become the sonic pioneer. Explore a panoramic trail to undiscovered and timeless soundscapes, emotion filled pads, evolving textures, anamorphic rhythms, elemental keys, and experimental undertones.

  Advanced sound design. The key to ambition's drive is dexterity. Elegantly separate, swap, split, merge, detach or bypass any effect or lfo from channel to channel. Complex and multidimensional, this interplay between channels produces extraordinary and expressive harmonic elements.

  Full fx modulation. Discover your own signature/big picture sound with reactive lfos, eq, compression, distortion, lo-fi, saturation, chorus, delay and 25 custom ir reverbs.

  Performance x/y pads. Add even more vivid colors and tonal dimensions with sculpt, breath and echoes, ambition's distinctive x-y control performance effects.

  Ambition is a virtual instrument audio plugin and a software application and soundware for macos and windows. It includes, and is therefore powered by, kontakt player, which functions as an audio units plugin, a VST 3 plugin, an AAX plugin and a standalone application.
specs: |-
  - Sample based synth
  - Powered by Kontakt player
  - Powerful sample synth engine
  - Complete a/b synth capabilities
  - Full-featured LFOs per channel
  - Per channel ADSR envelopes
  - 8 per channel effects
  - Reactive LFOs
  - EQ
  - Compression
  - Distortion
  - Lo-fi
  - Saturation
  - Chorus
  - Delay
  - 25 custom IR reverbs
  - Performance x/y pads
  - 3 powerful global performance effects
  - 1 master nki template
  - 31 multi presets
  - 252 sample sources
  - 221 snapshots
  - 3,351 high quality chromatic samples
  - 30,000+ sample combinations
  - 5.1 GB compressed lossless samples
  - 25 custom sampled impulse responses
  - Kontakt 6 version 6.2.2 or later
  - Includes Kontakt 6 player
  - Native Instruments NKS ready
  - Komplete kontrol integration
  - Maschine integration
  - Komplete s-series keyboards compatible
  - Works with Ableton, logic, Pro Tools, Cubase
