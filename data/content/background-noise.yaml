details: |-
  Background Noise or ambient sounds we mostly don't pay attention to it but
  still it's surrounding us, at home, at work ...everywhere. It can be natural,
  artificial, pleasant or less pleasant. Sometimes even called "noise
  pollution". In "Background Noise" ofs sound pack we tried to make it almost
  like "relaxing sounds".

  Content includes: birds noise, cricket noise, fan noise, fridge noise, talking
  people noise, police siren noise, rain noise, sea waves noise, street noise,
  thunder and wind noise, water stream noise.

  All sounds are in high quality wav format and free for commercial and
  non-commercial use.
