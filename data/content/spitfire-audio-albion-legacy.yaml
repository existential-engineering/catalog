details: |-
  Out of the box composer tools created for film scoring — a collection of orchestral ensembles featuring strings, brass, woodwind and percussion as well as loops, synths and atmospheres, all captured at AIR Studios, Lyndhurst Hall. This classic Spitfire library is full of character, providing users a cinematic orchestral palette for composers to sketch large, epic‑sounding, Hollywood‑style film scores.

  Captured in 2011, this sample library was Spitfire's maiden Albion product, which kick started the whole range of Albions, a selection of all-in-one products of cinematic inspiration. More from the Albions range.
specs: |-
  - 4 microphone signals (Close, Tree, Ambient, Outrigger)
  - Darwin Percussion: 4 round robins, 4 dynamic layers and 3 microphone positions
  - Recorded to 2-inch tape at AIR Studios, Lyndhurst Hall
  - Includes the Ostinatum pattern sequencer
