details: |-
  Beyond Dreams is a soundset with 100 patches for Zebra 2 from u-he. The
  soundset is aiming for composers and producers working in the film, game and
  library music industry, though of course it can be used in any other
  production.

  The overall tone of beyond dreams is slightly dark and a lot of patches have a
  gritty distorted feeling. Beside that there are also some fun and weird fx
  patches included. The sequence patches are a bit lighter in tone.

  Categories included are arps, bass, bass loops, fx, leads, pads, ky (key and
  plucked), soundscapes, percussion and the earlier mentioned sequences.

  All patches have been programmed to be used with the modwheel. The pitchweel
  is also a major player in most of the patches with having effects programmed
  to it. The 4 xy pads add some extra dimension and functionality to the
  patches.
specs: |-
  - 100 patches for Zebra 2

  - Modwheel programming

  - Pitchwheel effects programming

  - 4 xy pads

  - Patch categories: arps, bass, bass loops, fx, leads, pads, ky (key and
  plucked), soundscapes, percussion, sequences
