details: |-
  Bass Elements by Muze is a collection of analog and digital bass for music,
  sound design and cinematic composition.

  Bass elements contains more than 1400 bass sounds divided into categories:
  house, hip-hop, edm, techno & more. There are a total of 1440 source sounds to
  explore, transform, combine, and create your own bass.

  Each preset has two layers with the ability to mix from 2 to 144 sounds
  simultaneously. A flexible user interface allows you to control all aspects of
  the sound.

  Free version: 144 bass sounds and 2592 samples. 2 gb size on disk. The full
  version of kontakt 5.6 or above is required. Not compatible with kontakt
  player.
specs: |-
  - Kontakt 5.6 or above required

  - 25920 samples (compressed)

  - 28 gb size on disk

  - 1440 source sounds

  - Two layers per preset

  - Ability to mix 2 to 144 sounds simultaneously

  - Mac minimum: 8gb ram, mac os x 10.7 or later, 7200 rpm or faster hdd

  - Mac recommended: 16gb ram or more, mac os x 10.7 or later, ssd

  - Pc minimum: 8gb ram, windows 7 or later, sound card with asio drivers, 7200
  rpm or faster hdd

  - Pc recommended: 16gb ram, windows 7 or later, sound card with asio drivers,
  ssd

  - Not compatible with kontakt player
