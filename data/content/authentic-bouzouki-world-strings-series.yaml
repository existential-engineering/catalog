details: |-
  The bouzouki evolved from a six-string instrument to eight strings in the
  latter half of the 20th century and is still widely played in greek folk
  music.

  The bouzouki has become increasingly popular in contemporary american folk and
  progressive bluegrass music.

  While the soundscape of this bundle carries a strong classical signature, the
  sets of both traditional and contemporary phrases allows full flexibility for
  easily incorporating the samples into any composition.

  Genre: world, ethnic, cinematic
