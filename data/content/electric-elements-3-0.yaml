description: Electric elements 3 - the latest offspring of audio boutique's
  successful series of sample libraries.
details: |-
  Electric elements 3 is the latest offspring of audio boutique's successful
  series of sample libraries. Once again, producers ramon zenker and harald
  ("harada") aufmuth prove that they can be ranked among the top-producers of
  contemporary club sound.

  This latest episode of electric elements is dedicated towards the production
  of techhouse, minimal and electro house tracks, surrendering any kind of
  superfluous clichés. This library offers unusual fx, up- and downlifters,
  drum- and hi-hat-loops, basslines as well as atmospheric backgrounds - fully
  up-to-date and totally fresh.

  All loops and fx sounds were produced at 127 bpm. The use of standard formats
  wav, apple loops and rex allows simple drag and drop usage and free
  combination in your preferred DAW. In addition, the sounds are available in
  kontakt and exs format.

  Features include: 20 atmospheric sounds, 40 bass loops, 30 hi-hat loops, 100
  mixed loops (partially with bass drum), 33 one-shot-effects, 20 down lifters,
  and 10 up lifters.
specs: |-
  - 24-bit wavs
  - Apple loops
  - Rex (stylus ready)
  - Exs24 patches
  - Kontakt patches
  - 127 bpm
  - 805 MB total content
