  DRM1 MKIII analog drum machine.
details: |-
  Descriptions

  Digital Download Only. The Layers Kit is a painstakingly and carefully crafted kit full of huge analog one-shot drums. The drums are arranged on an MPC program across 32 pads. Each pad has 4 different samples with similar characteristics assigned to the 4 layers of each pad. When played, the pads cycle through each sound with each tap of the pad allowing for a very dynamic drum programming experience. The drums were crafted using several secret sauce pedals and the modern classic and not so easy to come by Vermona DRM1 MKIII analog drum machine. All drums were processed with a bit of hardware tape saturation for that extra bit of warmth and normalized to -3db allowing a bit of headroom for your own additional processing. The included expansion for MPC is dope as it will install into the MPC and show up like a contained product of samples and open as a kit to be used in any project. Ableton Live users can enjoy this kit too as we've included an Ableton drum rack formatted to cycle through 4 layers per pad as well. Enjoy!
specs: |-
  - 128 one-shot samples - kicks, snares, hats, toms, and misc percussion samples arranged in layers across 32 pads.
  - Format: 16bit / 44.1khz - WAV
  - Compatibility: Akai Force, MPC X, MPC Live, MPC One, MPC Software, Ableton Live, and All DAWS or machines that accept wave files.
  - includes MPC expansion
  - includes Ableton drum rack formatted with cycling layers.
  - License: Royalty-Free
  - Delivery: Download instantly after purchase.
