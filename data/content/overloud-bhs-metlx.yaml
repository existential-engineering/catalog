details: |-
  Bhs Metlx is the th-u expansion library, signed by big hairy sounds, seeking
  to recreate the tones of 80's and 90's guitar legends based on metaltronix
  gp-1000, sp-1000 rack preamp and powers amps, as well as the m-1000
  amplifiers.

  The metaltronix gp-1000 is one of the original single channel high gain
  preamps originating from the sunset strip, used extensively in original rack
  setups and continued to be used by metal masters for its tight gain and
  signature mid-range.

  The metaltronix m-1000 two channel head was the secret weapon of rock and
  metal gods during the late 80's, representing a loud and high gain evolution
  of the modded british heads that were used by many famous guitarists.

  The bhs metlx library adds a brand new modulation rack effect into th-u. The
  symphonic 90 effect reproduces the unique '80s and '90s chorusing effect that
  was only available in specific rack effect devices, essential for recreating
  yamaha-style symphonic modulation.

  The library contains 70 rigs and includes 31 patches focused on recreating the
  famous 80's and 90's hard rock and metal guitar tones.
specs: |-
  - 70 rigs
  - 31 patches
  - Symphonic 90 effect
  - Metaltronix gp-1000 preamp
  - Metaltronix sp-1000 power amp
  - Metaltronix m-1000 amplifier
  - Marshall jcm800
  - Marshall silver jubilee
  - 80's and 90's hard rock and metal guitar tones
  - Yamaha-style symphonic modulation
  - Th-u expansion library
