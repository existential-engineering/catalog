description: Barefoot & sandals is an expansion pack for edward ultimate suite.
details: |-
  Foley artist: lara dale. Foley recordist: josh reinhardt.

  The expansion pack includes 14,800 additional foley sounds in high quality @
  24-bit, 48 khz with 27 new combinations of shoes and surfaces.

  Surface types include clean concrete, sand, mud, and leaves. Footwear types
  include barefoot and sandals.

  Performances include extremely slow walk, medium slow walk, walk, jog, run,
  stairs slow, stairs fast, stomp, land, scuff, scrape 1, scrape 2, and scrape
  3.
