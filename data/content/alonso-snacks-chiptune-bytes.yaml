details: >-
  Chiptune bytes vol. 1 is a collection of 83 vintage presets of the 80s/90s
  game era. Recreate the retro arcade experience and bring the nostalgic element
  of classic gaming into your music.


  Each preset has modwheels assigned to give you more control shaping your
  sound. Additionally, each preset for serum and spire have all 4 macros
  programmed, to make it easier than ever to modulate your sound out-of-the-box.


  Chiptune bytes vol. 1 is the perfect tool for any producer looking for
  inspirational chiptune emulations.
specs: |-
  - 83 vintage presets
  - 80s/90s game era
  - Modwheel assignments
  - 4 macros programmed
  - Presets for serum
  - Presets for spire
  - Presets for sylenth1
