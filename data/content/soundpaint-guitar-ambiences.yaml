details: |-
  Epic Guitar Soundscapes

  Guitar Ambiences is a meticulously curated collection of sounds derived from diverse guitars, showcasing live performances with real-time effects and minimal post-production processing. The library encompasses drones, phrases, and multi-samples, placing a unique emphasis on the ambient and unexplored dimensions of the instrument. Moving beyond conventional guitar techniques, it delves into a dreamy, synth-like realm of rarely heard droning beauty, offering a sonic spectrum from intense rage to soothing harmony. Setting itself apart from typical guitar libraries, Guitar Ambiences features bonus minimalist phrases inspired by a post-apocalyptic atmosphere. These phrases, while maintaining an ambient character, seamlessly complement the purely ambient patches. For those desiring to craft their melodies, the library includes multi-sampled bass and guitar notes, providing a broad range of standard plucked tones. Organized into five emotional categories (Awe, Horror, Mystery, Rage, Sadness), the collection, with its combination of phrases and multi-samples, offers a distinctive and immersive musical experience that redefines traditional expectations of guitar libraries. Now, all of this emotion is completely smooth and seamless in the Soundpaint engine.
