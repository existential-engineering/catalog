details: |-
  The Futurism Library by Krotos is a unique 3.2 GB collection of high-end futuristic sound effects, designed to bring the sonic characteristics of strange new worlds and dystopian futures to a post-production, trailer sound design, or game-audio project.

  From spaceship maneuvers and electromagnetic servos to droid passbys, the Futurism Library consists of a range of 1,103 synthesised and recorded materials including emotive whooshes, slow drones, impacts, and liquid textures.

  Futurism is a large sound library combined with presets ready to use directly in a DAW. The library goes beyond designed assets and is built to help find inspiration and discover new sounds quickly.

  Sound categories included are Futuristic, Retro, Sci-Fi and Ambient. Keywords cover ambient, beeps, drones, drops, electricity, electromagnetic, feedback, futuristic, impacts, laser, liquid, metallic, modulation, passbys, retro, sci-fi, suction, sweeteners, synth and whooshes.
specs: |-
  - 1,103 sound files
  - 3.2 GB size
  - 24-bit / 192 kHz and 24-bit / 96 kHz high-quality WAV files
  - 100% royalty-free commercial license
  - Embedded metadata
