details: |-
  The skins are all remo pinstripes on the tops and emperor clears on the
  bottoms, for that classic steve gadd 70s sound.

  All tuned to perfection and mic'ed up at livingston studios using their
  incredible gear list, including a pair of valve neumann u67s, plus u87s, d19s,
  421s and everything you'd ever expect around a kit designed to deliver that
  super-smooth, clean and meticulous sound that we all know and love from the
  likes of steve gadd, bernard purdie, jim keltner, jeff porcaro, andy newmark
  and other such 70s greats.

  Tight drums, plenty of reverb and perfectly balanced levels deliver a drum
  sound worthy of any 70s session superstar.
