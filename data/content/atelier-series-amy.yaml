description: Atelier Series Amy is a legato vocal release intended for emotional
  and cinematic contexts.
details: |-
  We've included two extensively-recorded legato patches performed "long-style".
  This means there are no programmed crossfades into a target sustain after
  playback of the legato interval. This involves far more recording time (12
  hours in this case) than traditional legato sampling but ensures a seamless
  performance that also retains amy's natural progression in vibrato;
  musically-unique for every interval across the range.

  Also included is everlasting a collection of beautiful, vowel-evolving
  sustains processed with a variety of hardware pedals. Every sample ebbs and
  flows; each note unique in how they evolve and loop. This keyswitch suite
  includes six presets: beauty, tundra, celestial, elysium, the signal and
  creation.

  The product includes three patches: amy emotional legato ahh, amy emotional
  legato mmm, and everlasting keyswitch. Features include non-looped
  performances, legato transitions with sustains recorded "long-style", and
  includes beautiful evolving sustains keyswitch patch with adjustable reverb of
  custom hall impulse.

  Requires full retail version of kontakt 5.8.1 or higher. Free kontakt player
  not supported. Recorded in 48khz / 24-bit. 1.4 gb compressed ncw format.
specs: |-
  - Legato vocal sampling
  - Long-style legato patches
  - Vowel-evolving sustains
  - Hardware pedal processing
  - Keyswitch suite with six presets
  - Natural progressive vibrato
  - Non-looped performances
  - Adjustable reverb with custom hall impulse
  - Requires Kontakt 5.8.1 or higher
  - 48khz / 24-bit recording
  - 1.4 GB compressed ncw format
