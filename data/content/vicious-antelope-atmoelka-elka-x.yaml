name: AtmoElka - Elka-X
manufacturer: vicious-antelope
primaryCategory: preset-pack
url: https://www.viciousantelope.com/product-page/atmoelka-elka-x
description: Atmoelka contains 30 atmospheric synths for cherry audio elka-x
  synthesizer. They include synth pads, organs and synth choirs patches.
details: |-
  For most of them chorus and reverb plays an important role in the final sound.
  In some patches the lfo is assigned to filter cutoff. This may result the
  filter to close near to zero and cut the volume of the synth.

  If you need to change it just deselect the filt button in the lfo section
  (upper left device in the synth) or reducer depth b knob to zero. Also, in
  some patches a click may occur in the attack portion of the sound. It is a
  result of using a different than triangle shape for the lfo so the adjusted
  settings abruptly go to another value.

  If you need to get rid of the click sound change the lfo shape to triangle
  (lfo change will maybe have impact to other elements as well).

  Presets were designed with elka-x 1.4.0 (build 89) and run best with this or
  newer edition.
specs: |-
  - 30 atmospheric synths
  - Synth pads
  - Organs patches
  - Synth choirs patches
  - LFO assigned to filter cutoff
  - Chorus
  - Reverb
  - LFO section
  - Filt button
  - Depth b knob
  - LFO shape control
