details: |-
  Aquiver is a 4.1gb granular Kontakt instrument ideal for movie scoring,
  underscore and sound design. It comes with 1300 powerful, deep and soaring
  granular sounds.

  It is powered by a custom granular engine that can play hundreds of small
  grains of audio with no huge cpu impact.

  It features realtime recording of knob movements, a fx engine with
  bread-and-butter effects and a unique lock switch. Using that, you can skip
  through instruments while locking the current settings in place.

  Perfect for trying out different sounds without loosing current knob and/or
  effect settings. All the parameters of the effects section can be modulated in
  realtime with one knob as well.
specs: |-
  - 4.1gb granular Kontakt instrument
  - 1300 granular sounds
  - Custom granular engine
  - Realtime recording of knob movements
  - FX engine with effects
  - Lock switch
  - Realtime modulation of effects parameters
