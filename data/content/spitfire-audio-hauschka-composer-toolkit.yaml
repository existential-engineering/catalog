details: |-
  A collaboration with Oscar-winning, world-renowned composer and soundsmith Volker Bertelmann, aka Hauschka ( All Quiet on the Western Front, Lion , Adrift ), this multifaceted toolkit has been designed for adding incredible depth, tension and texture to your scores.

  Discover unique soundscapes ranging from industrial sounding percussive rhythms and thunderous bass lines to offbeat, atonal plucks and beautiful, shimmering pads. Performed on a Steinway grand with over 40 experimental preparations and expertly multi-sampled at Berlin's legendary Voxton Studios, we have bottled Hauschka's signature sound palette into a highly interactive and inspiring toolkit, ready for you to apply your own creative ideas.

  Presented in our sophisticated Evo Grid and Mercury synth, mix and match multiple signal options, from Pedal FX, Distorted, Modular to Binson Echorec tape delay, or choose from 50 curated presets made by the Spitfire team, for endless combinations of instantly playable sounds.
specs: |-
  - Performed on a heritage Steinway D grand piano
  - Over 40 experimental piano preparations
  - 50 curated presets
  - Approximately 16000 samples
  - Six sections, four of them presented in Evo Grids
  - Evo Grid uses an 11 x 12 grid across 12 intervals
  - Multiple signal options including Pedal FX, Distorted, Modular and Binson Echorec tape delay
  - Recorded at Vox Ton studios, Berlin
  - Kontakt Player included (free download)
  - Spitfire Audio App required
