description: A deep dive into the world of analog synthesis resampling, cut from
  two legendary analog synthesisers. From Euphoric to Dystopian, Cyberfunk
  covers a vast array of sonic ground, with Sweeping Soundscapes, Earthshaking
  Subs, Blissful Melodies, Moving Chord Sequences, Punchy Plucks, Piercing Arps,
  Huge Leads and Bass.
details: |-
  CYBERFUNK is the largest HALO Expansion Pack yet, featuring a whopping 200+ presets and 60 sample banks. A huge library of leads, strings, plucks, sequences, pads, chords, basses and subs lie within, oozing the character and fidelity of analog synthesis. These sounds have been created using two cutting edge hardware analog synthesisers and modern software processing, all run through Halo's unique processing and sequencers.

  All presets have been crafted using the full breadth of HALO 2's unique functionality. Using a range of hardware and software synthesisers, both digital and analogue sound sources and fx and processing all the sample banks were painstakingly put together to create the finest re-sampled audio for each expansion, and every expansion has its own unique character and qualities.

  Product requirements: HALO 2.0.3 (full version). It does not work with HALO LITE.
specs: |-
  - 200+ presets
  - 60 sample banks
  - Library of leads, pads, plucks, basses, stabs and subs
  - 22 arps / sequences
  - Requires HALO 2.0.3 (full version), does not work with HALO LITE
