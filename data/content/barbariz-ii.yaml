details: |-
  Barbariz II is a barrel organ created by Rossignol-Studio for Kontakt 5 by
  Native Instruments.

  All sounds of this organ are different from the first barbariz. A little rough
  and thus with its own identity.

  Like the first barbariz, each register can be mixed at will which offers a
  range of barrel organ sounds of varying colors.

  The samples are 24-bit 96khz. This instrument was created from a real organ of
  36 notes.

  The interface consists of six buttons: four for organ sounds (c1 to b1 bass
  range), three buttons for other sounds of four octaves (c2 to g5), a reverb
  button, and a final button for the controllable handle sound (g0 to a0 keys).
specs: |-
  - Kontakt 5 compatible
  - 24-bit 96khz samples
  - Six-button interface
  - Four organ sound buttons (c1 to b1 bass range)
  - Three sound buttons (c2 to g5 four octaves)
  - Reverb button
  - Controllable handle sound button (g0 to a0 keys)
  - Mixable registers
  - 36-note organ source
