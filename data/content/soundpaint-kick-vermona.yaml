details: |-
  Bring On The Bass

  Kick Vermon is an Ultra Deep-Sampled (UDS) Analog Drum instrument - featuring over 2700 Real-Time Samples. Recorded in both raw states and through a curated hardware chain of analog tubes, Moog filters, distortions and channel strips. This is not an emulation or a simulation, but instead completely like sitting in front of a real analog drum machine, a $48K hardware chain and with all the added benefits of the Soundpaint analog behavior. The Kick Lancet Vermona is a dedicated Hardware Analog Drum Synth instrument. It was designed to fulfill one single mission: to create the ultimate analog kick synth sound. The Soundpaint Kick Vermon accomplishes this mission and then some, with cutting-edge bass bumping drum machine synth sounds. It is ideal for professional analog and modular analog style pulse rhythms. If you need Bass, look no further.
