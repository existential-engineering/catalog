details: >-
  Ableton drum racks bundle for superior drummer 3 ezdrummer core libraries is a
  collection of the ezdrummer 2 library ready mapped and preconfigured with deep
  integration between ableton live and toontrack superior drummer 3. This bundle
  features over 60 ableton drum racks and over 30 ableton live routing templates
  configured for leading toontrack ezdrummer2 core libraries in superior drummer
  3.


  The bundle contains 3 timbresandtones drum rack products bundled for toontrack
  ezdrummer modern kit, vintage kit and cocktail kit. Ableton drum racks for
  superior drummer 3 modern kit includes 32 ableton drum racks individually
  mapped to all modern kit factory library content presets, with 16 predesigned
  ableton live templates to cater for the multi track audio routing of the
  ezdrummer modern kit presets in ableton live.


  Ableton drum racks for superior drummer 3 vintage kit includes 24 ableton drum
  racks individually mapped to all vintage kit factory content presets, with 12
  predesigned ableton live templates to cater for multi track audio output
  routing of the ezdrummer vintage kit presets in ableton live. Ableton drum
  racks for superior drummer 3 cocktail kit includes 10 ableton drum racks
  individually mapped to all vintage kit factory content presets, with 5
  predesigned ableton live templates to cater for multi track audio output
  routing of the ezdrummer cocktail kit presets in ableton live.


  Performance key features and workflow include amazing workflow in ableton and
  on your push to the full capabilities of the kit library saving setup time and
  allowing you to focus on music creation. Ease of navigation to load all
  ezdrummer factory presets from ableton push controller device browser. 66
  ableton drum racks to instantly load the factory library "mix ready" presets
  with ableton mappings. 33 ableton live templates for prebuilt multi track
  audio routing to each ezx expansion.


  Audio routing options include singleout presets featuring 26 ableton drum
  racks for all factory presets single audio output to single ableton track, and
  multiout presets featuring 26 ableton drum racks for all presets in multiple
  audio channel output from the plug in to multiple ableton audio tracks using
  the multi output ableton template also provided. Colour coded pad design for
  visual performance and finger drumming. Individually labelled drum rack pads
  for clear visualisation, post performance editing and automation to all drum
  rack / instrument articulations.
