description: Sample pack for ignite. Kick back and relax. Prime loops are
  extremely proud to announce this ultimate collection of mind-bending ambient
  samples.
details: |-
  Ambient illusions for ignite is a sample pack featuring an ultimate collection of mind-bending ambient and chill-out instrumental loops. Inside this extraordinary sample pack you will find an addictive blend of over 120 unreal ambient textures, hypnotic arpeggio patterns, mesmerizing chord progressions, intricately crafted sound effects and beautifully sculptured wall-of-sound atmospheres, ranging between 65 and 140 bpm.

  All of the loops in this lush sounding sample pack are presented in crystal clear 24-bit audio - and only the best hardware gear has been brought together for its production: amongst other instruments, prime loops' resident producer dimitry vasilyev has employed the use of legendary synths such as the roland alpha juno, roland juno-106, roland mks-10, polyvox, korg mono/poly korg poly-800, resulting in an extremely distinctive sound, full of analogue warmth, definition and character.

  Inspiration for this pack has been provided not only by the works of pioneering ambient artists such as brian eno, tangerine dream or jean michel jarre but also from the balearic flavoured easy listening sound of best selling chill-out collections such as caf del mar or buddah bar.

  Jam-packed with an endless stream of uplifting sonic adventures this inspiring sample pack will make the perfect song-writing partner for all your future writing, programming and recording sessions.
