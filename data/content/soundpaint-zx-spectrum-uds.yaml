details: |-
  Full Spectrum Chiptune

  Did you know that some of the earliest chiptune synths were not 8-bit, but had an even grittier 1-bit sound? The ZX Spectrum line of personal computers was first released back in 1982 and they supported a 1-bit audio system across their eight different models. We were fortunate enough to sample this entire series of computers in collaboration with UK-based expert, Andy Jenkinson. Andy has the largest "living" collection of Spectrum computers around, and is the leading authority on deep-sampling these classic chiptune instruments. And when we say deep-sampled, we mean deep ... We even captured the wonderfully robotic Currah 1-bit text-to-speech voice synthesis peripheral, featuring over 1000 spoken words and phrases. Andy and Troels worked for over 18 months to sample this very special and comprehensive collection in the deepest, most realistic, and highest fidelity possible. The end result is an encyclopedic Ultra Deep-Sampled chiptune compendium that doesn't emulate, but instead offers you the actual sonic output, direct from the ultra-rare vintage units themselves.
