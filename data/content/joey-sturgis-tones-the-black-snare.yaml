details: |-
  The Black Snare is a one-shot snare sample as heard on Asking Alexandria's fourth studio album, The Black, released on Sumerian Records.

  The Black was produced, mixed, and mastered by Joey Sturgis and features songs like "I Won't Give In", "Undivided", "The Black", "Let It Sleep", and "Here I Am". It peaked at #1 on the Billboard US Top Rock Albums chart and #9 on the US Billboard 200.

  Achieve the same pulverizing drum sounds in your sessions by adding this snare to the mix. It works great layered in with your existing snare for a powerful punch, or as a replacement for thin, weak snare drum recordings.

  What's a one-shot sample? A one-shot sample is a short audio recording of a single drum hit or sound, typically lasting for a very brief duration. One-shot drum samples are most commonly used to supplement live-tracked drums (a process called layering) for added clarity and punch. They can also be used with sample replacement tools to replace drum hits in live-recorded drums. While one-shot drum samples can be used for programming drum parts, it's usually recommended to use full sample packs that contain alternate hits and various velocities for more realistic sounding results than one-shot samples can provide on their own.
