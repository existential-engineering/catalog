details: |-
  Atomos is a collection of 100 patches for spectrasonics Omnisphere 2. These
  patches focus on the darker side of cinematic scoring, taking inspiration from
  the incredible score for hit tv show chernobyl.

  With an emphasis on omnisphere's vast range of organic sound sources, atomos
  creates dramatic and powerful patches from the unexpected.

  From gritty sequences and eerie pads, to unusual textures and impactful
  percussion, atomos will add a unique and distinctive concrete-style character
  to your compositions.
