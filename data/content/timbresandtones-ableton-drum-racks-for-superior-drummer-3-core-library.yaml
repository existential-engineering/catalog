details: |-
  Ableton Drum Racks for Superior Drummer 3 Core Library features separate
  Ableton drum racks for all factory presets for the toontrack superior drummer
  3 core library. These racks provide out of the box integration workflow
  between Ableton live and toontrack superior drummer 3 including a host of
  features ready to use for composition and performance using Ableton push or
  similar controllers.

  All factory presets are ready to go in this massive library that covers kits
  for all genres: pop, rock, soul, funk, country, heavy rock, reggae, metal.

  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all sd3 core library factory presets from ableton
  push controller device browser.

  Colour coded pad design for visual performance and finger drumming. All our
  racks use consistent drum rack colouring so you can visually and immediately
  spot your rides from your hi hat articulations.

  Use the template racks and extend to your own toontrack superior drummer 3
  core library presets, swapping out individual sounds or articulations. You are
  100% ready to go with the factory presets but there is no limitation to
  creating your own presets from these templates.
specs: |-
  - 402 Ableton drum racks

  - 201 ableton live templates

  - Multi-channel output routing

  - Single audio output option

  - Ableton push 64 pad layout mode

  - Colour coded pad design

  - Individually labelled drum rack pads

  - Ableton macros mapped to toontrack superior drummer macros

  - Audio routing and mixing

  - Ease of navigation to load sd3 core library factory presets from ableton
  push controller device browser

  - Vast array of instrument articulations

  - Track level audio routing

  - Multiout presets with multiple audio channel output

  - Singleout presets with single audio output
