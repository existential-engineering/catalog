details: |-
  Aevium is a powerfully unique collection of fierce lead synths and atmospheric pads, developed in partnership with the premier sound effects and foley production house boom library, sound designed by our team using only source sounds from their birds of prey avian sound effect library as our point of origin.

  To build aevium, we selected a wide variety of raw source sounds from birds of prey and worked for months to warp, stretch, modulate, glitch, overdrive, and generally tear into to bits and bytes and re-synthesize them into a stunning sample-based virtual instrument library. We've hand-crafted 11gb of sound-designed content, with over 1800 samples.

  The preset browser tree makes it easy to explore and create! Everything is conveniently organized into a variety of helpful and efficiently searchable musical, textural and aesthetic categories.

  The user interface is built on our popular oroboros ambient synthesis engine (ambius prime, quadral), so the creative possibilities are truly limitless.

  Whether you're looking for classic punchy lead patches, warm fuzzy pads, dark drones, bubbling atmospherics, otherworldly textures or just pure flights of imagination, aevium is your wing man.
specs: |-
  - Sample-based virtual instrument library

  - 4-layer morphing engine

  - Xy pad mixer

  - Randomize capabilities

  - 1,810 stereo 24-bit 48khz pcm wav samples

  - 11.2 gb installed

  - Custom preset import and export

  - Intelligent random preset generator

  - Multi-layer user interface controls

  - Lfo

  - Filter

  - Glide

  - Arpeggiator

  - Full fx rack

  - Convolution reverb with custom rooms, halls, chambers & fx environments

  - One master nki instrument bank in open kontakt format

  - Over 20 categories of sample based synth sustains, staccatos, basses, leads, and fx

  - Over 400 factory presets

  - Windows 7 or higher

  - Dual core cpu

  - 2 gb system ram

  - Sata or ssd hard drive recommended

  - Mac os x 10.9 or higher
