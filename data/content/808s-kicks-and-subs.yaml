  New Loops presents 808s a collection of hard hitting 808 subs and kicks with
  real depth. There's a total of 130 kicks including 90 key-labelled kicks
  ranging from long, smooth 808 bass, to hard distorted subs. You'll also find
  40 analogue kick thuds with real low-mid punch, perfect for hip hop and trap
  beats.

  These kicks are suitable for hip hop, trap, pop, future bass, garage, drill,
  dubstep, edm, drum and bass, and any other styles where 808 kicks are
  required.

