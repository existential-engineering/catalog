details: |-
  Taylor Young is an American producer, engineer, mixer and musician who works out of his studio The Pit in Van Nuys, CA. He is best known for working with extreme underground acts including Nails, Drain, God's Hate, Kruelty, Vitriol, ACxDC, Soul Search, Vamachara, Downpresser, Regional Justice Center and Dead Heat, as well as his own bands Twitching Tongues and ZOUS.

  Built from Taylor's unique collection of gear, this is an extensive pack of guitar and bass tones.

  Taylor's pack contains 30 guitar captures and 16 bass captures.
