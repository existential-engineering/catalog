url: https://www.bfddrums.com/expansions/modern-retro.html
description: BFD Modern Retro is an expansion pack for bfd3, bfd eco and bfd2
  with a pair of kits that helped define the sound of the 90s and early 2000s.
details: |-
  The expansion pack includes 2 kits designed for 90s and early 2000s sounds
  with hihats and cymbals included, 2 sets of overheads and room mics, sticks,
  hotrods and brushes, plastic and felt kick beaters, and up to 300 samples per
  articulation for kicks and snares.

  Bfd modern retro is soundware (samples or presets that load into other
  products) for macos and windows with system requirements of windows 7 or
  higher for windows and os x 10.6.8 or higher for mac, requiring bfd3 and an
  internet connection for download and authorization.
specs: |-
  - Expansion pack for bfd3, bfd2 and bfd eco

  - 2 kits designed for 90s and early 2000s sounds

  - Varied mic channels

  - Multiple beater types

  - Hihats and cymbals included

  - 2 sets of overheads and room mics

  - Sticks, hotrods and brushes

  - Plastic and felt kick beaters

  - Up to 300 samples per articulation for kicks and snares

  - Windows 7 or higher

  - Os x 10.6.8 or higher

  - Internet connection for download and authorization

  - Disk space requirements: 15 gb for full install, 7.5 gb for medium install,
  5 gb for small install
