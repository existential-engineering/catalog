details: >-
  Alice 1387 synth sample library is a collection of sounds & melodies sequences
  performed at vintage analog synthesizer alice 1387 made in ussr.


  This library represents collection of sounds, effects and loops in different
  tempo, good for dance music. Library contains 3 hours of sounds.


  It contains non edited lines and melodies played live in 126 127 128 130 132
  and 133 bpm. It also have 40 min of non-edited analog effects and sounds that
  will suite well for your sampler.


  Files are 16-bit 44100 wav samples - 1 gb in total.
