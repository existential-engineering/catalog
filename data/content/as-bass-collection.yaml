details: |-
  As bass collection is a bundle of 6 bass instruments: jbass, the upright, bassysm-j, bassysm-s, bassysm-m, and bassysm-f. The bundle offers up to 50% savings when purchasing together.

  Jbass is a four strings american fender custom shop jazz bass with flatwound strings. The sound of the fender jazz bass has been fundamental in the development of signature sounds in certain musical genres, such as funk, disco, reggae, blues, heavy metal and jazz fusion and is now used in almost any genre.

  The upright is chinese 4/4 four strings upright bass (double bass) recorded from three microphone perspectives, a pair of overheads, one next to the f-hole and the pickup. These three microphones perspectives allow you to shape the sound to give it more bass, roundness or detail (finger noises).

  Bassysm-j is a four strings musicman stingray bass with roundwound strings played with the fingers. Bassysm-s is a four strings musicman stingray bass with roundwound strings in the slapped version. Bassysm-m is a four strings musicman stingray bass with roundwound strings played muted. Bassysm-f fretless bass is a five string ibanez bass with roundwound strings.

  Jbass contains 1.72gb uncompressed (751mb compressed in lossless flac format) with around 2500 samples. The upright contains 2.54gb uncompressed (987mb compressed in lossless flac format) with around 2772 samples. Bassysm-j contains 1.42gb uncompressed (757mb compressed in lossless flac format) with around 1160 samples. Bassysm-s contains 1.52gb uncompressed (703mb compressed in lossless flac format) with around 2152 samples. Bassysm-m contains 260mb uncompressed (151mb compressed in lossless flac format) with around 855 samples. Bassysm-f contains 698mb uncompressed (180mb compressed in lossless flac format) with around 858 samples.
