details: |-
  128 presets from the hardware synth has been sampled down with extreme
  precision @ 44100hz / 24-bit depth. Multisampled sounds with filter & envelope
  settings cloned from the virus so now you can get the authentic sound for your
  favorite software sampler and start playing immediately.

  This is for everyone who is interested about the virus soundset, but don't own
  the access virus hardware or the powercore / tdm plugins.

  Compatible samplers: native instruments kontakt. Apple logic exs24.
  Propellerhead reason nn-xt.

  The package is all together somewhere between 1.4gb so make sure you have some
  time to download it as I'm not shipping any dvds.

  I decided to sample this soundset down, as when I'm off from the studio, I
  still have the possibility to use these sounds with my laptop and it's own
  software sampler.
