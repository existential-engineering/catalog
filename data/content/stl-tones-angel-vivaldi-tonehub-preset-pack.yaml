details: |-
  Angel Vivaldi is an American instrumental guitarist, composer and producer from New Jersey, known for his virtuoso playing style and cinematic music videos. He has self-released five records including Revelations , The Speed of Dark , Universal Language , Away With Words: Part 1 and Synapse , and has toured extensively as a headliner across North America.

  Created by Angel and the STL Tones team at Backroom Studios in New Jersey, this signature pack captures Vivaldi's guitar tones.

  Angel's pack contains 25 captures.
