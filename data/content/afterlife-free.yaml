details: |-
  Afterlife Free is the free version of the Kontakt library afterlife, featuring 1.06 GB of sample content and 100 patches hand-picked from its big brother. The library content covers a wide scope of different genres (cinematic, ambient, dnb etc.), but its goal is not to provide bread and butter sounds for modern genres, instead the focus is to bring unusual and unexpected sounds to give extra spice to your compositions.

  Distorted synth brass from dystopian lands, surrealistic drones from your weirdest nightmares, ethereal pads full of enlightenment and morphed acoustics that sound both natural and otherworldly, all in the same library.

  Tweak the sounds fast and easy using the simple interface that provides a filter, amp envelope, 4 band eq, arpeggiator and 4 custom fx buttons. These buttons offer easy tweaking of all patches, just with a one or two clicks.
specs: |-
  - 1.06 GB sample content
  - 100 patches
  - Filter
  - Amp envelope
  - 4 band EQ
  - Arpeggiator
  - 4 custom FX buttons
  - Kontakt library
