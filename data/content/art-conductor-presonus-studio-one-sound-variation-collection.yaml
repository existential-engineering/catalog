details: |-
  Put a better structure to your orchestra libraries and master articulations
  and expression with ease. Sound variations are a great invention but most
  people shy away from typing in hundreds of names and figures to control their
  virtual orchestra. That's why we've decided to release the most complete
  collection of studio one sound variations in this galaxy ... You get over
  12000 variations.

  All expression maps are setup in the same way. Use one and know them all. We
  utilise the same abbreviations and wording across the entire collection. The
  expressions are listed in alphabetical order and the key switches follow the
  natural order within the instruments.

  The most important switches are on the lowest octave, always in the same
  order. This way you find the right expression fast and control it with ease.
  We've done everything to enable you to focus on your music instead of
  technicalities.

  We are constantly adding new libraries to our collection and supply free
  updates to you.
