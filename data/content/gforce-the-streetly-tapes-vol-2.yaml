details: |-
  Curated from the original Streetly Electronic tape archives, Volume 2 combines a mixture of rare gems and definitive versions of celebrated, legendary and renowned tones, designed to breathe life into your compositions 8 seconds at a time.

  This add-on pack contains 24 carefully curated tape banks from the original UK 'Tron masters for M-Tron Pro. Those are derived from original EMI tape-stock. The pack also includes 100+ patches, many from luminaries including Jem Godfrey (Frost), Dave Spiers and Tony Durkin.

  The Streetly Tapes Vol 2 Expansion Pack is only available to registered users of M-Tron Pro. Additionally, it is exclusively available via this website as a direct download (600MB) via “My Instruments” when the purchase has been completed.
specs: |-
  - A GForce Software and Streetly Electronics collaboration
  - Tape banks from the original UK 'Tron masters
  - Derived from original EMI tape-stock
  - 100+ patches, many from luminaries including Jem Godfrey (Frost), Dave Spiers and Tony Durkin
  - 24 carefully curated sounds for M-Tron Pro
  - 35 notes per tape bank
  - Exclusively available via download – 600MB
  - Requires a registered copy of M-Tron Pro
