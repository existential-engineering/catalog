details: |-
  The Streetly Tapes Vol 2 is a collaboration between GForce Software and Streetly Electronics, featuring rare gems and definitive versions of celebrated Mellotron tones drawn from original UK masters and EMI tape-stock archives. The 24 tape banks were curated by Martin Smith and include 100+ patches contributed by luminaries including Jem Godfrey (Frost*), Dave Spiers, and Tony Durkin.

  Tape banks: Combined Choir, Cor Anglais, Cymbals & Marimba, 12 Violins, Fairlight Arr, Fairlight Sax, Italian Accordion, Lowrey Thru Leslie, M300B Violins, M400 Vibes, Male Choir, Medieval Woodwind, Miller Brass, Moog Trumpet, Oboe, Orchestra, Pinder Smooth Organ, Rhodes, String Section No Cello, Ted Taylor Choir, MKII Violins, Trombone, Two Trombones & Trumpets, Viola.
