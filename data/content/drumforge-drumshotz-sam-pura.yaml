description: A 106-sample one-shot drum collection from producer and mixer Sam Pura, with direct and matching ambient microphone samples for five kicks and five snares plus bonus State Champs hits.
details: |-
  Producer and mixer Sam Pura assembled this collection of mix-ready one-shot drum samples to add power and punch to a mix. It puts the drum sounds from his records with artists such as The Story So Far, State Champs, Hundredth, The Dangerous Summer, and SpiritWorld directly into a production.

  Drumshotz is a series of drum samples sourced from professional mixers, meant to enhance, blend, or replace drum sounds in a mix. One-shot samples give the extra punch and consistency needed to cut through, which is how a mixer achieves a signature drum sound regardless of the quality of the source recording.

  Each of the five kick drums and five snare drums comes with both a direct sample and a matching ambient microphone sample, so the room character can be blended in to taste. Two-piece and three-piece tom sets round out the collection, along with bonus kick and snare samples from State Champs.
specs: |-
  - One Shot signature sample collection from producer Sam Pura.
  - 106 samples total in 44.1 kHz, 24 bit format.
  - Bonus kick and snare samples from State Champs
  - For use with any triggering program or DAW
  - 5 kick drums that include direct and matching ambient microphone samples.
  - 5 snare drums that include direct and matching ambient microphone samples.
  - A two-piece and three-piece tom set.
