description: A one-shot drum sample collection from producer/mixer Sam Pura featuring 106 mix-ready samples at 44.1 kHz, 24-bit. The pack includes kick, snare, and tom samples with direct and ambient microphone recordings, plus bonus samples from State Champs.
details: |-
  Drumshotz Sam Pura is a signature one-shot drum sample pack from producer and mixer Sam Pura, designed to inject punch, impact, and power into drum mixes. The collection contains 106 samples recorded at 44.1 kHz in 24-bit format, making them drop-in ready for professional mixing and production workflows.

  The pack features 5 kick drums and 5 snare drums, each captured with both direct and matching ambient microphone samples, giving mixers flexibility to blend the two signals for depth and natural room character. A two-piece and three-piece tom set round out the kit selection.

  As a bonus, the pack includes kick and snare samples from State Champs — one of the bands Sam Pura is best known for working with — offering an additional flavour from a real-world professional session.

  Sam Pura has built his reputation working with artists such as The Story So Far, State Champs, Hundredth, The Dangerous Summer, and SpiritWorld. The samples are compatible with any DAW or drum triggering program.
specs: |-
  - 106 samples total
  - 44.1 kHz, 24-bit format
  - 5 kick drums with direct and ambient microphone samples
  - 5 snare drums with direct and ambient microphone samples
  - Two-piece and three-piece tom sets
  - Bonus kick and snare samples from State Champs
  - Compatible with any DAW or drum triggering program
  - Instant digital download
  - Perpetual license
  - Free lifetime updates
