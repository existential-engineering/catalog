details: |-
  Massive. Epic. Slams. Hybrid Slams is a cinematic instrument dedicated to ultra-big and modern slam effects and rhythms. Slams are designed to accentuate action points in your scores (or trailers) - where everything comes to a culmination. Unapologetically epic. Slams are divided into three categories of slams: Drum Slams, Perc Slams, and Synth Slams. The slams were also designed to be used as rhythmic tools. Offering you the ability to quickly sculpt unique cinematic rhythms u sing the Soundpaint Arpeggiator and other Effects. Hybrid Slams opens a new world of percussive textures and rhythmic patterns.
