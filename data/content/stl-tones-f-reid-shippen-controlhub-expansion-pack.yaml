details: |-
  F. Reid Shippen is a Nashville-based, Grammy Award-winning mixer, engineer and producer, and the first-call mixer for pop, country and CCM hits. Working from his SSL hybrid studio Robot Lemon, his credits span Kenny Chesney, Dierks Bentley, Little Big Town, Eric Church, Ingrid Michaelson, Cage The Elephant, Death Cab for Cutie, Backstreet Boys, Jonas Brothers, Switchfoot, Keith Urban and India.Arie. He was named Audio Engineer of the Year at the 54th Annual ACM Awards.

  In this expansion pack, F. Reid Shippen brings together the best of both mixing worlds with the tone and character of analog whilst harnessing the power of digital technology.

  A true believer in using the best mixing tools available to serve the song, whether that's his modded SSL 4000E console with several tons of vintage outboard gear or the very latest in modern plugins, the signal chain emulations traced in this pack have been engineered to bring punch to your drums, life to your vocals and analog dimensional color to your mixes.

  This expansion pack has a total of 85 captures.
