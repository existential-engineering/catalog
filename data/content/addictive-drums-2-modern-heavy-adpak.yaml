details: |-
  The ultimate toolbox for any style of heavy music production. Equally perfect for thunderous, hard-hitting drums in the vein of sepultura, mastodon, and high on fire, or gargantuan hi-fi drum blasts in the vein of gojira, tool, and meshuggah, the modern heavy adpak packs the punch and attack you need.

  Ferocious, gargantuan drums that hit harder. Make your drums cut through any wall of guitars. The versatile, wide range of cymbals, toms, snares, and tunings makes modern heavy a swiss army knife for metal and heavy music production.

  The tama star drum kit represents the pinnacle of craftsmanship, innovation, and sound. Handcrafted in japan with the finest materials, it delivers unparalleled resonance, sensitivity, and dynamic range. This unique kit has been custom-treated and positioned by grndahl's david castillo to perfectly resonate in the room.

  Experience double kick drums captured with true stereo positioning. Play the kit with a single centered kick, or switch to separately captured left/right kicks, a surefire way to avoid robotic "machine gun" kick patterns. Addictive drums 2's new alternating kick feature will play back any rapid-fire double kick MIDI pattern in a natural-sounding and realistic "every-other-hit" sequence, without you having to change a MIDI note.

  6 snares for a vast range of tunings, styles, and applications. From rumbling low tunings and high-pitched shotgun blasts, to wild and resonant metallic hits, this adpak has got you covered. The 14x6.5" tama mastercraft "the bell brass" 50th anniversary reissue was captured three times, in three different tunings (high, medium, and low).
specs: |-
  - Double kick drums with stereo positioning
  - Alternating kick feature
  - 6 snares with multiple tunings
  - Wide range of cymbals
  - Wide range of toms
  - macOS support
  - Windows support
  - Universal 2 binary
