details: |-
  18 ableton drum racks to instantly load the factory library "mix ready"
  presets with ableton mappings. 9 ableton live templates for multi track audio
  routing for each factory preset. Colour coded pad design for visual
  performance and finger drumming.

  Singleout presets featuring 9 ableton drum racks for all factory presets
  single audio output to single ableton track. Mixing can be further enhanced
  through superior drummer mixer or additional ableton audio effects to the
  track.

  Multiout presets featuring 9 ableton drum racks for all presets in multiple
  audio channel output from the plug in to multiple ableton audio tracks using
  the multi output ableton template also provided. Track level audio mixing
  control in ableton.

  Use the template racks and extend to your own pop/rock ezx presets, swapping
  out individual sounds or articulations. You are 100% ready to go with the
  factory presets but there is no limitation to creating your own presets from
  these templates.
