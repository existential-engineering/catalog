details: |-
  Aleatoric Rhythms is a bold new instrument that uses sounds from synthesizers and real life recordings. Sounds vary from nasty bass riffs to sneaky and immersive percussion loops. Recorded with a portable studio microphone, the sounds were captured in real environments the exact environments, sometimes clever and sometimes nasty, that the loops want to portray.

  The aleatoric rhythms engine is easy to use, but can give rich and complex outcomes. Aleatoric rhythms contains four individually adjustable sample sources, each housing an abundance of fully modulatable parameters. The 'source movement' & 'filter movement' manipulation pads makes your score come alive and move with the picture.

  The 200 included samples range from classic tonal beats, to gritty bass, ambient layers & snappy percussion loops, and everything in between. Consequently, aleatoric rhythms was designed for cinematic material, but can be used as an expressive layer in most genres of music.

  The four sound sources allow you to layer sounds from "bass", "drum loops", "fx", "layers", "melodics" and "percussion". Together they will produce an inspiring starter or a progressive continuation to your music. The controls on each sound source allow you to tailor the sound to your project's needs, thus making them extremely effective.

  The nine built-in effects can be used to further mix the sounds or add crazy flavours. Whether you want to thicken up the sound, add distortions or widen your sound, these effects are extremely useful tools at your service.
specs: |-
  - Four sample sources

  - 200 included samples

  - 80 thematic categorized snapshots

  - Independent 3-band eq

  - Envelope & filter parameters

  - Pitch shifting controls (+/- 36 semitones)

  - Source-specific panning controls

  - Sample selection randomisation

  - Source movement manipulation pad

  - Filter movement manipulation pad

  - Horizontal, vertical & circular modulation units

  - 4 lfo modules

  - 4 adsr envelope modules

  - 9 effects modules (chorus, distortion, lo-fi bitcrusher, replika delay, spatial stereo field enhancer, filter, phasis phaser, convolution reverb, flair tuned harmonics-enhancing flanger)

  - Edit randomise page

  - Kontakt compatibility

  - Macos and windows support

  - Best performance around 115bpm
