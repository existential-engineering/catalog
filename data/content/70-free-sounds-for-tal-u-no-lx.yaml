details: >-
  This set contains 70 free sounds for tal-u-no-lx. With this soundset I have
  recreated my favorite sounds from the past, as well as some sounds that are
  based on more modern songs.


  Originally created in october 2012, it has been updated in may 2021 to match
  the current version 4.4.5 of the synthesizer. In october 2021 I added 20 new
  sounds, so that the former 50 sounds have now become a total of 70.
