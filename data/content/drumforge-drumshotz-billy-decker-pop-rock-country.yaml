description: Nashville mixer Billy Decker's third signature collection of mix-ready one-shot drum samples, spanning pop, rock, and country, with his own personal post-production samples included.
details: |-
  Drumshotz Billy Decker Pop, Rock, & Country is the third signature one-shot drum sample collection from Nashville mixer Billy Decker, known for his work with Rodney Atkins, Sam Hunt, and Chris Young. Where the earlier Decker packs focused on a single genre, this one spans three, and adds his own personal post-production samples alongside the drum sounds.

  The Pop section contributes 25 samples covering kicks, snares, toms, risers, downlifters, snap, clap, and sub drop sounds. The Rock section adds 14 samples of kicks, snares, toms, sub drops, and post-production material, while the Country section supplies 20 kicks, snares, toms, sidesticks, and claps.

  All 59 samples are delivered as 24-bit / 48 kHz WAV files, intended to be layered with existing drum libraries or raw recordings in any triggering program or DAW.
specs: |-
  - 59 one-shot drum samples total
  - 24-bit / 48 kHz WAV format
  - Pop: 25 samples including kicks, snares, toms, risers, downlifters, snap, clap, and sub drops
  - Rock: 14 samples including kicks, snares, toms, sub drops, and post-production samples
  - Country: 20 samples including kicks, snares, toms, sidesticks, and claps
  - For use with any triggering program or DAW
