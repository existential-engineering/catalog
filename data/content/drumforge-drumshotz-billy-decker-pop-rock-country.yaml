description: A one-shot drum sample collection of 59 mix-ready WAV samples curated by Nashville mixer Billy Decker, spanning Pop, Rock, and Country genres. Designed to add punch and consistency to drum mixes, the pack delivers kicks, snares, toms, claps, and production elements in 48 kHz, 24-bit quality.
details: |-
  Drumshotz Billy Decker Pop, Rock, & Country is a professional one-shot drum sample library curated by Grammy-associated Nashville mixer Billy Decker, known for his work in Pop, Rock, and Country production. The collection distills his signature drum sound into 59 individual samples across three genre-specific sections.

  The Pop section contains 25 samples including kicks, snares, toms, risers, downlifters, snaps, claps, and sub drops tuned for modern Pop productions. The Rock section adds 14 samples crafted for punch and energy, while the Country section rounds out the pack with 20 samples suited to contemporary and traditional Country drum sounds.

  All samples are delivered as 48 kHz, 24-bit WAV files, making them compatible with any DAW or sample-triggering plugin. No proprietary player is required — the files load directly into any workflow.

  The license is perpetual and includes free lifetime updates to the pack, unlimited customer support, and instant digital delivery.
