description: 28 tape banks and 150+ patches for M-Tron Pro IV, curated by Berlin-based composer Hainbach from vintage test equipment, tape machines, and experimental electronics.
details: |-
  We invited German electronic music composer and video creator, Hainbach, to craft a modern yet authentic 'Tron pack. Known for his experimental sound design techniques, Hainbach sampled a range of acoustic instruments, synths and keyboards to create 28 tape banks of unique electronic sounds. Along with over 150 M-Tron presets carefully created by Hainbach, Dave Spiers and Tom Wolfe, this Expansion Pack proudly takes the M-Tron to new sonic heights.

  Fans of Hainbach will instantly recognise his signature blend of experimental sound design and ambient exploration. To create this unique 'Tron Expansion Pack, Hainbach sampled a range of his favourite acoustic instruments, synthesizers and keyboards. These range from obscure rare devices, including a Suiko ST-50, to modern classics such as the Teenage Engineering OP1, all recorded across the full 35-key range of the Mellotron to give the authentic 'Tron experience. With a selection of chromatic string synths, ambient plucks and industrial-style textures, users will find a variety of distinctive lo-fi sounds with a classic 'Tron vibe.

  Once Hainbach had sampled these instruments, we took the recordings to Streetly Electronics to have them 'Tronized' via their Skeletron, a bare-bones Mellotron M400. This involved recording everything to tape, and then re-recording the output via the Skeletron pre-amp. Finally, the 'Tronized' recordings were sent back to Hainbach for editing, ensuring the final pack fulfilled his 'Tron vision. This labour of love allowed us to guarantee the classic Mellotron character was retained, making this a truly authentic 'Tron pack.

  Hainbach has become known internationally for his ambient recordings and experimental music techniques on his YouTube channel. He worked on more than 70 theatre plays as a composer, lyricist and live musician, many of which featuring the GForce M-Tron. His love for experimentation, tapes, nuclear test equipment and the most exotic machines, made him the perfect candidate to craft beautifully mysterious and unusual sounds for the 'Tron.
specs: |-
  - A GForce Software and Hainbach collaboration
  - Compatible with M-Tron Pro
  - Over 150 patches
  - 28 carefully curated tape banks
  - Instruments include: Kraut Kalimba, Maestro, Orchestral Strings, Crumar Colors (Cosmic Italy), Michelsonne (French Toy Piano), CRB 2000 (Computerband), Mad Rhodes, SH2 (Classic Mono Synth), Endless Piano, Giallo Strings, HP Waves (Test Equipment Waves), Trance Waves, Suiko (Poetry Trainer) and Juno60 (Classic Synth)
  - 35 notes per tape bank
  - Exclusively available via download, approximately 700 MB depending on version
