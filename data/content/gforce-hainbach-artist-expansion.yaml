details: |-
  The Hainbach Artist Expansion Pack brings together a handpicked collection of vintage, experimental, and electronic sound sources curated by Hainbach — a Berlin-based composer known for his work with test equipment, tape machines, and obsolete electronics.

  The pack includes 28 carefully curated tape banks and over 150 patches crafted by Hainbach, Dave Spiers, and Tom Wolfe. Each tape bank contains 35 notes, delivering modern yet authentic 'Tron sounds ranging from lush orchestral textures to unusual electronic timbres.

  Tape banks include: Kraut Kalimba, Maestro, Orchestral Strings, Crumar Colors, Michelsonne (French Toy Piano), CRB 2000, Mad Rhodes, SH2 (Classic Mono Synth), Juno60, Endless Piano, Giallo Strings, HP Waves (Test Equipment Waves), Trance Waves, Suiko (Poetry Trainer), and more.

  Also included in the M-Tron Pro Complete bundle.
