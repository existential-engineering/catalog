details: |-
  BFD Dunnett Ti is an expansion for bfd3, bfd eco and bfd2 featuring a full set
  of hand-made prototype titanium drums from master drum-builder ronn dunnett.
  With shells made from solid titanium, the dunnett ti kit is one of the most
  advanced all-metal drumkits ever created and highly sought-after by elite
  studios and drummers.

  Bfd dunnett ti provides 2 kicks and 5 toms alongside a dunnett snare and a
  full set of cymbals. The sounds include a special amb3 mic channel of the kit
  fed through a sovtek mig 60 tube guitar amp and marshall 4x12 cab (mic'd with
  royer 122 ribbons in a blumlein configuration).

  Bfd dunnett ti is recorded in the same room and studio conditions as the bfd
  jazz & funk, bfd jex, bfd heavy and bfd percussion expansions. It has also
  been designed to sound great with bfd libraries recorded in other locations.
specs: |-
  - Expansion for bfd3, bfd eco and bfd2
  - Hand-made prototype titanium drums
  - Solid titanium shells
  - 2 kicks with felt/wood beaters
  - 5 toms
  - Dunnett snare
  - Full set of cymbals
  - Hihat included
  - Amb3 mic channel
  - Sovtek mig 60 tube guitar amp
  - Marshall 4x12 cab
  - Royer 122 ribbons in blumlein configuration
  - Windows 7 or higher
  - Os x 10.6.8 or higher
  - Internet connection for download and authorization
  - Disk space: 15 GB full install, 7.5 GB medium install, 5 GB small install
