details: |-
  Analog Synth Pop is a 50-patch collection designed exclusively for the GForce Minimonsta2 by Plughugger. It takes inspiration from legendary producers like Giorgio Moroder and Vince Clarke while blending with modern genres such as Synthwave and vintage-style EDM pop.

  Each patch evokes the nostalgic warmth of vintage analogue synthesizers, covering lush pads, punchy basses, dynamic leads, and arpeggios. The collection bridges classic analogue tones with contemporary electronic music production.

  Plughugger (Carl Lofgren) has created factory sounds for Spectrasonics, Arturia, GForce, Tone2, Polyend, and the Solaris synthesizer by John Bowen.
