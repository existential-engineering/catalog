details: |-
  Produced by eduardo tarilonte, accordions 2 is considered the first choice if you are looking for a realistic and, above all, playable accordion library. Numerous renowned composers and producers rave about the authenticity and expressiveness of this virtual instrument.

  With single concertina you get a virtual concertina from eduardo tarilonte's accordions 2 as a single instrument. So if you are looking for that sailor song sound for your current project, this realistic and playable concertina is the perfect solution.

  Virtual concertina, the sound of sailor songs with 3 kinds of bellow shake, 3 different dynamics and 3 round robins. Key and button noises for ultra-realistic performances.

  Recorded chromatically with the pristine sound of a u47 microphone. Exclusively compatible with best service engine 2.

  This single instrument was exclusively designed for best service engine 2 and is therefore not compatible with the kontakt player.
