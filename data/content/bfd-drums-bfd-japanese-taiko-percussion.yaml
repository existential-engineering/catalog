details: |-
  Sonica's japanese taiko percussion is an authentic library of taiko sounds for
  bfd3 and bfd2 which perfectly captures the earth-shaking bass and pure
  percussive power of japanese taiko drums.

  Jtp is perfect for traditional japanese music, soundtrack work and any other
  genres that require dynamic, huge-sounding percussion.

  The instruments are played by ikki hino, leader of wataiko ikki, a
  world-renowned taiko performance group, and recorded by tomzuin h, a sound
  designer and composer who previously produced sample libraries such as the
  fuel series.

  Jtp's sounds and performances are uncompromising in their authenticity and
  perfectly capture the sheer energy of taiko drums.
