details: |-
  Blues classics is a huge collection of classic blues grooves featuring 18
  "sessions" of 12-bar blues loops. Each session includes intros, hat and ride
  grooves, fills and outro fills.

  We've also included a bonus section with extra fills and cymbal swells. Styles
  include slow blues, moderate to uptempo shuffles, funky blues and
  song-specific sets such as crossroads, mojo and cross cut saw.

  700 royalty-free blues MIDI loops. Played by professional studio drummers.
  Classic 12-bar blues with intros, fills and outro fills.

  Compatible with all music software that imports MIDI loops. Beat buddy pbf
  file included.

  100% royalty free for your musical productions. You may not redistribute them
  for a profit.
