details: |-
  Awakenings is brought into the world of padshop pro, steinberg's granular
  synthesizer. There are 200 hand crafted sampled instruments from awakenings a
  collection of sounds originally designed for kosmology awakenings.

  There are 10 different presets for each of the 200 instruments in a different
  style, each style making use of padshop's synth engine, which adds up to 2000
  presets.

  All presets use aftertouch and the modulation wheel for live manipulation of
  various parameters.

  Each sampled instrument has a preset in the following categories: bright
  single synth with an open low pass filter, dual 1, dual 2 (using both synth
  engines in different ways), high pass (using a high pass filter), lead simple
  lead versions, mellow single synth with a more dulled sound, slow 1, slow 2
  (slow attack categories), stab short filter envelopes good for arps, and verby
  single synth using reverb.
specs: |-
  - 200 sampled instruments
  - 2000 presets
  - 10 different presets per instrument
  - Aftertouch support
  - Modulation wheel support
  - Granular synthesis
  - High pass filter
  - Low pass filter
  - Reverb capability
  - Filter envelopes
