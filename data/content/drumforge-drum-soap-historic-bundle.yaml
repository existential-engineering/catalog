description: "A bundle of TCI drum samples recorded in four historic ambient spaces on the US East Coast, paired with the Arcus envelope-shaping plugin. Includes 240 one-shots (40 per room) plus multi-sample TCI format files across four rooms — The Livery, The Foundry, The Hangar, and The Chapel — totaling over 4 GB of content."
details: |-
  The Drum SOAP Historic Bundle captures drum recordings made in four non-studio historic locations on the US East Coast. Each room contains 1 kick, 3 snares, and 4 toms, with 40 one-shots per instrument configuration plus multi-sample TCI format files, totaling 240 one-shots and over 4 GB of audio content.

  The four recording spaces are: The Livery (a horse stable), The Foundry (a vineyard), The Hangar, and The Chapel (an art gallery). Each location contributes unique spatial and tonal character to the recordings. Chris Baseford's trigger presets are also included.

  The bundle includes the Arcus plugin, an ambient envelope shaper featuring SyncBand ADSR Technology. Arcus supports audio, sidechain, and MIDI triggering, along with tempo-sync, tilt control, high/low-pass filters, and phase inversion.

  Samples are in TCI format and require Slate Trigger 2. Includes perpetual license, free lifetime updates, and unlimited customer support.
specs: |-
  - 240 one-shots total (40 per room)
  - 4 recording spaces: The Livery, The Foundry, The Hangar, The Chapel
