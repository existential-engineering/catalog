details: |-
  Colin Richardson is a British producer and mix engineer who has undoubtedly set the benchmark of metal recordings for the last 20 years. With over 100 albums to his name, he has shaped pivotal records for Slipknot, Machine Head, Carcass, Napalm Death, Fear Factory and Bolt Thrower, working with many of the hardest-hitting and most respected bands of this generation.

  Colin Richardson and Chris Clancy give you access to the signal chains that continue making their productions the gold standard in modern metal and hard rock recordings. Full of hardware and software emulations for every piece of the drum kit, drum bus and parallel chains, this expansion pack also includes powerful vocal starting points and mix bus processing, all with the ability to be customized to your mixes.

  This expansion pack has a total of 81 captures.
