details: |-
  Book of prog: leads is a collection of 106 vintage monophonic presets for
  cherry audio pro soloist synth plugin that focuses in the 70's progressive
  rock genre.

  Within those synth leads a lot of classic sounds are included as well as some
  peculiar sounds that vary from detuned leads to hollow soft leads and from
  dark synthetic and partial distorted sounds to theremin like synths.

  Presets were designed with pro soloist 1.0.4 (build 91) and run best with this
  or newer edition.
