details: >-
  4th lead soundbank contains 50 retro sounding mono synth presets for cherry
  audio mercury-4 synthesizer.


  The presets are inspired by late 70s and early 80s synth sounds and fit for
  vintage based music productions from cinematic to electronic and from rock to
  new age genres.


  It contains many types of leads from soft tones to saturated ones and from
  crazy modulations to r2-d2 robotic sounding patches.


  Presets were designed with mercury-4 1.6.0 (build 100) and run best with this
  or newer edition.
specs: |-
