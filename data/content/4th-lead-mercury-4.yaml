  - Cherry audio mercury-4 synthesizer compatibility
  - Mercury-4 1.6.0 (build 100) or newer
  - Late 70s and early 80s synth sounds
  - Vintage based music production
  - Cinematic, electronic, rock, and new age genres
  - Soft to saturated tone leads
  - Modulation capabilities
  - R2-d2 robotic sounding patches
