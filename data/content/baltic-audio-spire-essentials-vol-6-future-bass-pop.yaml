details: |-
  64 presets for the Reveal Sound Spire synthesizer, aimed at current Future Bass and Future Pop, including hand-crafted basses, leads, plucks, pads, synths and FX.

  Each preset is programmed by a professional sound designer, with every parameter tweaked in detail, as a source for creating new and commercial sounds within a composition.

  The pack can also be used for genres like Future House, Electro Pop and Progressive House.

  In addition, 61 MIDI files taken from the demo are included.

  Please note: the drums and some FX used in the demo are not included in this product. These presets require v1.1 or higher of Reveal Sound Spire.
specs: |-
  - 64 Presets for Spire
  - 16 Synths
  - 14 Leads
  - 14 Basses
  - 8 Pads
  - 4 Arps
  - 4 Plucks
  - 4 Fx
  - Modwheel Assignment
  - 61 MIDI Files
  - Multi-genre
  - PC/Mac Compatible
  - 100% Royalty-Free
  - Requires Reveal Sound Spire v1.1 or higher
