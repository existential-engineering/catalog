details: |-
  'Sylenth1 Essentials Vol 5: Tropical House' from baltic audio comes along with loads of brand new unique sounds of summer for your next tropical house tune. You'll find 64 top-quality presets for the well-known Sylenth1 synthesizer.

  Each preset is perfectly programmed by a professional sound designer and every parameter tweaked with passion and detail and will be your essential source for creating new and commercial sounds within your compositions.

  You can also use it for genres like Deep House, Pop and more.

  In addition, you'll find 61 MIDI files taken from the demo.

  Please note:
  The drums and some FX used in the demo are not included in this product. These presets require v. 3.06 or higher of Lennar Digital Sylenth1.
specs: |-
  - 64 Presets for Sylenth1
  - 18 Leads
  - 11 Plucks
  - 10 Basses
  - 8 Synths
  - 5 Pads
  - 4 Keys
  - 3 Brasses
  - 3 Hovers
  - 2 FX
  - 61 MIDI files
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
