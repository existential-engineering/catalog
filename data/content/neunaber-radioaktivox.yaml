details: |-
  As the Germans say, Auch Du Bist Radioaktiv, and you'll agree after you hear the exciting sounds on Radioaktivox! It's 1975, and you're blasting down the Autobahn with the Telefunken belting out the latest Krautrock. The pulsing beat of synthesized drums, bass, and strings carry you along while an airy vocal choir floats through your mind. Enjoy playing the vast range of vintage techno-fare with Optigan-format rhythm and keyboard tracks. Try playing all your favorite songs, we dare you! Buy an Optigan music book and give it a try. Who knows, it could work! Left Hand: Synthesized Bass, Strings. Right Hand: Vocal Choir. Special Effects: Drums, High Hat, Cymbal and Sine Sweep. The demo video shows some of the "behind the scenes" activity that leads up to testing a new disc for release. Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility
