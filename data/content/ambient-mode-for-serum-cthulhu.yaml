details: >-
  With ambient mode for serum & cthulhu, we've put together a go-to resource for
  all things chilled and atmospheric. Featuring 60 serum presets, 24 cthulhu
  presets, loops, oneshots and MIDI files, this collection will have the
  creativity flowing the minute you start exploring.


  We took inspiration from artists and bands including boards of canada,
  autechre, tycho, chvches, godspeed you! Black emperor, sigur ros, mogwai and
  bjork, among others, to bring you this essential ambient production toolkit.
  Whether you work in genres such as chillout, chillwave, downtempo, dark
  ambient, ambient pop, drone, post-rock or cinematic, there's plenty of
  material here for you to get your ideas down fast.


  Each serum preset comes fully loaded with 4 macro controls, enabling you to
  tailor your sound on the fly and not distract from the production process too
  much. Featuring basses, drones, pads, leads and textures, you won't be short
  on some incredible sounds for a while as the scope to tweak them is almost
  endless!


  For the cthulhu presets, we input some of our favorite diatonic chords and
  progressions in all 24 major and minor keys to get the ideas going instantly.
  Explore the progressions and mix them up to your liking, everything is in key
  so you don't have to worry about any awkward notes disrupting your process!
  You'll find triads, sus2, sus4, sixths, sevenths, ninths and other extended
  chords.


  Contents include 10 basses, 10 drones, 22 pads, 12 leads, 6 textures for serum
  presets; 1 bassline, 1 drone, 1 full drum loop, 5 pads, 3 synth leads for wav
  loops; 2 closed hats, 1 cymbal, 1 kick top, 1 kick, 3 percussion, 1 snare for
  wav oneshots; and MIDI scales including c major and related modes, c harmonic
  minor and related modes, c melodic minor and related modes, c double harmonic
  major and related modes.
