description: Behold the Aquios X4 Workstation ROM, a wave based powerhouse
  equipped with a legendary sound bank of euphoria invoking pads.
details: |-
  Behold the Aquios X4 Workstation ROM, a wave based powerhouse equipped with a
  legendary sound bank of euphoria invoking pads, insanely futuristic saws,
  seriously modulated club bells, hollywood worthy string sections, elegant and
  pristine pianos, giant cinematic brass, gorgeously angelic choirs, frightening
  ambient textures, stunning plucked pizzicatos, and shockingly unique poly
  synths.

  With both industry ready orchestral instruments and synthesized instruments,
  the aquios x4 re combines the beauty of a highly interesting graphical user
  interface and a powerful multi-effects processing engine with a huge and
  professional sample based rom sound bank core.

  Aquios x4 is a breathtakingly futuristic rack extension for producers of all
  genres ranging from trap, dub step, house, & all electronic dance music to
  dramatic & realistic orchestral scoring.

  The aquios x4 workstation rom is a powerful virtual instrument comprised of
  many synthesized sounds, and orchestral sounds. This workstation is loaded
  with unique analog and digital synths, gated synths, trap leads, super fat
  club saws, bells, strings, brass, pianos, pads, choirs, plucked, and a
  professional onboard effects engine for that industry "wet" sound.
specs: |-
  - 4.2gb rom with approximately 2000 waveform samples

  - 452 preset factory patches

  - Analog (emulated) setting

  - Digital setting

  - Hd analog modeled quad filters

  - Lp12, lp12+drive, bp6, bp6+drive, hp12, hp12+drive filter types

  - Quad lfo with adjustable speed and type

  - Quad envelope adsr adjustable settings

  - Pitch lfo with random, drift, sine, square, saw, triangle types

  - Semi & cent tuning for 4 x-voices

  - Volume and pan controls for 4 x-voices

  - Global studio quality ambient reverb with 7 professional parameters

  - Global studio quality dual delay with 6 professional parameters per delay

  - Stereo field spatial imaging with 3 width presets

  - 3 clarity settings (subtractive equalization)

  - 3 warmth settings (additive equalization)

  - Editable pitch wheel range and controls

  - Modulation wheel with 3 assignable effects

  - Air (high pass filter)

  - Submerge (low pass filter)

  - X-fade effect

  - Quad x-phaser effect with 10 parameters

  - Quad x-chorus effect with 10 parameters

  - Quad x-gator effect with gate type, gate shape, mix, tempo-synced speed, and
  cutoff parameters

  - Quad attack, hold, decay, sustain, and release sample control parameters

  - Rack extension plugin


  - Wave based synthesis
