details: |-
  London Sessions is a OneShot expansion pack for modern rock and pop and future country vibes. Professional, but with real-life dynamics and a slightly rough (but very human) edge.

  The sessions were recorded at RAK Studios in London, Studio 3. A room known for its spacious but controlled acoustics and long history with artists like The Who, Pink Floyd, David Bowie and Ed Sheeran. The kit was captured using classic vintage microphones through a Neve VRP Legend console, giving you a spacious yet controlled room sound that drops straight into a mix.

  Performed by a leading session drummer and engineered by award-winning Isabel Gracefield (Adele, Radiohead, Dua Lipa), the result is hit-ready drums that are ready to drop right in and add instant impact to your music. The recording was made in collaboration with Song Athletics and are people-driven sounds, accurate but not clinical, with the subtle nuance you would expect to capture during a real session.
specs: |-
  - 25 slots
  - 500+ samples
  - 20 presets
  - Vintage Rogers 1970s Fullerton drums
  - 1990s Black Beauty snare
  - Istanbul Agop cymbals
  - Microphones used: Neumann U47 FET, AKG C414, Schoeps CMC5 (MK2/4), AKG C451, Coles 4038, Neumann M50
  - Recorded at RAK Studios, Studio 3, London, through a Neve VRP Legend console
  - Requires a OneShot license
  - macOS/Windows/iOS
