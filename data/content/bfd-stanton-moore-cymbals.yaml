description: BFD Stanton Moore Cymbals is an expansion pack for bfd3, bfd eco
  and bfd2 with stunning recordings of bosphorus cymbals.
details: |-
  Bfd stanton moore cymbals brings the entire bosphorus stanton moore signature
  cymbal range to your sessions - 4 crashes (with additional mallet versions), 2
  rides and a hihat - all recorded in pristine detail by sampling guru john
  emrich.

  An accompanying groove pack, stanton moore grooves, is also available.

  Bfd stanton moore cymbals is produced by cymbal masters.
specs: |-
  - Expansion pack for bfd3, bfd eco and bfd2
  - Bosphorus cymbals
  - 4 crashes with mallet versions
  - 2 rides
  - 1 hihat
  - 23 GB disk space
  - Windows 7 or above
  - Os x 10.8 or above
  - Bfd3 v. 3.2.1.2 or above
  - Internet connection for download and authorization
  - SSD recommended
