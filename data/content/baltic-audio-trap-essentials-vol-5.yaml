details: |-
  'Trap Essentials Vol 5' from baltic audio brings you a powerful collection of Trap samples and loops to push your production to the next level. You'll find a bunch of 808s, drums, synths, instruments and more and some presets for Sylenth1 and Massive.

  This pack provides you with all of the elements you need to make chart-topping Trap bangers.

  Each Kit contains perfectly mixed instrumentation and will be your essential source for creating instant Trap hits, which are just waiting for a vocal topline to be added.

  41 MIDI files are included for the majority of musical phrases heard in these kits. Together with the Sylenth1 & Massive presets, the oneshot samples and loops there are no limits to your creativity.
specs: |-
  - 5 Construction Kits
  - 47 Oneshots (drums, percussion, fx)
  - 74 Loops (melodic)
  - 58 Drum Loops
  - 41 MIDI Files
  - 2 Massive Presets
  - 1 Sylenth1 Preset
  - 500 MB of content
  - Perfectly premixed
  - 44.1kHz/32-Bit WAV
  - PC/Mac Compatible
  - 100% Royalty-Free
