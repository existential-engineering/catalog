details: |-
  Modbap Modular's Osiris WavPak Volume 2 by Bogdan Raczynski is a WavPak designed exclusively for Osiris Bi-Fidelity Wavetable Oscillator. The WavPak contains 4 banks of wavetables (3 new and 1 from the factory set). Each WavPak bank contains 32x32 wavetables. The WavPak format is simply the organization of wavetable banks into the structure and format used by the Osiris Eurorack module. The audio format is 16 bit, 44.1kHz and the wavetables are organized in folders A,B,C,D. Think of a WavPak as a sample pack full of wavetables for Osiris. **Digital Download**

  How to use WavPaks

  WavPaks are easy to use. Documentation
specs: |-
  - Just copy the Osiris folder to the root of the micro sd card.
  - Insert the micro sd card into Osiris.
  - Power on Osiris.
  - Press and hold the bank button until the LEDs turn blue.
  - Now Osiris is set to use the WavPak wavetables on the micro sd card.
  - To toggle back to the factory wavetables, Press and hold the bank button until the LEDs turn white.
