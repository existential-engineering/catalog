details: |-
  'Ultimate Drum Machine Collection' is a royalty-free analog drum sample pack featuring 410 WAV drum sounds for Pop, Hip Hop, House, EDM, Synthwave and Rock productions.

  The pack includes classic drum-machine-style kicks, snares, toms, claps, open and closed hihats, shakers, rimshots, rides, crashes, congas, snaps and miscellaneous drum sounds. All samples are delivered as 44.1 kHz / 16-bit WAV files and can be used in any DAW or sampler that supports WAV files.

  Please note:
  This pack contains drum samples in WAV format. No additional plugin is required, but you need a DAW, sampler or audio software that can load WAV files.
