description: 48 mix-ready snare drums sampled across four studio rooms, delivered as processed TCI files, processed one-shot WAVs, and raw multi-sample multi-velocity WAVs. Recorded and mixed with analog gear, with round-robin sampling and multiple microphone textures per snare.
details: |-
  The Drum Vault brings curated collections of highly desired drums, recorded and mixed in high-quality environments, so producers get tonal flexibility without either the bluntness of a one-shot pack or the complexity of a full sampler. It was built in response to user requests for something between the simplicity of Drumshotz and a sampler platform.

  Snare Arsenal gathers 48 mix-ready snares so a suitable snare can be found quickly, then blended for tone, ambience, and punch to fit a production. The drums were sampled at four studios known for their drum sounds, with the snares curated from local drum techs and producers familiar with each room, then mixed on the hardware available in that room to bring out its character.

  The samples are mixed to competitive commercial standards without being over-processed, so they sit in a mix as they are and still take further EQ, compression, and transient shaping well. One-shot versions are processed slightly harder to maximize impact and punch, while the multi-sampled versions are aimed at realism, and raw WAV files are supplied for anyone who wants to do their own processing.

  A One Shot Edition is also sold, containing the processed one-shot WAV files with an individual WAV per microphone texture and the TCI presets for loading all textures per snare.
specs: |-
  - 48 snare drums in total, mix ready
  - Recorded across four rooms: Wood Room (19 snares), Brick Room (9 snares), Vibe Room (7 snares), Hybrid Room (13 snares)
  - Recorded and mixed with high-quality analog gear
  - Multiple engineering setups for sonic sculpting
  - Multiple velocities and round-robin sampling for realistic dynamic performances
  - Processed TCI files for all 48 snares, with a TCI per microphone texture
  - TCI presets for quick loading of all microphone textures per snare
  - Processed one-shot WAV files for all 48 snares, with an individual WAV per mic texture
  - Raw unprocessed multi-sample, multi-velocity WAV files for all 48 snares
  - One Shot Edition available separately with the processed one-shot WAV files only
