details: |-
  Vimana features 4,083 designed sound effects with a high-tech extraterrestrial aesthetic.

  Sound designer Ivo Ivanov brings us a massive collection of science fiction sounds including high-tech UI effects, mutated biomechanical organisms, morphing flybys, shape-shifting dimensional rifts, twisted humanoid articulations and ancient alien artifacts that defy categorization.

  Vimana comes with 4.7GB of 24bit/96kHz .wav audio content that is equally geared toward music production, game audio and multimedia applications. Whether you're working on a blockbuster sci-fi shooter game, a modern electronic music album or a high-tech multimedia project, you will undoubtedly find this collection to be an indispensable resource.

  While our sound effects are carefully designed to work with your favorite samplers and DAWs, they pair up particularly well with our own brand of audio contortion devices. Our wide selection of packs grant Palindrome, Polygon, Cataract and Tactic users access to thousands of fresh ingredients.
