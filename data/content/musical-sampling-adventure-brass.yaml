details: |-
  Adventure Brass was recorded at the bridge in los angeles, a prominent scoring stage that has overseen a variety of television, film and game scoring projects since its opening in 2010.

  Starting out with la's finest, the goal with this release was to create a true workhorse brass library that is first and foremost, fun to play.

  Utilizing morph stacking programming techniques, the adventure patches allow you to perform lines on-the-fly without any keyswitching.

  Coupled with two intuitively-programmed attack variations, the ability to spontaneously craft bold brass melodies quickly has never been easier.

  We recorded medium-sized sections; a dual-purpose group designed to treat equally-well to both unison and harmonic passages with believable transparency, even when crossfading between dynamic layers.
specs: |-
  - Morph stacking programming techniques
  - On-the-fly performance without keyswitching
  - Two attack variations
  - Medium-sized brass sections
  - Unison and harmonic passage capability
  - Dynamic layer crossfading
  - Kontakt 5 compatible
