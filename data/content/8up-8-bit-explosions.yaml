  Detonate your tracks with this blast of 8-Bit Explosions from bombs to
  buildings. The 8-bit samples are separated into four sound categories: bombs:
  lower pitched mini-bursts. Dynamite: short, vibrant blasts. Small explosions:
  destructive detonations. Big explosions: the biggest and baddest.

  This pack contains: 100 8-bit explosions samples (bombs, dynamite, small
  explosions & big explosions). 1 sfx patch for native instruments kontakt,
  ableton live, maschine, logic pro exs24/sampler, fl studio, mpc expansion
  pack, and tal-sampler.

  24-bit, 44.1 khz wav files.

  8-bit explosions is part of the 8-bit sound effects bundle.
