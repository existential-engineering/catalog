details: |-
  A Free Gift to You! Songwriting Guitars is a sample tool made for songwriters, composers and producers who need instant and authentic guitar strums and licks. Ever thought about making a song like Coldplay, Oasis or Tracy Chapman? We analyzed a variety of top 40 rock and pop songs and identified the most common major and minor chord progressions. The Songwriting Guitar contains all the essential chords needed to sketch down or build an entire song. The library contains three different types of guitars (acoustic, electric clean, and electric distorted) played in the four most common rhythms used for song writing. All you have to do is to hold down a single key (ex. C) and the tool will play the songwriting chord related to the key. The Parts are recorded at 120 BPM but can be changed using our new high-res time stretcher (BPM Calculator below). Songwriting Guitars is packed with rich songwriting tools, the most commonly played chord progressions from top songs designed to inspire creativity and simplify the songwriting process.
