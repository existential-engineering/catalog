details: |-
  Vintage Instruments Recorded to Tape! Vintage Mello-D is a re-imagination of the infamous magnetic tape-based "sampler", featuring over 9,600 Real-Time Samples and over 60 different deep-sampled Soundpaint Parts. All samples were recorded to real analog tape and mastered to match the EQ spectrum of the original instrument - widely known for its unique vintage sound quality (think Beatles Strawberry Fields). It's dusty, wobbly, and features a 1960s retro nostalgic vibe like no other. Mello-D offers a new selection of essential instruments that all feel right at home on tape. You'll find a variety of Brass, Strings, Woodwinds, Classic Keyboards, Pianos, Choirs and everything needed for creating authentically vintage music. With the powerful Soundpaint engine, it's easy to make new classic programs, mix and match between Mello-D parts, and even combine tape-based sounds with your own imported samples.
