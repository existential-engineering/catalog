details: |-
  This collection of Ableton drum racks features all factory presets for native
  instruments abbey road 70s drummer.

  4 ableton drum racks to instantly load the abbey road modern drummer factory
  library preset with ableton mappings. Optimized for ableton push 2! Color
  coded pad design for visual performance immediately visualise your snares from
  your crashes.

  All articulations in one layout using the ableton push 64 pad mode layout.
  Labelled pads for post performance editing and automation within the ableton
  live clip editor with individually named note articulations.

  This pack routes all audio output through a single ableton track. Mixing can
  be further enhanced through kontakt/abbey road modern drummer mixer or
  additional ableton audio effects to the track for example the new ableton 10
  drum buss.

  Ease of navigation to load all presets from ableton push controller device
  browser.
specs: |-
  - Ableton 9.5 or above
  - Ableton push 2 optimization
  - 64 pad mode layout
  - Color coded pad design
  - MIDI articulations
  - Audio routing through single Ableton track
  - Kontakt integration
  - Ableton live clip editor compatibility
