details: |-
  Strum GS-2 - Blue Rhythms by Applied Acoustics Systems is a virtual instrument
  audio plugin and soundware for macOS and Windows. It includes, and is
  therefore powered by, aas player, which functions as a VST plugin, an audio
  units plugin, a VST 3 plugin and an AAX plugin.

  Seasoned canadian musician yves frulla returns with blue rhythms paying
  tribute to the soulful sounds of the '70s and capturing the grooves defined by
  legendary artists of that musical era with 12 playing styles, 87 guitar
  presets, and 84 strumming patterns playable with your own chord progressions.

  From motown to muscle shoals, blue rhythms brings that expressive guitar vibe
  you need to instill groove and swagger to your next production.
specs: |-
  - 12 playing styles
  - 87 guitar presets
  - 84 strumming patterns
  - Chord progressions support
  - macOS support
  - Windows support
