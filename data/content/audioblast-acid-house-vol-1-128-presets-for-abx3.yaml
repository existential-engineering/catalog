details: |-
  Bring the Chicago House era back to life!

  Acid House Vol. 1 delivers 128 handcrafted presets for ABX3, designed to capture the unmistakable sound of the late 1980s Acid House revolution.

  Influenced by pioneering artists such as Sleezy D, Mr. Fingers (Washing Machine), and Tyree (Hardcore Hip House), this bank offers a wide range of classic 303-style basslines, deep resonant grooves, squelchy leads, and hypnotic acid sequences that defined the birth of modern dance music.

  Whether you're producing classic Chicago House, early Rave, or exploring the roots of Techno and New Beat, these sounds will instantly inject your tracks with authentic vintage acid energy.

  Each preset has been meticulously programmed to take full advantage of ABX3's analog-style filters, envelopes, and modulation options, allowing you to shape your sound and perform in real time, just like the original 303.

  Requires Abx3.
