details: |-
  Anomaly XXV - Return to the Asylum re-visits the original source sounds of
  anomaly xix - the asylum and adds new sounds from paul amca and other sources.
  There are 50 new sounds in sfz/wav format, 253 MB. The 26 original anomaly xix
  files are included as a bonus (169 MB) for a total of 422 MB.

  Presets: anomaly vsti: 76 single sound instrument presets and 20 multis. These
  expect to find the sounds in an anomaly data folder. Wusik v6/v7: 76
  single-sound instrument presets and 20 multis. These expect to find the sounds
  in a wusikstation data folder. Wusik v9: 76 single-sound instrument presets
  and 20 multis. These were made using the sounds in my v7 data folder.

  Kontakt 5: 76 .nki instruments presets and 20 .nkm multis. Kontakt v5.5.2 or
  higher. These share the 4 page scripted interface from anomaly vol. 1.
  Synthmaster 2: 25 multis. Sforzando: 76 instrument presets. Tx16wx: 76
  instrument presets (.txprog).

  Each of the new sounds are between 20 and 38 seconds long. Audio demos are
  available.
specs: |-
  - Sfz/wav format
