description: This particular instrument that has been sampled by MODWHEEL is a
  one off creation, hand crafted by steve roche.
details: |-
  The instrument is a 4 string fretless with open g banjo tuning (d g b d). For
  sampling purposes the range of the instrument has been extended down to the e
  below the d of its natural range. The instrument is fitted with a pickup and
  was recorded both acoustically as well as through a vintage fender twin reverb
  amp.

  As an acoustic instrument the biscuit tin guitar has a wonderfully unique
  sound that is caught somewhere between a dobro and a banjo. The electric
  version can sit between clean and a tin can being dragged behind a car,
  depending on your taste.

  35 kontakt patches, both acoustic and electric, with finger and plectrum
  performance. Keyswitches operate the different note options, I.e. Long, short,
  mute, semitone slide up, tone hammer off. There is also dynamic keyswitching
  to aid performance with several velocity layers and at least 3 round robins.
  An fx panel on each patch gives the ability to adjust the sound to further
  suit your requirements.

  The instrument has also been used for its percussive possibilities and there
  are several percussion kits and bpm'd rhythm patches. In addition there are a
  number of patches that play arpeggios and song patterns from a single key.
specs: |-
  - 4 string fretless guitar
  - Open g banjo tuning (d g b d)
  - Extended range down to e
