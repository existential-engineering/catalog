details: |-
  This MIDI pack is great for writing rock songs. MIDI files prepared for use in djent guitar. Copy multi folder to djent guitar folder. Open Kontakt 7 or higher (full version) in your DAW. Drug'n'drop djent guitar 6s - default.nkm to Kontakt. Create 6 MIDI channels and link them to Kontakt. Drug'n'drop riff .MIDI to MIDI channels.

  Fl scores prepared for use in harmonez rg 2570. Open patcher in fl studio, select preset harmonez and drug'n'drop fl score to piano roll.

  All riffs are free for commercial use without any restrictions. Together with this MIDI pack you will receive a link to free download djent guitar and harmonez. Links inside the archive.
specs: |-
  - MIDI files for djent guitar
  - Fl studio scores for harmonez rg 2570
  - Kontakt 7 or higher (full version) compatible
  - 6 MIDI channels
  - Commercial use license included
