description: Big Rusty Drums is a free sample library of a vintage polish drum
  kit made by zygmunt szpaderski in a small workshop.
details: |-
  The library features a large kick, deep snare, and four extremely large toms
  ranging from 14x14 to 22x16, along with a hi-hat with six degrees of openness,
  foot chiks, foot splashes, and return noises.

  Cymbals included are crash, ride, china crash, sizzle ride, sizzle crash
  cymbals plus a cymbal stack, with samples available using sticks, brushes and
  mallets.

  Time-adjustable stir and flutter techniques are available for the snare and
  floor tom, along with samples of rim clicks, shell clicks, and pedal mechanism
  noises.

  The library contains 4466 total flac and wav samples, over 600 mb extracted,
  and requires plogue sforzando 1.933 or newer.
specs: |-
  - Plogue sforzando 1.933 or newer required
  - Windows 7 or higher
  - Os x 10.6.8 or higher
  - Intel/amd dual core CPU or more
  - 4 GB RAM
  - 2.4 GB disk space (3.5 GB to install)
  - 4466 total flac and wav samples
  - Over 600 MB extracted
  - Large kick drum
  - Deep snare
  - Four extremely large toms (14x14 to 22x16)
  - Hi-hat with six degrees of openness
  - Foot chiks and foot splashes
  - Crash, ride, china crash, sizzle ride, sizzle crash cymbals
  - Cymbal stack
  - Samples with sticks, brushes and mallets
  - Time-adjustable stir and flutter techniques
  - Rim clicks, shell clicks, and pedal mechanism noises
  - Controls for transposed copies of mics
  - Sound shortening controls
