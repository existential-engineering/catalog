details: |-
  Daniel Braunstein has been delivering some of the most exciting productions in modern heavy music, with mainstream charting records for Spiritbox alongside successful albums with Dayseeker, Erra and Silent Planet. Co-owner of The Hallway Studios in LA, he often writes, produces and mixes the projects he works on.

  This expansion pack is built directly from the amps, cabs and signal chains Dan relies on across that work. Designed as his go-to toolkit for modern heavy music, it captures the polished aggression, clarity and depth that define his productions, from tight, articulate rhythms to atmospheric cleans and mix-ready leads.

  Daniel's pack contains 30 captures.
