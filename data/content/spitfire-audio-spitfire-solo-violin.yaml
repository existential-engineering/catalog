details: |-
  Our most detailed and advanced solo violin to date has been performed by world-renowned virtuoso concert violinist Jack Liebeck in The Hall at AIR Studios. It contains all of the techniques you need to create an ultra realistic solo performance, including five different types of true legato — fingered legato, bowed legato and portamento legato, runs and arpeggios. It also features spiccato, staccato, tremolo, trills, molto vibrato, progressive vibrato and non vibrato — all combined together to enable musical phrasing without the need for key-switching, and programmed to react to playing speed and touch. Easy to play and intuitive, it allows you to focus entirely on your composition, without the need to 'stitch' together performances. This patch can also be found in our renowned Spitfire Solo Strings library.
specs: |-
  - Single Total Performance patch with 12 articulations
  - Five types of true legato: fingered, bowed, portamento, runs, arpeggios
  - Performed by virtuoso concert violinist Jack Liebeck at The Hall, AIR Studios
  - 3 mic positions (Close, Tree, Ambient)
  - No keyswitching required
  - ~4116 samples
  - 5.4 GB download size
  - 7.00 GB disk space required during install
  - Kontakt Full or Kontakt Player 5.6.8 or higher
  - Spitfire Audio App required
