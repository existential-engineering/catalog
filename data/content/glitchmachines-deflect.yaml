details: |-
  Deflect features 1,179 metallic impact sound effects with a high-tech futuristic aesthetic.

  Sound designer Ivo Ivanov brings us a treasure trove of new metallic impacts, stingers and hits that can be tailored into electronic music elements such as drums, percussion, transitions and special effects or game audio elements such as projectile design, weapon effects, motion cues and much more.

  Deflect comes with 6.3GB of 24bit/96kHz .wav audio content that is equally geared toward music production, game audio and multimedia applications. Whether you're working on a blockbuster sci-fi shooter game, a modern electronic music album or a high-tech multimedia project, you will undoubtedly find this collection to be an indispensable resource.

  While our sound effects are carefully designed to work with your favorite samplers and DAWs, they pair up particularly well with our own brand of audio contortion devices. Our wide selection of packs grant Palindrome, Polygon, Cataract and Tactic users access to thousands of fresh ingredients.
