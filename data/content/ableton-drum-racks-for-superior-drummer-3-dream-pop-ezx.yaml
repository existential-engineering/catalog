description: Ableton Drum Racks for Superior Drummer 3 Dream Pop EZX features
  separate drum racks for use with Ableton live.
details: |-
  Ableton Drum Racks for Superior Drummer 3 Dream Pop EZX features separate
  Ableton drum racks for all factory presets for the toontrack superior drummer
  3 dream pop ezx expansion library. These racks provide out of the box
  integration workflow between Ableton live and toontrack superior drummer using
  the ezx expansions including a host of features ready to use for composition
  and performance using Ableton push or similar controllers.

  All factory presets are ready to go in either single track of multi track
  routing mode using ableton live templates. Amazing workflow in ableton and on
  your push to the full capabilities of the kit library saving setup time and
  allowing you to focus on music creation.

  Ease of navigation to load all dream pop kit factory presets from ableton push
  controller device browser. Colour coded pad design for visual performance and
  finger drumming. All racks use consistent drum rack colouring so you can
  visually and immediately spot your rides from your hi hat articulations.

  Ableton macros mapped to toontrack superior drummer macros with preset values
  for ease of use in push and simple to use automation programming. Singleout
  presets provide 29 ableton drum racks for all dream pop ezx factory presets
  with single audio output to a single ableton track. Multiout presets feature
  29 ableton drum racks for all presets in multiple audio channel output from
  the superior drummer 3 output channels into multiple ableton audio tracks
  using the multi output ableton template.

  Use the template racks and extend to your own toontrack superior drummer 3
  dream pop ezx presets, swapping out individual sounds or articulations. You
  are 100% ready to go with the factory presets but there is no limitation to
  creating your own presets from these templates.
specs: |-
  - 58 Ableton drum racks
  - Single track routing mode
  - Multi track routing mode
  - Ableton push controller support
  - 64 pad layout mode
  - Colour coded pad design
  - Individually labelled drum rack pads
  - Audio routing and mixing
  - Ableton macros mapped to toontrack superior drummer macros
  - 29 singleout presets
  - 29 multiout presets
  - Multiple audio channel output
  - Ableton live templates
  - macOS and Windows compatibility
