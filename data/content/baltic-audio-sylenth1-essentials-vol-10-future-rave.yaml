details: |-
  'Sylenth1 Essentials Vol 10 - Future Rave' is a royalty-free preset and MIDI pack for LennarDigital Sylenth1, designed for modern Future Rave, EDM, Bigroom, Dance, Techno-inspired festival sounds and club-oriented electronic music.

  The pack includes 64 Sylenth1 presets and 52 MIDI files taken from the demo, covering ready-to-use leads, basses, plucks, pads, synths and FX for dark festival drops, powerful hooks, driving basslines, melodic breakdowns and full Future Rave arrangements.

  Requirements: LennarDigital Sylenth1 v3.06 or higher is required.

  Please note: drums and some FX used in the demo are not included.
specs: |-
  - 64 Presets for Sylenth1
  - 28 Leads (Presets)
  - 15 Basses (Presets)
  - 13 Plucks (Presets)
  - 4 Pads (Presets)
  - 3 Synths (Presets)
  - 1 FX (Presets)
  - 52 MIDI files
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
  - Requires LennarDigital Sylenth1 v3.06 or higher
