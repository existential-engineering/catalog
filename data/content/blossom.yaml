description: Blossom by Audiowarp - the ultimate ambient Kontakt synth now for
  Kontakt 5.7.1 inspired by old tapes in the attic, the golden age of analog...
details: |-
  Inspired by old tapes in the attic, the golden age of analogue synths worn
  down by the hands of time and a true love of pushing the boundaries of what
  analogue can do, Blossom by Audiowarp is the result of years of recording,
  re-recording and twisting countless numbers of vintage synths to produce
  something truly unique that's become Audiowarp trademark sound.

  All the sounds within blossom were recorded and post affected using only
  vintage outboard analog equipment. We took vintage analog synths and using
  various recording and post production methods such as tape compression and
  artifact manipulation we created an entirely new set of amazing, unique
  sounds.

  Dusty, ghostly, sombre and distant these sounds can only be created in the
  analog world.

  Blossom features 4 individual sound sources which can be blended and
  manipulated in various ways. Using the central xy pad you can dynamically
  morph between layers. Alternatively use the x and y dials to constrain to
  horizontal or vertical axis only. Assign a cc controller to the x or y dials
  for instant fun:).
specs: |-
  - Kontakt 5.7.1 or above required
  - 4 individual sound sources
  - Xy pad morphing
  - X and y dials
  - Cc controller assignment
  - Tape compression
  - Artifact manipulation
  - Vintage analog synthesis
