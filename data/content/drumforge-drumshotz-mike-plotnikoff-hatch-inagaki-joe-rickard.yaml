description: A one-shot drum sample collection from rock producers Mike Plotnikoff, Hatch Inagaki, and Joe Rickard, with 34 kick, 36 snare, and 18 tom samples for chart-oriented rock mixes.
details: |-
  Producers Mike Plotnikoff (The Cranberries, Three Days Grace, Warbringer, Buckcherry), Hatch Inagaki (Otep, MIYAVI, Rascal Flatts, Kelly Clarkson), and Joe Rickard (In Flames, Apocalyptica, 10 Years) teamed up with Drumforge for this set of one-shot drum samples. Between them the trio is partly responsible for the drum sounds on many top-charting rock records over two decades.

  Drumshotz is a series of drum samples sourced from professional mixers, meant to enhance, blend, or replace drum sounds in a mix. One-shot samples supply the punch and consistency needed to cut through, which is how a mixer achieves a signature drum sound regardless of the quality of the source recording.

  The pack ranges from foundational go-to samples to unique textural blends intended to add another dimension, punch, and power to a mix.
specs: |-
  - Signature sample collection of One-Shot Drum Samples from producers Mike Plotnikoff, Hatch Inagaki, and Joe Rickard.
  - Wav Samples in 44.1 kHz, 24 bit format.
  - For use with any triggering program or DAW
  - 34 Kick, 36 Snare, and 18 Tom samples.
