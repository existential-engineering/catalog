details: >-
  1960s drums is a collection of acoustic drum loops for funk, soul, swing, and
  heavy rock music productions.


  Recorded on magnetic tape for that extra vintage flavor, 1960s drums has been
  recorded using the same drum miking methods used in the sixties.


  The sample pack features drum loops in a wide range of tempos going from 60bpm
  to 260bpm and high-definition drum one-shots for your sampler.
specs: |-
  - 337 drum loops (24-bit 48 khz)
  - 125 one-shots (24-bit 96 khz)
  - Wav and rex2 format
  - Royalty-free
  - 60bpm to 260bpm tempo range
  - Recorded to tape using the miking methods of the sixties
  - 647 mb of hd space required
  - Software that reads 24-bit wav files required
