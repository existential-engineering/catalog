details: |-
  BVKER's free Ableton racks come with 9 racks for mixing, mastering and sound design. They further contain an 808 bass instrument rack, which is based on Ableton's operator and a chord rack automatically creating triads in key.

  Audio effect racks: 1 knob wash out, easi sidechain, gain rack, lofi rack, mastering rack, reverb rack, sauce rack, soft clipper, vocal rack.

  Instrument racks: easi 808. MIDI effect racks: basic chord rack.

  Since not every rack makes use of all plug-ins, most can be used with ableton live standard.
