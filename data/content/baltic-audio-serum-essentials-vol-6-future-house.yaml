details: |-
  'Serum Essentials Vol 6 - Future House' is a royalty-free preset and MIDI pack for Xfer Serum, designed for modern Future House, EDM, Dance, Progressive House and Bigroom productions.

  The pack includes 64 Serum presets and 51 MIDI files taken from the demo, giving ready-to-use leads, basses, plucks, synths, keys, chords, FX, sequences and ambient sounds for energetic drops, melodic hooks, club-ready basslines and full Future House arrangements.

  Requirements: Xfer Serum v1.3.2.8 or higher is required.

  Please note: Drums and some FX used in the demo are not included.
specs: |-
  - 64 Presets for Serum
  - 16 Leads (Presets)
  - 16 Basses (Presets)
  - 10 Plucks (Presets)
  - 5 Synths (Presets)
  - 5 Keys (Presets)
  - 4 Chords (Presets)
  - 3 FX (Presets)
  - 3 Sequences (Presets)
  - 2 Ambients (Presets)
  - 51 MIDI Files
  - Multi-genre
  - PC/Mac Compatible
  - 100% Royalty-Free
