description: Albion Iceni stands out as a revolutionary assortment of awe-inspiring sounds, meticulously curated into a cutting-edge collection. This extraordinary package boasts epic low-end brass and electrifying woodwinds, harmonised with a string ensemble comprising an extensive range of cellos and basses, delivering both graceful legatos and commanding staccatos.
details: |-
  Albion Iceni caters to the creative vision of composers and music producers who seek to craft immense and foreboding low-frequency sounds, evoking the atmosphere of dystopian futures or the chaos of a raging battlefield. This exceptional collection is perfect for creating cinematic scores, game soundtracks, and epic compositions in the realms of rock, pop, and electronic music.

  The Iceni Sessions cover winds (2 contra bassoons, 2 contrabass clarinets, heckelphone, 2 bassoons, 2 bass clarinets, 1 bass saxophone), brass (2 tubas, 2 cimbassi, 2 contra bass bones, 3 bass bones) and strings with no violins or violas but 24 celli and 8 basses, recorded both tutti and in two celli sections with the celli split either side of the room and the basses in the middle. The orchestral toolset is primitively simple and effective, with longs, legatos and shorts plus mind-boggling FX in the brass and woods.

  Brunel Loops III features over 300 fat, grimy, epic, mangled loops by UK-based producer-programmer-composers including The Flight, Stanley Gabriel and Christian Henson. Darwin III is a percussion collection of the most expansive and deepest drums made available in London, including exceptionally rare British marching toms played by the leader and members of the drum corps from the London Olympic opening ceremony.

  Stephenson's Steam Band III draws on the orchestral sessions and vintage analogue equipment from the 60s and 70s, including processors that once belonged to Jimi Hendrix, to unleash the deepest array of synth patches in the collection, with contemporary vowel and notch filters for bone-rattling, full-bandwidth bass tones.

  Iceni was recorded in Lyndhurst Hall at AIR Studios, the recording space behind scores including Harry Potter, Stranger Things, Elvis, Gladiator and Interstellar, and games such as Star Wars Jedi: Survivor, God of War Ragnarok and Spider-Man. The interface offers an overview panel showing all playing techniques with a microphone mixer, a general controls panel for deeper control and technique purging, and The Ostinatum pattern sequencer for instant ostinato creation.
specs: |-
  - Requires Kontakt 5.6.8 or higher, includes Kontakt Player (free download)
  - Spitfire Audio App required for installation
  - 4 microphone signals: close, tree, ambient, outrigger
  - Iceni Sessions woodwinds: lo shorts, shorts extras, longs, legato, rips down, rips up, FX 1-4
  - Iceni Sessions brass: lo shorts, longs nasty, longs, legato, rips down, rips up, FX 1-4
  - Strings: 24 celli and 8 basses, no violins or violas, recorded tutti and as two separate celli sections
  - Darwin Percussion III: taiko, bass drums, table taiko, medium low taiko, orange drum, small taikos
  - Brunel Loops III: over 300 loops between 65 and 145 bpm
  - Stephenson's Steam Band III synth patches, pads and oscillators
  - The Ostinatum pattern sequencer
  - Recorded at Lyndhurst Hall, AIR Studios
  - macOS 11 to macOS 26 (Kontakt 8.8 requires macOS 14 minimum), Intel and Apple Silicon supported
  - Windows 10 or Windows 11, 64-bit, latest service pack
  - Minimum 2.8GHz quad-core i5 or AMD Ryzen 5 with 8GB RAM
  - Recommended 2.8GHz six-core i7 or AMD Ryzen 7 with 16GB RAM
  - 32-bit systems are not supported
  - 15.5 GB download size, 31.00 GB disk space required during install
