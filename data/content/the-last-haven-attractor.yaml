description: Attractor is a comprehensive Kontakt library for the composers and
  producers of soundtracks, cinematic and trailer music.
details: |-
  Attractor library contains not only kontakt instruments, but also uncompressed
  wav samples to provide the best usability, whether you prefer to drag-and-drop
  sounds to your DAW or use kontakt.

  On the keyboard in attractor every blue key has a different sample on it. The
  last played key is colored in red. The green range marks the keys for pitching
  samples, and the default pitch key is c0, colored in violet.

  The middle section contains the main controllers and functions of sound
  adjustment. Attack and release knobs manage the respective parameters of
  amplitude envelope. Velocity influence on volume is controlled with velocity
  knob. Gate and rate knobs adjust the settings of rhythmic sound interruption.

  In attractor you can instantly adapt samples to your host tempo. Enable tmpro
  mode and use speed knob to do it. Also attractor interface allows you to get
  all samples reversed and map the last played sample across 5 octaves with wide
  range function. The effects section in attractor has 6 slots. All effects are
  interchangeable, so you can build your own effect chain.
specs: |-
  - Kontakt 5.8 or above required

  - 1928 samples (wav format)

  - 5 nkis (effects, drums, melodic elements, pulses [stretched], pulses
  [sliced])

  - Attack and release envelope controls

  - Velocity knob

  - Gate and rate knobs

  - Tmpro mode with speed knob

  - Wide range function (5 octaves)

  - 6-slot effects section with interchangeable effects

  - Internal mini-browser

  - Waveform display with visual offset controller

  - Sample reversal capability

  - Tempo adaptation

  - Not compatible with kontakt player
