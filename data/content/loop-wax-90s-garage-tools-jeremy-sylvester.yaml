details: |-
  Loop Wax presents '90s garage tools' by jeremy sylvester. An awesome
  collection of jeremy's personal sound collection converted from his old akai
  s3000xl sampler he used to create his vast catalogue of tracks stemming back
  from the early nineties when uk garage was first conceived.

  This exclusive pack is very special indeed, containing drum sounds, drum
  loops, drum kits, speed garage drum construction drum kits, old skool chord
  one shots, nu skool chord one shots, bass, fx, vocals, hits, stabs, glitches
  and so much more.

  90s garage tools is the first of a series of packs by jeremy sylvester due to
  come out exclusively on loop wax throughout the year.

  If you are looking for 'raw' underground sounds to inject life into your
  productions, then this pack is meant for you 'with your name on it'. Get the
  real underground sound of uk garage/house from one of the pioneers of the
  genre.

  Jeremy sylvester explains 'how to make 90s garage music' in ableton using
  elements from his brand new sample pack '90s garage tools'.
