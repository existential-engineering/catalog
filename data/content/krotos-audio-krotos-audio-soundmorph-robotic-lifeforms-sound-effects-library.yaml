description: One of the largest collections of robot sounds ever created, featuring everything from small bots to massive automatons, with transforms, morphs, and servos included. Designed by award-winning sound designers from Electronic Arts and BioWare. Ships with an integrated Weaponiser library (28 presets) and an integrated Reformer Pro library (100 sound packs).
details: |-
  Robotic Lifeforms by SoundMorph is one of the largest collections of robot sounds ever created. Krotos adapted this extensive collection to work straight out of the box in two of its plugins, offering the robots even more power than the original.

  From small bot sounds to massive automatons, including transforms, morphs and servos, Robotic Lifeforms was designed by former Electronic Arts and BioWare award-winning sound designers.

  Featuring 2,694 files, this collection offers a wide-ranging 5.88 GB (Weaponiser) and 3.75 GB (Reformer Pro) selection of royalty-free SFX components, ideal for any trailer, post-production, game-audio and sound design project.

  Sound categories included in this library: Alien, Computer, Servo and Digital. Keywords span computer, calculate, alien, drill, grinder, electricity sparks, mech, bots, morph mech, power up, servo, motor, hi-tech, synth bass talker, transform digital and vocal cubot.

  "Robotic Lifeforms is the result of over one entire year of field recordings, research, and in-depth sound design. It was one of the most challenging and rewarding collections I've ever made." - Jason Cushing (SoundMorph / Co-Founder)
