details: |-
  Modern. Atmospheric. Ear Candy. In the realm of cinematic sound, Terminus is a symbol of innovation for Hybrid Cinema . After 18 months of meticulous craftsmanship, the result is a sound that is big, modern, and studio-clean, with everything mastered to perfection . Across its four core instrument groups – Percussive/Drums, Epic/Hybrid, Neo-Orchestral, and Synth. All four core groups each contain seven banks: Hits, Slams, Sub Hits, Short and Long Falls, and Short and Long Risers. Terminus offers a kaleidoscope of meticulously sculpted sounds, each polished to perfection. However, Terminus transcends the realm of traditional sound libraries. With features like Ear Candy and Strums, Ear Candy is designed to enhance your existing compositions with big, beautiful, ethereal and angelic textural elements, and Strums which are tonal and a-tonal transitional elements create a transparent, colorful movement of cinematic textures. In Soundpaint, Terminus is organized with 6 sub-directories - Hybrid, Orchestral, Percussive, Synths, Sound LabsBanks, and Sound Labs Single Notes - that optimize organization and expand the Sounds of Terminus beyond what was originally imagined. Terminus embodies the spirit of evolution in cinematic sound, ushering in a future where boundaries dissolve and creativity reigns supreme.
