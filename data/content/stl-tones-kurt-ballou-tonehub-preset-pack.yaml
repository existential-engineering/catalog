details: |-
  Kurt Ballou is a musician and producer based in Massachusetts, known equally for his work as the guitarist in Converge and for his extensive production work at his own God City Studio. From abrasive extreme music to brooding gothic soundscapes, he brings a distinct and organic flavor to anything he touches.

  His extensive amp collection and 'best of both worlds' digital-meets-analogue approach to production can be heard on albums by Every Time I Die, Four Year Strong, The Dillinger Escape Plan, Misery Index, Stray From The Path, Nails, High On Fire and Beastmilk, as well as Converge's own back catalogue up to and including Bloodmoon: I .

  This expansion pack brings that amp collection and Kurt's approach to sculpting guitar tone to the ToneHub platform.
