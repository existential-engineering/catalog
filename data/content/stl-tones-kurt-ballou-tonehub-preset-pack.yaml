description: "Kurt Ballou is a musician and producer based in Massachusetts.
  Known equally for his work as the guitarist in Converge, as for his extensive
  production work at his own God City Studio, Kurt Ballou is an authority on
  sculpting the tone of underground music. From abrasive extreme music to
  brooding gothic soundscapes, Kurt brings a distinct and organic flavor to
  anything he touches. His extensive amp collection and ‘best of both worlds’
  digital meets analogue approach to production can be heard on albums by Every
  Time I Die, Four Year Strong, The Dillinger Escape Plan, Misery Index, Stray
  from the Path, Nails, High On Fire, Beastmilk, and of course Converge’s own
  back catalogue up to and including their latest release: Bloodmoon I."
