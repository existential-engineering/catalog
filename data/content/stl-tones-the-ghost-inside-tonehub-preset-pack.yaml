details: |-
  Zach Johnson and Chris Davis are the guitarists of The Ghost Inside, the Los Angeles metalcore band who have become one of the most respected and resilient acts in modern heavy music.

  Captured at a state-of-the-art studio in Nashville using four of Zach and Chris's go-to guitar amp, cab and pedal setups, this signature collection caters for all of their playing styles, whether in a studio environment or for live shows.

