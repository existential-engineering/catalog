description: BFD Sabian Digital Vault is a diverse collection of cymbals and
  hihats from the sabian archives for bfd3, bfd eco and bfd2.
details: |-
  Bfd sabian digital vault includes hhx and AAX series favourites alongside
  unique stacked cymbal setups, esoteric percussion cymbals and 4 hyper-detailed
  hihats. Selected instruments are also presented in mallet and brush versions.

  Recordings were conducted by sampling guru john emrich with an emphasis on
  inspiring new and exciting cymbal parts.

  Bfd sabian digital vault comes complete with kit presets using factory drums
  in bfd3, bfd eco and bfd2.
specs: |-
  - Expansion for bfd3, bfd eco and bfd2
  - 41 instruments in total
  - Rides, crashes, splashes, chinas, hihats
  - Percussion, effect and stacked cymbals
  - Mallet and brush versions
  - Hhx and AAX series cymbals
  - Stacked cymbal setups
  - Esoteric percussion cymbals
  - 4 hyper-detailed hihats
  - Kit presets with factory drums
  - Windows 7 or above
  - Os x 10.8 or above
  - Bfd3 v. 3.2.1.2 or above
  - 23 GB disk space
  - Internet connection for download and authorization
