url: https://99sounds.org/drum-samples/
description: 99 Drum Samples II is a free drum sample pack crafted by 99Sounds.
  The library contains 110 drum samples in 24-bit wav format.
details: |-
  The drum samples were sourced from various analog and digital synthesizers,
  acoustic drum kits and percussion, drum machines, and field recordings. The
  library covers a range of music styles, from hip-hop and synthwave to dubstep
  and electronica.

  Some of the gear that was used to capture and process the drum samples
  includes solid state logic ssl 2+, soundcraft signature 12 mtk, moog minitaur,
  mfb 522 drumcomputer, jomox alpha base, arturia drumbrute impact, korg
  electribe er-1, lell uds, yamaha dd-5, nintendo game boy, tascam portastudio
  244, commodore 64, dynacord echocord mini, and more.
specs: |-
  - 110 drum samples
  - 24-bit wav format
  - 44.1 kHz stereo
  - Kontakt instrument patch in nki format
  - 10.45 MB size on disk
  - 8.53 MB download size (zip archive)
