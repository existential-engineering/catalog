description: This OneShot2 expansion captures a dead drum kit that still feels
  fully alive. Every drum is handpicked and shaped with carefully controlled
  dampening, designed for producers and musicians who want their kit to feel
  like a warm, steady hug.
details: |-
  This OneShot2 expansion kit is handcrafted with carefully controlled dampening, designed for producers and musicians who want their drums to feel like a warm, steady hug. Every drum and cymbal was sampled with different beaters and dampening techniques to pull the full character out of the kit. Tonality and sustain control were central to shaping this dry, soft pop sound.

  Inspiration strikes when you least expect it – so with this mix-ready kit, you won't need to hunt for another great-sounding drum set. The innovative Motion Engine in OneShot2 lets you play or program naturally occurring sounds like rolls, swells, and brushstrokes, so the kit feels human, not sampled.

  You get everything from a precisely damped kit, to a soft but confident brush kit, to a short, hard-hitting stick kit. Processed presets are also included for a more electronic feel, giving you a wide selection of drum sounds for any production.

  Recorded at The Royal College of Music in Stockholm, Studio 2 – a fully equipped recording facility. Carefully selected drums, captured through SSL Origin preamps, shaped with colored EQ and top-tier studio microphones.
specs: |-
  - 20 presets, 61 unique slots (both oneshot and motion slots)
  - One full drum kit, plus extra kick, snare and hi-hat
  - Recorded with different beaters (stick, mallet, brush), both damped and not damped
  - 2425 total samples
  - Requires a license of OneShot2
  - Only compatible with OneShot2
  - macOS/Windows
