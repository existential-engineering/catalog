details: |-
  Art Conductor for Logic Scripter is a MIDI script for Logic Pro x and it is
  super easy to customize - without knowledge of computer programming.

  It enables time line based switching of instrument articulations. The
  articulations show up with their real names overlaying a part like any other
  automation lane.

  The script was designed especially with musicians in mind and requires no
  technical expertise to be setup for a specific instrument.

  It supports both key switching by MIDI note and spitfire uacc controllers.

  This is a legacy product for logic 10.3. - no updates to this product will be
  available in the future.
specs: |-
  - MIDI script for Logic Pro x
  - Timeline-based articulation switching
  - Key switching by MIDI note
  - Spitfire uacc controllers support
  - Customizable without programming knowledge
  - Real-time articulation automation lanes
  - Legacy product for logic 10.3
