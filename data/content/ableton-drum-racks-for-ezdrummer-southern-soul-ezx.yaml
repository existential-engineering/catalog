details: >-
  Timbresandtones ableton drum racks for ezdrummer southern soul ezx features
  separate ableton drum racks for all factory presets for the toontrack
  ezdrummer southern soul ezx expansion library. These racks are the most
  complete integration between ableton live and toontrack ezdrummer including a
  host of features ready to use on ableton push.


  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all southern soul kit factory presets from ableton
  push controller device browser. 26 ableton drum racks to instantly load the
  factory library "mix ready" presets with ableton mappings.


  All instrument articulations ready to go in one layout using ableton push 64
  pad layout mode. Individually labelled drum rack pads for clear visualisation,
  post performance editing and automation to all drum rack / instrument
  articulations in ableton.


  Ableton macros mapped to toontrack ezdrummer macros with preset values for
  ease of use in push and simple to use automation programming. Ableton macros
  are color coded to match the ezdrummer display. Audio routing options.


  Use the template racks and extend to your own toontrack ezdrummer southern
  soul ezx presets, swapping out individual sounds or articulations. You are
  100% ready to go with the factory presets but there is no limitation to
  creating your own presets from these templates.
specs: |-
  - 26 ableton drum racks
  - 13 ableton live templates
  - Ableton push 64 pad layout mode
  - Color coded pad design
  - Individually labelled drum rack pads
  - Ableton macros mapped to toontrack ezdrummer macros
  - Singleout presets with single audio output
  - Multiout presets with multiple audio channel output
  - Track level audio mixing control
  - Ableton live 9.5 or above
  - Toontrack ezdrummer2 required
  - Southern soul ezx expansion library required
