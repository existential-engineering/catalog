details: |-
  BFD Horsepower is an expansion for bfd3 with authentic mix-ready
  americana-style drum sounds for a wide range of genres from blues and
  alt-country to garage rock and folk.

  The included gretsch usa custom kit, sabian hats and zildjian cymbals are
  recorded with a perfect balance between vintage dirt and modern punch.

  Bfd horsepower's stick and brush kits are presented in 2 distinct processing
  styles alongside an unprocessed version. The result is a total of 6 kits
  instantly usable and inspiring in varied songwriting and production settings,
  with high levels of detail for maximum playability with electronic drums.

  The personality of the sounds stems from drum treatment, mic and processing
  techniques. Warm ribbon-mic room ambience is accompanied by several
  'character' channels with saturated vintage tones, custom plate processing and
  even a unique trash can mic for lo-fi dirt.

  Snares were damped with paper and tea towels with the rest of the kit left
  untreated and tuned to the room for an open and vibrant sound that
  effortlessly slots into your mixes.
specs: |-
  - Gretsch usa custom kit with 3 toms
  - Sabian hats
  - Zildjian cymbals
  - Gretsch snare with snares on and off
  - Stick and brush kits in 3 versions each
  - 6 total kits
  - Character mics
  - Ribbon-mic room ambience
  - Saturated vintage tones
  - Custom plate processing
  - Trash can mic
  - Paper and tea towel damped snares
  - Unprocessed version
  - 2 distinct processing styles
  - High detail for maximum playability with electronic drums
