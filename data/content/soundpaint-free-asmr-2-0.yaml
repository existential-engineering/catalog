details: |-
  Free ASMR

  Free ASMR is a truly unique instrument, created in collaboration with our incredibly generous community. We asked for ASMR submissions so we could all explore and experience these wonderful synesthesia-inducing sounds together. Thanks to you, we collected over 8 GB of content, including everything from human whispers to woody rattles and papery crunches, to metallic scrapes and ceramic grit, to countless other truly inventive sounds. The Free ASMR library will usher your audiences into sensations beyond simply hearing music, and filmmakers can now enrich their scores with new levels of psychoacoustic storytelling. Together, these unique ASMR recordings and Soundpaint create an amazing Swiss army knife, enabling you to create layers of heightened emotion within your sonic landscapes. ASMR is short for Autonomous Sensory Meridian Response. It creates a tingling physical sensation based on the sounds you hear. These recordings are normally intended to be heard with headphones, but they can also add a fantastic variety of textures when used in musical contexts.
