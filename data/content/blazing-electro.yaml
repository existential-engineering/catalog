details: |-
  Welcome to the sounds of Blazing Electro. Our team of expert producers and
  composers have diligently masterminded this exclusive range of saw
  oscillators. Thereby extending the boundaries within the contemporary music
  genre and bringing you the next generation of samples set to blow up the
  festivals and raves of tomorrow's world.

  Blazing electro is a creation of sounds born by the fusion of old school
  electro beats with a new wave of animated sonic grit. We have worked arduously
  with passion researching both analogue and digital domains for the best side
  chain compressor. This integral component is complemented by the use of
  analogue filters, phasers, ring mod and overdrive.

  The results are a range of samples capturing the transcendental essence of
  this ever evolving genre. Celestial uplifting melodies, stimulating pulses and
  spirited bases take both listener and composer on a journey of bizarre
  exploration.

  Bass - 55 gritty and tenebrous accentuated by tinges of distortion and bit
  crusher at the high end. Drums - 150 static, crisp, bouncy strokes and deep
  penetrative kick drums create a solid foundation for motion and in any track.
  Efx - 59 ethereal and opulent weaving tones, transporting the listener through
  multidimensional spheres. Hits - 228 clean, tight and punchy percussive
  elements channelled from the spirits of otherworldly futuristic robotic
  tribes. Synths - 57 swooping fm synths add texture and fluidity creating
  movement within your composition and the dance floor.

  Loops come in acid, apple loops, rex and stylus rmx formats. Drum hits patches
  for exs24, kontakt, battery, nn-tx and halion. All formats included with a
  single purchase. Samples are both key and tempo labelled.
