details: >-
  12 gods: hestia for spectrasonics omnisphere 2 is the final soundbank of 12
  gods series. All presets here were influenced by the discreet goddess of
  hearth according to greek mythology pantheon. Each one refers to myths,
  epithets and persons connected with hestia.


  Those 50 sounds are calm keys and many of them have the same sonic
  characteristics with minor differences derived from modulation sources,
  especially ring modulation and frequency modulation are heavily used.


  Some of them sound like a classic electric piano and some other have more
  experimental dimensions.


  Mw is assigned to vibrato and at to pitch modulation.


  Patches were created with omnisphere 2.8 and run best with this or newer
  edition: software 2.8.4d. Soundsources v2.6.1c. Patches v2.8.1c.
