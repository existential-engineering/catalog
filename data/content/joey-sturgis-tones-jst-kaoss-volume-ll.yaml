details: |-
  JST Kaoss Volume II is an extensive, all-encompassing post-production sample pack exploding with intense royalty-free sounds designed to add a little chaos to your productions.

  Featuring 200+ different samples divided into seven categories, with additional organization by BPM and key for some samples, adding an extra layer of creativity to your songs is easier than ever.

  Searching for samples or trying to make your own when you are in the middle of creating can really kill the moment. Keep that spark of creativity with the sounds of JST Kaoss Volume II.

  Whether you need to add excitement or energy to a transition, support a breakdown with extra thickness, or rise up and slam into a hard-hitting chorus, JST Kaoss Volume II has your production needs covered.
