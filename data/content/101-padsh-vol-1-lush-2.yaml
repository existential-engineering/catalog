details: |-
  101 padsh vol.1 contains 50 classic synth pads for d16 lush 2 synthesizer. All
  sounds are inspired by classic 80's and 90's synth sounds and they are very
  versatile in terms of music genres.

  Where they really shine are in new age, synthpop, synthwave, pop music and
  early electronic styles.

  This soundbank is the first volume of 101 padsh. The next 51 pads presets will
  be released in the second volume of the series.

  All presets were designed with lush 2 version 2.0.0 and run best in this or
  newer edition.
specs: |-
