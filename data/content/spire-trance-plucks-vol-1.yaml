details: >-
  Spire trance plucks vol. 1 is a collection of 100 presets that captures the
  sound of 90s rave, classic, and uplifting trance.


  You'll find a large and diverse selection of fresh vintage and modern trance
  plucks all in one place.


  Among every preset having modwheel assignments, each preset is assigned all
  four macro controls programmed so you can easily tweak your favorite sounds to
  customize and modulate them just the way you want.


  Spire trance plucks vol. 1 is the perfect creative tool for any producer
  looking to bring a quality trance sound to their productions.
