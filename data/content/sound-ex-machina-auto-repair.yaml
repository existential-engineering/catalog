details: |-
  The Auto Repair (248 hq 96khz/24-bit) library includes both tools and general
  ambiences of Auto Repair shops as well as home garage sounds. Hit play, close
  your eyes and you will find yourself amidst cars, toolboxes, revving engines,
  mechanisms, servo sounds, metal clunks, and car mechanics in action.

  In this library, you will find audio samples of wrenches and ratchets being
  dropped on various surfaces and with various intensities, different kinds of
  metal clunk and mechanical motions, as well as audio of mechanics operating
  hydraulic machines and servomotors, handling screwdrivers, welding and
  hammering chassis, handling screwdrivers/ pneumatic pistols and
  sawing/scraping metal auto parts. All captured in real garages and auto repair
  shops.

  In addition to the sounds mentioned above, there is a variety of clean, studio
  recordings of hand tools and metal parts that can be used as starting points
  for further sound design. Sound ex machina had cars and bikes brought in,
  which they used to record a series of engine startups/shutdowns, idling, and
  revs which might serve as starters for creating multilayered, compelling
  atmospheres.

  All sounds have been carefully edited to remove unnecessary environmental
  sounds and voices. All files have comprehensive filenames and descriptive
  metadata produced using the soundminer asset management tool.

  What's in the pack: isolated sounds of tools being dropped, picked up and
  handled. Working auto repair shop ambiences. Hydraulic machines,
  air-compressors, and power tools in action.
specs: |-
