details: |-
  The ppg wave 2.2 is an iconic and very special sounding synth. The 8 bit
  wavetables through ssm2044 analog filters give it a unique digital yet warm
  sound.

  All the sounds have been recorded through lots of tasty hardware, including
  the fat bustard valve mixer, electrodyne & neve pres, eventide h3500, bricasti
  m7 and more. Expect fizzy, warm synth sounds with tons of character.

  The pack includes fully formed synth patches as well as raw wave oscillators.
  This gives you tons of versatility! The wave oscillators are perfect raw
  material for your own creations.

  The packs come with patches for kontakt, logic exs24, ableton live simpler,
  tal-sampler and the prophet x/xl. The kontakt version has a nice gui to make
  tweaking easy and rewarding.

  Every sampler has a different sound to it. So each format will differ to the
  others. The raw sounds however all sound the same in each format.
specs: |-
  - 8 bit wavetables
  - Ssm2044 analog filters
  - Fully formed synth patches
  - Raw wave oscillators
  - Kontakt patches
  - Logic exs24 patches
  - Ableton live simpler patches
  - Tal-sampler patches
  - Prophet x/xl patches
  - Gui interface
