description: Vibrascape presents vibraphone sounds arranged as rhythmic patterns
  that create hypnotic soundscapes, with sustained bowed vibraphone chords and
  rhythm machine special effects.
details: |-
  Like our popular PIANOSCAPE disc, VIBRASCAPE presents the sound of the vibraphone in a uniquely Optigan fashion. The keyboard tones are arranged as rhythmic patterns that create hypnotic, pulsating soundscapes when multiple keys are played. (This disc is not particularly suited to melodic playing). The chord buttons feature sustained bowed vibraphone chords. The special effects switches keep the groove going with rhythms from the Maestro Rhythm King MRK-2, a rhythm machine from the Optigan era. SPECIAL EFFECTS SWITCHES: 1. Samba, 2. Rumba, 3. Bossa Nova, 4. Bolero, 5. Go-Go. LEFT HAND: Bowed Vibraphone. RIGHT HAND: Vibraphone Rhythms. Vibraphone played and recorded by Mark Greenberg. Music produced, edited, and mastered by Pea Hicks. Disc creation software, disc production cover artwork and jacket layout by Robert Becker. Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility
