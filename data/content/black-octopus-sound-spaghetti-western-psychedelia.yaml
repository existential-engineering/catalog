details: |-
  Spaghetti Western Psychedelia by Basement Freaks is a 70s cinematic sample pack aimed at spaghetti western and psychedelic productions. It is riddled with guitars, some with creative distortions and some saturated in the perfect balance, plus beats to sit under any riff.

  Alongside the guitars and drums the pack carries organs, horns, bass, synths and keys, providing extra musical elements to fuse together for western psychedelia on any track. Those loops are paired with one shots of guitar, FX and instruments.

  Basement Freaks and Thanasis Dzingovic played and recorded the instruments for a true analog sound. The material suits retro and modern music styles alike, as well as scoring film.

  The pack draws on influences such as Ennio Morricone, Clint Eastwood, Tarantino, Carlos Escobar, Kraftwerk and the Woodstock Festival.
