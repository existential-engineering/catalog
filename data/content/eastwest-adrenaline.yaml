details: |-
  Adrenaline is a distinctive cross section of all current musical styles with
  only one common theme - the ability to inject vital energy into anything it
  touches.

  Load up one of the presets and you'll see each of the loops mapped out onto
  individual keys in a construction kit format.

  Experiment with the "beat machine" which syncs each multitrack loop to the
  host sequencer. "funkify" your percussion loops with sync delay. For that
  total "other world" dub experience, up the feedback level till it
  self-oscillates.

  Includes a special version of intakt sampler from native instruments (plug-in
  or standalone) for mac and windows specifically designed for loop playback.

  Pumping raw multitrack construction kits of dark, heavy, violent moments
  injected with raging melodies. Chest-stomping industrial beats, and
  tear-your-face-off guitars and trashing cybernetic dance floor jolts.
