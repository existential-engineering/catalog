details: |-
  The darbuka (also known as the doumbek) is a key instrument in arabic music, famous for its sharp, melodic tones and versatile rhythmic potential. With its iconic goblet-shaped body, typically made of ceramic, metal, or plastic, the darbuka is perfect for a wide range of playing techniques from sharp slaps to deep, resonant bass sounds.

  Inside arabic percussion darbuka, you'll find two distinct variations: clay darbuka: known for its warm, earthy tones, it adds a rich, natural feel to your rhythms. Metal darbuka: bright and vibrant, this version brings crisp, energetic sounds, ideal for fast-paced and expressive performances.
