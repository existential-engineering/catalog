description: AutoGrid MIDI Edition is a max 4 live MIDI device, that sends
  random grid synths patterns to 8 different MIDI channels, one note at a time.
details: |-
  AutoGrid MIDI Edition is a max 4 live MIDI device that sends random grid
  synths patterns to 8 different MIDI channels, one note at a time so they never
  play simultaneously. It's a huge timesaver for building interesting patterns
  with different sounds, or sequencing arpeggios or basslines, making sure they
  don't overlap whatsoever.

  Autogrid MIDI offers control of the 8 channels probabilities of playing, time
  allocation control between 4 different note durations (between 1/32 and 8
  bars) including dotted and triplet values, minimum and maximum gate per note,
  and note play probability to insert random silences and play with density.

  The device provides the ability to transpose every note from the root incoming
  note, up or down 2 octaves, with per note degree probability (from 1st to 12th
  note), plus possibility of locking a given octave to root note only, and the
  ability to directly load a given scale to instantly map the note degrees
  probability.

  This device is provided within an ableton template, with tracks structure
  already created for instant use. Just add your instruments on the
  corresponding channels, change the master MIDI clip to the key of your project
  and press play.

  Max 4 live is required to use this device (included with ableton live suite,
  or available as an add-on for other live versions). Compatible with live suite
  10.1.41+, live 11, and live 12.
specs: |-
  - Max 4 live MIDI device
  - 8 MIDI channels
  - Random grid synths patterns
  - Control of 8 channels probabilities
  - 4 different note durations (1/32 to 8 bars)
  - Dotted and triplet values
  - Minimum and maximum gate per note
  - Note play probability
  - Transpose up or down 2 octaves
  - Per note degree probability (1st to 12th note)
  - Octave locking to root note
  - Scale loading capability
  - Fully automatable parameters
  - Looping random engine (1/8th to 16 bars)
  - Selective randomization of device sections
  - Compatible with live suite 10.1.41+, live 11, live 12
  - Ableton template included
  - Universal 2 binary
