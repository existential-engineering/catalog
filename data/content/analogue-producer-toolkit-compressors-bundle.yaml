details: |-
  The Analogue Producer Toolkit & Compressors Bundle combines the analogue Ableton toolkit and analogue compressors live packs together. The 'analogue Ableton' pack is a toolkit produced by minimal system instruments for Ableton live. The pack contains 68 instruments, preset, and racks designed to add analogue character to mixes. Many racks are modelled on actual hardware such as the 1176 and la2a compressors or the bettermaker EQ 230p and blue 1073 eqs.

  The analogue ableton pack aims to create everything needed for a self contained analogue modelled mixing and mastering studio within ableton live, including goodies such as the tb303 instrument and presets for operator.

  The analogue compressors rack pack consists of seven audio effect racks that accurately model real hardware compressors from the minimal system instruments studio. The included racks are modelled on compressors from neve and chandler, as well as vintage boutique hardware full of analogue character.

  The analogue compressors included in the bundle are: boutique english compressor (modelled on a handmade one-of-a-kind compressor from the uk), buzzaudio soc 1.1, chandler germanium compressor, crane song trakker, handbuilt one off 'crush' compressor, neve 2254r, and boutique valve compressor.

  System requirements: this pack requires a pc or mac running ableton live. The product has been tested on versions 7 and 8 without issue.
