details: |-
  Blazing club sounds contains 64 patches for ni Massive targeting melodic
  trance, electro house and minimal techno with a focus on warmer, more fluid
  and uplifting sounds.

  Useful macro controls have been assigned to each patch for maximum expression.

  This soundset ships in both ksd and nmsv formats.

  Genres targeted: house, trance, techno, tech-house, minimal techno, breakbeat.

  Bryan 'xenos' lee has worked as a sound designer for such companies as native
  instruments, cakewalk, rop papen inspiration soundware, refx, camel audio,
  image-line and many more.
