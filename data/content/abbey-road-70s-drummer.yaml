details: >-
  Abbey road 70s drums is the second instrument developed together with the
  iconic british recording studios. Providing two expertly engineered classic
  drum kits for use in the free kontakt player and the full kontakt sampler,
  abbey road 70s drums delivers "the essential punch and flair for typical
  seventies sound aesthetics and various modern music styles".


  At the heart of abbey road 70s drums are two sought-after drum kits of the
  seventies, a premier and a ludwig, both painstakingly recorded in abbey road's
  legendary studio two renowned for its unique acoustic properties. While the
  ludwig kit provides the typical big and roomy sound that is a hallmark of many
  classic rock songs of the seventies, the premier kit was recorded in a
  deadened environment within the famous studio to create a tight and punchy
  tone that also lends itself to r&b, disco and other contemporary genres.


  All samples were captured using abbey road's engineering expertise and arsenal
  of vintage equipment. Classic microphones from the studios' famed collection,
  the exclusive emi tg mixing desk, an analog 2-inch tape machine and other
  authentic outboard gear all contribute to the "charismatic and genuine" sound
  of abbey road 70s drums.


  Up to 34 velocity layers per instrument with up to six additional variation
  samples guarantee ultimate authenticity both for rhythm programming and for
  real-time MIDI-controlled playing, with a selection of different MIDI mappings
  accommodating the established layouts of various popular electronic drum kits
  and third-party drum libraries.


  Separate "vintage" and "modern" microphone setups provide a choice between
  classic and contemporary tone, with the ludwig kit also offering an optional
  "glyn johns" configuration, a technique used for some of the most acclaimed
  drum recordings of the seventies era.
