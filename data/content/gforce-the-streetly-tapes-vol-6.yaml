details: |-
  The Streetly Tapes Vol 6 is a collaboration between GForce Software and Streetly Electronics, the company that originally manufactured the Mellotron. The collection draws directly from original EMI tape-stock and original UK 'Tron masters, preserving the authentic character of the classic instrument.

  The highlight of Vol 6 is the Chaos Collection — six banks of previously unreleased experimental recordings (Brass, Choir, Flute, Sax, String Section, and Violins) that capture an unusual, lo-fi side of the Mellotron's sonic history. Alongside these, 18 additional curated banks cover a wide palette from orchestral strings and brass to electric cello, kazoo, wine glasses, and percussion.

  Each tape bank contains 35 notes, and the pack ships with over 150 M-Tron Pro patches. The library is a 631 MB download via GForce's "My Instruments" portal.
