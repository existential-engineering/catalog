details: |-
  The Streetly Tapes – Vol 6 is an add-on for M-Tron Pro. The pack contains many previously unreleased tapes including the experimental ‘Chaos’ Tapes. The idea behind the Chaos Tapes was to take contrasting musicians recording different notes of the same instruments in order to realise a mismatched, but tonally similar performance across the 35 notes. These tapes were never publicly released. However, in testing these within M-Tron Pro, especially when layering them with more uniform tape-banks from the same category, new life and dynamism is breathed into familiar tones.

  Other highlights include an ultra rare Vibrato Flute, Jarring Orchestra (a special mix made for Mr Jarre's '97 world tour when Streetly supplied a MKII), Tony Levin's Electric Cello, two new Custom Orchestra mixes and a new Brass mix. There are other more esoteric tape-banks too, including a Kazoo which never saw light of day for obvious reasons, plus an Ancient Cymbals & Tympani tape-bank, which sounds ridiculously lo-fi.

  The add-on pack includes 24 carefully curated tape banks from the original UK 'Tron masters for M-Tron Pro. These are derived from original EMI tape-stock. The pack also contains over 150 M-Tron Pro Patches.
specs: |-
  - A GForce Software and Streetly Electronics collaboration
