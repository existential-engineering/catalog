description: Ableton drum racks for ezdrummer pop! Ezx features drum racks for
  all presets factory presets for
details: |-
  Ableton drum racks for ezdrummer pop! Ezx features drum racks for all presets factory presets for the toontrack ezdrummer pop! Ezx expansion library. These racks are the most complete integration between ableton live and toontrack ezdrummer including a host of features ready to use on ableton push.

  New in v1.1 multiple audio channel output presets and ableton live multi out template specifically designed for the pop! Ezx library in multi track audio mode using our multiout presets.

  20 ableton drum racks to instantly load the pop! Ezx factory library "mix ready" presets with ableton mappings. Color coded pad design for visual performance and finger drumming. Individually labelled drum rack pads for clear visualisation, post performance editing and automation to all drum rack / instrument articulations.

  Mapped ableton macros to ezdrummer macros with preset values for ease of use in push and simple to use automation programming. Singleout presets featuring 10 ableton drum racks for all factory presets single audio output to single ableton track. Multiout presets featuring 10 ableton drum racks for all presets in multiple audio channel output from the plug in to multiple ableton audio tracks using the multi output ableton template also provided.

  Use the template racks and extend to your own toontrack ezdrummer pop! Ezx presets, swapping out individual sounds or articulations. You are 100% ready to go with the factory presets but there is no limitation to creating your own presets from these templates.
specs: |-
  - 20 ableton drum racks
  - Color coded pad design
  - Individually labelled drum rack pads
  - Mapped ableton macros to ezdrummer macros
  - Singleout presets with 10 ableton drum racks
  - Multiout presets with 10 ableton drum racks
  - Multiple audio channel output
  - Ableton push 2 color pads mode
  - Ableton live 9.5 or above
  - Toontrack ezdrummer2 required
  - Toontrack ezdrummer pop! Ezx expansion pack required
