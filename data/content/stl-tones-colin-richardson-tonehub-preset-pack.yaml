description: "Colin Richardson is a Grammy Nominated producer who has arguably
  redefined the sound of metal guitars more than once. First in 1993 with
  Carcass’ ‘Heartwork’ album and again in 1994 with Machine Heads ‘Burn My
  Eyes’. Colin has worked with an extensive selection of bands such as Slipknot,
  Cannibal Corpse, As I Lay Dying, Behemoth, Bullet For My Valentine, Cradle of
  Filth, Fear Factory, Sepultura, & Trivium to name a few. Colin teamed up with
  multi-instrumentalist Chris Clancy in 2018, since then the duo have had
  further success working with Machine Head whilst achieving chart hits with
  acts such as Those Damn Crows and Massive Wagons.This pack has been carefully
  designed to incorporate tones that span from the start of Colins career to the
  sound of modern day Richardson & Chris Clancy collaborations.The pack contains
  90 presets from Colins collection of pedals, amplifiers and cab setups, along
  with album tones from some of his most renowned works."
