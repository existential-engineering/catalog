details: |-
  Colin Richardson is a Grammy-nominated producer who has arguably redefined the sound of metal guitars more than once: first in 1993 with Carcass' Heartwork , and again in 1994 with Machine Head's Burn My Eyes . He has worked with Slipknot, Cannibal Corpse, As I Lay Dying, Behemoth, Bullet For My Valentine, Cradle of Filth, Fear Factory, Sepultura, Napalm Death and Trivium.

  Colin teamed up with multi-instrumentalist Chris Clancy in 2018, and the duo have since had further success with Machine Head while achieving chart hits with Those Damn Crows and Massive Wagons.

  This pack has been designed to span tones from the start of Colin's career through to the sound of the modern-day Richardson and Clancy collaborations, drawn from his collection of pedals, amplifiers and cab setups alongside album tones from some of his most renowned works.

  Colin's pack contains 90 captures.
