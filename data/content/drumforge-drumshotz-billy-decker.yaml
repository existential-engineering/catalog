description: Nashville mixing legend Billy Decker's signature collection of mix-ready one-shot drum samples, drawn from a 25 year career and the exact samples used on several number one country records.
details: |-
  Drumshotz Billy Decker is a one-shot drum sample collection curated by Nashville mixer Billy Decker, who has mixed over 15 Billboard certified number one songs for artists including Rodney Atkins, Sam Hunt, Chris Young, Dustin Lynch, and Colt Ford. The 32 samples are drawn from the working library he has refined across a 25 year career.

  The pack leans toward country, though Decker notes that "rockers and metalheads will absolutely love 'em". It covers 6 direct kick samples, 6 direct and 8 room snare samples, and 5 sets of direct toms, so engineers can blend the samples into existing drum recordings or use them as replacements.

  These are the same samples Decker used mixing "Take a Backroad" (Rodney Atkins), "Raised on It" (Sam Hunt), "Losing Sleep" (Chris Young), and "Small Town Boy" (Dustin Lynch). All files are 24-bit / 44.1 kHz for use with any triggering program or DAW.
specs: |-
  - 32 one-shot drum samples total
  - 24-bit / 44.1 kHz format
  - 6 direct kick samples
  - 6 direct snare and 8 room snare samples
  - 5 sets of direct tom samples
  - For use with any triggering program or DAW
