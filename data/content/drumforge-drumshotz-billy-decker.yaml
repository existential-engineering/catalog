description: "Billy Decker is a Nashville mixing legend with over 15, Billboard certified number 1 songs mixed to date. These are some of Billy's most used and loved drum samples from his 25 year career."
details: |-
  Drumshotz Billy Decker is a one-shot signature drum sample collection curated from Nashville mixer Billy Decker's personal library, built over 25 years of professional mixing work. The pack includes 32 samples recorded at 44.1 kHz, 24-bit resolution for professional-grade audio quality.

  The collection is focused towards the country genre, though Billy Decker himself notes that 'Rockers and metalheads will absolutely love 'em!' The samples are the exact ones Billy used to mix multiple Billboard #1 country songs, including tracks by Rodney Atkins, Sam Hunt, Chris Young, and Dustin Lynch.

  Contents include 6 Kick Direct samples, 6 Snare Direct samples, 8 Snare Room samples, and 5 Tom sets of direct samples. All files are delivered as WAV format for compatibility with any DAW or drum triggering software.

  One-shot drum samples are designed to be used with triggering software or loaded directly into any DAW to enhance and reinforce live drum recordings, providing the extra punch and consistency needed to cut through a mix. The pack comes with a perpetual license, free lifetime updates, and unlimited customer support.
