description: The Sounddogs Foley Bundle for Reformer Pro offers a diverse selection of cloth, material and historical-style object Foley sound effects, pre-designed by Sounddogs.
details: |-
  The Sounddogs Foley Bundle by Krotos and Sounddogs offers a diverse selection of Foley sound effects including a huge range of everyday cloth and material, as well as historical-style Foley objects, optimised for designing, automating and performing sound in real-time using Reformer Pro.

  This bundle is a versatile addition to any core library and is ideal for adding realism to a scene, or matching an actor's movements and nuances with SFX. The collection offers a wide-ranging 2.3 GB selection of professionally designed and recorded royalty-free SFX components, ideal for any Foley, post-production, game-audio and sound design project.

  This library was carefully optimised to interact seamlessly with Reformer Pro, a plugin that transforms pre-recorded audio files into performable sound effect libraries in real-time via a microphone, input audio file or MIDI controller.

  Sound categories included in this library: Saw Foley, Chain Foley, Fabric Foley, Mixed Surfaces. Object keywords: 2 Man Saw Foley, Antique Saw Foley, Barrel Drop, Barrel Roll, Chains Drag, Hand Crank Foley, Pulley Antique, Sawing Foley, Sweeping Foley, Wheelbarrow Foley, Wood Plank Creak Foley, BMX Foley, Body Fall Window. Cloth and material keywords: Backpack Handling, Bed Fabric, Car Seat Foley, Cloth Flaps, Cloth Rips, Clothes Hanger Foley, Clothes Nylon, Coins Pocket Foley, Fireman Clothing, Flag Gestures, Metal Fabrics, Parachute Foley, Rain in Coats, Sack Drag, Sail Canvas Foley, Snow Variations, Velcro Foley, Wet Clothes, Windbreaker Foley.
