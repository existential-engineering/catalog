details: |-
  PUMP ORGAN is the antique Estey Harmonium sound previously heard on the vintage Optigan "Gay 90s Waltz" disc, as well as our Orchestron "Harmonium" disc. We renamed the sound for this Panoptigon disc in order to avoid confusion with the Orchestron disc. Also, PUMP ORGAN utilizes the full 5-octave range of the sound as heard on the original master tape. PUMP ORGAN can only be played on Panoptigon, and is not compatible with Optigan or Orchestron. Edited and mastered by Pea Hicks Disc design and mastering by Robert Becker Jacket label art direction and layout by Michael Buchmiller

  Important Note: All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility: Panoptigon disc players
