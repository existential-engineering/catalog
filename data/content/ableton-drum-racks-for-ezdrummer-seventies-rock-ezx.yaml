details: |-
  Ableton drum racks for ezdrummer seventies rock features separate Ableton drum
  racks for all factory presets for the toontrack ezdrummer seventies rock ezx.
  These racks are the most complete integration between Ableton live and
  toontrack ezdrummer including a host of features ready to use on Ableton push.

  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all vintage kit factory presets from ableton push
  controller device browser. 10 ableton drum racks to instantly load the factory
  library "mix ready" presets with ableton mappings.

  5 ableton live templates designed to host the multi channel output routing
  presets with track level audio routing. Color coded pad design for visual
  performance and finger drumming. All instrument articulations ready to go in
  one layout using ableton push 64 pad layout mode.

  Ableton macros mapped to toontrack ezdrummer macros with preset values for
  ease of use in push and simple to use automation programming. Singleout
  presets featuring 5 ableton drum racks for all factory presets single audio
  output to single ableton track. Multiout presets featuring 5 ableton drum
  racks for all presets in multiple audio channel output from the plug in to
  multiple ableton audio tracks using the multi output ableton templates also
  provided designed for the kit presets.

  Use the template racks and extend to your own toontrack ezdrummer seventies
  rock ezx presets, swapping out individual sounds or articulations. You are
  100% ready to go with the factory presets but there is no limitation to
  creating your own presets from these templates.
specs: |-
  - Ableton drum racks
  - 10 Ableton drum racks
  - 5 Ableton live templates
  - Multi-channel output routing
  - Single audio output routing
  - Color coded pad design
  - Ableton push 64 pad layout mode
  - Individually labelled drum rack pads
  - Ableton macros mapped to toontrack ezdrummer macros
  - Color coded Ableton macros
  - Singleout presets
  - Multiout presets
  - Track level audio mixing control
  - Ableton live 9.5 or above
  - Toontrack ezdrummer2 required
  - Seventies rock ezx required
