details: |-
  Howard Benson and Mike Plotnikoff are the producer-engineer duo behind many of the most successful modern rock records of the last 20 years. Their work together spans My Chemical Romance, The All-American Rejects, Hoobastank, P.O.D., Three Days Grace, Daughtry, Papa Roach, Halestorm, Motörhead and Simple Plan. Benson has twice been nominated for the Grammy for Producer of the Year, Non-Classical.

  Using all of Howard Benson and Mike Plotnikoff's extensive collections of gear, we dove deep into creating an extensive pack of guitar tones, ranging from signature captures from some of their biggest releases to custom tones that are sure to blow your minds. Created from Benson's custom collection of vintage gear, this pack gives you an all-access pass to his mix-ready guitar tones.

  The pack contains 23 artist album tone captures based on Benson's most successful releases, and a further 45 captures from his extensive collection of guitar amp and cab combinations.
