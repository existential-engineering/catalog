details: |-
  The 8-bit samples are separated into six sound categories: handguns (shorter
  shots for smaller guns), rifles (bigger intricate shots for larger guns),
  shotguns (sprayed blasts of noise), machine guns (short bursts of bullets for
  repeated use), laser pistols (pew pew and zap sounds), and laser rifles (the
  more heavy duty versions).

  This pack contains 100 8-bit gun samples across all categories and 1 sfx patch
  compatible with multiple platforms.

  8-bit guns is part of the 8-bit sound effects bundle.
specs: |-
  - 100 8-bit gun samples
  - 24-bit, 44.1 kHz wav files
  - Sfx patch for Native Instruments Kontakt
  - Sfx patch for Ableton live
  - Sfx patch for maschine
  - Sfx patch for Logic Pro exs24/sampler
  - Sfx patch for fl studio
  - Sfx patch for mpc expansion pack
  - Sfx patch for tal-sampler
