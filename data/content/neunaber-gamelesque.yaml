description: An Optigan sound disc inspired by gamelan music, featuring
  balafons, marimbas, bells, gated drums and layered stringed instrument sounds
  in 7/8 time.
details: |-
  This is a newly-created groove, inspired by the sounds and patterns of the gamelan, though it's not actually a gamelan. We dug out our vintage 1980s 12-bit samplers in search of punchy balafons, marimbas, bells, gated drums, and other percussive sounds to create hypnotic interlocking patterns on the chord buttons. For example, try playing Bbmaj and Dmin together for a hocketed Bbmaj7 chord. This is the first Optigan disc in 7/8 time, which you can play as-is, or you can get even more rhythmic variety by changing chords in 4/4 time, creating complex rhythmic cycles. The keyboard features intricate rhythmic patterns played on a layered sound created with several different exotic stringed instruments (santur and others), again culled from those old 12-bit sampler libraries. Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility
