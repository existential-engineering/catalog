details: |-
  64 Serum Presets, 46 MIDI Files for FUTURE RAVE and EDM.

  'Serum Essentials Vol 8 - Future Rave' is a royalty-free preset and MIDI pack for Xfer Serum, designed for modern Future Rave, EDM, Bigroom, Techno-inspired festival sounds, Dance and club-oriented electronic music.

  The pack includes 64 Serum presets and 46 MIDI files taken from the demo. You get ready-to-use leads, basses, plucks, pads and FX for building dark festival drops, powerful hooks, driving basslines, melodic breakdowns and full Future Rave arrangements.

  Please note: Drums and some FX used in the demo are not included.
specs: |-
