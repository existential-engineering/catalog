  - 31 Leads (Presets)
  - 14 Basses (Presets)
  - 9 Plucks (Presets)
  - 7 Pads (Presets)
  - 3 FX (Presets)
  - 46 MIDI files
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
  - Requires Xfer Serum v1.3.2.8 or higher
