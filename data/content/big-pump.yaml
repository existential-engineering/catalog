details: |-
  Big Pump is bringing you the most nasty, ignorant, urban sounds with a total
  of 85 high-quality samples and loops including expertly replicated signature
  samples from lil pump & kanye's hit single "I love it." you'll get the classic
  pump noisey distorted 808s, dark & mischievous melody loops, crisp claps,
  sharp snares, iced-out hats, trippy FX, and more.

  Big pump features a wide variety of drum loops and one shots that are great
  for any genre. All of our samples are ready to go right out of the box.

  We created dozens of melody loops and handpicked our 10 favorites to include
  in this pack.

  We made an exact remake of lil pump and kanye west's "I love it" and included
  it in this pack for you break down.

  Every sound in big pump has been painstakingly mixed and mastered so you can
  spend less time compressing and more time creating.
