description: A signature one-shot drum sample pack from producer and mixer Andrew Wade, containing 38 samples in 48 kHz 24-bit format recorded at his studio The Audio Compound, with matching direct and room captures for kicks, snares, and toms.
details: |-
  Drumshotz Andrew Wade is a one-shot drum sample collection from producer and mixer Andrew Wade, whose credits include A Day To Remember, Wage War, The Ghost Inside, Attila, and Motionless In White. The samples originate from his live rooms at The Audio Compound and are the sounds behind a run of gold records.

  One-shot samples are used to enhance, blend with, or replace drum hits in a mix, supplying the extra punch and consistency needed to cut through regardless of the quality of the source recording. Professional mixers typically build such collections over years, and the Drumshotz series packages them directly.

  The pack contains 38 samples in total: five direct kick samples with matching room samples, five direct snare samples with matching room samples, and three sets of toms covering high, mid, and floor toms, each with direct and room captures. The paired room samples add natural depth alongside the direct hits.

  The range spans heavy metal kicks through to pop punk snares, and the samples work with any triggering program or DAW, so they can be mixed and matched with existing sample libraries or raw drum recordings.
specs: |-
  - One-shot signature sample collection from producer Andrew Wade
  - 38 samples total in 48 kHz, 24-bit format
  - 5 direct kick samples with matching room samples
  - 5 direct snare samples with matching room samples
  - 3 sets of toms (high, mid, floor) with both direct and room samples
  - For use with any triggering program or DAW
