description: A signature one-shot drum sample pack curated by producer/mixer Andrew Wade, featuring 38 samples in 48 and 24-bit WAV format designed for triggering programs and DAWs. Recorded at Andrew Wade's professional mixing facility, The Audio Compound, and suited for metal and pop-punk production.
details: |-
  Drumshotz Andrew Wade is a collection of professional one-shot drum samples curated by renowned producer and mixer Andrew Wade. The pack contains 38 samples recorded in 48 and 24-bit formats, intended for use with drum triggering software or any digital audio workstation.

  The kit includes five direct kick samples each paired with corresponding room recordings, five direct snare samples with matching room variants, and three tom sets (high, mid, and floor tom) captured with both direct and room microphone positions.

  Andrew Wade's credits include mixing work for A Day To Remember, Wage War, The Ghost Inside, Attila, and Motionless In White. These samples originate from his professional studio, The Audio Compound, and are designed to deliver genre-leading drum sounds for metal and pop-punk applications.

  One-shot samples are used to reinforce or replace drum hits in a mix, adding punch, consistency, and a professional sonic character regardless of the quality of the original recorded source. The included room samples provide natural depth and space to complement the direct hits.
specs: |-
  - 38 samples total
  - 48-bit and 24-bit WAV format
  - 5 direct kick samples with matching room samples
  - 5 direct snare samples with matching room samples
