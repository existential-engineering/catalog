details: |-
  Bad Blood is the latest sound set from Origins of Audio. It contains 85
  presets, from which 21 were constructed in such way that can be used in
  multiple ways. For example a pluck sound can be turned into a pad if you turn
  one of the macro knobs. In a similar way, a pad can be switched to sound like
  a dark soundscape! Thus in this soundset you will find a total of more than
  100 sounds.

  We invested in diversity, which means that this soundset can come in handy for
  many music genres. Pads that can be used in film scoring, video games or even
  edm. Dark soundscapes suitable for noise, trap, video games and more!

  In addition, within this soundset you will find 6 custom wavetables as well as
  11 custom lfo shapes.
specs: |-
  - 85 presets
  - 21 presets with multiple sound variations
  - 6 custom wavetables
  - 11 custom LFO shapes
  - Macro knob controls
  - Compatible with Serum
