details: |-
  Lab:one recordings brings to the rack black knight 5 band EQ (version 2). For
  those who want to get the most out of equalisation, you can't go wrong with
  black knight. 5 bands, each with up to 6 selectable modes (2 in v1 mode, 6 in
  v2 mode), full parametric frequency range controls, 7 selectable frequencies
  per band in two alternative graphic modes, 128 selectable chromatic
  note-to-frequency per band, dedicated resonance and gain controls, plus a feed
  input trim, gain output trim and a pre- or post-EQ saturation control and a
  new saturation model, black knight makes your equalization decisions not only
  easy but enjoyable too.

  With each band comes with dedicated CV input sockets for each control, so you
  can route in your favourite CV modules and signals directly in to black
  knight's frequency, resonance, gain and saturation CV sockets for even more
  creativity. The 5 bands are switchable between two modes in v1 mode: band 1:
  eq or hp. Band 2: eq or ls. Band 3: eq or bp. Band 4: eq or hs. Band 5: eq or
  lp. In v2 mode, all possible filter type options are made available. Black
  knight is fully compatible with projects using v1.

  Each band resonance control has a range of 0.5 q (2.5 octaves) to 32 q (1/22nd
  octave), and each band gain control has a working range of +/-18db. The feed
  input and gain output controls have a range of -36db to +18db, which allow
  greater control when using black knight as a distortion effect in conjunction
  with the band gains and saturation.

  The hybrid / digital modes sport a new 'touch-screen' style display allowing
  you to manipulate frequency, gain and resonance in a mouse click. With
  modifier key actions you can 'lock' on the fly specifc controls for even more
  precision. Fft offsetting can bring up the fft plot for quieter sounds,
  without you needing to drive more signal in to black knight, added with a fft
  slope function, this makes black knight a highly flexible device.

  For a more natural sound, black knight allows you to oversample, so you can
  get a more analog response curve to your eq filtering, while keeping at cd /
  tv standards frequencies (44.1khz / 48khz). With over 160 presets bundled with
  black knight, this eq is your next 'go to' device for getting your sounds just
  right.
specs: |-
