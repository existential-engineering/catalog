name: Ableton Drum Racks for Superior Drummer 3 Metal Machine EZX
manufacturer: timbresandtones
primaryCategory: drum-sample-pack
categories:
  - preset
description: Ableton drum racks for superior drummer 3 metal machine ezx
  features separate ableton live drum rack presets.
details: |-
  Ableton drum racks for superior drummer 3 metal machine ezx features separate ableton drum racks for all factory presets for the toontrack superior drummer 3 and metal machine ezx library for toontrack ezdrummer. These racks provide out of the box integration workflow between ableton live and toontrack superior drummer 3 using the toontrack libraries including a host of features ready to use for composition and performance using ableton push or similar controllers.

  Amazing workflow in ableton and on your push to the full capabilities of the kit library saving setup time and allowing you to focus on music creation. Ease of navigation to load all metal machine ezx factory presets from ableton push controller device browser.

  10 ableton drum racks to instantly load the factory library "mix ready" presets with ableton mappings. 5 ableton live templates designed to host the multi channel output routing presets with track level audio routing from superior drummer 3 into ableton live.

  Colour coded pad design for visual performance and finger drumming. All our racks use consistent drum rack colouring so you can visually and immediately spot your rides from your hi hat articulations. Vast array of instrument articulations ready to go in one massive layout using ableton push 64 pad layout mode.

  Ableton macros mapped to toontrack superior drummer macros with preset values for ease of use in push and simple to use automation programming. Singleout presets 5 ableton drum racks for all metal machine factory presets single audio output to a single ableton track. Multiout presets featuring 5 ableton drum racks for all metal machine ezx presets in multiple audio channel output from the plug in to multiple ableton audio tracks using the 5 multi output ableton templates also provided designed for the kit presets.
specs: |-
  - Ableton drum racks
  - Toontrack superior drummer 3 integration
  - Metal machine ezx library support
  - Ableton push controller support
  - 10 ableton drum racks
  - 5 ableton live templates
  - Multi-channel output routing
  - Single audio output presets
  - Multiple audio channel output presets
  - Colour coded pad design
  - 64 pad layout mode
  - Individually labelled drum rack pads
  - Ableton macros mapped to toontrack superior drummer macros
  - Ableton track mixer integration
  - Ableton audio effects support
  - Ableton 10 drum buss compatibility
  - Macos and windows support
