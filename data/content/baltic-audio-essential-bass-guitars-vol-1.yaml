details: |-
  'Essential Bass Guitars Vol 1' from baltic audio covers the bass guitar sound used in the Pop and Tropical House charts.

  Inside are three bass guitar kits, including dry versions for re-amping, plus one bonus guitar kit taken from the 'Essential Chart Guitars' series with all common root notes and chords covered for Pop, Hip Hop and House, covering electric basses and electric guitars.

  Each kit and loop was played by a studio bassist and guitarist and recorded by a studio engineer. All loops are mixed and mastered ready for use in original songs and remixes.

  The pack can also be used for genres like Tropical House, Future House, EDM, Hip Hop and RnB.

  All single tracks and MIDI files of the demo are included, mixed and in 24-bit quality.
specs: |-
  - 171 Guitar Loops Cover Most Root Notes Used for the Styles
  - Kit 01 Looped at 108 BPM
  - Kit 02 Looped at 98 BPM with 2 Variations
  - Kit 03 Looped at 116 BPM with 3 Variations
  - Amped Wet & Dry Versions for Re-amping
  - Bonus Content with Single Tracks from Demo with Tails
  - 3 Bonus Folders with more than 381 MB of Content from Demo
  - 19 MIDI Files with Bass, Lead, Chords and Mostly all Drums
  - 1 Bonus Kit taken from 'Essential Chart Guitars Vol 2: Pop & House'
  - Over 700 MB of Content
  - PC/Mac Compatible
  - 100% Royalty-Free
  - 44.1kHz, 24-Bit Stereo WAV Format
  - Bonus Guitar Kit: 24 Guitar Loops (Wet) Cover Most Chords Used for the Styles
  - Bonus Guitar Kit: 24 Guitar Loops (Dry - DI) Cover Most Chords Used for the Styles
  - Bonus Guitar Kit: 1 Bonus Folder with more than 227 MB of Content from Demo
  - Bonus Guitar Kit: 12 MIDI Files with Bass, Lead, Chords and most Drums
  - Bonus Guitar Kit: Minor7 and Major Scale for all Chords
  - Bonus Guitar Kit: 1 Professionally Mixed Guitar Construction Kit from Demo
