details: |-
  "Aquatica" is a collection of four sample banks (another tone, Aquatica,
  atmospheres 1, atmospheres 2) made to expand the sonic territory of audiothing
  noises into the soundscapes realm, focusing on the water world.

  The aquatica folder offers high quality field recordings of ocean, sea,
  splashes, drops, rain, stream and similar, made to be combined with the other
  three tonal banks.

  All tonal samples are tuned to c and can be easily transposed to allow noises
  to produce tuned atmospheres.

  An included collection of 48 presets, 12 for each sample category, is a
  starting point to enjoy the beauty of these endlessly evolving samples.

  All samples are in wav 48/24 format, with written loop points, and can be
  seamlessly used in any other software/DAW of your choice.
specs: |-
  - Four sample banks (another tone, Aquatica, atmospheres 1, atmospheres 2)
  - High quality field recordings (ocean, sea, splashes, drops, rain, stream)
  - All tonal samples tuned to c
  - Transposable samples
  - 48 presets (12 for each sample category)
  - Wav 48/24 format
  - Written loop points
  - Compatible with any DAW
