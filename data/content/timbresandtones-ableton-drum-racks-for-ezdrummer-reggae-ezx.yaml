details: |-
  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all reggae ezx factory presets from ableton push
  controller device browser. 12 ableton drum racks to instantly load the reggae
  factory library "mix ready" presets with ableton mappings. Color coded pad
  design for visual performance and finger drumming. Individually labelled drum
  rack pads for clear visualisation, post performance editing and automation to
  all drum rack / instrument articulations.

  Mapped ableton macros to ezdrummer macros with preset values for ease of use
  in push and simple to use automation programming. Audio routing options.
  Singleout presets featuring 6 ableton drum racks for all factory presets
  single audio output to single ableton track. Mixing can be further enhanced
  through ezdrummer mixer or additional ableton audio effects to the track.

  Multiout presets featuring 6 ableton drum racks for all presets in multiple
  audio channel output from the plug in to multiple ableton audio tracks using
  the multi output ableton template also provided. Track level audio mixing
  control in ableton.

  Use the template racks and extend to your own ezdrummer reggae ezx presets,
  swapping out individual sounds or articulations. You are 100% ready to go with
  the factory presets but there is no limitation to creating your own presets
  from these templates.
