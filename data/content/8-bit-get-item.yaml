details: |-
  This collection of 8-bit get item samples is for when you grab that energy pack, secure a heart to fill your life meter, score a weapon upgrade or pick up a key or a quest item.

  The 8-bit sounds are separated into five sound categories: long repeaters: sounds that quickly repeat a tone, blip or cadence. Short repeaters: similar to the above but shorter for fast item grabbing sounds. Melodic: mini-melodies (mostly major) to indicate successful procurement. Fast risers: intense acquisition sounds that quickly rise up in pitch. Jumpers & crawlers: sounds that either spring up to a higher note or gradually climb a short tonal interval.

  This pack contains: 98 8-bit get item samples (long repeaters, short repeaters, melodic, fast risers and jumpers & crawlers). 1 sfx patch for native instruments kontakt, ableton live, maschine, logic pro exs24/sampler, fl studio, mpc expansion pack, and tal-sampler. 24-bit, 44.1 khz wav files.

  8-bit get item is part of the 8-bit sound effects bundle.
