details: |-
  In this 4-volume series, sound designer Ron MacLeod expands upon his previous work by producing a continuing series of inspirational sonic collections, utilizing the innovative processing tools from Cycling '74. Each Cycles download has separate 44.1kHz / 48kHz folders. The files are stored in 24-bit FLAC format.

  Momentary Incursions are hits, events, effects and transitions... for use when a more finite punctuation is in order. Aggressively percussive to hypnotic and transient, this collection of 900+ non-looped samples range from a fraction of a second to over a minute in length.

  Content categories: Events, longer gestures of modular, granular, metallic and electro-acoustic origin. FX, surreal and hyper-real effects that started life based in reality. Hits, shorter percussive bursts of electronics, metal, foundsound and processing overload. Transitions, events that provide transitional intros, endings, builds, fly-bys and tails. Waves, incidental swells of convoluted textures.

  The Cycles design philosophy came out of consulting professional sound designers and composers about what would make their job easier in the middle of a hectic production schedule, where one thing came up repeatedly: Simple equals Fast. The title is inspiring but directly reflects the nature of the actual content, the spine index uses a coded symbol whose color suggests the sound file type and whose arrow length indicates the average duration of the samples, and the organization of each library is distilled to the natural essence of the content, with not too many folders to weed through and filenames that are not overly pre-defined. The index is a simple and direct document for fast referencing of vital data relevant to the content of each library, including file length, loop data, BPM and pitch where applicable, supplied in both PDF and Excel format for easier integration into sound file databases.

  The files on Cycles releases can be used freely by the purchaser, other than inclusion in other sound libraries, without any additional royalties or usage fees. Because of the nature of some of the longer files, they cannot be used as a stand-alone piece represented as the purchaser's original composition. It is expected that additional material will be added to the file to make it unique or that it will be significantly altered through unique processing.
