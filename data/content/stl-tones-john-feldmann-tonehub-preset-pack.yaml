description: Grammy-nominated producer, mixer, and writer John Feldmann has
  joined forces with STL Tones to create his personal Producer Tonehub Preset
  Pack . Using many of Feldmann's go to guitar amp/cab/pedal setups, this
  signature collection showcases virtually all of Feldy's rhythm, lead, clean
  and bass guitar recording setups, that have been used on all of his records
  from the past 20 years. Feldmann's producer pack contains a total of 33 guitar
  presets, and 9 bass presets.
details: |-
  John Feldmann is one of the defining producers of modern pop-punk and alternative rock. Frontman of Goldfinger, he has produced and co-written records for The Used, Blink-182, Good Charlotte, Papa Roach, 5 Seconds of Summer, Panic! At The Disco and All Time Low, with albums he has worked on selling more than 34 million copies worldwide.

  Using many of Feldmann's go-to guitar amp, cab and pedal setups, this signature collection showcases virtually all of Feldy's rhythm, lead, clean and bass guitar recording setups, used on his records across the past 20 years.

  Feldmann's producer pack contains 33 guitar captures and 9 bass captures.
