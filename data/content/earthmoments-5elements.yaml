details: |-
  5Elements is a selection of unique sampled instruments created for Kontakt and the free Kontakt player. The 5Elements concept is inspired by the ancient indian concept that all creation, including human existence, is made up of five essential elements: earth, water, fire, wind, and space.

  In 5elements, earthmoments has captured the authentic character of eight original handmade instruments created by aurelio c. Hammer at the svaram workshop in auroville, india. 5elements adds features that enhance these distinctive instruments to create an immersive set of lively sounds, full of a wide range of frequencies and layers.

  The 5elements suite includes: ananda, a wooden, stringed instrument with 4 bridged strings that resemble the indian tamboura and 8 strings tuned to a pentatonic scale raga on the front, plus 36 strings on the bottom, tuned to e, for rich, natural harmonics. Golden plates (plate gongs), rectangular plate bells made from brass with a majestic sound similar to brass bells. Healing bed, an elaborately constructed instrument the size of a massage table that has 50 strings and a custom-designed resonator. Litophone, a mallet instrument made from granite stones and played with padded sticks. Octave tubes, an array of nine resonant metal tubes that can be played, swung and rotated at the same time to create a captivating atmospheric sound. Silver plate, a large and heavy silver plate that produces solid and heavy overtones with a very long sustain. Singing stone, a large 200 kg stone instrument played in a fashion similar to rubbing the rim of a crystal wine glass. Tubular bells, a set of large tubular bells utilising unique mathematically-based tunings based on a c-256 pentatonic scale over two octaves.

  Each instrument includes several playing styles called "sub-instruments," such as strummed, plucked, struck with mallets or sticks, and pre-recorded phrases. You can layer and mix two layers of instruments or sub-instruments and can apply compression, eq, and reverb.

  5elements also allows you to add a drone layer of binaural beats. A binaural beat is the frequency perceived by the brain when two different frequencies are listened to, one in each ear. The perceived frequency is the difference between the two frequencies. Research shows that certain frequencies are associated with specific brain activity. The use of binaural beats in 5elements is influenced by the traditional drone sounds in classical indian music. You also can add an ambience layer of field recordings and sounds of the beach, forest, village, workshop, and rain from various places in south india.
