details: |-
  Will Yip is the Grammy-winning go-to producer for post-millennium alternative music, known for his work with Title Fight, Turnstile, Turnover, Code Orange, Circa Survive, Tigers Jaw and Anthony Green. He won Best Rock Album at the 2026 Grammy Awards for producing Turnstile's Never Enough . Owner of Studio 4 in Conshohocken, Pennsylvania, he continues to play a pivotal role in the resurgence of emo, pop punk and post-punk today.

  Designed with the audio engineer in mind, Will's ToneHub pack delivers the best of both worlds: precisely dialed-in, mix-ready tones for instant results, and the original unedited studio capture for complete tonal customization.

  Will's pack contains 54 captures.
