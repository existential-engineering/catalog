description: Download 128 new bass & lead presets for Rave Generator 3. Elevate your sound with cutting-edge basslines and resonant leads!
details: |-
  128 brand-new bass and lead presets for the Rave Generator 3 plugin, aimed at producers working in techno, acid, house and the outer edges of electronic music.

  Each preset is crafted for dance music and engineered for maximum impact on the dancefloor, with deep, pulsating basslines to drive techno grooves and sharp, resonant leads that cut through an acid or house mix.

  The collection spans techno-inspired basses (from dark, growling subs to punchy mid-range basses), acid-infused leads with resonant, squelchy synth lines designed to twist and evolve in real time, and house-ready sounds ranging from warm, deep basslines to uplifting leads.

  All 128 presets are fully optimized for Rave Generator 3, giving quick access to rich sound textures with minimal tweaking required. Rave Generator 3 is required to use this add-on and is sold separately.
