details: |-
  128 brand-new bass and lead presets for the Rave Generator 3 plugin, aimed at producers working in techno, acid, house, or the outer edges of electronic music.

  Each preset is crafted for dance music and engineered for maximum impact on the dancefloor: deep, pulsating basslines to drive techno grooves, and sharp, resonant leads that cut through an acid or house mix. These sounds are built for the club as much as for the studio.

  All 128 presets are fully optimized for Rave Generator 3, giving quick access to rich sound textures with minimal tweaking required, so they integrate into an existing workflow whether the producer is seasoned or just getting started.

  The product page carries audio examples of the included presets with drums: Delirious Secret, Crazy Jam, Higher Pusher, Dark Thug, Ghoulish Invasion, Back to Disco and Cheeky Hexagon.
