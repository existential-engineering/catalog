details: |-
  IR-Pack Professional Post-Pro is a HOFA-Plugins impulse response collection aimed at post production, gathering responses captured in a wide range of indoor and outdoor locations for film, radio play and game sound design, as well as music productions.

  The pack is content rather than a processor: to buy and use it you need one of HOFA's own convolution reverbs as a host, either the IQ-Series Reverb V2 or the HOFA SYSTEM IR-Verb.

  The published list names 150 impulse responses. Large architectural spaces are well represented, with concert and event halls (Neptun Hall, Hall Jupiter, Hall Mercury, Cluster Hall, Technical Hall) alongside churches and sacred spaces (Halleluja, Hall Holy, Big St. Matthias, Long St. Bartholomew, Long St. Simon, Long St. Zebedee, Minster, Temple Dark).

  Because the emphasis is on picture and narrative work, the collection leans heavily on everyday and confined locations that dialogue or effects have to sit in: a dozen car interiors (Tiny Car Limo Fur, Tiny Car Plastic, Tiny Car Van), bathrooms and toilets at several sizes, closets, wardrobes, elevator shafts, a ship cabin, a bowling alley, a bunker, a shoe room, a cigarette shop and various garages and parking structures.

  Outdoor and ambient captures round the set out, including forests (Forest Deep, Forest Full), creeks (Creek Fresh, Creek Rippling, Creek Trees), fields, glades, hills, mountains, valleys and urban exteriors (Urban Canyon, Urban Houses, Urban Early, Urban Lost). The product page carries SoundCloud sound examples and the complete impulse response list.
specs: |-
  - 150 impulse responses listed on the product page
  - Captured in indoor and outdoor locations for film, radio play and game sound design, plus music production
  - Requires IQ-Series Reverb V2 or HOFA SYSTEM IR-Verb as a host
  - Covers halls, churches, rooms, vehicles, industrial and urban spaces, and natural outdoor environments
  - SoundCloud sound examples and the full impulse response list published on the product page
