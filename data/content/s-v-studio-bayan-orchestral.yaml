description: "Bayan Orchestral for Kontakt 5. Features: in this, the orchestral
  version of the tool are the sounds only the right of the keyboard bayan."
details: |-
  Bayan Orchestral for Kontakt 5 is an orchestral version containing sounds from
  the right side of the keyboard bayan.

  The library includes 2382 samples totaling 2.20 gb in wav format at 44.1 khz,
  24-bit, mono.

  Features 10 velocity layers for each note and 15 registers that match exact
  combinations of sounds as in the real bayan 'jupiter'.

  Includes repetition mode for realistic noise generation with the push of a
  button.

  Effects include convolution reverb and stereo modeller.
specs: |-
  - Kontakt 5 compatible
