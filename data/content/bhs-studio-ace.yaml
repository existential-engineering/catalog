details: |-
  BHS Studio Ace is the th-u expansion library, signed by big hairy sounds,
  seeking to recreate the 80's and 90's tones of studio guitar ace dann huff,
  based on mesa, peavey, kasha and modified marshall amplifiers.

  The library contains 136 rigs, captured using the following amplifiers: mesa
  studio preamp (a classic studio staple that delivers exquisite clean tones and
  fantastic dirty tones, powered by 2150 and 2:90 power amps), kasha rockmod
  (the two channel preamp from a great los angeles amp designer powered by a
  2150 power amp), peavey classic 50 (delivers fat and juicy tones that were a
  hallmark of the 90's), and a modified marshall to bring everything from
  classic rock to aggressive searing lead tones.

  The library also includes 58 patches focused on recreating the typical '80s
  and '90s studio tones.

  The bhs studio ace library adds a brand new modulation pedal into th-u. The
  micropitch effect reproduces the typical '80s and '90s chorusing effect
  obtained by detuning one channel over the other using a pitch shifter. This is
  the essential pedal if you want to recreate the eventide-style modulation.

  You can load this rig library into the rig player component, available in any
  th-u version: th-u full, th-u rock, th-u metal, th-u funk and r&b, th-u slate
  edition, and th-u mobile.
specs: |-
