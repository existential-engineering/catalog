description: The Elements Bundle by Krotos and Silverplatter Audio offers a wide range of environmental textures, sweeteners, ambiences and impact sound effects, optimised for designing, automating and performing sound in real-time using Reformer Pro.
details: |-
  The Elements Bundle by Krotos and Silverplatter Audio offers a wide range of environmental textures, sweeteners, ambiences and impact sound effects, optimised for designing, automating and performing sound in real-time using Reformer Pro.

  Ranging from frozen scrapes or pouring water, to campfire ambiences or immense fireballs, this bundle packs the power of nature into an essential collection of high-quality and versatile sound libraries built for Reformer Pro.

  The Elements Bundle offers a diverse 3.92GB selection of professionally designed and recorded royalty-free SFX components, ideal for any Foley, post-production, game-audio and sound design project. Equip it in Reformer Pro and add the sonic character of natural ambiences to a project with total ease and creativity.

  The purchase contains two downloads: a zip file containing all source sound effect asset files with a Metadata PDF, and an installer for the integrated Reformer Pro library.

  Sound categories included are Fire (bonfire, firepit, fireplace and campfire ambiences, fireballs, crackles, striking matches, whirlwinds), Water (rain maker debris, bubbles, dropping, hydrophone, pouring, splashing, designed), Ice (deep glacier shift, snow ball, ice blocks, iceberg, breaking ice, icy snow, snow creaks) and Air (pump, compressed air, air vent, windy electric, various weather).
specs: |-
  - 1,131 sound files
  - 3.92 GB size
  - 96/192 kHz high-quality WAV files
  - 100% royalty-free commercial license
  - Embedded metadata
  - 35 Reformer Pro sound packs
