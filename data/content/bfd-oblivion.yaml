url: https://www.bfddrums.com/expansions/oblivion.html
description: BFD Oblivion is an expansion for fxpansion's bfd3, bfd eco and bfd2
  designed to provide ready-to-use heavy rock and metal drum sounds.
details: |-
  Based around 3 different versions of a mapex orion kit with mapex brass and
  brady jarrah wood snares, each with different degrees of processing, bfd
  oblivion also contains cymbals from bosphorus, zildjian and paiste in natural
  and processed versions.

  Crafted by an in-house team obsessed with metal, bfd oblivion is processed
  heavily so you don't have to - just add your hardest guitars and basses to
  create an authentic foundation for all kinds of rock and metal music.
specs: |-
  - Expansion for bfd3, bfd eco and bfd2
  - Mapex orion drumkit with 22" kick, 10", 12", and 14" toms
  - Mapex brass master snare and 13" brady jarrah snare
  - Cymbals from bosphorus, zildjian and paiste
  - Natural and processed cymbal versions
  - Kick with felt and plastic beaters
  - Mix-processed drums
  - Windows 7 or higher
  - Os x 10.6.8 or higher
  - 11.7 GB disk space for bfd3 version
  - 32 GB disk space for bfd eco/bfd2 version
  - Internet connection for download and authorization
