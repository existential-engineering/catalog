details: |-
  Maor Appelbaum is dedicated to the art of mastering, striving to bring depth and impact to the listening experience. After working as an engineer for producer Sylvia Massy at Radiostar Studios in Weed, California, he moved to Los Angeles and opened his private mastering suite, establishing himself as an in-demand mastering engineer for alternative metal and progressive rock artists. His credits include Faith No More, Yes, Sepultura, Rob Halford, Yngwie Malmsteen, Armored Saint, Fates Warning, Angra, Dokken, Sabaton, Meat Loaf and Lita Ford.

  This mastering expansion pack has been built by Maor Appelbaum to enhance the sonic potential of your mixes.

  The pack contains emulations of extremely sought-after mastering-grade hardware units created by the most respected designers in the world, all tailored by Maor into full signal chain captures that will add punch, color, and clarity to your mixes, whilst giving you the ultimate control and ability to adjust each module to taste.

  This expansion pack has a total of 50 captures.
