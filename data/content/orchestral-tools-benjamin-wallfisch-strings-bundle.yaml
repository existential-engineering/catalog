  Benjamin wallfisch strings - cinematic ensembles and divisi stringscapes - by
  benjamin wallfisch

  Benjamin wallfisch strings bundle by orchestral tools is a virtual instrument
  audio plugin and a software application for macos and windows. It includes,
  and is therefore "powered by", sineplayer, which functions as a VST plugin, an
  audio units plugin, a VST 3 plugin, an AAX plugin and a standalone
  application.
