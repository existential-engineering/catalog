details: |-
  'Hands Up Classix Vol 2 (baltic audio Edition)' by CESA SAMPLES is a royalty-free Sylenth1 preset pack designed for classic Hands Up, Dance, 2000s EDM and Eurodance-inspired productions.

  This baltic audio Edition includes 64 presets for LennarDigital Sylenth1, covering leads, basses, plucks, pads, bells, chords, arpeggios, synths and FX for building melodies, hooks, basslines and club arrangements.

  This edition does not contain any samples or MIDI files.

  LennarDigital Sylenth1 v3.06 or higher is required. This edition contains Sylenth1 presets only: it does not include samples or MIDI files.
