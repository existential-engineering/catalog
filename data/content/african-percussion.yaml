details: |-
  Auditory lab's african percussion is a percussion library that contain a big collection of acoustic percussion instruments such as djembes, shekeres, agogos, dondos, caxixis, guiros and udu drums from the worlds of nigerian, cameroonian, senegalese and afro-cuban music.

  Samples have been specially recorded and processed to make them ideally suited to use in african folk music, reggae, salsa, latin jazz, samba and more.
