details: |-
  A collection of raw, unstable textures and distorted fragments built from feedback systems, modular synthesis, and decaying field recordings. Outside Is Cancelled captures the physicality of sound — cracked transients, metallic drones, and granular percussions sculpted from analog circuits and failing machines. Each sound was processed through Colossus Audio hardware and custom signal paths, preserving the imperfections that make them alive. Designed for producers, sound artists, and composers seeking tension, noise, and emotional depth beyond conventional electronic sound libraries. 100 original samples. No polish, no perfection, just the sound of collapse.
