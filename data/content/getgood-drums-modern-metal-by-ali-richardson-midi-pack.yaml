details: |-
  Known for his explosive drumming with both Bleed From Within and Sylosis, Ali Richardson brings all his passion for thrashin' in this incredibly powerful groove pack.

  A super creative drummer who has it all, groove, power, speed, energy, showmanship, and precision. Ali's midi groove pack is chock-full of blistering metal grooves, intense double bass, huge stomping choruses, and some of the gnarliest fills we've released yet.

  The perfect complement to One Kit Wonder: Metal, and your next writing session. Get it now, and thrash on to your heart's content!
