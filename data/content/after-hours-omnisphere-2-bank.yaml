details: >-
  Flame audio features 'after hours' omnisphere 2 bank, filled with top-quality
  70 custom omnisphere patches in style of the most popular artists these days
  such as dababy, roddy ricch, post malone, migos, french montana, cardi b and
  more.


  This expansion is an incredibly versatile omnisphere 2 preset bank, has some
  of the most innovative sounding patches, like dope trap arps, ambient bells
  and keys, wide pads, pianos and much more.


  Installation instructions (mac or windows): extract the folder to
  spectrasonics > steam > omnisphere > settings library > patches hit the
  refresh button in patch browser.


  Please note: spectrasonics omnisphere (v2.6) or higher is required. The beats
  in the demo are not included and were used for demonstration purposes only.
