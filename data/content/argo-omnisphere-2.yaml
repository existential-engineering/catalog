description: Argo is a 96 patches soundbank for spectrasonics Omnisphere 2 synth VST.
details: |-
  There are 12 subgroups of patches each one with 8 of them influenced by some
  aspects and persons of argo myth: argo - poly synth category, argonauts - poly
  synth category, argus retro land category, colchis long synth category, dodona
  oaks long synth category, golden fleece - poly synth category, heracles - poly
  synth category, iolcus long synth category, jason - poly synth category, medea
  - poly synth category, orpheus long synth category, scylla and charybdis -
  retro land category.

  The main style they serve is cinematic and game audio and could also add some
  fresh cinematic elements to other music genres like prog rock, electronic and
  other.

  They have 6 voice polyphony and made both with sample or synth dsp wavetables
  of omnisphere 2. The modwheel adds vibrato to the sound.

  Please give a little attention for the sample-based presets as sometimes some
  minor and low in volume clicks may occur when the cycle of the performing
  sample(s) ends.
specs: |-
  - 96 patches soundbank
  - 12 subgroups with 8 patches each
  - 6 voice polyphony
  - Sample-based and synth dsp wavetables
  - Modwheel vibrato control
  - Omnisphere 2.8 or newer required
  - Software 2.8.5f
  - Soundsources v2.6.1c
  - Patches v2.8.1c
