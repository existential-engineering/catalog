details: |-
  Bloom is a gorgeous synthetic instrument modeled to sound somewhere in between
  a soft piano and glockenspiel. Running on the Kontakt 5 engine, it allows for
  extremely creative and beautiful melodies at a very respectable pace.

  The instrument is designed to be as intuitive and fast as possible, and
  includes a built in arpeggiator script to quickly change chord progressions
  into dancing melodies, as well as multiple fx controls and velocity-sensitive
  samples.

  Bloom also comes with a more aggressive counterpart, flourish, enabling even
  more sonic versatility in a single instrument package.
specs: |-
  - Kontakt 5 engine
  - Over 240 24-bit high quality samples
  - 2 instruments (bloom and flourish)
  - Built-in delay
  - Built-in reverb
  - Built-in arpeggiator
  - Multi-velocity samples
  - 245mb of samples
  - Kontakt 5.8 or later (full version required)
  - 4gb of RAM (8gb recommended)
  - 245mb hard disk space
