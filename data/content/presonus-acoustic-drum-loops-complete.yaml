name: Acoustic Drum Loops Complete
manufacturer: presonus
primaryCategory: drum-loop
categories:
  - sample-pack
description: These live drum performances, recorded in a state-of-the-art studio
  with world-class microphones, are ready to use in stereo and multitrack
details: |-
  The multitrack loops contain separate tracks for kick, snare, hi-hat, toms,
  overhead mics, room mics, and ambient mics so you can mix and edit to taste.

  Recorded in nashville, tn at downtown batterie by acclaimed session drummer
  tony morra.

  Includes seven sets of loops: acoustic/earthy (five styles), blues/reggae
  (three styles), country (three styles), jazz (five styles), metal (four
  styles), r&b/funk (nine styles), rock/pop (eight styles).

  This collection also includes stereo and multitrack loops from some of volume
  1's best beats!
specs: |-
  - Stereo and multitrack format

  - Separate tracks for kick, snare, hi-hat, toms, overhead mics, room mics, and
  ambient mics

  - Time stretch

  - 24-bit / 44khz

  - 22 gigabytes

  - Intros, verses, bridges, choruses, fills, endings, and alternate grooves

  - Multiple style variants

  - Requires presonus studio one version 2.6.4 or higher

  - Windows 7 x64/x86 sp1, windows 8 x64/x86

