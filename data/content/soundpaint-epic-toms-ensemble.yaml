details: |-
  Burning, Thundering, Tenacious Toms

  Introducing the Epic Toms Ensemble - the ultimate collection of deep-sampled, large-scale burning Epic Toms designed to add power and intensity to your compositions. With high-tuned toms, roto-toms, octo-bans, floor toms, bass drums, and custom mega-toms, this library is your ticket to crafting epic battle scenes or injecting thunderous impact into your tracks. With 127 dynamic velocity layers and nearly infinite round-robins, the toms come to life and are a joy to play in Soundpaint. Every tom hit was designed to ensure distinct and powerful sounds that cut through the mix. The bass drums and mega-toms provide earth-shaking low-end presence, while recorded shouts add an extra layer of intensity. Recorded in a high-ceiling glass, stone, and tile hall, you can use Soundpaint's TIME module to instantly tailor the sound and room to your preference. Pair the Epic Toms Ensemble with our other epic percussion libraries for maximum impact. Whether you're scoring an action-packed movie scene or looking to add some extra oomph to your latest track, the Epic Toms Ensemble is the perfect tool to create a massive and unforgettable sound.
