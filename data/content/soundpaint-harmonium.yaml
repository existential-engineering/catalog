details: |-
  The Quintessential Reed Organ

  Embark on a musical journey with the Soundpaint Harmonium - a true gem that sounds just a bit like an accordion with some pipe organ DNA. With its rich and diverse background, this small yet exquisite aerophone delivers enchanting sounds that can beautifully complement any composition with its charming character. We recorded the Harmonium open, muted, and semi muted - each with a unique timbre and character. This collection also includes staccatos, crescendos, and air sound effects to add even more texture and life to the sound. The sound is so detailed that you can even hear the fingers on the keys, if you want. In Soundpaint, the Harmonium is so much more. Heavenly and relaxing bells, deep and distant drones, a dramatic and lively jig, a mellow e-piano, a sinister synth - the possibilities are endless. The Harmonium in Soundpaint offers the best of all worlds: an incredibly lifelike reed organ, extraterrestrial soundscapes, and everything in between.
