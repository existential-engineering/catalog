details: |-
  To celebrate 5 years of Colossus Audio, we're giving something back to all of you. This free anniversary sample pack contains 100 samples crafted with Zakal, Equals, and selections pulled from our internal library. The pack was shaped by the hands and ears of Francesco Leali, Michele Nannini, and Anthony Arcana, capturing the raw, textural character that defines Colossus Audio. Thank you for being with us these past five years.
