details: >-
  Aid01 mc-808 is a fundamental classic drum hit collection loaded with 1300+
  kicks, snares, hats, claps, toms, hits & efx from roland most desired
  percussive sounds.


  Dboxsamples drop a new concept from extensive sampling of hardware machines,
  turning rom sounds into pristine 24-bits wav samples ready to use in your
  productions.


  Analogue::in::dbox captures de best of the mc-808 groovebox factory drumkits
  featuring samples from rhythm machines such as the tr-909, tr-808, tr-707 and
  tr-606.


  Boost your drum rig up with the aid01 mc-808 selection of internal sounds and
  MIDI patterns.


  Easy access to all the samples from this collection on most used software
  samplers such as kontakt 4, exs24, nn-xt, battery or halion.
