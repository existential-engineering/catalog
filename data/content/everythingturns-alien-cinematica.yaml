details: |-
  Alien Cinematica for Kontakt is a collection of very lush dynamic atmospheric
  alien instruments and soundscapes, giving a real depth to your musical
  soundstage.

  Perfect for ambient and electronica or just to add a bit of strangeness to
  your mix.

  Every note of the 16 multi sampled instruments naturally fades, none of the
  samples are looped.

  All sounds are recorded at 24-bit resolution, the total file size for all of
  the instruments is 16.75gb.
