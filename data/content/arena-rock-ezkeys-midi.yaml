details: >-
  The arena rock ezkeys midipack is a MIDI expansion inspired by big, anthemic
  rock from the late 1970s through to today. This ezkeys MIDI pack marks the
  99th individual title in the company's massive collection of MIDI packs for
  ezkeys.


  Inspired by the greats of rock that have packed arenas to the brim from the
  1970s and on, getting people chanting, cheering and screaming their lungs out
  to songs about open highways, life, work and the everyday rut, this collection
  of MIDI for ezkeys checks all the hallmarks of arena rock as we know it.


  Expect basic chord structures, to-the-point melodies and big, anthemic hooks
  that just won't go away all with that unmistakably driving and energetic rock
  feel.


  If you're looking to write some backbeat-driven and larger-than-life-type rock
  songs where the piano has the center stage spotlight, this ezkeys MIDI pack is
  for you.


  Piano/keyboard MIDI inspired by big, anthemic rock from the late 1970s through
  to today. Includes approx. 200 individual files performed by a professional
  session player. Covering 4/4 playing variations in straight and/or swing feel
  with tempos ranging from 88 bpm to 156 bpm. Intro, verse, pre-chorus, chorus
  and bridge sections.
