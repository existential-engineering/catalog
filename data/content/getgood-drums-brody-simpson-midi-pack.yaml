details: |-
  Brody Simpson is one of the most creative drummers out there. He's also a ridiculously talented producer. And at the intersection of his drumming ability and production knowledge, exists one of the coolest, most uniquely rhythmic, sonic palettes in the world.

  His beats bend time, his sound design is crisp and clean, and he's won over the adoration of every drummer who's been lucky enough to hear him play. Suffice it to say, Brody Simpson is one bad ass drummer, and now, he can be YOUR drummer. We're extremely excited to bring you our newest signature groove pack - Brody Simpson Grooves.
