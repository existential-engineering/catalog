details: |-
  Akustika elektronika drums connects worlds of acoustic and electronic drums in a unique style. Samples were sourced, played (some of us are drummers) and programmed, from pearl masters maple acoustic kit, 00s korg triton and 80s mxr drumcomputer model 185.

  The selection of loops, solo lines, single hits and processed files is easy to use in your existing productions or when making new tracks, and with provided ableton live templates and different sampler instruments you can build your tracks on different levels.

  Loops and samples were slightly compressed so additional use of eq or compressor will not kill dynamics of a sound. The pack contains 2 ableton live templates featuring stems sorted in 7 tracks in session view and drum rack with all 116 single hits on eighth track, which you can use to create new loops in a fast and easy way.

  Drum kits are also provided in rex2, native instruments battery and kontakt formats. Reason users will benefit from the selection of hand edited rex2 loops, giving you even more short sequences and hits to work with.

  Akustika elektronika drums offers many combinations and possibilities to integrate included percussion's in almost any genre and enrich your tracks with acoustic/electronic drum elements, while also giving more than one option for creation of new beats.
