details: |-
  BFD Decatom is an expansion for bfd3, bfd eco and bfd2 that features a set of
  10 tuned toms with identical 6" heads but depths varying from 6" to 24". The
  resulting set features a pitch range that covers 1 octave and is useful for
  unconventional melodies, basslines, alternative tom sounds, percussive
  grooves, atmospheric soundtrack work and much more.

  The 10 included ddrum deccabons can be adjusted to play chromatically using
  the tuning features in your bfd environment and can be twisted into a variety
  of shapes with dynamics and effects processing.

  Bfd decatom is recorded in similar studio conditions to the bfd jazz & funk
  and bfd percussion expansions as well as those used for the mapleworks kits in
  bfd3.
specs: |-
  - 10 tuned toms with identical 6" heads
  - Depths varying from 6" to 24"
  - 1 octave pitch range
  - Ddrum deccabons
  - Chromatic tuning capabilities
  - Dynamics processing
  - Effects processing
  - Expansion for bfd3, bfd eco and bfd2
  - Windows 7 or higher
  - Os x 10.6.8 or higher
  - Internet connection for download and authorization
  - Disk space: 15 GB full install, 7.5 GB medium install, 5 GB small install
