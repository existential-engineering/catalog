details: |-
  'spectrum' is the most beautiful sound that a designer can 'draw'. The sound
  drawn with spectrum is so beautiful, but it is meaningless if it is not
  moving. However, Serum can add that motion through its wavetable, and this
  wavetable can contain large amount of those 'pictures'. Imagine, if the
  spectrum is in motion, we shall call the wavetable as a 'motion picture', and
  this is another form of an art.

  So, if wavetable is a motion picture and serum is the tool to draw it, I would
  call this form of art an 'artmosphere'. Artmosphere is an art made by
  atmosphere, and this beautiful art was born for ambient and soundscapes.

  50 pads, atmosphere sounds, and other various well-programmed macro knobs will
  add another artistic taste to your tones and sounds.

  All sounds are perfectly assigned to modulation wheel and velocity. Nearly all
  sounds are assigned to all (four) macro knobs.

  32 additional wavetables useful for ambient sound.
specs: |-
  - 26 atmospheric pads
  - 24 ambient pads
  - 5 bonus presets
  - 32 additional wavetables
  - Modulation wheel assignment
  - Velocity assignment
  - Four macro knobs
  - Requires xfer records Serum 1.044 or higher
