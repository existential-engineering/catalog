details: |-
  'Spire Essentials Vol 11: Commercial Bass House' from baltic audio is a preset pack for producers looking to get the sound of current Commercial Bass House. You'll find 64 top-quality presets for the amazing Spire synthesizer to create hit tracks, including hand-crafted basses, leads, plucks, pads and more.

  Each preset is perfectly programmed by a professional sound designer and every parameter tweaked with passion and detail and will be your essential source for creating new and commercial sounds within your compositions.

  You can also use it for genres like Future House, Deep House and more.

  In addition, you'll find 38 MIDI files taken from the demo.

  Please note: The drums and some FX used in the demo are not included in this product.
specs: |-
  - 64 Presets for Spire
  - 32 Basses
  - 15 Plucks
  - 7 Leads
  - 5 Chords
  - 5 Pads
  - 38 MIDI files
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
  - Requires Reveal Sound Spire v1.1 or higher
