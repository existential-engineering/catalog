details: |-
  Pure, fragile, and unlike anything else. The titanium euphone is a contemporary instrument made up of chromatically tuned glass rods, played by rubbing them with wet fingertips. The result is ethereal, organic yet alien. This collection captures both the raw acoustic instrument and a series of Warps: processed sounds that transform the instrument's delicate tones into everything from angelic and glistening textures to frightening, horror-like atmospheres.

  The standard instrument is presented via three signals (Close, Room, Ribbon), while each Warp has its own bespoke set of three signals (Direct, Bright, Cinematic). Previously available only with Kontakt Full (as Titanium Euphone), Crystal Keys requires the free Splice INSTRUMENT plugin to run.
specs: |-
  - 20 presets
  - Standard instrument signals: Close (valve and condenser spot mics), Room (stereo pair), Ribbon (Coles 4038)
  - Warp signals: Direct, Bright, Cinematic
  - Controls: Reverb, Attack, Release, Distort/Chorus
  - 3.5 GB
  - Built around the titanium euphone, chromatically tuned glass rods
  - Requires the free Splice INSTRUMENT plugin and a free Splice account
  - macOS 12 or later
  - Windows 10 or 11 (64-bit)
