description: A massive collection of monstrous, huge and explosive impact sound effects designed for final cuts, trailers, epic movie scores, and sound design. Features 3,008 files at 96kHz with 16 integrated Reformer Pro sound packs covering impacts, metal crashes, cars, and more. Includes embedded metadata and a 100% royalty-free commercial license.
details: |-
  Provided by BOOM Library. Pimp up your final cuts, trailers, epic movie scores or sound effects with these monstrous, huge and explosive impact sound effects. This immense collection of uniquely designed hits is made for easy access to a wide range of different metal impacts.

  This library was built specifically for use with Reformer and Reformer Pro, plugins that recompose audio into dynamic, responsive, and highly-realistic sound design instantly.

  Sound categories included are impacts, metal, crashes and cars, with keywords covering impacts, barbells, metal, hits, hammers, crunches, clears, iron, bars, smashes, crashes, brasses, pendulum, clocks, sticks, cars, doors, chains, coffers, containers, distorted, rattles, hatches, metal boxes, bicycles, swords, squeak, robots and sweeteners.

  The purchase contains two downloads: a zip file with all source sound effect asset files plus a Metadata PDF, and an installer for the integrated Reformer Pro library. iLok is required for the Reformer Pro integration installers.
specs: |-
  - 3,008 sound files
  - 4.96 GB size
  - 96 kHz high-quality WAV files
  - 100% royalty-free commercial licence
  - Embedded metadata
  - 16 Reformer Pro sound packs
  - iLok required for the Reformer Pro integration installers
