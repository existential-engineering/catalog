details: |-
  64 presets for the Reveal Sound Spire synthesizer, aimed at current Future House and Deep House productions, including hand-crafted basses, leads, arps, pads and synths.

  Each preset is programmed by a professional sound designer, with every parameter tweaked in detail, as a source for creating new and commercial sounds within a composition.

  The pack can also be used for genres like EDM, Pop, Trap, Hip Hop and RnB.

  In addition, 44 MIDI files of the sound demo are included.

  Please note: the drums and FX used in the demo are not included in this product.
specs: |-
  - 64 Presets for Spire synthesizer
  - Programmed by a sounddesigner
  - Perfectly tweaked
  - Overall loudness for the most presets
  - 20 Basses
  - 20 Synths
  - 10 Leads
  - 10 Pads
  - 4 Arps
  - Every preset with modWheel assignment
  - Requires v.1.0.20 or higher of Reveal Sound Spire
  - 44 Midi files
  - Multi-Genres
  - PC/Mac Compatible
  - 100% Royalty-Free
