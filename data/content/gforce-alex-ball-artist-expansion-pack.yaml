details: |-
  The Alex Ball Artist Expansion Pack is a collaboration between GForce Software and artist and musician Alex Ball. It features exclusively recorded tape banks using both modern and traditional Streetly Electronics technologies, complemented by a comprehensive collection of hand-crafted patches.

  The pack contains 27 carefully curated tape banks covering a wide range of instruments, from acoustic and electric stringed instruments to keyboards, synthesizers, voices, and rhythm elements. Every tape bank was recorded at 35 notes, giving players full expressive range across the keyboard.

  Over 150 M-Tron Pro patches are included, designed by Alex Ball to showcase the character and versatility of the new tape banks. Available as a 464 MB download for registered owners of M-Tron Pro IV.
