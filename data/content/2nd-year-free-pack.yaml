name: 2nd Year free pack
manufacturer: boyss-sound-e-scapes
primaryCategory: sample-pack
url: https://www.boyss-sound-e-scapes.com/
description: "To celebrate 2nd anniversary we released free sample pack which
  consists of: atmos folder: 35 atmos loops made with our products dark design"
details: |-
  Drums 01 loops: 10 drum loops (matched with bass loops with the same number).
  Created with maschine MIDI drum patterns. Various bpms as in bass loops
  folder. Oneshots and separate outs are provided too.

  Drums 02 loops: 10 drum loops. More "acoustic like" and vintage sounding than
  previous. All are at 110 bpm. Good for hip hop, breaks etc. Also created with
  maschine MIDI drum patterns. Oneshots and separate outs are provided too.

  White bell & extras loops: 6 extra loops, couple of them are made with white
  bell instrument. For MIDI notes we used MIDI song starters.

  MIDI: for all audio loops MIDI is provided. For drums, MIDI is optimized for
  easy loading in the maschine software. All wav loops are in format 24-bit 44,1
  khz. Size about 630 mb uncompressed. No payment is required in order to
  download (if you want you can donate the amount of your choice) but if you
  opt-in for email subscription (only a few important emails per year) we plan
  to make more free loops/instruments in the future exclusive only to
  subscribers.
specs: |-
  - 24-bit audio format
  - 44.1 kHz sample rate
  - 630 MB uncompressed size
  - MIDI included
  - Maschine MIDI drum patterns compatible
  - Multiple bpm variations
