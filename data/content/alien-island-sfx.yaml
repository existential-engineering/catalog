details: |-
  This intense collection of destructive 8-bit sound effect samples has five types of explosions, five more types of guns, things getting hit by those guns, dying sounds, electric shocks, alarms, and other sounds of things we hope we never experience.

  There are also 1up and pause sounds for a bit of a hiatus. Each sound effect has a selection of variation samples that provide alternative sounds but are similar in character and function.

  Alien island: sfx pack contains: 90 8-bit sound effect samples. 1 sfx patch for native instruments kontakt, ableton live, maschine, logic pro exs24/sampler, fl studio, mpc expansion pack, and tal-sampler. 24-bit, 44.1 khz wav files.
