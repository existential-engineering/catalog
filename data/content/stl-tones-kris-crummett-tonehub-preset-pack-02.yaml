details: |-
  Kris Crummett is a producer, mix and mastering engineer known for bringing about breakthrough and defining albums with Sleeping With Sirens, Issues, Dance Gavin Dance, Emarosa, In Fear and Faith, Alesana, Crown The Empire, Slaves and Jonny Craig.

  Kris returns with his second ToneHub pack, built around a whole new set of amps, cabs and pedals from his collection. Captured across 11 amps, 6 cabs and numerous pedal combinations, it expands considerably on the ground covered by his first pack.

  Kris's pack contains 97 captures.
