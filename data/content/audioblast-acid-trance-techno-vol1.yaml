details: |-
  Step into the core of underground electronic music with Acid-Trance-Techno Vol. 1, a sound collection featuring 345 four-bar loops and MIDI files crafted from the sounds of ABX3 and its preset banks. Designed for producers who thrive on energy, rhythm, and melody, the pack covers Acid, Trance, Techno, Goa, and everything in between.

  Created using sounds from ABX3 and its Trance Presets Vol. 1 expansion, the library offers a blend of analog-style basslines, euphoric leads, hypnotic sequences, and driving arpeggios, ready to drop straight into a project or to be reimagined using the included MIDI files.

  Each loop comes with its corresponding MIDI file. The WAV loops can spark inspiration instantly, or the MIDI files can be loaded into any synth for further customization, reshaping melodies, changing synths, adjusting timing, or creating new patterns from the same musical material.

  Genres covered are Acid (303-style sequences, squelchy basslines, and filter-driven riffs), Trance (euphoric leads, arps, and progressive melodies), Techno (pulsing bass, gritty textures, and hypnotic synth lines), and Goa (psychedelic-style patterns and tribal melodic energy).

  All content is delivered in industry-standard WAV and MIDI formats, compatible with every major DAW including Ableton Live, FL Studio, Logic Pro, Cubase, Bitwig, and Studio One.
specs: |-
  - 345 total files
  - WAV loops, 4-bar, 150 BPM tempo-synced
  - Matching MIDI file for each loop
  - Acid, Trance, Techno, Goa, and Bass & Lead styles
  - Suitable for inspiration, live sets, sketching, or full productions
  - Compatible with all major DAWs and samplers
  - Built from sounds of the ABX3 synth and its Trance Presets Vol. 1 expansion
