details: >-
  The concert harp is a large and modern classical instrument, designed for
  classical (symphonic) music or played solo, as part of smaller chamber
  ensembles, and in cinematic orchestras. It's widely used in symphonic
  cinematic composition from smaller project to the largest imaginable john
  williams scores.


  With a wide harmonic range and diversity in performance styles this instrument
  is converted into a very flexible, easy to use but diverse sampled instrument.
  With "arpeggio" sonokinetic brings the epic power of the concert harp to your
  fingertips with a wide variety of multi layered instruments spanning from
  portato / staccato played to legato, flageolet, picked, bisbigliando and the
  highly popular press-de-table.


  Tempo synced scale runs and glissandi in all major, minor, diminished and
  pentatonic keys. With an all exclusive "arpeggio"- only collection of harpfx
  patches and a mind blowing user interface this instrument will not let you
  down.


  This instrument speaks to your imagination like no other. The beauty of the
  tone character is reflected in each composition. It's enchanting, mysterious
  and mystical. Each time the concert harp plays it brings orchestras, musical
  phrases and harmonic transitions to a creative peak.
