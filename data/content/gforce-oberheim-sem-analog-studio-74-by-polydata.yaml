description: Analog Studio '74 is a 50-patch preset pack for the GForce Oberheim
  SEM synthesizer, designed by Polydata (Shahruz Moshtael). Carefully crafted to
  serve as a powerful studio toolbox, covering a wide range of production styles
  with tones spanning arpeggios, basses, leads, textures, and more.
details: |-
  The Oberheim SEM was designed as a simple expander to existing monosynths, but it was so much more — boasting unique features and capable of a wide range from high-end fizz to the beefiest bass. Analog Studio '74 approaches the SEM not as a mere expander, but as the bread and butter of a capable synthesist.

  These 50 patches were carefully designed to be a powerful toolbox for the studio, packed with tones for a wide range of productions of any style. Polydata is the work of composer and sound designer Shahruz Moshtael, who draws inspiration from the first golden age of analog synthesis from the late 1970s to early 1980s.
