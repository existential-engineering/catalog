description: Analog Studio '74 is a 50-patch preset pack for the GForce Oberheim SEM synthesizer, designed by Polydata (Shahruz Moshtael). Carefully crafted to serve as a powerful studio toolbox, covering a wide range of production styles with tones spanning arpeggios, basses, leads, textures, and more.
details: |-
  The Oberheim SEM was designed as a simple expander to existing monosynths, such as the Minimoog or ARP Odyssey. While it surely did that, it was so much more. Boasting one-of-a-kind features and capable of a wide range of sounds – from high-end fizz to the beefiest bass – the SEM had the power to be a veritable centrepiece of a modern studio.

  Analog Studio ’74 approaches the SEM in this way, seeing it not as a mere expander, but as the bread and butter of a capable synthesist. These patches were carefully designed to be a powerful toolbox for the studio, packed with tones for a wide range of productions of any style, and robust enough to be all you need, enabling you to focus and keep inspiration flowing.

  About Polydata: Polydata is the work of composer and sound designer Shahruz Moshtael. Both in creating music and in designing sounds, he draws inspiration from the first golden age of analog synthesis from the late 1970’s to early 1980’s, but with the aim of moving forward into the future, continuing to develop that style and approach, rather than just repeating the past.

  The pack is only available to registered users of GForce Oberheim SEM. Additionally, it is exclusively available via this website as a direct download via “My Instruments” when the purchase has been completed.
