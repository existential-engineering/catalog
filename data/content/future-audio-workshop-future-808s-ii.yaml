details: |-
  Dive into the next generation of subs and 808s with Future 808s II. Picking up where our Future 808s factory pack left off, this collection is a forward leap in the evolution of the iconic 808 sound.

  You'll get 15 808 and sub-bass sounds that range from buzzy and intricately textured to warm and immersive, all with a modern edge. Dive in and use them as-is or customize to fit your signature sound.

  Credits: This pack was designed by Ghostplayer.

  Once your purchase is complete, the pack will show up in your FAW account. Simply download the zip file and follow the instructions on how to import your new sounds into SubLab XL.
specs: |-
  - 15 808 and sub-bass presets for SubLab XL
  - Patches: BNYX, BODY, DEAD, DOJA, GO OFF, GRAVE, K3N, KILLA, KUP, MINUS, PLUS, RAYQUAZA, RED, THE DOGS, ZAP
  - Designed by Ghostplayer
