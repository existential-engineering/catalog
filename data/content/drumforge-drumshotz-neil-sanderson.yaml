description: "One-shot signature sample collection from Three Days Grace drummer Neil Sanderson. 187 samples in 44.1 kHz, 24-bit WAV format — 33 kick, 77 snare, and 77 tom samples — recorded at The Reverie Studio in Peterborough, Ontario through a classic SSL 6000 console."
details: |-
  Neil Sanderson, the acclaimed drummer for the multi-platinum band Three Days Grace, has been a dominant force in rock music, boasting 17 #1 hits over his impressive two-decade career. His distinctive drum sound and style is now accessible through this exclusive one-shot drum sample collection.

  Drumshotz Neil Sanderson captures the essence of Neil's iconic sound, meticulously recorded at The Reverie Studio in Peterborough, Ontario. Overseeing the session were engineers Adam Haggarty and Alex Krotz, whose expertise have shaped the sounds of artists like Three Days Grace, Larnell Lewis, and The Strumbellas. The recording took place through a classic SSL 6000 console, renowned for its warmth and clarity.

  Purchase includes instant digital download, perpetual license, free lifetime updates, and unlimited customer support.
