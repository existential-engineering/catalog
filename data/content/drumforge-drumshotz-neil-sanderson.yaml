description: A 187-sample one-shot drum collection from Three Days Grace drummer Neil Sanderson, recorded at The Reverie Studio through an SSL 6000 console.
details: |-
  Neil Sanderson, drummer for the multi-platinum band Three Days Grace, has been a dominant force in rock music with 17 number one hits over a two-decade career. This exclusive one-shot collection makes his distinctive drum sound and style available for use in any production.

  The samples were recorded at The Reverie Studio in Peterborough, Ontario, with engineers Adam Haggarty and Alex Krotz overseeing the session. Both have shaped the sounds of artists such as Three Days Grace, Larnell Lewis, and The Strumbellas. The signal path ran through a classic SSL 6000 console, chosen for its warmth and clarity.

  Drumshotz is a series of drum samples sourced from professional mixers, meant to enhance, blend, or replace drum sounds in a mix. These can be mixed and matched with existing sample libraries or raw drum recordings to add chart-oriented rock power.
specs: |-
  - One-shot signature sample collection from Three Days Grace drummer, Neil Sanderson
  - Engineered by Adam Haggarty & Alex Krotz
  - Recorded at The Reverie Studio through an SSL 6000 console
  - 187 samples total in 44.1 kHz, 24-bit WAV format
  - For use with any triggering program or DAW
  - 33 kick samples
  - 77 snare samples
  - 77 tom samples
