details: >-
  Arpeggios are an integral part of chiptune music, and the 8-bit arpeggios pack
  is a large collection of 8-bit sample instruments with all of the basic
  arpeggio types, including: major, minor, perfect 5th & octave arpeggios.


  Square, triangle, and 2 pulse width variations. Fast & slow variations.
  Various chord intervals and arpeggio directions.


  This pack contains: 144 arpeggio instrument patches (72 sustained and 72
  stabs) for native instruments kontakt, ableton live, maschine, logic pro
  exs24/sampler, fl studio, mpc expansion pack, and tal-sampler.


  5256 8-bit arpeggio samples. 24-bit, 44.1 khz wav files.


  8-bit arpeggios is part of the 8-bit instruments & drums bundle.
