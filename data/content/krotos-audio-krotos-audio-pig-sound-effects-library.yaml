details: |-
  Provided by Coll Anderson. Thanks to a visit to the Woodstock Animal Sanctuary, this pig library is completely packed with various squeals, snorts, grunts, growls, and breaths.

  The true size of these 400+ pound giants really comes through these samples thanks to their amazing, chesty vocalisations.

  Sound categories included are animal, animals, breaths, creature, creatures, farm, farms, groan, groaning, growl, growls, grunt, grunts, gurgling, honk, pigs, raws, roar, snort, snorts, squeal, squeals, wheeze and wheezing.

  The purchase contains two downloads: a zip file with all source sound effect asset files plus a Metadata PDF, and an installer for the integrated Reformer Pro library.
specs: |-
  - 180 sound files
  - 983 MB size / 2.37 GB Reformer Pro integration
  - 24 bit / 96 kHz high-quality WAV files
  - 100% royalty-free commercial licence
  - Embedded metadata
  - Reformer Pro sound packs included
