details: |-
  BPB Cassette 808 is a free collection of Roland tr-808 drum machine samples in
  24-bit wav format. The sounds were recorded by gregor zemljic in his mastering
  studio, passed through a high end signal chain and enhanced with a subtle lf
  boost.

  An additional set of drum hits that were re-sampled from an audio cassette
  deck is also included, providing a different take on the classic 808 drum
  sound.

  The pack contains a set of three instrument patches for ni kontakt 5. These
  nki patches feature a simple customized user interface providing direct access
  to the low-pass filter, envelope, reverb and delay controls.

  Contents: 87 audio samples in total (24-bit wav format). 3 instrument patches
  in nki format. 9 mb download size (zip).
