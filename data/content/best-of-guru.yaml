details: |-
  Best of GURU is a geist expander bringing together the highlights of the guru
  factory sound library. With 3gb of diverse kits, loops and single-hit sounds,
  Best of GURU offers a huge array of sounds pre-formatted for geist to drop
  into your productions.

  The pack includes a wide variety of goldbaby samples and loops, yellow tools
  acoustic kits and a comprehensive suite of classic vintage drum machine
  sounds, as well as a wealth of material from wizoo platinum, groove criminals,
  gearshift and biolabs, amongst others.

  In total, best of guru contains over 350 kits, over 1500 loops and over 9500
  single-hit sounds.

  The included samples and loops are all supplied in .wav, .aif or .rx2 format
  and can be used in any software or hardware instrument which can load these
  formats.
specs: |-
  - 3gb sound library
  - 350 geist-format kits
  - 1500 .rx2 loops
  - 9500 single-hit wav/aiff samples
  - .wav format support
  - .aif format support
  - .rx2 format support
  - Geist expander
  - Compatible with geist and geist2
