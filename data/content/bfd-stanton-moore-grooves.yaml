  - 7 palettes in 4/4
  - Kick, snare, hihat and cymbal parts
  - Funk, r&b, rock and pop genres
  - Bfd3 v. 3.2.1.2 or above required
  - Windows 7 or above
  - Os x 10.8 or above
  - 23 GB disk space
  - Internet connection for download and authorization
