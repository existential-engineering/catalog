details: |-
  The grooves feature kick, snare, hihat and cymbal parts dripping with stanton
  moore's classic brand of new orleans funk.

  The set comprises 7 palettes in 4/4 with over 200 grooves and 100 fills in
  total and is perfect for funk, r&b, rock and pop genres.

  Although it is intended to accompany the bfd stanton moore cymbals pack, it
  can be used with any kits in your installation.

  Stanton moore grooves is produced by cymbal masters.
specs: |-
  - Groove pack for bfd3, bfd eco, and bfd2
