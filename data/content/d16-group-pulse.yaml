description: Sound Expansion for Lush 2
details: |-
  Pulse is a sound bank of 130 presets designed exclusively for the Lush 2 synthesizer by sound designer HydraTek, built for those who crave brutal, aggressive, and untamed sounds. It delivers harsh, dark and gritty atmospheric pads, raw pulsing and chaotic sequences, and savage synthetic impacts, distortions and textures.

  Designed for hard-hitting electronic music, cinematic scoring, and industrial soundscapes, Pulse pulses with hypnotic energy, futuristic textures, and deep atmospheric movement, giving sound designers the tools to build, shape, and command the flow of sound.
specs: |-
  - 130 exclusive presets for the Lush 2 synthesizer
  - Harsh, gritty atmospheric pads
  - Raw, driving, chaotic sequences
  - Synthetic impact and distortion textures
  - Requires Lush 2 version 2.1.0 or newer
