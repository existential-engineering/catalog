details: |-
  🎹 Introducing MKSensation VIP for Yamaha Montage+ and up

  If you're familiar with the classic MKS piano module, you already know what this brings to the table. This expansion focuses on the two essential sounds that made that rack unit a staple: Piano 1 and EP 2 Chorus . These aren't just close imitations—they're carefully crafted, multi-layered recreations sampled directly from the hardware, with attention to detail that respects the original character. 🎧 The dynamics respond naturally to your playing—bright when pushed, smooth when laid back. 👐 Whether you're playing talk music behind a preacher or recording in the studio, these sounds feel right. They sit well in a mix and give you that familiar gospel texture without needing heavy tweaking. We also tailored the response and EQ for gospel musicians specifically—no extra fluff, just clean and usable tones with the right touch sensitivity and presence. 🎛️ Each patch is mapped with care, so you can focus on playing—not fighting with the sound. If you're serious about tone and grew up on that MKS flavor, this expansion was built with you in mind.
