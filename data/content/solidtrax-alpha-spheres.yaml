details: |-
  Alpha Spheres is a soundbank for the Roland juno-1, juno-2, hs-80, mks-50
  synthesizers and is fully compatible with the redominator plugin and rack
  extension from audiorealism.

  This bank will give you access to 64 carefully designed presets, which are
  heavily inspired by music from the 80's. These presets feel right at home in
  synthwave and the current retrowave genre, but due to its synthesizer nature,
  also suits a lot of other music styles as well.

  The lush chorus makes it ideal for pads, soaring leads & vintage basses.
  Almost all presets have modwheel & aftertouch assignments and are velocity
  sensitive.

  This bank features sysex formats for the roland synths and individual patches
  optimized for redominator. The included manual will give you detailed
  instructions how to install your new fresh presets.

  For hardware use, one of the hardware synths as mentioned above and a MIDI
  interface with MIDI-cables are required. For software presets, the redominator
  plug-in or rack extension by audiorealism is required.
specs: |-
  - 64 carefully designed presets
  - Sysex formats for Roland synths
  - Individual patches optimized for redominator
  - Modwheel assignments
  - Aftertouch assignments
  - Velocity sensitive
  - 19 leads
  - 16 basses
  - 10 drums sounds
  - 7 pads
  - 4 effects
  - 4 plucks
  - 2 bells
  - 2 organs
  - Compatible with Roland juno-1
  - Compatible with Roland juno-2
  - Compatible with Roland hs-80
  - Compatible with Roland mks-50
  - Compatible with redominator plugin
  - Compatible with redominator rack extension
