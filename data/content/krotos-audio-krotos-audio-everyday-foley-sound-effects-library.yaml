description: Work faster, easier and within budget with the Everyday Foley Sound Effects Library, which adds 57 ready-to-go presets for Weaponiser covering household, office and kitchen Foley.
details: |-
  Everyday Foley offers an exciting new way to add Foley sounds to a project. It is a new and versatile way to sync Foley to picture using Weaponiser's multiple engines for variation and simplicity.

  The sounds in this library offer an entirely new way to use Weaponiser for Foley. Designed by Stephan Schutze, Nick Netsall and Giorgos Mikrogiannakis, Everyday Foley contains 57 presets for Weaponiser including kitchenware, writing, household furniture and more.

  Foley is a vital piece of the puzzle for immersing an audience. Foley studios are expensive and are often out of reach for smaller-budget productions, so sound designers and editors need to rely on accurate and versatile libraries like this one.

  By using all of the MIDI fire keys within the plugin, Weaponiser becomes a multi-sampler full of essential Foley sounds recorded with pristine quality.

  The library covers home Foley (sofas, window blinds, chairs, writing, metal step ladder, drawers, toilet, compressed air and liquid sprays, water bottles, keys), office Foley (computer keyboard and mouse, filing cabinet drawer, perforator, stapler, labeller, paper, sticky tape, parcel tape) and kitchen Foley (kettle, microwave sequence, coffee mug, tea cup saucer, chopping food, pedal bins, Tupperware, glass, crockery, cutlery, plates, tableware).
specs: |-
