details: |-
  The Music Matters advanced music theory packages are designed to advance your knowledge of music theory and help you to understand the different areas needed to pass your grade six, seven or eight exam. This series, presented to you by abrsm examiner gareth green, will guide you through each area step by step in a clear and informative manor, lesson by lesson.

  Content split into a total of three separate packages covering all the areas of advanced music theory, and compositional skills. Part 1 contains six videos and focuses on taking a look at different types of chords and how to build and structure harmony: harmony, chords, diminished 7th chords, neapolitan 6th chords, augmented 6th chords, other chromatic chords.

  Part 2 contains five videos and focuses on the techniques used to write and compose melodies, figured bass and effective harmony: figured bass, dissonance & suspensions, writing effective harmony, melody writing, working from a score outline.

  Part 3 contains seven videos, taking a look at multiple examples of various questions and different types of writing and how to approach them: figured bass exercise 1, figured bass exercise 2, figured bass exercise 3, analysis exercise, melody writing exercise 1, melody writing exercise 2, melody writing exercise 3.

  The video tutorials in this package are in '.mp4' format. Mp4 files can be opened with windows media player and quicktime as well as a number of other multi-format media players. Vlc player is recommended as a free, cross-platform multimedia player that will play almost any video format including mp4 files.
specs: |-
  - Mp4 video format
  - Windows media player compatible
  - Quicktime compatible
  - Vlc player compatible
  - 18 total video tutorials
  - Part 1: 6 videos on harmony and chords
  - Part 2: 5 videos on melody, figured bass, and harmony
  - Part 3: 7 videos on exercises and analysis
