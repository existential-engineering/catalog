details: |-
  BassTone is an easy and quick reggae bass guitar powered by Kontakt. Its
  purpose is to deliver a nice and round bass sound in less than a minute.

  This instrument is not designed to replace a real bass guitar but it is a
  simple and affordable solution when it come to create a solid bass fundation.

  If you're a reggae or dub producer, this library was created exactly for you.
  Of course it can also cover a wide range of styles as long as you need a big
  bottom bass sound.

  Featuring 2 famous bass guitars, carefully sampled and processed, it features
  simple controls and allows you to setup your bass to fit your needs.

  User guide and presets included.
specs: |-
  - Powered by Kontakt
  - 2 bass guitars
  - Sampled and processed
  - Simple controls
  - User guide included
  - Presets included
