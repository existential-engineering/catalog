details: |-
  Bansuri melodies vol. 1 is a bundle of 100 loops featuring indian flute
  melodies. These loops are available in each scale and bpm, recorded in both
  low and high scales for versatility.

  The library has been created in kontakt format, allowing users to change each
  scale and bpm easily. It is available in kontakt, wav, and zip formats with a
  compressed size of 303mb and 501mb after extraction.

  To use the library, you must first ensure that you have the full version of
  native instruments kontakt 5.6.1 (or higher).

  The collection consists of slow romantic, sad, and dance melodies, making it
  essential for music production libraries.

  Bansuri melodies vol.1 by gbr loops is soundware (samples or presets that load
  into other products) for macos and windows.
