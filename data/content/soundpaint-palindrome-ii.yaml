details: |-
  Your Sonic Cinema

  Palindrome II picks up where the Palindrome I saga left off: An Ultra Deep-Sampled (UDS) analog synth library designed for professional composers as a sonic homage to all the latest and emerging scoring trends. Big Cinematic Arps. Badass Blockbuster Basses. Sweetly Distorted Leads. Modular Percussion. Beautiful Melodic Keys. Perfect. Prolific. Pads. Palindrome II was exclusively sampled from a $35,000+ stockpile of the most evocative analog hardware synths, including carefully selected instruments from Moog, Sequential, Erica Synths and Waldorf, as well as the coveted Andromeda poly-synth and modern classics like the Super 6. A Palindrome is a word or a phrase that reads the same backwards and forwards. Inspired by the sonic essence of the blockbuster traditions of a Christopher Nolan movie. Big, expensive, mesmerizingly synthetic scores by artists such as Hans Zimmer and Ludwig Goransson. The Soundpaint Palindrome series is a reflection and continuation of these new synthetic scoring trends. All the sonic colors of Palindrome II are primed to help you create your most moving and emotionally resonant music.
