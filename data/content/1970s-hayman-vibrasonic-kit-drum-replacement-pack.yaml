details: >-
  The 1970s hayman vibrasonic kit - drum replacement pack as mixed by stephen
  street comes with patches for slate trigger v2, drumagog 5 & 4 and
  drumxchanger. This hayman kit is a great representation of a classic british
  70s kit.


  The particular kit sampled is from around 1970 and was their standard five
  piece kit comprising of a 22" x 14" bass drum, 12" x 8" and 13" x 9" toms and
  a 16" x 16" floor tom. It's in a rather fetching metallic blue finish.


  The slate trigger patch has been created using the close mic, overhead and
  room mic samples from the kit with samples for the kick drum, snare and toms.
  The samples in this patch have up to 16 velocity levels and six round robins
  totalling 3280 samples in the tci format.


  The drumagog 5 patch uses the same samples and you can choose the balance
  between the close mic, overheads and room mics. This patch uses up to 8
  velocity levels with four round robins totalling 1216 samples for the kick,
  snare, toms and hi-hat in the gog format. If your version of drumagog contains
  the auto hi-hat tracking feature then the samples will follow the opening and
  closing of the hi-hat.


  The drumxchanger patch contains stereo mixed samples (a combination of the
  overhead, room and close mics samples) with eight velocity levels with no
  round robins totalling 74 samples in the splx format. The snares also contain
  a rimshot sample that have their own adjustable trigger threshold.
