description: "The pinnacle of footstep sound effects libraries, designed to work with Weaponiser. Recorded by professional sound designers who have worked on AAA game titles including Horizon: Zero Dawn and Ratchet and Clank. Covers 7 footwear types across 19 surfaces with over 8,000 sounds and 183 Weaponiser presets."
details: |-
  This is the pinnacle of footstep sound effects libraries, designed to work effortlessly and exclusively with Weaponiser. Krotos took the variation capabilities to a new level to create a comprehensive footsteps SFX library that is full of use cases.

  With more footwear and more surfaces than Krotos had ever recorded before, recorded by professional sound designers who have worked on AAA game titles including Horizon: Zero Dawn and Ratchet and Clank, every detail that goes into a footstep sound generator was considered to achieve a library that shines when used with Weaponiser's variation engine.

  What is included: over 8,000 standalone WAV files, all of the footsteps as unedited "Sausage" files to accommodate all workflows, over 180 ready-to-go presets for Weaponiser covering seven types of footwear from barefoot to boots, and footsteps recorded on 19 different surfaces including indoor and outdoor environments and weather conditions.

  Shoe types: shoes, sneakers, high heels, boots, socks, barefeet and flip flops. Surfaces: tile, metal grate, muddy field, broken glass, carpet, dirt, gravel, clean concrete, wet concrete, gritty concrete, puddles, firm snow, gritty slush, gritty snow, slushy snow, hollow wood, solid wood, leaves and sand.

  In Weaponiser the library is separated into two sections. Simple presets let you load up and hit MIDI C4 or the fire button for each step, or spot with MIDI instead of markers. Advanced presets use C#4 to E4 to trigger steps, scuffs, skids and other movements, so you can perform a sequence of notes for speed changes such as walking to running or running to a stop.
specs: |-
