details: |-
  Bm Bogna Ec Classic is the th-u expansion library, created by bert meulendijk,
  seeking to recreate the sound of his bogner ecstacy classic all-tube head. The
  library contains 101 studio (stomp+amp+cab) rigs, 39 DI rigs, 27 patches with
  bert meulendijk favourite tones, and 9 extra patches for th-u premium users.

  The original amplifier features 3 channels: green (clean), blue (mid gain),
  red (high gain), each one with three gain structures: "t" (tight), "l" (loose)
  & "m" (medium). Every channel+gain combination has been captured in the
  library, for a complete recreation of the original amp tone.

  The library includes two unique effects designed with bert meulendijk. The
  stryverb is a rich and lush reverb effect, with a long and modulated tail,
  with a very modern vibe. The parallel compressor includes a parallel knob
  which allows to blend the direct to the compressed tone, in order to have a
  full control over the dynamic of the instrument.

  Th-u is the first amp simulator which includes both the amp modeling and
  capturing technologies. The rig models are created from real setups: the
  overloud proprietary technology allows to capture the response of an entire
  rig, including the nonlinear and dynamic response of the amplifier, the
  cabinet, the microphones, the mic preamplifier and the room sound.

  The rig player, integrated into th-u, allows you to reproduce any nuance of
  the sampled rigs and to combine the models of different setups.
specs: |-
  - 3 channels (green/clean, blue/mid gain, red/high gain)
  - Three gain structures per channel (t/tight, l/loose, m/medium)
  - 101 studio (stomp+amp+cab) rigs
  - 39 DI rigs
  - 27 patches with bert meulendijk favourite tones
  - 9 extra patches for th-u premium users
  - Stryverb reverb effect
  - Parallel compression stompbox
  - Amp modeling and capturing technologies
  - Rig player integration
  - Nonlinear and dynamic response capture
  - Cabinet microphone and room sound modeling
