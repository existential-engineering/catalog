details: |-
  Artifact - sfx & texture loops from ModeAudio comprises a dense, 693mb palette
  of iridescent ambient sound, unravelling layers of dark, heavy bass,
  shimmering drones and delicate sonic swells across your music productions.

  Collecting 120 richly detailed, evolving samples into one royalty-free
  selection, the set ranges in total colour from warm, soulful orchestral
  harmony to stark, eerie and abstract sound design.

  From the rustle of processed, elemental field recordings and glimmer of
  spectral synthesis, to the pulse of sweeping noise and sfx textures, we've
  carefully crafted this library to add veils of mystery and ear-catching
  complexity to your music.

  With samples running from 11 to 24 seconds in length, there's an enticing
  depth and scope to the sounds that will slide seamlessly into any ambient,
  cinematic or downtempo DAW session you care to try them in.
