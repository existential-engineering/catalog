details: |-
  'Spire Essentials Vol 15 - Synthwave' is a royalty-free preset and MIDI pack for Reveal Sound Spire, designed for Synthwave Pop, Retro Pop, Synthpop, Dance, House and melodic electronic music.

  The pack includes 64 Spire presets and 47 MIDI files taken from the demo. You get ready-to-use leads, basses, plucks, chords, keys, pads, brasses and arps for building nostalgic synth hooks, warm chord progressions, retro-inspired basslines, melodic pop ideas and full Synthwave arrangements.

  Please note: Drums and some FX used in the demo are not included.
specs: |-
  - 64 Presets for Spire
  - 16 Leads (Presets)
  - 13 Basses (Presets)
  - 12 Plucks (Presets)
  - 7 Chords (Presets)
  - 6 Keys (Presets)
  - 5 Pads (Presets)
  - 3 Brasses (Presets)
  - 2 Arps (Presets)
  - 47 MIDI files
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
  - Requires Reveal Sound Spire v1.5.1 or higher
