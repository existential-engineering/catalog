details: |-
  Over 500 brand new sounds for the arturia v6 collection. Collection contains:
  cmi 150 presets. Sem 50 presets. Buchla easel 150 presets. Dx 7 152 presets.

  Collection is a mix of leads, pads, bass, sequences, synths, percussion and
  various other sounds.

  I want to make a special note about the cmi v set. Some of the top soft synths
  on the market were sampled in order to create this library. It's safe to say
  that you won't find anything like this set anywhere else. It is without a
  doubt the highlight of this collection.

  Demo was made with no external fx. Just compression and limiting to even out
  levels and prevent clipping.
