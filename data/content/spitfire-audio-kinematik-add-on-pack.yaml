details: |-
  Matt Bowdler, aka 'The Unfinished', delves into the interstellar world that is eDNA Earth , to create the mother of all add-on preset packs, with 150 new presets — from shimmering synth pads to thunderous basses and epic FX!

  This product requires a full version of eDNA Earth to run.
specs: |-
  - 150 presets across bass, drone, key, lead, pad, perc, scape, sequence, SFX, strings and synth categories
  - Requires a full version of eDNA Earth to run
  - 0.10 GB download size
  - 0.20 GB disk space required during install
  - Kontakt Player included (free download)
  - macOS 11, 12 or 13, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
  - Minimum 8GB RAM, 16GB recommended
  - Spitfire Audio App required
