details: |-
  Spiritbox are at the forefront of the heavy music scene known for their powerful grooves, and infectious songwriting. A huge driving force of their signature sound is fueled by drummer, Zev Rose. With exceptional performances, and a deep sense of musicality, Zev has helped define the drum sound of modern Nu Metal.

  Nu Metal Grooves by Zev Rose is filled with grooves and fills that are crafted to fit seamlessly into your songwriting process. Whether you're looking for an epic chorus, the perfect fill to carry you into the bridge, or just the right amount of space to allow your guitars to shine, Zev's grooves have exactly what you need.
