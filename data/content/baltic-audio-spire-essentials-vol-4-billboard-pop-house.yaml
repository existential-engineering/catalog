details: |-
  64 presets for the Reveal Sound Spire synthesizer, aimed at current Billboard Pop music, including hand-crafted basses, leads, arps, pads and synths.

  Each preset is programmed by a professional sound designer, with every parameter tweaked in detail, as a source for creating new and commercial sounds within a composition.

  The pack can also be used for genres like Deep House, Future House, EDM, Trap and Dance.

  In addition, 49 MIDI files taken from the demo are included.

  Please note: the drums, some instrument loops and FX used in the demo are not included in this product. They are found together in 'Billboard Pop Busters Vol 1 & 2'. These presets require v1.0.20 or higher of Reveal Sound Spire.
specs: |-
  - 64 Presets for Spire
  - 18 Basses (Presets)
  - 14 Synths (Presets)
  - 12 Leads (Presets)
  - 8 Pads (Presets)
  - 6 FX (Presets)
  - 3 Plucks (Presets)
  - 3 Arps (Presets)
  - Many Presets with Mod wheel assignment
  - 49 MIDI files
  - Multi-genre
  - PC/Mac Compatible
  - 100% Royalty-Free
  - Requires Reveal Sound Spire v1.0.20 or higher
