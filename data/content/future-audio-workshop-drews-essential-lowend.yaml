details: |-
  His sounds have graced countless hit tracks by artists like Future, Drake, and Bad Bunny. Now, he brings his sonic wizardry to SubLab XL with a collection of 808s and subs ranging from clean and punchy to absolutely warped and crunchy.

  Add Drew Adieu's signature sounds to your arsenal with 15 fully customizable 808s and subs. Expect lots of distortion and saturation, these subs and 808s will add tons of punch to your lowend.

  Credits: This pack was designed by Drew Adieu.

  Once your purchase is complete, the pack will show up in your FAW account. Simply download the zip file and follow the instructions on how to import your new sounds into SubLab XL.
specs: |-
  - 15 fully customizable 808 and sub presets for SubLab XL
  - Heavy on distortion and saturation
  - Patches: Atlanta, Banger, Crazy Reese, Focus, Hardcore, Heat, Heavy Reese, Holy, Leanin, Low Reese, Power, Pure, Rumble, Thick Boi, Thump
  - Designed by Drew Adieu
  - Delivered as a downloadable zip file via your FAW account
