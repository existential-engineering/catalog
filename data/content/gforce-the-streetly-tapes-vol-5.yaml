details: |-
  The Streetly Tapes Vol 5 is a collaboration between GForce Software and Streetly Electronics, delivering 24 tape banks sourced directly from original UK Mellotron masters recorded on EMI tape stock.

  This volume features exclusive guitar contributions from Adrian Belew (King Crimson) and Steve Hackett (Genesis), alongside a wide range of winds, reeds, strings, and other instruments. Over 150 M-Tron Pro patches are included, giving players immediate access to the full sonic palette of this rare collection.
