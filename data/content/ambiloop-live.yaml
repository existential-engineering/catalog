details: |-
  Ambiloop live is a sample-based software instrument for ni kontakt (5.5 and up), sfz, or it can be used as a sample/loop pack. Its name comes from ambient live guitar (in this case) looper sessions.

  All samples were made using electric guitar and various effects. Ambiloop live explores the technique of asynchronous looping, which is layering tape loops of differing lengths, no bpm, all are non-synchronous loops.

  With that technique, it creates an ever-evolving soundscape when several tracks are played together.

  Content includes 12 kits (with 6 tracks in each) instruments for kontakt (full version, v5.5 and up *not player version*) and same in sfz format, 72 single instruments for kontakt and sfz, and 72 wav loops (12 kits with 6 tracks each) at 24-bit 44.1 khz, totaling 504 mb unzipped.
specs: |-
  - Ni kontakt 5.5 and up (full version, not player version)
  - Sfz format
  - Wav format
  - 12 kits with 6 tracks each
  - 72 single instruments
  - 72 wav loops
  - 24-bit
  - 44.1 khz
  - 504 mb unzipped
  - Asynchronous looping technique
  - Non-synchronous loops
  - No bpm synchronization
