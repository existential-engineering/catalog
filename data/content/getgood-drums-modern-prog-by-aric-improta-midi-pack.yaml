details: |-
  Aric Improta is one of the most exciting drummers of all time and we are thrilled to bring you his signature groove pack: Modern Prog Grooves.

  Backflips and jumping seat-spins aside, Aric is a master on the drums. Excellent feel, powerful fast feet, and calculated execution of his incredibly creative performances.

  This groove pack will inspire your next writing session, giving you groove foundations that have never been heard before, allowing endless possibilities to take your songs in new creative avenues.

  From powerful tom grooves to intricate kick and hi-hat patterns, Modern Prog is full of creative, nuanced and musical drum parts. Use these grooves as a foundation for your riffs, vocal lines, and melodies, and let Aric be your drummer in the process.
