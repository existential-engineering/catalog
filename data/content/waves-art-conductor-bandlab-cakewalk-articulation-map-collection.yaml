details: |-
  Cakewalk allows you to control instrument articulations. Every single
  articulation in every library needs to be defined with names, controller data
  and a remote switch definition. This collection provides over 12000 maps
  containing over 160000 articulations with constantly added new libraries and
  free updates.

  Universally compatible. All sets are set up in the same way. Use one and know
  them all. The same abbreviations and wording are utilised across the entire
  collection.

  The articulations are listed in alphabetical order and the key switches follow
  the natural order within the instruments. The most important switches are on
  the lowest octave, always in the same order. This way you find the right
  expression fast and control it with ease.

  We've done everything to enable you to focus on your music instead of
  technicalities.
specs: |-
  - Articulation switching
  - Over 12000 articulation maps
  - Over 160000 articulations
  - Cakewalk compatibility
  - Universally compatible articulation sets
  - Alphabetical articulation listing
  - Key switch ordering
  - Free updates
