description: BFD Modern Drummer Snare Selects is an expansion providing 12
  premium and boutique snares for your bfd3, bfd eco and bfd2 installation.
details: |-
  Recorded with expressive detail levels, the instruments are all provided in
  snares-on versions along with selected alternate sounds with brushes, rods,
  hands and with snares off.

  When used in bfd3 and bfd2, an additional 'rim click' articulation is
  available as well as a 'half-edge' articulation for use with electronic drum
  positional sensing.
specs: |-
  - 12 premium and boutique snares
  - Snares-on versions
  - Brushes articulation
  - Rods articulation
  - Hands articulation
  - Snares off articulation
  - Rim click articulation (bfd3 and bfd2)
  - Half-edge articulation (bfd3 and bfd2)
  - Electronic drum positional sensing support
  - Expressive detail levels
  - Compatible with bfd3
  - Compatible with bfd eco
  - Compatible with bfd2
  - Windows 7 or higher
  - Os x 10.6.8 or higher
  - Internet connection for download and authorization
  - 15 GB full install
  - 7.5 GB medium install
  - 5 GB small install
