description: BFD London Sessions is an expansion pack for bfd3 and bfd eco
  featuring the bfd2 factory library recorded at London's air studios.
details: |-
  With 49gb of data and over 80 kit-pieces offering huge timbral variety, bfd
  london sessions also provides a wide range of mixing options. The legendary
  room at air's lyndhurst hall is captured by 2 pairs of room mics including a
  mid/side set capable of anything from true mono to richly expanded stereo.

  The mixing flexibility is further enhanced by 3 direct snare mics and far room
  mics packed with character and a huge sense of space. The neve console's air
  montserrat preamps and prism converters are used throughout, resulting in a
  warm yet defined sound.

  A huge range of rock sounds are made possible by the room mics while the
  punchy direct mics and silky overheads are suitable for all kinds of music
  from funk and jazz to pop, country and much more.
specs: |-
  - Expansion for bfd3 and bfd eco
  - Original bfd2 library recorded at London's air studios
  - 10 vintage and modern kits
  - 49gb of multi-channel audio
  - 24-bit 44.1 kHz audio
  - Over 80 kit-pieces
  - 2 pairs of room mics with mid/side set
  - 3 direct snare mics
  - Far room mics
  - Neve console with air montserrat preamps and prism converters
  - Hihats with 11 articulations
  - Cymbals with bell and edge hits
  - Windows 7 or higher
  - Os x 10.6.8 or higher
  - 27 GB disk space for bfd3 version
  - 52 GB disk space for bfd2 version
  - 18.5 GB disk space for bfd eco version
  - Internet connection for download and authorization
