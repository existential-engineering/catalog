description: A Kontakt drum library capturing the low-tuned, vibey drum sound of
  session drummer Aaron Sterling, featuring vintage and boutique kicks, snares,
  toms and cymbals. Includes a mixer-style interface with built-in reverbs and
  master channel effects like compressor, EQ, and tape saturation.
details: |-
  Aaron Sterling's playing has defined the sound of modern records for over two decades, from John Mayer and Taylor Swift to Harry Styles and Leonard Cohen. Revered for his understated feel and ability to serve the song above all else, Sterling is one of the most recorded drummers of his generation. This library captures that unmistakable character: low-tuned, vibey drums with depth, warmth, and detail, meticulously sampled to bring his signature sound into your productions. Every strike, every nuance, every ounce of character has been preserved to deliver an instrument that feels alive, expressive, and unmistakably Sterling.
