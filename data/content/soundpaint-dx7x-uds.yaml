details: |-
  The sound of 1984. Ultra Deep-Sampled

  The DX7 is one of the most iconic synths of all time. Originally developed by John Chowing (Father of FM synthesis) at Stanford University. The DX7 became synonymous with hit records for decades to come and a hidden tool of many today. With the DX7X UDS, you get the exact same synth that bands like A-Ha, Toto, Kool and the Gang, Herbie Hancock, Whitney Houston, Phil Collins, Brian Eno and thousands of others had - only better in Soundpaint. This is not emulation, but something entirely real. All the classic usages of the DX7 have been Ultra deep-sampled, including hundreds of Basses, Brass, Clavs, Organs, Tons of E-Pianos, Flute, Leads, Pianos, Strings, Pads, Tubular Bells and countless others. In addition, we also deep-sampled a massive collection of DX7 sounds through a custom analog outboard, including Strymon and Bricasti Reverbs, Meris Pedals, Roland 501 Tape Delay and dozens of other units to heat the cold digital signal. We would argue these sound better than the original DX7 itself, but the choice is entirely yours.
