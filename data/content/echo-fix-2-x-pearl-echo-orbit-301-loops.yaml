details: |-
  2 x Pearl Echo Orbit 301 Loops

  Packaged in slimline shock proof plastic cases. Note: Our tape is NOT BASF LGR-50 or Mastering tape which is not suitable for tape echos. The tape we use is very specific and ensures correct operation. Even mastering tape with a graphite backing is not suitable. Incorrect tape will cause low echo output, tape jamming, distorted echo output, little or no self oscillation, incorrect tone and excessive head wear. Over 90% of the the echo repairs that come in to our workshop are due to faulty tape loops that were made with incorrect tape. Make sure that you are familiar with your country's customs, taxes and importing laws.
