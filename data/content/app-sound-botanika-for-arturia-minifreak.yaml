name: Botanika for Arturia MiniFreak
manufacturer: app-sound
primaryCategory: preset-pack
url: https://www.app-sound.com/arturia/
description: Botanika is a sound pack with over 50 presets for the arturia
  minifreak v and the corresponding hardware synth.
details: |-
  As in the plant world, there are different types of sounds. Mostly they are
  pads and arpeggios, which can be played musically well.

  They show the more juicy and spherical realms of this synthesizer. Marcos 1
  and 2 as well as the modulation wheel allow for good expressive possibilities.

  50 new presets for the arturia minifreak. Pad, arpeggio, pluck, lead, bass.
  Controller assignments for mw, macro 1 and 2. Styles: electronica, retro,
  lofi, chillout.
specs: |-
  - 50 presets
  - Pad sounds
  - Arpeggio sounds
  - Pluck sounds
  - Lead sounds
  - Bass sounds
  - Controller assignments for mw
  - Macro 1 and 2 assignments
  - Modulation wheel support
  - Electronica style
  - Retro style
  - Lofi style
  - Chillout style
  - Arturia minifreak v compatible
  - Hardware synth compatible
