description: A sample library created by playing the strings of a concert grand
  piano directly with guitar picks and a small metal hammer instead of the keys,
  producing a sound between a harp and dulcimer.
details: |-
  Beauty On The Inside

  Most piano libraries record the keys. We didn't. We took a concert grand and played the strings directly, with guitar picks and a small metal hammer. The keys never get touched. What you hear is what's living inside the piano. Half harp, half dulcimer, all grand underneath. Free.
