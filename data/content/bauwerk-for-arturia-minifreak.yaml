name: Bauwerk for Arturia MiniFreak
manufacturer: app-sound
primaryCategory: preset-pack
url: https://www.app-sound.com/arturia/
description: Bauwerk is a sound bank with 100 universal presets for the arturia
  minifreak v and the corresponding hardware synth.
details: |-
  The german word "bauwerk" means building. So please feel free to build your
  own sound variations with this start up library.

  Styles: pop, electronic, retro, chillout, dance.
specs: |-
  - 100 universal presets for arturia minifreak v
  - 100 universal presets for arturia minifreak hardware synth
  - Ba (22)
  - Chrd (18)
  - Pd (11)
  - Arp (15)
  - Pl (8)
  - Ld (8)
  - Sc (5)
  - Perc (3)
  - Controller assignments for mw
  - Macro 1 and 2
  - 16 bonus MIDI demo files
