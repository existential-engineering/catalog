details: |-
  Babylon: Roots Reggae from Big Fish Audio is booming straight out your sound
  system! You'll find the authentic live recorded feel of a jerk jam on a hot
  island day in a Massive 20 construction kits.

  There's skanking guitars, lazy horns, and bubbling organ chops, with a riddim
  section that will keep the groove vibin for your productions.

  If you're searching for that wailers, tubby, upsetters sound, look no further.
  This collection is all about roots: you'll find reggae, ska, rocksteady and
  dub elements.

  Along with multiple files for the instruments in each kit (bass, live drums,
  electric drums, guitars, organ, piano, sax, trombone, etc.) we've included a
  folder of over 60 fx hits such as risers and transitions to spice up your
  productions.

  Babylon: roots reggae will give you the inspiration and flexibility to be able
  to seamlessly create something unique.
