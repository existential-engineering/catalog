details: |-
  Kris Crummett is a producer, mix and mastering engineer known for bringing about breakthrough and defining albums with Sleeping With Sirens, Issues, Dance Gavin Dance, Emarosa, In Fear and Faith, Alesana, Crown The Empire, Slaves and Jonny Craig.

  This expansion pack is loaded with tonal options, all meticulously dialed in by Kris to give you the complete guitar sound for any genre of music. Using many of his go-to amp and cab combinations, paired with the best microphones and preamps from his studio, this pack is the result of years of experience recording and experimenting.

  Kris's pack contains 108 captures.
