details: |-
  The Boom Bap Bang Drum Kit comes with high quality one-shot wav files and a
  virtual instrument. This pack contains over 730 drum hits with 500 megabyte's
  of high quality wav one shots.

  The drum kit features dusty drums ripped from vinyl records, gritty 45's dug
  up from record stores around the globe, dilapidated treasures found in
  grandpa's attic, and discovered gems hidden in the darkest basements.

  A unique vintage style boom bap VST plugin was created with all wav files
  placed into drum beast pads that are perfectly arranged for ease of use. The
  software works as windows 32-bit and 64-bit VST plugin, mac VST plugin & mac
  audio unit.

  The pack includes a folder with MIDI drum loops & wav drum loops prepared in
  the virtual instrument. Users can drag any of the provided MIDI files onto the
  track of the VST plugin and press play, or create their own.

  All sounds and samples are licensed as royalty-free for use in commercial
  productions or for dj/remix purposes.
