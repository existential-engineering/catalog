details: |-
  Bright, bold, and hyper-modern. Pop Proteins is built for producers chasing immediacy and impact. Inside you'll find hard hitting leads, punchy basses, and synth tones that beg to be in the spotlight.

  These are sounds that cut through the mix, demand attention, and fuel the kind of high-energy productions that stick in your head long after the track ends. Whether you're sculpting chart-ready pop, slick club beats, or experimental hybrids, Pop Proteins brings a spark of the unexpected.

  This is an Expansion Pack for Tomofon. A license of Tomofon (bought separately), or the installed iOS app, is also required to use it. The expansion works both on macOS/Windows and iOS.
