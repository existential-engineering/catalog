details: |-
  Designed for composers, songwriters and producers, this is an intimate and deeply personal set of tools, curated by BAFTA-winning composer Ólafur Arnalds, recorded at his studio in Reykjavik, Iceland.

  It centres around a characterful 'felted' grand piano, as well as a comprehensive set of inspiring sonic manipulations and progressive synth sounds, designed with the writer in mind.
specs: |-
  - 15.2 GB download size
  - 16.00 GB disk space required during install
  - ~4691 samples
  - Kontakt Full or Kontakt Player 5.6.8 or higher required
  - Felted antique 1904 Bechstein grand piano
  - 4 piano signals: KM84, Coles, Processed, Spaced
  - Nearly 100 presets in Spitfire's Mercury synth engine
  - macOS 11 to OS 26, minimum 2.8GHz quad-core i5 and 8GB RAM
  - Windows 10 or 11 (64-bit), minimum 2.8GHz quad-core i5 or Ryzen 5 and 8GB RAM
