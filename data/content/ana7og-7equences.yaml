details: >-
  300+ mb of pure analog sound. 50 sequences inspired by the best in techno,
  deep and progressive sounds. Organic, lifelike, sounds with movement, sounds
  with texture. Sounds to inspire.


  Produced with all analog hardware. Sounds extracted from studio electronics
  se-3x, original roland sh-101s, mfb dominion, erica synths db-01 and syntrx
  and all sounds garnished with high quality analog creative fx including moog
  mf 108, original roland space echo, sherman filterbank and more.


  Final processing was done with the analog manley varible mu and iron age
  compressors for extra warmth and body.


  What included in this sample pack: 50 analog sequence wave files. 50
  corresponding MIDI files for each sequence. Bpm: 120 bpm. Type: wav.


  This sample pack is brimmed with quality sound which is sure to provide deep
  inspiration and high quality samples to give you a professional sounding
  output right at the composition stage.
