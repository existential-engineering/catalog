details: |-
  Grab instant analog & digital synth vibes #organic #movements #nasty #modular #mashups. The real fun started while processing those strings of analog dna with all the wizardry a great synth like Serum has to offer: applying digital synthesis, (using warp, FM, filter...) and then rendering and resampling those into new multi-cycle, preprocessed wavetables. Nasty, dirty movements... Modular, warm vibes... A whole bunch of saw fractals... Vibrating molecules. As a result you get the best of both worlds: analog, digital, hybrids and mashups.

  21 presets for xfer serum: the framework preset ready to play & load pre-processed, multi-cycle wavetables. Easy & hassle-free. With the scan-through automation already in place, grabbing instant synth sounds just by loading wavetables is super simple.

  20 starter presets the presets we used for the audio demos. Based on the framework preset, those presets include the exact speed settings for the parameters env2 & lfo1 that trigger the wavetable-scan-through process. They are a fantastic starting point to build your own presets. With all the other internal synthesis and fx untouched, take a leap and go from here.

  All 460 wavetables divided into different categories that match the characteristics of those new & fresh ingredients. The goal was to create wavetables that sound amazing just by loading them into your favorite wavetable synth.
