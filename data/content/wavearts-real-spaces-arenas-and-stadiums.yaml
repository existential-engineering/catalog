details: |-
  The Arenas and Stadiums Library is a collection of impulse response (IR) files measured in large spaces, from gymnasiums to arenas to pro football stadiums. It includes responses made with a variety of microphone techniques and placement.

  The library can be used for voice over PA simulation, or for Foley work.

  Real Spaces Arenas and Stadiums is included in the Real Spaces Complete bundle.
