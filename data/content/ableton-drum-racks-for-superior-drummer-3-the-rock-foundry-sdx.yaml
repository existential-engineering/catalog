details: |-
  Ableton Drum Racks for Superior Drummer 3 The Rock Foundry SDX features
  separate Ableton drum racks for all factory presets for the toontrack superior
  drummer 3 the rock foundry sdx expansion library. These racks provide out of
  the box integration workflow between Ableton live and toontrack superior
  drummer 3 including a host of features ready to use for composition and
  performance using Ableton push or similar controllers.

  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all rock foundry factory presets from ableton push
  controller device browser.

  70 ableton drum racks to instantly load the sd3 rock foundry factory library
  "mix ready" presets with ableton mappings. 35 ableton live templates designed
  to host the multi channel output routing presets with track level audio
  routing from superior drummer 3 into ableton live.

  Colour coded pad design for visual performance and finger drumming. All our
  racks use consistent drum rack colouring so you can visually and immediately
  spot your rides from your hi hat articulations.

  Vast array of instrument articulations ready to go in one massive layout using
  ableton push 64 pad layout mode. Individually labelled drum rack pads for
  clear visualisation, post performance editing and automation to all drum rack
  / instrument articulations in ableton.
specs: |-
  - Ableton drum racks
  - Toontrack superior drummer 3 integration
  - Ableton live integration
  - Ableton push controller support
  - 70 Ableton drum racks
  - 35 Ableton live templates
  - Multi-channel output routing
  - 64 pad layout mode
  - Colour coded pad design
  - Individually labelled drum rack pads
  - Rock and metal genre presets
  - macOS and Windows compatibility
