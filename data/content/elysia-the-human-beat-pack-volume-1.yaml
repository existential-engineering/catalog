details: |-
  THE HUMAN BEAT PACK Volume 1 is a stereo groove pack of 50 creative drum grooves with variations and loops, played on real drums by Demian Kappenstein and recorded and mixed by producer Moses Schneider in collaboration with elysia. The files are 24bit/48kHz WAV, delivered as an instant download, and the pack is intended to work with any music or video software.

  Moses Schneider, a Berlin native, is known for creative microphone techniques such as "the Wurst", "Snareo" and "Droom", and for recording all instruments at the same time in one room. The pack is presented as a way to work with that approach, which the page calls the Moses Schneider Method.

  Demian Kappenstein studied jazz percussion, percussion jazz/rock/pop, free improvisation and contemporary music at the Dresden University of Music, and was later a master student of composer and percussionist Eric Schaefer. His solo percussion work connects electronic and acoustic music with their visual perception.

  elysia analog hardware was used to shape the sound during the recording process, and the stereo tracks were also mastered through elysia hardware to finish the mix.

  The session was captured at the Limusic Residential Recording Studio in the south of France, between the Pyrenees and the Mediterranean, on a former vinery. Alongside standard drum equipment the session used old springs, metal parts and pieces of wood. Kits included a Canopus Ash Series set and a vintage Tama Superstar, with Ludwig Supraphonic and Tama Superstar snares and cymbals from Meinl, Zildjian and Istanbul Agop.
