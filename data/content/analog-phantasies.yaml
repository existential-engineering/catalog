  - Mpe (MIDI polyphonic expression) compatible
  - Volume matched presets
  - Velocity modulation capabilities
  - Noise lfo utilization
  - Tal-pha v1.1.6 or newer required
  - Windows 7 or newer
  - Os x 10.9 or newer
  - Linux ubuntu 18 or similar or newer
  - Digital audio workstation (DAW) required
  - Os x / windows / linux compatible
  - 100% royalty-free
