details: >-
  Introducing analog phantasies: our latest expander for the exceptional tal-pha
  synthesizer from togu audio line, known as tal in the scene. With tal-pha, tal
  makes a wish come true for a lot of roland synthesizer enthusiasts, as it is
  the last of the juno series from the 1980s. With additional waveforms,
  advanced envelope, adjustable chorus rate, aftertouch, and more, it was
  already sonic wise - the most interesting juno in our view.


  Now it's time to unleash its full potential and take advantage of the
  incredible improvements tal has introduced for tal-pha. With features such as
  three selectable filters, oscillator sync, oscillator mix (separate volume
  control for the waveforms), mpe (MIDI polyphonic expression), the addition of
  a musically sounding reverb and delay, and a parametric (bell) eq, it will
  make loads of people happy.


  Analog phantasies is a massive sound set that offers 177 presets across 11
  different categories, designed to fuel your creative process. Whether you're
  composing 80s-style tracks, ambient, cinematic, synthwave, retrowave, or
  exploring other genres like house, techno, trance, or even gabber/hardcore,
  these presets are here to assist you in succeeding in your musical endeavors.


  We love the new features of tal-pha, especially the ones utilizing the noise
  lfo, a feature not available on the hardware, which can add intriguing
  textures or 'salt and pepper' to the sounds and your music. The presets are
  made with the utmost precision, are volume matched and make heavy use of
  velocity and the modulation capabilities.


  They even work with mpe-enhanced controllers and are lovingly crafted with
  tal-pha v.1.1.6 to ensure they shine in your productions.
specs: |-
