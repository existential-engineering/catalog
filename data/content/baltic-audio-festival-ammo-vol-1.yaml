details: |-
  'Festival Ammo Vol 1' from baltic audio includes six EDM construction kits at 128 BPM, with one-shots for every sound and MIDI for the most important sounds.

  Over 1450 MB of content is split into melody lines, synths and matched drums, percussion and FX, with drops aimed at club use.

  Everything is supplied as 24-bit WAV and MIDI with ending tails of reverb.
specs: |-
  - 6 Construction Kits (128 BPM)
  - Each Kit tagged with perfect KEY
  - Over 1450 MB of content
  - 100% Royalty-Free
  - Every Kit with 44.1khz/24-Bit WAV
  - MIDI for the most important sounds included
  - One-shots for every sound, tagged with the right pitch
  - Unlooped tails
  - PC & MAC compatible
