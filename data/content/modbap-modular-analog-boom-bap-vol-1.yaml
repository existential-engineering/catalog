  beatppl · Analog Boom Bap Demo - Fractions by Upright Music

  Descriptions

  Digital Download Only. This collection of one shot drum samples and effects was designed with a dirty and authentic boom bap aesthetic. Its sounds were crafted using blends of vinyl samples (including noise and static), organic hand percussion, analog drums, and analog efx from various analog synths and machines. 201 samples were treated with different configurations of specialized audio chains, including Minimoog Voyager Low Pass Filter, MPC 60 II vintage sampler, analog mixing consoles and reel to reel tape machines for optimal result. The result is a sample pack full of vinyl & electronic, dirty, saturated 'synth-bap' ready drums and efx that bang.
