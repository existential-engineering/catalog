details: |-
  Introducing the Progressive Fusion Midi Groove Pack, performed by Richie Martinez of the band Arch Echo. Just like Richie, these grooves are packed with energy!

  These beats punch with power, have blisteringly tasty fills, and triple down on complex kick patterns that will have your listeners ready to tap out (and bob their heads) in the very best way!

  Richie poured a ton of time and passion into this pack, and it's our hope to have that translate into your songs when you craft your parts around these grooves. Whether you're writing progressive rock or metal, or another fusion of multiple genres, there's definitely something that'll fire you up and get the inspiration flowing.
