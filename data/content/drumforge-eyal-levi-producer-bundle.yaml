  Drum Vault Eyal Levi features premium TCI format samples designed for Slate Trigger 2.0, recorded and mixed by Eyal Levi himself. It includes 3 kick drums, 3 snare drums, and 3 sets of toms captured in a professional studio environment. Multiple velocities and round-robin sampling ensure realistic and dynamic drum performances.

