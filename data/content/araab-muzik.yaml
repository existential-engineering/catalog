details: |-
  Araabmuzik combines hip-hop, trap and edm genres into a thunderous collection
  of drums and samples that promise to fill dance floors from compton to ibiza.
  The expansion includes over 1.3gb of stunning samples and kits/melodics, all
  pre-mapped into mpc programs for instant availability and music production.
  Each kit is presented with studio-processed quality.

  Araabmuzik for mpc contains 32 artist kits made up from hard-hitting drum
  sounds, all processed for production-quality, assigned to 16 pads across 8
  banks. Also included are 80 melodic phrases, 15 instruments, 519 one-shots,
  sfx, 89 drum loops, 15 bass loops, along with 64 stunning preset patches for
  hybrid 3, delivering club-shattering synth, lead and pad patches.

  Akai professional is releasing high-quality artist expansions for the first
  time, enabling users to utilize a more sonically-compelling workflow, which
  takes advantage of all the classic mpc features, such as drum layering, 16
  levels, note repeat, mpc swing through to vintage emulations, all of which
  enhance the production.

  There will also be an impcpro version, which delivers a selection of the same
  cutting-edge samples and melodics featured inside the mpc version, allowing
  users to enhance the impcpro with production-ready samples. Impcpro version
  features pre-mapped kits across multiple banks and a collection of high
  quality one-shot hits.

  The samples have been professionally designed and mapped for instant access
  and maximum usability. Araabmuzik's incredible finger drumming and samples
  highlight the amazing production experience that users enjoy with mpc.
