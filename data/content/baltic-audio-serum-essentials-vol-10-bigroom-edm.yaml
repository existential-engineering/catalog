details: |-
  'Serum Essentials Vol 10 - Bigroom EDM' is a royalty-free preset and MIDI pack for Xfer Serum, designed for modern Bigroom EDM, festival EDM, Dance, Future House and Progressive House productions.

  The pack includes 64 Serum presets and 47 MIDI files taken from the demo, giving ready-to-use leads, basses, plucks, chords, pads, keys, voices and FX for powerful drops, festival leads, melodic hooks, energetic basslines and full EDM arrangements.

  Requirements: Xfer Serum v1.3.5.7 or higher is required.

  Please note: Drums and some FX used in the demo are not included.
specs: |-
  - 64 Presets for Serum
  - 26 Leads (Presets)
  - 15 Basses (Presets)
  - 8 Plucks (Presets)
  - 6 Chords (Presets)
  - 3 Pads (Presets)
  - 3 Keys (Presets)
  - 2 Voices (Presets)
  - 1 FX (Preset)
  - 47 MIDI files
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
