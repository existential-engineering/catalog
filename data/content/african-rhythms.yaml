details: |-
  African Rhythms library comes with 10 drums from north & south africa performed with local styles. Play dynamic solo instruments, Massive pattern collection or use phrase builder to personalise your grooves.

  We have selected drums that are at the core of african culture as well as rare and tribal instruments that are hard to find anywhere else. This collection is performed authentically by multiple musicians from burkina faso, mali & morocco and co-produced by james cleeland.

  You can play all these instruments to create your own patterns. We have created solo play and phrase play presets to help create realistic performances. Solo plays come with solo hits as well as short phrases while phrase plays inspire you to combine slightly longer phrases.

  We have recorded and edited 145 ready to go patterns for cinematic, dance and natural styles. In addition you can find longer performances to tempo as well as free form. These are great for building complete tracks.
specs: |-
  - 320+ samples for Kontakt & wav
  - 10 solo instruments playable in multiple styles
  - 145 patterns time synced
  - Natural, dance & cinematic suites
  - Phrase builder to build personalised patterns
  - Kontakt full version (5.8 or more)
  - 700mb+ unzipped
