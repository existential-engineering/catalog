details: |-
  Take your productions into new wave dimensions with InStaber, a powerful add-on for Rave Generator 3 featuring 128 expertly crafted presets. Inside, you'll find a versatile collection of 22 deep Basses, 20 expressive FXs, 17 cutting Leads, and 69 iconic Stabs designed to capture the essence of retro and modern wave-driven music.

  Perfect for producers who need authentic stabs and chords, this pack is infused with the character of 80's stabs, lush 80's chords, synthwave textures, cinematic synthy scores, and the moody vibes of coldwave, new wave, hollowwave, and beyond.

  Whether you're sculpting a nostalgic track or pushing wave-inspired genres forward, InStaber gives you the tools to add depth, energy, and timeless synth character to your sound.
