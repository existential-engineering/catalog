description: A one-shot drum sample collection curated by RIAA-certified producer Joey Sturgis, featuring 57 professionally mixed samples designed to add punch and consistency to drum recordings. Sturgis is known for his work with metalcore and hardcore artists including Asking Alexandria, Of Mice & Men, and The Devil Wears Prada.
details: |-
  Drumshotz Joey Sturgis Fire Edition is a one-shot drum sample library curated by RIAA-certified metal and hardcore producer Joey Sturgis. The pack is designed to bring professional-grade punch and consistency to drum mixes, whether layered over live recordings or used as replacement samples.

  The library contains 57 total samples delivered in 48 kHz, 24-bit WAV format. All samples are pre-blended and normalized, making them drop-in ready for any DAW without additional processing.

  The collection includes 5 direct kick samples with matching room mics, 5 direct snare samples with matching room mics, and 9 tom samples covering high, mid, and floor toms — each with direct and room mic variants.

  Joey Sturgis is recognized for producing landmark albums in the metalcore and hardcore genres, with credits spanning Asking Alexandria, Of Mice & Men, and The Devil Wears Prada. His sonic signature — aggressive attack and controlled low-end — is reflected throughout the pack.
specs: |-
