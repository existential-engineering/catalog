description: A second collection of one-shot drum samples from RIAA certified metalcore producer Joey Sturgis, with matching direct and room captures, pre-blended and normalized.
details: |-
  Drumshotz Joey Sturgis Fire Edition is a signature one-shot drum sample collection from RIAA certified record producer Joey Sturgis, whose credits include Asking Alexandria, Of Mice & Men, and The Devil Wears Prada. He has been building competitive drum sounds for over 20 years and is a reference point in the metalcore and hardcore genres.

  Every drum is supplied with matching captures rather than as an isolated hit: 5 direct kick samples with matching room samples, 5 direct snare samples with matching room samples, and 9 toms covering high, mid, and floor positions in direct and room versions. Samples arrive both separated and pre-blended by Sturgis, so an engineer can use his balance directly or build their own.

  All 57 samples are normalized and delivered as 24-bit / 48 kHz WAV files for use with any drum triggering program or DAW.
specs: |-
  - 57 one-shot drum samples total
  - 24-bit / 48 kHz WAV format
  - 5 direct kick samples with matching room samples
  - 5 direct snare samples with matching room samples
  - 9 toms covering high, mid, and floor positions with direct and room samples
  - Samples supplied both separated and pre-blended by Joey Sturgis
  - Pre-blended and normalized
  - For use with any triggering program or DAW
