details: |-
  Blueprint: Gentle Strings follows on from the third library in this series,
  gentle winds. This time, we have recorded a chamber-sized string ensemble in
  the large main studio at the nave. The library features mutes on the strings,
  playing the long con sordino articulation- resulting in a soft cinematic sound
  commonly used for scoring.

  The library is incredibly versatile though, and has further applications in
  popular music and productions.

  Minimal controls actually allow for a fair range of different tones and
  textures by adding a few unusual features like "atmosphere" and mic placement.
  It won't replace your giant symphonic strings, but for soft and ambient
  strings it gives quick and good results.
specs: |-
  - Kontakt player plugin
  - VST3
  - Audio Units
  - AAX
  - Chamber-sized string ensemble
  - Muted strings
  - Con sordino articulation
  - Atmosphere control
  - Mic placement control
