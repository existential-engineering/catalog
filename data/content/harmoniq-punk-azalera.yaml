details: |-
  The sounds are recorded with some different types of microphones like contact
  microphones through an ampeg amplifier or a stethoscope that feed an electret
  microphone.

  After recording, each sample was post produced and in the end tuned in
  maschine 1.7 and battery 3.

  You'll find some nice unconventional percussion, metal, glass, drill, crackle,
  blip & blop and zap sounds.

  You can also use the samples in your favourite drum machine.
specs: |-
  - 10 drum kits for maschine 1.7 and battery 3
  - Over 450 samples
  - 24bit/44.1khz
  - Contact microphones
  - Ampeg amplifier
  - Stethoscope microphone
  - Electret microphone
  - Unconventional percussion sounds
  - Metal sounds
  - Glass sounds
  - Drill sounds
  - Crackle sounds
  - Blip & blop sounds
  - Zap sounds
