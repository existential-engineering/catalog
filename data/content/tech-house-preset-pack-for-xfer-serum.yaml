details: |-
  3digitsamples expansion preset pack is specifically designed for house and tech house music producers who are looking for modern high-quality and classic sounds for their music projects.

  The serum synthesiser music sample pack is a must-have for any music producer looking to elevate their sound and add depth and versatility to their productions.

  This 102 preset pack along with 21 wavetables includes a range of classic sounds from the genre of house to innovative and modern sounds that are perfect for the genre.

  Each preset also features multiple modulation macros saved inside the preset allowing you to easily create your own variations, and tweak the sounds to make it sound unique.

  Lastly, our presets are 'production ready' with all the essential processing done inside serum using the latest mixing techniques, meaning less time spent editing, freeing you up to concentrate on the arrangement.
