details: |-
  Bells & rivers is a tuned percussion sample-library made from different
  bells in a wide range of sizes and pitches. It includes Kontakt-instruments
  sampled from antique bells and resonant big town hall bells.

  The library is organized into four sections: town hall bells, where the river
  runs, antique bells, and tainted bells.

  Bells & rivers stands out for its comprehensive approach to capturing
  different and unusual bell sounds, from the grandiose resonance of town hall
  carillons to the subtle nuances of small antique sheep bells as well as
  manipulated bell timbres.
