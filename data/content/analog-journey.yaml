details: |-
  Analog Journey for bx_oberhausen features a wide range of presets allowing you
  to enjoy your personal journey into the world of legendary Oberheim sem
  represented and recreated by brainworx team's masterpiece.

  This bank may a handy all-in-one producer starter-pack with 245 presets on the
  board.

  The bx_oberhausen is quite capricious to an octave it performs in or due to
  voices amount you set. According to my system possibilities presets mainly are
  set to 4 voices so some presets may seem too high or too low for you as they
  initially were designed in a different octave, either presets may lack some
  notes from MIDI you play.

  All is simple, just try another octave and change count of voices according
  your hardware possibilities.

  Both below and in audio demos you may learn examples of presets with a track
  "imma rdy, god" created only on this bank exept 3 snare sounds, everything
  left is the bx_oberhausen itself.
specs: |-
  - 245 presets
  - Arp 5
  - Bass 20 (+14 bonus)
  - FX 10 (+3 bonus)
  - Hat 5
  - Kick 10 (+7 bonus)
  - Lead 10 (+5 bonus)
  - Pad 50 (+36 bonus)
  - Piano 5
  - Pluck 50 (+15 bonus)
  - MIDI compatible
  - Octave shifting
  - Voice count adjustment
