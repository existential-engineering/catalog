  workstation and uvi falcon saved as individual instrument racks.

  All uvi px apollo presets mapped to uvi falcon ableton instrument racks for
  load and performance on ableton push. All uvi px apollo presets mapped to uvi
  workstation ableton instrument racks for load and performance on ableton push.

  Browse all px apollo presets from your ableton push, load and perform! Ableton
  push VST mapping allowing ease of navigation to all apollo factory content.

  Easily extend to your own px apollo presets in uvi workstation or uvi falcon
  by saving as additional ableton instrument racks.
