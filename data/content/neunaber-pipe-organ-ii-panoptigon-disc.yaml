details: |-
  We've dug back into the Optigan/Orchestron master tape archive to bring you PIPE ORGAN II. This was an alternate registration (flute & diapason stops) of the Whitney Studios Pipe Organ heard on the Optigan "Majestic Pipe Organ" and Orchestron "Pipe Organ" discs. This particular pipe organ sound is being heard for the first time on this disc, and in a full 60-note scale instead of the more limited 37 note scale of the previous pipe organ sound. Recordings of the Whitney Studios organ are heard every day as the musical backdrop to Disneyland's Haunted Mansion ride. PLEASE NOTE: PIPE ORGAN II can only be played on PANOPTIGON, and is NOT compatible with Optigan or Orchestron. Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility
