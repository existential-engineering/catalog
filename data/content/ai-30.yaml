id: dU-3dtu0tIu3w3xlArztb
name: AI-30
manufacturer: sampletrip
primaryCategory: sampler
categories:
  - synthesizer
description: AI-30 is a Kontakt 5 based sample library inspired by hardware
  rompler synthesizers in the likes of Korg m and 0w series.
details: |-
  Ai-30 has been updated to version 2 with new appearance and features. The gui is redesigned, the effect section is reconstructed and there are a few different multisampled sounds.

  Now up to 4 different "elements" sounds can be layered together to create complex and expressive multisounds. Each of the sound elements now can be fully edited using all features of version 1 plus some new, in a compact user interface.

  The presets of previous versions are now adapted to the new engine and available as user "snapshots" along with new preset sounds.
specs: |-
  - Kontakt 5 based sample library
  - 80 sounds inspired by rompler synthesizers
  - 2 filter types
  - 4 modulation generators (LFO)
  - Chorus effect
  - Flanger effect
  - Phaser effect
  - Reverb effect
  - Delay effect
  - Mono/poly mode
  - Portamento
  - Multi-sampled sounds at 44khz 24-bit
  - Up to 4 different elements sounds can be layered together
  - Compact user interface
  - 1694 wave samples
  - 215 user snapshots
  - Total size 2.02 GB (2.96 GB before .ncw compression)
