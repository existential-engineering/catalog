details: |-
  The alesis andromeda kontakt library opens the doors to a world of inspiring sounds and emotional expression. Whether you're looking for pulsating basses, warm pads or magical synth solos, this library has everything you need to make your music shine.

  Immerse yourself in the variety of sound possibilities, experiment with the effects and filters and create something unique that will touch the hearts of listeners.

  The alesis andromeda kontakt library gives you the freedom to find your individual musical expression and express your sonic personality.

  Alesis andromeda kontakt library unpacking and installation: due to some limits of my provider downloading large files the following procedure is necessary. After downloading the 2 zip-files of the library please start with unpacking the part1 file. A folder part1 is created: 1. First open the folder part1. 2. Now place the other zip-file (part2) into this folder. Please make sure you unpack all zip-files files in place. 3. You can now rename the folder part1 to alesis andromeda library or whatever you prefer. 4. That is all and you can go further on with the manual.

  This library needs a full retail version of kontakt 5.8.1 or higher. It does not run with the free kontakt player.
specs: |-
  - Kontakt 5, kontakt 6, kontakt 7 full retail only
  - Additional hard drive space according to the library's size
  - 100 kontakt programs
  - MIDI controllable knobs
  - Over 9 gb of hq 44khz/24-bit samples
  - Flexible arpeggiator and voice modes
  - Large fx section with many adjustable parameters
  - Ir samples for the convolution reverb of kontakt
  - Universal 2 binary
  - Kontakt 5.8.1 or higher required
