details: >-
  We present the first "element" - aqua, a sample library for kontakt. Aqua has
  wide and liquid sounds, clear and ergonomic user interface, high quality and
  new principles of the instrument control.


  Overview: pads, textures and motions. Big library with expansions. Flexible
  layering of sounds.


  Format: ni kontakt 4 and 5 (full version). Download delivery. 1500 mb (ncw
  compression). Easy and intuitive use.


  Effects: lp and hp filters, stereo widener, reverberation.
specs: |-
  - Ni kontakt 4 and 5 (full version)
  - Lp and hp filters
  - Stereo widener
  - Reverberation
  - Ncw compression
  - 1500 mb
