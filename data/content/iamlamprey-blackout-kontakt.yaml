details: |-
  Blackout is an extremely lightweight loop-based pulse engine for the Kontakt 5
  engine. It is designed to be as easy-to-access as possible, providing 3
  octaves of time-synced synthetic pulses for adding tension and rhythm to any
  track.

  It also includes a built-in filter (automatable and mapped to the mod-wheel),
  keyswitch-based pitch shifting, widener, delay, reverb, trash, crush and phase
  fx.

  All interface controls are automatable and mappable to MIDI controls using
  kontakt macros.

  This instrument is not meant to be overly fancy or boast a massive library of
  multi-velocity sounds, it is designed to provide extremely quick pulse-based
  rhythms within a very small, compact and efficient interface.
specs: |-
  - Loop-based pulse engine
  - 3 octaves of time-synced synthetic pulses
  - Built-in filter (automatable and mapped to mod-wheel)
  - Keyswitch-based pitch shifting
  - Widener
  - Delay
  - Reverb
  - Trash
  - Crush
  - Phase FX
  - 36 tempo-synced pulse loops
  - Fully automatable interface
  - MIDI control mapping via Kontakt macros
  - Speed adjustment controls
  - Kontakt 5.8 or later (full version required)
  - 4gb of RAM (8gb recommended)
  - 30mb hdd space
