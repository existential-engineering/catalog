details: |-
  What if everything but drums was drums? Klevgrand's collaboration with producer and multi-instrumentalist Quinn Oulton has given rise to Acoustic Oddities, an extension to Klevgrand's drum sampler OneShot that reimagines drums.

  Acoustic Oddities is built as a producer's toolkit, offering a wide range of creative possibilities. Having a fun set of tools that immediately present you with great sounding, slightly unusual choices is so valuable to work on your sound selection as a producer. Acoustic Oddities sits perfectly in this space. A dark, reverby 'bass guitar drum kit' may not be your first thought when producing a track, but it might be exactly what you didn't know you wanted.
specs: |-
  - 20 kits in total (5 kits sourced from Electric Bass, 6 kits sourced from Electric Guitar, 5 kits sourced from Sax + Flute, and 4 Guitar Kalimba kits)
  - 95 slots
  - 750+ samples
  - Requires a OneShot license
  - macOS / Windows / iOS
