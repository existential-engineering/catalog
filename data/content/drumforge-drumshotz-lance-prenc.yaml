description: A signature one-shot drum sample collection from metalcore producer Lance Prenc, delivering 76 kick, snare, and tom samples in direct and room variants for modern heavy productions.
details: |-
  Lance Prenc has established himself as a defining force in modern metalcore production, crafting the punishing yet remarkably clear drum sounds behind releases from Alpha Wolf, Polaris, Thornhill, and Dealer. His production approach combines aggressive impact with exceptional definition, allowing complex drum patterns to keep their clarity inside dense, down-tuned guitar arrangements.

  The pack captures that production style using the same signal chains and processing techniques Prenc employs on his commercial releases. Each sample was personally engineered and approved by him to represent his standards and production aesthetic.

  One-shot samples are the consistency layer behind modern metal productions, letting an engineer enhance, replace, or build drum sounds regardless of recording conditions or drummer skill level. The samples are designed to deliver results with minimal additional processing, whether layered under existing recordings or used to program entirely new drum parts.
specs: |-
  - Signature one-shot collection from renowned metalcore producer Lance Prenc
  - 76 premium samples total in 44.1 kHz, 24-bit WAV format
  - For use with any triggering program or DAW
  - 20 Kick Samples (10 Direct, 10 Room)
  - 22 Snare Samples (11 Direct, 11 Room)
  - 34 Tom Samples (17 Direct, 17 Room)
