description: "Signature drum sample library from metalcore producer Lance Prenc, capturing his production style used on commercial releases with Alpha Wolf, Polaris, Thornhill, and Dealer. 76 samples in 44.1 kHz, 24-bit WAV format across kick, snare, and toms — each with direct and room mic captures for flexible blending of attack and ambience."
details: |-
  Drumshotz Lance Prenc is a signature drum sample collection built from the exact signal chains metalcore producer Lance Prenc used on real commercial releases. His credits include Alpha Wolf, Polaris, Thornhill, and Dealer — some of the most sonically defined bands in modern metalcore.

  The library contains 76 premium samples recorded at 44.1 kHz, 24-bit WAV format. Each drum element is provided in two capture perspectives — direct and room — giving mix engineers flexibility in blending attack and ambience.

  Sample breakdown: 20 kick samples (10 direct, 10 room), 22 snare samples (11 direct, 11 room), 34 tom samples (17 direct, 17 room).

  Compatible with any DAW and drum triggering software. Purchase includes perpetual license, instant digital download, free lifetime updates, and unlimited customer support.
