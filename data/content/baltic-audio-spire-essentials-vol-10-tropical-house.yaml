details: |-
  'Spire Essentials Vol 10: Tropical House' from baltic audio is a preset pack for producers looking to get the sound of current Tropical House. You'll find 64 top-quality presets for the amazing Spire synthesizer to create hit tracks, including hand-crafted leads, keys, plucks, basses, pads and more.

  Each preset is perfectly programmed by a professional sound designer and every parameter tweaked with passion and detail and will be your essential source for creating new and commercial sounds within your compositions.

  You can also use it for genres like Deep House, Pop and more.

  In addition, you'll find 53 MIDI files taken from the demo.

  Please note: The drums and some FX used in the demo are not included in this product.
specs: |-
  - 64 Presets for Spire
  - 18 Leads
  - 11 Plucks
  - 10 Basses
  - 8 Synths
  - 5 Pads
  - 4 Keys
  - 3 Brasses
  - 3 Hovers
  - 2 FX
  - 53 MIDI files
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
  - Requires Reveal Sound Spire v1.1 or higher
