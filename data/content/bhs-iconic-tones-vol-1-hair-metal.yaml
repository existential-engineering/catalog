details: |-
  Everything you need to recreate the most iconic guitar tones of the hair metal
  era. The pack is designed by michael nielsen and it is created by capturing
  the following amplifiers: randall rg100, rockman xpr100, marshall jmp-1,
  marshall jcm800, marshall silver jubilee, marshall 1959 superlead, a/da mp-1,
  kitty hawk quattro, soldano x99, and mike morin preamp.

  The pack includes 46 patches, inspired by the tone of the most influential
  artists, including: def leppard, bon jovi, ozzy osbourne / zakk, ratt, skid
  row, white snake, white lion, winger / reb beach, and europe.

  Bhs iconic tones vol 1 - hair metal by overloud is soundware (samples or
  presets that load into other products) for macos and windows.
