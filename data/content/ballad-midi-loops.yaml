description: Ballad beats are not about showing off; they're about space and
  dynamics. In this pack, we keep things relatively simple and less busy.
details: |-
  Ballad beats are not about showing off; they're about space and dynamics. In
  this pack, we keep things relatively simple and less "busy" - all with a
  lighter touch.

  Short but appropriate fills usually get the job done. In addition, the fills
  are tailored to the specific song sections making it easier to put your tracks
  together.

  Includes standard MIDI files (smf) mapped for general MIDI and over 20
  additional formats. These files work with any software that imports MIDI.

  Highlights: 950 royalty free MIDI drum loops. 17 "song sets": verse/chorus,
  fills, intro fills, outro fills. Time signatures: 3/4, 4/4 and 6/8. Tempo
  range: 58 to 100 bpm.
specs: |-
  - 950 royalty free MIDI drum loops
  - 17 song sets (verse/chorus, fills, intro fills, outro fills)
  - Time signatures: 3/4, 4/4, 6/8
  - Tempo range: 58 to 100 bpm
  - Standard MIDI files (smf) mapped for general MIDI
  - Over 20 additional MIDI formats
  - Beat buddy pbf file included
  - 5 full-length bonus tracks
