description: A collection of cinematic transitions, massive impacts, synth swells and dramatic risers designed by Krotos for trailer work, with 64 Weaponiser presets included.
details: |-
  Bass drops, chimes, risers, transitions, drones and strings. The Trailers Library by Krotos is a specialised sound library filled with cinematic transitions, massive impacts, synth swells and dramatic risers, a selection of sounds to boost your trailer project with the immediacy, suspense, drama or emotion it needs.

  Professionally recorded and designed by Krotos, this high-quality sound effects library features a selection of 328 royalty-free assets that range from bright whooshes and resonating bass drops to intense strings and epic drones, offering a full suite of assets to transform your trailer, promo, composition or other sound design project.

  Sound categories included in this library: Cinematic, Synths, Strings and Metallic. Content spans bass drops, cinematic "BWAHs" in short, medium and long forms, bowing, scraping and scratching of acoustic instruments, chime hits, cinematic risers and transitions, metallic drones, metal hits and impacts, plucked metal, resonating sub tones, synth swells and whooshes, plus horror, thriller, suspense, quintet and orchestral strings.

  The purchase contains two downloads: a zip file with all source sound effect asset files plus a metadata PDF, and an installer for the integrated Weaponiser library including assets and presets.
specs: |-
  - 328 sound files
  - 1.02 GB size, 603 MB for the Weaponiser integrated version
  - 96 kHz and 192 kHz high-quality WAV files
  - 100% royalty-free commercial license
  - Embedded metadata
  - 64 Weaponiser presets
