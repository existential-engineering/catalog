details: |-
  Say Cheese

  Experience the unique charm and musical potential of the Smiley Drum - a truly extraordinary custom tonal percussion instrument crafted by a talented father and daughter duo in Mexico. It had a limited production run, but luckily, we managed to secure one for ourselves, and now it can be yours too! The core sound it produces is simple, crisp, and bright, with subtle overtones that beautifully complement its unique tonality. We meticulously recorded single notes on the tuned tongues, capturing percussive slaps on the sides and edges, and even included various roll and crescendo effects to add depth and versatility. However, it also holds the potential to be transformed into something entirely new and unique in Soundpaint. The creative power lies in your hands! But here's the best part - the Smiley Drum is yours for free. We want to share the joy and inspiration this instrument brings, allowing you to explore new sonic horizons and infuse your compositions with its distinct character. Unleash your creativity, and embark on a musical journey like no other with the Smiley Drum at your side.
