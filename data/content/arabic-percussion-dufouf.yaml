details: >-
  The arabic percussion dufouf is part of the arabic percussion collection,
  produced by bassam ayoub. This library features four distinct dafs and a
  katem, offering a rich palette of deep, resonant tones and dynamic rhythmic
  possibilities.


  Daf: a traditional frame drum widely used in arabic music, the daf delivers
  warm bass notes and sharp slaps. The library includes four unique variations
  two crafted with natural skins for a traditional tone and two with synthetic
  materials for modern versatility.


  Katem: known for its deep, earthy resonance and sharp percussive taps, the
  katem adds texture and complexity to rhythmic patterns, making it an excellent
  complement to the dafs.


  Arabic percussion dufouf by best service is a virtual instrument audio plugin
  and a software application and soundware (samples or presets that load into
  other products) for macos and windows. It includes, and is therefore "powered
  by", engine player, which functions as an audio units plugin, a VST 3 plugin,
  an AAX plugin and a standalone application.
