details: |-
  MIDIculous Signature Keys is a premium keyboard sound expansion for MIDIculous, designed to replace the thin, basic sound of standard General MIDI instruments with rich, expressive, production-ready keyboard sounds built directly into the app. Standard General MIDI sounds can feel flat, dated, and uninspiring — especially when teaching, practicing, performing, or playing MIDI files inside MIDIculous. Signature Keys gives you a curated collection of high-quality VIP keyboard sounds that load instantly inside MIDIculous with no third-party plugins, no extra setup, and no complicated routing. These sounds are fully integrated into MIDIculous and can be used directly from the app, including through MIDI IN and across your available MIDI channels. Whether you are playing live, teaching lessons, loading MIDI files, or creating a more inspiring practice environment, Signature Keys gives MIDIculous a more professional and musical sound palette. Included Signature Keyboard Sounds

  Signature Keys is perfect for musicians, teachers, students, producers, worship keyboardists, and MIDIculous users who want better built-in sounds without needing a separate plugin host or external instrument setup. Upgrade the sound of MIDIculous with premium pianos, electric pianos, FM keys, and expressive keyboard tones — all built directly into the MIDIculous experience.
specs: |-
  - Grand Piano — sampled from our Clarity Grand collection for a clean, polished acoustic piano tone.
  - Upright Piano — a warm and character-rich upright piano sound with natural musical texture.
  - Classic Suitcase Electric Piano — inspired by the expressive tone of our Neo-Soul Keys line.
  - MKS EP-20 Chorus — a lush, chorus-style electric piano sound with vintage character.
  - Dyno / Expressive Tine EP — a bright, dynamic tine electric piano designed for expressive playing.
  - Classic Stacked TX816 Sound — the iconic layered FM-style electric piano tone known for its wide, polished sound.
  - Classic Signature FM Sound — a smooth and musical FM keyboard tone perfect for gospel, R&B, worship, pop, and contemporary playing.
