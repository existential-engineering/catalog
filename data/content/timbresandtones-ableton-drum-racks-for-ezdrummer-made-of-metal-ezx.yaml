details: |-
  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all made of metal kit factory presets from ableton
  push controller device browser. All instrument articulations ready to go in
  one layout using ableton push 64 pad layout mode.

  Color coded pad design for visual performance and finger drumming. All our
  racks use consistent drum rack coloring so you can visually and immediately
  spot your snares from your crashes. Individually labelled drum rack pads for
  clear visualisation, post performance editing and automation to all drum rack
  / instrument articulations in ableton.

  Ableton macros mapped to toontrack ezdrummer macros with preset values for
  ease of use in push and simple to use automation programming. Singleout
  presets featuring 6 ableton drum racks for all factory presets single audio
  output to single ableton track. Multiout presets featuring 6 ableton drum
  racks for all presets in multiple audio channel output from the plug in to
  multiple ableton audio tracks using the multi output ableton template also
  provided designed for the kit presets.

  Use the template racks and extend to your own toontrack ezdrummer made of
  metal ezx presets, swapping out individual sounds or articulations. You are
  100% ready to go with the factory presets but there is no limitation to
  creating your own presets from these templates.
specs: |-
  - 12 Ableton drum racks
  - 6 Ableton live templates
  - Color coded pad design
  - Ableton push 64 pad layout mode
  - Individually labelled drum rack pads
  - Ableton macros mapped to toontrack ezdrummer macros
  - Singleout presets with 6 Ableton drum racks
  - Multiout presets with 6 Ableton drum racks
  - Multi channel output routing
  - Track level audio routing
  - Ableton live 9.5 or above
  - Toontrack ezdrummer2 required
  - Made of metal ezx required
