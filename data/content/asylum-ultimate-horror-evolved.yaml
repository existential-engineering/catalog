description: Welcome to your worst nightmare. Asylum Ultimate Horror Evolved for
  Kontakt full 6.4.2.
details: |-
  With our latest update we have completely redesigned this instrument
  containing everything within just one nki. The new custom built menu allows
  you to switch seamlessly between our entire collection of sounds and
  instruments. All new content added over 7 categories, sound design, sound
  effects, keys, drones, pads, risers + rhythm (including the latest addition of
  percussion).

  Sound design + effects includes: ambient one shots, atmos hits, low hits +
  noises, glitch hits, traditional hits, horror scrapes, metal scrapes, violin
  scrapes, glass resonance, metal resonance, haunted whooshes, reverses, chains,
  creaking doors, demonic entities + screams, electro static ambience, monster
  noises and posessed clocks.

  Key instruments include: piano box, puzzle box, haunting glass, spirited
  marimba, ghostly mettalaphone, incantation of the dead, doom, morgue chimes,
  clinical bell, harpsi-scared, half moon, cresent moon and full moon.

  Take full control of the built in effects. Multi room reverbs, DAW syncing
  delays, multi functional filters, adjustable lofi, scream distortion, stereo
  spread, pan and adsr.
specs: |-
  - Kontakt 6.4.2 full version required
  - Single nki file
  - 7 sound categories
  - 13 key instruments
  - 48 key drones
  - 8 key pads
  - 4 + 8 bar pitch adjustable risers
  - 56 pitch adjustable / time syncing loops
  - 63 percussive hits
  - Multi room reverbs
  - DAW syncing delays
  - Multi functional filters
  - Adjustable lofi
  - Scream distortion
  - Stereo spread
  - Pan
  - ADSR
  - Custom built menu
