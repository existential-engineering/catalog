details: |-
  2konkret live pack is the second instalment of a series of otherworldly
  textures, transitions, impulses and ambiences that have their origin in our
  daily surroundings. As a starting point for further explorations 2konkret
  delivers 104 instrument racks that are specifically designed around a variety
  of found sounds.

  The library is organized into 14 categories: alarm / animal / body / diginoise
  / garden / heater / impacts / tuned keys / machines / passes / spikes / synked
  / textures / weird.

  2konkret universal wav library contains 119 sounds recorded in the field and
  is organized into 41 categories. Each sound comes with dedicated loop points
  and loads immediately into any DAW or sample editing app.
specs: |-
