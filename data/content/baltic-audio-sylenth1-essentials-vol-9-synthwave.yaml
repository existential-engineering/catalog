details: |-
  'Sylenth1 Essentials Vol 9 - Synthwave' is a royalty-free preset and MIDI pack for LennarDigital Sylenth1, designed for Synthwave Pop, Retro Pop, Dance, House and melodic electronic music.

  The pack includes 64 Sylenth1 presets and 41 MIDI files taken from the demo. You get ready-to-use leads, basses, plucks, chords, pads, arps, keys, synths, brasses and FX for building nostalgic synth hooks, warm chord progressions, retro-inspired basslines, melodic pop ideas and full Synthwave arrangements.

  Requirements:
  LennarDigital Sylenth1 v3.06 or higher is required.

  Please note:
  Drums and some FX used in the demo are not included.
specs: |-
  - 64 Presets for Sylenth1
  - 15 Leads (Presets)
  - 12 Basses (Presets)
  - 8 Plucks (Presets)
  - 7 Chords (Presets)
  - 6 Pads (Presets)
  - 4 Arps (Presets)
  - 4 Keys (Presets)
  - 4 Synths (Presets)
  - 2 Brasses (Presets)
  - 2 FX (Presets)
  - 41 MIDI files
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
