  - Thousands of unique source sounds in wav format
  - Rhythm loops in sliced format
  - Rhythm loops in timestretch format
  - Kontakt/intakt instrument patches
  - Ni beat machine feature
  - Ni time machine feature
  - Sound-shaping capabilities per slice
