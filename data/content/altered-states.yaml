details: |-
  Altered States provides over 4gb of world-class uniquely creative rhythm
  loops, instruments & samples produced by multi award winning sound designers
  ian boddy, cuckooland, and others. Conceived as a soundtrack composer's dream
  library, it's the product of thousands of hours of extremely organic, unique,
  ultra-creative, and virtuoso sound design.

  This goldmine of creativity is absolutely massive (over 4 gb in total, with
  around 3500 .nki instrument patches and thousands of unique source sounds in
  wav format). The diversity and flexibility of this remarkable resource simply
  has to be experienced to be believed.

  In the rhythm department of this enormous library, there are thousands of
  loops and all are presented either in sliced format or timestretch format (via
  the kontakt/intakt instrument patches which use either the ni beat machine
  feature or the ni time machine feature), so they will automatically sync to
  your songs, and you can even use kontakt or intakt to apply sound-shaping to
  each slice if you wish.

  The re-programming, conversion, and organisation of this vast product was
  expertly carried out by ian boddy, one of the uk's leading synthesists, and
  was designed to be as user friendly and logically creative as possible.

  Altered states features a vast and unique palette of sounds from out of this
  world, that will inspire you for years to come.
specs: |-
  - Over 4gb of samples
