details: |-
  Bang - deep house drum samples comes from a very special place in ModeAudio's
  percussive production arsenal. Precision-designed to resonate your body in
  lock-step with the included cavernous kicks, the raw power of bottomless sub
  bass will swirl the air all around you.

  This collection of 314 full-phat drum samples has been crafted for one purpose
  only - to slam the awe-inspiring rush of the sound system straight into your
  music. Packed to the brim with explosive percussive energy, this release
  shudders with the electric intensity of cutting-edge drum sound design and
  processing.

  Find your way from beneath the sheer weight of the included drum hits and
  you'll find 72 earth-shattering kick samples, 50 blisteringly punchy snares,
  75 crisp and sharp hi hats (open and closed) and 40 super-snappy claps to
  place on the very edge of your deep house beats. The rhythmic euphoria doesn't
  stop there however, with 77 slinky shakers, handfuls of electrifying sfx,
  sizzling crash cymbals, punchy snare rims and powerful toms rounding out the
  collection.

  As if all this wasn't enough musical energy to contain in one release already,
  we've included 12 drum kit sampler patches for your favourite DAW. Each of the
  drum presets feature sets of 16 masterfully matched samples that will set your
  track on fire straight after download!

  5 custom channel strip settings for use in ableton live, reason and logic
  round out the entire sample collection, offering up instant drum processing
  options to add new depth to your percussion rhythms.
