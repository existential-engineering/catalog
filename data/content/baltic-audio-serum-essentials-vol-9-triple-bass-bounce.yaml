details: |-
  64 Serum Presets, 42 MIDI Files for TRIPLE BASS, BOUNCE and DANCE.

  'Serum Essentials Vol 9 - Triple Bass & Bounce' is a royalty-free preset and MIDI pack for Xfer Serum, designed for modern Triple Bass, Bounce, Hypertechno, Dance, EDM, Bigroom and Slap House productions.

  The pack includes 64 Serum presets and 42 MIDI files taken from the demo. You get ready-to-use leads, basses, plucks, keys, synths, sequences and pads for building energetic drops, bouncing basslines, catchy hooks, club-ready melodies and full Dance/EDM arrangements.

  Please note: Drums and some FX used in the demo are not included.
specs: |-
  - 64 Presets for Serum
  - 18 Leads (Presets)
  - 16 Basses (Presets)
  - 14 Plucks (Presets)
  - 5 Keys (Presets)
  - 5 Synths (Presets)
  - 4 Sequences (Presets)
  - 2 Pads (Presets)
  - 42 MIDI files
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
  - Requires Xfer Serum v1.3.5.7 or higher
