description: A multi-shot signature drum sample collection from producers Carl Bown & Jim Pinder — a cutting-edge production duo in rock and metal music who have collaborated with While She Sleeps, Bullet For My Valentine, Sleep Token, and Machine Head. Includes 26 total drums/instruments with 4 samples each, in 44.1 kHz, 24-bit stereo WAV and TCI formats.
details: |-
  Producers and mixers Carl Bown and Jim Pinder are a production duo in rock and metal music who have worked with artists such as While She Sleeps, Bullet For My Valentine, Sleep Token, and Machine Head. This collection puts their mix-ready drum samples directly into a production.

  Drumshotz+ differs from the one-shot Drumshotz packs in that every sampled instrument comes with four hits rather than one. That extra material reinforces drums with more flexibility and realism, keeping a human feel while still delivering the punch and consistency needed to cut through a mix.

  Each hit is supplied in four styles, Close, Room, Blend, and Turbo, so the character can be chosen per instrument. The samples are delivered in both 44.1 kHz 24-bit WAV and TCI formats, for use with a triggering program or in any DAW.
specs: |-
  - Multi Shot signature sample collection from producers Carl Bown & Jim Pinder.
  - 26 total drums / instruments (4 samples for each) in 44.1 kHz, 24 bit .wav and TCI formats
  - 6 kick drum samples
  - 10 snare drum samples
  - 1 three tom set
  - 2 four-tom sets
  - 7 bonus samples
  - For use with any triggering program or DAW
  - 4 styles for each hit: Close, Room, Blend & Turbo
