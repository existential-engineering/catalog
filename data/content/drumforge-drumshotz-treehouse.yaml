details: |-
  Drumshotz+ Treehouse is a multi-shot signature drum sample collection created by producers Carl Bown & Jim Pinder, known for their work with While She Sleeps, Bullet For My Valentine, Sleep Token, and Machine Head.

  The library contains 26 total drums and instruments, each with 4 hit styles: Close, Room, Blend, and Turbo. All samples are delivered in 44.1 kHz, 24-bit stereo WAV and TCI formats, compatible with DAWs and triggering programs.

  Sample breakdown: 6 kick drum samples, 10 snare drum samples, 1 three-tom set, 2 four-tom sets, and 7 bonus samples.

  Purchase includes an instant digital download, perpetual license, free lifetime updates, and unlimited customer support.
