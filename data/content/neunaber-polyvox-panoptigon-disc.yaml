description: A Panoptigon disc featuring the Vox Humana preset from a classic
  1970s polyphonic synthesizer.
details: |-
  POLYVOX is the famous Vox Humana preset from a classic 1970s polyphonic synth. We simply give it a different name to avoid confusion with the vintage Optigan disc of the same title. Try it with the Panoptigon's hall reverb turned up, and the main volume knob turned all the way down, to simulate a slow attack rate. POLYVOX can only be played on PANOPTIGON, and is NOT compatible with Optigan or Orchestron . Recorded and mastered by Alex Ball

  Edited and mastered for Panoptigon by Pea Hicks

  Disc design and mastering by Robert Becker

  Important Note:

