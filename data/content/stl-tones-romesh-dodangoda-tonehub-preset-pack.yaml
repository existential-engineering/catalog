details: |-
  Romesh Dodangoda is a Grammy-nominated record producer and mixer from Wales, UK, who has worked on successful releases for Motörhead, Bring Me The Horizon, Bullet For My Valentine, Funeral For A Friend, Kids In Glass Houses, Twin Atlantic and Lower Than Atlantis. He recorded Bring Me The Horizon's amo , including the singles "Mantra" and "Wonderful Life".

  Using some of Romesh's go-to guitar amp, cab and pedal setups along with his mix processing techniques, this signature collection showcases virtually all of his guitar recording setups. It expands on his previous Kemper pack release with 24 brand new additions.

  Romesh's pack contains 64 captures.
