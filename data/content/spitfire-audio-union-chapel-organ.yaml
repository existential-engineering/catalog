description: "A legendary organ built by the master Henry Willis in 1877, in a
  famous London venue: the beautiful Union Chapel."
details: |-
  A legendary organ built by the master Henry Willis in 1877, in a famous London venue: the beautiful Union Chapel. Built specifically to match the size and acoustics of the building, this instrument is one of the finest examples of 19th Century craftsmanship in the world, and gives you a huge range of tones at your fingertips, from angelic soft beauty to roaring thunder.
specs: |-
  - Henry Willis organ of 1877 with three manuals (Swell, Great, Choir) and full pedalboard
  - 50+ presets
  - Mostly individual stops plus a small number of stop curations
  - 10 eDNA presets plus a Dev Kit for user-built synths, basses, atmospheres and pulses
  - Mic positions: Close, Stereo, Ambient, Outrigger
  - Approximately 3099 samples
  - 11.9 GB uncompressed WAV
  - 7.7 GB download size
  - 15.40 GB disk space required during install
  - Requires Kontakt Full 5.6.8 or higher (Kontakt Player is not sufficient)
  - macOS 11 to 26 (Kontakt 8.8 requires macOS 14 minimum), Intel and Apple Silicon
  - Windows 10 or 11 (64-bit), 8 GB RAM minimum (16 GB recommended)
  - 32-bit systems are not supported
  - Spitfire Audio App required
