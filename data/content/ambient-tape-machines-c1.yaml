details: |-
  Ambient Tape Machines: C1 was created by first capturing 3 unique raw sets of samples, recording them onto cassette tape, and then playing them back at full and half speed on a vintage library of congress c1 cassette player. Analog tape helps give music a certain warmth that is hard to emulate in the digital world, and playing back sounds at half speed on tape is a truly incredible experience.

  The library of congress c1 cassette player is a vintage piece of gear originally intended for the vision impaired to listen to audio books from the library of congress. Its unique variable speed playback controls make it a very powerful ambient sound creation tool. The unit used in this instrument seems to introduce a slight slow-down, some noise, and some wobbling at half speed - giving these samples a truly unique sonic fingerprint.

  There are 3 unique raw sample sets in ambient tape machines: c1. These are broken down by digital, analog, and acoustic. The digital sound was produced using a modern digital synthesizer performing virtual analog synthesis. The analog sound was captured from a 3 oscillator analog mono-synth set on a huge / ambient patch. The acoustic sound was captured from an electric guitar playing palm muted notes through a clean patch on an axe-fx ii xl+ with some very lush shimmer reverb applied.

  Through the gui you will be able to change the play back speed between full and half, tune them, set the volume, and pan each of the sounds individually. Each sound is incredibly detailed on its own, but the real magic happens when you blend them together in creative ways.

  To reduce the noise the samples were de-noised using industry standard tools, but to maintain the integrity of the raw sound we purposefully left some noise in. The samples were tuned in kontakt to counter the slight slow-down effect of the tape machine.
specs: |-
  - 3 sound sources with volume, pan, tuning, and tape speed controls
  - Two ADSR's for VCA and VCF (with VCF env depth)
  - Switchable LFO synced to host tempo (with mod depth)
  - Vibrato depth and rate control
  - 4-pole LPF and HPF
  - Delay, reverb, and saturation controls
  - Custom dual arpeggiators for LPF cutoff and resonance
  - Intuitive gui with plenty of control
  - Open script for ksp scripters
  - 184 samples
  - Over 70 snapshot presets
  - Total sample size - 805mb
  - Recorded at 24-bit and 48khz
  - Full version of Kontakt 5.8.1 or higher required
  - Kontakt instrument
