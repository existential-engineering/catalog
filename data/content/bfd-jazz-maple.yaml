details: |-
  BFD Jazz Maple is an expansion for bfd3, bfd eco and bfd2 which combines an
  immaculately recorded Yamaha maple custom drumkit with a set of artist presets
  and bonus jazz grooves from platinum samples.

  Centred around a kit with 2 kicks and 3 toms full of classic maple warmth and
  sustain, bfd jazz maple also includes a bonus reduced-detail snare (taken from
  bfd signature snares vol.1) and sabian cymbals (from bfd jazz & funk
  collection) which are recorded in similar studio conditions.

  Although the included kit's tone is particularly suited to jazz, fusion and
  funk, it's great for any other musical styles that need expressive and
  great-sounding drums.

  Bfd jazz maple comes complete with a set of 5 groove palettes from platinum
  samples' real jazz MIDI collection.

  Presets from marcas lancaster and joe gore.
specs: |-
  - Expansion for bfd3, bfd eco and bfd2
  - 2 kicks and 3 toms
  - Yamaha maple custom drumkit
  - Bonus reduced-detail snare
  - Sabian cymbals
  - 5 groove palettes
  - Artist presets
  - Windows 7 or above
  - Os x 10.8 or above
  - Bfd3 v. 3.2.1.2 or above
  - Internet connection for download and authorization
  - 23 GB disk space
  - SSD recommended
