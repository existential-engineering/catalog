details: |-
  Bhs La River is the th-u rig library created by big hairy sounds that
  recreates the 80s and 90s tones of skid row, john sykes, saigon kick, and
  others, based on rivera tbr-1 sl amplifiers.

  The library contains 43 rigs, captured using the following gear: rivera tbr-1
  sl all-in-one stereo tube rack series, rack mount guitar head. Captured with a
  classic marshall 1960b cab with greenback and v30 speakers with classic API
  preamps.

  Signature album tones from early 80s to the latest 90s. The library also
  includes 25 patches focused on recreating the famous 80s and 90s album guitar
  tones.
specs: |-
  - 43 rigs
  - 25 presets
  - Rivera tbr-1 sl amplifier capture
  - Marshall 1960b cabinet
  - Greenback and v30 speakers
  - API presets
  - 80s and 90s guitar tones
  - Th-u rig library
