details: |-
  Blue swells for Korg wavestate (hardware and native) imports pre-mapped and
  carefully looped multisamples into your Korg wavestate or wavestate native.
  Start building your own patches with crafted retro-modern sounds from iconic
  synths.

  The sound collection provides access to 83 multisample sounds for wavestate,
  with a total of 760 individual samples. Blue swells multisamples are
  accessible in the single multisample mode or wave sequence mode as a user
  bank.

  Synths featured: ppg wave 2. Ensoniq fizmo. Ensoniq mirage with soundprocess.
  The ppg wave 2 is the legendary 1980's digital/analog hybrid machine that
  inspired generations of synths to come. The wave 2 featured digital
  oscillators capable of producing up to 8000 unique waveforms modified by
  analog filter and amplifier circuits.

  The fizmo is a 48-voice synthesizer which uses 2nd-generation transwave
  technology to create very organic sounds unlike any other synth available.
  Ensoniq mirage with soundprocess has additive synthesis capability plus up to
  4 independent oscillators which can be stacked together.

  Blue swells for korg wavestate is delivered in 2 sound bank formats with
  installation instructions: korg wavestate (.korgbank) and korg wavestate
  native (.korgcompilebank). Included: 760 individual stereo wav files for any
  sampler or music software at 16-bit 44.1 khz with embedded loops and root
  keys. Size: 1.18 gb installed.
specs: |-
  - 83 pre-mapped and looped Korg multisamples
  - 760 individual samples
  - Korg wavestate hardware and native user bank formats
  - Wav files for any sampler or music software
  - Korg modwave compatible
  - Sampled through all synths' analog/digital filters and a/d-d/a converters
  - 16-bit 44.1 kHz uncompressed PCM wav samples
  - Single multisample mode
  - Wave sequence mode
  - User bank
  - Korg wavestate (.korgbank) format
  - Korg wavestate native (.korgcompilebank) format
  - 760 individual stereo wav files
  - Embedded loops and root keys
  - Version 1.0.3
