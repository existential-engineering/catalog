description: Beyond Dreams Bundle contains the beyond dreams soundset for Zebra
  2 and the beyond dreams dz edition. Beyond dreams contains 100 patches.
details: |-
  Beyond Dreams Bundle contains the beyond dreams soundset for Zebra 2 and the
  beyond dreams dz edition. Beyond dreams contains 100 patches and the beyond
  dreams dz edition has the same patches with use of the filters from the dark
  Zebra version applied, giving them a more darker and raw feeling. In total the
  bundle contains 200 patches.

  The soundset is aiming for composers and producers working in the film, game
  and library music industry, though of course it can be used in any other
  production. The overall tone of beyond dreams is slightly dark and a lot of
  patches have a gritty distorted feeling. Beside that there are also some fun
  and weird fx patches included. The sequence patches are a bit lighter in tone.

  Categories included are arps, bass, bass loops, fx, leads, pads, ky (key and
  plucked), soundscapes, percussion and the earlier mentioned sequences. All
  patches have been programmed to be used with the modwheel. The pitchweel is
  also a major player in most of the patches with having effects programmed to
  it. The 4 xy pads add some extra dimension and functionality to the patches.
