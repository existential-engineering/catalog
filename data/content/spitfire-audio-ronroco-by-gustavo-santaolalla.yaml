details: |-
  Step into the personal sound world of Gustavo Santaolalla. For media composers seeking truly authentic, evocative textures to score drama, tension, and expansive landscapes, or producers wanting unique acoustic character unavailable elsewhere, this library captures the unique voice of the multi award-winning composer's iconic ronroco. Heard prominently in his iconic scores for The Last of Us, Motorcycle Diaries, Babel, and his seminal solo album Ronroco, this isn't merely a collection of sounds; it's the culmination of a deep, personal connection, meticulously translated into playable form.
specs: |-
  - Ten-string ronroco in E-minor tuning
  - Up to seven round robins and four dynamic layers per note
  - Four pages: Perform, Sequencer, Calibrate, FX
  - 4-bank, 32-step sequencer
  - Close and Far microphone positions plus optional room tone
  - 1.22 GB file size
  - Compatible with Kontakt Player 7.2+
  - Includes Kontakt Player (free download)
  - Compatible with NKS
  - Spitfire Audio App required
