details: |-
  The Big Band EZX is an homage to jazz, and in particular, the golden big band
  era, that not only produce some of the most iconic artists in recorded history
  but also immortalized drumming as more than part of the rhythm section it
  brought it to stage center.

  The big band ezx brings you two kits from the swing era of the '30s and '40s,
  both handpicked and tailored to provide an authentic slice of what the big
  band sound was and, indeed, still is. Expect two fundamentally different kits
  covering the entire tonal range from the round, warm and intimate to the
  thunderous, explosive and fiercely energetic just like the genre itself.

  Recorded at capitol studios by legendary producer/engineer al schmitt.
  Includes kit configurations recorded with sticks and brushes as well as with
  snare wires on and off.

  Welcome to the big band ezx, which will enable you to produce the timeless
  swing that has been the epitome of jazz for close to a century and a half.

  Includes a selection of big band-inspired MIDI drum grooves and mix-ready
  presets tailored for a big band-inspired sound.
specs: |-
  - Two complete kits from the 1930s-1940s era
  - Recorded at capitol studios
  - Kit configurations recorded with sticks and brushes
  - Snare wires on and off configurations
  - Mix-ready presets
  - Big band-inspired MIDI drum grooves
