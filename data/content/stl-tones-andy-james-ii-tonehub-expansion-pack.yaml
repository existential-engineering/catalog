details: |-
  Andy James is a British guitarist and lead guitarist of Five Finger Death Punch, joining the band in 2020 and appearing on their ninth album AfterLife . He previously played in Sacred Mother Tongue and Fields of the Nephilim, has released five solo albums, and is one of the most recognised names in guitar education through Lick Library and his own Andy James Academy.

  For this second expansion pack, Andy traced a whole new arsenal of guitar tones, covering everything from heavy rhythms to soaring leads, engineered and recorded at The Hideout Recording Studio in Nevada. Also included are some of his go-to Five Finger Death Punch album and live guitar tones from his private collection.

  Andy's pack contains 41 captures.
