description: Jogging House makes a welcome return to our Sound Pack library with Haunted Hearts. 128 lush pads, blissful leads, warm, soothing basses, and some earthy percussion for good measure.
details: |-
  Jogging House makes a welcome return to our Sound Pack library (you may recall his quite exquisite Analog Rytm Pack called Run the Track) with Haunted Hearts. 128 lush pads, blissful leads, warm, soothing basses, and some earthy percussion for good measure, letting you float wistfully through the haziest memories of summer nights spent at the oceanside.

  These sounds prove how organic, rich and warm FM synthesis can be. The pack combines classic FM attributes with unique sound design approaches and ever-evolving atmospheres.

  This Sound Pack is a digital item. Detailed instructions on how to download the Sound Pack will be provided via email upon purchase.
specs: |-
