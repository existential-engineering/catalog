details: |-
  2600 skies is a cherry audio ca2600 expansion with 54 classic monophonic
  synthesized sounds. Their character derives from classic "semi sound / semi
  effect" synth sound design from the past.

  The character of this great emulation synth is in all of the presets here.
  From dark evolving atmospheric to synced madness and from resonant sonic
  journeys to classic distorted leads.

  The soundbank fits for a variety of genres while creating cinematic
  atmospheric dimension is maybe the first thing that comes in my mind for the
  patches.

  Presets were designed with ca2600 1.4.0 (build 104) and run best with this or
  newer edition.
