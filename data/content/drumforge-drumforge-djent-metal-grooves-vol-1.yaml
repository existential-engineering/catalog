details: |-
  Djent Grooves: Vol. 1 delivers 402 professionally performed drum grooves and fills captured by drummer Brody Taylor Smith. The collection spans the full spectrum of djent metal feel, from large, bouncy groove patterns to complex odd-time signatures, giving producers a comprehensive palette of rhythmic material for metal production.

  All content is delivered as MIDI files, making the pack compatible with any digital audio workstation. Producers can freely adjust velocity, tempo, and dynamics to fit their mix, and the organized-by-song-section layout accelerates the composition process by grouping intro, verse, chorus, and breakdown grooves together.

  The pack integrates natively with the Drumforge Bergstrand Sampler, allowing direct drag-and-drop use alongside that instrument's drum sounds. It is equally usable with third-party drum samplers and virtual instruments that accept MIDI input.
