details: |-
  Djent Grooves: Vol. 1 is a MIDI groove pack containing 402 drum grooves and fills prepared by drummer Brody Taylor Smith. The material covers a wide range of djent playing, from big bounce grooves to the odd time signatures and syncopated feels the genre is known for.

  The performances are supplied as MIDI files for use in any DAW or with any drum plugin, and they integrate directly with the Drumforge Bergstrand sampler.

  Grooves are organized by individual song sections so full arrangements can be built quickly, either as building blocks for new songs or as a way to refresh existing demos. Dynamics and tempo can be adjusted freely.

  The pack also serves as a practice and production tool for working with complex metal rhythms.
specs: |-
  - 402 total drum grooves and fills performed by Brody Taylor Smith
  - Covers big bounce grooves through to odd time feels
  - MIDI files for use in any DAW or drum plugin
  - Integrates directly with the Drumforge Bergstrand sampler
  - Grooves organized by individual song sections
  - Adjustable dynamics and tempo
