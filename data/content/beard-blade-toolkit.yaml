details: |-
  Beard Blade Toolkit is a collection of 44 sample instruments crafted while
  composing the beard blade video game soundtrack. These 16-bit orchestral
  patches have been bit-crushed, down-sampled, and treated to sound like
  authentic super nintendo and game boy advance instruments out-of-the-box.

  Features in v2.0 include 44 orchestral patches crafted in the 16-bit video
  game style and 7 multis featuring useful large combos of patches.

  The toolkit includes a bitcrusher knob to down-sample each instrument to your
  liking, reverb knob to give your instrument a lush sound, and chorus knob to
  fatten your instrument from mono to stereo.

  Delay controls include delay amount knob to control how much delay is applied
  and delay 32nds to control how many 32nd notes worth of tempo-synced delay to
  add to your instrument.

  Additional features include vibrato control with the mod wheel and legato
  scripting on solo patches.
specs: |-
  - 44 orchestral patches
  - 16-bit video game style
  - 7 multis
  - Bitcrusher knob
  - Reverb knob
  - Chorus knob
  - Delay amount knob
  - Delay 32nds tempo-synced
  - Vibrato control with mod wheel
  - Legato scripting on solo patches
  - 2.18 GB download file size
  - Requires full-version Kontakt 5.8.1 or higher
  - Bit-crushed and down-sampled patches
  - Super nintendo and game boy advance instrument emulation
