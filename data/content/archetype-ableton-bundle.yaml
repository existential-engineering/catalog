details: >-
  Archetype ableton bundle marks a paradigm shift for ableton and max for live
  users. 8 instruments, endless sonic possibilities. Custom-designed user
  interfaces. Experience ableton like never before. New levels of intuitive
  control, sound morphing & tweakability.


  Archetype bundle is a confluence of superior sound and style. Highly
  sought-after vintage & modern electronic instruments, re-imagined for live.
  Stunning user-interfaces that focus on ease of use and maximum sound
  sculpting. A hybrid design approach that combines max and ableton devices for
  the best of both worlds.


  Archetype bundle includes creative controls and smart features only possible
  with max for live. Interactively designed dials and immersive interfaces.
  Internal preset system for ultra-fast switching and powerful preset morphing.
  Tight integration with push and other ableton controllers.


  Archetype bundle includes 2 free max for live step sequencers for push, apc40
  and launchpad. Use synth and drum sequencer to take hands-on control of your
  sound.
