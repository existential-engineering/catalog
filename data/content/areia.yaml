details: >-
  Areia is a cinematic ensemble strings software instrument made for kontakt
  player, that combines the most sought after features into one single product:
  detailed realism with expressive emotion and range, and a lush hollywood sound
  - all the way from delicate and soft to aggressive and epic.


  Areia is a powerful and intuitive instrument that provides you with a lot more
  than just the essentials for modern string writing and gives you stunning
  control and the true ability to sculpt and shape the sound to your liking.


  Key features: true hollywood sound - all the way from delicate and soft to
  aggressive and epic. 4 mic positions and 2 ready-to-go mixes (classic +
  modern). Individual instrument sections, pre-orchestrated ensembles, and full
  ensembles. Wide range of articulations. True legato for all instruments.
specs: |-
  - Kontakt player
  - Vst3 plugin
  - Audio units plugin
  - AAX plugin
  - Standalone application
  - 4 mic positions
  - 2 ready-to-go mixes (classic + modern)
  - Individual instrument sections
  - Pre-orchestrated ensembles
  - Full ensembles
  - Wide range of articulations
  - True legato
  - Approximately 68 gb installed (ncw format)
  - Kontakt player version 6.2.2 or higher
  - Nks compatible
  - Macos and windows
