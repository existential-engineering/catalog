details: |-
  'Hands Up Classix Vol 1 (baltic audio Edition)' by CESA SAMPLES is a royalty-free Sylenth1 preset pack designed for classic Hands Up, Dance, 2000s EDM and Eurodance-inspired productions.

  This baltic audio Edition includes 48 presets for LennarDigital Sylenth1, covering leads, basses, arpeggios, bells, chords, drum-type presets, FX, pads, plucks and synth sounds for building melodies, hooks, basslines and club arrangements.

  This edition includes fewer presets than the original extended edition and does not contain any samples or MIDI files.

  LennarDigital Sylenth1 v3.06 or higher is required. This edition contains Sylenth1 presets only: it does not include samples, loops or MIDI files. Drum-type presets listed in the pack are included as Sylenth1 presets, not as separate audio drum samples.
specs: |-
  - 48 presets for LennarDigital Sylenth1
  - 20 leads
  - 9 basses
  - 5 synths
  - 4 arpeggios
  - 3 drum-type presets
  - 2 bells
  - 2 chords
  - 1 FX
  - 1 pad
  - 1 pluck
  - Multi-genre
  - PC/Mac compatible
  - 100% royalty-free
