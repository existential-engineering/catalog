details: |-
  Beats working in cuba is the first complete and utterly authentic library of
  latin percussion performances recorded entirely in havana, cuba, featuring the
  country's very finest players, and presented in multitrack format to provide
  the user with complete flexibility in both tempo and the selection of
  instruments.

  The styles covered include the 12 prime afro/hispanic rhythms of the cuban
  music culture, including: cha cha cha, danzon, son montuno, bolero, pilon, son
  traditional, guajira son, guaracha, mambo, songo, timba, conga habanera
  (carnival), and conga moderna.

  There are also additional variations in some of the performances to enable the
  user to select modern or traditional arrangements.

  The performances are provided with each instrument separated out. Beats
  working in cuba is now only available as a download, as soundware in kontakt
  (nki) + wav format.

  The flexibility provided by multitracked instruments and separate microphone
  feeds is invaluable in conveying realism. Having each instrument available for
  independent use allows you to easily create your own rhythms and adapt these
  sounds to any style of music.
