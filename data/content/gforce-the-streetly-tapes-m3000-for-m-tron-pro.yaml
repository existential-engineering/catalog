details: |-
  The Streetly Tapes M300 is an expansion pack for M-Tron Pro developed in collaboration with Streetly Electronics. It captures sounds from the Mellotron M300, produced between 1968 and 1971, featuring a single 52-note keyboard. The M300 was used by artists including The Moody Blues, Barclay James Harvest, Earth and Fire, Gentle Giant, and Marmalade.

  The 17 tape banks were derived from original EMI tape-stock and newly transferred to digital format. Each bank contains 35 notes. The pack also includes over 100 M-Tron Pro patches designed to showcase the M300 sounds across a wide range of musical contexts.
