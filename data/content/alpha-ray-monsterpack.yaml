details: |-
  Alpha ray monsterpack by edmsoundware is soundware (samples or presets that load into other products).

  Alpha ray monsterpack includes: acid - 2 presets solo and arp ones. Arp's - 30 presets on the one hand typical arped and on the other single mid range lighter than acid sounds. Some can be similar to fx. Bass - 12 presets various types typical for different types of genres: offbeat 4/4 trance, mid hi movers trance, more darker house, hard trance strong ones, darker more techno, pad bass etc. Fx - 90 presets this section contains single shots, intro stabs, arp fx. Gate - 15 presets can be used like in lot of ways: lead for trance, fill for other styles, and even fx sound. Lead - 69 large variety of any kind of lead. Pad - 18 large variety of any kind of pad. Organ and synths - 2 presets. Plucks - 16 large variety of any kind of lead.
