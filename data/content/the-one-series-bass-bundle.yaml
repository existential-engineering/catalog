details: |-
  This is the Bass Bundle, a bundle consisting of "the one: filthy reeses" and
  "the one: monster basses". This powerful bass library will take your dark bass
  sounds to the next level.

  This package is made out of 250 reese bass loops at 170 bpm, and 250 dubstep
  bass loops at 140 bpm. These loops have been made with care and feature
  advanced synthesis techniques, so these loops are no sounds would expect to
  instantly find somewhere else.

  All sounds are 100% original and royalty free, and can be used in any type of
  production without any legal issues.

  Bonus files include 19 wavs at 96 khz/24-bit, 4 MIDI files, 2 extra massive
  synthpatches, PDF of what samples were used in the demos for the original
  soundbanks, as well as info of which freeware thirdparty plugins that were
  used, and the demos as mp3s.
specs: |-
  - 500 wav-loops at 96 kHz/24-bit
  - 13 different short monster bass loops with 10 different versions
  - 12 different long monster bass loops with 10 different versions
  - 13 different short reese loops with 10 different versions
  - 12 different long reese loops with 10 different versions
  - 250 reese bass loops at 170 bpm
  - 250 dubstep bass loops at 140 bpm
  - 19 wavs at 96 kHz/24-bit
  - 4 MIDI files
  - 2 extra Massive synthpatches
  - 100% original and royalty free
  - Advanced synthesis techniques
