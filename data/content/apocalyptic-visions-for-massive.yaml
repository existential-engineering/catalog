details: |-
  Like our previous popular 'fear and horror' set, 'apocalyptic visions' brings
  you yet more disturbing pads, insane soundscapes and creepy sound effects. We
  also took the liberty of expanding this collection with semi-real fantasy
  musical instruments, dark dubstep basses and more, to give you an even better
  experience.

  'apocalyptic visions' is aimed at producers of horror and sci-fi soundtracks,
  plus those who produce a wide variety of other genres: dark ambient, dubstep,
  drum &amp; bass, psychill, future garage, idm, industrial, and even death
  metal.

  'apocalyptic visions' contains 60 patches, each with all 8 macros assigned,
  plus entertaining commentary in the "comments" box for each patch. Most of the
  comments are fictional diary entries outlining a post-apocalyptic story to
  immerse you in the experience and can help inspire song ideas.

  Apocalyptic visions for massive is suitable for the following genres: ambient,
  horror, breakcore, chillout, dubstep, drum &amp; bass, electro, experimental,
  glitch hop, idm, industrial, metal, pop, film soundtrack, world/ethnic.
