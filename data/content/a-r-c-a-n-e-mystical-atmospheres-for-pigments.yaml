name: A R C A N E - Mystical Atmospheres for Pigments
manufacturer: hydratek
primaryCategory: preset
website: https://www.hydra-sound.com/product-page/a-r-c-a-n-e-mystical-atmospheres-for-pigments
description: The fascination of the unknown dominates everything, homer.
  Conceptually sequel and complementary to a n g e l - evocative pad design for
  pigments.
details: >-
  Conceptually sequel and complementary to a n g e l - evocative pad design for
  pigments, hydratek proudly presents a r c a n e - mystical atmospheres for
  pigments, an exploration through dark, surrealistic and mystical soundscapes,
  deep evolving drones, immersive and unusual pads, quirky, bizarre melodic
  sequences and more.


  You'll find 100 carefully crafted presets for the latest version of pigments,
  deeply customizable with all 4 macros and the modulation wheel assigned,
  including the special arcane macro, and with the advanced tooltips available
  for each patch inside of the synth to have all the key parameters and useful
  ranges at glance, for instant tweakability and further experimentation.


  Those presets are built over the free included c r y p t I c expansion sample
  pack, containing 100 hand-made soundscapes and drones. There are included also
  100 samples and loops, built with the aforementioned presets for instant
  access and use, and 15 ai artworks in line with the concept of the pack to
  inspire your audiovisual projects.


  Built mainly with cinematic and ambient composers in mind, this soundpack will
  prove itself to be an inspiring companion for other multimedia artists as well
  such as game audio sound designers or creative electronic music producers.
specs: >-
  - 100 carefully crafted presets for pigments

  - All 4 macros assigned

  - Modulation wheel assigned

  - Special arcane macro

  - Advanced tooltips for each patch

  - 100 hand-made soundscapes and drones from c r y p t I c expansion sample
  pack

  - 100 samples and loops

  - 15 ai artworks

  - Macos and windows compatible
