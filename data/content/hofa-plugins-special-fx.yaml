details: |-
  IR-Pack Special FX is a HOFA-Plugins impulse-response pack of exceptional reverb and effect IRs. The page presents it as a set of subtle and extreme impulse responses for the most special moments in a production.

  The pack is not a standalone plugin. To buy and use the IR-Pack you need either the IQ-Series Reverb V2 or the HOFA SYSTEM IR-Verb, which load the impulse responses as convolution reverb presets.

  The product page lists 150 named impulse responses, leaning heavily on science-fiction and machine imagery: entries such as Black Hole MG, Borg, Starfleet, Tribbles, Tholian, Triskelion, Zetar and Nuclear Lift-Off sit alongside industrial and metallic spaces (Metal Tunnel, Mine Shaft, Big Evil Silo Deep, Mid Oiltank Leak, Waste Incineration Hot Flange, Steam Overkill).

  Beyond outright effects, the collection also carries more conventional convolution material: lo-fi and degraded characters (AM Radio, Lofi Church, Lofi Space, Big Hall Destroyed), springs and flanged textures (Huge Spring Cosmic Worm, Tonal spring, Mid Strange Flange Plate, Stereo Flap Long) and a handful of guitar-speaker captures listed by driver size (Speaker 04 Inch #056, Speaker 10 Inch #107, Speaker 15 Inch #072).

  Sound examples are offered on the page through an embedded SoundCloud player behind a cookie-consent placeholder, and a Download & Test link points to the HOFA-Plugins downloads area for trying the products before purchase.
specs: |-
  - 150 special-effect and reverb impulse responses
  - Requires IQ-Series Reverb V2 or HOFA SYSTEM IR-Verb as host
  - Ranges from subtle spaces to extreme, heavily coloured effect responses
  - Includes lo-fi, spring, flange, metallic and industrial characters plus guitar speaker captures
  - Full impulse response list and SoundCloud sound examples published on the product page
