details: |-
  Hard Acid Vol.2 WAV & MIDI Pack is a collection built from the original ABX3 presets and sequences. It combines ready-to-use WAV loops with fully editable MIDI files, so every sequence can be recreated, tweaked, or completely transformed inside a DAW with no programming needed.

  The pack contains 128 WAV acid loops that are tempo-synced and mix-ready, plus 128 MIDI files extracted from the original ABX3 sequences. Both sets cover authentic acid patterns and grooves and are drag and drop compatible with any DAW.

  The workflow is built for speed: drag the WAV loops in for instant results, or load the MIDI files into a favourite synth to recreate the sound or design new variations. That suits fast track building as well as creative experimentation.

  All loops and MIDI sequences derive from the Hard Acid Vol.2 ABX3 presets, giving a consistent acid sound with a digital-style character. The material targets Acid Techno, Hard Techno, Rave, Industrial, Hardcore and Underground Electronic productions.

  It works in any DAW (Ableton Live, FL Studio, Logic Pro, Cubase and others) and the MIDI files are compatible with any VST or AU instrument.
