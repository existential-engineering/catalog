details: |-
  Gary Holt has been heralded as the mastermind behind what many critics and metal fans consider the greatest thrash album of all time, Exodus' 1985 record Bonded by Blood . Playing for both Exodus and Slayer, whom he joined from 2011 to 2019, Gary lives and breathes thrash metal. He has toured extensively worldwide, and his songwriting and guitar playing have established him as thrash metal royalty.

  This expansion pack was created by Gary as a collection of the signature sounds he uses in the studio and live. Every amplifier, cabinet and microphone choice has been carefully tailored to his iconic playing style.

  Gary's pack contains 107 captures.
