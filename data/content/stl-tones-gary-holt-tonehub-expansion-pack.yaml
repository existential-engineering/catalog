description: "Gary Holt has been heralded as the mastermind behind what many
  critics and metal fans consider the greatest thrash album of all time, Exodus’
  1985 album, Bonded by Blood. Playing for both Exodus and Slayer (2011 to
  2019), Gary Holt lives and breathes thrash metal. He has extensively toured
  worldwide and with an unrivaled enthusiasm for the genre, Holt’s songwriting
