description: A signature one-shot drum sample collection from producer/mixer Daniel Braunstein, featuring 107 samples in 44.1 kHz, 24-bit WAV format. The pack delivers mix-ready kicks, snares, toms, and electronic drums designed to add punch and consistency to drum mixes across any DAW or drum triggering program. Braunstein has worked with artists including Spiritbox, Dayseeker, Silent Planet, and Volumes.
details: |-
  Drumshotz Daniel Braunstein is a signature one-shot drum sample collection from producer and mixer Daniel Braunstein, whose credits in heavy music include Spiritbox, Dayseeker, Silent Planet, and Volumes.

  The acoustic half of the pack supplies 19 kick, 23 snare, and 16 tom samples. The electronic half adds 10 electronic kicks, 10 electronic snares, 6 electronic hats, 4 miscellaneous electronic samples, and 19 electronic FX samples, which makes this one of the broader Drumshotz packs for hybrid productions.

  All 107 samples are delivered as 24-bit / 44.1 kHz WAV files for use with any drum triggering program or DAW.
specs: |-
  - 107 one-shot samples total
  - 24-bit / 44.1 kHz WAV format
  - 19 kick samples
  - 23 snare samples
  - 16 tom samples
  - 19 electronic FX samples
  - 10 electronic kicks, 10 electronic snares, and 6 electronic hats
  - 4 miscellaneous electronic samples
  - For use with any triggering program or DAW
