description: "A signature one-shot drum sample collection from producer/mixer Daniel Braunstein, featuring 107 samples in 44.1 kHz, 24-bit WAV format. The pack delivers mix-ready kicks, snares, toms, and electronic drums designed to add punch and consistency to drum mixes across any DAW or drum triggering program. Braunstein has worked with artists including Spiritbox, Dayseeker, Silent Planet, and Volumes."
details: |-
  One-shot samples are powerful weapons for enhancing your drum mixes as they provide you with the extra punch and consistency you need to cut through any mix. Many professional mixers have highly-coveted collections of one shot drum samples which are refined over years of mixing. This is how they achieve their signature drum sound no matter the quality of the source recording.

  Producer/mixer Daniel Braunstein brings you a collection of mix-ready one-shot drum samples that will add power and punch to your songs. Now you can get drum sounds directly from Daniel who is currently one of the hottest producers in heavy music and has worked with artists like Spiritbox, Dayseeker, Silent Planet and Volumes.

  Inject power instantly into your mix with these one-shot samples. Mix and match your favorite sample libraries or raw drum recordings with Drumshotz Daniel Braunstein today and discover a fresh take on your sound.
