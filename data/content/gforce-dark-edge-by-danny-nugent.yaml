description: A preset collection for the GForce Oberheim OB-X software synthesizer, featuring 50 patches spanning huge detuned basses, glitchy pads, polyrhythmic sequences, and essential synth staples. Designed by multi-instrumentalist Danny Nugent to bring experimental edge and dark, atmospheric textures.
details: |-
  Danny Nugent's intention with Dark Edge was to showcase the immense power of the Oberheim sound, enhanced by the additional modulation capabilities provided by GForce such as the XLFO and XADSR. The patches blend experimental edge with practical usability: 'I wanted to add some experimental edge to the patches but still make them usable and playable within a piece,' says Danny.

  Designed for anyone seeking darker, ambient sounds combined with aggressive bass tones, Dark Edge suits atmospheric tracks with a punch. Each patch is meticulously tuned and equipped with responsive macros, making them suited to live performance when paired with a MIDI controller.

  Danny Nugent is a multi-instrumentalist skilled in keys, guitar, bass and drums, who has produced disco tracks under the alias Lucky Cat and whose project Sludge Goat explores electronic metal. He has also contributed to product design at Novation and Focusrite on instruments including the Novation Summit, Launchkey Mk3 and Circuit Rhythm.

  The pack is only available to registered users of GForce Oberheim OB-X, and is exclusively available via the GForce website as a direct download via 'My Instruments' once the purchase has been completed.
specs: |-
