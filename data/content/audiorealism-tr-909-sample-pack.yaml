description: 853 pristine samples captured from an original Roland TR-909 at 96
  kHz. Accents, flams, shuffle, knob positions, and authentic master-bus
  interactions, ready for any DAW.
details: |-
  A sample library of 853 recordings captured from an original Roland TR-909, covering accents, flams, shuffle articulations and knob positions, and delivered as plain WAV files for use in any DAW or sampler.

  Instruments such as the Bass Drum and Snare Drum are multisampled by knob position, captured at 5 positions per knob across 3 knobs for 125 variations each. File names spell the settings out, for example BassDrum909-tune050-attack100-decay100.wav.

  Everything was recorded at 96 kHz / 32-bit float via the machine's individual outputs with no clipping and part volumes at 50%. The pack ships as two downloads, 96 kHz / 24-bit and 44 kHz / 16-bit.

  Interactions that only exist on the master bus are preserved rather than reconstructed: the Snare and Clap combination is printed from the master to keep its phase relationship, and the Open Hat includes closed-hat choke interactions across 7 shuffle modes.

  Groove material is included alongside the one-shots. The Rim Shot carries 7 shuffle modes at 112 BPM for extracting groove into a DAW, the Bass Drum, Snare Drum and Toms carry 8 flam modes, and every instrument is captured at 11 levels of accent.
specs: |-
  - 853 samples from the TR-909, including accents, flams and shuffle articulations
  - Knob-position multisampling: Bass Drum and Snare Drum captured at 5 positions per knob across 3 knobs (5x5x5 = 125 variations)
  - Descriptive file naming, e.g. BassDrum909-tune050-attack100-decay100.wav
  - Recorded at 96 kHz / 32-bit float, delivered as 96 kHz / 24-bit and 44 kHz / 16-bit downloads
  - Captured via individual outs, no clipping, part volumes at 50%
  - Snare and Clap combo printed from the master to preserve phase interaction
  - 11 levels of accent per instrument
  - Rim Shot: 7 shuffle modes at 112 BPM
  - Bass Drum, Snare Drum and Toms: 8 flam modes captured (Low/Mid/Hi Tom included)
  - Open Hat includes closed-hat choke interactions across 7 shuffle modes
  - WAV format, free for personal and commercial use under the included license
