description: The Convology XT True Stereo 4 Library, also known as the Metals
  library, contains true stereo impulse response files from the EMT 140 Plate
  Reverb, EMT 240 Gold Foil Plate Reverb, AKG BX5, BX10, BX15, and BX20 Spring
  Reverbs, and the Master Room MRIII Spring Reverb.
details: |-
  The EMT 140 responses are smooth and dense, the EMT 240 is darker sounding, and the AKG and Master Room spring units are bright and boingy, of interest to guitarists after spring reverb sounds.

  The library contains 53 responses measured at 96 kHz, 24-bit, size 215 MB.

  True Stereo 4 is included in True Stereo Complete.
