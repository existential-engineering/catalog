description: The Origin Effects IR Cab Library is the perfect companion to
  Origin Effects' Amp Recreation pedals, giving a comprehensive selection of
  guitar cabinet impulse responses to pair them with.
details: |-
  Using Origin Effects' own extensive collection of cabs and combos, this IR pack complements the wide variety of tones available from the whole Amp Recreation range: a Fender Brown Deluxe combo to match the DELUXE61, a Magnatone 213 for the MAGMA57, a Fender 5E3 Tweed Deluxe to complement the DELUXE55, and a selection of Marshall, Fender and Vox IRs to span the spectrum of vintage amp sounds from the RevivalDRIVE pedals. All captures were created by Origin Effects at Woodworm Studios, Oxfordshire.
specs: |-
  - Format: .wav
  - Sample Rate: 44.1kHz / 48kHz / 96kHz
  - Bit Depth: 24bit
  - File Length: 200ms
  - Cabs included: 1x12" Magnatone 213, 1x12" Fender Brown Deluxe, 4x12" Marshall 1960B G12H, 4x12" Bogner V30, 2x12" Fender Twin JBL D120F, 2x12" Vox AC30 Silver Alnico, 1x12" Fender 5E3 Tweed Deluxe, 4x12" Marshall 1960A G12M, 2x10" Fender Vibrolux
  - Three multi-mic mixes per cab plus individual mics from each mix
