description: Factory Expansion 1, 2 and 3 are collections of 64 presets each for Tantra, featuring expressive rhythmic patches suitable for processing any kind of sound, electronic or recorded.
details: |-
  Factory Expansion 1, 2 and 3 are collections of 64 presets each for Tantra. The soundsets include expressive rhythmic patches suitable for processing any kind of sounds, no matter whether it is electronic or recorded in the real world.

  The audio demo for these expansions uses no automation or external effects, except for a master soft limiter.

  Factory Expansion 1, 2 and 3 are included in the factory library since version 2.0, free of charge.
specs: |-
  - 64 presets per expansion
  - 3 factory expansions (192 presets total)
  - Included in the Tantra factory library since version 2.0
