details: |-
  Factory Expansion 1, 2, and 3 for Tantra are three preset collections designed for the
  Tantra rhythmic multi-effect plugin by Dmitry Sches Audio Software.

  Each expansion pack contains 64 presets. The presets are expressive rhythmic patches
  suitable for processing any kind of sounds, whether electronic or recorded in the real
  world.

  No automation or external effects were used in the audio demos, except a master soft
  limiter.

  These expansions are free and have been included in the Tantra factory library since
  version 2.0.
