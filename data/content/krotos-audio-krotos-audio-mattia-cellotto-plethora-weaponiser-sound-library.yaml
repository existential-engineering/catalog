description: A Weaponiser sound effects library from sound designer and recordist Mattia Cellotto, covering a variety of themes from designed impacts to UI sounds and creature vocalisations.
details: |-
  Plethora is a Weaponiser sound effects library which covers a variety of themes, from designed impacts to UI sounds, creature vocalisations and many more.

  Plethora features a collection of specially curated sound assets from acclaimed sound designer and recordist Mattia Cellotto's existing libraries, designed especially for use in Weaponiser.

  The 50 presets designed by Mattia Cellotto generate thousands of variations immediately, out of the box, using Weaponiser's workflow.

  The purchase contains one download, an installer for the integrated Weaponiser library including assets and presets. There is no standalone zip file of the sound files on their own. The sound files can be accessed by exploring the Weaponiser library installation folder.

  Sound categories included are Animals, Electrical, Impacts, Rocks, Foley, Metal, Fire, Gore, Pass-by, Water, UI and Whooshes.
