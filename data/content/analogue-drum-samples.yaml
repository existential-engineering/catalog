details: |-
  Analogue Drum Samples is a drumcomputer mfb-522 drum machine sample collection
  for ni Kontakt 5, fxpansion geist, osc poise and all wav compatible sample
  instruments.

  The output of the drumcomputer mfb-522 drum machine was recorded clean, as
  well as passed through select tube preamps, resampled from two different tape
  recorders (tascam 244 portastudio and saba cd 262) and a vintage tape delay
  unit (dynacord echocord mini).

  The included sample content is organized into six individual sample kits:
  clean (unprocessed mfb-522 drum hits), tube (passed through various tube
  preamps), cassette (resampled from the saba cd 262 deck), 4-track (resampled
  from tascam 244 portastudio), echocord (passed through dynacord echocord
  mini), and processed (post-processed digitally).

  Each kit is represented with a corresponding kit preset for kontakt, geist and
  poise, with pre-programmed round robins for each drum hit.
specs: |-
  - 1,135 individual drum samples
  - Up to 10 round robin variations per drum hit
  - Ni Kontakt 5 compatible
  - Fxpansion geist compatible
  - Osc poise compatible
  - Wav compatible sample instruments
  - 24-bit wav format
  - 44.1 kHz
  - Mono
  - 6 sample kits
  - 35 fxpansion geist kits
  - 35 osc poise kits
  - 8 ni Kontakt 5 kits
  - 233 MB size on disk
  - 190 MB download size
