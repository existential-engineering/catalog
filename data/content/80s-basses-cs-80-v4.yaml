details: |-
  80s basses is a 52 presets soundbank which explores the sound quality of the arturia cs-80 v4 in the lower registers and the bass frequencies. It is also available for analog lab v users.

  With heavy 80s flavored sound here we have a nice collection of basses like soft basses, synthwave basses with chorus, resonant basses and some intense modulated ones.

  All presets are monophonic (most of them in legato form).

  All presets designed with cs-80 v 4.3.0.4395 (x64) and run best with this or newer edition. Analog lab v edition: soundbank needs at least version analog lab v 5.9.0.4400 (x64) or newer.
