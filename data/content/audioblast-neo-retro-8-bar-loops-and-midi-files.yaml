details: |-
  Enter the world of Neo-Retro sound design with this exclusive pack built entirely from the acclaimed ABX3 preset collections Retro 80s Synthwave Vol.1 and Eurodance 90s Vol.1. This pack delivers 228 high-quality 8-bar loops in WAV (16-bit / 44.1kHz) and MIDI formats, giving you full flexibility for any modern production setup.

  Inside you'll find warm analog-inspired basslines, nostalgic leads, punchy sequences, and melodic hooks, all capturing the essence of 80s Synthwave, 90s Eurodance, and Retrofuturistic Pop. Each loop is crafted to evoke that authentic vintage vibe while remaining perfectly mix-ready for today's productions.

  Ideal for producers of Synthwave, Retrowave, Synthpop, Italo Disco, 90s Dance, and Modern Retro EDM, this pack lets you explore classic sounds with total creative control thanks to the included MIDI files.
