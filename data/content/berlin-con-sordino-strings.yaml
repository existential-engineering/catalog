description: Muted string ensembles tap into a new emotional depth with the
  gentle, rounded sound of muted—con sordino—strings.
details: |-
  Berlin Con Sordino Strings presents the authentic sound of string sections
  played with mutes. While other libraries artificially simulate string
  dampening, Berlin Con Sordino Strings delivers the meticulously recorded tones
  of physically muted instruments and the distinct style and feel produced from
  con sordino playing.

  Tap into a new emotional depth with the gentle, rounded sound of muted con
  sordino strings. Perfect for contemporary compositions, berlin con sordino
  strings combines subtlety and precision, offering unique textures with a truly
  extensive array of articulations. The sound is inspiring on its own, and
  blends beautifully with more traditional string sounds for rich, layered
  timbres.

  Muted strings sound warmer, rounder and somehow more gentle without
  sacrificing expression. The con sordino sound is a wonderful additional color
  in your string collection—perfect for the emotional understatement, and a
  handy secret weapon for layering sound.

  Berlin con sordino strings is part of the acclaimed berlin series—the most
  comprehensive, integrated collection of sampled orchestral instruments
  available. All berlin series libraries were recorded with the finest
  musicians, in situ, on the same teldex scoring stage in berlin. Designed for
  complete consistency across the series, all berlin series libraries play
  together perfectly, enabling you to seamlessly incorporate new sounds and
  customize your virtual orchestra for each project.

  Multiple mutes allow you to select orchestral mute patches for a round timbre
  or 'hotel' practice mutes for a gentler, more dampened tone with sustains and
  tremolos. Three legato modes let you choose from fingered, expressive, and
  playable runs to create natural, seamless transitions between notes.
