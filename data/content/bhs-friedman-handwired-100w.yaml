description: BHS Friedman Handwired 100W shirley's dirty brown eye custom amp,
  hand wired by dave friedman (78 rigs).
details: |-
  Shirley's dirty brown eye is a one of a kind custom amp that was hand wired by
  dave friedman. The sdbe is a 2 channel 100w head with a tuned 4 el34 power
  section that merges a 100w be-100 brown eye with a unique 100w dirty shirley.

  The be is a perfect specimen of the brown eye, and the dirty shirley channel
  is something entirely new. It has the big warmth and richness of the ds40, but
  much more headroom, bigger but tighter bottom end, and a complexity that goes
  from d-style clean to huge wall of sound higher gain tones.

  The library has been captured with a british 4x12" cabinet with a combination
  of greenbacks and v30 speakers. As usual in th-u, the rig player will
  automatically switch to the di rig if you turn off the rig player cabinet
  section.

  Bhs friedman handwired 100w by overloud is soundware (samples or presets that
  load into other products) for macos and windows.
specs: |-
  - 2 channel 100w head
  - 4 el34 power section
  - British 4x12" cabinet
  - Greenbacks and v30 speakers
  - DI rigs
  - Rig player with automatic cabinet switching
