details: >-
  Arctic is the analog lab v presets edition of the 5th soundbank designed with
  pigments of presets series "biome". As all previous "biome" soundbanks there
  are 80 experimental approach designed sounds like polysynths, keys, pads and
  leads.


  The sound dimension of the earth's poles full of character and cold
  atmospheres.


  Mw and at mostly assigned to vibrato and pitch change respectively.


  All 4 macros are assigned to different elements for richer dimensions in your
  sound.
specs: |-
  - Analog lab v presets
  - 80 experimental sounds
  - Polysynths
  - Keys
  - Pads
  - Leads
  - Macro controls (4)
  - Mw (modulation wheel) control
  - At (aftertouch) control
