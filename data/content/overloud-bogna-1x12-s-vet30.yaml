description: Bogna 1x12 S VET30 choptones supercab IR library created by
  capturing a bogner* 112 cps 1x12 with wgs* veteran 30 speakers.
details: |-
  Bogna 1x12 S VET30 is the choptones supercab IR library created by capturing a
  bogner 112 cps 1x12 with wgs veteran 30 speakers. It is an extensive and
  systematic capture created with 12 microphones, 8 to 16 positions each
  microphone and multiple mic preamps, for more than 300 IRs globally.

  The cabinet is straight front, open back, solid birch plywood construction,
  perfect extension cabinet for combos. The speaker, a revised and improved
  version of the vintage 30, provides smoother highs giving a less harsh and
  fizzy tone when using high gain amp.

  Captures are performed with a motorized mic stand in order to have consistent
  measurements across libraries. The microphones used during the capturing
  session are: akg c414, audio technica 2035, audix i5, beyerdynamic m160,
  electrovoice re20, neumann u87, royer 121, sennheiser md21, sennheiser md421,
  sennheiser md441, shure sm7, shure sm57.

  Every microphone has been moved to 4 different horizontal position (cap, cap
  edge, cone and cone edge) and two distances, for a total of 8 irs each. For
  some microphones, the set of 8 measurements has been repeated with the
  microphone off axis (45 deg). All the measurement set has been repeated twice,
  with two different mic preamps: a neve 1073 and a german preamp.

  The library is created for the th-u supercabinet, which allows to graphically
  browse the irs in the library, blend them together, craft new cabinet tones
  with the unique multiband mode, use the ir in the software, and export the irs
  in .wav, compatible with the software ir loaders and all the major hardware
  modelers.
specs: |-
  - 12 microphones with 8 to 16 positions each

  - Over 300 irs

  - 4 different horizontal positions per microphone (cap, cap edge, cone, cone
  edge)

  - 2 distances per position

  - Off-axis measurements (45 degrees)

  - 2 different mic preamps (neve 1073 and german preamp)

  - Motorized mic stand for consistent measurements

  - Bogner 112 cps 1x12 cabinet

  - Wgs veteran 30 speaker

  - Straight front, open back cabinet

  - Solid birch plywood construction

  - Graphical ir browsing

  - Ir blending capability

  - Multiband mode for cabinet tone crafting

  - .wav export format

  - Compatible with th-u supercabinet

  - Compatible with software ir loaders and major hardware modelers
