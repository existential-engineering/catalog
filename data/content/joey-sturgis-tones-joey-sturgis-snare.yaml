details: |-
  Introducing the Joey Sturgis Snare, your gateway to the signature snare sound that has defined the metalcore genre. Crafted by the renowned music producer Joey Sturgis, whose credits include chart-toppers like Asking Alexandria, The Devil Wears Prada, Attack Attack!, Miss May I, Emmure, We Came As Romans, and Of Mice & Men.

  With seamless compatibility in the Drumagog file format (.Gog), and user selectable multi-articulation formatted TCI for Steven Slate Drums Trigger 2, the Joey Sturgis Snare brings the unmistakable sonic character directly into your digital workspace.

  It doesn't stop there. The pack also includes 32 high-quality .WAV files. These function as dynamic, one-shot hits at various velocities, providing versatility for use with any sampler or drum replacement program.
