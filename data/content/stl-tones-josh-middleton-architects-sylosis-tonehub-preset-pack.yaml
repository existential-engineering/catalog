details: |-
  Josh Middleton is best known as the guitarist of Architects and Sylosis, and is one of modern British metal's most distinctive players. He meticulously collects cabinets and speakers from the early 2000s, which feed directly into his finished sound.

  His signature expansion pack was built across 13 amplifiers and 7 cabinets with multiple mic configurations, alongside 4 pedal options.

