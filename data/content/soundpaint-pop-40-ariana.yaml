details: |-
  Top 40 Drums

  A Pristine Pony-tail Parade of Pop Production Kits! Inspired by the drum kits of today's Top 40 artists. The perfect blend of Pop, Hip-Hop, and RnB. Combined with all the control, customization, and infinite dynamic variation of Soundpaint, you'll be creating chart-topping beats in no time. Tired of using the same-old, pre-made loops? Pop 40 is a "post-apoca-looptic" tool, designed for easy out-of-the-box flow and much greater customization! Take full control of the beat and create a signature sound with ease. Say goodbye to the limitations of loops and hello to endless possibilities in Soundpaint! Each program has an ARP - a great way to get the ball rolling. Customize the ARP, play on top of it, or turn it off and get into all the details; there's no wrong way to get in the groove. Pop 40 is easy and fun to play, so you can get start jamming right away!
