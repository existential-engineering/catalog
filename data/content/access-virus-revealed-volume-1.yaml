details: >-
  The bank contains basses, acid sounds, leads, pads and plucks to cover all
  your production needs. Designed on the latest ti version, this bank will work
  with all previous versions too.


  Sound designer jani kervinen had a totally new approach when designing these
  presets: "you should be able to build a track with your ti, without losing all
  your polyphony". This bank is chocked full of useable sounds.


  128 fresh patches suitable for any kind of electronic dance music creations.
  The sounds have been optimized with zero eq for compatibility across virus b,
  c, powercore and tdm models, while the virus ti optimized set has eq and
  double fx.


  33 different sounds used in the demo. Effects used: none (except the ones in
  virus itself).
