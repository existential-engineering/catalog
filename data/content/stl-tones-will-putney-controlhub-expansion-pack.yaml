details: |-
  Will Putney is a renowned modern metal and hardcore record producer, mixer and engineer working out of his own Graphic Nature Audio studios in New Jersey. He has produced, mixed or mastered records for Knocked Loose, Every Time I Die, Gojira, Thy Art Is Murder, The Amity Affliction, Northlane, The Acacia Strain, Silent Planet and Vein.fm, and produced Body Count's Grammy-winning "Bum-Rush". He is also a guitarist in Fit For An Autopsy and END. Known for his sonically raw and immaculate productions, Will has become one of the most in-demand producers in today's heavy music scene.

  This pack centers around Putney's extremely complex signal chain setups that make every element of his raw, yet modern productions so unique. Captured using Putney's entire hardware and software signal chains, it covers individual instruments all the way through to mix bus and mastering chains.

  This expansion pack has a total of 132 captures.
