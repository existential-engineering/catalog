details: |-
  'Sylenth1 Essentials Vol 8 - Progressive House' is a preset pack for LennarDigital Sylenth1, designed for Progressive House, Future House, EDM, Dance and melodic electronic music productions.

  The pack includes 64 royalty-free Sylenth1 presets and 83 MIDI files taken from the demo. You get ready-to-use leads, plucks, chords, basses, keys, pads, FX, hovers and arps for creating emotional melodies, powerful chord progressions, driving basslines and energetic Progressive House drops.

  Requirements:
  LennarDigital Sylenth1 version 3.06 or higher is required.

  Please note:
  The synth plugin Sylenth1 is not included. The full demo drums and some additional demo FX are not included.
specs: |-
  - 64 Presets for Sylenth1
  - 15 Leads (Presets)
  - 10 Plucks (Presets)
  - 10 Chords (Presets)
  - 10 Basses (Presets)
  - 5 Keys (Presets)
  - 5 Pads (Presets)
  - 4 FX (Presets)
  - 3 Hovers (Presets)
  - 2 Arps (Presets)
  - 83 MIDI files
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
