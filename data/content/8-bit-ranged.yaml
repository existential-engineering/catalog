details: |-
  Stay on target with the 8-Bit Ranged weapon sample pack. The 8-bit samples
  included in this pack "range" from long spinning throws to quick flicks of the
  wrist, archery shots, lobs and rockets.

  The 8-bit sounds are separated into seven sound categories: bows & arrows:
  swishing airy sounds when firing from a bow or crossbow. Long throws: long
  distant throws for far away targets. Short throws: short range throws when
  things are up close and personal. Single throws: just one throw sound by
  itself. Quick throws: flick the wrist and it's away. Rocket launchers: big
  long noises that sail through the air. Throw tones: high pitch bend sounds
  when lobbing a ball or a grenade.

  This pack contains: 105 8-bit ranged samples (bows & arrows, long throws,
  short throws, single throws, quick throws, rocket launchers & throw tones). 1
  sfx patch for native instruments kontakt, ableton live, maschine, logic pro
  exs24/sampler, fl studio, mpc expansion pack, and tal-sampler. 24-bit, 44.1
  khz wav files.
specs: |-
  - 105 8-Bit Ranged samples
  - 24-bit, 44.1 kHz wav files
  - Sfx patch for Native Instruments Kontakt
  - Sfx patch for Ableton live
  - Sfx patch for maschine
  - Sfx patch for Logic Pro exs24/sampler
  - Sfx patch for fl studio
  - Sfx patch for mpc expansion pack
  - Sfx patch for tal-sampler
  - Seven sound categories
