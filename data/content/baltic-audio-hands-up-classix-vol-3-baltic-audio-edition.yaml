details: |-
  'Hands Up Classix Vol 3 (baltic audio Edition)' by CESA SAMPLES is a royalty-free Spire preset pack designed for classic Hands Up, Dance, 2000s EDM and Eurodance-inspired productions.

  This baltic audio Edition includes 70 presets for Reveal Sound Spire, capturing the energetic sound of classic 2000s Hands Up and Dance music. It provides ready-to-use leads, basses, plucks, pads, synths, bells, arpeggios, drum-type presets and chords for building uplifting melodies, hands-up hooks, driving basslines and nostalgic club arrangements.

  Requirements: Reveal Sound Spire v1.5.1 or higher is required.

  Please note: This baltic audio Edition contains Spire presets only. It does not include samples or MIDI files. Drum-type presets listed in the pack are included as Spire presets, but audio drum samples and some FX used in the demo are not included.
specs: |-
  - 70 Spire Presets
  - 30 Leads (Presets)
  - 15 Basses (Presets)
  - 5 Pads (Presets)
  - 5 Plucks (Presets)
  - 5 Synths (Presets)
  - 3 Bells (Presets)
  - 3 Arpeggios (Presets)
  - 2 Drums (Presets)
  - 2 Chords (Presets)
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
