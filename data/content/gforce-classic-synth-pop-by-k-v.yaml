description: 50 meticulously crafted patches for the GForce Oberheim OB-X, designed by sound design duo K/V (Ramon Kerstens and Richard Veenstra), capturing the nostalgic sound of 80s synth-pop legends like Depeche Mode, Human League, and New Order.
details: |-
  From shimmering synths to infectious melodies, Classic Synth Pop is built around the timeless allure of retro-pop. K/V's vision was to create a versatile pack that not only excels at producing 80s music but also fits seamlessly into a modern synth-pop context. 'We wanted to make a pack that's not only useful for making 80s music, we tried to create patches that also work in a modern synth pop context,' says K/V. The result is a diverse range of patches including basses, keys, lead sounds and dreamy pads, all infused with the essence of great 80s synth music.

  Aimed at musicians and producers looking to capture the nostalgic sound of classic synth-pop while adding a contemporary twist, the pack provides the tools to craft memorable, vibrant tracks.

  K/V is a sound design and composition duo comprised of Ramon Kerstens and Richard Veenstra. Their credits extend across clients including Toontrack, Native Instruments, Arturia, Steinberg, Soniccouture and GForce Software, and as composers their portfolio ranges from movies and ad campaigns to podcasts and radio.

  The pack is only available to registered users of GForce Oberheim OB-X, and is exclusively available via the GForce website as a direct download via 'My Instruments' once the purchase has been completed.
specs: |-
  - 50 patches by K/V
  - 12 Keys patches
  - 9 Leads patches
  - 9 Pads patches
  - 8 Arpegs patches
  - 8 Basses patches
  - 3 Textures patches
  - 1 Effect patch
  - Requires a registered installation of GForce Oberheim OB-X
