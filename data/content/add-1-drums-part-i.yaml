description: The add-one is a real nice little gem. Basically it is a drum
  machine from the 80s containing rom samples from different drum sounds.
details: |-
  The add-one is a drum machine from the 80s containing rom samples from different drum sounds. With the help of an external disk drive users can also record their own samples. The most interesting part is the engine behind the 12 bit converters. Analog envelopes and analog filters are used for the signal path and features like LFO and auxiliary envelopes give many possibilities to sculpt the sound of the waveform.

  Add-1 drums part I is the first drum collection exclusively made with the add-one. Everything is recorded directly from the output in 24-bit and 44.1 khz. The synthesis engine, filters and the possibility to layer samples were extensively used in creating this collection.

  This package contains 420 wav-files located in two folders. The 4 velocities folder contains samples recorded with four different velocities. The samples with the 1 at the end are recorded with the lowest velocity whereas the samples indicated with a 4 at the end were done with the max velocity.

  The one-shots folder contains a nice collection of one-shot samples including kicks, snares, cymbals & hats, claps, percussion, toms and sounds labeled sounds/fx. Some of them can be used together, they are the same sound treated with different pitches, envelope or filter settings.
specs: |-
  - 12 bit converters
  - Analog envelopes
  - Analog filters
  - LFO
  - Auxiliary envelopes
  - 24-bit recording
  - 44.1 kHz sample rate
  - 420 wav-files
  - 4 velocities folder
  - One-shots folder
