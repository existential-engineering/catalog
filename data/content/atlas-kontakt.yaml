details: |-
  The instrument is designed to be as intuitive and fast as possible, and
  includes multiple sample banks and fx controls in a single .nki to achieve
  this.
specs: |-
  - Kontakt 5 engine
  - Over 800 24-bit high quality samples
  - 16 sample banks
  - Built-in delay
  - Built-in reverb
  - Built-in filter
  - Built-in movement FX
  - Built-in trash FX
  - Fully automatable interface
  - 5-octave key range
  - 2.9gb of samples (compressed to 1gb .ncw)
  - Kontakt 5.8 or later (full version required)
  - 4gb of RAM (8gb recommended)
  - Stable internet connection (for download)
  - 1gb hard disk space (compressed from 2.9gb)
