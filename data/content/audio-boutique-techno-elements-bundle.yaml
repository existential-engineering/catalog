details: |-
  Audio boutique's techno elements bundle is loaded with expertly crafted and
  never-heard samples covering virtually every area of techno. Pristine atmos, a
  plethora of perfectly handcrafted basslines, fresh loops and fills,
  one-shot-samples and even vocals are included to spice up your productions in
  no time.

  Most of the unique sequences and basslines were created with rare analog
  devices like the sequencial circuits pro one, oscar, dave smith ob6, roland
  tb-303, sh-101, pittsburgh lifeforms, roland jupiter 6 and moog minitaur.

  Ramon zenker and harald ("harada") aufmuth prove once again that they belong
  to the top-producers of contemporary club sound for a reason so all that's
  left for you is to get your toys together and come up with the next pounding
  techno smasher.

  Save 60% to single purchase.
