description: "The ultimate collection of everything Energy: Electricity, Power Ups, Shockwaves, Sparks, Force Fields, Zaps, Loops, and plenty more. Created collaboratively by SoundMorph, Frederic Devanlay, and Cedric Denooz, adapted for Krotos plugins. Offers royalty-free components for trailers, post-production, game-audio, and sound design projects."
details: |-
  Energy by SoundMorph is the ultimate collection of everything Energy: electricity, power ups, shockwaves, sparks, force fields, zaps, loops, and plenty more.

  Created in collaboration between SoundMorph, Frederic Devanlay and Cedric Denooz, Krotos has adapted this collection to work straight out of the box in two of its plugins, offering even more power than the original. From electricity sparks, zaps and impacts to energy weapons or ambiances, it powers up a sound design project.

  This collection offers a wide-ranging 5.99 GB (Weaponiser) and 5.85 GB (Reformer Pro) selection of royalty-free SFX components, ideal for any trailer, post-production, game-audio and sound design project.

  Sound categories included in this library: Energy Weapons, Particles, Power, Buzz. Sound effect keywords: Energy Loops, Neutrons and Particles, Electricity Sparks, Zaps, Impacts, Energy Weapons, Special Powers, Whoosh, Passbys, Energy Foley, Ambiences, Hums, Buzzes, Lightning Elements, Power Up, Power Downs.
specs: |-
  - 606 Sound Files
  - 5.99 GB Size (Weaponiser integrated)
  - 24 bit / 96kHz High-Quality WAV Files
  - 100% Royalty-Free Commercial License
  - Embedded Metadata
  - 40 Weaponiser Presets
  - 18 Reformer Pro Sound Packs
  - Contains three downloads: a zip file of all source sound effect asset files with Metadata PDF, an installer for the integrated Weaponiser library, and an installer for the integrated Reformer Pro library
