details: |-
  A-kit is a collection of seven simple-to-use drum plug-ins.

  The seven plug-ins: kick. Snare. Hihat. Crash. Ride. Hi tom. Lo tom.

  They all respond to note, velocity and attack, plus they have a "level of interpretation", ranging from "stupid" to "mad", which adds random modulation to the velocity.
specs: |-
  - VST plugin
  - Audio units plugin
  - Macos compatible
  - Windows compatible
  - Note velocity response
  - Attack response
  - Random modulation
  - Level of interpretation control
