details: |-
  The seven plug-ins: kick. Snare. Hihat. Crash. Ride. Hi tom. Lo tom.

  They all respond to note, velocity and attack, plus they have a "level of
  interpretation", ranging from "stupid" to "mad", which adds random modulation
  to the velocity.
specs: |-
  - macOS compatible
  - Windows compatible
  - Note velocity response
  - Attack response
  - Random modulation
  - Level of interpretation control
