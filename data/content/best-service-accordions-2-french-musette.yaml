details: |-
  Produced by eduardo tarilonte, accordions 2 is considered the first choice if you are looking for a realistic and, above all, playable accordion library. Numerous renowned composers and producers rave about the authenticity and expressiveness of this virtual instrument.

  With single french musette you get a virtual accordion from eduardo tarilonte's accordions 2 as a single instrument. So if you are looking for the beautiful parisian sound, this realistic and playable french musette is the right choice.

  Accordions 2 - french musette by best service is a virtual instrument audio plugin and a software application and soundware (samples or presets that load into other products) for macos and windows.

  It includes, and is therefore "powered by", engine player, which functions as an audio units plugin, a VST 3 plugin, an AAX plugin and a standalone application.

  This single instrument was exclusively designed for best service engine 2 and is therefore not compatible with the kontakt player.
specs: |-
  - True french musette accordion
  - Left-hand basses from concert accordion
  - 3 kinds of bellow shake
  - 3 different dynamics
  - 3 round robins
  - Key and button noises
  - Recorded chromatically with u47 microphone
  - Best Service engine 2 compatible
