details: |-
  The main feature of aizerx trailer sfx designer toolkit is the smart samples randomization for the creation of absolutely unique, custom and authentic sound effects with just one click, based on 6 modules, containing a huge aizerx library of fully customizable hybrid sound effects of the highest quality in different categories like braams, whooshes, benders, alarms, signals, downers, risers, motions, noises, booms, hits, etc.

  Aizerx trailer sfx designer toolkit also offers deep sound customization by adjusting the parameters of each module or global and save them as presets.
