  DW01 Synthdrums is an instrument preset pack for the Dirtywave M8 Tracker. It features over 30 drums created exclusively using the M8's built-in synthesis engines, along with 2 demo song files.

  The pack requires M8 hardware or headless firmware 2.7.8 for proper playback.
