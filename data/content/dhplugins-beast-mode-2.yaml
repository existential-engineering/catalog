description: "Introducing the third Expansion pack for HALO: “BEAST-MODE”.
  Featuring 65 brand new presets and 36 sample banks containing snarling reeses,
  growling basses and grinding stabs."
details: |-
  Fully updated for HALO-2. Featuring 65 brand new presets and 36 sample banks containing snarling reeses, growling basses and grinding stabs, these sounds have been extensively tweaked and processed using primarily hardware wavetable synthesisers and software processing.

  Expect heavyweight sounds driven hard by digital distortion and complex modulations resulting in beastly yet organic bass riffs.

  All presets have been crafted using the full breadth of HALO's unique functionality. Using a range of hardware and software synthesisers, both digital and analogue sound sources and fx and processing, the sample banks were put together to create re-sampled audio for each expansion, and every expansion has its own character and qualities.
specs: |-
  - 65 presets
  - 36 sample banks
  - Updated for HALO-2
  - Sounds sourced from hardware wavetable synthesisers and software processing
  - Digital distortion and complex modulation used throughout
  - Requires HALO (full version); does not work with HALO LITE
