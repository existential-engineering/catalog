details: |-
  Inspired by the atmosphere of the cyberpunk world, this library offers a lot
  of character and personality with a cinematic futuristic vibe that perfectly
  captures the philosophy of the genre. As a powered-by-aizerx-engine tool for
  composers and sound designers, this library is able to simplify the sound
  design process, and also opens up new possibilities for incredible creative
  ideas.

  Aizerx hybrid cyberpunk toolkit offers the signature sound randomizing
  feature, delivers a deep library of samples from classic braams, trailer hits,
  signals, alarms to screaming resonators and distortions.

  The centerpiece of the aizerx hybrid cyberpunk toolkit is a selection of
  tempo-synced drum loops, hybrid pulses, and stems of different categories. You
  can create variations of energetic, dynamic drum and pulse patterns at
  different tempos, varying among themselves and combining individual sound
  layers.

  A collection of multi-sampled playable basses, leads, plucks, pulses and
  signals is also a main feature of the library. And by tradition, in
  collaboration with various artists established in the movie trailer industry,
  keepforest have prepared a special artist stems category, which contains stems
  and cues made by the artists, where you can borrow elements, structures, and
  tricks from experienced composers and will help you get inspired, learn from
  experience and save your time.

  Aizerx hybrid cyberpunk toolkit contains: sound fx: 382 global layers, 85
  trailer hits, 41 wild resonators & benders, 38 distortions, 62 braams, 58
  downers, 31 benders, 33 tonal & ambience, 22 signals, 12 alarms, 13 reversed
  fxs, 28 kicks, 17 boom hits. Playable instruments: 18 basses, 10 braams, 13
  leads, 04 pads, 08 plucks, 18 pulses, 5 signals. Pulses, stems & loops: 16
  artist stems, 11 cyberpunk stems, 10 drum stems, 20 full hybrid pulse stems,
  20 low classic pulses, 28 cyberpunk pulses, 101 hybrid low pulses, 65 hybrid
  mid pulses, 24 hybrid high pulses, 12 hybrid motion pulses, 73 elements &
  layers, 323 hybrid pulses, 133 trailer drum loops, 46 tonal loops. Presets:
  819 aizerx engine presets by keepforest.
