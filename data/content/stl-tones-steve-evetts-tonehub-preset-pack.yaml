details: |-
  Steve Evetts first came to prominence by introducing a production style that brought clarity while maintaining the aggression of the punk and hardcore scene of the early 90s. He has gone on to produce records for some of music's most innovative bands, including The Dillinger Escape Plan, Sepultura, Sick Of It All, Senses Fail and The Cure.

  Known for working across the most demanding musical genres, Steve's attention to detail is unparalleled when it comes to creating and capturing the perfect guitar tone. That diverse range is what this pack captures.

  Steve's pack contains 52 captures.
