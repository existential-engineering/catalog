details: |-
  The samba combines the natural, exhuberent impulse to move in rhythmic dance, mixing free improvisation with orchestrated motion based on instinctive musical patterns. More than any other form of artistic expression, the samba is the embodiment in sound and motion of the free spirit of the Brazilian people. From the depths of the Optigan master tape archives comes this previously unreleased SAMBA jam, paired with a Marimba keyboard scale that similarly went unused back in the 70s. Though we have previously released the marimba sound for Orchestron, it's making its first Optigan appearance on this disc. The demo video captures the happy feel of samba rhythms along with an exploration of changing tempos and pitches. Important Note:

