description: Five Pop construction kits with over 250 WAV files, more than 30 MIDI files and 32 Spire presets, covering basses, drums, synths and instruments.
details: |-
  'Billboard Pop Busters Vol 2' from baltic audio contains five Pop construction kits with the elements needed to build chart-style Pop tracks, including hand-crafted basses, drums, synths, instruments and 32 Spire presets.

  Each kit contains recorded and mixed instrumentation aimed at commercial Pop production.

  MIDI files are included for the majority of musical phrases heard in these kits, so phrases can be adapted and used to trigger any synth or sampler. The MIDI files can be combined with the included key-tagged one-shot files to create new phrases and patterns that blend with the pre-recorded content.
