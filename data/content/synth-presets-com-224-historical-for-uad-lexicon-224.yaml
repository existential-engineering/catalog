details: |-
  If you own any modern reverb, it is likely to have been influenced by the
  lexicon 224. One of the most iconic reverbs of all time.

  "224 historical" for the uad lexicon 224 is not only about this iconic verb
  but also its historical sound as heard on countless recordings.

  This 125 preset library was meticulously programmed to bring out the superb
  sonic capability's that the plugin has to offer.

  The presets cover a broad range of spaces and categories suitable for high end
  recording studios.
