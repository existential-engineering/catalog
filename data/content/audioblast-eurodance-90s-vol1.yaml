details: |-
  Bring back the sound of the dancefloor with the ABX3 – EuroDance 90s Preset Bank, featuring 128 high-energy presets inspired by early 90s EuroDance anthems and iconic dance production techniques.

  Loaded with Powerful Synth Bass, punchy leads, and signature sawy textures, this pack channels the essence of artists like Cappella, Masterboy, Culture Beat, Factory Team, Bass Bumpers, 2 Unlimited, Corona, La Bouche, and Haddaway.

  Carefully crafted to instantly fit your next hit, this expansion delivers Eurodance Synth Sounds, EuroDance 90s patterns and loops, and Early 90s EuroDance sequences, all optimized for ABX3, the advanced bass & lead synthesizer.

  Let your Pop Synth Lead shine like it's 1994 again. Whether you're creating retro throwbacks or injecting nostalgic energy into modern productions, this sound bank gives you instant access to the sound that defined a generation.
