description: Get 128 authentic 90s EuroDance presets for ABX3. Perfect for retro dance, trance, and pop tracks with classic leads, basses.
details: |-
  Bring back the 90s EuroDance vibe with this ABX3 preset bank. Featuring 128 energetic leads, basses and sequences inspired by classic EuroDance hits, this expansion is aimed at retro dance, trance and pop productions.

  Loaded with powerful synth bass, punchy leads and signature sawy textures, the pack channels the essence of artists like Cappella, Masterboy, Culture Beat, Factory Team, Bass Bumpers, 2 Unlimited, Corona, La Bouche and Haddaway.

  Carefully crafted to fit straight into a track, the expansion delivers EuroDance synth sounds, EuroDance 90s patterns and loops, and early 90s EuroDance sequences, all optimised for ABX3, Audio Blast's bass and lead synthesizer.

  Whether you are creating retro throwbacks or injecting nostalgic energy into modern productions, this sound bank gives instant access to the sound that defined a generation. Requires ABX3.
