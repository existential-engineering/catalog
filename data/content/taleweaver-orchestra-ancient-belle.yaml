details: |-
  "la Ancient Belle" is a bell library for Kontakt 5. The bell is an instrument
  of the metallophone-family just like the bigger sister of the glockenspiel.
  The bell is well known as an instrument used by marching bands to accompany
  the high flutes or the lyra.

  While the lyra is carried on a stick, sounding like a glockenspiel, the bell
  is played like a vibraphone hanging in front of the player. The solid aluminum
  bars have a beautiful and warm sound in the middle section and a crystal clear
  voice in the higher octave reminding of a wonderful music box sound.

  The native range is two and a half octaves from g" to c"", tuned in a=442. The
  library provides two additional pitched octaves to thicken the sound if
  necessary.

  The patch consists of 30 native ranged keys recorded in high quality 41khz /
  24-bit wave format. Every key has three velocity layers, each containing three
  roundrobins. So the patch consists of 270 recorded samples plus two additional
  octaves pitched sounds of the same quality.

  The extracted zip file requires 190 mb of disk space. (requires kontakt
  5.2.1.6382 or higher)
specs: |-
  - Bell library for Kontakt 5
  - Metallophone-family instrument
  - Two and a half octaves range (g" to c"")
  - Tuned in a=442
  - 30 native ranged keys
  - 41khz / 24-bit wave format
  - Three velocity layers per key
  - Three roundrobins per velocity layer
  - 270 recorded samples
  - Two additional pitched octaves
  - 190 MB disk space required
  - Requires Kontakt 5.2.1.6382 or higher
