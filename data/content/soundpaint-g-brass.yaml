details: |-
  Big. Bold. Badass Brass

  Whether you're a professional film composer or a modern Trap and Hip-Hop producer, G-Brass is set to blast your brass off. G-Brass is an inexcusably massive sound library, and contains a huge array of deep-sampled acoustic and synthesized brass ensembles. Drop this in your DAW template and you'll savor the beefy low end and crispy highs like never before. We've presided over some of the most insane orchestral sessions in history, including 66 piece Trombone and Tuba Ensembles, massive Brass combination ensembles, and even unique Cimbasso Ensembles. G-Brass is a colossus of an instrument assembled from all of these landmark recordings and more. G-Brass also contains a deep selection of Brass-inspired sounds from vintage and modern analog synths, which we specifically designed and deep-sampled to augment the acoustic instruments. Full of tasty Jupiter 8, Udo Super 6, Andromeda, Moog One and OB6 samples, you can choose whichever hybrid combination of organic and synthetic fits your mix.
