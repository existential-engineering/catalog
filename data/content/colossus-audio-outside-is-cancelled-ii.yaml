details: |-
  The second volume dives deeper into the fractures between noise, rhythm, and space. Outside Is Cancelled – Vol. 2 expands the sonic language of the first pack with heavier distortions, broken pulses, and unstable atmospheres extracted from modular feedback systems and tape processing. Each sound was recorded and re-amped through Colossus Audio hardware, shaped by moments of unpredictability and controlled collapse. The result is a library of textures that feel tactile, human, and on the edge of disintegration. 120 samples — distorted drums, voltage noise, spectral drones, and mechanical breaths.
