description: "Sam Guaiana is a producer, mixer, and songwriter based in Los
  Angeles, CA, well-known for creating exciting modern rock and pop mixes.
  Bringing creativity and a diligent work ethic, Sam continues to bring vitality
  to successful projects such as Silverstein’s JUNO-nominated album “A Beautiful
  Place To Drown” as well as his work with artists Neck Deep, The Devil Wears
  Prada, and Intervals. This expansion pack brings the to-go mixing tools that
  Sam Guaiana uses every day to bring excitement and vitality to his mixes,
  exclusively available for the ControlHub platform.Packed with essential
  starting points when first building your mix, this expansion also narrows in
  on the key elements that make a great modern rock and pop mix with chains for
  drums, electric and acoustic guitars, and the all-important vocal presets to
  help your vocals fit sonically and stylistically. Rounded out with mix bus and
  mastering emulations, Sam Guaiana has opened up and shared the keys to help
  your next mix breakthrough.This expansion pack has a total of 61 presets."
