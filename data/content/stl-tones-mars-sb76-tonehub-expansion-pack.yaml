details: |-
  The Mars SB76 is based on a modded 1976 Marshall JMP Super Bass MKII. Developing an almost cult-like following, the Mars SB76 is perfect for classic plexi-style warmer rock tones and shines when boosted with an overdrive. This expansion pack has 36 presets, containing 3 different cabinets and microphone pairings with 4 overdrive pedal options.
