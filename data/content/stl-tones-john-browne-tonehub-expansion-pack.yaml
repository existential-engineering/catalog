details: |-
  John Browne is a founding member of progressive metal band Monuments, and has become a mainstay in the guitar community for harnessing the energy, precision and sheer velocity demanded of the modern metal musician.

  John engineered this expansion pack to bring all his go-to studio sounds together in one place. Built across 15 different amplifiers and various pedal combinations, it represents the full variety and range of tones needed for modern progressive metal.
