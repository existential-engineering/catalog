description: "Bass Motto: Slap House Construction Kits from Big Fish Audio
  brings in over 4 GB of spinnin' sounds synonymous with brazilian bass."
details: |-
  Grooved and swinging basslines, open and minimal hard-hitting house drum
  drops, and dark build influences often seen in trap music, bass motto delivers
  a song-style format that showcases this revolutionary dance trend. You'll find
  20 chest-thumping construction kits filled with enough inspiration for that
  next hit.

  If that weren't enough, everything has been processed via ssl outboard gear
  and tape saturation, ensuring that your next production is radio-ready. In
  each kit, you will find individual loops for every section of the track, as
  well as multitrack drums and drum hits for total control over your
  arrangement. On top of that, we've included MIDI files for the melodic
  elements so that you can tweak the sound to your liking.

  Bass motto: slap house construction kits has been formatted in all the
  industry standard file types: apple loops, acidized wav and rex. Each audio
  file has been expertly cut and edited to loop perfectly, and has been recorded
  in the highest quality 24-bit rate to ensure absolutely top quality end
  results.

  Momentum is the next generation of kli. This plugin is a powerful loop
  transformation platform that allows you to slice, stretch, change the key,
  rearrange, and compose from multiple samples and sources, as well as find that
  perfect one-shot inside your loop. You also have access to big fish audio's
  world-famous loop libraries right inside the plugin. And unlike other loop
  platforms, momentum is completely free and doesn't have any subscription fees.
