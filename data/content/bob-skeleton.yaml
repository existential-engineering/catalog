details: |-
  Bob Skeleton sound library introduces exciting action sounds of bobsleighs and
  skeletons that rush down the ice tube with more than 100 kilometers/hour. The
  recordings were gathered at 9 spots along a track in altenberg in the south of
  Germany. Each take is sorted by spot and extensively meta-tagged.

  The content of this library allows for assembling a complete run from start to
  finish or even to extend it by easily combining start sceneries, energetic
  passes in different speeds and noisy brakings past finishing line.

  Furthermore bob skeleton content is an inspiring resource for sound mangling
  experiments and artificial foley design.

  Live pack requires live 8/9, 42 instrument racks, 200 mb. Universal light 40
  broadcast wav files with embedded description in 24/48 resolution, 200 mb
  content. Universal hd96 82 broadcast wav files with embedded description in
  24/96 resolution, 830 mb content.
specs: |-
  - Live pack format with 42 instrument racks
  - Universal light format with 40 broadcast wav files
  - Universal hd96 format with 82 broadcast wav files
  - 24/48 resolution
  - 24/96 resolution
  - Embedded description metadata
  - Meta-tagged by recording location
