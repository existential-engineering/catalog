description: Acoustic Isolation is a loop module for Kontakt 6. Acoustic
  isolation delivers truly unique and inspiring sounds right out of the box.
details: |-
  These kits are built using the included 800 (unencrypted) 24-bit wav files.
  All loops can be played polyphonically timestretched within a range of two
  octaves (24 semitones). Each part has it's own color-coded range on the
  keyboard.

  You can alternatively play the loops sliced using the "slice" button in the
  sequencer pages. There are special MIDI trigger keys/notes that enable you to
  retrigger a currently playing slice (when a sequencer is turned on) or to
  trigger a volume "trancegate" per part.

  It comes with 200 preset kits (snapshots) that guarantee instant inspiration.
  If that's not enough you can use the randomization features of acoustic
  isolation to generate endless "new" kits.

  You can also import your own wav loops via drag and drop. (up to 512 of them
  at once).
specs: |-
  - Loop module for Kontakt 6
  - 200 different kits
  - Four categories (groove, percussion, melody and user)
  - 800 unencrypted 24-bit wav files
  - Polyphonic timestretching
  - Two octaves range (24 semitones)
  - Color-coded keyboard ranges
  - Slice button in sequencer pages
  - MIDI trigger keys/notes
  - Slice retriggering
  - Volume trancegate per part
  - 200 preset kits (snapshots)
  - Randomization features
  - Drag and drop wav loop import
  - Up to 512 custom loops
