description: Beats from the Bass ship is a legendary collection of next level Serum presets and drum hits created by Ahee of KJ Sawka's label, Impossible Records.
details: |-
  Ahee, of KJ Sawka's label Impossible Records, put together a collection of Xfer Serum presets and drum hits built around huge, phat, crisp sounds. From crushing basses made from electric toothbrushes to 'triple A list' sounding drum hits, the pack aims at the modern bass music producer's library.

  The preset side runs to 128 Serum patches, weighted heavily toward bass (56) and sound FX (27), with plucks, leads, arps, drums, pads, chords, drones and rhythms filling out the rest.

  Alongside the presets sit 100 modern drum hits covering kicks, snares, claps, percussion and hi hats, so the pack works as a drum source as well as a synth library.

  Genres listed for the pack are bass, dubstep and trap, and it is filed under complextro, EDM and glitch hop as well.

  The download is a 176 MB zip. All samples are royalty free, and Serum should be up to date for the presets to load correctly.
specs: |-
