details: |-
  This is a small free soundset which I created for the virtualcz software
  synthesizer from plugin boutique to accompany my review of this synthesizer on
  the flstudiomusic.com blog. It contains 15 presets for virtualcz.

  A very small pack but free and above all containing real gems for lovers of
  smooth and dreamy sounds.

  The soundset is designed for use in down tempos for ambient and chill out
  styles.
