details: |-
  48 presets for the LennarDigital Sylenth1 synthesizer, aimed at Future House and EDM, including basses, leads, chords, plucks, pads and FX.

  Each preset is programmed by a professional sound designer, with every parameter tweaked in detail, as a source for creating new and commercial sounds within a composition.

  The pack can also be used for genres like Future Bass, Progressive House and Dance.

  Please note: the drums and some FX used in the demo are not included in this product. These presets require v3.03 or higher of LennarDigital Sylenth1.
specs: |-
  - 48 Presets for Sylenth1
  - 18 Basses
  - 10 Leads
  - 6 Chords
  - 6 Plucks
  - 4 Pads
  - 4 FX
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
  - Requires LennarDigital Sylenth1 v3.03 or higher
