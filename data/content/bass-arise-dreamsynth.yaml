details: |-
  From synth sweeps to dark atmospheric bass risers this soundbank is a nice fit
  to create some analog styled atmospheric background with tension and movement.

  Please note that due to the lot of bass frequencies in the presets it is
  recommended to be careful about overall intensity of the synth volume and
  digital clipping.

  Presets were designed with dreamsynth ds-1 1.4.0 (build 133) and run best with
  this or newer edition.
