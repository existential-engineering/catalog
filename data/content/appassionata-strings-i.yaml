details: |-
  As the name suggests, these string ensembles are passionate, offering a lush, broad and emotive cinematic sound. The large ensembles of 20 violins, 14 violas, 12 cellos and 10 basses integrate into a variety of musical styles, from pop and rock environments to symphonic arrangements, from emotional ballads to films, from pure string beds to complete orchestral scores.

  The appassionata strings I offer various facets of sustains and legato performances with different intensities of vibrato as their main focus, but also include articulations such as sul-g-performances, accented interval notes, spiccatos, staccatos, various repetition performances, trills, runs, and much more.

  They also include vienna's innovative "out-of-tune-samples" where various players of the ensemble carefully correct their intonation as the tone progresses. Mirroring what actually happens in live orchestral performances, this is a very effective technique for creating heightened realism and expression.

  The appassionata strings I bass section of 10 instruments consists of 6 five-string and 4 four-string basses, giving the low end a deep and rich flavor. A purchase entitles you to download the free vienna instruments player software that includes the vienna ensemble mixing and host software.
