details: >-
  Gothic toolworks releases 58 blockbuster trailer-style sound design packs +
  free sfx taster pack. Since 2010, gothic storm has supplied sound design tools
  to blockbuster trailers, from oppenheimer to call of duty. Now they've opened
  their sfx vault to create gothic toolworks, giving access to a curated
  selection of trailer-style sound packs for music producers and composers.


  Over 5000 of these professional samples are available to download, priced $29
  - $99 per 100-sound pack with bundle and intro discounts available.


  For the first time ever, the same sounds used in countless movie trailers are
  available as bespoke collections of impacts, transitions, drops, whooshes and
  more. From gut-punching braams to brain-bending rises, each of these 58 sfx
  packs features 100+ sounds.


  Every pack contains high-quality 24-bit 48khz aiff files with full soundminer
  metadata tagging for ease of use.


  To celebrate this event, gothic toolworks are giving away a free taster pack,
  including mind-melting sounds from all 58 collections.
