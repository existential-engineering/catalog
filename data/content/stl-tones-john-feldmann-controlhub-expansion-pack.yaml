details: |-
  John Feldmann is one of the defining producers of modern pop-punk and alternative rock. Frontman of Goldfinger, he has produced and co-written records for The Used, Blink-182, Good Charlotte, Papa Roach, 5 Seconds of Summer, Avril Lavigne, Simple Plan, Panic! At The Disco and All Time Low, with albums he has worked on selling more than 34 million copies worldwide.

  This expansion brings that genre-defining sound directly to your DAW. Every signal chain has been captured from his most iconic productions at Foxy Studios in LA, covering polished pop vocals, aggressive screaming, programmed bass and punchy live drums, all with the exact compressed, in-your-face tones that shaped a generation of alternative records.
