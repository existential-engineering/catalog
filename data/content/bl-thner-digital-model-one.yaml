description: Blüthner Digital Model One is a Kontakt player 2 powered grand
  piano. Recorded at skywalker sound (a division of lucasfilm, ltd.)
details: |-
  Blthner digital model one is a Kontakt player 2 powered grand piano. Recorded
  at skywalker sound (a division of lucasfilm, ltd.) - one of the quietest
  studios in the world (both physically and electronically). Superb acoustics,
  excellent technical implementation and hand selected microphones, cables,
  preamps with pacific microsonics digital converters optimize the "front end"
  for the highest detail sample recordings.

  There are 12 layers of samples both pedal up and pedal down versions,
  utilizing our new discrete sustain technology. The number of samples totals
  well over 2,000. The bdmo's pedal down samples have "air" and depth in a
  spacious stereo field. Every sustain sample is unique not modeled or computer
  generated. Our samples have the lowest noise floor of any digital piano on the
  market, using our proprietary techniques and algorithms.

  The bdmo is close miked, meaning that there are no room reflections or
  acoustic ambience in the sample recordings. Close miking gives you far greater
  sonic detail and allows you to add the reverbs you choose or use our custom
  created impulse response reverbs. All the very low level detail of the piano
  have been captured with noise free pppp, ppp and pp samples. We placed special
  emphasis on accurately capturing and programming the blthner's rich and
  colorful low velocity dynamics.

  The bdmo comes loaded with 3 types of custom designed convolution: timbral,
  reverb and sustain. Timbral impulses are literally "sonic fingerprints" of
  over 260 individual pianos and piano recordings. With the push of a button,
  you can instantly transform the bdmo's sound into one of over 260 discretely
  different pianos from seven ti categories: classical, custom, jazz, pop, r&b,
  vocal, and pianos.

  Proprietary linear db scaling accurately recreates the true dynamics of the
  bdmo. Each individual sample has its own calibrated dynamic level derived from
  the actual acoustics of the blthner model one. The bdmo instrument patches are
  built with high accuracy keyboard scaling programmed directly into them.
  Choose from 100% (acoustic) to 45% (compressed). The bdmo offers built-in
  floating just intonation, custom designed by ernest. It can be addressed by
  either using a 2nd keyboard or by assigning a MIDI controller to cc#16.
specs: |-
  - Kontakt player 2 powered grand piano

  - 12 layers of samples pedal up and pedal down

  - Discrete sustain technology

  - Over 2,000 samples

  - Close miked recording

  - Lowest noise floor

  - 3 types of custom designed convolution (timbral, reverb, sustain)

  - Over 260 timbral impulses

  - Seven timbral impulse categories (classical, custom, jazz, pop, r&b, vocal,
  pianos)

  - Reverb impulses with crisp, clear, warm and dark variations

  - Sustain impulses

  - Linear db keyboard velocity

  - Proprietary linear db scaling

  - Keyboard scaling (100% acoustic to 45% compressed)

  - Variable tuning with floating just intonation

  - MIDI controller cc#16 support

  - Variable sustain pedal ready

  - Cc#64 sustain control

  - Footswitch support

  - Vst3 audio unit AAX



  - Laptop optimized
