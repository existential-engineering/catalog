description: A royalty free drum and FX library by Paradigm Theorem, collecting drum one shots, loops and FX risers and falls.
details: |-
  Behemoth is a drum sample library from Paradigm Theorem, the producer behind Cyborg Onslaught and Transcendent Trap. It collects close to 4,000 drum samples, all processed for a large, heavy character intended to cut through a mix.

  The drum loops run from 80 to 140 bpm and include many variations along with glitched fills and FX chains. There are 35 full drum and FX loop kits containing 735 mangled drum loops and FX chains.

  The FX section covers risers, enders, falls and one shots, plus a set of bonus atmospheric sounds.

  The one shot section is the bulk of the library: over 500 kicks, along with claps, saturated snares, hi-hats, cymbals and percussion, so full drum loops can be built from scratch. All sounds in the pack are royalty free.

  The library ships as 24-bit WAV files totalling 3.1 GB (2.38 GB compressed).
specs: |-
