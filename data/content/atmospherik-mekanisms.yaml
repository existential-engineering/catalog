description: Atmospherik Mekanisms is a collection of found sounds and processed
  sound effects crafted by martin eve aka 4th eden.
details: |-
  While working on atmospherik mekanisms, martin was inspired by various musique
  concrete techniques that were reused in a modern way, in a digital audio
  environment.

  The library is organized into nine categories, featuring a wide variety of
  content ranging from field recordings and found sounds to sampled analog
  instruments and digitally processed sound effects.
