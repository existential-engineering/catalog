details: |-
  Bites contains 3 Diva soundbanks for a total of 100 presets.

  Short bites contains 40 plucky presets mainly focused on electronic dance
  music. For all presets the bite filter of diva is a basic element that crafts
  the edged sounds.

  Medium bites contains 30 analog synth presets mainly focused on vintage styled
  electronic music. For all presets the bite filter of diva is a basic element
  that crafts the edged sounds. Also is some of them the beauty is hiding within
  the extreme detuning among their oscillators.

  Long bites contains 30 pad presets. For all presets the bite filter of diva is
  a basic element that crafts the edged sounds.

  Presets were designed with diva 1.4.4 (rev.9709) and run best with this or
  newer edition.
specs: |-
  - 3 Diva soundbanks
  - 100 presets total
  - 40 plucky presets (short bites)
  - 30 analog synth presets (medium bites)
  - 30 pad presets (long bites)
  - Bite filter
  - Oscillator detuning
  - Compatible with Diva 1.4.4 (rev.9709) and newer
