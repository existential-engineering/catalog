details: |-
  In arabic music, the oud is considered one of the oldest musical instruments; in fact, in the middle east it plays an important role in musical tradition. Although the origins of this instrument are uncertain, the popularity of the oud has spread across the mediterranean, north and east africa and the middle east, where it is still very popular to this day.

  The arabic e-oud library was created in close collaboration with the renowned musician and oud virtuoso bassam ayoub. Bassam ayoub performed and recorded all playing variations with the main emphasis on achieving an authentic sound, both for melodic playing and rhythmic accompaniment. Due to the built-in pickup, the characteristic sound of the e-oud gets a very special touch, which makes this instrument the perfect link between traditional oriental and western music.

  The arabic e-oud offers breathtaking 25 articulations with up to 20 velocity layers and 16 round robins and brings one of the oldest string instruments to life right under your fingertips. The versatile sound spectrum can enrich any kind of music and the integrated microtunings are very appealing to professional maqam performers!

  The user interface gives you access to the most important and commonly used microtunings of oriental music: bayati, rast, saba and seka. Each tuning offers two variants (normal and syriac church) as well as free choice of the root key. The keyswitches allow you to switch between the different playing techniques to create incredibly realistic performances. There are two types of keyswitches: latch and hold. While latch keyswitches remain active after the key is released, hold keyswitches remain active only as long as they are pressed and held by the player - after the key is released, the playing mode changes to the last selected latch keyswitch.

  The green MIDI song keys above the playing area provide short MIDI sequences which showcase the numerous playing possibilities of the arabic e-oud.
specs: |-
  - 25 articulations
