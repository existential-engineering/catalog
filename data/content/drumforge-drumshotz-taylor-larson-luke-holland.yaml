description: Producer/mixer Taylor Larson and YouTube star/session drummer Luke Holland have teamed up to bring you their best one-shot drum samples from all of their years working together. Taylor and Luke's Drumshotz pack features many powerful and versatile sounds which will inject excitement into your mixes.
details: |-
  One shot samples are powerful weapons for enhancing your drum mixes as they provide you with the extra punch and consistency you need to cut through any mix. Many professional mixers have highly coveted collections of one shot drum samples which are refined over years of mixing. This is how they achieve their signature drum sound no matter the quality of the source recording.

  DRUMSHOTZ is a series of highly coveted drum samples from professional mixers to enhance, blend, or replace drum sounds in your mixes. Inject heavy gainz into your drum mixes today with DRUMSHOTZ and experience a whole new level of punch, impact, and power.

  Producer/mixer Taylor Larson (Asking Alexandria, I See Stars, Periphery, and Within Temptation) and YouTube star/session drummer Luke Holland (Independent, Jason Richardson, The Word Alive) have teamed up to bring you their best one shot drum samples from all of their years working together.

  This all-star duo has built a well-deserved reputation in the music industry for their massive drum sounds transcending many different genres of music. Mix and match your favorite sample libraries or raw drum recordings with the Taylor Larson + Luke Holland signature DRUMSHOTZ today and discover a fresh take on your sound.
specs: |-
  - 34 samples total
  - 44.1 kHz, 24-bit WAV format
  - 11 Kick samples
  - 16 Snare samples
  - 7 Tom samples
  - One-shot signature drum sample collection
  - Compatible with any DAW or triggering program
  - Instant digital download
  - Perpetual license
