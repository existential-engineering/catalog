description: A 34-sample one-shot drum collection from producer and mixer Taylor Larson with session drummer Luke Holland, covering kicks, snares, and toms drawn from their years of work together.
details: |-
  Producer and mixer Taylor Larson (Asking Alexandria, I See Stars, Periphery, Within Temptation) and session drummer Luke Holland (Jason Richardson, The Word Alive) teamed up to assemble their best one-shot drum samples from all of their years working together. The duo has built a reputation for massive drum sounds that transcend many different genres of music.

  Drumshotz is a series of drum samples sourced from professional mixers, meant to enhance, blend, or replace drum sounds in a mix. One-shot samples give the extra punch and consistency needed to cut through, which is how professional mixers achieve a signature drum sound regardless of the quality of the source recording.

  The Larson and Holland pack focuses on powerful, versatile sounds that can be mixed and matched with existing sample libraries or raw drum recordings.
specs: |-
  - One-shot signature drum sample collection from producer Taylor Larson with drummer Luke Holland.
  - 34 samples total in 44.1 kHz, 24-bit format
  - For use with any triggering program or DAW
  - 11 Kick samples.
  - 16 Snare samples.
  - 7 Tom samples.
