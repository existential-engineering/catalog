details: |-
  The premier outfits 54 kit - single hits pack is a starter sample pack suited
  for people who do not require multiple velocity levels. This pack includes up
  to three velocities of each articulation and is ideal for working with drum
  machines. This pack contains all 32 articulations of the kit recorded and
  mixed to an extremely high standard.

  All the samples have been mixed from a combination of the individual drum
  microphones and where applicable the overhead and room microphones. You also
  have the choice between using two sets of samples, the original mix sample
  files, which are quite clean sounding, allowing you to process the sounds
  further yourself, or the alternative valve and tape mix samples which have
  been through an extra stage of mixing to give a bigger, dirtier, more
  aggressive sound.

  The premier outfits 54 kit is a classic british vintage 1963 drum kit. It was
  recorded in london, at miloco's the pool recording studio through vintage mic
  pre's and microphones. The original samples were mixed through a neve vr
  console with a ssl x-logic g-series compressor and a massenburg gml 8200
  parametric eq on the mix insert.

  The valve and tape samples were further mixed through an ssl 4056g+ console
  which had a manley variable-mu compressor on the mix insert, whilst they were
  also sent off in parallel to an ear 660 tube compressor. The samples were then
  also sent off to two urei 1176 compressors, again in parallel, which had the
  compression turned off, which adds a little solid state distortion to the
  valve distortion that was already coming from the ear 660. Then crucially the
  samples were printed to basf 900 1/2" tape, running on an ampex atr-102
  machine, running at 30ips.

  All of the samples are mixed from a combination of the overhead, room and
  close mics recorded as 24-bit 44.1 khz wav files, meaning they can be loaded
  into almost any sampler or drum machine. We have also included 16-bit samples
  in this pack for legacy drum machines. Included are 10 patches for some of the
  most commonly used software packages.
specs: |-
