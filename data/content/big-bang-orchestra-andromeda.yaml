description: "Bbo: andromeda is the first in a series of tutti orchestra
  expansion packs for the big bang orchestra."
details: |-
  Bbo: andromeda is the first in a series of "tutti" orchestra expansion packs
  for the big bang orchestra. Andromeda gives you all the articulations of the
  free big bang orchestra, newly and uniquely recorded with more sonic and
  expressive flexibility, along with many more articulations that were not
  included in the free version.

  To give you more freedom to modify your overall orchestra sound, the close mic
  positions of low strings, high strings, woodwinds, horns, trumpets and low
  brass can be adjusted separately in the integrated mixer of the synchron
  player. For the fortissimo low brass section, you can choose between an
  aggressive, bold sound and a softer, rounder tone. For more expedient
  orchestration, you can simply add or remove the high piccolo.

  The short notes of bbo: andromeda are even shorter than the ones included with
  the free version, with a very precise attack. This patch also includes
  optimized repetition notes that deliver extremely authentic results when
  playing repeated notes quickly. The long notes offer a variety of
  articulations, including espressivo, soft, sfz and sffz.

  The sforzatissimo patch reveals the especially awe-inspiring force of a large
  orchestra when every musician is playing on top of their lungs. The "dynamics"
  category includes two different lengths of crescendos. Vienna's new release
  sample technology adds the correct sound even when the crescendos are played
  shorter.

  Special articulations such as tremolos, flutter tongue, minor and major trills
  as well as half tone glissandos round out the articulations of big bang
  orchestra: andromeda.
