details: |-
  The Blue Triangle is a spring percussion instrument. When plucked with a
  finger, its sound can be round and at times a bit like a gong or church bell.
  But when applying different articulations, such as scraping with a plectrum or
  striking with rubber mallet, metallic, more industrial sound qualities emerge
  and rattle along with the Blue Triangle's natural spring reverb.

  In the blue triangle sample library for ni kontakt you will find: 3 octaves,
  covering 3 articulations and body hits. 3 round robin layers. 6 presets. 20
  short blips (MIDI clips). Rubber mallet strikes with 5 velocity layers.
  Plectrum scrapes. Finger plucks. Body hits. Installation size of the library:
  104 mb (.ncw compressed sound files).

  In the blue triangle sample pack for ableton live you will find: a drum rack
  with 40 pads, covering 3 articulations and body hits. 3 round robin layers. 6
  presets. 20 short blips (clips). Rubber mallet strikes with 5 velocity layers.
  Plectrum scrapes. Finger plucks. Body hits. Installation size of the pack: 258
  mb.

  Please note that blue triangle for kontakt does not work with the free kontakt
  player.
specs: |-
  - Spring percussion instrument
  - 3 octaves
  - 3 articulations
  - Body hits
  - 3 round robin layers
  - 6 presets
