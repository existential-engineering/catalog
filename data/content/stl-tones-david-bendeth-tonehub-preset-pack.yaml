description: "Multi-platinum award-winning record producer David Bendeth has
  joined forces with STL Tones to create his own personal Producer Tonehub Pack.
  Dubbed as the ‘Reel Sound Edition’, we used all of Bendeth’s go to guitar
  amp/cab/pedal/microphone setups in the creation of his bundle. We also used an
  Ampex ATR 102 1/2 inch reel to reel tape machine in the final stage of the
  Tracing process. Having done this, we feel that we have captured Bendeth’s
  revered guitar and bass sounds as accurately as possible. Bendeth’s pack
  contains 138 guitar presets and 14 bass presets."
