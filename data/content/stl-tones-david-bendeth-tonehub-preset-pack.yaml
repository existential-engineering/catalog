details: |-
  David Bendeth is a multi-platinum producer, mixer and songwriter whose work has shaped rock and alternative music for decades. He produced Paramore's Riot! and Bring Me The Horizon's Sempiternal , alongside records for Breaking Benjamin, Underoath, A Day To Remember, Papa Roach, All Time Low, Of Mice & Men, Killswitch Engage, Asking Alexandria, I Prevail and Beartooth. He works from House of Loud in Elmwood Park, New Jersey, the former Millennium Studios once owned by Whitney Houston.

  Dubbed the 'Reel Sound Edition', this pack was built using all of Bendeth's go-to guitar amp, cab, pedal and microphone setups, with an Ampex ATR 102 half-inch reel-to-reel tape machine used in the final stage of the Tracing process. The result captures his revered guitar and bass sounds as accurately as possible.

  Bendeth's pack contains 138 guitar captures and 14 bass captures.
