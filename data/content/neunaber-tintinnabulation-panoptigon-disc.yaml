description: A Panoptigon disc featuring several octaves of rhythmic bells,
  mastered at twice the usual rotation speed for extra high frequencies.
details: |-
  TINTINNABULATION consists of several octaves of rhythmic bells. We've mastered the sounds at twice the usual disc rotation speed in order to squeeze some extra high frequencies out of the sound ("Servo" mode), but you can also play it at half-speed ("Compu-drive" mode) or any other speed you like. As with all of our discs featuring rhythmically articulated scale tones, TINTINNABULATION is best used for playing sustained chords to produce rippling, arpeggiated patterns and textures. It's also great for playing in reverse for even more ambient effects. TINTINNABULATION is formatted to be played on PANOPTIGON, and while it is NOT directly compatible with Optigan or Orchestron, the disc will fit and play in those instruments, albeit with the sounds mapped incorrectly, and some sounds missing. Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility
