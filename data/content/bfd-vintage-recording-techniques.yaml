details: |-
  BFD Vintage Recording Techniques is an expansion pack for bfd3 that uses a
  variety of vintage microphone techniques to capture a beautiful ludwig classic
  maple drum kit. The result is a selection of familiar, authentic vintage
  sounds suitable for rock, pop, blues and more.

  Our engineers used world renowned drum recording techniques including ortf,
  glyn johns, and blumlein. Direct microphones were expertly placed on all kit
  pieces to ensure the pack has a wide range of mixing possibilities and can
  deliver authentic drum sounds from vintage to modern.

  For the ortf technique, 2 akg c451b mics were used. This gave a wide stereo
  image with excellent mono detail that is perfect for jazz tracks. A technique
  that has been used on countless rock records, the spaced pair setup featured 2
  akg c414 xls large diaphragm condensers, which created a wide stereo image
  exhibiting a huge palette of sonic colours.

  The blumlein technique used 2 ribbon microphones configured to give an
  excellent stereo image and a smooth sounding ambience. For the glyn johns
  technique, 2 neumann tlm103's were used for overheads, which when combined
  with the snare and kick direct channels provide that classic sound.

  An immensely detailed ludwig maple kit for bfd3. Each kit piece played with
  sticks and presented in a natural version. Perfect for vintage/modern rock,
  pop, funk, country, and blues.
specs: |-
  - 29 microphone channels
  - 5 vintage recording techniques
  - Ortf technique
  - Glyn johns technique
  - Blumlein technique
  - Spaced pair setup
  - Ludwig classic maple drum kit
  - Real drum bleed and drum resonance
  - Sticks and natural version for each kit piece
  - Presets included
  - Bfd3 v. 3.2.1.2 or above required
  - Windows 7 or above
  - Os x 10.9 or above
  - 16.7 GB disk space
  - Internet connection for download and authorization
