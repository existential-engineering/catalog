details: |-
  Analogue kick drum is a sample based virtual bass drum module for native instruments kontakt 5. The instrument features a custom scripted two-panel user interface providing direct access to all parameters of the sound engine.

  Two different versions of the instrument are included with the product (analogue kick drum and analogue kick edm), for generating classic drum machine style bass drums and modern edm style kicks.

  The generated kick drums are playable across two full octaves for easy matching to any key. The instrument supports up to 6 seconds of decay time for long 808 style sub bass sounds.

  62 different click samples are included with the product, along with 80 custom kick presets (+10 bonus presets) and 80 rendered kick drum samples in wav format.

  Full version of native instruments kontakt (version 5.3.1 or above) is required. Analogue kick drum will work in demo mode in kontakt 5 player.
specs: |-
  - Sample-based virtual bass drum module

  - Native instruments kontakt 5 compatible

  - Custom scripted two-panel user interface

  - Two instrument versions (analogue kick drum and analogue kick edm)

  - Playable across two full octaves

  - Up to 6 seconds of decay time

  - 62 custom click sounds

  - 80 factory patches with 10 bonus patches

  - 80 kick drum samples in 24-bit wav format

  - Direct access to velocity, gain, drive, distortion, pitch envelope, attack, decay, phase, fm, lp filter, hp filter, bitcrusher, sample reducer and transient shaper controls

  - Transpose via MIDI to any key

  - Kontakt 5.3.1 or above required

  - Works in demo mode in kontakt 5 player

  - No time limit in full version of kontakt
