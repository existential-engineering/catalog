details: |-
  Kellen McGregor is the guitarist, principal songwriter and founding member of American metalcore band Memphis May Fire, and has written and performed on every record the band has released. He is also their producer, taking sole production duties on Remade In Misery and Shapeshifter , and co-producing Challenger , Unconditional and Broken .

  Worked on closely in the studio with Kellen, this signature collection caters to all of his playing styles. The pack contains not only dual amp combinations but also dual cab combinations, which adds significantly to its dynamic range.

  Kellen's pack contains 50 captures, including album tone captures from the Memphis May Fire discography.
