details: |-
  Welcome to the AXXESS - POP Expansion Pack, a set of 40 meticulously crafted Pop patches designed exclusively for the GForce AXXESS synth. Explore a diverse sonic landscape ranging from the energetic bass of synth pop to the contemporary allure of modern pop.

  Discover the hidden depths within the simplicity of AXXESS with this patch collection. While AXXESS may appear straightforward, its sonic possibilities extend far beyond initial impressions. The patch set is crafted to enhance the inherent versatility of AXXESS, proving that a synth does not need complexity to be great and impactful.

  AXXESS stands as a testament to the belief that simplicity can coexist with depth: analogue richness and a fat, full sound, delivered without the complexity often associated with most synthesizers. This collection complements the AXXESS intuitive design by introducing a range of patches that unlock its sonic potential.

  The pack is only available to registered users of GForce AXXESS, and is exclusively available via the GForce website as a direct download via “My Instruments” once the purchase has been completed.
specs: |-
  - Patches: 40 pop patches
  - Host: exclusively for GForce AXXESS
  - Basses: 12 patches
  - Keys: 9 patches
  - Hits: 2 patches
  - Arpegs: 1 patch
  - Leads: 9 patches
  - Pads: 4 patches
  - Sequences: 3 patches
  - Delivery: direct download via “My Instruments” after purchase; requires a registered GForce AXXESS
