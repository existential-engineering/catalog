description: 450 drum grooves and fills in MIDI format performed by professional deathcore drummers, covering the crushing breakdowns, driving verses, and powerful choruses that define the genre.
details: |-
  Deathcore Grooves: Vol. 1 is a MIDI groove pack containing 450 drum grooves and fills performed by professional deathcore drummers. The collection covers the devastating breakdowns, driving verses, and powerful choruses that characterize the genre, along with a large set of fills.

  The performances are captured as MIDI files, so they can be used in any DAW or with any drum plugin, and they integrate directly with the Drumforge Classic, Bergstrand, and Savior samplers.

  Grooves are organized by individual song sections, so arrangements can be assembled quickly. The pack works as building blocks for writing new material or for refreshing existing demos, with dynamics and tempo adjustable to taste.

  It doubles as a practice or production reference, giving access to elite deathcore performances without hiring a session drummer.
specs: |-
  - 450 total drum grooves and fills performed by professional deathcore drummers
  - Covers crushing breakdowns, genre-defining verse patterns, and fills
  - MIDI files for use in any DAW or drum plugin
  - Integrates directly with the Drumforge Classic, Bergstrand, and Savior samplers
  - Grooves organized by individual song sections
  - Adjustable dynamics and tempo
