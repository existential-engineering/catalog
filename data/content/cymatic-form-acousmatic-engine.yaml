details: |-
  Acousmatic Engine is a distinct library of unusual sample instruments with unique sonic lusters, articulations and textures that shape concept and sound design into playable instruments across music and film genres. Including 500 surreal and thematic Kontakt instruments inspired by sci-fi noir, lovecraftian horror and steampunk sound worlds.

  Within the 3 stylistic themes (sci-fi noir, lovecraftian horror and steampunk), acousmatic engine offers 5 instrument types: aerophones (wind instruments and anything that vibrates with air pressure), friction (anything that acts as resistance of one object or instrument moving over another to produce sound, including bowing, scraping, and pad-like sounds), struck (instruments that are percussive such as bells, pianos or anything that is struck to produce sound or noise), soundscapes (sounds that may or may not be tonal and give a sense of environment or mood), and machines/movements (arpeggiator and sequenced driven patterns or other movements).

  Each instrument offers 8 channels of unconventionally sourced, dynamically layered samples plus 8 channels of multi-dimensional sampled synthesis. There are 3 pages of effects including shape, color and ambience. Quickly and easily sweep through combined effects such as spectral filters, distortion, modulation and spatial parameters using the visual xy effector display.

  6 macros allow you to assign any parameter for individual preference for finely tuned performance control. The warp wheel (the heart of acousmatic engine), allows you to store 3 variations of each instrument and record automation of movements transitioning effortlessly into new sonic dimensions. These variations greatly expanding the sonic depths of each sound, allowing them to breathe and come alive.

  Acousmatic engine by cymatic form is a virtual instrument audio plugin and a software application and soundware for macos and windows. It includes, and is therefore "powered by", kontakt player, which functions as an audio units plugin, a VST 3 plugin, an AAX plugin and a standalone application.
specs: |-
