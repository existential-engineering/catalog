details: |-
  Add-on for Rave Generator 3. If you're a fan of the legendary Juno series and own the Rave Generator 3, the Junorator Add-On is your ultimate upgrade. Please note: this add-on requires Rave Generator 3.

  The Junorator is a premium expansion that turns your Rave Generator 3 into a powerhouse of iconic Juno-inspired sounds. With over 300 meticulously designed presets and a library of 2,634+ high-quality samples, it's the perfect addition for electronic music producers seeking authentic, warm, and character-rich sounds from vintage hardware synths.

  This add-on upgrades Rave Generator 3 into a Juno-inspired sound design machine, ideal for techno, house, drum & bass, and more. Whether you're crafting lush chords or gritty basslines, the Junorator delivers a rich palette of sounds ready for your next track.
