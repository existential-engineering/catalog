description: Upgrade Rave Generator 3 to Junorator! 300 Juno-inspired presets and over 2,500 samples for bass, leads, and chords. Perfect for electronic music producers.
details: |-
  The Junorator is an expansion add-on for Rave Generator 3 that turns it into a Juno-inspired sound design machine. It requires Rave Generator 3, which is sold separately.

  The expansion delivers over 300 meticulously designed presets and a library of 2,634+ high-quality samples, aimed at producers seeking authentic, warm, character-rich sounds from vintage hardware synths.

  The sample content breaks down into more than 200 bass samples for deep, driving grooves, about 400 lead samples for soaring melodies, and nearly 2,000 chord stabs recorded to deliver the Juno stab sound.

  Audio Blast positions the add-on for techno, house, drum & bass and related electronic styles, covering both lush chords and gritty basslines.
specs: |-
  - 300 Juno-inspired presets for Rave Generator 3, including heavy Hoovers
  - Over 2,500 samples (2,634+), including bass, leads and chord stabs
  - More than 200 bass samples
  - About 400 lead samples
  - Nearly 2,000 chord stabs
  - Seamless integration with Rave Generator 3
  - Requires Rave Generator 3 to use this add-on
