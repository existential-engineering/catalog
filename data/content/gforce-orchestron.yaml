details: |-
  The OrchesTron is an expansion pack for M-Tron Pro featuring sounds from the rare 1970s Vako Orchestron, an optical playback instrument that offered a genuine charm and cinematic quality as an alternative to the Mellotron. Some sounds are derived from original Optigan masters and Paul Beaver compositions. The Orchestron was historically used by Yes and Kraftwerk.

  The pack contains 12 looped tape banks covering 8 original instrument categories — Cello, Choir, Flute, French Horn, Hammond B3, Pipe Organ, Saxophone, and Violin — plus 100+ M-Tron Pro patches.
