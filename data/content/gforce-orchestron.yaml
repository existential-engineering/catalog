description: 12 looped tape banks from the rare 1970s Vako Orchestron optical playback instrument for M-Tron Pro IV, used by Yes and Kraftwerk.
details: |-
  Initially developed by Opsonar, the same company behind the Optigan, the Orchestron was adopted by ex-Moog salesman David Van Koevering under the company name Vako and offered to professional musicians in the mid 1970s as a potential alternative to the Mellotron. The total number of Orchestron models manufactured is estimated at between 50 and 100, with around 40 thought to survive. The add-on pack includes 12 new looped tape banks and over 100 new M-Tron Pro patches.

  The instrument’s main advantages were no 8-second note limitation, increased portability due to its smaller size, and a quick way of changing sounds. Instead of bulky finite-length tapes, Orchestron sounds were stored on celluloid discs in a manner almost identical to the Optigan. Unlike Optigan discs, Orchestron discs contained no chords, effects or rhythmic motifs, only individual notes spread across a 37-note keyboard. Each disc held a single sound, and the initial library consisted of Cello, Choir, Flute, French Horn, Hammond B3, Pipe Organ, Saxophone and Violin.

  These sounds are best described as lo-fi, perhaps slightly higher in quality than the Optigan but not hugely so. It is rumoured that some Orchestron sounds came from original Optigan master recordings, and some were created by Paul Beaver, one half of the pioneering synth duo Beaver and Krause. Despite their lo-fi glory the sounds have a genuine charm and ciné-like quality that hits home when used alongside higher fidelity sounds.

  Several models were produced before the company folded a few years after the Orchestron debuted, and it was used by artists from Yes to Kraftwerk. Kraftwerk used an Orchestron Model A on Radioactivity and Trans Europe Express, and its successor the Model B was used by Patrick Moraz on his album Story Of I.

  OrchesTron is also available with new purchases of the M-Tron Pro Complete bundle, which includes M-Tron Pro IV and all the expansion packs, a 12.5 GB+ sound library with 525+ tape banks and 3700+ presets.
