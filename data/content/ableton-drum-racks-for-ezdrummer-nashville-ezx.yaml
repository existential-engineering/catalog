details: >-
  Ableton drum racks for ezdrummer nashville ezx features separate ableton drum
  racks for all factory presets for the toontrack ezdrummer nashville ezx
  expansion library. These racks are the most complete integration between
  ableton live and toontrack ezdrummer including a host of features ready to use
  on ableton push.


  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all nashville kit factory presets from ableton push
  controller device browser. All instrument articulations ready to go in one
  layout using ableton push 64 pad layout mode.


  All our racks use consistent drum rack coloring so you can visually and
  immediately spot your snares from your crashes. Individually labelled drum
  rack pads for clear visualisation, post performance editing and automation to
  all drum rack / instrument articulations in ableton.


  Ableton macros mapped to toontrack ezdrummer macros with preset values for
  ease of use in push and simple to use automation programming. Ableton macros
  are color coded to match the ezdrummer display. Track level audio mixing
  control in ableton.


  Use the template racks and extend to your own toontrack ezdrummer nashville
  ezx presets, swapping out individual sounds or articulations. You are 100%
  ready to go with the factory presets but there is no limitation to creating
  your own presets from these templates.
specs: |-
  - 26 ableton drum racks
  - 13 ableton live templates
  - Ableton push 64 pad layout mode
  - Color coded pad design
  - Individually labelled drum rack pads
  - Ableton macros mapped to toontrack ezdrummer macros
  - Singleout presets with single audio output
  - Multiout presets with multiple audio channel output
  - Track level audio mixing control
  - Ableton live 9.5 or above
  - Toontrack ezdrummer2 required
  - Nashville ezx expansion library required
  - Macos and windows compatible
