description: A boutique synth and a conceptual marriage between rich, grungy
  digital waveforms and classic virtual analogue structure.
details: |-
  A boutique synth and a conceptual marriage between rich, grungy digital waveforms and classic virtual analogue structure. The grungy digital waveforms are sampled from a nebulaphone v2 and this means raw tone with huge basses and sweet degraded highs, desirable movement, aliasing and noise.

  The virtual analogue structure begins with two tunable oscillators, each with: five waveforms (square/triangle/saw/sine/fm), choice between 24db lowpass filter and vowel filter, three envelopes (amplitude/filter/pitch), three lfos (sine/triangle/square/saw/random), velocity controls (amplitude/filter).

  The sounds can be enhanced with four masterfxs (pedal-style distortion/phaser/chorus/echo) and can be played in polyphonic, monophonic and monolegato modes.

  Despite the limited keyrange, artifunkt can cover many roles, from basses to pads through tons of keyboards. The solid, massive sound, the digital artifacts and the effective soundshaping options will provide tasty reinterpretations of classic patches, fresh material and a touch of sophisticated lo-finess for dirt cheap.

  Two-osc synth with sampled waveforms for kontakt 4.2.3 or newer versions with automatable controls, MIDI-learn, multi-tabbed interface with quick tweaks section, and 50 categorized presets (basses-fxs-keys-leads-pads).
specs: |-
  - Two tunable oscillators
  - Five waveforms (square/triangle/saw/sine/fm)
  - 24db lowpass filter
  - Vowel filter
  - Three envelopes (amplitude/filter/pitch)
  - Three lfos (sine/triangle/square/saw/random)
  - Velocity controls (amplitude/filter)
  - Four masterfxs (pedal-style distortion/phaser/chorus/echo)
  - Polyphonic mode
  - Monophonic mode
  - Monolegato mode
  - Kontakt 4.2.3 or newer
  - Six octaves range (extended to eight)
  - 156 24-bit 44100hz files
  - Adsr envelopes
  - Automatable controls
  - MIDI-learn
  - Multi-tabbed interface
  - 50 categorized presets
