description: BFD Oak Custom is an expansion pack featuring a stunning Yamaha oak
  drumkit for your bfd3, bfd eco or bfd2 installation.
details: |-
  Bfd oak custom's toms are played with sticks, mallets and hotrods for extra
  versatility and the kick is played with 2 beater types.

  The sounds are full of body and devastating low end and also include a
  reduced-detail yamaha bamboo snare from bfd signature snares vol.1 and even
  bonus samples of the original yamaha drum cases being struck.

  Bfd oak custom is recorded in similar studio conditions to bfd percussion,
  other fxpansion yamaha-based expansions such as bfd jazz maple and the
  mapleworks kits in bfd3.
specs: |-
  - Yamaha oak custom kit
  - Yamaha bamboo snare
  - Toms with sticks, mallets and hotrods
  - Kick with 2 beater types
  - Bonus drum case samples
  - Compatible with bfd3, bfd eco, bfd2
  - Windows 7 or above
  - Os x 10.8 or above
  - Bfd3 v. 3.2.1.2 or above
  - 23 GB disk space
  - Internet connection for download and authorization
  - SSD recommended
