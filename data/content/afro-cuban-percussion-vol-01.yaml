details: |-
  Earthmoments presents afro-cuban percussion vol. 01, an extensive collection of rhythms and grooves originating from the caribbean island of cuba. The island's rich history has LED to the melting pot of african, taíno, and spanish musical traditions.

  The results are energetic rhythms such as tumbao, bembe, nanigo, nyabinghi and many more which are all featured throughout this expansive pack.

  This pack includes a wide variety of samples in a range of tempos and styles featuring the congas, cajón, bongos, claves, shaker, and cowbell, performed by professional afro-cuban percussionist, idan k.
