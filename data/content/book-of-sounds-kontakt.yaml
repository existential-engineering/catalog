details: |-
  The book of sounds VST library has 5gb of every sound and fx you will need to
  make hits all year. Instruments include: tuned 808s, arpeggiations, bass,
  bells, brass, choirs, guitars, hits, pianos, leads, pads, plucks, & strings.

  Effects include: adsr controls, filter controls, lfo, gate, glide, distortion,
  eq, chorus, flanger, phaser, delay, reverb, & arpeggiator.

  Book of sounds comes with a drum kit. Over 100 items... 808s, claps, snares,
  kicks, fx, percussions, & vox.

  Book of sounds (kontakt) by bigwerks is soundware (samples or presets that
  load into other products) for macos and windows.
