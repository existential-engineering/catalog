details: |-
  A set of 40 meticulously crafted Hip Hop patches designed exclusively for the GForce AXXESS synthesizer. Explore a diverse sonic landscape ranging from fat low-end analogue bass to melodic and catchy leads.

  While AXXESS may appear straightforward, its sonic possibilities extend far beyond initial impressions. This patch set is crafted to enhance the inherent versatility of AXXESS, proving that a synth doesn't need complexity to be both great and impactful.

  Available as a direct download via My Instruments after purchase. Only available to registered GForce AXXESS users.
