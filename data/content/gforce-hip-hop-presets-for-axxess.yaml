details: |-
  Welcome to the AXXESS - Hip Hop Expansion Pack, a set of 40 meticulously crafted Hip Hop patches designed exclusively for the GForce AXXESS synth. Explore a diverse sonic landscape ranging from Fat Low-End Analogue Bass to Melodic and Catchy Leads.

  Discover the hidden depths within the simplicity of AXXESS with our Patch Collection. While AXXESS may appear straightforward, its sonic possibilities extend far beyond initial impressions. This patch set is crafted to enhance the inherent versatility of AXXESS, proving that a synth doesn't need complexity to be both great and impactful.

  AXXESS stands as a testament to the belief that simplicity can coexist with depth. Experience the analog richness, the fat and full sound, all delivered without the complexity often associated with most synthesizers. This collection complements AXXESS's intuitive design by introducing a range of patches that unlock a world of sonic potential, offering a seamless blend of simplicity and depth for your musical exploration.
specs: |-
  - 40 meticulously crafted Hip Hop patches
  - Exclusively for GForce AXXESS
  - 10 Leads patches
  - 9 Basses patches
  - 6 Sequences patches
  - 4 Keys patches
  - 1 Percussion patch
  - 3 Effects patches
  - 1 Arpegs patch
  - 2 Pads patches
  - 4 Textures patches
  - Only available to registered users of GForce AXXESS
  - Delivered as a direct download via "My Instruments" once purchase is complete
