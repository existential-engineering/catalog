details: |-
  Chimera features 803 designed sound effects inspired by uninhabitable realms, paranormal entities and creatures from the void of space.

  Chimera comes with 5GB of 24bit 96kHz .wav audio content, which has been meticulously crafted to complement music, game and multimedia productions in need of sophisticated, forward-thinking sound effects.

  Featuring some of our darkest and most disturbing material to date, Chimera is focused on a unique hybrid of sci-fi horror and technical monster sound effects. You will find demonic vocalizations, haunted atmospheres, mutated creatures, cursed ghosts and extraterrestrial drones that will wake the dead.

  While our sound effects are carefully designed to work with your favorite samplers and DAWs, they pair up particularly well with our own brand of audio contortion devices. Our wide selection of packs grant Palindrome, Polygon, Cataract and Tactic users access to thousands of fresh ingredients.
