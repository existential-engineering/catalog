details: |-
  BFD Signature Snares Vol.2 is the second instalment of Yamaha artist signature
  snares for bfd3, bfd eco and bfd2 - 5 detailed and immaculately recorded
  snares with varied beater types to swap into your kits.

  The snares are captured in similar conditions to the bfd jazz & funk and bfd
  percussion expansions as well as those used for the mapleworks kits in bfd3.

  The sounds work well with any combination of other bfd library sounds,
  offering a punchy and upfront sound with dynamic playability.

  When used in bfd3 and bfd2, the snares offer an additional 'rim click'
  articulation as well as a 'half-edge' for use with electronic drum positional
  sensing.

  Minimum requirements: windows 7 or above (windows), os x 10.8 or above (mac),
  bfd3 v. 3.2.1.2 or above, internet connection for download and authorization.
  Recommended: ssd. Disk space requirements: 23 gb
specs: |-
  - 5 detailed and immaculately recorded snares
  - Varied beater types
  - Rim click articulation
  - Half-edge articulation
  - Electronic drum positional sensing
  - Dynamic playability
