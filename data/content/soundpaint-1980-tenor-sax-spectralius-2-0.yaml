details: |-
  Update: Spectralius Saxophone is now 2.0. The update contains over a dozen new Programs. Complete redesign of the Layout, Tips and Keyboard Labels. Utilizing all the newest features (including Color, Block, Ensembles) of Soundpaint 3.0. Watch what's inside the Spectralius 2.0 update here

  We designed the Spectralius Tenor Saxophone with realism in mind, down to the smallest details. From the airy spittles of the lower dynamics to fluent polyphonic legatos powered by our new Hyper Acoustic Legato (H.A.L) Technology. Spectralius contains 78 Deep-Sampled Tenor Sax Parts, including many dozens of Arcs, Short Notes, Sustain and Performance-based articulations. The goal is to offer a library so deep and so realistic. That most won't be able to tell if it was sampled or live. The underlying technology powering Spectralius is our new H.A.L (Hyper Acoustic Legato) Technology. H.A.L offers total instrumental realism with seamless polyphonic legato. Play from a single-note melody into a full ensemble at any time. Play counter-point. Play Wild and Jazzy. Just play it like a piano and H.A.L takes care of the rest.
