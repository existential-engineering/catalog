details: |-
  Boost your ableton toolset with the fantastic analogue filters rack pack. This pack consists of ten audio effect racks based on real boutique hardware filters from the minimal system instruments studio.

  If you are looking for the sound of true analogue filtering from directly within ableton live then this pack is for you. The included racks add creative filtering tools to your ableton live audio effect racks library.

  There are no simple low/hi/band pass filters contained within this pack but creative filters full of analogue character.

  This pack requires a pc or mac running ableton live. The product has been tested on versions 7 and 8 without issue.
specs: |-
  - Audio effect racks
  - Analogue echo filter
  - Analogue glitch filter
  - Analogue grain filter
  - Analogue liquid filter
  - Analogue low pass filter
  - Analogue oracle filter
  - Analogue repeater filter
  - Lo-fi filter bank
  - Pitch filter bank
  - Worn analogue filter
  - Ableton live audio effect racks library
  - Pc or mac compatible
  - Ableton live versions 7 and 8
