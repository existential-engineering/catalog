details: |-
  Sizzling Sitar Sensations

  Embark on a new musical odyssey with the Soundpaint Sitar. Experience the exotic, captivating sound of this stunning instrument, with its intricately carved body and resonating strings. Deep Sampled with precision and love, the Soundpaint Sitar offers a versatile range of tones that are sure to inspire. We deep sampled many techniques for the Sitar, from short and sustained plucks to resonance string sweeps, harmonics and ornaments, and a large compendium of bends. In all, there are 40 p(articulations) for you to choose from. The more straightforward plucks are great for creating rich melodies and harmonies, and the ornaments and bends are a wonderful way to instantly breathe life into the sound. Then there are the more specialized programs, like the ethereal harmonics and the never-ending Cascades. This instrument can produce so many unique tones and colors that it would be impossible to describe them all. You really have to experience it for yourself, and we are sure you will find inspiration in all the fine details this instrument has to offer.
