details: |-
  Analog Trap is an exclusive hybrid 3 expansion pack featuring synthesizer
  presets designed for trap music production. The pack includes thick, submerged
  basslines and edgy, rhythmic synth grooves to spooky, haunting analog arps and
  leads.

  Beneath that brazen sub-bass and riding high above those head-knockin' 808
  kicks, synths are a major player in the sound of trap. The expansion delivers
  heavy high-end frequencies with electronic bite inspired by producers like
  dillon francis, trapzilla, baauer, luminox and rl grime.

  Analog trap is soundware (samples or presets that load into other products)
  for macos and windows.
specs: |-
  - Expansion pack for hybrid 3
  - Trap synthesizer presets
  - Sub-bass sounds
  - 808 kick sounds
  - Synth grooves
  - Analog arps
  - Synth leads
  - High-end frequencies
