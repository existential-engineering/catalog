description: Art Pyrite-K is a virtual instrument based on art pyrite VST
  synthesizer. This unique virtual instrument includes most features of the VST.
details: |-
  Art Pyrite-K is a virtual instrument based on art pyrite VST synthesizer. This
  unique virtual instrument includes most features of the VST version and also
  some additional options. You can create custom sound presets easily by using
  the "random" feature which can be used for all sound sources (oscillators) as
  well as for a special step sequencer.

  Art pyrite-k includes variable space atmospheres, pads, ambient atmospheres,
  sound effects & rhythmic and melodic sequences sorted in three sound
  categories. About 1/4 of all sound presets are identical with sound presets of
  VST version. Another presets are new.

  All samples are looped. The special polyphonic 16-step sequencer has the
  option to route the MIDI output to any oscillator, the pair or to all
  oscillators. Nine modulation slots with the free or synchronic modulation for
  all filters, mixing and panorama for each pair of oscillators.

  One section option with the master limiter and possibility to set the velocity
  sensitivity and pitch bend range for the live playing. Three "random" buttons
  for the exchange of all waveforms at all oscillators and the randomly setting
  at volume level & pitch shift at all steps in a step sequencer.

  Three preset categories (+bonus) include 555 sound presets in the format nki
  and nksn (snapshot). The download link includes three smaller rar archives for
  easier download.
specs: |-
  - Four sound sources (oscillators) based on samples
  - Oscillators 1 & 2 powered by 24 basic multisampled waveforms
  - Oscillators 3 & 4 powered by 256 single waveforms
  - Two filters 24db LP and HP (selectable) for oscillators 1 & 2
  - One multi filter 12db LP/HP for oscillators 3 & 4
  - Two amplitude ADSR-style envelope generators
  - Two filter ADSR-style envelope generators including the envelope amount
  - Two units EQ 2-band
  - Chorus effect unit for oscillators 3 & 4
  - Delay effect unit with free or synchronic echoes
  - Subdelay section for echo control and sound positioning
  - Stereo effect unit for all oscillators
  - Reverb effect unit for all oscillators
  - Torsion effect unit for all oscillators
  - Polyphonic 16-step sequencer with adjustable step count
  - MIDI output routing to oscillators
  - Nine modulation slots with free or synchronic modulation
  - Master limiter
  - Velocity sensitivity control
  - Pitch bend range control
  - Three random buttons for waveform exchange
  - 555 sound presets in nki and nksn format
  - Compatible with Kontakt 5.42 or above (full version only)
  - Total size 274 MB
  - Free restricted demo with 30 sound presets
