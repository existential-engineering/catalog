details: |-
  Metalcore Grooves: Vol. 1 is a MIDI groove pack containing 419 drum grooves and fills performed by Sam Landa of Conquer Divide. The collection covers the feels that define metalcore, from verse and chorus patterns to breakdowns and fills.

  The performances are supplied as MIDI files for use in any DAW or with any drum plugin, and they integrate directly with the Drumforge Classic, Bergstrand, and Savior samplers.

  Grooves are organized by individual song sections, which makes it straightforward to build a full arrangement or to refresh an existing demo. Dynamics and tempo can be adjusted to fit the track.

  The pack also serves as a practice and production tool for writing in the genre.
specs: |-
  - 419 total drum grooves and fills performed by Sam Landa (Conquer Divide)
  - Covers the core feels of metalcore
  - MIDI files for use in any DAW or drum plugin
  - Integrates directly with the Drumforge Classic, Bergstrand, and Savior samplers
  - Grooves organized by individual song sections
  - Adjustable dynamics and tempo
