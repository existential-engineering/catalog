description: Over 400 designed sounds of computer interfaces, noises, glitches, alarms, bleeps, processing, loading, interaction, malfunction, access, and 8-bit effects, provided by SoundBits.
details: |-
  The Computer Sound FX 2.0 Bundle for Reformer contains over 400 designed computer interface, noise, glitch, alarm, bleep, processing, loading, interaction, malfunction, access, and 8-bit sound effects. From simple select and confirm sounds to more complex loops and processing one shots and alarms, you will find a large and composite collection of sound effects to give your interface or animation the right sonic treatment.

  This library was built specifically for use with Reformer and Reformer Pro, plugins that recompose audio into dynamic, responsive, and highly realistic sound design instantly. An iLok is required for the integration installers.

  Sound categories included in this library: Alarms, Glitch, 8-Bit, Loading.

  Sound effect keywords: Mechanical, Computer One Shots, Alarms, Glitch Malfunction, Loading Processing, Retro 8-bit.
specs: |-
  - 875 Sound Files
  - 892 MB Size / 1.82 GB Reformer Pro integration
  - 24 bit / 96kHz High-Quality WAV Files
  - 100% Royalty-Free Commercial License
  - Embedded Metadata
  - 6 Reformer Pro Sound Packs
  - Contains two downloads: a zip file of all source sound effect asset files with Metadata PDF, and an installer for the integrated Reformer Pro library
