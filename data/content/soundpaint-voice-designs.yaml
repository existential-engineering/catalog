details: |-
  Human Voice. Hybrid Cinema. Prepare to be captivated by a brand-new collection of hybrid effects created from the human voice, encompassing percussion, rhythmic 808's, whispers, moans, and beyond. With 10 banks of effects, Hybrid Voices explores familiar categories with innovative approaches. While we've all experienced hybrid downers and risers, the addition of the human voice introduces an extra layer of enchantment. Experience the growling vocal chords, resonating nasal hums, and the subtle escape of air from the lungs. Ever encountered an 808 drum machine created from the human voice? It's a sonic encounter that lingers in your memory, boasting the punch of analog hardware infused with an unmistakable human touch. Discover the distinctive noise cymbals, offering a novel kind of percussive punctuation, sitting somewhere between a crash cymbal and a heartfelt sigh. From earth-shaking booms to captivating body percussion, the arsenal of sounds within Voices Designs provides ample ways to make a lasting impact in your compositions.
