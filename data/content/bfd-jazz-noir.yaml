details: |-
  The BFD Jazz Noir expansion pack captures a rare, vintage camco 'oaklawn' drum
  kit for bfd3. Perfect for all genres of jazz, funk and neo-soul, camco drums
  are sought after by players and collectors alike for their clarity of tone and
  warm sustain. This kit was tuned medium-high and recorded with sticks and
  brushes. The collection comes with a set of istanbul cymbals including a
  beautiful 24" ride plus a 1930s round badge gretsch snare drum, offering a low
  and fat alternative to the camco kit snare.

  An immensely detailed 1962 camco drum kit played with sticks and brushes. A
  20" kick drum captured in four different ways (inc. With damping). The
  original camco kit snare and a vintage gretsch snare drum. A set of istanbul
  cymbals. Fully dynamic kit ready for processing. 5 kit presets to inspire your
  creativity.

  Our engineers used an array of high-quality microphones to capture direct and
  ambient signals for bfd jazz noir. The kick drum was recorded dampened and
  fully open, with an oktava mk220 inside the drum and neumann tlm 103 outside
  the head. Both snares were recorded with wires on and off using an avantone
  ck-1 on top and a rde nt5 condenser mic underneath. Se electronics 3
  microphones were used on the toms, picking up the snare wires for a natural
  kit sound or with the option of no wires for a cleaner timbre.

  This expansion also introduces a new articulation popular in jazz playing the
  stickshot. A set of istanbul cymbals were recorded using a pair of akg c451bs
  as overheads. Ambient mics include a pair of golden age project r1 (room), an
  aea r84 ribbon mic (mono room), as well as a special trash mix channel to add
  some saturation to your drum-tracks.
specs: |-
