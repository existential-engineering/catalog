description: This OneShot2 expansion is built for aggressive electronic music,
  from driving industrial techno to choppy minimal techno. Every slot comes with
  velocity layers and round robins for complete dynamic control, and a mix of
  motion and normal slots to play with.
details: |-
  This OneShot2 Expansion is built for aggressive electronic music, from driving industrial techno to choppy minimal techno. Expect distorted kicks, metallic percussion, gritty snares, energetic melodic sounds and sharp transient hits that thrive in dark, high-energy productions where every element needs to cut through a dense mix.

  Every one-shot comes with velocity layers and round-robins, so hits stay expressive and alive instead of sounding machine-gunned when repeated. Use them as they are, layer them together or chop them up to fit your track.

  The pack mixes normal slots for straightforward, ready to play hits with motion slots. This is where OneShot2's motion engine lets you shape and animate a sound in real time, turning a flat drone into an evolving texture that breathes with your track. Sweep filters morph between layers or automate movement across a build-up, and watch your track transform into living shifting elements that feel custom-built for the moment.

  Use it for a relentless industrial techno track, a stripped-back minimal groove, or simply when you need a sound that cuts through the mix. The rest is up to you.
specs: |-
  - 20 presets
  - 66 slots
  - Over 3700 samples
  - Velocity layers and round-robins on every one-shot
  - Mix of normal slots and motion slots driven by the OneShot2 motion engine
  - Requires a license of OneShot2
  - macOS and Windows
