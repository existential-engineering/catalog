details: |-
  ACID – TRANCE – TECHNO Vol. 3 is a collection of 256 high-quality loops and matching MIDI files aimed at modern electronic music producers. The pack is built from the original sequences of the ABX3 presets, including content drawn from Trance Presets Vol. 4 and Techno 90 Vol. 1, so the material is authentic to the Acid, Trance and Techno styles it is named for.

  Every loop is synced and production-ready, so it can be dragged and dropped straight into a DAW session. Because each WAV loop ships with a matching MIDI file, tempo, notes and instrumentation can all be changed after the fact rather than being locked into the rendered audio.

  The contents cover acid sequences, trance melodies and arpeggios, and techno basslines and riffs, all inspired by the ABX3 sound design. The vendor positions the pack for acid techno, trance, hard techno, psy / goa, and rave / oldschool productions.

  The WAV loops are 24-bit and four bars long, and the MIDI files are universal format, so the pack works with all major DAWs including Ableton Live, FL Studio, Logic, Cubase, Studio One, Pro Tools and Reaper. The pack is delivered as an instant download after purchase.
specs: |-
  - 256 WAV loops (4 bars each)
  - 256 MIDI files, one matching each loop
  - Acid sequences
  - Trance melodies and arps
  - Techno basslines and riffs
  - Derived from the original ABX3 preset sequences (Trance Presets Vol. 4, Techno 90 Vol. 1)
  - WAV: 24-bit
  - MIDI: universal format
  - Compatible with all DAWs (Ableton Live, FL Studio, Logic, Cubase, Studio One, Pro Tools, Reaper)
  - Instant digital download
