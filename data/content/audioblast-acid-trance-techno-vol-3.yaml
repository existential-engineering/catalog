details: |-
  Take your productions to the next level with ACID - TRANCE - TECHNO Vol. 3, a powerful collection of 256 high-quality loops and MIDI files designed for modern electronic music producers.

  This pack is built from the original sequences of the ABX3 presets, including content from Trance Presets Vol. 4 and Techno 90 Vol. 1. As a result, you get authentic, ready-to-use material inspired by Acid, Trance, and Techno styles.

  Every loop is perfectly synced and production-ready, so you can drag and drop directly into your DAW and start creating instantly. The matching MIDI files give full flexibility over tempo, notes and instruments.

  The pack suits Acid Techno, Trance, Hard Techno, Psy / Goa and Rave / Oldschool productions, and works with all DAWs including Ableton Live, FL Studio, Logic and Cubase.
specs: |-
  - 256 WAV loops (4 bars)
  - 256 MIDI files (matching each loop)
  - Acid sequences
  - Trance melodies and arps
  - Techno basslines and riffs
  - Inspired by ABX3 sound design
  - WAV: 24-bit high quality
  - MIDI: universal format
  - Compatible with all DAWs (Ableton, FL Studio, Logic, Cubase)
