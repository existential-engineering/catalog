description: A powerful SFX pack created by sound designer and sound effects recordist Barney Oram, packed with 3.8 GB of explosive recordings including black powder, C4, detcord, semtex and TNT.
details: |-
  The Explosions Sound Effects Library is a powerful SFX pack created by Barney Oram, sound designer and sound effects recordist (Sweet Justice Sound, Demon's Souls, Returnal, The Ascent). This sound effects library comes packed with 3.8 GB of explosive material including black powder, C4, detcord, semtex and TNT.

  The library includes 29 Weaponiser presets that bring inspiration to a project instantly. Weaponiser can perform and trigger thousands of pre-designed variations of explosions straight out of the box and directly in a session. The library also features a huge range of multi-mic'd sound recordings plus designed sweeteners.

  Mix, edit, process and sync explosive SFX using Weaponiser, or use the 388 sound files in a traditional sound design workflow.

  Explosives used in the recordings include black powder 500 x 1, C4 (3 sticks) 375g, C4 (1 stick) 125g x 2, detcord 12g x 5, semtex 250g and 1000g, and TNT from 250g to 1000g. Microphones used include AKG D112, Sennheiser MD421, Shure SM7B and SM57 pairs at 20m, DPA 4007 at 25m, Neumann 191 MS and Crown SASS at 40 to 50m, and Sennheiser MKH 8020, 8040 and 8060 pairs out to 150m, with Sony M10 at 200m and Tascam DR05 at 300m.

  Sound categories included are Explosions, Impacts, Military, Artillery, Warfare and Battle. The purchase contains a zip file of all source asset files with a Metadata PDF plus an installer for the integrated Weaponiser library (iLok is required for the integration installers).
specs: |-
  - 388 sound files
