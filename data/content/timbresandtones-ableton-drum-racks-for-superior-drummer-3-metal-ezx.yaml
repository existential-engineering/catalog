details: |-
  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all metal! Ezx factory presets from ableton push
  controller device browser.

  6 ableton drum racks to instantly load the factory library "mix ready" presets
  with ableton mappings. 3 ableton live templates designed to host the multi
  channel output routing presets with track level audio routing from superior
  drummer 3 into ableton live.

  Colour coded pad design for visual performance and finger drumming. All our
  racks use consistent drum rack colouring so you can visually and immediately
  spot your rides from your hi hat articulations. Vast array of instrument
  articulations ready to go in one massive layout using ableton push 64 pad
  layout mode.

  Ableton macros mapped to toontrack superior drummer macros with preset values
  for ease of use in push and simple to use automation programming. Singleout
  presets 3 ableton drum racks for all metal! Factory presets single audio
  output to a single ableton track. Multiout presets featuring 3 ableton drum
  racks for all metal! Ezx presets in multiple audio channel output from the
  plug in to multiple ableton audio tracks using the 3 multi output ableton
  templates also provided designed for the kit presets.
specs: |-
  - Ableton drum racks
