details: |-
  64 presets for the Reveal Sound Spire synthesizer, aimed at current Progressive House and EDM, including hand-crafted basses, leads, arps, pads and synths.

  Each preset is programmed by a professional sound designer, with every parameter tweaked in detail, as a source for creating new and commercial sounds within a composition.

  The sounds can also be used for genres like Deep House, Future House, Pop, Trap and Dance.

  In addition, 42 MIDI files taken from the demo are included.

  Please note: the drums, piano and guitar loops and FX used in the demo are not included in this product. They are found in 'Festival Ammo Vol 3'. These presets require v1.0.20 or higher of Reveal Sound Spire.
specs: |-
  - 64 Presets for Spire
  - 20 Basses
  - 20 Leads
  - 10 Synths
  - 5 Pads
  - 5 Plucks
  - 3 Arps
  - 1 FX
  - Mod wheel assignment
  - 42 MIDI files
  - Multi-genre
  - PC/Mac Compatible
  - 100% Royalty-Free
  - Requires Reveal Sound Spire v1.0.20 or higher
