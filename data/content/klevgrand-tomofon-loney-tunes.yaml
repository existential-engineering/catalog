details: |-
  Loney Tunes is a Tomofon Expansion Pack (an "Audio Model Pack") built around the instruments and sounds mostly played by Emil Svanängen, also known as Loney Dear. It includes sounds that often appear in Loney Dear's music, such as piano, flute, clarinet, violin, saxophone, and voice. There is also an instrument based on an old analog drum synth (Blackhawk) and one based on field recordings of construction sites (Chaos).

  The pack deliberately keeps the character of its sources rather than smoothing it out. As Emanuel Lundgren puts it: "Instead of creating perfect, natural-sounding instruments, we have included all the grit, noise, and randomness. Perfect stuff for drones and ambient music. To quote Donna from Twin Peaks: 'It's like having the most beautiful dream... and the most terrible nightmare, all at once.'"

  The pack came out of a collaboration between Klevgrand, Loney Dear and Emanuel Lundgren, founder of the band I'm from Barcelona. Emil and Emanuel were working on a new album and began exploring Tomofon and the possibilities of MPE, and that collaboration resulted in the Loney Tunes Audio Model Pack.

  It contains 10 Audio Models and 35 Patches, and takes 79.5 MB after install. A Tomofon license is required: the pack can be loaded into both the desktop version and the iOS version of Tomofon.
