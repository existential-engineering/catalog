description: A professional collection of metal impact and metal friction sound effects recorded at 96kHz/24-bit. Created using unconventional techniques, from rosined cello bows applied to drum cymbals, sheet metal, and other surfaces, to heavy rusty cabinets and furniture dragged across abrasive floors, and wheelbarrows scraped over concrete. The result is a wild, raucous cacophony of metal sound effects suited to destruction, cinematic, and industrial sound design.
details: |-
  From Silverplatter Audio, this is a collection of metal impact and metal friction sound effects, recorded at 96kHz/24-bit to capture the most meticulous details. Silverplatter Audio went wild when recording this library, using a rosined cello bow on everything from drum cymbals to sheet metal, dragging heavy, rusty cabinets and furniture across abrasive floors and scraping wheelbarrows over concrete.

  The resulting library is a wild, raucous cacophony of metal sound effects which will fill your audience with enough adrenaline to make their blood run cold.

  This massive metal impact and friction SFX library is ready to go out of the box and also includes Weaponiser and Reformer Pro integration. After installation, these sounds are added to your libraries inside the Krotos plugins, affording you new, malleable sounds from pre-existing files in ways unachievable otherwise.

  Sound categories included in this library: Destruction, Metal, Impacts, Friction, Drops, Explosions, Blast, Wreckage, Junkyard, Cinematic, Drones.
specs: |-
  - 758 Sound Files
