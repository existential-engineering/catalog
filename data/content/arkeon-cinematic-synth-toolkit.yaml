description: Arkeon is a cinematic synth toolkit featuring over 206 master
  crafted presets for Xfer Serum, with rhythmic and melodic presets for Serum FX
  and workflow tools for Logic Pro X and Cubase.
details: >-
  Arkeon is a cinematic synth toolkit currently containing over 206 master
  crafted preset programs for xfer serum v1.237+. It offers a rich variety of
  sonic inspirations and a high level of customizability, easily accessible
  through velocity, mod and some unique usage of serum's macros.


  For the first time ever, arkeon features +25 custom made rhythmic and melodic
  presets for the serum-fx plugin, allowing you to transform your sound sources
  and kontakt instruments via MIDI notes, like never before.


  Arkeon 1.3 comes with our popular, fully documented logic pro x toolkit, which
  features 30 advanced MIDI transform presets and custom automation lane sets to
  supercharge your workflow.


  Cubase users also receive a custom production template for quick setup of our
  serum+fx presets.


  Arkeon 2.0 is a multi-synth toolkit which will bring a total of +700 high
  quality multi-synth presets.
specs: |-
  - 206 master crafted preset programs for xfer serum v1.237+
  - Velocity control
  - Mod control
  - Serum's macros
  - +25 custom made rhythmic and melodic presets for serum-fx plugin
  - MIDI note transformation
  - Logic pro x toolkit with 30 advanced MIDI transform presets
  - Custom automation lane sets
  - Cubase production template
  - Macos and windows compatibility
