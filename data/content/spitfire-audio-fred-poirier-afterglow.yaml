details: |-
  Fred Poirier's Afterglow is an electric guitar sample library that captures the vintage tones of legendary guitars. The library includes over 100 samples of iconic guitar sounds, from searing leads to lush ambient pads. Afterglow is perfect for producers working in a range of genres, from rock and pop to R&B and hip-hop.
specs: |-
  - 8 articulations: Long, Muted, Long Duo, Harmonics, Long Ensemble, Evolution, Myriad, Harmonic Myriad
  - 3 round robins
  - 3 signals (Modern, Vintage, D.I.)
  - 15 custom textures
  - 3 built-in effects and key switches
  - Up to 5 dynamic layers
  - 24-bit / 48 kHz
  - Recorded through a D.I. box and re-amped through two tube amplifiers at Tempo Loco Studios, Tours
  - 8.6 GB download size
  - Requires Kontakt Player 6.7 or higher
  - macOS 11 to OS 26 (Kontakt 8.8 requires macOS 14 minimum)
  - Windows 10
  - Minimum quad-core CPU, 4 GB RAM or higher
  - Spitfire Audio App required
