description: Autodafe Mega Drum Machines Collection for Kontakt contains samples
  of about 150 old, vintage, obscure, rare and hard to find drum machines.
details: |-
  Each kit has been mapped in a general MIDI format (but many old drum machines
  only have 4-5 sounds). Each kit has been divided into 5 groups: kick, snares,
  hats, cymbals and toms.

  Each group has custom controls for tuning, panning and volume. Each kit has
  custom graphics.
specs: |-
  - General MIDI format mapping
  - 5 drum kit groups (kick, snares, hats, cymbals, toms)
  - Custom tuning controls
  - Custom panning controls
  - Custom volume controls
  - Custom kit graphics
  - Requires Kontakt 5.6 (full version)
