details: |-
  Sonic Splitting Drums

  The Epic Dhol Ensemble is the most comprehensive and deep-sampled collection of large-scale Epic Dhols on the market. The library consists of a large ensemble of Punjab Dhol drums and was recorded in the same orchestral hall as our Epic Taiko Ensemble. It contains a great variety of articulations, since each side of drum produces a different sound. Essentially, it is divided into a bass section and a snare section. We played the bass section with the traditional big wooden Dhol sticks, mallets, hands, and fingers to ensure we covered the entire range. The Punjab Dhol is a sizable double-sided barrel drum with animal hide or synthetic skin stretched over its wooden ends, creating a loud bass tone. Adjusting the skin tension using ropes, nuts, or bolts changes the drum's pitch. The thicker stretched skin on one end delivers a deep, low bass sound, while the thinner skin on the other end produces a higher pitch.
