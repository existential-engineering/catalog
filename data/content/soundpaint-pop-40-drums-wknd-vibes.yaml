details: |-
  Infectious Rhythms

  Dive into the immersive world of contemporary R&B, dark-pop, trap, and hip-hop with Pop 40 Drums: Wknd Vibes. This exceptional collection includes five production-ready kits, each crafted to bring a moody atmosphere and infectious rhythms to your music. Let the sounds of Wknd Vibes inspire your beats and infuse your music with the irresistible energy that defines the vibrant musical landscape of today. Go beyond the realm of pre-made loops with Soundpaint's post-apoca-loop approach. Each hit boasts an expressive 127 velocity layers, ensuring unique character in every beat. Soundpaint's user-friendly drum kit mapping ensures seamless synchronization across all drum kits, so it's easy to mix, match, and morph drums to your heart's content. Each program has an optional ARP pattern - a great way to get the ball rolling. Customize the arp, play on top of it, or turn it off and get into all the details; there's no wrong way to get grooving! It's easy, flexible and fun to play, so you can get start jamming right away!
