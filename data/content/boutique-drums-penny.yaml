name: Boutique Drums Penny
manufacturer: musical-sampling
primaryCategory: drum-sample-pack
url: https://www.musicalsampling.com/boutique-drums-penny/
description: Penny is the third release in our boutique drums series and
  arguably the most vibey and versatile thus far.
details: |-
  After curating a kit with some beautiful and rare custom pieces, extensively
  sampling each drum, mixing the snot out of it and programming penny to a tee -
  what we end up with is an instrument that suits far more musical contexts than
  we initially anticipated.

  As per usual, we incorporated our repetition sampling techniques for realistic
  successive notes with the hi-hats and toms and six different hi-hat groove
  states that you can easily crossfade between for maximum expression.

  Recorded at hey hey studios in griffin, georgia. Drums played by brian scoggin
  (casting crowns).

  Kit includes kick, snare, ghost snare rolls, cross sticks, rimshots, five
  hi-hat state multisamples, six hi-hat state grooves, crossfade-able hi-hat
  grooves, hi-hat chicks, three toms, ride cymbal (with crash), ride bell and
  two crash cymbals.
specs: |-
  - Kontakt 5.8.1 or higher (full retail version required)
  - 48khz/24-bit recording
  - 7.2 GB compressed ncw format
  - Stand-alone
  - VST
  - Audio Units
  - Asio
  - Coreaudio
  - Wasapi
  - AAX native (Pro Tools 10 or higher)
  - 1gb free disk space
  - Repetition sampling for hi-hat/toms multisamples
  - Six hi-hat groove states
  - Crossfade-able hi-hat grooves
  - Live eighth-note hi-hat grooves (90/120/140 bpm)
  - Groove speed control (half/normal/double)
  - Adjustable humanization feature (off/tight/natural/loose)
  - Volume control for each drum group
  - Assignable Kontakt outputs for each drum group
  - Eight baked-in mix presets
  - Kick, snare, ghost snare rolls, cross sticks, rimshots
  - Five hi-hat state multisamples
  - Hi-hat chicks
  - Three toms
  - Ride cymbal with crash
  - Ride bell
  - Two crash cymbals
  - Simple and intuitive interface
