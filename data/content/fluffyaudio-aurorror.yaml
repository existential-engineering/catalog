url: https://fluffyaudio.com/shop/aurorror/
description: AURORROR is a free cinematic hybrid library for Kontakt 5. It
  features the same modulation engine of aurora.
details: |-
  Aurorror is either a standalone library, a kind of aurora trial-out and an
  update for aurora (1.2 version and it includes aurorror).

  Build your unique patches by layering up to 3 layers of sound sources with
  total control over the sound sources.

  13 different modulators available for complex sounds that can change at
  specific time intervals or on user's input, with synced delay, step modulator
  and lfos.

  Unique chain of custom effects including atmospherizer effects and 18 unique
  convolution irs.
specs: |-
  - Kontakt 5 library
  - 850 MB sample library (ncw format)
  - 630 samples (44khz/24-bit)
  - 25+ nki presets
  - 25+ unique sound sources (multisampled instruments)
  - 3-layer sound source stacking
  - Arpeggiator mode
  - Polystep mode
  - 13 modulators
  - Synced delay
  - Step modulator
  - LFOs
  - 5 LFO modulation shapes (sine, sawtooth, triangle, square, random)
  - Custom effects chain
  - Atmospherizer effects
  - 18 convolution IRs
  - Full version Native Instruments Kontakt 4.2.4 or above required
  - Windows xp/vista/7
  - Intel-mac and Mac OS 10.5 or higher
  - 1 GB system RAM
  - 5 GB free hard drive space
