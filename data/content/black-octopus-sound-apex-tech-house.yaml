details: |-
  Apex Tech House is a Tech House sample pack from Black Octopus Sound, aimed at underground Tech House, techno, progressive, minimal and deep house production.

  The pack includes drums and loops that can be reworked to fit a range of Techno and Tech House styles. Alongside over 500 assorted drum loops and one shots there are melodic synth loops and FX, basslines, atmosphere loops and vocal chops.

  The loops can be used as they are or processed through a glitch plugin such as Looperator or Effectrix.

  All loops are labelled with tempo and key information.
