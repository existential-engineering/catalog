  - Ableton push 2 color pads mode
  - 4 Ableton drum racks
  - Color coded pad design
  - Labelled pads with individually named note articulations
  - Single Ableton track audio routing
  - Kontakt integration
  - Ableton 10 drum bus compatibility
  - Ableton 9.5 or above required
  - Native Instruments abbey road 80s drummer required
