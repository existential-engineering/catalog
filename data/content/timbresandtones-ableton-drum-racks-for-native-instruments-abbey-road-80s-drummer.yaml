details: |-
  This collection of Ableton drum racks features all factory presets for the
  Native Instruments abbey road 80s drummer.

  Ease of navigation to load all presets from ableton push controller device
  browser. 4 ableton drum racks to instantly load the factory library preset
  with ableton mappings directly from your ableton push. Color coded pad design
  for visual performance. Labelled pads for post performance editing and
  automation within the ableton live clip editor with individually named note
  articulations.

  This pack routes all audio output through a single ableton track. Mixing can
  be further enhanced through kontakt abbey road 80s drummer mixer or additional
  ableton audio effects to the track for example the new ableton 10 drum bus.

  Ableton 9.5 or above to use ableton push 2 color pads mode. Native instruments
  abbey road 80s drummer you must purchase, license and install abbey road 80s
  drummer separately before installation of this pack.

  This product is also included in the full bundle for native instruments
  komplete drummer series.
specs: |-
  - Ableton live drum rack
