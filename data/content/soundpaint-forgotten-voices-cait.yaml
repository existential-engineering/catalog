details: |-
  Thousands of Cinematic Vocals

  Cait McWhir, originally hailing from Ireland, brings a rich tapestry of vocal artistry to this library, drawing inspiration from almost 30 years of deep exploration into Indian, Balkan, Middle-Eastern, and Celtic vocal traditions. Her remarkable versatility allows her to effortlessly traverse a wide spectrum of vocal styles, seamlessly blending conventional folklore with ancient Sanskrit chants, Vedic mantras, and free improvisation in self-created languages. Whether evoking the haunting resonance of Celtic laments or the rhythmic intricacy of Indian classical music, Cait's voice is a masterclass in expression. Cait offers over a thousand different vocal phrases, covering more than 15 hours of meticulously recorded material. In addition to Cait's extensive vocal repertoire, this library also features a unique set of vocal ambiences created by Steven Tavaglione. These ambiences, crafted from the voice of Barbary Grant, are designed to seamlessly complement Cait's vocals, adding an additional layer of depth and emotion. Cait is organized into intuitive subdirectories: Ambiences, Chants, Noises, Rhythms, Songs, and Sound Labs. Whether you're searching for ethereal vocal ambiences to add atmosphere, rhythmic vocal patterns to drive your composition, evocative chants and songs to bring an authentic cultural touch, or experimental sound design each subdirectory is designed to streamline your creative process. This ensures that you can quickly navigate the this extensive collection to find the exact sound or texture to enhance your music.
