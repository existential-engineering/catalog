details: |-
  Audio boutique compiled a perfect package for all lovers of deep house
  including loads of loops, midis, crisp percussion right next to haunting
  vocals and awesome guitars inspired by the likes of robin schulz, klingade,
  lost frequencies, alle farben, milky chance, edx, recondite and elderbrook.

  Get even more creative with the all-new stem format perfect for complex and
  creative (re-)mixing and so much more!

  All kits are 124 bpm with 2.03 gb of content in total, comprising 454 samples
  and 42 midis in total.

  Bonus deep house samples include 10 cymbals, 20 hihats, 10 shaker, 20 claps,
  10 rimshots, 10 snips, 20 guitar-loops, and 20 vocals.

  Formats available: 24-bit wav stereo and MIDI files.
