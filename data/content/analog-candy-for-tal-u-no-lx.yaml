description: The roland juno 60 is one of the most classic, vintage synths. Its
  been used by so many artist for a good reason, it just sounds fantastic.
details: >-
  Analog candy is our third sound-set for tal-u-no-lx and perhaps the most
  classic in nature.


  The focus is on what the juno did best, lush analog pads, deep driving bass,
  old school arps, cool classic keys.


  Analog candy is designed to take tal-u-no-lx to the next level of closeness to
  the original juno hardware.


  We have been working with hardware synths for many years. The list is long and
  includes many classic synths from roland, moog (trained by), sequential
  circuits, korg, new england digital (we did the worlds fully sampled project
  on the synclavier, now on display in the smithsonian).
specs: |-
  - 100 preset collection
  - Tal-u-no-lx compatible
  - Soundware (presets)
