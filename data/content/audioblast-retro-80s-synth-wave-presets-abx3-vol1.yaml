description: "100 Retro 80s Presets for ABX3: 40 bass, 43 leads & 17 sequences for authentic synthwave, cold wave & retrofuture productions."
details: |-
  Step back into the golden age of synth wave, cold wave, and retro future soundscapes with the Retro 80s Presets for ABX3. This sound bank delivers 100 expertly designed presets inspired by vintage analog machines and the iconic tones of the 80s underground.

  Inside you will find 40 powerful basses, deep, warm, and punchy, perfect for driving your retro grooves. 43 expressive leads run from silky new wave hooks to aggressive cold wave stabs, and 17 hypnotic sequences give ready-to-use patterns that bring instant motion and atmosphere.

  Designed for producers of synthwave, new wave, cold wave, retro electro, and retrofuturistic scores, this pack captures the essence of the 80s while keeping it fully modern and ready for today's productions. Whether you are composing neon-drenched soundtracks, dark wave club tracks, or futuristic themes, these presets give ABX3 a timeless vintage character with cutting-edge versatility.

  The pack requires the ABX3 synthesizer to run. All drums heard on the page demos come from Mininn Drum.
