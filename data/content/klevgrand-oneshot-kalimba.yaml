details: |-
  Get into the mesmerizing groove of the kalimba with this meticulously sampled thumb instrument. Based on the enchanting African thumb piano, each tone in the Kalimba pack captures the distinctive, warm and resonant tone defining this unique instrument.

  Use it for gentle and soothing melodies, rhythmic percussive patterns, or use it as a base for exploring new unique sounds. Infuse your music with the evocative textures of the kalimba, adding depth and soul to your arrangements with ease.

  This is a kit for OneShot – you will also need a license of OneShot to use it (bought separately).
