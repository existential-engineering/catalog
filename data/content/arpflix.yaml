details: |-
  Arpflix is a set of 70 arpeggiated patches inspired by the soundtracks of
  films from different genres. This library aims to capture the epic and emotive
  qualities of trailer music while also providing textures and tones suitable
  for more hybrid and electronic styles.

  Each patch in the collection was designed to evoke the mood and feeling of a
  particular film or film genre. Some recreate the driving arpeggios and
  swelling strings often found in action and blockbuster trailers. Others draw
  influence from sci-fi soundtracks with atmospheric pads, intricately layered
  arpeggios and synthesizer sounds.

  A number of patches take cues from emotional indie or drama films, featuring
  softer arpeggios and melodies to capture feelings of melancholy or hope. The
  collection aims to give composers and producers a versatile set of arpeggiated
  sounds that can be used to help set the scene or mood in film productions,
  trailers and other media.

  The patches can also work well in more electronic and hybrid styles outside of
  film music by providing intricate arpeggiated layers, harmonically evolving
  sounds and atmospheric textures. Arpflix is a source of inspiration for sound
  designers, producers and electronic music artists seeking arpeggiated sounds
  with cinematic quality and emotional resonance.
specs: |-
  - 70 arpeggiated patches
  - Modulation wheel for timbre control
  - Omnisphere version 2.8 or higher required
