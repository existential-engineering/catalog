details: |-
  Analog spheres is a collection of 128 new patches for the software synthesizer obsession by synapse audio. You get a soundware which is carefully designed for spherical popular and electronic music.

  The presets are different from those of an analog synthesizer, they have their own sound and show some new possibilities of obsession. Vintage and modern synthesizer sounds, it's a twist.

  This bank takes advantage of the step-lfo and the reverb/chorus sections. Most of the patches are a good starting point for your own sounds and are a good alternation to the includes sounds.

  The presets can be musically controlled by velocity and modulation wheel.

  Styles include ambient, chill out, retro, pop, and electronic.
specs: |-
  - 128 new patches
  - Step-lfo
  - Reverb/chorus sections
  - Velocity control
  - Modulation wheel control
  - Pads
  - Fx
  - Leads
  - Basses
  - Impulses (by lfo steps)
