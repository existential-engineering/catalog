details: |-
  If you're a fan of LOATHE then you're quite familiar with Sean's playing. If you're not familiar with LOATHE, then check them out yesterday!

  Unique drum tones, bashing grooves, and an extremely high attention to detail are just a few of the descriptive ideas that constitute Sean's performances. He hits incredibly hard, has powerful, fast feet, and knows exactly why he's hitting every single note in every song.

  That same level of attention from Sean was poured into every single groove and fill in this pack. An authentic representation of not only how Sean plays the drums, but how he thinks about music as a whole, and given that he writes more than just the drum parts for his band, this pack is a songwriters' dream. Luckily, you're not dreaming though, and Post Metal Grooves is here to stay.
