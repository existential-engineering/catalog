name: BitRate
manufacturer: icebreaker-audio
primaryCategory: drum-machine
url: https://www.icebreaker-audio.com/products/bitrate/
description: BitRate is a semi-modular, retro-digital drum machine for native
  instruments' Reaktor 5.8.
details: |-
  5 drum slots into which you can load any one of 13 different sound modules.

  4 main sound engine types: chip, ia-op, smp, and glitch; each based on a
  different style of lo-fi digital sound generation.

  A built-in sequencer with 2 modulation sequences per drum.

  Highly flexible modulation routing capabilities with eq, compressor, and
  speaker simulator master effects.
specs: |-
  - Semi-modular drum machine
  - 5 drum slots
  - 13 different sound modules
  - 4 main sound engine types: chip, ia-op, smp, and glitch
  - Built-in sequencer
  - 2 modulation sequences per drum
  - Flexible modulation routing capabilities
  - EQ master effect
  - Compressor master effect
  - Speaker simulator master effect
  - Native Instruments Reaktor 5.8 compatible
