details: |-
  Flame Audio presents new sample MIDI pack! 'Beat Starters' include 40 melody
  and MIDI loops that'll be a game changer for your hip hop/trap music
  production. These loops were carefully created to give you instant beatmaking
  inspiration that'll keep you cooking up for days.

  All samples contain key, tempo and mood information for easy selection. They
  work with all modern daws. If you are looking for the best inspirational
  sounds to unblock new beat ideas then this is the ideal pack to add to your
  library.

  Like so many other flame audio products, this product includes single MIDI
  files for each loop, allowing you to seamlessly mix your favorite synths and
  samplers with the sounds contained in the pack. Just drag and drop the melody
  that you want to use in your favourite DAW and you good to go.

  Product details: 40 all audio files: 40 original wet melody loops including:
  keys, pianos, pads, guitars, synths & more 40 MIDI files key & tempo labelled
  44.1khz/24-bit works in any DAW 100% royalty-free.
