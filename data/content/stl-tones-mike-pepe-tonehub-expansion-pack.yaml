details: |-
  Mike Pepe is a producer, engineer and mixer well known for his work in the alternative rock and pop world, with Billboard charting success alongside Taking Back Sunday and records for Cassadee Pope, The Struts, Lil Lotus, Plain White T's, As It Is, Phem, Anarbor, Connor Kaufman and TX2.

  Mike engineered this expansion pack to put the variety of tones he reaches for daily right at your fingertips. The amplifiers captured here can cover any genre, with different guitar pickups, microphone selections and cabinets, all ready to be tailored to what your song needs.

  Mike's pack contains 124 captures.
