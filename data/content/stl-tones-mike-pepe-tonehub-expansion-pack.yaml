description: "Producer, engineer, and mixer Mike Pepe is well known for his work
  in the alternative rock and pop world having Billboard charting success with
  Taking Back Sunday whilst crafting massive records for other artists,
  including Cassadee Pope, The Struts, Lil Lotus, Plain White T’s, As It Is,
  Phem, Anarbor, Connor Kaufman and TX2. Mike Pepe has engineered this expansion
  pack to have the variety of tones he reaches for daily in his productions
  right at your fingertips in the ToneHub plugin platform. The versatility of
  the amplifiers captured in this pack can cover any genre of music, with
