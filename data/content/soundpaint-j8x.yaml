details: |-
  A Hidden Analog Gem. The JX-8P may not be the most well-known or good-looking synth out there. Released in 1985, analog synths were losing popularity to FM synths. The controls were delicate, the preset memory was small, and a separate programmer was basically required. But what it lacks in looks and popularity, it more than makes up for in sound! Used by artists such as Vangelis, Nobuo Uematsu, Gary Numan, and Flashmob, the JX-8P has a bit of everything. Sweet and supple keys. Warm pads. A beefy low end. Brilliant E-Pianos. A little extra sizzle. A little more hi-fi. With over 50 parts and 100 programs there's lots of ultra deep-sampled, buried treasure in the J8X! So don't worry about the finicky controls or bizarre cartridges! Just load up the J8X in Soundpaint and experience all this not-so-classic synth has to offer!
