details: |-
  Our logic pro bundle includes our complete soundbanks for 11 software instruments; the efm 1, the es e, the es m, the es p, the es 1, the es 2, the evoc 20, the evb3, the evd6, the evp88, and sculpture.

  The larger sound banks, those for the es 2, sculpture, es 1, and efm 1, are divided into subcategories by the type sound. These subcategories are "arp," "bass," "effects," "lead," "pad," and "poly."

  Installation is a simple drag-and-drop affair, and detailed instructions are included in the download to get you up and running with your expanded sound library as soon as possible.
