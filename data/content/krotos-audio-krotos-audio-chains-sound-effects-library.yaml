description: The SoundBits Just Chains Bundle for Reformer Pro is a collection of metal chain sound effects covering chain hits, pulls, drops, shakes, rattles, whips, and jingles.
details: |-
  The Just Chains Bundle by SoundBits offers a vast collection of metal chain sound effects, fully adapted to work straight out of the box in Reformer Pro to offer a powerful workflow for designing sound effects in real-time.

  Covering a large variety of chain hits, pulls, drops, shakes, rattles, whips, and jingles, Just Chains packs an essential Foley collection into one. This sound library bundle is fully optimised for designing, automating and performing in real-time using Reformer Pro.

  The bundle offers a wide-ranging 3.66 GB selection of professionally designed and recorded royalty-free SFX components, ideal for any trailer, post-production, game-audio, and sound design project.

  Sound categories included in this library: Chain Pickup and Drops, Chain Hits, Sliding Chains, Rattling Chains, Footsteps, Chain Hoists, Rattling, Scuffling.
specs: |-
  - 898 Sound Files
  - 3.66 GB Size
  - 24 bit / 96kHz High-Quality WAV Files
  - 100% Royalty-Free Commercial License
  - Embedded Metadata
  - 9 Reformer Pro Sound Packs
  - Contains two downloads: a zip file of all source sound effect asset files with Metadata PDF, and an installer for the integrated Reformer Pro library
