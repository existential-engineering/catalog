details: |-
  Beauty long synths contains 50 long synth pads for synapse audio dune 3
  synthesizer. It is a very focused soundbank that could fit to many modern and
  vintage music productions like electronic, cinematic, game audio, ambient and
  other.

  The main goal of this soundset is to create some moving atmospheres in the
  background field of music productions. Modulation settings are very crucial to
  the motion of the sounds.

  As most of our synth presets packs mw adds vibrato while aftertouch is
  modulating the pitch. Presets were design with dune 3.520 and run best with
  this or newer version.
specs: |-
  - 50 long synth pads
  - Modulation settings
  - Mw vibrato
  - Aftertouch pitch modulation
  - Dune 3.520 compatibility
