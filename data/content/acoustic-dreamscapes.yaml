details: >-
  Featuring delicate and downtempo guitar phrases, acoustic dreamscapes by
  ueberschall delivers a cinematic-style sound. The mood is ambient and chilled
  but also contains a hint of the unsettling. Supported by electric bass, drums
  and electric piano, the music perfectly captures the shifting sensations that
  the imagined reality within dreams can often create.


  With 644 loops spread across nearly 4.6 gb of samples, each of the five
  construction kits provides dedicated intro and outro parts as well as three
  distinct musical sections. Individual loops are up to 16 bars in length (up to
  50 seconds). The kits provide plenty of scope to create full-length musical
  arrangements. As suits the musical style, slower tempos dominate the kits,
  spanning 40 (tagged as 80) to 84 bpm.


  Each of the main musical parts is based around various phrases played on nylon
  and steel strung guitars. All guitars in each part are available as two
  pre-mixed stereo loops: the first version features lighter effects like
  reverb, the second version features creative processing options such as
  slowdown, tapestop and other effects. Individual loops for each guitar phrase
  are also provided in mic'ed and di versions, allowing you to apply your own
  choice of effects processing.


  Electric bass guitar provides a solid foundation to all the musical parts and
  is provided in three versions; mic'ed, di and heavily processed with creative
  effects. The electric piano provides supporting chords and a warm, mellow,
  tone. Pre-mixed acoustic drum loops are provided in three versions; dry, fx
  and heavily processed. Single track loops for kick (in and out mics), snare
  top, snare bottom, hihat, cymbals, toms, overheads and room mics are also
  included so you can add variety and develop your own drum mix.


  Elastik is the perfect loop player for acoustic dreamscapes. Not only does it
  provide high-quality pitch-shifting, time-stretching and scale-syncing but
  also various creative tools for sound design like resample, formant, reverse
  and a multimode filter. The tag-based browser manages all installed soundbanks
  together, enabling easy combinations between different libraries.
