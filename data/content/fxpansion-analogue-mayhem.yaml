details: |-
  Analogue Mayhem is a geist expander featuring organic electronic sounds
  generated almost exclusively with a large analogue modular synthesizer. Its
  unique character is ready to deploy in geist's fast and intuitive
  sample-sequencing environment.

  Analogue mayhem includes insane sequences, sfx bursts, deep basses, chord
  stabs and multi-sampled synthetic drums which use geist's round-robin,
  velocity layering and fx treatments for expressive depth and sonic variation.

  Anything but vanilla, analogue mayhem defies genre categorization and its
  energy and attitude is relevant in any music requiring powerful and
  forward-looking sounds.

  Although its presets are for geist, analogue mayhem's sounds can be loaded
  into any device compatible with its 24-bit 44.1khz .wav and .rx2 files.
specs: |-
  - Geist expander
  - 24-bit audio
  - 44.1khz sample rate
  - .wav file format
  - .rx2 file format
  - Round-robin sampling
  - Velocity layering
  - FX treatments
  - Over 800 wav samples
  - Over 180 rx2 loops
  - 5 full song presets
  - 6 engine presets
  - 30 kit presets
  - 71 pad presets
