details: |-
  Produced by eduardo tarilonte, accordions 2 is considered the first choice if you are looking for a realistic and, above all, playable accordion library. Numerous renowned composers and producers rave about the authenticity and expressiveness of this virtual instrument.

  With single concert accordion you get a virtual pigini accordion from eduardo tarilonte's accordions 2 as a single instrument with 15 registers including left hand basses. So if you are looking for a realistic and playable concert accordion for your current project, this single instrument is the perfect solution.

  This single instrument was exclusively designed for best service engine 2 and is therefore not compatible with the kontakt player.

  Accordions 2 - concert accordion by best service is a virtual instrument audio plugin and a software application and soundware (samples or presets that load into other products) for macos and windows. It includes, and is therefore "powered by", engine player, which functions as an audio units plugin, a VST 3 plugin, an AAX plugin and a standalone application.
specs: |-
  - Pigini concert accordion
  - 15 registers including left hand basses
  - 3 kinds of bellow shake
  - 3 different dynamics
  - 3 round robins
  - Key and button noises
  - Recorded chromatically with u47 microphone
  - Best service engine 2 compatible
  - Audio units plugin
  - VST 3 plugin
  - AAX plugin
  - Standalone application
