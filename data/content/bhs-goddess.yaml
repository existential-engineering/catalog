description: A demeter amp capture seeking to recreate the 90's and 2000's tones
  of stone temple pilots, bonnie raitt, school of fish and other artists.
details: |-
  BHS Goddess is the th-u expansion library, signed by big hairy sounds, seeking
  to recreate the 90's and 2000's tones based on demeter tgp-3 preamp and tga-3
  amplifiers.

  The library contains 45 rigs, captured using demeter tgp-3 into a vht classic
  power amp and demeter tga-3 3 channel guitar amplifier.

  Captured with a classic bogner straight 4x12 cab with v30 speakers through
  classic API preamps.

  The library also includes 20 patches focused on recreating the famous 90's and
  current album guitar tones.

  Rigs include multiple channel configurations (ch1, ch2, ch3) with various tone
  characteristics such as clean, dirty, blues, plexi, and others, with options
  for cabinet simulation or no cabinet.
specs: |-
  - 45 rigs
  - Demeter tgp-3 preamp
  - Demeter tga-3 3 channel guitar amplifier
  - Bogner 4x12 cabinet with v30 speakers
  - Sm57 microphone
  - R121 microphone
  - 20 artist presets
  - Th-u expansion library
