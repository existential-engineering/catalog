details: |-
  32 Emotions. One Instrument. Imagine a modern scoring tool that covers the entire spectrum of human emotions. The largest set of analog drones, direct-to-cinema sub-woofer booms, and massive epic impacts. Sweeping arcs of emotion and everything in between. Hybrid Emotions took two years to design and record. It includes all the most popular categories of cinematic sound design, all in 32 different emotions. Hybrid Emotions is based on Herbert Plutchik's famous "Wheel of Emotions", a visual guide of human emotions and how the relate to one another. You can find unique cinematic instruments and soundscapes in all emotions from Love, Joy, Surprise, Anger, Sadness, Fear and everything between these emotions from Aggressive to Serenity, from Awe to Rage, from Trust to Terror.
