details: |-
  The Stradivarius of Synthesizers

  Some instruments command respect the moment you lay eyes on them. The original Model D by Bob Moog is one of those rare creations, a true cultural and historical landmark in music technology. As one of the most recorded and influential monophonic synthesizers ever made, it has shaped the sound of multiple eras, genres, and countless iconic tracks. Heard in classic albums, film scores, and experimental works alike, it remains a benchmark for warmth, presence, and musicality. Often called the Stradivarius of synthesizers , the Model D offers a deceptively simple interface hiding near-limitless possibilities. This library captures an early serial number unit, sought after for its rich, warm oscillator boards and alive, organic character. Every detail was meticulously recorded to preserve the nuances, quirks, and subtle imperfections that make this instrument feel like it's breathing. From fat, punchy basses to smooth leads, textured feedback patches, and expressive filter sweeps, each sound was crafted to highlight the Model D's soul. Even in its simplicity, three of the most musical oscillators ever built, a legendary filter, and a responsive envelope, the Model D can deliver an endless variety of tones. Whether faithfully recreating its most famous voices or venturing into unexplored sonic territory, this collection offers both the sonic gold and emotional magic that have made the Model D a near-religious experience for musicians.
