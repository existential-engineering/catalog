description: Spitfire Audio joins forces with the biggest name in film scoring
  to produce the ultimate drum sample library for cinematic percussion.
details: |-
  Spitfire Audio joins forces with the biggest name in film scoring to produce the ultimate drum sample library for cinematic percussion. Featuring the ensembles and solo instruments used by Oscar-winning Hans Zimmer in his blockbuster scores, we've drawn on his years of creativity and studio experimentation to give you all you need to create epic drum composition.

  From tombeks to taikos, playing from whisperingly quiet to thunderously loud, we've worked with Hans' Grammy award-winning team to capture the highest quality recordings, featuring the same players in Lyndhurst Hall at AIR Studios where Hans records his biggest scores, all mixed and produced by the man himself.
specs: |-
  - ~12225 samples
  - 48.5 GB uncompressed .wav
  - 19.6 GB download size
  - 39.20 GB disk space required during install
  - 96 rarefied mic signals recorded
  - Close, room and ambient perspectives mixed by Hans Zimmer
  - Up to 9 round robins and 6 dynamic layers per hit
  - Recorded in Lyndhurst Hall at AIR Studios at 192k
  - Requires Kontakt or Kontakt Player 5.6.8 or higher
  - Kontakt Player included (free download)
  - Spitfire Audio App required
  - Minimum 8GB RAM, 16GB recommended
