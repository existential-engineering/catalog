details: |-
  Platinum record producer/mixer David Bendeth brings you a collection of raw and mix-ready one-shot drum samples that will add power and punch to your songs. These samples were recorded at iiWii Studios using their rare Focusrite console with a selection of vintage outboard equipment and microphones. David has worked with artists like Paramore, Breaking Benjamin, Papa Roach, and Bring Me The Horizon.

  Instantly inject power into your mix with these one-shot samples. Mix and match your favorite sample libraries or raw drum recordings with Drumshotz David Bendeth and discover a fresh take on your sound.

  Purchase includes instant digital download, perpetual license, free lifetime updates, and unlimited customer support.
specs: |-
  - 190 samples total
  - 44.1 kHz, 24-bit WAV format
  - 10 kick samples
  - 130+ snare samples
  - 4 side stick samples
  - 3 tom sets
  - 9 stomp samples
  - 6 clap samples
  - Compatible with any DAW or triggering program
  - Perpetual license
  - Instant digital download
