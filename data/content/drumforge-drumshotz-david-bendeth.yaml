description: Raw and mix-ready one-shot drum samples from platinum producer and mixer David Bendeth, recorded at iiWii Studios through a rare Focusrite console and vintage outboard.
details: |-
  Drumshotz David Bendeth is a signature one-shot drum sample collection from platinum record producer and mixer David Bendeth, whose credits include Paramore, Breaking Benjamin, Papa Roach, and Bring Me The Horizon. Both raw and mix-ready versions are supplied.

  The samples were recorded at iiWii Studios through the studio's rare Focusrite console with a selection of vintage outboard equipment and microphones. The library is unusually snare-focused, carrying over 130 snare samples alongside 10 kicks, 4 side sticks, and 3 sets of toms, with 9 stomp and 6 clap samples for percussive layering.

  All 190 samples are delivered as 24-bit / 44.1 kHz WAV files for use with any drum triggering program or DAW.
specs: |-
  - 190 one-shot samples total
  - 24-bit / 44.1 kHz WAV format
  - 10 kick samples
  - 130+ snare samples
  - 4 side stick samples
  - 3 sets of tom samples
  - 9 stomp samples and 6 clap samples
  - Recorded at iiWii Studios through a rare Focusrite console with vintage outboard and microphones
  - For use with any triggering program or DAW
