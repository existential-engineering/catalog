description: A free set of one-shot drum samples produced with Lance Prenc of Prenc Audio, offering mix-ready kick, snare, and tom hits with matching room samples for each kit piece.
details: |-
  Drumforge teamed up with Lance Prenc, of Prenc Audio in Melbourne, Australia, to give away a small set of one-shot drum samples at no cost. It is intended as a way to add fresh drum samples to an existing collection without buying a whole new pack.

  Lance Prenc is known for his work with bands such as Alpha Wolf, Thornhill, and Polaris, and the samples carry the same aggressive, large-sounding character. They are mix-ready and meant to beef up drum tracks by adding attack, body, and consistency so drums punch through the speakers regardless of the source material.

  The kit covers one kick, one snare, one rack tom, and one floor tom, with a room sample supplied for each kit piece.
specs: |-
  - 1 kick sample
  - 1 snare sample
  - 1x Rack Tom Sample
  - 1x Floor Tom Sample
  - 1x Room Sample For Each Kit Piece
  - Free download
