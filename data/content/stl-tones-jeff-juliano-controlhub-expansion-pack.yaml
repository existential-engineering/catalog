description: "Jeff Juliano is no stranger to large format consoles, tape
  machines, and hardware built for mixing records, having spent years working in
  some of the finest recording studios from NYC to Los Angeles. With his work
  collectively selling over 40 million albums worldwide, he knows what's needed
  to make a hit! Now exclusively mixing from his Delaware home studio or off a
  laptop whilst roaming the United States in his RV, Jeff has become one of the
  biggest mix engineers in pop and country music history with Grammy and
  CMA-winning mixes for Dan + Shay, Florida Georgia Line, Tate McRae & John
  Mayer. Jeff Juliano has held nothing back with this expansion pack, giving you
  precise emulations of the signal chains used on chart-topping hit records to
  bring immediate control to your mix.Every critical element of his mixing
  process has been covered in these presets, with signal chains for live drums
  and bass, guitars, keys, through to programmed kicks and sub synths. Also
  captured are the vocal chains that are vital to the foundation of the modern
  pop-country sound that Jeff is famous for.This expansion pack has a total of
  108 presets."
