details: |-
  IR-Pack Golden Gated is a collection of impulse responses for the HOFA IQ-Series Reverb V2 or HOFA SYSTEM IR-Verb plugins. The pack delivers gated reverb effects drawing on the authentic sound of iconic reverb units, real room convolutions, and completely new techniques. The effects are designed to be energetic and spectacular, suitable for making a lasting impact on music productions.

  The pack contains over 150 named impulse responses spanning a wide range of gated and creative reverb textures, including Slamming Gate, Strange Fade, Boingy, Cloud, Ocean, Dragon, Needle, Fuzz, Splatter, Splinter, Crude, and many more named variations. Sound examples are available via SoundCloud. A demo version is available for testing before purchase.
