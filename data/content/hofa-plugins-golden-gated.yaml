details: |-
  IR-Pack Golden Gated is a HOFA-Plugins impulse-response pack devoted to gated reverbs. The product page describes it as the most impressive and powerful gated reverbs, built from the authentic sound of iconic reverb legends, real room convolutions and completely new techniques, and says these energetic and spectacular reverb effects will always make their mark on your productions.

  The pack is not a standalone plugin. To buy and use the IR-Pack you need either the IQ-Series Reverb V2 or the HOFA SYSTEM IR-Verb, which load the impulse responses as convolution reverb presets.

  The page lists 155 named impulse responses, mixing recognisable gated-reverb characters with experimental textures: entries such as Slamming Gate, Bold Full, Box Tin and Tin Bucket Bottom sit alongside creative names like Agey Brush, Dragon Bite, Higgs-Boson, Photon Torpedo, Legolas and Tronsky, plus families of variations (Fuzz, Needle, Ocean, Splatter, Splinter, Strange, Sweep, Zipper).

  Sound examples are offered on the page through an embedded SoundCloud player behind a cookie-consent placeholder, three YouTube videos are embedded below the product blurb, and a Download & Test link points to the HOFA-Plugins downloads area for trying the products before purchase.
specs: |-
  - 155 gated reverb impulse responses
  - Requires IQ-Series Reverb V2 or HOFA SYSTEM IR-Verb as host
  - Combines emulations of iconic reverb units, real room convolutions and newly developed techniques
  - Ranges from realistic gated reverbs to experimental sound-design textures
