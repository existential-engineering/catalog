description: "Who wants to be normal, right? If you want to make an impact:
  stick out. Be a freak. That was what I had in mind when creating this pack."
details: |-
  Loaded with 78 bold and powerful bass, 16 exhilarating and intense chord and 6
  spine-tingling lead sounds this pack is the outlier, the mutant, the outlaw in
  the world of soundsets.

  I started by sculpturing sounds with some of your favorite analogue synths...
  Put them through some nasty, high-end output gear... Only used the best pieces
  of meat I got... Transferred snippets of these samples into serum... Used all
  the magic our beloved soft-synth has to offer: warp, render, sync,
  re-sample... And repeat...with the goal to synthesize some bad-ass unique
  wavetables... Ready to punch your muse in the face.

  As a result you get 104 custom-built, multi-cycle wavetables and 100 original
  and inspiring serum presets... Full of gritty low-end, mashed up with twitchy
  mids and otherworldly highs... An unconventional collection of sounds you
  won't find anywhere else... Always playable and usable.

  To use this pack you must have xfer serum VST/AU v1.214 or higher installed on
  your computer. You need 249mb of free hard drive space for presets and
  wavetables (unzipped).
specs: |-
