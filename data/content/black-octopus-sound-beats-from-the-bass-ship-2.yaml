description: Producer ahee has created his second pack of Serum presets and samples. Like the original beats from the bass ship, this pack contains 128 Serum presets designed for dubstep, trap and other bass heavy genres. To round out the pack a total of 200 extra one shots have been added.
details: |-
  Beats From The Bass Ship 2 is a Serum preset and drum sample pack from Black Octopus Sound, produced by sound designer Ahee as the follow up to Beats from the Bass Ship. It pairs 128 Serum presets with 200 drum and FX one shots.

  The Serum bank is weighted toward bass, with 64 bass patches alongside 9 arps, 10 chords, 16 FX, 11 leads, 7 pads, 7 plucks and 4 rave style patches, so a track can be built from low end through to melodic parts inside one synth.

  The drum content covers 52 808 sub kicks, 50 snares, 22 trap claps, 36 percussion hits and 20 hi hats, cut for clean and punchy production. A further 20 FX one shots handle transitions and accents.

  The material is aimed at bass, drum and bass, dubstep and trap production, and the pack is filed by the label under both its Serum preset and drum sample categories.
