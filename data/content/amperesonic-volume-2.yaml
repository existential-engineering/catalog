details: >-
  Amperesonic volume 2 contains 43 presets for voltage modular. This preset pack
  contains the following items: 4 arpeggios, 2 bass sounds, 4 drones, 2 drum
  kits, 5 drum sounds, 3 insert effects, 4 leads, 6 pads, 2 sequences, and 11
  sound effects.


  This preset pack uses the vocoder and additive oscillator modules which are
  sold separately by cherry audio and are added to your purchase if you do not
  own them yet.


  You can use this preset pack for electronic music production in genres like
  idm, ambient, experimental, dub techno, electronica and other experimental
  electronic music genres.


  The most interesting parameters of the preset have been assigned to the
  performance knobs. Every preset has been categorized and assigned to keywords
  including: amperesonic, arpeggio, bass, drone, drum kit, snare drum, hi hat,
  blip, insert effect, lead, pad, sequence, sound effect, polyphonic,
  monophonic, self running, clock synced, dark, bright, abstract, dissonant,
  harmonic, scary, soundscape, glitchy, organic, analog, metallic, evolving,
  lofi, granular, and distorted.


  Sound design by insanic4.
