description: Analog House is a collection of sounds and MIDI files for producing
  the analog synth-driven electro side of house music.
details: |-
  The concept behind analog house was to create a sample pack with nothing but
  two moog synthesizers as a source for the whole collection, including drums.
  The actual moogs used? Minimoog voyager electric blue and minimoog model d
  (vintage deluxe).

  Our focus was to provide long loops with slow evolving tweaks on parameters
  such as filter, resonance, adsr, and transposing lfos by octaves. Each of the
  loops in the voyager set is accompanied by monophonic MIDI companions.

  There are playable basses and drum kits in kontakt format as well as drum kits
  in battery and maschine format. Kontakt instruments were created by sampling
  the two moogs.

  Wav versions include a bonus cubase project and acid pro project to get you
  started.
specs: |-
  - 39 MIDI files
  - 245 loops
  - 165 one-shots
  - 24-bit 44.1khz stereo
  - Apple-looped .aiff format
  - Ableton .alp format
  - Acidized .wav format
  - Kontakt 5 .nki format
  - Minimoog voyager electric blue source
  - Minimoog model d (vintage deluxe) source
  - Kontakt instruments
  - Battery format drum kits
  - Maschine format drum kits
  - Monophonic MIDI companions
  - Cubase project included
  - Acid pro project included
  - Filter parameter tweaks
  - Resonance parameter tweaks
  - ADSR parameter tweaks
  - Transposing LFOs by octaves
