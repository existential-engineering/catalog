details: |-
  Produced by eduardo tarilonte, accordions 2 is considered the first choice if you are looking for a realistic and, above all, playable accordion library. Numerous renowned composers and producers rave about the authenticity and expressiveness of this virtual instrument.

  With single bandoneon you get a virtual accordion from eduardo tarilonte's accordions 2 as single instrument. This instrument is based on a detailed sampling of a real 1930's a-a (alfred arnold) bandoneon that reflects the characteristic sound of tango.

  If you are looking for a realistic and playable accordion for your current project, this single instrument is the perfect solution.

  Accordions 2 - bandoneon by best service is a virtual instrument audio plugin and a software application and soundware (samples or presets that load into other products) for macos and windows. It includes, and is therefore "powered by", engine player, which functions as an audio units plugin, a VST 3 plugin, an AAX plugin and a standalone application.
specs: |-
  - Based on detailed sampling of a real 1930's a-a (alfred arnold) bandoneon
  - 3 kinds of bellow shake
  - Premade rhythms for the left hand
  - 3 different dynamics and 3 round robins
  - Key and button noises
  - Recorded chromatically with u47 microphone
  - Exclusively compatible with Best Service engine 2
  - macOS and Windows
