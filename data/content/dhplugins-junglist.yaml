details: |-
  Featuring a massive 100+ presets and 45 sample banks containing subs, stabs, basses and the lushest of pads, all dripping in Junglistic vibe and character. These sounds have been created using primarily hardware and software synthesisers and cutting edge software processing, all run through Halo’s unique processing and sequencers, reflecting 25 years of experience producing Jungle and Drum and Bass. Even the famous Dub Siren makes several appearances.

  Intersecting classic old skool jungle and intelligent drum and bass with modern production techniques, this expansion brings a fresh palette to the Jungle revival.

  All presets have been crafted using the full breadth of HALO 2’s unique functionality. Using a range of hardware and software synthesisers, both digital and analogue sound sources and fx and processing, all the sample banks were painstakingly put together to create the finest re-sampled audio for each expansion, and every expansion has its own unique character and qualities.
specs: |-
  - 100+ presets
  - 45 sample banks
  - Lush intelligent drum and bass pads and sequences
  - Jungle subs, stabs, wobbles, distorted basses, sub fallers
  - Includes the Dub Siren
  - Product requirements: HALO 2 (full version), does not work with HALO LITE
