details: |-
  Get ready to supercharge your productions with Acid-Trance-Techno Vol. 2, the second installment in the acclaimed series by AudioBlast. This time, we bring you 256 four-bar WAV loops and 256 matching MIDI files. Meticulously crafted to cover a wider and harder range of electronic music genres, including Acid, Trance, Techno, Goa, Psytrance, and beyond.

  Built using the powerful sounds of ABX3 and the newly released ABX3 Trance Presets Vol. 2.

  This pack offers a cutting-edge toolkit filled with basslines, leads, hard bass, hard leads, arpeggios, and synth riffs. All designed to give your tracks professional energy and momentum right out of the box.

  Whether you're diving into psychedelic atmospheres, creating raw analog acid, or building massive trance anthems, this pack delivers ready-to-use audio and customizable MIDI to suit every workflow.

  Even if you don't own ABX3, you'll benefit from the high-quality sound design. And if you do have ABX3, the included MIDI files open the door to recreating these loops natively or evolving them into brand-new ideas.
specs: |-
  - 512 total files
  - 256 WAV loops (4-bar, 150 BPM tempo-synced)
  - 256 matching MIDI files
  - Acid, Trance, Techno, Goa, Psytrance, Hard Bass & Hard Leads
  - Inspired by ABX3 and Trance Presets Vol. 2
  - DAW-ready and compatible with all major platforms
  - Compatible with every DAW, including Ableton Live, Logic Pro, FL Studio, Cubase, Bitwig, Reason, Studio One and Reaper
