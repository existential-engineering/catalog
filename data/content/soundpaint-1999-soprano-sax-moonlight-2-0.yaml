details: |-
  Serene As Moonlight! Moonlight is a serene, smooth, playable Soprano Sax designed with realism in mind and powered by H.A.L (Hyper Acoustic Legato) Technology. The Sax features multiple layered legato transitions triggered automatically by playing different velocities. Playing soft will trigger a fast slurred transition, and playing hard will trigger a smooth, slow bend. H.A.L. makes it easy to play fast, slow, polyphonic, monophonic - just play however you like and H.A.L. takes care of the rest. Moonlight contains 93 Ultra Deep-Sampled Soprano Sax Parts and 47 Programs, including dozens of Arcs, Short Notes, Sustain and Performance-based articulations. Performance-based articulations have also been enhanced with our new Rack > Time Module so pre-recorded articulation speeds can be freely controlled by the Mod Wheel. The goal is to offer a library so deep and so realistic that most won't be able to tell if it was sampled or live.
