details: |-
  The Keys to the Kingdom

  We brought an array of four Grand Pianos into our favorite modern orchestral hall and sampled them all together. The sound of the ensemble is unlike anything else - spacious, airy, ethereal, and human. It's a whole new kind of warmth and texture, with a wider and smoother timbre. The Piano Ensemble includes 3 microphones (close, decca, and wide) along with special effects recorded by the ensemble and custom synths created with the samples. With 127 dynamic velocity layers, Soundpaint offers the ultimate in expressive playing. From the normal sustains to the plucked piano strings… from the soft, ethereal tremolos to the harsh, sharp clusters… from the inside-the-piano glissandos to the grand custom synths, there are no limits to the colors and textures the piano ensemble can create.
