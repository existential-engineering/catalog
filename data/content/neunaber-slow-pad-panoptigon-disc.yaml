description: A lo-fi swelling synth pad disc for the Panoptigon, mastered at
  half the usual rotation speed to create a slowly evolving sound.
details: |-
  SLOW PAD is a warm, very lo-fi, swelling synth pad. We've mastered the sounds at half the usual disc rotation speed in order to make the sound evolve slowly ("Servo" mode), but you can also play it at double-speed ("Compu-drive" mode) or any other speed you like. This sound especially benefits from cranking up the reverb. SLOW PAD is formatted to be played on PANOPTIGON, and while it is NOT directly compatible with Optigan or Orchestron, the disc will fit and play in those instruments, albeit with the sounds mapped incorrectly, and some sounds missing. Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility
