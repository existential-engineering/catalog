details: |-
  A sample library captured from an original Roland TR-808 at 96 kHz, covering all core analog voices of the machine. The pack is aimed at producers who want authentic 808 sub-bass, snares, cowbells and percussion as plain WAV files that drop into any DAW or sampler.

  The drum voices are led by 25 Bass Drums and 25 Snares, described as carrying rich analog depth and dynamic response. Toms and congas are supplied as Low, Mid and High variations, with 5 samples each of LT, MT, HT, LC, MC and HC.

  Metallic and auxiliary percussion cover 16 Rimshots, 16 Claps, 16 Cowbells and 16 Claves. High-end voices comprise 25 Cymbals, 5 Open Hi-Hats and 16 Closed Hi-Hats.

  Everything was recorded at 96 kHz / 32-bit float and captured via the machine's individual outs with no unwanted digital clipping. Two ZIP downloads are offered, a full-fidelity 96 kHz / 24-bit WAV pack and a smaller 44 kHz / 16-bit WAV pack, and the samples use a clear naming convention for workflow integration.

  The pack is free for personal use under the included license. AudioRealism notes that the TR-808 is a registered trademark of Roland Corporation and that this pack is independent with no affiliation.
specs: |-
  - 195 total samples from the TR-808 across all core analog voices
  - 25 Bass Drums and 25 Snares with rich analog depth and dynamic response
  - Toms and congas: Low, Mid and High variations (5 each of LT, MT, HT, LC, MC, HC)
  - Metallic percussion: 16 Rimshots, 16 Claps and 16 Cowbells
  - High-end voices: 25 Cymbals, 5 Open Hi-Hats and 16 Closed Hi-Hats
  - Auxiliary percussion: 16 Claves
  - Recorded at 96 kHz / 32-bit float
  - Delivered as 96 kHz / 24-bit WAV and 44 kHz / 16-bit WAV ZIP archives
  - Captured via individual outs with zero unwanted digital clipping
  - Clear naming convention for easy workflow integration
  - Free for personal use under the included license
