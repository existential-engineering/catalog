description: Albion ONE is a renowned, industry-standard orchestral sample library that provides all you need to make film music.
details: |-
  Albion ONE is a renowned, industry-standard orchestral sample library that provides all you need to make film music. This title comprises a 109-piece orchestra, accompanied by a thunderous cinematic percussion section, recorded at the world-famous Lyndhurst Hall at AIR Studios in London. Plus, there are warpable loops designed by award-winning engineers and an enormous steam synthesiser.

  Albion ONE contains high dynamics and energy while being versatile across multiple genres. Choose from four microphone positions and a high range of articulations including our esteemed legatos, for extra control. Equally suited to first-timers and established composers alike, this industry-standard product is the perfect place to start and go as deep as you want.

  The Albion ONE orchestra was recorded by award-winning engineers, utilising world-class equipment: priceless ribbon and valve microphones, Neve Montserrat preamps, the world's largest 88R Neve console, and pristine 2" tape, all before being converted with top-tier Prism AD converters at 96k. Spitfire Audio assembled 109 of London's finest musicians, recorded performing a variety of techniques, including short notes, long notes, tremolos, pizzicatos, and more. Each method was captured across a range of notes and by section (Brass Low, Mid, and High; Woods High and Low; Strings).

  Albion ONE includes Spitfire Audio's renowned legato articulations, which blend adjoining samples to deliver exceptional musicality, alongside runs that trigger the recording of a section performing phrases. For microphone positions, you have four choices (close, tree, outriggers, and ambient) to match the style and scale of your music. Additionally, a popular 'ostinatum' designer is included, enabling the swift creation of dynamic, tense, or action-packed rhythmic passages.

  The Darwin Percussion Ensemble covers some of London's largest drums, including hi sticks, low taikos, toms, and the newly added Easter Island hits, all accessible through the Kickstart engine. Brunel Loops is a module built on the eDNA engine that lets you warp, sequence, affect, and blend two input sources in perfect sync, and Stephenson's Steam Band houses heavily processed orchestral material in the same eDNA engine as a limitless orchestral-synth tool for pads and effects.
specs: |-
  - 109-piece orchestra recorded at Lyndhurst Hall, AIR Studios, London
  - 63 articulations
  - Four microphone positions: close, tree, outriggers, ambient
  - Legato articulations plus recorded runs
  - Ostinatum pattern designer
  - eDNA sample-synthesiser engine
  - Kickstart percussion mapping engine
  - Darwin Percussion Ensemble including hi sticks, low taikos, toms and Easter Island hits
  - Brunel Loops: warpable, sequenceable loop module
  - Stephenson's Steam Band orchestral-synth module with 100 new presets
  - Super loud FFF dynamics for brass, horns, trumpets and strings (XL patches)
  - 15 combination patches blending techniques and instrument groups
  - Cog patches and Time Machine patches
  - Includes Kontakt Player (free download)
  - Spitfire Audio App required
  - NKS-ready: pre-mapped with visual guides for key switches, splits and mapping feedback
  - Recorded with ribbon and valve microphones, Neve Montserrat preamps, 88R Neve console, 2" tape, Prism AD converters at 96k
  - 55.7 GB installed size; 111.4 GB disk space required during install
  - Kontakt Player 5.6.8 or higher required
  - macOS 11 to macOS 26 (Kontakt 8.8 requires macOS 14 minimum); Intel and Apple Silicon supported
  - Windows 10 or Windows 11 (latest service pack, 64-bit)
  - Minimum: 2.8GHz quad-core i5 or AMD Ryzen 5, 8GB RAM
  - Recommended: 2.8GHz six-core i7 or AMD Ryzen 7, 16GB RAM
  - 32-bit systems are not supported
