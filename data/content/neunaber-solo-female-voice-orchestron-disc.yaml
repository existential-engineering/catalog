details: |-
  This disc is compatible with Orchestron and Panoptigon players. SOLO FEMALE VOICE is an entirely NEW sound for the Orchestron. Tara Busch of analogsuicide.com lent us her vocal cords once again for a sound similar to, but not exactly the same as the vocal sound on our Optigan "Minimalism" disc. This sound features a consistent "ahh" over the entire range. PLEASE NOTE : This disc is compatible with Orchestron and Panoptigon players. This disc WILL NOT work properly in an original Optigan ! It WILL play, but the sounds will NOT be mapped correctly to the keyboard- they will be mapped mostly haphazardly across the chord buttons. Please don't order this disc expecting to easily use it in an Optigan. Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility
