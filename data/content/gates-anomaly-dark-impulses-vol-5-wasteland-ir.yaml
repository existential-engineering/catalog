id: kCM6zWn7KXrF0ABnvfcxu
name: Anomaly Dark Impulses - Vol. 5 - Wasteland IR
manufacturer: gates
primaryCategory: impulse-response
categories:
  - effect
description: Anomaly wasteland IR is the fifth volume of impulse response files
  generated from the anomaly sounds. All IR files are stereo wav files.
details: |-
  This volume contains ir's made from the wastelands folder of anomaly vol. 1:
  wasteland - two folders of 94 sounds, 365 mb total.

  The fog convolver presets are different for the experimental and reverb ir's.
  For the reverb, the length of the wav file is between 1.6 and 2.10 seconds.
  You can extend the time, as the full ir file is available.

  For the experimental, all presets are set up as fog convolver defaults. The
  entire length of the wav is there.

  Audio demos are available.
specs: |-
  - Stereo wav files
  - 7 to 12 seconds long
  - Impulse response files
  - Experimental IR files at -11 dB
  - Reverb IR files at -15 dB
  - Fog convolver presets
  - True reverb presets
  - 188 fog convolver presets
  - 15 true reverb presets
  - 203 total presets
  - Reverb wav file length 1.6 to 2.10 seconds
