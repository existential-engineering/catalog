description: A Foley catalogue combining six SoundBits libraries (Antiques, Just Impacts, Just Stones, Open & Close, Rummage and Blacksmith Foley), adapted to work out of the box in Reformer Pro.
details: |-
  The SoundBits Foley Sound Effects Library combines six SoundBits libraries, Antiques, Just Impacts, Just Stones, Open & Close, Rummage and Blacksmith Foley, now bundled together and fully adapted to work straight out of the box in Reformer Pro.

  Featuring a total of 173 Reformer Pro sound packs and 4,233 ready-to-use Foley sounds, this collection offers a versatile Foley catalogue for sound design projects. It covers a comprehensive range of samples with several variations across antique objects, vintage machinery, metal, stone and wood impacts, household items, clothing and materials, and sounds from the blacksmith.

  Sound categories included in this library: Antiques Foley (antique furniture, cameras, cash register, clocks, doors, household items, metal objects, musical instruments, vintage electronics and machinery, typewriter), Blacksmith Foley (metal chains, plates and pole, coal shovel, forging, hacksaw, blade sharpening, smouldering metal, wooden cartwheel, tools), Just Stones Foley (fine debris, hit and drop, roll and bounce, scrape and jolt, stone to water), Just Impacts Foley (metal, wood, hits, crashes, scrapes), Rummage Foley (broken glass, cassette tapes, clothing and bags, coins, kitchen cupboards, handbag, keys, mixed media, paper, plastic, junk) and Open and Close Foley (books, cardboard box, firetruck lift, screwcap, umbrella, zippers, oven grill).

  The purchase contains two downloads: a zip file with all source sound effect asset files plus a metadata PDF, and an installer for the integrated Reformer Pro library including assets and presets.

  "Over the years, I have recorded myriads of unique and sonically interesting objects... Especially working on the Antiques library was very exciting with many unexpected and thrilling sonic discoveries that only things with many years of service are capable of producing." - Saro Sahihi (SoundBits)
