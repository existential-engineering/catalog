name: Angel 4x12 NeoCream
manufacturer: overloud
primaryCategory: impulse-response
website: https://www.overloud.com/products/angel-4x12-neocream
description: Choptones supercab ir library created by capturing a engl* e412vsb
  4x12 with celestion* neo creamback speakers.
details: >-
  Angel 4x12 neocream is the choptones supercab ir library created by capturing
  a engl e412vsb 4x12 with celestion neo creamback speakers. It is an extensive
  and systematic capture created with 11 microphones, 8 to 16 positions each
  microphone and multiple mic preamps, for more than 300 irs globally.


  The cabinet is slanted front, closed back, solid siberian birch plywood
  construction, a standard for metal guitarists and not only. The speaker, born
  the get the magical tone of a traditional creamback with the half of the
  weight, the g12 neo creamback keeps great low end and punchy midrange with a
  refined top end provided by a neodimium magnet.


  Captures are performed with a motorized mic stand in order to have consistent
  measurements across libraries.


  The library is created for the th-u supercabinet, which allows to: graphically
  browse the irs in the library, blend them together, craft new cabinet tones
  with the unique multiband mode, use the ir in the software, and export the irs
  in .wav, compatible with the software ir loaders and all the major hardware
  modelers.


  Every microphone has been moved to 4 different horizontal position (cap, cap
  edge, cone and cone edge) and two distances, for a total of 8 irs each. For
  some microphones, the set of 8 measurements has been repeated with the
  microphone off axis (45 deg). All the measurement set has been repeated twice,
  with two different mic preamps: a neve 1073 and a german preamp.
