description: Ableton Drum Racks for Superior Drummer 3 Seventies Rock EZX
  features separate Ableton drum racks for all factory presets for the toontrack
details: |-
  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all seventies rock kit factory presets in superior
  drummer 3 from ableton push controller device browser.

  Colour coded pad design for visual performance and finger drumming. All our
  racks use consistent drum rack coloring so you can visually and immediately
  spot your snares from your crashes. All instrument articulations ready to go
  in one layout using ableton push 64 pad layout mode.

  Singleout presets featuring 5 ableton drum racks for all factory presets
  single audio output to single ableton track. Multiout presets featuring 5
  ableton drum racks for all presets in multiple audio channel output from the
  plug in to multiple ableton audio tracks using the multi output ableton
  template also provided designed for the kit presets.

  Use the template racks and extend to your own toontrack ezdrummer seventies
  rock ezx presets, swapping out individual sounds or articulations. You are
  100% ready to go with the factory presets but there is no limitation to
  creating your own presets from these templates.
specs: |-
  - Ableton drum racks
  - Toontrack superior drummer 3 integration
  - Ableton push support
  - 10 Ableton drum racks
  - 5 Ableton live templates
  - 64 pad layout mode
  - Colour coded pad design
  - Singleout presets with 5 Ableton drum racks
  - Multiout presets with 5 Ableton drum racks
  - Multi-channel audio output routing
  - Individually labelled drum rack pads
  - Macro controls
  - Multi-track audio routing
  - macOS and Windows compatibility
