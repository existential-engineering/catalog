details: |-
  This disc is compatible with Orchestron and Panoptigon players. BASS CLARINET is an entirely NEW sound for the Orchestron. It's an actual acoustic bass clarinet, played and recorded specifically for this release by Ralph Carney. Please excuse the keyboard work on this demo, which is just a quick noodle to demonstrate the sound! PLEASE NOTE : Orchestron discs WILL NOT play properly in an Optigan ! They WILL play, but the sounds will NOT be mapped correctly to the keyboard- they will be mapped mostly haphazardly across the chord buttons. Please don't order this disc expecting to easily use it in an Optigan. Important Note:

