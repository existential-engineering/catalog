description: Beatmaker chord resource serves up an extensive collection of
  chords to bring you a fresh load of inspiration for your productions.
details: |-
  For starters, we've mapped out every major and minor triad in every inversion.
  Tried and tested over decades of popular music and featuring on many a hit
  record, these are your bread and butter chords to get things going. Moving
  onto 7th chords in all inversions, a staple of lofi, jazz and countless other
  genres, an extra touch of harmony awaits your beats with the rich flavours
  offered by this essential chord type.

  Next up come extended chords for when you are looking to journey into more
  adventurous territory with add 9, 9ths, 11th and 13ths. Only a single
  inversion are included for these but the creative possibilities are limitless,
  add or subtract notes and mix up octaves to carve out your own complex chord
  progressions. To make sure we've covered everything, there's also suspended
  chords in both triad and 7th versions to make your progressions move even more
  smoothly.

  We didn't want to leave it at just that so also brought in the more exotic
  harmonic minor and melodic minor modes full of 7th chords in every inversion.
  These will bring that extra bit of spice to your beats, sprinkling unique
  flavors wherever they are placed.

  If all of this wasn't inspiration enough, you also get 48 ready made
  progressions to play with, 24 major and 24 minor covering every key. The first
  set are diatonic, meaning every chord directly relates to the key while the
  second set venture ever-so-slightly off key to introduce borrowed chords from
  other keys to make your progressions stand out even more.
specs: |-
  - 144 cthulhu presets
  - 12 open triads
  - 12 closed triads
  - 12 open 7ths
  - 12 closed 7ths
  - 12 extended (add 9, 9ths, 11ths, 13ths)
  - 12 suspended (triads, 7ths)
  - 12 harmonic minor 7ths
  - 12 melodic minor 7ths
  - 24 major chord progressions (12 chords per key)
  - 24 minor chord progressions (12 chords per key)
  - 384 MIDI files
  - 528 total files
  - Latest version of cthulhu required
