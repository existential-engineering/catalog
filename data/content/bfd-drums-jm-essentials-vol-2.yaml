details: |-
  JM Essentials Vol.2 is a bfd groove pack that provides a realistic set of
  reggae, funk, disco, swing, rockabilly, nu-metal and punk patterns for
  fxpansion's bfd3, bfd eco and bfd2 acoustic drum software instruments.

  Produced by experienced composer jacques mathias, jm essentials vol.2 contains
  expressive patterns that offer a realistic foundation on which to build your
  productions.

  The included grooves are ready to be used as-is or edited to your requirements
  and feature the convincing feel of a real drummer.

  Each supplied palette features up to 50 groove and fill variations, with the
  pack containing over 1300 patterns in total.

  Palettes are supplied in bfd3, bfd eco and bfd2 versions.
specs: |-
  - Groove pack for bfd3, bfd eco, and bfd2
  - Over 1300 patterns total
  - Up to 50 groove and fill variations per palette
  - Reggae, funk, disco, swing, rockabilly, nu-metal, and punk patterns
  - Expressive drum patterns
  - Bfd3 v. 3.2.1.2 or above required
  - Windows 7 or above compatible
  - Os x 10.8 or above compatible
  - 23 GB disk space required
  - Internet connection for download and authorization
