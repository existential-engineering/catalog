details: |-
  'atlas - chillwave loops' from ModeAudio fuses lush, shoegaze-style guitars
  with warm, analog electronics and dynamic live drums to deliver a 563mb trunk
  of audio spilling over with organic energy and soaring, ethereal spirit. This
  weighty, royalty-free collection of 416 audio loops, drum samples and MIDI
  centres around a pristine set of bass and electric guitar riffs presented in
  both effected and dry versions, expertly performed and radiating that
  mesmeric, blissful vibe that is the very foundation of chillwave.

  From tight, palm-muted riffs and lilting lead licks to delay-drenched chords,
  driving basslines and beyond, this set of 4 and 6-string inspiration will take
  your productions on a lasting voyage to the heart of downtempo and chill.

  Modifying the classic rock setup of drums, bass and guitar by introducing
  dusty, analog electronics to the proceedings, the 203 loops included encompass
  thundering drums, searing synth leads, yawning pads and a wash of subtle noise
  textures, embracing the best of both the acoustic and electronic spectrums.

  Accompanying the loops are 68 drum samples, packed with the explosive impact
  of acoustic percussion and the deep tone of electronic drum machines. 76 key
  and tempo-labelled MIDI patterns and 69 synth and guitar tail samples complete
  the pack, providing you with a fully-featured chill production toolkit.
