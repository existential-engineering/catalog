details: |-
  Performed by amber balltzglier, atelier series amber is the first of its kind
  a true, triple-tracked legato vocal library. That means we recorded all of the
  performances three times (per vowel) and stacked them on top of each other.
  This way the subtle inconsistencies in speed/pitch between each vocal take can
  play off each other, resulting in a performance/sound that resides somewhere
  between a solo vocal and a choir.

  Initially intended for pop settings, we quickly learned that it's
  uniquely-suited for cinematic, edm and world genres as well. In addition to
  the natural 3 ensemble legato patches, we created faux 9 ensemble versions;
  massive lead instruments intended for epic/dramatic passages.

  With all the legato patches, if you hit velocity 100 or above, it triggers a
  consonant attack: lah for the ah's, woh for oh's and doo for ooo's. Also
  included is awakenings a keyswitch suite of seven different designed pads
  sourced from the vocal recordings.

  Atelier series: amber by musical sampling is soundware (samples or presets
  that load into other products) for macos and windows. Requires full retail
  version of kontakt 5.8.1 or higher. Free kontakt player not supported.
  Recorded in 48khz / 24-bit 1.3 gb compressed ncw format.
specs: |-
  - Triple-tracked legato vocal library
  - 3 ensemble legato patches
  - 9 ensemble versions
  - Velocity-triggered consonant attacks
  - Keyswitch suite of seven pads
  - Kontakt 5.8.1 or higher required
  - 48khz / 24-bit recording
  - 1.3 GB compressed ncw format
