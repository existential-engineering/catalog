description: Sound Expansion for Lush 2
details: |-
  Ripple is a premium soundbank featuring 64 uniquely crafted presets for the Lush 2 synthesizer, created by renowned sound designer BigTone (Nico Herz of Bigtone Soundworks), known for his signature analog-infused aesthetics. The collection offers an inspiring blend of expressive pads, nostalgic sequences, and deeply detailed sound structures with a distinct retro-modern vibe.

  Signature BigTone pads are rich in movement, tone, and modulation, while arpeggiated sequences evoke an 80s/90s sense of nostalgia with modern clarity. Many presets are designed as complex splits, layering multiple expressive elements across the keyboard for dynamic, evolving performances, with every one of the 64 presets a standalone, non-repetitive creation.
specs: |-
  - 64 exclusive presets for the Lush 2 synthesizer
  - Signature cinematic pads with rich movement and modulation
  - Arpeggiated sequences with a retro 80s/90s character
  - Complex keyboard-split presets layering multiple elements
  - Requires Lush 2 version 2.1.0 or newer
