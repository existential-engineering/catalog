details: |-
  'Serum Essentials Vol 7 - Bass House' from baltic audio is aimed at producers looking for the sound of current Bass House. It holds 64 top-quality presets for the Serum synthesizer, including hand-crafted basses, leads, plucks and more.

  Each preset is programmed by a professional sound designer, with every parameter tweaked in detail, as a source for new and commercial sounds within a composition.

  The material can also be used for genres like Future Bass, Dubstep, Bigroom and more.

  In addition, 39 MIDI files taken from the demo are included.

  Please note: The drums and some FX used in the demo are not included in this product.
specs: |-
  - 64 Presets for Serum
  - 41 Basses (Presets)
  - 7 Leads (Presets)
  - 6 Synths (Presets)
  - 5 Plucks (Presets)
  - 4 Pads (Presets)
  - 1 Arp (Presets)
  - 39 MIDI Files
  - Multi-genre
  - PC/Mac Compatible
  - 100% Royalty-Free
  - Requires Xfer Records Serum v1.3.2.8 or higher
