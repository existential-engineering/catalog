details: |-
  Riff Vault is a series of premium curated guitar sample packs built for musicians, producers, and composers working across a wide range of genres. Each pack goes deep into a specific style, offering riffs, grooves, and chord progressions that actually capture how the genre sounds and feels.

  Riff Vault - Modern Metalcore is the third release in the Riff Vault series, built specifically for one of the most emotionally charged and sonically varied subgenres in heavy music today. The thing about modern metalcore is that it is not one sound. Bad Omens sounds nothing like Architects. ERRA sounds nothing like Spiritbox. The genre spans melodic vulnerability, technical aggression, and cinematic weight, sometimes within the same record. This pack tries to cover that full range.

  Every sample in Riff Vault - Modern Metalcore is a real human guitar performance, recorded by Graham Terry on his Jackson. Not a MIDI simulation. Not a virtual instrument approximating what a guitarist might do. Every pick attack, breakdown hit, and chord transition was performed with the genre's actual sonic vocabulary in mind.

  Mix-ready tones: two fully processed, mix-ready tones come with every rhythm sample. Tone 1 is a 6505-style amp, probably the amp most associated with modern metalcore and post-hardcore over the past two decades. Tone 2 is a powerful Dual Rectifier-style sound. Both are dialed specifically for the genre and ready to drop into a mix without touching anything.

  DI performances: every rhythm performance includes a left mono DI, a right mono DI, and a pre-combined stereo DI. Run them through any amp sim you already use. The stereo DI makes reamping straightforward, and the DIs pair naturally with any Toneforge plugin.

  True stereo width: each riff, chord progression, and breakdown features separate left and right DI performances. That is genuine stereo width, recorded rather than manufactured in post.

  Drop A, Drop C, and Drop G cover the tunings modern metalcore actually uses, from mid-range punch through to extended low-end territory. Tempos of 120, 140, and 160 BPM cover the range from slow breakdown territory to fast, driving passages, and stay close enough that time-stretching between them remains clean.
