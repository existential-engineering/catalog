details: |-
  All In One - Vocal Chops Bundle is a collection of 3 Diginoiz bestselling
  products from the vocal chops series with a discounted price, almost 70% off.

  Modern pop vocal chops 1 contains: 50 loops dry (24-bit wav) and 50 MIDI files
  (mid).

  Modern pop vocal chops 2 contains: 50 loops wet (24-bit wav), 50 loops dry
  (24-bit wav), and 50 MIDI files (mid).

  Modern pop vocal chops 3 contains: 50 vocal chop loops wet (24-bit wav), 50
  vocal chop loops dry (24-bit wav), and 50 MIDI files (mid).

  The bundle includes 250 wav loops (150 dry, 100 wet duplicated with effects)
  and 100 MIDI loops with chords that fit to the chop loops, totaling 713 mb of
  material in 24-bit wav and MIDI format.
