details: >-
  Aetheric is a powerful ambient pad library full of gorgeous pads and natural
  recorded ambiances designed to spark creativity and set a mood within seconds.


  It contains 10 generators, each split into 3 oscillators with individual
  volume controls to sculpt the sound as you see fit.


  Attack and release controls allow you transition from a standard polyphonic
  synth lead into a long, swelling pad - whatever the mood or setting, aetheric
  can provide.


  Dedicated ambient oscillator with real recordings of rain, street noise and
  assorted tape hiss.


  Included snapshot presets.
specs: |-
  - 3-octave pitch span
  - 10 generators with 3 oscillators each
  - Individual volume controls
  - Attack and release controls
  - Built-in reverb
  - Built-in delay
  - Built-in filter
  - Built-in morph
  - Built-in stutter
  - Pitch-bend
  - Automatable interface
  - Ambient oscillator with real recordings
  - Kontakt 5.8 or later (full version required)
  - 4gb of ram (8gb recommended)
  - 3.24gb hdd space
