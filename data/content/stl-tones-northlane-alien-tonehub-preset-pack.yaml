details: |-
  Northlane are an Australian metalcore band formed in Sydney in 2009, with six studio albums to their name and three ARIA Awards for Best Hard Rock or Heavy Metal Album.

  This pack centers around the explosive tones and textures from their 2019 ARIA-winning album Alien. Engineered by Chris Blancato, the band's fifth studio album was the culmination of a career's worth of experience in both tone crafting and songwriting, moving them into new sonic territory to critical acclaim.

  Northlane's pack contains 45 guitar captures and 7 bass captures.
