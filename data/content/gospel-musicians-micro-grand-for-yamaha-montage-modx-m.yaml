details: |-
  Introducing the Micro Grand Sound Library for Yamaha Montage and Compatible Synthesizers

  Every Gospel musician recognizes the iconic tone of this piano and its accompanying electric pianos, which have been staples in countless classic recordings. This piano sound embodies the soulful warmth and character of old-school Gospel music, bringing a nostalgic yet versatile element to your performances. Our library integrates seamlessly with your Montage, MODX, MODX+, and M-series synthesizers, requiring no additional Flash RAM. Once installed, the sounds remain in your synthesizer even after powering it off, offering convenience and reliability for gigging musicians and studio setups alike. Rediscover the legacy of Gospel music with the Micro Grand —a library crafted to keep history alive in your hands.
