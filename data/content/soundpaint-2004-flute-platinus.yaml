details: |-
  Pure Platinum Passion

  Platinus is a bright and beautiful orchestral flute, featuring our new true polyphonic H.A.L. (Hyper Acoustic Legato) Technology. An emotional and expressive instrument, Platinus features 6 legato types, sustains, trills, short notes, dozens of arcs, and more. The musician we captured displayed a profound, emotional dedication to each note on her instrument. As the notes are brought to life within Soundpaint, that same passion resonates through every key, creating a captivating experience, as though the player is seated beside you. With H.A.L., the flute's playability is effortlessly enhanced, ensuring it produces remarkable sound quality, no matter your playing technique. Platinus includes several vibrato types covering a large range of emotional intensity. If that wasn't enough, you can further dial in the vibrato using our new Rack > Time Module. With 3 microphone positions (Close, Decca, Wide), you can move from an emotional, intimate sound to a distant, dreamy sound, or morph anywhere in-between.
