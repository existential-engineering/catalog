details: |-
  'Reggaeton Club' from baltic audio is a collection of Reggaeton elements, holding drums, percussion, instruments such as guitars and trumpets, 808s and more, plus presets for the Serum synthesizer, combined in 5 construction kits.

  The pack provides the elements needed for Reggaeton and Dancehall tracks.

  Each construction kit contains premixed instrumentation and is built as a source for Reggaeton instrumentals waiting for a vocal topline.

  The included MIDI files, one-shot samples and Serum presets allow further reworking, and the ready-to-use loops and stems allow quick results.

  Please note: The presets require v1.3.2.8 or higher of Xfer Records Serum.
