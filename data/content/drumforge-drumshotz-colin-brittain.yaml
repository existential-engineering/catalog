details: |-
  Drumshotz Colin Brittain is a one-shot drum sample library capturing the signature sounds of producer, songwriter, and mixer Colin Brittain. With credits spanning Linkin Park, Papa Roach, Hands Like Houses, Dashboard Confessional, and Stick To Your Guns, Brittain brings a proven rock and alternative production sensibility to every hit in this collection.

  The library contains 61 total samples broken down into 12 kick drum samples, 33 snare samples, and 16 tom samples. All samples are delivered as individual one-shot WAV files at 44.1 kHz and 24-bit depth, making them immediately compatible with any DAW or drum-triggering software.

  One-shot samples are particularly valued in modern drum production for their ability to supplement or replace live drum recordings. Layering or replacing hits with these samples allows engineers and producers to add punch, consistency, and character without the variability that can arise from live tracking in different environments.

  The product is delivered as an instant digital download with a perpetual license. Customers receive free lifetime updates to the library and have access to unlimited customer support from DrumForge.
