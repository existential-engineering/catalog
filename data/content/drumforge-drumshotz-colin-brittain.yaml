description: Mix-ready one-shot drum samples from producer, songwriter, and mixer Colin Brittain, drawn from his work with artists including Linkin Park, Papa Roach, and Dashboard Confessional.
details: |-
  Drumshotz Colin Brittain is a signature one-shot drum sample collection from producer, songwriter, and mixer Colin Brittain, whose credits include Linkin Park, Papa Roach, Hands Like Houses, Dashboard Confessional, and Stick To Your Guns.

  The library is snare-heavy, offering 33 snare samples alongside 12 kick drum samples and 16 tom samples. The samples arrive mix-ready, intended to be layered with existing sample libraries or raw drum recordings to add punch and consistency.

  All 61 samples are delivered as 24-bit / 44.1 kHz WAV files for use with any drum triggering program or DAW.
specs: |-
  - 61 one-shot drum samples total
  - 24-bit / 44.1 kHz WAV format
  - 12 kick drum samples
  - 33 snare samples
  - 16 tom samples
  - For use with any triggering program or DAW
