details: |-
  'Essential Pop Moments Vol 4' by baltic audio contains five ready-to-use construction kits that offer songwriters and producers material for writing vocal toplines or adding guitar samples to an existing song.

  The included electric and acoustic guitars are recorded for use in commercial Pop music, and also work in House, EDM or Country music.

  Besides the guitars, the construction kits contain loops and one-shots for most of the sounds used, such as drums, basses and synths.

  The loops are available as DRY, WET and WET TAIL versions and, together with the MIDI files, allow the existing sounds and melodies to be adjusted.
specs: |-
  - 5 Construction Kits
  - Guitar Adlibs, Strums, Riffs, Fills & More
  - Electric & Acoustic Guitars
  - 168 Loops sync to BPM (DRY, WET and WET TAIL versions in WAV)
  - 106 Oneshots (WAV)
  - Key-labelled
  - Loops & Oneshots include Drums, Guitars, Basses, Synths and more
  - 15 MIDI Files
  - 550+ MB of Content
  - 44.1 kHz/24-Bit
  - PC/Mac Compatible
  - 100% Royalty-Free
