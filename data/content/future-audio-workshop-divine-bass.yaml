details: |-
  Sound design and mixing expert Sean Divine brings more of his meticulously crafted 808s and subs to SubLab XL.

  Sean specializes in sound design and mixing and mastering. He's been instrumental in developing SubLab XL as well, acting as a consultant on SubLab XL features during development and designing some of the factory sounds and samples.

  That means you can expect every sub and 808 in this pack to sit just right in the mix while filling out the low end.

  This pack was created by producer, sound designer, mix engineer, and YouTube educator Sean Divine.

  Once your purchase is complete, the pack shows up in your FAW account. Download the zip file and follow the instructions on how to import the sounds into SubLab XL.
specs: |-
  - 10 patches for SubLab XL
  - Patches: Basement Life, Captain Crunch, Darkest Hour, Destructo Glide, Lost and Found, Sinister Saw, Stanley Screamer, Thicc Bottom, TriForce, Xtension
  - Delivered as a zip download from your FAW account, imported into SubLab XL
