details: >-
  8-bit drum kits is an extensive collection of authentic sounding sample drum
  kits that faithfully reproduce the 8-bit sounds of classic video game drum
  tracks. Perfect for 8-bit music, chiptune, or tracks that need retro flare,
  combining 8-bit kicks, snares, hihats, toms, cymbals and percussion.


  The 8-bit drums in this pack focus on the classic triangle wave and noise
  combination drum sound that was used to mimic the sound of real drums on the
  original console sound chip. Some of the kits in this pack are based on the
  drum sounds from popular games, while others are custom kits that have the
  same sonic qualities.


  This pack contains: 94 8-bit drum kits (72 main kits + 22 bonus alternate
  kits). 1504 8-bit drum samples (kick, snare, hihat, tom, cymbal, shaker &
  percussion). 94 drum kit patches for native instruments maschine, ableton
  live, fl studio, battery, kontakt, mpc software, logic pro exs24/sampler, and
  tal-sampler. 24-bit, 44.1 khz wav files.


  8-bit drum kits is part of the 8-bit drum kits bundle and the 8-bit
  instruments & drums bundle.
