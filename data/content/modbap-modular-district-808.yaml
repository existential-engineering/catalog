details: |-
  Descriptions

  Digital Download Only. Dirty derivative 808 loops and one shots. District 808 is a sample pack of creatively processed and sampled 808 drums and loops. District 808 was made using various analog filtering and coloring techniques to make these otherwise pristine and familiar samples a bit more filthy in the best way possible. The result is a different take on the classic 808 sound. If you can imagine 808 drums sampled into an SP1200 and further processed with a classic ladder filter and animated for movement and character, thats District 808.
