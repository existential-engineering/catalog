details: |-
  Riff Vault is a series of premium curated guitar sample packs designed for musicians, producers, and composers across a wide range of genres. Each pack within the Riff Vault series offers meticulously crafted riffs, grooves, and chord progressions, capturing the essence of specific musical styles. Whether you're seeking the polyrhythmic complexity of djent, the aggression of metalcore, or the raw energy of hard rock, Riff Vault provides high-quality, versatile guitar samples that inspire creativity and elevate your productions.

  Riff Vault - Architects of Djent is the first specialized collection within the Riff Vault series, dedicated to the intricate and powerful world of djent. This pack features expertly crafted riffs, grooves, breakdowns, chord progressions, leads, and guitar sound effects that embody the technical precision and intense energy of the genre. Designed for musicians and producers who crave complexity and depth in their compositions, Architects of Djent offers a deep dive into the core elements that define this modern metal subgenre.

  The sample pack features fresh, progressive elements written and recorded by Andromida, on his customized multiscale LTD M-1008 with Guitarmory pickups. His innovative approach ensures a diverse array of powerful riffs and luscious ambiences.

  Mix-ready tones: drag and drop mix-ready performances into your DAW for quick and easy riff building, song writing, and additions to your session. Choose from 2 refined guitar tones, perfected by Andromida.

  DI performances: combine your favorite amp sims with the DI performances to add a unique twist to the pack, giving you precise control and unlimited tonal options. All samples are provided as individual DI files, along with two distinct tone variations. Use the tones provided, or run the DIs into your favorite Toneforge plugin.

  Unique left and right performances: each riff, chord progression, and breakdown features separate left and right performances, providing true stereo width and enhancing the authenticity and impact of your mix.

  Extended range tuning: Drop D, Drop E (tuned an octave below standard E), and Drop F# tunings, delivering deep, resonant tones that push the boundaries and deliver the heaviness required for djent. Comprehensive BPM coverage at 110, 130, and 150 BPM covers various song tempos.

  Now including bass MIDI: add expertly programmed bass to the breakdowns, chord progressions and riff files included in this pack. Drop the MIDI files into your favorite virtual bass instrument library.
