details: |-
  This groove, taken from the Optigan master tape archive, was played by the same group that played the "Rock & Rhythm" groove. Our guess is that this one was "too heavy" for the Optigan back in the day, so it stayed on the shelves. Referred to simply by the working title "Contemporary," we've chosen to call it "Fuzz Rock." We've paired it with a fuzz-tone lead guitar on the keyboard, played by Peter Melton. Chords: Rock Combo Keys: Fuzz-Tone Lead Guitar SFX: 1 - Riff 1 2 - Riff 2 3 - Riff 3 4 - Drums 1 5 - Drums 2 Lead Guitar by Peter Melton Edited and mastered by Pea Hicks Disc design and mastering by Robert Becker

