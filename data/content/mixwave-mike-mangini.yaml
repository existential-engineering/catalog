  array of cymbals. Built for Kontakt with a mixer-style interface including
  reverbs and master channel compressor, EQ, and tape saturation.
details: |-
  A musical powerhouse with an unparalleled career. From his Grammy wins to his unworldly drumming skills, his journey through music is nothing short of remarkable. He's not just a drummer, but a skilled composer, contributing to chart-topping albums while even breaking into unexpected genres. Tasked with meticulously sampling his drum arsenal in its entirety, we were able to achieve something greater than anticipated; a vast, yet versatile orchestral-like collection of sounds. Introducing, MixWave: Mike Mangini .
