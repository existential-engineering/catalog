details: |-
  Astral shine expansion for parawave audio's rapid synthesizer contains 116
  presets (over 300 layers) and 1gb of original multisample and wavetable
  content. The presets are suitable for modern contemporary electronic dance
  music production, chill out, ambient, breakbeat, future bass, future house,
  future goa.

  Each patch has extensive modulation settings for velocity, modulation wheel,
  and nearly all macros are assigned. Great care went into making sure these
  presets sound dynamic and lively when played on a MIDI keyboard.

  The soundset is full of lush sounding pads mixed with beautiful sounds of
  nature, from the woods, sea creatures like whales and dolphins, and otherwise
  a wealth of calm and relaxing sounds. There are also around a dozen one note
  tracks, mini songs, that can help start a new track. The vocal pads are
  exceptionally unique and sound beautiful playing lush chords. There is also a
  wealth of tastefully designed plucks and leads.

  Nearly all of the patches have modulation destinations for the modwheel and
  extensive destinations to the macros. In addition, nearly all of the patches
  have detailed velocity settings so they will sound great playing on a
  keyboard. They will feel more alive and dynamic.

  Patch breakdown - 116 patches: atmospheres: 6, basses: 11, one note tracks:
  12, effect: 3, gated: 4, vocal pads: 8, leads: 35, pads: 13, plucks: 26,
  flutes: 2, vocal: 1. Potential genres: cinematic, hybrid cinematic,
  soundtrack, game music, progressive trance, psy/goa, ambient, chillout,
  psybient, uplifting, edm.
specs: |-
