details: |-
  Blue box - state-of-the-art sound effects sfx set mixed mode wav / audio. With
  an incredible variety of sounds, blue box represents one of the world's most
  impressive sound libraries. Diversity with authentic sound FX distinguishes
  this box from all others.

  Made for film and multimedia production this library is a treasure trove for
  ambient music and commercials.

  Vol1 train traffic: shunting trains, (passing) trains, horns, train station
  atmosphere, starting the train engine, wild west train, trams: ringing the
  bell, passing, door, ticket control.

  Vol2 street & traffic: bicycle bells mix, chinese bus with radio, bus stop,
  car tunnel, on wet roads, engines, car washes, screeching tires, urban
  atmosphere / caribbean / london / milan, gravel path, windshield wipers.

  Vol3 road & traffic 2 & shipping: thai city traffic, various means of
  transport and vehicles, mix of horns, trucks, motorcycles, motor boats,
  ferries, rowing boats, racing boats, harbor with dry dock, departing ferry.
