details: |-
  Jeremy Popoff is the guitarist and co-founder of rock band Lit, best known for their 1999 hit "My Own Worst Enemy" and the international success of albums like A Place in the Sun and Atomic . Throughout the band's career he has played a pivotal role in shaping their sound as both songwriter and guitarist, alongside his own collaborations and songwriting projects.

  Jeremy's guitar tone is unmistakable: built on a high-gain, cranked Marshall stack with crystal-clear note definition, made for massive, radio-ready anthems.

  This collection captures his personal arsenal of amps gathered over decades, featuring rare and prototype models no longer in production, along with the essential tones behind the Lit live sound.
