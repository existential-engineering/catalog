details: |-
  Aluminum and white metal are two variations of some percussive sounds made using a waldorf blofeld and a sherman filterbank.

  The sounds are very synthetic, with boomy low end and fast attacks, and despite being quite similar, one is dirtier and more overdriven than the other, thanks to the analogue rawness of the sherman filterbank.

  The pro pack uses 24-bit/48khz stereo wav files, while the free pack is made out of standard 44.1khz 16-bit mono wav files and features less samples (16 in the free pack, 27 in the pro pack).

  Mkii version released with improved samples.
specs: |-
  - 24-bit/48khz stereo wav files
  - 44.1khz 16-bit mono wav files
  - 27 samples in pro pack
  - 16 samples in free pack
  - Mkii version with improved samples
