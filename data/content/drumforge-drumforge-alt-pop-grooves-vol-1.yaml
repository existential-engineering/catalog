details: |-
  Alt Pop Grooves: Vol. 1 is a MIDI groove pack containing 396 drum grooves and fills performed by Nick Cesarz of Vinyl Theatre. The material spans a wide stylistic range, from epic alt rock grooves through to common pop patterns.

  The performances are supplied as MIDI files, so they can be used in any DAW or with any drum plugin, and they integrate directly with the Drumforge Bergstrand and Savior samplers.

  Grooves are organized by individual song sections, which lets producers assemble arrangements quickly and use the pack either as a starting point for new songs or as a way to refresh existing demos. Dynamics and tempo are adjustable to suit the production.

  The pack also works as a practice tool, giving drummers and producers a library of world-class performances to play along with or study.
specs: |-
  - 396 total drum grooves and fills performed by Nick Cesarz (Vinyl Theatre)
  - Covers epic alt rock through to common pop grooves
  - MIDI files for use in any DAW or drum plugin
  - Integrates directly with the Drumforge Bergstrand and Savior samplers
  - Grooves organized by individual song sections
  - Adjustable dynamics and tempo
