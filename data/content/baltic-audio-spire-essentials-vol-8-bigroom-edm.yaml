details: |-
  64 presets for the Reveal Sound Spire synthesizer, aimed at current Bigroom EDM, including hand-crafted leads, basses, plucks, pads and arps.

  Each preset is programmed by a professional sound designer, with every parameter tweaked in detail, as a source for creating new and commercial sounds within a composition.

  The pack can also be used for genres like Progressive House, Future House and Dance.

  In addition, 8 MIDI files taken from the demo are included.

  Please note: the drums and some FX used in the demo are not included in this product. These presets require v1.1 or higher of Reveal Sound Spire.
specs: |-
  - 64 Presets for Spire
  - 20 Leads
  - 14 Basses
  - 12 Synths
  - 8 Plucks
  - 5 Pads
  - 5 Arps
  - Modwheel Assignment
  - 8 MIDI Files
  - Multi-genre
  - PC/Mac Compatible
  - 100% Royalty-Free
  - Requires Reveal Sound Spire v1.1 or higher
