details: >-
  62 aggressive presets by scrubbing monkeys. Aggressive edges is just that.
  Sounds with high energy, thick textures and rich in harmonic content. Each
  preset was meticulously crafted to be dynamically playable and mix ready.


  All presets are very close in volume and allow sufficient head room to further
  process if necessary. All sounds include mod wheel, channel pressure and front
  panel modulations.


  This bank is a great way to learn your way around fathom's wave draw and wave
  table oscillators. Most of the patches oscillators consist of either custom
  wave tables, unique wave-forms or in some cases both. These wave tables and
  waves-forms can be stored separately and used in your own creations.


  The category breakdown is as follows. 5 leads, 11 basses, 12 keys, 24 pads, 2
  organs, 2 brass, 3 sequences, 3 sound effects.


  Each one has been carefully crafted to be the kind of sound you can build a
  hit around, especially if you are creating any kind of electronic dance music
  or ambient tracks. Moreover the designer has a cool habit of programming the
  mod wheel on most presets to morph the sound into an entirely new set of audio
  characteristics.
