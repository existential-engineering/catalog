details: |-
  This acoustic guitar groove also comes from the Optigan master tapes. There's no shortage of acoustic guitar sounds on previous Optigan discs, but this one features a unique 6/8 feel. We've paired it with a variety of drum and percussion grooves, also from the Optigan master tapes. On the keyboard is the Orchestron Solo French Horn sound. This is the eighth and final original Orchestron sound from the 1970s to be ported to the Optigan. Chords: Acoustic guitars in 6/8 Keys: Solo French Horn SFX: 1 - Drums 1 2 - Drums 2 3 - Drums 3 4 - Ride Cymbal 5 - Shaker Edited and mastered by Pea Hicks Disc design and mastering by Robert Becker

