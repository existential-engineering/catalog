details: >-
  Alfama is a sample library featuring a portuguese guitar and nylon guitar. It
  will fit your sound palette beautifully, adding texture and diversity to your
  creations.


  Portuguese guitar: chromatically sampled. 8x round-robin per note. Major and
  minor chords. 24-bit, 44.1 khz sample resolution. 460mb (180mb with ncw
  lossless format).


  Nylon guitar: major and minor chord loops in three different time signatures.
  Chromatically sampled. 5x round-robin per note. Hold function for easy playing
  of chord arrangements. 24-bit, 44.1 khz sample resolution. 330mb (100mb with
  ncw lossless format).
specs: >-
  - Portuguese guitar - chromatically sampled


  - 8x round-robin per note (portuguese guitar)


  - Major and minor chords (portuguese guitar)


  - 24-bit, 44.1 khz sample resolution (portuguese guitar)


  - 460mb (180mb with ncw lossless format) (portuguese guitar)


  - Nylon guitar - chromatically sampled


  - 5x round-robin per note (nylon guitar)


  - Major and minor chord loops in three different time signatures (nylon
  guitar)


  - Hold function for easy playing of chord arrangements (nylon guitar)


  - 24-bit, 44.1 khz sample resolution (nylon guitar)


  - 330mb (100mb with ncw lossless format) (nylon guitar)


  - Kontakt 5 compatible


  - Macos and windows compatible
