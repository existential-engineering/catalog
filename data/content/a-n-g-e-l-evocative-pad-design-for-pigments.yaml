details: >-
  Explore lush pads, evocative and cinematic atmospheres, melodic sequences,
  arpeggiated lines and more in this expansion for arturia pigments 3 by
  hydratek.


  Whether you are into ambient, downtempo, chillout, lofi, synthwave, cinematic
  modern composing or just want a collection of production-ready sounds to form
  the harmonic and atmospheric backbone of your next creation you have got it
  covered.


  This soundpack features a wealth of 100 presets fully macro assigned and 100
  sample loops to inspire you straight away.


  A n g e l - evocative pad design for pigments by hydratek is soundware
  (samples or presets that load into other products) for macos and windows.
