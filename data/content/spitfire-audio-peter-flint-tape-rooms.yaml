details: |-
  Tape Rooms is the culmination of two years of experimentation inspired by electronic music pioneers throughout the 20th Century. At the heart of the instrument is the concept of cycling, taking the beginning and end of a linear process and joining them together, taking something 'finished' and turning it into a beginning.

  "Alongside 110 bespoke presets I have made for the pack is open-ended, allowing you to put any of your own samples into the engine, bringing new life into your old samples. Or, turning your "finished" recordings into the starting point for your next project."
specs: |-
  - File size: 1.42 GB
  - 110 bespoke presets
  - Requires Kontakt Player version 6.7 or higher
  - Preset groups: Echos, Grains, Overdriven, Tape Loops, Pitch Shifts, Wobbles, Articulations, Warps
  - Minimum 8 GB RAM, 16 GB recommended
  - 32-bit systems are not supported
