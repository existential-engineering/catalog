details: |-
  Absynth ocean collective offers a wide range of high-quality absynth 5 presets. The collection spans across 7 unique banks featuring over 780 presets, each filled with a wide variety of melodies and effects.

  From the cosmic sounds of "part of a star" to the funky melodic sequences of "electron spin," to the immersive cinematic vocal effects of "augmented voice fxs," there is something for everyone to experience.

  Whether you're a bedroom producer or a professional sound designer, these presets are a blast to play around and explore. This collection caters to a wide range of tastes and purposes each bank has its own personality, tone, distinct sound and spin.

  Absynth ocean collective is a must-have for anyone who owns native instruments absynth 5 and loves to explore it further.

  Featuring 7 banks for absynth 5: os fx melodic pack, os augmented voice fx, s2i dreamers suite, os electron spin, os part of a star, s2i digital fiction, os elementary forms. Nks support, including audio previews when hosted in maschine or komplete kontrol.
specs: |-
  - 7 banks for absynth 5
  - Over 780 presets
  - Nks support
  - Audio previews in maschine
  - Audio previews in komplete kontrol
  - VST plugin
  - Standalone application
