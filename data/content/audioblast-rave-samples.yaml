details: |-
  Rave Samples is a one-shot sample pack extracted entirely from Rave Generator 3 and all its official add-ons. Featuring 1400 samples, the sound bank is aimed at producers working with samples, loops and ready-to-use audio content for underground rave styles.

  The pack contains more than 256 kicks covering Techno, Hard Techno, Hardcore and Gabber, plus 128 aggressive snares tailored for punch, grit and drive.

  Alongside the drums there is a collection of stabs, bass, leads, claps and chords inspired by 90s rave and modern warehouse sounds.

  Every sound comes directly from Rave Generator 3, including its built-in factory content and all currently released expansion packs, so the pack gives access to the plugin's sounds with no VST required.

  The one-shots are aimed at producers who prefer samples over presets, allowing drag-and-drop use inside any DAW. For layering, stacking and randomized sample playback, Audio Blast recommends using Rave Generator 3 itself.
