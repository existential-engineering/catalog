details: |-
  Produced by eduardo tarilonte, accordions 2 is considered the first choice if you are looking for a realistic and, above all, playable accordion library. Numerous renowned composers and producers rave about the authenticity and expressiveness of this virtual instrument.

  With single steirisch accordion you get a steirisch accordion from eduardo tarilonte's accordions 2 as a single instrument. So if you are looking for an authentic accordion to use in alpine folk productions this single instrument is the right choice.

  Accordion sound from alpine folk music of austria, bavaria, and the italian south tyrol with 3 kinds of bellow shake, 3 different dynamics and 3 round robins, and key and button noises for ultra-realistic performances.

  Recorded chromatically with the pristine sound of a u47 microphone.

  This single instrument was exclusively designed for best service engine 2 and is therefore not compatible with the kontakt player.
specs: |-
  - Steirisch accordion sound from alpine folk music of austria, bavaria, and the italian south tyrol

  - 3 kinds of bellow shake

  - 3 different dynamics and 3 round robins

  - Key and button noises

  - Recorded chromatically with u47 microphone

  - Best service engine 2 compatible

