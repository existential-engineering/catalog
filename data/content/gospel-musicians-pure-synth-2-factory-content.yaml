details: |-
  Pure Synth Factory content is the original factory content that came with Pure Synth Platinum. Now that Pure Synth is minimal cost to try out, you can now purchase all of the expansions separately and the full version is not required for most content. This expansion provides the highest quality of sounds and synths similar to what you would find if you purchased a brand new rompler or synth. Our #1 goal was to create a high quality rompler like feel for a fraction of the price. Our factory presets are full of acoustic, warm analog, wavetable, and layered combis that will inspire any musician from any genre.
