details: |-
  Around bridges features the inner sounds of bridges. The steel components of a
  bridge transmit vibrations caused by passing cars or pedestrians in a
  fascinating manner. Around bridges contains the sounds of excited beam
  barriers, noise barriers, expansion gaps and a lot more steel components that
  bridges are made of.

  Also included are takes of footsteps, rain and wind - ordinary noises that get
  a certain magic when recorded on a handrail. To round up this library several
  high quality ab-stereo ambiences of the acoustical surroundings of bridges are
  included.

  Around bridges live pack contains 70 takes that are accessible as instrument
  racks, as clips or directly from a well structured live set.

  Around bridges universal wav library contains 70 takes with loop points that
  are organised into 10 categories: ambience below / ambience top / beam
  barriers / expansion gaps / footsteps handrails / noise barriers / rain /
  steel structures / wind.
