details: |-
  With bass factory resident sound designer christian laffitte unleashes the
  power of the bass with a vast array of meticulously crafted sounds that
  transcend genres with style. From earth-shaking sub-basses to squeaky upright
  jazz basses, bass factory covers it all.

  Each expertly designed preset reflects christian's attention to detail and
  deep knowledge of bass as an instrument and his holistic mastery of string
  studio's powerful string oscillator engine.

  Bass factory covers a wide variety of genre, from jazz, pop, r&b, edm, rock,
  to all the way up to metal with 24 acoustic basses, 30 slap basses, 20 finger
  basses, 12 synth basses, 6 fretless basses, and 8 arpeggiated synth basses for
  sequencing.

  Discover the irresistible allure of string studio's sonic grain and profound
  richness, allowing the very essence of your compositions to pulse with vibrant
  life.
