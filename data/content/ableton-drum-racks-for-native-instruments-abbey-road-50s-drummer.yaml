details: >-
  This collection of ableton drum racks features all presets for the native
  instruments abbey road 50s drummer factory library.


  Ease of navigation to load all presets from ableton push controller device
  browser. 4 ableton drum racks to instantly load the factory library preset
  with ableton mappings. Color coded pad design for visual performance.
  Optimized for ableton push. Know your rides from your crashes and improve your
  finger drumming. Individually labelled pads to every instrument articulation
  for post performance editing and automation within the ableton live clip
  editor.


  This pack routes all audio output through a single ableton track. Mixing can
  be further enhanced through kontakt abbey road 50s drummer mixer or additional
  ableton audio effects to the track for example the new ableton 10 drum bus.


  Ableton 9.5 or above to use ableton push 2 color pads mode. Native instruments
  abbey road 50s drummer you must purchase, license and install separately
  before installation of this pack.
