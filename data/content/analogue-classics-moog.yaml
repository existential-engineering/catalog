description: "Analogue classics legends: Moog vps avenger expansion with retrovenger skin."
details: |-
  Inspired by legendary Moog synths including minimoog, taurus, and memorymoog,
  this expansion recreates the most typical and authentic analog sounds from
  classic Moog synthesizers. The library was created by selecting the best
  presets from original sounds and plugin resources, maintaining the original
  characteristics of the synths.

  The expansion features 134 presets of pure emulated va sound with no sampling
  except for drums, including luscious pads, power leads, detuning strings, and
  deep funky basses all on the modern synth avenger. With detuning and analog
  drift effects, the total collection includes 173 presets of pure unique analog
  sounds.

  Bonus presets from the analogue classics legends expansions are included,
  along with famous sounds from known pop, rock and synth classics marked with
  the #fam tag. The expansion is perfect for pop, rock, synthwave, new wave,
  electro, dance and retro music genres.

  Macros, aftertouch and mod wheel are assigned across presets for enhanced
  playability and control. The expansion comes with the included retrovenger
  vintage skin for authentic visual presentation.
specs: |-
  - Vps avenger expansion
  - 134 presets
  - 173 total presets
  - Pure emulated va sound
  - No sampling (except drums)
  - Detuning and analog drift
  - Macro assignments
  - Aftertouch assignments
  - Mod wheel assignments
  - Retrovenger skin included
