description: A carefully curated preset pack for the GForce Oberheim SEM, designed by Jordan Passmore to capture the vibrant soundscape of the mid-to-late 80s. The 49 patches blend Italo disco, early industrial, and electronic disco aesthetics.
details: |-
  Step into the vibrant soundscape of the mid-to-late 80s with asSEMbly, a carefully curated preset pack for the Oberheim SEM, designed by Jordan Passmore. Known for his expertise in techno and house music production with analog synthesizers and vintage drum machines, Jordan has crafted this pack to channel the distinctive sounds of an era dominated by synth/samplers like the Emax and Mirage.

  asSEMbly captures the essence of 80s music production, offering a variety of patches that seamlessly blend with the sounds that defined genres like Italo disco, early industrial, and electronic disco. From lush, sweeping pads to punchy basses and dynamic leads, these presets are designed to evoke the nostalgic yet innovative spirit of the 80s. “I know by this time MIDI was king and most people used these contemporary devices for production rather than 70’s analogs, so it was fun to use SEM for these types of patches. It does them very well; it is an outstanding synthesizer no doubt,” says Jordan.

  Drawing inspiration from the classic tones of the era, asSEMbly provides dynamic movement and tonal shifts when manipulated with Macros and Controllers, making it perfect for modern producers looking to infuse their tracks with authentic 80s vibes. Whether you’re recreating the pulsing rhythms of Italo disco, the gritty textures of early industrial, or the melodic flair of electronic disco, asSEMbly has the sounds you need.

  About Jordan Passmore: Jordan Passmore is an electronic musician known for techno and house music production with analog synthesizers and vintage drum machines. He is an active creator and performer, releasing countless tracks and videos. He has partnered with synthesizer brands to create content featuring music produced with their instruments.
