details: |-
  Step into the vibrant soundscape of the mid-to-late 80s with asSEMbly, a preset pack for the Oberheim SEM designed by Jordan Passmore. Known for his expertise in techno and house music production with analog synthesizers and vintage drum machines, Jordan crafted this pack to channel the distinctive sounds of an era dominated by synth/samplers like the Emax and Mirage.

  asSEMbly captures the essence of 80s music production, blending with the sounds of Italo disco, early industrial, and electronic disco. From lush sweeping pads to punchy basses and dynamic leads, the presets evoke the nostalgic yet innovative spirit of the 80s.
