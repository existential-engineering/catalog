details: |-
  Vintage Amps is a collection of impulse responses taken from 17 vintage guitar amplifiers. The responses do not capture the distortion characteristics of the amps. What they do capture is the sound of the internal spring reverbs, along with the equalization and cabinet response of each amp.

  Vintage Amps is included in the Vintage Complete bundle.
specs: |-
  - Impulse responses from 17 vintage guitar amps
  - Captures internal spring reverb, equalization and cabinet response, not amp distortion
  - Sampled model: 1954 B & J Serenader Suitcase Tube Amplifier
  - Sampled model: 1957 Gretsch 6161 Electromatic Dual Twin
  - Sampled model: 1958 Classic Vox Heritage Collection AC30H2 Handwired Guitar Combo Amplifier
  - Sampled model: 1958 Fender Champ 5F1
