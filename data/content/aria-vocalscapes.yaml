description: Sonora cinematic, whose existing kontakt instruments include the
  popular harmonic bloom and poiesis cello, has announced the release of aria.
details: |-
  Aria vocalscapes by sonora cinematic offers an array of ambient, cinematic, and experimental vocals performed by classically trained soprano emma may price, which converge in an easy to use kontakt player instrument for adding beautiful vocal textures, atmospheres or pads to productions.

  At the core of aria vocalscapes lies the new bespoke aria engine, a powerful platform brimming with modulation possibilities, expressive effects, and the ability to manipulate even your own samples with ease. With a simple interface, users can effortlessly browse through a diverse range of articulations from traditional "aah" and "mmh" to heavily processed vocals.

  Select one for each of the two available slots and create ever evolving vocal-based soundscapes using the intuitive integrated xy pad. Users can layer or crossfade articulations, add independent filters and assign any parameter to be controlled by either the x or y axis.

  Aria vocalscapes also offers additional depth with two step sequencers for the filters and per-layer lfos to infuse rhythmic movement and modulation into compositions. Three effects slots and an impressive fx panel which adjusts according to the selected effect allows for experimentation of different combinations to easily fine-tune sounds.

  V1.1 update just released (may 2024) now with 20 fresh new snapshots, new per-layer lfo to pan modulation, an improved user sample import experience and more.
specs: |-
  - Kontakt player v7.7
  - Two articulation slots
  - Integrated xy pad
  - Independent filters per layer
  - Two step sequencers for filters
  - Per-layer lfos
  - Three effects slots
  - Fx panel
  - User sample import
  - Lfo to pan modulation
