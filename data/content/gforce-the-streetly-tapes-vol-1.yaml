details: |-
  The Streetly Tapes Vol 1 is a collaboration between GForce Software and Streetly Electronics, featuring 24 carefully curated tape banks derived from original EMI tape-stock masters. Sounds were recorded via the Skellotron, a bare-bones M400 built to allow detailed adjustment of every component. The pack includes hundreds of patches, many contributed by Dean and Jarrod (I Monster) and Paul Godfrey (Morcheeba).

  Tape banks: 2 Tenor 2 Alto Sax, 8 Choir, Bassoon, Biro Choir, Boys Choir, Cello, Dick Strings, Electric Guitar, Flute, French Accordion, French Horn, GC3 Brass, Glocks & Tubular Bells, Gothic, Halfspeed Brass, M300A Violins, M400 Violins, Mandolin, Mk1 Marimba, Mk1 Vibes, Moog Brass, St John's Church Organ, String Section, Tenor Sax.
