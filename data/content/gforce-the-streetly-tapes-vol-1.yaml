details: |-
  With The Streetly Tapes – Vol 1 Expansion Pack, we knew that we had a magical combination immediately after a discussion took place between ourselves and Streetly Electronics, the original UK 'Tron manufacturers, which focused around them providing their original tapes for use in the M-Tron Pro.

  Curated from the original Streetly tape archive, the pack contains 24 tape banks for M-Tron Pro. Those are derived from original EMI tape-stock from the original UK 'Tron masters. The pack also includes 100s of patches, many from luminaries including Dean and Jarrod (I Monster) and Paul Godfrey (Morcheeba).

  Tape banks included: 2 Tenor 2 Alto Sax, 8 Choir, Bassoon, Biro Choir, Boys Choir, Cello, Dick Strings, Electric Guitar, Flute, French Accordion, French Horn, GC3 Brass, Glocks & Tubular Bells, Gothic, Halfspeed Brass, M300A Violins, M400 Violins, Mandolin, Mk1 Marimba, Mk1 Vibes, Moog Brass, St John's Church Organ, String Section, Tenor Sax.

  The Streetly Tapes – Vol 1 Expansion Pack is only available to registered users of M-Tron Pro. Additionally, it is exclusively available via this website as a direct download (625MB) via “My Instruments” when the purchase has been completed.
specs: |-
