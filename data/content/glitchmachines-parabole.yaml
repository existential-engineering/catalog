details: |-
  Parabole manifests itself in the form of a 3.6GB sample pack consisting of 40 folders organized by object, totaling a staggering 3,029 24bit 96kHz files.

  Parabole is the fifth installment in a series of sample libraries featuring unprocessed sounds. This collection from sound designer Ivo Ivanov includes a broad spectrum of contact mic recordings, as well as a multitude of recordings from an auto salvage yard and various epic impacts recorded in a massive decommissioned grain silo dome.

  Parabole features a deeply compelling collection of sounds that have been expertly activated, captured and edited. This diverse collection of assets is adaptable to a broad variety of creative contexts including Music Production, Game Audio, Motion Graphics, Advertising, Art Installations, Live Performances, Audio Branding, Cinematic Trailers and much more.

  While our sound effects are carefully designed to work with your favorite samplers and DAWs, they pair up particularly well with our own brand of audio contortion tools. Our wide selection of packs grant Palindrome, Polygon, Cataract and Tactic users access to thousands of fresh ingredients.
specs: |-
  - 3,029 unprocessed audio files
  - 3.6GB sample pack
  - 40 folders organized by object
  - 24bit 96kHz resolution
  - Contact mic recordings, auto salvage yard recordings and impacts recorded in a decommissioned grain silo dome
