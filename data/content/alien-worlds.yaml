details: >-
  Alien worlds is a collection of 55 dark and sci-fi patches for native
  instruments massive synthesizer created by giorgio rebecchi.


  55 dark and sci-fi patches, featuring deep drones, dark and desolating
  textures, cinematic hits, sci-fi effects and other sounds useful for adding
  tension build ups and create music for action, thriller and horror movies and
  games.


  This is not a sample collection. You have the full massive patches so you can
  tweak all parameters or using our one knob macros to easily morph and sculpt
  all sounds.


  Content: 22 fx: ghost, engines, robots, cyborgs, drones, etc. 33 pad and
  textures: desolation textures, alien worlds, tension backgrounds, etc.
