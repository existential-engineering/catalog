description: A cinematic sound effects library for filmmakers, game developers and trailer producers, built around resonating braams, booms, stingers, transitions and distorted impacts.
details: |-
  The Modern Cinematic Sound Effects Library was crafted for filmmakers, game developers and trailer producers, as a collection aimed at contemporary productions.

  The library covers cutting-edge soundscapes, gritty and avant-garde cinematic sound effects, resonating braams, earth-shattering booms, intricate stingers and seamless transitions, plus distorted impacts and thumps.

  Whether the goal is tension in a thriller, the adrenaline of an action sequence, or the awe of a sci-fi world, every sound in the library is aimed at power and impact.

  Modern Cinematic is a Weaponiser library designed by Alessandro Mastroianni, and ships with 50 Weaponiser presets alongside the sound effects.

  Sound categories included are Stingers, Impacts, Booms and Transitions.
