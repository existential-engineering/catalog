details: |-
  New Spicy Era of Post-Epic Drums

  Introducing our new Spice Series for Soundpaint – an homage to contemporary scoring trends and beyond. The journey begins with Spice Drums, a Post-Epic collection of cinematic drums, all crafted with deep arrays of synths and up to 1800 oscillators, which were then resampled to run butter-smooth on your computer. Spice Drums continues the legacy of our popular Dunescape instrument for Soundpaint. The sound is alien yet familiar, resembling real drums and percussion but cleaner, bigger, and better sounding than anything in the old epic music paradigm. Each instrument spans 6-8 octaves, making them incredibly flexible ensembles, all recorded with extensive velocity layers and round-robins.
