details: |-
  Avant Koncept for aas chromaphone is a new soundset, a critical tool conceived
  for electronic music producers wanting a cutting edge and versatile sound.
  Comprises a wide variety of patches from edgy and sinister to relaxing and
  ethereal.

  Avant koncept delivers composite mallets, bells and synth keyboards, ethereal
  and lush leads, frictional and rusty textures, stiff and deep percussions as
  well as heavy distorted and harsh industrial percussions, speaker blowing
  basses, mystical soundscapes, atmospheres and cinematic sfx.

  Avant koncept takes advantage of chromaphone resonators to make sounds that
  aren't possible in the reality or quite difficult to obtain. There is plenty
  of expressibility on all the 128 patches and each patch as a unique response
  to velocity, pitch and modwheel.

  As a plus this soundset comprises percussion kits, this allows to play
  different sounds with the same patch when touching different keys on the
  keyboard.

  Contains: PDF with a detailed installation guide. 128 presets. Normalized
  volumes. Velocity sensitivity. Control by modwheel. Customer support.
specs: |-
  - 128 patches
  - Velocity sensitivity
  - Modwheel control
  - Chromaphone resonators
  - Percussion kits
  - Normalized volumes
