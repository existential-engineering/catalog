details: |-
  Adventure Strings is the follow-up to soaring strings. Performed by the same number of players, recorded in the same room, seated in their traditional positions -- both share the same performance aesthetic. Strong, passionate and relentlessly energetic.

  With adventure strings, the shorts were recorded as repetition phrases; a quick succession of notes at a procured tempo. Each note of that phrase was edited and programmed to be playable, resulting in a collection of patches that suit the context they were designed for because they were recorded that way.

  In addition to the shorts (spiccatos / staccatos / pizzicatos / marcatos), adventure strings includes trills, tremolos, sustains, keyboard-spanning full strings instruments and adventure patches.
