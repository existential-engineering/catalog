details: |-
  Ave!Moog pads is an expansion pack for vps avenger synth that is inspired by
  the deep and classic Moog voyager sound. The expansion pack contains 38mb of
  content with 75 presets, 22 wavetables, 12 resamples, 12 granular samples, and
  shapes & samples. All raw material is taken from real hard Moog voyager synth.

  The expansion pack features four mod sources in every preset: modwheel (the
  main) which controls a lot of parameters and slowly morphs the sound under
  manual control; globmod knob which allows changing the mix of oscs. Two or
  three oscs are possible, with no more due to cpu economy.

  Two impulsemorphing buttons 1 and 2 morph sound quickly as needed without
  sound artifacts. In the rhythmic presets, imb 2 is used as rhythm on/off. The
  design allows for playing with all knobs, wheels and buttons to find desired
  sounds.

  The expansion pack is designed to turn the famous monosynth into a poly on the
  avenger's fm platform with great possibilities of modulation and fx. Users can
  manipulate the osc1/osc2/osc3 knob with modwheel simultaneously and push
  buttons in various combinations to shape the sound.
