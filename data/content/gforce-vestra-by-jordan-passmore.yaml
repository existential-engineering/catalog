description: A preset pack for the GForce Axxess synthesizer by electronic musician Jordan Passmore, blending vintage analog warmth with contemporary sound design. Inspired by classic synths like the Roland Juno-6 and Jupiter-8, the collection delivers 50 patches rooted in 1970s–80s electronic music merged with modern sensibilities.
details: |-
  Immerse yourself in the nostalgic yet forward-thinking sounds of Vestra, a meticulously crafted preset pack for the Axxess synthesizer designed by Jordan Passmore. Known for his mastery in techno and house music production using analog synthesizers and vintage drum machines, Jordan has envisioned Vestra as the ideal sound palette for a hypothetical cutdown Rhodes Chroma, a polyphonic synth with ARP heritage, simplified yet powerful.

  Vestra captures the essence of what this imagined synth would offer, combining the rich, warm tones of 1970s and 1980s electronic instruments with the versatility of modern computing platforms. This pack includes a diverse array of patches, from lush pads and resonant leads to punchy basses and atmospheric bells, all designed to provide dynamic movement and tonal shifts when manipulated with Macros and Controllers.

  Inspired by the lineage of iconic synths like the Roland Juno-6 and Jupiter-8, Vestra is perfect for musicians seeking to blend vintage analog warmth with contemporary sound design. Whether you're crafting ambient soundscapes, driving basslines, or intricate melodies, Vestra offers the tools to elevate your productions.

  Jordan Passmore is an electronic musician known for techno and house music production with analog synthesizers and vintage drum machines. He is an active creator and performer, releasing countless tracks and videos, and has partnered with synthesizer brands to create content featuring music produced with their instruments.
