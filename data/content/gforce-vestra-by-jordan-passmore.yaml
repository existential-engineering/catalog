details: |-
  Vestra is a 50-patch preset collection for GForce Axxess, crafted by Jordan Passmore, an electronic musician specialising in analog synthesis. The collection draws inspiration from classic synthesizers such as the Roland Juno-6 and Jupiter-8, merging the warmth of 1970s–80s electronic music with contemporary sound design techniques.

  Patches span arpeggios, basses, effects, hits, keys, leads, pads, and textures, making the pack suitable for techno, house, ambient, and broader electronic music production. Dynamic movement and tonal variation are accessible via Macros and Controllers built into each patch.
