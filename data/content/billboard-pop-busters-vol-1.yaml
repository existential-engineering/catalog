details: |-
  Each kit contains perfectly recorded and mixed instrumentation and will be
  your essential source for creating instant pop hits. Each sound and phrase was
  created by audio experts with the newest production techniques and a passion
  for delivering only the best content.

  MIDI files are included for the majority of musical phrases heard in these
  kits; an essential feature for modern producers. Adapt the phrases in any way
  you desire and use them to trigger your favourite synth or sampler. Use the
  MIDI files in conjunction with the included key-tagged one-shot files to
  create new phrases and patterns that blend seamlessly with the pre-recorded
  content.

  Unlooped/tail wav files are included allowing you to end a phrase with the
  decay of the reverb/delay applied to the loop. There are also dry & wet
  versions, as well as filtered and side-chained loops.
