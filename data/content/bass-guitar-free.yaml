details: |-
  A flexible user interface that allows you to control all aspects of the sound.
  Muse bass guitar contains 42 ready-to-use presets (nki files) with 10 round
  robin samples.

  Articulations: sustain, staccato, slide down, fret noise, slap, and harmonics.
  Sampled with analog & digital equipment.

  20 built-in effects: compressor, delays, reverb, limiter, cabinet, gainer,
  rotator, skreamer, distortion and more.

  The full version of kontakt 5.6 or above is required. Not compatible with
  kontakt player.
