description: "George Lever has become synonymous with the most genre-bending and
  breakthrough bands of recent years. Trusted with engineering and mixing Sleep
  Token’s debut ‘Sundowning’ and progressive metalcore bands Loathe and
  Thornhill, George’s mixing style is both aggressive and soulful, playing with
  the delicate balance of artistic vision and technical precision. Designed to
  reduce the time its takes to make better creative decisions, George has
  included his go-to drum processing for all the individual elements of a kit,
  drum bus treatment, as well as parallel compression/saturation effects. Also
  included are guitar and vocal presets to help fix problematic recordings,
  models of his favorite outboard gear and emulations of his mix bus/master
  signal-chains.This expansion pack has a total of 95 presets."
