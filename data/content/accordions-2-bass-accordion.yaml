details: |-
  Accordions 2 single bass accordion is produced by eduardo tarilonte and is considered the first choice for a realistic and playable accordion library, with numerous renowned composers and producers praising its authenticity and expressiveness.

  With single bass accordion you get a virtual accordion from eduardo tarilonte's accordions 2 as a single instrument designed to play low registers in the accordion orchestra.

  A deep bass accordion intended to play low registers in the accordion orchestra with 3 kinds of bellow shake, 3 different dynamics and 3 round robins for expressive performances.

  Key and button noises are included for ultra-realistic performances, and the instrument was recorded chromatically with the pristine sound of a u47 microphone.

  This single instrument was exclusively designed for best service engine 2 and is therefore not compatible with the kontakt player.
