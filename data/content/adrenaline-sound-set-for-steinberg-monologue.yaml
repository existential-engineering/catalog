details: |-
  Adrenaline - Sound Set for Steinberg Monologue features 128 sound presets for
  steinberg's monologue VST instrument. You get punchy lead sounds, awesome fat
  and loud basses and exceptional FX sounds that can only be made with this
  plugin.

  You will find 128 perfect "ready to work" sound patches for the steinberg
  monologue vsti for your unique music projects. All sounds with modulation
  wheel and velocity assignments.

  The sound bank is usable for all electronic music styles like: dance, trance,
  house, edm, deep house, electro pop and many more.

  Features: 128 sound presets: 79 leads, 30 basses, 19 fx sounds. Sorted in
  categories. Incl. Patch names. 100% are royalty-free.

  Requirements: steinberg monologue vsti plugin version 1.0.0 or higher.
  Monologue vsti plugin is included in steinberg cubase/nuendo nek versions.
specs: |-
