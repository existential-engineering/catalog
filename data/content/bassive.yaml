details: |-
  Bassive is a sound library for Native Instruments Massive. It features 120
  bass patches, each with the 8 macro controls designed to tweak the sounds so
  that can be adapted to different styles and projects.

  Bassive covers the whole spectrum of bass sounds: analog-style basses, sharp
  digital basses, physical modeled electric basses, basslines, wobble basses,
  hybrid sounds and many more.

  Microbassive, a selection of 18 patches from its big brother, is available for
  free download.
specs: |-
  - 120 bass patches
  - 8 macro controls
  - Native Instruments Massive compatibility
  - Analog-style basses
  - Sharp digital basses
  - Physical modeled electric basses
  - Basslines
  - Wobble basses
  - Hybrid sounds
