description: Ableton Drum Racks for Superior Drummer 3 Progressive EZX features
  separate Ableton drum racks.
details: |-
  Ableton Drum Racks for Superior Drummer 3 Progressive EZX features separate
  Ableton drum racks for all factory presets for the toontrack superior drummer
  3 and progressive ezx library for toontrack ezdrummer. These racks provide out
  of the box integration workflow between Ableton live and toontrack superior
  drummer 3 using the toontrack libraries including a host of features ready to
  use for composition and performance using Ableton push or similar controllers.

  28 ableton drum racks to instantly load the factory library "mix ready"
  presets with ableton mappings. 14 ableton live templates designed to host the
  multi channel output routing presets with track level audio routing from
  superior drummer 3 into ableton live.

  Colour coded pad design for visual performance and finger drumming. All racks
  use consistent drum rack colouring so you can visually and immediately spot
  your rides from your hi hat articulations. Vast array of instrument
  articulations ready to go in one massive layout using ableton push 64 pad
  layout mode.

  Ableton macros mapped to toontrack superior drummer macros with preset values
  for ease of use in push and simple to use automation programming. Singleout
  presets feature 14 ableton drum racks for all progressive ezx factory presets
  single audio output to a single ableton track.

  Use the template racks and extend to your own toontrack superior drummer 3
  progressive ezx presets, swapping out individual sounds or articulations. You
  are 100% ready to go with the factory presets but there is no limitation to
  creating your own presets from these templates.
specs: |-
  - Ableton drum racks
  - Toontrack superior drummer 3 integration
  - Progressive ezx library support
  - Toontrack ezdrummer compatibility
  - Ableton push controller support
  - 28 Ableton drum racks
  - 14 Ableton live templates
  - Multi-channel output routing
  - Single audio output presets
  - Multiple audio channel output presets
  - Colour coded pad design
  - 64 pad layout mode
  - Individually labelled drum rack pads
  - Ableton macros mapped to toontrack superior drummer macros
  - Ableton track mixer integration
  - Ableton audio effects support
  - Ableton 10 drum buss compatibility
  - macOS and Windows support
