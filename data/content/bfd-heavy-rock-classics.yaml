description: Heavy rock classics is a bfd3 groove pack featuring authentic drum
  part recreations from all-time classics of the heavy rock genre.
details: |-
  The included groove palettes are produced by experienced composer jacques
  mathias and make it easy to build song structures with intro, verse and chorus
  sections.

  Drum sounds are recreated in bfd3-format presets with precision tone-sculpting
  using the internal effects.

  Heavy rock classics is perfect for instantly dropping into your tracks, for
  play-along practice sessions and also for learning more about drum mixing
  techniques.

  Minimum requirements: windows 7 or above (windows), os x 10.8 or above (mac),
  bfd3 v. 3.2.1.2 or above, internet connection for download and authorization.
  Recommended: ssd. Disk space requirements: 23 gb.
specs: |-
  - Bfd3 groove pack
  - 13 groove palettes
  - Bfd3-format presets
  - Acoustic drum library
  - Main and alternate mix presets
  - Internal effects tone-sculpting
