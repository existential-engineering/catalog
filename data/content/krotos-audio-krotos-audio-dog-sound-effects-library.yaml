description: A collection of dog vocalizations by Coll Anderson featuring four sound categories (Pit Bull, Terrier, Texas Big Face, and Wolford) recorded during outdoor playtime in a country setting. Full of a wide range of vocalisations including snarls, barks, growls, whimpers, and more, fantastic for primary sound design or to sweeten and enhance existing audio. Built specifically for use with Reformer and Reformer Pro.
details: |-
  Provided by Coll Anderson. This family of dogs got a break from the big city and were let loose in the country to play. Full of a wide range of vocalisations, the library is suited to primary sound design or to sweeten and enhance existing audio.

  The library was built specifically for use with Reformer and Reformer Pro, plugins that recompose audio into dynamic, responsive, and highly-realistic sound design instantly.

  Sound categories included are Pit Bull, Terrier, Texas Big Face and Wolford, with keywords covering Pit Bull, Texas Big Face growls, Texas Big Face whimpers, Terrier female growls, Terrier female snarls and Wolford growls.

  The purchase contains two downloads: a zip file with all source sound effect asset files plus a Metadata PDF, and an installer for the integrated Reformer Pro library including assets and presets. Owners of the C.A. Sound, Inc. version of this library are eligible for a 50% discount by contacting C.A. Sound Inc.
specs: |-
  - 409 sound files
  - 1.77 GB size / 3.39 GB Reformer Pro integration
  - 48 kHz high-quality WAV files
  - 100% royalty-free commercial licence
  - Embedded metadata
  - 6 Reformer Pro sound packs
