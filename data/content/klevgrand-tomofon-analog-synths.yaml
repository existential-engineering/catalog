details: |-
  Want to add some electronic flair to your music production? The Analog Synths Expansion Pack is based on a wide range of classic analog synth models. These synthesizers have been staples of the music world for decades, and their unique warmth and fat sound have been used to create some of the most iconic sounds in music history. Loaded into Tomofon, they offer something completely new.

  With the Analog Synths pack you'll have access to a variety of sounds that are perfect for all forms of electronic music. From evolving pads to classic brass and aggressive stab sounds, this collection of synthesizers offers an incredible range of sonic possibilities.

  This is a Expansion Pack for Tomofon – you will also need a license of Tomofon to use it (bought separately), or an installed iOS app.

  This Sound Pack works both on macOS/Windows and iOS.
