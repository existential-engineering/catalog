details: |-
  Will Yip is a Grammy-winning producer, engineer and mixer, and co-owner of the legendary Studio 4 Recording in Conshohocken, PA. With over 100 albums to his name he has become one of the most sought-after producers in modern rock, hardcore and alternative music, shaping records for Title Fight, Turnstile, Code Orange, Circa Survive, Turnover, Tigers Jaw and Anthony Green, alongside work with Lauryn Hill. He won Best Rock Album at the 2026 Grammy Awards for producing Turnstile's Never Enough .

  This expansion pack connects technical engineering to the vital musical elements and soul that make a mix stand out. It's full of the analog and digital mixing chains Will uses every day, with individualized signal chain emulations for every element of his drum mixes, plus bass, guitar and vocal captures, all arranged by genre to get your mix started in the right place.

  This expansion pack has a total of 109 captures.
