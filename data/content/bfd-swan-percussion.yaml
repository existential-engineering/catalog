details: |-
  BFD Swan Percussion is an expansion pack for bfd3, bfd eco and bfd2 with
  innovative percussion instruments and a suite of crescent effect cymbals. Swan
  percussion's original creations are inspired by a variety of world percussion.

  The 'black swan drum' is a new take on the ghanaian gombe framedrum featuring
  a tom head. Other highlights include the 'swango', a reinterpretation of the
  bongos, the afro-cuban bat-style 'batudu' and a variety of shakers and cajons.

  The included set of crescent haptic series effect cymbals provide characterful
  crash, resonator, crash china and ride china cymbal sounds.

  Played variously by hands, rods, mallets and sticks, bfd swan percussion also
  comes with a selection of presets and funky percussive grooves perfect for all
  music styles requiring dynamic, exciting percussion.
