name: Atmos for Dune 2
manufacturer: vejo-soft
primaryCategory: preset-pack
url: https://www.vejosoft.com
description: "200 presets for dune 2: 100 pads. 65 synths. 20 atmospheres. 15
  basses & dark sounds."
details: |-
  Pads: each pad have modwheal to open or close filter or change timbre for
  sound. Most of pads have velocity assigned to filter adr (attack, decay
  release) and few have expression wheel to other effects.

  Atmospheres are chords, textures or soundscapes for long evolve sounds. Each
  atmosphere have modwheal to open or close filter or change timbre for sound.
  Some of atmospheres have velocity assigned to filter or timbre and few have
  expression wheel to other effects.

  Bass & dark sounds: this section is for basses and sounds for lower tones (not
  bass but for dark timbre).

  Synths: there are many type of sounds. From leads to pluck or pad like sounds.
specs: |-
  - 200 presets for dune 2
  - 100 pads
  - 65 synths
  - 20 atmospheres
  - 15 basses & dark sounds
  - Modwheel control for filter and timbre
  - Velocity-assigned filter adr (attack, decay, release)
  - Expression wheel effects
  - Dune 2 compatibility
