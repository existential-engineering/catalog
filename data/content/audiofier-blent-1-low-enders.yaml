details: |-
  Blent 1 is the first chapter of the blent series, designed to enhance music
  composition with deep, evolving, and solid sound sources. Four layers of deep,
  rumbling, sonorous bass tones provide a solid, thunderous foundation for
  compositions.

  We focused on capturing low sustaining sounds such as double basses, drones,
  bassoons, tubas, seven-string guitars, and synths. These sounds have been
  meticulously recorded and processed to deliver a unique collection of sonorous
  tones, creating a deep and solid foundation for tracks.

  Blent includes four sound layers, each with its own dedicated page packed with
  essential controls to shape sound. The layer page works seamlessly with the
  blender engine, allowing you to set minimum and maximum values for volume,
  pan, pitch, and filter.

  The layers blending page is the heart of the blent series, allowing users to
  create dynamic and evolving sounds. With four layers coming together and
  blending, users can activate the mod-wheel to transition between different
  sounds seamlessly, with volume, panning, pitch, and filters customizable with
  user-defined curves.

  The global page offers master controls for delay and convolution reverb, with
  plenty of reverb and sound design impulse responses which will complement,
  enhance or radically alter the sound. Mapping controls allow using more blent
  instruments at once on the same MIDI channel or in a kontakt multi or for live
  playing.
specs: |-
