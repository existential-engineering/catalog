description: You like it all big and mighty? Cathedrals, churches, concert halls and venues in all shapes and colours were assembled for this premium bundle.
details: |-
  IR-Pack Halls & Churches is an impulse response collection from HOFA-Plugins built around large reverberant spaces. The page describes it as a premium bundle of cathedrals, churches, concert halls and venues in all shapes and colours, aimed at users who want big and mighty ambience rather than tight rooms.

  The pack is host-dependent rather than a plugin of its own. The product page states that buying IR-Packs requires either the IQ-Series Reverb V2 or the HOFA SYSTEM IR-Verb, and it links the IQ-Series Reverb V2 product page directly. Buyers must be logged into the HOFA store for the purchase to be available.

  The page publishes the full list of impulse responses, 150 named entries in total. They span literal sacred and concert spaces (Dense Cathedral, Dark Minster, Modern Abbey, Lit Chapel, Wooden Chapel, Huge Theatre, Memorial Hall, Jupiter Hall) alongside more abstract or engineered variations (Big Hall Reflector, Hall Temple Basement, Gated Shot, Plate Swamp, Hall Artifact, Big Plate Hybrid), so the collection mixes realistic venue captures with creative treatments.

  Many names are drawn from place names and locations (Jericho, Nazareth, Petra, Palmyra, Megiddo, Sinai, Bethlehem, Ek Balam), which is how the pack signposts scale and character rather than by decay time. Others describe the sonic result directly (Cold Hall, Warm Hall, Big Hally Dark, Bright Space, Hissing Hall, High Walls).

  Audio demos are provided on the page through an embedded SoundCloud player, which is held behind a cookie consent placeholder until the visitor unblocks the third-party service. A Download & Test link points at the HOFA downloads page for trying products before purchase.
specs: |-
  - 150 impulse responses included
  - Requires IQ-Series Reverb V2 or HOFA SYSTEM IR-Verb as a host plugin
  - Covers cathedrals, churches, concert halls and large venues
  - Includes creative and hybrid variations alongside realistic venue captures
  - Sound examples provided via embedded SoundCloud player
