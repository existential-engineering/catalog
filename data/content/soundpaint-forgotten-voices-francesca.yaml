details: |-
  Raw. Cinematic. Emotion

  Francesca Genco is a highly gifted female alto singer, known for her ability to cover a variety of vocal textures—from soft to powerful, crying to evocative, and everything in between. With over 20 years of experience singing and chanting, she is one of the most respected shamanistic sound healers in the world. She has a wide repertoire of singing styles ranging from Classical Western, Balkan, and Middle Eastern traditions in her singing and every sound tells a story. The Forgotten Voices: Francesca library contains over 850 unique vocal phrases, offering more than 10 hours of material. These phrases capture Francesca's raw and emotional vocal performances. Additionally, the library includes a special set of custom vocal ambiances created by world-renowned instrumentalist Steve Tavaglione (known for his work on Wall-E, American Beauty, CSI, and Supernatural). Soundpaint makes it easy to explore and use the wealth of vocal content. The library is divided into five main subdirectories—Ambiences, Chants, FX, Songs, and Sound Labs—providing endless creative possibilities for your compositions. Immerse yourself in a world of true human emotion with playable vocal emotions.
