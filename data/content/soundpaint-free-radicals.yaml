details: |-
  Dark. Twisted. FGGD Up Sound Designs

  Free Radicals is the result of a collaboration between over 100 sound designers from the community and the Soundpaint team. Together, we have created the darkest, most twisted and most insane instrument ever. This is not for the faint of heart! This is for the brave and the bold who dare to explore the unknown and the unpredictable. Each sound in Free Radicals is a personal expression of what sonic beauty means to the creator, and the result is a diverse and eclectic mix of styles, genres, textures and moods. From haunting drones and eerie atmospheres, to glitchy beats and distorted synths, Free Radicals will take you on a journey through the dark corners of sound. There are dark ambiences in every corner. Viral Ambiences: tonal, gritty, and rhythmic. Bacterial hits: long and short, with binary fission captivating the ears. And if you are feeling adventurous, you can also dive into the deep-sampled collection of microwave sounds. The sounds are so dark, your listeners may need a dose of penicillin.
