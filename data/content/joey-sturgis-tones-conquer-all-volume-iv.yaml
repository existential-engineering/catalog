details: |-
  Add new life to your current guitar tone with the Conquer All Volume IV Impulse Responses. If you've been working on your tone, now's your chance to expand your palette. Grab this quick pack and open a whole new world of tonal shaping possibilities.

  Conquer All Volume IV includes EQ'd and raw IRs as well as Kemper compatible IRs. There are 4 unique setups with 24 IRs for each setup.

  You must have an impulse response loader or Toneforge to use this product.
