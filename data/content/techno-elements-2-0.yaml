details: |-
  Audio boutique is cordially inviting you to taste techno elements 2, the
  eagerly anticipated successor for all technoheads, delivering fresh and crisp
  material for your next producer session.

  Get dark atmospheres, never-heard percussion, creative fills alongside loads
  of other complex loops, freshly crafted one-shot-samples... Even vocals are
  included to spice up your productions!

  This one is for you if you're after the secrets of drumcode, terminal m,
  suara, octupus records or artist like adam beyer, monika kruse, metodi
  hristov, pig & dan... To name a few.

  Needless to say it's all properly keyed, sorted and sampler-ready.

  Features: 893 mb. 733 files in total. Sampler patches for logic exs, ni
  kontakt, battery, ableton sampler. All files on 125 bpm. All tonal files are
  marked with the key.
