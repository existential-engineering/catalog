details: |-
  The Tuned Percussion Expansion Pack for Tomofon is a must-have for any musician or music producer looking for unique and unusual sounds. Based on a carefully recorded collection of Kalimbas, Marimbas, Glasses, Toms, Cymbals, Glockenspiels, Wood Blocks, Metal Pipes and Plastic Pipes, this expansion pack has everything you need to create a wide range of sounds, from acoustic one-shots to synthetic pads.

  What makes this pack stand out is its ability to capture sounds that cannot be recreated with a sampler or a regular synth. In particular, the Cymbal Sqeaking model is a standout, with a sound that occurs when you drag a drumstick tip 90 degrees against the cymbal. Additionally, the Glass Tapes model sounds similar to a broken mellotron, but with a unique twist.

  Overall, the Tuned Percussion Expansion Pack is a great addition to any music producer's toolkit, providing a wide range of unique and unusual sounds that will help you stand out from the crowd.

  This is a Expansion Pack for Tomofon – you will also need a license of Tomofon to use it (bought separately), or the installed iOS app. This Tomofon Expansion Pack works both on macOS/Windows and iOS.
