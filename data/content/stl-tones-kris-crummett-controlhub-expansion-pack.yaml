details: |-
  Kris Crummett is a producer, mixing and mastering engineer who arguably set the standard for audio production in alternative rock and post-hardcore, with breakthrough records for Sleeping With Sirens, Issues and Dance Gavin Dance.

  Sonically push your mix to places you never thought possible with full hardware chain traces and the masterful engineering of Kris Crummett.

  This expansion pack has been built so your mixes can stand up and compete against professional commercial mixes, using the most industry-recognized and coveted hardware chains, all perfectly set up and engineered to help bring out the full potential in your mix.

  This expansion pack has a total of 168 captures.
