  - 20 Sylenth1 presets
  - Bass, lead & synth patches
  - 26 MIDI files
  - 22 Percussive & FX One-Shots
  - 51 Tonal One-Shots
  - 71 WAV loops
  - Dry, wet & sidechain versions
  - Perfect for producing Melbourne Bounce
  - 44.1kHz/24-Bit WAV
  - PC/Mac Compatible
  - 100% Royalty-Free
