details: |-
  'Melbourne Monkeys Vol 2' brings Melbourne Bounce vocal, synth and bass loops in WAV and MIDI formats, and also includes various one-shots as well as presets for Sylenth1.

  Vocal loops, synth loops, bass loops and more are included in both WAV and MIDI formats.

  Also included is a selection of drum and percussion, FX, vocal, synth and bass shots.

  A set of Sylenth1 presets is included which, combined with the included MIDI data, extends the options for reworking the material.
specs: |-
  - 171 Files
