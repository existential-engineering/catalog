details: |-
  Includes 30 fully customizable virtual drum kit presets featuring 37 snares,
  27 bass drums, and 22 toms with 10 layer velocity, 3 note round-robin, and
  both left and right sides of the drum.

  Over five gigs of sampled drum sounds with the ability to save, edit, and load
  each preset, and change each individual part of the kit.

  Drag-and-drop and auditioning has been implemented for MIDI beats with panning
  and volume controls for each part of the kit.

  Load samples at 16 or 24-bit sample depths and supports 44.1, 48, 88.2, and 96
  khz sample rates with the ability to reassign MIDI note triggers for easy
  playback with an electronic drum kit.
specs: |-
  - Drum sample library
  - MIDI beat collection
  - 30 fully customizable virtual drum kit presets
  - 37 snares
  - 27 bass drums
  - 22 toms
  - 10 layer velocity
  - 3 note round-robin
  - Left and right sides of the drum
  - Over five gigs of sampled drum sounds
  - Drag-and-drop MIDI beats
  - Auditioning for MIDI beats
  - Panning controls for each part of the kit
  - Volume controls for each part of the kit
  - 16 or 24-bit sample depths
  - 44.1 kHz sample rate support
  - 48 kHz sample rate support
  - 88.2 kHz sample rate support
  - 96 kHz sample rate support
  - Reassign MIDI note triggers
  - Save, edit, and load presets
  - Change individual parts of the kit
  - macOS compatibility
  - Windows compatibility
