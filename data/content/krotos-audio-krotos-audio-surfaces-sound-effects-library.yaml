description: High-quality concrete, hand rub, gravel, grass, leaf, twig, plywood, shoe and wood recordings for Foley work, captured at 192 kHz with a Sennheiser MKH 60-1 and a DPA 4060.
details: |-
  Provided by Krotos. Choose from 3.57 GB of high-quality concrete, hand rub, gravel, grass, leaf, twig, plywood, shoe and wood recordings for your latest Foley project.

  Recorded with a Sennheiser MKH 60-1 and a DPA 4060 in pristine quality at 192 kHz, this library contains a selection of materials being slid, rubbed, rustled, rolled and stepped on.

  Sound categories included in this library: Concrete, Gravel, Leaves and Wood. Specific content covers concrete foot slides, concrete hand rubs, concrete on concrete, concrete slab on gravel, grass rustling, gravel rolling on wood, gravel sliding, leaves and twigs slide, plywood on concrete, shoes on gravel, shoes on leaves and twigs, wood on concrete, wooden plank on gravel, and wood on wood.

  The purchase contains two downloads: a zip file with all source sound effect asset files plus a metadata PDF, and an installer for the integrated Reformer Pro library (iLok is required for the integration installers).
specs: |-
  - 398 sound files
  - 1.36 GB size, 3.57 GB with the Reformer Pro integration
  - 24 bit / 192 kHz high-quality WAV files
  - 100% royalty-free commercial license
  - Embedded metadata
  - 14 Reformer Pro sound packs
