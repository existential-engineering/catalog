name: Abacus
manufacturer: orchestral-tools
primaryCategory: sound-library
website: https://www.orchestraltools.com/abacus
description: Vintage children's instruments. Channel the magic and mystery of
  childhood with this unique collection of playful instruments.
details: >-
  Abacus offers a diverse array of lovingly sampled vintage children's
  instruments from the early 19th century to the 1980s. With almost one hundred
  instruments selected from richard harvey's personal collection, abacus
  provides composers with an authentically nostalgic toolkit, perfect for
  fantasy, adventure, mystery, horror, storytelling, gothic, animation,
  historic, educational, or family-centric television advertising.


  Produced in collaboration with composer and multi-instrumentalist richard
  harvey, who is a prolific composer and multi-instrumentalist with an
  unparalleled collection of more than 700 instruments—old and new—from around
  the world. His previous collaborations with orchestral tools, andea and
  phoenix orchestra, drew on his deep expertise in traditional instruments.


  Highlights include 42 unique and evocative instruments plus wide-ranging
  percussion ensemble, consistent sonic aesthetic for all instruments, and
  exclusive rare and vintage instruments. The plugin features 5 mixable mic
  positions, including vintage spot mics, and unique chromatic musical boxes.


  Abacus is a virtual instrument audio plugin and a software application for
  macos and windows. It includes, and is therefore powered by, sineplayer, which
  functions as a VST plugin, an audio units plugin, a VST 3 plugin, an AAX
  plugin and a standalone application.
specs: |-
  - VST plugin
  - VST 3 plugin
  - Audio units plugin
  - AAX plugin
  - Standalone application
  - 42 unique instruments
  - Wide-ranging percussion ensemble
  - 5 mixable mic positions
  - Vintage spot mics
  - Chromatic musical boxes
  - Macos support
  - Windows support
  - Sineplayer
