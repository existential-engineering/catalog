description: Super Glue - Sound Pack for Digitakt. Download custom-made new sounds and samples. Give your machine a whole new audio wardrobe.
details: |-
  Super Glue brings the noise to your sample library. Literally. Enjoy this free all-purpose Sound Pack for Digitakt and other WAV-playing samplers, with the Elektron team capturing their favorite shades of noise from all kinds of gear ready for you to sort through.

  Revel in 79 different hisses, crackles, and statics ripped from varied radio frequencies, pedals, tape recorders, gained-up preamps, and more.

  Build a noisy ocean solely from the options themselves, or blend them in to be the lo-fi adhesive that holds together your track as rigidly or as loosely as you like.
specs: |-
  - 79 samples, 16 bit / 48 kHz mono WAV files
  - Created by Elektron
  - Type: samples
  - Works with Analog Rytm MKI, Analog Rytm MKII, Digitakt, Digitakt II, Model:Samples, Octatrack MKI and Octatrack MKII
  - Free download
