details: |-
  JST Melodic Spark is a sample pack filled with sounds to spark the start of your next single. With 100 melodic samples to select from, it has everything you need to get started on your next song. Whether you are looking for an ambient background, an arpeggiated riff, or a groundbreaking bassline, the inspiration your sessions need is here.

  All killer, no filler. We partnered with Jon Eberhard (I Prevail, Skillet, Attack Attack!) to come up with each and every one of these samples. Together, we committed that boring samples would not make the cut, then iterated until each sample sparked inspiration to write more. The end result is a pack filled with ambients, pads, arps, basslines, keys, synths, one-shots, risers, and more.

  Every sample in this pack is 100% royalty free. Use them in your songwriting and music productions without fear of a DMCA notice against you or the bands you are working with. The only rule with this pack is that repackaging and redistribution is strictly prohibited.

  Melodic Spark samples were created and synchronized at various tempos for instant accessibility in the studio, but you can unlock them further by manipulating pitch and tempo. Sync a sample to your session's tempo or key in your DAW to add other colors and flavors to your songwriting.
