details: |-
  Carson Slovak and Grant McFarland of Atrium Audio have established themselves as the production powerhouse for modern heavy rock and metal, known for their defining work with August Burns Red, ERRA, Lorna Shore, Polaris, From Ashes To New, Texas In July, Candlebox and Everclear. They produced, engineered and mixed August Burns Red's Grammy-nominated Found In Far Away Places and Phantom Anthem .

  Their second ToneHub expansion showcases many of the duo's favorite album tones alongside fresh sounds crafted specifically for this pack, including a number of hard-to-find amplifiers they have sourced in recent years.

  Atrium Audio's pack contains 84 captures.
