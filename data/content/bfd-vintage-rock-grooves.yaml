details: |-
  Vintage rock grooves is a bfd3 groove pack inspired by classic rock music from
  the 60's and 70's. The included patterns were played live by real drummers and
  were designed to inspire new riffs, songs and jam sessions whilst remaining
  true to the classic rock theme.

  Each of the 11 included groove palettes feature a generous selection of 4-bar
  grooves, alongside fills, and an accompanying bfd3 preset to provide instantly
  gratifying results.

  With over 200 patterns in total, vintage rock grooves is perfect for
  songwriting, jamming and practice sessions.
specs: |-
  - Bfd3 groove pack
  - 11 groove palettes
  - 11 bfd3 mix-ready presets
  - Over 200 grooves
  - 4-bar grooves
  - Fills included
  - Classic rock music inspiration from 60's and 70's
  - Live drummer performances
  - Bfd3 v. 3.2.1.2 or above required
  - Windows 7 or above
  - Os x 10.8 or above
  - 23 GB disk space
  - Internet connection for download and authorization
