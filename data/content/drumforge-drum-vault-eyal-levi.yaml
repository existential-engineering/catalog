description: Mix-ready drum samples in TCI format for Slate Trigger 2.0, recorded and mixed by producer Eyal Levi. Multi-velocity and round-robin sampled across 3 kick drums, 3 snare drums, and 3 tom sets for realistic dynamic performances.
details: |-
  The Drum Vault brings curated collections of highly desired drums, recorded and mixed in high-quality environments, so producers get tonal flexibility without either the bluntness of a one-shot pack or the complexity of a full sampler. It was built in response to user requests for something between the simplicity of Drumshotz and a sampler platform.

  Eyal Levi composed concertos at 17 and went on to become a producer known for his drum tones, working as a founding member and guitarist of Dååth and producing, mixing, or engineering for The Black Dahlia Murder, August Burns Red, Carnifex, Job for a Cowboy, Chelsea Grin, Whitechapel, The Contortionist, Motionless in White, Conquering Dystopia, and Monuments. He also co-founded Unstoppable Recording Machine and Riffhard to share production knowledge with musicians.

  TCI files, and triggered drums generally, aim to deliver realistic drum sounds while working around the problems of tracking in a less-than-ideal room. A basic TCI file carries a few samples at a few velocities; Drum Vault Eyal Levi is tracked round-robin instead, so repeated hits trigger different versions of the same drum and avoid the machine gun effect. Recording at multiple velocities organized across the full 0 to 127 range adds further realism.

  The collection is a modern take on heavy metal drums Eyal recorded and mixed over his career, built from his expansion pack for Drumforge 1 and updated to the Trigger 2.0 TCI format. Owners of the original Drumforge 1 Eyal Levi Expansion Pack, which is no longer sold, already have access to TCI files and do not need to upgrade.
specs: |-
  - Mix-ready drum samples in TCI format for use with Slate Trigger 2.0
  - Recorded and mixed by Eyal Levi (Dååth, Monuments, The Black Dahlia Murder)
  - Captured in a professional studio environment with analog gear
  - Multiple velocities and round-robin sampling for realistic dynamic performances
  - 3 kick drums
  - 3 snare drums
  - 3 sets of toms (two three-tom sets, one two-tom set)
