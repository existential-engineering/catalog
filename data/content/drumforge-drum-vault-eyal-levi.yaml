description: "A curated collection of highly desired drums recorded and mixed by Grammy-nominated producer Eyal Levi. Mix-ready TCI drum samples for use with Slate Trigger 2.0, featuring multi-velocity and round-robin sampling for realistic, natural-sounding triggered drums."
details: |-
  The Drum Vault brings curated collections of highly desired drums, recorded and mixed in the highest quality environments to achieve a massive amount of tonal flexibility in your productions.

  Eyal Levi is an accomplished producer known for achieving unstoppable drum tones. He has worked with some of the biggest bands in death metal and industrial metal — from his work as a founding member of Dååth, to the bands he has produced/mixed/engineered including The Black Dahlia Murder, August Burns Red, Carnifex, Job for a Cowboy, Chelsea Grin, Whitechapel, The Contortionist, Motionless in White, Conquering Dystopia, and Monuments.

  Drum Vault Eyal Levi is a modern take on some of the most iconic heavy metal drums recorded and mixed by Eyal over the course of his career. Built from his highly acclaimed expansion pack previously offered for Drumforge 1, updated for the Trigger 2.0 TCI format.

  Round-robin sampling involves recording drums in a way that enables end users to play the same note repetitively and trigger different versions of the same hit, removing the static patterns that listeners associate with poorly programmed drums. Multiple velocity layers combined with round-robin sampling create a hyper-realistic sounding drum performance.

  Note: Compatible with Slate Trigger 2.0. Owners of the original Drumforge 1 Eyal Levi Expansion Pack have access to TCI files and should not need to upgrade unless experiencing difficulties with the legacy product.
specs: |-
  - Format: TCI (for use with Slate Trigger 2.0)
  - 3 kick drums
  - 3 snare drums
  - 3 tom sets (2 three-tom sets, 1 two-tom set)
  - Multiple velocities with round-robin sampling
  - Perpetual license with free lifetime updates
  - Instant digital download
