details: |-
  The traditional rhythms of african music are infectious and hypnotic. Blended with the sounds of modern house music, they make for an irresistible combination. With 10 fully-featured construction hits, african house captures that blend in perfect combination. For modern dance tunes, but with the distinct sound of african rhythms, african house runs wild with creativity.

  The library spans over 4.6gb of sample data and contains more than 650 individual loops and phrases spanning the 10 construction kits. The samples are mostly between 8 and 16 bars long. With dance-friendly original tempos ranging from 116 to 130 bpm, each construction kit features four different musical sections for easy song construction including intros and outros.

  Sound sources include synth bass, synths, pads, sfx, pianos, electric guitars, mallets and kalimba. Electronic drums include deep kicks, snare, claps, hihats and cymbals. And, of course, there is an extensive selection of african percussion section featuring congas, shakers, udus, claves, darbuka, ghatam, riq and many others.

  As well as a pre-mixed drum loop, separate loops are provided for kick drum, snare, hihat, claps and various percussion. You can therefore create your own perfect drum mix and easily build drops and build-ups. In addition, single-shot drum samples are also included within each construction kit for further flexibility.
specs: |-
  - 10 construction kits
  - 4.6gb sample library
  - 650+ individual loops and phrases
  - 8-16 bar sample length
  - 116-130 bpm tempo range
  - Pitch and tempo manipulation
  - Four musical sections per kit
  - Elastik 3 engine
