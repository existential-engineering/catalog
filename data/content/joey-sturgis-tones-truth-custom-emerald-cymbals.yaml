details: |-
  Truth Custom Emerald Cymbals is a multi-sampled cymbal collection recorded, edited and mixed by Joey Sturgis and played by James Cassells of Asking Alexandria.

  The package ships as Kontakt instruments (requiring full Kontakt 4+) with a Kontakt multi holding the entire cymbal set in one instrument, a WAV file for each sample (164 files), and a Cubase drum map for use with the Kontakt multi. Each cymbal was recorded with articulations and performed velocity.

  The set covers nine cymbals: a Sabian Paragon hi-hat, three crashes from Sabian's AAX Stage, AA Metal-X and AAX X-Plosion lines, a small Agatarian china and a large Sabian AAX Xtreme china, Zildjian and Meinl zilbells, and a dual crash FX sample.

  All samples are a work of art created by Joey Sturgis. You may use these samples in a music, video, or film production. You may not sell these samples as a work of your own, nor sell them as a whole or in part within other libraries, sample sets, or products of any kind.
