details: |-
  Created by professional synthesist, sound designer and composer Drew Schlesinger, the Modern Producer Preset Bank is a collection of 50 presets for the ILLUMINE Reverb. The presets were designed to be used in all types of modern music recording, mixing and production. A wide array of electronic and acoustic sounds were used during creation of the presets, including vocals, brass, synthesizers, keyboards, drums, drum machines and guitar. Many were designed to recreate realistic spaces, and as such, employ little or no modulation. Some presets do employ modulation and pitch shifting to create the lush reverbs for which Neunaber is known. In some cases, this approach was taken to the extreme to create new, weird and creative effects. To install presets from the Modern Producer Preset Bank, you will need a USB-MIDI interface, a macOS/ Windows PC and ILLUMINE Preset Manager Software . Presets are available for individual or bulk import into the User Presets of ILLUMINE. The Presets

