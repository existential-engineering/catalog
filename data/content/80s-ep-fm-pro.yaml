details: |-
  The 80s eps are virtual versions of 4 iconic 80s ep sounds from the yamaha dx7 mark ii, each counting two times 1144 24-bit/48khz samples for the pro versions - 88 keys sampled in 12 velocity layers.

  The "fm" is a customized version of the popular "fm roads" tone. It has a lot of hammer sound, a clean decay, and with release it becomes really sticky.

  The pro versions have enough samples to mimic three synthesizers, creating the authentic super-wide sound of 3 differently tuned dx7s playing at the same time with one panned hard left and one panned hard right, as used on countless hit songs.

  Requires the full version of kontakt 3.5 or higher. The 80s eps will only work for 30 minutes in the free kontakt player.

  Add the 80s ep fm 140 folder to the 80s ep fm pro folder, it has files the pro version needs.
specs: |-
  - 24-bit/48khz samples
  - 88 keys sampled in 12 velocity layers
  - Kontakt 3.5 or higher required
  - 30 minutes limitation in free kontakt player
  - Fm sound library
  - Dx7 mark ii based
  - Yamaha dx7 emulation
  - MIDI compatible
