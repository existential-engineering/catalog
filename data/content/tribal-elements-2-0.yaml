description: Tribal Elements 2.0 is loaded with even more and all-new tribal-house grooves.
details: |-
  No matter whether you're into commercial house or underground sounds, you can
  find it all in here: truly inspiring loops are waiting to be sliced'n'diced
  for the next hit. One-shots are for those who like creating their very own
  rhythm from the scratch.

  Carefully selected add-ons like drums, percussion and up & down fx complement
  to a perfect groove. Discover the sweet spice of tribal elements vol.2 in your
  next house production.

  All loops are at 128bpm for easy integration into common electronic genres,
  and all are available in the most popular sampler formats.
specs: |-
  - 80 tribal loops
  - 40 percussion loops
  - 30 FX samples
  - 30 hihat samples
  - 20 kick samples
  - 32 percussion samples
  - 30 CLAP & snare samples
  - Wav 24 bit format
  - Rex format (stylus ready)
  - Appleloops format
  - Exs patches
  - Kontakt patches
  - 487 MB content
  - 128 bpm loops
