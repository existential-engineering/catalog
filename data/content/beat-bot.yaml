details: |-
  This kit is the preset of the futuristic, robotized interface. You can use
  this template for creation audio, game or other types of the interface.

  We have made this template in such a manner that you can move knobs and
  buttons as you wish, you can replace any element, scale any element down,
  change a background and, thus, quickly receive a beautiful working prototype.

  We assume that the given ui kit will be good for ipad synthesizer, or a game,
  and also for the desktop application.

  It is possible to easily implement this ui kit graphics from the archive and
  to receive a fast working prototype.

  The series of such types of one-knob kits will be replenished each month
  always with newer concepts.
specs: |-
  - Ipad pro resolution 2732 x 2048
  - Knobs, background and all controls rendered into png layers and single files
  - Rendered controls assembled into psd file for artistic and ux manipulations
  - Knob animation 128 frames
  - Big knob resolution 844x844
  - Small knob resolution 354x354
  - Button animation states: on, off
