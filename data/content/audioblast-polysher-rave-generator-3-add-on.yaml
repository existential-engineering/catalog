details: |-
  Polysher is an add-on for Rave Generator 3, built around the classic sound aesthetic of the legendary Korg Polysix.

  This add-on focuses on a retro, musical, and groove-oriented palette, inspired by 80s analog synths, 90s house, old-school trance, and synthwave textures. The sounds are designed to feel warm, funky, and expressive, with just the right amount of brightness to bring clarity and presence to your mix, without sounding aggressive or harsh.

  Inside Polysher, you'll find shiny but smooth stabs, rounded and musical basses, and clean, expressive leads that naturally sit in the mix. The overall character is vintage, colorful, and flexible, perfect for creating nostalgic yet modern tracks.

  Polysher is ideal for producers looking for authentic analog vibes, funky chord stabs, retro synth hooks, and classic dance music tones, all ready to use inside Rave Generator 3 with zero programming.
