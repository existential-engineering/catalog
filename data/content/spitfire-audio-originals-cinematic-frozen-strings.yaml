details: |-
  Eight of London's finest string players (2,2,0,2,2), performing a selection of experimental playing techniques, at the quietest of levels. Expertly recorded at London's AIR Studios, Lyndhurst Hall. These brand new recordings are inspired by the visceral, glacial tones of Albion Tundra, with a bespoke Super Close signal offering next-level detail and definition.

  Originals Cinematic Frozen Strings requires the free Splice INSTRUMENT plugin to run.
specs: |-
  - 12 presets of long and short techniques
  - 3 signals: Close (valve spot mics), Tree (decca tree array), Super Close (clip-on bridge mics)
  - ~2.8GB
  - Eight-player string section (2,2,0,2,2), placed antiphonally
  - Recorded at AIR Studios, Lyndhurst Hall, London
  - Requires the free Splice INSTRUMENT plugin and a free Splice account
  - macOS 12 or later
  - Windows 10 or 11 (64-bit)
