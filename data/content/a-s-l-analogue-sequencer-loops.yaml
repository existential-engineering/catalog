details: |-
  Asl (analogue sequencer loops) is 100% pure analogue, using only classic analogue synths and hardware analogue sequencers - and superbly captured at 24-bit sampling resolution. Asl is based around a uniquely inspiring new sample library from ian boddy, one of europe's leading synthesists, featuring 1,000 loops and over 1.5 gb of brand new material sourced entirely from analogue modular systems & vintage analogue synths and performed solely on hardware analogue sequencers.

  Provided in wav, kontakt and rex multiformat, this superb loop library is designed to complement ian's highly acclaimed 'morphology' sample library.

  The full analogue sequencer loops library features the following sound categories: analogue drums, bass sequences, melodic sequences, sine & pure sequences, electronic percussion, fx loops, hi-hat & noise loops. These are further subdivided into tempo groups ranging from 90 - 150 bpm. With kontakt's ability to play back loops at varying tempos these are provided purely to conveniently divide the library into easily digestible chunks.

  Ian boddy's extensive arsenal of vintage and modern analogue synths and analogue sequencers has been extensively plundered to create this unique and inspiring library, including sound sources: moog iiic (extended) modular, roland system 100m modular, doepfer a100 modular, analogue systems modular, analogue solutions concussor percussion modules, arp 2600, minimoog, moog voyager, oberheim xpander, vcs 3; and sequencing: moog 960 sequential controller x 2, roland 100m 182 sequencer, roland 100m 184 polyphonic keyboard arpeggiator, analogue systems rs-200 sequential controller, analogue solutions cv8 - 8 step CV sequencer x 2, analogue solutions gt8 - 8 step gate sequencer x 2, analogue solutions mc01- master clock with clock dividers, analogue solutions fs01 - fill in / quad switcher, doepfer a100 - various seq switch/clock dividers/clock sequencers.

  Working with the provided kontakt instrument patches, not only can you sync, stretch, and pitch the loops, but also filter, effect and modulate them as well. Use your software sampler's powerful sound-shaping filters, flexible envelopes, syncable lfos, and distortion, syncable delay, and lo-fi effects to inject even more energy and individuality into the loops.
