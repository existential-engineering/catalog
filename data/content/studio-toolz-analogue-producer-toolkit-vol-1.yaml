details: |-
  The 'analogue Ableton' pack is a toolkit produced by minimal system
  instruments for Ableton live. The pack contains 68 instruments, preset, and
  racks designed to add analogue character to you mixes.

  Many racks are modelled on actual hardware such as the 1176 and la2a
  compressors or the bettermaker eq 230p and blue 1073 eqs.

  What we have aimed to do with this pack is create everything you need to have
  a self contained analogue modelled mixing and mastering studio within ableton
  live (although we have added some goodies such as the tb303 instrument and
  some nice presets for operator).

  System requirements: this pack requires a pc or mac running ableton live. The
  product has been tested on versions 7 and 8 without issue.
