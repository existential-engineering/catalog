details: |-
  BFD Kabuki & Noh Percussion is a fascinating collection of authentically
  played japanese percussion instruments and noisemakers produced by sonica for
  bfd3 and bfd2. Combining the emotions, grandeur and mystery of kabuki and noh
  performances with the reverberations of tapped hand drums, kabuki & noh
  percussion features 56 authentic japanese percussion instruments including
  traditional hand drums, pitched drums, bells, gongs and music boxes alongside
  noh flute and authentic vocal motifs.

  Also included are the ashibyoshi foot beats and tsukeuchi sound-effect
  clappers crucial to kabuki performance. The instruments are played by master
  traditional japanese percussionist takinojo mochizuki with alternating
  left/right hits and up to 99 velocity layers.

  Well-preserved vintage mics, neve preamps and an anechoic room similar to the
  bamboo-curtained orchestra room in a kabuki theatre were used for the
  recordings. Reverb can be added as needed - kabuki & noh percussion preserves
  the true character of the instruments' sound.

  Also included are over 150 grooves which offer instant access to real nagauta
  and noh performance rhythm patterns.
