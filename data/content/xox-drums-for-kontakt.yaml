details: |-
  Autodafe xox box is a drum machine for Kontakt based on samples of Roland drum
  machines of the xox series (606, 707, 808 and 909). All samples come from free
  sources and are believed to be free/public domain.

  The main instrument has 5 vertical slots: kicks, snare/rim/clap, hats (closed,
  open, pedal), cymbal/cowbell, and toms (hi, mid, low) for a total of 12
  sounds. Each slot has different selectable kits of sounds: 28 kicks, 28
  snares/rim/clap combinations, 12 hats combinations (closed, open), 8
  cymbals/cowbells, 8 toms combinations (hi, mid, low) allowing many different
  combinations of samples.

  Each slot has separate level, pan and tune controls for fine editing and
  fine-tuning of the samples. Each slot has two separate controls for attack and
  sustain of the onboard transient shaper. Each slot has solo/mute buttons, to
  solo and mute sounds in the slot.

  Each slot has an independent selectable filter: filter type (different
  lowpass, highpass), with cutoff and resonance controls. Each slot has an
  independent distortion section with selectable type (tube or transistor) and
  level control. Each slot a dedicated reverb send level, which controls the
  amount of sound that is sent to the reverb bus channel.

  Drm32 analog drum machine has an onboard drum sequencer with 32 selectable
  patterns, as well as a dedicated drum delay and reverb. The instrument will
  normally load as a stereo instrument, but can be switched to multi-output,
  with user assignable outs.
specs: |-
  - Kontakt 5.6 (full version required)
  - 5 vertical slots
  - 28 kicks
  - 28 snares/rim/CLAP combinations
  - 12 hats combinations (closed, open)
  - 8 cymbals/cowbells
  - 8 toms combinations (hi, mid, low)
  - Level control per slot
  - Pan control per slot
  - Tune control per slot
  - Attack control (transient shaper)
  - Sustain control (transient shaper)
  - Solo/mute buttons per slot
  - Independent selectable filter per slot
  - Filter type (lowpass, highpass)
  - Cutoff control
  - Resonance control
  - Independent distortion section per slot
  - Distortion type (tube or transistor)
  - Distortion level control
  - Reverb send level per slot
  - 32 selectable patterns
  - Drum sequencer
  - Drum delay
  - Reverb
  - Stereo instrument mode
  - Multi-output mode
  - User assignable outputs
