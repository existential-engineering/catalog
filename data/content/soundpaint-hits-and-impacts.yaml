details: |-
  Core. Quaking. Hits. Our ninth installment in the Hybrid Cinema category is going to make a huge impact on your scoring workflow. From the subtle vibration of a butterfly's wings to an asteroid rewriting human history, this tsunami of emotion is the hybrid equivalent of an orchestral timpani - if that timpani were hooked up to a raw power source and resonated through your very core! It gets your attention with the faintest of whispers to the loudest of yells. A universe of sounds is right under your fingertips. For the sound designer, the various parts of this library combine to create thunderous kicks never before heard - or felt! For film and trailer composers, this sonic palette covers transitions and suspenseful cut scenes with thematic urgency and frames the narrative in such a way that is remarkable, unforgettable, and impactful.
