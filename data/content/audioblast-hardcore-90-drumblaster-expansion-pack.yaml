description: HardCore 90 is a DrumBlaster expansion inspired by Rotterdam 90's Hardcore. 66 presets, 700+ samples and 23 MIDI files for Hardcore, Gabber, Frenchcore.
details: |-
  HardCore 90 is a dedicated expansion pack for DrumBlaster, built for producers who want the true sound of 90's Hardcore, loud, fast, distorted and uncompromising.

  Inspired by legendary labels and movements such as Mokum, Terror Traxx, Thunderdome, and icons like Lenny Dee, Ruffneck, John Doe, this expansion captures the essence of the Rotterdam area that defined Hardcore history.

  Inside, you'll find 66 powerful presets, driven by 700+ carefully selected samples and 23 handcrafted MIDI files, all optimized to speed up your workflow and instantly deliver authentic Hardcore rhythms. From pounding kick drums and metallic percussion to chaotic fills and relentless patterns, everything is designed to hit hard and cut through any mix.

  Whether you produce Hardcore, Gabber, Gabba, Frenchcore or Schranz, HardCore 90 gives you instant access to the brutal energy and attitude that made the 90's Hardcore scene legendary.

  Requires DrumBlaster Beat Generator Plugin.
