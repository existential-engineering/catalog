description: A preset pack for GForce Minimonsta2 designed by sound design duo K/V (Ramon Kerstens and Richard Veenstra), delivering deep basses, infectious grooves, and hip-hop leads suited for contemporary pop and hip-hop production.
details: |-
  Modern Pop is a dynamic preset pack for Minimonsta2 designed by K/V. This expansion pack is a toolkit for crafting pop and hip-hop tracks that resonate with contemporary audiences.

  K/V meticulously curated Modern Pop to provide a precise selection of patches tailored for specific modern pop genres. “Our aim was to curate a precise selection of patches tailored for specific modern pop genres. We’ve balanced basses, pads, synths, and keys to ensure versatility,” says K/V. Each patch is designed to inspire users to create chart-topping songs effortlessly.

  Aimed at musicians and producers, Modern Pop offers a versatile range of sounds that can be integrated into any project. From rumbling basses to infectious grooves and hip-hop leads, the pack provides tools for music aimed at today’s audiences.

  K/V is a sound design and composition duo comprised of Ramon Kerstens and Richard Veenstra. Their credits extend across clients including Toontrack, Native Instruments, Arturia, Steinberg, Soniccouture and GForce Software.
specs: |-
