description: 'Romesh Dodangoda is a Grammy Nominated Record Producer / Mixer
  from Wales, UK and has worked on many successful releases for artists such as
  Motorhead, Bring Me The Horizon, Funeral For A Friend, Kids In Glass Houses,
  Twin Atlantic, Bullet For My Valentine, Lower Than Atlantis and so many more.
  Recent work includes recording the latest album from Bring Me The Horizon,
  "Amo" which includes the singles "Mantra" and "Wonderful Life". Following on
  the success of his first Tonehub pack, this new collection of tones draws on a
  massive selection of vintage and rare amplifiers which are now made available
  for you to use inside your computer. This pack has been created with great
  care and detail through Romesh’s choice of mics, preamps and processing that
  has best captured these tones from hours of experimenting in the studio. Along
  with this, all the tones have been recorded through the Roger Mayer 456 Tape
  Process which Romesh swears by at the tracking stage for adding extra weight,
  punch and musical analog saturation to the sound of these amps.The combination
  of all of these things brings a unique, vintage library with a modern twist of
  sounds to the daw and gives you an exciting new library of amp tones which are
  ready for you to use on your recordings with no additional processing
  required. Simply plug in and start creating!'
