details: |-
  A shimmering, spine-tingling tuned percussion instrument, used in Hollywood scores for its mysterious, sinister sound. Cuts through an orchestra with its distinctly metallic tone. Performed by renowned percussionist Greg Knowles (The Hunger Games). Captured at AIR Studios, London. Five presets. Three controls. Close, Tree & Pitched signals.

  Originals Cimbalom requires the free Splice INSTRUMENT plugin to run.
specs: |-
  - 5 presets: Performance, Sustained, Damped, Tremolo, Warp
  - 3 signals: Close, Tree (decca tree array), Pitched (one octave down)
  - 1.73 GB
  - Performed by Greg Knowles, recorded at AIR Studios, London
  - Requires the free Splice INSTRUMENT plugin and a free Splice account
  - macOS 12 or later
  - Windows 10 or 11 (64-bit)
