description: One-shot drum samples mixed by Joel Wanasek through his SSL Origin console and hardware rig, with every sample supplied in both an overdriven and a normal variation.
details: |-
  Drumshotz Joel Wanasek Overdrive Edition is a signature one-shot drum sample collection from multi number one charting mixer Joel Wanasek, drawn from two decades of rock and metal production.

  The distinguishing feature is the signal chain and the dual delivery. The samples were mixed through Wanasek's SSL Origin console and hardware rig, processed with SSL E-Series EQ and dynamics alongside outboard including a Chandler Zener Limiter and a Burl B2 Bomber. Every sample ships in two variations: an overdriven version pushed to the limit of size and intensity, and a normal version left with headroom for further processing in a top-down mix chain.

  All 60 samples are delivered as 24-bit / 44.1 kHz WAV files, comprising 11 kicks, 17 snares, and 2 toms in both variations, and are compatible with any triggering program or DAW.
specs: |-
  - 60 one-shot samples total
  - 24-bit / 44.1 kHz WAV format
  - 11 kick samples in both overdrive and normal variations
  - 17 snare samples in both overdrive and normal variations
  - 2 tom samples in both overdrive and normal variations
  - Mixed through an SSL Origin console with SSL E-Series EQ and dynamics
  - Outboard chain includes a Chandler Zener Limiter and Burl B2 Bomber
  - For use with any triggering program or DAW
