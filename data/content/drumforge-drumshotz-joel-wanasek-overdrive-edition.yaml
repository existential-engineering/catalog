details: |-
  One-shot signature sample collection from multi #1 charting mixer Joel Wanasek, featuring 60 samples in 44.1 kHz, 24-bit WAV format. The collection includes 11 kick samples, 17 snare samples, and 2 tom samples, each available in both overdrive and normal processing variations.

  Every sample was processed through Joel Wanasek's SSL Origin console, capturing its signature character alongside select professional hardware: the legendary SSL E-Series EQ/Dynamics, Chandler Zener Limiter, and Burl B2 Bomber. The overdrive variants push the processing to maximum intensity, while the normal variants provide subtler tonal shaping — giving mixers full flexibility to blend the two for any sonic context.

  Compatible with any DAW or triggering program. Purchase includes perpetual license, free lifetime updates, and unlimited customer support via instant digital download.
