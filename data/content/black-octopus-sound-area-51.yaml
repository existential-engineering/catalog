details: |-
  Area 51 is a sample pack built by AHEE for Black Octopus Sound, collecting loops, one shots and Serum presets.

  The one shot section covers drum, synth, bass, lead, instrument, pad and FX material, alongside a set of alien loops.

  The Serum preset bank spans bass, FX, leads, instruments, pads and synths.

  The pack is aimed at dubstep, glitch hop, trap, riddim and EDM production.
