details: |-
  JST Snare Bombs is an expansive collection of explosive snare hits designed to enhance and accent your mixes.

  Taken directly from the post-production playbook of Joey Sturgis himself, JST Snare Bombs features over 40 snare bombs that you can use to make breakdowns heavier, fill the space between transitions, or add excitement and dynamics to your mix.

  From accents, to reverse swells, distorted explosions, or additional layers of texture, JST Snare Bombs can add a unique impact and extra life to your mixes with ease. They are ready for you to drag and drop into your productions.
