details: |-
  The boundless heavens expansion contains 196 high quality presets for tone 2's
  icarus synthesizer and is suitable for any contemporary electronic and ambient
  music genres. There are actually over 300 individual sounds since the majority
  of the patches contain multiple layers, all of which lovingly crafted to a
  high standard while being tweaked over and over on monitors, computer
  speakers, and headphones for optimal balance between sounds.

  The soundset also includes over 200mb of embedded samples, wavetables, and
  attacks. There is also an expansion available which includes, in addition, to
  2 dozen MIDI files which were used in the audio demo's.

  Complex modulation wheel destinations for all patches. When appropriate, many
  patches also utilized velocity sensitivity. Nearly all patches are
  multilayered.

  Roughly a third contain unique new wave multi-samples, most blending any of
  the many live synthesis methods of icarus. Patches created in the latest
  icarus version as of december 2020.

  Patch breakdown (196 presets): leads - 27. Pads & atmospheres - 56. Basses -
  28. Plucks - 33. Keys - 43. Arps/sequences - 15. MIDI preset version includes
  27 MIDI files (over 30 merged patterns) from most of the audio demos
  (excluding leads). All patches are volume normalized.
specs: |-
  - 196 high quality presets for tone 2 icarus synthesizer
