details: |-
  Slammers is a winning collection of powerful and varied one-shot kick and snare samples, created to give you all the excitement and punch you need to make your drum mixes unbeatable.

  Slammers features a wide selection of all-new samples spanning a huge breadth of sounds, deep and fat to high and pingy, organic to ultra-processed, clean to saturated, with many featuring separate room sound samples, recorded in top studios around the world.

  Every sample in Slammers is a showstopper with its own distinct character. Each is a unique single drum (no repeated or lazily blended sounds here), mixed to perfection and aligned with one another so that you can stack up as many as you like to create your own unique combinations.

  With clear, memorable names you'll find it intuitive and fun to enhance your existing drum tracks, live or virtual, and make them slam.
specs: |-
