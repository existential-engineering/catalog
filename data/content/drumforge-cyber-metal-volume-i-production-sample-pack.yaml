details: |-
  Cyber Metal Volume I is a production sample pack built specifically for composers and producers working in the Cyber Metal (also known as Argent Metal) genre. It was created by producer and composer Geoffrey Day and contains a tightly curated set of samples rather than a large, loosely organized library.

  The pack organizes its 103 samples into seven distinct categories: Drums, Atmospheres, Impacts, FX, Loops, Risers, and Tonal sounds. This structure allows producers to quickly locate the right element during a session without digging through an undifferentiated folder of files.

  All samples are delivered as WAV files at 44.1 kHz and 24-bit depth, making them immediately usable in any professional digital audio workstation without conversion. The royalty-free license covers use in commercial productions.

  Purchase includes a perpetual license, free lifetime updates to the pack, and unlimited customer support from DrumForge.
