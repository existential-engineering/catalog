details: |-
  Cyber Metal Volume I is a Drumforge Production Pack, a collection of sounds assembled for composers, songwriters, producers, and mixers scoring games, doing sound design for film, or adding unusual elements to a song.

  Producer and composer Geoffrey Day put together this set of mix-ready samples and loops for creating Cyber Metal, also known as Argent Metal. It covers terrifying atmospheric sounds for tension, crushing impacts for intensity, and glitch pattern loops that raise the energy of a riff.

  The 103 samples are organized into seven collections: drums, atmospheres, impacts, FX, loops, risers, and tonal sounds.

  Everything is delivered as 44.1 kHz, 24-bit WAV files, works in any DAW, and is royalty free.
