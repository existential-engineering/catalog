details: |-
  Inspired by legendary synths, we've recreated the most typical and authentic
  analog sounds from the arp synths. We started by selecting the best presets
  from original sounds and plugin resources and so created a library full of the
  most wanted sounds. Keeping the characteristics of the synth, even with
  detuning and analog drift.

  So you'll get luscious pads, power leads, detuning strings, deep funky basses,
  all on the modern synth avenger. Perfect for electro, dance and all kinda
  retro music.

  Best of all, it comes with the vintage skin retrovenger and a selection of
  famous sounds. If you're looking for an analog synth for avenger, this is your
  expansion.

  Pure emulated va sound, no sampling, except for the drums. Old vintage sounds,
  luscious pads, power leads, detuning strings, deep funky basses on avenger.
  With detuning and analog drift.

  A total of 174 presets pure unique analog sounds. Perfect for pop, rock,
  synthwave, new wave, electro. Macro's, aftertouch and mod wheel assigned
  presets.
specs: |-
  - Pure emulated va sound
  - Analog drift
  - Detuning
  - Macro assignments
  - Aftertouch assignments
  - Mod wheel assignments
  - Retrovenger skin included
  - 174 presets
  - Solina string machine bank
  - Bonus presets from analogue classics legends expansions
  - Famous sounds from pop, rock and synth classics
