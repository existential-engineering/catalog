description: "Big Bang Orchestra: Eridanus percussion ensemble riffs: powerful &
  driving rhythmic patterns. Massive power of up to six percussionists."
details: |-
  Percussion ensemble riffs: powerful percussion patterns. The second drums and
  percussion installment of the big bang orchestra adds powerful, driving
  rhythmic patterns to our series of tutti recordings. The wide variety of
  patterns and loops not only complements the symphonic riffs included in bbo:
  capricorn, but lends energy and drive to any track. All patterns are
  categorized by frequency ranges in main riffs, low riffs, and high riffs. The
  main and low riffs are played using the taiko drums, bass drum and concert
  toms, while the high riffs are created using small concert tom, snare drum,
  stacked cymbals, conga and bongos.

  All patterns can be mixed, matched and stacked across the board, letting you
  create gigantic percussion ensembles if you wish. Every pattern includes a
  single stroke that you can use to end a phrase any time during its 4-bar run.
  What's more, the synchron player's new time-stretch feature lets you
  automatically sync the patterns to your host tempo, or manually in real-time
  to any other tempo of your choice.

  Big sound, big impact. The instruments were lined up at three main positions
  on stage (left, center, right), with one or two instruments per position. As
  with all tutti recordings of the big bang orchestra, they were played together
  by the percussionists, from subtle volumes to fortissimo strikes. The ensemble
  recordings were captured with an array of microphones, including an overhead
  mic for every stage position and close mics for every instrument.

  The individual overhead and instrument signals are available separately in the
  synchron player's mixer, in addition to the decca tree, surround and high
  surround mics. Using the included mixer presets, all percussion riffs of bbo:
  eridanus perfectly match the epic sound of all the other synchron stage
  recordings of our big bang orchestra.

  Big bang orchestra: eridanus by vienna symphonic library (vsl) is a virtual
  instrument audio plugin for macos and windows. It includes, and is therefore
  "powered by", synchron player, which functions as a VST plugin, an audio units
  plugin, a VST 3 plugin and an AAX plugin.
