details: |-
  Sound design expert Sean Divine brings more of his track ready 808s and sub-basses to SubLab.

  Sean specializes in designing sounds for hip-hop, trap and future bass genres. He has been instrumental in developing SubLab as well, acting as a consultant on SubLab's features during development and designing some of the factory sounds and samples.

  You get 10 subs that are hit worthy and track ready straight out the box.

  This pack was created by sound designer, mix engineer, and YouTube educator Sean Divine.

  All of Future Audio Workshop's patch packs are NKS ready for Maschine and Komplete Kontrol. Once your purchase is complete, the pack shows up in your FAW account: download the zip file and follow the instructions on how to import the new sounds into SubLab.
specs: |-
  - 10 SubLab patches
  - Designed by Sean Divine
  - NKS ready for Native Instruments Maschine and Komplete Kontrol
  - Delivered as a zip download through your FAW account
  - Patches: Clyde Glide, Crunch Time, Lean And Mean, Lucky 707, NoBudget, Off The Wall, SlippinSlide, TBottomRez, Tommy Knocker, Triad State
