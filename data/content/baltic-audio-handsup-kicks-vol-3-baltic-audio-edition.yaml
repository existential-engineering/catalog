details: |-
  'Handsup Kicks Vol 3 (baltic audio Edition)' by CESA SAMPLES is a royalty-free Sylenth1 preset pack designed for modern Hands Up, Hard Dance, Hardstyle, Hypertechno, 2000s Dance and harder EDM productions.

  This baltic audio Edition includes 32 presets for LennarDigital Sylenth1, capturing energetic Hands Up leads, hard dance basses, arpeggios, chords, FX and kick-style synth sounds. It provides ready-to-use presets for building driving basslines, uplifting melodies, hard dance hooks, festival-style drops and nostalgic Hands Up arrangements.

  Requirements: LennarDigital Sylenth1 v3.06 or higher is required.

  Please note: This baltic audio Edition contains Sylenth1 presets only. It does not include WAV samples, loops or MIDI files. The included drum-type preset is a Sylenth1 preset, not an audio kick sample. Drums and some FX used in the demo are not included as separate audio files.
specs: |-
  - 32 presets for LennarDigital Sylenth1
  - 16 leads
  - 6 basses
  - 3 arpeggios
  - 2 chords
  - 2 FX
  - 1 bell
  - 1 drum-type preset
  - 1 pad
  - Multi-genre
  - PC/Mac compatible
  - 100% royalty-free
