details: |-
  Becrux is a new collection for u-he tyrelln6 formed by 60 patches. Becrux is
  full of distorted, grainy, unstable and detuned analog sounds rough and
  experimental just like tyrelln6.

  This soundset all about dark and cinematic sounds, inspired by the music of
  john carpenter, trent reznor and s u r v I v e.

  Formed by raw analog basses, dystopian pads, distorted powerful leads, going
  out of tune synths and keys, thrilling science fiction effects, all the sounds
  of this soundset are noisy and slightly erratic which makes of becrux the
  perfect soundset for dark electronica and darkwave projects.

  Contains: PDF with a detailed installation guide. 60 presets. Normalized
  volumes. Velocity sensitivity. Modwheel control.
