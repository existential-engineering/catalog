description: For this pack, we've been to construction sites, root cellars and other unusual locations. Get this wide-ranging collection of remarkable real-life spaces for your productions.
details: |-
  IR-Pack Realistic Rooms is a convolution reverb library from HOFA-Plugins built entirely from real-life spaces. The product page describes trips to construction sites, root cellars and other unusual locations to capture a wide-ranging collection of remarkable everyday and industrial rooms.

  It is a content add-on rather than a standalone processor: the page states that to buy IR-Packs you need either the IQ-Series Reverb V2 or the HOFA SYSTEM IR-Verb, one of which acts as the host for the impulse responses.

  The published impulse response list runs to 161 entries covering domestic interiors (apartments, bedrooms, living rooms, kitchens, bathrooms, dressing rooms, hallways and staircases), below-ground spaces (cellars, earth cellars, catacombs, storage and tank rooms) and larger industrial or commercial rooms (factory halls, hangars, garages, gyms, sales halls and warehouses from 500 up to 3000 square metres).

  Several spaces are captured in unfinished and finished states, notably recording and control rooms documented in construction, half way done and fully equipped versions, and some entries capture the coupling between two rooms with a connecting door open or closed.

  Forty of the impulse responses are binaural variants of their standard counterparts, and a few use alternative or multiple microphone placements within the same space. SoundCloud sound examples and the complete impulse response list are published on the product page.
specs: |-
  - 161 impulse responses captured in real-world spaces
  - Requires IQ-Series Reverb V2 or HOFA SYSTEM IR-Verb as a host
  - 40 binaural variants alongside the standard captures
  - Spaces range from apartments, cellars and staircases to factory halls, hangars and warehouses up to 3000 sqm
  - Rooms captured in multiple states (in construction, half finished, fully equipped) and with doors open or closed between coupled rooms
  - Full impulse response list and SoundCloud sound examples published on the product page
