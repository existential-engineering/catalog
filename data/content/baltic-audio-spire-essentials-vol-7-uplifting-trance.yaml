  - 10 Plucks
  - 10 Pads
  - 5 Sequences
  - 5 Arps
  - 4 Gates
  - Modwheel Assignment
  - 40 MIDI Files
  - Multi-genre
  - PC/Mac Compatible
  - 100% Royalty-Free
