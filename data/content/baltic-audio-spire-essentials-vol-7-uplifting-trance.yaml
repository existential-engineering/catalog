details: |-
  Spire Essentials Vol. 7: Uplifting Trance is a preset pack for Reveal Sound Spire designed for Uplifting Trance, Trance, Progressive Trance, Dance and melodic EDM productions.

  The pack includes 64 royalty-free Spire presets and 40 MIDI files taken from the demo, covering ready-to-use leads, basses, plucks, pads, arps, gates and sequences for emotional melodies, euphoric breakdowns, energetic drops and classic trance-style productions.

  Requirements: Reveal Sound Spire version 1.1 or higher is required.

  Please note: the drums and some FX used in the demo are not included.
specs: |-
