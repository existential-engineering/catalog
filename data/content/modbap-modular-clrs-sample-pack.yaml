details: |-
  Descriptions

  Digital Download Only. Colored, texturized, and bangin'! CLRS sample pack was designed with coloration in mind. Each drum sample was processed with saturation, a bit of compression, and a few other tricks to texturize the samples and make them slap. Because of the saturation techniques used in the sound design process, we've included stereo versions of the samples to allow for a bit more color in the mix. A mono set is also included. The MPC expansion included two programs/drum kits (Mono and Stereo). So, take your pick. It all slaps rather hard anyway.
specs: |-
  - 32 drums samples (8 kicks, 8 snares, 8hats & 8 percussive)
  - 16bit / 44.1 khz wave files
  - Includes Mono and Stereo versions of the kit
  - Includes MPC expansion kits compatible with MPC 2.0 and above and MPC One / Touch / X / Live
  - Format: 16bit WAV Files
  - Compatibility: Anything that allows the use of wav files - so everything that matters. MPC Software, All DAWS & Samplers
  - License: Royalty-Free
  - Delivery: Download instantly after purchase.
