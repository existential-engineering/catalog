details: |-
  Disco Never Dies

  We dove deep into the essence of Disco, recording micro-phrases inspired by top-charting hits from the golden era of disco. Every riff, lick, and strummed rhythm was performed with precision and soul, capturing that unmistakable '70s guitar vibe that brought dancefloors to life. These aren't loops. They're playable, expressive building blocks designed for producers who want to channel the raw energy and funk of vintage disco. Each micro-phrase was recorded with multiple round robins, giving you natural variation and a truly human feel. With over 3,600 samples across 17 distinct parts, no two phrases sound exactly alike letting you build authentic, layered performances that never feel static. To give you full creative control, every phrase is available in both Direct Input (DI) and Amped versions. Whether you want to run the clean DI through your own effects chain or drop in the warm, punchy amp tones straight out of the box, the choice is yours. Pair Vintage Disco Guitars with Nu-Disco Drums for a tight rhythm section and layer in Disco Strings for that classic, soaring shimmer. Whether you're scoring a retro film, crafting a radio-ready dance track, or just vibing out with vintage flair. This is the guitar groove machine has been waiting for. Perfectly imperfect.
