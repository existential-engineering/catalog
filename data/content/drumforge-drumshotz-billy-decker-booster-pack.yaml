description: Add more of Billy's chart topping drum sounds to your sample collection with this Drumshotz Booster Pack. Enhance any of your favorite samples or augment them in with your raw drum recordings and discover a fresh take on your sound.
details: |-
  The Drumshotz Billy Decker Booster Pack is a one-shot drum sample expansion curated by Nashville mixing legend Billy Decker, containing 21 samples delivered in 44.1kHz, 24-bit WAV format.

  Billy Decker has mixed over 15 Billboard-certified number one songs and is known for his work with artists such as Rodney Atkins, Sam Hunt, and Chris Young, bringing his signature Nashville country sound to this sample collection.

  The pack is designed to work as a standalone resource within any DAW or alongside sample triggering software — no additional sample packs or software are required to use it.

  It functions as an expansion to Decker's original Drumshotz Signature Pack, providing additional one-shot samples for mixing and production use.
specs: |-
  - 21 one-shot drum samples
  - Format: WAV (44.1kHz, 24-bit)
  - Compatible with any DAW or sample triggering software
