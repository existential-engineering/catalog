description: A 21-sample one-shot booster pack from Nashville mixer Billy Decker, adding more of his chart-topping drum sounds in 44.1 kHz 24-bit WAV format. It stands alone and requires no other sample pack or software.
details: |-
  Drumshotz Billy Decker Booster Pack extends the Billy Decker Drumshotz line with an additional set of one-shot drum samples. It was created after the success of his signature Drumshotz pack, and adds more of the drum sounds behind his mixes.

  Billy Decker is a Nashville mixing engineer with more than fifteen Billboard certified number one songs to date, known for his work with Rodney Atkins, Sam Hunt, Chris Young, Dustin Lynch, and Colt Ford.

  The pack contains 21 samples in 44.1 kHz, 24-bit WAV format, usable with any triggering program or DAW. They can enhance existing sample libraries, augment raw drum recordings, or extend the original Billy Decker signature pack.

  It requires no additional sample packs or software, so it works as a standalone library as well as an add-on.
specs: |-
