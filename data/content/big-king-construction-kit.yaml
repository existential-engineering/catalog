details: |-
  Big King Construction Kit consists of hip hop, rnb and trap samples, loops and
  kits in wav format. Featuring 5 radio ready construction kits loaded with
  pounding basslines, smoking synths, punchy drums, epic brass, smooth strings,
  striking pianos, vocal shouts, FX and many more.

  10 construction kits organized into folders: guitar loops (6 wav files),
  kingkit MIDI (sequences at various tempos), kingkit loops (at multiple tempos
  with flp, mp3, and wav files), one-shots (32 wav files), presets (directwave,
  gladiator, nexus, vanguard fst files), and vocal loops (3 wav files).

  Kingkit MIDI folder contains sequences at 73 tempo (8 mid files), 88 tempo (10
  mid files), 97 tempo (14 mid files), 108 tempo (14 mid files), 143 tempo (9
  mid files), 93 tempo (8 mid files), 130 tempo (5 mid files), 135 tempo (8 mid
  files), and 130 tempo (8 mid files).

  Kingkit loops folder includes loops at 88 tempo (1 flp, 1 mp3, 14 wav files),
  93 tempo (1 mp3, 13 wav files), 142 tempo (1 flp, 15 wav files), 143 tempo (1
  flp, 1 mp3, 11 wav files), 97 tempo (1 flp, 1 mp3, 11 wav files), 130 tempo (1
  flp, 9 wav files), 108 tempo (1 flp, 1 mp3, 12 wav files), 135 tempo (1 flp,
  14 wav files), 73 tempo (1 flp, 1 mp3, 10 wav files), and 130 tempo (1 flp, 13
  wav files).
