details: |-
  Exonode features 1,207 designed sound effects with an abstract high-tech aesthetic.

  Sound designer Ivo Ivanov brings us a brand new collection of designed sound effects, including shape-shifting spectral elements, intricate electronic glitches, twisted humanoid expressions, high-tech interface articulations, abstract distorted fragments, mutated biomechanical impacts and ancient alien artifacts that defy categorization.

  Exonode comes with 2.75GB of 24bit/96kHz .wav audio content geared toward music production, game audio and motion graphic design. Whether you're working on a blockbuster sci-fi shooter game, a modern electronic music album or a high-tech product advertisement, you will find this collection to be an indispensable resource.

  While our sound effects are carefully designed to work with your favorite samplers and DAWs, they pair up particularly well with our own brand of audio contortion devices. Our wide selection of packs grant Palindrome, Polygon, Cataract and Tactic users access to thousands of fresh ingredients.
