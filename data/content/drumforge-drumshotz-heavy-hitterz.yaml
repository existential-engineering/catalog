details: |-
  One-shot samples are powerful weapons for enhancing drum mixes, providing the extra punch and consistency needed to cut through any mix. Many professional mixers maintain highly coveted collections of one-shot drum samples refined over years of mixing — this is how they achieve their signature drum sound regardless of the quality of the source recording.

  Drumshotz is a series of highly coveted drum samples from professional mixers designed to enhance, blend, or replace drum sounds in your mixes. The Heavy Hitterz collection delivers 305 total samples across kicks, snares, and toms, all recorded and processed to be mix-ready out of the box.

  The library includes 142 kick drum samples, 25 snare drum samples, and 138 tom samples, all delivered at 44.1 kHz in 24-bit WAV format. A multi-velocity TCI (Trigger/Combine/Import) set for a Kick/Snare/Tom configuration is also included, enabling realistic dynamic response in drum replacement and augmentation workflows.

  Drumshotz Heavy Hitterz is compatible with all major triggering programs (such as Steven Slate Trigger, Drumagog, and Slate SSD) as well as any DAW for direct sample layering. The samples are engineered to blend naturally with raw recordings or other sample libraries.

  The product is a digital download with a perpetual license, free lifetime updates, and unlimited customer support. No physical media or shipping is required.
