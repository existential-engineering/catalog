details: |-
  After producing Playboi Carti's long anticipated Whole Lotta Red album, Richie Souf is back with more 808s exclusively designed for SubLab.

  Atlanta, Georgia producer Richie Souf is bringing a fresh sound to some of the biggest artists in the game including Future, Gunna, Playboi Carti, and Young Thug.

  He started out making beats in the early 2000s with Fruity Loops. After developing a following online, he started working small sessions in home studios with local rappers. Today, Richie Souf is defining the sound of a new generation of hip-hop.

  Get 9 sub sounds created by Richie exclusively for SubLab. Use them in your track as-is or tweak to make them your own.

  All of Future Audio Workshop's patch packs are NKS ready for Maschine and Komplete Kontrol. Once your purchase is complete, the pack shows up in your FAW account: download the zip file and follow the instructions on how to import the new sounds into SubLab.
specs: |-
  - 9 SubLab sub sounds
  - Designed by Richie Souf
  - NKS ready for Native Instruments Maschine and Komplete Kontrol
  - Delivered as a zip download through your FAW account
  - Patches: 808 Coupe, 808 Neon, 808 Real ATL, 808 Red, 808 Rich!, 808 Skeleton, 808 VVS, 808 Eternal, 808 Molly
