description: Ableton Drum Racks for Native Instruments Drumlab. This collection
  of Ableton drum racks provides preset integration for Ableton push.
details: |-
  This collection of Ableton drum racks features all factory presets for the
  Native Instruments drumlab Kontakt library.

  All articulations and presets mapped and individually labelled.

  Ease of navigation to load all presets directly from your ableton push
  controller device browser.

  163 ableton drum racks to instantly load the drumlab factory library preset
  with ableton mappings.

  Color coded pad design for visual performance with intelligently mapped
  automation parameters per preset.

  Labelled pads for post performance editing and automation within the ableton
  clip editor with each MIDI note and articulation individually named.

  This pack routes all audio output through a single ableton track, with mixing
  further enhanced through kontakt/drumlab mixer or additional ableton audio
  effects.
specs: |-
  - 163 Ableton drum racks
  - Ableton push 2 optimization
  - Color coded pad design
  - Intelligently mapped automation parameters
  - Labelled pads for post performance editing
  - MIDI note and articulation individually named
  - Audio routing through single Ableton track
  - Native Instruments drumlab Kontakt library compatibility
  - macOS and Windows support
