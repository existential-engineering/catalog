details: |-
  The Roland jd-xi is one powerful synth for a small product. Roland has been
  making great synthesizers for a very long time. They are responsible for very
  many classic synths over the years.

  "analog sound box" is all about classic synths. Our goal with "analog sound
  box" was to bring those missing elements to the jd-xi.

  The jd-xi is very capable for its small size but a synth sounds only as good
  as its presets. "analog sound box" is all about making that little hardware
  synth sound like big hardware.

  A complete new preset expansion bank (64) full of warm, classic sounds
  including: massive pads, thick basses, classic keys and organs, brass, fx
  leads, and vox.
specs: |-
  - 64 preset expansion bank
  - Massive pads
  - Thick basses
  - Classic keys and organs
  - Brass
  - FX leads
  - Vox
