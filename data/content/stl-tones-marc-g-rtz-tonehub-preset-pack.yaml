details: |-
  Marc Görtz is the guitarist, main songwriter and co-producer of German metalcore band Caliban, who have released thirteen studio albums since forming in 1997. He writes the music across their catalogue, including The Awakening , Say Hello to Tragedy , I Am Nemesis , Ghost Empire , Gravity and Elements , and produces from his own Nemesis Studios. He has a signature model with Legator Guitars.

  Captured at Sawdust Recordings in Halle, Germany, using five of Marc's go-to amp, cab and pedal setups, this signature collection caters to all of his playing styles.

  Marc's pack contains 49 captures.
