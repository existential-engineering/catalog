details: |-
  This cymbal set was sampled to provide the ultimate simple cymbal setup but packed with a powerful punchy sound in the metalcore genre.

  The package ships as Kontakt instruments (requiring the full version of Kontakt 4.2.4.5316 or later) together with a Kontakt multi holding the entire cymbal set in one instrument, a WAV file for each sample, and a Cubase drum map for use with the Kontakt multi. Each cymbal was recorded with articulations and performed velocity.

  Recorded, edited and mixed by Joey Sturgis. All samples are a work of art created by Joey Sturgis. You may use these samples in a music, video, or film production. You may not sell these samples as a work of your own, nor sell them as a whole or in part within other libraries, sample sets, or products of any kind.
