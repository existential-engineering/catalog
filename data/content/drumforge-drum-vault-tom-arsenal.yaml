description: 22 mix-ready tom sets sampled across four studio rooms, delivered as processed TCI files and raw multi-sample multi-velocity WAVs. Recorded and mixed with analog gear, with round-robin sampling and multiple microphone textures per tom.
details: |-
  The Drum Vault brings curated collections of highly desired drums, recorded and mixed in high-quality environments, so producers get tonal flexibility without either the bluntness of a one-shot pack or the complexity of a full sampler. It was built in response to user requests for something between the simplicity of Drumshotz and a sampler platform.

  Tom Arsenal gathers 22 mix-ready tom sets so a suitable tom sound can be found quickly, then blended for tone, ambience, and punch to fit a production. The sets were sampled at four studios known for their drum sounds, curated from local drum techs and producers familiar with each room, then mixed on the hardware available in that room to bring out its character.

  The samples are mixed to competitive commercial standards without being over-processed, so they sit in a mix as they are and still take further EQ, compression, and transient shaping well. The multi-sampled versions are aimed at maximum realism, and raw WAV files for each tom are supplied for anyone who wants to do their own processing.
specs: |-
  - 22 tom sets in total, mix ready
  - Recorded across four rooms for tonal flexibility
  - Wood Room: 8 sets (three five-tom, two four-tom, two three-tom, one two-tom)
  - Brick Room: 4 sets (two three-tom, two two-tom)
  - Vibe Room: 3 sets (two three-tom, one two-tom)
  - Hybrid Room: 7 sets (two three-tom, five two-tom)
  - Recorded and mixed with high-quality analog gear
  - Multiple engineering setups for sonic sculpting
  - Multiple velocities and round-robin sampling for realistic dynamic performances
  - Processed TCI files for all 22 tom sets, with a TCI per microphone texture
  - TCI presets for quick loading of all microphone textures per tom
  - Raw unprocessed multi-sample, multi-velocity WAV files for all 22 tom sets
