description: "A curated collection of 22 mix-ready tom sets recorded across 4 unique studio environments (Wood, Brick, Vibe, and Hybrid rooms), delivered as processed TCI files and raw multi-sample, multi-velocity WAV files for maximum tonal flexibility in drum production."
details: |-
  The Drum Vault brings curated collections of highly desired drums, recorded and mixed in the highest quality environments to achieve a massive amount of tonal flexibility in your productions.

  Drum Vault Tom Arsenal gives you an arsenal of 22 mix-ready tom sets. The collection covers 4 unique studios known for their drum sounds, with curated tom sets from local drum techs and producers who were intimate with these environments. Each drum was painstakingly sampled, then mixed with the unique hardware available to bring out the character and unique tone of each room.

  Samples are mixed to competitive and commercial standards. They take well to additional post-processing like EQ, compression, and transient design. The multi-sampled versions were designed for maximum realism. Raw WAV files for each tom are also provided for custom processing.

  Purchase includes processed TCI files for all 22 tom sets, TCI per individual microphone texture, raw multi-sample multi-velocity WAV files, perpetual license, and free lifetime updates.
specs: |-
  - 22 tom sets across 4 drum rooms
  - Wood Room: 8 sets (3 five-tom, 2 four-tom, 2 three-tom, 1 two-tom)
  - Brick Room: 4 sets (2 three-tom, 2 two-tom)
  - Vibe Room: 3 sets (2 three-tom, 1 two-tom)
  - Hybrid Room: 7 sets (2 three-tom, 5 two-tom)
  - Processed TCI files for all 22 tom sets
  - Raw multi-sample, multi-velocity WAV files
  - Multiple velocities and round-robin sampling
  - Perpetual license
  - Free lifetime updates
  - Instant digital download
