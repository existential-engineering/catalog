description: Airwaves is a unique synthesizer which uses 24 xy motion sequencers
  to build collages using short wave radio signals as its sound source.
details: |-
  The motion sequencers ensure that you will always get something new using the many randomizers, and presets can have an organically complex lifespan. Each sequencer can be recorded manually by pressing record, playing a note and moving the corresponding xy controller. Once the sequence is recorded it will be played back immediately. Alternatively there is a large database of pre-recorded sequences included which are used by the randomizers.

  The intention for the scripted instrument was to take some of the ideas used in motion, adding 4 more motion sequencers and attempt to create a synth that is visually less complex. As a result all of the sound generation is available on a single panel, and there is only one other panel which is dedicated to the fx and preset browser.

  The samples themselves are taken from many hours of recorded material, attempting to bring out the most interesting loops and to hopefully create a diverse collection of sounds. The radios are essentially used as synthesizers to create unique designed loops which are only possible using a radio. There are quite a few number stations captured too, although for the most part these days they tend to be either morse or electronic broadcasts as opposed to actual numbers although a few of these were captured.

  The samples are provided as wavs as opposed to .ncw so that they can easily be used outside of kontakt for those that wish to do so.
specs: |-
  - 24 xy motion sequencers
  - 508 wavs recorded using shortwave radio
  - 4 synthesizers with xy pad
  - Filter
  - Ar envelope
  - LFO
  - Single waveform per synth
  - 28 xy motion sequencers
  - Reverb
  - Delay
  - EQ
  - Phaser/chorus/flanger
  - Preset system
  - 200 presets included
  - Microtuner
  - 7 global randomizers
  - Local randomizers
  - Kontakt instrument
  - Wav format samples
