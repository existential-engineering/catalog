details: |-
  Keep Perfect Time

  Tick Tock UDS is perfect for Hybrid Cinema scoring or sound design, adding a plethora of clicks, ticks, and tocks to your palette. We spent many months recording a vast assortment of time keeping devices, dusty old typewriters and everything that goes tick and/or tock. Over 3.3K samples later and we have the ultimate library for your ticking tocking clicking clocking needs. Create percussive pulses with any of the 37 Parts or 44 Programs. Choose from 17 different Egg Timers, 9 Metronomes, 9 Stopwatches, and 2 Typewriters to create your perfect temporal soundscape. Morph a ticking timepiece into a typewriter or tasty synth hit to create fun new rhythmic textures.
