details: >-
  Ableton drum racks for ezdrummer rock! Ezx features drum racks for all factory
  presets for the toontrack ezdrummer rock! Kit. These racks are the most
  complete integration between ableton live and toontrack ezdrummer including a
  host of features ready to use on ableton push. All factory presets are ready
  to go.


  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all rock! Ezx factory presets from ableton push
  controller device browser. 20 ableton drum racks to instantly load the rock!
  Factory library "mix ready" presets with ableton mappings.


  Color coded pad design for visual performance and finger drumming. Know your
  rock! Ezx crashes from your snare articulations. Individually labelled drum
  rack pads for clear visualisation, post performance editing and automation to
  all drum rack / instrument articulations.


  Mapped ableton macros to ezdrummer macros with preset values for ease of use
  in push and simple to use automation programming. Audio routing options.
  Singleout presets featuring 10 ableton drum racks for all factory presets
  single audio output to single ableton track. Multiout presets featuring 10
  ableton drum racks for all presets in multiple audio channel output from the
  plug in to multiple ableton audio tracks using the multi output ableton
  template also provided.


  Use the template racks and extend to your own rock! Ezx presets, swapping out
  individual sounds or articulations. You are 100% ready to go with the factory
  presets but there is no limitation to creating your own presets from these
  templates. Simply save a new drum rack based upon the modified timbresandtones
  template.
specs: |-
  - 20 ableton drum racks
  - Color coded pad design
  - Individually labelled drum rack pads
  - Mapped ableton macros to ezdrummer macros
  - Audio routing options
  - Singleout presets with 10 ableton drum racks
  - Multiout presets with 10 ableton drum racks
  - Multi output ableton template
  - Track level audio mixing control
  - Ableton push 2 color pads mode
  - Ableton live 9.5 or above
  - Toontrack ezdrummer2 required
  - Toontrack ezdrummer rock! Kit ezx expansion pack required
