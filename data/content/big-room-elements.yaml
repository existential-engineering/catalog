details: |-
  Resonance Sound proudly presents "audio boutique - Big Room Elements", their
  very own way of bringing spring to your studio! Audio boutique's latest
  masterpiece is gonna be just like the first flowers after a long frosty period
  to your next big room smasher.

  A massive arsenal of 475 single sounds and loops ranging from fx, drums,
  build-ups and bass/chord/melo-loops to inspiring MIDI files and lennar digital
  sylenth1 presets is ready to be put together, giving without a doubt an
  instantly ground-shaking big room experience.

  Whether you prefer carefully crafted construction kits or building everything
  from the scratch with all the little spices such as live percussion or other
  fancy things - it's all in here.

  Needless to mention the creators took great care of maximizing flexibility and
  providing each file ready-to-use.
