details: |-
  'Serum Essentials Vol 3: Future Bass' from baltic audio is aimed at producers looking for the sound of current Future Bass. It holds 64 top-quality presets for the Serum synthesizer, including hand-crafted basses, leads, plucks and more.

  Each preset is programmed by a professional sound designer, with every parameter tweaked in detail, as a source for new and commercial sounds within a composition.

  The material can also be used for genres like EDM, Deep House, Pop and Trap.

  In addition, 55 MIDI files taken from the demo and 16 bonus MIDI files are included.

  Please note: The drums and some FX used in the demo are not included in this product. These presets require v1.3 or higher of Xfer Records Serum.
specs: |-
  - 64 Presets for Serum
  - 11 Leads (Presets)
  - 10 Basses (Presets)
  - 10 Plucks (Presets)
  - 9 Chords (Presets)
  - 8 Keys (Presets)
  - 7 Pads (Presets)
  - 5 Synths (Presets)
  - 2 Sequences (Presets)
  - 2 FX (Presets)
  - 55 MIDI Files
  - Multi-genre
  - PC/Mac Compatible
  - 100% Royalty-Free
