details: |-
  Talk To Me, Baby

  Feel the California love from our Vintage Talk Box UDS library. Famously used by musicians like Peter Frampton, Pink Floyd, Pete Drake and Stevie Wonder, the talk box is a mechanical effect that lets your instrument "speak" through you. We Ultra-Deep Sampled our Talk Box through a vintage tube amp and trusty SM58, providing over a dozen word options, plus a complete vowel set and velocity transition samples, all with the authentic tone of this wonderfully organic and expressive effect. Vintage Talk Box UDS includes 81 Programs and 38 Parts that encompass striking leads, ambient pads, plucks, unique effects, growly basses, and more. Soundpaint morphing even allows for real-time transitions between various vowels and words. It's a perfect addition to your sound palette, right at home in funk, classic rock, and electronic genres.
