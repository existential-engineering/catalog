details: >-
  The 909 loops from mars samples is a collection of hardware 909 loops. From
  madonna's "vogue" to inner city's "good life," the 909 has been a pillar of
  modern electronic and pop music since its introduction in 1985 and, much like
  the 808, has become one of the most sampled electronic musical instruments of
  its kind.


  Samples from mars sampled hundreds of hardware loops ranging from transients
  to square-waved 909 trash, including whole beats, individual drum loops, tops
  and combos.


  Samples from mars used outboard gear to process the 909 loops: running beats
  through a spring reverb, compressing them, and driving them into (original)
  1642 mackie pres and through ibanez and lexicon pcm42 single rack effects
  units.


  Contents: 500 raw 909 loops recorded at 120 bpm (24-bit wav, rex2, & apple
  loops). 15 MIDI groove files. 1.6 gb total.


  Requirements: if using raw wav samples: 24-bit wav compatible DAW or sampler.
  If using logic: logic 9+ (required for apple loops). 570 mb free space.
