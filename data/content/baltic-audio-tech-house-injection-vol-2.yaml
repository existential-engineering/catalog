details: |-
  'Tech House Injection Vol 2' from baltic audio brings you a powerful collection of Tech House samples and loops to push your production to the next level. You'll find a bunch of drums, basses, synths, drumloops, fx and more.

  This royalty-free pack provides you with all of the elements you need to make chart-topping Tech House hits.

  35 MIDI files are included for the majority of musical phrases heard in these kits. Together with the several bass- and synthshots there are no limits to your creativity.

  Of course, the numerous ready-to-use loops also allow you to achieve great results very quickly.

  You can use this pack for genres like Tech House, Minimal House, Deep House, Techno and more.
