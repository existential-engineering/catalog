details: |-
  Ambisonic city (berlin) features an ambisonic sound image of a modern city in
  western Europe. The library delivers a vast variety of spherical surround
  sounds of vehicles, public transport trains, trams and airplanes that were
  captured at crowded intersections, various squares, arterial roads and the
  tegel airport.

  As complementary counterpart the library also contains recordings from wide
  open spaces, recreation areas, public parks and side roads. All recordings are
  made with the ambeo microphone and the encoded b-format fuma files are ready
  to use for speaker arrays of any number.

  For the live pack all included takes are prepared as instant live clips and
  were also split to form 96 instrument racks. With these racks the various key
  elements of each take can be easily used in MIDI-based compositions.

  Broadcast wav light: 30 takes, 16-bit/48khz, stereo. 1.6 gb (extracted), 140
  mins total playing time. Embedded bwav compatible descriptions

  Broadcast wav hd: 91 takes, 24-bit/96khz, stereo. 17 gb (extracted), 480 mins
  total playing time. Embedded bwav compatible descriptions. Ambisonic: 91
  takes, 24-bit/96khz, ambisonic b-format (fuma, wxyz). 32 gb (extracted), 480
  mins total playing time. Embedded bwav compatible descriptions. Live pack:
  requires live 8.4 or higher. 96 instrument racks. 30 long running clips, 1.7
  gb.
specs: |-
