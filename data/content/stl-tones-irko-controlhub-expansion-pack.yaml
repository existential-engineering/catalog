description: "IRKO has become an icon in the music industry, leading the sound
  of popular music with his bold, energetic, and genre-defining mixes. Working
  out of his own state-of-the-art mixing facility in LA, IRKO has engineered
  worldwide hits for Kayne West, Ty Dolla Sign, The Weeknd whilst also crossing
  over into the gaming world, crafting the sonics for arcade games such as
  Street Fighter 6. This expansion pack brings the precise and punchy
  engineering of IRKO’s mixes to the ControlHub platform with the signal chains
  heard on countless hit records.Focusing on critical foundations of modern
  hip-hop and rap, IRKO has included his signal chains for hard-hitting drums
  and 808s, guitar and keyboard tonal shaping options, and the tools he uses to
  keep the vocals forward and present in a mix.This expansion pack has a total
  of 75 presets."
