details: |-
  Particles is an exploration of granular decay and microscopic motion, a world where sound erodes, folds, and recombines itself in unpredictable ways. Built from layers of modular synthesis, electromagnetic feedback, and analog filtering, it captures the moment where structure dissolves into noise and texture. Each tone is alive with movement: fragmented pulses, shifting drones, and dust-like fragments that drift between rhythm and chaos. Whether used as source material or a performance tool, Particles embodies the Colossus Audio approach — raw circuitry, unstable beauty, and sound that feels physical.
