  - 10 solo desks
  - 22 multi-player desks
  - 70 players total
  - 5 MIDI tracks (violins I, violins ii, viola, celli, bass)
  - Continuously-adjustable bow position
  - Intel core i7 processor
  - 8 GB RAM
  - Dual hard drives
