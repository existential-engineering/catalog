details: |-
  70 DVZ Strings lets you control everything from a single intuitive user interface. One-click loads everything. You no longer have to interrupt your creative workflow to search through deep file menus, find the sounds you need, then wait an eternity for them to load. Clicking individual buttons recalls comprehensive factory or user presets.

  You only need five MIDI tracks for everything: violins I, violins ii, viola, celli and bass. Everything is done on those five tracks with MIDI cc control. Gone is the need for dozens of tracks for different articulations and styles. This library lets you get more realistic sound with greater speed and less effort.

  70 dvz strings features real-time, continuously-adjustable articulations and styles without stopping to load or unload alternate samples. It offers "must-have" controllability such as a collective controller that allows you to go from legato through marcato using any continuous MIDI controller. You can continuously vary the bow position up and down, side to side, and even where each of the strings cross over as the left hand moves up the neck.

  Audio impressions is the first company in the world to use chris stone's patented real-time divisi process, dvz. Dvz overcomes the unnatural "organ" sound that can characterize conventional string sample libraries. The dvz process automatically divides chords being played and distributes them in real-time to the number of players you've selected, keeping the number of players constant no matter how many notes are in a chord.

  Chris stone's patented space process puts the final touch on 70 dvz strings. Space simulates the interactive sound bleed of all players into all room and spot mics on the stage for that same sense of "ensemble" playing you get with live recordings. You can place the desks anywhere on the virtual floor, and you'll hear distinctly different sounds appropriate to those placements.
specs: |-
