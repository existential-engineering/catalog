details: |-
  Tortured Cello captures the sound of a string instrument at its breaking point, bowed, scraped, and re-amplified through layers of distortion, feedback, and analog circuitry. Every sample carries tension: wood creaks, resonant drones, and the strained breath of vibrating metal. Tortured Cello" is a collection of recordings made on a 1737 Nadotti that thanks to its rarity, build and range provides a highly unique sound palette. Aching to the more cinematic sound aficionados this pack will provide unorthodox and disruptive additions to your compositions through the use of both unaltered and altered sound sources, unconventional playing styles and articulations. Credits:

  Performed by Alessandro Branca

  Recorded by Francesco Leali and Alessandro Branca. Editing and processing by Anthony Arcana and Francesco Leali.
