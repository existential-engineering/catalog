description: A collection of over-the-top one-shot drum samples from producer/mixer Joel Wanasek (Monuments, MIYAVI, Machine Head), designed to enhance, blend, or replace drum sounds in rock and metal mixes. The pack delivers 45 samples in 44.1 kHz / 24-bit format, including kicks, snares, toms, and post-production effects.
details: |-
  Drumshotz Joel Wanasek No Small Time Edition is the follow-up to Wanasek's original Drumshotz pack, built as an entirely new collection rather than an expansion of it. Wanasek's mixing credits include Monuments, MIYAVI, and Machine Head.

  The samples are aimed squarely at rock and metal productions and lean toward the larger end of the spectrum. The pack contains 7 kick drums, 10 snare samples, and 2 sets of toms, plus 7 post-production samples including sub drops, a snare bomb, and reverse sounds.

  All 45 one-shot samples are delivered at 24-bit / 44.1 kHz for use with any drum triggering program or DAW.
specs: |-
  - 45 one-shot samples total
  - 24-bit / 44.1 kHz format
  - 7 kick drum samples
  - 10 snare samples
  - 2 sets of toms
  - 7 post-production samples including sub drops, a snare bomb, and reverse sounds
  - For use with any triggering program or DAW
