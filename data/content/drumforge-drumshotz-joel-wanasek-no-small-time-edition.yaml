description: A collection of over-the-top one-shot drum samples from producer/mixer Joel Wanasek (Monuments, MIYAVI, Machine Head), designed to enhance, blend, or replace drum sounds in rock and metal mixes. The pack delivers 45 samples in 44.1 kHz / 24-bit format, including kicks, snares, toms, and post-production effects.
details: |-
  Drumshotz is a series of highly coveted drum samples curated by professional mixers to enhance, blend, or replace drum sounds in any mix. One-shot samples provide the extra punch and consistency needed to cut through a recording regardless of the quality of the source material.

  This edition is curated by producer and mixer Joel Wanasek, known for his work with Monuments, MIYAVI, and Machine Head. The collection reflects the bombastic drum sounds he uses to achieve his signature sound on rock and metal productions.

  The pack contains 45 one-shot samples recorded and processed at 44.1 kHz / 24-bit, covering kicks, snares, toms, and a post-production category that includes sub drops, snare bombs, and reverse sounds — tools aimed at taking productions over the top.

  Samples are compatible with DAWs and drum-triggering programs, making them easy to integrate into existing mixing and production workflows. The license is perpetual and includes free lifetime updates and unlimited customer support.
specs: |-
  - 45 one-shot samples total
  - 44.1 kHz / 24-bit format
  - 7 kick drums
  - 10 snare samples
  - 2 sets of toms
  - 7 post samples (sub drops, snare bomb, reverse sounds)
  - Instant digital download
  - Perpetual license
  - Free lifetime updates
