details: |-
  Bass Rigs Vol. 1 is the th-u expansion library dedicated to bass, created out
  of the best amplifiers and preamplifiers. It contains 39 rigs, 37 patches
  designed to cover any musical style and 6 effects, including an octaver, a
  bass graphic EQ and an envelope filter.

  Each amplifier has been captured with multiple settings and different speakers
  and mics configurations, to get the most exciting tones out of each setup.

  Overloud rig libraries require the rig player software available through the
  purchase of any of the following th-u bundles: th-u full, th-u rock, th-u
  metal, th-u funk and r&b.
