description: 29 tape banks and 200+ patches for M-Tron Pro IV, recorded from prepared pianos, dulcitones, Hammonds, and found-sound loops by Sound Dust in collaboration with Streetly Electronics.
details: |-
  We have the pleasure of bringing a dusty yet authentic 'Tron pack for M-Tron Pro IV sculpted by organic texture master Pendle Poucher, a.k.a Sound Dust. Known for his beautifully inspiring noises for Kontakt libraries and beyond, Pendle sampled a range of acoustic instruments, synths and keyboards to create over 200+ M-Tron Pro IV presets carefully crafted by himself, Dave Spiers, and Tom Wolfe. Additionally, this Expansion Pack brings 29 new tape banks of unique acoustic and electronic sounds and many new inspiring textures and dusts to M-Tron Pro IV.

  The instruments recorded by Sound Dust were taken to Streetly Electronics and 'Tronized' via their Skeletron, a bare-bones Mellotron M400. This involved recording everything to tape and re-recording the output via the Skeletron pre-amp. Finally, the 'Tronized' recordings were returned to Sound Dust for chopping and working into the M-Tron Pro IV.

  While time-consuming and labour-intensive, this process was vital for staying true to the Mellotron's ethos and origins. With the convergence of skills and technologies from Sound Dust and Streetly Electronics, we think this set of tape banks affords you something unique, special and highly inspirational.

  As Sound Dust, British Artist Pendle Poucher creates strange and unique sample libraries. Pendle officiates from his lovely studio in Brighton, which feels like an exotic cave where everywhere you look, you find some exciting instruments you may have never come across before. Sound Dust created a superb collection of organic libraries trusted by many composers across the globe.

  Pendle has been an M-Tron Pro user for many years, and his appreciation of the original instruments as much as our digital replica, M-Tron Pro, made him the perfect sculptor to bring new textures to the most extensive and authentic collection of 'Tron sounds in the digital world.
specs: |-
  - A Sound Dust and GForce collaboration
  - Over 200 M-Tron Pro IV patches
  - 29 carefully curated tape banks for M-Tron Pro IV
  - Requires M-Tron Pro IV (v1.0.2 and above)
  - 35 notes per tape bank
  - Exclusively available via download, 1.07 GB
