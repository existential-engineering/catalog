details: |-
  Anika Nilles is such an astonishing drummer. She has the uncanny ability to create fluidity in everything she plays, no matter how complex the groove.

  She's a master of time, and moves in and out of odd meters as easy as one, two, three, and her dedication to perfection is what makes her one of the best drummers in the world.

  Needless to say, we are thrilled to have had the chance to work with her on this midi groove pack. Fluid Fusion by Anika Nilles has everything from solid pocket beats to metric-bending grooves and fills.

  Add musicality and fluidity to your next writing session and let the grooves inspire your creativity.
