details: |-
  The Streetly Tapes Vol 4 is an expansion pack created in collaboration with Streetly Electronics, the original British Mellotron manufacturers. The collection contains 26 carefully curated tape banks derived from original UK 'Tron masters and EMI tape-stock, each with 35 notes.

  Hundreds of factory patches are included, crafted by artists including Jarrod Gosling, Matt Berry, Nick Magnus, Dave Spiers, Graeme Rawson, and Duncan Parsons.

  Tape banks: 3 More Violins, 6 Wives Moog, BIG Brass, Bowed Vibes, Bruce Vocal ADT, Electric String Section, Electric Violin, Guitar Harmonics, Layered Choir 2, M300B Lower Violin, Moody Moog, Octave Cello, Octave Recorder, Piercing Wine Glasses, Pizzi Cello, Plain Cello, Recorder, Sad String Chord Inversions, Sad String Notes Variations, Sad String Split, Soft String Section 2, Taurus Bass Pedal, Timpani Rolls, Timpani Hits, Uriah Choir, Voice of Necam.
