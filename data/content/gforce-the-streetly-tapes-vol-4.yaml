description: 26 authentic Mellotron tape banks from original EMI tape-stock for
  M-Tron Pro IV, with hundreds of factory patches by Jarrod Gosling, Matt Berry,
  Nick Magnus, and others.
details: |-
  Working under the tutelage of the original British Mellotron manufacturers, Streetly Electronics, we have released three volumes of tapes already, so when Martin Smith called to say, “I’ve found some really rare tapes tucked away in the archives. Do you fancy a listen?”. The answer was a fast and unanimous “Yes!”

  This add-on pack contains 26 carefully curated tape banks for M-Tron Pro. Those are derived from original EMI tape-stock from the original UK 'Tron masters. The pack also contains 100s of factory patches from Tron aficionados including Jarrod Gosling, Matt Berry, Nick Magnus, Dave Spiers, Graeme Rawson & Duncan Parsons.

  Highlights include three tape banks created from a set of curious chord inversion recordings taken from the same tape that gave us the essential Sad Strings, unused, unedited and forgotten for many years: Sad String Chord Inversions, Sad String Notes Variations and Sad String Split.

  The Streetly Tapes Vol 4 Expansion Pack is only available to registered users of M-Tron Pro. Additionally, it is exclusively available via this website as a direct download (664MB) via “My Instruments” when the purchase has been completed.
specs: |-
  - A GForce Software and Streetly Electronics collaboration
  - Tape banks from the original UK 'Tron masters
  - Derived from original EMI tape-stock
  - 100s of factory patches from Tron aficionados including Jarrod Gosling, Matt Berry, Nick Magnus, Graeme Rawson & Duncan Parsons
  - 26 carefully curated tape banks for M-Tron Pro
  - 35 notes per tape bank
  - Exclusively available via download – 664MB
  - Requires a registered copy of M-Tron Pro
