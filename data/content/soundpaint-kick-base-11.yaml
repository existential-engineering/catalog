details: |-
  Bring On The Bass

  Kick Base 11 is bursting with modern analog heft and punch. We captured every detail of our MBase11 through a variety of analog effects, drawing from our extensive arsenal of signature cinematic treatments. With their beautifully defined attack, pitch and depth, the drums of Kick Base 11 are perfect for making a huge impact in the low end of your music. Featuring kicks with extra-deep focus, these sounds are simply massive in any mix. Choose between various levels of sub-action, grit, saturation and analog heat - with many selections that are compressed, driven and in-your-face. With such a wide range of options available, Kick Base 11 is right at home in multiple genres, from hybrid cinema scoring to EDM and even old school electro. The MBase11 had a simple design dedicated to crafting big, bold kicks, but was flexible enough to synthesize higher melodic material as well. Using the powerful Soundpaint engine, even leads and pads are ripe for sonic exploration within this versatile Kick Base 11 library.
