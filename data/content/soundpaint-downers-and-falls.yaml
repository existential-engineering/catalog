details: |-
  Bring Down The House. Downers and Falls is a true labor of love and a culmination of years of meticulous sonic design, covering a wide variety of styles and sounds from Synths to Acoustic instruments, Orchestral Instruments, Acoustic Drums and even Foley. It's not unheard of for us to take an entire day to polish individual samples to absolute perfection. As a proud addition to our Hybrid Cinema series, this library is full of downers and falls (of course), intensifying boomers, doppler effects, tonal, atonal, and rhythmic sounds, as well as evocative and emotional sound effects. Weighing in with 56 Programs and 20 Parts, Downers and Falls gives you a truly diverse array of sounds to choose from, and endless potential for creating more. The wide array of samples already provides amazing sonic flexibility, and they can be further combined through the power of Soundpaint to create a myriad of expressive new textures.
