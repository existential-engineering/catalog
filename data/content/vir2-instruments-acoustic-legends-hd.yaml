details: |-
  Powered by the Kontakt player 2 engine, Acoustic Legends HD delivers 19 gigabytes of acoustic guitar, including picked notes, finger-picked notes, natural and artificial mutes, chords, harmonics, harmonic chords, release layers, and even fret noise sampled for each guitar.

  It contains several different steel string guitars, nylon strings, twelve strings, acoustic bass, as well as a bonus folder featuring mandolin, ukulele, and banjo. Acoustic legends hd features guitars from mcpherson, taylor, gibson, martin, and other manufacturers.

  Acoustic legends hd also incorporates 'chord banks' containing twelve different chord types in varying positions, with multiple velocity layers and multiple takes per layer. The chord banks include both up-strokes and down-strokes, making it simple to create fully authentic rhythm guitar parts.

  24-bit, 96khz samples, utilizing the finest in high-end microphones and pre-amps, sampled in thorough detail including release layers, fret noise, finger noise, and more. Numerous articulations and styles of playing, including finger picked, plastic picked, harmonics, harmonic chords, mutes, single notes, and chord banks.

  Multi-timbral operation, supporting up to 64 simultaneous instruments (subject to ram availability), receiving up to 64 MIDI channels (16 in plug-in mode). Kontakt player 2 engine, supporting standalone operation as well as plug-in operation in all major hosts that support audio units, VST, rtas, or dxi plug-ins.
