description: Autodafe prophet 600 is a recreation of the famous Sequential
  circuits Prophet 600 for Kontakt, based on samples from an actual prophet 600.
details: |-
  All the original factory soundbanks have been sampled from the original memory
  of the prophet 600. There are 100 original presets mapped to the original
  presets from 00 to 99, and some additional preset created in kontakt. 145
  patches in total.

  The aim is not to 100% replicate the prophet 600 but to capture its sounds,
  its controls and its characteristics adding unique features that are only
  possible in the digital world.

  Autodafe prophet 600 features an advanced arpeggiator, much more powerful than
  the one on the original prophet. Autodafe prophet 600 also features a chord
  mode, glide, mono mode and unison section.

  The interface of the original prophet 600 has also been reproduced in quite
  some detail.
specs: |-
  - Advanced arpeggiator
  - Chord mode
  - Glide
  - Mono mode
  - Unison section
  - 145 patches
  - 100 original presets
  - Kontakt compatibility
