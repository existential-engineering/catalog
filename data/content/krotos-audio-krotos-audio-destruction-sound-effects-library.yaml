description: Destruction belongs to the most versatile and multifaceted events in terms of sound design. Sound designing a proper devastation is more than just layering impact and explosion sounds. This library was built specifically for use with Reformer and Reformer Pro, covering glass smashing, explosions, detonating, and rock impacts. Rich and cinematic royalty-free sounds with organized metadata.
details: |-
  Provided by BOOM Library. Destruction belongs to the most versatile and multifaceted events in terms of sound design. Sound designing a proper devastation is more than just layering impact and explosion sounds, it is like a symphony of destruction, an organised chaos with a multiplicity of sounds.

  This library was built specifically for use with Reformer and Reformer Pro, plugins that recompose audio into dynamic, responsive, and highly-realistic sound design instantly.

  Sound categories included are glass, explosion, detonating and rock impact, with keywords covering destruction, explosion, fireworks, glass, crushing, falling, moving, throwing, detonating, smash, splinter, porcelain, breaks, hitting, destroying, crumbling, scraping, stress, impacts, rattle, heavy, creaks, rocks, rumbles and wood.

  The purchase contains two downloads: a zip file with all source sound effect asset files plus a Metadata PDF, and an installer for the integrated Reformer Pro library. The page notes that this product is the construction kit only.
