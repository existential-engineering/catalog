description: "Organic Hyperpop is a hyper real material drum toolkit: everyday
  textures and tactile foley transformed through modern sound design for
  hyperpop, electronic, experimental, and contemporary pop productions."
details: |-
  This OneShot2 expansion turns the ordinary into extraordinary by giving you hard-hitting, character-driven drums with a sharp identity and controlled chaos, ready to take place in any hyperpop, electronic, experimental or contemporary production. From punchy one shots to evolving textures (making use of OneShot2's unique Motion Engine), every sound inspires rather than blends in.

  Water, metal, paper, ice, silicone and glass were recorded up-close for maximum tactile detail, then reimagined through modern sound design to feel sharp, edgy and mix ready. Each kit keeps a strong material identity, so sounds are instantly recognisable.

  Anti-generic drums: programming focuses on variation and non-linear behaviour to avoid rigid, repetitive patterns, with Motion triggers that function as living rhythmic tapestries and textural soundscapes that evolve over time. It is physical sound, upgraded for modern production.

  The pack was created by Comakid (Francesco Cassino), who describes the approach as: "The goal wasn't to hide the source, but to stretch it and augment it into something new. I like when a sound still has a real-world texture or quality to it, but it's been pushed far enough that it starts to become its own thing."

  This expansion requires a license of OneShot2 and is only compatible with OneShot2.
specs: |-
  - 23 presets
  - 169 slots (115 one shot slots, 54 Motion slots)
  - Over 400 samples
  - Water, metal, paper, ice, silicone and glass
  - Recorded up-close for maximum tactile detail, then processed for modern production
  - Sharp, mix-ready and usable straight out of the box
  - Requires a license of OneShot2
  - macOS / Windows
