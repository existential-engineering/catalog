description: An Optigan sound disc featuring musical saw, Marxophone, skeletal
  guitar and heavy drums with a split keyboard layout.
details: |-
  From indie rock veteran Pall Jenkins (The Black Heart Procession, Three Mile Pilot) come the haunting sounds of DARKSOPHONE, featuring musical saw, Marxophone, skeletal guitar and heavy drums. Since the saw and Marxophone both have limited ranges, we've split the keyboard, placing the saw on the lower half and the Marxophone on the upper half. For those unfamiliar with the Marxophone, it's a zither-like instrument that is played with a series of keys, which bounce metal hammers onto the strings for a repeated dulcimer effect. The musical saw is played with a bow, and each note has an organic vibrato and other articulations. The sparse guitar chords lend themselves to combining chord buttons for extended harmonies. The drums feature patterns in both 6/8 and 4/4. Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility
