details: |-
  Time and Space is for the music producer who wants movement in their tracks. With otherworldly sound effects, evolving synths and textured rhythms, this pack empowers the creator to easily build rich and immersive soundscapes with playful quirks and a little teasing, if you please. It's a real shapeshifter, suited both for pumping EDM and atmospheric compositions with the need of an abstract or sometimes dark tone.

  With love for the explorative workflow (and happy accidents), the patches in Time and Space are built to be unpredictable and ever changing, and are therefore perfect for resampling, meaning you'll get unique material to record with each live tweak or mod wheel sweep, and plenty of material to reshape and mod to your creative hearts desire and craft a fresh sonic identity.

  All presets integrate seamlessly, so you can assemble full tracks, from ambient interludes to full menacing EDM arrangements, using only Tomofon's unique sound engine.

  Flirting with drum machines and their pre-programmed patterns, the Time and Space expansion includes a bunch of sequential rhythms, showcasing Tomofon's capabilities of building not just evolving pads but also gnarly and textured grooves. For example, the preset Techno Low Rhythm sits deep under your groove, providing a raw rumble and relentless pulse that haunts each beat.

  In a sound-design context you'll often reach for sounds with tasteful unpredictability that can be used to provoke emotion, and Time and Space is full of this. Take the patch Evolving Crunches for example: by sweeping the mod wheel and traversing from the lowest to the highest keys, you trigger fresh glitches and crackles every time, exactly the kind of motion that suits building textures.
