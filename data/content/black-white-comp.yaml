details: |-
  The main philosophy of the black&amp;white comp is to give you an ability to
  have a great interface and give the feeling of a physical instrument, let you
  select colors and work on a body of the instrument.

  Despite compactness and classic appearance, gui kit will satisfy your
  requirements in your VST or kontakt instrument creation.

  The main features of this ui template is a pleasant and comfortable working
  panel, faders, buttons, switchers, big screen and other additional elements
  that are completely integrated with photoshop software in psd files, for
  kontakt platform.

  Each layer is rendered as a separate file with files thoughtfully organized
  into psd.
specs: |-
  - Psd file 633x608 Kontakt version light and dark
  - Psd file 1266x1216 VST version light and dark
  - Knob animation 128 frames
  - Kontakt buttons states support
  - Commercial license
  - Faders
  - Buttons
  - Switchers
  - Big screen
  - Photoshop software integration
  - Psd files
