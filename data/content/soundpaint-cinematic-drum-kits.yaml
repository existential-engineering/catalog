details: |-
  Life In Every Hit

  Percussion drives drama, and Cinematic Drum Kits provides the pounding rhythms to pack a bigger punch in any scene. Create tension, quickly advance a plot, and keep an audience on the edge of their seats with a huge selection of drums and percussion available right at your fingertips. Discover a variety of clean modern kicks, epic bass drum hybrids, low and high frequency assortments of percussion instruments, and piercing tick tocks that slice through the mix. Even among the extensive and spacious Super Drum ensembles, every drum is an expressive instrument in itself, with comprehensive velocity and round robins, making them incredibly dynamic and naturally organic even on repeating notes. Cinematic Drum Kits even provides ready-made arpeggiator rhythms and patterns that can be tweaked to taste, used to inspire new music cues or songs, or dropped directly into your performance. From subtle nuance to sonic explosions with every hit, get Cinematic Drum Kits and start shaking the emotional foundations of cinema today.
