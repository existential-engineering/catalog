details: |-
  This 70 preset bank takes the great feature set and delivers the very best
  aiyn zahev quality. Drawing inspiration from trance, house and even filmscore
  music, altitude has gorgeous pads, deep basses, trance heaven plucks, moving
  atmospheric patches along with carefully programmed arps/sequences and dreamy
  leads.

  Standard MIDI files for reconstruction of this project are included, a special
  feature of this pack however is the included MIDI loop format, which is used
  in cubase allowing you to preview sequences from the audio demo and then drag
  and drop them straight into your cubase project, spire will automatically be
  loaded with the MIDI data and with the correct preset.

  This makes using the bank even more immediate. No audio samples are included.
specs: |-
  - 70 presets
  - Modwheel & velocity assignments
  - Cubase MIDI loops (70+)
  - Standard MIDI files (70+)
  - Spire version 1.08 or up required
