details: |-
  Mark Rankin is a Grammy-winning producer, engineer, and mixer from the UK, now based in Los Angeles. Known for his work with Adele ( 21 ), Weezer ( The Teal Album ), and Queens of the Stone Age, he has also collaborated with Florence + the Machine, Iggy Pop, and Foster the People. With multiple Grammy wins and industry honors, Rankin has become a highly sought-after figure in modern music production.

  Mark Rankin has curated a full set of mixing chains designed to cover every part of a mix. Pulled directly from his work on some of the world's biggest records, this expansion delivers mix-ready vocals with power and clarity, along with rock-solid captures for guitars and drums.

  This expansion pack has a total of 52 captures.
