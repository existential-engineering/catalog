description: A brutal collection of 350 layered kick presets and more than 1,000 punchy samples for Techno, Hard Techno, and Hardcore. Requires Rave Generator 3.
details: |-
  The Hard Techno Kick Generator is an add-on for Rave Generator 3, designed for producers of Techno, Hard Techno, and Hardcore. It features a collection of 350 layered kick presets and 1,000 raw and processed kick samples, delivering weight, punch, and character to the low end.

  Each preset is built using advanced layering techniques. By combining carefully selected samples into stacked layers, each kick delivers powerful low-end, focused midrange, and a sharp, aggressive attack, so the kicks cut through complex mixes. Whether the track is industrial techno, rave-driven hardcore, or heavy minimal techno, the add-on provides instant access to club-ready kick drums.

  The library of 1,000 kick samples was shaped and sculpted using legendary gear and modern techniques: Roland TR-909 and TR-808 for punch and warmth, the Doepfer System 100 modular synthesizer for raw analog edge and gritty textures, the Sherman Filterbank and other processors for distortion, filtering, and dynamic movement, plus custom modular patches and creative synthesis for forward-thinking timbres.

  Thanks to expert layering and sample stacking, the collection blends analog grit, modular chaos, and modern precision, suited to warehouse techno, high-speed hardcore, and industrial floor-fillers. All kicks are engineered for maximum punch and clarity.

  Rave Generator 3 is required to use this add-on.
specs: |-
  - 350 expertly layered kick presets for Rave Generator 3
  - 1,000 kick samples from legendary drum machines and modular synths
  - Built-in layering and stacking for customizable sound design
  - Sample sources include Roland TR-909, Roland TR-808, Doepfer System 100 modular synthesizer, Sherman Filterbank and custom modular patches
  - Tailored for Techno, Hard Techno, Hardcore and Industrial
  - Seamless integration with Rave Generator 3
  - Requires Rave Generator 3
