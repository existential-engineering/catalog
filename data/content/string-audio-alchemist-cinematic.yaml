details: |-
  Alchemist is a powerful Kontakt engine to create deep and complex cinematic sounds. The first two Kontakt libraries to be released are alchemist cinematic textures and alchemist cinematic impacts. Each instrument is composed of six layers. The libraries feature several GB of sample material, giving you a lot of combinations and sound colors.

  Alchemist engine is divided into four sections: main, color, motion and effects.

  Main engine: individual layer controls for pitch, volume, pan, solo, mute, effects bypass, layer lock, envelope, layer boost and cut, pan and amp lfo send.

  Motion engine: arpeggiator, pan and amp lfo. Color engine: 65 convolution impulse responses, randomize function. Effect engine: skreamer, lo-fi, chorus, tape saturation, delay, chorus and distortion (controlled by the modulation wheel). Powerful randomize function.

  Requires full retail version (sold separately) of kontakt 5.5.1. This library is not supported by the free kontakt player.
specs: |-
  - Kontakt engine
  - Six layers per instrument
  - 18+GB of original sample material (alchemist cinematic textures)
  - 1.6gb of original sample material (alchemist cinematic impacts)
  - 3000+ high-quality samples (cinematic textures)
  - 300+ high-quality samples (cinematic impacts)
  - 250 pre-programmed snapshots (cinematic textures)
  - 151 pre-programmed snapshots (cinematic impacts)
  - Main engine with individual layer controls
  - Pitch control
  - Volume control
  - Pan control
  - Solo and mute functions
  - Effects bypass
  - Layer lock
  - Envelope control
  - Layer boost and cut
  - Pan and amp LFO send
  - Motion engine
  - Arpeggiator
  - Pan and amp LFO
  - Color engine
  - 65 convolution impulse responses
  - Randomize function
  - Effect engine
  - Skreamer
  - Lo-fi
  - Chorus
  - Tape saturation
  - Delay
  - Distortion
  - Modulation wheel control
  - Requires full retail version of Kontakt 5.5.1
  - Not supported by free Kontakt player
