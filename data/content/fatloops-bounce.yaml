details: |-
  Bounce! By FatLoops is a soundware product containing dope loops bounce
  (bangin' urban construction kits) with 5 bangin' club hip hop construction
  kits composed from 80 loops in tempos ranging from 79 to 120 bpm.

  All loops are tempo & key labeled, and prepared in 5 file formats which gives
  you compatibility with 99% modern hardware & software samplers & sequencers.

  Loops included in dope loops bounce are completely royalty-free and ready to
  use in your commercial compositions.

  The 80 loops include drums (separated & mixed for ease of use), synths, bass,
  pads, strings, keys, pianos and more with tempos & key signatures provided for
  all loops and kits.

  5 formats available: 16-bit wav (acidized), 24-bit wav (acidized), 24-bit aiff
  (apple loops), rx2 (rex) & propellerhead's reason 4.0 / record 1.0 refill,
  totaling over 500 multi-format loops and over 1.2 gb in size.
