description: Departure Drums is a Kontakt instrument of a complete drum kit
  recorded in a professional studio, with many velocity layers per shell and
  cymbal. It ships as Kontakt NKI files and 24-bit/44.1kHz WAVs, and includes
  both a multitrack and a pre-mixed snare.
details: |-
  Departure Drums includes a Kontakt instrument of a complete drumkit recorded in a professional studio environment. The drum sounds are slightly processed but still untouched enough for you to make them fit your mixes easily.

  Each shell and cymbal is recorded with many velocity layers to be able to program realistic sounding drum tracks.

  There are two versions of the snare. The multitrack snare gives you the ability to level and process the top, bottom, overhead and room mics separately. The mixed snare is a ready to go version with all these tracks already mixed together.

  Recorded, edited and processed by Christoph Wieczorek.
