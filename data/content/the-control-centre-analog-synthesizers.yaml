details: |-
  Analog Synthesizers is a unique collection of instrument racks for Ableton live featuring bass, lead, keys and FX sounds created using four "classic" Analog Synthesizers from doepfer, Moog and teisco.

  This 392mb pack includes 26 multi-sampled instrument racks (containing 269 24-bit wav files), each featuring a macro for easy control over the lfo and env settings (requires live 9.7 or higher).

  Instruments: moog opus 3, moog sub 37, doepfer dark energy, teisco 60f.
specs: |-
  - 26 multi-sampled instrument racks
  - 269 24-bit wav files
  - LFO macro control
  - Env macro control
  - Ableton live 9.7 or higher required
  - 392mb pack size
  - Bass sounds
  - Lead sounds
  - Keys sounds
  - FX sounds
