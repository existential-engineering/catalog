description: "Big Bang Orchestra: Musca low strings: two string ensembles,
  recorded at synchron stage Vienna. 6 cellos and 4 basses playing in octaves."
details: |-
  The city of Vienna has always been famous for its exquisite string players and
  their fine instruments. On our own scoring stage, the low string sections of
  the synchron stage orchestra form a marvelous symbiosis with the large hall
  "stage a" to create a beautiful string sound that provides a well-rounded low
  end for the entire big bang orchestra. Recording six cellos and four basses
  playing together in octaves creates a homogenous, well-balanced sound, as the
  musicians adjust their intonation, tone color, phrasing and vibrato instantly
  and instinctively with each other.

  The library comes with exactly the same articulations as bbo: lyra, offering
  variations of short notes, long notes with two vibrato intensities, legatos,
  espressivo, sfz, sffz, crescendos and diminuendos, tremolos, fast repetitions,
  half tone and whole tone trills, half tone and whole tone slides up and down
  (glissandos), and pizzicatos. As with all libraries powered by the synchron
  player, the tempo of all articulations, e.g., repetitions and glissandos, can
  be easily adjusted using the integrated time stretch feature.

  Special patches let you combine the low strings of lyra with the high strings
  of musca, either by layering the two ensembles over the entire keyboard or by
  using a split point at c3. The string performances of bbo: musca are
  completely new recordings that blend perfectly well with the tutti recordings
  of the big bang orchestra.

  The included mixer presets deliver a perfect sound out-of-the-box that
  integrates seamlessly with all the other modules of the series. Room mixes
  feature an excellent blend of overhead decca tree mics and surround mics mixed
  to a stereo signal that's light on cpu and ram. Other mixer presets offer a
  combination of mic signals that you can adjust to your needs and liking,
  masterfully crafted by synchron stage vienna's chief recording engineer, bernd
  mazagg.

  These include "stereo decca tree" and "surround to stereo" that feed the
  surround mics to the stereo signal for a richer and wider sound. Also included
  are "surround" presets for 3d audio setups, as well as a "processed" category
  with presets such as "compressed", "sparkling", "wall of strings", "howling
  strings", and many more.
