details: |-
  'Spire Essentials Vol 1: Future House & EDM Charts' from baltic audio is a preset pack for producers looking to get the sound for the current House & EDM Charts. You'll find 64 top-quality presets for the amazing Spire synthesizer to create hit tracks, including hand-crafted basses, leads, arps, pads, synths and much more.

  Each preset is perfectly programmed by a professional sounddesigner and every parameter tweaked with passion and detail and will be your essential source for creating new and commercial sounds within your compositions.

  You can also use it for genres like Pop, Trap, Hip Hop and RnB.

  In addition, you'll find 50 MIDI files of the sounddemo included.

  Please note: The drums and FX used in the demo are not included in this product! They can be found in other baltic audio releases.
specs: |-
  - 64 Presets for Spire synthesizer
  - Programmed by a sounddesigner
  - Perfectly tweaked
  - Overall loudness for the most presets
  - 20 LD
  - 15 BA
  - 10 SY
  - 4 PD
  - 4 FX
  - 3 PL
  - 3 DR
  - 3 ARP
  - 2 GT
  - Every preset with modWheel assignment
  - Requires Reveal Sound Spire v1.0.20 or higher
  - 50 MIDI files
  - Multi-Genres
  - PC/Mac Compatible
  - 100% Royalty-Free
