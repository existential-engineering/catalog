details: |-
  Following on from the original aurora soundbank, aurora pt. 2 features over
  100 brand new textural presets that explore the depths of cinematic
  atmosphere.

  With a collection of 74 samples created using hardware synths, guitars and
  effects pedals, aurora pt. 2 uses pigments gorgeous granular engine to create
  luscious, ambient soundscapes.

  Brimming with long, evolving textures full of light movement, this soundbank
  oozes gorgeous cinematic ambience.

  If you're looking for some soft, textural atmosphere for your tracks and cues,
  then look no further.
