details: |-
  We join forces with BAFTA-winning Icelandic composer Ólafur Arnalds (Broadchurch, Kiasmos, Erased Tapes) to record an all-star ensemble performing his latest set of awe-inspiring evolutions. The 4,3,3,3,3 ensemble of British players (Violin I + II, Viola, Cello, Double Bass), led by long-term collaborator Viktor Orri Árnason, perform a range of fragile yet warm beautifully evolving phrases, recorded at the world famous Hall at AIR Studios, London.

  Using our Evo Grid technology, this library makes it easy to create sophisticated chamber strings music from the most simplistic of arrangements - just a few sustained notes is all you need to write inspiring dynamic textures. We also introduce Waves: a brand new innovation featuring notes that move along a wave-like dynamic arc, appearing from nothing, swelling, and then dying away again to nothing. These are accessible via our classic interface, in various styles and lengths.
