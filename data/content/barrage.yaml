details: |-
  Barrage is a cinematic percussion designer formatted for Kontakt 5.5.1 or
  later (full version required, not player), containing 2.3 GB (compressed from
  6gb) of hard hitting ensemble, solo, and sound designed epic percussion
  sounds.

  The unique ensemble designer layout allows creative stacking of sounds to
  create huge impacts.

  Barrage contains several individual elements including drums, anvils, various
  sticks/mallets/brushes, as well as a wealth of expertly sound designed
  hits/swooshes/mangled/sub hits and other incredibly useful elements.
