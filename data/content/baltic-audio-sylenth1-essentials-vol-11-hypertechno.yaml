details: |-
  'Sylenth1 Essentials Vol. 11 - Hypertechno' is a preset pack for LennarDigital Sylenth1 designed for modern Hypertechno, Dance, Hands Up, Slap House, Techno and high-energy EDM productions.

  The pack includes 64 royalty-free Sylenth1 presets and 42 MIDI files taken from the demo, covering ready-to-use leads, basses, plucks, pads, arps, keys and FX presets for energetic melodies, driving basslines, catchy hooks and commercial dance productions.

  Requirements: LennarDigital Sylenth1 version 3.06 or higher is required.

  Please note: the drums and some FX used in the demo are not included.
specs: |-
  - 64 Presets for Sylenth1
  - 22 Leads (Presets)
  - 16 Basses (Presets)
  - 12 Plucks (Presets)
  - 5 Pads (Presets)
  - 5 Arps (Presets)
  - 2 Keys (Presets)
  - 2 FX (Presets)
  - 42 MIDI files
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
  - Requires LennarDigital Sylenth1 v3.06 or higher
