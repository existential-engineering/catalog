details: |-
  Redefine your guitar tone and conquer the mix with Conquer All Volume V Impulse Responses. Expand your tonal palette and add some unique character with these heavy hitters, right at your fingertips.

  Conquer All Volume V features over 150 WAV file Impulse Responses created using some of the most legendary speaker, cabinet, mic, preamp, and poweramp combinations.

  From Marshall's famous gutsy midrange punch to the defined note projection of Bogner, Conquer All Volume V gives you a range of easy-to-use tonal options. These impulse responses are great for live use with your favorite modeler or profiler, loading into an attenuator or load box for silent recording of your favorite tube amp, getting a fresh sound from your favorite amp sim, reamping existing tones, and mixing your guitars with the right tonal balance.
