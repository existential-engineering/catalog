description: Unleash the sonic beast within, step into the bass arena and arm yourself with “Attack of the Wubs” by The Lions Den, a weapon of earth-shattering basses, SFX, synths, leads, pads and more presets for dominating the low end.
details: |-
  “Attack of the Wubs” is a Serum preset library built around earth-shattering bass, aimed at producers who want a ready-made arsenal for dominating the low end. It collects basses, SFX, synths, leads, pads and more into a single pack.

  The library covers groundbreaking bass sounds with jaw-dropping ‘wubs’, growls and sub-bass frequencies. It does not stop at bass, though: from dubstep and future bass to drum and bass, the pack offers a range of presets that integrate into any electronic production, including plucks, atmospheres, chords and arps. Whether the track is a festival anthem or something darker and more brooding, the sounds are built to shake its foundations.

  Each preset has been fine-tuned so it loads into Serum and delivers a finished idea with minimal effort. Every patch remains easy to tweak and customise to suit a producer's own style and creative direction.

  The pack contains 149 presets for Serum, broken down as 61 basses, 20 SFX, 16 synths, 11 leads, 11 pads, 8 arps, 8 chords, 6 atmospheres, 4 plucks and 4 subs.
