  set of percussive voices where every beat has something to say.
details: |-
  Storytelling Percussion captures the warm resonance and tactile nuance of hand-played percussion, designed for composers and producers seeking cinematic, textural motion. It's a quiet invitation to explore nuance – rhythm that sighs, sounds that speak in textures as much as tone.

  Alongside a curated collection of instruments and percussive textures, this pack invites you into a sonic world that's both grounded and expressive. Each sound is recorded with care to preserve its natural imperfections – wood, skin, air, and grain – making them ideal for scoring, layering, or sparking new rhythmic ideas.

  The pack is designed by Tyler Sabbag, a California-born composer and percussionist based in Joshua Tree, known for his Emmy-winning score for Live to 100 and his Emmy-nominated work on Chef's Table and Lost LA.

  "Storytelling Percussion is an intimate toolkit built from my own musical color palette, a pretty little piece of my studio to be shared with everyone." – Tyler Sabbag (Emmy Award-winning composer and percussionist)
specs: |-
  - Requires a OneShot license
  - 30 presets
  - 132 slots (each with approx 30-40 velocity layers plus round robins)
  - 3 deep, melodic congas
  - Carved, woody strikes of 2 resonant, pitched Ekwe (Nigerian log drums)
  - 2 sets of clay-bodied Tbilat (twin Moroccan bongo-like drums)
  - Sharp, tonal temple blocks
  - The rumble and presence of the South American bombo leguero
  - Big collection of textures
  - macOS, Windows and iOS
