details: |-
  Cyber Metal Volume II is a comprehensive cybernetic toolkit for producers, mixers, and musicians looking to add a sci-fi, glitchy, and mechanical twist to their music.

  Designed for use in any DAW and completely royalty-free, Cyber Metal Vol. II integrates seamlessly into rock, metal, electronic, and forward-thinking productions. Pay once, own forever.

  The pack includes 128 samples in 48kHz, 24-bit WAV format across a wide range of categories: hats (with round robin), kicks, snare/claps, ticks and tacks, buzzing sounds, ambient drones, beeps, air blasts, tonal blasts, glitch oneshots, sub drops, suckbacks, and texture sounds. Also includes 30 Serum presets for custom sound design.

  Instant digital download. Lifetime free updates and unlimited customer support included.
