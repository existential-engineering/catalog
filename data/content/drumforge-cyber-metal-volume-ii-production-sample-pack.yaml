description: A cybernetic toolkit for adding sci-fi, glitchy, and mechanical elements to rock, metal, and electronic productions. 128 royalty-free samples in 48 kHz, 24-bit WAV format usable in any DAW, plus 30 presets that require Serum.
details: |-
  Cyber Metal Volume II is a comprehensive cybernetic toolkit for producers, mixers, and musicians who want a sci-fi, glitchy, and mechanical twist in their music. It suits rock, metal, and electronic productions looking for futuristic and chaotic sounds, and it leans on aggressive, algorithmically processed elements for digital sound design.

  As with the rest of the Drumforge Production Packs, the collection is aimed at composers, songwriters, producers, and mixers working on games, film sound design, or songs that need unusual elements.

  Producer and composer Geoffrey Day assembled the mix-ready samples and presets, covering atmospheric effects, sub-drops, and glitch patterns for lifting the energy of a riff.

  The pack is designed for use in any DAW and is completely royalty free, with no subscription: it is bought once and owned permanently.
specs: |-
  - 128 royalty-free samples in 48 kHz, 24-bit WAV format
  - 24 hats including round robin
  - 12 kicks
  - 9 snare/claps
  - 9 ticks and tacks
  - 3 extra buzzing sounds
  - 10 ambient drones
  - 9 beeps
  - 5 air blasts
  - 5 tonal blasts
  - 18 glitch one-shots
  - 6 sub drops
  - 5 suckbacks
  - 13 texture sounds
  - 30 Serum presets for custom sound design
  - For use in any DAW
  - Royalty free
