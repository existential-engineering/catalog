details: |-
  Aeterna Gold is a collection of 200 tense, dystopian, heroic and dynamic
  sounds for u-he Diva. A blend of severely damaged and unstable synths but also
  smooth and silky, yet sinister and menacing sounds specially designed for the
  widescreen composer.

  Aeterna is formed by analog rushing bassloops, suspenseful percussion loops,
  menacing synth loops, deep mechanical atmospheres, dreamy sequences and arps,
  bizarre mallets and keys, lush leads and pads and thrilling science fiction
  effects.

  All presets respond to velocity and modwheel and are nks tagged, for use with
  komplete kontrol and maschine.

  A huge collection of suspenseful, scary and emotive analog synth sounds which
  are a delight for speed up your workflow, give you new ideas and fill
  inspiration gaps.
specs: |-
  - 200 presets
  - U-he Diva compatible
  - Velocity responsive
  - Modwheel responsive
  - NKS tagged
  - Komplete kontrol compatible
  - Maschine compatible
  - macOS compatible
  - Windows compatible
