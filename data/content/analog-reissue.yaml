details: |-
  'Analog Reissue' contains 100 presets for xils-lab syn'x 2.5. This soundset
  recreates some of the classic sounds from the elka synthex and also brings
  some exciting new sounds that weren't possible with the original hardware.

  'analog reissue' features cascading arpeggiators, analogue strings, dreamy
  synth sounds, punchy analog basses, berlin style sequences, hard + soft sync
  sounds, vintage brass pads and much more.

  Available as part of the 'vintage & rare' soundset. Discount available for
  customers who purchased the 'x' soundset for syn'x v1 or 'vintage & rare'
  bundle.
specs: |-
  - 100 presets
  - Xils-lab syn'x 2.5 compatible
  - Cascading arpeggiators
  - Analogue strings
  - Dreamy synth sounds
  - Punchy analog basses
  - Berlin style sequences
  - Hard + soft sync sounds
  - Vintage brass pads
