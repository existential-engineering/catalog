details: >-
  Arcturus for repro-5 is conceived to enlighten your creativity and awake your
  true potential. This soundset is like having the real analog prophet-5 with
  all the rich tones, swells and with the extra flexibility of the software.


  Arcturus is heavily influenced by the works of boards of canada, trent reznor,
  atticus ross and solar fields. Formed by dirty and lush leads and pads,
  stranger and original keys, large and dark soundscapes, powerful analog basses
  and bassloops, faulty and unstable synths going slightly out of tune and
  captivating science fiction effects.


  All of this makes of arcturus the state of the art soundset for making
  filmscore, synthwave and berlin school kind of music.


  All the 128 patches are "ready to go" and are responsive to modwheel and
  velocity.


  Arcturus soundset contains: PDF with a detailed installation guide, 128
  presets, normalized volumes, velocity sensitivity, and control by modwheel.
specs: |-
