description: DUBBYZATOR is a 128-preset Dub expansion for Rave Generator 3 with
  deep basses, leads, skanks, stabs and heavy Dub FX. Get the sound-system vibe!
details: |-
  DUBBYZATOR takes Rave Generator 3 deep into the world of Dub with heavy presets designed for deep basses, hypnotic leads, classic skanks, massive stabs and twisted Dub FX. Inspired by the raw energy of Dub, UK Dub, Dubstep, sound-system culture and underground electronic music, it turns Rave Generator 3 into a machine for deep grooves, heavy low-end pressure and psychedelic Dub sounds.

  The pack is split across five preset banks. Bass covers deep subs, resonant basslines, distorted basses and rolling Dub-inspired tones. Lead runs from hypnotic melodies to strange psychedelic tones for breakdowns, hooks and trippy Dub sequences. Skank focuses on rhythmic chords, offbeat patterns and spacious sounds that sit inside a Dub groove.

  Stab supplies short, punchy and characterful sounds for classic Dub accents, rave-inspired patterns, rhythmic fills and experimental sound design. FX gathers twisted noises, psychedelic textures and strange electronic effects for transitions, drops, breakdowns and sound-system madness.

  The presets are aimed at producers who want to push Rave Generator 3 beyond traditional rave sounds, and suit Dub, UK Dub, Dubstep, Sound System music, Jungle, Breakbeat, Rave, Acid, Techno, and experimental or psychedelic electronic music. Expect sub-heavy basses, spacious leads, rhythmic skanks, dirty stabs, dubby textures and psychedelic effects designed to work straight out of the box.

  DUBBYZATOR is an expansion created specifically for Rave Generator 3: load the presets, start sequencing and get straight into the sound, with no complicated setup. Rave Generator 3 is required, and the pack does not include the Rave Generator 3 instrument itself.
specs: |-
  - Preset expansion for Rave Generator 3
  - 33 Bass presets
  - 21 Lead presets
