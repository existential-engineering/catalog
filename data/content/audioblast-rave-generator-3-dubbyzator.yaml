description: DUBBYZATOR is a 134-preset Dub expansion for Rave Generator 3 with
  deep basses, leads, skanks, stabs and heavy Dub FX. Get the sound-system vibe!
details: |-
  Take Rave Generator 3 deep into the world of Dub with DUBBYZATOR, a preset expansion designed for deep basses, hypnotic leads, classic skanks, massive stabs and twisted Dub FX. Inspired by the raw energy of Dub, UK Dub, Dubstep, sound-system culture and underground electronic music, it turns Rave Generator 3 into a machine for deep grooves, heavy low-end pressure and psychedelic Dub sounds.

  The pack is split into five sound groups. Bass covers deep subs, resonant basslines, distorted basses and rolling Dub-inspired tones. Lead runs from hypnotic melodies to strange psychedelic tones for breakdowns, hooks and trippy Dub sequences. Skank focuses on rhythmic chords, offbeat patterns and spacious sounds that sit inside a Dub groove.

  Stab presets are short, punchy and characterful, intended for classic Dub accents, rave-inspired patterns, rhythmic fills and experimental sound design. The FX section adds twisted noises, psychedelic textures and strange electronic effects for transitions, drops, breakdowns and sound-system madness.

  DUBBYZATOR is built for producers who want to push Rave Generator 3 beyond traditional rave sounds. Expect sub-heavy basses, spacious leads, rhythmic skanks, dirty stabs, dubby textures and psychedelic effects designed to work straight out of the box, whether the track is Dub, UK Dub, Dubstep, Breakbeat, Rave, Jungle, Acid, Techno or experimental electronic music.

  It is a preset expansion only. Rave Generator 3 is required to use it and the instrument itself is not included.
specs: |-
  - 33 Bass presets: deep, heavy and resonant Dub bass sounds
  - 21 Lead presets: atmospheric, melodic and psychedelic Dub leads
  - 27 Skank presets: rhythmic chords and classic offbeat Dub flavours
  - 24 Stab presets: punchy, dark and spacious Dub stabs
  - 23 FX presets: weird, twisted and experimental Dub effects
  - Designed for Dub, UK Dub, Dubstep, sound-system music, Jungle, Breakbeat, Rave, Acid, Techno and experimental electronic music
