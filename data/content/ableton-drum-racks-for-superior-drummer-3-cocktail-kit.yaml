details: |-
  Ableton Drum Racks for Superior Drummer 3 Cocktail kit features separate
  Ableton drum racks for all factory presets for the toontrack superior drummer
  3 and cocktail kit library supplied with toontrack ezdrummer. These racks
  provide out of the box integration workflow between Ableton live and toontrack
  superior drummer using the toontrack libraries including a host of features
  ready to use for composition and performance using Ableton push or similar
  controllers.

  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all cocktail kit factory presets from ableton push
  controller device browser.

  10 ableton drum racks to instantly load the factory library "mix ready"
  presets with ableton mappings. 5 ableton live templates designed to host the
  multi channel output routing presets with track level audio routing from
  superior drummer 3 into ableton live.

  Colour coded pad design for visual performance and finger drumming. All racks
  use consistent drum rack colouring so you can visually and immediately spot
  your rides from your hi hat articulations. Vast array of instrument
  articulations ready to go in one massive layout using ableton push 64 pad
  layout mode.

  Ableton macros mapped to toontrack superior drummer macros with preset values
  for ease of use in push and simple to use automation programming. Use the
  template racks and extend to your own toontrack superior drummer 3 cocktail
  kit presets, swapping out individual sounds or articulations.
specs: |-
  - Ableton drum racks
  - Toontrack superior drummer 3 integration
  - Cocktail kit library support
  - Ableton push controller compatibility
  - 10 Ableton drum racks
  - 5 Ableton live templates
  - Multi-channel audio routing
  - Single audio output presets
  - Multiple audio channel output presets
  - Colour coded pad design
  - 64 pad layout mode
  - Individually labelled drum rack pads
  - Ableton macros mapped to toontrack superior drummer macros
  - Audio routing and mixing
  - Track level audio mixing control
  - Ableton 10 drum buss compatibility
  - Factory presets ready to use
  - Custom preset creation capability
