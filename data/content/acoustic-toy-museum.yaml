details: |-
  For the first time, hundreds of musical toys were used to create a magical and unique sound library that will add innocence and freshness into your productions. Whatever the kind of music you produce, you will certainly find a place for these incredible sounding toys instruments.

  Deeply multi-sampled in 24-bits / 96 khz and meticulously recorded in the very best conditions using world-class microphones and class-a equipment, each instrument sounds authentic and soulful. Several passionate owners of musical toy collections gave us access to very rare and sometimes very old musical toys.

  The result is acoustic toy museum, a flashy selection of inspiring instruments ready to play with: toy pianos, musical boxes, ancient automates, wood and metal xylophones, mini bells, baby drums, toy guitars, ukulele, melodicas, small accordions, harmonicas, children percussions, funny horns, musical gadgets, musical cubes, plastic tubes and much more.

  Loops and phrases are also included for instruments like old music boxes ; and let's not forget the baby drums and toy guitar sections that were played by skilful musicians in top-grade studios.

  Uvi workstation is a multi-timbral software instrument that provides unlimited parts, integrated effects, live performance feature, and a smooth real-time workflow. It operates as a mac | pc stand alone application, as well as a virtual instrument software plug-in, compatible with mac os x and windows for all major hosts sequencers.
