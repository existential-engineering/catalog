description: Ableton Drum Racks for ezDrummer Metal Machine EZX features
  separate Ableton drum racks for all factory presets for the toontrack
  ezdrummer
details: |-
  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all metal machine kit factory presets from ableton
  push controller device browser. 28 ableton drum racks to instantly load the
  factory library "mix ready" presets with ableton mappings. 14 ableton live
  templates designed to host the multi channel output routing presets with track
  level audio routing.

  Color coded pad design for visual performance and finger drumming. All our
  racks use consistent drum rack coloring so you can visually and immediately
  spot your snares from your crashes. Know your metal machine ezx toms from your
  snare articulations. All instrument articulations ready to go in one layout
  using ableton push 64 pad layout mode. Individually labelled drum rack pads
  for clear visualisation, post performance editing and automation to all drum
  rack / instrument articulations in ableton.

  Ableton macros mapped to toontrack ezdrummer macros with preset values for
  ease of use in push and simple to use automation programming. Ableton macros
  are color coded to match the ezdrummer display. Singleout presets featuring 14
  ableton drum racks for all factory presets single audio output to single
  ableton track. Multiout presets featuring 14 ableton drum racks for all
  presets in multiple audio channel output from the plug in to multiple ableton
  audio tracks using the multi output ableton template also provided designed
  for the kit presets.

  Use the template racks and extend to your own toontrack ezdrummer metal
  machine ezx presets, swapping out individual sounds or articulations. You are
  100% ready to go with the factory presets but there is no limitation to
  creating your own presets from these templates. Simply save a new drum rack
  based upon the modified timbresandtones template.
specs: |-
  - 28 Ableton drum racks
  - 14 Ableton live templates
  - Ableton push 64 pad layout mode
  - Color coded pad design
  - Individually labelled drum rack pads
  - Ableton macros mapped to toontrack ezdrummer macros
  - Singleout presets with single audio output
  - Multiout presets with multiple audio channel output
  - Track level audio routing
  - Track level audio mixing control
  - Ableton live 9.5 or above
  - Toontrack ezdrummer2 required
  - Metal machine ezx expansion required
