details: >-
  The 1970s slingerland classic rock kit - bfd pack as mixed by alan moulder is
  a bfd xpansion pack that is compatible with bfd eco, bfd2 and bfd3. If you own
  any of these versions of bfd and want a versatile classic 70s kit as mixed by
  one of todays leading alternative rock mix engineers then look no further.


  The kit consists of a 24" kick drum, five toms - 12", 13", 14"and 15" rack
  toms a huge 18" floor tom and a signature 14" x 7" deep radio king snare. The
  cymbals used were 14" zildjian new beat hi-hats, a zildjian k custom 22" ride,
  a zildjian k dark thin 18" crash and a zildjian vintage cie 16" crash.


  The recording took place in miloco's the pool studios in london with engineer
  ben thackeray. At the centre of the control room can be found a rare vintage
  emt console. The outboard racks are full of great gear with highlights
  including neve 1079's and 1272's, API mic pre's and telefunken v76's.
  Compressors include urei 1176's, altec, neve 2254's and tweed. Mics used
  include neumann u87's, coles 4038's, aea r88 mkii ribbon mics, neumann gefell
  cmv 563's, earthworks sr30's, a lomo 19a19 and akg mics.


  Alan moulder mixed the kit in his studio assault & battery 1 in london. Based
  in the famous battery complex in north london this is a mix room centered
  around a pristine 72 channel ssl g+ sl4000 once owned by trent reznor. Add to
  this the huge collection of outboard an hd3 protools rig fully loaded with
  plug-ins and you have an extremely impressive mix room.


  The slingerland bfd pack has been designed as a licensed expansion pack for
  bfd eco, bfd2 or bfd3. The pack includes up to eighty velocities of each
  articulation totalling 6695 samples. The pack also contains a number of 70s
  rock groove MIDI loops.
