name: APEX-1 Diva Presets
manufacturer: cfa-sound
primaryCategory: preset-pack
website: https://www.cfa-sound.com/products/apex-1-diva-presets/
description: Dive into the hypnotic world of melodic house and techno with the
  brandnew apex-1 diva presets collection by cfa-sound.
details: >-
  Dive into the hypnotic world of melodic house and techno with the brandnew
  apex-1 diva presets collection by cfa-sound. Many months of intense sound
  design were used, to create these 105 high quality sounds. Taking fully
  advantage of u-he diva's superb sound quality and features, this soundset
  delivers a well rounded package.


  Perfectly suitable for deep house, melodic house and melodic techno. Expect to
  find evolving atmopshere sounds. Pulsating and creamy pads, coupled with
  inspiring sequences and fx sounds. And of course, deep heavy and warm bass
  sounds. From percussive up to long and moving bass lands, which are of course
  essential for genres like melodic house and techno.


  Followed by a high variety of lead and synth sounds. Ranging from dirty, dark
  up to bright and soft. Furthermore you will also find musical key sounds, like
  bells, guitar and organs. And yes, once again many warm deep and analog bass
  sounds.


  Besides the creative sound design, all presets coming with full modwheel
  allocation. Which allows interesting changes of facettes on every single
  preset. Moreover, all presets making use of the new preset browser of diva.
  With which and it's automatic tagging, you can the right preset for your need
  even faster.


  In detail you will find: 6 atmospheres, 29 basses, 3 fx sounds, 7 keys, 10
  leads, 16 pads, 13 plucks, 9 sequences and 12 synths 105 diva presets in
  total.
specs: |-
  - 105 diva presets
  - Modwheel allocation on all presets
  - Full modwheel allocation
  - Preset browser with automatic tagging
  - 6 atmospheres
  - 29 basses
  - 3 fx sounds
  - 7 keys
  - 10 leads
  - 16 pads
  - 13 plucks
  - 9 sequences
  - 12 synths
  - Requires u-he diva synthesizer v1.4.3 (rev 7422) or later
