description: Bird of flight, a collection of 170 presets for uvi falcon that
  explore a broad range of the sonic capacities offered by this new synth.
details: |-
  Features include deeply complex atmospheres, use of unique impulse responses
  not included with falcon, pads both old school and new, classic hardware
  emulations, and fx design.

  Controllers and macros are included on every preset, with unique and exotic
  instruments alongside unusual hybrid instruments.

  The collection includes lots of arps, tempo synced effects and patches, lots
  of wavetable presets, and analog and digital hybrids.
