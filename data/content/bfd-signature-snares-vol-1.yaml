description: BFD Signature Snares Vol.1 expands your bfd3, bfd eco or bfd2
  installation with a collection of Yamaha artist signature snares.
details: |-
  The snares are captured in similar conditions to the bfd jazz & funk and bfd
  percussion expansions as well as those used for the mapleworks kits in bfd3.
  Their tight, precise and dynamic sound work extremely well in a huge variety
  of settings - multiple beater versions are also provided for extra
  versatility.

  When used in bfd3 and bfd2, the snares offer an additional 'rim click'
  articulation as well as a 'half-edge' for use with electronic drum positional
  sensing.
specs: |-
  - Yamaha artist signature snares
  - Multiple channels
  - Multiple articulations
  - Rim click articulation (bfd3 and bfd2)
  - Half-edge articulation (bfd2 and bfd3)
  - Electronic drum positional sensing
  - Multiple beater versions
