details: |-
  New in v1.1 multiple audio channel output presets and free ableton live multi
  out routing template specifically designed for the pop/rock ezx audio routing.

  Amazing workflow in live and on your push to the full capabilities of the kit
  library saving setup time and allowing you to focus on music creation. Ease of
  navigation to load all pop/rock ezx factory presets from ableton push
  controller device browser.

  Mapped ableton macros to ezdrummer macros with preset values for ease of use
  in push and simple to use automation programming. Audio routing options.
  Singleout presets featuring 13 ableton drum racks for all factory presets
  single audio output to single ableton track. Multiout presets featuring 13
  ableton drum racks for all presets in multiple audio channel output from the
  plug in to multiple ableton audio tracks using the multi output ableton
  template also provided.

  Use the template racks and extend to your own ezdrummer pop/rock ezx presets,
  swapping out individual sounds or articulations. You are 100% ready to go with
  the factory presets but there is no limitation to creating your own presets
  from these templates.
specs: |-
  - 26 Ableton drum racks
  - Color coded pad design
  - Individually labelled drum rack pads
  - Mapped Ableton macros to ezdrummer macros
  - Singleout presets with 13 Ableton drum racks
  - Multiout presets with 13 Ableton drum racks
  - Multiple audio channel output
  - Ableton push 2 color pads mode support
  - Ableton 9.5 or above required
