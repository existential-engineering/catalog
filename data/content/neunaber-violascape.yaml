description: A sound disc for the Optigan/Panoptigon featuring viola samples,
  suited to creating rhythmic chordal textures with pizzicato chords, bowed
  keyboard notes, and bowed 5th SFX tabs.
details: |-
  VIOLASCAPE is the latest in our "scape" series of discs, particularly suited to creating rhythmic chordal textures. Our friend Batya MacAdam-Somer (https://www.batyamacadamsomer.com/) is featured on viola. The time signature of this disc is 11/16, which means that if you play chord changes timed in a more familiar meter like 4/4 or 3/4, the rhythms of the music repeat over a longer cycle, creating more complexity. The chord buttons are simple pizzicato patterns that can be combined to create more complex interlocking rhythms and extended harmonies. The keyboard features bowed notes in a rhythmic pattern, offset with each other to create complex composite patterns when you hold down chords. The SFX tabs are similarly bowed patterns on 5ths. Chords:
  Pizzicato Viola

  Keys:
  Bowed Viola

  SFX:
  1 - Bowed Viola Bb 5th
  2 - Bowed Viola Eb 5th
  3 - Bowed Viola Ab 5th
  4 - Bowed Viola Db 5th
  5 - Bowed Viola Gb 5th

  Viola by Batya MacAdam-Somer
  Arranged, edited and mastered by Pea Hicks
  Disc design and mastering by Robert Becker
  Jacket label art direction and layout by Michael Buchmiller

  Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility: Optigan and Panoptigon disc players
