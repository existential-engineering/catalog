details: |-
  Augment began with the idea that it would be interesting to use sequencers to
  manipulate additive partials in a rhythmic way, but it soon became apparent
  that it would be a much more interesting instrument using other waveforms as a
  huge 11 layer synthesizer. As a result augment retains the additive mode but
  also uses 200 waveforms which can be freely selected for each layer.

  The waveforms are along the lines of pcm synths of the past which have an
  attack section and a looped constant tone which works well as it allows the
  sounds to be more focused on synthesis rather than sampling. The attack
  section can be disabled per layer so they become pure tones.

  As far as the sequencing side of augment goes, the intention was to have
  sounds which have highly rhythmic components which are locked to tempo. The
  idea that you have a pad which will come alive with rhythmic complexity when
  played alongside other rhythmic sounds was at the forefront of the design. The
  sequence destination are filter, volume, drive and pan.

  One of the issues with having 11 layers is that it has a lot of parameters (30
  per layer) which poses the problem of making editing intuitive and logical.
  Firstly by having all 11 volumes visible at once and select buttons below,
  means that by editing the layer volume of selecting via the selector all
  relevant parameters will instantly be visible for editing as well as having a
  solo button which will just play the currently selected layer. This is an
  intuitive way to edit presets but it was taken a step further by creating an
  overview panel which displays all 11 layer parameters (excluding the
  sequencers) simultaneously, which means they can all be viewed/edited
  instantly and comparatively.

  Like most of the other instruments from homegrown sounds, augment is a true
  synthesizer relying much more on scripting than sample playback to shape the
  sounds. The samples are small and simple and used as oscillators and as a
  result unlike many kontakt libraries the memory footprint is very small.
  (currently 30mb, although more waveforms may be added).
specs: |-
  - 11 synthesizer layers
  - 4 sequencers per layer (volume, filter, pan, drive)
  - Polyphonic volume sequencers
  - 200 waveforms
  - Additive synthesis mode with 11 additive partials
  - Overview panel for all layer controls
  - Xy pad for recording layer sequencers
  - Reverb with impulse responses
  - Stereo delay
  - Modulator effect (chorus, phaser, flanger)
  - Global envelope for filter cutoff control
  - Detune parameter
  - Unstable pitch fluctuation
  - 12 volume triggers with real-time switching
  - Xy sequencer for volume triggers
  - Global and local randomizers (7 total)
  - MIDI controller integration
  - Integrated preset browser
  - 30 parameters per layer
  - Monophonic sequencers (except volume)
  - Filter type selection per layer
  - Envelope shape selection per layer
  - 3 effect sends per layer
  - Lofi controls per layer
  - Memory footprint 30mb
  - Kontakt instrument
