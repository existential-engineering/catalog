details: |-
  Become The Virtuoso

  Three years in the making, Vivaldi's Solo Violin is our most ambitious string library till date. Recreating a super-realistic, easily playable virtuoso solo violin, recorded with 8 notable vintage microphones, each with its own unique color. Offering you the ability to instantly build super-realistic chamber ensembles of up to 8 different sounding violins, all capable of performing limitless polyphonic legato together with effortless realism. Easy on the CPU. Rooted in Baroque tradition yet designed for the present and future, this ultra deep sampled (UDS) instrument captures the timeless essence of a true virtuoso violin, an instrument whose voice remains as universal today as it was three centuries ago. At the heart of the library are 49 H.A.L. Round Robin Legatos and a wide spectrum of brand new UDS articulations. Melodic Figures deliver completely playable super realistic scales. With over 100 million controllable melodic figures, you gain access to true virtuoso arpeggiations across many chord types, a run builder that can really run, and a high resolution time stretcher to sculpt phrasing with surgical precision. The articulation set also includes shorts in multiple measured lengths and sustains reaching into delicate modern flautandos, giving you a complete palette of color and expression.
