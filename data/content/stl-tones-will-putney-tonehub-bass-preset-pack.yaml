details: |-
  Will Putney is an American producer, mixer and engineer working out of his own Graphic Nature Audio studios in New Jersey. He has produced, mixed or mastered records for Knocked Loose, Every Time I Die, Gojira, Thy Art Is Murder, The Amity Affliction, The Acacia Strain, Northlane, Silent Planet, After The Burial, Terror, Unearth, Norma Jean, Vein.fm, Harm's Way, Stray From The Path and Counterparts, and produced Body Count's Grammy-winning "Bum-Rush". He is also a guitarist in Fit For An Autopsy and END.

  Will Putney's Bass ToneHub expansion pack has all-new tones, including favorites from his recent work, alongside the best of his Kemper, Axe-Fx and Tonality releases.
