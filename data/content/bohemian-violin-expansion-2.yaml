details: |-
  Our virtual performer takes a unique new look at how to make virtual
  instruments. Instead of making another standard virtual violin, we have
  decided to sample the performer and their play styles. Due to the extensive
  amount of samples required for realism, we had to develop a virtual performer
  to handle the articulations, abundant amount of legatos and bow selection for
  you as you play.

  Our virtual performer has just been expanded with expansion 2, delivering more
  varied types of performance, many new legato types, additional moods selection
  (improv, czardas, emotive, sprightly and concertino) allowing you to change
  the behaviour of the violinist on the fly and our newest advancement "maestro"
  the very first performer poly-legato!

  The expanded version with an unprecedented sample pool of almost 56,000 on a
  single microphone position, resulted in variety so complex that we had to come
  up with something new again. The answer was moods - changing complex behaviour
  on the fly with a single key-switch.

  For every note we have sampled hundreds of interval, dynamic and speed based
  samples, resulting in breath taking emotion packed performance that stays in
  true musical phrase from the first note until the last. Our legato is always
  captured in phrase and in musical context, making each legato type a true
  sample of a real performance.

  Each of our articulations or moods can also be forced upon the performer using
  an assignable force key giving you the ultimate control over the performer
  should you choose to adjust his behavior.
