details: |-
  Atelier series austin saxes is a true legato saxophone library performed by
  session player and educator, colin houlihan. Recorded at orb studios in
  austin, tx the goal with this release was to create a true workhorse full
  saxophone library that could accomplish a variety of musical tasks with vibe
  and ease.

  Vibrato is a crucial characteristic. Just like our sasaki trumpet release, we
  captured the natural, progressive vibrato found in colin's performances to
  keep things as musical and credible as possible. We've also provided both
  natural (untuned) and tuned variations of our patches the former retaining
  natural pitch biases up the range of the instrument.

  We've included two playing styles. The workhorse patches cater to upbeat,
  energetic contexts. Great for jazz, rock and pop genres. The emotional patches
  were recorded soft with a more subtle, emotive vibrato for delicate and
  expressive passages.

  Patches: soprano workhorse. Alto workhorse. Tenor workhorse. Baritone
  workhorse. Alto emotional. Tenor emotional. Baritone emotional.
specs: |-
  - Legato saxophones
  - Two performance styles
  - Natural, progressive vibrato
  - Natural (untuned) and tuned patch variations
  - Recorded dry for mixing flexibility
