details: |-
  An Astonishing Audio Adventure

  Are you ready to take a ride on the wild side and find music in everything? Introducing Wild Noises - a sonic adventure that will blow your mind and inspire your ears. With motorcycles, alarms, broken machines, sirens, fighter jet engines, wasps' nests, abandoned factories, screams through canyons, and so much more, Wild Noises is sure to surprise you! Wild Noises is not just a collection of sound effects; it's an opportunity to experiment and push the limits of your creativity. With hundreds of individual sounds, there are endless possibilities for making unique and exciting instruments, from drones to drums to bells to horns. The parts in Wild Noises are organized into seven diverse categories: Atmospheres & Pads, Basses, Mega Horns, Miscellaneous, Percussion, Risers, and Vocal. Each part has a looped and a non-looped variety, with a diverse collection of unique and inspiring sounds laid out across the keyboard. There are so many sounds that you may never even get through them all!
