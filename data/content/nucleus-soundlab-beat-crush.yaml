details: |-
  Nucleus SoundLab's first re is Beat Crush - an advanced bit crusher. By
  default Beat Crush adds a subtle 12-bit crunch to samples reminiscent of
  classic samplers.

  Users have access to each individual digital bit to create completely unique
  custom distortions. Beat crush is much more than just a lo-fi effect.

  Two very powerful multi-mode filters are onboard, and can be configured in a
  huge variety of ways courtesy of a semi-modular architecture.

  Using these features in combination, users will find easy access to crispy
  drumbeats, dirty dubstep basslines, creative vocal effects and more.
specs: |-
  - 12-bit bit crushing
  - Multi-mode filters
  - Semi-modular architecture
  - Individual digital bit control
  - Rack extension
