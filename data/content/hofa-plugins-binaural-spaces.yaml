details: |-
  IR-Pack Binaural Spaces is a collection of 236 binaural reverb impulse responses from HOFA-Plugins, presented as a way to add a new dimensionality and depth to a mix.

  The pack is a content add-on rather than a standalone processor: to use it you need one of HOFA's own convolution reverbs as a host, either the IQ-Series Reverb V2 or the HOFA SYSTEM IR-Verb.

  The impulse response list spans a wide range of spaces and reverb characters, from concert and event halls (Bleach Hall, Boomy Hall, Event Hall, Wooden Hall) through everyday rooms (Bathroom, Conference Room, Living Room, Small Kitchen, Hallway Apartment) to plates and spring reverbs (Dead Plate, Cute Springplate, Red Spring, Laser spring) and outdoor or unusual environments (Prison Yard, Urban canyon, Sports field, Firing range, Huge Temple, Sewer Pipe).

  Many of the spaces are supplied as matched pairs captured from two perspectives, listed as separate "front" and "rear" impulse responses, alongside single-perspective entries and utility-style responses such as Control A, Control B, Density, Response and Very Dry.

  The product page hosts a video on mixing with binaural reverb, SoundCloud sound examples, and the complete list of the 236 included impulse responses.
specs: |-
  - 236 binaural reverb impulse responses
  - Requires IQ-Series Reverb V2 or HOFA SYSTEM IR-Verb as a host
  - Many spaces provided as paired "front" and "rear" impulse responses
  - Covers halls, rooms, plates, spring reverbs and outdoor/ambient spaces
  - Full impulse response list and SoundCloud sound examples published on the product page
