description: A versatile sound effects library of over 29 GB of professional quality audio assets, covering the most vital sound design needs from Foley and crowds to ambiences and drones.
details: |-
  Krotos Foundations is a jam-packed, meticulously designed sound effects library, with over 29 GB of professional quality audio assets. The library is versatile and broad, designed for demanding film, game, and broadcast projects.

  From foundational Foley, crowds, impacts and whooshes to real-world ambiences and detailed drones, every sound in Krotos Foundations has been curated by hands-on sound designers, for creativity and efficiency.

  Krotos Foundations gives the sounds needed to take a project from start to finish, allowing sound designs to be customised faster and with control. All files are mixed, pre-balanced and production-ready.

  Categories include Foley elements (cloth movement, doors of all kinds, objects and more), impacts and hits, whooshes and passbys, drones and tonal beds, mechanical and industrial, ambiences and textures, abstract FX, crowds, cartoon, musical loops and layers, sports, UI, and transitions and stingers.

  This library is not integrated with any Krotos product. It is a standalone library of WAVs that can be added to an existing sound library and used with any plugin or processing chain. The purchase contains a zip file with all source asset files and a Metadata PDF.
specs: |-
  - 10,986 sound files
  - 29 GB+ of professional, ready-to-use sound effects
  - 24-bit / 32-bit, 192 kHz / 96 kHz / 48 kHz high-quality WAV files
  - 100% royalty-free commercial license
  - Embedded metadata
