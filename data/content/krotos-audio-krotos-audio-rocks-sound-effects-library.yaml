description: 669 MB of high-quality recordings of rocks, bricks, stones and gravel for foley and outdoor sound design. Recorded with Sennheiser MKH-416 and DPA 4062 microphones, capturing materials being dropped, scraped, ground, and smashed together. Includes traditional source files and a Reformer Pro integrated version with 3 Sound Packs.
details: |-
  The Rocks Sound Effects Library offers 669 MB of high-quality recordings of rocks, bricks, stones and gravel for a Foley project. Recorded with a Sennheiser MKH-416 and a DPA 4062, the library contains a selection of materials being dropped, scraped, ground and smashed together.

  The library is optimised to interact seamlessly with Reformer Pro, which recomposes audio into dynamic, responsive and highly-realistic sound design instantly. All the original files used in the library are also supplied.

  The purchase contains two downloads: a zip file with all source sound effect asset files and a Metadata PDF, and an installer for the integrated Reformer Pro library including assets and presets (iLok is required for the integration installers).

  Sound categories included are Bricks, Rocks, Stones and Gravel. Keywords cover bricks, cracks, crunching, dropping, gravel, grinding, hits, rocks, scraping and stones.
specs: |-
  - 54 sound files
  - 308 MB size / 669 MB Reformer Pro integrated library
  - 24-bit / 192 kHz and 96 kHz high-quality WAV files
  - 100% royalty-free commercial license
  - Embedded metadata
  - 3 Reformer Pro sound packs
