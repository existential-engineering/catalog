details: |-
  dezzer music is proud to present these new powerful 100 sound patches for
  synapse dune VST instruments, a multi-award winning synthesizer. You get the
  fattest and freshest leads, extremely Massive basses and incredible voluminous
  pad sounds that can be created with dune settings.

  This new bombastic sound pack gives you everything for your music hit
  production. Inside you find 100 perfect "ready to go" sounds patches for the
  synapse dune VST instruments. All sounds with modulation wheel and velocity
  assignments.

  The sound bank is usable for all electronic music styles like: dance, trance,
  house, edm, electro pop...

  100% of our products are royalty-free! They can be used, royalty free, for
  your music productions for both commercial and noncommercial use (single user
  licence).
