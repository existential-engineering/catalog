description: Bionic is a transient splicing engine, I.e. It is designed to give
  detailed control over a range of parameters needed to mix.
details: |-
  Bionic is a "transient splicing engine", designed to give detailed control
  over a range of parameters needed to mix and match a number of different
  initial transients to another set of tails/longer sounds.

  Bionic plucks and mallets is designed with a wide range of contemporary music
  production applications in mind, including electronica, hip hop and r&b, as
  well as cinematic styles. The included presets cover smooth and dirty basses,
  gritty, reimagined electric and rhodes pianos, celesta or glockenspiel-like
  bells and analog-style synth plucks, as well as a number of experimental,
  customised sounds.

  The short sounds (20) are non-tonal and cover transients only, including a
  range of wool, wooden, rubber and finger taps and knocks. The medium sound
  sources (40) are tonal and are drawn from plucked, fingered and mallet-hit
  acoustic, electric and bass guitars, alto and soprano glockenspiel, some
  sampled original analog synth plucks and a variety of unusual percussive
  sounds including a japanese wind chime, metal kalimba, dampened piano,
  pitchfork and wine glass.

  The long sound sources (20) are long sustained pads that can be used to add
  sustain to match the shorter sources. There is a selection of ebow-ed strings
  (piano, guitars, violin), and several individually crafted classic synth-style
  sounds (bells, tines, organ, saw, sine, pulse).
specs: |-
  - Bionic transient splicing engine
  - Four layers of sound (two transient layers and two tail layers)
  - 80 sound sources (20 short, 40 medium and 20 long)
  - 12 million possible sonic combinations
  - 50 presets included
  - Crossover fade control (between transient and tail samples)
  - Crossover point control
  - Tail envelope control
  - Transient attack curve (shape) control
  - Vibrato
  - Velocity sensitivity (volume, low pass and high pass)
  - Humanize controls
  - Replika analog style delay effect
  - Choral (chorus) effect
  - Flair (flanger) effect
  - Supercharger gt (compressor) effect
  - 2.1 GB total sampled content (1.56 GB compressed)
  - Full paid version of Kontakt v6.5.2 or higher required
  - Mac OS X 10.11 or higher
  - Intel i5 processor or equivalent
  - 4 GB RAM minimum
  - Windows 7, 8, 10 compatible
  - 1.56 GB free disk space required
