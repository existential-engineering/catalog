details: |-
  Landmark Analog Drums

  The CR-78 is another truly legendary analog drum machine, perhaps not as famous as the 808 or 909, but still filled with warm recognizable sounds that we've come to know and love. Released in 1978, this was the first programmable drum machine with a microprocessor, finally allowing artists the freedom to create their own electronic rhythms and patterns. Because of this, it can be heard on some of the most iconic tracks of the era from Blondie, Phil Collins, Hall & Oates and Tears For Fears. We recorded Orange 78 through the best analog signal chains, including Neve, API, SSL, EMS and Manley gear. Every sound was Ultra Deep-Sampled, capturing each gorgeous Kick, Snare, Rim, Cow Bell, Clave, HiHat, Cymbal, Conga, Bongo, Tambourine, Guiro and Metallic Beat in total organic detail. We even recorded this analog beauty through a range of contemporary vintage effects for added variety and authenticity. Come see our 78 today and be transported by this wonderful breakthrough instrument from the early days of beat making.
