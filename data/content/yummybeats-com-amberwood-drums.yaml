details: |-
  The AmberWood Drums is a peerless percussion and scoring tool. It features natural wood stick percussion; atmospheres; reversed, metal and glass sounds to create spaciousness and naturalness to complement any modern music from indie folk & rock over ambient, pop, hip hop, electro to blurred atmospheres.

  All sounds have been sampled round robin in high resolution for the real natural, organic feel. The sound of the amberwood drums is spatial, soft and velvet but it can also become creepy and deep, depending on how the amberwood drums are used.

  Each sound source represents a single instrument and can be layered and combined with each other to build complete new and individual, even experimental, sounds. Like kick drums or complete drum sets with hi-hats & snares are possible.

  Build custom sets by layering up to 4 sound-sources into one of the 8 key slots. Add widespread fx to individualize the sounding of each single source. Snapshots give quick access to pre-built sets.

  Sound sources include woods; metals; glass; atmospheres (like velvet rain, birds, noises, dust & dirt) & reversed sounds, enabling users to build custom drum sets with peerless natural warmth and spatiality.
specs: |-
  - Round robin sampling
  - High resolution audio
  - 8 key slots
  - Up to 4 sound-sources per slot
  - Reverb & delay effects
  - Snapshots/presets
  - Prelistening & solo function
  - Custom keymap
  - Kontakt instrument
  - More than 100 sound sources
