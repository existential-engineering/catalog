details: |-
  Descriptions

  Digital Download Only. Analog BoomBap Volume 3 is a collection of one-shot drum samples created with a dirty and authentic boom-bap aesthetic in mind. Analog BoomBap Volume 3 continues where volumes 1 & 2 left off with more of the dirty esthetic of analog drum design with vinyl flavored layers. These drums are processed using analog hardware and texturizing techniques that add grit and crunch for that raw boom-bap sound that we all love. There is no sample pack out there like this one. Do you want that old vintage Sp1200 and MPC 60 II sound in your sampler? Here ya go! ...And the saga continues! This is volume 3... Enjoy!
specs: |-
  - 8 Bass tones
  - 16 hats
  - 26 kicks
  - 7 misc. (clicks and clacks etc.)
  - 7 vox
  - 25 snares
  - Format: WAV - 16 bit / 44.1khz
  - Compatibility: MPC Software and All DAWS (no MPC Expansion included)
  - License: Royalty-Free
  - Delivery: Download instantly after purchase.
