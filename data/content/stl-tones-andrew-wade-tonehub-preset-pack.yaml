details: |-
  Andrew Wade is a producer and engineer best known for his long-running partnership with A Day To Remember, having produced, engineered or mixed their debut And Their Name Was Treason through Homesick , What Separates Me From You and Common Courtesy . Working from The Wade Studio in Ocala, Florida, he also produced Asking Alexandria's Stand Up And Scream and records for The Word Alive.

  Using some of Andrew's go-to guitar amp, cab and pedal setups along with his mix processing techniques, this signature collection showcases virtually all of his guitar recording setups.

  Wade's pack contains 78 captures.
