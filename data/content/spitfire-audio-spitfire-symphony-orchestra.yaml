details: |-
  Recorded at AIR Studios with 123 world-class musicians

  Spitfire Symphony Orchestra places the definitive sound of modern cinema at your fingertips. From the whisper of a solo flute to the thunder of a full symphonic brass section, command the same gold-standard palette used by the world's most celebrated composers. A comprehensive collection of curated ensembles, strings, brass, woodwinds, harp, piano and percussion, performed by world-class musicians and recorded in breathtaking detail in the legendary acoustics of AIR Studios' Lyndhurst Hall.

  Our longest-running and bestselling orchestra, SSO has been updated twice in 2025 with the addition of Solo Strings and most recently Motif Brass: three new ensembles that deliver the bold, thematic sound at the heart of cinema's most iconic scores, adding unmistakable power, colour, and definition to your music.
specs: |-
  - 123 musicians recorded at AIR Studios Lyndhurst Hall
  - 600+ articulations
  - Performance legato patches
  - Strings: 60 players (16, 14, 12, 10, 8), 175 articulations including 59 shorts, 94 longs and 9 legatos
  - Brass: 8 solo instruments, 5 a2 sections, 3 a6 sections
  - Woodwinds: 11 solo instruments, 4 a2 sections
  - Percussion: 9 tuned, 13 drums, 12 toys, 14 unpitched metal, 3 unpitched wood
  - Mic positions: strings Close, Tree, Ambients, Outriggers, Leader; brass, woodwind and piano Close, Tree, Ambients, Outriggers; percussion and harp Close, Tree, Ambients
  - 2025 Motif Brass update adds 7.8 GB of content (Trumpets a3, Horns a4, Trombones a5)
  - 2025 Solo Strings update adds Solo Violin, Viola and Cello
  - Compatible with NKS
  - Spitfire Audio App required
