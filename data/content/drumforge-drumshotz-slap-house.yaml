description: A 53-sample one-shot collection inspired by the Slap House sub-genre of EDM, covering claps, hats, crashes, kicks, rides, and snares for cross-genre sound design.
details: |-
  The team at Drumforge assembled this collection of mix-ready one-shot drum samples to add texture and flavor to a song. It takes its cue from the minimalistic approach of the Slap House sub-genre of EDM.

  The 53 one-shots are aimed at cross-genre sound design: pop elements can be added to a rock or metal mix, or the textures of an EDM or pop production can be reinforced. They cover clap and snap sounds, closed and open hats, crashes, rides, kicks, snares, and a set of extras.

  Drumshotz is a series of drum samples meant to enhance, blend, or replace drum sounds in a mix, and these can be mixed and matched with existing sample libraries or raw drum recordings.
specs: |-
  - One Shot sample collection inspired the sounds of EDM and chart-topping pop mixes.
  - 53 samples total in 44.1 kHz, 24-bit WAV format.
  - For use with any triggering program or DAW
  - 10 clap snap samples.
  - 4 closed hat samples.
  - 6 crash samples.
  - 8 extras.
  - 11 kick samples.
  - 4 open hat samples.
  - 3 ride samples.
  - 7 snare samples.
