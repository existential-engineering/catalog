details: |-
  The Arabic Oud library was created in close collaboration with the renowned musician and oud virtuoso bassam ayoub. Bassam ayoub performed and recorded all playing variations with the main emphasis on achieving an authentic sound, both for melodic playing and rhythmic accompaniment.

  The arabic oud offers three different, meticulously recorded oud instruments with breathtaking 39 articulations and brings one of the oldest string instruments to life right under your fingertips. The versatile sound spectrum of the oud can enrich any kind of music and the integrated microtunings are very appealing to professional maqam performers.

  The arabic oud user interface gives you access to the most important and commonly used microtunings of oriental music: bayati, rast, saba and seka. Each tuning offers two variants (normal and syriac church) as well as free choice of the root key. The keyswitches allow you to switch between the different playing techniques to create incredibly realistic performances.

  There are two types of keyswitches: latch and hold. While latch keyswitches remain active after the key is released, hold keyswitches remain active only as long as they are pressed and held by the player - after the key is released, the playing mode changes to the last selected latch keyswitch. The green MIDI song keys above the playing area provide short MIDI sequences which showcase the numerous playing possibilities of the arabic oud.

  Each of the three instruments of the arabic oud is also available as lite version. These patches contain the very essential articulations to perform the oud realistically in a live environment.
specs: |-
  - Three meticulously recorded oud instruments
  - 39 articulations
  - Microtunings: bayati, rast, saba, seka
  - Latch and hold keyswitches
  - MIDI song keys
  - Lite versions for live performance
  - Engine version 2.6.0.33 or higher
