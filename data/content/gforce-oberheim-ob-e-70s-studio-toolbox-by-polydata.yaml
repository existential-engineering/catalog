details: |-
  When Oberheim released their flagship polyphonic synthesizers in the mid-1970s, they were premium products used primarily by studios to achieve polyphonic synthesis on recordings. The 70's Studio Toolbox by Polydata pays homage to that era while embracing modern sound design.

  Created by Polydata (Shahruz Moshtael), this 49-patch preset pack is designed exclusively for the GForce Oberheim OB-E synthesizer. Patches span basses, pads, keys, textures, sequences, and more.
