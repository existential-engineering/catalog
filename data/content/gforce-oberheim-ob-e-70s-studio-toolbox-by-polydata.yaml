description: A collection of 49 meticulously crafted patches for the GForce Oberheim OB-E, created by Polydata (Shahruz Moshtael). Drawing inspiration from the golden era of analog synthesis in the late 1970s and early 1980s, the pack spans basses, pads, keys, textures, sequences, and more.
details: |-
  When Oberheim released their flagship polyphonic synthesizers in the mid-1970’s, they were undoubtedly premium products. Besides well-known and successful musicians, the only others who had the means to acquire a Four or Eight voice Oberheim were recording studios. Seen as a powerful tool for synthesis, these polyphonic Oberheims were used on countless recordings in the 1970s as the only way to achieve true polyphonic synthesis and bring beautiful and unmistakable colour to productions.

  The 70’s Studio Toolbox was crafted in this same spirit, approaching the instrument as a tool for the studio, with a wide array of sounds designed to fit into mixes and breathe life into productions. Drawing from the classic synth sounds of the mid-70’s, but pushing the envelope further and taking full advantage of the enhancements GForce have added. Just like the GForce Oberheim OB-E, these patches are vintage-voiced, but looking to the future.

  About Polydata: Polydata is the work of composer and sound designer Shahruz Moshtael. Both in creating music and in designing sounds, he draws inspiration from the first golden age of analog synthesis from the late 1970’s to early 1980’s, but with the aim of moving forward into the future, continuing to develop that style and approach, rather than just repeating the past.

  The pack is only available to registered users of GForce Oberheim OB-E. Additionally, it is exclusively available via this website as a direct download via “My Instruments” when the purchase has been completed.
