description: In this composite collection, you get 844 files containing 2000+ different handwriting sounds from different pens, pencils, crayons, chalk on blackboard, felt pens, markers, yes even brushes and writing in sand or carving in stone. All this in many variations from writing words and sentences, strokes, periods, and doodling. Built specifically for use with Reformer and Reformer Pro.
details: |-
  In this composite collection, you get 844 files containing 2000+ different handwriting sounds from different pens, pencils, crayons, chalk on blackboard, felt pens, markers, and even brushes and writing in sand or carving in stone. All this in many variations from writing words and sentences, strokes, periods, and doodling.

  This library was built specifically for use with Reformer and Reformer Pro, plugins that recompose audio into dynamic, responsive, and highly realistic sound design instantly.

  Sound categories included in this library: Markers, Pencil, Spray Can, Pens.

  Sound effect keywords: Ballpoint Pen, Chalk, Felt Pen, Fountain Pen, Markers, Pencil, Quill, Sand, Spray Can, Stone, Text Marker, Watercolour on Canvas, Watercolour on Paper, Wax Crayon, Whiteboard.
specs: |-
  - 793 Sound Files
  - 735 MB / 2.45 GB Reformer Pro integrated version
  - 24 bit / 96kHz High-Quality WAV Files
  - 100% Royalty-Free Commercial License
  - Embedded Metadata
  - 15 Reformer Pro Sound Packs
  - Contains two downloads: a zip file of all source sound effect asset files with Metadata PDF, and an installer for the integrated Reformer Pro library (iLok required for the integration installers)
