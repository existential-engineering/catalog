details: |-
  Flame Audio presents a new epic product - 'b-turbo Omnisphere 2 bank'. This
  expansion is an incredibly versatile Omnisphere 2 preset bank, has some of the
  most innovative sounding patches.

  With this bank you would be equipped primarily with powerful pads,
  modern-sounding strings, ambient keys and bells, moody guitars and more.

  Product details: 70 custom omnisphere patches: 4 bells. 4 basses. 3 plucks. 27
  pads. 12 keys. 1 lead. 4 guitars. 2 flutes. 2 sfx. 1 mallet. 3 organs. 5
  strings. 2 synths.

  Installation instructions (mac or windows): extract the folder to
  spectrasonics > steam > omnisphere > settings library > patches hit the
  refresh button in patch browser.
specs: |-
  - 70 custom Omnisphere patches
  - Omnisphere 2.4 or higher required
