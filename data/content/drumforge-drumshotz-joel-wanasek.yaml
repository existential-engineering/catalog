description: Producer and mixer Joel Wanasek's original signature collection of one-shot drum samples, focused on rock and metal, with direct and room captures of every drum.
details: |-
  Drumshotz Joel Wanasek is the first signature one-shot drum sample collection from producer and mixer Joel Wanasek, drawn from the samples he has used most across his mixing career with artists including MIYAVI, Machine Head, Monuments, Vinyl Theatre, Attila, and blessthefall.

  The pack is focused on rock and metal, and pairs direct and room captures throughout so the samples can be blended into existing drum recordings at whatever ratio a mix needs. It carries 5 direct kicks, 5 room kicks, and 1 sub kick, 5 direct and 8 room snares, and 2 tom sets comprising 6 direct tom samples with 6 matching room samples.

  All 36 samples are delivered at 24-bit / 44.1 kHz for use with any drum triggering program or DAW.
specs: |-
  - 36 one-shot drum samples total
  - 24-bit / 44.1 kHz format
  - 5 direct kick, 5 room kick, and 1 sub kick sample
  - 5 direct snare and 8 room snare samples
  - 2 tom sets: 6 direct tom samples with 6 matching room samples
  - For use with any triggering program or DAW
