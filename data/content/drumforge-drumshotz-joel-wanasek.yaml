description: DRUMSHOTZ is a series of highly coveted drum samples from professional mixers to enhance, blend, or replace drum sounds in your mixes. Inject heavy gainz into your drum mixes today with DRUMSHOTZ and experience a whole new level of punch, impact, and power.
details: |-
  Drumshotz Joel Wanasek is a signature one-shot drum sample collection from professional mixer Joel Wanasek, known for his mixing work with artists including Machine Head, Miyavi, Monuments, and Attila.

  The pack contains 36 samples total recorded in 44.1 kHz, 24-bit WAV format, covering kicks, snares, and toms with both direct and room mic perspectives.

  Kick samples include 5 Kick Direct, 5 Kick Room, and 1 Kick Sub. Snare samples include 5 Snare Direct and 8 Snare Room. Tom samples include 2 sets of 6 Tom Direct and 6 Room samples.

  Designed for use with any DAW or drum triggering program, the pack comes with an instant digital download, perpetual license, free lifetime updates, and unlimited customer support.
