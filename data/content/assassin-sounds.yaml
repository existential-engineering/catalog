details: |-
  Assassin Sounds is a sample pack presented by Soundtrack Loops and bus loops,
  containing 8 construction kits with 62 loops including leads, basses, kicks,
  snares, claps, perc, and pads, along with 8 MIDI files for each of the synth
  leads and 57 one-shots featuring FX, perc, impacts, stabs, and drums.

  The sample pack is formatted in 24-bit 44.1 khz stereo and available in
  multiple formats: acidized wav, recycle rx2, apple-looped aif, and ableton
  live pack alp.

  Assassin sounds is designed for producing electro house music and is
  compatible with macos and windows platforms.

  The sample pack was created by silent j, a chicago-based musician known for
  his heavy adrenaline-filled sets and dynamic mixing effects including
  turntable tricks and quick drops, with a history of performances at numerous
  music festivals across the us over the past 9 years.
