details: |-
  At 5'8", the baldwin "r" series represent a mid-point between a full grand and the smaller baby grands, resulting in an piano with plenty of depth and power, but more intimacy than what's offered by a bigger grand. This instrument is versatile and expressive, packed with features we thought could really express the piano's musical story. It's got a wide dynamic range, with a real bite that's great for rock tracks, and a gentler side, too, that's complemented by the alternate mic positions and audio processing options.

  Included are eq & compression tailored to work well with the piano's acoustic footprint, convolution reverbs built to emphasize specific sonic characteristics of the piano, key release layers, sustain pedal resonance, and pedal sounds.

  Recorded from four mic perspectives: close mics are bright and present, the mid mic is warmer with a true stereo picture, the mono mic is for settings where mono compatibility is important (or as an effect layer supporting stereo mics), and the far mics present a more evocative, dark tone.

  There's no synthesis involved, no stretching or tuning, no enhancements or sweetening. Just the inimitable sound of this particular baldwin, built in cincinnati ohio in 1954, serial #127948.

  Fastidiously recorded and mastered: no eq or compression used in mastering, and careful noise reduction only to the extent necessary. Preamps used were doug fearn's vt-2 & vt-12, and fredenstein mic pres. Lynx audio converters recording at 88.2k, 24-bit. All audio processing performed at 88.2k.
