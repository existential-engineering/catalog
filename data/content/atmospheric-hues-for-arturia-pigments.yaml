details: |-
  Atmospheric hues is a soundset that explores the deeper side of arturia
  pigments, designed to take advantage of pigments' complex programming
  capabilities.

  The library includes atmospheres, pads, arps, leads, and bass presets, with
  the main focus on complex atmospheres and lush pads.

  Considerable time went into the programming of each preset, with every preset
  including deeply programmed instruments that take advantage of the
  capabilities that pigments has to offer.

  Many of the atmospheres are so rich and deeply programmed that they stand up
  when used singularly in a musical composition, with all the fx, modulation,
  automation, etc of each patch making it capable to use a single preset as a
  complete musical piece.
specs: |-
  - Two engines in parallel
  - Virtual analog triple osc engine
  - Complex wavetable engine
  - Powerful effects
  - Advanced modulation system
