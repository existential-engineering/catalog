  - Ring modulation macro
  - Reverb macro
  - Osc mix macro
  - Low pass filter cut-off frequency macro
  - Aftertouch support
  - Mod wheel support
  - Unison engine
  - Chorus effect
  - Tremolo effect
  - Arpeggiator with adjustable gate
  - Sixteenths notes speed arpeggiation
