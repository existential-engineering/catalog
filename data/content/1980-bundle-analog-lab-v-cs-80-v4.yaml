details: |-
  1980 bundle for arturia analog lab v and cs-80 v4 contains 110 nostalgic presets. The soundbanks that are included in this bundle are: 1980 vol.1 for arturia cs-80 v4 and analog lab v synths contains 30 presets derived from the classic 80's sound era. This soundbank has 10 classic synths, 10 classic pads, 5 vintage leads and 5 vintage basses. All macros are assigned to ring modulation, reverb, osc mix and low pass filter cut-off frequency.

  1980 vol.2 for arturia cs-80 v4 and analog lab v synths contains 30 presets derived from the classic 80's sound era and carrying this distinct cs-80 sound identity. This soundbank has 30 classic pads that could also be used as polysynths in terms of performance. Chorus and tremolo in the down part of the synth play an important role for most presets and give an additional vintage 80's touch to the sounds. All macros are assigned to ring modulation, reverb, osc mix and low pass filter cut-off frequency.

  1980 vol.3 for arturia cs-80 v4 and analog lab v synths contains 30 presets derived from the classic 80's sound era and carrying this distinct cs-80 sound identity. This soundbank has 30 classic synth keys and most of them could also be used as pads in terms of performance. Chorus and tremolo in the down part of the synth play an important role for most presets and give an additional vintage 80's touch to the sounds. All macros are assigned to ring modulation, reverb, osc mix and low pass filter cut-off frequency.

  1980 vol.4 for arturia cs-80 v4 and analog lab v synths contains 20 arp presets derived from the classic 80's sound era and carrying this distinct cs-80 sound identity. This soundbank has 20 classic synth arps mainly adjusted in sixteenths notes speed. Adjust the gate slider on will to adjust the length of the arpeggiated notes. Disable the arp by pushing the on/off button on the arpeggiator section and transform the presets into classic 80's poly synths.
specs: |-
  - 110 nostalgic presets
