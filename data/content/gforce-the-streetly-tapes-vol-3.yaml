  for M-Tron Pro IV.
details: |-
  As per Vol 1 & Vol 2, all the sounds here were curated by Martin Smith from the Streetly archives and then recorded via the Skellotron, a bare bones M400 built to allow detailed adjustment of every component including the azimuth alignment of each tape-head.

  This add-on pack contains 26 carefully curated tape banks from the original UK 'Tron masters. The pack also contains 150+ patches for M-Tron Pro, many from luminaries including Nick Magnus (Steve Hackett), Matt Berry (musician, actor, writer, comedian) and a couple of additional Herberts.

  The Streetly Tapes Vol 3 Expansion Pack is only available to registered users of M-Tron Pro. Additionally, it is exclusively available via this website as a direct download via “My Instruments” when the purchase has been completed.
specs: |-
  - A GForce Software and Streetly Electronics collaboration
  - Tape banks from the original UK 'Tron masters
  - Derived from original EMI tape-stock
  - 150+ patches, many from luminaries including Nick Magnus (Steve Hackett) and Matt Berry
  - 26 carefully curated sounds for M-Tron Pro
  - 35 notes per tape bank
  - Exclusively available via download – 700MB
  - Requires a registered copy of M-Tron Pro
