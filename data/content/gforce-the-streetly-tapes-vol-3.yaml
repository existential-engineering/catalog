details: |-
  The Streetly Tapes Vol 3 is a collaboration between GForce Software and Streetly Electronics, featuring 26 carefully curated tape banks from the original UK Mellotron masters derived from original EMI tape-stock. All sounds were curated by Martin Smith from the Streetly archives and recorded via the Skellotron, a bare-bones M400 built to allow detailed adjustment of every component including the azimuth alignment of each tape head.

  The pack includes 150+ patches contributed by notable artists including Nick Magnus (Steve Hackett), Matt Berry (musician, actor, writer, comedian), and others. Demos are provided for tracks by Ian Neal, Dave Spiers, and GForce Software.
