details: |-
  The Krotos Starter Sound Effects Library offers a broad collection of high-quality sound effects spanning classic categories of sound design.

  This all-rounder contains 3,956 professional and royalty-free SFX components including Foley, surfaces, magic, weapons and mechanicals.

  The collection is a companion for those starting out in sound design, or anyone looking to expand an existing collection with an affordable SFX pack for post-production and game-audio work. It adds realism, matches sounds to footage and supports pro-quality delivery.

  The Krotos Starter Library does not contain a Reformer Pro, Weaponiser or Krotos Studio installer. It contains only raw files, which can be imported into Krotos software if desired, and it is not compatible with Krotos Studio.

  Sound categories included are Ambiences, Animals, Monsters, Cinematic, Combat, Fight, Cloth, Footsteps, Movement, Foley, Elements, Fire, Water, Ice, Surfaces, Gravel, Leaves, Concrete, Flesh, Hand to Hand, Guns, Reloads, Magic, Spells, Mechanical, Pneumatic, Melee, Battle, Knives, Swords, Weapons, Sci-Fi, Futuristic and Whooshes.
specs: |-
