details: |-
  Erik Ron is a Los Angeles-based producer, mixer and songwriter who built and opened Grey Area Studios in North Hollywood in 2013. He has worked with Panic! At The Disco, Godsmack, Staind, Bush, Motionless In White, Issues, Set It Off, Blessthefall, I See Stars, New Years Day and Attila.

  Built using Erik's collection of gear, this pack is an extensive bundle of guitar and bass tones, ranging from signature captures from some of his biggest releases through to one-off custom tones.

  Erik's pack contains 37 captures.
