details: |-
  Pinnacle of Modern Hybrid Scoring

  Hybrid Tools Apex is the culmination of our Hybrid Tools libraries. Truly the peak of cinematic scoring, expanding the notion of what instruments and sound design can be. Filled with Boomers, Downers, Megahorns, Bends, Starfalls, and so much more. Apex is featured in thousands of Blockbusters, TV-Shows, AAA Video Games, Trailers, and everything in between and has become the professional gold standard for high-end cinematic scoring tools. We wanted to create something entirely original in all regards. Featuring signature bad-ass patches, tonally splitting separators, poetic Starfalls, modified lightning strikes, roaring spaceship pass-bys, and beautiful little sonic fireflies. The Soundpaint engine takes this sonic exploration even further by allowing for even more experimentation and discovery beyond the source sounds. Apex is somewhere between super-epic and sonic poetry. Every single sample was carefully curated over a two year period. This library has never been more at home than in our groundbreaking Soundpaint ecosystem.
