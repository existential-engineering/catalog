details: |-
  Blast From The Past

  From the 8-bit gaming sensation comes the GameBoi library, with all the sounds we remember from childhood! The popular line of handheld gaming consoles was produced from 1989 to 2005, featuring 3 major generations and many smaller revisions. The core architecture of all consoles was similar, with a 4-voice sound chip (2 square waves, 1 noisetable, and one wavetable). The unique, nostalgic sound of the GameBoi is unmistakable, and the Soundpaint version brings us closer to the chips than ever before! We wanted to cover everything that can be done with these beauties, so we sampled almost a dozen different units, from the original to the advance. With over 200 parts and tens of thousands of samples, we really mean it when we say ultra deep sampled!
