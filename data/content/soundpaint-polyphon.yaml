details: |-
  An Antique Delight

  A remarkable mechanical instrument born in the late 19th century, the Polyphon operates like a giant music box. It uses precise pins on interchangeable discs to create sparkly, enchanting melodies. What makes the Polyphon truly captivating is its delightful unpredictability. With each note struck at a consistent force but producing subtly unique timbres, there is always an element of mechanical whimsy. This extraordinary piece of history, with its origins in Switzerland, is an absolute antique gem. We stumbled upon it at a recording label auction, and the story goes that even electronics giant Philips had a musical phase after World War II, buying and later selling record labels, while also distributing countless blank CDs.
