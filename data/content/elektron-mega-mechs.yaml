description: Mega Mechs - Sound Pack for Digitakt II. Download custom-made new sounds and samples. Give your machine a whole new audio wardrobe.
details: |-
  Mega Mechs arrives as the first Sound Pack on Digitakt II, like a towering mechanical frame bursting forth through cloud cover and impossible to ignore. It is a broad assortment of 95 stereo samples from User Friendly, who helped supply some of the factory content for Digitakt II.

  There are tons of options to unleash: kicks, hats, snares, as well as micro chains and rolls. Apply them to your composition for your very own metallic amalgamation.

  You also get the samples in mono, enabling this pack to flourish both on Digitakt II and on its predecessor. Mega Mechs has stereo samples for Digitakt II and Octatrack, as well as alternatives in mono for use on Digitakt, Analog Rytm and Model:Samples, or any other sampler that handles WAV files.

  This Sound Pack is a digital item. Detailed instructions on how to download the Sound Pack will be provided via email upon purchase.
specs: |-
  - 95 samples including kicks, snares, hi-hats, foley, rolls and micro chains
  - 16 bit / 48 kHz stereo and mono WAV files
  - Created by User Friendly
  - Type: samples
  - Works with Analog Rytm MKI, Analog Rytm MKII, Digitakt, Digitakt II, Model:Samples, Octatrack MKI and Octatrack MKII
  - Digital item, download instructions provided by email upon purchase
