name: Ableton Drum Racks for Superior Drummer 3 Jazz EZX
manufacturer: timbresandtones
primaryCategory: drum-sample-pack
description: Ableton drum racks for superior drummer 3 jazz ezx features
  separate ableton drum racks for superior drummer 3 jazz ezx.
details: >-
  Ableton drum racks for superior drummer 3 jazz ezx features separate ableton
  drum racks for all factory presets for the toontrack superior drummer 3 and
  jazz ezx library for toontrack ezdrummer. These racks provide out of the box
  integration workflow between ableton live and toontrack superior drummer using
  the toontrack libraries including a host of features ready to use for
  composition and performance using ableton push or similar controllers.


  12 ableton drum racks to instantly load the factory library "mix ready"
  presets with ableton mappings. 6 ableton live templates designed to host the
  multi channel output routing presets with track level audio routing from
  superior drummer 3 into ableton live. Colour coded pad design for visual
  performance and finger drumming.


  Vast array of instrument articulations ready to go in one massive layout using
  ableton push 64 pad layout mode. All our racks use consistent drum rack
  colouring so you can visually and immediately spot your rides from your hi hat
  articulations.


  Ableton macros mapped to toontrack superior drummer macros with preset values
  for ease of use in push and simple to use automation programming. Singleout
  presets feature 6 ableton drum racks for all jazz ezx factory presets single
  audio output to a single ableton track.


  Multiout presets featuring 6 ableton drum racks for all jazz ezx presets in
  multiple audio channel output from the plug in to multiple ableton audio
  tracks using the 6 multi output ableton templates also provided designed for
  the kit presets. Track level audio mixing control in ableton.
specs: |-
  - Ableton drum racks
  - Ableton push integration
  - 12 ableton drum racks
  - 6 ableton live templates
  - Multi-channel audio routing
  - Single audio output option
  - Colour coded pad design
  - 64 pad layout mode
  - Ableton macro mapping
  - Toontrack superior drummer 3 integration
  - Jazz ezx library support
  - Toontrack ezdrummer compatibility
  - Factory presets
  - Instrument articulations
  - Audio routing and mixing
  - Track level audio mixing
  - Automation programming support
