description: AutoGrid is a max 4 live audio device, that creates random grid
  synths patterns from up to 4/8 incoming tracks, and mixes them with current.
details: |-
  AutoGrid is a max 4 live audio device that creates random grid synths patterns
  from up to 4/8 incoming tracks, and mixes them with the current track, ducking
  it if needed. It is a huge timesaver for building interesting FM patterns with
  different sounds, or sequencing arpeggios or basslines, making sure they don't
  overlap whatsoever.

  Autogrid offers control of the four/eight incoming signal levels and current
  track level, occurrences weight control between the 4 sounds, and time
  allocation control between 4 different time durations (from 1/32 to 8 bars,
  including dotted and triplet notes). Additional parameters include minimum and
  maximum length per note, mix amount between current track and stutter, and
  duck amount when stutter plays.

  The device features stutter probability to insert random silences and lower
  density, a smooth parameter to avoid clicks/pops or glue sounds together for
  fading in or out, and fully automatable parameters. Per grid sends allow each
  grid source to be sent to a delay, reverb or other effects separately from
  other grid sources.

  Output rerouting of each grid source to any given track allows the output
  sequence to be recorded with each grid source on its own track. The device
  includes a freezable random engine to have repeating random patterns, triplets
  and dotted section, 1/4th sidechain, and an upgraded sequencer for tighter
  timings with a complete ui redesign.

  Max 4 live is required to use this device (included with ableton live suite,
  or available as an add-on for other live versions). Autogrid is compatible
  with live suite 10.1.41+, live 11, and live 12.
specs: |-
  - Max 4 live audio device
  - Random grid synths pattern generation
  - Up to 4/8 incoming tracks
  - FM pattern creation
  - Arpeggio sequencing
  - Bassline sequencing
  - Input level control
  - Occurrences weight control
  - Time allocation control (1/32 to 8 bars)
  - Dotted and triplet notes
  - Minimum and maximum note length
  - Mix and duck amount control
  - Stutter probability
  - Smooth parameter
  - Fully automatable parameters
  - Per grid sends (4 per channel)
  - Output rerouting to any track
  - Freezable random engine
  - 1/4th sidechain
  - Upgraded sequencer
  - Compatible with live suite 10.1.41+
  - Compatible with live 11
  - Compatible with live 12
