details: |-
  Painstakingly recreated 808s and subs off tracks from A$AP Rocky, Yeat, Pusha T, Lil Uzi Vert, Drake, 21 Savage and more.

  The sound of the 808 sub-bass is everywhere and the style is extremely varied, from smooth and punchy to crunchy and buzzy, long glides and short bumps.

  You get a collection of 12 painstakingly recreated 808 subs off tracks from fresh hits.

  This pack was sound designed by Future Audio Workshop's in-house sound designers.

  Once your purchase is complete, the pack shows up in your FAW account. Download the zip file and follow the instructions on how to import the sounds into SubLab XL.
