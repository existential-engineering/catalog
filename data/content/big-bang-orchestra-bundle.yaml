description: "Big bang orchestra: bbo bundle a universe of sound, from a to z:
  strings, brass, woodwinds, percussion and choir of the synchron stage orch..."
details: |-
  This Massive package comprises the entire universe of the big bang orchestra
  editions, from andromeda to zodiac. From powerful tutti recordings to ethereal
  effects, from blasting brass sections to fragile woodwinds, from thunderous
  drums to angelic choirs the big bang orchestra bundle provides you with an
  infinite treasure of orchestral sounds that lets your productions be as bold,
  nuanced, and sophisticated as you need, with little time and effort.

  Played by the acclaimed musicians of the synchron stage orchestra, recorded by
  hollywood-proven engineers at synchron stage vienna, and perfected by our
  expert team of library creators, this package truly excels in terms of sound
  quality, playability, versatility and realism.

  The vienna synchron player, our proprietary sample player, is the exclusive
  powerful engine for running hundreds of voices and multi-microphone recordings
  simultaneously. The internal mixer always delivers a perfect sound
  out-of-the-box, with masterfully crafted mixer presets that match across the
  entire series from close to ambient, from natural to heavily processed, from
  stereo to surround and into immersive audio.

  The big bang orchestra bundle includes these libraries: bbo andromeda -
  essentials, bbo black eye - phrases & fx, bbo capricorn - symphonic riffs, bbo
  dorado - percussion ensembles, bbo eridanus - percussion ensemble riffs, bbo
  fornax - pitched percussion ensembles, bbo ganymede - choirs, bbo hercules -
  low brass, bbo izar - low brass clusters, bbo jupiter - horns, bbo kopernikus
  - trumpets, bbo lyra - high strings, bbo musca - low strings, bbo neptune -
  tutti woodwinds, bbo orion - woodwind sections, bbo phoenix - pitched solo
  percussion, bbo quasar - solo percussion, bbo regulus - fx strings, bbo
  solaris - fx woodwinds, bbo tana - 1st violins, bbo ursa - 2nd violins, bbo
  vega - violas, bbo wallia - cellos, bbo xenia - basses, bbo ymir - children's
  choir, bbo zodiac - supermassive ensembles.

  Download file size 205.0 gb. Installed file size 508.4 gb.
