name: Afterglow Holograms for Hive 2
manufacturer: rse
primaryCategory: preset
description: Touch the universe is excited to announce afterglow holograms for
  u-he's hive 2 synthesizer
details: >-
  Afterglow holograms for u-he's hive 2 synthesizer features an impressive,
  modern sound with a powerful feature set and a relatively easy to use layout.
  It is similar in architecture to the famous sylenth synthesizer, however, hive
  has plenty of its own unique character and a more advanced feature set than
  its forebearer.


  Afterglow holograms is 100% perfectly suited for all ambient and electronic
  music genres. The soundset is filled with many unique sounds spread out in a
  variety of categories, including lush pads and many exotic goa trance style
  lead and glides.


  The soundset includes 100 presets for hive 2. An optional expansion version is
  available containing 30 MIDI files (over 50 merged patterns) taken from the
  audio showcases, with files named identically to the corresponding preset.


  All patches are volume normalized so they won't clip and have equal volume
  levels when scanning between presets. Complex modulation wheel destinations
  are included for all patches, and when appropriate, many patches also utilize
  velocity sensitivity.


  Patches were created in the latest version of hive 2 and the soundset contains
  5 additional wavetables. Patch breakdown includes: leads - 19, pads &
  atmospheres - 26, basses - 12, plucks - 14, keys - 8, arps and sequences - 9,
  drums and fx - 11.
specs: |-
  - 100 presets for hive 2
  - 30 MIDI files (optional expansion)
  - 5 additional wavetables
  - Complex modulation wheel destinations
  - Velocity sensitivity
  - Volume normalized patches
  - Latest hive 2 version compatible
