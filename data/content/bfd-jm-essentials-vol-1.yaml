details: |-
  Produced by vastly experienced composer jacques mathias, jm essentials vol.1
  contains varied, expressive patterns that cover genres such as rock, hard
  rock, alt-rock, heavy metal, trash metal and pop-punk.

  Authentic and very musical, the included grooves are bursting with the human
  feel of a real drummer.

  Each supplied palette features up to 50 groove and fill variations, with the
  pack containing over 1300 patterns in total.

  Palettes are supplied in bfd3, bfd eco and bfd2 versions.

  Minimum requirements: windows 7 or above (windows), os x 10.8 or above (mac),
  bfd3 v. 3.2.1.2 or above, internet connection for download and authorization.
  Recommended: ssd. Disk space requirements: 23 gb.
