details: |-
  Awakenings for halion 5.1 provides 100 presets as well as including some
  creative templates which use the included 200 multi-sampled instruments as
  selectable oscillators. The templates allow selecting the samples via 2 a & b
  knobs with a mix control which makes making new sounds a creative, interactive
  and very easy process.

  Each included instrument makes use of the 8 quick controls with the aim of
  making customizable instruments. Whilst the templates load all sampled
  instruments, the 100 presets use pairs instead so that they are quick to load
  when browsing, these presets also make good use of the quick controls.

  17 templates which use all included multi-sampled instruments as selectable
  oscillator types. 3 synth templates which use the halion synth engine only.
  They contain a predefined set of presets selectable via quick controls.

  1 wave sequence template - this is inspired by kosmology and uses the sampled
  instruments as a wave sequencer by using a flexphaser cc to select the waves.
  The templates use combinations of sampler, granular and synth engines.

  Installed size - 880 mb; download - 692 mb
specs: |-
  - 100 presets
  - 200 multi-sampled instruments
  - 8 quick controls
  - 17 templates
  - 3 synth templates
  - 1 wave sequence template
  - Halion synth engine
  - Sampler engine
  - Granular engine
  - Flexphaser cc
  - A & b knobs with mix control
