description: Gore is a complete collection of horror, gore, and weapon sound effects designed for use in Reformer Pro and Weaponiser. It features bloody impacts, splatter, body impacts, bone-breaks, flesh rips, weapon impacts, and other gory sounds. Created by SoundMorph in collaboration with Michael Leaning, a UK-based AAA video game sound designer. Includes 41 Weaponiser presets and 23 Reformer Pro sound packs.
details: |-
  The Gore Library by SoundMorph is a complete collection of designed and source material audio files of bloody impacts, splatter, body impacts, bone-breaks, flesh rips, weapon impacts and further gruesome and gory sounds.

  Featuring 894 files, this collection offers a wide-ranging 2.72 GB (Weaponiser) and 2.3 GB (Reformer Pro) selection of royalty-free SFX components, ideal for any trailer, post-production, game-audio and sound design project.

  Gore's source material was created by SoundMorph in collaboration with Michael Leaning, a UK-based AAA video game sound designer whose credits include the Batman, Pirates of the Caribbean, Lord of the Rings and Harry Potter franchises. Krotos adapted this collection to work straight out of the box in two of its plugins.

  Sound categories included in this library: Weapon Impacts, Blood, Splatter, Crunch. Sound effect keywords: Weapon impacts (dry and wet), Blood, Body Impacts, Bone, Flesh Rips, Guts, Drips, Splatters, Head Explosions, Stabs, Bash, Blood Gurgle, Blood Spray, Blood Squelch, Bone Crunch, Bone Splinter, Giblet, Head Crush, Head Decapitate, Limb Chop, Limb Rip, Rip Flesh, Stab Large, Stab Small.
