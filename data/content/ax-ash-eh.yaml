details: |-
  Ax (pronounced ash-eh) brings epic music and latin american instruments
  together for the first time. The aim was to sample a Massive ensemble of
  powerful drums in a wet hall to create a Massive-sounding ensemble that will
  bring composers a new take on what epic soundtracks can be.

  With 81 instruments in total, divided in 5 categories (17 low surdos, 17 high
  surdos, 17 dobras, 15 caixas and 15 repiques), ax delivers a complete set of
  percussion that can fit perfectly in any large-size epic composition. Ax
  contains a gamma that covers the whole frequency spectrum, from roaring
  low-frequency surdos all the way to the massive high-frequency transients the
  repiques can produce when in ensemble.

  Ax comes with different mixes aimed to offer composers a wide amount of
  perspectives that can adapt to any need. From four independent mono spot mixes
  for a localised feeling, all the way to stereo mixes (close, mid, far and
  balanced) and even immersive mixes (180-degrees, 360-degrees, 360-degrees with
  presence and front) natively compatible with any speaker-array.

  The smart sequencer offers up to 16 different tracks that are completely
  assignable, muteable, soloable, clearable and randomisable. Every time you
  randomize a track (or the whole session), a completely musically-coherent
  rhythm will be generated, meaning it will always be usable with your music,
  and at the same time, it will always be unique. Once you're done creating your
  rhythm, you can save it as a MIDI file or you can even drag and drop it
  directly into your DAW, making your workflow straight and simple.

  Ax was recorded and mixed using ambisonics microphones, and created four
  immersive mixes that offer the perfect sensation of being right there with the
  percussion ensemble. Ax comes in stereo and ambisonics so it's compatible with
  any speaker array configuration.
