description: Despite an ocean of wonderful piano libraries available out there,
  we felt there was an important/useful flavor that is seldom explored.
details: |-
  All of the aged intra-note tuning was left completely alone but each note's
  pitch/velocity was centered by ear in kontakt. What you end up with is a
  collection of three distinct pianos that are perfectly suited for a variety of
  songwriting genres as well as more humble, cinematic contexts.

  In addition to the pianos, we've included auras atmospheric piano-sourced
  patches designed to gently support the main pianos. Piano percussion is a
  series of gentle/not-so-gentle hits great tool if you need an organic,
  rhythmic backdrop. Lastly, we've included ambient noise floor a simple,
  effective way to add warmth to your piano tracks.
specs: |-
  - Three distinct pianos
  - Aged intra-note tuning
  - Pitch/velocity centering in Kontakt
  - Auras atmospheric piano-sourced patches
  - Piano percussion hits
  - Ambient noise floor
  - Soundware for macOS and Windows
