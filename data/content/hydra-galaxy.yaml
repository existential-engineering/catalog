details: |-
  Hydra Galaxy is a sound pack for the hardware synth asm hydrasynth (keyboard
  and desktop model). The 80 patches are very well suited for all kinds of
  spherical electronic and pop music.

  This collection shows some possibilities of wavetable synthesis and can be
  stylistically classified between classic synth sounds and modern electronic
  sounds. There are many spherical rhythmic sounds, which are produced with the
  arpeggiator and the lfos.

  All 80 sounds are carefully designed and take advantage of the complete
  synthesis engine and the effects of the asm hydrasynth (os 1.4 or later). It's
  a good starting point for creating your own musical phrases and sequences.

  80 new programs for the asm hydrasynth keyboard and desktop available as bank
  file for the hydrasynth manager software. Pads, arpeggiator, fx, leads,
  comping sounds.

  Styles: electronic, ambient, techno, chill out, pop, retro, dance, cinematic.
specs: |-
  - Wavetable synthesis
  - Arpeggiator
  - LFOs
  - 80 patches
  - Bank file format for hydrasynth manager software
  - Compatible with asm hydrasynth keyboard and desktop models
  - Os 1.4 or later required
