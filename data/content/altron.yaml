details: |-
  Altron is a sample based synthesizer made by Beyron Audio from a producer's and artist's point of view. Altron comes with more than a 1000 ready sounds and new features such as the smart sequencer, Altron FX and q&t engine.

  Altron offers sounds for all types of music production. Every preset is designed and crafted with the producer in mind which results in less tweaking and more producing. Altron also comes with smart presets, such as arranger drums harmony instruments, and smart sequencer arranger, which will get your production inspiration fired up in no time.

  Altron's q&t (quality & technology) engine delivers hyper sound quality for beautiful results. Additionally, it automatically fine-tunes every instrument to sound its best. The q&t engine uses an equalizer, compressor, and a limiter to provide a crisp sound.

  With six sequencers running at the same time, you can create a whole band at your fingertips. The smart sequencer presets offer rhythmic melodies that can be manipulated by choice. Switch keys and smart sequencer generate chords that compliment each other. You can open 64 different smart sequencers and allow each one to play different instruments that are 100% customizable.

  Altron fx is a new generation sound designer packed with 22 special effects. You can easily transform different sounds to get spectacular results. Add an accent, effect or room tone to any instrument by adjusting the pre, size, dry, and wet controls. Altron works with multiple software and hardware thanks to nks.
specs: |-
  - Sample based synth
  - Kontakt player
  - Smart sequencer
  - Altron FX
  - Q&t engine
  - Six sequencers
  - 64 smart sequencers
  - 22 special effects
  - Equalizer
  - Compressor
  - Limiter
  - NKS support
  - macOS support
  - Windows support
