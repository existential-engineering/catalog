description: One-shot drum sample collection inspired by the sounds of chart-topping trap mixes. Contains 47 total samples in 44.1 kHz, 24-bit WAV format — 13 sub/808 samples, 10 hat samples, 10 kick samples, 10 snare samples, and 4 clap samples. Designed to add punch and consistency to trap and hip-hop productions, compatible with any DAW or sample triggering program.
details: |-
  The team at Drumforge assembled this collection of mix-ready one-shot drum samples to add texture and flavor to a song, taking its cue from the minimalistic approach of the trap genre.

  The 47 one-shots are aimed at cross-genre sound design, whether laying the foundation for a beat or reinforcing the textures of a trap or hip hop production. They cover sub and 808 samples, kicks, snares, hats, and claps.

  Drumshotz is a series of drum samples meant to enhance, blend, or replace drum sounds in a mix, and these can be mixed and matched with existing sample libraries or raw drum recordings.
