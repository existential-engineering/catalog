details: |-
  The Joey Sturgis Drumshotz Bundle combines two collections handcrafted by RIAA Certified record producer Joey Sturgis, designed to add depth, punch, and consistency to your tracks for metalcore, hardcore, and beyond.

  Drumshotz Joey Sturgis Fire Edition includes 57 high-quality samples in 48 kHz 24-bit WAV format, expertly mixed to cut through any mix. Includes 5 direct kick samples with room sounds, 5 direct snare samples, and 9 toms across various pitches. Samples are pre-blended for ease of use in any DAW or triggering program.

  Drumshotz Joey Sturgis features 68 total one-shot samples. Comes with 5 kick samples, 5 snare samples, and 7 toms, each with direct, overhead, and room variations.

  Purchase includes instant digital download, perpetual license, free lifetime updates, and unlimited customer support.
