details: |-
  6 Authentic feeling Gospel Quartet backing tracks for your bass jamming pleasure… Use these tracks to help you get a better feel for gospel quartet music. This pack includes a total of 12 mp3 files of the songs with and without Jermaine Morgan's bass take. Hear how he approaches these tracks, and then feel free to create your own approach. Use these tracks to enhance your YouTube, Facebook, and other platform performance videos. Live music arrangements all produced by Jermaine Morgan… featuring Jairus Hardge on drums. This bass jam-pack focuses on quartet styles influenced by artists such as The Canton Spirituals, The Pilgrim Jubilees, The Soul Stirrers, The Swanee Quintet, The Dixie Hummingbirds, The Jackson Southernaires, The Williams Brothers, The Gospel Keynotes, Paul Porter and the Christianaires, and many others who have contributed to the sound of Gospel Quartet.
