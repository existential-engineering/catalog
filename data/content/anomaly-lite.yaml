name: Anomaly LITE
manufacturer: gates
primaryCategory: sample-pack
categories:
  - sound-library
description: Anomaly LITE is a selection of sounds from anomaly vol. 1 intended
  to serve as a portable version of anomaly.
details: |-
  There are 7 folders of sounds: anomaly - dark places (55 sounds, 189 mb),
  anomaly - darkness (70 sounds, 243 mb), anomaly - disturbances (70 sounds, 233
  mb), anomaly - shadows (70 sounds, 237 mb), anomaly - spirits (50 sounds, 168
  mb), anomaly - voices (45 sounds, 211 mb), and anomaly - wasteland (60 sounds,
  181 mb), for a 1.43 gb soundset with 420 individual sounds as sfz/wav files.

  Presets are available for multiple instruments: anomaly vsti (420 instrument
  presets), wusik v6/v7 (420 instrument presets, also compatible with v8/v9 as
  legacy), synthmaster 2 (75 multi-sound presets), sforzando (420 instrument
  presets), kontakt v5.5.2 and higher (420 .nki instrument presets), and tx16wx
  (420 instrument presets).

  Anomaly lite could also be viewed as an introduction to the anomaly sounds.
  There is an upgrade path from anomaly lite to the full anomaly vol. 1.

  Audio demos are available.
specs: |-
  - Sfz and wav file format support
  - 420 individual sounds
  - 1.43 GB soundset
  - 7 folders of sounds
  - 420 instrument presets for anomaly vsti
  - 420 instrument presets for wusik v6/v7
  - 75 multi-sound presets for synthmaster 2
  - 420 instrument presets for sforzando
  - 420 .nki instrument presets for Kontakt v5.5.2 and higher
  - 420 instrument presets for tx16wx
  - Portable version of anomaly vol. 1
  - Upgrade path to full anomaly vol. 1
