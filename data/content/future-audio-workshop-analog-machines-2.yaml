description: Inspired by the warm, subby synths heard in tracks by Tyler, the
  Creator, KAYTRANADA, and Smino, the Analog Machines series brings analog
  character with a modern edge to your lowend.
details: |-
  Get the best of both worlds.

  Sound designer The 44th Floor recorded various classic vintage synths from his arsenal, like the Moog Opus 3 and Roland Juno, then imported and processed the samples in SubLab XL. The result is a collection of analog-inspired sounds with a modern edge.

  You'll get 20 presets and 18 samples that range from synthy, to punchy, to deep and growling sub sounds.

  Credits: This pack was designed by The 44th Floor.

  Once your purchase is complete, the pack will show up in your FAW account. Simply download the zip file and follow the instructions on how to import your new sounds into SubLab XL.
specs: |-
  - 20 presets and 18 samples for SubLab XL
  - Sampled from classic vintage synths including the Moog Opus 3 and Roland Juno
  - Samples recorded and processed in SubLab XL
  - Patches: Almost Like A G6, Boss, Cassette G Funk, Choly, Chromeo, Del Rey, Dominos, DX7 Fun, Ferris Bueller, Hypno Thump, Juice, Kitty, Knocker, Michigan, Mini Large Moog, Redlands, Stiff Juno Bounce, Sunset Drive, Wah Wah, West Coast Bass
  - Designed by The 44th Floor
  - Delivered as a downloadable zip file via your FAW account
