details: |-
  A bespoke drum kit performed by Abe Laboriel Jr. — best known as Sir Paul McCartney's touring drummer since 2001. Brand new recordings, expertly captured at the iconic Henson Studios, Los Angeles. A versatile selection of highly detailed single hits, offering complete control of the character of a groove across a wide dynamic range. 10 inspiring loop presets, each with variations and intricate fills, suited to a range of styles, including pop, soul, funk and rock.

  Originals Abe Laboriel Jr Drums requires the free Splice INSTRUMENT plugin to run.
specs: |-
  - 11 presets, including 10 loop presets with fills and variations
  - Up to 8 dynamic layers and 8 round robins
  - 3 mic signals: Close, Room, Hype (through an Overstayer 8755DM Stereo Modular Channel)
  - ~2.5GB
  - Recorded at Henson Studios, Los Angeles
  - Single hit controls: Expression, Dynamics, Reverb, Kick Level, Snare Level, Hi-hat Level, Snare Type
  - Loop controls: Expression, Dynamics, Reverb, EQ, Compression
  - Requires the free Splice INSTRUMENT plugin and a free Splice account
  - macOS 12 or later
  - Windows 10 or 11 (64-bit)
