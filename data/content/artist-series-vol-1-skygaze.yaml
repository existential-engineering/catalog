details: |-
  HelloSamples presents Artist Series Vol.1 - Skygaze, one of the most
  interesting musical projects in the underground circuit. His chameleonic sound
  floats between downtempo, ambient, hip-hop and future jazz, making his
  particular approach to beatmaking a complex, richly textured and highly
  seductive experience.

  Inside you will find a set of 430 one shots, 146 loops and multiple
  instruments and presets for ableton and maschine as well.

  A sound palette consisting of color-saturated drums, deep bass lines, silky
  e-pianos, driving synths, dusty percussions and other unusual fx and textures,
  makes it a very unique, versatile and fun to play library.

  Ableton live and ni maschine packs include all demo tracks arranged and
  pre-programmed through MIDI files, to be able to dissect and play around with
  each single sound in every composition.
