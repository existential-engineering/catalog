  set, each recorded with articulations and performed velocities.
details: |-
  Shoulder City is offered in three configurations: a Tom Package, a Cymbal Package, and a Complete Package that includes both the Tom Package and the Cymbal Package.

  The Tom Package ships as Kontakt instruments (full Kontakt 4 only) with a Kontakt multi holding the tom set in one instrument and a WAV file for each sample. Each tom was recorded with articulations and performed velocity. All toms are from a Dorsia kit, a set of three toms (high, mid, and low).

  The Cymbal Package ships as Kontakt instruments (full Kontakt 4 only) with a Kontakt multi holding the entire cymbal set in one instrument, a WAV file for each sample, and a Cubase drum map. Each cymbal was recorded with articulations and performed velocity.

  Recorded, edited and mixed by Joey Sturgis. All samples are a work of art created by Joey Sturgis. You may use these samples in a music, video, or film production. You may not sell these samples as a work of your own, nor sell them as a whole or in part within other libraries, sample sets, or products of any kind.
