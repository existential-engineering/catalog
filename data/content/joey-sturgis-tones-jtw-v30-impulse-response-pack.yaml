details: |-
  The world's first mix-ready guitar cabinet impulse collection. Get the tone you want to hear with only a few clicks of a mouse.

  Thirty mix-ready impulses sampled using some of the world's most stunning gear, captured by Joel Wanasek at JTW Recording and mixed by Joey Sturgis at The Foundation.

  Note: for Kemper compatibility, users are required to down-sample the WAV files to 44.1kHz, 16/24-bit in a DAW or via a sample rate conversion utility, and then run Cab Maker to reprocess for import.
