details: |-
  This disc is compatible with Orchestron and Panoptigon players. BRASS ENSEMBLE is an entirely NEW sound for the Orchestron. It's a composite of three different trombone recordings and two different trumpet recordings, all taken from the original Optigan/Orchestron master tapes, but never used back in the day! The trombones and trumpets are an octave apart, producing a nice rich brass section sound. Please excuse my awful playing here, which is just a quick noodle to demonstrate the sound! PLEASE NOTE: This disc WILL NOT play properly in an Optigan! They WILL play, but the sounds will NOT be mapped correctly to the keyboard- they will be mapped mostly haphazardly across the chord buttons. Please don't order this disc expecting to easily use it in an Optigan. Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility
