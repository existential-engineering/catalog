details: |-
  Aspect V1 is an all-in-one analyser/metering device for use in Ableton live.
  Clearly view your frequency spectrum of your audio and compare against 4
  target curves representing popular music genres.

  If your music spectrum is in the target that you selected, your music will
  sound great in every sound system.

  Features: spectrum analyser with target curves (edm, pop, rnb and hip-hop).
  Displays integrated lufs, true peak. Waveform display with horizontal and
  vertical zoom. Loudness targets. Phase correlation meter. Float window.

  Only works in ableton live with max installed.

  It requires ableton live v10.1 (minimum).
specs: |-
  - Spectrum analyser with target curves
  - Edm target curve
  - Pop target curve
  - Rnb target curve
  - Hip-hop target curve
  - Integrated lufs display
  - True peak display
  - Waveform display with horizontal zoom
  - Waveform display with vertical zoom
  - Loudness targets
  - Phase correlation meter
  - Float window
  - Requires Ableton live v10.1 minimum
  - Requires max installed
  - Works in Ableton live
compatibleWith:
  - ableton-live
  - max-for-live
