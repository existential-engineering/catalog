description: A free collection of 100 Bass, Lead, and Pluck presets for the Thorn synthesizer. All presets respond to modulation wheel and velocity, and are suitable for production in any modern electronic music genre.
details: |-
  Thorn Essentials is a collection of 100 Bass, Lead and Pluck sounds for Thorn. All presets respond to modulation wheel controller and velocity. The sounds can be used for production in any modern electronic music genre.

  Thorn Essentials is included in the Thorn factory library since version 1.2, free of charge. Requires Thorn version 1.0.6 or higher.
