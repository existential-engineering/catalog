description: A collection of 100 Bass, Lead and Pluck sounds for Thorn. All presets respond to the modulation wheel controller and velocity, and can be used for production in any modern electronic music genre.
details: |-
  Thorn Essentials is a collection of 100 Bass, Lead and Pluck sounds for Thorn. All presets respond to modulation wheel controller and velocity. The sounds can be used for production in any modern electronic music genre.

  No automation or external FX used, except for master limiter.

  Thorn Essentials Expansion is included in the factory library since version 1.2, free of charge.

  Note: in order to use Thorn Essentials Expansion, update Thorn to version 1.0.6 or higher.
specs: |-
  - 100 presets
  - Categories: Bass, Lead, Pluck
  - Responds to modulation wheel and velocity
  - Requires Thorn v1.0.6 or higher
  - Included in Thorn factory library since v1.2
