details: |-
  Truth Custom Black and Gold is a collection of exquisite sampled drums and cymbals, multi-sampled: 4 drums and 9 cymbals.

  The Drums Only package includes just the drums and no cymbals. The Cymbals Only package includes just the cymbals and no drums.

  Contents are Drumagog files (kick, snare, hi tom, low tom), Kontakt instruments (requiring full Kontakt 4+), a Kontakt multi holding the entire drum set in one instrument, a WAV file for each sample (328 files), and a Cubase drum map for use with the Kontakt multi. Each drum and cymbal was recorded with articulations and performed velocity.

  Recorded, edited and mixed by Joey Sturgis. Played by Eric Choi of We Came As Romans in 2010. All samples are a work of art created by Joey Sturgis. You may use these samples in a music, video, or film production. You may not sell these samples as a work of your own, nor sell them as a whole or in part within other libraries, sample sets, or products of any kind.
