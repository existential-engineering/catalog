details: |-
  Jason LaRocca is one of Hollywood's most in-demand score mixers, with credits across major motion pictures including Aquaman , Bad Boys for Life , Paddington , The Accountant , Godzilla: King of the Monsters and the Oscar-winning documentary Icarus . He has also mixed the music for some of the biggest video games ever made, including Fortnite , Cyberpunk 2077 , Assassin's Creed Valhalla , Call of Duty: Black Ops Cold War and God of War: Ragnarök , alongside television work on Black Mirror , Once Upon A Time and American Crime Story . He began as singer and guitarist of LA punk band The Briggs before moving into film scoring as an assistant to composer Mark Isham.

  This expansion pack blurs the line between the science and the art of engineering, crafted to heighten the emotion in your mix through the power of sonics. Included are his go-to signal chains when mixing the most iconic sound stages and famous orchestras across the world, with captures to bring more character to strings, brass and choir, and enhance the impact of epic orchestral percussion. Also captured are his mixing chains for hip-hop kicks, gritty drums and bass, right through to the vocal chains he uses for top recording artists.

  This expansion pack has a total of 98 captures.
