description: A comprehensive collection of squeaks, creaks, and eerie unsettling sounds for horror and post-production projects. The bundle combines two popular SoundBits libraries covering door and furniture squeaks, creaking leather, rubber and balloons, dry ice, disturbing metal, and more. Suitable for trailers, games, and sound design work.
details: |-
  The Unsettling Creaks & Squeaks Bundle by SoundBits provides a large collection of squeaks, creaks, and eerie unsettling sounds for your next horror project.

  Both of the popular SoundBits Unsettling Creaks & Squeaks libraries have been bundled together and fully adapted to bring this collection to you for a straight out-of-the-box workflow in Reformer Pro. Covering door and furniture squeaks, creaking leather, rubber and balloons, dry ice, disturbing metal, and much more, it gives a project that unpleasant and eerie character.

  Featuring 44 libraries and 707 files, this bundle offers a wide-ranging 2.26 GB selection of professionally designed and recorded royalty-free SFX components, ideal for any trailer, horror, post-production, game-audio, and sound design project.

  Sound categories included in this library: Leather Creaks, Wood Creaks, Dry Ice, Plastic. Sound effect keywords: Balloon Creaks, Door Creaks, Leather Creaks, Metal Creaks, Wood Creaks, Rubber Creaks, Plastic Bottle Creaks, Dry Ice Creaks and more.
specs: |-
