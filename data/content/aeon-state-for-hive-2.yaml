description: Aeon state, the fifth bank for u-he's hive 2 synthesizer soundset.
details: |-
  Aeon state is the fifth bank for u-he's hive 2 synthesizer, containing 107 presets and 108 unique wavetables. The wavetables vary in category and scope, from classical instruments like harps and flutes, to various formant sounds, talboxes, plucks, modulated leads, and morphing neurobasses.

  This library heavily explores the new filters implemented in hive since the last release, namely, the comb, verb, and dissonant filters, which sound absolutely gorgeous for pads. The soundset is suitable for any contemporary electronic and ambient music genres, including cinematic music.

  The soundset focuses on gorgeous sounding ethereal, vocalesque comb pads and cosmic soundscapes as well as hard hitting trance and neuro basses with blissful plucks and ttu's signature unique leads.

  All patches are volume normalized and won't clip with equal volume levels when scanning between presets. Modulation wheel destinations are included for most patches, and when appropriate, many patches also utilize velocity sensitivity.

  Patches are created in the latest version of hive 2. The expansion version includes a studio one project file of the audio showcase with over 50 live instances of hive 2 and dozens of embedded MIDI files.
specs: |-
  - 107 presets for hive 2
  - 108 unique wavetables
  - Comb filters
  - Verb filters
  - Dissonant filters
  - Modulation wheel destinations
  - Velocity sensitivity
  - Volume normalized patches
  - Studio one project file (expansion version)
  - MIDI files included (expansion version)
  - PDF installation instructions
