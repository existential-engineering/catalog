description: Meticulously recreated 808 subs from top tracks including DaBaby,
  Megan Thee Stallion, A$AP Ferg and more.
details: |-
  The sound of the 808 sub-bass is everywhere and the style is extremely varied, from smooth and punchy to crunchy and buzzy, long glides and short bumps.

  Ave Mcree, a.k.a. Traptendo, has painstakingly recreated some of the most distinct and memorable 808 sub-basses off tracks from DaBaby, Kendrick Lamar, Megan Thee Stallion, A$AP Ferg, Cardi B and Lil Pump.

  You get 17 hit worthy 808s to use straight out the box or make them yours in minutes. The pack was sound designed by Atlanta producer Ave Mcree, with instrumental sound demos by Prince The Producer.

  All of FAW's patch packs are NKS ready for Maschine and Komplete Kontrol. Once your purchase is complete, the pack will show up in your FAW account. Simply download the zip file and follow the instructions on how to import your new sounds into SubLab.
specs: |-
  - 17 patches for SubLab
  - Patch list: Cash Shit Sub, DNA, Flashing Lights, Floorseats, Foot Fungus Oshi, Here We Go Again, Inglorious Sub, Mac 10, Money, Movin, This is America, Ave's New Spinz 808, Save That, Slayerr, Slob On My Knob, Throw It Back, Suge (Yea Yea)
  - Sound designed by Ave Mcree (Traptendo)
  - NKS ready for Maschine and Komplete Kontrol
  - Delivered as a zip download from your FAW account
