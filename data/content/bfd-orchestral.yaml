description: BFD Orchestral is an expansion pack for bfd3, bfd eco and bfd2 that
  delivers a unique set of concert percussion to your sessions.
details: |-
  Bfd orchestral features a variety of orchestral bass drums, snares and hand
  cymbals alongside chromatically tuned timpani and concert chimes which are
  sampled over 1.5 octaves and perfect for unusual melodic lines.

  Other highlights include suspended cymbals with huge decays due to the lack of
  a stand to dampen vibrations.

  Bfd orchestral is recorded using carefully selected high-end equipment to
  capture the dynamics and sonic beauty of these instruments.

  All the sounds have the versatility to fit into all kinds of genres and mixes.
specs: |-
  - Expansion pack for bfd3, bfd eco and bfd2
  - Orchestral bass drums
  - Orchestral snares
  - Hand cymbals
  - Chromatically tuned timpani
  - Concert chimes
  - Chimes sampled over 1.5 octaves
  - Suspended cymbals
  - High-end recording equipment
  - Windows 7 or higher
  - Os x 10.6.8 or higher
  - Disk space: 11.7 GB (bfd3 version)
  - Disk space: 32 GB (bfd eco/bfd2 version)
  - Internet connection for download and authorization
