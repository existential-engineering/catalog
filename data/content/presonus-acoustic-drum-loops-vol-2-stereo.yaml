description: These live drum performances, recorded in a state-of-the-art studio
  with world-class microphones, are ready to use in stereo format.
details: |-
  Features: includes intros, verses, bridges, choruses, fills, endings, and
  alternate grooves. Each style contains multiple options or variants to choose
  from.

  Recorded in nashville, tn at downtown batterie by acclaimed session drummer
  tony morra.

  Includes seven sets of loops: acoustic/earthy (five styles), blues/reggae
  (three styles), country (three styles), jazz (five styles), metal (four
  styles), r&b/funk (nine styles), rock/pop (eight styles).
