details: |-
  Aaron Sprinkle is the producer and engineer behind some of the most revered alt-pop and rock records of the past two decades. He produced MxPx's debut Pokinatcha at nineteen, went on to helm five of Anberlin's seven albums, and was influential in breakthrough records from Acceptance, The Almost, Copeland, Demon Hunter and Thousand Foot Krutch. He continues to reinvent himself and progress creatively as both an artist and producer.

  Aaron created this pack exclusively for the ToneHub platform, capturing the variety of tones he has become known for. He went as far as sourcing the amps used on those earlier seminal records to ensure those tones are represented, while including the more modern cleans and classic crunch sounds he is chasing in his recent productions.

  Aaron's pack contains 48 captures.
