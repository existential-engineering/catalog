description: "Aaron Sprinkle is the producer and engineer behind some of the
  most revered alt-pop and rock records in the past two decades. Influential in
  the breakthrough albums from Anberlin, MXPX, Acceptance, and The Almost, Aaron
  Sprinkle continues to reinvent himself and creatively progress as both an
  artist and producer. Aaron Sprinkle has created an expansion pack exclusively
  for the ToneHub platform that perfectly captures the variety of tones he has
  become known for. Going as far as to source the amps used from those earlier
  seminal records to ensure those tones are represented in his pack, while
  including more modern cleans and classic crunch sounds he is chasing in his
  recent productions. This expansion pack has 48 presets."
