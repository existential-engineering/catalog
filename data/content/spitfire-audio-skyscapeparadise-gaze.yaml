details: |-
  Enter a world of ecstatic art rock, created with love in the Pacific Northwest. An entire shoegaze band in a sample library including guitars, bass, a drum set, and a collection of re-amped synthesizers and presets.

  Recorded to tape at deafening volumes through an array of ribbon microphones and the vintage Neve 8048 console at London Bridge Studios in Seattle, GAZE is everything you need to make your next futuristic rock record or distorted soundtrack.
specs: |-
  - 13 Main Guitar presets, 15 artist presets, plus bass and drums
  - 3 signals (D.I., Amp, Room)
  - Built-in Reverse, Envelope Follower, Distortion, Low Pass Filter, Reverb and four convolution spaces
  - Recorded to tape through a vintage Neve 8048 at London Bridge Studios, Seattle
  - 9.67GB file size
  - Kontakt Player version 5.8 or higher
  - Includes Kontakt Player (free download)
  - Spitfire Audio App required
