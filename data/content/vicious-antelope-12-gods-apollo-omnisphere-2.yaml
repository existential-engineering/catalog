details: |-
  12 gods: apollo is a 50 folk and ethnic patches soundbank for spectrasonics
  Omnisphere 2. Its sounds are a journey through myths, epithets and persons
  connected with the god of music according to the greek pantheon.

  All presets are based on plucked strings inspired by apollo's lyre. The
  presets are using the great omnisphere's soundsources as base to create folk
  sound colors with fast attack envelopes.

  Mandolins, saz and nylon guitars are the most used elements to achieve that.
  Mw is assigned to vibrato and aftertouch to pitch modulation.

  Patches were created with omnisphere 2.8 and run best with this or newer
  edition.
specs: |-
  - 50 folk and ethnic patches
  - Omnisphere 2 compatible
  - Plucked strings inspired by apollo's lyre
  - Fast attack envelopes
  - Mandolins, saz and nylon guitars elements
  - Mod wheel assigned to vibrato
  - Aftertouch assigned to pitch modulation
  - Omnisphere 2.8 or newer required
  - Software 2.8.4d
  - Soundsources v2.6.1c
  - Patches v2.8.1c
