details: |-
  Want to get started with impulse responses without shelling out for a full pack of IRs? Now you can.

  When JST recently visited Make Believe Studios, we sat down with Ryan Harvey, creator of the legendary SPRES impulse response, and walked through his process for capturing IRs. The result of this demonstration is available as a free download.
