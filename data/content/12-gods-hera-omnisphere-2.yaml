details: |-
  12 gods: hera is the second Omnisphere soundbank of "12 gods" series. It
  consists of 50 unique atmospheric sounds inspired by the queen of the greek
  gods.

  All patches are based on bowed string instruments, creating atmospheric
  cinematic tension and ancient soundcolors.

  When I create soundbanks for any synth I love to see each one as a full music
  album and each patch of the soundbank as a different song of that album. I
  believe this is what describes hera soundbank best.

  A sound journey through the mythological stories related to hera (or juno in
  the roman pantheon), her character, famous myths about her and her
  relationship with other gods.
