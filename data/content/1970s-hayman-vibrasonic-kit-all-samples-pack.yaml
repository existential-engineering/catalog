description: The 1970s hayman vibrasonic kit - all samples pack as mixed by
  stephen street (blur / the smiths) includes our multi-velocity pack, singles.
details: >-
  The 1970s hayman vibrasonic kit - all samples pack as mixed by stephen street
  (blur / the smiths) includes our multi-velocity pack, singles hits pack, drum
  replacement pack and samples from the kontakt 5 pack (but not the instrument).
  We include 14 different software patches and three different packs of wav
  samples.


  The particular kit we sampled is from around 1970 and was their standard five
  piece kit comprising of a 22" x 14" bass drum, 12" x 8" and 13" x 9" toms and
  a 16" x 16" floor tom. It's in a rather fetching metallic blue finish, though
  you might not be able to tell this from the samples.


  The snares that we sampled with this kit are two of the best ever produced...
  The metal shelled ludwig 400 and the wooden slingerland radio king. The
  cymbals used were all old sixties and seventies models commonly used at the
  time. The hihats were made by an english company called zyn. The ride we used
  is an old tosco 20" ride, thin and washy but with just enough ping to let
  rhythms cut through. The crash we used is made by paiste a swiss company, and
  this is an 18" medium from their popular 2002 range which was introduced in
  the 1970s.


  The multi-velocity and single hits packs contain 11 different patches allowing
  you to easily load up the samples. These packs use stereo mixed samples taken
  from a mix of the close microphone, overhead and room microphone. The samples
  come as 24-bit wavs although we also include 16-bit versions in the single
  hits pack. The multi-velocity pack contains 480 samples and the single hits
  pack contains 112 samples. The multi-velocity pack also includes over 800 MIDI
  loops.


  As a bonus we also include a large number of the samples from the kontakt 5
  pack (separate close, overhead and room mic samples) these are provided with
  up to 16 velocities of each articulation and 3 round robins and total 5094
  24-bit wav samples. Customers can build their own patches for their favourite
  samplers from these.
