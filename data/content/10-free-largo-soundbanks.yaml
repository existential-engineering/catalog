details: |-
  10 Free Largo Soundbanks by Sonic Sirius is soundware (samples or presets that
  load into other products) for macOS and Windows.

  The collection includes 10 soundsets: orbital resonance (2013, 128 presets),
  reaction hopi (2011, 128 presets), reaction sci-fi (2011, 128 presets), sonic
  sirius (2016, 128 presets), meteorology (2012, 81 presets), sonic wave (2014,
  128 presets), tone colors (2013, 128 presets), light wave (2013, 128 presets),
  digital sky (2013, 128 presets), and lingua (2015, 128 presets).

  All soundsets are created by che for the waldorf largo vsti and are available
  in soundbank (*.fxb) format.
