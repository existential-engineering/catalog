details: |-
  12 gods: poseidon for omnisphere 2 contains 50 dark sounding patches with lots of dark space. It is part of the 12 gods series, dedicated to the god of sea according to greek mythology.

  All sounds enclose pretty much deep tones for a sonic dimension through the seas. They are influenced by myths around poseidon and mythological characters who have connection with him.

  Main categories are the dark legato leads, the dark synths and the dark textures. On most of them there is a deep and gloomy reverb on the aux rack mimics the sound of the depths and it could be easily adjust the space you need by using the aux send or aux return faders in the fx page.

  The soundbank has a deep cinematic character and it is versatile for use in various genres especially when darkness is an important element for the overall feeling of the music.

  Please note: percussions included in the demo songs are not part of the soundbank. All other music produced with poseidon.
specs: |-
  - 50 dark sounding patches
  - Dark legato leads
  - Dark synths
  - Dark textures
  - Deep and gloomy reverb on aux rack
  - Aux send and aux return faders in fx page
  - Omnisphere 2 compatible
