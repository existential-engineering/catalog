details: |-
  Atelier series sasaki trumpet is a legato trumpet library performed by session
  musician and educator, mikio (miki) sasaki. Recorded at orb studios in austin,
  texas the goal was to create a responsive/snappy instrument full of energy,
  vibe and utility. One decision we made to help facilitate this goal was to
  record all of the material in a dry studio space. This way you have the option
  to really customize the sound before hitting it with your favorite reverb.

  Part of the character of a trumpet performance is attributed to the style and
  quality of vibrato. We asked miki to perform vibrato that could suit a variety
  of energetic contexts appropriately for each setup. We also recorded the
  legato in an "impulsive" fashion to capture transitions that are more
  contextually-relevant; suited for energetic lines with real movement.

  Wind instruments (certainly brass) tend to share changes in intonation
  depending on dynamics, range and difficulty of a passage. We've provided two
  variations of each patch to give composers the option to include performances
  with their natural, internal tuning intact. Lastly, we also recorded a
  wonderfully-emotive flugelhorn with an entirely different legato performance
  style and vibrato; suited for emotional and cinematic contexts.

  Patches include: workhorse, emotional flugel, cup mute, harmon no stem, harmon
  stem in, and playable runs.
specs: |-
  - Legato trumpet library
  - Flugelhorn library
  - Natural progressive vibrato
  - Three different mutes
  - Natural and tuned patch variations
  - Recorded dry
  - Adjustable reverb with custom hall impulse
  - Requires Kontakt 5.8.1 or higher
  - Free Kontakt player not supported
  - 48khz / 24-bit recording
  - 3.1 GB compressed ncw format
  - Pulse downloader delivery
