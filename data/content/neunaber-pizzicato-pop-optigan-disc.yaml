description: An Optigan disc featuring pizzicato string overdubs, a combined
  Hammond B3 and RMI Rocksichord keyboard sound, and drum/riff sound effects,
  recorded in 1970.
details: |-
  Pizzicato Pop is the latest in our series of excavations into the Optigan Archives in search of material that was left on the cutting room floor. The working title for this disc was "Contemporary #107". It was recorded in 1970 during the initial Optigan session in Cologne, Germany, with the pizzicato string overdubs being added sometime later. Previously only heard on the song "Hope In Your Eyes" by Optiganally Yours. The keyboard sound is also from the Optigan Archives - an experiment that combines a Hammond B3 with a hand-played tremolo on an RMI Rocksichord. Chords:

  Pop combo with pizzicato strings. Keys:

  Hammond B3 with RMI Rocksichord

  SFX:

  1 - Riff 01

  2 - Riff 02

  3 - Riff 03

  4 - Riff 04

  5 - Drums

  Mastered by Pea Hicks

  Disc design and mastering by Robert Becker

  Important Note:

