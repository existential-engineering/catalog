details: |-
  Designed to sound like a 2020 club banger, Big Drip will quickly take your
  vocals to the next level. Bespoke autotune settings coupled with futuristic
  reverbs, intricate delays and that high end EQ sheen you've been searching
  for.

  This preset is cross compatible with fl studio 20, logic pro x, ableton live
  10, pro tools 2020 and presonus studio one 5. Big drip utilizes the stock
  plugins that come with your music production software and a pitch correction
  plugin of your choice.

  You can use autotune (any version), nectar 3, waves tune real-time, mautopitch
  or logic pitch. We worked extremely hard to include preset files for all 5
  daws, 46 unique preset variants, designed for your unique setup.

  These presets are neatly organized into easy access folders so that it's
  simple to find the preset that's designed for your system.
specs: |-
  - Cross-compatible with fl studio 20, Logic Pro x, Ableton live 10, Pro Tools
  2020, and presonus studio one 5

  - Stock plugins from music production software

  - Pitch correction plugin support (autotune any version, nectar 3, waves tune
  real-time, mautopitch, logic pitch)

  - 46 unique preset variants

  - Bespoke autotune settings

  - Futuristic reverbs

  - Intricate delays

  - High end eq sheen

  - Organized preset folders

