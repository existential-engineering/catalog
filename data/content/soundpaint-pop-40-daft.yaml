details: |-
  Drum Up the Funk

  Get ready for some Dancing, Disco-like, Dynamic Duo Drums! Inspired by the drum kits of today's top 40 artists, Pop 40 Drums delivers the perfect blend of Electro, Dance, classic grooves, and modern flair to give you the tools you need to create your own chart-topping hits. Don't settle for bland pre-made loops that leave you and your audience feeling uninspired! It's time to level up your rhythm game with Pop 40 "post apoca-loop" beats! Unleash your creativity and customize the rhythm and flow to make the perfect beat. We keep the mapping simple and symmetrical across all Soundpaint drum kits, so it's easy to mix, match, and morph drums to your heart's content. Each program includes a pre-made ARP as an example of one style the preset could be used for. Customize the arp, play on top of it, or turn it off and get into all the details; there's no wrong way to get grooving.
