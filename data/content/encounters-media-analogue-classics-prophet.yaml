details: |-
  Analogue Classics: Prophet is a vps avenger expansion with retrovenger skin
  featuring a special collection of analog sounds for music projects. Inspired
  by legendary synths, it recreates the most typical and authentic analog sounds
  from prophet with luscious pads, power leads, detuning strings, and deep funky
  basses.

  Starting with 230 presets of pure emulated va sound with no sampling except
  for the drums, the expansion includes old vintage sounds with detuning and
  analog drift characteristics preserved from the original prophet synthesizer.

  The expansion includes 40 factory presets from the original prophet5, making
  use of the new avenger analog filters, plus bonus presets from the analogue
  classics legends expansions and famous sounds from known pop, rock and synth
  classics tagged with #fam, totaling 268 presets of pure unique analog sounds.

  Perfect for pop, rock, synthwave, new wave, electro, and dance music genres,
  the presets feature macros, aftertouch and mod wheel assignments with the
  included retrovenger skin.

  The product is compatible with macOS and Windows platforms.
specs: |-
  - Vps avenger expansion
  - 268 presets
  - Pure emulated va sound
  - No sampling except for drums
  - Detuning and analog drift
  - Prophet5 factory presets recreated
  - 40 factory presets from original prophet5
  - Avenger analog filters
  - Bonus presets from analogue classics legends expansions
  - Famous sounds from pop, rock and synth classics
  - Macros assigned presets
  - Aftertouch assigned presets
  - Mod wheel assigned presets
  - Retrovenger skin included
