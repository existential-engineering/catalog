details: |-
  Aeon is a collection of deeply-sampled melodic instruments, cutting-edge tonal loops, and epic one-shots for the modern composer. This virtual instrument collection combines orchestral, traditional, and ethnic instruments with analog and digital synths to add a unique sound and texture to any musical composition.

  The aeon collection is comprised of two products, aeon melodic and aeon rhythmic. The instrument is based on 10,000+ samples meticulously recorded using state-of-the-art equipment, resulting in 27+ gb of source material (compressed to 13gb on disk).

  Aeon rhythmic provides 330+ beat-sliced melodic loops that can be mixed and matched seamlessly to create complex layered melodic phrases. The included single loop presets offer detailed playback control for intuitive sound tweaking and re-composing.

  Aeon rhythmic by heavyocity is a virtual instrument audio plugin and a software application and soundware (samples or presets that load into other products) for macos and windows. It includes, and is therefore "powered by", kontakt player, which functions as an audio units plugin, a VST 3 plugin, an AAX plugin and a standalone application.
