details: |-
  Analogue ableton producer toolkit 2 is the follow up to the extremely popular original producer toolkit live pack. The analogue ableton series is designed so that the user has a highly usable suite of tools inspired and modelled on true outboard analogue hardware.

  The unmistakable sound of analogue is present in each one of the fifteen audio effect racks contained within this package.

  The compressor racks include: 2254r compressor modelled on the popular 2254r outboard compressor from neve, a-3630 compressor modelled on the workhorse 3630 compressor from alesis, l2 compressor modelled on the well known waves hardware compressor, msi 525 compressor modelled on a popular 500 series compressor, retro compressor modelled on a collection of outboard compressors built for abbey road, rnla7239 compressor modelled on fmr's flagship compressor, and smart c2 compressor modelled on the boutique smart research compressor.

  The filter and eq racks include: super band pass filter for analogue depth and character, analogue band pass filter with lush sound and character, analogue high pass filter designed for both producers and dj's, analogue low pass filter designed for both producers and dj's, analogue notch filter with analogue motion and character, depth filter full of character and motion, complex eq for detailed mixing and mastering duties, and lode star drums to transform drums with a unique rack.

  This pack requires a pc or mac running ableton live. The product has been tested on versions 7 and 8 without issue and is also fully compatible with ableton live 9.
