details: |-
  Acoustic Bass Premier G is the upright bass library for ni Kontakt full version. (not Kontakt player). The full energy of natural bass has been packed into 96 kHz samples without any artificial eqs.

  Easy to use with plenty of articulation, including arco in 3 types of recording variations.
specs: |-
  - 96khz/24-bit hi-res raw samples
  - 3 style variations (telefunken u47, rca 77dx, schoeps 221b)
  - Super natural legato
  - 6 articulations
  - 30 slide variation
  - Recording studio sampling reverb
  - Arco in 3 types of recording variations
  - Ni Kontakt full version (not Kontakt player)
