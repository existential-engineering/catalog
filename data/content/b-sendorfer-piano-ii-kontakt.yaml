details: |-
  The acustix bsendorfer piano is the result of the challenge to create a top-quality digital concert piano with breathtakingly rich and realistic sound, whose tonal precision and outstanding dynamic qualities rival those of a real, quality acoustic concert grand piano.

  The result is an awesome sampled piano with powerful bass, crystal clear mid-range and brilliant treble. This piano uses only 78 mb of carefully selected samples from a famous bsendorfer grand piano.

  This piano sounds extremely warm and lyrical in the lower velocities, full of body in the mid velocities and crystal clear in the fortes. This character makes the acustix bsendorfer piano perfectly suited for all kinds of music ranging from jazz to classical and pop music.

  The acustix bsendorfer piano is currently available in kontakt format (sfz and halion sample formats are available upon request).

  Important: this product is a non-player library and requires kontakt full version 5 or later (it may also work with earlier kontakt versions, so please test the trial version before buying). For kontakt version 5.6.8 or higher, non-player libraries (I.e. Libraries without a serial/activation protection), which cannot be used in kontakt player version) need to be loaded via the kontakt files tab.
