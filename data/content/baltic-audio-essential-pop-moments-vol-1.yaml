details: |-
  'Essential Pop Moments Vol 1' from baltic audio contains six construction kits for commercial Pop production, with real played and recorded guitars, basses, drums and synths.

  Each of the six construction kits has recorded and mixed instruments with its own sound.

  MIDI files are included for the majority of the musical phrases heard in most kits. The MIDI files can be combined with a sampler to trigger the key-tagged one-shots, or used with any synth or sampler.

  Unlooped tail WAV files are included, allowing a phrase to end with the decay of the reverb or delay applied to the loop, and dry and wet versions with filter, sidechain and reverb are provided for many wet files.
specs: |-
  - 6 Construction Kits tagged with the perfect Key/Scale
  - Perfectly premixed
  - Over 2.3 GB of content
  - 16 MIDI files
  - 78 One-Shots: Drums and FX included
  - 65 Tonal One-Shots: Real guitars, bass guitars, synths, tagged with Key/Chord
  - 205 WAV Tracks: DRY & WET versions for all important files included
  - Unlooped tails
  - 44.1 kHz/24-Bit WAV
  - PC/Mac Compatible
  - 100% Royalty-Free
