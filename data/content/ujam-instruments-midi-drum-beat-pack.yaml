details: |-
  Odd time signatures usually don't flow like typical 4/4 rhythms, but made well they tend to give a rather natural feel to a groove. This pack collects 34 MIDI files in odd meter styles that go with the Virtual Drummer and Beatmaker plug-ins. The files are not added to the plug-ins themselves: they are dragged from a folder into a DAW track. Each MIDI file contains 24 song parts, which is over 800 individually played drum parts in total.

  The styles cover 6/4 and 6/8 for the typical ballad, 3/4 time signatures for waltzes, jazzy 5/4 grooves, and 7/4 time signatures.

  Using templates in a DAW and sticking to old habits may speed up the production process, but changing up the rhythms from time to time helps venture into new creative realms. Select one of the ready-made styles and drag the MIDI into a DAW track.
