details: |-
  Andy James is a British guitarist and lead guitarist of Five Finger Death Punch, joining the band in 2020 and appearing on their ninth album AfterLife . Before that he spent years fronting the guitar-instructional world as a contributor to Lick Library and through his own Andy James Academy, and played in Sacred Mother Tongue and Fields of the Nephilim. He has released five solo albums and has a signature model with B.C. Rich.

  Built around six of Andy's dream guitar amp, cab and pedal setups, this signature collection caters for all his playing styles.

  Andy's personal bundle contains 31 captures.
