details: |-
  Fingerpicked acoustic guitar library as VST and for kontakt 5 and hise. The guitar is a richwood a-20: sampled range is from d1 to e4, sampling is done for each string until the note of the next string is reached, so there are no recordings of every single note of every string.

  Soft and hard dynamics for every note and interval. 5 percussion samples with 6 round robins each. Chord change/sliding noise with 21 round robins. Power chord slaps from d1 to d2 with both soft and hard dynamic layers and 2 round robins.

  When the power slap keyswitch is held down they keyboard range where it is playable will change color. Release samples for every note with 2 round robins: release samples can only trigger if release time is set to 250ms or lower. Harmonics in range d2 to g4 with 2 round robins.

  12-string guitar simulation mode, in octaves up to the high e string. From there it turns into unison. When this option is enabled the script will add a 25ms audio delay to give it time to analyze the MIDI notes. If a major 3rd, minor 3rd, 4th or 5th interval is played on the d string and above, a real sample of that interval will be played instead of two individual notes.

  The standalone ag-20 VST dll requires a 64-bit computer (x64). Kontakt 5 instrument requires full version of kontakt 5.8+. Hise instrument was built with hise 2.0 build 650 (see instrument source code on github). Size information: 497 samples. Kontakt: 407 mb size on disk. VST: 170 mb samples, 11.4 mb VST.
