description: Conquer All Volume III is a guitar cabinet impulse response pack
  built from three unique setups with 24 IRs each. It includes EQ'd, raw and
  Kemper-compatible impulse responses.
details: |-
  Looking to inject some edge into your existing guitar tones? Maybe you want to expand your tone into heavier territory. The cab and microphone typically make up 50% of your guitar tone, and that is where IRs come in.

  Conquer All Volume III includes EQ'd and raw IRs as well as Kemper compatible IRs. There are 3 unique setups with 24 IRs for each setup.

  You must have an impulse response loader or Toneforge to use this product.
