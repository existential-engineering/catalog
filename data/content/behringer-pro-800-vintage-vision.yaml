name: Behringer Pro-800 Vintage Vision
manufacturer: app-sound
primaryCategory: preset-pack
url: https://www.app-sound.com/behringer/
description: Vintage vision is a sound pack with 70 new brilliant preset patches
  for the behringer pro-800.
details: |-
  The presets have been programmed by two veteran programmers. With vintage
  vision they celebrate their first team work: christian gritzner and matthias
  sauer. Chris is an experienced sound designer who has already created several
  sound sets for the well-known german company waldorf. Matthias started with
  the sci prophet 600 (back in the late 80ies) and created numerous sounds for
  yamaha, roland, korg and other companies.

  Vintage vision is full of analog basses, pads, leads, and much more. Sounds
  that seem to come from vintage times but the also build a bridge to the needs
  of modern composition.

  Styles: retro, ambient, cinematic, lounge, pop, funk, rock, progock, chillout,
  classical, electronic, idm, jazz, trance, and others.
specs: |-
  - 70 sound presets
  - Modwheel assignment
  - Aftertouch assignment
  - Over 50 MIDI phrases
  - Over 10 bonus demo phrases
