details: |-
  100 tastes is a unique soundbank for Massive x. It consists of 100 long pads
  and soundscapes with a plethora of sound characteristics and it is rich of
  modulation options.

  For most of presets mw is changing gradually the pitch of the oscillators.
  Also most of them have aftertouch options to add more interesting sonic
  dimensions.

  It is a great pack for its musically pads but also for background soundcapes
  for your techno or cinematic productions.

  Presets were designed with massive x 1.3.5 (r238).
specs: |-
  - 100 long pads and soundscapes
  - Modulation options
  - Mw (mod wheel) pitch control of oscillators
  - Aftertouch options
  - Designed for Massive x 1.3.5 (r238)
