details: |-
  This template allows you to apply sidechain effects to all tracks routed to
  the master track, except the tracks you choose, such as the kick and the bass.

  The idea of this template came from an infected mushroom video in which they
  explained that in their songs, when the kick sounds, they apply low cut eq to
  all the tracks except the kick and the bass.

  Take this template as an example and customize it according to your needs.
specs: |-
  - Sidechain effects
  - Low cut EQ
  - Master track routing
  - Track selection exclusion
  - Ableton live template
