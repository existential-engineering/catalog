description: Bass Drones is a collection of deep and droning basses inspired by
  ambient, noise and drone music.
details: |-
  Expect to find sounds mangled and morphed from everything from vintage
  analogue synths to acoustic instruments like trumpet and church organ.

  The 97 patches comes split into 4 categories: "long" for long sustaining
  basses. "short" for short stabs, hits and strikes. "atonal" for noisy
  non-tonal drones. "bonus pads" for 5 pads made from the sample material.

  Easily tweak the sounds using the fast and simple interface that provides
  filters, an envelope and a sub-oscillator.
specs: |-
  - 97 patches
  - 4 patch categories
  - Filters
  - Envelope
  - Sub-oscillator
  - macOS compatible
  - Windows compatible
