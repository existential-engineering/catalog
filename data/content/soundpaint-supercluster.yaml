details: |-
  True Sounds of the Universe. Imagine having all the ambient sounds from space at your fingertips. Create music with the true electro-magnetic recordings of asteroids, moons, planets, suns and nebulas. Be inspired by the musicality of cryo vulcans, background radiation, rocket engines and exo-planets. Since the dawn of mankind, humans have looked up to the stars, wondered about the universe and everything it encompasses. Be inspired by the sounds of Supercluster to write something larger than life. Make music with a lone asteroid while the drone of a nebula flows behind. Write with the beautiful ambience emitted by the core of our galaxy, enhanced by the strange howling voices of our little moon. Counterpoint the roaring flares of red giants and the desolate hum of a white dwarf. Compose with the planets, Jupiter, Neptune, and Venus, hear them sing as you combine their eery atmospheres with the haunting harmonies of solar winds. Let the sounds of the universe guide and influence your music to create something remarkable.
