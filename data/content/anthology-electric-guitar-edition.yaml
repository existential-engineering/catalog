details: |-
  Anthology electric guitar edition is a collaboration between george of your
  local musician and battl beats. Think of this pack as a utility that will
  allow you to create custom chord progressions from scratch and always stay in
  key.

  This pack will help music producers, beatmakers, and artists to create
  electric guitar chord progressions quickly and easily, if you don't know much
  or if anything about music theory, using anthology is an easy way to learn
  what chords fit into what key by using this pack to build the foundation of
  your instrumental, you will never go out of key again.

  What's included in anthology: 2000+ chords arranged into key, 100+ guitar
  loops, 20 pre-composed chord progressions, and a free instructional ebook.
