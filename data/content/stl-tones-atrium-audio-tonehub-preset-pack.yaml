details: |-
  Carson Slovak and Grant McFarland of Atrium Audio are a production duo known for their consistent quality output, particularly in the rock and metal genres. Their credits include August Burns Red, ERRA, Lorna Shore, Polaris, Rivers of Nihil, Black Crown Initiate, From Ashes To New and Texas In July, alongside veteran rock acts Everclear, Live and Candlebox. They produced, engineered and mixed August Burns Red's Grammy-nominated Found In Far Away Places and Phantom Anthem .

  Using many of the duo's go-to guitar amp, cab and pedal setups, this signature collection showcases virtually all of their rhythm, lead, clean and bass guitar recording setups that have been used on most of their records.

  The Atrium Audio Producer Pack contains 97 guitar captures and 3 bass captures.
