details: |-
  Welcome to the AXXESS - Cinematic Expansion Pack, a set of 40 meticulously crafted Cinematic patches designed exclusively for the GForce AXXESS synth. Explore a diverse sonic landscape ranging from Fat Low-End Analogue Bass to Lush Dreamy Pads.

  Discover the hidden depths within the simplicity of AXXESS with this patch collection. While AXXESS may appear straightforward, its sonic possibilities extend far beyond initial impressions, and this patch set is crafted to enhance the inherent versatility of the instrument, proving that a synth doesn't need complexity to be both great and impactful.

  AXXESS stands as a testament to the belief that simplicity can coexist with depth: analogue richness and a fat, full sound delivered without the complexity often associated with most synthesizers. This collection complements AXXESS's intuitive design by introducing a range of patches that unlock a world of sonic potential.

  The AXXESS Cinematic Expansion Pack is only available to registered users of GForce AXXESS, and is exclusively available via the GForce website as a direct download via 'My Instruments' once the purchase has been completed.
specs: |-
  - 40 Cinematic patches
  - 14 Pads patches
  - 8 Sequences patches
  - 5 Textures patches
  - 5 Arpegs patches
  - 3 Leads patches
  - 3 Basses patches
  - 2 Keys patches
  - Requires a registered installation of GForce AXXESS
