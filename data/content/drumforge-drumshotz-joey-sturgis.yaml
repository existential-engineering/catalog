description: One-shot drum samples from RIAA certified metalcore producer Joey Sturgis, each drum captured direct, overhead, and in the room, pre-blended and normalized.
details: |-
  Drumshotz Joey Sturgis is a signature one-shot drum sample collection from RIAA certified record producer Joey Sturgis, whose credits include Asking Alexandria, Of Mice & Men, and The Devil Wears Prada. He has spent over 20 years at the front of competitive drum sounds in metalcore and hardcore.

  Each drum is captured on three mic positions rather than one: 5 direct kick samples with matching overhead and room samples, 5 direct snare samples with matching overhead and room samples, and 7 toms across high, mid, and floor positions with direct, overhead, and room versions. All samples come both separated and pre-blended by Sturgis.

  All 68 samples are normalized and delivered as 24-bit / 48 kHz WAV files for use with any drum triggering program or DAW.
specs: |-
  - 68 one-shot drum samples total
  - 24-bit / 48 kHz WAV format
  - 5 direct kick samples with matching overhead and room samples
  - 5 direct snare samples with matching overhead and room samples
  - 7 toms covering high, mid, and floor positions with direct, overhead, and room samples
  - Samples supplied both separated and pre-blended by Joey Sturgis
  - Pre-blended and normalized
  - For use with any triggering program or DAW
