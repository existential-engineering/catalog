description: A set of five MIDI-based chord loop movements for MIDIculous, with
  audio and per-instrument MIDI tracks that can be transposed, slowed, and
  isolated for learning.
details: |-
  Get a boost of chords with our 5 LMS loop movements. Each part is broken down by specific MIDI channel so you can learn each section individually. Change the key color per channel so you can see both parts on the keyboard at the same time and in different colors. Each key is programmed and you are able to set the desired key and speed so that you can learn with ease. There are no lesson with these, rather it is designed to just give you new chords and inspiration. Don't worry, with MIDIculous, the chords are easy to rip.
