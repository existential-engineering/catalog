details: |-
  BFD Wooden Snares is a collection of premium wood-shell snare drums for bfd3.
  Wood shells are desired for their warm, fat and round sound and we've selected
  five beautiful examples for their emblematic character. Chosen for their
  variety of materials, shell thickness and depth, these snares offer a wide
  array of sounds which are perfect for metal, hard-rock, rock, pop, funk, jazz
  and other genres.

  Each snare was painstakingly captured with wires on and off, and all are
  delivered in natural and processed versions. These snares are mix-ready,
  inspiring, and ideal for your next project.

  Each snare drum was recorded with 2 top mics, 1 bottom mic and 1 side mic,
  along with mono room, room, and far room ambience channels. 2 stereo reverb
  channels were added for creative and gratifying mixing options.

  From maple to cherry, elm to walnut, these wooden snares are full of character
  offering warm sounds that sit beautifully in the mix. Manipulate the natural
  recordings to your liking and dial in the room - or choose a processed,
  mix-ready version to emphasize the transient attack of the snare, for cutting
  through dense walls of guitars, as well as added oomph for crisp snare rolls.
specs: |-
