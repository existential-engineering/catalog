  - Wires on and off recordings
  - Natural and processed versions
  - 6 versions per snare - natural & 2 processed variations with wires on & off
  - 2 top mics, 1 bottom mic, 1 side mic per snare
  - Mono room, room, and far room ambience channels
  - 2 stereo reverb channels
