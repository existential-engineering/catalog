details: |-
  Jon Deiley is a founding member, lead guitarist and core songwriter of Australian metalcore band Northlane. He has played on and written every Northlane record from Discoveries and Singularity through Node , Mesmer , Alien and Obsidian , with the band taking the ARIA Award for Best Hard Rock or Heavy Metal Album three times. He also co-produced Alien and Obsidian .

  Built around five of Jon's go-to guitar amp, cab and pedal setups, this signature collection covers all of his playing styles, whether in the studio or for live shows.

  Jon's pack contains 87 captures.
