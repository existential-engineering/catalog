details: |-
  BFD Remix is a geist expander that provides high-quality drum samples, kits,
  engines and patterns derived from FXpansion's bfd2 acoustic drum software. The
  sounds combine pristine acoustic drums with varied FX treatments to offer
  everything from subtle drumkits suitable for further sculpting to huge
  effected presets that tear through a mix.

  Bfd remix's sounds are carefully selected from fxpansion's bfd2 factory
  library, mixed down and ready to use in geist2 and geist. The wide variety of
  kicks, snares, toms, hihats and cymbals were originally recorded at air
  studios in london through elite studio gear.

  Alongside the raw wav-format samples, geist-format kits, engines and patterns,
  bfd remix also contains a large selection of rx2 loops provided both dry and
  recorded through an array of high-quality outboard processing.

  Loops are pre-sliced and classified in geist2 so it's easy to mix and match
  elements between them and the included kits and engines feature extensive
  creative processing setups within geist2.

  The samples in bfd remix can also be used in any software that supports wav
  and rex2 format samples.
specs: |-
  - Geist expander
  - Wav-format samples
  - Rex2 format samples
  - Geist-format kits
  - Geist-format engines
  - Geist-format patterns
  - 26 layered drum pad presets
  - 200 individual wav samples
  - 166 rx2 loops
  - 6 full preset files
  - 15 engine files
  - 4 kits
  - 11 pattern banks
  - 10 swing templates
  - Pre-sliced loops
  - Classified loops for geist2
  - Creative processing setups
  - macOS compatible
  - Windows compatible
