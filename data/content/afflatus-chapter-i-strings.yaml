details: |-
  Inspired by film and classical music icons this collection pushes the boundaries of traditional sampling methods by introducing revolutionary features like auto divisi combined with polyphonic true legato from the next generation choir series and a thematic approach towards playing techniques.

  Capturing conducted musical samples as opposed to static generic samples afflatus chapter I features several custom-made articulation groups able to portray one specific style per group with ease. This approach grants the user highly specialized and inspiring virtual instruments able to perform music with virtuosity: gone are the days of soulless samples.

  The styles/moods featured in afflatus chapter I range from classical to modern contemporary film scores. Some of the masters which inspired the development of this collection are henry mancini, sergei prokofiev, bernard herrmann, john williams and arvo prt.

  Expertly tailored thematic ensembles suitable for contemporary to golden age style film soundtracks, tv, videogame and pop music.

  Afflatus chapter I strings by strezov sampling is a virtual instrument audio plugin and a software application and soundware (samples or presets that load into other products) for macos and windows. It includes, and is therefore "powered by", kontakt player, which functions as an audio units plugin, a VST 3 plugin, an AAX plugin and a standalone application.
specs: |-
  - Auto divisi

  - Polyphonic true legato

  - Thematic approach towards playing techniques

  - Custom-made articulation groups

  - 25 polyphonic true legato bowings

  - Over 150 different playable articulations

  - Playable aleatoric articulations

  - Three microphone positions (close, decca, hall)

  - Custom organic sound design section with separate mixable elements

  - Various sizes of different string and mixed ensembles (40 players to chamber to quartet)

  - Powered by native instrument's free kontakt player

  - Nks compatible





  - Macos and windows
