description: A door and portal sound effects library covering medieval stone doors and contraptions through to science-fiction doors and teleporters, with 50 Weaponiser presets for fast results.
details: |-
  SoundMorph's Portals sound effects pack has been adapted for use with Weaponiser in this library. Krotos collaborated with SoundMorph to formulate powerful door sounds that are rich with detail and ready to be used out of the box, or customised to your heart's content.

  With 50 presets of various door types including everything from medieval stone doors and contraptions through to science fiction doors and portals, the library gives you highly customisable sounds ready to slot into your projects. Have fun designing castles, spaceships, portals and trap doors ready to be used within your film, TV, video game and podcast projects.

  Portals is a designed and source-recorded door opening and closing collection that gives you the freedom to craft your own door layers or use one of the high quality designed door files to start with, or simply drag and drop into your next game, film or media project. With a focus on sci-fi, medieval, metal and contraption type doors, it is a resource to add to your toolbox.

  Sound categories included in this library: Source Doors, Designed Doors, Medieval Doors, Sci-Fi Doors, Stone Doors and Teleport Doors.

  The purchase contains two downloads: a zip file with all source sound effect asset files plus a metadata PDF, and an installer for the integrated Weaponiser library including assets and presets (iLok is required for the integration installers).
specs: |-
