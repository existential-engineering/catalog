details: |-
  Developed in 1985, the 727 is the latin percussion version of the 707 and is the perfect add-on to any drum machine or sample collection.

  Like the other tr series, it has defined various genres of dance music with its instantly nostalgic congas, agogos, bongos, timbales, cabasas, whistles & more.

  All original 727 sounds, unprocessed and un-pitched, are included. Every drum hit has been additionally re-pitched 30 semi-tones on tape.

  Ableton includes 1 master drum rack with all samples, with hardware pitch and hardware flam macros; 2 drum racks containing 10 pre-made kits.

  Kontakt, logic & reason include: 40 total instruments: 36 individual hit instruments + 4 kit instruments containing 10 pre-made kits.
