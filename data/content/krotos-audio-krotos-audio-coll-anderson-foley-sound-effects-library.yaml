description: A Reformer Pro Foley library by Coll Anderson offering rocks, snow, metal, ice and vintage gun Foley for designing, automating and performing sound in real time.
details: |-
  Provided by Coll Anderson. The Coll Anderson Foley library by Krotos and Coll Anderson offers a diverse range of Foley effects including rocks, snow, metal, ice and gun Foley, optimised for designing, automating and performing sound in real-time using Reformer Pro.

  It is a versatile addition to any core library and a jumping-off point for designing unique SFX. The collection offers a wide-ranging 2.4 GB selection of professionally designed and recorded royalty-free SFX components, ideal for any Foley, post-production, game-audio and sound design project.

  The library was carefully optimised to interact seamlessly with Reformer Pro, a plugin that transforms pre-recorded audio files into performable sound effect libraries in real-time via a microphone, input audio file or MIDI controller.

  Sound categories included are fire, snow, rocks and vintage gun Foley, with keywords covering fire, fire movement, gunpowder, gunpowder fuse, ice, ice crack movement, metal, resonant, ring, water, plastic, rubber, water movement, cellophane plastic movement, rocks, organic rock movement, rock vibrations, gun Foley, old gun, old pistol, old revolver, old rifle, old shotgun, snow crunch, snow movement, snow running Foley and snow walking Foley.

  This library does not require a special iLok licence or any licence key to use outside Reformer Pro. A Reformer Pro licence is needed to use it within the plugin. The purchase contains two downloads: a zip file with all source sound effect asset files plus a Metadata PDF, and an installer for the integrated Reformer Pro library.
specs: |-
  - 271 sound files
  - 2.39 GB size
  - 96 and 192 kHz high-quality WAV files
  - 100% royalty-free commercial licence
  - Embedded metadata
  - 26 Reformer Pro sound packs
  - No iLok licence or licence key required to use the library outside Reformer Pro
