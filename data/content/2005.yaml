details: |-
  2005 is a largely thor-based refill for reason versions 4 and 5, and is part of the historical refill series, a set based on the instruments used to top the charts over the last 30 years.

  Includes 134 foundation patches - each instrument used in a combinator is also saved separately to make it easier for you to customize and use them in entirely different ways.

  191 fully programmed combinator patches: 123 tweaked to match the sounds of the time period, and 68 "experiment" patches that expand upon these instruments.

  25 effects - rv7000 and scream.

  6 kong drum kits, and 52 individual kong drums, plus 43 24-bit samples of thor-based percussion for use in the nn-nano and other samplers.
specs: |-
  - Thor-based refill
  - Reason versions 4 and 5 compatible
  - 134 foundation patches
  - 191 fully programmed combinator patches
  - 25 effects (rv7000 and scream)
  - 6 kong drum kits
  - 52 individual kong drums
  - 43 24-bit samples of thor-based percussion
  - Nn-nano sampler compatible
