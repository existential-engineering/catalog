description: A supernatural production toolkit from sound designer Joey Doherty, known for his work on combat horror zombie games. 225 royalty-free 24-bit WAV elements covering atmospheres, risers, impacts, bass and synth one-shots, chord and synth loops, plus 25 Serum presets and 25 bonus MIDI files.
details: |-
  Dark Aether is a supernatural toolkit for producers, mixers, and musicians who want otherworldly, haunting, and tension-filled elements in their tracks. It was created by Joey Doherty, known for his work on combat horror zombie games such as Call of Duty, and suits metal, rock, electronic, and cinematic productions.

  The collection covers atmospheres for instant tension and dread, dimensional risers that build anticipation, bass one-shots for low-end weight, impacts for punctuation, chord loops that establish haunting harmonic foundations, synth loops for hypnotic movement, and synth one-shots for supernatural tonal elements.

  Alongside the audio, the pack ships 25 Serum presets as experimental sound design templates and 25 bonus MIDI files for creative flexibility.

  Everything is designed for use in any DAW and is completely royalty free, with no subscription: it is bought once and owned permanently.
