description: Daydream is an intimate release that includes four instruments
  geared towards emotional, ethereal contexts.
details: |-
  We also recorded a crossfade-able, arrhythmic soft sustains performance patch.
  With the modwheel down, the ebbing of notes is spacious and subtle. As you
  crossfade up, the ebbing grows with a touch more urgency and dynamics.

  Also included is recollections; a designed, organic, quietly percolating
  instrument using arrhythmic piano recordings as source material.

  Finally the ether violin, which utilizes recordings of real auto-panned soft
  tremolo performances captured "in-camera". This involved using a pair of
  stereo mics while the player physically leaned left/right at various speeds
  while performing the tremolo.

  Patches included: cozy piano, ether violin, recollections, and drifting.
specs: |-
  - Requires full retail version of Kontakt 5.8.1 or higher
  - Free Kontakt player not supported
  - Recorded in 48khz / 24-bit
  - 843 MB compressed ncw format
  - Receive watermarked product by connect downloader
  - Full sustains recorded pedal down with release triggers
  - Performed very soft (pianissimo range)
  - Subtle pedal up samples
  - True physical autopanning solo violin soft tremolos
  - Soft, arrhythmic successive sustains piano patch
  - Designed arrhythmic, organic texture patch
  - Adjustable reverb of custom hall impulse
