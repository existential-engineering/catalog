details: |-
  Albion ii - loegria is designed as a stand-alone tool, and everything you would need to write beautiful and esoteric film scores out-of-the-box. It features an incredible chamber sized string group of the first call session players in the uk, designed as high and low ensembles with spitfire's mic mixing ability.

  Everything is recorded at air-studios lyndhurst hall through the finest and rarest vintage valve and ribbon mics onto 2" tape. Every patch is available with four way mic control and all shorts patches work with the newly enriched "ostinatum" v3 gadget. The strings sound-set features a comprehensive selection of additional techniques including tremolando patches, trills, harmonics, flautando, light col legno and a variety of shorts patches.

  The loegria chamber band includes a full section with duplicated full longs and legatos with a smaller 'half section' sized band. With the 4-way mic control the sound is very adaptable and the smaller section is better suited to independent scores, period pieces, romance and comedy, not to mention vocal accompaniment - pop tracks and alike.

  Byron beats provides a comprehensive selection of rhythm loops inspired by a popular keyboard instrument from the 60s and 70s. Recorded 'vintage style' through a rare cadac desk, these loops feature both the original full bandwidth analogue recordings and also 'vintage' versions whose signal path includes a line mixer owned and used by jimi hendrix. These loops and patterns are designed to tempo lock with your host.

  Darwin percussion offers a selection of cinematic drums with 5 round robins, 5 dynamic layers and more hits. Patches have been recorded and edited in both "tight" and "loose" versions which give a sense of manpower behind the recordings. Fenton reversals are a selection of reverses derived from the albion range and locked into your host tempo with mod wheel dynamic cross fade control.
