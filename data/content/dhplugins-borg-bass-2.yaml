details: |-
  Fully updated for HALO-2. Featuring over 60 Presets and 35 Sample Banks of devastating hi-tech bass and synth sounds fresh from the 24th century, redesigned for the new features of HALO-2.

  Expect mangled mechanical madness, killer cybernetic basses, subs, reeses, stabs and more.

  Create totally new sounds by easily applying complex modulations and macros, or swap out sample maps for countless variations. Hit the random button for instant original inspiration and modulation ideas. Easily design custom distortions to drive your sounds to the limit and beyond.

  All presets have been crafted using the full breadth of HALO's unique functionality. Using a range of hardware and software synthesisers, both digital and analogue sound sources and fx and processing, the sample banks were put together to create re-sampled audio for each expansion, and every expansion has its own character and qualities.
specs: |-
  - Over 60 presets
  - 35 sample banks
  - Updated for HALO-2
  - Sample map swapping for preset variations
  - Complex modulation and macro assignments
  - Random button for modulation and patch ideas
  - Custom distortion design
  - Requires HALO (full version); does not work with HALO LITE
