description: ArcWave is a granular re-synthesiser that uses samples in place of
  oscillators allowing very diverse waveform generation from virtually any
  conceivable sound source.
details: |-
  An auto gain limiter is placed at the output of the granular engine allowing you to brick wall the waveform output before entering the filter stage. Filter one is a variable multimode filter consisting of a resonant low pass - band pass - high pass design with variable two or four pole slope, the filter shape and tone is enhanced with the use of an envelope generator as well as key and velocity via MIDI. In addition to having adsr control over the filter the waveform output can also play a part in shaping the contour of the sound.

  Filter two is a slightly more conventional filter consisting of a switchable 1 - 2 - 3 or 4 pole low pass design with resonance, again the filter can be influenced via the eg and MIDI. Bolted in-between the filters is the lfo modulation, when the lfo waveform is positive it can lift the cutoff of filter one, as the waveform goes into its negative phase it can lift the cutoff of filter two, this produces a gentle or not so gentle sweep of the filters, breathing even more life to the sound.

  Atmospheara is the effects section of arcwave using a quad signal path to process the sound. After the two independent waveforms have been processed via the filters and envelope generators they are passed over to atmospheara to add a bit of swirly ambient space. The waveforms first visit the modulated lfo filter banks, these consist of 32 band pass filters, the filter banks can be bypassed, modulated or left static. The signal is then sent to the delay/flanger and the reverb processor, with control over wave balance, dry/wet path and high and low cutoff filters.

  A stereo input and output version of atmospheara is included with arcwave, this can be used as a send or insert effect in your DAW. Atmospheara is also useful as a stand-alone loop processor, the band pass filters and compressor/limiter can dramatically change beats and loops, and by using the high and low filters you can add ambience to a limited range of the spectrum.
