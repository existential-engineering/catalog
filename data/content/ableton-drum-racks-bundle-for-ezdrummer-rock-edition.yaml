details: |-
  Ableton Drum Racks Bundle for ezDrummer Rock Edition is a collection of
  ezdrummer pop performance drum racks on Ableton push featuring over 100
  Ableton drum racks and over 30 Ableton live routing templates configured for
  leading toontrack ezdrummer2 core libraries and 2 additional rock genre ezx
  expansions rock and pop/rock.

  Ableton drum racks for ezdrummer modern kit: 34 ableton drum racks
  individually mapped to all modern kit factory library content presets, with 17
  predesigned ableton live templates to cater for the multi track audio routing
  of the ezdrummer modern rock kit presets in ableton live.

  Ableton drum racks for ezdrummer vintage kit: 24 ableton drum racks
  individually mapped to all vintage kit factory content presets, with 12
  predesigned ableton live templates to cater for multi track audio output
  routing of the ezdrummer vintage kit presets in ableton live.

  Ableton drum racks for ezdrummer rock ezx: 20 ableton drum racks individually
  mapped to all rock ezx factory content presets, with predesigned ableton live
  templates to cater for multi track audio output routing of the ezdrummer rock
  presets in ableton live. Ableton drum racks for ezdrummer pop/rock ezx: 26
  ableton drum racks individually mapped to all pop/rock ezx factory content
  presets, with predesigned ableton live templates to cater for multi track
  audio output routing of the ezdrummer pop/rock kit presets in ableton live.

  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all ezdrummer factory presets from ableton push
  controller device browser. Over 100 ableton drum racks to instantly load the
  factory library mix ready presets with ableton mappings. Over 30 ableton live
  templates for prebuilt multi track audio routing to each ezx expansion. Colour
  coded pad design for visual performance and finger drumming. Individually
  labelled drum rack pads for clear visualisation, post performance editing and
  automation to all drum rack / instrument articulations. Mapped ableton macros
  to ezdrummer macros with preset values for ease of use in push and simple to
  use automation programming.
