details: |-
  This collection of Ableton drum racks features all factory presets for the
  Native Instruments abbey road 60s drummer.

  Ease of navigation to load all presets from ableton push controller device
  browser. 4 ableton drum racks to instantly load the factory library preset
  with ableton mappings. Optimized for ableton push 2! Color coded pad design
  for visual performance. Know your rides from your crashes. Individually
  labelled pads for post performance editing and automation in the ableton live
  clip editor.

  This pack routes all audio output through a single ableton track. Mixing can
  be further enhanced through kontakt abbey road 60s drummer mixer or additional
  ableton audio effects to the track for example the new ableton 10 drum buss.

  Ableton 9.5 or above to use ableton push 2 color pads mode. Native instruments
  abbey road 60s drummer you must purchase, license and install abbey road 60s
  drummer separately before installation of this pack.
