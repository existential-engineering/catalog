details: |-
  As the founder and CDO (Chief Drumming Officer) for GGD, Matt Halpern definitely has some serious experience hitting drums.

  With the release of his brand new midi groove pack you can now not only have the sounds of his kit, but have Matt sitting behind it playing the beats for your songs.

  The Matt Halpern Groove Pack contains over 100 original grooves and fills, all played by Matt. You can change the tempos, dynamics, and even add to the beats yourself. At the core of this midi pack, Matt Halpern's grooves and feels can become the foundation of your songs.
