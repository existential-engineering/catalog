details: |-
  'Spire Free Essentials' is a free collection of selected presets from the 'Spire Essentials' series by baltic audio. It contains 20 presets from different genres for the Spire synthesizer and 15 MIDI files.

  The included presets can be used for different genres like EDM, Future House, Trance, Future Bass and Progressive House.

  This package is intended to give an insight into the Spire Essentials packages from baltic audio.

  Please note: the drums and some FX used in the demo are not included in this product. These presets require v1.1 or higher of Reveal Sound Spire.
specs: |-
  - 20 Presets for Spire
  - 8 Leads
  - 5 Basses
  - 3 Pads
  - 3 Plucks
  - 1 Sequence
  - Modwheel Assignment
  - 15 MIDI Files
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
  - Requires Reveal Sound Spire v1.1 or higher
