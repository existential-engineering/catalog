description: Cha-ching! Cash in on this 8-Bit Money sample pack with the
  high-pitched metallic sounds of 8-bit coins, gems, jewelry and treasures.
details: |-
  The 8-bit samples are separated into four sound categories: coins: short high
  frequency clinks when getting a single coin. Gems: fast-interval blips for
  gems of all types. Jewelry: longer high frequency chiming sounds for necklaces
  and bracelets. Treasures: sparkling sounds for chests of booty.

  This pack contains: 108 8-bit money samples (coins, gems, jewelry &
  treasures). 1 sfx patch for native instruments kontakt, ableton live,
  maschine, logic pro exs24/sampler, fl studio, mpc expansion pack, and
  tal-sampler. 24-bit, 44.1 khz wav files.

  8-bit money is part of the 8-bit sound effects bundle.
