description: One of the most comprehensive libraries of combat-related sounds ever recorded for TV, film, and video games, containing 2,214 high-quality combat sounds including sword attacks, chainmail, shields, metal, hand-to-hand combat, body falls and impacts. Developed in partnership with Red Libraries and sound designer Stephan Schutze.
details: |-
  One of the most comprehensive libraries of combat-related sounds ever recorded for TV, film, and video games, the Battle Sound Effects Library features a staggering 2,214 high-quality combat sounds, from sword attacks and rapiers to chainmail, shields, metal, hand-to-hand combat, body falls and impacts.

  Designed in partnership with Red Libraries and renowned sound designer Stephan Schutze, this library suits weapon design projects and action scenes alike.

  Sound categories include body impacts, boxing materials, fruit and vegetable impacts and Foley, and armour. Keywords cover banging chest, belt slaps, punching, shoe slap, belt whip, boxing gloves and pads, clothes Foley, metal hits, pipe hits, thuds, metal scrapes, chainmail Foley, sword hits and scrapes, plate armour Foley and hits, male battle shouts and vocalisations, and whooshes.

  Sword and shield material covers hits, rings, scrapes and clashes for sword, great sword, Mordschlag, Messer, rapier, sabre, buckler shield, wooden heater shield, Viking shield and metal heater shield. The purchase contains two downloads: a zip file with all source sound effect asset files plus a Metadata PDF, and an installer for the integrated Weaponiser library including assets and presets.
specs: |-
  - 5,952 sound files (the page's product description instead states 2,214 combat sounds)
  - 1.06 GB size / 2.75 GB Weaponiser integrated version
  - 96 and 192 kHz high-quality WAV files
  - 100% royalty-free commercial licence
  - Embedded metadata
  - 85 Weaponiser presets
