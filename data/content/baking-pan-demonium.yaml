details: |-
  Everyone has turned a baking pan into some kind of impromptu drum at some
  point in their life. So, I sampled 9 pans of varying size and shape, in more
  detail than any sane person would want to do, covering a wide array taps,
  crashes, tings, and smashes.

  9 unique baking pans, varying in size and shape with finger, wooden stick, and
  metal stick strikes providing multiple strike options.

  3 dynamic layers with up to 8x round robin and dry samples for maximum
  flexibility in sound design and performance.

  Adjustable close and far microphone perspectives captured with 2 small
  diaphragm condenser microphones and an alternate 1970s dynamic microphone for
  close perspective.
specs: |-
  - 9 unique baking pans varying in size and shape
  - Finger, wooden stick, and metal stick strikes
  - 3 dynamic layers
  - Up to 8x round robin
  - Dry samples
  - Adjustable close and far microphone perspectives
  - 2 small diaphragm condenser microphones
  - Alternate 1970s dynamic microphone for close perspective
