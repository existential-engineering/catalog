details: |-
  The Bernard Childcare Trust refill is a collaborative effort between six
  refill producers with the goal of passing all proceeds on to the bernard
  family, who experienced a tragedy in july, 2011.

  Inside you'll find: 47 combinators, 54 thors, 6 kongs, 108 samples, 41 nn19s,
  9 nnxts, 16 malstroms, 13 subtractors, 15 effects, and 4 rex loops.

  The contributors to this project were: nicholas: drdist/odarmonix. Ed: bauman
  productions. Marco: koshdukai's music(al) reason(ing). Rob: reason101.net.
  Robb: reason patch-a-day. And special e-commerce help from theo at new
  atlantis audio.
specs: |-
  - Combinator presets
  - Thor presets
  - Kong presets
  - Nn19 presets
  - Nnxt presets
  - Malstrom presets
  - Subtractor presets
  - Effects presets
  - Rex loops
  - Sample library
