details: |-
  The multitrack loops contain separate tracks for kick, snare, hi-hat, toms,
  overhead mics, room mics, and ambient mics so you can mix and edit to taste.

  Recorded in nashville, tn at downtown batterie by acclaimed session drummer
  tony morra.

  Includes seven sets of loops: acoustic/earthy (five styles), blues/reggae
  (three styles), country (three styles), jazz (five styles), metal (four
  styles), r&b/funk (nine styles), rock/pop (eight styles).

  This collection also includes multitrack loops from some of volume 1's best
  beats!
