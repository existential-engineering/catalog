details: |-
  Fourth Multiton Bits release, atmospheres and backgrounds, is a collection of
  cinematic tracks suitable for various use. Mainly aimed at producers working
  with film and games, this pack will also be useful to more adventurous
  musicians looking for inspirational base material, complex or simple elements
  to incorporate in their tracks or live performances.

  Ethereal ambiences and subtle melodies, dynamic and dramatic compositions,
  short but effective sequences, fresh effects and transitions, all of these are
  included. They can be part of your video/ film/ game project or even form a
  complete soundtrack.

  Different variations can be found and used as sound motifs, main themes,
  background sounds or effects. For your music project you will also find a
  plethora of royalty free material to use and sample, especially for ambient,
  downtempo or similar genres.

  Pack consists of 111 wav files, over 950 mb of material and over 1 hour of
  original sounds, from 1 second to over 3 minutes in length. Sounds are
  separated in 6 different sections: orchestral themes, orchestral instruments
  solo, melodic backgrounds, electronic themes, short sequences and effects.

  Files are processed and ready to use, with enough space to allow further
  processing or mastering if needed. They are descriptively named, including
  length, easy to browse and use in your project.
specs: |-
