details: |-
  Authentic Upright Piano for Yamaha Montage

  One thing you know about us—we're all about authentic sounds packed with grit, clunks, bangs, and all the mechanical goodness inside an instrument. Due to high demand, we're excited to bring you an incredibly true-to-life Upright Piano for the Yamaha Montage series. This piano packs serious character. It cuts through a mix with ease while still sounding full and thick, with a punch that hits hard. You'll hear every nuance—from the raw mechanical textures to the beautiful, resonant ring of the strings. It's perfect for jazz, gospel, and especially neo-soul, thanks to its unmatched realism and expressive tone. This is the upright sound your Montage has been waiting for.
