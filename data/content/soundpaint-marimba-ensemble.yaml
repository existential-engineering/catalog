details: |-
  Magical. Mallets. Marimbas

  Why sample one Marimba when you can sample 5? We brought a group of five symphonic Marimbas into our favorite modern orchestral hall and sampled them all together. The end-result is truly special. A new instrument that is lush, warm, and full with entirely new character. We sampled the five Marimbas with two different types of mallets - soft and hard. This offers you the ability to get an incredibly lush and mellow sound - and something more articulate. We also have a number of Marimba synthesized sounds as well to add to the depth and breadth of this awesome library. The Marimba Ensemble is such a wonderfully unique sound that is warm and mellow Marimba magic that just washes over you in sonic goodness.
