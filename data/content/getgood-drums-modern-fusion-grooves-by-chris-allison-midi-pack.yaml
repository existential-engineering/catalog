details: |-
  Chris Allison is one heck of a drummer. He's dynamic, tasteful, powerful when he needs to be, has chops for days, AND he can clearly explain every single thing he plays.

  He has great feel, he's creative, as well as extremely knowledgeable. That's a combination of abilities that's hard to come by and it's because of these reasons (and the fact that he's one of the nicest guys we know) that we invited him on board to create a new midi groove pack which perfectly complements our latest drum library release, One Kit Wonder: Modern Fusion.

  The grooves in this pack cover multiple time signatures, modulations, as well as encompassing the groove balance needed to tackle an infinite genre like Fusion. So boot up your recording rigs, load up your favorite GGD library, and let Chris be your drummer, so you can start writing instantly.
