details: |-
  The riq is a traditional arabic tambourine-like instrument, known for its sharp jingles and vibrant rhythms. Played with fingers and palms, it adds a lively texture and dynamic melodies to both folk and classical music. Its distinct sound and versatile technique make it essential in arabic music ensembles, whether in solos or larger compositions.

  The riq is a key instrument for exploring the rich traditions of arabic percussion.

  The riq has been recorded with great care to capture the full range of typical articulations in arabic music. Additional elements such as hand claps and random noises add even more authenticity.

  With a variety of dynamic layers, round-robin samples, and variations, you will experience a lively and realistic sound experience.
