description: The 1970s slingerland classic rock kit - all samples pack as mixed
  by alan moulder includes our multi-velocity pack, singles hits pack, drum
  replacement pack and kontakt 5 pack.
details: >-
  The 1970s slingerland classic rock kit - all samples pack as mixed by alan
  moulder includes our multi-velocity pack, singles hits pack, drum replacement
  pack and samples from the kontakt 5 pack (but not the instrument). We include
  14 different software patches and three different packs of wav samples.


  The kit consists of a 24" kick drum, five toms - 12", 13", 14"and 15" rack
  toms a huge 18" floor tom and a signature 14" x 7" deep radio king snare. The
  cymbals used were 14" zildjian new beat hi-hats, a zildjian k custom 22" ride,
  a zildjian k dark thin 18" crash and a zildjian vintage cie 16" crash.


  The multi-velocity and single hits packs contain 11 different patches allowing
  you to easily load up the samples. These packs use stereo mixed samples taken
  from a mix of the close microphone, overhead and room microphone. The samples
  come as 24-bit wavs although we also include 16-bit versions in the single
  hits pack. The multi-velocity pack contains 447 samples and the single hits
  pack contains 103 samples. The multi-velocity pack also includes over 500 MIDI
  loops.


  The patches included in these packs are for:- kontakt v5.2.0. Battery v3.2.3.
  Exs24 vlogic x. Ableton drum rack v9.0.5. Reason v7.0.1 combinator refill
  containing nn-xt sampler & fx. Maschine v1.8.0. Geist v1.0.0.7. Studio one's
  impact v2.5.1 soundset. Idrum v1.73.625. Reason v7.0.1 redrum refill. Renoise
  v3.0.0 (courtesy of jon halford) tx16wx v2.4.0 free sampler (courtesy of
  suleiman ali) - mv pack only.


  The drum replacement pack contains patches for slate trigger v2, drumagog v5
  and drumxchanger. The trigger files come as a .tci, the drumagog files as a
  .gog file and the drumxchanger file as a splx file. As a bonus we also include
  a large number of the samples from the kontakt 5 pack (separate close,
  overhead and room mic samples) these are provided with up to 16 velocities of
  each articulation and 3 round robins and total 6825 24-bit wav samples.
