description: A one-shot signature drum sample collection curated by producer and engineer Eyal Levi, featuring 46 samples designed to add punch and consistency to any drum mix.
details: |-
  Drumshotz Eyal Levi is a one-shot drum sample pack curated by Eyal Levi — producer, engineer, and CEO of URM Academy, Nail The Mix, and RIFFHARD. With credits spanning acts like The Contortionist and The Black Dahlia Murder, Levi brings his signature sound to this collection.

  One-shot samples are powerful weapons for enhancing your drum mixes. These samples provide the extra punch and consistency you need to cut through any mix, whether you're layering them with existing recordings or using them as replacement sounds.

  The pack contains 46 samples total in 44kHz, 24-bit WAV format, including 15 kick drum samples, 23 snare samples, 1 three-tom set, and 1 five-tom set. Compatible with any DAW or drum triggering program.

  Includes instant digital download, perpetual license, free lifetime updates, and unlimited customer support.
