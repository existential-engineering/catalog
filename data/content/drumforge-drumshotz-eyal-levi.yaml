description: Mix-ready one-shot drum samples from producer and engineer Eyal Levi, founder of URM Academy and Nail The Mix, drawn from his work in heavy music.
details: |-
  Drumshotz Eyal Levi is a signature one-shot drum sample collection from producer and engineer Eyal Levi. As CEO of URM Academy, Nail The Mix, and RIFFHARD he is best known today for online production education, and as an engineer he has worked with The Contortionist, The Black Dahlia Murder, Firewind, and Chelsea Grin. He also co-founded and played guitar in the band Dååth.

  The pack supplies 15 kick drum samples and 23 snare samples, plus two tom sets: one three piece and one five piece. The samples are meant to be blended with existing sample libraries or raw drum recordings rather than replacing a kit wholesale.

  All 46 samples are delivered as 24-bit / 44 kHz WAV files for use with any drum triggering program or DAW.
specs: |-
  - 46 one-shot drum samples total
  - 24-bit / 44 kHz WAV format
  - 15 kick drum samples
  - 23 snare samples
  - One three piece tom set and one five piece tom set
  - For use with any triggering program or DAW
