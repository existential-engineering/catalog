details: |-
  Snarificator is the ultimate snare expansion for Rave Generator 3, featuring 128 powerful, rough, and layered snare presets designed for Hardcore, Hard Techno, Gabber, and Industrial. Built with stacked samples, these snares deliver explosive energy and unmatched punch. Requires Rave Generator 3.

  Designed for Hardcore, Hard Techno, Gabber, Industrial, Frenchcore, Techno, Acid Core, and beyond, Snarificator delivers 128 explosive, rough, and scintillating snare presets that will take your percussion to the next level.

  Snarificator is built for producers who demand powerful, aggressive, and high-energy snares. Each preset is crafted using stacks of meticulously selected samples, ensuring depth, punch, and sonic richness. Thanks to advanced layering techniques, these snares cut through any mix with brutal clarity and unmatched intensity.

  In hard-hitting electronic music, the snare is just as important as the kick. With Snarificator, you get ready-to-use, professionally designed snares that bring energy, aggression, and clarity to your mix without excessive processing.

  From sharp techno snaps to distorted hardcore slams, every sound in this add-on is engineered for club-shaking power. Whether layering heavy drum patterns or designing signature snare sounds, Snarificator provides a massive arsenal of high-impact snares for your productions.
specs: |-
  - 128 explosive and aggressive snare presets, designed for extreme electronic music genres
  - Stacked sample layers: each snare is crafted with multiple layers of high-quality sounds for unique and dynamic character
  - Suited to Hardcore, Gabber, Hard Techno and more, from piercing attacks to distorted slams and industrial crunch
  - Seamless integration with Rave Generator 3
  - Requires Rave Generator 3 to use this add-on
