  Instantly playable and ultra realistic. A comprehensive range of articulations
  and pedalling, with glisses in every key.
details: |-
  A detailed, beautiful harp library performed by London's leading harpist, Skaila Kanga, who has performed on countless blockbuster film scores. Instantly playable and ultra realistic. A comprehensive range of articulations and pedalling, with glisses in every key. In addition, we give you an otherworldly set of 'Harposphere' patches — beautiful pads and textures created from our original organic recordings.

  Spitfire Harp has been designed to blend effortlessly with our Symphonic and Chamber libraries, having been recorded in the same space — the world famous Hall at AIR Studios.
specs: |-
  - Performed by harpist Skaila Kanga at The Hall, AIR Studios
  - Six essential articulations: Normale, Pres de la table, Flageolet, Sons etouffes, Laissez vibrer, Bisbigliando
  - Glisses playable in every key across major, minor harmonic, minor melodic, pentatonic, diminished and whole tone scales
  - 27 Harposphere synth pad and texture patches
  - 3 mic positions (Close, Tree, Ambient)
  - Recorded through Neve Montserrat pre-amps and a Studer 2" tape machine, to digital at 96k
  - ~4041 samples
  - 12.8 GB uncompressed .wav
  - 6.8 GB download size
  - 13.60 GB disk space required during install
  - Kontakt Full 5.6.8 or higher required
  - Spitfire Audio App required
