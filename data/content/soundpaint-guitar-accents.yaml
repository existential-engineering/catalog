details: |-
  A Dash of Plectrum

  Introducing Guitar Triggers, a brand NEW kind of library that is completely unique to the Soundpaint ecosystem! Dive into a world of dynamic musical expression with meticulously crafted attacks and releases from an array of instruments including Guitar, Banjo, Dulcimer, Ukulele, and Bass. Adding different Attack and Release sounds from different types of instruments, Guitar triggers adds a dash of unique color to your sonic palette. The Attacks and Releases on their own are also perfect for injecting short, percussive elements into your compositions. The Accents collection on its own will add unique flavor and flair to any project, but the real magic lies in the wealth of Hidden Gems waiting to be discovered within this library. Unlock a treasure trove of unexpected sonic delights that seamlessly integrate with the libraries you already possess. With Guitar Triggers, innovation and inspiration are just a click away. Elevate your music in new, unconventional ways and unleash your creativity like never before.
