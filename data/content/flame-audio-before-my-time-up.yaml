  The product is designed to allow producers to experiment with versatile fresh
  loops and create innovative trap and hip hop vibes. MIDI files are included
  for ultimate flexibility across all daws.

  Before my time up by flame audio is soundware (samples or presets that load
  into other products) for macos and windows.
