details: |-
  Free To Be You

  We asked 160 artists one question: "What are the five sounds of your life?" Free You is the answer to this question. Born from the imagination of our global community. Deeply personal. Textural. Endlessly unique. Three Dimensions of Audio

  Free You contains over 820 different sound designs from conventional instruments, found sounds to abstract and heavenly soundscapes. We curated into three core material states:

  Tonal Textural Tools:

  Hundreds of evolving sustain soundscapes, piano and plucked memories designed to paint space. Rhythmic Pads:

  BPM-synced momentum and pulse. Propelling your music forward. Always in devotion to the motion. Stuttery Rhythms:

  Kinetic motion. Fractured beauty. Offering unique rhythmic accents with a deeply organic vibe.
