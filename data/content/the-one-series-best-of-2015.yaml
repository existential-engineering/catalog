details: |-
  This is Best Of 2015 - all the best ni Massive presets from the one during the
  year 2015, carefully selected and merged into this top notch package. The
  presets have been picked from various the one packages, and covers a wide
  spectrum of styles and characters, easy to be implemented to your taste.

  These presets contain good audio quality, and the patches are finely tuned to
  sound very balanced and smooth, which is essential to create great electronic
  music that cut through the masses. The sounds also feature unique timbres and
  advanced synthesis techniques.

  All presets feature full usage of all 8 macro controls, so you may get a good
  overview of the sound and quickly adjust the sounds in various ways. Likewise
  is there plenty of randomizing and velocity linking added to the presets, to
  make them respond as natural and as professional as possible.

  All sounds are 100 % royalty free, and can bee used in any production without
  any limitations.

  Note: massive version 1.5.1 and up is required. This product does not contain
  a copy of the synth massive.
