details: |-
  5 Xylophones. One Hall. Multiple Mallets

  Discover a world of enchanting melodies and vibrant rhythms with this magnificent ensemble of 5 Xylophones. Recorded in a brilliant hall, the ensemble's harmonious and unique sound was meticulously captured to deliver an unparalleled sonic experience. Along with the ensemble, you will also find unique ambiences and synths created from the xylophones in this collection. With both hard and soft mallets sampled, the Xylophone Ensemble offers a versatile range of tones, allowing you to explore a wide spectrum of musical expressions. With 3 microphone perspectives (close, decca, wide), this ensemble transforms the sound of a solo xylophone, infusing it with a unique dark timbre and a remarkable sense of depth. The result is a sound reminiscent of a marimba but with a more percussive and lighter touch, radiating a joyful and childlike glee.
