details: |-
  Bill Kelliher is the guitarist in Grammy-winning band Mastodon, and a previous winner of the Metal Hammer Golden Gods 'Best Shredder' award. He is famously particular about guitar tone, and was diligent in demonstrating that across this pack.

  Created during the sessions for Mastodon's Hushed and Grim , it draws from that record while showcasing tones from the band's extensive back catalogue, and heavily features Bill's own Friedman Butterslax signature amp.

  Bill wanted the pack to feature not only the individual amp and cab setups he used, but his own careful blends of those tones, giving you both the album-ready sounds and the component tones so you can set your own blend to taste.
