details: |-
  Requiem Nova. The gold standard in expressive cinematic choirs, meticulously captured within the breathtaking acoustics of San Francisco's Saint Paul's Stone Cathedral. Hand-selected vocalists from the prestigious SF Symphony Chorus, Volti Group, and SF Opera bring emotional authenticity to every note, perfect for epic orchestral scoring, dramatic narratives, or contemporary pop and hip-hop tracks. Experience true limitless polyphonic legato powered by Soundpaint's advanced H.A.L technology. Immerse yourself in hundreds of lush sustains, vivid marcato, precise staccato articulations. Hundreds of fully playable phrases. Thousands of Choral FX from 2001 to White Lotus. 440 Programs | 1,100 Articulations | 32,000 Samples

  Requiem Solus features 5 World-Class solo vocalists from the Requiem Nova choir. We hand-selected 5 singers from the Requiem Nova choir who we thought had the most stand-out voices. Their voices are full of character and shine as soloists. They sing over 4K phrases that match Requiem Nova seamlessly. Using our new High-res Rack Time Stretcher you can change the speeds of the phrases to any desired speed. 206 Programs | 156 Articulations | 4,000 Samples
