details: |-
  Ableton Drum Racks for ezDrummer Vintage Kit features separate Ableton drum
  racks for all factory presets for the toontrack ezdrummer vintage kit. These
  racks are the most complete integration between Ableton live and toontrack
  ezdrummer including a host of features ready to use on Ableton push.

  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all vintage kit factory presets from ableton push
  controller device browser.

  All our racks use consistent drum rack coloring so you can visually and
  immediately spot your snares from your crashes. All instrument articulations
  ready to go in one layout using ableton push 64 pad layout mode. Individually
  labelled drum rack pads for clear visualisation, post performance editing and
  automation to all drum rack / instrument articulations in ableton.

  Ableton macros mapped to toontrack ezdrummer macros with preset values for
  ease of use in push and simple to use automation programming. Ableton macros
  are color coded to match the ezdrummer display.

  Use the template racks and extend to your own toontrack ezdrummer vintage kit
  presets, swapping out individual sounds or articulations. You are 100% ready
  to go with the factory presets but there is no limitation to creating your own
  presets from these templates.
specs: |-
  - 24 Ableton drum racks
  - Color coded pad design
  - Ableton push 64 pad layout mode
  - Individually labelled drum rack pads
  - Ableton macros mapped to toontrack ezdrummer macros
  - Singleout presets with 12 Ableton drum racks
  - Multiout presets with 12 Ableton drum racks
  - Multiple audio channel output
  - Ableton live 9.5 or above
  - Toontrack ezdrummer2 and vintage kit required
