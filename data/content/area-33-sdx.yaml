details: >-
  Area 33 sdx brings together parts of the original drumkit from hell team:
  meshuggah guitarist fredrik thordendal and producer/engineer/mixer daniel
  bergstrand. In this joint venture of sourcing, engineering and ultimately
  externalizing their very figment of what the most all-encompassing
  metal-related sdx for superior drummer 3 could be, they ended up with an
  absolute monster weighing in at a staggering 180+ gb.


  It was recorded at fredrik thordendal's personal studio 33 in stockholm,
  sweden. This studio, which thordendal and bergstrand built from the ground up,
  was designed with the goal of creating the epitome of a drum room: spacious
  and reverberant but at the same time profoundly precise, direct and
  controlled.


  With its seven contrasting and complementing kits, extensive pool of
  additional drums and virtual forest of cymbals, the area 33 sdx presents a
  massively broad palette of raw and unadulterated drums that you can hone,
  shape and mold using the limitless framework of superior drummer 3.


  Each kit was recorded using the classic close-mic technique but, in addition,
  with an extra set of microphones on each position. This means that each drum
  and cymbal is represented by both a mono as well as a stereo pair of
  microphones, allowing you to sculpt tones beyond what you thought possible.


  Sampled by drummer leo margarit (pain of salvation). Includes presets for each
  kit engineered by bergstrand as well as the toontrack sound design team.
specs: |-
  - Seven unique drum kits
  - 13 snares
  - 14 bass drums (x2)
  - 42 toms
  - Three hi-hats
  - 40+ cymbals
  - Up to eight toms per kit
  - Double bass drums
  - 15 cymbal slots
  - Close-mic technique recording
  - Mono and stereo microphone pairs per drum and cymbal
  - 11 ambience microphone positions (seven in stereo)
  - 180+ gb of sampled drums and cymbals
  - Superior drummer 3 compatible
  - Presets for each kit
  - Macos and windows compatible
