details: |-
  BFD Percussion adds an extensive suite of detailed percussion instruments to
  your bfd3, bfd eco or bfd2 installation. Its sounds cover latin, world and
  kit-centric percussion as well as outlandishly strange junk percussion and
  kitchenware. Included are congas, bongos, timbales, djembes, darbukas, udu,
  ashiko, bodhran, chimes, triangles, shakers and tambourines alongside esoteric
  effect sounds like thundersheets, waterphones and bowed gongs.

  The grotesquely beautiful junk percussion range includes trashcans, saw
  blades, saucepans and other intriguing household objects. In fact, bfd
  percussion literally contains the kitchen sink - in full multi-sampled,
  multi-articulated form.

  Bfd percussion is produced in a similar setting to bfd jazz & funk collection
  and the mapleworks kits in bfd3. With a tight and focused room sound and a
  high-end recording chain, bfd percussion perfectly captures the lush ambience
  and expressive depth of these eclectic instruments and is perfect for use in
  all styles of music.

  The collection also comes with a bonus set of percussion groove performances.
specs: |-
  - Expansion for bfd3, bfd eco and bfd2
  - 26 GB of vibrant, detailed percussion
  - Latin and world percussion
