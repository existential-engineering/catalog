  - Bells, blocks, tambourines and chimes
  - Esoteric waterphones and bowed gongs
  - Groove sets included
  - Multi-sampled, multi-articulated instruments
  - Congas, bongos, timbales, djembes, darbukas, udu, ashiko, bodhran
  - Thundersheets, waterphones and bowed gongs
  - Trashcans, saw blades, saucepans
  - Windows 7 or higher
  - Os x 10.6.2 or higher
  - Bfd3, bfd eco or bfd2 (v2.1 or higher) required
  - Internet connection required for download and authorization
  - 26.1gb of free hard disk space for highest detail levels
