description: Five Pop construction kits with over 250 WAV files, 27 MIDI files and 30 Spire presets, covering basses, drums, synths and tonal one-shots.
details: |-
  'Billboard Pop Busters Vol 1' from baltic audio contains five Pop construction kits with the elements needed to build chart-style Pop tracks, including hand-crafted basses, drums, synths and 30 Spire presets.

  Each kit contains recorded and mixed instrumentation aimed at commercial Pop production.

  MIDI files are included for the majority of musical phrases heard in these kits, so phrases can be adapted and used to trigger any synth or sampler. The MIDI files can be combined with the included key-tagged one-shot files to create new phrases and patterns that blend with the pre-recorded content.

  Unlooped tail WAV files are included, allowing a phrase to end with the decay of the reverb or delay applied to the loop. Dry and wet versions are provided, as well as filtered and side-chained loops.
specs: |-
