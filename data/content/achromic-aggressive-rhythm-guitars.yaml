details: |-
  Achromic is a guitar library focussed on aggressive rhythm guitars for metal
  or hardcore productions. It specifically targets key issues often found in
  guitar libraries such as weak pick-attack and overly-complicated playing
  engines. Achromic is the answer for when you just need rhythm guitars fast and
  sounding great.

  The instrument is an agile septor pro 727 seven-string guitar with seymour
  duncan blackout pickups. Professionally setup and meticulously sampled,
  including individual pick-attacks and fret noises to accurately capture
  realistic stereo rhythm guitars (or leads, with a bit of tweaking).

  The playback engine uses a non-repeating algorithm to split 2 samples either
  side in a round-robin fashion. This results in a realistic sound and removes
  the "machine-gun" effect. In addition to regular sampling, individual atonal
  pick attacks were recorded to layer on top of the original notes. The custom
  user-interface allows complete control over the volume of these additional
  samples for when you need aggressive picking to cut through heavy amp
  distortion. This same knob also controls the level of attack applied through a
  transient shaper effect on the backend, resulting in even more pick
  aggression.

  No keyswitches. Use low-velocity for palm mutes and high velocity for
  sustains. Additional articulations are mapped to the coloured fx keys (like
  pick scrapes or dead notes). Achromic is designed from the ground-up to be as
  fast as possible for writing purposes. For riffs that need to slam extra hard,
  the force downpick switch mutes the up-stroke articulations. This can be
  automated using any DAW's inbuilt automation.

  Additional noise samples were individually recorded and have a random chance
  to trigger on release. The volume and decay of these sounds can be controlled
  with the fret noise knob on the interface. Bend the pitch with any MIDI
  controller, or use DAW automation. Achromic also includes additional fx keys
  like pinch harmonics, pick scrapes and dead notes. Achromic outputs a raw
  signal (di), you'll need to provide your own sweet-sounding amps or
  simulations to really make the sound your own.
specs: |-
  - Non-repeating round robin playback engine
  - Transient shaper effect
  - Velocity-based articulation control
  - Force downpick switch
  - Fret noise control
  - Pitch-bend support
  - MIDI controller support
  - DAW automation support
  - FX keys (pick scrapes, dead notes, pinch harmonics)
  - Kontakt 5.8 or later (full version required)
  - 4gb RAM (8gb recommended)
  - 0.97gb hdd space (.ncw compressed from 2gb)
  - Agile septor pro 727 seven-string guitar
  - Seymour duncan blackout pickups
  - Stereo rhythm guitar sampling
  - Individual pick-attack samples
  - Fret noise samples
  - Release samples
  - DI signal output
