details: |-
  303 Punk is a nod to the early rave days. Inspired by groups like the prodigy
  and 808 state. Distorted and aggressive tb-303 acid loops ready to drop into
  your mix.

  Each loop is a long 16 bar performance with evolving filter sweep and
  resonance sweep.

  We included some beats and a hefty 25 sample drum folder with analogue drum
  one-shots ready for to create your own beats.

  This pack comes with multiple sampler formats including an ableton live drum
  rack. Let you r80s and 90s rave shine.

  Formats include (48khz 24-bit): acidized wav. Apple-looped aiff.
