details: |-
  Gear Up for Great Tunes

  Introducing the Wrenchenspiel: It's not just for tightening bolts anymore! This custom creation boasts an eclectic ensemble of 31 deep sampled wrenches. We've taken these handy tools and transformed them into musical marvels. Some even sustain their notes for a jaw-dropping 10 seconds. We've put wrenches through the wringer, striking them with everything from soft mallets to hammers, hotrods, and even running electricity through them. The result? A versatile percussion powerhouse that can sing sweetly like a Glockenspiel, twinkle with the charm of a Celeste, or unleash musical mayhem like a savage sound-design experiment gone wild. Who knew wrenches could be so musical? Try them out for yourself today and tighten up your sound more than ever with the Wrenchenspiel!
