details: |-
  Analog strings is a virtual instrument for the modern music maker. Analog strings is all about crafting and performing string sounds that are insanely unique and cutting-edge.

  Tones are created by blending two deeply sampled orchestras, vintage synths and unconventional sound design. Add in advanced modulation routing, dual tape loopers, dual arpeggiators, flux and macro control and analog strings gives music creators an entirely new world of sound.

  Analog strings by output is a virtual instrument audio plugin and a software application and soundware (samples or presets that load into other products) for macos and windows. It includes, and is therefore "powered by", kontakt player, which functions as an audio units plugin, a VST 3 plugin, an AAX plugin and a standalone application.
specs: |-
  - Vst3 plugin
  - Audio units plugin
  - AAX plugin
  - Standalone application
  - Kontakt player
  - Dual-layer engine
  - Dual arpeggiators
