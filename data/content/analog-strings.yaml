  - Dual tape loopers
  - Flux control
  - Macro control
  - Layer fx
  - Global fx
  - Preset menu with smart tagging
  - Tempo sync
  - Built-in help menu
  - 500 presets
  - 39 gb sound library (20 gb compressed)
