details: |-
  New Loops presents Ambient Drum Loops with 200 loops and sounds for electronic
  ambient and chill. You'll find 150 processed drum loops full of character
  including full loops, kick loops, hat loops, kick-less loops and more.

  The pack includes 20 huge ambient pad soundscapes and 30 synth bass loops with
  raw analogue character. All loops are 24-bit, 44.1 khz wav files, recorded at
  80 beats per minute and 2-bars long. The bass loops and pads are in key c with
  pads averaging 30 seconds long.

  These ambient loops are suitable for many genres of electronic music including
  ambient and chill, cinematic soundtrack and film scores, electronica,
  atmospheres and soundscapes, game music, and also useful for trap, hip hop,
  future bass, house, trance, and techno.

  Pack features: universal wav format, total of 200 loops and samples, 150 drum
  loops, 30 bass loops, 20 pad soundscapes (avg. 30 seconds each), key and bpm
  in file names, 24-bit 44.1 khz wav files, 100% royalty free.
