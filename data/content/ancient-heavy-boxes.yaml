description: Ancient Heavy Boxes is a cinematic percussion library for native
  instruments Kontakt 5.
details: |-
  The library includes the following patches: bass drum 1 & 2, brushed boxes 1 -
  6, paper djembe, taikos 1 - 3, and tom drums 1 - 3. Paper boxes have a special
  unique sound that can give interesting edge to a track and can be used in
  cinematic trailer tracks as well as indie rock songs.

  Most of the patches consist of 10 white playable keys providing one and a half
  octaves to play around with drum sounds. The library is completely dry, making
  it easy to integrate into templates using your own reverbs. The samples are
  recorded and processed in 41khz / 16-bit and the zip file requires about 500
  mb disk space.
specs: |-
  - Native Instruments Kontakt 5 compatible
  - 41khz / 16-bit sample rate and bit depth
  - 15 unique patches
  - 10 playable keys per patch (one and a half octaves)
  - Dry samples
  - 500 MB disk space requirement
  - Full version of Kontakt 5 required
