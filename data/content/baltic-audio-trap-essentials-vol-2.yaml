details: |-
  'Trap Essentials Vol 2' from baltic audio is a sample pack for Trap music. You'll find over 250 WAV files, 85 MIDI files to create your next hit track, including drums, 808s, basses, synths, drum and melody loops and more.

  Fuel your DAW with these premium grade loops, drums, basses and synths that will allow you to be a part of this hot genre. With the collection of one-shot drum samples you make better beats more quickly.

  MIDI files are included for the majority of musical phrases heard in these Kits: an essential feature for modern producers.

  Adapt the phrases in any way you desire and use them to trigger your favourite synth or sampler. Use the MIDI files in conjunction with the included key tagged one-shot files to create new phrases and patterns that blend seamlessly with the pre-recorded content.

  This pack will be your essential source for creating instant Trap hits, which are just waiting for a vocal topline to be added.
specs: |-
  - 55 Melody loops
  - 60 Drum loops
  - 120 Oneshots (drums, basses, 808s, percussion, synths, keys, plucks, pads, fx)
  - 85 MIDI files
  - Over 450 MB of content
  - Perfectly premixed
  - 44.1kHz/24-Bit WAV
  - PC/Mac Compatible
  - 100% Royalty-Free
