description: Ableton drum racks mega bundle for toontrack ezdrummer the most
  biggest and most complete ableton integration for ezdrummer and ezx expansio
details: >-
  The most biggest and most complete ableton integration for ezdrummer and ezx
  expansions available. Ableton drum racks mega bundle for ezdrummer is the
  collection of the deepest integration between ableton live and toontrack
  ezdrummer 2. All our individual pre-integrated libraries are included for one
  great value bundle with massive savings!!


  With this bundle you really can load every individual ezx preset from your
  ableton push for amazing studio workflow and creativity. Amazing workflow in
  ableton and on your push to the full capabilities of the kit library saving
  setup time and allowing you to focus on music creation. Ease of navigation to
  load all ezdrummer factory presets from ableton push controller device
  browser.


  Thousands of ableton drum racks to instantly load the factory library "mix
  ready" presets with ableton mappings. Hundreds of ableton live templates
  specially designed for prebuilt multi track audio routing to each ezx
  expansion preset. Colour coded pad design for visual performance and finger
  drumming. Know your toms from your snares from your hi hats. Individually
  labelled drum rack pads for clear visualisation, post performance editing and
  automation to all drum rack / instrument articulations.


  Each product in the bundle comes with ableton drum racks variations
  automatically configured for your preferred audio routing mode. Singleout
  presets featuring 52 ableton drum racks for all factory presets single audio
  output to single ableton track. Multiout presets featuring 52 ableton drum
  racks for all presets in multiple audio channel output from the plug in to
  multiple ableton audio tracks using the multi output ableton template also
  provided.


  Use the factory presets or use the structure and templates as ready made basis
  for creating your own mix templates using single or multi-audio routing
  preconfigured setup allowing you to focus on the sound mix you seek. Ableton
  live 9.x latest release or 10.x latest release recommended for maximum
  compatibility. Toontrack ezdrummer2 and ezdrummer expansion libraries note:
  this download does not contain the toontrack kit libraries packs or toontrack
  ezdrummer product you must purchase, license and install separately before
  installation of this pack.
