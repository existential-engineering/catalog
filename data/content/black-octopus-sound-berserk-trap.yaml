details: |-
  Berserk Trap by Cyborgs is a Trap sample pack from Black Octopus Sound, collecting 808s, bass loops, drum loops and more for heavier Trap production.

  The loops and one shots are accompanied by MIDI, so the parts can be assigned to other drum samplers or soft synths for further control. The pack also includes 808, bass and synth presets for Xfer Serum.

  The backbone of the library is its selection of loops, presets and one shots aimed at Trap producers. Alongside the 808s, drum loops, bass loops and Serum presets are bass one shots, FX loops and one shots, synth loops and one shots, vocal loops and one shots, and MIDI for bass, hi-hats and synths.

  The material draws on heavier Trap styles associated with producers such as RL Grime, A$AP Ferg, Waka Flocka, Baauer, TNGHT and Hucci.
