details: |-
  JST Gang Vocals is a free collection of gang vocals created and performed by our community, for our community. With segmented, pre-mixed, and raw gang vocals of every chant someone could ever need just a few clicks away, spend less time searching for usable clips or recording your own, and amplify your productions with ease.

  Whether you need a simple "One! Two! Three! Four!", a "Hey!", a "Let's go!", an "Ohhhhhh!" or any combination of them all, JST Gang Vocals is a complete package of high-quality gang vocal phrases ready for use in your next production.

  As a community-built production pack, JST Gang Vocals can be used in your productions and compositions completely royalty-free, but cannot be resold or distributed as delivered.
