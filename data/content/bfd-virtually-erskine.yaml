details: |-
  BFD Virtually Erskine is an expansion pack for bfd3, bfd eco and bfd2
  featuring 2 stunning kits played by the legendary drummer peter erskine.
  Having played with some of the biggest names in jazz, pop and rock such as
  weather report, steely dan, joni mitchell and kate bush, peter erskine's drum
  sound and groove are perpetually in demand.

  Peter erskine played 2 dw drumkits and selected zildjian cymbals for the
  recordings, conducted by experienced bfd sampling guru john emrich in peter's
  own studio.

  Bfd virtually erskine features almost 15gb of highly detailed instruments
  including selected stick and brush versions and is particularly suitable for
  jazz, pop, rock and fusion.

  Bfd virtually erskine is produced in association with cymbal masters.
specs: |-
  - Expansion for bfd3, bfd eco and bfd2
  - 2 drum kits
  - 3 kicks
  - 5 toms
  - 2 snares
  - 7 cymbals
  - 1 hihat
  - 1 cowbell
  - Stick versions
  - Brush versions
  - Almost 15gb of highly detailed instruments
  - Windows 7 or above
  - Os x 10.8 or above
  - Bfd3 v. 3.2.1.2 or above required
  - Internet connection for download and authorization
  - 23 GB disk space required
  - SSD recommended
