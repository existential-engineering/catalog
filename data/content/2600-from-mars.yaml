details: |-
  Explore the raw power of this legendary semi-modular. The 2600 is a three oscillator monster that's blazed a trail of sonic mayhem through countless genres for the past 40+ years. Despite only 3,000 units ever produced, the impact this synth has had on music is staggering.

  Our particular 2600 was one of the first made and houses the coveted 4-pole moog "ladder" filter (which almost erupted into a messy lawsuit) that gives the synth a unique warm bite.

  Contents: 40 multi-sampled 2600 instruments for ableton, kontakt, logic & 24-bit wav. Sharp boogie basses, funky sci-fi fx, experiments leads, modulating patches. Clubby synth drums, piercing house basses, experimental pads, r2d2 fx, modular experimentations and more.

  Extensive multi-sampling, modulation and fx routing on all instruments. Hand trimmed and looped to perfection. Clean and processed recordings with a variety of class a gear.
