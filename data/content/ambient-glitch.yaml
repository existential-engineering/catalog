details: |-
  Welcome to the sounds of ambient glitch, an ancient relic of atmospheric music with a twist of controlled malfunction. Emerge your tracks into a new wave of swirled strings, mechanical soundscapes, pattern based-walking analogue bass-lines and big screen drums process through valve radio circuitry.

  Dboxsamples has focused more towards film composers, grime artists and glitch performers to bring you the holy grail of ambient soundscapes. Combined with 213 x 24-bit audio looped sounds and multi-take strings at your fingertips makes ambient glitch the best counterpart for sequenced music.

  Bass - 19 cutting, jagged textures of spiked bass ready to carry your tracks across any genre. Beats - 69 heavy, all-terrain grooves filled with the most accurately timed kinetic beats for consistent motion. Efx - 7 controlled by envelope, noisy motions and delayed morphs. Glitch: 7 aesthetic spectrum glitch sounds. Keys - 27 key modulations sharpened to perfection combined with mellow dulcet tones. Multi - 40 layers of grounded multi-take musical aspects intertwined with a touch of introspection. Pads - 20 soft, atmospheric chordal keyboard parts for signature music. Real - 12 visionary, piercing real sounds to create dynamics and add some backdrop flavor. Strings - 6 string interventions for enhancing performance to break musical boundaries. Tops - 13 elements to spice up your landscape with stuttered noise and percussive aspects.
