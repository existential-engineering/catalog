details: |-
  Ambient tal-u-no-lx focuses on the ambient music genre, featuring presets designed from the golden era of ambient music. Some of the most long lasting ambient music has been made on classic analog synthesizers, those warm, humming hardware devices that bob moog believed has souls.

  Being an ambient soundset, many pads have been included (33). Also included are ambient based percussion and the new "beat" category which quickly sets up rhythms suitable for the genre.

  The arps are uniquely geared toward this classic musical style and will quickly help the user define the pace. To take it a big step forward, many drones have been included designed in a way that only classic analog synthesizers could do.

  The "melodic" category is designed to allow for movement that pads would not be capable of but still full of the rich resonance that made some of the best ambient music.

  Ambient tal-u-no-lx is the 7th soundset for the tal-u-no-lx juno 60 emulation.
