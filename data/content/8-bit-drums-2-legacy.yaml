details: >-
  For the second round of 8-bit drums, drum and percussion samples were
  processed through a sample playback engine that recreates the one from the
  original sound chip.


  This pack contains: 98 8-bit drum samples (kick, snare, tom, percussion,
  hihat, cymbal, sidestick, shaker, tambourine & other).


  1 drum patch for native instruments kontakt, ableton live, maschine, logic pro
  exs24/sampler, fl studio, mpc expansion pack, and tal-sampler.


  24-bit, 44.1 khz wav files.


  8-bit drums 2 is part of the 8-bit instruments & drums bundle.
