name: Acoustic Pianos
manufacturer: sonex-audio
primaryCategory: sampler
categories:
  - piano
description: Sonex Audio Acoustic Pianos, an extensive 56 GB collection of 9
  grand pianos from around the world for ni Kontakt sampler.
details: |-
  Acoustic pianos: yamaha c3, yamaha c5, yamaha c7, fazioli f308, bosendorfer 290, steinway d, steinway b, baldwin and upright piano.

  4 separate mic positions: close (stereo and mono), middle, far, and ambience (room). Up to 12 velocity layers. Nearly 100gb of uncompressed sample content (compressed to 56 gb). 23,072 samples (kontakt lossless sample compression format).

  Built-in effects: 3-band equalizer, compressor, saturation, distortion, chorus, reverb, delay, stereo width, limiter and more. Full set of effects in the kontakt settings for further customization.

  Unique gui has been designed to give a user full control over options and effects without slowing down the creative process.
