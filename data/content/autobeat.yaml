details: |-
  AutoBeat is a max for live MIDI device for patterns generation based on
  probabilities. With AutoBeat you create variable beats and fills with just a
  few clicks. The device is based on eight 16 steps sequencers. For each step
  you can define the chance to trigger a MIDI note and its velocity.

  Each voice has exclusive tools for advanced editing: time resolution, three
  random functions, offset, loop length and more. Beside the variations
  automatically generated on the main pattern, you can also create an
  alternative pattern via the fill area: then just click the fill button to
  launch another pattern on the fly.

  Being a MIDI device, autobeat works with any instrument (not only drums).
  Furthermore, it has special features optimized for ableton live's drum rack!
  If this device is used in the same track with a drum rack, autobeat starts
  communicating with it getting the drum pads name. Then, editing a drum pad in
  the drum rack, autobeat automatically selects that note pads displaying its
  settings: you will always see the pattern of the pad you are working on.

  Autobeat works great as continuous variations live instrument as well as a
  smart probabilities writing tool: the store feature allows you to instantly
  create MIDI clips based on the current pattern with just a click.

  The autobeat pack contains also 9 drum racks and 40 instrument racks designed
  by sound designers, artists and ableton certified trainers as: afro dj mac,
  federico ascari, franz rosati, hyena, noah pred, piezo.
specs: |-
  - Eight 16-step sequencers
  - Probability-based pattern generation
  - MIDI note velocity control
  - Time resolution
  - Random functions
  - Offset control
  - Loop length adjustment
  - Fill pattern functionality
  - Ableton live drum rack integration
  - Drum rack pad recognition
  - MIDI clip storage
  - Polyrhythm support
  - Swing control
  - Step muting and soloing
  - Note preview capability
