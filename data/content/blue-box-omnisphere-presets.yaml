description: Blue box is part of a new series of presets for Omnisphere. A truly
  unique soundset of 80 presets for Omnisphere, unlike any other.
details: |-
  The blue box offers six unique categories: acoustic based instruments,
  guitars, atmospheres, pads, arps, and film.

  Acoustic based instruments: although these instruments are acoustic based,
  they are a mixture of acoustic instruments and a broad range of atmospherics.
  These instruments defy origin, some may have an ethnic quality while others do
  not sound like any other known instruments. These are often plucked, picked or
  strummed but evolve in some very musical ways.

  Atmospheres: deeply evolving and highly visual, the atmospheres in blue box
  will take you to a new place musically. Pads: warm, organic, and richly
  analog, these pads are a blend between vintage and modern.

  Film: this category was designed specifically for film and soundtrack
  production. We added a number of presets that capture some deep and highly
  visual moods. These pickup where atmospheres leave off and take sonic
  exploration to the next level. A powerful collection of professional quality
  film/soundtrack presets.
specs: |-
  - 80 presets for Omnisphere
  - Six unique preset categories
  - Expertly crafted controllers and effects
  - Professional sonics
