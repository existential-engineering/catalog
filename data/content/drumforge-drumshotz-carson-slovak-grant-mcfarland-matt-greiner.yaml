description: Multi-Grammy nominated producer/mixers Carson Slovak / Grant McFarland (August Burns Red, Galactic Empire) and drummer Matt Greiner (August Burns Red) have teamed up to bring you their favorite one-shot drum samples from sessions working together. This two-time Grammy nominated all-star trio have absolutely dominated the charts together with three Billboard certified top 20 albums, 2 of which charted in the top 10.
details: |-
  Drumshotz Carson Slovak & Grant McFarland & Matt Greiner collects one-shot drum samples from sessions the three worked on together. Slovak and McFarland are multi-Grammy nominated producers and mixers whose credits include August Burns Red, Galactic Empire, Everclear, and Candlebox; Greiner is the drummer for August Burns Red. Between them the trio has placed three Billboard certified top twenty albums, two of which reached the top ten.

  The library covers 4 kick, 5 snare, and 1 tom sample set, with a later bonus addition of 1 further kick, 2 further snares, and a five piece tom set. The samples are intended to be blended with existing sample libraries or raw drum recordings rather than used in isolation.

  All files are 24-bit / 44.1 kHz WAV, usable with any drum triggering program or DAW.
specs: |-
  - 24-bit / 44.1 kHz WAV format
  - 4 kick, 5 snare, and 1 tom sample set
  - Bonus content: 1 additional kick, 2 additional snares, and a five piece tom set
  - For use with any triggering program or DAW
