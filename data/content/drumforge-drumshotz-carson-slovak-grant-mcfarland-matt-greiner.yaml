description: Multi-Grammy nominated producer/mixers Carson Slovak / Grant McFarland (August Burns Red, Galactic Empire) and drummer Matt Greiner (August Burns Red) have teamed up to bring you their favorite one-shot drum samples from sessions working together. This two-time Grammy nominated all-star trio have absolutely dominated the charts together with three Billboard certified top 20 albums, 2 of which charted in the top 10.
details: |-
  Drumshotz Carson Slovak & Grant McFarland & Matt Greiner is a signature one-shot drum sample collection born from real studio sessions between two of metal's most acclaimed producer/mixer duos and August Burns Red's drummer.

  Carson Slovak and Grant McFarland are multi-Grammy nominated producer/mixers known for their work with August Burns Red and Galactic Empire, responsible for three Billboard-certified top 20 albums, two of which charted in the top 10.

  The pack includes WAV samples recorded at 44.1 kHz, 24-bit quality, covering kicks, snares, and toms. A bonus update added even more content: 1 additional kick, 2 more snares, and a full 5-piece tom set.

  One-shot samples are designed to enhance drum mixes by providing extra punch and consistency, helping recordings cut through any mix.
