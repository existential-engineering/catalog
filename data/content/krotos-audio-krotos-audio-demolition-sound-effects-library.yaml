description: The Demolition Sound Effects Library by Soundbits delivers the ultimate collection of demolition and destruction sounds packed into one sfx bundle. Covers a vast range of recorded and designed impacts, crashes, breakages, rubble, and debris from materials such as glass, metal, stone, and wood. Featuring 1,603 audio files adapted from the Soundbits Crash & Smash and Just Impacts sfx libraries to work straight out-of-the-box in Weaponiser and Reformer Pro.
details: |-
  Crash, Bang, Wallop! Meet your sound design destruction toolkit. The Demolition Sound Effects Library by Soundbits delivers the ultimate collection of demolition and destruction sounds packed into one sfx bundle. Krotos adapted the Soundbits Crash & Smash and Just Impacts sfx libraries to work straight out-of-the-box in its award-winning sound design software, Weaponiser and Reformer Pro.

  This sound effects bundle covers a vast range of recorded and designed impacts, crashes, breakages, rubble, and debris from a range of materials such as glass, metal, stone, or wood.

  Featuring 1,603 audio files, this sound collection offers a huge 3.9 GB (for Weaponiser) and 1.91 GB (for Reformer Pro) selection of royalty-free SFX components, ideal for any trailer, post-production, game-audio, and sound design project.

  Sound categories included in this library are Glass, Metal, Wood and Mixed Materials, with sound effect keywords covering glass, metal, stone, plastic, wood and mixed materials. The purchase contains two downloads: a zip file with all source sound effect asset files plus a Metadata PDF, and an installer for the integrated Weaponiser library including assets and presets.
specs: |-
  - 1,603 sound files
  - 1.91 GB size for Reformer Pro / 3.9 GB for Weaponiser
  - 24 bit / 96 kHz high-quality WAV files
  - 100% royalty-free commercial licence
  - Embedded metadata
  - 80 Weaponiser presets
  - 9 Reformer Pro sound packs
  - iLok required for the Weaponiser integration installer
