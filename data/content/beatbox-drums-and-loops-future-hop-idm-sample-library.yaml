details: |-
  Beatbox Drums and Loops Future Hop Idm Sample Library by galun features the
  unique talent of galun beatboxing in experimental electronica genres like idm
  and future hop, sometimes sounding like beatbox translations of tracks from
  the warp label catalogue.

  The library contains more than 1 hour of beatbox recordings at multiple tempos
  (70, 80, 90, 100, 105, 110, 115, 120, 125, 130, 135, 140, 145, 150, 160, 165,
  170 bpm) in 16-bit mono 44.100 hz wav format.

  This recording was not edited, and samples are not converted into typical
  ready-to-use packs, allowing users to edit the takes themselves in a way that
  fits their sampler or DAW.

  The library includes sound travel beatboxing recorded at barcelona with city
  and ambient noise included in the recording, plus a separate sounds pack to
  create your own beatboxing galun drum kit.
