description: Matter Mayhem is a destruction, chaos and debris sound effects library by SoundMorph, recorded at 96 kHz / 24-bit in multiple perspectives across a wide range of materials. It ships with pre-prepared Reformer Pro and Weaponiser integration alongside the traditional library.
details: |-
  A huge pack of destruction, bomb and debris sound effects and more, with Weaponiser and Reformer Pro integration. All the debris, destruction sound effects, blasts and other chaos you could ever need, with tons of different materials recorded at 96kHz/24-bit in multiple perspectives. This destruction SFX library is complete with the pre-prepared Reformer Pro and Weaponiser libraries, for organic flexibility that is ready to go any time.

  SoundMorph went above and beyond with the production of these destruction sound effects. Spanning 6 months of recording out in the field and designing in the studio, the set delivers seismic sound effects bringing Earth-shattering carnage to your sound designs. Metal destruction, wood, stone, pebble explosions, debris and designed elements are all created at professional standards.

  Sound categories included in this library: Bomb Blasts, Blow Ups (Stone), Stone Debris, Collapses, Blow Ups (Pebble), Blow Ups (Wood), Glass Debris, Scaffold Impacts, Blow Ups (Metal), Wreckage, Plastic Debris and Designed Debris.

  The purchase contains three downloads: a zip file with all source sound effect asset files plus a metadata PDF, an installer for the integrated Weaponiser library including assets and presets, and an installer for the integrated Reformer Pro library including assets and presets.

  Matter Mayhem is one of the largest libraries SoundMorph has produced, according to co-founder Jason Cushing, and is aimed at anyone needing debris, destruction, bomb blasts and chaos recorded in high definition sound with multiple perspectives and tons of different materials.
specs: |-
  - 1,397 sound files
