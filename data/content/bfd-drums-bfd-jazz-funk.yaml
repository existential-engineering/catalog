details: |-
  Bfd jazz & funk collection is an expansion pack for fxpansion's bfd3, bfd
  eco and bfd2. Recorded in a dry, intimate sounding room at omega studios,
  maryland, usa, its sounds offer a whole spectrum of fresh flavours for your
  productions.

  Centred around 3 exquisitely recorded kits and a wide range of hyper-detailed
  extras, most of the instruments in bfd jazz & funk collection are provided
  in stick and brush versions with selected pieces also played with mallets,
  rods and even hands!

  A wide range of controlled, dynamic articulations are featured. The
  versatility of the precision instruments in bfd jazz & funk collection
  mean that it's perfect for jazz, funk, pop, soul, hip-hop, r&amp;b, blues,
  country, fusion, folk, rock and far beyond.

  Bfd jazz & funk collection is recorded in the same room and studio
  conditions as bfd percussion, fxpansion's range of yamaha-based expansions
  such as bfd maple custom absolute and the mapleworks kits in bfd3.
specs: |-
  - Expansion for bfd3, bfd eco and bfd2
  - 55 GB of detailed and expressive drums
  - 3 exquisitely recorded kits
  - Stick and brush versions
  - Mallets, rods and hands sounds
  - Dynamic articulations
  - Brush kits and cymbals
  - Bfd3 v. 3.2.1.2 or above required
  - Windows 7 or above
  - Os x 10.8 or above
  - 23 GB disk space required
  - Internet connection for download and authorization
  - SSD recommended
