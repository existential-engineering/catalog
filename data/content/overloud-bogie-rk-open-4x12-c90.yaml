description: Choptones supercab IR library created by capturing a mesa boogie
  4x12 road king with mesa boogie black shadow mc90 speakers.
details: |-
  It is an extensive and systematic capture created with 12 microphones, 8 to 16
  positions each microphone and multiple mic preamps, for more than 300 irs
  globally.

  The cabinet is slanted front, closed back (left) open back (right), marine
  grade baltic birch plywood construction, a swiss knife for guitar tone due to
  the hybrid closed/open back structure.

  The speaker, exclusively made by celestion from mesa, this speaker is great
  when paired with open back cabs with its great headroom and tone complexity.

  The library is created for the th-u supercabinet, which allows to graphically
  browse the irs in the library, blend them together, craft new cabinet tones
  with the unique multiband mode, use the ir in the software, and export the irs
  in .wav, compatible with the software ir loaders and all the major hardware
  modelers.
specs: |-
  - 12 microphones
