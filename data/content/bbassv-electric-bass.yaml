details: |-
  Bbassv is an electric bass instrument for Kontakt. The library features 964 MB
  (lossless compressed) with 6517 samples. Samples are looped after roughly 6
  seconds to save on RAM. The instrument includes 4 sustaining dynamic layers
  that are chromatically sampled with 4 round robins for each note/dynamic, and
  all 5 strings are sampled in their length with 8 release trails layers for
  each note/string.

  Main articulations include fingered, fingered mute and harmonics. The samples
  were recorded with a millennia di preamps fed direct into apogee converters at
  24-bit / 96 khz, and released at 24-bit / 44.1 khz.

  Kontakt engine features include a custom user interface, velocity curve
  management, and intelligent auto-fretting algorithms developed in-house that
  emulate different bass players' way of playing. Manual fretting is available
  for advanced users, and advanced legato and slide-to technology allows for
  slides of any duration and interval, controllable with your playing.

  The instrument includes custom vibrato modeled after real bassists' vibratos,
  an effects section specially tuned for bass instruments, and 172 custom
  cabinet+mic combinations irs for maximum tonal realism. The thoughtful user
  interface design eliminates the need to learn tons of key-switches.

  Bbassv works as stand-alone, AAX, rtas, AU and VST for mac and pc. System
  requirements include 2 gb ram (more if loading additional sample sets),
  core2duo or equivalent processor, kontakt retail version v5.4.3 or newer, and
  a MIDI keyboard.
