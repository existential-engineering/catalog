description: The most complete and researched SWAT sound effects library ever made. Features recordings of 26 weapons frequently used by SWAT units. Recorded by Charles Maynes (Spider-Man, Call of Duty, Resident Evil) with additional gun foley by Matthew E. Taylor (Blood Diamond, Mission Impossible, Grindhouse).
details: |-
  Intervention is the most complete and researched SWAT sound effects library ever made. It features recordings of 26 weapons frequently used by SWAT units, offering a complete sound pack to work on modern films, television and games.

  The weapons are recorded by Charles Maynes (Spider-Man, Call of Duty and Resident Evil) and additional gun Foley recorded by Matthew E. Taylor (Blood Diamond, Mission Impossible and Grindhouse). Both are reputed as the go-to people in Hollywood and games for weapon recordings.

  This library is packed with a huge range of multi-mic'd recordings and designed sweeteners from SoundMorph. There are plenty of additional Foley, utilities, boots, explosives, gun handling, and gear body movements.

  All 26 weapons can be performed to sync directly in a session using Weaponiser, with 159 Weaponiser presets. You get thousands of pre-designed variations of single shots and bursts, in various environments, available straight out of the box, and can perform bursts of any duration or timing using the granular burst presets. You can mix between weapon layers, perspectives and environments when using the Weaponiser integration.

  Weapons recorded for this library include the 1911, M&P9, M4A1, M16, Benelli M4, Saiga 12, MK18Mod0, MP5, Remington 700, Remington 870, SIG 552 and SIG P226, most with suppressed variants, plus burst variations, shot variations (dry, open exterior, interior), Foley reloads, magazine inserts, cocking, body gear movements, night vision goggles, battering rams, large explosives, explosive sweeteners and designed gun handling.
specs: |-
  - 26 Weapons
