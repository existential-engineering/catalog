details: |-
  Japanese taiko grooves is a groove pack for bfd3 and bfd2 designed in
  conjunction with japanese taiko percussion. It features a variety of types of
  authentic taiko performances designed especially for the instruments provided
  with the jtp expansion pack.

  Japanese taiko grooves features over 40 palettes for use with japanese taiko
  percussion and bfd3 or bfd2.
specs: |-
  - Over 40 groove palettes
  - Authentic japanese taiko performances
  - Compatible with bfd3 or bfd2
  - Requires japanese taiko percussion expansion pack
  - Windows 7 or higher
  - Os x 10.6.8 or higher
  - Bfd3 or bfd2 (v2.1 or higher)
  - Internet connection required for download and authorization
  - 6.4 GB hard drive space for full install
