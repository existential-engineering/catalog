details: |-
  Ableton Drum Racks for ezDrummer Action EZX features separate Ableton drum
  racks for all factory presets for the toontrack ezdrummer action! Ezx
  expansion library featuring mappings for all toontrack's factory presets.
  These racks are the most complete integration between Ableton live and
  toontrack ezdrummer including a host of features ready to use on Ableton push.

  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all action kit factory presets from ableton push
  controller device browser. 44 ableton drum racks to instantly load the factory
  library "mix ready" presets with ableton mappings.

  22 ableton live templates designed to host the multi channel output routing
  presets with track level audio routing. Colour coded pad design for visual
  performance and finger drumming. All our racks use consistent drum rack
  colouring so you can visually and immediately spot your snares from your
  crashes. Know your action toms from your fx and texture articulations.

  Massive views of instrument articulations ready to go in one layout using
  ableton push 64 pad layout mode. Individually labelled drum rack pads for
  clear visualisation, post performance editing and automation to all drum rack
  / instrument articulations in ableton.

  Ableton macros mapped to toontrack ezdrummer macros with preset values for
  ease of use in push and simple to use automation programming. Ableton macros
  are color coded to match the ezdrummer display. Singleout presets featuring 22
  ableton drum racks for all factory presets single audio output to single
  ableton track. Multiout presets featuring 22 ableton drum racks for all
  presets in multiple audio channel output from the plug in to multiple ableton
  audio tracks using the multi output ableton template also provided designed
  for the kit presets.
specs: |-
  - 44 Ableton drum racks
  - 22 Ableton live templates
  - Ableton push 64 pad layout mode
  - Colour coded pad design
  - Individually labelled drum rack pads
  - Ableton macros mapped to toontrack ezdrummer macros
  - Singleout presets with single audio output
  - Multiout presets with multiple audio channel output
  - Track level audio routing
  - Ableton push controller integration
  - Factory preset mappings
