details: |-
  Colin Brittain is an accomplished producer, songwriter and multi-instrumentalist whose work consistently hits number one on the Billboard charts. His credits include platinum LPs and singles for 5 Seconds of Summer, One OK Rock, All Time Low, Avicii and Papa Roach, with back-to-back number one debut albums for One OK Rock, All Time Low and Papa Roach. His singles for Papa Roach landed them two number one mainstream rock songs from the same album, and an iHeartRadio nomination for Rock Song of the Year with "Help". In 2024 he joined Linkin Park as co-producer and drummer.

  Built from Colin's collection of gear, this is an extensive pack of guitar and bass tones.

  Colin's pack contains 95 captures.
