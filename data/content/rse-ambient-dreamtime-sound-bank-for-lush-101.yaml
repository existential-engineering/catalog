details: |-
  Touch the universe productions is extremely pleased to introduce the ambient
  dreamtime soundset for lush-101, a genre transcending, Massive assortment of
  over 225 multi-layered pads, textures, soundscapes, and rhythmic sequences for
  the latest cutting edge productions.

  Lush-101 is an absolutely beautiful sounding synthesizer with extremely high
  technical capabilities and mind blowing effects perfect for evolving
  soundscapes and complex pad sound design.

  This soundset take full advantage of the polyphonic multi-timbral nature of
  lush-101 with deep sonic precision and sonic playfulness. Not only is there a
  prolific amount of presets and variations, but each one is complex
  multi-layered patch, gracefully interwoven with complex modulation assignments
  for an expressive, evolving performance sometimes up to 18 modulation wheel
  assignments and 8 layers per patch!

  This massive collection of thick, ultra-lush pads and textures are awash with
  shimmering warmth, airy richness, and internal movement for seriously deep
  modulating, self-oscillating, formant singing, and dreamy atmospherics.

  Paired with complex, high tech, multi-layered sequences, ambient dreamtime
  offers a powerful and creative combination for futuristic creative expressions
  for any genre.
specs: |-
  - Over 225 multi-layered pads
  - Polyphonic multi-timbral
  - Up to 18 modulation wheel assignments
  - 8 layers per patch
  - Complex modulation assignments
  - Multi-layered sequences
  - Textures
  - Soundscapes
  - Rhythmic sequences
