description: A specialized sound library filled with otherworldly, supernatural, and cinematic sounds designed for audio professionals. Contains professional recordings and sound designs suitable for TV, film, video games, trailers, post-production, and music projects. Includes 50 Weaponiser presets and standalone WAV files.
details: |-
  The Magic Sound Effects Library by Krotos is a specialised sound library filled with otherworldly, supernatural, cinematic sounds.

  Professionally recorded and designed by Krotos, this high-quality sound library offers a selection of 476 assets ranging from elements to jangles, chimes, shimmering sparks, deep blasts and cinematic shards, for TV, film, video games, trailers, other post-production, and music projects.

  The library includes 50 Weaponiser presets, and the purchase contains two downloads: a zip file with all source sound effect asset files and a Metadata PDF, plus an installer for the integrated Weaponiser library including assets and presets.

  Sound categories included are Magic Spells, Sparks, Wind Chimes and Balloons. Keywords cover balloon, bowed cymbals, bubbles, electrical sparks, electro-magnetic pick-up, designed fire, designed ice, key jangles, reversed cymbals, mixed whooshes, designed water, wind chimes and designed wind.
