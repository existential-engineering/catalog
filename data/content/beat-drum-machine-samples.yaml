details: |-
  Beat - drum machine samples is ModeAudio's biggest ever drum library, packing
  in 460 exquisitely-sampled drum machine sounds that combine the warmth and
  crunch of the analog era with the ultra-sharp attack and punch of modern sound
  design!

  Delving head-first into our collection of vintage hardware, we've captured the
  pure thump of the 505, subsonic boom of the 808, crisp pulse of the 909 and
  the ecstatically 12-bit crunch of our beloved toy keyboard to slot seamlessly
  into your next thunderous rhythm.

  From deep, clicky kicks, weighty snares and slicing hi hats to bellowing toms,
  spiky claps, splashy cymbals and a full range of exotic percussion including
  rims, bongos, cow bells, clave, timbales and shakers, we've lovingly recorded
  every celebrated nuance of our classic rhythm machines and processed them just
  enough to bring out the very best in each explosive sound.

  Featuring 3 varieties of vibrant drum machine flavour, this collection spans a
  folder of slamming processed samples, carefully mixed and matched layered
  samples and finally the set of raw drum machine samples themselves. We've
  targeted 4 different genres within the layered samples folder, crafting
  individual sets of 16 drum samples in the styles of driven, dusty la beats,
  crushed chillwave, banging house and rock-solid hip hop.

  Alongside the drum sounds themselves are 12 drum kit sampler patches,
  precision mixed, matched and choke-assigned for instant use in your
  productions. In addition to the genres above, we've curated each drum kit to
  excel in your synthwave, trap, techno and lofi beats, with 4 bonus channel
  strip presets thrown in for bolstering your drum tracks up to release standard
  also.
