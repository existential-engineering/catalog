details: |-
  Book of prog: pads is a collection of 50 vintage long synth presets for cherry
  audio pro soloist synth plugin that focuses in the 70's progressive rock
  genre.

  Within those synth pads a lot of classic sounds are included as well as some
  sounds that vary from soft strings to hammond like organs and from rhythmic
  pads to nice evolving long sounds.

  Presets were designed with pro soloist 1.0.4 (build 92) and run best with this
  or newer edition.
specs: |-
  - 50 vintage long synth presets
  - 70's progressive rock genre
  - Soft strings sounds
  - Hammond-like organs
  - Rhythmic pads
  - Evolving long sounds
  - Compatible with pro soloist 1.0.4 (build 92) and newer
