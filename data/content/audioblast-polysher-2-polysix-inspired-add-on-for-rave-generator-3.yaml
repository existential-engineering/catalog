description: Polysher 2 is a Polysix-inspired add-on for Rave Generator 3 featuring retro synth presets with stabs, basses, leads and pads for 80s, 90s house.
details: |-
  Polysher 2 is the next chapter in the Polysher series, a Polysix-inspired add-on for Rave Generator 3 designed for producers who love retro analog tones, musical grooves, and classic electronic textures.

  Building on the foundation of the first volume, Polysher 2 introduces a brand-new set of presets with an even stronger focus on depth, warmth, and flexibility. The sounds are crafted to deliver that unmistakable 80s and 90s character, perfect for house, old-school trance, synthwave, and funky electronic music.

  Inside, you'll find a refined palette of shiny yet smooth stabs, round and groovy basses, clean and expressive leads, and wide atmospheric pads. Each sound is designed to sit naturally in the mix while adding clarity, movement, and analog-style richness.

  Polysher 2 brings a fresh collection of 128 brand-new presets, expanding the retro Polysix-inspired sound with a stronger focus on musicality, groove, and vintage character. It is ideal for producers looking to expand their sonic arsenal with authentic vintage-inspired sounds, ready to use instantly inside Rave Generator 3.
