details: |-
  Seven deeply sampled acoustic folk instruments assembled as a fully arrange-able ensemble.

  "Songwriting means everything to me and I've spent a lot of my living and learning in that world. Even when its tenets are taken from their original context and employed in movies or video games it tends to stir the quiet and honest parts of us. When I sat behind the mics to start making this library I played the instruments the way I do when I'm writing and producing folk music: very vulnerably and not too seriously.

  Each instrument was played in a different part of an old room; this is another important pillar in the library. You now have the ability to move the instruments around the room and listen as the room and the instruments react to each-other as well as the final say on just how much mic bleed there is."
specs: |-
  - Seven deeply sampled acoustic folk instruments, arrangeable as an ensemble
  - Each instrument recorded in a different part of one room, with movable positions and mic bleed control
  - Kontakt Player included (free download)
  - Spitfire Audio App required
