details: |-
  Art Deco Piano is a faithful recreation of a classic 1930's blthner ph grand
  piano. This is one of the most sonically and visually striking pianos ever
  made. Its iconic swooping and curvy design comes courtesy of danish designer
  poul henningsen. Made without a traditional wood cabinet, its build of metal,
  leather and other materials offers a bright and modern sound that we captured
  with a matched pair of neumann tlm-170r condenser microphones running into
  top-quality studio preamps.

  Each note has been meticulously sampled at 8 specific velocities for easy
  playability. We've also omitted a few notes where necessary to ensure smooth
  key transitions and uniform tonality across the keyboard. It also includes a
  model of the actual recorded piano's soundboard (piano 4) for sampletank's
  acoustic resonance effect.

  The collection includes 10 instruments: art deco piano, art deco piano bright,
  art deco piano dark, art deco warm parlour, art deco piano tank, art deco
  piano chorus, art deco piano flange, art deco chorus-flange, art deco phase 1,
  and art deco phase 2.

  Art deco piano is an audiophile-grade sampletank instrument collection that
  includes over 1gb of content with more than 600 sonically rich stereo samples.

  Its bright tonality makes it a fantastic choice for pop, rock, r&b, jazz,
  classical and just about any other style of music that calls for a lively and
  aggressive sound.
