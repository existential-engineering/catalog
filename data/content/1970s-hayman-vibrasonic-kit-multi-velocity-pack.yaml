details: >-
  The 1970s hayman vibrasonic kit - multi-velocity pack as mixed by stephen
  street (blur / the smiths) comes with patches for eleven different samplers
  and contains 480 stereo 24-bit wav samples.


  The particular kit we sampled is from around 1970 and was their standard five
  piece kit comprising of a 22" x 14" bass drum, 12" x 8" and 13" x 9" toms and
  a 16" x 16" floor tom. It's in a rather fetching metallic blue finish, though
  you might not be able to tell this from the samples.


  The snares that we sampled with this kit are two of the best ever produced...
  The metal shelled ludwig 400 and the wooden slingerland radio king. The
  cymbals used were all old sixties and seventies models commonly used at the
  time. The hihats were made by an english company called zyn. The ride we used
  is an old tosco 20" ride, thin and washy but with just enough ping to let
  rhythms cut through. The crash we used is made by paiste a swiss company, and
  this is an 18" medium from their popular 2002 range which was introduced in
  the 1970s.


  The "multi-velocity pack" is suited for customers who want multiple velocity
  levels of each articulation. You can either use our built in patches or build
  your own using the samples included. The pack includes up to sixteen
  velocities of each articulation totalling 480 drum samples. All of the samples
  are mixed from a combination of the overhead, room and close mics recorded as
  24-bit 44.1 khz wav files, meaning they can be loaded into almost any sampler
  or drum machine.


  We also include 830 MIDI loops to the multi-velocity packs, covering a variety
  of genres. The loops are mapped to the default MIDI map.
