details: |-
  Flame Audio presents new modern sample pack! '21 MoneYear' is a sample pack
  containing five commercial hip hop/trap construction kits inspired by
  chart-topping artists like roddy ricch, drake, offset, gunna, travis scott,
  shindy and others.

  This pack features fresh and modern melody patterns, hard-hitting kicks, crisp
  snares and claps, bone-crushing 808 samples, pads and atmospheres,
  custom-processed flutes, keys, bouncy drums and more.

  MIDI files are included to offer you full flexibility and bpm tags are
  included for easy reference, allowing you to tweak each composition to suit
  your needs, including tempo, root key and even single notes to fit these
  melodies perfectly into your arrangement.

  All sounds have been processed and edited using professional outboard gear to
  ensure authentic analogue warmth.

  Just drag and drop the files into your favourite DAW and you're good to go.
