details: |-
  Adrenaline - Jump Up XL is a Drum & Bass sample pack from Black Octopus Sound, built around aggressive Jump Up sounds and totalling 949 sounds across drums, bass, synths, FX and Serum presets.

  There is a mammoth amount of aggressive drum one-shots and energized, punchy drum loops to choose from. Versatile claps, crashes, hi-hats, kicks, percs, rides, rimshots and snare one-shots fill out productions, alongside heavy duty build ups, breaks, fills, tops, percs, kick and snare loops, and full drum loops.

  The Serum presets cover raw, heavy basses and screeching synths for writing original melodies. A large FX section adds atmospheric loops, energetic risers, smooth transitions, synthy downers and an array of unique 8-bit flavoured sounds.

  Melodic content comes from synth loops and one-shots plus bold ambient one-shots, while the bass section supplies pounding bass one-shots and loops aimed at subs and knockout melodic lines.
