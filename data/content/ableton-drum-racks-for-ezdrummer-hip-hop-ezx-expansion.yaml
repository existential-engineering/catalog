description: Ableton drum racks for ezdrummer hip-hop. Ezx expansion ableton
  drum racks for ezdrummer hip-hop. Ezx features separate ableton drum racks
details: |-
  Ableton drum racks for ezdrummer hip-hop. Ezx features separate ableton drum racks for all factory presets for the toontrack ezdrummer hip-hop. Ezx expansion. These ableton drum racks for ezdrummer are the most complete integration between ableton live and toontrack ezdrummer including a host of features ready to use on ableton push.

  All factory presets are ready to go, including multiple audio channel output presets for all factory content and free ableton live multiout routing templates. Amazing workflow in live and on your push to the full capabilities of the kit library saving setup time and allowing you to focus on music creation.

  46 ableton drum racks to instantly load the factory library "mix ready" presets with ableton mappings. 23 ableton live templates for the multichannel audio routing of ezdrummer drum racks based upon the hip-hop. Ezx expansion factory content to instantly load the factory library "mix ready" presets with ableton mappings.

  Color coded pad design of over 4000 pads mapped to the ezx factory content for visual performance and finger drumming. A massive array of instrument articulations ready to go in one layout using ableton push 64 pad layout mode. Individually labelled drum rack pads for clear visualisation, post performance editing and automation to all drum rack / instrument articulations in ableton.

  Ableton macros mapped to toontrack ezdrummer macros for all factory content with preset values for ease of use on ableton push and simple to use automation programming. Ableton macros are even color coded to match the ezdrummer display. Use the template racks and extend to your own toontrack ezdrummer hip-hop. Ezx presets, swapping out individual sounds or articulations.
specs: |-
  - 46 ableton drum racks
  - 23 ableton live templates for multichannel audio routing
  - Over 4000 pads mapped to ezx factory content
  - Over 4000 individual articulations
  - Color coded pad design
  - Individually labelled drum rack pads
  - Ableton push 64 pad layout mode
  - Singleout presets with single audio output
  - Multiout presets with multiple audio channel output
  - Ableton macros mapped to toontrack ezdrummer macros
  - Color coded ableton macros
  - Ableton live 9.5 or above required
  - Toontrack ezdrummer2 required
  - Toontrack ezdrummer hip-hop ezx expansion required
  - Macos and windows compatible
