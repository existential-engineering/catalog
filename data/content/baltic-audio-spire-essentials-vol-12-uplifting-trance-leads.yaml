details: |-
  64 Spire Presets, 33 MIDI Files for UPLIFTING and EUPHORIC TRANCE.

  'Spire Essentials Vol 12: Uplifting Trance Leads' from baltic audio is a preset pack for producers looking to get the sound of current Uplifting and Euphoric Trance. You'll find 64 top-quality presets for the amazing Spire synthesizer to create hit tracks, including hand-crafted leads, basses, plucks and pads.

  Each preset is perfectly programmed by a professional sound designer and every parameter tweaked with passion and detail and will be your essential source for creating new and commercial sounds within your compositions.

  You can also use it for genres like Progressive House, Dance and more.

  In addition, you'll find 33 MIDI files taken from the demo.

  Please note: The drums and some FX used in the demo are not included in this product.
specs: |-
  - 64 Presets for Spire
  - 50 Leads (Presets)
  - 5 Plucks (Presets)
  - 4 Basses (Presets)
  - 3 Sequences (Presets)
  - 2 Pads (Presets)
  - 33 MIDI files
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
  - Requires Reveal Sound Spire v1.5.0 or higher
