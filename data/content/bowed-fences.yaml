details: |-
  Inspired by the tonal work of artist / musician / mastermind jon rose, we went
  out into the middle of nowhere in south texas and took a cello bow to a
  handful of old barbed wire fences. The end results are delightfully spooky
  fodder for your next sci fi or horror score.

  The 3 main patches consist of unique one shot recordings all of which vary in
  length and timbre. The drones patch contains grisly low end material, the
  whines patch contains higher pitched scream like material, and the hits patch
  contains various metal fence poles and wire which we hit with the bow while
  recording.

  As a bonus, we processed the heck out of these recordings by mangling their
  speed, eq, and timbre to create a series of 14 processed pad patches which
  would accommodate making creepout / tension beds. These all loop and are
  appropriately horrific, with a low pass filter mapped directly to the mod
  wheel, the timbre of these can totally change at the flick of a finger.

  In addition to the processed padlike material, we also included a series of 5
  percussive / impact patches which are well suited for accent or trailer hits.

  The gui is highly tweak able as you have direct access to the lo, mid, and hi
  eq, pitch, reverb (with 13 original impulse responses), attack / release, and
  a grit knob which adds distortion to make the patches even more grimey.
specs: |-
  - Kontakt 4.2+
  - Drones patch
  - Whines patch
  - Hits patch with 6 unique hits and 4 x rr
  - 14 processed pad patches
  - 5 percussive/impact patches
  - Lo, mid, and hi EQ
  - Pitch control
  - Reverb with 13 original impulse responses
  - Attack/release
  - Grit knob with distortion
  - Low pass filter mapped to mod wheel
  - One shot recordings
