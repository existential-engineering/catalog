description: 2396 Acid & Trance MIDI files exported from ABX3. 4-bar loops for Acid House, Trance, Rave & Eurodance. 100% royalty-free.
details: |-
  This MIDI pack delivers 2396 high-quality MIDI files, exported directly from ABX3, Audioblast's powerful bass and lead synthesizer. Every MIDI file is designed as a 4-bar loop, making it ideal for fast workflow, inspiration, and instant groove building.

  Whether you produce Acid House, Acid Techno, Trance, Rave, Eurodance, or Hard Acid, this collection gives you authentic melodic patterns, basslines, and sequences inspired by classic and modern electronic music. All MIDI files are 100% royalty-free and can be used with any software or hardware synthesizer.

  The MIDI content has been extracted and curated from the following ABX3 banks: 100% Acid, 100% Acid Vol. 2, 100% Acid Vol. 3, ABX3 Factory Presets, ABX3 Spooky Halloween Presets, ABX3 Trance Presets Vol. 1, ABX3 Trance Presets Vol. 2, ABX3 Trance Presets Vol. 3, Acid War, AcidBox V2, Chicago Acid House Vol. 1, Eurodance 90's Vol. 1, Eurodance 90's Vol. 2, Grabuge Hard Acid, and Retro80 Synthwave Presets Vol. 1. This ensures a wide stylistic range, from raw 303-style acid lines to melodic trance sequences and 90s-inspired rave patterns.

  The pack covers acid basslines and sequences, trance bass and lead patterns, rave and Eurodance melodies, and hard acid and underground grooves. It suits Acid House, Acid Techno, Trance, Rave, Hard Techno, Eurodance, Electronic Dance Music, Underground Techno, 90s Dance and Synthwave production.
