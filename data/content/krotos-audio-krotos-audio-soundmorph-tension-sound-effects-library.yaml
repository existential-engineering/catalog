description: Tension is a SoundMorph library of shadowy textures, resonant drones, enveloping atmospheres and crisp stingers, built to add impact to desolate scenes and Foley.
details: |-
  Provided by SoundMorph. For sound designers and musicians who infuse their work with dramatic and suspenseful emotions, Tension is a carefully assembled array of shadowy textures, resonant drones, enveloping atmospheres, crisp stingers and beyond.

  These sound effects were crafted to stir feelings of apprehension and unease, and are ideal for creating tension-laden sequences, eerie soundscapes and musical apprehension.

  Tension bridges the realms of sound design and music, sculpting sound into an evocative and spine-chilling auditory journey.

  Sound categories included in this library: Screeches, Drones, Pulses and Horror. Keywords span ambience, anxiety, cinematic, dark, distortion, distress, doom, drama, dread, drone, eerie, experimental, gloom, horror, musical, mysterious, noise, ominous, phone, radio, sci-fi, space, stinger, strain, tension, terror, tone, transmission, unease, vocal, voice and waterphone.

  The purchase contains two downloads: a zip file with all source sound effect asset files plus a metadata PDF, and an installer for the integrated Reformer Pro library.
specs: |-
  - 438 sound files
  - 7.5 GB size
