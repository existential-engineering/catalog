details: |-
  Features legendary bosendorfer 290 acoustic piano with 4 separate mic
  positions: close (stereo and mono), middle, far, and ambience (room).

  Includes up to 12 velocity layers with nearly 31gb of uncompressed sample
  content (compressed to 7 gb) containing 3,157 samples in kontakt lossless
  sample compression format.

  Built-in effects: 3-band equalizer, compressor, saturation, distortion,
  chorus, reverb, delay, stereo width, limiter and more.

  Unique gui has been designed to give a user full control over options and
  effects without slowing down the creative process.
specs: |-
  - 7 GB bosendorfer 290 acoustic piano
  - Ni Kontakt sampler compatible
  - 4 separate mic positions (close stereo, close mono, middle, far, ambience)
  - Up to 12 velocity layers
  - Nearly 31gb uncompressed sample content
  - 3,157 samples in Kontakt lossless sample compression format
  - 3-band equalizer
  - Compressor
  - Saturation
  - Distortion
  - Chorus
  - Reverb
  - Delay
  - Stereo width
  - Limiter
