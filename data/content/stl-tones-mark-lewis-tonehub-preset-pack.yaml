details: |-
  Mark Lewis is an American heavy metal producer and mix engineer from Nashville, Tennessee. He has engineered, produced or mixed records for Trivium, Whitechapel, DevilDriver, The Black Dahlia Murder, Cannibal Corpse, Chimaira, August Burns Red, Unearth, Carnifex, Havok and Bury Your Dead.

  Built from Mark's collection of pedals, amps and cabs, this pack includes some extremely sought-after album tones from his recent works.

  Mark's pack contains 40 captures.
