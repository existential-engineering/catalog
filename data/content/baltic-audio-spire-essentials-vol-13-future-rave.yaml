details: |-
  64 Spire Presets, 46 MIDI Files for FUTURE RAVE and EDM.

  'Spire Essentials Vol 13 - Future Rave' from baltic audio is a preset pack for producers looking to get the sound of current Future Rave. You'll find 64 top-quality presets for the amazing Spire synthesizer to create hit tracks, including hand-crafted leads, basses, plucks and pads.

  Each preset is perfectly programmed by a professional sound designer and every parameter tweaked with passion and detail and will be your essential source for creating new and commercial sounds within your compositions.

  You can also use it for genres like Bigroom EDM, Techno, Dance and more.

  In addition, you'll find 46 MIDI files taken from the demo.

  Please note: The drums and some FX used in the demo are not included in this product.
specs: |-
  - 64 Presets for Spire
  - 20 Leads (Presets)
  - 16 Basses (Presets)
  - 10 Synths (Presets)
  - 6 Plucks (Presets)
  - 5 Pads (Presets)
  - 4 Arps (Presets)
  - 2 FX (Presets)
  - 1 Drum (Presets)
  - 46 MIDI files
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
  - Requires Reveal Sound Spire v1.5.0 or higher
