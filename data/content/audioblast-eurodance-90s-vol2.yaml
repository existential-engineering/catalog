details: |-
  Eurodance 90s Vol.2 is a dedicated ABX3 preset bank inspired by the iconic Eurodance and 90s dance sound that ruled clubs and charts worldwide. This volume expands on Vol.1 with 128 carefully crafted presets, designed to deliver powerful basslines, catchy leads, and energetic sequencer/arp patterns, all perfectly optimized for the ABX3 bass synthesizer.

  Every sound is programmed to capture the punch, brightness, and groove of classic 90s Eurodance while remaining fully usable in modern productions. The bank covers Eurodance, 90s dance and club, trance-influenced dance, rave and old-school EDM, as well as modern tracks with a classic 90s vibe.
