description: "Eurodance 90s Vol.2 for ABX3 delivers 128 authentic 90s Eurodance presets: 32 Basses, 64 Leads and 32 Sequences/Arps. Perfect for Eurodance, Dance."
details: |-
  Eurodance 90s Vol.2 is a dedicated ABX3 preset bank inspired by the iconic Eurodance and 90s dance sound that ruled clubs and charts worldwide.

  This volume expands on Vol.1 with 128 carefully crafted presets, designed to deliver powerful basslines, catchy leads, and energetic sequencer/arp patterns, all perfectly optimized for the ABX3 bass synthesizer.

  Every sound is programmed to capture the punch, brightness, and groove of classic 90s Eurodance while remaining fully usable in modern productions.

  The bank is aimed at Eurodance, 90s dance and club, Trance-influenced dance, rave and old-school EDM, and modern tracks with a classic 90s vibe.
specs: |-
  - 128 presets for the ABX3 bass synthesizer
  - 32 bass presets tailored for Eurodance, dance and 90s-inspired club tracks
  - 64 lead presets for hooks, riffs and melodies
  - 32 sequencer / arpeggiator presets
  - 100% compatible with ABX3, no external processing required
  - Bonus: 128 MIDI files
  - Bonus: 128 loops
