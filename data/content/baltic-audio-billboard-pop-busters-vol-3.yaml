details: |-
  'Billboard Pop Busters Vol 3' from baltic audio contains six Pop construction kits with the elements needed to build chart-style Pop tracks, including drums, basses, synths, instruments and vocal chops.

  Each kit contains mixed instrumentation aimed at commercial Pop production and is arranged so a vocal topline can be added.

  MIDI files are included for the majority of musical phrases heard in these kits, so phrases can be adapted and used to trigger any synth or sampler. The MIDI files can be combined with the included key-tagged one-shot files to create new phrases and patterns that blend with the pre-recorded content.
