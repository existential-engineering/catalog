details: |-
  'back on road' by Flame Audio contains 60 hot melodic samples and 30 MIDI
  loops in a trap/hip hop style. This pack was created with vintage effects and
  analogue gear to give it that organic feel that is mostly missing from modern
  music.

  The melodies come in a range of keys and were made with pads, keys, synths,
  guitars, flutes, bells and more. Everything included can be used in your
  production 100% royalty-free.

  Inside you'll find tools to help you create a top billboard record. Use the
  loops to build compositions around or add them to a drum track you've already
  made. All sound files are professionally mixed and mastered.

  This pack was crafted to give you the ultimate producer experience when it
  comes to making modern trap music and has everything you need to keep you
  ahead of the trend, bringing you only the freshest and up-to-date sounds for
  your music production.
