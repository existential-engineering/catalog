details: |-
  Atmos inhabits the space between the real and the fantastical. Bjulin's work
  evokes the dimension, emotion and atmosphere of various scenes like floating
  high above the clouds or standing at the edge of a mysterious forest. All 128
  presets in this collection of arpeggios, leads, pads and ambient effects are
  permeated with a sense of space.

  Bjulin created the pure sounds to be sophisticated from the start, but
  applying diva's built-in effects thoughtfully, he manage to highlight each
  unique atmosphere and ambience. Atmos is especially well suited for ambient,
  chillout and downtempo music, but can fit easily into almost any of your music
  projects.

  Yoel kumbolu a.k.a. Bjulin became interested in synthesizers at a very young
  age after discovering rave music in the 1990s, and has been producing
  electronic music ever since. Atmos is bjulin's first soundset to be
  distributed by u-he.
