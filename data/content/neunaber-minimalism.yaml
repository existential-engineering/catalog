details: |-
  Here's a hot new sound for the 1970s, straight from the Big Apple! Mesmerizing musical kaleidoscopes throb from East Village loft windows and trendy art gallery doors, where less is definitely more More MORE! And you are right in the scene with the new Optigan Minimalism program disc! Your left hand conducts a tight ensemble of organ, flute, saxophones and bass clarinet - with pulsing bass on the special effect tabs, and whirling arpeggios on the chord buttons. Your right hand plays vocal solfege melodies, sung for you by none other than Tara Busch of AnalogSuicide.com! So fill your glass with magical notes and take a deep, satisfying gulp from the sonic ocean of Minimalism! Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility
