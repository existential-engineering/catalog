description: Behemoth - Ultimate Drums & FX is a large scale sample pack from
  Black Octopus Sound focusing on drum one shots & FX samples.
details: |-
  This pack contains all the necessary samples to create drum patterns & loops
  from scratch. All of the sounds have been processed to cut through the mix
  with little or no extra processing needed.

  The fx section contains risers, enders, falls, one shots, and bonus
  atmospheric sounds.

  The drumloops range from 80-140 bpm and feature many glitched fill variations
  and fx.
specs: |-
  - 24-bit wav format
  - 3.1 GB size (2.38 GB compressed)
  - Nearly 4000 drum & FX samples
  - 35 full drum & FX loop kits
  - 735 mangled drum loops & FX chains
  - 200 FX enders
  - 432 FX falls
  - 432 FX risers
  - 35 FX one shots
  - 200 claps
  - 100 click cymbals
  - 100 closed hi-hats
  - 25 crash cymbals
  - 250 open hi-hats
  - 50 cymbal rides
  - 512 kick drums
  - 100 mini glitch percussion
  - 200 skin hand drums
  - 100 wood percussion
  - 100 shakers
  - 250 snare drums
  - Bonus atmospheres
  - Drum loops range from 80-140 bpm
  - Glitched fill variations and FX
