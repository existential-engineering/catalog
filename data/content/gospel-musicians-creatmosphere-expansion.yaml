details: |-
  The ultimate soundscape and atmosphere expansion for Pure Synth Platinum 2. This expansion contains the most beautiful and rich soundscapes and inspiring pad sounds. Our goal with this expansion was extreme warmth and movement. We've used old school EX5 tricks by putting a ton of water and rain effects with many of our sounds to create a beautiful soundscape. The richness of these soundscapes are remarkable and will add an amazingly rich all purpose pad library to your collection.
