details: >-
  Ambicon is a set of ambient/atmospheric presets for uvi falcon, built to offer
  ever shifting and changing timbres producing cinematic, hypnotic atmospheres,
  expansive soundscapes, shifting drones, dark ambiences, padscapes, and pulses.


  Designed for cinematic, tv/film work, underscores, ambient and experimental
  compositions of all kinds. Ambicon makes extensive use of the ircam granular
  and multi-granular engines, and includes hand-built source material designed
  for use in granular engines.


  Ambicon includes 50 dual voice presets each featuring two granular voices with
  their own independent filter, frequency shifter and trance gate. 12 presets
  also include a third pluck voice for realistic instrumental attack sounds.


  Over 170mb of unique wave file data for the granular engines. In-line delay
  and reverb effects. 10 falcon multis for even more ambient atmospheric
  textures.
specs: |-
  - Ircam granular engine
  - Multi-granular engine
  - Dual voice presets
  - Independent filter per voice
  - Frequency shifter
  - Trance gate
  - Pluck voice
  - In-line delay
  - In-line reverb
  - Falcon multis
