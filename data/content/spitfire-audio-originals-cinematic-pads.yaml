details: |-
  Made from symphonic orchestral recordings, originally captured at AIR Studios, London. Treated and warped to create a range of classic pad sounds — from rich, dystopian tension beds to celestial, ethereal textures. 23 presets, made from 45 pads. Six controls. Three signals. 'Cinematic' signal created using outboard, hardware reverbs and effects.

  Originals Cinematic Pads requires the free Splice INSTRUMENT plugin to run.
specs: |-
  - 23 presets made from 45 pads
  - Six controls
  - 3 signals: Mellow, Bright, Cinematic (through hardware reverbs)
  - 2.7 GB
  - Built from symphonic orchestral recordings captured at AIR Studios, London
  - Requires the free Splice INSTRUMENT plugin and a free Splice account
  - macOS 12 or later
