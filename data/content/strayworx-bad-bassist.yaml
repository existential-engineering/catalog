description: Bad Bassist is a deep sampled sound library of an ibanez srx305
  bass guitar through a powerstate pbt100+bb15 combo, using fingered playing.
details: |-
  Bad Bassist is a deep sampled sound library of an ibanez srx305 bass guitar
  through a powerstate pbt100+bb15 combo, using "fingered" playing technique.
  This is not one of the usual bass guitar sample libraries, it has some unusual
  and different extra features.

  The srx305 has a nice tone, good for backing, adds deep and rich bass sound to
  your music. If you use it as a normal bass guitar library, then it sounds as a
  normal bass guitar library. It doesn't contain much features, there are no
  various playing techniques inside, just a simple and easy to use bass guitar
  instrument.

  Switch it to bad bassist mode and experience a totally different way of
  playing the bass: unique sound with bad and randomly played notes. Your music
  won't be the same twice.

  Use the random knob (or mod wheel) to enable random bad notes during playing.
  Tweak it for more or less bad notes. Noise randomize knob is good for adding
  extra string noises. Noise volume knob controls the loudness of additional
  string noises. Muted notes volume knob sets the loudness of muted notes (note
  off events).
specs: |-
  - Ibanez srx305 bass guitar sampling
  - Powerstate pbt100+bb15 combo
  - Fingered playing technique
  - E2-e4 sustained/muted notes
  - C2-c#2 slaps/mutes
  - E1-a1 down-slides
  - C1 string noises
  - 4 round robin in normal mode
  - 6 round robin in Bad Bassist mode
  - Kontakt 4.2+ (full version) required
  - 90 MB file size (Kontakt lossless compressed format)
  - Random knob/mod wheel control
  - Noise randomize knob
  - Noise volume knob
  - Muted notes volume knob
