details: |-
  Organic Flairs is an expansion pack for Tomofon, with audio models and presets inspired by the beauty and energy of the natural environment. The collection's sounds range from bright tonalities and resonant objects to raw vocals, hypnotic textures, and lush, immersive soundscapes. It's ideal for creators looking to infuse their work with a unique touch of organic authenticity.

  Sourced from timeless natural sounds like birds, bubbles, vocals, wind chimes, the breaking ice and snow, a rainstick and the waves of the ocean. Let these sounds flair your inspiration and take them further into mystical territories of your own exploration.

  This is an Expansion Pack for Tomofon, so a Tomofon license (bought separately) or the installed iOS app is also required to use it.

  The Tomofon Expansion Pack works both on macOS/Windows and iOS.
