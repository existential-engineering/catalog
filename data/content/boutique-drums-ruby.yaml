details: |-
  Ruby is the first release of our boutique drums series. It began when we asked
  a bunch of our producer/mixer buddies what they were looking for in a drum
  library and it always came down to two things: keep it dirt-simple to use and
  have the sound banging right out the gate. We consulted with our drummer brian
  scoggin (casting crowns) who curated a rock kit comprised of truly boutique
  drum pieces for ruby.

  We also chose to record at hey hey studios in griffin, georgia for it's
  outstanding acoustics and engineering; a remarkable space providing a tasteful
  balance of both room and character. To address the calling for simplicity, we
  created a single-page interface that offers a fast and intuitive way to
  develop customized drum mixes.

  We've included eight different "baked-in" mix presets that were designed to
  not only work on their own, but are completely interchangeable between the
  different drum groups. Each of the eight mixes were created from scratch using
  an arsenal of processing tools, both hardware and software. We chose to
  develop the presets outside of kontakt to deliver what we felt were precision
  mixes with the right amount of punch, balance and vibe while providing just
  enough headroom to treat well to additional processing.

  Under the hood, ruby also alternates between two different sets of hi-hat/ride
  multisamples; depending on how quickly you hit successive notes for the given
  articulation. The initial hit triggers the isolated sample while subsequent
  hits trigger repetition samples. We've included five different hi-hat states
  of multisamples and live eighth-note grooves that automatically lock to your
  DAW's tempo: tight, normal, slight-open, mid-open and all-open; grooves
  recorded at 90/120/140 bpm.

  We've also developed what we consider to be a first -- crossfadeable hi-hat
  grooves with release triggers. With the modwheel down, it'll play the loop at
  it's tightest hi-hat state. As you push the modwheel up, the hi-hat opens up.
specs: |-
  - Single-page interface
  - Eight baked-in mix presets
  - Kick, snare, cross sticks, rimshots
  - Five hi-hat state multisamples/grooves
  - Crossfadeable hi-hat grooves with release triggers
  - Hi-hat chicks, three toms, ride cymbal with crash
  - Ride bell and two crash cymbals
  - Repetition sampling for all rides/hi-hat multisamples
  - Live eighth-note hi-hat grooves at 90/120/140 bpm
  - DAW tempo sync
  - Groove speed control (half/normal/double)
  - Humanization feature (off/tight/natural/loose)
  - Volume control for each drum group
  - Assignable Kontakt outputs for each drum group
  - Recorded in 48khz/24-bit
  - 8.6 GB compressed ncw format
  - Kontakt 5.8.1 or higher required (full retail version)
