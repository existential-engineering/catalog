details: >-
  Ableton drum racks for superior drummer 3 hard rock ezx features separate
  ableton drum racks for all factory presets for the toontrack superior drummer
  3 and hard rock ezx library for toontrack ezdrummer. All factory content
  including bob rock and toontrack's presets mapped and optimised.


  These racks provide out of the box integration workflow between ableton live
  and toontrack superior drummer 3 using the toontrack libraries including a
  host of features ready to use for composition and performance using ableton
  push or similar controllers.


  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all hard rock ezx factory presets from ableton push
  controller device browser.


  22 ableton drum racks to instantly load the factory library "mix ready"
  presets with ableton mappings. 11 ableton live templates designed to host the
  multi channel output routing presets with track level audio routing from
  superior drummer 3 into ableton live.


  Colour coded pad design for visual performance and finger drumming. All our
  racks use consistent drum rack colouring so you can visually and immediately
  spot your rides from your hi hat articulations. Vast array of instrument
  articulations ready to go in one massive layout using ableton push 64 pad
  layout mode.
specs: |-
  - Ableton drum racks
  - Toontrack superior drummer 3 integration
  - Hard rock ezx library support
  - Ableton push controller compatibility
  - 22 ableton drum racks
  - 11 ableton live templates
  - Multi-channel output routing
  - Single output presets
  - Multi-output presets
  - Colour coded pad design
  - 64 pad layout mode
  - Individually labelled drum rack pads
  - Ableton macros mapped to toontrack superior drummer macros
  - Audio routing and mixing
  - Ableton track mixer integration
  - Ableton 10 drum buss support
  - Macos and windows compatibility
