details: |-
  Avenoir includes 16 banks for ohmforce's ohmboyz VST delay device (each bank
  contains 8 presets) total presets = 128.

  This is my second set for ohmboyz and of all the many many delays that I own,
  ohmboyz will always have a special place in my musical palette. The very first
  preset that I ever pulled up on ohmboyz so many years ago was one called
  "simple delay lpf lfo". It has a wonderful filter sweep of the delay signal
  across the stereo field. It is magnificient. That preset was the inspiration
  for this set that became avenoir.

  There are pitch shifters, reverses, both..., use of square wave lfo's to
  create odd delay time interplay and lots of nice and not so nice filter
  sweeps. I do so love the ohmforce filters.

  Avenoir: n. The desire that memory could flow backward. We take it for granted
  that life moves forward. But you move as a rower moves, facing backwards: you
  can see where you've been, but not where you're going. And your boat is
  steered by a younger version of you. It's hard not to wonder what life would
  be like facing the other way... This is the definition of the word "avenoir"
  ...from the dictionary of obscure sorrows.

  When I read this definition, I thought it was an appropriate way to describe
  the sort of "echos" that I have tried to create in this set of presets for
  ohmforce ohmboyz. Echoes are literally revisitations of the past...and I'd
  like to say that this set brings a unique set of revisitations to your DAW;)
specs: |-
  - 16 banks
  - 8 presets per bank
  - 128 total presets
  - Pitch shifters
  - Reverses
  - Square wave LFO
  - Filter sweeps
  - Stereo field delay
  - LPF LFO
