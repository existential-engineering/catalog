id: oeq5lkTLQaYL2TZMZz3im
name: Barbariz 3
manufacturer: rossignol-studio
primaryCategory: multisample
description: After barbariz, orgambou & barbariz ii, Barbariz 3 is the new
  barrel organ created by Rossignol-Studio for Native Instruments Kontakt 5.
details: |-
  The three different sounds can be used alone for realism or can be mixed at
  will to get closer to limonaires. One more step has just been taken to the
  realism of these street instruments.

  The interface consists of six buttons and two menus. Three volume buttons for
  the three sounds: the extent of these voices covers the keyboard part of the
  b-1 at e3. Finally a volume knob to crank the sound complements the interface
  of this barbariz 3.

  This crank noise can be activated by pressing the green notes c-1 to c#-1 and
  deactivated by pressing the red notes d-1 to eb-1. Many presets of reverb and
  delay effects concocted by serge gora are available via both menus to mix with
  their volume knob.

  The samples are 24-bit 96khz. This instrument was created from two real barrel
  organs.
specs: |-
  - Native Instruments Kontakt 5 compatible
  - 24-bit 96khz samples
  - Three different sounds
  - Six buttons interface
  - Two menus
  - Three volume buttons for three sounds
  - Volume knob
  - Crank noise activation/deactivation
  - Reverb effects
  - Delay effects
  - Keyboard range b-1 to e3
