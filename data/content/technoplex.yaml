details: |-
  BPM Recordings has launched Technoplex, a brand new sample pack by michael l
  penman (tronic, ovum, minus12). Technoplex is huge collection of moving, dirty
  and processed techno hits and loops inspired by dark, raw, moving techno with
  melodic elements.

  The pack contains 30 full drum loop construction kits, 246 loops which include
  drums, percussion elements, hits, fx and synth stabs, labelled bass loops,
  synth loops, analog-sample elements, sine bells, dubbed stabs, fx loops and
  more.

  Bpm recordings is a boutique music production house and label focusing
  exclusively on bringing you royalty free samples, loops, stems and
  compositions produced by industry-leading and avant-garde artists and
  composers. Adopting a completely free and open creative process, our work
  breaks the barriers of a genre for a fusion of sounds ranging from minimal
  techno samples to eclectic, moving compositions for musical and cinematic
  productions.

  Our product catalog includes sample packs, presets for industry-leading vsts,
  easy-to-use production templates for daws such as ableton, logic and protools,
  and dj tools including genre-specific loops and transitional effects.

  The sample pack is available in wav format: 490mb, 467 x wav files at 44.1
  khz, 24-bit.
