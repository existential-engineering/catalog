details: |-
  'afro pop & rhythms' by cartel loops delivers 5 modern afro pop construction kits loaded with nothing but the best of pop, afro trap and hip hop sounds in combination with vocal chops.

  MIDI files are included for all instruments and musical phrases, allowing you to tweak each composition to suit your needs, including tempo, root key and even single notes to fit the melodies perfectly into your arrangement.

  All sounds have been processed and edited using professional outboard gear to ensure authentic analogue warmth.

  Just drag and drop the files into your favourite DAW and you're good to go.
