  task, from classical mock-ups to film scoring, trailers and pop productions.
details: |-
  Using a carefully planned and detailed setup, we immortalized the sound of a
  renowned german grand, through the ears of a binaural dummy. Binaural Piano is
  a truly inspiring virtual instrument, suitable for every task, from classical
  mock-ups to film scoring, trailers and pop productions.

  As always, we aimed to get as close to the real thing as possible, so we
  captured the sympathetic resonances of every possible key combination, summing
  up to the huge amount of 7.744 samples just for the resonances themselves. We
  did the same for the sustain pedal resonances and the release samples, plus we
  recorded the hammer noises in isolation, to be used either as an effect or as
  an additional percussive layer.

  On top of that, we have included our dual true stereo convolution module that
  allows the user to place the binaural piano in various spaces (studio rooms,
  concert halls, churches etc) allowing for a truly remarkable flexibility and
  sound realism. This translates to an equivalent of having 55 mic positions for
  each decca mic (without the need to download and fill hard drives with
  terabytes of data), plus the ability to mix and match two mic instances,
  creating the perfect space for your instrument.

  Each mic can also be moved in space (through the pan slider), altering
  drastically the character and position of the reflections and offering
  infinite sound possibilities. Last but not least, binaural piano is perfectly
  capable of bone-dry sound, thus allowing you to use your own reverb and audio
  processing.
specs: |-
  - 13 velocities per key and 2x round robin on each velocity

  - Bright and dark mode (different samples)

  - Binaural sympathetic resonance with controllable volume

  - Binaural sustain pedal resonance with controllable volume

  - Inaudible noise floor

  - 2 true stereo convolution channels featuring 55 different spaces

  - Stereo enhancer controls for all mics

  - Phase-aligned mono channel that can be blended with the binaural mic or used
  by itself (for mono compatible multimedia productions)

  - 4 band parametric eq

  - Velocity response curve

  - Dynamics response knob

  - Individual key tuning (capable of stretch tuning or total detuning of the
  piano)

  - Timbre slider that alters the tone of the instrument

  - Dedicated noise samples (12 velocities 2x round robin)

  - Dedicated release samples

  - Ability to create experimental sounds and fx with noises, sympathetic
  resonances, detuning and timbre control

  - 14.520 samples (48khz / 24-bit) originally recorded at 192 khz

  - 18 ready presets (kontakt snapshots) with the ability to save your own
  favorite setups
