name: Motion X for Arturia OP-Xa V
manufacturer: app-sound
primaryCategory: preset-pack
url: https://www.app-sound.com/arturia/
description: Motion x is a collection of 80 new presets for the software
  synthesizer ob-xa v by arturia.
details: |-
  "motion x" is a collection of 80 new presets for the software synthesizer
  ob-xa v by arturia. You get a soundware which is carefully designed for
  spherical popular and electronic music.

  The presets are different from those of an analog synthesizer, they have their
  own sound and show some new tonal and rhythmic possibilities of the arturia
  ob-xa v for modern electronic music.

  This soundbank takes advantage of the modulation lanes/matrix and the effect
  sections. Most of the patches are a good starting point for your own sounds
  and are a good alternation to the includes sounds.

  The presets can be musically controlled by velocity and modulation wheel.

  Content: 80 presets featuring pads, fx, leads, basses and impulses (by
  modulation lanes). Styles: ambient, chill out, retro, pop, electronic.
specs: |-
  - 80 presets
  - Modulation lanes/matrix
  - Effect sections
  - Velocity control
  - Modulation wheel control
  - Pads
  - FX
  - Leads
  - Basses
  - Impulses by modulation lanes
