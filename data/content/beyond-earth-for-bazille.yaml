details: |-
  Beyond earth is a soundset created by FutureSpeak member jc for u-he's digital
  modular synth bazille. It contains over 128 presets aimed at composers and
  producers, who like to merge gritty synth sounds with orchestral instruments.

  Features: 12 ambient/sfx, 20 bass/bass rhythms, 38 keys and plucks, 20 leads,
  5 movers, 24 pads, 7 percussion, 9 seq.
specs: |-
  - 128+ presets
  - Ambient/sfx presets
  - Bass/bass rhythms presets
  - Keys and plucks presets
  - Leads presets
  - Movers presets
  - Pads presets
  - Percussion presets
  - Seq presets
  - Compatible with u-he bazille
