details: |-
  ¿Te haz encontrado alguna vez en un servicio donde oíste un músico tocando con un estilo moderno e intentado descubrir como tocar con ese estilo? ¿Haz deseado siempre llevar tus destrezas de tocar piano al próximo nivel para tocar acordes que suenan más repletos y gruesos? Alabanza Moderna es un DVD diseñado para enseñarte fundamentos y técnicas de alabanza y adoración moderna. La música de alabanza y adoración es un aspecto importante en muchos servicios de iglesias hoy y nosotros nos hemos dedicados a enseñarte este estilo de música. Aprenderás técnicas importantes como progresiones modernas, música de trasfondo y como fluir en un servicio con un sonido más moderno. Más que nada este DVD aumentará los acordes que ya conoces y te ayudará tocar con un sonido más grueso. La meta de este DVD es asegurar que tu sonido suene más moderno y que puedas tocar algo que sea más que los acordes naturales de solamente tres notas.
