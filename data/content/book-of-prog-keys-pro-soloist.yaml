details: |-
  Book of prog: keys is a collection of 50 vintage progressive rock keys for
  cherry audio pro soloist synth plugin that focuses in the early 70's
  progressive rock genre.

  Within those keys we can find some classic wah-wah styled keys, distorted
  hammond like sounds, dreamy and emotional synths and keys with a moving
  sounding pattern among other.

  Presets were designed with pro soloist 1.0.4 (build 92) and run best with this
  or newer edition.
