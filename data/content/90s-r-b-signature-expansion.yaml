details: >-
  Introducing... The 90s r&b expansion for signature. This is a special edition
  expansion containing over 100 re-imagined sounds from legendary, iconic 90s
  r&b keyboards.


  We've re-sampled some of the most recognizable sounds from r&b's golden era to
  bring you those hard-to-find sounds from your favorite r&b records.


  We meticulously sampled the machines that made the 90's r&b so special. Then,
  we brought each sound into the present day era by face-lifting and
  re-designing each sound for today's charts.


  This is a special edition release expansion. The 90's r&b expansion is not
  included as one of our free sound packs for unlimited owners.


  Includes 100 sounds: pianos, keyboards, plucks, leads, bass.
