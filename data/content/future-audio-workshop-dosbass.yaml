description: Renowned for his innovative soundscapes and genre-defying approach,
  Machinedrum brings his signature sound and low-end mastery to SubLab XL.
details: |-
  Step into the adventurous sonic universe of Machinedrum. Combing through his old hard drives, Machinedrum created a sound library which he strictly used to create both his new album 3FOR82 and the DOSBASS pack.

  Releasing music on independent labels for the past 25 years, Machinedrum established himself early on as a groundbreaker in the ever-evolving landscape of bass music. From his solo projects to collaborations with artists such as A$AP Ferg, Azalea Banks, Freddie Gibbs, Mykki Blanco, and Tinashe, Machinedrum captivates audiences worldwide with his signature blend of future garage, jungle, footwork, hip-hop, RnB, and house underpinned by a booming low-end.

  Get 15 bold and inspiring sub-bass sounds featuring exclusive samples used in Machinedrum's new album 3FOR82.

  Credits: This pack was designed by producer and DJ Machinedrum, aka Travis Stewart.

  Once your purchase is complete, the pack will show up in your FAW account. Simply download the zip file and follow the instructions on how to import your new sounds into SubLab XL.
specs: |-
  - 15 sub-bass presets for SubLab XL
  - Features exclusive samples used on Machinedrum's album 3FOR82
  - Patches: ALIENZ, GUTPUNCH, INTERPOL, JACKHAMMA, KICKBASS, KICKHISS, PINGPONGWUBS, RIPPA, SCR33N, SLINKEE, SMACKICK, SOOTBASS, SUPERSTANK, SYNDROME, TRICRUSH
  - Designed by Machinedrum (Travis Stewart)
  - Delivered as a downloadable zip file via your FAW account
