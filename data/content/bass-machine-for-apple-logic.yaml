details: |-
  Bass machine is a collection of 110 new channel strip settings (instruments)
  for apple logic x. It's inspired by the Roland tb but it's not a pure
  imitation of this well-known bass synthesizer.

  This library is a good starting point for creating bass lines with the MIDI-fx
  plug-in arpeggiator of apple logic x. Over 110 new sounds are ready to use in
  your pop, house or dance tracks.

  Most of the bass phrases work with a song tempo between 120 and 130 bpm. There
  is a wide range of sound variation by using analog, fm and wavetable
  synthesis.

  Bass machine is an inspiring tool for creating bass lines with logic's
  arpeggiator plug-in. If you have additional AU plug-ins: you simply can
  replace the used logic synths by your favourite software instrument.

  110 channel strip settings featuring synth basses (analog, fm, wavetable) and
  phrases. 69 analog basses, 23 digital basses and 18 standard patches (without
  arpeggiator). Bonus: 23 MIDI phrases (= 1 logic song).
specs: |-
  - 110 channel strip settings
  - Analog synthesis
  - FM synthesis
  - Wavetable synthesis
  - MIDI-FX arpeggiator compatible
  - 69 analog basses
  - 23 digital basses
  - 18 standard patches
  - 23 MIDI phrases
  - Apple logic x compatible
  - macOS
