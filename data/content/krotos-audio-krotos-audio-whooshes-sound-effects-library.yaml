description: A collection of 574 designed whoosh assets spanning sci-fi, cinematic, traditional, electric and ethereal styles, each with a reverse version included.
details: |-
  Electrical, ethereal, fire, ice and sci-fi. The Whooshes Library by Krotos offers a complete collection of whoosh sound effects for creating a variety of movements, pass-bys, transitions, sweeps and impacts.

  Professionally recorded and designed by Krotos, this high-quality sound library offers a comprehensive selection of 574 designed assets that range from sci-fi, cinematic, traditional, electric, ethereal and more. The library also contains a reverse version of each to put your latest TV, film, video game, trailer sound or post-production project in motion even faster.

  Sound categories included in this library: Sci-Fi, Sparks, Blast and Electrical. Keywords span electrical, ethereal, fire, ice, rifle blast, sci-fi delay, sci-fi phasing, sci-fi shotgun, sci-fi time stretched, shotgun blast, sword, stick, cheese grater, fast, bright, heavy, thumpy, thin cable, TRS jack, XLR and Winchester blast.

  The purchase contains two downloads: a zip file with all source sound effect asset files plus a metadata PDF, and an installer for the integrated Weaponiser library including assets and presets.
specs: |-
  - 574 sound files
  - 336 MB size
  - 96 kHz and 192 kHz high-quality WAV files
  - 100% royalty-free commercial license
  - Embedded metadata
  - 50 Weaponiser presets
