  - 4 premium sleishman free-floating snare drums
  - 14" maple shell snare (played with rods and sticks)
  - 10" maple piccolo (sticks only)
  - 13" rosegum snare (brushes and sticks)
  - 14" blue acrylic (sticks only)
  - Additional articulations (bfd3 and bfd2 only)
  - Patented tuning system
  - Windows 7 or above
  - Os x 10.8 or above
  - Bfd3 v. 3.2.1.2 or above
  - Internet connection for download and authorization
  - 23 GB disk space
