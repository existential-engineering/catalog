details: |-
  Bfd sleishman snares includes a 14" maple shell snare (played with rods and
  sticks), a 10" maple piccolo (sticks only), a 13" rosegum snare (brushes and
  sticks) and a 14" blue acrylic (sticks only).

  Some snares feature additional articulations when used with bfd3 and bfd2.
