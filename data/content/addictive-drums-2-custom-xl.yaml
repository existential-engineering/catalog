details: |-
  Addictive Drums 2 Custom XL bundle is for power users that love exploring all
  options and picking content that interests them. The bundle includes:
  addictive drums 2, any 6 adpaks, any 6 midipaks, any 6 kitpiece paks. You can
  choose your content all at once or over time as you expand your musical
  horizons.

  Addictive drums 2 comes standard with three extraordinary drum kits including
  both of the acclaimed fairfax kits (recorded at the legendary los angeles
  studio formerly known as sound city) and the loud, large, and luxurious black
  velvet. The package includes 130 presets ranging from super-clean to highly
  polished and radio-ready to heavily processed and distorted.

  You also get the core MIDI library containing over 5000 inspiring beats and
  grooves covering many styles. You can use them as-is or easily tweak them to
  make them uniquely yours.

  Addictive drums 2 is packed with mixing and sound-shaping features that let
  you transform the raw sounds in amazing ways. Whether you need your drums to
  sound open and crystal-clear, or produced and radio-ready, or grungy and
  heavily distorted, ad2 has studio-grade tools to get the job done.

  Every detail from drag-and-drop audio and MIDI, to rapid linking and layering,
  to near-instant kitpiece swapping is designed to keep you in the creative
  zone. The clean layout and lighting-fast workflow include hundreds of
  individual features that make ad2 fast and familiar even for first-time users.
specs: |-
