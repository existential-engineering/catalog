details: |-
  Ambient swells instrument is sampled guitar swelling chords. Triads second inversions exactly in all triad chord combinations (maj./min./dim.). When playing guitar no matter how you try to produce same sound by striking same chord and riding volume pedal by foot at same time its not gonna sound the same nor will this instrument too thanks to 3 velocity layers and 6 round robins in each velocity layer (for more organic feel).

  There is separate already mapped instrument patches for every major and minor key and additional: all diminished / all major / all minor / all keyswitch. To use it no musical background is needed, just choose key of the song, for example a minor, and play any combination of white notes in instrument range.

  This instrument is good for adding ambient backgrounds for any kind of composition be it for video, game or music. Can be used for making backing tracks for ambient guitar players too. Swells are more emotive and organic than pads made by synthesizers.

  Due to making this instrument clean and by sampling individual chords instead of making production ready loops the ambient swells can be used over and over in audio production unlike other looped libraries with same theme. User has more freedom to shape his own sounds by using different kind of effects.

  Contains: -kontakt patches (with gui and switchable onboard effects, requires minimum kontakt full version 5.4.1 and up), -sfz patches (everything the same mapped except no gui and onboard effects) and unlocked wav samples (not loops).
specs: |-
  - Sampled guitar swelling chords
  - Triads second inversions
  - Major/minor/diminished chord combinations
  - 3 velocity layers
  - 6 round robins per velocity layer
  - Patches for every major and minor key
  - All diminished patches
  - All major patches
  - All minor patches
  - All keyswitch patches
  - Kontakt patches with gui
  - Switchable onboard effects
  - Requires kontakt full version 5.4.1 and up
  - Sfz patches
  - Unlocked wav samples
  - Zampler-rx fxb bank
