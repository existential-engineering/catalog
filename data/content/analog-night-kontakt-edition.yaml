details: |-
  Analog night is a Kontakt sound library based on the best sounds of the Yamaha
  an1x synthesizer. Yamaha an1x is a powerful retro-analog synth, it uses dsp
  modeling of analog waveforms to recreate the coveted sounds of analog synths
  with modern digital specifications.

  Analog night was originally released by eric corminier (reason.fan) for
  propellerhead's reason. Now it has been entirely rebuilt starting from the
  scratch. The new kontakt edition provides vivid, dynamic and rich-sounding
  leads, bass, polyphonic keys and pads, giving you a new powerful synth in your
  favourite sampler.

  Features include 500 kontakt patches organized in 10 categories: all layers,
  arp & sequence, bass, bells & brass, experimental & fx, key & organ, lead,
  monosynth, pad & atmosphere, strings.

  12 MIDI controllable knobs are available for realtime tweaking and for MIDI
  automation of the most important synth parameters.

  Extensive editing techniques include multiple velocity layers, alternate
  triggering and sample starts to achieve fat, lively and vivid synth sounds.
  The kontakt banks require the full retail version of kontakt 3.5 (or more
  recent version), they are not compatible with the free kontakt player.
specs: |-
  - 500 Kontakt patches
  - 1.12 GB of stereo samples
  - 1834 wav files
  - 12 MIDI controllable knobs
  - Multiple velocity layers
  - Alternate triggering
  - Sample starts
  - Kontakt 3.5 or more recent version required
