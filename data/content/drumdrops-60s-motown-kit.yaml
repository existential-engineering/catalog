details: |-
  Drumdrops with producer timmy rickard have recreated the 60s motown drum sound
  with the introduction of the 60s Motown Kit available in seven packs. Recorded
  in a large live room at livingston 1 studio in London, the room was mic'd up
  as if there was a full motown band in the room brass section a vocal mic and
  then two mics on the kit a kick, and a kit mic placed above the bass drum,
  between the rack toms and below the ride.

  For the kit we used timmy's 1960s ludwig club date kit with a 20" x 14" kick
  drum one 12" x 8" rack tom and a 14" floor tom. Four snares were used two
  ludwig pioneer snares, a ludwig hollywood snare and a slingerland shelbyville
  snare. We used two cymbals, a zildjian trans stamp and a zildjian
  constantinople hammered cymbal (both doubled up as rides and crashes) and some
  zildjian vintage hi-hats. All the drums were fitted with remo ambassador
  heads.

  Mic wise we used neumann valve u47's & 67s, coles ribbon mics, a sony c38b and
  an akg valve c28. Mic pre's used were ua2-610's, telefunken v76s and a neve
  1073. All of the mics were recorded without eq or compression except the
  overhead microphone which used an ear vale eq and compressor.

  This kit can be purchased in seven different packs. The packs are the
  "multi-sample pack", the "all samples pack", the "drum replacement pack", the
  "one shot sample pack", the "bfd pack", the "kontakt pack" and the "dual kit
  kontakt player pack".

  The "kontakt 5 pack" contains the second generation drumdrops kontakt
  instrument which has been rebuilt completely from the ground up. The new
  instrument comes with a completely new gui and has many new features. Special
  focus has gone on the compatibility with e-kits so e-kit owners can completely
  customise their kit to work perfectly with the instrument using our new MIDI
  cc data page. This pack only works with the full version of kontakt 5.6.1 or
  above.
