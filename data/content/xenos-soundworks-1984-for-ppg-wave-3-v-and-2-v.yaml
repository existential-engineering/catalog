details: |-
  Nineteen eighty four, a bank of 128 presets, combines the distinctive,
  characteristic sounds of the 1980's with the addition of somber, chilling
  textures that reflect the dystopian world described in george orwell's classic
  novel, nineteen eighty four.

  The 3.v version of this set makes use of waldorf ppg wave 3.v's new features
  as well as a few additional edits.

  The bank ships in 3 versions: the 2.v steinberg version, the 2.v waldorf
  version, plus the new 3.v version.

  Genres: 80s, ambient, electro, pop, new wave, rock, house, minimal, techno.

  Bryan 'xenos' lee has worked as a sound designer for such companies as native
  instruments, cakewalk, rop papen inspiration soundware, refx, camel audio,
  image-line and many more.
specs: |-
  - 128 presets
  - Waldorf ppg wave 3.v compatible
  - Waldorf ppg wave 2.v compatible
  - Steinberg ppg wave 2.v compatible
