description: A Panoptigon disc presenting analog synthesizer waveforms mapped
  across 60 keys, with notes pulsing to create a breathing, organic effect.
details: |-
  Panoptigon format discs will only be playable on Panoptigon- not on vintage Optigans or Orchestrons! We wanted to make a very basic, broadly-applicable sound akin to the Optigan "Big Organ & Drums" disc. This seemed a good opportunity to present a simple analog synthesizer type sound, since the Panoptigon disc format features 60 tracks, and is mapped to allow for a full 60 keys of chromatic tones. Think of it as a "Super Orchestron" disc with essentially 5 octaves instead of 3. Various typical raw analog waveforms are mapped across the keys, with the notes slowly pulsing in and out in different phases, producing a breathing, organic effect that's particularly well-suited to all of the Panoptigon's onboard effects. Apart from the Panoptigon's hall reverb, no other effects or EQ were applied in this demo. Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility
