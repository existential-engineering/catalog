details: |-
  'Serum Essentials Vol. 5 - Progressive House' is a soundbank for Xfer Serum designed for modern Progressive House, EDM, Future House and festival-style dance productions.

  The pack includes 64 royalty-free Serum presets and 59 MIDI files taken from the demo, giving ready-to-use leads, plucks, basses, chords, keys, pads, synths, FX and more.

  Requirements: Xfer Serum version 1.3.2.8 or higher is required.

  Please note: Drums and some FX used in the demo are not included.
specs: |-
  - 64 Presets for Serum
  - 18 Leads (Presets)
  - 12 Plucks (Presets)
  - 10 Basses (Presets)
  - 7 Chords (Presets)
  - 5 Keys (Presets)
  - 4 Synths (Presets)
  - 3 Pads (Presets)
  - 3 FX (Presets)
  - 1 Arp (Presets)
  - 1 Ambient (Presets)
  - 59 MIDI Files
  - Multi-genre
  - PC/Mac Compatible
  - 100% Royalty-Free
