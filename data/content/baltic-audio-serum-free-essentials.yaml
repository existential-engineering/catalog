details: |-
  'Serum Free Essentials' is a free collection of selected presets from the 'Serum Essentials' series by baltic audio. It contains 21 presets from different genres for the Serum synthesizer and 22 MIDI files.

  The included presets can be used for different genres like EDM, Future House, Slap House, Future Bass and Progressive House.

  This package is intended to give you an insight into the Serum Essentials packages from baltic audio.

  Please note: The drums and some FX used in the demo are not included in this product.
specs: |-
  - 21 Presets for Serum
  - 10 Basses
  - 4 Chords
  - 2 Keys
  - 2 Leads
  - 2 Pads
  - 1 Pluck
  - 22 MIDI Files
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
  - Requires Xfer Records Serum v1.3.2.8 or higher
