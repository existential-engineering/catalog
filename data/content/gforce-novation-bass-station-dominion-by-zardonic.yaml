details: |-
  Dominion is an intense and unapologetic preset pack for the GForce Bass Station, created by internationally acclaimed producer and sound designer Zardonic. Designed for those who want to lead and destroy in equal measure, this collection blends cinematic tension with raw electronic firepower, delivering aggressive basses and commanding leads with his signature precision.

  Whether you’re building relentless drops, scoring dark futuristic worlds, or adding edge to live performances, Dominion gives you the sonic arsenal to dominate the mix. Inside, you’ll find growling basses, punishing subs, and distorted low-end weapons; razor-sharp leads and searing synth hooks that cut through dense mixes; and hybrid textures and brutal sequences built for intensity and impact.

  Each preset pushes GForce Bass Station beyond the expected, unlocking the full potential of its analogue-style engine. With Dominion, Zardonic infuses his signature blend of electronic aggression and cinematic scale into every sound, perfect for trailer composers, producers, and performers who require maximum power with no compromise.

  About Zardonic: Zardonic is the sonic alter ego of Federico Ágreda Álvarez, an internationally recognized DJ, producer, and sound designer known for his ferocious blend of electronic music, metal, and cinematic intensity. His music has reached audiences in over 60 countries, with releases on labels such as OWSLA, eOne, and Entertainment One, and sync placements across games, film trailers, and esports events.
