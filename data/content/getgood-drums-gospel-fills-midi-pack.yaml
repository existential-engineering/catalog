description: A MIDI pack featuring gospel drum fills performed and recorded by
  Federico Paulovich, designed to sound realistic and fluid. The fills are fast,
  melodic, and out of the ordinary, usable as-is or modified to fit various
  musical styles. Compatible with any DAW and drum sampler.
details: |-
  Gospel Chops! Everyone loves them, but they can be super hard to program to sound realistic and fluid like a real drummer.… that’s why we brought on the amazing Federico Paulovich to perform and record some of the most mind blowing, creative, and fun chops for you to use in your music!

  They’re fast, they’re melodic, they’re out of the ordinary, and one might even say, they’re choppy! And that’s exactly what gospel chops are supposed to be - exciting, challenging, and unique. You can use them as they’re recorded or you can augment them to fit your music as you see fit. Don’t waste any more time trying to come up with fills that are hard enough to play, let alone program… use the brand new Gospel Chops pack and let your drum parts rip!
