description: "Asteroid - cinematic rhythm and effect designer: create powerful,
  cinematic rhythm and effects for film, games, music and more."
details: |-
  Asteroid is a creative tool for developing powerful, rhythmic and evolving sequences, percussions, transitions, effects and more. Load up 7 sample layers with an incredible collection of sounds from a wide range of sources including orchestral percussion, effects, electronic and acoustic drums, foley, and found sounds.

  A deeply-configurable editor allows you sculpt each sound, mix spatially, add multi-fx, master eq and dynamics, and create rich and evolving sequenced sounds with 128 steps of velocity, pan, pitch, decay, reverb, and delay, discretely per-track.

  With a fast and intuitive workflow, deep sound library, and a huge selection of inspiring presets, asteroid is a rewarding and powerful tool for composers, sound designers and musicians alike.

  Deep, easy to use, massively editable, and absolutely crammed with professionally designed sounds and presets, asteroid delivers an endless source of sound design inspiration, from nuanced transitions to epic cinematic percussion, drums, and effects.
specs: |-
  - 7-layer architecture
  - 128 steps of velocity, pan, pitch, decay, reverb, and delay per-track
  - 6 sequencer lanes per part
  - Multi-FX
  - Master EQ
  - Dynamics
  - Spatial mixing
