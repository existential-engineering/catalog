details: |-
  Audio boutique Electric Elements Bundle is a sample collection dedicated
  towards the production of tech house, minimal and electro house tracks,
  surrendering any kind of superfluous clichés. Whether you are looking for
  analog synth- and basslines, quirky noise effects, crunchy drumloops, funky
  drums, amazing analog effects, atmospheric backgrounds, spacy fragments,
  unusual hit loops or nostalgic vintage sounds: this collection contains
  everything to stand out from the crowd.

  All loops and rhythmical effects are commonly produced in 127bpm carefully
  sorted into categories and due to the provided formats apple loops, rex files
  and the most popular sampler formats this premium collection fits with almost
  every user.

  This inspiring electric bundle was produced by ramon zenker, one of the most
  experienced german producers & harald aufmuth who is one of the new bright
  stars at the minimal & deep techno horizon.

  All samples used in the demo track are included in the electric elements
  bundle.

  The collection includes wav format, rex2, apple loops, and sampler patches
  depending on the single product.
