details: |-
  RAW is a huge HALO Expansion Pack, featuring a whopping 200 presets and 64 sample banks of thundering, floor shaking Bass & Leads. These sounds have been created using two cutting edge hardware analog synthesisers and modern software processing, all run through Halo's unique processing and sequencers.

  The most raucous and cutting edge presets made for Halo yet, centred on bass-focused, jump up and heavyweight sonics.

  All presets have been crafted using the full breadth of HALO 2's unique functionality. Using a range of hardware and software synthesisers, both digital and analogue sound sources and fx and processing, all the sample banks were painstakingly put together to create the finest re-sampled audio for each expansion, and every expansion has its own unique character and qualities.

  Product requirements: HALO 2.0.5. It does not work with HALO LITE.
