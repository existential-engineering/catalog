description: Wurliscape turns the Optigan into an ambient arpeggiator using
  vintage electric piano sounds, along with previously unreleased drum,
  percussion, and bass loops.
details: |-
  Wurliscape represents the next evolution of Optigan music program disc that began with Pianoscape and Vibrascape. Instead of being a disc for playing melodies, you'll discover that Wurliscape turns your Optigan into an ambient arpeggiator using the sounds of a vintage electric piano. In addition, we've used previously unreleased drum and percussion loops from the original Optigan master tapes along with newly created bass lines. The keyboard features a series of simple two-note rhythmic patterns that can be combined to create complex arpeggiated chords. We created these patterns using only the white keys on the piano, or in other words, F-Lydian mode (C-Ionian mode). This arrangement fits well on the Optigan's F-to-F keyboard range and ensures that most combinations will produce a harmonically consonant composite pattern. We invite you to explore the vast harmonic possibilities of Wurliscape. Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility
