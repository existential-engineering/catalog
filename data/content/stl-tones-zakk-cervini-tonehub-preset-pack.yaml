details: |-
  Zakk Cervini is a Grammy-nominated producer and mixer whose work includes collaborations with Blink-182, 5 Seconds of Summer, Machine Gun Kelly, YUNGBLUD, Avicii, Good Charlotte, Grimes, All Time Low, Bishop Briggs, Poppy, Waterparks and Sleeping With Sirens.

  Built from Zakk's collection of pedals, amps and cabs, this pack includes some extremely sought-after album tones from his recent works.

  Zakk's pack contains 38 guitar captures and 11 bass captures.
