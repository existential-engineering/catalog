details: |-
  'Drill Master' from baltic audio is a collection of Drill elements covering 808s, drums, keys, instruments and more, plus presets for the Spire synthesizer, combined into 5 construction kits.

  The pack provides the elements needed to make UK Drill tracks.

  Each construction kit contains mixed instrumentation and is arranged so a vocal topline can be added.

  The included MIDI files, one-shot samples and Spire presets allow the material to be reworked, while the ready-to-use loops and stems allow results to be reached quickly.

  The presets require v1.1 or higher of Reveal Sound Spire.
specs: |-
