details: |-
  8-Bit Drum Kits 2 supplies you with another large assortment of retro drum
  kits. The kits in this pack are genuine reproductions of 8-bit drums from
  classic video game music with an extensive drum sample library of kicks,
  snares, toms, hihats, percussion and cymbals, ideal for chiptune and music
  with a retro twist.

  The drum kits in this second edition use a combination of the pulse/square
  wave and different types of noise to create the 8-bit sounds. This sound was
  used a lot in earlier games, but also in many indie games that wanted to use
  more creative tonal and amplitude parameters than the triangle wave could
  provide.

  This pack contains: 61 8-bit drum kits. 976 8-bit drum samples (kick, snare,
  hihat, tom, cymbal, shaker & percussion). 61 drum kit patches for native
  instruments maschine, ableton live, fl studio, battery, kontakt, mpc software,
  logic pro exs24/sampler, and tal-sampler. 24-bit, 44.1 khz wav files.
