details: |-
  Chest Pounding Drums

  The Epic Taiko Ensemble is the most comprehensive and deep-sampled collection of large-scale, Epic Taiko on the market. The Epic Taiko Ensemble features the highly renowned Taiko Ensemble group Emeryville Taiko, led by master Susan Horn. Recorded with 2 microphone positions for all Parts including a massive Taiko Ensemble part. This library also includes sounds associated with Taiko tradition (ensemble screams, yells, yell-hits, percussive cannon "Tekkan," and more). We sampled all the classic Taiko drums, including the booming O-daiko, Nagado Daiko, and the smaller and more snare like Shime-daiko. We also played the drums with hands and alternative stick types, capturing the most comprehensive collection of clacks made with different type of sticks and by hitting the rims of the larger Taiko drums. A fun fact: The Taiko Drum, when hit hard can produce the level of sound on par with the noise produced by jet engines.
