description: "Will Putney is an American producer, mixer, and engineer based in
  Belleville, New Jersey. He is responsible for releases from bands like Every
  Time I Die, The Amity Affliction, The Acacia Strain, Body Count, Thy Art Is
  Murder, Northlane, Gojira, Silent Planet, After The Burial, Terror, Unearth,
  Knocked Loose, Norma Jean, Fit For An Autopsy, Vein, Harms Way, Stray From The
  Path, and Counterparts. Will Putney 20x10 is the culmination of 20 of his
  personal favorite amplifiers, paired with 10 of his tried and true speaker
  cabinets. The result is an expansion pack that leaves no stone unturned -
  anything from the heaviest aggressive hardcore tones to low gain and clean
  chime sounds are now all in one place.This expansion pack has 350 presets."
