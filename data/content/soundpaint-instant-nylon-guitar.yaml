details: |-
  Instant Inspiration. Instant Playability

  Instant Acoustic Nylon Guitar Solo is a passionate, deep-sampled, pristine sounding classical nylon guitar. We recorded it in great detail, including hundreds of natural fret and release noises. In addition, we also recorded natural strum samples, so you can play everything in a strummed fashion. The natural/flat category contains non-vibrato classical guitar – whereas the vibrato category contains the Acoustic Guitar with naturally sampled vibrato on each note. The SoundLabs seamlessly blend the Acoustic Guitar with other instruments (ex. 1928 Vintage Grand Steinway Piano, Alto Flute, and more exotic type of instruments. Acoustic Nylon Guitar Strummer contains over 6.5K samples spread across 13 different chord types and 13 different rhythms. All the chords and rhythms can be blended seamlessly, giving you an infinite number of combinations. The Acoustic Guitar Strummer is a round-robin based strum library, so even if you trigger the same chord/rhythm multiple times, you will get natural, subtle variation. The Acoustic Guitar Strummer Parts also contains chords in perfect 5ths, allowing you to shape virtually any chord by combining it with our Acoustic Guitar Solo Parts, all within this library. Playing Guitar has never been easier.
