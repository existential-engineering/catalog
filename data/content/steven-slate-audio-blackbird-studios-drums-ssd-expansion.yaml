details: |-
  In the spring of 2014, blackbird founder john mcbride recorded the blackbird
  drums expansion with drummer chris tyrell of lady antebellum for the steven
  slate drums (SSD) virtual instrument and trigger drum replacer plugin.

  Utilizing three of blackbird's classic rooms including the chambers of rooms a
  and d, tons of vintage mics and gear, classic drum kits from an era spanning
  fifty years, and of course, john's amazing engineering talent, blackbird drums
  is one of the most amazing drum libraries you'll ever experience.

  What's included: 6 kick drum samples, 10 snare samples, 7 sets of toms, 2
  hi-hats (ssd only), 1 ride (ssd only), 4 crashes (ssd only).
