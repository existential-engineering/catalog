details: |-
  Asian Colours 2 is recorded over several years in vietnam, indonesia,
  cambodia, tibet, Japan and china. The library offers multiple male and female
  vocals, various solo instruments and field recordings.

  New version comes with additional sounds, presets and the new engine.

  Laptop hooligans travelled all over asia and recorded male and female ritual
  vocals, instruments, rare ambiences and more content you can not find anywhere
  else.

  In our lab we turned these sounds into playable solo instruments, performances
  and patterns ready to inspire you to heart.

  You can either play all sounds through our kontakt engine or use the audio
  files provided in wav format.
