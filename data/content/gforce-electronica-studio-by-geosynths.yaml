details: |-
  Electronica Studio by GEOSynths provides a diverse range of sounds with dynamic movement and tonal shifts when manipulated with Macros and Controllers. Covers 80s Funk, the pulse of 90s House, and contemporary Electronica.

  GEOSynths Sound Design was founded in 2017 by Jamie Morden, who brings over 30 years of audio production and sound design experience, having collaborated with Novation and Moog.
