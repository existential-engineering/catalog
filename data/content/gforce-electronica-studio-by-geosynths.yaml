description: A 40-patch preset pack for GForce Oddity3 spanning 80s Funk, 90s House, and contemporary Electronica styles. Patches feature dynamic movement and tonal shifts via Macros and Controllers, from ambient soundscapes to driving basslines.
details: |-
  Discover the vast sonic landscape of electronic music with Electronica Studio, a meticulously crafted preset pack for Oddity3 designed by GEOSynths. This collection spans various styles and genres, offering a rich array of patches from classic Polysynths, Bass, and Leads to atmospheric Ambient Pads and Bells.

  Electronica Studio includes a diverse range of sounds that provide dynamic movement and tonal shifts when manipulated with Macros and Controllers. Whether you're looking to recreate the groove of 80s Funk, the pulse of 90s House, or explore new realms within Electronica, this pack has you covered. The four demo tracks offer a glimpse into the sounds you can employ, showcasing the versatility and depth of this collection.

  GEOSynths says, "Electronica Studio encompasses an array of patches representing various styles and genres spanning decades, offering a diverse range of movement and tonal shifts when manipulated with Macros and Controllers."

  The pack is perfect for crafting everything from ambient soundscapes to driving basslines, making it an essential tool for any electronic music producer. Create compelling tracks that capture the essence of electronic music across the decades while sounding fresh and contemporary.

  GEOSynths Sound Design, founded in 2017 by Jamie Morden, is a powerhouse in the audio production and sound design industry. With over 30 years of experience, Jamie combines deep expertise with a professional approach. Jamie has created extensive synth patch libraries for a variety of hardware poly synths and is expanding into software synths.
