description: With this strum gs-2 sound pack—all that jazz—sound designer yves
  frulla pays tribute to some of the jazz guitar greats.
details: >-
  With this strum gs-2 sound pack all that jazz, sound designer yves frulla pays
  tribute to some of the jazz guitar greats. All that jazz packs 12 styles, 84
  guitar presets, and 84 strumming patterns playable with your own chord
  progressions.


  By combining strum gs-2's guitar, keyboard, and loop modes along with preset
  variations, your jazzy guitar parts are covered.


  The all that jazz sound pack showcases jazz' foundations with its up-tempo
  funky strumming pattern rhythms. Give it a try on your next hip jazz combo
  charts or your complex swinging big band arrangements.


  Strum gs-2 - all that jazz by applied acoustics systems is a virtual
  instrument audio plugin and soundware (samples or presets that load into other
  products) for macos and windows. It includes, and is therefore "powered by",
  aas player, which functions as a VST plugin, an audio units plugin, a VST 3
  plugin and an AAX plugin.
