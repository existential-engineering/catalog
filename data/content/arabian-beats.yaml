description: Arabian Beats is a collection of high quality percussion loops
  programmed to work like an arranger.
details: |-
  With separate filters and envelope controls for every loop, you can make
  endless variations and sounds. A complete arabic percussion kit included to
  add breaks and variations or to build new beats.

  Every loop comes as a sliced key map with MIDI file. Percussion loop
  collection covering arabian gulf and north africa area (arabi, dousary,
  khebety, malaya (2 styles), rumba, samri, sharh and swahli).

  A full retail version of kontakt 4.2.4 or later required, free kontakt player
  is not supported.
specs: |-
  - 9 classic arabian styles
  - 325 royalty free loops
  - Sync to host for all loops
  - MIDI files included
  - Full control over each key separately
  - Slice level real time ADSR control
  - Multi layered detailed drum kit
  - Kontakt 4.2.4 or later required
  - Separate filters and envelope controls
  - Sliced key map format
