details: |-
  Ableton drum racks for ezdrummer hard rock ezx features separate ableton drum racks for all factory presets for the toontrack ezdrummer hard rock ezx expansion library featuring mappings for all bob rock and toontrack's presets. These racks are the most complete integration between ableton live and toontrack ezdrummer including a host of features ready to use on ableton push.

  Amazing workflow in ableton and on your push to the full capabilities of the kit library saving setup time and allowing you to focus on music creation. Ease of navigation to load all hard rock kit factory presets from ableton push controller device browser.

  22 ableton drum racks to instantly load the factory library "mix ready" presets with ableton mappings. 11 ableton live templates designed to host the multi channel output routing presets with track level audio routing.

  Colour coded pad design for visual performance and finger drumming. All our racks use consistent drum rack colouring so you can visually and immediately spot your snares from your crashes. All instrument articulations ready to go in one layout using ableton push 64 pad layout mode.

  Ableton macros mapped to toontrack ezdrummer macros with preset values for ease of use in push and simple to use automation programming. Ableton macros are color coded to match the ezdrummer display. Use the template racks and extend to your own toontrack ezdrummer hard rock ezx presets, swapping out individual sounds or articulations.
specs: |-
  - Ableton drum racks
  - Toontrack ezdrummer hard rock ezx integration
  - Ableton push support
  - 22 ableton drum racks
  - 11 ableton live templates
  - Multi-channel output routing
  - Single output routing
  - Colour coded pad design
  - 64 pad layout mode
  - Ableton macros mapped to toontrack ezdrummer macros
  - Audio routing options
  - Track level audio mixing control
  - Individually labelled drum rack pads
  - Factory presets integration
  - Bob rock presets mappings
