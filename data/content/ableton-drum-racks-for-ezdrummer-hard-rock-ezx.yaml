details: |-
  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all hard rock kit factory presets from ableton push
  controller device browser.

  22 ableton drum racks to instantly load the factory library "mix ready"
  presets with ableton mappings. 11 ableton live templates designed to host the
  multi channel output routing presets with track level audio routing.

  Colour coded pad design for visual performance and finger drumming. All our
  racks use consistent drum rack colouring so you can visually and immediately
  spot your snares from your crashes. All instrument articulations ready to go
  in one layout using ableton push 64 pad layout mode.

  Ableton macros mapped to toontrack ezdrummer macros with preset values for
  ease of use in push and simple to use automation programming. Ableton macros
  are color coded to match the ezdrummer display. Use the template racks and
  extend to your own toontrack ezdrummer hard rock ezx presets, swapping out
  individual sounds or articulations.
specs: |-
