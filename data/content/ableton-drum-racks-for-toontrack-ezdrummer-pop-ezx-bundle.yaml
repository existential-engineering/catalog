details: |-
  The ultimate ezdrummer pop performance drum rack on Ableton push featuring no
  less than 104 Ableton drum racks configured for toontrack ezdrummer2 pop ezx
  expansion libraries. The most complete Ableton integration for ezdrummer and
  ezx expansions available.

  Ableton drum rack bundle contains 3 timbresandtones products bundled for pop,
  dream pop and pop/rock: ableton drum racks for ezdrummer pop ezx (20 ableton
  drum racks individually mapped to all pop ezx factory library content
  presets), ableton drum racks for ezdrummer dream pop ezx (58 ableton drum
  racks individually mapped to all dream pop ezx factory content presets), and
  ableton drum racks for ezdrummer pop/rock ezx (26 ableton drum racks
  individually mapped to all pop/rock ezx factory content presets).

  New in v1.1 multiple audio channel output presets and free ableton live multi
  out templates for each ezx product to house multi-track audio routing.

  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all ezdrummer ezx factory presets from ableton push
  controller device browser. 104 ableton drum racks to instantly load the
  factory library "mix ready" presets with ableton mappings.

  Singleout presets featuring 52 ableton drum racks for all factory presets
  single audio output to single ableton track. Multiout presets featuring 52
  ableton drum racks for all presets in multiple audio channel output from the
  plug in to multiple ableton audio tracks using the multi output ableton
  template also provided.
specs: |-
  - 104 Ableton drum racks
  - Ableton push 2 color pads mode
  - Color coded pad design
  - Individually labelled drum rack pads
  - Mapped Ableton macros to ezdrummer macros
  - Singleout presets (52 Ableton drum racks)
  - Multiout presets (52 Ableton drum racks)
  - Multiple audio channel output
  - Ableton live templates for multi-track audio routing
  - Ableton live 9.5 or above
  - Toontrack ezdrummer2 required
  - Ezdrummer pop ezx expansion pack required
  - Ezdrummer dream pop ezx expansion pack required
  - Ezdrummer pop/rock ezx expansion pack required
