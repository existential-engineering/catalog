description: A plethora of diverse soul-fusion sounds bursting with inspiration for your next beat. Fusion Beatmaker by Basement Freaks is the perfect balance of retro and modern vibes giving you a sense of nostalgia with fresh samples for trap and RnB.
details: |-
  Fusion Beatmaker by Basement Freaks is a soul-fusion sample pack balancing retro and modern tones, aimed at trap and RnB production.

  It carries over 125 melodic, percussive and SFX loops covering a wide selection of instruments, including keys, guitars, saxophone, 808s and synths.

  Alongside the loops are over 105 one-shot samples, made up of 35 groove-setting drum hits, 65 chord shots and 7 sax riff one-shots.

  The material is intended for hip hop, trap, lo-fi and pop, adding soul-leaning textures to trap beats.

  The pack totals 257 files, including 21 MIDI loops alongside the audio content.
