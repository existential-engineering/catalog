details: |-
  One thing you know about us is that we love authentic sounds that are full of grit, clucks, bangs, and all of the mechanical goodness inside of an instrument. As this was highly requested, we are brining to you a very authentic sounding Upright Piano to add to your arsenal of sounds in Pure Synth Platinum. This piano emphasizes a very great sound upright piano that can cut through a mix. It also is very thick and smacks very hard. You can clearly hear all of the inner guts of the piano as well as a very beautiful ringing resonant sound of the piano strings. This piano is very good for jazz, gospel, and especially neo-soul, because of it's incredible authenticity.
