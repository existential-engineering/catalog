details: |-
  Blue diamond is a new expansion for Omnisphere 2. The collection includes a
  new wav library and 80 presets.

  Blue diamond was designed specifically to go deep into the new features
  included in omnisphere 2. Not only does this include the new sound sources,
  but also effects, dsp waveforms, new granular synthesis algorithm, unison
  drift, polyphonic lfo, soundsource reversing and more.

  We also added some brand new wav files sampled at hd resolution to take full
  advantage to what omnisphere 2 has to offer. Furthermore, every preset
  includes detailed controller data and professional studio effect chains.

  The categories include: several guitars, both acoustic and electric very lush
  classic analog pads strikingly visual atmosphere lots of granular instruments
  innovative and unique arps fat analog bass exotic soundscapes several striking
  electric pianos
