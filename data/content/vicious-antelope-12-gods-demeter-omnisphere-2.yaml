details: |-
  12 gods: demeter library for spectrasonics Omnisphere contains 50 poly synth
  patches inspired by the goddess of harvest according to greek pantheon. Each
  preset represents a myth, an epithet or a person connected with demeter.

  Here there are some analog classics keys and synths with evolving motion and
  vintage character. Those classics are suitable for all electronic music genres
  but also fit to cinematic, pop and rock productions especially if nostalgia is
  a desired feeling to achieve.

  For most patches there is a modified lp filter on the layers designed with a
  power and a warm 24db filter modulated by the amp envelope, for nice vintage
  sounding movement of the sound. Mw is assigned to vibrato and aftertouch to a
  tube saturator.

  Patches were created with omnisphere 2.8 and run best with this or newer
  edition: software 2.8.4d. Soundsources v2.6.1c. Patches v2.8.1c.
specs: |-
  - 50 poly synth patches
  - Modified LP filter on layers
  - Power and warm 24db filter
  - Amp envelope modulation
  - Mw assigned to vibrato
  - Aftertouch to tube saturator
  - Omnisphere 2.8 compatible
