details: |-
  Magic in the Air

  Feel the breeze with this sublime ensemble of six windchimes, played in the same hall. A single set of windchimes (or a mark tree) can instantly create a mystical atmosphere, but a full ensemble creates a whole ocean of pure sonic enchantment. This is the most ethereal, extraordinary, enchanting percussion ensemble you will ever hear, and it is sure to instantly captivate and delight the senses. The windchime ensemble includes both metallic mark trees and bamboo windchimes. Combined with 3 mic perspectives (close, decca, wide), you can create the perfect soundscape for any texture. In addition to the sweeping glissandos, we also had the percussionists play the windchimes extremely slowly, creating the perfect "starry night" effect. It took a long time to get the ensemble to play slowly enough, but the results were more than worth it. The bamboo chimes create a wide wooden texture, distinct from the metallic chimes, but no less magical.
