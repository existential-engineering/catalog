details: |-
  Astrodynamics - cinematic drones & textures unfurls from the ModeAudio studio,
  swirling and spiralling into dense constellations of sonic texture and light,
  a colossal cosmic tapestry of richly resonant sound. Dive into this galactic,
  1.1gb collection of royalty-free drones, basses and percussive patterns and
  discover a universe of drifting, dazzling audio, ready and waiting send your
  next soundtrack or ambient production soaring up amongst the planets.

  Featuring deep, finely textured drones and pads ranging from the warm and
  enveloping to the sparse and shimmering, alongside bottomless basses,
  scattering sfx samples and the skittering rush of glistening percussion loops,
  this selection encompasses a satisfyingly cinematic feast of modern sound
  design.

  With samples ranging in length from 8s all the way up to 1m20s, and with both
  sample and cyclic loop layers included, this collection offers up a versatile
  wealth of sonic fuel to sustain your next musical voyage far into the outer
  reaches of the solar system.

  Blending dark and light, smooth and jagged, and the calm with the chaotic
  across 162 loops and samples, create projects as diverse as a towering sonic
  temple and shivering aural fragment with this scintillating set of sounds.
