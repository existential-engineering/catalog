details: |-
  Neurofunk Machinery Vol 2 is the second installment of Blackwarp's Neurofunk Machinery series, collecting Neurofunk samples, loops and presets.

  The library covers bass lines and one shots, drums, FX and Serum bass presets. Any sound or loop can be slotted straight into a DAW for an instant Neurofunk sound.

  The Serum presets can be taken further and customised into new mutant bass sounds.

  Neurofunk Machinery Vol 2 was inspired by the sounds of Noisia, Mefjus, Black Sun Empire, Phace and Emperor.

  The pack holds 493 total sounds, spanning 101 drum loops, 100 bass loops, 100 bass one shots, 100 drum one shots, 70 FX, 20 hihats, 20 kicks, 20 snares, 20 percussion one shots, 10 rides, 10 crash cymbals, 20 Xfer Serum presets and 2 Xfer Serum wavetables.
