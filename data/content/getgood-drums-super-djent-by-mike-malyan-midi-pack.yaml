description: A MIDI groove pack created by drummer Mike Malyan featuring
  hundreds of song-formatted grooves derived from tracks like "Gnosis,"
  "Phronesis," and "The Amanuensis." The pack works with any DAW and drum
  sampler, and integrates with GGD virtual instruments via a built-in MIDI
  groove player. It gives producers editable MIDI files to layer over their own
  musical compositions.
details: |-
  Mike Malyan is often referred to as a musical genius, and the “Djent World” is lucky to have him as one of their own.

  He's a classically trained pianist, a riff-writer, an educator, a producer, an excellent keyboard percussionist, and most of all, an absolutely masterfully talented drummer. He hits super hard, gets every head in the room bobbing to the beat, and can play anything you throw at him.

  That's why we reached out to Mike to create one of the most fun groove packs we have to offer. Laid out in song format, each groove in this pack offers a unique chance to layer your musical creations on top to carry you to rhythmic places you've never before ventured.

  Write with Mike as your drummer and your head (plus everyone else's) will be bobbing with the groove too.
