details: |-
  JST Kaoss Volume I is an extensive, all-encompassing post-production sample pack filled with royalty-free sounds designed to add a little mayhem to your productions.

  The first post-production sample pack by JST, Kaoss features over 100 different samples separated into seven categories, with many samples synchronized to BPM and key for added ease of use. If you are tired of wasting time searching the internet for lackluster samples, or trying to make your own, this pack has everything you need.

  Whether you need to add depth or texture to a passage, add a sense of finality, fill empty gaps or transitions, create excitement, or just make everything slam, JST Kaoss Volume I covers your post-production FX needs.

  Unlike some sample packs that have very little difference from sample to sample, each sound here is crafted to be reusable, special, and flexible.
