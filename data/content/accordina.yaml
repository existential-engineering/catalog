details: |-
  Accordina is a reeds instrument, similar to the harmonica. It borrows its chromatic keyboard (44 notes) and professional hand made reeds from the accordion.

  Psound accordina has been sampled up to 9 layers and 3 articulations for a more than 400 samples (300mb storage).

  Accordina by psound is a virtual instrument audio plugin and soundware (samples or presets that load into other products) for macos and windows. It includes, and is therefore "powered by", uvi workstation, which functions as a VST plugin, an audio units plugin, a VST 3 plugin and an AAX plugin.

  All samples are perfectly looped with adjustable volume for reeds and noise, key-on and key-off noises, and key switches.

  Uvi.net provides uvi workstation for free. Uvi falcon full compatibility. Playable by motu machfive too (requires v3.2.1). Pace protection system (free ilok account required).
specs: |-
  - Chromatic keyboard (44 notes)
  - 400 samples
  - 300mb storage
  - 96 khz sample rate
  - 24-bit resolution
  - Up to 9 velocity layers
  - 3 articulations
  - Key-on and key-off noises
  - Adjustable volume for reeds and noise
  - Key switches
  - Uvi engine xt
  - Uvi workstation v2.5.6 or later required
  - Uvi falcon full compatibility
  - Playable by motu machfive (requires v3.2.1)
  - Pace protection system
  - VST plugin
  - Audio units plugin
  - VST 3 plugin
  - AAX plugin
  - Macos and windows compatible
