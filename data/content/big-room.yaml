details: |-
  Big Room is the first soundset for dune 3. Crafted by mirko ruta, an
  experienced professional sound designer, Big Room will take your productions
  to the next level!

  Get your hands on 80 fresh, high-quality dance patches. All patches support
  the modulation wheel, and are provided both in dune 3 format, as well as in
  nks format for maschine/komplete kontrol integration.
specs: |-
  - 80 high-quality dance patches
  - Modulation wheel support
  - Dune 3 format
  - NKS format
  - Maschine integration
  - Komplete kontrol integration
  - macOS compatibility
  - Windows compatibility
