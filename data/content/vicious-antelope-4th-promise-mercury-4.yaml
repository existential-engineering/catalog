details: |-
  4th promise soundbank contains 50 vintage pads for cherry audio mercury-4 synthesizer. The patches are exploiting the characteristics of the emulated synth and make it exhale some very emotional sounds that fit for a variety of genres especially when the emotion is the goal.

  They sound very retro and for some of them some crazy modulations are crafting an experimental dimension.

  Presets were designed with mercury-4 1.6.0 (build 100) and run best with this or newer edition.
