details: |-
  'Adaptive Guitar Loops' is a royalty-free guitar loop pack featuring 17 guitar kits and 881 WAV loops for Pop, EDM, House, Deep House, Progressive House, Trance, Hip Hop and modern electronic music productions.

  The pack includes acoustic and electric guitar loops with dry and amped versions, giving flexible options for direct use, mixing or re-amping. Common chords and root notes are covered, including major and minor variations plus low and high octave versions for building chord progressions, hooks, drops and toplines.

  The pack contains guitar loops in WAV format. No specific plugin is required, but a DAW, sampler or audio software that can load WAV files is needed.
