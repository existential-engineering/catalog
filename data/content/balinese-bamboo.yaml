details: |-
  A wooden balinese rindik (xylophone) was sampled to 194 loops and 67 one shots
  which are embed in a playable Ableton live instrument with round robin
  (slightly changing hits) and extra effect knobs to turn the sound into
  unrecognizable alterations.

  Further, you'll find processed versions of the original loops. These are meant
  as examples and encouragement to alter the source sounds yourself and have fun
  with this pack for a long time.

  Ddl return with another exquisite world release, which can be used also for
  modern dance and ambient music productions.
specs: |-
  - 194 original instrument loops (straight, triplet, muted)
  - 41 processed loops (ambience, percussive, vocoder)
  - 67 one shots
  - 1 Ableton live instrument rack
  - 8 macro knobs
  - Round robin
  - 235 wav loops
