details: >-
  New loops presents alive falcon expansion, an expressive new sound bank for
  uvi falcon, featuring 130 creative sounds inspired by recent soundtracks
  including mr robot, ghost in the shell, tenet, blade runner 2049, dune,
  cyberpunk2049, the division 2, and apex legends.


  The expansion makes extensive use of new features in 2.5 including the vcf20
  filter, ts overdrive effect, new sequencers and modules, and especially the
  new smooth random modulator to add organic, analogue life into the sounds.
  Sounds range from deep ambiences, distorted drones, atmospheric textures, and
  evolving atmospheres, to emotive keys, analogue synths, cinematic sequences,
  and electronic basses.


  Alive features sounds with character, energy and emotion, sounds that breathe
  and move as if alive. These uvi falcon presets react to velocity, aftertouch
  and the mod wheel bringing them to life. Tweak and perform with 4 macros for
  each sound on a custom backdrop.


  Also included is 110 unlocked audio samples which can be used in any other
  audio software. There's a wide range of samples including vocal samples, field
  recordings, foley sounds, analogue synths, orchestral samples, soundscapes,
  and loads more.


  The expansion contains 20 pads and strings, 20 drones and soundscapes, 20
  textures and ambiences, 20 synth keys and plucks, 20 sequences and arps, 20
  basses and basslines, and 15 synth leads, categorised in 7 folders with mod
  wheel and aftertouch assigned and level matched with headroom.
specs: |-
  - 130 uvi falcon presets
  - 110 unlocked audio samples
  - Vcf20 filter
  - Ts overdrive effect
  - New sequencers and modules
  - Smooth random modulator
  - Velocity sensitivity
  - Aftertouch support
  - Mod wheel control
  - 4 macros per sound
  - Custom backdrop
  - 350 mb content
