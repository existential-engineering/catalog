details: |-
  Ableton Drum Racks for Superior Drummer 3 Alt-Rock EZX features separate
  Ableton drum racks for all factory presets for the toontrack superior drummer
  3 alt-rock ezx expansion library. These racks provide out of the box
  integration workflow between Ableton live and toontrack superior drummer using
  the ezx expansions including a host of features ready to use for composition
  and performance using Ableton push or similar controllers.

  12 ableton drum racks to instantly load the factory library "mix ready"
  presets with ableton mappings. Colour coded pad design for visual performance
  and finger drumming. All racks use consistent drum rack colouring so you can
  visually and immediately spot your snares from your crashes.

  Instrument articulations ready to go in one massive layout using ableton push
  64 pad layout mode. Individually labelled drum rack pads for clear
  visualisation, post performance editing and automation to all drum rack /
  instrument articulations in ableton.

  Ableton macros mapped to toontrack superior drummer macros with preset values
  for ease of use in push and simple to use automation programming. 12 ableton
  drum racks for all alt-rock factory presets single audio output to a single
  ableton track.

  Use the template racks and extend to your own toontrack superior drummer 3
  alt-rock ezx presets, swapping out individual sounds or articulations. You are
  100% ready to go with the factory presets but there is no limitation to
  creating your own presets from these templates.
specs: |-
  - Ableton drum racks
  - Toontrack superior drummer 3 alt-rock ezx integration
  - 12 Ableton drum racks
  - Ableton push controller support
  - 64 pad layout mode
  - Colour coded pad design
  - Ableton macros mapped to toontrack superior drummer macros
  - Single audio output to single Ableton track
  - Individually labelled drum rack pads
  - Factory presets ready to use
  - Custom preset creation capability
  - macOS and Windows compatibility
