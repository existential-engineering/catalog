details: |-
  Aureus ventus - golden wind - is a unique library for steinberg's hybrid
  sampler/synthesizer/granulator halion 5 which combines flute with all sorts of
  achromatic and chromatic percussion instruments like hang percussion, various
  chimes (also glass chimes), glockenspiel, gongs, crotales, bells, singing
  bowls, some deep drums, break drums (steel break discs) and more.

  The flute sounds for this library are created by using a special playing
  technique named pars-pro-toto, invented by german flautist andreas mazur who
  also performed the samples used in aureus ventus. He found a method to create
  beautiful and expressive flute sounds by playing on the single parts of a
  conventional flute using special fingerings and embouchure techniques. This
  yields sounds somewhere in between a shakuhachi, an okarina, a viola and a
  voice, hard to describe in words really...

  Multi-sampled bass flute instruments, some vocal and string sounds and
  tempo-synced percussion loops are also included in this library. In addition
  to the above a wealth of electronic derivatives create a counterpoint to the
  acoustic sound worlds. Tonal soundscapes, ethereal tinkles, warm and ominous
  drones, minimal sequences, lush pads and other fascinating textures created
  with programs like kaleidoscope, crusherx, metasynth, grm tools, serum and
  zynaptiq's morph are layered with the acoustic sounds to create expressive
  instruments.

  Many of the patches make use of halion's exceptional granular engine, it's
  deep sample player and the synth engine, often layering or splitting different
  synthesis forms in one patch with key-switchable articulations or
  sound-combinations and round robin alternations.

  All of the 108 presets have the 8 quick controls and the modulation wheel
  assigned, many also use aftertouch and/or halion's sphere-modulator, some make
  use of the flexphraser and trigger pads. All acoustic instrument-samples in
  this library were recorded with 3 neumann microphones in l-c-r at 48
  khz/24-bit, a u87 as the center mic and a stereo set of km 184 for l-r, in
  some scenarios a shure ksm 141 substituted the u87 and sometimes 4 mics were
  used simultaneously. All microphone signals are phase-aligned.
specs: |-
  - 108 presets
  - 3.99 gigabyte of original samples
  - 48 kHz/24-bit/stereo
  - Granular engine
  - Sample player
  - Synth engine
  - Key-switchable articulations
  - Round robin alternations
  - 8 quick controls
  - Modulation wheel
  - Aftertouch support
  - Sphere-modulator
  - Flexphraser
  - Trigger pads
  - Halion 5 or 6 required
