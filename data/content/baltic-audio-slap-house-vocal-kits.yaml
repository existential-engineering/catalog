details: |-
  'Slap House Vocal Kits' from baltic audio brings you three powerful vocal kits for Slap House incl. vocals, samples, loops, stems, MIDIs and presets for Serum & Spire synthesizer to push your production to the next level. You'll find everything you need for a complete chart-topping Slap House hit.

  The vocals come along with dry and wet versions and include lead vocals, backings, adlibs, doublings and more.

  17 MIDI files are included for the majority of musical phrases heard in these kits. Together with the collection of several bass-, synth- and drum shots as well as presets for Serum & Spire synthesizer there are no limits to your creativity.

  Of course, the numerous ready-to-use loops and stems also allow you to achieve great results very quickly.

  You can use this pack for genres like Slap House, Future House, Deep House, EDM and more.
specs: |-
  - 3 Construction Kits
  - 59 Vocal Tracks (Dry & Wet Versions)
  - 85 Oneshots
  - 68 Loops (incl. Sidechain Versions)
  - 53 Stems
  - Vocals, Basses, Synths, Drums, FX
  - Key-labelled
  - 125 BPM
  - 2 GB of content
  - 24-bit/44.1kHz
  - PC/Mac Compatible
  - 100% Royalty-Free
