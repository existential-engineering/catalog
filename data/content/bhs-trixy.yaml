details: |-
  BHS Trixy is the th-u expansion library, signed by big hairy sounds, seeking
  to recreate the 80's and 90's tones of john petrucci, metallica, andy summers,
  and others, based on mesa/boogie triaxis preamplifier.

  The library contains 55 rigs, captured using the following amplifiers: triaxis
  and 2:90 tube preamp and power-amp rack setup.

  Captured with a classic recto 4x12 cab, and bogner 4x12 speaker cabinets using
  v30 speakers with classic API preamps.

  The library also includes 26 patches focused on recreating the famous album
  guitar tones.

  This library requires th-u full or one of its editions.
specs: |-
  - 55 rigs
  - 26 artist presets
  - Mesa/boogie triaxis preamplifier-based
  - Triaxis and 2:90 tube preamp and power-amp rack setup
  - Recto 4x12 cabinet
  - Bogner 4x12 speaker cabinets
  - V30 speakers
  - Classic API preamps
  - 80's and 90's guitar tones
  - Th-u full or editions compatible
