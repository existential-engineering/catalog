details: |-
  Big Bases for kv331 synthmaster 2.6.9+ by schleudertrauma contains 51 preset
  bases specially made for hiphop, funk, house, techno, electro and dubstep.

  The bases cover a wide range of sound, from soft to very hard and dominant.

  Many of the presets allow you to make wobblebases easily by using the
  modwheel.

  With this pack you get 12 free single cycle waveforms, too.

  The easy knobs are fully assigned.
