details: |-
  Afro-latin percussion volume 1 offers an impressive collection of acoustic
  percussion loops and organic rhythms, perfect for layering with existing
  one-shot drum hits or building percussive ensembles to add excitement and
  rhythm to your drum tracks. Volume 1 focuses on 'light' afro-caribbean and
  latin american percussion instruments including; multiple shakers, cabasa,
  guiro, claves, sticks, bells, wood blocks and many other percussive 'toys'.

  The library explores a wealth of different playing styles and rhythms which
  have been expertly played and recorded by world-class percussionist ed uribe
  and engineer jeff trueman from new york, usa. The result is a unique and
  highly usable collection of afro-latin percussion loops/samples which suit a
  wide range of musical styles; from house music and electronic genres, to film
  scores and media applications.

  All loops and samples have been recorded with multiple high-end microphones
  via API 3124 and avalon vt737sp pre-amps, with sound sources being mixed to
  perfection (post recording) to achieve finalized high-quality stereo loops and
  performances.

  Percussion loops raw contains 588 authentic afro-latin percussion loops and
  fills, carefully recorded at 126 bpm using a well thought-out selection of
  high-end microphones and pre-amps. In order to capture the authentic sound,
  dynamics and energy of ed's playing technique, the loops, fills and
  performances in this folder have been left completely 'raw', with only very
  minor editing and zero post processing.

  Percussion loops time corrected contains 456 time-corrected percussion loops -
  carefully created by editing the 'raw' percussion loops and performances. The
  loops in this folder have been specifically created for those producers who
  require 'machine tight' timing in their music. Each loop has been
  time-corrected by carefully editing and moving individual transients/hits from
  within the performances.
