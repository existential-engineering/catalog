description: Bocs (boards of canada synthesis) is a Kontakt library inspired by
  the electronic duo boards of canada.
details: |-
  Contains all three revered bocs volumes in one bargain priced bundle -
  totaling 55 patches which can be blended, morphed and modulated to your taste.
  These wav files are open for you to use in other applications.

  These sounds have been created using similar sampling and recorded methods
  utilised by the group themselves. Vintage analog synths, 4-tracks, valve amps
  even vhs recorders were used to create samples more authentic than anything
  we've heard before. These sounds have a dirty, dusty, and dream like quality
  just like that elusive boards of canada sound.

  All 55 sample banks each fit into two sound modules within the kontakt gui
  which consists of a patch blend option. Drop the volume on module 2 and use
  these samples as fantastic sounding individual patches. Combine any two of the
  ten different sample sounds and change settings such as volume, attack,
  release or perhaps add a high or low pass filter. With this awesome blend
  functionality you have the ability to create a vast array of new sounds
  tailored to your individual needs.

  Use the modulation controls to change any parameter over time. You want a long
  silky filter sweep? You got it. Want to control the amount of oscillating
  micro tuning? Done. You just want those vintage analog synths moving and
  panning in some crazy manner whilst you control the oscillation speed in real
  time? Got it covered.
specs: |-
  - Kontakt library
  - 55 patches
  - Patch blend option
  - Two sound modules
  - Ten different sample sounds
  - Volume control
  - Attack control
  - Release control
  - High pass filter
  - Low pass filter
  - Modulation controls
  - Parameter modulation over time
  - Filter sweep
  - Micro tuning oscillation control
  - Panning control
  - Oscillation speed control
  - Wav files compatible with other applications
  - Kontakt 5.5.1 full version required
  - 2.2gb disk space
