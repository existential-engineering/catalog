details: |-
  Ableton Drum Racks Bundle for ezDrummer Metal Edition is a collection of
  ezdrummer performance drum racks on Ableton push featuring over 100 Ableton
  drum racks and over 50 Ableton live routing templates configured for leading
  toontrack ezdrummer2 core libraries and 2 additional metal genre ezx
  expansions metal machine and metal! Ezx.

  This library contains 4 timbresandtones ableton drum rack products bundled for
  toontrack ezdrummer modern kit, vintage kit, metal machine and metal! Ezx:
  ableton drum racks for ezdrummer modern kit with 34 ableton drum racks
  individually mapped to all modern kit factory library content presets, with 17
  predesigned ableton live templates; ableton drum racks for ezdrummer vintage
  kit with 24 ableton drum racks individually mapped to all vintage kit factory
  content presets, with 12 predesigned ableton live templates; ableton drum
  racks for ezdrummer metal machine ezx with 28 ableton drum racks individually
  mapped to all metal machine ezx factory content presets, with 14 predesigned
  ableton live templates; ableton drum racks for ezdrummer metal! Ezx with 16
  ableton drum racks individually mapped to all metal! Ezx factory content
  presets, with 8 predesigned ableton live templates.

  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all ezdrummer factory presets from ableton push
  controller device browser. Over 100 ableton drum racks to instantly load the
  factory library mix ready presets with ableton mappings.

  Colour coded pad design for visual performance and finger drumming.
  Individually labelled drum rack pads for clear visualisation, post performance
  editing and automation to all drum rack / instrument articulations. Mapped
  ableton macros to ezdrummer macros with preset values for ease of use in push
  and simple to use automation programming.

  Audio routing options include singleout presets featuring 51 ableton drum
  racks for all factory presets single audio output to single ableton track, and
  multiout presets featuring 51 ableton drum racks for all presets in multiple
  audio channel output from the plug in to multiple ableton audio tracks using
  the multi output ableton template also provided.
