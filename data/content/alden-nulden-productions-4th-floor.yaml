details: |-
  4th Floor percussion combo is an Alden Nulden Productions free Kontakt library instrument made with samples from shin-ei 4 in the floor percussion combo.

  4th floor has 32 samples at 44khz at 16-bit. It has 4 pads: bassdrum, tom, claves and snaredrum, as the original drum machine has.

  It's very simple to use with just a volume knob for each pad, and one tape effect knob.
