details: |-
  BOL - Tabla Mouth Percussion by Crypto Cipher is soundware (samples or presets
  that load into other products) for macOS and Windows.

  Features tabla mouth percussion phrases and mouth shots with two main patches
  (mouth percussion patch and mouth shot patch) using a matured male voice.

  Mouth percussion in classical, folk and experimental style with custom script
  for bol, pink keyswitch for selecting mouth percussion styles, and green
  keyswitch to select subsets.

  Sample resolution: 44.1 khz/24-bit format with wave files kept unlocked and
  sample size of 620 mb in kontakt format.

  Note: free kontakt player will only work for 30 minutes. Product works with
  kontakt 5.3 or higher full retail version.
