description: "Vance Powell is a seven-time Grammy award-winning producer,
  engineer, and mixer who works out of his private studio Sputnik Sound located
  in Berry Hill, Nashville, Tennessee. His career in audio began in live sound,
  where he toured with major international artists which led to playing a
  pivotal role in building Blackbird Studios, one of the largest studio
  complexes in the United States, and serving as its chief engineer. This
  experience and his technical expertise and artistic vision have led to
  widespread industry acclaim and multiple Grammy Awards for his engineering
  work. This expansion pack brings the analog engineering workflow of Vance
  Powell to the ControlHub plugin platform, giving you access to his go-to
  hardware mixing chains. Built around a modified SSL 6000 E-series console, the
  traces captured bring you the same organic, engaging, and alive tones that
  define his iconic productions. This expansion pack has a total of 30 presets."
