details: |-
  Sick twisted minds studios is back with a huge collection of highly developed wavetables created for steve duda and xfer records revolutionary new synthesis platform, serum. Featuring 640 highly processed analog sounds that have the added flexibility of allowing the user to filter their analog sound independently of serum, or not at all; analog filters contains a huge assemblage of warm, harmonic wavetables molded to perfection for you by professional audio engineers.

  Created for one of the most intuitive and refreshing vsts in electronic music production, this pack offers a wealth of creative options for your next production. Step up your game with the sounds of analog filters vol. 1.

  Analog filters vol.1 by sick twisted minds is soundware (samples or presets that load into other products) for macos and windows.
specs: |-
  - 640 highly processed analog sounds
  - 64 bandpassed tables
  - 320 high passed tables
  - 320 low passed tables
  - 320 unprocessed tables
  - 320 single cycle waveforms
  - 10 powerful and varied presets
  - Instruction and tip guides
  - Compatible with serum
  - Macos and windows
