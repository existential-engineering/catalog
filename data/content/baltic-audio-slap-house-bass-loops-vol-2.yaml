details: |-
  'Slap House Bass Loops Vol 2' by baltic audio comes along with 30 hitting bass loops for your next Slap House production. Additionally the package includes the MIDI files of all loops and 15 bass oneshots.

  The loops are ready to work out of the box and are available in normal and sidechain versions.

  If you want to change a sound or a melody the MIDI data and the bass oneshots give you even more flexibility.

  Please note: The drums and FX used in the demo are not included in this product!
