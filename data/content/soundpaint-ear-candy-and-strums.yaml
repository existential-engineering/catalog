details: |-
  Sweet, Sweet Music. Ear Candy and Strums brings sweet, sweet music to the ears. Otherworldly soundscapes are experienced through its magical and ethereal sonic characteristics. Perfect for film, tv, and game scoring, but equally capable of adding delicious flavor to a pop track, the sounds in this library range from nasty gritty synth to the sweet, beautiful, and melancholic. By focusing more on the higher register and harmonic range, rather than the low, dark, rumbly Hybrid Cinema sounds we are typically used to, your sonic goodies will be full of intense flavor. 62 Programs made from only 6 Parts showcases how incredibly versatile this library is. These Programs have been carefully crafted and curated to make perfect presets that can be used in any music genre. Ear Candy and Strums is made up of synths and analog sources that have been programmed and polished to perfection. This library is sure to transport you to new sonic realms.
