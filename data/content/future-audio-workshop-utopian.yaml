details: |-
  Inspired by the enigmatic atmosphere of Travis Scott's album Utopia, sound designer and producer The 44th Floor harnessed his appreciation for vintage hardware and modern production to create a selection of characterful sounds for SubLab XL.

  You'll get 15 sub-bass sounds ranging from analogue-inspired to ultra-modern.

  Credits: This pack was designed by sound designer and producer The 44th Floor (Trippie Redd, G Herbo, Raekwon).

  Once your purchase is complete, the pack will show up in your FAW account. Simply download the zip file and follow the instructions on how to import your new sounds into SubLab XL.
specs: |-
  - 15 sub-bass presets for SubLab XL
  - Patches: 90s Memphis, After Hours, Broken Modular, Dean Moog Modular, Father Stretch My Hands, GooseBumps Moog, Guess Whos Going, H-Town, Mike Dean Live Bass, Pray 4 Love, SDP Interlude, Sicko Mode Sub, Skeletons, Spooky Memphis Era, Wake Up Ending
