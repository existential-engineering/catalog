details: |-
  'Serum Essentials Vol 1: Future Bounce' from baltic audio is aimed at producers looking for the sound of current Future Bounce. It holds 64 top-quality presets for the Serum synthesizer, including hand-crafted leads, basses, plucks, synths and more.

  Each preset is programmed by a professional sound designer, with every parameter tweaked in detail, as a source for new and commercial sounds within a composition.

  The material can also be used for genres like Future House, Progressive House and Dance.

  In addition, 25 MIDI files taken from the demo are included.

  Please note: The drums and some FX used in the demo are not included in this product. These presets require v1.253 or higher of Xfer Records Serum.
specs: |-
  - 64 Presets for Serum
  - 19 Basses
  - 17 Leads
  - 16 Synths
  - 9 Plucks
  - 2 Drums
  - 1 Pad
  - 1 FX
  - 25 MIDI Files
  - Multi-genre
  - PC/Mac Compatible
  - 100% Royalty-Free
