details: |-
  New Loops presents Avenger Granular Spheres a new avenger expansion pack with
  one hundred granular pad presets. You'll find a wide selection of ambient
  pads, atmospheric soundscapes, cinematic ambiances, and pad textures.

  Each one of these avenger presets has 5 macros assigned for amp attack, amp
  release, granular speed, delay, and reverb. The mod wheel controls the lowpass
  filter, and aftertouch controls the granular grain size.

  Avenger granular spheres is perfect for lush ambient backing pads, mysterious
  ambiances, cinematic atmospheres, film score textures, game score atmospheres,
  ethereal pads, and more.

  This avenger sound pack will surely find its way into many genres and is
  especially well suited to modern film scores, sound tracks, game scores,
  chill-out, and ambient music, but also useful for techno, future garage, and
  drum and bass.

  This avenger expansion pack contains only avenger presets and does not include
  drum patterns. Requires vps avenger version 1.8.2 or later and might not work
  with earlier versions.
specs: |-
  - 100 vps avenger presets
  - Ambient pads
  - Atmospheric soundscapes
  - Cinematic ambiances
  - Pad textures
  - 5 macros for amp attack
  - 5 macros for amp release
  - Macros for granular speed
  - Macros for delay
  - Macros for reverb
  - Mod wheel controls lowpass filter
  - Aftertouch controls granular grain size
  - Level matched with headroom
  - Avenger expansion format
  - Requires vps avenger version 1.8.2 or later
  - Pack size: 932 MB
