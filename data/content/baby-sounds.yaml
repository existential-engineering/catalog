details: |-
  Baby Sounds library includes 160 hq (24-bit/96khz) indoor recordings of
  newborn, infant, toddler laughs, sighs, screams, whimpers, giggles, and cries.
  All captured in real-life conditions, over a 14-month period.

  Apart from the profound pre-speech vocalizations, you'll also find cute
  recordings of a suckling pacifier, baby farts, breathing, breastfeeding and
  sneezing that will help your foleying character become more realistic and
  lifelike.

  Overall, the collection caters to projects in need for authentic newborn/
  infant/ toddler boy vocal expressions. This library can be used to dub a
  character or serve as unique source of inspiration in the process of designing
  new creature.

  The sounds were captured using stealth recording techniques only. As one might
  guess, such methods don't always render the results that controlled recording
  environments do. That said, post-production and curation have worked wonders
  for this library.

  The cultural/language identity of this library is non-specific, making it
  adaptable and suitable for universal use. Each sound has detailed soundminer
  metadata, that can be read by various applications and services, making it
  easy to locate and edit.
