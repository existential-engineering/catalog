details: |-
  Bloom Vocal Edit fuses an extensive collection of energetic vocal chops,
  hooks, and one-shots into a versatile and dynamic instrument, meticulously
  crafted to inject your tracks with infectious vocal melodies and hooks. This
  powerful tool transforms the way you incorporate vocals into your productions,
  making it effortless to create unique, professional-sounding chops that demand
  attention.

  Bloom vocal edit lets you switch between phrases to create unique hooks, build
  huge fx modulation to captivate your audience and transform it all with a
  chain of vocal-specific processors. Crafting the ideal vocal element is now an
  intuitive and engaging process, allowing for hands-on control over sample
  triggering and sound shaping. Four macro controls offer instant tonal
  adjustments, while the edit page unveils detailed customisation tools, giving
  you complete control over sample manipulation, sequence creation, modulation
  and effects across 250 presets.

  Choose your key signature, select a bank of samples or a preset, and trigger
  one of 14 bpm-synced phrases spread across 2 octaves. White keys initiate
  vocal samples and loops, while black keys adjust characteristics such as
  playback speed and pitch, besides triggering bespoke sequences and effect
  modulation. The four innovative macro controls glue for smoothing out
  dynamics, fuzz for distorted pedal-like distortion, metallic for a short
  slapback delay, and doubler for stereo width and ensemble effects steer a
  bespoke chain of effects, fine-tuned for the curated selection of vocal
  samples that form the instrument.

  Bloom vocal edit's edit page is where you take full control over its vocal
  content, allowing for the precise tailoring of the existing samples to craft
  something truly individual. In the sample edit section, modify the 14 source
  samples in each bank. Set sample start and end points, and adjust trigger
  types, playback direction and speed. Refine pitch, formant settings, and the
  envelope's attack and release, alongside setting up choke groups for dynamic
  vocal interactions.

  Make the bloom instrument your own with the ability to drag and drop audio
  files into it. You can do this via the waveform view on the edit page or any
  empty slot on the banks page. Set the key and bpm of your samples to make them
  integrate seamlessly with the bloom engine.
specs: |-
  - 14 sample keys

  - 5 factory modifiers: half-time, double-time, reverse, octave down, octave up

  - 5 custom modifiers

  - 8 sample banks / 112 vocal samples

  - Samples synced to host bpm

  - Key selection

  - Sample randomise

  - 4 macros: glue, fuzz, metallic, width

  - 5 main fx parameters: bitcrush, delay, reverb, lo-cut, hi-cut

  - Global bypass

  - 250 presets

  - Waveform display

  - Playback direction: forwards, backwards, pendulum, loop

  - Playback modes: hold, latch, relative

  - Playback speed: normal, double, half

  - 4 choke groups

  - Start / end markers with snap to grid, snap to transient

  - Sample crossfade, attack, release, pan, volume

  - Sample pitch, fine, formant, pitch warp

  - Sample mode for triggering sequences

  - Fx modulation: bitcrush, delay, reverb, lo-cut, hi-cut, pitch, velocity

  - Sample / modulation randomise

  - Phrase rate, sync, swing, steps, latch, beat retrigger controls

  - 3 rearrangable effects: bitcrush, delay, reverb

  - Bitcrush parameters: bits, samples, mix, wash, dynamic, tone

  - Reverb mode: plate, hall, spring

  - Reverb parameters: length, size, mix, pre-delay, duck, lo-cut, hi-cut,
  input, output

  - Delay mode: stereo, ping-pong

  - Delay parameters: l/r time, l/r link, sync time, mix, lo-cut, hi-cut,
  feedback, duck

  - Global lo-cut, hi-cut, tone, dry, wet






  - 64-bit compatible

  - Macos 10.15 or higher

  - Intel / native apple silicon supported

  - Windows 7 or higher

  - Daws supported: ableton live, pro tools, logic pro, fl studio, cubase,
  nuendo, reaper, reason

  - Internet connection required for authorization
