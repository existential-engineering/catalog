details: |-
  This pack is perfect for producers who are looking for fresh and catchy
  melodies and ideas to start new banging bigroom edm tracks.

  You'll find 10 different melody kits, each divided into basses, chords, leads
  and more. The loops are ready to use and are available in both wet and dry
  versions including tails.

  With the included MIDI loops you can customize the melodies for your ideas or
  add your own sounds. So with this pack there are no creative limits for you.

  Please note: the drum samples in the demo are not included in this product!
specs: |-
  - 10 melody kits
  - 99 wav tracks
  - 32 MIDI loops
  - Dry & wet versions with tails
  - 128 bpm
  - Key-labeled
  - Over 400mb of content
  - Pc/mac compatible
  - 100% royalty-free
  - Ready to use in any DAW
