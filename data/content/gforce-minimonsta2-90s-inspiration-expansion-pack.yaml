details: |-
  The Minimonsta2 – 90s Inspiration Expansion Pack comprises 50 meticulously crafted patches tailored for the GForce Minimonsta2 synthesizer. The collection captures the sonic character of 1990s electronic and dance music, witnessing an unprecedented explosion of the genre.

  From euphoric leads to fat round basses, the pack spans styles that defined club culture during that decade — techno, house, and dance music that left a lasting mark on electronic music history.

  The expansion pack is exclusively available to registered GForce Minimonsta2 users.
