details: |-
  Welcome to the Minimonsta2 – 90s Inspiration Expansion Pack – a set of 50 meticulously crafted 90s inspired patches designed exclusively for the GForce Minimonsta2 synth. Explore a diverse sonic landscape ranging from euphoric leads to fat round basses and covers a diverse range of music styles.

  The 1990s marked a significant era for electronic and dance music, witnessing an unprecedented explosion of the genre. This decade saw the rise of techno, house, and dance, genres that defined club culture around the world. Raves and electronic music festivals became cultural phenomena, drawing massive crowds. The sounds of this era, characterized by synthesizers, drum machines, and a strong emphasis on rhythm and melody, not only dominated the club scenes but also heavily influenced mainstream pop music.
