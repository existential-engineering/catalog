details: |-
  Futurism Volume 1 is a style pack for Mixed In Key's Pilot Plugins. The page describes it as the first suite of styles available for Pilot Plugins, and states that the suite is perfect for genres like Melodic Techno, Future Rave, Melodic house and progressive house but is flexible enough to be used on so much more.

  The pack is organised across the three Pilot instruments named on the page. Nine melody styles are supplied for Pilot Melody: M1 Loop Master 5000, M2 Star Dust, M3 Pulsar, M4 Andromeda, M5 Future Bounce, M6 Ibiza 7AM, M7 Flyaway, M8 Golden and M9 Space Between.

  Ten bass styles are supplied for Pilot Bass: B1 Foundation, B2 Offbeat, B3 Disco Bass, B4 Clave, B5 Shape of Bass, B6 Bass Harmony, B7 Walking Bass, B8 Gravity, B9 Tension and B10 Flagship.

  Seven arpeggio styles are supplied for Pilot Arpeggio: A1 UP, A2 Down, A3 Texture, A4 Random Walk, A5 Kaleidoscope, A6 Staircase and A7 Cycles, for a total of 26 styles across the three plugins.

  The styles load into the Pilot Plugins suite rather than running on their own, and the page positions the pack as sold together with Pilot Plugins. Mixed In Key's Pilot hub page describes Futurism as the style pack aimed at underground electronic producers, designed for Melodic Techno, House and Progressive House, alongside a separate Pop Foundation pack.
specs: |-
  - 26 MIDI composition styles for the Pilot Plugins suite
  - 9 melody styles for Pilot Melody: M1 Loop Master 5000, M2 Star Dust, M3 Pulsar, M4 Andromeda, M5 Future Bounce, M6 Ibiza 7AM, M7 Flyaway, M8 Golden, M9 Space Between
  - 10 bass styles for Pilot Bass: B1 Foundation, B2 Offbeat, B3 Disco Bass, B4 Clave, B5 Shape of Bass, B6 Bass Harmony, B7 Walking Bass, B8 Gravity, B9 Tension, B10 Flagship
  - 7 arpeggio styles for Pilot Arpeggio: A1 UP, A2 Down, A3 Texture, A4 Random Walk, A5 Kaleidoscope, A6 Staircase, A7 Cycles
  - Aimed at Melodic Techno, Future Rave, Melodic House and Progressive House
