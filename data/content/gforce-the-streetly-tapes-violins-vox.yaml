details: |-
  The Streetly Tapes – Violins & Vox is an expansion for M-Tron Pro IV, produced in close partnership with Streetly Electronics — the original makers of the Mellotron. All recordings were processed through the Streetly Skellotron to preserve the character of the original tape mechanism.

  Violin performances were recorded by Claire Lindley across 10 articulation variations, and vocal recordings were contributed by Caitlin Downie across 15 syllable and dynamic variations. Every tape bank was recorded on original EMI tape stock at 35 notes per bank.

  The library ships as a 508 MB download and installs directly into M-Tron Pro IV. A registered copy of M-Tron Pro IV is required.
