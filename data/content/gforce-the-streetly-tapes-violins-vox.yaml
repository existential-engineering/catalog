  Electronics.
details: |-
  While the previous Streetly Tapes volumes for M-Tron Pro have varied sound sets taken from the vast, original Streetly Electronics Melly tape archive, with Violins & Vox we've done something slightly different, a new VIOLIN and VOCAL pack for your M-Tron Pro.

  This expansion pack features the strong and varied vocal performances of Caitlin Downie and the virtuoso violin voicings of Claire Lindley, and has been lovingly given the Streetly Skellotron treatment for the unique, authentic sound only offered by EMI tape over correctly aligned azimuth playback heads.

  The add-on pack includes 25 carefully curated tape banks from the original UK 'Tron masters for M-Tron Pro. The pack also contains over 180 M-Tron Pro Patches.

  Violin tape banks: Ensemble 01, Ensemble 02, Ensemble 03, Full Vibrato, Gentle Vibrato, No Vibrato, Pizzicato, Soft, Spiccato, Tremolo. Vox tape banks: Aah Forte, Aah Mezzo, Aah Soft, Aah Staccato, Eee Forte, Eee Mezzo, Eee Staccato, Ensemble, Ensemble Forte, Ensemble Soft, Ensemble Staccato, Mmm Soft, Ooo Forte, Ooo Mezzo, Ooo Staccato.

  The Streetly Tapes – Violins & Vox Expansion Pack is only available to registered users of M-Tron Pro. Additionally, it is exclusively available via this website as a direct download via “My Instruments” when the purchase has been completed.
specs: |-
  - A GForce Software and Streetly Electronics collaboration
  - Tape banks from the original UK 'Tron masters
  - Derived from original EMI tape-stock
