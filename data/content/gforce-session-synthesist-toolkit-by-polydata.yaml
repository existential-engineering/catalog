details: |-
  Session Synthesist Toolkit by Polydata is a 50-patch expansion for GForce Oddity3, the virtual recreation of the ARP Odyssey synthesizer. The patches are inspired by 1970s session synthesists and cover a broad range of classic analog tones suitable for modern productions.

  The pack was created by Polydata (Shahruz Moshtael) and is distributed exclusively via the GForce 'My Instruments' portal after purchase. Requires a registered copy of Oddity3.
