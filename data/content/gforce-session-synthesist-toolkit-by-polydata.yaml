description: A preset expansion pack containing 50 patches inspired by 1970s session synthesists, crafted by Polydata (Shahruz Moshtael). Designed to deliver vintage-voiced sounds that complement modern productions while drawing from the classic era of analog synthesis.
details: |-
  In the 1970s when synthesizers were working their way into popular music, those who owned one and had a command of designing sounds were in high demand. These session synthesists were able to use synthesizers to bring that extra color and vibrancy into productions, from R&B and rock, to pop music, film scores and advertisements. The focus was always on creating a complete production, and how the synths can support the entire arrangement while adding a unique sonic element.

  The Session Synthesist Toolkit Expansion Pack for the GForce Oddity3 draws inspiration from that time and the methods of those who helped create so many classic sounds, and laid the foundation of synthesizers as an enduring instrument. A set of 50 patches rooted in this classic era of synthesis, but looking forward to the modern musical landscape and beyond. The patches are made to be a diverse toolkit of carefully crafted and vintage-voiced sounds that you can draw from to quickly bring life to your productions.

  About Polydata: Polydata is the work of composer and sound designer Shahruz Moshtael. Both in creating music and in designing sounds, he draws inspiration from the first golden age of analog synthesis from the late 1970's to early 1980's, but with the aim of moving forward into the future, continuing to develop that style and approach, rather than just repeating the past.

  The pack is only available to registered users of GForce Oddity3. Additionally, it is exclusively available via this website as a direct download via “My Instruments” when the purchase has been completed.
specs: |-
  - 50 meticulously crafted patches by Polydata
