details: |-
  Aeria is a new collection of 130, haunting, dreamy and emotive widescreen
  sounds for u-he Repro-1. A blend of soft and silky analog sounds and rusty,
  crunched tense sounds suited for cinematic, ambient and experimental styles.

  Inspired by the music of jon hopkins, solar fields, max ritcher and tangerine
  dream, aeria is formed by dynamic bassloops, cinematic percussion loops, rusty
  analog basses, dreamy leads and pads, dark dystopian soundscapes, inspiring
  and rushing sequences and arps.

  There's a lot of depth, character and analogue warmth thanks to the nice
  sounding repro-1 oscillators and filters. Modwheel and velocity are of course
  assigned adding an extra of playability.

  All presets are nks tagged for use with komplete kontrol or maschine.
