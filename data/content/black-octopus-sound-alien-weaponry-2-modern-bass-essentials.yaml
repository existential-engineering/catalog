description: The second Alien Weaponry pack from Tevlo, collecting samples, loops and Serum presets for modern bass music.
details: |-
  Alien Weaponry 2 is the second installment of Tevlo's Alien Weaponry series for Black Octopus Sound, combining samples, loops and Serum presets aimed at bass-heavy production.

  The pack is suited to multiple bass heavy genres, including but not limited to Dubstep, Riddim, Trap and Drum and Bass.

  The Serum presets cover Bass, Lead, Pluck and Pad sounds that can be shaped into custom patches, alongside 808, drum, bass and FX one shots.

  Loop content ranges from drums and drum fills to melodic elements and full war drum loops.

  The material is influenced by the modern sounds of Dubstep, Riddim, Trap, DnB and Bass Music, following the vibes of Tevlo and other bass music artists such as Virtual Riot, Zomboy, Au5, Prismatic and Fractal.
