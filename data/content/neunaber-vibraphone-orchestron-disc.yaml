description: An optical sound disc for Orchestron and Panoptigon disc players.
  Vibraphone features interlocking rhythmic patterns from an acoustic vibraphone
  recording rather than a melodic sound.
details: |-
  This disc is compatible with Orchestron and Panoptigon players. VIBRAPHONE is an entirely NEW sound for the Orchestron. This sound, like our earlier PIANO disc, is not really intended to be played melodically. Each note is actually a simple rhythmic pattern, and when you play chords, these patterns interlock in complex ways to created a hypnotic effect. Great for getting Steve Reich style minimalist textures. This disc also works well played upside-down, as you can hear in the second part of the demo. Please excuse the keyboard playing here, which is just a quick noodle to demonstrate the sound! SPECIAL THANKS to Mark Greenberg for playing and recording the vibraphone! PLEASE NOTE : This disc WILL NOT work properly in an Optigan ! It WILL play, but the sounds will NOT be mapped correctly to the keyboard- they will be mapped mostly haphazardly across the chord buttons. Please don't order this disc expecting to easily use it in an Optigan. Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility
