details: |-
  We are proud to present our first expansion for the semi-modular beast of a
  synth from togu audio line: tal-mod. Inside you will find 82 presets that take
  advantage of the unlimited amount of modulation possibilities, the three
  fantastic sounding oscillators and two analog sounding resonant filters.

  Add the two lfo, three adsrs and a very nice set of effects and you can see
  why we are so excited. Smooth and deep basses, lush pads, energetic leads and
  inspiring arps, this collection of presets will spark your creativity.

  We made heavy use of modwheel and velocity assignments and we also made a lot
  of presets mpe optimized, making this the first bank to utilize this latest
  addition in tal-mod 1.5.0.

  Included in this soundbank: 17 lead sounds. 14 pad sounds. 11 drum sounds. 10
  bass sounds. 8 chords. 7 arps. 6 sequences. 5 effect sounds. 4 keys.

  Requirements: tal mod 1.5.4 | a VST(64), AU or AAX compatible host |
  optionally: mpe controller to make use of the mpe abilities.
specs: |-
  - 82 presets
  - Unlimited modulation possibilities
  - Three oscillators
  - Two analog sounding resonant filters
  - Two LFO
  - Three ADSR
  - Effects
  - Modwheel assignments
  - Velocity assignments
  - MPE optimized
  - Mac/pc compatible
  - 100% royalty-free
  - VST(64) compatible
  - AU compatible
  - AAX compatible
  - MPE controller support
