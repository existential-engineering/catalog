details: |-
  We teamed up with guitar innovator and prolific composer Joey Santiago (lead guitarist, The Pixies) to create a library of beautifully distorted filth — the bedrock of The Pixies' epic sound – with extra warped content from the Spitfire team. Joey's signature sounds and playing styles created using his enviable guitar, pedal and amp collection will provide you with endless inspiration, while Spitfire's technology will enable you to make each sound your own.
specs: |-
  - Multi-sampled electric guitars plus the eDNA and Mercury synth engines
  - 6 signals: 4 amplified (Marshall JCM800 clean and dirty, Fender Vibrolux, Selmar) and 2 room perspectives
  - 18 Individual Plucks presets
  - 35 Santiago Sounds in the Mercury engine
  - 49 Gigantic Mutations loops in the eDNA engine
  - 150 Radiant Pads sounds curated into 125 presets
  - 9317 samples
  - 14.0 GB uncompressed .wav
  - 9.00 GB download size
  - 18.00 GB disk space required during install
  - Requires Kontakt Full 5.6.8 or higher
  - Spitfire Audio App required
