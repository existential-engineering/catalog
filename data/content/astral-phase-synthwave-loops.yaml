details: |-
  Astral Phase: Synthwave Loops by ModeAudio is a stellar explosion of cosmic
  sonic energy that will cover your music in an entire meteor shower of scifi
  synthwave euphoria. Feel the gravitational pull of this colossal 481mb
  collection of 100% royalty-free music loops, drum samples and MIDI, a universe
  of luminous, neon-bathed sound that will supercharge your tracks with vintage
  synth nostalgia and irresistible analog warmth.

  The central thruster of this spacecraft of a sound pack is an offering of 176
  music loops, a sublime selection of careening synth leads, rumbling analog
  basslines, dancing arps, soaring pads and slamming drum machine grooves, all
  caked in galactic dust and classic, retro-fired character.

  Alongside the core choice of bulging bass, synths and drums, comes sets of
  chunky guitar riffs and radioactive sfx, providing all the necessary tools to
  infuse an authentic synth pop sensibility into your tracks in a heartbeat.

  The pack includes 71 thundering drum samples, an ultra-solid collection of
  classic hits spanning the full range of the drum kit, replete with all the
  punch and crunch to satisfy your simmering synthwave cravings.

  Rounding out the pack are 106 MIDI loops and 65 synth tail samples, giving you
  full access to all musical ideas presented in the main loop folders, as well
  as a means to bring each loop to a smooth, natural decay.
