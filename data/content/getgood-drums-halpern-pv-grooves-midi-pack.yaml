details: |-
  The Matt Halpern P V Groove Pack is a complete collection of grooves played by Matt inspired by the songs and grooves on Periphery’s newest album, P V: Djent is Not a Genre.

  Matt used the album as a template for inspiration to reimagine the ideas throughout the album and come up with new interpretations and improvisations.

  This pack aims to give you grooves and fills that will influence, inspire, and help you be more creative with the music you’re writing. Each groove and fill contains accents, displacements, and nuances that will help you to feel energized and excited about writing your music.

  Use these grooves as a foundation for your riffs, vocal lines, and melodies, and let Matt be your drummer in the process. Have fun and get to work!
