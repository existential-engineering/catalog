details: |-
  Action strikes is a radically innovative instrument for huge cinematic percussion. Its state-of-the-art workflow delivers maximum impact with unmatched versatility.

  Building on the success of action strings, action strikes delivers high-impact, cinematic percussion with ultimate playability. 12 full ensembles plus 65 single instruments and 12 carefully-compiled hit sets exclusively recorded in uncompromising quality. Hundreds of timeless rhythms, adaptable for any project.

  Action strikes gives you 12 carefully-assembled and meticulously recorded ensembles. Each features its own unique sound, accurately capturing the thrill of a live orchestra. Go in deep mix and match the high, middle or low sections of any ensemble with any other with total freedom. Together, you get over 1,700 unique sonic combinations for years of inspiration.

  Action strikes puts a live percussion ensemble under your leadership. Change rhythms on the fly with intuitive key switches your left hand controls accents while your right hand chooses variations. Bring the sound from a light rumble to a thundering crescendo and back with a quick turn of the mod wheel. Adjust accent strength with the pitch wheel. Even play fills, rolls, and flams on top of your arrangements all in real-time with ultra-refined control.

  Freely combine 105 time-tested rhythms to develop your own arrangements each features five variations per ensemble section for countless rhythmic possibilities. You also get 65 single instruments with 32 playable rhythms and 12 playable sets of single hits.
