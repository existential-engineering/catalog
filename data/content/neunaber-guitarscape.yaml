description: Guitarscape is an Optigan disc in an asymmetrical 5/4 meter,
  featuring bass guitar chord button riffs, drums on the special effects
  switches, and a clean guitar keyboard scale.
details: |-
  GUITARSCAPE is the first Optigan disc in an asymmetrical meter- in this case, 5/4. The chord buttons feature bass guitar riffs, with drums on the special effects switches. The keyboard scale features clean guitar tones, and like the other discs in our "scape" series, the notes are rhythmically articulated in a variety of syncopated patterns. This makes the scale generally more suited to chords than melodic playing, but both approaches produce nice effects, either forward or in reverse. The bass patterns have been specifically written to allow for a maximum of complementary chord button combinations, such that pressing certain buttons at the same time produces composite, complex bass patterns. And if 5/4 is a bit too odd for your needs, you can always change chords on, say, every 4th beat, and you'll get even more complex pattern cycles. Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility
