details: |-
  Syvät Tunteet is a preset pack for Minimonsta2, created by Finnish producer Tontario, known for texture-inspired atmospheric electronic music and part of the Anjunadeep label since 2016. He also releases ambient-focused work under the alias 'För Alltid.' The pack is available as an exclusive download via the GForce Software website through 'My Instruments' after purchase, and requires a registered Minimonsta2 license.
