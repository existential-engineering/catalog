description: A curated collection of 25 sound presets designed by Finnish electronic music producer Tontario for the GForce Minimonsta2 synthesizer. The pack emphasizes ambient and techno music with atmospheric and cinematic qualities reflecting Tontario's signature sound.
details: |-
  Explore the depths of sound with Syvät Tunteet, a meticulously crafted preset pack for Minimonsta2 designed by artist, producer and sound designer Tontario. This collection blends traditional and creative sound design techniques with a special emphasis on ambient and techno music.

  Tontario's emotionally charged and cinematic fusion of house, techno, and ambient music takes you on an unparalleled journey. His signature sound is evident throughout Syvät Tunteet.

  Syvät Tunteet is designed to ignite inspiration and foster creativity. “I hope they can spark inspiration and that people evolve the presets into their own sounds,” Tontario adds. Dive into this pack and let the atmospheric and cinematic sounds of Syvät Tunteet elevate your music to new heights.

  About Tontario: Finnish producer Tontario first made a name for himself in the blogosphere via top charting remixes and later joined the Anjunadeep ranks in 2016. Tontario has since explored various styles of nature and texture-inspired atmospheric electronic music, gathering millions of online streams and performing across multiple countries alongside artists like Above & Beyond, Yotto, and Lane 8. You can also find his more ambient-focused music under the alias För Alltid.

  The pack is only available to registered users of GForce Minimonsta2. Additionally, it is exclusively available via this website as a direct download via “My Instruments” when the purchase has been completed.
