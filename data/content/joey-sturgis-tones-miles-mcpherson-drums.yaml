details: |-
  The Miles McPherson Drums library is a collection of recorded, edited and mixed drum samples for the Native Instruments Kontakt platform. The collection comprises two sampled kits, a Yamaha and 1972 Rogers kit recorded at Starstruck Studios, Nashville and Miles McPherson's personal studio respectively, each performed by acclaimed pro drummer Miles McPherson (Kelly Clarkson, Paramore).

  "Hi, I'm Miles. I'm writing my own bio, so I will not be referring to myself in the 3rd person. I'm a Nashville, TN. native where I currently reside. When I was still touring, I played with Kelly Clarkson, Paramore, Tonic, and Better Than Ezra. In 2013, I came off the road to pursue being a session drummer full time. Thankfully for the moment, the phone still rings. I've been very fortunate to play on some great records with some incredible artists such as Reba McEntire, Rascall Flatts, Chris Young, Kelly Clarkson, Tyler Farr, Lee Brice, Chase Rice, Jeremy Camp, and James Otto. I exclusively use Yamaha drums, Meinl Cymbals, and Vater drumsticks." (Miles McPherson)

  House Kit. Miles McPherson writes: the kit we used for this session is the kit I received for Christmas from my folks when I was 13 years old. It was my first kit and consequently still my favourite. It originally had a 22" inch kick, but I found a white, 14" x 24" Rogers shell on eBay that was made in the same year as my kit, 1972. I stripped the hardware from the 22" and stuck it on the 24". I've been using this 13", 16", 24" configuration for about a decade now. This kit was sampled using Yamaha hardware, DW pedals with a DW beater, Remo coated emperors on toms, Remo clear Powerstroke Pro on kick, Remo Controlled Sound Black Dot on snare, and Vater 55BB wood-tip sticks. For cymbals we used all Meinl Byzance series crashes, hi-hat, ride, and a china. We mic'd the kick with a D112 on the inside and a Yamaha sub-kick on the outside. The D112 is going through a Daking mic pre and eq, as are the snare top and both toms. On hi-hat, we used a Neumann KM184. On overheads, a pair of vintage AKG 452's through Chandler LTD-1's. On rooms we used a pair of Cascade Fathead ribbon mics running through two channels of the UAD 4710 mic pre before heading off to Empirical Labs Distressors, plus a pair of SM57's sitting about a foot off the ground on either side of the kick as close rooms.

  Studio Kit. Miles McPherson writes: this kit is a combination of my last two touring kits, my Maple/Birch customs that I used with Kelly Clarkson and the Club Customs I had for Paramore. The kit is a 24"x18" Maple Custom bass drum, 13"x9" Club Custom rack tom, 16"x15" Club Custom floor tom, and an 18"x16" Club Custom floor tom. The snare is a chrome-over-brass 14"x6.5" Paul Leim signature. The Club Custom toms are 6-ply Kapur wood, which gives them a warm, dark, and distinctly vintage character. For this library, I truly wanted to marry huge, dark, older sounding drums with the best of the best in modern and high-end mics and signal processing. The cymbals are all Meinl Byzance. Recorded at Starstruck Studios, whose nearly 1,100 sq. ft. tracking room, SSL 9000J series console and outboard gear let us get a variety of room sounds from different pairings of mics.

  Requirements: the instruments are Kontakt 4+ instruments and they require the full version of Kontakt 4+ (version 4.2.4.5316 or later).
