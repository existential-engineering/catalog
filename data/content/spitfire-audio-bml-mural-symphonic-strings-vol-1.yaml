details: |-
  After the masterful simplicity of the albion epic 'out-of-the-box' orchestral
  ensembles and the finely crafted detail and beauty of the sable chamber string
  range, spitfire at last are creating the ultimate symphonic-sized detailed
  string collection as part of their comprehensive british modular range.

  As with spitfire's entire bml range, mural features the best musicians working
  in london today playing rarefied and priceless instruments. The english
  session orchestra comprise the finest session musicians on the london scene,
  all of whom have played on the majority of a-list movies recorded here a
  healthy mix of seasoned session players interspersed with international
  soloists, high-profile chamber musicians and emerging young talent.

  Recorded by jake jackson at air studios, one of the finest recording studios
  in the world and host to film scores including gladiator, inception, the
  batman tryptic, harry potter, james bond and countless top selling classical
  recordings, mural has been recorded through a selection of rarefied
  microphones, via neve montserrat pre-amps, through the world's largest neve
  88r desk onto a finely maintained studer 2" tape machine (the only orchestral
  library on the market to be recorded first to tape) and finally to 96k 24-bit
  digital via high end prism ad converters.

  All the players are recorded in situ and mixed carefully with the correct
  perspective and placing so that they lock together which each and every bml
  module as if they were all in the same room together when recording. This
  means that when you start putting sections together it simply works. No
  mixing, panning, or careful manipulation of reverbs is required to create
  ultra realistic true sounding mockups, demos and masters.

  Mural also has some additional expression features including intensity,
  tightness and control of release triggers to give even more human elements and
  a further ability to tweak. Will require a full version of kontakt 4 or 5 to
  run.
specs: |-
  - 60 piece string band (16,14,12,10,8)
  - 96k 24-bit digital recording
  - Multiple microphone perspectives
  - Jake jackson mixes
  - Intensity expression control
  - Tightness expression control
  - Release trigger control
  - Intuitive gui
  - Kontakt 4 or 5 compatible
  - Neve montserrat pre-amps
  - Neve 88r desk
  - Studer 2" tape machine recording
  - Prism ad converters
