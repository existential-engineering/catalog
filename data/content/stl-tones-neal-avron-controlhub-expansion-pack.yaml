details: |-
  Neal Avron is a Grammy Award winning producer, mixer, and songwriter. He has produced, mixed and recorded hits on acclaimed albums for Fall Out Boy, Linkin Park, Twenty One Pilots, Weezer, Sara Bareilles, Yellowcard, Switchfoot, New Found Glory, Everclear, Disturbed, Walk The Moon and All Time Low. In 2010 he mixed or produced each debuting number one album on the Billboard 200 for three consecutive weeks.

  Avron honed his craft at two of the most renowned studios in the world: Criteria Studios in Miami, FL and Sunset Sound in Hollywood, CA, where he learned and worked with such greats as T-Bone Burnett, Al Schmitt, Tom Dowd and Humberto Gatica.

  This expansion pack has been designed by Neal to precisely model his mixing workflow, from punchy drum captures, and tasteful guitar starting points for any musical genre, to vocal signal chains you've heard on hit records. Included is a model of the Neve "Melbourne" console from Neal's studio which is perfect for summing together a mix with analog texture.

  This expansion pack has a total of 69 captures.
