description: 'Neal Avron is a Grammy(R) Award winning producer, mixer, and
  songwriter. Neal has produced, mixed and recorded hits on acclaimed albums
  from a wide array of artists. Avron honed his craft at two of the most
  renowned studios in the world: Criteria Studios in Miami, FL and Sunset Sound
  in Hollywood, CA, where he learned and worked with such greats as T-Bone
  Burnett, Al Schmitt, Tom Dowd and Humberto Gatica. Get your mix radio-ready
  with curated signal chains from Grammy(R) Award-winning mixer and producer
  Neal Avron.This expansion pack has been designed by Neal to precisely model
  his mixing workflow, from punchy drum presets, and tasteful guitar starting
  points for any musical genre, to vocal signal chains you''ve heard on hit
  records. Included is a modal of the Neve™ "Melbourne" console from Neal''s
  studio which is perfect for summing together a mix with analog texture.This
  expansion pack has a total of 69 presets.'
