details: |-
  Discover glitch hop pioneer Mr. Bill's take on the rumbling Reese bass, squelching Acid bass, Wub bass, and more.

  Mr. Bill is renowned for his creativity as much as his technical prowess. Alongside releasing masterfully intricate original music and remixes he is also a prominent music production educator, performing and sharing his know-how all over the world.

  You'll get 15 sub-bass sounds that range from clean and punchy to gritty and aggressive. Dive in and use them as-is or customize to fit your signature sound.

  Once your purchase is complete, the pack shows up in your FAW account. Download the zip file and follow the instructions on how to import the sounds into SubLab XL.
specs: |-
