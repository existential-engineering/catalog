  - Patches: 140 WUB, BLOATED PLUCK, CAN IT YOI, HOLLOW FM, HONKER, POWER CHORD ACID, PSY BASS KINDA, PUNCH, PUNCHY 5TH, PURE SUB, REESE SUB, SUBDUED DONK, TIPPER ACID, TONE & HISS, UGK SUB
