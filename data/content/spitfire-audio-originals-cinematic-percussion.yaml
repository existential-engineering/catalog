details: |-
  London's best percussion players, recorded at AIR Studios for widescreen dramatic effect. Seven presets spanning a range of cinematic percussion sounds — from shimmering Cymbals and resonant Tams & Gongs, to thunderous Earthquake Hits that deliver massive, room-shaking impact. Three signals: Close for detail, Room for the full AIR Studios acoustic, and a Distorted signal re-amped through a guitar amp with subtle tape delay. Reverb, High Pass & Low Pass Filter controls.

  Originals Cinematic Percussion requires the free Splice INSTRUMENT plugin to run.
specs: |-
  - 7 presets: Cymbals, Tams & Gongs, Earthquake Hits, Metal Hits, Percussion Hits High, Percussion Hits Low, Swells
  - 3 signals: Close (valve spot mics), Room (Tree and Ambient mix), Distorted (re-amped through a guitar amp with tape delay)
  - 3 controls: Reverb, High Pass Filter, Low Pass Filter
  - 1.4 GB
  - Recorded at AIR Studios, London
  - Requires the free Splice INSTRUMENT plugin and a free Splice account
  - macOS 12 or later
  - Windows 10 or 11 (64-bit)
