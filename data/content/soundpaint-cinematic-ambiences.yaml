details: |-
  Big. Emotional. Soundscapes

  A timeless collection designed for beautiful music and underscoring, Cinematic Ambiences offers over 900 hand-crafted emotional ambiences, drones and evolving soundscapes. Big, lush, ever-evolving landscapes of sounds. Designed for the sonic adventurer that wishes to expand their aural palette. The ambiences are divided into a variety of unique categories from heavenly and ethereal ambiences into large futuristic soundscapes. Wild blue skies, flutters, morning mists and everything in between. Cinematic Ambiences comes with a large group of presets exploring all the propriety features of Soundpaint, including live morphing between ambiences, tempo-synced and gated ambiences, pitch-morphed ambiences, shimmery ambiences and dozens of others.
