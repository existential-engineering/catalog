details: |-
  The sound pack "ARP FLOW Vol 01" offers solid virtual-style arpeggiator
  presets for your asm hydrasynth (all models). The 64 patches usable for
  producing or performing mainstream pop & electronic music.

  Each patch offers the same macro setting for real-time control.

  64 new presets for the asm hydrasynth synthesizer models, available as bank
  file for the free hydrasynth manager software.

  Available as set list file for the wavestate sound librarian (freeware).

  Styles: electronic, ambient, chill out, pop, retro, dance.
specs: |-
  - 64 presets
  - Asm hydrasynth synthesizer models
  - Bank file format
  - Set list file format
  - Hydrasynth manager software compatible
  - Wavestate sound librarian compatible
  - Unified macro settings
  - Arpeggiator modes: lead, comp, chord, bass
  - Real-time macro control
