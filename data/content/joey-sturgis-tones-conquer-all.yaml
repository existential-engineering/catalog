details: |-
  Conquer All is a set of 35 Impulse Responses available both raw and mixed in .wav file format, made from three cab types, three head types, three preamp types and six different microphones.

  All impulses are phase accurate and aligned for impulse response blending. These impulses pack the ultimate versatility, so you can conquer all of your guitar tones with Conquer All.

  Impulse Responses created by Michael Richards of Trackmix Recording Studio. Special thanks to Francesco Filigoi for the guitar-only examples.
