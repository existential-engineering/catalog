name: Beefowulf Bass
manufacturer: karoryfer
primaryCategory: sample-pack
url: https://shop.karoryfer.com/products/beefowulf-bass
description: A bass guitar sample library intended for hip-hop, r&b and other
  mellow, groovy styles.
details: |-
  Key features include four articulations: ordinary pluck, ghost note, phat
  pluck, phat ghost note, fall and harmonic, with up to six velocity layers and
  four round robins.

  The library contains over 2400 samples totaling 1.2 gb, with four octaves of
  range starting with a very low a, and includes release noise samples.

  Sound design options are provided through a layering patch, unison voices
  capability, vibrato with humanization, and emulated muting.

  Choice of bunny and no-bunny gui skins is available.
specs: |-
  - Four articulations: ordinary pluck, ghost note, phat pluck, phat ghost note,
  fall and harmonic

  - Up to six velocity layers and four round robins

  - Release noise samples

  - Four octaves of range starting with a very low a

  - Layering patch for sound design options

  - Unison voices capability

  - Vibrato with humanization

  - Emulated muting

  - Over 2400 samples

  - 1.2 gb

  - Choice of bunny and no-bunny gui skins

  - Requires plogue sforzando version 1.971 or newer
