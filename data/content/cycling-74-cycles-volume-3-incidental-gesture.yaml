details: |-
  In this 4-volume series, sound designer Ron MacLeod expands upon his previous work by producing a continuing series of inspirational sonic collections, utilizing the innovative processing tools from Cycling '74. Each Cycles download has separate 44.1kHz / 48kHz folders. The files are stored in 24-bit FLAC format.

  Incidental Gesture gives you active sonic textures and melodic meanderings that provide movement, emotion and narrative expression to your compositions or media projects. Composed to integrate easily into existing pieces yet intricate enough to stand on their own as incidental beds. These long (30 sec. to 3 minute) files were designed around direct use in digital workstations yet are all seamlessly looped end to end for extended play as well.

  Content categories: Horn Based Gestures, lite to heavily processed acoustic horn gestures, broken out as raw, processed, fx only and individual notes (where appropriate). Melodic Meanderings, melodically based experimental traipsing. Moody Incidentals, a bit more textural, evoking an atmospheric 'vibe.' Narrative Expressions, sonic banter and non-verbal storytelling. Rhythmic Beds, rhythmic yet non-repetitive phrases.

  The file format is designed for maximum convenience: it contains multiple sample rates for quick multiple format support (48kHz and 44.1kHz), uses 24-bit samples to preserve quality and robustness when doing further processing. All samples are end-to-end looped for easy use in sequencers or looping applications such as radiaL, Live, Acid or GarageBand. The spine index uses a coded symbol at the top of the spine: the color suggests the sound file type (ambient, rhythmic, FX, etc.) and the arrow length indicates the average duration of the samples.

  The index is a simple and direct document for fast referencing of vital data relevant to the content of each library, including file length, loop data, BPM and pitch (if applicable), supplied in both PDF and Excel format for easier integration into sound file databases. The files on Cycles releases can be used freely by the purchaser, other than inclusion in other sound libraries, without any additional royalties or usage fees. Because of the nature of some of the longer files, they cannot be used as a stand-alone piece represented as the purchaser's original composition.
