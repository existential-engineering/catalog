details: >-
  Afterglow - west coast electronic loops from modeaudio serves up a tantalising
  cocktail of futuristic r&b soul and laid-back house groove, packing a trunk of
  production tools baked with blasts of white-hot california sunshine, then
  gently cooled to perfection in the rolling pacific breeze.


  This 448mb arsenal of neon-lit sonic delights presents an extensive and varied
  collection of woozy analog texture and rhythmic swagger, expertly crafted to
  bring that chilled west coast flair to your next track.


  At the heart of this euphoric sound collection lies 150 key and tempo-labelled
  music loops, spanning big, bouncy basslines, lazy yet floor-shaking beats,
  smooth keys, sun-kissed synth chords, sizzling lead melodies and punchy
  percussion - all itching to be dropped into your DAW and worked straight into
  your own musical creations.


  Rounding things off are 86 hefty drum samples, including deep drum machine
  kicks, snappy claps, 808 snares, splashy cymbals and plucky percussion, as
  well as 124 MIDI loops that are ready and waiting for you to apply your own
  synths and sounds to.
