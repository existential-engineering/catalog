details: |-
  Brute Force Synthesis

  You can't escape the beautiful terror of The Brut, an Ultra Deep-Sampled (UDS), maniacally gritty, analog synth beast. Designed for musical mayhem, this fiery set is filled with dark, dominant pads, visceral stabs, phat basses, and retro darksynth arps. The Brut will set the perfect mood for cinematic horror, thrashing out some hard and heavy electronicore, and loudly birthing monstrous slasher synths to rattle your teeth. With 82 Parts wreaking havoc across 110 Programs, The Brut provides a hellish buffet of grinding turbo oscillators to bring your audience to their quivering knees. With organic round-robin life in every deep sampled note, you can almost feel the blood coursing through the veins of these uncanny machines. Resistance is futile. Give yourself over to The Brut.
