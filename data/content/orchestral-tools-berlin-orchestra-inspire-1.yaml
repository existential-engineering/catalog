details: |-
  Inspire 1 gives you the opulent sound of a majestic orchestra—a full
  complement of strings, brass, woodwinds, and percussion, plus harp, grand
  piano, and more—in a carefully streamlined package. This collection is
  optimized to provide maximum creative scope with a minimal footprint.

  Derived from the acclaimed berlin series, all instruments were recorded with
  berlin's finest musicians at the teldex scoring stage in berlin. And now,
  inspire 1 runs on sine, so composing is even easier, more flexible, and more
  musical.

  All berlin orchestra inspire instruments are recorded in their natural seating
  positions, with all instruments in perfect equilibrium with one another. This
  is the key to creating a sonic impression in which all the instruments blend
  together naturally.

  Inspire 1 makes no compromises on sound. You get a full range of instruments,
  and they use the same samples as the acclaimed berlin series. The streamlining
  happens in the articulations—inspire 1 opts for simplicity, offering only the
  most commonly used articulations. And instead of multiple mic positions,
  inspire 1 offers just a single perfectly balanced mix.
specs: |-





  - Sine player

  - Kontakt 5.8.1 or higher

  - Free kontakt player compatible

  - 18 gb of samples

  - 7.1 gb sinearc compressed

  - 9.3 gb ncw compressed

  - 24-bit / 48 khz patches

  - Mac os 10.13

  - Intel core i5 or similar

  - 4 gb ram minimum

  - 16+ gb ram recommended

  - Windows 10

  - Strings: whole ensemble, first chairs, high strings 8va, low strings 8va,
  violins I + ii

  - Woodwinds: whole ensemble, flutes + clarinets 8va, bassoons + clarinets 8va,
  solo flute, solo clarinet

  - Brass: whole ensemble, muted whole ensemble, trumpets + horns 8va, trombones
  + tuba 8va, solo horn, solo trumpet

  - Percussion: essential percussion patch, timpani, marimba + xylophone,
  glockenspiel, grand piano, symphonic harp

  - Single instrument purchase available
