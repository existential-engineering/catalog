details: >-
  Doctor doubledrop delivers his first ableton psytrance project. A full length
  als project to study, remix, or extract ideas from, everything made only with
  lennar digital sylenth1 and ableton's native plugins! Study how to build every
  single sound with one of the most popular virtual synth in the online market.


  Kick, cymbals, snare, bass, groove, atmospheres, fxs, leads... All in a
  perfect darkpsy style! The most of the presets comes from "doctor doubledrop
  sylenth1 dark psytrance soundset", some new sounds were included in this
  project like the new solid psytrance bass.. The result of advanced sound
  design technique.


  27 sylenth1 instances were used to make the project, just few sounds were
  rendered to .wav files to save cpu to your pc and to fit better with the mix,
  learn and experiment how to assemble and modulate the sounds to compose a
  unique darkpsy track!


  You will find all the presets for the exported sounds under each one of them
  in the projects (all muted), project is available for image line fl studio and
  steinberg cubase too.. Not just a demo project, but probably the best darkpsy
  sounds available in the market for sylenth1!


  Product includes: 01 ableton file (.als) 02 ableton folders ("ableton project
  info"/"samples"). Download size: zip 56 mb unzip 60.7 mb. All sylenth1 presets
  are 100% royalty-free. Once purchased, you can use these sounds in your own
  commercial music releases with no restrictions.
