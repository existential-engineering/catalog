details: |-
  Timeless. Analog. Drums

  The 808 is the most iconic analog drum machine of all time and perhaps the most influential instrument built in the last 4 decades. We purchased one of the finest original 808s in existence. We Ultra Deep-Sampled the 808 with both master and discrete outputs. The clap sound alone was sampled over 1.000 times to offer you an unparalleled experience. This is not 99% like the real deal. This is the real deal. You can choose it in its natural state or select between 24 different deep-sampled 808 kits, all sampled through a signal chain of some best analog vintage hardware in existence (501 Tape Delay, Meris and Strymon pedals, Analog Heat, Plasma Distortion, Vulture Culture etc). The result is a super realistic iteration of the 808, enhanced in Soundpaint (for example playable multi-octaves of tuned bass drums and modeled effects). But also a variety of kits with hardware saturation, so can find or create the 808 that truly works for you.
