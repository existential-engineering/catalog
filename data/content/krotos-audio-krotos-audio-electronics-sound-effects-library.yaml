details: |-
  Provided by Krotos. Explore this varied library of electronic sounds, sourced from analog synths and digital processes. It is ideal for sound design for sci-fi or electronic music.

  This library was built specifically for use with Reformer and Reformer Pro, plugins that recompose audio into dynamic, responsive, and highly-realistic sound design instantly.

  The libraries are carefully optimised to interact seamlessly with Reformer Pro, and access to all the original files used in the various libraries is included.

  Sound categories included are electric lasers, electric razors, gritty electronics and pulsing electronics, with keywords covering analogue bass, bleeps, buzzes, charge, clicks, countdown, crunch, discharge, distortion, electric razor, electronics, error, hum, interference, noise, pulse, retro, sci-fi and synth.

  The purchase contains two downloads: a zip file with all source sound effect asset files plus a Metadata PDF, and an installer for the integrated Reformer Pro library. iLok is required for the integration installers.
specs: |-
  - 104 sound files
  - 194 MB size
  - 24 bit / 96 kHz high-quality WAV files
  - 100% royalty-free commercial licence
  - Embedded metadata
  - 4 Reformer Pro sound packs
  - iLok required for the integration installers
