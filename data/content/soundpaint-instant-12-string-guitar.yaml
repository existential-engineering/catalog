details: |-
  Instant Inspiration. Instant Playability

  Instant 12-String Guitar Solo is a passionate, deep-sampled, pristine 12-stringed guitar. We recorded the 12-String Guitar in great detail, including hundreds of natural fret and release noises. In addition, we also recorded natural strum samples, so you can play everything in a strummed fashion. The SoundLabs blend the 12 String Guitar with other instruments (ex. Grand Piano, Bazantar, 1676 Harpsichord, and more exotic types of instruments). Instant 12-String Guitar Strummer contains over 6,400 samples spread across 13 different chord types and 13 different rhythm types and allows you to blend any chord and rhythm at any time giving you an infinite amount of options. 12-String Guitar Strummer is also a round-robin based strum library, so even if you trigger the same chord/rhythm multiple times – you will get natural subtle variation.
