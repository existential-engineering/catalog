description: "The man behind some of your favorite records, Dan Korneff, has
  joined forces with STL Tones to create his own personal Producer ToneHub Pack.
  We worked with Korneff at his Long Island studio to create an incredible pack
  filled with all kinds of unique tones. We used Dan’s custom, hand-built analog
  gear in the creation process, which brought a totally new flavor, and spin to
  guitar tones. Korneff’s pack contains 25 Artist Tones from some of his biggest
  record releases, and 51 tones from his collection of amps and cabs, for a
  total of 76 incredible tones."
