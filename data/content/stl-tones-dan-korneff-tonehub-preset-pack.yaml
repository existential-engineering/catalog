details: |-
  Dan Korneff is a producer, mixer and engineer based in Long Island, New York, with a discography spanning some of the biggest names in modern rock. His credits include My Chemical Romance, Paramore, Papa Roach, Breaking Benjamin, Lamb of God, Pierce The Veil, Sleeping With Sirens and Motionless In White's Reincarnate . He is also the developer behind Korneff Audio.

  Recorded at Dan's Long Island studio, this pack is filled with unique tones created using his custom, hand-built analog gear, which brings a totally new flavor and spin to guitar sounds.

  Korneff's pack contains 25 artist tone captures from some of his biggest record releases, and 51 captures from his collection of amps and cabs, for a total of 76 captures.
