details: |-
  DECAP brings his knocking 808 sounds to SubLab.

  If you are a beat-maker, then you are probably already familiar with DECAP. If not, then you have definitely heard his iconic Drums That Knock on songs by JAY-Z, Nicki Minaj, Niall Horan, and many more.

  In his first pack for SubLab, you get over 30 808s and sub-basses that knock straight out the box.

  This pack was created by San Francisco-based producer and sound designer DECAP.

  All of Future Audio Workshop's patch packs are NKS ready for Maschine and Komplete Kontrol. Once your purchase is complete, the pack shows up in your FAW account: download the zip file and follow the instructions on how to import the new sounds into SubLab.
specs: |-
  - Over 30 808s and sub-basses for SubLab
  - Designed by DECAP
  - NKS ready for Native Instruments Maschine and Komplete Kontrol
  - Delivered as a zip download through your FAW account
  - Patches include: No Low, Chest Hair, Cutty, Earth Quake, EatOEat, First 808, Garage 808, Genius, Ravenous
