details: |-
  Bass GuitarMonics is a virtual instrument for the Native Instruments Kontakt
  4.24+ software sampler (full version, not the free Kontakt player).

  Mapped across 3 octaves, this library is a comprehensive collection of
  electric bass guitar harmonics covered by 3 dynamic layers, 5x round robin
  playback, and 3 pickup selections to alter the tone.

  Mono di (direct-input recording, for use with amplifier simulation software /
  hardware) and clean stereo amp versions are included, for maximum flexibility.

  This library includes two sets of samples - "natural" and "pure", which offer
  originally-recorded samples with authentic tone and samples edited for faster
  playing, respectively.
specs: |-
  - Native Instruments Kontakt 4.24+ (full version)
  - 3 octaves mapping
  - 3 dynamic layers
  - 5x round robin playback
  - 3 pickup selections
  - Mono DI recording
  - Stereo amp versions
  - Natural sample set
  - Pure sample set
