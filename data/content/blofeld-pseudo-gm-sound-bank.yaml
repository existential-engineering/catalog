details: |-
  This sound bank is focused on acoustic and electro acoustic multisampled
  instruments for the waldorf blofeld. Its 128 presets follow roughly the MIDI
  GM specifications.

  The pseudo gm sound bank is not a true general MIDI bank, although it can be
  used as one if the blofeld is set in 16 MIDI channel multimode.

  All the presets can be further edited with the synthesizer's editing
  capabilities, which raises the flexibility of the included instruments.

  It has strings with many articulations, acoustic pianos, electric pianos,
  vocal choirs, acoustic basses, electric basses, guitars, saxophones, trumpets,
  clarinets, vibraphones, xylophones, lots of exotic chromatic percussion and
  acoustic and electronic drums.
