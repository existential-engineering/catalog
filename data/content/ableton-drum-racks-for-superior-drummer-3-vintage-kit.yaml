details: >-
  Ableton drum racks for superior drummer 3 vintage kit features separate
  ableton drum racks for all factory presets for the toontrack superior drummer
  3 and vintage kit library supplied with toontrack ezdrummer 2. These racks
  provide out of the box integration workflow between ableton live and toontrack
  superior drummer using the toontrack libraries including a host of features
  ready to use for composition and performance using ableton push or similar
  controllers.


  24 ableton drum racks to instantly load the factory library "mix ready"
  presets with ableton mappings. 12 ableton live templates designed to host the
  multi channel output routing presets with track level audio routing from
  superior drummer 3 into ableton live.


  Colour coded pad design for visual performance and finger drumming. All racks
  use consistent drum rack colouring so you can visually and immediately spot
  your rides from your hi hat articulations. Vast array of instrument
  articulations ready to go in one massive layout using ableton push 64 pad
  layout mode.


  Individually labelled drum rack pads for clear visualisation, post performance
  editing and automation to all drum rack / instrument articulations in ableton.
  Audio routing and mixing capabilities include singleout presets with 12
  ableton drum racks for all vintagekit factory presets single audio output to a
  single ableton track.


  Multiout presets featuring 12 ableton drum racks for all vintage kit presets
  in multiple audio channel output from the plug in to multiple ableton audio
  tracks using the 12 multi output ableton templates also provided designed for
  the kit presets. Track level audio mixing control in ableton.
specs: |-
  - Ableton drum racks
