details: |-
  To celebrate boyss-sound-e-scapes 4th year anniversary we released 4th year free pack which consist of: acid bass loops + bonus.

  278 acid bass loops + bonus loops from the demo (630 mb) 32 acid patterns in flavors: square: dry, saturated, distorted, amped, malfunction saw: dry, distorted

  All loops are in same key and bpm so they can be combined (am/110 bpm) or used as transition over time (from saturated-less distorted to full on distorted etc). Dry versions are good for your own favorite distortion or making filter sweeps pre-distortion.

  All wav loops are in format 24-bit 44,1 khz. MIDI loops for each pattern.

  Available as plain wav loops and also as acidized loops.
