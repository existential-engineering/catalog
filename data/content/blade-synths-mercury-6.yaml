details: |-
  Blade synths is a 50 polysynth collection for cherry audio mercury-6
  synthesizer. Those sounds capture the sonic character of this great synth
  which have been used from some of the greatest musicians over the decades.

  The vintage identity of the presets and the nostalgia they exhale are a great
  fit for early electronic stuff, for retro futuristic cinematic escapes and
  full of memories synthwave retrowave as well as new age productions.

  Presets were designed with mercury-6 1.0.5 (build 87) and run best with this
  or newer edition.
