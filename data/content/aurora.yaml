details: |-
  Aurora is a collection of multisampled sounds integrated in a powerful engine
  for Kontakt 4.2.4 (and above). Aurora features pads, soundscapes, keys and
  rhythmic percussive patches through the use of its powerful arpeggiator.

  Working in conjunction with dream audio tools, fluffyaudio built a custom
  semi-modular engine inside kontakt that allows the user to enable various
  modulation sources on different parameters, to customize every sound as you
  would do in a classical synthesizer, but with sampled sources as waveforms.

  Featuring a powerful interface, aurora has an internal browsing system where
  you can load up to 5 layers of multisampled instruments, organized in several
  categories. The interface is built to present just the relevant info on the
  sound you're working on, to minimize confusion and to get back to music in an
  instant.

  System requirements: pc or mac with 2 gb ram (4 gb recommended), 4.2 gb free
  of hd space, internet connection for downloading the product.
specs: |-
  - Kontakt 4.2.4 (and above) required
  - 150+ multisampled sources
  - Dynamic modulation over different parameters
  - Arpeggiator and polystep sequencer with advanced humanizing features
  - Atmospherizer for creating custom effects and soundscapes
  - Complete chain of editable effects inside the ui
  - 4.34 GB of sampled material (compressed in ncw format)
  - Up to 5 layers of multisampled instruments
  - Internal browsing system
  - Semi-modular engine
  - Pads, soundscapes, keys and rhythmic percussive patches
