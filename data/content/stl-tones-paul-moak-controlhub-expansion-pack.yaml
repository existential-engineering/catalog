description: "This expansion pack by Paul Moak is a master class in using analog
  and modern tools to inspire and stay prolific as a producer, engineer, and
  mixer. Owner of the Smoakstack in Nashville, Tennessee, Paul Moak has held
  nothing back in his pack. Immersed with two large format SSL consoles (SSL
  4056G+, SSL 4040 E), and a seemingly endless amount of hardware compressors
  and EQs, this expansion has everything you need to mix and includes traces of
  the full analog chains Paul turns to when tracking drums, bass, vocals,
  guitars and keys. This expansion pack has a total of 177 presets."
