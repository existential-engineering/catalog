details: |-
  Paul Moak is a five-time Grammy-nominated producer, engineer, mixer and multi-instrumentalist based in Nashville, Tennessee, with credits on more than 500 albums. His work spans Heart and Ann Wilson, Dolly Parton, Gwen Stefani, Blake Shelton, Joy Williams, Mat Kearney, Imelda May, John Paul White of The Civil Wars, Relient K, The Blind Boys of Alabama and House of Heroes, and has featured across hit television including Nashville , One Tree Hill and Pretty Little Liars .

  This expansion pack is a master class in using analog and modern tools to inspire and stay prolific. Recorded at his Berry Hill studio The Smoakstack, home to two large-format SSL consoles (SSL 4056G+, SSL 4040 E) and a seemingly endless collection of hardware compressors and EQs, this pack has everything you need to mix, including traces of the full analog chains Paul turns to when tracking drums, bass, vocals, guitars and keys.

  This expansion pack has a total of 177 captures.
