details: |-
  Autodafe oscar is a recreation of the famous osc (oxford synthesizer company)
  OSCar for Kontakt, based on samples from an actual oscar. The original oscar
  comes from Autodafe's collection of analogue synths.

  35 soundsets have been sampled from the original presets in the oscar memory.
  There are 91 total patches in the kontakt instrument.

  The aim is not to 100% replicate the oscar but to capture its sounds, its
  controls and its characteristics adding unique features that are only possible
  in the digital world.

  Autodafe oscar features an arpeggiator, which was on the original oscar (and
  it had the option to create sequences and load/write them). Autodafe oscar
  also features a chord mode, glide, mono mode and unison section.

  The original oscar had the option to play "duo" (duophonic) and had glide
  controls, with different types and times.
specs: |-
  - Kontakt 5.6 (full version required)
  - 91 total patches
  - 35 soundsets
  - Arpeggiator
  - Chord mode
  - Glide
  - Mono mode
  - Unison section
  - Sequence creation and load/write capability
  - Duophonic (duo) mode
  - Multiple glide types and times
