details: |-
  Badass is a free sample based Kontakt instrument produced by DCSI. Wrapped in
  a 30 MB instrument size it's a sampled and edited old school bass synth,
  spread across 3 octaves, coming with some optional gritty flavour added by
  using the modwheel of your controller, plus a delay effect and several play
  modes.

  Badass plays at its best with the mono/unisono settings on, available on the
  gui.

  A PDF manual with more details and license agreement is included in the
  download.

  This dcsi kontakt instrument was built with the kontakt 5.3 version.
specs: |-
  - Sample-based Kontakt instrument
  - 30 MB instrument size
  - 3 octaves
  - Modwheel control for gritty flavour
  - Delay effect
  - Multiple play modes
  - Mono/unisono settings
  - Kontakt 5.3 compatible
