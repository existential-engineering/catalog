details: |-
  Drumshotz Tue Madsen is a one-shot drum sample library curated by professional mixer and producer Tue Madsen. Tue is widely regarded in the metal and rock production world, having engineered and mixed records for some of the genre's most influential acts.

  The pack contains 60 total samples spanning kicks, snares, and toms — all recorded and processed to be mix-ready out of the box. Each sample reflects Tue's signature approach: heavy-hitting transients, controlled dynamics, and tonal clarity that cuts through dense mixes.

  Breaking down the contents: 17 kick drum samples, 25 snare drum samples, and 18 tom samples. Every file is delivered in 44.1 kHz, 24-bit WAV format, ensuring the highest audio fidelity and compatibility across all major DAWs and drum-triggering software.

  The samples are designed to work as drop-in replacements or blend layers, making them equally useful for triggering within a drum replacement workflow or as foundational sounds in programmed productions.

  Purchase includes an instant digital download, a perpetual license, free lifetime updates, and unlimited customer support from DrumForge.
