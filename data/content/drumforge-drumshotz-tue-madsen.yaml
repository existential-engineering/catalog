description: A 60-sample one-shot drum collection from producer and mixer Tue Madsen, covering 17 kicks, 25 snares, and 18 toms in 44.1 kHz 24-bit WAV format.
details: |-
  Producer and mixer Tue Madsen assembled this collection of mix-ready one-shot drum samples to add power and punch to a song. It puts the drum sounds from his work with artists such as Meshuggah, Babymetal, August Burns Red, and The Haunted directly into a production.

  Drumshotz is a series of drum samples sourced from professional mixers, meant to enhance, blend, or replace drum sounds in a mix. One-shot samples supply the punch and consistency needed to cut through, which is how a mixer achieves a signature drum sound regardless of the quality of the source recording.

  The samples can be mixed and matched with existing sample libraries or raw drum recordings, and work with a triggering program or in any DAW.
specs: |-
  - 60 samples total in 44.1 kHz, 24-bit WAV format
  - For use with any triggering program or DAW
  - 17 kick drum samples
  - 25 snare drum samples
  - 18 tom samples
