details: >-
  Inspired by legendary synths, we've recreated the most typical and authentic
  analog sounds from moog, oberheim, roland, prophet, yamaha and others.


  135 presets + 43 bonus presets from the analogue legends expansions. A total
  of 178 presets unique analog sounds. Pure emulated va, no sampling, except the
  drums.


  Old retro sounds, luscious pads, power leads, detuning strings, deep funky
  basses on avenger. Perfect for pop, rock, synthwave.


  And the best of all, on top of that it comes with the retro skin retrovenger.
  Now available for vps avenger.
