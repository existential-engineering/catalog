details: |-
  1 Instrument made by 100 Sound Designers

  Free Angels is a new-generation work of art, created partially by over 100 sound designers from our talented community, and partially in-house. A white, soft, and heavenly body. Experimental and experiential. Free Angels contains over 1500 heavenly sounds consisting of angelic ambiences, celestial risers, a large set of ethereal plucked instruments, fluffy creatures, heavenly hits, seraphic voices, and a range of soft and saintly percussion. It is not designed for the stringent and analytical composer, but rather for someone who wants to explore the unknown and let themselves be inspired by heavenly sounds. Free Angels is not a conventional sample library. It is a little piece of art software – liberated from normal and orthodox conventions of how things should be. It is beautiful, wild and free.
