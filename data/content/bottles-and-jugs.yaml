details: |-
  Bottles and Jugs is the latest offering in the zapzorn element solo sample
  library. It is part of the kitchen suite that takes solo to a whole new level.
  Now solo comes with 2 menus, with 24 all-new multi-velocity sounds, 30 super
  usable patches, and 10 multis.

  Bottles and jugs is made up of plastic jugs, metal canteens, glass jars, wine
  bottles and so many more sampled sounds.

  Each menu comes with 12 MIDI key selectable groups that you can adjust the
  adsr, hp and lp filters and add convolution reverb, chorus, flanger, phaser,
  and delay.

  Sampled at 96k/24-bit, these cinematic samples are very useful single play
  sounds.

  These have twice the core sounds and 40 times the patches as the original solo
  library.
specs: |-
  - 24 multi-velocity sounds in 2 menus
  - 30 instantly usable patches
  - 10 multis
  - 251 multi-velocity samples
  - 20 objects sampled
  - Chorus
  - Flanger
  - Phaser
  - Delay
  - Convolution reverb
  - ADSR
  - HP and LP filters
  - 12 MIDI key selectable groups
  - 96k/24-bit sampling
  - Kontakt 4.2.4 or later required
