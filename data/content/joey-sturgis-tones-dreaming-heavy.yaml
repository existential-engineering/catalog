details: |-
  Dreaming Heavy is a 10 Cymbal Package, multi-sampled and provided in various formats.

  Each cymbal is recorded with articulations and performed velocity, and the set is delivered as Kontakt instruments, as a Kontakt multi holding the entire cymbal set in one instrument, and as a WAV file for each sample. A Cubase drum map is included for use with the Kontakt multi.

  A Silence articulation fades out any cymbals that were ringing, which is useful for fast breaks when bells or splashes are hit just before a cymbal choke.

  Recorded at 44.1 kHz 24 bit, pre-panned from the drummer's perspective and pre-mixed and ready for production by Joey Sturgis.
