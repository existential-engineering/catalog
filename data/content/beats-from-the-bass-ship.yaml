details: |-
  Beats from the Bass Ship is a preset pack of 128 sounds for the xfer Serum
  synthesizer. There are also 100 drum one shot samples included to compliment
  the synth presets.

  The sounds are geared towards trap, dubstep, glitch hop, and other bass heavy
  genres of music.

  This pack contains: 100 modern drum hits including kicks, snares, claps,
  percussion, hi hats. 128 serum presets: 56 bass presets, 27 sound fx presets,
  10 pluck presets, 9 lead presets, 7 arp presets, 5 drum presets, 5 pad
  presets, 5 made for chords presets, 2 drone presets, 2 rhythm presets.

  All samples in this pack are royalty free.

  Produced by ahee.
