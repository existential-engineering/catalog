description: Get the crowd moving like there is no tomorrow with 'Naughty Dancefloor' by Basement Freaks. A mix of all the best spicy rhythms and intoxicating instruments from Reggaeton, Dancehall, and Tropical Pop.
details: |-
  Naughty Dancefloor by Basement Freaks is a mix of spicy rhythms and instruments drawn from Reggaeton, Dancehall and Tropical Pop, aimed at Latin-inspired downtempo production.

  The pack covers the essential instruments for groovy, playful Latin lounge beats or wild and passionate Tropical Pop, including cabasas, cowbells, Cumbia style metal guiros, resonating plastic blocks, shakers, rototoms and wooden tambourines.

  Alongside the percussion it carries specially designed drums, SFX and melodic music loops.

  Every file is labelled with key and tempo, with tempos ranging from 82 to 104 BPM.
