details: |-
  This is an assortment of short simple 8-Bit Blips, blops, beeps and zaps. The
  high frequency 8-bit sounds in this pack can pierce through the mix, useful
  for short grabs of attention as well as for interface sounds.

  The samples are separated into six sound categories: arpeggiated (short fast
  arpeggio sounds with key labeled), zaps (quick laser-type frequency sweeps),
  beeps (digital interface type sounds), blips up (blips that go upward in
  pitch), blips down (blips that go downward in pitch), and blips misc (various
  unique blips and blops).

  This pack contains: 100 8-bit blip samples (arpeggiated, zaps, beeps, blips
  up, blips down & blips misc). 1 sfx patch for native instruments kontakt,
  ableton live, maschine, logic pro exs24/sampler, fl studio, mpc expansion
  pack, and tal-sampler. 24-bit, 44.1 khz wav files.

  8-bit blips is part of the 8-bit sound effects bundle.
specs: |-
  - 8-bit sound effects
  - 100 8-bit blip samples
  - 24-bit, 44.1 kHz wav files
  - Native Instruments Kontakt compatible
  - Ableton live compatible
  - Maschine compatible
  - Logic Pro exs24/sampler compatible
  - Fl studio compatible
  - Mpc expansion pack compatible
  - Tal-sampler compatible
  - Six sound categories
