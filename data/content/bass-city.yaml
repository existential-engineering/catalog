description: Bass City is a free collection of synthesized bass samples created
  by chad beckwith from patcharena and tomislav zlatic from 99Sounds.
details: |-
  The library features a set of 26 classic analog and fm bass patches which have
  been multi-sampled from three different hardware synthesizers (korg ex-800,
  korg poly-800, yamaha tx81z).

  The library contains 399 individual 24-bit wav samples which form 26
  multi-sampled patches in total, covering a wide range of classic analogue and
  fm electronic bass sounds.
specs: |-
  - 399 individual 24-bit wav samples
  - 26 multi-sampled patches
  - 44.1 kHz stereo
  - Kontakt 5 support
  - Sfz format support
  - 581 MB size on disk
  - 336 MB download size (rar archive)
