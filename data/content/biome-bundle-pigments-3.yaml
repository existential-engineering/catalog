details: |-
  Biome bundle for arturia pigments 3 contains 820 presets of soundbanks tundra,
  steppe, savanna, mediterranean, arctic, mountains, ocean, tropical, grasslands
  and desert. It is a collection of patches for cinematic underscore, edm,
  electronic music, game audio, rock and metal, new age and experimental music
  producers.

  Tundra is a 100 presets soundbank for pigments 3. It contains basses, pads,
  leads, keys and synths with a cold atmosphere from the depths of tundras. Many
  experimental sounds here like most of our soundbanks that are fitting for many
  genres from electronic and cinematic to rock and experimental. Many modulation
  options are included to add new dimensions for a richer sound.

  Ocean continues the biome series for pigments. The 7th soundbank for this
  series is containing 80 new presets pads, synths, keys leads and basses
  including. Most of them were designed with the powerful wavetable engine of
  arturia pigments sometimes using only one engine sometimes stacked both
  engines with some fine-tuning difference to result to a fuller and more
  dimensional sound.

  Grasslands for pigments 3 is an 80 patches library part of biome series.
  Mainly it contains modern plucky keys for electronic music productions and
  there is a part of 13 presets under the name harmonic valley that were
  designed with the powerful harmonic engine of pigments. The sounds and
  especially the plucks rely a lot on the effect chain using very often some
  predelay on the reverb and also the infamous multiband compressor to give a
  modern touch.

  Desert for pigments 3 is the 10th and last pack of our biome series for this
  incredible synth by arturia. It contains 80 atmospheric sounds including 70
  evolving synths and pads as well as 10 experimental percussions. It is a very
  emotional soundbank that could be divided in 4 categories.
specs: |-
  - 820 presets total
  - 10 soundbanks
  - Wavetable engine
  - Harmonic engine
  - Modulation options
  - Mw (mod wheel) assignments
  - At (aftertouch) assignments
  - 4 macros assignments
  - Effect chain with reverb and multiband compressor
  - Presets for arturia pigments 3
