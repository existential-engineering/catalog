details: |-
  Analog Arp Loops is a royalty-free mini pack presenting 50 gorgeously analog synth riffs, with each loop celebrating the arpeggio as one of the most fundamental building blocks of music.

  The pack features crashing synthwave bass arps with snarling sawtooth ferocity, glimmering delay-drenched melodic patterns dripping in dreamy detuned nostalgia, powerful percussive arps, and sizzling sfx sequences, offering an arpeggiated sequence of notes that dance around a specific melodic scale.

  Each pattern was performed and recorded in real-time using a polyphonic analog synthesizer, with scope to ride filter cutoffs and tweak envelopes as the synth notes climbed and tumbled on top of each other.

  The entire pack encompasses tempos of 100, 120 and 130 bpm, giving flexibility to work these loops into techno, pop, ambient and other genres.

  The selection positively oozes with classic hardware synth character, texture and authority, offering a surprisingly diverse collection of arpeggiated sonic gems.
