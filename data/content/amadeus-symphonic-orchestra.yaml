details: |-
  Covering all the essentials of the orchestra, Amadeus Symphonic Orchestra
  sample library includes strings, brass, woodwinds, percussion, keyboards,
  guitars and more.

  Everything you need for creating quick sketches, orchestra, film, and game
  scores, is at your finger tips.

  The library has carefully been engineered to load fast and provide authentic
  sounding instruments, allowing you to create incredible realistic scores.

  Clean, powerful, easy to use interface. Impressive, robust features.
  Phenomenal sounds.

  Amadeus symphonic orchestra by sonic scores music software is a virtual
  instrument audio plugin and a software application and soundware (samples or
  presets that load into other products) for macos and windows. It includes, and
  is therefore "powered by", kontakt player, which functions as an audio units
  plugin, a VST 3 plugin, an AAX plugin and a standalone application.
