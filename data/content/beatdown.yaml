id: ZjS5oZnsgQNnFgP2QVNjr
name: Beatdown
manufacturer: sonic-faction
primaryCategory: drum-machine
categories:
  - preset-pack
description: "Beatdown: next level beats. Elevate your beats to new heights with
  this extraordinary drum machine."
details: |-
  Beatdown comes loaded with 40+ kits that are selectable on the fly. Mix and
  match individual drum sounds or jump into global takeover mode for world
  domination.

  Manipulate your beats with microscopic precision. Loop individual sounds or
  the entire kit for insane sound design possibilities. Instantly turn any drum
  beat into a robotic meltdown.

  Beatdown is designed with intuitive controls that make writing unique beats
  effortless. Modulate any parameter with lfos or crank up the glitches with
  built-in beat buffers.

  Beatdown includes a free max for live drum step sequencer for push, apc40 and
  launchpad. Use drum sequencer and for hands-on control of your sound.

  Beatdown is included as part of the archetype ableton bundle.
specs: |-
  - 40+ drum kits
  - Selectable kits on the fly
  - Global takeover mode
  - LFO modulation
  - Beat buffers
  - Max for live drum step sequencer
  - Push compatibility
  - Apc40 compatibility
  - Launchpad compatibility
  - Loop individual sounds
  - Loop entire kit
  - Intuitive controls
prices:
  - amount: 7.5
    currency: USD
compatibleWith:
  - ableton-live
