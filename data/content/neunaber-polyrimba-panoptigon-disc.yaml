description: A Panoptigon disc based on the classic DX7 Marimba preset arranged
  in a 5-against-3 polyrhythm, creating shifting syncopated rhythmic patterns.
details: |-
  POLYRIMBA is based on the 5-against-3 polyrhythm. The basic sound is the classic DX7 Marimba preset. Individual notes are steady pulses with accents in counts of 5 or 3. Holding down chords creates an ever-shifting series of syncopated rhythmic patterns. If you count these in 4/4, you'll perceive longer rhythmic cycles that won't repeat for 15 bars. Adding delay will create even more complex patterns. Also, try it with the Panoptigon's hall reverb turned up, and the main volume knob turned all the way down, to get an interesting ambient pad sound. POLYRIMBA can only be played on Panoptigon, and is not compatible with Optigan or Orchestron. Conceived, arranged, and mastered by Pea Hicks
  Disc design and mastering by Robert Becker
  Jacket label art direction and layout by Michael Buchmiller

  Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility
