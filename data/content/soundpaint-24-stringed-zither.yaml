details: |-
  24 Strings of Versatility. The 24-Stringed Zither is a one-of-a-kind, expressive, custom instrument, designed, built and deep-sampled by Nicolas Bras in his instrument workshop in Paris, France. The 24-String Zither was made from a carefully crafted wooden box with a uniquely sized resonance chamber. The strings used were hand-selected high-end steel Guitar strings, which offered a warmer sound and better bass notes compared to traditional, thinner-sounding Zithers. Nicolas Bras deep-sampled four different playing styles: Open Strings, Muted Strings, Harmonics, and Tremolo. The 24-String Zither sounds, feels and plays like a large upright steel guitar - if such a thing existed. The original 24-Stringed Zither is diatonic, but the Soundpaint engine offers you full chromatic instrument that spans the entire range of your keyboard. Play it like a bass. Play it as a harpsichord. Play it as a new virtuoso solo instrument nobody has ever heard before. And Play it in Soundpaint with 127 fluid dynamics.
