details: |-
  The "Ancient Madame" is a hurdy gurdy library for Kontakt 5. The hurdy gurdy
  is an instrument that is older than thousand years. With its absolutely unique
  sound it is well known as a medieval instrument that is still often being
  played on medieval events.

  Taleweaver orchestra took it upon himself to capture the smoky voice of this
  wonderful french lady and make it ready for your own musical creations.

  The library includes high quality recordings in 48 khz / 24-bit wave format
  arranged in three and a half octaves. The first octave contains the drone
  sounds and the others the lead voices.

  You can choose between several high and low g or d drones or even use them
  both at the same time. It is possible to set the volume of the drones in
  separation to the lead voice. You can also adjust the volume of the key
  sounds.

  Every lead tone consists of three round robins. The rar package requires about
  270 mb of disk space. (requires kontakt 5.2.1.6382 or higher)
specs: |-
  - Hurdy gurdy library for Kontakt 5
  - 48 kHz / 24-bit wave format
  - Three and a half octaves
  - Drone sounds in first octave
  - Lead voices in remaining octaves
  - High and low g or d drones
  - Adjustable drone volume
  - Adjustable key sounds volume
  - Three round robins per lead tone
  - 270 MB disk space requirement
  - Requires Kontakt 5.2.1.6382 or higher
