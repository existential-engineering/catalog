details: |-
  Bluegrass Banjo is a sample library featuring a 5 string banjo which has the
  classic warm tone associated with pre-war banjos as well as an instrument with
  plenty of punch to cut through a mix. Don't be fooled by the word "bluegrass"
  in the library title, you will find it to be quite flexible across many
  different musical genres.

  The new v3 samples include 4 new pluck positions along the string length of
  the banjo as well as scruggs-keith d-tuner mechanism samples.

  Each string was sampled chromatically up to the 17th fret. The first string
  was sampled beyond the 17th fret. All the strings are sampled on 5 different
  pluck positions of the banjo.

  The pluck positions can either be selected via key switches or via a very
  advanced pluck position velocity selection system. You can freely adjust at
  what velocity level the different positions will be selected and make any kind
  of position combinations. All the settings can be saved as presets.

  Various articulations: hammer-on and pull-off, half step and whole step slide,
  harmonic and scruggs d-tuner bends. All with 2 x independent round-robin per
  key.
specs: |-
  - 5 string banjo
  - Up to 5 x independent round-robins per key
  - Chromatic sampling up to 17th fret
  - 5 different pluck positions
  - Key switch selection
  - Pluck position velocity selection system
  - 379 MIDI files
  - Banjo resonance via impulse response
  - Hammer-on and pull-off articulations
  - Half step and whole step slide articulations
  - Harmonic articulations
  - Scruggs d-tuner bends
  - 2 x independent round-robin per articulation
  - Scripted pitch bend and vibrato control
  - Ksp scripted fretting position control
  - Auto fret selection feature
  - Key switch page with custom assignment
  - 8 different effects with preset menus
  - Ni Kontakt version 4.2.4 or higher required
  - Full version of Kontakt required (not Kontakt player)
  - Tested for compatibility in Kontakt 5
  - 3.15 GB uncompressed size
  - 1.52 GB Kontakt compressed (.ncw) format
