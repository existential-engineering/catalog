description: Krotos used years of sound design research and expertise to craft a library that is the future sound of cinematic whooshes and transitions.
details: |-
  Krotos took its years of sound design research and expertise and used it to deliver a library that is the future sound of whoosh and transition SFX. The library has a clean, contemporary style heard in trailer sound effects, video game assets and films.

  These assets have remarkable clarity with a refined, clean and punchy sound, giving a selection of sounds that is powerful out-of-the-box yet flexible enough to process and re-shape in your own style.

  The library features over 300 sound effect assets recorded at 192 kHz, plus 50 ready-to-go presets for Weaponiser across four categories: Risers, Swishes, Whooshes and Transitions. It delivers exciting, rich build-ups to build anticipation and tension, swishes for melee and projectile weapons, punches, bullet flybys, doppler sounds and wide stereo sweeps, eerie, metallic, tonal and atonal transitions of different lengths, and whooshes covering everything from character or vehicle movements through to scene transitions.

  The purchase contains two downloads: a zip file with all source sound effect asset files plus a Metadata PDF, and an installer for the integrated Weaponiser library including assets and presets. iLok is required for the integration installers.
