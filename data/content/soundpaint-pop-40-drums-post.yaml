details: |-
  Genre-Defying Grooves

  Revamp your rhythm and rise above the noise with Pop 40 Drums: Post. Not quite hip hop, not quite pop... It's got rhythm and it's got blues, but it's not quite R&B… With 5 Production ready drum kits, Post delivers an eclectic style, perfect for those whose style doesn't fit neatly into a single genre. Ready to break away from generic, pre-made loops? Look no further than Pop 40's "post apoca-loop" beats. Let your instincts take charge and create the perfect rhythm and flow. We also keep the mapping simple and symmetrical across all Soundpaint drum kits, so it's easy to mix, match, and morph drums to your heart's content. Each program has an pre-programed ARP pattern - a great way to get the ball rolling. Customize the arp, play on top of it, or turn it off and get into all the details; there's no wrong way to get grooving! It's easy, flexible and fun to play, so you can get start jamming right away!
