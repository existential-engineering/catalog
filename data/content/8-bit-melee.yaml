details: |-
  Fight up close and personal with this collection of 8-Bit Melee samples. This
  sample pack has 8-bit weapon sound effects such as swishing swords, stabbing
  daggers, swinging axes, clobbering clubs and cracking whips.

  The 8-bit sounds are separated into seven sound categories: swords (swings,
  swishes, thrusts and stab sounds), blunt heavy (large clubs and hammers, big
  low hits), blunt light (bats, batons and maces, direct whack sounds), daggers
  & knives (quick and high sounding, fast swings and in-and-out stabs), axes
  (slower longer hits that come down harder), whips (two-part sounds with a
  short pull back and a longer extended ending), and melee misc (various other
  close combat weapon hits).

  This pack contains: 110 8-bit melee samples (swords, blunt heavy, blunt light,
  daggers & knives, axes, whips & melee misc). 1 sfx patch for native
  instruments kontakt, ableton live, maschine, logic pro exs24/sampler, fl
  studio, mpc expansion pack, and tal-sampler. 24-bit, 44.1 khz wav files.
specs: |-
  - 8-bit weapon sound effects
  - 110 8-Bit Melee samples
  - 24-bit, 44.1 kHz wav files
  - Sfx patch for Native Instruments Kontakt
