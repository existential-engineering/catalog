details: >-
  Ambient guitar clouds is a sample/loop pack that consists of recordings of
  live guitar looper sessions. The pack explores the technique of asynchronous
  looping, which is layering tape loops of differing lengths, no bpm, and all
  non-synchronous loops. With that technique, it creates an ever-evolving
  soundscape.


  Content includes 9 kits (with varying amounts of main loops plus bonus loops
  in each) for a total of 146 key-labeled wav loops in 24-bit 44.1 khz - 1,86 gb
  unzipped. Loops durations are long, total 2h 06 min 12 sec. Each kit
  represents a single looper session and inside each is a bonus folder, those
  are loops created afterward with heavy processing of original recordings.


  38 presets for robotic bean portatron as multi-instances async. Looping and 6
  as regular single instance presets - 627 mb unzipped. Requires robotic bean
  portatron v1.2


  A user isn't tied to use all loops/presets from the same folder, loops in the
  same key can be combined from any other folder. All wav files can be also
  loaded in any sampler that accepts standard wav files or can be used as plain
  loops in its entirety or parts of it.


  Released to celebrate boyss-sound-e-scapes' 8th anniversary as the 8th year
  free pack. The product is free - use the code: 8th-year at checkout for a free
  download.
specs: |-
  - 24-bit 44.1 khz wav loops
  - 9 kits with 146 key-labeled loops
  - Asynchronous looping technique
  - Non-synchronous loops
  - No bpm
  - Robotic bean portatron v1.2 compatible
  - 38 presets for robotic bean portatron multi-instances
  - 6 single instance presets
  - Standard wav file format
