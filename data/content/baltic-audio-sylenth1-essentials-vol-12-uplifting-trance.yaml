details: |-
  'Sylenth1 Essentials Vol 12 - Uplifting Trance' is a preset pack for LennarDigital Sylenth1, designed for modern Uplifting Trance, melodic Trance, Progressive Trance, EDM and festival-style dance music.

  The pack includes 64 royalty-free Sylenth1 presets and 48 MIDI files taken from the demo, covering ready-to-use leads, basses, plucks, bass sequences, pads, arpeggios, synths and FX for emotional breakdowns, driving drops, melodic hooks and energetic Trance productions.

  Requirements: LennarDigital Sylenth1 v3.06 or higher is required.

  Please note: drums and some FX used in the demo are not included.
specs: |-
  - 64 Presets for Sylenth1
  - 16 Leads (Presets)
  - 12 Basses (Presets)
  - 10 Plucks (Presets)
  - 8 Bass Sequences (Presets)
  - 6 Pads (Presets)
  - 5 Arpeggios (Presets)
  - 5 Synths (Presets)
  - 2 FX (Presets)
  - 48 MIDI files
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
  - Requires LennarDigital Sylenth1 v3.06 or higher
