details: |-
  Ultra. Deep. 909

  We Ultra-Deep Sampled from the legendary 909 drum machine, captuing every nuance from this fabled instrument - but with our own modern hybrid cinematic twist. This extensive collection of recordings was treated through hand-picked analog preamps, compressors and effects to create signature drum sounds for the future. From warm and fuzzy to hard and punchy, from clean to dirty, from ordinary to experimental, Orange 909 has got you covered for any sonic situation or emotion. Over the years, the 909's iconic sounds have become a staple of electronic music and a must-have for dance music producers around the world. After gaining popularity on the 2nd-hand market through the 80s Chicago House music scene, this instrument's place in music history was rightfully solidified. Truly a groundbreaking machine, the 909 combined analog synthesis with digital samples and was among the first to utilize MIDI. Even the groove of the 909 is amazing, with a feel all its own. Let the Orange 909 UDS bring this beautiful instrument to life in your music.
