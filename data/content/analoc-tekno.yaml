details: |-
  A full featured analog rytm dub techno / ambient house production pack with 16
  ready made kits each with their own flavour and style, laid out in a logically
  musical fashion, making use where possible of existing naming schemes for easy
  use in your live and studio environment.

  16 patterns, laid out in sequence across the 16 trigger buttons, each attached
  to their associated kits for instant song starter ideas or to build full
  tracks out of in their entirety.

  116 sounds created from a mix of pure rytm synthesis as well as a blend of
  synthesis and samples curated and recorded from our own analog studio and
  centred around the dub techno flavour. Dubby chords, deep tom style basses,
  rounded kicks and sublimely suitable percussions sit amongst the genre
  defining snare, clap and hat sounds.

  Each kit comes complete with ready made macros and assigned quickperf for on
  the fly sound alteration and quick sparks of original ideas, creative
  inspiration or just easy variations to use within a live environment.

  Whether you're looking to build your next techno / ambient house live set or
  expanding upon your current studio productions this analog rytm sound pack
  delivers the right blend of sounds and production ready material and is ready
  to use right out of the box.
specs: |-
