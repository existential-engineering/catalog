details: |-
  After receiving countless requests, Future Audio Workshop made the ultimate pack of drill subs and 808s for SubLab XL.

  This is the company's first drill pack. It was built as a one-stop shop for layered-up, distorted, ready to glide, punchy drill subs, each with its own distinct flavor.

  You get 13 dialed-in subs that are track ready and infinitely tweakable, made for drill and drill-infused tracks.

  This pack was created by Future Audio Workshop's in-house sound designers.

  Once your purchase is complete, the pack shows up in your FAW account: download the zip file and follow the instructions on how to import the new sounds into SubLab XL.
specs: |-
  - 13 drill subs and 808s for SubLab XL
  - Created by Future Audio Workshop's in-house sound designers
  - Delivered as a zip download through your FAW account
  - Patches: Brooklyn Smoke, Caustic, Crushin Dior, Cut Right Thru, Jungle Drill, LNDN, Makita Drill, Millwahkee, No Glide Notes, Sawn Off Drill, Sub Drill, Sulfuric, Wub Wow
