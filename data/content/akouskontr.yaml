details: |-
  The akouskontr is german 4/4 four strings upright bass recorded from both the pickup and with a pair of electrostatic microphones.

  On the top of the interface, you can control the behavior of the instrument: legato mode allows you to choose whether playing a legato will trigger hammer ons, slides, sustains, or simply have no effect. The legato distance will define the maximum interval in which the legato will apply. The sensitivity will set the minimum volume for velocity 1 and give you access to all the dynamics that you want. The release volume controls the sound produced when you release a string if a note was going on.

  Akouskontr was recorded both from the microphone and using the pickup and you can change the volume of each one from the interface.

  Akouskontr comes with its own sample player, the uvi workstation 3 (requires v3.0.0 or later). It works on mac (10.9 or later) and pc (windows 8 or later), in standalone or as a plugin (VST / vst3 / AU / AAX) and in 64-bits only.

  Technical specifications include 779mb uncompressed, 325mb compressed in lossless flac format, around 1710 samples, two microphone positions (microphones + pickup), 5 velocity layers for the sustain and two different takes for each note (2 round robins), about 13 velocities for the release, hammer on samples, advanced vibrato effect controlled via modulation wheel, slides effects, harmonics, ghost notes, string hits samples, percussion samples (hits with the hand on different parts of the bass), and advanced uvi scripting giving access to a simple yet powerful interface and advanced features.
