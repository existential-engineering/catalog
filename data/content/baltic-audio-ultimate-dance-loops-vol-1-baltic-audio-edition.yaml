details: |-
  'Ultimate Dance Loops Vol 1 (baltic audio Edition)' by CESA SAMPLES is a royalty-free Sylenth1 preset pack designed for classic Hands Up, Dance, Hard Dance, 2000s EDM and Eurodance-inspired productions.

  This baltic audio Edition includes 48 presets for LennarDigital Sylenth1, capturing the energetic sound of classic Hands Up and Dance music. You get ready-to-use leads, basses, plucks, chords, arpeggios, pads and synth sounds for building uplifting melodies, hands-up hooks, driving basslines and nostalgic club arrangements.

  This edition does not contain any samples or MIDI files.

  Requirements:
  LennarDigital Sylenth1 v3.06 or higher is required.

  Please note:
  This baltic audio Edition contains Sylenth1 presets only. It does not include samples or MIDI files. Drums, various melodic samples and some FX used in the demo are not included.
specs: |-
  - 48 Sylenth1 Presets
  - 2 Arpeggios (Presets)
  - 6 Basses (Presets)
  - 2 Chords (Presets)
  - 29 Leads (Presets)
  - 1 Pad (Presets)
  - 5 Plucks (Presets)
  - 3 Synths (Presets)
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
