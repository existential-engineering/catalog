details: |-
  Soundiron ambius 2 systematic is a flexible and adaptive sample-based atmospheric synth based entirely on acoustic instrument source recordings. This collection is designed to allow users to freely layer, blend and reshape multiple layers of sound. It includes a large mix of percussive, tonal and textural elements programmed into dynamic evolving Kontakt instruments.

  It features a custom gui that combines performance and tone shaping controls with a proprietary step sequencing engine that allows users to create tempo-based filter and automation grooves and complex lfo shapes up to 32 steps in length, with host-synching and adjustable step beat/bar length control.

  The foundation of ambius 2 is the instrument designer system, which allows users to combine a different tuned percussive attack samples with a selection of different sustaining pads and leads. Each layer is equipped with independent core parameter controls. The master layer builder presets are powered by 6 independent sonic layers, each with independent dynamic, envelope, tuning and shaping controls.

  Each instrument is driven by a scalable 32-step-sequencing rhythm-based dual-lfo system with selectable filter modes and the ability to lock any parameter's automation to host tempo and rhythm. Most presets also include global effects and features like custom convolution loading, the uberpeggiator arpeggiation builder, polyphonic legato and full eq controls.

  Ambius 2 is specifically designed for users who are looking for an organic atmospheric synth that can be customized and tweaked without being overly complex or difficult to work with. It can morph between tight, tuned percussive and smooth, dreamy pads, with textures and styles ranging from fat lo-fi leads to crisp, complex hi-fi soundscapes.
