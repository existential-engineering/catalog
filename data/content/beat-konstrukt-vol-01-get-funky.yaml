description: Beat konstrukt is an idea pack containing audio and MIDI files for
  the music production with your DAW (win, mac) or studio app on the ipad.
details: |-
  The content stands for musical inspiration and can be creatively used as a
  production tool. The most important audio loops are also available as MIDI
  files. So you can select the MIDI version and transpose and modify the notes
  in the piano roll easily.

  Beat konstrukt volume 01 "get funky" is a mix of 15 various groovy styles from
  hip hop over electro to dance music. You get a drum beat, bass, keys and
  synths and further tracks with the length of 1, 2 or 4 bars.

  A main element of each loop kit is called "layer". This audio file works like
  a big rhythmic bedding for the mix. Grab one of the variations and add your
  kick, bass and other rhythm parts - build your own track in only a few
  minutes.
specs: |-
  - Audio and MIDI files
  - DAW compatible (win, mac)
  - Ipad studio app compatible
  - 15 loop kits (80-140 bpm)
  - 249 MB audio
  - 15 preview tracks (mp3)
  - 148 wav files (24-bit)
  - 75 MIDI files (smf)
  - 1, 2, or 4 bar track lengths
  - MIDI transposition and modification
  - Piano roll editing
