details: >-
  Analogue explorations is a collection of 64 carefully programmed analogue type
  sounds created for applied acoustics systems "ultra analog va-2" synth.


  The soundset is not aimed at any particular style or genre, but provides a
  sound-palette easily adapted in any type of electronic music - spanning the
  spectre from deep dub-techno, d'n'b, idm, chip to funky house.


  This pack contains a broad variety of analogue type sounds programmed with
  small amounts of drift and plenty of analog grit - of which this synth has
  plenty.


  You'll find basses ranging from funky synth basses to bombastic sub-basses -
  and pads ranging from soft baby tissue to sweeping textured wonders. There's
  also a range of lead-synths well suited for the odd melody-line or a full
  solo-riff.


  The true bonus in this soundset is the percussive sounds and the instant
  atmosphere creating sound effects, which in some cases can make up the basis
  of an entire dub techno track.
