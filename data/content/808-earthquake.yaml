details: >-
  808 earthquake from big fish audio brings you 50 various styles of 808 loops,
  all made with the modern producer in mind. 808 earthquake is made in the
  styles of murda beatz, zaytovan, araab muzik and many more of your present-day
  trap producers.


  This library will soon become your go-to 808 construction kit with quick &
  easy access to some of the hardest 808 loops made to date. In addition to the
  regular loop content, each kit includes a folder of MIDI files for full
  flexibility over the sound.


  Not only will this make your workflow faster but will also help you deliver
  some of the hardest beats possible. 808 earthquake has been formatted in the
  most widely-used formats: apple loops, acidized wav, and rex files, making it
  usable in virtually every piece of software and hardware on the market today.


  In addition, this library comes fully formatted for kontakt as part of the big
  fish audio kli 3.0 series which transforms this loop library into a truly
  moldable and musical writing instrument.


  Kontakt 5.8.0 is required to use the kontakt 5 instrument patches in the kli
  version of this product. This product does not work with the free kontakt
  player.
