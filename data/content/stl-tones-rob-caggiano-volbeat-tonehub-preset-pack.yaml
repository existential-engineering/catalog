details: |-
  Rob Caggiano is a New York born and bred guitarist and producer with five Grammy nominations to his name. He was lead guitarist of Anthrax and co-produced We've Come For You All and Worship Music , then spent a decade in Volbeat after being brought in to produce Outlaw Gentlemen & Shady Ladies . His production resume also spans Cradle Of Filth's Grammy-nominated Nymphetamine and Thornography , The Damned Things, 36 Crazyfists, H2O and Jesse Malin, and he has worked with Bruce Springsteen.

  This pack covers all bases, from radio-rock-friendly clean tones to Volbeat's massive arena rhythms, on to the kind of lead sound required for a member of the Big Four.
