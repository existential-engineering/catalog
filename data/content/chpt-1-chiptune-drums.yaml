details: |-
  Autodafe CHPT-1 Chiptune Drums is a drum machine for Kontakt based on samples
  of old retrocomputers, video games, and circuit bent toy keyboards.

  The main instrument has 5 vertical slots: kicks, snare/rim/clap, hats (closed,
  open, pedal), cymbal/cowbell, and toms (hi, mid, low) for a total of 12
  sounds.

  Each slot has separate level, pan and tune controls for fine editing and
  fine-tuning of the samples, with two separate controls for attack and sustain
  of the onboard transient shaper.

  Each slot has an independent selectable filter with different lowpass and
  highpass options, cutoff and resonance controls, and an independent distortion
  section with selectable type (tube or transistor) and level control.

  Each slot has solo/mute buttons to solo and mute sounds in the slot, and a
  dedicated reverb send level which controls the amount of sound that is sent to
  the reverb bus channel.
specs: |-
  - 5 vertical slots
  - 32 kicks
  - 32 snares/rim/CLAP combinations
  - 16 hats combinations (closed, open, pedal)
  - 8 cymbals/cowbells
  - 8 toms combinations (hi, mid, low)
  - Level control
  - Pan control
  - Tune control
  - Attack control
  - Sustain control
  - Transient shaper
  - Solo/mute buttons
  - Independent selectable filter
  - Lowpass filter
  - Highpass filter
  - Cutoff control
  - Resonance control
  - Independent distortion section
  - Tube distortion
  - Transistor distortion
  - Distortion level control
  - Reverb send level
  - Kontakt compatibility
