details: |-
  Enter a world of ominous and haunting atmospheres with arke shadowscapes a cinematic sound design instrument for creating tension and suspense. At the heart of shadowscapes is a library of acoustic performances that have been twisted into a dystopian landscape. The result is an instrument that is decidedly electronic but undeniably organic.

  These sound sources are then shaped into pads, pulses, risers and more by the arke engine. With a fast and intuitive user interface every sound can be quickly fine tuned and tempo synced. And for ultimate flexibility, import your own samples via a simple drag and drop.

  When creating unsettling ambience, creeping rhythmic pulses, and dramatic risers, arke shadowscapes has a striking intensity that is essential for modern film scores and trailer music.
specs: |-
  - 1 nki with the fast and easy to use arke engine
  - Over 175 professionally curated snapshots
  - 48 articulations
  - Ability to import your own samples
  - 9 dynamic impact modes
  - 4 sound processing modules
  - 24 bloom character styles
  - 5 tempo synced mvmt types
  - 14 delay and reverb settings
  - Native instruments kontakt v6.6.0+ (sold separately)
  - 1 or more gb of disk space for installation
  - 4 gb ram (6+ gb recommended)
