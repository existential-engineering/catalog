details: |-
  Metaphor features 6,800+ unprocessed recordings harvested from an extremely broad range of objects.

  Metaphor manifests itself in the form of a 4.2GB pack consisting of 45 folders organized by object, totaling a staggering 6,804 24bit 96kHz files.

  Metaphor brings us another deeply compelling soundscape, expertly activated, captured and edited by sound designer Ivo Ivanov. This diverse collection of sounds is adaptable to a broad variety of creative contexts including Music Production, Game Audio, Art Installations, Live Performances, Audio Branding, Cinematic Trailers and much more.

  The unprocessed recordings in this collection are ready to be stretched, pitched, granulated, looped, layered and otherwise processed by your favorite audio manipulation devices. Wherever your imagination may lead you, Metaphor delivers an abundance of highly inspired source material that will elevate your creative projects to new heights.

  While our sound effects are carefully designed to work with your favorite samplers and DAWs, they pair up particularly well with our own brand of audio contortion tools. Our wide selection of packs grant Palindrome, Polygon, Cataract and Tactic users access to thousands of fresh ingredients.
