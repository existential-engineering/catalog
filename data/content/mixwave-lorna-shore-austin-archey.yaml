details: |-
  Being the backbone of the bludgeoning quintet Lorna Shore, his raw energy and otherworldly speed has propelled him to be among the icons at the forefront of modern metal. By capturing every intricacy and nuance of the sonic spectrum that defines his sound, we were able to create a drum engine with a collection of highly aggressive yet natural tones. Introducing, MixWave: Lorna Shore - Austin Archey .
