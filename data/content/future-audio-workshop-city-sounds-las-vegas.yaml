details: |-
  Las Vegas: land of Electric Daisy Carnival, gleaming neon, stretch limousines, splashing cash, and endless clubs and DJ residencies. Club music rings out all along the strip, with booming bass, atmospheric pulsing pads, and glittering synth lines that'll make you sweat till the sun comes out.

  This patch pack explores the many genres of Dance Music to spark a new idea, add that secret sauce, and transform to make entirely your own.

  As an international phenomenon spanning many genres and decades, these patches can be useful for Future Bass, Acid House, Latin House, Hip-Hop, Ambient, Digital hardcore, Trap, Pop bangers, Diva House, and more.

  All of our patch packs are expertly designed by professional sound designers across the globe and NKS ready for Maschine and Komplete Kontrol. Each patch pack in the City Sounds series is our interpretation of a genre and an invitation to explore and transform.
