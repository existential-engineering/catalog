details: |-
  Majestic. Metal. Melodies

  If you love the grand sounds of bodacious bells, you will be amazed by this ensemble of 4 sets of tubular bells played in a hall, all at once. Tubular bells, also known as orchestral chimes, are often used as a substitute for church bells in symphonic music, and the tubular bells ensemble brings a whole new dimension to this instrument. The tubular bells ensemble features 3 microphone perspectives: close, decca, and wide. Along with deep sampled, grandiose sustains and staccato notes, the tubular bells ensemble also includes clustered and chaotic effects. The ensemble sound is broader, looser, stronger, and even more full of overtones! Whether you need to set a festive or pious mood, the tubular bell ensemble is sure to be a totally wicked addition to your arsenal! Soundpaint stretches the sounds of the bells beyond their acoustic limits, with ambient, ethereal, eternal rolls and heavenly soundscapes. The ambient programs are perfect for a wide range of styles, from atmospheric to eerie.
