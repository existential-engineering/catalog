details: |-
  70's treasures is the first preset pack for the polyphonic analog synthesizer
  cherry audio ps-3300 and it contains 40 crafted synth sounds with 70's
  feeling.

  The pack includes 70's warm organs, modulated dreamy plucks, synthetic
  emotional elements, and soft short synths all with vintage character.

  Suits for progressive rock of that era as well as any kind of music that is
  based on synths of that decade.

  Presets were designed with ps-3300 1.0.4 (build 53) and run best with this or
  newer edition.
