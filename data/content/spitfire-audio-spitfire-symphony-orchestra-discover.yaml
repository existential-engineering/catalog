details: |-
  Discover the sounds of our bestselling orchestra, now available in a free, easy-to-use package.

  We've handpicked the essential orchestral sounds and articulations you need to start creating rich, cinematic music - all inside our free, user-friendly plugin.

  Featuring 44 carefully curated instruments and ensembles including strings, brass, woodwinds, percussion, harp, piano, and more — SSO Discover makes it easy for anyone to bring the sound of an orchestra into their tracks, whether you're producing beats or composing your first score. Available to our email subscribers.
specs: |-
  - 44 instruments and ensembles
  - 74 techniques
  - 1 mic signal
  - 3 legatos, 11 solos
  - Not full key range
  - 5.68 GB download size
  - Requires Kontakt Player minimum version 7.5.x
  - Kontakt Player and NKS compatible
  - macOS 11 to 26 (Kontakt 8.8 requires macOS 14 minimum), Intel i5 or higher, Apple Silicon natively or via Rosetta
  - Windows 10 or 11 (latest Service Pack), Intel Core i5 or equivalent
  - 4 GB RAM (6 GB recommended for large Kontakt instruments)
  - Recorded at AIR Studios Lyndhurst Hall
