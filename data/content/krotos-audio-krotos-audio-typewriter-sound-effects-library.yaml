  - 343 MB Size / 2.21 GB Reformer Pro Integrated Version
  - 96kHz High-Quality WAV Files
  - 100% Royalty-Free Commercial License
  - Embedded Metadata
  - 6 Reformer Pro Sound Packs
  - Contains two downloads: a zip file of all source sound effect asset files with Metadata PDF, and an installer for the integrated Reformer Pro library (iLok required for the integration installers)
