description: A composite collection of 5 vintage electric typewriters provided by SoundBits, with sounds ranging from opening and closing covers to pressing keys, random typing, and electric motor movements.
details: |-
  The Electric Typewriters Sound Effects Library is a composite collection of 5 vintage electric typewriters, provided by SoundBits.

  You will find sounds ranging from opening and closing covers, pressing keys, random typing, electric motor movements of the writing head, mechanical hammering of the letters, small mechanical levers and many more. The following typewriters are included in this pack: Panasonic R300, Olivetti Lettera E501, Sharp PA-4000, Triumph+Adler Gabriele 100 and Erika 3006.

  As well as functioning as an ideal SFX resource for a variety of typewriters, these sounds are also ideal for creatively shaping them into robotic and futuristic elements.

  Sound effect keywords: Button, Electric, Input, Interface, Keyboard, Mechanic, Movement, Reformer, Robotic, Sci-Fi, Switch, Typewriter.
specs: |-
