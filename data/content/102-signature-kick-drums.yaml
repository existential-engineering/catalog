details: |-
  102 Signature Kick Drums is a soundware collection (samples or presets) for
  macOS and Windows. Five well-selected producers—robert babicz (bedrock),
  victor ruiz (suara), roy rosenfeld (all day I dream), dimitri andreas
  (systematic), and riamiwo (traum)—have recorded 20 different kick drums for
  use across every kind of electronic music track, ranging from techno to house,
  from deep house to electronica.

  This is the second installment following the success of '101 signature kicks'.
  The package is useful for multiple genres including melodic house & techno,
  leftfield house, minimal, and progressive house.
