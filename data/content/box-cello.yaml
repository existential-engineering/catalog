details: |-
  In december 2018, dave hilowitz built a fully playable cello out of an old
  silverware box. Now you can own the sounds of this totally unique instrument
  in a convenient Kontakt library.

  Requires the full version of kontakt 5.3.1 or later.

  Three articulations: sustain (velocity, modwheel, and algorithmic legato),
  spiccato and pizzicato. Up to 8 round robins per note, 2 velocity layers for a
  maximum total of 16 different samples per note.

  Recorded with three different mics (including a piezo contact mic). Mic levels
  are controllable after the fact to give maximum sonic flexibility. Eq controls
  on all patches.

  Custom convolution reverb with reverb level knob. Library size: 1.03gb (each
  articulation is separate patch so you can easily remove less used
  articulations if you find yourself short on disk space).
specs: |-
  - Compatible with Native Instruments Kontakt 5.3.1 or later
  - Three articulations: sustain, spiccato, pizzicato
  - Up to 8 round robins per note
  - 2 velocity layers
  - 16 different samples per note maximum
  - ADSR controls
  - Recorded with three different microphones including piezo contact mic
  - Mic levels controllable
  - EQ controls
  - Three experimental patches: texture I, open strings, open strings (ensemble)
  - Custom convolution reverb
  - 24-bit 48khz sample rate
  - 1.03gb library size
