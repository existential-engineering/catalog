description: From bear roars to horse neighs and snake hisses, the Sounddogs Wild Animals Bundle is an introduction to the wild animal sounds needed for film, TV or video games.
details: |-
  Krotos has partnered with Sounddogs to bring a wide variety of brown bear, buffalo, bison, horse and snake sounds, recorded at 96kHz. From bear roars to horse neighs and snake hisses, the Wild Animals Bundle is the perfect introduction to wild animal sounds needed for film, TV or video games.

  This library was built specifically for use with Reformer and Reformer Pro, plugins that recompose audio into dynamic, responsive, and highly realistic sound design instantly.

  The libraries are carefully optimised to interact seamlessly with Reformer Pro, allowing you to instantly recompose audio into dynamic, responsive and highly realistic sound design. You also get access to all the original files used in the various libraries.

  Sound categories included in this library: Brown Bears, Horses, Snakes, Bison. Sound effect keywords: Brown Bears, Buffalo, Bison, Horses, Horses Miniature, Horse Neighs, Snake Rattle, Snake Hisses, Snakes.
