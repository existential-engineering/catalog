description: "Howard Benson and Mike Plotnikoff are the producer-engineer duo
  behind many of the most successful modern rock records of the last 20 years,
  amassing millions of album sales and billions of streams throughout their
  career. Modeled emulations of the analog hardware chains used on some of the
  biggest-selling rock albums of the last 20 years are exclusively available in
  this Howard Benson and Mike Plotnikoff expansion pack.Working out of West
  Valley Recording Studios in LA, Howard and Mike have built this expansion pack
  using all analog gear which includes individual traces of the Neve 8058 Mark 1
  from Studio A as well as chains for drums, guitars, and everything in between
  needed for a punchy rock mix.This expansion pack has a total of 153 presets."
