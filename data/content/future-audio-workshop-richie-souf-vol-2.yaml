details: |-
  Atlanta, Georgia producer Richie Souf is bringing a fresh sound to some of the biggest artists in the game including Future, Gunna, Playboi Carti, and Young Thug.

  He started out making beats in the early 2000's with Fruity Loops. After developing a following online, he started working small sessions in home studios with local rappers. Today, Richie Souf is defining the sound of a new generation of hip-hop.

  Get 10 sub sounds created by Richie exclusively for SubLab. Use them in your track as-is or tweak to make them your own.

  All of FAW's patch packs are NKS ready for Maschine and Komplete Kontrol. Once your purchase is complete, the pack will show up in your FAW account. Simply download the zip file and follow the instructions on how to import your new sounds into SubLab.
