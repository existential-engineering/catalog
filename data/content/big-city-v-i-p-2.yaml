details: |-
  Big City V.I.P. 2 is the second set of this series that features five live hip
  hop construction kits that contain many elements from some of the top
  composers in the game. Kits are inspired by kanye west, jay-z, justice league,
  rick ross, and more.

  This pack includes separated drum tracks for drum loop mixing, individual drum
  hits and must-have elements to build hip hop tracks. You'll also find pianos,
  rhodes, synths, brass, guitar and more.

  These sounds and samples are licensed as royalty-free for you to use in
  commercial productions or even for dj/remix purposes.

  Keys and tempos are included with all files provided as royalty-free.
