  40 crash, 50 ghost kicks, 50 ghost snares, 150 hihats, 185 percussion, 70
  rides, 140 toms, 30 big impacts.

  Please note this is a drums & fx pack only. The music elements in the demo are
  for demonstrational purposes only.
