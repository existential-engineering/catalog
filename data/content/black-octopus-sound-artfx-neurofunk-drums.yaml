description: A Neurofunk drum pack by ARTFX, collecting roughly 1500 drum one shots, loops and FX.
details: |-
  Neurofunk Drums features 1500 expertly produced, crisp and heavy hitting drums, loops and fx. The pack is aimed at users of all skillsets, from beginner to advanced.

  Layer the live recorded sounds in with the drum hits to create living organic grooves, or chop and slice the drums to build complex technical beats.

  Although the drums are primarily designed for drum and bass and neurofunk, they are intended to fit with virtually any style of electronic music, from electro house beats to chilled out organic hip hop grooves.

  The contents span 150 kicks, 150 snares, 150 hihats, 185 percussion hits, 140 toms, 70 rides, 40 crashes, 50 ghost kicks, 50 ghost snares, 20 fills and 30 big impacts, alongside 230 live recordings and foley, 50 breaks style loops, 50 cymbals and hihats loops and 130 percussion loops.

  This is a drums and fx pack only. The music elements heard in the demo are for demonstration purposes only.
