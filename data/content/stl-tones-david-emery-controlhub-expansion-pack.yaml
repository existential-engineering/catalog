details: |-
  David Emery is a London-based engineer whose ControlHub pack is built for modern productions of every scale.

  The pack includes meticulously crafted vocal captures for both male and female vocals, designed to deliver clarity, presence and emotion straight out of the box, plus captures covering the full production spectrum, from live band recordings with punchy drums, defined guitars and tight low-end, through to solo vocalists and minimal arrangements that demand precision and space. Each capture reflects David's musical, mix-first philosophy, giving you polished, professional results while still leaving room for your creative touch.

  This expansion pack has a total of 31 captures.
