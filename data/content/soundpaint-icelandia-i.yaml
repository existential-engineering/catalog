details: |-
  Tribute to Icelandic Scoring Traditions

  This beautiful collection pays homage to Icelandic film composers and their striking scoring style that seamlessly blends electronic and orchestral elements together into pure emotion. Soundpaint's Icelandia I library, the first in a special limited series, was created using a curated mix of the finest analog and digital synthesizers, building on the rich soundscape established by the unique and minimalist scoring trends from Iceland. Icelandia I offers 25 elemental pads with both Soft and Hard variations that can be used individually or morphed together using the powerful Soundpaint engine. These pads are perfect for capturing the methodical, dynamic, and patiently evolving atmospheric textures, common in the Icelandic approach to scoring. We loved the visceral Icelandic style that's apparent in movies like Sicario, Arrival, The Theory of Everything, Joker, and the TV mini-series Chernobyl. Icelandia I captures this stark and minimalist scoring technique and makes the Icelandic sonic palette readily available for the Soundpaint community.
