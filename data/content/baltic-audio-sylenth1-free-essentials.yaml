details: |-
  'Sylenth1 Free Essentials' is a free collection of selected presets from the 'Sylenth1 Essentials' series by baltic audio. It contains 21 presets from different genres for the amazing Sylenth1 synthesizer and 22 MIDI files.

  The included presets can be used for different genres like EDM, Tropical House, Slap House, Future Bass and Progressive House.

  This package is intended to give you an insight into the Sylenth1 Essentials packages from baltic audio.

  Please note:

  The drums and some FX used in the demo are not included in this product. These presets require v. 3.06 or higher of Lennar Digital Sylenth1.
specs: |-
  - 21 Presets for Sylenth1
  - 6 Basses (Presets)
  - 3 Chords (Presets)
  - 2 Leads (Presets)
  - 2 Arps (Presets)
  - 2 Brasses (Presets)
  - 2 Plucks (Presets)
  - 2 Synths (Presets)
  - 2 Hovers (Presets)
  - 22 MIDI Files
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
