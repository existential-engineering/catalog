details: |-
  This library contains more than 340 beat box voices in several variations. You
  can either use the beat box voices to support your drum-lines with various
  ad-libs or you can use them as regular but characteristic drum set.

  They are great for up-tempo as well as soulful or ambient music. All samples
  in wav, 16-bit, 44.1 khz and compatible to all common hardware and software
  samplers.

  Additionally tagged for steinberg's mediabay. Genre: pop, modern hip hop,
  electronic, hip house, techno, dance, club, r&b.

  Features include kick voices, snare voices, hi-hat voices, beat-box ad-libs &
  fx voices, clicks & crashes, and loops with most voices in several variations.

  All samples are in wav 16-bit, 44.1khz format for use with any wav-compatible
  sampler, drum machine or DAW.
