details: >-
  Aethra for diva dives deep into the dystopian, gritty, low-fi and nice analog
  sounds. Aethra is inspired by the music of klaus schulze, jon hopkins, boards
  of canada and solar fields.


  This soundset has been lovely designed to keep you in the creative and
  inspiration zone. Aethra is formed by bleak and thrilling ambiances, bizarre
  atypical synths and keys, strong analog bass loops and basses, large evolving
  leads and pads, lots of berlin school sequences and arpeggiators, cinematic
  percussion loops and creative science fiction effects.


  All the 128 patches are ready to grab and drop into your projects to discover
  original musical ideas and fill inspiration gaps.


  Aethra soundset contains: PDF with a detailed installation guide. 128 presets.
  Normalized volumes. Velocity sensitivity. Control by modwheel.
specs: |-
  - 128 presets
  - Normalized volumes
  - Velocity sensitivity
  - Control by modwheel
  - Macos and windows compatible
