details: |-
  Like Melting Wax at Your Fingertips

  An absolute monster of a synth, the Polivoks was loaded with tons of awesome features we still value today. Produced in the 1980's, it featured a switchable filter, external audio routing, loopable envelopes, and even cross-modulation. These synths were popular in their day and are now firmly cemented in the history books of analog subtractive synthesis, seeing a lot of use in film and triple-a video games. Polywax features a comprehensive array of ultra deep sampled sounds. The 65 parts include everything from arps, basses, leads, filter sweeps, kicks, raw oscillators, and more. The 60+ preset programs offer variety and instant inspiration; alongside the instruments and effects featured in all Soundpaint synths, the filter sweeps in Polywax open a whole new realm of sound - on their own or morphed with other parts. But that only scratches the surface! There are all kinds of unique, unconventional, and exciting possibilities in Polywax!
