details: |-
  The boom chak is a classic analogue-style percussion synth with six editable
  drum instruments, a programmable rhythm sequencer, low and hi pass filters and
  six effects.

  Each drum sound has dedicated controls like volume, type, pan, pitch, decay,
  modulation or additional amount of noise, plus six effect switches.

  The effects (convolution reverb, replika delay, chorus, lo-fi, flanger,
  overdrive) can be added to any individual drum sound or to all sounds at once.

  The master control contains two filters (low pass filter with an envelope
  follower and lfo, and a hi pass filter), global pitch control (-12 to +12
  halftones) and velocity sensitivity control.

  The auto rhythm editor is a simple but effective pattern creation tool with a
  total of 12 patterns (each pattern has 2 x 16 steps).
