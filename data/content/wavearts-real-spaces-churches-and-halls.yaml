details: |-
  The Churches and Halls Library is a collection of impulse response (IR) files measured in cathedrals, churches, and small halls. It includes responses made with a variety of microphone techniques and placement: front facing coincident cardiods, rear facing cardiods, ORTF, and placements such as balcony or in the foyer with the doors open.

  The library suits Foley work and provides acoustics for orchestrations and solo instruments.

  Real Spaces Churches and Halls is included in the Real Spaces Complete bundle.
specs: |-
  - 211 impulse responses
  - 399 MB of content
  - Measured in cathedrals, churches and small halls
  - Microphone techniques include front facing coincident cardiods, rear facing cardiods and ORTF
  - Includes placements such as balcony and foyer with doors open
