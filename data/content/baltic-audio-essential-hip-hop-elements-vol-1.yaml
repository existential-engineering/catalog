details: |-
  'Essential Hip Hop Elements Vol 1' from baltic audio contains four construction kits with guitars, drums, pianos, bass sounds and more.

  The product includes the elements needed to create Hip Hop tunes and related styles, with real played and recorded guitars, synths and drums. The kits are ready to use in all major sequencers and include the essential elements of the genre.

  MIDI files are included for many of the accompanying musical phrases heard in each kit, so any synth or sampler can be loaded with the melodies contained in the pack. No MIDI guitars have been used.

  One-shot samples are included, allowing new beats, fills and loops to be created to complement the existing material.

  The loops contain all of the effects processing heard in the audio demos, and unlooped tail versions are included so a phrase can end with the decay of the reverb or delay applied to the loop.

  All sounds are royalty-free and can be used in commercial releases.
