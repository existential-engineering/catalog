details: >-
  Ableton drum racks for ezdrummer big rock drums ezx features separate ableton
  drum racks for all factory presets for the toontrack ezdrummer big rock drums
  ezx expansion. These ableton drum racks for ezdrummer are the most complete
  integration between ableton live and toontrack ezdrummer including a host of
  features ready to use on ableton push.


  Amazing workflow in live and on your push to the full capabilities of the kit
  library saving setup time and allowing you to focus on music creation. Ease of
  navigation to load all big rock drums ezx factory presets from ableton push
  controller device browser.


  Color coded pad design of over 4000 pads mapped to the ezx factory content for
  visual performance and finger drumming. All our racks use consistent drum rack
  coloring so you can visually and immediately spot your snares from your
  crashes. Know your big rock drums ezx rides from your hi hat articulations.


  Ableton macros mapped to toontrack ezdrummer macros for all factory content
  with preset values for ease of use on ableton push and simple to use
  automation programming. Ableton macros are even color coded to match the
  ezdrummer display.


  Use the template racks and extend to your own toontrack ezdrummer big rock
  drum ezx presets, swapping out individual sounds or articulations. You are
  100% ready to go with the factory presets but there is no limitation to
  creating your own presets from these templates.
specs: |-
  - 34 ableton drum racks
  - 17 ableton live templates for multichannel audio routing
  - Over 4000 pads mapped to ezx factory content
  - Over 800 individual articulations
  - Ableton push 64 pad layout mode
  - Color coded pad design
  - Individually labelled drum rack pads
  - Ableton macros mapped to toontrack ezdrummer macros
  - Singleout presets with single audio output
  - Multiout presets with multiple audio channel output
  - 23 multi output ableton templates
  - Ableton live 9.5 or above
  - Toontrack ezdrummer2 required
  - Toontrack ezdrummer big rock drums ezx expansion required
  - Macos and windows compatible
