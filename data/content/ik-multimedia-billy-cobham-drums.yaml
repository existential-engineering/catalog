details: |-
  Billy Cobham Drums is a high definition drum and groove sampletank instruments
  collection that includes more than 2 amazing gigabytes of over 2,000
  meticulously recorded drum samples that include more than 400 audio grooves
  played by billy cobham, the legendary mahavishnu orchestra and miles davis
  drummer.

  Billy cobham drums was recorded by legendary producer-engineer, ken scott, who
  produced the jazz fusion classic album, 'birds of fire' by mahavishnu
  orchestra with billy on drums. Ik us founder and executive producer, dave
  kerzner, reunited the two legends at long view farm studio in massachusetts
  where they recorded the samples for this instrument on a classic trident a
  range console, the same as was used on the 'birds of fire' album.

  For supreme authenticity, a clear-shell fibes drum kit was flown in from los
  angeles just for these sessions. No expense was spared in miking this highly
  stylized drum kit. 8 neumann u67 tube microphones were used on the session so
  that even each tom could be miked with one. Every detail and nuance of his kit
  and performance style is captured with 8 velocities per drum using as many as
  8 round robins per velocity.

  In addition to the full kit instrument, you get individual sampletank
  instruments for his kick drums, snare drums, toms, hi-hats, ride cymbal and
  crash cymbals so that you can customize the sounds, adding effects and perform
  individual instrument processing on each element using multiple parts in
  sampletank.

  Billy cobham drums also includes audio grooves played by the man himself in
  the style of many of his favorite mahavishnu orchestra songs. There are 14
  sampletank instruments grouped as 'songs,' each at its own tempo. And thanks
  to sampletank's stretch engine, you can easily change the tempo of the audio
  grooves without affecting the pitch of the drums.
