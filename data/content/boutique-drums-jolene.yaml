description: Indie, alternative, country and pop drums jolene is the second
  release of the boutique drums series.
details: |-
  Jolene is the second release of the boutique drums series. While ruby
  celebrate the heavy, jolene is all about vibe -- great for indie, alternative,
  country and pop. As per usual, Musical Sampling included a collection of
  "baked-in" mix presets that cater to a variety of musical contexts. From the
  pillow-y, intimate punchiness of 'sunshine' to the portly, attitudinal 'lola'
  preset, jolene has got you covered.

  Also included are five different hi-hat states of multisamples and live
  eighth-note grooves that automatically lock to your DAW's tempo: tight,
  normal, slight-open, mid-open and all-open; grooves recorded at 90/120/140
  bpm. Crossfadeable hi-hat grooves with release triggers? Yup. With the
  modwheel down, it'll play the loop at it's tightest hi-hat state. As you push
  the modwheel up, the hi-hat opens up.

  Recorded at hey hey studios in griffin, georgia. Drums played by brian scoggin
  (casting crowns). Simple and intuitive interface. Eight "baked-in" mix presets
  that are interchangeable between different drum groups.

  Kit includes kick, snare, ghost snare rolls, cross sticks, rimshots, five
  hi-hat state multisamples/grooves, crossfade-able hi-hat grooves, hi-hat
  chicks, two toms, ride cymbal (with crash), ride bell and crash cymbal.
  Repetition sampling for all rides/hi-hat/toms multisamples.

  Live eighth-note hi-hat grooves recorded at 90/120/140 bpm that sync to your
  DAW's tempo. Crossfade-able hi-hat grooves (fades between five different
  hi-hat states; from tight to all-open). Groove speed control
  (half/normal/double). Adjustable humanization feature
  (off/tight/natural/loose). Volume control for each drum group. Assignable
  kontakt outputs for each drum group. Recorded in 48khz/24-bit. 7 gb compressed
  ncw format.
specs: |-
  - Kontakt 5.8.1 or higher required
  - 48khz/24-bit recording
  - 7 GB compressed ncw format
  - Five hi-hat states multisamples
  - Live eighth-note grooves at 90/120/140 bpm
  - Crossfadeable hi-hat grooves with release triggers
  - Groove speed control (half/normal/double)
  - Adjustable humanization feature (off/tight/natural/loose)
  - Volume control for each drum group
  - Assignable Kontakt outputs for each drum group
  - Eight baked-in mix presets
  - Repetition sampling for rides/hi-hat/toms multisamples
  - VST, Audio Units, asio, coreaudio, wasapi, AAX native support
  - Stand-alone interface support
  - 1gb free disk space required
