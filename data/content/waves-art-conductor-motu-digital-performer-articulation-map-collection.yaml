details: |-
  Motu digital performer 11 allows you to control instrument articulations. Art
  conductor is a collection of articulation maps designed for digital performer
  that simplifies the setup process by pre-defining names, controller
  assignments and remote switches for articulations.

  At the time of writing (october 2024), art conductor supports more than 900
  commercial orchestral libraries. Each template was optimised for digital
  performer, with score symbols, color codes and a unique universal naming
  scheme.

  All sets are set up in the same way with the same abbreviations and wording
  across the entire collection. The articulations are listed in alphabetical
  order and the key switches follow the natural order within the instruments,
  with the most important switches on the lowest octave, always in the same
  order.

  This universal compatibility design enables users to use one template and know
  them all, allowing you to find the right expression fast and control it with
  ease.

  The collection is designed to enable users to focus on their music instead of
  technicalities.
specs: |-
  - Articulation map collection for digital performer
  - Support for more than 900 commercial orchestral libraries
  - Score symbols and color codes
  - Universal naming scheme
  - Alphabetically listed articulations
  - Key switches in natural instrument order
  - MIDI controller assignments
  - Remote switch definitions
