details: |-
  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all rock solid ezx factory presets from ableton
  push controller device browser. 10 ableton drum racks to instantly load the
  factory library "mix ready" presets with ableton mappings.

  5 ableton live templates designed to host the multi channel output routing
  presets with track level audio routing from superior drummer 3 into ableton
  live. Colour coded pad design for visual performance and finger drumming. All
  our racks use consistent drum rack colouring so you can visually and
  immediately spot your rides from your hi hat articulations.

  Singleout presets: 5 ableton drum racks for all rock solid ezx factory presets
  single audio output to a single ableton track. Mixing can be further enhanced
  through ableton track mixer by expanding out the track for individual pad and
  instrument level articulation, or loading additional ableton audio effects to
  the track. Multiout presets: 5 ableton drum racks for all rock solid ezx
  presets in multiple audio channel output from the plug in to multiple ableton
  audio tracks using the 5 multi output ableton templates also provided designed
  for the kit presets.

  Use the template racks and extend to your own toontrack superior drummer 3
  rock solid ezx presets, swapping out individual sounds or articulations. You
  are 100% ready to go with the factory presets but there is no limitation to
  creating your own presets from these templates. Simply save a new drum rack
  based upon the modified timbresandtones template.
