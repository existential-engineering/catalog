details: |-
  Nu Metal Grooves: Vol. 1 is a MIDI groove pack from DrumForge delivering 421 drum grooves and fills performed by Frankie Harchut, known for his work with The Bloodline and Dirge Within. Every groove was meticulously captured to ensure a human, dynamic feel rather than a programmed or robotic sound.

  The pack covers the full stylistic range of the Nu Metal genre, providing everything needed to compose, arrange, or practise in that style. Grooves are organised for rapid song-building, allowing producers to drop in intro, verse, chorus, bridge, and fill sections immediately.

  All files are delivered as standard MIDI, making them compatible with any DAW or drum plugin. Users can freely adjust dynamics, tempo, and quantisation to suit their project without being locked into a proprietary format.

  DrumForge Nu Metal Grooves: Vol. 1 integrates directly with the DrumForge Classic, Bergstrand, and Savior sample-based drum plugins.

  Purchase includes an instant digital download, a perpetual licence, free lifetime updates, and unlimited customer support.
