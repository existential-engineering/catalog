details: |-
  Nu Metal Grooves: Vol. 1 is a MIDI groove pack containing 421 drum grooves and fills performed by Frankie Harchut, drummer for The Bloodline and Dirge Within. The grooves cover the nu metal genre across its range of feels.

  The performances are supplied as MIDI files for use in any DAW or with any drum plugin, and they integrate directly with the Drumforge Classic, Bergstrand, and Savior samplers.

  Grooves are organized by individual song sections so arrangements can be built quickly, whether as building blocks for new material or to refresh existing demos. Dynamics and tempo are adjustable.

  The pack works as a practice or production tool as well as a writing resource.
specs: |-
  - 421 total drum grooves and fills performed by Frankie Harchut
  - Grooves cover the entire nu metal genre
  - MIDI files for use in any DAW or drum plugin
  - Integrates directly with the Drumforge Classic, Bergstrand, and Savior samplers
  - Grooves organized by individual song sections
  - Adjustable dynamics and tempo
