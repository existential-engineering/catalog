details: |-
  In this 4-volume series, sound designer Ron MacLeod expands upon his previous work by producing a continuing series of inspirational sonic collections, utilizing the innovative processing tools from Cycling '74. Each Cycles download has separate 44.1kHz / 48kHz folders. The files are stored in 24-bit FLAC format.

  Sustained Encounters is comprised of long evolving aural environments and unfolding atmospheres. Culled from MacLeod's private reserve, an accumulation of years of film sound design and sonic exploration, these textures were individually 'composed' utilizing bleeding edge psychoacoustic processing, designed specifically to be intricately interesting and immersive without being obtrusive to additional content.

  Content categories: Other Realms, longer (30 sec - 2 min) 'otherworldly' compositions that take you on evolving journeys. Atmospheres, big and spacious loops designed to provide an endless immersive field. Environs, loops that are more actively involved, suggesting a 'place' rather than space. Textural, an extreme variety of textural loops to supply endless beds of scenic ambience. Complex, multi layered, covering a wide spectrum of sound. High, high pitched orientation (some to the point of pain). Low, big bottom end designed to PUSH AIR (subwoofer recommended). Events, incidents, fx and transmutations. Immersion, a select collection of undulating 5.1 multi-channel versions.

  The file format is designed for maximum convenience: it contains multiple sample rates for quick multiple format support (48kHz and 44.1kHz), uses 24-bit samples to preserve quality and robustness when doing further processing. 5.1 surround examples are supplied in 6 channel broadcast .wav (SMPTE/ITU order format) as well as 6 individual channel files. All samples are end-to-end looped for easy use in sequencers or looping applications. The spine index uses a coded symbol at the top of the spine: the color suggests the sound file type (ambient, rhythmic, FX, etc.) and the arrow length indicates the average duration of the samples.

  The index is a simple and direct document for fast referencing of vital data relevant to the content of each library, including file length, loop data, BPM and pitch (if applicable), supplied in both PDF and Excel format for easier integration into sound file databases. The files on Cycles releases can be used freely by the purchaser, other than inclusion in other sound libraries, without any additional royalties or usage fees. Because of the nature of some of the longer files, they cannot be used as a stand-alone piece represented as the purchaser's original composition.
