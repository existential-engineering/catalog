details: |-
  Dialect is a massive 4.3GB pack consisting of 118 folders organized by object, totaling 5,838 24bit 96kHz samples. Created specifically with sound designers and electronic musicians in mind, Dialect features thousands of ingredients that have been expertly activated, captured and edited.

  This pack's epic scale yields an endless auditory playground for users of creative audio manipulation tools. The raw, natural sounds in this collection are ready to be stretched, pitched, granulated, looped, layered and otherwise processed by your favorite audio contortion devices. Geared toward software & hardware users alike, Dialect delivers a rich collection of idiosyncratic assets that will empower sound designers and musicians to create more imaginative sounds.

  While our sound effects are carefully designed to work with your favorite samplers and DAWs, they pair up particularly well with our own brand of audio contortion devices. Our wide selection of packs grant Palindrome, Polygon, Cataract and Tactic users access to thousands of fresh ingredients.
