details: |-
  'All Way Up' by Flame Audio is inspired by the sounds of drake, travis scott,
  young thug, gunna & more. Inside this essential pack you'll find scary
  melodies, bone-crushing 808s, trap leads, orchestra sounds, and much more.

  With five hard trap construction kits, this pack helps you to build on the
  sound and technique you have developed. With a plethora of loop types
  including percussion, 808s, piano, bells, keys, flute, and fx, you'll be
  inspired to create some solid hip hop or pick up old projects left on the
  shelf.

  MIDI files are included to offer you full flexibility and tempos are included
  for easy reference. This pack brings you completely up-to-date sounds, helping
  you to create the freshest hip hop and trap records you've been dreaming of.
specs: |-
