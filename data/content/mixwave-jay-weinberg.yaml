description: A virtual drum instrument sampling Slipknot drummer Jay Weinberg's
  SJC Custom kit, featuring multiple kicks, snares, toms, and cymbals. Built for
  Kontakt with a mixer-style interface including reverbs and master channel
  compressor, EQ, and tape saturation.
details: |-
  Jay Weinberg is a true creative to the core. From the imagery he portrays in his paintings, to the ferociousness of his drumming style, he has found ways to seamlessly merge his artistic outlets by incorporating his visual art on his drums. Since joining heavy metal titans SLIPKNOT in 2013, Jay has proven to be one of the most energetic drummers in the genre, and is the driving force behind some of the most sought-after drum tones. He is completely novel of his craft, and we have ensured that every element of his signature drum library lives up to it. With no detail overlooked, we have created a comprehensive and dynamic virtual instrument that accurately captures Jay in every aspect of his creative world. Introducing, MixWave: Jay Weinberg .
