details: |-
  Airflow - sci-fi cinematic loops from ModeAudio will blow 623mb of swirling, dystopian sound through your music like a thick gust of neon-streaked smog, shrouding your productions in the dark atmosphere, mystery and intrigue of the cinema.

  Throw yourself into a haze of simmering textures, brooding drones and ethereal ambiences with this selection of 153 tempo-synched music loops, primed to send your next track hurtling back to the heyday of retro-futurist melancholy.

  Accompanying all the textural action are folders of sweeping, reverb-soaked synth riffs, pounding basses, smoky pads and deep, punishing drum rhythms, shot through with layers of shimmering, dexterous percussive detail to keep things moving.

  Alongside the main loop choice is a set of 30 sfx samples, showcasing all the depth and power of modern sound design across its offering of snarling risers, ghostly noise layers and rattling sonic detonations.

  The 70 MIDI loops used to create the bass and synth loops are also included to complete the set, providing you with instant musical building blocks for use with your own synths and sounds.
