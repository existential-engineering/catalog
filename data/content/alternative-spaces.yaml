details: >-
  Alternative spaces is a new collection of deep atmospheres, ambiences and
  drones by keith hillebrandt. Over a gigabyte of 24-bit 96k samples that will
  add a special mood, feel and depth in film, media and music productions.


  Available in either apple loop (.aif) or wave (.wav) formats with exs24 and
  kontakt starter instruments included.


  Elements: complex atmospheres. Distorted ambience. High frequency ambience. Lo
  frequency ambience. Lo-fi ambience. Machine drones. Static drones. Tonal
  ambience.
specs: |-
  - 148 24-bit/96k samples
  - Aiff or wave format
  - Individual exs24 and kontakt starter instruments for each sample
  - 1.3 gb
  - Macos and windows compatible
