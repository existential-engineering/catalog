details: |-
  Wave Alchemy Bass Pedals for Kontakt 4+ is powered by over 3200 meticulously
  recorded multi-sampled sounds, driven by a custom scripted Kontakt 4 engine
  and intuitive graphical interface. Inspired by the sought-after Moog taurus
  mk1 bass synthesizer, Bass Pedals combines powerful analogue source sounds
  with modern sound shaping capabilities to create a versatile and fully
  programmable bass synthesizer!

  The preset page is able to load 28 extensively multi-sampled patches designed
  and recorded from a vintage moog taurus mk1 bass synthesizer. All preset
  patches have 3 x round robin sound variations and long samples to help capture
  the imperfections of the original instrument. Sounds from this page can be
  further edited and mixed with bass pedals' 'raw oscillators' to create
  interesting 'hybrid' patches.

  Raw mode has 2 analogue oscillators (each with switchable saturated waveforms
  courtesy of an empirical labs fatso), 1 switchable sub oscillator, noise
  source, and oscillator unison modes, all of which are individually powered by
  an extensive set of carefully looped waveforms recorded from a taurus mk1
  analogue bass synthesizer.

  The effects page has a number of fully editable effects as well as specially
  created reverb ir's (impulse responses) recorded from an eventide dsp-7000
  harmonizer. The controls page gives you control over the instruments mono mode
  with selectable note priorities, portamento, pitch bend range, keyboard
  velocity and curve response.

  It is important to note that just like the original moog taurus; bass pedals
  has been designed to be a monophonic instrument. A custom kontakt script is
  used to realistically 'mute' previous notes once a new key is played, even
  when using long amp release settings.
