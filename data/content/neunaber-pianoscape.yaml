description: Pianoscape is an Optigan disc that maps piano notes across a
  continuous loop to create a musically captivating soundscape, with drum beats
  and bass-string tones from a spinet piano.
details: |-
  They said it couldn't be done! How do you map an attack based instrument like the piano onto a continuous loop? As part of the "scape" series, the answer is to exploit the recursive property of the loop by sprinking piano notes at various points in the cycle to create a tapestry that is musically captivating and strangely haunting. Create your own piano soundscape simply by exploring the keyboard - you really can't go wrong! Stately drum beats, bass-string bongs and tinkly middle-octave plinks from a spinet piano nourish your creativity! Or, flip the disc over and experiment with backward tones, as illustrated in the second half of the demo video. The "scape" series illustrates the expanding possibilities of loop-based sampling. Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation.
