description: A collection of 56 preset patches for the GForce Oberheim SEM synthesizer, inspired by the iconic synth-driven soundtracks of John Carpenter, Tangerine Dream, and Vangelis. Created by sound design duo K/V, the pack features 14 arpeggio patches and 42 sequence patches designed to spark cinematic 80s compositions.
details: |-
  Embark on a sonic journey with 80s Cinematic Sequences, a captivating preset pack for the Oberheim SEM designed by K/V. Inspired by the legendary sounds of John Carpenter, Tangerine Dream, and Vangelis, this collection immerses you in a world of mesmerizing sequences and pulsating arpeggios that embody the essence of retro-futurism.

  K/V meticulously crafted these synth sequences to evoke the iconic synth-driven soundtracks of the 80s. Utilising both sequencer slots for added variation and featuring arpeggios in certain presets, this pack is designed to spark creativity and inspire immersive compositions. “Our priority was to ensure that all patches are musically captivating, prompting users to start creative compositions,” says K/V.

  80s Cinematic Sequences offers a treasure trove of sounds that pay homage to the golden era of electronic music. Dive into this collection and transform your productions with the timeless, iconic sounds of the 80s.

  About K/V: K/V is a sound design and composition duo comprised of Ramon Kerstens and Richard Veenstra. Renowned for their expertise in crafting sounds and presets, they’ve made significant contributions across the music industry. Their credits extend across prominent clients, encompassing Toontrack, Native Instruments, Arturia, Steinberg, Soniccouture, GForce Software, and many others.

  The pack is only available to registered users of GForce Oberheim SEM. Additionally, it is exclusively available via this website as a direct download via “My Instruments” when the purchase has been completed.
