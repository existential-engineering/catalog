details: |-
  This fresh new guitar sample pack comes straight from the Prime Loops audio
  lab, loaded to the brim with crisp, clean acoustic samples delivered in
  revolutionary resonance.

  With over 659mb of unplugged action to sync in to your sound, each of these
  acoustic guitar samples comes via direct download in a crystal clear 24-bit
  sample rate.

  Arranged across 2 folders, you are presented with an enticing selection of
  softly strummed chord progressions, hard n' funky strumming patterns, finger
  picked arpeggios and lead melodies.

  Folder 1 and 2 contain acoustic guitar loops, available in both dry
  (unmodulated) and wet (modulated) forms. Should you wish to speed up the tempo
  or slow things down to a more sedate pace, you can simply stretch or squeeze
  the sample once you've dragged and dropped it in to your favourite piece of
  software.

  The key of each sample is displayed clearly in the filename and every single
  sound in this sample pack comes to you 100% royalty free.
