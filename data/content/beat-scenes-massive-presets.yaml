details: |-
  Beat scenes - Massive presets from ModeAudio transforms your copy of the
  Massive soft synth into a vintage musical engine, cruising down west coast
  highways bathed in golden sun and gazing out over the warm, misty, rolling
  surf. From dusty synth leads, crumbling keys and deepest basses to pads softer
  than sand, shimmering instrumental patches and beyond, these 60 presets
  deliver all the lazy, hazy style and off-kilter groove of the celebrated la
  beat scene.

  Just as the early beat scene producers turned hip hop upside down, we've
  pushed the stiff, digital precision of massive into overdrive, creating sounds
  dripping with analog-style warmth, vibrant texture and subtle internal
  movement. From monumental, wavering synth chords, crackling basses and
  swooping pads to sleek vibraphones, enveloping organs, frazzled sfx and
  beyond, we've built each sound from the ground up to inject your music with
  dusky vibe and just a hint of grit, recalling the days of decaying tape and
  classic production gear.

  We've dialled in the pitch-drift, spun the vibrato and hit all the filter
  sweet-spots to bring you a library of 60 warm and worn presets, with all 8
  macro controls assigned for each. Tweaking each patch to fit seamlessly into
  your project is but the twist of a dial away.

  Accompanying the massive presets are 60 key and tempo-labelled MIDI loops,
  each named after the preset it accompanies. Combining slick basslines,
  uplifting lead melodies, epic chord progressions and more, these
  fully-editable note blocks are ready and waiting to inspire your next hip hop
  production the moment they hit your DAW.
