details: |-
  Majestic In Every Way

  We recorded the largest symphony orchestra ever: 240 Players. Comprised of 100 strings, 60 brass, 60 winds, and 20 percussion players. The Majestic Series. Majestic Strings are stacked with power and finesse. 20 Violins, 20 Violas, 30 Cellos and 30 Basses make up these massive Strings. With Power Sustains, Sustains, Legatos, Dynamic Arcs, Col Legno, Spiccato, Aleatoric Effects. A wide assortment of articulations are covered to truly make this an orchestra in a box. Majestic Brass brings an equally dynamic arsenal, full of depth and color. With powerful Sustains and Marcatos, punchy Staccatos and Staccatissimos, Savage Hits and Phrases, expressive Arcs, and Brassy Rips and Bends, Majestic Brass is a force to be reckoned with. This epic section includes 30 French Horns, 10 Trumpets, 10 Bass Trombones, and 10 Cimbassos. Majestic Woodwinds are full of expressive depth and tonal variety, offering everything from delicate to commanding textures. With 10 alto flutes, 10 flutes, 10 piccolo flutes, 15 bass clarinets, and 15 contrabassoons, Majestic Woodwinds cover an expansive range of color. The high winds offer Arcs, Double Tongue, Trills, Flutter Tongue, and more, while the low winds bring Savage Hits, Slap Tongue, and Power Sustains. Combining finesse with raw power. Majestic Percussion rounds out the ensemble with a 20-piece High percussion section including snare drums, tambourines, anvils, sticks, and slaps. A 20-piece Low Percussion section adds Toms, Gran Casas, and as many Timpani as we could fit on stage. And finally, a 20-piece Metallic percussion ensemble features cymbals, scrapes, tam tams, and gongs.
