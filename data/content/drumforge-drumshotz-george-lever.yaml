description: Mix-ready one-shot drum samples from producer and engineer George Lever, drawn from his productions with artists including Loathe, Sleep Token, Monuments, and Thornhill.
details: |-
  Drumshotz George Lever is a signature one-shot drum sample collection from producer and engineer George Lever, whose roster includes Loathe, Sleep Token, Monuments, and Thornhill.

  The library covers 16 kick drum samples, 25 snare drum samples, and 19 tom samples, with a further 11 FX samples and 6 extra samples for transitions and accents. The samples are supplied mix-ready to be layered with existing sample libraries or raw drum recordings.

  All 77 samples are delivered as 24-bit / 44.1 kHz WAV files for use with any drum triggering program or DAW.
specs: |-
  - 77 one-shot samples total
  - 24-bit / 44.1 kHz WAV format
  - 16 kick drum samples
  - 25 snare drum samples
  - 19 tom samples
  - 11 FX samples plus 6 extra samples
  - For use with any triggering program or DAW
