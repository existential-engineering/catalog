details: |-
  Drumshotz George Lever is a one-shot drum sample library created by professional mixer and engineer George Lever. Designed to add power and punch to drum tracks, the collection draws directly from George's extensive experience working on records for some of modern metal and post-rock's most acclaimed artists.

  The library contains 77 samples spread across kicks, snares, toms, and effects. Every sample is delivered in 44.1kHz, 24-bit WAV format, ensuring compatibility with any DAW or drum-triggering software without any format conversion required.

  Kick drums account for 16 of the samples, while snares make up the largest group at 25 samples. The collection also includes 19 tom samples and 17 bonus and FX samples (11 FX plus 6 extras), giving engineers a well-rounded toolkit for reinforcing or replacing recorded drum hits.

  Purchase includes an instant digital download with a perpetual license, free lifetime updates, and unlimited customer support — making it a long-term asset for any mixing or production workflow.
