details: |-
  Lasse Lammert is a renowned engineer, producer and mixer known in the industry as the 'guitar tone guy', with decades of experience across extreme and melodic metal. Working out of LSD Studios, he is the trusted choice for artists including Alestorm, Gloryhammer and Wind Rose.

  The German Boutique pack features tones from Lasse's collection of German-only, hand-made amps. What makes it unique is that he dialed every capture without any overdrive or boost pedals in the signal chain, preserving the integrity and character of the amplifiers themselves. It spans 13 different amps across 3 cabinet combinations.

  Lasse's pack contains 50 captures.
