details: |-
  1982 vol.1 is a soundbank of 51 synth presets for arturia cs-80 v and analog lab v synthesizers focused on the sound design of the 80s era.

  Within those 51 synths the character of the emulated synth and this 80s essence is everywhere thus this is a nice tool for producers of synthwave or vintage electronic music, for composers that need to add some retro character in their cinematic tracks with 80s nostalgia as well as for progressive rock synth players (especially inspired by the early 80s prog rock records).

  Soft tones, chorused and beautiful detuned keys, atmospheric synths, plucky 80s sounds, moving synth presets, nostalgic synthwave sounds and other those presets could be used for both melodic or harmonic parts in your music.

  With the 4 macros you could add some touches in the sound using the low pass filter cut-off, adding rind modulation, reverb or even change the mix between the 2 lanes of the synth.

  All presets designed with cs-80 v 4.3.0.4395 (x64) and run best with this or newer edition. Analog lab v edition: soundbank needs at least version analog lab v 5.9.1.4493 (x64) or newer.
