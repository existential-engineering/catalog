description: A bundle of three Joel Wanasek signature drum sample packs —
  Drumshotz Joel Wanasek, Drumshotz Joel Wanasek Overdrive Edition, and
  Drumshotz Joel Wanasek No Small Time Edition — totaling 141 one-shot samples
  in 44.1 kHz, 24-bit WAV format for rock and metal production.
details: |-
  Drumshotz Joel Wanasek: 36 one-shot samples including kick (5 direct, 5 room, 1 sub), snare (5 direct, 8 room), and 2 tom sets (6 direct + 6 room each). Captures Joel's most-used drum sounds from his rock and metal career.

  Drumshotz Joel Wanasek Overdrive Edition: 60 samples processed through an SSL Origin console and hardware rig including the SSL E-Series EQ/Dynamics, Chandler Zener Limiter, and Burl B2 Bomber. Includes 11 kicks, 17 snares, and 2 tom sets — each in both Overdrive and Normal processing variations.

  Drumshotz Joel Wanasek No Small Time Edition: 45 samples in 44.1 kHz, 24-bit WAV format, including 7 kicks, 10 snares, 2 tom sets, and 7 post-production samples (sub drops, reverse sounds). Ideal for modern rock and metal mixes.

  All three packs are compatible with any DAW or triggering program. Purchase includes perpetual license, instant digital download, and free lifetime updates.
