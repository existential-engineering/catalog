details: |-
  Boost your Ableton toolset with the fantastic Analogue Compressors rack pack. This pack consists of seven audio effect racks that accurately model real hardware compressors from the minimal system instruments studio.

  If you are looking for the sound of hardware compression from directly within ableton then this pack is for you. We have modelled the included racks on compressors from neve and chandler, but there are also compressors modelled on vintage boutique hardware full to the brim with analogue character.

  Contained in the pack are the following compressor racks: boutique english compressor (modelled on a handmade one-of-a-kind compressor from the uk), buzzaudio soc 1.1 (this fantastic compressor from buzzaudio has been recreated as a great sounding ableton rack), chandler germanium compressor, crane song trakker (a beautiful hardware compressor, big sound and big character), hand-built one off 'crush' compressor (if you want to get real analogue sounding drums then you will love this, bags of character!), neve 2254r (a legendary compressor, nothing more needs to be said!), and boutique valve compressor (a monster of a compressor modelled on a fantastic and rare piece of hardware).

  System requirements: this pack requires a pc or mac running ableton live. The product has been tested on versions 7 and 8 without issue.
specs: |-
  - Seven audio effect racks
