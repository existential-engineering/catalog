details: >-
  Ultra analog va-3 - analog essentials by applied acoustics systems is a
  virtual instrument audio plugin and soundware (samples or presets that load
  into other products) for macos and windows. It includes, and is therefore
  "powered by", aas player, which functions as a VST plugin, an audio units
  plugin, a VST 3 plugin and an AAX plugin.


  Whether you are into techno, urban, trance, electro, trip-hop, or any other
  musical style, the analog essentials sound bank offers a great selection of
  arpeggios, basses, pads, percussions, synths, and sound effects that will
  perfectly complement your next production.


  Applied acoustics systems was founded in 1998 and is based in montreal,
  canada. It is a privately-held company, specializing in innovative audio
  products for mac and pc computers.
