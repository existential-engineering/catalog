name: Ableton Drum Racks for Superior Drummer 3 The Classic EZX
manufacturer: timbresandtones
primaryCategory: drum-sample-pack
description: Ableton drum racks for superior drummer 3 the classic ezx features
  separate ableton drum racks for superior drummer 3.
details: >-
  Ableton drum racks for superior drummer 3 the classic ezx features separate
  ableton drum racks for all factory presets for the toontrack superior drummer
  3 and the classic ezx library for toontrack ezdrummer. These racks provide out
  of the box integration workflow between ableton live and toontrack superior
  drummer 3 using the toontrack libraries including a host of features ready to
  use for composition and performance using ableton push or similar controllers.


  20 ableton drum racks to instantly load the factory library "mix ready"
  presets with ableton mappings. 10 ableton live templates designed to host the
  multi channel output routing presets with track level audio routing from
  superior drummer 3 into ableton live.


  Colour coded pad design for visual performance and finger drumming. All racks
  use consistent drum rack colouring so you can visually and immediately spot
  your rides from your hi hat articulations. Vast array of instrument
  articulations ready to go in one massive layout using ableton push 64 pad
  layout mode.


  Individually labelled drum rack pads for clear visualisation, post performance
  editing and automation to all drum rack / instrument articulations in ableton.
  Singleout presets feature 10 ableton drum racks for all classic ezx factory
  presets single audio output to a single ableton track.


  Multiout presets featuring 10 ableton drum racks for all classic ezx presets
  in multiple audio channel output from the plug in to multiple ableton audio
  tracks using the 10 multi output ableton templates also provided designed for
  the kit presets. Use the template racks and extend to your own toontrack
  superior drummer 3 classic ezx presets, swapping out individual sounds or
  articulations.
specs: |-
  - Ableton drum racks
  - Toontrack superior drummer 3 integration
  - The classic ezx library support
  - Ableton push controller compatibility
  - 20 ableton drum racks
  - 10 ableton live templates
  - Multi-channel audio routing
  - Single audio output presets
  - Multiple audio channel output presets
  - Colour coded pad design
  - 64 pad layout mode
  - Individually labelled drum rack pads
  - Factory presets
  - Custom preset creation
  - Audio mixing control
  - Drum buss compatibility
