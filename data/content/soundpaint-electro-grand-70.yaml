details: |-
  Legendary Electric Grand Piano

  Unlock the legendary sound that powered the 70s and 80s. The Electro Grand 70 is the instrument that stood in the spotlight for artists like Prince , Peter Gabriel , and Alicia Keys . It's the essential, profoundly deep character that became the backbone of rock anthems and jazz ballads. Forget standard piano, this is the sound of a musical revolution. With its unique, percussive color and shimmering signal, it's often described as a vibrant crossbreed between a Rhodes and a Wurlitzer. Get that signature, slightly chorusy, de-tuned vibe that made the original tracks so magical. We didn't just sample this legend, we preserved its soul. Captured with an obsessive focus on warmth and depth, every note rings with the energy of a classic analog recording. Feel the full expressive range of the original instrument under your fingertips, giving you the power to perfectly recreate the anthems you love or craft a completely new sound that will stand the test of time.
