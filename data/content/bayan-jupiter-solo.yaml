details: |-
  Bayan Jupiter Solo for ni Kontakt 5 is soundware containing 16498 samples in
  wav and aif formats at 44.1 Hz 24 bit resolution, available in mono and
  stereo.

  Features 3-12 velocity layers for each note with 4 round-robin variations, and
  15 registers relevant to the real sound of the bayan jupiter fagot including
  combinations such as fagot + clarinet + concertino, fagot + clarinet, fagot +
  clarinet + piccolo, fagot + piccolo, clarinet + piccolo + concertino, tutti,
  clarinet + concertino, clarinet + piccolo, clarinet, piccolo, concertino,
  fagot + concertino, piccolo + concertino, and fagot + concertino + piccolo.

  Elective mode for left keyboard with 4 velocity layers for each note and 4
  round-robin variations, and ready mode for left keyboard with 4 velocity
  layers for each note and 4 round-robin variations.

  Includes realistic bayan key attack and release noise for any key in all
  layers, and realistic bellows noises.

  Effects include convolution reverb, limiter, and stereo modeller.
