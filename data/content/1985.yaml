details: |-
  1985 is a thor-based refill for reason version 4 and above, and is the first
  refill available in the historical refill series, a set based on the
  instruments used to top the charts over the last 30 years.

  146 fully programmed combinator patches: 106 tweaked to match the sounds of
  the time period, and 40 "experiment" patches that expand upon these
  instruments.

  109 foundation instrument patches - each of the instruments used in
  combinators are also saved separately in order to make it easier for you to
  customize and use them in entirely different ways.

  27 effects - rv7000 and scream.
specs: |-
  - Thor-based refill
  - Reason version 4 and above
  - 146 fully programmed combinator patches
  - 106 tweaked patches
  - 40 experiment patches
  - 109 foundation instrument patches
  - 27 effects
  - Rv7000
  - Scream
