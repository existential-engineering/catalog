description: German producer and mixer Kristian Kohle brings you a collection of mix-ready one-shot drum samples to add power and punch to your mixes. Now you can get the sound of his famous Room Of Boom instantly in your mix.
details: |-
  Drumshotz Kohle is a one-shot drum sample collection curated by German producer and mixer Kristian Kohle, whose credits include Aborted, Powerwolf, and Electric Callboy. The samples originate from his live room, The Room Of Boom, and are supplied mix-ready so its character is available without further processing.

  The library spans kicks, snares, and toms, with 9 main and 3 auxiliary kick samples, 7 main and 6 auxiliary snare samples, and 2 tom sets covering high, low, and floor toms in both direct and room captures. The range runs from clicky metal kicks to fat rock snares.

  All 37 samples are delivered at 24-bit / 44.1 kHz for use with any drum triggering program or DAW.
specs: |-
  - 37 one-shot drum samples total
  - 24-bit / 44.1 kHz format
  - 9 main and 3 auxiliary kick samples
  - 7 main and 6 auxiliary snare samples
  - 2 tom sets covering high, low, and floor toms with direct and room samples
  - For use with any triggering program or DAW
