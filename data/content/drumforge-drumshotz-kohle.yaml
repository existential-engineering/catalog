description: "German producer/mixer Kristian Kohle brings you an incredible collection of mix-ready one-shot drum samples to add power & punch to your mixes. Now you can get the sound of his famous Room Of Boom instantly in your mix."
details: |-
  Drumshotz Kohle is a one-shot drum sample collection curated by German producer and mixer Kristian Kohle, offering a focused set of 37 professionally recorded samples drawn from his renowned studio, The Room Of Boom. The pack is designed to give mixers immediate access to Kohle's signature drum sound without additional processing.

  The library spans kicks, snares, and toms with both direct and room-captured variants, allowing engineers to blend the samples naturally into existing recordings. Kick options include clicky metal kicks, while snare selections deliver a fat rock character suited for high-energy productions.

  All samples are delivered at 24-bit / 44.1 kHz, ensuring compatibility with professional DAW workflows. The pack is distributed as an instant digital download with a perpetual license and free lifetime updates.
specs: |-
  - 37 one-shot drum samples
  - 24-bit / 44.1 kHz WAV format
  - 9 main kick + 3 auxiliary kick samples
  - 7 main snare + 6 auxiliary snare samples
  - Tom sets: high, low, and floor toms with direct and room variants
  - Instant digital download
  - Perpetual license
  - Free lifetime updates
