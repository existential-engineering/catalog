details: |-
  Five-time Grammy winner Dave Clauss is a highly sought-after engineer and mixer. Working from his Nashville studio, Santa's Workshop, Dave has crafted award-winning records for Latin superstars like Shakira and Maná, as well as chart-topping country and pop artists including Maren Morris, Stephen Wilson Jr., and Brett Eldredge.

  This expansion pack brings the hardware mixing and summing chains Dave Clauss uses every day to the ControlHub plugin. These emulations replicate the powerful, detailed and harmonically exciting signature of a Dave Clauss mix.

  This expansion pack has a total of 31 captures.
