details: |-
  Dustons.com are proud to present "303 analog madness" a series of hardware soundsets. For this series we choose one of the most used hardware synth in electronic music: access virus ti. 303 analog madness is a collection of professionally polished, hand-sculpted and extremely detailed 303 leads, riffs and sequences with the highest level of control available.

  Genres: edm, pop, trap, hip-hop, r&b, house, trance, techno, ambient and more. License: for one user. All content is 100% royalty free.

  Installation guide: 1. Drag the user patch library (soundset), which comes as a MIDI file (check the virus ti soundset folder file ending with .mid) into the following folder: on mac os x /library/application support/access music/virus ti/patches. On windows: my documents\access music\virus ti\patches. Virus control will recognize the new library next time you open it.

  2. Run your DAW (or virus control center) program like logic, cubase, fl studio and load the virus ti as a vsti. You will see those banks on virus ti VST browser.
