details: |-
  BFD Heavy is an expansion for bfd3, bfd eco and bfd2 featuring 2 stunning
  Yamaha birch drumkits and a variety of presets designed for hard rock and
  metal styles.

  Containing meticulous recordings of both a yamaha recording custom and a birch
  custom absolute kit, bfd heavy includes 3 kicks, 9 toms and a bonus
  reduced-detail yamaha jimmy chamberlin steel-shell snare (taken from bfd
  signature snares vol.2).

  Kicks include wood and felt beater versions while the bonus snare and 5 of the
  included toms are provided in stick and mallet versions.

  Bfd heavy's expressive articulations include rim shots and rim clicks on the
  birch toms and half-edge samples on the bonus snare.

  Bfd heavy is recorded in similar studio conditions as bfd percussion, other
  fxpansion yamaha-based expansions such as bfd maple custom absolute and the
  mapleworks kits in bfd3.
specs: |-
  - Expansion for bfd3, bfd eco and bfd2
  - 2 Yamaha birch drumkits
  - 3 kicks with wood and felt beater versions
  - 9 toms
  - Yamaha jimmy chamberlin steel-shell snare
  - Rim shots and rim clicks on birch toms
  - Half-edge samples on snare
  - Stick and mallet versions for 5 toms and bonus snare
  - Strainer on/off for snare
  - Hard rock and metal style presets
  - Windows 7 or higher
  - Os x 10.6.8 or higher
  - Internet connection for download and authorization
  - Disk space: 15 GB full install, 7.5 GB medium install, 5 GB small install
