  Optigan Archives.
details: |-
  BIG BEAT is the latest in our series of excavations into the Optigan Archives in search of material that was left on the cutting room floor. The working title for this disc was "Motown 1 - Big Beat." Previously only heard on the song "How Do You Feel?" by Optiganally Yours. The keyboard sound is also sourced from the Optigan Archives- we mixed several different solo trombone and trumpet scales to form a brass section. A version of this sound previously appeared on our Orchestron "Brass Ensemble" disc. Special note: This groove was recorded at a slower tempo than usual, so turn your Optigan's Tempo knob down to achieve concert pitch. Chords:
  Funky combo with bass, guitar, organ, and drums

  Keys:
  Brass section

  SFX:
  1 - Drums 01
  2 - Drums 02
  3 - Drums 03
  4 - Bongos
  5 - Cowbell

  Edited and mastered by Pea Hicks
  Disc design and mastering by Robert Becker
  Jacket label art direction and layout by Michael Buchmiller

  Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility
