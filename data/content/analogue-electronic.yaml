details: |-
  Analogue Electronic is a stunning collection of 288 cutting edge loops recorded from real analogue hardware including doepfer and buchla modular synths, Moog voyager xl, Roland jupiter 8, alesis andromeda a6 and many more.

  If you produce house, techno, or minimal you don't want to miss this. Heavy basslines and cutting synth leads a plenty.

  Each loop contained in this pack has been lovingly produced by our in house team of sound designers and established producers.

  All loops are 24-bit .wav files for use in any pc/mac based DAW.
