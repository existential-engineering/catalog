details: |-
  Uptown Drums

  Get ready for some Big-Voiced, Booming, Bad-Ass Boogie! Inspired by the drum kits of today's Top 40 artists, The perfect blend of Rnb, Hip-Hop, and a little Trap. Boogie Mars borrows from modern music as well as the 80's greatest hits - combined with all the control, customization, and infinite dynamic variation of Soundpaint. Say goodbye to the limitations of loops and hello to endless possibilities in Soundpaint! Pop 40 is what we call a "Postapocalooptic" tool, designed for easy out-of-the-box flow and much greater customization! The drums are mapped in a standard way across the keyboard (kick, hat, snare, etc), so it's easy to mix and match elements to create the perfect sound for your track. Each program has an ARP - a great way to get the ball rolling. Customize the arp, play on top of it, or turn it off and get into all the details; there's no wrong way to get grooving! It's easy, flexible and fun to play, so you can get start jamming right away!
