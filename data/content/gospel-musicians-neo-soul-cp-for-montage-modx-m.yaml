details: |-
  🎹 CP70 Stage Vibes – Electric Grand for Yamaha Montage & MODX

  Bring the soulful stage presence of D'Angelo's live performances straight to your fingertips with CP70 Stage Vibes, an authentic recreation of the iconic Yamaha CP70 electric grand piano—specifically designed for the Yamaha Montage, MODX, and MODX+. This isn't just another piano patch. We've captured every mechanical nuance, pedal thump, string resonance, and amp color that gives the original CP70 its unmistakable voice. From the slight clanks of the keys to the subtle detuning and velocity quirks that make each note feel alive, this library dives deep into the raw, expressive character that made the CP70 a legend on stage. ✅ Features:

  Whether you're playing soft ballads or gritty live sets, this CP70 brings vintage soul into a modern sound engine—no VSTs required. Load directly into your Montage, MODX, MODX+, or M-Series. 🎶
specs: |-
  - Deep multi-velocity sampling with natural dynamic Mic and DI
  - Modeled mechanical noises and hammer release from the Mic
  - Amp-modeled signal chain inspired by D'Angelo's live rig
  - Ready-to-play performances tailored for gospel, soul, and R&B
