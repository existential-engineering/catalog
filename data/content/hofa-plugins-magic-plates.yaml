description: This large collection of legendary, established and innovative plate reverbs offers you extremely dense reverb structures with a highly musical tone that should not be missing in any production. Requires the IQ-Series Reverb V2 or the HOFA SYSTEM IR-Verb.
details: |-
  IR-Pack Magic Plates is a HOFA-Plugins impulse-response pack collecting legendary, established and innovative plate reverbs. The page describes the pack as offering extremely dense reverb structures with a highly musical tone that should not be missing in any production.

  The pack is not a standalone plugin. To buy and use the IR-Pack you need either the IQ-Series Reverb V2 or the HOFA SYSTEM IR-Verb, which load the impulse responses as convolution reverb presets.

  The product page lists 150 named impulse responses, spanning classic plate characters (Big Copper Plate, Plate Metallic, Wonder Plate), gated variants (Gated Breath, Gated Doubler, Gated Toy Gun Low), chamber and spring hybrids (Chamber Brown, Big Plate Spring Bamm, Lung Plated Spring), and digital-flavoured entries (Digiverb HF, Digiverb Tremolo, Digiverb Soar).

  Sound examples are offered on the page through an embedded SoundCloud player, and a Download & Test link points to the HOFA-Plugins downloads area for trying the products before purchase.
specs: |-
  - 150 plate reverb impulse responses
  - Requires IQ-Series Reverb V2 or HOFA SYSTEM IR-Verb as host
  - Includes gated, chamber, spring-hybrid and digital-style plate variations
