details: |-
  Belight And Plucks features physical modeled guitars, arpeggio presets,
  plucks, synths, mallets, dulcimer aswell as pads, soundscapes and more.

  All sounds and presets offering huge amounts of coloring and tweaking
  possibilities that goes beyond the wildest dreams and all presets are
  presented in a simple effective and coherent macro page layout.

  With a main focus on the pluck oscillator module in falcon during the sound
  design process, this soundset evolved into what could be described as an
  embracing delight of dreams, flow and plucks.

  61 presets. Physical model guitars, plucks, mallets, arpeggio presets, synths,
  soundscapes and more.

  Extensive sound shaping and coloring possibilities. Coherent macro page
  layout.
specs: |-
  - Physical modeled guitars
