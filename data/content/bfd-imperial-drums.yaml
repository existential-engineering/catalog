description: BFD Imperial Drums is an expansion pack for bfd3, bfd eco and bfd2
  featuring a wide range of drums and cymbals produced by chocolate audio.
details: |-
  The sounds feature diverse mic channel sets and beater types for versatility.
  The medium-sized recording room used on bfd imperial drums allows naturally
  warm ambience and direct mic signals with superb isolation.

  Many included instruments provide alternative ambient and direct mic sets for
  increased variety. Finally, 13 stick and beater types including hot-rods,
  webs, rutes and jazz brushes were used to play the instruments.

  The included drums, cymbals and hihats are expertly set up and tuned by
  experienced session drummer elio rivagli.

  With over 150 loadable instruments in total, bfd imperial drums' sounds are
  suitable for all genres of music that demand powerful, musical-sounding drums.
specs: |-
  - Expansion pack for bfd3, bfd eco and bfd2
  - 13 stick and beater types
  - Over 150 loadable instruments
  - Diverse mic channel sets
  - Multiple beater types
  - Alternative ambient and direct mic sets
  - Hot-rods, webs, rutes and jazz brushes
  - Medium-sized recording room acoustics
  - Direct mic signals with superb isolation
  - Naturally warm ambience
  - Windows 7 or higher
  - Os x 10.6.8 or higher
  - Internet connection for download and authorization
  - 15 GB full install, 7.5 GB medium install, 5 GB small install
