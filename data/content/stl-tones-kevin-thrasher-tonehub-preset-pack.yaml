details: |-
  Kevin "Thrasher" Gruft is a guitarist, producer, songwriter and mixer who spent seven years as lead guitarist of Escape The Fate, releasing three studio albums with the band including Chemical Warfare , which he co-produced with John Feldmann. He previously played in LoveHateHero and The Dead Rabbitts, and as a producer and engineer has worked with Machine Gun Kelly, Blink-182, Avril Lavigne and Gwen Stefani.

  Built around 11 of Thrasher's go-to guitar amp, cab and pedal setups, this signature collection caters to all of his playing styles.

  Thrasher's pack contains 88 captures.
