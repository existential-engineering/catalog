details: |-
  Atlas flutes is an intriguing collection of world woodwinds that focuses on
  short, almost percussive and textural, articulations. Developed in
  collaboration with german film composer christoph zirngibl, who originally
  created the library for his score on the hugely successful animation film mia
  and me: the hero of centopia, this captivating instrument for the free Kontakt
  player is inspired by the work of legendary film composer james horner and
  features six instruments, plus never-sampled-before articulations and a unique
  performance mode which make it possible to add woodwinds to your musical
  creations in new and exciting ways.

  Atlas flutes features an alto flute, a bass flute, a kaval, a west african
  flute, a quenacho and pan pipes all meticulously recorded, programmed and
  delivered in the styles typically heard in film, game and other media
  soundtracks. Each instrument can play: marcato, staccato, staccatissimo,
  swells in two or three different durations, sforzando in three different
  durations, jet tones (bass and alto flutes only), and flutters (kaval, bass
  flute, alto flute and west african flute only).

  Whilst this toolbox is perfect for achieving authentic, atmospheric and
  enchanting ethnic soundtracks, we also recorded incredible kaval and bass
  flute textures that vary from purely acoustic improvisations to designed,
  hybrid soundscapes. Use the x-y pad to morph between them and create your own
  distinctive sounds ranging from disturbing, dark and haunting to light, airy
  and uplifting.

  Performance mode is a unique feature of atlas flutes which will speed up your
  workflow immensely. Activate it to control all the selected instrument's short
  articulations from one single keyboard mapping. At the press of a button the
  articulations are automatically remapped: use the left part of the keyboard to
  define the pitch to be played and the right side to trigger notes: marcato,
  staccato and staccatissimo on the white keys, swells and sforzandos on the
  black. There's more: the swells in performance mode are automatically tempo
  synced to your host... Landing on the beat and creating tight ostinatos is
  quick and easy.

  Atlas flutes: world winds toolbox is available for kontakt player 6.7.1+ (no
  full version of kontakt is required).
specs: |-
  - Kontakt player 6.7.1+
  - Alto flute
