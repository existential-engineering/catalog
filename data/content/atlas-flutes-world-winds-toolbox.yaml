  - Jet tones (bass and alto flutes only)
  - Flutters (kaval, bass flute, alto flute and west african flute only)
  - X-y pad morphing
  - Performance mode
  - Automatic tempo sync
  - Keyboard mapping for articulations
  - macOS support
  - Windows support
