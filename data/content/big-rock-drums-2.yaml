details: |-
  The follow up to the hugely successful big rock drums 1, this library contains
  an incredible collection of amazing rock drum loops performed by
  multi-platinum award winning drummer scott rockenfield of queensryche. These
  drum loops, fills, versus, bridges, and chorus' are perfectly edited and were
  performed at 70, 75, 90, 100, 114, 131, 160, 185 and 190 bpm.

  Perfect for use in film, trailers, and all other music productions. If you are
  seeking those perfect rock drum loops to add incredible sonic impact to your
  compositions, then this collection is a great way to get introduced to the
  hugely successful products from hollywood audio design.

  Suitable for ambient, cinematic, dubstyle, hardstyle, rock, metal, soundscapes
  and much more.

  The samples contained herein are licensed, not sold to you, the individual end
