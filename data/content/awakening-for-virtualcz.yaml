details: |-
  "awakening" is a soundset for the virtualcz software synthesizer from plugin
  boutique. The sounds in this set are well suited for vintage (80's, early
  90's) style synthesizer music, but will easily find a place in music styles
  like chillwave as well.

  The emphasis of this set is on typical synthesizer sounds with a nice
  collection of pads, strings and few basses and brasses added.

  The soundset consists of a total of 50 presets: 4 basses; 3 brasses; 2 keys; 1
  lead; 1 loop; 11 pads; 7 strings; 20 synth sounds; 1 wind instrument sound.
