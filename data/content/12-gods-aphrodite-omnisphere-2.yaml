details: >-
  12 gods: aphrodite is a 50 patches library for omnisphere and 4th volume of
  "12 gods" series. It is inspired by the goddess of beauty. Its sounds are
  focused on airy and beautiful soundscapes to recreate the beautiful nature of
  aphrodite in a sonic dimension but also there are some fuller and darker
  patches that mirror the dark side of the goddess as very often mentioned on
  greek mythology.


  Each patch refers to a different myth or person connected with aphrodite.
  Sounds full of complex motion, shimmering synths, textural patches,
  atmospheric layers and airy feeling create a nice soundbank focused on
  electronic and cinematic or game audio music.


  Mw is used for a subtle vibrato while at is attached to pitch variation.
  Presets were designed with omnisphere 2.8 or and run best with this or newer
  version.
