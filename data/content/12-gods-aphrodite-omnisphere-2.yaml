  - Omnisphere 2 soundbank
  - Complex motion
  - Shimmering synths
  - Textural patches
  - Atmospheric layers
  - Airy feeling
  - Mw vibrato control
  - At pitch variation
  - Omnisphere 2.8 or newer required
  - Soundsources v2.6.1c
  - Patches v2.8.1c
