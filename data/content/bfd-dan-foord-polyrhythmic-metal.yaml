description: Fxpansion and dan foord (sikth, krokodil) teamed up to produce a
  bfd3 groove pack loaded with progressive, modern and technical metal groove.
details: |-
  Fxpansion and dan foord (sikth, krokodil) teamed up to produce a bfd3 groove
  pack loaded with progressive, modern and technical metal grooves. Dan foord
  polyrhythmic metal contains more than enough grooves and fills for any
  songwriter to quickly create fully authentic technical metal drum tracks.

  With over 500 grooves in total, each of the included 26 palettes contains
  related grooves and fills to help you construct drum tracks quickly and
  efficiently. Each groove features techniques dan regularly uses, including
  beat displacement and modulation, related tempo and time signatures, varied
  orchestration, ghost note grooves, paradiddle and linear fills, and single
  stroke rolls.

  I wanted to create a bfd groove pack that would be instantly identifiable as
  modern tech metal. Polyrhythms in particular form the basis of this style and
  3 over 4 most of all. I can honestly say you won't find a more comprehensive
  set of 3 over 4 polyrhythmic grooves and fills anywhere.
specs: |-
  - Over 500 grooves and fills
  - 26 palettes
  - Tempos ranging from 90 bpm to 135 bpm
  - Beat displacement and modulation
  - Related tempo and time signatures
  - Varied orchestration
  - Ghost note grooves
  - Paradiddle and linear fills
  - Single stroke rolls
  - Polyrhythmic grooves
  - 3 over 4 polyrhythmic patterns
  - Bfd3 groove pack
  - Progressive metal
  - Modern metal
  - Technical metal
  - Requires bfd3 v. 3.2.1.2 or above
  - Windows 7 or above
  - Os x 10.8 or above
  - 23 GB disk space
  - Internet connection for download and authorization
