  - 291 samples
  - Mod wheel and velocity mapped
  - 16-bit 44.1 kHz uncompressed PCM wav samples
  - 145 MB installed
  - Wavetable synthesis
  - Transwave synthesis
  - Additive synthesis
  - Multi-core processor required
  - 4 GB RAM minimum (8 GB recommended)
  - 1280 x 768 minimum monitor resolution
  - Asio driver support (Windows)
  - Coreaudio compliant audio interface (macOS)
  - Windows 11 or Windows 10 64-bit
  - macOS 10.13 or later 64-bit
  - VST3 and/or AAX support required for DAW host
  - Auv2 and/or AAX support required for DAW host (macOS)
