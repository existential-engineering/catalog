details: |-
  The ppg wave 2 is the legendary 1980's digital/analog hybrid machine that
  inspired generations of synths to come. The wave 2 featured digital
  oscillators capable of producing up to 8000 unique waveforms modified by
  analog filter and amplifier circuits.

  The fizmo is a 48-voice synthesizer which uses 2nd-generation transwave
  technology to create very organic sounds unlike any other synth available.

  Ensoniq mirage with soundprocess has additive synthesis capability plus up to
  4 independent oscillators which can be stacked together.

  Sampled through all synths' analog/digital filters and a/d-d/a converters.
specs: |-
  - Rack extension plugin
  - 69 presets
