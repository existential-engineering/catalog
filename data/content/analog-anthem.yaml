details: >-
  Analog anthem is a preset library for hive2, featuring original uhm
  wavetables, each of which is inspired by legendary synths. Uhm (u-he math) is
  the wavetable scripting language developed by u-he, introduced in 2018. Uhm
  can generate very high quality wavetables expressed by math and logical
  formula. With its ability of very fine tuning, the wavetables replicate the
  analog vibes as much as possible.


  10 historic synths are chosen as models, and each wavetable is named after its
  model: mini d, mini voyager, oberton, oberboss, jupitron, juna, professor v,
  professor I, k-20, and nanologue. Each wavetable captures the distinctive
  sonic characteristics of its inspiration, from the brilliant highs of the mini
  d to the warm yet clear sound of the nanologue.


  All wavetables are multi-framed (256 frames). You can smoothly morph between
  waveforms, which also replicates the behavior of model synths.


  Contents include: 255 hive presets total (70 basses, 43 mono leads, 22 poly
  leads, 44 pads, 45 keys, 19 sequences, 12 synth templates), wavetables
  exported as wave format (compatible with vital, serum etc.), and raw uhm files
  which you can open and edit.
specs: |-
  - Uhm wavetable scripting language
  - Multi-framed wavetables (256 frames)
  - Waveform morphing
  - Hive2 compatible
  - Wavetables exported as wave format
  - Compatible with vital and serum
  - Raw uhm files for editing
