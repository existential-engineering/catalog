description: A world percussion library of loops, one shots and fills, recorded by percussionist Kosta Kopanaris.
details: |-
  This library is nearly 1.5 gigs of content with percussion loops, one shots, fills, music loops, shakers, and percussion from all areas of the globe.

  For those that know percussion they will be happy to find the following types inside: Bata, Bombo, Bongos, Caja, Cajon, Conga, Cowbells and Clavs, Crass, Guiro, KriKri, Metal Bongos, Sese, Shakers and Timpales. Basement Freaks even took full combinations and made those into loops as well.

  Alongside all of these percussion types are Music Loops such as Acoustic Guitar, Bass Guitar, Piano, Trumpets, and much more.

  All instruments are recorded hands-on and performed by Kosta Kopanaris, a professional percussionist and educator in London UK.
