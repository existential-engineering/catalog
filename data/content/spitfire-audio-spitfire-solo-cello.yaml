details: |-
  Our highly advanced Total Performance Solo Cello is available to purchase as a single patch in its own Kontakt Player library. Beautifully performed by world-renowned concert cellist Richard Harwood, this is our most detailed and complete solo cello to date. It contains all the techniques you need to create an ultra-realistic solo performance, including five different types of true legato: fingered legato, bowed legato, portamento legato, runs and arpeggios, as well as spiccato, staccato, tremolo, playable trills, pizzicato, Bartok pizzicato, molto vibrato, progressive vibrato and non-vibrato.

  The patch enables you to create exquisite musical phrasing without the need for key-switching or 'stitching' together performances, and is programmed to react to playing speed and touch, allowing you to focus entirely on your composition. This instrument can now also be found in our renowned Spitfire Solo Strings library.
specs: |-
  - Single Total Performance patch with 14 articulations
  - Five types of true legato: fingered, bowed, portamento, runs, arpeggios
  - Performed by concert cellist Richard Harwood at The Hall, AIR Studios
  - 3 mic positions (Close, Tree, Ambient)
  - No keyswitching required
  - ~5797 samples
  - 6.5 GB download size
  - 7.00 GB disk space required during install
  - Kontakt Full or Kontakt Player 5.6.8 or higher
  - Spitfire Audio App required
