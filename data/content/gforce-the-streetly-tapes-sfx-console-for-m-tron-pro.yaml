details: |-
  The Streetly Tapes SFX Console brings the authentic original Mellotron MKII sound effects library to M-Tron Pro. Created in collaboration with Streetly Electronics, this expansion faithfully recreates the console first introduced in 1965, which was designed to give film & TV composers live keyboard access to an enormous range of essential sound effects.

  The original MKII SFX console featured transistor amplification and DC motor controls for improved audio quality. The recordings retain the character of their shellac disc origins, giving these effects an unmistakable vintage authenticity.
