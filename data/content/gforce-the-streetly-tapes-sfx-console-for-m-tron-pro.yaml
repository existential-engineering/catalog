description: The original Mellotron MKII SFX library with 1,260 effects across 36 tape banks for M-Tron Pro, recreating the 1965 console used by film and TV composers.
details: |-
  In collaboration with our friends at Streetly Electronics, we are delighted to bring you the original Mellotron MKII SFX library in all its glory.

  The add-on pack for M-Tron Pro contains 1260 individual effects organised in 36 tape banks.

  The library covers aircraft, helicopters, motorcycles, wood chopping, sports crowds, bells, industrial effects, footsteps, children & babies, horses & carts, birds, animals, doors, prison, frogs & toads, fireworks, laughter & applause, wind, rain, thunder, gunfire, trains (electric, steam, diesel), telephones, clocks, electronics, radiophonics and many more.

  The Streetly SFX Console Expansion Pack is only available to registered users of M-Tron Pro. Additionally, it is exclusively available via this website as a direct download via “My Instruments” when the purchase has been completed.
specs: |-
  - The sounds of the classic MKII SFX console
  - 36 new tape banks
  - 35 notes per tape bank
  - 1260 individual effects
  - Only available via download
