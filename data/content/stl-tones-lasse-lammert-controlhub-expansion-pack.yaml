details: |-
  Lasse Lammert is a renowned engineer and mixer known for powerful, polished modern metal records. With decades of experience across extreme and melodic styles, his mixes balance clarity, impact and articulate detail. Working out of LSD Studios, he continues to be the trusted choice for artists such as Alestorm, Gloryhammer and Wind Rose.

  Lasse's expansion pack is built from his favorite hardware, refined through years of professional metal and alternative metal productions. Designed for both mixing and mastering, it captures his signature balance of power, clarity and precision. Whether you're shaping modern metal guitars or polishing dense productions, these are his trusted starting points to get your mixes sounding aggressive and heavy right from the start.

  This expansion pack has a total of 59 captures.
