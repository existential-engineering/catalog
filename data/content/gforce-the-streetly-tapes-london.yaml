description: A collaboration between GForce Software and Streetly Electronics
  featuring 35 tape banks derived from original UK Mellotron tape stock. The
  collection includes fifteen iconic tape banks recorded with 'London Tape
  azimuth' characteristics, plus twenty rare banks from the final Streetly
  Archives. The tapes feature a historically distinct 'duller, more nasal' tonal
  quality resulting from 1970s production decisions at Mellotronics' London
  office.
