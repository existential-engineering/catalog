details: |-
  Body Percussion is a sample library for Kontakt. Includes 24 articulations of
  corporal percussion: stomps (stage and floor), foot tip (stage and floor),
  heel (stage and floor), claps, snaps (single and double), chest (hand and
  fist), thighs (front and side), shouts (ah, eh, oh, uh, short and long
  versions), finger claps, abdomen, and hand sweep. From a single player to up
  to 30 players.

  Recorded with 3 mic positions, all mics controllable in the mixer panel.
  Effects section in which you can add any of the 16 built-in effects to each
  channel or to the master channel in any order you want. Includes eq,
  saturation, compression, flanger, phaser, chorus and more.

  In the settings panel you can control the number of round robins to up to 10x,
  velocity curve, dynamic range, randomness of the players and articulation
  control with volume, pan, pitch and decay parameters.
