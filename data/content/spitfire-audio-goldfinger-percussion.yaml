details: |-
  Multi-instrumentalist Inder Goldfinger welcomes us into his wonderful world with this anthology of Indian percussion instruments and esoteric sounds. Recorded deeply as multi-samples, loops and grooves.
specs: |-
  - 37 presets
  - Centred on the tabla, plus dhol, dholak, damaru, gongs, bells, cymbals and rattles
  - Multiple articulations, beaters, dynamic layers and round robins
  - 4 mic signals: Close Cardioid, Close Ribbon, Close AKG, Room
  - Includes wet variants recorded with submerged hydrophones
  - Ostinatum pattern sequencer
  - Recorded at Spitfire HQ King's Cross and Air-Edel, London
  - 7.60 GB download size
  - 15.20 GB disk space required during install
  - Requires Kontakt Full
  - macOS 11 to OS 26 (Kontakt 8.8 requires macOS 14 minimum)
  - Windows 10 or 11 (64-bit)
  - Minimum 8 GB RAM, 16 GB recommended
