details: |-
  Primarily all guitars have been recorded in wav for use with any wav
  compatible sampler or DAW. Additionally we have added a complete Kontakt
  instrument with which you can switch dynamically between single lick groups.

  All guitars have been recorded clean (with a tube preamp) so that custom amps
  can be added as well as with additional amps.

  All licks are mapped over one octave and divided into 7 groups controllable
  via key switches.
specs: |-
  - 50 loops
  - Bluesy guitar licks
  - Strummed rhythm
  - Wav format
  - Wav compatible sampler or DAW
  - Clean recording with tube preamp
  - Custom amps compatible
  - Additional amps included
  - Kontakt 5 or later required
  - Full version Kontakt instrument
  - 7 groups controllable via key switches
  - Licks mapped over one octave
  - Dynamic switching between single lick groups
