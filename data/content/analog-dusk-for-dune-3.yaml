details: |-
  I like the sound of analog synthesizers, always have, always will. There is
  something about the warmth that I find very satisfying.

  In creating "analog dusk" my desire was to do 2 things, bring warm, analog
  sounding synths to dune 3, and atmospheres, a category missing from the
  factory presets.

  I found dune 3 very flexible and very capable of a broad range of sonic
  possibilities, I ended up making all types of sounds.

  Analog dusk also includes custom wave tables.
