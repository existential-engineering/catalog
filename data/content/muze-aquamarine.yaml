details: |-
  Muze Aquamarine complete and Aquamarine free is a huge collection of textures,
  pads & synth sounds for music, sound design and cinematic composition.

  A flexible user interface that allows you to control all aspects of the sound.
  Aquamarine contains more than 2400 patches (snapshots) divided into 4
  categories: pads, chords, synths, plucks.

  There are a total of 2700 source sounds to explore, transform, combine, create
  your own. Each preset has four layers (mixing with xy pad) with the ability to
  mix from 2 to 144 sounds simultaneously.

  The full version of kontakt 5.6 or above is required. Not compatible with
  kontakt player. Free version: 144 patches (snapshots) and 2592 samples. 10 gb
  size on disk.
specs: |-
