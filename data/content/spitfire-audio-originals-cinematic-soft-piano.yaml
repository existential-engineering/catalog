details: |-
  The iconic LABS Soft Piano, reborn as a full Originals library. A felted upright Yamaha U3, recorded in the reverberant acoustics of AIR Studios, London. From close and intimate to reverberant and enveloping — three bespoke signals let you shape the character from a detailed close-mic'd sound, through a spacious mix of the Lyndhurst Hall acoustics, to an ethereal pad created through magnetic tape and outboard effects. Five presets and six controls to dial in your tone.

  Originals Cinematic Soft Piano requires the free Splice INSTRUMENT plugin to run.
specs: |-
  - 5 presets: Intimate, Upfront, 50 50, Afterglow, Washed Out
  - 3 signals: Close (valve mics at the hammers), Mix (Tree and Ambient arrays), Pad (through magnetic tape and outboard effects)
  - Six controls
  - 2 GB
  - Felted upright Yamaha U3 recorded at AIR Studios, Lyndhurst Hall, London
  - Requires the free Splice INSTRUMENT plugin and a free Splice account
  - macOS 12 or later
  - Windows 10 or 11 (64-bit)
