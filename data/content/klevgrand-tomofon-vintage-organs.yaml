details: |-
  The Vintage Organs Audio Model Pack is an expansion for Tomofon that brings the classic sound of electric organs to your music production, but with a new twist. Capturing a collection of vintage instruments, this pack is perfect for those seeking to add a retro feel to their tracks, but still with a creative layer on top to provide unique sonic options for your productions. Whether you're looking to create a nostalgic vibe or simply experimenting with new sounds, the Vintage Organs pack is an excellent addition to your audio library.

  This pack is ideal for a wide range of genres, including rock, jazz, blues, and funk, but due to the experimental approach of Tomofon, it doesn't end there. Overall, the Vintage Organs Audio Model Pack is a must-have for any musician or producer looking to add some classic and unique sounds to their music.

  This is an Expansion pack for Tomofon, so a separately bought Tomofon license (or the installed iOS app) is also required to use it. The Expansion Pack works both on macOS/Windows and iOS.
