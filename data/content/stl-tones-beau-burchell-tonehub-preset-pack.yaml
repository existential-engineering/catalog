details: |-
  After making his name with post-hardcore band Saosin, Beau Burchell has amassed an impressive discography as a producer and engineer, progressing from his own band's albums to records for Moose Blood, The Bronx, Gallows, Underoath, Senses Fail, Hundred Suns, Lightworker and Low Lives.

  For this pack Beau set out to put together a broad range of tones that reflect his work so far, sounds he is proud to turn to as part of his sonic tool kit on any future production.

  Beau's pack contains 77 captures.
