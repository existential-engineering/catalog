details: >-
  Sax house is a collection of 112 natural saxophone licks playable with the
  sampler exs24 (instruments) and six layout songs for apple logic pro 9 / x.


  This library is a good starting point for creating songs in house, pop and
  dance style featuring trendy sax licks (alto/tenor).


  You easily trigger the short phrases (1 or 2 bars) by MIDI notes with logic's
  sampler exs24. Take advantage of the filter section for producing filter
  sweeps by using the mod wheel.


  Exs24: 8 instruments featuring 112 audio phrases (24-bit) from a real alto and
  tenor saxophone. Key notes are eb and f. Logic songs: layout with chord
  progressions (MIDI regions) for musical inspiration. Tempo of all beats, licks
  phrases is 125 bpm.


  Styles: house, pop, dance, electronic. Bonus: 5 drum loops (wav).
specs: |-
  - 112 natural saxophone licks
  - Exs24 sampler compatibility
  - 8 instruments
  - 24-bit audio phrases
  - Alto and tenor saxophone
  - MIDI note triggering
  - Filter section with mod wheel control
  - 125 bpm tempo
  - Key notes: eb and f
  - 1-2 bar short phrases
  - 6 layout songs
  - House, pop, dance, electronic styles
  - 5 drum loops (wav)
  - Apple logic pro 9/x compatibility
