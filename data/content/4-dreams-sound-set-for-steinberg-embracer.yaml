details: |-
  dezzer music presents 128 sound presets for steinberg embracer VST instruments
  featuring the most impressive pad and string ensemble sounds with choir-,
  digi-, classic-, organ-, fantasy elements and many more that can only be made
  with this plugin.

  You find 128 perfect "ready to take" sound patches for the steinberg embracer
  VST instruments for your successful music production. All sounds with attack
  and velocity assignments.

  The sound set is usable for all music styles like: dance, trance, house, edm,
  deep house, electro pop, hip hop, film scores, soundtracks and many more.

  128 sound presets include string sounds, classic pad sounds (digi pad sounds,
  choir pad sounds, organ pad sounds, fantasy pad sounds and many more) with
  patch names included. 100% are royalty-free.

  Steinberg embracer vsti plugin version 1.0.0 or higher is required. Embracer
  vsti plugin is included in steinberg cubase/nuendo nek versions.
