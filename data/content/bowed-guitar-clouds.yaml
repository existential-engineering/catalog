details: |-
  Bowed Guitar Clouds is a cinematic morphing pad instrument running in Kontakt
  5.8 and above. It is based on recordings of bowed hollowbody electric guitar,
  bowed semi-acoustic bass, bowed acoustic guitar and bowed steel-string ukulele
  (braguinha).

  Bowed guitar clouds makes use of kontakt's aet filter technology to seamlessly
  morph between layers of sound, both tonal and non-tonal. The instrument has a
  simple gui allowing for controls for the morphing within each layer (a and b)
  as well as adjustment of balance between these layers. Other controls include
  distortion, bp filter, delay and reverb as well as three-band parametric eq.

  Bowed guitar clouds is a one-page kontakt instrument designed for ease of use
  and immediate results. Much of the appeal of our clouds engine derives from
  how it generates movement between different sample sources and groups. It
  contains two layers, a and b, each of which in turn contains a base sublayer
  and a target sublayer, I.e. Four layers in total.

  4 instruments: bowed hollowbody electric, bowed acoustic guitar, bowed
  semi-acoustic bass, bowed braguinha. 10 snapshots/presets for each instrument
  (40 in total). Sampled instruments include hoefner verythin contemporary
  hollowbody electric guitar, italia mondial semi-acoustic bass, portuguese
  steel-string ukulele (braguinha).

  Based on riot audio's proprietary clouds engine using kontakt's aet filter
  morphing capabilities. Full paid version of kontakt, v5.8.1 or higher required
  (will not work in the free kontakt player).
specs: |-
  - Kontakt 5.8 and above required
  - Aet filter technology
  - Two layers (a and b) with two sublayers each
  - Four layers in total
  - 12 layers of sound
  - 3 octave spread
  - Distortion control
  - BP filter
  - Delay
  - Reverb
  - Three-band parametric EQ
  - Lexicon reverb modelling
  - One-page Kontakt instrument
  - Clouds engine
  - Mac OS X 10.11 or higher
  - Windows 7, 8, 10
  - Intel core i5 or equivalent CPU
  - 4 GB RAM minimum
  - 1.26 GB free disk space
