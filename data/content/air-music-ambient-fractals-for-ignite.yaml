details: |-
  Engineered to capture the true essence of ambience, "ambient fractals" will twist you through the mathematics of sound, bringing you a mesmerizing selection of waveform manipulations and spaced out oscillations from the sublime side of synthesis.

  Using state-of-the-art kit like the waldorf q, access virus, roland jp8000, korg prophecy and clavia nord, prime loops' resident sound scientist dmitry vasilyev has created a full range of atmospheric elements, with leftfield noises and superwide soundclashes to expand the horizons of your productions.

  More than 250 one-hit sfx such as moving atmospheres, experimental lfo sounds, fascinating ambient chords as well as a fine selection of 20 fx loops from 90-130bpm give you all the sonic supplements to take your projects to another dimension, filling the stereo picture with awesome vibrations that will instantly stimulate your listeners' minds.

  Delivered as clearly categorised and perfectly cut 24-bit files, preformatted for all the main samplers and sequencers such as ableton live, fl studio, apple logic, steinberg cubase, sony acid and propellerhead reason, these sounds will perfectly compliment your compositions without frustrating your creative process.

  You'll find stabs, glides, blips, noises, sirens and swooshes of all kinds, suitable for a seriously wide range of genres from dreamy ambient and minimal techno to hectic dubstep and devastating drum & bass.
specs: |-
  - 24-bit audio files
  - 250+ one-hit sfx
  - 20 FX loops (90-130bpm)
  - Waveform manipulations
  - Oscillations
  - Atmospheric elements
  - Experimental LFO sounds
  - Ambient chords
  - Compatible with Ableton live
  - Compatible with fl studio
  - Compatible with apple logic
  - Compatible with steinberg Cubase
  - Compatible with sony acid
  - Compatible with propellerhead reason
  - macOS support
  - Windows support
