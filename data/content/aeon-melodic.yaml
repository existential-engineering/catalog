details: |-
  Aeon is a collection of deeply-sampled melodic instruments, cutting-edge tonal loops, and epic one-shots for the modern composer. This virtual instrument collection combines orchestral, traditional, and ethnic instruments with analog and digital synths to add a unique sound and texture to any musical composition.

  The aeon collection is comprised of two products, aeon melodic and aeon rhythmic. The instrument is based on 10,000+ samples meticulously recorded using state-of-the-art equipment, resulting in 27+ gb of source material (compressed to 13gb on disk).

  Aeon melodic contains 315 multi-sampled playable instruments comprised of 130+ organic presets, 160+ synths and hybrid presets, and 39 signature aeon hits.

  Aeon melodic by heavyocity is a virtual instrument audio plugin and a software application and soundware (samples or presets that load into other products) for macos and windows. It includes, and is therefore "powered by", kontakt player, which functions as an audio units plugin, a VST 3 plugin, an AAX plugin and a standalone application.
specs: |-
  - Kontakt player
  - 10,000+ samples
  - 27+ GB source material
  - 13gb on disk (compressed)
  - 315 multi-sampled playable instruments
  - 130+ organic presets
  - 160+ synths and hybrid presets
  - 39 signature aeon hits
