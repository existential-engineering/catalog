details: |-
  Studio Sopranos is a modern studio choir library for Pop and Soundtracks. Designed for producers & composers who desire super realistic human voices in their music. Full control over three conservatory trained sopranos, deep-sampled legato, arcs, shorts and longs & fully playable phrases. Studio Choir with emotional realism. Studio Sopranos. Four mics. Delicate or dominant. Over 300 programs. Multi-vowels. True legato. Marcato. Staccato. Dynamic arcs. Each singer recorded on her own close mic. Add the ensemble for the room. Play one voice. Or all three at once. True polyphonic legato across every note. No limits.
