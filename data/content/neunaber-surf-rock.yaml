details: |-
  Surf's up! It's time to wax the board and catch a wave! Optigan.com is proud to present Surf Rock, featuring the vintage sounds of the 1960's surf scene. For this music program disc, we've gone into the recording studio to lay down original tracks by a couple of SoCal's best surf rockers, Matt Quilter on reverb-drenched guitar and throbbing Fender bass, and Lee Kix pounding out the distinctive surf beat on drums. Reverb enthusiast Matt Quilter is one-half of the guitar assault from the award-winning Reventlos, whose quirky instro albums alternately intrigue and horrify surf music purists. For the Optigan session, he chose from his arsenal a Fender Stratocaster played through a blond Fender Tremolux and separate Fender Reverb tank, both from 1963. All this, and the "Pipeline" lick as one of the effects! Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility
