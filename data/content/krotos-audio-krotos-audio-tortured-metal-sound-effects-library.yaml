description: A sound effects library of screeching, twisted metal, friction, crunches and squeals, designed in-house at Krotos and integrated into Weaponiser and Reformer Pro presets.
details: |-
  Dive into the twisted timbres of the Tortured Metal Sound Effects Library. This expansive collection, meticulously designed in-house, is a testament to the raw power and brutality of metal sound textures when they are scratched, bent, twisted and tortured. The library offers a sound universe of beaten and maimed metal materials.

  Tortured Metal is not just another sound effects library: its sound files have also been integrated into Weaponiser and Reformer Pro presets. It encapsulates the essence of metal friction and impacts, making it a tool for sound designers working on action, horror, trailers and cinematics.

  Whether crafting scenes for a blockbuster movie or an indie project, designing sounds for in-game cinematics, or creating immersive sonic environments, the library delivers crunching, metal friction, impacts, tortured textures and cinematic aggression. Aggressive twisted metal impacts for action-fuelled tension. Slams, whooshes, impacts, risers, transitions and rumbles. Crushing and tortured metal, springs, steel, iron and destruction.

  Sound categories included in this library: Friction, Impacts, Destruction and Metal.

  The purchase contains two downloads: a zip file with all source sound effect asset files plus a metadata PDF, and an installer for the integrated Weaponiser and Reformer Pro libraries including assets and presets (iLok is required for the integration installers).
