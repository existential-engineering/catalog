description: Ten Bigroom EDM melody kits containing 99 WAV tracks of leads, chords, basses and plucks in dry and wet versions, plus 32 MIDI loops at 128 BPM.
details: |-
  'Bigroom Melody Starters Vol 1' contains 10 melody kits including WAV loops of leads, chords, basses and plucks as well as 32 MIDI loops, aimed at producers looking for melodies and ideas to start new Bigroom EDM tracks.

  The 10 melody kits are each divided into basses, chords, leads and more. The loops are ready to use and are available in both WET and DRY versions including tails.

  The included MIDI loops allow the melodies to be customised or layered with other sounds.

  The drum samples in the demo are not included in this product.
