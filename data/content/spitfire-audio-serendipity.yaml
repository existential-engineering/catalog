details: |-
  Embrace the magic of unpredictability in music making. Serendipity is your instant inspiration, a more spontaneous form of orchestration — a journey beyond routine into uncharted sonic territory. Joshua Meltzer's library offers a multi-instrument step sequencing tool, unlocking diverse styles and featuring 40 instruments ranging from Autoharp to Music Box, Kalimba to Pedal Steel Guitar. In his words, "Serendipity holds a special place in my heart," capturing those delightful accidents that lead to something beautiful.
specs: |-
  - Over 40 instruments recorded by Joshua Meltzer in his home studio
  - Multi-instrument step sequencing tool with controllable randomness
  - 15 Grid presets and 35 Pad presets
  - 3 mic signals (Telefunken Copperhead, AKG 414, Shure SM 57)
  - 4.77 GB download size
  - Minimum version Kontakt Player 6.7.0
  - Includes Kontakt Player (free download)
  - Spitfire Audio App required
