details: |-
  Bloom Bass Impulse merges an extensive array of modern synth bass loops,
  samples, and one-shots into a versatile and dynamic instrument, meticulously
  crafted to inject your tracks with low-end and tailored to fuel genres that
  demand contemporary bass sounds. From the pulsating energy of drum and bass's
  reese bass to the acid squelch of 303s, the gritty growl of distorted basses,
  the depths of sub-bass, the precision of tech, to the wobble of dubstep, this
  tool is a treasure trove for anyone looking to anchor their tracks with a
  spectrum of cutting-edge bass.

  Bloom bass impulse offers an intuitive path to finding the perfect bass sound,
  providing you with high-quality, royalty-free loops and one-shots ready to be
  morphed and manipulated. Switch between bass styles with ease, enhance their
  character with extensive effect modulation and tailor them to fit any mix with
  an array of focused processing options. Crafting the ideal bassline is now an
  intuitive and engaging process, allowing for hands-on control over sample
  triggering and sound shaping.

  Four macro controls offer instant tonal adjustments, while the edit page
  unveils detailed customisation tools, giving you complete control over sample
  manipulation, sequence creation, modulation and effects across 250 presets.
  The four innovative macro controls: sub-eq for additional low-end tone
  shaping, noise for texture, crush for sample-rate reduction, and width for
  subtle to extreme stereo expansion - steer a bespoke chain of effects,
  fine-tuned for the curated selection of bass samples that form the instrument.

  Bloom bass impulse's edit page is where you take full control over its bass
  content, allowing for the precise tailoring of the existing samples to craft
  something truly individual. In the sample edit section, modify the 14 source
  samples in each bank. Set sample start and end points, and adjust trigger
  types, playback direction and speed. Refine pitch, formant settings, and the
  envelope's attack and release, alongside setting up choke groups for dynamic
  bass interactions.

  Make the bloom instrument your own with the ability to drag and drop audio
  files into it. You can do this via the waveform view on the edit page or any
  empty slot on the banks page. Set the key and bpm of your samples to make them
  integrate seamlessly with the bloom engine.
specs: |-





  - 64-bit compatible

  - Macos 10.15 or higher

  - Intel / native apple silicon supported

  - Windows 7 or higher

  - 14 sample keys

  - 5 factory modifiers

  - 5 custom modifiers

  - 8 sample banks

  - 112 bass samples

  - Samples synced to host bpm

  - Key selection

  - Sample randomise

  - 4 macros: sub-eq, noise, crush, width

  - 5 main fx parameters: saturation, reverb, filter, lo-cut, hi-cut

  - Global bypass

  - 250 presets

  - Waveform display

  - Playback direction: forwards, backwards, pendulum, loop

  - Playback modes: hold, latch, relative

  - Playback speed: normal, double, half

  - 4 choke groups

  - Start / end markers with snap to grid, snap to transient

  - Sample crossfade, attack, release, pan, volume

  - Sample pitch, fine, formant, pitch warp

  - Sample mode for triggering sequences

  - Fx modulation: saturation, reverb, filter, lo-cut, hi-cut, pitch, velocity

  - Sample / modulation randomise

  - Phrase rate, sync, swing, steps, latch, beat retrigger controls

  - 3 rearrangable effects: saturation, filter, reverb

  - Saturation mode: tube, tape, fuzz

  - Saturation parameters: drive, dynamics, mix, feedback amount / frequency,
  tone

  - Reverb mode: plate, hall, spring

  - Reverb length, size, mix, pre-delay, duck, lo-cut, hi-cut, input, output

  - Filter mode: lo-cut, hi-cut, peak

  - Filter parameters: frequency, slope/peak gain, resonance, env amount, env
  threshold, env attack, env release, mix

  - Global lo-cut, hi-cut, tone, dry, wet

  - Daws supported: ableton live, pro tools, logic pro, fl studio, cubase,
  nuendo, reaper, reason

  - Internet connection required for authorization
