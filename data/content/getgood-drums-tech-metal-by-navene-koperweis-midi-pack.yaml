details: |-
  Navene Koperweis has been a staple of the progressive tech metal drumming scene for a very long time, and with good reason. He's one of the sickest drummers out there for the genre, but his talents and abilities don't stop there.

  Not only can he play guitar like a madman, but as a drummer, he is extremely proficient in all sorts of styles, which makes him a truly well-rounded musician and songwriter.

  And that's why his new groove pack is so awesome, it's made by a songwriter, for songwriters. With odd time, killer grooves and plenty of tasty fills this pack is the perfect complement to One Kit Wonder: Metal, and your next writing session.
