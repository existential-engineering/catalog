description: Tts Alpha Ray EDM Freepack is a powerful and versatile soundbank
  designed to bring you the sound of edm for users of tubeohm alpha-ray synth.
details: |-
  This soundbank has 2 demo kits (including MIDI files for every synth) and
  features accompanying fl studio files. Inside the pack there is text file
  showing you how to work with this soundbank in every major DAW.

  The kick drum, hi-hat and clap samples in the demos are for demonstration
  purposes.

  It requires the full version of this synth.
specs: |-
  - 12 alpha-ray presets (fxp)
  - 2 construction kits in MIDI
  - 2 fl studio .flp files
  - 2 automation screens jpgs
  - MIDI files for every synth
  - Modern trance and hard trance styles
  - Compatible with tubeohm alpha-ray synth
