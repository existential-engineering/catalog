details: |-
  Extreme Analog Synths

  The 10-Piece Analog Synth Ensemble is an enormous collection of 10 different synthesizers – recorded together in a hall with dozens of mics, combined to 5 stem mixes and separately using a blend of 10 stereo spot mics and DI signals. The end-result is an incredible alive sounding collection of analog synths recorded in a lush acoustic environment. We also recorded a variety of articulations both with and without distorted signal paths, giving you the options to create and detune your very own unique sound. The synths are singing and vibrating in ways they have never done. The basses are warmer, wider and fatter. The pads and leads are piercingly strong. It is nearly impossible to describe the depth and fidelity of our Extreme Ensemble Series.
