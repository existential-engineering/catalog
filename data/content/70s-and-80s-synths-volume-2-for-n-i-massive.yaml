details: >-
  70s and 80s synths volume 2 is a collection of 64 vintage style sounds for
  massive, by one of native instruments' own sound designers. Great care was
  taken to provide a "warmer" side to massive with subtle extra programming,
  offsetting the synth's naturally sharp character.


  All 8 macros are intelligently assigned to each patch for maximum variation
  and expression. Please note that these presets are in nmsv format only.


  For genres: 80s, analog, disco, pop, rock, electro, house, hip hop, chillout,
  soundtrack, oldschool, urban, electronic.


  Bryan 'xenos' lee has worked as a sound designer for such companies as native
  instruments, cakewalk, rob papen inspiration soundware, refx, camel audio,
  image-line and many more. He is also very active in developing his own brand,
  xenos soundworks.
specs: |-
  - 64 vintage style sounds
  - Nmsv format
  - 8 macros per patch
  - 3 arps
  - 11 basses
  - 4 bells
  - 4 brass
  - 5 fx
  - 4 keyboards
  - 11 leads
  - 4 pads
  - 7 plucks
  - 4 misc. Synths
