details: |-
  The Kickoorator Add-On transforms Rave Generator 3 into a hard-hitting kick machine. Featuring 128 powerful layered kicks, this expansion is designed for Hardcore, Hard Techno, Gabber, Industrial, and Frenchcore. Each preset is crafted using stacked samples for a unique and massive low-end impact.

  Designed for the most extreme electronic music genres (Hardcore, Hard Techno, Gabber, Industrial, Frenchcore, and more), the Kickoorator delivers 128 ultra-powerful, heavy-hitting presets built through advanced layering techniques. Each preset is crafted using stacks of meticulously selected samples, ensuring every kick has maximum impact, depth, and weight. This isn't just another kick pack, it's a full-spectrum sound design tool for producers who need layered kicks that punch through any mix.

  Requires Rave Generator 3 to use this add-on.
