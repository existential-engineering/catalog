description: Kickoorator Add-On for Rave Generator 3. Featuring 128 powerful layered kick presets, this expansion is perfect for Hard Techno, Hardcore, and Frenchcore.
details: |-
  The Kickoorator Add-On transforms Rave Generator 3 into a hard-hitting kick machine. Featuring 128 powerful layered kicks, this expansion is designed for Hardcore, Hard Techno, Gabber, Industrial, and Frenchcore. Each preset is crafted using stacked samples for a unique and massive low-end impact. Requires Rave Generator 3.

  Designed for the most extreme electronic music genres (Hardcore, Hard Techno, Gabber, Industrial, Frenchcore, and more) the Kickoorator delivers 128 ultra-powerful, heavy-hitting presets built through advanced layering techniques.

  Each preset is crafted using stacks of meticulously selected samples, ensuring every kick has maximum impact, depth, and weight. This isn't just another kick pack, it's a full-spectrum sound design tool for producers who need layered kicks that punch through any mix.

  The preset library is organised by tempo, with banks at 170 BPM and 200 BPM, and integrates directly into Rave Generator 3 so the plugin can be used as a kick-focused instrument.
specs: |-
  - 128 hardcore kick presets, from distorted industrial slams to deep, pounding bass drums
  - Stacked sample layers: each preset is built from carefully chosen layers
  - Aimed at Hardcore, Hard Techno, Gabber, Industrial, Frenchcore and SpeedCore
  - Presets organised into 170 BPM and 200 BPM banks
  - Integrates with Rave Generator 3 as an add-on expansion
  - Requires Rave Generator 3
