details: |-
  Jazz-Kit is an acoustic jazz drum kit for the OneShot sampler, and the latest addition to the OneShot library.

  Take the snare drum: in jazz it is not just about hitting it, it is about all the little nuances, rim shots, regular strokes, side stick, buzzes, and rolls. Similarly, the ride cymbal offers a spectrum of tones depending on where and how it is struck.

  Each component was recorded with plenty of velocity layers and round robins, resulting in a dynamic and musical kit. In total, Jazz-Kit delivers an authentically acoustic, highly playable drum set that captures the essence of jazz.

  "We created this pack because there just weren't any sample collections out there with this sound ideal. With this pack we bring you a jazz kit that actually sounds like a proper modern jazz kit, have a listen to the music examples and hear for yourself." – Johan Sundhage, co-founder and Lead Developer

  This is a kit for OneShot, you will also need a license of OneShot to use it (bought separately).
specs: |-
  - Requires a OneShot license
  - Acoustic jazz drum kit for the OneShot sampler
  - Snare articulations: rim shots, regular strokes, side stick, buzzes and rolls
  - Ride cymbal captured across a range of tones by striking position and technique
  - Plenty of velocity layers and round robins
  - macOS / Windows / iOS
