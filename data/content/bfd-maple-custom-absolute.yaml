details: |-
  BFD Maple Custom Absolute is an expansion for bfd3, bfd eco and bfd2
  containing a versatile Yamaha maple drumkit. Warm, refined and one of the most
  advanced kits ever made by Yamaha, the maple custom absolute is perfect for
  all genres of music, especially pop, indie, rock, jazz, classic metal, fusion
  and many more.

  A bonus reduced-detail yamaha fibreglass snare (taken from bfd signature
  snares vol.1) is also included.

  Bfd maple custom absolute is recorded in similar studio conditions as bfd
  percussion, other fxpansion yamaha-based expansions such as bfd oak custom and
  the mapleworks kits in bfd3.
specs: |-
  - Expansion for bfd3, bfd eco and bfd2
  - Yamaha maple drumkit
  - Maple kick and toms
  - Bonus Yamaha fibreglass snare
  - Kick played with 2 beater types
  - Toms played with sticks, mallets and rods
  - Bonus samples of drum cases
  - Windows 7 or higher
  - Os x 10.6.8 or higher
  - Internet connection for download and authorization
  - 15 GB for full install, 7.5 GB for medium install, 5 GB for small install
