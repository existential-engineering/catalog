name: "1970s Slingerland Classic Rock Kit - Drum Replacement Pack"
manufacturer: drumdrops
primaryCategory: sample-pack
description: The 1970s Slingerland Classic Rock Kit - Drum Replacement Pack as
  mixed by alan moulder comes with patches for slate trigger v2, drumagog 5
details: |-
  The slate trigger patch has been created using the close mic, overhead and
  room mic samples from the kit. There are samples for the kick drum, snare and
  toms. The samples in this patch have up to 16 velocity levels and six round
  robins totalling 3280 samples. The samples come in the tci format.

  The drumagog patch uses the same samples and you can choose the balance
  between the close mic, overheads and room mics. This patch uses up to 8
  velocity levels with four round robins totalling 1344 samples. We have
  included samples for the kick, snare, toms and hi-hat. If your version of
  drumagog contains the auto hi-hat tracking feature then the samples will
  follow the opening and closing of the hi-hat. The samples come in the gog
  format.

  The drumxchanger patch contains stereo mixed samples (a combination of the
  overhead, room and close mics samples). This patch contains eight velocity
  levels with no round robins totalling 82 samples. The snares also contain a
  rimshot sample that have their own adjustable trigger threshold. The samples
  come in the splx format.

  The slingerland kit was recorded in miloco's the pool by drumdrops engineer
  ben thackeray and mixed in assault and battery 1 by alan moulder. Alan is
  britain's premier alternative rock producer / engineer working flat out in the
  uk and usa since the 1980's.
specs: |-
  - Slate trigger v2 patches

  - Drumagog 5 patches

  - Drumxchanger patches

  - 24" kick drum

  - Five toms (12", 13", 14", 15" rack toms, 18" floor tom)

  - 14" x 7" slingerland radio king snare drum

  - 14" zildjian new beat hi-hats

  - Zildjian k custom 22" ride

  - Zildjian k dark thin 18" crash

  - Zildjian vintage cie 16" crash

  - Slate trigger: up to 16 velocity levels, six round robins, 3280 samples, tci
  format

  - Drumagog: up to 8 velocity levels, four round robins, 1344 samples, gog
  format, auto hi-hat tracking feature

  - Drumxchanger: eight velocity levels, no round robins, 82 samples, splx
  format, rimshot samples with adjustable trigger threshold

  - Close mic, overhead, and room mic samples

  - Drum replacement software compatibility
