description: Mix-ready one-shot drum samples from Swedish metal producer Daniel Bergstrand, whose credits include Meshuggah, In Flames, Behemoth, and Soilwork.
details: |-
  Drumshotz Daniel Bergstrand collects the favourite one-shot drum samples of Swedish metal producer Daniel Bergstrand, drawn from more than two decades working at the forefront of metal production with bands including Meshuggah, In Flames, Behemoth, and Soilwork.

  The pack covers kicks, snares, and tom sets, and is aimed at engineers who want Bergstrand's drum character without further processing. The samples are designed to be blended with existing sample libraries or raw drum recordings, or used as outright replacements.

  More than 40 samples are supplied at 24-bit / 44.1 kHz for use with any drum triggering program or DAW.
specs: |-
  - 40+ one-shot drum samples
  - 24-bit / 44.1 kHz format
  - Includes kicks, snares, and tom sets
  - For use with any triggering program or DAW
