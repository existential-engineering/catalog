description: "Swedish metal producer Daniel Bergstrand, known for work with Meshuggah, In Flames, Behemoth, and Soilwork, brings his signature one-shot drum samples crafted from his favorite collection built across years at the forefront of metal production."
details: |-
  Drumshotz Daniel Bergstrand is a one-shot drum sample collection curated by legendary Swedish metal producer Daniel Bergstrand. Bergstrand has spent decades working with some of the most influential acts in modern metal, including Meshuggah, In Flames, Behemoth, and Soilwork, giving him a uniquely refined ear for drum sounds that cut through dense mixes.

  The pack delivers 40+ samples across kicks, snares, and tom sets — all drawn from Bergstrand's personal collection of preferred drum sounds accumulated over his career. Every sample is provided in WAV format at 44.1 kHz / 24-bit, ensuring professional-grade fidelity straight out of the box.

  The samples are designed for use with any drum triggering program or DAW, making them a versatile drop-in resource for metal producers working in any environment. The purchase includes a perpetual license, free lifetime updates, and unlimited customer support.
