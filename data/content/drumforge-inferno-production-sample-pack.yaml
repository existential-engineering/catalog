description: A 414-sample royalty-free production pack from composer and sound designer David Levy, collecting ambient tension beds, hybrid impacts, bass synths, mangled loops, and distorted synth elements.
details: |-
  Drumforge Production Packs are collections of sounds such as atmospheres, impacts, basslines, and loops, aimed at composers, songwriters, producers, and mixers working on games, film, and music.

  Inferno was created by composer, sound designer, and producer David Levy, whose credits include Doom Eternal (The Ancient Gods), RWBY, gen:LOCK, and Red vs. Blue. The pack collects mix-ready samples, synths, and loops inspired by his work on Doom Eternal The Ancient Gods and other games, built with his own hardware and sound design tools.

  The material spans ambient tension elements for building dread, crushing hybrid impacts for driving intensity, and mangled loops and distorted synths for raising the energy of a production. All 414 samples are supplied in 44.1 kHz 24-bit WAV format, for use in any DAW, and are royalty free.
specs: |-
  - Sample, loop, and sound collection from Composer/Sound Designer/Producer David Levy (Doom Eternal, RWBY, gen:LOCK, Red vs. Blue) for sound design, video games, and music production.
  - 414 samples total in 44.1 kHz, 24 bit WAV format.
  - 11 Ambient Tension
  - 150 Bass Synths
  - 29 Dirty Kicks
  - 39 Heavy Synth Pulses
  - 8 Hi Hats
  - 82 Hybrid Impacts
  - 5 Hybrid Snares
  - 21 Mangled Loops
  - 20 Rhythmic Synths
  - 5 Shepards Tones
  - 44 Synth Sub kicks
  - Royalty-free, for use in any DAW
