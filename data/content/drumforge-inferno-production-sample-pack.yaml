description: FEATURES Sample, loop, and sound collection from Composer/Sound Designer/Producer David Levy (Doom Eternal, RWBY, gen:LOCK, Red vs. Blue) for sound design, video games, and music production.
details: |-
  Inferno is a production sample pack from Composer/Sound Designer/Producer David Levy, whose credits include Doom Eternal (The Ancient Gods), RWBY, gen:LOCK, and Red vs. Blue. The pack delivers 414 mix-ready samples, synths, and loops at 44.1 kHz, 24-bit WAV for use in any DAW.

  Created with David's favorite hardware and sound design tools, the pack gives you the sound of big-budget productions. It includes terrifying ambient tension elements, crushing hybrid impacts, mangled loops, distorted synths, and more — tools for creating intense, aggressive music for video games, film, and music production.

  All 414 samples are royalty-free and compatible with any DAW. Includes an instant digital download with perpetual license and free lifetime updates.
specs: |-
  - 414 total samples
  - 44.1 kHz, 24-bit WAV format
  - 11 ambient tension samples
  - 150 bass synths
  - 29 dirty kicks
  - 39 heavy synth pulses
  - 8 hi hats
  - 82 hybrid impacts
  - 5 hybrid snares
  - 21 mangled loops
  - 20 rhythmic synths
  - 5 Shepard's tones
  - 44 synth sub kicks
  - Royalty-free license
  - Instant digital download
