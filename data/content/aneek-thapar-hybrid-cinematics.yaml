details: |-
  Soundtrack Loops presents hybrid cinematics. Uk composer/sound designer aneek
  thapar has deep tendrils in modern music production that span app coding,
  instrument preset development, composition, mixing, remixing, and mastering.

  With one foot rooted in the isolationist movement that informed certain
  ambient artists of the mid-90s, we quickly branch out into warmer and
  friendlier skies—think fire and ice: the cold: subaquatic and crunchy
  electronic kicks, frenetic patterns, squelch loops and sheet metal textures,
  electro-acoustic static. The warm: dreamy, accessible minor-key piano figures,
  plush arpeggios, and of course the appropriate pads—contemporary cross-genre
  elements made with simple melodies and clean embellishments.

  High-contrast building blocks are a core feature of hybrid cinematics, and
  this contrast is present in all its components, ambient, rhythmic, melodic,
  and percussive. Dry and processed counterpart files are included for
  calibrating distance and atmosphere.

  76 loops and 27 percussion one-shots comprise hybrid cinematics, a flexible
  kit for creating alienated tracks with disquieting tension and strangeness, as
  well as smoother tracks with warmer textures and more accessible feels.
