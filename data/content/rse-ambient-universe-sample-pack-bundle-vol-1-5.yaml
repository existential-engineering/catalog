details: |-
  Ambient universe is a sample pack compilation that takes us out to the
  infinite space of the universe. Enjoy a trip to infinity with 500 relaxed and
  spherical sounds. Each sound is 100% original and custom sound designed and
  programmed from scratch using hardware and/or software.

  The sounds are atmospheric pads and soundscapes and are all key labelled.
  There are five volumes contained in the bundle, which can be bought together
  to save 30% off. Each sample pack is also available separately.

  The samples are key labelled, denoting which key it is in and whether it is
  maj or minor. There are 58 minor pads/soundscapes and 45 that are major. All
  samples are volume normalized. (they won't clip and have equal volume levels).

  All wav samples are entirely unique sound creations, created from scratch from
  various software and hardware synthesizers by touch the universe. No
  installation required and is compatible with all daws. 100% royalty free. You
  are free to use the samples as you see fit.
specs: |-
  - 500 wav samples
  - 24-bit
  - 48khz
  - 5gb uncompressed
  - Key labelled
  - 58 minor pads/soundscapes
  - 45 major pads/soundscapes
  - Volume normalized
  - 100% royalty free
  - Compatible with all DAWs
  - No installation required
