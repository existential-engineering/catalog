details: |-
  'Sylenth1 Essentials Vol 7: Slap House' from baltic audio comes along with loads of brand new unique sounds for your next Slap House tune. You'll find 64 top-quality presets for the well-known Sylenth1 synthesizer.

  Each preset is perfectly programmed by a professional sound designer and every parameter tweaked with passion and detail and will be your essential source for creating new and commercial sounds within your compositions.

  You can also use it for genres like Future House, EDM, Bass House, Pop and more.

  In addition, you'll find 42 MIDI files taken from the demo.

  Please note:
  The drums and some FX used in the demo are not included in this product. These presets require v. 3.06 or higher of Lennar Digital Sylenth1.
specs: |-
  - 64 Presets for Sylenth1
  - 17 Basses (Presets)
  - 12 Plucks (Presets)
  - 10 Lead (Presets)
  - 4 Pads (Presets)
  - 4 Synths (Presets)
  - 4 Keys (Presets)
  - 4 Arps (Presets)
