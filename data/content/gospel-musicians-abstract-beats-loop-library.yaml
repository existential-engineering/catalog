description: A collection of ten urban-style drum loops featuring ethnic
  percussion elements, with tracks separated into individual parts and available
  as Apple Loops.
details: |-
  Abstract Beats was mean to challenge you as a musician. As a drummer you are use to using a lot of shakers and hi-hats to keep you on beat, but these "abstract-beats" are different and unique. They have a lot of ethnic instruments in them and are very urban. The drum loops are very hot and sure to keep you stimulated as we know you are sick of hearing the same things over again. Each track is separated into it's different parts so that you can remove or add different drum elements as you wish. More importantly, the tracks are also available as Apple Loops, so you can change the tempo as you wish.
