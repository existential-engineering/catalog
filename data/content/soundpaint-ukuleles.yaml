details: |-
  Two Is Better Than One

  We deep-sampled two exquisite Ukuleles, capturing the beautiful tone of these warm instruments. Both Ukuleles were deep-sampled as solo Instruments with sustains, palm mutes, tremolo and many other techniques. We also deep-sampled the 13 most common chord types with 127 dynamic velocity layers and extensive round robin. How can such tiny instruments pack such a wide range of sounds and fully embrace the human element? The possibilities begin and end with your imagination. Strums, 5th chords, power chords, and everything that you need to create a beautiful ukulele track exist right out of the box. By combining strums with sustains, an ambient soundtrack is easily in the making. Add a touch of reverb, and there is bowed magnificence at your disposal, such grandeur and eloquence. The almost harp-like and clear resonance of a naked sample is great for accompaniment as well as solo pieces -- the kind that bare the soul. Navigate the entire emotional spectrum with this outstanding and original bed of sound.
