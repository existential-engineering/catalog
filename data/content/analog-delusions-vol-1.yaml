details: |-
  Sick Twisted Minds studios provides a new array of custom sounds created for
  steve duda and xfer records revolutionary new synthesis platform, Serum.
  Containing 64 professionally produced and irreplaceable analog sounds that
  layer together seamlessly, this pack brings unique harmonic warmth to any
  composition.

  Analog delusions is a massive collection of varied wavetables that are
  processed with high end plugins by masterful audio engineers. Made for one of
  the most intuitive and refreshing vsts in electronic music production, this
  revolutionary pack will help you find the old-school sound that you've been
  searching for.

  Includes: 69 wavetables (64 analog plugin processed, 1 sine, 1 triangle, 1
  square, 1 saw, 1 vip tables, watch walkthrough for more info). 320 waveframes
  (64 sine, 64 triangle, 64 square, 64 saw, 64 vip). 25 universal presets with
  wavetable doubling. 10 ableton rack presets with wavetable quadrupling. 4 MIDI
  files used in demos. Instruction guide and sound design guide. Bonus: presets
  used to treat tables in proprietary and ableton AU format.
