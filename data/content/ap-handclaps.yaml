details: >-
  Ap handclaps is a kontakt based sample library that makes it easy to create
  great sounding handclap parts for your tracks and composition work. The ap
  handclaps kontakt instrument has a variety of 5 different handclaps, in both
  stereo and mono. Each clap sound has 8 round robin samples for a natural
  sound.


  The five different handclaps each have a unique tone, they include standard
  handclaps, cupped hand claps, finger to palm hand claps, finger claps and
  wrist claps (for a low frequency hit). In addition, there are groupings of
  handclaps, ranging from 1 clap up to 32 claps.


  It's easy to play and perform a handclap part with this library. Just choose
  the desired group for any particular song, and then play and record any or all
  of the five handclap sounds in mono, stereo or even both. You can also use key
  switching to have the size of handclaps shrink and grow within the song.


  The mixer includes a variety of controls for mixing and shaping the sound.
  Controls include volume, pan, pitch, reverb and individual levels for each
  handclap grouping. The handclaps are divided up into groups of 1, 4, 8, 16 and
  32 claps. You choose the grouping via 5 keyswitches on c1 (1), d1 (4), e1 (8),
  f1 (16) and g1 (32).
specs: |-
  - Kontakt based sample library
  - 5 different handclap types
  - 8 round robin samples per clap type
  - Stereo and mono samples
  - Groupings of 1, 4, 8, 16 and 32 hand claps
  - Keyswitch selection for 5 groupings
  - Individual mix controls: volume, pan, pitch and reverb
  - Master eq with hi, mid and low controls
  - Convolution studio room impulse response (ir) reverb
  - Text display for currently played clap group keyswitch
  - Text display for currently played clap sound
  - Signal indicator for each mixer channel
  - Reverb send control per channel
  - Master reverb return control
  - Reverb return mute button
  - Full version of kontakt 5.8.1 or later required
  - Macos and windows compatible
