details: |-
  Lance Prenc is a Melbourne-based producer and mix engineer who has quickly become one of modern metal's most in-demand names, creating distinctly unique, loud, and extremely heavy records. Coming up through the Australian underground scene and starting out as a front-of-house engineer, he is the go-to mixer for Alpha Wolf, Polaris, Thornhill, Void of Vision and Dealer, and has earned a reputation as one of the most technically proficient and impactful mix engineers in the genre.

  This expansion pack has been engineered by Lance Prenc to bring maximum impact to your mixes.

  Unmatched with attention to detail and consistency, the signal chains captured in this expansion pack are Lance's go-to tools to achieve bold and focused mixes. Precisely engineered starting points for individual elements, like metal and thumpy rock kicks, to grinding or clean bass treatments to sit the low-end perfectly in your mix. Also included are his bus signal chains, where he takes an unorthodox approach to mix bus processing, which all sums up what makes a Lance Prenc mix so powerful.

  This expansion pack has a total of 105 captures.
