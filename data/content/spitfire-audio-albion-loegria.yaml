description: A classic in the Spitfire catalogue, an all-in-one composer tool designed to inspire and create beautiful, detailed music. This volume encompasses an expertly sampled chamber-sized orchestra, featuring strings, woods, brass and cinematic drums, alongside eclectic loops and an inspiring organic synth.
details: |-
  Presented as an all-in-one composer tool, Albion Loegria encompasses an expertly sampled chamber-sized orchestra featuring strings, woods, brass and cinematic drums, alongside eclectic loops and an inspiring organic synth. The perfect starting point for independent films, period dramas, or more cerebral and intimate music: recorded at the legendary AIR Studios, Lyndhurst Hall, Albion Loegria is a one-stop-shop for media composers, students wanting to break into media music, or the building blocks for a fine orchestral setup.

  The Loegria Sessions were captured at AIR Studios, Lyndhurst Hall, through the finest and rarest vintage valve and ribbon microphones onto 2" tape. Every patch is available with four way mic control and all shorts patches work with the enriching Ostinatum feature, across a mixture of true legato, longs and shorts patches. The strings sound set was captured as High and Low Ensembles, concentrating on an array of comprehensive extended techniques in addition to its standard long, short and legato sets: tremolando patches, trills, harmonics, flautando, light col legno and a variety of shorts patches. In addition to the full section, full longs and legatos are duplicated with a smaller half section band.

  The brass range concentrates on the true beauty of traditional British brass sections and their heart-wrenching choral qualities, with two ensembles: a bank of euphoniums and horns, and the more ancient but no less moving sackbut choir. The wind section concentrates on the beautiful simplistic qualities of traditional wooden recorders, adding a choral-like addition to the string section.

  The Byron Tapes provide an inspiring place to start any new indy cue: a comprehensive selection of rhythm loops inspired by a popular keyboard instrument from the 60s and 70s, with a variety of mix settings including one via a line mixer owned and used by Jimi Hendrix. Darwin Percussion offers another selection of thundering cinema style drums with five round robins, five dynamic layers and more hits, recorded and edited in tight and loose versions. Fenton Reversers are reverses derived from the Albion range and locked into host tempo, many of them controllable by the mod wheel.

  Stephenson's Steam Band takes the orchestral elements found within the library and warps them beyond recognition, creating a sparkling and rich set of pads, drones and atmos with two-way mic control and modulation control. The interface offers an overview panel showing all available playing techniques with a simple microphone mixer, a general controls panel for in-depth control and purging techniques from memory, and the Ostinatum pattern sequencer for instant ostinato creation.
specs: |-
  - All-in-one chamber-sized orchestra: strings, woodwinds, brass and cinematic drums
  - 4 mic signals: Close, Tree, Ambient, Outrigger
  - Recorded at AIR Studios, Lyndhurst Hall through vintage valve and ribbon microphones onto 2" tape
  - Includes Kontakt Player (free download)
  - Kontakt Player 5.6.8 or higher required
  - Spitfire Audio App required for installation
  - The Ostinatum pattern sequencer, works with all shorts patches
  - Strings captured as High and Low Ensembles, plus half-section longs and legatos
  - Extended string techniques: tremolando, trills, harmonics, flautando, col legno, con sord, pizzicato
  - True legato, longs and shorts patches throughout
  - Brass: euphonium and horn bank plus sackbut choir (Horneuph, Sackbuts Hi/Lo)
  - Woodwinds: traditional wooden recorders (Recorders Hi/Lo)
  - The Byron Tapes: 13 tempo-locking rhythm loops (Bossa Nova, Swing, Freestyle patterns)
  - Darwin Percussion Ensemble II: 5 round robins, 5 dynamic layers, tight and loose versions
  - Fenton Reversals: host-tempo-locked reversed orchestral material with mod wheel control
  - Stephenson's Steam Band II: pads, drones and atmos with two-way mic control
  - 35GB installed
  - 170GB disk space required during install
  - macOS 11 to macOS 26, Intel and Apple Silicon/ARM supported (Kontakt 8.8 requires macOS 14 minimum)
  - Windows 10 or Windows 11 (latest service pack, 64-bit)
  - Minimum: 2.8GHz quad-core Intel i5 or AMD Ryzen 5, 8GB RAM
  - Recommended: 2.8GHz six-core Intel i7 or AMD Ryzen 7, 16GB RAM
  - 32-bit systems are not supported
