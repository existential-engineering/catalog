details: |-
  64 presets for the Reveal Sound Spire synthesizer, aimed at current Melbourne Bounce and EDM, including hand-crafted basses, leads, plucks, pads, synths and FX.

  Each preset is programmed by a professional sound designer, with every parameter tweaked in detail, as a source for creating new and commercial sounds within a composition.

  The pack can also be used for genres like Future House, Progressive House and Dance.

  In addition, 45 MIDI files taken from the demo are included.

  Please note: the drums, some instrument loops and FX used in the demo are not included in this product. They are found together in 'Melbourne Monkeys Vol 3'. These presets require v1.1 or higher of Reveal Sound Spire.
specs: |-
  - 64 Presets for Spire
  - 24 Leads
  - 15 Basses
  - 10 Synths
  - 5 Pads
  - 5 FX
  - 5 Plucks
  - Modwheel Assignment
  - 45 MIDI Files
  - Multi-genre
  - PC/Mac Compatible
  - 100% Royalty-Free
  - Requires Reveal Sound Spire v1.1 or higher
