details: |-
  Instant, Playable Emotions

  Emotional Guitars comprehensively captures the entire range of human emotions, featuring 32 unique guitars, each conveying a specific feeling. Just like its sister instrument, Emotional Guitars Multi , the inspiration for this collection comes from Plutchik's Wheel, a visual tool used to depict how emotions are interrelated. Following this guide, we enlisted the talents of a single musician to handcraft each emotion using only guitars. The outcome is a formidable tool for scoring scenes that require emotional impact. Emotional Guitars offers the flexibility to create simple underscores or complex soundscapes that evolve between various emotional textures. The Pads edition features dozens of intricate, evolving pads for each of the 32 emotions. In Soundpaint, you can unlock new sonic realms by blending and morphing emotions. The possibilities are limitless, enabling you to create a personalized and unique emotional experience for your audience. Why settle for generic soundscapes? Elevate your music with the genuine human emotion and authenticity of Emotional Guitars.
