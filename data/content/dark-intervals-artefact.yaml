details: |-
  Artefact is a toolkit based on ambient pads, ambient motions and various
  sequences and textures designed as an ambient bed for exotic, meditational and
  similar sonic journeys.

  When you purchase artefact, you receive two folders: artefact-ambient
  cinematic toolkit and artefact-textures and pads. Folder 1 contains 4
  categories of instruments: ambient motion (27), textures and pads (31),
  ethereal experiments (25), guitar wonderland (15), and multis (20). Folder 2
  contains textures and pads (30) and ethereal experiments (25).

  In both folders, the categories textures and pads and ethereal experiments
  contain the same sounds but are mapped in different guis. The first folder gui
  uses time machine pro playback mode, which may result in voice choke when
  playing complex harmonies on some pad sounds. The second folder uses dfd
  playback option, which provides a much larger number of voices.

  Full kontakt 6.3.2 or higher is required. The free kontakt player is not
  supported. 4gb of ram or more is highly recommended, and at least 5.5 gb of
  hard disc space is required.
specs: |-
  - Kontakt 6.3.2 or higher required
  - 48000 kHz, 24-bit quality
  - 98 instruments
  - 20 multis
  - Time machine pro playback mode
  - Dfd playback option
  - 5.5 GB unzipped size
  - 4gb RAM minimum recommended
  - 5.5 GB hard disc space required
