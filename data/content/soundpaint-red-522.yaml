details: |-
  The Modern 808

  The 522 is one of the rarest analog drum machines around, but it began gaining mainstream attention when artists like Nils Frahm, KiNK and the Scandinavian band Minilogue. It sounds like a truly modern 808, and in a strange sense, this drum machine may be destined for a similar fate. Unknown and misunderstood in the beginning, the 522 would be rediscovered as a timeless masterpiece of the new century... if we had our way. We ultra deep-sampled a pristine 522 through over $30,000 of the warmest and punchiest analog outboard gear around, to ensure that this amazing drum machine was captured in super-realistic perfection. The 522 was deep-sampled 24 times through a variety of different pro studio signal chains, each engineered to highlight the natural nuances found in the soul of this machine. These run the gamut from dry to warm to fuzzy and even crunchy. From perfectly punchy to boldly bright, the Soundpaint Red 522 offers you the best possible modern analog drum experience!
