name: 60s Motown Drops
manufacturer: drumdrops
primaryCategory: sample-pack
description: 60s motown drops features 30 drum tracks inspired by the 60s motown
  records sound, engineered, performed and produced by timmy rickard.
details: >-
  60s motown drops features 30 drum tracks inspired by the 60s motown records
  sound, engineered, performed and produced by timmy rickard. This album takes
  its inspiration from the sound of the 1960's detroit era of motown records,
  when the 'funk brothers' were the main musicians behind this pioneering sound
  and style. This release is influenced by artists such as the four tops, the
  temptations, marvin gaye and gladys knight and the pips.


  Recorded in a large live room at livingston 1 studio in london, the room was
  mic'd up as if there was a full motown band in the room brass section, vocal
  mic, talkback mic and then two mics on the kit a kick, and a kit mic placed
  above the bass drum, between the rack toms and below the ride. For customers
  that purchase the multi-tracks you will have the audio from each microphone in
  the room so you can mix the sound exactly as you want it.


  All of the tracks were recorded on to a 16 track studer a80 2" tape machine
  and then transferred to pro tools for mixing and editing. The drum tracks were
  mixed in livingston 2 on a custom series cs75 console powered by neve which is
  a modern desk based on vintage neve technology. Included in the stems is an
  emt plate reverb stem used on some of the drum tracks.


  All thirty tracks can be purchased as individual tracks as multi-tracks
  (unmixed), stems (mixed) or drum loops (locked fills and grooves). The
  multi-tracks (which are made up of a combination of all room mic positions)
  come with a tempo map and omf file to export into other DAW. We also provide
  patches for pro tools, logic, cubase, reason, reaper, studio one and ableton
  live and the audio as 24-bit wavs.


  The stems and mix packs which have all the drum parts and percussion as
  separate stems come as 24-bit wavs, they also come with a tempo map. The packs
  also include locked to the beat song construction loops. All of the mixes have
  been mixed in mono. The loop packs contain as many 2 bar locked to the beat
  grooves we can get from each track. The loops come as fills or grooves. They
  come formatted as 24-bit wavs, apple loops and rex 2 files.
