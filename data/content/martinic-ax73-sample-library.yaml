details: |-
  An extensively multi-sampled Kontakt instrument with 32 high-end presets from
  the vast collection of over 1000 presets available in the ax73 collections.

  It includes presets from sound designers mark gijsman, simone c, sonic freaks,
  saif sameer, summa, sb-six, theo niessink, jack, daniel stawczyk, heat audio,
  nori ubukata, lukas lundh, allert aalders and solidtrax.

  The ax73 sample library instrument isn't just a faithful recreation of the
  martinic ax73 plugin. We've also added eight post-synth effect units that
  mimic the fx chain in the martinic ax73, giving you even more versatility and
  flexibility in your sound design.

  Designed for kontakt 6.5.3+ full retail version (not for kontakt player).
specs: |-
  - Kontakt 6.5.3+
  - Full retail version
  - Multi-sampled Kontakt instrument
  - 32 high-end presets
  - Eight post-synth effect units
  - macOS and Windows
