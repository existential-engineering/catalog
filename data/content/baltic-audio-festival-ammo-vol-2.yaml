details: |-
  'Festival Ammo Vol 2' from baltic audio contains one-shots, MIDI and loops for EDM at 128 BPM.

  The MIDI files can be combined with a sampler to trigger the key-tagged one-shots, or used with any synth.

  Vocal loops, synth loops and bass loops in WAV and MIDI formats are included, along with drum and percussion samples, FX and vocal, bass and synth shots.

  The pack is also suited to producing the Melbourne Bounce genre.
specs: |-
  - Over 230 MB of content
  - 28 MIDI files tagged with the perfect key included
  - 63 Loops tagged with the perfect key included
  - 56 one-shots: Drums, FX, Synths & Vocal Shots included
  - 44.1khz/24-Bit WAV
  - PC & MAC compatible
  - Perfectly for 128 BPM
  - Most sounds tagged with the perfect key
  - Mostly unlooped tails
  - Dry & Wet versions for many files included
