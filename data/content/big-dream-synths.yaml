details: >-
  Big dream synths is a collection of 80 new channel strip settings
  (instruments) and 15 user wavetables for apple logic x (version 10.4 or
  newer). You get a musical tool pack for producing electronic pop music.


  This library is offering deep, spacey and warm synthesizer parts with apple
  logic x. Over 80 new sounds are featuring the new reverb plug-in chroma and
  the new filter types of retro synth (available since version 10.4).


  There is a wide range of sound variation by using analog, fm and wavetable
  synthesis.


  Big dream synths gives you many fantasy sounds (pads, collages, leads and
  arps) with a high playability for working live and in the studio.


  80 channel strip settings featuring pads, compings, lead and arp synths
  (analog, fm, wavetable). 15 user wavetables for retro synth. Styles: chillout,
  ambient, pop, electronic. Bonus: 20 MIDI demo phrases (logic song).
specs: |-
  - 80 channel strip settings
  - 15 user wavetables
  - Analog synthesis
  - Fm synthesis
  - Wavetable synthesis
  - Chroma reverb plug-in
  - Retro synth filter types
  - MIDI demo phrases
  - Apple logic x version 10.4 or newer
