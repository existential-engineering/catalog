details: |-
  Atelier series anthem choir is the first legato choir library produced for
  non-traditional settings, including pop, rock and big anthemic genres. We had
  a very specific sound in mind which we felt could only be achieved by bringing
  in folks who could sing but didn't necessarily do it professionally. From
  people who used to perform in bands, karaoke enthusiasts to aspiring vocalists
  and members of the local church choir the resulting sound and performance is
  truly unique, raw and very human.

  The brief given to the studio singers was to stay in their chest voice
  throughout their entire range while properly belting out non-vibrato
  performances. Not an easy task! Plenty of kudos, beer and laughter was
  exchanged. Truly a workhorse choir library with considerable utility if you
  need crowd vocals with power, agility and no shortage of humanity and vibe.

  Patches include: studio legato women, studio legato men, church legato women,
  church legato men, studio ensemble sustains, church ensemble sustains, body
  percussion, mural keyswitch women, and mural keyswitch men.

  Oftentimes during the research and experimental phase of development, we'll
  create instruments that don't necessarily belong to a bigger, themed release.
  Instead of attempting to shoehorn them into a future release or trying to
  construct a comprehensive product around it, we decided to create the atelier
  series so that other composers can enjoy our explorations in sample
  development as well.

  Receive watermarked product by connect downloader.
specs: |-
  - Legato choir library
  - Requires Kontakt 5.8.1 or higher
  - Free Kontakt player not supported
  - Recorded in 48khz / 24-bit
  - 1.3 GB compressed ncw format
  - Performed by 18 women & 18 men
  - Four different groups recorded in studio and church
  - Raw, powerful non-vibrato performances
  - Two different attack types (standard and whoa)
  - Two ethereal sustains keyswitch patches
  - Adjustable reverb of custom hall impulse
  - Soundware for macOS and Windows
