details: |-
  In this 4-volume series, sound designer Ron MacLeod expands upon his previous work by producing a continuing series of inspirational sonic collections, utilizing the innovative processing tools from Cycling '74. Each Cycles download has separate 44.1kHz / 48kHz folders. The files are stored in 24-bit FLAC format.

  Unnatural Rhythm features extended form (4 to 32+ bar) non-drum alternative groove loops of mechanical, electronic, found sound and algorithmic origins. The loops titles include sample accurate BPM notation with longer loops Bar Count noted as well. This volume also includes 24-bit REX formatted versions of all applicable files for use in Reason or any 24-bit REX compatible audio sequencer. Also included is a huge collection of hard-syncopated electronic source culled from a collection of 70s-era Buchla and Serge Modular systems.

  Content categories: Back Alley Tribal, found object industrial gamelan. Contraptions, pounding machines of real and synthesized derivation. Cyclic Waves, oscillating undulations for a less obvious rhythmic character. Found Sound, heavily processed real world appropriations. Grooves, beat oriented pulsations with extra groove. Vintage Electronics, a huge collection of hard-syncopated electronic source culled from a collection of 70's era Buchla and Serge modular systems. X-tended Versions, long extended versions, some up to 96 bars, of select loops from all the categories, processed, filtered and continually developing, mixed to resolve back to the intro for transparent loop repetition.

  The file format is designed for maximum convenience: it contains multiple sample rates for quick multiple format support (48kHz and 44.1kHz), uses 24-bit samples to preserve quality and robustness when doing further processing. Rhythmic samples include 24-bit REX format files, and all samples are end-to-end looped for easy use in sequencers or looping applications such as radiaL, Live, Acid or GarageBand. The organization of each library has been distilled to the natural essence of the content, with filenames deliberately left open rather than pre-defined so the material reads as inspirational rather than as a fulfillment tool.

  The index is a simple and direct document for fast referencing of vital data relevant to the content of each library, including file length, loop data, BPM and pitch (if applicable), supplied in both PDF and Excel format for easier integration into sound file databases. The files on Cycles releases can be used freely by the purchaser, other than inclusion in other sound libraries, without any additional royalties or usage fees. Because of the nature of some of the longer files, they cannot be used as a stand-alone piece represented as the purchaser's original composition.
