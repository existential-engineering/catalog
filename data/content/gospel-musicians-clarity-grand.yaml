details: |-
  Introducing the Clarity Grand —the ultimate piano VST plugin that redefines the balance between warmth and clarity. This meticulously crafted grand piano sound library is designed to stand out in any mix, whether you're producing lush ballads or dynamic, high-energy compositions. With Clarity Grand, you no longer have to choose between a rich, resonant low-end and a sparkling high-end presence. We've perfected the art of creating a piano sound that offers depth and warmth without the muddiness, and clarity without the harshness.
