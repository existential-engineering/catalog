details: |-
  The kit contains 5 construction kits with one shot drums and mp3 files +
  bonuses - kontakt presets, sylenth1 and fl studio presets. Suitable for
  genres: trap, rnb, hip hop, house, dirty south, edm.

  The kit includes 5 construction kits: boss_172_bpm (26 *.wav files, 1 *.mp3),
  round_82_bpm (18 *.wav files, 1 *.mp3), champ_142_bpm (44 *.wav files, 1
  *.mp3), best_118_bpm (48 *.wav files, 1 *.mp3), and good_144_bpm (17 *.wav
  files, 1 *.mp3).

  One-shots include 20 basses, 19 kicks, 34 percussions, and 42 snares in *.wav
  format. Bonus presets include fl studio mixer presets (10 *.fst files),
  kontakt presets (10 *.nki files and 260 *.ncv files), and sylenth1 presets (10
  *.fxp files).
