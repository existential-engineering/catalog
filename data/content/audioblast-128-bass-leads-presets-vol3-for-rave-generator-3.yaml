details: |-
  128 Bass & Leads Presets Vol. 3 for Rave Generator 3 is a sound bank designed for producers searching for aggressive basslines, nostalgic rave textures, futuristic FX, powerful leads, and classic stabs.

  Built exclusively for Rave Generator 3, this third volume expands the series with a fresh collection of presets inspired by oldschool rave, hard techno, trance, acid, hardcore, and underground electronic music. Every sound has been designed to fully exploit the layered engine and gritty character of Rave Generator 3.

  The bank contains 128 presets in total: 31 bass presets, 31 FX presets, 21 lead presets and 45 stab presets. The focus is on instantly playable presets that work for Hard Techno, Rave, Oldschool Techno, Acid Techno, Trance, Hardcore, Industrial and underground electronic music.

  From distorted rave stabs and rolling basses to atmospheric FX and sharp leads, Vol. 3 brings a darker, harder, and more modern edge to the series. It follows 128 Bass & Leads Presets and 128 Bass & Leads Presets Vol. 2, introducing more aggressive textures, cinematic FX and crunchy rave stabs while preserving the authentic 90s rave spirit.
