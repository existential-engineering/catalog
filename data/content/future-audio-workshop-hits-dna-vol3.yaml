details: |-
  The sound of the 808 sub-bass is everywhere and the style is extremely varied, from smooth and punchy to crunchy and buzzy, long glides and short bumps.

  You get 15 painstakingly recreated 808 subs off tracks from Travis Scott, Pierre Bourne, Rick Ross and more.

  The pack was sound designed by I'm A Music Mogul, whose track breakdown tutorials are on YouTube.

  All of FAW's patch packs are NKS ready for Maschine and Komplete Kontrol. Once your purchase is complete, the pack will show up in your FAW account. Simply download the zip file and follow the instructions on how to import your new sounds into SubLab.
specs: |-
