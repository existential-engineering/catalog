details: |-
  'Tech House Injection' from baltic audio brings you a powerful collection of Tech House samples and loops to push your production to the next level. You'll find a bunch of drums, basses, synths, drumloops, chops and more and 100 presets for Sylenth1 synthesizer.

  This royalty-free pack provides you with all of the elements you need to make chart-topping Tech House hits.

  32 MIDI files are included for the majority of musical phrases heard in these kits. Together with the 100 Sylenth1 presets and the several bass- and synthshots there are no limits to your creativity.

  Of course, the numerous ready-to-use loops also allow you to achieve great results very quickly.

  You can use this pack for genres like Tech House, Minimal House, Deep House, Techno and more.
specs: |-
  - 107 Loops in WAV
  - 95 Oneshots in WAV
  - 100 Sylenth1 Presets
  - 32 MIDI files
  - Basses, Synths, Drums, Drumloops, Percussion, FX, Vocals
  - 250+ MB of content
  - 24-bit/44.1kHz
  - PC/Mac Compatible
  - 100% Royalty-Free
