details: |-
  Over 450 loops by ben cantil - a huge collection of beats and textures from
  ben cantil's secret laboratory of modified toys, synths, gameboys and other
  miscellaneous electronic gadgets.

  The drum loops are sequenced in a broad range of styles including hip-hop,
  electro, idm, glitch, jungle, gabba and breaks.

  Over 450 loops, a large assortment of single hits and fx, as well as many
  "beds" ranging from surreal synths to 8-bit noisescapes.

  All sonivox loopline titles are mac and pc compatible, include acid/wav,
  appleloop, aiff and rex2 formats, and work with almost any music software.
