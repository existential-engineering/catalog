description: A Panoptigon disc featuring a full 60-note piano recording arranged
  with rhythmic figures in 6/8 time, intended for sustained chords producing
  arpeggiated textures.
details: |-
  GRAND PIANO expands on the concept of our original Orchestron format Piano disc, in that it takes advantage of the full 60-note keyboard of the Panoptigon format, and also we've arranged more complex rhythmic figures for the individual notes, in 6/8 time. As with all of our discs featuring rhythmically articulated scale tones, GRAND PIANO is best used for playing sustained chords to produce rippling, arpeggiated patterns and textures. It's also great for playing in reverse for even more ambient effects. GRAND PIANO can only be played on PANOPTIGON, and is NOT compatible with Optigan or Orchestron . The raw piano recordings used on this disc are open-source samples created by Lawrence Fritts of the University of Iowa. Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility
