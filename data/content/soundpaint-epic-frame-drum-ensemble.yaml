details: |-
  Fierce, Forceful Frame Drums

  The Epic Frame Drum Ensemble is the most comprehensive collection of large-scale, dynamic frame drums on the market. We sampled frame drums from all over the world, including Irish Bodhrán drums, North African Tar drums, Egyptian Riqs, Persian Dafs, North American drums, and more! The drums are ready to go, with both full ensemble and solo patches. These frame drums have a huge range in pitch, volume, and power! Dramatic, low booms, beefy mids, and precise highs to add definition - it's all there. And Soundpaint takes it even further with 127 dynamic velocity layers and TIME, allowing more control of the room, decay, and dynamics than ever! It doesn't have to be loud, but it can still be big and deep. Each frame drum is unique - some have rattles on the frame, similar to a tambourine - so the ensembles have a lot of depth and unique texture. Epic Frame Drum Ensemble also includes rolls, swells, and more effects (like dragging a superball across the head)! Get ready to unleash the intensity of the Epic Frame Drum Ensemble!
