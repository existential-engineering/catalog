details: |-
  Spitfire takes its Evo range of products into a new realm with a series of evolving "motions" that will revolutionise the way in which you write and realise your string compositions.

  Orchestrated by Ben Foskett, this product exudes class and a cool organic sound that will bring fresh Steve Reich, Terry Riley, John Adams and Arvo Part style sophistication to any composition.
specs: |-
  - 37 unique evolutions across the string band, in 3 categories
  - 16 curated presets
  - All sounds tempo-locked to host DAW tempo
  - Customisable evolutions grid with a randomise function
  - Four mic signals: Close, Sweet Loops, Completely Varped, Stretched
  - Chamber-sized string section recorded at Air Edel Studios, London
  - 21.30 GB download size
  - 42.60 GB disk space required during install
  - Requires Kontakt FULL 5.6.8 or higher
  - macOS 11 to OS 26 (Kontakt 8.8 requires macOS 14 minimum)
  - Windows 10 or 11 (64-bit)
  - Minimum 8 GB RAM, 16 GB recommended
  - Spitfire Audio App required
