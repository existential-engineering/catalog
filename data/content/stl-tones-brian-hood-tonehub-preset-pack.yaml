details: |-
  Brian Hood is a producer, engineer and mixer, and owner of 456 Recording Studio in Nashville, Tennessee. He has worked with Memphis May Fire, ERRA, Invent Animate, Being As An Ocean, Crystal Lake, Sworn In, Gideon and A Plea For Purging. He was also the original drummer of MyChildren MyBride.

  Using many of Brian's go-to guitar amp, cab and pedal setups, including his sought-after Mesa 4x12 cabs, this signature collection showcases virtually all of his rhythm, lead and clean guitar recording setups, with both processed and unprocessed options.

  Brian's pack contains 48 captures.
