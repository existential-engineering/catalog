details: |-
  This Orchestron disc features solo french horn. Rather than a simple photocopy of an original vintage Orchestron disc, this has been completely re-mastered from scratch, using the original Orchestron master tapes. Therefore, this disc won't sound exactly like the original disc, since there's no way to precisely identify the exact 2-second section of each note that was used to create the original Orchestron loops. PLEASE NOTE : This disc is compatible with Orchestron and Panoptigon players. This disc WILL NOT work properly in an original Optigan ! It WILL play, but the sounds will NOT be mapped correctly to the keyboard- they will be mapped mostly haphazardly across the chord buttons. Please don't order this disc expecting to easily use it in an Optigan.\

  Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility
