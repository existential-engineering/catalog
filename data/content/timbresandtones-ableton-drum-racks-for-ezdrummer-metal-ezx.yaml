description: Ableton Drum Racks for ezDrummer Metal! EZX features separate
  Ableton drum racks for all factory presets for the toontrack ezdrummer metal!
details: |-
  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all metal! Kit factory presets from ableton push
  controller device browser. All instrument articulations ready to go in one
  layout using ableton push 64 pad layout mode.

  All our racks use consistent drum rack coloring so you can visually and
  immediately spot your snares from your crashes. Know your metal! Ezx toms from
  your snare articulations. Individually labelled drum rack pads for clear
  visualisation, post performance editing and automation to all drum rack /
  instrument articulations in ableton.

  Ableton macros mapped to toontrack ezdrummer macros with preset values for
  ease of use in push and simple to use automation programming. Ableton macros
  are color coded to match the ezdrummer display. Singleout presets featuring 8
  ableton drum racks for all factory presets single audio output to single
  ableton track. Multiout presets featuring 8 ableton drum racks for all presets
  in multiple audio channel output from the plug in to multiple ableton audio
  tracks using the multi output ableton template also provided designed for the
  kit presets.

  Use the template racks and extend to your own toontrack ezdrummer metal! Ezx
  presets, swapping out individual sounds or articulations. You are 100% ready
  to go with the factory presets but there is no limitation to creating your own
  presets from these templates.
specs: |-
  - 16 Ableton drum racks
  - 8 Ableton live templates
  - Color coded pad design
  - Ableton push 64 pad layout mode
  - Individually labelled drum rack pads
  - Ableton macros mapped to toontrack ezdrummer macros
  - Singleout presets with 8 Ableton drum racks
  - Multiout presets with 8 Ableton drum racks
  - Multi-channel audio output routing
  - Track level audio mixing control
  - Ableton live 9.5 or above
  - Toontrack ezdrummer2 required
  - Metal! Ezx expansion library required
compatibleWith:
  - ableton-live
