description: "The second volume of Krotos' clothing and materials foley
  collection, containing 460 clothes and materials sounds optimized for use with
  Reformer Pro. Features recordings of various fabric types including acrylic,
  burlap, canvas, cotton, denim, nylon, plastic variants, polyester,
  polypropylene, silk, sleeping bag, waxed jacket, and wool materials. Sounds
  cover movement, rubs, scratches, and cloth foley across 34 Reformer Pro Sound
  Packs. Comes with two downloads: source asset files with metadata PDF plus a
  Reformer Pro integrated library installer. Royalty-free commercial license
  included."
