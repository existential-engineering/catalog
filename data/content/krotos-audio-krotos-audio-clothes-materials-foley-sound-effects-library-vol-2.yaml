description: "The second volume of Krotos' clothing and materials foley collection, containing 460 clothes and materials sounds optimized for use with Reformer Pro. Features recordings of various fabric types including acrylic, burlap, canvas, cotton, denim, nylon, plastic variants, polyester, polypropylene, silk, sleeping bag, waxed jacket, and wool materials. Sounds cover movement, rubs, scratches, and cloth foley across 34 Reformer Pro Sound Packs. Comes with two downloads: source asset files with metadata PDF plus a Reformer Pro integrated library installer. Royalty-free commercial license included."
details: |-
  This is Volume 2 of the Krotos Clothes and Materials Foley sound effects library. Volume 1 is one of the most popular Krotos sound effects libraries and forms part of many thousands of sound professionals' toolkits.

  The collection of 460 clothes and materials sounds is optimised and primed for use in Reformer Pro in the form of 34 sound packs. Grab a microphone and start performing a wide range of cloth Foley sounds directly in your DAW.

  The library features high quality recordings of clothing materials such as acrylic, burlap, canvas, cotton, denim, nylon, plastic, plastic floor mat, plastic netting, plastic shower curtain, polyester, polypropylene, silk, sleeping bag, waxed jacket, woollen blanket and woollen cloth, each covering movement and rubs, with scratch variants for burlap, denim, polyester and waxed jacket.

  Sound categories included are cloth, movement, rubs and scratches, with keywords covering cloth Foley, cloth movement and whooshes across every material. The purchase contains two downloads: a zip file with all source sound effect asset files plus a Metadata PDF, and an installer for the integrated Reformer Pro library including assets and sound packs.
