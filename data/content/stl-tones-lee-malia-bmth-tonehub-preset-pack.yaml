details: |-
  Lee Malia is the guitarist and a founding member of Bring Me The Horizon, the Sheffield band who evolved from the deathcore scene into one of the biggest rock acts in the world. He co-wrote and played on Sempiternal , That's The Spirit and amo , including "Shadow Moses", "Can You Feel My Heart", "Throne" and "Drown", and has a signature Jackson model.

  Created using Lee's actual amp, cab and pedal setups, this signature collection covers all of his playing styles, whether in the studio or for live shows.

  Lee's pack contains 42 captures.
