details: |-
  Spitfire creates rock history with three legendary drummers — Chad Smith, Roger Taylor and Andy Gangadeen — recorded at legendary studio location, Headley Grange. A new benchmark in drum sampling, this is an anthology of playable kits and an exhaustive selection of searing loops all with sympathetic mixing options.
specs: |-
  - Three multi-sampled kits played by Chad Smith, Roger Taylor and Andy Gangadeen
  - Thousands of loops plus multi-sampled hits
  - 8 mic signals
  - Mixes: Tight, Mid, Epic, plus Super Tight on Andy's kit
  - Kit mics: Kick, Snare, Hi Hat, Toms
  - Stereo perspectives: tight, ground floor, 1st floor and 2nd floor ambient mics
  - Approximately 38557 samples
  - 54.40 GB disk space
  - Kickstart engine with loop browser and sync to tempo
  - macOS 11 to 26 (Kontakt 8.8 requires macOS 14 minimum), Intel and Apple Silicon
  - Windows 10 or 11 (64-bit), 8 GB RAM minimum (16 GB recommended)
  - 32-bit systems are not supported
  - Recorded at Headley Grange to 2-inch Studer tape
  - Spitfire Audio App required
