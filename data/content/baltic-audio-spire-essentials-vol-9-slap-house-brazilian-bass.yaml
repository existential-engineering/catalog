details: |-
  64 presets for the Reveal Sound Spire synthesizer, aimed at current Slap House and Brazilian Bass, including hand-crafted basses, leads, plucks and pads.

  Each preset is programmed by a professional sound designer, with every parameter tweaked in detail, as a source for creating new and commercial sounds within a composition.

  The pack can also be used for genres like Future House, Dance and Pop.

  In addition, 11 MIDI files taken from the demo are included.

  Please note: the drums and some FX used in the demo are not included in this product. These presets require v1.1 or higher of Reveal Sound Spire.
specs: |-
  - 64 Presets for Spire
  - 30 Basses
  - 10 Leads
  - 10 Plucks
  - 8 Synths
  - 5 Pads
  - 1 FX
  - Modwheel Assignment
  - 11 MIDI Files
  - Multi-genre
  - PC/Mac Compatible
  - 100% Royalty-Free
  - Requires Reveal Sound Spire v1.1 or higher
