details: |-
  Blinksonic introduces aetnz, a virtual sampler synth for playing poly harmonic textures. This hybrid sampler is a collection of 114 tones of various electronic and acoustic instruments. Based on 2 resynth engines and a line of 6 effects aimed to contextualize your sound, aetnz shows an other way to use granular synthesis for rearranging classic analog and digital tones.

  By merging the 2 signals of the sampler, aetnz lets you create new keyboard sets with subliminal background textures. These back layer sounds are generated randomly on every notes and can produce fascinating soundscapes and experimental timbres. As a good source of inspiration, aetnz comes with more than 200 snapshots on which you can improvise in realtime and invent surprising polytonals chords.

  All the base samples come from different sources: my own acoustic instruments (guitar, bass), mc 303, crumar bit 99, juno 106, te op-1, yamaha rm1x, one shots resamples of instruments I found in some of my favorite tracks... But mainly it comes from textures I built from scratch with my audio editing software.

  Aetnz is also a funny graphic experience, with its constant flashed visuals feedbacks, an original flat gui design and a graphic representation of each effect parameters. Use it in your composition projects for movies, games or any soundtracks.

  Genres: electronica - glitch hop - wonky - trap - idm - edm - minimal - ambient - cinematic - house - minimal - braindance - drum n' bass - dub step.
specs: |-
  - 2 decks tones arrangers with loop position definition
  - Precise pitch/tune definition
  - 2 maps with 114 originals one-shot samples
  - 9 banks with 207 snapshots
  - Stereo mixer
  - Tnz button for instant randomisation of sample selection
  - Adsr envelope
  - Low/highpass filter with cutoff parameter slaved to lfo
  - Lfo with 4 shapes: pulse, triangle, sin and random
  - Shaper/overdriver
  - Tremolo
  - Vibrato
  - Filter delay with time parameter slaved to lfo
  - Space reverb
  - Normalizer
  - Hold keys button (latch)
  - Scale quantizer with 17 scales
  - Root scale note selector
  - Bank and snapshots browser knobs
  - Original flat gui with graphic representation of parameters
  - 2 screen views: desk view and synth view
  - 2 resynth engines
  - 6 effects
  - Granular synthesis
  - Polyphonic instruments
  - Native instruments reaktor 5.9.2 or reaktor 6 required
  - Intel core 2 duo equivalent processor
  - 4 gb ram minimum
  - Approximately 11% cpu usage on 2.7 ghz intel core i7
