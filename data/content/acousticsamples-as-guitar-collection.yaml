details: |-
  "The guitar bundle" is a collection of four classic guitars that have been deeply sampled and lovingly scripted to be as intuitively musical and playable as possible. Each guitar has its own highly distinctive sound and with this bundle, you will be able to cover any possible genre and even enjoy some guitar doubling with very four distinct guitar characters.

  We sampled each guitar very deeply, all frets of all strings with upstrokes, downstrokes, round robins, releases, staccatos, mutes, palm mutes, hand blocks, slides, hammer ons, pull offs, retriggers, fretnoises, percussions other articulations. All of these details allow us to reproduce the real playing of a guitar player, and easily.

  There are basically 4 modes (that you can choose using key-switches, g5 to c6), the solo mode that allows to play melodies, the chord mode that helps playing strums or picking very easily, the patterns mode that does all of the strumming or picking for you and the MIDI mode that allows you to use your preferred MIDI guitar controller.

  The sunbird acoustic guitar is based on a 1962 gibson hummingbird acoustic guitar. It can strum, in various ways, up, down, muted, in legato and allows finger picking. Everything is modeled after meticulously analyzing thousands of real chords played by guitarist. The strategy electric guitar is based on a fender stratocaster electric guitar. The gd-6 acoustic guitar is based on a guild d-40 custom edition electro-acoustic guitar. The telematic v3 is a deeply sampled fender telecaster guitar.
