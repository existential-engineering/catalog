details: |-
  This is a powerful collection of metal drum samples built to withstand the
  unrelenting power and attack of today's metal mixes. With a mix expressively
  aimed at hard rock and metal songwriters, this downloadable set of nearly 400
  drum samples offers the attack and punch essential to modern drum mixes with a
  wide array of cymbal choices.

  The bay area drums 01 sample library includes a complete set of drum samples
  for a five-piece ddrum usa maple drum kit and a wide array of meinl custom
  series cymbals.

  All drums and cymbals have been performed with extensive articulations,
  multi-sampled and offered as nearly 400 individual samples.

  Additionally, the drum and cymbal samples have been mapped for use with native
  instruments' kontakt and slate's trigger drum replacement software. Users may
  also use the 24-bit wav files in any other virtual instruments or sound
  replacement software compatible with 24-bit wav audio files.
specs: |-
