  - Ddrum usa maple 10" rack tom
  - Ddrum usa maple 12" rack tom
  - Ddrum usa maple 16" floor tom
  - Meinl 14" classics custom hihats
  - Meinl 22" classics custom ride
  - Meinl 16" classics custom medium crash
