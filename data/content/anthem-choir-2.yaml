details: |-
  Anthem Choir 2 is the sequel to anthem choir, a legato choir library for a
  variety of non-traditional settings like pop, rock, electronic, hip-hop and
  anthemic genres. Included this time around are three different vowels: ah, mm
  and eh (more of an 'aa' as in "rad") sung by three different ensembles: women
  impolite/polite and men.

  Each vowel also has an alternative consonant attack (velocities 100-127):
  "nah" for the ah's, "yeah" for the eh's and a pitch-scooped attack for the
  mm's. For the women impolite and men groups, we brought back the original
  rowdy karaoke warriors from anthem choir. They cut loose, singing strictly in
  their chest voice up the range at full chat. These patches are full of
  attitude and vibe.

  For women polite, we hired a group of semi-pros/pro singers in the studio and
  instructed them to try and ditch their training and go more pop/fun. The
  performances are more refined and accurate.

  The all women patches include a balanced blend of both the impolite and polite
  groups, playing off each other's strengths. These patches sound huge.
  Chock-full of humanity and vibe, we hope you enjoy the increased utility of
  our raw crowd vocal concept that is anthem choir.
specs: |-
  - Legato choir library
  - 3 studio choir ensembles
  - 12 legato patches
  - 9 ensemble sustains patches
  - Raw, powerful non-vibrato performances
  - Two different attack types per vowel
  - Shouts, risers, claps & snaps
  - Adjustable reverb with custom hall impulse
  - Requires full retail version of Kontakt 5.8.1+
  - Free Kontakt player not supported
  - Recorded in 48khz / 24-bit
  - 1 GB compressed ncw format
  - Pulse downloader delivery
