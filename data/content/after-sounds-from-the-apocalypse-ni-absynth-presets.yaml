details: |-
  The after collection for ni absynth features 50 semi-modular, atmospheric and
  immersive sounds for you to score the ends days with. Or, if you prefer, you
  can simply use them in your projects now and bring them to life in new and
  extraordinary ways.

  Instantly transport your listeners to a lonesome, desolate and sometimes
  dangerous landscape that you control. This is a must-have for any absynth user
  or owner of native instruments komplete who loves an atmospheric touch and
  organic textures.

  There is absolutely zero additional processing on the sounds used in the demo
  track for this sample pack. What you hear is exactly what you get when you buy
  from ohmlab. I believe that buying sounds should be simple and transparent,
  which helps to keep costs down and you happy.
