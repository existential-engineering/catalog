description: One of the earliest multi-sampled synthesizers the 360 systems
  keyboard is a rare, sampled-based synth made in california in the early '80s.
details: >-
  The 360 systems keyboard is a rare, sampled-based synth made in california in
  the early '80s, featuring real strings, flutes, brass, electric piano, basses,
  guitars, percussion, and more. Sharing similar components (eproms and an
  analog filter) as some of our favorite vintage drum machines, it's no wonder
  the 360 is as punchy as our favorite samplers, and as silky as our vintage
  synths.


  The sound of the 360 is a combination of beautifully captured samples
  (recorded at the best studios in los angeles with top tier session musicians)
  and the inherent lo-fidelity crunch of eproms passing through a sweet cem3320
  analog filter.


  We sampled every note of every patch (to preserve the great sound of the 360's
  tuning), cleanly through a radial jdi, into our API 1608 and finally into our
  apogee symphony mkii. The 360 only offers basic modulation, but it sounds
  excellent - the vibrato section modulates the pitch in a classic style that
  imparts the vintage warble that we all love.


  We captured filtered versions of the strings, flute, sax, and more. Where
  fitting, we also multi-sampled different cutoffs, which can be accessed via
  incoming velocity from your MIDI keyboard.


  All of these patches are available to you as wav files, and multi-sampled
  instrument presets for software such as ableton, logic, kontakt, reason, fl
  studio, sfz player, and really any 24-bit wav compatible sampler or DAW. Wavs
  are trimmed, looped, named by note, and mapped to various samplers. Wavs
  feature mapping and looping metadata, for easy drag n drop into unsupported
  samplers.
specs: >-
  - 37 total patches

  - 20 original factory clean patches

  - 12 clean patches with additional 360 filtering, vibrato, and chorus

  - 5 patches externally processed through moog mf103 phaser, yamaha cs-5, otari
  1/4" tape machine, h3000 and space echo

  - 2,065 24-bit wav samples

  - Cem3320 analog filter

  - Basic modulation with vibrato section

  - Multi-sampled instrument presets

  - MIDI keyboard velocity access

  - Modwheel parameters and fx routing

  - 1.96 gb unzipped

  - 24-bit wav compatible

  - Ableton live 9.7+

  - Kontakt 5.6.5+

  - Logic 9+

  - Reason 8+

  - Fl studio 20.8+

  - Sfz player compatible
