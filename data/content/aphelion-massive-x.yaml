details: |-
  Aphelion consists of 100 presets for Massive x. From epic synths to full
  sounding basses and from slow evolving pads to dark atmospheres it is a great
  soundbank for your arsenal for a variety of genres.

  Cinematic music, atmospheric electronic music, progressive rock or more
  experimental styles is where aphelion shines the most.

  The presets have many modulation options and for most of them mw adds vibrato.
  Aftertouch introduces new sound elements to the presets from subtle to more
  extreme changes.

  Presets were designed with massive x 1.3.5 (r238).
specs: |-
