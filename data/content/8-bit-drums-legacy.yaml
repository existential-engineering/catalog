details: |-
  8-bit drums is a collection of 8-bit kicks, snares, hihats, toms and other
  drums, faithfully reproducing the output of the original sound chip.

  This pack contains: 100 8-bit drum samples (kick, snare, hihat, tom, cymbal,
  shaker & other). 1 drum patch for native instruments kontakt, ableton live,
  maschine, logic pro exs24/sampler, fl studio, mpc expansion pack, and
  tal-sampler.

  24-bit, 44.1 khz wav files.

  8-bit drums is part of the 8-bit instruments & drums bundle.
specs: |-
  - 8-bit drum samples
  - 100 drum samples (kick, snare, hihat, tom, cymbal, shaker, other)
  - 24-bit, 44.1 kHz wav files
  - Native Instruments Kontakt compatible
  - Ableton live compatible
  - Maschine compatible
  - Logic Pro exs24/sampler compatible
