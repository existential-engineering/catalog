details: |-
  Step to the Beat

  Drop the bass and hit the drums with Pop 40: Skillstep and unleash the power of five Top-40 quality kits and perfectly paired auxiliary percussion. Customizable to suit any track, this production-ready drum library delivers crisp, trap, house, and dubstep beats, guaranteeing an infectious groove to captivate any audience. Step up your drum game and graduate from the world of pre-made loops with Soundpaint's post-apoca-loop approach. With 127 velocity layers for each hit, every beat will be unique, and Soundpaint's diverse effects suite adds a touch of acoustic depth to synthetic drums. We also keep the mapping simple and symmetrical across all Soundpaint drum kits, so it's easy to mix, match, and morph drums to your heart's content. Each program has an pre-programed ARP pattern - a great way to get the ball rolling. Customize the arp, play on top of it, or turn it off and get into all the details; there's no wrong way to get grooving! It's easy, flexible and fun to play, so you can get start jamming right away!
