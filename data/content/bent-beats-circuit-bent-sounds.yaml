details: |-
  Soundtrack Loops presents bent beats loops & one-shot samples. Circuit bending
  is the craft of extracting and modifying the electronic sound playback devices
  in old vintage toys, cheap instruments, and other noise-making appliances.
  With their voltmeters, soldering irons and alligator clips, the benders
  trigger new sounds, all rewired for craziness.

  The best of these find their way into great modern music and sound design, and
  can easily make a track stand out in totally unique ways. But getting these
  sounds is only half the battle—they need to be heavily produced to fit in,
  which here essentially means cut through. That's where bent beats comes in—you
  get great, finely processed circuit-bent samples that are drag 'n' drop ready
  to shine, in both beat loop and one-shot forms.

  Blended in with the bent material, you'll also find a generous selection of
  complementary sounds, including beats, scratches, and synths, that make it
  even easier to integrate the gritty, mid-forward circuit-bent material into
  your mixes.

  Try bent beats if you're into old-school boom-bap, lo-fi hip-hop, abstract
  electronica, and beguiling, cocorosie-style pop. Topped off with 44 loops, 84
  one-shots & long circuit bent samples, a bonus ableton live drum rack, and
  cover art by ric shultz, score this seriously bent construction kit and back
  your own music and the soundtrack loops mothership, in its ongoing mission of
  supporting artists that support each other.

  24-bit 48 khz stereo file. Formats: acidized .wav and apple-looped .aif.
