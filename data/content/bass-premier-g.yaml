details: |-
  Bass Premier G is electric bass library for ni Kontakt full version. (not
  Kontakt player). For producers and "bass premier" lovers, the next generation
  of electric bass libraries has finally arrived with gui and super natural
  legato.

  This library is a truly addictive bass playing experience in 96khz/24-bit.

  Features: 96khz/24-bit hi-res raw samples. 2 instruments, custom jazz bass (5
  string) and precision bass (4 string). Super natural legato. 6 articulations.
  More than 40 slide variation. Recording studio sampling reverb.
specs: |-
