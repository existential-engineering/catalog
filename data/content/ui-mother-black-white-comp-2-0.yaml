  The gui kit can work with VST or kontakt, making it versatile for music
  production. Everything in the design is made with perfection to detail, as it
  should be in a musical instrument.

  After purchase, you receive png files of all ui elements, on/off states with
  129 frames, small/middle knobs animation with 257 frames, and big knob
  animation.

  The package includes figma source file and assets animation source file for a
  maximum version of 10 copies.

  10 hours of expert designer time is available to add extra design elements to
  the model for a maximum version of 10 copies.
