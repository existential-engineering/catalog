details: |-
  'Serum Essentials Vol 4: Slap House' from baltic audio is aimed at producers looking for the sound of current Slap House. It holds 64 top-quality presets for the Serum synthesizer, including hand-crafted basses, leads, plucks and more.

  Each preset is programmed by a professional sound designer, with every parameter tweaked in detail, as a source for new and commercial sounds within a composition.

  The material can also be used for genres like Future House, Brazilian Bass, Pop and Dance.

  In addition, 38 MIDI files taken from the demo are included.

  Please note: The drums and some FX used in the demo are not included in this product. These presets require v1.3.2.8 or higher of Xfer Records Serum.
specs: |-
  - 64 Presets for Serum
  - 23 Basses (Presets)
  - 12 Leads (Presets)
  - 11 Plucks (Presets)
  - 6 Keys (Presets)
  - 5 Synths (Presets)
  - 4 Pads (Presets)
  - 3 FX (Presets)
  - 38 MIDI Files
  - Multi-genre
  - PC/Mac Compatible
  - 100% Royalty-Free
