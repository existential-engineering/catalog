details: |-
  'Trap Essentials Vol 3' from baltic audio is a sample pack for Trap music. You'll find five top quality Construction Kits and all of the elements you need to create hit tracks, including drums, 808s, basses, synths, percussions and more.

  Each Kit contains perfectly mixed instrumentation and will be your essential source for creating instant Trap hits, which are just waiting for a vocal topline to be added.

  MIDI files are included for the majority of musical phrases heard in these Kits: an essential feature for modern producers.
specs: |-
  - 5 Construction Kits
  - 62 Oneshots (drums, percussion, fx)
  - 86 Stems / Loops
  - 29 Serum Presets
  - 5 MIDI files
  - 1GB of content
  - Perfectly premixed
  - 44.1kHz/24-Bit WAV
  - PC/Mac Compatible
  - 100% Royalty-Free
