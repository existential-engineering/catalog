details: |-
  Andromeda is the new collection of analog electronica for Repro-1. All the 128
  sounds have been carefully designed to trigger your creativity and give you
  new ideas to explore.

  Andromeda contains lush and large analog pads and leads, original and
  motivating sequences and arps, low-end mono basses and bass loops, synced
  percussion loops and mind blowing monosynths.

  This soundset is inspired into the analog monosynths era, and all the sounds
  take advantage from repro-1 unique characteristics and strengths.

  All the 128 patches are "ready to go" and are responsive to modwheel and
  velocity.

  Andromeda soundset contains: PDF with a detailed installation guide. 128
  presets. Normalized volumes. Velocity sensitivity. Control by modwheel.
specs: |-
  - 128 presets
  - Velocity sensitivity
  - Modwheel control
  - Analog pads and leads
  - Sequences and arps
  - Mono basses and bass loops
  - Synced percussion loops
  - Monosynths
  - Ready to go patches
  - Normalized volumes
