details: |-
  This is a free collection of 64 presets for the virus ti (os5). They are all
  arp based patches covering a full range of styles from grinding bass riffs to
  ethereal sequences using the full potential of the virus ti.

  Each preset makes use of the 3 assignable knobs for transforming the patches
  in real-time as well as channel pressure (aftertouch) and mod wheel. Knob 2 is
  always assigned to the delay amount.
