details: |-
  Danish bunker coast library features mysterious and eerie sounds recorded in
  and around ww2 bunker derelict along the danish west coast. The gathered
  ambiences form a comprehensive resource of steady winds, heavy gusts, rustling
  undergrowths as well as single waves and strong surfs that constantly crash
  into these otherworldly areas of concrete remains.

  A big part of the library was recorded inside the bunkers where the strong
  nature elements of wind and water are transformed into heavily comb filtered
  textures and dark atmospheres.

  Danish bunker coast library is available in three versions: bwav universal
  (full version): 8 sceneries, 71 takes, 2 to 3+ minutes each, 24-bit/96khz,
  embedded metadata, 5.8 gb; bwav universal (light version): 4 sceneries, 31
  takes, 2+ min each, 24-bit/48khz, embedded metadata, 1.2 gb; live pack:
  requires live 8/9, 31 clips/instrument racks, 1 set, 1.2 gb.
