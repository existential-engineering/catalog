description: BamBoomBa is a wooden key thumb piano soundfont and sample library
  with a deep history.
details: |-
  BamBoomBa is a wooden key thumb piano soundfont and sample library with a deep
  history, created as a learning device based on historical research into
  african music in seventeenth-century jamaica.

  The instrument is made of found parts including bamboo sticks that serve as
  keys, an old dresser drawer top with a thin solid wood sheet, two triangular
  plywood sides, and one rectangular plywood base forming a megaphone-like
  opening for sound projection.

  The bamboomba has a unique sound that is less ringing and more percussive and
  woody compared to metal-keyed sansas, with an alternating-keyed design that
  makes it easier to play fast runs of close intervals and microtonal passages.

  The actual sansa can easily accommodate any tuning, equal temperament or
  microtonal, just by sliding the keys further in or out from the bridge,
  providing flexibility for non-standard musical tunings.

  The bamboomba takes really well to distortion, time stretching,
  pitch-shifting, and most especially echo and reverb effects, though these must
  be supplied externally as they could not be incorporated into the .sf2 file
  format.
specs: |-
  - Wooden key thumb piano
  - Soundfont format
  - Sample library
  - Equal temperament tuning
  - Microtonal tuning support
  - MIDI compatible
  - .sf2 file format
  - Alternating-keyed sansa design
