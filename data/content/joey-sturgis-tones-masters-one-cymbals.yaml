details: |-
  Masters One Cymbals is a cymbal sample library recorded, edited and mixed by Joey Sturgis, delivered as Kontakt instruments.

  Mixing info: you should think about using a compressor or sustain enhancement with these samples. The reason is that processing each sample on its own will not yield the same result as processing the samples being played together as a whole. The samples have been individually processed in terms of tone and playing dynamics, so when mixing, apply compression or sustain modification with a transient modifier.

  Licensing: all samples are a work of art created by Joey Sturgis. You may use these samples in a music, video, or film production. You may not sell these samples as a work of your own, nor sell them as a whole or in part within other libraries, sample sets, or products of any kind.
