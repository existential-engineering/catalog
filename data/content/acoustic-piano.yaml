details: |-
  Muze acoustic piano contains 144 sources: yamaha c7 grand piano, hords, keys,
  guitars, mallets, bells, e pianos, processed pianos, effects & more.

  A flexible user interface that allows you to control all aspects of the sound.
  Each preset has 9 layers with the ability to mix from 2 to 144 sounds
  simultaneously.

  The full version of kontakt 5.6 or above is required. Not compatible with
  kontakt player.

  Acoustic piano by muze is soundware (samples or presets that load into other
  products).
specs: |-
  - Kontakt 5.6 or above required

  - 144 sources

