  Big Downtempo Beats is a set of 354 drum loops and 197 one-shots for creating
  lofi study beats, chill beats, hip hop, rnb, glitch, idm, and just about
  anything in between.

  Tempos range from 80-120 bpm with a wide variety of complete beats, percussion
  tops, and twisted drum effects.

  This pack combines old school big beat samples with hip hop, funk, and idm
  glitch.

  As standard practice for all loops created by the soundtrack loops team, key
  and bpm are tagged in both metadata and file names.

  Formats available: acidized .wav and apple looped .aif at 44.1khz 24-bit
  stereo.
