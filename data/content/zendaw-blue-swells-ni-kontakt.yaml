description: ZenDAW announces blue swells (wavetable - transwave & additive
  sounds) for ni Kontakt in collaboration with rawl gelinas.
details: |-
  Crafted multi-sample retro-modern wavetable sounds from iconic synths
  including ppg wave 2, ensoniq fizmo, ensoniq mirage with soundprocess. 3
  distinctive gui colors for 3 synths that marked their footprint in electronic
  music history.

  Ppg wave 2 is the legendary 1980's digital/analog hybrid machine that inspired
  generations of synths to come. The wave 2 featured digital oscillators capable
  of producing up to 8000 unique waveforms modified by analog filter and
  amplifier circuits.

  Fizmo is a 48-voice synthesizer which uses 2nd-generation transwave technology
  to create very organic sounds unlike any other synth available. Ensoniq mirage
  with soundprocess has additive synthesis capability plus up to 4 independent
  oscillators which can be stacked together.

  Modwheel controlled knobs and sliders in the bsk library require MIDI control
  hardware or you may use the onscreen modwheel control by enabling the onscreen
  keyboard in the kontakt interface. For macos users - macos ventura may require
  the latest version of kontakt 7 to work.
specs: |-
  - 87 multisample banks
  - 764 Kontakt .nki instrument presets
  - 760 individual stereo samples
  - 16-bit 44.1 kHz uncompressed PCM wav samples
  - 1.27 GB installed
  - Flexible and intuitive user interface controls
  - Full FX section including delay, reverb, chorus and limiter
  - Wavetable synthesis
  - Transwave technology
  - Additive synthesis
  - Modwheel controlled knobs and sliders
  - Kontakt v6.7.1 full version required
  - Windows 7 and above
  - Intel core i5 or equivalent CPU
  - 2 GB RAM minimum
  - macOS 10.12, 10.13, 10.14, 10.15
  - I5 processor
  - 4 GB RAM
  - 1.3 GB hard drive space required
  - MIDI control hardware support
  - Onscreen modwheel control
  - 3 distinctive gui colors
