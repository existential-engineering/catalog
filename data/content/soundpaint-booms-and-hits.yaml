details: |-
  Dark. Deep. Booms. From alien invasions and sonic dystopian landscapes to creepy boiler rooms and decrepit warehouses, the imagery evoked by the sound of Booms and Hits is unmistakable and unforgettable. These percussive elements, so useful in modern film scoring, can build suspense while obliterating the stereo field. Even the transitional elements are tightly focused and have a beautiful attack. Booms and Hits is made up of 5 parts and 33 programs that are custom-tailored to explode your score with rich, thick hits. Comprised of both analog and acoustic elements, percussive elements, synth hits, clean hits, and subtle transitions all the way to big and brash clean treatments, this library has everything you need for modern cinematic film or video game trailer scoring.
