details: |-
  Alien radiophonica for kontakt contains over 2gb of sample data with 165 individual soundscapes created from scratch using multiple signal generators, delay processors and filters to produce strange off world radiophonic tones.

  All samples are recorded at 44.1k 24-bit resolution.

  Categories include ambient atmospheres, ambient loops, sci fi atmospheres, sci fi loops and electronica keys.

  Alien radiophonica by everythingturns is soundware (samples or presets that load into other products) for macos and windows.
