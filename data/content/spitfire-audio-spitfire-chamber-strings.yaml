details: |-
  We handpicked 16 of the finest string players to perform an encyclopaedia of articulations and techniques, expertly recorded in the world famous Hall at AIR Studios, London. This smaller section gives you more detail and focus than our Symphony Orchestra , with Close, Tree and Ambient microphone positions, while still capturing the beautiful resonance of the hall.

  This is our definitive chamber range – a hugely versatile classic that will enhance your film, TV and game scores and pop records.

  Available in 3 editions — Spitfire Chamber Strings Essentials , Spitfire Chamber Strings and Spitfire Chamber Strings Professional .
specs: |-
  - 244 articulations: 38 shorts, 53 longs, 19 FX, 45 legatos
  - 16 world-class London string players (4,3,3,3,3)
  - 6 instruments: Violins 1, Violins 2, Violas, Celli, Basses, Ensembles
  - 3 microphone positions (Close, Tree, Ambient)
  - Recorded at The Hall, AIR Studios, through Neve Montserrat pre-amps into a Neve 88R desk
  - Recorded digitally at 96k via 2" Studer tape
  - ~72697 samples
  - 80.9 GB download size
  - 161.80 GB disk space required during install
  - Kontakt Player 5.6.8 or higher required
  - NKS-ready
