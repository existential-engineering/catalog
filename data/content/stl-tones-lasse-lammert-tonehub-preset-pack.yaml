details: |-
  Lasse Lammert is a renowned engineer, producer and mixer known in the industry as the 'guitar tone guy', with decades of experience across extreme and melodic metal. Working out of LSD Studios, he is the trusted choice for artists including Alestorm, Gloryhammer and Wind Rose.

  Drawn from Lasse's vast collection of amps, cabs, pedals and mics, the bundle caters to every genre, spanning 30 different amps, 16 cabinets and 12 pedals.

  Lasse's pack contains 85 captures.
