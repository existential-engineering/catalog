description: Discover the Analogue Stab Generator Add-On for Rave Generator 3. 500 analogue inspired samples and 128 presets designed for Synthwave, Retrowave producers.
details: |-
  Analogue Stab Generator is an add-on for Rave Generator 3 featuring 500 analogue-style samples (100 basses, 200 chords, 200 leads) and 128 presets. Perfect for Synthwave, Retrowave, Outrun, Cyberpunk, and Darkwave productions.

  Step into the neon future with the Analogue Stab Generator, a brand-new add-on for Rave Generator 3 crafted for Synthwave, Retrowave, Outrun, Cyberpunk, and Darkwave producers.

  This expansion delivers a huge collection of 500 analogue-inspired samples and 128 ready-to-use presets designed to capture the warm, nostalgic sound of vintage synths while pushing into modern retro-futuristic soundscapes.

  Whether you're building 80s-inspired soundtracks, retro electro anthems, or dark cyberpunk atmospheres, the Analogue Stab Generator gives you all the essential building blocks for authentic yet fresh productions.

  Requires Rave Generator 3 to use this add-on.
specs: |-
  - 128 presets, in 4 folders: Basses, Leads, Pads, and Stabs
  - 100 deep basses for driving retro grooves
  - 200 lush chord stabs for instant atmosphere
  - 200 soaring leads for epic synthwave melodies
  - 500 analogue-inspired samples in total
  - Requires Rave Generator 3
