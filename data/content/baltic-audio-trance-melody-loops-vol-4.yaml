details: |-
  'Trance Melody Loops Vol 4' is a royalty-free Uplifting Trance songstarter and melody loop pack featuring 16 melody kits with WAV loops, MIDI files and bonus presets for Reveal Sound Spire and LennarDigital Sylenth1.

  The pack includes lead loops, bass loops, pad loops and pluck loops with Default, Build-Up and Tail versions, giving you flexible building blocks for emotional breakdowns, melodic hooks, energetic drops and full Uplifting Trance arrangements. All loops are key-labeled and produced at 140 BPM, making them easy to use in your DAW or sampler.

  Requirements:
  The included WAV loops and MIDI files can be used in any DAW or sampler that supports WAV and MIDI files. Reveal Sound Spire is required for the included Spire presets. LennarDigital Sylenth1 is required for the included Sylenth1 presets.

  Please note:
  This pack is mainly a WAV melody loop and MIDI songstarter pack. Spire and Sylenth1 presets are included as bonus content for recreating or customizing the sounds.
specs: |-
  - 16 Melody Kits (WAV-format)
  - 16 Melody Loops (with Default, Build Up & Tail versions, WAV-format)
  - 16 Bass Loops (with Default & Tail versions, WAV-format)
  - 16 Pad Loops (with Default & Tail versions, WAV-format)
  - 16 Pluck Loops (with Default & Tail versions, WAV-format)
  - 160 WAV Files in total
  - 64 MIDI Files
  - 7 Spire Presets (Lead, Bass, Pad, Pluck)
  - 7 Sylenth1 Presets (Lead, Bass, Pad, Pluck)
  - Build Up & Tail versions
  - Key labeled
  - 140 BPM
  - Over 650 MB of content
  - PC/Mac compatible
  - 100% royalty-free
  - 44.1kHz, 24-Bit WAV
