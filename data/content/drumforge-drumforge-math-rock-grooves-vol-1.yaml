details: |-
  Drumforge Math Rock Grooves: Vol. 1 is a MIDI groove pack built specifically for producers and composers working in math rock and progressive genres. All performances were recorded and crafted by Brody Taylor Smith, a professional drummer known for his command of odd meters and intricate rhythmic phrasing.

  The pack contains 400 individual MIDI files encompassing drum grooves, drum fills, and transitional patterns. Content spans a wide range of time signatures and syncopated feels, from straight odd-meter grooves to highly complex fills, giving arrangers raw material for virtually any section of a song.

  All files are delivered as standard MIDI, making them compatible with any digital audio workstation. Users can drop the grooves directly onto any MIDI drum instrument, including Drumforge's own Bergstrand and Savior sample-based drum samplers, and freely adjust tempo and dynamics to fit their project.

  The pack is organized by song section — verse, chorus, bridge, fill, and so on — enabling composers to navigate the library quickly when building arrangements. Lifetime updates are included, so future additions to the pack are delivered at no extra cost.
specs: |-
  - 400 drum grooves and fills in MIDI format
  - Performances across odd time signatures and complex syncopations
  - Organized by song section for quick arrangement workflow
  - Compatible with any DAW or MIDI drum instrument
  - Optimized for Drumforge Bergstrand and Savior samplers
  - Instant digital download
  - Perpetual license with free lifetime updates
