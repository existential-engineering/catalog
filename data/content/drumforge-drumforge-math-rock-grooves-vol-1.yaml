details: |-
  Math Rock Grooves: Vol. 1 is a MIDI groove pack containing 400 drum grooves and fills prepared by drummer Brody Taylor Smith. The performances use a wide range of time signatures and syncopations aimed specifically at math rock writing.

  The material spans odd time grooves through to complex fills, and is supplied as MIDI files for use in any DAW or with any drum plugin. It integrates directly with the Drumforge Bergstrand and Savior samplers.

  Grooves are organized by individual song sections so arrangements can be assembled quickly, either as building blocks for new songs or as a way to refresh existing demos. Dynamics and tempo can be adjusted to fit the production.

  The pack also works as a practice tool for players wanting to study off-time drum phrasing.
specs: |-
  - 400 total drum grooves and fills performed by Brody Taylor Smith
  - Covers odd time grooves through to complex fills
  - MIDI files for use in any DAW or drum plugin
  - Integrates directly with the Drumforge Bergstrand and Savior samplers
  - Grooves organized by individual song sections
  - Adjustable dynamics and tempo
