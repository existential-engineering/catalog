details: |-
  Sonic Vibes of Steel

  This Steel Drum was custom designed for our recording session. We wanted the instrument to cover all ranges from bass to treble, but have them all contained inside a singular Steel Drum. We sampled the instrument with several mallet types (ex. Beaters, Felt Mallet, Brushes, Hands, etc) The result, a beautiful and rich deeply sampled Steel Drum. Everything was carefully recorded & processed at 24bit / 96k at our British Studio through a historic custom Neve desk. The Steel Drum library has 127 velocity layers, full-range MIDI, and near infinite round-robins. This library sounds like the real thing. Main Programs let the original articulations of the instrument shine and the other Programs open new doors for the Steel Drum sound.
