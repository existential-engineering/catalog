details: |-
  Balkan Vocals 2 is an evocative vocal library to inspire your cinematique,
  ambient productions as well as dance/experimental stylings, full of intricate
  local taste and color.

  Rast sound's richest vocal library yet, this time from southeastern europe,
  provides significantly larger and integral content with variety of
  sounds/tools in search of a fine user experience.

  As we try hard with every new release to increase playability of the content
  through instruments, we have added a number of natural and processed legato
  instruments for solo performances as well as polyphonic presets to the kontakt
  instruments section.

  Offering you a chance to mix recorded local songs and phrases with playable
  instruments to form or support your own harmonies.

  Content includes 14 songs and 8 improvisations in 46 stems from 6 countries,
  from a seasoned performer with strong background in traditional and
  improvisational music.
