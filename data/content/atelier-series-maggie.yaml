description: Atelier Series Maggie is a rich, soulful legato vocal release for
  emotional, cinematic and modern songwriting contexts.
details: |-
  The legato transitions were finessed using a variety of post-production and
  programming techniques to allow maggie's performances to sail through
  smoothly. In addition to the emotional legato patches, an evolving sustains
  keyswitch patch called evermore is included.

  The material was sourced from vocal recordings and ran through a bespoke array
  of hardware pedals for atmospheric, tonal sound design. Six presets are
  included: promise, afterglow, hallowed, abyss, prayer and stardust.

  Maggie downs is a singer/songwriter located in kansas city, missouri. She
  studied classical and jazz vocal performance at troy university where she
  performed with multiple ensembles. After her studies, she launched a career in
  songwriting and made her debut with her ep that opened up a variety of
  opportunities in performing and co-writing with other artists.
specs: |-
  - Requires full retail version of Kontakt 5.8.1 or higher
  - Free Kontakt player not supported
  - Recorded in 48khz / 24-bit
  - 1.7 GB compressed ncw format
  - Rich, soulful legato vocals
  - Natural, progressive vibrato
  - Non-looped performances
  - Legato transitions with sustains recorded long-style
  - Evolving sustains keyswitch patch
  - Adjustable reverb with custom hall impulse
  - Three vowel patches (ahh, ooo, mmm)
  - Evermore keyswitch patch
  - Six presets (promise, afterglow, hallowed, abyss, prayer, stardust)
