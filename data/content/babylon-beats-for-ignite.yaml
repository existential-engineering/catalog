details: |-
  Take a deep breath and dive into this ultra-cool collection of seriously
  inventive, organic downtempo rhythms. "babylon beats" gives you all the space
  and air you need to meditate on some heavy productions, adding leftfield
  percussion and earthy vibes to your next excursion into sonic dreamland.

  Inside this extraordinary sample pack you will find an addictive blend of over
  120 laidback grooves, hypnotic rhythm patterns and intricately crafted
  percussion loops, ranging between 60 and 90 bpm.

  This fine selection of perfectly humanized and gently shuffled downbeat
  patterns will enable you to keep the mood strictly personal. Just lay down
  your own melody and chord progressions over this solid rhythm foundation, add
  a vocal to feel the realness or grab any other instrument of your choice and
  plug in to the babylon vibe.
