description: Mininn Drum Lite brings the iconic LinnDrum sound to Kontakt. Authentic 80s drum machine tones for Synthwave, Electro, Pop, and House producers.
details: |-
  Mininn Drum Lite is the Kontakt version of Audio Blast's Mininn Drum, delivered in .nki format for Kontakt 6.7 and above. The full version of Kontakt is required, as the library is not compatible with Kontakt Player.

  Inspired by the legendary LinnDrum and other iconic 80s and early 90s drum machines, Mininn Drum Lite delivers the punchy, vintage tones that defined entire eras of Synthpop, Electro, New Wave, Funk, Pop, Italo Disco, House, and early Techno.

  With a straightforward interface and an authentic retro character, this Kontakt library brings the groove and warmth of classic drum machines directly into modern productions. It is a compact and lightweight take on Mininn Drum, aimed at fast setups.

  The layout is simple, with pre-mapped MIDI notes for instant playability. The map runs from C1 to B1: Kick, Side Stick, Snare 1, Clap, Snare 2, Tom L, Hi-Hat Closed, Tom H, Hi-Hat Open, Cowbell, Cabasa and Crash.

  Multi-output routing, advanced sound controls and the complete feature set are reserved for the full Mininn Drum release.
specs: |-
  - Kontakt format (.nki), works with Kontakt 6.7 to the latest version
  - Full version of Kontakt required (not compatible with Kontakt Player)
  - Faithful emulation of the legendary LinnDrum sound
  - Authentic 80s/90s vibe, suited to Synthwave, Electro, Pop, Funk, House and Techno
  - Compact and lightweight version of Mininn Drum, ideal for fast setups
  - Simple layout with pre-mapped MIDI notes for instant playability
  - 12 mapped drum sounds: Kick (C1), Side Stick (C#1), Snare 1 (D1), Clap (D#1), Snare 2 (E1), Tom L (F1), Hi-Hat Closed (F#1), Tom H (G1), Hi-Hat Open (G#1), Cowbell (A1), Cabasa (A#1), Crash (B1)
