details: |-
  Gabrielle flute is a true legato flute library performed by gabrielle davis.
  Recorded at orb studios in austin, tx our goal was to create a series of flute
  patches that could address a wide range of orchestral contexts while
  prioritizing responsive playability.

  Like all of our solo instrument releases, no keyswitches are required just
  play in what you want and use the modwheel (or cc# of your choice) for
  dynamics.

  The 'workhorse' patch is exactly that a solid all-rounder that will likely
  suit the majority of your energetic flute-writing needs. 'emotional' was
  performed mezzo piano great for softer contexts. For the 'fat lead' patch, we
  asked gabrielle to play with as much gusto and power as she could resulting in
  an instrument that soars in the upper register with attacks that properly
  bite.

  Like with our barker clarinet release, we recorded a series of short and long
  inhales with both the player and flute in position. Great patch to help sell
  the performance in between phrases.
specs: |-
  - Legato flute
  - Natural progressive vibrato
  - Natural and tuned patch variations
  - Recorded close for mixing flexibility
  - Adjustable reverb with custom hall impulse
  - Requires Kontakt 5.8.1 or higher
  - Free Kontakt player not supported
  - Recorded in 48khz / 24-bit
  - 1.8 GB compressed ncw format
  - Pulse downloader delivery
