url: https://www.bfddrums.com/expansions/jex.html
description: Bfd Jex is an expansion for bfd3, bfd eco and bfd2 featuring a
  high-end, custom hand-made kit from xdrum's xotica line.
details: |-
  The package also includes a bonus ludwig snare taken from bfd jazz & funk
  collection. Bfd jex is recorded in the same room and studio conditions as the
  bfd jazz & funk and bfd percussion expansions as well as those used for the
  mapleworks kits in bfd3.

  Kick recorded with 2 beater types. Toms recorded with
  sticks/mallets/brushes/rods. Kick features yamaha subkick mic for extreme low
  end.
specs: |-
  - Expansion for bfd3, bfd eco and bfd2
  - Custom x-drums kick and toms
  - 6-ply keller maple shells
  - Sapeli pommele ply
  - Hand-applied tung oil finish
  - Kick recorded with 2 beater types
  - Toms recorded with sticks/mallets/brushes/rods
  - Yamaha subkick mic for extreme low end
  - Bonus ludwig supersensitive snare
  - Windows 7 or higher
  - Os x 10.6.8 or higher
  - Internet connection for download and authorization
  - Disk space: 15 GB full install, 7.5 GB medium install, 5 GB small install
