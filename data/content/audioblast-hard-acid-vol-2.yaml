details: |-
  Hard Acid Vol.2 is a collection of 128 acid techno presets for the ABX3 Bassline Synthesizer. The soundbank targets producers who want aggressive 303-style basslines and modern acid sounds, pushing the ABX3 synthesis engine into darker and more extreme territories.

  Following the success of Hard Acid Vol.1, this second volume introduces 128 brand-new ABX3 presets designed for producers who want raw, distorted and high-energy acid sounds ready for the underground rave scene. Inside are screaming resonant leads, brutal acid basslines, twisted sequences and modulated acid patterns.

  The bank is aimed at Acid Techno, Hard Techno, Tribe Tekno, Acidcore, Hardcore and Industrial Techno productions. Each preset is built for maximum resonance, movement and analog-style character, so the soundbank works for studio production, live performance and underground rave music.

  The presets are performance-ready: every sound reacts to filter tweaks, resonance sweeps and modulation controls, letting producers create driving acid basslines, hypnotic sequences and rave leads without complex programming. Load a preset, tweak the filter, and the ABX3 acid synthesis engine does the rest.
specs: |-
  - 128 presets for the ABX3 Bassline Synthesizer
  - Aggressive hard acid and acid techno presets
  - Distorted 303-style acid basslines
  - Screaming acid leads and sequences
  - Modulated acid patterns and FX sounds
  - Experimental acid textures
  - Requires the ABX3 Bassline Synthesizer plugin to load the presets
