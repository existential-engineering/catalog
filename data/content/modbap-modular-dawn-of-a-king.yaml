details: |-
  Descriptions

  Digital Download Only. The "Dawn of a King" sample pack is a set of original high-quality, well-designed speaker shaking drums that slap. Some design drums on their eurorack modular systems but hardly any of them are designed with hip-hop, boom-bap, modbap and just about anything urban in mind. As a matter of fact, these are not what you think of when you think eurorack sound design. The "Dawn of a King" sample pack is specially designed to bang hard and loud in your daw or groovebox of choice. These samples will work well with any genre of music.
specs: |-
  - 64 one-shot samples (18 savage kicks, 17 slapping snares, 16 crispy hats, 8 gorilla hand drums and 5 misc. percussion things)
  - Includes MPC expansion kits compatible with MPC 2.0 and above and MPC One / Touch / X / Live
  - Format: 24bit WAV Files
  - Compatibility: Anything that allows the use of wav files - so everything that matters. MPC Software, All DAWS & Samplers
  - License: Royalty-Free
  - Delivery: Download instantly after purchase.
