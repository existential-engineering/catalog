details: |-
  Striking. Shimmering. Strings

  Step into the enchanting world of the Soundpaint Santur, an exquisite hammered dulcimer of Babylonian lineage, echoing through the Balkans, Middle East, and Eastern Europe. With an unwavering dedication to detail, we've deep-sampled this ancient marvel using three sets of wooden mallets, semi-soft, and soft-paired with three distinct damper configurations. This rich diversity of articulations delivers a vivid spectrum of tones, from resonant sustains to lively staccatos and beyond. To fully harness its range of colors, the Santur includes two microphone perspectives: an intimate close-up and an expansive, ambient view. But that's just the beginning of the musical journey with the Soundpaint Santur. Unleash spiritual, textured pads that transport your listeners to otherworldly realms. Summon haunting soundscapes that evoke mysterious echoes in frightening forests: evoking the essence of desert nights, each note a sand dune's whisper. With the Santur, the boundaries of sound are yours to explore!
