details: >-
  12 gods: hermes for omnisphere 2 contains 50 ethereal synth patches inspired
  by the messenger of gods according to the greek pantheon. He usually presented
  wearing his winged sandals and winged helmet.


  The soundbank mainly uses slow evolving amp envelope and with the parallel use
  of an aux reverb it creates airy, dreamy and full of motion soundcolors for
  most of the presets.


  Each patch is a sonic journey to myths and persons connected with hermes
  according to the greek mythology. They are suitable as deep airy pads on
  cinematic and electronic music productions, modern or with more vintage
  approaching.


  Mw is assigned to a 16th note rate vibrato and aftertouch is modulating the
  coarse pitch of the synth.


  Presets were designed with omnisphere 2.8 or and run best with this or newer
  version.
specs: |-
  - 50 ethereal synth patches
  - Slow evolving amp envelope
  - Aux reverb
  - Mod wheel assigned to 16th note rate vibrato
  - Aftertouch modulating coarse pitch
  - Omnisphere 2.8 or newer compatible
