details: |-
  Invoke the sinister power of BFD Dark Farm conjured in the thunderous live
  room of middle farm studio, BFD Dark Farm includes an assortment of
  hard-hitting drums engineered to deliver a distinct roomy punch perfect for
  metal, hard rock, punk, and other forms of aggressive music.

  This premium bfd3 expansion features three drum kits, including an all-copper
  shell kit from q drum co. Copper drum shells are known for their punchy and
  controlled tone perfect for cutting through a dense wall of distorted guitars.

  Opened in 2010 and located in south devon, england, middle farm studios has
  quickly become one of the most recognized and sought-after studios in the
  world for recording drums. The pitched ceiling and stone walls give the
  expansive live room a sound that excels at bringing percussion to life.

  To craft the sounds of bfd dark farm, our engineers took full advantage of
  middle farm's vast arsenal of modern and vintage microphones, outboard gear,
  and the trident series 70 recording console that lies at the heart of the
  studio.

  In addition to meticulously recorded drums, bfd dark farm also includes 287
  individual grooves across 7 groove pallets. These grooves are suited for any
  genre of hard or heavy music such as metal, rock, alternative, doom, or prog.
specs: |-
  - Over 30 fully articulated, multi-sampled instruments
  - 3 drum kits
  - All-copper shell kit from q drum co.
  - 20" crash of doom
  - 15" k light hi-hat
  - 16" k sweet hi-hat
  - 11 cymbals
  - 3 additional snare drums
  - 3 additional kick drums
  - 11 mix-ready presets
  - 287 individual grooves
  - 7 groove palettes
  - Bfd3 expansion
