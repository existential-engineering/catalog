details: |-
  Art conductor Logic Pro (articulation set collection) allows you to control
  instrument articulations. You get over 12000 maps containing over 160.000
  articulations. The collection is constantly being updated with new libraries
  and free updates are supplied.

  All sets are set up in the same way with universal compatibility. The same
  abbreviations and wording are utilized across the entire collection. The
  articulations are listed in alphabetical order and the key switches follow the
  natural order within the instruments.

  The most important switches are on the lowest octave, always in the same
  order. This design enables you to find the right expression fast and control
  it with ease. The product is designed to enable you to focus on your music
  instead of technicalities.
specs: |-
  - Over 12000 articulation maps
  - Over 160000 articulations
  - Logic Pro compatible
  - Key switching
  - Articulation switching
  - Controller data mapping
  - Remote switch definitions
  - Alphabetical articulation ordering
  - Natural instrument key switch ordering
