details: |-
  IR-Pack Vintage Springs is a HOFA-Plugins impulse-response pack collecting historic and modern spring reverbs. The page describes the magic and beauty of spring reverbs as something witnessed on countless productions, with the pack gathering the authentic sonic variations that continue to shape the sound of many stars today.

  The pack is not a standalone plugin. To buy and use the IR-Pack you need either the IQ-Series Reverb V2 or the HOFA SYSTEM IR-Verb, which load the impulse responses as convolution reverb presets.

  The product page lists 150 named impulse responses. They span traditional spring characters (Dense spring, Echoey Spring, Long Spring Open, Stopped Spring, Shaky Spring), gated variants (Gated Cell Punch, Gated Hall, Gated Stall Wide), chamber and digital hybrids (Chamber Rubber, Digiverb Wrinkle, Into Digital, Cyber Spring), and a long run of playfully named metal and fictional-element entries (Adamantite, Kryptonite, Netherite, Octiron, Xirdalium).

  Sound examples are offered on the page through an embedded SoundCloud player, and a Download & Test link points to the HOFA-Plugins downloads area for trying the products before purchase.
specs: |-
  - 150 spring reverb impulse responses
  - Requires IQ-Series Reverb V2 or HOFA SYSTEM IR-Verb as host
  - Covers historic and modern spring reverb units
  - Includes gated, chamber and digital-style spring variations
