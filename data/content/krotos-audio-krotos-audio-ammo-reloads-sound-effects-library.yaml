description: A specialized gun foley collection featuring bullet casings across 9 surface types (concrete, brick, grass, gravel, wood flooring, wood planks, carpet, metal, and vinyl), real-world gun foley from 11 firearms (AK-47, CZ 75, Dragunov SVD-63, FN Minimi, Franchi SPAS-12, GPMG, HK416, MP5, M4 Carbine, MAC-10, and Winchester Levergun), and 5 airsoft gun recordings. Includes 143 Weaponiser presets and is delivered as both a traditional library and an integrated Weaponiser version. All files are royalty-free with embedded metadata optimized for Soundminer and BaseHead.
details: |-
  The Ammo & Reloads Sound Effects Library by Krotos is a highly specialised collection of gun Foley sound assets, ready to use to build fast and flexible sound effects.

  This 1.4 GB library consists of a variety of 3,261 recorded materials including a wide selection of bullet casings dropping on different surfaces such as concrete, brick, grass, gravel and wood flooring. Single and multiple-bounce bullet drops are available for all materials, offering a complete system for weapons projects.

  The library also contains a full collection of real-world gun reloads from 11 different firearms and 5 airsoft guns and sweeteners. Firearms covered include the AK-47, CZ 75, Dragunov SVD-63, FN Minimi, Franchi SPAS-12, GPMG, Heckler & Koch HK416, Heckler & Koch MP5, M4 Carbine, MAC-10 and Winchester Levergun. Airsoft guns include the AK-47, AR-15, Colt 1911 Target, HK45C Compact .45 Cal and Mossberg M590.

  The purchase contains two downloads: a zip file with all source sound effect asset files plus a Metadata PDF, and an installer for the integrated Weaponiser library including assets and presets.
