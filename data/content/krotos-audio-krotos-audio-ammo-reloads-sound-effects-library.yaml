description: A specialized gun foley collection featuring bullet casings across
  9 surface types (concrete, brick, grass, gravel, wood flooring, wood planks,
  carpet, metal, and vinyl), real-world gun foley from 11 firearms (AK-47, CZ
  75, Dragunov SVD-63, FN Minimi, Franchi SPAS-12, GPMG, HK416, MP5, M4 Carbine,
  MAC-10, and Winchester Levergun), and 5 airsoft gun recordings. Includes 143
  Weaponiser presets and is delivered as both a traditional library and an
  integrated Weaponiser version. All files are royalty-free with embedded
  metadata optimized for Soundminer and BaseHead.
