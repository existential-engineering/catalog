name: "Bleed: Distortion Exploration for Rift"
manufacturer: spektralisk
primaryCategory: preset-pack
categories:
  - distortion
url: https://spektralisk.com/products/bleed
description: Colorise, rhythmise, deform, distort. Make your signals bleed. This
  is a collection of presets for minimal audio rift.
details: |-
  This pack explores distortion on various sources. If you're looking for
  inspiration or you want to transform your existing sounds into something new,
  this pack is for you.

  Presets has been divided into several categories depending on the source they
  have been designed to process or the way they affect the sound. It's for
  convenience and general indication but you can of course apply it on any
  material you want.

  Please note that distortion is very sensitive to input volume and frequency
  content, so the results are highly dependent on what you feed into the plugin.

  Contents: 100 presets for rift divided into several categories depending on
  suitable source or the effect: colr - colorise the sound. Rytm - turns
  sustained sound into rhythmic or apply to rhythmic content. Sfx - generate
  weird sound effects. Sins - designed on sine + noise. Drum - drums processing.
  Spce - create space'y sounds.
specs: |-
  - 100 presets for rift
  - Colr - colorise the sound
  - Rytm - turns sustained sound into rhythmic or apply to rhythmic content
  - Sfx - generate weird sound effects
  - Sins - designed on sine + noise
  - Drum - drums processing
  - Spce - create space'y sounds
  - Distortion processing
  - Creative sound transformation
