details: |-
  Microsphere features 4GB of high-tech sound effects focused on the analysis of a hidden sonic universe.

  By recording electromagnetic fields with special equipment, we have captured an exotic collection of hidden sounds, including audible data transmissions, noise-beds, code sequences, noise bursts and other aural artifacts normally concealed from our sensory perception.

  Microsphere comes with 4GB of 24bit 96khz .wav audio content, including abstract interface tones, detailed scientific computations, hyper-dimensional holographic grids, precision motion gesture signals and intricate interference bursts. Whether you are creating complex transitions for a cutting edge electronic music project or building hi-tech weapon effects for a sci-fi shooter game, Microsphere delivers an extraordinary palette of sound that will take your productions into uncharted territory.

  While our sound effects are carefully designed to work with your favorite samplers and DAWs, they pair up particularly well with our own brand of audio contortion devices. Our wide selection of packs grant Palindrome, Polygon, Cataract and Tactic users access to thousands of fresh ingredients.
