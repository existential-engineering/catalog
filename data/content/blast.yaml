details: |-
  Blast is a new sound design library from Ecliptiq Audio. From rumbling subs to
  punchy metal hits, Blast offers a wide range of cinematic impacts and hits for
  an unbeatable price.

  Blast features 200 sound effects divided into 5 categories (impacts, sub
  booms, distant hits, metallic hits, rise & hit). With the help of the custom
  made kontakt engine, you can have the freedom to manipulate every sample to
  your desire.

  You can create additional movement with the 6 dedicated stutter effects. You
  can adjust the parameters of every sample separately, so you can use blast
  multiple times without loading up another instrument.

  Ideal for movie and video game trailer music, making blast a handy tool if you
  are a composer or a sound designer. All samples in the library are 100%
  royalty-free.
specs: |-
