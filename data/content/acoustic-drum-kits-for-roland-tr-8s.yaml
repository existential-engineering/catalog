details: |-
  Acoustic drum kits is a collection of 16 kits for the Roland tr-8s. These kits
  and patterns were sampled from real drum kits which means that no drum
  machines or synths were sampled.

  These sounds and patterns are great for funk, neo soul, jazz, hip hop, trip
  hop or any other style that requires real sounding drums.

  All the kits have demo patterns to start banging beats right away.

  All the kits are gm MIDI compatible, you can feed them gm MIDI loops and
  everything will sound fine and dandy.

  All the kits are based on samples meticulously recorded from acoustic sources.
specs: |-
  - 16 drum kits for Roland tr-8s
  - GM MIDI compatible
  - Demo patterns included
  - Acoustic drum samples
