details: |-
  All sounds are suitable for fast melodic lines and focused primarily on
  cinematic, electronic and rock productions.

  There are 14 fast legato leads and 36 fast polysynths.

  Both omnisphere's oscillators and sample soundsources used to create this
  soundbank.

  Mw adds vibrato and aftertouch is modulating the coarse pitch of the sounds.
