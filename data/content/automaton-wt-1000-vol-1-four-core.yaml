description: This month we introduce a new series of algorithmically constructed
  wavetable packs.
details: |-
  For this first such pack four wavetables are created and then modulated and
  morphed with each other, crushed and mutilated and mixed into one final
  wavetable. The algorithm randomizes all the available parameters and creates a
  new wavetable file at each pass, resulting in 1000 unique wavetable files.

  Some are crazy, some are tame, some are all over the place, some are very
  basic, some are beautiful, some are renegades.
specs: |-
  - 1000 unique wavetable files
  - Cycles per table file: 100
  - Cycle size: 2048 samples
  - File format: .wav 16-bit, 44100, mono
  - Algorithmically constructed wavetables
  - Wavetable modulation and morphing
  - Compatible with Ableton
  - Compatible with dune 2
  - Compatible with Serum
