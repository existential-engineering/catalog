details: |-
  Completely One Of A Kind

  Think you know what a 12 String Guitar is? Maybe not when we're speaking about the incredibly inventive and talented Oliver Codd. This beautifully simple and experimental instrument is constructed using two steel 6-string guitars, and was crafted specifically for performance in the virtual domain. Each note is created by re-tuning all of the strings to one gigantic unison note, resulting in an ultra rich, ensemble-like sound. Exciting new vistas of creativity are opened up through sampling, and all of the lovely tonality of this 12 String instrument can now transcend the limitations of physical performance. Oliver's 12 String Guitar can produce huge variations in sound depending on the range that is being played. In the lowest register, it evokes a string ensemble, while the mid-and-upper ranges conjure spirits of bagpipes, hurdy gurdys, and even church organs. Through the powerful Soundpaint engine, these organic sounds are pushed far beyond the natural world into all new sonic territory, creating highly emotional pads, arps, and even synths, each full of heart and character.
