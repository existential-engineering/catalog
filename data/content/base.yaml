details: |-
  'Base' from Flame Audio features five fresh construction kits containing trap
  loops and MIDI files inspired by top-notch artists such as gucci mane, migos,
  young thug, future, juice wrld, lil uzi vert, travis scott & more.

  The kits contain insane chord progressions, melodic sequences, pianos, bells,
  808, and of course MIDI files so you can rework to fit into any project.

  This pack is your key to professional beats and a must-have for any producer
  looking to build up their sound library.

  All loops are royalty-free so you can use them into your commercial
  compositions with no extra costs.
specs: |-
