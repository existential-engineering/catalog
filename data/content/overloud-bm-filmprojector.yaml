details: |-
  BM Filmprojector is the th-u expansion library, created by bert meulendijk,
  created by capturing two rare filmprojector amplifiers: the filmosound 385 and
  the aq-2. '50s film projectors were hiding some great tube amps inside which
  nowadays are being converted into amazing guitar amps. Very simple but first
  class powerful dynamic amps with just a volume and a tone pot.

  The library contains 32 rigs based on the following amplifiers: the filmosound
  385, used by guys like blake mills and anthony wilson, which is even one of
  tim pierce's favorite amps. The military aq-2, a fantastic tight and dynamic
  tube amp which can be heard on blake mills' 'heigh ho' album. Both are
  carrying the original mullard tubes. This is really something special and very
  useful for all you clean, clean +, break up, crunch and crunch+ sounds.

  The library also includes two unique effects designed with bert meulendijk.
  The stryverb is a rich and lush reverb effect, with a long and modulated tail,
  with a very modern vibe. The parallel compressor includes a parallel knob
  which allows to blend the direct to the compressed tone, in order to have a
  full control over the dynamic of the instrument.

  Th-u is the first amp simulator which includes both the amp modeling and
  capturing technologies. The rig models are created from real setups: the
  overloud proprietary technology allows to capture the response of an entire
  rig, including the nonlinear and dynamic response of the amplifier, the
  cabinet, the microphones, the mic preamplifier and the room sound. The rig
  player, integrated into th-u, allows you to reproduce any nuance of the
  sampled rigs and to combine the models of different setups.

  Th-u is available as audiounit, VST, aax64 (protools 11 and 12) plugins, as
  well as a standalone application. From version 1.1.3 only 64-bit are natively
  supported for macos 10.15 catalina compatibility. From version 1.2.5 it is
  natively compatible with apple silicon (except AAX). You can authorize th-u on
  up to three computers that you own and one USB stick with a simple one-click
  software procedure (no hardware key needed).
