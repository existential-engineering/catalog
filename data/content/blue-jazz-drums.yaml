details: |-
  BLUE: Jazz Drums provides the essential backbone of jazz music production,
  featuring three of the finest jazz drum kits in the world, over a thousand
  jazz drum loops, and extensive control over each element, all packaged into
  one comprehensive Kontakt player-powered virtual instrument.

  The featured kits contained in blue are a dw collectors series kit and a
  slingerland jazz series kit, circa 1978 (featuring a 1965 slingerland snare)
  plus a selection of zildjian cymbals. The dw collectors series kit has been
  recorded both with sticks and with brushes.

  All drums were recorded in 24-bit through a selection of the world's finest
  mic pre's, including neve 1073s, true precision 8s, and lachapell 992egs.

  The interface of blue offers complete control over the sound and behavior of
  the kit, including individual control of direct, overhead, and room mics, eq,
  additional humanizing control, reverb, convolution, and a huge complement of
  effects such as distortion, lo-fi, phaser, chorus, flanger, and more.

  The loops portion of the library features more than one thousand live recorded
  grooves played by various drummers in various tempos and styles. The loops are
  presented in two formats: as whole loops that automatically tempo-sync to host
  tempo, and in rex-style loop slices, allowing the player to reassemble new
  loops from individual slices.
