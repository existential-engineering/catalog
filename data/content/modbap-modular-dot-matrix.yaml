details: |-
  Descriptions

  Digital Download Only. BeatPPL collaborates with Noise Engineering to launch the massive official Noise Engineering sample collection, including sounds from Basimilus Iteritas Alter and beyond. All of the samples in this pack are expertly sampled and processed via various eurorack modules and samplers. All samples are gain staged to leave enough headroom for you to apply your favorite compressors, transient processing and boosts for that extra bit of your favorite personalized slaps. The Dot Matrix samples are perfect for edm, hiphop, modbap, techno, house and all forms of electronic music production.
