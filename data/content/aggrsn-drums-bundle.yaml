details: |-
  The Aggrsn Drums Bundle includes a total of eight unique drum mix presets
  designed for producers of trailer music, edm, rock, metal, synthwave,
  underscore and everything in between.

  This 11 gb duo comes packed with a varied arsenal of 47 unique sound design
  patches, ranging from synths (of all kinds) to guitars, piano, celli,
  processed percussion, acoustic experiments, battlecries, tonal/percussive
  pulses and so much more.

  Renegade is a drums and sound design library designed for producers of
  nu-metal, edm, rock, pop and underscore. Musical sampling aimed to make this a
  serious asset for modern underscoring with atmospheric percussion/synth
  pulses, brooding basses and experimental acoustic content.

  Medusa is a modern ensemble drum library created for trailer producers as well
  as film, game and television composers. Musical sampling also made it a point
  to smack the living snot out of the drums for the top velocities.

  Both renegade and medusa were also produced to compliment each other, capable
  of taking care of an avalanche of aggressive musical contexts.
