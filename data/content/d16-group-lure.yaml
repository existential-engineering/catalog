description: Sound Expansion for Lush 2
details: |-
  Lure is a meticulously crafted collection of 130 unique sound presets for the Lush 2 synthesizer, designed by sound designer Daniel Stawczyk (Status) to complement Lush 2's multilayer subtractive synthesis architecture. Each preset is designed to seamlessly integrate with Lush 2, allowing easy tweaking and customization to fit an individual style.

  Every preset exudes a raw, unpolished quality that adds authenticity and depth, suited to producers seeking organic, analog warmth. Dynamic sequences with complex, evolving patterns add rhythm and movement, making tracks more engaging and lively.
specs: |-
  - 130 exclusive presets for the Lush 2 synthesizer
  - Raw, unpolished analog-warmth character
  - Dynamic, evolving sequence presets
  - Requires Lush 2 version 2.1.0 or newer
