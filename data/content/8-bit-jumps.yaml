details: >-
  The 8-bit jumps sample pack is a collection of 8-bit jump samples, with basic
  boings, quick risers, long leaps and springing bounces.


  The 8-bit samples are separated into three sound categories: basic jumps:
  simple 'boing' sounds with quick rises in pitch. Unique jumps: these jumps
  have more character, such as uneven movement or dual pitches. Spring jumps:
  two-part jump sounds with a short push-off and the jump itself.


  This pack contains: 100 8-bit jump samples (basic jumps, unique jumps & spring
  jumps). 1 sfx patch for native instruments kontakt, ableton live, maschine,
  logic pro exs24/sampler, fl studio, mpc expansion pack, and tal-sampler.
  24-bit, 44.1 khz wav files.


  8-bit jumps is part of the 8-bit sound effects bundle.
