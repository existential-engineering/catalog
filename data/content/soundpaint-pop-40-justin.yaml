details: |-
  Are you a drum belieber? Rev up your Rhythm game with a Juvenile, Justified, Jamboree of Jittery Jolts! Inspired by the drum kits of today's top 40 artists, Pop 40 Drums delivers the perfect blend of R&B, Bubblegum Pop, and Hip Hop - giving you the tools you need to create your own chart-topping hits. Are you tired of feeling limited by the same loops that everyone else is using? It's time to upgrade your sound with Pop 40's "post apoca-loop" beats! Let your imagination take control and create the perfect rhythm and flow. We also keep the mapping simple and symmetrical across all Soundpaint drum kits, so it's easy to mix, match, and morph drums to your heart's content. Each program has an pre-programed ARP pattern - a great way to get the ball rolling. Customize the arp, play on top of it, or turn it off and get into all the details; there's no wrong way to get grooving! It's easy, flexible and fun to play, so you can get start jamming right away!
