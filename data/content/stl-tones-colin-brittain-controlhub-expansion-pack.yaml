details: |-
  Colin Brittain is a standout producer, songwriter and multi-instrumentalist known for crafting high-impact, emotionally charged records that cross genre boundaries. His production and writing credits include Papa Roach, One OK Rock, All Time Low, 5 Seconds of Summer, A Day To Remember, Dashboard Confessional, Story of the Year, 311 and Hands Like Houses, with multiple number one Mainstream Rock singles and back-to-back number one debut albums. In 2024 he joined Linkin Park as co-producer and drummer.

  With a signature blend of polished precision and raw energy, his work has powered releases for major artists across rock, pop, and alternative music, earning him a reputation as one of the most versatile and sought-after producers in the industry today.

  Built around Colin Brittain's hybrid mixing workflow, this expansion faithfully recreates the signal chains behind his signature production style, a powerful blend of polished precision and raw energy.

  This expansion pack has a total of 33 captures.
