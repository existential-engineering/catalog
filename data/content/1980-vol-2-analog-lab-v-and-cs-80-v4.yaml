details: |-
  1980 vol.2 for arturia cs-80 v4 and analog lab v synths contains 30 presets
  derived from the classic 80's sound era and carrying this distinct cs-80 sound
  identity.

  This soundbank has 30 classic pads that could also be used as polysynths in
  terms of performance.

  In some presets the envelopes that modulate the filters could introduce some
  interesting nice flaws and additional note could be heard when releasing the
  keys. If you would like to avoid this one then turn the slider of filter
  release (the first yellow sliders with the r sign below them for each
  different channel) or even turn down all sliders that adjust the filters
  envelopes (the sliders with il, al, a, d and r signs below them).

  Chorus and tremolo in the down part of the synth play an important role for
  most presets and give an additional vintage 80's touch to the sounds.

  All macros are assigned to ring modulation, reverb, osc mix and low pass
  filter cut-off frequency. Using aftertouch is pretty much unpredictable and
  could affect elements like filter and osc pitch modulation in conjunction with
  the sub osc of the synth.
specs: |-
  - 30 presets
  - Classic pads
  - Ring modulation macro
  - Reverb macro
  - Osc mix macro
  - Low pass filter cut-off frequency macro
  - Chorus
  - Tremolo
  - Filter envelopes (il, al, a, d, r)
  - Sub osc
  - Aftertouch support
  - Cs-80 v4.1.0.2880 (x64) or newer
  - Analog lab v 5.6.0.2890 (x64) or newer
