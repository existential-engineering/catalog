details: |-
  Cinematic Shock is a vital addition to Weaponiser, a library for sound designers working in film, trailers, games, and beyond. Featuring 28 new Weaponiser presets plus a standalone WAV asset pack, it gives creators what they need to design hard-hitting, tension-filled cinematic moments.

  From bone-shaking impacts to tension-building transitions, every element in this library is built for power, clarity, and immediate usability.

  The included Weaponiser presets allow sounds to be performed and shaped in real time. Sounds can be created using MIDI in a DAW, directly in sync with footage, or performed with a MIDI controller in real time.

  All of the assets are also supplied as WAV files for use in any application, with any DAW or editor, without needing Weaponiser.

  Contents include 28 dynamic, cinematic-ready Weaponiser presets, a complete library of standalone WAV files of every included asset, and impacts, builds, risers, drops and hybrid hits. Keywords cover deep low-end booms, high-impact stingers, reverse builds, metallic slams, sub-bass drops, hybrid hits, energy swells and tension risers.
