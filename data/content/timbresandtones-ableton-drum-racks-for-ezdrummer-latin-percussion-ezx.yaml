details: |-
  Ableton Drum Racks for ezDrummer Latin Percussion EZX features all presets for
  the toontrack ezdrummer latin percussion ezx. These racks are the most
  complete integration between Ableton live and toontrack ezdrummer including a
  host of features ready to use on Ableton push. All factory presets are ready
  to go.

  New in v1.1 multiple audio channel output presets and ableton live multi out
  template specifically designed for latin percussion ezx multi channel audio
  routing.

  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all latin percussion ezx factory presets from
  ableton push controller device browser.

  Mapped ableton macros to ezdrummer macros with preset values for ease of use
  in push and simple to use automation programming. Audio routing options.
  Singleout presets featuring 6 ableton drum racks for all factory presets
  single audio output to single ableton track. Mixing can be further enhanced
  through ezdrummer mixer or additional ableton audio effects to the track for
  example the new ableton 10 drum buss. Multiout presets featuring 6 ableton
  drum racks for all presets in multiple audio channel output from the plug in
  to multiple ableton audio tracks using the multi output ableton template also
  provided.

  Use the template racks and extend to your own presets for the latin percussion
  kit, swapping out individual sounds or articulations within ezdrummer, or by
  adding your own mixing effects. You are 100% ready to go with the factory
  presets but there is no limitation to creating your own presets from these
  templates.
specs: |-
  - 12 Ableton drum racks
  - Color coded pad design
  - Individually labelled drum rack pads
  - Mapped Ableton macros to ezdrummer macros
  - Singleout presets with 6 Ableton drum racks
  - Multiout presets with 6 Ableton drum racks
  - Multi channel audio output
  - Ableton push 2 color pads mode
  - Ableton live 9.5 or above
  - Toontrack ezdrummer2 required
  - Toontrack latin percussion ezx pack required
