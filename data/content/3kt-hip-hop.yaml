  3kt Hip Hop is a shimmering collection of 3 hip hop kits rich in elements of
  orchestra, trance, and funk in a hip hop setting.

  There are 48 loops, 8 one-shot drum samples, and 5 MIDI files. Don't let the
  size of this pack fool you, it is very big in sound.

  You'll get strings, basses, kicks, snares, high hits, claps, pads, pianos,
  cellos, violins, and percussion.

  Tempos range from 096 bpm to 103 bpm. 24-bit 44.1khz stereo file.

  Formats include (44.1khz 24-bit): acidized wav. Apple-looped aif.
