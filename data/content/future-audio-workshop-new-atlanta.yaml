details: |-
  Multi-platinum producer Richie Souf (Future, Young Thug, Playboi Carti, Gunna) returns with a new pack of fresh, futuristic 808s straight from his Atlanta studio.

  Richie started out making beats in the early 2000's with Fruity Loops. After developing a following online, he started working small sessions in home studios with local rappers. Today, he's defining the sound of a new generation of hip-hop.

  Fresh off producing Kodak Black and Gucci Mane's new collab, Richie Souf put together New Atlanta (part 1).

  This is a collection of 15 mix-ready, bread and butter 808s with a futuristic spin created by Richie exclusively for SubLab XL. Use them in your track as-is or tweak to make them your own.

  Once your purchase is complete, the pack shows up in your FAW account. Download the zip file and follow the instructions on how to import the sounds into SubLab XL.
specs: |-
  - 15 patches for SubLab XL
  - Patches: Baby Pluto, BussDown, Casino, Dummy, Dweller, Extendo, Fashion Killer, Flooded, Full Auto, Junior, Sheisty, Souf, Trasher, Toven, Trunk
  - Designed by Richie Souf exclusively for SubLab XL
  - Delivered as a zip download from your FAW account, imported into SubLab XL
