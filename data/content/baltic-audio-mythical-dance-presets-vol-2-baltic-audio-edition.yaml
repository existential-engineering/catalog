details: |-
  'Mythical Dance Presets Vol 2 (baltic audio Edition)' by CESA SAMPLES includes 128 professionally designed presets for Sylenth1, capturing the energetic sound of 2000s Hands Up, Hard Dance and EDM.

  Inside are leads, basses, plucks and synth sounds, crafted for a clean, polished and production-ready sound.

  This soundbank suits classic Hands Up productions as well as modern Hard Dance and Hypertechno tracks.

  Requirements: LennarDigital Sylenth1 is required to use the included presets. Sylenth1 is not included with this product.

  Please note: This reduced baltic audio Edition contains the 128 Sylenth1 presets only. Samples, kicks, melody loops and other audio files included in the original CESA SAMPLES edition are not included.
