details: |-
  Deep. Solo. Taikos

  Step into the thunderous power of Soundpaint Solo Taiko Drums, an immersive and masterfully crafted library that sets a new standard for solo Taiko sampling. Completely reimagined with over 7,000 samples and dual microphone positions, this collection offers a flawless playing experience in Soundpaint. Recorded with the iconic Emeryville Taiko ensemble, led by Taiko master Susan Horn, this library embodies the full spectrum of traditional Japanese drums—from the resonant depths of the grand O-Daiko to the crisp, staccato strikes of five Chu and Okedo Daiko and four Shime-daiko. It features an array of unique articulations like rimshots, clacks, alternative sticks, and the rare Tekkan—a metal rod originally part of a cannon, producing a sharp, reverberant sound that cuts through the ensemble. This metallic accent complements the rich, deep drum tones, adding striking contrast. With up to 6 velocity layers and 10 round robins per articulation, every hit and resonance feels organic and dynamic. Recorded in the same hall as our Epic Taiko Ensemble and Epic Frame Drums, this library is crafted to pair beautifully with Epic Taiko Ensemble, sharing identical drum and mic setups for a seamlessly cohesive Taiko performance in Soundpaint. Experience the raw, powerful pulse of Taiko in an instrument that's as profound as it is precise.
