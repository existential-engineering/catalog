description: A magic-themed SFX library covering magic and elemental spells for a huge range of spell types, joined with the performative workflow of Reformer Pro.
details: |-
  SoundMorph Elemental is a magic-themed SFX library, covering magic and elemental spells for a huge range of spell types. Magical element sound effects join forces with the powerful and performative workflow of Reformer Pro.

  Use your microphone, MIDI or dynamic input in Reformer Pro to quickly perform spell motions in the DAW, saving time and effort in dragging and dropping layers and adjusting timings.

  This SFX library features over 3 GB and 650 sound file assets designed by SoundMorph, with 96kHz/24-bit assets across 60 Reformer Pro sound packs. Magic sound design can be one of the most rewarding and most challenging of all genres to create in, so SoundMorph made Elemental as a complete magic sound collection.

  This sound effects library covers all the spells you would expect to find in any turn-based, action RPG, MMORPG or MOBA game, plus fantasy films, TV shows and podcasts. Sound categories: Earth, Fire, Electricity, Ice, Neutral Cast, Sand Cast, Water Cast, Wind Cast, Spirit Neutral, Spirit Evil, Spirit Good, Evil Casts, Good Casts, Incineration Cast, Acid Cast, Loops, Poison, Evil Breath, Fireballs, Raw Recordings, Sweetener Layers, Impact and Throws.
