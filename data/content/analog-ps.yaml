details: |-
  Analog PS brings 200+ pads to padshop pro. The sampled instruments in the
  analog collection were designed on an elektron analog 4 containing mostly
  musical instruments with a few FX thrown in.

  There are 10 different presets for each of the 200 instruments in a different
  style, each style making use of padshop's synth engine, which adds up to 2000
  presets.

  All presets use aftertouch and the modulation wheel for live manipulation of
  various parameters.

  Each sampled instrument has a preset in the following categories: bright
  single synth with an open low pass filter, dual 1 and dual 2 using both synth
  engines in different ways, high pass using a high pass filter, lead simple
  lead versions, mellow single synth with a more dulled sound, slow 1 and slow 2
  slow attack categories, stab with short filter envelopes good for arps, and
  verby single synth using reverb.

  Total sampled instruments: 209; total presets: 2090
specs: |-
  - 200+ pads for padshop pro
  - 209 sampled instruments
  - 2090 total presets
  - 10 different presets per instrument
  - Aftertouch support
  - Modulation wheel control
  - Padshop synth engine
  - Bright preset category
  - Dual synth engine presets
  - High pass filter presets
  - Lead presets
  - Mellow presets
  - Slow attack presets
  - Stab presets
  - Verby presets with reverb
