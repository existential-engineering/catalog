details: >-
  Annihilation contains 100 raunchy sounds for drum and bass, dubstep, grime and
  drumstep producers. We've dug deep into zebra's feature set to bring you some
  absolutely massive basses, crazy sound effects, exotic leads and sublime pads.


  Genres: dubstep, drum & bass, breakbeat, moombahcore.


  Bryan 'xenos' lee has worked as a sound designer for such companies as native
  instruments, cakewalk, rop papen inspiration soundware, refx, camel audio,
  image-line and many more. His work is found in the factory presets of such
  synths as z3ta 2, alchemy, gladiator, punch, toxic biohazard, scanned synth
  pro 2, chipsounds, dcam synth squad, d.I.v.a., etc.
