details: |-
  Soundtrack loops presents 50 beats for hip hop. You'll get 50 mixed beats with their corresponding layers and tracks isolated by drum instrument.

  Each beat is 8 measures in length and when split in half provides two slight variations. There are drum fills at the end of every fourth measure providing two fills per beat.

  Folders are organized by drum instrument. There are: mixed beats, hi hats, snares, percussion, and kicks. This will allow you to mix and match and also have full control over the mix of each layer.

  Good for crunk, hip hop, r & b, juke, and hyphy. Instruments other than drums heard in the demo are not included.

  Formats include (44.1khz 24-bit): acidized wav. Apple-looped aiff. Recycle .rx2.
