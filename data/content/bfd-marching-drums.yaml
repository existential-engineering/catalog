description: BFD Marching Drums is an expansion pack featuring marching band
  drums and percussion for your bfd3, bfd eco or bfd2 installation.
details: |-
  The bfd marching drums snares offer explosive crack and punch while the 4
  sizes of tonal bass drums rival celebrated analog drum machines for sheer
  low-end power.

  Other highlights include hand cymbals, quad marching toms and bonus percussion
  sounds such as a brake drum repurposed from an old cadillac.

  Bfd marching drums is expertly recorded by john emrich using a wealth of
  experience in studio engineering and as a former chief musician in the us navy
  band.

  System requirements: windows 7 or higher (windows) or os x 10.6.8 or higher
  (mac), bfd3 installation, internet connection for download and authorization,
  disk space requirements: 15 gb for a full install, 7.5 gb for a medium install
  and 5 gb for a small install.
specs: |-
  - Expansion for bfd3, bfd eco and bfd2
  - Marching drums, cymbals and percussion
  - Explosive snares
  - 4 sizes of tonal bass drums
  - Quad marching tom sets
  - Hand cymbals
  - Bonus percussion sounds including brake drum
