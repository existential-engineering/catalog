details: |-
  Michael Britt is the guitarist for country group Lonestar, who have had nine number one songs and sold millions of albums worldwide. He has worked with many of the best musicians, writers and producers in Nashville, and outside Lonestar is one of the most well-known and respected commercial Kemper profile creators.

  The 2020 Pack contains some of Michael's all-time favorite amps, covering all the food groups: the best vintage Plexi he has ever heard, a couple of his favorite AC-type circuits, classic tweed, blackface and brownface tones, and a few unique amps that fall somewhere in between.

  Michael's pack contains 126 captures.
