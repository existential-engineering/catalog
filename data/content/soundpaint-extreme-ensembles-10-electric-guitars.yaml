details: |-
  Unleash the Guitar Battalion

  An unparalleled, unapologetically extreme sound, this massive ensemble of 10 electric guitars with 10 top-notch amps all playing in unison was recorded in our favorite orchestral hall. We recorded tons of playing techniques and styles with and without amps to get the most out of this totally unique ensemble. From epic and strong to dreamy and vast, the range of this ensemble will satisfy any desire for a truly distinct guitar experience. Within this ensemble, sounds are divided into 3 categories: Shorts, Sustains, and Effects. From dynamic, faster, and muted shorts to exquisite sustains with or without vibrato, impactful power chords, textured muted strums, as well as enchanting harmonics and tremolos, the range of expressive and powerful possibilities is vast. The extensive Effects section adds character with slides, punches, feedback, frets, scrapes, strums, and more. Whether you desire an intimate and focused sound, a balanced and natural ambience, or an expansive and atmospheric texture, our close, decca tree, and wide microphone options provide the perfect tools to achieve your desired mix.
