details: |-
  A Symphony of Harps

  The breathtaking Harp Ensemble brings the rich and ethereal sound of four harps together in one magical hall. The sound is full, lush, and enchanting - from the width of the hall to the resonant decay of each note. The dazzlingly beautiful sustained plucks are sure to instantly transport you to a magical world of inspiration, but we didn't stop there. We recorded a huge variety of plucks, techniques, effects, and glisses. Along with the sustained plucks, there are several varieties of staccato (short) plucks, tremolo, harmonics, savage plucks, body slaps, horrifying harmonic glisses, and more. The iconic harp gilssando transforms when played by an ensemble. In addition to unison glisses at various speeds up and down, there are continual waves and asynchronous chaos - spreading the sound out across the full ensemble. Soundpaint gives you the perfect tools to manipulate the TIME and pitch of the glisses, seamlessly and instantly.
