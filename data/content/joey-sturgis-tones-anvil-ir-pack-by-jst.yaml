details: |-
  The ANVIL IR Pack by JST is a collection of strategically captured impulse responses brought to you by Joel Wanasek and Joey Sturgis Tones.

  With ANVIL, we've done the hard work for you by going through all the speaker and mic combinations, finding the ones that stand out, testing them in mixes, and then processing them so that you can quickly click, and get the perfect tone for your mix.

  Whether you're going for crushing rhythms, ripping leads, or modern clean tones, the ANVIL IR pack has the right Impulse Response to get your guitars sounding awesome. These impulse responses are great for creating tones from scratch, getting a fresh sound from your favorite amp sim, reamping existing tones, and mixing your guitars with the right tonal balance.

  Captured, mixed and processed by Joel Wanasek, Joe Wohlitz and Rob Honson at Joel's JTW Recording Studio, and Silent City Recording Studio in Leeds, UK.
