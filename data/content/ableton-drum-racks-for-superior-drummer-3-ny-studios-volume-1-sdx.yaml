details: |-
  Ableton drum racks for superior drummer 3 ny studios vol. 1 sdx features
  separate Ableton drum racks for all factory presets for the toontrack superior
  drummer 3 ny studios vol. 1 sdx expansion library. These racks provide out of
  the box integration workflow between Ableton live and toontrack superior
  drummer 3 including a host of features ready to use for composition and
  performance using Ableton push or similar controllers.

  All factory presets are ready to go in this massive library that covers kits
  for all genres: pop, rock, soul, funk, country, heavy rock, reggae, metal.

  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all sd3 ny studio vol. 1 sdx library factory
  presets from ableton push controller device browser.

  40 ableton drum racks to instantly load the sd3 ny studio vol. 1 sdx library
  "mix ready" presets with ableton mappings. 20 ableton live templates designed
  to host the multi channel output routing presets with track level audio
  routing from superior drummer 3 into ableton live.

  Colour coded pad design for visual performance and finger drumming. All our
  racks use consistent drum rack colouring so you can visually and immediately
  spot your rides from your hi hat articulations. Vast array of instrument
  articulations ready to go in one massive layout using ableton push 64 pad
  layout mode.
specs: |-
  - Ableton drum racks
  - Ableton push integration
  - 40 Ableton drum racks
  - 20 Ableton live templates
  - Multi-channel output routing
  - Colour coded pad design
  - 64 pad layout mode
  - Individually labelled drum rack pads
  - Ableton macros mapped to toontrack superior drummer macros
  - Singleout presets
  - Multiout presets
  - Audio routing and mixing
  - Ableton track mixer integration
