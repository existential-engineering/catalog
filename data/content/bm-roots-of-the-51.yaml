details: |-
  BM Roots of the 51 is the capture of the amp that first launched the evh line:
  the 5150iii 100-watt head. It's the holy grail of tone that eddie van halen
  has chased his whole life. The capturing sessions were made at the sandlane
  studio, a studio specialized in recording hi-gain hard rock and metal.

  The bm roots of the 51 is created after an extensive capture of 85 rigs
  (including 9 di rigs), created with multiple speakers, microphones and
  distortion pedals: mesa 2x12" (v30). Marshall 1960 (g12h greenback). Marshall
  1976 (g12h blackback). Bogner 412 (v30). Sm57, r121, u47, md421, m160 mics.
  Ts9 tube screamer. Jackhammer jh-1 booster. Hellmouth booster.

  Both the red and blue channels have been captured. The library also includes
  two unique effects designed with bert meulendijk: the stryverb is a rich and
  lush reverb effect, with a long and modulated tail, with a very modern vibe.
  The parallel compressor includes a parallel knob which allows to blend the
  direct to the compressed tone, in order to have a full control over the
  dynamic of the instrument.

  Bm roots of the 51 by overloud is a virtual effect audio plugin and soundware
  (samples or presets that load into other products) for macos and windows. It
  includes, and is therefore "powered by", th-u essentials, which functions as a
  VST plugin, an audio units plugin, a VST 3 plugin and an AAX plugin.
