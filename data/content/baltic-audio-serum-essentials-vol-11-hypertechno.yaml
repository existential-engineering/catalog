details: |-
  'Serum Essentials Vol. 11 - Hypertechno' is a preset pack for Xfer Serum designed for modern Hypertechno, Hands Up, Dance, Slap House and high-energy EDM productions.

  The pack includes 64 royalty-free Serum presets and 50 MIDI files taken from the demo, giving ready-to-use leads, basses, plucks, gated pads, synths, vocals, reeses, arpeggios and sequences for energetic melodies, driving basslines and festival-ready drops.

  Requirements: Xfer Serum version 1.3.5.7 or higher is required.

  Please note: The full demo drums and FX are not included, except for some kick-style presets included in the soundbank.
specs: |-
  - 64 Presets for Serum
  - 17 Leads (Presets)
  - 16 Basses (Presets)
  - 10 Plucks (Presets)
  - 5 Synths (Presets)
  - 4 Drums (Presets)
  - 3 Pads (Presets)
  - 3 Vocals (Presets)
  - 2 Reeses (Presets)
  - 2 Arpeggios (Presets)
  - 2 Sequences (Presets)
  - 50 MIDI files
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
