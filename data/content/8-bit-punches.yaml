details: |-
  Knock yourself out with this collection of 8-Bit Punches samples, with sounds
  from each of the classic punch types as well as some special punches and
  misses. The 8-bit sounds are separated into seven sound categories: power
  hits, jabs, crosses, hooks, body blows, uppercuts, and misses.

  Power hits: big full sounding punches with a lot of force behind them. Jabs:
  quick single hits to the face. Crosses: harder follow-up jabs with the
  dominant hand. Hooks: hits coming around from the side. Body blows: low direct
  punches right into the gut. Uppercuts: blasts up through the chin from below.
  Misses: swish sounds for when the punch just doesn't land.

  This pack contains: 104 8-bit punch samples (power hits, jabs, crosses, hooks,
  body blows, uppercuts & misses). 1 sfx patch for native instruments kontakt,
  ableton live, maschine, logic pro exs24/sampler, fl studio, mpc expansion
  pack, and tal-sampler. 24-bit, 44.1 khz wav files.

  8-bit punches is part of the 8-bit sound effects bundle.
