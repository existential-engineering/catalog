details: >-
  Loop wax presents 90s garage tools volume 2 by jeremy sylvester, the second
  instalment of this very sought after sample pack series specifically focusing
  on 90s garage & house music production, created by one of the biggest
  producers and pioneers on the scene jeremy sylvester, famed for his work with
  legendary record labels such as nice n ripe records, azuli records + many
  others.


  This very exclusive sample pack contains all the elements needed to create
  explosive 90s style garage & house grooves and contains drum loops, ones
  shots, vocal hooks, chord riffs, fx, cymbals, kicks, snares, claps, hi hats
  and percussion all in glorious 24-bit wav format for easy use within all
  DAW's.


  All loops within the pack are set to 126 bpm and includes some MIDI files. All
  the elements you need to create professional 90s style garage/house production
  with a crisp modern edge to it. There are enough elements contained in the
  pack to create many of your own tracks.


  This pack is also extremely useable for modern deep house, funky house, jackin
  house, uk garage, tech house, mainstream dance and much more. Use your
  imagination and create superior and stand-out tracks for the dance floor.


  Volume 2 is bigger and better with even more professionally produced sounds
  designed by the man himself. Don't forget to check out jeremy sylvester's
  tutorials on youtube via urban dubz music for tips and tricks in 90s music
  production.
