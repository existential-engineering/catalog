description: Discover Spitfire's secret weapon — a collection of tuned
  percussion sounds created from 'found' glass, metal and china, morphed, warped
  and sequenced into metallic hits, rhythmic tension beds, distorted sub basses
  and epic, shimmering pads.
details: |-
  Discover Spitfire's secret weapon — a collection of tuned percussion sounds created from 'found' glass, metal and china, morphed, warped and sequenced into metallic hits, rhythmic tension beds, distorted sub basses and epic, shimmering pads. Recorded on our dry stage at Spitfire Studios, 45 instruments and objects ranging from metal bowls to wine glasses were played by world renowned percussionist Paul Clarvis in innovative ways to achieve a variety of unidentifiable sounds and glistening overtones. Presented in our versatile eDNA interface for instant playability and inspiration, we also give you 235 presets, designed to inspire and take your compositions to new places.
specs: |-
  - 45 instruments and found objects played by Paul Clarvis
  - eDNA sample-synthesiser engine with gate sequencer and FX
  - Preset groups: Cinematic rhythms, Cinematic systems, Construction kits, Disturbed morphs, Hand blown pads, Raw glass and steel
  - Recorded on the dry stage at Spitfire Studios, London
  - 1.60 GB download size
  - 3.20 GB disk space required during install
  - Requires Kontakt Full
  - macOS 11 to OS 26 (Kontakt 8.8 requires macOS 14 minimum)
  - Windows 10 or 11 (64-bit)
  - Minimum 8 GB RAM, 16 GB recommended
  - Spitfire Audio App required
