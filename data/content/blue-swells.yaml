description: Blue Swells, 142 multi-sample presets for arturia emulator ii v &
  analog lab v Blue Swells pushes arturia emulator ii v & analog lab.
details: |-
  Blue swells pushes arturia emulator ii v & analog lab v to the limit using all
  features available, like velocity or mod wheel modulations, including delay,
  chorus, reverb, bitcrusher, eq or compressor for big, wide modern and gritty
  sounds. You will find great patches to fit into your own music productions.

  Crafted multi-sample retro-modern wavetable sounds from iconic synths
  including ppg wave 2, ensoniq fizmo, ensoniq mirage with soundprocess: the ppg
  wave 2 is the legendary 1980's digital/analog hybrid machine that inspired
  generations of synths to come. The wave 2 featured digital oscillators capable
  of producing up to 8000 unique waveforms modified by analog filter and
  amplifier circuits. The fizmo is a 48-voice synthesizer which uses
  2nd-generation transwave technology to create very organic sounds unlike any
  other synth available. Ensoniq mirage with soundprocess has additive synthesis
  capability plus up to 4 independant oscillators which can be stacked together.

  Blue swells is delivered into 2 sound bank formats with installation
  instructions: arturia emulator ii v (.emux). Arturia analog lab v (.labx).
specs: |-
  - 142 presets
  - Multi-samples per preset
  - 524 original individual samples
  - Sampled through all synths' analog/digital filters and a/d-d/a converters
  - 16-bit 44.1 kHz uncompressed PCM wav samples
  - 822 MB installed (each version)
  - Version 1.1.1
  - Velocity modulations
  - Mod wheel modulations
  - Delay
  - Chorus
  - Reverb
  - Bitcrusher
  - EQ
  - Compressor
  - Arturia emulator ii v (.emux) format
  - Arturia analog lab v (.labx) format
  - Works in standalone, VST, AAX, Audio Unit, NKS (64-bit DAWs only)
  - Windows 10+ (64-bit)
  - macOS 10.13+
  - 4 GB RAM
  - 4 cores CPU, 3.4 GHz (4.0 GHz turbo-boost)
  - M1 CPU compatible
  - 3gb-6gb free hard disk space
  - Opengl 2.0 compatible GPU
