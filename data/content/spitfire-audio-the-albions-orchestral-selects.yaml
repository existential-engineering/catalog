details: |-
  The Albions Orchestral Selects is a carefully curated collection of orchestral ensembles, bringing together the most evocative and inspiring instruments from across the renowned Albion series. This unique anthology offers a diverse palette of orchestral sounds, hand-picked from each Albion library, that let the individual character of the orchestra shine and that provide composers with a wide range of expressive possibilities. From the intimate textures of a chamber ensemble or the epic power of a full symphony orchestra, The Albions Orchestral Selects delivers a rich tapestry of sounds to bring any cinematic moment to life.

  A testament to the power and versatility of the Albion series, this tailored selection of sounds captures the essence of each library, from delicate legatos and emotive sustains to powerful staccatos and thunderous percussion. Incorporating the epic scale of Albion ONE, the rich textures of Albion Loegria's strings, the colossal low end of Albion Iceni, the icy beauty of Tundra and the intimate detail of NEO, this versatile collection provides the tools you need to paint vivid sonic landscapes and bring your musical vision to life.
specs: |-
  - Patches drawn from six Albion libraries: ONE, Legacy, Loegria, Iceni, Tundra and NEO
  - Sections: Epic and Intimate Strings, Epic and Intimate Brass, Epic and Intimate Woodwinds, Percussion, Albion Legatos
  - Approximately 29 GB download size
  - Kontakt Player min version 7.5.2
  - macOS 11 to 26 (Kontakt 8.8 requires macOS 14 minimum), Intel i5 or higher, Apple Silicon natively or via Rosetta
  - Windows 7, 8, 10 or 11 (64-bit), 8 GB RAM minimum (16 GB recommended)
  - 4 GB RAM minimum on macOS (6 GB recommended for large Kontakt instruments)
  - 64-bit DAW required
  - Spitfire Audio App required
