description: Renegade is a drums and sound design library designed for producers
  of nu-metal, edm, rock, pop and underscore.
details: |-
  As always, dialing in the drum mixes was incredibly important to get right.
  Rogue is the tight mix, faction is the workhorse mix and juggernaut is the
  roomy mix. Inspired by the gorgon preset from our medusa library, we provided
  a fourth mix for renegade that pushed us to our absolute mixing limits
  anarchy.

  For the guitars & bass section of renegade, we've included a distorted
  eight-string guitar, distorted bass guitar and two nylon guitar patches. For
  the eight-string and bass, you can crossfade the live eighth-note patterns
  between palm-mute and full-open. With harder velocity hits, you can trigger a
  set of isolated samples (with up to four round robins) to act as your 'ending'
  notes or to further customize your guitar line.

  We also recorded, processed and programmed a ton of sound design material but
  only included the efforts that we found inspiring, useful and complimentary to
  renegade as a whole. What we ended up with was a curated collection of 31
  multi-genre patches consisting of processed analog synths, bass and
  acoustic/electric guitars, live ensemble/solo percussion pulses, analog kits
  and more.

  What's included: drums + sound design. Kick, snare, cross stick, rimshot,
  three toms, ride (with crash), ride bell, two crashes, hihats, synced live
  hihat grooves (three recorded tempos 90 / 120 / 140 bpm). 31 multi-genre
  playable sound design patches consisting of processed percussion, guitars,
  electric bass, analog synths, piano, brass, strings, pulses, analog kits and
  weapons.
specs: |-
  - Drum collection
  - Analog synth rompler
  - Kontakt instrument
  - Requires Kontakt 5.8.1 or higher
  - Free Kontakt player not supported
  - Recorded in 48khz / 24-bit
  - 4.5 GB compressed ncw format
  - Four interchangeable mix presets (rogue, faction, juggernaut, anarchy)
  - Live eighth-note hi-hat grooves (90 / 120 / 140 bpm)
  - Crossfadeable hi-hat grooves
  - Groove speed control (half/normal/double)
  - Adjustable humanization feature (off/tight/natural/loose)
  - Assignable Kontakt outputs for each drum group
  - Reverb control for sound design patches
  - Cc assignment option for sound design patches
  - 31 multi-genre playable sound design patches
  - Distorted eight-string guitar
  - Distorted bass guitar
  - Two nylon guitar patches
  - Palm-mute and full-open crossfade patterns
  - Up to four round robins for isolated samples
