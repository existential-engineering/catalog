details: |-
  'Essential Pop Moments Vol 2' from baltic audio contains six construction kits and one bonus kit taken from 'Essential Chart Guitars Vol 2: Pop & House'.

  The pack contains real played and recorded guitars, basses, drums and synths. Each of the six construction kits has recorded and mixed instruments with its own sound.

  MIDI files are included for the majority of the musical phrases and drums heard in most kits. The MIDI files can be combined with a sampler to trigger the key-tagged one-shots, or used with any synth or sampler.

  Unlooped tail WAV files are included, allowing a phrase to end with the decay of the reverb or delay applied to the loop, and dry and wet versions with filter, sidechain and reverb are provided for many wet files.

  Kit 01 contains a real recorded Steinway piano and a real recorded wine glass playing the top melody.
