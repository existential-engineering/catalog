details: |-
  Symphonic Extras is a treasure trove of unique sounds that elevate your sound design above and beyond the palette of a typical orchestra. A celebration of the path less travelled, this collection explores unconventional sound sources that colour your compositions with intriguing timbres and textures, while pushing the boundaries of traditional instruments.

  This remarkable suite of tuned percussion spans the metallic resonance of the Aluphone and Cimbalom to the haunting whispers of the Hg2O waterphone. Explore an experimental collection of Scraped Percussion (including a bowed bicycle wheel), as well as innovative takes on a plucked Piano, Steel Drums and, and the delicate beauty of a baroque Harpsichord.

  Masterfully recorded in AIR's Lyndhurst Hall by London's first-call session musicians, this library perfectly complements the Albion range or Spitfire Symphony Orchestra, all instruments sharing the same stunning acoustics that have been heard on countless film scores.

  Delve into a range of unconventional and extraordinary instruments that spark your most creative arrangements.
specs: |-
  - 91 presets
  - Tuned and untuned percussion
  - Instruments: Harpsichord, Plucked Piano, Steel Drums, Aluphone, Cimbalom, Scraped Percussion, Hg2O waterphone
  - macOS 11 to 26 (Kontakt 8.8 requires macOS 14 minimum), Intel i5 or higher, Apple Silicon natively or via Rosetta
  - Windows 10 or 11 (latest Service Pack)
  - 4 GB RAM (6 GB recommended for large Kontakt instruments)
  - Recorded at AIR Lyndhurst Hall
  - Spitfire Audio App required
