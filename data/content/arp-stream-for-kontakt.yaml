details: |-
  Arp stream is a modular style complex MIDI sequencer with an arpeggiator at
  its core. It features many different ways of manipulating pitch and tempo
  which can all interact with each other which makes it fascinating to explore.

  It also has 3 cc sequencers which can target any cc number and also includes a
  profile editor for making your own specific correctly named profiles for
  hardware etc. Altogether there are 11 sequencers.

  The repeat sequencer serves 2 purposes, the first is the ability to play sub
  gate sequences. Each step allows selecting the number of repeats and which
  grid will be used if any. Secondly every other sequencer has an 'rp' button
  which when enabled will repeat 'x' repeats before moving forward.

  The stutter sequencer allows splitting up each step into up to 32 stutter
  repeats which can range from rhythmic repeats to glitchy. There is also a fade
  button which will fade them out to create a delay type of effect.

  The mode sequencer has 26 different options per step. The first 13 deal
  primarily with pitch (with the exception of chord) which includes play
  lowest/highest held note, play an octave below or a power chord etc. These
  modes are followed by time based modes ('x/y') which rotate through y steps
  only playing x notes. So 2/3 will play the second count of each 3 counts.
  Finally there are some random percentage modes consisting of 25%, 50%, 75% and
  90%.
