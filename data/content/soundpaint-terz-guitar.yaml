details: |-
  Little Guitar. Big Emotion. The 5-28 Terz Guitar is an acoustic treasure that has risen to fame over the last couple of decades. It is one of Sting's preferred guitars used on songs like "Sacred Love" and "Dead Man's Rope". The Terz Guitar is slightly smaller than a traditional acoustic guitar, which gives it a tighter, almost harpsichord-like quality, but with an unparalleled amount of emotion. The sound is incredibly clear and precise, but with a unique bright tone that sits so perfectly in a mix. With 31 Programs (with 18 additional Hidden Gems Programs) and 8 Parts a new world of sounds are open in Soundpaint. Chords, Power Chords, Mutes, Sustains, and more allow for some really fun music making. The beautiful timbre of the Martin Terz guitar adds sweetness, precision, and life.
