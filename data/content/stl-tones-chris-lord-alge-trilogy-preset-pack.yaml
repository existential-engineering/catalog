description: "STL Tones brings 5-time GRAMMY(R)-award winning mix engineer Chris
  Lord-Alge’s guitar tones to life with a one of a kind Expansion Preset Pack to
  use with the Tonality Howard Benson Guitar Plug-In Suite. We captured CLA’s
  full analog signal chain that he uses for his most well known mixes, including
  his SSL console, vintage Pultecs, Focusrite Red on the mix bus and the eq’s
  from his console. • CLA Album Tone Presets : This bank has 20 Guitar presets,
  and are solely focused on album guitar tones from CLA's best known work. These
  are full signal chain presets. • CLA Creations Presets : This bank has 30
  Guitar presets, specifically created by CLA using the Tonality - Howard Benson
  Plugin. • CLA Bass Presets : This bank has 14 Bass presets, solely focused on
  Bass tones from some of his most popular mixes. These are full signal chain
  presets."
