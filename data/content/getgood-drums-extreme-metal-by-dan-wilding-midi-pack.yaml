details: |-
  Dan Wilding is a drummer that can do it all. He’s got groove, power, speed, and killer blast beats, and you’ll find all that in this pack.

  Best known for his performances with Carcass and other metal luminaries such as Heaven Shall Burn and Aborted, Dan's playing is filled with creative approaches to groovy technical drumming.

