details: |-
  32 Guitars. A Symphony of Emotions. Emotional Guitars features 32 guitars, each conveying a distinct, powerful emotion. Just like its sister instrument, Emotional Guitars Pads , the inspiration for this collection came from Plutchik's Wheel, a visual representation of how emotions relate to each other. With this as our guide, we enlisted one musician to handcraft each emotion using only guitars. The result is a powerful tool for scoring scenes that require an emotional impact. Whether you need a simple underscore or a complex structure that weaves in and out of complex emotions, Emotional Guitars has got you covered. The multisample edition features 32 fully playable guitar parts, each representing a distinct emotion from Plutchik's Wheel. In Soundpaint, you can explore new sonic territories by combining and morphing emotions. The possibilities are endless, allowing you to create a unique and personalized emotional experience for your audience. Don't settle for generic soundscapes - infuse true humanity in your music with the emotional depth and authenticity of Emotional Guitars.
