details: |-
  'MIDI Loop Starters Vol 1 - Melodic Trap' contains 8 melody kits including 196 MIDI loops, aimed at producers looking for melodies and starting ideas for new Trap songs.

  The 8 melody kits are each divided into basses, chords, leads and more. The 5 different versions of each track of a kit offer variety within a song.

  The chords and scale MIDIs included in each kit help with finding the right notes when modifying the existing MIDI loops.

  Please note: The sounds and samples in the demo are not included in this product.
specs: |-
  - 196 MIDI Loops
