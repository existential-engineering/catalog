details: |-
  Airwaves is a preset pack for the GForce Oberheim OB-X created by Reverb Machine (Dan Carr), a Glasgow-based musician and sound designer. The collection draws inspiration from nostalgic electronic music spanning the 90s and 2000s, referencing artists including Boards of Canada, Aphex Twin, Tycho, The Flashbulb, and Casino Versus Japan.

  The presets feature tape-disintegrated pads, smooth analog leads, and distant basses with warm, degraded textures. The creator leveraged the OB-X's modulation capabilities extensively, using audio-rate filter modulation and noise-modulated pitch and volume fluctuations to achieve authentically gritty, tape-affected tones.
