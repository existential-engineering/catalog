description: A 50-patch preset pack for the GForce Oberheim OB-X drawing inspiration from nostalgic electronic music of the 90s and 2000s, referencing artists like Boards of Canada, Aphex Twin, and Tycho. Features tape-disintegrated pads, smooth analog leads, and distant basses with warm, degraded textures.
details: |-
  Dive into the nostalgic ambience of electronic music from the 90s and 2000s with Airwaves, a carefully crafted preset pack for GForce Oberheim OB-X. Inspired by artists like Boards of Canada, Aphex Twin, Tycho, The Flashbulb, and Casino Versus Japan, this collection brings timeless sounds into your studio.

  Featuring tape-disintegrated pads, smooth analog leads, and distant basses, these presets offer warm, degraded textures, expressive tones, and depth without overpowering your mix. Dynamic Macro controls allow for easy tweaking, offering intuitive sound customization.

  The presets are heavily influenced by the OB-X’s powerful modulation capabilities, with nearly every parameter featuring an independent LFO and envelope. “I tried to emulate overdrive and tape effects by experimenting with audio-rate filter modulation and noise-modulated pitch and volume fluctuations to achieve authentically gritty, tape-affected tones,” says the Reverb Machine.

  Perfect for crafting immersive ambient pieces, scoring film, TV, or video games, and adding depth and intrigue to your music, Airwaves helps you create compelling tracks that resonate with the essence of the 90s and 2000s while still sounding fresh and contemporary.

  About Reverb Machine: Reverb Machine is the work of Dan Carr, a Glasgow-based musician and sound designer. The blog aims to demystify the mechanics of music making, offering detailed recreations of sounds from indie and electronic genres to film scores.
