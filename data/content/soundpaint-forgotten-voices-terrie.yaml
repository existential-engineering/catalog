details: |-
  Full of Soul. Full of Life. Terrie showcases Terrie Odabi, a classically trained singer who studied under Gwen Brown, Bill Bell and the late John Patton. While traveling, Terrie started to gain interest in other cultures and languages like Latin, Spanish, and a variety of African and even Middle Eastern dialects. Her incredible depth and understanding of music cultures were the premise of this library, which covers several African dialects as well as Gospel, Soul, RnB and further experimental types of singing. The library contains thousands of unique phrases and sounds derived from over 20 hours of session material, divided into easily-accessible styles. Soundpaint allow you to shape these phrases in any way you can imagine. Love the second half of a phrase? Want to sustain a certain part of a phrase? Use the TIME Rack module to offset the start of a phrase and adjust the time to speed up or slow down to a complete freeze if you want.
