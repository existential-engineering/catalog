description: BHS Friedman Naked the friedman head you can't get! (66 rigs).
details: |-
  The friedman naked rig library created by big hairy sounds. This pack covers
  66 captures of 2 versions of the friedman naked head: the black and the white.
  Each rig is crafted for the closest recreation of the amp sound, as well as 9
  presets inspired by record tones of apc.

  The black one feels more modern and bigger, with more presence. The white one
  feels more like a bad-ass mod on a vintage amp.

  The library has been captured with a british 4x12" cabinet with a combination
  of greenbacks and v30 speakers.

  24 mar 2022 free update - di rigs: the library has been extended with 26 new
  di rigs! New users will have these rigs already in the installer. Existing
  users can update the library for free by logging into the user account and
  downloading the library again.
specs: |-
  - 66 rig captures
  - 2 amp versions (black and white)
  - 9 presets
  - British 4x12" cabinet
  - Greenbacks and v30 speakers
  - DI rigs (26 additional)
  - macOS compatible
  - Windows compatible
