description: One of the most comprehensive robotic sound effects libraries ever made. An enormous 11.5 GB collection of designed and source files covering transforms, mechanisms, movements, servos, energy, impacts, textures, synths, and more, built for futuristic sci-fi projects. Includes 30 Weaponiser presets and 254 Reformer Pro sound packs.
details: |-
  Robotic, sci-fi, mechanical, servo, transformer, UI, AI, pneumatic, devices and movement. Robotic Lifeforms 2 by SoundMorph is one of the most comprehensive robotic sound effects libraries currently available, and a must-have for a futuristic sci-fi project.

  Robotic Lifeforms 2 is an 11.5 GB library of designed and source files for an all-encompassing robotic sound design collection. This flexible sci-fi library covers a vast range of categories such as transforms, mechanisms, movements, servos, energy, impacts, textures and synths.

  Sound categories included in this library: Robots, Mechanism, Energy and Power. Keywords span robots, transforms, mechanisms, movement, power, servos, air hydraulic, energy, footsteps, impacts, computer, devices, attack and defence, textures, engines, whooshes and bonus material.

  The purchase contains three downloads: a zip file with all source sound effect asset files plus a metadata PDF, an installer for the integrated Weaponiser library including assets and presets, and an installer for the integrated Reformer Pro library.

  SoundMorph used some of the most advanced microphones, Kyma, sound design techniques, and synthesizers to build what it considers the most advanced and modern robot library ever created. It delivers over 2,700 designed sounds plus over 1,300 source audio files recorded in 192 kHz 24Bit with the Sanken CO-100K mic.
