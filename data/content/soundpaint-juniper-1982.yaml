details: |-
  History in your hands. This isn't just any Jupiter 8. It's the exact synth Sembello used on his Flashdance megahit, "Maniac." It was also the very unit used on the infamous "Axel F" track from Beverly Hills Cop. The same legendary instrument graced Quincy Jones and Michael Jackson's iconic "Thriller" album. It is the ultimate hit-maker. Jupiter 1982 represents the ultimate evolution of the Soundpaint Juniper series. While we thought we had reached the peak of this instrument, we opened the doors to a fresh perspective. Guest developer Chimy took the hardware into his own studio, scrutinizing every corner to find room for improvement. The result is a massive revision: 70 new parts and over 9,000 additional UDS samples . The Soundpaint Jupiter 1982 has been completely rebuilt from the ground up. We've re-recorded all original oscillators using everything we've learned, capturing the unique way every voice colors and degrades with age. Every patch is meticulously reprogrammed using our revolutionary C.A.F Modelled Filters , unlocking six authentic J8 Filter Models.
