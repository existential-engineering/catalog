description: Beat-sliced guitars (bsg) are guitars played rhythmically in all
  the common note length variations.
details: |-
  Beat-sliced guitars (bsg) are guitars played rhythmically in all the common
  note length variations and two playing styles (staccato and legato), sampled
  and sliced so that it stays solidly in time with your host. Add some Kontakt
  magic like effects and envelope loop patterns and voila an incredibly
  expressive, inspirational and downright fun-to-play instrument!

  Kontakt multis extend the possibilities by adding another bsg type for layered
  sound textures or a second instance of the same type with a different
  keyswitch mapping so that interesting and complex rhythmic textures arise as
  different note lengths and patterns are played against each other.

  There are 348 48khz 24-bit sample loops per instrument (~180 mb uncompressed
  .wav files). 29 notes (c3 thru e5) and 6 common time values (whole, quarter,
  quarter triplet, eighth, eighth triplet and sixteenth) are included. Each note
  and length is performed, sampled and looped for a 4/4 measure or more. Each
  note also has two performance styles staccato (or palm mute) and legato.

  Original loops are at 75 bpm but are sliced in kontakt (ala rex files) so that
  they are useful over a wide range of tempos. There is also a time switch that
  allows the instrument to work well with tempos exceeding 150 bpm.

  Cleantele is a tom anderson hollow classic t with anderson pickups in a h-s-h
  configuration strung with d'addario exl115 strings. It was recorded using the
  2nd pickup setting with the coils tapped as single through a 1967 fender champ
  and a shure sm57 mic. For the notes below e1, a larger (.058) string was
  fitted for better tension/tone. This set is the proto-typical electric guitar
  sound sharp, bell-like and twangy.
specs: |-
  - Kontakt 5.1 and later compatible

  - Full version of kontakt required

  - 348 48khz 24-bit sample loops per instrument

  - 29 notes (c3 thru e5)

  - 6 common time values (whole, quarter, quarter triplet, eighth, eighth
  triplet, sixteenth)

  - Staccato and legato performance styles

  - Velocity switches between staccato and legato

  - Keyswitches control note length values

  - Keyswitch mapping c#1 thru b2

  - Tempo range with 1/2-time switch for tempos exceeding 150 bpm

  - Filter with high pass, peak bandpass, lowpass, and formant types

  - Phaser with depth, speed, feedback, and phase controls (0-90 degrees)

  - Flanger with colour knob

  - Chorus with depth, speed, and phase controls

  - Delay with time, depth, and feedback controls

  - Ping-pong delay with pan amount

  - Delay time syncs to host bpm

  - Stereo-izer with width and pan controls

  - Arpeggiator with standard kontakt features

  - MIDI cc#119 internal usage
