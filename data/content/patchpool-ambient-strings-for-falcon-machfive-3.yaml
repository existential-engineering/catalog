details: |-
  Ambient strings by simon stockhausen (patchpool) focusses on atmospheric
  sounds and textures derived from string instruments like cello, violin
  (electric and acoustic), electric and acoustic guitars, psaltery (ebowed,
  plucked and bowed) and oud. The patches combine textural sounds, multisampled
  acoustic instruments and more exotic instrument articulations with electronic
  textures all derived from the dry instrument samples to create wonderful,
  ethereal, dark and mysterious sound worlds.

  Expressive multisampled instruments, temposynced instrument sequences and
  morphable soloistic phrases are also included in this library. 16 patches have
  scripted interfaces for extended sound manipulation, a snapshot system
  especially developed for this library allows the user to save and recall 5
  snapshots, or recall the 5 snapshots programmed into the patches by default.

  All non-scripted patches have the modwheel and the 8 macros assigned in the
  info tab, quite a few also use aftertouch. Many patches integrate the wealth
  of machfive's sound generators and combine them with granular and normal
  sampling. In many patches temposynced modulators are used to animate the
  amplitudes and filters of the involved samples and sound generators, often
  keyswitchable sound combinations or different articulations are available
  within one patch.

  All acoustic instrument-samples in this library are recorded in a dry studio
  environment with top notch neumann microphones in l-c-r at 48 khz/24-bit. All
  microphone signals are phase-aligned which enhances the stereo field and the
  transparency of the recorded samples.

  The snapshot system especially developed for this library allows the user to
  save and recall 5 snapshots, or recall the 5 snapshots hard-coded into the
  patches by clicking on the "reset" buttons at the bottom of the snapshot
  interface. To access the snapshots just click on the "snapshots" button at the
  top right of the interface.
specs: |-
  - 75 patches (including 3 low CPU variations)
  - 64 snapshot variations
  - 3.35 GB of original samples (wavs/stereo/48 kHz/24-bit)
  - 6 impulse responses
  - 4 single cycles
  - Scripted interfaces for extended sound manipulation
  - Snapshot system with 5 saveable snapshots
  - Modwheel and 8 macros assigned
  - Aftertouch support
  - Granular and normal sampling
  - Temposynced modulators
  - Keyswitchable sound combinations
  - Key-colouring in machfive's keyboard
  - Neumann microphones in l-c-r recording
  - Phase-aligned microphone signals
  - Compatible with machfive 3 (version 3.2 and higher)
  - Compatible with falcon
