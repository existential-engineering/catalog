details: |-
  Emily Wolfe has emerged as an influential figure in the guitar community with her raw, blues-driven, immediately magnetic tone. Combining pop song structure with fuzzy grunge and alt-rock, she continues to be recognised as a force on the instrument both in the studio and live.

  This expansion pack captures the raw, grungey blues-driven tones Emily has become known for. Whether you're chasing alt-rock rhythm tones, fuzzy leads or expressive cleans, these signature sounds have been crafted to get you there instantly.

  Emily's pack contains 60 captures.
