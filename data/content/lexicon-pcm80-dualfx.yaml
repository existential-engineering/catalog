description: Dual FX Algorithm Card for the Lexicon PCM80 effects processor.
details: |-
  The PCM80 DualFX is an algorithm cartridge that expands the Lexicon PCM80 hardware effects processor with additional dual-effect algorithms.

  Lexicon lists the product as Discontinued on lexiconpro.com, with no current purchase options. Documentation (owner's manual, MIDI implementation, and preset list) remains available for download from the manufacturer's site.
