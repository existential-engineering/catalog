details: |-
  Balancing channels is a smart, fast and fun way to improve your ability to
  balance a mix. You'll balance the mix of twelve songs, covering a range of
  four genres: pop, rock, hip hop and house.

  The starting balance is randomly set each time you load a challenge - it's
  your task to adjust the faders to get a well-balanced mix. Your unique balance
  will be scored out of 100, based on how I approached the track.

  If you don't pass a level: you'll be able to preview my mix, as a reference,
  and try to match it. If you still get stuck, you'll get more guidance on how
  you can improve the balance.

  With practice, this knowledge will transform your ability to get a
  pro-sounding balance in your own mixes.
specs: |-
  - Mix balancing training
  - Twelve songs across four genres
  - Pop, rock, hip hop, and house genres
  - Randomized starting balance
  - Fader adjustment controls
  - Scoring system (0-100)
  - Reference mix preview
  - Guidance system for improvement
