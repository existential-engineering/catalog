description: A meticulously crafted collection of 50 patches for GForce Minimonsta2, designed by Indian electronic music artist Sandunes (Sanaya Ardeshir). The pack spans deep warm textures to playful bright sounds, covering bass, keys, leads, pads, effects, sequences, and textures.
details: |-
  Whether you are looking for rich, layered atmospheres or bright, engaging tones, Coalescence is designed to switch on a creative flow. Sandunes shares the inspiration behind the pack: 'I had a really enjoyable experience coming up with these sounds, and made quite a bit of music in the process too. I love that these are seeds that will enable people to do the same thing.'

  Each patch is designed to be a starting point, providing a complete palette that covers a wide spectrum of sonic possibilities, from timeless warm pads to punchy leads.

  Sanaya Ardeshir (she/her) is an Indian music producer, composer and performer whose world of sound is in constant evolution, ranging from experimental piano music and acoustic-electronic dance music to experiments in pop, field recordings and synthesis. She has been described as one of India's leading electronic music artists by Resident Advisor, and has performed at festivals including Lollapalooza, Roskilde, Womad and Magnetic Fields.

  The pack is only available to registered users of GForce Minimonsta2, and is exclusively available via the GForce website as a direct download via 'My Instruments' once the purchase has been completed.
specs: |-
  - 50 patches
  - 10 Keys patches
  - 10 Pads patches
  - 9 Leads patches
  - 8 Basses patches
  - 8 Effects patches
  - 4 Sequences patches
  - 1 Textures patch
  - Requires a registered installation of GForce Minimonsta2
