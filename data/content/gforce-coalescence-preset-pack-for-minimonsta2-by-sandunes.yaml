details: |-
  Coalescence is a preset pack for the GForce Minimonsta2 synthesizer plugin, created by Sandunes (Sanaya Ardeshir), one of India's leading electronic music artists who has performed at Lollapalooza, Roskilde, and the Barbican Centre.

  The collection spans from deep, warm textures to playful, bright sounds, suitable for a variety of music production styles. 50 total patches organized across seven categories offer a diverse sonic palette rooted in Sandunes' distinctive aesthetic.
