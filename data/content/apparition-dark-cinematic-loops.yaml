  Apparition: dark cinematic loops by modeaudio is a horror soundtrack sample
  pack containing royalty-free audio designed for dark, cinematic music
  production. The pack features ghostly ambient textures, ominous creeping
  synths, and haunting percussion rhythms to bring dark cinematic productions to
  life.


  The core offering includes 150 blood-curdling music loops that provide eerie
  atmosphere, sinister bass, and foreboding noise texture. Additionally, 30
  spine-tingling sfx samples span tense, dread-inducing sweeps to sudden
  percussive impacts designed to shock listeners.


  Direct access to 70 MIDI patterns allows users to utilize the melodic and
  harmonic content with their synth of choice, enabling creative flexibility
  within any DAW for horror-themed music production.
