details: |-
  'Spire Essentials Vol 14 - Bigroom EDM' from baltic audio is a preset pack for producers looking to get the sound of current Bigroom EDM. You'll find 64 top-quality presets for the amazing Spire synthesizer to create hit tracks, including hand-crafted leads, basses, plucks and pads.

  Each preset is perfectly programmed by a professional sound designer and every parameter tweaked with passion and detail and will be your essential source for creating new and commercial sounds within your compositions.

  You can also use it for genres like Future House, Future Rave, Progressive House, Dance and more.

  In addition, you'll find 40 MIDI files taken from the demo.

  Please note: The drums and some FX used in the demo are not included in this product.
specs: |-
  - 64 Presets for Spire
  - 20 Leads (Presets)
  - 12 Plucks (Presets)
  - 10 Basses (Presets)
  - 7 Keys (Presets)
  - 5 Synths (Presets)
  - 5 Pads (Presets)
  - 3 Arps (Presets)
  - 2 FX (Presets)
  - 40 MIDI files
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
  - Requires Reveal Sound Spire v1.5.0 or higher
