description: A preset pack for GForce Oddity3 featuring 52 patches across basses, pads, leads, textures, sequences, effects, hits, and keys — all crafted by sound design duo K/V to capture dark, brooding cinematic atmospheres for film, TV, and trailer scoring.
details: |-
  From ominous drones to haunting atmospheres, Dark Cinematic is built to sculpt intense sonic landscapes. K/V's intention was to capture the essence of dark, brooding cinematic music: 'We tried to capture the essence of dark, brooding cinematic music and created a pack that inspired us to write some new cues,' says K/V. The result is a versatile pack featuring pads, leads, textures and haunting basses, along with a variety of cinematic effects designed to add depth and intensity.

  Aimed at composers and sound designers, the pack provides tools for scoring a film, developing a TV show or crafting a trailer, with sounds intended to evoke emotion and suspense.

  K/V is a sound design and composition duo comprised of Ramon Kerstens and Richard Veenstra. Their credits extend across clients including Toontrack, Native Instruments, Arturia, Steinberg, Soniccouture and GForce Software, and as composers their portfolio ranges from movies and ad campaigns to podcasts and radio.

  The pack is only available to registered users of GForce Oddity3, and is exclusively available via the GForce website as a direct download via 'My Instruments' once the purchase has been completed.
specs: |-
