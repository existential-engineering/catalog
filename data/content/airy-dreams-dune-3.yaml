details: >-
  Airy dreams contains 50 "ballady" and airy synths for synapse audio dune 3.
  They fit for calm music parts in a variety of genres from cinematic to ballads
  and from electronic to new age.


  It contains many types of keys like organic, choirs, synth orcherstrals, el.
  Pianos, classic 90s and other.


  You could use mw for vibrato and aftertouch for modulating the pitch.


  Presets were design with dune 3.520 and run best with this or newer version.
