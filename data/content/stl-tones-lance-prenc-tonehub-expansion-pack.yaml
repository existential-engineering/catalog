description: "Known for creating distinctly aggressive and loud heavy metal
  records, Lance Prenc continues to prove why he’s one of the most in-demand
  engineers in the modern metal genre with monumental releases from Polaris,
  Alpha Wolf, Thornhill, and Dealer. In this expansion pack, Lance Prenc brings
  the heavy guitar and bass tones he’s become synonymous with to the ToneHub and
  Kemper platforms. Carefully engineered by Lance from his studio in Melbourne,
  Australia, this pack includes many of the album tones from his career so far
  as well as go-to favorites from his collection of hardware amplifiers,
  cabinets, and pedals."
