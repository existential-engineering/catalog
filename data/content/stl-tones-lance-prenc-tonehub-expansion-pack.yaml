details: |-
  Lance Prenc is a Melbourne-based producer and mix engineer known for creating distinctly aggressive and loud heavy metal records. He continues to prove why he's one of the most in-demand engineers in modern metal with releases from Polaris, Alpha Wolf, Thornhill, Void of Vision and Dealer.

  In this expansion pack, Lance brings the heavy guitar and bass tones he has become synonymous with to the ToneHub and Kemper platforms. Carefully engineered from his studio in Melbourne, it includes many of the album tones from his career so far as well as go-to favorites from his collection of hardware amplifiers, cabinets and pedals.
