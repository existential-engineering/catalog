details: |-
  Bells is a collection of samples derived from many different kinds of Bells.
  After visiting pontificia fonderia marinelli in agnone, Italy the largest
  Bells company and one of the oldest family-owned businesses worldwide we
  started collecting many different kinds of Bells, including: an agnone
  souvenir bell, three different cowbells, a hotel desk-bell, a perko fog bell,
  and a classic school bell.

  All the bells are made from different materials such as bronze, brass, and
  iron, and we sampled them with different articulations and techniques to
  provide a wide range of sounds.

  Sample sets including: agnone bell, cowbells, hotel desk-bell, perko fog bell,
  school bell.
specs: |-
  - 30 Kontakt instruments (.nki)
  - 7 Kontakt multis (.nkm)
  - Up to 7 round robin samples
  - Up to 3 velocity layers
  - 200 samples (44.1khz / 24-bit)
  - 7 custom reverb IRs
  - Kontakt and wav formats
  - 430 MB size
  - Native Instruments Kontakt 4.2.4+ full version required
