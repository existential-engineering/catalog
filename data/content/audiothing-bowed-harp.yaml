description: Bowed Harp features samples from an autoharp played with a pick and
  an ebow. The autoharp is a string instrument similar to a zither.
details: |-
  Bowed harp lets you mix these two sources to create unique plucked and pad
  sounds. Both sources also feature a selection of 12 impulse responses (4
  reverbs, 4 cabinets, 4 effects) to further mangle the sounds.

  Bowed harp by audiothing is soundware (samples or presets that load into other
  products) for macos and windows.
specs: |-
  - 14 Kontakt instruments (.nki)
  - 5 round robin samples
  - 3 velocity layers
  - 160 samples (44.1khz / 24-bit)
  - Kontakt format
  - Wav format
