details: |-
  The Feathered Flute is a cinematic dreamscape generator of featherlike textures and undulating swells, carved from cedar in the Texas Hill country. An inspiring Native American flute library with additional ethereal textures, which sounds both haunting and beautiful.

  The flute was handcrafted by Vernon Agold in Kerrville, TX. It was originally featured in the instrument Flute+Violin, which later became Arctic Swells .
specs: |-
  - Cedar Native American flute handcrafted by Vernon Agold, Kerrville, TX
  - Articulations: Sustain, Staccato, Chatter, Ethereal, Short Swells, Medium Swells, Long Swells
  - Signals: Flute, Choir, Flute (Ethereal), Sub (Ethereal), Grit (Ethereal)
  - Controls: Dynamics, Expression, Low Pass Filter, Attack, Release
  - File size 1.48GB
  - Requires Kontakt version 6.7 or higher (Kontakt Player included)
  - 4GB RAM or higher
  - Machine must be connected to the internet during install
  - Spitfire Audio App required
