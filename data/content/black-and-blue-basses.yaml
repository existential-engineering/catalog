details: |-
  Black And Blue Basses is a sample library of two 5-string bass guitars: a
  black hollowbody played with the fingers, and a blue solidbody played with a
  pick. Over 2000 samples adding up to more than a gigabyte.

  Black bass has plucks, ghost notes, staccato, two types of behind-the-bridge
  picking and release noises, all with four round robins. Black bass plucks have
  four velocity layers and ghost notes two velocity layers.

  Blue bass has picked notes with two velocity layers, with eight round robins
  in the top layer and four in the bottom layer. Blue bass also has extended low
  range to low e an octave below a standard 4-string bass's lowest note.

  Simulated vibrato with humanization. Swell, tremolo and release controls.
  Synthesizer-style filter with resonance and modulation by lfo and envelope.
  Unison with controllable width.
