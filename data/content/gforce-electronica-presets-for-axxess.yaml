details: |-
  A collection of 40 meticulously crafted Electronica patches designed exclusively for the GForce AXXESS synth. The collection spans diverse sonic territories from ambient and atmospheric textures through to warm analogue sequences.

  While AXXESS appears straightforward, its sonic possibilities extend far beyond initial impressions. This patch set aims to showcase that a synth doesn't need complexity to be both great and impactful — offering analog richness and a fat, full sound without typical synthesizer complexity.

  Available as a direct download via My Instruments after purchase. Requires a registered copy of GForce AXXESS.
