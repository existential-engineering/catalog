details: |-
  A royalty free vocal library of philosophical lyrics and warm tones, recorded by platinum award winning songwriter Amy Kirkpatrick.

  The pack is organized by key and its associated Chakra, so material can be chosen for the emotional quality it carries. Inside are ancient Mantras, contemporary Mantras, power phrases, a spoken word section, soothing vocal atmosphere effects, and studio produced Crystal Singing Bowl recordings.

  Inspired by sound healing culture and energy healing practices, it is aimed at producers of ambient and downtempo, music for yoga, meditation music, and higher energy dance tracks.

  Amy Kirkpatrick requests that her name is not used in the branding of your music, track credits, titles, or artist names.

  This is a vocal and vocal effects pack only. The drums and melodic content heard in the demo are not included.
