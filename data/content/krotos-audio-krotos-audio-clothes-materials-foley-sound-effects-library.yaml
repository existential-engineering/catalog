description: An extensive collection designed for post-production and sound design professionals. The bundle combines the Krotos Clothes Foley Bundle with new additions, offering a complete package of royalty-free SFX suitable for dynamic foley work ranging from subtle fabric movements to impacts. Recorded using Rode NTG3 and DPA 4061 microphones, featuring materials including leather, cotton, zips, jeans, sportswear, and bags.
details: |-
  Provided by Krotos. The Clothes & Materials Foley library is an extensive collection of high-quality and versatile sound design libraries built for Reformer Pro to let you perform your Foley.

  This library is the first in a range of Reformer Pro libraries, and combines the Krotos Clothes Foley Bundle with new additions to offer a complete package of royalty-free SFX for post-production and sound design. It can be used for a huge range of dynamic Foley, from subtle fabric movements to backpack impacts.

  Recorded by Krotos with a Rode NTG3 and DPA 4061s, the collection contains 361 files featuring materials such as leather, cotton, zips, jeans, sportswear and bags, ideal for the reproduction of everyday Foley sounds. Sound categories include canvas, jeans, leather and paper, with keywords covering canvas bag Foley, jacket Foley, jeans Foley, waterproofs Foley, backpack Foley, bag straps, bag velcro, bag zips, laptop bag, large fabric bag, leather bag, luggage holdall, paper bag, plastic bag, plate armour and satchel bag Foley.

  The libraries are optimised to interact seamlessly with Reformer Pro, and all the original files used in the various libraries are included. The purchase contains two downloads: a zip file with all source sound effect asset files plus a Metadata PDF, and an installer for the integrated Reformer Pro library.
