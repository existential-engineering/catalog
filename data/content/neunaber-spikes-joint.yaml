description: This Optigan disc features siren, gunshot, and silly vocal rhythmic
  sound effects along with a bass clarinet scale on the keyboard, in homage to
  Spike Jones & His City Slickers.
details: |-
  Another groove from Optigan master tape archive, this set originally had the working title "Ragtime," but seeing as it's not exactly ragtime, we chose to call it "Spike's Joint," since it was intended as an homage to Spike Jones & His City Slickers. According to Mike LeDoux (Optigan's music director), some of the original City Slickers actually played this session, notably one of the "sound effects" guys. Here he can be heard providing siren & gunshot sounds, along with silly vocal rhythmic effects (there are many more such sounds that may appear on future discs). On the keyboard is the bass clarinet scale played for us by the late Ralph Carney (RIP), which originally appeared on our Orchestron "Bass Clarinet" disc, but makes its Optigan debut here. Important Note:

  All discs are subject to the following licensing arrangement. You MAY use any and all sounds on our Optigan/Orchestron discs to create derivative works for commercial or private use without any further licensing fee beyond the original purchase price of the discs. No credit to optigan.com is required. If your Optigan/Orchestron resides in a commercial studio which you operate, this license also extends to your clients. You MAY NOT simply copy the sound contents of the discs and distribute the material directly as sample loops, either commercially or privately. You MAY NOT make physical copies of the actual discs themselves, other than for private use/experimentation. Compatibility
