details: |-
  The ultimate collection of ezdrummer rock performance drum racks on Ableton
  push featuring no less than 48 Ableton drum racks configured for toontrack
  ezdrummer2 rock ezx expansion libraries. The most complete Ableton integration
  for ezdrummer and ezx expansions available.

  Ableton drum racks for ezdrummer rock! Ezx contains 20 ableton drum racks
  individually mapped to all rock! Ezx factory library content presets. Ableton
  drum racks for ezdrummer alt-rock ezx contains 18 ableton drum racks
  individually mapped to all alt-rock ezx factory content presets. Ableton drum
  racks for ezdrummer seventies rock ezx contains 10 ableton drum racks
  individually mapped to all seventies rock ezx factory content presets.

  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all ezdrummer ezx factory presets from ableton push
  controller device browser. 58 ableton drum racks to instantly load the factory
  library "mix ready" presets with ableton mappings.

  Color coded pad design for visual performance and finger drumming.
  Individually labelled drum rack pads for clear visualisation, post performance
  editing and automation to all drum rack / instrument articulations. Mapped
  ableton macros to ezdrummer macros with preset values for ease of use in push
  and simple to use automation programming.

  Singleout presets featuring 24 ableton drum racks for all factory presets
  single audio output to single ableton track. Multiout presets featuring 24
  ableton drum racks for all presets in multiple audio channel output from the
  plug in to multiple ableton audio tracks using the multi output ableton
  template also provided.
