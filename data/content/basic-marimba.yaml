details: |-
  A marimba is a percussion instrument which consists of a set of wooden bars
  with resonators. The arrangement of the bars corresponds to those of a piano
  with the accidentals raised vertically and overlapping the natural bars. The
  bars are struck with mallets to produce its tone.

  As the name "basic marimba" suggests, this is a rough and basic version of a
  marimba recorded on the fly in between an orchestral break. The instrument was
  quickly miked up and recorded with some of the main playing techniques with up
  to 3 round robin variations and 3 velocity layers.

  Post production and editing was spent to get a proper and useful instrument.
  The basic marimba is well suited for quite a lot music productions.
specs: |-
