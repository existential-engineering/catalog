details: |-
  Producer ahee has created his second pack of Serum presets and samples. Like
  the original beats from the bass ship, this pack contains 128 Serum presets
  designed for dubstep, trap and other bass heavy genres. To round out the pack
  a total of 200 extra one shots have been added.

  This pack includes: 52 - 808 sub kicks, 22 - clean and sloppy trap claps, 20 -
  quirky fx, 20 - hi hats, 36 - percussion hits, 50 - hard snares, 128 - xfer
  serum presets organized into categories: 9 arps, 64 bass, 10 chords, 16 fx, 11
  leads, 7 pads, 7 plucks, 4 rave style patches.
specs: |-
