  - Angel power amp model
  - Metal american amp model
  - Metal german amp model
  - Gain horse amp model
  - 1x12 metal british speaker cabinet
  - 2x12 metal custom speaker cabinet
  - 4x12 metal american speaker cabinet
  - 4x12 metal british speaker cabinet
  - 4x10 metal german speaker cabinet
  - 4x12 bass british speaker cabinet
  - Extension for PreSonus ampire xt native effects plug-in
  - Requires PreSonus studio one version 2.6.2 or higher
  - Windows 7 x64/x86 sp1
  - Windows 8 x64/x86
