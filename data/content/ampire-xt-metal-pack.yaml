details: |-
  The Ampire XT Metal Pack is an extension for PreSonus' ampire xt native
  effects plug-in with six new roaring amp models and six new cajone-encrusted
  speaker-cabinet emulations designed to bleach the tats off metal guitarists.

  Adding to the lethal-weapon qualities of this pack is a brand-new metal
  drumkit for the impact virtual drum instrument.

  New amp models: metal clean, high gain, angel power, metal american, metal
  german, gain horse.

  New speaker cabinets: 1x12 metal british, 2x12 metal custom, 4x12 metal
  american, 4x12 metal british, 4x10 metal german, 4x12 bass british.
specs: |-
  - Six new roaring amp models
  - Six new speaker-cabinet emulations
  - Metal drumkit for impact virtual drum instrument
  - Metal clean amp model
