details: |-
  100 eccentric, unique and quirky programs from the extremely rare ppg 360
  wavecomputer digital synthesizer serial number 007. This is as rare as a
  synthesizer gets with a total of only approximately 40 units made. The library
  contains the 35 programs and another 5 programs made by the owner.

  Also 65 programs were made based on the 35 sampled programs using the kontakt
  user interface giving you a total of 100 programs to play with. You have never
  heard its sound this pure and clean and the overall sound of the 35 direct
  sampled programs are matching the real deal in every detail.

  Don't let the 35 programs fool you. It does not take much tweaking to make new
  and out of this world sounds. Approved by its inventor you will for the first
  time be able to play and hear the sounds of this 40 years old pioneering
  digital synthesizer as it is supposed to sound; clean, naked, mellow, harsh,
  full, sad and crazy and everything in between.

  This is truly a synthesizer like no other. Visit the product page on
  earcandy.dk for sound examples and more information.
specs: |-
  - Wavetable synthesis
  - Kontakt instrument
  - 100 programs
  - Ppg 360 wavecomputer samples
  - 35 direct sampled programs
  - 65 Kontakt user interface programs
