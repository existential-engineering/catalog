details: >-
  Smooth sounds, tortured experiments and finely-tuned funk, all with the
  playability and responsiveness you get from physical modelling synthesis.


  Following on my previous bank for lounge lizard, happy hour (for ep-3), this
  bank takes advantage of the improved engine and new features in lounge lizard
  ep-4.


  It contains reworkings of over 50 presets from the happy hour bank and many
  completely new sounds.
specs: |-
  - Physical modelling synthesis
  - 100 patches
  - 10 chimes
  - 13 drums & tuned percussion
  - 7 fx
  - 13 keys (rhodes)
  - 17 keys (specials)
  - 7 keys (wurli)
  - 14 organs
  - 11 stringed
  - 8 synths
  - Compatible with lounge lizard ep-4
