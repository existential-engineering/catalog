details: |-
  Paul Moak is a five-time Grammy-nominated producer, engineer, mixer and multi-instrumentalist based in Nashville, Tennessee, with credits on more than 500 albums. His work spans Heart and Ann Wilson, Dolly Parton, Gwen Stefani, Blake Shelton, Joy Williams, Mat Kearney, Imelda May, John Paul White of The Civil Wars, Relient K, The Blind Boys of Alabama and House of Heroes.

  This expansion pack is a meticulously curated collection drawn from a lifetime of collecting, recording and refining guitar sound. With 12 boutique and vintage amps, 11 cabinets and 21 carefully selected pedals, it captures the character, warmth and personality of some of the most desirable guitar gear, recorded at his Berry Hill studio The Smoakstack.

  Every tone reflects Paul's decades of experience working across alternative rock, pop and country, where nuance, feel and musicality matter most. Whether you're tracking in the studio or writing at home, the right tone is here.
