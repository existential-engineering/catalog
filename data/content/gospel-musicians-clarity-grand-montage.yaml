details: |-
  Introducing the Clarity Grand —the ultimate piano library for Yamaha Montage and higher keyboards that redefines the balance between warmth and clarity. This meticulously crafted grand piano sound library is designed to shine in any performance or production, whether you're playing lush ballads or dynamic, high-energy compositions. With Clarity Grand, you no longer have to choose between a rich, resonant low-end and a sparkling high-end presence. We've perfected the art of delivering a piano tone that offers depth and warmth without muddiness, and clarity without harshness. The piano we chose to sample for Clarity Grand was selected after extensive testing across genres and mix scenarios. It stood out for its exceptional ability to cut through a mix without overpowering or clashing with other instruments. Its tonal balance is remarkably even—avoiding muddiness in the lows, harshness in the highs, and congestion in the mids. Whether layered with complex synth textures or placed front and center in a minimalist arrangement, this piano maintains its presence with pristine articulation and natural warmth. This is perfect for a live or gospel musician.
