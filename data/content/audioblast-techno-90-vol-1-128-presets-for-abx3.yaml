details: |-
  Techno 90 Vol.1 is a dedicated collection of 128 presets for ABX3, inspired by the raw and hypnotic sound of 90s techno. It steps back into the golden era of electronic music, capturing the essence of early underground rave culture from driving basslines to evolving sequences and analog-style synth patterns.

  The bank is split into 42 bass presets offering deep, punchy, and rolling low-end foundations, 40 seq / arp presets built around rhythmic, hypnotic, and groove-driven patterns, and 46 synth sequences covering classic evolving riffs and industrial techno lines.

  The sound design focus is on classic 90s techno and rave, analog-style character and raw textures, and a balance between vintage vibe and modern punch, with ready-to-use presets for instant inspiration.

  Whether the production is techno, acid techno, rave, or industrial, the pack provides the tools to recreate the authentic sound of the underground scene. Every preset is crafted to sit in the mix, so the focus stays on creativity instead of sound design.

  Covered genres include techno, 90s techno, acid techno, rave, industrial techno, and underground electronic. The pack requires the ABX3 synthesizer.
