name: Around Bridges 2 (Berlin)
manufacturer: detunized
primaryCategory: sound-library
description: Around bridges 2 (berlin) introduces sounds taken from the iron and
  steel construction elements of various bridges in berlin.
details: >-
  Around bridges 2 (berlin) introduces sounds taken from the iron and steel
  construction elements of various bridges in berlin. The entire library was
  recorded with a two-channel contact microphone setup and features thrilling
  vibrations caused by passing cars, trucks, trams and metro trains.


  The material of this library is a comprehensive resource for the creation of
  otherworldly ambiences of futuristic pass-bys or eerie atmospheres with a
  touch of old steel and iron elements.


  Included categories: arch bridge iron, arch bridge steel rivets, city rail
  bridge iron, flat bridge river iron, metro bridge cross, metro bridge iron,
  railroad bridge main street iron, railroad bridge river steel, road bridge
  iron, road bridge steel sections.
