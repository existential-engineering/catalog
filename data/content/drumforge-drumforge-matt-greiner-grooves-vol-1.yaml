description: 972 drum grooves and fills in MIDI format performed by two-time Grammy nominated drummer Matt Greiner, combining groove playing with technical virtuosity.
details: |-
  Matt Greiner Grooves: Vol. 1 is a MIDI groove pack containing 972 drum grooves and fills performed by Matt Greiner, a two-time Grammy nominated drummer. It is the largest of Drumforge's groove packs and captures his combination of groove playing and technical virtuosity.

  The performances are supplied as MIDI files for use in any DAW or with any drum plugin, and they integrate directly with the Drumforge Matt Greiner, Classic, Bergstrand, and Savior samplers.

  Grooves are organized by individual song sections, so arrangements can be assembled quickly and the pack can be used either to write new songs or to refresh existing demos. Dynamics and tempo are adjustable.

  It also works as a practice or production tool for studying a signature metal drumming vocabulary.
specs: |-
  - 972 total drum grooves and fills performed by Matt Greiner
  - MIDI files for use in any DAW or drum plugin
  - Integrates directly with the Drumforge Matt Greiner, Classic, Bergstrand, and Savior samplers
  - Grooves organized by individual song sections
  - Adjustable dynamics and tempo
