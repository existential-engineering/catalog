name: Abstract Grooves 2
manufacturer: particular-sound
primaryCategory: loop-collection
description: Abstract grooves 2 is an element loop collection made mainly out of
  granular samples using native instrument's latest kontakt sampler.
details: >-
  Abstract grooves 2 is an element loop collection made mainly out of granular
  samples using native instrument's latest kontakt sampler.


  Every loop was recorded in 24-bit/44.1khz and sliced in the kontakt sampler to
  use them in your tracks.


  Add your own kicks, snares or claps to the loops without changing the loop
  itself, this is possible because we left the space free in the element loops.


  To make the package complete, we made 75 multis. Multis are layered loops
  using the engine from the kontakt sampler by adding different effects.


  Requirements: native instrument's kontakt sampler 5.3.137.
specs: |-
  - Element loop collection
  - Granular samples
  - Native instrument's kontakt sampler
  - 24-bit/44.1khz recording
  - 150 main element loops with variations
  - Wav format
  - 75 multis
  - Layered loops
  - Kontakt sampler engine
  - Effects processing
