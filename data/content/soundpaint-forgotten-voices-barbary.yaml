details: |-
  Beautiful. Barbary

  Barbary Grant is a highly renowned vocalist and harper within Celtic communities. She sings and articulates fluently in all three Goidelic languages: Scots Gaelic, Irish, and Manx. This homage won her first place in the sean nós competition at the 1998 Great American Irish Fair. Sean nós – "old style" in Irish – is a highly ornamented style of a cappella singing. This collection is constructed from nearly 1500 vocal phrases covering over 12 hours of recorded material. Most phrases are based on classic (public domain) songs from Celtic, Gaelic, Irish, Scots, Welsh, and Manx music folklore. Additionally, the library contains a variety of more experimental phrases, including whisper songs, chantings, lullaby's, elvish whispers, and basic sustained notes. Forgotten Voices: Barbary gives you the beautiful sounds of this wonderful vocalist with the added magic Soundpaint. Select certain parts of phrases with ADSR. Enjoy an entire keyboard range of vocals. Stretch one phrase across your entire keyboard with One Note Same.
