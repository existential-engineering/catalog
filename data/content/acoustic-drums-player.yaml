details: |-
  Acoustic drums by freemusicproduction.net is a virtual instrument audio plugin and soundware (samples or presets that load into other products) for macos and windows.

  It includes, and is therefore powered by, halion sonic se, which functions as a VST plugin, an audio units plugin, a VST 3 plugin and an AAX plugin.

  Player - more than 230 drum loops of different genres (rock, pop, latin..).

  Effects - eq, comp, delay, reverb for each type of drums (kicks, snares, toms...).

  Mixer.
