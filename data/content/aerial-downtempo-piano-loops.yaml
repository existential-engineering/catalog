details: |-
  Aerial: downtempo piano loops by modeaudio is a downtempo piano loops pack that glides from the modeaudio studio like a billowing cloud floating on a warm current of air, imparting all of the quiet power and deep serenity of the piano as it drifts through the luminous sky.

  Across 155 music loops spanning deft piano figures, flickering ambient textures, silky instrumental riffs and organic drum rhythms, this 491mb set of royalty-free loops, samples and MIDI will transport your music to a place of deep tranquility and reflection.

  From sweet, sonorous piano chords and airy, lilting melodies, lush string parts, gentle tuned percussion and characterful drum patterns that combine drum machines with found sounds and foley, this library represents a deep meditation on the soft, nourishing sound of contemporary classical music.

  Layers of subtle, atmospheric texture and signature shimmering ambient drones, crafted from piano and instrumental sources, completes the selection, ready and waiting to be effortlessly sprinkled over your next DAW session.

  Rounding things off are 73 tail samples, designed to be paired with the loop of the same name, and 75 key and tempo-labelled MIDI loops, which grant you direct access to all of the melodic, harmonic and rhythmic content heard in the main loops folder.
