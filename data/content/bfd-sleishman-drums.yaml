description: BFD Sleishman Drums is an expansion for bfd3, bfd eco and bfd2
  featuring sleishman free-floating drums.
details: |-
  Bfd sleishman drums features a maple classic kit and a bonus reduced-detail
  14" maple snare played with both sticks and rods. The kick is tuned to be
  punchy and tight and is recorded with felt and rubber beaters.

  The 3 included toms possess stunning natural sustain and are provided with
  additional rim shot and rim click articulations (bfd3/bfd2 only).
specs: |-
  - Expansion for bfd3, bfd eco and bfd2
  - 20" kick drum
  - 10" tom
  - 12" tom
  - 14" tom
  - Reduced-detail sleishman snare
  - Extra tom articulations (bfd3 and bfd2 only)
  - Felt and rubber beaters
  - Rim shot articulations
  - Rim click articulations
  - Sticks and rods playable
  - Free-floating drum system
  - Patented tuning system
  - Windows 7 or above
  - Os x 10.8 or above
  - Bfd3 v. 3.2.1.2 or above required
  - Internet connection for download and authorization
  - 23 GB disk space required
  - SSD recommended
