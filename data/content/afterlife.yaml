details: |-
  Afterlife is a Kontakt library featuring 5.1 GB of sample content spread across 700 patches in 11 categories. The sounds have been processed and morphed from several different sound-sources, everything from acoustic instruments like piano and guitar, to analogue sounds from a modern modular synthesizer.

  The library content covers a wide scope of different genres (cinematic, ambient, dnb, etc.), but its goal is not to provide bread and butter sounds for modern genres, instead the focus is to bring unusual and unexpected sounds to give extra spice to your compositions.

  Distorted synth brass from dystopian lands, surrealistic drones from your weirdest nightmares, ethereal pads full of enlightenment and morphed acoustics that sound both natural and otherworldly, all in the same library.

  Tweak the sounds fast and easy using the simple interface that provides a filter, amp envelope, 4 band eq, arpeggiator and 4 custom fx buttons. These buttons offer easy tweaking of all patches, just with a one or two clicks.

  The 11 categories are: arps. Bass. Bells and mallets. Drones. Dystopian orchestra. Leads. Morphed acoustics. Pads. Percussion. Risers. Synthesis.
