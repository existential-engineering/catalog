details: |-
  Highly inspired by the work of vangelis and jean-michel jarre, angelicals is a
  retro-futuristic flashback in progressive and experimental electronic music.
  The 101 presets, divided into arpeggios, bass, effects, leads, loops, pads,
  and synth categories, provide everything you need to dive right into the
  dramatic tension and enigmatic realms of sci-fi and thriller sounds.

  Ultra analog va-3 - angelicals by applied acoustics systems is a virtual
  instrument audio plugin and soundware (samples or presets that load into other
  products) for macos and windows. It includes, and is therefore "powered by",
  aas player, which functions as a VST plugin, an audio units plugin, a VST 3
  plugin and an AAX plugin.
