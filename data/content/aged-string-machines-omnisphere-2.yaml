details: >-
  Aged string machines contains 45 vintage presets for spectrasonics omnisphere
  2. All patches here are based on omnisphere's soundsources at the core of
  their sound design. The result encompasses a retro sonic identity derived from
  past decades. Those presets could find their places in cinematic music
  productions, retro electronic genres, new age and progressive rock.


  A new point is crispy and carries a majestic temper, calm and vintage speaks
  by its own name. Choir of the forest is a calming and nostalgic synth choir
  and digital dawn is an emotional atmospheric pad synth. Dream of dystopia has
  a saturated bright tone, while emotional strings is a classic long pad.


  Moving forward we could listen to the ten film noir sounds. Those have a dark
  vintage character and granular synthesis was widely used for most of those. I
  could describe them as synth orchestral patches full of sensation and
  sentiments with those patches we can add some tension in a retro way, mostly
  at the mid frequencies.


  Flat dark choir is a very compressed synth ensemble of voices and futuristic
  glance adds some hollow sonic dimensions. Give me your hand sounds very
  optimistic and majestic universe is great for quick synth performances. In
  general, the soundbank has a vintage point of view with some sci-fi touches.


  This time I assigned mod wheel to a tremolo effect device while aftertouch
  adds some destructive and disharmonic sonic characteristics using ring
  modulation. You could change the rate of the tremolo on the effect page of the
  synth and adjusting the speed on will. The speed is counted in hz and there is
  no sync to note values. Patches were created with omnisphere 2.8 and run best
  with this or newer edition.
specs: |-
  - 45 vintage presets
