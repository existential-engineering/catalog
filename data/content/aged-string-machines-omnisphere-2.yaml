  - Spectrasonics omnisphere 2 compatible
  - Soundsources-based sound design
  - Mod wheel tremolo effect
  - Aftertouch ring modulation
  - Tremolo rate adjustment in hz
  - No sync to note values
  - Omnisphere 2.8 or newer required
