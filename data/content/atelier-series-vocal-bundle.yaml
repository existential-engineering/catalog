description: 5 GB collection of meticulously-crafted legato vocals from 3 different singers.
details: |-
  Musical sampling recorded all the legato "long style" a technique that takes
  far more recording time but ensures a smooth sustain after the legato
  transitions have sounded. In addition to tuning, frequency adjustments and
  extensive balancing, all three libraries went through a rigorous programming
  period that involved zeroing in on precise start-time values for every legato
  interval individually; down to millisecond adjustments to find their specific
  sweet spots.

  The result: responsive, emotive and balanced legato patches that transition
  smoothly throughout the entire range.

  Maggie: rich, soulful female legato vocals. Legato vowels: ooo, mmm, ahh. 1.7
  gb compressed ncw format. Amy: angelic, cinematic female legato vocals. Legato
  vowels: ahh, mmm. 1.4 gb compressed ncw format. Fauxgorian: lush, cinematic
  male legato vocals. Legato vowels: ooo, mmm, ahh. 2.1 gb compressed ncw
  format.

  Requires full retail version of kontakt 5.8.1 or higher.
