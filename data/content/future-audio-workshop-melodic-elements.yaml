description: MacShooter, the multi-platinum wunderkind behind hits like Turn Yo
  Clic Up, brings the first artist pack to Notes. Expect hybrid melodic textures
  that blur the line between instrument and atmosphere.
details: |-
  Explore warped melodic textures, glitchy deconstructed pianos, and ethereal pads in MacShooter's signature aesthetic.

  Drawing on his love of analog equipment, melodic elements, and deep textures, each sound brings movement and evolving detail.

  Largely sample-based and created from Mac's collection of analog synths, pedals, and Eurorack, this pack includes 20 presets and 24 chord progressions that feel expressive, atmospheric, and instantly inspiring.

  Designed by MacShooter, multi-platinum producer and sample creator shaping the sound of modern hip-hop.

  Once your purchase is complete, the pack will show up in your FAW account. Simply download the zip file and import your new sounds into Notes.
