details: |-
  Kevin and Kane Churko are leaders in the music industry, working with some of the biggest names in rock including Ozzy Osbourne, Disturbed, Rob Zombie, Five Finger Death Punch, In This Moment, Papa Roach and Skillet, which has earned both engineers acclaimed Juno and GMA Dove awards.

  Owners of The Hideout Recording Studio in Las Vegas, Kevin and Kane have been collecting their favorite tones over the years while working with those artists, and have gathered them into this extremely versatile pack. It's the ultimate studio tool kit.

  Kevin and Kane's pack contains 94 captures.
