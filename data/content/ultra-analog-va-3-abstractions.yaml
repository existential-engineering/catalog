details: |-
  Abstractions is a collection of 127 signature sounds covering standard analog categories but revisited with richard devine's unique style and aesthetics.

  These finely crafted sounds include super precise percussion hits, unusual basses, thick pads, deep and animated arpeggiator loops, rich intricate ambient textures, and more.

  This collection of exclusive sounds once again showcase beautifully richard devine's mastery of sound design and are sure to provide many hours of exploration in evocative soundscapes.

  Ultra analog va-3 - abstractions by applied acoustics systems is a virtual instrument audio plugin and soundware (samples or presets that load into other products) for macos and windows.

  It includes, and is therefore "powered by", aas player, which functions as a VST plugin, an audio units plugin, a VST 3 plugin and an AAX plugin.
