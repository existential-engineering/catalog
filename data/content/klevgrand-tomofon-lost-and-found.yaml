details: |-
  This Tomofon Expansion pack is an eclectic collection of sound material from unorthodox sources like toys, garbage and kitchen utensils. In search for audio models to this pack the material of the sampled objects was prioritized over musical connection. The resulting sound collection offers a free and creative soundscapes, often with a maintained character of the original source.

  Whether you need to find a whole new kind of sound for a unique lead melody or add atmospheric ambiences to moving image, this pack will give you the creative boost you need to breathe new life into your music!

  This is an Expansion Pack for Tomofon, you will also need a license of Tomofon to use it (bought separately), or the installed iOS app.

  This Expansion Pack works both on macOS/Windows and iOS.
