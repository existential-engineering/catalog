details: |-
  The User Interface Library by Krotos is a specialised SFX library that offers a versatile collection of notification and interaction sounds for apps, interactive media, games and devices.

  Professionally recorded and designed by Krotos, this library contains 346 unique sound assets that span simple button clicks, glassy sweeteners, magic chime risers, negative and positive elements, whooshes, notifications and everything else needed to bring an app, game, website or UI project to life.

  Sound categories included in this library: Alerts, Tech, Sci-Fi and Retro. Content covers alerts, background, book, broken and error, buttons, chimes, clicks, notifications, magic, modern, positive and negative, pulse, retro, scanning, sci-fi, tech and whooshes.

  The purchase contains two downloads: a zip file with all source sound effect asset files plus a metadata PDF, and an installer for the integrated Weaponiser library including assets and presets.
specs: |-
  - 346 sound files
  - 403 MB size, 423.7 MB for the Weaponiser integrated version
  - 24 bit / 96 kHz high-quality WAV files
  - 100% royalty-free commercial license
  - Embedded metadata
  - 73 Weaponiser presets
