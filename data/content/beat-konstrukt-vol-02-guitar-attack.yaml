details: |-
  The artistic concept: electric guitar meets electronic music. The guitar takes
  were optimized for music production in the mainstream styles of electronic and
  pop/rock music. The designed guitar sounds will inspire any producer.

  To give you more freedom every guitar loop is offered ready-to-use with
  effects and also in a clean version (without amping or effect processing).

  The guitar, a real fender stratocaster, was played by german artist hansi
  kremer, pre-amped with tl audio processor and originally recorded in 24-bit.

  Guitar attack is more than a simulation of a classic fender guitar. It offers
  many fresh sounds and ways to work with its sample content.
specs: |-
  - Over 270 single guitar loops
