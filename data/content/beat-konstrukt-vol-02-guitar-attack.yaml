  - Wav 24-bit format
  - Clean version and variations with processed recordings
  - Phrase length of 1, 2 or 4 bars
  - Sorted by tempo from 60 to 140 bpm
  - Bonus samples (FX, hit, atmo)
  - Fender stratocaster
  - Tl audio processor pre-amped
  - 24-bit recording
