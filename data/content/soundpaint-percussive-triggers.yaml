details: |-
  Free Percussion ... and lots of it! Meet Percussive Triggers, a fresh new kind of Soundpaint instrument designed to add instant energy, character, and texture to your instruments. It's a huge free collection of percussive and found percussive instruments, captured with beautifully detailed accents to your music. Making it feel more alive and expressive. Inside you'll find an inspiring mix of instruments and everyday objects, including assortments of congas, hand claps, wooden planks, metal pipes, glass, bubble wrap, and many more unexpected percussion sources. Use it as a powerful standalone percussion instrument, or layer it on top of your existing SoundPaint libraries as Attack Triggers to add punch, definition, and personality to any sound. Whether you want subtle accents or bold rhythmic hits, Percussive Triggers is packed with creative "hidden gems" that bring new color to your palette and make familiar instruments feel completely fresh. Free. Massive. Surprisingly addictive.
