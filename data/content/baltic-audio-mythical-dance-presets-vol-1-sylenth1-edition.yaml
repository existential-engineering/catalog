details: |-
  'Mythical Dance Presets Vol 1 (Sylenth1 Edition)' by CESA SAMPLES takes you through the sounds of EDM and dance artists of the 2000s. The pack holds 128 presets for the Sylenth1 synthesizer for Dance and Hands Up tracks, including hand-crafted leads, basses, plucks, pads and more.

  The creator of this sound bank is the Hands Up and Hard Dance producer DJ THT. The project was made with further interest and support by 'Ced Tecknoboy', 'Bonkerz' and 'TimeWaster'.

  The 128 Dance presets for Sylenth1 are inspired by Hard Dance, Dancecore and Hands Up.

  In addition, 45 MIDI files taken from the demo are included.

  This product is a cooperation between CESA SAMPLES and baltic audio.

  Please note: The drums and some FX used in the demo are not included in this product. These presets require v3.06 or higher of LennarDigital Sylenth1.
specs: |-
  - 128 Sylenth1 Presets
  - 43 Leads (Presets)
  - 25 Bass (Presets)
  - 15 Arpeggios (Presets)
  - 13 Synths (Presets)
  - 8 Chords (Presets)
  - 6 Pads (Presets)
  - 5 Fx (Presets)
  - 4 Drums (Presets)
  - 4 Plucks (Presets)
  - 3 Bells (Presets)
  - 2 Brass (Presets)
  - 45 MIDI Files
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
