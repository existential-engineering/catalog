description: "'Mythical Dance Presets Vol 1 (Sylenth1 Edition)' by CESA SAMPLES
  is a 128-preset Sylenth1 soundbank for 2000s-style Dance, Hands Up and EDM,
  programmed by producer DJ THT. It also includes 45 MIDI files taken from the
