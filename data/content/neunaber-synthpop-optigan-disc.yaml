details: |-
  SYNTHPOP was the very first new Optigan disc we created in 2008. We were eager to make something completely anachronistic for the instrument. It was only done as a test, and never issued, though a demo of it appeared on YouTube at the time. Having received many requests for this disc over the years, we finally decided to revisit it, rework it, and issue it to the masses. Chords: Synth bass and chords

  Keys: Lead synth

  SFX:

  Arranged and mastered by Pea Hicks

  Disc design and mastering by Robert Becker

