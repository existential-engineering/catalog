details: |-
  Vocals, 180+ Samples (Loops & Oneshots), MIDI, Presets for Serum, Massive and Sylenth1 for SLAP HOUSE and EDM.

  'Slap House Essentials Vol 2' from baltic audio brings together Slap House samples, loops, presets and vocals, including drums, basses, synths, vocals and more.

  This royalty-free pack provides the elements needed for Slap House productions.

  The vocals come along with dry and wet versions.

  64 MIDI files are included for the majority of musical phrases heard in these kits, together with a collection of presets for the Serum, Massive and Sylenth1 synthesizers.

  The numerous ready-to-use loops also allow quick results.

  You can use this pack for genres like Slap House, Bass House, EDM, Dance, Pop and more.
