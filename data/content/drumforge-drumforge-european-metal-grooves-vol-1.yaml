details: |-
  European Metal Grooves: Vol. 1 is a MIDI groove pack featuring 420 drum grooves and fills performed by Leo Margarit, a world-class drummer known for his work with Pain Of Salvation (Century Media Records). The pack covers a wide spectrum of metal subgenres including death metal, black metal, power metal, prog metal, djent, and thrash metal.

  All grooves and fills are delivered as MIDI files, making them compatible with any DAW or drum plugin. They also integrate directly with the Drumforge Bergstrand Sampler for seamless workflow in metal production. The performances span everything from breakdowns and blast beats to intricate fills and beyond.

  The drum parts are organized by individual song sections, allowing producers to quickly build songs by selecting and assembling the right grooves. Users can freely adjust dynamics and tempo to match their project requirements.

  The pack is delivered as an instant digital download with a perpetual license, free lifetime updates, and unlimited customer support.
