details: |-
  European Metal Grooves: Vol. 1 is a MIDI groove pack containing 420 drum grooves and fills played by drum virtuoso Leo Margarit of Pain Of Salvation. The material covers death metal, black metal, power metal, prog metal, djent, thrash metal, and more.

  The performances range from breakdowns and blast beats through to complex fills, and are supplied as MIDI files for use in any DAW or with any drum plugin. They integrate directly with the Drumforge Bergstrand sampler, which ships with a lite version of this pack.

  Grooves are organized by individual song sections so arrangements can be assembled quickly, whether writing new songs or refreshing existing demos. Dynamics and tempo are freely adjustable.

  The pack works equally well as a practice tool or as a production resource for metal writing.
