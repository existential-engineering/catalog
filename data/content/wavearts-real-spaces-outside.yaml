details: |-
  The Outside Library offers a diverse range of outdoor spaces, suited to Foley and to productions requiring realistic or larger-than-life outdoor ambience.

  The collection includes a variety of outdoor environments, along with 14 specific files that combine multiple spaces for highly detailed soundscapes. It ranges from slapbacks and long reverb tails to dense and intimate outdoor spaces.

  Real Spaces Outside is included in the Real Spaces Complete bundle.
