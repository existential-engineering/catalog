details: >-
  This set contains 88 free sounds for the diva software synthesizer from u-he.


  Diva is so versatile that certain sounds are very authentic in the style of a
  juno or jupiter synthesizer.


  In addition, you will also find sounds in the set that are not directly based
  on analog models.


  The set is meant as an extension to the first diva soundset with 66 sounds.
