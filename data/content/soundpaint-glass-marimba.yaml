details: |-
  Crystal Clear. Radiant Resonance

  In this custom creation, the traditional wooden bars on a marimba have been replaced with beautiful, resonant glass bars. This innovative twist infuses the classic marimba sound with a light and bright timbre, expanding its palette to encompass a richer and lower tonal range. While reminiscent of a xylophone in its playing method, the Glass Marimba boasts its own distinctive character, with a delicate twist that sounds like a newly-discovered musical tradition. We took great care to deep sample this brilliant instrument in stunning detail. The core articulations, including soft mallets, hard mallets, muted strikes, and finger touches, serve as the foundation of this comprehensive library. To enhance the possibilities of this glass creation, we created an array of effects and ambient patches, all crafted from the Glass Marimba samples. With all of the new custom preset programs, spanning from trance-inspired tones to immersive pads and intricate effects, this library introduces an expanded world of sonic exploration.
