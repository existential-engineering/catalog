details: |-
  The first adpak played with both felt mallets and sticks. Meticulously
  recorded in soundtrade studios renowned big room, this kit delivers that
  spacious, warm and dark sound.

  The shells of this boutique wacco kit are handcrafted from heat treated maple
  with a natural satin oil finish and features maple hoops with rope tuners.
  Equipped with extra thick drum heads they achieve a unique warm tone with a
  big and dense attack.

  This bespoke drum kit is matched with a set of hand-picked thin and dry
  cymbals from the meinl byzance series. For maximum versatility, this kit was
  recorded playing with both mallets and sticks.

  Carefully captured in the renowned big room in soundtrade studios for that
  spacious, warm sound - perfect for organic mixes and cinematic soundscapes.

  Boutique mallets comes packed with great presets to get you to a flying start.
  Boutique mallets contains: kick: 22x14" wacco old school. Snares (mallets &
  sticks): 14x6" hip custom (snares off). 14x6" hip custom (snares on). Toms
  (mallets & sticks): 13x9" wacco old school (tuned hi). 13x9" wacco old school
  (tuned lo). 16x16" wacco old school (tuned hi). 16x16" wacco old school (tuned
  lo). Cymbals: 14" meinl byzance dual hihat (sticks). 18" meinl byzance extra
  thin (mallets). 19" meinl byzance extra thin (mallets). 20" meinl byzance
  extra thin (mallets). 20" meinl byzance extra thin (sticks). 21" meinl byzance
  transition ride (mallets). Extra: meinl claves.
