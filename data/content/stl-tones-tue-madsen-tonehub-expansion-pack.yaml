details: |-
  Tue Madsen has been at the forefront of metal production for over 30 years, responsible for some of the most successful and genre-defining records the industry still references today. Owner of Antfarm Studios in Denmark, his engineering for guitar and bass tones continues to inspire the next generation.

  Tue dug deep into the archives from bands like Meshuggah, Sick Of It All, Moonspell and Cataract to give you traced tones from those seminal recordings, including options for both the raw guitar tone and the mixed version for ultimate flexibility.

  Tue's pack contains 174 captures.
