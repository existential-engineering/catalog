details: |-
  Medusa is a modern ensemble drum library created for trailer producers as well
  as film, game and television composers. Musical Sampling made it a point to
  smack the living snot out of the drums for the top velocities. Getting the mix
  presets dialed-in was just as crucial and took the most time during medusa's
  production cycle to really get right.

  Hermes is a tight, punchy mix. Centaur is the all-rounder while zeus takes
  excellent advantage of the room tone. The gorgon mix is a hyped, massive,
  punchy mix designed specifically for trailers.

  Musical sampling created the concussion hits patch which is comprised of 49
  unique, aggressively-processed hits designed to be used as massive accents and
  low-end support. They also included a wavs folder of those hits and more for
  those who prefer that workflow (also makes sense for longer samples like
  risers).

  To complete the percussive side of medusa, musical sampling created the pulses
  patch - which includes a collection of live hybrid rhythms meant to act as
  detailed background layers in your percussion tracks. Move that modwheel up
  for a bit more involvement with those grooves.

  Also included is an arsenal of playable sound design patches which include
  drones, keys, guitars, basses, synths, cue starters, etc. Musical sampling
  recorded a lot of new source material and built these puppies from the
  ground-up.
specs: |-
  - Ensemble drums + sound design

  - Four mix presets (hermes, centaur, zeus, gorgon)

  - 12 toms, 4 kicks, 4 snares, 4 hi-hats, 8 crashes, 4 suspended cymbals, 4
  rides, 7 tambourines, 7 stompers, 7 clappers, gran casa

  - Concussion hits patch with 49 unique aggressively-processed hits

  - Wavs folder for concussion hits samples and risers

  - The pulses patch with live hybrid rhythms

  - Playable sound design patches (drones, keys, guitars, basses, synths, cue
  starters)

  - Live eighth-note hi-hat grooves at 90/120/140 bpm with DAW tempo sync

  - Crossfade-able hi-hat grooves (five different hi-hat states)

  - Groove speed control (half/normal/double)

  - Adjustable humanization feature (off/tight/natural/loose)

  - Volume control for each drum group

  - Assignable kontakt outputs for each drum group

  - Recorded in 48khz/24-bit

  - 5.2 gb compressed ncw format

  - Compatible with kontakt 5.8.1 or higher (requires full retail version of
  kontakt)

