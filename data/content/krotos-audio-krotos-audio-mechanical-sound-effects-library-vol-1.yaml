description: A comprehensive mechanical sound effects library recorded at Elgin Motor Works in Fife, Scotland by the Krotos sound design team. Features 1,398 sound files spanning pneumatic tools, metallics, impacts, and power tools including drills, motors, car ramps, welding torches, grinders, and pneumatic equipment. Delivered in 24-bit/192 kHz WAV format with embedded metadata, plus native integration for Weaponiser and Reformer Pro.
details: |-
  The Mechanical Vol. 1 Sound Effects Library packs a collection of mechanical sound effects into a high-quality library, bringing the noise of mechanical tools to a sound design project.

  Recorded by the Krotos sound team at Elgin Motor Works in Fife, Scotland, this collection contains a broad selection of designed and source mechanical sounds including drills, motors, ramps, welding torch, grinders and pneumatic tools.

  The library was recorded in a garage with the assistance of a skilled mechanical engineer, and is described as a resource for mechanical and pneumatic devices and a creative jumping off point for sci-fi sound design. Beyond recording the mechanical lifts, tools and equipment in the space, Krotos designed a library of Reformer Pro and Weaponiser presets built on the material.

  The purchase contains three downloads: a zip file with all source asset files and a Metadata PDF, an installer for the integrated Weaponiser library including assets and presets, and an installer for the integrated Reformer Pro library.

  Sound categories included are Pneumatic Tools, Metallics, Impacts and Power Tools. Keywords cover air grinder, air gun, angle grinder, barrel hit, bench grinder, blowtorch, car ramp, chain, depressurise, drill, garage, grinder, hand vice, impact, mechanical, metallic, oil barrel, pneumatics, power down, power tools, pulley, sci-fi, steampunk, tire changer, tools and welding.
specs: |-
  - 1,398 sound files
  - 3.63 GB size (Weaponiser) / 1.93 GB (Reformer Pro)
  - 24-bit / 192 kHz high-quality WAV files
