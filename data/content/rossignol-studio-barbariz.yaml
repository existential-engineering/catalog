details: |-
  Barbariz is a barrel organ created by Rossignol-Studio for Native Instruments
  Kontakt 5, from a real organ of 36 notes (courtesy of the site odfgrandorgue).

  It is composed of four registers with the typical sounds of this kind of
  instrument.

  Four octaves c1 to g4 for the three main sounds.

  Convolution reverb knob can be operated or not.

  Each register can be mixed at will which offers a range of this barrel organ
  of varying colors.
specs: |-
  - Native Instruments Kontakt 5 compatible
  - Four registers
  - Four octaves c1 to g4
  - Convolution reverb
  - 24-bit 96khz samples
  - 36 notes
