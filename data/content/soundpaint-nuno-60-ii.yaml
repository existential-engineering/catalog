details: |-
  Two UDS Sampled Juno 60s. Nuno 60 II is hyper-realistic vintage representation of the iconic Juno 60 synthesizer (Weeknd, Depeche Mode, A-Ha, Cure, Wham, Eurythmics, Lauper, Frahm etc). Shaping countless iconic hits all the way from early 80s till today. We recorded the two distinct vintage Juno 60s so deeply we will never need to turn the hardware on again. The keys to happiness. Nuno 60 II was created by Ultra Deep-Sampling two different vintage Juno 60s feat. over 16.500 UDS Samples. All samples are processed with our new C.A.F (Capture Analog Filter) Technology, capturing all the exact characteristics and behaviors of real vintage filters. The sizzling, juicy warmth of the Juno 60 defined the sound of artists such as The Weeknd, Nils Frahm, A-ha, Billy Idol, Eurythmics, Wham, The Cure, and Cyndi Lauper—capturing the essence of their iconic hits with unparalleled accuracy. You are invited to explore deepest lush nostalgic pads. Warm cinematic Arps - also recorded with real tape delay. Iconic chorus 80s Pads and Brasses. Warm vintage basses. Trance leads. Pianos. Analog Plucks and Pulses. All captured with exceptional fidelity. Oscillators were recorded both raw and in both famous Chorus Modes. All oscillator settings recorded through premium hardware (NEVE, API consoles, Meris, and Strymon pedals), the Nuno 60 II offers an authentic analog experience. It is not an emulation or a simulation. The keys to happiness.
