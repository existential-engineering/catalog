description: BFD Sphere is a hard rock and metal expansion pack for bfd3, bfd
  eco and bfd2 produced by tesseract and 4d sounds founder acle kahney.
details: |-
  The pack includes high-detail 4-tom dw and vibe kits alongside a ludwig black
  beauty snare. Drums were tuned to complement the acoustics of sphere's live
  room and were hit by jamie postones (tesseract) and mike malyan (monuments) -
  highly skilled drummers well respected for bringing a new force to modern
  drumming.

  Neve preamps were used throughout for warmth and definition. As well as the
  natural kits, bfd sphere comes with additional processed versions designed to
  be dropped straight into metal and hard rock mixes.

  All kits feature presets in bfd3, bfd eco and bfd2 formats with factory
  cymbals and hihats. Please note that the included snare features hit and
  rimshot articulations only.
specs: |-
  - Expansion pack for bfd3, bfd eco and bfd2
  - 4-tom dw and vibe kits
  - Ludwig black beauty snare
  - Natural and mix-processed versions
  - Neve preamps
  - Hit and rimshot articulations
  - Factory cymbals and hihats
  - Windows 7 or higher
  - Os x 10.6.8 or higher
  - Internet connection for download and authorization
  - Disk space: 15 GB full install, 7.5 GB medium install, 5 GB small install
