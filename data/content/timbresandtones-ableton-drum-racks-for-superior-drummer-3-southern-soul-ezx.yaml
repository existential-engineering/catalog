details: |-
  Ableton Drum Racks for Superior Drummer 3 Southern Soul EZX features separate
  Ableton drum racks for all factory presets for the toontrack superior drummer
  3 southern soul ezx expansion library. These racks provide out of the box
  integration workflow between Ableton live and toontrack superior drummer using
  the ezx expansions including a host of features ready to use for composition
  and performance using Ableton push or similar controllers.

  26 ableton drum racks to instantly load the factory library "mix ready"
  presets with ableton mappings. 13 ableton live templates designed to host the
  multi channel output routing presets with track level audio routing from
  superior drummer 3 into ableton live.

  Colour coded pad design for visual performance and finger drumming. All racks
  use consistent drum rack colouring so you can visually and immediately spot
  your rides from your hi hat articulations. Vast array of instrument
  articulations ready to go in one massive layout using ableton push 64 pad
  layout mode.

  Ableton macros mapped to toontrack superior drummer macros with preset values
  for ease of use in push and simple to use automation programming. Singleout
  presets feature 13 ableton drum racks for all southern soul 60s and southern
  soul 70s ezx factory presets with single audio output to a single ableton
  track.

  Multiout presets feature 13 ableton drum racks for all presets in multiple
  audio channel output from the plug in to multiple ableton audio tracks using
  the multi output ableton templates. Use the template racks and extend to your
  own toontrack superior drummer 3 southern soul ezx presets, swapping out
  individual sounds or articulations.
specs: |-
