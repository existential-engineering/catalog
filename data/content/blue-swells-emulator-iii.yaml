description: "'blue swells' is an amazing collection of new banks and presets
  made for the e-mu emulator iii sampler and compatible (eiiix, esi)."
details: |-
  The ppg wave 2 is the legendary 1980's digital/analog hybrid machine that
  inspired generations of synths to come. The wave 2 featured digital
  oscillators capable of producing up to 8000 unique waveforms modified by
  analog filter and amplifier circuits.

  The fizmo is a 48-voice synthesizer which uses 2nd-generation transwave
  technology to create very organic sounds unlike any other synth available.

  Ensoniq mirage with soundprocess has additive synthesis capability plus up to
  4 independent oscillators which can be stacked together.

  One multi-sample instrument per bank with multiple presets using different
  analog processing programmed on the emulator three.
specs: |-
  - 87 sound banks
  - Over 400 presets
  - Eb3 (fat) format
  - Image disk format (.img) ready for zuluscsi
  - 16-bit 44.1 kHz or 28 kHz
  - Size: (eb3) 509 MB installed, (.img) 961 MB installed
  - Version: 1.3.1
  - Compatible with e-mu eiii xp/xs
  - Compatible with esi-32/2000/4000
  - Compatible with kurzweil k serie
  - Compatible with akai s3000xl/s3200xl
  - Multi-sample instrument per bank
  - Multiple presets using different analog processing
