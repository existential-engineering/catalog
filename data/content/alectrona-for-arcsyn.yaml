details: >-
  A collection of 100 presets for arcsyn by spc plugins. This synth has some
  interesting oscillators and deep modulation capabilities which leads to some
  interesting paths throughout the pads and sequences.


  There is plenty of atmosphere amongst the pads and some ambient style keybeds
  which make for good noodling.


  The sequences range from full on track inspiration loops to dreamlike
  tangerine dream style sounds.


  All presets make use of both aftertouch and the mod wheel.


  61 bass, leads and pads; 39 sequences
