details: |-
  Neal Tiemann is an American guitarist, songwriter and producer. He spent six years in groove metal band DevilDriver, appearing on Trust No One , Outlaws 'til the End and Dealing with Demons I , and has since joined deathcore band Carnifex. He is also lead guitarist and songwriter for Midwest Kings, and served as lead guitarist and music director for American Idol winner David Cook, playing on his platinum-selling self-titled debut and This Loud Morning . He has recorded with Shinedown, Burn Halo, Carolina Liar and Uncle Kracker.

  Built around five of Neal's go-to guitar amp, cab and pedal setups, this signature collection covers all of his playing styles, whether in the studio or for live shows.

  Neal's pack contains 78 captures.
