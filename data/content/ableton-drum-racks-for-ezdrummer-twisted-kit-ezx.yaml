name: Ableton Drum Racks for ezDrummer Twisted Kit EZX
manufacturer: timbresandtones
primaryCategory: drum-sample-pack
description: Ableton Drum Racks for ezDrummer Twisted Kit EZX features drum
  racks for all factory preset
details: |-
  New in v1.1 multiple audio channel output presets and ableton live multi out
  template designed specifically for the audio routing of the toontrack
  ezdrummer twisted kit ezx expansion.

  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all ezx factory presets from ableton push
  controller device browser. A massive 234 ableton drum racks to instantly load
  the factory library "mix ready" presets with ableton mappings.

  Singleout presets featuring 117 ableton drum racks for all factory presets
  single audio output to single ableton track. Mixing can be further enhanced
  through ezdrummer mixer or additional ableton audio effects to the track for
  example the new ableton 10 drum buss. Multiout presets featuring 117 ableton
  drum racks for all presets in multiple audio channel output from the plug in
  to multiple ableton audio tracks using the multi output ableton template also
  provided.

  Use the template racks and extend to your own toontrack ezdrummer twisted kit
  presets, swapping out individual sounds or articulations. You are 100% ready
  to go with the factory presets but there is no limitation to creating your own
  presets from these templates.
specs: |-
  - 234 Ableton drum racks
  - 117 singleout presets
  - 117 multiout presets
  - Color coded pad design
  - Individually labelled drum rack pads
  - Mapped Ableton macros to ezdrummer macros
  - Multiple audio channel output
  - Ableton push 2 color pads mode
  - Ableton live 9.5 or above
  - Toontrack ezdrummer2 compatible
  - Toontrack ezdrummer twisted kit ezx expansion compatible
  - Audio routing options
  - Track level audio mixing control
  - Ableton live clip editor automation
