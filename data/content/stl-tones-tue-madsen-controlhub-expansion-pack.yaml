details: |-
  Tue Madsen is a Danish producer and mix engineer whose work has helped define the sound of modern metal, with seminal recordings from bands including Meshuggah, Sick Of It All and Moonspell.

  For this expansion pack he has held nothing back, giving you the most detailed emulations of the signal chains used on those records plus the chains he turns to currently when mixing. Included are dialed-in starting points for kicks, snares and toms, covering every element of a modern drum kit. Tue has taken this a step further, embracing the power of ControlHub by giving you the option to load these captures with his go-to bus processing or without, opening up even more mixing possibilities. With in-the-box master bus chains and completely analog hardware chains, this pack includes everything needed for the most demanding metal mix.

  This expansion pack has a total of 134 captures.
