description: Mix-ready one-shot drum samples from extreme metal producer Dave Otero, whose credits include Cattle Decapitation, Khemmis, and Archspire.
details: |-
  Drumshotz Dave Otero collects the favourite one-shot drum samples of extreme metal producer Dave Otero, who has been building drum sounds for over 20 years with bands including Cattle Decapitation, Khemmis, and Archspire, and is known for clarity, punch, and weight.

  The pack covers kicks, snares, and tom sets. The samples are supplied mix-ready so they can be blended with existing sample libraries or raw drum recordings, or used to replace them entirely.

  All 38 samples are delivered at 24-bit / 44.1 kHz for use with any drum triggering program or DAW.
specs: |-
  - 38 one-shot drum samples total
  - 24-bit / 44.1 kHz format
  - Includes kicks, snares, and tom sets
  - For use with any triggering program or DAW
