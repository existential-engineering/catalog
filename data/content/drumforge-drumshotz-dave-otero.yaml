description: Drumshotz Dave Otero is a one-shot drum sample collection from extreme metal producer Dave Otero (Cattle Decapitation, Khemmis, Archspire), featuring 38 samples in 44.1 kHz / 24-bit format. The pack is designed to enhance, blend, or replace drum sounds in any mix.
details: |-
  Drumshotz Dave Otero is a set of WAV one-shot drum samples built for enhancing drum mixes. One-shot samples are powerful tools for adding punch and consistency, allowing mixers to cut through any mix regardless of source recording quality.

  Extreme metal producer Dave Otero (Cattle Decapitation, Khemmis, Archspire) brings his favorite one-shot drum samples to this pack. Dave has been forging drum sounds for over 20 years and is one of the go-to producers in the extreme metal genre, known for clarity, punch, and powerful drums.

  The pack includes kicks, snares, and tom sets, all delivered as an instant digital download with a perpetual license and free lifetime updates.
specs: |-
