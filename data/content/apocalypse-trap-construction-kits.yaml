details: >-
  Heavy. Dark. Powerful. Apocalypse: trap construction kits is all that and
  more. Boasting 50 construction kits and over 3gb of original content, this
  library is the perfect collection for the serious trap, hip hop, rnb and pop
  producer.


  Huge 808s, synth basses and earth-shaking drum beats provide a solid
  foundation while the synth leads, arps and fx provide the slice you need to
  make tracks stand out and shine.


  In addition to the regular loop content, each kit includes a folder of MIDI
  files for full flexibility and control over the melodic content of the track
  using your own virtual instruments.


  Apocalypse: trap construction kits has been formatted in the most widely-used
  formats: apple loops, acidized wav, and rex files, making it usable in
  virtually every piece of software and hardware on the market today.


  In addition, this library comes fully formatted for kontakt as part of the big
  fish audio kli 3.0 series which transforms this loop library into a truly
  moldable and musical writing instrument.
