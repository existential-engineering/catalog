details: |-
  This product falls squarely in the heritage category, being culturally intertwined with the white peaks of the alps. The instrument was recorded on location at the Alphorn centre in friesenheim, the south of Germany, and played by renowned player and Alphorn builder franz schssele, producing silky smooth soft tones and rattling shouts alike, sounding a bit like a very warm brass instrument even though the whole thing including the mouthpiece is made of wood.

  Since the alphorn has no valves it only plays nature-tone harmonics, in the case of this instrument upwards from a low f. Some of these harmonics are not exactly tempered to our modern ears (most notably the one between bb and b, and between db and d). The 'natural' version of the instrument preserves these untempered harmonics as you would get it with a real alphorn player.

  The added benefit of this approach was that recorded legato transitions of up to three octaves (!) up and down were added for the natural instrument. For general usability an 'extended' version was also made, mapping the samples over the missing notes, and tuning it in kontakt.

  This extended version is multitimbral, and capable of producing amazing beds of alphorn ensemble sweetness. Further controls in the instrument are very basic, with a 'growl' control and a basic eq and ir reverb.
specs: |-
  - Nature-tone harmonics
  - Legato transitions up to three octaves
  - Growl control
  - EQ control
  - IR reverb
  - Natural version with untempered harmonics
  - Extended version with sample mapping
  - Multitimbral capability
  - Kontakt-based tuning
