details: |-
  The OptiTron is an expansion pack for M-Tron Pro featuring 30 new tape banks and 150+ patches sourced from the Optigan, a popular 1970s home keyboard that used optically-read discs to play back pre-recorded rhythm and accompaniment tracks.

  Includes 25 rhythm tracks (all looped) and 5 lead sounds. Rhythm banks are in 4/4 at 110 BPM and 3/4 at 80 BPM, each with 35 notes per bank.

  Rhythm banks: Banjo Singalong, Big Band, Big Top Marching Band, Blues Sweet & Low, Bossa Nova, Cathedral Organ, Cha Cha Cha, Champagne Music, Classic Guitar, Dixieland Strut, Down Home, Easy Does It With Vibes, Folk & Other Moods, Gay 90s Waltz, Guitar in 3/4, Latin Fever, Majestic Pipe Organ, Nashville Country, Polynesian Village, Pop Piano, Rollin Easy, Romantic Strings, Singing Rhythms, Sleigh Ride, Vox Humana.

  Lead sounds: Choir, Flute, Harmonic Extra, Marimba, Organ.
