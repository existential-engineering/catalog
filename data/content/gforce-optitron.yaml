details: |-
  This add-on pack contains 30 new tape banks as well as over 150 patches for M-Tron Pro, including 5 leads and 25 looped rhythms.

  Originally manufactured by toy maker Mattel, the Optigan was an attempt to break into the burgeoning home entertainment market of the 1970s. It used LP-sized plastic discs on which sounds, backing tracks and effects were stored, read by an optical sensor on the instrument. Pushing a button gave you a backing track in a variety of keys, and you then played the keyboard to accompany it. Although several Optigan models were available, from the single speaker 34001 to the stereophonic and reverb-laden 35011, the operating principle remained the same throughout.

  The Optigan shipped with discs including Big Organ & Drums, Pop Piano Plus Guitar, Latin Fever and Guitar in 3/4 Time. Additional discs ranged from classics such as Singing Rhythms and Classic Guitar, the latter used to great effect by Jon Brion on the soundtrack to Eternal Sunshine of the Spotless Mind, to Nashville Country and Romantic Strings. Its lo-fi sound and build quality never really captured the public imagination, and a large percentage of Optigans either ended up as landfill or were sold on for a pittance. Steve Hackett used the Big Band disc on Sentimental Institution from the 1980 album Defector, but by and large the instrument was unknown in the UK.

  GForce’s interest began on hearing one in the USA at the turn of the century. Scanner told them the UK band Coil had an instrument and a large collection of discs, and Coil’s Peter Christopherson and Jhonn Balance invited GForce to their studio to begin the recording process.

  OptiTron is also available with new purchases of the M-Tron Pro Complete bundle, which includes M-Tron Pro IV and all the expansion packs, a 12.5 GB+ sound library with 525+ tape banks and 3700+ presets.
specs: |-
  - Patches: over 150 for M-Tron Pro
