  - 35 notes per tape bank
  - Backing tracks and effects: Banjo Singalong, Big Band, Big Top Marching Band, The Blues Sweet & Low, Bossa Nova Style, Cathedral Organ, Cha Cha Cha, Champagne Music, Classic Guitar, Dixieland Strut, Down Home, Easy Does it With Vibes, Folk & Other Moods, Gay 90s Waltz, Guitar in 3/4, Latin Fever, Majestic Pipe Organ, Nashville Country, Polynesian Village, Pop Piano, Rollin Easy, Romantic Strings, Singing Rhythms, Sleigh Ride, Vox Humana
  - Lead sounds: Choir, Flute, Harmonic Extra, Marimba, Organ
  - Delivery: direct download via “My Instruments” after purchase; requires a registered M-Tron Pro
