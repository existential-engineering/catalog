details: >-
  The kineticsoundprism impulse collection offers 598 impulse responses designed
  for ableton 9's max for live convolution pro reverb utilising the following
  hardware and dsp: eventide h8000, eventide h3000, roland rss10, alesis MIDI
  and quadraverbs, ams hardware, custom dsp software, spektral delay, and
  various vintage spring and plate reverbs.


  The impulse responses in the collection include: eventide h8000 environments,
  eventide h8000 spaces, eventide h3000 spaces, alesis MIDI and quadraverb
  spaces, outdoor spaces (real as well as emulated outdoor spaces), microspaces
  (small and minute as well as dry room reverbs), spektral fx, psychoacoustic
  delays and fx (hass and panning fx and stereo phase tricks), dsp designed
  'virtual environments' (emulating architectural spaces), dsp designed 'virtual
  spaces' (large and vast reverbs), and plates and springs.
