description: "Machine has one of the more eclectic resumé of a modern producer.
  From credits with Suicide Silence, Every Time I Die, The Amity Affliction and
  Four Year Strong to mixes for Fall Out Boy and White Zombie he’s crossed every
  aspect of rock, metal and electronica. From King Crimson to Lamb Of God and
  Clutch, Machine truly has become a master of his craft and has dug deep to
  find a tone for every occasion. The pack contains 90 presets created by
  Machine himself from his incredible collection of gear, and also some tones
  from his favorite record releases.There are 68 guitar presets, including
  acoustic tones, and 22 bass presets."
