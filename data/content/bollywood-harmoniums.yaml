details: |-
  Bollywood Harmoniums Kontakt library includes Bollywood Harmoniums (natural
  and sound design stuff), digital tanpura drones recorded from shruti box, and
  bonus raga phrase library (7 raga patches) with raga phrase based violin
  library.

  Three varieties of harmoniums are included: three reed, regular tone and 1930s
  harmonium, each with master and legato patch options for comprehensive sound
  design capabilities.

  The library features a multi-sampled three reed harmonium which includes male,
  female and bass reeds, allowing for diverse tonal characteristics and
  authentic indian harmonium reproduction.

  When coupler is activated, a lower octave note plays by itself to give extra
  bass, replicating how the coupler works in real indian harmonium instruments,
  with the extra bass playing under particular range of keys.

  You can control the dynamics of all patches via modwheel, and the library
  includes sound designed patches derived from bollywood harmonium samples for
  both authentic indian feel and new sound design possibilities.
specs: |-
  - Kontakt library
  - Three varieties of harmoniums (three reed, regular tone and 1930s harmonium)
  - Master and legato patch for each harmonium
  - Digital tanpura drones
  - Bonus raga phrase library (7 raga patches)
  - Multi-sampled three reed harmonium with male, female and bass reeds
  - Sound designed patches derived from bollywood harmonium samples
  - Custom script for Bollywood Harmoniums
  - Sample size 1.1 GB
  - Sample resolution 44.1 kHz / 24-bit ncw format
  - Kontakt 4.2.4 or higher full retail version required
  - Modwheel control for reed dynamics
  - Coupler function for extra bass
  - PDF documentation available
