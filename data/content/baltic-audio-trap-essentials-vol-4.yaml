details: |-
  'Trap Essentials Vol 4' from baltic audio brings you a powerful collection of Trap samples and loops to push your production to the next level. You'll find a bunch of 808s, drums, synths, chops, fx and more and some presets for Serum and Spire synthesizers.

  This pack provides you with all of the elements you need to make chart-topping Trap bangers.

  Each Kit contains perfectly mixed instrumentation and will be your essential source for creating instant Trap hits, which are just waiting for a vocal topline to be added.

  15 MIDI files are included for the majority of musical phrases heard in these kits. Together with the Serum & Spire presets and the oneshot samples there are no limits to your creativity.

  Of course, the numerous ready-to-use loops and stems also allow you to achieve great results very quickly.

  Additionally you will find a collection of 15 melody loops.

  Please note:

  The presets require v.1.1. or higher of Reveal Sound Spire and v.1.3 or higher of xfer records Serum.
specs: |-
  - 5 Construction Kits
  - 45 Oneshots (drums, percussion, fx)
  - 35 Loops
  - 50 Stems
  - 28 Serum Presets
  - 9 Spire Presets
  - 15 MIDI files
  - 15 Bonus Melody Loops
  - 500+ MB of content
  - Perfectly premixed
  - 44.1kHz/24-Bit WAV
  - PC/Mac Compatible
  - 100% Royalty-Free
