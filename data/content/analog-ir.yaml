description: Analog IR provides 110 beautiful pads for iZotope iris using the
  analog sample collection as building blocks.
details: |-
  Instruments are constructed using 1-3 samples and take full advantage of the
  spectral features of iris and most have aftertouch assigned to the filter
  cutoff.

  The intention was to provide musically useful pads full of texture and
  movement.

  All 209 wavs that form the analog sample collection are also available to
  explore when creating your own sounds.
specs: |-
  - 110 pads
  - 209 wav samples
  - iZotope iris compatible
  - Spectral features
  - Aftertouch to filter cutoff
  - Animated
  - Evolving
