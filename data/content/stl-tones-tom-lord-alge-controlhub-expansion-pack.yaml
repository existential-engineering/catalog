details: |-
  Tom Lord-Alge is a three-time Grammy Award-winning producer and mix engineer known for the evolution of modern rock with his aggressive, in-your-face mixing style. His mixing credits span U2, The Rolling Stones, Peter Gabriel, P!nk, Dave Matthews Band, Blink-182, Avril Lavigne, Sum 41, Marilyn Manson and Live's multi-platinum Throwing Copper . He won his first two Grammys for Steve Winwood's Back in the High Life and Roll With It , and a third for Santana's Supernatural .

  Utilizing the best advancements in audio technology, whether it's his Solid State Logic 4000 G+ console, the vast array of vintage analog gear, or innovative digital plugins, Tom Lord-Alge has earned an extensive list of certified multi-platinum selling records and remains a pioneer in creative and immersive mixing.

  This expansion pack captures the excitement TLA brings to all his mixes, with perfect starting points for drums, bass, and guitars. Knowing creativity comes in so many different forms, Tom has engineered these captures so you can experiment and take his original tried-and-true signal chains and make them your own. Included are captures of his mix bus processing, with his SSL console, must-have hardware compressors, and EQ.

  This expansion pack has a total of 86 captures.
