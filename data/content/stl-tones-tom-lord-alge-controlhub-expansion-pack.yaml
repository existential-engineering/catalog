description: "Tom Lord-Alge is a 3 time Grammy Award-winning producer and mix
  engineer known for the evolution of modern rock with his aggressive,
  in-your-face mixing style. Utilizing the best advancements in audio
  technology, whether it’s his Solid State Logic 4000 G+ console, the vast array
  of vintage analog gear, to innovative digital plugins, Tom Lord-Alge has
  earned an extensive list of certified multi-platinum selling records and
  remains a pioneer in creative and immersive mixing. This expansion pack
  captures the excitement TLA brings to all his mixes, with perfect starting
  points for drums, bass, and guitars. Knowing creativity comes in so many
  different forms, Tom has engineered these presets so you can experiment and
  take his original tried-and-true signal chains and make them your own.
  Included are captures of his mix bus processing, with his SSL console,
  must-have hardware compressors, and EQ. This expansion pack has a total of 86
  presets."
