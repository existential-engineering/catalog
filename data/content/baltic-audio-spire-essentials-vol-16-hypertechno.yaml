details: |-
  'Spire Essentials Vol. 16 - Hypertechno' is a preset pack for Reveal Sound Spire designed for modern Hypertechno, Hands Up, Dance, Slap House, Techno and high-energy EDM productions.

  The pack includes 64 royalty-free Spire presets and 45 MIDI files taken from the demo. You get ready-to-use leads, basses, plucks, drum-style presets, arps, pads and keys for creating energetic melodies, powerful basslines, driving drops and commercial dance productions.

  Please note: The full demo drums and some FX used in the demo are not included.
specs: |-
  - 64 Presets for Spire
  - 24 Leads (Presets)
  - 17 Basses (Presets)
  - 7 Plucks (Presets)
  - 6 Drums (Presets)
  - 4 Arps (Presets)
  - 3 Pads (Presets)
  - 3 Keys (Presets)
  - 45 MIDI files
  - Multi-genre
  - PC/Mac compatible
  - 100% Royalty-Free
  - Requires Reveal Sound Spire v1.5.1 or higher
