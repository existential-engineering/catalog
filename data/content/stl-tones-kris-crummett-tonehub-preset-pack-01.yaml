description: Legendary producer Kris Crummett has joined forces with STL Tones
  to create his own personal Producer Tonehub Preset Pack . Using many of Kris’s
  go to guitar amp/cab/pedal setups, this signature collection showcases
  virtually all of Crummett’s rhythm, lead, and clean guitar recording setups.
  Crummett’s personal pack contains a total of 121 presets. There are 24 “mix
  ready” presets, which have been captured from his recognised signature guitar
  tones heard on many of his mixes, as well as raw isolated amp tones from 14
  different vintage, boutique and modern amps in his collection.
details: |-
  Kris Crummett is a producer, mix and mastering engineer known for bringing about breakthrough and defining albums with Sleeping With Sirens, Issues, Dance Gavin Dance, Emarosa, In Fear and Faith, Alesana, Crown The Empire, Slaves and Jonny Craig.

  Using many of Kris's go-to guitar amp, cab and pedal setups, this signature collection showcases virtually all of his rhythm, lead and clean guitar recording setups. It includes 24 mix-ready captures taken from the signature guitar tones heard across his mixes, alongside raw isolated amp tones from 14 different vintage, boutique and modern amps in his collection.

  Kris's pack contains 121 captures.
