details: |-
  Homegrown Instruments

  Free Home is the culmination of a remarkable collaboration between our dedicated community and our tireless team. The concept behind Free Home was to create an instrument using sounds recorded within our own homes, so we invited our community members to capture or design five or more sounds, whether percussive, melodic, or atonal, resulting in an inspiring collection. We were so grateful to receive hundreds of samples from our community - Household items, water drops, microwave beeps, wind chimes, glockenspiels, bottles, voices, and so much more - representing inspiration and passion from all walks of life. Harnessing these invaluable contributions, we edited, programmed, and designed an extensive assortment of soothing, intricate, and enjoyable instruments. Free Home encompasses Ambience, Sound Design, Custom Instruments, Noises, Percussion, and more, with plenty of all-new programs to stretch these samples beyond their limits. Creating this library has been an absolute delight, and we sincerely hope that you will feel the joy as well. Completely free, from all of our homes to yours.
