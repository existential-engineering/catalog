details: |-
  Ultra analog va-3 - 30.8676 hz by applied acoustics systems is a virtual instrument audio plugin and soundware (samples or presets that load into other products) for macos and windows. It includes, and is therefore "powered by", aas player, which functions as a VST plugin, an audio units plugin, a VST 3 plugin and an AAX plugin.

  The 100 presets of 30.8676 hz flirt with the limits of your auditory abilities. Split in two, the movements presets make heavy use of the arpeggiator for some ferocious thumping action while the stills presets get you your dose of fat, snoring, and wobbly analog goodness.
