details: |-
  Ultra Deep-Sampled · Completely Rewired · Modern Cinema

  Tenet opened the door. Palindrome 11 is what lives on the other side

  We spent years studying the scores defining modern cinema. Listening deeply. Decoding the tools and the instincts behind them. Then we built the supreme hardware rig of over $35,000 of analog hardware, 15 synthesizers, over 12,000 UDS samples. Asking ourselves the only question that mattered: "So ... What comes after Tenet?"

  Palindrome 11 is our answer. Laser focused on nailing five distinct areas of modern cinematic sound. Five Areas of Modern Cinematic Sound

  01 Arps. Swirling action. Full of motion. 02 Basses. Phat. Analog. Dirty when needed. 03 Pads. Dreamy Vintage Soundscapes. 04 Brass. Analog (Oppenheimer) Horn Leads. 05 Keys for Melancholic Melodies. Numerous vintage Moogs and Sequentials, Erica modulars, and Waldorfs, alongside the rare, revered and sometimes temperamental Alesis Andromeda and the newer UDO Super 6. Every patch runs through our C.A.F. (Capture Analog Filter) models, delivering authentic vintage analog behavior and depth you simply cannot fake. Transitioned from RTS to PCM: 4x smaller, faster to download, faster to load, more detailed than ever. What is a Palindrome? A palindrome reads the same forward and backward. Think like the word "Anna" or like "Tenet." Palindrome 11 lives in both directions at once: true and deeply faithful vintage analog sound, super-powered by the industry's leading analog engine. Note: Existing Palindrome owners should have received a personal email with your upgrade path. If not, ping us at support@soundpaint.com and we will get you set up. The original Palindrome 1 is discontinued. Please note we also have a product called Palindrome 2, which will soon be upgraded to Palindrome 22. This is a separate product and the designed complimentary partner to Palindrome 11.
