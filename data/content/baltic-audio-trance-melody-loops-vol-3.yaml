details: |-
  'Trance Melody Loops Vol 3' by baltic audio comes together with 16 hitting trance melodies and matching bass loops for your next melodic trance production. Additionally the package includes presets for Spire and Serum and the MIDI files of all loops.

  The loops are ready to work out of the box. Build Up and Tail versions give you even more flexibility in your production.

  If you want to change a sound or a melody, the presets for Spire and Serum and the MIDI data leave nothing to be desired.
specs: |-
  - 16 Melody Loops (WAV-format)
  - 16 Bass Loops (WAV-format)
  - 96 WAV Files
  - 32 MIDI Files
  - 12 Spire Presets (Bass & Lead)
  - 12 Serum Presets (Bass & Lead)
  - Build Up & Tail versions
  - Key labeled
  - 140 BPM
  - Over 350 MB of content
  - PC/Mac compatible
  - 100% royalty-free
  - 44.1kHz, 24-Bit WAV
