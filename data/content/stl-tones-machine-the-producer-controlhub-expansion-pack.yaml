details: |-
  Machine has one of the more eclectic resumés of any modern producer. From credits with Suicide Silence, Every Time I Die, The Amity Affliction and Four Year Strong to mixes for Fall Out Boy and White Zombie, he has crossed every aspect of rock, metal and electronica. From King Crimson to Lamb Of God and Clutch, Machine has become a master of his craft and has dug deep to find a tone for every occasion.

  This expansion pack has been built by Machine to enhance your workflow.

  Full of essential starting points for individual elements when building your mix, this pack also contains Machine's mix group and master bus signal chains, which have helped define him as one of the top rock and metal mix engineers.

  This expansion pack has a total of 62 captures.
