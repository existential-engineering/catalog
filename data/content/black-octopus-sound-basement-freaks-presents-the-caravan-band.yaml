description: A psychedelic rock sample pack by Basement Freaks, collecting live drum, bass, guitar and keyboard loops in 60s and 70s styles.
details: |-
  Back in the 60s and 70s when VW Bus's and bell bottom pants were all the craze, there was also some truly brilliant music coming out in the form of The Doors, Jefferson Airplane, The Beach Boys and Hawkwind, to name a few. The music of that era is timeless and has lived on for generations, and The Caravan Band is an ingeniously composed pack from Basement Freaks that brings those vibes back with a modern twist.

  Inside this sample library are Acoustic Guitars, Drum Loops, Bass Guitars, Music Loops, Percussion elements, One Shots and Sound Effects. All of the sounds were performed and recorded by Basement Freaks himself, showcasing his musicianship and playing.

  Bringing the 60s and 70s to the studio, The Caravan Band puts real musicians and performances inside a production, from twangy guitars and vibey keys to acoustic strums and effects.

  The pack collects 404 files in total, split across acoustic and electric guitar loops and one shots, bass guitar loops, drum loops and hits, music loops, and a large set of percussion loops and one shots.
