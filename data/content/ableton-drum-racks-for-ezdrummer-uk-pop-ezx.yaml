details: |-
  30 ableton drum racks to instantly load the factory library "mix ready"
  presets with ableton mappings. 15 ableton live templates designed to host the
  multi channel output routing presets with track level audio routing.

  Colour coded pad design for visual performance and finger drumming. All our
  racks use consistent drum rack colouring so you can visually and immediately
  spot your snares from your crashes. Individually labelled drum rack pads for
  clear visualisation, post performance editing and automation to all drum rack
  / instrument articulations in ableton.

  Ableton macros mapped to toontrack ezdrummer macros with preset values for
  ease of use in push and simple to use automation programming. Ableton macros
  are color coded to match the ezdrummer display.

  Use the template racks and extend to your own toontrack ezdrummer uk pop ezx
  presets, swapping out individual sounds or articulations. You are 100% ready
  to go with the factory presets but there is no limitation to creating your own
  presets from these templates.
specs: |-
  - Ableton drum racks
  - Toontrack ezdrummer uk pop ezx integration
  - Ableton push support
  - 30 Ableton drum racks
  - 15 Ableton live templates
  - 64 pad layout mode
  - Colour coded pad design
  - Ableton macros mapped to toontrack ezdrummer macros
  - Singleout presets
  - Multiout presets
  - Multi-channel audio output routing
  - Individual drum rack pad labeling
  - Ableton 10 drum buss compatibility
