details: |-
  Bounce vocals construction kit is a collection of bouncy lead loops, vocal
  loops, samples, presets and MIDI files. Each melody kit is key and tempo
  labeled and comes with all elements, so you can flexibly compare different
  sounds and make your own, original progression with the files included.

  As always, each melodic part is available as a MIDI file. The inclusion of the
  midis, samples and presets means of course that producers of bounce and
  electro styles can also find huge value in this pack as the melodies and
  sounds could easily slot into any edm track.

  You also get to choose what sounds are playing what, which gives you more
  control over the final sound. The content in this pack has been inspired by
  producers such as timmy trumpet, tjr, deorro, vinnai, redfoo, r3hab and many
  others.

  Everything is carefully processed to perfection at 24-bit wav quality.
specs: |-
