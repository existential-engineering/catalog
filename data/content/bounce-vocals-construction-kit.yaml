  - Reveal sound's Spire v1.1 or above required
  - Key & tempo labeled
  - 20 vocal kits
  - 60 lead loops (dry/wet)
  - 40 MIDI files
  - 20 Spire presets (+ soundbank)
  - 20 vocal samples
  - 24-bit wav quality
