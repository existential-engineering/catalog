details: |-
  Providing two high-end drum kits for use in the free Kontakt player and the
  Kontakt 4 sampler, abbey road modern drums gives musicians and producers
  access to expertly engineered drum sounds for contemporary music production of
  any genre, with the highest possible level of fidelity and authenticity.

  Abbey road modern drums complements the previous 60s, 70s and 80s
  installments, and is based on two renowned drum kits that are a staple of
  modern studio productions a drum workshop collector's series "white kit" and a
  pearl reference "sparkle kit".

  Further expanded with various distinctive cymbals from sabian and zildjian as
  well as three snare drum options each, both kits were recorded with
  painstaking precision in abbey road's studio two and studio three, taking full
  advantage of the acoustic properties of these famous recording rooms.

  Abbey road modern drums utilizes both contemporary and vintage high-end
  recording equipment to achieve ultimate sound quality across all individual
  instruments of the kits. This includes selected brauner and neumann
  microphones from the studios' famed mic collection as well as exclusive ssl,
  redd and emi tg preamps. Classic and modern compression techniques were used
  on the basis of the legendary fairchild 660 compressor and the acclaimed
  empirical labs distressor.

  Up to 27 velocity layers per instrument with over 40,000 overall samples
  guarantee ultimate authenticity both for rhythm programming and for real-time
  MIDI-controlled playing, with a selection of different MIDI mappings
  accommodating the established layouts of various popular electronic drum kits
  and third-party drum libraries.
specs: |-
  - Kontakt player
  - Kontakt 4 sampler
  - 27 velocity layers per instrument
  - 40,000+ samples
  - MIDI-controlled playing
