  - Drum workshop collector's series white kit
  - Pearl reference sparkle kit
  - Sabian cymbals
  - Zildjian cymbals
  - Three snare drum options per kit
  - Brauner microphones
  - Neumann microphones
  - Ssl preamps
  - Redd preamps
  - Emi tg preamps
  - Fairchild 660 compressor
  - Empirical labs distressor
  - Splash on snare sounds
  - Bass drum samples through rewired monitor speaker
  - Room microphones
  - Mono and stereo room mic control
  - Advanced randomization
  - Articulation control
  - Sound shaping
  - Mixing and routing functions
  - macOS support
  - Windows support
