description: A royalty-free vocal sample pack featuring over 69 performance coaching phrases recorded by producer and engineer Joel Wanasek. Includes shout phrases, curse words, insults, positive energy phrases, and dominating adjectives — designed to motivate and direct artists during studio recording sessions.
details: |-
  Drumshotz Joel Wanasek One-Liners is the odd one out in the Drumshotz series: instead of drum samples it supplies over 69 spoken phrases recorded by producer and mixer Joel Wanasek, intended to be triggered in a session as performance coaching, motivation, or comic relief.

  The pack breaks down into 5 shout shotz, 5 curse words, 9 insults, 20 positive energy phrases, and 30 dominating adjectives, so an engineer can push an artist harder or hype them up without leaving the DAW. Each phrase was written, recorded, and edited individually rather than cut from existing session audio.

  The samples are royalty-free.
