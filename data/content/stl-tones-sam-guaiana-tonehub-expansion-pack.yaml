details: |-
  Sam Guaiana is a producer, mixer and songwriter celebrated for his exciting modern rock and pop records. His approach has been instrumental in acclaimed projects such as Silverstein's JUNO-nominated A Beautiful Place To Drown , alongside his work with Neck Deep, The Devil Wears Prada and Intervals, whose instrumental album Memory Palace won a JUNO Award.

  This expansion pack brings that same energy to the ToneHub platform, giving you access to the guitar and bass tones behind his guitar-driven productions.
