description: Unleash the raw power of 70's rock step back in time to the era of
  iconic rock legends, where the sound of LED zeppelin ruled the stage.
details: |-
  In perfect harmony with bfd's meticulously recorded drum sounds, the london
  70's expansion comes complete with a treasure trove of 178 individual grooves.
  These rhythmic gems are a sonic bridge to the soul of the '70s, tailor-made
  for evoking the spirit of LED zeppelin and that iconic era.

  Whether you're igniting your next creative spark or weaving them into your
  latest production, these grooves are your secret weapon for infusing that
  unmistakable '70s rock vibe into your music.

  Bfd london 70s by bfd drums is a virtual instrument audio plugin and a
  software application and soundware (samples or presets that load into other
  products) for macos and windows. It includes, and is therefore "powered by",
  bfd player, which functions as a VST plugin, an audio units plugin, a VST 3
  plugin, an AAX plugin and a standalone application.
