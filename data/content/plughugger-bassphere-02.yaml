details: |-
  Bassphere 02 is a sound expansion for the spectrasonics Omnisphere
  synthesizer. This expansion is designed to bring instant inspiration for
  producers of modern dance music and pop.

  All sounds are built upon the sound engine of omnisphere - no samples need to
  be loaded. Just plain, raw waveforms that have been built from the ground up
  into modern-sounding goodness.

  The benefits of using the built-in sound engine are many. The sounds are
  different from the existing sounds in omnisphere, it uses minimal memory and
  the sounds load when you click on them.

  Bassphere 02 is a journey of evolving sounds. Plughugger used 18 sounds as the
  starting point. These sounds were then tweaked, pushed, distorted, filtered,
  arpeggiated and sequenced into a total of 140 sounds.
specs: |-
  - Sound expansion for spectrasonics Omnisphere
  - 140 sounds
  - Built-in sound engine (no samples required)
  - Raw waveforms
  - Minimal memory usage
  - Evolving sounds design
