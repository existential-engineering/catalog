details: |-
  New Loops presents atmospheric textures: 100 atmospheres, soundscapes, backing
  pads, and ambiences to add tension and suspense to your music. You'll find a
  wide range of synthesised sounds including dark cinematic pads, intense
  noise-scapes, distorted drones, atonal atmospheres, shimmering pads, alarming
  sounds, deep rumbles, and more.

  Atmospheric textures has over 1 gb of sounds ranging from 14 seconds to 1
  minute long. These sounds are suitable for many genres including cinematic
  soundtrack and film scores, atmospheres and soundscapes, game music and
  effects, video soundtracks, and also useful for electronica, ambient, drum and
  bass, techno, and more.

  The audio wav pack works with any software compatible with the standard wav
  format. Wav files are compatible with most hardware controllers and samplers
  including akai mpc's, native instruments maschine, elektron, roland, and korg
  samplers.

  New loops presents atmospheric textures dune 3 edition, featuring 100 presets
  for synapse audio's dune 3. We've taken our atmospheric textures and loaded
  them into dune to expand the capabilities of these sounds. Play them across
  the keyboard, add effects, filters, and modulation - the sound design
  potential is limitless.

  We've set up dune to enhance these samples with osc 1 and osc 2 used as sub
  oscillators at -1 and -2 octaves, use the osc mixer to blend. We've added
  delay and shimmer reverb to the mod wheel. Lowpass and highpass filters (use
  filter balance to choose) to filter the sound. Sample loop points are set on
  each patch.
specs: |-
  - 100 atmospheric texture samples
  - 24-bit, 44.1khz wav files (audio wav pack)
  - 16-bit, 44.1khz wav files (dune 3 edition)
  - Universal wav format compatibility
  - Akai mpc compatibility
  - Native Instruments maschine compatibility
  - Elektron sampler compatibility
  - Roland sampler compatibility
  - Korg sampler compatibility
  - 100 dune 3 presets
  - Osc 1 and osc 2 sub oscillators at -1 and -2 octaves
  - Osc mixer
  - Delay and shimmer reverb on mod wheel
  - Lowpass and highpass filters with filter balance
  - Sample loop points set on each patch
  - Mod wheel assigned to effects
  - Dune version 3.4 or later required
  - Compatible with dune 3.5 preset browser
  - 100% royalty free
  - Pads, atmospheres, noise, soundscapes, drones, deep rumbles
