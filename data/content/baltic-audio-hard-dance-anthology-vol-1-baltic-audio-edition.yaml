details: |-
  'Hard Dance Anthology Vol 1 (baltic audio Edition)' by CESA SAMPLES is a royalty-free Serum preset pack designed for Hard Dance, Hardstyle, Hands Up, Dance, 2000s EDM and harder club music productions.

  This baltic audio Edition includes 82 presets for Xfer Serum, capturing the harder side of Dance music with energetic leads, powerful basses, screeches, plucks, pads, arpeggios, chords, FX and drum-type presets. It provides ready-to-use sounds for building hard dance drops, hands-up hooks, driving basslines, festival-style melodies and nostalgic club arrangements.

  Requirements: Xfer Serum v1.3.5.7 or higher is required.

  Please note: This baltic audio Edition contains Serum presets only. It does not include WAV samples, loops or MIDI files. Drum-type presets listed in the pack are included as Serum presets, not as separate audio drum samples. Drums, some FX and some basses used in the demo are not included as separate audio files.
specs: |-
  - 82 Serum Presets
  - 5 Arpeggios
  - 18 Basses
  - 5 Chords
