details: |-
  Asmr 4k is a collection of multi-sampled bells, keys and pads oriented to
  lo-fi sounds, with tiny closeup noises (asmr triggers), tonal atmospheres,
  ambient synth phrases, reverberated metals and field recordings.

  After five years of ever-evolving atmospheres and fields, soundethers releases
  its first collection with pure melodic, harmonic instruments.

  Delicate gritty sounds, slowly evolving tails, solitary, gentle keys and
  bells, lush pads, organic vinyl-like crackles, layered analog synths, randomly
  played metals, deep soundscapes, all made with the modern narrative
  composition demands in mind.
specs: |-
  - 120+ sounds, instruments and multis
  - Three folders: atmospheric (pads, ambient synth phrases, atmospheres, bells)
  - Fields and triggers (field recordings, asmr triggers, metals, noises)
  - Multisampled (bells, keys, pads, bass)
  - 450+ samples in .ncw Kontakt format
  - 1.9 GB uncompressed
  - Kontakt 5 (latest update) full version only
