details: |-
  Analog Pad Loops is the first entry in ModeAudio's brand new mini packs series, homing in on a super-concentrated dose of a specific sound type and delivering it straight to your DAW. Mini pack 0001 presents 50 royalty-free pad loops for your production pleasure, performed with and sampled directly from our newest multi-voice polyphonic analog synth.

  As a result, these loops are dripping in the warm, creamy character of classic hardware, as well as embodying the deliciously thick, woozy spirit of vintage chorus and retro voice stacking. Divided between tempos of 80, 100 and 120 bpm, the selection spans a wide variety of deep, bass-heavy rumblings, soaring 80s-inspired chords, gentle, meandering ambiences and powerful melodic patterns, which can be used solo or effortlessly layered to form dense, textured sound beds.

  From the subtleties of downtempo and ambient genres, to the hypnotic rhythms of house, techno and beyond, these pad samples will pair seamlessly and bring analog richness and depth to an extensive host of styles and musical flavours.

  Accompanying the loops are 50 tail samples, named after their parent loop and designed to be placed directly after your chosen sound for a smooth, natural decay, and 50 key and tempo-labelled MIDI patterns, offering you direct access to all the melodic and harmonic riffs present in the main pads collection.
