details: |-
  The Burning Bass Bonanza

  10 Electric Basses. 10 Exceptional Amps. 1 Extraordinary Hall. Experience the Extreme sound of the 10 Electric Bass Ensemble. Recorded in our favorite orchestral hall, renowned for its exceptional acoustics, this ensemble delivers a truly distinct and captivating bass experience. We recorded a huge range of playing styles, both with and without amplification, allowing you to explore the full sonic potential of this unique ensemble. From epic and commanding to ethereal and expansive, these basses cover a vast spectrum of tones. The sounds are organized in several categories: shorts, sustains, slides, and effects - at different speeds, with and without the amps. Slapped shorts, powerful sustains, savage screams, enchanting harmonics, textured tremolos - the expressive possibilities are boundless. Combined with the three included microphone perspectives (close for focus, decca for balance, and wide for spacious), these sounds allow you to shape the personality of the basses to fit any artistic vision.
