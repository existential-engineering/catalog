details: |-
  Introducing ascend: modern grand, the incomparable concert d, reimagined. Starting with one of the finest cinematic pianos in the world, heavyocity has pushed the grandest of grand pianos even further, exploring new ways of evoking sound from this 9-foot frame. First, capturing several prepared performances in intricate detail (brushes, hammers, ebows, chains, and twine) and then, developing an all-new engine to bring these extraordinary sounds to life.

  Recorded in stunning detail at a historic nyc studio, this specific grand piano was hand-selected by the heavyocity team for its outstanding warmth, depth, and detail. Armed with a world-class selection of vintage and modern microphones, the team once again partnered with acclaimed film score mixer satoshi noguchi, this time to bring the legendary steinway sound into your studio.

  The gorgeous ascend engine is a whole new world to explore -- complete with a library of rhythmic convolutions and dozens of layerable sources and fx. The highly-flexible three point mixer provides instant inspiration, and the proprietary echoes feature accompanies your performances with a lush musical randomness.

  With ascend, heavyocity has crafted a new breed of cinematic grand piano. Your score may never be the same.
