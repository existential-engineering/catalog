details: |-
  We handpicked 16 of the finest string players to perform an encyclopaedia of articulations and techniques, recorded via the finest signal path in The Hall at Air Studios, London. This smaller section gives you more attention to detail than our Symphony Orchestra , while still capturing the beautiful resonance of the hall. This is your definitive chamber range – a versatile classic that will enhance your film, TV and game scores and pop records.

  The Professional edition includes four additional microphone positions and three CPU-friendly stereo mixes by award-winning engineer Jake Jackson, giving you a hugely diverse range of string sounds.

  Available in 3 editions — Spitfire Chamber Strings Essentials, Spitfire Chamber Strings and Spitfire Chamber Strings Professional.
specs: |-
  - 244 articulations: 38 shorts, 53 longs, 19 FX, 45 legatos
  - 16 world-class London string players (4,3,3,3,3)
  - 6 instruments: Violins 1, Violins 2, Violas, Celli, Basses, Ensembles
  - 7 microphone positions, including Warm Close Ribbon, Close Stereo Pair, Gallery and Outrigger added by the Professional edition
  - 3 stereo mixes by Jake Jackson: Fine, Medium, Broad
  - Over 150GB of additional content over Spitfire Chamber Strings
  - ~242323 samples
  - 235.2 GB download size
  - 470.40 GB disk space required during install
  - NKS-ready
  - Spitfire Audio App required
