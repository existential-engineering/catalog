details: >-
  1980 vol.3 for arturia cs-80 v4 and analog lab v synths contains 30 presets
  derived from the classic 80's sound era and carrying this distinct cs-80 sound
  identity.


  This soundbank has 30 classic synth keys and most of them could also be used
  as pads in terms of performance.


  Try to add some unexpected yet very musical and interesting alteration to the
  sound using aftertouch or mod wheel. Some presets are set with unison and thus
  according to the unison engine of cs-80 when perform multiple notes some of
  them will not be heard. To avoid it please disable unison from the down left
  part next to the yellow release slider.


  Also try to add some timbral changes using the green brill and the red res
  sliders. Chorus and tremolo in the down part of the synth play an important
  role for most presets and give an additional vintage 80's touch to the sounds.


  All macros are assigned to ring modulation, reverb, osc mix and low pass
  filter cut-off frequency. Using aftertouch is pretty much unpredictable and
  could affect elements like filter and osc pitch modulation in conjunction with
  the sub osc of the synth.
specs: |-
  - 30 presets
  - Classic synth keys
  - Aftertouch support
  - Mod wheel support
  - Unison engine
  - Ring modulation macro
  - Reverb macro
  - Osc mix macro
  - Low pass filter cut-off frequency macro
  - Chorus
  - Tremolo
  - Brill slider
  - Res slider
  - Sub osc
  - Filter modulation
  - Osc pitch modulation
  - Cs-80 v4.1.0.2880 (x64) or newer
  - Analog lab v 5.6.0.2890 (x64) or newer
