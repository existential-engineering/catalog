  It includes, and is therefore powered by, master keys, which functions as a VST plugin, an audio units plugin, a VST 3 plugin and an AAX plugin.

  This bundle gets you every one of our pianos with an extra discount, making it a no-brainer.

  This bundle includes: chicago upright 1927, ningbo upright 2021, new york l 1991, new york l 1926.
