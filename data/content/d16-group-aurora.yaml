description: Sound Expansion for Lush 2
details: |-
  Aurora is a premium soundbank offering 120 presets exclusively designed for the Lush 2 synthesizer, created by Romanian sound designer Cipryan Bot. It covers a broad spectrum of sounds, from lush pads and evolving textures to expressive leads and plucks, with every preset thoughtfully designed to showcase the full potential of Lush 2's subtractive synthesis engine.

  Many presets go beyond traditional subtractive synthesis, capturing the nuances of real acoustic instruments, from warm strings and resonant pianos to expressive woodwinds and brass, bridging the gap between electronic and organic soundscapes. Each preset is optimized for dynamic expression, allowing for nuanced adjustments and intricate musical performances.
specs: |-
  - 120 exclusive presets for the Lush 2 synthesizer
  - Covers pads, evolving textures, leads and plucks
  - Presets modeling acoustic instrument character (strings, piano, woodwinds, brass)
  - Optimized for expressive MIDI control
  - Requires Lush 2 version 2.1.0 or newer
