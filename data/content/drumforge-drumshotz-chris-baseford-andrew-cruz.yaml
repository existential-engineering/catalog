  One-shot samples are powerful weapons for enhancing your drum mixes as they provide you with the extra punch and consistency you need to cut through any mix. Many professional mixers have highly coveted collections of one-shot drum samples refined over years of mixing. This is how they achieve their signature drum sound no matter the quality of the source recording.

  Producers/mixers Chris Baseford and Andrew Cruz bring you a collection of mix-ready one-shot drum samples that will add power and punch to your songs. Now you can get drum sounds directly from Chris and Andrew who are a powerhouse production team in rock music and have worked with artists like Nickelback, Daughtry, Shinedown, and Scott Stapp.
