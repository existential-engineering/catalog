description: Mix-ready one-shot drum samples from rock production team Chris Baseford and Andrew Cruz, whose credits include Nickelback, Daughtry, Shinedown, and Scott Stapp.
details: |-
  Drumshotz Chris Baseford & Andrew Cruz is a signature one-shot drum sample collection from the rock production and mixing team of Chris Baseford and Andrew Cruz, whose credits include Nickelback, Daughtry, Shinedown, and Scott Stapp.

  The pack is weighted toward the low end and backbeat, with 22 kick drum samples and 17 snare drum samples, plus 5 production samples for transitions and accents. The samples are supplied mix-ready so they can be layered with existing libraries or raw drum recordings without further processing.

  All 44 samples are delivered as 24-bit / 48 kHz WAV files for use with any drum triggering program or DAW.
specs: |-
  - 44 one-shot drum samples total
  - 24-bit / 48 kHz WAV format
  - 22 kick drum samples
  - 17 snare drum samples
  - 5 production samples
  - For use with any triggering program or DAW
