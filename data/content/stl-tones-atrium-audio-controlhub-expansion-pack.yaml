details: |-
  Carson Slovak and Grant McFarland have become known for their consistent quality output and highly-efficient workflow, establishing Atrium Audio's reputation as a powerful production duo, particularly in the rock and metal genres. Their credits include August Burns Red, ERRA, Lorna Shore, Polaris, Rivers of Nihil, Black Crown Initiate, From Ashes To New and Texas In July, alongside veteran rock acts Everclear, Live and Candlebox. They produced, engineered and mixed August Burns Red's Grammy-nominated Found In Far Away Places and Phantom Anthem .

  This expansion pack has been designed by Atrium Audio as a powerful metal and hard rock mixing toolkit. Every signal chain that makes their productions so hard-hitting has been captured, from the individual elements of a drum kit, modern heavy guitar and bass processing, all the way through to the final mix bus and master chains.

  This expansion pack has a total of 59 captures.
