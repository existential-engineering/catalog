description: The Footsteps Bundle is a comprehensive collection of 1,885 dynamic shoe, step and surface sound assets designed for use with Weaponiser. Professionally recorded by Krotos, it provides royalty-free footstep sounds for TV, film, video game Foley, and post-production projects. Includes whole step and heel/toe recordings for detailed, flexible footstep design, with MIDI performance capability through Weaponiser integration.
details: |-
  The Footsteps Bundle is a comprehensive collection of 1,885 dynamic shoe, step and surface assets designed for use with Weaponiser.

  As well as being a weapon sound design solution, Weaponiser's workflow also functions as a tool-kit for dynamic asset creation, and lets users combine their own sounds with Krotos libraries. With the Footsteps SFX collection, Weaponiser offers flexibility for responsive footstep sound design for TV, film, video game Foley and post-production projects.

  Professionally recorded by Krotos, this royalty-free footsteps SFX collection comes with 81 tweakable presets and combines boot, shoe, trainer, high-heel and stiletto sounds on concrete, carpet, grass, gravel, metal or wooden surfaces.

  The bundle also features whole step and heel/toe recordings, for footsteps with more detail and flexibility and the ability to perform any type of step in Weaponiser.

  Sound categories included are Boots, High-heels, Concrete and Hardwood. Shoe types cover boots, dress shoes, Converse trainers, running shoes, high-heels and stilettos. Surfaces cover concrete, carpet, grass, gravel, metal, hardwood and wooden planks.
