details: |-
  The great thing about doing this is that the presets are cross compatible and so all of the cassetto presets are included as well as 100 specially created for airtones. It come with 100 samples which can be selected by either of the synthesizers two oscillators.

  The synth is a dual synthesizer with 2 filters, 3 lfos, 3 envelopes as well as a comprehensive fx section. Also included is an advanced arpeggiator/sequencer with 12 sequencers for various parameters, as well as many modes including standard arps, chords and modulation only modes.

  There is also a scale remapper which can transform the pitch sequencer in real-time to any of the large types of scales included. Other features include a sophisticated scala based microtuner and an inbuilt preset system which uses an internal file browser to load presets/scales.

  Finally, anyone who has used any hgs products knows that all products include comprehensive randomizers on a global and local scale. Lots of work goes into making them musically useful.
