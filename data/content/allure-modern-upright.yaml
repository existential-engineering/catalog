details: |-
  Beginning with a premium 53-inch upright piano, hand-selected by our team for its intimate warmth and captivating texture, we captured the natural upright, felted keys, and unique prepared articulations using brushes, twine, mallets, and plucks.

  With expressive sampled performances and creative extended techniques, paired with heavyocity's signature sound design, all housed in the powerful ascend engine, allure allows your creativity to extend beyond its physical keys.

  Allure: modern upright by heavyocity is a virtual instrument audio plugin and a software application and soundware for macos and windows.
specs: |-
  - Kontakt player
  - 16 GB sample library
  - 11,200 samples
  - 95 snapshot presets
  - Ascend engine
  - 53-inch upright piano samples
  - Prepared articulations
  - Extended techniques
