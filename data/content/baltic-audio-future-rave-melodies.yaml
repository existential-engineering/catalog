details: |-
  'Future Rave Melodies' contains 30 melody loops and 9 bass loops, 20 synth shots and 5 bass shots as well as 39 MIDI loops. Two drum kits including one-shots and loops are also included. The pack is aimed at producers looking for melodies and ideas to start new Future Rave tracks.

  The ready-to-use melody loops come in three different versions (dry, wet, wet and sidechain), and the bass loops are provided with and without sidechain.

  The included MIDI loops, synth shots and bass shots allow the melodies to be customised or restyled, and the additional drum kits allow ideas to be turned into a full track quickly.
specs: |-
