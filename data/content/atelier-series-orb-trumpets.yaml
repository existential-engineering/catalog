details: |-
  Orb trumpets is a proof-of-concept release that is created entirely out of
  performances. Recorded in orb studios in austin, tx the goal was to create a
  trumpet patch that took our adventure-style programming techniques to a more
  natural-sounding level using samples derived from phrases.

  Like our larger orchestral releases, the adventure-style programming requires
  no keyswitching. For quicker notes, you're going to want to play within the
  1-100 velocity range. For longer notes, 101-127 provides a slightly broader
  attack. Switching between the two provides an effective approximation of how
  brass players tend to shape certain notes within a variety of phrases.

  Tuning was lightly done to taste instead of destructively tuning it with
  software. We retained the natural biases in intonation up the range/dynamics
  while pulling in the more squirrely notes, resulting in a more natural
  temperament.

  Patches: adventure workhorse. Adventure (fff sus layer). Stac & stacmo (vel
  switching). Stac & stacmo (mw switching). No filter versions of above.
specs: |-
  - Requires full retail version of Kontakt 5.8.1 or higher
  - Free Kontakt player not supported
  - Recorded in 48khz / 24-bit
  - 240 MB compressed ncw format
  - Two-trumpet section
  - Keyswitch-less adventure programming
  - Two velocity-sensitive attack types
  - Entirely performance-sourced sampling
  - Tighter studio recordings
  - Hand-tuned to taste no destructive tuning
  - Adjustable reverb of custom hall impulse
