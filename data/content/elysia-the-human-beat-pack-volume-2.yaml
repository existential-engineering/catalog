details: |-
  Discover THE HUMAN BEAT PACK, curated by acclaimed producer Moses Schneider in collaboration with elysia. Step into a world where imperfection is celebrated. Crafted by a musician and a sound engineer, these drum loops capture the soulful essence of human hands striking drumheads, with the rich tapestry of emotions and unique character that breathes life into music.

  Volume 2 was recorded with Silvan Strauss, a German jazz drummer who studied jazz in Hamburg. He has worked with artists such as Cro, Clueso, Nneka, Maria João and the NDR and WDR big bands, and was awarded the Hamburg Jazz Prize in 2021.

  Berlin native Moses Schneider produced the pack, as he did Volume 1, and is known for creative microphone techniques such as "the Wurst", "Snareo" and "Droom" to capture one of a kind drum sounds. The press describes Schneider as the champion of live recordings: in many of his productions he records all instruments at the same time in one room, capturing the live quality of each artist.

  elysia analog hardware shapes the sound during the recording process, and was also used to master the stereo tracks to get the finishing details out of the mix. In addition to standard drum equipment, a lot of other tools were used in the session, including metal parts, pieces of wood, plastic tubes and even a jacksaw and whipsaw.

  The sessions were captured at the Limusic Residential Recording Studio in the south of France, between the Pyrenees and the Mediterranean, on a former vinery. Owned by a family of German artists since 2014, its island-like location embedded in vineyards creates a space for undisturbed, creative work. From rock's pulsating energy to funk's hypnotic grooves, jazz's intricate patterns and electronic music's infectious beats, the loops work as a springboard for composition across genres.
