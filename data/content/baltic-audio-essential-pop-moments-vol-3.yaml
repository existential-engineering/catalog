details: |-
  'Essential Pop Moments Vol 3' from baltic audio contains six construction kits with real played and recorded guitars, basses, drums and synths.

  Each of the six construction kits has recorded and mixed instruments with its own sound. The pack can also be used for genres like Tropical House, Future Bass, Hip Hop, Trap and RnB.

  MIDI files are included for the majority of the musical phrases and drums heard in most kits. The MIDI files can be combined with a sampler to trigger the key-labelled one-shots, or used with any synth or sampler.

  Unlooped tail WAV files are included, allowing a phrase to end with the decay of the reverb or delay applied to the loop. Dry and wet versions with filter, sidechain and reverb are provided for many files, and amped and dry versions for re-amping are provided for the most important guitars.
specs: |-
  - 6 Construction Kits with Key & Scale Information
  - Over 4.2 GB of Content
  - 69 MIDI Files
  - 171 One-Shots
  - 62 Tonal One-Shots
  - 204 WAV Tracks
  - Amped & Dry Versions for Re-Amping
  - Unlooped Tails
  - Recorded with Quality Amps and Mics
  - PC/Mac Compatible
  - 100% Royalty-Free
  - 44.1kHz, 24-Bit Stereo WAV Format
