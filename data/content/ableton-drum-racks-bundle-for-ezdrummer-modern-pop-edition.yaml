details: |-
  Ableton Drum Racks Bundle for ezDrummer Modern Pop Edition is a collection of
  ezdrummer pop performance drum racks on Ableton push featuring over 150
  Ableton drum racks and over 70 Ableton live routing templates configured for
  leading toontrack ezdrummer2 core libraries and 2 additional pop genre ezx
  expansions dream pop and number 1 hits.

  This library contains 4 timbresandtones ableton drum rack products bundled for
  toontrack ezdrummer modern kit, vintage kit, dream pop ezx and number 1 hits
  ezx: ableton drum racks for ezdrummer modern kit with 34 ableton drum racks
  individually mapped to all modern kit factory library content presets, with 17
  predesigned ableton live templates; ableton drum racks for ezdrummer vintage
  kit with 24 ableton drum racks individually mapped to all vintage kit factory
  content presets, with 12 predesigned ableton live templates; ableton drum
  racks for ezdrummer dream pop ezx with 58 ableton drum racks individually
  mapped to all dream pop ezx factory content presets; ableton drum racks for
  ezdrummer number 1 hits ezx with 40 ableton drum racks individually mapped to
  all number 1 hits ezx factory content presets.

  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all ezdrummer factory presets from ableton push
  controller device browser. Over 150 ableton drum racks to instantly load the
  factory library "mix ready" presets with ableton mappings.

  Colour coded pad design for visual performance and finger drumming. Know your
  toms from your snares from your hi hats. Individually labelled drum rack pads
  for clear visualisation, post performance editing and automation to all drum
  rack / instrument articulations. Mapped ableton macros to ezdrummer macros
  with preset values for ease of use in push and simple to use automation
  programming.

  Audio routing options: singleout presets featuring 78 ableton drum racks for
  all factory presets single audio output to single ableton track. Multiout
  presets featuring 78 ableton drum racks for all presets in multiple audio
  channel output from the plug in to multiple ableton audio tracks using the
  multi output ableton template also provided.
