details: >-
  Analog empire: pads & strings is the first release in the new analog empire
  series for the msoundfactory platform. This premium add-on introduces 32 pad
  and string sounds, capturing the warmth and depth of classic analogue
  synthesizers. Designed for seamless creativity, analog empire: pads & strings
  allows users to layer two sounds with independent controls for tone, pitch,
  drift, unison, and more.


  Advanced sculpting tools include a multimode filter, modulation effects like
  tremolo and phaser, a lush shimmer reverb, and a vintage-inspired lo-fi tape
  effect. Analog empire is all about delivering very high-quality, expressive
  sounds that are a joy to play. Its intuitive design ensures you spend less
  time tweaking and more time creating, making it simple and fast to get a sound
  that fits perfectly into your track.


  Combine any two sounds for layers a and b. Sculpt them independently with
  controls for high-pass and low-pass filters, pitch, analog drift, unison, and
  stereo voice panning. Blend between layers a and b seamlessly using the main
  knob. Add movement by modulating the blend with flow and fade controls.


  Enhance your sounds with four types of modulation effects (tremolo, phaser,
  flanger, chorus), a lush shimmer reverb, and a vintage-inspired lofi tape
  effect. Fit your sound perfectly into any mix with additional filtering, eq,
  compression, maximizer, stereo width control, and more in the master section.


  Fully supports MIDI polyphonic expression for nuanced and expressive
  performances. If you already have msoundfactory or msoundfactoryle, analog
  empire: pads & strings is completely free to download. You just need to run
  mpluginmanager and run it. However you can buy it separately, and use with the
  free version of msoundfactory - msoundfactory player.
