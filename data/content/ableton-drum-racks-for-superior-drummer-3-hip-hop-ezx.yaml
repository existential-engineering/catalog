details: >-
  Ableton drum racks for superior drummer 3 hip-hop! Ezx features separate
  ableton drum racks for all factory presets for the toontrack superior drummer
  3 hip-hop! Ezx expansion library. These racks provide out of the box
  integration workflow between ableton live and toontrack superior drummer using
  the ezx expansions including a host of features ready to use for composition
  and performance using ableton push or similar controllers.


  48 ableton drum racks to instantly load the factory library "mix ready"
  presets with ableton mappings. 24 ableton live templates for the multichannel
  audio routing of superior drummer 3 drum racks based upon the hip-hop! Ezx
  expansion factory content to instantly load the factory library "mix ready"
  presets with ableton mappings.


  Colour coded pad design for visual performance and finger drumming. All racks
  use consistent drum rack colouring so you can visually and immediately spot
  your snares from your crashes. Instrument articulations ready to go in one
  massive layout using ableton push 64 pad layout mode.


  Ableton macros mapped to toontrack superior drummer macros with preset values
  for ease of use in push and simple to use automation programming. Singleout
  presets feature 24 ableton drum racks for all factory presets with single
  audio output to a single ableton track from superior drummer 3. Multiout
  presets feature 24 ableton drum racks for all presets in multiple audio
  channel output from superior drummer 3 to multiple ableton audio tracks using
  the 24 multi output ableton templates.


  Use the template racks and extend to your own toontrack superior drummer 3
  hip-hop! Ezx presets, swapping out individual sounds or articulations. You are
  100% ready to go with the factory presets but there is no limitation to
  creating your own presets from these templates.
