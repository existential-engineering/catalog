details: |-
  Get ready, because this pack is about to blow your current tone out of the water. If you're still struggling with muddy, dark, or even boring tones, Conquer All is here to spark new life into those old and dusty tones.

  Conquer All Vol. 2 is a set of all new 136 Impulse Responses (68 raw and 68 mixed) made with 2 Class A preamps, 3 new cabs, and 4 different dynamic microphones.

  Every impulse in this pack was meticulously phase-aligned and level-matched not only with each other, but with the original Conquer All IR Pack as well, providing convenience and true neutrality when comparing IR options.

  All impulses are available mix-ready and raw, allowing you to add as much (or as little) coloration as you want when dialing in the perfect sound.

  Impulse Responses created by Michael Richards of Trackmix Recording Studio. Special thanks to Ryan 'Fluff' Bruce and Francesco Filigoi for the guitar-only examples.
