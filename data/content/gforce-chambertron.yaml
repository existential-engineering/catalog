description: 40+ tape banks and hundreds of patches inspired by the Chamberlin tape replay keyboard, the precursor to the Mellotron, for M-Tron Pro IV.
details: |-
  ChamberTron is an add-on pack for M-Tron Pro and features over 40 new tape banks and hundreds of patches, many from luminaries including Dean & Jarrod (I Monster), David Hentschel (Genesis & Elton John) and Jem Godfrey (Frost).

  Tape banks include Accordion, Alto Sax (x3), Banjo, Bass Clarinet, Bassoon, Bells, Cello, Clavi, DoWah Trombones, Female Voice, Flute (x2), French Horn, Harp Arpeggio, Harp Rolls, Harpsichord, Male Voice, Muted Trumpet, Oboe, Open Trombone (x2), Open Trumpet (x2), Organ, Piano, Slur Guitar, Slur Trombone, Sound Effects (x2), Spanish Guitar, Strings & Flutes (x2), Tenor Sax (x2), Vibes (x3) and Violins (x2).

  The ChamberTron Expansion Pack is only available to registered users of M-Tron Pro. It is exclusively available via the GForce website as a direct download via 'My Instruments' once the purchase has been completed.
specs: |-
  - Over 40 new tape banks
  - Hundreds of patches, many from Dean & Jarrod (I Monster), David Hentschel (Genesis & Elton John) and Jem Godfrey (Frost)
  - 35 notes per tape bank
  - Faithful to the 35 note, 8 second limitation of the original Chamberlin
  - Requires a registered installation of M-Tron Pro
