details: |-
  The ChamberTron is an expansion pack for M-Tron Pro, inspired by the tape replay keyboard originally invented by Harry Chamberlin in the 1950s — the instrument that gave rise to the Mellotron. It provides a highly evocative set of sounds while remaining faithful to the 35-note, 8-second limitation of the original Chamberlin collection.

  The pack features 41 tape banks and hundreds of patches contributed by Dean & Jarrod (I Monster), David Hentschel (Genesis & Elton John), and Jem Godfrey (Frost*).

  Tape banks: Accordion, Alto Sax, Banjo, Bass Clarinet, Bassoon, Bells, Cello, Clavi, DoWah Trombones, Female Voice, Flute, French Horn, Harp Arpeggio, Harp Rolls, Harpsichord, Male Voice, Muted Trumpet, Oboe, Open Trombone, Open Trumpet, Organ, Piano, Slur Guitar, Slur Trombone, Sound Effects, Spanish Guitar, Strings & Flutes, Tenor Sax, Vibes, Violins, and more.
