details: |-
  Joey Bradford is lead guitarist for The Used, joining the band for their Live At Maida Vale EP and the tours preceding it in 2018, with a seven-album back catalogue to replicate. Before that he served tenures with both Thrice and Atreyu. All of that experience fed into his writing debut with The Used on their 2020 album Heartwork .

  That variety of influences and range of tones are represented across this pack, built from Joey's personal amp and cabinet setups.

  Joey's pack contains 44 captures.
