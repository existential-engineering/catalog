description: Bogie C2x12 CL80 choptones supercab IR library created by capturing
  a mesa boogie 2x12 recto compact with celestion classic lead 80 speaker.
details: |-
  Bogie C2x12 CL80 is the choptones supercab IR library created by capturing a
  mesa boogie 2x12 recto compact with celestion classic lead 80 speakers. It is
  an extensive and systematic capture created with 12 microphones, 8 to 16
  positions each microphone and multiple mic preamps, for more than 300 IRs
  globally.

  The cabinet is straight front, closed back, marine grade baltic birch plywood
  construction, smaller but still powerful mesa 2x12 cab. The speaker, made in
  the late '70s this series of speaker provides an unique dynamic sound, due to
  a fiberglass voice coil. Great for aggressive rhythm lines and solos it
  perfectly cut the mix without being too shrill.

  Captures are performed with a motorized mic stand in order to have consistent
  measurements across libraries.

  The library is created for the th-u supercabinet, which allows to: graphically
  browse the irs in the library, blend them together, craft new cabinet tones
  with the unique multiband mode, use the ir in the software, and export the irs
  in .wav, compatible with the software ir loaders and all the major hardware
  modelers.

  Every microphone has been moved to 4 different horizontal position (cap, cap
  edge, cone and cone edge) and two distances, for a total of 8 irs each. For
  some microphones, the set of 8 measurements has been repeated with the
  microphone off axis (45 deg). All the measurement set has been repeated twice,
  with two different mic preamps: a neve 1073 and a german preamp.
specs: |-
  - 12 microphones with 8 to 16 positions each

  - Over 300 irs

  - 4 different horizontal positions per microphone (cap, cap edge, cone, cone
  edge)

  - 2 distances per position

  - Microphone off-axis measurements (45 deg)

  - 2 different mic preamps (neve 1073 and german preamp)

  - Akg c414

