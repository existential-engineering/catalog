name: Anomaly XXVII - Dark Textures
manufacturer: gates
primaryCategory: preset-pack
description: Anomaly XXVII - Dark Textures is a new soundset made from the
  source sounds of anomalies xx, xxii, xxiii, xxiv and xxv.
details: |-
  The result is 85 new combinations as sound beds, dark textures that interweave
  around each other. Each sound is a combination of only two sources - much
  simpler than normal anomaly sounds.

  Each sound is a looped stereo sfz/wav file, 37 seconds long (except for one
  which is 30 seconds).
specs: |-
  - 85 looped stereo sfz/wav files
  - 37 seconds long per sound (except one at 30 seconds)
  - 531 MB total
  - 85 instrument presets for anomaly vsti
  - 85 instrument presets for wusik v6/v7
  - 85 instrument presets for wusik v9
  - 85 .nki instrument presets for Kontakt v5
  - 85 instrument presets for sforzando
  - 85 instrument presets for dimension pro
  - 85 instrument presets for rapture
  - 85 instrument presets for tx16wx
