description: Bfd cocktail is an expansion kit for bfd3, bfd eco and bfd2 based
  on the Yamaha hipgig portable drumkit.
details: |-
  The drums feature 7-ply birch/mahogany shells and their upfront sound is
  perfect for pop, rock, jazz and funk amongst other genres.

  Bfd cocktail is recorded in similar conditions to the bfd jazz & funk and bfd
  percussion expansions as well as the mapleworks kits in bfd3. It has also been
  designed to sound great with bfd libraries recorded in other locations.
specs: |-
  - Expansion for bfd3, bfd eco and bfd2

  - Yamaha hipgig portable drumkit

  - 7-ply birch/mahogany shells

  - Snare played with sticks and hot-rods

  - Kick played with felt and rubber beaters

  - 15 presets in various styles (bfd3 and bfd2 only)

  - Windows 7 or higher

  - Os x 10.6.8 or higher

  - Internet connection for download and authorization

  - Disk space requirements: 15 gb for full install, 7.5 gb for medium install,
  5 gb for small install
