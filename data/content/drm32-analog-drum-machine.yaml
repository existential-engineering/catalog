details: |-
  DRM32 Analog Drum Machine is a drum machine for Kontakt based on samples of
  analog drum machines and synths, such as: doepfer a-100, Roland system 100m,
  oscar, arturia drumbrute, elektron analog rytm and analog four, Korg volca
  beats, acetone rhythm ace, eko dream box, a cicruit bent bontempi keyboard,
  Korg kpr77, Roland x0x series and various other stuff.

  The main instrument has 5 vertical slots: each slot has 32 different
  selectable kits of sounds: 32 kicks, 32 snares/rim/clap combinations, 32 hats
  combinations (closed, open, pedal), 32 cymbals/cowbells, 32 toms combinations
  (hi, mid, low) allowing many different combinations of samples.

  Each slot has separate level, pan and tune controls for fine editing and
  fine-tuning of the samples. Each slot has two separate controls for attack and
  sustain of the onboard transient shaper. Each slot has solo/mute buttons, to
  solo and mute sounds in the slot.

  Each slot has an independent selectable filter: filter type (different
  lowpass, highpass), with cutoff and resonance controls. Each slot has an
  independent distortion section with selectable type (tube or transistor) and
  level control. Each slot a dedicated reverb send level, which controls the
  amount of sound that is sent to the reverb bus channel.

  Drm32 analog drum machine has an onboard drum sequencer with 32 selectable
  patterns, as well as a dedicated drum delay and reverb. The instrument will
  normally load as a stereo instrument, but can be switched to multi-output,
  with user assignable outs.
