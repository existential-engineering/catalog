details: >-
  Arp explorer for kontakt 5.2.1 and higher (full version of kontakt is
  required) based on the 1970's arp explorer 1 synthesiser: 2.5gb of samples
  (compressed to 1.5gb using ni's lossless compression) taken from a real arp
  explorer1.


  Synth magic exploration 1 comprises the raw oscillators and a collection of
  presets made on a real arp explorer 1 using the original arp patch overlays
  and owners' manual patch sheets, which we then sampled. There are also a
  number of custom samples take from custom presets, once again made on the real
  machine and sampled.


  All easily accessible from a drop down menu for fast and easy access to the
  sounds. Exploration 1 has lots of greats sounds, including classic arp leads,
  bass, drones, sound effects and keys and comes supplied with over 200 presets
  all easily tweaked or created from scratch using the custom gui by
  saintjohnbaxter.


  Many extra features were added such as arpeggiator, effects, mono modes with
  note priority selection switches, MIDI syncable lfo's etc.


  The beautiful tones from the arp explorer can now be used in your own
  productions to give you the classic vintage vibe from what is undoubtedly a
  classic synth.
specs: |-
