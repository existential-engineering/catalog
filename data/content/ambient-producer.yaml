details: >-
  Ambient producer by sonivox is a collection of 6 sample packs featuring over
  2.8gb+ of ambient goodness in stunning 24-bit high resolution. Sonivox teamed
  up with prime loops to provide producers with all they need to discover new
  genres or styles of music.


  The collection features ambient fractals with 400mb of cutting-edge sound
  effect samples, such as atmospheres, reverses, ambient chords, lfo sounds,
  noise fx, stabs and more.


  Ambient illusions contains over 120 uplifting ambient, lounge and chill-out
  loops, textures, arpeggio patterns, sequencer lines, bass drones, pads & chord
  progressions.


  Dark ambiences & textures provides 550mb+ of dark, dense and devious
  soundscapes and textures, from creeping drones and sculpted static to buzzing
  pulses and hazy chords.


  Phatmospheres is a heavy +350mb sfx library of dark atmospheric soundscapes
  and dubstep ambiance samples, 24-bit & royalty free, and trip fantasia fine is
  a +450mb sfx library with 48 mesmerizing ambient textures, background
  soundscapes and chill-out ambiances.
specs: |-
  - 24-bit high resolution
  - VST compatible host application
  - AAX compatible host application (pro tools 11 or higher)
  - AU compatible host application
  - Full version of kontakt 5 required
