details: |-
  Riff Vault is a series of premium curated guitar sample packs designed for musicians, producers, and composers across a wide range of genres. Each pack within the Riff Vault series offers meticulously crafted riffs, grooves, and chord progressions, capturing the essence of specific musical styles.

  Riff Vault - Spirit of the Machine is the second specialized collection in the Riff Vault series, created in collaboration with Born of Osiris and friends. This pack fuses mechanical precision with atmospheric depth, delivering the technical metal sound that we've come to know and love. With multi-string guitar recordings across 6, 7, and 8-string guitars, matching bass MIDI for every riff, and both DI and amped tracks with wet FX, Spirit of the Machine gives you complete control over your sound while maintaining the organic feel of real performances.

  Authentic technical metalcore: this songwriting toolkit is performed by the exact people responsible for pioneering this genre, using the actual playing style and techniques that define the genre's signature sound.

  DI and amped tracks: every sample includes unprocessed DI tracks for maximum reamping flexibility and fully processed amped tracks with wet FX for instant, mix-ready results.

  Matching bass MIDI: every guitar riff comes with matching bass MIDI. Load in your favorite bass library and you have a complete foundation instantly.

  Multi-string coverage: 6-string in Drop C, 7-string in Drop G, 8-string in Drop E. Layer them for massive width or choose the exact range your track needs. Tempos run from 120 to 200 BPM, all performed at their native tempos for maximum authenticity.

  Cut-to-grid precision: every sample is edited tight to the grid for seamless looping and effortless arrangement building. Lead guitar performances are included with both DI and FX variations, and all files are exported as stereo for immediate integration into any DAW.
