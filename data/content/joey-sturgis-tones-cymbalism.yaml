description: Cymbalism is a sample pack of 14 mix-ready cymbals captured from a
  drummer's perspective. Each cymbal is multi-sampled at 24-bit/44.1kHz across a
  full set of articulations and dynamics, and runs in the full version of
  Kontakt.
details: |-
  Cymbalism is a package of 14 mix ready cymbals from a drummer's perspective, aimed at giving a versatile and realistic drum sound.

  Rather than velocity based sampling that merely alters a single set of multi samples, the articulations have been recorded in 24-bit/44.1kHz featuring Extra Soft, Soft, Medium, 6 Hard and Extra Hard, 3 Choke, 3 Bell and 3 Cymbal Swell per cymbal. Hi hats include Pedal, Closed, Half Open, Open and Pedal Choke.

  Cymbalism is your vision and your own virtual room. Use Kontakt to pan your cymbals to your required perspective, and use as many or as few of the 14 provided cymbals as you like to create your unique kit. Cymbals are pre-processed and require nothing more than a touch of EQ, though if your velocities have a high range you might want to try a touch of compression.

