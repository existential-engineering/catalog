details: |-
  The aas Beat Maker Bundle includes four hip hop sounds packs curated for
  modern urban musicians and producers: urban trip by emeric zubar, hop riffs by
  niall mccallum, turmoil district by emeric zubar, and low end theory by sean
  divine.

  Each sound pack was created with its respective synthesizer. You can obviously
  play and edit the sounds with that specific synthesizer, but you can also
  access and play them via the free aas player included with your libraries
  bundle purchase.

  Aas player provides a distraction-free playing experience and includes
  hundreds of free extra presets via swatches.

  The bundle works two ways: through aas player (free/included) for
  distraction-free playing experience, or through the respective synthesizers
  (sold separately) for sound manipulation at the source core and as a starting
  point for new sound design ideas.
