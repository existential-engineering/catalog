description: The RX950 Classic AD/DA Converter is an effect plug-in designed to faithfully mimic the whole AD/DA conversion process of the Akai S950, giving music a vintage, warm and crunchy sound with the ease and flexibility of a plugin.
details: |-
  12-bit Akai S950 AD/DA signal path emulation

  Original 6th-order low-pass Butterworth filter modeling

  NKS support for Native Instruments hardware

  GUI scaling from 1x to 2.5x

  64-bit
specs: |-
  - 12-bit resolution AD/DA conversion modeling
  - Akai S950 signal path emulation
  - Original 6th-order Butterworth low-pass filter
  - Adjustable audio bandwidth (sampling frequency)
  - Adjustable high-frequency brilliance control
  - Input gain with harmonic saturation
  - Stereo and mono operation modes
  - GUI scaling: 1x to 2.5x
  - NKS support for NI hardware
  - Apple Silicon native (including AAX)
  - Linux ARM support
  - Low CPU consumption
  - DRM-free (VST/AU/AAX version)
  - windows: Vista+, 64-bit
  - mac: macOS 10.9+, Intel & Apple Silicon
  - linux: 64-bit, VST2/VST3
  - ios: iOS 9.3+, AUv3/IAA
versions:
