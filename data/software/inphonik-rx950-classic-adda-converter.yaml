    description: Added Apple Silicon AAX support, added Linux ARM support, fixed various bugs.
  - name: 1.1.2
    description: Added Apple Silicon support, added Linux VST support, fixed rare display issue on macOS, dropped 32-bit support.
  - name: 1.1.1
    description: Added VST3 (Win/Mac), NKS, AAX, and AUv3/IAA support; improved high-end frequency response; added GUI scaling 1x–2.5x.
