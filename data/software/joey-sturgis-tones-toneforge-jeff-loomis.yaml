details: |-
  FEATURED IN:
  Toneforge ® Jeff Loomis is the perfect virtual guitar tone solution in audio plugin and standalone app formats for the studio and the stage, brought to you by Joey Sturgis Tones, producer Jens Bogren and legendary guitarist Jeff Loomis!
  Listen
  What does is sound like? We've created some tracks alongside Jeff Loomis himself to show you just what this plugin can do - but these examples are only scratching the surface.
  Critically Acclaimed
  We've put this plugin through its paces and challenged every aspect of its design. Here's what the best reviewers out there think about Toneforge® Jeff Loomis.
  Created By An Amazing Team
  Toneforge® Jeff Loomis was created by famed guitarist Jeff Loomis, legendary producer Jens Bogren, and our very own Joey Sturgis. With their expertise and guidance, we set off down a path toward the best shredder amp we could envision, ultimately arriving at this all-in-one solution for anyone looking to bring those massive, cut-throat sounds to their home studio or live rig.
  About Jeff Loomis
  Jeff Loomis has had an incredible 30-year career as the guitarist for the progressive metal bands Nevermore, Conquering Dystopia. More recently, Jeff has also recorded and performed with Swedish melodic death metal band, Arch Enemy. Known for fast riffs, wailing leads, and complex compositions, Jeff’s playing is some of the greatest of all time.
  About Jens Bogren
  If there’s one producer that comes to mind when you think of Swedish metal, it’s gotta be Jens Bogren. Jens has sculpted the sound of the genre for nearly two decades, working with groups like At The Gates, Opeth, Amon Amarth, and many more. With Toneforge Jeff Loomis, we had the opportunity to collaborate with Jens and really dial in this rig for the high demands of Swedish metal guitar production.
  Paired with the incredible cab models designed by Jens Bogren specifically for Toneforge Jeff Loomis, there’s never been a more comprehensive virtual rig for those looking to bring A-list metal tone to the studio or stage.
  Toneforge Jeff Loomis features a set of unique Impulse Responses created specifically for these amps by Jens himself! Jens also makes other great Impulse Responses available here: https://bogrendigital.com/
  About Joey Sturgis
  Joey Sturgis is an award-winning producer, recording/mixing engineer, programmer, writer, performer & software developer who strives to help aspiring musicians / producers unleash their creativity. Joey Sturgis has forged a revolutionary new wave of American metal since his appearance on the scene in 2007. Working with The Devil Wears Prada, I See Stars, We Came As Romans, Attack! Attack!, Of Mice & Men, Attila, Blessthefall, and many more, Joey has produced a decorated string of albums that have pushed modern metal in ground-breaking directions, including two RIAA Gold-Certified singles with Asking Alexandria. Even with a full decade of credits under his belt, Joey has only just begun to leave his mark on music and will be a monumental figure for decades to come. Joey began his journey with a self-motivated background in computer science during high school combined with a knack for playing any instrument he could find. This eventually became the spark for his in-the-box production methods and also the seed that grew into his passion for audio software design.
  Jeff Performs "Heir to the Tone" with Toneforge ® Jeff Loomis
  What People Are Saying
  "I am really liking this plugin! Jeff is one of my heroes and this plugin sounds excellent. The dual rectifier here is one of the best dual rectifier in plugin format I have tried so far."
  Ola Englund (Guitarist, Producer, YouTuber)
  "I'm impressed with how well it holds up to others of my preferred amp sim plugins from companies like Neural DSP or STL Tones. I definitely think JST re-established themselves as a competitor in the modern world of amp sims with this plugin."
  Andres Martinez (Guitarist / Producer)
  "The versatility of the TFJL plugin is endless, the perfect tool for any producer or guitarist who wants to find the ultimate all in one guitar tool."
  Robin Leijon (Producer)
  "It feels so good to play through! The ability to blend IRs is game-changer for the toneforge plugins."
  Gerard Vachon (Producer)
  Detailed Walkthrough
  There's a lot of features to unpack in Toneforge® Jeff Loomis. In this video, we'll walk through every single parameter, feature, and how it works in the plugin.
