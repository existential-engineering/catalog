description: Algorithmic concert hall reverb plug-in that recreates the
  acoustics of large performance halls, with noticeable modulation and a long
  reverb tail suited to contemporary music sources.
details: |-
  PCM Native Concert Hall Reverb is a Lexicon software reverb plug-in that models the acoustics of a concert hall — a space built specifically to enhance the sound of a musical performance. The algorithm produces a long reverberant tail with noticeable modulation, which yields strong pitch effects at higher settings.

  The plug-in ships with 60 studio-quality presets and supports full parameter automation inside the host DAW. A real-time spectral display with input/output metering provides visual feedback while dialling in settings.

  The user interface is a single-screen design with a portable, DAW-independent preset format so settings transfer across host applications. Authorization requires an iLok2 USB key.

  Lexicon lists this product as Discontinued. The final build was version 1.3.6, released August 2016, with installers for Mac (Intel, 16.6 MB) and Windows (48.9 MB). The plug-in is part of the broader PCM Native Reverb Plug-in Bundle, which is also no longer offered for new sale.
specs: |-
  - Algorithmic concert hall reverb with long modulated tail
  - 60 studio-quality presets
  - Full parameter automation
  - Real-time spectral display with input/output metering
  - Single-screen interface with portable preset format
  - iLok2 USB authorization required
