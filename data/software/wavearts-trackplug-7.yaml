description: "All-in-one channel strip plug-in integrating a gate, compressor,
  10-band equalizer, transient shaper, tube saturator, and peak limiter with
  extensive visual feedback for precise sound control."
details: |-
  Gate/expander with side-chain EQ and scrolling time view. Compressor with multiple modes and side-chain EQ. 10-band EQ with parametric, shelf, analog shelf, and notch filters. Stereo linked and mid-side processing per EQ band. Lowpass and highpass brickwall filters with variable slope. Realtime spectrum display. EQ Match mode. Transient processor. Tube saturator. Customizable processing chain with rearrangeable modules. Low latency lookahead peak limiter. Advanced metering including K-meters.
specs: |-
  Mac: AU, VST3, AAX. macOS 10.13+, Apple Silicon native, 64-bit only. Windows: VST2, VST3, AAX. Windows 7/8/10/11, 64-bit only. iLok supported but not required.
