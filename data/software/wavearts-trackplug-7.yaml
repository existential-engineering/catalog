description: TrackPlug 7 integrates essential channel strip tools, including a gate, compressor, 10-band equalizer, transient shaper, tube saturator, and peak limiter. Most modules provide extensive visual feedback, enabling users to monitor and adjust with precision.
details: |-
  TrackPlug 7 simplifies complex audio tasks with an intuitive layout and a toolkit for precise sound control. The gate suppresses background noise by adjusting threshold and ratio interactively, and the compressor provides dynamic control through flexible sidechain modes, a built-in sidechain equalizer, and realtime gain reduction visualization.

  For frequency adjustments, TrackPlug 7 includes a 10-band equalizer with parametric, shelf, analog shelf, and notch filters, plus brickwall lowpass and highpass filters with variable slope. The EQ module offers real-time spectrum displays, stereo-linked and mid-side processing, and an expanded view for meticulous adjustments. An EQ matching feature automates the process of matching EQ between tracks.

  The transient processor shapes attack and sustain elements, making it easy to create punchy percussion and emphasize transient detail within a mix. The tube saturator adds analog warmth and harmonic richness to digital audio. Routing is customizable, so modules can be rearranged to fit a specific signal chain, and the metering options support the K-meter system.

  TrackPlug 7 is included in Power Suite 7.
specs: |-
  - Gate/expander with side-chain EQ and scrolling time view
  - Compressor with multiple modes, side-chain EQ, and scrolling time view
  - 10-band EQ with parametric, shelf, analog shelf, and notch filters
  - Stereo linked and mid-side processing per EQ band
  - Lowpass and highpass brickwall filters with variable slope
  - Realtime spectrum display
  - EQ Match mode automates the task of EQ matching between tracks
  - Transient processor shapes attack and sustain portions of sounds
  - Analog-style tube saturation for warmth and harmonic richness
  - Customize the processing chain with rearrangeable modules
  - Low latency lookahead peak limiter
  - Advanced metering options including K-meters
  - Output gain, pan, width, and channel polarity controls
  - Requires a host program that supports audio plug-ins
  - iLok licensing is supported but not required
  - Macintosh formats: AU, VST3, AAX
  - Windows formats: VST2, VST3, AAX
  - macOS 10.13 (High Sierra) and higher
  - Apple Silicon natively supported (AU, VST3, AAX)
  - Windows 7/8/10/11
  - AAX requires Pro Tools 11 and higher
  - 64-bit hosts only
