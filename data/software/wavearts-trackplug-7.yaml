description: Perfect for professionals and audio enthusiasts alike, TrackPlug 7 integrates essential tools, including a gate, compressor, 10-band equalizer, transient shaper, tube saturator, and peak limiter. Most modules provide extensive visual feedback, enabling users to monitor and adjust with precision.
details: |-
  - TrackPlug 7 is an all-in-one channel strip plug-in combining a gate/expander, multi-mode compressor, 10-band EQ, transient processor, tube saturator, and low-latency peak limiter into a single intuitive interface.
  - The gate tool suppresses background noise by adjusting threshold and ratio interactively, while the compressor provides dynamic control through flexible sidechain modes and a built-in sidechain EQ with real-time gain reduction visualization.
  - The 10-band equalizer supports parametric, shelf, analog shelf, and notch filter types, plus brickwall lowpass and highpass filters with variable slope, and features real-time spectrum display, stereo-linked and mid-side processing per band, and a sophisticated EQ Match automation mode.
  - The transient processor shapes attack and sustain portions of sounds for punchy percussion and dynamic mixes, while the tube saturator adds analog warmth and harmonic richness reminiscent of classic tube hardware.
  - Modules can be reordered to customize the processing chain, and advanced metering options including K-meters and output gain, pan, width, and channel polarity controls round out the feature set. Included in Power Suite 7; discounted upgrades available for TrackPlug 5 and 6 users.
specs: |-
  - Gate/expander with side-chain EQ and scrolling time view
  - Compressor with multiple modes, side-chain EQ, and scrolling time view
  - 10-band EQ with parametric, shelf, analog shelf, and notch filters
  - Stereo linked and mid-side processing per EQ band
  - Lowpass and highpass brickwall filters with variable slope
  - Real-time spectrum display
  - EQ Match mode automates EQ matching between tracks
  - Transient processor shapes attack and sustain portions of sounds
  - Analog-style tube saturation for warmth and harmonic richness
  - Customizable processing chain with rearrangeable modules
  - Low latency lookahead peak limiter
  - Advanced metering options including K-meters
  - Output gain, pan, width, and channel polarity controls
  - macOS 10.13 (High Sierra) and higher; Apple Silicon natively supported (AU, VST3, AAX)
  - Windows 7/8/10/11; VST2, VST3, AAX
  - AAX requires Pro Tools 11 and higher; 64-bit hosts only
  - iLok licensing supported but not required
