description: An intuitive combination of saturation, warmth filtering, ambiance, delay and compression — a budget channel strip that punches way above its price tag. Delivers warm saturation, funky ambiance and vintage flavor for vocals, guitars, brass, bass, drums, and master bus. Features Spice (saturation with harmonic distortion), Whipped Cream (ambient effects), Warmth (adaptive filter network), Cinnamon (bucket-brigade analog delay 0-2000ms), and Espresso Shot (32:1 limiter).
details: |-
  Pumpkin Spice Latte is a vintage lo-fi saturation channel strip plugin from Korneff Audio that combines multiple analog-inspired processing stages into a single unit. It delivers warm saturation, funky ambiance, and vintage flavor suitable for a wide range of musical contexts.

  The plugin features five distinct processing sections. The Spice control provides analog tube-style saturation with harmonic distortion, while the Warmth control applies a proprietary adaptive filter network for tonal shaping.

  Whipped Cream adds an ambient reverb effect to the signal, and Cinnamon provides a bucket-brigade delay emulation with a range of 0–2000ms. The Espresso Shot section is a 32:1 limiter designed to add aggressive character and control peaks.

  Pumpkin Spice Latte supports Mac 64-bit (VST3, AU, AAX) and Windows 64-bit (VST3, AAX). Licensing is software-based with up to four simultaneous machine activations.
