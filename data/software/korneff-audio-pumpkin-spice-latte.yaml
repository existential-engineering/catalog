description: "A channel strip combining saturation, warmth filtering, ambiance, delay and compression, for vocals, guitars, brass, bass, drums or the master bus."
details: |-
  Pumpkin Spice Latte combines saturation, ambiance, warmth filtering and echo in one plug-in, aimed at retro and lo-fi processing. The Espresso Shot control switches the plug-in into a heavily distorted mode.

  Spice adds tube-style saturation with harmonic distortion. At low settings it adds upper-midrange presence, and at high settings it models an overdriven tube channel on a console. Whipped Cream adds ambiance, from a small room at low settings to a dense wash at high settings.

  Warmth is a proprietary adaptive filter network that sets frequency response from a single control, described by the maker as a tube-to-tape signal chain on one knob. Cinnamon is a bucket-brigade style analog delay emulation with times from 0 to 2000ms, covering comb filtering, slapback and rhythmic delays.

  Espresso Shot switches in a 32:1 limiter with fast attack and release and a large amount of gain. The back panel gives further control over delay times, the position of elements in the signal flow and the Espresso Shot behaviour.

  Documented applications run from vocals, to guitars with distortion and slapback, to drums with room and saturation, to distortion on synths, brass and bass, to stem and mix bus processing.
specs: |-
  - Spice: analog tube-style saturation with harmonic distortion
  - Whipped Cream: ambiance from subtle room to swirling psychedelic wash
  - Warmth: proprietary adaptive filter network on a single control
  - Cinnamon: bucket-brigade style analog delay emulation, 0 to 2000ms
  - Espresso Shot: switchable 32:1 limiter with fast attack and release and high gain
  - Back panel with adjustable delay times and rearrangeable signal flow
  - Software-based licensing, no USB or hardware dongle and no special drivers
  - Activation on up to four machines at the same time
  - Internet connection required for activation and for all demos
  - Minimum: Intel, AMD or Apple Silicon i5 quad core processor
  - Minimum: 4GB of RAM
  - Minimum: Mac OS X 10.14 or higher
  - Minimum: Windows 7 and above
  - Minimum screen resolution: 1024 x 768
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
