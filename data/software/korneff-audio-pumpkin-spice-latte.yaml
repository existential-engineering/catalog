description: Pumpkin Spice Latte is an intuitive combination of saturation,
  warmth filtering, ambiance, delay and compression, a budget channel strip that
  punches way above its price tag. Use it for vocals, guitars, brass, bass,
  drums, the master bus.
details: |-
  Pumpkin Spice Latte is an intuitive, versatile plug-in that oozes vintage and lo-fi vibes. Its tasty blend of saturation, ambiance, warmth and echo makes it fast to dial in sounds from retro R&B to indie rock. But don't let its gentle autumnal appearance fool you: click on Espresso Shot and the PSL goes from pumpkin to punk, full of distortion grit and psychedelia.

  Spice adds saturation, analog tube-style, with delicious harmonic distortion for a truly vintage flavor. Add just a touch to get some upper-midrange presence. Crank it to emulate an overdriven tube channel on a console. Whipped Cream is instant ambient sweetness. A little squirt puts your track in a room. A big glob turns things into a swirling psychedelic mess.

  Warmth is a proprietary adaptive filter network. Tailor frequency response with one intuitive control. Experiment as you mix to get your track to sit precisely in the mix. Warmth is a tube-to-tape signal chain waiting for you.

  Cinnamon is a bucket-brigade style analog delay emulation. With a range of delay times from 0 to 2000ms, you can get effects from comb filters to rockabilly slapbacks to musical, rhythmic delays that take a simple part to the next level.

  Espresso Shot switches in a 32:1 limiter, with fast attack and release and a TON of gain. Like a jolt of caffeine, the PSL's Espresso Shot is a boost of energy and attitude, turning a gentle vintage vibe into a punk'd out mess. Flip around to the back of the bar and get even more control: adjust delay times, move elements in the signal flow, and play around with the Espresso Shot.
specs: |-
  - Spice: analog tube-style saturation with harmonic distortion
  - Whipped Cream: ambiance, from a light room to a swirling psychedelic wash
  - Warmth: proprietary adaptive filter network on one control
  - Cinnamon: bucket-brigade style analog delay emulation, 0 to 2000ms
  - Espresso Shot: 32:1 limiter with fast attack and release and high gain
  - Back panel with adjustable delay times and rearrangeable signal flow
  - Intel, AMD or Apple Silicon i5 quad core processor
  - 4GB of RAM
  - Mac OSX 10.14 or higher
  - Windows 7 & Above
  - Screen res: 1024 x 768 or higher
  - Mac 64bit: VST3, AU, AAX
  - Windows 64bit: VST3, AAX
  - Software-based licensing, no USB or hardware dongles
  - Activation on up to four machines at the same time
  - Internet connection required for activation and for all demos
