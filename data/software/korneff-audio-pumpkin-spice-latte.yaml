description: Pumpkin Spice Latte is an intuitive combination of saturation, warmth filtering, ambiance, delay and compression, a budget channel strip that punches way above its price tag. Use it for vocals, guitars, brass, bass, drums or the master bus.
details: |-
  Pumpkin Spice Latte brings warm saturation, funky ambiance and vintage flavor to your recordings. It is an intuitive, versatile plug-in that oozes vintage and lo-fi vibes, and its blend of saturation, ambiance, warmth and echo makes it fast to dial in sounds from retro R&B to indie rock. Do not let the gentle autumnal appearance fool you: click on Espresso Shot and the PSL goes from pumpkin to punk, full of distortion grit and psychedelia.

  Spice adds saturation, analog tube-style, with harmonic distortion for a vintage flavor. A touch gives upper-midrange presence, and cranking it emulates an overdriven tube channel on a console. Whipped Cream is instant ambient sweetness: a little squirt puts your track in a room, a big glob turns things into a swirling psychedelic mess.

  Warmth is a proprietary adaptive filter network that tailors frequency response with one intuitive control, described as a tube-to-tape signal chain on a single knob. Cinnamon is a bucket-brigade style analog delay emulation with times from 0 to 2000ms, covering comb filters, rockabilly slapbacks and musical rhythmic delays.

  Espresso Shot switches in a 32:1 limiter with fast attack and release and a great deal of gain, turning a gentle vintage vibe into a punked-out mess. Flipping around to the back panel gives further control: delay times, the position of elements in the signal flow and the Espresso Shot behaviour.

  Suggested uses run from warm, defined vocals, to guitars with distortion and slapback, to vintage drums with a bit of room and saturation, to distortion and fuzz on synths, brass and bass, to glue on stems or the mix bus.
specs: |-
  - Spice: analog tube-style saturation with harmonic distortion
  - Whipped Cream: ambiance from subtle room to swirling psychedelic wash
  - Warmth: proprietary adaptive filter network on a single control
  - Cinnamon: bucket-brigade style analog delay emulation, 0 to 2000ms
  - Espresso Shot: switchable 32:1 limiter with fast attack and release and high gain
  - Back panel with adjustable delay times and rearrangeable signal flow
  - Software-based licensing, no USB or hardware dongle and no special drivers
  - Activation on up to four machines at the same time
  - Internet connection required for activation and for all demos
  - Minimum: Intel, AMD or Apple Silicon i5 quad core processor
  - Minimum: 4GB of RAM
  - Minimum: Mac OS X 10.14 or higher
  - Minimum: Windows 7 and above
  - Minimum screen resolution: 1024 x 768
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
