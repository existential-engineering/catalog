url: https://www.vsl.co.at/en/BBO_Map/BBO_Jupiter
description: "Big Bang Orchestra: Jupiter horns: six french horns, recorded at
  synchron stage Vienna. Multiple microphone positions, additional close-mic..."
details: |-
  During the last several years of recording big projects for film, games and
  commercials at synchron stage Vienna, our engineers have had extensive
  experience recording various horn ensemble sizes. Having identified a sweet
  spot of six double horns, that's the ensemble size we chose for the recordings
  of Big Bang Orchestra: Jupiter. Its compelling sound is well rounded from
  pianissimo to fortissimo, and it's extremely powerful in the louder ranges.

  Working with viennese musicians, the vienna horn would be the natural choice,
  but the double french horn is the gold standard in film scoring, so that's
  what we've recorded for this installment of the big bang orchestra. The large
  "stage a" magnificently emphasizes the characteristics of the horns, and their
  glorious sound is captured with skillful miking by synchron stage's chief
  recording engineer, bernd mazagg.

  The library boasts a rich set of articulations, with up to five velocity
  layers, variations of short notes, marcatos, real legatos, several dynamic
  articulations (sfz, sffz, various crescendos and decrescendos), flutter
  tonguing, trills, rips and fast repetitions.

  The synchron player offers mixer presets that integrate seamlessly with all
  the other modules of the big bang orchestra. The "processed" category offers
  mixer presets such as "compressed", "sparkling", "wall of low horns", "howling
  horns", "threatening sustain" and more that correspond with the brass presets
  of big bang orchestra: hercules, izar and korpernikus.

  Microphone setup: main (decca tree stereo), main (decca tree center), main
  surround stereo, high stereo, high surround stereo, mid stereo, horns close.
  Download file size 2.0 gb. Installed file size 5.9 gb.
