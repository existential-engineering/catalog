description: Vocal Limiter is a limiter built for the last stage of a vocal chain, tuned to target the frequency range of vocal performances. It offers a threshold control, four auto-release speed modes, input and output faders and real-time VU metering.
details: |-
  Vocal Limiter is designed to sit last in a vocal processing chain and to be as simple to operate as possible. It specifically targets the frequencies of vocal performances, so it is less affected by very high or very low frequency content, and it catches the fluctuating dynamics that remain after volume riding and compression.

  The threshold control clamps down on levels above a set amplitude. How quickly the signal recovers afterwards is dictated by the Speed button.

  A central button at the bottom of the interface toggles the auto-release between four speed settings. Slow suits smoother performances such as ballads and acoustic songs, fast suits quicker changes such as vocal chops and raps, and medium covers most other vocal material. An ultra slow setting is included as a bonus, useful for synth parts and other audio that needs a gentler, more transparent release.

  Input and output faders balance vocals recorded at different volumes and dynamics, and work alongside a click and pop free bypass button for accurate A/B comparison in context. Live VU meters show exactly what is happening to the audio signal in real time, allowing monitoring at every step of the chain.

  Factory presets collect useful parameter combinations and are reachable from the browser or the arrows either side of the preset section. Version 2.0.0 added resizability with updated preset and license management, and version 2.1.0 added native Apple silicon and arm64 support.
specs: |-
  - Threshold control
  - Four auto-release speed modes
  - Input and output gain sliders
  - Real-time VU metering
  - Pop and click free bypass
  - Responsive and CPU friendly
  - Factory presets
  - Full PDF manual and tutorial video
  - Resizable interface
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
