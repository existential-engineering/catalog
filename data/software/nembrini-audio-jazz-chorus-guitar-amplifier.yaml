details: |-
  Modeled after the legendary Roland JC-120, the Nembrini Audio Jazz Chorus captures the iconic solid-state design renowned for its pristine clean tones, lush stereo chorus, and rich vibrato.

  Equipped with tone, volume, distortion, and spring reverb controls, it delivers the classic sound that has shaped countless musical genres.

  The amplifier section features the iconic solid-state design with controls for Bright, Volume, Treble, Middle, Bass, Distortion, and Reverb, and includes the classic stereo Chorus and Vibrato powered by a BBD chipset for warm, analog modulation tones.

  Pre-amplifier stomp effects cover a Noise Gate, Compressor, Auto Swell, and Fuzz for shaping your tone, all draggable for flexible signal routing. Post-amplifier effects include an Equalizer, a Delay with Shimmer, and a Studio Compressor, also draggable.

  Six carefully selected cabinet emulations and an impulse response loader let you load your favorite IRs, and a standalone version of the plugin is included so you can use it without a DAW.
specs: |-
  - Amplifier Section: solid-state design with Bright, Volume, Treble, Middle, Bass, Distortion and Reverb controls
  - Classic stereo Chorus and Vibrato powered by a BBD chipset
  - Pre-Amplifier Stomp Effects: Noise Gate, Compressor, Auto Swell and Fuzz, all draggable for flexible signal routing
  - Post-Amplifier Effects: Equalizer, Delay with shimmer and swell, and Studio Compressor, all draggable
  - Cabinet Emulations: six carefully selected cabinets emulating classic guitar speaker cabinets
  - Microphone Emulations: four premium microphones, each with selectable positions
  - Mixer: volume and pan controls to blend cabinet and microphone sounds
  - IR Loader: up to three simultaneous IRs with a visual graph representation of the loaded waveforms
  - Standalone version included, usable without a DAW
  - Plugin Formats: a VST2, VST3, AAX or AudioUnits compatible host
  - System: an Intel compatible or Apple Silicon CPU, 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
