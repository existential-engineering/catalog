description: An emulation of the iconic solid-state Roland JC-120 amplifier, renowned for its pristine clean tones, lush stereo chorus, and rich vibrato with authentic BBD chipset modeling. The plugin recreates the legendary clean headroom and onboard stereo effects that made the Jazz Chorus a studio and stage staple.
details:
  - The Jazz Chorus Solid State Guitar Amplifier plugin faithfully emulates the iconic Roland JC-120 combo amplifier, capturing its signature pristine clean tones and legendary stereo chorus effect. The amplifier section features authentic BBD (Bucket Brigade Device) chipset modeling for the onboard Chorus and Vibrato effects, delivering the lush, shimmering character that defined the original hardware.
  - The plugin includes a full amplifier section with controls for Bright, Volume, Treble, Middle, Bass, Distortion, and Reverb, closely mirroring the original hardware layout. The stereo Chorus and Vibrato circuits use BBD modeling to faithfully reproduce the distinctive sonic quality that made the JC-120 a staple on stages and in studios worldwide.
  - A suite of pre-amplifier stomp effects with draggable signal routing allows players to customize their tone chain before hitting the amp. Available stomps include a Noise Gate, Compressor, Auto Swell, and Fuzz, giving players flexible tone-shaping tools that complement the amplifier's clean character.
  - The cabinet and IR section offers six cabinet emulations and four microphone emulations with selectable positions, as well as an impulse response loader supporting up to three simultaneous IRs. This flexibility allows players to dial in the exact cabinet sound they need, from the classic JC-120 4x12 to custom IR captures.
  - Post-amplifier effects — including an Equalizer, Delay with Shimmer, and Studio Compressor — round out the signal chain, all with draggable routing for complete control over the processing order. The plugin is available for macOS and Windows in VST2, VST3, AAX, and AudioUnit formats, with a standalone version and an iOS app also available.
