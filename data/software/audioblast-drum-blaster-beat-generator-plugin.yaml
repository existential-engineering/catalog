details: |-
  Drum Blaster is a complete drum production environment designed for producers who want powerful sound-shaping tools, analog-grade warmth, and instant creative inspiration. With 16 channel strips, 11 integrated FX processors, and a library of more than 4000 drum samples, it is built to cover the whole path from sound selection to finished groove. The package also includes 200 presets and 100 MIDI files.

  Samples load across 16 fully independent channel strips with multi-out routing, each carrying tuning, panning, volume, mute/solo and output routing, plus random sample triggering, sample skipping and scope visualization. Every strip provides 3 FX slots drawing on 11 processors: filters, reverb, SynthVerb, four analog-inspired distortions (Rage Clip, 4-Band Fuzz, Disto Fuzz, Overdrive), flanger, chorus, phaser and delay.

  Dedicated workflow tabs give quick access to the sample editor, master controls, browser and randomizer. The precision sample editor offers trim, zoom, anti-alias and fine-tune controls over a clean waveform display, while the master section holds a global scope, VU meter, master volume, velocity control and a preset browser. A sample randomizer pulls sounds from multiple folders at once, and the dedicated Random section can generate a complete drum kit in one click.

  The sound library covers over 4000 drum samples and 200 genre-focused presets, including sounds from classic drum machines. Everything was recorded through a Neve VR32 console using Distressors, Pultec EQs, Manley processors and other high-end hardware, produced at Oasis Studio on Reunion Island.

  That Neve VR32 was originally part of the Tranquille le Chat studio in Paris, dismounted, transported across France, shipped overseas to Reunion Island and fully restored by Vincent Heckel (e-licktronics). Drum Blaster runs on macOS 10.15 and later including Apple Silicon M1 to M4, Windows 7 to 11, and Linux. Minimum requirements are an Intel i5 equivalent CPU and 4 GB RAM, with an internet connection needed for activation and updates.
