details: |-
  Drum Blaster is a complete drum production environment designed for producers who want powerful sound-shaping tools, analog-grade warmth, and instant creative inspiration. With 16 channel strips, 11 integrated FX processors, and a massive library of more than 4000 drum samples, Drum Blaster gives you everything you need to build your next hit. The package also ships with 200 presets and 100 MIDI files.

  Samples load, trigger and are sculpted across 16 fully independent channels, each strip carrying tuning, panning, volume, mute/solo and output routing. Every channel strip includes 3 FX slots drawing on 11 processors: filters, reverb, SynthVerb, four analog-inspired distortions (Rage Clip, 4-Band Fuzz, Disto Fuzz, Overdrive), flanger, chorus, phaser and delay. Dedicated workflow tabs give quick access to the sample editor, master controls, browser and randomizer.

  The Sample Randomizer explores endless combinations of drums and percussion by pulling sounds from multiple folders at once, and the dedicated Random section can generate a complete drum kit in one click. A precision sample editor allows trimming, zooming, anti-aliasing and fine-tuning against a clean waveform display, while the master section provides a global scope, VU meter, master volume, velocity control and a preset browser.

  The sound library holds over 4000 drum samples and 200 genre-focused presets, including iconic sounds from legendary drum machines. All sounds were recorded through a Neve VR32 console using high-end hardware such as Distressors, Pultec EQs and Manley processors, with the entire library produced at Oasis Studio on Réunion Island.

  That Neve VR32 console has a history of its own: originally part of the Tranquille le Chat studio in Paris, it was dismounted with care, transported across France, shipped overseas to Réunion Island and fully restored by Vincent Heckel (e-licktronics). Audio Blast positions Drum Blaster as a complete drum creation ecosystem for techno, house, hip-hop, trap, EDM, dub and breaks rather than as another drum sampler.
