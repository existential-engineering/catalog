details: |-
  Abl3 is a complete redesign from scratch and has been in development for
  several years with the goal of creating the most authentic emulation possible.
  With an intuitive and streamlined workflow AudioRealism hope abl3 will set a
  new benchmark in software 303 emulation.

  Massively improved 303 emulation engine. Host hard sync. Resizable gui.
  Classic edit view. Pattern edit view. Real time randomizer. Wave analyzer (for
  automatically transcribing your 303 patterns). Setup screen with several
  emulation tweakables. Step record function (via MIDI). Vibrato effect by
  setting up+down on a step. Technobox2 pattern import.

  Audiorealism bass line 3 (abl3) by audiorealism is a virtual instrument audio
  plugin and a software application for macos and windows. It functions as a VST
  plugin, an audio units plugin, a VST 3 plugin, a rack extension plugin and a
  standalone application.
specs: |-
