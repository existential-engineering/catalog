details: |-
  Auto-tune pro x is the most advanced auto-tune edition ever. It includes a
  redesigned graph mode for detailed pitch and time editing, auto mode for
  real-time correction and effects, and runs natively on apple silicon.

  Streamlined graph mode provides extremely precise pitch correction
  capabilities and auto mode delivers powerfully easy real-time editing. An
  exclusive collection of artist presets and a new presets manager to fast-track
  creativity.

  Native support for apple silicon processors enables faster performance and
  increased plug-in efficiency on the latest apple hardware. Multi-view lets you
  quickly switch between separate auto-tune tracks in a single window to edit
  multiple vocals, faster.

  Auto-tune is the most sophisticated effect for pitch correction. The
  innovative throat modeling and formant correction controls will offer endless
  options to optimize and enhance your vocal tracks. Real-time pitch correction
  has never been easier thanks to the low-latency mode, which you can use both
  while recording in the studio or performing live.

  The included auto-key plug-in can automatically detect keys and scales in no
  time and with flawless precision. With over twenty years of relentless
  development and evolution, auto-tune pro x is the industry-standard
  pitch-correction plug-in used by award-winning and independent artists.
