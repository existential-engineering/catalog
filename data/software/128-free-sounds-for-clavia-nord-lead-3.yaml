details: |-
  This set contains 128 sounds for the synthesizer clavia nord lead 3. In the set you will find many classic fm sounds like electric pianos and basses, but also many typical analog sounds.

  The nord lead 3 shines in both areas and also has this exciting combination of both elements.

  The sounds are available as syx and MIDI file. The MIDI file can be imported into almost any sequencer, the syx file can be opened with the nord sound manager.
