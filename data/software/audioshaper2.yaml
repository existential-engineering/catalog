details: |-
  Nymano Audio proudly presents AudioShaper2, a cutting-edge and easy to use
  transient shaper that helps you sculpt your drum sounds easily. This plugin
  will help you take your drums and percussions to the next level with intuitive
  controls.

  Designed for musicians who want professional-quality results without a phd in
  audio processing, this transient shaper helps you adjust your transient's
  attack, sustain, and frequency response with ease.

  Audioshaper2 wide range of presets can be fine-tuned to adapt to your style,
  cutting through the technical noise and letting your creativity shine.

  Intuitive ui to process your transients attack/release with ease. Attack and
  sustain independent cut/boost controls.

  Three eq types (bell, low shelf, high shelf) for attack/sustain cut or boost
  using a dynamic eq. Optional dynamic color eq based on the transient
  detection. Soft clipping.
specs: |-
  - Windows/macOS
  - Transient shaper
  - Attack and sustain independent cut/boost controls
  - Three EQ types (bell, low shelf, high shelf)
  - Dynamic EQ
  - Optional dynamic color EQ
  - Soft clipping
  - Intuitive ui
