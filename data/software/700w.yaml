details: |-
  700W is a completely new approach to compression. Unlike a conventional
  compressor it only acts where you need it. Its main field of application is to
  enhance your endmix.

  Gain some db of loudness you can't get from any other tool. 700w is easy to
  use. Just lower the threshold as long as you don't hear artifacts.

  Try the different sounds. Probably the "artifacts" will enhance your mix with
  the right sound setting.
