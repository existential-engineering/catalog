details: |-
  Beatgrader is the quickest route to lo-fi. Select a resample rate to quickly
  remove high end detail. Includes a saturation control to add weight.

  Beatgrader is good for removing the high end to make room for vocals or other
  elements. It can be applied to beats or works equally well on musical
  elements. It's also useful as a sound design tool.

  Beatgrader's algorithm models off-line resampling techniques typically used to
  deliver a unique lo-fi, underwater sound. Beatgrader does this in real-time
  with low latency and cpu so it can be dropped into any channel.

  The ui is high definition and resizable. Beatgrader works natively on m1 macs,
  intel macs and windows.

  Beatgrader is the second plugin from iceberg audio, a company focused on
  creating minimal focused products that solve specific tasks well.
