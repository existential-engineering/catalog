details: |-
  Bloom Drum Machine takes you down a path of vintage drum discovery, sampling
  some of the most iconic hardware units around and fusing them together in an
  all-in-one modern drum instrument that puts chart-topping rhythms straight
  into your hands. Bloom Drum Machine contains a comprehensive collection of
  one-shot samples and loops to elevate your tracks with the distinctive
  character of punchy analog drums through to experimental textures and
  off-kiltered loops.

  Excite audio directly recorded the signature sound directly from analogue drum
  synthesisers that soundtracked the 70's, 80's, and 90's. Then, in order to
  emulate the iconic tones of 'sample-based' grooveboxes, they recorded and
  processed live drums using analogue hardware units and digital mixing
  techniques, similar to the techniques used in the creation of these drum
  machines.

  Bloom's powerful sequencer enables you to craft patterns effortlessly and dial
  in modulating effects in sync with your track. Unlike traditional sequencers,
  the bloom sequencer is designed for triggering and layering one-shots and
  looping sequences, allowing for endless rhythmic creation.

  The edit page is the central hub for refining and making the library of
  samples your own. Adjust start and end points, manipulate playback speed and
  direction, and tweak the timbre with pitch and formant controls. In the
  modulation section, automate pitch, volume, and filter settings as well as
  three effects to add depth and dimension to your music.

  Make the bloom instrument your own with the ability to drag and drop audio
  files into it. You can do this via the waveform view on the edit page or any
  empty slot on the banks page. Set the key and bpm of your samples to make them
  integrate seamlessly with the bloom engine.
