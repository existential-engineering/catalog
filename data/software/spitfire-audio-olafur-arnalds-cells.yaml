details: |-
  "Cells constantly surprises me with little melodies that get created within the random intervals, often inspiring new melodies that I then take over to other instruments."
  – Ólafur Arnalds

  Moving beyond the realm of a typical sample library, Cells is our latest collaboration with Ólafur Arnalds, one of Iceland's foremost musicians, with a career spanning over a decade as a recording artist, live performer, and composer. Ólafur has received 3 GRAMMY nominations over his career, also winning a BAFTA for Best Original Music for the series "Broadchurch" and receiving an Emmy nomination for Outstanding Original Main Title Theme Music for "Defending Jacob."

  Cells is a collaborative tool that enables composers and producers to harness the power of a string orchestra and get the feeling of players responding as if they are in the same room as the composer. In addition there is a toolkit of vintage analogue synths with a variety of signal paths created and performed by Ólafur to embrace this same collaborative power.
specs: |-
  - Download size 29.79 GB
  - Over 200 presets
  - Scale Mode with a new 'Played' mode that detects the key being played
  - eDNA interface
  - String orchestra recorded with SinfoniaNord at Hof Cultural Center, Akureyri
  - Includes a toolkit of vintage analogue synths
  - macOS 11 to 26, minimum 2.8GHz quad-core i5 and 8GB RAM, 64 bit DAW required
  - Windows 10 and 11 (64-bit), minimum 2.8GHz quad-core i5 or Ryzen 5 and 8GB RAM
