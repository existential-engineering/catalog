details: |-
  Addictive Drums 2 brings the world's finest drums straight into your music. You get outstanding drums, professionally-played rhythms, and phenomenal sound-shaping and mixing features that make your productions sound alive. All this with a fast, musician-centric interface that gets amazing results without getting in your way.

  Addictive is compact but because its processed with 8 channels, it makes things very easy as all kits and paks correspond to the same 8 pieces, so you can tweak the tones and sounds of each instruments.

  You can transform the sound, style, and MIDI programming of each groove you drop into the editor, and it's really cool to be able to get the same back bone while the pieces may change in their amount, velocity, timing or whatever parameter.

  Version 2 features 18 drum pieces compared to the previous version's 12, with more tweakability and better libraries.

  Library expansions include boutique mallet, vintage dry, black velvet, and session percussion, making addictive drums functional for a wide range of uses.
