name: Blow-fi
manufacturer: outofmind
primaryCategory: distortion
description: Blow-fi is a shaper based distortion and signal destruction VST
  plugin. Blow-fi turns any audio signal into completely different results.
details: |-
  Blow-fi is a shaper based distortion and signal destruction VST plugin.
  Blow-fi turns any audio signal into completely different results that fits to
  genres like industrial, noise, dark ambient, or hard electro, but above all:
  experimental.

  Methods of use could be from screamer, noise gate, bit crusher, filter,
  loudness maximizer to noise generation, "re-looping", changing synths waves
  and others.

  Symmetric / asymmetric shaper mode. Up to 20 editable points and 19 areas with
  six shapes per one area transmission curve with cubic interpolation.

  Editable frequency range at distortion input, with modulated lowpass filter on
  output. Envelope follower, noise and sequence modulators. Modulated pre and
  post gain.

  Graphic display of the fx behavior on example sine wave. Optional dc offset
  filter in asymmetric mode.
specs: |-
  - Waveshaper distortion
  - Symmetric / asymmetric shaper mode
  - Up to 20 editable points
  - 19 areas with six shapes per area
  - Cubic interpolation
  - Editable frequency range at distortion input
  - Modulated lowpass filter on output
  - Envelope follower modulator
  - Noise modulator
  - Sequence modulator
  - Modulated pre and post gain
  - Graphic display of FX behavior on sine wave
  - Optional dc offset filter in asymmetric mode
  - Windows compatible
