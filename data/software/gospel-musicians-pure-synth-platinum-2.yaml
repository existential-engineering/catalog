description: Pure Synth Platinum is a hybrid rompler synthesizer with sample
  streaming, analog waveforms, wavetables, and effects from Overloud. It offers
  unlimited modulation, JP-modeled unison, and an expansion system for adding
  new sounds.
details: |-
  Pure Synth Platinum is now FREE! We have matured our Pure Synth architecture to a point now where we can provide top notch sounds, and features all packaged into an expansion powerhouse. Similar to many of the virtual sampler player systems, Pure Synth now has a FREE version. Whenever you want new sounds and inspirations, you can expand through our easy expansion system. Make and share free presets and sounds with your friends.
