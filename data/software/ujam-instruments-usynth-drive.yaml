description: DRIVE is made for high-energy electronica, a powerful house essentials synthesizer with 100 global presets, 25 sequences, 100 synth modes and 90 finisher modes.
details: |-
  DRIVE is made for high-energy electronica. It comes with 100 global presets, 25 sequences, 100 synth modes and 90 finisher modes.

  Under the hood, Usynth is a very complex synthesizer. Each instance consists of 2 individual layers per voice, with virtual analog, wavetable, FM and multisample synthesis, multi-mode filter, 5-stage envelopes, LFOs, a 12-way modulation matrix and much more.

  Usynth doesn't require you to know how a synthesizer works in order to find and create inspiring new sounds. Intuitively tweak to your heart's content. Think Instagram filters, or steering wheel and two pedals, that's how you operate Usynth.
specs: |-
  - 100 global presets
  - 25 sequences
  - 100 synth modes
  - 90 finisher modes
  - 2 individual layers per voice
  - Virtual analog, wavetable, FM and multisample synthesis
  - Multi-mode filter, 5-stage envelopes, LFOs and a 12-way modulation matrix
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8GB of RAM
  - 1.23GB of free disk space
  - 1280x768px display, internet connection
  - Moving the .blob sample content file to an external drive is not supported
  - Plug-in formats: AAX, AU 2, VST 2 and VST 3, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Requires the latest version of the UJAM App, which installs the Usynth plug-in that hosts all titles
