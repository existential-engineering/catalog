details: |-
  Analogue mixing and mastering collection is comprised two plug-ins: analogue channel strip and analogue eq.

  Channel strip is comprised of an 8 band customisable eq, buss compressor, limiter, and master section. Analogue eq is an 8 band customisable eq with master section.

  Buss compressor designed to 'glue' track groups together. Can also be used effectively to 'glue' the final mixdown.

  Signal flow of the analogue channel is as follows: eq > compressor > limiter.

  Analogue channel is perfect for buss channels or the master channel and can be used effectively for both mixing and mastering. Modelled on analogue hardware. Professional gui design. Low cpu usage.
specs: |-
  - 8 band customisable eq
  - Buss compressor
  - Limiter
  - Master section
  - Eq frequency range 20hz to 20,000hz
  - +/-40db gain per eq band
  - Input/output/compression gain reduction monitoring meters
  - VST plugin
  - Windows compatibility
  - Low cpu usage
