details: |-
  Big Bang Orchestra: Hercules includes ensemble recordings of four bass
  trombones, one bass tuba, and one contrabass tuba that plays an octave below
  the other instruments and can be individually turned on or off.

  The library boasts a rich set of articulations, with up to five velocity
  layers, variations of short notes, marcatos, real legatos, several dynamic
  articulations (sfz, sffz, various crescendos and decrescendos), flutter
  tonguing, trills, glissandos and fast repetitions.

  For long notes you can choose whether to use an additional fff layer. Playing
  at such intense levels requires moving a massive amount of air through very
  large instruments, which is especially challenging for recording sustained
  fortississimo notes, specifically when playing legatos.

  The low brass instruments of bbo: hercules are completely new recordings that
  can be combined with the tutti recordings of the big bang orchestra to create
  an even brassier low end. You'll find the usual mixer presets that integrate
  seamlessly with all the other modules of the big bang orchestra.

  The "processed" category offers mixer presets such as "compressed",
  "sparkling", "wall of low brass", "howling brass", "threatening sustain" and
  many more that will shake the ground beneath you.
