description: "Tilt EQ plugin using a novel equalization algorithm with extremely
  gentle slopes (usually less than 1 dB per octave) to dramatically alter audio
  tone while preserving phase, frequency, and transient response. Features tilt
  frequency spectrum adjustment, independent high/low cut filters (6-48 dB/Oct),
  perceptual loudness lock technology, and a listen function for auditioning
  filtered content. CPU-friendly enough for every channel."
