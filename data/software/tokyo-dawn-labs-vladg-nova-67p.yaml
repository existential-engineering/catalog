description: Nova-67P is a parallel parametric equalizer plugin combined with a compressor.
details: |-
  Nova-67P is a parallel parametric equalizer plug-in combined with a compressor. The compressor can optionally operate in frequency dependent and split-band modes, in which case the plug-in operates as a parallel dynamic equalizer.

  The product is discontinued. Tokyo Dawn Labs offers the download for historical reasons only, with no active support and no guarantee of compatibility with modern systems.
