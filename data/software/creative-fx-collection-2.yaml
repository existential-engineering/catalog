details: >-
  Air creative fx collection 2 is a carefully selected arsenal of 40
  high-calibre audio tools including 12 brand new plugins boasting a legacy
  rooted in professional music production. Leveraging a decade-long history of
  use in industry-leading platforms like pro tools and akai mpc, air effects
  have been a cornerstone in crafting the sound of some of the last decade's
  biggest hits.


  The collection covers all aspects of music production from initial creation to
  final mastering, offering unparalleled sonic quality and versatility. The
  suite includes over 40 plugins, each meticulously crafted to meet the
  demanding standards of today's music producers. From the amp sim, which
  recreates classic guitar tones, to half speed, perfect for achieving
  contemporary down-tempo vibes, the collection transcends genres.


  Mixing is made effortless with the air creative fx collection 2. The air
  channel strip provides an all-in-one solution for both basic and advanced
  mixing needs. Dynamics are seamlessly managed with the air compressor,
  transient designer and gate, and the air eq series offers the perfect tool for
  shaping sounds. The collection also includes acclaimed favourites like air
  delay pro, with its vast range of delay options, and flavor, a plugin adding
  vinyl vibes to tracks.


  The collection also excels in mastering, with tools like air maximizer and air
  limiter ensuring loud and clear final outputs. The air stereo width expands
  the stereo field while maintaining phase coherence, and plugins like air tube
  drive add the sought-after analogue warmth to digital masters.


  Included plugins: air amp, air channel strip, air chorus, air compressor, air
  delay pro, air delay, air diff delay, air diode clip, air distortion, air
  enhancer, air ensemble, air expander, air filter gate, air filter, air
  flanger, air flavor, air frequency shifter, air fuzz-wah, air half speed, air
  kill eq, air limiter, air lo-fi, air maximizer, air multi-chorus, air multitap
  delay, air noise gate, air nonlin reverb, air para eq, air phaser, air pitch
  shifter, air pumper, air reverb, air spectral, air spring reverb, air stereo
  width, air stutter, air talk box, air transient, air tube drive, air vintage
  filter.
