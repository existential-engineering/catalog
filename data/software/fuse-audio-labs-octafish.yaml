description: A subharmonic generator emulating the DOD FX32 Meatbox Subsynth (1990s) via precise M51134 IC circuit modeling. Synthesizes a naturally sounding sub-octave signal, boosting frequencies in the 20–80 Hz range to thicken the low-end of bass guitar, kick drums, and other bass-heavy sources. An Octave Solo switch strips the dry signal for precise sub-bass dialing or use as a dedicated sub-bass filter.
details: |-
  Emulates the DOD FX32 Meatbox Subsynth (1990s), specifically the M51134 IC chip circuit. Part of the VPB-Bundle virtual pedal board collection. Unlike pitch-shifters, Octafish synthesizes a sub-octave signal (not a transposed copy) — targets 20–80 Hz frequency range for deep bass reinforcement. Octave Solo switch removes dry signal for isolated sub-bass blend or as a standalone sub-bass filter. Zero-latency for live performance and recording.
specs: |-
  Controls: Octave (sub-level), Level (output gain), Sub (sub-band peaking EQ), Low (low-band peaking EQ), Octave Solo switch. Latency: zero-latency. macOS 10.9+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+, 2 GHz Intel CPU+, 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX. Copy protection: serial number.
