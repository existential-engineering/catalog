description: Presenting the Softube Tape plugin, the highly reviewed,
  best-selling, most-loved tape emulation VST with three distinct analog tape
  machine sounds to choose from. Add saturation, distortion, noise, and grit to
  your mixes with true analog tape sound.
details: |-
  Analog tape has a smoothing effect and adds weight and glue to a mix, it turns the recording from a collection of individual tracks into a song, where everything is connected and works together. Tape, with its component-level and physical modeling of three different tape machines, gives you all the warm vintage cohesion you could want in one plug-in. Add a few premium level features, like the mastering grade high shelf filter, stability control, and wet/dry mix knob, and you've got a new secret sauce.

  Select your favorite tape machine (A, B, or C) and adjust the Amount knob. Instant mojo. Easier still, load up one of the included presets to soak your tracks in analog tape sweetness. Experiment with different tape speed settings, or open the Remote Control panel where you can adjust the machine's stability, crosstalk amount, and several other features.

  Type A is based on a classic Swiss high end reel-to-reel machine, known and loved for its precision and linearity. Type B is much more colorful, it's a transformer based machine which adds extra weight and cream to the low end. Lastly, Type C is based on a British tape machine with a distinct vintage vibe. Each has its own story to tell, and its own special something to impart to your music.

  There are many ways to use and abuse a tape machine, and many modern engineers have never had the pleasure of working with a real (reel to reel) analog unit. That's why, to get you started, Tape includes presets made by Grammy-winning engineers such as Joe Chiccarelli (Beck, U2, Strokes) and Howard Willing (Smashing Pumpkins, Sheryl Crow, Kris Kristofferson). But there's no wrong answer. Crank Tape to its extremes and you'll get sounds that wouldn't even be possible in most analog machines, at extra-slow speeds for example, or with insane wow and flutter.

  If you run Presonus Studio One, you can not only use Tape as a standard plug-in. Adding Tape to your MixFX slot gives you Tape Multitrack. Tape Multitrack includes all the goodies of Tape, but in addition, you get selectable crosstalk between each individual track, and you can easily control the Tape Multitrack settings from a single interface. The Tape and Tape Multitrack license is one and the same.

  Like most Softube plug-ins, Tape is CPU-efficient. Use Tape on your master bus, or do it the retro way by adding Tape to every track. Tons of detail and texture, no CPU overload. This plug-in also supports Softube Extended Features and is Console 1 Ready, so it can be used within the Console 1 mixing system.
specs: |-
  - True analog tape sound
  - Three tape machine types included
  - Easy to use
  - Low CPU usage
  - Mastering grade high frequency control
  - Stability control to introduce wow and flutter, or tape flanging when combined with dry/wet mix knob
  - Includes Tape Multitrack which can be used in the MixFX slot of Presonus Studio One, adding individual channel crosstalk and single interface control of all tracks
  - Component-level and physical modeling of three different tape machines
  - Type A based on a classic Swiss high end reel-to-reel machine, known for precision and linearity
  - Type B a transformer based machine adding extra weight and cream to the low end
  - Type C based on a British tape machine with a distinct vintage vibe
  - Selectable tape speed settings
  - Remote Control panel for machine stability, crosstalk amount and further features
  - Wet/dry mix knob
  - Presets by Grammy winners Joe Chiccarelli and Howard Willing
  - Supports Softube Extended Features
  - Console 1 Ready
  - Also available as part of Flow Mixing Suite, Flow Mastering Suite and Flow Complete Suite
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Three activations included
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26; Windows 10 (64-bit), Windows 11
