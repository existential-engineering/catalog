description: >-
  Professional audio restoration software that removes wow and flutter from
  recordings made on tape, vinyl, and other mechanical formats.
details: |-
  Capstan uses Celemony's patented Direct Note Access technology to
  detect and correct wow, flutter, and continuous speed variations in
  digitized recordings from any mechanical format including tape,
  cassette, vinyl, wax, and shellac.

  Correction is performed using high-quality varispeed processing
  rather than pitch-shifting or time-stretching, preserving the
  natural character of the original recording without artifacts.

  Manual editing allows drawing correction curves by hand for
  precise control. Supports mono, stereo, multi-channel, and
  multi-track recordings. Used in Grammy-winning restorations
  and major archival preservation projects.
specs: |-
  - DNA-based wow and flutter detection
  - Varispeed correction without pitch-shifting artifacts
  - Manual correction curve editing
  - Mono, stereo, multi-channel, and multi-track support
  - Works with tape, cassette, vinyl, wax, and shellac sources
  - Supports all common audio formats
  - iLok 2 or 3 required for activation
  - macOS 10.9.5 or higher
  - Windows 7, 8.1, or 10 (64-bit)
  - 4 GB RAM minimum
