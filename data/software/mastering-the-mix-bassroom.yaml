details: |-
  Bassroom is a final mix and mastering EQ that helps beginners and pros nail
  their low-end in seconds. It does this by delivering exceptional sound quality
  and suggesting genre-specific EQ adjustments a great audio engineer in a
  world-class studio would make.

  Bassroom has unique filters that have minimal phase distortion and minimal
  transient distortion providing greater transparency than standard linear-phase
  filters at low-frequencies. This means that the low-end is not affected by
  unwanted phase changes that can alter the timbre of your audio or by transient
  distortion that means you lose the bite from kicks or bass-lines.

  Immersive 3d room display where frequencies are displayed vertically and gain
  is represented by depth in the room. The unique and intuitive ui helps you
  visualize how you're adjusting the low-end of your song. This gives you a more
  immersive mixing experience, helping you connect more with your music.

  The targets on the walls of bassroom suggest the genre-specific eq adjustments
  a great audio engineer in a world-class studio would make. This isn't simple
  'slowed-down' frequency matching. The targets are a result of a complex
  algorithm that accurately identifies how the human ear perceives
  low-frequencies relative to the balance of the whole mix.

  We analyzed the best mixes in various genres to give you eq target presets you
  can trust. From this starting point, you can tweak your low-end to perfection
  using the immersive 3d room interface.
specs: |-
  - Universal 2 binary
  - Minimal phase distortion filters
  - Minimal transient distortion filters
  - 3d room interface
  - Genre-specific EQ target presets
  - Level match pointer on output gain
  - Fully resizable user interface
  - Solo bands
  - Q bandwidth control
  - Reference track import capability
