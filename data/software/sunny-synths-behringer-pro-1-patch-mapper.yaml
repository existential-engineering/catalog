id: zk23VJs7mNdQAmAxSHonC
name: Behringer Pro-1 patch mapper
manufacturer: sunny-synths
primaryCategory: utility
url: https://www.sunnysynths.com/behringer-pro-1
description: A patch mapper for the behringer pro-1 that does not support the
  load/save of programs or the manipulation of program parameters by MIDI
  nrpn/cc messages except for global settings that can be transferred to the
  pro-1. It will support you in saving and retrieving pro-1 patches on your pc
  but gives you also the possibility to exchange them with other users as they
  are stored as sysex files. This application/plugin does not generate any
  sound.
details: |-
  A patch mapper for the behringer pro-1 that does not support the load/save of
  programs or the manipulation of program parameters by MIDI nrpn/cc messages
  except for global settings that can be transferred to the pro-1. It will
  support you in saving and retrieving pro-1 patches on your pc but gives you
  also the possibility to exchange them with other users as they are stored as
  sysex files. This application/plugin does not generate any sound.

  Behringer pro-1 interface with similar way of working as actual synthesizer.
  Interface with same look as actual synthesizer with top row of support screens
  with old look. Visual feedback by using LED ring buttons and indication of the
  parameter value.

  Envelopes graphs handled by mouse or classical adsr rotary encoders. Patch
  sheet tab with patch sheet for pro-1 and other gear (external
  synths/sequencer/fx chain). Patch cables (9 colors) with patch cables drawing
  directly on the main panel and ability to switch between full cables or cable
  plugs.

  Programs have a name, author, save date and description. They can be
  associated to a category. Browser of the files on the disk with display of
  current precise parameter value when clicking on rotary encoders. Global
  settings management with automatic/manual send to the pro-1 synth.

  Standalone versions for pc and mac. VST versions for pc (32 and 64-bits). VST
  and AU versions for mac. All buttons associated to a MIDI cc controller number
  so you can adjust them from a hardware controller.
specs: |-
  - Behringer pro-1 interface
  - Load/save programs from individual .syx files
  - Easy program renaming
  - Display and export of program parameters as text file
  - 9 input/output patch cables with different sources/destinations
  - Patch sheet tab for pro-1 and external gear
  - 9 color patch cables
  - Patch cables drawing on main panel
  - Full cables or cable plugs switching
  - Double inputs/double outputs support
  - Program metadata (name, author, save date, description)
  - Program category association
  - File browser on disk
  - Precise parameter value display
  - Global settings management with automatic/manual send to pro-1
  - Panel zoom with memory
  - Automatic reading of wav/aif/aac/mp3 files (macOS only)
  - Manual/automatic reading of wav/aif/aac/mp3 files (macOS only)
  - Standalone versions for pc and mac
  - VST versions for pc (32 and 64-bits)
  - VST and AU versions for mac
  - MIDI cc controller assignment for all buttons
  - LED ring buttons with visual feedback
  - ADSR rotary encoders
  - Envelope graphs handled by mouse or rotary encoders
