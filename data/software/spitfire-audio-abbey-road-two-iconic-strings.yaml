  - String quintet (violin 1, violin 2, viola, cello, double bass)
  - 2 signals: one modern mix and one vintage mix
  - Minimum 8GB RAM, 16GB recommended
  - Mac OS 11 to OS 26, Windows 10 or Windows 11 (64-bit)
