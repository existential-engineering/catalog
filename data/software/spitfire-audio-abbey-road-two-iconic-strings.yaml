details: |-
  Abbey Road Two: Iconic Strings represents something truly unique - a landmark, one-off sample library consisting of a signature string sound never before available. Captured at Abbey Road's Studio Two, the most famous recording venue in the world.

  Five of the world's best players, recorded by GRAMMY-winning engineer Sam Okell using a mouth-watering array of beautiful microphones and recording equipment from the studio's impressive collection. This is your chance to compose using the illustrious and historic Abbey Road signal path. Stunning mixes give you broadcast-level performances with groundbreaking, instant playability plus creativity and control.

  This edition of Iconic Strings covers essential playing techniques, two professionally mixed signals created with the studio's coveted signal path and some of our most expressive legatos to date.
specs: |-
