description: Spring Reverb is a reverb plugin that will add vintage character
  and grit to any audio track. An authentic spring reverb plugin that features a
  tube driver simulation with Bass and Treble in the reverb section.
details: |-
  When your mix lacks that certain something, Softube's Spring Reverb may very well be it. Spring Reverb is an authentic spring reverb recreation that will add vintage character and grit to any audio track. It also includes novel features such as a fully automatable Shake control that will shake the virtual springs around for those thunderous spring effects.

  Softube's industry-leading component modelling and physical modelling techniques mean this plug-in sounds impressively realistic. Spring Reverb features a tube driver simulation with Bass and Treble in the reverb section, and lets you control the number of springs continuously between 1 and 3, and their tension, to alter the sound.

  A spring reverb is built into a lot of classic guitar amplifiers and is consequently often used for guitars. But you wouldn't do it justice to think a reverb of this type was limited to guitars only. It can add a lot of personality and character to a vocal track, a snare drum, percussion, an electric organ or just about anything. It's very much a sound of its own and it will help set your mix apart from the rest.

  Softube included a few settings so you can choose which spring reverb character you're after. The number of springs and their tension highly affects the sound and feel, so it's up to you to determine what your track needs. There are also tube-driven Bass and Treble controls to further affect the sound.

  Ever dropped your plugged in amp by mistake? If you want that explosive boom you'll get from shaking a true spring reverb (making the springs bounce and slam into each other), you can have that too (without smacking your computer). Spring Reverb is also available as a part of Flow Mixing Suite and Flow Complete Suite.
specs: |-
  - Personality and character for your mix
  - Tension control to shape the spring character and reverb length
  - Number of spring pairs continuously adjustable from 1 to 3
  - Tube driver simulation with Bass and Treble in the reverb section
  - Shake control that shakes the springs around
  - Can be used both as a send and an insert effect
  - Very CPU friendly
  - Supports Softube Extended Features (easy-access panels with modern precision controls)
  - Modular Ready: works as a native plug-in and as a module in Modular, Softube's Eurorack platform
  - Amp Room Ready: works as a native plug-in and as a module in Amp Room, Softube's pro audio guitar platform
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26
  - System requirements: Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access (for downloading installers and managing licenses)
  - Three activations
  - 20-day trial, 14-day returns
