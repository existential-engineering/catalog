description: HoRNet TrackUtility is a small audio utility plugin containing a useful collection of tools like auto gain setting clipper and limiter.
details: |-
  TrackUtility is a versatile and indispensable audio tool designed to simplify the production workflow by offering multiple essential processors in a single, compact package. Instead of constantly switching between multiple plugins to achieve various tasks, TrackUtility consolidates all the necessary functions into one easy-to-use interface. This makes it the ideal solution for those looking to streamline their audio production process while maintaining an organized workspace. Whether you're working on individual tracks or mastering the final mix on the master bus, TrackUtility has the tools you need for efficient and high-quality audio processing.

  At its core, TrackUtility serves as a comprehensive audio utility that allows users to perform a wide variety of tasks. Common tasks that typically require multiple plugins, such as converting a stereo track to mono, removing DC offset, adjusting pan settings, and trimming audio, are all handled within this single plugin. By combining all these features into one tool, TrackUtility significantly reduces the time and effort required to complete basic audio adjustments, making it a valuable asset for both producers and engineers.

  TrackUtility is packed with a diverse set of features that cater to different stages of the audio production process: stereo to mono conversion for mixing, compatibility with different playback systems or creating space in a crowded mix; DC offset removal to clean up tracks and prevent unwanted low-frequency distortion; panning and trimming for subtle stereo image adjustments; a limiter and auto gain function that controls peak levels and automatically adjusts output to match a desired RMS level; and stereo wideness control to tweak the stereo field.

  While TrackUtility excels in everyday audio processing tasks, it also shines as a quick mastering tool. The output section offers all the features needed to finalize a track, including stereo control, limiter and auto gain. The RMS setting allows you to set a maximum loudness level for your track, ensuring it hits the appropriate target without clipping or distortion, while engaging the auto gain function automatically compensates for volume changes.

  HoRNet TrackUtility has no copy protection. A fully functional demo is available, except that it will periodically silence out, parameter values cannot be saved with the session, and the plugin will not respond to automation coming from the host.
specs: |-
  - Track muting
  - DC removal
  - Channel Selector (work on L + R or just L or R or invert L and R)
  - Phase reversal (separate for L and R channels)
  - Gain adjustment (from -60dB to +60dB)
  - Auto Gain adjustment in Peak and RMS mode
  - Pan control
  - Stereo width control
  - Output clipper
  - Output limiter with auto release time
  - Peak output meter
  - RMS output meter
  - Mac OS X (>=10.7) and Windows support
  - 64-bit compatibility both on Mac and Windows
  - Audio Units, VST2.4, VST3, RTAS and AAX format
  - Apple Silicon native support
