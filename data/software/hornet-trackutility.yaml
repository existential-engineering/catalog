description: HoRNet TrackUtility is a small audio utility plugin containing a useful collection of tools like auto gain setting clipper and limiter.
details: |-
  TrackUtility is an audio tool that simplifies the production workflow by offering multiple essential processors in a single compact package, instead of switching between several plugins to achieve various tasks. It suits work on individual tracks as well as mastering a final mix on the master bus.

  Common tasks that typically require multiple plugins are handled inside this one plugin: converting a stereo track to mono, removing DC offset, adjusting pan settings and trimming audio. Stereo to mono conversion helps a mono mix stay full and balanced without phase issues, and DC offset removal cleans up low-frequency distortion that can cause problems when mixing and mastering.

  A built-in limiter controls peak levels so the audio does not exceed the threshold and keeps a consistent volume, while the auto gain function automatically adjusts the output level to match the desired RMS level.

  A stereo wideness control tweaks the stereo field, making a track sound more expansive or more focused as the mix requires.

  As a quick mastering tool the output section provides stereo control, limiter and auto gain together: set the stereo width, set the RMS to a maximum loudness target, engage auto gain and the limiter keeps the output clean and consistent.
specs: |-
  - Track muting
  - DC removal
  - Channel selector (L+R, L only, R only, or invert L and R)
  - Phase reversal, separate for L and R channels
  - Gain adjustment from -60dB to +60dB
  - Auto gain adjustment in Peak and RMS mode
  - Pan control
  - Stereo width control
  - Output clipper
  - Output limiter with auto release time
  - Peak output meter
  - RMS output meter
  - Mac OS X (10.7 or later) and Windows support
  - 64-bit compatibility both on Mac and Windows
  - Audio Units, VST2.4, VST3, RTAS and AAX format
  - Apple Silicon native support
  - No copy protection
