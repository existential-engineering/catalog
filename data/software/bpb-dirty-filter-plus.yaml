description: BPB Dirty Filter Plus is a freeware dual filter plugin with a
  built-in compressor and four distortion modes.
details: |-
  Bpb dirty filter plus offers four different dirt algorithms: mode a (original)
  classic tube-style distortion from the original bpb dirty filter. Mode b
  (acid) a more aggressive distortion suitable for cinematic sound design. Mode
  c (dust) a mellow distortion algorithm that sounds vintage and lo-fi. Mode d
  (cyber) reduces the bit depth and sampling rate, resulting in a bitcrushed
  sound.

  The dirt knob controls the filter resonance and distortion amount. Increasing
  the dirt parameter boosts and distorts the signal around the cutoff frequency.
specs: |-
  - Dual filter plugin
  - High-pass filter
  - Low-pass filter
  - Adjustable filter slopes (12-48 dB/oct)
  - Built-in compressor
  - Transparent compressor with auto-gain
  - Four distortion modes
  - Four dirt algorithms (original, acid, dust, cyber)
  - Dirt knob for filter resonance and distortion control
  - Mix control (0-100%)
  - Output volume control (12 dB)
  - Freely resizable user interface
  - Universal 2 binary
