description: IQ-Series Transient is a transient shaper offering
  frequency-selective processing via separate Transient and Sustain EQs (up to 5
  parametric bands each), a Magic Boost feature that amplifies quiet transients
  more than loud ones, adjustable detection thresholds, and a time chart
  visualising detected transients and sustain.
details: |-
  Innovative processing of transients and sustains Transient and Sustain EQs for frequency-selective processing Magic Boost for steady transients More punch for your drums IQ-Series Transient Tutorial with sound examples https://www.youtube.com/watch?v=HoFykTQMb2s „I’ve been using this plugin since it came out. I love what it is doing to my drums!“ DJ & Produzent Zardonic (Bullet For My Valentine, Fear Factory, Sonic Syndicate) Magic Boost Magic Boost guarantees steady transients even with difficult signals. It allows you to amplify quiet transients more than loud transients. Boost Target sets the maximum gain. Transient and Sustain EQs With up to 5 fully parametric bands, you can precisely select the frequency ranges to be processed. Both EQs can be used independently and offer unique sound shaping possibilities. Thresholds With the lower and upper thresholds, you set the dynamic range in which transients are to be detected. This allows you to specifically exclude background noise and crosstalk from the transient processing. Time Chart If you want to be absolutely accurate, you can open the time chart. It shows you exactly which parts of your audio have been detected as transients or sustain and how pronounced they are. The time chart is particularly useful for setting thresholds and boost targets directly in the chart for even more precise control over the sound. Feedbacks
