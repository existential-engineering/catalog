description: IQ-Series Transient is a transient shaper offering frequency-selective processing via separate Transient and Sustain EQs (up to 5 parametric bands each), a Magic Boost feature that amplifies quiet transients more than loud ones, adjustable detection thresholds, and a time chart visualising detected transients and sustain.
details: |-
  The HOFA IQ-Series Transient is a professional transient shaper plugin that enables independent editing of attack and sustain phases across specific frequency ranges. It works on drums, percussion, bass, vocals, and other audio signals while maintaining the natural character of the sound.

  The Magic Boost feature enhances soft transients more than loud ones, creating a stable and consistent sound even with highly dynamic audio signals. Separate EQs for transients and sustain — each with up to 5 fully parametric bands — allow completely independent frequency-selective processing of both parts.

  The interactive Time Chart provides real-time visualisation with thresholds and boost targets that can be set directly with a click. Two thresholds (lower and upper) precisely define the dynamic range for transient detection and effectively eliminate crosstalk and background noise.

  The plugin also features mid/side processing, full-featured sidechaining with high- and low-pass filters, stereo and dual-mono modes, and a fully scalable GUI. A factory preset library is included covering kick, snare, tom, hi-hat, drum bus, bass, and master applications. Two licenses are included per purchase, managed via the HOFA Plugins Manager with offline activation supported. A 14-day free trial is available.
specs: |-
  - Formats: VST3, AU, AAX
  - Operating System: macOS 10.13 or later, Windows 10 or later
  - Magic Boost for consistent transient enhancement across dynamic signals
  - Separate Transient and Sustain EQs with up to 5 fully parametric bands each
  - Interactive Time Chart with adjustable thresholds and boost targets
  - Lower and upper thresholds for precise dynamic range detection
  - Mid/Side processing support
  - Stereo, dual-mono, and mid/side operation modes
  - Sidechain section with high- and low-pass filters
  - Fully scalable GUI
  - Factory preset library (kick, snare, tom, hi-hat, drum bus, bass, master)
  - Tested DAWs: Ableton Live, Apple Logic, Avid Pro Tools, Bitwig, Cockos Reaper, Image Line FL Studio, Magix Samplitude/Sequoia, Presonus Studio One, Steinberg Cubase/Nuendo/Wavelab
  - Two licenses included; managed via HOFA Plugins Manager
  - Offline activation supported
  - 14-day free trial available
