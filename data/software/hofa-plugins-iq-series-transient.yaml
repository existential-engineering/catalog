description: Give Your Productions Perfect Punch. A professional transient
  shaper plugin that allows you to edit and shape the transients (the attack of
  a sound) and sustain of an audio track, and it even works for specific
  frequencies.
details: |-
  The IQ-Series Transient is a transient shaper that lets you boost or attenuate the attack and sustain phases of a sound independently. Unlike a compressor it does not respond to a fixed threshold level, but to the envelope shape, so it works independently of the level and affects soft and loud sounds in the same way. It is aimed at drums, percussion, bass, vocals and other signals that need more punch, impact or smoothness without losing the natural character of the sound.

  Magic Boost guarantees steady transients even with difficult signals. It allows you to amplify quiet transients more than loud transients, with Boost Target setting the maximum gain. On inconsistent source material such as live-recorded drums this produces a stable, balanced sound without boosting the loud hits.

  Two independent, fully parametric EQs, each with up to 5 bands, cover the transient phase and the sustain phase separately. You can precisely select the frequency ranges to be processed, for example boosting only the attack of a snare in specific frequency ranges while attenuating the decay phase in others. This frequency-selective processing goes beyond simple two-knob attack/sustain transient shapers.

  Lower and upper thresholds set the dynamic range in which transients are detected, which lets you exclude background noise, crosstalk or interference from the transient processing. With a snare drum microphone, for example, only the actual snare hits are processed and not the quieter hi-hat crosstalk.

  The time chart shows exactly which parts of the audio have been detected as transients or sustain and how pronounced they are, and thresholds and boost targets can be set directly in the chart. The plugin also offers stereo, dual-mono and mid/side modes, a dedicated sidechain section with high- and low-pass filters, an extensive factory preset library with user preset folders and favourites, and a fully scalable GUI.
specs: |-
  - Separate fully parametric EQs with up to 5 bands each for the transient and sustain phases
  - Magic Boost amplifies quiet transients more than loud ones, with adjustable Boost Target
  - Lower and upper thresholds define the dynamic range for transient detection
  - Interactive time chart visualising detected transients and sustain, with click-set thresholds and boost targets
  - Stereo, dual-mono and mid/side processing modes
  - Dedicated sidechain section with high- and low-pass filters
  - Extensive factory preset library, plus user presets in folder structures with favourites and search
  - Fully scalable GUI
  - Operating system: macOS 10.13 or later, Windows 10 or later
  - Two licenses per purchase, managed via the HOFA Plugins Manager, with offline and USB stick activation
  - Continuously tested on Ableton Live, Apple Logic, Avid Pro Tools, Bitwig, Cockos Reaper, Image Line FL Studio, Magix Samplitude/Sequoia, Fender Studio Pro, Steinberg Cubase/Nuendo/Wavelab
