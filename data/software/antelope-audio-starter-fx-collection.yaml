description: "10 analog-modeled audio plugins for tracking, mixing and
  mastering. Includes vintage preamps, compression, EQ, de-essing, reverb, delay
  and modulation, native in your DAW."
details: |-
  The Starter FX Collection (also called the Starter Pack) bundles 10 Antelope Audio plugins designed to cover tracking, mixing, mastering, and creative coloring for studio projects. The collection focuses on professional-grade, analog-modeled processing that adds new life to any production.

  The plugins run natively in a DAW on macOS or Windows, or in real-time on an Antelope Audio Synergy Core interface for low-latency tracking and monitoring. Three of the included plugins (X902, SonaVerb, and Halo) are Native only.

  Modeled emulations cover a vintage German tube microphone preamp (VPA76, based on the V76), the Fairchild 670 tube compressor/limiter (Tubechild670), a British 4K series console channel strip compressor (COMP-4K-STRIP), and a vintage console channel strip EQ (BAE-1084). The bundle also includes the Reel-To-Reel tape saturation plugin built from Antelope founder Igor Levin's decades of work with tape machines.

  Creative and modulation tools include the BBD-Chorus inspired by the Boss CE-1 Chorus/Vibrato pedal, the Vari-Speed Tremolo modulation effect, the SonaVerb reverb, and the Halo next-gen multitap delay. The X902 de-esser, modeled after a 1980s VCA de-esser module, rounds out the vocal processing options.

  All 75+ Antelope Native plugins can also be unlocked via an Antelope Cosmos subscription, with the Starter FX Collection available as a one-time purchase bundle for users who prefer a perpetual license starter set.
specs: |-
  - 10 analog-modeled audio plugins in one bundle
  - Runs natively in a DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core interfaces
  - Includes preamp, compressor, EQ, tape, channel-strip, de-esser, reverb, delay, chorus and tremolo plugins
  - Three plugins are Native only: X902, SonaVerb, Halo
  - Bundled plugins: VPA76, Tubechild670, Reel-To-Reel, COMP-4K-STRIP, BAE-1084, X902, SonaVerb, Halo, BBD-Chorus, Vari-Speed Tremolo
