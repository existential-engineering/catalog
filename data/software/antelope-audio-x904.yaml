details: |-
  The X904 Noise Gate is more than just a cleanup tool – it's a dynamic processor built for engineers who want tight, responsive control over signal flow and transients. With fast detection, advanced envelope shaping, and creative options like sidechaining and PLM (Programmed Latch Mode), X904 adapts seamlessly to technical tasks and creative workflows alike.

  Eliminate mic bleed, background noise, and unwanted artifacts with precision. Perfect for drums, vocals, guitars, and more—without cutting into the core of the sound.

  Keep tracks fully muted until a defined trigger opens the gate. Ideal for suppressing ambient noise between phrases or building custom automation-style gating behavior.

  Trigger the gate with an external source for pulsing, ducking, or rhythmic stutter effects. Great for modern production styles or surgical frequency management.
