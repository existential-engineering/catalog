details: |-
  Amp Room Metal Suite is everything you need for epically heavy productions. Key pieces of kit include the Vildsint 50W 6L6, the Higain 100W 6L6, the American Mainstayer 100W, and the Marshall JCM800 Lead Series amps, with pedals, cabinets, and effects to round out this robust and raucous collection.

  An Amp Room suite stacked with cabs, pedals, effects, and amps with names like Marshall, Vildsint, Higain and American Mainstayer. It includes the Amp Room platform, four amps, six cabs, ten stompboxes, 12 effects and utilities, microphone options, presets, and more, featuring cabinet IR captures with moveable microphones, plus a parametric equalizer for added tone shaping.

  Suite Mode is an intuitive workflow with hand-selected sets of gear that let you quickly get the sounds you want with Metal Suite. You have easy access to your amps and cabs, as well as the pedal and effects sections. If you want to go further into tone shaping, you can switch to Studio Mode.

  The classic Marshall JCM800 fully embodies the essence of the Marshall tone, with a Master Volume that allows for advanced tone sculpting. Vildsint 50W 6L6 is a wild yet versatile modern high-gain guitar amp whose three channels and two built-in boosts suit downtuned guitars. The German Higain 100W 6L6 packs mid-frequency punch with smooth-to-aggressive distortion and excels at palm-muting. The American Mainstayer 100W offers two channels, one for crunchy hard rock tones and one tweaked to the demands of high-gain metal.

  Amplifiers is your go-to when you just need quick tones. It is lighter on resources, faster to load, and simpler to use, so it lets you focus on your playing and the song you are recording. Included with every Amp Room Suite, Amplifiers supports all Amp Room amps and cabs. Amp Room Metal Suite is also available as part of Flow Mixing Suite and Flow Complete Suite.
