details: |-
  The multiband compressor is the latest implementation of Harrison's renowned
  multiband compression algorithm, as used in ultra high-end post & film
  facilities worldwide.

  Now in the fourth generation, the harrison multiband compression algorithm has
  been continuously tweaked by our customers in high-end music, film, broadcast,
  and video-post production.

  Notable features: intelligent algorithm requires minimal effort to get
  excellent results. Sidechain key input with dedicated sidechain eq. Rta
  analyzer display helps the user locate problem frequency ranges. Multi-channel
  linking capable for surround (on supported AAX, AU, vst3 hosts). Auto-solo
  features help dial-in the desired frequency ranges while making changes.
  No-latency processing: suitable for live use. Expand mode provides an
  additional creative effect.

  Multi-band compressor by harrison is a virtual effect audio plugin for macos,
  windows and linux.
specs: |-
  - Multi-channel linking capable for surround
  - No-latency processing
  - Sidechain key input with dedicated sidechain EQ
  - Rta analyzer display
  - Auto-solo features
  - Expand mode
  - Universal 2 binary
