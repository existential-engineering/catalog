description: A dynamic resonance suppressor optimized for live audio that identifies problematic resonances and applies matching reduction in real-time. Features low latency processing (64 samples algorithm latency, ~1ms roundtrip on S6L), sidechain functionality for addressing bleed, and a touch screen-optimized interface with gesture support.
details: |-
  soothe live is a dynamic resonance suppressor optimized for live audio. It adapts the technology behind soothe and soothe2 for live use, and is designed for the Avid VENUE | S6L console and the Fourier Audio transform.engine plug-in host, where it identifies problematic resonances and applies matching reduction in real time.

  It removes harshness from any sound source without notching out frequencies by hand, clears muddiness, boominess and proximity effect, and reduces cymbal bleed via its sidechain. The reduction follows resonant frequencies, acting when and where it is needed. Typical dynamic equalizers suit consistent inputs, while live inputs change from night to night, so soothe live is built around that variability.

  Built from scratch for the live environment, it has a latency of only 64 samples on both platforms. On the S6L the resulting roundtrip latency is less than 1 ms, or 95 samples. The optimized processing removes harshness throughout the frequency spectrum while using minimal resources, allowing up to 54 mono or 36 stereo instances on a single 18-core HDX card.

  The interface is optimized for live sound, with parameters designed for live mixing and mapped to favor useful settings and common use cases. It can be driven with knobs on the control surface, a mouse, or a touch screen with gestures. The depth knob increases processing and is reflected in the reduction graph for instant feedback, EQ nodes select which frequency areas to target so processing is more sensitive to boosted frequencies, the speed knob combines attack and release into a mapped dial with golden zones for different sound sources, and the detail knob adjusts between sharp cuts for narrow resonances and broad reduction for general tone shaping.

  It works on individual channels and busses alike, combating resonances and uneven tonal balance across the frequency spectrum, evening out low-mid frequencies or taming bright instruments. The sidechain input tames bleed from other instruments, such as cymbal bleed in a vocal mic, or carves out space for vocals in a crowded mix while leaving the rest of the frequency spectrum intact.
specs: |-
  - Available for Avid VENUE S6L and Fourier Audio transform.engine
  - 96 kHz, 88.2 kHz, 48 kHz, and 44.1 kHz
  - Algorithm latency of 0.66 ms at 96 kHz
  - Roundtrip latency ~1.0 ms on Avid S6L
  - Can run 54 mono or 36 stereo instances on a single 18-core HDX card
  - Full frequency range operation
  - Sidechain feature
  - Touch screen optimized with touch gestures
  - Latency of 64 samples on both platforms (95 samples roundtrip on S6L)
  - Requires an iLok user ID
  - Requires Avid VENUE version 7.1.1 or later on the S6L
