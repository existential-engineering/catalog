description: "A dynamic resonance suppressor optimized for live audio that
  identifies problematic resonances and applies matching reduction in real-time.
  Features low latency processing (64 samples algorithm latency, ~1ms roundtrip
  on S6L), sidechain functionality for addressing bleed, and a touch
  screen-optimized interface with gesture support."
