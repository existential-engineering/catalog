details: |-
  Blue cat's Liny EQ is an 8 bands linear phase equalizer with very low latency
  and comprehensive visual feedback: thanks to its highly optimized linear phase
  kernel, it processes the signal without phase distortion, with an unusually
  short latency (less than 3 milliseconds).

  Its wide range of gain (±40db) and multiple filter shapes make it very
  flexible for a graphic eq, letting you create unique eq curves.

  The dual channels version offers independent settings for the left/right or
  mid/side channels, with flexible linking capabilities for an optimal workflow.

  The highly customizable user interface includes a first class spectrum
  analyzer and spectrogram viewer. It lets you choose the best layout and
  display options to adapt the plug-in to your own workflow.

  Thanks to its ability to update the eq curve continuously using MIDI or
  automation and its additional "mix" control, dynamic equalization tasks can be
  performed easily when used together with any of blue cat audio's control
  generation plug-ins.
