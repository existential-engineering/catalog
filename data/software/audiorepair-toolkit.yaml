details: |-
  Sonic Studio art for the apple mac combines incredible productivity with all
  the audio restoration tools you need into one affordable, standalone software
  package.

  Restore even the most heavily-damaged audio in a simple, intuitive user
  interface. Remove ticks, clicks, distortion, hiss, hum and even coughs, chair
  squeaks or other spurious noises.

  Record in stereo or mono up to 192 khz. Export multiple songs in a variety of
  file formats, sample rates and bit depths.

  Full broadcast wav metadata support including isrc.

  Concise editing -- top/tail, crossfade, copy/paste.
specs: |-
  - Audio restoration
  - Tick and click removal
  - Distortion removal
  - Hiss removal
  - Hum removal
  - Noise removal
  - Stereo recording up to 192 kHz
  - Mono recording up to 192 kHz
  - Broadcast wav metadata support
  - Isrc support
  - Multiple file format export
  - Variable sample rate export
  - Variable bit depth export
  - Top/tail editing
  - Crossfade editing
  - Copy/paste editing
  - macOS compatible
  - Apple macintosh intel 2.6 GHz minimum
  - 4 GB RAM minimum
  - Os 10.6.8 or newer
  - USB port for ilok smart key optional
  - Series 300 dsp I/O processor compatible
  - Firewire core audio interface compatible
