details: |-
  Bad Speaker makes it easy to add spice to your productions with three
  distinctive speaker flavors. Play with the portable radio, cassette deck, and
  hi-fi speaker modes. Experiment with various amounts of gritty distortion with
  the simple drive control.

  Get the overdriven speaker distortion you would expect from lo-fi speakers
  without needing to tweak parameters. Bad speaker offers three selectable
  speaker modes that take you from toy speaker to high-end monitor. In portable
  radio you get the worst lo-fi speaker we could find. Cassette deck gives you
  the '80s boombox at its best with a tight bass and a snarly mid-range bite.
  Hi-fi speaker is a great-sounding speaker in a room and a perfect jumping-off
  point for sonic excursions.

  Bad speaker features a streamlined selection of sliders so you can play and
  stay in your creative flow. Exaggerate the gritty distortion of the speaker
  modes with the drive slider. Use the stereo slider to make your track sound
  wider or bring more power and focus by concentrating your sound in the center.
  With the tone slider, you can easily tilt from lighter with more treble to a
  heavier bass sound.

  Bad speaker is a virtual effect audio plugin for macos and windows. It
  functions as a VST plugin, an audio units plugin, a VST 3 plugin and an AAX
  plugin.
