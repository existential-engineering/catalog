description: Get instant lo-fi vibes or the inspiration to explore! The Softube
  Bad Speaker effects plugin adds spice to your music productions with three
  unique speaker sounds. Test out different types of sound design, experiment
  with an easy-to-use distortion plugin, and have too much fun doing it.
details: |-
  Load up an instant lo-fi vibe or let nostalgic design and uncommon sounds inspire you to creatively break bad. Bad Speaker makes it easy to add spice to your productions with three distinctive speaker flavors. Play with the Portable Radio, Cassette Deck, and Hi-Fi Speaker modes. Experiment with various amounts of gritty distortion with the simple drive control. Or test out different types of sound design. No matter how you use it, Bad Speaker proves why it's so fun to be bad.

  Three selectable speakers: get the overdriven speaker distortion you would expect from lo-fi speakers without needing to tweak parameters. Bad Speaker offers three selectable speaker modes that take you from toy speaker to high-end monitor.

  In Portable Radio you get the worst lo-fi speaker Softube could find. Have fun driving it hard and watching it crumble. Cassette Deck gives you the '80s boombox at its best with a tight bass and a snarly mid-range bite. Hi-Fi Speaker is a great-sounding speaker in a room and a perfect jumping-off point for sonic excursions.

  Slide into experimentation: Bad Speaker features a streamlined selection of sliders so you can play and stay in your creative flow. Exaggerate the gritty distortion of the speaker modes with the Drive slider. Use the stereo slider to make your track sound wider or bring more power and focus by concentrating your sound in the center. With the Tone slider, you can easily tilt from lighter with more treble to a heavier bass sound. Bad Speaker's Extended Features are great for further distortion exploration as you can set the headroom and meter the changes in level.

  Bad Speaker for Console 1 and Amp Room: you can add Bad Speaker in the shape and the drive section of Console 1 Mixing System. It's also available for Softube Amp Room, the pro audio guitar and bass platform. Add it as a pre- or post-effect in Amp Room Suite mode or add it anywhere in the signal chain when in Studio mode.
specs: |-
  - Unique lo-fi speaker sounds perfect for sound design and experimentation
  - From the makers of Tape, Dirty Tape, Wasted Space, Harmonics, and Saturation Knob
  - Instantly apply distinctive character and dirt to your tracks
  - Three speaker modes: Portable Radio, Cassette Deck, and Hi-fi Speaker
  - Easy-to-use with a careful selection of modes and sliders
  - Featuring a single Drive slider to exaggerate distortion
  - Featuring a width slider to go from mono to stereo
  - Tone slider tilts from lighter with more treble to a heavier bass sound
  - Get even more control over the dynamics with Softube Extended Features
  - Available in the shape and drive sections of Console 1 Mixing System
  - Available in Softube Amp Room as a pre- or post-effect in Suite mode, or anywhere in the chain in Studio mode
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Three activations
  - 20-day trial
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
