description: Free saturation and distortion plugin capable of very soft and subtle saturation suitable for master bus use, as well as dense and dirty distortion effects for individual tracks. Base sound resembles the DESK mode of SDRR. Features dynamic signal response, stereo crosstalk modeling, controlled randomness for liveliness, ASYM MIX control for signal symmetry, and RESPONSE control for frequency-dependent saturation. Calibrated to 0VU = -18dBFS.
details: |-
  IVGI can deliver very soft and subtle saturation that feels at home on the master buss. It is equally capable of very dense and dirty distortion effects to spice up single tracks. IVGI's base sound is comparable to the DESK mode in the big brother SDRR.

  Just as SDRR, IVGI reacts dynamically to the input signal. Even the modeled fluctuations react dynamically and also change depending on the drive setting, so that it doesn't get in the way of the sound. Stereo tracks benefit from its modeled crosstalk behavior.

  IVGI features Controlled Randomness, which determines the internal drift and variance inside the unit. It contributes to the liveliness and realness of IVGI's saturation character. To achieve this, all internal processes are modulated to some extent.

  IVGI gives you a sensible amount of controls to manipulate the character of the saturation itself. It offers a unique ASYM MIX knob to alter the symmetry of the signal without affecting the harmonic content much. IVGI also allows for altering the frequency dependency of the saturation with the RESPONSE control.

  IVGI is internally calibrated to 0VU = -18dBFS and is freeware.
specs: |-
  - Internal calibration: 0VU = -18dBFS
  - Dynamic reaction to input signal
  - Modeled fluctuations that react dynamically based on drive setting
  - Modeled stereo crosstalk behavior
  - Controlled Randomness for internal drift and variance
  - ASYM MIX knob to alter signal symmetry without affecting harmonic content
  - RESPONSE control for frequency-dependent saturation adjustment
  - No copy protection
