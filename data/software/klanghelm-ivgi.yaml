description: "Free saturation and distortion plugin capable of very soft and
  subtle saturation suitable for master bus use, as well as dense and dirty
  distortion effects for individual tracks. Base sound resembles the DESK mode
  of SDRR. Features dynamic signal response, stereo crosstalk modeling,
  controlled randomness for liveliness, ASYM MIX control for signal symmetry,
  and RESPONSE control for frequency-dependent saturation. Calibrated to 0VU =
  -18dBFS."
details: |-
  Dynamic response to input signals
  Stereo crosstalk modeling
  Controlled randomness creating drift and variance
  ASYM MIX control for signal symmetry alteration
  RESPONSE control for frequency-dependent saturation
  Internal calibration: 0VU = -18dBFS
  Soft subtle saturation to dense dirty distortion range

  2.5.0
