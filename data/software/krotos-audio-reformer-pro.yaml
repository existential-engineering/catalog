description: "Perform sound effects without a Foley pit. Use the presets or
  import your own sounds. Turn your own sounds into a digital Foley stage."
details: |-
  Microphone-driven real-time Foley performance. Analysis Tool for custom audio import. MIDI controller support. Continuous Mode for evolving textures. Transient Engine for impact creation. Frequency and amplitude scanning. AudioSuite rendering for Pro Tools. Includes 1,285 sounds across 29 libraries (2.98 GB). 30+ pre-built Foley libraries covering cloth, animals, impacts, and more. Apple Silicon native support. iLok account required. 10-day free trial available.
specs: |-
  Mac: macOS 10.13+, Apple Silicon native support. Windows: 10 64-bit+. CPU: 2.4 GHz minimum. RAM: 4 GB minimum. Sample rates: 44.1 kHz to 192 kHz. 64-bit only. Supported DAWs: Pro Tools 10.3.5+, Logic Pro X, Nuendo 7+, Cubase 8+, Ableton Live 9+, Reaper.
