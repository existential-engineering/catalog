description: Perform your own Foley sound effects in real time directly inside your DAW. Reformer Pro lets you control sound libraries with a microphone, audio input, MIDI controller, or Dynamic Input mode, with no microphone required. Features an Analysis Tool for importing custom audio, a Transient Engine for impact creation, Continuous Mode for evolving textures and drones, and AudioSuite support. Ships with 2.98 GB of factory content across 29 libraries and 1,285 sounds.
details: |-
  Used by audio professionals to perform realistic Foley from within your DAW, Reformer Pro saves hours of tedious cut, drag and drop editing. Replace any audio input in real time and add responsive Foley to a scene in minutes.

  Turn your sound libraries into performable sound instruments. Use a microphone or any pre-recorded audio to control your libraries in real time, add variation quickly and easily, and rapidly sync to picture. The Analysis Tool lets you analyse your own libraries for use in Reformer Pro: drag and drop folders of audio files into the tool, analyse at the sample rate of your choice, and perform your own sounds.

  Dynamic Input lets you perform without a microphone or any audio input, automating and exploring your libraries directly from the plugin UI and scanning through any library by frequency or amplitude. MIDI performance is also supported, using any MIDI controller with velocity and pitch for expression.

  Continuous Mode creates instant evolving drones, ambiences and textures, avoiding repetitive backgrounds, and renders directly to the timeline with AudioSuite in Pro Tools. The Transient Engine automatically identifies transient sections of any audio material, so you can add extra transients and dynamics to any signal, trigger transients directly via velocity-sensitive MIDI, and use variation controls to avoid repetition.

  Reformer Pro ships with a full collection of over 2 GB of high quality and versatile sounds covering common sound design use cases, recorded by the Krotos team. Included libraries cover Air Vent, Bengal Tiger, Black Leopard, Bonfire, Bubble Wrap, Concrete Foot Slides, Debris Pebbles, Debris Rock Dust, Electrical Sparks, Electromagnetic Pickup, Electronic Pro, Fire Gestures Windy, Fruit and Veg, Glass Foley, Grass Rustling, Gun Foley, Ice Debris, Jacket Foley, Leather Foley, Plate Armour, Polystyrene, Shoes On Leaves and Twigs, Sizzle, Snow Debris, Water Splashing and Waterproofs Foley. Projects that use Reformer Pro include Stranger Things 2, Game of Thrones, Cyberpunk 2077, The Lion King and Captain Marvel.
specs: |-
  - 1,285 sounds across 29 libraries, 2.98 GB of assets
  - Formats (64-bit only): AAX Native/AudioSuite, VST, VST3, AU
  - macOS 10.13 or above, or Windows 10 64-bit or above
  - Native Apple Silicon support
  - Minimum 2.4 GHz CPU, 4 GB RAM
  - Minimum sample rate 44.1 kHz, maximum 192 kHz
  - RTAS is not supported
  - iLok account required to activate
  - iLok 2 or later required for dongle use
  - Supported hosts: Pro Tools 10.3.5+, Reaper, Logic Pro X, Nuendo 7+, Cubase 8+, Ableton Live 9+
  - 10-day fully functional free trial
