description: Perform your own Foley sound effects in real time directly inside your DAW. Reformer Pro lets you control sound libraries with a microphone, audio input, MIDI controller, or Dynamic Input mode — no microphone required. Features an Analysis Tool for importing custom audio, a Transient Engine for impact creation, Continuous Mode for evolving textures and drones, and AudioSuite support. Ships with 2.98 GB of factory content across 29 libraries and 1,285 sounds.
details: |-
  Real-time microphone/audio input control of sound libraries. Analysis Tool for importing custom audio files. Dynamic Input mode (no microphone needed). MIDI controller support. Continuous Mode for evolving textures and drones. Transient Engine for impact sounds. AudioSuite support for offline Pro Tools rendering. Native Apple Silicon support. Factory content: 29 libraries, 1,285 sounds including Air Vent, Bengal Tiger, Black Leopard, Bonfire, Bubble Wrap, Concrete Foot Slides, Electrical Sparks, Glass Foley, Grass Rustling, Gun Foley, Ice Debris, Jacket Foley, Leather Foley, Plate Armour, Shoes On Leaves, Snow Debris, Water Splashing. 10-day free trial. iLok account required. Used in: Stranger Things 2, Game of Thrones, Frozen 2, Cyberpunk 2077, The Lion King, Captain Marvel, Alita: Battle Angel.
specs: |-
  macOS 10.13+, Windows 10 64-bit+. AAX Native/AudioSuite, VST, VST3, AU (64-bit only). Native Apple Silicon support. Sample rates: 44.1–192 kHz. Min CPU: 2.4 GHz. Min RAM: 4 GB. iLok account required. Perpetual license.
