details: >-
  Ai-90 keys is a deeply sampled late 80s early 90s virtual piano module
  library. We have used korg m-series and 0w-series modules digital pianos (p3
  and 03r/w) to capture the essence of many sound productions of the 1990s era.


  We decided to cover a 76 keyboard range to have a precise and expressive
  presentation of the original sounds. We have sampled every key in 4-5 to 12
  velocity layers in some occasions.


  A small number of pads of various types also have been added, to help the
  creation of multi set-ups or other atmospheric sounds. In the included presets
  can be found sounds such as digital rompler acoustic pianos, electric tine
  pianos and a few strings / pads.


  There are included 3228 waveforms at 48khz 24-bit. (17,2 gb uncompressed 9,45
  gb of total size after ncw compression).
specs: |-
  - Kontakt 5.6.8 (full version required)
  - 76 keyboard range
  - 4-5 to 12 velocity layers
  - 3228 waveforms at 48khz 24-bit
  - 36 snapshots
  - 8 gb ram recommended
  - Ssd drive recommended
