details: |-
  Add brilliance and colour to your themes with this set of masterful performances captured in Abbey Road's legendary Studio One.

  Featuring London's first-call session players, Vibrant Reeds offers dazzling oboes and clarinets as well as the evocative pairing of oboes and cor anglais, a classic cinematic sound heard on countless scores. With essential and unique techniques such as longs, staccatos, mordents, and Spitfire's new easy-to-use legato patches, you have everything you need to create scores ready for the big screen.

  Vibrant Reeds is available to purchase as a stand-alone library or as a powerful addition to Abbey Road One: Orchestral Foundations .
specs: |-
  - Two oboes and two clarinets, plus a pairing of two oboes with cor anglais
  - 10 articulations: Legato, Long, Staccato, Vibrant Legato, Vibrant Long, Vibrant Staccato, Mordent Min 2nd, Mordent Maj 2nd, Mordent Min 3rd, Mordent Maj 3rd
  - 2 mixes
  - 10 mic signals: Vintage 1, Vintage 2, Pop Close, Pop Room, Close, Tree 1, Tree 2, Ambient, Outriggers, Spill
  - 7.5 GB download size
  - macOS 11 to OS 26, Intel and Apple Silicon supported
  - Windows 10 or 11 (64-bit)
  - Minimum 8GB RAM, 16GB recommended
  - Spitfire Audio App required for installation
