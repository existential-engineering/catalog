name: Bandoneon
manufacturer: psound
primaryCategory: synthesizer
url: https://www.psound.it/bandoneon.html
description: Bandoneon consists of a philological reproduction of an historic
  alfred arnold Bandoneon made in Germany in the '50s.
details: |-
  The bandoneon chosen for sampling is an historic alfred arnold of the 1950s.
  40 keys on the right hand, 32 notes in left hand.

  Preset 1: full range. The "full range" preset consists of both left and right
  hands notes mixed, it allows you to have a 56 notes (from f2 to c7). Preset 2:
  left hand. The "left hand" preset implements the left hand keys of the
  bandoneon, with 32 notes (from g3 to c7). Preset 3: right hand. The "right
  hand" preset implements the right hand keys, with 36 notes (from f2 to c5).

  Bandoneon by psound is a virtual instrument audio plugin and soundware
  (samples or presets that load into other products) for macos and windows. It
  includes, and is therefore "powered by", uvi workstation, which functions as a
  VST plugin, an audio units plugin, a VST 3 plugin and an AAX plugin.

  All samples are perfectly looped. Adjustable volume for reeds and noise.
  Powered by uvi engine xt. Requires uvi workstation v2.5.6 or later. Uvi.net
  provides uvi workstation for free. Uvi falcon full compatibility. Playable by
  motu machfive too (requires v3.2.1). Pace protection system (free ilok account
  required).
specs: |-
  - 440 samples
  - 1 GB storage
  - 96 kHz sample rate
  - 24-bit resolution
  - 4 velocity layers
  - 2 round robin per layer
  - Key-on and key-off noises
  - Adjustable volume for reeds and noise
  - Right hand and left hand presets
  - Powered by uvi engine xt
  - Requires uvi workstation v2.5.6 or later
  - Uvi falcon full compatibility
  - Playable by motu machfive (requires v3.2.1)
  - Pace protection system (free ilok account required)
  - 40 keys on the right hand
  - 32 notes in left hand
  - Full range preset (56 notes from f2 to c7)
  - Left hand preset (32 notes from g3 to c7)
  - Right hand preset (36 notes from f2 to c5)
