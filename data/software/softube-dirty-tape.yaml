details: |-
  From the Swedish distortion masters and makers of the acclaimed Tape, Tape Echoes, Harmonics, and Saturation Knob plug-ins comes Dirty Tape. The tape effect you need when you want to get down and dirty and keep the sound quality savage. Dirty Tape gives you warm, analog vibes from the moment you load it on a track. Capable of fiercely gritty distortion and saturation, Dirty Tape can also add subtle texture and movement to a sound. Like a photo filter for your tracks, Dirty Tape will take you from static and dull to lively and colorful in a snap.

  With two knobs to regulate all the effects it produces, Dirty Tape makes it simple to add lo-fi, vintage vibes to your mix. The Dirt and Drive controls, based on the Dirt and Drive sections of Softube Tape Echoes, are precision-tuned to dial in the ideal amount of the intended effect. From retro distortion, saturation, and degradation to tape speed variations like pitch modulation, crosstalk, and stereo imbalance to flutter, dropouts, and wow. Dirty Tape delivers it all, with ease.

  Set the Stereo Mode to Normal or use it De-coupled (dual mono) to have a greater effect on the balance of your stereo image. Adjust the Low Cut Filter to reduce low-end rumble and increase the lo-fi vibes. Dirty Tape's parameters let you transform the character of a sound to your taste, from nuanced to in-your-face and every rendition in between.

  Programmed drum loop sounding too clean? Piano loop too hi-fi for your hip-hop vibe? All the components of your beat will sit right in your mix with the perfect amount of warm saturation from Dirty Tape. It lets you add movement, musicality, and a hip lo-fi mood to your beat-making process.

  Dirty Tape is built on Softube's legacy of creativity, passion, and attention to detail, alongside partnerships with premium brands like Marshall, Tube-Tech, Chandler Limited and Empirical Labs going back nearly twenty years.
specs: |-
  - A tape dirt machine effect with Softube-quality sound
  - Realistic tape FX perfect for samples, instruments, and beat making
  - Add warm, low fidelity vibes to any sample, instrument, or beat
  - From the makers of Tape, Tape Echoes, Harmonics, and Saturation Knob
  - Instantly apply warm, vintage lo-fi mojo to your tracks
  - Easy-to-use with just two knobs to control all the effects
  - Derived from Softube Tape Echoes' Dirt and Drive sections
  - Go super-distorted and saturated or add subtle texture
  - Featuring effects that range from random pitch modulation to flutter, wow, and dropouts
  - Work in Normal Stereo or use De-coupled mode (dual mono) to further affect the balance of your stereo image
  - Use the Low Cut Filter to reduce low-end rumble and increases lo-fi vibes
  - Get even more control over the dynamics with Softube Extended Features
  - Also available as a part of Flow Mixing Suite and Flow Complete Suite
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires internet access for downloading installers and managing licenses
  - Three activations, 20-day trial, 14-day returns
