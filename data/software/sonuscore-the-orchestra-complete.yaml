description: In a revolutionary all-in-one orchestra VST, the sound of a symphonic orchestra is at your fingertips. Immediately playable and surprisingly simple, it combines magnificent orchestral recordings with visionary technology that transforms simple chords into full orchestrations in real-time.
details: |-
  THE ORCHESTRA COMPLETE 4 is a fully-featured virtual orchestra for modern composers, offering what is needed to create cinematic, emotional and powerful orchestral music quickly. Whether each part is written by hand or inspiration strikes with just a few chords, it adapts to the composer's style by joining orchestral recordings with an ensemble engine, and every instrument is also playable individually with a large collection of articulations and performance options.

  At its core is the Ensemble Engine, which turns simple chords into rich, fully orchestrated arrangements in real time with no pre-recorded phrases. Short notes can be arranged with up to 3 independent arpeggiators and the Sequence Designer, sustained notes shaped with up to 2 velocity envelopes, and orchestral Voicings assign which instrument plays which note of the chord, with over 100 pre-arranged voicings available. Patterns and arrangements generated by the engine can be exported to separate MIDI tracks in a DAW.

  The fourth version adds keyswitch variations, so a preset can hold up to four distinct musical ideas or cue sections (intro, main A, main B, outro) switchable on the fly, along with over 150 new cue-based presets built around that system and the new Add8va feature, which adds an octave above any slot's material. Pure Performance Legato distinguishes fast true legato from staccato runs without keyswitches, fitting more than 400 transitions per instrument into the intervals.

  The library covers a full 80-piece orchestra of strings, brass, woodwinds and percussion, plus bonus instruments including harp, grand piano, glockenspiel, cembalo, celesta, church organ, choir and orchestral effects. It bundles the FORCES OF FURY, WOODS OF THE WILD, HORNS OF HELL and STRINGS OF WINTER expansions for The Orchestra engine, and presets are browsable by library, category, instrumentation, meter and mood.
specs: |-
  - Works with the FREE KONTAKT PLAYER
  - Requires KONTAKT version 7.10.7 or higher
  - Apple Silicon Macs: macOS 12, 13 or 14 (latest update)
  - Intel Macs (i5 or higher): macOS 12, 13 or 14 (latest update)
  - Windows 10 or 11 (latest Service Pack), Intel Core i5 or equivalent CPU, 2 GB RAM
  - Graphics hardware support for OpenGL 2.1 or higher and Direct 3D 11.1
  - 4 GB RAM (more recommended)
  - At least 30 GB of free hard disc space; over 30 GB of data
  - Over 1,150 arrangements and over 1,000 hand-made presets in 3 categories (Orchestral Voicings, Orchestral Rhythms, Animated Orchestra)
  - 825 ready-to-go ensemble presets and 424 Multi-Rack patches
  - Over 300 single instruments / articulations, including a full 80-piece orchestra
  - Includes the FORCES OF FURY, WOODS OF THE WILD, HORNS OF HELL and STRINGS OF WINTER expansions
  - Keyswitch variations: up to 4 distinct musical ideas or cue sections per preset
  - 150 new cue-based presets structured with musical sections (intro, mainA, mainB, outro)
  - Add 8va feature adds an octave above any slot's material
  - True legato interval sampling with Pure Performance Legato, over 400 transitions per instrument
  - Sequence Designer and up to 3 arpeggiators per module; up to 2 velocity envelopes for sustains
  - Over 100 pre-arranged orchestral Voicings
  - MIDI export of engine-generated patterns and arrangements
