description: In a revolutionary all-in-one orchestra VST, the sound of a symphonic orchestra is at your fingertips. Immediately playable and surprisingly simple, it combines magnificent orchestral recordings with visionary technology that transforms simple chords into full orchestrations in real-time.
specs: |-
  - 1,150+ arrangements across multiple categories
  - 300+ single instruments/articulations including full 80-piece orchestra
  - Keyswitch variations supporting up to 4 distinct musical ideas per preset
  - 150 new cue-based presets structured with musical sections
  - Add 8va feature for octave enrichment
  - Pure Performance Legato technology
  - MIDI export capability
  - Ensemble Multi patches for layered orchestration
  - Sequence designer for custom musical patterns
  - Includes expansions: Forces of Fury, Woods of the Wild, Horns of Hell, Strings of Winter
  - Requires Kontakt Player (FREE) version 7.10.7 or higher
  - macOS 12, 13, or 14 (Apple Silicon or Intel i5+)
  - Windows 10 or 11 (Intel i5+)
  - RAM: 4 GB minimum
  - Storage: 30 GB+ free space
  - Graphics: OpenGL 2.1+ or Direct3D 11.1
