details: |-
  TAL-Bitcrusher is a new version of the deprecated TAL-Bitcrusher plugin from Togu Audio Line. It retains the classic crunchy bitcrusher character that shaped many records while introducing minor improvements over the original. Note that presets are not compatible with the old version.

  The plugin features a revised sample rate parameter with more practical scaling, allowing for better adjustments within the most useful sample rate ranges. This makes dialing in lo-fi textures more intuitive and precise compared to the previous version.

  Available as VST, VST3, AU, AAX, and CLAP formats, TAL-Bitcrusher supports all major plugin hosts on Windows, macOS, and Linux. macOS builds are Universal Binary 2 with native support for both Intel and Apple Silicon (M1, M2, M3 and later).
