details: |-
  The Bell Lyre is a small two octave glockenspiel. Designed to be light and
  portable, some are built in the shape of a lyre and are played upright
  supported by a strap around the musician's waist. The instrument in this
  library is known as a flatbed Bell Lyre and can be supported by a special
  shoulder mounting when played during a performance.

  We recorded several sample sets for the instrument using three different
  mallets: soft rubber, hard rubber, and plastic. We also recorded some true
  legato transition samples enabling you to perform realistic glissandi. Nearly
  every patch is sampled chromatically with recorded repetitions (round robin)
  and recorded dynamic levels.

  We made use of velocity scaling and elegantly edited and processed the samples
  to maintain consistent quality and volume levels across each patch. In
  addition to the standard recorded repetitions we have provided a scripted
  repetition that uses a number of techniques to create slight variations for
  every note, just like a live musician. There are literally thousands of subtle
  variations that our intelligent repetition script will perform and it will
  never repeat a single variation more than once in every 128 repetitions, per
  note.

  The instrument is simple to use and is highly playable. Through advanced
  scripting we have made it incredibly easy to achieve a realistic performance
  with minimal programming.

  The instrument was recorded dry using a single condenser microphone in a close
  mic position. We recorded through an analogue mixer in order to retain a
  warmer, more natural sound, and used high quality a/d converters before fine
  tuning and editing each sample.
specs: |-
  - Two octave glockenspiel
  - Three mallet types (soft rubber, hard rubber, plastic)
  - Legato transition samples
  - Chromatic sampling
  - Round robin repetitions
  - Dynamic level recording
  - Velocity scaling
  - Intelligent repetition script
  - 128 repetitions per note
  - Dry recording with single condenser microphone
  - Close mic position
  - Analogue mixer recording
  - High quality a/d converters
  - Kontakt 4.2.3+ required
  - 500mb hard drive space
