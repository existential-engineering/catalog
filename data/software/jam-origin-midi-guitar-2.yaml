description: MIDI Guitar 2 turns your guitar into a polyphonic MIDI controller, converting a guitar's analog audio signal into a digital MIDI signal. It is a low latency, polyphonic software solution that needs no special hardware beyond a standard guitar audio interface.
details: |-
  MIDI Guitar 2 is a piece of software that converts a guitar's analog audio signal into a digital MIDI signal. This makes it possible to use a standard guitar exactly as you would use a MIDI keyboard or MIDI controller, so you can play software synthesizers and samplers with your guitar, record guitar notation directly into recording software, and use MIDI to control real guitar effects such as compressors, EQs and amps.

  Jam Origin describes it as the world's first low latency, polyphonic software solution, allowing you to play both chords and single notes with instant audio feedback. Traditionally guitarists have had to seek out expensive and inconvenient hardware to use a guitar as a MIDI controller. MIDI Guitar removes the need for any kind of specialized hardware beside a standard guitar interface to connect the guitar to a computer.

  MIDI Guitar comes in a few variants: standalone Windows and Mac applications that can host VST and AudioUnit instruments and effects, or VST and AudioUnit plugins that can be hosted inside a DAW. There is also an app for iOS, and a Mac App Store edition aimed at GarageBand users that is described as less feature complete than the flagship version.

  Beyond MIDI conversion the application is a plugin host, loading virtual instruments, effects, impulse responses and SFZ samplebanks. It also carries its own deep guitar effects, which Jam Origin describes as giving profound new tone and sustain with no loss of expressiveness through direct harmonic access. The standalone application is positioned as a pedalboard for live use, loading complex plugin patches at the press of a MIDI pedalboard.

  The full Windows and Mac edition is listed at USD 149.95 with a current version of 2.2.1, alongside an iOS edition and a GarageBand edition at USD 59.95. Jam Origin's current downloads page groups the 2.2.1 builds under the heading "MIDI Guitar 2, stable versions (Legacy)", with MIDI Guitar 3 in open beta at jam.live.
specs: |-
  - Polyphonic, low latency audio to MIDI conversion for guitar
  - No specialized hardware or hex pickup needed, works with a standard guitar/audio interface
  - Standalone application plus VST and AudioUnit plugin versions
  - Hosts VST and AudioUnit virtual instruments and effects
  - Loads SFZ samplebanks and impulse responses
  - MIDI Machines scripts (sustain, transpose, user-programmable)
  - MIDI Learn for most parameters
  - Deep Expressor effect
  - Resizable user interface
  - MIDI output for recording guitar notation in a DAW
  - Personal license installs MIDI Guitar and MIDI Bass on any of the owner's Windows or macOS computers
  - Free trial runs without installation, with occasional interruptions
  - Mac requirements: MacOS X 10.7 and upward, any dual core Intel based Mac, guitar/audio interface
  - Windows requirements: Windows 7 and upward, dual core i3/i5/i7/m3/m5/m7 processor, guitar/audio interface with an ASIO driver
  - iOS requirements: any device capable of running iOS 12 and up, guitar/audio interface
