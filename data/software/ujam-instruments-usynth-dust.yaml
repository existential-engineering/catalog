description: DUST is all about beautifully aged, dusty tones. Keys & chords, pads & textures, leads, basses, plucks & bells, vox, lofi & liminal, faux sampled.
details: |-
  DUST is all about beautifully aged, dusty tones. It starts from acoustic and electric instrument sources, then degrades, filters, and distorts them into beyond-retro liminal and loFi perfection, the kind of character that makes anything sound beautifully worn and alive.

  Dreamy textures: step into a liminal dream world of tape hiss, soft imperfections, and fragile, glowing soundscapes. Comfortably numb listening.
specs: |-
  - Keys & chords, pads & textures, leads, basses, plucks & bells, vox, lofi & liminal, faux sampled
  - 100 synthesizer patches, 100 global presets
  - Multi-synthesis engine, sequencer/arpeggiator, multi-FX
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8GB of RAM
  - 0.22GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Requires the latest version of the UJAM App, which installs the Usynth plug-in that hosts all titles
  - MIDI phrases and included sounds are royalty-free
