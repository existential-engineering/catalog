details: >-
  Alkamanat is a virtual analog oriental strings machine that works in an open
  mixer format and mixes up 6 independent 32-bit top quality waveform
  oscillators with incredible dynamic range to generate 6 oriental strings
  ensemble emulation, each with it's own size and color.


  Alkamanat's strength is in creating beautiful chords, oriental and arabic
  strings combinations, articulations and textures.


  Alkamanat has full synthesis section, 2 different MIDI velocity options, a
  user friendly global hipass-lopass filter, a full section of built-in effects
  (saturation, chorus, phaser, tremolo, reverb and delay), a built-in draw-bars
  system, a separate pizzicato mode and an arabic scales generator.
specs: |-
  - 6 independent 32-bit waveform oscillators
  - Virtual analog oriental strings machine
  - Open mixer format
