description: PSP Nexcellence is a rich-sounding, spring reverb emulation inspired by and modeled after classic "necklace-type" reverb units. It provides two different spring set processors, and can use one or both of its processing engines simultaneously. The Nexcellence algorithm has improved on the original hardware by providing a handy set of parameters to let you control inherent aspects of the spring reverb.
details: |-
  Rich-sounding spring reverb emulation inspired by and modeled after classic necklace-type reverb units. Provides two different spring set processors. Can use one or both processing engines simultaneously. Algorithm improved on the original hardware with parameters to control inherent aspects of spring reverb. 30-day free trial available. iLok License Manager required (no USB dongle required).
