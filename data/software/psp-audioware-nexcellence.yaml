description: PSP Nexcellence is a rich-sounding, spring reverb emulation inspired by and modeled after classic “necklace-type” reverb units. It provides two different spring set processors, and can use one or both of its processing engines simultaneously.
details: |-
  PSP Nexcellence is a rich-sounding, spring reverb emulation inspired by and modeled after classic “necklace-type” reverb units. It provides two different spring set processors, and can use one or both of its processing engines simultaneously.

  The Nexcellence algorithm has improved on the original hardware by providing a handy set of parameters to let you control inherent aspects of the spring reverb.
specs: |-
  - Spring reverb emulation modeled after classic “necklace-type” reverb units
  - Two different spring set processors
  - Both processing engines can be used simultaneously
  - Parameters for controlling inherent aspects of the spring reverb
