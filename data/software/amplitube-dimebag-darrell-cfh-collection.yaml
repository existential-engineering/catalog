details: >-
  Introducing the dimebag darrell cfh collection for amplitube. This new
  collection features models of the exact gear used by "dimebag" darrell lance
  abbott on pantera's groundbreaking album cowboys from hell. Mac/pc users can
  enjoy nine brand new models including two amps, two cabinets and five
  stompboxes.


  Ik multimedia worked with dime's long-time guitar tech and right hand man,
  grady champion, to precisely model all of dime's guitar tones from the album
  utilizing all the personal guitar effects, amplifiers and cabinets he used
  while recording cowboys from hell. Available in a convenient desktop app and
  DAW plug-in, guitarists can now play and record using the same gear and
  settings dime did.


  The collection features models that precisely mirror the rig dime used to
  record cowboys from hell. This includes a meticulously modeled reproduction of
  the highly coveted randall rg 100es amplifier, a completely re-modeled 1986
  roland jc-120 stereo combo amp, and all the pedals dime used.


  Five stompboxes: 6-band eq, six-band graphic eq based on a unit by mxr; used
  to shape and boost sound before the amp. Pre eq 3, three-band parametric eq
  based on the furman pq-3; offers great flexibility for sound shaping. Flanger
  doubler, based on an mxr flanger doubler, offering two effects in one.
  Primarily used by dime in "doubler mode" to thicken in his overall tone. Dime
  wah, based on the dunlop cry baby gcb95. Modeled with precise attention to
  dime's lead tones. Dime noise gate, fast and very responsive; based on the
  rocktron hush iib model.


  Two amplifiers: darrell from hell 100, modeled to meticulously mirror the
  highly coveted randall rg 100es solid-state, 120 watt amplifier. The sound and
  tone of this amp became famous when dime started using it in the early pantera
  days. Jazz amp 120cfh, based on the 1986 roland jc120, this stereo amp was
  used on the song cemetery gates. Fine-tuned to match the exact tone heard on
  the album. Two cabinets: darrell from hell 412, based on the randall 412jb;
  the perfect companion to the darrell from hell 100 amplifier. Jp jazz cfh, the
  stereo cabinet section of the roland jc120 combo that features 2x12-inch
  speakers.
