details: |-
  Analog Creator 1M73 is a tone shaping plugin based on the 1073 m 500 series
  model with similarity to real analog models.

  The wd analog creator 1m73 is a 73 model tone shaper with emulation featuring
  real transformers on m 500 series.

  Full-bodied sound with formidable lows, assertive midrange presence and sweet,
  airy highs.

  M series design provides more punch while maintaining a gentle character like
  the real 1073.

  Suitable for application on individual tracks, mixbus and master.
