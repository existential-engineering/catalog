description: Shimmer Delay Ambient Machine combines reverb, pitch shifting, and feedback to create out-of-this-world soundscapes and spaces. It is aimed at guitars, keys, synths, samples and vocals, and at creative production across the ambient spectrum.
details: |-
  Shimmer Delay Ambient Machine combines reverb, pitch shifting, and feedback to create out-of-this-world soundscapes and spaces.

  Great for guitars, keys, synths, samples, and vocals, Shimmer Delay Ambient Machine promotes getting lost in creative production and the electronic music facets of the ambient spectrum.

  A swell crescendo means to start at a low volume and then swell to a much louder level, similar to the sound of a violin being bowed. The auto swell section of the Shimmer Delay Ambient Machine brings those sweeping swells to the guitar.

  The user interface is designed with an emphasis on user control and playability, and the plugin is built to be tweaked in real time. All of the sliders have a smoothed response to avoid clicks when changing settings or automating the controls, while the algorithm has been highly optimized so a large delay sound does not strain the CPU.

  An iOS version for iPhone and iPad is available from the Apple App Store alongside the desktop plugin.
specs: |-
  - Combines reverb, pitch shifting and feedback for ambient soundscapes
  - Auto swell section for violin-style crescendo swells
  - User interface designed for real-time control and playability
  - Smoothed slider response avoids clicks when changing settings or automating controls
  - Highly optimized algorithm for large delay sounds at low CPU cost
  - Suited to guitars, keys, synths, samples and vocals
  - iOS version available for iPhone and iPad
  - Plugin formats: VST2, VST3, AAX or AudioUnits compatible host
  - Intel compatible or Apple Silicon CPU
  - 1GB RAM
  - Mac OS 10.13 or newer
  - Windows 7 or newer
  - 64-bit DAW required
