details: |-
  Great for guitars, keys, synths, samples, and vocals, Shimmer Delay Ambient Machine promotes getting lost in creative production and electronic music facets of the ambient spectrum. Swell crescendo means to start at a low volume and then swell to a much louder level, which is similar to the sound of a violin being bowed. Now you get those sweeping swells from your guitar using the auto swell section of the Shimmer Delay Ambient Machine. Shimmer Delay Ambient Machine user interface is designed with an emphasis on user control and playability.
specs: |-
  Shimmer Delay Ambient Machine has been designed to be tweaked in real-time. All of the sliders have a smoothed response, to avoid clicks when changing settings or automating the controls. At the same time, the algorithm has been highly optimized, so you get a huge delay sound without straining your CPU. | WATCH VIDEO Plugin Formats A VST2, VST3, AAX or AudioUnits compatible host | An Intel compatible or Apple Silicon CPU 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
