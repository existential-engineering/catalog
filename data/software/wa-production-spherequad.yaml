description: SphereQuad is a semi-modular multi-effect plugin that routes stereo flanger, phaser and chorus modules into a stereo filter driven by a 16 step sequencer. Independent left and right filter settings move the processed signal around the stereo field.
details: |-
  SphereQuad combines stereo flanger, phaser and chorus effects fed into a stereo filter, with an onboard step sequencer controlling that filter. The left and right filters can be set independently to push sound around the stereo field, and flexible routing between the modules covers a wide range of special effects.

  Each of the Flanger, Phaser and Chorus modules carries multiple parameters for adjusting its main characteristics. The modules can be activated individually, or mixed and routed in various combinations.

  The 16 step sequencer controls the filter cutoff and can be synced to project tempo or run completely independently. Signal from the Flanger, Phaser and Chorus modules can be fed into the sequencer for rhythmic modulation.

  Independent left and right channel filter shapes, speeds, ranges and types can be programmed so the filtered sound moves across the stereo field. A real-time waveform display shows the effect of the filter cutoff, and the master output module provides a Dry / Wet control and a Saturation dial for increasing odd harmonics and overall intensity.

  Over 60 presets are included, named by instrument group and effect so a particular character can be located quickly. Version 1.5.0 added a license key protection scheme, an updated saturation algorithm, revised colours, and improvements to performance, stability and memory management.
specs: |-
  - 64 creative presets
  - Stereo Flanger, Phaser and Chorus modules with multiple parameters
  - Mixer and output controls with Saturation module
  - Flexible signal routing between all modules
  - 16 step sequencer
  - Independent left and right filter modules for true stereo manipulation
  - Sync to BPM
  - Real-time waveform display corresponding to the filter cutoff
  - Full PDF manual
  - 64 bit only on Mac and PC
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
