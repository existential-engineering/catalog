description: NFuse merges two renowned bus processors into one plugin, with
  saturation, EQ, compression, and stereo width modules interchangeable between
  the two units. It lets you mix and match modules for a hybrid bus processing
  chain.
details: |-
  NFuse merges the best of both worlds, featuring classic analog character with modern precision from two of the most renowned bus processors on the market. With each module being interchangeable, you have complete control over the Saturation, EQ, Compression, and Stereo Width of your mix. With a wide range of tonal options between the units, you aren't just getting two flavors of the same thing, but two powerhouse units in one. INPUT

  F: Input controls, as well as a variable HPF that includes a small resonance bump where processing begins. N: Input controls, as well as a flat variable HPF that decides where processing begins on the plugin. SATURATION

  F: Brings in the crisp, harmonic saturation reminiscent of the SSL Fusion with controls for Drive and Density, influencing how the saturation reacts to the signal. N: Rounded and Thick Saturation featuring the 'Dark' to add extreme weight to the bottom end and 'Red' saturation characters to enhance the harmonics of your top end! EQ

  F: Featuring a 2-band mastering grade EQ built to add substantial weight to your lows and add presence and air to any mix with minimal phase-shift. N: Equipped with a 2-band Shelf EQ, it provides the smooth tonal shaping capabilities essential for both subtle tweaks and more significant sculpting. COMPRESSION

  F: Featuring the most popular bus compressor in the world, renowned for its punch, and glue across any source. N: Includes an optical compressor that adds dynamic control and a touch of color, with adjustable recovery speed for versatility! Engage Hi-Ratio mode for extreme compression! STEREO CONTROLS

  F: A super colorful spatial tool for adding and taking away width and space from any tracks in your mix. N: An extremely powerful, and true to sound stereo widener. Whether you need a wider drum room, or want to enhance your entire mixbus, this has you covered! Keep the low end in-tact using the HPF! OUTPUT

  F & N: Output Controls, Global Bypass, and Metering
