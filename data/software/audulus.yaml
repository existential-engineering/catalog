description: Build synthesizers. Design sounds. Shape audio in real time. All
  with professional-grade, low-latency performance ready for live use.
details: |-
  Build synthesizers. Design sounds. Shape audio in real time. All with
  professional-grade, low-latency performance ready for live use and it's free.
  Audulus gives you a complete modular environment at no cost. Its clean, fluid
  interface stays out of the way so you can focus on what matters: exploring
  sound.

  A modular playground with room to grow from first experiments to advanced
  designs. Discover the pro module series: premium instruments and effects that
  show what's possible when world-class sound design meets true modular freedom.
  Each pro module is crafted specifically for audulus, giving you new ways to
  expand your sonic toolkit.

  Audulus 4 introduces amazing awaited features and deeper building
  possibilities, like the lua script based canvas node. The new performance mode
  supports multitouch, and multi-channel patch wires enable complex routing and
  polyphony.

  Complete modular environment with deep node library for building from scratch
  and extensive module library for synthesis and sound design. Smooth,
  high-performance graphics even with massive patches.

  Available on iphone, ipad, and mac with icloud sync. Functions as a standalone
  application or auv3 plugin. Remarkable gesture control with active forum and
  discord community support.
specs: |-
  - Modular synthesizer environment
  - AUv3 plugin
  - Multi-channel signal flow
  - Polyphony support
  - MIDI I/O
  - MIDI learn
  - Lua scripting
  - Glsl shader node
  - Multi-touch control surfaces
  - Multi-core audio processing
  - Low-latency performance
  - Icloud sync
  - Available on iphone, ipad, and mac
  - Universal 2 binary
