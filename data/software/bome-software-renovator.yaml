description: ReNovator for ReBirth 2 is a Windows tool for creating ReBirth mods
  (.rbm files). It wraps the use of ModPacker and adds Removi, a preview window
  that displays all your components like ReBirth does, so you no longer need to
  run ReBirth to check your latest adjustments.
details: |-
  ReNovator wraps the use of ModPacker: when you want to create your mod (.rbm file), ReNovator creates a temporary directory, copies all files there and runs ModPacker. Once ModPacker has finished packing the RBM, ReNovator removes the directory.

  Removi, the preview window, displays all your components like ReBirth does, so you no longer need to run ReBirth to check your latest adjustments. Removi lets you turn the knobs and click buttons to fully test your graphics, and you can listen to the drums by clicking on them. All knobs, sliders and buttons can be set to their minimum or maximum positions, and there is a randomize function.

  You can keep using BMP and WAV files, because ReNovator does all the necessary conversion for ModPacker. PC users often work with WAV samples, and ReNovator lets you use these instead of AIFF files and converts them automatically, so formats can even be mixed. BMPs in 16 million colors keep their quality when modified, and ReNovator automatically converts them to JPEG when creating the mod.

  Using ModPacker names ("12500.jpg") or ReNovator names ("303 Panel.jpg") is treated transparently, so you can use descriptive filenames or any other naming scheme. Images and drums can be used from directories of your choice, so there is no need to copy files first, and a drum sample can be dragged and dropped onto the corresponding drum in ReNovator.

  The file browser in the right-hand list is a full clone of the explorer, with copy/paste and drag and drop support. Options include defining a standard image and wave editing program that is launched by double-clicking on an image or drum, the image viewer can resize images to fit its window or adapt its own size to the image, and a simple wizard helps anyone who is not familiar with the basics of mod creation.
specs: |-
  - Creates ReBirth mods (.rbm files) by wrapping ModPacker
  - Removi preview window renders all components as ReBirth does, with interactive knobs and buttons
  - Audition drums by clicking them in Removi
  - Minimum/maximum and randomize functions for all knobs, sliders and buttons
  - Automatic BMP to JPEG and WAV to AIFF conversion; mixed formats supported
  - Transparent handling of ModPacker filenames and descriptive ReNovator filenames
  - Drag and drop of sample and image files onto the corresponding drum or component
  - Explorer-clone file browser with copy/paste and drag and drop
  - Configurable external image and wave editors launched by double-click
  - Resizable image viewer that can fit the image to the window or the window to the image
  - Setup wizard for users new to mod creation
  - Installer is 759 KB; requires a license key requested from Bome using the R-Code shown at first start
