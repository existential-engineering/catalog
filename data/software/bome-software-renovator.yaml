description: Create mods (.rbm files) for Propellerhead ReBirth.
details: |-
  ReNovator wraps the use of ModPacker: when you want to create your mod (.rbm file), ReNovator creates a temporary directory, copies all files there and runs ModPacker. Once ModPacker has finished packing the RBM, ReNovator removes the directory.

  Removi, the preview window, displays all your components like ReBirth does, so you no longer need to run ReBirth to check your latest adjustments. Removi lets you turn the knobs and click buttons to fully test your graphics, and you can listen to the drums by clicking on them. All knobs, sliders and buttons can be set to their minimum or maximum positions, and there is a randomize function.

  You can keep using BMP and WAV files, as ReNovator does all the necessary conversion for ModPacker. Using ModPacker-names ("12500.jpg") or ReNovator-names ("303 Panel.jpg") is treated transparently. If you have a library with drum samples you do not have to rename and copy them, you just drag and drop the file on the corresponding drum in ReNovator and it does everything necessary to create the RBM.

  In the image viewer, images can be resized so that they fit into its window, or the image viewer's size can adapt to the image being displayed. The file browser (right list) is a full clone of the explorer, with copy/paste and drag and drop between the two. You can define a standard image and wave editing program that will be launched by double-clicking on an image or drum, and a simple wizard helps anyone who is not familiar with the basics of mod creation.

  Compared with using ModPacker alone, ReNovator lets you use images and drums from directories of your choice so you no longer need to copy files, removes the need for cryptic ModPacker filenames, and lets PC users work with WAV samples instead of AIFF files, converting them automatically and even mixing formats. BMPs in 16 million colours keep their quality when modified, and ReNovator converts them to JPEG automatically when creating the mod.
specs: |-
  - Wraps ModPacker to build ReBirth mod (.rbm) files
  - Removi preview window renders the mod as ReBirth does, with working knobs, buttons and audible drums
  - Randomize function and min/max presets for all knobs, sliders and buttons
  - Accepts BMP and WAV files, converting automatically for ModPacker (BMP to JPEG, WAV to AIFF)
  - Transparent handling of ModPacker-style names and descriptive ReNovator-style filenames
  - Drag and drop assignment of drum samples and images
  - Resizable image viewer that can fit image to window or window to image
  - Explorer-clone file browser with copy/paste and drag and drop
  - Configurable external image and wave editor launched by double-click
  - Wizard for users new to ReBirth mod creation
  - Installer RfR2Full_202.exe, 759 KB, Windows
