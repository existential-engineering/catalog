description: An advanced metering tool providing deep insight into the stereo image of any dual-channel signal. Features a goniometer (X-Y scope) for real-time visualization of stereo width, phase, and polarity, digital peak and RMS meters, correlation meter for mono compatibility assessment, balance meter, frequency-limited monitoring with adjustable filters, and 64-bit internal processing supporting sample rates up to 384 kHz. Free to download with a free PSP account.
details: |-
  PSP stereoAnalyser2 is a free, advanced metering plug-in designed to give you deep insight into the stereo image of any dual-channel signal. Whether you're recording, mixing, or mastering, PSP stereoAnalyser2 delivers an accurate visual representation of your stereo field and level structure, helping you make confident decisions at every stage of production.

  Featuring a highly responsive goniometer (X-Y scope), Peak and RMS meters, a correlation meter, and balance monitoring, PSP stereoAnalyser2 lets you instantly evaluate stereo width, mono compatibility, phase alignment, and overall signal clarity. With adjustable frequency-limited monitoring, zoomable displays, and precision 64-bit processing, it's a powerful visual tool for achieving a balanced, coherent stereo image.
specs: |-
  - Goniometer (X-Y scope) for real-time visualization of stereo width, phase, and polarity
  - Digital Peak and RMS meters for precise level monitoring
  - Correlation meter for assessing mono compatibility
  - Balance meter for left/right energy distribution
  - Frequency-limited monitoring with adjustable high-pass/low-pass limits
  - Adjustable scope zoom and nonlinear display shaping for enhanced readability
  - Monitoring mode for listening to the filtered frequency band
  - Resizable GUI, advanced preset browser, A/B comparison, and undo/redo system
  - 64-bit internal processing and support for sample rates up to 384 kHz
  - Windows 7 to Windows 11 (VST, VST3, AAX)
  - macOS 10.14 Mojave to macOS 16, Intel and Apple Silicon (AudioUnit, VST, VST3, AAX)
  - AAX requires Pro Tools
