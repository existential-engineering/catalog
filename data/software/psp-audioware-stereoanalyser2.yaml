description: An advanced metering tool providing deep insight into the stereo image of any dual-channel signal. Features a goniometer (X-Y scope) for real-time visualization of stereo width, phase, and polarity, digital peak and RMS meters, correlation meter for mono compatibility assessment, balance meter, frequency-limited monitoring with adjustable filters, and 64-bit internal processing supporting sample rates up to 384 kHz. Free to download with a free PSP account.
details: |-
  PSP stereoAnalyser2 is a free professional stereo metering plug-in for recording, mixing, and mastering workflows. Requires a free PSP User Area account to download. The GUI is resizable and includes an advanced preset browser, A/B comparison, and undo/redo system.
specs: |-
  - 64-bit internal processing
  - Sample rates up to 384 kHz
  - Goniometer (X-Y scope) for real-time stereo visualization
  - Digital peak and RMS meters
  - Correlation meter for mono compatibility
  - Balance meter for left/right energy distribution
  - Frequency-limited monitoring with adjustable HP/LP filters
  - Resizable GUI
  - Advanced preset browser with A/B comparison
  - Platforms: Windows 7-11 (64-bit), macOS 10.14-15 (Intel and Apple Silicon)
  - Formats: AU, VST, VST3, AAX
