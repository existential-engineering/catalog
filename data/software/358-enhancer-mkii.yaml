details: |-
  The 358 ENHANCER MkII is the second generation of MIA Laboratories' single-stage, 'straight-path' audio enhancer process, allowing control of the low, mid-low, mid-high and high frequency balance on the master, as well as on individual tracks.

  It can be used in many applications requiring from slight to more drastic frequency balance correction. At its core, 358 mkii utilizes multiband phase processing, as well as a sidechain detection stage based on the basic analog envelope detector circuit.

  This unit can be of great help when there is a need to lively-up a mix, and make it feel more 'natural'. Its process facilitates the creation of round, solid subs, punchy mid-lows, rich mid-highs and sensational highs.

  Unlike a conventional eq or filter, the 358 mkii uses internal multiband phase processing, resulting in a more dynamic, realistic frequency content. The four main controls allow for precise control of the constructive (boost) process.

  The crossover frequencies can also be tuned according to your needs and are -by default- set at the classic 150hz, 400hz and 2.4khz.
