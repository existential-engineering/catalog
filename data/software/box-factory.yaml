details: |-
  Box Factory is a unique cinematic percussion library geared towards
  professional composers and producers alike, featuring a huge 40-piece ensemble
  of cardboard boxes, masterfully sampled in a concert hall.

  We assembled six performers and 40 boxes of different shapes and sizes in a
  concert hall, and curated 13 unique ensembles ranging from large to small
  boxes with a range of stick types and performance techniques. The sound of box
  factory is familiar, yet totally unique. It is presented in a way that will
  feel at home if you've used any other percussion library you can approach in
  the same way as you would toms, taikos and snares yet it offers a certain
  organic, raw and tactile sound that is unlike any conventional percussion
  instrument.

  We created four distinct mixes natural, aggressive, gritty, and snappy giving
  you a diverse palette of sounds to complement any musical style. Each of the
  four mixes include three individual microphone perspectives (close, mid and
  far). These signals can be blended with ease using the 'perspective' slider,
  or controlled with greater precision using the separate microphone faders.

  For many users, the main page will be all you need to jump in and start
  creating music with box factory. For those users who want to take the library
  even further, we have provided an advanced setup page, which allows you to
  tweak each articulation in various ways, edit the instrument's mapping, and
  even create your own custom patches that are tailored to your needs and
  workflow. The rhythm page contains a step sequencer for easily creating
  tempo-synced rhythms. Velocity and lp/hp filter cutoff can be controlled
  per-step by dragging across the interactive tables.

  On top of the 'standard' instruments included in the library, we recycled the
  raw cardboard box recordings into a set of designed drums. These warped and
  mangled instruments feature multiple rrs and velocity layers, making them
  fully playable instruments, adding a whole new dimension to the sonic palette
  offered by box factory. To push the envelope even further, we pursued the
  talents of hollywood sound designer karel psota and trailer composer benjamin
  squires to create a selection of 70 hard-hitting cinematic one-shot samples.
  Incredibly, these sounds were created from 100% box factory source material,
  and perfectly complement the playable instruments offered in the library. We
  have also included these sounds as standalone wav files, which can be used
  directly in your DAW.
