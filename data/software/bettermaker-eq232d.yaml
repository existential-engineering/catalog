details: |-
  The Bettermaker EQ232D is a plugin recreation of the analog Bettermaker EQ232P MKII mastering equalizer. It combines the characteristics of classic Pultec EQs with a modern 21st-century design approach, offering clean headroom without vintage distortion coloration.

  Each channel features 5 EQ filter sections: 2 classic Pultec-style passive sections with separate boost and attenuation knobs, 2 highpass filters, and 4 parametric filters covering 15Hz to 15kHz. The passive 'P EQ' section faithfully captures the interaction behavior characteristic of classic Pultec designs.

  The plugin supports Stereo, Dual Mono, and Mid/Side (M/S) processing modes, making it versatile for both mixing and mastering workflows across multiple genres.

  The EQ232D ships with an extensive preset library, including 4 exclusive mastering presets by Luca Pretolesi (Grammy-nominated mastering engineer). An A/B comparison function is included for quick switching between settings.
specs: |-
  - Minimum display resolution: 1440×900px
  - Minimum RAM: 2 GB
  - 5 EQ filters per channel
  - 2 classic Pultec-style passive EQ sections with separate boost and attenuation
  - 24 dB/Oct highpass filter
  - 4 parametric filters covering 15 Hz to 15 kHz
  - Processing modes: Stereo, Dual Mono, Mid/Side (M/S)
  - A/B comparison functionality
  - Preset library including 4 exclusive presets by Luca Pretolesi
  - U.S. Patent No. 10,693,428 B2
