description: Amp Vision is a VST plug-in for guitar processing giving you a
  variety of tones in an easy to use package.
details: |-
  The amp simulations in this plug-in cover an wide range of guitar tones. Many
  of these amps are inspired by guitar recordings and vintage amps. Modern amps
  are also included for modern metal or clean tones.

  Your presets are easily organized in an internal library that is part of the
  plug-in. Effect simulations are also included and can be used in any order
  before or after an amp.

  Cab sim features are included with a number of cab sim files built in. It can
  load more from our site or from any impulse response file.
specs: |-
  - 28 amps
  - 14 effect pedals
  - Cabinet sims
  - Customizable library of presets and categories
  - Noise gate
  - Oversampling
  - Cab sim bypass
  - Effects bypass
  - Amp modeling bypass
  - Internal 64-bit (double precision) processing
  - Stereo processing
  - MIDI support
  - Track envelope support
  - Zero latency
