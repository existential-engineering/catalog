name: B-Line 303
manufacturer: sonicxtc
primaryCategory: synthesizer
description: B-Line 303 is a bass-line synthesizer that captures the vibe and
  sound of classic edm and acid techno synthesizers from the 70s and 80s.
details: |-
  B-line 303 can easily dial up the classic acid bass sound with all the squelch
  and buzz of the original classics.

  New in version 2 was the pattern control filter (pcf) that adds iconic acid
  style tweaks to the sound. The pcf allows any MIDI pattern to be manipulated
  into an almost infinite pallet of acid goodness.

  New in version 3 is the optional groove sequencer that can add additional
  retro feel to your tracks.

  B-line 303 also comes equipped with an improved stereo doppler chorus effect
  (pitch shift/chorus effect) and a stereo echo effect to complete the total old
  school acid bass-line experience.
specs: |-
  - Pattern control filter (pcf)
  - Groove sequencer
  - MIDI automation
  - Stereo doppler chorus effect
  - Stereo echo effect
  - 200 user presets
  - 50 custom presets
  - VST 2.4
