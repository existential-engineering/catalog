details: >-
  Arkonnekt is a simple audiounit host for mac os x which allows you to easily
  create arbitrary graphs of audio effects and play a sample through the effects
  chain to any output on your computer.


  Arkonnekt is deliberately simple. There are no explicit concepts of busses, or
  sidechains, only nodes with inputs and outputs. By connecting these nodes in
  unique ways, an endless variety of effects can be achieved.


  In addition, arkonnekt eliminates the idea of mixers. Instead of complex mixer
  units with sends, input levels and panners, a simple node which merges
  incoming connections, and splits outgoing connections is used. Combined with
  volume and panner units, very sophisticated mixer graphs can be created.
specs: |-
  - Audiounit host
  - Mac os x compatible
  - Audio effects graph creation
  - Node-based architecture
  - Audio routing and connections
  - Volume units
  - Panner units
  - Sample playback through effects chain
