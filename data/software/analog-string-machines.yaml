description: Analog string machines xils v+ and xils 505, two emulations of the
  finest string machines ever created available in a single license.
details: >-
  Xils v+ and xils 505, two emulations of the finest string machines ever
  created available in a single license. Xils 505: paraphonic strings,
  synthesizer, bass synth. Xils v+: paraphonic strings, human voices, 10 band
  musical vocoder.


  The xils v+ combines a vintage 10 band vocoder, supreme top octave divider
  based strings and human voices, or any sophisticated layering of these three
  elements. The top octave divider oscillator provides a unique sound that no
  samples, or other simple synthesis techniques can reproduce. Emulating the
  t.o.d, without any aliasing on the whole frequency range, with its pitch and
  waveform modulation, was a real challenge, worthy of xils-lab.


  The xils v+ would not however be a real xils-lab instrument if we did not add
  a lot of functions and possibilities that were not present in the original
  machine, some giving access to its internal circuitry and parameters. And some
  being totally new. Please note that the xils v+ is protected by a dongle:
  you'll need an ilok 1 or 2, or USB-elicenser to play it.


  The x-505 is the analog orchestra string machine. It's a string machine, it's
  also a synthesiser... A bass synth. And it can be the three of them
  simultaneously. We also added a vintage analog human choir machine (as an
  alternative oscillator source for the synthesiser section) and exposed
  numerous hidden parameters of the vintage string machine model. The x-505
  offers an amazing 49 notes of polyphony, with all the layering, sources
  mixing, and tweaking possibilities of it's glorious ancestor, one of the most
  versatile and powerful string machines ever built, including the precious
  balance between the strings 4' and 8' registers, and individual settings for
  all the inputs of the quadruple (yes 4) bbd chorus unit.


  The x-505 features a faithfully emulated, aliasing free, tod (top octave
  divider) oscillator providing up to 49 voices of polyphony, a string section
  with its own filter and waveform mangling, a synthesiser section with
  dedicated adsr and 24db analog filter with envelope and lfo modulations, a
  human voice section with custom formant and balance settings, a bass section
  with three cumulative waveforms, a thick sounding quadruple bbd
  chorus/ensemble unit, a raw analog phaser effect, a vintage natural sounding
  reverb, a true stereo space effect, a modulation matrix with 6 nodes
  addressing 14 sources and 24 destinations, a special glide section, an
  advanced polyphonic arpeggiator, and MIDI cc control for all parameters.
