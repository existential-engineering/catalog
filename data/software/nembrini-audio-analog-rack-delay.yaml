description: Analog Rack Delay plugin is Nembrini Audio's delay algorithms in a simple package, featuring BPM sync, stereo spread circuit, and a tube preamp virtual circuit for signal coloration.
details:
  - Analog Rack Delay plugin is the Nembrini Audio's delay algorithms in a simple package! BPM Sync, stereo spread circuit and a very juicy sound!
  - Tube preamp virtual circuit which gives colour to the signal in a very special way.
  - Suitable for guitars, bass, and vocals. The stereo spread circuit adds width and dimension to the delayed signal.
  - Available on macOS (10.13 or newer) and Windows (7 or newer), requiring a 64-bit DAW. Also available as an iOS app for iPhone and iPad.
