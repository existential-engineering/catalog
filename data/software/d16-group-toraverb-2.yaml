description: Space Modulated Reverb
details: |-
  Toraverb was never meant to be an emulation, approximation, or recreation. Unlike a classic unit such as a spring, room, hall or plate reverb, Toraverb is a concept in its own right, built around a custom diffusing network of the highest possible quality based on modified all-pass filters, with fine-tuned parameters eliminating almost all unwanted flutter-echo effects across diverse sound sources.

  Toraverb has two independent, single-band, fully parametric equalizers, one for each reflection engine, with low shelf, peak and high shelf options for shaping the coloration and character of the reverb as well as its intensity. An additional modulation parameter affects the diffusing network, altering how sound-wave reflections are distributed in time, from subtle movement to wild modulation of the tail. An innovative spatial reflection algorithm interjects reflected stereo waves between both stereo channels for an even better impression of physical space, with controls across L/R as well as Mid/Side domains.

  A quick, convenient blend between Early and Late reflections, with separate balance parameters for both working in Left/Right or Mid/Side modes, allows for retro reverb panning or mono'ing low-frequency early reflections while keeping late reflections wide. A built-in ducker compresses the FX signal's amplitude proportionally to the loudness of the dry, unprocessed input, saving overall output signal energy.
specs: |-
  - Custom diffusing network based on modified all-pass filters (not a convolution/algorithmic emulation)
  - Two independent single-band parametric EQs (one per reflection engine)
  - Modulation parameter affecting the diffusing network's reflection distribution
  - Spatial reflection algorithm with L/R and Mid/Side controls
  - Independent Early/Late reflection balance in L/R or Mid/Side modes
  - Built-in ducker keyed off the dry input signal
