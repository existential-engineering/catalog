details: >-
  Amplitube 4 is a guitar and bass tone studio for mac/pc that works as a
  standalone application and as a plug-in for your favorite DAW. Amplitube
  recreates the entire guitar/bass signal chain from instrument to recording
  device, and does so in a very realistic and intuitive way. Amplitube pioneered
  and leads the way in guitar amp and effects modeling, and amplitube 4 takes it
  to the outer edges of extreme hyper realism with intuitive familiar tools.


  Amplitube orange gives you the best of the best of orange amplifiers and
  cabinets for your mac or pc, in a new collection for amplitube custom shop
  from the leader in amp and effects modeling, ik multimedia. You get faithful
  "true to the original" models of some of orange's vintage and current dream
  machines.


  Amplitube orange includes 8 amp models: the ad 200, dual terror, or 50, the
  thunderverb 200, the tiny terror, the ad30tc, rockerverb 50 the or-120 and 9
  matching configurable speaker cabinets. It is the definitive collection of
  orange gear that every guitarist, engineer and producer should have.


  Amplitube orange includes officially certified models of amplifiers: ad200b mk
  3 head, dual terror head, or50h head, thunderverb 200 head, tiny terror head,
  ad30tc combo amplifier, or120 head, rockerverb 50 mkii head. Cabinets: obc115
  1x15", obc410 4x10", obc810 8x10", ppc112 1x12", ppc212 2x12", ppc212
  open-back 2x12", ppc412 4x12", tiny terror 1x12" combo, ad30tc 2x12" combo.


  Amplitube orange gives you all the juice you need to fuel your recordings with
  sweet vintage styled orange tone. From a light squeeze of overdrive to a
  full-on screwdriver of distortion, and everything in between, amplitube orange
  delivers.
