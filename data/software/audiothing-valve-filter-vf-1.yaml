details: |-
  Valve Filter is a multimode resonant filter plugin with vintage valve emulation.

  The filter section is modelled after a classic ladder filter with low pass and high pass modes.

  The valve section is modelled after the vintage Telefunken ECC83 tubes but with added grit and custom gain control. Valve Filter works from subtle warbles to full-track filtering effects.
specs: |-
