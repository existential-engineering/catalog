description: Koen Heldens signature semi-parametric 5-band EQ plugin with per-band saturation and M/S. Colour vocals, bus and masters.
details: |-
  The KH-EQ1 is a semi-parametric equalizer that doesn't behave like the surgical, clinically clean EQs everyone already owns. It's a five-band, engineer-designed tool built to add colour, not just remove problems: five ear-selected frequency ranges, each with its own harmonic saturation, wrapped around a stepless Mid-Stereo-Side router. It was built with multi-platinum mix engineer Koen Heldens as the second release in his signature series, with the brief to make an EQ that flatters a modern mix instead of fighting it.

  Semi-parametric means each band has a sweepable frequency and a gain control, but no separate Q knob to fuss over, since the bandwidth is voiced for musical territory. The KH-EQ1 spreads five symmetrical bands across 20Hz to 33kHz with ±18dB of gain each: the Low End and High End are shelving filters, the three middle bands are bells, and the ranges deliberately overlap. Low End covers 20-250Hz for weight and sub, Low Mids run 100Hz-2.5kHz, Mids sit at 250Hz-5kHz, High Mids reach 1-15kHz for clarity and de-essing, and High End stretches 5-33kHz for air and sheen. Click the LED above any band for instant A/B, or hit Auto Listen to solo the frequency being moved.

  Every band has its own Saturation dial that adds even- and odd-order harmonic distortion to that band's isolated signal, so presence can be driven into a dull high-mid without smearing the low end, or a bass band thickened while the top stays clean. The stepless Mode router then morphs the whole processor from Mid through Stereo to Side. Cascading two instances (one full-mid, one full-side) makes a full M/S EQ, widens a mix by shaping only the sides, or tightens a bass by EQing the middle. A Dry/Wet control parallel-blends the processed signal back in for gentler, mastering-grade moves.

  On lead vocals, a lift through the Mids and High Mids with a touch of per-band saturation pulls the singer forward without turning brittle. On the mix bus, small moves in Stereo mode plus a hair of High End saturation add gloss. For mastering, switching to Side widens the top end while the low end stays mono-tight, blended to taste with Dry/Wet. Each license ships with custom presets built by Koen Heldens himself.
