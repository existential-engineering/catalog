description: A mono-to-stereo upmixer using spectral diffusion technology to transform mono audio sources into vibrant, natural-sounding stereo signals. Maintains full mono compatibility and phase integrity, avoiding common stereoizing artifacts such as phase smear, metallic ringing, or hollow coloration. Zero latency with ultra-light CPU load for both studio mixing and live performance.
details: |-
  Mono-to-stereo upmixer (not stereo-to-surround). Core technology: spectral diffusion — distributes a mono signal across the stereo field and frequency spectrum. Full product name: OCELOT Upmixer Stereo Sculptor. Tune dial matches upmix tonal character to source material. High-pass and low-pass filters for fine-tuning. Switchable diffusion mode. Width control. Level control (±12 dB). Precision level meters with correlation metering. Vector scope display for real-time phase information. Universal 2 Binary (Apple Silicon native).
specs: |-
  Controls: Tune, Diffusion Mode, High-pass filter, Low-pass filter, Width, Level (±12 dB), Correlation meter, Vector scope. Latency: zero. macOS 10.12+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+, 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX. Activation: Fuse Audio Labs account. 14-day trial available.
