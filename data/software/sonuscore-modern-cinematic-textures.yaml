details: |-
  Modern Cinematic Textures is a bundle of two Sonuscore Kontakt instruments, Time Textures Expanded and Nordic Spheres, sold together for less than the price of buying them separately. It is aimed at mocking up full cues in moments using only a handful of MIDI tracks with a single automation lane, controlling motion, dynamics, texture and space from the mod wheel alone so that everything modulates together in a cohesive arrangement.

  Time Textures Expanded advances the creation of rich, evolving musical textures with a broader range of tonal possibilities than the original Time Textures, using advanced algorithms to give orchestral and solo instruments depth, movement and beauty. It adds new tonalities, instruments and features, including a FLOW slider that blends in organic legato transitions for fluid, natural-sounding performances, live rhythmic elements that add dynamic pulses to soundscapes, and over 360 expertly crafted presets ranging from intimate solistic textures to expansive grand soundscapes. Four basic parameters tie to the mod wheel so the sound moves from intimate and orchestral to spherical and rhythmic at a single turn, and the engine runs on two sound emitters driven by each individual instrument source.

  Nordic Spheres captures the frosty tone of the ancients, a transportive granular instrument creating rough, pulsating atmospheres. Its main page gives access to four layers: the bottom two focus on hits, particles and sustains, while the top two are Grain Engines loaded with tonal, non-tonal and looping sounds. The natural motion of each layer can be tied to the mod wheel with a single option, and a preset browser holds over 200 chilling and creeping presets. The instrument blends layers of musical spheres and sound effects together with simple but complex arpeggiators.

  The bundle is positioned as style-agnostic, covering bombastic, soft, organic, orchestral, electronic, hybrid, dark, uplifting and emotive scoring from hundreds of presets that are meant to be re-invented rather than used as fixed loops. Crossgrade pricing is offered to existing owners of either component.
specs: |-
  - Bundle of two Kontakt instruments: Time Textures Expanded and Nordic Spheres
  - Over 370 carefully crafted presets across the bundle
  - Time Textures Expanded: over 360 presets, FLOW slider for organic legato transitions, live rhythmic elements, two sound emitters
  - Nordic Spheres: four-layer granular engine (hits, particles and sustains plus two Grain Engines), over 200 presets, built-in arpeggiators
  - Full mod wheel support of the core engine
  - Powerful motion engine to drastically change the timbre
  - NKS-ready
  - Works with the FREE KONTAKT PLAYER
  - Requires Native Instruments KONTAKT version 7.10.9 or higher
  - macOS 13, 14 or 15 (latest update); Windows 10 or 11 (latest service pack)
  - 8GB RAM (more recommended)
  - At least 15 GB of free hard disk space, SSD recommended
  - Some presets require a fast CPU (Intel i7 or higher recommended)
