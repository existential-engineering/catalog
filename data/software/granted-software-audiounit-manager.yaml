details: |-
  With audiounits and hosts multiplying practically daily, users with growing
  collections of both soon want to be able to specify subsets of audiounits to
  be loaded with particular hosts. AudioUnit Manager provides a simple way to
  organize audiounits into sets so users can load just the audiounits they need
  for a particular application.

  This can mean accelerated application launch times and exclusion of
  incompatible audiounits for some hosts.

  Audiounit manager's command line option makes it possible to select a set in
  an applescript before launching an audiounit host.

  Audiounit manager also makes tedious trial by error trouble shooting easier by
  allowing simple disabling of an audiounit.
specs: |-
  - Audio Unit host
  - Audio Units plugin support
  - Command line option
  - Applescript integration
