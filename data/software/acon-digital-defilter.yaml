description: Acon Digital DeFilter is an efficient tool to even out tonal imbalances in a recording or reduce resonant peaks or dips in the frequency spectrum. DeFilter is available for PC and Macintosh and supports the VST, VST3, AAX and AU plug-in formats.
details: |-
  DeFilter effortlessly restores clarity and balance to your audio by intelligently correcting tonal imbalances and suppressing resonant peaks, even in acoustically challenging recordings. Unlike conventional EQ tools, it can target complex issues like comb filtering and room-induced coloration, while preserving the natural character of your source.

  Whether you're matching recordings to a speech or music profile, or equalizing one clip to mirror another, DeFilter streamlines the process with precision and transparency. Tailor corrections with flexible, frequency-dependent curves, and monitor every tweak in real time with dual spectrum analyzers, all through an intuitive, no-fuss interface designed for speed and control.

  DeFilter is ideal for audio that suffers from unnatural tonal imbalances, especially those caused by poor recording environments or inconsistent EQ across takes. Dialogue recorded in untreated rooms with comb filtering, boxiness or excessive room coloration can be smoothed out to bring the voice closer to a studio-quality tone. Archival or field recordings such as old tapes, on-location interviews and found sound often have spectral issues that DeFilter helps restore without over-processing.

  Mismatched multi-mic setups blending lavs, booms or different mic types can be aligned by learning and applying a reference profile. Music tracks with problematic EQ, such as a dull acoustic guitar or a harsh upright bass, can have resonances tamed or dullness lifted without the guesswork of manual EQ. ADR or VO that does not match production audio can be matched to the spectral profile of production sound, making the transition between takes more seamless.

  Acon Digital DeFilter is available as VST, VST3 or AAX for both Windows and Mac or as AU plug-ins for Mac. There are 32 and 64 bit versions for Windows. The Mac version is 64 bit and runs natively on both ARM (such as Apple M1) and Intel processors. Supported hosts include Logic Pro, Pro Tools, Ableton Live, Cubase, Nuendo, Studio One, Reaper, FL Studio, Luna, Adobe Audition, Adobe Premiere, Davinci Resolve, Reason and Media Composer.
specs: |-
  - Automatically estimates correction filter that evens out the frequency spectrum
  - Removes resonances and comb filter effects
  - Predefined target profiles include music, speech and an automatic mode that extracts timbre from the input signal
  - Correction filters can be saved and used as a reference for matched equalization
  - Adjustable length of the correction filter from 1 to 20 milliseconds
  - Frequency spectrum representation of the correction filter, input signal and output signal
  - Frequency emphasis filter for the level of correction
  - Customizable correction curves for frequency-selective processing
  - Dual real-time spectrum analyzers for clear visual feedback
  - Available as VST, VST3 or AAX plug-in on PC (Windows)
  - Available as VST, VST3, AAX or AU plug-in on Apple Macintosh (macOS)
  - Windows version available as native 32 bit or 64 bit; Mac version is 64 bit
  - Supports sampling rates up to 96 kHz
  - Supports surround and immersive multi-channel audio up to 7.1.6 channels
  - Windows requirements: Windows 10 / 11, Intel Core i3 or AMD multi-core processor (Intel Core i5 or faster recommended), 1366 x 768 display resolution (1920 x 1080 or higher recommended), 1 GB RAM (4 GB or more recommended), 1 GB free HD space
  - macOS requirements: OS X 10.13 or later, runs natively on ARM64 and Intel, 1 GB RAM (4 GB or more recommended), 1 GB free HD space
  - AAX requires Pro Tools 2018 or later
