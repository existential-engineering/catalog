name: Waveform
manufacturer: tracktion
primaryCategory: daw
description: Waveform is Tracktion's digital audio workstation, a single-window
  DAW with real-time audio warping and a large bundled library of instruments,
  effects and presets, offered as a free edition and a paid Pro version.
details: |-
  Waveform is designed around an uncluttered single-screen workflow, keeping the
  interface out of the way rather than adding every possible feature. Real-time
  audio warping reshapes samples and loops on the timeline, and the bundled
  plug-in library covers instruments, effects and presets for writing and
  finishing tracks.

  Waveform Free is a no-cost edition that can be extended with feature expansion
  packs and content sound packs bought separately. Waveform Pro is the full
  version, sold in bundles that include the built-in effects and instruments,
  the DAW Essentials and Artisan collections, Collective 2, BioTek 3, Auto-Tune,
  Melodyne Essential, elastique Pro, the Imagina drum loop library, and a set of
  expansion sound packs and feature expansion packs.

  On Linux the Pro features are unlocked automatically, so the Waveform Free
  installer is the starting point on that platform. A 30-day unlimited trial is
  offered.
specs: |-
  - Single-window workflow
  - Real-time audio warping
  - 38 built-in audio effects
  - 10 built-in MIDI effects
  - 11 utility plug-ins
  - 10 built-in instruments
  - Feature expansion packs for recording, MIDI, synthesis, DJ and video work
  - Clip launcher and multi-channel expansion packs
  - Free and Pro editions
  - 30-day unlimited trial
