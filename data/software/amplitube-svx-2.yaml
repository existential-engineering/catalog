description: Ik was the first to bring the legendary tone of some of the most
  iconic bass amps and cabinets ever created to the modeling software world.
details: >-
  Ik was the first to bring the legendary tone of some of the most iconic bass
  amps and cabinets ever created to the modeling software world with our
  acclaimed official amplitube svx collection. The new amplitube svx 2
  collection brings even more power to the game giving you the opportunity to
  expand your collection with 6 additional gear models that raise the bar once
  again in terms of unprecedented sonic authenticity.


  Amplitube svx 2 collection is based on ik's latest exclusive dynamic
  interaction modeling technology, which uniquely recreates the fine
  interactions of complete internal circuit stages of the original models, thus
  reproducing their unmistakable vibe and dynamics down to their finest nuances.


  Features: 3 new amps (svx-vr, svx-4b, svx-15n). 3 new matched cabinets
  (svx-810a, svx-212, b-15n 115). Exact recreations of the originals thanks to
  ik's 20 plus years of modeling experience. Based on our breakthrough dynamic
  interaction modeling technology.


  Available la carte inside the custom shop or as a whole collection. Available
  as part of the svx power duo bundle (including amplitube 4, svx and svx 2).
  Perfect companion for modo bass for mac/pc. Runs inside any version of
  amplitube 4.3 or later (free or paid version). Expandable with more gear
  models via amplitube custom shop.


  Windows (64-bits) minimal: intel core 2 duo or amd athlon 64 x2, 2gb of ram (4
  gb suggested), windows 7, windows 8 or windows 10. Requires an asio compatible
  sound card. Supported plug-in formats (64-bit): VST 2, VST 3, AAX. Mac
  (64-bits) minimal: intel core 2 duo, 2 gb of ram (4 gb suggested), mac os x
  10.7 or later. Supported plug-in formats (64-bit): audio units, VST 2, VST 3,
  AAX. Internet connection is required as all of the custom shop operations are
  web based.
