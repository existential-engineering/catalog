description: Virtual Space Reverb
details: |-
  Spacerek is a compact and intuitive reverb plugin that creates amazingly authentic real-world spaces without bogging users down in complex parameters. Its hybrid algorithm fuses modelled virtual spaces with a dynamic delay network, generating reverb tails with supremely realistic early reflections and dense, colourful late reflections.

  Early reflections are generated through painstakingly accurate simulation of a diverse range of real-world spaces, along with the positioning of speakers and microphones within them, at surprisingly low CPU cost. Late reflections are built up by a responsive dynamic delay network that blends seamlessly with the early-reflection engine. Independent Early and Late reflection pre-delay controls allow up to one second of start-time offset, adjustable down to microsecond precision.

  Spacerek's expansive roster of modelled rooms — from booths, chambers and halls to tunnels, chapels and towers — can be switched between at a click. Its three component signals (Direct, Early reflections, Late reflections) come together in a straightforward three-channel mixer, with stereo positioning available in left-right or mid-side mode.
specs: |-
  - Hybrid reverb algorithm: modelled virtual spaces plus dynamic delay network
  - Diverse roster of modelled real-world room types
  - Independent Early/Late reflection pre-delay controls (up to 1 second)
  - Three-channel mixer for Direct, Early and Late reflection signals
  - Left-right or Mid-Side stereo positioning
  - Low CPU cost relative to reflection quality
