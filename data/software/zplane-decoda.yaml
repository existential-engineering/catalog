description: Import audio files and DECODA will help you learn the songs faster than ever. DECODA will tell you the key, tempo and chords and also point out sections like verse and chorus and much more.
details: |-
  Import an audio file and DECODA will tell you the key, the tempo and chords as well as identifying verse, chorus and other sections of the track.

  Dive deeper with DECODA's easy-to-use tools to help you really perfect playing a song. Bring the tempo down to hear nifty musicianship or change the key of the song to find one that's more suited to your playing or singing style.

  An intuitive Focus EQ helps you identify parts of the song that you want to filter out or hear isolated.

  DECODA was inspired and informed by professionals in the music and recording industry to help you learn songs faster and easier than ever. DECODA is powered by the same technologies that are used by leading music-makers and producers all over the world.
specs: |-
  - Quickly find the key, tempo and chords of any song with zplane's advanced analysis algorithms
  - Learn to play songs in parts thanks to flexible looping options
  - Automatic song structure detection, to quickly identify intro, verse, chorus etc.
  - Transpose parts or the entire track to hear any song in a key that suits you better
  - Change tempo without changing the pitch, thanks to zplane's élastique algorithm
  - Use the Focus EQ to isolate individual sounds, honing in on frequency and stereo information
  - View the parts of the song on a piano roll display
  - Export MIDI parts from song audio for use in your own DAW
  - Supports multiple audio file formats: WAV, AIFF, MP3, WMA, FLAC and OGG
  - Runs as a standalone application on both Mac and Windows devices
  - Native compatibility with Apple M1 processors
  - Minimum system CPU: 2GHz
  - Supported plugin formats: VST2, VST3, AU (macOS only)
  - Supported operating systems: Windows 10 & 11 (64bit), macOS 13 or later (64bit Intel & Silicon)
