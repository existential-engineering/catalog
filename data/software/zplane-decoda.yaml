description: Song deconstruction tool for analysing and learning songs. Automatically detects key, tempo, and chords, and identifies song structure sections such as intro, verse, and chorus.
details: |-
  DECODA is a standalone song deconstruction and learning tool designed for musicians who want to analyse and learn songs by ear. It automatically detects key, tempo, and chord progressions from any audio file, making it easy to understand the harmonic structure of a track.

  The software identifies song structure sections — intro, verse, chorus, bridge, and more — allowing users to navigate and loop specific parts of a song with ease. Flexible looping modes support focused practice on challenging passages.

  DECODA includes tempo adjustment without pitch alteration, powered by zplane's élastique time-stretching algorithm, and key transposition for practising in different keys. A Focus EQ lets users isolate specific frequencies or stereo positions to hear individual instruments more clearly.

  A built-in piano roll displays detected chords visually and supports MIDI export, enabling users to bring chord data into a DAW or notation software. A bookmark system helps with navigation across longer tracks.

  DECODA is available as a standalone application for macOS and Windows, and also ships as AU, VST2, and VST3 plugins so it can be used inside a DAW host. Native Apple Silicon support is included.
specs: |-
  - Automatic key, tempo, and chord detection
  - Song structure identification (intro, verse, chorus, bridge, etc.)
  - Flexible looping and practice modes
  - Key transposition
  - Tempo adjustment without pitch alteration (élastique algorithm)
  - Focus EQ for frequency and stereo isolation
  - Piano roll display with MIDI export
  - Bookmark navigation system
  - Supported audio formats: WAV, AIFF, MP3, WMA, FLAC, OGG
  - Minimum CPU: 2 GHz
  - Windows 10/11 (64-bit) or macOS 13+ (Intel and Apple Silicon)
  - AU format requires macOS
