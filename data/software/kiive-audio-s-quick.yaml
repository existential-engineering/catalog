description: A console-style channel strip plugin offering saturation, EQ,
  compression, and transient shaping in one quick-to-use tool.
details: |-
  The S-Quick strip is easy to use, making it the perfect plugin to throw on a track if you're in a hurry. Use it as a console-style insert to quickly add saturation, EQ, compression, and transient manipulation to any mix! The S-Quick Includes a polarity flip button, two circuits of saturation, a highpass filter, a two band EQ with shelf and bell options, one knob compressor with auto makeup gain, a transient designer, saturation wet and dry mix, and a compressor sidechain.
