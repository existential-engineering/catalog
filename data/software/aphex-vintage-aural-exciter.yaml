details: |-
  When it was originally introduced in the mid-1970s, the aphex aural exciter
  brought its distinctive sound to select sessions by leading recording artists,
  traveling from studio to studio as an exclusive (and expensive) rental unit. A
  true ground-breaker, the original aural exciter was highly regarded for its
  ability to increase and enhance presence, brightness, and vibrancy on vocal
  and instrumental tracks alike.

  Modeled on one of only a few tube-powered units ever made, the waves aphex
  vintage aural exciter plug-in delivers all the unique character of the rare
  original hardware unit, with all the advantages of software.

  Faithful model of the rare tube-powered original. Adds brightness, vibrancy
  and depth. Increases presence without raising levels. Perfect for vocal and
  instrumental tracks alike.

  Mix and ax modes for insert or send configurations. Mono and stereo
  components. Up to 24-bit/192khz resolution.
specs: |-
  - 24-bit/192khz resolution
  - Mono and stereo components
  - Mix and ax modes
  - Mode selector (mix1, mix2, ax)
  - Meter selector (vu meter view options)
  - Input gain control
  - Ax mix control
  - Output gain control
  - Mains control (analog characteristics/hum)
  - Noise control (modeled analog noise level)
