details: |-
  Digitally developed in collaboration with JHS, the NÖTASPRING reimagines the classic spring reverb with a modern approach. Designed for mono and stereo sources, it offers everything from subtle ambience to cavernous textures with intuitive reverb length, EQ, and mix controls. By meticulously modeling the tonal characteristics of vintage spring tanks, we've captured the unmistakable depth, warmth, and movement of classic reverb in a streamlined, digital format. Introducing, MixWave: JHS NÖTASPRING .
