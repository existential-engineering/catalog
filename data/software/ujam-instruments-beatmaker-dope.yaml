description: Beatmaker DOPE is your fast-track ticket to the underground world of slick Hip Hop beat production, delivering golden era boom bap beats without digging through crates.
details: |-
  DOPE gives you the crunchy drums, head-nodding swing, and gritty vibe of 90s boom bap, without spending hours digging through old records. Load it up, press play, and spit fire.

  Dirty kicks, dusty snares, and real boom bap feel deliver instant street-ready beats with attitude. A "Vinyl Drive" tone control sets the grit, and Micro Timing dials in the swing, across 10 boom bap kits and 20 styles with 460 patterns.

  DOPE is one of 17 genre-focused drum instruments in the Beatmaker series, all hosted inside a single Beatmaker plug-in that is installed by the UJAM App with your first Beatmaker title.
specs: |-
  - 10 boom bap drum kits
  - 20 styles, 460 patterns
  - "Vinyl Drive" tone control
  - Micro Timing for swing
  - MIDI drag and drop
  - Royalty-free MIDI phrases and sounds
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 0.96 GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, 64-bit only
  - Automated installation via the UJAM App, which also installs the Beatmaker plug-in that hosts all titles
  - Authorization via the UJAM App
  - Supported standards: MIDI
