details: |-
  Ample china dongxiao (acdx) is built on the latest development of the woodwind sample engine, with 4.8 gb samples, including head and body articulations, fx sounds, as well as a select collection of improvised licks. The artist: xiaokui ding (china national traditional orchestra). The instrument: deep blue sea series g key dongxiao (linqiu zhong masterbuilt).

  Sampling: recorded with 5 mics (front, middle, back, stereo ambient). Each mic volume is adjustable and equipped with channel eq. 3 mic modes: mono, modern and traditional, capable of colorful sound designs. There are 3 kinds of articulations head group (blue keyswitches), body group (yellow keyswithces) and special effect group (red keyswitches). Each group occupies one octave.

  The woodwinds have great dynamic range and timbre variation. The sample library provides 5 velocity layers, with sound from mildly soft to bright and strong. There are 2 velocity layers for expression articulation, 2 velocity layers for vibrato articulation, and real samples of trill sounds. Together with sahds virtual modulation system, they can create vivid and realistic notes.

  Features: intelligent legato system detects the duration of each note. For legatos whose duration is less than this value, only the straight legato will be triggered to ensure that no unwanted grace notes are generated during fast performance. Hold pedal can be used to turn on double legato mode. The body group can be used for endless articulation legatos. Creative mirroring feature: playing the keyswitch when a note is sounding will reverse the sample at current position. Voice independent sahds modulation system: each voice has its own sahds modulation envelope.

  Fx: high order 8-band eq with intuitive control of frequency response and real-time visualization of input and output spectrum. 2-line compressor with real-time visualization of input and output signal, two detection modes rms & peak, support of soft knee, auto release and auto makeup. 6-tap echo with real-time visualization of the processing of stereo signal. Ir reverb, providing four types of ir: room, studio, hall, and larger hall with 3d visualization of ir spectrum.
