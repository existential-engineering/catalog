details: |-
  n-Track Studio is a digital audio workstation from n-Track Software, now at version 10 and marking the product's thirtieth anniversary. One licence covers the Windows, macOS and Linux desktop builds, and separate iOS and Android versions let a song started on a phone or tablet be carried across to the desktop for detailed editing.

  Recording and playback handle a virtually unlimited number of audio and MIDI tracks, with 64-bit double precision processing, sampling rates above 192 kHz and multi-soundcard recording and output. Mixing covers up to 32 aux channels with automated sends and returns, and surround formats of 5.1, 6.1 and 7.1.

  Composition tools include a piano roll, a step sequencer for beats and arpeggios, and melodic, drum, multilayer and slicer samplers that accept custom sound imports. Around 15 GB of royalty-free loops, projects and samples ship with the application.

  Built-in processing runs to more than 30 effects, among them reverb, compression, parametric and graphic EQ, a denoiser, guitar and bass amp simulation, the VocalTune pitch correction tool, a vocal harmoniser and the Convolverb convolution reverb. AI MixSplit separates a finished song into individual stems.

  Third-party plugins are supported in VST, VST3, CLAP, DirectX on Windows, AU on macOS and ReWire. Projects can be moved between applications through DAWproject import and export, and the Songtree community is integrated for collaboration.
specs: |-
