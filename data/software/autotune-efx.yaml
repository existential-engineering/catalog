details: |-
  Auto-tune efx+ is a versatile new vocal production tool, which combines the
  core features of auto-tune with the powerful auto-efx multi-effects rack, and
  auto-motion pitch-shifting melodic pattern generator.

  It includes professional quality auto-tune pitch correction with low latency
  processing for real-time performance on stage or in the studio.

  Fully adjustable retune speed and humanize parameters let you fine-tune the
  desired effect for your tracks, from transparent pitch correction to the
  iconic auto-tune effect.

  Compatibility with auto-key (sold separately) means never having to worry
  about finding the key of your music before tuning. Auto-key detects the key
  and scale and sends that information to auto-tune efx+ with a single click.
