details: |-
  Stardust 201 Tape Echo is a hot-rodded interpretation of the classic
  tape echo effects of the 70s and 80s. Compared to earlier tape echoes,
  they represented a giant leap in reliability and sound quality.

  Stardust precisely recreates the limited fidelity and stability of audio
  tape, providing a natural rolloff of bass and treble frequencies for
  super-warm tonality and minor speed variances, lending an organic
  chorusing quality to repeats.

  Cherry Audio's Stardust 201 Tape Echo includes features from the
  original RE-201 and RE-301 units, with additional enhancements to
  create a great-sounding, super-flexible, ideal tape echo effect.
specs: |-
  - Seven virtual tape head modes
  - 4x-extended wide mode delay time range
  - LFO echo time modulation section
  - Sync to DAW master tempo
  - Exclusive motor kill switch
  - True-stereo modeled BBD chorus circuit
  - Modeled input overdrive for crunchy tones
  - Dual independent tape loops for stereo imaging
  - Stereo spring reverb
  - 1X, 2X, and 4X oversampling
  - Selectable mono/stereo modes
  - Bass and treble EQ controls
  - User-selectable color themes
