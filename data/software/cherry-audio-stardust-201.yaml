details: |-
  Stardust 201 Tape Echo is a hot-rodded interpretation of the classic tape echo effects of the 70s and 80s. Compared to earlier tape echoes, they represented a giant leap in reliability and sound quality. With solidly built tape-transport mechanisms and the inclusion of a spring reverb and chorus effects in some models, the classic tape echo boxes covered a wide variety of sound colors.

  Stardust recreates the limited fidelity and stability of audio tape, providing a natural rolloff of bass and treble frequencies for warm tonality and minor speed variances, lending an organic chorusing quality to repeats. Cranking the intensity knob overloads the circuit, generating the signature other-worldly runaway echoes and feedback that only a tape echo can produce.

  Stardust 201 Tape Echo includes features from the original RE-201 and RE-301 units, plus additions such as a 4x-extended delay time range, an LFO echo time modulation section, a motor kill switch, dual independent tape loops and oversampling.

  Stardust 201 Tape Echo is available in AU, VST, VST3, AAX, and stand-alone formats. A free 30-day demo is available, which plays white noise periodically but is otherwise unlimited. An internet connection is required for product activation.

  macOS requirements: 10.13 or above, macOS 13 Ventura supported, 64-bit required, native Apple M1 or greater processor support including Ultra. A 3.4 GHz quad-core or M1 CPU with 8GB of RAM is recommended. Windows requirements: Windows 7 or above (including Windows 11), 64-bit required, quad-core computer with 8GB of RAM recommended.
specs: |-
  - Authentically modeled vintage tape echo, including seven virtual tape head modes
  - 4x-extended "wide mode" delay time range
  - LFO echo time mod section
  - Sync to DAW master tempo
  - "Motor kill" switch
  - True-stereo modeled BBD chorus circuit
  - Modeled input overdrive
  - Dual independent tape loops for wide stereo imaging
  - Stereo spring reverb
  - 1X, 2X, and 4X oversampling
  - Selectable mono/stereo modes
  - Bass and treble EQ controls
  - User-selectable color themes
