details: |-
  B4 is an emulation of the hammond b3. It functions as a virtual instrument
  audio plugin for macOS and Windows, available as a VST plugin and an audio
  units plugin, and can be used as a standalone application.

  Features include 9 drawbars per manual and 6 drawbars for the pedals,
  adjustable keyclick and flexible percussion. Tube amplifier and speaker
  cabinets are engineered using dynamic tube response technology. Scanner
  vibrato/chorus, rotary speaker, and tube amp distortion and overdrive are
  included.

  The plugin offers integrated spring and studio reverb units, audio input when
  used as an effects plug-in or standalone, 120 presets and 11 alternative
  tonewheels sets. Intuitive MIDI controller integration includes MIDI learn and
  controller templates.

  Pedal legato and string bass modes make sophisticated playing techniques easy.
  The interface provides two views: a top-down view of a hammond b3 and a
  controller-only view with the drawbars, rocker switches and other controls for
  microphone distance, overdrive, and additional parameters.

  The b4 includes all the features of a hammond b3, including bass pedals, v1-3
  and c1-3 vibrato, braked, chorale and fast leslie, overdrive, and adjustable
  microphone distance. Additional tonewheel sets provide vox, farfisa, and
  harmonium sounds.
