details: |-
  MKSensation Xtreme is a powerhouse standalone live performance and VST/AU/AAX instrument designed for professional gigging musicians and producers. Built around an authentic and richly sampled classic electric piano sound set with a Bread & Butter palette, it gives you full performance automation, preset/patch control, layering, and expressive control in one plugin. This live performance monster delivers everything you need to play, automate, and transform classic keyboards, pads, synths, basses, and more, with deep control and a highly musical feel that suits gospel, R&B, soul, funk, pop, and live band settings alike. 🔥 Core Performance Features

  🎹 Signature Sound Set

  🎛️ Performance & Workflow Highlights

  🎶 Ideal For

  MKSensation Xtreme is perfect for:

  ⭐ Summary

  If you're searching for a **standalone performance powerhouse** and **multi-layered VST instrument** that delivers classic electric piano character, deep automation control, and a massive sound palette, MKSensation Xtreme stands out as the go-to choice for gigging pros and creative musicians alike.
specs: |-
  - Standalone & Plug-in Works as a standalone instrument or inside your DAW (VST/AU/AAX) for flexible live and studio use.
  - Full Automation Control Automate performance parameters and expression in real time for dynamic and evolving sounds.
  - Preset & Patch Switching Quickly change presets on the fly with MIDI CC or live patch buttons.
  - Eight Layer Stacking Stack up to eight independent sound layers for massive, rich multi-timbral setups.
  - Dedicated Live Mode Quick preset loading and live-set buttons optimized for performance flow.
  - Split & Zone Mode Create left-hand bass / right-hand lead splits with ease.
  - MIDI Learn Everywhere Map knobs, sliders, and buttons to your controller for tactile control.
  - Effects & Plugin Hosting Load your own effects or instruments in slot chains alongside MKSensation's sounds.
  - Fast Streaming Engine Optimized low RAM usage with near-instant sound load times.
  - Multi-Channel MIDI Receive and route on separate MIDI channels for multi-timbral control.
