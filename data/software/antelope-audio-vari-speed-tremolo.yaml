details: |-
  Tremolo – the modulation effect that started it all. Before the first tremolo units came built into vintage amplifiers, nobody knew what guitar effects were.

  A simple concept it may be, but the tremolo went on to define the iconic sound of surf guitar and spurred a wave of innovation among musical equipment builders.

  Antelope's Synergy Core-powered Vari-Speed Tremolo presents a fresh and versatile take on vintage tremolos with its 5-position Wave Selector and the addition of a Vari-Speed Rate knob.

  By adjusting how quickly the frequency of the modulator wave varies, you can spice up your tremolo effects with a welcome touch of unpredictability.

  Runs natively in your DAW on macOS or Windows, or in real-time on a Synergy Core interface. Included in the Antelope Cosmos subscription (75+ Antelope Native Plugins).
specs: |-
  - Bypass Button: toggle the effect on and off
  - Wave Selector: choose between Sine, Triangular, Square, Sawtooth, and Inverted Sawtooth modulation waves
  - Rate knob: adjust the modulation speed
  - Vari-Speed Rate knob: adjust how quickly the frequency of the modulator wave varies
  - Depth knob: adjust the amount of volume (amplitude) modulation
  - Mix knob: blend the Dry (unaffected) and Wet (processed) signals
