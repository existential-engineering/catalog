description: Degrader is a combined resampler and bitcrusher plugin. It can be
  used to simulate the sound of vintage digital gear, as a lofi-effect or
  distortion unit.
details: |-
  Degrader is a combined resampler and bitcrusher plugin. It can be used to simulate the sound of vintage digital gear, as a lofi-effect or distortion unit. Since all parameters are fully automatable it's a handy plugin for creating unique and interesting drops, sweeps and other transitions.

  The filter section chooses a low pass filter character before and after resampling (off, low-q, high-q), with the frequency fixed to half the sample rate value.

  The resampler controls the amount of jitter, plus any sample rate between 250 Hz and 96 kHz.

  Bit depth can be pushed as low as 3 bits of low resolution, and an additional saturation stage is available when that is not enough.

  Input and output controls trim the gain levels, a blend control sets the mix with the unprocessed signal, and the Power button A/B-tests the effect.
specs: |-
  - Resamples between 250 Hz and 96 kHz
  - Low pass filter with different characteristics both pre and post resampling
  - Bit depth can continuously be altered between 3 and 24 bits
  - Additional distortion algorithm
  - Parameter linking (control several parameters with one knob)
  - Input and output gain control
  - Dry / Wet mix
  - Several factory presets simulating different vintage gear
  - Requires macOS 10.10 or later (optimized for the M1-processor), Windows 7 (SP1) or later, running an AU, VST or AAX compatible 64-bit host
  - iPad version available as AUv3
