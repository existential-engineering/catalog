details: |-
  Applications: voice removal: mute lead voices to allow singing over backing
  track (I.e. For karaoke). Musical analysis of recordings: isolate riffs and
  solos in a song; listen carefully to single instrument performances and find
  out what effects they use. Remixing: extract sounds from your favourite songs;
  copy them into different tracks; create personal remixes.

  Main features: pan filter: extract sounds with different panning.
  Phase-difference filter: extract sounds without stereo reverberation.
  Frequency filter: extract frequency bands. Dual operation mode (solo/mute):
  choose whether to listen or mute the selected sounds.
specs: |-
  - Real-time VST plug-in
  - Pan filter
  - Phase-difference filter
  - Frequency filter
  - Dual operation mode (solo/mute)
  - Audio separation
  - Windows compatible
