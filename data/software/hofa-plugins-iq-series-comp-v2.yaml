description: IQ-Series Comp V2 is a compressor plugin with two compression styles (Calm and Rough) that uniquely links gain reduction to an integrated tone control, letting the colour EQ follow the compression. It automatically adapts settings to the material for vocals, drums, bass and mastering, controlled via an interactive display.
details: |-
  The HOFA IQ-Series Comp V2 is the world's only compressor that links gain reduction to an integrated tone control. The groundbreaking ColourEQ connection means the plugin constantly adjusts relevant settings automatically according to the material, making it suitable for processing vocals, drums, instruments, bus channels, and master tracks.

  Two distinct compression styles — CALM and ROUGH — let users choose between transparent and characterful processing. The ColourEQ contains shelving and peak filters with colour presets for fast results in common applications. Gain reduction is directly tied to the EQ, so the frequency adjustments respond dynamically to how hard the plugin is compressing.

  An intelligent/adaptive mode automatically manages attack, release, and ratio, while a look-ahead function preserves transients. Sidechain filtering prevents unwanted pumping, and parallel compression is supported. The plugin operates in mono, stereo, dual mono, and M/S (Lat/Vert) modes.

  A gain reduction and frequency reduction display provides visual feedback for optical control. The plugin supports all common sample rates and is licensed via the HOFA Plugins Manager, with offline activation supported and two licenses included per purchase. A 14-day free trial is available.
specs: |-
