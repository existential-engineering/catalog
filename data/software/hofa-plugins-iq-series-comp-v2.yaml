description: IQ-Series Comp V2 is a compressor plugin with two compression
  styles (Calm and Rough) that uniquely links gain reduction to an integrated
  tone control, letting the colour EQ follow the compression. It automatically
  adapts settings to the material for vocals, drums, bass and mastering,
  controlled via an interactive display.
details: |-
  If you're looking for new timbres and the best compression for vocals, drums, bass and mastering, this plugin is a must-have. Two different compression styles, CALM & ROUGH, give full control over the sound of the compression, with the compressor reduction controlling the colour EQ and an interactive display making it easy to use.

  The HOFA IQ-Series Comp is the world's only compressor that can link the gain reduction to the integrated tone control. This feature allows you to boost the bass frequencies of a vocal in loud sections, for instance, or lets you create completely new tones that depend on the gain reduction, e.g. when compressing drums.

  We equipped the IQ-Series Comp with the intelligence to achieve perfect results for all possible audio signals. Whether you're processing vocals, drums or other instruments, bus channels or the master: the HOFA IQ-Series Comp constantly adjusts relevant settings automatically according to the material. Based on your initial settings, you'll get the best sounding compression ever.

  Applications include vocals and instrument tracks that cut through the mix without technical artefacts, warm or colourful and experimental compression sounds, solid transient-heavy drum sounds even with very dynamic material, and 'triggered EQ' when mixing real drums, so the hihat remains quiet while the snare is compressed even if a lot of high frequencies are added.

  For mastering it offers surgical processing options, including the ColourEQs with M/S processing, parallel compression and look ahead, plus look ahead compression and oversampled clipping for maximum loudness on rock and pop material, and two sidechain filters for compression without pumping.
specs: |-
  - Groundbreaking link between gain reduction and ColourEQs
  - Precise EQing depending on the compressor's gain reduction
  - The ColourEQ contains shelving and peak filters
  - Colour presets for fast results in the most common applications
  - EQ look ahead for maximum transient punch
  - Intelligent / adaptive attack, release and ratio
  - Adaptive AUTO mode
  - Two compression types: CALM & ROUGH
  - Easy to use, clear interface
  - Optimised for maximum compression with minimal artefacts (in your face compression & classic 80's British console bus compression)
  - Mono, stereo, dual mono, M/S (Lat/Vert) operation modes, sidechain and parallel compression
  - Look ahead to catch transients
  - Sidechain filter for compression without pumping
  - Gain reduction and frequency reduction display for optical control
  - 'Set as default' preset
  - Supports all common sample rates
  - Two licenses included, managed via the HOFA Plugins Manager, with offline activation supported
  - Operating system: macOS 10.13 or later, Windows 10 or later
