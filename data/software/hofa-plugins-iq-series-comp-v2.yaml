  - 2 compression styles: CALM & ROUGH
  - ColourEQ with shelving and peak filters linked to gain reduction
  - Colour presets for common applications
  - Intelligent/adaptive attack, release, and ratio
  - Adaptive AUTO mode
  - Look-ahead for transient preservation
  - Sidechain filtering to prevent pumping
  - Parallel compression support
  - Operation modes: mono, stereo, dual mono, M/S (Lat/Vert)
