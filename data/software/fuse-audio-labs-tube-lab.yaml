description: A vintage channel strip plugin featuring a multi-tube preamp with five classic tube types, a Baxandall-style EQ, and an optical leveler for adding analog warmth and density to any track.
details: |-
  Tube Lab combines three reorderable modules into a flexible channel strip. Preamp section: five selectable tube types — 12AT7 (crunchy), 12AU7 (smooth), 12AX7 (rich), 6DJ8 (detailed), 12DW7 (hybrid). Three-band Baxandall EQ: 5 selectable center frequencies per band, ±15 dB gain range. Optical leveler: Classic mode (compressor) or Modern mode (limiter), with threshold, mix, HF side-chain filter, and auto gain compensation. Module routing order is user-adjustable by drag — EQ and dynamics sections can be reordered relative to the preamp freely without gain-staging interruptions. Released 2026-04-02.
specs: |-
  - Controls: Preamp (tube select, drive, gain compensation), EQ (3-band Baxandall, 5 freq options per band, ±15 dB), Leveler (Classic/Modern mode, threshold, mix, HF filter)
