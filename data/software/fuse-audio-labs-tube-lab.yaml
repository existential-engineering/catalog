description: A vintage channel strip plugin featuring a multi-tube preamp with
  five classic tube types, a Baxandall-style EQ, and an optical leveler for
  adding analog warmth and density to any track.
details: |-
  Tube Lab combines three modules into a flexible channel strip: a tube preamp with five selectable tube models (12AT7 crunchy, 12AU7 smooth, 12AX7 rich, 6DJ8 detailed, 12DW7 hybrid), a three-band Baxandall equalizer (Bass, Mid, Treble each with frequency and gain controls), and an optical leveler for vintage opto compression. Module routing order is user-adjustable by drag — preamp, EQ, and leveler can be reordered freely without gain-staging interruptions. Designed to add analog character and cohesion to individual tracks and mix buses.
specs: |-
  macOS 10.12+ (Intel/Apple Silicon), Windows 7+, 2GB RAM, 1280x1024 display. Formats: VST2, VST3, AAX, AU.
