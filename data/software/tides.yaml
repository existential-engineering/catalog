  - Pitch shifting
  - Frequency shifting
  - Ring modulation
  - Additional delay processor
  - Stereo modulators
  - BLEASS v2 plugin engine
  - Delay visualiser
  - Interactive frequency shifting effects
  - Freeze button
  - Kill button
  - Touchscreen compatible
  - macOS support
  - Windows support
  - iOS support
