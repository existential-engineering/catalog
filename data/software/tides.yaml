description: BLEASS Tides washes away the dry, uninspiring echoes of
  conventional delay processors with wave after wave of richly characterful
  reflection.
details: |-
  BLEASS Tides washes away the dry, uninspiring echoes of conventional delay
  processors with wave after wave of richly characterful reflections. The
  plugin's fluid approach to delay processing means delay times can be altered
  without the unpleasant warping results produced by other delay processors,
  with the option of a controlled tape-like timing shift, or a simple crossfade
  between differently timed delays.

  Better still, with an enhanced modulation system provided by bleass' latest
  plugin technology, you can take full advantage of this delay time fluidity
  with stereo lfos, envelope followers and macro controllers that allow you to
  explore new horizons of exciting delay effects.

  An input filter combining low- and high-pass resonant bands allows you to
  easily mould the incoming signal and thereby sculpt the resulting echoes.
  Then, for even deeper and more exhilarating shaping, tides' feedback path
  features five insert points into which any of 11 different effect processors
  can be loaded. These include distortions, filters, pitch and frequency
  shifting, ring modulation, and even an additional delay processor, all of
  which can be brought to life with the plugin's stereo modulators.

  Tides is the first plugin to use bleass' v2 plugin engine, its reimagined
  interface design giving a crisp and clean look to the plugin whilst retaining
  the familiar and welcoming look and feel of previous bleass plugins. The new
  interface is as easy to use with touchscreens as it is with a mouse, and
  includes innovative interactive elements such as tides' delay visualiser that,
  when clicked with the mouse or touched with a finger, produces fascinating
  interactive frequency shifting effects.

  Further realtime interaction comes in the form of momentary freeze and kill
  buttons that are perfect for creating spontaneous, organic effects, whether on
  stage, on the go, or in the studio.
specs: |-
  - Stereo LFOs
  - Envelope followers
  - Macro controllers
  - Input filter with low-pass and high-pass resonant bands
  - Five insert points in feedback path
  - 11 different effect processors
  - Distortions
