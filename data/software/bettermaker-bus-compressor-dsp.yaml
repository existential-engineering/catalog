details: |-
  The Bettermaker Bus Compressor DSP is a digital emulation of Bettermaker's analog bus compressor, designed to add cohesion to drum, vocal, guitar, and stereo buses. It preserves transient material and maintains punch while gluing mixes together, delivering warmth and vibe particularly effective on raw studio recordings.

  The plugin includes all the essential controls of the hardware unit: Threshold, Ratio, Attack, and Release, along with an Auto Release mode that responds intelligently to musical content. Parallel compression is available via a Mix knob, and a Makeup Gain control supports both positive and negative adjustment.

  Sidechain capabilities include internal and external sidechain filtering with a high-pass filter and a midrange boost option to minimize unwanted pumping from bass frequencies. The plugin also functions as a de-esser tool, extending its utility beyond standard bus compression.

  VCA THD provides subtle saturation and additional harmonic content, while both Peak and RMS detection modes offer flexibility in how the compressor responds to incoming signal levels. Input, output, and gain reduction metering are included for precise monitoring.
specs: |-
  - Threshold, Ratio, Attack, and Release controls
  - Auto Release mode responding to musical content
  - Parallel compression via Mix knob
  - Makeup gain control (positive and negative)
  - Internal and external sidechain filtering with high-pass filter
  - Midrange boost sidechain option
  - VCA THD for subtle saturation and harmonic content
  - Peak and RMS detection modes
  - Input, output, and gain reduction metering
  - Factory presets included
  - Display resolution: 1440x900px or higher
