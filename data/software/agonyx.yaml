details: >-
  Agonyx by prodyon is a virtual instrument audio plugin for windows. It
  functions as a VST plugin.


  Features velocity-sensitive filters with 4 types and adsr envelope control, up
  to four oscillators per note with multiple waveform options including sine,
  saw, ramp, triangle, pulse and noise (white/pink), with individual pan, volume
  and pulse width controls for each oscillator.


  Includes detuning slider with -12/+12 semi-tuning for each oscillator,
  mono-mode, note glide, and variable bendrange capabilities.


  Effects section includes synced gate for rhythmic effects with 16 steps and
  adr-envelope, distortion with variable frequency/resonance, lofi with variable
  frequency, flanger with feedback/rate/modulation/lowcut, bpm-synced dual delay
  with steps/offset/lowcut and endless feedback, reverb with
  lowcut/damp/width/length and freeze-function, and lp/hp masterfilter.


  Modulation features include 4x34 modulation matrix, synced lfo with variable
  rate and waveform, random-mode (s/h), and free/retrigger lfo-mode, with one
  source able to control up to 34 targets.
specs: |-
  - Velocity-sensitive filters (4 types, with adsr)
  - Up to four oscillators per note
  - Sine, saw, ramp, triangle, pulse and noise (white/pink) waveforms
  - Individual pan, volume and pulse width for each oscillator
  - Detuning-slider, -12/+12 semi-tuning for each oscillator
  - Mono-mode
  - Note glide
  - Variable bendrange
  - Synced gate for rhythmic effects (16 steps, adr-envelope)
  - Distortion with variable frequency/resonance
  - Lofi with variable frequency
  - Flanger with feedback, rate, modulation and lowcut
  - Bpm-synced dual delay with steps, offset and lowcut
  - Reverb with lowcut, damp, width, length and freeze-function
  - Lp/hp masterfilter
  - Non-synced sine lfo for pitch
  - 4x34 modulation matrix
  - Synced lfo with variable rate and waveform
  - Random-mode (s/h)
  - Free/retrigger lfo-mode
  - VST plugin
  - Windows
