id: fcbmZACQ_Lbch-wFWd6SZ
name: Hydrogen
manufacturer: hydrogen
primaryCategory: drum-machine
categories:
  - sequencer
  - sampler
description: Hydrogen is a pattern-based drum machine and sample-based drum
  sequencer for Linux, macOS and Windows, usable for practice at home, studio
  work or live performance.
details: |-
  Hydrogen is both a drum sequencer for pattern-based programming and a drum
  synth. Its graphical interface is built with Qt, and its sample-based stereo
  audio engine imports sound samples in WAV, AU and AIFF formats as well as
  compressed FLAC.

  Patterns are unlimited in number and can be chained into a song, with up to
  192 ticks per pattern, variable pattern length and an individual level per
  event. Instrument tracks are unlimited and carry volume, mute, solo and pan
  controls, with multi-layer support of up to 16 samples for each instrument.
  Single and stacked pattern modes are available, several patterns can play at
  once, and patterns can be exported from and imported into song projects.

  A sample editor covers basic cut and loop work, and time-stretch and pitch
  functions run through the rubberband command line tool. Other facilities
  include a timeline with variable tempo, advanced tap tempo, a Director
  window with a visual metronome and song position tags, playlists with a
  scripting function, and human velocity, human time, pitch and swing
  functions.

  Audio runs through JACK, ALSA, PortAudio or OSS drivers, and MIDI input
  arrives over JACK MIDI, ALSA MIDI or PortMidi with an assignable input
  channel. MIDI learn is available on many interface controls, drumkits can be
  imported and exported, and a song can be exported to WAV, AIFF, FLAC or OGG
  audio, to a MIDI file, or to a LilyPond file.
specs: |-
  - Pattern-based sequencer with unlimited patterns chained into a song
  - Up to 192 ticks per pattern with individual level per event
  - Variable pattern length, single and stacked pattern modes
  - Unlimited instrument tracks with volume, mute, solo and pan
  - Multi-layer instruments with up to 16 samples each
  - Sample-based stereo audio engine reading WAV, AU, AIFF and FLAC
  - Sample editor with basic cut and loop functions
  - Time-stretch and pitch functions via the rubberband command line tool
  - Timeline with variable tempo and advanced tap tempo
  - Director window with visual metronome and song position tags
  - Playlists with a scripting function
  - Human velocity, human time, pitch and swing functions
  - JACK, ALSA, PortAudio and OSS audio drivers
  - JACK MIDI, ALSA MIDI and PortMidi input with assignable MIDI channel
  - MIDI learn on many interface controls
  - Import and export of drumkits
  - Song export to WAV, AIFF, FLAC or OGG, to MIDI, or to LilyPond
  - OSC API automation
