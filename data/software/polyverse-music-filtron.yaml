description: "A free 12dB state variable filter that can smoothly transition
  between lowpass, bandpass, and highpass modes. Features self-oscillating
  resonance, internal saturation, dual-mode overdrive, and stereo CV modulation.
  Optimized for audio-rate modulation with zero delay filter design and internal
  oversampling."
details: |-
  12dB state variable filter
  Smooth transitions between Lowpass, Bandpass, Highpass
  Self-oscillating resonance (up to +11)
  Fat internal saturation algorithm
  Dual-mode overdrive (Cold and Hot modes)
  Stereo modulation via CV input
  Integration with Gatekeeper plugin
  Audio-rate modulation optimization
  Zero delay filter design
  Internal oversampling
