description: Filtron is a 12dB state variable filter that can smoothly transition between lowpass, bandpass, and highpass. It is capable of self-oscillation with resonance levels that can reach up to 11.
details: |-
  Filtron is a 12dB state variable filter plug-in that transitions smoothly between lowpass, bandpass and highpass responses. The filter is capable of self-oscillation, with resonance levels the page describes as reaching up to 11, and it uses a zero delay filter design that is internally oversampled.

  The plug-in carries two stages of non-linear drive. An internal saturator has a warm, soft sounding curve, so the filter sounds different depending on the input level. A separate overdrive sits on the output with two modes, cold for a screaming overdrive suited to TB-303 style riffs and hot for a warmer, fuzzier character.

  Filtron's parameters can be modulated by a sidechain signal, which allows Control Voltage type signals such as LFOs and envelopes to drive the plug-in. Each channel in a stereo pair is treated as a separate modulation source and can be split to stereo, and the plug-in is optimized for audio rate modulation.

  Those CV signals can come from modular synthesizers or from dedicated CV generators, and Filtron was designed as a companion to Polyverse's Gatekeeper. The page places Filtron in a filter trilogy alongside Filterverse and Supermodal.

  Filtron is distributed at no cost and runs on Windows 64 bit and macOS 10.13 or later 64 bit, in VST2, VST3, AU and AAX formats.
specs: |-
  - 12dB state variable filter
  - Transitions smoothly between lowpass, bandpass and highpass
  - Self-oscillating resonance
  - Fat internal saturation
  - Post overdrive with cold and hot modes
  - Stereo modulation via CV
  - Integrates with Gatekeeper
  - Optimized for audio rate modulation
  - Zero delay filter design
  - Internally oversampled
  - Sidechain input treats each channel of a stereo pair as a separate modulation source
  - Supports VST2, VST3, AU and AAX plug-in formats
  - For Windows 64bit and OSX 10.13+ 64bit
