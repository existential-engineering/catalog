description: Filtron is a 12dB state variable filter that can smoothly transition between lowpass, bandpass, and highpass. It is capable of self-oscillation with resonance levels that can reach up to 11, and also features a fat sounding internal saturation algorithm and a sizzly post overdrive.
details: |-
  12dB state variable filter with smooth transitions between lowpass, bandpass, and highpass modes
  Self-oscillating resonance up to 11
  Fat internal saturation algorithm
  Post overdrive with Cold and Hot modes
  Stereo modulation via sidechain CV (Control Voltage) signals
  Audio rate modulation support
  Zero delay filter design
  Internal oversampling
  Designed as a companion for the Gatekeeper CV generator
