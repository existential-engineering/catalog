details: |-
  Auralis is the next instrument in the 2mgt suite of experimental synthesizers.
  Using MIDI files with their subsequent transformation through the pattern
  sequencer it adds extensive modulation and FX capabilities and turn it into a
  multi-layered compositions.

  Auralis has an extensive range of sound creation possibilities especially for
  ambient, cinematic, new age as well as others genre of electronic music.

  Auralis is a tool that allows you to create music content without much effort
  and expense. Auralis is free/donate. No installation is necessary, and it
  works without problems in windows xp and windows 10.
specs: |-
  - Pattern sequencer
  - Modulation capabilities
  - FX capabilities
  - MIDI file support
  - Multi-layered composition
  - Windows xp compatible
  - Windows 10 compatible
