description: RePAN analyzes the stereo field and separates it into several spatial slices, letting you change the volume and pan positions of each slice independently within a stereo mix in real-time.
details: |-
  RePAN analyzes the stereo field and separates it into several spatial "slices". This allows you to change the volume and pan positions of each spatial slice independently within a stereo mix in real-time.

  RePAN offers panning-based separation of stereo mixes, using AudioSourceRE's cutting edge Digital Signal Processing techniques. Adjust, rebalance, or equalise the stereo field in ways not previously possible.

  RePAN allows you to control how you want to hear the music mix, on the fly.

  Compatible with all major DAWs, including Pro Tools, Logic Pro X, and Cubase. RePAN is ideal for DJs, mash-up enthusiasts, as well as mixing and mastering engineers who want to tweak a mix without requiring the original stems.
specs: |-
  - Selectable number of spatial slices (3-7)
  - Adjustable spatial slice positions across the stereo field
  - Embedded output mixer to remix, re-pan, mute or solo each spatial slice
  - Real-time local processing
  - Available in AAX, VST3 and AU formats
  - Compatible with any Digital Audio Workstation software capable of hosting audio plug-ins such as Cubase 10, Logic Pro X, Pro Tools, Reaper, FL Studio, GarageBand, Ableton Live, Studio One, Waveform
  - Mac OS 10.13 and up
  - Windows 7 and up
  - 4 GB RAM (8 or more preferred)
  - Minimum CPU requirements - Core Duo 2.3GHz
  - iLok account required, with iLok cloud authorization available. Dongle not required.
