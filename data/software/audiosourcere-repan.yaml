description: AudioSourceRE's advanced RePAN plugin for splitting vocal and
  instrumental tracks within your favourite DAW.
details: |-
  RePAN is a unique audio separation plugin that analyzes the stereo field and
  separates it into spatial slices, enabling independent volume and pan
  adjustments of each slice in real-time without requiring original stems.

  Users can select between 3 to 7 spatial slices and adjust their positions
  across the stereo field. An embedded output mixer allows remixing, re-panning,
  muting, or soloing each slice independently.

  Unlike AI-based stem separators, RePAN works by analyzing stereo positioning,
  making it complementary to tools like VOXLESS and DRUMLESS. This spatial
  approach is particularly effective for isolating elements that occupy distinct
  positions in the stereo field.

  The plugin operates in real-time with local processing and is compatible with
  major DAWs including Cubase 10, Logic Pro X, Pro Tools, Reaper, FL Studio,
  GarageBand, Ableton Live, Studio One, and Waveform.
specs: |-
  - Stereo field analysis and spatial separation
  - Selectable number of spatial slices (3-7)
  - Adjustable spatial slice positions across stereo field
  - Embedded output mixer to remix, re-pan, mute, or solo each slice
  - Real-time local processing
  - Available in AAX, VST3, and AU formats
  - macOS 10.13+, Windows 7+
  - Minimum 4GB RAM (8GB+ preferred), Core Duo 2.3GHz CPU
  - iLok account required (cloud authorization, no dongle needed)
  - Compatible with Cubase, Logic Pro X, Pro Tools, Reaper, FL Studio, GarageBand, Ableton Live, Studio One, Waveform
