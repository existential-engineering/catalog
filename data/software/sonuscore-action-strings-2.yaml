description: Compose thrilling string parts with a range of articulations captured from multiple mic positions. Over 30GB of dynamic phrases that can be tweaked and blended in limitless combinations.
details: |-
  Action Strings 2 is a cinematic string instrument built on a large library of orchestral samples, delivering the sound of a 41-piece string orchestra with an extensive level of creative control. It combines the tension of violin and viola with the deeper tones of cello and bass across two separately configurable ensembles, high and low, covering everything from delicately emotive melodies to heavy blasts of power. Bow attack compensation technology aims at a realistic playing experience, while a dynamics envelope control draws sweeps from subtle diminuendos to towering crescendos.

  The instrument introduces Live Modules, mini-phrases recorded at different pitches and dynamic intensities and then combined into hundreds of phrases and themes. These building blocks can be fused in countless combinations, chopped up, duplicated and tweaked to create individual flourishes, runs and swells, so natural-sounding string parts keep a level of freedom a single-note library cannot offer. More than 160 themes are built from a bank of more than 900 interchangeable phrases, each of which can be edited freely or rebuilt from scratch on the editor page.

  Engine features include a Phrase Editor for arranging live modules and tweaking pitch, volume and rhythm, MIDI drag and drop of themes into the DAW as editable MIDI regions, Freeplay Mode for crafting note sequences in real time with a range of articulations, and Melody and Arpeggiator modes for pitching notes and modules up or down and turning simple chords into passages. The mixer page carries multiple mic positions and individual controls for both ensembles. The sounds were recorded by the Hungarian Studio Orchestra in TOM TOM Studio D and captured in detail from multiple mic positions, delivered with reverb and EQ effects.

  Update 2.2 is free to all owners and is shown as version 1.2.0 in Native Access. It brings 31 GB of dynamic phrases together with a Scaler feature that keeps performances in a chosen key across 20 scale types, a Custom mode for designing each step of a sequence, an 8va octaver, all live elements available as free articulations, undo and redo on the editor page, and 30 new themes with over 190 new phrases. The earlier update 2.1 added loop ending selection, solo keyswitches for the high and low ensembles, a phrase selector on the editor page, sustain pedal support, 40 new themes with over 280 new phrases, more complex low-end themes and more long articulations such as sustains, tremolos and trills. On a Komplete Kontrol keyboard, phrases can be toggled with the Light Guide and EQ, reverb and tempo parameters are mapped automatically.
