  - 41-piece string orchestra
  - 160+ themes with 900+ interchangeable phrases
  - Download size: 30 GB
  - Requires Kontakt Player 7.10.4+ or Kontakt 7.10.4+
  - Live Modules technology with Phrase Editor
  - MIDI drag & drop support
  - Freeplay Mode for real-time composition
  - Melody & Arpeggiator modes
  - Multiple mic positions with mixer controls
  - Scaler feature, Custom Mode, 8va Octaver (v2.2+)
  - Recorded by the Hungarian Studio Orchestra at TOM TOM Studio D
  - Recommended: Intel i7 processor or higher
