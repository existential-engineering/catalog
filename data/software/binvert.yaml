details: |-
  Binvert was originally meant to be a plain mix tool to handle phase problems
  when mixing several bass heavy channels, but the users seemed to use it mainly
  to deepen or sculpt the low end. Development have therefore been focused on
  the usability as a bass sculpturing tool even though the original
  functionality is still there.

  The result is a versatile tool that you can use either as originally intended,
  extreme bass drum sounds or for a subtle boost in the low end while mastering.

  Binvert takes the signal and splits in into two bands (split point is
  adjustable between 25-440hz). After the split there's a phase invert for both
  bands so you can invert the polarity of the two bands independently from each
  other. Problem fixed, the bass is still heavy and the mid/high transients stay
  crisp.

  You can also make that frequency resonate on either or both the upper and
  lower bands and you can also steer that extra energy with a adsr curve.

  Changes in 2.0: you can now disable the resonator in both bands. Added a
  simple brick wall limiter. Added a bypass button, easier handling for
  mastering purposes. Added a side chained adsr. Added the ability to totally
  turn off the bands. Added a incoming gain button. Added wet / dry control.
specs: |-
  - Dual-band splitting (25-440hz adjustable)
  - Phase invert for both bands
  - Independent polarity inversion
  - Resonator for upper and lower bands
  - ADSR curve control
  - Side-chained ADSR
  - Brick wall limiter
  - Bypass button
  - Incoming gain control
  - Wet/dry control
  - Band disable functionality
