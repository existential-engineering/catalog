description: An impulse response and convolution reverb expansion for iFX Rack
  that lets users load their own impulse files for amp and reverb emulation.
details: |-
  IMPULSation for iFX Rack is an impulse response/convolution reverb expansion pack that allows you to load in your own impulses for an an unlimited amount of reverb and amp possibilities. To give you an idea of the power of this app: There are literally hundreds of thousands of impulses freely available online and our app will load them all, given that it's properly formatted in either .wav or .aif format. Say for example you have an electric piano sound that you want to run through a classic Fender AMP. You do a web search for "Fender AMP Impulses" and pick from the thousands of possibilities. You will literally spend hours upon hours freely downloading all of the available spaces, amps, reverbs, and/or delays to use within your favorite AUv3 DAW. The technology of convolving and deconvolving is a method of putting in a signal through an amp, reverb unit, delay unit, or space and with sophisticated mathematical interpolations techniques, you can create a very close replica of the actual source. Our IMPULSation is specifically designed for AMPs, reverbs, delays, and spaces of which our code is optimized to detect which is being used. The detection allows us to optimize the signal for better CPU and for optimal sound.
