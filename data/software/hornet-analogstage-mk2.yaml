description: HoRNet AnalogStage MK2 is an analog console emulation plugin that re-creates those sound characteristics usually associated with analog gear
details: |-
  HoRNet AnalogStage MK2 is a console emulation plugin designed to bring the warmth and character of analog gear into the digital realm. It emulates the sound characteristics associated with classic analog equipment, such as saturation, hiss and non-linear frequency response, and can be applied on each individual channel or across the bus.

  The plugin simulates the behaviour of three distinct types of analog technology: operational amplifiers, transistor circuits and tube gear. The operational amplifiers are the cleanest and most modern of the three, offering transparency and accuracy for mixing tasks that require precision, while the transistor and tube models push the sound in progressively more coloured directions.

  An age control simulates the aging of the analog device, changing both saturation and frequency response, and an analog component tolerance emulation introduces the small variations that separate one physical channel from another. Saturation amount and hiss are freely adjustable and controlled separately.

  Input gain is adjustable from -20 dB to +20 dB, and a Mic mode adds a further +20 dB boost for heavy distortion. The channel also carries 6 dB/octave high pass and low pass filters, a phase reversal button, a stereo VU meter calibrated to -18 dBFS, and an adjustable automatic gain technology to keep levels consistent as saturation is pushed.

  Parameter changes can be sent to other instances on the same group or globally, which makes setting up a whole console quick. Intelligent oversampling keeps the plugin working internally at 192 kHz, and the vector user interface is freely resizable and stays sharp at every resolution.
specs: |-
  - Three different types of emulation: op.amp., transistor and tube
  - Parameter changes can be sent to instances on the same group or globally
  - Age control simulates the aging of the analog device changing saturation and frequency response
  - Adjustable input gain from -20dB to +20dB
  - 'Mic' mode for an additional +20dB boost to create heavy distortions
  - Stereo VU meter calibrated to -18 dBFS
  - Adjustable automatic gain technology
  - Separate saturation and hiss controls
  - Saturation amount and hiss freely adjustable
  - 6 dB/octave high pass and low pass filters
  - Phase reversal button
  - Analog component tolerance emulation
  - Intelligent oversampling that allows the plugin to always work internally at 192kHz
  - Vectorial user interface which is sharp on every resolution
  - Freely resizable user interface
  - Apple Silicon native support
  - macOS (10.11 and later) and Windows (Vista and later) support
  - 64-bit on Mac and Windows
  - Audio Units, VST, VST3 and AAX format
