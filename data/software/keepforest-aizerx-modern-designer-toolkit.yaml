details: |-
  Aizerx modern designer toolkit is based on the original, innovative,
  progressive aizerx engine with morphing-crossfade x-y pad and unlimited sounds
  randomization possibility, developed by Keepforest's team of professional
  sound designers and composers with a Massive experience in sound design and
  production.

  The main feature of aizerx modern designer toolkit is the smart samples
  randomization for creating absolutely unique and authentic sound effects with
  just one click, using the massive aizerx library of fully customizable modern
  sound effects of the highest quality in different categories like modern
  trailer hits, whooshes, benders, slo-mo, distortion basses, signals, downers,
  risers, noises, booms, etc.

  Aizerx modern designer toolkit also offers a deep sound customization with a
  lot of easy-to-use parameters like frequency filters, lfo, adsr, sample
  playback modes, channels mixer, loaded with all kind of effects like eq,
  reverb, delay, distortion etc., and a breathtaking xy pad feature.

  Aizerx modern designer toolkit is the best tool for composers for creating
  impressive, pro-level sound effects without having much experience in sound
  design.

  Aizerx - modern trailer toolkit includes: 10 trailer hip-hop, trap kits, 10
  trailer drive rock kits, 10 modern hybrid kits, 16 modern trailer sub hits,
  103 modern trailer hits (60 hybrid hits full, 43 hybrid hits + whooshes), 38
  slow motion hits, 19 tonal hits, 15 sub tonal hits, 19 distortion basses, 28
  braams, 24 signals, 14 risers, 10 mid bender sound design elements, 68 sub
  benders (4 distortion layers, 9 high layers, 15 low layers, 14 mid layers, 6
  noise layers, 12 pre-whoosh layers), 34 sub full (26 distortion basses, 8 sub
  benders), and 13 downers.
