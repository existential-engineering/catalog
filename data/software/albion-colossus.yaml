details: >-
  A new era in blockbuster scoring is upon us. Spitfire audio's most epic
  library yet, this gargantuan, all-in-one toolkit pushes contrast, dynamism and
  intensity to eleven elevating your scores to breathtaking new heights. This
  feat of musical engineering offers every element needed to seamlessly
  transport your scores from quiet suspense and tension, through to the most
  dramatic and epic of soundworlds with two complete orchestras, chamber and
  symphonic, heavy chugging guitars, a diverse, hard-hitting set of percussion
  and drum kits, and epic, widescreen synths expertly crafted for ultra-modern
  scoring.


  Spitfire audio has built albion colossus with this principle at its core
  moving from a delicate moment to powerful rage in a single patch. Build calm
  with close and small ensembles, explore flautando chamber strings, tense
  synths, dark and brooding guitars. Create the storm with a full symphonic
  orchestra, hard hitting percussion, epic synths, and six guitars re-amped
  through six stacks in a concert hall.


  Breaking the formula in this albion, the colossus plug-in allows spitfire
  audio to add much more dynamism to this sample library than previous
  instalments - delivering four dimensions of control, rather than the usual
  two. Accompanying the standard dynamic and expression faders are the brand new
  scale and depth controls. With these unique features you now have more dynamic
  and intensity control than ever before, simple to use and incredibly
  effective.


  Take control of a chamber orchestra (42 players) and a symphony orchestra (111
  players) across strings, brass and woodwind, and percussion, and seamlessly
  blend between the two to create new dynamism and intensity. Create impact with
  an ultra-modern and diverse selection of percussion from the traditional
  orchestral tuned and untuned to junkyard smashing and heavy-hitting drum kits.


  Recorded in the glasgow royal concert hall, the chamber was captured in the
  new auditorium, the symphony was captured in the main concert hall both
  captured using the same gear and players. Depth control mixes which move from
  super close signal, perfect for manipulation, to two more tree-based mixes, to
  a super wide and ambient mix. Hype enhance each preset differently, adding a
  selection of professional production knowledge to your sounds, from tape
  saturation, depth to distortion widening - push from loud to louder.
