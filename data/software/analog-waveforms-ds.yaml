description: Analog Waveforms Ds is a virtual instrument that uses at its core a
  sample set of a genuine analog synthesizer.
details: |-
  This is this raw sound that you can mix together, detune, filter and shape using onboard effects.

  Analog waveforms ds has been designed to be easy to use; all the parameters can be seen at a glance just like a lot of vintage analog synthesizers used to be.

  Analog waveforms ds requires decent sampler to run. Decent sampler is available for free as a VST/vst3/AU/AAX plugin instrument for windows, macos, and linux.
specs: |-
  - 4 multi-sampled analog synthesizer basic waveforms
  - Lowpass filter
  - Chorus and phaser modulation effects
  - Delay and reverb effects
  - Easy to use glide
  - Low-CPU usage
  - VST/VST3/AU/AAX plugin instrument
  - Windows
  - macOS
  - Linux
