description: Dual drive tube input channel and EQ plugin modeled after the Altec
  1567A tube mixer from the 1960s, with independent input/output stages and
  transformer loading options.
details: |-
  Radiator is a dual drive tube input channel and EQ plugin based on the classic Altec 1567A tube mixer from the 1960s. Originally a 5-input rack mixer with 97 dB of gain and removable transformers, the hardware was used extensively by Motown Records engineers.

  The plugin features independent input and output amplification stages, modeled bass and treble tone controls from the original hardware, and a mix control for parallel processing. Transformer loading options via a Mic/Line switch and optional vintage noise character toggle provide authentic analog character.

  Radiator includes Little Radiator, a simpler single-stage preamp model for quick tube warmth.
specs: |-
  - Hardware model: Altec 1567A tube mixer (1960s)
  - Independent input and output amplification stages
  - Modeled bass and treble tone controls
  - Mix control for parallel processing
  - Transformer loading options (Mic/Line switch)
  - Optional vintage noise character toggle
  - Includes Little Radiator (single-stage preamp)
  - 64-bit only, sample rates 44.1 kHz to 192 kHz
  - Apple Silicon compatible
