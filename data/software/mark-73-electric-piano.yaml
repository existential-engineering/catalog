details: >-
  Adam monroe's mark 73 is VST/AU/AAX plugin that reproduces the sound of a
  rhodes electric piano. Sampled via di inputs and through an amp, this library
  features 10 velocity layers, 3-note round robin, built-in tremolo, distortion,
  reverb, phaser, chorus, and delay.


  Version 2.5 of the plugin adds amplifiers based on spice vacuum tube
  simulations, convolution reverbs, cabinet impulse responses, and expanded
  controls for phaser, delay, and tremolo effects.


  Adam monroe's mark 73 electric piano by adam monroe music is a virtual
  instrument audio plugin for macos and windows.
