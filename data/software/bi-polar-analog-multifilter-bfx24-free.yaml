details: |-
  Bi-polar analog multifilter bfx24 is an analog effect / processor consisting
  of the emulation of 4 analog filters: low pass, band pass, high pass and band
  reject, with cutoff and resonance knobs.

  The cutoff value can be modulated by the bi-polar envelope follower, which
  modulates the cutoff value according to the input signal depending on the
  attack and release settings. The advantage is that, unlike conventional
  envelope followers, it can modulate in both directions.

  Bfx24 is excellent for effecting drums, percussion, guitars, synthesizers,
  live instruments, its use is practically unlimited. It finds wide application
  in virtually every genre from pop to psytrance, techno, deep/disco house,
  melodic liquid dnb, chillout, dub, progressive psytrance, experimental, guitar
  and live music, funk, hip-hop, edm, psybient, ambient, goatrance, tech house/
  electro house, dubstep / riddim and many others.

  Perfect tool for all electronic genres from techno to house, psytrance or
  downtempo (usable in all genres). Automatic envelope follower filter,
  bi-directional. For effecting drums, percussions, synthesizers, leads,
  guitars... Everything.

  4 types of analog filters with cutoff, resonance and envelope follower
  modulation: low pass, band pass, high pass, band reject.
specs: |-
  - Low pass filter
