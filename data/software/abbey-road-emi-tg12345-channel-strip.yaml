details: >-
  Waves and abbey road studios bring to life the legendary tg12345, the
  first-ever solid-state console from emi which epitomized the sound evolution
  of the late '60s and early '70s and helped shape groundbreaking recordings by
  the beatles, pink floyd, and many others.


  Thanks to meticulous component modeling, the waves/abbey road emi tg12345
  channel strip plugin captures every celebrated feature of the one-of-a-kind
  original console: the input mic preamp, down to every last detail of its
  harmonic distortion, hum and noise; the bass and treble eq bands from the mic
  cassette; the presence eq band from the console's group/main section; the
  lush-sounding spreader; and to top it all off, the console's famous
  compressor/limiter, with its distinctive, irresistible sound.


  The plugin offers routing options that cover the entire tg12345 line, from the
  one and only mk I desk on which it was modeled, to the final mk iv models.


  In addition to the console's original features, new elements have been added
  to accommodate modern mixing needs, including a high-pass filter on the
  compressor's sidechain, a mix control in the dynamics section for easy
  parallel compression/limiting, a drive control, and much more.


  Whether used for tracking, mixing or mastering, in the studio or live, on an
  individual channel or on a master bus, the waves/abbey road emi tg12345 will
  give your mixes the beautiful compression and the unforgettable crisp, bright
  and rich sound of a true classic.
