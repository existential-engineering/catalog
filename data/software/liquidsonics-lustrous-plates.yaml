description: Lustrous Plates recreates the beautiful tone of ten classic plate
  reverbs using LiquidSonics' Temporal Acoustic Spectral Mapping (TASM)
  technology.
details: |-
  Lustrous Plates is a rich and luxurious contemporary plate design with ten distinctive models. Temporal Acoustic Spectral Mapping (TASM) uses a proprietary multi band dynamic capture and analysis method which allows an unprecedented frequency specific profiling of each plate's natural decay, which is then mapped into an advanced reverb synthesis algorithm.

  This not only reproduces the even diffusion and beautiful spectral decay of real hardware plates, but it also gains the benefit of having classic algorithmic reverb parameters which allow fine tuning in ways that you've never been able to with any other plate emulation including precise control of frequency dispersion, width and modulation.

  Each of ten models was designed following extensive measurements taken from real plates, so all have a distinctive and very realistic reverberant tone to them. Chrome is a rich, full bodied plate with a classic plate multi-band decay profile. Silver is a light, airy plate with de-emphasised low-mids for enhanced clarity. Steel is similar in nature to the chrome plate with a reduced low band decay time. Rhodium is bright and rich, with a very neutral decay profile. Beryllium is a very reflective, lustrous metal inspiring a plate with a bright tone. Corbomite is a very dense and heavy plate. Iridium is very dense, with a highly emphasised low decay profile. Osmium is a rich reverb capable of very clean, short ambiences. Platinum is very dense and bright, with rich lows on longer decays. Gold is a simulation of the rare 'gold foil' compact plate reverberator.

  The dispersion of frequencies within a plate reverb plays a critical role in its sound. It is a major reason why a plate reverb sounds so distinctive, in particular with respect to the way it affects transients. A plate's whip like onset is especially audible with percussive material, and is very well suited to guitars and vocals bestowing a unique and very desirable acoustic signature to the reverb. This happens because sound travels through a metal plate at different speeds depending on its frequency. Similar in effect to a prism spatially splitting light into different colours, a plate temporally disperses sound by delaying different frequencies by different amounts. Low frequencies travel relatively slowly through the metal so are delayed more than the high frequencies. The amount of simulated dispersion for each plate is controllable via a single frequency dispersion parameter.

  Lustrous Plates features a dynamics module which includes a ducker, gate and compressor. The pre-delay of the reverb can be set in milliseconds, or set relative to the current project tempo to sync the reverb to the beat of the song. The sense of space is controlled as much by its width as by its length, and can be set from mono right up to fully decorrelated true stereo spaces without phase or mono-compatibility concerns. Its Fusion-IR Synthesis engine is capable of fully modulating its reverb in a very natural, organic manner, and modulation can also be completely disabled to model the rigid plates found in nature.
specs: |-
  - Ten unique plate models created with TASM
  - Faithfully reproduced frequency dispersion and damping
  - Modulated and fully decorrelated true stereo reverb design
  - Roll-off (6-24 dB), high cut, low and high shelf/bell filters
  - Width control (mono through to fully decorrelated true-stereo)
  - Pre-delay (0 to 500 ms or sync to tempo)
  - Light and dark colour themes
  - Tool-tip help system
  - Mono, mono-to-stereo and stereo-to-stereo channel support
  - Dynamics module (compressor, ducker, gate) with external trigger
  - iLok 2/3, iLok machine activation or iLok Cloud required
  - Windows 7 and above
  - OS X / macOS 10.13 and above
  - VST 2.4, VST3, Audio Unit (AUv2) and AAX Native plug-in formats
  - 64-bit DAWs are recommended (32-bit is supported)
  - macOS installer contains 64-bit Universal Binaries (Apple Silicon and Intel x64)
  - 500 MB hard disk space is required
  - At least 8 GB of main memory is recommended
  - A dual core i5 or Apple Silicon processor or above is recommended
