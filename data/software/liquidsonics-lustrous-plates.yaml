description: Lustrous Plates recreates the beautiful tone of ten classic plate reverbs using the groundbreaking new Temporal Acoustic Spectral Mapping technology.
details: |-
  Lustrous Plates is a contemporary plate reverb plugin developed by LiquidSonics, designed to recreate the sound of ten classic hardware plate reverbs. It uses the company's proprietary Temporal Acoustic Spectral Mapping (TASM) technology to achieve authentic plate emulation combined with the flexibility of algorithmic reverb.

  The plugin includes ten unique plate models: Chrome, Silver, Steel, Rhodium, Beryllium, Corbomite, Iridium, Osmium, Platinum, and Gold. Each model captures the distinct tonal character of a different classic plate reverb unit.

  Lustrous Plates features a comprehensive set of controls including frequency dispersion, width (mono to fully decorrelated stereo), pre-delay (0–500ms with tempo sync), and a dynamics module offering compression, ducking, and gating. EQ filters include roll-off, high cut, and shelving/bell options, along with modulation capabilities.

  Licensing uses iLok 2/3, machine activation, or iLok Cloud. A 14-day free trial is available. A surround variant, Lustrous Plates Surround, is also available for immersive audio work up to 9.1.6 Atmos formats.
specs: |-
  - 10 plate reverb models: Chrome, Silver, Steel, Rhodium, Beryllium, Corbomite, Iridium, Osmium, Platinum, Gold
  - Temporal Acoustic Spectral Mapping (TASM) technology
  - Pre-delay: 0–500ms, with tempo sync
  - Width control: mono to fully decorrelated stereo
  - Dynamics module: compressor, ducker, gate with sidechain support (v1.3.0+)
  - EQ: roll-off, high cut, shelving and bell filters
  - Modulation capabilities
  - Windows 7 and above (64-bit DAW required)
  - macOS 10.13 and above, including Apple Silicon (M3/M4 support added v1.3.5)
  - Formats: VST 2.4, VST3, Audio Unit (AUv2), AAX Native
  - Licensing: iLok 2/3, machine activation, or iLok Cloud
  - Recommended: 8GB RAM, 500MB disk space
