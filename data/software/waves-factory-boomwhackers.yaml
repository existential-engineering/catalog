description: Sample library for Kontakt that features a set of colour-coded plastic tubes that produce pitched sounds when struck together or in a hard surface.
details: |-
  Lightweight, hollow, color-coded, plastic tubes tuned to musical pitches by length. They produce musical tones when struck together or against nearly any surface. Used by performance artists to add an element of spectacle. Also used by educators to teach fundamental concepts in rhythm, harmony and melody.

  Sampled 3 octaves of boomwhackers struck on a rubber surface, from C2 to C5. Recorded in stereo in a dry studio environment using high-end mics, preamps and converters. 5 velocity layers and 5 round robins (repetitions per note). All samples denoised and normalized to 0dB for more natural feel without intensity jumps.

  With a simple turn of a knob in the main page you can select the number of players, since Boomwhackers are mostly played in group. An ensemble makes them sound fuller.

  In the effects page you can add any effect you want in any order, including EQ, compressors, modulation effects, distortion, saturation, tape machine, reverbs, amp simulators and more. This script boosts the sonic capabilities of the library exponentially.

  From the settings page you can set any parameter that you might ever need, with round robin selection, dynamic range and velocity curve form controlling the incoming MIDI velocities. Select the randomness and spread of the different players, with start offset and envelope controls.
specs: |-
  - Sampled 3 octaves of boomwhackers struck on a rubber surface, from C2 to C5
  - 549 samples, 129 MB library size
  - 5 velocity layers
  - 5 round robins (repetitions per note)
  - 3 octaves (5 with pitch shifting)
  - Recorded in stereo in a dry studio environment with high-end mics, preamps and converters
  - All samples denoised and normalized to 0dB
  - Ensemble mode with selectable number of players
  - Effects page with EQ, compressors, modulation, distortion, saturation, tape machine, reverbs and amp simulators
  - Settings page with round robin selection, dynamic range, velocity curve, randomness and spread, start offset and envelope controls
  - Works with Kontakt 5.7.3 and newer; full version of Kontakt required (Kontakt Player runs in demo mode)
