details: >-
  Ambi head is a professional plugin for converting ambisonic signals into 3d
  binaural audio. It allows manipulations of 3d scenes (rotations and control of
  spatial width) and contains hrtf filters specifically designed for immersive
  listening and accurate reproduction of b-format signals.


  Custom hrtf filters can be loaded via the integrated sofa importer, letting
  users choose "custom heads" for personalized binaural rendering. An integrated
  goniometer provides visual display of the binaural output (lissajous display)
  giving meaningful insights into the scene spatial properties.


  Ambisonics is a "scene-based" paradigm to capture, transform and render 3d
  audio. It is ideal for 360 videos and interactive media allowing listeners to
  rotate their head into the scene.
specs: |-
  - Ambisonics to 3d binaural conversion
  - 3d scene rotations
  - Spatial width control
  - Hrtf filters
  - B-format signal reproduction
  - Sofa importer
  - Custom hrtf loading
  - Goniometer
  - Lissajous display
  - VST plugin
  - Audio units plugin
  - AAX plugin
  - Macos support
  - Windows support
