description: A tube compressor plugin based on the Gates STA Level, featuring a
  variable mu triode tube emulation, adaptive recovery control, and an Age knob
  to simulate tube and transformer aging.
details: |-
  Based on the revered Gates STA Level tube compressor that dominated the sound of Top 40 radio throughout the 1960s and '70s. This legendary piece of gear has been used on countless records thanks to its ability to smooth out erratic audio levels with a distinctive warmth and character. By meticulously analyzing the magic behind the original hardware, we were able to capture its essence while also integrating modern features that offer unparalleled flexibility, expanding its utility far beyond the original hardware's capabilities. Utilizing our component-level modeling technology, we have taken the heart and soul of the classic into the modern digital world to create an exceptional mixing tool. Introducing, MixWave: Level .
