description: Kick drum processing plugin combining frequency detection, low end control, tail generation, transient shaping and tone adjustment in a single interface. Aimed at adding punch, depth and definition to kick samples across genres.
details: |-
  KickShaper is a kick drum processing plugin built around a chain of modules for shaping low end, transients and tone. It targets kick samples that are heavily compressed, lacking fundamental frequencies or thin, and its algorithms were tested on thousands of kick samples by audio engineer Emrah Celik.

  The Finder button identifies the dominant frequency of the kick so that tail processing aligns with its musical key, and the value can also be set by hand. Deboom shortens the wavelength of low frequencies rather than cutting or compressing them, which keeps a kick punchy and concise while leaving room for basslines and 808s.

  The Tail module resonates with the filters to produce frequency resonance without boomy artifacts, extracting sub frequencies from the original kick and harmonizing them so the tail sits with the source. Thump reads low frequency wavelengths and adjusts sustain in the low end only, leaving the core of the kick intact, while Click applies transient shaping based on high frequency wavelengths and is designed to cope with irregular patterns, rapid kicks and changing tempos.

  The Tone section provides Cut for subtle low frequency trimming, Low for punch, Mid for muddiness and High for click control. Depth applies analog hardware convolution to make kicks larger and tame excessive highs, Heat introduces subtle saturation, Punch models console compression tuned for kicks and Clip squashes peaks so the result stays present on small speakers.

  The interface is built on vector graphics and is resizable, with a central window showing the live signal as it passes through each stage of the chain. AB comparison and undo and redo support experimenting with different chains, and a factory preset library covers kick processing across several genres.
specs: |-
  - Kick designer plugin with a fixed module chain
  - Frequency Finder for the dominant kick frequency
  - Deboom control for shortening low frequency wavelengths
  - Tail module with filter resonance and sub harmonization
  - Thump control for low end sustain
  - Click module with transient shaping
  - Tone section with Cut, Low, Mid and High controls
  - Depth control using analog hardware convolution
  - Heat saturation, Punch console compression and Clip peak limiting
  - AB comparison with undo and redo
  - Resizable vector interface with live signal display
  - Genre spanning factory presets
  - Full PDF manual and tutorial video
  - Windows 10 or 11 or higher, 64 bit
  - macOS 10.15 or higher, 64 bit
  - AAX requires Pro Tools 12 or higher
  - Intel and Apple Silicon CPUs, with native AAX
