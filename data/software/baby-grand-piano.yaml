details: |-
  UVI Baby Grand Piano is a virtual instrument audio plugin and soundware for
  macOS and Windows. It includes and is powered by UVI workstation, which
  functions as a VST plugin, an Audio Units plugin, a VST 3 plugin and an AAX
  plugin.

  This 6 gb library features a unique and rare instrument with an exceptionally
  warm and emotional sound. The piano is a gorgeous baby grand piano built in
  1930 by the manufacturer erard, one of the smallest grand pianos ever built,
  and it sounds incredibly large in regard to its size.

  Every single note was carefully multi-sampled in multiple (up to 8) velocity
  levels. A new special technique was introduced to capture the true sound when
  playing with the sustain pedal, to add another level of realism.

  Thanks to the uvi engine advanced keygroup layers and rule switching, the
  sustain pedal and release samples perform and feel like a real piano. The
  instrument's response was improved through consultation with a great
  instrumentalist during the editing of samples to make it really enjoyable.

  The result is a soulful sounding piano, full of history and true musicality,
  recorded in place with extremely good microphones, excellent sounding mic pre
  and insanely good analog to digital converters.
specs: |-
  - Multi-sampled notes
  - Up to 8 velocity levels
  - Sustain pedal samples
  - Release samples
  - UVI engine advanced keygroup layers
  - Rule switching
  - 6 GB library
