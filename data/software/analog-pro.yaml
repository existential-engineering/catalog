details: >-
  Analog pro brings to life your digital audio by simulating the way analog
  hardware such as tape machines, valves and vinyl turntables warm up and
  saturate your audio.


  We recreated the imperfections of playing back audio from a tape or a
  turntable via the wow and flutter controls.


  Analog pro has a variety of user adjustable controls including noise level,
  noise type, impulse type, impulse mix, emphasis, stereo, lowcut, highcut, wow,
  flutter and amount, giving plenty of scope for the user to adjust the sound to
  their liking.


  Analog pro sounds great on real instruments such as pianos and brass and can
  really make your instruments stand out in your mix, sounding like they are
  being played back from a tape or turntable.


  Analog pro comes with an easy to use and resizable interface, use the amount
  knob to control how much analog pro affects the signal.
