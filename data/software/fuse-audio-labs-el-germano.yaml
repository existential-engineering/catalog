description: A faithful emulation of the Electro-Harmonix OD Germanium Overdrive pedal from the 1960s, capturing the mild but characterful vintage overdrive heard on classic Kinks and Beatles recordings. Germanium transistors deliver a soft, rounded breakup from subtle rasp to old-school rock. Extended Bias and Volts controls unlock saturation flavors and tonal characters not available on the original hardware.
details: |-
  Emulates the Electro-Harmonix OD Germanium Overdrive (1960s). Part of the VPB-Bundle virtual pedal board collection. Extends the original hardware with Bias control (affects saturation character and tone) and Volts control (virtual supply voltage — changes clipping flavor and response). Zero-latency mode for live use. Optional oversampling (adds 32 samples latency). Both 32-bit and 64-bit versions included.
specs: |-
  Controls: Gain (drive amount), Level (output gain), Bias (saturation character), Volts (virtual supply voltage), Oversampling on/off. Latency: zero-latency (oversampling adds 32 samples). macOS 10.9+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+, 2 GHz Intel CPU+, 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX (32-bit and 64-bit). Copy protection: serial number.
