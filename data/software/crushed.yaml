description: "Introducing Crushed – your ultimate transparent bitcrusher plugin!
  Unveil crystal clear crunch: step into a new era of sound manipulation"
details: |-
  Crushed is a transparent bitcrusher plugin that redefines clarity, eliminating
  harsh artifacts while preserving audio quality. It features a single, large
  rotary knob for intuitive control and stepless operation that allows smooth,
  precise audio manipulation.

  The plugin includes a built-in peak limiter to keep sound in check, a drive
  option that adds controlled distortion for extra impact, and high-quality low
  and high pass filters for precise frequency sculpting and texture refinement.

  Crushed features a crush booster that multiplies the strength of the
  bitcrusher effect, allowing users to push boundaries and explore new
  dimensions of sound manipulation from subtle to spectacular.

  The plugin is designed for vocal effects, bass sculpting, guitar tone
  enhancement, and synth lead processing, delivering high-quality digital
  roughness and creative sound design possibilities.

  System requirements for windows include windows 11/10/8.1 with visual c++
  redistributable, intel core i3 or amd multi-core processor (intel core i5 or
  faster recommended), 1366 x 768 display resolution minimum, 1 gb ram (4 gb
  recommended), and 1 gb free hd space. Macos requires catalina 10.15 or higher,
  1 gb free hd space, and compatibility with 64-bit audio units or vst3 hosts.
  Internet connection is required during installation for both platforms.
