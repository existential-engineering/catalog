description: Multi-effects rack plugin housing 14 Soundtoys effects in a single
  interface with drag-and-drop chain building, global controls, and a Recycle
  feedback control.
details: |-
  Effect Rack is a creative multi-effects system that consolidates 14 essential Soundtoys effects into a single, self-contained plug-in. The system includes Crystallizer, Decapitator, Devil-Loc Deluxe, EchoBoy, EchoBoy Jr., FilterFreak, FilterFreak 2, MicroShift, PanMan, PhaseMistress, PrimalTap, Radiator, Sie-Q, and Tremolator.

  Users can stack effects to create custom effect chains with drag-and-drop functionality, enabling quick experimentation with different combinations. The plug-in comes preloaded with hundreds of carefully-crafted presets categorized by instrument type and effect category.

  Global controls treat the entire effect rack as a unified processor, with features including tempo-locking for rhythmic effects, input/output level adjustment, and a Mix control for parallel blending. The Recycle control enables feedback mixing for creating custom modulated reverbs and ambient effects.
specs: |-
  - 14 essential Soundtoys effects in one plug-in
  - Drag-and-drop effect chain building
  - Supports macOS 10.15 or later and Windows 10 or later
  - 64-bit only, sample rates 44.1 kHz to 192 kHz
  - Apple Silicon compatible
  - Hundreds of presets categorized by instrument and effect type
  - Global tempo-locking, input/output levels, and Mix control
  - Recycle control for feedback and modulated effects
