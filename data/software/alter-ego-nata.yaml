details: >-
  Nata is the latest voice bank developed with alter/ego, plogue's voice
  synthesis engine. She functions with most daws, allowing you to make young
  adult, female vocals with an intuitive ui.


  The whole english dictionary is at your disposal, as are multiple parameters
  that make the vocals more expressive (vibrato, legato, sibilance, phoneme
  speed, etc.).


  In her site, you can find various songs and art made by devs and other users.
