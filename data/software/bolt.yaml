details: |-
  Bolt is Nektar's first foray into the world of virtual instruments. It employs
  a new form of synthesis with unique sonic character and intuitive user
  interface. Bolt enables a different and fast approach to sound design with an
  unusually organic and warm sonic character.

  Harmonics synthesis generates and shapes the sound directly in the oscillator:
  it doesn't require the dedicated filter section typically found on subtractive
  synthesizers. By turning just one knob, a wave's shape can be changed from
  dark and subtle to bright and overtone-rich. Harmonics synthesis is based on
  the mso (multi sine oscillator) concept by professor dr. Udo zoelzer of helmut
  schmidt university in hamburg, germany.

  Bolt is up to 16 voice polyphonic and offers 2 oscillators per voice, each
  equipped with suboscillator, noise generator, distortion and a dedicated adsr
  envelope. Three syncable lfos and a modulation envelope provide extensive
  modulation features. The number of overtones is set with bolt's harmonics
  parameter, rolloff additionally adjusts the steepness of the harmonics
  "cutoff". Apart from standard waveforms such as sine, saw or square, harmonics
  synthesis is also capable of generating pulse chains and alternating shapes.

  Cross modulation between bolt's two oscillators opens the door to fm-like
  sounds and all sorts of modulation mayhem. A voice double mode provides unison
  features and 4 integrated effects processors simplify the creation of
  production-ready patches.

  Over 500 factory sounds, including many artist patches, demonstrate the
  flexibility of this new synth engine: lush pads, deep basses, screaming leads
  or percussion sounds that almost sound sampled are just some of its strengths.
  The triple lfo section allows the creation of interesting rhythmical
  soundscapes and drones.
specs: |-
  - Harmonics synthesizer

  - 16 voice polyphony

  - 2 oscillators per voice

  - 2 sub-oscillators

  - White noise generator per oscillator

  - Overdrive stage for each oscillator

  - 1 adsr envelope per oscillator

  - Unison voice double mode with detune and stereo spread

  - Fm: frequency modulation of oscillator 1 by dedicated additional sine
  oscillator

  - X-mod: cross-modulation of osc1 from osc2

  - 1 adsr modulation envelope generator

  - 3 lfos with extended range up to 10 khz

  - 13 lfo waveforms

  - MIDI sync

  - 4 modulation targets per modulation source

  - 4 fx processors: eq, chorus, delay and reverb

  - Mono and poly modes with adjustable pitch glide

  - Support for multiple sample rates

  - Automatic 2-stage protection limiter

