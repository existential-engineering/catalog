description: 1964 Ludwig Hollywood kit recorded in a wooden recording studio. With natural bleeding on each mic for a realistic mixing experience.
details: |-
  VQ Drums is a Ludwig Hollywood drum kit library for Kontakt. All of it was recorded with 6 velocity layers and 6 round robin, resulting in 36 samples per articulation. All samples are normalized to 0db so when a velocity ramp is applied it results in 128 volume steps, which gives a very natural response from the keyboard or e-drum.

  On each channel you can hear the bleeding of the other parts of the drum kit, which results in a totally realistic mixing experience. A total bleed control adjusts how much of the rest of the kit bleeds into each mic. The kit was built in 1971 and the included cymbals range from the 1920s until the 1970s.

  The main page shows a full view of the drum kit. Clicking any part of the drums opens a dedicated menu to control the volume, pan and pitch of that piece, and the kit offers a choice of 2 snares (WFL Buddy Rich and Ludwig Super Sensitive), 2 kick beaters (plastic and felt) and 2 ride cymbals (Constantinople and Avedis).

  VQ Drums was recorded using 8 microphones: kick, snare, toms (one for each), hi hat, overheads (stereo pair) and room (stereo pair). The mixer page carries a load/purge switch for each articulation plus pan, volume, mute/solo and an output selector for mixing the channels in a DAW.

  The effects page adds DSP effects to each channel in any order, from an SSL style compressor and EQ to a transient shaper and a convolution engine with more than 30 custom impulse responses. The settings section covers round robin, dynamic range, velocity curve and envelope controls, and a MIDI learn function remaps any articulation to any note for use with an electronic drum kit.
specs: |-
  - 1964 Ludwig Hollywood drum kit
  - 8,337 samples, 2.89 GB library
  - 6 velocity layers and 6 round robin (36 samples per articulation)
  - All samples normalized to 0db for 128 volume steps under a velocity ramp
  - 8 mic positions: kick, snare, toms (one each), hi hat, overheads (stereo pair), room (stereo pair)
  - Natural bleed on every channel with a total bleed control per mic
  - 2 snares (WFL Buddy Rich, Ludwig Super Sensitive), 2 kick beaters (plastic, felt), 2 ride cymbals (Constantinople, Avedis)
  - DSP effects insertable per channel and on the master in any order, including an SSL style compressor and EQ, a transient shaper and a convolution engine with more than 30 custom impulse responses
  - Load/purge switch per articulation, with pan, volume, mute/solo and output selector per channel
  - Round robin, dynamic range, velocity curve and envelope controls
  - MIDI learn to remap any articulation to any note
  - Requires Kontakt 5.7.3 or newer, full version (Kontakt Player runs in demo mode)
