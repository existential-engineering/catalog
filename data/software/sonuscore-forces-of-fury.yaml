description: FORCES OF FURY is a powerful new orchestral expansion for The Orchestra engine, created for composers working in cinematic music, trailers, games, and dramatic storytelling. Featuring newly recorded ensemble strings, impactful cinematic percussion, and performance-ready cue presets, this expansion delivers everything you need for fast, high-impact scoring.
details: |-
  Forces Of Fury is Sonuscore's orchestral expansion for The Orchestra engine, aimed at cinematic music, trailers, games and dramatic storytelling. It pairs newly recorded ensemble strings with cinematic percussion and performance-ready cue presets, and the page positions it as a compact scoring library with a defined musical identity rather than a large general-purpose orchestra. It works as a stand-alone Kontakt library and is also included in THE ORCHESTRA COMPLETE 4, where the page places it alongside the earlier expansions Strings Of Winter, Horns Of Hell and Woods Of The Wild.

  The string content was recorded specifically for this library, as high and low cinematic ensembles with articulations tailored for tension, drama and momentum. The percussion side covers taiko, metal drum, kodo drum, tabla drum and tambora drum among others, with aggressive ensemble hits and low-end elements. Altogether the library holds 60 instruments and articulations with 70 ready-to-go ensemble presets, and over 60 single articulation patches for writing from scratch.

  The headline workflow feature is cue-structured presets: each playable preset carries four keyswitchable sections, Intro, Main A, Main B and Outro, so a whole cue can be shaped from one patch. A new Add 8va feature adds an octave above any slot's material, and because it can be set per keyswitch each variation can carry its own tonal space. Underneath sits the Ensemble Engine, with per-module controls on the Engine page: arpeggiators with a rhythm stepper arrange the short notes while a freely drawable velocity envelope shapes the sustains, across five instrument modules and 30 ensemble voicings.

  Beyond the ensemble instrument, multi patches load and layer multiple instances of Forces Of Fury for quick sketching, with Orchestral Rhythm and Animated Orchestra multis combining several engine instances into more complex patterns. A performance built from a preset can be dragged and dropped out of the instrument into a DAW as MIDI. It runs in the free KONTAKT PLAYER.
specs: |-
  - 60 instruments / articulations
  - 70 ready-to-go ensemble presets
  - Newly recorded cinematic high and low ensemble strings, with articulations tailored for tension, drama and momentum
  - Deep, expressive orchestral percussion including taiko, metal drum, kodo drum, tabla drum and tambora drum
  - Keyswitchable cue presets with 4 musical sections: Intro, Main A, Main B, Outro
  - Add 8va feature adds an octave above any slot's material, assignable per keyswitch
  - 30 ensemble voicings
  - 20 ensemble rhythms
  - 20 animated orchestra presets
  - 50+ single NKIs
  - 6 multi articulation NKIs
  - Over 60 single articulation patches
  - Ensemble Engine with arpeggiators, rhythm stepper and freely drawable velocity envelope across five instrument modules
  - Ensemble-multi patches that load and layer multiple instances, including Orchestral Rhythm and Animated Orchestra multis
  - MIDI export by drag and drop of a performance into the DAW
  - Works with the FREE KONTAKT PLAYER
  - KONTAKT Version 7.10.7 or higher
  - Apple Silicon Macs: macOS 12, 13 or 14 (latest update)
  - Intel Macs (i5 or higher): macOS 12, 13 or 14 (latest update)
  - Windows 10 or 11 (latest Service Pack), Intel Core i5 or equivalent CPU
  - Graphics hardware support for OpenGL 2.1 or higher and Direct 3D 11.1
  - 4 GB RAM (more recommended)
  - At least 4.3 GB of free hard disc space
