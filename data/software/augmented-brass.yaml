description: Augmented BRASS delivers a rich variety of expressive, unique, and powerful
  brass sounds for modern production and composition, uniting beautifully
  recorded samples, bold synth engines, and seamless morphing between them.
details: |-
  The sample library was recorded in a specialist studio in europe, with a
  colorful variety of microphones and preamps, spanning tuba, cimbasso,
  contrabass trombone, bass trombone, tenor trombones, trumpet, and horns. It
  explores 11 orchestral articulations, from soft sustain to random flutter
  tongue expressions, alongside 16 chamber articulations, including trumpets,
  horns, trombones, and tubas.

  Tipping over into experimental territory, you're also equipped with 15
  processed brass sounds, where both orchestral and chamber samples have been
  treated with vintage outboard units, tape machines, distortions, and other
  effects to unlock a wealth of exciting new timbres. Finally, the library is
  complemented by 15 additional brass-esque sounds, from resonant synth pads to
  droning metallic textures.

  Tap into the full capabilities of augmented brass' sound sources by adjusting
  the dual engines within each layer. This puts 4 sound sources at your
  disposal; any combination of up to 2 sampling and 2 synthesis engines. Within
  each engine, make subtle tweaks or drastic changes, from essentials like
  part-specific panning and waveform combinations, to detailed elements like
  vibrato assignment or keyboard offset.

  Blur the lines between augmented brass' multiple layers, move from authentic
  to synthetic, and choose any selection of up to 8 parameters to adjust with a
  single sweep of one control. Explore any combination of samples, synthesis, or
  hybrid, unlocking a universe of next-level brass sounds within one preset.
specs: |-
  - Virtual analog synth engine
