details: |-
  Bring 24 authentic volksmusik instruments to life from accordion and zillertal fiddle to a full brass section. Real folk vibes are captured by top virtuosos of the scene. Everything runs through the engine player, a sleek, modern interface giving you full control. Adjust volume, pan, reverb, filters, delay FX, articulations, and even special details like accordion release noises all intuitive, all instantly playable.

  Whether you're creating your own arrangements, half-playbacks for gigs, or adding extra layers in the studio, alpine volksmusik has you covered. Dulcimer, styrian harmonica, clarinet, brass, guitar, bass, drums, alpine bells all meticulously recorded, key-switchable, and ready to play.

  Featured artists: bass trombone: sebastian fuchsberger (global kryner). Baritone: sepp mattlschweiger austria's #1. Trumpet: ivan preern (alpenoberkrainer). Tuba: jon sass international soloist. Clarinet: prof. Vito muenic expressive & authentically oberkrainer. Guitars: renato verlic & sabrina klotz chords & plucked parts. Voice: freddy pfister yodels, cheers & zillertal phrases.

  Alpine volksmusik adapts to your style traditional, modern, ballads, party songs, covers, or even balkan pop & hip-hop. Whenever lively brass, cheerful accordions, or warm guitars take the lead, this library gives you everything you need.

  Alpine volksmusik 1 by best service is a virtual instrument audio plugin and a software application and soundware for macos and windows. It includes, and is therefore powered by, engine player, which functions as an audio units plugin, a VST 3 plugin, an AAX plugin and a standalone application.
