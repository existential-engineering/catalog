description: Magically perfect sub bass and kicks. Select or create unlimited sounds, explore with creative and intelligent UI controls.
details: |-
  SUBCRAFT is a sub bass and kick instrument built on engineering sophistication rather than sample browsing. Select or create unlimited sounds, explore them with creative and intelligent UI controls, and stop worrying about the low end foundation of a track.

  The Bass Terrain control navigates endless combinations of sub tones and overtones, all pre-processed and phase aligned so the resulting bass tone sits in the mix. Generate invents entirely new terrains of sound and shuffles every parameter for instant inspiration.

  An integrated kick module gives a bassline more punch with a selection of phase-aligned kick samples, and higher kick values trigger automated ducking to keep the relationship between kick and bass healthy. The built-in Phrase Player offers over 120 phrases that can be edited by drag and drop or sent to other devices via direct MIDI out.

  A later free content drop added 75 artist presets created by J. Reid, Swami Sound and Nedaj, covering hard-hitting 808s, clean two-step subs, heavy drum and bass, and techno.
specs: |-
  - Integrated sub bass and kick drum engine
  - Proprietary auto-mixing DSP for consistent bass definition
  - Extensive, easy-to-use sound design features
  - Intelligent randomization via the Generate control
  - Phrase Player with over 120 phrases, drag-and-drop editing and direct MIDI out
  - 75 artist presets by J. Reid, Swami Sound and Nedaj
  - Operating systems: Windows 10 to Windows 11, macOS Catalina (10.15) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - 8 GB of RAM
  - 1.04 GB of free disk space
  - 1280x768px display, internet connection
  - Moving the .blob sample content to an external drive is not supported
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Automated installation via the UJAM App
  - Quick authorization via the UJAM App
  - Supported standards: MIDI
