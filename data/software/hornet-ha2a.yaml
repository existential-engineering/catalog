description: HA2A is the recreation of a classic vintage opto compressor but with modern features like auto gain, auto makeup and auto threshold.
details: |-
  HoRNet HA2A is a meticulously crafted recreation of a legendary opto compressor, renowned for its use of tubes, transformers, and a unique combination of a photoresistor and electroluminescent panel. This plugin not only replicates the sound of the iconic hardware but also introduces modern features, making it a versatile tool for today's music producers, sound engineers, and musicians.

  Our inspiration for the HoRNet HA2A came from a real unit we had the privilege of using in the studio of our good friend Flavio, also known as TheBuildzer. After taking detailed measurements of the unit's response, transfer function, and both attack and release behaviors, we were able to recreate every nuance of this unique compressor. The result is a plugin that goes beyond simple emulation, accurately capturing the authentic tone and character of this historic opto compressor.

  While the HoRNet HA2A stays true to the original compressor's sound, which is shaped by tubes and transformers, we have updated it with several modern features. One of the most notable improvements is the inclusion of input and output VU meters, which let you monitor your signal levels in real-time. Additionally, we've integrated auto input gain functionality with a target level of up to 6VU, making the plugin responsive to changes in input signal strength. A unique feature is the input-output linking button, which links the input and output stages so you can compress your audio with a single set of controls.

  The plugin features automatic makeup gain, which ensures that the output level remains consistent after compression, even when significant gain reduction is applied, and an automatic compression setting which targets peak reduction. For users who want to experiment with parallel compression, the plugin offers separate dry and wet controls. Multiple mode selections, including stereo, dual mono, mid, and side, give you flexibility to work in different stereo configurations. A bypass button integrated within the analog emulation allows you to use the plugin as a tube saturator when compression is not needed.

  Proprietary analog emulation technology accurately simulates the behavior of the input transformer, tube amplifier, and output transformer, adding rich harmonic distortion and subtle warmth, and it can be disabled for a cleaner, more modern sound. Intelligent oversampling adjusts automatically based on your sample rate, as long as it is below 192kHz, eliminating potential aliasing artifacts. The vectorial, hardware-accelerated user interface leverages OpenGL or Metal and is fully resizable, so it stays sharp from a compact laptop screen to a large 4K monitor.
specs: |-
  - Faithful sound recreation of this famous compressor
  - Input and output VU Meter
  - Automatic input gain
  - Linked input and output gain
  - Mode selector between stereo, dual mono, mid and side
  - Auto gain makeup for the compressor
  - Automatic gain reduction setting
  - Dry and wet level controls for parallel compression
  - Analog emulation and hiss
  - Bypass that keeps the analog engine active (so you can use the plugin as a tube saturator)
  - Intelligent oversampling that allows the plugin to always work internally at 192Khz
  - Vector user interface which is sharp on every resolution
  - Freely resizable user interface
  - Apple Silicon native support
  - macOS (10.11 and later) and Windows (Vista and later) support
  - 64-bit on Mac and Windows
  - Audio Units, VST, VST3 and AAX format
  - No copy protection
