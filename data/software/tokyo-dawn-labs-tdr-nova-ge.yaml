description: A parallel dynamic equalizer that appears in the familiar layout of a parametric equalizer while adding flexible dynamics processing options, covering an impressively wide range of applications.
details: |-
  NOVA GE is a parallel dynamic equalizer. Appearing in the familiar layout of a parametric equalizer, the plugin also includes flexible dynamics processing options allowing the coverage of an impressively wide range of applications. Be it a master lacking density, the drum bus asking for more crispiness, or a sibilance problem in your perfect take: NOVA has an elegant musical answer.

  NOVA GE includes a total of six dynamic EQ bands, each with independent dynamics processing ranging from downward compression over upward compression, upward expansion, up to downward expansion (incl. gating). Flanked by powerful highpass and lowpass filters, the processor covers parametric equalization, dynamic equalization, frequency selective compression/expansion, multiband compression/expansion and wideband compression/expansion.

  In addition, an advanced “Smart Operation” panel offers a unique way of automating and orchestrating the plugin for spectral matching, resonance removal and much more.

  A user-friendly WYSIWYG drag and drop display paired with a classic “knob” interface gives quick and smooth access to the various parameters driving NOVA’s powerful signal processing. Elaborate equal loudness functions help finding the optimal setting without getting distracted by loudness differences.

  NOVA GE also features all helpers and workflow enhancements you’ve come to expect in a TDR plugin: A preset manager, undo/redo, A/B, detailed documentation, copy & paste, and much more.
specs: |-
  - Six dynamic EQ bands with independent dynamics processing
  - Downward compression, upward compression, upward expansion and downward expansion (incl. gating)
  - Powerful highpass and lowpass filters
  - “Smart Operation” panel for spectral matching and resonance removal
  - WYSIWYG drag and drop display paired with a classic knob interface
  - Equal loudness functions
  - Preset manager, undo/redo, A/B, copy & paste
  - Windows: 32-bit VST2, VST3; 64-bit VST2, VST3, AAX
  - macOS: 64-bit VST2, VST3, AU, AAX
  - System requirements: VST2, VST3, Audio-Unit or AAX compatible plugin host; Win 7 or above, Mac OS X 10.9 or above; OpenGL support
