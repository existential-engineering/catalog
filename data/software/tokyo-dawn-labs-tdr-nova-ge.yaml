description: "A parallel dynamic equalizer featuring six dynamic EQ bands with
  independent dynamics processing, highpass and lowpass filters, and an advanced
  Smart Operation panel for spectral matching and resonance removal."
details: |-
  Version 2.2.2. Six dynamic EQ bands with independent dynamics processing. Downward/upward compression, upward expansion, downward expansion with gating. Powerful highpass and lowpass filters. Smart Operation panel for automation and orchestration. WYSIWYG drag-and-drop display with classic knob interface. Built-in spectrum analyzer with equal loudness functions. Preset manager, undo/redo, A/B comparison, copy and paste functionality.
specs: |-
  Windows 7 or above. Mac OS X 10.9 or above. VST2, VST3, Audio-Unit, or AAX compatible plugin host. OpenGL support required. 64-bit.
