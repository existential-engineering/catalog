details: |-
  Bass Fingers is the most detailed and nuanced finger-style bass virtual
  instrument in existence. You can lay down authentic and realistic-sounding
  basslines with the personality of a seasoned bass player intuitively on your
  keyboard.

  It is a common challenge to create realistic sounding MIDI bass lines, since
  there is more to it than just notes—you want to hear the expressiveness, the
  touch of the strings hitting the frets, and all the goodness that happens in
  between the notes to make a bassline sound like a player and not a computer.

  Waves' bass fingers translates your MIDI input into basslines full of
  character and personality, giving you the same mechanics, variations and
  dynamics that a seasoned bass player creates naturally across the fretboard.

  Designed, recorded and edited by highly regarded bass player or lubianiker
  (marty friedman, gus g, bumblefoot), bass fingers is an
  ultra-natural-sounding, high-performance virtual instrument with an extensive
  range of articulation and control over your sound—from open string sustain,
  natural legatos, release and decays, to realistic percussive playing, slides,
  mechanical noises, and other natural playing effects.

  Featuring an extensive sample library that contains 14gb of hand-crafted bass
  samples, bass fingers gives you the most extensive and realistic finger-style
  bass vocabulary possible.
specs: |-
  - 8 velocity layers
  - 6 round robins
  - Full 5-string articulation
  - Natural hammer-ons and pull-offs
  - Release and decays
  - Sampled slides
  - Percussive playing
  - 21 interactive playing positions
  - Intelligent adaptive fretboard
  - Automatic string switching
  - Customizable keyswitch editor
  - Built-in studio-quality effects
  - NKS-ready for ni komplete kontrol and maschine
  - 14gb sample library
  - MIDI input
