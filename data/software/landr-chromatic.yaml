description: Turn playable loops into professional results with ease thanks to
  LANDR Chromatic, the only DAW instrument designed for artists, by artists.
details: |-
  Chromatic is a loop-based virtual instrument for crafting stunning, unique compositions or adding a touch of flair to existing tracks. It guides the user toward their ideal sound with sets made by professional producers, and is aimed at beginners and experienced producers alike.

  The instrument is built around unique sets of sounds created by pro producers. Users discover and browse playable sets from favourite creators as well as up-and-coming artists and producers.

  Sets and creative effects are designed for lightning fast creations, so ideas can be sketched in a heartbeat while mixing and composing stays fun and easy.

  The loop sets are professionally produced for studio-quality results every time, designed to help a producer develop their own style and channel their creativity into finished music.

  Chromatic is free to use and comes with free content to get started, with the full library and daily new content unlocked through a subscription. It is also included with LANDR Studio, LANDR Studio Pro and the Samples Pro subscription. All Chromatic content is royalty-free.
specs: |-
  - macOS 10.14 or higher (VST3, AU, AAX)
  - Windows 10 or higher (VST3, AAX)
  - Compatible with most major DAWs that host AU/AAX or VST3 formats
  - All Chromatic content is royalty-free
  - Free tier with free starter content, full library available by subscription
