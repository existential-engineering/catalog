description: Turn playable loops into professional results with ease thanks to LANDR Chromatic—the only DAW instrument designed for artists, by artists.
details: |-
  LANDR Chromatic is an intuitive loop-based virtual instrument that guides you to your ideal sound with sets made by professional producers. It is designed for both beginners and pros, making it easy to craft stunning, unique compositions or add a touch of flair to existing tracks.

  The plugin features unique sound sets created by professional producers, allowing users to discover and browse playable sets from their favorite creators and up-and-coming artists. These curated sets make it easy to find inspiration and develop a personal style.

  Chromatic is designed for lightning-fast creative sketching. Users can sketch ideas in a heartbeat with inspiring sets and creative effects that make it fun and easy to mix and compose. The intuitive design removes technical barriers and keeps the focus on creativity.

  All sounds in Chromatic are professionally produced and studio-quality, designed to help users develop their style and channel their creativity into breathtaking music. All content is royalty-free for recordings created with the plugin.
specs: |-
