details: |-
  This instrument is sampled with 3 mic position. It is 2 layers of velocity
  with round robin algorithm. It comes with win 32-64-bit VST, vst3, AU and mac
  VST plugins.

  Acoustic dhaak 2 comes with free player, however you need to purchase the
  factory expansion to up and run the full instrument.

  New in 2.0: over 400 samples with different articulation. Low samples added. 3
  mic pos. 2 layers of round robin samples. 6 instruments presets. Low cut eq
  filter (hpf). Drum pads for low mapping. Tuning features added. Browse presets
  features added. Adsr and eq can be automated inside host. Improved dsp and
  gui.

  Feature: over 4oo samples with different articulation. 3 mic pos. 6 factory
  expansion presets. Sampled from real indian leather instruments dhaak. Drum
  pads for low. Worship bells. Tuning parameter. New low cut. New presets
  browser. Round robin and velocity sensitive. Adsr with volume & pan control.
  Algorithmic reverb. Level meter. All major daws supported. Vst3, AU, win
  32-64-bit & mac VST.
specs: |-
  - Over 400 samples with different articulation
  - 6 instruments presets
  - 3 mic positions
  - 2 layers of velocity with round robin algorithm
  - Low cut EQ filter (HPF)
  - Drum pads for low mapping
  - Tuning features
  - ADSR and EQ automation in host
  - Algorithmic reverb
  - Level meter
  - Win 32-64-bit VST
  - VST3
  - AU
  - Mac VST
  - Round robin and velocity sensitive
  - ADSR with volume & pan control
  - Presets browser
  - All major DAWs supported
