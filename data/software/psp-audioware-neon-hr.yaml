description: PSP Neon HR is a fully featured linear phase equalizer plug-in offering eight bands of equalization with seven assignable filter types per band. It uses frequency-domain fast convolution based linear phase algorithms for the best balance between CPU efficiency and phase accuracy.
details: |-
  PSP Neon HR is a fully featured linear phase equalizer plug-in that offers eight bands of equalization, each of which can be assigned one of seven filter types. PSP Neon uses frequency-domain fast convolution based linear phase algorithms for the best balance between CPU efficiency and phase accuracy.

  For those who want to use the excellent analog-modeled PSP Neon filters in even more CPU critical applications, users can toggle off the linear phase mode and take advantage of PSP Neon's unique minimum phase error Infinite Impulse Response (IIR) mode.

  PSP Neon HR features one of PSP Audioware's most user friendly interfaces, offering unparalleled ease of use and workflow. The pristine, transparent response and intuitive design make it a go-to linear phase equalizer for mastering and other critical audio applications.

  Version 2 comes in three variants: PSP Neon HR (high-resolution, backward compatible with v1 sessions and presets), PSP Neon STD (standard resolution, reduced latency), and PSP Neon MIX (minimum-phase filters, suited for mixing).
specs: |-
  - Eight bands of equalization, each assignable to one of seven filter types
  - Frequency-domain fast convolution based linear phase algorithms
  - Toggleable minimum phase error Infinite Impulse Response (IIR) mode
  - Operation at high sample rates (up to 192kHz)
  - PSP Audioware's proprietary FAT mode
  - Independent processing and control of each stereo channel
  - Stereo and Mid-Side operation
  - High and Max resolution modes for unparalleled fidelity in the most demanding applications
  - Third-octave real-time spectrum analyzer with many adjustable parameters
  - Frequency-hunting as well as overtone-hunting workflow accelerators for finding the right frequency in seconds
  - Response plot auto-zooming
  - EQ band soloing
  - VST 2.4 compatible host required for the VST format
  - RTAS requires ProTools LE 8.0.0 or ProTools TDM 8.0.0 or later
  - AAX requires ProTools 11.0.0 or later (Windows 7 x64 or later, Mac OS X 10.8.0 or later)
  - Windows x32 or x64 (XP Service Pack 2, Vista or 7 and later)
  - Mac OS X 10.4 or later depending on format, 32 or 64-bit host
