details: |-
  The free plug-in Saturation Knob is a modeled output distortion that can be used anywhere you need some grit. Use it to fatten up bass lines, add some harmonics and shimmer to vocals, or simply destroy your drum loop.

  One Big Knob and a Little Switch. The three modes, Keep High, Neutral and Keep Low, give you three kinds of characters of distortion. If you want to squash a drum loop but keep the bass drum fairly intact, you can, for example, use the Keep Low mode, while Keep High distorts the low end more, keeping the high frequencies relatively clean.

  Three versions are included. With the Saturation Knob native plug-in, you can fatten up bass lines, add shimmer to vocals, or totally demolish your drum loop. It is the perfect plug-in to grab when you need some grit.

  Saturation Knob for Modular, Softube's virtual Eurorack platform, helps you create sensational synth sounds. Virtually patch it to modules from Doepfer, Buchla, Intellijel, and more to discover new sonic spheres.

  Saturation Knob for Amp Room, Softube's pro audio guitar and bass platform, is addictive fun. Combine it with other studio effects, classic amps, cabs, and pedals to easily create studio-quality, record-ready tones. The product also supports Softube Extended Features, easy-access panels with the innovations you need close at hand.
specs: |-
  - Download for free
  - Three modes: Keep High, Neutral, and Keep Low
  - Great for fattening up drums and bass, adding harmonics to vocals, and more
  - Modeled output distortion
  - Modular Ready: works as a native plug-in and as a module in Modular, Softube's Eurorack platform
  - Supports Softube Extended Features panels
  - Three versions included: Saturation Knob native plug-in, Saturation Knob for Modular, and Saturation Knob for Amp Room
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26
  - System requirements: Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access for downloading installers and managing licenses
  - Three activations, 14-day returns, 20-day trial
