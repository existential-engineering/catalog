description: A collection of long, intensely beautiful chamber evolutions,
  perfectly complementing our other evolutions libraries, while also thriving as
  its own compositional tool.
details: |-
  A collection of long, intensely beautiful chamber evolutions, perfectly complementing our other evolutions libraries, while also thriving as its own compositional tool. Recorded in the dry, vintage craft acoustic of Air Edel Studios with the UK's finest progressive string players, we have captured the more delicate, subtle aspects of each instrument by using a range of avant-garde techniques, giving you the tools to create the most realistic and spine-tingling string textures.

  Presented in our own sophisticated GUI with an ingenious grid layout, you have an almost infinite number of configurations at your fingertips. The Spitfire team have also created a range of straight-out-of-the-box presets, offering you instant playability and inspiration.
specs: |-
  - 14 string players (4,3,3,3,1)
  - 48 evolutions in Traditional, Episodic and Extreme groups
  - 23 curated presets
  - 12 x 48 Evo Grid with a randomise function
  - 6 signals: Close, Tweaked, Ambient, Distorted, Stretch x2, Stretch x8
  - Recorded to tape at Air Edel Studios with vintage mics, Neve preamps and a Cadac desk
  - 26.30 GB download size
  - 27.00 GB disk space required during install
  - macOS 11 to OS 26, Intel and Apple Silicon supported
  - Windows 10 or 11 (64-bit)
  - Minimum 8 GB RAM, 16 GB recommended
  - Spitfire Audio App required
