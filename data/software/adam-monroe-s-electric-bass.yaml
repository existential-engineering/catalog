details: >-
  Adam monroe's electric bass is a 32/64-bit plugin for windows VST, kontakt,
  and audio unit sampled from a yamaha bb424x bass.


  The bass was modified so that individual pickups were wired to independent
  jacks allowing for independent sampling of bridge and neck pickups.


  Range from e1 to c4. Includes slide articulations.


  It functions as a VST plugin, an audio units plugin and an AAX plugin.


  Os x 10.9 or later, latest DAW updates.
