details: |-
  Since debuting in 1977, the colorful boss compact pedal lineup has been loved
  by generations of musicians. The BOSS Effects Pedals plug-in brings the
  authentic boss compact pedal experience to computer music production for the
  first time, delivering premium processing for guitar, bass, keyboards, vocals,
  and beyond.

  Boss, roland's guitar products division, is well known for its expansive
  lineup of compact pedals. They're used by everyone from beginners to
  professionals, and numerous legends have relied on various models for their
  signature sounds and the creation of the greatest recordings of all time. To
  date, over 140 unique boss compact pedal models have been produced, well over
  19 million units have been sold, and many have remained in continuous
  production for decades.

  The boss effects pedals plug-in can be loaded with one effect at a time from
  an onboard library. Each delivers the genuine sound and response of the pedal
  it's based on, faithfully recreated by the same company that developed the
  original designs. The friendly interface mirrors the simple operation of the
  hardware, providing fast access to great tones.

  Extended features are also available, including input and output controls for
  dialing in levels and tempo sync for time-based effects.

  The initial launch of the boss effects pedals plug-in features eight of the
  most famous boss pedals: the od-1 overdrive, ph-1 phaser, sp-1 spectrum, sg-1
  slow gear, cs-1 compression sustainer, tw-1 t wah, sd-1 super overdrive, and
  ds-1 distortion. Over time, the core library will be populated with an
  ever-expanding selection of models derived from the historic hardware lineup.
specs: |-
  - Universal 2 binary
