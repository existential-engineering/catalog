name: Basic
manufacturer: audio-damage
primaryCategory: synthesizer
url: https://www.audiodamage.com/instruments/product.php?pid=AD033
description: Basic is a synth plug-in for Mac OS X and Windows in VST and AU
  plug-in formats.
details: |-
  While designed with ease-of-use, low cost, and simplicity in mind, the panel
  sits in front of a powerful modern synthesizer engine with an aggressive tone
  and self-resonating filters that scream when pushed.

  A simple and easy-to-understand workflow, inspired by the classic topology of
  vintage analog synths like the minimoog, sem, and ms20, but with modern
  usability.

  Touchscreen-friendly and highly visible user interface.

  Drm-free, for easy installation and updating.
specs: |-
  - Three alias-free wavetable oscillators with six waveforms each
  - Oscillator sync
  - Cascaded filters with ms20-style lowpass and highpass
  - Bandpass filter
  - Four-waveform tempo-syncable LFO with waveshaper
  - ADSR envelopes for amplitude and filter frequency
  - User-definable soft-saturation
  - VST plug-in format
  - Audio Units (AU) plug-in format
  - macOS support
  - Windows support
  - Drm-free
