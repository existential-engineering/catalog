details: >-
  Acoustic guitar d45 captures the tone of a martin d45 custom version. This
  carefully handpicked acoustic guitar is referred to as the one that has an
  iconic martin guitar sound.


  Its bright, high end tone will make it easier to stand out in a busy mixing
  project.


  To maximum represent this martin sound, we focus on some key techniques this
  time, but each technique will provide up to 10 velocity layers dynamic and up
  to 8 round robin samples.


  All this effort serves our aims at extreme realistic acoustic guitar and icon
  martin sound.


  Acoustic guitar d45 by sound magic is a virtual instrument audio plugin and a
  software application for macos and windows.
