details: |-
  The plugin features lowpass, highpass, bandpass, bandstop filters from 4 classic filter families (butterworth, chebyshev I & ii, and elliptic) in electronic engineering.

  The plugin is designed with solid dsp and math to reach stable high order results (e.g. The butterworth lowpass can be set to 100th order. Parameters do not support automation at very high order state).
specs: |-
  - Lowpass filter
  - Highpass filter
  - Bandpass filter
  - Bandstop filter
  - Butterworth filter family
  - Chebyshev I filter family
  - Chebyshev ii filter family
  - Elliptic filter family
  - High order filter support
  - 100th order butterworth lowpass
