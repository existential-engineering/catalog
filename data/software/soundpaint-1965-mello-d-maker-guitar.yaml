details: |-
  Vintage Guitar. Drum and Bass. All In One. Step into a vintage vortex with the 1965 Mello D Maker Rhythm 'N Sound. This timeless gem, originally designed as a Les Paul's entry-level counterpart, now takes the stage in a whole new light. Don't be fooled by the lacquered body and rosewood fretboard; this guitar packs a punch! Legendary icons like Joan Jett and Robby Kreiger have wielded it as their sonic weapon of choice for decades. But wait, the story gets even groovier! The Mello D is paired with the Oberheim-designed Maestro G-2, a vintage effects unit and rhythm machine: a dynamic powerhouse of a pair. Guitar, bass, and drums, all rolled into one irresistible package. With a thin, light mahogany body and dual humbucker pickups, this little beast has a midrange that sings like a bell, with a dash of fuzz to reveal its ferocity. From clean harmonics to sub-octave bass and rhythmic arps, the 1965 Mello D Maker Rhythm 'N Sound guarantees creative sparks that are sure to get your creative juices flowing.
