details: |-
  BA-1 is an analog-modeled synth that brings you closer than ever to pure and
  authentic 1980s textures in a plugin. Just like the real hardware, it's
  dead-simple to program, surprisingly versatile, and dripping with sonic color.

  Ba-1 is based on a portable 1980s synth with a toylike appearance and a gritty
  sound. Despite its small size, it left a big mark on music history, while
  still flying somewhat under the hype radar. The original has been used as a
  secret weapon for bubbly synth textures by some of sweden's most successful
  pop producers of the past two decades. It was also a staple of 1990s digital
  dancehall and beloved by the indietronica scene for its raw lo-fi quality.

  In keeping with our motto "it's an evolution, not an emulation", we modeled
  the hardware with the greatest possible accuracy, before carefully upgrading
  it with new and useful features. A second analog-modeled oscillator, fm,
  polyphony, and more, help to vastly expand the sonic palette of the original.
  All while keeping its signature sound unspoiled. Additionally, ba-1 lets you
  drain the battery, bend the circuits, and use the built-in speaker for an
  authentic lo-fi aesthetic that you could normally only get with hardware.

  The effects chain is inspired by budget 1980s rack hardware and captures the
  lo-fi charm of the home studio scene of the era. The overdrive is modeled
  after a guitar pedal, while the delay, reverb and chorus effects are based on
  cheap, but amazing, digital rack units. With ba-1 v1.5, the fx chain is now
  included as a separate effect plugin as well so you can add it to any track
  you desire.

  Ba-1 v1.5 is a free update for all owners of ba-1. New features include a
  hands-on, hardware-style arpeggiator with three modes (up, down, up/down) and
  a three octave range. The arp allows for un-syncing from the host tempo for
  more authentic effects. The chorus can now be set anywhere between 0% and 100%
  for more creative flexibility. Lfo fade adds ramp time to the modulation wave
  that gradually (or abruptly) fades up to its set frequency for a more
  unpredictable lfo effect. Chaos introduces nonlinear behavior in the reverb
  and chorus algorithms for dissonance and unpredictable pitch glides. Ba-1's
  preset manager has a vastly improved workflow in v1.5 with search presets by
  name, filter by pack, or mark patches with color-coded tags to remember them.
specs: |-
  - Analog-modeled synthesizer
  - Two oscillators with v/a waveforms
  - FM modulation
  - Polyphony
  - Low-pass resonant filter
  - ADSR envelope
  - Single LFO (sine wave)
  - Arpeggiator (up, down, up/down modes)
  - Three octave arpeggiator range
  - Velocity sensitive
  - Sidechain
  - Tone (EQ)
  - Drive (two kinds)
  - Delay
  - Reverb
  - Chorus
  - Speaker simulator
  - Battery emulation
  - LFO fade
  - Chaos parameter
  - BA-1 FX strip effect plugin
  - Preset browser with search and filtering
  - Color-coded preset tags
  - Black and red ui theme
