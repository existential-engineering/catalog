description: Analog saturation modeler featuring five hardware-inspired distortion
  models, an analog tone control, and mix knob for parallel processing.
details: |-
  Decapitator delivers analog saturation modeling that captures the distinctive character of classic studio hardware. The plugin features five different saturation models derived from vintage and modern gear including consoles, preamps, and studio distortion units.

  The plugin includes an analog-modeled tone control for shaping saturated sound and a mix knob enabling parallel processing without additional routing. This combination balances subtle enhancement with extreme character manipulation across any instrument or track type.

  The Punish button adds aggressive gain to push saturation into intense overdrive, delivering the unique qualities that only come from driving high end studio gear.
specs: |-
  - Five saturation models from classic hardware
  - Analog-modeled tone control
  - Mix knob for parallel processing
  - Punish button for extreme saturation
  - 64-bit only, sample rates 44.1 kHz to 192 kHz
  - Apple Silicon compatible
