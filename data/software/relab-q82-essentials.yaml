description: Q82 Essentials is a streamlined version of Relab's Q82 Natural Resonance Reverb, a re-creation of a 1980s hardware room simulator, with simplified controls and curated Room, Chamber, Studio and Club presets.
details: |-
  Q82 Essentials is a streamlined version of Relab's premium re-creation of a beloved 80's hardware reverb, revered for its highly realistic ambience and long reverb times. This legendary resonance reverb was once the cornerstone of many world-class studios.

  Relab's advanced machine learning captures the nuances of the original unit, giving the sound and feel of the legendary hardware, quirks included. The intuitive interface simplifies complex reverb controls for easy operation and allows quick access to essential parameters for an efficient workflow.

  The plug-in adapts to various genres and production styles, and is capable of creating a wide range of reverb effects, from intimate spaces to grand halls, dialling in natural-sounding rooms with high accuracy.

  Hand-crafted factory presets are included as starting points.

  No hardware dongle is required to authorize this product. Local computer authorization or an iLok USB key (V2 or above) can be used, though a free PACE iLok account, internet connection and the latest PACE drivers are required at the time of product activation.
specs: |-
  - Intuitive interface for crafting reverbs
  - Curated presets: Room, Chamber, Studio, Club
  - Flagship-quality premium DSP, optimized for efficiency
  - Mac (64-bit only): OS X 10.15 or higher, Intel or M1 processor, 2GB of RAM
  - Windows (64-bit only): Windows 10 or higher, Core 2 or higher, 2GB of RAM
  - Compatible hosts (Mac): Logic Pro 10.x, Pro Tools 11.3.2 and up, Cubase 9.5 and up, Nuendo 8 and up, Live 9 and up
  - Compatible hosts (Windows): Pro Tools 11.3.2 and up, Cubase 9.5 and up, Nuendo 8 and up, Live 9 and up
  - Mac formats: VST3/AU/AAX (64-bit); Windows formats: VST3/AAX (64-bit)
  - No hardware dongle required: local computer authorization or iLok USB key (V2 or above); free PACE iLok account required for activation
