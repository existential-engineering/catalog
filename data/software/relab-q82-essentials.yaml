description: Q82 Essentials is a streamlined reverb plug-in based on an iconic 1982 hardware unit, delivering highly realistic natural resonance ambience through machine learning-based hardware emulation with an intuitive interface and curated factory presets.
details: |-
  Q82 Essentials is a simplified version of Relab Development's premium recreation of an iconic 1980s hardware reverb unit. It delivers the sound and feel of the legendary hardware, complete with its unique quirks, through machine learning technology that captures the nuances of the original unit.

  The plugin features an intuitive interface designed to let users craft perfect reverbs effortlessly, along with hand-crafted factory presets covering Room, Chamber, Studio, and Club settings to suit multiple genres and production styles.

  Q82 Essentials uses premium DSP optimized for efficiency, offering highly realistic natural resonance ambience and long reverb times characteristic of the original 1982 hardware.

  Authorization is handled via the PACE iLok system. No hardware dongle is required — users can authorize on a local computer or using an iLok V2+ USB key. A free iLok account and internet connection are required for activation.

  The plugin supports Mac (macOS 10.15+, Intel and M1, VST3/AU/AAX 64-bit) and Windows (Windows 10+, VST3/AAX 64-bit), and is compatible with Logic Pro 10.x+, Pro Tools 11.3.2+, Cubase 9.5+, Nuendo 8+, and Ableton Live 9+.
