description: Introducing our first ever effects plug-in AIR Studios Reverb, an immensely detailed convolution reverb, created in collaboration with the team at London's iconic AIR Studios. Using our very own "Virtual Positioning Technology", you can position your sounds anywhere in the legendary Lyndhurst Hall, one of the world's most sought-out recording spaces.
details: |-
  Spitfire Audio's first effects plug-in is a convolution reverb built in collaboration with the team at London's AIR Studios. Its proprietary Virtual Positioning Technology lets you place a sound source anywhere in the Lyndhurst Hall, and the Spitfire engineering team curated 54 presets to suit different instruments based on real mixing practices, alongside a selection of standard reverb modes and spaces.

  Spitfire Audio recorded over 67,000 impulse responses for the plugin, in order to recreate a plethora of positions and configurations in the hall. Eight individual True Stereo mic signals can be blended, drawn from tree, outriggers, binaural, ambient, gallery wide and gallery far setups.

  In Lyndhurst Hall, musicians traditionally face the control room, which creates a distinct reverb character. A lesser-known yet iconic sound is achieved with musicians facing the organ, a setup synonymous with Hans Zimmer scores recorded at AIR. To recreate both signature sounds, the team mirrored microphone placements on the hall floor and combined them with dedicated speaker positioning, so a virtual sound source can face either direction.

  Hall controls modify physical attributes of the room to shape the reverb tone and decay: Hall Layout inverts the room configuration for both microphones and player position, Canopy Height offers low, medium or high, Canopy Material chooses between Wood and Melatech, and Gallery Dampening adds absorption to the gallery portion of the hall to reduce reverb time.

  The interface is split across Virtual Positioning, Mixer, Source, Shape, EQ and Preset Browser pages. Source modifies the performers' radiation in the room and which way the source faces, Shape augments the reverb at various points in its decay, and a 5-band graphical EQ can be placed pre or post to shape either the input signal going into the hall or the hall reverb itself. A bottom bar carries Input (gain, mono/stereo, source width), Reverb (pre-delay, early and trail stretch) and Output (dry/wet balance and output gain).
specs: |-
  - Choose the position anywhere in the hall, with proprietary Virtual Positioning Technology
  - Ability to adjust what direction any sound radiates within the hall
  - Select and mix between eight different True Stereo mic signals
  - Adjust the hall's reverb characteristics with configurable hall settings, including Canopy Height, Canopy Material, and Gallery Damping
  - Ability to flip the direction of virtual performers and mic setups to match two key uses of the hall
  - Fine-tuning options for adjusting source characteristics and mic signals
  - Comprehensive signal control with Direct, Early Reflections and Tail level adjustments, and graphical EQ
  - Diverse preset library catering to various instruments, moods, and setups
  - Over 67,000 impulse responses recorded at AIR Studios' Lyndhurst Hall
  - 54 curated presets
  - Mic signal options: tree, outriggers, binaural, ambient, gallery wide and gallery far
  - 5-band graphical EQ, selectable pre or post
  - Dedicated plugin (AU, VST2, VST3, AAX), no Kontakt Player version
  - Spitfire Audio App required for installation
  - Download size 9.73GB, 10GB disk space required during install
  - macOS 11 to 26, 64-bit DAW required (32-bit DAWs not supported), Apple Silicon supported
  - macOS minimum: 2.8GHz i5 quad-core, 8GB RAM; recommended 2.8GHz i7 six-core, 16GB RAM
  - Windows 10 to Windows 11, latest Service Pack, 64-bit
  - Windows minimum: Intel Core 2.8GHz i5 quad-core or AMD Ryzen 5, 8GB RAM; recommended Intel 2.8GHz i7 six-core or AMD R7 2700, 16GB RAM
