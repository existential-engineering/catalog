description: Adam Monroe's Upright Bass is a bass sample library VST plugin that
  works directly with your DAW. Featuring almost 2 gigs of sample data.
details: |-
  Adam Monroe's Upright Bass is a bass sample library VST plugin that works
  directly with your DAW. Featuring almost 2 gigs of sample data, slide up/down
  from/to major and minor thirds, percussive slapping, reverb, and 3-band
  equalization.

  24-bit, 44.1/48/88.2/96 khz sample library. Uses approximately 100 mb of ram.
  For windows platforms.

  Windows 2000 or higher, 4 gigs of ram, DAW, intel core 2 duo or higher. Ssd
  recommended. AAX version requires protools full.

  Os x 10.9 or later, intel core 2 duo 2.4 ghz, 4 gigs of ram, audio-unit
  compatible DAW. AAX version requires protools full. VST version requires
  32-bit DAW or bridge.

  Adam monroe's upright bass is a virtual instrument audio plugin for macos and
  windows. It functions as a VST plugin, an audio units plugin and an AAX
  plugin.
