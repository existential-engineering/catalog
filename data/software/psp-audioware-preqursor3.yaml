description: PSP preQursor3 is an analog-modeled parametric equalizer offering four bands of EQ with PSP's uniquely designed filters that exhibit low resonance peaks, reducing ringing artifacts and delivering great band separation and narrow notching when attenuating. All four filters are bell-type when boosting and feature progressive Q factors. Introduces PSP's Advanced Analog Modelling of preamplifier and filters for precise operation.
details: |-
  Requires iLok License Manager (no hardware dongle needed). License can be activated in 3 separate locations. FAT double sampling automatically engaged below 50 kHz sample rates. 64-bit double precision floating-point processing. Optional preamp and in-filter nonlinearities emulation. Optional second-generation SAT (saturation) output stage.
specs: |-
  - Four bands of parametric equalization
  - High Pass Filter
  - L/R/Mid/Side processing options
  - FAT double sampling: auto-engaged below 50 kHz
  - 64-bit double precision processing
  - Optional preamp and in-filter nonlinearities emulation
  - Optional second-generation SAT output stage
  - 31-band bar analyzer with spectrum curve display
  - Windows: 7-11 (VST2, VST3, AAX)
  - macOS: 10.14-16 (Intel and Apple Silicon, AU/VST2/VST3/AAX)
