description: PSP preQursor3 is an analog-modeled parametric equalizer offering four bands of EQ with PSP's uniquely designed filters that exhibit low resonance peaks, reducing ringing artifacts and delivering great band separation and narrow notching when attenuating. All four filters are bell-type when boosting and feature progressive Q factors. Introduces PSP's Advanced Analog Modelling of preamplifier and filters for precise operation.
details: |-
  PSP preQursor3 offers PSP's uniquely designed filters, with low resonance peaks for reduced ringing artifacts, great band separation, and narrow notching when attenuating. All four filters are bell-type filters when boosting and have progressive Q factors.

  PSP preQursor3 introduces PSP's Advanced Analog Modelling of preamplifier and filters to make the operation of the plug-in even more precise than previous PSP equalizer emulations.

  All these characteristics result in a processor that not only sounds excellent on acoustic tracks, overall mixes, or any other application, but also allows users to virtually create the input console for all tracks in a mix with easy and convenient controls. In every usage case, PSP preQursor3 will maintain the natural feel and definition of the material.
specs: |-
  - Four bands of parametric equalization: peaking Low and High on boost, shelving Low and High on cut, and peaking Low Mid and High Mid filter bands with adjustable frequency, Q, and gain-following Q values
  - High Pass Filter
  - Equalization can be applied to Left, Right, Mid, Side or to both input channels
  - FAT double sampling: FAT is automatically switched on for low (below 50 kHz) sample rates and off for higher sample rates, ensuring accurate processing independent of the sample rate
  - 64-bit double precision floating point math for ultra-low cumulative errors in the filters
  - An optional preamp and in-filters nonlinearities emulation
  - An optional second-generation SAT (SATuration) option in the output of the plug-in, located after the output level control, with its ceiling reference level set a fraction of a dB below 0 dBFS
  - All actual parameter values like gain, frequency, or Q may differ from displayed values, a typical feature of analog equalizers
  - A 31-band bar analyzer with optional spectrum curve display mode
  - Multi-step Q factor
  - Redesigned analog emulation
  - Wider frequency ranges
  - iLok user ID required (free), with no hardware dongle required
  - License can be activated in 3 separate locations, each either a computer or an iLok dongle (2nd generation or above)
