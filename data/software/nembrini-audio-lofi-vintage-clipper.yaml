description: Nembrini Audio LoFi Vintage Clipper is a saturation and distortion plugin designed to add grit and weight to your mix with two distinctive custom-designed algorithms. Use it to add presence and density to your tracks and control transients like the biggest mix engineers.
details:
  - "The LoFi Vintage Clipper features two distinctive custom-designed saturation algorithms: Distortion and Saturation. The Distortion mode is a finely tuned clip algorithm designed to limit transients as happens using a real analogue signal chain, increasing the density of your tracks."
  - The Saturation mode is a specially designed algorithm that mimics the behaviour of vintage analog equipment like old tape machines and mixing console input/output stages, delivering that warm, characterful sound.
  - From gentle clipping to wild distortion, the LoFi Vintage Clipper is ideal for use on individual tracks, busses, and the mix bus. It provides transient control capabilities that add presence and density to any source material.
  - The plugin is available for Mac OS 10.13 or newer (both Intel and Apple Silicon), Windows 7 or newer, and as an iOS app for iPhone and iPad. It supports VST2, VST3, AAX, and Audio Units formats for compatibility with all major 64-bit DAWs.
specs: |-
