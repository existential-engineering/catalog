details: |-
  Nembrini Audio LoFi Vintage Clipper plugin is designed to add grit and weight to your mix with two distinctive custom-designed saturation algorithms.

  Use LoFi Vintage Clipper to add presence and density to your tracks and control transients like the biggest Mix Engineers!

  From gentle clipping to wild distortion, the Nembrini Audio LoFi Vintage Clipper plugin is ideal for your Tracks, Busses and Mixbus.

  The Distortion algorithm is a finely tuned clip algorithm designed to limit the transients as happens using a real analogue signal chain and increase the density of your tracks.

  Saturation is a specially designed algorithm that mimics the behaviour of vintage analog equipment like old tape machines and mixing consoles input/output stage.
specs: |-
  - Two custom designed saturation algorithms, Distortion and Saturation
  - Distortion: finely tuned clip algorithm that limits transients like a real analogue signal chain and increases track density
  - Saturation: mimics the behaviour of vintage analog equipment such as old tape machines and mixing console input/output stages
  - Suitable for tracks, busses and mixbus
  - Plugin Formats: a VST2, VST3, AAX or AudioUnits compatible host
  - System: an Intel compatible or Apple Silicon CPU, 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
