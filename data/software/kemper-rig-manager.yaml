description: Editor and librarian application for managing PROFILER Rigs and Performances
details: |-
  Rig Manager is the free companion application for all KEMPER PROFILER models, providing a visual representation of the Rig you're currently playing with mouse-adjustable parameters and drag-and-drop effect arrangement.

  Assemble up to five Rigs per Performance using drag-and-drop, filter by amp models, cabinets, gain levels, and custom keyword tags, and live preview thousands of Rigs instantly on your PROFILER device. Access to 20,000+ free Profiles via the KEMPER Rig Exchange community platform is included.

  Features include backup, import/export, software update management for PROFILER devices, and multi-window support. Mobile versions support single-handed operation for live performance. Wi-Fi connectivity for mobile is built-in for PROFILER Stage; the Network port is required for Head and Rack models.
