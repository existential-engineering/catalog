description: The Master De-Esser will help you clean your audio from any
  unwanted sibilant consonants that may occur due to over compression or
  improper mic'ing.
details: |-
  The long-anticipated debut de-esser plugin from Antelope Audio is here. The Master De-Esser will help you clean your audio from any unwanted sibilant consonants which might have occurred due to a variety of reasons, among which over compression, improper mic'ing or individual voice specifics.

  Unlike similar plugins, the Antelope Audio Master De-Esser is extremely easy to use and effective against any artifacts. The unit control set is reduced to an absolute minimum, allowing you to pick the desired frequency, set a filtering type and adjust the Attack, Ratio, Knee and Release of the de-esser.

  The unit also allows you to switch between four modes of signal monitoring, making it straightforward to dial in the right amount of sibilance reduction for any source.

  The Master De-Esser runs in real-time on Antelope Audio Synergy Core interfaces, leveraging the on-board FPGA/DSP processing for low-latency operation during tracking and mixing.
specs: |-
  - De-esser plugin for taming sibilant consonants
  - Minimalist control set: Frequency, Filtering Type, Attack, Ratio, Knee, Release
  - Four modes of signal monitoring
  - Runs in real-time on Antelope Audio Synergy Core interfaces
