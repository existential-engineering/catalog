details: |-
  Create album-quality beats and custom DJ edits instinctively in Studio—the modern DAW with unrivaled sampling and powerful Stems technology.

  The fastest and most intuitive DAW for making beats. Build up your song sections using Drum, Sample, Instrument and Plugin Decks.

  Full support for your VST3 and Audio Unit effects and instrument plugins.
specs: |-
  - Full VST3 and Audio Unit (AU) plugin support
  - Drum, Sample, Instrument and Plugin Decks
  - Stems technology
  - Native control for AlphaTheta SLAB
  - Support for Roland SP-404MKII
  - Support for Reloop Keypad Pro
