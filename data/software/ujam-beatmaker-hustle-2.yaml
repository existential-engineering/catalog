description: Beats will keep you warm this winter – your studio is about to heat
  up with the version 2.0 update of the popular beatmaker series.
details: |-
  Beatmaker Hustle 2 is a virtual beat maker for Massive pumping trap, grime and
  bass music tracks, featuring exclusive genre-authentic sounds, patterns, and
  effects with fail-proof handling.

  Each plug-in is a specialist for a certain sound and genre designed for
  minimum complexity. Select instruments, add creative automated fx, shape the
  sound in the master section. You have creative control over every aspect of
  your track.

  We doubled the number of kits and more than doubled the included styles and
  presets. All three plug-ins have sizzling-hot new interfaces. They now boast
  MIDI drag-and-drop, so that you can edit patterns in your DAW or trigger other
  instruments. Adding individual outputs for each instrument opens an entirely
  new world of mixing options.

  Beatmaker hustle is your fixer for bass music styles like trap and grime. On
  the money for all types of modern urban style genres from dirty south to hip
  hop to big room bass music, hustle adds a wide range of basement-shaking
  grooves and gritty sounds to your production.

  Bass music genres are all about the beat - booming bass drums, frantic hi-hats
  and gritty snares. Hustle captures the spirit of the genre - sounds, patterns
  and mix. Get busy with a virtually unlimited combination of credible beats
  inspired by the legendary roland tr-808.
specs: |-
  - MIDI drag and drop
  - Multiple audio outputs
  - 10 booming drum kits
  - Over 40 styles
  - Up to 1000 patterns
  - Custom FX algorithms
  - Sweep FX
  - Ambience FX
  - 12 smart-mix presets
  - Full control over tempo
  - Full control over pitch
  - Full control over variations
  - Bass tune control
  - Master section sound shaping
  - Individual instrument sound shaping controls
  - Automated FX
  - Windows 7 or later
  - Mac OS X 10.11 or later
  - 4 GB of RAM
  - Up to 109 MB of disk space
  - 1280x768 px display minimum
  - Internet connection required
  - Logic 10 and newer for AU version
