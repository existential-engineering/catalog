description: Usynth FLUID empowers you with beautiful, easy-to-tweak sounds and arpeggio ideas, perfect for melodic techno or its inspired music.
details: |-
  Melodic Techno has conquered global music genres with numerous imitators and a vibrant scene. Usynth FLUID empowers you with beautiful, easy-to-tweak sounds and arpeggio ideas, perfect for melodic techno or its inspired music. Wide textures, big ambiences, soft and hard, edgy and floating, modern and retro, you will never run out of inspiration and flow.

  FLUID offers a wide palette of Arps, Basses, Keys, Leads, Pads, Plugs and Stabs. Except for beats, everything you need to produce convincing and captivating Melodic Techno is in there. It is also a great source of Melodic Techno elements for rock, pop, deep house, techno, movie scores and game soundtracks.

  Usynth is made for people who want to program their own synth sounds without programming synths, like most musicians. It features a powerful synthesizer engine that combines Virtual Analog, Wavetable, FM, and Multi Sampler, with dozens of filter modes, modulation matrices, envelopes, LFOs, and hundreds of parameters.

  Unleash effortless inspiration with Usynth and its powerful Synthesizer Engine, game-changing Finishers, flexible built-in delay and reverb units, intuitive browser, and a user-friendly interface.
specs: |-
  - Collection of beautiful sounds for Melodic Techno or any music inspired by it
  - Easy-to-tweak Arps, Basses, Keys, Leads, Pads, Plugs and Stabs
  - Revolutionary interface: create your own sounds without synthesizer knowledge
  - Powerful synthesizer engine with virtual analog, FM, wavetable and multisampler
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8GB of RAM
  - 1.25GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Requires the latest version of the UJAM App, which installs the Usynth plug-in that hosts all titles
