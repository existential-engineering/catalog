description: DeeMaximizer is a 32-band multi-frequency maximizer plug-in
  designed to achieve natural and powerful loudness with zero latency. It
  features M/S switching, a SOFTCLIP mode for smooth output character, and a
  SAFE button that prioritizes distortion resistance over maximum loudness.
details: |-
  DeeMaximizer is a flagship maximizer plug-in developed by Dotec-Audio, built around a 32-band multi-frequency architecture that aims to deliver loudness enhancement while preserving the natural character and musicality of the source material. The zero-latency design means it can be used throughout the production process without introducing monitoring delays.

  The plug-in is designed for approachable operation: a central dial handles the primary loudness control, while additional parameters allow deeper sound shaping. M/S (Mid/Side) switching enables separate processing of the mid and side signals, giving engineers precise control over the stereo field during maximization.

  The SOFTCLIP feature introduces a smooth, natural-sounding saturation character to the output, rounding transients gently rather than hard-clipping. Complementing this, the SAFE button shifts the plug-in's priority toward minimizing distortion rather than maximizing loudness, useful when preserving clarity is more important than sheer level.

  DeeMaximizer has been verified with over 20 DAWs including Ableton Live, Cubase, Logic Pro X, Pro Tools, Studio One, FL Studio, and OBS Studio. It is noted as part of Dotec-Audio's Max series, which can be used together for enhanced results.

  A free demo is available with a 1-second silence inserted every 30 seconds. Sound design was by Franck Shigetora, UI by IZMOJUKI and FUKUDAKOGYO, distributed by cyber rock.LLC and fmfmsoft Corp.
