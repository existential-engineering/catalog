description: Alphatron was inspired by the idea of creating a synthesizer for
  bass and high sequences which can serve as a companion to avatar st's pads,
details: |-
  Also, this 3rd oscillator serves as sync master for oscillator 2 thus offering
  much more sonic flavour. Amplitude modulation has got a dedicated adjustable
  output and uses oscillator 2 as the main source being modulated either by
  oscillator 1 or 3. Oscillator 1 is a polywave oscillator with up to 5
  additional waves, so you might have something like super saw, super pulse,
  super ramp, etc.

  Another highlight of alphatron is the versatile step sequencer with 8 + 4
  pattern slots which can be selected in real time for instant pattern
  switching. Setting note seq to off it can serve as step modulator. The gate
  length can be modulated by sources. Two play modes: normal with adjustable
  number of steps or step variation, which is in fact another 16 step sequencer
  to set different number of steps to be played in succession.

  Loops can be set to repeat up to 4 times, and two alternating semitone offsets
  can be set, e.g. For each 2nd, 3rd or 4th loop. There are 8 pattern slots per
  patch and 4 global pattern slots which can be used for instant pattern
  changes. Current pattern can be copied and pasted to a selectable slot, with
  the global slots even among patches.

  Both eg have 3 modes: exponential, reverse exponential, and linear; and
  optional control for attack and decay by velocity. The pro version is now free
  as nfg (nearly forgotten gems).
specs: |-
  - Virtual instrument
  - 3 oscillators (va, va, sample)
  - Polywave oscillator with up to 6 poly waves
  - Sample oscillator with digital waves (single cycle type)
  - Sync master/slave capability
  - Amplitude modulation with dedicated output
  - 24 dB resonant low pass filter
  - Dedicated ADSR eg for filter
  - VCA eg
  - 3 eg modes (exponential, reverse exponential, linear)
  - Velocity control for attack and decay
  - Booster or exciter
  - Mystify effect with 3 selectable types (brite, soft, dark)
  - Bpm synced delay with adjustable offset
  - Bass boost
  - Pan control
  - Reverb
  - Saturator
  - Volume control
  - 3 x LFO
  - 1 x duo LFO with phase control
  - 1 x s&h (sample and hold)
  - Pitch LFO with speed modulation
  - 16 step sequencer with shuffle
  - 8 pattern slots per patch
  - 4 global pattern slots
  - Step variation mode with 16 step sequencer
  - Gate length modulation
  - Loop repeat up to 4 times
  - Semitone offset control
  - 3 wheels
  - Aftertouch support
  - 8 lazy buttons
  - 8 gui variants
  - 128 patches
  - Windows compatible
