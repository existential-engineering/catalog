details: |-
  FEATURED IN:
  Toneforge ® Guilty Pleasure is a virtual guitar rig plugin and the perfect in-the-box blend of pedals, amp & cabinets to forge the ultimate high-gain tone. Whether you’re playing a blazing guitar lead on a pop track or ripping rhythms in a hard rock or metal band, Toneforge® Guilty Pleasure has what it takes to give you a mix-ready tone in minutes.
  The amp and effects within Toneforge ® Guilty Pleasure were designed in such a way that getting a bad tone out of the plugin is next to impossible. By controlling the chain from end-to-end, you don’t have to worry about gain staging issues or impedance matching as you might in a traditional guitar rig - everything is designed to just work together.
  How’s that for simplicity? Toneforge® Guilty Pleasure is high-gain guitar tone simplified.
  High-Gain Amp Head
  The biggest obstacle home recording guitarists face when tracking is the ability to saturate and drive their amp to overdrive. This is essential to many classic high-gain amp heads, as the breakup from the tubes creates the warm, gooey tone that we all know and love.
  Toneforge® Guilty Pleasure contains an all-new design for a high-gain amp head built by none other than Joey Sturgis himself. Leveraging knowledge of classic and modern tube amps, we’ve taken queues from the biggest and best amp manufacturers while creating something truly unique - a mix-ready, studio quality high-gain amp head with tons of range; no matter what level you run it at.
  Stereo-Ready Effects
  A highlight of working with guitar tones in-the-box is the ability to use studio-quality effects on your tracks. While Toneforge® Guilty Pleasure can be run in mono or stereo mode, the four built-in effects pedals are truly something special when their stereo potential is unlocked.
  Overdrive
  A mild distortion/overdrive pedal that enhances the dynamic response of the plugin to a guitarist’s playing. The overdrive sits in front of the amp head and can be used to push the amp further into breakup and saturation.
  999 Delay
  A vintage analog delay effect capable of producing warm, three-dimensional delays. Users can dial in lush, long-tailed repeats with just a slight hint of dirt in their tone as the Delay Level gets pushed harder.
  Wah Wah
  A classic Wah pedal capable of bringing tears to your eyes. Toneforge ® Guilty Pleasure is the sole member of the Toneforge ® lineup to feature this effect.
  Space Reverb
  A versatile reverb pedal capable of replicating spring, room, and hall reverb effects - plus something a little more extraterrestrial.
  Use all of these effects together or toggle them off individually with software-enabled true bypass.
  Massive-Sounding Cabinets
  Everyone knows that the biggest and best high-gain amp heads are paired with oversized 4x12” speaker cabinets and Toneforge® Guilty Pleasure is no exception! We’ve got two great options to choose from built right into the Live Room on the plugin.
  Messa 4x12
  The Mesa 4x12 is a classic closed-back cabinet loosely modeled after the thunderous low end that can be achieved using a Mesa/Boogie Rectifier Standard.
  Orange Custom 4x12
  The Orange Custom 4x12 is a tighter, more focused cabinet loosely modeled after the characteristics of an Orange PPC412 cabinet loaded with a custom speaker configuration.
  Industry-Standard Mic Locker
  As any studio engineer will tell you, the cabinet is only half the battle when recording guitars in a live room. This is why we’ve also included 4 unique microphone options for your use in Toneforge® Guilty Pleasure.
  Condenser
  An expensive-sounding microphone capable of capturing the full frequency spectrum in a detailed, transparent manner.
  421
  A classic dynamic microphone with more focused midrange and extended low end.
  57
  A studio workhorse dynamic microphone placed on-axis for direct, straightforward tone.
  57 off-axis
  The same studio workhorse placed off-axis for a slightly darker, rounded tone.
  Not finding the right combination? With Toneforge® Guilty Pleasure’s Impulse Response loader, you can import any of your favorite cabinet/microphone combinations from your collection. Check out our impulse response packs to learn more.
  Studio-Grade Parametric EQ & Limiter
  A huge part of achieving mix-ready guitar tones comes down to the post processing, which is why we’ve included a parametric EQ and limiter with Toneforge® Guilty Pleasure.
  Both processors are studio-grade effects units that could go toe-to-toe with the best dedicated EQ or limiters on the market, but we’ve chosen to pair them with Toneforge® Guilty Pleasure so we could fine-tune them to work their best with this amp. Rest assured you’re getting a fully optimized, end-to-end guitar tone solution with this plugin.
  Demo Videos
