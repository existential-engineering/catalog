description: "Abx3 is a bass line synthesizer capable of producing tb-303 acid
  sound sequences, it's the successor of acidbox. Features: 4 modes: host"
details: |-
  Synth part: oscillator with 32 waveforms to choose from + sub bass oscillator.
  Lp filter with high resonance for recreating "that acid sound".

  Fx part: 8 distortions with different character to choose: overdrive, hard
  clipping, valve emulation, hard drive, "bitcrusher", fuzz distorsion, clipper
  + filter, sinus remapper. Delay with ping/pong mode, free or sync to host
  tempo, lp/hp filter in feedback path. Fx rack with 3 slots and 7 fx to choose
  from: reverb, echo/reverb, digital reverb, stereo chorus, mono chorus, 4 band
  fuzz distorsion, flanger.

  Step note sequencer part: up to 64 steps with note / slide / accent + fine
  tune / micro time / pan for each step. 32 different patterns with independent
  number of steps per pattern (from 1 to 64). Global gate / groove parameter.
  Speed parameter (from 8 time slower to 4 time faster, with 2 ternary modes).

  Parameter modulation part: independent sequenced modulations for synth param:
  record or draw sequences of step modulations. 32 looped step modulation
  sequences with independent speed (from 16 time slower to 2 time faster).
  Parameters you can sequence: cutoff, resonance, filter envelope, filter decay,
  accent, gate, sub oscillator level, drive level, delay time / volume /
  feedback, waveform selection, note sequencer speed.
