details: |-
  Apollo is a subtractive synthesizer made specifically for bass sounds.
  Apollo's interface has been designed for ease of use, providing the ultimate
  user experience.

  It comes with a diverse sound bank with 70 pre-made bass presets so you can
  get started straight away making music. There are also 10 default presets for
  you to start creating your own sounds.

  Apollo consists of 2 oscillators, each oscillator with 2 waveforms. Inside the
  oscillators are sawtooth, square and sine waveforms.

  Apollo has an amplifier envelope, filter and filter envelope as well as pitch
  envelope and 2 easy to use effects: sample and hold and distortion to get
  those big bass sounds you hear in today's electro/house music.
specs: |-
  - Subtractive synthesizer
  - 2 oscillators
  - 2 waveforms per oscillator
  - Sawtooth waveform
  - Square waveform
  - Sine waveform
  - Amplifier envelope
  - Filter
  - Filter envelope
  - Pitch envelope
  - Sample and hold effect
  - Distortion effect
  - Windows compatible
