details: |-
  Modeled after a super rare and, of course, super sought after classic, BA-31 has managed to preserve the original sound of the Germanium transistors of its hardware inspiration. Packed to the top with real analog power, this mic preamp model will add an oldschool touch of your recordings while making the best of flexible and easy-to-use modern plugin design.

  BA-31 runs natively in your DAW on macOS or Windows, or in real-time on your Synergy Core interface. It is included with Antelope Cosmos, which unlocks 75+ Antelope native plugins.
specs: |-
  - Germanium-transistor mic preamp emulation
  - Models a rare classic broadcast / vintage hardware preamp
  - Flexible, modern plugin UI
  - Runs natively in your DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core interfaces
