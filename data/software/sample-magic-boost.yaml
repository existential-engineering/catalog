details: |-
  Boost is a simple, powerful mix finalising utility designed to get your music
  sounding as full and polished as possible using a minimal amount of
  processing. Utilising cutting-edge low-latency dsp, Boost adds multi-band
  compression, 4-band equalisation, stereo enhancement, brickwall limiting and
  filters out inaudible low frequencies to give a fuller, louder and wider
  mixdown.

  Boost is placed on the mix buss and can be used to master a processed track,
  subtly enhance an already finished project, or completely sculpt the dynamics
  of your song from start to finish, breathing fresh life into your music and
  readying for commercial release, club or radio play. Take an idea from start
  to finish using just 4 simple smart controls.

  Boost is not just for the mix buss. Place it on a muddy drum track for meaty
  width and energetic flare, give vocals a multi dimensional stereo edge,
  remaster old productions, fix live performances, dj mixes and voiceovers. Get
  foley recordings broadcast ready, redefine muddy midrange and make cumbersome,
  cpu-intensive mix chain processing a figment of the past.

  With its enhanced low latency settings mode, boost is suitable for tracking or
  can be placed on the mix buss from the outset, making tracks quickly and
  easily comparable with commercially finished masters. With a plain, easy to
  use interface, controls are laid out elegantly yet simply, with a 'boost'
  setting for re-ordering components to give greater gain and bass output.

  The compression parameter increases the effect of the multi band compression
  on the audio. The colour parameter adjusts the spectral balance of the audio
  through the use of a dynamically interactive equaliser circuit, with the
  defining characteristic to boost bass frequencies around 50-100hz while
  inversely cutting midrange around 2khz - 4khz and adding subtle high-frequency
  gain around 9khz - 14khz. The stereo parameter adjusts the stereo field of the
  audio and will widen the elements of the sound which are panned between the
  two l/r channels and leave mono signals unaffected. The limiter parameter is a
  powerful compression and peak limiting processor capable of transparently
  'shaving off' a few db to slam a mix for maximum impact while still
  maintaining clarity.
