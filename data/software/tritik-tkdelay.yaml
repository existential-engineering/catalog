description: "A versatile delay plugin featuring independent left/right delay
  times, feedback, and time modulations to create wide and animated delays.
  Includes a frequency shifter in the feedback path, warm drive with analog
  modeling, reverse module, and filter modulations."
details: |-
  Host-synced and free delay times (per channel). Tap-tempo functionality. Overdrive and ducking controls. Frequency shifter in feedback path. Reverse module for blended echoes. Resonant filters (low-pass, high-pass, band-pass). Filter modulations with free or synced LFO. MIDI-learn capability. Fully resizable interface. Preset browser with safe-recall freezer. Dark/bright UI themes. Multi-language support (English, French, Spanish, Portuguese).
specs: |-
  Version 1.5.0. macOS 10.9 or later. Windows 7 or later. Demo available with periodic muted output.
