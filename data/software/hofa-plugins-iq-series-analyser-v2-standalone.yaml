description: IQ-Series Analyser V2 (Standalone) is the standalone analyser app for Windows and Mac, offering all features of the plugin version without a DAW. It supports live analysis of any audio source, loudness measurement, stereo correlation and peak metering, network linking between computers, and DAW integration via the included NetAux plugin.
details: |-
  The IQ-Series Analyser V2 (Standalone) is the analyser app for Win & Mac that has all the beloved features of the IQ-Series Analyser V2 (Plugin) plus a new range of possibilities. The IQ-Series Analyser V2 has become an essential tool for spectrum and sound analysis in countless studios worldwide. The new standalone version can be used without a DAW. However, you can use the included NetAux plugin to connect the IQ-Series Analyser V2 with your DAW.

  The standalone version is an essential tool for live mixing, not only for spectrum analysis but for loudness measurement, stereo correlation and peak level display of different frequency ranges. The IQ-Series Analyser displays the frequency spectrum as a peak, hold, RMS and energy curve. The energy curve represents the frequency spectrum over time. Reference curves from various styles of music are included. You can create and save your own references as well.

  The high resolution frequency analysis, simultaneous display of multiple signals in one window, continuous frequency zoom and the seamless interaction with the HOFA IQ-Series EQ make the HOFA IQ-Series Analyser V2 an indispensable aid for your ears.
specs: |-
  - Version: 2.0.19
  - Format: Standalone application
  - Operating System: macOS 10.13 or later, Windows 10 or later
  - 32 and 64-bit support
  - Standalone analyser app — audio analysis without a DAW
  - Network functionality to connect 2 IQ-Series Analyser on different computers
  - DAW integration via the free IQ-Series Analyser NetAux plugin
  - Live analysis of any audio source (microphone, DAW, iTunes, media player…)
  - Peak, hold, RMS, and energy curve analysis
  - Precise metering (peak, hold, EBU, LRA, RMS) with inter-sample peak detection
  - Goniometer and correlator
  - Innovative 31-band frequency correlator
  - High resolution analyser: frequencies from 5 Hz up to half the sample rate
  - Selectable display resolution (from high resolution to octave band)
  - Simultaneous display of multiple signals
  - Continuous frequency zoom — always using 121 measuring points in the selected range
  - Automatic highlighting of peaks and dips
  - IQ-Series Analyser measurements can be sent to the IQ-Series EQ
  - Selectable input signal (mid, side, left, right)
  - Two curves for M/S and L/R
  - Wide range of reference curves for different styles of music
  - Reference curve management with subfolders
  - User-created reference curves
  - Pink noise / white noise weighting
  - Optional meter only mode
  - Direct analysis via drag & drop of .wav, .aif, .mp3, .flac, .ogg files
  - Scalable window size
  - Optional font size scaling for very large displays
  - Screenshot feature
  - Supports all common sample rates without latency
  - Filter bank technology for 100% precision (even at low frequencies)
  - Two licenses included; managed via HOFA Plugins Manager
  - Offline activation supported
