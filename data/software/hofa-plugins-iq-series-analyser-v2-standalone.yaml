details: |-
  The IQ-Series Analyser V2 (Standalone) is the analyser app for Win & Mac that has all the beloved features of the IQ-Series Analyser V2 (Plugin) plus a new range of possibilities. The IQ-Series Analyser V2 has become an essential tool for spectrum and sound analysis in countless studios worldwide. The new standalone version can be used without a DAW. However, you can use the included NetAux plugin to connect the IQ-Series Analyser V2 with your DAW. The standalone version is an essential tool for live mixing, not only for spectrum analysis but for loudness measurement, stereo correlation and peak level display of different frequency ranges. The IQ-Series Analyser displays the frequency spectrum as a peak, hold, RMS and energy curve. The energy curve represents the frequency spectrum over time. Reference curves from various styles of music are included. You can create and save your own references as well. The high resolution frequency analysis, simultaneous display of multiple signals in one window, continuous frequency zoom and the seamless interaction with the HOFA IQ-Series EQ make the HOFA IQ-Series Analyser V2 an indispensable aid for your ears. Show extended video Features V2.0.19: standalone analyser app for Win & Mac audio analysis without a DAW network functionality to connect 2 IQ-Series Analyser on different computers DAW integration via the free IQ-Series Analyser NetAux plugin live analysis of any audio source (microphone, DAW, iTunes, media player …) measuring tool for studios and live events (frequency, loudness, stereo correlation) high resolution analyser with peak, hold, RMS and energy curves precise metering (peak, hold, EBU, LRA, RMS) with inter sample peak detection goniometer and correlator innovative 31 band frequency correlator user-created reference curves filter bank technology for 100 % precision (even at low frequencies!) frequencies from 5 Hz up to half the sample rate can be displayed selectable display resolution (from high resolution 