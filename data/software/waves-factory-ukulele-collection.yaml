description: Ukulele Collection is a Kontakt library for creating realistic ukulele tracks, with both the strum and the finger version included.
details: |-
  Ukuleles are everywhere featured in thousands of happy commercials around the globe, wherever you go… you can't escape. Includes major/minor strums, up-stroke/down-stroke and noises. It also recognises other types of chords like add9, major and minor 7s and more. Recorded in stereo in a dry studio environment all with 5 velocity layers and 3 round robin.

  This is not a strumming engine created from single notes, Ukulele Collection are real strums played on a wooden ukulele. The chords were sampled in the same way that real players do: in low velocities, just the first strings are played. Includes up-strokes and down-strokes. With the chord recognition script, you can just play any chord you want from the blue keys and strum the ukulele using the white keys, and the script will play the real sampled chords.

  From the main page you can select between the Strum and the Finger version. The strum will feature all the chord recognition and strumming functionalities, while the Finger version will feature solo notes. Ukulele Finger adds single notes to create melodies or add tensions to chords.

  In the effects page, you can add 23 DSP effects in any order you want, from an SSL style compressor and EQ to a Transient Shaper and a convolution engine with more than 30 custom impulse responses.

  From the settings page you can control any parameter that you might ever need: up to 3 round robin, dynamic range of the instrument, velocity curve and a doubler engine that will play two different notes in stereo so you get a wider effect ready to be used in your tracks.
specs: |-
  - Size: 771 MB
  - 1,085 samples
  - 5 velocity layers
  - 3 round robin
  - 2 articulations
  - Strum and Finger versions included in a single library
  - Chord recognition script for major, minor, add9, major 7 and minor 7 chords
  - Up-strokes, down-strokes and fret noises
  - Recorded in stereo in a dry studio environment
  - 23 DSP effects that can be chained in any order, including an SSL style compressor and EQ, a transient shaper and a convolution engine with more than 30 custom impulse responses
  - Doubler engine for wider stereo playback
  - Works with Kontakt 5.7.3 and newer versions. Full version of Kontakt required, Kontakt Player will run in demo mode
