description: HoRNet MultiFreqs is a spectrum analyzer that provides two different kinds of visualisation of the audio spectrum for up to 28 tracks together.
details: |-
  HoRNet MultiFreqs is a versatile spectrum analyzer plugin designed to provide detailed visual feedback of the audio spectrum across multiple tracks. It helps identify problematic frequencies and allows you to visualize and monitor the frequency content of up to 28 tracks simultaneously.

  The first visualization type is the analog view, inspired by traditional analog hardware spectrum analyzers, offering a smooth and organic display of the frequency spectrum. The second, the digital view, is a modern FFT-based spectrum analyzer that provides a more precise, detailed and high-resolution representation of the audio, making it easier to spot sharp peaks or unwanted resonances.

  The plugin allows you to select which tracks to display, and in VST3 and AAX formats it can read the track names directly from the host. A conflict button helps find frequency collisions between multiple tracks by isolating the frequencies that are common across all enabled tracks, which is useful for issues such as a kick drum and bass fighting for space in the low end.

  MultiFreqs can also display both the mid (sum) and side (difference) components of a stereo signal, which helps isolate the center and outer parts of the stereo field when checking stereo width or phase. It comes with a fully resizable, hardware accelerated GUI and is designed to use very little CPU, consuming almost nothing when the GUI is closed.
specs: |-
  - Two different spectrum views, analog and digital
  - Selectable dBs range
  - Three different integration times
  - Peaks and average display and reset
  - Mid/Side mode (display sum of stereo channels or difference)
  - Up to 28 different tracks can be shown at once
  - Conflict mode to display overlapping spectrum between tracks
  - Instances get the track name automatically (available in VST3 and AAX formats)
  - Analyzer color freely selectable for every instance
  - Preset save and load
  - Resizable vector GUI
  - Hardware accelerated GUI
  - Apple Silicon native support
  - Mac OS X (10.13 and later) and Windows (7 and later) support
  - 64-bit plugins for macOS and Windows
  - Audio Units, VST, VST3 and AAX format
  - No copy protection
