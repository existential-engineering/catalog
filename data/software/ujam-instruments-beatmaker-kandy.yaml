description: Kandy is a bleeding-edge virtual beatmaker, employing extremely processed samples and state-of-the-art sound design for the top of the billboard charts. Easily create beats for the entire bandwidth of modern a-list pop music.
details: |-
  Kandy is a bleeding-edge virtual beatmaker, employing extremely processed
  samples and state-of-the-art sound design for the top of the billboard charts.
  Easily create beats for the entire bandwidth of modern a-list pop music.

  The proprietary sweetness control shapes huge sounds with the help of
  multiband compression and a transient designer so the drums cut through the
  mix better.

  Kandy is the new title in UJAM's Beatmaker series, which makes producing
  outstanding beats for your music fast and easy. It instantly syncs to your
  DAW's tempo, and you can play a near-infinite variety of beats.

  Kandy features 12 kits with 16 drum instruments each. There are 20 styles with
  23 ready-made patterns each, for a total of 460 patterns. Plus: easy access to
  all the effects you need to make punchy contemporary beats that will actually
  leave an impression.

  Kandy's clean and simple interface makes it easy to create your music without
  overthinking! Pick a mix preset and dial in its character to your desire.
specs: |-
  - 10 drum kits, 16 instruments each
  - 460 patterns across 20 styles
  - MIDI drag and drop, resizable UI
  - "Sweetness" Special Control
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8GB of RAM
  - 0.96GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Supported standards: MIDI
  - Requires the latest version of the UJAM App, which installs the Beatmaker plug-in that hosts all titles
