details: |-
  Stylus RMX is an award-winning loop-based virtual instrument plug-in featured on countless recordings since 2004. It combines the world of Groove Control with Spectrasonics Advanced Groove Engine (S.A.G.E.) technology, giving users dramatic control over loop-based groove production with dozens of innovative features.

  The revolutionary Time Designer feature allows realtime changing of audio grooves to any time signature, feel, or swing. Grooves can adapt from straight to swing, from 4/4 to 6/8, and everything in between without any loss in audio quality.

  Chaos Designer injects musical chaos into grooves, allowing them to have organic variation as if audio grooves are improvising. The results can be subtle or extreme. The 14GB core library contains nearly triple the sounds of the original Stylus, with thousands of grooves produced by Eric Persing.

  Grooves are broken down into individual tracks, allowing detailed editing and customization. The instrument supports third-party library integration and user audio loops via ReCycle, with non-destructive effects processing on individual loop elements.
specs: |-
  - Spectrasonics Advanced Groove Engine (S.A.G.E.) technology
  - Revolutionary Time Designer for changing grooves to any time signature or feel
  - Chaos Designer for organic variation in grooves
  - Nearly 10,000 included grooves and sounds
  - 14GB core library (triple the size of original Stylus)
  - Automatic pattern variations and groove simplifying
  - Realtime auto-sync to beat for perfect timing
  - Individual track control within stereo loops
  - Third-party library support with hundreds of available titles
  - User audio loop import via ReCycle
  - Non-destructive effects processing on individual loop elements
  - Requires 4GB RAM minimum, 15GB free hard drive space
