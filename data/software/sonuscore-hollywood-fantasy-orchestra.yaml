description: An extensive orchestra library that includes everything you need to create fantasy film, television, and game soundtracks. Produced by sound titans Doug Rogers and Nick Phoenix.
details: |-
  Hollywood Fantasy Orchestra is a complete orchestral collection built for fantasy film, television and game scoring. It gathers ensembles of traditional and world instruments recorded in full stereo mic placement at EastWest Studio One, the same soundstage used for the Hollywood Orchestra series, and runs in EastWest's Opus player. The collection is made up of six parts: Hollywood Fantasy Strings, Hollywood Fantasy Brass, Hollywood Fantasy Winds, Hollywood Fantasy Percussion, Hollywood Fantasy Voices and Hollywood Fantasy Orchestrator.

  The strings replace the conventional sections with period and folk equivalents: viola da gamba ensembles in place of celli, hardanger fiddle ensembles in place of violins, lutes and dulcimers recorded in trios, hurdy gurdies, and traditional high and low string ensembles recorded in octaves. The brass follows the same idea, with flugelhorns instead of trumpets and Wagner tubas and alpenhorns instead of French horns, each core instrument recorded in ensembles of three. The winds section is rooted in Celtic musical literature and carries instruments with no parallel in the modern orchestra, including Uilleann pipes, ocarinas and Irish whistles. Every instrument in the series offers three Moods, Classic, Soft and Epic, which instantly change the mic mix, reverb and dynamic layer emphasis. True legato and broad articulation sets run throughout.

  Hollywood Fantasy Percussion adds struck and shaken instruments chosen specifically for fantasy scoring, with articulations mapped to white keys for two-handed playing techniques, covering bodhrans, gran cassas, taikos, a nagado ensemble, ceng ceng, crotales, cymbal and gong ensembles, krakeb, shakers and more. Hollywood Fantasy Voices puts the voice of singer Merethe Soltvedt, lead vocalist for Two Steps From Hell, alongside full male and female choirs, with multiple microphone positions, portamento control and the same three Moods. Every word recorded for the Voices library is taken from Tolkien's Elvish language.

  Hollywood Fantasy Orchestrator was developed in collaboration with Sonuscore and builds on their Scoring Engine, creating real-time orchestral arrangements from simple chords played with one hand while the other shapes expression. It carries hundreds of customizable presets organized into Ensembles, Ostinatos, Scores and User categories, adds a fifth Voices instrument section alongside strings, brass, winds and percussion, and includes a mixer with per-instrument volume, pan, EQ, reverb preset, send amounts, pre-delay, length and filters. Presets can be altered by changing the melodic pattern in each step sequencer or by switching instruments and voicings outright.
specs: |-
  - Six-part collection: Hollywood Fantasy Strings, Brass, Winds, Percussion, Voices and Orchestrator
  - Runs in the EastWest Opus player (EW Opus Stand-Alone 1.0+ or EW Play 6 Stand-Alone 6.0+)
  - Recorded in full stereo mic placement at EastWest Studio One
  - 3 Moods per instrument (Classic, Soft, Epic) changing mic mix, reverb and dynamic layer emphasis
  - True legato and multiple articulations across strings, brass and winds
  - Voices section featuring singer Merethe Soltvedt plus full male and female choirs, sung in Tolkien's Elvish
  - Hollywood Fantasy Orchestrator: hundreds of presets in Ensembles, Ostinatos, Scores and User categories, with 5 instrument sections
  - Orchestrator mixer with volume, pan, EQ, reverb preset, reverb sends, pre-delay, length and filters per instrument
  - Percussion samples mapped to white keys for two-handed playing, with round robins up to RRx4
  - Requires a free iLok account; licensing via machine license activation or USB dongle
  - Minimum system: quad-core CPU at 2.7 GHz or above, 16 GB RAM, HDD (7200 rpm, non-energy saving)
  - Recommended system: octa-core CPU at 2.7 GHz or above, 32 GB RAM or more, SSD (SATA or PCIe)
  - macOS 10.13 or later; Windows 10 with ASIO sound drivers
  - Officially supported hosts include Ableton Live 10+, Apple Logic Pro 10+, Pro Tools and other 64-bit DAWs; VST3 usage recommended
