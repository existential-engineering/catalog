description: "Oberheim OB-X inspired synthesizer capturing the legendary sound
  with polyphonic unison mode stacking up to 16 voices per note, advanced preset
  search, bi-directional MIDI control, analog mode simulation with per-voice
  component tolerances, and multi-mode resonant filter with self-oscillation."
details: |-
  Dual oscillators with cross-modulation and pulse width modulation

  Up to 16 voices per note polyphonic unison

  Multi-mode resonant filter with self-oscillation, 4-pole ladder topology

  Analog Mode simulation, MTS-ESP microtuning, LFO DAW sync, bi-directional MIDI with MIDI Out

  None built-in (designed as pure foundation for external processing)
