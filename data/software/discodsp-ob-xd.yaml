description: Emulation of the Oberheim OB-X with dual independent LFOs,
  aftertouch for non-MPE keyboards with multi-destination routing and Poly AT
  mode, full MPE support with multi-destination Y-axis routing, automatic MPE
  controller configuration via RPN, hardware-named MPE preset library, live LED
  previews on every MPE-routed knob, Knob LED Visualizer system for real-time
  visual feedback, polyphonic unison up to 16 voices per note, multimode
  self-oscillating filter, exponential and linear envelope shapes, Analog Mode
  with per-voice component tolerances, reworked MIDI Learn workflow,
  bidirectional MIDI for hardware control surfaces, MTS-ESP micro-tuning,
  searchable preset browser, SIMD audio engine (AVX2/NEON), and up to 4x
  oversampling.
details: |-
  Dual oscillators with cross-modulation and pulse width modulation

  Up to 16 voices per note polyphonic unison

  Multi-mode resonant filter with self-oscillation, 4-pole ladder topology

  Analog Mode simulation, MTS-ESP microtuning, LFO DAW sync, bi-directional MIDI with MIDI Out

  None built-in (designed as pure foundation for external processing)
