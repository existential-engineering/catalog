description: Emulation of the Oberheim OB-X with dual independent LFOs, full MPE support with multi-destination Y-axis routing, polyphonic unison up to 16 voices per note, multimode self-oscillating filter, Analog Mode with per-voice component tolerances, MTS-ESP micro-tuning, searchable preset browser, SIMD audio engine, and up to 4x oversampling.
details: |-
  Dual oscillators with cross-modulation and pulse width modulation

  Up to 16 voices per note polyphonic unison

  Multi-mode resonant filter with self-oscillation, 4-pole ladder topology

  Analog Mode simulation, MTS-ESP microtuning, LFO DAW sync, bi-directional MIDI with MIDI Out

  None built-in (designed as pure foundation for external processing)
