details: |-
  In partnership with bbc studios and the world-famous bbc symphony orchestra,
  Spitfire Audio has captured what no other sample library has before: the
  musical synergy of a family of astoundingly accomplished players with a
  90-year heritage of performances and recordings, expertly recorded at London's
  famous maida vale studios home of the bbcso, and host to the beatles, hendrix
  and bowie.

  Our most expansive and ambitious project to date, this landmark library is the
  stuff of composing dreams: strings, brass, woodwind and percussion, presented
  in our award-winning dedicated plugin.

  The library also includes a piano.
