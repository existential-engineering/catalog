description: With UFX DISTORT's 20 versatile modes, you easily add richness and harmonies to mixes, add punch and fat to drums, create cut-through vocal sounds and of course enjoy stunning guitar distortion.
details: |-
  Distortion can be so much more than just "tube or transistor". With UFX DISTORT's 20 versatile modes, you easily add richness and harmonies to mixes, add punch and fat to drums, create cut-through vocal sounds and of course enjoy stunning guitar distortion.

  Warm saturation to evil distortion, a special bass algorithm leaving the low-end clean to harsh synth foldback, complex multiband distortion to sci-fi inharmonics: no matter what your need is, UFX DISTORT has got you. UFX DISTORT offers 20 distinctly different distortion algorithms from analog to digital, organic to sci-fi, traditional to creative.

  The 24 built-in speaker emulations range from old radios to guitar amp cabinets, allowing you to shape your distortion signal in any way from traditional to creative. With them you can build virtually any distortion sound you can imagine.

  The distorted as well as your input signal (bypassing distortion) can be sent into the Filter, which offers basic EQs, synth filters and more, and the Finisher which comes loaded with all kinds of effects from a simple chorus to a cloud of grains and rhythmification. The intelligent randomization of UFX plug-ins provides instant surprises on the press of a button, adjustable using the Small/Big control from subtle variations to totally new distortion presets.
specs: |-
  - 20 distortion modes from Waveshaping to brutal Screamer
  - Modes: Tube Drive, Screamer, Guitar Amp, Hard Clipping, Fuzz, Bad Tube, Resonant Howl, Clean Bass, EDM Distortion, Tape Saturation, Preamp Saturation, Dynamic Distortion, Waveshape, Foldback, Rectify, Octave, Multiband Spread, Multiband Dense, Ring Modulation, Inharmonic
  - Built-in speaker simulation, 24 emulations from old radios to guitar amp cabinets
  - Multi-effect sections with 40 Filter and 50 Finisher algorithms
  - 150+ categorized presets plus intelligent variation and randomization
  - Operating systems: Windows 10 to Windows 11, macOS Catalina (10.15) to macOS Tahoe (26)
  - Minimum 8GB of RAM
  - 0.3GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - VST 2, AAX and AU 2 supported on Intel Macs and Apple silicon Macs
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Requires the latest version of the UJAM App, which installs the UFX plug-in that hosts all titles
