description: Future MB is the ultimate time- and frequency-domain multiband dynamic processor. It delivers comprehensive control over dynamics and frequency content through three processing stages per band, featuring revolutionary Delta Matrix technology for routing gain deltas between bands.
details: |-
  Up to 6 independent dynamic bands with variable crossover slopes from 6 to 48 dB/oct and three phase modes: Minimum Phase, Linear Phase, and Liquid Phase. Each band features a complete dynamic processing suite including Gate, Upward/Spike upward compressor, and Compressor/Ducking with three morphable character styles: Clean, Glue, and OTT. Spectral Mode enables fluid continuum processing where time-domain and frequency-domain coexist, allowing resonance taming and harmonic lifting within each band. Delta Matrix routes gain deltas between bands — compress one range and use the reduction signal to boost another for inter-band dynamic relationships. Auto-Gain uses the ITU 1770 loudness matching algorithm to balance output across any processing configuration.
specs: |-
  - Up to 6 independent dynamic bands
  - Variable crossover slopes: 6–48 dB/oct
  - Phase modes: Minimum Phase, Linear Phase, Liquid Phase
  - Per-band processing: Gate, Upward, Spike, Compressor, Ducking
  - Dynamic character styles: Clean, Glue, OTT (morphable)
  - Spectral Mode for time/frequency domain hybrid processing
  - Delta Matrix inter-band gain delta routing
  - Priority EQ sidechain for targeted triggering
  - Auto-Gain using ITU 1770 loudness matching
  - L/R and M/S sidechain modes with adjustable stereo linking
  - Real-time Spectrum Analyzer
  - Global Delta Scale, Global Time Adjustment, Global Mix Control
  - Lookahead and Oversampling
  - 64-bit processing precision
  - GPU-accelerated graphics
  - Native Apple Silicon support
  - Retina / High-DPI support
  - Extreme CPU optimization
  - Advanced preset browser with tag filtering
  - Compact Mode for custom streamlined interfaces
  - Undo/Redo, A/B switching
  - Theme & skin support, resizable GUI, full-screen mode
  - Minimum: Intel or AMD CPU with SSE 4.1, or Apple Silicon
  - Minimum OS: macOS 10.15 / Windows 8
  - Minimum RAM: 4 GB
  - Disk space: 250 MB
