description: "Ultimate time- and frequency-domain multiband dynamic processor
  with up to six independent bands, three processing stages per band, and
  revolutionary Delta Matrix technology for routing gain deltas between bands."
details: |-
  Three phase modes (Minimum Phase, Linear Phase, Liquid Phase). Gate, Upward/Spike, and Compressor/Ducking processing stages per band. Dual-threshold upward compression design. Priority EQ. Compact Mode. Variable slopes from 6 dB/oct to 48 dB/oct. Versatile side-chain functionality. Modern preset management.
