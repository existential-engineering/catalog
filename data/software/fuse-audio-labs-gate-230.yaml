description: An optical noise gate plugin modeled on the DOD 230 Noise Gate pedal. The original had only a single Threshold knob; Gate-230 extends it with Range and Level controls for finer gain-reduction tuning, plus a Hold function for creative gating effects. An optical switching circuit silences the output whenever the input drops below the threshold, with a GR LED indicating gate status in real time.
details: |-
  Emulates the DOD 230 Noise Gate (optical pedal). Part of the VPB-Bundle virtual pedal board collection. The optical circuit silences the output when input drops below threshold — zero-latency switching for live tracking. Hold function extends gate hold time for creative applications. GR LED shows gate open/close status in real time. Both 32-bit and 64-bit versions included.
specs: |-
  Controls: Threshold (activation level), Range (maximum gain reduction), Level (output gain), Hold (extends gate hold time), GR LED (open/close status indicator). Latency: zero-latency. macOS 10.9+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+, 2 GHz Intel CPU+, 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX (32-bit and 64-bit). Copy protection: serial number.
