description: PSP Flare is a new kind of psycho-acoustic compressor that provides exceptional volume consistency without the usual audible side effects associated with heavy compression.
details: |-
  PSP Flare (originally PSP Flow) is a new kind of psycho-acoustic compressor that provides exceptional volume consistency without the usual audible side effects associated with heavy compression. Developed with insights from post-production engineer Paolo Pasquariello, PSP Flare uses a psychoacoustic approach inspired by advanced post-production techniques to subtly maintain track level consistency. This ensures the audio remains naturally dynamic without the perceptible effects of compression.

  While it was specifically designed for film and TV/video post-production, its unique behavior can deliver excellent results in almost any application, and is excellent at leveling elements in a dense mix.

  Due to an unforeseen trademark conflict with an unreleased product, PSP decided to change the name of the compressor from PSP Flow to PSP Flare.

  Running PSP Flare in 30-day trial mode or activating it requires an iLok user ID, free to create at www.ilok.com, and the free iLok License Manager application, but no hardware dongle. The license can be activated in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above). Licenses can be moved at any time using PACE's iLok License Manager software.
specs: |-
  - Single-band unique probability compression algorithm
  - Wide compression knee
  - Peak or RMS level detector
  - Optional automatic release readjustment
  - Wide range of threshold and ratio settings
  - Preamp section modeling on input
  - Lookahead for reduction of transients through the compressor
  - Smooth control of the side chain high pass filter and link
  - Optional automatic makeup gain
  - Dry/Compressed Mix control
  - Output brick wall limiter with adjustable ceiling level and release time
  - 64-bit double precision floating point math for ultra-low cumulative errors in the filters and proper filter characteristics across the entire frequency spectrum
  - Windows 7 - Windows 11 (64-bit VST, VST3, AAX)
  - macOS 10.14 Mojave - macOS 15 Sequoia, Intel and Apple Silicon (64-bit AudioUnit, VST, VST3, AAX)
  - Requires a free iLok user ID and iLok License Manager
  - No hardware dongle required
  - License activation in up to 3 separate locations
