description: "A new kind of psycho-acoustic compressor that maintains volume
  consistency without typical compression artifacts, developed with
  post-production engineer Paolo Pasquariello."
details: |-
  Single-band probability compression algorithm. Peak or RMS level detection. Wide compression knee. Optional automatic release and makeup gain. Lookahead for transient control. Adjustable side chain high-pass filter. Output brick wall limiter. 64-bit double precision floating point processing. Supports up to 70dB of compression.
