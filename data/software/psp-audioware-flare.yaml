description: PSP Flare (formerly PSP Flow) is a psycho-acoustic compressor designed to maintain volume consistency without typical compression artifacts. Originally developed for film and TV post-production, it works across diverse applications.
details: |-
  PSP Flare (formerly PSP Flow) is a psycho-acoustic compressor featuring a single-band probability compression algorithm with a wide compression knee and adjustable ratio. Peak or RMS detection modes, automatic release readjustment, lookahead for transient control, preamp modeling on input, side-chain high-pass filter, automatic makeup gain, dry/compressed mix blending, output brick wall limiter, and 64-bit double-precision floating-point processing.

  30-day trial available. iLok License Manager required (no hardware dongle needed). Up to 3 activation locations allowed.
