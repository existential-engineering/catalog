description: DeeEQ is a semi-automatic equalizer VST2, VST3, AU, and AAX plug-in
  that lets you achieve the best equalization with only two sliders. A vertical
  slider controls cut and boost while a horizontal slider emphasizes bass or
  treble, making intuitive EQ adjustments accessible to any skill level.
details: |-
  DeeEQ is a semi-automatic equalizer plug-in by Dotec-Audio designed around radical simplicity. Its entire interface is built on just two sliders, allowing users to dial in equalization by feel rather than requiring deep technical knowledge of frequency curves or filter types.

  The vertical slider controls the amount of cut or boost applied to the signal. Moving it upward boosts the chosen frequency region while moving it downward cuts it. The horizontal slider shifts the spectral emphasis between bass and treble, letting users sculpt the low-end or high-end character of a sound in a single gesture.

  Because the equalization curve is computed semi-automatically from these two controls, DeeEQ abstracts away the complexity of traditional parametric or graphic EQs. This makes it particularly useful as a quick tone-shaping tool inside busy sessions where speed matters more than surgical precision.

  The plug-in supports a broad range of professional DAWs including Ableton Live, Cubase, Logic Pro X, Pro Tools, Studio One, FL Studio, Reason, Bitwig Studio, and OBS Studio, among others. A demo version is available that introduces one second of silence every thirty seconds; a purchased serial key removes this limitation.

  DeeEQ was initially released in October 2016 and has received steady maintenance updates through January 2026, including Apple Silicon support, AAX format availability, and graphics performance improvements.
