description: HoRNet SongKey is a tool designed as a chord, tempo and key finder for any song or audio stream. It works as an app or plugin.
details: |-
  HoRNet SongKey MK4 is the latest iteration of HoRNet's chord, key and tempo recognition tool. Version 4 goes beyond simple key detection by recognizing not only the key of the song but also the chord being played and the song's tempo.

  SongKey MK4 can process MIDI input, allowing users to detect the chords and key of MIDI tracks, and it also has MIDI output functionality so that recognized chords can be sent as MIDI data and recorded or edited. A standalone version can generate a MIDI clock, allowing other MIDI gear to be synchronized with live audio input.

  The chromagram, a visual representation of the intensity of each note played, has been upgraded to take a broader octave range into account and filter out minor tuning discrepancies. It feeds an artificial intelligence unit trained to detect a wide range of chords including sevenths, fifths and suspended chords. The key detection engine adds a second AI unit based on a statistical chord progression model, and unlike earlier versions it tracks key changes continuously in real time rather than needing a reset.

  The GUI displays two chromagrams, one for chord recognition and one for key recognition, plus a keyboard display that visually shows the keys being played. SongKey MK4 works offline inside the DAW, and the standalone app for macOS and Windows can be fed audio from other apps or a live recording, making it suitable for live performance and DJ use.
specs: |-
  - Artificial intelligence driven key identification that follows key changes
  - Realtime audio and MIDI chord detection
  - Confidence display for each found key
  - Key and chord chromagram that shows each note level
  - Key and chord piano roll view to see which notes are active
  - Sample mode for short sounds analysis
  - Realtime tempo detection
  - MIDI output of detected chords
  - Stand alone app for both Mac and Windows
  - MIDI clock output (in the stand alone app)
  - Sharp and flat notation
  - Resizable vector GUI
  - Hardware accelerated GUI
  - Apple Silicon native support
  - macOS (10.11 and later) and Windows (7 and later, OpenGL 2.1 required) support
  - 64-bit only plugins for macOS and Windows
  - Audio Units, VST, VST3 and AAX format
  - No copy protection
