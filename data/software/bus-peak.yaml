description: >
  Bus PEAK is a limiter effect that combines Tone Control, Clipper and Limiter features alongside comprehensive metering - add the final polishes to your mix and ensure optimal loudness while preserving detail.
details: |-
  Bus peak is a pro-grade limiter effect that combines tone control, clipper, and limiter features alongside comprehensive metering to add final polish to mixes and ensure optimal loudness while preserving detail. It blends precision peak control with advanced metering, making it an essential mastering tool for audio engineers and producers. Whether taming erratic sonic crests or preserving natural dynamics, bus peak achieves a big, loud, and full sound while maintaining control of transients.

  The clipper module shapes audio dynamics by clipping peaks to free up headroom and enhance overall loudness, increasing the presence and impact of vocals, instruments, drums, and complete mixes. The limiter module controls peaks to keep output levels within set parameters while maintaining transparency and can create additional headroom for safely increasing overall loudness without distortion. The tone control module features two dynamic shelving limiters for bass and treble, dynamically shaping frequency response while keeping levels under control to add density to the low-end and sharpness to the top-end.

  The input section includes a gain slider controlling incoming signal amplitude and an input gain lock to maintain consistent levels when comparing presets, with link buttons connecting input gain to clipper and tone control thresholds. The master section measures peak and loudness levels, displays gain reduction applied, and allows listening exclusively to combined module changes with customizable lufs targets and metering types. The true peak feature links to either the limiter threshold or clipper and guarantees perfectly accurate results.

  Bus peak includes 34 expertly designed presets covering practical templates for mixing and mastering along with creative uses, with genre-specific presets for idm reshaping, edm modern loudness, and spotify optimization. The delta listen feature allows hearing only the changes made to the signal, helping fine-tune controls to get exact results. The plugin works with all major daws on both windows and macos, features resizable gui options, supports MIDI controller mapping for real-time control, and includes built-in tutorials guiding users through crucial parameters and mixing techniques.

  The plugin offers 4 engine quality modes designed for different use cases, balancing algorithm precision against cpu consumption and latency for tracking, mixing, mastering, and render scenarios. An equal loudness setting dynamically levels output to match input for easier comparison, and a large signal visualizer displays gain reduction graphs. Bus peak can be applied versatilely to entire mixes for polished professional sound or to individual instrument tracks like vocals or lead guitar to add warmth, sizzle, or prominence without getting lost in the mix.
