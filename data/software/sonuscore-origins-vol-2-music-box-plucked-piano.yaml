description: The rhythmically interacting and enriching interplay of the music box and the plucked piano offer the best possible basis to create eerie, anticipation building or dreamy moods on the fly.
details: |-
  The Origins series returns with the incomparable MUSIC BOX together with the sinister PLUCKED PIANO. The Music Box is often considered a toy but offers a distinct sonic experience composers use for impactful effect, from a sunlit flashback to something far more sinister. The Plucked Piano is its companion for thrilling, mysterious and arcane soundscapes: because the strings are plucked rather than struck by a felt-covered hammer, the resulting sound is harsher and more rugged.

  The instruments can be played individually or together through the Multi-Arpeggio-Designer (MAD), the centerpiece of every Origins instrument. Two fully customizable arpeggiators create interlocking patterns and broad soundscapes by combining the unique timbres of the two instruments, with an engine designed to convey a musically meaningful, human performance instead of a computer randomly aligning notes.

  Over 100 presets designed by experienced composers are included, so a few chords are enough to set a scene, while every parameter remains open to adjustment. Arpeggio designs can be copied and pasted between different ORIGINS instruments, and the Colors menu adds 12 individual color presets, each radically different in character and incorporating various effect settings and multiple impulse responses, for over 1200 predefined combinations.
specs: |-
  - Two individually playable instruments: Music Box and Plucked Piano
  - Innovative Multi-Arpeggio-Designer (MAD) with two fully customizable arpeggiators
  - 100+ rhythm presets
  - 12 unique color settings, over 1200 predefined MAD/color combinations
  - Arpeggio designs can be copied between different ORIGINS instruments
  - Full customization of all controls
  - Requires the FULL version of Native Instruments KONTAKT 5.5.2.880 or higher (the free Kontakt Player runs the instrument in demo mode only)
  - Mac OS X 10.8 or higher, Intel Core 2 Duo
  - Windows 7 or higher, Intel Core 2 Duo or AMD Athlon 64 X2
  - 4 GB RAM
  - At least 270 MB of free hard disc space
  - Delivered as download
