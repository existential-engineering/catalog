details: >-
  Acoustic dhol vps avenger is a preset bank containing 60 dhol beats with
  oneshot presets, exclusively made for vengeance avenger. It has been created
  using real indian dhol (drum) instruments. All presets have been designed by
  our sound designers and professional music producers.


  Ready to make indian, punjabi, bollywood & south indian style drum beats.
  Presets can be changed easily as per user's choice.


  Installation: extract the folder. Launch vengeance avenger vps avenger. Go to
  sys tab > content > import content. Install acoustic dhol.avengercontent from
  acoustic dhol vengeance avenger expansion rdgaudio folder. Now you should get
  new icon of acoustic dhol expansion in vps avenger presets browser, containing
  60 dhol drum presets with oneshot samples.
