description: Process and enhance vocal recordings with LANDR VoxChain. Fine-tune
  EQ, compression, and saturation with a professional, studio-quality vocal
  signal chain.
details: |-
  VoxChain is an all-in-one vocal channel strip plugin from LANDR that shapes a vocal sound from start to finish in one streamlined interface. It gives essential tools like EQ, compression, and saturation, all optimized for voice, so performances can be polished quickly while the focus stays on the mix.

  The plugin is positioned as a complete vocal polishing channel strip: EQ, compression, saturation, and intuitive controls are fine-tuned for vocals, so studio polish can be reached fast whether tracking demos or finishing a mix.

  Its tailored vocal EQ is designed to soften harshness, enhance clarity, and boost warmth, while one-knob compression provides instant dynamic control without deep parameter editing. Analog-style saturation adds color, depth, and harmonic richness.

  A dry/wet blend is available per module, so processed and dry signals can be balanced with precision to keep vocals expressive, polished, and natural.

  VoxChain is sold individually and is also included with the LANDR Studio subscription, which bundles plugins, samples, mastering, and distribution.
specs: |-
  - All-in-one vocal channel strip: EQ, compression, and saturation
  - Tailored vocal EQ: soften harshness, enhance clarity, boost warmth
  - One-knob compression for instant dynamic control
  - Analog-style saturation for color, depth, and harmonic richness
  - Dry / Wet blend per module
  - macOS: macOS X 11 or higher
  - macOS: Apple Silicon Native or Intel
  - macOS formats: VST3, AU, AAX
  - Windows: Windows 10 (64-bit) or higher
  - Windows formats: VST3, AAX
