description: An all-in-one vocal channel strip plugin that combines EQ, compression, and saturation—all optimized for voice—to help producers polish vocal performances efficiently.
details: |-
  All-in-one vocal channel strip combining tailored vocal EQ, one-knob compression, and analog-style saturation in a single plugin. Each module features an independent dry/wet blend control for precise effect balance. Soften harshness, enhance clarity, boost warmth. Apple Silicon native and Intel compatible.
specs: |-
  - Formats on macOS: VST3, AU, AAX (Apple Silicon Native, Intel)
  - Formats on Windows: VST3, AAX
  - macOS 11 or higher
  - Windows 10 (64-bit) or higher
  - Tailored Vocal EQ: soften harshness, enhance clarity, boost warmth
  - One-Knob Compression for instant dynamic control
  - Analog-Style Saturation for harmonic richness and color
  - Dry/Wet blend control per module
