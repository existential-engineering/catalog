details: |-
  The aq560 based on classic american EQ from the late '60s, the 10-band graphic
  equalizer features precision filtering and high headroom, ideal for signal
  enhancement.

  The curve shaping potential is unmatched, while unique proportional q design
  intuitively widens the filter bandwidth at lower boost/cut levels and narrows
  it at higher settings.

  The aq560 extends the features of the original hardware and joins the
  flexibility of the digital world to the character of the analog processing.

  Allows you to choose between equalizer modes (stereo, mid, side) and remove
  analogue saturation from the processing circuit to deliver pure digital sound.

  The aq560 is handy when you need to make eq adjustments on larger parts of the
  spectrum instead of a restricted area. Boosting or cutting several bands at
  once will radically alter the sound of a track, be it a thin, weak snare that
  needs low end or a dull vocal that needs to be opened up.
specs: |-
  - 10-band graphic equalizer
  - Precision filtering
  - High headroom
  - Proportional q design
  - 12 dB of boost/cut per band
  - Stereo/mono/mid/side EQ modes
  - In/out bypass switch
  - Analog harmonic distortion modes
  - Universal 2 binary
