description: LCAST is a loudness meter plugin for broadcast audio measurement, supporting major loudness standards including ATSC A/85, EBU R128, and ITU BS.1770, as well as online music service loudness targets for platforms like iTunes Radio and Spotify.
details: |-
  LCAST is a professional loudness meter plugin designed for broadcast and online distribution. It supports all major loudness measurement standards including ATSC A/85 (the CALM Act), EBU R128, and ITU BS.1770, making it suitable for content destined for television, streaming, and online platforms.

  The plugin provides integrated, short-term, and momentary loudness measurements alongside loudness range and variance calculations. True-peak metering with inter-sample peak detection ensures compliance with modern broadcast and streaming requirements.

  LCAST features a loudness history display capable of showing up to 24 hours of data, allowing engineers to review long-form content. The plugin supports mono, stereo, and 5.1 surround formats, with the Surround version adding CSV data export functionality.

  Targeting tools for iTunes Radio and Spotify normalization are built in, helping producers and mastering engineers optimize their releases for streaming platforms. The plugin supports faster-than-real-time offline analysis, speeding up loudness compliance workflows.

  LCAST is compatible with a wide range of DAWs including Logic, Final Cut Pro X, Soundtrack Pro, Cubase, Nuendo, Reaper, and Pro Tools. It is available in two variants: LCAST Stereo and LCAST Surround.
specs: |-
  - Supported standards: ATSC A/85 (CALM Act), EBU R128, ITU BS.1770
  - Loudness measurements: integrated, short-term, momentary
  - Loudness range and variance calculations
  - True-peak metering with inter-sample peak detection
  - Loudness history display up to 24 hours
  - iTunes Radio and Spotify normalization targeting
  - Mono, stereo, and 5.1 surround format support
  - CSV data export (Surround version only)
  - Faster than real-time offline analysis
  - macOS: 10.7 or later, 64-bit Intel or Apple Silicon
  - Windows: XP SP3 or later, 32/64-bit
