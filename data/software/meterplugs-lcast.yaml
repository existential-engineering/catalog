description: "Broadcast loudness meter plugin supporting ATSC A/85 (CALM Act),
  EBU R128, and ITU BS.1770 standards. Provides integrated, short-term, and
  momentary loudness measurements with true-peak metering, loudness range and
  variance calculations, and up to 24 hours of loudness history recording."
details: |-
  1.4.6

  ATSC A/85 (CALM Act) loudness standard support
  EBU R128 and ITU BS.1770 standards
  Integrated, short-term, and momentary loudness measurements
  Loudness range and variance calculations
  True-peak metering via quadrupled signal frequency
  Overload indicators and loudness gating
  Custom color regions for visual organization
  Loudness history display supporting up to 24 hours
  Data export to CSV format (Surround version only)
  Mono, stereo, and 5.1 surround support (surround edition)
specs: |-
  - mac: macOS 10.7 or later (64-bit Intel or Apple Silicon)
  - windows: Windows XP SP3 or later (32/64-bit)
  - Stereo
  - Surround (5.1)
