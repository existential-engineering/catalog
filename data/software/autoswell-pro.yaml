details: |-
  The plugin features parameterform control which allows you to play with
  different shapes of swell attack or adjust swell shape for overdriven or
  compressed guitar sound, with animation of the swelling process displayed on
  the right top panel of the plugin.

  Side chain detection allows you to control the plugin by side signal or place
  the plugin after another effect such as overdrive by routing the track with
  control signal to the track with the plugin to channels 3/4, with signal
  monitoring available for live playing.

  MIDI controlled swell is enabled by default and allows you to control the
  swell process by piano, swell the signal between two notes where detection
  doesn't work, or swell only selected notes by placing MIDI notes at needed
  time in the 16th channel, with the ability to cancel standard note detection
  using the MIDI.

  Control parameters include time (sets constant time of swell attack),
  sensitivity (defines response to input signal), depth (defines amount of mix
  of processed signal with initial input from 0 clean input to 1 fully
  processed), volume (sets overall volume), and form (changes swell shape from
  convex to concave).
specs: |-
  - Swell attack shape control
  - Side chain detection
  - MIDI controlled swell
  - Signal monitoring
  - Note detection by input signal
  - Note detection by side chain signal
  - Time parameter
  - Sensitivity parameter
  - Depth parameter
  - Volume parameter
  - Form parameter
  - Swell shape adjustment
  - 16th channel MIDI control
