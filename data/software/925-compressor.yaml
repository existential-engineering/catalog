details: |-
  925 Compressor mkii is the second generation of the main-mix compressor designed using physical modelling principles. Its characteristic dynamic response stems from the sidechain detection stage, which is based on the basic analog envelope detector circuit.

  The high speed of this compressor's detector allows it to follow the actual waveform instead of the envelope of the program material and -along with the logarithmic gain reduction- produce more natural compression. This is often the case in hardware vintage and modern equipment, and has resulted in the 925s' broad range of compression characteristics.

  925 features variable knee response, allowing more compression to be applied, especially on high-transient sounds like percussion, samples, vocals etc. The slope / ratio mode selection significantly changes 925's compression curve, resulting in completely different character and dynamic response.

  The specially developed 'damping' control allows for smoothing and fine-tuning the detector's response, adding to the versatility of this tool and providing the user with greater control and shaping of the signal's envelope.

  A host of new features has been included in mkii, including sidechain filtering, band compression and dry/wet control. 29 carefully tuned presets provide a solid starting point for a variety of use cases.
