description: >-
  Maschine is a groove production studio by Native Instruments combining
  software and optional hardware controller for beat making, sampling,
  arranging, mixing, and live performance. It includes a comprehensive
  library of sounds, instruments, and effects.
details: |-
  Maschine bridges the gap between hardware and software music production.
  The software provides a complete production environment with pattern-based
  sequencing, sampling, audio recording, arrangement, and mixing — all
  designed to work seamlessly with Maschine hardware controllers.

  The beat-making workflow centers on 16 pad groups, each containing up to
  16 sounds with independent insert effects. The step sequencer and real-time
  recording modes support both programmed and performed rhythms, with swing,
  note repeat, and humanize functions.

  A comprehensive sound library ships with Maschine, including drum kits,
  instruments, one-shots, loops, and patterns spanning genres from hip hop
  and electronic to cinematic and acoustic. The Expansion ecosystem provides
  genre-specific content packs.

  The built-in mixer supports per-sound and per-group insert effects,
  sends, and a master section. Native Instruments effects are included
  alongside the ability to host VST/AU plugins on each channel.

  Maschine also functions as a plugin inside other DAWs, enabling its
  pattern-based workflow within a larger production session. Audio and
  MIDI can be routed between Maschine and the host.
specs: |-
  - Pattern-based groovebox workflow
  - 16 groups x 16 sounds per project
  - Step sequencer and real-time recording
  - Audio sampling and recording
  - Time-stretching and pitch-shifting
  - Song arrangement mode
  - Built-in mixer with per-channel effects
  - VST/AU plugin hosting within Maschine
  - Operates standalone or as DAW plugin (VST3, AU, AAX)
  - Comprehensive factory sound library
  - Expansion-based content ecosystem
  - Maschine hardware integration
  - Audio and MIDI routing to host DAW
