details: |-
  The mark one features a fender rhodes mk I 73 electric piano played through a
  vintage tube combo and captured by rare vintage microphones is a truly unique
  instrument.

  The tone is designed to go from a smooth enthralling caress to a tight and
  crunchy sound for a dense arrangement.

  The included exploremaps allows the user choose from classic rhodes sounds to
  spacious textures and fat bass sounds.

  The mark one is intended to fit both on stage and in the studio.

  The full addictive keys engine is included.
