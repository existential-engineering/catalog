description: Create and customize your own Live devices with Max
details: |-
  Max for Live gives you a blank slate to patch together your own musical tools that work seamlessly inside the Live environment.

  Create your own Instrument, Midi Effect, or Audio Effect that does exactly what you want, or customize an existing device with your own adjustments. Max for Live also provides the ability to control your Live Set using the Live API.

  Max includes a suite of interactive UI elements built to look, feel, and behave exactly like a built-in Live Device. Within Live, these objects can be mapped, automated, and modulated like any native controls.
specs: |-
  - Patch your own musical tools that work inside the Live environment
  - Create your own Instrument, Midi Effect, or Audio Effect devices
  - Customize an existing device with your own adjustments
  - Control your Live Set using the Live API
  - Suite of interactive UI elements built to look, feel, and behave exactly like a built-in Live Device
  - Max UI objects can be mapped, automated, and modulated like any native Live controls
  - Max for Live Packs built by the community are available at Ableton.com
  - Building Max Devices learning pack includes 90 Max Devices and 40+ Live Sets
  - Max system requirements (macOS Intel): OS 11.0 or later, Intel Core 2 Duo processor (Core i5 or faster recommended), 4 GB RAM (8 GB or more recommended), approximately 3 GB disk space
  - Max system requirements (macOS Apple Silicon): OS 11.0 or later, Apple Silicon processor, 4 GB RAM (8 GB or more recommended), approximately 3 GB disk space
  - Max system requirements (Windows): Windows 10 (version 22H2) or Windows 11 (version 22H2 or higher), 64-bit Intel or AMD multi-core processor (Core i5 or faster recommended), 4 GB RAM (8 GB or more recommended), approximately 2 GB disk space
