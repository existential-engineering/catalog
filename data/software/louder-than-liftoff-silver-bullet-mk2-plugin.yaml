description: "Faithful digital recreation of the flagship Silver Bullet mk2
  hardware unit, with component-level DSP modeling of all analog circuits,
  cascading Mojo Amps inspired by classic American and British consoles, tone
  shaping EQ suite, and patent-pending Dyna Realism technology for analog
  realism in the digital domain."
details: |-
  Component-level DSP model of all Silver Bullet mk2 analog circuits. Cascading 'A' and 'N' MOJO Amps inspired by classic American and British consoles from the 70s. MOJO C expansion slot with digital Colour modules including Hitmaker 4000, Hitmaker Comp, and exclusive modules from Unfiltered Audio. PRE EQ and POST TIGHT workflow modes. Signature 20-segment stereo high-resolution output meter with RMS and peak indication. Mojo LEDs provide visual feedback of signal level intensity. Tone shaping EQ suite: Tight 12 dB/oct high pass filter, Baxandall Tone EQ with AIR (+/-9 dB boost/cut), Vintage mode. ASPECT RATIO stereo imaging circuit. Patent-pending DYNA REALISM generates a spectrum of analog realism via static and dynamic variations. Unique Serial Number per user. CIRCUIT BEND modes for broken and distorted textures. HEADROOM control for internal operating levels. OUTPUT TRIM control with +/-10 dB of analog modeled gain. Artist presets included. Internal automatic oversampling.
specs: |-
  Version 1.1.0 (May 23, 2025). 3 new Mojo modes based on analog model of Hitmaker Comp Mojo Module. Analog Noise settings (off, low, on). ABCD Comparison with copy and paste. Distributed via Plugin Alliance. Mac installer: 427.1 MB. Windows 64-bit installer: 173.9 MB.
