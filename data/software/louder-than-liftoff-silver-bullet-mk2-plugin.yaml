description: A digital recreation of the flagship Silver Bullet mk2 hardware unit with component-level DSP modeling. Features cascading Mojo Amps, tone shaping EQ, and ASPECT RATIO stereo imaging enhancement.
details: |-
  Component-level analog circuit modeling with three cascading Mojo Amps inspired by 70s American and British consoles. Includes Baxandall tone EQ with AIR circuit, TIGHT high-pass filter (25Hz/50Hz options), VINTAGE mode for high-frequency smoothing, ASPECT RATIO stereo enhancement, patent-pending Dyna Realism™ technology, CIRCUIT BEND modes for creative distortion, C MOJO expansion slot with color modules, 20-segment stereo output meter, and a serial number system unique per license. Licensing and support managed by Plugin Alliance.
