description: A digital recreation of the flagship Silver Bullet mk2 hardware unit with component-level DSP modeling. Features cascading Mojo Amps, tone shaping EQ, and ASPECT RATIO stereo imaging enhancement.
details: |-
  Component-level analog circuit modeling with three cascading Mojo Amps inspired by 70s American and British consoles. Includes Baxandall tone EQ with AIR circuit, TIGHT high-pass filter (25Hz/50Hz options), VINTAGE mode for high-frequency smoothing, ASPECT RATIO stereo enhancement, patent-pending Dyna Realism™ technology, CIRCUIT BEND modes for creative distortion, C MOJO expansion slot with color modules, 20-segment stereo output meter, and a serial number system unique per license. Licensing and support managed by Plugin Alliance.
specs: |-
  - Component level DSP model of all Silver Bullet mk2 analog circuits
  - Cascading 'A' and 'N' MOJO Amps inspired by classic American and British consoles from the 70's
  - MOJO C expansion slot with digital Colour modules including Hitmaker 4000, Hitmaker Comp, and exclusive modules from Unfiltered Audio
  - PRE EQ and POST TIGHT workflow modes to insert signal into the Silver Bullet mk2 signal path
  - Signature 20-segment stereo high-resolution output meter with RMS and peak indication
  - Mojo LEDs provide visual feedback of signal level intensity
  - Tone shaping EQ suite designed specifically for mix sweetening and broad stroke tone sculpting of individual tracks
  - Tight: 12 db/oct high pass filter with two frequency options for mixing and tracking
  - Baxandall Tone EQ with AIR, +/-9 dB boost/cut
  - Vintage: softens high-frequency response to emulate vintage British consoles
  - ASPECT RATIO stereo imaging circuit to enhance width, height, and clarity of mix
  - Patent-pending DYNA REALISM generates a spectrum of analog realism via static and dynamic variations throughout the digital model
  - Unique Serial Number of the digital model is created for each user
  - CIRCUIT BEND modes for "mis-wired" broken and distorted textures
  - HEADROOM control to adjust internal operating levels
  - OUTPUT TRIM control with +/-10 dB of analog modeled gain
  - Artist presets from William Pearson (drBill), Deegan Mack Adams, Benny Grotto (Mad Oak Studios), Dereck Blackburn (Quiethouse), Darren Rahn
  - Internal automatic oversampling
  - 3 new Mojo modes based off of an analog model of the Hitmaker Comp Mojo Module
  - Analog Noise settings in options menu (off, low, on). On was the original setting
  - ABCD Comparison UX enhancements such as copy and paste
  - DC offset bug fixed through additional filter
  - "Intro Thump" bug fixed by instantly setting parameters/dsp at start of offline rendering
