description: "Professional edition of Synthesizer V Studio, an AI-powered
  singing voice synthesizer with unlimited tracks, customizable AI pitch
  generation, cross-lingual synthesis, and DAW integration via VST3 and
  AudioUnit."
details: |-
  Pro Edition features include: unlimited tracks per project, customizable AI pitch generation, no CPU core limits for rendering, VST3/AU plugin integration, ASIO support (Windows), Jack support (Linux), cross-lingual synthesis, AI retakes, isolated aspiration output, vocal modes, tone shift parameter, microtonal adjustment, MIDI keyboard support and metronome, Lua/Javascript scripting. Supports singing synthesis in English, Japanese, Chinese, Cantonese, Korean, and Spanish. Runs 100% offline. Runs natively on Apple Silicon.
specs: |-
  Operating Systems: Windows, macOS, Linux. Plugin Formats: VST3, AudioUnit. ASIO support on Windows. Jack support on Linux. Runs natively on Apple Silicon.
