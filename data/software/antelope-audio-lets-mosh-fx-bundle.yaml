details: |-
  The Let's Mosh Bundle is a comprehensive set of metal production tools that lets you beef up drums, treat loud vocals and spice up heavy guitars. The bundle gathers Antelope's analog-modeled EQs, FET compression, a noise gate, a tube mic preamp, and modulation effects tailored for heavy production workflows.

  VEQ-55A (3-Band EQ / HPF / LPF) - analog-modeled effect based on a legendary 1960s console known for its unique coloration on acoustic instruments

  VP Drum-All-Nite - Valley People dyna-mite-inspired dynamics processor capable of absurd gain reduction while maintaining signal integrity with minimal distortion

  VEQ-4K BLACK (4-Band EQ / HPF / LPF) - popular revision of the EQ module designed following recommendations from top engineers; preferred choice for vocal and acoustic instruments

  VEQ-HA32C (4-Band EQ / HPF / LPF) - inspired by a richly characteristic four-band channel EQ module, versatile for vocals, bass, electric guitars, and drums

  FET-A78 (FET Compressor / Stereo Peak Limiter) - punchy classic-style compression suited to both individual instruments and full mixes

  X904 - noise gate and dynamic processor for tight, responsive control over signal flow and transients

  RD47 (Tube Mic Preamp) - authentic recreation of one of Abbey Road Studios' most iconic valve line amps that defined the sound of the 1960s

  Filtek MK3 (3-Band EQ / HPF / LPF) - 70s-era versatile equalizer with clear, precise sound and combinations of controls and switches for experimentation

  NEU-W492 (4-Band EQ) - based on the original circuitry, carries the signature German sound; a favorite mastering tool of generations of record producers and engineers

  VEQ-STU 900 (4-Band EQ / HPF / LPF) - modeled after a channel strip from one of the best-sounding analog mixing desks for shaping sound in extreme ways without deformation

  Vari-Speed Tremolo (Tremolo) - versatile vintage tremolo with a five-position Wave selector (sine, triangle, square, sawtooth, inverted sawtooth)

  BBD-Chorus (Bucket Brigade Chorus) - thick organic modulation and gooey pitch-shifting vibrato

  Runs natively in your DAW on macOS or Windows, or in real-time on your Synergy Core interface.
specs: |-
  - Twelve effect plugins focused on metal production
  - Runs natively in DAW (macOS/Windows) or in real-time on Synergy Core interface
  - Includes analog-modeled EQs (VEQ-55A, VEQ-4K BLACK, VEQ-HA32C, Filtek MK3, NEU-W492, VEQ-STU 900)
  - Includes dynamics processing (VP Drum-All-Nite, FET-A78, X904)
  - Includes tube mic preamp emulation (RD47) and modulation effects (Vari-Speed Tremolo, BBD-Chorus)
  - Unlock all 75+ Antelope native plugins by joining Antelope Cosmos
