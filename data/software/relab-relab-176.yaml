description: Hardware-accurate tube compression in software form, modeled from a vintage 1960s 176-style compressor using real-time circuit solving to recreate every tube, transformer, and timing network.
details: |-
  The Relab 176 is a software compressor/limiter plugin modeled after a vintage 1960s 176-style hardware unit. It uses real-time circuit solving to faithfully recreate the behavior of every tube, transformer, and timing network found in the original hardware.

  The plugin offers four hardware ratios — 2:1, 4:1, 8:1, and 12:1 — along with program-dependent timing behavior derived from the RC-tube interaction of the original circuit. This results in a dynamic, musical response that changes with the incoming signal.

  Relab 176 includes polarity-selective sidechain detection and switchable stage coupling paths (transformer and resistor), giving engineers control over the tonal character and how the compressor responds to transients.

  Advanced calibration controls for bias and harmonics allow users to fine-tune the harmonic content and saturation character of the plugin, extending beyond what was adjustable on the original hardware. Factory presets are included to help users get started quickly.

  Authorization uses iLok account-based licensing; a hardware iLok dongle is supported but not required. The plugin ships with factory presets, community access, tutorials, and customer support.
specs: |-
  - Formats: AU, VST3, AAX (64-bit only)
  - Mac: macOS 10.15 (Catalina) or higher, Apple Silicon M1 or newer required
  - Windows: Windows 10 and up, Intel Core i7 8th-gen+ or AMD Ryzen 5 3000-series+
  - RAM: 8 GB minimum, 16 GB+ recommended
  - Supported DAWs: Pro Tools 2020.11+, Cubase 9.5+, Nuendo 8+, Ableton Live 10+, Reaper 7+
  - Four hardware ratios: 2:1, 4:1, 8:1, 12:1
  - Program-dependent timing from RC-tube interaction
  - Polarity-selective sidechain detection
  - Switchable stage coupling (transformer/resistor paths)
  - Advanced calibration controls for bias and harmonics
  - iLok account required (hardware dongle optional)
  - 30-day money-back guarantee
