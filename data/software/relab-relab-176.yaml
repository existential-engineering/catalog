description: "Accurately modeled from the entire audio circuit of a vintage 1960s 176-style compressor: every tube, transformer, timing network, and power supply interaction is re-created using a real time circuit solver. This preserves the tone, timing, and dynamic behavior of the original hardware."
details: |-
  The Relab 176 reproduces everything: the tone, timing, and dynamic behavior of the hardware. Every tube stage, transformer, and timing network responds as it does in the original.

  The Relab 176 follows the original fixed-threshold design with four hardware ratios: 2:1, 4:1, 8:1, and 12:1. Knee position and slope change with each ratio, producing compression that ranges from smooth leveling to assertive limiting. Compression intensity adapts naturally, ensuring nuanced dynamic shaping at every setting.

  Attack and release times come from resistor-capacitor networks directly coupled to the tube gain stage. Timing is program-dependent, shaped by signal level, transient size, tube nonlinearity, and transformer interaction, not fixed millisecond values. The Fixed/Auto toggle changes how release adapts to the program.

  The Sidechain Polarity control in the Relab 176 changes how the detector responds to the positive, negative, or both halves of the waveform. This lets you target specific transient edges, for example, clamping kick drum attack without touching low-end body, or controlling plosives in vocals without affecting overall presence.

  Calibration shifts the internal tube bias and balance, just like adjusting multiple trim pots on the original hardware, changing threshold, harmonic profile, and dynamic feel. It is a single control that moves multiple internal parameters together, with extra flexibility available via the plugin's back-panel trims.
specs: |-
  - Four hardware ratios: 2:1, 4:1, 8:1 and 12:1, with knee position and slope changing per ratio
  - Fixed-threshold, variable-gain design where ratio, drive and source material interact to shape timing, curve and harmonics
  - Program-dependent attack and release from resistor-capacitor networks coupled to the tube gain stage, with a Fixed/Auto release toggle
  - Sidechain Polarity control: detector responds to the positive, negative or both halves of the waveform
  - Stage Coupling switch: Transformer path for faster (sub-ms possible) attack, Resistor path for slower attack and vintage low-frequency thump
  - Calibration control shifting 6BC8 and 12AX7 tube bias and balance, threshold, dynamic response and tone together
  - Advanced back-panel controls (click the Relab logo): trim pots for 6BC8 bias, 6BC8 anode balance and 12AX7 bias, plus a Reference Level control
  - Hand-crafted factory presets
  - 64-bit only; macOS 10.15 (Catalina) or higher on Apple Silicon M1 or newer; Windows 10 and up on Intel Core i7 (8th-gen+) or AMD Ryzen 5 (3000-series+) with AVX2
  - 8 GB RAM minimum, 16 GB+ recommended
  - iLok account authorization, no hardware dongle required (local computer authorization or iLok USB key V2 or above)
