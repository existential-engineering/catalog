description: "A hardware-accurate tube compressor/limiter plugin modeled from a
  vintage 1960s 176-style compressor using real-time circuit solving technology.
  Features ratio-driven knee behavior with four hardware ratios,
  program-dependent timing shaped by RC-tube interaction, polarity-selective
  detection, switchable transformer/resistor stage coupling, and advanced
  calibration controls."
details: |-
  1.1

  Hardware-accurate circuit modeling of every tube stage and transformer
  Four hardware ratios (2:1, 4:1, 8:1, 12:1) with adaptive knee
  Program-dependent timing via RC-tube interaction
  Polarity-selective sidechain detection
  Switchable transformer/resistor stage coupling
  Calibration controls for tube bias and balance
  Back-panel trim pots for bias and reference level
  Hand-crafted factory presets

  PACE iLok account required (dongle optional)
