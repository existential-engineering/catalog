id: jdnt1lPOmGGalPfgFZTgw
name: BeatVox
manufacturer: knobster
primaryCategory: synthesizer
categories:
  - drum-machine
description: BeatVox is a rompler that replicates percussion sounds performed by
  the human voice. The set contains several different percussion sounds.
details: |-
  The set contains several different percussion sounds, as well as two 'voice'
  chromatic sets: phonemes 'too' and 'poo'.

  Percussion sounds conform to standard general MIDI and are in the range of
  keys from a2 to c#4. Chromatic timbres have a working range of g2 to g4.

  Main features: 44 khz / 16-bit sample format. One percussion and two
  chromatic. Drive control. Low cpu usage.
specs: |-
  - Rompler
  - 44 kHz / 16-bit sample format
  - General MIDI
  - Percussion sounds range a2 to c#4
  - Chromatic timbres range g2 to g4
  - Drive control
  - Low CPU usage
  - Phonemes 'too' and 'poo' chromatic sets
