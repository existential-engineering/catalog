description: Six legendary hardware transformer models in one plugin. Add analog warmth, heft, and depth used by Dave Pensado, Ross Hogarth, and more. Try it free.
details: |-
  True Iron packs six definitive line transformers from some of audio's most legendary hardware units into one plugin: the UTC 108 X, Malotki E4M - 4001B, Western Electric 111C, Haufe V178, Marinair LO1166/A and the UTC O-12. Kazrog models them from Devin Powers' own collection, and the page pitches the plugin as adding analog warmth, heft and vibe that gels mixes organically and enhances depth and stereo width.

  The page characterises each transformer in turn. The 108X is warm, thick and harmonically rich, the American classic found in countless UA and UREI units. The 4001B is the German mastering standard, spanning 10 Hz to nearly 100 kHz with huge dynamics. The V178 is full and euphoric with a midrange push, Haufe iron being known for its use in Neumann microphones. The 111C has enormous headroom that loves to be driven and stays thick and balanced, a mastering favorite. The 1166 is lush and mid-focused, the transformer from the original Neve 1073 and 1272 preamps. The O-12 is small, aggressive and full of attitude, the input transformer from "Blue Stripe" 1176 compressors.

  Natural transformer saturation ranges from subtle to crushed, smoothing out digital harshness. The Crush knob boosts input for richer analog saturation and can be pushed well past subtlety for creative use, while the Strength knob and mix control fine-tune the processing amount and parallel blend.

  Oversampling is adjustable up to 32x both online and offline. The window is resizable and an alternate GUI theme is offered, black or green. Kazrog claims one of the most CPU-friendly plugins on the market, so many instances can run in high track count sessions.

  The plugin ships as a 64-bit VST, AU and AAX for Mac and Windows (Pro Tools 12 or higher required for AAX), and as VST3, VST2 or LV2 on Linux, all Universal Binary 2 on macOS. It carries a 100% perpetual license for multiple devices with no iLok and no subscription fees. In 2020, True Iron was nominated for the 35th annual NAMM TEC Awards, and the page carries endorsements from Ross Hogarth, Dave Pensado, Ken Lewis, F. Reid Shippen, Mark Linett and Pete Lyman.
specs: |-
  - Six line transformer models: UTC 108 X, Malotki E4M - 4001B, Western Electric 111C, Haufe V178, Marinair LO1166/A, UTC O-12
  - Modeled from Devin Powers' transformer collection
  - Crush knob boosts input for additional analog saturation
  - Strength knob and mix control for parallel blend
  - Adjustable oversampling up to 32x, online and offline
  - Resizable window with alternate GUI theme (black or green)
  - Nominated for the 35th annual NAMM TEC Awards in 2020
  - Universal Binary 2 (native Apple Silicon and Intel)
  - Mac: macOS 10.13.x or higher
  - Windows: Windows 10 or higher strongly recommended
  - Linux: VST3, VST2 or LV2 compatible host (tested on Ubuntu, Linux Mint, Debian, Manjaro)
  - Apple M1 or Intel i5 "Ivy Bridge" CPU or newer strongly recommended
  - Pro Tools 12 or higher required for the AAX version
  - 100% perpetual license for multiple devices, no iLok authorization required
