details: |-
  True Iron packs 6 definitive line transformers from some of audio's most legendary hardware units — the UTC 108 X, Malotki E4M–4001B, Western Electric 111C, Haufe V178, Marinair LO1166/A, and the UTC O-12.

  The plugin adds analog warmth, heft, and vibe from some of audio's most sought-after hardware transformers, gelling mixes organically and enhancing depth and stereo width. Natural transformer saturation ranges from subtle to fully crushed, making almost any track or bus sound better with minimal effort.

  The Crush knob boosts input for richer analog saturation, while the Strength knob and mix control provide parallel blending. Oversampling is adjustable up to 32x both online and offline for pristine high-quality processing.

  True Iron is designed for ultra-low CPU impact, enabling multiple instances across high track-count sessions. The GUI is resizable with black and green theme options. In 2020, True Iron was nominated for the 35th Annual NAMM TEC Awards.
