details: |-
  The bt equalizer peq2b recreates the sound of the classic 60s EQ. The
  interaction of the passive boosting and attenuating shelving eqs has been
  designed to bring back the life and musicality lost in the recording.

  The incredibly musical character of the bt equalizer peq2b is the perfect
  choice when a truly vintage eq sound is what your music requires.

  The peq2b is the equalizer of choice for final musical touches.

  Blue tubes equalizer peq2b by nomad factory is a virtual effect audio plugin
  for macos and windows. It functions as a VST plugin, an audio units plugin and
  an AAX plugin.

  System requirements: pentium iv 2ghz / athlon xp 2ghz with 1gb of ram for
  windows (7, xp, vista supported in 32-bit and 64-bit); macintosh intel core
  solo 1.5ghz with 1gb of ram for mac os x 10.5 leopard and mac os x 10.6 snow
  leopard (compatible intel macs, ppc are not supported).
