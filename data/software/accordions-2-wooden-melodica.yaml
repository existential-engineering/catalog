details: >-
  Produced by eduardo tarilonte, accordions 2 is considered the first choice if
  you are looking for a realistic and, above all, playable accordion library.
  Numerous renowned composers and producers rave about the authenticity and
  expressiveness of this virtual instrument.


  With single wooden melodica you get a virtual, hand crafted melodica from
  eduardo tarilonte's accordions 2 as a single instrument including 3 registers.


  Hand crafted melodica, including 3 registers, 3 kinds of bellow shake, 3
  different dynamics and 3 round robins. Key and button noises for
  ultra-realistic performances. Recorded chromatically with the pristine sound
  of a u47 microphone.


  Exclusively compatible with best service engine 2. This single instrument was
  exclusively designed for best service engine 2 and is therefore not compatible
  with the kontakt player.


  Accordions 2 - wooden melodica by best service is a virtual instrument audio
  plugin and a software application and soundware for macos and windows. It
  includes, and is therefore powered by, engine player, which functions as an
  audio units plugin, a VST 3 plugin, an AAX plugin and a standalone
  application.
