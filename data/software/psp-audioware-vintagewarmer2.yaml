description: PSP VintageWarmer is a high-quality digital simulation of an analog-style single or multi-band compressor/limiter. It combines rich, warm analog processing with a straightforward user interface, and comes with a comprehensive library of presets.
details: |-
  PSP VintageWarmer2 is a high-quality digital simulation of an analog-style single or multi-band compressor/limiter. It combines rich, warm analog processing with a straightforward user interface, and comes with a comprehensive library of presets.

  PSP VintageWarmer2 is highly flexible and can be used for both soft-knee compression and brick-wall limiting. This makes it an essential tool for mixing and mastering engineers.

  Careful attention has been paid to PSP VintageWarmer's overload characteristics with the algorithm being capable of generating saturation effects typical of analog tape recorders. PSP VintageWarmer also incorporates professional VU and PPM metering together with accurate overload indicators thereby ensuring professional quality results.

  The PSP VintageWarmer2 installer contains 3 versions of the plug-in. PSP MicroWarmer provides the same sound quality as its siblings, but with a simplified single-band interface and low latency performance optimized for use on individual tracks. PSP VintageWarmer (LE) is a direct descendant of the original PSP VintageWarmer, with all its strengths such as low resource usage and latency. PSP VintageWarmer2 includes the acclaimed FAT double sampling mode for even more accurate analog sounding processing.

  PSP VintageWarmer (LE) and PSP MicroWarmer are the recommended choices for multi-tracking applications, except in situations where FAT mode is important. PSP VintageWarmer2 is recommended for use in mastering sessions or when processing groups or master busses. Typical applications include optimizing the density and average signal levels of recordings during mixing or mastering, shaping the dynamics of recordings during mixing, adding warmth to individual tracks or complete mixes, and adding analog tape-style compression to individual tracks or complete mixes.
specs: |-
  - High quality signal processing algorithms
  - Single or multi-band signal processing
  - FAT (Frequency Authentication Technique) PSP's double sampled processing
  - 64-bit floating point precision
  - Shelf filters for bass and treble frequencies in single-band processing mode
  - Control of bass and treble signal components in multi-band processing mode
  - Accurately calibrated VU and PPM meters with the overload indicators
  - Disengageable brick-wall limiting
  - Two Release Multiplier ranges for fast or relaxed processing
  - Semi Automated Release mode
  - Up to 192kHz sample rates supported
  - Library of presets
  - Windows 7 - Windows 11, 64-bit VST, VST3 and AAX (Pro Tools) compatible host
  - macOS Intel or macOS Silicon, macOS X 10.14 Mojave - macOS 15 Sequoia, 64-bit AudioUnit, VST, VST3 and AAX (Pro Tools) compatible host
  - Requires a free iLok user ID and the iLok License Manager application, no hardware dongle needed
  - License can be activated in 3 separate locations, each either a computer or an iLok dongle (2nd generation or above)
