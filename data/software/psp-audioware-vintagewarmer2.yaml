description: A high-quality digital simulation of an analog-style single or multi-band compressor/limiter that merges warm analog processing with a straightforward interface. Features 64-bit floating-point precision, FAT (double sampling) mode for enhanced analog simulation, brick-wall limiting, VU and PPM metering, shelf filters, semi-automated release mode, and saturation effects mimicking analog tape recorders. Ideal for optimizing density and signal levels during mixing and mastering.
details: |-
  Installer includes three variants: PSP VintageWarmer2 (with FAT double sampling), PSP VintageWarmer LE (original descendant with low resource usage), and PSP MicroWarmer (single-band, low-latency for individual tracks). Supports sample rates up to 192kHz. Activation uses iLok License Manager (no hardware dongle required); allows activation on 3 locations.
specs: |-
  - 64-bit floating-point precision
  - Sample rate support up to 192kHz
  - Single-band and multi-band processing modes
  - FAT (double sampling) mode for enhanced analog simulation
  - Brick-wall limiting (disengageable)
  - VU and PPM metering with overload indicators
  - Shelf filters for bass/treble (single-band mode)
  - Semi-automated release mode
  - Comprehensive preset library
  - iLok License Manager activation (no dongle required, 3 activations)
  - Platforms: macOS 10.14-15 Sequoia (Intel and Apple Silicon), Windows 7-11 (64-bit)
  - Formats: AU, VST2, VST3, AAX
