details: |-
  Big Bang Orchestra: Neptune includes tutti recordings of all 13 woodwind
  instruments that correspond exactly to the ones included in the big bang
  orchestra modules, where the entire orchestra is playing at once. In big bang
  orchestra: neptune, the tutti ensemble of all the woodwinds brings together 13
  musicians with their diverse instruments, from the piccolo to the
  contrabassoon.

  The 13 woodwind instruments include: 1 piccolo, 3 flutes, 2 oboes, 1 english
  horn, 2 clarinets in bb, 1 bass clarinet, 2 bassoons, and 1 contrabassoon. Via
  key switching you have the option to remove the piccolo and its clearly
  audible high tone from the tutti sound, if you wish.

  The included articulations with up to three velocity layers correspond to
  those of the other tutti bbo modules such as andromeda, with variations of
  short notes, long notes, repetitions, espressivo, soft swells, sforzando,
  sforzatissimo, crescendos, flutter tongues, trills and fast repetitions.

  The woodwinds of bbo: neptune are completely new recordings that can be
  seamlessly combined with the tutti recordings of the other big bang orchestra
  modules to add even more and varied colors. The synchron player offers a wide
  variety of mixer presets that blend perfectly well with all the other bbo
  sections and ensembles, with the processed category offering mixer presets
  such as compressed, sparkling, howling woods, outer space woods and more.

  Microphone setup includes main (decca tree stereo), main (decca tree center),
  main surround stereo, high stereo, high surround stereo, and individual
  microphone positions for flutes, oboes, clarinets, and bassoons. Recording
  took place at the synchron stage vienna.
