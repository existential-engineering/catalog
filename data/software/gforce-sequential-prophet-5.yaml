description: The first official Sequential Prophet~5 software plugin, developed
  in partnership with Sequential, recreating the legendary 1978 analogue
  synthesizer in software form. Captures the sonic character of all three
  Prophet-5 hardware revisions and has shaped decades of music across genres
  from Genesis to Radiohead.
details: |-
  Sequential Prophet~5 is the first officially licensed software recreation of the iconic Prophet-5 synthesizer, developed by GForce Software in partnership with Sequential. It faithfully models all three hardware revisions: Rev1 and Rev2 (SSM filters) and Rev3 (Curtis filters), giving players access to the distinct sonic character of each era.

  The instrument features a dual-layer architecture supporting Split, Layer, and Alternate modes, with up to 10 voices per layer. An X-Modifiers section provides dedicated envelopes and LFOs per parameter, extending the modulation capabilities well beyond the original hardware.

  Built-in effects include two selectable FX slots plus Delay, Reverb, and Pan Spread. Available effect types are Chorus, Phaser, Filter, Distortion, Tremolo, and Compressor. The plugin ships with over 460 professionally designed presets, including the original 38 factory patches from 1978.

  Each layer features independent arpeggiator and chord modes. The instrument supports full MPE compatibility and comprehensive MIDI CC mapping.
