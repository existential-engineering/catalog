description: The first official Sequential Prophet~5 software plugin, developed
  in partnership with Sequential, recreating the legendary 1978 analogue
  synthesizer in software form. Captures the sonic character of all three
  Prophet-5 hardware revisions and has shaped decades of music across genres
  from Genesis to Radiohead.
details: |-
  The Prophet~5 remains a benchmark for analogue tone, musical immediacy and instrument design, a synthesizer whose reputation extends far beyond its original era. From Genesis to Radiohead, Madonna to Aphex Twin, the Prophet~5 sound has spanned genres and decades.

  For the first-ever official Prophet~5 plugin, Sequential has collaborated with GForce Software to honour the sound, feel and character of the original instrument in software. It brings together Sequential’s place in the history of analogue synthesis with GForce’s experience in creating expressive, authentic virtual instruments.

  Across the Rev1, Rev2 and Rev3 character models, the plugin delivers the tone, response and musicality that made the original so sought-after, from the warmth of the SSM designs to the punch and presence of the Curtis filter. All of the original hardware functionality has been included. The original 38 factory presets from 1978 are included alongside a modern library of over 420 patches.

  While staying true to the spirit of the original, Prophet~5 introduces modern enhancements. At the heart of the expanded instrument is GForce’s newly redesigned X-Modifiers section, where almost every parameter has its own dedicated envelope and LFO, allowing sounds to move and evolve while preserving the immediacy and tone of the original hardware. Prophet~5 also includes two independent layers with Layer, Split and Alternate modes, with an individual arpeggiator and chord mode for each layer, so you can create stacked textures, keyboard splits and rhythmic contrast within a single instance.

  For further control, comprehensive MIDI CC mapping and full MPE compatibility give compatible controllers access to detailed pitch, pressure and timbral expression. Completing the instrument is a suite of studio effects including chorus, phaser, multimode filtering, tremolo, compression, stereo delay and reverb, with extensive modulation possibilities throughout.
specs: |-
  - Character models: Rev1 and Rev2 SSM, Rev3 Curtis filter and envelope characteristics
  - Architecture: dual layer with Layer, Split and Alternate modes, up to 10 voices per layer
  - Modulation: newly redesigned X-Modifiers, with a dedicated envelope and LFO assignable to almost every parameter
  - Effects: two selectable FX slots plus dedicated delay, reverb and pan spread
  - Selectable FX: chorus, phaser, filter, distortion, tremolo and compressor
  - Presets: over 460, including the original 38 factory patches from 1978
  - Arpeggiator and chord mode: independent per layer
  - Patch browser with tagging and search
  - Expression: full MPE compatibility and comprehensive MIDI CC mapping
  - UI: fully resizable high-resolution interface
  - Mac requirements: Intel or Apple Silicon Mac, macOS 10.15.x or above, 8 GB RAM
  - Windows requirements: Intel i5 / Ryzen 5 or equivalent CPU, Windows 7 or above, 8 GB RAM
  - Trial: limited to 7 days
