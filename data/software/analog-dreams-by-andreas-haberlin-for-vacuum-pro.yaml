details: |-
  Andreas haberlin is an acclaimed award-winning producer, composer and sound designer from brooklyn new york. With well over a decade of experience in producing quality sounds in both switzerland and the us andreas's new pack for air showcases the creative power of vacuum pro.

  This pack contains 200 all new expertly designed preset patches exploring the very best of analog tube synthesis and pushes the boundaries of vacuum pro.

  Ranging from warm and pristine to downright dirty, this expansion pack energizes your music with a fresh injection of top quality sounds. From powerful leads, crushing bases, dynamic fast pads, sync pads, evolving pads, arpeggios, evolving textures, pitch transitioners, to so much more this pack has something for every project.
