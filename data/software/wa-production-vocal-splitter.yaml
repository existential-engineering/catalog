description: Vocal Splitter turns a mono vocal into a wide stereo signal by combining a phase-offset vibrato that asymmetrically detunes the left and right channels with asymmetrical rectification of both channels. Speed, depth, drive and filter controls shape the added stereo signal.
details: |-
  Vocal Splitter is a single unit for turning mono vocals into thick, modern sounding stereo, replicating a long-standing studio technique. Frequency and drive parameters are added on top of the core stereo effect, and the plugin can be used on sources other than vocals.

  The processing combines a phase-offset vibrato effect, which splits the left and right channels by asymmetrically detuning them, with an asymmetrical rectification of the left and right signal that produces a better defined stereo image. Combining the two in one plugin creates a defined stereo split with minimal phasing.

  A central mix dial sets the dry and wet ratio between the original source signal and the added stereo signal. A Mute Source button silences the source so only the processed audio is heard, which suits solo monitoring or use on an effects bus.

  Speed and Depth work together to control the phase-offset vibrato, covering everything from subtle thickening to full doubling. The Drive control sets the intensity of the asymmetrical rectification, providing a saturation-like effect when pushed hard and bringing the stereo image back in towards the centre.

  High pass and low pass filters restrict the added stereo signal to a chosen frequency range, which helps avoid unwanted phasing in the low end. The Vocal Splitter logo acts as a smoothed, click and pop free bypass control for the whole plugin. Version 2.1.0 added resizability with updated preset and license management, and version 2.2.0 added native Apple silicon and arm64 support.
specs: |-
  - Creates wide, modern vocals from a mono source
  - Presets for one-click transformations
  - Speed and Depth controls set the power of the effect
  - Drive dial adds grit and increases definition
  - Mute Source button for using the effect as a send
  - High pass and low pass filters for the added stereo signal
  - Click-free bypass
  - Minimal phasing
  - Full PDF manual and tutorial video
  - Resizable interface
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
