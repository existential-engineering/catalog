description: Stop wasting time loading up an entire arsenal of plugins to achieve that classic LoFi sound. Simplify the entire chain with TeloFi and go from 4-5 plugins to one.
details: |-
  You already know the lo-fi telephone effect. You've used it before, probably in your last mix. But you shouldn't need four plugins and a half-hour of automation work to get it. TeloFi condenses the entire chain into one plugin.

  The classic lo-fi sound used to mean stacking four or five plugins and tweaking back and forth. TeloFi does it in one step. Less clutter in your session, less time setting up, more time focused on the creative work.

  Filter sweeps. Lo-Fi to Hi-Fi transitions. Effect builds and drops. When you're automating four plugins at once, things get messy fast. TeloFi puts every parameter in one plugin, so your automation stays clean and your creative flow stays unbroken.

  The lo-fi-to-hi-fi drop is one of the most powerful moments in modern production. TeloFi makes that transition effortless to create and repeatable every time you need it.
specs: |-
  - Effect intensity control for how drastic or subtle the lo-fi effect is
  - Tone shaping control for dark/muffled to thin/bright character
  - Built-in compressor with fixed settings optimized for TeloFi
  - Built-in distortion for extra character and grit
  - Custom slap delay for texture
  - Mac OS X 10.15 or higher
  - Windows 10 or higher
  - 64-bit only
  - 200 MB free drive space
