details: |-
  Adding a rich, velvety sweetness to the bass and tenor ranges, the Abbey Road Orchestra Woodwinds section is completed by a world-class Bassoons a2 section. Meticulously captured in the legendary Abbey Road Studio One, a comprehensive suite of bassoon techniques have been captured with 16 microphone signals, delivering unparalleled depth, character, and realism to your compositions.

  From its rich, warm tone in the lowest registers, to its sweet, piercing sound in higher passages, the bassoon is an immensely versatile instrument with a profound emotional range. Its unique timbre provides a foundational bass voice, supporting the entire orchestra with its resonant presence, executing playful, punchy staccatos, or weaving expressive, lyrical melodic lines with remarkable human-like warmth, akin to a resonant baritone singer.
specs: |-
  - Bassoons a2 section
  - Legato techniques: Performance Legato (Extended), Lyrical Legato (Extended), Legato Runs, Legato Slurred, Legato Allegro
  - Long techniques: Long (Extended), Long (sfz), Trills (major 2nds, minor 2nds, minor 3rds)
  - Short techniques: Staccatissimo, Staccato, Staccato (alt), Marcato, Tenuto, Short Double Tongue, Short Triple Tongue, Short Quad Tongue
  - 16 curated microphone signals: Mix 1, Mix 2, Close, Close Ribbons, Pop Main, Pop Room, Tree 1, Tree 2, Outriggers 1, Outriggers 2, Mids, Ambients, Vintage 1, Vintage 2, Leader, Spill
  - Two hand-crafted mixes by Simon Rhodes
