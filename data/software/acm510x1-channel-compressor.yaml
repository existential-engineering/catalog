details: >-
  The acm510x1 emulates all the desirable qualities of a professional analogue
  channel compressor, taming dynamics without restricting the natural character
  of a mix or performance. Presented as a virtual 500-series module with a
  modern stylized user-interface, the acm510x1 provides soft-knee compression
  coupled with a gentle analogue style overdrive for warmth and character at
  high signal levels.


  The acm510x1 can be used in mono or stereo channels, delivering professional
  console-grade processing, with efficient use of cpu and system resources. More
  efficient use of cpu and system resources allows more plug-in instances in a
  typical audio workstation project.


  Switchable side-chain highpass filter prevents over compression of low
  frequency transients. Warm analogue style overdrive when driven with high
  signal levels. Physically modelled rotary control modes.


  Resizable, modern user interface. As intuitive and easy to use as a
  traditional analogue console channel compressor. VST, vst3, AAX and clap
  plug-in.


  Windows and linux compatible. Easy to install. Demo versions are free to
  download.
