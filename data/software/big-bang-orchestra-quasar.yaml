description: "Big Bang Orchestra: Quasar solo percussion: drums, cymbals, gongs,
  percussion. Exceptional acoustics of the large synchron stage Vienna."
details: |-
  This percussion module offers a collection of unpitched instruments in the
  categories of drums, cymbals & gongs, and percussion, derived from the
  synchron series libraries synchron percussion I and synchron percussion ii.

  All instruments were recorded "in situ" on their perfect spot in the large
  hall of synchron stage vienna with an expansive, phase-controlled
  multi-microphone set-up, including close and mid mics, decca tree (left -
  center - right), as well as surround and high surround outriggers.

  Articulations include a variety of single hits, rimshots, upbeats, rolls and
  many others, depending on the instruments and beaters.

  Getting the right sound out-of-the-box is a breeze, given the host of presets
  that not only match the sound of all the other libraries in the big bang
  orchestra series, but also stand on their own in all kinds of arrangements and
  styles.

  By expertly combining the available microphone signals with the internal
  effects of the synchron player you get presets such as close, classical, wide,
  distant, ambient, comp+reverb, boom+comp, far away echoes, and many more.
