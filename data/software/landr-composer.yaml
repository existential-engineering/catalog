description: "AI-powered chord progression generator plugin that creates
  melodies, basslines, and arpeggios without requiring music theory knowledge.
  Features smart MIDI generation and piano roll editing."
details: |-
  Assistive chord generation with complex progressions. Smart MIDI generation for chords, basslines, melodies, and arpeggios. DAW integration via drag-and-drop MIDI patterns. Piano roll editing with preset sounds. Scenes and Song Mode for arrangement. Generates major, minor, augmented, diminished, and sustained chords with extensions and inversions. 100+ presets across Bass, Keys, Lead, and Pad categories. Requires macOS 10.14+ or Windows 10 64-bit+.
specs: |-
  Formats: VST3, AU, AAX (macOS). VST3, AAX (Windows). macOS 10.14+ (Apple Silicon Native, Intel). Windows 10 64-bit+. 100+ presets.
