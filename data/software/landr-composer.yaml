description: Break through creative barriers and speed up your workflow with a powerful AI chord progression generator for creating melodies, basslines, and arpeggios.
details: |-
  Assistive chord generation for complex progressions and individual chords. Smart MIDI generation for chords, basslines, melodies, and arpeggios. Chord progression editing and refinement tools.

  Piano roll MIDI editing with preset sounds. DAW synchronization and drag-and-drop MIDI integration. Scenes and Song Mode for organizing musical ideas.

  Generates major, minor, augmented, diminished, and sustained chords with extensions and inversions across all standard Western keys and modes. Over 100 presets across Bass, Keys, Lead, and Pad categories.
specs: |-
  - macOS 10.14 or higher (Apple Silicon Native, Intel)
  - Windows 10 (64-bit) or higher
  - Formats on macOS: VST3, AU, AAX
  - Formats on Windows: VST3, AAX
  - 100+ presets across Bass, Keys, Lead, and Pad categories
  - Smart MIDI generation for chords, basslines, melodies, and arpeggios
  - Chord types: major, minor, augmented, diminished, sustained with extensions and inversions
