description: Break down creative barriers with a powerful AI chord progression
  generator for creating melodies, basslines and arpeggios.
details: |-
  LANDR Composer is an AI-assisted composition plugin that helps producers break through creative barriers and speed up their workflow. It generates chord progressions along with melodies, basslines and arpeggios, aligning the results to the user's own musical style with an interface the page describes as intuitive and requiring no music theory knowledge.

  Chord work is handled by assistive chord generation, which automatically creates and tweaks complex chord progressions as well as individual chords. A chord progression guide lets the user edit, move and refine chords to perfect a harmonic sequence. The plugin can generate progressions using major, minor, augmented, diminished or sustained chords, with the typical extensions and inversions applied where applicable, across all of the standard Western keys and modes.

  Assistive MIDI generation produces chord, bass, melody and arpeggio performances with customizable modifiers such as polyphony and humanization. Generated parts follow the chord progression so the composition stays in key. A built-in piano roll gives precise control over the MIDI, and the plugin ships with over a hundred stock preset sounds in categories including Bass, Keys, Lead and Pad, so it can be used as its own instrument voice rather than only as a MIDI source.

  Scenes and Song Mode let the user organize multiple musical ideas and arrange them into a full composition. The plugin syncs to the host DAW for real-time adjustments, and MIDI patterns can be dragged and dropped directly onto a MIDI track in the DAW project.

  LANDR Composer is available as a standalone purchase and is also included with a LANDR Studio subscription alongside the rest of LANDR's plugins, samples, mastering and distribution tools.
specs: |-
  - AI-assisted chord progression generation (major, minor, augmented, diminished, sustained chords with extensions and inversions)
  - All standard Western keys and modes
  - Assistive MIDI generation for chords, basslines, melodies and arpeggios
  - Customizable MIDI modifiers including polyphony and humanization
  - Chord progression guide for editing, moving and refining chords
  - Built-in piano roll for MIDI editing
  - Over 100 preset sounds in categories including Bass, Keys, Lead and Pad
  - Scenes and Song Mode for arranging multiple ideas into a full composition
  - Sync to DAW for real-time adjustments
  - Drag-and-drop of MIDI patterns into the DAW
  - macOS: OS X 10.14 or higher, Apple Silicon native or Intel (VST3, AU, AAX)
  - Windows: Windows 10 (64-bit) or higher (VST3, AAX)
