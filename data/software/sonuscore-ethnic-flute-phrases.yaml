description: Flute instrument for Kontakt and free HALion Sonic featuring inspired, live recorded phrases and techniques from 4 selected Asian flutes. These four Asian flutes provide an unbelievable emotional character, shaping countless Hollywood scores with a versatile and easy-to-use instrument offering a big variety of passionate lyrical phrases.
details: |-
  Ethnic Flute Phrases opens the Lyrical Series' move into ethnic instruments, presenting four selected Asian flutes as a phrase-based scoring toolbox rather than a conventional multisample library. The recordings are complete live performances, so a key press returns a played line with its phrasing and expression intact, which is the expressiveness the series is built to capture.

  The four flutes cover a wide range of styles and techniques, from very simple and efficient phrases through to virtuoso and strongly characteristic ones. Every phrase can be adjusted in key, speed, length, succession and connection, with a speed knob at the centre of the interface for precise timing control, and all phrases were recorded to fit multiple tempi and stay expressive without being locked to a set meter.

  The library holds more than 900 live performed phrases across 17 diverse themes. Each theme comes with 15 different phrases as starting, middle and end phrases, plus two short end phrases for concluding a passage or switching between them, so material can be recombined into new lines. Three legato solo flutes are also included, merging traditional and phrase-based sampling and adding two further playing techniques, usable to connect or extend existing phrases or to write new ones.

  The interface is the Lyrical Series one: multiple phrases can be assigned across the keyboard and switched between, each phrase carries a waveform preview, and an FX page provides EQ, delay and reverb. It runs in the full version of Native Instruments KONTAKT or in Steinberg's free HALion Sonic.
specs: |-
  - 900+ live performed phrases
  - 17 diverse themes
  - 4 Asian flutes
  - 3 legato solo flute instruments included, adding two further playing techniques
  - 15 different phrases per theme as starting, middle and end phrases, plus 2 short end phrases
  - Phrases adjustable in key, speed, length, succession and connection, with a central speed knob
  - Multiple phrases assignable across the keyboard with a waveform preview for each
  - FX page with EQ, delay and reverb
  - Requires the FULL version of Native Instruments' KONTAKT 5 (version 5.8.1 or higher), or Steinberg's free HALion Sonic
  - The free Kontakt Player is not sufficient: it only runs the instrument in DEMO mode
  - HALion Sonic is currently not compatible with Notion by PreSonus
  - Intel Core 2 Duo processor recommended
  - Mac OS X 10.11 or higher
  - Windows 7 or higher
  - 4 GB RAM
  - At least 2 GB of free hard disc space
