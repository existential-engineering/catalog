description: Find four world-class analog-modeled native plugins in The Sound of
  the '70s – add warmth and character to your mixes with these classics.
details: |-
  The technological advances of the '70s are what set the stage for the beloved disco and progressive music of the time. Great pioneers like Tom Moulton, Stevie Wonder, and Tangerine Dream were eager to incorporate the technology of the decade. A great variety of synthesizers were explored, alongside digital delay, the Mellotron — the list goes on and on. Antelope's homage to the '70s includes four analog-modeled effects that laid the foundations of some of the greatest sounds of the time.

  Reel-to-Reel (Tape Saturation)

  Filtek MK3 (3-Band EQ / HPF / LPF)

  TUBE 176 (Vari-Mu Tube Compressor / Limiter)

  BAE-1073MP (Mic / Line Preamp)

  {'Reel-to-Reel': 'Combines the best tape formulas, the best tape heads and the finest electronics. The combinations between all those allow you to add unique tape effect to your mix.', 'Filtek MK3': "Originally designed in the '70s, the versatile equalizer sounds clear and precise. Provides combinations of controls and switches that allow for plenty of experimentation.", 'TUBE 176': 'The hardware original behind Tube 176 owes its sound to a unique variable-mu dual triode tube. The powerful, fast compressor can be used on everything — vocals, guitar solos, bass lines, drums, or even a full mix.', 'BAE-1073MP': 'One of the most famous mic preamps; the BAE 1073MP has shaped the sound of rock and roll records. Alter the input impedance with a single switch, to control the amount of rich and warm coloration you apply to acoustic instruments and vocals.'}

  Runs natively in your DAW on macOS or Windows, or in real-time on your Synergy Core interface.
