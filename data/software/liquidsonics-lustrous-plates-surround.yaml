description: Designed with the multi-channel music mixer in mind, Lustrous
  Plates Surround is the only plate reverb of its kind, for surround and Atmos
  music mixes.
details: |-
  Lustrous Plates Surround is a rich and luxurious contemporary plate reverb with ten distinctive models for use in surround and Atmos mixes up to 9.1.6. Designed with the multi-channel music mixer in mind, Lustrous Plates Surround is the only plate reverb of its kind. Nowhere else can you find a fully decorrelated multi-channel plate reverberation algorithm meeting the demands of the contemporary surround and Atmos music mixer.

  The reverb excels at phase artefact free fold-down, essential when mixing or remixing for home and headphones-focused Atmos delivery formats. It is ideal whether you are bringing classic tracks featuring plate reverbs into Atmos or working on original surround pieces calling for the distinctive sound of plate reverberation. The surround edition has all the features of the stereo edition including the even diffusion and beautiful spectral decay of ten real hardware plates, whilst bringing many new enhancements and new features specifically to meet the needs of today's rapid surround production workflows.

  Modelled on ten unique plates including a very rare gold foil unit, extensive measurements were taken from each giving a realistic and distinctive reverberant tone to each. Chrome is a rich, full bodied plate with a classic plate multi-band decay profile. Silver is a light, airy plate with de-emphasised low-mids for enhanced clarity. Steel is similar in nature to the chrome plate with a reduced low band decay time. Rhodium is bright and rich, with a very neutral decay profile. Beryllium is a very reflective, lustrous metal inspiring a plate with a bright tone. Corbomite is a very dense and heavy plate. Iridium is very dense, with a highly emphasised low decay profile. Osmium is a rich reverb capable of very clean, short ambiences. Platinum is very dense and bright, with rich lows on longer decays. Gold is a simulation of the rare 'gold foil' 240 compact plate reverberator.

  Lustrous Plates Surround provides a level of independent control over the direct and crossfeed signals crucial to achieving great results with surround reverbs. A plate typically has an immediate onset, but the surround edition provides bloom and delay controls to allow the reverb to spread gently across the surround field. Level and delay allow you to control when and how much of a signal propagates into adjacent surround channels. Plate reverbs typically have a very robust low end, especially when the decay times are towards the upper end of the range, so high and low cut filters with selectable roll-off curves can be used (6, 12, 18 and 24 dB) to allow you to dial in as much low end weight and high end sizzle that your surround mix needs.

  The pre-delay and surround channel delays of the reverb can be set in milliseconds, or click the metronome button to set it relative to the current project tempo to sync the reverb to the beat of the song. In a real plate frequency dispersion is critical to its sound and occurs due to the choice of materials, tension, mounting factors and more, and the amount of simulated dispersion for each plate is controllable via a single 'frequency dispersion' parameter. The delay and level tabs provide the ability to apply a traditional level-based pan as many plates often do not have a rock-solid central image, and you can also create interesting pan-delay effects by delaying the left/right channels which can range from a subtle haas effect to dramatic stereo slap delays. A dynamics module is provided for gate, ducking and compression effects.
specs: |-
  - Mono, stereo, LCR, quad, 5.0 - 5.1.4, 7.0 - 7.1.6, 9.0.4 - 9.1.6 channel support
  - Ten unique plate models created with TASM
  - Enhanced surround reverb algorithm
  - Crossfeed level and delay
  - Crossfeed low/high cut EQ
  - Bloom control (direct and crossfeed)
  - Multi-channel delay (inc tempo sync)
  - Multi-channel level
  - Pan delay
  - Level delay
  - Optional VLF reverb
  - Faithfully reproduced frequency dispersion and damping
  - Modulated and fully decorrelated true stereo reverb design
  - Fusion-IR and enhanced modulation modes
  - Low and high roll-off (6-24 dB), low and high shelf/bell filters
  - Width control (mono through to fully decorrelated true-stereo)
  - Pre-delay (0 to 500 ms or sync to tempo)
  - Dynamics module (compressor, ducker, gate) with external trigger
  - Parameter locking
  - 75 presets
  - Bar and VU metering
  - Light and dark colour themes
  - Tool-tip help system
  - iLok 2, iLok 3, iLok Cloud or iLok machine activation
  - Windows 7 and above
  - OS X / macOS 10.13 and above
  - VST 2.4, VST3, Audio Unit (AUv2) and AAX Native plug-in formats
  - 64-bit DAWs are required (32-bit is not supported)
  - macOS installer contains 64-bit Universal Binaries (Apple Silicon and Intel x64)
  - 800 MB hard disk space is required
  - At least 8 GB of main memory is recommended
  - A dual core i5 or Apple Silicon processor or above is recommended
