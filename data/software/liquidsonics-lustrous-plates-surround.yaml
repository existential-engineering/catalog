description: Designed with the multi-channel music mixer in mind, Lustrous Plates Surround is the only plate reverb of its kind. Atmos and Spatial audio.
details: |-
  Lustrous Plates Surround is a contemporary plate reverb plugin designed specifically for surround and Atmos mixes up to 9.1.6 format. It features a fully decorrelated multi-channel plate reverberation algorithm, making it the only plate reverb of its kind for immersive audio workflows.

  The plugin offers 10 distinct plate models — Chrome, Silver, Steel, Rhodium, Beryllium, Corbomite, Iridium, Osmium, Platinum, and Gold — each representing a different character of plate reverb sound. These models provide a wide tonal palette from bright and metallic to dark and warm.

  Lustrous Plates Surround includes extensive modulation and shaping tools: crossfeed level and delay control, bloom control for direct and crossfeed signals, frequency dispersion modeling, and pre-delay with tempo sync up to 500ms. EQ options include low/high cut filters (6–24dB) and shelf filters.

  A comprehensive dynamics module provides gate, ducker, and compressor functions, while pan delay and level delay effects add spatial control. An optional VLF (very low frequency) reverb extends the low-end character of the reverb tail.

  The plugin supports mono through 9.1.6 channel configurations and ships with 75 presets. A 14-day free trial is available. Licensing requires iLok 2/3, machine activation, or iLok Cloud.
specs: |-
  - Supported channel formats: mono, stereo, LCR, quad, 5.0–5.1.4, 7.0–7.1.6, 9.0.4–9.1.6
  - 10 plate models: Chrome, Silver, Steel, Rhodium, Beryllium, Corbomite, Iridium, Osmium, Platinum, Gold
  - Pre-delay: 0–500ms with tempo sync
  - EQ: low/high cut (6–24dB slopes) and shelf filters
  - Dynamics module: gate, ducker, compressor
  - Crossfeed level and delay control
  - Bloom control for direct and crossfeed signals
  - Frequency dispersion modeling
  - Pan delay and level delay effects
  - Optional VLF reverb
  - 75 presets
  - macOS 10.13 and above (Universal Binary: Apple Silicon + Intel x64)
  - Windows 7 and above
  - License: iLok 2/3, machine activation, or iLok Cloud
  - Recommended: dual-core i5 or Apple Silicon, 8GB RAM, 800MB disk space
