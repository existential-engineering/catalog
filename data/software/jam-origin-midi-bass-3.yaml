description: MIDI Bass 3 transforms your bass into a polyphonic MIDI controller, listening to and recognizing what you play in real time to generate MIDI/MPE output using state-of-the-art audio tracking models optimized for bass players.
details: |-
  Transforms a standard bass guitar into a polyphonic MIDI controller via 1/4" jack (no special pickup required)
  Generates real-time MIDI and MPE (MIDI Polyphonic Expression) output
  MPE support provides four dimensions of expression per note: strike, pressure, brightness, and pitch
  Modular and extensible architecture: integrates third-party plugins, virtual instruments, and MIDI controllers
  All Jam Origin plugins integrate with each other as native modules and extensions
  Designed for use both in the studio and on stage
