description: MIDI Bass 3 transforms your bass into a polyphonic MIDI controller. It listens to and recognizes what you're playing on your instrument then generates MIDI output to drive synthesizers, all in real time while using state-of-the-art audio tracking models optimized for bass players.
details: |-
  MIDI Bass 3 transforms your bass into a polyphonic MIDI controller. It listens to and recognizes what you're playing on your instrument then generates MIDI output to drive synthesizers, all in real time while using state-of-the-art audio tracking models optimized for bass players.

  No special pickup required. Unlike most bass synthesis devices, MIDI Bass 3 simply requires the audio signal from your instrument's 1/4" jack (via a standard USB audio interface) to generate MIDI/MPE output.

  MIDI Polyphonic Expression (MPE). With bass-to-MPE finally here, every note now has four dimensions of expression (strike, pressure, brightness and pitch). Multidimensional expressivity keeps the player more closely connected to the sound of the virtual instrument.

  Modular and extensible. MIDI Bass 3 is a powerful, versatile, easy-to-use, modular system, that brings together third-party plugins, virtual instruments and MIDI controllers into a package that is easy for bassists to use, in the studio and on the stage.

  JAM = Joint Audio + MIDI. All Jam Origin plugins integrate with one another as native modules and extensions.
specs: |-
  - Polyphonic audio-to-MIDI tracking using audio tracking models optimized for bass players
  - No special pickup required: works from the instrument's 1/4" jack via a standard USB audio interface
  - MIDI Polyphonic Expression (MPE) output with four dimensions of expression per note (strike, pressure, brightness, pitch)
  - Modular, extensible system that hosts third-party plugins, virtual instruments and MIDI controllers
  - Windows 10/11 as standalone app, VST2 and VST3
  - macOS as standalone app, AU, VST2 and VST3
  - iOS/iPadOS as standalone app and AUv3
  - Full-featured free trial mode with occasional interruptions
  - Pay once: lifetime license with lifetime free updates (license purchase only, not iOS in-app purchase)
