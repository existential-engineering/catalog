details: |-
  Though named as vocal remover, the plugin is used for removing or extracting sound in a specified direction span from a stereo sound.

  If you use it to extract the center vocal sound, it becomes center vocal extractor. If you use it to remove the guitar sound on the left, it becomes side guitar remover.
specs: |-
  - Stereo sound processing
  - Directional sound removal
  - Center vocal extraction
  - Side sound removal
