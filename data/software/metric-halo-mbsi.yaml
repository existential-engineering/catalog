description: MBSI is a faithful model of the channel strip from the custom MCI
  console built for Studio C at Criteria Studios in Miami. It features a
  mic/line section, a dynamics section, an EQ section and a fader, along with an
  accurate model of the console's stereo bus output.
details: |-
  MBSI recreates one of the most successful custom built consoles in the United States. Custom built by the technicians at MCI for studio C at Criteria Studios in Miami, Florida, the console was used in the production of dozens of hit records that sold millions of copies, by artists including the Eagles, Eric Clapton, the Bee Gees and Grand Funk Railroad, working with producers including Tom Dowd and Bill Szymczyk. The plug-in was made with Make Believe and Szymczyk.

  It models the channel strip: a mic/line section, a dynamics section, an EQ section and a fader, plus the stereo bus output of the console. The original was ruthlessly analog, with a box tone imprinted just by running through the channel, and like many devices of its time it was quirky, to the point that the markings on the face plate do not match the actual behavior of the processor.

  The EQ module used a simple design with limited components, relying on the inherent characteristics of those components to achieve equalization. All the controls interact, and the Q of the filters changes with gain and frequency. What looks like a limitation pushes decisions back onto what is being heard, within a limited but musical range of options.

  The dynamics section of the original console was a Suppressor meant to be used with analog tape, the controls were stepped, the mid-band of the EQ was boost only, and the filter section supported low or high cut but not both. That behavior is preserved in Classic mode.

  Modern mode reflects the modifications the original console might have received if it were updated. It swaps in a channel compressor reflecting the types of external compression Szymczyk used with the console, makes the controls operate continuously while still able to snap to the original stepped values, allows cuts with the mid-band, and enables the high cut and low cut filters at the same time.
specs: |-
  - World-class signal processing and workflow
  - User-selectable over-sampling (up to 16x)
  - Faithful recreation of the box tone of the Line, Mic Pre, Overdriven Mic Pre, Dynamics and EQ modules
  - EQ Module features a 3-band design with LF and HF Bell-Shelf filters, a sweepable Mid Bell and Hi/Low Cut Filters, with highly interactive controls affecting filter shape, frequency and gain
  - Stepped controls matching the behavior of the console in Classic mode
  - Continuous controls with interpolations in the spirit of the original design in Modern mode, with the ability to snap to the classic stepped values
  - Operational mods in Modern mode to support cuts with the mid-band EQ and enabling both low cut and high cut filters
  - A new compressor module in Modern mode with simple operation, capturing the dynamic vibe of the 1176 and dbx160
  - The sound and feel of one of the greatest consoles in the history of music recording
  - Polarity Invert
  - User-control of some elements of Box-Tone
  - Many presets included
  - Adjustable UI size
  - MH Preset Manager provides cross-platform presets
