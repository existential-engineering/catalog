details: |-
  ICONS: Fullerton Volume 3: Vibras & Supers is one of the four individually sold volumes of The Fullerton Collection, the first release in Fractal Audio's ICONS series. ICONS brings the amp modeling and effects of the Axe-Fx to plugins and to the desktop as a standalone application, and each volume is centred on a family of American-style amps from Fullerton, California. This volume carries nine amp models: 6G4 Super (6G4 Super), Super Verb Normal and Super Verb Vibrato (the two channels of a Super Reverb), Tremolo Lux (Tremolux), Vibrato King (Vibro-King), Vibrato Lux (Vibrolux), Vibrato Verb AA and Vibrato Verb AB (the AA763 and AB763 Vibroverb circuits) and Vibrato Verb SRV, based on a 1964 Vibroverb with Caesar Diaz modifications for Stevie Ray Vaughan.

  Fractal Audio's modeling technology creates fully adjustable amp models with authentic, interactive controls. The models behave like the originals, so the player shapes tone naturally rather than browsing static snapshots of someone else's settings. Component-level modeling recreates the preamp, tone stack, cathode follower, power supply, power amp, phase inverter and amp/speaker interaction, which means that knowing how to dial in the amp is enough to dial in the model.

  The volume ships with DynaCab HD speaker cabinet models chosen to complement its amps: 1x12 Vibrato Lux, 1x15 Vibrato Verb, 2x10 Super 6G4 and 4x10 59 Bassguy RI. DynaCab HD lets a virtual mic be positioned on a virtual speaker with the results audible in real time, and User Cab mode loads the player's own impulse responses in popular file formats up to 8k.

  ICONS includes premium stompbox and studio effects based on the same algorithms used in the Axe-Fx III, among them spring reverb and tremolo, more than a dozen drive pedals, wah, compression, modulation, delay, graphic EQ and bonus reverbs. A built-in tuner, intelligent noise gate, preset manager, tempo sync, DAW automation, MIDI control and built-in tooltips round out the feature set.

  The volume runs as a 64-bit AU, VST3 or AAX plugin and as a standalone application on Windows 11 and macOS 10.13 or newer, on Intel, AMD x64 and Apple silicon processors. An iLok account and the iLok License Manager are required, and an individual volume needs about 1.4 GB of disk space. Fractal Audio also sells all four volumes together as Fullerton Complete.
