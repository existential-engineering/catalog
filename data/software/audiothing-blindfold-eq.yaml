details: |-
  Blindfold EQ is a freeware EQ plugin inspired by a quote by Matt Wallace from the book Recording Unhinged by Sylvia Massy.

  It has 4 bands (LowShelf, LowMid, HighMid, HighShelf), but each knob is blind. There are no indicators or numbers to show frequency values, gain values or Q values. You have to use your ears.

  Blindfold EQ is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP). It is also available on the App Store for iOS and iPadOS (AUv3 and Standalone).

  The plugin is freeware: download links are sent by email after filling in the form on the product page. Activation needs no iLok dongle and no internet connection.
specs: |-
  - Multi-Band Resonant Filter
  - 4 bands (LowShelf, LowMid, HighMid, HighShelf) with no value indicators
  - Lightweight on CPU
  - Preset system with randomizer
  - Windows 7, 8, 10, 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP 64-bit)
  - OS X 10.9 - macOS 13, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP 64-bit)
