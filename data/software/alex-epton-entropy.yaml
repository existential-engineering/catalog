details: >-
  Made in collaboration with xl recordings' in-house producer-turned-composer
  alex epton (fka twigs, bjork, arca), these post-industrial soundscapes offer a
  deep dive into the raw, chaotic nature of feedback.


  Discover an inspiring spectrum of disorienting sounds that create both
  dramatic impact and eerie beauty sweeping synths, pulsing bass drones,
  multilayered sound design textures and distorted percussive elements which
  evolve, unravel or detune as you play, instantly sparking new ideas.


  Inspired by the experimental techniques of musique concrète, entropy was made
  from a unique combination of modular synthesis, granular synthesis, found
  sounds fed through self-built gear and pedals, and ir reverbs.


  It's useable in many different styles of music and sound design with different
  parameters to control over each patch from reverb amount dynamics attack
  release distortion etc.
