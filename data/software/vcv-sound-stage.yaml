description: Simulated 3D room reverb. VCV Sound Stage is a physically-accurate room reverb module that dynamically simulates the effect of audio being played through speakers (sources) in a room with microphones (destinations) to record the sound.
details: |-
  Place virtual speakers and microphones in a virtual 3D room. Design the sound of the room and walls, and modulate them with CV. Includes 30 realistic and abstract room presets from VCV and Omri Cohen.

  Sound Stage is not just a spatializer, since spatializers do not simulate wall reflections causing reverberation. This module is not a convolution reverb either, which simulates a static room with static sources and destinations. Unlike a convolution reverb, with Sound Stage you can manipulate the room dimensions, wall material, and source/destination positions in real-time.

  When an audio signal is patched into one of the four inputs labeled IN 1-4, a yellow source node appears in the virtual room display. Patching an output A-D causes a black destination node to appear. These are the locations of the virtual speakers and microphones in the room. The room is viewed from the top-down, like a bird's eye view. You can drag nodes to any X/Y position in the room and modulate the 2D position with each node's X CV input (left/right) and Y CV input (up/down). Regardless of the size of the room, the CV range is always 10V peak-to-peak. Destination node positions cannot be CV modulated.

  You can set the dimensions of the virtual room by adjusting the WIDTH, LENGTH, and HEIGHT parameters. The room dimensions can range from 1x1x2m, the size of a small shower stall, to 300x300x100m, the size of a sport stadium. To control the material of the virtual wall, adjust the LO CUT and HI CUT parameters, which can be modulated by patching a CV signal into the LO CUT and HI CUT CV inputs, following the 1V/octave standard. The REFL parameter controls the amount of attenuation of all frequencies when sound reflects off the wall, and the DIFF parameter specifies the diffusion, or roughness, of the wall surface.

  Note: Due to Sound Stage using a physically-accurate room simulation algorithm, it requires 4-8% CPU per active destination. Sound Stage is developed in collaboration with Dale Johnson of Valley Audio.
specs: |-
  - Physically-accurate 3D room reverb simulation with top-down bird's eye view display
  - 4 audio inputs (IN 1-4) creating source nodes, 4 outputs (A-D) creating destination nodes
  - Source nodes fixed at 1.5m height, destination nodes at 1.2m height
  - X and Y CV inputs per source node for 2D position modulation, 10V peak-to-peak range
  - Destination node positions cannot be CV modulated
  - WIDTH, LENGTH and HEIGHT room dimensions from 1x1x2m to 300x300x100m
  - LO CUT and HI CUT wall-material filters with CV inputs following the 1V/octave standard, 10 Hz to 22 kHz
  - REFL reflectivity parameter (0-100%) with CV modulation across 10Vpp
  - DIFF diffusion (wall roughness) parameter (0-100%)
  - 30 realistic and abstract room presets from VCV and Omri Cohen, including 20 fungal presets
  - Requires 4-8% CPU per active destination
  - Requires VCV Rack 2
