description: "Physically-accurate room reverb that simulates audio playback
  through virtual speakers and microphones in a 3D room. Adjustable room
  dimensions, wall materials, and source/destination positions with CV
  modulation."
details: |-
  Place virtual speakers and microphones in a virtual 3D room with real-time manipulation of room acoustics. 30 realistic and abstract room presets. Four audio inputs and four outputs for spatial mixing. CV-modulated parameters for wall filtering and reflectivity. Developed with Dale Johnson of Valley Audio. CPU usage: 4-8% per active destination. Version 2.0.5.
specs: |-
  Requires VCV Rack 2.
