description: "Professional additive synthesizer featuring 512 Euler-generated
  oscillators with -120dB signal-to-noise ratio. Transforms audio and images
  into harmonic content via FFT resynthesis with dual morphable layers,
  256-breakpoint envelopes, and comprehensive sound design tools."
details: |-
  Up to 512 per voice (Euler-generated)

  Up to 16 voices

  Dual resonant filter system with 6 types per unit, 128-band formant filtering

  8 built-in: distortion, phaser, flanger, compressor, EQ, chorus, delay, reverb

  FFT resynthesis (audio and image import), dual-state A/B morphing, visual spectral editor, intelligent harmonization

  -120dB
