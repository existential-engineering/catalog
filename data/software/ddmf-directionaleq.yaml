  filter types, 64-bit processing, and 2x oversampling."
details: |-
  Five parametric EQ bands
  Directional stereo field equalization
  64-bit processing
  2x oversampling
  Independent channel/direction control
specs: |-
  - Five parametric EQ bands
  - 64-bit processing
  - 2x oversampling
  - State-of-the-art filter types per band
  - Directional panning control for each band
  - Available in 32-bit and 64-bit formats
  - Mac: OSX 10.7 or higher, Intel and Apple Silicon supported
  - Windows: 32 and 64-bit
  - Linux: ARM and x86_64 (VST3)
  - iOS: AUv3 format
