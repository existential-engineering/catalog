details: |-
  1960s piano is a plugin instrument based on the recording of an early 1960s kawai model 600 studio/semi-grand.

  The sound of this piano is intimate, warm, and lo-fi. It's the perfect piano for your lo-fi beats to study to, indie rock tunes, and lo-fi ambient tracks.

  Original piano recording by sbelmont.
specs: |-
  - VST plugin
  - Audio units plugin
  - VST 3 plugin
  - Multi-sampled instrument
  - 4 velocity layers
  - Multi-lfo
  - Room reverb
  - Lowpass/highpass filter
  - Low-cpu usage
  - Amplitude range controls
  - 3 voice modes: polyphonic, monophonic, and legato
  - Macos and windows compatible
