description: Celestion Speaker Shaper is a speaker emulation plugin, created in
  partnership with Celestion, makers of the world's most famous loudspeakers.
  It's a super creative and versatile speaker cabinet plugin.
details: |-
  Speaker manufacturer Celestion is on the eve of its 100th anniversary. You don't just luck into that kind of longevity. The company, which began in 1924 with the first cone loudspeaker patent, was instrumental in the sound of the British Invasion. It has since become a famed pro audio brand in its own right as the manufacturer of world-renowned guitar and bass speakers.

  Now, these high-quality Celestion speakers are available in an easy-to-use, insanely creative plug-in: Celestion Speaker Shaper. Celestion Speaker Shaper replaces the need for Impulse Response loaders by enabling you to set up two cabinets in parallel and independently adjust specs for, well, just about everything. Tweak your favorite speakers or bring your dream rig to life.

  Phenomenal speaker sounds, optimized workflow, and more flexibility and control than you ever thought possible. In partnership with Celestion, Softube brings you an officially licensed plug-in that eliminates the need for IR loaders for guitar and bass sounds. Scale eleven of Celestion's most famous speakers from 8 inch to 24 inch. Calibrate three channels per speaker and eight microphone options per channel. Then tweak parameters like speaker break-up, ohms, magnet type and strength, open versus closed cabinets, room sounds, 4-band EQ, and more.

  Ever wanted to play an 8x24 inch Celestion Vintage 30 cabinet? Now, you can. Speaker Shaper offers authentic, high-quality Celestion sound with eleven of the British company's most popular guitar and bass speakers: Vintage 30, G12T-75, G12K-100, G12M Greenback, G12M-65 Creamback, G12M Heritage, Classic Lead 80, Celestion Blue, PULSE12, BL10-100X, and BN10-200K. Beyond scaling and aging them to your specs, you can change the speaker magnet material and determine how it will behave. Experiment with Ferrite M and H, AlNiCo, and Neodymium.

  Celestion Speaker Shaper offers a groundbreaking approach to sound shaping. Unlike IR loaders or other speaker plug-ins, it can be used both as a native plug-in and as a module in Amp Room, the pro audio guitar and bass platform. In Amp Room, you can couple it with other plug-ins and modules, such as the Marshall range, or join multiple iterations of the Speaker Shaper module itself. And not just for guitar and bass. Creative use of Speaker Shaper on synths, vocals, and drums can lead to some unexpected and truly wonderful sonic places.
specs: |-
  - A speaker cabinet designer for guitars, bass, synths, and more
  - Created in collaboration with and officially licensed by Celestion
  - Featuring 11 well-known Celestion speaker models for guitar and bass
  - Set a myriad of parameters to your exact specifications
  - Adjust existing setups or create never-before-heard rigs
  - Sculpt speaker sound in an entirely new and modern way
  - Two versions included: Celestion Speaker Shaper native plug-in and Celestion Speaker Shaper for Amp Room
  - Two cabinets set up in parallel with independently adjustable specs
  - Eleven Celestion speaker models: Vintage 30, G12T-75, G12K-100, G12M Greenback, G12M-65 Creamback, G12M Heritage, Classic Lead 80, Celestion Blue, PULSE12, BL10-100X, BN10-200K
  - Speakers scalable from 8 inch to 24 inch
  - Three channels per speaker and eight microphone options per channel
  - Eight classic microphone models: Dyn 57, Dyn 7B, Dyn 421, Dyn 112, Cond 87, Cond C414, Cond 47, Rib 121
  - Up to three mics placeable in front of each speaker
  - Adjustable magnet material: Ferrite M, Ferrite H, AlNiCo, Neodymium
  - Adjustable speaker break-up, ohms, magnet strength, and aging
  - Open versus closed cabinet selection
  - Onboard speaker distortion, 4-band EQ, and room sounds
  - Usable as a native plug-in or as a module in Amp Room
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Softube account required
  - iLok account required (no physical iLok required)
  - Internet access required for downloading installers and managing licenses
  - Three activations
