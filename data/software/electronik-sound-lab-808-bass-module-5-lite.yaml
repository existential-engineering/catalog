details: |-
  808 Bass Module 5 Lite is a powerful 808 bass rompler for Windows & mac. 808
  bass module 5 lite contains 15 ready-to-use and freshly designed layered
  presets, to bring grit and rumble to your productions.

  808 bass module 5 lite is the new demo version without limit of use of our
  most popular and best-selling plugin since we began our journey in creating
  VST instruments. In this new version, we have added new and powerful 808
  basses and also those of the previous version have been improved and included
  as an expansion so you can continue enjoying your favorite 808 basses.

  All sounds are ready to play in the key of your project. The interface is
  user-friendly and straightforward with adsr amplitude envelope, lfo
  modulation, lowpass/highpass filter, cutoff, and global tune.

  New effect modules were added -distortion and chorus, each of which comes with
  typical controls and parameters.

  808 bass module 5 lite is available in VST/vst3/AU plugin formats for windows
  and mac (64-bit)
