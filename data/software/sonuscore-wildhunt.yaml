description: Wildhunt brings two complementary worlds into one cinematic language — the ritual darkness of Savage Ritual Tension and the medieval resonance of Medieval Hunting Percussion. A unified scoring toolkit for trailers, games, and hybrid composition featuring 3,000+ custom rhythms and over 65 GB of sample content.
specs: |-
  - Requires Kontakt 8.7.1 or newer (free Kontakt Player compatible)
  - NKS Ready
  - Total content: ~65 GB (SRT: ~9 GB + MHP: ~56 GB)
  - 232 Kontakt patches total (MHP: 81 + SRT: ~150)
  - 3,000+ custom rhythms
  - 60+ FX chain presets
  - MHP: 56 artist kits + 481 element patches, up to 8 mic positions
  - Unified Wildhunt engine with MAIN / RHYTHM / EFFECTS tabs
  - MIDI drag-out workflow with probability controls
  - User sample import (up to 47 samples)
  - macOS 13, 14, 15 supported; Windows 10 or 11 (latest Service Pack)
  - Minimum: Intel Core i5 or Apple Silicon, 4 GB RAM (6 GB recommended)
