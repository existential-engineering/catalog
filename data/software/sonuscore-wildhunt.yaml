description: WILDHUNT brings two complementary worlds into one cinematic language, the ritual darkness of Savage Ritual Tension and the medieval resonance of Medieval Hunting Percussion.
details: |-
  WILDHUNT is a pair of complementary Kontakt libraries sold as two separate editions and as a bundle: Savage Ritual Tension (SRT), a designed dark and primal tension toolkit, and Medieval Hunting Percussion (MHP), a recorded medieval percussion and tonal instrument collection. Together they span feral percussion and beastly drones through to tonal plucks and multi-mic medieval drums.

  Both libraries are built on the same engine architecture, so patches behave consistently and share one MAIN / RHYTHM / EFFECTS workflow, though each library is opened separately in Kontakt. Rhythms, sequencing approaches and FX chains translate between the two.

  Savage Ritual Tension supplies designed impacts, hits, kicks, drum loops, tonal loops, a signature cello, thumps and heartbeats, drones, signals, wild calls, tonal and hybrid FX and whooshes, with roughly 150 Kontakt instruments, artist kit and element multis and a WAV folder, at a library size of about 9 GB.

  Medieval Hunting Percussion covers tonal instruments (guitar, lute, cello, rebec, bass, saz), drums, percussion, weapons and whooshes, captured through an up-to-8-microphone array. It holds 81 Kontakt instruments with up to 45 articulations and up to 32 round-robins, 56 artist kit multis and 481 element multis, at a library size of about 56 GB.

  The engine carries a multi-lane step sequencer with velocity, pitch, pan, filter and probability lanes plus MIDI export, a reworked Chance (Groove Maker) interface, layer control and ADSR shaping with doubling and tripling modes, up to 7 FX slots with loadable chains, and user import of up to 47 samples. The product is sold by Sonuscore and works with the free Kontakt Player.
specs: |-
  - Requires Native Instruments KONTAKT 8.7.1 or newer; COMPATIBLE WITH FREE KONTAKT PLAYER; NKS Ready
  - macOS 13, 14 or 15 (latest update)
  - Windows 10 or 11 (latest Service Pack)
  - Intel Core i5 or equivalent CPU, or Apple Silicon; 4 GB RAM (6 GB recommended)
  - Sold in three editions: Medieval Hunting Percussion, Savage Ritual Tension, and a Bundle of both
  - Kontakt patches, series total: 232 (MHP 81 + SRT approximately 150)
  - Custom rhythm presets: 3000+
  - FX chain presets: 60+
  - Savage Ritual Tension: approximately 150 Kontakt instruments, artist kit multis, element multis and a WAV folder
  - Savage Ritual Tension library size: approximately 9 GB
  - Medieval Hunting Percussion: 81 Kontakt instruments, 56 artist kit multis, 481 element multis
  - Medieval Hunting Percussion: up to 45 articulations, up to 32 round-robins and up to 8 microphone positions per instrument
  - Medieval Hunting Percussion library size: approximately 56 GB
  - Microphone Menu for control of up to 8 mic positions
  - Main Tab: layer control, ADSR shaping, doubling and tripling modes, delay and drift, playback randomization, ADSR Retrigger Start, Step AHD Random Decay
  - Rhythm Tab: multi-lane step sequencer with velocity, pitch, pan, filter and probability lanes, MIDI export, Chance (Groove Maker), Stretch Mode in Key Sequence, Key Sequence Fast Zoom
  - Effects Tab: up to 7 FX slots with loadable and savable chains
  - User Import: up to 47 samples with editable playback rate and sync, plus Stretch Mode Hold and Retrigger
  - Velocity Range Filtering, Filter Selection with extended models and slopes, and global hotkeys for randomization
  - Both libraries share the same engine structure but are opened separately in Kontakt
