description: Gg audio's blue3 tonewheel organ is back, better, and more
  affordable, with a whole new look from Cherry Audio.
details: |-
  Cherry Audio's blue3 is a meticulously modeled not sampled virtual instrument
  that replicates the most famous tonewheel organs in the world: the b-3, c-3,
  a-100, l-100, CV, and m-3 models. With 31 tonewheel sets accurately capturing
  variations between vintage instruments, 91 modeled tonewheels with phase
  synchronization, and authentically emulated scanner vibrato/chorus, blue3
  delivers the iconic, soulful sounds associated with nearly a century of blues,
  gospel, rock, and jazz classics.

  Cherry audio's blue3 features a new, beautifully designed user interface with
  main, edit, cabinet, and perform sections. And it goes beyond the traditional
  b3 sound by adding three studio-quality stompbox-style effects: tape echo
  delay, reverb with spring, plate, and hall, and a seven-band graphic eq.

  Blue3 offers full polyphony for upper, lower, and pedal manuals, a
  customizable keyboard split function, and handy drawbar utilities including
  copy, swap, reset, and randomize. Tones can be further refined with settings
  for condition, key click, percussion, and multiple overdrive options.

  The cabinet page provides six speaker options and adjustable rotary speed with
  acceleration and deceleration. The microphone simulation includes spread and
  distance controls, four mic selections, and click-and-drag placement in an
  updated ui.

  With MIDI mapping and a rich library of over 200 presets covering classic to
  modern tones, blue3 is the ultimate package for both stage and studio.
specs: |-
  - Painstakingly modeled replication of tonewheel organs with no samples used

  - 31 tonewheel sets based on vintage b-3, c-3, a-100, l-100, CV and m-3
  instruments

  - 91 modeled tonewheels with accurate phase synchronization

  - Full polyphony for upper, lower, and pedal manuals

  - Gorgeously rendered resizable ui with main, edit, cabinet, and perform pages

  - Registration (inverted) keys with a# & b drawbar presets

  - Adjustable condition settings with tonewheel crosstalk, flutter, leakage,
  noise, and transformer settings

  - Selectable foldback for the 16' drawbar

  - Customizable keyboard split function

  - Global three-band output eq

  - Copy, swap, reset, and randomize options for upper and lower drawbars

  - Accurately simulated scanner vibrato/chorus with swell, great, and type and
  depth settings

  - Key click options for volume and tone

  - Percussion for top manual with fine-tuning controls for volume, decay, and
  harmonic selector

  - Drive with four different tube simulations to emulate the preamp and rotary
  enclosure's amplifier

  - Classic 122, 147, ra-200, 4x12 guitar amp, and custom rotary speaker
  simulations

  - Adjustable rotary speeds with acceleration and deceleration

  - Accurate microphone simulation with spread and distance controls, four mic
  selections, and click-and-drag placement

  - Diffuser, front stop, memphis, and wind options for rotary speaker

  - Three studio-quality stompbox-style effects: tape echo delay, reverb with
  spring, plate, and hall

  - Seven-band graphic eq

  - Over 200 presets spanning from classic to modern tones

  - Complete MIDI control and DAW automation for all controls with MIDI learn
  and mapping

  - Focus zoom-in feature, standard ui zoom and resize via drag

  - Highly optimized dsp for optimal performance

  - User-adjustable oversampling quality control

  - AU, VST, vst3, AAX, and standalone formats

  - Windows 7 or above (including windows 11), 64-bit required

  - Macos 10.13 or above, macos 13 ventura supported, 64-bit required

  - Native apple m1 or greater processor support, including ultra

  - 3.4 ghz quad-core computer with 8gb of ram recommended

  - Hard disk space: 182 mb

  - Internet connection required for product activation
