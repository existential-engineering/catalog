details: |-
  Adam Monroe's Theremin is a Windows VST and Mac OS X AU plugin, featuring
  controllable vibrato, portamento, volume reverb, and chorus effects, as well
  as support for multiple sample rates and incremental tuning.

  Adam monroe's theremin by adam monroe music is a virtual instrument audio
  plugin for macos and windows. It functions as a VST plugin, an audio units
  plugin and an AAX plugin.
