name: Auto-Align Post 2
manufacturer: sound-radix
primaryCategory: effect
description: Since its introduction in 2018, auto-align post has helped deliver
  outstanding sounding dialogue in countless award-winning films and tv shows.
details: |-
  By enabling dynamic time-alignment correction of moving location microphones,
  auto-align post makes it possible to effectively mix the boom and lav
  microphones by eliminating comb-filtering and phase artifacts caused by the
  time-of-arrival differences, with just a few clicks.

  Auto-align post 2 takes a significant step further by introducing a new
  spectral phase correction module, refined algorithm, and user interface. It
  brings ara2-vst3 support for compatible DAW's such as nuendo and studioone,
  and more.

  A production sound mixer may often engage a high-pass filter on the boom mic
  to filter out low-frequency noise on-location recording sets. However,
  electronic high-pass filters induce a phase shift to the signal, resulting in
  a significant loss of low-end and 'body' of the dialogue when mixed with a
  non-filtered mic. The new spectral phase correction module detects and
  dynamically corrects frequency-dependent phase shifts to achieve significantly
  improved spectral alignment and richer sound.

  Auto-align post 2 is a virtual effect audio plugin for macos and windows. It
  functions as an audio units plugin, a VST 3 plugin and an AAX plugin.
specs: |-
  - Time and phase alignment
  - Ara2 compatibility
  - Spectral phase correction module
  - Spectral correlation meter
  - Dynamic mode
  - Static mode
  - Multi-channel support
  - Microphone time-alignment up to 100ms
  - Distance alignment up to ~112 feet / ~34 meters
  - Intel core 2 duo CPU or greater
  - 4 GB RAM or higher
  - Windows 7 or higher
  - macOS 10.8 or higher
  - Ilok license manager 5.4 or newer
  - Apple silicon supported under rosetta2
  - Universal 2 binary
  - 28-bands frequency phase correlation view
