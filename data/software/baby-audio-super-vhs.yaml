details: |-
  Super VHS is a multi-effect plugin by Baby Audio featuring six one-knob effects inspired by a 1980s lo-fi aesthetic. It delivers warm tape saturation, subtle pitch drift, sample-rate reduction and more, providing the fastest way to add an authentic retro sound to sterile tracks.

  The plugin includes six distinct effects: Static generates VHS noise via an internal synthesizer, Heat provides tape saturation inspired by consumer-grade machines, Shape is a sample rate reducer inspired by 1980s 8-bit samplers, Magic delivers an ensemble effect inspired by the Juno chorus but darker and deeper, Drift adds pitch fluctuation via an LFO, and Wash offers a bad hall reverb inspired by low budget 1980s rack units.

  Each effect has just a single knob but controls multiple parameters under the hood, allowing for a quick workflow and unpredictable results.
specs: |-
  - Static: VHS noise generated by internal synthesizer
  - Heat: Tape saturator inspired by consumer-grade machines
  - Shape: Sample rate reducer inspired by 1980s 8-bit samplers
  - Magic: Ensemble FX inspired by the Juno chorus
  - Drift: Pitch fluctuation LFO for time and pitch shifting
  - Wash: Bad hall reverb inspired by low budget 1980s rack units
  - Each knob controls multiple parameters under the hood
  - Native Apple Silicon M-Chip support
  - 64-bit only
