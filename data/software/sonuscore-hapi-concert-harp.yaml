description: ha•pi is a divinely inspired concert harp with shimmering tones and enigmatic ambiances. Simple strums of ha•pi's strings can turn into mysterious, ethereal soundscapes using the Glow slider.
details: |-
  HA-PI is a sampled concert harp built around emotional delicacy, with shimmering tones and enigmatic ambiances. Simple strums of its strings turn into mysterious, ethereal soundscapes through the Glow slider, which is the instrument's main atmospheric control.

  The harp was recorded with 5 round robins and two articulations, Naturals and Harmonics, which can be mixed against each other. Knobs cover attack, release and dynamic range alongside tone, ambience and the articulation mix, all laid out on a streamlined single-panel interface.

  Eleven color presets are supplied as starting points, selectable directly from the interface. The library is 1.4 GB in size and runs in the full version of Native Instruments Kontakt. HA-PI is the classical concert harp in the Sonuscore Glow and Solo series, the larger counterpart to the compact Celtic Celestial Harp.
specs: |-
  - 2 recorded articulations: Natural and Harmonics
  - Up to 4 velocity layers
  - 5 round robins
  - Glow slider for atmospheric soundscapes
  - Attack, Release, Dynamic Range, Harmonics, Tone and Ambience controls
  - 11 color presets
  - Lightweight, streamlined interface
  - 1.4 GB sample library
  - Requires the FULL version of Native Instruments KONTAKT 5.8.1 or higher (the free KONTAKT PLAYER only runs the instrument in demo mode)
  - Mac OS X 10.8 or higher, Intel Core 2 Duo
  - Windows 7 or higher, Intel Core 2 Duo or AMD Athlon 64 X2
  - 4 GB RAM
  - At least 1.34 GB of free hard disk space
  - Available as a download only
