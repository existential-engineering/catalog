description: A virtual instrument sample library based on the Yamaha
  SY-99/TG-77, recreating its factory presets, waveforms, and reverbs inside
  Pure Synth Platinum.
details: |-
  The absolute closest thing you will get to the sound of the SY99. We samples all of the waveforms, including the drum kits and also sampled all of the factory presets. You will be able to create many of your AWM based presets and have an absolute joy reliving all of the factory presets as well. The TGX-99 is a Yamaha SY-99/TG-77 virtual instrument sample library based off of the Pure Synth Platinum platform. In keeping with the amazing structure of as PSP, we have included ALL of the raw sample waveforms from the actual hardware. You get 4-oscillators in which to combine your waveforms as well as two filters, and two LFOs per oscillator. The arp and gate can be global or per oscillator as well as globalnd per oscillator effects, depending on the template you choose. In many ways the TGX-99 rivals that of the actual hardware, because of the added modulation sources, the number and quality of effects as well as greater polyphony. The goal of the TGX-99 is to virtually put the feeling of the actual hardware right into your hands. Since the SY99 contained one of the most sophisticated and advanced FM engines (AFM and RCM) of any of the Yamaha keyboards, we could not replicate this. In fact no one really can. So in order to compensate, we have included a re-creation of the the original 128 factory presets from the actual hardware by using sampling, synthesis, and sophisticated UVI scripting techniques. We were even able to model the actual reverbs of the unit in order to provide the most realistic experience possible to owning the hardware.
