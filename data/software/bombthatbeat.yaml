description: Supports 8, 16 & 24 bit samples. Split a sample into up to 16
  parts, adjust the start points of the 16 parts, and re-arrange them into 32
  patterns.
details: |-
  The plugin allows users to split a sample into up to 16 parts and adjust the
  start points of each part. Users can re-arrange the 16 parts into 32 patterns
  and play the patterns in real time while editing the tune, volume & play
  direction of each step in a pattern.

  The patterns will always fit to the tempo settings with the smallest beat
  resolution available at 32nd. Users can scratch the patterns during playback.

  The plugin supports 8, 16 & 24 bit samples for processing and manipulation.
specs: |-
  - 8, 16 & 24 bit samples
  - Split a sample into up to 16 parts
  - 32 patterns
  - 32nd beat resolution
  - Real time playback and editing
  - Windows compatible
