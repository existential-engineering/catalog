description: Our flagship AI driven vocal, drum, bass, guitar, piano and strings
  isolation software lets you separate stems with HQ results
details: |-
  DeMIX Pro is standalone software that combines cutting-edge AI sound isolation
  algorithms, enabling audio engineers, remixers, producers, DJs, and musicians
  to create isolated stems from existing audio mixes. It supports separation of
  vocals (all vocals, lead vocal, backing vocals), drums, bass, guitar, piano,
  and strings.

  Version 6 introduces instant playback of separated tracks in real-time and
  interleaved separation for fast processing of multiple stems simultaneously.
  The software leverages GPU and Apple Silicon acceleration for improved
  performance.

  The workflow supports batch separation of multiple instruments from multiple
  clips, unlimited non-destructive separations, and track merging. A built-in
  multi-channel mixer allows remixing directly within the application.

  DeMIX Pro supports audio up to 24-bit 192kHz resolution. It requires iLok
  License Manager for authorization and runs on macOS 12.7+ (Intel and Apple
  Silicon) and Windows 10+.

  Pricing options include a monthly subscription at $24.99, yearly subscription
  at $249.99, or a perpetual license for $549.00. A 7-day free trial is also
  available.
specs: |-
  - AI-powered vocal separation (all vocals, lead vocal, backing vocals)
  - Drum, bass, guitar, piano, and strings separators
  - Real-time instant playback of separated tracks
  - Interleaved separation for simultaneous multi-stem processing
  - GPU and Apple Silicon acceleration
  - Batch separation of multiple instruments from multiple clips
  - Unlimited non-destructive separations and track merging
  - Built-in multi-channel mixer
  - Supports up to 24-bit 192kHz audio
  - macOS 12.7+ (Intel and Apple Silicon), Windows 10+
  - Minimum 4GB RAM (8GB recommended), Core Duo 3GHz CPU
  - Optional NVIDIA GTX 1070 GPU or better
  - Requires iLok License Manager
