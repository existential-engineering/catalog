description: Our flagship AI driven vocal, drum, bass, guitar, piano and strings isolation software lets you separate stems with HQ results.
details: |-
  Manipulate audio mixes like never before. DeMIX Pro is standalone software that combines cutting-edge AI sound isolation algorithms to give audio and mastering engineers, remixers, producers, DJs, and musicians unrivaled freedom to create isolated vocals, drums, bass, electric guitar, piano, strings and other instruments from existing mixes.

  Ideal for high-quality vocal removal, instrumental creation, and production quality sampling. DeMIX Pro delivers unmatched flexibility with unlimited, non-destructive, track separations, convenient merge tracks functions, a built-in multichannel mixer, and the ability to batch process multiple files at once.

  Create countless high-quality individual track separations for remixing, up-mixing, re-mastering, and post-production applications.

  DeMIX Pro Version 6.0 contains a range of improvements and new functionality and is available as a discounted upgrade for existing paid users: instant playback of separated tracks in real-time as they're being processed, interleaved separation for faster processing by handling multiple stems simultaneously, GPU/Apple Silicon acceleration, and new separation models for clearer vocals, drums, bass, guitar, and strings.
specs: |-
  - All Vocal, Lead Vocal, Backing Vocals, Drum, Bass, Guitar, Piano and Strings separators
  - Batch separation of multiple instruments from multiple clips
  - Separate, refine, mix and merge unlimited tracks
  - Multi-channel mixer for quick and easy remixing
  - Non-destructive separations and editing
  - Supports up to 24-bit 192kHz audio
  - Mac OS 12.7 and up
  - Windows 10 and up
  - Minimum RAM requirements 4 GB (recommended 8 GB)
  - Minimum CPU requirements Core Duo 3GHz
  - Recommended NVIDIA GTX 1070 GPU or better but not necessary
  - Compatible with Intel Macs but Apple Silicon processor recommended for faster separations
  - iLok License Manager must be installed before the software will run
versions:
