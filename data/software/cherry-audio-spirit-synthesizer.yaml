details: |-
  Crumar Spirit by Cherry Audio is a meticulously crafted virtual recreation
  that captures the unique and captivating features of the exceptional analog
  monosynth from 1983, originally designed by some of the most legendary figures
  in the synth industry including Robert A. Moog, Tom Rhea, and Jim Scott.

  Spirit is a gateway to sonic experimentation, whether you are after wild,
  unpredictable timbres or warm, analog tones. It is not a polite instrument.
  Twist a few knobs and it will reward you with some of the most colorful sounds
  you have ever heard from a virtual analog software synthesizer.

  Cherry Audio's reenvisioning of the Spirit synthesizer includes all the
  innovations and deep sound capabilities of the original hardware while
  enhancing it with modern design elements. Features include monophonic, unison,
  and up to 16-voice polyphonic modes, a dedicated upper low pass filter and
  multimode lower filter, and the innovative Matrix Z four-slot mod matrix with
  25 sources and 45 destinations.

  Crumar Spirit includes over 430 sensational presets in 12 categories, a
  dynamic arpeggiator with three modes, two independent chains of studio-quality
  integrated effects, and multiple Mod X and Shaper Y modulation sources and
  destinations for deep sound design possibilities.
specs: |-
  - Based on original designs by Robert A. Moog, Tom Rhea, and Jim Scott
  - Monophonic, unison, polyphonic (4, 8, or 16 voices), and cycle voice modes
  - Multi voice modes with per-note variation and mini synth panels
  - Two oscillators with master tune, octave, waveshape, and oscillator sync
  - Oscillator B with fixed frequency modes in Bass and Wide ranges
  - Dedicated upper low pass filter and multimode lower filter
  - Two ADSR envelopes with velocity for filter and amp
  - Mod X modulation with six sources and five destinations
  - Shaper Y with four modes and five destinations
  - Matrix Z four-slot mod matrix with 25 sources and 45 destinations
  - Dynamic arpeggiator with Ripple, Arp, and Leap modes
  - Swing, Chance, and Feel groove controls
  - Two independent chains of studio-quality integrated effects
  - Over 430 professionally designed presets in 12 categories
  - User-adjustable oversampling control
  - Complete MIDI control and DAW automation
