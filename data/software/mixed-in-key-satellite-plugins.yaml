description: A real-time music collaboration plugin that enables musicians using different DAWs to work together simultaneously over the internet, with cross-DAW BPM, time signature, and sample rate sync, MIDI sharing, audio stem downloads, and session backup.
details: |-
  Satellite Sessions enables real-time cross-DAW collaboration over the internet. Musicians using different DAWs — Ableton Live, Logic Pro X, FL Studio, Cubase, Studio One, Pro Tools — can work together simultaneously.

  Features cross-DAW BPM, time signature, and sample rate sync. MIDI data is shared between collaborators in real time. Audio stems can be downloaded within sessions without needing to bounce or use file sharing services.

  Session backup functionality preserves work automatically. Guest collaborators get unlimited, free access — only the session host requires a paid license. Version 2.0 is the current release.
