description: Satellite is a VST plugin for Collaboration inside your DAW. It
  works with Ableton Live, Apple Logic, FL Studio, Pro Tools and more.
details: |-
  Satellite Plugins is a cross-platform collaboration plugin for Ableton Live, Logic, FL Studio, Pro Tools and other DAWs. It lets collaborators exchange ideas from inside their own DAW without bouncing stems or dealing with file sharing websites.

  Satellite Plugins stays in sync with BPM, time signature and even sample rate regardless of DAW and operating system. One collaborator can be on Ableton Live on Windows, another on Pro Tools on Mac and a third on FL Studio on Windows, working from three different locations, and all three DAWs stay connected.

  Sessions bridge the connected DAWs so everyone can record music to the same session, and guests can join a session for free. Collaborators download the audio directly from the session rather than sending large stem files back and forth.

  Satellite MIDI shares MIDI data with collaborators. Anyone can download it into the session, edit it and share it again, or use it to trigger new instruments.

  Sessions also serve as a project backup: a session can be edited on one machine and resumed from another.
specs: |-
  - Cross-platform collaboration inside the DAW, over the internet
  - Stays in sync with BPM, time signature and sample rate across DAWs and operating systems
  - Connects different DAWs and operating systems in the same session
  - Unlimited guests, who can join a session for free
  - Audio stem sharing without bouncing or third-party file sharing
  - Satellite MIDI for sharing, downloading, editing and re-sharing MIDI data
  - Session-based project backup for resuming work on another machine
  - Windows package includes the Satellite Sessions Plugin, Audio Capture Plugin and MIDI Capture Plugin as VST
  - Mac package includes the Satellite Sessions Plugin, Audio Capture Plugin and MIDI Capture Plugin as AU, VST and AAX
  - Operating system: Windows 10, 11
  - Operating system: macOS 10.15 and newer
  - Windows DAW compatibility: Ableton Live 10/11, FL Studio, Cubase, Studio One, Reason, Reaper, Bitwig
  - Mac DAW compatibility: Ableton Live 10/11, Logic Pro, Pro Tools, Cubase, FL Studio, Studio One, Reason, Reaper, GarageBand, Bitwig, Digital Performer
