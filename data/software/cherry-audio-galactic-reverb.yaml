details: |-
  Galactic Reverb is an algorithmic reverb plugin that captures the
  expansive sound of coveted classic hardware digital reverbs. With a
  decay time up to 35 seconds, it enables users to create massive,
  beautiful aural spaces.

  Based on a reverb algorithm featured in Cherry Audio's smash hit
  Dreamsynth virtual instrument, the Galactic plugin adds modulation
  controls, predelay, and an equalizer.

  Galactic includes a ducking function for automatically reducing reverb
  levels while a singer or an instrument is playing to improve mix
  clarity, no sidechain required.

  Galactic is intuitive to use and produces musical results at lightspeed.
  Like all Cherry Audio plugins, Galactic includes a convenient preset
  browser loaded with over 50 ethereal presets.
specs: |-
  - Authentically modeled classic reverb algorithm
  - Modulation from 0.10 Hz to 5.00 kHz
  - Damping control
  - Predelay from 0 ms to 500 ms
  - Decay from 0 ms to 35,000 ms
  - Ducking with attenuation and recovery time controls
  - Equalizer with low and high frequency controls
  - Usable as insert or bus effect
  - Mono and stereo compatible
  - 50+ presets
  - Full MIDI control and DAW automation
  - User-selectable themes
