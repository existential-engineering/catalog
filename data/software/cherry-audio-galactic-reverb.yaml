details: |-
  Galactic Reverb is an algorithmic reverb plugin that captures the expansive sound of coveted classic hardware digital reverbs. With a decay time up to 35 seconds, it enables users to create massive, beautiful aural spaces. Galactic is a natural for transporting guitars, drums, keys, and even vocals into an extraterrestrial ambience.

  Based on a reverb algorithm featured in Cherry Audio's Dreamsynth virtual instrument, the Galactic plugin adds modulation controls, predelay, and an equalizer. It also includes a ducking function for automatically reducing reverb levels while a singer or an instrument is playing to improve mix clarity, with no sidechain required. Ducking can also be used to alternate between very dry and immense reverb tails.

  Galactic includes a preset browser loaded with over 50 presets. It can be used as an insert or bus effect, and is fully compatible with mono or stereo sources.

  Galactic Reverb is available in AU, VST, VST3, AAX, and stand-alone formats. A free 30-day demo is available, which plays white noise periodically but is otherwise unlimited. An internet connection is required for product activation.

  macOS requirements: 10.13 or above, macOS 13 Ventura supported, 64-bit required, native Apple M1 or greater processor support including Ultra. A 3.4 GHz quad-core or M1 CPU with 8GB of RAM is recommended. Windows requirements: Windows 7 or above (including Windows 11), 64-bit required, quad-core computer with 8GB of RAM recommended.
specs: |-
  - Authentically modeled classic reverb
  - Modulation from 0.10 Hz to 5.00 kHz
  - Damping control for reverb
  - Predelay from 0 ms to 500 ms
  - Decay from 0 ms to 35,000 ms
  - Ducking with attenuation and recovery time controls
  - Equalizer with low and high frequency controls
  - Use as an insert or bus effect
  - Compatible with mono or stereo input sources
  - Preset browser with over 50 presets for Drums, Ducking, Guitars, Keys, and Vocals, favoriting, and user presets
  - Full MIDI control and DAW automation for all controls
  - Preset and Global level MIDI mapping
  - User-selectable themes
