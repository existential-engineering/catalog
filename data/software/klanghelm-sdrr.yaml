description: SDRR - Saturation Chameleon is a versatile saturation plugin offering four distinct modes (TUBE, DIGI, FUZZ, DESK) that reacts dynamically to the input signal, capable of functioning as a saturation, compressor, EQ, bit-crusher, subtle stereo widener, or movement generator.
details: |-
  SDRR was built to satisfy almost all saturation desires. It provides a comprehensive set of controls to manipulate the character of the saturation to make it fit exactly. SDRR offers four different main modes — TUBE, DIGI, FUZZ, and DESK — and reacts dynamically to the input signal. Each mode has its unique crosstalk behavior, which can be switched off or exaggerated.

  The TUBE mode consists of two different models of a two-stage tube preamplifier. These two models can be blended with the CHARACTER control. WARM focuses more on the transient smoothing and compressing character associated with tubes, while SIZZLE captures the harmonics generated when driving transients hard.

  The DIGI mode is designed to precisely add even and/or odd harmonics to program material. Two blendable models are included, with the first generating only the first 4 harmonics. A BIT→RATE control enables bit crushing and sample rate reduction effects, and combined with the DRIFT parameter it can produce dramatic results.

  The FUZZ mode consists of two different models of classic germanium fuzz stomp boxes, both heavily modified for lower distortion levels suited even for mastering duties. It takes advantage of the unique properties of germanium transistors to deliver a warm, cosy sound.

  The DESK mode is Klanghelm's version of a flexible mixing desk channel strip plugin with a sophisticated 2-band EQ with specially designed curves to fit most material, plus control over the transient response of the saturation and the compression. The DESK mode aims to be the only plugin needed for a well-recorded track to shine.
specs: |-
  - Four saturation modes: TUBE, DIGI, FUZZ, DESK
  - TUBE mode: two blendable tube preamplifier models (WARM and SIZZLE)
  - DIGI mode: precise even/odd harmonic generation with BIT→RATE bit-crushing/sample rate reduction
  - FUZZ mode: two blendable modified germanium transistor fuzz models
  - DESK mode: 2-band EQ with transient and compression control
  - Per-mode switchable and exaggeratable crosstalk behavior
  - DRIFT control for adding movement to tracks
  - RMS level difference metering for easy level matching
  - Dynamic response to input signal
