description: SDRR is a saturation plugin offering four main modes (TUBE, DIGI, FUZZ and DESK) that react dynamically to the input signal. It can act as a saturation, a compressor, an EQ, a bit-crusher or a subtle stereo widener.
details: |-
  SDRR was built to satisfy almost all of your saturation desires. It provides a comprehensive set of controls to manipulate the character of the saturation to make it fit exactly. SDRR offers four different main modes: TUBE, DIGI, FUZZ, DESK and reacts dynamically to the input signal. Each mode has its unique crosstalk behavior, which can be switched off or exaggerated. A unique RMS level difference metering mode makes level matching an easy task. SDRR can be different things: a saturation, a compressor, an EQ, a bit-crusher, a subtle stereo widener, or simply add some movement to your tracks with the DRIFT control.

  The TUBE mode consists of two different models of a two stage tube preamplifier. These two models can be blended into each other with the CHARACTER control. WARM focusses more on the transient smoothing and compressing character associated with tubes, while SIZZLE captures the harmonics generated when driving transients much.

  The DIGI mode is designed to precisely add even and/or odd harmonics to program material, giving a very controlled sound. Again two models were created, which can be blended, the first one only generating the first 4 harmonics. DIGI is great for adding harmonics and excitement to your tracks without coloring the signal too much. Use the BIT->RATE control for bit crushing and sample rate reduction effects, which combined with the DRIFT parameter can get pretty wild.

  The FUZZ mode consists of two different models of classic germanium fuzz stomp boxes. Both are heavily modified for lower distortion levels to be suited even for mastering duties. The FUZZ mode takes advantage of the unique properties of germanium transistors and delivers a very warm, cosy sound.

  The DESK mode is Klanghelm's version of a flexible mixing desk channel strip plugin with just a few controls. It features a sophisticated 2 band EQ with specially designed curves to fit most material, and offers control over the transient response of the saturation and the compression. The aim of the DESK mode is to be the only plugin needed for an at least OK recorded track to shine, all with very few controls.
specs: |-
  - Four main saturation modes: TUBE, DIGI, FUZZ and DESK
  - Two blendable models per mode, mixed with the CHARACTER control
  - TUBE mode: two stage tube preamplifier models with WARM and SIZZLE characters
  - DIGI mode: precise even and/or odd harmonic generation, with BIT->RATE bit crushing and sample rate reduction
  - FUZZ mode: two germanium fuzz stomp box models modified for lower distortion levels
  - DESK mode: mixing desk channel strip with a 2 band EQ plus transient and compression control
  - Dynamic response to the input signal
  - Per-mode crosstalk behavior that can be switched off or exaggerated
  - DRIFT control for added movement
  - RMS level difference metering mode for level matching
  - GUI resizing, AGC, preset browser and HQ options (added in version 2)
  - Windows 10 or higher (64bit): VST, VST3, AAX Native
  - macOS 10.13 or higher: AU, VST, VST3, AAX Native
