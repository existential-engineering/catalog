description: "Saturation chameleon plugin with four distinct saturation modes:
  TUBE (two-stage tube preamplifier models), DIGI (precise even/odd harmonics
  with bit-crushing and sample rate reduction), FUZZ (classic germanium fuzz
  stomp box models), and DESK (flexible mixing desk channel strip with EQ,
  transient control, and compression). Features dynamic signal response, stereo
  crosstalk modeling, and DRIFT control for track movement."
details: |-
  Four saturation modes: TUBE, DIGI, FUZZ, DESK
  TUBE: Two blendable tube preamplifier models (WARM and SIZZLE)
  DIGI: Precise even/odd harmonics with bit-crushing and sample rate reduction
  FUZZ: Two classic germanium fuzz stomp box models
  DESK: Flexible mixing desk channel strip with 2-band EQ, transient control, compression
  Unique switchable/exaggeratable crosstalk behavior
  RMS level difference metering for level matching
  DRIFT control for track movement
  Dynamic signal response
