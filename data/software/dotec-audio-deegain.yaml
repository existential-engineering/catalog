description: Free gain/trim control plugin that works like the gain/trim control
  of a mixer console. Offers volume adjustment ranging from -20dB to +20dB,
  designed to be inserted between other effect plugins.
details:
  - DeeGain is a gain/trim control plug-in that adjusts channel volume across a
    -20dB to +20dB range. It is designed to work like the gain or trim knob on a
    mixer console, and is intended for insertion between other effect plug-ins
    in a DAW channel strip to provide fine-level control at any point in the
    signal chain.
  - The plug-in is free to download and use. On macOS it runs as VST2, VST3, AU,
    and AAX (64-bit, macOS 10.12 or later). On Windows it runs as VST2, VST3,
    and AAX (64-bit). It has been tested with more than fifteen DAW hosts
    including Ableton Live, Cubase, Logic Pro X, Pro Tools, Studio One, and FL
    Studio.
  - DeeGain has been continuously updated since its initial release in December
    2015. Early updates focused on bug fixes and screen rendering performance.
    Later updates added Apple Silicon support for both VST/AU (January 2021) and
    AAX (June 2022), as well as stability improvements and a notification
    function (September 2024).
  - The plug-in is developed and distributed by DOTEC-AUDIO in collaboration
    with cyber rock.LLC and fmfmsoft Corp. Sound design is by Franck Shigetora,
    with UI design by IZMOJUKI and FUKUDAKOGYO.
specs: |-
  - Volume control range: -20dB to +20dB
  - Designed for use as a gain/trim insert between effect plug-ins
  - 64-bit only
  - macOS 10.12 (Sierra) or later
  - Formats: VST2, VST3, AU (macOS), AAX
  - Apple Silicon native support (VST/VST3/AU since v1.1.3; AAX since v1.1.4)
