description: PSP 85 is a variable sample rate delay plugin featuring extremely fine-tuned algorithm optimizations with capabilities for creating complex rhythmic patterns and sonic effects.
details: |-
  PSP 85 is a variable sample rate delay line plugin with real-time multipoint resamplers and five click-free LFO waveforms. Features predelay for complex rhythmic patterns, delay line output panning, delay gating with extended echo control, automatic ducking with sidechain option, filter resonance modulation, LFO song position sync, 12dB/oct filter with saturation, and a vintage reverb module.

  Supports MIDI/VST automation. 64-bit audio stream support (VST only). Supports up to 192kHz sampling rates.
