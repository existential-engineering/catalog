description: PSP 85 is the product of PSP's eternal fascination with the endless possibilities offered by variable sample rate delay lines. It benefits from extremely fine-tuned algorithm optimizations and adds numerous and significant new features.
details: |-
  PSP 85 is the product of PSP's eternal fascination with the endless possibilities offered by variable sample rate delay lines. PSP 85 benefits from extremely fine-tuned algorithm optimizations and adds numerous and significant new features. The plug-in comes with sixty wild and twisted new presets, each designed to highlight its exciting new attributes and sonic possibilities.

  Continuous control over delay time is achieved with minimal harmonic distortion thanks to real-time multipoint resamplers, and a modulation signal generator consisting of an LFO with five click-free waveforms and a precise envelope follower drives movement across the delay lines. LFO song position synchronization keeps modulation repeatable from playback to playback, and edge-filtering of abrupt parameter changes keeps operation smooth and click-free.

  A 12dB/oct filter with adjustable cutoff and resonance as well as saturation controls sits in the feedback path, with flexible filter routing capabilities and filter resonance modulation. A vintage reverberation module provides a faithful simulation of spring and plate reverbs.

  Predelay allows complex rhythmic patterns to be built, delay gating offers extended control over the number of echoes and their level, and automatic ducking, with an auxiliary sidechain input option, preserves sound clarity by attenuating superfluous echoes that would otherwise have been masked by the input signal. Delay line output panning and input muting, which lets the delay lines be connected in series on mono tracks, complete the routing options.

  The plug-in supports sampling rates of up to 192kHz, a 64 bit audio stream (VST format only), and MIDI and VST automation of all parameters.
specs: |-
  - Predelay for creating complex rhythmic patterns
  - Delay line output panning
  - Delay gating offering extended control over the number of echoes and their level
  - Automatic ducking with auxiliary sidechain input option, attenuating superfluous echoes masked by the input signal
  - Filter resonance modulation
  - LFO song position synchronization for repeatable playback results
  - Input muting allowing the delay lines to be connected in series when used on mono tracks
  - 64 bit audio stream support (only refers to VST format)
  - Continuous control over delay time with minimal harmonic distortion thanks to real-time multipoint resamplers
  - Modulation signal generator consisting of an LFO with five click-free waveforms and a precise envelope follower
  - 12dB/oct filter with adjustable cutoff and resonance as well as saturation controls
  - Flexible filter routing capabilities
  - Vintage reverberation module for faithful simulation of spring and plate reverbs
  - Edge-filtering of abrupt parameter changes for smooth and click-free operation
  - Support for sampling rates of up to 192kHz
  - MIDI and VST automation of all parameters
  - Sixty presets
  - Windows x32 or x64 (XP Service Pack 2, Vista, 7 or 10) for VST, RTAS and AAX
  - Mac OS X 10.5 or later for AudioUnit, VST and RTAS
  - Mac OS X 10.8 or later with Pro Tools 11 or later for AAX
  - VST 2.4 compatible host, 32 or 64-bit
  - RTAS requires Pro Tools LE 8.0.0 or Pro Tools TDM 8.0.0 or later
  - AAX requires Pro Tools 10 or 11 or later
