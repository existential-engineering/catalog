  Predelay for rhythmic pattern creation. Delay line output panning. Delay gating with echo control. Automatic ducking with sidechain option. LFO with song position synchronization. 12dB/oct filter with adjustable cutoff/resonance. Vintage reverberation module. Supports up to 192kHz sampling rates. MIDI and VST automation support. 64-bit audio stream support.
