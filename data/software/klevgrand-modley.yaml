details: |-
  Modley is a modulation delay with effect insert capabilities, which lets you design the whole delay signal with several carefully selected effect modules to create unique signal flows. The idea behind Modley is to push the boundaries of what a delay effect is capable of, only your imagination sets the limits. While Modley sure can be used to do all the traditional tricks (stereo delay, tape delay, short slapback delay etc.), its true potential lies within the variety of unexpected effect modules that can be applied.

  The signal path is built from three racks. The first row is the Pre rack, where all inserted effects process the incoming audio before it enters the Loop rack. In the Loop rack the inserted effects process the audio from left to right, and if the feedback control is set to anything above 0, that amount of the loop output is re-routed back to the loop input. The Post rack works the same way as the Pre rack but sits after the loop rack in the chain.

  Fifteen different effect modules are available, including panning modulation, phaser, distortion, tape saturation, pitch shifter, delay, reverb and more. Version 1.1 added a bitcrusher insert effect, a stereo width control insert called Stereoid, a new feedback mode that controls the behaviour of loop insert effects, a bandpass type for the filter insert and a range knob for the pitch insert.

  Other features include time sync, global modulation of the delay, a built-in limiter, a freeze function with pre- or post-loop processing, a dry/wet mix control and a library of presets to kickstart the creative flow.

  Modley requires macOS 10.10 or later (optimized for the M1 processor) or Windows 7 (SP1) or later, running an AU, VST or AAX compatible 64-bit host. An iPad version is available in AUv3 format.
specs: |-
  - 15 different effect modules: panning modulation, phaser, distortion, tape saturation, pitch shifter, delay, reverb and much more
  - Time sync
  - Global modulation of the delay
  - Built-in limiter
  - Freeze function, with pre- or post-loop processing
  - Lots of presets to kickstart the creative flow
  - Dry/wet mix
  - Pre, Loop and Post effect insert racks with feedback control
  - Requires macOS 10.10 or later (optimized for the M1 processor), Windows 7 (SP1) or later, running an AU, VST or AAX compatible 64-bit host
