description: Crossfade Loop Synth is a simple sample playback synth plug-in from
  Expert Sleepers that loops samples with an adjustable crossfade at the loop
  endpoints. From version 3 it ships as two plug-ins, the synth and an effect
  version that records live audio for use as a live sampler, looper and delay.
details: |-
  From version 3, Crossfade Loop Synth is actually two plug-ins: Crossfade Loop Synth and Crossfade Loop Synth Effect. The effect version takes the power of Crossfade Loop Synth and turns it into a live sampler, a looper and a very unusual and powerful delay effect. Version 3 is a major upgrade from version 2, adding many powerful means of shaping the sound while keeping the simplicity and CPU efficiency that made version 2 so popular.

  Crossfade Loop Synth is at heart a simple sample playback synth plug-in. It plays samples in the classic sampler manner, by simply altering the playback speed according to the desired note. No fancy timestretching or pitchshifting is applied.

  How the sample is looped as it is played can be controlled, and an adjustable amount of crossfade can be applied to the loop endpoints to smooth the transitions, which makes it extremely easy to produce glitch-free pad sounds. The loops can also be played backwards and alternately forwards and backwards (pendulum-style).

  Further sound processing can be applied in the form of overdrive and saturation, filtering, envelopes (for amplitude and filter), pulse-width modulation, oscillator sync and LFOs (one each for filter, pitch, PWM and sync). The synth is 32 note polyphonic, and all parameters can be controlled by MIDI controllers.

  Crossfade Loop Synth Effect is the same as Crossfade Loop Synth except that live audio can be recorded to use as the sample, rather than only loaded from disk. Recording can run continuously, even while playing back, which allows the plug-in to work as an extremely unusual and creative delay effect, with delays played back at double the pitch and speed, backwards, as a chord, or repeating the first beat of every bar. The recorded sample can be saved to disk as an AIFF or WAV file for later use.
specs: |-
  - 64 bit AU, AAX and VST formats
  - macOS and Windows
  - Two plug-ins from version 3: Crossfade Loop Synth and Crossfade Loop Synth Effect
  - 32 note polyphonic
  - Sample playback by playback speed, no timestretching or pitchshifting
  - Adjustable loop crossfade, reverse and pendulum loop playback
  - Overdrive and saturation, filter, amplitude and filter envelopes, pulse-width modulation, oscillator sync
  - Four LFOs, one each for filter, pitch, PWM and sync
  - All parameters controllable by MIDI controllers
  - Effect version records live audio and exports the sample as AIFF or WAV
  - iLok account activation, physical iLok not required
