details: |-
  From recording song ideas to full-fledged mobile productions, audio evolution
  mobile sets the standard for music creation, mixing and editing on Android.
  Whether you are recording using the internal mic or recording from a
  multi-channel USB audio or MIDI interface, audio evolution mobile rivals
  desktop DAWs.

  Featuring virtual instruments, a vocal pitch and time editor, virtual analog
  synthesizer, real-time effects, mixer automation, audio loops, drum pattern
  editing and more, the app powers your creativity.

  Audio evolution mobile studio was chosen the #1 android mobile music app in
  computer music - december 2020 issue.

  In short: a complete portable multitrack digital audio workstation (DAW) that
  will replace your 4 track recorder or tape machine at an incredibly low price.

  A custom developed USB audio driver that bypasses the limits of android audio
  when connecting a USB audio interface/mic: low latency, high quality
  multi-channel recording and playback at any sample rate and resolution that
  the device supports (for example 24-bit/96khz).
specs: |-
  - Multitrack audio and MIDI recording/playback

  - Vocal tune studio with pitch and time correction

  - Retune time, retune amount, volume and formant correction per note

  - Vibrato controls

  - Virtual analog synthesizer 'evolution one'

  - Sample-based soundfont instruments

  - Drum pattern editor with triplets and custom audio files

  - Low latency and multichannel recording/playback via USB audio interface

  - Unlimited undo/redo for audio and MIDI clips

  - Tempo and time signature changes including gradual tempo change

  - Real-time effects: chorus, compressor, delays, eqs, reverb, noise gate,
  pitch shifter, vocal tune

  - Flexible effect routing with unlimited effects on grid and parallel effect
  paths

  - Lfo assignment to effect parameters

  - Parameter locking to tempo

  - Sidechain on compressor effects

  - Automation of all mixer and effect parameters

  - Import formats: wav, mp3, aiff, flac, ogg, MIDI

  - Mastering/mixdown to wav, mp3, aiff, flac, ogg with share option

  - Unlimited number of tracks and groups

  - Normalize, auto split, and time stretch audio

  - Punch in/out

  - MIDI remote control

  - Projects interchangeable with ios version

  - Export to other daws by rendering tracks to separate audio files (stems)

  - Cloud sync to google drive

  - Custom USB audio driver: 24-bit/96khz support

  - Android platform
