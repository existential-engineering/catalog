details: |-
  Admiralizor combines two synchronizable wavetable, sub and sample hold/track noise synthesizers with the flexibility and brilliance of a multi operator AM / rm / FM and pm cross synthesizer.

  The flexible 2d/3d real time wavetable editor comes with different morphing types, harmonic editing and a waveform generator. Analogue sounding and routable resonance filters including shelving filters and key follow complete the clearness of the digital synthesizers.

  Pulse width, amplitude, ring, real phase and 4 types of frequency modulations are included. On board is a step sequencer and arpeggiator with different pattern lengths, swing, tie and key substitution.

  The massive and "scroll less" fx section contains dynamics (including compressor, expander, limiter and gate), tremolo, pre eq, overdrive, distortion, post eq, vibrato, phaser, flanger, chorus, delay, reverb, equalizer, filter and limiter.

  Admiralizor contains many modulation sources (e.g. Macros, lfos featuring on/off triggering/delay/bpm, envelopes, two flexible chaos modulators) and hundreds of (aux) modulation parameters with adjustable polarity and transposition. A flexible preset manager including quick presets, a/b comparison, multi filtering and text search is in-built. Resizable ui from very small up to ultra-hd & 5k retina, multi step undo/redo, mpe support, key hold, gain protection, auto off and the customizable rms meter are more than nice-to-have features.
