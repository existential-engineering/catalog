details: |-
  Annulus is a polyphonic resonator and effects engine built for sound designers who think in texture, not presets. At its heart is a faithful implementation of the physical modeling engine behind Mutable Instruments' Rings, one of the most celebrated modules in the history of Eurorack, paired with a full effects chain and a visual interface that breathes with the sound. Six modes. Six physical models. Six complete sonic identities.

  Annulus routes your signal through four linked processors. Rings is a MIDI-driven polyphonic resonator based on Mutable Instruments' Rings, running six distinct physical modeling algorithms, with eight voices spread across the stereo field with velocity and position randomization for organic variation on every hit. Spiral is a stereo tape delay with tempo sync, ping-pong routing, wobble modulation, and saturated feedback. Velvet is an algorithmic reverb (CloudSeed) with shimmer, diffusion, ducking, and a four-second tail. Distortion offers twelve waveshaping models at 2x oversampling, from soft tube warmth to asymmetric fuzz.

  Four macro knobs (Morphe, Aigle, Nothros, Topos) reach across the entire chain simultaneously. One gesture shapes the resonator, the delay, the reverb, and the drive at once. Topos also integrates into the visualizer's rotation, tying the image to the physics of the sound.

  Morphosis is the modal resonator, the original Rings algorithm. Morphe adjusts the stiffness and spacing of modal partials, moving from tight harmonic clusters into rich inharmonic shimmer while the fundamental stays anchored. Sympatheia uses six virtual strings that retune themselves in response to incoming pitch, producing the swelling unison and shimmer of a sympathetic string instrument. Bathmos is a Karplus-Strong plucked string model with tunable dispersion, spreading partials into clangy, bell-like inharmonicity at higher settings.

  Anomalia places FM synthesis inside the resonator, with Morphe stepping through a quantized table of carrier-to-modulator ratios and Aigle pushing the modulation index. Donisis locks the sympathetic string model to eleven fixed chord shapes (octave, minor, major, sus4, minor 7th, major 7th and more) with the current chord name displayed beside the knob. Antron bakes an internal reverb into the Karplus-Strong resonator's tail, before the signal reaches Velvet, so notes bloom rather than decay cleanly.

  Annulus is offered free of charge and is currently untested in the wild. It has not gone through a public beta or formal testing phase, so it may contain bugs or behave unpredictably across different systems and DAWs. Bug reports are welcomed at info@erikssonjonas.com with OS, DAW, and a short description of what happened.
specs: |-
  - Six physical modeling algorithms: Morphosis, Sympatheia, Bathmos, Anomalia, Donisis, Antron
  - MIDI-driven, eight-voice polyphonic resonator based on Mutable Instruments' Rings
  - Eight voices spread across the stereo field with velocity and position randomization
  - Spiral: stereo tape delay with tempo sync, ping-pong routing, wobble modulation, and saturated feedback
  - Velvet: algorithmic reverb (CloudSeed) with shimmer, diffusion, ducking, and a four-second tail
  - Distortion: twelve waveshaping models at 2x oversampling
  - Four macro knobs (Morphe, Aigle, Nothros, Topos) modulating across the entire chain
  - Visual interface with rotation synced to the Topos macro
  - Donisis mode steps through eleven chord voicings with on-screen chord name display
  - macOS (Apple Silicon and Intel): VST3 and AU
  - Windows: VST3
