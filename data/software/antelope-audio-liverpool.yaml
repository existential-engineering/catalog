details: |-
  Liverpool is a Vari-Mu tube compressor plugin that runs natively in your DAW on macOS or Windows, or in real-time on Antelope's Synergy Core interfaces.

  A contemporary fusion of the most desired features of legendary Vari-Mu classics. If you want the rich mid-range smoothing compression of an Altec 436C with the fast transient gripping attack of a Fairchild 670 and the unique 'Hold' recovery of an RS124 all in one box, the Liverpool is your answer.

  Much like its vintage predecessors, this compressor can handle high gain reduction while preserving sound quality without introducing any unwanted artifacts, pumping, or unpleasant distortion. Its forgiving qualities make it almost impossible for the Liverpool to produce bad or destructive results. It is the perfect choice for healing even the most damaged and poorly recorded mid-range in instruments and vocals with its incredibly sweet, round, and warm processing, and its lush smoothening effect even at high gain reduction will immerse any track in a mix while enriching its mid-range and thickening its low end.

  Specially designed controls make this one of the most versatile and flexible Vari-Mu designs ever built. You can add grit and character to any source without engaging any dynamic processing, or apply lush smoothening and fat rounding by dialing in heavy compression. At the heyday of Vari-Mu compressors, the now revered Altec 436C was an affordable alternative to the Fairchild 670. Its elegant circuit simplicity made it an easily modifiable piece, which engineers around the globe were modifying to suit their own needs.

  As a tribute to those engineers from the 60s, the Seattle-based Grove Hill Audio re-created the original 436C circuit and modified it with some of the most desirable features and mods over the years for a truly unique tone-shaping beast that is characterful yet not overly colored. Antelope deconstructed one of Grove Hill Audio's Liverpool compressors, carefully analyzed every single component, and recreated it in digital form using the original blueprints to assemble the Liverpool effect emulation.
specs: |-
  - Vari-Mu tube compressor plugin
  - Emulation of the Grove Hill Audio Liverpool, a modified Altec 436C design
  - Combines characteristics of the Altec 436C, Fairchild 670, and RS124
  - 'Hold' recovery function for more musical and forgiving high-gain reduction
  - Bypassable compression with 'C' control and Input drive for vintage lush coloration
  - Designed to avoid artifacts, pumping, or distortion at high gain reduction
  - Sweet, round, warm mid-range processing with low-end thickening
  - Compatible with AFX2DAW for real-time mixing on Synergy Core interfaces
  - Runs natively in your DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core interfaces
