description: HoRNet MBC is a multi band compressor with four different bands that can also work in a fully automated way
details: |-
  Introducing HoRNet MBC, a Multi-Band Compressor engineered to redefine how you sculpt and refine your audio. Whether you are a music producer, audio engineer, or mastering professional, MBC is designed to give you complete control over your sound.

  MBC delivers the finesse of a multi-band compressor with four independent frequency bands and three flexible crossovers, so you can tailor the frequency range of each band. Each band's compression parameters can be adjusted individually, providing precise tonal sculpting.

  Each band can be switched between compression and expansion modes, and Stereo or M/S mode can be activated per band for spatial manipulation and stereo field control.

  Global auto functions for the Attack/Release, Ratio and Threshold parameters find optimal settings for each band, while each parameter can still be set manually. A graphical representation visualises each band's level and compression or expansion.

  Up to 4x oversampling keeps audio quality clean, linkable input and output maintain a constant loudness, and a bypass button allows quick A/B comparisons. The interface offers Light and Dark modes and a vector user interface that adapts to any screen resolution.
specs: |-
  - Multiband compressor for adding clarity to mixes and masters
  - 4 independent frequency bands
  - 3 crossovers for tweaking the frequency range of each band
  - An independent set of compression parameters for each band
  - Each band can be independently switched to an expander
  - Stereo or M/S function for each band
  - Global auto functions for the attack/release, ratio and threshold parameters
  - Graphical visualisation of each band level and compression/expansion
  - Up to 4x oversampling
  - Linkable input and output to maintain a constant loudness
  - Bypass button
  - Light and Dark mode supported
  - Vector user interface for a sharp visualisation at any resolution
  - Apple Silicon native support
  - macOS (10.13 and later) and Windows (Windows 10 and later) support
  - 64-bit on Mac and Windows
  - No copy protection
