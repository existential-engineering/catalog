description: HoRNet MBC is a multi band compressor with four different bands that can also work in a fully automated way
details: |-
  Introducing HoRNetMBC, a groundbreaking Multi-Band Compressor meticulously engineered to redefine how you sculpt and refine your audio. This advanced tool is your key to achieving pristine clarity, enhancing the nuances of your mixes, and mastering your sound with unparalleled precision. Whether you’re a music producer, audio engineer, or mastering professional, HoRNetMBC is designed to give you complete control over your sound, allowing you to achieve exceptional results with every project.

  HoRNetMBC empowers you with the finesse of a multi-band compressor, delivering a level of control that lets you dive deep into the details of your mix. With four independent frequency bands and three flexible crossovers, you can tailor the frequency ranges of each band to suit your sonic vision. Whether you’re sculpting lows, refining mids, or elevating highs, the flexibility of HoRNetMBC allows each band’s compression parameters to be adjusted individually, providing precise tonal sculpting and giving your audio a professional touch. The result is a mix that sounds cleaner, more dynamic, and perfectly balanced.

  This state-of-the-art plugin offers unprecedented versatility. Effortlessly switch each band between compression and expansion modes, allowing your audio to breathe and evolve dynamically. Whether you need to tighten the low end or smooth out the high frequencies, HoRNetMBC gives you the freedom to make nuanced adjustments across the entire frequency spectrum. Additionally, each band’s parameters can be customized for optimal performance, ensuring that your compression works exactly as you intend.

  Activate Stereo or M/S mode for each band, opening doors to expansive spatial manipulation and complete stereo field control. This feature is perfect for anyone who wants to enhance the spatial characteristics of their mix or achieve more dynamic stereo imaging. By allowing independent control over each band in either stereo or mid-side mode, HoRNetMBC takes your mixing and mastering capabilities to new heights, offering a range of creative possibilities that simply weren’t achievable with older tools.
specs: |-
  - Multiband Compressor for easily adding clarity to your mix and masters;
  - 4 independent frequency bands
  - 3 crossovers for tweaking the frequency range of each band
  - An independent set of compression parameters for each band
  - Each band can be independently switched to an expander
  - Stereo or M/S function for each band
  - Global auto functions for the attack/release, Ratio and Thresholds Parameters.
  - Handy graphical visualisation of each band level and compression/expansion
  - Up to 4x Oversampling.
  - Linkable input and output to maintain a constant loudness.
  - Bypass button.
  - Light and Dark mode supported
  - Vector user interface for a sharp visualization at any resolution
  - Apple Silicon native support
  - macOS (10.13 and later) and Windows (Windows 10 and later) support.
  - 64-bit on Mac and Windows.
  - Audio Units, VST, VST3 and AAX format.
