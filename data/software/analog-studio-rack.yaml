details: >-
  Analog studio rack is a modular rack that provides hot-swappable 500 series
  style eq's, compressors, gate, exciter and a tube driven pre-amp; the perfect
  all-in-one channel strip.


  Inspired by a classic and famous british console for its gate/expander,
  comp/limiter, bus compressor and eq, a modified exciter, a tube driven pre-amp
  and another famous mid 1950's eq, the as-rack brings together a suite of 7
  modules expertly tuned to sound musical.


  Each of the 6 main modules can be placed in any order with simple drag and
  drop, allowing you the freedom within a rack space design to try different
  combinations; compressor before or after eq, gate after a crushed compressor
  for effect.


  Each module of the rack has a input and output gain knob. This is not just a
  digital volume knob, providing analog character and tonal shaping
  capabilities.


  The plug-in comes with an array of presets specifically designed for various
  instruments as your starting point. Utilize them in your mixes, tweak, create
  your own as single module presets or global.
