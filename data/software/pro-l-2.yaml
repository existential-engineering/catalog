description: FabFilter Pro-L 2 is a transparent, high quality true peak limiter plug-in. Available in VST, VST3, AU, CLAP, AAX and AudioSuite formats for Windows and macOS.
details: |-
  A true peak limiter is an essential tool for every mastering or mixing engineer. Are you looking for a professional, feature-packed limiter that is loud and transparent at the same time, equipped with extensive loudness metering? Then FabFilter Pro-L 2 is your weapon of choice!

  FabFilter Pro-L 2 features precise true peak level meters and extensive loudness metering with support for the EBU R128, ITU-R BS.1770-4 and ATSC A/85 standards. Combined with its unique real-time level display, you have all the information you need to achieve the best possible results.

  With highly advanced algorithms, linear-phase oversampling, professional dithering and noise shaping and surround support (up to Dolby Atmos 9.1.6) with intelligent channel linking, FabFilter Pro-L 2 is the complete solution for every mixing and mastering job.

  Of course, you also get all the usual FabFilter goodies: perfectly tuned knobs, MIDI Learn, Smart Parameter Interpolation for smooth parameter transitions, an excellent help file with interactive help hints, SSE optimization, GPU-powered graphics acceleration and much more.
specs: |-
  - Great transparent sound combined with maximum loudness
  - Eight different limiting algorithms
  - True peak limiting
  - Unique real-time level display with peak gain reduction labels
  - Up to 32x linear-phase oversampling
  - Highly accurate output and gain reduction metering including true peak metering
  - Extensive loudness metering with EBU R128, ITU-R BS.1770-4 and ATSC A/85 support
  - Full immersive / Dolby Atmos functionality (up to 9.1.6)
  - Optional DC offset filter
  - External side chain triggering for stem mastering
  - Unity Gain option
  - Audition Limiting option
  - Adjustable meter scale including K-System support
  - Advanced dithering with three different noise shaping algorithms
  - Separate channel linking for transient and release stages
  - GPU-powered graphics acceleration
