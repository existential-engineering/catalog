description: An instrument loaded with Progressive House and EDM samples, presets and full grooves, so you can lay down your drum tracks in minutes.
details: |-
  An instrument loaded with progressive house and edm samples, presets and full
  grooves, so you can lay down your drum tracks in minutes. With hype, you can
  create driving beats that put conventional sample packs to shame, all by
  touching a single key. It instantly syncs to your DAW's tempo, and you can
  play a near-infinite variety of loops just like you would an instrument.

  Hype has no hidden controls or complications. The straightforward interface
  you see is exactly what you get - nothing more, nothing less - making every
  tweak quick and painless. And to make things even easier, hype is fully
  compatible with MIDI drag & drop, so you can take loops directly from hype's
  keyboard and place them directly into your DAW session for easy editing.

  These kicks hit hard. Every single beat. Without ever being too much. Every
  kick, snare, and hi hat is pre-processed to perfection - all you have to do is
  add the finishing touches. Hype's presets combine the best of deep house,
  mainstream club, classic ibiza and underground edm, giving you a massive edge.

  Sample packs boast large claims about "number of loops" - but with hype, the
  loops are your own. Everything's in MIDI, so you can change any part of a loop
  you want to make everything "lock in." This means no more weak, flat beats.
  You're in full control of your beats without you ever feeling like you have to
  do it on your own.

  With a single knob, you control a combined highpass filter, reverb and subtle
  delay - perfect for creating high-impact builds without the need for multiple
  automation lanes. This pushes your drums into the background in a way that a
  simple filter never could, setting you up for a much stronger chorus or drop.
specs: |-
  - 10 polished kits
  - 20 styles, 460 Patterns
  - 12 Mix Presets
  - Riser Special Control
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8GB of RAM
  - 0.96GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Supported standards: MIDI
  - Requires the latest version of the UJAM App, which installs the Beatmaker plug-in that hosts all titles
