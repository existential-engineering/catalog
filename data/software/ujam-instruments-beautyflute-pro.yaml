details: |-
  Beautyflute Pro is a free recorder instrument plug-in from UJAM, billed as "More Emocion, More Beauty, More Flute".

  Whether the next Latin smash hit is lacking a healthy dose of "emocion" or a track just needs a beautiful flute pad for a botanica jam, Beautyflute Pro is built to dial in a track's flutiness with a single instrument.

  The plug-in installs and authorizes through the UJAM App like the rest of the UJAM range, and works in all major DAWs on macOS and Windows.
