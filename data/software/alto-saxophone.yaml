details: >-
  Auditory lab's alto saxophone is a alto-sax emulator library featuring
  high-quality sounds that were meticulously recorded and sampled from a real
  alto saxophone including controllable key noise and vibrato depth to give you
  a real sax behaviour.


  The main panel features 4 adsr faders to control attack, decay, sustain and
  release. And 4 knobs to control volume, vibrato, key noise and pan.


  The effects panel features controllable reverb and delay.


  This library is designed to fit a wide array of music genres and styles such
  as the smooth ny 50's bar jazz classics, nu jazz, soul, pop, r&b, blues and
  more.
specs: |-
  - Alto-sax emulator library
  - High-quality recorded and sampled sounds
  - Controllable key noise
  - Controllable vibrato depth
  - 4 adsr faders (attack, decay, sustain, release)
  - 4 control knobs (volume, vibrato, key noise, pan)
  - Controllable reverb
  - Controllable delay
  - Kontakt compatible
