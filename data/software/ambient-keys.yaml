details: >-
  Ambient keys is a synthesizer which plays an extensive set of ambient
  waveforms, processing these using a filter, envelopes, an lfo, an ensemble,
  delays and an effect section which features 133 different effect modes,
  including crossfading effects and layered effects.


  1024 presets, which are available in three soundpacks (included when
  purchasing the plug-in). A soundpack is an expansion which adds new ambient
  waveforms and a set of presets.


  Crossfading and layered effects involve distortion, filter banks, a resonator,
  flanger, sub oscillation, amp modulation, pitch shift, etc.


  All knobs can be mapped to MIDI controllers with a simple "learn" function.


  Ensemble with adjustable amount and mix. Stereo delays. Full polyphony. Only
  your cpu sets the limit or you may set a fixed voice limit.
