description: >-
  Redrum is an original drum machine featuring a built-in pattern sequencer with
  ten stereo channels for loading custom drum samples or using included preset
  kits. It offers 32 patterns across four banks with up to 64-step patterns,
  individual audio and gate outputs, gate and CV inputs, and two send effect
  outputs.
