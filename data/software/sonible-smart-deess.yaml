description: smart:deess is a content-aware de-esser plug-in that uses a trained neural network to detect individual phonemes and treat sibilance and plosives in vocal and speech recordings. Rather than only reducing level, it processes the entire phoneme spectrally for a more natural, better balanced result.
details: |-
  smart:deess analyzes the actual content of a signal rather than the level of a single frequency band before deciding what to do. As soon as the plug-in is loaded on a channel it builds a voiceprint of the incoming voice and starts balancing whatever sibilants and plosives are present, so the remaining work is reviewing and refining the analysis rather than correcting a sound by hand. Both sibilance and plosives are covered in one plug-in.

  A fully trained neural network identifies specific individual phonemes (S, Z, Sh, Ch, T, P) in real time and determines the exact start and end point of each sibilance, so no threshold has to be set. The whole sibilant is processed rather than only its loudest part, which makes the result far more natural, and each phoneme type is identified and processed independently, so an Ess is treated differently from a Ch or a T. The outcome sounds as though the original recording had simply been better balanced.

  Where most de-essers act as automatic volume controls, smart:deess pairs a broadband component with additional spectral processing that shapes and refines harsh sounds at a deeper level. The Color controls tune the character of the sibilants to soft, balanced or sharp, so the intended balance can be reached without losing edge, and dull or lisping sibilants can be revived by the same spectral processing.
specs: |-
  - Content-aware analysis of the signal's actual content, not the level of a single frequency band
  - Voiceprint of the input voice built on load, with AI processing setting parameters from the source material
  - Real-time detection of individual phonemes (S, Z, Sh, Ch, T, P) with exact start and end points, so no threshold is needed
  - Each phoneme type identified and processed independently
  - Broadband plus spectral processing, so sibilants are shaped and refined rather than only turned down
  - Color controls for soft, balanced or sharp sibilant character
