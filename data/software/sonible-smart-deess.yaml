description: smart:deess is a content-aware de-esser plug-in that uses a trained
  neural network to detect individual phonemes and treat sibilance and plosives
  in vocal and speech recordings. Rather than only reducing level, it processes
  the entire phoneme spectrally for a more natural, better balanced result.
details: |-
  Where other de-essers just reduce volume, smart:deess goes far deeper and creates a more natural, better balanced sound. By harnessing the power of a fully trained neural network, smart:deess identifies the exact start and end points of phonemes without the need to set a threshold. It is also able to process the entire phoneme using spectral processing.

  The content-aware approach: smart:deess analyzes the signal's actual content, not just the level of one frequency band, before it decides what to do. As soon as you load the plugin on a channel, smart:deess builds a 'voiceprint' of the input voice signal and starts balancing any sibilants and plosives that are present. Your job then is to review the analysis and refine the results. smart:deess allows you to spend time on getting the sound you want, rather than correcting the sound you don't want.

  The power of AI: smart:deess identifies specific individual phonemes (S, Z, Sh, Ch, T, P) in real time, determining the exact start and end point of each sibilance without you having to set a threshold. The entire sibilant is then processed, rather than just the loudest part, making the final result far more natural sounding. Each phoneme type is identified and processed independently, an "Ess" is treated differently than a "Ch", which is treated differently than a "T". The result is as though the original recording had simply been better balanced.

  Spectral processing: other de-essers are just automatic volume controls. smart:deess does contain a broadband component, but it also draws on additional spectral processing to shape and refine harsh sounds at a deeper level. Use the Color controls to tune the sibilant character (soft, balanced or sharp) and achieve the desired balance without losing edge. What's more, dull and lisping sibilants can be revived and given new life by applying smart:deess' spectral processing.
specs: |-
  - The world's first de-esser that combines phoneme detection with advanced spectral de-essing
  - Tackle de-essing and plosives in voice recordings with a single plugin
  - AI processing instantly adjusts the settings according to the source material
  - "Ess" sounds can be fully shaped and refined, not just turned down
  - Phoneme detection identifies S, Z, Sh, Ch, T and P in real time with no threshold to set
  - Color controls tune the sibilant character (soft, balanced or sharp)
  - Plug-in formats (Mac): VST, VST3, AU, AAX
  - Plug-in formats (Windows): VST, VST3, AAX
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok
  - Apple Silicon support: native
  - Latency: approx. 70ms
  - Latest version: 1.0.2
  - System requirements (PC): Windows 10 (64 bit)
  - System requirements (Mac): OSX 10.14+
  - RAM: 4GB
  - CPU: Intel Core (i5), Apple Silicon
  - GPU: OpenGL Version 3.2+
