description: Tai Chi Lite is the reduced-cost edition of the Tai Chi ensemble
  character reverb, offering the same chorus, reverb and reflections engine in
  mono or stereo only, without the multi-band, fidelity and dynamics engines.
details: |-
  Tai Chi Lite is the reduced-cost edition of LiquidSonics' Tai Chi ensemble character reverb, published under the Reverb Foundry line. If the standard edition of Tai Chi is more than you need right now, Tai Chi Lite offers the same chorus, reverb and reflections engine at a lower price, with an upgrade path to the standard edition available at any time.

  The Lite edition keeps the core of the instrument. It provides unison chorus, nonlinear reflections, simple decay contouring and a 4-band master EQ, all of which the standard edition also carries. The unison chorus synchronises modulated reads throughout the reverb engine, and the 'wander' modulation modes are offered for the thick, gritty character associated with classic hall reverb algorithms.

  What Lite leaves out is surround support, the multi-band engine, the fidelity engine and the dynamics engine. In practice that means Lite runs mono or stereo only, where the standard edition adds LCR, 4.0, 5.0 to 5.1.4, 7.0 to 7.1.6 and 9.0.4 to 9.1.6. Lite has simple decay contouring rather than multi-band decay with contouring, and it omits compression and ducking as well as the fidelity controls that include shimmer. Its preset library is 42 presets against the standard edition's 284.

  Distribution and licensing match the standard edition. Tai Chi Lite ships as a 64-bit plug-in in VST 2.4, VST 3, Audio Unit (AUv2) and AAX Native formats for Windows 7 and above and macOS 10.13 and above, with the macOS installers built as Universal Binaries covering Apple Silicon and Intel x64. Rosetta 2 is supported. The plug-in is not available for 32-bit DAWs. A perpetual license is included, and authorisation requires an iLok 2/3 dongle, iLok machine activation or iLok Cloud.

  Tai Chi Lite carries its own installers and its own user guide, but shares a version stream with the standard edition: every entry in the change log lists Windows and macOS downloads for both Tai Chi and Tai Chi Lite. Version 1.6.2 dates from 5 October 2025, and the first release, 1.0.0, is dated 17 November 2021. A license for the standard edition can also unlock Tai Chi Lite.
specs: |-
  - Edition: Lite (reduced feature set of Tai Chi ensemble character reverb)
  - Perpetual license
  - 64-bit VST 2.4, VST 3, Audio Unit (AUv2) and AAX Native
  - Unison chorus
  - Nonlinear reflections
  - Simple decay contouring
  - 4-band master EQ
  - Mono or stereo reverb (no surround support)
  - 42 presets
  - No compression or ducking (dynamics engine omitted)
  - No fidelity controls or shimmer
  - No multi-band decay engine
  - Windows 7 and above
  - macOS 10.13 and above
  - Intel or Apple Silicon processors (native and Rosetta 2 supported)
  - macOS installers are 64-bit Universal Binaries for VST2, VST3, AU and AAX
  - Not available for 32-bit DAWs
  - iLok 2/3 dongle, iLok machine activation or iLok Cloud required
  - Recommended: AMD Zen 3 or higher (5000 series and up), or Intel 10th or 11th gen or higher
  - Recommended: 6 cores minimum (8+ recommended)
  - A license for the standard edition can also unlock Tai Chi Lite
