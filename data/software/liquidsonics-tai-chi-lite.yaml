description: Tai Chi Lite is the entry-level stereo-only edition of the Tai Chi ensemble reverb, offering the core chorus, reverb, and reflections engine at a lower price point with a focused preset library.
details: |-
  Tai Chi Lite is the entry-level edition of the Tai Chi ensemble reverb, offering the same core chorus, reverb, and reflections engine as the standard edition at a lower price point.

  The Lite edition provides stereo reverb only (no surround support), with the core unison chorus engine, nonlinear reflections with pattern modes, simple decay contouring, and a 4-band master EQ.

  Tai Chi Lite ships with 42 presets and does not include the multi-band decay, fidelity (shimmer), dynamics (compression/ducking), or VLF processor found in the standard edition.

  Users can upgrade from Tai Chi Lite to the standard edition at any time for an additional fee, making it a low-cost entry point into the Tai Chi reverb ecosystem. Like the standard edition, Tai Chi Lite is 64-bit only with Universal Binaries for Apple Silicon and Intel x64 Macs, and requires iLok 2/3, iLok machine activation, or iLok Cloud.
specs: |-
  - Formats: VST 2.4, VST 3, Audio Unit (AUv2), AAX Native
  - 64-bit only; Universal Binary (Apple Silicon + Intel x64)
  - macOS 10.13 and above; Windows 7 and above
  - Stereo reverb only (no surround support)
  - Unison chorus with synchronized modulated reads
  - Nonlinear reflections with pattern modes
  - 4-band master EQ
  - Simple decay contouring
  - 42 presets
  - iLok 2/3, iLok machine activation, or iLok Cloud required
  - 14-day free trial available
  - Upgradeable to standard edition
