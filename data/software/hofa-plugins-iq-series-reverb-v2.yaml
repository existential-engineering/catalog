description: IQ-Series Reverb V2 is a convolution and algorithmic reverb with 2,886 high-quality impulse responses and full 5.1 surround support. It combines four IR engines with two AlgoVerbs and includes EQ, compressor, modulation, saturation, gate, IR envelope and positioner, covering room, hall, chamber, plate, spring, reverse and more.
details: |-
  The HOFA IQ-Series Reverb V2 is a professional reverb plugin for audio production, mixing, and post-production. It combines a convolution reverb with algorithmic reverbs in a single interface. Even the basic version of the plugin is surround-capable and includes 1,500 high-quality impulse responses (IRs), four IR engines, two integrated AlgoVerbs, and creative processing tools such as EQ, compressor, modulation, saturation, gate, and a positioner for spatial sound placement.

  Find the perfect reverb for mixing, sound design and post-pro. Choose from hundreds of natural, real rooms and classic vintage equipment, or completely new and innovative reverb designs. If that's not enough for you, you can also use your own impulse responses or the HOFA IR-Packs, which expand the plugin to 2,886 impulse responses in total.

  More than 1,500 different reverbs and effects, and which one fits best? The fast and intelligent browser helps you to make the right choice quickly and shows you interesting alternatives. Among other attributes, you can filter and sort by brightness, RT60 and application range of an IR, as well as by category (Room, Plate, Spring, Chamber, Hall, Church, Space, FX, Reverse, Hybrid, Cabinet).

  The IQ-Series Reverb not only allows you to load IRs: you can also work with the integrated HOFA AlgoVerb for even more flexibility, creating algorithmic reverb effects and mixing them with impulse responses. Up to six reverb sounds can be mixed at a time (4 IR engines plus 2 AlgoVerbs), and creative processing lets you distort, gate or modulate a reverb, including lengthening or shortening frequency components of the impulse responses directly in the 3D view.

  The Positioner is designed to help you arrange instruments freely in space. You simply move the orange X and the Positioner immediately takes care of the tonal representation, working with any impulse response. Mixes and masterings can also be created in surround with mono, stereo and true stereo impulse responses and algorithmic textures.
specs: |-
  - 2,886 high-quality impulse responses with all 8 IR-Packs (1,500 in the basic version)
  - Full 5.1 surround capability
  - Up to 6 simultaneous reverb engines: 4 IR engines + 2 AlgoVerbs
  - Integrated EQ, compressor, modulation, saturation, gate, IR envelope and positioner
  - 3D IR editor for visual sound shaping
  - Stereo and true stereo IRs for music and post-production
  - IR categories: Room, Ambience, Chamber, Hall, Church, Plate, Space, Spring, FX, Reverse, Hybrid, Cabinet
  - Smart IR browser with filtering by application, length, tone and category
  - Hybrid IRs created from real mixing sessions using multiple hardware devices
  - Supports loading user-defined impulse responses
  - Eight optional IR-Packs available separately
  - Two licenses included, managed via the HOFA Plugins Manager, offline activation supported
  - Operating system: macOS 10.13 or later, Windows 10 or later
  - Continuously tested on Ableton Live, Apple Logic, Avid Pro Tools, Bitwig, Cockos Reaper, Image Line FL Studio, Magix Samplitude/Sequoia, Fender Studio Pro, Steinberg Cubase/Nuendo/Wavelab
  - 14 day free trial
