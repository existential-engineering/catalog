description: IQ-Series Reverb V2 is a convolution and algorithmic reverb with 2,886 high-quality impulse responses and full 5.1 surround support. It combines four IR engines with two AlgoVerbs and includes EQ, compressor, modulation, saturation, gate, IR envelope and positioner, covering room, hall, chamber, plate, spring, reverse and more.
details: |-
  The HOFA IQ-Series Reverb V2 is a professional reverb plugin for audio production, mixing, and post-production. It combines a convolution reverb with algorithmic reverbs in a single interface. Even the basic version of the plugin is surround-capable and includes 1,500 high-quality impulse responses (IRs), four IR engines, two integrated AlgoVerbs, and creative processing tools such as EQ, compressor, modulation, saturation, gate, and a positioner for spatial sound placement.

  The bundle including all 8 IR packs (Golden Gated, Magic Plates, Halls & Churches, Realistic Rooms, Vintage Springs, Special FX, Professional Post-Pro, Binaural Spaces) provides approximately 3,000 impulse responses total, making it the largest reverb IR collection in the world.

  A smart browser allows filtering by brightness, RT60, and application. The 3D IR editor enables visual sound shaping, and true stereo IRs deliver authentic width. The plugin supports 5.1 surround sound and custom impulse responses. Hybrid presets from real mixing sessions are included.

  The plugin is licensed via the HOFA Plugins Manager, with two licenses included per purchase and offline activation supported. A 14-day free trial is available.
specs: |-
