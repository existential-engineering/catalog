details: |-
  The largest, most colorful, and best reverb collection in the world. 2,886 high-quality impulse responses Full 5.1 surround capability With EQ, compressor, modulation, saturation, gate, IR envelope and positioner Groundbreaking features overcome the limitations of other reverb plugins 4 IR engines + 2 AlgoVerbs for individual blends Stereo and true stereo IRs for music and post-production Room, Ambience, Chamber, Hall, Church, Plate, Space, Spring, FX, Reverse, Hybrid, Cabinet … the most creative control of any reverb I’ve ever dealt with! Joe BarresiAudio engineer (Slipknot, Tool, etc.) The clarity and accuracy are what make the IQ-Reverb V2 one of my go-to reverbs! David KahneProducer, Songwriter (The Strokes, Paul McCartney, Lana Del Rey) The collection of included IRs is vast and I can always find something that falls perfectly into place. Eric ValentineProducer (Slash, Queens of the Stone Age, etc.) Perfect reverb for my scores and pop songs! Lars DeutschProducer / Composer (Red Bull, Mercedes, CBS, Fox, etc.) Version 2 is a real hit! Depth, width, density – everything you need! Florian SitzmannProducer (Nena, Sasha, Wallis Bird, etc.) My hardware units are having a hard time to compete against the IQ-Reverb V2! Wytse GerichhausenAudio Engineer (White Sea Studio) The IQ-Reverb V2 creates an amazing and unique depth that you can’t get with any other plugin! Jon SineProducer The IQ Reverb 2 will definitely go to the top of my toolbox! Oliver PinelliProducer (Enrique Iglesias, Paul van Dyk, etc.) … the first reverb plugin I’ve come across that really has all the features you could dream of in one place! Tom MacLeanGuitarist / Producer (Psion, To-Mera, Haken, etc.) Incredibly precise reproduction of rooms at the highest level – for me, it is the perfect tool! Jan StahlmannBroadcast mixing & mastering engineer It has never been easier to achieve impressive depth and three-dimensionality in your productions! One of the world’s largest collections of reverb sound Find
