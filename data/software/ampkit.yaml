details: >-
  Ampkit is a guitar amps, effects and recording app for ipad, iphone, and ipod
  touch.


  Convolution-based cabinet simulation uses advanced technology (used in
  high-end desktop amp simulation software) for highly accurate cabinet
  simulations. Adaptive input compensation intelligently restores the bass
  frequencies lost through the headset circuitry on various ios devices,
  resulting in an increase in the fidelity of the incoming guitar signal, and
  richer amplified tone, regardless of amp and playing style.


  Solo & mix output shaping allows toggling between solo mode, which pumps up
  bass frequencies for the best possible tone when practicing and playing for
  fun, and mix mode, which gives a brighter tone.


  Ampkit can keep operating and produce audio when running in the background -
  perfect for looking at scrolling tab notation in tabtoolkit while continuing
  to play an ampkit setup. Recording session mix down allows mixing a wet guitar
  recording with its backing track, with the ability to repeat the process to
  mix in additional guitar tracks.


  In ampkit 1.2, users can turn off amp and cabinet modeling, and create setups
  with just effects pedals, using ampkit as an effects processor connected to a
  guitar or bass amp. Effects can be positioned after the cabinet - total
  control to place effects virtually anywhere, including places where physical
  effects pedals could never go.
specs: |-
  - Dual-stage amp simulation
  - Convolution-based cabinet simulation
  - Adaptive input compensation
  - Solo & mix output shaping
  - Noise gate
  - Multitasking support
  - Background audio
  - Recording session mix down
  - Effects only mode
  - Effects after the cab
  - Feedback protection
