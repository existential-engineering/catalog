description: Dual-stage vocal compression with machine learning auto-tune vocal
  compressor combines the most popular vocal compression styles and control.
details: |-
  Auto-tune vocal compressor is an advanced dual-stage compressor for modern
  vocal production. Key compression styles driven by next-generation machine
  learning make finding the best compression settings fast and easy.

  Auto-tune vocal compressor is the only vocal compressor plug-in with machine
  learning in the world supporting dual-stage configurations. Stack two fully
  featured and tweakable compressors together from four of the most popular
  styles (fet, opto a, opto b, and modern), in any order to create the ultimate
  vocal compressor.

  Using advanced machine learning technology, auto-tune vocal compressor
  analyzes your track and recommends the optimum starting point and compression
  levels to get the sound you want.

  Compelling artist presets covering a wide range of vocal styles and moods to
  help jumpstart your creativity and make it easy to experiment with new ideas.

  Apply the cozy vibe of tube saturation and harmonics to vocals across one or
  both compressors with the built-in warm feature.
specs: |-
  - Dual-stage compression
  - Machine learning
  - Fet compression style
  - Opto a compression style
  - Opto b compression style
  - Modern compression style
  - Single-stage mode
  - Dual-stage mode
  - Flexible side-chaining
  - Warm feature with tube saturation
  - Harmonics processing
  - macOS compatible
  - Windows compatible
  - Compatible with all major DAWs
