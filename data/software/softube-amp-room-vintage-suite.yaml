details: |-
  Amp Room Vintage Suite is ideal for productions that require eternal guitar tones. The included vintage hardware sims deliver everything needed for pop or rock productions with vibes from retro to modern. Vintage Suite comes with four timeless amps from the US and the UK.

  The suite includes the Amp Room platform, four classic amps, five cabs, 11 stompboxes, 13 effects and utilities, microphone options, presets, and more. It features cabinet IR captures with moveable microphones, plus a parametric equalizer for added tone shaping. It is also available as a part of Flow Mixing Suite and Flow Complete Suite.

  Suite Mode is an intuitive workflow with hand-selected sets of gear that let you quickly get the sounds you want with Vintage Suite. You have easy access to your amps and cabs, as well as the pedal and effects sections. If you want to go further into tone shaping, you can switch to Studio Mode.

  The Pacific Dual Tremolo 100W Black is a 1966 BF version of a classic combo amplifier. Known for its clean sound, it's perfect for getting semi-dirty blues tones. Like its older sibling, the 100W Silver has made a name for itself. Both amps add more distortion when pushed hard, but the Silver includes a master volume control for added control. An enduring part of rock and roll, the Custom 100W is a late '70s British guitar amp often used for classic rock bass and guitar. It gives you a characteristic jangly sound favored by some of the top musicians in the genre. The 30W Top Boost is an early 1960s 3-channel, 6-input AC30 Treble model that is the sound of the British Invasion.

  Amplifiers is your go-to when you just need quick tones. It's lighter on resources, faster to load, and simpler to use, it lets you focus on your playing and the song you're recording. Included with every Amp Room Suite, Amplifiers supports all Amp Room amps and cabs.
specs: |-
