  - 11 stompboxes: Marshall Guv'nor overdrive, Softube Filbyter fuzz, Softube JJB chorus, Softube Jet Town compressor, Softube Lion Head vibrato, Softube Tinnerö tremolo, Softube Brask Boost, Softube Wild Boar, Softube Trollegater, Softube Doom Chvrch, Kraft
