description: Remix:Drums is an AI-powered DAW plug-in for music producers, remixers, and DJs. Isolate, remove, and manipulate drum loop elements with precision, unlocking unparalleled creative control over your tracks.
details: |-
  Remix:Drums is designed for music producers, remixers, and DJs. This powerful tool allows users to isolate, remove, and manipulate individual drum elements within a loop or recording, unlocking unprecedented creative control over drum tracks.

  Remix:Drums is a new cutting-edge DAW plugin that instantly separates out drum stems from an existing loop or recording in real-time for a fast and intuitive workflow. This powerful tool allows users to isolate, remove, and manipulate individual drum elements, unlocking unprecedented creative possibilities for music producers, remixers, and DJs.

  Don't accept constraints when shaping your sound, with Remix:Drums you can instantly boost your kick, remove the snare or lower the cymbals to realise your vision with no compromise or limitations. Additionally, it's possible to combine drum elements together from different sources, enabling exciting new avenues of rhythmic experimentation.

  Real-time. Always. No offline jobs. No waiting. Remix:Drums runs live in your session so you can audition changes instantly and keep your flow. Six stems, total control: Remix:Drums separates any drum loop into Kick, Snare, Hat, Cymbals, Toms and Other, independently. Boost, mute or fine-tune each element without touching the rest.

  Sensitivity per stem tunes the detection threshold for each stem independently, so you can dial in exactly how much of each element bleeds through. Every parameter writes to your DAW's automation lane, each stem can be routed to its own track in supported hosts, and the interface can be resized and scaled to suit your workflow and screen size.
specs: |-
  - Instant real-time stem separation: no waiting for tedious offline processing and no data privacy issues
  - Separate your drum loops or recordings into six stems: Kick, Snare, Hi-Hat, Cymbals, Toms, Other
  - Powerful Sensitivity control: fine tune your drum sound in seconds
  - Output level meters for each stem: instant visual feedback on your changes
  - Supports DAW automation
  - Multiple audio outputs (in supported hosts)
  - Perpetual license, no subscription needed
  - Adjustable UI scaling and resizable interface
  - Windows: Windows 11 / 10, Intel Core i5 or AMD multi-core processor (Intel Core i7 or faster recommended), 1366 x 768 display resolution (1920 x 1080 or higher recommended), 1 GB RAM (4 GB or more recommended), 1 GB free HD space
  - macOS: OS X 10.13 or later, runs natively on ARM64 and Intel, 1 GB RAM (4 GB or more recommended), 1 GB free HD space
  - Host must be compatible with VST, VST3 or AAX (Pro Tools 2018 or higher); AU additionally on macOS
  - Tested hosts include Logic Pro, Pro Tools, Ableton Live, Cubase, Nuendo, Studio One, Reaper, FL Studio, LUNA, Audition, Premiere, DaVinci Resolve, Reason and Media Composer
