description: Remix:Drums is an AI-powered DAW plug-in for music producers, remixers, and DJs. Isolate, remove, and manipulate drum loop elements with precision, unlocking unparalleled creative control over your tracks.
details: |-
  Remix:Drums is a cutting-edge DAW plugin that instantly separates out drum stems from an existing loop or recording in real-time for a fast and intuitive workflow. This powerful tool allows users to isolate, remove, and manipulate individual drum elements, unlocking unprecedented creative possibilities for music producers, remixers, and DJs.

  Don't accept constraints when shaping your sound, with Remix:Drums you can instantly boost your kick, remove the snare or lower the cymbals to realise your vision with no compromise or limitations. Additionally, it's possible to combine drum elements together from different sources, enabling exciting new avenues of rhythmic experimentation.

  There are no offline jobs and no waiting. Remix:Drums runs live in your session so you can audition changes instantly and keep your flow. It separates any drum loop into Kick, Snare, Hat, Cymbals, Toms and Other independently, so each element can be boosted, muted or fine-tuned without touching the rest.

  The detection threshold can be tuned for each stem independently, dialling in exactly how much of each element bleeds through. Every parameter writes to the DAW's automation lane for dynamic mixes that evolve across the timeline, and each stem can be routed to its own track in supported hosts so insert effects can be applied to kick, snare or hi-hat in isolation.
specs: |-
  - Real-time processing with no offline rendering or waiting
  - Six independent stems: Kick, Snare, Hat, Cymbals, Toms and Other
  - Per-stem sensitivity control to tune the detection threshold
  - Full DAW automation support for every parameter
  - Multi-output routing to separate tracks in supported hosts
  - Resizable and scalable user interface
  - Windows: Windows 11 / 10
  - Windows: Intel Core i5 or AMD multi-core processor (Intel Core i7 or faster recommended)
  - Windows: 1366 x 768 display resolution (1920 x 1080 or higher recommended)
  - Windows: host application compatible with VST, VST3 or AAX (Pro Tools 2018 or higher)
  - macOS: OS X 10.13 or later
  - macOS: runs natively on ARM64 and Intel
  - macOS: host application compatible with AU, VST, VST3 or AAX (Pro Tools 2018 or higher)
  - 1 GB RAM (4 GB or more recommended)
