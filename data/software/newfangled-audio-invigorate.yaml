description: A dynamics processor that morphs from compression through limiting
  to overdrive, adding glue and life to your mix, drum bus, or any other
  element.
details: |-
  Invigorate is a unique dynamics processor built around a radar-style control that morphs seamlessly between compression, limiting, and overdrive in a single plugin. It is designed to add glue and character to a mix bus, drum bus, or any individual element.

  The plugin features Sensitivity and Tone controls for sidechain frequency tailoring, along with Shape, Squash, and Gate controls to sculpt the gain reduction curve. An Input Exciter and Output Tone section further shape the harmonic content and tonal balance of the signal.

  Invigorate ships with over 200 factory presets contributed by notable engineers including Count (Run The Jewels), Justin Hergett (FINNEAS), Damian Taylor (The Prodigy), and Maor Appelbaum (Faith No More).

  The plugin includes a full-featured preset librarian with categories and search, multi-level undo/redo, true A/B comparison, gain compensation, oversampling with anti-aliasing, and a Mix knob for parallel processing.

  Invigorate supports macOS 10.9 and later (including Apple Silicon) in 64-bit AAX, AU, VST, and VST3 formats, and Windows 10 and later in 64-bit AAX, VST, and VST3 formats.
specs: |-
  - MORPH radar control: sweeps continuously from compression → limiting → overdrive
  - Mix knob for parallel/character blending
  - Sensitivity and Tone controls for sidechain shaping
  - Shape, Squash, and Gate controls for gain curve sculpting
  - Input Exciter and Output Tone controls
  - Gain compensation algorithm
  - Oversampling with anti-aliasing
  - Multi-level undo/redo
  - True A/B comparison
  - Preset librarian with 200+ presets, categories, and search
  - Import support for third-party preset banks
  - macOS 10.9+ (64-bit, Apple Silicon compatible), Windows 10+ (64-bit)
  - Formats: AAX, AU (macOS only), VST, VST3
