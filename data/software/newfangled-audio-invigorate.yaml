description: Invigorate morphs from compression through limiting to overdrive
  with one control. The bus compressor mixers reach for when a mix needs to
  sound bigger.
details: |-
  Invigorate is a unique dynamics processor built around a radar-style control that morphs seamlessly between compression, limiting, and overdrive in a single plugin. It is designed to add glue and character to a mix bus, drum bus, or any individual element.

  The plugin features Sensitivity and Tone controls for sidechain frequency tailoring, along with Shape, Squash, and Gate controls to sculpt the gain reduction curve. An Input Exciter and Output Tone section further shape the harmonic content and tonal balance of the signal.

  Invigorate ships with over 200 factory presets contributed by notable engineers including Count (Run The Jewels), Justin Hergett (FINNEAS), Damian Taylor (The Prodigy), and Maor Appelbaum (Faith No More).

  The plugin includes a full-featured preset librarian with categories and search, multi-level undo/redo, true A/B comparison, gain compensation, oversampling with anti-aliasing, and a Mix knob for parallel processing.

  Invigorate supports macOS 10.9 and later (including Apple Silicon) in 64-bit AAX, AU, VST, and VST3 formats, and Windows 10 and later in 64-bit AAX, VST, and VST3 formats.
specs: |-
  - Combines the best elements of compression, limiting, and overdrive to make your audio sound bigger and more energetic
  - Unique Radar control allows you to set the perfect amount of gain while morphing from compression, through limiting, to distortion
  - Prominent MIX knob allows you to dial in just the right amount of character
  - SENSITIVITY tone controls allow you to tailor the frequencies of the sidechain signal
  - INPUT EXCITER tone controls allow you to overdrive the dynamics processor
  - OUTPUT TONE controls allow you to tailor the sound of the wet signal before the mix control
  - SHAPE, SQUASH, and GATE controls for the gain curve give the perfect amount of control over your tone
  - An aggressive level detector makes the compression pump and breathe when desired
  - Innovative gain compensation algorithm allows you to dial in the perfect sound without tricking yourself that "louder is better"
  - Oversampling and Anti-aliasing assure clean sonics with no digital aliasing
  - Multi level undo/redo for easier workflow
  - True A/B comparison for making better mixing decisions
  - Preset librarian adds Categories, Tags, Descriptions, Artist links, Favorites, and Search to presets
  - Over 200 presets for Mix Bus, Mastering, Drums and more, including artist presets
  - macOS 10.9+, 64-bit AAX, AU, VST, VST3, all formats Apple Silicon compatible
  - Windows 10+, 64-bit AAX, VST, VST3
versions:
  - name: 1.4.4
    releaseDate: 2025-03-01
    description: Added Tutorial on first open. Fixed Preset List dropdown size on
      Windows. Fixed FTZ bit handling.
  - name: 1.4.0
    releaseDate: 2025-07-02
    description: Corrected Registration Documentation. Improved performance of
      opt-click to return to default. Fixed authorization issue on some Ryzen
      CPUs.
  - name: 1.3.10
    releaseDate: 2024-08-14
    description: Fixed a potential crash. Fixed a potential bump sound on
      instantiation. Filters now default to on, but with no filtering applied.
  - name: 1.3.9
    releaseDate: 2024-07-18
    description: Fixed potential crash. Fixed potential UI lockup.
  - name: 1.3.5
    releaseDate: 2024-06-26
    description: ACTIVE button works again. Fixed occasional high gain on start up.
  - name: 1.3.3
    releaseDate: 2024-06-03
    description: Preset name is now saved with Session. Fixed reveal preset folder
      on Windows. Unknown is now No Category. Enter button saves preset on
      preset save page. User Bank is added to the preset drop down list. Added
      cycle UI message to OpenGL Button. Added IMPORT button for presets.
      Favorite flags are now persistent load and save, even when modified. Made
      logos render more clearly on Windows. Passes Windows Smart Screen.
  - name: 1.2.16
    description: Removed erroneous "Beta Expiration" message.
  - name: 1.2.6
  - name: 1.2.5
    description: Third Party Banks are now shown in the main dropdown. Author and
      Banks now show presets by category as well. EXPORT is now called SAVE AS
      and SAVE is now SAVE TO USER. Neither SAVE nor SAVE AS will clear tags,
      category, or description. SAVE AS remembers your previous save position.
      Added scroll bar to the LIBRARY page. LIBRARY page has resizable columns.
      Removed duplicate files when saving a .tide as a .nfa.
  - name: 1.2.3
    description: Added Featured Artist presets to main dropdown. Fixed a bug where
      fonts would occasionally get corrupted.
  - name: 1.2.1
    description: New preset librarian adds Categories, Tags, Descriptions, Artist
      links, Favorites, and Search to presets. Multi level undo/redo for easier
      workflow. True A/B comparison for making better mixing decisions. SET AS
      DEFAULT button allows you to save any settings as your default. Fixed a
      bug in COMPENSATE LEVEL where the level was sometimes affected by the
      previous state.
  - name: 1.1.2
    description: Support for AAX Silicon Native (Mac only). Improved performance on
      Windows. Removed support for Windows 8.
  - name: 1.0.3
    description: There's now a LINK knob in the Level Detector section which
      controls the stereo linking. The Gain Reduction meter is now scaled by the
      MIX knob. Fixed a bug where the radar control wasn't writing automation
      data in some hosts. Added little EQ curves above each tone control button.
      Made the whole plug-in UI dim when bypassed, and the individual tone
      sections dim when bypassed. Control, option, and shift clicking now works
      in the tone control section. You can now reliably grab the radar control
      when the dot is against the edge of it. Gain Reduction meters now default
      to 0dB. Fixed a bug where Invigorate could sometimes instantiate at a size
      larger than the screen on high DPI Windows displays. The SETTINGS page now
      contains a SHOW METERS button, as well as a BRIGHTNESS control for those
      meters.
  - name: 1.0.1
    description: New artist presets from Damian Taylor (The Prodigy, Bjork, The
      Killers). New artist presets from John Nathaniel (OneRepublic, Shawn
      Mendes).
  - name: 1.0.0
    description: Initial Release
