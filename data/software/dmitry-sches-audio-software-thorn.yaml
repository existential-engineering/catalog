description: "Thorn is a software synthesizer that was designed to be easy to
  use and deliver awesome sound. Intuitive workflow, high quality processing
  modules, light on the CPU, Thorn is ready to be put at the heart of your mix,
  in any genre of modern electronic music production."
details: |-
  64-bit

  3 spectral synthesis oscillators with 16-frame spectrum tables

  2 multi-mode analog modeled filters with saturation stages

  9 high quality effects

  3x ADSR envelopes, 3x LFOs, 2x multistage envelopes

  16-step flexible arpeggiator with MIDI output

  Grid-based Glitch sequencer for stuttering effects

  FM synthesis
  RM synthesis
  PWM
  Hard Sync
  Spectral synthesis
  Harmonic editing and morphing
specs: |-
  - Modern processor with SSE3 support
  - Windows Vista or higher
  - OSX 10.9.X or higher
  - VST 2.4 or VST 3 or AU or AAX compatible host software
