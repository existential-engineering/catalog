description: Bit-perfect emulation of the SN76489 PSG sound chip from the Sega Master System with extended AY-3 8910 features, designed for chip music and modern 8-bit music production.
details: |-
  The SN76489 PSG was the natural buddy of the YM2612 FM chip inside the Sega Megadrive console but it started out as the one and only sound chip of the Sega Master System. Super PSG (SPSG) is a bit-perfect emulation of the chip, with a tweakable master clock to change frequency range/accuracy.

  The Z80 CPU can emulate some YM2149 / AY-3 8910 features (ZX Spectrum, MSX, Atari ST) on the SN76489, programming complex amplitude and pitch envelopes, arpeggios, looping and even wavetables. PCM samples can be played on the volume register or raw PWM can be output. The Noise channel bit configuration can be hacked in real time.

  SPSG can also sound like Atari ST sound thanks to the AY3 envelope implementation, with extended controls and MIDI OUT control over a real SN76489 sound chip using VGM conversion or special hardware, and can work with the GENMDM interface designed by Little Scale.

  Currently a 32-bit VST Windows format only, requiring a DAW with a built-in 32-bit bridge (such as FL Studio or Reaper) on 64-bit systems. A version 2.0 update with native x64 and macOS support is planned, timing unknown.
specs: |-
  - WIN 32 VST, runs on 32/64-bit systems, multicore compatible
  - Band-limited high quality tone and noise waveforms
  - 3 channels, poly and mono mode, with portamento control
  - Full MIDI automation with MIDI learn (right click to assign)
  - Direct chip output or console filtering (Sega Master System or Megadrive/Genesis)
  - Supports any clock rate from 1 MHz to 4 MHz
  - 1-64 step amplitude envelope generator, up to 300 Hz, sync or independent, loop/ping-pong/release step
  - 1-64 step pitch envelope generator, up to 300 Hz, sync or independent, loop/ping-pong/delay
  - LFO vibrato
  - Internal arpeggiator, programmable or live-controlled via MIDI
  - 8 memory slots per envelope, arpeggiator and waveform, internally sequenced
  - PCM and PWM sample playback, 4 slots, auto-converted to mono, PCM (4-bit) or PWM (1-bit) modes
  - Optional AY3-8910 emulated envelope generator with buzzers and sync buzz
  - Z80 software timer for pulse width modulation ("SID"-style lead sound or custom waveforms)
  - Real-time noise channel circuit bending (tweakable LFSR tapped bits mask and feedback bit)
  - MIDI out for amplitude and pitch
  - Load and save full patch and banks in FXB/FXP
  - Can control a real SN76489 chip via an ATMEGA MIDI controlled device (open source code available on request)
  - Controls Sega Master System and Megadrive hardware via MIDI, requires Little Scale SMSN/GENMDM device
  - System requirements: Windows XP/Vista/7 or newer, 32-bit host or 64-bit DAW using bridge/JBridge software, VST2.4
