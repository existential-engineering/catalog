description: Bit-perfect emulation of the SN76489 PSG sound chip from the Sega
  Master System with extended AY-3 8910 features, designed for chip music and
  modern 8-bit music production.
details: |-
  Super PSG (SPSG) is a bit-perfect emulation of the SN76489 PSG sound chip from
  the Sega Master System. It provides band-limited, high-quality waveforms for
  both tone and noise channels with 3-channel polyphonic and monophonic modes
  including portamento.

  The plugin features native SN76489 capabilities including configurable clock
  rate (1-4 MHz), 1-64 step amplitude and pitch envelope generators running up
  to 300 Hz, LFO vibrato, and an internal programmable arpeggiator. PCM and PWM
  sample playback is supported across 4 slots with auto-mono conversion.

  Extended features include AY3-8910 envelope generator emulation, Z80 software
  timer for PWM and custom waveforms, and real-time noise circuit bending via
  LFSR tweaking. The plugin supports direct chip output or console filtering
  modes emulating the Master System or Megadrive output stage.

  SPSG can control real SN76489 hardware via MIDI with open-source code
  available, and supports the GENMDM interface for Master System and Megadrive
  hardware control. Note that this is currently a 32-bit Windows-only VST with
  version 2.0 planned for 64-bit and macOS support.
specs: |-
  - Band-limited high-quality tone and noise waveforms
  - 3-channel polyphonic and monophonic modes with portamento
  - Configurable clock rate (1-4 MHz)
  - 1-64 step amplitude envelope generator (up to 300 Hz)
  - 1-64 step pitch envelope generator with loop/ping-pong
  - Internal programmable arpeggiator
  - PCM and PWM sample playback (4 slots)
  - AY3-8910 envelope generator emulation
  - Z80 software timer for PWM and custom waveforms
  - Real-time noise circuit bending (LFSR tweaking)
  - Direct chip output or console filtering (Master System/Megadrive)
  - 8 memory slots per envelope with wave-table sequencing
  - Full patch/bank save support (FXB/FXP formats)
  - Real hardware control via MIDI
