description: LA-2A opto compressor plugin with sidechain, 3 cells, mix and make-up gain. Smooth vocal, bass and bus leveling.
details: |-
  The VLA-2A Mark II is an expanded take on the classic opto compressor. The first VLA-2A stayed deliberately faithful to a two-knob unit, glorious for its simplicity, occasionally frustrating when a modern mix wanted more. The Mark II answers that without touching what made the original sing. You still get the program-dependent optical leveling, the tube warmth, the forgiving release. On top, there's a larger interface and a row of controls that pull a 1960s design into a 2020s session: Emphasis, Ext SC, a three-way Cell Selector, Make-Up gain and a Mix knob for parallel compression.

  The predecessor to the LA-2A dated back to the early 1960s and was first built for broadcast, before engineers noticed how well its multi-stage release and frequency-dependent response suited music. Black Rooster modelled that behaviour for the first VLA-2A, then asked a simple question for the Mark II: what would you add if you actually mixed on this every day. The answer wasn't a different compressor, it was more control over the same one. The emphasis filter network, transformers, tube stages and the T4A cell are all still modelled with real-time SPICE-style circuit simulation. Nothing about the core tone changed, the new controls sit around it.

  The Emphasis control drives a shelving pre-emphasis filter on the sidechain, so you can hold high frequencies in check and stop bright vocals or cymbals from over-triggering the compression. Flip Ext SC and the gain reduction follows an external sidechain source, handy for ducking and rhythmic pumping. The Cell Selector is the real character switch: three opto cells, each with its own attack, release and knee. Cell A gives a soft knee at a low ratio, Cell B a soft knee at a higher ratio, Cell C a hard knee at a higher ratio, from feather-light leveling to firm grab. Make-Up gain trims the output cleanly, and the Mix knob blends compressed and dry signal for parallel compression without a second bus.

  On lead vocals, pick Cell A for transparent leveling or Cell C when a performance needs a firmer hand, then use Emphasis to tame sibilant peaks before they hit the detector. On a drum bus, engage the Mix knob and squash hard on the wet path for that classic parallel thump while the dry signal keeps the transients alive.
