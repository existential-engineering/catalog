details: |-
  RHEC (formerly arch avenger pro) features two voltage controlled audio
  oscillators, each with separate three position octave slide switches, waveform
  selectors, and volume controls. Oscillator 2 has separate interval control and
  both oscillators have fine pitch control. Both oscillators have switchable
  response curves.

  Features include an lfo oscillator switchable between 7 waveforms, voltage
  controlled amplifier, and moog voltage controlled filter with 24db/octave and
  self oscillation feature.

  Separate contour generators for vca and vcf, stereo multitap delay effects,
  and frequency analyser are included.

  Supports monophonic or polyphonic operation with retrigger option in mono
  mode, velocity control, and full MIDI/VST automation that can be controlled
  from an external keyboard.

  Sixty presets are included with 6 note polyphony capability.
specs: |-
  - Two voltage controlled audio oscillators
  - Three position octave slide switches
  - Waveform selectors
  - Volume controls
  - Oscillator 2 interval control
  - Fine pitch control
  - Switchable response curves
  - LFO oscillator with 7 waveforms
  - Voltage controlled amplifier
  - Moog voltage controlled filter
  - 24db/octave filter
  - Self oscillation feature
  - Separate contour generators for VCA and VCF
  - Stereo multitap delay effects
  - Frequency analyser
  - Monophonic operation
  - Polyphonic operation
  - Retrigger option in mono mode
  - Velocity control
  - Full MIDI/VST automation
  - 6 note polyphony
  - Sixty presets included
  - Windows compatible
