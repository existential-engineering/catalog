description: "Blue cat's Dynamics is a complete Dynamics effect processor: it
  can be used as a compressor, limiter, gate, expander or even waveshaper."
details: |-
  Blue cat's Dynamics is a complete Dynamics effect processor: it can be used as
  a compressor, limiter, gate, expander or even waveshaper for distortion. You
  can manage the Dynamics response of the plug-in with a unique two-thresholds
  system.

  The plug-in includes an input filter as well as a side chain filter, in order
  to control the frequencies affected by the compression. Its continuous
  vca/opto and peak/rms controls let you smoothly and precisely choose the
  behavior of the envelope detection.

  Main features: full featured dynamics processor: compressor, gate, limiter,
  expander, waveshaper. Total control over the processor: continuous peak/rms
  and opto/vca modes selection. Total control over the signal: dry/wet control
  for parallel compression, input and side chain filters. Stereo or mid-side
  processing with multiple channels linking options. Post brickwall limiter or
  waveshaper.

  Optimal monitoring: dynamics response and input/output envelopes real time
  display with zooming capability, the main compression information can be
  recorded as automation curves. Best quality: up to 4x oversampling for the
  best sounding quality. Side chaining made easy: a unique way to perform side
  chain compression, ducking, gating and much more.

  Blue cat audio standards: supported platforms: mac-AU, mac-VST, windows-dx,
  windows-VST. Native dsp code for optimal performance. Skinnable user
  interface. Smooth update: silent (zipper-free) parameters update. Full
  automation support (all parameters can be automated, with smooth and
  continuous update). No cpu load on idle: when the plug-in is fed with silence,
  the processing smoothly shuts down, to optimize the cpu usage of your digital
  audio workstation. Real time MIDI control with advanced settings (MIDI channel
  and cc numbers, with complete response curve control) and MIDI learn.
  Automation and MIDI output: record output parameters as automation curves or
  send MIDI cc messages to other plug-ins for powerful side chain effects.
  Smooth bypass: activate/deactivate the plug-in with absolutely no noise.
  Undo/redo. Import/export presets in a host independent format. Any sample rate
  supported.
