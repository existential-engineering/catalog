details: |-
  Absolute piano: erard upright. This piano has been sampled from a half concert grand bosendorfer 225. It has a very large musical spectrum sound. It has been recorded every 2 notes, with 4 level of velocity. V4 introduce smooth cross fade between each layer for a better transition between each velocity layer.

  About the erard upright: this was my own piano when I was leaving in paris. I spent a significant time to tune it and record it during the year 2007 just before I move to florida usa. It has been recorded every 2 notes, with 4 level of velocity. V4 introduce smooth crossfade between each layer for a better transition between each velocity layer.

  New: version 4.2 upgrade for all pianos. In this upgrade I introduce a new revolutionary concept that will be developed in the v5. The idea is to emulate not only the sound of the piano by using a quality soundbank and adding real time specific effects on it, but truly emulate the resonance of the piano from the inside.

  The absolute piano concept is to bring to the pianist a lightweight yet fantastic sounding piano emulation, where you have plethora of options to enjoy playing your favorite pieces, but using today's technology for a new exciting musical experience. Polyphony: the absolute piano can play 128 notes simultaneously!

  Absolute pianos are loading in memory in less than 10 seconds on a regular computer. Absolute pianos are running on netbooks and small laptops. And are sounding the same! You can play piano using the MIDI, with the mouse, or even with your computer keyboard (in stand alone mode only). In stand alone mode when the piano play a MIDI file, you can see what is playing and you can play on the top of it.
