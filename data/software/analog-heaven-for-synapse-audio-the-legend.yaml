details: >-
  Synapse audio the legend is an emulation of the minimoog model d hardware
  synthesizer. The developer states, "every component, ranging from the
  voltage-controlled oscillators (vcos), voltage-controlled filter (vcf) and
  voltage-controlled amplifier (vca), have been modeled to an accuracy never
  seen before in software."


  Analog heaven is a preset collection focused on vintage sounds for the legend.
  Since the focus is "vintage synths", "analog heaven" is all about vintage
  sounds.


  The preset collection includes 121 presets for the legend organized into
  categories: pads, keys, bass, leads, organs, percussion, and fx.
