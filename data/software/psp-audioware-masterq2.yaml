description: Typically, mastering equalisers are purely focused on the process of equalization, but PSP MasterQ2 is not merely a mastering EQ. The "Q" stands for "Quality." PSP MasterQ2 was designed to be a creative tool for mixing and mastering or wherever its features and quality are needed.
details: |-
  PSP MasterQ2 can operate at sampling rates ranging from 44.1kHz all the way up to 768kHz. It offers seven different filters: 12, 24, and 36 dB/oct low cut and high cut filters, low shelf and high shelf filters which can be switched to peaking filters, and low-mid, middle and high-mid peaking filters, all with adjustable frequency and Q over a wide range.

  The EQ graph displays an overview of the EQ curve, as well as the individual characteristics of each filter. In addition to its powerful filters, PSP MasterQ2 also offers a selection of limiting and "soft-clipping" algorithms to help shape the signal and keep it from digitally peaking.

  PSP MasterQ2 employs astoundingly precise 80-bit extended floating point computations in all filters to deal with any accumulation errors. It also allows for optimal filter operation at even the lowest frequencies with high gain and Q factor settings.

  PSP MasterQ2 also makes use of PSP's proprietary Frequency Authentication Technique algorithm. "FAT" is a double sampling technique which allows for proper filter operation at the highest frequencies. This mode utilizes high order linear filters to prevent phase errors and linear errors from the audio bandwidth caused by double order sampling. This technique results in double sampling without any sample rate conversion artifacts.

  PSP MasterQ2 can be used as a precise, surgical EQ for mastering or as a color processor for sound design and mixing.
specs: |-
  - Operates at sampling rates ranging from 44.1kHz up to 768kHz
  - Seven different filters
  - 12, 24 and 36 dB/oct low cut and high cut filters
  - Low shelf and high shelf filters, switchable to peaking filters
  - Low-mid, middle and high-mid peaking filters, all with adjustable frequency and Q over a wide range
  - EQ graph displaying an overview of the EQ curve as well as the individual characteristics of each filter
  - Selection of limiting and soft-clipping algorithms
  - 80-bit extended floating point computations in all filters
  - Proprietary Frequency Authentication Technique (FAT) double sampling algorithm using high order linear filters
  - Latency around 1100 samples (26ms at 44.1kHz)
  - Requires an iLok user ID and the free iLok License Manager application, no hardware dongle required
  - License can be activated in 3 separate locations, each either a computer or an iLok dongle (2nd generation or above)
  - Windows 7 - Windows 11, 64-bit VST, VST3 and AAX
  - macOS 10.14 - macOS 15 Sequoia, 64-bit AudioUnit, VST, VST3 and AAX
  - macOS Intel and macOS Silicon
