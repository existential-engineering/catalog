description: PSP MasterQ2 is a high-end mastering equalizer designed as both a surgical mixing and mastering tool and a creative sound-shaping instrument. It combines precision equalization with advanced processing algorithms, making it suitable for professional audio processing across mixing, mastering, and sound design applications.
details: |-
  PSP MasterQ2 is a high-end mastering equalizer serving as both a surgical tool and a creative instrument. Features seven configurable filter types including low/high-cut filters at 12, 24, and 36 dB/octave slopes, switchable shelf to peaking filters, and low-mid, middle, and high-mid peaking filters.

  Uses 80-bit extended floating-point processing for precision at low frequencies and PSP's proprietary Frequency Authentication Technique (FAT) for accurate high-frequency operation. Visual EQ graph displays the overall curve and individual filter characteristics.

  Includes limiting and soft-clipping algorithms. Operates at sampling rates from 44.1kHz up to 768kHz. iLok License Manager required (no dongle). 30-day trial available.
specs: |-
  - Sampling rates: 44.1kHz to 768kHz
  - Seven configurable filter bands (low/mid/high-cut at 12/24/36 dB/oct, shelves, peaks)
  - 80-bit extended floating-point processing
  - PSP FAT (Frequency Authentication Technique)
  - Latency: ~1,100 samples (~26ms at 44.1kHz)
  - Limiting and soft-clipping algorithms
  - Formats: AU (macOS), VST, VST3, AAX
  - Platforms: Windows 7–11 (64-bit), macOS Intel/Silicon 10.14–15
