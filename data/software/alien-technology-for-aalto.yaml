details: |-
  The alien technology soundset contains 132 presets, comprised mostly of exotic machines, atmospheres, foleys, special effects and abstract sequences; with a small serving of instrument sounds to round out the collection.

  These patches are particularly well-suited to film and game scorers as well as producers of idm/braindance, ambient, avant-garde, glitch, minimal techno and future garage.

  Please note that madrona labs aalto is required to use these sounds.

  For the following genres: ambient, idm, glitch, space music, filmscore, minimal techno, breakbeat, industrial, underground/chilled dubstep.

  Bryan 'xenos' lee has worked as a sound designer for such companies as native instruments, cakewalk, rob papen inspiration soundware, refx, camel audio, image-line and many more.
