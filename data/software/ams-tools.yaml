  aMS-Tools is a set of three "mid-side" tools in the VST plug-in format. Using
  these tools you can encode left-right stereo channels to mid-side, decode
  mid-side to left-right and adjust mid-side balance.

  Ams-tools includes: ams-tools encoder, ams-tools decoder, ams-tools balancer
