description: A vintage plate reverb emulation bringing the classic sound of the EMT 140 plate reverberator to your DAW. Captures the smooth timbre and plate-specific density of one of the most sought-after analog reverb units, extending the original's five-second maximum decay time all the way to 32 seconds for cinematic effects. A three-band EQ, Width, Balance, and up to 500 ms of PreDelay give full control over character and placement.
details: |-
  Emulates the EMT 140 plate reverberator. Extended decay time up to 32 seconds (vs. 5-second hardware limit). Gain-compensated preamp section models input stage. Three-band EQ (low cut, low shelf, high shelf). PreDelay up to 500 ms. Width and Balance controls. M1 Apple Silicon native. Regular price $59 (launched at $29 intro through April 29, 2022).
specs: |-
  Controls: Decay time (up to 32 s), Preamp gain, Low cut, Low shelf, High shelf, PreDelay (up to 500 ms), Width, Balance. macOS 10.12+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+, 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX. Copy protection: serial number.
