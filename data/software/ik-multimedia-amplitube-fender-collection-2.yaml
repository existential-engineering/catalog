details: |-
  Fender collection 2 draws inspiration from some of the most historic and
  iconic fender amplifiers, adding a modern touch to the timeless classics and
  re-issues that fit and define a multitude of genres. Fender collection 2
  captures the vintage vibe, feel and sound of fender's classic amps and puts
  them into your production toolbox on your mac or pc.

  The fender collection 2 for amplitube is the ultimate collection of original
  fender amplifiers and reissues from the 1950s and 1960s. In fender collection
  2 you'll get all of the glorious "tweeds" from the '57 custom series, a
  refined, player-centric take on a classic platform that includes the '57
  deluxe, the '57 champ, '57 pro, '57 twin and '57 bandmaster. Plus you get a
  spot-on model of an original 1953 bassman and a 1965 blackface super reverb.

  Fender collection 2 for amplitube is an officially certified collection of
  fender gear that works inside of the world's best-selling guitar and bass tone
  studio - amplitube for mac & pc. You'll get all of the glorious guitar and
  bass tones from these legendary and modern machines, plus the ability to tweak
  every aspect of them.

  In amplitube 4, you can use the cab room to completely customize your setup by
  changing the recording space, microphone techniques and choices, speaker
  cabinet and individual speaker swap, plus the ability to fine-tune the mix and
  balance in the cab room mixer section. And, as a collection available inside
  of amplitube 4, you can mix and match amps, cabs or complete rigs with other
  available gear for endless tone possibilities.

  For fender collection 2, we developed a completely new type of modeling mojo
  we like to call dynamic interaction modeling which once again leads the way in
  delivering a completely new level of ultra-realistic sound when modeling
  analog gear.
specs: |-
  - 64-bit support
  - Dynamic interaction modeling
