details: |-
  SR-88 is a sample-based plugin emulation of the Sound Master Memory Rhythm SR-88, a rare analog drum machine from the 80s.

  The instrument features 5 classic analog sounds: Kick, Snare, Hi Hat 1, Hi Hat 2, and Cymbal, which can be pitched, panned or mixed independently. The sound can be shaped further with a Low Pass Filter (Zero Delay Feedback), Overdrive, Compressor and Reverb.

  The sequencer lets you build patterns that can be dragged and dropped to your DAW or host, and the plugin ships with 15 factory presets and 15 factory patterns.

  SR-88 is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP). It is also available on the App Store for iPhone and iPad, as an AUv3 plugin and Standalone (IAA).
specs: |-
  - 5 classic analog sounds
  - 15 Factory Presets / 15 Factory Patterns
  - Low Pass Filter (ZDF)
  - Overdrive, Compressor, and Reverb Effects
  - Sequencer with MIDI Drag to DAW
  - Preset system with randomizer
  - Brightness and Contrast Controls
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP 64-bit)
  - macOS 10.13 - macOS 14, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP 64-bit)
  - 1 license up to 3 computers, no iLok, no internet connection required to activate
