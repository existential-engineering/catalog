details: |-
  Adsr drum machine is a beat making workhorse. Its intuitive interface including 16 pads above a tabbed browser, sound & fx, sequencer and mixer panel allows you to build a kit and lay down a beat straight out of the box. It has everything you need and expect in a modern drum plugin.

  Creative onboard processing is where adsr drum machine comes in to its own. A 3 stage envelope, per pad pitching and per pad multi channel processing set a new standard to tune your drum kit before and as you start playing. Adsr have built in the ability to split every pad into a separate transient and body which means you can clean, calibrate and enhance your samples right as you're working on your beat.

  You can get grooving straight away with 50+ kits featuring 800 unique patterns and royalty free samples across 10 popular genres. Flip your workflow in the best way possible and discover the clarity of going into a track with a perfectly polished rhythm section vs. The infirmity of revisiting your drums later in your DAW.

  Available for mac and windows as standalone, AU and vst3. Unlimited free trial for 30 days includes all features and kits.

  Drum machine lets you split every sample on every pad into two parts. Achieve a level of finesse you'd have spent hours in your DAW to achieve in minutes. With one click, you can separate the transient and the body into two channels each with its own unique fx chain.
