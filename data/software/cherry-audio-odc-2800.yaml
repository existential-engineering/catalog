details: |-
  ODC 2800 is an exceptional three-in-one virtual instrument that pays tribute
  to the legendary synth pioneer Alan R. Pearlman on the momentous 100th
  anniversary of his birth. It draws inspiration from the ARP Instruments
  Odyssey synthesizer launched in 1972 and replicates all three hardware
  versions: the Mk I 2800, Mk II 2810, and Mk III 2820.

  Cherry Audio has meticulously recreated each version with three UI designs
  matching the original hardware models. The instrument features monophonic,
  mono legato, duophonic, and polyphonic modes with up to 16 voices and a
  unison option for massive stacked sounds.

  The synthesis engine includes three complete VCOs with sawtooth and
  square/pulse waveforms, three frequency modulators per VCO with 35 assignable
  sources, extended oscillator sync routing, and ring modulation capabilities.
  Three VCF emulations cover the 12 dB two-pole, 24 dB four-pole ladder, and
  24 dB four-pole cascade filter types.

  ODC 2800 includes over 330 presets in 13 categories, a syncable dynamic
  arpeggiator with Swing, Chance, and Feel controls, and a suite of
  studio-quality effects including distortion, phaser, flanger/chorus, echo, and
  reverb. MusicRadar awarded it 5 stars, calling it one of the finest-sounding
  and best-looking synths around.
specs: |-
  - Three-in-one instrument replicating Mk I 2800, Mk II 2810, and Mk III 2820
  - Monophonic, mono legato, duophonic, and polyphonic modes (1, 4, 8, or 16 voices)
  - Unison option for stacked sounds
  - Three complete VCOs with sawtooth and square/pulse waveforms
  - Three frequency modulators per VCO with 35 assignable sources
  - Extended oscillator sync routing and ring modulation
  - Three VCF emulations: 12 dB 2-pole, 24 dB 4-pole ladder, 24 dB 4-pole cascade
  - Lowpass, bandpass, and highpass filter responses with separate highpass filter
  - Two ADSR envelope generators with velocity control
  - Two discrete LFOs with five waveforms
  - Sample and hold mixer with assignable modulation
  - Syncable dynamic arpeggiator with Swing, Chance, and Feel
  - Studio-quality effects: Distortion/EQ, Phaser, Flanger/Chorus, Echo, Reverb
  - Three UI designs matching original hardware with lock option
  - Over 330 presets in 13 categories
  - User-adjustable oversampling control
  - Complete MIDI control and DAW automation
