description: Cherry Audio’s ODC 2800 is an exceptional three-in-one virtual
  instrument that pays tribute to the legendary synth pioneer Alan R. Pearlman
  on the momentous 100th anniversary of his birth. This powerful synthesizer
  plugin draws inspiration from the revolutionary Odyssey analog duophonic
  synthesizer, launched by ARP Instruments in 1972.
details: |-
  ODC 2800 reproduces all three versions of the ARP Odyssey hardware, the 1972 Mk I 2800 series, the 1975 Mk II 2810 series and the 1978 Mk III 2820 series, using circuit-modelled DSP designs by developer Mark Barton. The user interface includes matching designs for Models 2800, 2810 and 2820, with a lock option and a hideable lower panel for the keyboard and effects that is reachable through a new tray.

  The duophonic architecture has been upgraded to support Monophonic, Mono Legato, Duophonic and Polyphonic modes. Users can choose from 1, 4, 8 or 16 voices, along with a unison mode. The synth supports velocity, channel aftertouch and polyphonic aftertouch with three assignable controls. It also includes adjustable portamento settings and a smart portamento for polyphonic performance. The syncable dynamic arpeggiator includes Swing, Chance and Feel to add degrees of randomness to arpeggiated patterns.

  ODC 2800 has been expanded to include three complete VCOs with sawtooth and square/pulse waveforms, with quantizable frequency control and extended oscillator sync routing. Each VCO has three frequency modulators (FM), including an assignable modulator offering 35 source options. Ring modulation is available, and cross-modulation is possible through the assignable FM menus. The LFO options feature two separate LFOs with five waveforms and options for mono and poly modes, key reset, sync, pulse width and delay. The Sample/Hold Mixer allows assignable modulation of the VCF and VCA with 35 predefined modulation sources.

  The VCF emulation features three filters: the Mk I 4023 (12 dB/Oct, 2-pole), the Mk II 4035 (24 dB/Oct, 4-pole ladder) and the Mk III 4075 (24 dB/Oct, 4-pole cascade). Each offers lowpass, bandpass and highpass responses, with optional gain compensation to prevent bass loss at high resonance, and a separate highpass filter is included. The envelopes comprise two complete ADSR envelope generators with velocity control, alongside trimmer-style drift controls for VCO, VCF and EG.

  An effects strip provides controls for toggling effects, soloing and adjusting the dry/wet mix, with global controls for enabling all effects, changing the overall level and expanding the stereo width. The expanded effects tray includes Distortion/EQ, a Dual Phaser, Flanger/Chorus, three Delays and five Reverbs. ODC 2800 also includes comprehensive MIDI mapping for controllers, DAW automation and over 330 presets across 13 categories.
specs: |-
  - Emulates the 1972 Mk I 2800, 1975 Mk II 2810 and 1978 Mk III 2820 Odyssey revisions
  - Over 330 presets in 13 categories
  - Monophonic, Mono Legato, Duophonic and Polyphonic modes with 1, 4, 8 or 16 voices, plus unison
  - Three complete VCOs, each with sawtooth and square/pulse waveforms
  - VCO frequency with quantize options
  - Extended oscillator sync routing
  - Three frequency modulators (FM) per VCO, including an assignable modulator with 35 source options
  - Portamento with adjustable VCO-2 and VCO-3 delay settings, plus smart portamento
  - Customizable Proportional Pitch Control (PPC) for pitch bend (+/-12 semitones) and PPC modulation (+/-7 semitones)
  - Noise generator with white, pink, violet and brown noise colors
  - Ring modulation and cross-modulation between VCOs via the assignable FM menus
  - Two discrete LFOs with sine, triangle, square, sawtooth and ramp waveforms, mono or poly, key reset, sync, pulse width and delay
  - Sample/Hold Mixer with assignable modulation sources
  - Three VCF emulations: 4023 (12 dB/Oct, 2-pole), 4035 (24 dB/Oct, 4-pole ladder) and 4075 (24 dB/Oct, 4-pole cascade)
  - Separate highpass filter
  - Lowpass, bandpass and highpass responses on all three VCFs
  - Selectable gain compensation on both 4-pole filters
  - Adjustable VCA drive
  - Individually assignable modulation controls in the mixer for VCF and VCA with 35 possible sources
  - Two full ADSR envelope generators with velocity control
  - Trimmer-style drift controls for VCO, VCF and EG
  - Matching UI panel designs for Models 2800, 2810 and 2820 with UI lock option and hideable keyboard and effects panel
  - Syncable dynamic arpeggiator with Swing, Chance and Feel, in regular, order or random play modes
  - Support for velocity, channel (mono) aftertouch and polyphonic aftertouch
  - Three distinct assignable aftertouch controls with 24 destinations
  - Effects panel with on/off, solo, bipolar modulator amount slider and dry/wet mix per effect, plus global FX on/off, level and stereo expand
  - Integrated effects: Distortion/EQ, Dual 4/8-stage Phaser, Flanger/Chorus, three Echo delays and five Reverb types
  - Syncable discrete Effects Modulator (FX LFO) with ramp, saw, triangle, sine, square and random waveforms, plus delay
  - Master Volume with Limiter, and Master Tune
  - Standalone and plug-in versions included
  - User-adjustable oversampling control
  - Complete MIDI control and DAW automation for all controls, with MIDI learn and mapping (Preset and Global)
  - Fully scalable UI with Focus zoom-in feature, standard UI zoom and resize via drag
  - macOS 10.13 or above, 64-bit, Intel or Apple Silicon, 85 MB hard disk space
  - Windows 7 or above (including Windows 11), 64-bit, 85 MB hard disk space
  - Internet connection required for product activation
