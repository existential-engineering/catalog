details: |-
  The IQ-Series Analyser has become an essential tool for spectrum and sound analysis. It defines the gold standard in workflow, possibilities and precision. >> Learn more about the IQ-Series Analyser Standalone The HOFA IQ-Series Analyser is the perfect tool to compare the frequency ranges of different audio tracks. This makes it very easy to find frequency overlaps or similar problems. Watch this video to find out how. You are currently viewing a placeholder content from YouTube . To access the actual content, click the button below. Please note that doing so will share data with third-party providers. More Information Unblock content Accept required service and unblock content The new generation of the IQ-Series Analyser shows the frequency spectrum as peak, hold, RMS and energy curve. The energy curve shows the frequency spectrum over time. Reference curves from various styles of music are included. You can create and save your own references as well. The high resolution frequency analysis, simultaneous display of multiple signals in one window, continuous frequency zoom and the seamless interaction with the HOFA IQ-Series EQ make the HOFA IQ-Series Analyser V2 an indispensable aid for your ears. Features V2.0.19: Analyser with peak, hold, RMS and energy curves High resolution analysis of the frequency spectrum Filter bank technology for 100 % precision (even at low frequencies!) Continuous frequency zoom, always using 121 measuring points in the selected range Selectable display resolution (from high resolution to octave band) Automatic highlighting of peaks and dips Sine waves can be played with the virtual keyboard Pink noise / white noise weighting Selectable input signal (mid, side, left, right) Simultaneous analysis of multiple input signals Two curves for M/S and L/R IQ-Series Analyser measurements can be sent to the IQ-Series EQ Track name import from host DAW (works with Pro Tools, Logic, Cubase, Nuendo) A multitude of reference curves for different style
