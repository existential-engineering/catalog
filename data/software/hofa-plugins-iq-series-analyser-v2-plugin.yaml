description: The IQ-Series Analyser has become an essential tool for spectrum and sound analysis. It defines the gold standard in workflow, possibilities and precision.
details: |-
  The IQ-Series Analyser has become an essential tool for spectrum and sound analysis. It defines the gold standard in workflow, possibilities and precision.

  The HOFA IQ-Series Analyser is the perfect tool to compare the frequency ranges of different audio tracks. This makes it very easy to find frequency overlaps or similar problems.

  The new generation of the IQ-Series Analyser shows the frequency spectrum as peak, hold, RMS and energy curve. The energy curve shows the frequency spectrum over time.

  Reference curves from various styles of music are included. You can create and save your own references as well.

  The high resolution frequency analysis, simultaneous display of multiple signals in one window, continuous frequency zoom and the seamless interaction with the HOFA IQ-Series EQ make the HOFA IQ-Series Analyser V2 an indispensable aid for your ears.
specs: |-
  - Analyser with peak, hold, RMS and energy curves
  - High resolution analysis of the frequency spectrum
  - Filter bank technology for 100 % precision (even at low frequencies!)
  - Continuous frequency zoom, always using 121 measuring points in the selected range
  - Selectable display resolution (from high resolution to octave band)
  - Automatic highlighting of peaks and dips
  - Sine waves can be played with the virtual keyboard
  - Pink noise / white noise weighting
  - Selectable input signal (mid, side, left, right)
  - Simultaneous analysis of multiple input signals
  - Two curves for M/S and L/R
  - IQ-Series Analyser measurements can be sent to the IQ-Series EQ
  - Track name import from host DAW (works with Pro Tools, Logic, Cubase, Nuendo)
  - A multitude of reference curves for different styles of music
  - All reference curves are available as mid, side, left and right signals
  - User-created reference curves
  - Analysis of .wav, .aif, .mp3, .flac, .ogg files via drag & drop directly from Explorer or Finder
  - Direct analysis via drag & drop in Cubase, Nuendo and Logic
  - Innovative 31 band frequency correlator
  - Goniometer and correlation meter
  - Precise metering (peak, hold, EBU, LRA, RMS)
  - Multiple instances in one window (e.g. drums/bass/guitars/vocals)
  - Scalable plugin window size
  - Screenshot feature
  - Supports all common sample rates and works without latency
  - Optional auto clear option on playback start
  - Network functionality to connect to the new IQ-Series Analyser (Standalone)
  - Formats: VST3, AU, AAX
  - Operating System: macOS 10.13 or later, Windows 10 or later
  - Two licenses available, managed via the HOFA Plugins Manager, deactivatable and transferable to other computers
  - Offline activation and use is possible
