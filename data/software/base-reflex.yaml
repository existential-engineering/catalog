description: The laziest way to tighten your low end. Base Reflex is an audio
  plugin designed to clarify and add punch to your low end, without changing ...
details: |-
  Base Reflex is an audio plugin designed to clarify and add punch to your low
  end, without changing your EQ balance. It does this using intelligent dynamics
  and saturation that you can dial in quickly because it's automatic.

  Set the release time to best match the groove of your material. Turn up the
  compression dial for more punch, but avoid choking off any sustained
  low-frequency tones. Click the gain reduction display for instant a/b test
  (still uses cpu as if plugin activated). Double-click to reset a dial to its
  default value, or hold / to fine-tune.

  Use base reflex on your master bus or on individual low-end tracks.

  Available in vst3 format for pc, and vst3 & AU formats for mac. AAX support
  coming soon. Requires a compatible digital audio workstation or other plugin
  host.

  Plugin is designed for common audio signals such as music and voice; may not
  react meaningfully to artificial test signals such as chirps, impulses or
  bursts.
specs: |-
  - Low-band processor with adjustable crossover frequency (50-300hz) and solo
  function

  - Automatic compression threshold

  - Variable attack and release times

  - Simple automatic gate with adjustable range up to 6db

  - Subtle low-band saturation with automatic gain-staging (oversampled if
  project sample rate is below 80khz)

  - Parallel processing via dual gain-matched dry/wet mix controls for dynamics
  and saturation

  - Mid-side processing (100% unlinked), with mono option for low band

  - Automatic make-up gain to match perceived loudness

  - Vst3 format for pc

  - Vst3 & AU formats for mac

  - AAX support coming soon

  - Up to 12ms latency from perfect-reconstruction crossover filters

  - No external sidechain capability

  - Universal 2 binary
