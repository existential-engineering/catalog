details: |-
  Alien Ossarium by Eplex7 DSP is a dark mythical plugin effect that decomposes sound into quantum particles from parallel worlds and combines these particles into a new metaphysical substance to transform ordinary beats into surreal avant-garde.

  The effect creates a synthetic derivative with similar rhythms and filtering based on the input sound, which it rhythmically adjusts and layers with the original sound according to your requirements. Ossarium not only creates a layer, but also effects and modifies the input sound itself.

  Alien ossarium is suitable for use with beats, percussion, synthesizers fx sounds, surfaces, ethereal textures, pads, soundscapes, drones, leads, for experimental bass design, and sounds great with modular synthesizers.

  It is suitable for a wide range of genres from film music, experimental music to darkpsy, psycore, hitech, darkprog, horror, thriller, industrial, nihilistic ebm, neurofunk, dark riddim, ambient, downtempo, dark ambient, numetal, techno, industrial techno, videogame music and others.

  The preset manager includes 22 presets such as: alien bones, deep waters, dungeons, eating monster, electric discharge, elektrons, fear architect, high horror, lab mouse cyborg, noir, rust, spiritochondria, tronikal, vaza and many others.
specs: |-
  - VST plug-in effect in 32 and 64-bit

  - Ossarinator 1 with oscillators: moklyus, alien bones, spiritus, deigitus, dungenus, electric discharges, gothikal, alien metallic material, alien particles, alien electro temple

  - Ossarinator 2 with oscillators: monstrium, spaceship, metalurgium, fear architecture, prophetium, monster speaking, okleytarium, atresorium, esakralia, soraps

  - Tone setting for each ossarinator

  - Dungeon knob

  - Gates knob

  - Ossarium oscillator filtering with freq and bandwidth controls

  - Attack / release for setting the ossarinators rhythm

  - Roof knob

  - Dry / wet control

  - Preset manager with 22 presets

  - Windows 32-bit / 64-bit VST host compatibility

  - VST 3 plugin support
