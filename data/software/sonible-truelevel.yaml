description: true:level is a metering plug-in that visualizes the interplay
  between loudness and dynamics in a meaningful way, making it immediately
  apparent whether a mix is ready to publish. It combines real-time true peak,
  loudness and dynamics readouts with reference targets and text-based
  suggestions.
details: |-
  true:level is a metering plug-in that shows loudness and dynamics together rather than in isolation, so the link between the two values is readable at a glance and it stays apparent whether a mix is ready to publish.

  The plug-in ships with a range of predefined references, including the loudness standards of publishing platforms and dynamic references for different genres. Aiming for those reference values avoids unpleasant surprises at publication, and up to 8 custom reference tracks can be loaded to compare a mix against for consistency across an entire project.

  The visualization draws a calculated reference zone from the chosen loudness and dynamics reference, or from the uploaded custom reference tracks. When a track sits outside that zone, the Level Check gives text-based hints on which actions are needed to bring it inside.

  Key readouts are deliberately limited to the ones that matter and are backed by target indicators, so the distance to the chosen reference stays visible without reading every number. Readouts cover integrated, short-term and momentary loudness in LUFS, loudness range in LU, dynamics in dB based on the peak to loudness ratio, and true peak in dBTP using high-resolution oversampling.

  Mono, stereo and Dolby Surround 5.1 material is supported at sample rates from 44.1 kHz to 192 kHz, with native Apple Silicon support. true:level is also offered alongside true:balance as part of sonible's Metering Bundle.
specs: |-
  - Real-time metering of true peak, loudness and dynamics
  - Loudness [LUFS]: integrated, short-term, momentary
  - Loudness Range [LU]: integrated, short-term, momentary
  - Dynamics [dB] based on peak to loudness ratio
  - True Peak [dBTP] using high-resolution oversampling
  - Predefined references including publishing platform loudness standards and genre dynamics references
  - Up to 8 custom reference tracks for project-wide consistency
  - Calculated reference zone with target indicators on the key readouts
  - Level check with text-based suggestions
  - Plug-in formats (Mac): VST, VST3, AU, AAX
  - Plug-in formats (Windows): VST, VST3, AAX
  - Supported formats: mono, stereo, Dolby Surround 5.1
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok
  - Latest version: 1.0.4
  - Apple Silicon support: native
  - System requirements (PC): Windows 10+ (64 bit)
  - System requirements (Mac): MacOS 10.12+
  - 4GB RAM
  - CPU: Intel Core (i5), Apple Silicon
  - GPU: OpenGL Version 3.2+
