description: true:level is a metering plug-in that visualizes the interplay between loudness and dynamics in a meaningful way, making it immediately apparent whether a mix is ready to publish. It combines real-time true peak, loudness and dynamics readouts with reference targets and text-based suggestions.
details: |-
  true:level is a metering plug-in that visualizes the interplay between loudness and dynamics in a meaningful way, making it immediately apparent if a mix is ready to publish. It offers real-time metering of true peak, loudness and dynamics, predefined references and custom reference options, and a level check with text-based suggestions.

  true:level comes with a range of predefined references, including the loudness standards of publishing platforms and dynamic references for different genres. Aiming for these reference values avoids unpleasant surprises when publishing a mix. To ensure consistency across an entire project, up to 8 reference tracks can be loaded to compare a mix with.

  The plug-in makes the link between loudness and dynamics of a mix immediately apparent and provides a holistic overview of both values. The calculated reference zone is specified either by the chosen loudness and dynamics reference or by the custom reference tracks that were uploaded. For guidance on how to modify a track to bring it within the reference zone, the Level Check provides hints as to what actions are needed.

  All displayed readouts as well as their visualizations are designed so that what is shown does not have to be second-guessed, and so that too many details do not become a distraction. true:level's key readouts are supported by target indicators, showing whether a track is close to the values of the chosen reference.

  Key readouts are monitored at a glance: loudness in LUFS (integrated, short-term, momentary), loudness range in LU (integrated, short-term, momentary), dynamics in dB based on the Peak to Loudness Ratio, and true peak in dBTP using high-resolution oversampling.
