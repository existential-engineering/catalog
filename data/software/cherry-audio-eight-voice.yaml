details: |-
  Cherry Audio's most ambitious instrument to date, Eight Voice polyphonic
  synthesizer meticulously emulates the immense sound of the Oberheim Eight
  Voice, one of the world's rarest and most desirable vintage instruments.
  Above all, Eight Voice knocks it out of the park with an incredibly accurate
  and huge sound, courtesy of award-winning synth designer Mark Barton's
  detailed emulation of the magnificent Oberheim state-variable filter.

  Predating modern microprocessor control, the original's eight independent
  dual-oscillator voice modules could be challenging to program. Cherry Audio
  Eight Voice's unique Voice Link controls allow simple and powerful grouping of
  voice module controls, eliminating individually setting each module's controls
  when homogenous poly sounds are desired.

  Focus buttons allow instant enlargement of any section of the user interface,
  making sound programming a breeze, and massively flexible keyboard assign
  modes enable endless mono and poly keyboard zoning and layering options with
  two separate poly assign buses.

  Eight Voice also includes a feature-packed eight-step mini sequencer with
  half-step quantizer and tempo sync, and high quality modulation delay and
  reverb effects. With over 330 presets and an unbelievably affordable price,
  Eight Voice is truly bursting with unique sound possibilities.
specs: |-
  - Eight fully independent dual-oscillator voice modules
  - Oberheim multi-mode filter emulation by Mark Barton
  - Over 330 presets
  - Massively configurable mono and poly keyboard assignment modes
  - Independent key range settings for layering and zoning
  - Voice linking for voice control grouping
  - Focus buttons for UI enlargement
  - Two separate poly assign buses
  - Additional LFO with six waveforms and tempo sync
  - Eight-step mini sequencer with half-step quantizer and tempo sync
  - Studio-quality reverb and mod delay with tempo sync
  - Full MIDI control and DAW automation
