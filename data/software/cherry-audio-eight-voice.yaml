details: |-
  Eight Voice polyphonic synthesizer meticulously emulates the immense sound of the Oberheim® Eight Voice, one of the world’s rarest and most desirable vintage instruments. Predating modern microprocessor control, its eight independent dual-oscillator voice modules could be challenging to program.

  Eight Voice’s Voice Link controls allow simple and powerful grouping of voice module controls, eliminating individually setting each module’s controls when homogenous poly sounds are desired. Focus buttons allow instant enlargement of any section of the user interface, and massively flexible keyboard assign modes enable endless mono and poly keyboard zoning and layering options.

  The sound comes courtesy of award-winning synth designer Mark Barton’s (MRB) detailed emulation of the Oberheim state-variable filter. Eight Voice also includes a feature-packed eight-step “mini” sequencer, and high quality modulation delay and reverb effects.

  Eight Voice is available in AU, VST, VST3, AAX, and standalone formats. A free 30-day demo is available, which plays white noise periodically but is otherwise unlimited.
specs: |-
  - Eight fully independent dual-oscillator voice modules
  - Oberheim multi-mode filter emulation by synth designer Mark Barton (MRB)
  - Over 330 presets
  - Massively configurable mono and poly keyboard assignment modes
  - Independent key range settings for layering and zoning options
  - Flexible Voice Linking for voice control grouping
  - Focus buttons for instant enlargement of all areas of the user interface
  - Two separate poly assign buses for stacked poly patch creation
  - Additional LFO with six waveforms and tempo sync
  - Eight-Step Mini Sequencer with 1/2-step quantizer and tempo sync
  - Studio-quality reverb and mod delay with tempo sync
  - Full MIDI control and DAW automation for all controls
  - macOS 10.13 or above, macOS 13 Ventura supported, 64-bit required, native Apple M1 or greater processor support including Ultra, 3.4 GHz Quad-Core or M1 CPU with 8GB of RAM recommended
  - Windows 7 or above (including Windows 11), 64-bit required, quad-core computer with 8GB of RAM recommended
  - Internet connection required for product activation
