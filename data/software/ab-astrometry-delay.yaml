details: |-
  'ab astrometry delay' is an advanced multitap three-dimensional delay which features up to eight taps, each acting as an individual acoustic spot that envelops you in sound, transforming the space around your head. Whether you're working with mono, stereo, or immersive signals 'ab astrometry delay' analyses the loudest coordinates of your soundfield, transforming them into distinct acoustic spots.

  These spots exist per tap and can bounce in a three-dimensional manner around your head for an immersive auditory experience. Within 'ab astrometry delay', you can configure each tap to either process audio serially, following the previous tap, or in parallel, directly from the source signal.

  Each tap offers customizable controls for 'viscosity' (sound elasticity), loudness, and timing—adjustable freely or synced with your DAW from 64th triplets to 2nds. Moreover, four modulators can be assigned to most controls for unique constant transformations in your sound.

  'ab astrometry delay' is compatible with mono, stereo, and ambisonics sources (1oa through 7oa*) and will output stereo and ambisonics signals (1oa through 7oa*) that can later be decoded to any speaker array imaginable. From binaural stereo, to surround, dolby atmos layouts and even custom speaker arrays.
specs: |-
  - Multitap three-dimensional delay
  - Up to eight taps
  - Acoustic spots
  - Serial and parallel tap processing
  - Viscosity control (sound elasticity)
  - Loudness control
  - Timing adjustment (64th triplets to 2nds)
  - DAW sync
  - Four modulators
  - Mono input support
  - Stereo input support
  - Ambisonics input (1oa through 7oa)
  - Stereo output
  - Ambisonics output (1oa through 7oa)
  - Binaural stereo decoding
  - Surround decoding
  - Dolby atmos decoding
  - Custom speaker array decoding
  - Windows 10+
  - Macos intel
  - Macos silicon 10.13+
  - AAX plugin
  - Vst3 plugin
  - Audio units plugin
  - Compatible with all major daws
