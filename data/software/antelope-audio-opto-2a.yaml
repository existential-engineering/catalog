details: |-
  Opto-2A is a tube optical compressor / limiter plugin that runs natively in your DAW on macOS or Windows, or in real-time on Antelope Audio's Synergy Core interfaces.

  This iconic unit from the 1950s is the compressor that started it all. A broadcast and recording studio legend, the Opto-2A's continued use over half a century after its inception is a testament to its brilliance. Its exceptionally warm sound and gentle compression character make it a beloved piece of audio engineering for generations of artists and producers.

  The key to its unique personality is the T4 optical attenuator, the outcome of time spent developing optical sensors for the US military. Its sonic signature is the two-stage release which greatly contributes to its smooth and musical compression. With only Gain and Peak Reduction knobs to adjust, the Opto-2A is exceedingly simple to dial in. And with a turn of the switch, the compressor becomes a limiter.

  Although the Opto-2A is infinitely versatile, it's best heard on vocals due to its incredibly pleasant response to the human voice. It's well suited for talking or singing through to hear its impact on a performance.
specs: |-
  - Tube optical compressor / limiter modeled after the iconic 1950s broadcast and studio unit
  - T4 optical attenuator behavior with characteristic two-stage release
  - Simple control set: Gain and Peak Reduction knobs
  - Compressor / Limiter mode switch
  - Compression ratio varies depending on the source signal
  - Average attack time fixed at 10 milliseconds
  - Initial release time around 60 milliseconds for 50% of the release, with the rest occurring gradually over 1 to 15 seconds
  - Release timing responds to length and strength of incoming signal (slower under prolonged heavy compression, faster below threshold)
  - Runs natively in your DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core interfaces
