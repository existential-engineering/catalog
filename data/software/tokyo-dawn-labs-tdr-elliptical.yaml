description: "Specializes in controlling stereo width at low frequencies using
  elliptical filters that operate on the stereo difference channel. Provides
  precise analysis and control of both Stereo Difference and Stereo
  Correlation."
details: |-
  Version 1.2.1. Minimum phase and linear phase operation. Continuously variable filter slope. Filter energy compensation options including harmonic generators. Freely resizable hardware-accelerated UI with frequency analyzer. Down to DC analysis capability.
