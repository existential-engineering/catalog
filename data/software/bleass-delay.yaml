description: BLEASS Delay is a multi-purpose delay / echo / frequency shifter
  with high pass & low pass filters as well as stereo effects. It transforms
  your sounds into cinematic and experimental sonic experiences!
details: |-
  BLEASS Delay is a multi-purpose delay / echo / frequency shifter with high
  pass & low pass filters as well as stereo effects. It transforms your sounds
  into cinematic and experimental sonic experiences!

  It is constantly creating flux in the audio signal making your music even more
  lively. Bleass delay is also ideal for making track build-ups and transitions.

  Features include a delay line with sync and ping pong stereo options, and a
  frequency shifter in the feedback stage for creating harmonic flux.

  Two filters (low pass / high pass with resonance) are included for creating
  warm analogue echo effects.

  Each stage has its own lfo with stereo phase to create even wider space
  movements.
specs: |-
  - Delay line with sync and ping pong stereo options
  - Frequency shifter in the feedback stage
  - High pass filter with resonance
  - Low pass filter with resonance
  - Stereo effects
  - LFO with stereo phase
  - macOS 10.9 and later (64-bit only)
  - Windows support
  - iOS support
