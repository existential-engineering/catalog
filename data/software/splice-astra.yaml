description: Astra is a polysynth with FM, wavetable, granular, analog, and
  sampler oscillator sources—plus limitless customizability, presets galore.
details: |-
  Astra is a polysynth with FM, wavetable, granular, analog, and sampler
  oscillator sources plus limitless customizability, presets galore and deep
  integration with the Splice workflow.

  Astra's collection of oscillator sources range from glassy fm and granular
  glitchiness to classic analog warmth. It crushes lead sounds and sub-shaking
  basses, and definitely holds its own with evolving arps and transformational
  fx.

  Personalize any existing astra preset, or design sounds from scratch. Just
  drag and drop parameters to the four macros, name them what you want, and
  adjust multiple parameters in one motion. The macro sequencer lets you dial up
  the vibe, by assigning a step sequence to the macros for trance-like patterns
  and hypnotic rhythms.

  Astra's note sequencer lets you program rhythmic, in-sync synth sounds that
  add mind-opening movement to your music. With customizable sequencer lanes for
  pitch, velocity and gate, you can create squelching acid lines from scratch,
  turn your samples into percussion loops, or create and recall rich arpeggios
  locked to the scale of your choice.

  Astra's 10-slot modulation matrix lets you assign intricate interactions
  between its different modules—just drag-and-drop parameters to mod slots. Like
  a hardware synth, astra can sweep, morph and transform, to add layers of
  creativity to your musical creations.
specs: |-
  - FM oscillator
  - Wavetable oscillator
  - Granular oscillator
  - Analog oscillator
  - Sampler oscillator
  - Four macros
  - Macro sequencer
  - Note sequencer
  - Customizable sequencer lanes for pitch, velocity and gate
  - 10-slot modulation matrix
  - 225 factory presets
  - 8,000+ additional presets via Splice sounds
