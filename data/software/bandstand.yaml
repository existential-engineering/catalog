details: |-
  Bandstand is a versatile software instrument designed as the optimal solution
  for musicians, performers and producers that work with the general MIDI
  format. Bandstand includes an expressive "studio-quality" GM sound library and
  is equipped with a host of powerful and easy-to-use general MIDI features that
  make working with GM-based arrangements efficient and convenient, both in the
  studio and on stage.

  Bandstand is based on a powerful sound engine that draws from more than 2 gb
  of professional instrument and percussion sounds. The included 128 instruments
  and 9 drum kits were specifically selected and matched to always deliver a
  sonically coherent performance regardless of musical style or genre.

  A host of performance optimizations including full direct-from-disk
  functionality allow bandstand to efficiently operate on computers that are
  equipped with lesser amounts of memory. Bandstand can be used both as a
  stand-alone sound module and playback device, or as an instrument plug-in in
  all common host sequencers.

  The user interface of bandstand is specifically designed to be easy to pick up
  and use even for beginners, and offers a new and highly visual way to work
  with general MIDI arrangements. All 16 instrument channels are always visible
  simultaneously, and instruments can be easily assigned and replaced via a
  convenient drag&drop system. A quick edit bar offers an arsenal of powerful
  real-time performance functions that can be assigned to any instrument to
  alter its playing behaviour on-the-fly, including quantize, harmonize, scale,
  and micro tuning parameters.

  The integrated MIDI file player turns bandstand into a full-featured creative
  gm playback solution for solo performers and all kinds of stage use.
  Arrangements can even be bounced to disk, making it possible to turn MIDI
  files into high-quality audio files. The instrument is equipped with a
  practical mixer section that gives quick access to the volume and effect
  settings for every channel, and includes high quality chorus and reverb
  effects that are fully automatable and conform to gm effect standards. The
  master section of bandstand offers an additional master eq and limiter to put
  the finishing touch on the sonic output of the instrument.
