details: |-
  The B-Comp is a stereo compressor originally designed after testing diode
  bridge compressors.

  The vintage/modern options vary the attack and release characteristics of the
  processor and will vary the 'colour' of the output. Switch between them to
  hear the difference and select what works for you.

  This switch has more to do with 'colour' or 'feel' of the sound. Pre gain
  option allows you to control the gain of the whole signal without clipping.

  The b-comp does not introduce 'hiss' or 'analog noise' when in the 'vintage'
  mode.

  B-comp by babelson audio is a virtual effect audio plugin for macos and
  windows. It functions as an audio units plugin, a VST 3 plugin and an AAX
  plugin.
specs: |-
  - Stereo compressor
  - Diode bridge compressor design
  - Vintage/modern modes
  - Pre gain control
  - Dynamics processing
  - Compressor
  - Limiter
  - Gate
  - Expander
  - Attack and release characteristics
