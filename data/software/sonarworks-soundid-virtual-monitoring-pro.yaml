description: Room cloning technology that enables audio professionals to recreate their trusted studio sound on any over-ear headphones through a 10-minute DIY binaural measurement process, allowing reliable mixing decisions anywhere.
details: |-
  SoundID Virtual Monitoring PRO captures an ultra-realistic, personalized simulation of your own studio room using an included binaural in-ear measurement microphone. It also simulates other acoustic environments such as cars and living rooms. Works with any over-ear headphones. Includes both a DAW plugin and a system-wide application. Requires an audio interface with separate speaker and headphone outputs and 44.1 kHz sample rate capability.
specs: |-
  - os_mac: macOS 11 Big Sur or higher
  - os_windows: Windows 10 or higher
  - requirements: Audio interface with separate speaker/headphone outputs, 44.1 kHz sample rate, stable internet connection
  - includes: SoundID Binaural In-ear Measurement Microphone
