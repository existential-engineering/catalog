details: |-
  Autoreverb_chung is a universal reverb effect that takes any sound from the
  selected input (ex : the system mixer) and sends its reverb to the selected
  output (ex : the output speakers) with time delay, volume, and up to six
  plugins tone dsp effects compatible (baxandal, resonance, peekenhancer, decay,
  4echo ...).

  When connected to system mixer as input and output, it adds reverb effects to
  all the computer's any incoming sounds.

  It is written in freebasic and runs as a standalone application.

  Connected to the mic as input and external distant speakers as output, it can
  add extra reverb echo to the room where you play music piano instrument even
  not connected to the computer even acoustic instruments.
specs: |-
  - Universal reverb effect
  - Time delay control
  - Volume control
  - Up to six plugins tone dsp effects compatible
  - Baxandal
  - Resonance
  - Peekenhancer
  - Decay
  - 4echo
  - Written in freebasic
  - Windows compatible
