description: RNBO is a new patching environment built to export software with
  the sound of Max. Create web experiences, hardware music devices, audio
  plugins, and new Max objects all from the same patch, or take your generated
  source code wherever you want.
details: |-
  RNBO is a patching environment built to export software with the sound of Max. A single RNBO patch can produce web experiences, hardware music devices, audio plugins and new Max objects, and when a defined target context is not enough it generates source code that can be taken anywhere.

  One patch, many targets: a RNBO patch exports compiled code that runs in several defined target contexts, plus source code that can be integrated into any C++ or Web Audio project. The targets are Raspberry Pi export (for guitar pedals, Eurorack modules and more), VST3 and AudioUnit plugins that run in any DAW, self-contained shareable Max objects, improved performance and loading times for Max for Live devices, Web Export to embed a RNBO sound engine in a website, and easy-to-integrate C++ source code.

  The sound heard while patching in RNBO is generated and compiled code that updates as changes are made. That running code is identical to the exported code, so a patch sounds the same no matter which target is chosen.

  Although built on new technology, RNBO offers an instantly recognizable patching environment with many familiar objects and practices from Max, so existing Max users are up and running quickly. It carries full Gen integration with added event support and interactive UI objects, a help file for every RNBO object, mixing of events and signals in the patcher, param/inport/outport objects to define the controls of an export, mixed patching and text-based programming, and a polyphony attribute for patches, subpatches and abstractions.

  RNBO is supported by online resources at rnbo.cycling74.com, with tutorial videos, documentation and project guides. To get started you download and install Max, where RNBO runs in a trial mode with saving disabled until the full version is purchased. RNBO is an add-on for Max that requires an active Max 8 or Max 9 licence, sold as a permanent licence or as an annual or monthly subscription.

  RNBO Move Takeover lets RNBO take over Ableton's Move hardware. Launching RNBO mode on the Move hands a RNBO patch the whole device, with full access to buttons, playable pads, knobs, the display and I/O features. The RNBO web editor can connect multiple RNBO exports into a modular system of sequencers, synths and effects running on the Move, with graph changes immediately active on the device. The Move has stereo audio I/O, RGB LEDs, MIDI support, 8 rotary encoders and 32 pressure and velocity sensitive pads, and the takeover is an experimental alpha / public beta that Cycling '74 is actively developing.
specs: |-
  - Export target: Raspberry Pi, for building guitar pedals, Eurorack modules and other hardware music devices
  - Export target: VST3 and AudioUnit plugins that run in any DAW
  - Export target: self-contained, shareable Max objects
  - Export target: Max for Live devices, with improved performance and loading times
  - Export target: Web Export, embedding a RNBO sound engine into a website via Web Audio
  - Export target: easy-to-integrate C++ source code
  - Export target: RNBO Move Takeover, taking over Ableton's Move hardware (experimental alpha / public beta)
  - Code compiled live while patching, identical to the exported code, so every target sounds the same
  - Familiar Max patching environment with many of the same objects and practices
  - Full Gen integration, with added event support and interactive UI objects
  - A help file for every RNBO object
  - Events and signals can be mixed in the patcher
  - param, inport and outport objects define the controls of a RNBO export
  - Patching and text-based programming can be mixed directly in RNBO
  - polyphony attribute makes patches, subpatches and abstractions polyphonic
  - RNBO web editor connects multiple RNBO exports into a full modular system (Move Takeover)
  - Runs in trial mode, with saving disabled, until the full version is purchased
  - Add-on for Max: requires an active Max 8 or Max 9 licence
