description: Air fuzz is a dynamic sound-effect to make bass-parts sound more
  'dry' and 'airy'
details: >-
  Air fuzz is a dynamic sound-effect to make bass-parts sound more 'dry' and
  'airy'. Air fuzz is designed to create a sensation in the audio-realm similar
  to standing in front of a sub-woofer playing at loud volume, where you feel
  the sensation of air being pushed/pulled around you.


  Deep frequencies, such as bass and kick-drums (perhaps especially '808'
  kicks), can get a lovely raspy sound when using air fuzz at moderate levels.
  It requires some 'input-gain trim' attention when you first load it onto your
  audio-chain, as even small trim-changes can change the sound-effect quite
  dramatically.


  It's supposed to be a subtle sound-effect, and may sound bad if you push it
  too hot. Good headphones or monitors are recommended when adjusting the
  input-gain trim, so you clearly hear where the sweet-spot is on your material.


  It does not work equally well on all audio-material, but can even be used on
  busses and master-tracks for some types of music.


  Zero latency (for live use or for tracking/mixing/mastering/post-production).
  Zip with .dll (no .exe installation). No drm (such as phonehome, ilok, etc).
