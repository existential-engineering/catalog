details: |-
  RipX Separator is a free macOS companion app for RipX Backstage on Apple
  Vision Pro. It uses AI to separate a song's instruments and notes into Rip
  Audio files, which can then be transferred to Backstage via AirDrop or by
  copying to an iCloud folder for import.
specs: |-
  - Transfer: AirDrop or iCloud to RipX Backstage (Apple Vision Pro)
  - Free to download
