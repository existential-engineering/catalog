description: DF-CLIP 2 is a peak clipper built for drums, with 8 unique clipping algorithms, up to 3 independent frequency bands, a Tilt EQ with adjustable centre frequency, and a redesigned interface carrying input/output monitoring and a spectrum analyzer.
details: |-
  DF-CLIP 2 builds on the foundation laid by the original DF-CLIP. The core concept is unchanged, a powerful peak clipper that works on both the harmonics and the tones of any drum source, but the plugin has been substantially reworked. LEGACY mode reproduces the extra saturation and punch the original brought to metal drums while keeping the new features of version 2.

  DF-CLIP 2 was not designed as a mastering plugin, but mastering engineers use it anyway: MODERN mode produces clear, full-bodied masters quickly. On live drums and loops, DIRTY and BOMB modes add distortion character for more aggressive processing, while CLEAN mode on overheads brings clarity to cymbals without decimating a live snare.

  The plugin is transparent on transients, so dynamic range and transient definition survive processing and the kit still sounds full. Although every Drumforge plugin is designed with drums in mind, DF-CLIP 2's BALANCED mode is also used to add edge and aggression to subpar guitar and bass DI tracks.

  The multi-band section adds further flexibility, letting you select one, two, or three bands for processing: a single band keeps everything together, two bands separate highs from lows, and a third adds a midrange band for maximum control.
specs: |-
  - Powerful peak clipping with 8 unique clipping algorithms
  - Multi-band functionality: up to 3 independent ranges of clipping
  - Tilt EQ shifts tonal balance from Warm to Bright
  - Tilt Frequency adjusts the centre point of the EQ
  - Redesigned UI with input/output monitoring and spectrum analyzer
  - Processing modes include LEGACY, MODERN, DIRTY, BOMB, CLEAN, and BALANCED
