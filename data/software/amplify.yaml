details: |-
  Introducing a brand new sonic enhancement tool designed for musicians,
  beat-makers, and music producers alike. Go from subtle saturation and crunch
  to wildly aggressive distortion and powerful punch with ease.

  Amplify plug-in brings the iconic sound of that golden era 90s boom bap to
  your modern music productions with just one tool.

  Taking the past into the future, acclaimed music producer ski beatz (jay-z,
  mobb deep, curren$y) and celebrated sound designers 12 bit soul (native
  instruments, akai pro, the drum broker) have teamed up to deliver this
  easy-to-use plug-in combining all the lo-fi goodness you've come to expect
  from them.

  Amplify by amplify / 12 bit soul is a virtual effect audio plugin for macos
  and windows. It functions as an audio units plugin and a VST 3 plugin.
