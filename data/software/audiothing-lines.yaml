description: Lines is an effect plugin (VST, AU, AAX, CLAP), inspired by the
  Axel Telephone Line Simulator. A complex effects processor and feedback
  synthesizer.
details: |-
  Lines is an effect plugin that crosses borders: it can be used as a creative mangler of all kinds of signals, ranging from lo-fi telephone sounds, lush phasing, warm distortions, crushing feedback, ring modulation, and unique frequency shifting. But even without any input, it can be an experimental synthesizer based on feedback, allowing for a wide range of inspiring rhythms, pulses, and organic soundscapes. Lines is the sixth plugin made with Hainbach, composer and YouTuber known for his test equipment explorations.

  Lines has a rare real-life inspiration, the Axel Line Simulator, made in the 1970s in Jamaica, New York by Axel Electronics. Despite its golden disco look, the Axel was never intended as a piece of music equipment. It was used to simulate signal loss over telephone and data lines, mimicking the worst case for message transmission using a plethora of unique analog effects: jitter, noise, intermittent pulses, frequency shift, distortion, bandpass filters for various bandwidths and even playable buttons for phase, amplitude and dropouts.

  By routing the unit's output back into itself a world of liquid rhythms, throbbing basses, and tropical birds appears. It becomes a playable instrument without any input, inviting playful exploration. If you add a piano, drums or a voice to your acid parrot sub bass rhythm, they fold together in unpredictable and beautiful ways. Thanks to the built in limiter, it never sounds harsh or unpleasant, which is a constant risk with feedback patching.

  AudioThing took great care to simulate the feedback and signal path down to the component level. Everything is engineered to be as close to the original as possible. Once the sound was right, the ranges and possibilities were extended: more range on the frequency shift, fine-tunable filters, an additional filter in the feedback path, a flexible pulse sequencer, as well as all the sync and modulation possibilities you are used to from AudioThing's other plugins.

  Lines is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP), and on the App Store for iPhone and iPad as an AUv3 plugin and Standalone (IAA).
specs: |-
