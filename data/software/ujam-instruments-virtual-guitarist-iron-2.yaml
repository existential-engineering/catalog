description: Virtual Guitarist IRON 2 is an exciting plug-in from UJAM, providing satisfyingly hard and roaring power chords within your DAW.
details: |-
  Pay tribute to the gods of rock with roaring riffs and power chords with version 2.0 of IRON, the legendary Virtual Guitarist. Now completely overhauled and improved: play your own riffs, choose from a selection of stomp box effects, and enjoy the entirely re-recorded samples and phrases.

  IRON is suitable for all levels of music production experience. Seasoned musicians and composers will be impressed with its sound quality. Beginners will appreciate the frustration-free design speeding up workflows and enhancing the creative process.

  With sounds ranging from the subtly distorted all the way to raging aggression, Virtual Guitarist IRON is a versatile beast, with over 350 unique phrases in 30 different styles featuring expertly sampled performances from a top session musician. For those that require the extra weight in their guitar parts, Drop D tuning and doubling is also available.

  Perfect your tone with classic guitar stomp box effects including great-sounding wah, delay, chorus and reverb. Choose one out of 30 different stomp box combinations, which sit pre-amp so the amp and speaker section reacts dynamically to your input, then add the final polish with one of 60 dedicated Finisher multi-FX chains.
specs: |-
  - Instrument mode, freshly recorded samples and phrases
  - 30 styles, over 350 phrases
  - 30 stomp box emulations, 60 Finisher FX modes
  - Drop D and doubling modes for extra fatness
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta only)
  - Minimum 8 GB of RAM
  - 6.6 GB of disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, AAX, AU 2 and VST 3, all 64-bit only
  - Delivery format: automated installation via the UJAM App, or downloadable installer file
  - Authorization: quick authorization via the UJAM App, or email and password within the plug-in
  - Supported standards: MIDI
  - Works on macOS and Windows with all major DAWs, including Ableton Live, Logic Pro, Pro Tools, FL Studio, Cubase, Studio One, Bitwig, Reaper and Reason
  - All MIDI phrases and included sounds are royalty-free
