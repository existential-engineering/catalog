description: PSA1000 Analog Saturation plugin is a modern recreation of a '90s classic analog guitar preamp used in recording studios all around the world. It adds independent left and right channel controls, Mid/Side operation, a stereo Spread circuit and an Analog Link circuit on top of the modeled original.
details: |-
  PSA1000 Analog Saturation plugin is a modern recreation of a '90s classic analog guitar preamp which is used in recording studios all around the world. It is used and "abused" for recording and characterizing not only guitars but also electric pianos, organs, synthesizers, electric basses and many other instruments.

  PSA1000 Analog Saturation has found its place at the mix stage too, processing all types of sound including drum rooms, percussion, vocals, kicks, snares and sound effects.

  Nembrini Audio carefully modeled the original analog circuits and then refined them by ear, rather than relying on circuit capture alone.

  The full version carries independent controls for the left and right channels with individual and global links, a Dry/Wet mix knob for both channels, Mid/Side operation, a Spread circuit to widen the stereo field, and an Analog Link circuit that simulates the difference between left and right channels found in the real analog world. A Phase Reverse switch takes advantage of the original unit's phase changes when used in parallel, and In and Out level knobs cover gain staging.

  An iOS version for iPhone and iPad is available from the Apple App Store alongside the desktop plugin.
specs: |-
  - Modern recreation of a 1990s classic analog guitar preamp
  - Original analog circuits modeled and refined by ear
  - Independent controls for left and right channels with individual and global links
  - Dry/Wet mix knob for both channels
  - Mid/Side operation
  - Spread circuit to widen the stereo field
  - Analog Link circuit simulating left/right channel difference of the real analog unit
  - Phase Reverse switch, for the original unit's phase changes when used in parallel
  - In and Out level knobs
  - iOS version available for iPhone and iPad
  - Plugin formats: VST2, VST3, AAX or AudioUnits compatible host
  - Intel compatible or Apple Silicon CPU
  - 1GB RAM
  - Mac OS 10.13 or newer
