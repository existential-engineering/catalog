description: The PSA1000 is a modern recreation of a classic '90s analog guitar preamp, used in professional recording studios globally for processing guitars, electric pianos, organs, synthesizers, electric basses, and more. It also excels during mixing for drum rooms, percussion, vocals, kicks, snares, and sound effects.
details: |-
  - The PSA1000 Rack Analog Saturation Unit is a faithful software recreation of a legendary '90s analog rack unit that became a staple of professional recording studios worldwide. The original hardware earned a reputation for its unique ability to add warmth, presence, and harmonic richness to virtually any source material, and this plugin captures that character with precision.
  - Versatility is at the core of the PSA1000 Rack. While it excels at guitar processing — adding the kind of analog coloration and saturation that brings recorded guitars to life — it is equally at home on electric pianos, organs, synthesizers, and electric basses. During mixing sessions, it proves invaluable on drum rooms, percussion buses, vocals, kick drums, snares, and sound design elements.
  - The plugin features independent left and right channel controls with individual and global linking options, giving engineers precise stereo control. A Dry/Wet mix knob supports parallel processing workflows, while the Mid/Side operation mode allows for targeted stereo field processing. The Spread circuit enables stereo widening, and an Analog Link simulation introduces subtle natural channel-to-channel variations that replicate real-world hardware behavior.
  - A Phase Reverse switch facilitates easy parallel processing setups, and dedicated Input and Output level controls provide gain staging flexibility throughout the signal chain. The plugin ships with both a standard edition and as part of the Nembrini Audio rack plugin line, sharing the same analog modeling engine in a rack-style interface suited for mix bus and parallel processing applications.
  - The PSA1000 Rack supports macOS 10.13 or newer with full Apple Silicon compatibility, and Windows 7 or newer on 64-bit DAWs. A mobile version is available for iOS on iPhone and iPad. The plugin is compatible with all major DAW formats and requires a minimum of 1GB RAM.
