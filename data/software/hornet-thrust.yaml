description: Boost your mix with HoRNet Thrust, loudness enhancement that adds punch and clarity while preserving dynamics.
details: |-
  Thrust delivers loudness enhancement, giving a mix extra punch, presence and impact without sacrificing clarity or dynamics. It increases perceived loudness while keeping the mix clean and dynamic, shaping loudness rather than simply turning up the volume, and it works on individual tracks as well as on a final mix.

  Controls cover the curve, the saturation and the multiband processing, so each frequency band is enhanced precisely where it needs it, giving control over the low end, midrange and high frequencies without affecting the overall balance.

  Thrust supports multichannel audio up to 10 channels, which suits ATMOS soundtracks, immersive audio projects and surround or multitrack setups, enhancing loudness across all channels.

  Delta mode isolates the difference between the original and the processed sound, making it easy to hear exactly how much Thrust is affecting the mix and to fine-tune the effect precisely.

  Oversampling adjusts to the project's sample rate for clear results at any resolution. The interface is sleek and resizable with light and dark themes that can also follow the system setting, and the plugin is lightweight enough for large sessions.
specs: |-
  - Perceived loudness boost
  - Multiband processing
  - Waveshaping curve
  - Effect amount control
  - 0dB clip protection
  - Delta mode
  - Oversampling (1x to 8x)
  - Loudness curve
  - Full plugin bypass
  - Up to 10 channels of audio supported
  - Load and save buttons for managing presets
  - Freely resizable interface
  - Light and dark themes
  - Apple Silicon native support
  - Compatible with macOS 10.13 and later, and Windows 10 and later
  - Available in VST3, AAX and Audio Unit formats
  - No copy protection
