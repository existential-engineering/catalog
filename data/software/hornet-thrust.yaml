description: Boost your mix with HoRNet Thrust, loudness enhancement that adds punch and clarity while preserving dynamics.
details: |-
  Ever feel like your track is almost there, but still missing that final push? Thrust is the answer. It's the tool you need to deliver precise loudness enhancement, giving your mix that extra punch, presence, and impact, all without sacrificing the clarity or dynamics you've worked hard to preserve. Whether you're mixing an aggressive rock track, a soft ballad, or an intricate electronic piece, Thrust can make the difference between a good mix and an outstanding one.

  What sets Thrust apart is its ability to increase perceived loudness while keeping your mix clean, punchy, and dynamic. Thrust is not about blindly turning up the volume, it's about shaping the loudness in a way that preserves the integrity of your mix. You can adjust the curve, tweak the saturation, and fine-tune the multiband processing to get just the right balance, so each frequency band is enhanced precisely where it needs it.

  One of the standout features of Thrust is its ability to support multichannel audio up to 10 channels. This makes it a choice for more complex sessions like ATMOS soundtracks, immersive audio projects, and any work that involves surround sound or multitrack setups. Whether you're mixing in stereo or dealing with complex multichannel formats, Thrust provides the flexibility to enhance loudness across all channels without sacrificing detail or clarity.

  Delta mode allows you to focus on the difference between your original sound and the processed sound, making it easy to hear how much Thrust is affecting your mix. Oversampling adjusts to your project's sample rate, so loudness enhancement doesn't compromise the fidelity of your original sound.

  The sleek, resizable interface is intuitive and fully customizable. You can switch between light and dark themes depending on your preference or let the plugin automatically adjust to your system's settings. Thrust is aimed at producers, mixers, and mastering engineers who want more than just volume.
specs: |-
  - Perceived Loudness Boost
  - Multiband Processing
  - Waveshaping Curve
  - Effect Amount
  - 0dB Clip Protection
  - Delta Mode
  - Oversampling (1x to 8x)
  - Loudness Curve
  - Full Plugin Bypass
  - Up to 10 channels of audio supported
  - Load and save buttons for managing presets
  - Compatible with macOS 10.13 and later, and Windows 10 and later
  - Available in VST3, AAX, and Audio Unit formats
  - Freely resizable interface
  - Available in both light and dark themes
  - Apple Silicon native support
  - No copy protection
