description: "Collection of 3 libraries for Kontakt based on famous keyboards from the 70s: Orchestrator, Compac and Organ X55. Faithful recreation of the sound and workflow of the original units."
details: |-
  Retro Keys brings 3 keyboards from the 70s to modern productions.

  The Compac piano is a synth that mimics the sound of a piano by shaping the tone of a saw-tooth waveform. Using another filters it shapes the sound to resemble the sound of a honky-tonk piano and a clavichord. It's very simple but very cute. The Compac was made by Crumar in 1972 and features 3 piano sounds (piano, honky tonk and clavichord).

  The Orchestrator also mimics the sound of piano using the same technique as Compac, but it adds a brass section with a filter controlled by an envelope. Also including a strings section that includes the famous chorus / ensemble effect. Also known as Multi-Man, it was made by Crumar in 1975: a string machine with a brass simulator offering bass, brass, piano, clavichord, violin and cello, with vibrato, envelope and presets.

  Finally, Organ X55 is a B3 style synth that adds sine waves in different pitches to create the famous Hammond organ sound. A rotator effect simulates a Leslie speaker. The Organ X-55 is a clonewheel made by Elka with 2 keyboards with 1 drawbar each, 3 piano sounds, percussion, vibrato, brilliance, rotator, tube drive and a set of presets.

  In the effects page you can add any effect you want in any order, including EQ, compressors, modulation effects, distortion, saturation, tape machine, reverbs, amp simulators and more. This script boosts the sonic capabilities of the library exponentially. From the settings page you can control round robin, dynamic range, velocity curve and the volume of the noise recorded from the original unit.
specs: |-
  - 3 instruments: Compac, Orchestrator and Organ X55
  - 706 samples
  - Size: 430 MB
  - Round robin: 3
  - Velocity layers: 1
  - Effects page with EQ, compressors, modulation effects, distortion, saturation, tape machine, reverbs and amp simulators chainable in any order
  - Settings page with round robin, dynamic range, velocity curve and original-unit noise level controls
  - Works with Kontakt 5.7.3 and newer versions
  - Full version of Kontakt required; Kontakt Player will run in demo mode
