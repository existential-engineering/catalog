description: A professionally mixed drum library designed to capture the
  big-budget metal productions of the early to mid-2000s alongside modern
  production standards. Suitable across metal subgenres and tempo ranges, it
  delivers mix-ready drum tones with no additional processing required.
details: |-
  One Kit Wonder: Metal is designed to meld the best elements of the big-budget metal productions of the early to mid-2000s, with the new levels of natural power, realism and polish that can be found in modern drum tones.

  It's a chameleon within the realms of metal, not restricted to any particular subgenre, equally at home holding down stomping backbeats as it is blasting at 250bpm.

  Each One Kit Wonder is captured to the same level of detail as our other libraries but comes fully mixed and ready to go so you can dive straight into writing creativity and hear your ideas immediately sound amazing.

  The One Kit Wonder series was inspired by the many GGD users who use our libraries for songwriting. We know how crucial it is that there is as little time wasted between the moment inspiration strikes and you being able to capture it, and how important it is that you can hear your ideas sounding polished and professional so you stay excited as you develop them.
specs: |-
  - Engine: Kontakt Player 6+ (free) or Kontakt 6 (full)
  - Mac: Standalone, VST, AU, AAX (64-bit only)
  - Windows: Standalone, VST, AAX (32/64-bit)
  - Storage: ~3 GB total
  - RAM: 4 GB minimum, 6 GB recommended
  - OS: macOS 10.12+ or Windows 7+
  - GPU: OpenGL 2.1+
