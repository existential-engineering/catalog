details: |-
  BarChimes is an accurate physics simulation of a set of bar chimes, which
  includes collisions, slides and multi-chain hits of 36 semi-tone tuned bars.

  A detailed 36 bar kinetic physics simulation. Gravity, collisions and audio
  accurately portrayed.

  Velocity and sweep analysis simulates user movement through the chimes.
  Parameters for physics, pitch and time.

  Frequency editing with fundamentals and partials. Percussive rendering with
  decay controls.

  Swing modulations effects. Photo-realistic 3d representation and collision
  effects.
specs: |-
  - 36 semi-tone tuned bars
  - Physics simulation with gravity and collisions
  - Velocity and sweep analysis
  - Frequency editing with fundamentals and partials
  - Percussive rendering with decay controls
  - Swing modulations effects
  - Photo-realistic 3d representation
