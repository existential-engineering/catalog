details: >-
  Analogy is a "hybrid synthesis" kontakt 5 sample library featuring sound
  sources of 4 different types of synthesis such as analog (dco & digital
  waveform), additive, virtual analog and hybrid (combining some of the above
  with digital waveforms).


  A slightly stripped down "plethora" engine interface is implemented, featuring
  a form of vector and subtractive synthesis combining 4 sound sources at a
  time. A decent amount of modification controls are provided, in the likes of
  multimode filters, lfo, envelopes, transpose buttons and xy pad.


  There is an effect section of the most common fx, as well as high quality
  synthetic convolution reverb to give an extra depth and character to the
  sound.


  We have carefully sampled a variety of sounds by analog machines (such as
  jx-8p, mks-50, dw-8000 & k3), additive synth (k5) and early analog modelling
  synths (an1x & micro q). The multisampled sounds have been recorded at 48khz
  24-bit resolution and post editing/looping process is done carefully on each
  sample individually.


  There are included brasses, strings, polysynths, warm pads, synthetic voices,
  resonant sweeping or ring-modulated pads and others. Using the editing
  parameters new sounds of various types can be created by the user.
specs: >-
  - Kontakt 5 full version 5.6.8 and above required

  - 8 gb of ram recommended

  - Hybrid synthesis

  - Analog (dco & digital waveform) synthesis

  - Additive synthesis

  - Virtual analog synthesis

  - Hybrid synthesis

  - Vector synthesis

  - Subtractive synthesis

  - 4 sound sources

  - Multimode filters

  - Lfo

  - Envelopes

  - Transpose buttons

  - Xy pad

  - Effect section

  - Synthetic convolution reverb

  - 48khz 24-bit resolution

  - 597 wave samples

  - 50 multisamples

  - 128 snapshots

  - 1.46 gb total size

  - 5 sound categories: (an) analog, (ha) hybrid analog, (ad) additive, (va)
  virtual analog, (hy) hybrid
