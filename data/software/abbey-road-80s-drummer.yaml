details: |-
  Abbey road 80s drums is the third instrument developed together with the iconic british recording studios. With two expertly engineered premium drum kits for use in the free kontakt player and the kontakt 4 sampler, abbey road 80s drums allows musicians and producers to recreate the defining drum sound of the '80s with the highest level of sonic fidelity and authenticity.

  Abbey road 80s drums contains two characteristic instruments that significantly contributed to the sound of the respective musical decade: a vintage yamaha 9000, one of the most groundbreaking and most-recorded kits in music history, and a slingerland magnum chrome with single-headed concert toms and a full set of octobans, the melodically tuned tubular toms that were popular among drummers of that time.

  Both drum kits were set up and sampled with painstaking precision in abbey road's studio two and studio three, taking full advantage of the acoustic properties of these famous recording rooms.

  Abbey road 80s drums features a sophisticated implementation of the typical "gated reverb" technique that enabled the distinctive huge-but-tight drum sound of the '80s. Different sets of ambient microphones were used at abbey road to capture additional, strongly compressed versions of the room sound, including a mono overhead signal recorded through a stc 4021 "ball and biscuit" microphone and a specially built replica of the ssl e-series talkback compressor, utilizing a further popular recording trick of that time.

  Up to 27 velocity layers per instrument, each with up to six additional variation samples, guarantee maximum authenticity both for rhythm programming and for real-time MIDI-controlled playing. The user interface offers convenient control over all articulation, sound shaping, mixing and routing functions, with envelopes and volume of the gated ambience individually adjustable per instrument group.
