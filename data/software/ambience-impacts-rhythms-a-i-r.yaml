details: >-
  Ambience impacts rhythms (a.I.r) is a collection of elements that has taken
  over two years of collecting and crafting "only the finest sounds for cutting
  edge compositions"; it's focused on blending three essential building blocks
  into one library - ambience, impacts, and rhythms.


  Powered by native instruments kontakt player it is available for mac os x and
  windows in VST, AU, dxi, rtas and standalone configurations.


  The two dvd set contains over 6gb of instruments categorized by genre, timbre
  and the mood they evoke.


  The software is designed to help you find the sound you are looking for
  without having to funnel through thousands of preset to find the sound you
  want.


  Features include over 300 ambient instruments, 100 impact instruments & kits,
  tons of combination platters that combine several ambiences with impacts and
  rhythms, and 300 tempo-adjustable rhythms.
