description: Thump is an audio processor that synthesizes low frequency audio to
  add low end to a track or generate another sound entirely. It is an envelope
  driven, percussive sub-harmonic synth that reads the pitch and dynamics of its
  input to control its oscillators.
details: |-
  Thump looks at the pitch and dynamics of its audio input and uses that information to control its oscillators. It can add low end to drums, augment a bass, or create synthetic drones.

  It is suited to beefing up a kick drum, adding low end to percussive tracks and re-creating classic drum synth sounds. Typical uses of its envelope driven, percussive sub-harmonic synth include building low-octave support for bass drum, tom, snare and other percussive tracks, creating kettle drum sounds from regular drum tracks, and re-creating the sounds of classic drum synths such as the TR-808.

  The plug-in carries two independent envelope driven oscillators with complete control over both pitch and amplitude envelopes, a wet and dry control for mixing the synthesized sound with the source, and detailed metering. A dozen presets are included, the UI size is adjustable with disclosable graphs, and the MH Preset Manager provides cross-platform presets.

  Because Thump generates low frequencies, monitors or headphones are needed to hear the effect; computer speakers will not reproduce it.

  Version 4 adds a VST3 version on both macOS and Windows, including native Apple Silicon support for VST hosts such as Steinberg's Cubase and Nuendo. All v4 plug-ins add undo and redo, A/B snapshots with snapshot blend, software update tracking, more flexible resizability, common controls in the header bar, improved preset management, settings copy and paste between instances, a plug-in details pane, user configurable themes, selectable knob styles and preferences for band and UI colors.
