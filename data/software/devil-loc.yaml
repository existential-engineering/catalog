description: Simplified two-knob audio level destroyer inspired by vintage Level-Loc
  podium microphone compressors, delivering extreme compression and distortion
  effects. Included with Devil-Loc Deluxe.
details: |-
  Devil-Loc is an audio level destroyer inspired by vintage Level-Loc podium microphone compressors. It delivers extreme compression and distortion effects through a simplified two-knob interface.

  The Crunch (distortion) and Crush (compression) controls provide a range from subtle warmth to extreme gating effects and dramatic pumping compression.

  Automatic release time based on input level ensures natural-sounding compression that adapts to the source material. The plugin excels on drums but works creatively on any source. Devil-Loc is included with the purchase of Devil-Loc Deluxe.
specs: |-
  - Crunch (distortion) and Crush (compression) controls
  - Extreme gating effects capability
  - Automatic release time based on input level
  - 64-bit only, sample rates 44.1 kHz to 192 kHz
  - Apple Silicon compatible
