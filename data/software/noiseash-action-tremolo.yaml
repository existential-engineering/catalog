details: |-
  Action Tremolo is an advanced volume and pan modulation system with a vintage analog saturation unit. This plugin is a member of palmary collection bundle and this one is free.

  There are three modulation sources for both pan and volume controls individually: a custom shape envelope follower, the lfo with 5 waveforms, a 32-step sequencer and each modulation sources can be assigned in-sync or free-sync modes.

  Smart and minimal controls allows you to create evolved, catchy and textured sounds very easily. Stereo enhancement, fade in / out, looped innovative effects, distorted textures, rare sound effects, side chain and much more possibilities are available on action tremolo.

  With unique advanced modulation options and analog character, action tremolo is a real mojo for creating great, stunning effects just in seconds.

  In order to download this plugin, all you need is a social follow (facebook or youtube).
