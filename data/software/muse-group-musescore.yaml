name: MuseScore
manufacturer: muse-group
primaryCategory: notation
description: MuseScore Studio is free and open source music notation software
  for Windows, macOS and Linux, used to write, play back and print scores.
details: |-
  MuseScore Studio is the desktop notation application published by Muse Group and
  built by an open source community, described on its own site as the world's most
  popular notation app. It is professional music notation software, completely
  free with no limitations, and its source is open.

  Scores are entered with the mouse and computer keyboard or played in from a MIDI
  keyboard, and they play back through bundled sounds. MuseSounds, a separate
  orchestral library, is offered alongside the application through Muse Group's
  MuseHub installer, and MuseScore Studio can also be downloaded without MuseHub.

  Music moves in and out of other programs through MusicXML and MIDI. The project
  ships in 69 languages and is maintained by an active contributor community,
  with plugins and additional soundfonts distributed through musescore.org.

  Windows and macOS builds are distributed from the site, and Linux users can
  install an AppImage, a Snap or a Flatpak, or a package from their own
  distribution.
specs: |-
  - Free and open source, with no feature limitations
  - Note entry by mouse, computer keyboard and MIDI keyboard
  - Score playback with bundled sounds
  - Optional MuseSounds orchestral library through MuseHub
  - MusicXML import and export
  - MIDI import and export
  - Plugin support
  - Custom soundfont support
  - Available in 69 languages
  - Linux builds as AppImage, Snap, Flatpak and distribution packages
