details: |-
  Verberate is an algorithmic reverb plug-in that simulates real acoustical surroundings with exceptional realism. Version 2 introduces the vivid hall algorithm that adds time variance to avoid the stiffness that plagues convolution based reverbs while preserving the natural high density reverb tails of Verberate 1.

  The new vivid hall algorithm models random variations without artifacts like chorus effects or pitch changes, and is therefore capable of simulating reverberation of real halls with a higher degree of realism. Real acoustical surroundings will have slight variations due to air currents, moving performers or movements in the audience.

  The decay editor that makes it possible to sculpt the reverb tails by setting up frequency dependent reverb times has been significantly improved. It now offers bell as well as high and low cut and shelving filters similar to a parametric equalizer. The filter slopes can be adjusted continuously as with most acon digital plug-ins. The integrated output equalizer offers the same filter types and both the decay editor and output equalizer show accurate curves with interactive handles to modify the filter band settings.

  Another new feature is the ability to better simulate mechanical plate reverbs. High frequencies travel faster in metal plates than low frequencies, and this effect is called frequency dispersion. Verberate 2 now has a dispersion parameter which allows for highly realistic plate reverb simulations when combined with the decay editor to simulate the longer high frequency decay of plate reverbs. A new swirl parameter makes it possibly to simulate the feedback modulation effect found in many vintage digital reverb units.

  The 15 early reflection patterns offered are algorithmic, calculated in real time and applied using convolution. A dense and resonance free late reverb tail follows the early reflections, resulting in extremely convincing room simulations with impressive depth combined with the flexibility algorithmic reverbs are known for. A large catalog of beautiful factory presets is delivered with verberate 2 and a clear and to-the-point graphical user interface simplifies the search for a specific reverb quality.
