description: "Ample guitar pf aim to bring a prs custom 24 artist guitar sound
  to your studio. Neck, bridge, both 3 sample libraries. Sampling: sustain"
details: >-
  Ample guitar pf aims to bring a prs custom 24 artist guitar sound to your
  studio with 3 sample libraries covering neck, bridge, and both positions.


  Sampling includes 10 articulations: sustain, palm mute, natural harmonic,
  hammer on & pull off, legato slide, slide in, slide out, pop, pinch harmonic,
  and slide guitar. The library is 6.6 gb in size.


  Polyphonic legato and slide smoother enables realistic legato across any
  interval and speed, with drop tuning supported down to d1 and authentic
  left-hand performance noises.


  Riffer 4 is a MIDI editor tailored for plucked string instruments featuring an
  all-new strumming and chord system with the innovative 'strum note' that
  treats multiple sub-notes within a chord as a single editable object, allowing
  unified control over strum time, velocity gradient, and legato parameters.
  Dual view modes enable seamless real-time switching between piano roll and
  guitar tab views, and the string visualization system visualizes strings
  within the piano roll for authentic plucked instrument techniques.


  The amp and fx system includes an amp simulator with 7 classic amp heads
  (metal double, metal treble, lead 800, jazz 120, 65 twang, 65 delight, and 57
  delight) paired with 8 guitar cabinets each captured with 8 microphones, plus
  built-in effects: 8-band eq, compressor, delay, and convolution reverb.
specs: >-
