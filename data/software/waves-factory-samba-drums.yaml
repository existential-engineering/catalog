description: This sample library features a set of folk percussion instruments from Brazil. Coming from African roots, the samba band or batucada is a percussion ensemble characterized by its fast pace.
details: |-
  Samba Drums is a Kontakt sample library of folk percussion instruments from Brazil. Coming from African roots, the samba band or batucada is a percussion ensemble characterized by its fast pace, and the library captures solo and ensemble versions of each articulation.

  Every articulation was recorded in a perfectly dry studio environment with 4 velocity layers, 6 round robin and 2 microphone positions, close and far, that can be mixed and controlled independently. The included instruments are Surdo 18", 20" and 22", Snare, Timba, Repenique, Tamborim, Rocar, Agogó and Whistle.

  The main view shows a 3D representation of the 10 included instruments. Clicking any of them adjusts the individual volume, pan and pitch for solo and ensemble articulations, and the library carries both a mic mixer and an articulation mixer.

  The sequencer holds 7 presets of predefined batucada rhythms in which you can create your own. Tempo, steps and intensity are adjustable per preset and play on loop in sync with the DAW, instruments can be taken out, and the ensemble or solo articulations selected. Unlike the majority of sequencers, this one also allows you to define the velocity of each hit.

  The effects page adds any effect in any order, including EQ, compressors, modulation effects, distortion, saturation, tape machine, reverbs and amp simulators. The settings page controls the number of round robins, the velocity curve, the dynamic range and the attack and release times of the different instruments separately.
specs: |-
  - Instruments: Surdo 18", 20" and 22", Snare, Timba, Repenique, Tamborim, Rocar, Agogó, Whistle
  - Solo and ensemble versions of each articulation
  - Size: 418 MB
  - 937 samples
  - 4 velocity layers
  - 6 round robin
  - 2 mic positions (close and far), mixed and controlled independently
  - Main view with a 3D representation of the 10 included instruments, with individual volume, pan and pitch per instrument
  - Sequencer with 7 presets, adjustable tempo, steps and intensity, per-hit velocity, and loop playback in sync with the DAW tempo
  - Effects page with EQ, compressors, modulation effects, distortion, saturation, tape machine, reverbs and amp simulators in any order
  - Settings page with round robin count, velocity curve, dynamic range and per-instrument attack and release times
  - Works with Kontakt 5.7.3 and newer versions
  - Full version of Kontakt required (Kontakt Player will run in demo mode)
