description: RipX DAW PRO is a digital audio workstation featuring advanced harmonic editing, ultra-precise audio repair tools, and state-of-the-art noise and instrument separation. It enables users to restore damaged recordings, completely reshape audio, or experiment to craft sounds the world has never heard before.
details: |-
  RipX DAW PRO builds on the power of RipX DAW and takes it to the next level. With advanced harmonic editing, ultra-precise audio repair tools, and state-of-the-art noise and instrument separation, PRO gives unmatched control over every sound detail. Users can restore damaged recordings, completely reshape audio to fit a creative vision, or experiment to craft entirely new sounds.

  The Audioshop® Sound Manipulation Tools provide powerful pitch adjustment, time-stretching, and the ability to copy and paste individual or groups of notes, sibilants, and unpitched sounds. Specialized tools include the Edit Unpitched tool for non-pitched sounds, the Draw Sound tool for creating notes/drums/samples, the Split and Join tools for sectioning notes, the Clone tool for duplicating pitch variation and timbre between notes, the Draw Pitch tool for fine pitch slides, the Apply Pattern tool for adding pitch/formant/volume/panning fluctuations, and the Smooth Region tool for blending sound attributes.

  The Harmonic Editor goes beyond basic spectrum editing by providing direct control over the actual harmonics that describe the sound of a note. It is ideal for removing noise, adjusting timbre, and creating new sounds. The Clean & Repair Audio feature provides live audio repair including background noise removal, foreground artifact limiting, tone and hum reduction, and the ability to adjust overtone levels and regenerate fundamental harmonics to restore bass presence lost during mixing and mastering.

  For advanced users and developers, RipX DAW PRO includes RipScripts—a powerful scripting language for building custom tools directly inside the DAW. RipX DAW PRO integrates with major DAWs via the RipLink VST3/ARA2 plug-in and AudioSuite plug-in, and supports audio-to-video editing on macOS.
specs: |-
  - Formats: VST3/ARA2 plug-in, AudioSuite plug-in, RipLink DAW integration
  - Compatibility: VST, ASIO, ARA
  - Audio-to-video editing: macOS only
  - Trial: 21-day free trial available
  - Scripting: RipScripts custom scripting language
  - Audioshop® tools: Pitch, Time-stretch, Edit Unpitched, Draw Sound, Split, Join, Clone, Draw Pitch, Apply Pattern, Smooth Region
  - Harmonic Editor: direct harmonic control, noise removal, timbre adjustment
  - Audio repair: background noise removal, tone/hum reduction, overtone adjustment, harmonic regeneration
