details: |-
  RipX DAW PRO builds on the power of RipX DAW and takes it to the next level. With advanced harmonic editing, ultra-precise audio repair tools, and state-of-the-art noise and instrument separation, PRO gives you unmatched control over every sound detail. Restore damaged recordings, completely reshape audio to fit your creative vision, or experiment to craft sounds the world has never heard before.

  The Audioshop sound manipulation tools powerfully and quickly adjust pitch, time-stretch, copy and paste individual or groups of notes, sibilants and unpitched sounds. The Edit Unpitched tool displays all unpitched sound spread over the entire Rip; the Draw Sound tool draws notes, drums and samples onto a rip; the Split tool cuts notes into sections; the Join tool pieces notes together to edit as one; the Clone tool copies characteristics such as pitch variation, timbre with volume and panning from one note to another; Draw Pitch makes fine pitch adjustments and slides; Apply Pattern adds fluctuations in pitch, formant, volume and panning; and Smooth Region blends the pitch, formant, timbre, volume and stereo panning of notes.

  The Harmonic Editor is not a basic spectrum editor. These are the actual harmonics that describe the sound of a note, and the Harmonic Editor allows complete control over them, which suits removing noise, adjusting timbre and creating new sounds. Live audio repair and clean-up features remove background noise, limit foreground artifacts, reduce tones and hum, and purify pitched and unpitched sounds. Overtone levels in notes can be adjusted and fundamental harmonics regenerated, bringing back bass presence in vocals and instruments lost during mixing and mastering.

  For advanced users and developers, RipX DAW PRO includes RipScripts, a scripting language that lets you build your own tools directly inside the DAW, whether automating edits, designing custom workflows, or creating new audio processes from scratch. Scripts can also process audio using data files such as those generated by motion capture.

  Music producers can work with major DAWs through the RipLink VST3/ARA2 and AudioSuite plug-in, edit or remove notes within polyphonic vocal, instrument and percussion recordings, apply Pitch To Scale for natural sounding automatic pitch adjustment, and digitize and clean up crackly vinyl. DJs and remixers use it to clean up messy acapellas and noisy samples. Audio post professionals extract artifact-free dialogue from noisy footage and edit audio to video (macOS only). Sound designers use Draw Pitch, the Harmonic Editor and the Clone Pitch/Sound tool for original effects and Foley sound replacement.
specs: |-
  - Audioshop sound manipulation tools: pitch adjustment, time-stretching, copy and paste of individual or grouped notes, sibilants and unpitched sounds
  - Edit Unpitched, Draw Sound, Split, Join, Clone, Draw Pitch, Apply Pattern and Smooth Region tools
  - Harmonic Editor for direct control over the actual harmonics that describe a note
  - Live audio repair: background noise removal, foreground artifact limiting, tone and hum reduction, purification of pitched and unpitched sounds
  - Overtone level adjustment and fundamental harmonic regeneration
  - RipScripts scripting language for building custom tools and automated workflows inside the DAW
  - RipLink VST3/ARA2 and AudioSuite plug-in for integration with major DAWs
  - Pitch To Scale automatic pitch correction to the nearest semitone or any selected scale
  - Edit audio to video (macOS only)
  - ASIO compatible
  - System requirements: macOS 10.15+ (2012 and later models, including M1 onwards) / Windows 8/10/11 (64-bit)
  - Minimum: 2 core 2.5GHz CPU, 8 GB RAM, 20 GB free disc space
  - Recommended: 4+ core CPU or Apple Silicon M1/M2, 16+ GB RAM, 20 GB free disc space
  - Faster ripping on Windows 10/11 with NVIDIA GeForce 1070/1080/1080Ti/2070/2080/2080Ti/3070/3080/3090/40XX/50XX GPUs with 16 GB RAM
  - RipLink AudioSuite plug-in requires Pro Tools 12.8.2 (macOS) / 12.2 (Windows) or later
  - RipLink VST3/ARA plug-in requires Studio One 4, Cubase/Nuendo 11.0.30, Reaper 5.97, Cakewalk 2019.05 or later
  - Internet connection required to activate for the first time and at least once every 15 runs
  - 21-day free trial
