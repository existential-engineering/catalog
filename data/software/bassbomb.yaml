name: Bassbomb
manufacturer: de-la-mancha
primaryCategory: synthesizer
url: https://www.delamancha.co.uk/bassbomb.htm
description: Bassbomb is a monophonic bass synthesizer focused on creating a
  wide range of bass sounds from punchy to chunky via squelchy and fat.
details: |-
  Bassbomb is a monophonic bass synthesizer focused on creating a wide range of
  bass sounds from punchy to chunky via squelchy and fat with a sprinkling of
  dirt on top. It does everything from dubstep wobble, electro house dirt, funky
  bounce, breakbeat dirt, hip hop boom, acid squelch and more besides.

  As well as bass lines it's also happy banging out kick drums and bass drops,
  with a pure sine sub osc to really nail that low end. It features custom
  waveforms, a composite filter and non-linear envelopes to give that old school
  synth sound, with 2 lfos and 3 envelopes to really make stuff move around.

  Unison, oscillator sync, ring modulation and dirt all add to the flavour and a
  tempo-sync arpeggiator is the "cherry on top".
specs: |-
  - Monophonic bass synthesizer

  - 2 oscillators with 7 custom waveforms each (sine, square, pulse, ramp, saw,
  triangle, noise)

  - Adjustable pulse width and detune

  - Modulation by envelope and lfo per oscillator

  - Adjustable unison with spread control per oscillator

  - Oscillator sync

  - Ring modulation between oscillators

  - Octave selector and level per oscillator

  - Sub-osc with math-generated pure sine wave

  - Independent sub-osc detune modulation from envelope and lfo

  - Resonant low pass filter, 24 db / octave slope

  - Composite filter design with non-linear behaviour

  - Adjustable cut off and resonance

  - Cut off modulation by envelope and lfo

  - Velocity and note tracking for cut off

  - 3 non-linear adsr envelopes

  - Envelope pickup mode

  - Multi-parameter envelope for cut off, res, pwm, detune and dirt

  - 2 tempo-sync lfos with 20 waveforms

  - Note-sync and adjustable phase

  - Tempo-sync to host (32 beats to 1/32 beats)

  - Free lfo mode (0-100 hz)

  - Lfo 2 modulates depth and frequency of lfo 1

  - Tempo-sync arpeggiator with 6 patterns

  - Arpeggiator covers 1 to 4 octaves

  - Arpeggiator synced to host (1/32 beats to 4 beats)

  - Adjustable note length (0-100%)

  - Dirt control with harmonics and saturation

  - 2 monophonic modes (classic and drop)

  - Portamento with adjustable time control

  - Master volume and pitch control

  - 200 presets


  - Windows compatible
