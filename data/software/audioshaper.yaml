details: |-
  Nymano AudioShaper, based around a transient shaper adapted to the needs of
  musicians and beatmakers, allows to shape sounds and make them more impactful.

  Adapted to drums and percussion but also working on other sounds (rhodes,
  guitar, voice...), it will allow you to give character to your tracks.

  Nymano audio designed this plugin to make it easy to quickly test
  adding/removing transients. Load this plugin and test your ideas quickly.

  Tighten up your drums to make them sound punchier and more defined. The knobs
  allow you to dial in the perfect level of transient shaping to suit your
  track.

  Whether you want your drums to sit perfectly in the mix or stand out with
  their own unique character, this plugin gives you the flexibility to achieve
  the sound you want.
