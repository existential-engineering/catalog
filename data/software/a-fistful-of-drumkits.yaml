details: |-
  A fistful of drumkits is an ableton drum rack pack containing drumdrops first three sample kits - the 1963 premier outfits 54 kit, the roger's big r dub kit and the mapex heavy rock kit. Three diverse drum kits for any situation - from pounding metal crashes to crackling dub snares. Fill your drum arsenal with over 2 gb of sounds, including 155 multi-sampled hits that capture the human feel of a professional drummer.

  Recorded by professional drummers and engineers on top-notch and vintage gear, each sound includes up to 16 multisamples for a truly natural, human feel. Plus, each kit comes in up to four variations (such as damped/undamped snare drums) for even more options.

  The 1963 vintage premier kit features the dust and character of a classic rock kit. Ideal for indie, alternative, and any music where a vintage sound is wanted. In addition to the regularly-recorded sounds, 1963 vintage premier features multisamples that have been overdriven through tubes and tapes, for some authentic analog grit.

  The roger's big dub kit takes things in a percussion-heavy direction, with thudding kicks and crisp snares sitting along side echoing timbales and bongos. As an added bonus, the included effects feature classic dub sound effects - sound the siren. Great for dub, space-rock, and electronic music.

  The mapex heavy rock kit is boomy and clean, perfect for rock songs where the kit needs to pound through. With a natural room sound, this kit brings the feel of a lively studio session to your fingertips.
