details: |-
  What Will Your Legacy Be? The 1969 Steinway Model D Concert Grand Piano is one of the most exquisite piano lines in existence. The tone is rich and full, yet bright and airy. It has a majestic character, appropriate for classical piano pieces, but can also simply elevate pop/rock music with its presence. This piano is truly worthy of the name Legacy. The natural age of the instrument has allowed its soundboard to settle, open up, and blossom like a great bottle of wine. To capture its full beauty, we Deep Sampled the 1969 Concert Grand Piano with multiple different stereo microphone perspectives, so you can dial in the sound and placement you want. Get ready to experience hyper-realistic playability, indelible character, and expressive freedom.
