details: |-
  Manipulate the bits of a sinewave to create rich sounds which change as they
  play. Bit Twiddler converts each sample of a simple sinewave to 8 bits, and
  then lets you shift, re-arrange and flip those bits. This results in the
  creation of highly complex waveforms.

  Bit twiddler can be considered a 'method showcase' product as it introduces a
  novel synthesis technique via a functioning product, so as to bring it to the
  attention of other developers who may then choose to evolve and incorporate it
  into their existing or future products. Of course bit twiddler is useable
  as-is, as a stand-alone, unrestricted synth for producing a variety of new
  sounds and textures.

  The application provides controls for dynamically changing the amplitude of
  the sinewave prior to the bit operations, as this alters the waveform shape by
  accentuating certain wave segments and suppressing others, and changes the
  sound without any perceived 'discontinuities' (as long as the range of
  amplitude change is constrained by the user to certain bounds).
specs: |-
  - 8-bit sample conversion
  - Bit shifting
  - Bit re-arrangement
  - Bit flipping
  - Sinewave manipulation
  - Dynamic amplitude control
  - Waveform generation
  - Windows compatible
