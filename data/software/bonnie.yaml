description: Bonnie is zoe's little sister, a slot driven drum sampler with
  lightning speed drum-kits loading and fast one stage control, fitted for live.
details: |-
  Bonnie is a slot driven drum sampler with lightning speed drum-kits loading
  and fast one stage control, fitted for live usage, with better control, both
  mp3 and wav. Format support, fast workflow and only 0.5 sec. Loading times for
  new core kit.

  The sampler uses 10 (.wav, mp3) file sample slots to build 10 drum components
  drum-kits. According to this approach, every slot can be anything, from kicks
  to snares or cymbals or you name it. Each slot is triggered by its own unique
  MIDI note which noted on its slot button. For instance, slot 48 is triggered
  by note number 48 in the MIDI keyboard (c2).

  The samples menu is divided into 14 categories, including a wide range of
  drum-kit components types. Bonnie comes with 30 full drum-kits to start with.
  It's perfect for sketching or producing most common classic genres drum tracks
  like disco, r&b, soul, hip hop, rock, pop, reggae and many more with carefully
  crafted samples that sit great in the mix and a reasonable drum library size
  that won't choke your hard drive.

  Every slot in bonnie has a full mixer page. It provides most of the
  traditional features per drum element that a producer might need and some
  exclusive features that you will not find even in the most expansive drums
  machines. You'll find a new sample library manager, pitch control, magnitude
  control, eq, saturation, phase control, delay, unique filter, drift effect and
  even an ability to morph the drum elements with other elements in the library.

  Bonnie is armed with a morphing system which can blend any 2 drum elements
  together (which can create tons of new fresh drum sounds). The morph system
  can also play with the blended element's pitch and increase the invention of
  new drum sounds like never before. Each channel in bonnie is armed with
  dedicated modulation effects which allow adding beautiful nuances and textures
  to each drum element separately. There is a yowling phaser effect, a delay and
  the new zelda filter which can completely change the audio materials native
  character and morph it into a new interesting sound.
specs: |-
  - 10 sample slots (.wav, mp3)
  - 14 sample categories
  - 30 included drum-kits
  - 0.5 sec loading times
  - Pitch control
  - Magnitude control
  - EQ
  - Saturation
  - Phase control
  - Delay
  - Unique filter
  - Drift effect
  - Morphing system
  - 3 master effects (compressor, reverb, delay)
  - F.r effect with frequency control
  - Phaser effect
  - Zelda filter
  - Sample library manager
  - MIDI note triggering
  - Master FX slider
