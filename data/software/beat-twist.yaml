details: |-
  Beat Twist is a freeware loop manipulation VST plug-in that provides amazingly
  creative ways to transform boring or stale wav files into something special.

  It has a built in bit crusher unit, distortion unit (with bit reduction),
  overdrive, and step sequencer.

  The built in lfo can be used to modulate volume, bit crusher pitch, overdrive,
  and panning.
specs: |-
  - Loop manipulation
  - Bit crusher
  - Distortion unit with bit reduction
  - Overdrive
  - Step sequencer
  - LFO modulation
  - Volume modulation
  - Bit crusher pitch modulation
  - Overdrive modulation
  - Panning modulation
  - MIDI automation
  - VST 2.4
  - Windows compatible
  - Freeware
