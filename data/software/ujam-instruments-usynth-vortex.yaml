description: VORTEX channels trance essentials from the late 90s and Y2K era, with leads and anthems, basses, rave stabs and chord hits, arps and gated sounds, pads, keys and strings, noise and FX.
details: |-
  VORTEX channels trance essentials from the late 90s and Y2K era. These sounds top charts in contemporary club scenes. Its high-energy palette focuses on sharp, edgy, and powerful sounds, from thick supersaw anthems and rave stabs to driving arpeggios and hard trance basses.

  Millennial-approved: cut your ear drums on these nasty super saws. Hear the frantic power of retro-futuristic rave sounds.
specs: |-
  - Leads & anthems, basses, rave stabs & chord hits, arps & gated, pads, keys & strings, noise & FX
  - 100 synthesizer patches, 100 global presets
  - Multi-synthesis engine, sequencer/arpeggiator, multi-FX
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8GB of RAM
  - 0.2GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Requires the latest version of the UJAM App, which installs the Usynth plug-in that hosts all titles
  - MIDI phrases and included sounds are royalty-free
