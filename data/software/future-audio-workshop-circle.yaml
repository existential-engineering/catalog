description: Future Audio Workshop's flagship synthesizer, a versatile instrument used across practically every genre and style of music by sound designers, synth enthusiasts, underground producers and top pop producers alike.
details: |-
  Our flagship synth. Over the years Circle² has achieved a cult following across the globe. A versatile tool, Circle² is used for practically every genre and style of music, among sound designers, synth enthusiasts, underground producers and top pop producers alike.

  Everything sits in one window, for a fast and streamlined workflow while sound designing. There are no messy submenus, multiple windows, or hidden controls, so unique sounds come together with minimal effort.

  Modulation is handled without a clunky modulation matrix: color-coded circles are simply dragged and dropped onto targets, which makes it quick to create dynamic sounds full of motion.

  VPS (Vector Phase Shaping) is a synthesis method available only in Circle². It creates harmonically rich tones that morph over time, and suits evolving leads, gritty basses, ethereal pads and contorted sounds.

  Over 300 patches can be browsed quickly with the Smart Browser, and a library of Favorite Patches can be curated for instant access. New patch packs from expert sound designers are added regularly, and the instrument is ready to perform with NKS, working with Maschine and Komplete Kontrol with every patch meticulously mapped.

  An activation code is delivered instantly and allows Circle² to be used on up to three computers at a time.
specs: |-
  - Sound sources: 4 x analog oscillator, 4 x wavetable oscillator, 4 x VPS oscillator, 1 x noise source, 1 x feedback
  - Modifiers: 1 x mixer, 2 x mouth filter, 2 x fuzz distortion, 2 x overdrive, 2 x parametric EQ, 2 x crusher, 1 x analog modeled filter, 1 x dual analog modeled filter, 1 x VCA
  - Modulators: 5 x wavetable LFO, 5 x ADSR envelope, 5 x step sequencer
  - Effects: 3 x analog phaser, 3 x reverb, 3 x double echo, 3 x ping pong echo, 3 x chorus, 3 x panner, 3 x analog modeled bucket delay, 3 x analog modeled tube distortion
  - Native Instruments NKS support for Maschine and Komplete Kontrol, with individually mapped presets
  - MIDI note arpeggiator with swing and DAW timing sync
  - Randomize preset
  - 32 voice polyphony
  - Visual MIDI learn with advanced range adjustment
  - 110 wavetable oscillator shapes included
  - Ships with 300+ patches; more patch packs available in the store
  - Drag and drop modulation system
  - OSC control on Mac OS
  - True analog modeled oscillators, filters and effects
  - 16 wavetable LFO shapes
  - 16 step sequencer, with note output functionality
  - Available as VST, AU, and AAX
  - Compatible with Mac OS 10.9 and higher
  - Compatible with Windows 8 and higher
  - Tested in Pro Tools 11, 12 and 2018; Ableton Live 9 and 10; Logic Pro X; FL Studio 20; Propellerhead Reason 9 and 10; Studio One; Native Instruments Maschine and Komplete Kontrol
  - A modern Intel multicore PC or Mac with a professional sound card is recommended
  - Can be used offline, but an internet connection is required to activate
  - Activation code allows use on up to three computers at a time
