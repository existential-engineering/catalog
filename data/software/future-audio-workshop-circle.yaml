description: "A synthesis plugin built around the philosophy that creativity
  shouldn't be complicated. Features an intuitive single-window interface with
  all controls visible, eliminating submenus and hidden parameters. Offers 4
  analog oscillators, 4 wavetable oscillators, and 4 exclusive Vector Phase
  Shaping (VPS) oscillators, along with a drag-and-drop color-coded modulation
  system, 32-voice polyphony, and 300+ included patches."
