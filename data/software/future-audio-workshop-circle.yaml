description: Our flagship synth. Over the years Circle² has achieved a cult following across the globe. A versatile tool, Circle² is used for practically every genre and style of music, among sound designers, synth enthusiasts, underground producers and top pop producers alike. Creativity shouldn't be complicated — craft totally unique sounds and finish more songs with Circle².
details: |-
  Everything in one window — fast and streamlined workflow while sound designing with no messy submenus, multiple windows, or hidden controls.

  Modulation made simple — drag-and-drop color-coded modulation system; free yourself from the clunky modulation matrix.

  4x Analog oscillators, 4x Wavetable oscillators (110 shapes), 4x VPS (Vector Phase Shaping, exclusive to Circle²).

  5x Wavetable LFOs, 5x ADSR Envelopes, 5x Step Sequencers.

  32-voice polyphony.

  300+ included patches with Smart Browser.

  Visual MIDI learn with advanced range adjustment.

  Activation code allows use on up to three computers at a time.

  Tested in: Pro Tools 11, 12 and 2018; Ableton Live 9 and 10; Logic Pro X; FL Studio 20; Propellerhead Reason 9 and 10; Studio One; Native Instruments Maschine and Komplete Kontrol.
