description: A plugin that creates space in a mix in a simple and elegant way. Used daily by thousands of producers, musicians and mix engineers.
details: |-
  Trackspacer is an award winning plugin that creates space in a mix by carving the frequencies that the main track needs into another track in real time. It's no ordinary plugin. Similar to a multiband sidechain compressor but much more powerful, transparent and precise.

  Trackspacer features an internal 32 band EQ that reacts to the incoming sidechain signal. It analyses the spectrum of the sidechain and applies a reversed EQ curve to another track. Trackspacer creates space for the primary track instantly.

  Insert it on a track, set the sidechain signal and turn up the amount knob. If you want to fine tune it you can using the low-cut and high-cut filters. Mix faster thanks to the easy workflow and automatic EQ. If you need room to breathe, Trackspacer gives it fast to you.

  Although Trackspacer can be used using a single knob, it can be fine tuned using the included high-pass and low-pass filters. It also has an advanced panel with more features.

  In no time, Trackspacer can give you that extra clarity that high-end productions have. Better, more transparent and easier to use than regular compression.
specs: |-
  - Internal 32 band EQ that reacts to the incoming sidechain signal
  - Applies a reversed EQ curve to another track in real time
  - Low-cut and high-cut filters to target a specific area of the spectrum
  - Stereo, Mid, Side processing: full stereo field, left or right channels, mid or side channels, or anything in between
  - Adjustable attack and release times in milliseconds
  - Frequency display showing the sidechain spectrum and the resulting reduction curve, with frequency and dB scales
  - Advanced panel with additional features
  - Resizable window
  - Copy protection by serial number, no iLok or challenge response needed
  - macOS 10.9 or higher, Intel and M1 supported
  - Windows 7, 8 or 10
  - Requires a DAW with sidechain functionality
