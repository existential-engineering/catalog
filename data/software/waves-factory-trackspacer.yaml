description: "Creates space in a mix by carving the frequencies that a track
  needs through an internal 32-band EQ that analyzes sidechain signals and
  applies inverse EQ curves in real time."
details: |-
  32-band internal EQ with sidechain analysis. Low-cut and high-cut filters. Stereo and Mid/Side processing. Adjustable attack and release times. Frequency display with spectrum visualization. Resizable interface. Internal sidechain fallback. No iLok required.
specs: |-
  Version 2.5.10. macOS 10.9+ (Intel and Apple Silicon native). Windows 7/8/10. 64-bit only.
