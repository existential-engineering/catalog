description: "A real-time spectrogram plugin for audio analysis and
  visualization that displays how frequency content changes over time. Features
  classic and enhanced modes using time-frequency reassignment for sharper
  transients and clearer pitches."
details: |-
  Classic and enhanced spectrogram modes. Freeze and PNG export capabilities. HiDPI support. Multiple frequency scales (Linear, Log, Mel, Bark, ERB). Optional piano keyboard overlay. Auto Pause sync to host playhead. Customizable frequency range and FFT size. Scroll or static draw modes. 40+ color maps (color-blind friendly). Free version available in black and white only.
specs: |-
  Version 1.2.0. macOS 10.15 or later (Intel and ARM). Windows 10/11.
