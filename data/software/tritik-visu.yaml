description: Visu is a real-time spectrogram plugin with classic and enhanced modes. Fully functional free in black and white, with optional colour maps.
details: |-
  Visu is a real-time spectrogram plugin for audio analysis and visualisation. A spectrogram displays how the frequency content of a signal changes over time, with amplitude represented by colour. Think of it as an audio X-ray, useful for spotting transients, analyzing pitch and harmonics, detecting unwanted noise, and tracking how a sound evolves.

  Alongside a classic spectrogram mode, Visu includes an enhanced mode with greater precision in both time and frequency. It uses time-frequency reassignment (a technique that relocates energy to its most accurate position using phase information) resulting in sharper transients, clearer pitches, and a more detailed image.

  Visu is fully functional in black-and-white (no licence needed). You can try it without restrictions and see how it works for you. If you find it useful, you can get a licence to unlock colour maps.
specs: |-
  - Classic and Enhanced spectrogram modes
  - Freeze and PNG export
  - HiDPI support
  - Linear, Log, Mel, Bark, and ERB frequency scales
  - Optional piano keyboard on the frequency ruler
  - Auto Pause function (sync to host playhead)
  - Customizable frequency range
  - Adjustable FFT size
  - Scroll or Static draw modes
  - Speed control
  - Frequency readout
  - Completely usable free version (black & white)
  - 40+ colour maps (colour-blind friendly)
  - Windows 10/11, and a VST3 host or Pro Tools
  - macOS 10.15 or later (Intel and ARM), and an Audio Units host, VST3 host, or Pro Tools
