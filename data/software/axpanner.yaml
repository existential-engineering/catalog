details: |-
  The aXPanner by SSA Plugins gives you control of the azimuth and elevation of
  the sound source, as well as the width between the stereo input channels.

  The choice of two interfaces (equirectangular and top-down) lets you easily
  place your sound in space to create your immersive audio world, while the
  seventh order ambisonics output gives you future-proof spatial resolution for
  a high quality experience.

  The axpanner is available with 3 levels of spatial resolution, with different
  maximum ambisonic orders: a1panner - encodes to first order ambisonics
  allowing for the creation of a sound field with standard resolution; a3panner
  - encodes to third order ambisonics, giving advanced spatial resolution for
  higher accuracy sound fields; a7panner - encodes to seventh-order ambisonics,
  giving the highest possible spatial resolution currently available in a DAW.

  Note that ambisonics requires a decoder to be listened to correctly. You will
  not have correct results if you listen directly to the output of this plugin.

  Axpanner by ssa plugins is a virtual effect audio plugin for macos and
  windows. It functions as an audio units plugin, a VST 3 plugin and an AAX
  plugin.
specs: |-
  - Mono or stereo audio input
  - Ambix (sn3d/acn) format ambisonics output
  - Seventh order ambisonics output
  - Azimuth and elevation control
  - Stereo width control
  - Equirectangular interface
  - Top-down interface
  - Universal 2 binary
  - First order ambisonics encoding (a1panner)
  - Third order ambisonics encoding (a3panner)
  - Seventh-order ambisonics encoding (a7panner)
