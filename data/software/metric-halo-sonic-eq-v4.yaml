details: |-
  MH Sonic EQ is a modern version of the original Sonic EQ developed by Dr. James A. Moorer for Lucasfilm's SoundDroid project, and then expanded for the Sonic Solutions mastering DAWs in the 1990s and early 2000s. In 2007 Sonic EQ was re-created and enhanced for the Metric Halo-designed Sonic Studio 30x interfaces, a version that went back to first principles and updated both the UI and the engine. Today it is a 6-band fully parametric equalizer in which every band supports 2nd to 8th order filters, built on an updated low-noise 64-bit state-space EQ structure carrying the core Sonic EQ coefficients.

  Three primary characteristics have remained consistent across every generation: the sound, a full, sweet yet powerful musicality which brings presence and clarity to anything passed through it; its precision, with high-order slopes and a high degree of control over filter ripple both in-band and out, which makes very specific frequency content easy to manage with minimal effect on surrounding program; and its versatility.

  The EQ is aimed at forensic restoration, sound design, high-end mastering, post-production, recording, re-recording, multi-tracking and live sound alike. EQ curves that look completely broken can still sound clean and natural. A special set of laboratory-grade filters covers vinyl work (RIAA encode and decode) and the transfer of early generation digital formats (DC removal and digital de-emphasis).

  This version of Sonic EQ, originally incorporated exclusively in the hardware DSP of Sonic Studio branded Model 30x audio interfaces, is reborn as an AAX, VST and AU plug-in for Mac and Windows DAWs with a cleaner layout, SpectraFoo spectrum analysis and level metering, and a higher order of musicality, precision and power.

  All six parametric bands support up to 48 dB per octave (8th order) filters, with one special band dedicated to RIAA encode, RIAA decode or de-emphasis. User-selectable oversampling runs up to 16x. SpectraFoo spectrum analysis and level metering are built in, along with scalable gain reduction meters, many presets, adjustable UI size with disclosable graphs, and the MH Preset Manager for cross-platform presets.
specs: |-
  - World-class signal processing and workflow
  - User-selectable optional over-sampling, up to 16x
  - 6-band fully parametric interpolated state-space EQ
  - All parametric bands support up to 48 dB per octave (8th order) filters
  - One special band for RIAA encode or decode, or de-emphasis
  - SpectraFoo spectrum analysis built-in
  - SpectraFoo level metering built-in
  - Scalable gain reduction meters
  - Many presets included
  - Adjustable UI size and disclosable graphs
  - MH Preset Manager provides cross-platform presets
  - macOS 10.10 or newer, Intel Processor or Apple Silicon, AU, VST 2 & 3 or AAX (Pro Tools 11 and newer Native) host, 64 bit
  - Windows 7 or newer, Intel Processor, VST or AAX (Pro Tools 10, 11 & 12 and Native) host, 64 bit
  - Licensing requires an iLok.com account
  - License includes two activations per account
  - iLok dongle is optional, the license can be installed on the machine, on an iLok, or in the iLok Cloud
  - Only one license required, works on all supported platforms
