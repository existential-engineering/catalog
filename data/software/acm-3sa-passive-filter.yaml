details: >-
  Inspired by the vintage pultec hlf-3c passive filter, the acm-3sa emulates
  12db / octave low and high-cut passive filters, the acm-3sa combines
  high-performance processing with an intuitive stylized user interface.


  A versatile general purpose filter suitable for removing rumble, hiss, and hum
  with the minimum loss of content.


  Easy to install. Smooth switching between filter settings. Physically modelled
  rotary control modes. Resizable graphical user interface.


  Innovative processing accurately models the analogue frequency response -
  without additional latency or high cpu demand, even at lower sample rates.


  The acm-3sa is also part of the acm-sa-series bundle.
specs: |-
  - 12db / octave low-cut (high-pass) filter
  - 12db / octave high-cut (low-pass) filter
  - Physically modelled rotary control modes
  - Resizable graphical user interface
  - VST plugin
  - VST 3 plugin
  - AAX plugin
  - Clap plugin
  - Windows compatible
  - Linux compatible
  - Innovative processing with analogue frequency response modelling
  - Zero additional latency
  - Low cpu demand at lower sample rates
