details: |-
  The third entry in the Sonuscore Origins series pairs a radiant 12-STRING guitar with the signature sound of the BALALAIKA. The 12-string acoustic guitar offers a fresh, bright sound for a modern and familiar feel while also emphasizing ethnic, far-away nuances, and the Balalaika adds rich, more delicate and traditionally rooted textures. Originally from the regions of Central Asia and Russia, the Balalaika suits ethnic, cinematic and contemporary settings alike, working for gentle accompaniment as well as characteristic melodies.

  The Multi-Arpeggio-Designer (MAD) is the centerpiece of every Origins instrument. Two fully customizable arpeggiators create interlocking patterns and broad soundscapes by combining the unique timbres of the two instruments, with an engine designed to convey a musically meaningful, human performance instead of a computer randomly aligning notes. Both instruments can also be played independently, or with single notes, chords and rhythms on the fly.

  Over 100 ready-to-go presets are included, and arpeggio designs can be copied and pasted between different ORIGINS instruments. The Colors menu adds 12 individual color presets, each radically different in character and incorporating various effect settings and multiple impulse responses; combined freely with the MAD presets these yield over 1200 predefined combinations.
specs: |-
  - Two individually playable instruments: 12-string acoustic guitar and Balalaika
  - Innovative Multi-Arpeggio-Designer (MAD) with two fully customizable arpeggiators
  - 100+ rhythm presets
  - 12 unique color settings, over 1200 predefined MAD/color combinations
  - Arpeggio designs can be copied between different ORIGINS instruments
  - Full customization of all controls
  - Requires the FULL version of Native Instruments KONTAKT 5.7.3 or higher (the free Kontakt Player runs the instrument in demo mode only)
  - macOS 10.11 or higher, Intel Core 2 Duo
  - Windows 7 or higher, Intel Core 2 Duo or AMD Athlon 64 X2
  - 4 GB RAM
  - At least 400 MB of free hard disc space
  - Delivered as download
