details: |-
  Celebrating the exquisite sound of a world-class Clarinets a2 section captured at Abbey Road Studios, this virtual instrument offers a comprehensive collection of articulations for all your compositional needs. With seven technologically advanced legato techniques, including extended speed and velocity-triggered patches, and a massive sampling depth, it provides unparalleled expression and realism.

  Featuring 16 curated mic signals, including two hand-crafted mix signals by GRAMMY award winner Simon Rhodes, this library sets a new standard for the sound of the Clarinet in the digital age. Experience the warmth and authenticity of a masterfully recorded instrument, designed to elevate your compositions.

  This is an impeccably authentic Clarinet sound that embodies the timeless essence of one of the most renowned recording spaces in the world: Abbey Road Studio One.

  Capture your orchestral vision with ultimate realism with Abbey Road Orchestra.

  Do you already own an Abbey Road Orchestra Library? Log in to see your individual crossgrade offer.

  For the ultimate virtual orchestra, combine Clarinets with the rest of the Abbey Road Orchestra range.

  Don't need the tweak-ability of all 16 signals or extended playability for your compositions? Check out the Core version, complete with a single gorgeous mix by Simon Rhodes, then upgrade to Pro whenever you need more.
specs: |-
  - 7 legato techniques including extended speed and velocity-triggered patches
  - 16 microphone signals including two mixes by Simon Rhodes
  - Recorded in Abbey Road Studio One
