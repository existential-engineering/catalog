description: "Modular, node-based vocal effects processor for creating creature
  vocalizations, monster sounds, dialogue processing, and complex vocal effects
  in real time."
details: |-
  10 processing modules including pitch shifter, granular processor, vocoder, ring modulation, spectral shifting, convolution, flanger/chorus, delay pitch shifting, noise generator, and sample trigger. Over 200 factory presets, 130 sound samples, 133 animal recordings. Dynamic signal processing with amplitude, pitch, or energy-based triggering. MIDI control and parameter automation. Per-module gates, EQ, and limiters. Used on Game of Thrones, Avengers: Age of Ultron. iLok account required. 10-day free trial available.
specs: |-
  Mac: macOS 10.13+, Apple Silicon native support. Windows: 10 64-bit+. CPU: 2.4 GHz minimum. RAM: 4 GB minimum. Screen: 1280x1024+. Sample rates: 44.1 kHz to 192 kHz. 64-bit only. 0.7 GB assets. Supported DAWs: Pro Tools 11+, Logic Pro X, Nuendo, Ableton Live, Cubase, Reaper, Studio One.
