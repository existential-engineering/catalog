description: "A powerful vocal processing plugin designed for creating complex vocal sound effects, creature vocalizations, dialogue processing, and robot voices. Combines an intuitive modular workflow with 10 processing modules, 203 presets, 130 sound effects, and 133 high-quality animal recordings. Dynamic envelope-following and amplitude/pitch-based triggering enable expressive, responsive vocal transformations. Used on major productions including Avengers: Age of Ultron, The Jungle Book, Game of Thrones, and Stranger Things."
details: |-
  Dehumaniser 2 is a powerful vocal processor for designing complex vocal sound effects and processing dialogue. Create creatures, monsters, and robots quickly with an intuitive, modular workflow, customising and combining effects modules for unlimited creative possibilities or starting straight away with over 100 ready-to-go presets.

  With 10 essential modules and over 100 presets, sound designers have used Dehumaniser 2 to bring characters to life in productions including Avengers: Age of Ultron, The Jungle Book, Far Cry 4, The Conjuring, Game of Thrones and Stranger Things. The plugin eliminates the difficulty of setting up complex processing chains, letting designers jump straight into creative work.

  A node-based system makes audio routings clear, with up to two instances of each node so multiple pitch shifters, granular processors, spectral or convolution processes can be combined in serial or parallel signal paths. Processing can be driven dynamically by the input signal, with peak level, RMS level, energy difference or pitch tracking selectable per node, plus gate, EQ and limiters per module and a custom drawer macro system.

  The factory library ships with over 100 presets and 133 high-quality animal recordings including tigers, leopards, pigs and parrots, some recorded in Thailand. Samples can be triggered by amplitude, pitch or a range of audio descriptors, either from the sample trigger module or as part of the scrubbing convolution module.

  Dehumaniser 2 runs in industry-standard DAWs including Pro Tools, Logic Pro X, Nuendo, Live, Cubase, Reaper and Studio One, with MIDI control, assign and recall, and hundreds of automatable parameters. A fully functional 10 day trial is available.
specs: |-
