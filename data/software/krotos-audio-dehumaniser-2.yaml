description: "A powerful vocal processing plugin designed for creating complex vocal sound effects, creature vocalizations, dialogue processing, and robot voices. Combines an intuitive modular workflow with 10 processing modules, 203 presets, 130 sound effects, and 133 high-quality animal recordings. Dynamic envelope-following and amplitude/pitch-based triggering enable expressive, responsive vocal transformations. Used on major productions including Avengers: Age of Ultron, The Jungle Book, Game of Thrones, and Stranger Things."
details: |-
  10 included modules: Pitch Shifter, Delay Pitch Shifting, Granular, Noise Generator, Scrubbing Convolution, Flanger/Chorus, Ring Modulation, Spectral Shifting, Sample Trigger, Vocoder. 130 sound effects. 203 presets. 133 high-quality animal recordings (0.7 GB assets). Dynamic envelope-following and amplitude/pitch-based triggering. MIDI control and parameter automation. iLok account required. Native Apple Silicon support.
specs: |-
  OS: macOS 10.13+, Windows 10 64-bit+. CPU: 2.4 GHz min. RAM: 4 GB min. Sample rates: 44.1–192 kHz. Formats: AAX Native/AudioSuite, VST, VST3, AU (64-bit). Asset size: 0.7 GB. iLok account required.
