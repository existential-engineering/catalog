description: "A creative shimmer reverb designed to produce resplendent textures
  and shimmering ambiances. Features three tunable voices generated from the
  reverberated signal using two pitch shifters and a frequency shifter. The
  reverb engine ranges from grainy, delay-like effects to rich, lush sounding
  spaces."
details: |-
  3 tunable voices with independent output levels and reverse modes. Two pitch shifters (-1 octave to +2 octaves). Frequency shifter (-100 Hz to +2000 Hz). Freeze function. Pre-delay with host-sync option. Modulation and Width controls. Low-cut and high-cut filter section. Fully resizable high-resolution interface. 80+ presets by Richard Devine, emptyVessel, Andrew Madden, and Tritik.
specs: |-
  Version 1.0.6. macOS 10.13 or later. Windows 10/11. Demo available with audio fade-out.
