description: Irid is a shimmer reverb with 3 tunable voices, suited to crafting resplendent textures, (in)harmonic ambiances, and shimmering colours.
details: |-
  Irid is a creative shimmer reverb plugin designed to produce resplendent textures and shimmering ambiances.

  Its reverb engine ranges from grainy, delay-like effects to rich and lush sounding spaces. The three tunable voices, generated from the reverberated signal using two pitch shifters and a frequency shifter, enable marvelous shimmer effects and beautiful harmonic textures, as well as dissonant and dark ambiances. Each voice features an output level control and a 'reverse' option that time-reverses the sound grains, further expanding the timbral possibilities.

  The demo is fully functional, but the audio fades out occasionally. You can unlock the full version by purchasing a license.
specs: |-
  - 3 tunable voices with independent output levels and 'reverse' modes
  - Two pitch shifters (-1 octave to +2 octaves)
  - Frequency shifter (-100 Hz to +2000 Hz)
  - Versatile and transparent reverberation algorithm
  - Freeze function
  - Pre-delay with host-sync option
  - Modulation and Width controls
  - Low-cut and high-cut filter section
  - Fully resizable high-resolution interface
  - 80+ presets by Richard Devine, emptyVessel, Andrew Madden and Tritik
  - Mac: VST / VST3 / AU / AAX
  - Windows: VST / VST3 / AAX
  - Windows 10/11 with a VST or VST3 host, or Pro Tools
  - macOS 10.15 or later with an Audio Units host, VST or VST3 host, or Pro Tools
