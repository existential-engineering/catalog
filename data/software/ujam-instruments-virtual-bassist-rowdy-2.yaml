description: Virtual Bassist ROWDY is your loud-mouthed, high energy bassist with bite. If your bass needs to cut through heavy drums and a wall of guitars, then ROWDY is the perfect solution.
details: |-
  ROWDY confidently delivers picked overdriven electric bass sounds suitable for a variety of styles, ranging from powerful punk to red-hot rock and modern metal. It can purr, but it's built to roar, with a hand-selected, specially modified vintage bass guitar, hot amps, a fuzz box and even an octaver.

  Designed with the UJAM frustration-free philosophy, ROWDY's easy to use GUI and controls make it possible to achieve fantastic sounding and aggressive basslines in no time, no matter what your level of music production experience is. Its loud-mouthed sound and angry playing style mean that even seasoned bass players will appreciate getting great sounding ideas down fast, with practically zero learning curve.

  ROWDY has two distinct modes. Player Mode lets you quickly choose from one of the 60 styles and 1380 phrases with a MIDI controller, seamlessly following in an intelligently musical way whatever key or chord is being played. Instrument Mode opens up the entire ROWDY fretboard to be played like a traditional sampler, complete with dead notes, full stops and even slides.

  Tone-sculpting controls let you choose between a DI signal and three separate hand-picked amps with separate dial-in controls for overdrive and fuzz. The character knob gives instant access to many scuzzy sonic flavors, and an octaver plus a simple EQ and dynamics section finish the sound. 15 Finisher multi-effect modes are included, and phrases can be dragged and dropped into the bass track of your DAW.
specs: |-
  - Hand-selected, specially modified vintage electric bass guitar, picked and overdriven
  - 60 styles and 1380 phrases
  - 20 new styles and 30 new presets in version 2
  - 15 Finisher multi-effect modes
  - Four sound characters
  - Three amp settings plus DI signal
  - Adjustable fuzz and octaver
  - Artificially intelligent articulation modeling
  - Player Mode and Instrument Mode
  - DAW quantization and UI resizing
  - MIDI drag and drop
  - EQ and dynamics section
  - PreSonus chord and key track support in Studio One 4.6.2 or later (Virtual Bassist 2.1 update)
  - Operating systems: Windows 10 to Windows 11, macOS Catalina (10.15) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 4 GB of RAM
  - 0.5 GB of disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, 64-bit only
  - Automated installation via UJAM App, or downloadable installer file
  - Authorization via the UJAM App, or email and password within the plug-in
  - Supported standards: MIDI
