details: |-
  Amplifikation Lite is a "lite" version of the forthcoming Kuassa amplifikation
  custom tube amplification software for real-time guitar processing.

  Features 3 channels (clean, rhythm, lead) with 9 parameters: input, channel
  selector, gain, bass, middle, treble, presence, volume and cabinet on/off.

  The internal cabinet simulation is quite good but external cabinet impulse
  responses can be loaded in.

  It is an amp with 3 channels - nothing more but all you need if you want to
  work quick, not so flexible like other ampsimulations and there are no
  internal modulation effects.
specs: |-
