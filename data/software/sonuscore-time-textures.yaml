description: TIME TEXTURES is a new revolutionary orchestral engine bringing ever-evolving soundscapes to the tip of your fingers. It applies advanced algorithmic techniques to quality-recorded orchestral sounds, enabling continuously evolving textures through a simple mod wheel-based modulation system.
details: |-
  TIME TEXTURES is an orchestral instrument built on an entirely new engine that lets sound textures continually evolve in ways that pre-recorded sample loops cannot reach without a great deal of editing. Using advanced algorithmic techniques, quality-recorded orchestral instruments are given a depth, movement and beauty that do not readily exist in the natural world, and a simple modulation design warps and bends 13 instruments into new textures and sonic realities.

  The engine consists of two sound emitters that produce sound based on each individual instrument source, emitting particles at different seeds to form a constantly moving and shifting wall of sound. Four basic parameters are controlled separately for both instrument layers and tied to the mod wheel, so the sound can move from intimate and orchestral to spherical and rhythmic at a single turn. Dynamic, Movement, Octaves and Speed handle the broad character, while Attack Volume, Seed, Note Select, Spread, Gain and Pan shape each emitter in detail.

  The library consists of 25 instrument patches, each meticulously recorded and sampled with up to six round robins and up to five dynamic layers. Beyond sustains, instrument-specific articulations were recorded and can be faded into the texture with a slider: tremolo and staccato for the strings, tenuto, triplet tongue and staccato for the woodwinds, tongue staccato, flutter marcato and muted staccato for the brass, and harp harmonics plus several prepared grand piano samples for the keys section alongside harp, felt piano and grand piano.

  All samples were edited so the engine can arrange them in a certain order and string different sound particles together in an ever-changing way. A preset browser holds over 200 presets divided by feel and character, split between naturalistic orchestral textures that merge with the mod wheel and cinematic presets that expand the orchestral sounds through a wide effects chain.
specs: |-
  - Revolutionary orchestral engine with two sound emitters
  - 25 meticulously recorded and sampled instrument patches
  - Up to six round robins and up to five dynamic layers per patch
  - Multiple recorded articulations per orchestral section (strings tremolo/staccato, woodwind tenuto/triplet tongue/staccato, brass tongue staccato/flutter marcato/muted staccato, harp harmonics and prepared grand piano)
  - Over 200 ready-to-go naturalistic and cinematic ensemble presets
  - Simple-yet-complex modulation system with full mod wheel control over sonic progression
  - 6.17GB of uncompressed data
  - NKS-ready
  - Works with the FREE KONTAKT PLAYER
  - Requires Native Instruments KONTAKT version 6.7.1 or higher
  - macOS 10.14 or higher; Windows 10 or higher
  - 4GB RAM (6GB recommended for large KONTAKT instruments)
  - At least 6.17GB of free hard disc space
  - Some presets require a fast CPU (Intel i7 or higher recommended)
