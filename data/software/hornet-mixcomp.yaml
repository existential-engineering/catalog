description: Download MixComp, a free compressor plugin inspired by legendary analog consoles with adaptive oversampling and customizable interface
details: |-
  MixComp is our gift to the audio production community, a completely free compressor plugin inspired by the legendary channel compressor found on one of the most famous analog mixing consoles in recording history. For decades, this iconic compressor has been a staple in professional studios worldwide, celebrated for its punchy, musical sound and its ability to handle everything from subtle compression to full-on mix bus duties. With MixComp, HoRNet brings that same vintage analog character and dynamic control into the digital age, delivering a powerful tool that integrates seamlessly into any modern DAW.

  Whether you're a beginner producer, an experienced mixing engineer, or simply a tone enthusiast, MixComp offers the perfect blend of simplicity and depth. The plugin has been carefully designed to faithfully emulate the warmth, precision, and musical behavior of its analog counterpart, with the added benefits of modern digital flexibility. The result is a compressor that not only sounds great but also feels natural and intuitive to use.

  One of the standout features of MixComp is its transparent yet musical compression. This means it's capable of taming peaks and evening out dynamics while preserving the natural character of your source material. It excels on drums, vocals, bass, guitars, and even full mixes, offering a smooth and professional sound without introducing unwanted artifacts. From subtle glue compression on the stereo bus to aggressive transient shaping, MixComp adapts to the needs of your production.

  The plugin's user-friendly interface makes it easy to find the right settings for any application. You'll find intuitive controls for threshold, ratio, attack, release, and make-up gain, all designed to respond like classic analog gear. These controls allow you to dial in everything from slow, gentle compression to fast, punchy dynamics with just a few tweaks. A built-in gain reduction meter keeps you informed of exactly how much compression is being applied, giving you full control over the dynamics of your mix.

  To ensure high-fidelity sound quality, MixComp includes adaptive oversampling. This intelligent feature adjusts the internal processing based on your session's sample rate, minimizing aliasing and ensuring pristine audio reproduction at all times. Whether you're working at 44.1kHz or 192kHz, you can trust MixComp to maintain a clean, artifact-free sound. In addition to its powerful audio engine, MixComp offers modern workflow enhancements: the resizable GUI adjusts to your screen resolution, stays sharp thanks to hardware-accelerated graphics, and the interface can follow light mode, dark mode, or your system settings.
specs: |-
  - Authentic Analog Emulation: Faithfully recreates the sound and behavior of a legendary analog channel compressor
  - Smart Oversampling: Built-in adaptive oversampling ensures optimal sound quality at any sampling rate
  - Flexible Dynamics Control: Adjustable ratio, threshold, release, and fast attack options for complete control
  - Analog Saturation Mode: Add subtle harmonic warmth to your tracks
  - Compatible with macOS 10.13 and later, and Windows 10 and later
  - Available in VST3, AAX, and Audio Unit formats
  - Freely resizable interface
  - Available in both light and dark themes
  - Apple Silicon native support
  - No copy protection
