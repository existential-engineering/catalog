description: "A dynamic resonance suppressor that identifies problematic
  resonances on the fly and applies matching reduction automatically, delivering
  smoother, more balanced sound without manual EQ notching. Removes harshness,
  manages sibilance in vocals and dialog, corrects tonal balance, and reduces
  mud, boom, and proximity effects."
details: |-
  Automatic harshness and resonance removal
  Sibilance management in vocals and dialog
  Tonal balance correction for suboptimal recordings
  Mud, boom, and proximity effect reduction
  Mid/side and left/right processing options
  External sidechain input support
  Hard and soft processing modes
  Adjustable attack/release parameters
  Real-time vs. offline quality settings

  iLok account required. One license activates on 2 machines. Valid for both Windows and macOS. Online activation required.

  20-day fully featured trial
specs: |-
  - mac: OS X 10.14 (Mojave) through macOS 26 (Tahoe). 64-bit only. Apple Silicon supported. Intel support through macOS 15 (Sequoia).
  - windows: Windows 7-11. 64-bit only. No ARM support.
