details: |-
  Signature sound by avedis mutter: experience a unique sound crafted by avedis
  mutter, ensuring distinct and memorable bass tones. Simple & intuitive
  interface: navigate effortlessly with a user-friendly design that makes sound
  adjustments a breeze.

  Strong bass character, mix-ready: the monolith bass provides a full-bodied
  tone that sits naturally in any mix. Triple sound options: easily switch
  between clean, drive, and fuzz sounds, all in one vsti for versatile sound
  exploration and layering.

  Whether you're looking for a deep, clean bass or an edgy, driven sound, avedis
  mutter monolith bass provides the tools you need to elevate your music
  production.

  Avedis mutter monolith bass by polarity audio is a virtual instrument audio
  plugin for macos and windows. It functions as an audio units plugin and a VST
  3 plugin.
