details: >-
  Albion one is a renowned, industry-standard orchestral sample library that
  provides all you need to make film music. This title comprises a 109-piece
  orchestra, accompanied by a thunderous cinematic percussion section, recorded
  at the world-famous lyndhurst hall at air studios in london. Plus, there are
  warpable loops designed by award-winning engineers and an enormous steam
  synthesiser. Albion one contains high dynamics and energy while being
  versatile across multiple genres.


  Everything is recorded at air-studios lyndhurst hall through the finest and
  rarest vintage valve and ribbon mics onto 2" tape. Every patch is available
  with four way mic control and all shorts patches work with the newly enriched
  "ostinatum" v3 gadget.


  The albion one orchestra was recorded by award-winning engineers using
  world-class equipment: priceless ribbon and valve microphones through neve
  montserrat preamps, the largest 88r neve console in the world and onto
  pristine 2" tape, before being converted with top-of-their-class prism ad
  converters at 96k.


  Spitfire audio brought together 109 london's finest players, who regularly
  feature in oscar-winning film score sessions and major global concert
  performances, and recorded them performing a range of different techniques:
  short notes, long notes, tremolos, pizzicatos and so forth. Each of these
  techniques are captured across a range of notes, and by section (brass low,
  mid and high, woods high and low, and strings), affording you the flexibility
  to program and perform your orchestral composition with complete control.


  Albion one by spitfire audio is a virtual instrument audio plugin and a
  software application and soundware (samples or presets that load into other
  products) for macos and windows. It includes, and is therefore "powered by",
  kontakt player, which functions as an audio units plugin, a VST 3 plugin, an
  AAX plugin and a standalone application.
