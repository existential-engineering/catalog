id: zFqOjJxAAa3s4kA4ySqwr
name: BPM Converter
manufacturer: killihu
primaryCategory: effect
description: Use this plugin to convert bpm to ms and Hz. The values are
  automatically updated with the project tempo, although the bpm can also be set
  manually.
details: |-
  They are displayed up to a maximum of 3 decimal places. The colors of the
  plugin automatically change to match the color theme of live.
specs: |-
  - Bpm to ms conversion
  - Bpm to Hz conversion
  - Automatic project tempo synchronization
  - Manual bpm setting
  - 3 decimal places display precision
  - Live color theme matching
platforms:
  - mac
  - windows
