description: "Click and crackle filtering for cleanup of phonograph recordings
  or other impulsive contamination such as digital pops, with separate
  algorithms optimized for each type of artifact."
details: |-
  Separate algorithms optimized for click and crackle processing. Sophisticated detection algorithms focus processing on contaminating events. Onset detection allows crackle processing to bypass onset events. Monitoring feature for hearing eliminated clicks and crackle. Comprehensive stereo display of signal level, clicks, crackle, and onset events. Latency compensation. Up to 192 kHz sampling rate. Mono or stereo.
specs: |-
  Mac: AU, VST3, AAX. macOS 10.13+, Apple Silicon native, 64-bit only. Windows: VST2, VST3, AAX. Windows 7/8/10/11, 32-bit and 64-bit. iLok supported but not required.
