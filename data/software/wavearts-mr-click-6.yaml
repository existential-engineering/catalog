description: MR Click combines click and crackle filtering for cleanup of phonograph recordings or other impulsive contamination. MR Click has separate processors for clicks and crackles because of the different nature of the contaminants.
details: |-
  MR Click combines click and crackle filtering for cleanup of phonograph recordings or other impulsive contamination. It has separate processors for clicks and crackles because of the different nature of the contaminants.

  A click is a large disturbance, such as one caused by a phonograph scratch or a splice in a digital signal. The click processor automatically detects clicks and reconstructs the audio signal in the neighborhood of the click to eliminate it. Crackle is the high frequency scratchiness that comes from dust or wear in the grooves of a phonograph. The crackle processor automatically detects crackle and eliminates it by smoothing the signal around the crackle event, and it contains an onset detector that inhibits de-crackling at the onset of events like snare hits or cymbal crashes.

  MR Click has a scrolling time display showing all the click and crackle events detected, so the detection thresholds are easy to adjust. There is also a monitor feature for hearing the removed clicks and crackles.

  MR Click 6 is included in Master Restoration Suite 6.
specs: |-
  - Separate algorithms optimized for click and crackle processing
  - Sophisticated detection algorithms for clicks and crackle focus processing on contaminating events
  - Onset detection allows crackle processing to bypass onset events, keeping attacks bright
  - Monitoring feature for hearing eliminated clicks and crackle
  - Comprehensive stereo display of signal level, clicks, crackle, and onset events
  - Latency compensation via compatible hosts
  - Up to 192 kHz sampling rate
  - Mono or stereo
  - Requires a host program that supports audio plug-ins
  - iLok licensing is supported but not required
  - Macintosh formats: AU, VST3, AAX
  - macOS 10.13 (High Sierra) and higher
  - Apple Silicon natively supported (AU, VST3, AAX)
  - AAX on macOS requires Pro Tools 11 and higher
  - macOS: 64-bit hosts only
  - Windows formats: VST2, VST3, AAX
  - Windows 7/8/10/11
  - AAX on Windows requires Pro Tools 10.3.5 and higher
  - Windows: 32-bit and 64-bit hosts supported
