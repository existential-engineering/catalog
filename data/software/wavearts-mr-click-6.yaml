description: MR Click 6 is a click and crackle filter for vinyl or digital sources, featuring separate processors for clicks and crackles to restore phonograph recordings and remove impulsive contamination from audio.
details: |-
  MR Click 6 provides dedicated algorithms for two distinct types of impulsive noise: clicks and crackles. Separate processors allow targeted treatment of each artifact type, with sophisticated detection algorithms designed to focus on contaminating events rather than transient musical content.

  Onset detection helps preserve attack transients so that the natural punch and feel of the audio is maintained even at aggressive settings. A Monitor feature lets users audition the removed artifacts in isolation, making it easy to verify that only unwanted clicks and crackles are being attenuated.

  A stereo display shows signal level, clicks, crackles, and onset events simultaneously, providing visual feedback about what the plugin is detecting and removing. Latency compensation is supported for hosts that implement it, and the plugin handles sampling rates up to 192 kHz in both mono and stereo configurations.

  On macOS, formats available are AU, VST3, and AAX. On Windows, VST2, VST3, and AAX are provided. Apple Silicon is natively supported on macOS 10.13 (High Sierra) and higher. Windows 7/8/10/11 are supported with both 32-bit and 64-bit hosts.
specs: |-
  - Separate algorithms for click and crackle processing
  - Sophisticated detection algorithms targeting contaminating events
  - Onset detection to preserve attack transients
  - Monitor mode to audibly audition removed artifacts
  - Stereo display showing signal level, clicks, crackles, and onset events
  - Latency compensation support
  - Supports up to 192 kHz sample rates
  - Mono and stereo operation
  - macOS: AU, VST3, AAX; requires 10.13+; Apple Silicon native; 64-bit hosts only
  - Windows: VST2, VST3, AAX; supports Windows 7/8/10/11; 32-bit and 64-bit hosts
