description: Clean and simple binaural panner that positions sound outside the
  listener's head when using headphones, enhancing mix width and impact while
  preserving low-frequency clarity.
details: |-
  GFM Psypan is a clean and simple binaural panner designed to position sound
  outside the listener's head when using headphones. It enhances mix width and
  impact while preserving low-frequency clarity.

  The plugin features high-quality interpolation that preserves punch and
  clarity, stereo width control for incoming stereo inputs, and Inter-aural Time
  Difference (ITD) adjustment to exaggerate or decrease delay effects. It is
  designed for use on both the master bus and individual instruments.

  GFM Psypan is a legacy product from Auburn Sounds, available for free but no
  longer supported with updates or technical assistance.
specs: |-
  - High-quality interpolation preserving punch and clarity
  - Stereo width control
  - Inter-aural Time Difference (ITD) adjustment
  - Master bus and individual instrument processing
