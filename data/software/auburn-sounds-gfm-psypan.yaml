description: Explore the world of stereo with Psypan 2, a stereo multi-effect that packs 17 pan modes into a single plug-in.
details: |-
  Explore the world of stereo with Psypan 2, a stereo multi-effect that packs 17 pan modes into a single plug-in.

  Built on the surprisingly popular binaural panner from the original GFM Psypan (2011), it now goes much further: 5 binaural panner modes (including 2-band and the new Psy-2 algorithm for true front-facing rotation), 3 clean volume-based modes with classic pan laws, and 9 creative FX modes (Haas, Doubler, Chorus, µ-shifting, Peak Panner, Widener, and 3 M/S variants).

  Of those, the Free Edition enables 10 of the 17 modes.

  When a track needs life, width, or movement, just pan and browse the modes until you find exactly what the mix calls for.
