name: Bazzoid
manufacturer: maxx-claster
primaryCategory: synthesizer
description: "Features: 3 oscillators, each with four parameters (sine, center,
  width & shift) that allow you to get a large number of intermediate state."
details: |-
  The synth includes an ahdlr amp env, resonant lpf with lfo and env, chorus &
  distortion effects. The oscillators feature controls that allow you to
  manipulate the waveform into a variety of shapes, with a visual graph rendered
  in real time; which allows you to create a whole variety of different base
  tones - there is also a level, pitch and on/off control for each osc.

  Bazzoid comes with 128 presets which cover a lot of ground. The gui takes up
  about a third of the screen with a nicely spread out interface and responsive
  controls.

  The synth has the ability to produce deep, roughest and gut churning sub
  basses with tweaking and liberal use of the filter/q and drive control.
  Although it would be fair to say that this is not a modulation freeks day out
  it does allow enough filter and lfo carnage to produce some quite non bass
  like timbres.
specs: |-
  - 3 oscillators with four parameters per oscillator (sine, center, width,
  shift)

  - Ahdlr amplitude envelope

  - Resonant lpf with lfo and envelope

  - Chorus effect

  - Distortion effect


  - Windows compatible
