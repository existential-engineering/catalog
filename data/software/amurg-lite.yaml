details: >-
  Amurg lite is a free virtual instrument plugin for windows and macos. This
  plugin contains 15 presets covering keys, leads, basses, and pads. Each preset
  is customizable with a set of controls such as adsr envelope, modulation,
  filter, reverb, distortion, chorus, delay, etc.


  Amurg lite is aimed at ambient, lofi, retro, hip hop, rnb, cinematic, edm, and
  similar styles.


  Features include 140 mb extracted size / 120 mb download size, adsr section,
  lowpass/highpass filter cutoff, lfo modulation section, voice mode & glide,
  velocity curve & MIDI velocity selectors, reverb module, chorus module,
  distortion module, delay module, and global gain & pan.


  VST/vst3 64-bit windows & VST/vst3 & AU macos.
specs: |-
  - Vst2 64-bit
  - Vst3 64-bit
  - Audio units (AU) 64-bit
  - 15 presets
  - Adsr envelope
  - Lowpass/highpass filter cutoff
  - Lfo modulation section
  - Voice mode and glide
  - Velocity curve and MIDI velocity selectors
  - Reverb module
  - Chorus module
  - Distortion module
  - Delay module
  - Global gain and pan
  - 100% royalty-free
  - Windows 8.1 64-bit to windows 11 64-bit
  - 2 gb ram
  - 140 mb hard disk space
  - Macos el capitan to monterey
  - Sample-based rompler
