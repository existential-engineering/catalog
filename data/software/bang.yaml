details: |-
  Bang! Is a freeware kick/percussion synth plugin with many possibilities for
  creating kicks and other percussive sounds.

  Features 2 oscillators with sine/triangle/square and other waveforms, fm
  synthesis from osc1 to osc2, and a sampler player.

  Every generator comes with low-pass, band-pass, and high-pass filters, plus
  super snappy and flexible multistage envelopes for sound shaping.
specs: |-
  - 64-bit
  - 2 oscillators
  - Sine/triangle/square waveforms
  - FM synthesis (osc1->osc2)
  - Sampler player
  - Low-pass filter
  - Band-pass filter
  - High-pass filter
  - Multistage envelopes
  - Windows 64-bit (win7 or later)
  - macOS 64-bit (10.9 or later)
