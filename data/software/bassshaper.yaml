description: Deep & defined the bass line... It's the heartbeat of your music -
  the foundation stone that supports everything else.
details: |-
  BassShaper is a bass designer plugin developed by W. A. Production with
  cutting-edge algorithms designed to tame low-end frequencies and cut through
  busy mixes. Features include subtone generation, musical saturation, surgical
  transient shaping, and controls specifically designed to clean and polish bass
  sounds.

  The deboom dial, activated by amplitude, tames boominess for a cleaner tone.
  The demud control uses a special pitch tracking system to dynamically reduce
  muddiness caused by note transitions and resonances, making individual pitches
  more pronounced. The level control is driven by a pink noise signal, specially
  tuned to tame amplitude fluctuations and produce consistently audible bass
  throughout a track.

  The punch knob targets only the transient-heavy portions of the bass line,
  applying precise compression or expansion focusing on the initial milliseconds
  of each note. The fade control works inversely to punch, compressing or
  expanding only the tail portion of the audio, allowing you to shorten long
  bass notes or lengthen short ones.

  The subtone section includes a low-frequency generator that enriches tone by
  generating complementary frequencies. Users can dive an octave below with sub
  or soar an octave above with high, sculpting bass lines that translate to
  sound systems from club setups to home audio. The eq & enhance panel splits
  audio into 3 linear bands with broad-range band gain and proportional
  saturation, featuring press (670-style compression algorithm), depth (analog
  hardware convolution), heat (characterful saturation), and mix (dry/wet
  control).

  Bassshaper is built on vector graphics with a resizable interface displaying
  live audio in the central window, showing exactly what's happening to the
  signal as it travels through the plugin in real time. The plugin includes ab
  comparison, undo/redo buttons, auto gain compensation, oversampling and
  limiting options, and a huge number of factory presets suitable for all kinds
  of bass processing flavours across multiple genres.
