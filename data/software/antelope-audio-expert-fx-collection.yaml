description: "20 analog-modeled audio plugins for professional mixing,
  production, vocal tuning and creative sound design. Includes preamps,
  compressors, EQs, tape and pitch correction, native in your DAW."
details: |-
  The Expert FX Collection bundles 20 Antelope Audio plugins focused on analog emulation and creative sound design. The collection offers expanded creative scope that is all about the analog sound, making it easy to push the boundaries of recordings with vintage-modeled processing.

  The plugins run natively in a DAW on macOS or Windows, or in real-time on an Antelope Audio Synergy Core interface for low-latency tracking and monitoring. Four of the included plugins (X902, SonaVerb, Halo, and InTune Performer) are Native only.

  Modeled emulations cover classic preamps (VPA76, BAE 1073MP), iconic compressors (Tubechild670, COMP-4K-STRIP, COMP-4K-BUS, Tube 176, Gyratec X), and vintage EQs (BAE-1084, LANG-PEQ2, VEQ-4K BLACK, VEQ-56, Gyratec XIV), alongside a tape machine emulation (Reel-To-Reel) inspired by Antelope founder Igor Levin's decades of work with tape.

  Creative and modulation tools include BBD-Chorus (inspired by the Boss CE-1), Vari-Speed Tremolo, Adaptive Vibrato, the Halo multitap delay, and the SonaVerb reverb. Vocal-focused processors include the X902 de-esser and InTune Performer pitch correction.

  All 75+ Antelope Native plugins can also be unlocked via an Antelope Cosmos subscription, with the Expert FX Collection available as a one-time purchase bundle for users who prefer perpetual licenses.
specs: |-
  - 20 analog-modeled audio plugins in one bundle
  - Runs natively in a DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core interfaces
  - Includes preamps, compressors, EQs, tape, modulation, delay, reverb, de-esser and pitch correction plugins
  - Four plugins are Native only: X902, SonaVerb, Halo, InTune Performer
  - Bundled plugins: VPA76, Tubechild670, Reel-To-Reel, COMP-4K-STRIP, BAE-1084, X902, SonaVerb, Halo, InTune Performer, BBD-Chorus, Vari-Speed Tremolo, BAE 1073MP, COMP-4K-BUS, Gyratec X, Adaptive Vibrato, LANG-PEQ2, VEQ-4K BLACK, Tube 176, VEQ-56, Gyratec XIV
