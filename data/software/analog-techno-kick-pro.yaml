details: >-
  Analog techno kick pro has 243 phat techno kicks sampled from different analog
  drum machines such as jomox, roland tr and many many others.


  It's possible to mix sounds to create new kicks.


  Analog techno kick pro is empowered with a low harmonic boosting
  psychoacoustic algorithm from syncersoft to enrich low frequencies, essential
  for the sound of the kick drum.
