details: |-
  AutoBeat is a 12-track MIDI beat generator plugin that leverages the power of
  ai to generate unlimited beats in various styles, from hip-hop to techno. The
  workflow is simple: choose your parameters, click the generate button, edit,
  and use, or clear, and start again.

  Unlimited on-device ai beat generation, no internet connection or any
  subscription or credit purchase required. Generate a complete beat set (up to
  16 beats) or a single beat on demand. Choose from multiple musical styles,
  including random and mixed-style beats.

  Fine-tune generation with parameters such as density, tension, and variance.
  Song-structure-aware multiple beat generation (beat set): intro, verse,
  chorus, etc. Lock and regenerate only parts of a beat set while preserving
  others.

  12-track beat editor with step, velocity, ratchet, and timing offset controls.
  MIDI note mapping per beat pad and per track, fully customizable. Real-time
  MIDI input: trigger beats or play tracks via MIDI notes.

  Autobeat is a MIDI plugin. That means two things: it needs a suitable host to
  work, such as logic pro or ableton live. It does not produce sound on its own;
  it has to be connected to an audio source that has a MIDI input, such as a
  drum machine plugin.
