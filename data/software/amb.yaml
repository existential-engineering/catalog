details: |-
  AMB is a modular application for Windows and os x that enables post production facilities to speed up workflows significantly for a range of different tasks, including upmixing and loudness management.

  Providing power and control, amb uses threaded algorithm processing and multiple processing threads for parallel file and queue handling.
specs: |-
  - Threaded algorithm processing
  - Multiple processing threads
  - Parallel file and queue handling
  - Loudness core module
  - Upmix core module
  - Dynapt module
  - Mxf module
  - Prores module
  - Dolbye module
  - Enterprise module
  - Queue expansion
  - Thread expansion
  - Windows and os x compatible
