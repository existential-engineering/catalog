description: Boogex is a free guitar amplifier plug-in with a variety of sound
  shaping features for professional music production applications.
details: |-
  Boogex is also able to apply any speaker cabinet impulse response (selection
  of built-in impulses is available). The processing latency is close to zero
  making it possible to use boogex for real-time guitar processing.

  Boogex also includes reverberation module derived from voxengo oldskoolverb
  reverb.

  Convolution simulation of numerous speaker cabinets: various diameter and
  number of cones, various microphone positions. The cabinets range from 6"
  practice amps to 15" bass/keyboard cabinets, and some of the mic positions are
  far enough out that you get room ambience (completely realistic thanks to the
  convolution technique).

  Emphasis and cut section lets you selectively distort specific frequency bands
  with a great visual interface. (the effect is pre-distortion eq followed by
  the inverse eq post-distortion.) this is extremely useful for controlling the
  distortion sound.
specs: |-
  - Speaker cabinet impulse response
  - Built-in impulses
  - Reverberation module
  - Tone stack
  - Emphasis and cut section
  - Lows/mids/highs EQ
  - Tone controls
  - Drive control
  - Dynamics
  - Phase control
  - Out level control
  - Convolution simulation
  - Real-time guitar processing
  - Close to zero processing latency
  - Dynacab feature
