description: Tube compressor plugin modeled on Michael Brauer's Fairchild 666. Unique opto-tube hybrid compression and saturation for vocals, drums, and buses. Try it free.
details: |-
  MHB Red is a virtual analog compressor/saturator plugin developed by Kazrog in close collaboration with Grammy-winning mix engineer Michael H. Brauer (Coldplay, John Mayer, James Bay), based on his Fairchild 666 Compressor. The page subtitles it "Michael Brauer's Rare Vintage Hybrid Compressor" and presents it as one of Brauer's go-to color compressors, available as a plugin for the very first time.

  Kazrog stresses that the 666 is a Fairchild unlike any other: it was Fairchild's hybrid opto-compressor, distinct from the delta-mu 660 and 670. Its combination of tube amplification and solid-state control circuitry is described as producing a musical compression character all its own, part compressor and part saturation box. The modeled unit is Brauer's personal 666, described as a key part of his vocal chain for decades.

  Controls are modernized while keeping the vintage behaviour: attack, ratio, threshold, release, and makeup gain have been updated for an intuitive workflow, and a dedicated THD control dials in everything from subtle tube warmth to aggressive saturation. Mix-oriented additions are sidechain high-pass and low-pass filters, stereo link, wet/dry mix for parallel compression, and Kazrog's Analog Entropy feature for authentic component-level variation between channels.

  Two endorsements appear on the page. Brauer: "The 666 has a very different feel from other Fairchild designs. It responds in a way that's uniquely musical, and brings elusive character to vocals and other tracks like nothing else." Brandon Bell (Brandi Carlile, Billy Strings, Allison Russell): "I'm sort of obsessed with the MHB Red, it is so musical pushing it or not. I'd take this over a 670 or 660 any day."

  System requirements are listed per platform. Mac needs macOS 10.13.x or higher and a VST, AU, or AAX (64-bit) host, with Pro Tools 12 or higher for AAX; all Kazrog plugins are Universal Binary 2 with native Apple Silicon and Intel support. Windows needs Windows 10 or higher and a VST or AAX (64-bit) host. Linux needs a VST3, VST2, or LV2 compatible host and has been tested on Ubuntu, Linux Mint, Debian, and Manjaro. The licence is 100% perpetual for multiple devices with no iLok and no subscription fees, and the demo is time-unlimited with random silent output and preset saving disabled. The page carries a trademark notice stating that Fairchild is a registered trademark of Universal Audio, Inc. and that the product is not affiliated with, endorsed by, or sponsored by Universal Audio.
