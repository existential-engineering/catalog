description: Tube compressor plugin modeled on Michael Brauer's Fairchild 666. Unique opto-tube hybrid compression and saturation for vocals, drums, and buses.
details: |-
  MHB Red is a virtual analog compressor/saturator plugin developed by Kazrog in close collaboration with Grammy-winning mix engineer Michael H. Brauer (Coldplay, John Mayer, James Bay), based on his personal Fairchild 666 hybrid opto-compressor.

  The plugin models both the tube amplification and solid-state control circuitry of the original hardware, delivering warm, musical compression and saturation. Controls include Attack, Ratio, Threshold, Release, Makeup Gain, and a dedicated THD control that ranges from subtle warmth to heavy saturation.

  MHB Red includes sidechain high-pass and low-pass filters, stereo linking for bus and mastering applications, and a wet/dry mix control for effortless parallel compression. The Analog Entropy feature introduces authentic component variation to recreate the subtle inconsistencies of real analog hardware.

  The plugin ships as a perpetual license for multiple devices with no iLok required and zero subscription fees.
specs: |-
  - THD control for harmonic saturation
  - Sidechain high-pass and low-pass filters
  - Stereo linking
  - Wet/dry mix for parallel compression
  - Analog Entropy for component variation modeling
  - macOS 10.13+; Universal Binary 2 (Apple Silicon & Intel)
  - Windows 10+
  - Linux: VST3, VST2, LV2 compatible hosts
  - AAX requires Pro Tools 12+
  - Perpetual license; no iLok, no subscription
