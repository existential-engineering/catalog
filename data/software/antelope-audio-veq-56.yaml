details: |-
  VEQ-56 is a 10-Band Graphic Console Equalizer based on a vintage American unit from 1969. Equal parts musical and corrective, it delivers an unmistakable sound with a punchy, precise character.

  It runs natively in your DAW on macOS or Windows, or in real-time on a Synergy Core interface.
