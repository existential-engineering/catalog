details: >-
  7q was designed as a simple, but effective 64-bit alternative to the graphical
  classic eq with musically predefined bands and q values.


  With the integrated high pass and low pass filters, you can tidy up your mix
  and make it more transparent.


  Use it either as your main eq for an instrument or vocal track, or simply for
  a rough clean up before sending your signal into a compressor or adding other
  effects.


  7q by manda audio is a virtual effect audio plugin for macos and windows.
