details: >-
  Missing the richness and feel of pre-1950 tape recorders? Aloha re-creates the
  body of the oldest and slowest tape devices ever! The colour is preserved
  while the unwanted artifacts are reduced to the bare minimum.


  A broad range of controls are here to help you tailor the sound you need.


  Allows you to blend the original signal with the one at the end of the
  processing chain, while controls the output volume.


  Controls the speed of the tape device in inches per second.


  Lets you adjust the amount of harmonics and pitch flutter, while controls the
  compensation gain for the high-end.
