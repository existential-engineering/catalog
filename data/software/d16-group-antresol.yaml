description: Analog BBD Stereo Flanger
details: |-
  Antresol is a modern software recreation of a classic 1970s flanger stompbox, resurrected with exquisite attention to sonic detail. It is designed to appeal not only to performing guitarists, but to instrumentalists and producers of virtually any genre, from rock guitar riffs to melodic synth lines. The original hardware, conceived in the mid-70s, became a benchmark for flanger-type effects thanks to its uniquely rich character defined by luxuriously harmonious interacting resonances.

  The key element around which Antresol is designed, an analog BBD integrated circuit, posed unique challenges for digital emulation, particularly around the feedback parameter's peaks and notches in the frequency response. The result is a refined BBD emulation using quasi-analog signal representation throughout, guaranteeing behavior much more akin to the original physical circuit, while avoiding unwanted artifacts such as aliasing and offering the rock-solid stability only digital can provide.

  An exceptionally accurate emulation of an impulse-controlled, solid-state analog delay line (a Bucket Brigade Device) is responsible for Antresol's impeccable sonic characteristics. The plugin features a fully controllable stereo LFO with adjustable phase and tempo sync, the ability to delink stereo channels and control parameters independently for Left/Right or Mid/Side. Mistress mode automates mixing and feedback control for the classic flanger sound, while M/S mode allows switching between L/R or M/S processing with a Channel X-Fade knob to shape the stereo sound stage.
specs: |-
  - True BBD Emulation: accurate emulation of an impulse-controlled, solid-state analog delay line
  - Stereo LFO with adjustable phase and tempo sync, independent Left/Right or Mid/Side control
  - Mistress mode: automatic mixing and feedback control for classic flanger tones
  - M/S Mode: switch between L/R or M/S processing with Channel X-Fade knob
  - MIDI Learn for easy controller assignment
  - Several UI sizes and HiDPI support
  - 78 included presets
