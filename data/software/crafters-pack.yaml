details: |-
  Blue cat's Crafters Pack is the ultimate audio toolkit to design your own
  custom toolbox: write your own effects or virtual instruments with blue cat's
  plug'n script, create custom MIDI controllers with blue cat's remote control,
  and connect everything together with blue cat's patchwork, as a plug-in or
  standalone application.

  With blue cat's mb-7 mixer, create your own multiband processors by applying
  plug-ins of your choice (including your own!) to distinct frequency bands.

  The "multi" analysis plug-ins series are also included, to help you during the
  creation process: analyze and match existing gear, or check how your
  processing chains are impacting the signal.

  Crafters pack by blue cat audio is a virtual effect audio plugin for macos and
  windows. It functions as a VST plugin, an audio units plugin, a VST 3 plugin
  and an AAX plugin.
