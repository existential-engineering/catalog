  The ad 480 free has professional reverb sound effect with variable room size. Ios 7 ready. Full audiobus integration. Supports internal and external audio interfaces (USB class compliant or mfi). Compatible from ipad 2, ipod touch 5g, iphone 4s and above.

  Interapp audio support. Dynamic upgrade (ad 480 free is automatically upgraded to pro or basic features when ad 480 pro or ad 480 basic is installed). Mix slider.

  Ad 480 free by fiedler audio is a mobile audio app and a software application for ios. It functions as a standalone application.
