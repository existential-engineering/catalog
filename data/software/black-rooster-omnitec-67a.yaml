description: Vintage tube preamp plugin inspired by the Altec 1567A. Motown grit, saturation and 3-band EQ for vocals, bass, drums.
details: |-
  The OmniTec-67A is a vintage tube preamp built for one thing: turning a sterile digital signal into something with grit, density and character. This isn't a clean gain box. The original Altec 1567A was a rack-mounted tube mixer with a simple two-knob EQ and enough gain to redline anything you fed it, and engineers used exactly that to their advantage. Black Rooster modelled its drive-tube input and output stages so you can push a source into saturation, harmonics and subtle distortion — the raw analog tone Motown records are made of.

  The 1567A heavily influenced the sound of countless Motown hits, from The Supremes to The Temptations, and was famously worked by engineers like Russ Terrana and Matt Wallace. It's impossible to picture those records — the purposefully distorted brass, the oversaturated electric piano, the fat bass and vocals — without the sound this box made. After the Motown era it stuck around as a cheaper route to a coloured tube tone, and it never really left. Under the hood, the signal runs through a mic input transformer into a premix amplifier (the first half of a 12AX7), through an input control and a single-stage booster into the EQ, then into a further tube network (third 12AX7 and a 6CG7) and an output transformer for that extra oomph. Black Rooster recreated the whole chain with its real-time circuit simulation, so the drive builds the way the hardware's does.

  Where the original gave you one voice, the OmniTec-67A gives you three. The Tube Type control (A, B and C) swaps between three modelled valves, each with its own frequency response, output gain and harmonic range — go from a polite warm-up to full crunch just by changing tubes. A two-position Bias switch (Low or High) then sets how hard those tubes are driven: run them cold and the valve sounds thin; run them hot and it oversaturates — two discrete voltages, not a continuous sweep, so it's easy to recall. A Mic/Line switch chooses the input character (mic vs. line impedance, auto-compensated at the output), Phase flips polarity at the input, and the wet/dry Mix knob (0–100%) lets you dial saturation in parallel so you keep the dry punch underneath. Input gain (±15dB) and Output level (±15dB) let you set exactly how hard you hit the tubes and how loud you leave the stage.

  On vocals, a hotter tube and a touch of bias push add the throaty midrange grit that makes a modern take sound recorded-to-tape. On bass and electric piano it delivers that saturated, harmonically dense Motown weight — try it on a DI'd bass to fake a room and an amp at once. On drums it turns thin samples into something that thumps, and on a full bus it adds cohesion and colour. The added vintage 3-band EQ shapes tone right where the tubes are working: Bass at 50Hz (±12dB), Mid at 400Hz (±12dB) and a sweeping Treble shelf whose corner slides from roughly 8kHz down to about 1kHz as you turn it (up to ±20dB), more control than the hardware ever offered.
