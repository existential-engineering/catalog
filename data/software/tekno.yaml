details: |-
  Tekno is a modern drum synthesizer plugin that generates unique drum sounds from scratch using advanced analog circuit modeling and synthesis techniques. It offers musicians the ability to create electronic drums without relying on traditional samples, providing dynamic and evolving sound generation for various musical genres.

  The plugin features 18 distinct drum synthesis engines covering kicks, snares, hats, percussion, and more. Users can deeply edit each voice using intuitive controls, with the ability to randomize sounds, apply humanization, and explore complex sound design options through circuit-bending and calibration settings.

  Tekno includes a powerful built-in sequencer with creative beat generation tools, allowing users to create evolving polyrhythms, adjust step probabilities, and generate unique patterns. The sequencer supports MIDI export, tempo sync, and offers advanced randomization features to inspire new musical ideas.

  The plugin comes with extensive effects processing, including analog-modeled tape saturation, excitation, compression, and a master section with a punchy limiter/clipper combination. Users can access over 70 full kits and explore preset expansion packs across various electronic music genres.

  Developed in collaboration with analog modeling expert Jatin Chowdhury, Tekno represents a modern approach to electronic drum synthesis, offering unprecedented flexibility and sound design capabilities for producers across dance, hip-hop, techno, and experimental music styles.
