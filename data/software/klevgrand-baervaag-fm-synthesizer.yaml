details: |-
  Baervaag is a fairly simple FM synthesizer with one carrier and one modulator. The oscillator waveforms can be modified seamlessly between sine wave to pure square wave with PWM (pulse width modulation).

  The Carrier Oscillator XY pad controls pulse width modulation on the X axis and the wave shape on the Y axis. The Carrier ADSR controls the carrier oscillator envelope, and its attack time is optionally reactive to MIDI Velocity.

  The Modulator Oscillator XY pad works like the Carrier Oscillator, but it also has a frequency multiplier button. The Modulator relative ADSR sliders control the envelope of the Modulator oscillator and are relative to the Carrier ADSR: if all values of the sliders are in the middle, the Modulator envelope will be the same as the Carrier's.

  The FX & Master section provides a High Quality Delay, a High Quality Chorus and a High Quality Master Output Knob. FM Feedback, Filter, ADSR Attack and Volume can be modulated by velocity, and a controllable wobble factor adds analogue unpredictability. Baervaag ships with 50+ handcrafted presets created by professional musicians.
specs: |-
  - FM synthesizer with one carrier and one modulator oscillator
  - Oscillators can be shaped between sine, square and PWM
  - FM Feedback, Filter, ADSR Attack and Volume can be modulated by velocity
  - One ADSR for each oscillator
  - Modulator ADSR values are relative to the Carrier ADSR
  - Carrier Oscillator XY pad: pulse width modulation on the X axis, wave shape on the Y axis
  - Modulator Oscillator XY pad with an additional frequency multiplier button
  - Controllable wobble factor that adds analogue unpredictability
  - FX & Master section with High Quality Delay, High Quality Chorus and High Quality Master Output Knob
  - 50+ handcrafted presets created by professional musicians
  - macOS: requires macOS 10.12 or later, running an AU, VST or AAX compatible 64-bit host
  - Windows: requires Windows 7 (SP1) or later, running a VST or AAX compatible 64-bit host
  - macOS binaries support ARM (M1) CPU natively
  - AAX supports Apple Silicon as of v1.3.1
  - 64-bit only
  - iPad/iPhone version available as a standalone app and an AUv3 plugin
