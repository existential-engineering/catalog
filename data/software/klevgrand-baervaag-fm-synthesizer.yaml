details: |-
  Baervaag is an easy to use, but still powerful and tweakable, FM synthesizer.
  During development, focus has been on creating a playable and expressive
  instrument with an intuitive interface. In addition to the FM synthesis
  there's a LP filter, a "wobbler" (for that analogue touch) and a stereo chorus
  under the hood.

  The carrier has an xy pad with pwm x sine-square wave shape; an envelope with
  an attack modulated by velocity; and feedback to control how much the carrier
  is modulated by the modulator, and optionally by MIDI velocity. The modulator
  has the same xy pad but you can multiply the frequency value of the note
  played from 0.5 to 4x, and you can set the adsr so each value can be higher or
  lower relative to the carrier.

  Effects include a pitch/amplitude wobble with control on frequency and depth;
  a lp resonating filter based on the carrier or MIDI velocity; a delay with bpm
  and note length, feedback, hp/lp and dry/wet mix; and a chorus.

  Fm feedback, filter, adsr attack and volume can be modulated by velocity.
  Oscillators can seamlessly be shaped between sine, square and pwm. One adsr
  for each oscillator. Built-in tempo synchronised ping-pong delay. Controllable
  wobble factor that adds analogue unpredictability.
specs: |-
  - FM synthesis
  - LP filter
  - Stereo chorus
  - Wobbler
  - 77 handcrafted presets
  - FM feedback modulation
  - Filter modulation by velocity
  - ADSR attack modulation by velocity
  - Volume modulation by velocity
  - Oscillator wave shaping (sine, square, PWM)
  - One ADSR per oscillator
  - Tempo synchronized ping-pong delay
  - Controllable wobble factor
  - Xy pad (carrier)
  - Xy pad (modulator)
  - Modulator frequency multiplication (0.5x to 4x)
  - Velocity modulation
  - Pitch/amplitude wobble
  - LP resonating filter
  - Delay with bpm and note length
  - Delay feedback control
  - HP/LP filter in delay
  - Dry/wet mix control
