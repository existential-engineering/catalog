description: Orbita is a Euclidean Rhythm Drum Machine plugin designed for
  creating evolving, interlocking grooves. For macOS, iOS, Windows, and Linux
  (VST, AU, AAX, CLAP)
details: |-
  Orbita is a Euclidean Rhythm Drum Machine plugin designed for creating evolving, interlocking grooves with ease. Built around a circular sequencer, it lets you distribute beats across eight sample tracks and instantly explore polyrhythms, shifting accents, offsets and swing, load your own samples, and transform simple pulses into organic, hypnotic rhythms.

  Each of Orbita's eight tracks can run its own rhythmic cycle. Steps define the length of a pattern and Hits add triggers, which are spread as evenly as possible across the cycle. Accents add emphasis, Offset rotates the pattern without changing its steps or hits, and Swing shifts the timing feel. A Reset parameter sets the number of beats after which the sequencer restarts, controlling when evolving rhythms realign.

  Orbita comes with banks covering classic drum machines, acoustic percussion, found sounds, experimental sources, and generative material. Factory banks include acoustic drum kits, 808, CR-78, DD-10, DR-220A, Elsita, LELL UDS, SR-LP-88, Super Drums, Super Percussions, Ult-Sound DS-2, VL-1, Hybrid Grooves, TX101 and Mixed Percussions. Custom banks are built by loading samples into the Bank Editor and rearranging them by drag and drop.

  Each sample has its own filter with LowPass, HighPass, BandPass and Notch modes in 2 pole and 4 pole versions, plus its own LFO modulation section routable to Pitch, Pan, Volume, Cutoff or Resonance. Orbita can also be played as a classic eight pad drum machine, triggering each sound directly with custom MIDI notes assigned to match a controller.

  Orbita is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP). It is also available on the App Store for iOS and iPadOS (AUv3 and Standalone).
specs: |-
  - Euclidean Sequencer
  - 8 Tracks / Samples
  - Filter and LFO Modulation per Track
  - 36 Factory Banks
  - Custom Bank Editor
  - MIDI Out
  - Resizable Window
  - Preset Browser with Randomizer
  - Brightness and Contrast Controls
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP 64-bit)
  - macOS 10.13 - macOS 26, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP 64-bit)
  - 1 license up to 3 computers, no iLok, no internet connection required to activate
