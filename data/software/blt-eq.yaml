details: |-
  Blt (bass level treble) is a two band program equalizer. It features one band
  of bass shelving fixed at 100hz with boost and attenuation, a level control
  with boost and attenuation to adjust the right amount loudness and one band of
  treble shelving fixed at 5kz with boost and attenuation.

  It produces a big bottom end with a smooth top end.

  Blt eq by urs is a virtual effect audio plugin for macos and windows. It
  functions as a VST plugin and an audio units plugin.
specs: |-
  - Two band program equalizer
  - Bass shelving fixed at 100hz with boost and attenuation
  - Level control with boost and attenuation
  - Treble shelving fixed at 5khz with boost and attenuation
  - Low band shelving boost 17.5db at 100hz
  - Low band shelving attenuation 13.5db at 100hz
  - Input line trim -12db to +4db variable to 0.1db
  - High band shelving boost 17.5db at 5khz
  - High band shelving attenuation 13.5db at 5khz
  - Phase reverse switch
  - In/out bypass switch
  - Numeric entry/display Windows for each band and input/output trim gains
  - Plasma style input and output vu meters
