description: Meringue is a delay effect whose delay runs alternately forwards
  and backwards rather than continually forwards, so echoes play in both
  directions and the gap between a note and its echo varies. A filter and
  saturation section and a large view of the delay buffer are included.
details: |-
  Meringue is a delay effect. Unlike most delays, the delay runs alternately forwards and backwards rather than continually forwards, and that simple difference produces some interesting and unusual effects.

  Delay echoes play alternately forwards and backwards, and the time between a note and its echo varies depending on the location of the note in the delay buffer, rather than staying constant as it would in a normal delay.

  Because it is useful to know where the delay buffer write position is and which way it is moving, Meringue features a large graphical overview of the sound in the delay buffer and of the motion of the write position.

  Meringue also has a filter and saturation section for creatively treating the sound.

  The delay time and the filter LFO can be synced to the host application's tempo, and the phase of the delay and of the LFO can also be reset manually.
specs: |-
  - 64 bit AU, AAX and VST formats
  - macOS and Windows
  - Delay buffer read alternately forwards and backwards
  - Large graphical overview of the delay buffer and write position
  - Filter and saturation section
  - Delay time and filter LFO syncable to host tempo
  - Manual phase reset for the delay and the LFO
  - Activation through an ilok.com account, to an iLok, the iLok Cloud or the local machine
  - A physical iLok is not required
  - 7 day trial available by launching the plug-in without a license
