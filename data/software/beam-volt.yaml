details: |-
  Volt is a creative 3-in-1 distortion plugin. Combining analog-inspired
  saturation, multi-band compression, and digital bit-shaping with a dynamic
  feedback delay network, volt can electrify any sound. Add warmth, punch, and
  unpredictable resonances to any signal, from subtle tube-inspired drive to
  radical bit-crushing chaos.

  The heat knob introduces a warm, asymmetrical tube-like saturation. Low values
  provide gentle coloration. Higher values drive the signal into thick,
  amplifier-style fuzz and overdrive.

  The crush knob manipulates underlying audio bits for crunchy digital artifacts
  and edgy textures. Keep it subtle for added bite and crispiness, or crank it
  high for glitchy, bitcrushing chaos.

  The charge knob applies a dynamic multi-band compression to the signal. Low
  settings add subtle brightening and dynamic punch, while higher values deliver
  a more pronounced, shimmering lift with mild saturation.

  The feedback delay network in volt integrates the heat, charge, and crush
  effects into a dynamic feedback system inspired by the organic feedback
  resonance of guitar amplifiers. Combine these controls to take your sound in
  exciting new directions from sculpting tight, controlled saturation to
  expansive, reverb-like resonances.
