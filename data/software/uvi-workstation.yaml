details: |-
  UVI Workstation is a free multitimbral sample player and instrument engine. It serves as the gateway to the entire UVI soundware library, providing a smooth real-time workflow with integrated effects, an advanced arpeggiator, and unlimited parts.

  Version 4 introduced a refined interface with a modern browser, instrument tagging, audio previews for every preset, and a free UVI Starter Soundpack. Compatible with UVI soundbanks (.ufs), AIFF, FLAC, MP3, MP4, REX1/2, WAV, CAF, and Apple Loops.
specs: |-
  - Free download
  - Multitimbral engine with unlimited parts
  - Advanced arpeggiator with 128 steps and 26 playback modes
  - Comprehensive effects suite
  - Audio preview for every preset
  - MIDI learn with up to 128 assignable automations
  - Surround support up to 10.2 channels
  - Scalable UI
  - AU plugin (macOS)
  - Native Apple Silicon support
  - macOS 10.11 or newer
  - Windows 10 or newer
  - 64-bit only
  - 4 GB RAM minimum (8 GB recommended)
