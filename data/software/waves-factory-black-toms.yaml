description: "This library for Kontakt features up to 21 layers of 3 types of toms played in a dry studio environment: low, mid and high. Simple and easy to use interface with an innovative way of adding more tom layers using the mod-wheel."
details: |-
  Black Toms is a Kontakt sample library of three tom types, low, mid and high, played in a dry studio environment, with up to 21 layers of players available through an innovative mod-wheel layering system.

  This is a new and enhanced version of the library that was originally released in 2012 under the same name, featuring new recordings, a new interface and a new script.

  The close mic position can be combined with the full sound of a huge natural room to create a thicker sound, and the number of tom players can be raised from one to seven, fourteen or twenty-one for larger, more epic parts. The library is aimed at war, battle and energy tracks.

  The built-in mixer controls the two mic positions separately, with a load/purge switch for each channel, pan, width, volume, mute, solo, phase shift and an output selector for mixing the channels in a DAW.

  The effects page adds any effect in any order, including EQ, compressors, modulation effects, distortion, saturation, tape machine, reverbs, amp simulators and a convolution engine loaded with the included impulse responses. The settings page controls round robin, dynamic range, velocity curve, envelope and an extra parameter that adds a sub-octave tom for extra thickness.
specs: |-
  - 3 tom types: low, mid and high
  - Up to 21 tom player layers, selectable at 1, 7, 14 and 21 players
  - Mod-wheel controlled layering of additional tom players
  - Size: 1.58 GB
  - 1,729 samples
  - 6 velocity layers
  - 6 round robin
  - 2 microphone positions, close and room, controlled independently
  - Mixer with load/purge per channel, pan, width, volume, mute, solo, phase shift and output selector
  - Effects page with EQ, compressors, modulation effects, distortion, saturation, tape machine, reverbs, amp simulators and a convolution engine with included impulse responses
  - Settings page with round robin, dynamic range, velocity curve, envelope and a sub-octave tom parameter
  - Works with Kontakt 5.7.3 and newer versions
  - Full version of Kontakt required (Kontakt Player will run in demo mode)
