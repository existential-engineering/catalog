details: |-
  Hand Clapper is a drum synthesizer plugin dedicated to claps sounds. The design is inspired by a famous Japanese percussion synthesiser from the '80. There are three internal noise sources that are used to recreate the classic sound of vintage analog drum machines (such as 808, 909, HC2, and more).

  Inspired by the classic Boss HC-2 pedal, the raison d'etre of Hand Clapper is the generating of handclaps. Out of the box it comes with 45 Factory Presets using 21 custom analog samples taken from several analog instruments (drum machine, analog synths, and real claps) to emulate the TR-808 and TR-909, and the HC-2 itself.

  You are not limited to just the onboard sounds though, you can also load in any sample of your own choosing (a single WAV up to four seconds long), which can lead to some very interesting results with a little experimentation. Try using synth shots, piano noises or vocals for example.

  Hand Clapper is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP). It is also available on the App Store for iOS and iPadOS (AUv3 and Standalone).
specs: |-
  - 4 sources: 808, 909, HC2, Custom
  - 48 Factory Presets
  - 24 Factory Samples from vintage gear
  - Tone bandpass/peak filter
  - Vintage Reverb
  - Brightness and Contrast Controls
  - Preset system with randomizer
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP 64-bit)
  - macOS 10.13 - macOS 26, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP 64-bit)
  - 1 license up to 3 computers, no iLok, no internet connection required to activate
