description: "Stereo panning plugin offering four distinct panning modes: Level
  (refined classic level pan with multiple pan law options), Delay (small time
  delays modeling human hearing for immersive stereo), Spectral (changes timbre
  by focusing higher frequencies toward pan direction), and Phase (constant
  phase shifts to expand sound field). Used by Chris Fogel for mixing
  Christopher Nolan's Tenet."
details: |-
  1 page

  Level panning with multiple pan law options
  Delay panning using small time delays modeling human hearing
  Spectral panning mimicking natural head shadowing
  Phase panning for expanded sound field without level changes
