description: Panpot brings four different modes of panning in a single plugin
  that will transform the way you think about stereo, expanding beyond
  traditional level-based panning with delay, spectral, and phase-based spatial
  audio cues.
details: |-
  Panpot brings together four different modes of panning in a single plugin that will transform the way you think about stereo.

  There are a few different auditory cues that enable humans to hear spatially, that is, to identify the size, location, and distance of a sound in space. These cues fall into four main categories: Level Differences (ILD), Time Differences (ITD), Spectral Cues, and Distance Effects. The traditional audio level panner, the one found on almost every audio console since the 1970's, gives an engineer control of only one of these cues: level differences. Level panning works well enough for some things, but it often falls short, forcing us to rely on other tools (like delays, reverbs, stereo widening, EQ) to achieve more depth and definition in the stereo field.

  You can think of level panning as panning in black & white; while you can convey some sense of light and dark, you don't have access to the same depth, nuance, and range that you would if you were working in color. Panpot gives you the full color spectrum for stereo audio cues. You can choose to use it however you like: for realistic, hyper-realistic, or totally unrealistic spatial effects. Panpot gives you four different panning “colors,” but we don't tell you what to paint.

  Panpot is not a “3D Audio” panner. While Panpot can produce some very “3D” sounding effects, it does not do things that rely on individualized HRTF's, like elevation and front/back placement. Instead, Goodhertz focused on cues that translate well on a number of stereo systems: speakers, headphones, laptops, and so on, expanding the expressiveness of panning without focusing exclusively on mimicking reality.

  The name is a contraction of “Panoramic Potentiometer.” Panpot has 1 page of advanced controls, documented in the plugin manual.
specs: |-
  - Level panning: a refined version of the classic level pan, with superior automatability and several pan law options
  - Delay panning: creates a strong sense of sidedness without altering the stereo level balance, using small time delays that closely model human hearing delays (at 1x)
  - Spectral panning: changes the timbre of the stereo image, focusing higher frequency sounds toward the pan direction, mimicking natural head shadowing
  - Phase panning: creates a constant phase shift between the left and right channels to declutter the mono image and expand the sound field
  - 1 page of advanced controls
  - Interface available in English, Spanish, Portuguese, French, Italian, Arabic, Korean, Japanese, Simplified Chinese and Traditional Chinese
  - Light Mode and Dark Mode interface options
  - 64-bit only
