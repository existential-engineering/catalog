description: LANDR FX Acoustic. Multi-FX plugin for acoustic guitar. Bring out
  vibrant tones and rich character from your acoustic guitar with LANDR FX.
  Included in LANDR Studio.
details: |-
  LANDR FX Acoustic is a multi-effect plugin built for acoustic instruments. It adds everything from dark ambiance to sparkling definition to guitar, piano, violins and everything acoustic, with presets covering EQ, dynamics, effects and more.

  The plugin ships with 49 meticulously crafted presets that deliver a polished sound instantly, so a track can be fast-tracked to a finished tone without building a chain by hand.

  Control is centred on an easy-to-use blender dial that takes the guesswork out of complex mixing techniques, letting the user reach a target sound faster than with individual parameter tweaking.

  The effects on offer include Reverb, Chorus, Delay and more, and LANDR positions the plugin as a studio staple that defies genre, style and instrument. The marketing page frames its use cases as adding acoustic definition, clarity or ambiance quickly, streamlining production with versatile presets, and finding new colour and character in seconds.

  LANDR FX Acoustic is included with the LANDR Studio subscription, which bundles plugins, samples, mastering and distribution. The product page features a demonstration by Oscar-winning engineer Daniel Rowland using the plugin to add texture and character to instrument tracks.
specs: |-
  - 49 presets (page also cites 50 presets)
  - Blender dial for simplified control
  - Reverb, Chorus, Delay and more
  - EQ and dynamics processing
  - macOS: MacOS X 10.14 or higher
  - macOS: Apple Silicon Native or Intel (VST3, AU, AAX)
  - Windows: Windows 10 (64 bit) or higher (VST3, AAX)
