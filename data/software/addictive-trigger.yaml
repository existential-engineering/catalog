details: |-
  Addictive Trigger is the world's first intelligent drum replacer. During the research phase, users around the world reported that accurate hit detection is absolutely critical when using drum replacement plugins. XLN Audio created an entirely new method for drum hit detection called Audio Fingerprint, which uses FFT analysis to accurately identify drum sounds even with significant mic bleed or background noise in the source material.

  The SuperStart feature eliminates the need for tedious parameter fine-tuning by listening to source material and automatically providing suitable detection settings. In most cases, this is all that is needed for accurate drum detection, letting users spend more time on creative tasks like dialing in drum sounds.

  In addition to intelligent detection and workflow features, Addictive Trigger ships with presets tailored specifically for drum replacement. These sounds are recorded at world-class studios like Fairfax Recording (formerly Sound City) and United Recording (formerly Ocean Way), utilizing some of the finest gear and most experienced ears in the business.

  Addictive Trigger works as a complete standalone solution without requiring additional software. It also supports most popular third-party drum instruments, allowing users to drag-and-drop properly formatted MIDI data to their favorite instrument. Users who own Addictive Drums 2 can use all of their favorite presets and ADpak expansion sounds immediately in Addictive Trigger without any conversion.

  The Audio Fingerprint system can differentiate between different stroke types played at similar velocities, such as sidestick and open snare hits, enabling Addictive Trigger to play back correct articulations even when the incoming source material has different kinds of drum hits with similar peak levels.
specs: |-
  - Audio Fingerprint detection algorithm using FFT-based matching
  - SuperStart automatic parameter configuration
  - Detects ghost notes from background noise while rejecting mic bleed
  - Differentiates between stroke types at similar velocities
  - Includes drum replacement presets from Fairfax Recording and United Recording studios
  - MIDI drag-and-drop export to third-party drum instruments
  - Full compatibility with Addictive Drums 2 presets and ADpak expansions
  - macOS 10.13 or later (64-bit)
  - Windows 10, 11 (64-bit)
