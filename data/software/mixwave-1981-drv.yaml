description: A software emulation of the 1981 Inventions DRV pedal, a distortion
  and preamp boost pedal. It combines a distortion circuit and preamp boost with
  DRV and CUT tone controls plus wet/dry mix and filtering for mixing use.
details: |-
  Born from a meticulous design process spanning over three years, the 1981 Inventions DRV pedal has earned reputation for its clarity, warmth, and versatility. In partnership with 1981 Inventions, we bring that unmistakable tone to the digital world. Utilizing our component-level modeling, the distinct sonic character of the iconic DRV has been faithfully recreated in plugin form. Introducing, MixWave: 1981 DRV .
