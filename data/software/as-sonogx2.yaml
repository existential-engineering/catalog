details: >-
  As_sonogx2 by anton savov is a virtual effect audio plugin and a software
  application for windows. It functions as a VST plugin and a standalone
  application.


  As_sonogx2 is a stereo sonogram. It's mostly useful to display the difference
  between the two audio channels in real time.


  Features include two-channel sonogram with fft size of 512 displayed as 257
  pixels vertically (standalone, vst2), and two-channel sonogram with fft size
  of 1024 displayed as 513 pixels vertically (standalone-big).


  The plugin offers linear frequency scale, selectable display modes, selectable
  window type, frequency (y) marker for showing highlighted bin frequency, time
  markers (x) for measuring time durations on screen, and freeze function to
  toggle sonogram freezing.


  Additional controls include scroll on/off, speed setting from 100 to 2000 hz
  for fft sampling rate, gain adjustment for sonogram display, and offset to
  shift/delay one of the channels on the display.
