details: |-
  The aiep3 premier instrument pack is an inspiring collection of over 50
  virtual instruments and progressive sound-design tools for the modern
  producer, composer and performer. Developed by AIR Music Technology, the team
  responsible for creating the award-winning virtual instruments and core
  effects offered with avid's Pro Tools software, the air instrument expansion
  pack brings the world's most innovative virtual instruments to your favorite
  DAW.

  This incredibly diverse collection of instruments ranges from breath-taking
  emulations of vintage gear, classic instruments and unique synthesis
  technologies, enabling you to tap into familiar sounds or create something no
  one has ever heard before.

  The air aiep3 premier instrument pack combines multiple synthesis
  technologies, premium instrument samples, high-definition drums, vintage
  electric pianos, and a comprehensive groove-creation platform to provide
  today's musician, composer, and producer with the latest innovations of
  german-engineered software.

  Air instrument expansion pack 3 premier by air music technology is a virtual
  instrument and a virtual effect audio plugin and soundware for macos and
  windows. It functions as a VST plugin, an audio units plugin and an AAX
  plugin.
