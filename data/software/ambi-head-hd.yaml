details: >-
  Ambi head hd is a professional plugin for converting ambisonic signals (ambix
  up to order 3) into 3d binaural audio. It allows manipulations of 3d scenes
  (rotations and control of spatial width) and contains hrtf filters
  specifically designed for immersive listening and accurate reproduction.


  Two high order ambisonic (hoa) hrtfs are included in the plugin: sennheiser
  ambeo, reproducing the legendary neumann ku 100, ideal to binauralize sounds
  recorded with the ambeo vr mic, and google, to listen to ambisonic mixes
  exactly as they'll sound in youtube 360 and google vr applications.


  Custom hrtf filters can also be loaded via the integrated sofa importer, for
  personalized binaural rendering (currently only foa).


  An integrated goniometer provides visual display of the binaural output
  (lissajous display) giving insights into the scene spatial properties.
