description: HoRNet FilterSolo is a creative multi mode resonant filter with analog emulation and many modulation possibilities.
details: |-
  HoRNet FilterSolo is a resonant filter with a variety of modulation possibilities and analog emulation, making it a creative tool for sound shaping and design. Its flexibility, sound quality and rich features allow it to be a key plugin for any producer or sound designer looking to add movement and character to their audio.

  The core of FilterSolo is a high-quality digital filter model, which integrates both analog front-end and back-end emulation. When you apply a hot signal to the input and keep the analog emulation active, you will hear it distort in the same way that a solid-state unit would, adding warmth and character to the sound. This effect can help you craft everything from subtle tonal changes to aggressive saturation.

  FilterSolo offers four different filter types: low pass, high pass, band pass and band stop. Each filter type is available with two different slopes, 12dB or 24dB, giving control over how sharply the filter cuts off frequencies. The cutoff and resonance controls are fully adjustable, with cutoff determining the point at which the filter begins to take effect and resonance accentuating frequencies around the cutoff point.

  Both the cutoff and resonance parameters can be independently modulated via two envelope followers with adjustable attack and release times, ranging from 10 ms to 1 second. In addition, two LFOs can independently modulate either the cutoff frequency or the resonance, with speed settings that can be free-running or synchronized to the host tempo. Each LFO can operate in both positive and negative modulation.

  For users who prefer a cleaner sound, FilterSolo allows the analog saturation and the hiss effects to be disabled independently. The interface keeps every control readily accessible, with no modulation matrix or hidden menus, and features a large LCD display at its center showing parameters such as cutoff, resonance and LFO settings.
specs: |-
  - Multi-mode resonant filter with Low Pass, High Pass, Band Pass and Band Stop
  - Frequency range from 20Hz to 20000Hz
  - 12dB/octave or 24dB/octave slope
  - Analog saturation and hiss
  - Two independent envelope generator
  - Two independent LFO with tempo sync
  - Four different waveform for each LFO
  - Envelope and LFO modulation (positive and negative) for cutoff and resonance
  - Mac OS X (>=10.13) and Windows support
  - 64-bit compatibility both on Mac and Windows
  - Audio Units, VST3, AAX format
  - Apple Silicon native mode supported
  - No copy protection
