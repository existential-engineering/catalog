details: |-
  Atomika is Cherry Audio's painstakingly crafted emulation of the polivoks
  synthesizer manufactured at the formanta radio factory between 1982 and 1990.
  Featuring the circuit-modeled dsp designs of award-winning developer mark
  barton, atomika goes far beyond duplicating the notorious soviet synth.
  Atomika expands it with extended filter options, full polyphony, an
  arpeggiator, integrated studio-quality effects, and more.

  The polivoks synthesizer was developed by sound engineer vladimir kuzmin and
  his designer wife, olympiada. The polivoks is best known for its iconic
  filter. Instead of using the transconductance amplifiers found in typical
  state-variable filters, kuzmin developed a way to use programmable op-amps not
  initially intended for audio filter circuits, resulting in a distinctive and
  gritty filter sound. Other notable features include two loopable envelopes, a
  duophonic mode, and an industrial design aesthetic evocative of the soviet
  era.

  In a new collaboration with renowned dsp engineer mark barton, cherry audio
  has revived its distinctive sound with atomika. The original filter circuit
  has been enhanced with new controls like starve, filter drive, and amp drive,
  as well as new highpass, notch, and peak response filter modes. Together,
  these radically extend atomika's already twisted sonic palette.

  Atomika also boasts a powerful upgrade from duophonic to 16-voice polyphony.
  We've added unison oscillator stacking, expanded the lfo with more waveforms
  and incorporated velocity, tracking, aftertouch, pitch and mod wheel response,
  and glide options missing from the original hardware for enhanced performance
  possibilities.

  The new second panel features a flexible arpeggiator and four studio-quality
  effects: a new phasor effect, flange/chorus, echo, and reverb with a unique
  dedicated effects lfo for expanded parameter modulation. The panel labels of
  the immersive ui can be optionally set to cyrillic text. A "hide keyboard"
  option also allows users to maximize on-screen real estate. With over 350
  professionally crafted presets and extensive MIDI mapping capabilities,
  atomika offers a perfect blend of singular classic character and modern
  innovation, appealing to both rare synth enthusiasts and today's professional
  producers.
