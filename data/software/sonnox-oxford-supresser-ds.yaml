description: Oxford SuprEsser DS is an AAX-DSP version of the SuprEsser de-esser and dynamic EQ, covering the 1kHz to 20kHz range at sub-2ms latency for Avid S3L and S6L live consoles and Pro Tools HDX.
details: |-
  Building on the industry-standard Oxford SuprEsser, SuprEsser DS is optimised for live sound environments and low-latency tracking with support for AAX-DSP. While SuprEsser delivers full-spectrum dynamic control for mixing and mastering, SuprEsser DS focuses on the critical 1kHz to 20kHz range, where unwanted sibilance and harsh frequencies occur, making it quicker, more focused and more efficient to use in fast-paced live scenarios.

  When working in live sound, precision and speed are critical. SuprEsser DS combines the transparent de-essing of the original SuprEsser with near-zero latency and streamlined control, letting you focus on the most important frequencies without adding unnecessary delay or complexity. With its integration into AAX-DSP platforms, it is a tool for live engineers and anyone needing quick, efficient frequency control in real time.

  SuprEsser DS is purpose-built for AAX-DSP systems, making it a fit for Avid S3L and S6L live consoles and Pro Tools HDX users. With sub-2ms latency, it is optimised for real-time performance environments, delivering precise de-essing without delay.
specs: |-
  - Optimised frequency range: 1kHz to 20kHz
  - Floating threshold that dynamically tracks the signal in real time
  - Three listen modes: Mix, Inside, Outside
  - FFT display for targeting problem frequencies
  - Sub-2ms latency for real-time performance
  - Frequency-specific thresholding
  - Exclusively available in AAX-DSP format (Pro Tools Ultimate, Pro Tools HD, Avid VENUE systems)
  - Compatible with Avid S3L and S6L live consoles and Pro Tools HDX
  - macOS 10.13 High Sierra or later
  - Windows 10 (64-bit) or later
  - AAX-DSP instances per chip, mono: 3 at 44.1/48 kHz, 1 at 96 kHz
  - AAX-DSP instances per chip, stereo: 2 at 44.1/48 kHz, 1 at 96 kHz
  - Two simultaneous activations per licence, authorised with an iLok account (Local Machine, iLok Device or iLok Cloud)
