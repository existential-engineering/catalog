description: The Oxford SuprEsser DS is an optimized AAX DSP version of our
  award-winning De-Esser/Dynamic EQ Plug-In and is designed for use with Avid's
  S3L and S6L live consoles and Pro Tools HDX.
details: |-
  Optimized AAX DSP version of the award-winning Oxford SuprEsser de-esser/dynamic EQ. Floating threshold dynamically adapts to input levels for transparent sibilance control. Three listen modes (Mix, Inside, Outside) with FFT display for precise frequency targeting. Sub-2ms latency for real-time live performance use on Avid S3L and S6L consoles. Linear-phase design preserves tonal integrity while eliminating harsh sibilance.
specs: |-
  - Format: AAX DSP only
  - Latency: sub-2ms
  - Compatible systems: Pro Tools Ultimate, Pro Tools HD, Pro Tools HDX, Avid VENUE, S3L, S6L
  - Platforms: macOS 10.13 High Sierra or later, Windows 10 (64-bit) or later
  - Activation: iLok; 2 simultaneous activations
