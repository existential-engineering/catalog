details: >-
  Dual limiting amplifier lm-662 is a recreation of the classic fairchild 670
  limiter - when using the lm-662, music and instruments react the same as a
  fairchild 670 does.


  Useful as a limiter or a compressor depending on the program material and
  control settings.


  Dual channel (dual mono) with individual controls for a/b operation.


  Fast attack time with variable release time from 0.3 seconds to 10 seconds,
  supporting up to 192 khz sample rates.
