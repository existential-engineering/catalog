description: Multi-tap Sequenced Delay
details: |-
  Tekturon is a multitap-delay effect with 16 independent, high-quality delay lines. What sets it apart from other, similar products is the way it's controlled and the unique topology into which the taps are arranged: the Delay Matrix. Each delay line is equipped with its own comprehensive set of parameters for endless tweaking, adjustable locally (each separately) or globally (all at once) for both fine-grained and instant, performance-oriented control.

  A Master section allows control of all 16 delay lines at once, including the Time Grid (delay between subsequent taps and base delay time). Individually, each delay line's parameters include feedback relative to a base value, delay time as a multiple of the Time Grid, and a local filter. Despite the fixed overall topology, each of the 16 delay lines has its own independent set of parameters covering delay loop, panning, stereo spread, and a post-tap multi-mode filter.

  Conveniently placed, always accessible, MIDI-assignable mute buttons for selectively suppressing individual delay lines are especially useful in live performance situations, letting a performer invigorate arrangements and bring new life to a track on the fly.
specs: |-
  - 16 independent multitap delay lines arranged in a Delay Matrix topology
  - Global Master section controlling all delay lines at once (Time Grid)
  - Per-line local control: feedback, delay time multiple, local filter
  - Per-line delay loop, panning, stereo spread, post-tap multi-mode filter
  - MIDI-assignable mute buttons per delay line
  - Several UI sizes with HiDPI support
