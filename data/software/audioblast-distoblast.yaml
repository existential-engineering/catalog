  audio destruction
details: |-
  DistoBlast is a high-powered multi-algorithm distortion plugin designed for modern music producers, sound designers, and mixing engineers. Whether you're after subtle saturation, filthy fuzz, aggressive clipping, or full-frequency annihilation, DistoBlast delivers a vast range of sonic destruction, all in one sleek, intuitive interface.

  Nine distortion modes run from smooth analog overdrive to brutal FM-style wave shaping: Overdrive, Hot Valve, Clip Inferno, UltraCrunch, Bit Reducer, TurboFuzz, RageClip, Brutal Bill and QuadraFuzz. The QuadraFuzz engine is a multiband distortion with separate Drive controls for Low, Mid-Low, Mid-High and High frequencies.

  Each distortion type features Dry/Wet blend, Punch compression and post-distortion filtering. A pre-filter section offers Lowpass, Highpass, Bandpass or LP2 filters to shape the signal before it hits the distortion circuit.

  A preset manager saves and recalls settings through a built-in browser with quick-access functions. The interface is resizable from 75% to 200% with selectable visual styles, every parameter is automatable in the host DAW, and Ctrl+click or double-click instantly resets any knob to its default.

  Whether working in techno, trap, industrial, experimental sound design or just needing a powerful distortion toolbox, DistoBlast brings creative chaos and precise control together in a single plugin.
specs: |-
