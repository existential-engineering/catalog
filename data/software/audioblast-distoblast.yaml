  - QuadraFuzz engine: multiband distortion with separate Drive controls for Low, Mid-Low, Mid-High and High bands
  - Dry/Wet blend, Punch compression and post-distortion filtering on every distortion type
  - Pre-filter section with Lowpass, Highpass, Bandpass and LP2 options
  - Preset manager with built-in browser, save and recall
  - Resizable interface from 75% to 200% with selectable visual styles
