details: |-
  Crush. Shred. Sculpt. DistoBlast is a high-powered multi-algorithm distortion plugin designed for modern music producers, sound designers, and mixing engineers. Whether you're after subtle saturation, filthy fuzz, aggressive clipping, or full-frequency annihilation, DistoBlast delivers a vast range of sonic destruction, all in one sleek, intuitive interface.

  Nine unique distortion modes span the range from smooth analog overdrive to brutal FM-style wave shaping: Overdrive, Hot Valve, Clip Inferno, UltraCrunch, Bit Reducer, TurboFuzz, RageClip, Brutal Bill, and QuadraFuzz. The QuadraFuzz engine adds multiband distortion with separate Drive controls for the Low, Mid-Low, Mid-High, and High bands.

  Each distortion type carries its own tone shaping, with a Dry/Wet blend, Punch compression, and post-distortion filtering. A pre-filter section placed ahead of the distortion circuit offers Lowpass, Highpass, Bandpass, and LP2 options so the signal can be sculpted before it is driven.

  A built-in preset manager saves and recalls settings with a preset browser and quick-access functions. The interface can be resized from 75% to 200% and its visual style changed to suit a workflow, every parameter is automatable in host DAWs, and a Ctrl+click or double-click resets any knob to its default.

  Whether the work is techno, trap, industrial, or experimental sound design, or simply needs a powerful distortion toolbox, DistoBlast brings creative chaos and precise control together in a single plugin.
