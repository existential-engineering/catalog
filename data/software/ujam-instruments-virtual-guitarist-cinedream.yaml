description: Virtual Guitarist CINEDREAM makes it dead easy to create ambient guitar textures for any musical situation. A perfect tool for building moody backdrops, evolving pads, and emotional underscore.
details: |-
  UJAM Virtual Guitarist CINEDREAM makes it dead easy to create ambient guitar textures for any musical situation. A perfect tool for building moody backdrops, evolving pads, and emotional underscore. Based on real guitar, shaped by sound design.

  In Player Mode you hold a key or chord and CINEDREAM performs slow, cinematic guitar phrases in real time, perfect for creating ambient textures and evolving soundscapes with minimal input. For hands-on control, Instrument Mode lets you play individual notes or create your own phrasing, ideal for detailed editing, custom melodies, and layered performance parts.

  Shape how each note behaves with the Contour and Dynamics controls. Fade in, stretch, or sharpen the attack for everything from soft swells to rhythmic pulses and sharp accents. Two powerful multi-effect sections transform raw guitar phrases into deep cinematic textures: use Stomp Box for classic tone-shaping or Finisher for ambient clouds, drones, and motion.

  CINEDREAM comes with 30 guitar styles, from random fingerpicking to driving rhythms, built for a range of cinematic applications.
specs: |-
  - 30 styles focused on cinematic guitar
  - Contour knob fades between slow attacks and long sustains
  - 5 amp models from clean shimmer to distorted grit
  - 2 multi-effect engines for pads, pulses, and ambiences
  - Player Mode and Instrument Mode
  - Contour and Dynamics controls
  - Stomp Box and Finisher FX sections
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 4 GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App, or downloadable installer file
  - Authorization: quick authorization via the UJAM App, or email and password within the plug-in
  - Works on macOS and Windows with all major DAWs, including Ableton Live, Logic Pro, Pro Tools, FL Studio, Cubase, Studio One, Bitwig, Reaper and Reason
  - All MIDI phrases and included sounds are royalty-free
