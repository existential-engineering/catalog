description: Aria is garritan's 64-bit sampler/synthesis engine, developed in
  collaboration with Plogue art et technologie inc.
details: |-
  Efficiency and reliability: the core engine is lightweight, stable and
  efficient, with a focus on simplicity and playability.

  Open format: aria's default instrument file format is sfz, a very powerful and
  public file format that is rapidly becoming the new open standard. The sfz
  format is also the format used in cakewalk products. The aria engine will also
  work with soundfont files and more file formats are expected to be supported
  soon.

  Modular architecture: its flexible plug-in based architecture allows
  incredible customization and future-proofing; using a custom sdk, highly
  efficient aria modules can be compiled into native machine code to do tasks
  such as: complex MIDI/input processing voice generation (e.g: sample player,
  sample modeling, additive/subtractive synthesis, physical modeling, etc),
  voice and master effects, and more.

  Custom processing: real-time morphing capabilities, high-order filters,
  convolution (for instrument body resonances and acoustic spaces), MIDI
  processing (for legato, anti-repetition, etc.), and custom dsp.
specs: |-
  - 64-bit sampler/synthesis engine
  - Sfz format support
  - Soundfont file support
  - MIDI processing
  - Keyswitch support
  - Stream from disk
  - Multi-out
  - Real-time morphing capabilities
  - High-order filters
  - Convolution
  - Physical modeling
  - Additive/subtractive synthesis
  - Sample player
  - Sample modeling
  - Voice and master effects
  - Customizable xml-based user interface
  - Mac OS X 10.4 and higher support
  - Windows xp and vista support
  - 32-bit and 64-bit support
  - Personalized graphic card key authorization
  - Multi-computer usage without dongles
