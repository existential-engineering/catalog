details: >-
  Ample ethno ukulele by ample sound is a virtual instrument audio plugin and a
  software application for macos and windows. It functions as a VST plugin, an
  audio units plugin, a VST 3 plugin, an AAX plugin and a standalone
  application.


  Ample ethno ukulele aim to bring a kamaka hf-3 ukulele sound to your studio.
  Sampling: sustain, palm mute, natural harmonic, hammer on & pull off, legato
  slide, slide in, slide out, pop, strum 9 articulations, size: 2.15 gb.


  Polyphonic legato and slide smoother: enables realistic legato across any
  interval and speed. Authentic left-hand performance noises. Adjustable
  acoustic resonance. Multiple stereo and mono microphone mode options. High g
  and low g instrument libraries to fit different needs.


  Riffer 4: a MIDI editor tailored for plucked string instruments: all-new
  strumming and chord system: the innovative "strum note" treats multiple
  sub-notes within a chord as a single editable object, allowing unified control
  over strum time, velocity gradient, and legato parameters. Combined with
  authentic guitar fingering settings, this makes strum creation more intuitive
  and efficient, delivering results that are closer to real performance.


  Tab reader 4: supports guitar pro files from gp3 to guitar pro 8. Capable of
  importing entire bass tracks into riffer with full retention of fingering,
  articulations, and performance data. Amp and fx system: built-in effects:
  8-band eq, compressor, delay, and convolution reverb.
