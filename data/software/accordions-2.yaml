details: >-
  Produced by eduardo tarilonte, accordions 2 is considered the first choice if
  you are looking for a realistic and, above all, playable accordion library.
  Numerous renowned composers and producers rave about the authenticity and
  expressiveness of this virtual instrument.


  With single accordion you get a virtual accordion from eduardo tarilonte's
  accordions 2 as single instrument with 11 registers including left-handed
  basses. If you are looking for a realistic and playable accordion for your
  current project, this single instrument is the perfect solution.


  Key and button noises for ultra-realistic performances. Recorded chromatically
  with the pristine sound of a u47 microphone.


  Exclusively compatible with best service engine 2. This single instrument was
  exclusively designed for best service engine and is therefore not compatible
  with the kontakt player.


  Accordions 2 - accordion by best service is a virtual instrument audio plugin
  and a software application and soundware for macos and windows. It includes,
  and is therefore powered by, engine player, which functions as an audio units
  plugin, a VST 3 plugin, an AAX plugin and a standalone application.
