details: |-
  Ting is an instrument providing 28 different percussive sounds originating from everyday t(h)ings laying around at home - such as silverware, a sofa, toy drum or a pair of car keys. Each sound is carefully multi-sampled and processed with the common goal to be musically playable. Ting is intended to be a creative tool and a substitute for ordinary drum and percussion instruments. Altogether ~1500 individual samples are used to make this instrument.

  In addition to the sounds, there is an EQ, a room simulator, a reverb and a compressor.

  Choose between 28 carefully sampled instruments to populate the 12 sound slots. A built-in EQ shapes the tone of each sound.

  Two parallel spaces are available, a convolution room and an algorithmic reverb, with a single-control compressor for the whole package.
specs: |-
  - 28 different high quality sounds, carefully multi-sampled and processed for maximum playability
  - Built-in EQ
  - Convoluting room ambience
  - Algorithmic reverb
  - Individual sound parameters for pan, pitch, dynamics, room send & reverb send
  - Master compressor
  - 12 sound slots
  - Preset manager including factory presets
  - Requires macOS 10.10 or later (optimized for the M1-processor), Windows 7 (SP1) or later, running a AU, VST or AAX compatible 64-bit host
  - iPad version available as AUv3
