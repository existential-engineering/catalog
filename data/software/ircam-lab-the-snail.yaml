description: "Absolute Tuning & Sound Visualization. The Snail is a very
  high-precision frequency-domain analyzer that delivers an intuitive
  representation of sounds based on the scales and notes aligned in spectrally
  active zones. It features Music Mode for complex polyphonic content viewing,
  Tuner Mode with enhanced analysis resolution, a unique spiral Snail View
  showing fundamentals and harmonics, a Zoomed Tuner hexagonal display, and a
  standard Sonogram View. Supports live instrument input, audio file analysis,
  adjustable tuning reference, transposition, phase relationship display, and
  customizable color schemes."
details: |-
  Music Mode for complex polyphonic content viewing
  Tuner Mode with enhanced analysis resolution
  Snail View: real-time spiral representation showing fundamentals and harmonics
  Zoomed Tuner View: hexagonal display for precise tuning
  Sonogram View: standard spectrum representation over time
  Live instrument input support
  Audio file analysis with waveform player
  Adjustable reference pitch and transposing
  Phase relationship display
  Customizable color schemes
  Click-and-tune functionality
  Grid display options

