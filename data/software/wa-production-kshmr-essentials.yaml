description: Artist designed multi effect plugin with dedicated eight module signal chains for bass, drums, kick, synths and vocals. Each module is driven by a single dial, with auto gain, a soft clipper and waveform or frequency visual feedback.
details: |-
  Essentials is a multi effect plugin designed with the DJ and producer KSHMR. It provides a bespoke signal chain for bass, drums, kick, synths and vocals, each built from eight selected modules, and every module is driven by a single dial with the detailed processing kept behind the scenes.

  The bass chain runs Harmonics, Fuzz, Pressure, Excite, Sub, Side Cut, Width and Compression. Harmonics define the bass so it carries on smaller systems, Fuzz adds a layer of shaped distortion, Pressure handles multiband compression, Excite adds top end fizz and saturation, Sub generates a subtle sub layer once set to the root key, Side Cut tightens the centre channel, and Width and a final Compressor close the chain.

  The drums chain covers Air, Body, Details, Pressure, Transients, Tape, Width and Glue, raising quieter percussion with Details and hardening hits with Transients before a glue compressor. The kick chain runs Sub, Mid, Air, Transients, Tape, Pressure, Compression and Width, with the sub generator keyed to the kick.

  The synths chain uses Body, Presence, Air, Exciter, Details, Pressure, Expand and Glue, where Presence applies an EQ curve aimed at reducing muddiness and Expand pushes the signal around the stereo field. The vocals chain uses Gate, Body, Clarity, Air, Compression, Pressure, Spread and Glue, starting with a noise gate for breaths and room noise.

  Processed audio can be shown as a waveform or a frequency display, with left, right, mid and side monitoring or playback modes. Auto gain can be set between minus 12 and plus 12 dB and holds a constant output level so processed and unprocessed audio can be compared accurately, and a variable soft clipper can be driven while keeping the dynamics of the outgoing signal. Presets curated by KSHMR are supplied for bass, drums, kick, keys, synths and vocals.
specs: |-
  - Multi effect plugin designed with KSHMR
  - Artist designed module routing
  - Dedicated eight module chains for bass, drums, kick, synths and vocals
  - Single dial control per module
  - Auto gain between minus 12 and plus 12 dB
  - Variable soft clipper
  - Waveform and frequency displays
  - Left, right, mid and side monitoring modes
  - Curated presets for bass, drums, kick, keys, synths and vocals
  - Resizable interface from version 1.2.0
  - Full PDF manual and tutorial video
  - Windows 10 or 11 or higher, 64 bit
  - macOS 10.15 or higher, 64 bit
  - AAX requires Pro Tools 12 or higher
