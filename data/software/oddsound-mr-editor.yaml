description: MR Editor unlocks the power of the Ensoniq MR synth engine,
  enabling sound creation and editing for Ensoniq MR series synthesizers (MR
  Rack, MR61, MR76, ZR76) on modern computers via plugin or standalone.
details: |-
  MR Editor is a plugin and standalone application that enables editing and sound creation for the Ensoniq MR series synthesizers from the mid-1990s, including the MR Rack, MR61, MR76, and ZR76. It connects to the hardware via MIDI and provides a modern, resizable interface with Retina/HiDPI support.

  The editor supports up to 16 individual layers of sound creation using the MR synth engine. It includes a full performance editor for the MR Rack, a dedicated drum kit sound editor, and a bank manager for transferring and organizing sounds between the hardware and computer.

  A parameter linking system allows changes to be applied across multiple parts simultaneously. Full parameter undo/redo and MIDI CC learning are supported, making it practical for live and studio use.

  MR Editor is compatible with the OddSound MTS-ESP Suite for microtuning capabilities, and includes a 30-day fully functional free demo. Both Windows 32-bit and 64-bit hosts are supported; macOS requires 64-bit (Intel or ARM).
specs: |-
  - Supports Ensoniq MR Rack, MR61, MR76, ZR76
  - Up to 16 individual sound layers
  - Full performance editor for MR Rack
  - Drum kit sound editor
  - Bank manager for transferring and organizing sounds
  - Parameter linking across multiple parts
  - Full parameter undo/redo
  - MIDI CC learning
  - Freely resizable interface with Retina/HiDPI support
  - Compatible with MTS-ESP Suite for microtuning
  - 30-day fully functional free demo
  - Windows: Vista, 7, 8, 10, 11 (32-bit and 64-bit hosts)
  - macOS: 10.9+ (64-bit only, Intel or ARM)
