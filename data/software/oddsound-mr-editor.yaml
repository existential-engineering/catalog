      input port is already in use on Windows. Fix param values not getting
      reported to host after loading session with VST3 versions in Reaper. Fix
      potential crash on closing window immediately after using mouse wheel. Fix
      crash on closing plug-in window in Logic running on an Intel Mac. Fix UI
      crash when running in Kushview Element on Mac. Fix crash on Windows if
      querying non-existent value from registry. Fix incorrect sound showing
