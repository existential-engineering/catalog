details: |-
  The organic-sounding Virtual String Machine (VSM) is an intuitive yet highly powerful string machine synthesiser that's the perfect solution for creating the sound bed of your next track. It contains a wealth of sounds from 46 classic and rare machines. Those sounds can be combined using two layers, allowing for a unique fusion of instruments made exclusively possible by VSM. VSM comes with 1900+ presets, including 200+ new patches and over 11.5 GB of data, enabling you to craft your own unique synthetic strings.

  VSM IV has a fully scalable UI. The new powerful Patch and Instrument Browsers empower effortless navigation through the extensive library of more than 1900 patches, ensuring quick access to the perfect sound. Take advantage of new functions like Undo, Redo, Copy, and Paste, ensuring seamless editing and flexible experimentation.

  Experience authentic ageing with the new Wow and Flutter features, augmenting the organic imperfections that give these vintage instruments their unique charm. Introducing an alternative state-variable filter and ensemble effect, new LFO shaping possibilities, a chorus, and a matrix reverb adds further depth and character to your sound. The expanded Poly Aftertouch and Velocity controls offer enhanced playability and expressiveness.

  VSM IV contains a wealth of sounds from 46 classic and rare machines. These range from the first commercial string ensembles (Eminent 310 & Freeman String Symphonizer) to the highly lauded Solina, Elka Rhapsody, Logan String Melody, Korg PE2000 and many more. With the sheer amount of instruments captured within the VSM, it's simplicity itself to recreate those golden string machine tones from yesteryear. However, with the VSM's comprehensive yet intuitive feature set, plus a two-layer option, it's now possible to craft your own hybrid patches.

  GForce invited Robin Rimbaud (Scanner), Polydata, Lightbath and Noyzelab to craft unique presets alongside Dave Spiers, Chris Macleod, Graeme Rawson, Boudicca's Bass Service and Tom Wolfe.
