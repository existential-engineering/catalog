description: Virtual String Machine IV featuring sounds from 46 classic and rare string machines. Includes 1900+ presets with over 11.5GB of data, enabling hybrid patches by combining two layers of vintage string machine sounds. Features dual-layer and split keyboard operation with 49-note individually sampled range.
details: |-
  VSM IV is a comprehensive virtual string machine that recreates the sounds of 46 iconic and rare string machines, from the Solina and Elka Rhapsody to the Eminent 310, Mellotron, Moog Polymoog, Yamaha CS-80, Roland Juno 106, and many more.

  With over 1,900 presets including more than 200 new patches, VSM IV delivers 11.5GB+ of sample data captured across a 49-note range, individually sampled and looped for authentic playability. A dual-layer architecture lets you stack or split instruments to create hybrid patches of remarkable depth.

  The fully scalable UI includes dedicated Patch and Instrument Browsers, Expanded Poly Aftertouch and Velocity controls, and MIDI CC Learn capability. An additional state-variable filter and 3-band EQ give you precise tonal shaping, while Wow and Flutter aging controls add organic character. On-board effects include Chorus, Matrix Reverb, and a rich Ensemble.
specs: |-
  - Plugin formats: Standalone, AU, VST2, VST3, AAX
  - Mac: Intel & Apple Silicon native, macOS 10.13+
  - Windows: 2 GHz CPU, 2 GB RAM, Windows 7+
  - 46 classic & rare string machines modeled
  - 1,900+ presets (200+ new patches)
  - 11.5 GB+ sample library
  - 49-note range, individually sampled & looped
  - Dual-layer architecture for hybrid patches
  - State-variable filter & 3-band EQ
  - Wow & Flutter aging controls
  - Effects: Chorus, Matrix Reverb, Ensemble
  - LFO with multiple destinations
  - Expanded Poly Aftertouch & Velocity
  - MIDI CC Learn
  - Fully scalable UI
