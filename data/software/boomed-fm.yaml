id: _OTl9zr8A3RMXDo4B93ph
name: Boomed-FM
manufacturer: speargear
primaryCategory: synthesizer
url: https://speargear.co.nr/
description: "Boomed-FM is a free FM synth. Features: 3 wave oscillators as LFOs
  and three phase distortion main oscillators."
details: |-
  Features: 3 wave oscillators as lfos and three phase distortion main
  oscillators. For each lfo oscillator, you can control envelope, cut, gain, and
  bandwidth. There are also shape, pitch, and phase mod selections. Master
  envelope, portamento, mono with retrigger, and pitch slider. Feedback, delay,
  modulation, and gain level. Frequency filters with resonance. Master sv
  filter.
specs: |-
  - 3 wave oscillators as LFOs
  - 3 phase distortion main oscillators
  - Envelope control per LFO oscillator
  - Cut control per LFO oscillator
  - Gain control per LFO oscillator
  - Bandwidth control per LFO oscillator
  - Shape selection
  - Pitch selection
  - Phase mod selection
  - Master envelope
  - Portamento
  - Mono with retrigger
  - Pitch slider
  - Feedback
  - Delay
  - Modulation
  - Gain level
  - Frequency filters with resonance
  - Master sv filter
  - Windows
