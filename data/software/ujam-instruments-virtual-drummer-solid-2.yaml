description: Virtual Drummer SOLID is your personal gold-standard session drummer, comfortably playing all popular styles and moods with ease.
details: |-
  Virtual Drummer SOLID is a seasoned pro for sophisticated, grand productions. For all popular genres and moods, SOLID provides gold-standard drumming styles and sounds, dependable and comfortable playing all popular styles with ease.

  The key to SOLID's benchmark drum sound is in the way it was recorded. All 720 patterns started with a drummer in a prime acoustical space in front of a collection of 'desert island' drum hardware, with each hit and phrase captured through a combination of premium microphones and recording chains.

  The versatile sound and accessible controls mean SOLID suits any level of production skill. Novices get instant access to many popular musical styles and rhythmical phrases without a steep learning curve, while experienced producers can get results quickly.

  The sound of each of the five drum kits is customized by dialing in extra punch with the slam control or by using one of six tone-morphing character presets, moving from smooth and retro to smashed to pieces. The drum mix is finalized by individually adjusting the volume of each kit component, including separate controls for overhead and room mics, before adding reverb, and the feel of the performance can be pushed or pulled with a humanize control.
specs: |-
  - 30 styles with 720 rhythmical patterns in total
  - 5 drum kits and 6 tone-morphing character/mix presets
  - SOLID 2 adds 30 new styles with 650 new grooves plus 100 presets
  - Drag-and-drop phrases to the DAW for detailed note editing
  - Multi-outs for individual mixing in the DAW
  - Advanced kit editing, mixing and master sections
  - Slam control, individual kit-component volumes, overhead and room mic controls, reverb
  - Feel and humanize controls for pushing or pulling the beat
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Windows: Windows 10 to Windows 11
  - Mac: macOS Catalina (10.15) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 4 GB of RAM
  - 0.5 GB of disk space
  - 1280x768px display, internet connection
  - Delivery: automated installation via UJAM App, or downloadable installer file
  - Authorization via the UJAM App, or email and password within the plug-in
  - Supported standards: MIDI
