description: Rockdude X1000, modeled after the legendary Rockman X100, delivers iconic 80s guitar tones enhanced with advanced features like stomp effects, flexible cabinet emulation, and studio-quality post-processing.
details: |-
  Rockdude X1000 is modeled after the legendary Rockman X100, classic guitar tone in a box upgraded with powerful modern plugin features. It delivers the iconic 80s guitar tones that defined the signature sound of countless classic rock recordings, prominently featured on albums by bands like Boston, Def Leppard and ZZ Top, and widely used in 1980s studio sessions.

  The pre-stomp section carries a Noise Gate that removes background noise and hum, a Filter for precise tonal adjustment, a Wah with tempo-sync and manual controls for expressive frequency sweeps, and a Booster that adds adjustable gain, harmonic richness and sustain. An amplifier-style tone stack with interactive frequency bands sits after them, and the signal chain itself is customizable.

  A built-in cabinet authentically emulates the original Rockman X100 analog guitar cabinet circuit famously used for direct-to-console recordings. Alongside it are six carefully selected cabinet emulations of classic guitar speaker cabinets, four premium microphone emulations with selectable positions, and a mixer with volume and pan controls to blend cabinet and microphone sounds.

  An impulse response loader takes up to three IRs at once for complex cabinet combinations, and draws a visual graph of each loaded IR's waveform. Rich chorus modulation and rhythmic delay effects with precise controls are included as well.

  Post-amplifier effects add a Hall Reverb with adjustable size, tone and wet/dry mix, and a Graphic Parametric EQ offering multiple bands, filter-type selection and precise frequency adjustment. A standalone version is included so the plugin can be used without a DAW, and an iOS version is available for iPhone and iPad.
specs: |-
  - Modeled after the Rockman X100
  - Pre-stomp effects: Noise Gate, Filter, Wah (tempo-sync and manual), Booster
  - Amplifier-style tone stack with interactive frequency bands
  - Built-in cabinet emulating the original Rockman X100 analog cabinet circuit for direct-to-console recording
  - 6 cabinet emulations of classic guitar speaker cabinets
  - 4 premium microphone emulations with selectable positions
  - Mixer with volume and pan to blend cabinet and microphone sounds
  - Impulse response loader with up to 3 simultaneous IRs and a visual IR waveform graph
  - Chorus modulation and rhythmic delay effects with precise controls
  - Post-amplifier effects: Hall Reverb with size, tone and wet/dry mix, plus a Graphic Parametric EQ with multiple bands and filter-type selection
  - Flexible, customizable signal chain routing
  - Standalone version included, no DAW required
  - iOS version available for iPhone and iPad
  - Plugin formats: VST2, VST3, AAX or AudioUnits compatible host
  - Intel compatible or Apple Silicon CPU
  - 1GB RAM
  - Mac OS 10.13 or newer
  - Windows 7 or newer
  - 64-bit DAW required
