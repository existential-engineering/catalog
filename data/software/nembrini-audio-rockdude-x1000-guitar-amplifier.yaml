description: A faithful recreation of the iconic Rockman X100, delivering classic 1980s guitar tones with contemporary enhancements including impulse response loading, flexible signal routing, and comprehensive effects chain.
details:
  - The Rockdude X1000 is a meticulous software recreation of the legendary Rockman X100, the iconic rack-mounted guitar processor that defined the polished, compressed 1980s guitar tone heard on countless classic rock recordings. The plugin faithfully models the original unit's characteristic sound while adding modern workflow enhancements.
  - The signal chain begins with pre-stomp effects including a Noise Gate, Filters, Wah, and Booster, followed by the amplifier-style tone stack equalizer that captures the Rockman's distinctive EQ character. The cabinet simulation section offers microphone emulation options for shaping the final tone.
  - The Rockdude X1000 includes a full Impulse Response loader capable of running up to three simultaneous IRs, allowing players to blend custom cabinet responses or use the included free impulse responses from Chop Tones for maximum flexibility and tone sculpting.
  - Post-amplifier processing includes Chorus and Delay effects along with a Hall Reverb and Graphic/Parametric EQ section. The flexible signal routing allows users to arrange the processing chain to taste, making the plugin suitable for both direct recording and live performance contexts.
  - Available as VST2, VST3, AAX, and Audio Units formats on Mac and Windows, the plugin also includes a full Standalone version for use without a DAW. An iOS version is available separately via the Apple App Store, making the Rockdude X1000 tone accessible across studio and mobile environments.
