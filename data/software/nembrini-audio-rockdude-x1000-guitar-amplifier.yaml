details: |-
  Rockdude X1000 , modeled after the legendary Rockman X100* , delivering iconic 80s guitar tones enhanced with advanced features like stomp effects, flexible cabinet emulation, and studio-quality post-processing. Defined the signature sound of countless classic rock recordings, prominently featured on iconic albums by bands like Boston, Def Leppard, and ZZ Top, and widely used in legendary 1980s studio sessions. WATCH VIDEO Stomp Effects Noise Gate: Effectively removes unwanted background noise and hum for a cleaner signal. Filter: Offers precise tonal adjustments, enhancing clarity and removing harsh frequencies. Wah: Provides expressive, dynamic frequency sweeps, with tempo-sync and manual controls. Booster: Delivers adjustable gain boost, adding harmonic richness and increased sustain. BUILT-IN CABINET Authentically emulates the original Rockman X100* analog guitar cabinet circuit famously used for direct-to-console recordings.
