details: |-
  The fabled VEQ-432C is considered the absolute standard in mastering equalizers. Upon first impact, the EQ sounds subtle. Everything seems to sound great, even seemingly poor equalizing choices! That's no magic, just what a top-end mastering EQ does best – getting those extra drops of sweetness out of an already excellent-sounding mix that needs little in the way of added polish.

  That said, the 432 will serve just as well in a mix bus or onto individual tracks in need of frequency bumps or cuts here and there. Runs natively in your DAW on macOS or Windows, or in real-time on your Synergy Core interface.
