description: "Professional version of the virtual Eurorack studio with DAW
  plugin support. Runs as a VST2, VST3, Audio Unit, or CLAP plugin inside any
  major DAW, with up to 16 audio I/O channels, MIDI I/O, parameter automation,
  and offline rendering."
details: |-
  Includes everything in Rack 2 Free plus DAW integration. Save patches inside DAW projects, use multiple Rack instances, render offline. Supported DAWs: Ableton Live, Cubase, FL Studio, Reason, Bitwig, Reaper, Mixbus, Studio One, Cakewalk, Logic Pro, and GarageBand. Also includes access to Pro-exclusive modules (Chorus, Flanger, Phaser, Reverb, Convolver, Compressor) and professional support.
specs: |-
  System requirements: Windows 7+, macOS 10.9+, or Linux (Ubuntu 16.04+). CPU: Intel/AMD 64-bit (SSE4.2, 2011+) or Apple M1+. Dedicated Nvidia/AMD GPU from 2013+. 1 GB RAM, 1 GB disk space. Plugin: up to 16 audio inputs/outputs, 16 MIDI inputs/outputs.
