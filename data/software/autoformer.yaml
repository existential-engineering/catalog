details: |-
  Autoformer combines an analogue like pre-amp with automatic volume function
  and a gentle compressor. It is the right tool for your vocals or voice-overs.
  Improves drummers or bass-players performances.

  Autoformer is an ideal companion for mixing both bass guitar and double bass
  performances. It is indispensable when creating vocal or voice-over tracks.
  But it can be also used to balance drum records.

  Br/us/ge buttons in the preamp section represent three types of analogue
  circuits. Br represents classic fat british consoles, us stands for legendary
  punchy american style input. Switching to ge will give you velvet sounding
  colourful vintage german tube console.

  Ballancer section is here to repair performance mistakes and volume dropouts.
  The seer parameter detects the ahead signal to decide if your material needs
  volume adjustment (made by leveller). Engage the fast modern compressor to
  soothe the dynamics of your track without changing your signal's spectral
  character.

  The plugin provides the maximum audio quality you can get. It uses internal
  64-bit audio processing and can handle any sampling rate. 192 khz or even
  higher. The intelligent way our plugins manage bypassing ensures that you
  don't get any click or harmful noises when automating the parameter.
specs: |-
  - 64-bit audio processing
  - 192 kHz sampling rate support
  - Analogue pre-amp
  - Automatic volume function
  - Gentle compressor
  - Br/us/ge preamp circuits
  - Seer parameter
  - Leveller
  - Five LED meters
  - Individual bypass switches
  - Smart bypass
  - Photorealistic gui
  - Resizable interface
  - License file activation
  - macOS support
  - Windows support
  - Universal 2 binary
