description: HoRNet H76 is a faithful emulation of classic vintage compressor limiter plugin but with many modern features
details: |-
  When it comes to shaping the perfect mix, the HoRNet H76 compressor limiter plugin stands out as a powerful and versatile tool that brings classic vintage sound combined with modern precision to your audio production process. Designed to meet the needs of both seasoned producers and up-and-coming engineers, the H76 provides a unique opportunity to add warmth, character, and exceptional control to your mixes. Whether you're working on music, film scores, or broadcast audio, the HoRNet H76 offers a level of flexibility that can be used in a wide range of genres and settings, enabling you to refine and elevate your sound.

  At the heart of the HoRNet H76 is its careful emulation of a renowned vintage FET compressor, a piece of equipment cherished by engineers for its smooth, musical compression. This plugin brings that iconic sound to your digital audio workstation (DAW) with incredible accuracy. The rich, analog warmth and saturation that made the original unit so popular have been painstakingly recreated, preserving every characteristic of the original hardware, from the input and output transformers to the internal Class A amplifiers.

  What sets the HoRNet H76 apart from other compressor plugins is its comprehensive analog emulation. Unlike other plugins that only emulate certain aspects of analog gear, the H76 captures the full range of tonalities and nuances of the vintage FET compressor. The meticulous modeling of the input and output stages, including the saturation and subtle harmonic distortion, gives your tracks a true analog feel.

  The HoRNet H76 offers a wide range of customizable compression settings that allow you to shape the dynamics of your tracks to perfection. With five distinct ratio settings to choose from, including the famous “All Button Mode” that delivers an aggressive compression effect, you can adapt the H76 to fit any style or genre. In addition to the ratio settings, the H76 features a built-in VU meter that allows you to monitor your input, output, and gain reduction levels with great precision.

  One of the standout features of the HoRNet H76 is its ability to bypass the compressor while maintaining the analog amplifier emulation, so it can be used solely as an analog saturation tool. The plugin also features automatic gain compensation, both automatic and manual control over attack and release times, a mix control for parallel compression, and variable oversampling from 2x to 8x to eliminate unwanted aliasing at higher compression settings.
specs: |-
  - Classic vintage FET compression
  - Full analog emulation of input and output transformers and internal Class A amplifiers
  - Five ratio settings: 4, 8, 12, 20, and the classic “All Button Mode”
  - VU meter that can show input, output, and gain reduction
  - Ability to disable the compressor while keeping the analog emulation of the internal amplifiers active
  - Automatic volume compensation for gain reduction
  - Adjustable pre and post analog emulation input and output levels
  - Automatic input level setting
  - Ability to link input and output to maintain constant signal level
  - Automatic input level setting to achieve the desired gain reduction
  - Automatic attack and release times, with the option for manual adjustment
  - Ability to blend the compressed signal with the original for parallel compression
  - Oversampling from 2x to 8x with automatic setting
  - Bypass button to completely disable the plugin
  - Ability to disable analog emulation and noise separately
  - Load and save buttons for managing presets
  - 13 factory presets covering the most common compressor uses
  - Compatible with macOS 10.13 and later, and Windows 10 and later
  - Available in VST3, AAX, and Audio Unit formats
  - Also available as AUv3 on iPad and iPhone
  - Freely resizable interface
  - Available in both light and dark themes
  - Apple Silicon native support
  - No copy protection
