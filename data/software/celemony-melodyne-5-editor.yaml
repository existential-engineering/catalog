description: >-
  Professional edition of Melodyne featuring DNA Direct Note Access for editing
  individual notes within polyphonic audio recordings.
details: |-
  Melodyne 5 Editor unlocks DNA Direct Note Access, Celemony's
  patented technology for accessing and editing individual notes
  within polyphonic recordings such as guitar chords and piano parts.

  Extended tempo functions enable detailed tempo mapping and
  adaptation. Custom tuning support and extended scale functions
  allow working with non-standard tuning systems.

  Chord editing and harmonic restructuring tools let you reshape
  the harmonic content of polyphonic material. Samples can be
  adapted to match project harmonies automatically. Available as a
  plug-in via ARA, VST3, AU, and AAX, or as a standalone
  application.
specs: |-
  - DNA Direct Note Access for polyphonic editing
  - Edit individual notes within chords
  - Extended tempo mapping functions
  - Custom tuning and scale support
  - Chord editing and harmonic restructuring
  - Sample adaptation to project harmonies
  - All Assistant edition features included
  - ARA integration for supported DAWs
  - 64-bit only
  - Intel/AMD Dual Core minimum, Quad Core recommended
  - 4 GB RAM minimum, 8 GB recommended
  - macOS 10.12 or higher with Apple Silicon support
  - Windows 10 or higher
