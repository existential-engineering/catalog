details: |-
  Aurora sound studio is a pattern based musical sequencing software for the
  ipad. By simply choosing a musical scale every note you play is in perfect
  tune, leaving you to make your own great sounding music.

  If you are a more accomplished musician you simply switch aurora to advanced
  mode and you get full control over the built in instruments and effects, as
  well as many advanced modes such as the atomizer and xy mode which allows you
  to manipulate sound in real-time.

  You can create your own instrument from recordings made using the built in
  microphone. Aurora allows a mixture of pattern based recording and live
  performance. You can piece together complete compositions or simply improvise
  a performance. All of which can be captured to a file, for use as a ringtones,
  or to share with others.

  The expression bar in play mode allows you to apply pitch bend, vibrato,
  volume and filter glides and modulation in real time whilst soloing over a
  sequence. You can even pitch shift drum notes, or even a whole drum layer. An
  integrated mixer, combined with the ability to add audio effects and layer
  automation means that you achieve a sophisticated sound in a fun and user
  friendly way.

  MIDI out support allows you to use an external keyboard as a sound source
  replacing the internal synthesiser engines. This new feature can be used by
  the sequencer and for live play. Pasteboard support means you copying of all
  or part of a songs audio to other applications.
specs: |-
  - Pattern-based sequencing

  - Up to 32 patterns with seamless transitions

  - Up to 14 layers (instruments) per pattern

  - Song creation of up to 199 patterns

  - Basic and advanced modes

  - Musical scales selection

  - Interchangeable instruments (drum kits, synthesizers and samplers)

  - Layer automation

  - Xy mode

  - Atomizer mode

  - Full instrument editing and user patch creation

  - Real time key and tempo changes

  - Sample recording via internal microphone

  - Sample import functionality

  - Full sample loop editing

  - Effects (echo, reverb, phaser, filters)

  - Transpose song and pattern function

  - Cut, copy and paste of patterns and layers

  - Record to file functionality

  - Integrated 14 channel mixer

  - Variable note lengths (from whole to 1/64th notes)

  - Visual layer effects

  - Sample accurate timing

  - Configurable audio settings

  - Upload and share songs

  - Full screen 14 channel mixer

  - Effects rack view

  - Solo and mute individual layers

  - Layer mix palette

  - Accelerometer control for xy mode

  - 4 independent engines (drum machine, analog synth, pad synth, sampler)

  - 9 effects (delay, reverb, chorus)

  - MIDI export facility

  - Hq mode

  - Octave control

  - Pasteboard support

  - MIDI song position pointer

  - Hold note feature

  - Export to wav and aac

  - Audiobus compatible

  - MIDI out support

  - Expression bar in play mode (pitch bend, vibrato, volume and filter glides,
  modulation)

  - Pitch shift drum notes and layers
