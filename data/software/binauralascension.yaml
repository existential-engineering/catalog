details: |-
  BinauralAscension by SaschArt is a revolutionary program that combines the
  power of shepard tones with the power and effects of binaural beats. These
  tones have a unique property: they increase in frequency continuously without
  ever decreasing, creating a special effect on the psyche that influences
  energies and brain waves.

  The function that generates continuously descending frequencies is also
  important. These types of tones are very useful for hypnosis, psychological
  regressions, deep relaxation and facilitating effortless entry into sleep. The
  influence of these frequencies extends to the physical being, causing organs
  to vibrate in harmony and quickly restoring the state of health as well as
  self-healing processes.

  A very interesting function is the combination with waves based on the golden
  number, thus providing three important effects combined simultaneously. The
  most suitable sounds for spiritual evolution are continuously ascending ones,
  and binauralascension stimulates the state of spiritual enlightenment and aids
  in its stabilization.

  Binauralascension is your gateway to transformation, offering a harmonious
  blend of shepard tones, golden waveforms and binaural magic. It functions as
  both a virtual instrument and a virtual effect audio plugin for macos and
  windows, available as vst2, vst3, and audio units plugin formats.

  The archive contains both the effect and instrument version, with two versions
  for 32-bit and 64-bit architecture. Requirements include a DAW with vst2 or
  vst3 host support, windows 32/64-bits or macos compatibility.
specs: |-
  - Shepard tones

  - Binaural beats

  - Golden waveforms

  - Up to 16 tones simultaneously

  - Seven waveforms (sine, triangle, saw, golden sinusoid, golden half sinusoid,
  golden triangle, golden square)

  - Adjustable frequency range

  - Frequency spread with volume control (low, medium, high)

  - Cycle duration/rate control

  - Pan switch (binaural, center frequencies, binaural off)

  - Over 130 presets

  - Healing and solfeggio frequencies presets

  - Smooth fading

  - Brainwave range display (epsilon, delta, theta, alpha, beta, gamma, lambda)

  - Ascending or descending frequency directions

  - Customizable frequency and volume graphs (five presets each)



  - Audio units (AU) plugin

  - Windows 32-bit support

  - Windows 64-bit support

  - Macos support

  - Virtual instrument

  - Virtual effect

  - 60-second free demo
