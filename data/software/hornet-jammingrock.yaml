description: Hornet Jamming Rock is a plugin designed for emulating the typical reggae-guitarist set-up and reggae guitar tone
details: |-
  HoRNet Jamming Rock, also known as JR 77, is a meticulously crafted guitar amp and effects plugin specifically designed to emulate the classic reggae guitarist setup. Inspired by a legendary Japanese jazz amplifier renowned for its clean solid-state tone, this plugin brings the soulful strumming sounds of roots reggae directly to your DAW. Whether you’re channeling the energy of Bob Marley & The Wailers or adding a touch of dub mysticism to your productions, Jamming Rock delivers an authentic sonic experience that captures the essence of reggae guitar.

  The heart of Jamming Rock is based on a famous solid-state jazz amplifier —a model celebrated for its ultra-clean tone, durability, and affordability. This amp became iconic in reggae circles thanks to artists like Al Anderson and Julian “Junior” Marvin, who used it during their time with Bob Marley, along with legends such as Peter Tosh, Ernest Ranglin, Earl “Chinna” Smith, and Cat Core.

  Unmatched reliability – Being a solid-state amplifier, it eliminates the hassle of tube replacement and is far less prone to malfunction. Jamaican sound engineers favored it because it could withstand long tours and extreme weather without demanding constant maintenance.

  Affordable professional tone – Despite its reasonable price, the amp offers a professional-level clean tone, perfectly suited for the rhythmic chops and muted skanks that define reggae guitar. HoRNet’s plugin version faithfully recreates this behavior, capturing the clean tone and natural warmth of the original amp.
specs: |-
  - Emulation of a famous guitar pedal overdrive
  - Emulation of a clean vintage transistor amp, including spring reverb and distortion
  - Tube mixer preamplifier stage
  - Digital delay module
  - Digital reverb module
  - Intelligent oversampling that allows the plugin to always work internally at 192Khz
  - Vector user interface which is sharp on every resolution
  - Freely resizable user interface
  - Apple Silicon native support (except for AAX)
  - macOS (10.11 and later) and Windows (Vista and later) support.
  - 64-bit on Mac and Windows.
  - Audio Units, VST, VST3 and AAX format.
  - Presets by Alborosie’s live guitar player Valter Vincenti
