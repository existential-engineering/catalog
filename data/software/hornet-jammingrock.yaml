description: Hornet Jamming Rock is a plugin designed for emulating the typical reggae-guitarist set-up and reggae guitar tone
details: |-
  HoRNet Jamming Rock, also known as JR 77, is a guitar amp and effects plugin specifically designed to emulate the classic reggae guitarist setup. Inspired by a legendary Japanese jazz amplifier renowned for its clean solid-state tone, this plugin brings the strumming sounds of roots reggae directly to your DAW.

  The heart of Jamming Rock is based on a famous solid-state jazz amplifier, a model celebrated for its ultra-clean tone, durability and affordability. The amp became iconic in reggae circles thanks to artists like Al Anderson and Julian "Junior" Marvin, who used it during their time with Bob Marley, along with Peter Tosh, Ernest Ranglin, Earl "Chinna" Smith and Cat Core. Being a solid-state amplifier it eliminates the hassle of tube replacement and is far less prone to malfunction, and it offers a professional-level clean tone suited to the rhythmic chops and muted skanks that define reggae guitar.

  To make the recreation as authentic as possible, HoRNet teamed up with reggae guitarist and producer Valter Vincenti, a long-time collaborator of Alborosie. Valter's insights shaped the sound and features of Jamming Rock, helping fine-tune both the core amplifier emulation and the surrounding effects chain that completes the classic reggae guitar rig.

  The amp section offers a clean solid-state tone with the warm, rounded response ideal for reggae chops, a built-in spring reverb modeled after the original amp's onboard reverb tank, and an input stage optimized for guitar or DI signals. A model of the classic green overdrive pedal, also of Japanese origin, sits before the amp section just as in a real-world rig, working both as a distortion source and as a boost.

  Two further effects complete the signal chain: a digital delay that can be synced to the DAW tempo or set manually for anything from subtle repeats to long dub echoes, and a digital reverb using the reverb circuitry borrowed from the HoRNet Spaces plugin. The plugin supports VST2, VST3, AU and AAX formats, runs on macOS and Windows, and has a clean, freely resizable interface.
specs: |-
  - Emulation of a famous guitar pedal overdrive
  - Emulation of a clean vintage transistor amp, including spring reverb and distortion
  - Tube mixer preamplifier stage
  - Digital delay module
  - Digital reverb module
  - Intelligent oversampling that allows the plugin to always work internally at 192Khz
  - Vector user interface which is sharp on every resolution
  - Freely resizable user interface
  - Apple Silicon native support (except for AAX)
  - macOS (10.11 and later) and Windows (Vista and later) support
  - 64-bit on Mac and Windows
  - Audio Units, VST, VST3 and AAX format
  - Presets by Alborosie's live guitar player Valter Vincenti
  - No copy protection
