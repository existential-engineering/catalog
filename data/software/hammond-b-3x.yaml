details: |-
  Hammond B-3X is the next-level organ virtual instrument that delivers an unprecedented new degree of realism and detail to give musicians full immersion into the electro-mechanical Hammond organ experience with all its soul, passion and vibe. Created in close collaboration with both the Hammond Organ Company, of Chicago, Illinois, and Suzuki Musical Instruments Mfg. of Hamamatsu, Japan, the Hammond B-3X instrument captures the authentic sound and vibe of the legendary Hammond B-3, with a comprehensive, wholistic approach.

  In true IK style, Hammond B-3X approaches the instrument the way the original hardware organ works. B-3X starts with 91 free-running tonewheels, based on several meticulously-maintained Hammond organs, and mixes those in real-time based on the note and the drawbar levels for absolute realism. IK's industry-leading modeling then faithfully recreates tonal filtering, independent key click, and the iconic Hammond percussion and chorus-vibrato circuits to recreate the massive, organic feel of the real instrument.

  IK has combined this groundbreaking sound with a full rig FX chain including stomp effects, a full Leslie rotary cabinet with multiple microphones, a variety of mix-and-match power amp and cabinet models, a parallel guitar amp with 4x12 cabinet, a full mixer and even post-mixer effects, to completely recreate the entire signal path from tonewheel to speaker.

  The controls of Hammond B-3X are designed to recreate the exact experience of playing a classic hardware B-3 organ, but with a bit of modern convenience. Every element, from the order of chorus/vibrato settings to the placement of the percussion switches, is exactly how it should be. The drawbars even update in real-time when you select the inverted drawbar settings keys, allowing you the ability to also save 24 custom drawbar settings per preset.

  For live use, a Controls view hides the keyboard and enlarges the drawbars and switches for less distraction while playing. Hammond B-3X also supports Hammond profiles for Hammond-Suzuki keyboards, assignable MIDI continuous controllers, and MIDI program change preset assignments for seamless integration into any performance or studio workflow.
specs: |-
  - 91 free-running tonewheel engine with real-time mixing
  - Multiple tonewheel sets from meticulously maintained organs
  - Independent key click, percussion, and chorus-vibrato circuits
  - 24 custom drawbar settings per preset
  - Full rig FX chain: stomp effects, Leslie cabinet, power amps
  - Multiple Leslie rotary cabinet models with multi-mic positions
  - Parallel guitar amp with 4x12 cabinet
  - Post-mixer effects and full mixer section
  - Hammond profile support for Hammond-Suzuki keyboards
  - Assignable MIDI CC and program change
  - macOS 10.13+ / Windows 7+
  - AU, VST2, VST3, AAX, Standalone
