description: "ControlHub is an all-inclusive mixing plugin platform that allows
  you to load entire signal chain-based expansion packs from your favorite
  mixers and recording studios. This is not another channel strip plugin, but a
  complete emulation of the original hardware or software signal chain. You now
  have the power to mix your individual tracks, mix bus and master chains using
  complete signal chain emulations from world-class mixers. Accelerate your
  workflow, without compromising your creativity."
