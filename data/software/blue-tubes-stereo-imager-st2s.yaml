details: |-
  The bt stereo imager st2s provides precise control over the width of the
  stereo field. This graphically striking device enables you to visualize the
  width of the stereo sound stage.

  Some stereo tracks may require special treatment in terms of stereo width. The
  stereo imager gives you a simple way to manipulate the spread of the stereo
  tracks while receiving visual feedback on your changes.

  Blue tubes stereo imager st2s by nomad factory is a virtual effect audio
  plugin for macos and windows.

  System requirements: pentium iv 2ghz / athlon xp 2ghz with 1gb of ram for
  windows; windows 7, xp, vista supported (32-bit and 64-bit). Macintosh intel
  core solo 1.5ghz with 1gb of ram; mac os x 10.5 leopard and mac os x 10.6 snow
  leopard supported. Compatible intel macs; ppc not supported.
