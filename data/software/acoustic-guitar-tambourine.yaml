details: >-
  The control centre has released the acoustic guitar & tambourine pack which
  features a multi-sampled lag tramontane nylon strung classical guitar and a
  hayman hta-40 tambourine.


  The pack includes a live instrument rack containing 58 guitar samples
  (including harmonics) and a drum rack featuring 32 velocity layered tambourine
  samples (8 pads with 4 layers per pad).


  Both instruments were recorded with a rode nt-1 microphone and native
  instruments 24-bit audio interface.


  All samples in the 64mb pack are 24-bit mono wav files with no effects
  applied.


  The pack requires live 10.1 (or higher).
