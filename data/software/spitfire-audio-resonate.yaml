details: |-
  For years, half the magic of sound has been disregarded. Films and trailers have delivered gigantic hits in epic technicolour, but neglected the essence of percussion's power: resonance. A real orchestral strike lives on long after the initial impact dies away—in reverberations that rumble, pierce, rattle, and sing. Those aftershocks have the power to thrill and terrify, lure and intrigue. And now they're at your fingertips.

  Built in collaboration with the visionary Dame Evelyn Glennie—one of history's most influential percussionists—Resonate unlocks the other-worldly mystery, magic, and tension of orchestral percussion. Tuned and untuned instruments collide across fourteen signals, then spin out toward new frontiers of texture, tone, and dimension. There, hits, strikes, and spine-tingling scrapes give way to essential cinematic reverberations, captured at Hollywood's most celebrated recording hall—AIR Studios.
specs: |-
