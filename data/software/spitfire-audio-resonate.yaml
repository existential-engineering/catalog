  - 32,229 audio files
  - 100 presets
  - 49 techniques and pairings
  - 14 signal paths and 6 after-effects
  - 7 mic perspectives plus 2 mixes
  - Resonator instruments: Barrel, Timpani, Thundersheet, Water Tank
  - Recorded at AIR Lyndhurst Hall
  - macOS 11 to OS 26, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
  - Minimum 2.8 GHz quad-core i5 and 8 GB RAM
