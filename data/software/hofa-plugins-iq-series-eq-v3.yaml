description: IQ-Series EQ V3 is a 6-band dynamic equalizer and channel strip with an extended 1 Hz–40 kHz range, 16 filter types, per-band stereo/L/R/M/S processing, per-band dynamics (compression and expansion), internal and external sidechain, look-ahead and live modes, and an integrated analyser.
details: |-
  This plugin has the potential to replace all of your EQs and compressors. It takes your productions to a new level. Mixing and mastering has never been so easy … Multiple Grammy Award Winner Norberto Islas: “I know quite a lot great EQ plugins but the HOFA IQ-Series EQ is the best for me because of the precision and accurate sound…” Producer, mixer and Recording Engineer from Mexico and six-time Grammy Award winner (3x Grammy, 3x Latin-Grammy) You are currently viewing a placeholder content from YouTube . To access the actual content, click the button below. Please note that doing so will share data with third-party providers. More Information Unblock content Accept required service and unblock content The IQ-Series EQ offers unique features and can serve as a complete high-end channelstrip. This video will show you all of these fantastic features and how to use them in your mixes and masters. Features V3.7.18: Extended frequency range 1 Hz – 40 kHz for each of the 6 bands 16 different filter types (6 shelves, 4 high cuts, 4 low cuts, peak, flat) Stereo, left, right, mid or side processing per band IQ dynamics per band (compression & expansion) Look ahead & live mode Sidechain (external & internal, e.g. 100 Hz controls 10 kHz) High and low cut with selectable 6/12/24/48 dB slope Analyser with hold function Solo mode for each IQ-Series EQ band Scalable plugin window size 64-bit internal processing You are currently viewing a placeholder content from YouTube . To access the actual content, click the button below. Please note that doing so will share data with third-party providers. More Information Unblock content Accept required service and unblock content HOFA CEO Jochen Sachse explains a new method for compression, which is not only suitable for challenging vocal tracks. Complex recordings like piano, guitars or keyboards can be controlled easily. With the IQ-Series EQ you can realise: top level mixes and masters innovative sound shaping due to simultaneous dynamic
specs: |-
  - 6 parametric bands with frequency range 1 Hz – 40 kHz
  - 16 filter types (6 shelves, 4 high cuts, 4 low cuts, peak, flat)
  - Per-band dynamics: compression & expansion
  - Mid/side processing
  - Internal and external sidechain support
  - Look-ahead and live (latency-free) modes
  - High/low cut filters: 6/12/24/48 dB slopes
  - Integrated frequency analyzer with hold function
  - Band soloing
  - Freely scalable UI
  - 64-bit internal processing
  - Up to 32x oversampling
  - Formats: VST3, AU, AAX
  - Operating System: macOS 10.13 or later, Windows 10 or later
  - Tested DAWs: Ableton Live, Apple Logic, Avid Pro Tools, Bitwig, Cockos Reaper, Image Line FL Studio, Magix Samplitude/Sequoia, Presonus Studio One, Steinberg Cubase/Nuendo/Wavelab
  - Two licenses included; managed via HOFA Plugins Manager
  - Offline activation supported
  - USB stick compatible
