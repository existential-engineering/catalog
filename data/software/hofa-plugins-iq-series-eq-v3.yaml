description: The HOFA IQ-Series EQ V3 is a versatile dynamic equalizer for mixing, mastering and sound design. Unlike a traditional static EQ, it does not permanently alter the frequency response, but reacts based on the signal level.
details: |-
  The HOFA IQ-Series EQ V3 is a versatile dynamic equalizer for mixing, mastering and sound design. Unlike a traditional static EQ, it does not permanently alter the frequency response, but reacts based on the signal level: each of the 6 bands has its own dynamics section with compression and expansion, so that a frequency is only boosted or cut if it exceeds a user-definable threshold. This allows you to specifically control resonances, sibilants or boomy bass without affecting the original sound in sections where there are no issues.

  The IQ-Series EQ offers unique features and can serve as a complete high-end channelstrip. With just a few adjustments the plugin transforms into a fully-fledged channel strip: the 'Flat' filter type puts a band into full-range mode, so the dynamics section of that band accesses the entire frequency spectrum and works like a classic compressor (or expander, depending on the ratio), while Bell and Shelf bands shape the sound in a classic way.

  Band order is freely adjustable. Using drag-and-drop on the double arrow in the section below the display, each band can be moved to a different position within the signal chain. As the EQ processes the bands in series, the order has a noticeable effect on the sound when using dynamic processing, and it lets you decide whether a full-range compressor acts before or after the EQ bands.

  In mastering the dynamic character is particularly important. You can intervene only when a loud refrain is cluttered in the mid range, or selectively process stereo elements in the side channel without affecting the mid signal. The high internal resolution (64-bit, up to 32x oversampling) ensures clean, artefact-free results. An external sidechain lets one signal control the dynamic processing of an EQ band, for example sending the kick drum to a specific frequency range on the bass track.

  Each active filter band has its own preset function, covering HOFA presets, user presets, and markers imported From IQ-Analyser. With IQ-Series EQ version 3.7.3 or later and IQ-Series Analyser V2 on the same computer, peaks and dips marked in the Analyser can be transferred directly to a band. An Auto mode analyses the input signal and continuously adapts the attack and release behaviour of the dynamics section, with manual ratio values from 2:1 to 12:1 for compression and 1:2 to 1:12 for expansion.
specs: |-
  - Extended frequency range 1 Hz – 40 kHz for each of the 6 bands
  - 16 different filter types (6 shelves, 4 high cuts, 4 low cuts, peak, flat)
  - Stereo, left, right, mid or side processing per band
  - IQ dynamics per band (compression & expansion)
  - Look ahead & live mode
  - Sidechain (external & internal, e.g. 100 Hz controls 10 kHz)
  - High and low cut with selectable 6/12/24/48 dB slope
  - Analyser with hold function
  - Solo mode for each IQ-Series EQ band
  - Scalable plugin window size
  - 64-bit internal processing
  - Up to 32x oversampling
  - Per-band preset function, including import from IQ-Series Analyser V2
  - Operating system: macOS 10.13 or later, Windows 10 or later
  - Two licenses included, managed via the HOFA Plugins Manager, offline activation possible
  - 14 days free trial
