details: |-
  Adx professional suite by audionamix is a virtual effect audio plugin and a software application for macos and windows. It functions as a VST plugin, an audio units plugin, a VST 3 plugin, an AAX plugin and a standalone application.

  The best tools in the adx product line, including speech and melodic plug-ins for convenience and our most powerful standalone separator. Simply the best. You wear many hats in this industry, and this bundle gives you the best solution for both music and post-production workflows.

  Separate speech, vocals, melody and more with trax pro sp, our most powerful standalone software. Work within your DAW with vvc and idc, and tackle any issue with our top of the line pro-level software and plug-ins.

  Includes: trax pro 3 sp, idc instant dialog cleaner, vvc vocal volume control.

  Who's it for?: re-recording mixers for film / tv / commercials. Mastering and remastering engineers. For post-production studios.
