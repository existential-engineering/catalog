description: >-
  An innovative polyphonic FM synthesizer employing four sine-wave oscillators
  with diverse waveshaping methods to create infinitely variable and complex
  tones.
details: |-
  Sines is a sensational and innovative original polyphonic synthesizer employing four sine-wave oscillators that utilize diverse waveshaping methods to bend pure waveforms into infinitely variable and complex shapes. Six waveshaper controls per oscillator including feedback, phase, width, shape, wavefold, and drive provide extensive tonal sculpting.

  The state-of-the-art interface provides immediate hands-on access to all sound parameters. It comes alive with illuminated indicators, color, and mini oscilloscopes, providing instant visual feedback on every parameter change.

  Sines features Cherry Audio's most extensive multimode filter to date with 6, 12, 18, or 24 dB/oct modes, four LFOs with 14 waveforms, four envelope generators, an arpeggiator with tempo sync, and a selection of four fully modulatable effects sections. An integrated eight-band graphic EQ rounds out the signal chain.

  Each oscillator includes sub and super oscillators for octave variations, and the instrument supports up to 16-voice polyphony with MIDI Polyphonic Expression. Over 700 professionally designed presets are included.
specs: |-
  - Four independent sine waveform oscillators with waveshaping
  - Six waveshaper controls: feedback, phase, width, shape, wavefold, drive
  - Sub and super oscillators for each oscillator
  - Up to 16-voice polyphony
  - Resonant multimode filter with 6, 12, 18, or 24 dB/oct modes
  - Four tempo-syncable LFOs with 14 waveforms
  - ADSR filter and amplifier envelope generators
  - Four-slot modulation matrix
  - Arpeggiator with tempo sync
  - Four fully modulatable effects sections
  - Eight-band graphic EQ
  - MIDI Polyphonic Expression (MPE) support
  - Over 700 presets
