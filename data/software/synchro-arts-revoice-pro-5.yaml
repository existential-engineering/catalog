description: The ultimate studio toolbox for vocal alignment, pitch correction,
  timing correction, and vocal doubling. Combines advanced pitch editing,
  SmartPitch, SmartAlign, automatic matching, vibrato editing, and natural
  doubler in a comprehensive vocal processing application.
details: |-
  Revoice Pro 5 is a vocal processing application for alignment, pitch correction and natural-sounding doubles, combining time alignment, tuning and doubling in one performance correction workflow.

  Pitch correction is handled by enhanced pitch editing tools, including the Shaper Tool, which places Shape Points on the pitch or level curve for detailed control and now adds them automatically, and SmartPitch, which determines when to match the pitch of a vocal performance and when to leave it alone.

  Time alignment uses SmartAlign, which decides which section of the guide track a dub should be aligned with, including dubs that do not start or end at the same points on the timeline as the guide, without pre-editing. Automatic Matching transfers pitch, timing, vibrato and volume inflections from one audio track to another.

  Further processing covers vibrato editing, which augments or diminishes the length and speed of vibrato without affecting other vocals, a de-esser with a level display for pitched and unpitched notes for controlling sibilance, and formant shifting, which changes the timbre of a performance without affecting pitch. Non-pitched elements are excluded from tuning so sibilants, consonants and breath noises can be treated separately.

  Process Groups allow multiple processes to be grouped so that all parameters can be adjusted from a single panel. The software integrates with a DAW and offers an ARA2 version for compatible hosts.
specs: |-
  - Enhanced Pitch Editing: advanced pitch correction tools for precise, professionally-tuned vocals
  - Shaper Tool: Shape Points on the pitch or level curve, added automatically
  - SmartPitch: matches the pitch of vocal performances when appropriate
  - SmartAlign: selects which section of the guide track dubs are aligned with, no pre-editing needed
  - Automatic Matching: transfers pitch, timing, vibrato and volume inflections between tracks
  - Vibrato Editing: augment or diminish vibrato length and speed
  - Process Groups: group multiple processes and adjust all parameters from a single panel
  - De-Esser with level display for pitched and unpitched notes
  - Formant Shifting: change timbre without affecting pitch
  - Warp Points Tool, Center Notes Tool, Draw Tool, Split Tool, Tuning Macros, Level Display
  - Multi-Track Editing
  - Natural Doubler
  - Time & Pitch Alignment
  - Sync Points & Protected Areas
  - DAW Integration, ARA2 version for compatible DAWs
  - 2 activations per license
  - Digital download for Mac and PC
  - macOS: macOS 10.14 or higher, Intel or Apple Silicon (M Series) processor, AU, VST3 or AAX 64-bit host
  - Windows: Windows 10 or higher, Intel or AMD processor, VST3 or AAX 64-bit host
  - Apple Silicon version of Logic does not support ARA plug-ins
