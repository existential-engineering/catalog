  density, and warm analog character to digital audio.
details: |-
  DeeTrans is an analog transformer emulator that faithfully reproduces the characteristics of real transformers. It models the magnetic saturation, core loss, and hysteresis behavior found in hardware transformers, delivering soft and natural distortion that brings warmth and depth to sterile digital sources.

  The plug-in can be inserted on master buses or individual tracks to add natural harmonics, density, and a warm analog breath. One-click preset buttons allow instant sound character switching, while 17 detailed parameters provide fine-grained control over the emulation for advanced users who want to sculpt the transformer character precisely.

  When applied across multiple tracks, DeeTrans reduces phase-related blur and tightens the stereo image — a behavior that mirrors how hardware transformers interact in a real mixing console environment. The result is a more present and impactful sound with the unique harmonic richness of transformer saturation.

  On macOS, DeeTrans runs as VST2, VST3, AU, and AAX (64-bit, macOS 10.12 or later). On Windows it runs as VST2, VST3, and AAX (64-bit). It has been tested with more than 19 DAW hosts including Ableton Live, Logic Pro X, Cubase, Pro Tools, Studio One, and FL Studio.

  A trial version is available for both platforms. The demo inserts one second of silence every 30 seconds until the plug-in is registered with a purchased serial key.
