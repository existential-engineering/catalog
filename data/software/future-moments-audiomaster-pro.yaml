description: Import audio and instantly get a mastered version. Immediately hear
  a boost in volume and overall polish of the mix.
details: |-
  Let audiomaster put the final touches on your sounds by enhancing the mix and
  sonic characteristics. Our audio algorithm automatically adjusts levels and
  gives a general "sweetening". Think of it as the difference between a
  good-sounding mix and a louder professional-sounding, finished master.

  13 genres to choose from: flat eq, podcasts, rock, folk, blues, classical,
  country, hip hop, electronic, jazz, latin, new age, pop, r&b / soul.

  Universal app - buy one version and own it on all devices. Compatible with
  iphones, ipads ios 9 and up.

  Audiomaster pro is a virtual effect audio plugin and a mobile audio app and a
  software application for ios. It functions as an audio units plugin and a
  standalone application.
