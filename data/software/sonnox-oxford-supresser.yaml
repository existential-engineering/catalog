description: Reduce problematic frequencies with ease using the Oxford SuprEsser. Whether you need to remove harshness from an electric guitar, or simply remove sibilance from a vocal track, the Oxford SuprEsser is the solution.
details: |-
  Floating threshold with automatic level tracking for hands-free sibilance control. Split-band and full-band processing modes for flexible frequency handling. Three operational modes: Low Latency, Standard, and High Resolution. Side-chain monitoring with listen mode for precise frequency targeting. Look-ahead detection for transient protection across the full 20Hz–20kHz spectrum.
specs: |-
  Frequency range: 20Hz – 20kHz. Formats: AU, VST3, AAX-Native, AAX-DSP. macOS 10.13 High Sierra or later. Windows 10 (64-bit) or later. Requires iLok account (Local Machine, iLok Device, or iLok Cloud). Two simultaneous activations per license.
