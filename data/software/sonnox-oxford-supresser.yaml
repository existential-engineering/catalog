description: Oxford SuprEsser is a dynamic EQ de-esser that reduces sibilance and harshness only when it occurs, across the full 20Hz to 20kHz range. It ships as three plugins, with split-band and full-band modes, a floating threshold that tracks performance dynamics, look-ahead detection and side-chain EQ with a listen mode.
details: |-
  The Sonnox Oxford SuprEsser is a dynamic EQ de-esser that targets sibilance and harshness in vocal and instrument tracks. It isolates problem frequencies rather than acting on the whole signal, and handles broader tasks such as removing harshness from cymbals or taming high frequencies across a mix, in both mixing and mastering. A real-time visual feedback interface and graphical EQ show where and how sibilant sounds are affecting the audio.

  It ships as three plugins for different tasks, carries a floating threshold that adapts to performance dynamics, and covers the full frequency range from 20Hz to 20kHz. It works dynamically, reducing problem frequencies only when they occur and leaving the rest of the mix untouched, whether the task is smoothing sibilant vocals, controlling harsh instrument tones or tightening the low end.

  The floating threshold automatically adapts to the dynamic range of a performance, so a vocalist moving from soft, breathy whispers to full-throttle screams still receives smooth, transparent de-essing with no manual adjustment. Split-band mode applies dynamic EQ only to the targeted frequency range, preserving surrounding frequencies, while full-band mode maintains phase coherence for subtle broadband control, and look-ahead detection catches fast transient spikes without distortion.

  The plugin includes side-chain EQ with a listen mode, allowing you to audition only what the processor is reacting to. Adjustable attack and release times provide creative flexibility, whether you need lightning-fast suppression for sharp consonants or a slower response to smooth out harsher tones, making it equally at home on lead vocals, overheads, string sections, or mastering chains.
specs: |-
  - Dynamic EQ de-esser operating across the full 20Hz to 20kHz range
  - Three processing modes: Low Latency, Standard and High Resolution
  - Floating threshold with automatic level tracking for dynamic performances
  - Split-band mode applies dynamic EQ only to the targeted frequency range
  - Full-band mode maintains phase coherence for subtle broadband control
  - Look-ahead detection catches fast transient spikes without distortion
  - Side-chain EQ with listen mode to audition what the processor reacts to
  - Adjustable attack and release times
  - Real-time visual feedback interface with graphical EQ
  - Scalable GUI
  - AAX-DSP instances per chip: mono 3 at 44.1/48 kHz, 1 at 96 kHz; stereo 2 at 44.1/48 kHz, 1 at 96 kHz
  - Licence includes two simultaneous activations, authorised with an iLok account (Local Machine, iLok2/iLok3 device, or iLok Cloud)
  - AAX-Native requires Pro Tools 11 or later; AAX-DSP requires Pro Tools Ultimate, Pro Tools HD or Avid VENUE
  - macOS 10.13 High Sierra or later; Windows 10 (64-bit) or later
