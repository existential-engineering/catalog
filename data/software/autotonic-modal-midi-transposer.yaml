url: https://www.autotonic.net
description: AutoTonic is industry's most extraordinary MIDI transposer
  featuring a unique approach to chord and scale transposition.
details: |-
  AutoTonic is industry's most extraordinary MIDI transposer featuring a unique
  and patented "modal" note transposing technology. AutoTonic is characterizable
  as a new musical instrument which allows you to play in any harmonic content
  existing in western tonal music (24,576 scales).

  With autotonic there is no need to buy any additional expensive gear simply
  use your existing MIDI controllers.

  Autotonic is an invaluable tool for creating, composing and finding ideas you
  would otherwise never think of. It helps play things that even professional
  pianists would struggle with thanks to its scale mapping technology, and as a
  composer and producer tool, it helps experiment with ideas and scale/chord
  sounds as well as come up with desired results.

  Autotonic has given users the means to write in-key musical solos without the
  hassle of learning all fingering, especially when not going to be the one to
  record that solo in the studio.

  On mac there is already a virtual MIDI port (autotonic MIDI in/autotonic MIDI
  out) available in autotonic. The "MIDI port" workaround on windows is fairly
  easy, simply follow the setup documentation provided.
specs: |-
  - True modal transposing (24,576 scales)
  - Black keys key switching technology
  - Customizable music theory database
  - Unique chord stacking technology
  - 450+ template scales
  - Semiotically crisp-clear user interface
  - Max. Hardware & software compatibility
  - Available for mac & pc
  - Standalone processor
  - MIDI mapping
  - Non-diatonic scale mapping
  - Greater than 7-note scales support
  - AutoTonic MIDI in/AutoTonic MIDI out (mac)
  - Virtual MIDI port support (mac)
