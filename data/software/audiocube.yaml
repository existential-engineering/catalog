details: |-
  Welcome to Audiocube - your 3d sound design suite. Expand your sound with a
  suite of cutting-edge 3d audio tools. Use real-time acoustic simulation and
  binaural hrtf processing to add a new dimension of spatial realism to your
  music and sound design. Experiment with unique compositional tools to create
  generative music, using systems not possible in any traditional DAWs.

  A unique 3d audio workstation - explore the future of audio production.
  Import, spatialize, sequence, process, mix, master, and record sounds with
  custom tools and devices. Real-time acoustic simulation - with reflections,
  occlusion, and hrtf binauralisation. Generative music composition - using
  randomization, cyclic sequencing, physics-based collision, and more 3d
  exclusive techniques. Spatial automation - conduct the position of sounds over
  time.

  Samplers allow you to place, shape, and process sounds within the 3d space.
  They provide a versatile tool for importing audio files, adjusting their
  properties, and positioning them for optimal spatialization and interaction.
  Emitters are dynamic devices that emit physics-based audio nodes. These nodes
  interact with the environment, providing a more organic and realistic
  soundscape by simulating how sounds would behave in a real-world setting.
  Tickers are rhythmic triggers that control other devices in your project.

  Immerse yourself in a truly realistic soundscape with our cutting-edge
  psychoacoustic head modeling and binauralization technology. This feature
  precisely simulates how we naturally hear sounds, providing a deeply immersive
  audio experience that mirrors real life. Create bespoke acoustic environments
  tailored to your needs. Utilize advanced acoustic variables such as
  reflections, occlusion, distance attenuation, and air absorption to
  meticulously craft spaces with precise sound characteristics.

  Colour and control your sound with a flexible mixer. This tool provides a
  comprehensive and intuitive interface for adjusting levels, eq, gain, and
  effects. The analog-style controls and audio processing deliver a rich,
  vintage character, bringing classic audio qualities into your modern projects.
  Elevate your projects with advanced mastering tools from dynamic compression
  and parametric eq to an expansive spatial reverb.
