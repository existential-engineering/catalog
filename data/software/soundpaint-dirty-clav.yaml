details: |-
  Electric Funk Keys with Bite. Caliente! Think soulful, funky grooves of the 70s with the Dirty Clav! Raunchy, overdriven tones, percussive attacks, and 127 responsive, expressive velocity layers make this the ultimate real-life Clav - supercharged by Soundpaint! We sampled a clean, pristine clavinet in the past, and while it's a great sound, we just needed to get dirty. So we took a warm, beat-up Clav and sampled every piece of it! Mix and match the natural Clav sounds, analog pedals, multiple amps, key noise, and other mechanical sounds to create the perfect level of grit and realism. From the bright, cutting attacks to the rough, gritty sustains, every detail has been captured in perfect, dirty detail. Soundpaint opens all new kinds of grimy possibilities for the Clav. Check out the programs for some instant inspiration, or craft something new for the perfect funky, bluesy mood. The Clav just got funkier than ever!
