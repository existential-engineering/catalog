details: |-
  The Tubechild670 is a Vari-Mu tube compressor/limiter effect modeled after the Fairchild 670 — the most expensive and sought-after tube compressor/limiter of all time. The legendary 1950s hardware features a unique circuit of 20 carefully matched valves and 14 colorful vintage transformers that have shaped the sound of more hits than any other piece of gear in the history of music.

  The unique topology of the Fairchild 670 gained its popularity by adding unparalleled character, thickness, and natural warmth to tracks and gluing mixes together like nothing else. The 670 can put any track in front of the mix while preserving its musical smoothness, making it an essential tool across genres — from The Beatles, Pink Floyd, and Motown to modern metal and pop/hip-hop production. The 670 grips transients firmly and levels source material with unobtrusive gain riding, delivering natural, pristine-sounding lush compression without artifacts or pumping.

  Developed in the early 1950s by American console-maker and inventor Rein Narma, the Fairchild 670 was designed to provide maximum level control with clean and pristine natural sound. For its first decade it was used as a protective device for cutting vinyl and broadcast limiting. After units made their way to Abbey Road and became the weapons of choice for The Beatles, the legend began, and engineers and producers embraced this compressor as a tone-shaping machine.

  Antelope Audio sourced one of these well-preserved rare hardware units, deconstructed it down to its components, and measured the valves, transformers, wires, and the unique non-linear relationship of the internals. Each component was individually re-created in digital form, and using the original blueprints the Tubechild670 was assembled as a faithful and accurate modern recreation of the vintage classic. Rather than relying on basic EQ and harmonic saturation to color the signal, the modeling method accumulates the vintage color and mojo of the 670 by running the signal through every single valve and transformer, just like the original.

  Tubechild670 runs in real time on Antelope Audio Synergy Core interfaces and is also available as a Synergy Core Native plugin for use in any DAW on macOS or Windows.
specs: |-
  - Vari-Mu tube compressor/limiter emulation of the Fairchild 670
  - Faithful digital recreation of the original 1950s circuit topology
  - Models 20 carefully matched valves and 14 vintage transformers
  - Component-by-component modeling — not basic EQ or harmonic saturation
  - Records in real time on Antelope Audio Synergy Core interfaces
  - Mixes natively as a Synergy Core Native plugin on macOS or Windows
  - Adds natural warmth, thickness, and tube character to any source
  - Places tracks up-front in the mix while preserving smoothness
  - Limits and glues mixes for maximum gain and depth of sound
