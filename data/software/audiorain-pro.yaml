details: |-
  Audiorain is an audio plugin dedicated to rain sound effects. Features: high
  5.1 audio performance work your sound in mono, stereo, 2.1, 4.0 and even in
  full 5.1 sound field.

  More than 60 presets to help you produce on the fly. They are classified in
  seven categories from rain drops to shower. Automations allows to synchronise
  perfectly any rain variations to match your scene.

  Clear interface 5 distinct blocks of interaction (rumble, shower, liquid one,
  liquid two, lfe). Each one comes with several settings to ensure the most
  precise sounds. Randomize button create different sounds with one simple
  click.

  Fast install and fast loading with just a few megabytes of space, there is no
  need for high performance hardware, you can work even on the modestest of
  computers. Works with every sequencer use it in VST, rtas and even in
  standalone mode. Work in real-time no more need to cut/paste/clear your .wav.
  Slave mode for audiowind.
specs: |-
  - 5.1 audio performance
  - Mono support
  - Stereo support
  - 2.1 support
  - 4.0 support
  - 5.1 surround sound
  - 60+ presets
  - Automations
  - Randomize function
  - Slave mode
  - Real-time processing
  - Standalone mode
  - RTAS support
