details: |-
  The bsendorfer 290 imperial was tuned and regulated by the piano
  manufacturer's best engineers and piano technicians. Its 54 GB sample set
  includes unlooped sustain samples in pedal up and pedal down variations, tone
  repetitions, real recorded sustain pedal resonances, multiple release samples
  and key noises. Each of the two listening positions totals at 4,675 samples.

  The 290 imperial is the only concert grand in the world to have nine sub-bass
  notes, extending downward to low c, and giving it a keyboard range spanning
  eight octaves. These extra notes not only provide added richness and depth to
  the instrument overall, but they enable the performance of works originally
  scored with lower notes, by composers such as bartók, debussy, ravel and
  busoni.

  The vienna symphonic library team succeeded in capturing the sound of the
  piano in its resonating state, with the sustain (damper) pedal depressed. This
  results in the physically correct recreation of the piano's resonant character
  in both pedal-down and pedal-up positions.

  With the bsendorfer imperial vienna instrument there are no sample
  manipulations, no fades between tones, and no dsp calculations, just an
  absolutely natural acoustic image of the actual processes that occur during
  piano playing.

  Apart from the acoustic perspective of the pianist, the user is also provided
  with concert hall audience perspective, for proper imaging on the orchestral
  stage.
