details: |-
  The pulsar 900 Series Modular Synthesizer is the result of painstaking
  analysis and detailed modeling of classic, large format, analog synthesizer
  modules. Great care has been taken to make sure that both sound and operation
  are as close as possible to hardware modules.

  The hardware accelerated user interface allows for very smooth panning and
  zooming within the virtual rack, while interacting with controls. It is
  rendered at a high frame rate to ensure immediate feedback and support fast
  manipulation.

  The p900 supports several different voice allocation modes for monophonic as
  well as 4- or 8-voice polyphonic patches. Enabling polyphony is as easy as
  flipping a switch - for any patch.

  The p900 has a configurable rack, a large set of installable modules, and
  extremely realistic but efficient analog modeling that support highly complex
  configurations of the many modules, including: MIDI/CV converter, oscillator
  driver, oscillators, mixers, filters: transistor ladder/diode
  ladder/ota/svf/sallen key, envelope generators, attenuators, vcas, noise &
  filters, ring modulator, lfos, sample & holds, stereo output, analog delays,
  plate reverb, MIDI clock, sequencers.
