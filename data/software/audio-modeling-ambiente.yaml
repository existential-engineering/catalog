description: Ambiente is a room simulator that adds depth, space, and acoustic realism to your sound.
details: |-
  Ambiente is Audio Modeling's room simulator designed to place every instrument in the same acoustic environment, not just SWAM, but any sound source. Available as a standalone app and plugin, Ambiente brings virtual instruments and recorded tracks together inside a shared, realistic space, allowing precise positioning and natural interaction between sources. With centralized control across multiple instances, it ensures seamless integration and cohesive, organic mixes with true acoustic realism.

  Ambiente brings an advanced level of realism to your productions, allowing you to place any instrument, whether virtual or recorded, into the same virtual room. This Room Simulator goes beyond standard reverb or convolution by calculating the geometric reflections of sound waves, so every source interacts naturally with the environment.

  With Ambiente, you can record real instruments such as solo strings or other acoustic performers in compact spaces like a home studio, then blend them seamlessly with your virtual instruments, including SWAM instruments, inside the same simulated acoustic space. Control room size, choose absorption materials, and adjust microphone positioning to fine-tune the sonic environment. Whether you want the intimacy of a tight studio room or the openness of a large reverberant hall, Ambiente makes it easy to create a cohesive soundscape.

  Its real strength is the way multiple instances communicate inside your DAW. You can manage instruments and audio tracks from one centralized interface, making strings, vocals, guitars, and any other source feel as if they were recorded together, even when they were captured in different places with different tools.

  The interface offers three views: Room View for intuitive drag-and-drop instrument placement, Tech View for precision placement in complex setups, and List View for parametric control and accessibility. Like all SWAM instruments, Ambiente is navigable by the native accessibility frameworks on macOS, Windows and iOS, offering an inclusive music-making experience for blind and visually impaired musicians.
specs: |-
  - Room simulator computing geometric reflections of sound waves, going beyond conventional reverb or convolution workflows
  - Works as both a standalone app and a plugin for all major DAWs
  - Up to 3 customizable rooms plus a Close Mic Room
  - Centralized control of all instances in a session from one interface
  - Cross-instrument communication: SWAM and non-SWAM instruments interact in the same space
  - Control of room dimensions, absorption materials and microphone placement
  - Three interface views: Room, Tech and List modes
  - Accessible via native accessibility frameworks for blind and visually impaired users
  - macOS 10.13 - 26: Standalone, AU, VST, VST3, AAX - 64bit
  - Windows 10, Windows 11: Standalone, VST, VST3, AAX - 64bit
  - NKS (Native Instruments Komplete Kontrol) support via VST3 only
  - Apple Silicon supported natively
  - Installation occupancy: from 52 MB to 180 MB on macOS, from 36 MB to 84 MB on Windows, depending on the number of plugin formats installed
  - RAM occupancy: about 52 MB for each instrument instance
  - Requires at least a 1.6 GHz Core 2 Duo CPU for running a single plugin instance
  - 15 days trial available
