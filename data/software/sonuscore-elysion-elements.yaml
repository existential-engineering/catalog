description: "The free entry point to the ELYSION hybrid synth line: 30 Themes
  for the free Kontakt Player, built from synthetic sources sampled across
  velocity layers the way acoustic instruments are."
details: |-
  ELYSION ELEMENTS is the free entry point into Sonuscore's ELYSION universe, a hybrid synth library for Kontakt Player. Where most synth libraries sample a sound once and use velocity to change its volume, ELYSION records its sources, including several vintage synths, across multiple velocity layers and shapes each layer to its own timbre. Playing softly gives a soft, rounded tone, and playing hard opens the sound up so the harmonic content and character shift the way an acoustic instrument does under the bow or the breath. Sonuscore sums the approach up as synthetic sources treated with orchestral sampling methodology.

  The free version carries thirty Themes hand-selected by Tilman Sillescu to show the range of the system, together with the full effects engine and its morphable FX parameters, the arpeggiators, the envelopes, the pan engine and the mixer. All of it is active and editable, so the sound-shaping depth is the same as an ELYSION 2 owner has, with only the instrument browser locked.

  Themes are named after planets and interstellar objects, and the name signals the character: Mars for distortion and hard-edged transients, Venus for warm unhurried sustains, Neptune for cold obscured textures, Mercury for restless shifting patterns, Terra for organic close tones, Jupiter for playful scale, Saturn for slow deliberate weight, Uranus for shimmering high-register wonder, Sagittarius for the heaviest and darkest material, Antares for wide modern trailer hits, Sirius for optimistic drive and Orion for deliberate ambiguity.

  Four Theme types describe how each one behaves. Animated Themes build complex rhythmic and melodic arrangements with full effect and arp activity, Pad Themes hold sustained evolving textures, Hit Themes land sharp percussive impacts for accents and transitions, and Pulse Themes lock rhythmic patterns to the host tempo. The library runs in the free KONTAKT Player from version 8.1.0 upward and occupies 7.74 GB on disc.
specs: |-
  - 30 Themes hand-selected by Tilman Sillescu, covering all four Theme types: Animated, Pads, Hits, Pulses
  - Synthetic sources, including vintage synths, sampled across multiple velocity layers with each layer shaped to its own timbre
  - Full effects engine with morphable FX parameters
  - Arpeggiators, envelopes, pan engine and mixer, all editable
  - Same sound-shaping depth as ELYSION 2, with the instrument browser locked
  - Themes named after planets and interstellar objects to signal their character
  - Works with the FREE KONTAKT PLAYER
  - Requires KONTAKT Version 8.1.0 or higher
  - Apple Silicon Macs: macOS 13, 14 or 15 (latest update)
  - Intel Macs (i5 or higher): macOS 13, 14 or 15 (latest update)
  - Windows 10 or 11 (latest Service Pack), Intel Core i5 or equivalent CPU
  - Graphics hardware support for OpenGL 2.1 or higher and Direct 3D 11.1
  - 8 GB RAM (more recommended)
  - 7.74 GB hard disk space
