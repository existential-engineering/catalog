description: A correction tool designed to control, adjust, and rescue incorrectly recorded dual channel stereo tracks, or process them for specialized applications. Features up to 2ms delay to repair microphone distance mismatches, width expansion up to 400%, master gain control, low/high frequency dedicated controls, M-S decoder, polarity switches, channel swap, and correlation and balance meters. Supports sample rates up to 384 kHz.
details: |-
  PSP stereoController2 provides up to 2ms delay (repairs ~68cm microphone distance mismatch), width expansion up to 400%, master gain control +-12dB, dedicated low and high frequency controls, M-S decoder, polarity switches and channel swap, and correlation and balance meters. Requires free iLok user ID and iLok License Manager. Supports 3 activation locations.
