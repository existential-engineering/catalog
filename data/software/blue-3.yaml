details: |-
  When it was first released in 2005 'blue' already reflected Rob Papen's
  cutting-edge, creative, and most importantly musical approach toward
  developing virtual synthesizers. Rob Papen himself called it 'cross-fusion
  synthesis' because it covered both subtractive and FM synthesis in one
  creative concept.

  With its successor blue-ii, the 'cross-fusion synthesis' was also expanded
  with a creative range of samples and the highly versatile xy pad. The concept
  for blue-iii still remains true to that ethos with even more added sound
  dimensions and features to its extended name.

  Firstly adding our own take on 'karplus strong string model synthesis', new
  'waveforms', new 'filter types', a new range of creative 'built-in samples',
  and lastly the option for you as a user to load up to 6 samples inside each
  preset. Blue-iii's gui has received an overhaul including many different
  sizes, the xy pad is now always on the front panel.

  The audio engine has received dna from our virtual analog synthesizer b.I.t.
  Resulting in unsurpassed audio quality. Lastly, of course, this amazing
  instrument is shipped with 5000+ presets by rob himself and well-known
  industry sound designers.

  Blue-iii is a phenomenally powerful virtual instrument to behold and
  represents an amazing journey into 'cross-fusion synthesis'.
specs: |-
