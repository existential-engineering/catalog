description: Betty Middle V2 - center bass and width plug-in. Betty middle is a
  stereo enhancement VST, VST3 and Audio Unit plug-in for Mac OS X and Windows.
details: |-
  Betty Middle V2 is a stereo enhancement VST, VST3 and Audio Unit plug-in for
  Mac OS X and Windows based hosts with center bass option.

  Inside this little tool is a full working m/s matrix (mid/side) with sum, mono
  (mid) and side pre-listen function.

  Stereo width enhancer up to 200% (after mono/mid) with correlation meter.

  Mono signal from 20hz to 20khz via linkwitz-riley x-over filter.
specs: |-
  - M/s matrix (mid/side)
  - Sum function
  - Mono (mid) function
  - Side pre-listen function
  - Stereo width enhancer up to 200%
  - Correlation meter
  - Mono signal from 20hz to 20khz
  - Linkwitz-riley x-over filter
  - Center bass option
