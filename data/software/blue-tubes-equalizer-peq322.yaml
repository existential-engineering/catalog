  Specially designed to meet the most demanding studio tracks, the bt equalizer
  peq322 features 3 parametric bands with center frequency, bandwidth-q and
  amplitude controls, high-pass and low-pass filters as well as low-shelf and
  high-shelf filters.

  The bt equalizer peq322 delivers the controls and the amazing results of a
  true analog eq.

  The peq322 is the perfect choice when a truly vintage eq sound is what your
  music requires.

  Blue tubes equalizer peq322 by nomad factory / plugivery is a virtual effect
  audio plugin for macos and windows. It functions as a VST plugin, an audio
  units plugin and an AAX plugin.
