details: |-
  White Room captures the inspiration behind a classic digital reverb sound that became closely associated with landmark hip-hop records of the late 1990s and early 2000s. It was created in collaboration between Metric Halo, Make Believe Studios and Detroit producer Jake Bass of F.B.T. Studios.

  Designed to capture that deep, polished sense of space, it brings clarity and character to vocals, drums, guitars and more.

  Its streamlined design keeps the focus on music rather than menus, with just three essential controls: Mix, Pre-Delay and Length. Key presets are included, the interface size is adjustable and the MH Preset Manager provides cross-platform presets.

  Licensing requires an iLok.com account. Each license includes two activations and may be installed on the machine, on an iLok dongle or in the iLok Cloud for portability, and one license covers all supported platforms.
specs: |-
  - Faithful recreation of the White Room reverb used on countless hits
  - Provides Mix, Pre-delay and Length controls to tune the reverb
  - Key presets included
  - Adjustable UI size
  - MH Preset Manager provides cross-platform presets
  - macOS 10.10 or newer, Intel processor or Apple Silicon, 64 bit
  - Windows 7 or newer, Intel processor, 64 bit
  - AU, VST 2 and 3 or AAX (Pro Tools 11 and newer Native) host on macOS
  - VST or AAX (Pro Tools 10, 11 and 12 and Native) host on Windows
  - iLok.com account required, license includes two activations
