description: >-
  Neptune is an advanced pitch adjuster, audio transposer, and voice synth for
  Reason. It enables users to correct vocal performances with adjustable
  correction speed and expression preservation, create harmonies in real-time
  from vocal tracks via a MIDI keyboard, transpose audio, modify voice character
  with formant adjustment, and generate entirely new melodies using its built-in
  polyphonic voice synth.
