description: Vlad's legendary Molot compressor. Raw, brutal and direct, with
  subtle traces of rock'n'roll.
details: |-
  Molot is Vladislav Goncharov's original compressor, a deliberately coloured and hard-to-tame design rather than a transparent one. The manufacturer's own notes on the page state that it adds a lot of colouring to the sound, that it is not a compressor for beginners and is pretty hard to tune, and that the GUI language can be switched with a GUI-less version also included.

  Further notes cover its cost and character controls: oversampling can be turned off to reduce CPU load, the input gain and the optional saturation stage govern how much distortion is produced, and the dithering can be turned off if the output is too noisy. The manual documents each of these.

  The product is discontinued. Tokyo Dawn Labs offers the download for historical reasons only, with no active support and no guarantee of compatibility with modern systems.
