details: |-
  AquesTone by AQUEST is a vocal synthesizer VST instrument for Windows.

  Features real-time generation of a singing voice from MIDI data and a lyrics
  file.

  Lyrics file can be edited with a text editor (uses ascii or shift jis
  character code).

  Uses japanese full phoneme set with low cpu usage.
specs: |-
  - Vocal synthesizer
  - Real-time singing voice generation from MIDI data
  - Lyrics file editing with text editor
  - Ascii character code support
  - Shift jis character code support
  - Japanese full phoneme set
  - Low CPU usage
