description: Crunck V2 Guitar Amplifier is a one channel free plugin designed for a wide range of music genres, spanning from metal to fusion, rock to blues as the Gain knob is turned up.
details: |-
  Crunck V2 is a free, one-channel guitar amplifier plugin that delivers a wide range of tones from clean to high-gain. The Gain knob spans from 0 to 10, covering everything from sparkling clean tones to aggressive high-gain distortion suitable for metal, fusion, rock, and blues.

  The plugin includes an optional 4x12 cabinet simulation loaded with Vintage 30 speakers. Players can choose to use the built-in cabinet simulation for a complete amp-in-a-box experience, or bypass the cabinet section entirely to use their own impulse responses or external cabinet simulators.

  Crunck V2 is available as a free download for Mac and Windows in VST2, VST3, AAX, and AudioUnit formats, compatible with all 64-bit DAWs. A mobile version is also available for iPhone and iPad via the Apple App Store.

  Version 3.0.4 supports Mac OS 10.13 or newer (Intel and Apple Silicon) and Windows 7 or newer, with a minimum of 1GB RAM required.
specs: |-
  - One channel guitar amplifier
  - Gain range from clean through metal, fusion, rock and blues
  - Built-in 4x12 cabinet loaded with Vintage 30 speakers, with bypass option
  - EDGE and Presence MODE parameters
  - iOS version for iPhone and iPad
  - Requires a VST2, VST3, AAX or AudioUnits compatible host
  - Intel compatible or Apple Silicon CPU, 1GB RAM
  - Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
