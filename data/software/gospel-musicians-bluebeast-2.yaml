details: |-
  BlueBeast 2 is a dedicated virtual instrument and multi-sampled recreation of the legendary Yamaha EX5/EX7. If you're searching for Yamaha EX5 sounds, an EX5 sample library, or the closest VST/plugin to the Yamaha EX5 —this is it. BlueBeast 2 was built to capture the warmth, phatness, and unmistakable character of the original hardware in the most exhaustive EX5 virtual library we've ever created. Released in 1998, the Yamaha EX5 was ahead of its time with multiple sound-generation approaches. While not every original synthesis system is reproduced natively, BlueBeast 2 delivers a beautifully sampled, nostalgic representation that preserves the essence, tone, and feel of the EX5—making it the closest you can get to the real machine in a modern plugin. 🎹 What You Get (EX5/EX7 Library Content)

  ⭐ Summary

  BlueBeast 2 is the closest you will ever get to a Yamaha EX5 in a plugin. With a 30GB library, 384 factory voice/performance presets, raw waveforms, recreated AN waveforms, sampled VL elements, drum kits, and a modern editing/modulation workflow, it's the definitive answer for anyone searching for EX5 sounds in a VST/virtual instrument format.
specs: |-
  - 30GB sample library (27GB lossless compression)
  - 384 factory presets (factory voices + factory performances)
  - 904 sounds with 30+ digital effects
  - Includes all RAW waveforms for deep patch recreation
  - Sampled factory voice presets for authentic EX5 tone
  - AN modeled wavetables (including PWM) recreated via PhatTable
  - Includes all drum kits
  - All sampled VL elements captured from the hardware
  - The most exhaustive EX5 recreation Built to be the most meticulously sampled EX5 virtual instrument—focused on the warmth, depth, and signature character people chase when they think "EX5."
  - RAW waveforms included You're not locked into presets—use the included raw waveforms to rebuild your favorite EX5 patches with modern synthesis and effects.
  - AN warmth via PhatTable Classic analog-style AN waveforms were converted into PhatTable format to preserve the "analog goodness," including PWM behavior.
  - Sampled VL elements VL content is captured via extensive sampling to preserve the original vibe and musicality.
  - EX5-style 4-element architecture Designed around the EX5's familiar 4-element structure so EX5 users feel at home when editing.
  - Dynamic modulation Right-click modulation assignment for envelopes/LFO/modwheel + MIDI learn for real-time performance control.
  - High-quality effects Includes a premium effects suite powered by Overloud VKFX plus additional analog-modeled effects.
  - Easy preset navigation Favorites ("heart") system, filtering, and recall—plus program change support for performance workflows.
  - Resizable UI Scale the interface for any display and keep editing fast with minimal submenu diving.
  - Simple installation Install the app, then download sounds from inside the app—no manual extraction workflows.
  - Dedicated (Blue UI) Same sound engine and editing features—just a dedicated EX-style blue interface.
  - Pure Synth Expansion Unlocks inside the Pure Synth FREE Player and lets you combine BlueBeast 2 with other expansions in one unified environment.
  - FDSP : Not reproduced as a synthesis system; factory sounds were sampled with FDSP enabled where applicable.
  - VL : VL synthesis is not reproduced as synthesis; VL waveforms/elements are sampled.
  - AN : Raw waveforms are converted into wavetables for use; classic AN character is recreated through PhatTable modeling.
  - Arpeggiator : Not included.
  - Realism : Presets are matched approximately 80–90% through extensive sampling; filters/effects/synthesis can't be mirrored exactly.
