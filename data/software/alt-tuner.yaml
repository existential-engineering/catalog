details: >-
  Alt-tuner is a jesusonic plug-in that retunes your MIDI keyboard or softsynth
  microtonally. Alt-tuner combines ease of use with powerful capabilities: you
  don't need to know tuning theory to get started. Well-chosen defaults get you
  playing right away. Alt-tuner is novice-friendly and encourages "stumbling
  onto" new tunings.


  Alt-tuner uses a graphical point-and-click interface. You're moving sliders
  and clicking on things, not typing in commands and numbers. However, as you
  explore alt-tuner, many advanced mathematical concepts are demonstrated in a
  way that can be immediately seen and heard. The manual even includes a
  120-page primer on tuning theory. Alt-tuner is so easy to use that it doubles
  as an educational tool.


  You control alt-tuner not only with mouse clicks but also with foot pedals,
  keyswitches, or almost any MIDI message your gear can send. This lets you
  retune as you play, allowing for extreme modulations, adaptive tuning,
  multiple edos in one piece, etc. You can program your pedals and keyswitches
  so that you can switch to an entirely different tuning instantly with a single
  foot press, allowing you to concentrate on the playing, not the tuning
  process. You can even retune notes you've already played via the retroactive
  retuning window.


  Alt-tuner gives immediate visual feedback on your tuning with an interval
  display and with lattice, graph and table views. For non-octave and/or non-12
  tunings, you have full control over the keyboard layout, with automatic naming
  of every key by letter & accidental (e.g. F#) and of every interval by quality
  & degree (e.g. Minor 3rd). You can even create your own symbols for both note
  names and accidentals.


  Because alt-tuner is a DAW plug-in, it's completely integrated with the
  recording process. You can fully control tuning changes over the course of
  your recording using envelope automation. No composition is too complex to
  record. Alt-tuner can retune multiple synths at once, with each player
  retuning their own synth, or one player retuning everyone.
specs: |-
  - Jesusonic plug-in
  - MIDI-only effect
  - Microtonal MIDI retuning
  - 5-limit just intonation
  - 7-limit just intonation
  - 11-limit just intonation
  - Historical temperaments (pythagorean, meantone, well-temperament)
  - Stretched piano tunings (railsback curves)
  - Ethnic tunings (turkish, arabic, persian, indian, indonesian)
  - Edos (equal division of octave)
  - Adaptive just intonation
  - Non-octave tunings
  - Non-12 tunings
  - Bohlen-pierce tuning
  - Pitch bend output
  - Sysex messages output
  - Keyswitch output
  - MIDI channel redirection
  - Retroactive retuning window
  - Interval display
  - Lattice view
  - Graph view
  - Table view
  - Keyboard layout control
  - Automatic note naming
  - Interval naming by quality and degree
  - Custom note name symbols
  - Custom accidental symbols
  - Foot pedal control
  - Keyswitch control
  - Envelope automation
  - Multiple synth retuning
  - Graphical point-and-click interface
  - 120-page tuning theory primer
  - VST plugin format
  - Standalone application
  - Macos compatible
  - Windows compatible
  - Linux compatible
  - Reaper integration
  - Reajs wrapper support
  - Rewire support
  - Virtual MIDI cable support
