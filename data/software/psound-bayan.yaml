name: Bayan
manufacturer: psound
primaryCategory: synthesizer
url: https://www.psound.it/accordina.html
description: The Bayan is a type of chromatic button accordion developed in
  russia in the early 20th century. It's used for classical and contemporary
  music.
details: |-
  Psound bayan is the most accurate virtual accordion available.

  Bayan by psound is a virtual instrument audio plugin and soundware (samples or
  presets that load into other products) for macos and windows. It includes, and
  is therefore powered by, uvi workstation, which functions as a VST plugin, an
  audio units plugin, a VST 3 plugin and an AAX plugin.
specs: |-
  - 64 notes right hand (e-g)
  - 58 notes left hand (e-c#)
  - Right hand chorus: 4', 8, 8 cassotto, 16'
  - Right hand registers: 15
  - Left hand chorus: 4', 16', 16' cassotto
  - Left hand registers: 6
  - Pedal reinforcement
  - Key noise (adjustable)
  - Register noise (adjustable)
  - 96khz/24-bit resolution
  - 3000 samples
  - 1.8 GB memory storage
  - Reverb (on/off switch) with time and mix knobs
  - Uvi workstation
