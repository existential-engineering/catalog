description: "A stereo master buss compressor and equalizer emulating
  MagicDeathEye hardware, featuring Variable Mu tube gain structure with
  integrated EQ and a gentler compression curve than the mono version."
details: |-
  Dual-channel compression
  Integrated EQ section (5dB or 3dB boost options)
  Adjustable harmonic distortion (0-100%)
  High-frequency EQ (full stereo, mid, or side-only processing)
  Optional elliptical filter for side signal (vinyl mastering)
  Linked input/output gain option
  2x or 4x oversampling
specs: |-
  - Variable Mu tube gain structure stereo compressor
  - Integrated inductor-based EQ with two boost-only bands and selectable frequencies
  - Two-frequency low cut filter
  - High-frequency EQ switchable between full stereo, mid, or side processing
  - Harmonic distortion control (0-100%)
  - Optional elliptical filter for side signal (vinyl mastering)
  - Linked input/output gain option
  - 2x and 4x oversampling
  - Windows 32-bit and 64-bit (VST, VST3, AAX)
  - macOS 10.7+ (Intel and Apple Silicon) — AU, VST3, AAX
  - Linux ARM and x86_64 (VST3)
  - iOS — AUv3
  - Free demo available for all platforms
