name: Dorico
manufacturer: steinberg
primaryCategory: notation
description: Dorico is Steinberg's music notation and composition software,
  built around flexible input and editing tools and automatic engraving, and
  available in SE, Elements and Pro editions plus an iPad app.
details: |-
  Dorico is a scorewriter for macOS and Windows that Steinberg describes as the
  only music notation software designed from the ground up for composing. Its
  input and editing tools are meant to let a writer change any decision at any
  time, and it formats and engraves the music automatically, with thousands of
  options available in Dorico Pro for publishers who need to override the
  defaults.

  Arranging tools move music between players and explode or reduce it onto more
  or fewer instruments, and transformation tools handle tonality changes,
  inversion and mapping onto new scales, including creating fully voiced parts
  from chord symbols.

  Playback is built in rather than bolted on. Dorico ships with hundreds of
  sounds, more than 30 effects processors and a full audio mixer, and an
  integrated Key Editor for adjusting how the score performs.

  Scores travel by MIDI and MusicXML import, and by MIDI, MusicXML, audio and
  graphics export. Projects are fully compatible between the desktop editions and
  Dorico for iPad. The family runs from Dorico SE through Dorico Elements to
  Dorico Pro, with Dorico 6 the current generation.
specs: |-
  - Editions: Dorico SE, Dorico Elements, Dorico Pro, Dorico for iPad
  - Automatic engraving and score formatting
  - Flexible note input and non-destructive editing
  - Transformation tools for tonality, inversion and scale mapping
  - Parts created from chord symbols
  - Hundreds of bundled sounds
  - More than 30 effects processors
  - Full audio mixer
  - Integrated Key Editor for playback detail
  - MIDI and MusicXML import
  - MIDI, MusicXML, audio and graphics export
  - Projects compatible between desktop and iPad
