details: |-
  CS-80 is the definitive ultra-deep sampled (UDS) synth. The most detailed sampling of the infamous Yamaha CS-80 ever done. The legendary polyphonic synth, immortalized by Vangelis in Blade Runner and Chariots of Fire. Prominently featured in global hits like Michael Jackson's Billie Jean , Toto's Africa & Rosanna , Springsteens' Born in the USA. Later Hans Zimmer, Taylor Swift, Paul McCartney, Empire of the Sun, Walking on a Dream and countless others used the CS-80. CS80 Virtuoso includes over 500 expertly crafted programs built from more than 270 UDS sampled parts, organized into categories: Arps, Basses, Bells and Plucks, Brass, Keys, Leads, Noises, Pads, Presets (Factory Classics), Presets (Famous Tracks), Ring Modulated, Strings, Templates (Quick Starters), and Unisons. This specific CS-80 was modded with a rare Unison mode, routing all voices into one massive note. Extensively UDS sampled for maximum authenticity. Featuring deep curated collections of programs used by Vangelis and other iconic artists, with dozens of expressive variations for each. You don't just get one Blade Runner lead. You get dozens. The result is instant inspiration and deep creative flexibility.
