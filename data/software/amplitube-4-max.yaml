description: Get maximum tone with over 300 pieces of gear for one low price.
  Take your guitar and bass playing to the max with ik multimedia's amplitube.
details: |-
  Amplitube 4 max by ik multimedia is a virtual effect audio plugin and a software application for macos and windows. It functions as a VST plugin, an audio units plugin, a VST 3 plugin, an AAX plugin and a standalone application.

  Amplitube max gives you your very own fully stocked tone studio complete with over 300 pieces of gear. It includes a virtual collection of meticulously rendered models of some of the most coveted gear on the planet. With it you get 80 amplifiers, 92 cabinets, 88 stompbox effects, 24 rack effects, 19 mics and 2 tuners that you can use to build your very own custom guitar and bass rigs.

  Industry-standard sound with dsm (dynamic saturation modeling) and vrm (volumetric response modeling) technologies for hyper-realistic emulation of real world gear and the best sounding models. Dynamic response modeling provides real amp response and feel models dynamic relationship and interaction between power amp and speakers, plus physical and harmonic interaction between individual speakers, cabinet and room construction and mics.

  Perfect as a plug-in for studio recording and mixing in any mac/win DAW, native compatibility with 64-bit applications and operating systems. Also perfect for live performance thanks to the standalone version with instant preset switching via MIDI control.

  8-track built-in multitrack recorder and DAW enables you to quickly capture ideas or even record a full 8-track composition in the standalone application without the need to open a DAW and with the convenience of amplitube superior quality audio processing. 4-track looper for capturing and layering ideas quickly and easily. Speedtrainer for speeding up/slowing down imported tracks without affecting the pitch the perfect tool for practising and improving your instrument skills or learning your favorite riffs and solos (standalone version).
