details: |-
  Ambisonics requires a decoder to convert to loudspeaker or headphone signals
  that carry the spatial information. The aXMonitor allows you to listen to your
  ambisonic signals over headphones via binaural 3d audio (hrtf technology). It
  also decodes first-order signals to stereo loudspeakers, allowing you to
  distribute your immersive audio content via more traditional formats.

  The axmonitor allows you to listen using three different formats: binaural
  (headphones only) decoding using the hrtfs generated from google's resonance
  audio used by google for youtube 360. Personalised binaural rendering is
  available by loading a .sofa file. Uhj super stereo advanced
  ambisonics-to-stereo decoder with occasional "outside the speakers" effect
  (fir and iir filter implementations). Cardioid stereo decoding points two
  cardioid microphones left and right to capture the signals and send them to
  the left/right speakers.

  The axmonitor accepts four channels of sn3d/acn (ambix) format ambisonics. It
  outputs two-channel binaural or stereo audio.

  The axmonitor is available with 3 levels of spatial resolution, with different
  maximum ambisonic orders: a1monitor - decodes first order ambisonics for
  reproduction of a sound field with standard resolution. A3monitor - decodes
  up-to third order ambisonics, giving advanced spatial resolution for higher
  accuracy sound fields. A7monitor - decodes up-to seventh-order ambisonics,
  giving the highest possible spatial resolution currently available in a DAW.

  Sampling frequencies: 44.1 khz, 48 khz, 88.2 khz, 96 khz, 192 khz.
