description: A precise channel strip plugin, with superb sound quality and four
  flexible formats. The authentic, unmistakable British mixing console
  character. Inspired by vintage British Class A hardware units.
details: |-
  The British Console Sound is famous. You can hear its sweet and musical quality on hit records spanning more than five decades from artists such as Queen, Nirvana, David Bowie, and the Red Hot Chili Peppers. When mix engineers need this unmistakable body, depth, and silky sweet top-end on individual tracks and busses, Softube's British Class A channel strip is the one to grab.

  Softube modeled Gate, Compressor, EQ, Filters, and Drive on some of the most sought-after and costly console modules in existence using its renowned emulation methodology. The result is the authentic tone and character of the classic British consoles with superb sound quality and four flexible formats: native plug-in, Console 1 channel strip, and Amp Room- and Modular modules.

  Featuring pristine replicas of expensive and highly sought-after console modules from the late '60s and early '70s, British Class A makes it easy to tune in the soulful character of the classic British consoles. The Low Shelf/Low Cut low-end technique couples with the satiny High Shelf and Drive/preamp to give that acclaimed tone that makes everything sound incredible.

  The EQ is essential to the classic British console sound, and the equalizer in British Class A is component-modeled to absolute perfection after one of the most highly sought-after EQs of its era. With stepped frequency controls, you can tweak the color of your sound and, no matter what you do, always come out with true British console character. The gate, modeled on a rare yet classic piece of transformer-based, class-A-designed British hardware, keeps tracks tight and clean, and its sidechain input makes it useful for ultra-musical keying purposes.

  Assignable compressors grace many of the classic consoles that comprise the British Console Sound. Softube emulated an early specimen that features a fat, round sound for British Class A's Compressor section, and uncoupled the hybrid compressor/limiter of the original hardware into separate Compressor and Limiter sections. Drive simulates running the console channel hot, with the saturation, distortion, and tone that occur when doing so, going from a darker sound with less distortion in the mid-range to bright and clear distortion in the highs.
specs: |-
  - The true color and character of the famous large-format British consoles of the '60s and '70s
  - A channel strip with carefully modeled Gate, Compressor, Filters, EQ, and Drive
  - Includes four multi-platform versions: British Class A plug-in, British Class A for Console 1, British Class A for Amp Room (4 Modules), and British Class A for Modular (4 Modules)
  - Featuring the famous 3-band equalizer with two silky smooth shelving filters and a peaking mid-band with high and low Q settings
  - Slightly resonant filters that bring a unique character, added edge, and work perfectly with the EQ to recreate the famous curves this gear is known for
  - Easily dial in the settings used to record and mix countless hit albums and songs
  - Softube-quality emulation and sound
  - Uncoupled Compressor and Limiter sections, unlike the hybrid compressor/limiter of the original hardware
  - Gate with sidechain input for musical keying
  - Stepped frequency controls on the equalizer
  - British Class A for Modular Compressor module has an extra input jack for patching
  - Also available as part of Flow Mixing Suite and Flow Complete Suite
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26
  - System requirements: Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access for downloading installers and managing licenses
  - Three activations
  - 20-day trial
  - 14-day returns
