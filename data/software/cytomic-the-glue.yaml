  Mix/Range/Sidechain High Pass knobs

  External sidechain support

  Peak clip functionality

  Advanced oversampling (x2, x4, x8)

  Diode envelope follower with dual diode configuration

  Stereo linking via soft maximum detection

  Soft -6 dB/Oct high pass filter for sidechain
