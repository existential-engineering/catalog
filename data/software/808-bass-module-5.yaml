details: |-
  Introducing the 808 Bass Module 5 an 808 bass rompler designed for both
  Windows and mac. Explore 400 crafted presets, ready to add depth and character
  to your tracks.

  Meet the new 808 bass module 5, the evolution of our popular VST instrument
  lineup. Experience fresh, powerful 808 basses alongside improved favorites
  from the previous version, giving you a wide range of options to choose from.

  The user-friendly interface features easy controls for adsr, lfo, filters, and
  more. New effect modules include distortion and chorus, each equipped with
  intuitive controls.

  Available in VST/vst3/AU plugin formats, perfect for windows and mac (64-bit)
  setups.
specs: |-
  - 808 bass rompler
  - 400 presets
  - ADSR envelope controls
  - LFO modulation controls
  - Lowpass/highpass filter cutoff
  - Glide time control
  - Global tune
  - Built-in chorus
  - Built-in distortion
  - Windows 8.1/10/11 compatible
  - Os x 10.14 and above compatible
  - 64-bit
  - 1 GB disk space
  - 1 GB RAM
  - Universal 2 binary
  - Not compatible with protools
