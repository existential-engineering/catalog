  - Latest version: 1.0.6
  - Apple Silicon support: native (except AAX)
  - System requirements (PC): Windows 7+
  - System requirements (Mac): OS X 10.7
  - RAM: at least 4 GB (recommended)
  - CPU: at least Intel DualCore i5 (recommended), M1
