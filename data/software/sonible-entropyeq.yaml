description: The new dimension of EQing simplifies the post-production of
  harmonic and noise components of audio recordings, freely adjustable and
  within seconds.
details: |-
  entropy:EQ+ simplifies the editing process for the impact noise of drums, guitars and other plucking instruments, and introduces you to a whole new world of postproduction creativity. It offers frequency-selective transient manipulation, letting you manipulate sound anatomy with surgical precision and improve the intelligibility of speech.

  Controlling the attack: by detecting different sound components of an audio track, entropy:EQ+ makes it possible to isolate single drums within a set or percussion group. In this way you can, for instance, refine the rim click or the solo on the toms. The sophisticated algorithm recognizes even the slightest attack sound. The plug-in equips you with the tools to manipulate select frequency ranges in isolation from each other.

  Articulation: from the original track of a TV report to the whispered finale to your new song, entropy:EQ+ takes care that every word stands out clearly and intelligibly in your mix. This is achieved by amplifying noisy consonant sounds, thus ensuring optimal intelligibility of speech. The plug-in assists you simply and easily by accentuating the inharmonic components of speech.

  Transient design: sometimes a recording thrives on the groove produced by the string instruments, whether the plectrum-sound of an electric guitar or the rhythmic plucking of a violin string. At other times the very same impact noises ruin the harmonic sound of a recording. In both cases, entropy:EQ+ equips you with a comfortable solution by allowing you to tone down or amp up the rhythmic attack.
specs: |-
  - Frequency-selective transient and tonal balance control
  - Frequency dependent modifications
  - blind:flug mode to focus on your ears
  - Fully adaptable algorithm
