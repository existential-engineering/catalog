description: entropy:EQ+ is an equalizer plug-in that separates the tonal and
  the noisy components of a signal, so transients and harmonic content can be
  shaped independently across the frequency spectrum. It simplifies
  post-production of harmonic and noise components in a recording within
  seconds.
details: |-
  Conventional equalizers treat a frequency band as a single quantity, so lifting the attack of a snare also lifts its body. entropy:EQ+ detects the different sound components of an audio track and lets the balance between transients and harmony be set per frequency range, which makes it possible to isolate a single drum inside a kit or a percussion group and refine a rim click or a tom fill on its own. The algorithm is described as picking up even the slightest attack sound.

  On speech the same separation is used to accentuate the inharmonic parts of a voice. Amplifying noisy consonants brings words forward in a mix, which helps with an original TV report track as much as with a whispered vocal line, and the plug-in keeps the controls simple rather than asking for a chain of processors.

  For plucked and strummed instruments the impact noise can be toned down or amped up. A plectrum sound on an electric guitar or the rhythmic pluck of a violin string can carry the groove of a recording or work against its harmonic character, and the same control covers both cases.

  The interface offers frequency dependent modifications with a fully adaptable algorithm, plus a blind:flug mode that hides the visual display so decisions are made by ear.
specs: |-
  - Frequency-selective manipulation of the transient versus tonal balance
  - Isolates single drums within a kit or percussion group
  - Accentuates inharmonic consonant content for speech intelligibility
  - Tones down or amplifies the impact noise of plucked and strummed instruments
  - blind:flug mode for decisions made by ear
  - Fully adaptable algorithm
  - Plug-in formats (Mac): AU, VST2 (Universal Binary), AAX
  - Plug-in formats (Windows): VST2 (32/64 bit), VST3, AAX
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok
  - Apple Silicon support: native (except AAX)
  - Windows: Windows 7 or later
  - Mac: OS X 10.7
  - RAM: at least 4 GB recommended
  - CPU: at least Intel DualCore i5 recommended, M1
