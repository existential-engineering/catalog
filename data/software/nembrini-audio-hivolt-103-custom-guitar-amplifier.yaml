  available by Rock 'n' Vintage musical instruments."
details: |-
  Hivolt 103 Custom Guitar Amplifier plugin is based on a vintage Hiwatt* DR103 year 1970 with original Partridge transformer and military point-to-point wiring, made available by Rock 'n' Vintage musical instruments. Hivolt 103 Custom Guitar Amplifier plugin is a 2 channels amplifier with shared EQ for both channels. It has 4 inputs, 2 for each channel (normal and brilliant). Hi inputs are DOWN and LO inputs are UP. Patching of channels works here, and you can blend for additional versatility. Normal and Brilliant channels with independent High and Low inputs for each channel. Versatile and intuitive, perfect for bringing life out of dark pickups or taming shrill high end in bright pickups.
specs: |-
