details: |-
  Hivolt 103 Custom Guitar Amplifier plugin is based on a vintage Hiwatt DR103 year 1970 with original Partridge transformer and military point-to-point wiring, made available by Rock 'n' Vintage musical instruments.

  Hivolt 103 Custom Guitar Amplifier plugin is a 2 channels amplifier with shared EQ for both channels. It has 4 inputs, 2 for each channel (normal and brilliant). Hi inputs are DOWN and LO inputs are UP. Patching of channels works here, and you can blend for additional versatility.

  Normal and Brilliant channels with independent High and Low inputs for each channel. Versatile and intuitive, perfect for bringing life out of dark pickups or taming shrill high end in bright pickups. Link the two channels for extra punch and dynamic control of your EQ via the independent channel volumes.

  With Hivolt 103 Custom Guitar Amplifier it is possible to choose between six different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs. A complete Mixer section with Solos, Mutes, Pans and Faders allows you to blend together the two microphones with the ambience.

  Impulse Loader lets you load up to three third-party impulse responses that you can even blend together using volume, pan, phase, solo and mute controls. A useful browser window has been added so you can easily search through all your third-party IR files.
specs: |-
  - Two channel amplifier with shared EQ for both channels
  - Four inputs, two per channel (Normal and Brilliant), Hi inputs down and Lo inputs up
  - Channel patching and blending, with independent channel volumes
  - Cabinets: six different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs
  - Mixer section with Solos, Mutes, Pans and Faders to blend the two microphones with the ambience
  - Impulse Response Loader: up to three third-party impulse responses blendable with volume, pan, phase, solo and mute controls, with a browser window for searching IR files
  - Cleaner/Noise Gate: noise gate section plus a Cleaner circuit to reduce rumbling and harshness
  - Plugin Formats: a VST2, VST3, AAX or AudioUnits compatible host
  - System: an Intel compatible or Apple Silicon CPU, 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
