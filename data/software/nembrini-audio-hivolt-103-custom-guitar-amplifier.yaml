details: |-
  Hivolt 103 Custom Guitar Amplifier is modeled after a vintage 1970 Hiwatt DR103 featuring original Partridge transformer and military point-to-point wiring. It is a 2-channel amplifier with shared EQ offering 4 inputs total — 2 for each channel (Normal and Brilliant). Hi inputs are DOWN and LO inputs are UP. Channels can be linked together for enhanced punch and dynamic EQ control.

  The plugin includes six different guitar cabinet options with four microphone emulations featuring on/off-axis position switching. This allows for a wide range of tonal possibilities from bright and cutting to warm and rounded sounds, all within the plugin itself.

  An Impulse Response Loader lets you load up to three third-party impulse responses that can be blended together, giving players access to their favorite IR libraries alongside the built-in cabinet simulations.

  A Noise Gate section plus a Cleaner circuit is included to reduce rumbling and harshness, helping to maintain a clean and professional signal. A full Mixer section with solo, mute, pan, and fader controls rounds out the feature set.

  The plugin is also available as an iOS app for iPhone and iPad, bringing the full Hivolt 103 experience to mobile devices for practice and recording on the go.
specs: |-
  - 2-channel amplifier with shared EQ (modeled after Hiwatt DR103 1970)
  - 4 inputs total: Normal and Brilliant channels with independent High and Low inputs
  - 6 built-in guitar cabinet options
  - 4 microphone emulations with on/off-axis position switch
  - Impulse Response Loader: up to 3 third-party IRs with blending
  - Noise Gate and Cleaner circuit
  - Mixer section: solo, mute, pan, fader controls
  - Formats: VST2, VST3, AAX, AudioUnits (64-bit DAW required)
  - macOS 10.13 or newer (Intel or Apple Silicon)
  - Windows 7 or newer (64-bit)
  - iOS (iPhone/iPad via Apple App Store)
  - 1 GB RAM minimum
