description: Transparently reshape dynamics, tone, and transients in ways you
  never have before. Sculpt can push and pull sound in all directions using four
  parallel processors.
details: |-
  Designed for master and group buses, SCULPT lets you thoroughly and cleanly
  reshape your sounds in ways that other processors simply can't. Use it to add
  refining touches to masters and mix buses, or to enhance specific elements
  inside of samples, stems and instrument groups.

  Sculpt is built on top of four dynamic modules that run in parallel. The
  Upward Compression module offers an uncommon spin on dynamic control with
  greater transparency, while a high-quality Downwards Compression offers more
  conventional dynamic control. The one-of-a-kind Tone Sculpt module accentuates
  or suppresses specific aspects of your audio, while the Transient Sculpt
  module manipulates the onset of each sound for precise control over its sonic
  envelope.

  SCULPT uses a state-of-the-art Envelope Detection Algorithm which mirrors the
  way humans perceive loudness and frequency, producing a more natural and
  responsive sound than conventional compressor technology. Unlike conventional
  compressors, it will never produce harmonic distortion, even when processing
  complex material using super-fast attack and release settings.

  Advanced Adaptive Auto Gain (AAAG) analyzes incoming audio and accurately
  applies makeup gain as you adjust every parameter, allowing you to truly hear
  the difference and compare presets with confidence. The presets also adapt
  themselves based on the dynamics of your incoming audio signal.
specs: |-
  - Four parallel processing modules: Upward Compression, Downward Compression, Tone Sculpt, Transient Sculpt
  - State-of-the-art Envelope Detection Algorithm (EDA)
  - Distortion-free processing even with super-fast attack and release
  - Advanced Adaptive Auto Gain (AAAG)
  - Side-chain EQ controls per module
  - Per-module mute, solo and output metering
  - Tonal balance graph display
  - Adaptive presets that respond to incoming audio dynamics
  - Designed for master bus, group buses, stems and instrument groups
