details: |-
  A plugin rack and set of plugins from apogee that operate in native and
  hardware dsp modes. It implements dualpath linking of fx racks, synching
  apogee control 3.0s dsp fx rack in the low latency mixers to a daws native
  apogee fx rack.

  5 plugins available: modeq, modcomp, eqp-1a, meq-5, and opto 3a.

  System requirements: mac os x 10.12.6 or higher, os x 10.15.1 catalina
  supported. 4 gb minimum ram, 8 gb or higher recommended. Pace ilok account -
  physical ilok not required.

  Officially supported daws: logic pro 10, pro tools 12, ultimate (pro tools 11
  and lower not currently supported), ableton live 10, cubase 10 VST 2. Any
  auv2, VST 2&3, or AAX fully compliant DAW should work.
