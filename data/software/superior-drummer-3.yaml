details: |-
  Superior Drummer 3 is Toontrack's flagship drum production platform,
  providing deeply multi-sampled acoustic drum kits with an integrated
  mixing environment. The core library was recorded at Galaxy Studios in
  Belgium by George Massenburg, capturing each drum from multiple
  microphone positions with extensive velocity layers and round-robin
  variations.

  The built-in mixer provides per-instrument channel strips with
  insert effects, sends, and bus routing. Each microphone position
  (close, overhead, room, ambient) has its own mixer channel, allowing
  full control over the drum sound from intimate close-mic'd to
  expansive room ambience.

  The Tracker feature can convert audio drum recordings into MIDI,
  enabling replacement or augmentation of recorded drum performances
  with Superior Drummer's samples. The Grid Editor provides detailed
  MIDI editing with humanize, velocity, and timing tools.

  An extensive MIDI library ships with the core product, providing
  professionally performed drum patterns across genres. The Tap2Find
  feature allows finding grooves by tapping a rhythm.

  The SDX expansion system provides additional drum kits, each
  recorded in different studios and acoustic environments. EZX
  expansions (from EZdrummer) are also compatible, expanding the
  available sound palette.

  The e-drum module routes signals from electronic drum kits through
  Superior Drummer's processing, providing studio-quality sounds for
  live performance and practice.
specs: |-
  - Deeply multi-sampled acoustic drum kits
  - Recorded at Galaxy Studios by George Massenburg
  - Multiple microphone positions per instrument
  - Extensive velocity layers and round-robin
  - Built-in mixer with per-channel effects
  - Insert effects, sends, and bus routing
  - Audio-to-MIDI Tracker
  - Grid Editor for MIDI editing
  - MIDI library with professional grooves
  - Tap2Find groove search
  - SDX and EZX expansion support
  - E-drum module for electronic drum kits
  - 230+ GB core library
  - Operates standalone or as plugin (VST3, AU, AAX)
  - macOS and Windows
