description: A modular standalone and plugin platform for crafting, routing, and performing professional guitar and bass tones. It gives access to a collection of integrated modules that can be combined with your Nembrini Audio plugins in a unified, flexible environment.
details: |-
  Tone Craft is a modular standalone and plugin platform for crafting, routing, and performing professional guitar and bass tones. It gives access to a collection of integrated modules that can be combined with Nembrini Audio plugins in a unified, flexible environment, and is a modular host rather than a bundle: paid amps and effects are sold separately, while plugins already owned can be loaded at no extra cost.

  Routing is unrestricted. Parallel, multi-band or dual-amp setups can be designed with complete routing freedom, and simple or complex signal chains can be built with splitters, mixers, crossovers and auxiliary paths.

  Tone Craft runs inside a DAW or as a standalone application, suiting studio production, rehearsal or live guitar rigs. Up to 8 fully independent scenes can be stored per preset and switched instantly via MIDI Program Change, for live performance and dynamic studio workflows. The parameters of all loaded modules are fully automatable within the DAW and can be adjusted from a MIDI control surface.

  The free NAM Loader module loads and plays Neural Amp Modeler .nam models with architecture A2 directly inside Tone Craft, making it possible to combine captured amps and pedals with Nembrini Audio plugins, built-in modules and advanced routing.

  A free version is available to download that includes basic features and a selection of built-in modules, along with the standalone app and plugin versions and the NAM Loader. Advanced features, namely parallel routing, dual amp and multi-chain setups, Scenes, MIDI Program Change support and centralized parameter automation, require a Tone Craft license. The licence does not include paid Nembrini Audio plugins, which must be purchased separately.
specs: |-
  - Modular standalone and plugin platform for guitar and bass tones
  - Modular host for Nembrini Audio plugins, which load at no extra cost if already owned
  - Parallel, multi-band and dual-amp setups with complete routing freedom
  - Signal chains built from splitters, mixers, crossovers and auxiliary paths
  - Runs inside a DAW or as a standalone application
  - Up to 8 fully independent scenes per preset, switchable via MIDI Program Change
  - All loaded module parameters automatable in the DAW and controllable from a MIDI control surface
  - Free NAM Loader module plays Neural Amp Modeler .nam models with architecture A2
  - Built-in stomp modules and built-in effect modules
  - Free version includes standalone app and plugin, built-in free modules and NAM Loader
  - Tone Craft License adds parallel routing, dual amp and multi-chain setups, Scenes, MIDI Program Change support and centralized parameter automation
  - Paid Nembrini Audio amps and effects sold separately, not included with the licence
  - Plugin formats: VST2, VST3, AAX or AudioUnits compatible host
  - Intel compatible or Apple Silicon CPU
  - 1GB RAM
  - Mac OS 10.13 or newer
  - Windows 7 or newer
  - 64-bit DAW required
