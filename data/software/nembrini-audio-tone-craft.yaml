description: A modular standalone and plugin platform for crafting, routing, and performing professional guitar and bass tones. Users can combine integrated modules with existing Nembrini Audio plugins in a unified signal-chain environment.
details:
  - Tone Craft Modular Studio is a comprehensive modular signal chain platform designed for guitar and bass players who want full control over their tone in both studio and live performance contexts. The platform allows users to build complex signal paths using a library of integrated modules alongside their existing Nembrini Audio plugin collection.
  - The platform features parallel routing with dual amp and multi-chain setups, enabling players to blend different amp characters or run separate signal paths simultaneously. Built-in splitters, mixers, crossovers, and auxiliary paths provide the flexibility needed to construct sophisticated pedalboard and rack-style rigs entirely in software.
  - A standout feature is the scene system, which supports up to 8 fully independent scenes per preset. Combined with MIDI Program Change support, this makes Tone Craft a capable live performance tool, allowing instant switching between completely different signal chain configurations during a set.
  - Centralized parameter automation lets users control parameters across all loaded modules from a single interface, streamlining workflow in DAW environments. A built-in NAM Loader provides native support for Neural Amp Modeler .nam files, extending compatibility with the growing library of community-created neural amp captures.
  - Tone Craft is available in a free tier that includes standalone and plugin access with basic modules, while the paid license ($29.99) unlocks the full feature set including parallel routing, the scenes system, and automation capabilities. A Complete Access subscription at $12.99/month provides access to all Nembrini Audio products.
