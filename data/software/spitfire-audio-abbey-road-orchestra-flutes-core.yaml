details: |-
  The stunning sound of a world-class Flutes a2 section - captured at Abbey Road Studios. This virtual instrument offers key articulations and playing styles: lyrical and performance legatos, a wide selection of longs and shorts, and control over a variety of articulations allowing you to create both intimate and epic soundscapes.

  Recorded in the timeless acoustics of Abbey Road Studio One, this library includes a hand-crafted mix signal by GRAMMY award winner Simon Rhodes.

  Realism at the highest degree.

  For the ultimate virtual orchestra, combine Flutes with the rest of the Abbey Road Orchestra range.

  Are you after the pinnacle in expression for your compositions? Want extended articulations and complete sonic control with custom mic mixes? Check out Professional .
