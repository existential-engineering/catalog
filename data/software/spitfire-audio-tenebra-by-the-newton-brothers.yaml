details: |-
  Step into the shadows with Tenebra, the definitive toolkit from The Newton Brothers – the composer duo behind today's most gripping films and TV series. For composers seeking to craft truly disturbing atmospheres and producers wanting to inject psychological terror into their tracks, this library contains a complete palette for creating everything from slow-burn, burgeoning dread to jump scares, while also providing the subtle emotion and glimmers of hope that define their sound.

  Heard across their acclaimed work on projects like Doctor Sleep, The Haunting of Hill House, Midnight Mass, and X-Men '97, these are the building blocks that combine to add tension and suspense to any scene. A curated collection of over 100 sounds, crafted with modular synths, orchestras, field recordings and unique instruments played with experimental techniques. Hosted in the powerful Solar engine, Tenebra gives you the sonic signature of suspense, designed for instant inspiration and endless creative manipulation.
specs: |-
  - 182 unique sounds
  - More than 100 sounds across Bells & Glass, Drones, Guitar Dulcimer Citole, Humanity, Orchestral, Percussion, Synths, Woodwinds and Warps
  - Over 130 presets
  - Analogue and modular samples
  - Hosted in the Solar engine, which appears in the DAW as the Solar plugin
  - Morph between any two library sounds, gate sequencer, onboard effects and modulation
  - 11.35 GB file size
  - macOS 11 to 26, Intel and Apple Silicon, 8 GB RAM minimum (16 GB recommended)
  - Windows 10 or 11 (64-bit), 8 GB RAM minimum (16 GB recommended)
  - 32-bit systems are not supported
  - Spitfire Audio App required
