description: >-
  Drum production software tailored for songwriters, featuring 7 drum kits
  recorded at Hansa Studios Berlin, a grid editor, step sequencer, AI groove
  suggestion (Bandmate), Tap2Find rhythm matching, and Song Creator
  functionality.
details: |-
  EZdrummer 3 features seven drum kits recorded at Hansa Studios Berlin
  by Grammy Award-winning engineer Michael Ilbert. The sound library
  includes approximately 15 GB of drum, cymbal, and percussion content
  captured across three distinct room ambiences: Main Room, Bright Room,
  and Tight Room.

  The kits span a wide range of styles: Studio Kit, Singer-Songwriter
  Kit, Modern Rock Kit, Vintage Rock Kit, Tight & Punchy Kit, Classic
  Pop Kit, and Hip-Hop/R&B Kit. The instrument collection includes 14
  kicks, 24 snares, 30 toms, 6 hi-hats, 6 rides, 16 crashes, 3
  splashes, 2 chinas, and a clap stack, along with an extensive
  percussion selection.

  The MIDI library contains over 2,500 individually played grooves and
  fills across multiple time signatures (3/4, 4/4, 6/8, 12/8, 7/8) and
  feels (straight, swing, shuffle, halftime). Genre coverage spans pop,
  rock, soul, Latin, funk, metal, hip-hop, Afrobeat, EDM, and R&B.

  Key creative tools include Bandmate for AI-powered groove suggestions,
  Tap2Find for rhythm matching by tapping, a grid editor, step
  sequencer, and Song Creator for building complete drum arrangements.
  Mix-ready presets are provided for multiple styles.

  EZdrummer 3 also supports electronic drum kit integration with preset
  mapping, velocity response customization, direct recording, and
  flexible hi-hat control options.
specs: |-
  - 7 drum kits recorded at Hansa Studios Berlin by Michael Ilbert
  - 3 room ambiences: Main Room, Bright Room, Tight Room
  - ~15 GB of drum, cymbal, and percussion content
  - 2,500+ individually played MIDI grooves and fills
  - 14 kicks, 24 snares, 30 toms, 6 hi-hats, 6 rides, 16 crashes
  - Multiple time signatures: 3/4, 4/4, 6/8, 12/8, 7/8
  - Grid editor, step sequencer, Bandmate AI, Tap2Find, Song Creator
  - E-kit integration with preset mapping and velocity customization
  - Mix-ready presets for multiple styles
  - 18 GB disk space required (plus 18 GB for download)
  - Windows: 64-bit Windows 10 or newer, 4 GB RAM (8+ GB recommended)
  - macOS: 10.13 or higher, Intel or Apple Silicon, 4 GB RAM (8+ GB recommended)
