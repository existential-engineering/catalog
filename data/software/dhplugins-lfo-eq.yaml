description: From slow sweeps to fizzing chops the LFO-EQ will shape your audio
  like no other EQ. From pads & strings to synths, drums, vocals.. It works on
  everything.
details: |-
  LFO-EQ is a 5 band EQ unit. The ability to modulate any of the EQ parameters including Frequency, Gain, Q Factor and even Band Mix with either of the two onboard LFOs, or the Envelope Follower, allows for sound shaping possibilities from an EQ plug-in. With multiple controls over the LFO and Envelope, LFO-EQ affords users flexibility, and with a library of presets to choose from it is simple to inject movement into your audio.

  Featuring over 450 presets, neatly organised into beats, bars, envelopes and instruments, you can find modulations to add subtle, extreme, and phasey movements to your audio. From 4-To-The-Floor to 8 Bar (or longer) sweeps, rhythmic syncopated chops to glitchy randomness.

  An easy to use LFO Shape designer allows users to create modulations as complex or as simple as they desire. With a library of over 70 LFO Shape presets ready to load, users can find shapes and modulations. The LFO Shape preset manager allows you to save and load your own custom shapes to use wherever you need them. The LFOs can either be synced to your DAW or run free, with the added ability to modulate the rate of one LFO by the other, invert and smooth the modulation signal.

  With 2 types of distortion, a chorus, a delay and a reverb, all with Lo and Hi cuts available, LFO-EQ offers the ability to add new levels to the LFO designs and new sonic palettes going into the EQ bands themselves. The FX preset bank contains over 45 FX presets which show the range of capabilities of LFO-EQ.

  The onboard LFOs are not the only modulation source for the EQ. The Envelope Follower reacts to the audio input level and modulates the EQ parameters accordingly. With a Gain control to boost or attenuate the signal and a compressor to smooth out the dynamic range, as well as an Attack and Release control, you have control over the Envelope Input. With a bank of Envelope Presets you can add character and movement to your audio source, whether it be staccato chords, vocals or pads.

  On top of the 5 bands of EQ, the All-Pass filter mode adds further sound design potential, creating sweeping phaser-like modulations and futuristic soundscapes.
specs: |-
  - 5 band EQ with modulation of Frequency, Gain, Q Factor and Band Mix
  - Two onboard LFOs, syncable to the DAW or free-running
  - One LFO can modulate the rate of the other, with invert and smooth controls
  - Envelope Follower with Gain, compressor, Attack and Release controls
  - All-Pass filter mode for phaser-like modulations
  - LFO Shape Designer with over 70 LFO Shape presets, plus save and load of custom shapes
  - Over 450 presets organised into beats, bars, envelopes and instruments
  - FX suite with 2 distortion types, chorus, delay and reverb, each with Lo and Hi cuts
  - Over 45 FX presets
  - AU / VST3 / AAX, 64-bit
  - 1GB RAM, 1GB hard disk space
  - Windows 7 or later, macOS 10.8 or later, M1/M2 ready
  - 3 license activations per purchase
