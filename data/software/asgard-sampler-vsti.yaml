name: Asgard Sampler VSTi
manufacturer: frostwave
primaryCategory: sampler
url: https://frostwaveaudio.com/
description: Asgard vsti is a sampler and virtual viking instrument by danheim.
details: |-
  Authentic excavated antique viking objects were recorded and sampled for
  asgard. This is the first time since c.850-1050 ad, that these amazing objects
  will be heard again, and now come to life through sound and music.

  List of instruments and banks included: drums of the north (viking drum
  samples), deer antlers (percussion), digitally modified ancient drums
  (powerful viking drum samples), nordic rattles and percussion instruments,
  real human bones, raven bones, various dark drones and pads, cow horns, lur
  and more (gallehus, revheim, neverlur), dark deep bass & chants (created by
  voice), ambient nature soundscapes, various fx, flutes & pipes (falster pibe,
  red deer).

  Authentic & antique viking objects sound-recorded for percussion and fx
  include: viking beads c.850-1050 ad, viking shield stud 8th-10th century,
  viking pouch knife -norway 9th-11th century, very rare viking ringjern
  850-1050 ad (iron ring which is thought to represent an enemy and ritually
  destroyed by breaking with stones or a being a ring of honor), viking
  horseshoe 8th-11th century, restored viking amulets & bells c.950-1150 ad.

  Asgard also includes most standard controls, a simple reverb, high pass/low
  pass filter, pitch bend knob, and overdrive. Available for windows as VST 2/3
  (mac version currently not available). Release date: 2019. Version: 2.1.
  Approx filesize: 1 gb.
specs: |-
  - VST 2/3 plugin
  - 64-bit VST
  - Sampler
  - High pass/low pass filter
  - Pitch bend knob
  - Reverb
  - Overdrive/distortion
  - LFO
  - Voice mode
  - ADSR
  - Left/right channel volume meter
