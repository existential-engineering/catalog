description: FabFilter Pro-DS is an intelligent and transparent de-esser
  plug-in. Available in VST, VST3, AU, CLAP, AAX and AudioSuite formats for
  Windows and macOS.
details: |-
  Even when using the best mics, pre-amps and converters, sibilance in vocal recordings can easily get over-accentuated during post-processing like compression or saturation. FabFilter Pro-DS comes to the rescue with its highly intelligent detection algorithms.

  With its highly intelligent Single Vocal detection algorithm, FabFilter Pro-DS accurately identifies sibilance in vocal recordings and attenuates it transparently. When using the Allround mode, Pro-DS becomes a great tool for high-frequency limiting of any material, like drums or even full mixes.

  FabFilter Pro-DS offers everything you need to get the best result possible, presented in a simple and easy-to-use interface. It features Wide Band or linear-phase Split Band processing, optional look-ahead time up to 15 ms, and up to four times linear-phase oversampling.

  The plug-in includes freely adjustable stereo linking with optional mid-only or side-only processing, a real-time de-essing display, and a side-chain input meter with real-time spectrum analyzer.
specs: |-
  - Highly intelligent Single Vocal detection and classic Allround detection
  - Real-time de-essing display
  - Adjustable Threshold, Range and detection HP and LP filtering
  - Transparent program-dependent compression/limiting
  - Wide Band or linear-phase Split Band processing
  - Optional look-ahead time up to 15 ms
  - Freely adjustable stereo linking
  - Optional mid-only or side-only processing
  - Up to four times linear-phase oversampling
  - Side-chain input meter
  - Real-time spectrum analyzer
  - GPU-powered graphics acceleration
  - High-quality 64-bit internal processing
  - MIDI Learn
  - Undo/redo and A/B comparison
  - Sample-accurate automation of all parameters
