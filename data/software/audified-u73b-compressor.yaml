details: |-
  Faithful and unique emulation of an old german broadcast compressor/limiter
  unit u73b. U73b was often used for mastering in european studios between 1960
  and 1980. It is an all-tube vary-mu compressor/limiter with an adjustable
  release time option.

  Audified kept the circuit exactly as it was originally designed and only added
  an input and output gain before and right after the compressor circuit to help
  with proper adjusting of the compression. The plugin effect has been also
  supplemented with a vu meter and selectable side-chaining.

  U73b is great for mastering, mixing drums, bass, guitar, vocals, and
  voiceovers. The compressor's controls are very easy, but the effect of this
  unique device is audible at the same moment you turn it on.

  The upper u73b knob switches between compressor mode (kompr), bypass
  (durchshalt) and limiter mode (begr). The compressor mode has a lower
  threshold setting and a very gentle increasing ratio, in the opposite, the
  limiter mode provides a higher threshold setting with a higher ratio but still
  with the smooth knee.

  Release time offers the first three positions with fixed release time, and the
  other three positions marked with three red labels provide adjustable program
  content-dependent release time options. In adjusts input gain before the
  compressor/limiter circuit. Out adjusts output gain after the
  compressor/limiter circuit. Sidechain selects the signal source used for
  controlling the gain reduction.
specs: |-
  - All-tube vary-mu compressor/limiter
  - Adjustable release time
  - Vu meter
  - Selectable side-chaining
  - Compressor/limiter switch
  - Input gain control
  - Output gain control
  - Program content-dependent release time options
  - Smooth knee
  - Universal 2 binary
