details: >-
  Acoustic mallets features two percussion instruments vibraphone and
  glockenspiel. Each instrument is given its own controls with volume, attack,
  pitch, release and reverb. It also includes tremolo and vibrato as presets.


  Acoustic mallets is pc & mac compatible and is available both in 32-bit &
  64-bit VST and audio units formats.


  Acoustic mallets: vibraphone & glockenspiel by auditory lab is a virtual
  instrument audio plugin for macos and windows. It functions as a VST plugin,
  an audio units plugin and a VST 3 plugin.
