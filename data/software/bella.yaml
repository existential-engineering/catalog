description: Bella is a bells and mallets-oriented instrument that uses a
  chord-driven step sequencer to create a vast of instrumental phrases.
details: |-
  At its core, bella is a synth that uses 8 bells and mallets models together
  with traditional synthesis features. This includes a lo-hi filter and an
  optional portamento effect.

  It's also equipped with 3 effects: wah wah, space-based reverb, and delay. But
  the real fun maker here is the programmable step sequencer.

  It can follow any kind of played chord and create complex arpeggios, while
  synced (or not synced) to the DAW's tempo and time signature. The "sync time"
  button, when turned on, can adopt the DAW's time signature, while the bpm
  syncing button adopts the DAW's bpm.

  The programmable sequences can be saved to an independent file and loaded
  anytime in any preset. Overall, bella focuses on simplifying the programming
  process and creating new musical events with ease.
specs: |-
  - 8 bells and mallets models
  - Lo-hi filter
  - Portamento effect
  - Wah wah effect
  - Space-based reverb
  - Delay effect
  - Chord-driven step sequencer
  - Programmable step sequencer
  - DAW tempo sync
  - DAW time signature sync
  - Arpeggio generation
  - Windows compatible
