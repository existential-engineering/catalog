details: |-
  The pursuit of creating a device that brings the richness and dynamics of a cranked amplifier at lower volumes led to the emergence of a new type of overdrive. This fabled pedal became a staple in countless musicians' arsenals and has since been dubbed the "holy grail". Utilizing our component level modeling technology, we were able to bring the legendary overdrive sound to a new age. Introducing, MixWave: Centurion .
