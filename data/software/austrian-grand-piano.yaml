details: >-
  Adam monroe's austrian grand is a grand piano sample library for VST/AU/AAX
  and kontakt. This library was created by sampling a 100 year old bruder mikula
  wien grand piano through a stereo-pair of aea r84 ribbon microphones.


  It exists to fill the gap between bright and mellow piano libraries. The
  plugin features 10 velocity layers, 2 note round-robin, and over 4 gigs of
  sampled data. Reverb can be incrementally added, and frequency cuts can be
  triggered via toggle switches to assist the user in shaping the instrument's
  tone.


  The piano has a semi-bright, yet warm, aged-tone. Subtle key noise was left in
  to add to the realism of the library.


  The VST version features multi-threaded double buffering and fast c-style
  arrays and performs well, even on older computers and in lower latencies.
  Supports 44.1, 48, 88.2, and 96 khz sample rates through cubic interpolation.
