description: KStrip is a channel strip plugin combining three classic
  large-format console circuit models for preamp, EQ, and compression modules,
  allowing mix-and-match tonal combinations per track.
details: |-
  KStrip takes 3 of the world's most popular large-format consoles and fuses them together to let you create the ultimate channel strip. KStrip gives you the ability to choose between the 3 distinct circuits for each of the individual modules (Comp, EQ, Saturation), for the ultimate flexibility across your entire mix. 3 World-Famous Channel Strips - In One Plugin. Meet KStrip - Your Mixes New Bestfriend. Ever wanted to have every sonic option available to you in one place? Now you don't have to wish. With K-Strip you can easily build out your dream channel strip for each track of your mix - no more stacking plugins to get results. No matter the instrument you're tasked with mixing, you'll soon find yourself reaching for it every time you open your mixer. Preamp Color/Harmonics

  A: Punchy, forward-mids and subtle grit - perfect for drums and guitars that need some extra attitude. N: Warm and rich tones with a world-renowned analog color, ideal for vocals and low-end focused instruments! S: Clean, detailed, and transparent (until you want more) —excellent for acoustic instruments, or getting aggression in a rock mix, a true work-horse preamp. Equalizer

  A: Punchy, musical EQ that adds energy with bold, yet natural boosts. Ideal for giving drums or guitars more presence and thump without harshness. N: Smooth, musical EQ with broad curves that naturally sweeten any source. Perfect for gently shaping vocals, piano, or bass with rich lows and silky highs. S: Aggressive, precise EQ capable of surgical cuts and bold boosts for extreme moves. Great for giving drums more attack or dialing out mud from any source. Dynamics

  A: Fast, punchy compressor that adds snap and keeps the energy high. Great for adding smack to drums or guitars, thanks to a quick response that keeps transients snappy and in-your-face. N: Smooth, vintage-style compressor that glues tracks together with rich, musical compression. Perfect for leveling vocals or bass with a gentle touch, while adding weight and cohesion without the pumping. S: Tight, transparent compressor that adds punch without muddying the source. Ideal for controlling peaks on everything from drums to the group tracks, providing glue and shine with minimal coloration. Legal Disclaimer:

  The A, N, and S modules ("Kiive Audio Modules") were developed by Kiive Audio using their own modeling techniques, studying and being inspired by original hardware products from API, Neve (now AMS Neve Limited), and Solid State Logic (collectively, "Third-Party-Brands"). Neither of these Third-Party-Brands have licensed any intellectual property for use in the Kiive Audio Modules, nor have they endorsed or supported the Kiive Audio Modules in any manner.
