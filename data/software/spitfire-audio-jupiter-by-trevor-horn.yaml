details: |-
  Created with innovative production tools designed by pop pioneer Trevor Horn. A comprehensive collection of characteristic and crafted drums, basses, synths, piano and FX, capturing the production style and otherworldly sonic elements associated with the pop innovator's work.

  From warm analogue textures to futuristic digital sounds this is the best library for synth-wave, electro-pop and, for emulating the distinctive treatments and harmonies found in Trevor Horn productions with Grace Jones, Seal and Yes amongst others.
specs: |-
  - 300 presets
  - 1001 unique sounds
  - Housed in the Solar plugin, powered by the eDNA interface
  - Five sections: Synths, FX, Drums, Bass, Piano
  - Bosendorfer grand piano recorded in Trevor Horn's studio
  - Five warps: Core, Reflect, Alias, Calibrate, Dimension
  - 45.59 GB download size
  - macOS 11 to OS 26, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
  - Minimum 8GB RAM, 16GB recommended
  - Spitfire Audio App required
