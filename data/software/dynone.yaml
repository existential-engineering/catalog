description: The ultimate smart parallel multi-band dynamics processor. DynOne
  was designed from the ground up to put 5 bands of quality parallel compression
  at your fingertips.
details: |-
  DynOne is a parallel multi-band dynamics processor built with a quality-first approach. It uses best-in-class FIR filtering across 5 bands to deliver transparent parallel compression without aliasing, phase issues, or distortion between bands. The plugin is designed for both mixing and mastering workflows.

  The processor features intelligent adaptive attack and release controls with adjustable minimum and maximum settings, allowing it to optimize dynamics for both transients and sustained sounds. Variable RMS vs. peak detection modes provide comprehensive control for different musical material.

  DynOne includes a unique Center-Side mode for stereo field processing, along with adjustable stereo link control and a proprietary weighting algorithm for specialized dynamic shaping. Real-time metering and visualization provide visual feedback during processing.

  DynOne is endorsed by Grammy-winning engineers and producers including Bob Katz, Bob Ludwig, Greg Wells, and Joe Chiccarelli, who praise its transparency, musicality, and parameter control for mastering and mixing applications.
specs: |-
  - 5-band parallel compression with FIR filtering
  - Variable RMS vs. peak detection modes
  - Intelligent adaptive attack/release with adjustable min/max values
  - Stereo link control with proprietary weighting algorithm
  - Center-Side mode for stereo field processing
  - Real-time gain reduction metering and visualization
  - Low latency crossover filters
  - K-weighted loudness metering
  - AB comparison and undo/redo
  - Preset management system
  - Apple Silicon (M1) native support
  - macOS 10.13+ and Windows 8/10 (64-bit only)
