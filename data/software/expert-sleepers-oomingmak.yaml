description: Oomingmak turns a guitar into an analogue monosynth. It is a pitch-
  and envelope-tracking resynthesis plug-in that follows the pitch and level of
  the incoming audio and uses them to drive synthesis and modulation.
details: |-
  Oomingmak is a pitch- and envelope-tracking resynthesis effect. It tracks the pitch and the level of the incoming audio and uses both as the basis for what it generates.

  The tracked signal can be used to synthesize an entirely original sound, using classic analogue-style waveforms and subtractive synthesis, or to apply pitch modulation to the incoming audio while syncing to the original waveform. The latter is the classic oscillator sync effect, with the incoming audio standing in for the oscillator.

  The oscillator can also be synced to the incoming audio, and the tracked envelope can be used to modulate the pitch, filter cut-off and oscillator pulse-width. LFOs are provided for further modulation possibilities.

  Two ring modulators are included, allowing two different combinations of the above sounds to be modulated against each other.

  As with all pitch-tracking devices, Oomingmak tends to work best on monophonic sound sources. It was designed particularly with the guitar in mind, where it works well on solo lines rather than chords, although sending chords or even non-pitched material such as drums through it can also give interesting results.
specs: |-
  - 64 bit AU, AAX and VST formats
  - macOS and Windows
  - iLok account required to redeem the activation code
