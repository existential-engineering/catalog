details: |-
  ADHDidi is an additive synthesizer comprising of 16 sine waves tuned to
  different frequencies (fundamental plus the first 15 harmonics).

  Created for facebook fans as a thanks for their feedback and support, adhdidi
  was available throughout july and august 2014.

  The synthesizer features 32 8-stage envelopes with curve, stage and edit
  options, with 16 envelopes dedicated to wave pitch and 16 to wave volume.
specs: |-
  - 16 sine waves (fundamental + first 15 harmonics)
  - Waveform active switch
  - Cascade sync
  - 32 8 stage envelopes with curve, stage and edit options
  - 16 envelopes for wave pitch
  - 16 envelopes for wave volume
  - State variable filter
  - Low pass and high pass filter modes
  - Filter cutoff control via any of 32 envelopes
  - Filter resonance
  - Delay with rate (free/sync)
  - Delay feedback
  - Delay mix (wet/dry)
  - Pan
  - Glide
  - Volume
  - Velocity control
  - Pitch bend range
  - MIDI channel
  - Mono/poly mode
  - Envelope retrigger
  - Windows compatible
