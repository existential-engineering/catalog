details: |-
  DJ mix live streaming and recording app

  DJM-REC is an app for DJs which enables easy recording and sharing of mixes for effortless self-promotion to global audiences when you connect it with compatible AlphaTheta DJ mixers* via a USB cable. You can download the app for free from the App store and try paid features free for 30 days. * To use DJM-REC with our digital send-return equipped DJ mixers (i.e. the DJM-V10 , DJM-V10-LF , DJM-V5 , DJM-TOUR1 , DJM-A9 , DJM-900NXS2 , DJM-750MK2 and DJM-450 ), update the firmware via our support page .
