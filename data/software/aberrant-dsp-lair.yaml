description: Decoded from a diskette of unknown origin, Lair is a transporter
  through when and where, retooled as a reverberation effect. Combining three
  bespoke reverberator devices with an expansive collection of intricate
  parameters and chaotic modifiers, Lair is your door to familiar, abominable,
  and alien worlds.
details: |-
  Lair is a creative reverberation effect combining three bespoke reverberator
  devices with an expansive collection of intricate parameters and chaotic
  modifiers.

  Global controls include Mix, overall Reverberation, reverberation Sparsity,
  and Pre-Delay. The three reverb devices each have two unique modifiers:
  Artifact produces dark, diffuse, spring-like reverberant wash with Volatility
  and Tension controls; Mirror creates metallic, shimmering sounds with Purity
  and Glister modifiers; and Rift generates mystical echoes with Attunement and
  Instability controls.

  Additional processing includes a Drive unit with three flavors of distortion,
  a Modulation system with three waveform options, Tone Darkness and Lightness
  controls with unique behavior per-device, and Stereo Width controls with
  independent Dry and Wet signal pans.

  Lair also features a Dynamic Ducking section with adjustable Release Time and
  a custom preset system with 77 factory presets. Requires Windows 10+ (VST3,
  AAX 64-bit) or macOS 10.13+ Intel or Apple Silicon (AU, VST3, AAX 64-bit).
specs: |-
  - Global Mix, Reverberation, Sparsity, and Pre-Delay controls
  - Artifact device: dark, diffuse, spring-like reverb with Volatility and Tension
  - Mirror device: metallic, shimmering sounds with Purity and Glister
  - Rift device: mystical echoes with Attunement and Instability
  - Drive unit with three flavors of distortion
  - Modulation system with three waveform options
  - Tone Darkness and Lightness per device
  - Stereo Width with independent Dry and Wet pans
  - Dynamic Ducking with adjustable Release Time
  - 77 factory presets
  - Windows 10+ (VST3, AAX 64-bit)
  - macOS 10.13+ Intel or Apple Silicon (AU, VST3, AAX 64-bit)
