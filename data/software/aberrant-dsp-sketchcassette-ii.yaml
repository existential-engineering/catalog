description: Inspired by 4-track cassette recorders, SketchCassette II is designed to introduce a wide array of lo-fi effects into your mixes. From subtle warble to unearthed-from-the-attic destruction, SketchCassette II unlocks the full range of cheap tape sounds.
details: |-
  SketchCassette II is a lo-fi tape emulation plugin inspired by 4-track
  cassette recorders. It offers the flexibility and control to push your sounds
  from subtle warble to total lofi weirdness.

  The plugin features 12 unique tape type and quality profiles with continuous
  age modeling control, two tape saturation models (gentle and harsh), tape
  hiss, and dropouts with stereo width control.

  The Wow & Flutter section is highly adjustable and includes tempo syncing to
  your DAW, an FM Mode for modulating the Flutter Rate with the Wow controls,
  and flanging capabilities.

  Additional features include noise-reduction encoding compression with
  brightness and amount controls, mix controls for tape filtering and
  compression, and a custom preset system with 61 factory presets.

  SketchCassette II requires Windows 10 or later (VST3, AAX 64-bit) or macOS
  10.13 High Sierra or later with Intel or Apple Silicon support (AU, VST3, AAX
  64-bit).
specs: |-
  - 12 unique tape type & quality profiles
  - Age modeling with continuous control
  - 2 Tape Saturation models: A (gentle), B (harsh)
  - Tape hiss
  - Dropouts with Stereo Width control
  - Highly adjustable Wow & Flutter section with tempo syncing
  - FM Mode for modulating Flutter Rate with Wow controls
  - Flanging
  - Noise-reduction encoding compression with Brightness & Amount controls
  - Mix controls for Tape Filtering and Compression
  - Custom preset system with 61 factory presets
  - Windows 10+ (VST3, AAX 64-bit)
  - macOS 10.13+ Intel or Apple Silicon (AU, VST3, AAX 64-bit)
