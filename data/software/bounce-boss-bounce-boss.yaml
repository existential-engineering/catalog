details: |-
  Bounce Boss is a file sharing and collaboration platform for music producers,
  engineers, artists and managers. Keeping track of an audio project as it
  transforms from version 1 to version 5 is a logistical nightmare.
  Collaborators are wasting precious time searching through endless audio files,
  and linking those files to the corresponding emails. Bounce Boss not only
  simplifies the organisation of collaborations, it also helps users ensure
  positive progress.

  Add the files needed for each track, input the essential info and hit send.
  You can use bounce boss with anyone, they don't need a paid account. The
  collaboration workspace displays the files and comments in the collaboration
  on one page. Hit play (or spacebar) then jump seamlessly between the reference
  tracks, mixes and versions to monitor the progress.

  Stream the audio in 'fast' mode for immediate playback in mp3 320 kbps. Switch
  to 'hq' for lossless quality. Level match all the tracks in one click to help
  you and your collaborators make more accurate and informed decisions about the
  audio.

  Comments can be linked to a timestamp or loop, allowing all collaborators to
  immediately preview the specific part of the track that the comment relates
  to. This saves time and removes any possible confusion. Manage all
  collaborators in one place. Keep track of who has and hasn't seen the latest
  comments or files.

  Bounce boss offers a 15 day free trial. This extends to 30 days once the first
  project is created.
specs: |-
  - File sharing and collaboration platform
  - Mp3 320 kbps streaming
  - Lossless quality audio
  - Level matching
  - Timestamp and loop commenting
  - Collaborator management
  - Version tracking
  - Reference track comparison
  - Mix comparison
  - Audio playback controls
