details: |-
  Beast-Dlay is a game-changer delay VST plugin with unprecedented processing
  power ready to add the hardware realism and analogue warmth to your digital
  recordings.

  Beast-dlay is a creative tool that unlocks a new era of fx plug-ins. Its
  unique algorithm makes it perfect for sound manipulation and its key features,
  adaptable to all music feels.

  Beast-dlay functions as an audio units plugin and a VST 3 plugin for macos and
  windows.
specs: |-
