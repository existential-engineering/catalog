details: |-
  Cozy's grooves have that perfect lazy feel that comes from hitting the snare
  just a little late. Combined with drum sounds that have just the right amount
  of tape warmth and dusty vinyl crackle, this beatmaker will have you vibing in
  an instant.

  We couldn't bring ourselves to sacrifice even the tiniest bit of sound quality
  for this beatmaker. We used the best drum samples out there and roughed up the
  fidelity afterward, to make sure cozy delivers beats that don't skimp on
  integrity.

  Our frustration-free design is optimized to get you the best results as
  quickly and easily as possible. If you want to dial in some extra detail, you
  can control the decay, pitch and filter settings for each sound. You can also
  control the saturation, compression and ambience of the overall mix to make
  sure everything is gelling perfectly.

  Turn up the nostalgia with cozy's special control. You can get even more vinyl
  crackle, smooth the transients, pull back the highs and lows, increase
  saturation and add the sound of a beautiful tube mic via convolution by simply
  moving a one dial.

  Lofi hip hop beats are all about the feel. Our micro-timing feature will let
  you set the swag level from higher to highest.
