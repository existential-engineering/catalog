details: |-
  Hey Metronome is the voice-activated metronome you'll love. Play & practice
  hands-free. Whether your passion is guitar, brass, piano, strings, drums,
  woodwind, voice, dance, band Hey Metronome is for you.

  Violinists never have to take their hands off their bow. Guitarists can keep
  their hands on their strings. Practicing becomes fun again.

  Hey metronome includes exclusive sound design from multi-platinum producers.
  You'll experience drum beats, classic booming drum machines, and sounds
  designed to inspire and limit ear fatigue.

  Features include voice control to play, stop, set the tempo, and more; over a
  dozen themes with the ability to create your own themes; 100+ subdivision &
  accent combinations; full setlist & song system to change songs hands free;
  pick your time signatures or use voice commands; friendly and encouraging
  upbeat motivational messages; customize the background with family, pets, or
  band pics; and use ableton link to control tempo in your favorite apps.

  100% of proceeds from this app go to support the audiokit open-source project.
  Metronome engine app source code will be released. No internet required for
  voice control. Practice in airplane mode. Complete data privacy.
specs: |-
  - Voice-activated control
  - Ableton link support
  - 100+ subdivision & accent combinations
  - Full setlist & song system
  - Multiple time signatures
  - Voice commands for play, stop, and tempo control
  - Over a dozen themes
  - Custom theme creation
  - Drum sounds by professional sound designers
  - No internet required for voice control
  - Complete data privacy
  - iOS mobile app
