description: SYSTEM Saturator is a saturation and distortion plugin with five algorithms (1950s, Germanium, Thermionic, Triode, Tape) emulating tape, tube, triode and transistor character, from subtle saturation to fuzz. It includes hi/low-cut and tilt filters for sound shaping, usable standalone or within HOFA SYSTEM, with a freeware version also available.
details: |-
  The HOFA SYSTEM Saturator suite brings saturation & distortion from subtle to super heavy, from tape to tube into your DAW. It offers tape, tube, triode and transistor emulations, from subtle saturation to fuzz distortion, with hi-/low-cut and tilt filter for sound shaping, and a Böse button. It can be used as a single plugin or inside HOFA SYSTEM.

  Five algorithms are available. 1950s emulates a tube preamp from the 1950s and delivers legendary analog warmth. Germanium gives rich harmonic distortion with a strong vintage vibe, exactly what the name-giving germanium transistors have been delivering for decades.

  Many classic devices from the 1950s to 1970s are based on thermionic technology, and the Thermionic algorithm is a warm, musical pentode emulation that is particularly useful for vocals, guitars and bass. Triode primarily generates even overtones, which is suitable for warm, intimate timbres and is also ideal for mastering to 'glue' together elements of a mix. Tape reproduces the odd harmonics that overdriving analogue tape recorders primarily produces, the characteristic sound of old recordings.

  All plugins from the HOFA SYSTEM series are also available as freeware with a slightly limited feature set, installed via the HOFA-Plugins Manager. The freeware SYSTEM Saturator provides the 1950s algorithm only, while the full version adds Germanium, Thermionic, Triode and Tape as well as the drive 'Böse' button, low-cut with resonance option, hi-cut with adjustable slope, tone control (tilt EQ) and HQ mode with additional 4x oversampling.

  Two licenses are available per purchase, managed via the HOFA Plugins Manager, where they can also be deactivated and transferred to other computers. HOFA plugins can be activated and used offline, and licenses on USB sticks can be used alongside USB licenses from other plugin manufacturers.
specs: |-
  - Tape, tube, triode and transistor emulations
  - From subtle saturation to fuzz distortion
  - Five saturation algorithms: 1950s, Germanium, Thermionic, Triode and Tape (1950s only in the freeware version)
  - Drive with "Böse" button (full version only)
  - Low-cut with resonance option (full version only)
  - Hi-cut with adjustable slope (full version only)
  - Tone control, tilt EQ (full version only)
  - HQ mode with additional 4x oversampling (full version only)
  - Usable as a single plugin or in HOFA SYSTEM
  - Also available in a freeware version with slightly reduced feature set, installed via the HOFA-Plugins Manager
  - Formats: VST3, AU, AAX
  - Operating system: macOS 10.13 or later, Windows 10 or later
  - Two licenses included, managed via the HOFA Plugins Manager; offline activation supported
  - Continuously tested on Ableton Live, Apple Logic, Avid Pro Tools, Bitwig, Cockos Reaper, Image Line FL Studio, Magix Samplitude/Sequoia, Fender Studio Pro, Steinberg Cubase/Nuendo/Wavelab
  - 14 days free trial
