description: SYSTEM Saturator is a saturation and distortion plugin with five
  algorithms (1950s, Germanium, Thermionic, Triode, Tape) emulating tape, tube,
  triode and transistor character, from subtle saturation to fuzz. It includes
  hi/low-cut and tilt filters for sound shaping, usable standalone or within
  HOFA SYSTEM, with a freeware version also available.
details: |-
  The HOFA SYSTEM Saturator suite brings saturation & distortion from subtle to super heavy, from tape to tube into your DAW. Tape, tube, triode and transistor emulations From subtle saturation to fuzz distortion With Hi-/low-cut and tilt filter for sound shaping Usable as a single plugin or in HOFA SYSTEM With Böse button! Also available in a freeware version with slightly reduced feature set These 5 algorithms are available to you: 1950s This algorithm emulates a tube preamp from the 1950s and delivers legendary analog warmth! Germanium You want rich harmonic distortion with a strong vintage vibe? That's exactly what the name-giving germanium transistors have been delivering for decades. Thermionic Many classic devices from the 1950s to 1970s are based on thermionic technology. This warm, musical pentode algorithm is particularly useful for vocals, guitars and bass. Triode Triodes primarily generate even overtones. This is suitable for warm, intimate timbres and is also ideal for mastering to ‘glue’ together elements of a mix. Tape Overdriving analogue tape recorders primarily produces odd harmonics. This is how you create the characteristic sound of old recordings. Sound examples The HOFA Saturator in action https://www.youtube.com/watch?v=IEvyuDpvjO4https://www.youtube.com/watch?v=ZUUGoP5W7jY Freeware version All plugins from the HOFA SYSTEM series are also available as freeware with a slightly limited feature set. Simply install HOFA SYSTEM using the HOFA-Plugins Manager . You can then use all freeware features immediately. Here is an overview that shows the differences between the SYSTEM Saturator freeware and the full version: Feature Available in the freeware Available in the full version Saturation algorithms available 1950s 1950s, Germanium, Thermionic, Triode, Tape Drive with "Böse" button ⬤ ⬤ Low-cut with resonance option ⬤ ⬤ Hi-cut with adjustable slope ⬤ ⬤ Tone control (tilt EQ) ⬤ ⬤ HQ mode (additional 4x oversampling) ⬤ ⬤ Feedbacks
