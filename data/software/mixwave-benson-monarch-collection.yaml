description: A collection of software emulations modeled on Benson's Monarch
  Reverb amplifier and related pedals, including delay, modulation, boost,
  preamp, fuzz and spring reverb effects. Includes a modeled 1x12 cabinet with a
  speaker and virtual microphones.
details: |-
  The Monarch was Benson's first design, developed through years of studying and rebuilding amplifiers to understand how circuits shape tone, harmonics and response. Using proprietary component-level modeling, each circuit has been recreated to preserve its feel, harmonic depth and interaction. At the center is the Benson Monarch Reverb, moving from full, euphonic cleans into aggressive, harmonically rich overdrive with a uniquely touch-sensitive character, its tube-driven spring reverb extending both clean and driven tones. An extensive cab module captures the Monarch's dovetailed pine 1x12 cabinet and Benson Custom Ceramic speaker, with a large impulse response library recorded at MixWave Studios and 19 virtual microphones you can place freely around the speaker. The collection includes the Benson Monarch Suite plus Florist, Delay, Tall Bird, Germanium Boost, Germanium Fuzz and Preamp as separate plugins. Available as a 64-bit VST3, AU or AAX plugin for macOS and Windows. An iLok account and iLok License Manager are required (both free). Includes a 14-day free trial through iLok. We present, MixWave: Benson Monarch Collection .
