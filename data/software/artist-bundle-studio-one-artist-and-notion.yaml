details: >-
  Built on a modern foundation that's not bogged down by legacy code, studio one
  artist provides an efficient, creative companion from initial inspiration to
  final export. Its efficient, single-screen interface houses an unlimited
  number of tracks, intuitive editing tools, and advanced virtual
  instruments—you spend your time creating music, not wondering what to click
  next.


  The 32-bit mix engine is state of the art, while the smooth, analog, superior
  sound quality of the virtual instruments comes from proprietary techniques
  that provide much higher controller resolution.


  Offering the finest playback quality of any music notation product, notion
  features orchestral samples recorded by the london symphony orchestra, as well
  as guitar, bass, and drum samples by neil zaza, victor wooten, and roy
  "futureman" wooten.


  Only notion allows you to create a score on your mac or windows computer and
  transfer it to your ios device, where you can continue to edit. Notion offers
  tools for scoring to video, offers handwriting recognition (powered by
  mcscript), is tightly integrated with presonus' studio one DAW, and comes with
  three studio one native effects plug-ins.


  Take projects to the next level with deep studio integration including
  audio/MIDI streaming with any professional DAW via rewire and unprecedented
  integration with presonus studio one. Even set music to film with advanced
  video capabilities.
specs: |-
