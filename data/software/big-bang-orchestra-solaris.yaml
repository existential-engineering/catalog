details: |-
  This all-new collection of woodwind tones and phrases offers two main
  categories: low winds and high winds. The low winds section consists of an
  ensemble of three contrabassoons, two bassoons, one contrabass clarinet and
  two bass clarinets. Together, they perform the fundamental lows, with
  articulations such as short notes (both bold and agile), long notes,
  espressivo, short and long swells, sforzatos, sforzatissimos, and flutter
  tongues.

  All of these playing techniques are available as notes playing in unison and
  octaves, as well as in clusters. A crossfade patch allows you to blend
  seamlessly from unison to clusters and back.

  The high winds section consists of one piccolo, three flutes, two oboes and
  four clarinets. Apart from long notes in unison and octaves, these top
  musicians from the synchron stage orchestra, who have developed into a
  cohesive ensemble over the years, show off their synergistic virtuosity by
  performing runs and arpeggios in a wide variety of scales and chords.

  Runs are available in major and minor keys, as well as in diatonic modes,
  chromatic and whole tone scales. As a variant, the "perform octave" patch lets
  you play a starting note of any length and trigger the run as soon as you
  press the target note an octave above or below. Arpeggios are performed in
  various chords, including major, minor, sevenths, diminished and augmented.

  Played in 16th triplets, they are available in three tempos 80, 100 and 120
  bpm and you can easily sync them to your host tempo using the synchron
  player's time stretching feature, or even change the tempos in real-time using
  a controller.
