description: Create soaring and regal melodies with this set of masterful performances captured in Abbey Road's iconic Studio One. Performed by London's first-call session players, Grand Brass offers you exceptional performances of horns and tuba, as well as the idiomatic pairing of horns and cellos.
details: |-
  Grand Brass elegantly captures expert performances of four horns, supported by a deeply resonant tuba, sounding an octave below. For ultimate control, articulations such as legato, long, staccato, tenuto, as well as short, medium, and long swells are present and easily accessed via our dedicated plug-in. With these essential techniques, this library is designed to give you not only the sharp, punchy sounds you would expect but also lyrical performances for creating unforgettable melodic lines.

  Our majestic four-horn section is combined with an enchanting ensemble of ten cellos, presented in both Soaring Long and Soaring Legato patches for exclusive control. Composers from Gustav Holst to John Williams have used the idiomatic pairing of brass and strings for its characteristic mellow and rich timbre, which elegantly represents these instrument's 'cantabile' or 'singing' ranges. Performed in the unmistakable acoustics of Studio One, Grand Brass adds yet more depth to the Abbey Road One orchestral range.

  Enter the room most composers can only dream of, Abbey Road's Studio One. Considered one of the finest acoustical spaces in the world, Studio One's history has an indelible connection with the scores recorded there, providing emotion, mood, and magic for many of the most renowned and successful films ever made. With its rich tonality and famed reverb, Studio One's sound is widescreen and epic. Grand Brass puts the same first-call musicians that play on globally successful movies at your fingertips, all recorded by multi GRAMMY Award-winning engineer Simon Rhodes and featuring the legendary Abbey Road microphones and outboard gear.

  Expanding on Abbey Road One: Orchestral Foundations, a 90-piece symphonic orchestra that was our first partnership with Abbey Road Studios, Grand Brass is a fully-fledged, stand-alone library. Elevate your existing symphonic orchestra toolkit or pair with Orchestral Foundations to create soaring, heroic themes.

  With a beautiful, modern design, Grand Brass and all of the Abbey Road One Selections are housed in our award-winning plug-in, which loads directly into all major DAWs (VST2, VST3, AU, AAX and NKS-compatible) without the need for any additional software. Easy to use, intuitive and inspiring, our plug-in has been designed by composers, for composers.
specs: |-
  - Four horns supported by a tuba sounding an octave below
  - Ensemble of ten cellos paired with the four-horn section
  - Articulations: Legato, Long, Staccato, Tenuto, Swells Short, Swells Medium, Swells Long, Soaring Long, Soaring Legato (all 8ve)
  - 10 microphone signals: Vintage 1, Vintage 2, Pop Close, Pop Room, Close, Tree 1, Tree 2, Ambient, Outriggers, Spill
  - Two ready-made mixes (Mix 1, Mix 2)
  - Dedicated Spitfire Audio plug-in, no additional sampler software required
  - NKS compatible
  - Recorded in Abbey Road Studio One through the EMI TG desk by engineer Simon Rhodes
  - Works as a stand-alone library or alongside Abbey Road One: Orchestral Foundations
  - 9.3 GB download size, 9.30 GB disk space required during install
  - macOS 11 to macOS 26, Intel and Apple Silicon supported
  - Windows 10 or Windows 11, 64-bit
  - Minimum 2.8GHz quad-core i5 or AMD Ryzen 5 with 8GB RAM, 16GB RAM recommended
  - 32-bit systems are not supported
  - Spitfire Audio App required for download and installation
