details: |-
  Auto Track Colors organizes your sessions automatically—just name your tracks
  and both tracks and clips are color-coded instantly. Custom keywords trigger
  your chosen colors for a perfectly organized Ableton live session, so you can
  focus on making music.

  Fits your workflow: effortlessly link multiple keywords to your favorite
  colors for a personalized setup. Automatic coloring: automatically updates
  every track without interrupting your creative flow - in session and
  arrangement view.

  Ultra-light cpu: operates with minimal impact, keeping your sessions smooth
  and responsive. Smart clip coloring: instantly sync all clip colors to match
  their parent track.

  Preset ready: save and recall your custom color-keyword combos as ableton live
  presets. One-click refresh: instantly re-color every track with a single tap
  on the re-color all tracks button.

  Advanced matching: choose from multiple word match modes to perfectly fit your
  naming schemes. Continued support and free feature updates included.
specs: |-
  - Automatic track and clip coloring
  - Custom keyword-based color triggering
  - Session and arrangement view support
  - Ultra-light CPU operation
  - Smart clip coloring
  - Ableton live preset compatibility
  - One-click refresh functionality
  - Advanced word matching modes
  - macOS and Windows compatibility
