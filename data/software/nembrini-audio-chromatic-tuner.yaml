description: A compact tuning plugin offering fast, accurate tuning in a single plugin or iOS App. Features ±0.01 cent accuracy with a big, bright full-color LED display.
details:
  - Chromatic Tuner is a compact, high-precision tuning plugin from Nembrini Audio, available as both a desktop plugin and an iOS app. It provides ultra-accurate pitch detection at ±0.01 cent, making it suitable for any instrument or workflow.
  - The plugin features a big, bright full-color LED display that makes it easy to read your tuning at a glance. Calibration to any pitch standard is supported, with A=440 Hz as the default.
  - Drop/Capo mode allows automatic transposition of up to one octave, making it convenient for guitarists and other musicians who frequently work in alternate tunings.
  - Chromatic Tuner supports all major plugin formats — AU, VST2, VST3, and AAX — and runs on both Intel and Apple Silicon Macs as well as Windows. A companion iOS app (NA Tuner) is available for iPhone and iPad on the App Store.
  - The plugin is completely free, requires a minimum of 1GB RAM, and works with any 64-bit DAW.
specs: |-
  - Tuning accuracy: ±0.01 cent
  - Calibration: adjustable pitch standard (default A=440 Hz)
  - Drop/Capo mode: auto-transpose up to one octave
