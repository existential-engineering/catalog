description: Compact Nembrini Audio Chromatic Tuner gives you fast, accurate tuning in a single plugin or iOS App, with a big, bright full color LED display and ±0.01 cent accuracy.
details: |-
  Compact Nembrini Audio Chromatic Tuner gives you fast, accurate tuning in a single plugin or iOS App.

  It has a big, bright full color LED display and calibration to any pitch standard, with A=440 as the default.

  A Drop/Capo mode lets the Nembrini Audio Tuner auto-transpose notes up or down to one full octave.

  The compact tuner gives you a fast, accurate tuning tool in a single plugin, and you can get perfect tuning anytime, anywhere with the iOS version for iPhone/iPad.

  The ultra-precise tuner gives you ±0.01 cent accuracy for ultimate tuning performance.
specs: |-
  - Big, bright full color LED display
  - Calibration to any pitch standard, A=440 default
  - Drop/Capo mode auto-transposes notes up or down to one full octave
  - ±0.01 cent accuracy
  - iOS version for iPhone and iPad
  - Requires a VST2, VST3, AAX or AudioUnits compatible host
  - Intel compatible or Apple Silicon CPU, 1GB RAM
  - Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
