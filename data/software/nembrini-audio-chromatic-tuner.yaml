details: |-
  Compact tuner gives you fast, accurate tuning tool in a single plugin Noticed I've been running the 1.0.0. version for some time now. Had to see if there had been some updates, and indeed there was. Tuning my 5 string bass on the 1.0.2. version and the response is smooth as butter. Full score! I will warn you from the beginning, I love Nembrini software. The sound is outstanding and the simplicity of their products almost disguise how wonderful Nembrini will interact with you and your instrument. The tuner is a fine example of this. It is very easy to use and it makes tuning a snap. It is wonderful to look at. Thought has been put into this tuner. This attention to detail is further reflected in the Nembrini sound. What good is a well tuned guitar if the software makes It it sound less than stellar? I have never enjoyed the sound of a guitar until late in life. I play obsessively now , caught up in the Nembrini magic.
