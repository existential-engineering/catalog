details: >-
  Akebono: plucked is a sample based emulation of a rare suitcase instrument
  from japan. Released some time in the mid to late '80s, akebono re-creates a
  number of traditional japanese instrument sounds using a combination of
  samples and digital synthesis.


  All 9 of the plucked string instrument sounds were sampled for this library.
  All plucked instrument sounds chromatically sampled at 24-bit 48khz.


  An easy-to-use, custom interface. Convolution based emulation of the original
  speaker at various microphone positions. Authentic emulation of the original
  performance controls.


  Two additional articulations per sound, accessed via key-switches. Compatible
  with kontakt 4 & 5.


  Included instrument sounds: koto (x2), bass koto (x2), guqin, shamisen (x3),
  biwa.
specs: |-
  - 24-bit 48khz sampling
  - Convolution based speaker emulation
  - Key-switch articulations
  - Kontakt 4 & 5 compatible
  - Custom interface
  - 9 plucked string instrument sounds
  - Chromatic sampling
