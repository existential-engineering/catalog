description: Guitar Mods transforms guitar audio directly in real time — adding infinite sustain, auto-tuning, and instrument morphing — without MIDI, preserving the feel and immediacy of the guitar signal.
details: |-
  Transforms guitar audio directly without MIDI or synthesizers
  7 Mods available: Synth, Sax, Trombone, Bassoon, Clarinet, Cello, and Mellow
  Near-zero latency — operates on the raw guitar signal
  Instrument character adjustable via knob; morphs smoothly via expression pedal or Modulators
  Chainable with other effects and plugins (before or after a Mod)
  Hosts third-party plugins, IRs, Neural Amp Models, and NAM captures
  Integrates natively into MIDI Guitar 3 when installed alongside it
  Complete sound design platform: patches saved and recalled via click or MIDI foot controller
  Currently experimental and in active development
specs: |-
  - minimum: Apple M1 Mac or M1 iPad
  - cpu: Quite intensive — Apple Silicon required
  - windows: Not yet available (planned for future release)
