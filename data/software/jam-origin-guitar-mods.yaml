description: Mod your guitar to do supernatural and uncanny things like adding infinite sustain, auto-tuning and morphing into other instruments. Guitar Mods looks virtually identical to MIDI Guitar 3, but it transforms audio directly, rather than via MIDI and synthesizers.
details: |-
  Guitar Mods operates directly on the guitar sound and preserves most of the character of your guitar's own sound and how you play it. Every kind of string action or fret noise will cause some kind of immediate response. In this sense, Mods have next to no latency and avoid most of the physical disconnect that is associated with most MIDI guitar setups. However, the flip side of this is that Mods does not match the fidelity of high quality MIDI-driven instruments that don't have to deal with your fingers and string noise.

  Mods do not aim to sound like the instrument they're named after; they bring the characteristics of those instruments to the guitar. So, the Cello Mod doesn't sound exactly like a cello and the Sax Mod doesn't sound exactly like a saxophone. They sound like a guitar, but a guitar that has become somewhat cello-like or sax-like. The "celloness" or "saxiness" can be adjusted via a knob, and morph in a smooth transition back and forth between the instruments, using an expression pedal or a range of Modulators.

  The sound of a Mod is dependent on what you feed into it, your picking style, guitar type and pickup position all affects the resulting sound. The vibrations that you feel in the guitar body, disperse into other sounds, in real time. If you are on the search for new ways to manipulate sounds from your guitar, Guitar Mods will lead you to new discoveries. If you are looking to control high-fidelity virtual instruments, MIDI Guitar 3 is the way to go.

  A Mod works just like an effect pedal. You can chain any other effect after it (saturation, delays, reverbs, etc.). But, more interestingly, it works on the sound sent into it. So, you can add audio effects before a Mod, to affect the sound of the next Mod in the chain. For example, for brass or bowed string mods, you can brighten up the guitar attack by adding overdrive or a Neural Amp Model before the Mod. Guitar Mods is a complete sound design software package for guitar. In addition to the growing collection of built-in modules, third-party plugins, effects, IRs, NAM captures and more can be hosted, saved and recalled in patches with just a click or via a MIDI foot controller.

  When Guitar Mods is installed, MIDI Guitar 3 will notice the plugin and add all the new modules natively inside MIDI Guitar 3. Because the dry sound of many hexaphonic pickups is comparatively weak and thin, Mods requires the regular guitar pickup signal for optimal function: when using a GK-5 pickup a dual jack-cable setup is required, and for GK-3 pickups the patch cable is needed with the GK-3's selector switch set to "Guitar".
specs: |-
  - Transforms guitar audio directly rather than via MIDI and synthesizers
  - 7 Mods available: Synth, Sax, Trombone, Bassoon, Clarinet, Cello and Mellow
  - Morph amount adjustable via knob, expression pedal or Modulators
  - Works like an effect pedal, chainable before and after other effects
  - Hosts third-party plugins, effects, IRs and NAM (Neural Amp Model) captures
  - Patches saved and recalled with a click or via a MIDI foot controller
  - Modules appear natively inside MIDI Guitar 3 when installed alongside it
  - Requires Apple Silicon: minimum an Apple M1 Mac or M1 iPad
  - Windows version stated as coming in the future
