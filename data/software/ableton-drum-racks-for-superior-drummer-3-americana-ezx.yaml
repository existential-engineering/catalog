details: >-
  Ableton drum racks for superior drummer 3 americana ezx features separate
  ableton drum racks for all factory presets for the toontrack superior drummer
  3 and americana ezx library for toontrack ezdrummer. These racks provide out
  of the box integration workflow between ableton live and toontrack superior
  drummer using the toontrack libraries including a host of features ready to
  use for composition and performance using ableton push or similar controllers.


  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all americana ezx factory presets from ableton push
  controller device browser.


  12 ableton drum racks to instantly load the factory library "mix ready"
  presets with ableton mappings. 6 ableton live templates designed to host the
  multi channel output routing presets with track level audio routing from
  superior drummer 3 into ableton live. Colour coded pad design for visual
  performance and finger drumming.


  Singleout presets: 6 ableton drum racks for all americana ezx factory presets
  single audio output to a single ableton track. Multiout presets featuring 6
  ableton drum racks for all americana ezx presets in multiple audio channel
  output from the plug in to multiple ableton audio tracks using the 6 multi
  output ableton templates also provided designed for the kit presets.


  Use the template racks and extend to your own toontrack superior drummer 3
  americana ezx presets, swapping out individual sounds or articulations. You
  are 100% ready to go with the factory presets but there is no limitation to
  creating your own presets from these templates.
