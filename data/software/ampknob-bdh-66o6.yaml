details: >-
  Devilishly heavy 'sixty-six-oh-six' is based on a hot-rodded and modified
  "plus" version, which was originally a later generation of the amp from around
  2000. The modifications ordered by jens make this amp breathe, spit and bite
  in a way that is the opposite of stale modern high-gain amps. It's truly one
  of a kind a sound you will not find anywhere else.


  Every amp in the bdh collection includes a pedal switch, activated with the
  push of a button on the plugin's front panel. The pedal tightens up the lowend
  and drives the input a bit harder. It's perfect for some seriously heavy
  riffing.


  With ampknob, you can capture your ideas quickly and easily without even
  starting a DAW. The standalone version of ampknob includes a built-in
  recording functionality that makes it effortless to always stay creative.


  The standalone version of ampknob now comes with a built-in metronome for you
  to stay sharp at your guitar playing skills. Change meter, accent, or set
  automatic speed increments so you can focus on practicing without even taking
  your hands off the guitar. The excellent built-in tuner means you're always
  ready to jam.


  The perfect speaker cabinet, microphones, and recording chain has been
  expertly chosen and dialed in by producer jens bogren to capture the tone with
  outstanding detail. If you feel like experimenting, you can disable the cab or
  even load your favorite impulse response right from the plugin.
