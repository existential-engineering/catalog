description: A vintage mid-range equalizer plugin inspired by the Pultec MEQ-5. Sweeten vocals, guitars and keys across 200Hz–7kHz.
details: |-
  Some equalizers are surgeons. The VEQ-5 isn't one of them. It's a vintage mid-range equalizer that works the way the old Pultec MEQ-5 did — broad, musical strokes across the 200Hz to 7kHz "power band" where most of a mix's character actually lives. You don't reach for it to chase down one ringing frequency. You reach for it when a vocal needs to step forward, when a guitar sounds boxy, or when a snare has plenty of body but no crack.

  The MEQ-5 was never the famous one. Its bigger sibling, the EQP-1A, got the glory — but engineers who knew both kept the MEQ-5 patched in for a reason. Its passive filter design and tube make-up gain give midrange moves a weight that later parametric EQs never quite matched. Black Rooster Audio rebuilt that behaviour with a real-time, SPICE-style circuit simulation: the passive filter network, the audio transformers and the tube amplifier stage are all modelled as a living circuit, not baked into a static curve. That's why boosting and cutting overlapping bands produces the same slightly unpredictable, always-flattering interaction the hardware is loved for.

  The layout looks almost too simple: a Low Boost, a Mid Cut (the "Dip") and a High Boost, each with its own stepped frequency selector. Set the Low Boost across 200, 300, 500, 700 or 1000Hz for up to roughly +13dB of chest and authority. The Mid Cut ranges far wider than most people expect — eleven steps from 200Hz all the way to 7kHz, up to about -10dB — so you can scoop mud out of the low mids or notch honk and sibilance higher up. Push the High Boost between 1.5 and 5kHz for as much as +9dB of presence and air. Boost and cut around the same region at once, and the overlapping filters carve a shape no single band could manage on its own. Because the tube make-up amp stays in the signal path even when the EQ section is switched out, running the VEQ-5 dead flat still lays down a gentle layer of harmonic colour.

  On lead vocals, a little High Boost around 3–5kHz with a small dip through the low mids clears space and pulls the singer over the track without ever turning harsh. On electric and acoustic guitars, the Mid Cut tames the boxy 400–800Hz zone while the Low Boost keeps the body intact. On keys, organs and Rhodes, it adds a forward, recorded-to-tape midrange that sits a part inside a busy arrangement instead of piling on top of it.
