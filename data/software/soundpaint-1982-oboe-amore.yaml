details: |-
  The Orchestra's Emotional Oasis

  Introducing the 1982 Oboe Amore: an instrument of infinite beauty and expression. With painstaking attention, we've sampled every facet of this distinctive instrument, crafting a library teeming with evocative articulations. From delicate breathy notes to fervent phrases, the Oboe Amore infuses your compositions with rich emotion, imparting a novel dimension to your music. We've included an extensive range of articulations to give you maximum flexibility in your compositions. From staccato notes to multiple ultra-expressive legato types to trills, tremolos, and runs, Oboe Amore has everything you need. We've also included a range of dynamic arcs that add a sense of intimacy and vulnerability to your compositions. The TIME module stretches all of this beyond its limits, allowing you to create the perfect length and speed for any music. Hyper Acoustic Legato (H.A.L) Technology effortlessly transitions between monophonic and polyphonic play, with two legato varieties - lyrical and strong - adding further depth.Unleash your creativity, play as you please, and let Soundpaint weave magic. The Oboe Amore, an echo of artistic exploration, awaits your touch.
