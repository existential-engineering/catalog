details: >-
  Amati violin originated from a priceless antique violin created by nicol amati
  in the year 1664. Nicol amati, the most eminent among the amati family, gained
  his reputation as a renowned violin maker in italy.


  The amati violin sounds unique, as it evokes emotion. This adds a special
  timbre color to the final sound. Regardless of the style of music you compose,
  this violin can add special characteristics to its sound, with a natural
  dynamic.


  The multi dynamic sampling ensures the violin can have enough dynamism when
  doing crescendo and decrescendo.


  Amati violin by sound magic is a virtual instrument audio plugin and a
  software application for macos and windows. It functions as a VST plugin, an
  audio units plugin and a standalone application.
