details: |-
  VP4-Edit is a free, intuitive software editor for the VP4. This app allows you to easily create, edit, and manage your VP4 from your connected Mac or PC, providing a fast and user-friendly interface.

  Whether you're dialing in effects, building scenes, or managing presets, VP4-Edit simplifies the process, helping you get the most out of your unit. It even includes bonus features not available on the VP4 itself, such as Block Library, Channel Copy, Scene Swap, and more.

  Enjoy the convenience of using a computer keyboard and mouse to edit. Edit effect types, settings, modifiers and more, and set up the gate, levels, EQ, routing, and controllers. Speed your workflow with preset Templates, or use the Block Library to access favorite effect settings in just two clicks.

  Import, Export, Copy/Paste, and re-order presets. Change SETUP options including Audio, Global, MIDI, and more. Use Fractal-Bot built-in to update firmware, back up, and restore.

  You can download VP4-Edit for Mac or Windows below. Version 1.01.12 is dated August 20, 2026, and is offered as a Mac build and a Windows build, with a separate 32-bit Windows build also available.
specs: |-
  - Enjoy the convenience of using a computer keyboard and mouse to edit
  - Edit effect types, settings, modifiers and more
  - Set up the gate, levels, EQ, routing, and controllers
  - Speed your workflow with preset Templates
  - Use the Block Library to access favorite effect settings in just two clicks
  - Import, Export, Copy/Paste, and re-order presets
  - Change SETUP options including Audio, Global, MIDI, and more
  - Use Fractal-Bot built-in to update firmware, back up, and restore
  - Bonus features not available on the VP4 itself, including Block Library, Channel Copy and Scene Swap
  - Windows build requires Windows 10 or newer (64-bit only); a 32-bit build is also offered
  - Windows build requires the VP4 USB Driver
