description: A simple one-knob compressor for voice-over and vocals, based on
  the Dials channel strip, with tube saturation and a bass boost EQ.
details: |-
  Things - Voice is a simple one-knob 'throw it on and it sounds good' compressor for voice-over and vocals. Based on the Dials channel strip, it gives you everything you need to make your voice loud yet smooth. The compressor is an unusual and complex design from a German 1950 radio broadcast instrument. To get even closer to that unit's vintage tone, add authentically modded tube gain with the saturation button. For an authoritative bass boost there is a rather euphonic EQ that excites just the right frequencies.

  This 1950s/60s German measurement instrument was originally used to send a fixed level and frequency to a radio transmitter. On the receiver end, it could then be checked how much of that signal came through and what adjustments had to be made. Analog specialist Wojcek Czern of Rogalow Audio (PL) discovered that it could be adapted to be a high-quality mic preamp on par with studio legends like the V72 and V76. It is Hainbach's main preamp for voice, acoustic mono recordings and processing synths.

  One welcome side-effect of this massive steel-tubed amplifier is that it compresses the signal pleasantly. AudioThing analyzed the effect and made it adjustable, so you get the overtone rich gain of the preamp separately from the compressor.

  This is the seventh plugin in AudioThing's ongoing collaboration with Berlin musician and video personality Hainbach.

  Things - Voice is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP). It is also available on the App Store for iOS and iPadOS (AUv3 and Standalone), for iPhone and iPad.
