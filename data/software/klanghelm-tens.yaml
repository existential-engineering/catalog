description: TENS is a studio spring reverb plugin physically modelled after a range of high-end Austrian spring reverberation units built from the early 1970s to the early 1980s. It extends the originals with decay times up to 40 seconds, stereo tank output, optional amp saturation and three modulation slots.
details: |-
  TENS has been physically modeled after the range of high end studio spring reverberation units introduced by a famous Austrian company from the early 1970s to early 1980s. As opposed to classic spring reverbs found in guitar amps, these units were based on the company's own patented proprietary design principle, which allowed various connected spring elements of different lengths and wire diameter to vibrate inside a small isolated space.

  The spring elements were manipulated in various ways, e.g. by etching the wire surface and deforming individual turns of the coil wire, resulting in a highly diffused and very dense reverb that didn't expose the boing/chirping artifacts associated with spring reverbs and brought it much closer to the sound of plate reverbs. This range of reverbs is praised for its incredibly deep, organic, complex, rich, smooth and floating character. In terms of sound (but of course not technically) it can be seen as the missing link between classic spring and plate reverbs.

  To extend the sonic possibilities of the originals, TENS offers a wide range of decay times, stereo output from each tank instead of the original mono, and the TENSION, WHOOSH and METALLIC controls to deeply alter the actual models. An optional (pre-)amp saturation stage can be placed freely in the signal chain.

  Three modulation slots add movement or create out-of-this-world sounds. Every continuous TENS parameter can be a modulation target, and targets can be modulated by either an LFO or an envelope follower. The envelope follower can be triggered by the reverb input, output or an external sidechain signal, can be used for ducking effects, and can shape the dynamics of the input, the optional amp saturation and the reverb signal. With the modulation section, effects such as tremolo, chorus, vibrato and phaser-like sounds can be achieved, plus combinations of them.

  The hardware lineage TENS was modelled after began in 1972 with the BX20, a unit the size of a fridge that still had a much smaller footprint than the plate reverbs of the time. The BX10 followed in 1975 as a portable version whose carry handle locked the tanks for transport. The 3U rackmount BX5 arrived by the end of the 1970s as the most affordable model of the line. 1982 saw the BX25, which increased spring length by about 20% while reducing enclosure size by about 60% compared to the BX20 and included an inbuilt delay intended as a pre-delay, alongside the BX15, built upon the BX10 with more selectable decay times and stepped controls for its EQ section.
specs: |-
  - Physically modelled studio spring reverb based on 1970s to 1980s Austrian hardware units
  - Wide range of decay times, from 0.2 seconds up to 40 seconds
  - Each tank of TENS' models outputs a stereo signal instead of the original's mono
  - TENSION, WHOOSH and METALLIC controls to deeply alter the models
  - Optional (pre-)amp saturation that can be placed freely in the signal chain
  - Three modulation slots to add movement or create out-of-this-world sounds
  - Every continuous TENS parameter can be a modulation target
  - Targets can be modulated by either an LFO or an envelope follower
  - Envelope follower can be triggered by the reverb input, output or an external sidechain signal
  - Ducking effects via the envelope follower
  - Envelope follower can shape the dynamics of the input, the optional amp saturation and the reverb signal
  - Modulation section can produce tremolo, chorus, vibrato and phaser-like effects
  - All formats included in a single license
  - Windows 10 or higher (64-bit): VST, VST3, AAX Native
  - macOS 10.13 or higher: AU, VST, VST3, AAX Native
