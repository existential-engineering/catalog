description: "Studio spring reverb plugin physically modeled after high-end
  spring reverberation units from an Austrian manufacturer (1970s-1980s).
  Features a patented proprietary design principle with connected spring
  elements of varying lengths producing highly diffused, very dense reverb
  without typical spring reverb artifacts. Offers decay times from 0.2 to 40
  seconds, stereo output, amp saturation, three modulation slots with LFO and
  envelope follower, external sidechain support, and ducking effects."
details: |-
  Decay times ranging from 0.2 to 40 seconds
  Stereo output from mono-origin design
  TENSION, WHOOSH, and METALLIC controls for sonic customization
  Optional amp saturation with flexible signal chain placement
  Three modulation slots with LFO and envelope follower options
  External sidechain support
  Ducking effects capability
  Tremolo, chorus, vibrato, phaser-like effects
