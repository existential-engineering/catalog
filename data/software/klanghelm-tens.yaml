description: TENS is a physically modeled studio spring reverb plugin based on high-end Austrian studio spring reverberation units from the early 1970s to early 1980s, delivering a highly diffused, dense reverb that bridges the sonic gap between classic spring and plate reverbs.
details: |-
  TENS has been physically modeled after the range of high end studio spring reverberation units introduced by a famous Austrian company from the early 1970s to early 1980s. As opposed to classic spring reverbs found in guitar amps, these units were based on the company's own patented proprietary design principle, which allowed various connected spring elements of different lengths and wire diameter to vibrate inside a small isolated space.

  The spring elements were manipulated in various ways, e.g. by etching the wire surface and deforming individual turns of the coil wire, resulting in a highly diffused and very dense reverb that didn't expose the boing/chirping artifacts associated with spring reverbs, bringing it much closer to the sound of plate reverbs. This range of reverbs is praised for its incredibly deep, organic, complex, rich, smooth and floating character — in terms of sound it can be seen as the missing link between classic spring and plate reverbs.

  To extend the sonic possibilities of the originals, TENS offers a wide range of decay times from 0.2 to 40 seconds, stereo output from each tank (as opposed to mono in the originals), and various options to deeply alter the actual models via the TENSION, WHOOSH, and METALLIC controls. Optional pre-amp saturation can be placed freely in the signal chain.

  Three modulation slots allow adding movement or creating out-of-this-world sounds. Every continuous TENS parameter can be a modulation target, and targets can be modulated by either an LFO or envelope follower. The envelope follower can be triggered by the reverb input, output, or an external sidechain signal, enabling ducking effects and a range of modulation effects including tremolo, chorus, vibrato, and phaser-like sounds.

  TENS models units spanning the BX20 (1972), BX10 (1975), BX5 (late 1970s), BX25 (1982), and BX15 (1982) — a progression from fridge-sized studio reverbs to compact 3U rackmount and portable formats, each with unique spring configurations and tonal characteristics.
specs: |-
  - Decay time range: 0.2 to 40 seconds
  - Stereo output from each tank (originals were mono)
  - TENSION, WHOOSH, and METALLIC controls for model alteration
  - Optional (pre-)amp saturation, freely placeable in signal chain
  - Three modulation slots (LFO or envelope follower per slot)
  - Every continuous parameter available as modulation target
  - Envelope follower triggerable by reverb input, output, or external sidechain
  - Ducking effects via envelope follower
  - Modulation effects: tremolo, chorus, vibrato, phaser-like sounds
  - Models based on: BX20 (1972), BX10 (1975), BX5 (late 1970s), BX25 (1982), BX15 (1982)
  - All formats included in a single license
