details: |-
  Serato Scratch Live is the original vinyl emulation software for professional DJs, enabling mixing and scratching of digital music using Serato Control Vinyl or Control CDs.

  Scratch Live operates exclusively with Rane hardware. The product is now legacy software; Serato recommends upgrading to Serato DJ Pro, which incorporates the Scratch Live workflow with enhanced features and stability.

  A free upgrade to Serato DJ Pro is available for users with Serato DJ Pro Enabled hardware.
