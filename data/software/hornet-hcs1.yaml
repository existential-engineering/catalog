description: HCS1 it's a compressor sustainer pedal plugin that recreates a famous vintage guitar effect, it's also a nce compressor to be used on other sounds
details: |-
  The HoRNet HCS1 is a faithful recreation of a highly popular guitar compressor sustainer pedal that was originally produced from the mid-seventies to the mid-eighties. Known for its ability to provide smooth sustain to electric guitars, this plugin emulates the unique behavior of the compressor pedal to give you that distinct sound, which was made famous by guitarists all over the world, directly in your computer.

  The HCS1 plugin accurately captures the peculiar dynamics of the original pedal’s compression effect. The core functionality of the pedal is that it smoothly sustains notes by acting as a compressor, which is why it became an essential part of the guitarists’ arsenal. Unlike standard audio compressors, the HCS1 has a fixed threshold that operates differently on signals above and below that threshold. When the input signal is low, such as a naturally decaying note, the internal volume is boosted significantly, giving the sound a sustained effect. On the other hand, if the signal is above the threshold—like when a note is first picked—the volume is gradually reduced, which is a hallmark of the pedal’s characteristic compression.

  This behavior is distinct from the standard audio compressor, making the HCS1 a unique tool for not just guitars, but other sources as well. For instance, it can add texture and character to keyboards or drums. The HoRNet HCS1 lets you capture this unusual compression behavior in your digital recordings, adding that specific dynamic control that was once only available through the physical pedal.

  One of the defining features of the HCS1 plugin is its minimalistic control layout. Unlike traditional compressors with a myriad of settings, this plugin lets you focus on only a few essential parameters that define its sound. The threshold is fixed, meaning that you don’t have to worry about adjusting it for different situations—it is set to work specifically with the pedal’s designed behavior.
specs: |-
  - Faithful recreation of the hardware compressor behaviour
  - Controls for “attack”, “sustain” and “level”
  - Option to enable “bright” modification to original circuit
  - Analog emulation with saturation and hiss
  - Saturation and hiss can be optionally disabled
  - Dry/Wet knob to create parallel compression
  - Internal 4x oversampling
  - Mac OS X (>=10.7) and Windows (Vista and later) support.
  - Audio Units VST2.4, VST3 and AAX format.
  - Apple Silicon native support
