description: A creative multi-effect that modulates incoming audio at audio rate, formant shifts it and passes it through a spectral delay line. An XY pad drives the effect matrix and can be dragged or automated from the host.
details: |-
  Obsidian is a creative effect aimed at making synths, bass lines and vocals stand out with only a couple of moves. Audio routed through it is transformed in nature and timbre by an FX matrix combined with a spectral delay, and the plugin behaves more like a creative instrument than a traditional audio device.

  The XY pad at the centre carries a node that can be dragged or automated from the host to move between processing styles. FREQ sets the frequency and shape of the audio-rate modulation and HYPE sets modulation depth along with further parameters. The incoming signal is modulated at a very high rate, formant shifted, and then passed through a spectral delay line, which creates additional harmonics.

  The delay module carries TIME, MODE and FEEDBACK controls and returns audio to the main matrix to create shifting feedback. Delay time runs from 10 ms to 2 seconds with straight, triplet and dotted note divisions, MODE switches between free running and sync to the host project BPM, and feedback is adjustable from 0 to 100 percent. Uses range from rhythmic effects and ambient textures to vocal thickening and large synth echoes.

  A dice icon at the centre randomises the XY pad when a new starting point is wanted, and a Mix slider blends the processed signal with the source, covering subtle transformations through to fully modulated dub style results.

  Factory presets suit guitars, bass, drums, synths, vocals and almost any other material, ranging from gentle transformation to heavily mangled output.
specs: |-
  - Complex audio-rate modulation with formant shifting
  - XY pad matrix with FREQ and HYPE controls, automatable from the host
  - Creative spectral delay with time, mode and feedback controls
  - Delay time from 10 ms to 2 seconds, free running or host synced
  - Randomisation of the XY pad
  - Mix slider for wet and dry balance
  - Resizable interface
  - Pop and click free bypass
  - A/B copy and paste
  - Factory presets
  - Full PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Intel and Apple Silicon CPUs, with native AAX format
