name: Hot Tuna
manufacturer: blue-cat-audio
primaryCategory: tuner
url: https://www.bluecataudio.com/Products/Product_HotTuna/
description: Blue cat's Hot Tuna is a high precision chromatic tuner plug-in
  that can dim or mute the signal when active.
details: |-
  Hot tuna is a very simple yet powerful plug-in: you can freely adjust the
  amount of dimming, an indispensable feature for live gigs. The reference
  frequency can be changed (from 430 to 450 hz), when non-standard tuning is
  required.

  Most of the processing is performed in the background, so that the tuner does
  not impact the performance of the real time audio engine of the host.
specs: |-
  - High precision chromatic tuner
  - Signal dimming capability
  - Signal mute capability
  - Adjustable reference frequency (430-450 Hz)
  - macOS compatibility
  - Windows compatibility
  - Real-time audio engine processing
  - Background processing
