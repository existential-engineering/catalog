details: |-
  Advancer is a unique plugin that does the opposite of delay - it can shift sounds forward in time (with respect to other tracks in your DAW) by means of your DAW's latency compensation mechanism.

  Advancer further offers the ability to apply different timing to separate high and low frequency bands by means of the on-board linear phase crossover.

  Advancer can be used as a creative and correct tool suitable for: mixing - correct timing of distant microphones, add doubles and "pre-echo" flams, generate "jet plane" flanging effects, widen and generate stereo from mono sources, etc.

  Mastering - add "sweetening", help correct azimuth errors in tape dubs, etc.

  Free 14-day trial demos are available for download at the rj studios website.
specs: |-
  - 64-bit plugin
  - VST2
  - VST3
  - AAX
  - Audio Units (AU)
  - Windows 8+
  - Mac OS 10.11+
  - Intel and apple silicon
  - Metal graphics support
  - Forward time shifting up to 50ms
  - Linear phase crossover
  - 5 stereo operation modes (normal, mid, side, left, right)
  - Mono and stereo channel applications
  - Separate wet and dry mix controls
  - I/O trim control
