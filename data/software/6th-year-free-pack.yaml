details: |-
  To celebrate boyss-sound-e-scapes 6th year anniversary the 6th year free pack was released. It contains the first 6 kits (half) of the ambiloop live.

  Ambiloop live is a sample-based software instrument for ni kontakt (5.5 and up), sfz, or it can be used as a sample/loop pack. Its name comes from ambient live guitar (in this case) looper sessions.

  All samples were made using electric guitar and various effects. Ambiloop live explores the technique of asynchronous looping, which is layering tape loops of differing lengths, no bpm, all are non-synchronous loops.

  With that technique, it creates an ever-evolving soundscape when several tracks are played together.

  Content in detail: 6 kits (with 6 tracks in each) instruments for kontakt (full version, v5.5 and up *not player version*) and same in sfz format. 36 single instruments for kontakt and sfz. 36 wav loops (12 kits with 6 tracks each) 24-bit 44.1 khz. 217 mb unzipped.
