details: |-
  Audiocipher is a MIDI plugin that inspires producer workflows with quick,
  random melodies. Just type words into the app and drag them to a virtual
  instrument in your DAW to hear what comes out. Choose words with personal
  significance, like the names of your friends, or enter phrases that give you a
  theme to write around.

  With just a few clicks, you can select a key signature and rhythm that you
  want. Hit the random rhythm switch to audition different melodic patterns.
  When you're ready, click the drag-to-MIDI button and release it onto your
  virtual instrument track of choice. Edit your MIDI output in the piano roll to
  fine tune and sculpt the concept.

  Every word has a musical signature with audiocipher, meaning that every time
  you use a word in a certain key signature, the note sequence will be the same.
  In this way, the MIDI is not completely random. But you never know what you're
  going to get until you try a new word.

  Macos and windows. Standalone and vst3 files included. AU component for logic
  pro x users (macos only). Installation guide. Getting started guide. 3 encoder
  pdfs to understand how the audiocipher cryptogram works. 250+ MIDI files based
  on words organized by major/minor/chromatic.

  Standalone application features playback controls. The plugins do not include
  playback feature due to buffer / sample rate bugs triggered when DAW and
  system audio rates are mismatched.
specs: |-
  - MIDI plugin
  - macOS 10.11 or later
  - 2 GB RAM (4+ GB recommended)
  - Drag-to-MIDI functionality
  - Key signature selection
  - Rhythm selection
  - Random rhythm switch
  - Piano roll editing
  - Musical signature algorithm
  - Mobile and tablet devices not currently supported
