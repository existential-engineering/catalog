details: |-
  Blakus Cello is a collaboration with blake robinson, australian
  composer/cellist extraordinaire. The result is a huuuuge set of samples:
  expressive sustains, visceral harsh attacks, pizzicatos, tremolos... Along
  with a carefully prepared model for sul ponticello and con sordino with
  scripted legato.

  This cello will add an expressive edge to your music - and hopefully, add a
  bit of joy to your music-making life. Expressive, beastly cello with true
  legato bow changes and slurs.

  Blakus cello by embertone is a virtual instrument audio plugin and a software
  application and soundware (samples or presets that load into other products)
  for macos and windows. It includes, and is therefore powered by, kontakt
  player, which functions as an audio units plugin, a VST 3 plugin, an AAX
  plugin and a standalone application.

  The plugin features full vibrato control, emotional and immediate harsh
  sustains, speed-controlled portamentos, and staccatos with cc speed control.
  Bow noise control and custom-scripted ensemble mode are also included.

  Made for the free kontakt 5 player with nearly 6,000 unique samples and
  individual product watermarking.
specs: |-
  - Kontakt player
