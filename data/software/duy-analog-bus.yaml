description: DUY Analog BUS models the classical vintage mixing console buses
  within the digital domain. Extremely simple to use.
details: |-
  Main features: duy's classic valve and tape sound in a simple to use unit.
  Real vintage mixing console sound with the high dynamic range of digital
  systems. Suitable to add the maximum warmth to effects, music, and voices.
  Seamless, transparent and analog powered. Extremely easy to use. It just has
  one knob.

  This new version of duy's analog bus includes the 64-bit AAX, AU and VST
  versions for mac os x. El capitan, sierra, high sierra, mojave, catalina and
  big sur compatible. Pro tools 12 and 64-bit systems supported.

  In general, same system requirements as your host program. An ilok is required
  for authorization.
specs: |-
  - 64-bit support
  - Mac OS X 10.7 or higher
  - Ilok authorization required
  - Vintage mixing console emulation
  - Valve and tape sound modeling
  - Single knob interface
