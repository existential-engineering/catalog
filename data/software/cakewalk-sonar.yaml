details: |-
  Cakewalk Sonar is the classic powerhouse DAW, reinvented. It positions itself as the ultimate music production package for creative minds, combining advanced technology, an effortless workflow, and an interface designed to amplify inspiration.

  The DAW is built around the award-winning, fully customizable Skylight interface and offers unlimited Audio, MIDI, Instrument, and Auxiliary tracks per project. Under the hood, a transparent 64-bit audio engine drives production work alongside VST3 support, touch input, and other leading audio technologies.

  Sonar bundles a comprehensive instrument library so producers can build a song from the ground up without leaving the DAW, plus studio-quality effects with expandable ProChannel modules for channel-strip processing. VocalSync provides automated timing alignment between vocal tracks and double-tracking, and ARA (Audio Random Access) support enables seamless integration with compatible editing tools.

  Cakewalk Sonar is distributed through the Cakewalk Product Center launcher on Windows. The base DAW is free to download, with an optional BandLab Membership available as a pro tier with additional benefits.
specs: |-
  - Award-winning, fully customizable Skylight interface
  - Unlimited Audio, MIDI, Instrument, and Auxiliary tracks
  - Transparent 64-bit audio engine
  - VST3 plugin support
  - Touch input support
  - Comprehensive bundled instrument library
  - Studio-quality effects with expandable ProChannel modules
  - VocalSync audio alignment for vocal timing and double-tracking
  - ARA (Audio Random Access) support
  - Suggested Windows specs: Windows 11 or higher, 8-core CPU, 16 GB RAM, ASIO-compatible hardware
