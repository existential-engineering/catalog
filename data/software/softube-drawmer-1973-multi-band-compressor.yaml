details: |-
  From an era marked by sound experimentation, comes the Drawmer 1973 plug-in. The classic Drawmer three-band stereo compressor has been updated and faithfully modeled for superior sound quality, to the satisfaction of the legendary Ivor Drawmer himself.

  Steer the dynamics of your sound with absolute precision while maintaining that unmistakeable analog feeling. Presets allow you to hit the ground running while the incredible versatility of features, such as the three-way switch, let you manage every detail or go full-on experimental-mode. The Drawmer 1973 plug-in ups the wattage of your creative power, bringing a classic ethos to modern pro audio. Get down to the nitty-gritty, analog-style.

  Mastering with the Drawmer 1973 gives you independent control over three frequency bands, which is often a miracle-cure for problem mixes. Pull out individual instruments, brighten the mix, or tighten the lows. Or, by all means, do it all. The Drawmer 1973 is equally useful on single-sound sources in a mix: take away the boomy character of an acoustic guitar in a perfectly natural-sounding manner, control the low-frequency dynamics of a bass but leave its top-end alive and kicking, or remove sharp consonant sounds from a vocal track without eliminating detail and clarity.

  Modeled with the exquisite care and attention to detail Softube has become known for, it was created in collaboration with the Drawmer research and development team to make sure that the 1973's original designers love the final product just as much as Softube does. Officially licensed, fully-endorsed, and approved by Ivor Drawmer himself, the science behind the Drawmer 1973 plug-in brings the award-winning compressor up-to-date without a hint of compromise on that classic Drawmer sound.

  The plug-in stays true to the look and sound of the original hardware while packing heavy-hitting contemporary features behind the retro facade. Look for Mid/Side processing and sidechain to give you even more versatile compression and dynamic control. The product also supports Softube Extended Features, easy-access panels with the innovations you need close at hand.
specs: |-
  - Three-band FET compressor carefully modeled on the original Drawmer 1973
  - Officially licensed and created in collaboration with Drawmer
  - Gives you precise control of the sound source's dynamics
  - The look and sound of the original with extra features that bring it up-to-date
  - Added Mid/Side mode and sidechaining not available on the original hardware
  - Includes presets from the Drawmer S73 and more
  - Minimal latency and CPU load
  - Super-versatile for maximum creativity
  - Supports Softube Extended Features
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26; Windows 10 (64-bit), Windows 11
