description: The AUv3 plugin version of MIDI Guitar 3, distributed on the Mac App Store. Recommended for users who exclusively use Apple DAWs (Logic Pro, MainStage, GarageBand) and AUv3 plugins.
details: |-
  The AUv3 plugin version of MIDI Guitar 3 is distributed on the Mac App Store. If you exclusively use Apple DAWs (Logic Pro, MainStage, GarageBand) and AUv3 plugins, this distribution of MIDI Guitar 3 is recommended.

  It is AUv3 sandboxed, so it has more restricted access to macOS's file system and resources, and thus can only load third-party AUv3 plugins that also employ restricted sandboxes.

  Unlike the main MIDI Guitar 3 distribution when used in native Apple audio software, this AUv3 plugin version is entitled to directly access audio hardware, which makes it convenient to use hexaphonic pickup hardware within compatible DAWs.

  The macOS App Store delivers automatic update notifications so the latest version is always available. All Jam Origin plugins integrate with one another as native modules and extensions (JAM = Joint Audio + MIDI).
specs: |-
  - AUv3 sandboxed: more restricted access to macOS's file system and resources, and can only load third-party AUv3 plugins that also employ restricted sandboxes
  - Direct audio hardware access: entitled to directly access audio hardware, convenient for hexaphonic pickup hardware within compatible DAWs
  - Automatic updates: the macOS App Store delivers automatic update notifications
  - Distributed on the Mac App Store
  - Integrates with other Jam Origin plugins as native modules and extensions
