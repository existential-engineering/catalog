details: |-
  Multiband Expander is a processor to manage, suppress and control noise in tracks in a frequency-sensitive way.

  A 3-band phase-coherent crossover network directs the audio to three independent expanders, each configured to smoothly suppress noise below a specified threshold. The expanders can also be configured to change the feel of rhythmic patterns by suppressing elements that are played more softly, again in a frequency-sensitive way.

  Multiband Expander features SpectraFoo spectral analysis for zeroing in on crossover points and thresholds quickly and with confidence. The multiband design is useful for controlling noise and hum in guitar tracks, where the noise can be attacked more aggressively than the desired signal.

  The low, mid and high band expanders have independent controls with comprehensive linking between bands, a dynamic transfer function shows the overall response, and the gain reduction meters are scalable. Many presets are included, the UI size is adjustable with disclosable graphs, and the MH Preset Manager provides cross-platform presets.

  Version 4 adds a VST3 version on both macOS and Windows with native Apple Silicon support for VST hosts including Steinberg products. All v4 plug-ins add undo/redo, A/B snapshots with snapshot blend, software update tracking, more flexible resizability, common controls in the header bar, improved preset management, settings copy and paste between instances, a plug-in details pane reached from the MH logo, a smaller installer download on macOS, configurable themes, selectable knob styles and user preferences for band colors, UI colors and knob rings.
