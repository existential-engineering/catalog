description: PSP E27 is a multi-stage equalizer plug-in modeled after the famed analog E27 equalizer produced by Avedis Audio Electronics. It offers three-band equalization with nine selectable frequencies, +/-16dB of control at musically selected frequency ranges, and gentle saturation.
details: |-
  PSP E27 is modeled after the Avedis Audio Electronics E27 equalizer in a standard 500x package format. Features three-band EQ with nine selectable frequencies, +/-16dB control range, and gentle saturation. Low and high filters switchable between bell and shelf modes.

  Includes a preamp stage (PA11 module) for global level control. Features stereo and Mid-Side operation modes, and an x2 mode for layering two E27 modules. Accurately emulates the nonlinear behavior of analog devices.

  Also includes PSP E27se — a simplified GUI variant with the same audio engine and one E27 plus one PA11 module. Functionality approved by Avedis Audio Electronics.

  iLok License Manager required (no hardware dongle). 30-day trial available.
specs: |-
  - Formats: AU (macOS), VST, VST3, AAX
  - Platforms: Windows 7–11 (64-bit), macOS Intel/Silicon 10.14–15
  - Three-band EQ, nine selectable frequencies, +/-16dB per band
  - Bell and shelf modes for low and high filters
  - Preamp stage (PA11 module)
  - Stereo and Mid-Side operation
  - x2 mode (two E27 modules layered)
  - Includes PSP E27se (simplified GUI variant)
  - iLok License Manager required (no dongle), 3 activation locations
