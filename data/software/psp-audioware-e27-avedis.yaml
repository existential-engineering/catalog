description: PSP E27 is a multi-stage equalizer plug-in modeled after the famed analog E27 equalizer produced by Avedis Audio Electronics. PSP E27 offers three-band equalization with nine selectable frequencies in a standard 500x package.
details: |-
  PSP E27 is a multi-stage equalizer plug-in modeled after the famed analog E27 equalizer produced by Avedis Audio Electronics. PSP E27 offers three-band equalization with nine selectable frequencies in a standard 500x package.

  This equalizer offers +/-16dB of control at musically selected frequency ranges, and offers gentle saturation. Low and high filters can work in bell or shelf mode with a single click. The E27 EQ is suitable for both mixing and mastering and offers additional preamp stage for global level control. This EQ plug-in also accurately emulates the nonlinear behavior of analog devices.

  The additional PSP E27se (included in the bundle) is a simplified version of PSP E27. The PSP E27se is based on the same great audio engine, but it has a redesigned, simpler GUI making quick adjustments a snap. The PSP E27se is equipped with one E27 and one PA11 module.

  The functionality and sound of PSP E27 have been approved by Avedis Audio Electronics.
specs: |-
  - Three-band equalization with nine selectable frequencies
  - +/-16dB of control at musically selected frequency ranges
  - Low and high filters switchable between bell and shelf mode with a single click
  - Gentle saturation and emulation of the nonlinear behavior of analog devices
  - Additional preamp stage for global level control
  - Models the analog E27 equalizer in a standard 500x package
  - Includes PSP E27se, a simplified version with a redesigned GUI and one E27 plus one PA11 module
  - Windows: Windows 7 - Windows 11, 64-bit VST or VST3 compatible application
  - Windows: AAX requires Windows 7 - Windows 11 and Pro Tools
  - macOS Intel or macOS Silicon: macOS 10.14 - macOS 15 Sequoia, 64-bit AudioUnit, VST or VST3 compatible host application
  - macOS Intel or macOS Silicon: AAX requires macOS 10.14 - macOS 15 Sequoia and Pro Tools
  - Requires a free iLok user ID and the iLok License Manager application, no hardware dongle needed
  - License can be activated in 3 separate locations, each either a computer or an iLok dongle (2nd generation or above)
