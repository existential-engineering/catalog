description: Virtual analog synthesizer and sampler, the first with an HDR interface rendered in high dynamic range on macOS. Four layers, twelve oscillators including the JP-8080 Super 7 supersaw, 16 filter types (Nord Lead 2 Zero Delay Feedback, Moog Ladder, Oberheim SEM and others), PADsynth re-synthesis, SFZ/WAV/SoundFont support, Nord Lead 2 SysEx import/export, MTS-ESP micro-tuning, Markov chain arpeggiator, dual-core voice processing, 8x/16x oversampling, and 5,000+ presets across 100 banks.
details: |-
  12 total (includes Super 7 JP-8080 supersaw algorithm)

  128 voices

  16 types (Nord Lead 2 ZDF, Moog Ladder 24dB/12dB, Oberheim SEM, Phaser)

  Analog modeled, WAVE, PADSynth re-synthesis, Deep FM

  5,000+ across 100 banks

  8x/16x

  SFZ, WAV, SoundFont 2.04, Akai

  Markov Chain arpeggiator, graphic envelope editing, percussion mode with 10 drum kits, MTS-ESP micro-tuning
