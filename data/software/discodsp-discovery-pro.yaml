description: A Nord Lead-style virtual analog synthesizer with four layers, twelve oscillators, and sixteen filter types including Nord Lead Zero Delay Feedback, Moog Ladder, and Oberheim SEM. Features 128-voice polyphony, PADsynth re-synthesis, wavetable engine with SFZ/WAV/SoundFont support, and full Nord Lead SysEx compatibility.
details: |-
  12 total (includes Super 7 JP-8080 supersaw algorithm)

  128 voices

  16 types (Nord Lead 2 ZDF, Moog Ladder 24dB/12dB, Oberheim SEM, Phaser)

  Analog modeled, WAVE, PADSynth re-synthesis, Deep FM

  5,000+ across 100 banks

  8x/16x

  SFZ, WAV, SoundFont 2.04, Akai

  Markov Chain arpeggiator, graphic envelope editing, percussion mode with 10 drum kits, MTS-ESP micro-tuning
