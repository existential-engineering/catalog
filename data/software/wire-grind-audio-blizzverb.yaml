details: |-
  BlizzVerb adjusts wetness by altering the underlying acoustics model. The
  approach significantly improves realism over the commonly used wet/dry
  cross-faders.

  In measured room impulse responses, decay time depends on frequency. Blizzverb
  emulates this behavior by using a special frequency sculpting algorithm.
  Compared to simple lo-pass and hi-pass damping filters, the algorithm better
  fits the typical spectral-decay patterns seen in acoustic measurements.

  Blizzverb enhances stereo with two independent rendering models. One model is
  for headphones, and the other is for speakers. The models run concurrently,
  and they can be combined in any amount.

  Select from a pallet of 1,000 different rooms. Each room has a unique set of
  early echos, and this gives users the ability to fine-tune reverb
  characteristics such as temporal texture, stereo field, and coloration.

  The build-up of the early echos is based on geometrical acoustics theory. This
  results in reverberation that's realistic while not needing pre-delay
  adjustment.
specs: |-
  - Physically-informed wetness control
  - Frequency-dependent decay
  - Frequency sculpting algorithm
  - Stereo rendering for headphones and speakers
  - 1,000 rooms
  - Early echo build-up
  - Geometrical acoustics theory
  - Freeze functionality
  - Room size adjustment
  - Undo / redo
  - A / b settings toggle
