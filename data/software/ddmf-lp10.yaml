description: "A professional 10-band equalizer with double-precision 64-bit
  audio engine, free adjustment of phase response (linear phase, minimum or
  inverse minimum phase), and flex filters with continuous slopes from 6 to 60
  dB/oct."
details: |-
  10-band equalizer
  Linear phase, minimum phase, or inverse minimum phase modes
  Flex filters with continuous slopes (6-60 dB/oct)
  Pre/post spectrum analyzer
  True stereo operation (L/R or M/S modes)
  Stereo width control
  A/B state comparison
  Double-precision 64-bit audio engine
specs: |-
  - Double-precision 64-bit audio engine
  - Up to 10 bands
  - FFT algorithm with 2.7 Hz frequency resolution at 44.1 kHz
  - Flex filters with continuous slopes from 6 dB/oct to 60 dB/oct
  - Phase modes per band: linear, minimum, or inverse minimum phase
  - True stereo operation: Left/Right and Mid/Side modes
  - Stereo width control
  - Pre/post spectrum analyzer
  - A/B state comparison
  - Available in 32-bit and 64-bit formats (VST, AU)
  - Mac: OSX 10.7 or higher, Intel and Apple Silicon supported
  - Linux: ARM and x86_64 (VST3 only)
