description: The stunning sound of a 2nd Violin section - captured at Abbey Road Studios.
details: |-
  The stunning sound of a 2nd Violin section - captured at Abbey Road Studios. This virtual instrument offers key articulations and playing styles: lyrical and performance legatos, a wide selection of longs and shorts, and control over a variety of articulations, allowing you to create both intimate and epic soundscapes.

  Recorded in the timeless acoustics of Abbey Road Studio One, this library includes a hand-crafted mix signal by GRAMMY award winner Simon Rhodes.

  Realism at the highest degree.

  Do you already own an Abbey Road Orchestra Library? Log in to see your individual up-/crossgrade offer.

  Combine the 2nd Violins with the rest of the Abbey Road Orchestra: Symphonic Strings Core collection for the ultimate virtual string section.

  Want the best in expression, extended articulations, custom mic mixes and more? Check out Professional .
specs: |-
  - 2nd Violin section recorded in Abbey Road Studio One
  - 2 legato techniques: Performance Legato, Lyrical Legato
  - Long techniques: Long, Flautando, Tremolo, Harmonics, Trills (major and minor 2nds and 3rds), Measured Tremolo at 150 and 180 BPM
  - Short techniques: Spiccatissimo, Spiccato, Staccato, Marcato, Pizzicato, Col Legno
  - 1 signal: Mix 1 by Simon Rhodes
  - 3.9 GB download size
  - macOS 11 to OS 26, Intel and Apple Silicon supported
  - Windows 10 or 11 (64-bit)
  - Minimum 8GB RAM, 16GB recommended
  - Spitfire Audio App required for installation
