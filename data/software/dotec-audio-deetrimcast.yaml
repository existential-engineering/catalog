description: DeeTrimCast is an auto-leveling plug-in designed for broadcast and
  streaming applications that automatically maintains consistent output levels
  in the range of -12dB to +3dB regardless of input fluctuations. It includes a
  preamp, mute control, and is optimized for use with OBS Studio and similar
  streaming software.
details: |-
  DeeTrimCast is an automatic volume leveling plug-in developed by Dotec-Audio, purpose-built for broadcast and live streaming scenarios. It continuously monitors input levels and adjusts gain to deliver a consistent output within a range of -12dB to +3dB, helping streamers and podcasters avoid sudden level spikes or drops during recordings.

  The plug-in features a RATIO control that determines how aggressively the automatic adjustment responds to level changes, allowing users to dial in subtle gain riding or more immediate correction. An AUTO DETECT button provides one-click calibration of the noise floor sensitivity, making initial setup straightforward without requiring manual threshold adjustment.

  DeeTrimCast includes a built-in preamp section and a mute control, consolidating common broadcast channel-strip functions into a single lightweight plug-in. It integrates directly with OBS Studio as a VST plug-in, making it a practical choice for streamers who need transparent auto-leveling without switching to a dedicated hardware solution.

  The demo version inserts 1-second silence intervals every 30 seconds. Full activation requires an internet connection for registration. The plug-in has been tested with a broad range of DAWs and streaming applications including Ableton Live, Logic Pro X, Pro Tools, FL Studio, Cubase, and OBS Studio.

  The product launched in February 2021 and has received steady updates through April 2026, adding features such as RATIO and AUTO DETECT controls in v1.1.0, noise floor and sibilant processing refinements in v1.2.0, and Apple Silicon AAX support in v1.1.2. Sound design was by Franck Shigetora.
