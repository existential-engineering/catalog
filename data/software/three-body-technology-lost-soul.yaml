description: Lost Soul is the deepest sampled ancient Chinese Xiao in the world, diversify your ethnic library.
details: |-
  Lost Soul is a Chinese Xiao virtual instrument. The Xiao is a vertically played, membrane-less wind instrument made of bamboo whose deep, low sound is traditionally presented in court or ritual music and is commonly used in Chinese fantasy themes in contemporary work. Pieces for the Xiao are usually slow and smooth, but the instrument is also capable of fierce emotion through airflow attacks and vibrato. Of the three primary variants, Lost Soul presents the Dongxiao, the most commonly used one, rather than the deeper-sounding Nanxiao of southern China or the sweeter Qinxiao used to accompany the Guqin.

  The library holds 1,868 samples at 44,100 Hz / 24 bit, 3 GB in size. Five microphones in different positions were used during recording to capture the spatial and reverb characteristics of the Xiao, mixed down to four channels, Yin, Yang and far stereo, whose volumes are adjustable in the software to obtain a wide range of tones.

  Performance techniques such as attack, mordent, finger pole popping, trill, flutter, vibrato, staccato and gliss can all be triggered, and expressions are real-recorded and freely controllable through MIDI CC for tone changes that follow a real Xiao performance. Gliss uses real-recorded samples at two speeds plus a sample synthesis technique so that gliss speed is freely adjustable, and a self-developed, real-sample-based LFO engine provides vibrato that is both realistic and adjustable. Eight techniques of the Xiao are covered, drawn from traditional performance, film and television soundtracks and Chinese ancient-style songs.

  Legato was recorded between notes at three speeds and applied according to playing speed, and includes regular legato at fast, medium and slow speeds, popping legato and wuxia-style legato that switches between wuxia and non-wuxia styles by keyswitch. A spectrum fusion legato technology uses frequency-domain fusion instead of a naive time-domain cross-fade where necessary, avoiding the phase-cancellation problems that arise at the junction between two samples and smoothing the connection. The self-developed sampling engine adds disk buffer streaming, sample compression and sound fusion technology.

  Convolution reverb samples recorded at spectacular natural and historical heritage sites in China allow the instrument to be placed in spaces such as the Great Wall or the Terracotta Army site. An effect rack drawn from Heavier7Strings supplies compressor, EQ, chorus and ping-pong delay, and a pattern library with a rich set of presets can be extended by dragging MIDI clips in.
specs: |-
  - 1,868 samples
  - 44,100 Hz / 24 bit
  - 3 GB sample size
  - 5 recording microphone positions mixed to four channels (Yin, Yang and far stereo) with adjustable volumes
  - Real-recorded expressions controllable via MIDI CC
  - Real-recorded gliss at two speeds with adjustable gliss speed
  - Real-sample-based LFO vibrato engine
  - Legato recorded at three speeds, including regular, popping and wuxia-style legato
  - Spectrum fusion legato technology using frequency-domain fusion
  - 8 Xiao performance techniques
  - Convolution reverb recorded at Chinese heritage sites
  - Effect rack with compressor, EQ, chorus and ping-pong delay
  - Pattern library with MIDI clip drag-in
  - Minimum system requirements: Intel or AMD CPU with SSE 4.1 instruction set, or Apple chip
  - Minimum system requirements: Mac OS X 10.9 / Windows 7
  - Minimum system requirements: 4 GB RAM and 3 GB disk space
  - Plugin formats: 64-bit VST2, VST3, AAX and Audio Unit
  - Host requirement: Logic Pro X or higher (Logic 9 is not supported)
