description: "TrackLimit is a fully featured wideband limiter with intelligent
  dual-stage handling of transients and dynamics, designed for invisible
  limiting across tracks, busses, and premasters."
details: |-
  State-of-the-art peak limiter with low latency and low CPU usage. Dual-stage dynamic handling separates transients and dynamics for transparent results. Features inter-sample (true-peak) suppression, variable stereo linkage, style menu for limiting character options, gain-lock for preset auditioning, and zoomable PPM and GR meters. Minimalist UI with Mac Retina support. Windows (Vista/7/8/10, 32+64-bit): VST/VST3/AAX 32+64bit/RTAS 32bit. Mac (OS 10.7+, Intel and Apple Silicon): VST/VST3/AU/AAX 32+64bit/RTAS 32bit.
