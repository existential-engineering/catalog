description: TrackLimit is a fully featured wideband limiter with intelligent dual-stage handling of transients and dynamics, designed for invisible limiting across tracks, busses, and premasters.
details: |-
  TrackLimit is a fully featured wideband limiter with intelligent dual-stage handling of transients and dynamics. Just click and drag the threshold to hear your sound come alive.

  Our design goal was invisible limiting that could cover all bases, with low latency and low CPU. You can use it to transparently snip a few dB of peak of a channel that's triggering a bus compressor when it oughtn't, or you can use it to render out an awesome-sounding premaster.

  The Limitless engine was reworked into a wideband format, then further optimised to reduce CPU and latency; the end result is great limiting that's simple, quick, and won't tax your CPU.
specs: |-
  - State-of-the-art peak limiter with low latency and low CPU usage
  - Dual-stage dynamic handling separates transients and dynamics
  - Beautiful, minimalist user interface
  - Inter-sample (True-) peak suppression
  - Style menu provides quick access to useful limiting characters
  - Variable stereo linkage
  - Full gain staging on input, limiter threshold and output ceiling
  - Mac Retina support
  - Gain-lock to protect gain staging whilst auditioning presets
  - Zoomable PPM and GR meters
