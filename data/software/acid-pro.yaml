description: Digital audio workstation known for loop-based music production.
details: >-
  Acid pro is an audio plugin host for windows that can host VST plugins and VST
  3 plugins.


  Acid's much beloved chopper feature is extended by useful hardware
  compatibility. Trigger your chopped slices with a MIDI device of your choice
  and explore playable rhythms and fingerdrumming like never before.


  Over 9 gb in acid pro and over 15 gb in acid pro suite: acid 11 offers an
  inexhaustible supply of new sounds already included. Acid 11 features its own
  in-app store to provide you with the latest sounds of all genres, exclusive
  content and artist packs.


  Acid pro 11 has even more effects to shape your sound. From legendary autotune
  to ultra-modern eqs and innovative user interfaces.


  Independence pro sound library: up to 70 gb of meticulously sampled
  instruments, both acoustic and electronic - this one's for the sample freaks.
  Lose yourself in a world of sound and tweaking possibility right in your DAW.
