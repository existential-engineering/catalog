details: |-
  Free application to measure impulse responses. MlsTool has been replaced by IR Capture.

  MlsTool is an application used to measure impulse responses. It can measure the room reverberation of acoustical spaces, or measure digital effects units, speaker cabinets, and spring or plate reverbs. The impulse responses from MlsTool can be loaded into the Convology XT plug-in to reproduce the measured system. There is no purchase or registration required.

  On MacOS, MlsTool is distributed as a package installer in a DMG file. Open the DMG and then double-click on the PKG file to run the installer. On Windows, MlsTool is distributed as a zip archive containing the application and a PDF manual.

  After installing, run the application and select Audio Settings to choose the playback and recording devices. An external USB audio interface is recommended, and the same audio device should be used for both playback and recording so that the sampling clocks for D/A and A/D conversion are perfectly synchronized. After selecting the audio devices, choose an MLS length and click Start to begin the measurement. The app will play a few seconds of white noise, and will then write the measured impulse response to the file 'impulse.wav'.
specs: |-
  - Maximum-length sequence (MLS) measurement application
  - Measure up to 16 channels out x 16 channels in
  - 24-bit WAV, 16-bit WAV or ASCII text output files
  - Auto normalization option
  - Auto crop option
  - IR lengths from 255 samples to 1M samples
  - Supports ASIO devices
  - Supports any sampling rate provided by audio interface
  - An external USB audio device is recommended for both playback and recording
  - MacOS 10.8 and up, 64-bit only
  - Universal binary supports Intel x86 and Apple Silicon
  - Windows 7/8/10/11
  - MlsTool is a 32-bit Windows application
