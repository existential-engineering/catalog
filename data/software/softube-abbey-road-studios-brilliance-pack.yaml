description: An EQ plugin that can turn a so-so sound into a brilliant one.
  Three classic component-modeled analog treble equalizers from Abbey Road
  Studios. The Abbey Road Brilliance Pack by Softube adds sweet treble and
  presence without harshness.
details: |-
  Meticulously modeled by Softube, the RS127 Rack, RS127 Box, and RS135 deliver the sweetest treble equalization imaginable, the sound of real passive analog circuitry in all its glory.

  With the Brilliance Pack, today's DAW-based mix engineers can add all the air and sparkle they want, without the slightest trace of harshness, just like the world's top engineers at Abbey Road Studios, London, have done on their recordings from the 1960s onwards.

  The pack features the original grey RS127, the green RS127 with an added transformer, and the 8 kHz RS135. It is excellent for boosting presence in guitars, adds classy air frequencies to any vocal, brings drums to life (especially before tape or other compression and saturation), and can even be used on a master bus to gently add a musical sparkle.

  Two versions are included: Abbey Road Studios Brilliance Pack and Abbey Road Studios Brilliance Pack for Amp Room. The plug-ins are Console 1-ready and work in the Console 1 Mixing System.

  Tony Maserati, mixer for Jay-Z, Beyonce, James Brown and Jennifer Lopez, says: "Beautiful sounding EQs! I can get all of the sweetness without the harshness. With these EQs I can have my cake and eat it too!"
