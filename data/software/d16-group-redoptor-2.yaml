description: Vintage Tube Distortion
details: |-
  Redoptor is a high-quality vintage tube distortion emulator, precisely modeling the sensitivity, warmth, and character of real tube saturation found in analog circuits. The organic sound of a tube amplifier pushed into breakup has long been the gold standard for overdriven and distorted tones, and Redoptor captures the gentle, natural compression and rich blend of even and odd harmonics that defines it.

  Redoptor expands on classic tube guitar amplifier circuitry by offering total control of the preamp's frequency range, with optional pre/post insert points for the high and low cutoffs. A powerful 4-band parametric equalizer, with independent gain and frequency control for each band, replaces the fixed graphical EQ found on many typical amplifiers and emulations, giving unparalleled control over overdriven tones.

  Two studio essentials round out the gain-staging tools: a pre-gain compressor shapes the tube circuit's response by reining in peaks and lifting valleys, and a master output limiter tames fiercely distorted sounds before they leave the plugin.
specs: |-
  - Precisely modeled vintage tube distortion and saturation
  - Adjustable pre/post insert points for high and low cutoff frequencies
  - 4-band parametric equalizer with independent gain and frequency control
  - Pre-gain compressor for shaping the tube circuit's response
  - Master output limiter
