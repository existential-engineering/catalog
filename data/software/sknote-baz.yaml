description: Baz is a bass saturator, compressor and exciter. It is a simple but
  deep effect.
details: |-
  Frequency splitting divides incoming audio in low and high frequencies for
  separate processing and mixing. Input boost with automatic output compensation
  controls dynamics while keeping the output level constant.

  Level based compression provides multistage full band compression. Spectral
  based selective compression divides the bass range in bands and each band is
  limited to tame resonances often found in recorded bass.

  Low band drive introduces harmonics to modify the sound or translate low
  frequencies to more suitable range.

  Main uses on bass include taming resonances through spectral compression,
  leveling rms and adding sustain through full band compression, translating
  frequencies from low to mid-low band through drive, and sound processing and
  equalization.
specs: |-
  - Frequency splitting
  - Input boost with automatic output compensation
  - Level based compression
  - Spectral based selective compression
  - Low band drive
