description: >-
  'MFX motto' is a multi-effects plugin from ALM Busy Circuits, which brings the
  much lauded FX engines from our 'MFX' Eurorack Module, Guitar Pedal and
  Desktop plugins now to the iPad with the unique ability to now chain multiple
  effects. Inspired by our favourite classic hardware effects processors, the
  MFX motto incorporates DSP technologies from the dawn of digital effects in
  the 70s to the present day.
