description: Frostbite is a spectral freezing plugin combined with Ring Mod and
  Feedback. Transform any sound into ambient textures, soundscapes, or just
  frozen reverbs.
details: |-
  Frostbite is a spectral freezing plugin with a Ring Modulator and a Feedback module. With the four freezing modes (spectral, reverb, convolution, granular), you can transform any sound into ambient textures, soundscapes, or just frozen reverbs.

  Frostbite can also be used for extreme sonic experiments by entirely mangling any source with extreme modulations.

  The Signal Flow is flexible, you can rearrange the modules with a simple drag-and-drop, and select between the two modes: serial and parallel. With the internal LFO you can modulate most of the parameters on each module, creating evolving eerie soundscapes.

  The Freeze module has four freeze modes: Spectral uses FFT to store several analysis windows in memory and replay them randomizing their phases. Reverb is a classic reverb algorithm with multiple comb and all-pass filters that can have an infinite decay. Convolution multiplies the input signal with a randomly generated noise impulse, up to 60 seconds. Granular chops the input signal into small grains that are randomly processed.

  Frostbite 2 is available for macOS, Windows, and Linux (VST, VST3, AU, AAX, CLAP), and also as an AUv3 plugin and Standalone (IAA) on the App Store for iOS and iPadOS.
