description: A high-end, easy-to-use all-in-one software solution for cleaning
  up problematic and historic recordings directly on your PC, using restoration
  algorithms imported from Sound Laundry in a simplified one-window interface.
details: |-
  Sound Laundry compact edition is the high-end, easy-to-use all-in-one software
  solution intended for cleaning up problematic and historic recordings directly
  on your PC. It helps you remove or significantly reduce unwanted audio material
  while maintaining authentic sound without original quality degradation. The
  built-in algorithms are imported from Algorithmix's full Sound Laundry suite.

  This one-window version is designed for the multi-media user who does not want
  to spend hours learning complicated processing procedures, or the meanings and
  uses of never-ending parameter adjustments required by other professional
  software. Application-oriented De-Scratcher and De-Noiser presets, well-chosen
  parameter adjustments, and real-time performance are intended to deliver quick
  sonic results.

  Sound Laundry compact edition includes the most important restoration
  algorithms imported from Sound Laundry, namely the De-Scratcher, the
  De-Noiser, and the Analyzer. The De-Scratcher effectively removes clicks and
  crackles from old vinyl or shellac records. The De-Noiser targets tape hiss,
  noise from telephone-call cuts, or residual noise left after De-Scratcher
  processing. The Analyzer displays the frequency spectrum of two independent
  channels and noise profiles simultaneously.

  There is no preview button, because all signal processing calculations are
  done in real time during playback. A difference function allows the user to
  hear the noise being removed from the input, making parameter setup fast
  compared with non-real-time systems. Experienced audio restorers needing
  additional tools are pointed to the full PlugIn version of Sound Laundry.

  It is distributed by online order and is also available on CD-ROM, which also
  includes a special version of AlgoRec (a wave recorder) and AlgoTest (a sound
  card testing tool).
