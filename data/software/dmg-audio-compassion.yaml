description: "Compassion is a fully-featured dynamics processor, ready for any
  dynamic processing on any signal. Behind the UI lies perhaps the most
  flexible dynamics engine ever designed."
details: |-
  Compassion offers an unprecedented level of flexibility with multiple styles of dynamic processing — compression, expansion, upward expansion, and upward compression — all within a single, highly configurable dynamics engine. The plugin supports wet/dry (parallel/New York) compression, a Linear Phase Split EQ mode for dynamic EQ-style processing, and fully configurable detectors with M/S processing. Additional modules include a Transient Shaper and a Clip Limiter, with oversampling mode available for alias-free operation. The UI features two modes — Main for fast workflow and Advanced for fine-tweaking — along with a Mods system for rapid configuration, 8 banks of A/B comparison, a waveform/gain-reduction display, knee and response graphs, configurable VU metering with K-metering support, and a full preset management system with undo/redo.
