description: Compassion is a fully-featured dynamics processor, ready for any dynamic processing on any signal. Behind the UI lies perhaps the most flexible dynamics engine ever designed.
details: |-
  Compassion is a fully-featured dynamics processor, ready for any dynamic processing on any signal. Behind the UI lies perhaps the most flexible dynamics engine ever designed, allowing any channel and any task to be handled.

  It offers fully configurable topology to emulate any compressor style, along with compression, expansion, upward expansion and upward compression modes. A Linear Phase Split EQ mode enables dynamic-EQ-style processing, and fully configurable detectors support M/S processing. Transient Shaper and Clip Limiter modules are included, along with oversampling for alias-free operation and both signal path and sidechain EQs.

  The interface provides a large, intuitive waveform/gain-reduction display, knee and response graphs, an Advanced mode with dedicated pages for each section, and sidechain/signal-path EQ graphs. A configurable VU meter supports K-metering and variable ballistics. Workflow features include a Mods system for rapid configuration, 8 banks of A/B, full preset management, undo/redo, and a clip LED.

  Compassion was designed by Dave Gamble, who modeled a wide range of classic compressor circuits and unified them into one variable structure, allowing users to dial in designs anywhere between existing models.
specs: |-
  - Unprecedented level of flexibility
  - Multiple styles of dynamic processing available, with in-depth control
  - Advanced mode for fine-tweaking, Main mode for fast usage
  - Mods system for rapid configuration
  - Zero latency (with lookaheads and oversampling disabled)
  - Low CPU usage
  - Fully configurable topology; to sound like any compressor you want
  - Compression, Expansion, Upward Expansion and Upward Compression
  - Wet/Dry for "New York"/Parallel Compression
  - Linear Phase Split EQ mode for "Dynamic EQ" processing
  - Fully configurable detectors with M/S processing
  - Transient Shaper and Clip Limiter modules
  - Oversampling mode for alias-free operation
  - Signal path and sidechain EQs
  - Large, intuitive waveform/gr display
  - Knee and Response graphs
  - Advanced mode, with pages for each section
  - Sidechain and signalpath EQ graphs
  - Configurable VU, supporting K-metering and variable ballistics
  - 8 banks of A/B
  - Full preset management system
  - Undo/redo
  - Clip LED
