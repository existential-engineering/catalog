description: A vari-mu tube compressor plugin inspired by the Altec 436C. Creamy, gluing compression for mix bus, drums and vocals.
details: |-
  The OmniTec-436C is a vari-mu tube compressor built around one idea: compression you feel more than you hear. The original Altec 436C used a variable-mu (vari-mu) tube as its gain element, which means the amount of compression bends with the signal instead of clamping down on it. That's why it never sounds harsh. Push it hard and it doesn't spit, it thickens, mellows and pulls a mix together. Black Rooster modelled that behaviour, then added the modern controls the hardware never had.

  The 436C was the third revision in Altec's leveling-amplifier line, reworked in the 1950s with threshold control, fully parametrised attack and an optimised release so the unit behaved musically under stress. Geoff Emerick made it a go-to limiter at Abbey Road Studios, laying the groundwork for records by The Beatles, Herb Alpert and Frank Sinatra, and it spread through pop studios across the US and Europe. Its vari-mu circuit went on to inspire later units from the likes of Fairchild and Manley. Black Rooster rebuilt the gain stage and its tube-driven make-up amp as a living circuit, so the coloration shifts with how hard you drive it rather than sitting on a fixed curve.

  What you hear first is glue. A decent quantity of tube coloration is always present, yet it never overwhelms, the 436C consistently seems to hand a track exactly the right amount of cohesion. There's no ratio knob to fiddle with, the vari-mu curve is fixed and program-dependent, so you set how deep it bites with the Input (plus/minus 24 dB) and Threshold (-48 to 0 dB) instead, then recover level with Makeup (plus/minus 24 dB). The Mode switch picks how hard it clamps: Comp for a gentle, rounded knee, Lim for a firmer, faster grab on peaks. Shape the envelope with Attack (10 to 100 ms) and Release (250 ms to 2.5 s), and blend the compressed signal back against the dry with the Mix knob (0 to 100%) for parallel compression when you want density without losing transients.

  On the mix bus it's the classic move, a few dB of reduction with the Mix pulled back, and a loose collection of tracks suddenly reads as one record. On drums, the slow-ish attack lets transients through while the tails swell, giving you that big-room vintage punch. On bass guitar it adds weight and evens out fret-to-fret jumps; on vocals, strings and brass it sits a part forward with none of the edge a clean digital compressor can add. The two-band sidechain filter keeps low-end thump or harsh top from over-triggering the detector, and SC Listen lets you audition exactly what the sidechain hears.
