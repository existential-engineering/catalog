description: "16-band spectral designer that combines filter bank and spectral
  processor concepts into a single module. Functions as a vocoder, graphic EQ,
  VCF, and transient generator for percussion."
details: |-
  Two filter bank models: Vintage (based on 296r Spectral Processor) and Digital (ideal filters). 16 independent frequency bands with CV control. Spectrum transfer functions (even-to-odd, odd-to-even, AUX modulation). Master filter with lowpass/highpass/bandpass. Band envelope followers with adjustable decay. Real-time visual display with multiple modes.
specs: |-
  Requires VCV Rack 2.
