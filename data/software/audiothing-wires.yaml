description: Wires is an accurately modeled and enhanced 1970s Soviet wire
  recorder plugin made in collaboration with Hainbach.
details: |-
  German composer and YouTuber Hainbach opened his treasure chest for AudioThing: Wires is an accurately modeled and enhanced 1970s Soviet wire recorder. Made originally for military and secret service use across the Iron Curtain, in the hands of a few avant garde musicians it became a magical lo-fi tool and ghostly echo machine. Now this rare and rather finicky to operate piece of hardware is available for the first time as a faithful yet modern plugin.

  Great care was taken to get all the idiosyncratic behaviour exactly right: it reacts dynamically to the input and does things to audio that are a completely different texture to magnetic tape. There is a special tone to the hair-thin wire and the vacuum tube output stage of this machine. The standard way to make music with a unit such as this is to put it on an aux channel of a mixer, turning it into a fixed tempo echo. Wires offers all the variable time features you want, as well as the option to switch off the rather high noise floor of the machine without sacrificing its alive sound.

  Magnetic wire recorders went out of fashion after the advent of magnetic tape, surviving only in special operations such as flight recorders, space flight, or clandestine operations. The particular model modeled here, the MN61, comes from East German Army stock, and on the reels you could still hear traces of military operations.

  Wires was featured in the soundtrack for Alien: Romulus, composed by Benjamin Wallfisch. Based out of Berlin, Germany, collaborator Hainbach creates shifting audio landscapes and brings experimental music techniques to a wider audience through his YouTube channel.

  Wires is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP). It is also available on the App Store for iOS and iPadOS (AUv3 and Standalone).
specs: |-
  - Magnetic Wire Emulation
  - Up to 16x Oversample
  - Echo Section
  - Original Speaker and Mic Emulation
  - Start and Stop effects
  - Hiss and Motor noise with Envelope
  - Brightness and Contrast Controls
  - Resizable Window
  - Preset system with randomizer
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP 64-bit)
  - macOS 10.13 - macOS 15, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP 64-bit)
  - 1 license up to 3 computers, no iLok, no internet connection required to activate
