details: |-
  The synth features four oscillators with pwm, two resonant filters, and a
  ping-pong effects basis. Built-in effects include distortion, delay, and
  reverb to shape the sound.

  Beast includes 64 presets and comes with a manual that explains all the
  details of the synth. The interface features knobs and controls for
  programming, allowing users to create smooth bass tones or aggressive growling
  sounds.

  Modulation control from a wheel is available, enabling moog-style bass line
  playing. The synth is noted for its stability and ability to produce thick,
  detuned oscillator sounds characteristic of analog synthesizers.

  Beast is designed for rhythmic basslines and lead synthesis, capable of
  producing both clean pulsing warm basses and thick, dirty sounds using the
  distortion effect.
