description: Made in collaboration with XL Recordings' in-house producer-turned-composer Alex Epton (FKA Twigs, Björk, Arca), these post-industrial soundscapes offer a deep dive into the raw, chaotic nature of feedback. Discover an inspiring spectrum of disorienting sounds that create both dramatic impact and eerie beauty, sweeping synths, pulsing bass drones, multilayered sound design textures and distorted percussive elements which evolve, unravel or detune as you play, instantly sparking new ideas.
details: |-
  The New York-based engineer, producer and remixer is a highly skilled beat-maker and sound sculptor, whose hybrid sound is exemplified in his acclaimed soundtrack, created with Lucinda Chua, for documentary film 3OHA. Inspired by the experimental techniques of musique concrète, Entropy was made from a unique combination of modular synthesis, granular synthesis, found sounds fed through self-built gear and pedals, and IR reverbs.

  In Entropy, Epton captures the intrinsically chaotic nature of modular synthesis and feedback, without taming it, allowing disparate elements to co-exist, from the apocalyptic to the playful. These unpredictable sounds largely sit outside the parameters of conventional harmony and rhythm, instantly sparking creativity and adding extra dimensions to any genre or setting.

  Epton's approach to sound design is heavily influenced by the pioneers of electronic music and their processes, including Suzanne Ciani, Morton Subotnick and the BBC Radiophonic Workshop. Embracing the opportunity for sonic experimentation, he created these sounds from a unique collection of synths and 'homebrew' gear at his custom-built XL Recordings studio in New York. This includes a Verbos modular system with varying levels of feedback, organic percussion and found sounds processed through his custom-built distortion unit, self-built pedals and outboard gear, a variety of granular mangling tools, and his own impulse-response reverbs, featuring a unique chamber reverb captured in a giant abandoned oil tank, found in the basement of his studio building.

  The 29 presets are grouped into Synthetic (modular drones, sub bass variations, feedback and synth slabs), Sound Design (layered textures and warped processing) and Percussion (processed bass drums, paper snares and metallic percussion). Entropy runs in Spitfire Audio's own dedicated plug-in rather than Kontakt, so it loads directly in a DAW as VST2, VST3, AAX or AU.

  Spitfire Audio and Alex Epton are contributing 12.5% of ongoing library sales to AFRORACK, a Chicago-based audio arts organization dedicated to providing modular synthesis education for African American youth.
specs: |-
