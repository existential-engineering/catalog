details: |-
  Aether is built on the concept of limitless spatial design—a universe of sonic environments at your fingertips. Rather than giving you a limited set of reverb models or a few templated delays, aether offers thousands of unique spaces, each with infinite tonal variations.

  At its core lies a powerful algorithmic engine built from the dna of the most iconic time-based effects processors in history. With nearly 2,000 factory presets, aether delivers every type of echo, ambiance, and reverb imaginable.

  Advanced spatial control allows you to sculpt each environment with an independent 3-band eq and precise stereo field tools. The anomalia module adds subtle harmonic instability and movement for analog-style warmth and unpredictability.

  The infinity aether engine instantly generates a brand-new, randomized space with the click of a button. Wet/dry locking maintains consistent signal levels while browsing presets or using aether in send mode.

  Load custom spaces to import your own impulse responses or space models to craft reverb from scratch. The scalable ultra-hd gui is beautifully designed and optimized for 5k displays with dynamic resizing.
