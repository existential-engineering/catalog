description: 1bitdragon music creation software for windows, mac and linux
  1bitdragon is a small software that allows you to quickly create your own song
details: >-
  1bitdragon is a small software that allows you to quickly create your own
  songs in minutes. 1bitdragon is designed to be simple, instant and fun. It is
  possible to create a basic melody in a few steps, and to compose a song in a
  few minutes. You can record finished tracks and export them as wav.


  This software is great for electronic music, indie gaming music, chiptunes,
  and such stuff. 1bitdragon packs 175 "handmade" instruments and 150 drum
  sounds. It includes 396 ready-to-use patterns, 24 arpeggiator presets and 24
  scales.


  The euclidean rhythm generator is really fun, as is the integrated "live
  mode". This software is nice and easy to use. The settings are few and simple.


  1bitdragon can be used, for example, to teach children and beginners how a DAW
  works. The software runs on windows, linux and macos, and is very cheap.


  Simple enough someone brand new could pick it up in minutes but clearly
  thought out by a musician who added enough bells and whistles for the rest of
  us. It's surprisingly deep, hard to make it sound bad, a lot of fun.
