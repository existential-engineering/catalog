details: |-
  Compression has never been this easy. If you work with audio, you will eventually need a good compressor in your toolbox. Korvpressor is an adaptive compressor / limiter, designed for all purposes in audio treatment.

  It has a super-simple UI with a unique approach on how to tame and visualize a compressor, now also with some added controls to make it even more versatile. The basic controls are still minimalistic, set the input gain, level of compression, and the output gain.

  The compression algorithm was designed with transparency in mind, and Korvpressor is intended for any kind of sound, from a vocal track to a full blown mix. If you push it even harder, it gives a nice squeezing effect.

  The interface is built around five controls: Input level drags up to increase the input signal level, Squeeze is the main control (imagine pinching the sound waves, so the more squeeze you want, the further down you go with the handle), Output provides make-up gain after the squeezing, Post EQ is a musical and versatile EQ to fine-tune the result, and a set of switches adds control over the compression behaviour.
specs: |-
  - Recognized high quality compression algorithm
  - Unique and easy-to-use UI
  - Attack / Release time switch (three states)
  - Dry/Wet mix
  - Ratio switch (three states)
  - Maximizer Mode on/off (with a Make Up parameter knob if set to off)
  - Plenty of factory presets
  - Output brickwall limiter on/off switch
  - 3-band smooth EQ
  - Lookahead on / off
  - Requires macOS 10.10 or later (optimized for the M1-processor), Windows 7 (SP1) or later, running an AU, VST or AAX compatible 64-bit host
  - iPad version available as AUv3
