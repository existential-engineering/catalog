description: Two string instruments that form the basis for Portuguese and Latin American music, the fado guitar and cavaquinho especially are also featured in styles across the world. They form a beautiful and compelling pair for the ORIGINS VOL. 8 ethnic string plugin.
details: |-
  Two string instruments that form the basis for Portuguese and Latin American music, the fado guitar and cavaquinho especially are also featured in styles across the world. They form a beautiful and compelling pair for the ORIGINS VOL. 8 traditional strings plugin. The cheerful strums of the cavaquinho make for the perfect bed upon which lie the soulful melodies of the fado guitar.

  Traditionally performed in the dark city squares of Coimbra and Lisbon, fado is always accompanied by the metallic plucks and graceful slides of this special and timeless lute guitar. Also known as the Portuguese guitar, it has twelve steel strings set in pairs. With roots in old medieval music, it was played by troubadours and wandering musicians alike, spreading to the theater and taverns alike and now used not only in Portugal but across South America. Cavaquinho is the mother of a whole family of smaller-sized strumming instruments. It brought to the world the ukulele, and still serves as the primary bringer of joy and rhythm in songs across Latin America, especially in Brazil and Venezuela and very important in samba and choro music.

  The Multi-Arpeggio-Designer is the centerpiece of every ORIGINS instrument. Two fully customizable arpeggiators create interlocking patterns and broad soundscapes by combining the unique timbres of the two ethnic strings instruments. The engine is designed to convey a musically meaningful, human performance, instead of a computer randomly aligning notes. Load up one of 80+ inspiring presets or create your own arpeggios in as much detail as you like.

  The 12 individual color-presets provide even more possibilities to sculpt your sound. All colors are radically different in character and incorporate various effect settings and multiple impulse responses. While each MAD-Preset has an assigned color, you can combine everything at will, resulting in over 1000 predefined combinations. Arpeggio designs can also be copied and pasted between different instruments of the ORIGINS series.
specs: |-
  - Two individually playable instruments: fado (Portuguese) guitar and cavaquinho
  - Multi-Arpeggio-Designer (MAD) with two fully customizable arpeggiators
  - 80 rhythm presets
  - 12 unique color settings, combinable for over 1000 predefined combinations
  - Full customization of all controls
  - Arpeggio designs can be copied between different ORIGINS instruments
  - Requires FULL VERSION of Native Instruments' KONTAKT 6.6.1 or higher (the free Kontakt PLAYER only runs the instrument in demo mode)
  - macOS 10.13, 10.14, 10.15 or 11 (latest update), i5
  - Windows 7, Windows 8 or Windows 10 (latest Service Pack), Intel Core i5 or equivalent CPU, 2 GB RAM
  - 4 GB RAM (6 GB recommended for large KONTAKT Instruments)
  - At least 900 MB of free hard disc space
  - Available as a download
