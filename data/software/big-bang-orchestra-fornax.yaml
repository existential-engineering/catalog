details: |-
  Big Bang Orchestra: Fornax is a pitched percussion ensembles plugin by Vienna
  symphonic library (vsl) that expands the sonic spectrum of the big bang
  orchestra series with unique sounds of 3 grand pianos mixed with various
  percussion instruments, capturing the lively energy of up to six musicians
  playing together.

  For the pitched percussion library of bbo: fornax, vienna symphonic library
  recorded their three large concert grands—steinway d-274, bsendorfer imperial,
  and yamaha cfx—in combination with plate bells, tubular bells, gongs, pitched
  and unpitched drums and more to create epic sounds, from mysterious touches to
  bombastic eruptions.

  Bbo: fornax includes several set-ups categorized into low range and high range
  instruments. Low range instrument set-ups offer combinations of three pianos,
  plate bells, tubular bells, pitched gongs, taikos, timpani, and bass drum.
  High range instruments include plate bells, tubular bells, vibraphone,
  suspended cymbals, gongs, and triangle.

  As with the previous percussion recordings of the big bang orchestra series,
  up to six musicians played together in the large hall of synchron stage
  vienna, forming a well-balanced ensemble that created a fresh, yet beautifully
  blended sound. In addition to overhead microphones, decca tree and surround
  mics, the instruments were isolated during the recording sessions with close
  microphones while being played together in the ensemble, providing more
  control and creative options using the synchron player's internal mixer.

  The plugin is powered by synchron player, which functions as a VST plugin, an
  audio units plugin, a VST 3 plugin and an AAX plugin, and is compatible with
  windows 7/8/10 (64-bit) and macos 10.10 or higher, requiring 8 gb ram (16 gb
  or more recommended) and an AU/VST/AAX native compatible host.
