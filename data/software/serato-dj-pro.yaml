details: |-
  Serato DJ Pro is the industry-leading professional DJ software, renowned for reliability and performance power. It is one of the most popular DJ applications globally, trusted by professional DJs across Hip Hop, Dance, and other genres.

  The software provides dynamic waveform visualizations (horizontal and vertical), 4-deck simultaneous playback, a built-in sampler panel, and over 50 effects for creative mixing and performance.

  Serato Stems technology enables real-time separation of tracks into vocal, melody, bass, and drum stems for advanced mashups, acapellas, and creative routines.

  Streaming integration with Spotify, Apple Music, Beatport, SoundCloud, and TIDAL lets DJs access vast music libraries directly inside the application. DVS (Digital Vinyl System) support is available via the Serato DJ Suite subscription.

  Serato DJ Pro is compatible with 100+ officially supported controllers and mixers, and includes a Practice Mode for offline rehearsal, recording functionality, and live streaming workflows.
specs: |-
  - Dynamic waveforms (horizontal and vertical viewing)
  - 4-deck simultaneous playback
  - 50+ built-in effects
  - Serato Stems real-time source separation
  - Practice Mode for offline rehearsal
  - Sampler Panel
  - Music streaming integration (Spotify, Apple Music, Beatport, SoundCloud, TIDAL)
  - DVS capability (with Suite subscription)
  - Recording functionality
  - Compatibility with 100+ DJ controllers and mixers
