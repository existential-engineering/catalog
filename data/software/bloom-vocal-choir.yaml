description: A choir at your fingertips Bloom Vocal Choir presents you with a
  platform to piece together your own choir and dive deep into vocal harmony.
details: |-
  Bloom Vocal Choir presents you with a platform to piece together your own
  choir and dive deep into vocal harmony. Excite Audio sampled a wide range of
  different vocal registers from deep baritones through to the highest soaring
  sopranos. The in-built sequencer allows you to stack multiple vocalists to
  create interweaving harmonies no matter your music theory knowledge, giving
  you all the beauty of the human voice in one dynamic instrument.

  Excite audio's team of professional sound designers and producers created over
  250 presets organised into 8 different categories: basic (ba) - simple presets
  built from a single section of the choir. Drones (drn) - long, sustained
  notes. Experimental (exp) - abstract, sound design-focused, unique creations.
  Full ensemble (fe) - full choir ensembles using all vocal registers - soprano,
  alto, tenor & bass. High (hi) - choir samples & sequences in higher registers,
  built from sopranos & altos. Low (lo) - choir samples & sequences in lower
  registers, built from tenor, baritone & bass. Melodic (mld) - samples pitched
  in a scale across 2 octaves. Rhythmic (rhy) - focused on
  rhythmic/percussive/glitchy vocal chops.

  Start in your desired tempo, choose a sample bank or preset, and trigger one
  of 14 bpm-synced samples spread across two octaves. White notes set off choir
  samples and loops, while black notes alter properties like playback speed and
  pitch and trigger sequences and effect modulation. Four powerful macros
  control a specialised chain of effects, fine-tuned to the diverse samples that
  form bloom vocal choir.

  The edit page is the central hub for refining and making the library of
  samples your own. Adjust start and end points, manipulate playback speed and
  direction, and tweak the timbre with pitch and formant controls. Make the
  bloom instrument your own with the ability to drag and drop audio files into
  it. You can do this via the waveform view on the edit page or any empty slot
  on the banks page. Set the key and bpm of your samples to make them integrate
  seamlessly with the bloom engine.

  Unlike traditional sequencers, the bloom sequencer is designed for triggering
  and layering one-shots and looping sequences, allowing for endless rhythmic
  creation. In the modulation section, automate pitch, volume, and filter
  settings as well as three effects to add depth and dimension to your music.
  Bloom vocal choir offers three powerful effects modules: reverb to create
  space and depth using hall, plate and spring algorithms from the lifeline
  series. Delay to create hypnotic patterns and echos and doubler to fine-tune
  the stereo spread of your choir.
