description: >-
  Discover a vibrant world of sound with Life by XLN Audio. Record any moment
  and turn it into beats or re-invent existing audio using the Life DAW
  recorder.
details: |-
  Life transforms audio into original grooves. Record a sound or drop in a file and Life automatically turns it into a musical groove. It analyzes the sound's sonic qualities and turns it into beat slices, then creates completely new beats from those slices.

  Capture sounds with the Life mobile app and sync immediately to Life in your DAW. You can also record directly into Life, or use an existing recording or sample. Hit Randomize to get an endless supply of amazing beats, then tweak to perfection using Life's simple and powerful controls.

  Life makes rhythm creation effortless. It's the perfect source of inspiration, whether you're starting a song from scratch or need to add extra rhythmic sparkle to an existing track. From just one simple sound, Life gives you endless musical grooves.

  The Life 1.2 update offers sidechain ducking to shape dynamics by ducking sequencer lanes to the Kick, improved DAW audio recording with 30 seconds of buffered input, and offline functionality allowing Life to work with any file stored or recorded on your computer without an internet connection.

  The purchase includes the Life standalone and plugin software plus the Life Field Recorder mobile app for Android and iOS, with cloud storage for recordings and presets at no additional cost.
specs: |-
  - Audio-to-rhythm conversion engine that analyzes sonic qualities and creates beat slices
  - Beat randomization with endless groove generation from a single sound
  - DAW recorder plugin captures sound from any output in your project
  - Life Field Recorder mobile app (free, iOS 15.4+, Android 7.0+) with cloud sync
  - Cloud storage for recordings and presets included at no additional cost
  - Sidechain ducking of sequencer lanes to the Kick (v1.2)
  - Offline functionality for local files (v1.2)
  - Improved DAW recording with 30-second buffered input (v1.2)
  - Import audio and video files directly into the plugin
  - macOS 10.13 or later (64-bit), Windows 10/11 (64-bit)
