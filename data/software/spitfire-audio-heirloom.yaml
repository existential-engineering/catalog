details: |-
  From the mind of acclaimed artist Keaton Henson comes a compositional toolkit of unique, modern scoring sounds, bestowed to enhance your sonic fingerprint with a beautiful human touch.

  Heirloom features delicate strings, raw woodwinds, an inspiring piano and haunting guitars captured in London's stunning Church Studios (Adele, The XX. Nick Cave and the Bad Seeds). Inherently contemporary and perfect for emotive writing, this sound library is the audial equivalent of the worn away seat of your father's favourite chair. Traces, marks and imprints left behind by those who are perhaps no longer with us. Gone, but never forgotten.
specs: |-
  - 20 presets
  - 8 mic signals
  - 8 string players (3 violins, 2 violas, 2 cellos, 1 bass)
  - Woodwind including contrabass clarinet and Tubax, plus piano and guitar
  - Signals: Mix 1, Tape, Close, Mid, Far, Ribbon, Listener, Player, Pedal
  - Recorded at Church Studios, London
  - 34.2 GB download size
  - macOS 11 to OS 26, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
  - Minimum 8GB RAM, 16GB recommended
  - Spitfire Audio App required
