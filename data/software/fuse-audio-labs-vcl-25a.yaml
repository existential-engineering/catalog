description: An authentic emulation of a 1950s vari-mu audio leveler originally used in radio broadcasting, built around the 6386 dual-triode vari-mu tube. All aspects of the circuit including the transformers, phase inverter stage, 6386 vari-mu circuitry, output driver, and the time-constant network have been accurately modeled. Features input gain compensation, switchable release times, a linear output attenuator, adjustable noise floor level, and a mix control.
details: |-
  Emulates a 1950s vari-mu broadcast leveler built around the 6386 dual-triode tube (as used in units like the Gates Sta-Level, Collins 26U-1, RCA BA-25 family — Fuse Audio Labs does not name the specific hardware). Tube vari-mu compression with program-dependent smooth behavior. Circuit modeling: input/output transformers, phase inverter stage, 6386 vari-mu gain reduction, output driver stage, time-constant network. Added controls beyond original: input gain compensation, switchable release time constants, noise floor level adjustment, dry/wet mix, linear output attenuator.
specs: |-
  macOS 10.12+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+ (32-bit and 64-bit), 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX. Copy protection: serial number. 14-day trial available.
