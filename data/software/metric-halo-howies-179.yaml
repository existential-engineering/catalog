description: Howies179 is a recreation of mastering engineer Howie Weinberg's
  pair of NTP 179-120 compressor/limiters, from the details of the dynamics
  processing to the boxtone and distortion characteristics of his specific
  units. It presents a streamlined interface built around the range of settings
  he uses on them.
details: |-
  A common thread through thousands of masters and hundreds of Grammy nominations and wins is the sonic imprint of the NTP 179-120. The compressor/limiter has a mythical reputation and is basically unobtainable in modern times.

  Howie's 179 was made with mastering engineer Howie Weinberg to capture the essence and nuance of his personal 179-120s, from the details of the dynamics processing to the boxtone and distortion characteristics of his specific units.

  Based on a mastering career of more than forty years across all genres, Weinberg zeroed in on the range of settings that are the key to getting the most out of the processor, and the plug-in's streamlined interface takes that experience into account. It adds the controls needed to use the compressor/limiter in the box rather than in an analog loop, along with recallability and the ability to run on more than a single stereo pair.

  It is designed for producers, musicians, mix and mastering engineers who want a final layer of weight, smoothness and glue. Weinberg has used the 179-120 on over 2000 mastering projects, 76 of which have been nominated for Grammys and 20 of which have won.
specs: |-
  - Detailed model of Howie Weinberg's NTP 179-120
  - Add smoothness, weight and glue
  - Apply the analog saturation of Howie's units
  - World-class signal processing and workflow
  - Adjustable UI size
  - MH Preset Manager provides cross-platform presets
