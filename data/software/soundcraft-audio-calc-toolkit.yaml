details: |-
  The Soundcraft Studer Audio Calc Toolkit is an easy-to-use collection of audio tools for Audio and Music Industry Professionals. dBu - dBV - Volts Convertor: Convert levels between dBu, dBV and Volts. Audio Delay Convertor: Convert delay times to distance and vice-versa. Conversion between distance in meters or feet, time in seconds or milliseconds, and number of samples (can use different sample rates of 44.1,48 and 96kHz). Timecode Offset Calculator: Calculate the host/client timecode offset values from given timecodes. DISCLAIMER: The app is provided as a guide to audio calculations. Although we make every effort to fully test these tools for accuracy, users should not rely solely on the data contained within. Any and all liability arising directly or indirectly from the use of this application is hereby disclaimed. The information herein is provided "as is" and without any warranty expressed or implied. All direct, indirect, special, incidental, consequential or punitive damages arising from any use of this application or data contained herein are disclaimed and excluded.
