description: "Shape your sound with bX3 by Antelope Audio - a multiband
  compressor plugin with 3 independent bands, lookahead, peak/RMS detection, and
  flexible crossover control. Try free for 14 days."
details: |-
  bX3 is a flexible multiband dynamics processor designed for engineers who demand deep control without sacrificing transparency. Independent compression across three bands delivers precision, power, and musicality.

  Audio is split into three adjustable frequency ranges using steep, phase-coherent crossover filters. Each band is processed by its own compressor/limiter, allowing surgical control with no inter-band interference.

  Set individual Ratio, Attack, Release, and Knee Width for each frequency range. Use aggressive peak limiting on highs, soft RMS glue on mids, or subtle compression on lows - your dynamics, your way.

  Precisely set crossover frequencies with switchable 2 dB or 4 dB/octave slopes for smooth transitions and maximum tonal integrity. Toggle each band between Peak and RMS modes with independent response shaping. A global Lookahead function helps prevent harsh transients or clipping by anticipating fast signal peaks.

  Ideal for mastering, buses, vocals, or dialogue. Solo or bypass individual bands for pinpoint calibration, maximize loudness without distortion, and preserve the expressive dynamics of your performance. bX3 is part of the Antelope Cosmos plugin collection.
specs: |-
  - Three independently controlled frequency bands (low, mid, high)
  - Phase-coherent crossover filters with adjustable frequencies
  - Switchable 2 dB or 4 dB/octave filter slopes
  - Per-band Ratio, Attack, Release, and Knee Width controls
  - Per-band Peak and RMS detection modes
  - Global Lookahead function for transient/clip prevention
  - Solo and bypass per band for surgical calibration
  - Runs natively in your DAW on macOS or Windows
  - Part of the Antelope Cosmos plugin collection (75+ native plugins)
