description: A simple gain plugin with three range-configurable gain faders,
  per-fader toggle, sample peak meter, and multiple metering modes including
  LUFS.
details: |-
  Triple Fader is a straightforward gain control plugin featuring three
  range-configurable and automatable gain faders. Each fader has an independent
  toggle button for quick A/B comparison or bypass.

  The plugin includes a sample peak meter alongside a versatile level meter
  supporting multiple measurement modes: RMS at 0.3, 0.6, 1.0, and 3.0 second
  integration times, VU metering, LUFS Short-Term, and LUFS Momentary.

  High precision calculation ensures transparent gain adjustment without
  artifacts. The plugin supports sample rates from 44.1kHz to 384kHz with 64-bit
  floating-point internal precision.

  Triple Fader is offered as a free plugin, making it an accessible entry point
  to the A.O.M. product ecosystem.
specs: |-
  - Three range-configurable automatable gain faders
  - Per-fader toggle button
  - Sample peak meter
  - Level meter modes: RMS (0.3/0.6/1.0/3.0s), VU, LUFS Short-Term, LUFS Momentary
  - High precision calculation
  - Sample rates: 44.1kHz to 384kHz
  - 64-bit floating-point internal precision
