description: Triple Fader is a simple gain plugin. It has a triple of range-configurable gain fader. This is a free plugin.
details: |-
  Triple Fader is a free gain plugin from A.O.M. Corporation. It provides three gain faders in a single instance, each with a configurable range, so the fader travel can be matched to the amount of adjustment the task calls for.

  Every fader is automatable and carries its own toggle button, allowing a gain change to be switched in and out for comparison without resetting the fader position.

  Metering covers a sample peak meter alongside a level meter offering RMS at 0.3, 0.6, 1.0 and 3.0 second integration times, VU, LUFS Short-Term and LUFS Momentary.

  The plugin runs at sample rates from 44.1 kHz to 384 kHz with 64-bit floating-point internal precision and latency compensation, and supports factory presets, user presets, snapshots, undo/redo and reset to default.
specs: |-
  - Range-configurable and automatable gain faders
  - Per-fader toggle button
  - Sample peak meter
  - Level meter (RMS 0.3/0.6/1.0/3.0s, VU, LUFS Short-Term, LUFS Momentary)
  - High precision calculation
  - Supports 44.1k - 384kHz sample rate
  - 64-bit floating-point internal precision
  - Latency compensation
  - Factory preset, user preset, snapshot
  - Undo/redo, reset to default
  - Windows: x64-compatible CPU, Windows 11 24H2 / 25H2, VST2, VST3, AAX-Native, CLAP
  - Mac: Intel / Apple Silicon, macOS Monterey 12 through macOS Tahoe 26, VST2, VST3, Audio Unit, AAX-Native, CLAP
