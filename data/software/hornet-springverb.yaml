description: HoRNet SpringVerb is a spring reverb plugin that replicates the electro-mechanical stimulation of springs at various tensions.
details: |-
  SpringVerb is an algorithmic reverb plugin that recreates the physical interactions of a spring reverb. A spring reverb relies on electromechanical stimulation of springs at varying tension levels: the springs are driven by a transducer, causing them to vibrate, and the vibrations are converted back into an electrical signal by a pickup, producing a unique, sometimes metallic resonance.

  In recreating this vintage reverb, HoRNet focused on capturing the physical interactions between the springs and the transducers, as well as the electrical characteristics that give spring reverbs their tonal color, combining advanced research papers on physical modeling with custom algorithms.

  SpringVerb gives full control over the characteristics of the springs themselves. The intrinsic vibration time determines the length of the reverb, while the damping control affects how quickly the sound decays after the initial hit. The resonance control manipulates the self-resonance point of the spring, and the brightness control determines the highest frequency the spring can reach, together shaping the tonal color from metallic and clangy to smooth and warm.

  A dry/wet mix control blends the dry signal with the processed reverb, and a diffusion control adjusts the smoothness of the reverb, with more diffusion producing a lush, spacious sound and less producing a more focused, metallic one. The number of springs can also be adjusted: one spring gives a mono, bouncy, focused reverb, two springs give a stereo reverb with more depth, and three springs give a fuller, shimmering reverb with greater stereo width.
specs: |-
  - Physically modeled spring behavior
  - Up to three different springs
  - Complete customization of spring parameters
  - Custom reverb density for special reverb sounds
  - Dry / Wet mix knob
  - Resizable interface, hardware accelerated
  - Apple Silicon native support
  - macOS (10.11 and later) and Windows (Vista and later) support
  - 64-bit on Mac and Windows
  - Audio Units, VST, VST3 and AAX format
  - No copy protection
