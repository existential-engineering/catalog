description: Record in real-time with near zero latency using the Memory Cat
  Brigade effect from Antelope Audio's Synergy Core platform. A Bucket Brigade
  Delay emulation of the 1980 Electro-Harmonix Deluxe Memory Man pedal.
details: |-
  Bucket Brigade Delay emulation modeled on the 1980 Electro-Harmonix Deluxe Memory Man pedal, which combined Analog and Tape-style delay by reproducing Tape-like echoes using capacitors rather than magnetic tape.

  Antelope measured and recreated every single component of the original circuit, building the Memory Cat Brigade AFX from the original Deluxe Memory Man schematic for a faithful software emulation.

  Adds features beyond the original hardware: a maximum delay time of up to 1100 ms and a Filter knob for darker echoes, alongside the accurate recreation of every original parameter.

  Produces dark, lush tape-like delays with vibrant pitch-shifting vibrato and a rich, spacious chorus effect that sit naturally in a mix.

  Runs natively in your DAW on macOS or Windows, or in real-time on an Antelope Synergy Core interface with near-zero latency. Use with the AFX2DAW plugin to mix with up to 36 instances inside your DAW while running on Synergy Core hardware.

  Included in the Antelope Cosmos subscription (75+ Antelope Native Plugins).
specs: |-
  - Maximum delay time up to 1100 ms
  - Filter knob for darker echoes
  - Pitch-shifting vibrato effect
  - Spacious chorus effect
  - Up to 36 instances via AFX2DAW plugin
  - Near-zero latency tracking on Synergy Core interfaces
