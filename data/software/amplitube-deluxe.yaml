details: |-
  Take your playing to the next level with amplitube 4 deluxe. It gives you all
  the hyperrealistic tone and flexibility of amplitube 4 plus a ton of extra
  gear not found in the standard version for a grand total of 140 pieces of gear
  that includes amplifiers, cabinets, stompboxes, speakers, microphones, rack
  effects and more. And you get all this in addition to revolutionary features
  like amplitube 4's hyperrealistic cab room, dual 3d mic positioning,
  individual speaker selection, 8-track recorder, looper and ultratuner.

  Amplitube 4 deluxe includes all the gear models available inside amplitube 4
  plus an additional 101 pieces of gear for a total of over 140 models. You get:
  33 stompbox models including: acoustic sim, chorus, flanger, opto tremolo,
  delay, wah pedal, diode overdrive, compressor, graphic eq and more. 25
  amplifiers including: american tube clean 1, british tube lead 1, solid state
  bass preamp, jazz amp 120 plus 5 all new classic british amps and more. 29
  cabinets including: 4x12 brit 8000, 4x12 brit 9000, 4x12 red pig, 4x12 brit
  silver, 4x10 open vintage, 2x12 closed vintage, 4x12 closed vintage 1 and
  more. 29 vintage and modern individual speaker models 12 microphones
  including: double dynamic 57, dynamic 57, condenser 414, condenser 87 and
  more. 15 rack effects units including: digital delay, parametric eq, rotary
  speaker and more. 2 tuners: ultratuner plus a fully chromatic rack tuner.

  Industry-standard sound with dsm (dynamic saturation modeling) and vrm
  (volumetric response modeling) technologies for hyper-realistic emulation of
  real world gear and the best sounding models. Dynamic response modeling
  provides real amp response and feel models dynamic relationship and
  interaction between power amp and speakers, plus physical and harmonic
  interaction between individual speakers, cabinet and room construction and
  mics.

  Perfect as a plug-in for studio recording and mixing in any mac/win DAW,
  native compatibility with 64-bit applications and operating systems. Also
  perfect for live performance thanks to the standalone version with instant
  preset switching via MIDI control. Highest supported sampling rate: 96 khz.

  8-track built-in multitrack recorder and DAW enables you to quickly capture
  ideas or even record a full 8-track composition in the standalone application
  without the need to open a DAW and with the convenience of amplitube superior
  quality audio processing. 4-track looper for capturing and layering ideas
  quickly and easily. Export loops to hard drive and import into the DAW
  section, import audio to track 1 in looper for playing over backing track
  loop. Imports any wav, aiff, sd2, apple caf, flac, mp3 audio file (standalone
  version). Speedtrainer for speeding up/slowing down imported tracks without
  affecting the pitch the perfect tool for practicing and improving your
  instrument skills or learning your favorite riffs and solos (standalone
  version).
