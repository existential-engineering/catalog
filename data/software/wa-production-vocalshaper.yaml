description: VocalShaper is a modular vocal processing plugin built around a pink noise leveler, a noise cleaner, vocal-tuned compression, dynamic mud removal, linear sibilance control, an air band and a vocal-focused tone section. It is intended as the first plugin on a vocal chain.
details: |-
  VocalShaper is a multifunctional modular vocal plugin created in collaboration with audio engineer Emrah Celik. It spans dynamic cleaning through to precise sibilance control for sung and spoken word, and is intended to be the first plugin on a vocal chain, ahead of delay and reverb.

  The Leveler uses pink noise to continuously adjust vocal amplitude for a consistent performance. The Cleaner stage removes background noise, headphone leakage and intrusive breath sounds, with adjustable sensitivity for different recording environments. The compression knob is based on a classic compressor design optimised for vocals and can be driven from the Leveler or directly from the recording, covering subtle natural compression through to aggressive punchy dynamics.

  Demud is a pitch-tracking low resonance remover operating between 60 Hz and 360 Hz. It dynamically targets and reduces unwanted low resonances, adjusting the amount of reduction automatically, with sensitivity available for fine-tuning. S-Volume provides linear control over sibilant sounds rather than conventional de-essing, and a Listen button auditions the exact signal being affected.

  The Air control acts as a finely tuned exciter for vocal brilliance. The Tone section affects the body of the vocal and not its sibilance: a Cut knob trims low frequencies, Low and LowMid add body and punch, Mid adjusts muddiness and High tweaks brilliance. Depth applies a boosted version of LA opto compression processing, Heat introduces harmonic complexity and warmth, and Spread is a micro-pitch-shifter that widens the stereo image.

  The interface is built on vector graphics and is resizable, with a central window displaying live audio as it travels through the plugin. A/B comparison and undo and redo buttons allow processing chains to be contrasted and reverted, and a large library of factory presets covers many genres and processing styles.
specs: |-
  - Modular vocal processing toolkit
  - Leveler using pink noise to adjust vocal amplitude
  - Cleaner stage with adjustable sensitivity
  - Vocal-optimised compression knob
  - Demud pitch-tracking low resonance remover operating between 60 Hz and 360 Hz
  - S-Volume linear sibilance control with Listen button
  - Air exciter control
  - Tone section with Cut, Low, LowMid, Mid and High knobs
  - Depth, Heat and Spread controls
  - Clear and precise frequency display
  - A/B comparison and undo and redo
  - Resizable vector interface
  - Responsive and CPU friendly
  - Genre-spanning factory presets
  - Full PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Intel and Apple silicon CPUs, with native AAX format
