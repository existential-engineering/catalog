details: |-
  Atma is a collection of sacred sound instruments obtained by award-winning
  founder & composer, brian d'oliveira, during his many pilgrimages to holy
  sites around the world.

  The instruments range from ritual healing bells to pitched aztec volcanic
  rocks, creatively sampled to explore the potential of the powerful nonlinear
  sound-design engine mndala 2.

  Atma by mntra is a virtual instrument audio plugin for macos and windows,
  powered by mndala 2, which functions as an audio units plugin, a VST 3 plugin
  and an AAX plugin.
