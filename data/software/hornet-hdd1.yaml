description: HoRNet HDD1 is the emulation of a guitar digital delay pedal used by many musicians also with other instruments for its characteristic sound
details: |-
  HoRNet HDD-1 is an emulation of the very first digital guitar delay pedal. This iconic guitar effect was created during the early 1980s, a time when digital technology was becoming more affordable and accessible to musicians. As a result, it opened up new creative possibilities in sound design and became a defining effect for many musicians during that era. The HDD-1 plugin not only recreates the original sound of these early digital delays but also adds modern features to enhance flexibility for today's musicians. This plugin is a powerful tool for both those who seek vintage tones and those who want to explore lo-fi, experimental soundscapes.

  One of the standout features of the HDD-1 is its internal architecture. The pedal uses a 12-bit ADC (Analog-to-Digital Converter) to capture and store sampled audio in RAM banks. The 12-bit resolution contributes to the lo-fi character of the delay, producing a sound that is often more gritty and raw compared to modern digital delay effects, which typically use much higher bit-depths. Despite this digital sampling, the rest of the circuit is entirely analog. This hybrid approach, digital for the sampling and analog for processing, gives the plugin a unique character. When the signal passes through the feedback loop, it becomes progressively more degraded with each repetition, which creates a warm, somewhat distorted sound.

  The frequency response of the HDD-1 is also part of what makes it stand out. Unlike modern delay units that are often designed to have a flat frequency response, the HDD-1 has a sharp cutoff at 7 kHz. This results in a mellow sound, as the higher frequencies are gradually attenuated with each delay repeat. In addition, the pre-emphasis and de-emphasis filters play a crucial role in shaping the overall tone. These filters were essential in the original hardware design to balance the frequency response of the delay.

  In addition to its unique sound, the HDD-1 also replicates the inherent analog saturation and hiss that was present in the original hardware. The slight background noise and saturation add to the vintage character of the plugin. However, because some users may not always want this extra color, there is an option to turn off the hiss and saturation separately.

  The stereo mode splits the signal so the dry signal is routed to the left channel while the wet signal is sent to the right, creating a sense of width and space. With delay times between 12.5 ms and 50 ms this produces a pseudo-stereo effect using the Haas effect. Hold mode records the last 200 ms to 800 ms of audio while the effect is off and repeats it once the delay is turned on, creating looping or stuttering textures. Sync to host tempo locks the delay time to multiples of 16th notes in the DAW.
