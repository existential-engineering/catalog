details: |-
  Amber 4 ultra is the latest acqua plugin suite (VST/vst3/AAX/AU) based on the third-generation hyper technology and the new 'aria' engine. It represents one of the best high-quality plug-in suites in the acustica domain for the most demanding mixing and mastering engineers.

  With this alternative amber 4 ultra release, acustica aims to present the exceptional and now renowned amber4 plugin suite in an enhanced graphic form, sound improvements meeting acustica's latest quality and performance standards, which we could summarize in one word, ultra. It encompasses the new 'aria' engine supporting our new eq, dynamic and real-time metering displays, our powerful "anti-aliasing" algorithm with reduced cpu consumption.

  Amber4 ultra: a pure class a music equalizer, re-designed with our hyper eq tech to deliver sonic excellence with very low cpu usage. It could be ranked as one of the most powerful, low-noise parametric eqs available in the digital domain.

  Amber4 stereo ultra: a pure, 100% discrete class a stereo equalizer, re-designed with our hyper eq tech, characterized by an ultra-inspired design optimizing absolute signal integrity. It can be considered one of the most musically transparent analog eqs in the acqua effects plugin domain.

  Amber 4 comp ultra: a pure class a opto-compressor, a very transparent, dynamic processor emulation designed to optimize absolute signal integrity and musical performance improved by our hyper tech. Amber 4 pre ultra: the complete collection of pure class a preamp emulations (solid state and vacuum tubes) derived from several units from the same iconic brand for a total of 8 different choices (totally re-sampled) and improved with our hyper tech.
