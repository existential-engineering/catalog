description: The Hughes & Kettner Coreblade plugin from NEMBRINI is a digital
  replica of the original Coreblade amplifier. Designed to meet the demands of
  modern metal guitarists, it combines a brutal tone, untamed dynamics and an
  explosive punch with amazing flexibility.
details: |-
  Renowned for its uncompromising tone and cutting edge flexibility, the original Coreblade redefined what a modern tube amp could be. The plugin captures every detail of the Hughes & Kettner Coreblade amplifiers personality from pristine cleans to face-melting high gain, complete with effects and advanced features for serious players.

  The new Hughes & Kettner Coreblade plugin has four fully independent channels, each with its own character and tone shaping circuitry. The intelligent design of the plugin let users sculpt their sound with surgical precision using integrated effects. The new plugin delivers the same thrilling sonic experience as the original amplifier with professional-grade tone, intuitive control and seamless integration into the recording environment.

  The Pre-stomp Section of the plugin includes a Noise Gate to eliminate unwanted noise, Filters for precise tone shaping, a Doubler to create wide stereo from a mono guitar signal and a Screamer overdrive to sculpt tone. The Cabinet Emulation seamlessly integrates with modern Impulse Response cabinets to deliver authentic speaker simulation for a realistic playing experience. Plus, the Effects Section has a Studio Compressor to control dynamic range and a graphic-parametric Equalizer for precise tonal shaping.
specs: |-
  - Amplifier section: four versatile channels with high gain tone shaping
  - Cabinets & impulse loader: 6 carefully selected cabinet emulations and an impulse loader to load favorite IRs
  - Pre-amplifier stomp effects: noise gate, filters, screamer and doubler, all draggable for flexible routing
  - Post-amplifier effects: graphic parametric EQ and studio compressor, with draggable effects for flexible routing
  - Standalone version included, allowing use without a DAW
  - System: Intel compatible or Apple Silicon CPU, 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW, VST2/VST3/AAX/Audio Units compatible host
