details: |-
  Loom ii is an award-winning modular additive synthesizer with a shape-shifting
  morph pad that makes it easy to create rich, swirling and captivating sounds.
  The programmable morph pad brings your loom ii patches to life by morphing
  between user-defined variations of your patch, adding motion and momentum that
  continuously evolve.

  Hybrid 3.0 is the next generation in synthesis. This high-definition virtual
  synthesizer combines the coveted warmth of analog synths with a full range of
  futuristic digital manipulation capabilities. The result is the best of both
  worlds a virtual instrument with a comprehensive set of precisely adjustable
  parameters that can sound like a synth you remember or something no one has
  ever heard before.

  The riser is an all-new instrument for designing musical transitions of epic
  proportions. A powerful, synth-based instrument, the riser features all of the
  tools you need to compose heart-stopping transitions in one intuitive
  user-interface. In seconds, you can construct rises, falls, swells, fades, and
  more, based on our coveted sound synthesis technology.

  Loom ii has been expanded to 8 voices by popular request. Spectral noise
  section allowing a secondary oscillator to replace or enrich the additive
  spectrum with a noise spectrum. 4 new modules. 2 additional subharmonic
  optional partials bellow the normal spectrum. Enhanced morph pad options. 500
  all-new patches covering a wide range of sounds designed by acclaimed sound
  designers richard devine and mark ovenden. All original 350 patches
  re-mastered taking advantage of the new features.

  Hybrid 3 is a six-oscillator subtractive and wavetable virtual synthesizer
  with 1200+ inspiring presets. Comprised of two simultaneous parts, each loaded
  with 3 oscillators and a sub-oscillator, filters, lfos, envelopes, and effects
  for creating complex patches. All-new doubling controls for quickly thickening
  and widening patches. Revamped step sequencers allow you to link steps
  together for rhythmic variation, syncopation, and advanced modulation
  patterns. All-new oscillator restart for punchy bass sounds, runs, and
  sequences. Dual series or parallel filters with vintage voltage controlled
  filter modes for retro synth sounds.
