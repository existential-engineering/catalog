description: "Origins Vol. 9: Ronroco & Bouzouki is a deeply sampled Kontakt instrument that transports the user to the vast and beautiful landscapes of Patagonia and the wild taverns of Aegean towns. The plugin combines two individually playable ethnic string instruments—the Andean Ronroco and the Greek Bouzouki—with a Multi-Arpeggio-Designer featuring 80+ rhythm presets."
specs: |-
  - Requires full version of Native Instruments Kontakt 6.7.1 or higher
  - Storage: 610 MB minimum free disk space
  - RAM: 4 GB (6 GB recommended)
  - macOS: 10.14+ (Intel); 11–12 (Apple Silicon via Rosetta 2)
  - Windows: 10 or 11, Intel Core i5 or higher, 2 GB RAM
  - Graphics: OpenGL 2.1 or higher
  - Two individually playable instruments (Ronroco & Bouzouki)
  - Multi-Arpeggio-Designer (MAD) with 80+ rhythm presets
  - 12 unique color settings for sound customization
  - Rhythm presets in Normal (4/4) and Odd time signatures (5/8, 7/8, 3/4, etc.)
