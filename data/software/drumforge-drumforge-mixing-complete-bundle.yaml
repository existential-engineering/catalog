description: Drumforge Mixing Complete Bundle Elevate your drum mixing to a new level with the Drumforge Mixing Complete Bundle. This all-inclusive collection, now available at an incredible value, merges our top-tier drum mixing tools into one powerhouse package.
details: |-
  The Drumforge Mixing Complete Bundle combines nine top-tier drum mixing plugins into one powerhouse package.

  Drumflex is a streamlined drum processing plugin with specialized modes for kick, snare, toms, and drum bus, featuring analog-emulated EQ and compression.

  DF-XCITE 2 is a multiband harmonic exciter with six saturation models, instrument-specific presets, and flexible crossover options for warmth, bite, and clarity.

  DF-COMP 2 provides intuitive compression and transient shaping with 10 dedicated modes and 3 compression styles (Soft, Medium, Hard).

  DF-CLIP 2 is a multi-band clipper for adding clarity and punch through peak clipping and targeted frequency shaping.

  DF-CLARIFY 2 enhances transient definition and eliminates muddiness with advanced processing algorithms designed for drums.

  DF-TRANSIENT 2 allows precise transient sculpting to soften or accentuate drum attacks for a polished, professional sound.

  DF-Q2 is a drum-focused EQ bridging technical precision and musicality with classic EQ curves and dynamic EQ modes.

  DF-SMACK delivers precision transient shaping with Smack, Tight, Edge, Boom, Shine, and Ring controls plus input-dependent saturation and hard clipping.

  Arcus is an ambient envelope shaper with dual ADSR envelopes across two frequency ranges, triggered by audio, sidechain, or MIDI.
specs: |-
  - Includes 9 plugins: Drumflex, DF-XCITE 2, DF-COMP 2, DF-CLIP 2, DF-CLARIFY 2, DF-TRANSIENT 2, DF-Q2, DF-SMACK, Arcus
  - macOS 11+ (64-bit): VST3, AU, AAX
  - Windows 8.1+ (64-bit): VST3, AAX
  - Mac Intel and Apple Silicon compatible
