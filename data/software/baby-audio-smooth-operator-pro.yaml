details: |-
  Smooth Operator Pro is a spectral signal balancer and dynamic resonance suppressor plugin designed for achieving clarity in mixes. It provides powerful controls for removing bloated frequency energy from tracks, capable of fixing problem areas or reshaping tonal balance entirely.

  The plugin features per-node frequency override capability, sidechain mode for track interaction, and linear phase processing. It also includes stereo field sculpting with L/R and M/S imaging options for precise spatial control.

  Smooth Operator Pro comes with 184 presets crafted by professional engineers, Auto-Gain compensation, and adjustable Lo/Hi Preserve filters accessible directly from the frequency display.
specs: |-
  - Spectral signal balancing with dynamic resonance suppression
  - Per-node frequency override capability
  - Sidechain mode for track interaction
  - Linear phase processing
  - Stereo field sculpting with L/R and M/S imaging
  - Auto-Gain compensation
  - Lo/Hi Preserve filters adjustable from frequency display
  - 184 presets by professional engineers
  - Native Apple Silicon M-Chip support
  - 64-bit only
