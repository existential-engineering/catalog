details: |-
  Tube Glow EQ Pack is a bundle of three tube-EQ emulation plugins from Antelope Audio, each modeled after some of the most well-known tube equalizers ever made. The pack is intended for tracking, mixing, and mastering, and it sits within the wider Antelope Cosmos ecosystem of 75+ native plugins.

  VEQ-1A (2-Band Tube EQ): This two-band EQ allows for the simultaneous cut and boost of the same frequency, the so-called Pultec EQ trick, which gives the sound a unique quality you can't get with another EQ. Massive bass, gentle highs, and analog richness - these knobs surely do some vintage magic.

  VEQ-HLF (Tube 2-Band HPF / LPF): VEQ-HFL is a simple but effective unit for passive low and high cut-off filtering, perfect for eliminating undesired frequencies or for adding a true vintage analog color to your production.

  VMEQ-5 (3-Band Tube Mid-Range EQ): VMEQ-5 was modeled after the most essential mid-range EQ of the past 60 years. It's the go-to tool for enhancing guitars and vocals, which will add true vintage punch whether you're tracking, mixing, or mastering.

  Like all Antelope FX, the plugins in this pack run natively in any major DAW on macOS or Windows, and in real-time on Antelope Synergy Core audio interfaces.
specs: |-
  - Bundle of three tube-EQ emulation plugins (VEQ-1A, VEQ-HLF, VMEQ-5)
  - VEQ-1A: 2-band Pultec-style tube EQ with simultaneous cut/boost at the same frequency
  - VEQ-HLF: passive 2-band HPF/LPF tube filter unit
  - VMEQ-5: 3-band mid-range tube EQ
  - Runs natively in your DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core audio interfaces
  - Part of the Antelope Cosmos 75+ native plugin ecosystem
