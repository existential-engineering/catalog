description: Indian musical heritage with modern production step into a world
  where tradition meets innovation with Bloom KSHMR. Crafted in collaboration...
details: |-
  Bloom KSHMR is an expressive instrument crafted in collaboration with
  globally-acclaimed producer and sound designer kshmr, seamlessly blending
  indian and south asian musical heritage with modern production. The plugin
  features over 250 presets with a rich tapestry of drum circles, tablas,
  sitars, bansuri flutes, and expressive vocal performances, each sound
  royalty-free and infused with kshmr's unmistakable flair, channeling the sound
  of india, south asia, and bollywood-inspired orchestration.

  Kshmr himself carefully curated every sound in bloom kshmr, collaborating with
  talented instrumentalists who captured recordings throughout india and the
  wider south asian region using a blend of high-end analog gear and
  contemporary production techniques to preserve raw character while enhancing
  sonic depth. Inside bloom kshmr, you'll find a wide range of instruments
  including light percussive tablas and dhols through to massive bollywood-style
  drum circles, a variety of bansuri flute loops and one-shots, strummed and
  stringed instruments including sitars, rababs and ouds as well as a variety of
  authentic and expressive vocal loops.

  On the main page, users can trigger individual sounds with white notes and
  launch phrases or tweak properties with black notes. Four powerful macros
  (lo-fi, drive, slap delay & multi delay) let you shape your sound, while a
  range of 250 presets get you moving fast. There are eight banks of sounds to
  choose from - organised into easy to find categories. Users can swap sounds by
  loading a new bank or dragging individual samples onto the 14 white notes for
  instant variation.

  The edit page allows users to go deeper into programming entire sequences,
  chopping up hits and loops and using custom samples. Bloom kshmr's edit page
  houses parameters like playback type and direction, attack and release, pitch
  and panning and everything else you'd expect in a modern sampler. Adding your
  own samples to use as sources in bloom kshmr is perfect for those who want to
  put their personal stamp on things by dragging and dropping an audio file onto
  the sample display in the main page to replace the existing sample.

  Unlike traditional sequencers, the bloom sequencer is designed for triggering
  and layering one-shots and looping sequences, allowing for endless rhythmic
  creation. In the modulation section, users can automate pitch, volume, and
  filter settings as well as three effects to add depth and dimension to your
  music. In addition to high-pass and low-pass filtering, three effects await in
  the edit page: noise helps to add layers of crunch and texture to a sound by
  mixing in a layer of noise from a choice of vinyl crackle, cassette, white
  noise and more; reverb adds space to sounds with characterful plate, hall, or
  spring types; and a dynamics processor helps to shape transients as well as
  gate or compress the signal to bring out the details.
