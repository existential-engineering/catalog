description: Two of the best-sounding reverb chambers in the world, perfectly
  captured. Atlantis Dual Chambers is a world-class reverb plugin, created in
  partnership with the iconic Atlantis Studios. Get authentic chamber reverb
  quickly and easily.
details: |-
  Deep in the heart of Stockholm lies the soul of Swedish pop. Atlantis Studios is the birthplace of ABBA and home to the secret weapon of some of Sverige's most successful producers. The chambers at Atlantis Studios create the best-sounding reverb you didn't know you'd already heard. Until now.

  Softube expertly captured the detailed reflections of these unique rooms so that you, too, can harness their hitmaking magic. The result is an alchemistic mix of acoustics, ambiance, and authenticity. Say hej to Atlantis Dual Chambers.

  The incredible sound of the chambers at Atlantis Studios comes from a magical set of specs. Considered to be the first things constructed when the studio was converted from an old movie theatre, the oddly angled enclosures are bigger and brighter than most chambers. This gives the reflections created within them a relatively long decay time. And the uncommonly hard walls of the rooms make for lots of airy high-frequency echoes. It's a spellbinding sound you need to hear to appreciate.

  You don't have to rely on the presets to soak your tracks in Atlantean echoes. The plug-in parameters and layout are so intuitive that getting the perfect reverb for your project is fast and painless. Use the chambers together and separately. Select and adjust mics, decay time, predelay, and damping. With spatialization, resonance control, drive, EQ, compression, and reverb time, you can compare chamber sounds and effortlessly sculpt them. The potential for tweaking is vast, but you just can't make Atlantis Dual Chambers sound bad.

  Softube worked closely with the Atlantis crew on every detail of this plug-in, both in the studio and out. From mic choices and signal chains to additional software features. And Softube didn't just recreate the chambers but also the original recording setup, including the mics, speakers, and mechanical damping material used to alter the natural decay and timbre of the rooms. Because the soul of a chamber is so much more than the space itself.
specs: |-
  - Two meticulously modeled, exquisite-sounding chambers
  - From the studio that launched ABBA and has hosted The Hives, The Cardigans, Roxette, Robyn, Ghost, Green Day, Max Martin, Quincy Jones, Elvis Costello, and Lenny Kravitz, among many others
  - Created in collaboration with and officially licensed by Atlantis Studios in Stockholm, Sweden
  - Quickly get the reverb sounds you want using the intuitive layout and workflow
  - Instantly grab the precise parameters used at Atlantis Studios with the Gold Settings
  - Use the two legendary chambers in tandem or separately
  - Tweak the specifications of four mics, positions, speakers, damping, and more
  - Carve your chamber sounds with British-style filters and equalizing, compression, drive, reverb time, and more
  - Get creative with patches and time-based panning
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26
  - System requirements: Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access for downloading installers and managing licenses
  - Three activations included
