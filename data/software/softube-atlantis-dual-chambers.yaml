details: |-
  Deep in the heart of stockholm lies the soul of swedish pop. Atlantis studios
  is the birthplace of abba and home to the secret weapon of some of sverige's
  most successful producers. The chambers at atlantis studios create the
  best-sounding reverb you didn't know you'd already heard. Softube expertly
  captured the detailed reflections of these unique rooms so that you, too, can
  harness their hitmaking magic.

  The incredible sound of the chambers at atlantis studios comes from a magical
  set of specs. Considered to be the first things constructed when the studio
  was converted from an old movie theatre, the oddly angled enclosures are
  bigger and brighter than most chambers. This gives the reflections created
  within them a relatively long decay time. And the uncommonly hard walls of the
  rooms make for lots of airy high-frequency echoes.

  You don't have to rely on the presets to soak your tracks in atlantean echoes.
  The plug-in parameters and layout are so intuitive that getting the perfect
  reverb for your project is fast and painless. Use the chambers together and
  separately. Select and adjust mics, decay time, pre-delay, and damping. With
  spatialization, resonance control, drive, eq, compression, and reverb time,
  you can compare chamber sounds and effortlessly sculpt them.

  What the hitmakers are after is the precise sound we expertly captured in our
  atlantis dual chambers plug-in. With flexibility and modern features that no
  physical space can match.
specs: |-
  - Dual chambers
