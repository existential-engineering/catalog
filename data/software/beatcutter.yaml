url: https://apps.apple.com/app/beatcutter/id1536114453
description: BeatCutter is an experimental multi-channel app for slicing and
  recombining sound based on rhythm.
details: |-
  With this app you can create sound textures and abstractions with the
  atmosphere of cyberpunk, industrial ambience or alien jungle. Beatcutter has
  an almost unlimited range of options for transformation of source audio. The
  kind of original sound does not really matter. It can be any tracks, external
  musical instruments or sound from other apps.

  One of the most interesting and experimental features of this app is the
  feedback mode. This is not like analog feedback when positive loop gain occurs
  at some more or less stable resonant frequency. It looks more like fractals
  when the next level is similar to the whole structure, but in this case with
  constantly changes. We can say that it works like a sound structure that
  evolves and changes itself.

  Beatcutter is a universal application for ios and macos. It can work on iphone
  and ipad as well as mac / macbook with m1 chip (and later). Beatcutter works
  on iphone and ipad standalone, as an audio unit or inter-app audio module, and
  supports audiobus and ableton link. On macos, beatcutter can works both as a
  standalone application and as an audio unit with daws and audio unit hosts
  like ableton live, logic pro, garageband, mainstage, cockos reaper, plogue
  bidule, hosting AU, and other hosts that support auv3 plugins.

  The application interface is designed for convenient work with the most common
  MIDI controllers containing 8 faders and 8 knobs. All application features are
  available on ios and macos, including MIDI support (with a MIDI learn option),
  audio unit parameters and importing samples from any directory on device.
specs: |-
  - Multi-channel Audio Unit

  - Up to 4 external input and output channels

  - Playback up to 8 files at once

  - MIDI support with MIDI learn option

  - Audio unit parameters

  - Sample importing from any directory

  - Template editor with randomizer

  - Feedback mode

  - Matrix of sample cells with reconfigurable recording, playback and control
  busses

  - Universal 2 binary

  - Auv3 plugin support

  - Audiobus support

  - Ableton link support

  - Inter-app audio module support
