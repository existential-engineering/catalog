details: |-
  Bear is a low-end enhancer plugin that employs the principle that you will
  perceive the fundamentals as louder if you add or enhance the harmonics of a
  signal.

  Bear is faster to dial in, put it on your track, adjust the dry/wet control,
  and move on. Bear will do a lot of the fine-tuning for you so that you can
  concentrate on creating music and making stunning mixes.

  Bear will add depth and make your sound fuller.

  Changelog 2.50: native apple silicon (m1, m2, m3...) support. Macos signed &
  notarized. Improved performance and lower cpu usage. Fine-tuned harmonic
  engine for smoother results. Minor bug fixes and under-the-hood improvements.
specs: |-
  - Native apple silicon (m1, m2, m3...) support
  - macOS signed & notarized
  - Low-end enhancer
  - Dry/wet control
  - Harmonic engine
