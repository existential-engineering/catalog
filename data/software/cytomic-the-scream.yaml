description: The Scream is a detailed discrete component model of the classic green TS808 "Tube Screamer" pedal. It has input and output class-A transistor buffers, Boyle macro modelled op-amps, and a selection of fully customisable clipping diodes.
details: |-
  The Scream is a detailed discrete component model of the classic green TS808 "Tube Screamer" pedal. It has input and output class-A transistor buffers, Boyle macro modelled op-amps, and a selection of fully customisable clipping diodes. In fact every value of every component can be changed and randomised to customise your tone. Choose from a selection of diodes including silicon, germanium, or LEDs to create asymmetric clipping combinations, chain any number of diodes in series or even bypass them altogether and have a high gain boost that then clips the op-amp.

  The Scream models the TS-808 precisely, right down to individual components, which you can see on the circuit schematic which pops out to the right by clicking the top right hand corner of the gui interface. Once the circuit is exposed you can adjust the components either manually, or by using the randomisation feature.

  The Randomisation "Rand" Panel allows you to assign new random values to every component, and parameter of the component, in the entire model, in stereo. To simulate having multiple pedals built during the same production run with slightly exaggerated manufacturing variation of component values it is recommended to use the following default settings: Mono 50% x1, Stereo 25% x1. Keep generating variations to explore sounds you like, and move back and forth between iterations using the dots across the bottom of the GUI.

  The Mod switch selects which circuit modification is active, Mod 1 or Mod 2. Each mod slot can contain an entirely new set of values for every component in the entire circuit model (in stereo), and switching between the two can be done on the fly or via DAW automation. Modifications to the circuit can be done using the Mods Panel, the Rand Panel, or the Schematic View, and any changes are stored over time in the undo bar shown in both the Mods and Rand panels.

  Cytomic plugins allow reduction of aliasing by any amount you want with very high quality oversampling filters, at the cost of a little latency and cpu. There are separate oversampling settings for realtime use and offline renders, with x2 for realtime and x8 for offline render recommended, or all oversampling can be disabled for zero latency. Minimum phase (lowest latency), intermediate phase (medium latency) and linear phase (highest latency) modes are available.
specs: |-
  - Discrete component model of the TS808 circuit, down to individual components
  - Input and output class-A transistor buffers
  - Boyle macro modelled op-amps
  - Fully customisable clipping diodes: silicon, germanium or LEDs
  - Asymmetric clipping combinations, diodes chained in series or bypassed altogether
  - Every component value can be changed and randomised
  - Interactive schematic view that pops out from the GUI for manual component editing
  - Rand panel assigns random values to every component and parameter, in stereo
  - Mod switch with two circuit modification slots, switchable live or via DAW automation
  - Undo bar storing changes over time in both the Mods and Rand panels
  - Oversampling with minimum, intermediate and linear phase filters, or zero latency mode
  - Separate oversampling settings for realtime (x2 recommended) and offline render (x8 recommended)
  - macOS 10.13 or above, Intel/M1 cpu (64-bit)
  - Windows 10 or above, Intel/AMD cpu (64-bit)
