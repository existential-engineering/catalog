description: HoRNet ADDA is the ultimate bitcrusher that emulates classic analog-to-digital converters. Add lo-fi character, warmth, and digital grit.
details: |-
  HoRNet ADDA is a bitcrusher plugin that emulates vintage analog-to-digital (ADC) and digital-to-analog (DAC) converters, bringing the gritty, lo-fi character of late 1980s and early 1990s digital sound into a modern DAW. It gives precise control over both the ADC and DAC stages, over bit depth and over sampling rates.

  Dedicated bitcrusher modules for the ADC and DAC stages reduce bit depth from a transparent 24-bit signal down to the harsh textures of 4-bit audio, and the resampling frequency is adjustable from 44.1 kHz down to 4 kHz. Four selectable interpolation algorithms (None, Linear, Sample and Hold, Cubic) and an optional anti-alias filter shape the digital artifacts, so the amount and flavour of digital distortion can be tailored precisely.

  Beyond bitcrushing, ADDA carries carefully modeled analog input and output stages that add warmth, harmonic richness and adjustable analog hiss. Linkable pre-emphasis and de-emphasis filters shape the high and low frequencies before and after the bitcrushing stage, and linked input and output gain controls keep loudness consistent while driving the saturation.

  Internal oversampling of up to 4x, plus an automatic adaptive mode, removes the harsh artifacts that bitcrushing and downsampling can otherwise produce. The auto option adjusts the plugin's settings to maintain sufficient bandwidth regardless of the DAW's sample rate.

  The interface is provided in both light and dark modes, matching the operating system theme automatically or via a manual selector, and is drawn as a vector UI that stays sharp at every resolution. Individual plugin modules can be bypassed independently, and the plugin is CPU-efficient enough to run in many instances at once. ADDA is also available as an AUv3 app on iPad and iPhone through the App Store.
specs: |-
  - Authentic ADC emulation with adjustable bitcrushing and resampling
  - Faithful DAC emulation with controllable bit depth and dithering
  - Bitcrusher adjustable from 24-bit down to ultra lo-fi 4-bit resolution
  - Resampling frequency adjustable from 44.1kHz down to 4kHz
  - Four selectable interpolation algorithms (None, Linear, Sample and Hold, Cubic)
  - Optional anti-alias filter to shape digital artifacts
  - Analog input/output stages with harmonic saturation controls
  - Adjustable analog saturation level for input and output sections
  - Optional analog hiss emulation for added authenticity
  - Linkable pre-emphasis and de-emphasis filters for creative tonal shaping
  - Linked input/output gain controls for maintaining consistent loudness
  - Internal oversampling up to 4x, plus automatic adaptive mode
  - Individually bypassable plugin modules for maximum flexibility
  - Automatic adaptive user interface (light/dark mode)
  - Vector user interface which is sharp on every resolution
  - Apple Silicon native support
  - macOS (10.13 and later) and Windows (Windows 10 and later) support
  - 64-bit on Mac and Windows
  - Audio Units, VST, VST3 and AAX format
  - Available as AUv3 on iPad and iPhone
  - No copy protection
