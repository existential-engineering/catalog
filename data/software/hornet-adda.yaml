description: HoRNet ADDA is the ultimate bitcrusher that emulates classic analog-to-digital converters. Add lo-fi character, warmth, and digital grit.
details: |-
  Experience the distinctive vibe of early digital gear with HoRNet ADDA, an advanced bitcrusher plugin that faithfully emulates vintage analog-to-digital (ADC) and digital-to-analog (DAC) converters. HoRNet ADDA brings the gritty, lo-fi magic and warmth of late '80s and early '90s digital sound directly to your DAW. HoRNet ADDA offers a powerful and intuitive way to control both the ADC and DAC stages of your audio, giving you precise control over bit depth and sampling rates.

  HoRNet ADDA features dedicated bitcrusher modules for both the ADC and DAC stages, allowing you to reduce the bit depth of your audio from a transparent 24-bit signal all the way down to the harsh, gritty textures of 4-bit audio. With multiple selectable resampling algorithms and adjustable sampling frequencies, you can easily tailor the amount of digital distortion you want to introduce.

  In addition to its bitcrushing capabilities, HoRNet ADDA also features carefully modeled analog input and output stages. These analog emulations add genuine warmth, harmonic richness, and even adjustable analog hiss to your bitcrushed sounds. The intuitive pre-emphasis and de-emphasis filters give you the ability to shape your audio in even greater detail before and after the bitcrushing stage.

  To ensure the best possible sound quality, HoRNet ADDA comes with up to 4x oversampling, which eliminates the harsh artifacts that can sometimes arise when applying bitcrushing or downsampling effects. The "auto" option intelligently adjusts the plugin's settings to maintain sufficient bandwidth for high-quality processing, regardless of the sample rate in your DAW.

  The interface is provided in both light and dark modes, which automatically match your operating system's theme. Despite its advanced features and capabilities, HoRNet ADDA is CPU-efficient, meaning you can run multiple instances of the plugin in your session without taxing your system.
specs: |-
  - Authentic ADC emulation with adjustable bitcrushing and resampling
  - Faithful DAC emulation with controllable bit depth and dithering
  - Bitcrusher adjustable from 24-bit down to ultra lo-fi 4-bit resolution
  - Resampling frequency adjustable from 44.1kHz down to 4kHz
  - Four selectable interpolation algorithms (None, Linear, Sample and Hold, Cubic)
  - Optional anti-alias filter to shape digital artifacts
  - Analog input/output stages with harmonic saturation controls
  - Adjustable analog saturation level for input and output sections
  - Optional analog hiss emulation for added authenticity
  - Linkable pre-emphasis and de-emphasis filters for creative tonal shaping
  - Linked input/output gain controls for maintaining consistent loudness
  - Internal oversampling up to 4x, plus automatic adaptive mode
  - Individually bypassable plugin modules for maximum flexibility
  - Automatic adaptive user interface (light/dark mode)
  - Vector user interface which is sharp on every resolution
  - Apple Silicon native support
  - macOS (10.13 and later) and Windows (Windows 10 and later) support
  - 64-bit on Mac and Windows
  - Audio Units, VST, VST3 and AAX format
  - Available for iOS and iPadOS as an AUv3 plugin
  - No copy protection
