description: PSP FETpressor is a FET feedback type compressor plug-in designed to provide accurate, almost instant compression with loads of character. Great for vocals, guitars, bass, drums, and whenever a classic 1970s-style FET compressor is needed.
details: |-
  PSP FETpressor is a FET feedback type compressor plug-in designed to provide accurate, almost instant compression with loads of character. Great for vocals, guitars, bass, drums, and whenever a classic 1970s-style FET compressor is needed, PSP FETpressor contains everything you'd expect from a FET compressor: an internal side chain high pass filter to control amount of low frequency pumping, smoothly adjustable compression ratio, ability to select which channel to process, and a link switch.

  PSP FETpressor also contains a dry signal blend for fast and easy parallel compression. Additionally, PSP FETpressor contains makeup amplifier and output transformer emulations to add subtle character even when set to a 1:1 ratio.

  PSP FETpressor is part of the PSP series of Zero Latency Processing plug-ins, making it ideal for situations such as live monitoring, live broadcast production, and managing levels while tracking.

  Running PSP FETpressor in 30-day trial mode or activating it requires a free iLok user ID and the free iLok License Manager application. No hardware dongle is needed. The license activates in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above), and the locations can be changed at any time using PACE's iLok License Manager.
