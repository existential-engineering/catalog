description: A FET feedback-type compressor plugin delivering rapid, character-rich compression suitable for vocals, guitars, bass, drums, and vintage 1970s-style FET compression applications.
details: |-
  PSP FETpressor is a FET feedback-type compressor plugin delivering rapid, character-rich compression. Features an internal sidechain high-pass filter for controlling low-frequency pumping, smoothly adjustable compression ratio, channel selection, and a link switch for stereo use.

  Dry signal blend enables parallel compression workflows. Makeup amplifier and output transformer emulations add vintage character to the signal path. Zero-latency processing makes it ideal for live monitoring and broadcast. iLok License Manager required (no hardware dongle). 30-day demo available.
