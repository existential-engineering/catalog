description: The distortion pedal reinvented with both the classic and modern features that helps musicians to sculpt their distorted sound
details: |-
  Explore the next level of guitar distortion with the HoRNet HDS1 MK2, the latest innovation from HoRNet Plugins. This plugin is a sophisticated digital recreation of an iconic orange guitar distortion pedal, revered in the music industry for its rich, dynamic distortion sound. Loved by guitarists across genres for decades, this legendary pedal has now been brought into the digital age, offering modern producers and engineers access to a classic tone with advanced digital features. Designed to cater to both the classic and modern producer, the HDS1 MK2 extends its application beyond mere guitar effects, providing versatility across various audio production scenarios. Whether you are creating rock, metal, blues, or experimental music, the HDS1 MK2 provides the tools to take your distortion sounds to the next level.

  At the core of the HDS1 MK2 is the classic diode distortion, a sound that guitarists have been relying on for decades. The plugin perfectly captures the raw, gritty tone that has made this pedal a favorite in studios and on stages worldwide. This diode-based distortion offers an aggressive edge to your guitar sound while preserving the natural warmth and dynamics of your instrument. Whether you’re looking for subtle overdrive or intense, saturated distortion, the HDS1 MK2 delivers with accuracy, giving you full control over the distortion intensity. Gain and Tone adjustments can be made with ease, allowing you to craft the perfect sound for any musical context. Whether you’re layering distortion on a lead guitar track or adding character to a rhythm section, the HDS1 MK2 excels at achieving the desired sound.

  What truly sets the HDS1 MK2 apart, however, is its inclusion of several famous modifications that expand the sonic possibilities even further. These include the “ Ultra,” “ Seeing Eye,” and “ Less Shrill ” mods, each offering a unique twist on the classic sound. These modifications are perfect for musicians who want to sculpt their sound with precision, adding layers of depth, complexity, and intensity to the guitar distortion. The “ Ultra ” mode boosts the gain for a more aggressive tone, ideal for heavier genres like metal or hard rock. Meanwhile, the “ Seeing Eye ” mod creates a more pronounced, throaty distortion that cuts through a mix, perfect for solo guitar work. On the other hand, the “ Less Shrill ” mod smooths out the high frequencies, providing a more balanced and rounded distortion for players who want to avoid harshness in their tone. With these modes, you can customize your tone to suit your specific needs and playing style, whether you’re seeking a vintage sound or pushing your distortion to new, modern extremes.

  Control is critical in music production, and the HDS1 MK2 excels in this area. It features adjustable effect levels that allow you to dial in the amount of distortion you want in your sound. Additionally, the plugin comes with a tone control that can take your sound from dark and brooding to bright and cutting. The versatility of the tone control means that you can shape your sound to fit into any mix, whether you’re looking for a full-bodied distortion that fills out your track or a more focused, sharp tone that cuts through the mix. Whether you’re using the HDS1 MK2 on a lead guitar track, rhythm section, or even other instruments, its ability to provide a wide range of tonal characteristics ensures that it is a valuable tool for any producer or musician. The dry/wet knob adds another level of control, allowing you to blend the processed and original signal seamlessly.
specs: |-
  - Classic diode distortion
  - “Ultra” mod emulation
  - “Seeing Eye” mod emulation
