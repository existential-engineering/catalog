description: The distortion pedal reinvented with both the classic and modern features that helps musicians to sculpt their distorted sound
details: |-
  Explore the next level of guitar distortion with the HoRNet HDS1 MK2, the latest innovation from HoRNet Plugins. This plugin is a sophisticated digital recreation of an iconic orange guitar distortion pedal, revered in the music industry for its rich, dynamic distortion sound. Designed to cater to both the classic and modern producer, the HDS1 MK2 extends its application beyond mere guitar effects, providing versatility across various audio production scenarios. Whether you are creating rock, metal, blues, or experimental music, the HDS1 MK2 provides the tools to take your distortion sounds to the next level.

  At the core of the HDS1 MK2 is the classic diode distortion, a sound that guitarists have been relying on for decades. This diode-based distortion offers an aggressive edge to your guitar sound while preserving the natural warmth and dynamics of your instrument. Whether you're looking for subtle overdrive or intense, saturated distortion, the HDS1 MK2 delivers with accuracy, giving you full control over the distortion intensity, with Gain and Tone adjustments made with ease.

  What truly sets the HDS1 MK2 apart is its inclusion of several famous modifications: the "Ultra", "Seeing Eye" and "Less Shrill" mods, each offering a unique twist on the classic sound. The "Ultra" mode boosts the gain for a more aggressive tone, ideal for heavier genres like metal or hard rock. The "Seeing Eye" mod creates a more pronounced, throaty distortion that cuts through a mix, perfect for solo guitar work. The "Less Shrill" mod smooths out the high frequencies, providing a more balanced and rounded distortion for players who want to avoid harshness in their tone.

  Control is critical in music production, and the HDS1 MK2 excels in this area. It features adjustable effect levels that allow you to dial in the amount of distortion you want in your sound, plus a tone control that can take your sound from dark and brooding to bright and cutting. A user-friendly dry/wet knob allows for effortless blending of the processed and original signals, while the VU meter helps with precise level adjustments, ensuring that your signal stays clean and within optimal gain levels.

  The plugin's enhanced analog emulation ensures that even the subtlest nuances of analog guitar distortion are captured with clarity and warmth. It also supports up to 16x oversampling with an automatic option, crucial for achieving high-fidelity sound that retains clarity even in high-gain situations. The HoRNet HDS1 MK2 is fully compatible with contemporary operating systems, supporting macOS (10.13 and later) and Windows (10 and later), is optimized for 64-bit systems and offers native support for Apple Silicon.
