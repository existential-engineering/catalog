description: "EMISSARY 2.0 Re-coded from the ground up. The Emissary is a
  no-compromise custom amp built for the kill. Featuring a versatile clean
  channel that ranges from pristine cleans to slightly overdriven tones. A
  brutal lead channel designed for serious bone-crushing distortions. This
  module offers a very wide tonal palette for not only the modern metal
  musician, but a wider variety of genres. Every single component on the signal
  path of the circuit of the physical Emissary tube amplifier has been taken
  into account and modeled in the best possible way to match the original sound,
  keeping an eye on CPU performance and real-time playability at the same time.
  We use state of the art analog modelling technology, deriving systems of
  non-linear differential equations directly from schematics and solving them in
  real time through carefully optimized C++ code. Also included are 6 free
  Impulse Responses."
