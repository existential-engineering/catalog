details: |-
  JST Gain Reduction Deluxe: Vocal Compression Redefined
  Overview
  Achieve in-your-face, mix-ready vocals with JST Gain Reduction Deluxe, the definitive compression plugin for making rock and metal vocals larger than life. This plugin is designed to provide the signature vocal sound of Joey Sturgis, combining Compression, EQ, and Saturation into one easy to use plugin. Whether you’re refining vocal tracks for rock or metal, Gain Reduction Deluxe delivers upfront vocals every time.
  Hear It In Action
  Check out these examples to experience the unique impact of Gain Reduction Deluxe on various vocal tracks. From subtle tonal adjustments to complete vocal transformations, this plugin provides the versatility and power needed to make your vocals shine in any mix.
  Features - Master Your Vocals Like Never Before
  Ready To Go
  Gain Reduction Deluxe was built from the ground up to consistently give you mix-ready vocals. When loaded on a vocal track, Gain Reduction Deluxe transforms the vocal into a clear and consistent performance with its built in Compression, EQ and Saturation settings.
  Dynamic Compression
  Gain Reduction Deluxe offers dynamic control, allowing you to adjust the intensity and aggressiveness of the compression to suit your vocal tracks. Whether you're smoothing out a performance or looking for that in-your-face sound, this plugin delivers.
  Robust Vocal Controls
  Manipulate your vocal tracks with powerful controls like 'Slay' for adjusting compression and 'Body' for shaping the low-end response. These controls offer the flexibility to sculpt your sound precisely how you envision it.
  Easy-to-Use Interface
  Experience a high-resolution, resizable GUI that makes navigating and adjusting settings more intuitive than ever. The modern, easy to navigate design ensures you spend more time creating and less time searching for controls.
  Parallel Processing
  Gain Reduction Deluxe includes parallel processing, allowing you to blend the processed signal with the original signal. This feature gives you more control over the final sound, enabling you to add subtle enhancements or completely transform the vocal.
  Latency-Free and CPU-Efficient
  Designed to integrate seamlessly into your workflow, Gain Reduction Deluxe operates with zero latency and minimal CPU usage. This efficiency allows you to use multiple instances of the plugin without compromising performance, making it perfect for complex sessions.
  World-Class Sound Quality
  Gain Reduction Deluxe harnesses Joey Sturgis's signature vocal processing techniques to deliver powerful, consistent and mix-ready vocals instantly, giving your vocal tracks the polished sheen found in modern productions.
  Discover the Power of Gain Reduction Deluxe
  Elevate your vocal tracks to industry standards with Gain Reduction Deluxe. Whether you're sculpting the perfect lead for a high-energy rock anthem or mixing aggressive screaming vocals, this plugin offers everything you need to achieve mix-ready results. Unleash the full potential of your vocal performances with Gain Reduction Deluxe and hear the difference in your productions today.
  Saving and Managing Presets
  Explore Factory Presets: Gain Reduction Deluxe comes stock with presets to give you quick and professional sounding results, at the click of a button.
  Create Custom Presets: Save your favorite settings as new presets ensuring quick recall of your signature sound for future sessions.
  Share & Download User Presets: Check online for other users’ presets in the Joey Sturgis Tones forum on Facebook!
