description: Acon Digital Remix is a plug-in that lets you separate and remix vocals, piano, bass, drums and other instruments in real time. Remix is available for PC and Macintosh and supports the VST, VST3, AAX and AU plug-in formats.
details: |-
  Transform your music with Remix, the revolutionary plug-in that separates instrument groups in real-time with minimal latency. Powered by cutting-edge AI, Remix dissects complete mixes into five distinct stems—Vocals, Piano, Bass, Drums, and Other—allowing you to effortlessly remix each element. Boost the vocals, tone down the drums, or create the perfect karaoke track in seconds!

  With fully automatable parameters, Remix lets you fine-tune the sensitivity of each stem, striking the perfect balance between clarity and spill. Elevate your sound with Remix and discover endless creative possibilities!

  Real-time. Always. No offline jobs. No waiting. Remix runs live in your session so you can audition changes instantly and keep your flow.

  Five stems. Total control. Remix separates any mix into Vocals, Piano, Bass, Drums and Other — independently. Boost, mute or fine-tune each element without touching the rest.

  Multi-Output Routing. Route each stem to its own track in supported hosts. Apply insert effects to vocals, bass or drums in isolation. Every parameter writes to your DAW's automation lane, and the interface is resizable with adjustable UI scaling.
specs: |-
  - Separate mixes into five stems – Vocals, Piano, Bass, Drums and Other
  - Sensitivity controls for detection of each stem
  - Output level meters for each stem
  - Multiple audio outputs (in some hosts) – Mix, Vocals, Piano, Bass, Drums and Other
  - Fully automatable parameters
  - Preset manager and a large number of factory presets
  - Save, load and categorize user presets
  - Resizable graphical user interface with adjustable UI scaling
  - Supports sampling rates up to 96 kHz
  - Native 32 bit and 64 bit versions of all plug-ins are available
  - Runs natively on Apple Silicon (ARM64) and Intel
  - Windows: Windows 11 / 10, Intel Core i5 or AMD multi-core processor (Intel Core i7 or faster recommended)
  - Windows: 1366 x 768 display resolution (1920 x 1080 or higher recommended)
  - macOS: OS X 10.13 or later
  - 1 GB RAM (4 GB or more recommended), 1 GB free HD space
  - Requires a host application compatible with VST, VST3, AAX (Pro Tools 2018 or later) or AU
