description: Acon Digital Remix is a plug-in that lets you separate and remix vocals, piano, bass, drums and other instruments in real time. Remix is available for PC and Macintosh and supports the VST, VST3, AAX and AU plug-in formats.
details: |-
  Remix is a plug-in that separates instrument groups in real time with minimal latency. Powered by AI, it dissects complete mixes into five distinct stems, Vocals, Piano, Bass, Drums and Other, allowing each element to be remixed independently. Boost the vocals, tone down the drums, or create a karaoke track in seconds.

  Processing is always real time. There are no offline jobs and no waiting, so changes can be auditioned live in the session. Each of the five stems can be boosted, muted or fine-tuned without touching the rest, and output level meters are provided per stem.

  With fully automatable parameters, Remix lets you fine-tune the sensitivity of each stem, striking a balance between clarity and spill. Every parameter writes to the host's automation lane, so stem balances can evolve across the timeline.

  In supported hosts, each stem can be routed to its own track (Mix, Vocals, Piano, Bass, Drums and Other), so insert effects can be applied to vocals, bass or drums in isolation. The graphical user interface is resizable with adjustable scaling, and a preset manager ships with a large number of factory presets alongside save, load and categorize functions for user presets.

  Remix is sold with simple one-time pricing and no subscription. It has been reviewed by Sound on Sound, TapeOp Magazine, Music Marketing and Magnetic Magazine, and is used by professional re-recording and dialogue mixers for tasks such as balancing dialogue against music and reducing bleed on live recordings.
specs: |-
  - Separates mixes into five stems: Vocals, Piano, Bass, Drums and Other
  - Real-time processing with minimal latency, no offline rendering
  - Sensitivity controls for detection of each stem
  - Output level meters for each stem
  - Multiple audio outputs (in some hosts): Mix, Vocals, Piano, Bass, Drums and Other
  - Fully automatable parameters
  - Preset manager with a large number of factory presets
  - Save, load and categorize user presets
  - Resizable graphical user interface with adjustable UI scaling
  - Supports sampling rates up to 96 kHz
  - Available as VST, VST3 or AAX plug-ins on PC (Windows)
  - Available as VST, VST3, AAX or AU plug-ins on Apple Macintosh (macOS)
  - Native 32 bit and 64 bit versions of all plug-ins are available
  - Runs natively on Apple Silicon (ARM64) and Intel
  - Windows: Windows 11 / 10, Intel Core i5 or AMD multi-core processor (Intel Core i7 or faster recommended)
  - Windows: 1366 x 768 display resolution (1920 x 1080 or higher recommended)
  - macOS: OS X 10.13 or later
  - 1 GB RAM (4 GB or more recommended)
  - 1 GB free HD space
  - Requires a host application compatible with VST, VST3, AAX (Pro Tools 2018 or later) or AU
