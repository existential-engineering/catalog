details: |-
  AZR3 is a triple drawbar organ plugin VST by Rumpelrausch Taips. It functions
  as a virtual instrument and virtual effect audio plugin for Windows.

  The leslie rotor speed responds to mod wheel. The leslie is adjustable,
  including belt tension. The 'mr. Valve' overdrive works to put some or a lot
  of dirt in the sound.

  Documentation comes in the form of a .PDF manual, which is pretty complete. It
  details all of the automatable parameters with azr3. It also includes the gnu
  license for the plugin.

  Rumpelrausch provides it for free, but asks if you end up using it that you
  donate to a charitable non-government organization.
specs: |-
  - 3 instruments
  - 9 drawbars
  - 6 different waveform shapes
  - Click
  - Percussion
  - Sustain
  - Split mode
  - Monophonic mode
  - Vibrato
  - Scalable pitch bend
  - Saturation/distortion/fuzz
  - Rotating speakers
  - Lower speaker can be switched between fixed and rotating
  - Windows compatible
