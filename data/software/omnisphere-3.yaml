description: The flagship synthesizer of Spectrasonics, an instrument of
  extraordinary power and versatility that brings many different types of
  synthesis together into one amazing-sounding instrument.
details: |-
  Omnisphere is the flagship synthesizer of Spectrasonics, an instrument of extraordinary power and versatility. Top artists all over the world rely on Omnisphere as an essential source of sonic inspiration. This award-winning software brings many different types of synthesis together into one instrument that will spark a lifetime of exploration.

  Version 3 introduces new synthesis and sound design features including Quadzone layering, 36 new filter types, circuit-modeled saturation, dual frequency shifter, new oscillator drift, over 100 new EDM wavetables, unison phase scatter, new glide modes, and polyphonic expression (MPE) support.

  The Hardware Integration feature works with every major brand of synthesizers and MIDI controllers. New Global Controls allow quick customization of patch characteristics including tone, ambience, filter, envelope, vibrato and unison. Automatic patch mutation generates subtle to extreme variations from any patch.

  With new lossless optimization technology, the Omnisphere 3 sound library takes no more hard drive space than Omnisphere 2. All classic Omnisphere patches have been remastered with the latest v3 features and effects. Includes a bonus Omnisphere FX Rack AU/VST/AAX plugin and a Live Keyboardist factory patch library curated for stage use.
specs: |-
  - New Quadzone synthesis layering capability
  - 36 new filter types with circuit-modeled saturation
  - Dual frequency shifter and new oscillator drift
  - Over 100 new EDM wavetables
  - Unison phase scatter and new glide modes
  - Polyphonic Expression (MPE) support
  - Hardware Integration with major synthesizer brands and MIDI controllers
  - Global Controls for instant patch customization
  - Automatic patch mutation from subtle to extreme variations
  - Sound Match feature to locate related sounds in library
  - Bonus Omnisphere FX Rack AU/VST/AAX plugin included
  - Requires 8GB RAM (16GB+ recommended), 64GB free hard drive space
