details: |-
  Boo Boom Arp is slot driven drum sampler and drums groove arranger. It is
  based on the boo boom sampler and shares many components and structures with
  it, but also brings up some of the most desired features that modern
  production technology has to offer.

  Boo boom arp uses 10 (.wav) file sample slots to build 10 drum components
  drum-kits. Each slot can be anything, from kicks to snares or cymbals. Each
  slot is triggered by its own unique MIDI note which is noted on its slot
  button. The samples menu is divided into 14 categories, including a wide range
  of drum-kit components types. Each sample folder has a room for 150 samples,
  and users can add their own wave files straight to the folders.

  Boo boom arp has a built-in mixer that allows users to tweak any sample
  separately with eq, pitch control, random pitch manipulation, pan, and a
  pitch-based round robin effect. The mixer is armed with 3 master effects
  (compressor, reverb, delay) which can be used by sending an fx amount from the
  master fx knob on every channel or by sending them directly to the master
  effect.

  Boo boom arp uses the arranger keyboards style sequencer method to run 8
  simultaneous MIDI grooves per style that can be switched instantly with a MIDI
  keyboard. Each variation gets its own MIDI key number and the transitions are
  synced to the determined tempo. The MIDI sequence can be sent out to the DAW
  through the MIDI channels and trigger other vsti's.

  Boo boom arp has a customizable gui which can be set by the user. Users can
  change the gui scale and switch background and controls color on the fly. It
  loads drum-kits extremely fast and uses a one button press preset manager
  which allows super-fast presets switching by MIDI assignable buttons.
specs: |-
  - 10 drum sample slots per kit
  - 14 drum element banks
  - 30 drum-kits included
  - Windows compatible
  - MIDI assignable buttons
  - MIDI assignable knobs
  - Sample start/end point control
  - Built-in mixer
  - EQ
  - Pitch control
  - Random pitch manipulation
  - Pan control
  - Pitch-based round robin effect
  - 3 master effects (compressor, reverb, delay)
  - 24 presets drum-kit banks
  - 64 steps arranger style arpeggiator
  - 8 simultaneous MIDI grooves per style
  - 8 variations per style
  - Unique time signature per variation
  - MIDI keyboard controllable variation switch
  - Automatic cymbal crash on end points
  - Self or synced tempo
  - MIDI route options (internal or DAW)
  - Scalable gui
  - Customizable gui
  - Background and controls color customization
  - 150 samples per folder capacity
  - .wav file format support
