details: |-
  Ample Bass J is based on a fender jazz bass (john english masterbuilt),
  offering an extensive range of realistic articulations and an all-new MIDI
  composition system. It is an essential electric bass instrument for modern
  music production.

  Polyphonic legato and slide smoother enables realistic legato across any
  interval and speed. Drop tuning is supported, with lowest note down to b0.

  Riffer 4 is a MIDI editor tailored for plucked string instruments with dual
  view modes offering seamless real-time switching between piano roll and guitar
  tab views. String visualization system visualizes strings within the piano
  roll, enabling MIDI writing that adheres to authentic plucked instrument
  techniques by automatically preventing polyphony on the same string and
  intelligently assigning fingering.

  Full MIDI import/export compatibility allows importing external MIDI files or
  exporting from riffer to DAW's MIDI or instrument track, with playback result
  remaining identical and accurate. Intuitive technique editing enables
  programming of fingering, articulation, legato, and expression without
  cumbersome key switches or complicated MIDI cc programming.

  Tab reader 4 supports guitar pro files from gp3 to guitar pro 8 and is capable
  of importing entire bass tracks into riffer with full retention of fingering,
  articulations, and performance data. The virtual bass amp system includes 3
  classic bass amp heads (b15r, ba500, and svt-pro), 4 cabinet options (1x15,
  2x10, 4x10, 8x10), and each cabinet supports 4 mic types (u87, c414, md421,
  sm57). Built-in effects include 8-band eq, compressor, delay, and convolution
  reverb.
