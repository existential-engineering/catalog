description: Experience the legendary sonic excellence of Avalon Design's Pure Class A analog equalizers in your digital workflow with the Kazrog Avalon AD 2077 and AD 2055 plugin bundle. These meticulously crafted emulations deliver the smooth musical detail and unparalleled sonic accuracy of the iconic AD 2077 Mastering Equalizer and AD 2055 Class A Equalizer hardware units, featuring dual mono operation with stereo linking, an extraordinary wide bandwidth from 1Hz to 450kHz, and advanced modeling technology that captures every nuance of the original analog circuits. With mastering-grade oversampling, intuitive interfaces designed for seamless DAW integration, and compatibility across macOS, Windows, and Linux platforms.
details: |-
  The Avalon AD 2077/2055 EQ Bundle from Kazrog includes two meticulously crafted emulations of iconic Avalon Design analog equalizers. The bundle pairs the AD 2077 mastering equalizer and the AD 2055 Class A parametric equalizer, offering a comprehensive analog EQ toolkit for mixing and mastering engineers.

  The AD 2077 emulation features 104 switched frequencies per channel, delivering the precision and musicality of the original hardware. Its mastering-grade transparency and ultra-low distortion make it ideal for final-stage processing.

  The AD 2055 emulation provides continuously variable parametric mid bands for expressive tonal shaping. Both plugins share a 64-bit oversampled signal path and Kazrog's proprietary Analog Entropy Modeling.

  Both plugins support dual mono operation with stereo linking. The bundle ships as a perpetual license with no iLok or subscription required.
specs: |-
  - AD 2077: 104 switched frequencies per channel
  - AD 2055: Continuously variable parametric mid bands
  - 64-bit oversampled signal path
  - Analog Entropy Modeling with adjustable asymmetric variations
  - Bandwidth: 1Hz to 450kHz
  - Dual mono operation with stereo linking
  - macOS 10.13+; Universal Binary 2 (Apple Silicon & Intel)
  - Windows 10+
  - Linux: VST3, VST2, LV2 compatible hosts
  - AAX requires Pro Tools 12+
  - Perpetual license; no iLok, no subscription
