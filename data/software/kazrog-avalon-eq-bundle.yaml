description: "Experience the legendary sonic excellence of Avalon Design's Pure
  Class A analog equalizers in your digital workflow with the Kazrog Avalon AD
  2077 and AD 2055 plugin bundle. These meticulously crafted emulations deliver
  the smooth musical detail and unparalleled sonic accuracy of the iconic AD
  2077 Mastering Equalizer and AD 2055 Class A Equalizer hardware units,
  featuring dual mono operation with stereo linking, an extraordinary wide
  bandwidth from 1Hz to 450kHz, and advanced modeling technology that captures
  every nuance of the original analog circuits. With mastering-grade
  oversampling, intuitive interfaces designed for seamless DAW integration, and
  compatibility across macOS, Windows, and Linux platforms."
