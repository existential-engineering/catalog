  125x platinum-certified producer David Bendeth.
details: |-
  The David Bendeth Producer Bundle combines two professional drum production tools curated by David Bendeth, known for his work with Paramore, Breaking Benjamin, and Bring Me The Horizon.

  Drumforge David Bendeth is a virtual instrument plugin featuring an extensive collection of drum samples and grooves recorded and mixed by Bendeth himself. Includes 9 kicks, 25 snares, various toms and cymbals, plus a built-in virtual mixing console.

  Drumshotz David Bendeth delivers 190 high-quality one-shot drum samples in 44.1 kHz, 24-bit format, handpicked to provide additional power and punch to drum tracks.

  Purchase includes instant digital download, perpetual license, free lifetime updates, and unlimited customer support.
specs: |-
  - Includes Drumforge David Bendeth virtual instrument plugin
  - Includes Drumshotz David Bendeth one-shot sample pack (190 samples)
  - 9 kicks, 25 snares, various toms and cymbals
  - 44.1 kHz, 24-bit sample format
  - VST3, AU, AAX, and Standalone formats
  - macOS 11+ (64-bit, Intel and Apple Silicon)
  - Windows 8.1+ (64-bit)
  - Perpetual license
  - Free lifetime updates
  - Instant digital download
