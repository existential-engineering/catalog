  - windows
description: Analog Waveforms is a free plugin featuring the basic waveforms of
  an analog synthesizer.
details: |-
  The sample-set in analog waveforms are embedded in the plugin and are
  multi-sampled. Each note has been recorded for 10 seconds and looped to
  capture the analog synthesizer oscillator's "pure" sounds.

  All the samples have been looped for sustain notes, and they are made
  available to the public domain. They can be downloaded separately from the
  plugin. Note that the plugin itself is not public domain.

  The small folder icon at the top right is to load mse files created with maize
  sampler so it can also be used as a mse file player.
specs: |-
  - Universal 2 binary
  - 4 multi-sampled analog synthesizer waveforms
  - Sawtooth waveform
  - Triangle waveform
  - Saw-triangle waveform
  - Pulse-width at 40% waveform
  - 355 MB of samples
  - 16-bit, 44.1khz mono wav files
  - Multi-LFO
  - 4 effects
  - Highpass/lowpass filter
  - Amplitude range controls
  - 3 voice modes: polyphonic, monophonic, and legato
  - 7 octaves sampling
  - 10 seconds per sample
  - Sample looping for sustain notes
  - Mse file player capability
