details: |-
  #1 Best-Selling Electronic Piano

  Still the #1 best-selling electronic piano in the world ( Reverb, 2025 ), the Super Wool captures everything that makes the Wurlitzer a timeless classic. Built on a faithfully preserved 1972 model, one of the most celebrated years for Wurlitzers. Super Wool delivers that classic bark and wooly bite when pushed. A soft bloom when played gently. And soulful tremolo that is still defining new musical eras after 50 years. With over 3100 Real Time-Samples and 127 velocity layers, the Super Wool responds like the real thing from glowing sustains to sparkling staccatos. Inside are 41 iconic patches modeled to the tones of Supertramp, Pink Floyd to Ray Charles & Queen . From faithful recreations of Marvin Gaye, Stevie Wonder , and Elton John .
