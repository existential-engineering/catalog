details: |-
  COMP-4K-BUS is a stereo bus compressor plugin that runs natively in your DAW on macOS or Windows, or in real-time on Antelope's Synergy Core interfaces.

  COMP-4K-BUS is the famous 'mix' glue bus compressor of the 80s. It resides on the master bus of a fondly remembered series of vintage British consoles and its job is to bring together instruments and performances from tens of audio channels into one larger-than-life, cohesive whole. Decades later, still, nothing does that quite like the COMP-4K-BUS. It's the gold standard of mix bus compression and it's now coming to life on the Antelope Synergy Core platform.

  Put the COMP-4K-BUS on your Master fader and start mixing right into it or use it after everything else in your mix is 'said and done' to turn it into a balanced, homogenous production. Don't worry about latency and CPU power, with Synergy Core processing they have become a thing of the difficult past.

  The original design was first born as a modified dbx 161 and lived in the center sections of those early Oxford consoles. That gave it its aggressive and punchy sound which shaped most of rock and pop music over the past four decades. To bring back the essence that built its reputation, Antelope made a faithful recreation of the original design by modeling a unit from one of those early consoles, and also included the 'Auto Fade' feature found only on the original center sections with an adjustable rate in seconds.

  For modern needs, COMP-4K-BUS includes a sweepable SideChain Filter to prevent sub low frequencies from over-triggering the compressor. A 'Mix' knob is also included to determine the blend between the compressed and unprocessed signal, supporting New York-style parallel compression and expanding its versatility beyond the mix bus.
specs: |-
  - Stereo bus compressor plugin
  - Faithful recreation of the modified dbx 161 circuit used in early Oxford console center sections
  - Original 'Auto Fade' feature with adjustable rate in seconds
  - Sweepable SideChain Filter for modern low-frequency control
  - 'Mix' knob for parallel / New York-style compression blend (dry/wet)
  - Runs natively in your DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core interfaces
