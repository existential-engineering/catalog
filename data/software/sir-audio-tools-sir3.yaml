description: Elevate your audio with our well-engineered reverberation plugin. SIR3 includes highly realistic HDIR impulse responses made by Pinguin Ingenieurbüro from Hamburg and offers versatile reverb sculpting options, making it ideal for a wide range of audio professionals and enthusiasts.
details: |-
  SIR3 comes with 33 excellent HDIR models made by Pinguin Ingenieurbüro from Hamburg. The models are known for their high dynamic range and their exact natural fidelity.

  The very flexible modulation section allows you to transform certain parts (head or tail section) in the time domain. It contains a multi-stage delay with random pitch modulation and random amplitude modulation in the feedback path.

  Transform the audio signal with a rich set of dynamic processing opportunities like gating and ducking. You can do things like gated reverberation, or ducking the wet signal with the dry signal, directly inside the plugin.

  Envelope processing options include Volume, Low-Pass, High-Pass, Width, and Pan envelopes to modify the impulse response in a natural or creative way. The software works with very low CPU consumption and zero-latency processing.
specs: |-
  - 33 included HDIR impulse response models
  - VST, VST3, AudioUnit (AU), AAX
  - Mac 64-bit Intel + Apple Silicon Native; Windows 64-bit Intel + 32-bit
  - macOS 10.13 or newer; Windows 11 or newer
  - 200 MB hard disk space, 8 GB RAM
  - Zero-latency processing
  - Head/tail/full modulation with amplitude and random modulation
  - Multi-stage delay with random pitch modulation in feedback path
  - Gate and compressor dynamics processing (gated reverb, ducking)
  - Five envelope types: Volume, Low-Pass, High-Pass, Pan, Stereo-Width
  - High-quality IIR equalizer with damping: Low/Mid/High
  - Pre-delay up to 2000 ms
  - Forward/reverse switch
  - Import formats: SIR3, SIR, WAV, AIF, FLAC, OGG
  - No dongle required
