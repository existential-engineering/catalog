description: "Convolution reverb plugin with 33 highly realistic HDIR impulse
  responses made by Pinguin Ingenieurbuero. Features a flexible modulation
  section with multi-stage delay, random pitch and amplitude modulation, dynamic
  processing with gating and ducking, and envelope processing with volume,
  low-pass, high-pass, width and pan controls. Zero-latency processing with low
  CPU consumption."
details: |-
  Supported architectures: 64-bit Intel Win+Mac, Apple Silicon Native, 32-bit Win. Requires Windows 7 or newer, Mac OS 10.9 or newer. 200 MB hard disk space. Includes 33 HDIR impulse response models.
specs: |-
  Plugin formats: VST, VST3, AudioUnit, AAX. 64-bit Intel Win+Mac, Apple Silicon Native, 32-bit Win. 33 HDIR models included. Convolution reverb engine. Modulation section with multi-stage delay. Dynamic processing (gating, ducking). Volume, Low-Pass, High-Pass, Width, Pan envelopes. Zero-latency processing.
