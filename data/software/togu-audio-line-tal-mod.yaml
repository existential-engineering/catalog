description: TAL-Mod is a virtual analog semi-modular synthesizer with exceptional sound and almost unlimited modulation possibilities. Features 3 oscillators with saw/pulse/triangle/sine waveforms, noise oscillator, 2 high quality analog resonance filters with multiple modes, full stereo signal path, FM/ring modulation, hard sync, up to 7 sound generators per oscillator, 2 LFOs, 3 ADSRs, modulation envelope with spline/step modes, virtual patch cable routing, sequencer/arpeggiator, and effects.
details: |-
  TAL-Mod is a virtual analog synthesizer with an exceptional sound and almost unlimited modulation possibilities. Its special oscillator model is able to create a wide range of sounds, from classic mono to rich stereo leads, effects and pads.

  Routings can be done with virtual patch cables. Just connect a modulation output with a modulation target. After that it's possible to adjust the intensity of the modulation. You don't need to be a modular expert. The plug-in is suitable for beginners and experts!

  The synthesis engine runs three oscillators offering saw, pulse, triangle and sine waveforms plus an additional noise oscillator with adjustable color. Two oscillators support hard sync, FM and ring mode are available, and osc I and osc II can stack up to seven sound generators each for stereo sounds and rich harmonics. Two high quality analog sounding resonance filters offer LP, HP, Notch, All Pass and BP modes with parallel or serial routing and selectable oscillator sources, all through a full stereo signal path.

  Modulation sources include two LFOs with different waveforms, sync, trigger and unipolar modes and a modulatable rate, three ADSR envelopes, and a modulation envelope with spline or optional step mode plus trigger and host sync. An optional sequencer or arpeggiator, basic effects (high pass filter, chorus, eq, reverb and delay), mono and polyphonic modes, microtuning support via file import and MTS Client, a resizable UI and user-chosen UI colors round out the instrument.

  The current download is version 1.9.8, available as a Windows, macOS and Linux installer alongside a PDF user manual. Requirements are Windows 7 or higher (64 bit host), macOS 10.9 or higher (64 bit host, Universal Binary 2 with native Intel and Apple silicon support for M1, M2, M3 and later), Pro Tools 10.3.6 or higher (64 bit) for AAX, and 64 bit Linux on Ubuntu 18 or similar. The demo version produces a rising white noise sound every minute.
specs: |-
  - 3 oscillators with optional saw, pulse, triangle and sine waveforms
  - 1 additional noise oscillator with adjustable color
  - Microtuning support (file import and MTS Client)
  - 2 high quality analog sounding resonance filters with different modes (LP, HP, Notch, All Pass, BP)
  - Different filter routing possibilities (parallel and serial), with the possibility to choose the oscillator sources
  - Full stereo signal path
  - FM / RingMode support
  - 2 oscillators support hard sync for saw, pulse, triangle waveforms
  - Up to 7 sound generators per oscillator for osc I and osc II, for stereo sounds and rich harmonics
  - 2 LFOs with different waveforms, sync, trigger, unipolar modes and the possibility to modulate the rate
  - 3 ADSRs
  - Modulation envelope with spline or optional step mode, trigger and host sync mode
  - Almost unlimited modulation possibilities with patch cable routing
  - Optional sequencer or arpeggiator
  - Basic effects: high pass filter, chorus, eq, reverb and delay
  - Mono and polyphonic mode
  - Resizable UI with user-chosen colors
  - MPE support (added in version 1.5.0)
  - Windows: Windows 7 or higher (64 bit host)
  - macOS: 10.9 or higher (64 bit host), Universal Binary 2 with native Intel and Apple silicon support (M1, M2, M3...)
  - AAX: Pro Tools 10.3.6 or higher (64 bit)
  - Linux: 64 bit / Ubuntu 18 or similar
  - Demo restriction: the plug-in produces a rising white noise sound every minute
