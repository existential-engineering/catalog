details: |-
  GForce's M-Tron Pro IV delves into the iconic Mellotron M400, a tape-based keyboard famous for its use in recordings by renowned artists like The Beatles, Led Zeppelin, Radiohead, Oasis, Trent Reznor, Trentemøller, AIR, Nils Frahm, and many others. Its distinct sounds are widely utilised in genres such as progressive rock and indie rock but also lo-fi and hip hop.

  M-Tron Pro has gained significant acclaim as the finest software emulation of the Mellotron, appreciated both by top producers and avid Mellotron enthusiasts. Boasting an extensive 3.5GB sound library, including over 200 tape banks, it provides a wealth of sonic possibilities. The newly enhanced browser simplifies the exploration of this vast library, making M-Tron Pro IV an unparalleled source of inspiration. With its redesigned interface, GForce's M-Tron Pro enables effortless and efficient sound customisation, allowing you to shape the sounds according to your creative ideas.

  M-Tron Pro IV has a fully-scalable UI. The new powerful Preset and Tape-Bank Browsers empower effortless navigation through the extensive library of more than 800 presets, ensuring quick access to the perfect sound. Take advantage of new functionalities like Undo, Redo, Copy, and Paste, ensuring seamless editing and experimentation. Enjoy an extended keyboard range, now spanning seven semitones lower.

  Experience the authentic tape-based playback with the new Tape Wow and Flutter feature, augmenting the organic imperfections that give the mellotron its unique charm. Amp simulation brings warmth and character to your sound. The introduction of an alternative state-variable filter and ensemble effect, new LFO shaping possibilities and a matrix reverb adds further depth and character to your sound. The expanded Poly Aftertouch and Velocity controls offer enhanced playability and expressiveness.

  M-Tron Pro offers 35 individually sampled notes with a new extended keyboard mode adding an additional 7 semitones in the lower range. It also supports dual-layer and split-keyboard operation in addition to MIDI Learn. All of this functionality adds up to a wealth of control including tape-based effects, such as wow, flutter, reverse and half speed; amp simulation, ensemble, delay and reverb effects; multimode filters; LFO to pitch, pan, level or filter; Filter & Amp envelopes; velocity and aftertouch performance controls. What's more, M-Tron Pro can operate standalone, so it's easy to quickly load it up on your laptop and perform with a MIDI controller onstage.
specs: |-
  - Sound library: 3.5GB+
  - Tape banks: 200+
  - Presets: 800+ (including 100+ new)
  - Dual-layer and split-keyboard operation
  - Extended range: 7 semitones below standard Mellotron
  - Tape effects: reverse, half-speed, wow, flutter
  - Effects: amp simulation, ensemble, delay, matrix reverb
  - Filter: multimode including state-variable option
  - LFO destinations: pitch, pan, level, filter
  - MIDI Learn, undo/redo/copy/paste
  - Mac: macOS 10.13 or above, Intel or Apple Silicon
  - Windows: Windows 7 or above, 2GHz CPU, 2GB RAM
