description: Software emulation of the iconic Mellotron M400 tape-based keyboard. Features nearly 200 tape banks, 3.5GB+ factory samples, 800+ presets curated by world-class artists. Includes dual-layer and split keyboard operation, tape effects, amp simulation, and extended keyboard range.
details: |-
  M-Tron Pro IV is GForce Software's acclaimed digital emulation of the iconic Mellotron M400, a tape-based keyboard famous for its use in recordings by renowned artists across decades of popular music.

  The instrument features an extensive 3.5GB+ sound library with nearly 200 tape banks and over 800 patches, including 100+ newly created presets. M-Tron Pro has gained significant acclaim as the finest software emulation of the Mellotron, appreciated both by top producers and avid Mellotron enthusiasts.

  M-Tron Pro IV supports dual-layer and split-keyboard operation with an extended keyboard range of 7 semitones lower than a standard Mellotron. Authentic tape effects include reverse, half-speed, wow, and flutter. The effects section offers amp simulation, ensemble, delay, and matrix reverb. A multimode filter section includes a new state-variable filter option, complemented by an LFO with destinations spanning pitch, pan, level, and filter.
specs: |-
  - Sound library: 3.5GB+
  - Tape banks: 200+
  - Presets: 800+ (including 100+ new)
  - Dual-layer and split-keyboard operation
  - Extended range: 7 semitones below standard Mellotron
  - Tape effects: reverse, half-speed, wow, flutter
  - Effects: amp simulation, ensemble, delay, matrix reverb
  - Filter: multimode including state-variable option
  - LFO destinations: pitch, pan, level, filter
  - MIDI Learn, undo/redo/copy/paste
  - Mac: macOS 10.13 or above, Intel or Apple Silicon
  - Windows: Windows 7 or above, 2GHz CPU, 2GB RAM
