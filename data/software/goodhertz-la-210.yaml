description: Free audio plugin from Goodhertz combining an opto compressor,
  Chino soft clip saturation, and an FE90 cassette tape model in one
  configurable three-section chain. Supports six processing order combinations
  and a brickwall limiter. Part of the Goodhertz Free Series; currently in beta.
details: |-
  LA-210 is a free audio plugin from Goodhertz combining three distinct signal
  processors into a single unit. It features an opto compressor derived from
  Goodhertz's Tupe plugin, bringing classic optical compression character to any
  signal chain.

  The plugin includes a "Chino" soft clip saturation mode sourced from Goodhertz's
  VCME plugin, adding harmonic saturation and controlled clipping for warmth and
  presence. A cassette tape model based on the FE90 format — borrowed from Tupe Wow
  — offers tape speed control for vintage texture and subtle modulation.

  A brickwall limiter rounds out the processing chain, and users can configure up to
  six different ordering combinations of the compressor, clipper, and tape sections.
  The plugin processes in double-precision floating-point and fully supports parameter
  automation without zipper noise.

  LA-210 is part of the Goodhertz Free Series and will remain free upon its full
  release. It is currently in beta.
specs: |-
  - Audio Unit (AU) 64-bit, VST 64-bit, VST3 64-bit, AAX 64-bit
  - macOS 10.13 or later
  - Windows 10 or later
  - Stereo input / stereo output
  - Double-precision floating-point processing
  - Six processing order configurations (compressor, clipper, tape sections)
  - Speed Limit control with three intensity levels (25mph, 65mph, 99mph)
  - Embedded level meters with drive, gain reduction, and output display modes
  - Click/pop-free automation on all parameters
  - MIDI Learn for parameter control
  - Plugin settings exportable/importable as shareable URLs
