description: A virtual analog compressor/saturator developed by Kazrog in collaboration with Grammy-winning engineer Michael H. Brauer, based on his custom modified AWA G7201 Limiting Amplifier.
details: |-
  MHB Green is a virtual analog compressor/saturator developed by Kazrog in close collaboration with Grammy-winning mix engineer Michael H. Brauer (Coldplay, John Mayer, James Bay), based on his custom modified AWA G7201 Limiting Amplifier.

  The plugin features custom-modeled tube compression and saturation, a line amp mode for subtler saturation without compression, and over 120 professional presets. Modern workflow enhancements include headroom control, warmth adjust, wet/dry blend, and Analog Entropy.

  Ultra-low CPU impact and minimal latency make it practical for use across all tracks in a session. MHB Green ships as a perpetual license with no iLok, dongle, or subscription required, and supports installation on multiple devices.
specs: |-
  - Custom-modeled tube compression and saturation
  - Line amp mode for saturation without compression
  - 120+ professional presets
  - Headroom, warmth adjust, wet/dry blend, Analog Entropy controls
  - macOS 10.13+; Universal Binary 2 (Apple Silicon & Intel)
  - Windows 10+
  - Linux: VST3, VST2, LV2 compatible hosts
  - AAX requires Pro Tools 12+
  - Perpetual license; no iLok, no subscription
