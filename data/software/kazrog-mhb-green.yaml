description: Tube compressor plugin developed with Michael Brauer. Modeled on his custom AWA G7201 used on Coldplay, John Mayer, and more. 120 pro presets. Try it free.
details: |-
  MHB Green is a virtual analog compressor/saturator plugin developed by Kazrog in close collaboration with Grammy-winning mix engineer Michael H. Brauer (Coldplay, John Mayer, James Bay), based on his custom modified AWA G7201 Limiting Amplifier. The page subtitles it "Michael Brauer's Prized Vintage Tube Compressor" and describes the unit as one of his most-used pieces of analog hardware, available as a plugin for the first time ever.

  The headline features listed are the sound of the modified AWA G7201 itself, modern workflow enhancements (expanded headroom, warmth adjust, wet/dry blend, and Analog Entropy, Kazrog's adjustable component tolerance drift modeling), and a line amp mode for subtler tube saturation on mixes and masters without adding compression.

  The plugin ships with 120 pro presets from industry names including Michael Brauer, F. Reid Shippen, Vance Powell, and Bruce Sugar, with new presets promised in future free updates.

  Brauer is quoted on the page: "Not only did Kazrog nail the sound, but together we added some cool features. It makes MHB Green way more versatile than the hardware version without sacrificing sound quality."

  System requirements are listed per platform. Mac needs macOS 10.13.x or higher and a VST, AU, or AAX (64-bit) host, with Pro Tools 12 or higher for the AAX version; all Kazrog plugins are Universal Binary 2 with native Apple Silicon and Intel support. Windows needs Windows 10 or higher and a VST or AAX (64-bit) host. Linux needs a VST3, VST2, or LV2 compatible host and has been tested with Ubuntu, Linux Mint, Debian, and Manjaro. Licensing is a 100% perpetual license for multiple devices with no iLok authorization and no subscription fees, and a time-unlimited demo is available with random silent output and preset saving disabled.
specs: |-
  - Models Michael H. Brauer's custom modified AWA G7201 Limiting Amplifier
  - Expanded headroom, warmth adjust, and wet/dry blend
  - Analog Entropy: adjustable component tolerance drift modeling
  - Line amp mode for tube saturation without compression
  - 120 pro presets from Michael Brauer, F. Reid Shippen, Vance Powell, Bruce Sugar and others
  - Mac: macOS 10.13.x or higher; VST, AU, or AAX (64-bit) host required
  - Mac: Universal Binary 2, native Apple Silicon and Intel
  - Windows: Windows 10 or higher recommended; VST or AAX (64-bit) host required
  - Linux: VST3, VST2, or LV2 host required; tested on Ubuntu, Linux Mint, Debian, Manjaro
  - Pro Tools 12 or higher required for the AAX version
  - Apple M1 or Intel i5 'Ivy Bridge' CPU or newer strongly recommended
  - 100% perpetual license for multiple devices; no iLok authorization required; zero subscription fees
  - Time-unlimited demo with periodic random silent output and preset save disabled
