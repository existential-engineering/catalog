details: |-
  BASiS features a comprehensively sampled collection of acoustic, upright,
  electric, and synth basses, offering incredible attention to detail in the
  depth and breadth of the basses with 24-bit sampling, DI and amp blending
  control, multiple velocity layers, seamless humanizing, custom legato and
  vibrato tools, release layers, harmonics, hammer-ons, pulloffs, slides, slaps,
  rakes, falls, and more.

  Basis includes more than 7 gigabytes of samples from a diverse collection of
  basses: classics like the jazz bass, p-bass, rickenbacker, and musicman basses
  are presented alongside personality and genre tributes such as a classic
  motown bass, a gospel bass, jaco's fretless, and macca's hofner. One upright
  bass and three slap basses are also included. In the synth bass category, more
  than a hundred patches are provided, ranging from thumping vintage synth
  basses to techno basses and esoteric fresh creations to spice up your tracks.

  All electric basses have been sampled from both the direct input (di) and an
  amped perspective. A knob on the interface allows phase-aligned blending of
  the two, or the selection of one or the other. For the upright bass, the same
  knob allows mixing of the direct input and a phase-aligned tube mic output
  capture of the same sessions.

  A comprehensive selection of effects is included, including an octaver,
  compression, saturation, lo-fi, distortion, limiter, phaser, flanger, chorus,
  reverb, and delay. Performance features include an innovative legato tool
  designed for true finger-smooth playing, and a customizable vibrato engine
  with control over vibrato types, speeds, and depths.

  Basis is powered by the kontakt player 2 engine, offering total integration
  into all major sequencers via its audiounit, VST, and rtas plug-ins, as well
  as standalone operation. It also works perfectly within both kontakt 2 and
  kontakt 3.
