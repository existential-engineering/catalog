details: |-
  Ample metal hellrazer aims to bring a schecter hellraiser nine string guitar sound to your studio. It is suited for heavy metal styles such as metalcore, progressive metal and djent.

  Sampling includes: sustain, palm mute, natural harmonic, hammer on & pull off, legato slide, slide in, slide out, pop, pinch harmonic, tap articulations. Polyphonic legato and slide smoother enables realistic legato across any interval and speed. Drop tuning is supported, with lowest note down to b-1. Authentic left-hand performance noises are included.

  Riffer 4 is a MIDI editor tailored for plucked string instruments. The innovative strum note treats multiple sub-notes within a chord as a single editable object, allowing unified control over strum time, velocity gradient, and legato parameters. Combined with authentic guitar fingering settings, this makes strum creation more intuitive and efficient, delivering results that are closer to real performance.

  Dual view modes enable seamless real-time switching between piano roll and guitar tab views. String visualization system visualizes strings within the piano roll, enabling MIDI writing that adheres to authentic plucked instrument techniques by automatically preventing polyphony on the same string and intelligently assigning fingering.

  Amp simulator includes 7 classic amp heads (metal double, metal treble, lead 800, jazz 120, 65 twang, 65 delight, and 57 delight) paired with 8 guitar cabinets, each captured with 8 microphones. Built-in effects include 8-band eq, compressor, delay, and convolution reverb.
specs: |-






  - Schecter hellraiser nine string guitar sound

  - Tuning: #c, #f, b, e, a, d, g, b, e

  - Drop tuning supported down to b-1

  - 10 articulations: sustain, palm mute, natural harmonic, hammer on & pull off, legato slide, slide in, slide out, pop, pinch harmonic, tap

  - 5.8 gb size

  - Polyphonic legato and slide smoother

  - Authentic left-hand performance noises

  - Riffer 4 MIDI editor

  - Strumming and chord system with strum note

  - Dual view modes: piano roll and guitar tab

  - String visualization system

  - Full MIDI import/export compatibility

  - Technique editing: fingering, articulation, legato, expression

  - MIDI cc and velocity editors

  - Extensive riff library

  - Strummer with chord detection and strum seq

  - Tab reader 4: guitar pro gp3 to guitar pro 8 support

  - Bass track import capability

  - Amp simulator with 7 amp heads: metal double, metal treble, lead 800, jazz 120, 65 twang, 65 delight, 57 delight

  - 8 guitar cabinets with 8 microphones each

  - Built-in effects: 8-band eq, compressor, delay, convolution reverb
