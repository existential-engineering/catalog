description: Nembrini Audio Divided 11 Class A Boutique Guitar Amplifier is modeled on the Divided by 13 CJ11, a tube-rectified Class A combo with a single channel and simple Volume, Treble, Bass and Master controls.
details: |-
  "A Class A boutique amplifier plugin with crisp, clear tone"

  Nembrini Audio Divided 11 Class A Boutique Guitar Amplifier is modeled on Divided by 13 CJ11*. Divided 11 is a Class A combo amplifier, tube-rectified, with a single channel and simple controls for Volume, Treble, Bass, and Master. It delivers a crisp, clear tone that saturates extremely well, offering a very balanced sound across the frequency spectrum.

  Filters include Tight, which reduces low frequency content tightening the low range, Rumbling, which reduces the low-frequency content, and Harsh, which reduces the high-frequency content.

  The Noise Gate offers Threshold to define the level where the gate is activated, Range to select the quantity of noise reduction, and Gate to adjust the gate speed.

  With Nembrini Audio Divided 11 Guitar Amplifier it is possible to choose between six different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs. A complete Mixer section with Solos, Mutes, Pans and Faders allows you to blend together the two microphones with the ambience. The Impulse Loader lets you load up to three third-party impulse responses that you can even blend together using volume, pan, phase, solo and mute controls.

  Legal Disclaimer: Divided By 13 CJ11 is a registered trademark of Divided By 13 Amplification. Divided 11 was developed by Nembrini Audio SRL based on its own modelling techniques. Divided By 13 Amplification has not endorsed nor sponsored the Divided 11 in any manner, nor licensed any intellectual property for use in this product.
specs: |-
  - Modeled on the Divided by 13 CJ11
  - Class A combo amplifier, tube-rectified, single channel
  - Controls for Volume, Treble, Bass and Master
  - Filters: Tight, Rumbling, Harsh
  - Noise gate with Threshold, Range and Gate speed controls
  - Six guitar cabinets with four microphone emulations, on/off axis switch, position and distance knobs
  - Mixer section with solos, mutes, pans, faders and ambience blending
  - Impulse response loader for up to three third-party IRs with volume, pan, phase, solo and mute
  - Free impulse responses included
  - iOS version for iPhone and iPad
  - Requires a VST2, VST3, AAX or AudioUnits compatible host
  - Intel compatible or Apple Silicon CPU, 1GB RAM
  - Mac OS 10.9 or newer, Windows 7 or newer, 64-bit DAW
