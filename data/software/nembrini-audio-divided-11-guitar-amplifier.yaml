description: The Divided 11 is a plugin emulation of a Class A combo amplifier, tube-rectified, with a single channel and simple controls, based on the Divided by 13 CJ11 amplifier. It delivers a crisp, clear tone that saturates extremely well, with an integrated cabinet section, noise gate, and impulse response loader.
details: |-
  - "The Divided 11 is a faithful emulation of the Divided by 13 CJ11, a Class A combo amplifier featuring tube rectification and a single channel with simple controls: Volume, Treble, Bass, and Master. This boutique amp is renowned for its crisp, clear tone that saturates extremely well, making it a favorite for players seeking touch-sensitive, harmonically rich tones."
  - "Three filter options shape the low and high frequency response: Tight and Rumbling both reduce low-frequency content for a tighter or more controlled bottom end, while Harsh cuts high-frequency content for a smoother, warmer character. These filters allow fine-tuning of the amplifier's response to suit different playing styles and pickup types."
  - An integrated noise gate with Threshold, Range, and Gate speed controls helps eliminate unwanted noise and hum without affecting the natural dynamics of the playing. The gate can be dialed in subtly for studio use or more aggressively for high-gain situations.
  - The cabinet section offers six guitar cabinet choices, each with four microphone emulations. Players can adjust on/off axis positioning and microphone distance, and use a full mixer section with solos, mutes, pans, and faders for detailed cabinet tone shaping.
  - An impulse response loader supports up to three third-party IRs simultaneously, with blending controls for mixing them together. This allows players to combine the built-in cabinet emulations with custom IRs for a highly personalized sound. Free impulse responses are included with the plugin.
specs: |-
  - Based on the Divided by 13 CJ11 Class A combo amplifier
  - Controls: Volume, Treble, Bass, Master
  - Filter options: Tight, Rumbling, Harsh
  - Integrated noise gate with Threshold, Range, and Gate speed controls
  - Six built-in guitar cabinet emulations
  - Four microphone emulations per cabinet with on/off axis and distance controls
  - Cabinet mixer with solos, mutes, pans, and faders
  - Impulse response loader supporting up to three third-party IRs
  - Formats: VST2, VST3, AAX, Audio Units (64-bit only)
  - macOS 10.9 or newer (Intel and Apple Silicon)
  - Windows 7 or newer
  - iOS (iPhone/iPad)
  - Minimum 1GB RAM
  - Version 1.0.6
