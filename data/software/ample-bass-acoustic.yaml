details: |-
  Ample bass acoustic is based on a guild b-54 ce acoustic bass, featuring a wide range of realistic articulations and a brand-new MIDI composition system. It is an essential acoustic bass instrument for modern music production.

  Riffer 4 is a MIDI editor tailored for plucked string instruments with dual view modes enabling seamless real-time switching between piano roll and guitar tab views, offering two perspectives for reviewing and editing compositions.

  String visualization system visualizes strings within the piano roll, enabling MIDI writing that adheres to authentic plucked instrument techniques by automatically preventing polyphony on the same string and intelligently assigning fingering.

  Polyphonic legato and slide smoother enables realistic legato across any interval and speed, with drop tuning supported and lowest note down to b0.

  The virtual bass amp system includes 3 classic bass amp heads (b15r, ba500, and svt-pro), 4 cabinet options (1x15, 2x10, 4x10, 8x10), with each cabinet supporting 4 mic types (u87, c414, md421, sm57), plus built-in effects including 8-band eq, compressor, delay, and convolution reverb.
