description: ChannelStrip MK 3 is a plugin designed to be used on every track, providing one EQ with many bands a two dynamics modules
details: |-
  The HoRNet ChannelStrip MK3 is a versatile plugin designed for every day use, we designed a tool that you can put on every channel and gives you one EQ and two dynamics processors, everything you usually need to achieve a sweet mix.

  In addition to the Equalizer an Dynamics sections the ChannelStrip MK3 includes six different signal path routings (ex. Expander -> EQ -> compresor for a typical drum setup, or EQ -> FET compressor -> OPTO compressor for a typical vocal setup), analog emulation that adds saturation (each model has a different saturation type) and other non linearities, and oversampling where it matters, which means that each model has a different oversampling level when the option is activated so that the plugin always use least amount of CPU needed for the maximum quality.

  Effective metering: every module has its own input and output meter and level trim and since everything is built around analog models we have put there VU Meters instead of peak meters. There are also input and output peak meters, in case you need to know the maximum peak of the signal, and automatic gain staging, so that the plugin is fed with the perfect level for its internal analog engine.

  The HoRNet ChannelStrip MK3 features one equalizer with a very sweet tone that has the classic controls of a large console equalizer, but with some experience tuned EQ curves. The EQ has hi pass and low pass filters, a hi shelf inspired by the one found in a famous large console, a low shelf inspired by the peculiar response of a famous passive EQ, and three parametric bands with a wide Q range that can be used for tone shaping and surgical filtering.

  We fit two dynamics processors in the ChannelStrip MK3 so that you can compress as much as you want. Each module has four different compression models, each with its peculiar analog characteristic emulated: VCA, inspired by the common compressors found in consoles, solid state feed forward versatile compression; FET, an emulation of the character of very fast vintage FET units, a feedback compressor that can be very aggressive; OPTO, inspired by a famous tube limiter, feed forward with a smooth response; and Expander, which works as a traditional gate/expander based on a VCA design.

  The HoRNet ChannelStrip MK3 has no copy protection, we don't believe in copy protection, they are always cracked and they are annoying for the users.
specs: |-
  - One equalizer with filters, shelves and 3 parametric filters
  - Two dynamics processors
  - Three compression models (VCA, FET, OPTO) and one expander
  - Six different routing options
  - Analog emulation
  - Automatic gain staging
  - “RealGR” meter showing real speed gain reduction with peak hold
  - VU meters for each module, input and output peak meters with peak hold
  - Global bypass with constant monitoring level (when auto output is used)
  - Oversampling designed to be efficient
  - macOS X (>=10.11) and Windows (Vista and later) support
  - Apple Silicon native support
  - 64bit only both on Mac and Windows
  - Audio Units VST2.4, VST3 and AAX format
