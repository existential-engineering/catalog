description: Palindrome 2 is a granular sampler plugin combining four independent granular sampler modules with a coordinate-based morph plotting system for experimental sound design. Bilinear interpolation enables smooth transitions between up to 16 custom path points, while per-module insert effects and comprehensive randomization tools encourage exploratory sound sculpting.
details: |-
  4 Granular Sampler Modules
  Morph Plotting System with up to 16 Custom Path Points
  Bilinear Interpolation for Smooth Morphing
  8 Multi-Breakpoint Modulation Envelopes
  2 Insert Effects Per Sampler (filters, distortion, ring modulation, delay)
  Global Reverb
  4-Note Polyphony
  Comprehensive Randomization System
  Envelope and Path Shape Presets
  80+ Factory Presets
  1.5 GB Sample Library
