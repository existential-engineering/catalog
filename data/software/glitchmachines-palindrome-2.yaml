description: "A granular sampler focused on experimental sound design. Combines
  four granular samplers with a coordinate plotting grid and complex modulation
  sources to enable morphing sound effects and unusual instrument patches. Users
  create custom paths on a grid that guide a playhead's trajectory, using
  bilinear interpolation to smoothly morph between sampler outputs."
details: |-
  4 Granular Sampler Modules
  Morph Plotting System with up to 16 plotted points
  8 Multi-Breakpoint Envelopes
  2 Insert FX Per Sampler (filters, distortions, ring modulation, delay)
  Comprehensive Randomizer
  Envelope & Path Shape Presets
  80+ Factory Presets
  1.5GB Sample Library
  4-note Polyphony
  Global Reverb
