details: |-
  Blueprint - Textural Violin is a virtual instrument audio plugin and a
  software application for macOS and Windows. It includes, and is therefore
  "powered by", Kontakt player, which functions as an Audio Units plugin, a VST
  3 plugin, an AAX plugin and a standalone application.

  The fifth instalment of our blueprint series showcases the early experiments
  performed by composer and violinist alexander parsons ahead of the recording
  sessions for our collaborative library, trails: evocative soundscapes.

  The library showcases four articulations and a bespoke atmosphere layer that
  gives a small flavour of what's possible with the full trails library.
specs: |-
  - Kontakt player
  - Four articulations
  - Atmosphere layer
  - Universal 2 binary
