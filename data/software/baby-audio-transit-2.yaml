description: Make your mixes move. The ultimate plugin for adding transitions and
  movement to your tracks. Features 6 different motion modes and 28 unique
  effect modules. Developed in collaboration with Andrew Huang.
details: |-
  Transit 2 is a motion multi-effect plugin developed in collaboration with Andrew Huang. It is designed to add transitions, rhythmic movement, and complex sidechain effects to mixes. The plugin features 6 different motion modes and 28 unique effect modules that can be chained together and set into motion.

  The six motion modes are Macro, LFO, Follower, Sidechain, Gate, and Sequencer. Four of these modes are new in version 2. Each mode provides a different way to animate and modulate the effect chain.

  The 28 effect modules include Loop, Reverser, Warp, Retroverb, Mod Filter, Compressor, Pitch+, Speaker, Analog Chorus, EQ, Auto Pan, Bitcrusher, Digital Chorus, Delay, Distortion, Filter 12, Filter 24, Flanger, Noise, Osc, OTT, Phaser, Pitch Shift, Pump, Reverb, Spread, Tremolo, and Utility.

  Transit 2 ships with 968 presets crafted by Andrew Huang and professional sound designers. The plugin includes a randomization engine with lockable parameters for creative exploration.
specs: |-
  - 6 motion modes: Macro, LFO, Follower, Sidechain, Gate, Sequencer
  - 28 unique effect modules (10 new in V2)
  - 968 presets (599 new in V2)
  - Randomization engine with lockable parameters
  - Global Mix and Output linkable to motion mode
  - Native Apple Silicon M-Chip support
  - 64-bit only
