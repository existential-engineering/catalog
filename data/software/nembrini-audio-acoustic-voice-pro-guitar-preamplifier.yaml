description: Studio-grade acoustic modeling plugin that transforms direct pickup
  signals into rich, natural acoustic guitar tones using studio-grade modeling,
  microphone emulations, and advanced tone-shaping tools.
details: |-
  Acoustic Voice Pro Guitar Preamplifier is a comprehensive acoustic guitar plugin that converts direct pickup signals into studio-quality acoustic tones. It includes 10 meticulously modeled acoustic guitar emulations spanning iconic instruments from Martin, Gibson, Guild, Taylor, Weissenborn, Landola, and Ayers.

  The plugin features 5 microphone emulations (Audix ADX51, Beyerdynamic M201, Shure SM57, Electro-Voice RE20, and AKG C414), allowing users to blend microphone characters onto the modeled acoustic sound for realistic placement and coloration.

  Acoustic Voice Pro includes a full pedal section with Noise Gate, DI Preamp, Compressor, and Doubler, plus a visual equalizer for precise tone shaping. An IR Loader accepts both factory impulse responses and third-party IRs for additional cabinet and room coloration.

  The post-effects chain adds Analog Delay, Room Reverb, and Modulation to complete the signal path. Compatible with 64-bit DAWs on macOS 10.13 or later and Windows 7 or later, running on both Intel and Apple Silicon CPUs.
specs: |-
  - 10 acoustic guitar emulations: Martin 1936 0-17, Weissenborn, Martin 0028EC, Martin HD-28V, Gibson L-00, Landola J80E, Guild D140CE, Ayers DSR, Taylor 814ce Deluxe, Taylor Grand Theater K21e
  - 5 microphone emulations: Audix ADX51, Beyerdynamic M201, Shure SM57, Electro-Voice RE20, AKG C414
  - IR Loader with factory impulse responses and third-party IR support
  - Pedal section: Noise Gate, DI Preamp, Compressor, Doubler
  - Visual equalizer
  - Post-effects: Analog Delay, Room Reverb, Modulation
  - Formats: AU, VST2, VST3, AAX
  - macOS 10.13+ (Intel and Apple Silicon)
  - Windows 7+
  - 64-bit DAW required
  - 1 GB RAM minimum
  - Version 1.0.3
