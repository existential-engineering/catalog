description: "A true modal filter plugin using hundreds of precisely tuned
  bandpass filters to simulate resonant qualities of real-world objects.
  Functions as a classic filter, phaser, or sound resynthesizer capable of
  transforming source material into new textures. Features 27 sound modeling
  modes and 200+ presets."
details: |-
  Modal filter with seamless mode morphing
  27 sound modeling modes (acoustic, synth-style, mathematical, effects)
  200+ presets
  Drive SVF filter input and Modal filter output
  4 modulation slots with 6 modulation sources
  24dB per-octave slope state-variable filter
  Blend between SVF and Modal filter
  Self-resonance capability
  Partial controls for frequency shaping
  Decay and damping controls
  Stereo operation with independent left/right modulation
