description: Supermodal uses hundreds of resonating filters to emulate the behavior of various resonating bodies. It contains 27 different filter models ranging from acoustic to synth-style to mathematical to special effects.
details: |-
  Supermodal is a modal filter plug-in that uses hundreds of precisely tuned bandpass filters to simulate the resonant qualities of real-world objects. That engine lets it work as a classic filter, as a phaser, or as a re-synthesis tool that turns a drum loop into a melody or a static pad into an evolving texture.

  The modal filter models the resonant bodies of instruments, objects, and waveforms. There are 9 models, each with 3 variations, for a total of 27 modes covering flangers, phasers, vocal filters, and physical and mathematically modeled resonators. Decay, damping, and partial settings give control over how those characteristics are applied, and the partial control can eliminate high or low frequencies entirely.

  A classic state-variable filter runs in parallel with the modal filter and blends smoothly between high-pass, band-pass, and low-pass. It uses a 24dB per-octave slope familiar from analog synthesizers and self-resonates when resonance is pushed past 100. A Drive feature adds warmth and thickens the signal, and a Blend slider crossfades between the state-variable and modal filters for seamless morphing.

  The modulation system offers 4 slots and 6 sources: Meta knob, ADSR, envelope follower, sequencer, MIDI/CV triggers, and randomizer. Slots can cross-modulate each other, and virtually every parameter can receive modulation. Both the state-variable and modal filters operate in stereo, so left and right can be modulated independently or together.

  The plug-in ships with over 200 presets.
specs: |-
  - True modal filter using hundreds of precisely tuned bandpass filters
  - Seamless morphing between modes
  - 27 models (9 models with 3 variations each) ranging from musical to mangled
  - Flangers, phasers, vocal filters, physical and mathematically modeled resonators
  - 200+ presets
  - 24dB per-octave slope state-variable filter
  - Blend control between SVF and modal filter
  - Drive on the SVF input and modal filter output
  - Self-resonance when resonance is boosted past 100
  - Partial control to eliminate high or low frequencies
  - Decay and damping controls for modal tails
  - 4 modulation slots with 6 sources: Meta knob, ADSR, envelope follower, sequencer, MIDI/CV triggers, randomizer
  - Cross modulation between modulation slots
  - Stereo operation with independent left and right modulation
  - Supports VST2, VST3, AU, and AAX plug-in formats
  - Windows 64-bit and macOS 10.12+ 64-bit
