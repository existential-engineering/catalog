description: Supermodal is a modal filter plugin that uses hundreds of precisely tuned bandpass filters to simulate the resonant qualities of real-world objects, functioning as a classic filter, phaser, or sound re-synthesizer.
details: |-
  Modal filter using hundreds of precisely tuned bandpass filters
  27 sound modeling modes spanning instruments, objects, waveforms, and mathematical resonators
  200+ presets included
  4 modulation slots with 6 sources: Meta knob, ADSR, Envelope follower, Sequencer, MIDI/CV, and Randomizer
  State-Variable filter (SVF) with 24dB/octave slope
  Drive feature for non-linear warmth and harmonic color
  Decay and damping controls for modal resonance tails
  Partial controls to eliminate specific frequencies
  Stereo processing with independent L/R modulation
  Cross-modulation between modulation slots
  Seamless mode morphing between all 27 models
  Real-time preset switching
