details: |-
  A collection of 35 kontakt instruments taken from my archive of sounds. These instruments date back to 2015 when I was just starting out sound design.

  In it, you'll find lo-fi fm synthesizers sounds processed using guitar pedals (labeled "fm"), high-fi fm synthesizers sampled from a yamaha dx-21, genuine analog synthesizers sounds (labeled "mopho" and "aa" for analog age), original sound design (labeled "vs" for vortex soundwaves), 8-bit sounds taken from smrom, and early 60s sounds taken from thales model I.

  35 kontakt instruments. Early 60s computer sounds taken from thales model I. Lo-fi analog/fm synthesizers sounds. 8-bit sounds taken from smrom.

  The full version of kontakt 5.8.1 and up is required. Not compatible with the free kontakt player. System requirements include macos 10.9 or later, windows 7 or later, 451 mb of hd space, and 2ghz quad-core cpu or better with 4 gb of ram or more.
