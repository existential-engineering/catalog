description: TAL-J-8X is an instrument plug-in that emulates the sound of the
  Roland JX-8P analog 80's synthesizer, with additional modern features
  including MPE support, microtuning, arpeggiator, and built-in EQ, Delay, and
  Reverb effects.
details: |-
  TAL-J-8X is a meticulous emulation of the Roland JX-8P analog synthesizer (rev 2 / OS 3.1) from the 1980s, bringing the classic hardware sound into a modern plug-in format. The emulation captures the original DCO-based architecture while adding a modern filter mode that allows self-oscillation, which was not available on the original hardware.

  The plug-in includes a fully-featured arpeggiator with multiple modes, chord creation and playback functionality, and comprehensive MIDI support including Aftertouch and MPE. Microtuning is supported via .tun file import and MTS Client integration, and individual voice tuning allows the DCO to behave like a VCO.

  Compatibility with the original hardware is a key focus: TAL-J-8X can read Sysex files and Sysex MIDI from the JX-8P, JX-10, and MKS-70, and can also control a hardware device by sending Sysex through the plug-in MIDI output. The original factory banks are included alongside more than 600 presets from contributors including Electric Himalaya, Saif Sameer, Sound Author, Empty Vessel, VIC-20, TAL, Heat Audio, FMR, and others.

  Built-in effects include High Quality EQ, Delay, and Reverb, making it a self-contained synthesizer plug-in. It supports all major plug-in formats (VST2, VST3, AU, AAX, CLAP) and runs natively on both Intel and Apple Silicon Macs via Universal Binary 2.
