description: TAL-J-8X is an instrument plug-in that emulates the sound of the analog 80's synthesizer with additional features that add a fresh touch to this synth.
details: |-
  TAL-J-8X is an instrument plug-in that emulates the sound of the analog 80's synthesizer with additional features that add a fresh touch to this synth. The emulation is modelled on the hardware revision 2 running OS 3.1.

  Alongside the faithful emulation, the plug-in adds a modern filter mode that allows self-oscillation, the ability to create and play chords, and an arpeggiator with different modes. High quality EQ, delay and reverb effects are built in.

  Individual tuning for every voice converts the synth's DCO into a VCO. The plug-in supports aftertouch and MPE, and offers microtuning through tun file import and an MTS Client.

  The plug-in reads Sysex files and Sysex MIDI from the hardware device, accepting tone data from the JX-8P, JX-10 and MKS-70. It can also control a hardware device by sending Sysex through the plug-in MIDI output when the DAW supports it.

  Original factory banks are included, along with more than 600 presets by Electric Himalaya, Saif Sameer, Sound Author, Empty Vessel, VIC-20, TAL, Heat Audio, FMR and others. Additional factory presets and a DT800 MIDI CC mapping preset are offered as separate downloads.
specs: |-
  - Emulation of the 80's hardware synthesizer (rev 2 / OS 3.1)
  - Modern filter mode that allows self-oscillation
  - Create and play chords
  - Arpeggiator with different modes
  - High Quality EQ, Delay and Reverb FX
  - Aftertouch and MPE support
  - Microtuning support (tun file import and MTS Client)
  - Original factory banks included
  - More than 600 presets by Electric Himalaya, Saif Sameer, Sound Author, Empty Vessel, VIC-20, TAL, Heat Audio, FMR and others
  - Individual tuning for every voice converts the synths DCO into a VCO
  - Reads Sysex files and Sysex MIDI from the hardware device (tone data from JX-8P, JX-10, MKS-70)
  - Can also control a hardware device, sending Sysex through the plug-in MIDI output (only possible when supported by the DAW)
  - Windows: Windows 10 or higher (64 bit host)
  - macOS: 10.11 or higher (64 bit host). Universal Binary 2 with native Intel and Apple silicon support (M1, M2, M3...)
  - AAX: Pro Tools 10.3.6 or higher (64 bit)
  - Linux: 64 bit / Ubuntu 22.04 or similar
  - Demo restriction: the plug-in produces a rising white noise sound every minute
