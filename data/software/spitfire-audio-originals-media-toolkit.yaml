details: |-
  From Spitfire Audio co-founder and award-winning media composer, Paul Thomson. Discover the composer's trade secrets and go-to sounds with this broad range of inspiring professional instruments — from classic to experimental. Including Paul's beautiful Yamaha grand piano, an intimately recorded marimba, soft acoustic guitar, ethereal analogue synth pads, leads and bass sounds, and an eclectic palette of percussive samples — detailed hi-hats, scissors, coat hangers and computer keyboards.

  Originals Media Toolkit requires the free Splice INSTRUMENT plugin to run.
specs: |-
  - File size: ~2.5 GB
  - 24 presets
  - 21 Soft Knocker signals
  - macOS 12 or later, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
