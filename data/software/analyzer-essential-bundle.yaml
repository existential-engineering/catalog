details: >-
  The flux: analyzer essential bundle is a virtual effect audio plugin and
  software application for macos and windows. It functions as a VST plugin, an
  audio units plugin, a VST 3 plugin, an AAX plugin and a standalone
  application.


  The foundation of the flux: real time analyzer system is the flux: analyzer
  essential, with a comprehensive range of analyzer options for any imaginable
  audio analysis and measurement, which can be expanded for more specific
  utilization with up to three add-on modules; live, metering/loudness and
  multichannel/surround.


  The flux: analyzer essential is the core of the flux: real time analyzer
  system, and is required in order to run any of the add-on modules; live,
  metering/loudness, multichannel/surround. Main features include: basic
  metering with peak / basic rms meter, peak meter, basic rms meter with fully
  customizable scale and ballistics, phase meter, weighting filters (itu-r
  bs.1770-2 (k-weighting), ansi a, ansi b, ansi c), real-time spectrum analyzer,
  spectrogram display, vector scope, flux: nebula stereo (unique spectrum over
  space scope), and oscilloscope.


  The metering and loudness add-on module provides an extensive set of
  measurement tools well adapted for broadcast and post production facilities,
  presenting the metering tools for a vast range of standards such as true peak,
  rms, itu-1770, ebu-r128 (ploud), history and more. Main features include:
  fully customizable and configurable meters, ebu r128 / ploud, itu-r bs.1770
  true peak, default and user presets, dolby dialogue intelligence, real-time
  metering history, real-time metering statistics, and offline metering
  statistics.


  The multichannel and surround add-on module provides a vast range of
  measurement tools for comprehensive analysis of multichannel audio
  environments. In addition to standard spectrum analyzer and metering tools, an
  innovative set of spectrum tools, flux: nebula, presenting frequency and scope
  over space in a fashion never seen before. Main features include: analysis of
  up to 16 channels simultaneously, adds multi-microphone support for pure
  analyzer live, flux: nebula surround (top view), speaker mode, full control
  over display, and color modes.
