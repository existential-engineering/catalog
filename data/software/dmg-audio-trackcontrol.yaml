description: "All the utilities from the top and bottom of a console channel
  — M/S encoding/decoding, stereo width control, M/S and L/R panning,
  phase control, high-pass filtering, time delay compensation, and gain
  controls — consolidated into a single free channel strip plugin."
details: |-
  TrackControl is a free channel strip utility plugin (requires a free DMGAudio account). It consolidates the essential controls found at the top and bottom of a large-format mixing console channel into a single interface. Features include M/S encode/decode, M/S and L/R panning, stereo width adjustment, phase inversion, L/R swap, high-pass filter with adjustable frequency and slope, and delay compensation (forward and backward on PDC-supporting hosts). Compatible with Pro Tools 7+, Cubase, Nuendo, Wavelab, ACID Pro, Ableton Live, Reaper, Logic, GarageBand, and any DAW supporting VST/AU/AAX.
