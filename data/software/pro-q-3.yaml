description: >-
  FabFilter Pro-Q 3 is a professional parametric equalizer plugin delivering
  the highest possible sound quality, a very extensive feature set, and a
  gorgeous, innovative interface with unrivaled ease of use.
details: |-
  Pro-Q 3 is FabFilter's flagship equalizer, widely considered the
  industry standard for mixing and mastering. Its combination of pristine
  sound quality, intuitive visual interface, and powerful features has
  made it one of the most-used plugins in professional audio.

  The interface displays the frequency spectrum in real time, with EQ
  bands that can be created, moved, and adjusted by dragging directly
  on the display. Each band supports multiple filter shapes including
  bell, high/low shelf, high/low cut, notch, band pass, and tilt shelf
  with adjustable slopes up to 96 dB/octave.

  Up to 24 EQ bands can operate in zero-latency, natural phase, or
  linear phase modes. The dynamic EQ feature allows any band to respond
  dynamically to the input signal, functioning as a frequency-selective
  compressor or expander.

  The spectrum analyzer supports multiple display modes including
  pre/post EQ comparison, spectrum grab (freeze), and external
  sidechain spectrum display. Spectrum Grab provides EQ Match
  functionality for transferring tonal characteristics between tracks.

  Mid/side and left/right processing modes allow independent
  equalization of stereo components. Per-band stereo placement
  provides precise spatial control of individual frequency ranges.
specs: |-
  - Up to 24 EQ bands
  - Zero-latency, natural phase, and linear phase modes
  - Dynamic EQ on any band
  - Multiple filter shapes (bell, shelf, cut, notch, band pass, tilt)
  - Slopes up to 96 dB/octave
  - Full-screen spectrum analyzer
  - Pre/post EQ spectrum comparison
  - Spectrum Grab / EQ Match
  - Mid/side processing
  - Left/right processing
  - Per-band stereo placement
  - Surround support (up to 7.1.2 Dolby Atmos)
  - External sidechain per band
  - Piano roll frequency display
  - Undo/redo with unlimited history
  - A/B comparison
  - Resizable interface
