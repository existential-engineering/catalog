description: "DeBleed: Drums is the ultimate DAW plug-in for mixing engineers and studio pros seeking pristine drum tracks! Say goodbye to unwanted mic bleed and hello to unmatched clarity in your mixes."
details: |-
  If you work with recorded drums, you'll know that unwanted mic bleed can be a big problem, making mixes sound muddy and lacking in definition. Not anymore! DeBleed:Drums is an advanced AI-powered plug-in that enables mixing engineers and studio professionals to quickly and transparently remove unwanted mic spill from drum recordings in real-time, without compromising on quality.

  Designed to enhance clarity and streamline the mixing process, DeBleed:Drums is an essential studio software tool that ensures engineers can achieve tight, professional drum mixes faster and more efficiently than ever before.

  Conventional noise gates can often struggle to remove mic bleed effectively, leading to choked hits, missing ghost notes, and excessive spill. The result? Drums that sound flat, lifeless, or even needing to be replaced entirely with samples. DeBleed:Drums revolutionizes the process. It precisely isolates drum hits, minimizes spill, and retains the authentic resonance of your kit.

  For optimal results, DeBleed:Drums leverages neural network technology to separate drum kit elements, like kicks and snares, while DSP algorithms protect transients for clarity. Its smart triggering logic sets thresholds to remove bleed efficiently, delivering a cleaner and more natural drum mix.

  It works as an insert effect with no offline rendering, running live in the session so changes can be auditioned instantly. Every parameter writes to the DAW's automation lane, and the interface can be resized and rescaled to suit the workflow and screen size.
specs: |-
  - AI-Driven Precision: Trained on hours of real drum recordings for high-quality results
  - Instant Real-Time Stem Separation: Works as an insert effect so no waiting for tedious offline processing and no data privacy issues
  - Powerful Sensitivity control: Get your perfect setting in seconds
  - Trigger Threshold: Remove even more spill and only process the hits you want to
  - Automation enabled: Every parameter writes to your DAW's automation lane
  - Advanced UI controls: Resize and adjust the scaling to suit your workflow and screen size
  - Preset Manager: Save time getting started
  - Perpetual License: No subscription needed
  - Windows: Windows 11 / 10, Intel Core i5 or AMD multi-core processor (Intel Core i7 or faster recommended)
