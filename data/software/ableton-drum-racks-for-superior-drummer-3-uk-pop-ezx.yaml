details: |-
  Ableton drum racks for superior drummer 3 uk pop ezx features separate ableton drum racks for all factory presets for the toontrack superior drummer 3 uk pop ezx expansion library. These racks provide out of the box integration workflow between ableton live and toontrack superior drummer using the ezx expansions including a host of features ready to use for composition and performance using ableton push or similar controllers.

  Amazing workflow in ableton and on your push to the full capabilities of the kit library saving setup time and allowing you to focus on music creation. Ease of navigation to load all uk pop kit factory presets from ableton push controller device browser.

  15 ableton drum racks to instantly load the factory library "mix ready" presets with ableton mappings. Colour coded pad design for visual performance and finger drumming. All our racks use consistent drum rack colouring so you can visually and immediately spot your snares from your crashes.

  All instrument articulations ready to go in one layout using ableton push 64 pad layout mode. Individually labelled drum rack pads for clear visualisation, post performance editing and automation to all drum rack / instrument articulations in ableton.

  Ableton macros mapped to toontrack superior drummer macros with preset values for ease of use in push and simple to use automation programming. 15 ableton drum racks for all factory presets single audio output to a single ableton track. Mixing can be further enhanced through ableton track mixer by expanding out the track for individual pad and instrument level articulation, or loading additional ableton audio effects to the track.
