description: PSP Datamix A567 models an equalizer module from a classic first-generation Datamix console. Officially approved and endorsed by legendary engineer Eddie Kramer (Jimi Hendrix, Led Zeppelin, KISS). Features a three-band EQ with preamp section modeling, output transformer emulation, FAT double sampling, Alt Q mode for gentler response, Sharp mode with High band resonance enhancement, and over 100 professional presets.
details: |-
  Requires iLok user ID and iLok License Manager (no hardware dongle required). Licenses can be activated in up to 3 locations. Supports macOS 10.14 Mojave through 15 Sequoia (Intel and Apple Silicon) and Windows 7-11 (64-bit). AU format is macOS only.
specs: |-
  - Three-band equalization: Low, Mid, High
  - 64-bit double precision floating point processing
  - FAT double sampling (auto-engaged below 50 kHz)
  - Preamp section modeling at input
  - Output transformer emulation
  - Channel tuning variation options
  - Alt Q mode for gentler response
  - Sharp mode with High band resonance enhancement
  - 100+ included professional presets
  - iLok licensing (no hardware dongle required, up to 3 activations)
  - macOS: 10.14-15 Sequoia (Intel and Apple Silicon)
  - Windows: 7-11 (64-bit)
