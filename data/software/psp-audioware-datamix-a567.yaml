details: |-
  PSP Datamix A567 models an equalizer module from the classic first-generation Datamix console. Officially approved and endorsed by Eddie Kramer - who recorded legendary bands such as Jimi Hendrix, Led Zeppelin, KISS, and more on the original Datamix consoles during the golden era of The Record Plant and Electric Lady studios - the plug-in captures the essence of that iconic sound.

  PSP Datamix A567 is designed in such a way that it almost never sounds "neutral": placed on a track as is, with all bands in the "0" positions, it still colours the signal. Even with all bands turned off, there is plenty of sonic character coming from the preamp and output sections.

  The plug-in was modelled from the rack of eight EQ modules from the original Record Plant console, by courtesy of its current owner, Adam Piskorz.

  Over 100 presets are included, designed by pro users from around the world and including a few by Eddie Kramer himself.

  Running PSP Datamix A567 in 30-day trial mode or activating it requires an iLok user ID, which can be created for free at www.ilok.com, and the free iLok License Manager application, but no hardware dongle. The license can be activated in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above), and licenses can be moved at any time using PACE's iLok License Manager software.
specs: |-
  - Three bands of equalization: Low (peaking on boost, peaking or shelving on cut depending on the frequency), Mid (peaking boost and notch type cut), and High (peaking boost, shelving on cut).
  - FAT double sampling: In PSP Datamix A567, FAT is automatically switched on for low (below 50 kHz) sample rates, and off for higher sample rates. This ensures accurate processing independent of the sample rate.
  - 64-bit double precision floating point math for ultra-low cumulative errors in the filters and proper filter characteristics across entire frequency spectrum.
  - Preamp section modeling on input.
  - Output section with transformer emulation.
  - Variation of sound character via selecting the tuning of a specific channel, an average setting, or an "ideal" setting corresponding to the precise frequencies on the control labels.
  - Adjustable left/right channel tuning spread.
  - Alt Q mode allows for a gentler effect by fixing Q for each band regardless of selected frequency.
  - Sharp mode adds pronounced resonance in the High band.
  - All actual parameter values, like gain and frequency, may differ from displayed values. This is a typical characteristic of analog equalizers.
  - Over 100 presets designed by pro users from around the world, including a few by Eddie Kramer.
  - Windows: Windows 7 - Windows 11, 64-bit VST / VST3 / AAX (Pro Tools) host application.
  - macOS Intel or macOS Silicon: macOS 10.14 Mojave - macOS 15 Sequoia, 64-bit AudioUnit / VST / VST3 / AAX (Pro Tools) host application.
  - Requires a free iLok user ID and the iLok License Manager application, no hardware dongle required.
  - License can be activated in 3 separate locations.
