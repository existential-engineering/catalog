description: Alborosie Dub Station is a multi-effect plugin that carefully
  recreates the original filter, echos, and spring reverb pre-owned, modified,
  and used by the legendary osbourne ruddock "king tubby" producer, studio
  engineer, and pioneer of dub reggae from the golden era of the 70s from
  alborosie's personal vintage gear collection.
details: |-
  Dub Filter is a filter plugin modeled after King Tubby's iconic Big Knob, a passive high-pass filter with eleven frequency steps from 70Hz to 7.5KHz. This filter defined the sound of the entire roots era of Jamaican music.

  On top of the main stepped Frequency knob and the Impedance (resonance), the filter also offers control over its behavior including Magnetism, Character, Dynamics, and Artefacts controls. Two modulation sources, LFO and Envelope Follower, enhance the creative possibilities of the plugin, from rhythmic pulsations to organic filter movements.

  Dub Filter is based on the Altec 9069B High Pass Filter as used by King Tubby (and many others) at King Tubbys Studio in Waterhouse, Jamaica, known infamously as King Tubby's Big Knob. Altec launched the 9069B filter in the 60s. It was a passive inductor-based T-network filter that provided 18 dB/oct attenuation with 10 positions.

  Three controls allow the filter behaviour to be modified in depth. Magnetism controls the non-linear model of the inductance being used in the circuit emulation, affecting the slope and intensity of the generated harmonic content. Character controls the non-linear behavior of the filter and the amount of harmonic content generated. Dynamics controls how smooth the frequency change made by the non-linear physical model of the inductance is, and with extreme settings the model might sound like an envelope filter.

  Dub Filter is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP), and on the App Store for iOS and iPadOS (AUv3 and Standalone).
specs: |-
  - Stepped High Pass Filter
  - Eleven frequency steps from 70Hz to 7.5KHz
  - LFO modulation with multiple waves
  - Envelope Follower modulation
  - Non-linearities and Inductance controls
  - Resizable Window
  - Preset system with randomizer
  - Brightness and Contrast Controls
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP 64-bit)
