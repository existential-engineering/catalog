description: Crush. Slam. Obliterate. Audio processing plugin designed for aggressive compression and distortion featuring a CRUSH circuit for dynamic control, FLATTEN mode for transient management, and DIRT circuit for harmonic saturation.
details: |-
  The CRUSH circuit thickens your sound from the ground up. It infuses your tracks with raw weight and aggression while preserving the massive low-end core. Every hit that should slam, slams - now with the teeth to back it up.

  Stop fighting thin, weak recordings. CR-1 crushes the erratic peaks that eat up your headroom, replacing them with thick, consistent weight. You get more impact, more grit, and a more aggressive footprint without the headache of complex parallel chains.

  Dial in subtle warmth or crank it for chaos. The distortion circuit adds character that transforms flat, lifeless sounds into bold statements that refuse to sit in the background.

  CR-1 is built for speed. No complex chains. Dial it in. Move on. Your mix gets the aggression it needs and you get back to creating.
