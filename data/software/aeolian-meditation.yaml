details: >-
  Aeolian meditation is a complex addictive-additive synthesizer playground with
  a unique a-symmetrical design capable of generating unique and beautiful
  melodies, meditative and hypnotic drone tones, movie and musical soundscapes.


  At the core are two signal chains harmonic overtones and noise colors. The
  harmonics section consists of the first twelve harmonics at the set frequency.
  These twelve sine partials are each amplitude modulated at different speeds
  and depth providing for an ever changing and ever evolving tone.


  Aeolian meditation features intricate and powerful modulation capabilities
  where everything is modulated by dedicated controls, evolving in free rate or
  in sync with the project tempo. Volumes, frequencies, filters, effects sound
  emerges and flows in magical directions.


  The fm especially allows for out-of-this-world sounds. Not only can you toggle
  the fm source from MIDI to a set note to a frequency knob, the fm also
  utilizes dedicated modulators that tweak the source frequency and fm depth.


  Aeolian meditation features a dedicated android application that lets you
  control the synthesizer using your phone or tablet with full bi-directional
  control capability. Every parameter on the device is represented on the app,
  as well as enhanced functionality such as xy pads and randomizers.
