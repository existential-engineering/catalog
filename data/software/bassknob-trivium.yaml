details: |-
  Paolo gregoletto prefers a bright bass tone that lets string noise and snarl
  poke through the wall of guitars while still delivering an uncompromisingly
  solid low-frequency foundation. The trivium bassknob has been designed to
  deliver just that. Use a bass with bright, clean bass strings and clear
  pickups, run it through the trivium bassknob plugin, and you'll find yourself
  nailing paolo's signature tone in seconds.

  Is the amp too clean for you? Kick it into overdrive with the drive button.
  When inspiration strikes, every second counts before that golden riff is gone
  forever. With ampknob, you can capture your ideas quickly and easily without
  even starting a DAW. The standalone version of ampknob includes a built-in
  recording functionality that makes it effortless to always stay creative.

  The standalone version of ampknob now comes with a built-in metronome for you
  to stay sharp at your guitar playing skills. Change meter, accent, or set
  automatic speed increments so you can focus on practicing without even taking
  your hands off the guitar. The excellent built-in tuner means you're always
  ready to jam.

  The perfect speaker cabinet, microphones, and recording chain have been
  expertly chosen and dialed in by producer jens bogren to capture the tone with
  outstanding detail. If you feel like experimenting, you can disable the cab or
  even load your favorite impulse response right from the plugin.
specs: |-
  - Drive button
  - Built-in recording functionality
  - Built-in metronome
  - Built-in tuner
  - Impulse response loading
  - Cabinet disable option
