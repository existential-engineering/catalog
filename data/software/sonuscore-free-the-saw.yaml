description: Get ready to carve out some bone-chilling melodies with THE SAW –
  Cinematic Textures that will leave your audience on the edge of their seats.
  This complimentary instrument uses a delicate, horse-haired violin bow applied
  to metal in various techniques to produce eerie, unsettling tones ideal for
  horror and cinematic compositions.
details: |-
  THE SAW is a free Kontakt instrument built from a bowed musical saw, offered by Sonuscore as a thank-you gift to its customers. It is aimed at shrill, bone-tingling and unsettling material, the kind of sound that adds an ominous, horror-inspired edge to a cue or a piece of sound design.

  The recordings capture a wide range of variations, with the jagged edges of the blade attacked by a horse-haired violin bow in many different ways. A real saw offers almost no pitch control, so the instrument adds a tight pitch control system that lets it be tuned exactly, and MIDI control so it follows the notes assigned to it. Separate speed and tone controls give further shaping over how the blade behaves, from a slow mournful melody to a frenzied attack.

  On-board distortion and reverb effects push the raw moans and groans of the metal into more extreme territory, so the same source can read as a delicate, haunting texture or as something far more electric and aggressive.

  The library runs in the free KONTAKT Player from version 6.7.1 upward and needs roughly 1.24 GB of disc space, so no paid sampler is required.
specs: |-
  - Sampled bowed musical saw, recorded with a horse-haired violin bow across many playing variations
  - Tight pitch control system for tuning the instrument to an exact pitch
  - MIDI control so the instrument follows the notes assigned to it
  - Separate speed and tone controls
  - On-board distortion and reverb effects
  - Works with the FREE KONTAKT PLAYER
  - Requires KONTAKT Version 6.7.1 or higher
  - Intel Core 2 Duo processor recommended
  - Mac OS 11 or higher
  - Windows 10 or higher
  - 4 GB RAM
  - At least 1.24 GB of free hard disc space
