details: |-
  Amplitube leslie is the result of the exclusive collaboration between the ik multimedia team and hammond usa and suzuki music corp. Of japan with the aim of perfectly recreating, for the first time ever, the truly authentic sound of the legendary leslie amps and cabinets in the digital world.

  Thanks to the powerful combination of ik's breakthrough dynamic interaction modeling and volumetric response modeling technologies, which can reproduce the subtlest interactions of an electronic circuit down to its tiniest component and recreate the real acoustic behavior of rotary-speaker cabinets, the ik and hammond teams succeeded where all the others had to inevitably compromise.

  Perfect digital recreation of the legendary leslie amps and cabinets approved and certified by hammond usa and suzuki music corp. Of japan. Original circuit and component-level modeling of the amps via ik's acclaimed dynamic interaction modeling technology. Rotary-speaker cabinets modeled using ik's proprietary volumetric response modeling technology.

  Painstakingly recreates the saturation and harmonic distortion of overdriven tubes and circuitry. All cabinets work in stereo for both horns and drum. Full parametric eq for overall sound shaping. Intuitive controls for easily customizable sound. Mixer section for versatile microphone signal blending and tonal control.

  Ideal for keyboard players, record producers, guitarists and even vocalists. Perfect for any kind of production ranging from jazz to rock and contemporary pop. Can be used alongside an ever-growing collection of models and processors from the amplitube family, for limitless sonic options.
specs: |-
  - VST plugin

  - Audio units plugin

  - VST 3 plugin

  - AAX plugin

  - Dynamic interaction modeling

  - Volumetric response modeling

  - 11 iconic leslie officially certified models

  - 5 amps (leslie 147, 122 vintage; leslie 122a - tube; leslie 3300w hybrid; leslie g-37/studio 12 hybrid)

  - 6 rotary-speaker cabinets (leslie 147, 122, 122a; leslie 3300w, leslie g-37, leslie studio 12)

  - 90 and 180 mic placement

  - Variable distance setup

  - Different amp/cab combinations

  - Full parametric eq

  - Mixer section for microphone signal blending

  - Stereo cabinets for horns and drum

  - Windows 64-bit support (VST 2, VST 3, AAX)

  - Mac 64-bit support (audio units, VST 2, VST 3, AAX)

  - Universal 2 binary
