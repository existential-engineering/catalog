description: Accurate headphone mixing with ray-tracing room simulation. Corrects 100+ models + AutoEQ import. Mix anywhere with studio precision.
details: |-
  VHS MK2, the Virtual Headphone System, addresses the problem that every pair of headphones has a sonic fingerprint: a unique frequency response that colours what the engineer hears, so a mix made on headphones often fails to translate to speakers, cars or earbuds.

  The plugin combines precise headphone correction with ray-tracing room simulation, physics-based algorithms that recreate how sound behaves in a treated studio rather than applying a generic flat curve. Thousands of sound rays bounce through the virtual studio, simulating how material interacts with sound, how walls reflect and how the ears hear the combined result, so the model is dynamic rather than a static impulse response.

  The headphone correction module analyses the headphone model and applies an inverse EQ curve, neutralising the frequency response to match the Harman Over Ear 2018 target, the result of thousands of listening tests. Over 100 professionally measured headphone profiles are included, and AutoEQ import gives access to thousands of community-measured profiles for any headphone model.

  A dual simulation mode switches between pure headphone correction and full room simulation in one click, so a mix can be checked against different virtual monitors and speaker configurations. Virtual speakers and the listening position are positioned by the user, and the algorithm calculates reflections, room modes, natural cross-feed and stereo imaging.

  An advanced preset system saves and loads complete room and headphone configurations, with a default that loads automatically and presets that can be shared with other VHS MK2 users.
specs: |-
  - Headphone correction against the Harman Over Ear 2018 target
  - 100+ professionally measured headphone profiles included
  - AutoEQ profile import for any headphone model
  - Ray-tracing room simulation with Advanced (physics-based) and Simple (optimized) modes
  - Dual simulation mode: headphone correction or full room simulation
  - User-positioned virtual speakers and listening position
  - Advanced preset system with a default preset and shareable configurations
  - Plugin formats: VST3, AU, AAX (64-bit)
  - macOS 10.13+ (Intel and Apple Silicon native)
  - Windows 10/11 (64-bit)
  - Tested in Logic, Ableton, Pro Tools, FL Studio, Cubase, Reaper, Studio One and Bitwig
  - CPU: dual-core 2.0 GHz or faster, RAM: 4 GB minimum, OpenGL 2.0 compatible graphics
  - No copy protection, only a watermark carrying the buyer's email
