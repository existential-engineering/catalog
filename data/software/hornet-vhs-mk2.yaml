description: Accurate headphone mixing with ray-tracing room simulation. Corrects 100+ models + AutoEQ import. Mix anywhere with studio precision.
details: |-
  VHS MK2 (Virtual Headphone System) addresses the problem of mixes made on headphones failing to translate to other playback systems. Every pair of headphones has its own frequency-response fingerprint that colours what the engineer hears, so a mix that sounds correct in headphones can arrive muddy, harsh or wrongly imaged on monitors, in a car or on earbuds.

  The plugin combines precise headphone correction with ray-tracing room simulation. The headphone correction module analyses the selected headphone model and applies an inverse EQ curve that neutralises its response toward the Harman Over Ear 2018 target curve, which HoRNet describes as the industry standard for natural, balanced headphone listening rather than an arbitrary flat curve.

  The room simulation is physics-based rather than a static impulse response. Thousands of sound rays are calculated in real time as they bounce through a virtual studio, accounting for how materials interact with sound, how walls reflect and how both ears hear the combined result. Virtual speakers and the listening position can be placed by the user, producing natural cross-feed, accurate stereo balance and the impression of sitting two to three metres from a pair of monitors.

  Over 100 professionally measured headphone profiles are included, and AutoEQ import gives access to community-measured profiles for models that are not in the database. A dual simulation mode switches between pure headphone correction and full room simulation in one click, so a mix can be checked against different speaker configurations, and an advanced preset system stores complete room and headphone configurations, including a default that loads automatically.

  The plugin ships in VST3, AU and AAX formats for macOS 10.13 or later (Intel and Apple Silicon native) and Windows 10 or 11, both 64-bit, and has been tested in Logic, Ableton, Pro Tools, FL Studio, Cubase, Reaper, Studio One and Bitwig. There is no copy protection: licensing is a watermark carrying the user's email address, and updates and new headphone profiles are free.
specs: |-
  - Headphone correction module applying an inverse EQ curve toward the Harman Over Ear 2018 target
  - Ray-tracing room simulation calculating reflections, room modes and stereo imaging in real time
  - 100+ professionally measured headphone profiles included
  - AutoEQ profile import for headphones outside the included database
  - Dual simulation mode switching between headphone correction only and full room simulation
  - User-positionable virtual speakers and listening position
  - Advanced preset system saving complete room and headphone configurations, with an auto-loading default
  - Two ray tracing modes: Advanced (physics-based) and Simple (optimized)
  - macOS 10.13+ (Intel and Apple Silicon native), Windows 10/11 (64-bit)
  - CPU: dual-core 2.0 GHz or faster
  - RAM: 4 GB minimum
  - Graphics: OpenGL 2.0 compatible
  - Licensing: watermark with user email, no authorization required
  - Free updates and free profile additions
