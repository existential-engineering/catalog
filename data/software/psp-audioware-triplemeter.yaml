description: PSP TripleMeter is the successor to the PSP 2Meters bundle. It offers three different meters - VU meters, RMS meters, and PPM meters - each with discrete features such as calibration and shared features such as trim faders, filters and a label strip.
details: |-
  PSP TripleMeter offers three different meters - VU meters, RMS meters, and PPM meters - each with discrete features such as calibration and shared features such as trim faders, filters and a label strip. It provides a choice between different audio measurement tools while processing audio, for accurate signal measurement: with a single click, the volume units (VU) measurement of any signal can be checked and compared to the peak indications or RMS values.

  Running PSP TripleMeter in 30-day trial mode or activating it requires a free iLok user ID and the free iLok License Manager application. No hardware dongle is needed.

  The license activates in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above), and the locations can be changed at any time using PACE's iLok License Manager.
specs: |-
  - Three meter types in one plugin: VU meters, RMS meters and PPM meters
  - Calibration options discrete to each meter type
  - Shared trim faders, filters and a label strip across meters
  - Single-click comparison of VU measurements against peak indications or RMS values
  - Windows 7 to Windows 11, 64-bit VST, VST3 and AAX (Pro Tools) hosts
  - macOS 10.14 Mojave to macOS 15 Sequoia, Intel and Apple Silicon, 64-bit AudioUnit, VST, VST3 and AAX (Pro Tools) hosts
  - Requires a free iLok user ID and the iLok License Manager application, no hardware dongle needed
  - License can be activated in 3 separate locations (computer or iLok dongle 2nd generation or above)
  - 30-day trial available for macOS and Windows
