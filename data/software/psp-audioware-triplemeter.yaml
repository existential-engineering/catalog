description: "PSP TripleMeter is a multi-function audio metering plugin offering three distinct measurement tools in one: VU meters, RMS meters, and PPM meters. Each meter type features individual calibration options along with trim faders, filters, and label strip functionality for accurate signal measurement."
details: |-
  Provides three selectable meter types (VU, RMS, PPM) accessible via a single click. Includes trim faders, filters, and label strip functionality with individual calibration options. Requires iLok License Manager (free) and an iLok user ID; licenses can be activated in up to 3 locations. A 30-day free trial is available.
