description: Spaced Out is a hybrid reverb, delay, echo and modulation effects
  plugin for creative ambience effects. Send your sounds into orbit with an
  inspiring workflow that brings together up to 50 individual effects in a
  simple package.
details: |-
  Combining reverb, delay and modulation can result in effects that are greater than the sum of the parts. Spaced Out is designed for this process with an intuitive workflow and a huge sound.

  Spaced Out unites delay, reverb and modulation into a singular wet-FX powerhouse with a rich and contemporary sound. The plugin hosts more than 50 effect parameters under the hood, controlled via a simple interface with no submenus.

  The Echoes section features a 16-step delay sequencer synced to your DAW's tempo with modes including Straight, 2x, Dotted, and Triplet. The Space section provides X-Y based joystick control for intuitively morphing between reverb length and modulation behavior.

  Spaced Out ships with 125 presets crafted by industry professionals. A Generate randomizer creates musically calibrated FX chains for creative exploration.
specs: |-
  - 16-step delay sequencer with BPM sync
  - X-Y joystick controls for reverb/modulation morphing
  - Central mixer with X-Y joystick for Echoes/Space and Wet/Dry blending
  - Generate randomizer for musically calibrated FX chains
  - Lift-Off compression/EQ processing
  - Ducker with BPM sync
  - 125 presets by industry professionals
  - Native Apple Silicon M-Chip support
  - 64-bit only
releaseDate: "2020"
