details: |-
  Amplitube brian may is a special guitar, one-of-a-kind gear, unmistakable sound. Brian may's guitar tone has powered some of the biggest rock anthems the world has ever heard. His intricately-layered harmonized leads, muscular rhythm guitar, and sweet clean tones blazed a path for rock guitarists, proving that rock music can have both brains and brawn.

  Available in a convenient desktop app and plug-in for your DAW, amplitube brian may carefully replicates his rig, including 2 amps, 3 cabinets, and 5 stompbox effects, all modeled with the supervision of may himself.

  We used our latest dynamic interaction modeling to deliver the highest level of ultra-realistic sound when modeling brian's gear. The product of 20 years' experience modeling analog gear, dim models the behavior of every component in the circuit all the way down to its smallest nuance and character.

  Applied to brian may's rig, the result is the same sound and feel you'd get from the real gear as he used in the recording studio and live in concert.

  2 amplifiers: bm 30 based on the classic triple vox ac30 setup, this model offers 3 amps with the effects chain in a wet-dry-wet configuration to match brian may's iconic setup. Bm dk originally created by john deacon, after modifying an old radio. This small amp soon became the trademark sound of many queen songs. 3 cabinets: 2x12 bm 30 blue triple cabinet based on the cab section of vox ac30 equipped with celestion alnico blue speakers. 2x12 bm 30 h70 triple cabinet based on the cab section of vox ac30 equipped with celestion g12h anniversary speakers. 1x6 bm dk cabinet section of the bm dk amp, featuring a 6" speaker, modeled after the mysterious "deacy" amp. 5 stompboxes: red special created by a detailed study of brian may's famous guitar, this helps add the unique tonality and controls of the red special itself. Treble booster based on the original kat treble booster, this stompbox effect will enrich your guitar tone similar to brian may's by boosting it before it reaches the amp. May wah based on a rackmount dunlop cry baby wah, modeled in the exact configurations brian uses to shape his tone. Fox phaser based on foxx foot phaser, a pedal-controlled phaser with a unique and distinctive sound. Star gate this noise gate helps clean up the signal chain, minimizing the noise feeding brian's unique amp and pedal setup.
