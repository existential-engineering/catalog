description: Get four analog-modeled compressors that can bring their distinct
  sonic attributes to your projects.
details: |-
  The Studio Compressors Collection is a Synergy Core Effects Bundle from Antelope Audio. It pairs four analog-modeled compressor plugins designed to infuse mixes with the character of compressors that have shaped the sound of music from the past century, helping users find a signature sound through vintage tone and creative experimentation.

  The bundle includes NEU-473A, a VCA compressor modeled after a vintage German compressor from the 70s known for shaping the midrange of many iconic records and useful for subtle tone-shaping or hard limiting. DIODE 609 is a diode-bridge compressor modeled after a versatile 80s unit prized for its creamy-thick, smooth sound that can remain musical while compressing or limiting heavily. COMP-4K-BUS is a stereo bus compressor modeled after the famous mix-glue bus compressor of the 80s, used to bring instruments and performances from many channels into a cohesive whole. COMP-4K-STRIP is a VCA compressor/expander with HPF and LPF modeled after the channel strip of an iconic British 4K studio mixing desk, delivering cleaner, musical, professional results.

  The plugins run natively in a DAW on macOS or Windows, and can also process audio in real time on a compatible Antelope Audio Synergy Core interface. The bundle is also available as part of the Antelope Cosmos subscription, which unlocks 75+ Antelope native plugins.
