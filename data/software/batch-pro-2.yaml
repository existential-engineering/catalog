details: |-
  Batch Pro 2 is a standalone software developed for processing a large amount
  of files in a few clicks. It allows changing the file format, sampling rate,
  bit depth, pan, pitch, filtering, volume and processing the files through up
  to 8 VST/AU plugins.

  Process a large amount of files in one click. (wav, aiff, mp3). Edit sampling
  rate, bit depth, pan, pitch, volume, file format and hpf/lpf.

  Process files through up to 8 VST/AU plugins. Real-time processing &
  recording. Dry/wet audio preview. Presets manager.

  Batch pro 2 can save you a lot of time when you need to edit a large amount of
  files.
specs: |-
  - VST plugin support
  - Audio Units plugin support
  - VST 3 plugin support
  - Up to 8 VST/AU plugins processing
  - File format conversion (wav, aiff, mp3)
  - Sampling rate editing
  - Bit depth editing
  - Pan control
  - Pitch adjustment
  - Volume control
  - HPF/LPF filtering
  - Real-time processing
  - Real-time recording
  - Dry/wet audio preview
  - Presets manager
  - macOS support
  - Windows support
  - Intel machine os x 10.11.6 or later
  - Apple m1 processor os 11 or later
  - Minimum 4gb RAM
  - Universal 2 binary
