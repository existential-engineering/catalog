details: |-
  Atk Sd1 is an emulation of the boss sd1 overdrive. It is built on top of the
  audio toolkit library, and implements the overdrive (oversampling x8) and the
  tone sections of the original pedal.

  Contrary to usual distortions, the sd1 features an asymmetric overdrive
  section that adds even harmonics to the sound.
specs: |-
  - Oversampling x8
  - Asymmetric overdrive section
  - Tone section
  - macOS support
  - Windows support
  - Universal 2 binary
