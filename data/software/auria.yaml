description: "Auria is a 48-track digital audio recording system for ipad.
  Features: 48 tracks of simultaneous playback of stereo or mono files."
details: |-
  Features 48 tracks of simultaneous playback of stereo or mono files (24 tracks
  on ipad 1). Up to 24 tracks of simultaneous recording when used with
  compatible USB audio interfaces (camera connection kit required). Supports
  sample rates of 44.1khz, 48khz and 96khz (ipad 1 supports only 44.1khz and
  48khz).

  Vintage-inspired channelstrip on every channel by pspaudioware includes
  expander, multiband eq and compressor. Masterstrip on all subgroup and master
  channels featuring pspaudioware busspressor, eq and mastering limiter. 64-bit
  double-precision floating point mixing engine.

  MIDI sync support with mtc chase, MIDI clock and mmc. MIDI remote control
  (mackie mcu and hui protocol). Third party effect plugin support available via
  in-app purchase (only ios-version plugins are supported). Aaf import and
  export allows transferring complete sessions between popular daws like logic,
  pro tools, nuendo, samplitude and more.

  Convolution reverb plugin with included ir library. Classicverb reverb plugin
  included. Stereodelay and stereochorus plugins included. 8 assignable
  subgroups and 2 aux sends. Time stretching using dirac 3 pro technology.
  Real-time audio scrubbing. Tempo sync and side chain support for plug-ins.
specs: |-
  - 48-track digital audio recording system

  - 48 tracks of simultaneous playback of stereo or mono files

  - 24 tracks of simultaneous recording with compatible USB audio interfaces

  - Sample rates: 44.1khz, 48khz, 96khz

  - Vintage-inspired channelstrip by pspaudioware with expander, multiband eq
  and compressor

  - Masterstrip with pspaudioware busspressor, eq and mastering limiter

  - 64-bit double-precision floating point mixing engine

  - MIDI sync support with mtc chase, MIDI clock and mmc

  - MIDI remote control (mackie mcu and hui protocol)

  - Third party effect plugin support via in-app purchase

  - Aaf import and export

  - Convolution reverb plugin with ir library

  - Classicverb reverb plugin

  - Stereodelay and stereochorus plugins

  - 8 assignable subgroups and 2 aux sends

  - Time stretching using dirac 3 pro technology

  - Real-time audio scrubbing

  - Tempo sync and side chain support for plug-ins

  - Touch-based waveform editor with cut/copy/paste, crossfade, duplicate,
  separate, gain, normalize, dc offset, reverse

  - Flexible snapping tools for events, cursor, bars, beats and smpte frames

  - Dropbox, soundcloud and audio copy/paste support

  - Track freeze for cpu optimization

  - Full automation support with graphical editing

  - True 100mm faders in portrait mode

  - Optional video import with sample accurate sync

  - Video export capability

  - Timeline ruler options: minutes:seconds, bars:beats, samples and smpte time

  - Auto-punch mode

  - Wist support for wireless syncing

  - Aurialink for dual ipad sync with 96 tracks playback and 48 tracks recording

  - Full delay compensation on all tracks, subgroups, and aux sends

  - Adjustable metering modes (pre/post fader, rms and peak)

  - Adjustable pan laws

  - Sample accurate loop function

  - Automatic sample rate conversion

  - Built-in metronome
