description: Megaverb is an 80s digital reverb emulation plugin capturing iconic gated reverb, infinite blooms, and synthesizer textures from that era, with modern precision engineering and fully automatable parameters.
details: |-
  Megaverb is Goodhertz's recreation of the iconic digital reverb sounds of the 1980s. It captures the distinctive character of that era's hardware reverb units, delivering gated snare sounds, infinite reverb blooms, and lush synthesizer textures with the precision of modern software engineering.

  The plugin features a Gate+ section for fine-tuning detection mode and creating ducked reverb effects — the inverted-gate sound that defined much of the decade's production aesthetic. A WetGain slider enables reverb throw automation, making it easy to automate reverb sends directly within the plugin.

  VerbDecay extends the reverb tail to infinity, enabling sustained, evolving textures that are impossible on ordinary reverb units. Real-time filter sweeping adds further tonal movement to the wet signal, opening up creative modulation possibilities.

  A Lofi section with Analog and Digital sliders introduces period-appropriate degradation, from the warmth of analog circuitry to the aliasing artifacts of early digital converters. All parameters support smooth automation without clicks, pops, or zipper noise.
specs: |-
  - Channel configurations: Mono->Mono, Mono->Stereo, Stereo->Stereo
  - 64-bit hosts only
  - Gated reverb with Gate+ detection mode controls
  - Ducked reverb (inverted gate) mode
  - WetGain slider for reverb throw automation
  - VerbDecay control for infinite reverb tails
  - Real-time filter sweeping on wet signal
  - Lofi section: Analog and Digital sliders
  - All parameters fully automatable
  - macOS 10.13+ (AU, VST, VST3, AAX 64-bit)
  - Windows 10+ (VST, VST3, AAX 64-bit)
