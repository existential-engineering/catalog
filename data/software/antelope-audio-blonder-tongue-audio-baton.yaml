details: |-
  Enter the Antelope time machine for a trip back to 1959 with a faithful emulation of the Blonder-Tongue Laboratories Audio Baton, an all-tube graphic equalizer so rare and special it has an actual album named after it. The original hardware boasted seven separate amplifiers tuned to distinct frequencies, followed by high- and low-pass filters running in parallel, with their outputs routed to separate level controls.

  The frequency choices on the Audio Baton correspond to actual notes and octaves on the piano keyboard, hence its presence above the red-and-white vertical stripes that move up and down with the turning of the rotary controls, visualizing boosts and cuts. A frequency response curve is graphically overlaid on top of the colorful stripes, with each frequency region distinctly colored.

  Despite its technical proficiency, the Audio Baton was an inexpensive unit that found its way into audiophile homes and recording studios alike. Reviewing it in February 1959, AUDIO magazine qualified it as 'indispensable to anyone interested in dubbing from old records' and 'strongly recommended to anyone who does much recording,' noting that 'rolloff of either lows or highs due to poor microphones or narrow-range amplifiers or recorders can be corrected easily, and response peaks can be smoothed out as desired.'

  In terms of audio character, the Audio Baton compares favorably to other great equalizers of the era — think a cross between the rare Altec 9073A 'Motown' graphic equalizer and the famed Pultec tube-amplified make-up gain stage.

  Antelope Audio's team of DSP and electrical engineers recreated the Blonder-Tongue Audio Baton EQ in its entirety, exclusively for the Synergy Core FX processing platform. The one change added is purely cosmetic — a Magic Eye peak meter on the upper right, which enhances the unique equalizer's late 50's aesthetic and provides useful visual feedback.
specs: |-
  - Exact emulation of the vintage all-tube original
  - Works in real-time with zero latency, like using the original hardware
  - 9 frequency bands with 28dB control range per band
  - Highlights individual instruments' fundamental notes
  - Corrects frequency response errors such as excessive bass or shrill high-end
  - Increases clarity of instruments, vocals and speech
  - Runs natively in your DAW on macOS or Windows, or in real-time on a Synergy Core interface
