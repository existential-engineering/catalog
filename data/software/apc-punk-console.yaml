details: |-
  APC punk console is a virtual re-creation of a popular diy circuit - the atari
  punk console. Apc is a square wave synthesizer that creates fun "lo-fi" sound
  and comes with user mod.

  Key features: comes with modifications of the original circuit,
  zero-delay-feedback resonant high-pass and low-pass filters, an lfo, a gate
  controller with a hold function. Playability! Use the key tracking mod to play
  different tones using your MIDI keyboard or sequencer, change the tone by +/-
  1 octave with the tone push buttons. Easy assignation of all parameters to
  MIDI controllers. Click on "learn" on the parameter, move the control on your
  MIDI controller, and that's it.

  Feature highlights: square waves "lo-fi" sound. 8 user mod available: pitch up
  & down. High-pass resonant filters. Low-pass resonant filters. Lfo (can be
  sync on bpm). Key tracking. Zero-delay-feedback state variable filters. Gate
  mod with hold function. Preset manager, rename, copy, save, load. Full MIDI
  automation support. Easy MIDI learn on all parameters. Use 7-bit MIDI
  continuous controller or high resolution 14-bit MIDI nrpn and rpn. Undo your
  changes with one click. Comes with users manual. Easy installer.

  Installation requirements for windows: 2 ghz or higher with sse2. 4gb ram or
  higher. Microsoft windows 11, 10 or 8. VST 2 or VST 3 compatible host. Audio
  interface with asio driver support recommended and minimum 44khz samples
  rates. To use the automation a host with automation features. For MIDI learn a
  MIDI interface and an external MIDI control device is required.

  Installation requirements for macos: intel cpu. 4gb ram or higher. Macos 10.8
  and latter. Audio unit compatible 64-bit host. Coreaudio compliant audio
  interface or builtin audio hardware. To use the automation a host with
  automation features. For MIDI learn a MIDI interface and an external MIDI
  control device is required.
specs: |-
