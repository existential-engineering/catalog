details: |-
  The NEU-W495 is based on the inimitable circuitry design of the original, carrying its signature German sound.

  As a favorite mastering tool of generations of record producers and sound engineers, the unit features a 3-band EQ with bypass available for the entire unit.

  Versatile and simple to use, the NEU-W495 runs natively in your DAW on macOS or Windows, or in real-time on your Antelope Synergy Core interface.
specs: |-
  - 3-Band EQ plugin
  - Emulation of a classic German mastering EQ
  - Bypass switch for the entire unit
  - Runs natively in your DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core interfaces
