details: >-
  Ableton drum racks for superior drummer 3 made of metal ezx features separate
  ableton drum racks for all factory presets for the toontrack ezdrummer made of
  metal ezx expansion library. These racks are the most complete integration
  between ableton live and toontrack superior drummer 3 including a host of
  features ready to use on ableton push.


  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all made of metal kit factory presets in superior
  drummer 3 from ableton push controller device browser.


  12 ableton drum racks to instantly load the factory library "mix ready"
  presets with ableton mappings. 6 ableton live templates designed to host the
  multi channel output routing presets with track level audio routing. Colour
  coded pad design for visual performance and finger drumming.


  Singleout presets featuring 6 ableton drum racks for all factory presets
  single audio output to single ableton track. Multiout presets featuring 6
  ableton drum racks for all presets in multiple audio channel output from the
  plug in to multiple ableton audio tracks using the multi output ableton
  template also provided designed for the kit presets.


  Use the template racks and extend to your own toontrack ezdrummer made of
  metal ezx presets, swapping out individual sounds or articulations. You are
  100% ready to go with the factory presets but there is no limitation to
  creating your own presets from these templates.
specs: |-
