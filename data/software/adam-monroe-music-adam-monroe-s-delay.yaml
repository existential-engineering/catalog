details: |-
  Adam monroe's delay includes traditional delay parameters like time and
  feedback, as well as high/low-pass filtering and synchronized ping-pong
  panning.

  The plugin is simple and intuitive, designed particularly well for shorter
  delays and short echo applications.

  This plugin does not have a tempo sync or tap tempo feature, maintaining an
  old school what-you-see/hear-is-what-you-get design philosophy.
