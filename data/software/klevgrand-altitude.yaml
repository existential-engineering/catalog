description: Altitude is a vocal performance station with pitch-correction,
  smart harmonies, midi-instrument playability and built-in modulation for
  creative sound design. Its pitch altering engine is powerful enough to easily
  measure up with classic industry standards in its finesse and precision, yet
  lightweight enough to make it perfect for live-use with no latency.
details: |-
  A vocal performance station for singers, producers, and live performers, Altitude takes real-time vocal processing to new heights, adding joy and creative exploration to your workflow. Pitch correction, smart three-voice harmonies, a MIDI-playable voice module, and deep modulation, all in real time with zero latency.

  Dial in the classic hard-tune sound, or polish a take so cleanly no one knows it was touched. Build lush harmonies that follow your key automatically, on stage or in the studio. Play your voice like an instrument from a MIDI keyboard, or use your DAW's MIDI editor to arrange harmonies and melodies. Add depth and movement with modulation, from subtle pitch drift to textures that don't exist anywhere else.

  The foundation of a pitch effect is a solid pitch-correction module. With Altitude you get high-quality pitch-correction with formant-aware processing that's quick and easy with no latency. Make your lead fatter with one of the two doubler modes and the widener, or make a hard-hitting shift in the formants for effect.

  Up to three smart harmony voices follow your lead in the right key, automatically avoiding unwanted dissonant intervals just like a human background singer. Each voice has its own vibrato, humanizer, and auto-formant correction. Doubler and widener blend them into any mix.

  The modulation module gives you three independent modulators with up to 8 target parameters per modulator, each at its own rate or in sync with the DAW. Pick a shape (sine, saw, square) or draw your own in the step-based editor with up to 16 steps. A dedicated zero-latency processing mode turns Altitude into a stage-ready solution.
specs: |-
  - High-quality pitch correction with formant-aware processing
  - Three-voice harmonizer with smart scale options for musically-aware voicings
  - Play module: make your voice playable via MIDI input
  - Low latency mode, well suited for live performance
  - Dual doubler modes plus stereo widener for each module
  - Three independent modulators, each controlling up to 8 target parameters
  - Flexible LFO shapes: sine, saw, square or custom step sequencer up to 16 steps, DAW-synced or free-running
  - Natural vibrato module with fade-in, rate and depth control
  - MIDI scale mode for live key changes or punch-in pitch correction
  - Micro tuning, multi-out support, detection range options
  - Large preset collection
  - Requires macOS 10.13 or later (ARM/Intel), Windows 10 (64-bit) or later, running an AU, VST, VST3 or AAX compatible 64-bit host
  - iPad: AUv3 and standalone
