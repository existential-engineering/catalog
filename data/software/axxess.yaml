  complex sounds, suited for Electronica, Synthpop, Drum and Bass, Ambient, and
  Rock.
details: |-
  Gforce AXXESS is a quick and easy way to get stunning results in your
  production and it is a master at bass. It has a fantastic giant sound and a
  super fun sequencer that will surprise you. Whilst you can keep things simple,
  don't let its looks deceive you. You can also go much deeper, thanks to our
  unique x-modifiers.

  Axxess retains the warm analogue sound and fundamental architecture at the
  heart of the original 1975 axxe, but builds on it in ways that extend its
  sonic and musical capabilities. This emulation of the famous synth is the
  sibling of our award-winning oddity3 and inherited its character.

  Axxess features an efficient preset browser, over 350 new presets, a
  sub-oscillator, an arpeggiator and a straightforward 16-step sequencer, biting
  distortion, analogue delay and luscious reverb effects, a vintage control to
  add authentic analogue imperfections, velocity to filter and vca for
  expressivity and a fully scalable ui designs.

  Using our unique x-modifier technology, users can reach new sonic heights with
  axxess. With an independent lfo and envelope for almost every parameter on the
  synth, axxess allows you to create hugely complex sounds. And, while the tone
  and character of the synth remain authentic to the original, the x-modifiers
  allow you to take this classic sound to unexplored realms of possibility.

  Axxess features our brand-new preset browser, which gives you the power to
  organise your sounds how you want. With extensive tagging, sorting and search
  possibilities, finding the presets you want is quick and easy. We've included
  more than 350 production-ready presets.
