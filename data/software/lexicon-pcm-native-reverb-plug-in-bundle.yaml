description: A collection of seven professional Lexicon reverb plug-ins
  delivering hardware-quality reverb with hundreds of studio presets for use in
  popular DAWs.
details: |-
  The PCM Native Reverb Plug-in Bundle brings the legendary sound of Lexicon hardware reverbs into the DAW with seven distinct algorithmic reverb plug-ins: Vintage Plate, Plate, Hall, Room, Random Hall, Concert Hall, and Chamber.

  Each plug-in includes hundreds of studio-ready presets and offers real-time graphical frequency display, visual EQ for early and late reflections, input/output meters, and full parameter automation. A DAW-independent preset format allows presets to move between sessions and hosts.

  The bundle supports AAX, VST, VST3, AU, and legacy RTAS formats on macOS and Windows. macOS builds are Apple Silicon native. Authorization is handled via iLok (local machine or USB key) and a single license enables two simultaneous activations.
specs: |-
  - Seven reverb algorithms: Vintage Plate, Plate, Hall, Room, Random Hall, Concert Hall, Chamber
  - Hundreds of studio presets per plug-in
  - Real-time graphical frequency display
  - Visual EQ for early and late reflections
  - Input and output metering
  - Full parameter automation
  - DAW-independent preset format
  - Apple Silicon native
  - iLok authorization (local or USB)
  - Two simultaneous activations per license
