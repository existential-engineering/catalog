details: >-
  Plini is one of the most innovative and refreshing electric guitarists of our
  generation. His distinct sound combines an unusually wide variety of styles:
  progressive, fusion, and metal, all with impressive fluency and elegance. As
  musicians, we found great inspiration in plini's immense imaginativeness and
  artistry. As engineers, we realized that if a similar mindset could be applied
  to creating a plugin that could cover all the ground such a versatile artist
  requires it to, the results could be spectacular.


  State of the art tube amplifier modeling and versatility are the backbone of
  this plugin. We wanted to try something different this time, so we worked with
  plini on designing his dream amplifiers, engineered from the ground up to
  perfectly cover the vast dynamic and tonal range his music requires. These
  amplifier designs were then obsessively modeled with extreme accuracy. The
  result is three refreshingly new amplifiers: a crystal-clear clean, a tight
  and articulate rhythm, and a powerful and defined lead.


  Having absolute control over signal dynamics is crucial for nuanced playing
  and bridging the saturation gaps between amplifiers. A virtual-analog model of
  a widely used bus compressor and booster/overdrive pedal are included to
  provide additional flexibility and adaptability to different styles and
  instruments. The compressor's threshold control is linked to the makeup gain
  so that the output volume stays constant throughout different settings.


  It is hard to overstate the importance of well-captured cabinets in a rig's
  overall tonal character. To offer maximum flexibility, we engineered a very
  comprehensive and adaptive cabinet simulation module: featuring six virtual
  microphones, which can be positioned around the speakers. We have also added
  new and exclusive speaker captures by ml sound lab. This module can also serve
  as a standard loader for your favorite impulse response files. These features
  can be used on both mono and stereo configurations; the latter allows for a
  second microphone to be added with full panning, microphone-level, and phase
  parameters in addition to position and distance, for ultimate control and
  endless sonic possibilities.


  The standalone feature in archetype: plini allows you to quickly install, plug
  and play this versatile plugin suite! Standalone is perfect for practice on
  the go and live use.
