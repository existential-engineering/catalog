  to new heights with the Oxford Inflator.
details: |-
  The Oxford Inflator adds perceived loudness and density without the pumping or peak-crushing of a limiter, using a proprietary harmonic processing algorithm rather than conventional compression. The Effect control sets the amount and the Curve control sets the harmonic character.

  It can be used on individual tracks, groups or the master bus, and is applied to vocals, drums and full mixes at any stage from mixing through to mastering.

  Sonnox has maintained cross-compatibility across platforms and DAWs for years, so Inflator settings carry over from session to session. The plugin is available in Native and AAX-DSP variants.
specs: |-
  - Effect control sets the amount of inflation; Curve control sets the harmonic character
  - Adds perceived loudness and density without the pumping or peak-crushing of a limiter
  - Proprietary harmonic enhancement processing rather than conventional compression or limiting
  - Usable on individual tracks, groups/buses or the master bus
  - Available in Native and AAX-DSP variants
  - Plugin formats: Audio Unit (AU), VST3, AAX-Native (Pro Tools 11 or later), AAX-DSP (Pro Tools Ultimate, Pro Tools HD, or Avid VENUE systems)
  - macOS 10.13 High Sierra or later
  - Windows 10 (64-bit) or later
  - Each Oxford plugin licence includes two simultaneous activations
  - Authorisation via a free iLok account: Local Machine, iLok2/iLok3 USB device, or iLok Cloud (iLok Cloud requires an active internet connection and only one activation may be assigned to it)
  - AAX-DSP instances per chip, Band Split Mono: 26 at 44.1/48 kHz, 12 at 88.2/96 kHz, 6 at 176.4/192 kHz
  - AAX-DSP instances per chip, Band Split Stereo: 13 at 44.1/48 kHz, 6 at 88.2/96 kHz, 3 at 176.4/192 kHz
  - AAX-DSP instances per chip, Direct Mono: 81 at 44.1/48 kHz, 39 at 88.2/96 kHz, 18 at 176.4/192 kHz
  - AAX-DSP instances per chip, Direct Stereo: 41 at 44.1/48 kHz, 20 at 88.2/96 kHz, 9 at 176.4/192 kHz
