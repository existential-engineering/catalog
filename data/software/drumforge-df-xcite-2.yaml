description: DF-XCITE 2 is a saturation and harmonic enhancement plugin with six saturation models, switchable four-band multiband or singleband processing, instrument-specific crossover presets, Legacy and Modern crossover systems, a Lo-Fi filter, and a visual analyzer with draggable crossovers.
details: |-
  DF-XCITE 2 goes beyond the original with six saturation engines, each with its own harmonic character: American is balanced and tight with controlled enhancement, Vintage is smooth and warm, Extreme is aggressive and dirty, Tape gives rounded analog compression with natural warmth, Tube is harmonically rich and musical, and Amp is gritty and forward for cutting through dense mixes. Each type can be applied per frequency band.

  Two processing workflows are available. Multiband mode gives four bands with independent Drive, Mix, and saturation type per range for surgical tonal shaping, and Singleband mode applies full-range harmonic enhancement for quick saturation across the whole signal. Modes can be switched instantly.

  Instrument-specific modes optimize crossover points and frequency distribution for the source material, covering Metal Kick, Rock Kick, Metal Snare, Rock Snare, Toms, Overheads, Rooms, Drum Bus, Bass, Guitar, Vocals, and Master Bus. These modes were crafted by mixers including Joey Sturgis and Joel Wanasek so crossovers do not have to be set by hand.

  Two crossover systems are offered. Legacy mode recreates the smooth, forgiving wide crossover curves of the original DF-XCITE, and Modern mode uses sharper slopes for precise frequency separation and cleaner band interaction. An integrated visual analyzer shows the signal in real time with draggable crossover points and per-band volume sliders, and a single-button Lo-Fi filter is included.
specs: |-
  - 6 saturation models: American, Vintage, Extreme, Tape, Tube, Amp
  - Multiband mode with four bands, each with independent Drive, Mix, and saturation type
  - Singleband mode for full-range harmonic enhancement
  - Instrument-specific modes: Metal Kick, Rock Kick, Metal Snare, Rock Snare, Toms, Overheads, Rooms, Drum Bus, Bass, Guitar, Vocals, Master Bus
  - Legacy and Modern crossover systems
  - Lo-Fi processing on a single button
  - Visual analyzer with drag-and-adjust crossovers and real-time frequency feedback
  - Low CPU usage for running multiple instances
