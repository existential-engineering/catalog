description: A multiband harmonic exciter designed to add life, presence, and character to drum mixes through saturation processing. Features six saturation models (American, Vintage, Extreme, Tape, Tube, Amp), four-band frequency targeting, and instrument-specific presets crafted by chart-topping mixers.
details: |-
  DF-XCITE 2 is a multiband harmonic exciter built to add life, enhance presence, and shape character in drum mixes. It provides six saturation models — American, Vintage, Extreme, Tape, Tube, and Amp — each offering distinct harmonic coloration suited to different mixing scenarios.

  Users can toggle between multiband and singleband processing modes. The multiband approach enables four-band frequency targeting while singleband delivers full-range saturation across the entire signal.

  Instrument-specific presets include pre-tuned crossover layouts for Kick, Snare, Bass, Vocals, and Master Bus applications, crafted by chart-topping mixers including Joey Sturgis and Joel Wanasek.

  Two crossover approaches are available: Legacy Mode recreates smooth, wide crossover curves from the original DF-XCITE, while Modern Mode uses sharper slopes for precise frequency separation.

  Additional features include a real-time visual frequency analyzer with draggable crossover points, a single-button Lo-Fi filter, and low CPU usage supporting multiple instances.
