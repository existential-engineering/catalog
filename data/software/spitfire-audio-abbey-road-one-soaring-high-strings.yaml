details: |-
  Offering a harmonious and rich sound, Soaring High Strings is tailored for romantic, lyrical passages without sacrificing high speed runs. 16 1st Violins and 14 2nd Violins play in unison to create a passionate and lush sonic tapestry perfect for crafting a resonant composition. Add the unmistakable magic of Abbey Road Studio One to your music with 12 signals, expertly recorded by Grammy Award winning engineer Simon Rhodes. Featuring an expressive, slurring legato, ideal for adding emotion to your tracks, Soaring High Strings completes the Abbey Road One Film Scoring Selections.

  Available to purchase as a stand-alone sample library or as a brilliant addition to the Abbey Road One: Orchestral Foundations VST.

  Enter the room most composers can only dream of: Abbey Road's Studio One. Considered one of the finest acoustical spaces in the world, Studio One's history has an indelible connection with the scores recorded there, providing emotion, mood, and magic for many of the most renowned and successful films ever made. Such compositional classics as Star Wars, Lord of the Rings, Harry Potter, and Avengers: Endgame, all were recorded in Studio One. With its rich tonality, deep low end, and famed reverb, Studio One's sound is widescreen and epic. Truly, it is the iconic sound of cinema.

  Expanding on Abbey Road One: Orchestral Foundations, a 90-piece symphonic orchestra that was our first partnership with Abbey Road Studios, Soaring High Strings is a fully-fledged, stand-alone sample library. Recorded the same way your favourite composer would, the unmistakable acoustics of Abbey Road Studio One, exceptional players, award-winning sound engineers and priceless microphones, all allowing you to quickly and easily create film scores or to add professional orchestration to your music. Level up your existing symphonic orchestra toolkit or pair with Orchestral Foundations to get a soaring, romantic legato sound.
specs: |-
  - 16 1st Violins and 14 2nd Violins playing in unison
  - 12 signals (2 mixes / 10 mics)
  - Legato: multiple dynamics, molto vibrato, slurred notes and alt fast attacks for runs
  - Long: multiple dynamics
  - Short: 5 round robins, and multiple dynamics
  - Mix 1: a full room mix by Simon Rhodes, formed from the Tree and Outriggers with a curated blend of spots
  - Mix 2: a tighter full mix by Simon Rhodes, formed from the 2nd Tree and Outriggers with a curated blend of spots
  - Vintage 1: a pair of original 1940s RM1B ribbon microphones placed in front of the conductor
  - Vintage 2: a pair of classic 44BX ribbon microphones placed by the conductor
  - Close (Strings): all spot mics summed together for the instruments being played
  - Pop Close: a mix of spot mics panned centrally for a flexible image
  - Pop Room: a dedicated room pair located to represent the source centrally
  - Tree 1: a decca tree formed of Abbey Road's finest trio of classic valve omnidirectional microphones
  - Tree 2: a tighter, closer decca tree for faster, more detailed material
  - Outriggers 1: a pair of omni microphones for a wider image
  - Ambients: a pristine pair of small diaphragm omnidirectional microphones to the rear of the room
  - Spill: a summation of spot microphones from sections not being played
  - Recorded in Abbey Road Studio One by Grammy Award winning engineer Simon Rhodes
  - Uses a dedicated plugin, Spitfire Audio App required
  - 8.5 GB download size
  - macOS 11 to OS 26, minimum 2.8GHz i5 (quad-core) and 8GB RAM, recommended 2.6GHz i7 (six-core) and 16GB RAM or Apple Silicon
  - Windows 10 and Windows 11 (64-bit, latest Service Pack), minimum Intel 2.8 GHz i5 (quad-core) or AMD Ryzen 5, recommended Intel 2.6 GHz i7 (six-core) or AMD R7 2700
  - SSD drive for installs advised, machine must be connected to the internet during install
