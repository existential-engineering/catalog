  monophonic audio and overtone mangler for polyphonic material."
details: |-
  Overtone control to isolate flageolet tones. Gain adjustment for amplitude correction. Dry/Wet mixing dial. Visual feedback. Factory presets optimized for guitars, bass, drums, synths, and vocals.
