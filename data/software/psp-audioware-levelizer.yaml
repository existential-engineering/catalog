description: An advanced auto-fader processor that keeps audio levels consistent while preserving the natural dynamics and musical feel of tracks. Suitable for vocal leveling, bass control, dialogue processing, and mix automation. Features three reaction modes (Sharp, Normal, Smooth), integrated sidechain EQ with Shape and Bell sections, internal or external sidechain, multiple lookahead ranges, reference-level tracking, adjustable gain range limits, and a brick-wall output limiter.
details: |-
  PSP Levelizer is an advanced auto-fader processor that keeps audio levels consistent while preserving the natural dynamics and musical feel of your tracks.

  From vocal leveling and bass control to dialogue processing and mix automation, it delivers consistent levels while preserving the natural, musical sound. It can hold a target level or make a track follow an external signal, enabling creative level-control techniques beyond conventional dynamics processors.

  PSP Levelizer is suitable for live sound, recording, mixing, and mastering applications, with lookahead controls that can be optimized for each situation.

  The integrated sidechain EQ lets you focus the detector on specific frequencies. Three reaction modes - Sharp, Normal, and Smooth - allow everything from fast transient control to gentle, natural gain riding.

  For added output protection, PSP Levelizer also includes a high-quality brick-wall limiter with adjustable drive, ceiling, release settings, and stereo linking options.
specs: |-
  - Advanced auto-fader level control
  - Internal or external sidechain operation
  - Three reaction modes: Sharp, Normal, and Smooth
  - Adjustable response timing and action characteristics
  - Flexible sidechain filtering with Shape EQ and Bell EQ sections
  - Multiple lookahead ranges for precise level management
  - Intelligent reference-level tracking
  - Adjustable gain range limits with optional soft boundaries
  - High-quality brick-wall output limiter
  - Comprehensive preset management system
  - Designed for transparent, musical, and natural-sounding level control
  - Windows 7 - Windows 11, 64-bit (VST, VST3, AAX)
  - macOS 10.14 Mojave - macOS Tahoe (macOS 26), Intel or Silicon, 64-bit (AudioUnit, VST, VST3, AAX)
  - AAX requires Pro Tools
  - iLok user ID and iLok License Manager required, no hardware dongle needed
  - License activatable in 3 separate locations (computer or iLok dongle 2nd generation or above)
