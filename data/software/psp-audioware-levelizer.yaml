description: >-
  An advanced auto-fader processor that keeps audio levels consistent while
  preserving the natural dynamics and musical feel of tracks. Suitable for vocal
  leveling, bass control, dialogue processing, and mix automation. Features
  three reaction modes (Sharp, Normal, Smooth), integrated sidechain EQ with
  Shape and Bell sections, internal or external sidechain, multiple lookahead
  ranges, reference-level tracking, adjustable gain range limits, and a
  brick-wall output limiter.
details: |-
  Requires free iLok user ID and iLok License Manager; supports 3 activation locations. 30-day trial available for macOS and Windows.
specs: |-
  - Formats: AU, VST, VST3, AAX
  - Platforms: Windows 7-11 (64-bit), macOS 10.14+ (Intel and Apple Silicon)
  - Reaction modes: Sharp, Normal, Smooth
  - Sidechain: internal and external
  - Sidechain EQ: Shape and Bell sections
  - Multiple lookahead ranges
  - Output: brick-wall limiter
  - Licensing: iLok License Manager (3 activations)
