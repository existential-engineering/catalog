details: |-
  A richly detailed emulation of JHS's discontinued Panther Cub V2, bringing the lush warmth of analog-style bucket brigade delay to modern production. With up to 1,000ms of delay time, tap tempo, and expressive modulation, it offers everything from subtle echoes to deep, evolving textures. Modeled at the component level, it captures the organic character of the original hardware while offering the precision and flexibility of digital control. Introducing, MixWave: JHS Panther Cub .
