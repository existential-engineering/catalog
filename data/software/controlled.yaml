details: >-
  Meet controlled, the game-changing dynamic stereo/mid/side frequency processor
  and enhancer that's about to redefine the way you sculpt your sound. Imagine
  having the power to enhance your track's low end with surgical precision,
  elevate mid/side frequencies to new heights, and masterfully control and
  enhance stereo frequencies.


  Controlled harnesses the magic of unique filters coupled with cutting-edge
  push-pull technology to give you unparalleled control over your sound. This
  plugin is your secret weapon for enhancing vocals, drums, bass, and every
  element in your mix. It even lets you high-pass track parts while preserving
  their strength, ensuring your music packs a punch.


  With controlled, you're in the driver's seat with four incredible modes to
  choose from: pitch, classic, trimmed, and single. Each mode is your ticket to
  unlocking different dimensions of sonic manipulation. Whether you're after
  pristine lows, rich mids, or captivating highs, controlled has you covered.


  In pitch mode, controlled deploys its unique and powerful filters to extract
  specific frequencies from your original signal, expertly process them, and
  seamlessly blend them back into your mix. For those seeking a touch of
  resonance and classic warmth, the classic mode is your go-to choice. In
  trimmed mode, a revolutionary high-pass filter is applied, allowing you to
  sculpt and control your mix's low end. In single mode, low-pass filters
  extract set frequencies from your original signal, giving you an ultra-pure
  high-pass filter that's unmatched in its precision.


  To ensure controlled is your go-to solution for studio mastery, we've added a
  transparent limiter and up to 16 times oversampling. Controlled by 2b played
  music is a virtual effect audio plugin for macos and windows. It functions as
  an audio units plugin and a VST 3 plugin.
