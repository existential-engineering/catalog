details: |-
  AirEQ is an equalizer created to meet every single expectation of musicians,
  mixing engineers and producers. AirEQ aims to accurately reproduce the analog
  equalization characteristics: the curve precision and the phase's variation
  are the key points of the analog sound.

  It also reproduces musical tuning ways which are an important part of the
  sound of a high-end equalizer. Aireq also features a special air band, which
  eliosound claim is a new type of filter that helps you to restore or to add
  sound brightness.
specs: |-
  - Eight-band amlt (analog matched linear transform) equalizer
  - High pass filter (20hz-10khz, 6db/oct, 12 dB/oct, q 0.05-4)
  - Low shelf/bell (20hz-20khz, gain 15db, q 0.3-2)
  - Bell x 3 (20hz-20khz, gain 15db, q 0.1-7)
  - High shelf/bell (20hz-20khz, gain 15db, q 0.3-2)
  - Low pass filter (20hz-20khz, 6db/oct, 12 dB/oct, q 0.05-4)
  - Air band (15db)
  - In/out switches for each band
  - Global in/out switch
  - Output gain (15db)
  - Band names display (on, off)
  - Frequency display (Hz, notes, off)
  - Q display (q-factor, octaves, off)
  - Gain display (on, off)
  - Knob tuning (coarse, fine, coarse with max gain)
  - Knob snap (coarse, fine, off)
  - Presets & banks with sorting options
  - Keyboard shortcuts
