details: >-
  Ableton drum racks for superior drummer 3 big rock drums ezx features separate
  ableton drum racks for all factory presets for the toontrack superior drummer
  3 big rock drums ezx expansion library. These racks provide out of the box
  integration workflow between ableton live and toontrack superior drummer using
  the ezx expansions including a host of features ready to use for composition
  and performance using ableton push or similar controllers.


  34 ableton drum racks to instantly load the factory library "mix ready"
  presets with ableton mappings for routing audio from a single track or
  multiple tracks for deep level control of mixing in ableton live. 17 ableton
  live templates one for each factory preset to host the superior drummer
  factory content in multi track audio routing mode.


  Colour coded pad design for visual performance and finger drumming. All racks
  use consistent drum rack colouring so you can visually and immediately spot
  your rides from your hi hat articulations. Vast array of instrument
  articulations ready to go in one massive layout using ableton push 64 pad
  layout mode.


  Ableton macros mapped to toontrack superior drummer macros with preset values
  for ease of use in push and simple to use automation programming. 34 ableton
  drum racks for all big rock drums ezx factory presets single audio output to a
  single ableton track or multi-track audio routing mode using preconfigured
  ableton live templates.


  Use the template racks and extend to your own toontrack superior drummer 3 big
  rock drums ezx presets, swapping out individual sounds or articulations. You
  are 100% ready to go with the factory presets but there is no limitation to
  creating your own presets from these templates.
