description: Free time and frequency visualization tool that shows which notes and frequency ranges were active over time. Switches between spectrogram and spectrum analyzer modes, and is included in the ToneBoosters plugin installer.
details: |-
  A visual support tool to inspect time and frequency. Visualize the audio spectrum and see what notes and frequency ranges were active over time.

  Switch between spectrogram and spectrum analyzer modes, the latter with octave and linear resolution. Sensitivity adjustment tunes the graphics for better visuals, and a variety of color schemes is available.

  Spectrogram is completely free and included in the ToneBoosters software installer.
specs: |-
  - Spectrogram mode showing how frequencies evolve over time
  - Spectrum analyzer with octave and linear resolution
  - Sensitivity adjustment
  - 16-channel immersive audio support
  - Variety of color schemes
  - Free, and included in the ToneBoosters plugin installer
  - Resizable user interface, fits every screen and resolution
  - Dozens of color themes
  - Undo, redo and A/B switching
  - Preset management: organize, import and export presets
  - Easy license activation, no hardware dongle required
  - Sample rates of up to 384kHz
  - Windows 10 or up, 64-bit DAW with VST, VST3 or AAX support, Intel or AMD SSE2 processor
  - macOS 10.13 or up, 64-bit DAW with VST, VST3, AAX or AU support, Intel or Apple Silicon processor
  - Linux, 64-bit DAW with VST or VST3 support, Intel or AMD SSE2 processor, glibc 2.31 or up
  - iPadOS / iOS requires an AUv3-compatible host
