details: >-
  Premiere pro is a tool for professional video editing, allowing you to
  capture, edit, and deliver virtually any format, from dv to uncompressed hd.


  Premiere pro supports all standard and high-definition formats, including dv,
  digital betacam, hdv, hdcam, dvcpro hd, and d5 hd (some formats may require
  additional hardware). Capture, edit, and deliver full-resolution sd or hd
  using native support for the xena hs real-time encoding card from aja video.
  Capture and edit hdv content in its original format with no conversion or
  quality loss.


  Play multiple video channels at full resolution and with titles, transitions,
  effects, and color correction, without rendering or additional hardware.
  Import and export major video, audio, and graphic file formats: quicktime,
  windows media, avi, bwf, aiff, jpeg, png, psd, tiff, and more. Capture, edit,
  and output 24-frames-per-second progressive content with support for 24p and
  24pa advanced pulldown schemes.


  Import, edit, and output 4k image sequences with dimensions up to 4,096x4,096
  pixels. Preview widescreen footage on a 4:3 monitor or lay off to a 4:3 tape
  or dvd with real-time letterboxing. Capture and edit hd or up to 4k scanned
  files, consolidate and manage projects, and work efficiently with adobe after
  effects and photoshop software.


  Choose from a wide range of capture cards and other hardware to build the hd,
  sd, or dv editing system that meets your needs and budget. Control video decks
  through rs-422 and rs-232 serial protocols or firewire for precise batch
  capturing, recapturing, and insert editing. Record and play back audio through
  any multichannel audio card or hardware that supports the industry-standard
  asio protocol.
