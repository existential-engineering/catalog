description: Actuate is a subtractive synthesizer, additive synthesizer,
  sampler, and granulizer made in rust with nih-plug and egui.
details: >-
  Actuate is a subtractive synthesizer, additive synthesizer, sampler, and
  granulizer made in rust with nih-plug and egui. Actuate follows a philosophy
  of "limited but creative options" for making sounds.


  Actuate is a virtual instrument audio plugin for macos, windows and linux. It
  functions as a VST 3 plugin and a clap plugin. Macos 13+, an m1 mac version is
  available on the github release page or see downloads page. Windows 10 and up
  is compatible.


  Actuate will look for presets and banks at the following locations: linux:
  /home/user/documents/actuatedb/ macos: /users/user/documents/actuatedb/
  windows: c:\users\user\documents\actuatedb\. The default bank is located at:
  linux: /home/user/documents/actuatedb/default/ macos:
  /users/user/documents/actuatedb/default/ windows:
  c:\users\user\documents\actuatedb\default\.


  Any generator can go to any filter. Samples can be saved into presets. Stereo
  width and ultra wide controls are available.
