description: proximity:EQ+ is an EQ plug-in that separates the direct sound of a
  recording from its reverberant components, so a source can be repositioned in
  post-production. Working on music and speech alike, it pulls a source closer
  or pushes it further away without altering its original character.
details: |-
  Microphone placement is decided at the session and rarely reconsidered afterwards, which leaves an interview recorded from too far away or a grand piano that turns out muddy because too much room was captured. proximity:EQ+ addresses both cases after the fact: lowering the spatial components raises the share of direct sound and brings the source front and center, and the frequency-selective dereverberation separates direct from indirect content precisely rather than across the whole spectrum.

  The same control works in the other direction. Where microphones ended up too close and the mix lacks spaciousness, the proximity feature emphasizes the natural spaciousness already present in the recording and distances the source seamlessly, making the mix more transparent and opening another axis for building sonic depth. Driven over time, the same parameter produces an automatic acoustic fade-out, an atmospheric ambience effect that suits film post-production.

  Room acoustics are the third target. However carefully a setup is planned, a room behaves the way it behaves, and detrimental room modes end up in the take. Because the plug-in splits direct sound from reverb before any frequency-selective adjustment is applied, undesired room resonances can be edited separately from the natural reverb of the recording, and a single odd resonance can be tuned out while the overall character of the sound is retained.

  The interface exposes frequency-dependent modification of both components with a fully adaptable algorithm, and a blind:flug mode removes the visual feedback so decisions are made by ear. The plug-in runs on macOS and Windows in AU, VST2, VST3 and AAX form, with native Apple Silicon support outside AAX, and is authorized either machine-based or through iLok.
specs: |-
  - Plug-in formats (Mac): AU, VST2 (Universal Binary), AAX
  - Plug-in formats (Windows): VST2 (32/64 bit), VST3, AAX
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok
  - Apple Silicon support: native (except AAX)
  - Latest version: 1.0.6
  - Windows: Windows 7 or later
  - Mac: OS X 10.7 or later
  - RAM: at least 4 GB recommended
  - CPU: at least Intel dual-core i5 recommended, Apple M1
  - Frequency-dependent modification of direct sound and reverb
  - Frequency-selective dereverberation
  - Isolation and removal of individual room modes
  - Automatic acoustic fade-out for ambience effects
  - blind:flug mode for judging changes by ear
  - Fully adaptable algorithm
