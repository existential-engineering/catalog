description: The eq plug-in that repositions audio sources in post-production.
  Whether music or speech, proximity:EQ+ lets you edit sound spaces as never
  before.
details: |-
  The eq plug-in that repositions audio sources in post-production. Whether music or speech, proximity:EQ+ lets you edit sound spaces as never before. The plug-in lets you amplify or silence certain parts of your room acoustics, depending on your vision of the perfect sound in postproduction.

  Closer to the source: often enough when interviewing, the recording microphone got placed too far from the source, or the grand piano turns out muddy because too much reverb was recorded. In these situations, proximity:EQ+ lets you draw the voice significantly closer and give the muddy piano a crisper sound in postproduction. Lowering the spatial components increases the direct sound, putting the sound source front and center. Frequency-selective dereverberation allows you to precisely separate direct from indirect components of the signal.

  Add space to the mix: it is also possible that the microphones ended up getting too close to the sound source, leaving the mix without spaciousness. proximity:EQ+ seamlessly distances the sound source without affecting its original character, which makes the entire mix more transparent and opens new ways of creating sonic depth. By adapting the proximity feature, you can emphasize the natural spaciousness of the recording and freely adjust the distance from the sound source, or automatically create an acoustic fade-out, an atmospheric ambience effect particularly convenient for the post-production of films.

  Optimal room acoustics: even when a setup is meticulously planned and the microphones perfectly positioned, the acoustics of a given room simply are what they are. The technology of proximity:EQ+ opens possibilities for amending detrimental room modes in post-production while leaving the direct sound entirely untouched.

  The plug-in separates the direct sound and the reverb of a recording. With the help of frequency-selective adjustments, proximity:EQ+ even lets you edit undesired room resonances distinctly from the natural reverb of a recording.
specs: |-
  - Edit natural reverb in a recording
  - Frequency-selective dereverberation
  - Isolate and remove room modes
  - Frequency-dependent modifications
  - blind:flug mode for ear-focused adjustment
  - Fully adaptable algorithm
  - Plug-in formats (Mac): AU, VST2 (Universal Binary), AAX
  - Plug-in formats (Windows): VST2 (32/64 bit), VST3, AAX
  - Supported samplerates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok
  - Latest version: 1.0.6
  - Apple Silicon support: native (except AAX)
  - System requirements, PC: Windows 7+
  - System requirements, Mac: OS X 10.7
  - RAM: at least 4 GB (recommended)
  - CPU: at least intel DualCore i5 (recommended), M1
