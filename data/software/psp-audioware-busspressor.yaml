description: PSP BussPressor is a compressor optimized for group and master buss processing. It combines the sound of classic VCA compression with wide tuning capabilities, while its extra controls allow you to adjust a side chain high pass filter or apply parallel compression with ease.
details: |-
  PSP BussPressor is a compressor optimized for group and master buss processing. It combines the sound of classic VCA compression with wide tuning capabilities, while its extra controls allow you to adjust a side chain high pass filter or apply parallel compression with ease.

  PSP BussPressor is part of the PSP series of Zero Latency Processing plug-ins, making it ideal for situations such as live monitoring, live broadcast production, and managing levels while tracking.

  Running PSP BussPressor in 30-day trial mode or activating it requires a free iLok user ID and the free iLok License Manager application. No hardware dongle is needed. The license activates in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above), and the locations can be changed at any time using PACE's iLok License Manager.
specs: |-
  - Compressor optimized for group and master buss processing
  - Sound of classic VCA compression with wide tuning capabilities
  - Adjustable side chain high pass filter
  - Parallel compression control
  - Part of the PSP Zero Latency Processing plug-in series, suited to live monitoring, live broadcast production and tracking
  - Windows 7 to Windows 11, 64-bit only
  - macOS X 10.14 Mojave to macOS 15 Sequoia, Intel and Apple Silicon, 64-bit only
  - AAX formats supported in Pro Tools and all DAWs
  - Free iLok user ID and iLok License Manager required, no hardware dongle needed
  - License activatable in 3 separate locations
  - 30-day trial available for macOS and Windows
