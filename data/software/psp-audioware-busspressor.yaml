description: A compressor optimized for group and master buss processing that combines the sound of classic VCA compression with wide tuning capabilities. Features zero latency processing suitable for live monitoring, broadcast, and tracking, along with sidechain high-pass filter control and parallel compression functionality.
details: |-
  PSP BussPressor is a VCA-style bus compressor with zero latency processing, making it suitable for live monitoring and broadcast applications. Includes an adjustable sidechain high-pass filter and parallel compression capability. Licensing via iLok License Manager (no hardware dongle required); licenses can be activated on up to 3 locations. A 30-day free trial is available.
