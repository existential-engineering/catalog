details: |-
  Bass Ray5 features a music man stingray 5 bass. The first bass designed by
  ernie ball music man, the stingray 5 was unveiled in 1987 and has been an
  industry standard for extended range basses ever since. With its powerful
  punchy sound, the added flexibility of additional pickups and a comfortably
  contoured body the stingray 5 satisfies even the most demanding of players.

  Deeply sampled over 21gb uncompressed contents, over 7,600 samples, with multi
  velocity layers and round robin samples, bass ray5 aims at precisely
  reproducing the versatile and modern bass sound. To achieve the best possible
  sound, it took our team several months to prepare the sample recording. We
  have recorded left and right channels with different amps so this gives users
  more flexibility in shaping their final sound.

  Bass ray5 covers pick and lead finger playing methods. What's more, we also
  sampled as much as techniques available on this bass, including mute, sustain,
  slides, bend, falls, hammer on and pull off.

  Bass ray5 includes vstomp effect system, which provides an exciting new way
  for guitar sound. Vstomp includes many modelled amps and cabs. With it, you
  can freely combine different top notch amps and cabs, and then forge your
  unique guitar sound.

  Vstomp is based on hotone's proprietary cdcm system, vstomp delivers organic,
  studio-grade sound quality and the exact character of legendary amplifiers.
  Unlike mainstream modeling methods based on the characteristics of a certain
  "state" of the circuitry, which just "comes close" to the modeled sound,
  vstomp employs a complex system based on dynamic feature modeling. In this
  matrix, every single circuit component is alive and performs like its
  original. Vstomp has over 26 amps and 20 cabs waiting for you to use.
