details: >-
  This collection of ableton drum racks features all factory presets for the
  native instruments abbey road studio drummer.


  Key features and workflow: ease of navigation to load all presets from ableton
  push controller device browser. 6 ableton drum racks to instantly load the
  factory library preset with ableton mappings. Optimized for ableton push 2!
  Color coded pad design for visual performance. Labelled pads for post
  performance editing and automation within the ableton clip editor each MIDI
  note and articulation individually named.


  Audio routing: this pack routes all audio output through a single ableton
  track. Mixing can be further enhanced through kontakt/abbey road studio
  drummer mixer or additional ableton audio effects to the track for example the
  new ableton 10 drum bus.


  Minimum system requirements: ableton 9.5 or above to use ableton push 2 color
  pads mode. Native instruments abbey road studio drummer you must purchase,
  license and install abbey road studio drummer separately before installation
  of this pack.
specs: |-
