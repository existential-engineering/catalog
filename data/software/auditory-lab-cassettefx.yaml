id: ubcvvLo8QbHwQkLkkPL0h
name: CassetteFX
manufacturer: auditory-lab
primaryCategory: effect
description: Cassette FX emulates the sounds of old cassette tape players, it
  can quickly create a realistic lo-fi/vintage feel in your own recordings.
details: |-
  With cassette fx you can simulate and manipulate the motor noise, tape hiss,
  buttons and more.

  Each one of this effects is given its own controls with pan and volume beside
  4 master knobs that controls release, attack, pitch and reverb.

  Cassette fx is pc & mac compatible and is available in 32-bit & 64-bit VST,
  mac VST and audio units formats.
specs: |-
  - 32-bit
  - 64-bit
  - Pc compatible
  - Mac compatible
  - Motor noise simulation
  - Tape hiss simulation
  - Pan control
  - Volume control
  - Release control
  - Attack control
  - Pitch control
  - Reverb control
