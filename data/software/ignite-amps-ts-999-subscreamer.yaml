description: "Digital emulation of an overdrive pedal built for Subhuman
  guitarists in 2010, inspired by the famous green '808' overdrive pedal with
  additional features. Features symmetric/asymmetric clipping modes, op-amp
  saturation modeling, and switchable buffer modeling."
details: |-
  1.5.2

  Dynamic 2N3904 BJT buffer modeling
  Dynamic 1N4148 diode clipping circuit modeling
  Op-amp saturation modeling
  Symmetric/asymmetric clipping modes
  Switchable buffer modeling for CPU efficiency
  Selectable oversampling rate (up to 8x)
  Double precision (64-bit) floating point mathematical model
  Mono/stereo support
  Fully automatable controls
