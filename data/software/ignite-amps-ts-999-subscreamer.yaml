description: A digital emulation of an overdrive pedal for guitar, developed to accurately model its hardware counterpart built for Subhuman guitarists in 2010. The circuit draws inspiration from the classic '808' overdrive pedal while adding features for modern versatility. It can easily add dirt and bite to clean guitar tones, as well as make the amplifier distortion sound tighter, more focused and more responsive to picking.
details: |-
  Dynamic 2N3904 BJT input and output buffers analog modeling
  Dynamic 1N4148 diode clipping circuit analog modeling
  Op-amp saturation analog modeling
  Symmetric / Asymmetric clipping mode
  Normal / Fat bass response mode
  Mono / Stereo processing support
  Switchable Input and Output Buffer modeling for CPU efficiency
  Selectable oversampling rate (up to 8x)
  Double precision (64-bit) floating point mathematical model
  Fully automatable controls
