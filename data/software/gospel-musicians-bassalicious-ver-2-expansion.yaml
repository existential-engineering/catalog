details: |-
  BASSalicious Version 2 represents the highest quality in synth, electric, and acoustic bass sounds. Unlike our amazing Version 1 that represented the analog side, this version 2 represents the sampled side, where we basically sampled every single one of our favorite bass sounds from tons of analog gear. BASSalicious is a virtual analog and wavetable synthesizer with high quality streaming samples. This hybrid bass synth can recreate any synth bass sound imaginable as well as very high quality acoustic and electric bass emulations. The secret lies in our analog modeling synth and filters that creates an ultra analog sound that is organic and punchy as heck. We even created our own Phat Table technology that is a custom solution for making wavetables sound bigger and phatter and with 4-oscillators to stack, this wil be your #1 go-to synthesizer.
