description: Enter the studio of the '70s icons who innovated the dry drum sound. This punchy drummer cuts through mixes with a warm, retro feel.
details: |-
  Nostalgia runs the show when it comes to standing out in the music scene. Whether you're an indie rockstar or a lo-fi mastermind, LEGEND's naturalistic impact is touching. Engineers of the past sought to refine their rhythm section with close mics on deadened drum heads and other dampening techniques, and those classic tactical strategies are emulated in LEGEND.

  LEGEND offers a collection of 5 unique Drum Kits, 6 Mix Presets and 30 Styles, each with 23 pre-designed MIDI patterns totalling 690 playable phrases. Play through the five drum kits, GRAND, TIGHT, WILD, THICK and LOOSE, for a range of '70s flavor.

  The mixing section is designed to provide maximum control over the sound with the minimum number of parameters. Under the hood it is a fully-featured mixing console with channel strips, busses and insert processors, and each instrument has its own individual channel mixer. The Master section adds global control over Reverb, a Color control and a Maximizer to further beef up the drums.

  A Color fader steps through the miking techniques of the ages, with higher values adding a sense of wear-and-tear to the kit, while the special Dust slider controls mic proximity. All 690 MIDI phrases are available via drag-and-drop or direct MIDI out for further control in the DAW.
specs: |-
  - 690 playable MIDI phrases in various styles
  - MIDI drag-and-drop and direct MIDI out for custom tweaking
  - 5 drum kits (GRAND, TIGHT, WILD, THICK, LOOSE) with 6 mix presets
  - 30 styles with 23 pre-designed MIDI patterns each
  - Special 'Dust' and 'Color' FX controls to alter miking technique
  - Per-instrument channel mixer plus master section with reverb, color and maximizer
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Windows: Windows 10 to Windows 11
  - Mac: macOS Catalina (10.15) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 4.73 GB of free disk space
  - 1280x768px display, internet connection
  - Delivery: automated installation via UJAM App, or downloadable installer file
  - Authorization via the UJAM App, or email and password within the plug-in
  - Supported standards: MIDI
