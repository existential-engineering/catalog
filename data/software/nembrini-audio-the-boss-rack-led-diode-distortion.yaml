description: "The Boss Led Diode Distortion plugin is modeled on the Marshall
  Guv'nor* pedal, the first “amp in a box” pedal that replicates the tone and
  distortion character of famous black and gold British guitar amps."
details: |-
  Nembrini Audio perfectly recreates the two LED distortion circuit and the amp style passive three tone controls of the original unit and adds the versatility that only the digital world permits. In addition, Nembrini Audio creates The Boss Rack plugin aimed at producers and sound designers, with the same distortion and tone circuit plus ultra bass boost band, wet/dry mix feature, phase inversion , mid/side operation and the acclaimed Analog Link feature which introduces the typical unpredictability of the analog world by inserting micro-variations between the right and the left channel. The Boss Rack Led Diode Distortion plugin is the perfect addition to any modern musician and producer in search of truly analog colouration for their productions!
