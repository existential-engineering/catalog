description: A plugin modeled on the Marshall Guv'nor pedal, the first 'amp in a box' pedal that replicates the tone and distortion character of famous black and gold British guitar amplifiers.
details: |-
  - The Boss Led Diode Distortion plugin is modeled on the Marshall Guv'nor pedal, the first 'amp in a box' pedal that replicates the tone and distortion character of famous black and gold British guitar amplifiers.
  - Nembrini Audio faithfully recreates the two LED distortion circuit and amp-style passive three-tone controls of the original pedal, adding digital versatility suited for modern production workflows.
  - The Boss Rack edition includes a wet/dry mix knob, phase inversion switch for parallel processing advantages, and mid/side operation, making it a flexible tool for both tracking and mixing contexts.
  - The Analog Link feature simulates the natural circuit variation between real analog channels, giving each side of the stereo field a subtly different character for a more organic sound.
  - A Spread circuit widens the stereo field, and independent left/right channel controls with individual and global links give producers precise control over the stereo image.
