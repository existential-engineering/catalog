description: The Boss Rack is a rack version of Nembrini Audio's Marshall Guv'nor-modeled distortion, aimed at producers and sound designers. It carries the same distortion and tone circuit plus an ultra bass boost band, wet/dry mix, phase inversion, mid/side operation and the Analog Link feature.
details: |-
  The Boss Led Diode Distortion plugin is modeled on the Marshall Guv'nor pedal, the first "amp in a box" pedal that replicates the tone and distortion character of famous black and gold British guitar amps.

  Nembrini Audio recreates the two LED distortion circuit and the amp-style passive three tone controls of the original unit, and adds the versatility that only the digital world permits.

  The Boss Rack plugin is aimed at producers and sound designers, with the same distortion and tone circuit plus an ultra bass boost band, a wet/dry mix feature, phase inversion, mid/side operation and the Analog Link feature, which introduces the unpredictability of the analog world by inserting micro-variations between the right and the left channel.

  It carries independent controls for the left and right channels with individual and global links, a Dry/Wet mix knob for both channels, a Spread circuit to widen the stereo field, a Phase Reverse switch that takes advantage of the original unit's phase changes when used in parallel, and INPUT and OUTPUT level knobs.
specs: |-
  - Modeled on the Marshall Guv'nor pedal
