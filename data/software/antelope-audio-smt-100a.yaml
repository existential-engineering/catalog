details: |-
  SMT-100A is a tube leveling amplifier / limiter plugin that runs natively in your DAW on macOS or Windows, or in real-time on Antelope Audio's Synergy Core interfaces.

  A 1980s classic, the SMT-100A is among the easiest compressor effects to learn. Yet, this ease of use doesn't come at the cost of effectiveness or sound. For over 30 years now, the original unit this plugin is modeled after has remained a top choice by the pros for its fast attack times and its ability to do a great job with vocals, drums, and bass.

  For its FPGA-driven replica, Antelope worked hard to painstakingly preserve both the special sound of the SMT-100A and its simplistic design and control set. This way, you can focus on getting the sound you want quickly, without much of a learning curve.
specs: |-
  - Tube leveling amplifier / limiter modeled after a 1980s classic studio unit
  - FPGA-driven replica that preserves the original unit's sound character
  - Fast attack times suited to vocals, drums, and bass
  - Simple control set for quick workflow with minimal learning curve
  - Runs natively in your DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core interfaces
