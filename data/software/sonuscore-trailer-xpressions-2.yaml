description: Trailer Xpressions II contains over 1,775 sampled sounds that have been intuitively programmed into 47 instruments and organized into ready-made construction kits to make it take just seconds, to find the perfect sound for any trailer or hybrid track. Developed in collaboration with BOOM Library, this Kontakt-based virtual instrument blurs the line between music and sound design with cinematic trailer sounds delivered at 96kHz/24-bit quality.
specs: |-
  - 47 Kontakt cinematic construction kit instruments
  - 1,775 audio files in WAV format at 96kHz/24-bit
  - 9GB sample library
  - Requires full retail version of Kontakt 5.7 or higher (not compatible with free Kontakt Player)
  - Mac: OS X 10.10 or greater, Intel Core 2 Duo, 4GB RAM (6GB recommended)
  - Windows: 7, 8, or 10, Intel Core 2 Duo or AMD Athlon 64 X2, 4GB RAM (6GB recommended)
  - 9GB free disk space required
  - Download only (no physical media)
  - Lifetime license — no future royalty fees
