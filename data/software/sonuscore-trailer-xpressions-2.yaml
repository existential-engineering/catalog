description: Trailer Xpressions II contains over 1,775 sampled sounds that have been intuitively programmed into 47 instruments and organized into ready-made construction kits to make it take just seconds, to find the perfect sound for any trailer or hybrid track. Developed in collaboration with BOOM Library, this Kontakt-based virtual instrument blurs the line between music and sound design with cinematic trailer sounds delivered at 96kHz/24-bit quality.
details: |-
  Trailer Xpressions II: The BOOM Experience is the follow up to Sample Logic's Trailer Xpressions library, pushing scoring and sound design in a new direction. Sample Logic teamed up with SFX designer BOOM Library, whose sound design team has created samples for trailers, blockbusters and scores over many years, lending that archive to the collaboration.

  Recorded and delivered at 96 kHz, 24-bit quality, the library holds over 1,775 sampled sounds programmed into 47 instruments and organized into ready-made construction kits. Samples are derived from instruments, field recordings, vehicles and other sources, covering atmospheres, drones, risers, stingers, brams, scrapes, whooshes, reverses and hits.

  Sounds are drawn from the commercial BOOM Library titles Cinematic Hits, Cinematic Metal, Cinematic Trailers Designed, Destruction Designed and Cinematic Horror Designed, plus over 500 never-before-heard sounds selected from BOOM's private vault of unpublished material. In addition to the construction kit instruments, the raw .wav audio files that drive them are supplied directly and can be imported into any DAW, with each file name displayed inside the instrument interface as it plays.

  Built for Native Instruments Kontakt, the interface adds Global and Independent modes that decide whether parameter controls apply per key or across all samples at once. Custom mastering effects called Energizer and Polisher handle dynamic and dramatic sound shaping, all assignable to an external MIDI controller, and a heart button earmarks favourite sounds within each construction kit for recall on the next load.
specs: |-
  - 47 Kontakt cinematic construction kit instruments
  - 1,775 audio files in .wav format at 96 kHz / 24-bit
  - 9 GB sample library
  - Over 500 previously unpublished sounds from the BOOM Library vault
  - Global and Independent modes for user interface parameters
  - MIDI controllable user interface for morphing and tweaking sounds
  - Energizer and Polisher multi-processor master effects
  - Favourites system that recalls earmarked sounds per construction kit
  - Direct access to the raw .wav audio files for import into any DAW
  - Requires the full retail version of Native Instruments KONTAKT 5.7 or higher (will not work in the free KONTAKT PLAYER)
  - Mac OS X 10.10 or greater, Intel Core 2 Duo, 4 GB RAM (6 GB recommended)
  - Windows 7, 8 or 10, Intel Core 2 Duo or AMD Athlon 64 X2, 4 GB RAM (6 GB recommended)
  - 9 GB free disk space for the library and sample content
  - Available as a download only
  - Lifetime user license with no future licensing or royalty fees
