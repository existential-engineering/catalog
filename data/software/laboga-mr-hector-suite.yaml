description: Introducing the aurora mr. Hector suite the craftsmanship of
  boutique amplifiers meets the versatility of modern dsp.
details: |-
  The craftsmanship of boutique amplifiers meets the versatility of modern dsp.
  It all begins with mr. Hector a well-known and universally loved high-gain
  amplifier from laboga. We've captured its soul, rebuilt it digitally, and
  tuned every detail to perfection. The result is a studio-grade plugin that
  delivers the unmistakable tone and character of this legendary amp reborn
  inside your DAW or as a standalone experience.

  At the heart of the suite are two distinct amplifier models both meticulously
  recreated using aurora's advanced drivenet neural network modeling technology:
  mr. Hector a fierce, high-gain powerhouse designed for modern metal and hard
  rock. Tight low end, biting mids, and the perfect saturation. Switchable
  tube/diode rectifiers and bright/mid toggles give you complete tonal control.
  The beast a versatile 30w amp with el84 tubes and three unique channels:
  clean, crunch, and drive. Shape your tone with the mid switch and character
  controls to move from sparkling cleans to rich, articulate gain.

  A flexible preamp stage featuring four fully adjustable pedals. Reorder them
  freely to craft your perfect signal chain: custom overdrive inspired by the
  iconic tube screamer, fine-tuned for tight low end and added bite. Transient
  shaper sharpens your attack, adds brightness, and removes unwanted muddiness.
  Aurora preamp boost original aurora dsp circuit for early-stage dynamic
  shaping perfect for modern metal mixes. Octafuzz / booster options add grit,
  texture, or harmonic richness to push your amp harder.

  Recreate the experience of a real recording studio with aurora's speakerx
  engine a next-generation cabinet simulator that captures the nonlinear
  behavior and natural dynamics of guitar speakers: 6 virtual cabinets,
  including laboga originals. 6 speaker types, from v30s to creambacks. 4 iconic
  microphones per cabinet. Mix, match, and position mics freely for endless
  tonal variety. Plus, a library of studio-grade impulse responses gives you
  authentic laboga cabinet tones right out of the box.

  Add depth, width, and polish with studio-level effects: 10-band equalizer
  analog-inspired precision eq with 12 db range for surgical tone shaping.
  Limiter control peak levels and tighten your mix with adjustable low-end focus
  (100250 hz). Ping-pong delay classic stereo delay that moves your repeats
  between left and right channels. Aurora reverb from intimate rooms to
  cavernous spaces, dial in your perfect ambience. Finalize your sound with
  mastering-grade tools built directly into the plugin: 10-band output eq for
  final tonal sculpting. Sonic optimizer enhances clarity and punch. Fet and
  optical limiters for both transparent and vintage compression. Tuner,
  transpose, and MIDI compatibility for complete session integration.
