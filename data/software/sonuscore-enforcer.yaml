description: Enforcer is a bass plug-in that adds irresistible punch, powerful body and a rigorous low-end bass impulse to your samples. You can heavily beef up sounds or add only a hint of weight. A scalpel for punch with unmatched precision.
details: |-
  ENFORCER is a bass plug-in that adds punch, body and a low-end bass impulse to source material. It can heavily beef up sounds or add only a hint of weight, be used as a kick-drum synth, exchange kick drum tails and tune them using semitones, or completely exchange a given source sound. The page describes it as a scalpel for punch with unmatched precision, and as a Swiss Army Knife for punch, low-end, sub power and kick.

  The typical problems it addresses are adding sub sweeteners to every single shot of a fully automatic weapon, layering a kick drum with controllable and tunable low-end, enhancing live drums with well-defined punch, and adding steady weight to every footstep. Rather than being manually synced to a track, ENFORCER is triggered by the source audio material itself, and the trigger can be adjusted with surgical precision so that only the intended hits are enforced. A newer addition allows triggering via MIDI, so the plug-in can be played from a MIDI keyboard.

  A ducking stage removes conflicting source frequencies to make room in the mix for the enforced bass load, keeping the result clean. Kick drums and snares can be tuned using semitones. More than 115 musical and sound FX presets are included for browsing and starting points.

  ENFORCER requires an audio host application and does not work as a standalone application. It runs in hosts supporting VST 2.4, AU or AAX, including Logic Pro, Pro Tools (11+), Cubase, Nuendo, Ableton Live and Reaper.
specs: |-
  - Bass and sub-bass enhancement plug-in for adding punch, body and low-end impulse
  - Triggered by source audio material, so no manual syncing to the track is required
  - Trigger adjustable with surgical precision
  - MIDI triggering, so the plug-in can be played from a MIDI keyboard
  - Tune kick drums and snares using semitones
  - Exchange and modify kick drum tails and source sounds
  - Ducks source frequencies to make room in the mix for the enforced bass
  - More than 115 musical and sound FX presets
  - Gain reduction display
  - Format: software plug-in (VST, AU, AAX) for Windows and Mac
  - Requires an audio host application; does not run standalone
  - Works in hosts supporting VST 2.4, AU or AAX (Logic Pro, Pro Tools 11+, Cubase, Nuendo, Ableton Live, Reaper)
  - Requires a free iLok account; machine license activation or iLok USB dongle (2nd generation or newer)
  - Required hard disk space: 129 MB
  - Available as download
  - Windows: Windows 8 (64-bit), 8 GB RAM, Intel Core i5 or similar, OpenGL 2.1 capable GPU
  - Mac: macOS 10.13 (64-bit), 8 GB RAM, Apple Silicon or Intel Core i5, OpenGL 2.1 capable GPU
