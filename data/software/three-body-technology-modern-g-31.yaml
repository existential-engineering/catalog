description: Modern G-31 is a contemporary-style graphic equalizer plugin featuring 31 EQ bands, a real-time analyzer, and a 'Drive' model of vintage consoles.
details: |-
  Modern G-31 is a contemporary-style full-featured graphic equalizer plugin featuring 31 EQ bands, a high-precision floating parametric EQ bell filter, a real-time analyzer, and a Drive model of vintage consoles.

  Unlike IIR-based graphic EQs, Modern G-31 uses minimal-phase or linear-phase FIR filters in order to eliminate the artifacts caused by band interaction. This provides perfect plateau and stair-stepped responses, and the slope between bands can be adjusted with the Curve knob.

  The plugin offers switchable minimal-phase and linear-phase modes, a switchable Drive function for harmonic distortion, stereo, mid/side and left/right processing, a spectrum visualizer and GPU-accelerated interfaces that are freely resizable. Latency is zero in minimal-phase mode and 2048 samples in linear-phase mode.

  To minimize CPU cost in the audio thread, FIR parameters are updated in another thread, so Modern G-31 cannot perform sample-accurate automation.
specs: |-
  - 31-band EQ
  - High-precision floating parametric EQ bell filter
  - Minimal-phase / linear-phase FIR filters, switchable
  - Adjustable slope between bands via the Curve knob
  - Switchable Drive function for harmonic distortion
  - Avoids stair-stepped responses
  - 0 latency in minimal-phase mode, 2048 samples in linear-phase mode
  - Stereo, mid/side and left/right processing
  - Spectrum visualizer and real-time analyzer
  - GPU-accelerated, freely resizable interface
  - Cannot perform sample-accurate automation (FIR parameters update on a separate thread)
  - Minimum system requirements: Intel or AMD CPU with SSE 4.1 instruction set
  - Native support for Apple Silicon is currently unavailable
  - Minimum system requirements: Mac OS X 10.9 / Windows 7
  - Minimum system requirements: 4 GB RAM and 100 MB disk space
  - Plugin formats, Windows: 32-/64-bit VST2, 64-bit AAX
  - Plugin formats, Mac: 64-bit VST2, Audio Unit and AAX
