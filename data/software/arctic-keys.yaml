name: Arctic Keys
manufacturer: one-red-dog
primaryCategory: synthesizer
url: http://itunes.apple.com/us/app/arctic-keys/id457216963?ls=1&mt=8
description: Arctic keys is a virtual analog synthesizer for ipad featuring a
  classic dual-oscillator subtractive synthesis design.
details: >-
  Arctic keys is a virtual analog synthesizer for ipad featuring a classic
  dual-oscillator subtractive synthesis design.


  The two low frequency oscillators (lfos) each have three modulation
  destinations. Each lfo may be free running or synced to tempo and the timing
  rate adjusted. The modulation matrix allows for deep routing between the mod
  wheel, aftertouch and 16 x 4 analog-style gated step-sequencer.


  The classic arpeggiator is complimented by the 16 x 4 gated step-sequencer.
  Play a note to trigger the sequencer. Step through a sequence to play short
  melodic lines or let it modulate the synthesizer. The different key gating
  options may be used to change how the sequence is triggered. Each of the four
  tracks has an assignable modulation destination and loop point.


  Along with traditional pitch and mod wheels, adjust the velocity by tapping
  along the length of the key from top to bottom. Change the key mode to mono
  for retro lead lines. Adjust the size of the keyboard or use a gesture to
  scroll through the octaves. Place the keyboard into pitch mode and use
  multi-touch gestures to bend individual notes, while sliding up and down the
  keys to add aftertouch.


  The live phrase recorder can save performances as 44.1khz 16-bit wav files and
  as a standard MIDI file. The MIDI file includes all the knob control change
  information along with the notes played. Use sonoma audiocopy or intua audio
  sharing to paste recorded audio directly into other apps. Arctic keys allows
  saving and emailing of the patches, and sharing with Wi-fi and itunes file
  sharing.
specs: |-
  - Dual-oscillator subtractive synthesis
  - Two low frequency oscillators (lfos) with three modulation destinations each
  - Lfo free running or synced to tempo
  - Modulation matrix routing
  - 16 x 4 analog-style gated step-sequencer
  - Classic arpeggiator
  - Four tracks with assignable modulation destination and loop point
  - Pitch and mod wheels
  - Velocity adjustment via key tapping
  - Mono key mode
  - Keyboard size adjustment and octave scrolling
  - Pitch mode with multi-touch gestures
  - Aftertouch support
  - Live phrase recorder
  - 44.1khz 16-bit wav file recording
  - Standard MIDI file support
  - Sonoma audiocopy support
  - Intua audio sharing support
  - Patch saving and emailing
  - Wi-fi and itunes file sharing
  - Alias-free analog modelling oscillators
  - Effects processors including eq, distortion, chorus, and stereo delay
  - Multi-touch performance oriented keyboard with pitch bend
  - Real-time phrase recorder with audio, MIDI, and patch file sharing
  - Coremidi support with virtual MIDI ports
  - Ios platform
  - Ipad compatible
