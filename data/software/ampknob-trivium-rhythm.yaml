details: >-
  This rhythm guitar monster offers a broad range of terrific tones and yet
  maintains a straightforward interface. The amp has been crafted with matt and
  corey's ultra-precise riffing in mind and provides an extremely tight low end
  that never muddies up those fast chugs.


  A versatile beast: green boost gives you a sparkly clean tone that can be
  pushed into a wonderful edge-of-breakup sound. This mode also features a
  beautiful, lush reverb. Orange boost starts at crunch but can deliver a unique
  flavor of huge distortion with the gain turned up. Red boost breathes fire,
  with an uncompromising high-octane tone with a ton of clarity for ultra-fast
  picking.


  The rhythm amp comes with two, perfectly matched cabinets captured at
  fascination street studios: modern, and vintage.


  With ampknob, you can capture your ideas quickly and easily without even
  starting a DAW. The standalone version of ampknob includes a built-in
  recording functionality that makes it effortless to always stay creative.


  The standalone version of ampknob now comes with a built-in metronome for you
  to stay sharp at your guitar playing skills. Change meter, accent, or set
  automatic speed increments so you can focus on practicing without even taking
  your hands off the guitar. The excellent built-in tuner means you're always
  ready to jam.
