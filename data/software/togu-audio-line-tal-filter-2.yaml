description: TAL-Filter-2 is a host synced filter module with different filter types, panorama and volume modulation possibilities. This can be used for tremolo or trance gate effects.
details: |-
  TAL-Filter-2 is a host synced filter module with different filter types, panorama and volume modulation possibilities. This can be used for tremolo or trance gate effects.

  Panorama modulation maybe is useful to pan your percussion, hats or sound effects in the stereo room for more interesting rhythms and sounds.

  The plug-in is host synced, and its modulation sequence can run as a loop or be triggered instead: loop mode can be disabled so that a manual or MIDI trigger starts the sequence, and a MIDI NoteOn trigger fires on the start of the next 16th.

  The current download is version 3.1.2, offered as separate Windows, macOS and Linux packages in VST, VST3, AU, AAX and CLAP formats. Earlier 32-bit builds (Windows VST, macOS VST and Audio Unit) are still listed under old downloads.

  Requirements are Windows 7 or higher (64 bit host), macOS 10.9 or higher (64 bit host) as a Universal Binary 2 with native Intel and Apple silicon support (M1, M2, M3 and later), Pro Tools 10.3.6 or higher (64 bit) for AAX, and 64 bit Linux on Ubuntu 18 or similar. TAL lists TAL-Filter-2 under the FREE Plug-Ins heading on its products page.
specs: |-
  - Host synced filter module
  - Different filter types
  - Panorama modulation
  - Volume modulation
  - Usable for tremolo or trance gate effects
  - Loop mode can be disabled, with a manual or MIDI trigger starting the sequence
  - MIDI NoteOn trigger (triggers when the next 16th starts)
  - Windows: Windows 7 or higher (64 bit host)
  - macOS: 10.9 or higher (64 bit host), Universal Binary 2 with native Intel and Apple silicon support (M1, M2, M3...)
  - AAX: Pro Tools 10.3.6 or higher (64 bit)
  - Linux: 64 bit / Ubuntu 18 or similar
