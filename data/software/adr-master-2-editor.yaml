details: |-
  Designed specifically for pro tools based dialogue/adr editors & supervisors, and incorporating all the features of video sync pro, adr master 2 editor adds vital adr cueing tools. Create, trim, split or merge adr cues directly in adr master - with added rich text & reason support; or capture & modify them from pro tools timeline selections.

  Adr master offers many ways to create or edit adr cue events. Create them quickly & directly in adr master with a single button press, import them all or one-by-one from a shooting script, from a text file stored in one of the supported formats (csv, adr studio xml, pro tools session info text file, etc) or grab & fine-tune them directly from a timeline selection in pro tools.

  Take advantage of the new rich text formatting support throughout adr master to add advanced text functionality such as bold, underline, italic, strikethrough & text color. Word and excel files can be imported without the cues losing their text formatting. Files exported as PDF or excel files will also preserve the text formatting information.

  When you're done logging your adr cues, you can either print cue sheets in a variety of different templates, or export them as a csv file or PDF. Alternatively, you can send the cues back to pro tools as region groups - either one at a time, or in larger batches. For productions & supervisors, there's also an adr overview sheet available showing the number of lines per character and the overall recording status.

  Adr master provides flexible overlays, enabling the superimposition of all types of visual cues over the picture - useful in a whole range of scenarios. From simple on/off overlays for timecode or feet and frames to timed overlays for streamers, markers, flutters, and adr cues. Timed overlays can be programmed directly within adr master, but also triggered directly from your DAW or other MIDI-compatible equipment such as a keyboard or trigger pads.
