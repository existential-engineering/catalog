description: Virtual Bassist ROYAL is your all-round high-end session bass professional, always primed to reliably and effortlessly underpin most styles of popular music with its rounded electric fingerstyle tones.
details: |-
  Virtual Bassist ROYAL starts with a hand-selected vintage electric bass, modified with the best electronics money can buy and played by a seasoned pro, integrated into a virtual instrument that adds realism, behavior and a player who knows his stuff, plus exactly the amps and effects that make a truly great sound.

  ROYAL plays well in any musical style, but particularly acoustic and electronic songs, bands and arrangements. From a super-soft round tone for ballads to enough edge and drive to support a good rock song, ROYAL provides a wide range of studio bass styles. It is perfect for pop, ready to rock, impressive on indie and smooth on singer/songwriter material.

  ROYAL is suitable for anyone who wants to create great sounding bass guitar tracks regardless of their skill level. The fail-proof controls ensure that beginners can quickly get end results that will never be musically or technically wrong, without sacrificing creative freedom, while seasoned bass players appreciate getting ideas down fast with practically zero learning curve.

  Player Mode gives instant access to 60 styles and 1380 phrases via simple MIDI key commands, automatically following the key and chord you play and intelligently selecting the most musical articulations. Instrument Mode lets you access the full span of the meticulously sampled bass guitar with a MIDI controller, including dead notes, full stops and slides. Sound shaping covers four sound characters, three amp settings tailored to Rock, Soul and Pop, 15 Finisher multi-effect modes, plus EQ and dynamics.
specs: |-
  - Hand-selected vintage electric bass guitar, fingered, with modified electronics
  - 60 styles and 1380 phrases
  - 20 new styles and 30 new presets in version 2
  - 15 Finisher multi-effect modes
  - Four sound characters
  - Three amp settings tailored to Rock, Soul and Pop
  - Artificially intelligent articulation modeling
  - Player Mode and Instrument Mode
  - DAW quantization and UI resizing
  - MIDI drag and drop
  - EQ and dynamics section
  - PreSonus chord and key track support in Studio One 4.6.2 or later (Virtual Bassist 2.1 update)
  - Operating systems: Windows 10 to Windows 11, macOS Catalina (10.15) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 4 GB of RAM
  - 7 GB of disk space
  - 1280x768px display, internet connection
  - Plug-in formats: AAX, AU 2, VST 2 and VST 3, 64-bit only
  - Automated installation via UJAM App, or downloadable installer file
  - Authorization via the UJAM App, or email and password within the plug-in
  - Supported standards: MIDI
