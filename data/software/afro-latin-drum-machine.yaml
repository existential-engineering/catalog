details: |-
  A complete groove library with all the afro latin rhythms you can imagine with the highest sound quality. Revised by the great cuban master percussionist yoel paez.

  Very easy to use, allows you to edit or create your own rhythms. The v2.0 update with song mode, jamming tool, fills and randomizers brings afrolatin drum machine into a new level.

  Audiobus and inter-app compatible! Stream live audio directly to other audiobus-compatible apps.

  Now you can play instantly authentic latin rhythms like son, guaguanco, columbia, bembe, chacha, mambo, merengue, bachata, and 100 more.

  Combine lots of amazing acoustic percussion sounds: congas, bongos, shekeres, shakers, claves, blocks, maracas, cowbells...
