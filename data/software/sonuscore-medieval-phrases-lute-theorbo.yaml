description: A phrase library featuring medieval-inspired plucked instruments that brings you into a world of classic imagination, booming with bards and taverns, questing knights, and roving robber barons. Includes 10 lute and 5 theorbo themes with live-recorded phrases performed by Hungarian luthier Attila Völgyi, syncing to DAW tempo in Natural Minor and Dorian modes.
details: |-
  Medieval Phrases Lute & Theorbo is Sonuscore's first phrase library built around plucked instruments, aimed at a world of bards and taverns, questing knights and roving robber barons. The page sets it in the late Middle Ages and Renaissance, when courts and taverns looked back to the ancients for inspiration and the lute and theorbo took centre stage, and pitches the pairing of the lute's light, heavenly plucks against the theorbo's deep voice as suited to period pieces, experimental music and ambient writing alike.

  The performances are by Attila Völgyi, born in 1974, who studied cello, piano and guitar from an early age before adding classical guitar, organ and jazz guitar, graduating from the Franz-Franzens Music School with distinction in 1997. He took up the lute in 2007 under the lutist István Győri, and now teaches at the Béla Bartók Music School in Szombathely, Hungary, where he is also a member of the early music ensemble Capella Savaria. His recording credits include the Age of Empires IV and The Elder Scrolls Online soundtracks.

  The library carries 10 lute and 5 theorbo themes, all recorded in the darker Natural Minor and Dorian modes common to the period. The material includes plucks with 3 round robins, tremolos and a variety of trills mostly captured with 2 round robins, and its rhythmic focus is meant to fit a wider range of projects than simple lyrical phrases. Phrases sync to the DAW's tempo, the lute can be played in arpeggios and chords, and both instruments are also freely playable on their own so melodies can be written to link the phrases together.

  The interface follows the series pattern: a main page for choosing phrases with a tempo-synced view, dedicated lute and theorbo instrument pages, and an FX page with a 4-band EQ, delay and reverb. It runs in the full version of Native Instruments KONTAKT or in Steinberg's free HALion Sonic.
specs: |-
  - 10 lute and 5 theorbo themes
  - Phrases recorded in Natural Minor and Dorian modes
  - Plucks with 3 round robins, plus tremolos and a variety of trills mostly with 2 round robins
  - Syncs to the DAW's tempo
  - Fully playable rhythmic phrases
  - Lute playable in arps and chords
  - Lute and theorbo also playable freely as single instruments
  - Main page, tempo-synced main page, Lute and Theorbo instrument pages and FX page
  - FX page with 4-band EQ, delay and reverb
  - Performed by Attila Völgyi
  - Requires the FULL version of Native Instruments' KONTAKT 6.7.1 or higher, or Steinberg's free HALion Sonic
  - The free Kontakt Player is not sufficient: it only runs the instrument in DEMO mode
  - HALion Sonic is currently not compatible with Notion by PreSonus
  - macOS 10.14 or higher, Intel Core i5
  - Windows 7 or higher, Intel Core i5
  - 4 GB RAM
  - At least 2.5 GB of free hard disc space
