details: >-
  Apu loudness meter is a free loudness analysis plug-in supporting a variety of
  loudness types and metering modes with clean adjustable visuals.


  You can monitor in real-time using live history and histogram views, or
  analyze an entire file to view the overall statistics and histograms.


  Multi-channel: supports stereo, surround, and dolby atmos formats.


  Channel modes: split or link channels for flexible metering.


  Visualizations: live histogram and time-history views with configurable
  history lengths.
specs: |-
  - Vst3 plugin
  - Audio units plugin
  - AAX plugin
  - Standalone application
  - Lufs (momentary, short-term, integrated)
  - Rms
  - Peak
  - True peak
  - Stereo support
  - Surround support
  - Dolby atmos formats
  - Split channel mode
  - Link channel mode
  - Live histogram
  - Time-history views
  - Configurable history lengths
  - Min/peak/average statistics
  - Lra statistics
  - Integrated lufs statistics
