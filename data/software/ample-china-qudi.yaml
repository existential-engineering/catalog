details: |-
  Ample china qudi (acqd) is built on the latest development of the woodwind sample engine, with 4.4 gb samples, including head and body articulations, fx sounds, as well as a select collection of improvised licks. The artist: xiaokui ding (the principal woodwind player of the china national traditional orchestra. Member of the golden buddha jazz orchestra with zhongruan master mantian feng, jazz pianist hongwei kong.). The instrument: elegant wind series d key qudi (jianhong wang masterbuilt).

  Sampling: record with 5 mics (front, middle, back, stereo ambient). Each mic volume is adjustable and equipped with channel eq. 2 mic modes: modern and traditional, capable of colorful sound designs. There are 3 kinds of articulations in elegant wind head group (blue keyswitches), body group (yellow keyswithces) and special effect group (red keyswitches). Each group occupies one octave.

  The dizi has great dynamic range and timbre variation. The sample library provides 5 velocity layers, with sound from mildly soft to bright and strong. There are 4 velocity layers for expression articulation, 2 velocity layers for vibrato articulation, and real samples of trill sounds. Together with sahds virtual modulation system, they can create vivid and realistic notes.

  New original features: intelligent legato system the auto legato system detects the duration of each note. For legatos whose duration is less than this value, only the straight legato will be triggered to ensure that no unwanted grace notes during fast performance. When note duration is longer than legato time: velocity126-127triggers layering legato (ascending) and ripple legato(descending) velocity96-125triggers grace legato velocity32-96triggers straight legato velocity16-31triggers soft legato 1 velocity1-15triggers soft legato 2 in slide legato mode, low velocity triggers slide notes.

  Fx: high order 8-band eq, intuitive control of frequency response, real-time visualization of input and output spectrum, support of soloing single band. 2-line compressor, real-time visualization of input and output signal, two detection modes rms & peak, support of soft knee, auto release and auto makeup. 6-tap echo, real-time visualization of the processing of stereo signal, can tweak the parameters of 6 echo points individually: feedback, pan, volume etc. Ir reverb, providing four types of ir: room, studio, hall, and larger hall.
