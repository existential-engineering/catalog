description: Discover a versatile equalizer plugin for mixing, mastering and sound design, with spectrum control and analog color.
details: |-
  TotalEQ MK2 is a visual equalizer plugin built around a real-time spectrum analyzer, so problem frequencies can be spotted rather than swept for. Bands are created by double-clicking anywhere on the spectrum, then dragged to set frequency and gain and scrolled to shape the Q factor, with high-contrast EQ curves and a dynamic response overlay showing what each move is doing.

  An AUTO mode runs dual-engine analysis over the material. The HarmoniQ engine identifies and removes resonances, harshness and frequency inconsistencies, while the BalancEQ engine adjusts overall tonal tilt and applies a clean high-pass filter, giving a corrective starting point that can then be fine-tuned by hand.

  The equalizer offers up to 36 fully independent bands with 15 filter types (high pass, low pass, shelves, bell, notch, bandpass, tilt and others), a Q range of 0.1 to 10 and slopes of 6, 12, 18, 24 and 48 dB/oct. Each band can be soloed or muted and routed in stereo, mid, side or external mode.

  Every band carries optional analog-style response emulation and saturation with an independent amount control from 1 to 10, alongside global analog and saturation switches, so harmonic colour can be added at specific frequencies without a separate saturation plugin. Output is automatically compensated against input level and monitored for constant loudness using short-term LUFS.

  Any band can switch from static to dynamic operation, turning it into a frequency-specific compressor or expander with automatic adaptive behaviour or manual threshold, attack and release controls, plus external sidechain support. The GUI is fully resizable and hardware-accelerated with light, dark and automatic themes.
specs: |-
  - Real-time spectrum analyzer
  - EQ response curve display
  - Up to 36 fully independent EQ bands
  - 15 filter types per band (high pass, low pass, shelves, bell, notch, etc.)
  - Slopes from 6dB/oct to 48dB/oct
  - Q range 0.1 to 10
  - Each band can operate in static or dynamic mode
  - Automatic or manual dynamic controls (threshold, attack, release)
  - External sidechain support for dynamic EQ bands
  - Per-band analog response emulation
  - Per-band analog saturation with amount control (1-10)
  - Solo and mute for each band
  - Stereo / Mid / Side / External routing per band
  - Global analog emulation switch
  - Global saturation switch and intensity control
  - Automatic output compensation linked to input level
  - Constant loudness EQ monitoring (LUFS short term)
  - Automatic EQ using HarmoniQ + BalancEQ algorithms
  - Double-click to create/delete bands directly on the spectrum
  - Multi-band selection and group editing
  - Shift/Alt modifiers for constrained editing
  - Fully resizable, hardware-accelerated GUI
  - Light, dark or automatic theme options
  - Adjustable analyzer slope (default: 4.5dB/oct)
  - Analyzer dynamic range from -120dB to -24dB
  - Apple Silicon native support
  - macOS 10.13+ and Windows 10+ compatible
  - Available as 64-bit Audio Units, VST3, and AAX plugins
  - No copy protection
