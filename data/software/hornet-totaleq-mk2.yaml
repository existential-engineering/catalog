description: Discover a versatile equalizer plugin for mixing, mastering and sound design, with spectrum control and analog color.
details: |-
  TotalEQ MK2 combines surgical precision with intelligent automation and instant visual feedback, so frequency problems can be identified and fixed in seconds rather than minutes. A real-time FFT spectrum analyzer updates as you listen, bands are created by double-clicking anywhere on the spectrum, and high contrast EQ curves with a dynamic response overlay show what is happening. Frequency and gain are dragged, Q factor is shaped by scrolling.

  Auto EQ uses two engines. HarmoniQ identifies and removes resonances, harshness and frequency inconsistencies automatically, while BalancEQ adjusts overall tonal tilt and adds a clean high-pass filter for balanced results.

  The plugin offers up to 36 independent bands with 15 filter types and slopes from 6 to 48 dB/oct, covering everything from broad tonal shaping to surgical notching for vocals, drums, guitars, synths and mastering chains.

  Every band includes optional analog-style saturation with an independent amount control from 1 to 10, adding body, presence or harmonic richness where the mix needs it, alongside a global analog emulation switch and a global saturation switch.

  A dynamic mode turns any band into a frequency-specific compressor or expander, with automatic adaptive behaviour or manual threshold, attack and release, and external sidechain support. This handles sibilance control, dynamic mastering EQ and adaptive mix bus processing.
specs: |-
  - Real-time spectrum analyzer and EQ response curve display
  - Up to 36 fully independent EQ bands
  - 15 filter types per band (high pass, low pass, shelves, bell, notch and more)
  - Slopes from 6dB/oct to 48dB/oct, Q range 0.1 to 10
  - Each band can operate in static or dynamic mode
  - Automatic or manual dynamic controls (threshold, attack, release)
  - External sidechain support for dynamic EQ bands
  - Per-band analog response emulation
  - Per-band analog saturation with amount control (1 to 10)
  - Solo and mute for each band
  - Stereo / Mid / Side / External routing per band
  - Global analog emulation switch
  - Global saturation switch and intensity control
  - Automatic output compensation linked to input level
  - Constant loudness EQ monitoring (LUFS short term)
  - Automatic EQ using HarmoniQ and BalancEQ algorithms
  - Double-click to create or delete bands directly on the spectrum
  - Multi-band selection and group editing
  - Shift/Alt modifiers for constrained editing
  - Fully resizable, hardware-accelerated GUI
  - Light, dark or automatic theme options
  - Adjustable analyzer slope (default 4.5dB/oct) and dynamic range from -120dB to -24dB
  - Apple Silicon native support
  - macOS 10.13+ and Windows 10+ compatible
  - Available as 64-bit Audio Units, VST3 and AAX plugins
  - No copy protection
