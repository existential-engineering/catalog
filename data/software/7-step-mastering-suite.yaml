details: |-
  Noiz-lab's 7-step mastering suite is a virtual effect audio plugin for macos and windows. It functions as a VST plugin, an audio units plugin and a VST 3 plugin.

  Learning how to master your music is difficult, especially if you have to overcome the challenges of working in a home studio. The 7-step mastering suite provides you with 7 easy-to-use plug-ins, and a 7-step quick-start manual. By following this method you will be able to master your first song in one or two hours after installing the mastering suite.

  Most mastering plug-ins look intimidating at first glance, with an abundance of knobs and meters, often lacking any context. The 7-step mastering suite keeps plug-ins simple and intuitive without compromising their functionality, serving as both a plug-in bundle and a learning tool.

  The 7-step mastering suite is a complete workflow for mastering your music at home. It provides a complete method consisting of 7 easy-to-use plug-ins and a 7-step quick-start manual, developed as a basic workflow you can expand on or change to your liking after you gain experience.

  The plug-ins are specifically tailored for home studio users, designed to add warmth and transparency, stabilize and enhance the stereo image, and increase impact and loudness while preserving the transients. The suite helps overcome problems that are found in many home studios.
