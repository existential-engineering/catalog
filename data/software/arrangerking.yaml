details: |-
  ArrangerKing is a plugin to arrange music that helps finish tracks by making
  it easy to turn an '8 bar idea' into a complete arrangement with just a few
  clicks, eliminating the need to move parts around in the editor.

  With arrangerking you can have a clear graphic overview of your entire track.
  You can do non-destructive editing where one click changes all your choruses,
  without zooming in and out or scrolling left and right.

  Arrangerking offers a unique option to share arrangements with friends as easy
  as sharing a link. You can share an arrangement you ripped, as a comment to a
  video. Or import an arrangement from a comment, then apply it to your own
  track.

  Arrangerking is a plugin that helps you finish your tracks, integrating
  seamlessly into all major daws on both pc and mac.

  If you dislike the arrangement view, get arrangerking. It really keeps
  everything neat and organised if you prefer working in clip launch view. It
  makes tweaking your arrangement of elements a breeze.
specs: |-
  - macOS support
  - Windows support
  - Non-destructive editing
  - Graphic arrangement overview
  - Arrangement sharing via link
  - Universal 2 binary
