description: Ableton instrument racks for ujam virtual guitarist iron VST
  contains the entire iron preset integration pack for ableton push.
details: |-
  Ableton instrument racks for ujam virtual guitarist iron VST contains the entire iron library mapped for ease of browsing, loading on ableton push with each preset of the virtual guitarist iron library saved as individual ableton drum racks.

  As a result of this configuration, every pad is color coded to replicate the color scheme of the nks library on komplete control keyboards.

  Your ableton push now plays like a komplete kontrol!

  All ujam virtual guitarist iron presets mapped to ableton drum racks for load and performance on ableton push.

  Easily extend to your own iron presets by saving as additional ableton drum racks.
specs: |-
  - Ableton drum racks
  - Ableton push integration
  - Nks library color coding
  - Komplete kontrol keyboard compatibility
  - Ujam virtual guitarist iron library mapping
  - Preset integration for ableton live
