description: Fold is a versatile wavefolder plugin designed for both subtle and
  extreme dynamic saturation. Inspired by the legendary Serge Wave Multipliers.
details: |-
  Things - Fold is a versatile wavefolder plugin designed for both subtle and extreme dynamic saturation. Inspired by the legendary Serge Wave Multipliers, known for their classic diode-based circuit design, Fold combines wavefolding with an envelope follower, low-pass and high-pass filters, and adjustable feedback. This combination allows for a wide range of creative sound design possibilities, from gentle harmonics to crunchy distorted sounds.

  Wavefolding is a type of waveshaping where the signal is folded back on itself. Instead of clipping the signal, wavefolding inverts the waveform, creating a series of peaks and valleys. It can be highly effective for adding complex harmonics to basic waveforms. Depending on the settings, wavefolding can also be used for mild saturation to subtly color a signal or pushed to extremes for intense, aggressive distortion.

  Fold was made in collaboration with Luca Minelli and his community, Synth Cafe, an Italian group dedicated to the world of synthesizers founded in 2011.

  Things - Fold is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP). It is also available on the App Store for iOS and iPadOS (AUv3 and Standalone), for iPhone and iPad.

  A demo version is available with some limitations: silence for 3 seconds every 45 seconds, and saving disabled. If you like it, you can purchase a license and then authorize the demo version.
