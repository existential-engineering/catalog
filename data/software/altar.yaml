details: |-
  Altar is a free, open-source guitar amplifier with a feature-set you would only expect to find in a $200 product.

  Two amplifiers: altar comes with a glassy clean channel, and a modern high-gain channel for a wide variety of tones.

  Nam support: load your existing nam (neural amp modeler) files by switching to altar's third amp channel.

  Modular dsp: drag the amp, cab and fx modules around to re-order them. Right click to bypass.

  Cab designer: create your own professional-sounding irs with an intuitive designer tool. Share your cabs with friends or even sell them.

  Pitch shifting: two-octave realtime pitch shifting with semitone-snapping and a sub-octave layer blend, all fully automatable.

  Fx suite: multiple overdrive modes, circuit-bending, reverb, forward, reverse and glitch delays, chorus and a ringmod.

  Mixing tools: mix faster with the low-frequency palm mute control (chug). Upper-mid pick attack expansion (pick), a pre-set whistle filter and built-in lofi effect.

  Pre & post process: process the di and final tone with industry-grade channel strips for the ultimate encapsulated tone.

  No stone unturned: up to 8x oversampling, built-in tuner, click, and an output limiter complete the package for your new amplifier.
