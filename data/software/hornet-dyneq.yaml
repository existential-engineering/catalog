description: HoRNet DynEQ is a dynamic equalizer that only apply the eq curve if the level is above the set threshold, which can also be automatically set
details: |-
  HoRNet DynEq is a dynamic equalizer plugin designed to make equalization adjustments based on the intensity of the input signal. Unlike traditional EQs that apply a static filter across the entire track, a dynamic EQ adjusts in real-time, modifying the frequency response only when the signal exceeds a set threshold. This ability to dynamically alter the EQ’s response makes it an essential tool for dealing with specific frequency issues that may arise in a track, such as excessive resonance, without negatively affecting the overall sound.

  In most audio production situations, certain frequencies in a track can become problematic when they are too prominent, especially when dealing with instruments like bass guitars, kick drums, or vocals. These elements can sometimes cause particular frequencies to ring out louder than others, creating an imbalance that may need to be corrected. Traditional EQs, while effective, can sometimes cut too much of a frequency range, leaving the sound feeling unnatural. This is where a dynamic equalizer like HoRNet DynEq stands out. It offers a solution to address frequency imbalances in a way that retains the integrity of the overall sound.

  The key to understanding dynamic equalization lies in its responsiveness. Traditional EQs apply a fixed filter across a frequency range, but dynamic EQs, like HoRNet DynEq, engage only when the signal reaches a particular level or threshold. This means that if the frequency in question isn’t overly prominent at any given time, the EQ won’t affect it. When the resonance or problematic frequency becomes too pronounced, the dynamic EQ kicks in, reducing or boosting the level based on the intensity of the signal.

  This form of EQ is especially useful when working with instruments that have a tendency to resonate, such as bass guitar strings or certain vocal frequencies. Often, standard EQ adjustments might either remove too much of the frequency spectrum or leave the issue unresolved. A dynamic EQ, however, ensures that the frequency is only affected when necessary, providing a much more transparent and musical solution.
specs: |-
  - One equalizer band with: Frequency, Gain and Q
  - Full band frequency from 20 to 20000 Hz
  - Gain adjustable from -15 to +15 dB
  - Q adjustable from 0.1 to 8
  - Processing speed from 50 to 1500ms
  - Adjustable threshold from 0 to -48dB
  - Automatic speed linked to host tempo
  - Automatic relative threshold
  - Eq listen button
  - Input and sidechain level display
  - Automatic oversampling to guarantee optimal performance
  - Apple Silicon native support
  - macOS (10.13 and later) and Windows (Vista and later) support
  - 64bit only both on Mac and Windows
  - Audio Units, VST, VST3 and AAX format
  - No copy protection
