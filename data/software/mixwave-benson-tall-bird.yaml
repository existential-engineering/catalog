description: A software emulation of an all-tube spring reverb unit, producing
  tones from polite and clean to euphonic and cavernous reverb by overdriving
  the reverb tank. Modeling two separate reverb tanks allows reverb to be
  applied in stereo.
details: |-
  A unique and versatile all-tube spring reverb unit. Producing lush, sonorous tones ranging from polite and clean, to a euphonic and cavernous reverb by overdriving the reverb tank. Accuretly modeled by using proprietary convolution response techniques to closely match what how the spring tank responds to signal, specifically in regards to the clipping and distortion characteristics of the original unit. By modeling two separate reverb tanks, we were able to create a versatile tool for mixing by allowing reverb to be applied in stereo. We present, MixWave: Benson Tall Bird .
