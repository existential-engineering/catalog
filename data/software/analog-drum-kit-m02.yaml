details: |-
  "analog drum kit generator" (model 2) is a vintage inspired drum module
  plugin! It contains 10 kick sounds, 5 snare sounds, 5 CLAP sounds, 4 hi hats
  along with additional backing kick, backing hi hat & CLAP reverb sound
  generators.

  This plugin comes with 24 sounds in total. Each sound is multi sampled and
  played back in a random round robin mode, which means: each time a sound is
  triggered, it will sound just slightly different. This increases the overall
  analog feel a lot. The sound samples are programmed and recorded from an
  analog hardware drum synthesizer.

  A "clap reverb" one shot sound generator can be added to the clap sounds
  simply by dialing in the "cp room" gain knob. A "closed hi hat backing" one
  shot sound generator can be added to the hi hat sounds simply by dialing in
  the "ch bck" gain knob. This will add an acoustic sound to the closed hi hat
  sounds. A "kick backing" one shot sound generator can be added to the kick
  sounds simply by dialing in the "bd bck" gain knob. This will add an acoustic
  sound to the kick sounds.

  There are 24 fixed pads, which can be triggered by a mouse, MIDI keyboard etc.
  Each pad will lighten up in red when triggered.

  There are 4 faders available to change volume for each sound group (kick drum,
  snare/clap, closed hi hat & open hi hat). The faders do not apply for the clap
  reverb, closed hh backing & kick backing generators. The red "gain" knob is
  available for controlling the overall output gain.
specs: |-
  - 10 kick sounds
  - 5 snare sounds
  - 5 CLAP sounds
  - 4 hi hats
  - 24 sounds total
  - Multi-sampled sounds
  - Random round robin playback mode
  - CLAP reverb sound generator
  - Closed hi hat backing sound generator
  - Kick backing sound generator
  - 24 fixed pads
  - MIDI keyboard compatible
  - 4 faders for volume control
  - Overall output gain control
  - macOS compatible
