description: A software synthesizer built around analog-style instability, with five oscillator modules and three sliders that introduce drift, saturation and tuning inconsistency. Includes filters, dual envelopes, LFOs, an arpeggiator and hundreds of factory presets.
details: |-
  ImPerfect is a software synthesizer built around deliberate analog-style imperfection. Where most digital synths aim for pristine quality and precisely tuned tones, it uses wavering detuned oscillators and modulating effects to put instability back into synth programming.

  The architecture follows a familiar soft synth layout of five oscillators, envelopes, filters, LFOs and an arpeggiator. Oscillators 1 and 2 can each be morphed between four waveforms, joined by a sampled waveform oscillator, a sub oscillator and a noise profile. Ring modulation and frequency modulation can be dialled in, along with octave, detune and pulse width settings. Oscillator 3 loads any of 260 preset waveforms, or a user supplied WAV file.

  Three modulation sliders named Wacky, Cracky and Shaky set the amount of analog-style processing. Wacky raises the level of three effects (phaser, chorus and delay) to push the tone into drifting and delayed space. Cracky increases saturation to introduce harmonics. Shaky modulates tuning, from subtle detune at low settings through to full pitch modulation.

  Almost any parameter can be assigned to the two X/Y pads, which cover four parameters in total and can be automated or played live. Three performance modes shift the assigned timbres automatically. A central scope displays the waveform being created alongside left and right channel output meters.

  Arp mode provides automatic arpeggiation across up to four octaves, with rate synced to host tempo at a range of note intervals or free running, and a latch selector. Global controls cover tuning, glide timing and mono or poly modes up to 16 voices. An onboard preset browser allows sounds to be auditioned before loading, and user settings can be saved and recalled.
specs: |-
  - Five oscillator modules with ring and frequency modulation
  - Three transformation sliders: Wacky, Cracky and Shaky
  - 260 preset waveforms, plus loading of user WAV files
  - Dual X/Y modulation pads with three performance modes
  - Filter module, dual envelopes and two LFOs
  - Arpeggiator covering up to four octaves with host sync
  - Mono and poly modes up to 16 voices
  - Hundreds of factory presets with an onboard browser
  - Real-time waveform display with output metering
  - Resizable interface added in version 1.6
  - Windows 10 or 11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
