description: Eplex7 DSP bassthronn – dnb / dubstep / experimental bass
  synthesizer / re-synthesizer / re-generator.
details: |-
  Bassthronn is a new progressive bass generator/instrument that combines
  special wavetable re-generation (quasi re-synthesis) with custom wavedraw
  synthesis (you can draw your own waveform real-time) in combination with
  unique sound modulation and effecting possibilities.

  Bassthronn is designed to produce new skool bass sounds for drum and bass,
  dubstep, electro house, bass music & experimental genres.

  Bassthronn consists of two wavetable oscillators with bank of initial 64
  wavetables. Every wavetable oscillator 1/2 can be additionally re-generated
  with r.a.m. Glitch buffer re-generator to create original soundscapes.
  Additionally you can draw (real-time) your own waveform in oscillator 3 (ideal
  for sub-bass).

  At next stages you can modulate sound with: neurofunk modulation module
  (unique dnb style modulator), analog sound module (module that add fat sound
  to your bass, analog style warmth, drive, hf analog color) analog
  saturation/distortion module, sub octave deformer (creating one octave
  de-tuned copy of original synthesized sound), twist 67 fx to create real-time
  twisting of passing signal, unison simulator/modulator + analog & digital
  filter bank with 13 original filters and combinations.

  As a customer you will be receiving new and new wavetables when released, for
  free.
specs: |-
  - 2x wavetable oscillators with bank of initial 64 wavetables
  - R.a.m. Glitch buffer re-generator
  - Real-time wavedraw oscillator
  - Neurofunk modulation module
  - Analog sound module
  - Analog saturation/distortion module
  - Sub octave deformer
  - Twist 67 FX
  - Unison simulator/modulator
  - Analog & digital filter bank with 13 original filters and combinations
  - Hw dsp lowpass
  - Hw dsp bandpass
  - Hw dsp highpass
  - LFO modulation of filter
  - Amplitude envelope (attack, decay, sustain, release)
  - Preset manager with more than 90 presets
  - Virtual instrument audio plugin for Windows
