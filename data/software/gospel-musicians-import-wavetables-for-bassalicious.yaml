details: |-
  Unlock the amazing ability to load in single cycle wavetables. Turn BASSalicious 2 into your all-in-one wavetable synthesizer. Mix together your own custom wavetables with the amazing sounds and synthesis already built into Pure Synth Platinum, or search the internet for the hundreds of thousands of free single cycle wavetables already available. Remember BASSalicious is not just a rompler. It has very sophisticated PWM for wavetable phase distortion, as well as a JP-Sawlike detuning with different modes, voices, and spread options. So even if BASSalicious never had any samples, it would already be a very capable analog and wavetable synthesizer on its own.
