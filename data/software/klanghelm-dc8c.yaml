description: "Advanced, flexible compressor plugin designed for clean, smooth
  compression with minimal artifacts. Features four operational modes (Normal,
  Clean, Smash, Limit), zero-latency brick-wall limiting, selectable
  attack/release curves, side-chain filtering, two saturation models,
  feedback-mix topology morphing, parallel compression, up to 8x oversampling,
  and an Easy Mode with four preset compression styles."
details: |-
  Four operational modes: Normal, Clean, Smash, Limit
  Zero-latency brick-wall limiting
  Selectable attack/release curves and compression curves
  Side-chain filtering with high-pass, low-pass, and tilt controls
  Two saturation models with flexible signal chain placement
  GR-smoothing and hold controls
  Pre-attack control for transient shaping
  Feedback-Mix control for topology morphing between feedback/feedforward
  Parallel and peak/RMS compression modes
  External side-chain support
  Easy Mode with four preset compression styles
  Up to 8x oversampling
  VU and peak metering
  Automatic gain compensation (AGC)
  GUI resizing
  Comprehensive preset browser
specs: |-
  - windows: Windows 10 or higher (64-bit)
  - mac: macOS 10.13 or higher (Intel and Apple Silicon)
  - aaxRequirement: ProTools 11 or higher
