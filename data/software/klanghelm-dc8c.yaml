description: DC8C is a highly flexible compressor plugin whose general character is clear, smooth, open and distinct. It was designed for very clean compressor action without unwanted artifacts or distortion, with two optional saturation models when coloration is wanted.
details: |-
  DC8C is one of the most flexible compressors around. While making a lot of different compression styles possible, its general nature may be described as: clear, smooth, open, distinct.

  The main goal while designing DC8C was to get a very clean compressor action without unwanted and often almost inevitable artifacts/distortion. This way you can achieve almost invisible compression for your most demanding mastering sessions, when you want to avoid coloration. If you aim for color you can choose between two saturation models.

  From opto-style, peak compression, external side-chaining, RMS compression, Feedback and Feedforward compression (and everything in-between) to negative ratios, zero latency brick-wall limiting, from snappy transient treatment to smooth transient rounding, everything is possible.

  DC8C is available in the following formats, all included in a single license: Windows 10 or higher (64bit) as VST, VST3 and AAX Native for Pro Tools 11 or higher, and macOS 10.13 or higher as AU, VST, VST3 and AAX Native for Pro Tools 11 or higher.
specs: |-
  - Detector network and gain reduction smoothing for extra smooth operation
  - Choose between two different attack and two release curves
  - Four different operational modes: NORMAL, CLEAN (100% clean compression with no intermodulation, no distortion, no aliasing), SMASH (ultrafast compression characteristics, almost clipper territory), LIMIT (use DC8C as a zero latency limiter)
  - Optional soft-clipper at the output
  - Up to 8x oversampling
  - Side-chain filter with high pass and low pass filter plus tilt control, which lets you shift the frequency response of the detector
  - The saturation stage can be put freely into the signal chain: pre compression, post compression and side-chain only
  - Three different compression curves selectable
  - Customize the program dependency of the compressor separately for Attack and Release
  - GR-smoothing control to determine how sensitive the compressor reacts to changes in the computed gain reduction, great to emulate opto-style compression
  - Hold control, great for heavy pumping compression effects
  - Pre-attack control to delay the start of the attack to leave transients completely alone or radically shape the attack
  - VU and peak metering
  - Calibration control to set the reference level for the VU-meter and the saturation
  - Unique Feedback-Mix-Control, which lets you determine how much of the compressor's output is fed back into the detector, morphing between Feedback and Feedforward compression topologies
  - True zero attack (0.0 ms)
  - Negative ratios possible
  - Parallel compression, peak-compression, RMS-compression
  - External side-chain
  - Side-chain listen
  - Easy Mode which features 4 distinct compression styles
  - AGC (automatic gain compensation)
  - GUI resizing
  - Comprehensive preset-browser with lots of presets
  - Windows 10 or higher (64bit): VST, VST3, AAX Native for Pro Tools 11 or higher
  - macOS 10.13 or higher: AU, VST, VST3, AAX Native for Pro Tools 11 or higher
