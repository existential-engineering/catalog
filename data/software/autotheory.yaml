details: |-
  AutoTheory 4 takes industry standard MIDI effects and synchronizes them into
  the most expansive and easy to use composition software available. Our
  patented improvements upon traditional scale, arp, chord and sequencing
  effects provide users with unlimited possibilities for chord progressions,
  melodies, basslines and arpeggios.

  Unlike your DAW and plugins, autotheory's MIDI effects are synchronized via
  internal sequencer, meaning that all functions automatically work off of the
  same key/scale/chord progression. DAW integration is also streamlined with
  MIDI sync and a simple drag n drop export process.

  Autotheory is not a plug in. It functions outside of your DAW. It receives
  MIDI from your keyboard (or pad) controller, and sends 8 virtual MIDI
  controllers into your DAW. Within your DAW, you activate and assign them to
  instruments exactly as you would with regular MIDI controllers.

  Autotheory licenses can be assigned to two different locations through the
  ilok license manager. Users do not need to own an ilok2/3 dongle.

  Key features include chord generator with one finger chords from multiple
  groups with strum, repeat and velocity effects; smart scale to keep your hand
  in the same position while the scale transposes to each chord selection; multi
  arp to improvise through multiple one finger arpeggios of the current chord;
  chord editor to customize tones within each chord for unique voicings,
  inversions and extended chords; device outputs to control multiple instruments
  simultaneously from a single keyboard or qwerty; and sequencer to record
  multiple tracks & scenes before altering key and other parameters post
  recording.
