description: Acid Zone Retro, a freeware monophonic single oscillator
  synthesizer, is a synth that harkens back to the diy analog synths of the
  past.
details: |-
  Azr-01 is simple to program and has all the synthesis programming parameters
  available right on the front panel. Tweak a knob and you immediately begin to
  sculpt the sound.

  It comes with 32 presets to get you started.

  The sequencer included in azr-01 was derived from reviewing the many sequencer
  schematics available on the open flowstone/synthmaker community forum. We made
  our own proprietary modifications, but wish to thank all the developers for
  sharing their groundbreaking work.

  Highlights: 64 user presets. 32 custom presets. MIDI automation. Delay and
  reverb effects. VST 2.4.
specs: |-
  - Monophonic single oscillator synthesizer
  - VST 2.4
  - MIDI automation
  - Delay and reverb effects
  - Front panel synthesis programming parameters
  - Sequencer
