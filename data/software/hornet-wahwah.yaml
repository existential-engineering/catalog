description: The HoRNet WahWah emulates the typical sound of the guitar pedal from the 70s funky, we emulated also the specific distortion characteristic.
details: |-
  The HoRNet WahWah is a faithful digital recreation of one of the most iconic effects from the 1970s, made legendary by guitarists and keyboard players across decades. This classic pedal has long been associated with the signature sound of funk, and its unmistakable “wah” tone has become an essential part of every serious guitar player's setup. With HoRNet WahWah, that expressive, vocal-like filter sweep is brought directly into your digital audio workstation, combining analog warmth with digital flexibility.

  At the heart of the effect is a resonant band-pass filter, whose cutoff frequency is controlled by a virtual pedal. As the pedal moves, the filter sweeps through the frequency spectrum, creating that signature “wah” effect, a sound that mimics the human voice and instantly adds groove, rhythm and character to a performance. What sets the original apart, and what HoRNet has carefully replicated, is the non-linear nature of the circuit: the Q factor and filter gain both change depending on the pedal's position, especially as it reaches its extremes. The plugin's filter resonance is achieved through feedback in a discrete transistor amplifier, just like in the real hardware, and that feedback introduces a subtle and variable amount of distortion depending on the filter frequency.

  To expand the creative possibilities, HoRNet WahWah includes an envelope follower that lets you modulate the filter movement dynamically based on the signal's amplitude, turning a manual wah into a fully responsive auto-wah. Independent attack and release settings control how quickly the filter responds to incoming transients and how smoothly it returns to its base position. The modulation is relative to the pedal's current position, so static or automated positions can be combined with dynamic motion, and the modulation amount ranges from zero to full range.

  One of the most distinctive parts of the original analog wah pedals was the saturation created by their transistor-based amplifiers. HoRNet WahWah includes a modeled saturation stage that mirrors the behavior of the vintage circuit, and it can be disabled for a cleaner, more neutral wah useful on synths or drum loops. The interface is clean and intuitive, with controls for pedal position, envelope modulation and the saturation toggle, and all key parameters can be automated in the DAW or driven over MIDI.

  As with all HoRNet plugins, WahWah is light on CPU, making it suitable for multi-track projects or live performance setups. It runs on macOS 10.11 and later (with Apple Silicon native support except for AAX) and on Windows, 64-bit only on both. A fully functional demo is available: it silences the output every now and then, does not save parameter values with the session, and does not respond to automation coming from the host. The plugin ships with no copy protection.
