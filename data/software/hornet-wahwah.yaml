description: The HoRNet WahWah emulates the typical sound of the guitar pedal from the 70s funky, we emulated also the specific distortion characteristic.
details: |-
  HoRNet WahWah is a digital recreation of one of the most iconic effects from the 1970s, long associated with the signature sound of funk and used by guitarists and keyboard players across decades. It brings the expressive, vocal-like filter sweep of the pedal into the DAW.

  At the heart of the effect is a resonant band-pass filter whose cutoff frequency is controlled by a virtual pedal. As the pedal moves, the filter sweeps through the frequency spectrum. The plugin also replicates the non-linear nature of the original circuit: the Q factor and filter gain both change with the pedal's position, especially at its extremes, so pressing the pedal all the way down makes the resonance gentler and reduces the filter gain slightly.

  The filter resonance is achieved through feedback in a discrete transistor amplifier, as in the real hardware. That feedback introduces a subtle and variable amount of distortion depending on the filter frequency, contributing rich harmonic content that enhances presence and warmth. The model is based on the original circuit diagram.

  An envelope follower modulates the filter movement from the signal's amplitude, turning the plugin from a manual wah into a responsive auto-wah, with independent attack and release settings. The modulation is relative to the pedal's current position, so static or automated positions can be combined with dynamic motion, and the amount can be adjusted from zero to full range.

  The modelled saturation stage mirrors the behaviour of the vintage circuit and can be disabled for a cleaner, more neutral wah when working with synths or drum loops. All key parameters can be automated in the DAW, and the plugin supports MIDI control and MIDI learn.
specs: |-
  - Classic wah-wah effect emulation
  - Analog saturation, switchable
  - Auto wah with attack and release
  - Auto output compensation
  - MIDI controlled action
  - MIDI learn
  - macOS (10.11 and later) and Windows support
  - Apple Silicon native support (except for AAX)
  - 64-bit only on both Mac and Windows
  - Audio Units, VST3 and AAX format
  - No copy protection
