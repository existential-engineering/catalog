details: |-
  TGX-85 is the most exhaustively sampled virtual instrument library ever created from the legendary Yamaha SY85 and TG-500 synthesizers. If you're searching for Yamaha SY85 sounds , classic 90's ROMpler pads , or the signature warmth and texture of Yamaha's sample-based synth era, TGX-85 delivers the closest experience possible in a modern plugin format. With a 50 GB sample library, this instrument captures every voice, performance, and raw waveform from the original hardware.

  The SY85 was celebrated for its lush pads and layered textures—heard on countless recordings from the early 90's—and TGX-85 faithfully preserves that character. Every factory voice, performance, and raw waveform was carefully sampled to retain the richness and evolution of the original sounds, while modern playback and effects let you go beyond what the hardware could do.

