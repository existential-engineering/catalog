url: https://www.uaudio.com/products/uad-console-app
description: Free control and monitoring application for Apollo audio
  interfaces, with realtime UAD plug-in processing.
details: |-
  UAD Console sits between an Apollo interface and the host digital audio workstation, providing the realtime monitoring and routing layer for the hardware.

  It controls the Apollo's Unison mic preamps and routes up to 128 channels of input and output to the workstation in realtime, with flex routing per channel. UAD plug-ins run on the interface's onboard DSP, so effects chains can be monitored without host latency and either committed to the recording or used for monitoring alone.

  An onboard talkback microphone supports studio communication, and up to four cue buses can be built so performers hear their own mix. The application is supplied at no cost with Apollo hardware.
specs: |-
  - Control application for Apollo audio interfaces
  - Controls Unison mic preamps
  - Routes up to 128 channels of I/O in realtime
  - Flex routing per channel
  - Realtime UAD plug-in processing on interface DSP
  - Onboard talkback microphone support
  - Up to four cue buses
  - Auto-Gain, room correction and bass management
  - Available at no cost
