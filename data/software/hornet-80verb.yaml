description: Bring back the 80s sound with this vintage reverb and its lush algorithm that can be used to create rooms, halls and plates
details: |-
  HoRNet 80Verb recreates the lush and iconic reverberations of the 1980s. By employing faithful algorithms and emulating the AD/DA converter with adjustable sample rate and bit depth, it aims at the authentic character of classic digital reverb units while running inside a modern DAW.

  The plugin exposes all the classic reverb parameters the early digital units offered: pre-delay of up to 400 ms for the onset of reverberation, reverb length up to 10 seconds, a density control to adjust the amount of reflection diffusion, and an extensive filtering section with high pass and low pass filters both on the input and on the reverb reflections.

  Modern features sit alongside the vintage behaviour. Sample rate and bit depth are selectable to define the character of the AD/DA emulation, a quality control changes the character of the reverb, and up to 4x oversampling improves analog reconstruction accuracy. Together these let the plugin move from lush vintage reverbs to pristine, modern textures.

  Every parameter is reachable directly through intuitive sliders and buttons rather than nested menus. The user interface is vector-based so it stays sharp at every resolution, and both light and dark UI modes are supported.

  An internal preset manager saves and recalls settings, and the plugin ships with a set of ready-to-use presets that can be loaded and tweaked. Dry/wet and bypass controls round out the signal path.
specs: |-
  - Vintage inspired reverb algorithm
  - Sample rate and bit depth selectable for AD/DA emulation
  - Quality control that changes the character of the reverb
  - High pass and low pass input filters
  - Pre-delay up to 400ms
  - Reverb length up to 10 seconds
  - Density control to adjust the amount of reflection diffusion
  - High pass and low pass filters for the reverb reflections
  - Dry/wet and bypass controls
  - Up to 4x oversampling
  - Light and Dark mode UI supported
  - Vector user interface which is sharp on every resolution
  - Apple Silicon native support
  - macOS (10.13 and later) and Windows (Windows 10 and later) support
  - 64-bit on Mac and Windows
  - Audio Units, VST, VST3 and AAX format
  - No copy protection
