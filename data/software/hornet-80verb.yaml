description: Bring back the 80s sound with this vintage reverb and its lush algorithm that can be used to create rooms, halls and plates
details: |-
  Get ready to embark on a sonic journey through time with the HoRNet 80Verb, your passport to the lush and iconic reverberations of the '80s. In this digital era, HoRNet meticulously recreated the magic of classic digital reverb effects, so you can infuse your music with that unmistakable vintage vibe. Whether you're a producer, musician, or sound designer, this plugin offers a blend of nostalgia and innovation to transform your sound.

  80Verb is more than just a reverb plugin, it is a time machine for your sound. By employing faithful algorithms and emulating the AD/DA converter with adjustable sample rate and bit depth, it delivers the authentic essence of classic digital reverbs, unlocking lush, atmospheric reverberation that defined an entire era of music.

  You have the freedom to experiment with all the classic reverb parameters that graced the early digital reverb units. Set the pre-delay for the perfect onset of reverberation, shape the reverb's length according to your vision, and use an extensive filtering section to sculpt the reverb's tail exactly as you desire, from spacious ambience to subtle, nuanced echoes.

  Modern features take the concept further. Choose your sample rate and bit depth to define your unique sound, shape the incoming audio signal with input filters, and enhance analog reconstruction accuracy with oversampling. You can refine the reverb quality and adjust the density, making 80Verb capable of everything from lush, vintage reverbs to pristine, modern textures.

  Every parameter is available through intuitive sliders and buttons on a user-friendly interface, with no hidden menus to navigate. An internal preset manager saves your favourite settings, and a collection of ready-to-use presets offers a head start when you need a classic 80s reverb sound in seconds.
specs: |-
  - Vintage inspired reverb algorithm
  - Sample rate and bit depth selectable for AD/DA emulation
  - Quality control that changes the character of the reverb
  - High pass and low pass input filters
  - Pre-delay up to 400ms
  - Reverb length up to 10 seconds
  - Density control to adjust the amount of reflection diffusion
  - High pass and low pass filters for the reverb reflections
  - Dry/wet and bypass controls
  - Up to 4x oversampling
  - Light and Dark mode UI supported
  - Vector user interface which is sharp on every resolution
  - Apple Silicon native support
  - macOS (10.13 and later) and Windows (Windows 10 and later) support
  - 64-bit on Mac and Windows
  - Audio Units, VST3 and AAX format
  - No copy protection
  - Internal preset manager with ready-to-use presets
