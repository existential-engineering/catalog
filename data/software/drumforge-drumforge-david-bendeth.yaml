description: A virtual drum instrument plugin capturing the drum sounds of producer David Bendeth, built on an all-new Drumforge sampler. It combines rare and never-before-sampled kits recorded through a Focusrite console with up to 9 velocity layers and 12 round robins per kit piece.
details: |-
  Drumforge David Bendeth is a virtual drum instrument built around authentic captures of David Bendeth's drum sounds, delivered on an all-new Drumforge sampler engine. Bendeth's production credits span nearly five decades, from late-nineties radio rock through the 2000s emo and post-hardcore era to modern metalcore, and Drumforge cites over 80 million records sold and 125 platinum records.

  The library is presented as a preservation project as much as a sample pack. It includes snares dating back to the 1920s, drums with fewer than fifty units ever made, Hal Blaine's actual kit, and custom snares supplied by Lenny White for sampling, alongside flagship kits in mint condition from several generations of manufacturing.

  Signal chain and outboard are a stated part of the capture. Bendeth's own ADR Compex compressor, SPX90, Lexicon 480L and PCM70, and EMT 140 reverbs are represented, together with Pultec EQs with original transformers, GML processing, and vintage LA-2A and LA-3A compressors. Microphones include vintage Neumann tubes, Telefunken 47s, AEA ribbons, and RCA 77s, and every signal in the library passed through a Focusrite console.

  Playback realism is handled with up to 9 velocity layers and 12 round robins per kit piece, so velocity changes produce tonal shifts rather than level changes alone. The engineering team included Rick Carson and Ryan Harvey of Make Believe Studio, Mike Farretti, drum tech John Colangelo, and drummer Steve Zywicka.

  The interface is divided into pages. The Mix page follows a classic console workflow with a true bleed system and hardware reverb channels sourced from Bendeth's own units. The Map page carries a redesigned e-kit implementation and map conversion presets for other samplers, and the Song page provides a block-based groove builder with advanced groove manipulation.
specs: |-
  - Virtual instrument plugin with an all-new Drumforge sampler
  - Detailed sample library with never-before-sampled drums
  - 9 kick options, 25 snares, and 23 tom options
  - Up to 9 velocity layers and 12 round robins per kit piece
  - Vintage outboard captured in the chain: ADR Compex, SPX90, Lexicon 480L and PCM70, EMT 140, Pultec EQs, GML, LA-2A and LA-3A
  - Microphone collection includes vintage Neumann tubes, Telefunken 47s, AEA ribbons, and RCA 77s
  - Recorded through a Focusrite console
  - Mix page with true bleed system and hardware reverb channels
  - Map page with e-kit implementation and conversion presets for other samplers
  - Song page with block-based groove construction
  - Native Apple Silicon support
  - 45 GB free drive space required
  - 8 GB RAM minimum, 16 GB recommended
