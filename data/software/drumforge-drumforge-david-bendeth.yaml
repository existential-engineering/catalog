description: "A virtual drum instrument plugin built around authentic captures of David Bendeth’s iconic drum sounds, recorded through a vintage Focusrite console with velocity layers and round robins per kit piece."
details: |-
  Drumforge David Bendeth is a virtual instrument plugin built around authentic captures of David Bendeth's iconic drum sounds, recorded through one of six operational vintage Focusrite consoles worldwide.

  The library features dozens of snare, tom, and kick options spanning nearly a century of manufacturing history, including rare vintage instruments like Hal Blaine's actual drumset and Lenny White's custom snare collection.

  Every drum signal was processed through a professional signal chain featuring vintage compressors, Pultec EQs, Lexicon reverbs, Neumann tube microphones, Telefunken 47s, and AEA ribbon microphones.

  The plugin includes up to 9 velocity layers with 12 round robins per kit piece for realistic, natural-sounding playback. The instrument arsenal includes 9 kick drums (Ludwig, DW, Gretsch), 25 snares including an ultra-rare 1920s Black Beauty and vintage Leedy, 23 tom options across multiple positions, and 10 cymbal options.

  David Bendeth's credits span 80 million records sold and 35+ billion streams across emo, metalcore, and alternative rock, working with artists like Paramore, Breaking Benjamin, Papa Roach, and Bring Me The Horizon.
