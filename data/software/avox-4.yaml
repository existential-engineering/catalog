details: |-
  The AVOX 4 Antares vocal toolkit is the fourth generation of the comprehensive
  vocal processing suite. The user interface has changed and the plug-ins no
  longer require an ilok. The avox bundle combines 11 of our professional vocal
  processing plug-ins, to let you create stunning vocal tracks in any musical
  style, and design unique effects for audio post-production.

  From harmony creation and microphone modeling, to subtle warmth and doubling,
  to extreme vocal effects, avox is an essential toolkit for vocal and audio
  production. With faster, more accurate pitch detection, smoother,
  artifact-free pitch shifting, and seamless, natural-sounding (if desired)
  throat modeling, avox 4 plug-ins just work better.

  Other additions include redesigned user interfaces for the original five avox
  plug-ins, five integrated channels of antares' unique choir vocal multiplier
  in harmony engine, high-quality pitch shifting in throat, tempo-synced
  alienization rate in mutator, and more.

  Aspire is the world's first tool for modifying a voice's breathiness
  independently of its harmonic content. Whether reducing a bit of vocal rasp or
  adding a bit of smokiness, aspire allows modification of the amount and
  quality of a voice's aspiration noise (the component of every voice that's the
  result of air passing over the vocal chords) without otherwise affecting the
  vocal's harmonic characteristics.

  Warm warms up vocals with antares' analog tube modeling technology, while
  being so processing-efficient that it can be used on every track in a project
  with negligible impact on cpu usage.
