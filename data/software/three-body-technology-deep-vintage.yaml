  in a digital world.
details: |-
  12 plugins: Brit 73, Brit 84, US Rack, Thick Pre, Transformer X, Green AD, Nylon, Tube Shelf, Tube Bell, Tube Filter, Tape S, Tape M. Trained with APNN 2.0 neural network on real hardware units. Captures both dynamic and tonal characteristics. Minimal CPU usage. Approximately 0.6ms latency at 44.1kHz.
