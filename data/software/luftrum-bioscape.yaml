description: Bioscape, found sound cinematics field recordings merge together in
  a sonic kaleidoscope of found sound cinematics – from underscoring pad.
details: |-
  Bioscape is a 4.5gb Kontakt instrument that is based on field recordings and
  found sounds to create musical content, this gives you an unpolished, raw and
  organic dimension to your production. Bioscape is particularly suitable for
  game and filmscore composers, but works extremely well with ambient music,
  music concrète, sound healing, music therapy or as a standalone experimental
  instrument.

  Bioscape contains hundreds of field recordings and found sounds from
  hydrophonic desert wind to abandoned factory drones, from ghostly ringing
  rocks to cracking icy rivers, all sorted in different sound categories. Using
  the sound material, a team of world renowned sound designers have crafted over
  440 presets sorted in categories from pulses to pads, textures, asmr, drones,
  playables and effects.

  Bioscape is made for and licensed to the free kontakt player so you do not
  need the full version of kontakt to play bioscape. It is fully nks compatible
  and supports drag & drop, so you can use your own sounds and samples. It is
  installed directly in native access, just enter the serial number and click
  install.

  The bioscape platform has two sections or layers (wave files), and each with
  its own editing parameters. You can play/record just one layer, whereas
  invoking both layers results in a being stacked atop b. You can take those
  sound samples and adjust the length or target of each, e.g., loop a section of
  the entire wave. You then can play either layer forward or reverse, as well as
  forward/reverse stop and even ping-pong them if desired. Each layer further
  has its own filters and envelopes, as well as a number of effects, including
  modulation, delays, reverbs and a step sequencer that is ultra-easy to use
  (thus allowing for a basic sound to become a rhythmic pulse).

  Mutate dna comprises of several sound characteristics that can be applied to a
  sound sample, for one or both layers. Each layer has 25 different themes, such
  as biomass, carbon, bow, eternal, machine, etc., and it's amazing how
  different a sampled sound can be when switching from one theme to another
  utterly different! The motion recording permits you to control the dynamic
  movement of volume, cutoff, pitch, panning and effects in real time, e.g., as
  you move the cursor about on the xy pad you can record the outcome.
specs: |-
  - 4.5gb Kontakt instrument

  - Kontakt player compatible





  - Nks compatible

  - Drag and drop sample support

  - 440+ presets

  - 4 layers (a-d)

  - Adsr envelope filter

  - 24 filter types per layer

  - Lowpass (lp) filters

  - Highpass (hp) filters

  - Bandpass (bp) filters

  - Formant filters

  - Notch filters

  - 2-pole to 4-pole filters

  - State variable (sv) filters

  - Ladder filters

  - Adaptive resonance (ar) filters

  - Mutate dna function

  - 25 mutation themes per layer

  - Motion recording

  - Xy pad crossfade

  - Four sequencers

  - Lfos

  - Mod wheel assignment

  - Aftertouch assignment

  - Chorus effect

  - Phaser effect

  - Distortion effect

  - Eq effect

  - Time stop effect

  - Convolution reverb

  - Replika delay effect

  - Loop forward/reverse/ping-pong modes

  - One-shot playback mode

  - DAW tempo sync

  - User sample import

  - Hundreds of field recordings

  - Field recording categories: bowed, cityscapes, creatures, deserts, drones,
  forests, harps, ice, industrial, metal, misc, mountains, water, wind
