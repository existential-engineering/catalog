description: "The Ultimate Audio Transformation Software. Based on Ircam's Super
  VP engine, TS2 is a powerful audio toolbox application for professionals to
  edit or magically transform, time-stretch and manipulate audio files. It
  features an accurate real-time sonogram display, full automation over the
  SuperVP engine, high-quality pitch shifting with up to 100x time stretching,
  spectral clipping creative effect, complete audio editing with
  copy/cut/paste/loop, batch processing and multichannel support up to 256
  channels, and can host third-party VST2, VST3 and AU plug-ins."
