details: |-
  FEATURED IN:
  Toneforge® Menace is a virtual guitar rig plugin designed to give you aggressive metal amp tones that pair perfectly with any guitar lead or riff. As the original Toneforge® model, Toneforge® Menace is the first virtual guitar rig plugin designed to take you all the way from direct input to final mix.
  Toneforge® Menace is guitar tone simplified.
  Ultra High Gain Amp
  Who doesn’t love the ultra-thick, uber-distorted tones offered by a high-gain amp head? In metal and hard rock genres, there’s no substituting that kind of tone.
  Toneforge® Menace contains a proprietary design for ultra high-gain amp tone designed by metalcore producer, Joey Sturgis. Having worked with dozens of modern metal amps on albums for artists like Asking Alexandria, Of Mice & Men, The Devil Wears Prada, Miss May I, Emmure, Attila, and countless others, Joey has a unique perspective on studio guitar tone. Paring down his engineering and mixing chops to a single plugin, he was able to create the most comprehensive, mix-ready virtual guitar rigs for metal musicians.
  Classic Overdrive
  Toneforge® Menace offers a mild distortion/overdrive pedal that enhances the dynamic response of the plugin to a guitarist’s playing. The overdrive sits in front of Toneforge® Menace’s amp head and can be used to push the amp further into breakup and saturation.
  The overdrive pedal is a great option for when you’re looking to squeeze more out of the amp, but it also supports software-enabled true bypass when you’d rather get that straight-from-the-amp tone.
  Cab Room
  Toneforge® Menace features a flexible cab room, capable of producing a wide range of mic’d up cabinet tones. Users can leverage the JST Matched Cabinet with four different microphone pairings, or import their own cabs using Toneforge® Menace’s convenient IR Loader.
  JST Matched Cabinet
  To perfectly pair the cabinet with Toneforge® Menace’s amp topology, Joey Sturgis Tones developed a proprietary matched cabinet emulation that responds and reacts to changes to the amp’s settings and player’s style in the same way a physical cabinet might. This closed loop is one of the biggest benefits to having a virtual guitar rig - by controlling both the front-end inputs from the amp and the output from the cabinet, great tone can be more than captured; it can be reproduced time and time again!
  Pair it with any of the following microphone options:
  Condenser
  An expensive-sounding microphone capable of capturing the full frequency spectrum in a detailed, transparent manner.
  421
  A classic dynamic microphone with more focused midrange and extended low end.
  57
  A studio workhorse dynamic microphone placed on-axis for direct, straightforward tone.
  57 off-axis
  The same studio workhorse placed off-axis for a slightly darker, rounded tone.
  Not finding the right combination? With Toneforge® Menace’s Impulse Response loader, you can import any of your favorite cabinet/microphone combinations from your collection. Check out our impulse response packs to learn more.
  Studio-Grade Parametric EQ & Limiter
  A huge part of achieving mix-ready guitar tones comes down to the post processing, which is why we’ve included a Parametric EQ and Limiter with Toneforge® Menace.
  Both processors are studio-grade effects units that could go toe-to-toe with the best dedicated EQ or limiters on the market, but we’ve chosen to pair them with Toneforge® Menace so we could fine-tune them to work their best with this amp. Rest assured you’re getting a fully optimized, end-to-end guitar tone solution with this plugin
