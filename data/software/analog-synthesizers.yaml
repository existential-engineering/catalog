details: >-
  Analog synthesizers is a unique collection of instrument racks for ableton
  live featuring bass, lead, keys and fx sounds created using four "classic"
  analog synthesizers from doepfer, moog and teisco.


  This 392mb pack includes 26 multi-sampled instrument racks (containing 269
  24-bit wav files), each featuring a macro for easy control over the lfo and
  env settings (requires live 9.7 or higher).


  Instruments: moog opus 3, moog sub 37, doepfer dark energy, teisco 60f.
