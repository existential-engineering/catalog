description: Comprehensive audio plugin license that covers all A.O.M. plugins.
  Newly-released plugins are immediately available under a valid Total Bundle
  license.
details: |-
  The Total Bundle is a subscription-based license that grants access to every
  A.O.M. plugin in one package. It provides immediate access to newly released
  plugins as they become available.

  The bundle covers the full range of A.O.M. products including limiters,
  compressors, equalizers, stereo processing tools, and creative effects. All
  plugins support sample rates from 44.1kHz to 384kHz with 64-bit floating-point
  internal precision.

  The Total Bundle is offered as a 1-year license only. There is no plan to
  provide a perpetual license of the Total Bundle. However, individual plugin
  perpetual licenses can be obtained separately.
specs: |-
  - Includes all current and future A.O.M. plugins
  - 1-year subscription license
  - Sample rates: 44.1kHz to 384kHz
  - 64-bit floating-point internal precision
  - Latency compensation included
  - Factory and user presets with snapshots
  - Undo/redo and reset-to-default functionality
releaseDate: "2013"
