description: Vintage plate reverb plugin inspired by the EMT 140. Six plate materials for lush vocals, snappy snares and mix glue.
details: |-
  The RO-140 is a vintage plate reverb built the way the EMT 140 worked, a suspended steel sheet driven at one end and read back by pickups, its dense and slightly metallic shimmer folded into your signal in real time. Black Rooster Audio physically modelled that plate, the sheet, its transducer, its pickups and the way the metal rings, and deliver it through efficient real-time convolution, so the plate blooms and settles with the physics of the original rather than a generic digital tail. It expands the original EMT 140 concept with six plate materials, a continuous size control and three routing modes on one panel.

  Instead of one steel plate, the RO-140 offers six plate materials, steel, aluminum, bronze, silver, gold and titanium, each with its own density, brightness and decay character. The Plate Size control sweeps continuously from small to large, its transducer and pickups moving in real time to shift the tail from a tight, small-room shimmer to a wide, cavernous bloom. A Damper steps through ten positions to set decay time, exactly like the mechanical damper bar on the original. The return can be sculpted with a 3-band parametric EQ (a 200Hz low shelf, a 400Hz mid peak and a 900Hz high shelf), a Bass Cut high-pass (10Hz to 1kHz), Pre/Delay running from 0-1ms of fine offset up to a full 500ms, and Mix with Input/Output gain staging.

  On lead vocals, a bright plate material with medium damping and a touch of pre-delay throws the singer into a space without smearing the words. On snares and toms, a shorter decay and a steel or titanium plate adds a classic 60s crack-and-bloom. Across a full mix or drum bus, the Mono2Stereo output mode feeds a mono source through one transducer and two pickups placed on separate parts of the plate, returning a wide stereo image from a mono source.
