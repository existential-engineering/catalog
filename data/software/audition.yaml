description: Recording, mixing, editing, and mastering - Adobe Audition is the
  all-in-one toolset for professional audio production.
details: |-
  Complete audio studio - handle all of your digital audio tasks within a single
  application. Work with a multitrack mixing view, a mono and stereo waveform
  editing view, and audio effects; create music with loops; and burn audio cds.

  Enhanced support for video - edit video soundtracks more easily with the
  ability to view video frames in the timeline and import a wide range of file
  formats, including avi, native dv, mpeg, and wmv.

  Powerful audio effects and dsp tools - work with more than 50 digital signal
  processing (dsp) tools and effects, mastering and analysis tools, audio
  restoration features, and third-party directx and VST plug-ins.

  Powerful multitrack mixing - use the multitrack view for recording, mixing,
  and editing up to 128 stereo tracks. Record up to 32 inputs, use real-time
  effects and eq on every track, play back video and MIDI files, and more.
