description: "Super accurate circuit simulation of a tube pre-amp with analog
  EQ, using pre-computed solution tables for efficiency. Can be overdriven
  gently for warming effects or cranked for fat distortion."
details: |-
  Accurate tube preamp simulator using circuit simulation technology. Two common cathode preamp stages. 12AX7 and 12AU7 tube models. Drive control for distortion adjustment. Baxandall 3-band analog EQ. Saturation and EQ bypass switches. High quality 2X oversampling mode. Wet/dry mix control. Analog style metering. No latency. Up to 192 kHz sampling rate. Mono or stereo.
specs: |-
  Mac: AU, VST3, AAX. macOS 10.13+, Apple Silicon native, 64-bit only. Windows: VST2, VST3, AAX. Windows 7/8/10/11, 32-bit and 64-bit. iLok supported but not required.
