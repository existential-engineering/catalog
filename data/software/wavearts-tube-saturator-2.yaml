description: An authentic tube preamp simulator with analog EQ that delivers warming effects at gentle settings or fat distortion when driven hard. Uses circuit simulation technology to mathematically model analog circuits, running approximately 7x faster than its predecessor with improved accuracy.
details: |-
  Tube Saturator 2 uses circuit simulation technology to accurately model analog circuits, specifically two cathode preamp stages. The simulator runs approximately 7x faster than its predecessor while maintaining or improving accuracy.

  Users can select between 12AX7 and 12AU7 tube models to shape the character of saturation. A Baxandall 3-band analog EQ is included and can be switched pre or post saturation for flexible tone shaping.

  The plugin supports mono and stereo operation, zero latency processing, and sample rates up to 192 kHz. A high-quality 2x oversampling mode is available for reduced aliasing, and a wet/dry mix control allows parallel processing.

  A noise gate was added in version 2.18 to suppress low-level limit cycle oscillation, and the plugin features infinite undo with shift-click redo. iLok licensing is supported but not required — Wave Arts' own online activation is the default.
specs: |-
  - Two cathode preamp stages with circuit simulation
  - Tube models: 12AX7 and 12AU7
  - Baxandall 3-band analog EQ (pre/post saturation switching)
  - Drive control for adjustable saturation/distortion
  - Wet/dry mix control
  - Zero latency operation
  - High-quality 2x oversampling mode
  - Sample rate support up to 192 kHz
  - Mono and stereo operation
  - Analog-style metering
  - Noise gate (added v2.18) to suppress limit cycle oscillation
  - Infinite undo (shift-click for redo)
  - UI scaling support
  - macOS: AU, VST3, AAX (64-bit); Apple Silicon native
  - Windows: VST2, VST3, AAX (32-bit and 64-bit)
  - macOS 10.13 (High Sierra) or higher required
  - Windows 7/8/10/11 supported
  - AAX: Pro Tools 11+ (Mac), Pro Tools 10.3.5+ (Windows)
  - iLok supported but not required
