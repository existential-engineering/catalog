description: Tube Saturator 2 is a super accurate circuit simulation of a tube pre-amp with analog EQ, which can be overdriven gently for warming effects, or cranked for fat distortion.
details: |-
  Tube Saturator 2 is a super accurate circuit simulation of a tube pre-amp with analog EQ, which can be overdriven gently for warming effects, or cranked for fat distortion. Like its predecessor, Tube Saturator Vintage, TS-2 is based on circuit simulation technology to capture every nuance of an analog circuit. The circuit, consisting of the individual tubes, resistors, and capacitors, is converted into a mathematical system of equations which is numerically solved to produce the exact same sound as a real circuit.

  While the original consumed large amounts of CPU power to compute the solutions in real time, TS-2 uses large tables of pre-computed solutions. The Saturation section of TS-2 runs about 7x faster than the original and yet the modelling is even more accurate. TS-2 includes the original circuit simulation of the three band Baxandall type EQ as found in many guitar amplifiers.

  TS-2 has many other features. It can switch between 12AX7 and 12AU7 tubes for different harmonic characteristics. The EQ can be switched to run pre or post saturation, and saturation and EQ are separately switchable. A 2x oversampling mode using a very high quality resampling algorithm attenuates aliased distortion harmonics, and the mix control blends the processed sound with the original.
specs: |-
  - Accurate tube preamp simulator using circuit simulation technology
  - Two common cathode preamp stages
  - 12AX7 and 12AU7 tube models
  - Drive control for distortion adjustment
  - Baxandall 3-band analog EQ
  - Saturation and EQ bypass switches
  - High quality 2X oversampling mode
  - Wet/dry mix control
  - Analog style metering
  - No latency
  - Up to 192 kHz sampling rate
  - Mono or stereo
  - Requires a host program that supports audio plug-ins
  - iLok licensing is supported but not required
  - Macintosh formats: AU, VST3, AAX
  - macOS 10.13 (High Sierra) and higher
  - Apple Silicon natively supported (AU, VST3, AAX)
  - AAX on macOS requires Pro Tools 11 and higher
  - macOS: 64-bit hosts only
  - Windows formats: VST2, VST3, AAX
  - Windows 7/8/10/11
  - AAX on Windows requires Pro Tools 10.3.5 and higher
  - Windows: 32-bit and 64-bit hosts supported
