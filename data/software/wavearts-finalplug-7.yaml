description: "Combines a lookahead peak limiter with ITU BS.1770 loudness
  metering for audio mastering. Features one-click loudness compliance with
  MATCH function and transparent peak limiting for gain staging or volume
  maximization."
details: |-
  Sonically transparent peak limiting. True peak limiting mode. Auto-release mode. Limiter oversampling up to 8x. ITU BS.1770 loudness metering. MATCH button for automatic loudness and true peak compliance. Preset menu of common industry delivery targets. Bit depth truncation from 4 to 24 bits. TPDF dithering with noise shaping options. Customizable UI.
specs: |-
  Mac: AU, VST3, AAX. macOS 10.13+, Apple Silicon native, 64-bit only. Windows: VST2, VST3, AAX. Windows 7/8/10/11, 64-bit only. iLok supported but not required.
