description: FinalPlug 7 is a peak limiting and loudness compliance plugin combining a lookahead peak limiter with ITU BS.1770 loudness metering for mastering and gain staging. It features true peak limiting, automated loudness/true peak targeting via a MATCH button, and integrated dithering for final delivery.
details: |-
  FinalPlug 7 combines a sonically transparent lookahead peak limiter with ITU BS.1770 loudness metering, making it a complete solution for mastering and loudness-compliant delivery to streaming platforms. The plugin features a MATCH button that automatically sets the output ceiling and gain to meet preset loudness and true peak targets for common streaming and broadcast standards. True peak limiting mode with 8x oversampling prevents inter-sample peaks from exceeding the target ceiling, ensuring compliance across all playback systems. FinalPlug 7 includes bit depth truncation from 4 to 24 bits with TPDF dithering for optimal quantization noise shaping when rendering to lower bit depths. The UI is resizable and includes high-resolution graphics for HiDPI displays. Streaming and CD mastering target presets are built in, with information tips available for all preset and target settings.
specs: |-
  - Lookahead peak limiter with auto-release and 8x oversampling
  - True peak limiting mode (compliant with ITU BS.1770)
  - ITU BS.1770 integrated loudness metering (LUFS) with overflow detection
  - MATCH button for automated loudness/true peak targeting
  - Preset streaming targets (Spotify, Apple Music, YouTube, etc.) and CD mastering targets
  - Bit depth truncation: 4–24 bits with TPDF dithering
  - Resizable UI with high-resolution HiDPI support
  - macOS: AU, VST3, AAX (64-bit, macOS 10.13+, native Apple Silicon support)
  - Windows: VST2, VST3, AAX (64-bit, Windows 7/8/10/11)
  - Pro Tools 11 and higher required for AAX
  - 30-day fully functional free trial available
