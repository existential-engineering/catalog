description: FinalPlug combines a lookahead peak limiter with ITU BS.1770 loudness metering, making it an ideal plugin for audio mastering. It can be used as an insert effect to provide limiting for gain staging or volume maximization, or placed at the end of a mastering chain to meet loudness and true peak delivery requirements.
details: |-
  The FinalPlug interface could hardly be simpler. When used as a loudness maximizer, select a desired output ceiling level, say -0.1 dB, and then adjust the threshold level. Decreasing the threshold increases the volume.

  To meet loudness and true peak delivery standards, select the Analyze preset and then a delivery target specification, which sets up the integrated loudness and true peak target levels. Playing the session displays integrated loudness and true peak levels as the music plays, coloured orange if they exceed the target levels. Clicking MATCH at the end of playback sets the limiter parameters to meet the target specification, so a second pass yields the desired integrated loudness without exceeding the true peak level and the compliant audio can be exported.

  FinalPlug 7 is included in Power Suite 7.
specs: |-
  - Sonically transparent peak limiting, for use as peak limiter or volume maximizer
  - True peak limiting mode
  - Auto-release mode
  - Limiter oversampling up to 8x
  - ITU BS.1770 loudness metering
  - Writes loudness and overflow state as automation parameters
  - MATCH button automatically configures the limiter to meet loudness and true peak delivery targets
  - Preset menu of common industry delivery targets, or user-defined targets
  - Bit depth truncation from 4 to 24 bits
  - TPDF dithering with comprehensive noise shaping options
  - Customizable UI that can show only the features needed
  - Requires a host program that supports audio plug-ins
  - iLok licensing is supported but not required
  - Macintosh formats: AU, VST3, AAX
  - Windows formats: VST2, VST3, AAX
  - macOS 10.13 (High Sierra) and higher
  - Apple Silicon natively supported (AU, VST3, AAX)
  - Windows 7/8/10/11
  - AAX requires Pro Tools 11 and higher
  - 64-bit hosts only
