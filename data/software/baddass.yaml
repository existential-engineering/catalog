details: |-
  baddASS is a bass drum fortification device designed for sorting out weak bass
  drums. It can be used to gate the incoming bass drum and therefore reduce
  spillage, but that's just the start.

  From storming bottom end to evil cutting distortion, baddass's drive, crush
  and eq sections give you plenty of scope for re-shaping your kick. Add click
  for more attack, and reinforce sub-bass content with pure waves.

  Parameters for badd, ass, and mix allow full control over the original bass
  drum, low-end reinforcement, and distorted nastiness - without using any
  compression.

  Beef-up your kick with 20 to 200 hz sin waves. Bend and twist - add punch and
  guts. Designed for added oooomph.
specs: |-
  - 1 input, 1 output
  - 1 oscillator
  - Overdrive with controls for drive and threshold
  - Bit crusher
  - 2 clippers
  - 2 parametric EQ bands
  - Adjustable attack
  - Separate controls for 'badd' & 'ass' levels
  - Dry/wet mix control
  - Input and output gates
  - Post mix cut/boost control
  - 16 presets
  - Envelope controls: volume
  - Envelope controls: pitch
  - Envelope controls: bit depth
  - Windows
