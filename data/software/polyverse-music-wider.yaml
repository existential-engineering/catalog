description: Wider is a unique stereo "mono-compatible" plugin. Any signal that has been extended will always remain in phase, even if summed to mono.
details: |-
  Increase stereo image up to 200% on mono signals
  Full mono compatibility — no phase cancellation when summed to mono
  Low-frequency bypass option (v2.0)
  Mono compatibility checker button (v2.0)
  Single, intuitive knob interface
  Developed in collaboration with Infected Mushroom
  Also available as Wider 1.0 for iPhone and iPad
