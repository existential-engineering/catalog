description: Wider is a unique stereo "mono-compatible" plugin. Any signal that has been extended will always remain in phase, even if summed to mono.
details: |-
  Wider is a pseudo stereo widener that gives a mono signal the illusion of an expanded stereo image, up to 200% of full stereo. It is mono compatible, so a widened signal stays in phase with itself and the effect cancels itself out when the signal is summed back to mono.

  The width comes from an all-pass and comb filtering algorithm, which is intended to avoid the phase cancellation that other stereo effects introduce when a track is folded down to mono.

  Version 2.0 adds two controls. Low frequencies can be excluded from the expansion so the side information below a chosen frequency stays intact, and a mono button checks how the widened signal sounds when summed.

  The effect began as the stereo section of Polyverse's Manipulator and was developed in collaboration with the electronic music duo Infected Mushroom.

  Wider is distributed at no cost in VST2, VST3, AU and AAX formats, for Windows 64 bit and OSX 10.9 or later 64 bit. Wider 1.0 is still available for iPhone and iPad.
specs: |-
  - Increase the stereo image of any mono signal by up to 200%
  - Maintains full mono compatibility
  - Bypass low frequencies from the effect
  - Mono compatibility check button
  - All-pass and comb filtering algorithm
  - Effect cancels itself out when summed to mono
  - Supports VST2, VST3, AU and AAX plug-in formats
  - For Windows 64bit and OSX 10.9+ 64bit
  - Wider 1.0 is still available for iPhone and iPad
