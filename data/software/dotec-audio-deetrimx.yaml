details: |-
  DeeTrimX is an automatic volume leveling plugin developed by Dotec-Audio as the follow-up to the highly popular DeeTrim. It delivers automatic adjustment with much higher sound quality, responding more closely to natural hand operation while maintaining the musicality and inflection of the source material.

  The plugin adjusts incoming audio to a user-defined target level automatically and in real time with zero latency, making it suitable for both studio post-production and live performance scenarios. A strength control allows the user to dial in how aggressively the leveling responds, balancing transparency against correction speed.

  DeeTrimX includes noise floor and breath level exclusion, preventing quiet background sounds from triggering unwanted gain changes. A sidechain input is also available, enabling accent adjustments driven by a separate audio source for more creative or complex leveling setups.

  The plugin has been tested with more than 30 DAW hosts, including Ableton Live, Cubase, Logic Pro X, Pro Tools, Studio One, FL Studio, and OBS Studio, ensuring broad compatibility across professional and content-creation workflows.

  DeeTrimX was first released in May 2023 and has been updated through January 2026. It is developed by Dotec-Audio.
