details: |-
  The eplex7 dsp analog circuit emulation technology splits the synthesizer code into individual virtual modules with own inputs and outputs that act similar to circuits of analog synths. Oscillators have analog shape with higher harmonics, are constantly detuning, and have analog noise and phase instability. The filter has its own amplifier producing analog low level noise as well as analog saturation and interference caused by warming of circuits. Envelopes have their own instability, exponential shape, interference and analog noise.

  The analog bass unit n4 features two analog modeled oscillators with additional digital waveforms including analog saw 1, analog saw 2, analog saw 3, digital saw 1, digital saw 2, digital saw 3, digital ramp 1, digital ramp 2, analog square 1, analog square 2, digital square 1, digital square 2, sine, triangle, and noise. Digital stabilization of analog oscillators is available as a switch, with osc 1 + 2 analog style saturation knob.

  The synthesizer includes an exponential analog style vca amplitude envelope with exponential shape and modulating signal with analog interference, noise, and artifacts. The vcf filter features digital stabilization to avoid clicking and instability with fast basslines, and an analog low pass filter with saturation knob providing true analog liquid tone with circuit interferences and distortion based on input level.

  The analog sound properties panel allows shaping of output sound with parameters including warmth, circuit drive, fatness, analog hiss of all system, electronic interference, circuit temperature, and high frequency color. The preset manager includes 118 presets: 38 edm bassline presets for house, trance, deep house, tech-trance, electro house, electro, ebm, and dance music styles; 55 psy bassline presets for psytrance, darkpsy, hitech psytrance, psycore, and goa trance; and 25 classic long basses for pop, hip hop, break beat, and drum and bass/jungle.
