description: "Space Strip is a multi-effect plugin featuring 6 modules: Contour,
  Vibe, Slapback, Ambience, Ensemble, and Stereo effects."
details: |-
  Space Strip is a six-module multi-effect plugin built around simple, flexible routing. The included modules Contour, Vibe, Slapback, Ambience, Ensemble, and Stereo, can be arranged in any order using drag and drop.

  Space Strip focuses on shaping depth, movement, and spatial balance rather than heavy effects. It works particularly well on synthesizers and keyboards, but can also be used on other sound sources where subtle space and character are needed. The plugin is designed to be lightweight and suitable for use across multiple tracks without significant CPU load.

  Space Strip combines 6 modules to add depth and space to your sounds: Contour (a 2-band EQ), Vibe (a stereo vibrato), Slapback (a short echo module), Ambience (a short reverb module), Ensemble (a multi-voices chorus), and Stereo (for stereo manipulation).

  You can customize your channel strip with a simple drag-and-drop. By default, all modules (except the Master module) can be moved and re-arranged to create different signal flows. For example, you can decide to add the ensemble module after the slapback, or vice versa.

  Space Strip is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP), and on the App Store for iOS and iPadOS (AUv3 and Standalone).
