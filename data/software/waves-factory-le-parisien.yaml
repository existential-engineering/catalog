description: Le Parisien is a sample library for Kontakt based on three accordions. It's a faithful recreation of the sound and behaviour of the real instruments.
details: |-
  Recorded with three mic positions and multiple round-robin in a perfect studio environment. The library includes all the features you need to create beautiful and evocative accordion tracks and accompaniments easily.

  Le Parisien offers sustained notes in all the registers that the original instrument has, but also full chords (major, minor) and bass notes. With the included sequencer you can create patterns that can be easily played with the left hand while the right hand plays melodies on top.

  The library covers three instruments: Rouge, a Chordox accordion with 5 registers (master, bandon, bassoon, musette and violin); Blanc, a Valetta accordion with two registers (single and double reed); and Noir, a Frontallini accordion with two registers (single reed and double reed).

  A full mixer controls the three mic positions separately, with a load/purge switch for each channel, pan / width, volume, mute, solo, phase shift and an output selector for mixing the different channels in your DAW. The effects page adds any effect in any order, including EQ, compressors, modulation effects, distortion, saturation, tape machine, reverbs and amp simulators.

  A chord recognizer in the sequencer triggers chords recorded directly from the accordion, so accompaniments can be played with the left hand while melodies are played with the right. The settings page controls round-robin, velocity curve shaping, the volume of the mechanical noises and sample start for the attack and start offset of the notes.
specs: |-
  - Three accordions: Rouge (Chordox, 5 registers), Blanc (Valetta, 2 registers), Noir (Frontallini, 2 registers)
  - Size: 3.55 GB
  - 6,198 samples
  - 6 round robin
  - 1 velocity layer
  - 3 mic positions + mixdown
  - 3 instruments
  - Full mixer with load/purge, pan/width, volume, mute, solo, phase shift and output selector per channel
  - Effects page with EQ, compressors, modulation, distortion, saturation, tape machine, reverbs and amp simulators
  - Sequencer with chord recognizer for left-hand accompaniments
  - Settings page with round-robin, velocity curve shaping, mechanical noise volume and sample start
  - Works with Kontakt 5.7.3 and newer versions
  - Full version of Kontakt required (Kontakt Player runs in demo mode)
