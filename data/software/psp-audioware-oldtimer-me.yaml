description: "PSP oldTimer ME (Master Edition) includes two versions: PSP oldTimerME, a vintage-style compressor designed for demanding track, group compression, limiting and mastering applications, and PSP oldTimer, for track or group compression and limiting. Inspired by vintage circuitry, emulating favorite characteristics of vintage compressors. PSP oldTimerME adds the option to process left, right, mid or side channel exclusively. Both are part of the Zero Latency Processing series."
details: |-
  PSP oldTimer ME (Master Edition) installer includes two versions of the oldTimer plug-in: PSP oldTimerME, a vintage-style compressor designed for demanding track and group compression, limiting and mastering applications, and PSP oldTimer, a vintage-style compressor designed for track or group compression and limiting.

  These plug-ins were developed as versatile compressors that offer detailed control, and an exceptionally musical sound. PSP oldTimer is not based on any specific hardware, but is inspired by vintage circuitry and was designed to emulate favorite characteristics of such compressors.

  PSP oldTimerME combines advanced features such as the option to process left, right, mid or side channel exclusively while remaining simple to set up. In the case of PSP oldTimer, the goal was to provide a simple compressor that offers an exceptionally musical sound while requiring minimal tweaking. PSP oldTimer is so simple and so easy to use, that it's difficult to make it sound bad even at the most extreme settings!

  These compressors offer soft and smooth compression in most applications, however they may slightly color the sound with their tube emulation on transients when heavily driven internally by high compression values.

  Both versions of oldTimer are part of PSP's Zero Latency Processing plug-in series, making them ideal for situations such as live monitoring, live broadcast production, and managing levels while tracking.
specs: |-
  - High quality signal processing algorithms
  - All internal processing done with 64 bit double precision floats
  - Option to process left, right, mid or side channel exclusively (ME version)
  - 32 and 64 bit floating-point audio streams supported
  - ZERO samples latency
  - Sample rates up to 192kHz supported
  - x64 support for Windows and Mac OSX systems
  - Extensive library of presets
  - Requires an iLok user ID and the free iLok License Manager application, no hardware dongle needed
  - License can be activated in up to 3 separate locations (computer or iLok dongle, 2nd generation or above)
  - Windows 7 to Windows 11 (64-bit VST, VST3, AAX)
  - macOS 10.14 to macOS 15 Sequoia, Intel or Apple Silicon (64-bit AudioUnit, VST, VST3, AAX)
  - AAX version requires Pro Tools
