details: |-
  Beatstation plays percussion pads, lead instruments and melodic bass. It uses
  a flexible and skinnable open playing surface, records samples, supports
  external samples, MIDI grooves and rex files. Beatstation harnesses the power
  of percussion samples and melodic instruments in one virtual instrument.

  Beatstation allows the user to design sound sets by dragging and dropping wav,
  rex, mp3 and toontrack library sounds on to the pads of beatstation from the
  beatstation browser or from the user's computer hard-drive, mixing and
  matching any sounds available to build brand new personlized sound sets.

  You can have up to five samples per pad, each with its own volume, pan, pitch,
  and envelope. Velocity can be toggled on and off per layer. Each pad can have
  its own insert effect, but these are ez mix style effects, so its actually a
  chain of effects designed for your kick or snare or cymbals or percussion or
  whatever. There are also two fx sends and those effects are simpler, like just
  compression or just reverb or just flanger.

  Beatstation allows the user to customize their playing surface to fit their
  needs by designing and changing skins as well customizing the order of the
  playing surface. Beatstation browses and plays back audio and MIDI with all
  components in the browser drag and droppable into a host application.

  Beatstation compatible sound sets: btx: the beatstation expansion packs. Ezx:
  the ezdrummer expansion packs. Sdx: superior drummer 2.0 expansion packs.
  Toontrack MIDI libraries. Rex files of any description.
