details: >-
  Abyss is a free collection of 215 dark, atmospheric, and experimental presets
  created for the pro-53 synthesizer by native instruments. Pro-53 is a legacy
  virtual analog synthesizer, discontinued around 2020, but still admired for
  its warmth, character, and prophet-inspired sound.


  Abyss was created as a long-term exploration of what this instrument can do
  beyond classic analog emulations. Over a period of three years, these presets
  were designed by pushing pro-53 to its limits focusing on unstable modulation,
  saturated filters, subtle motion, and tonal ambiguity.


  The result is a collection of dark textures, evolving atmospheres, drones, and
  otherworldly analog sounds rather than traditional "polished" patches. This is
  not a nostalgia pack. It's a preservation and exploration of a synth that
  still has a unique voice.


  What's included: 215 original presets for pro-53. Presets in native formats
  (p5p, p5a) and fxb. Velocity and modulation wheel assignments on every preset.
  Designed for ambient, cinematic, experimental, drone, and introspective
  electronic music.


  Abyss is an archived release. No new updates are planned. It is preserved as a
  final, complete statement for pro-53 a time capsule of sound design created
  during a different era of synthesis.
