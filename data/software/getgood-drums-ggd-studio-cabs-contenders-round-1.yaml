description: "GGD Studio Cabs: Contenders Round 1 is a cabinet impulse response
  plugin featuring eight huge-sounding 4x12 guitar cabinets curated by Francesco
  Filigoi. It offers seven independent channels for blending cabinets and
  microphones, plus a master EQ for tone shaping."
details: |-
  Introducing GGD Studio Cabs: Contenders Round 1. A collection of eight incredible, huge-sounding 4x12 cabs, each famed for their unique record-ready characteristics.

  Featuring several different speaker types, the cabs in The Contenders Vol. 1 each have amazing and distinct voices that can revolutionize your guitar tone, while offering endless possibilities to create fresh new sounds by blending different cabinet and microphone options together.

  To capture these sounds, longtime GGD friend and contributor Francesco Filigoi left no stone unturned, obsessing over the minutest of details to bring you nothing but the absolute pinnacle of engineering applied to the best-sounding cabs in the world. With such high-quality sounds and variation, The Contenders Vol. 1 will become your go-to cabinet modelling solution for your guitar recordings.

  All IRs captured and engineered by Francesco Filigoi

  Stop scrolling endlessly through lists of files, and focus on your creativity. Let us handle the engineering.
specs: |-
  - Mac: OS X 10.11 or higher, Intel / M1 / M2 (64-bit only)
  - Windows: Windows 7 or 10 (64-bit only), Intel Core 2 Duo or AMD Athlon 64 X2
  - Disk: 500 MB
  - iLok 2/3 or HD required for authorization
  - 8 cabinet models: MAR-TV, MES-TRAD, 3VH, UBER, FRIED, MAR-AV, ORNGE, ENG-XXL
  - 7 microphone options: SM57, SM7B, MD421, M160, KM140, C414, R121
  - Speaker options: V30 and Greenback-style
