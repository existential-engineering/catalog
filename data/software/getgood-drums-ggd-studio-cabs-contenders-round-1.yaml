description: "GGD Studio Cabs: Contenders Round 1 is a cabinet impulse response plugin featuring eight huge-sounding 4x12 guitar cabinets curated by Francesco Filigoi. It offers seven independent channels for blending cabinets and microphones, plus a master EQ for tone shaping."
details: |-
  Cabinet simulation plugin with eight 4x12 cabs, seven independent channels, seven microphones with blendable bright/dark spectrum, master EQ, and IR export capability. All IRs captured by Francesco Filigoi. iLok authorization required.
specs: |-
  - Mac: OS X 10.11 or higher, Intel / M1 / M2 (64-bit only)
  - Windows: Windows 7 or 10 (64-bit only), Intel Core 2 Duo or AMD Athlon 64 X2
  - Disk: 500 MB
  - iLok 2/3 or HD required for authorization
  - 8 cabinet models: MAR-TV, MES-TRAD, 3VH, UBER, FRIED, MAR-AV, ORNGE, ENG-XXL
  - 7 microphone options: SM57, SM7B, MD421, M160, KM140, C414, R121
  - Speaker options: V30 and Greenback-style
