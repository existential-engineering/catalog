description: Put Me On Drums is a multi-effect drum processor made with the producer K-391 that splits incoming audio into low and high frequency modules and applies a different set of effects to each. The low module covers saturation, transient level and sub tail, while the high module covers frequency shifting, dimension and width, with EQ on both.
details: |-
  Put Me On Drums is a multi-effect drum processor made in collaboration with the Norwegian producer K-391. Split frequency routing combines specific effects for low and high frequency bands, which is aimed at shaping kicks, snares and hi-hats within a single plugin, although the processing can be applied to guitars, vocals or bass as well.

  The concept behind the plugin is the split itself. Audio is divided into high and low frequency modules for independent processing, and the crossover is adjustable from 20 Hz to 20 kHz so the mid-point can be placed to suit the material.

  The low module carries Belly, Punch, Sub Tail, Length and EQ controls. Belly saturates the low end and Punch sets the transient level sent into the saturator, while the Sub Tail button and Length dial extend tails so that 808s carry upper harmonics or kicks ring out for longer. The EQ controls focus processing on a particular band or notch out problem frequencies.

  The high module carries Frequency Shifter, Dimension, Width and EQ controls, using a combination of formant shifting and additional voices. A target frequency is selected with the Frequency Shifter dial and the overall formant character is set with the Shift knob, so high percussion can be retuned to the key of a track or pushed for extra shimmer. The Width control spreads the dimension effect across the stereo field.

  Two profiles, A and B, can be compared, copied between and selected with a single click, with undo and redo buttons and a randomize function alongside them. Independent Input and Output gain controls sit with a master Mix ratio dial for parallel processing, a master Limiter toggle and a pop free Power control. A live frequency display at the top of the interface shows the signal as it is processed and the crossover can be dragged directly on it, a right click menu opens further options including oversampling, interface zoom, documentation, licensing and support, and both factory and artist presets are included.
specs: |-
  - Artist series plugin made with K-391
  - Frequency split processing with a crossover adjustable from 20 Hz to 20 kHz
  - Low module with Belly saturation, Punch, Sub Tail, Length and EQ
  - High module with Frequency Shifter, Dimension, Width and EQ
  - Formant shifting and additional voices in the high module
  - A and B comparison profiles with copy, undo, redo and randomize
  - Independent Input and Output gain with a master Mix ratio for parallel processing
  - Master Limiter toggle and pop free Power control
  - Live frequency display with a draggable crossover
  - Right click menu for oversampling, interface zoom, documentation, licensing and support
  - Scalable interface
  - Factory and artist presets
  - PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Runs on both Intel and Apple Silicon CPUs, including native AAX
