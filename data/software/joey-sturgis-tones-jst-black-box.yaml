details: |-
  THIS PLUGIN IS AN APRIL FOOLS JOKE (but it's also a real plugin which makes the joke even better).

  Introducing JST Black Box by Joey Sturgis Tones, the ultimate mixing plugin that doesn't actually do anything. Are you tired of dealing with clients who don't know the first thing about music production, but insist on making changes to your mix? With JST Black Box, you can finally put an end to those frustrating conversations. This sleek and stylish plugin is designed to look like it's doing some crazy stuff to your mix, but in reality, it doesn't actually change anything.

  With nine different modules, each with different names like "Deep End" and "Master Blaster", you can turn them to your heart's content without actually altering the mix in any significant way.

  The Sound Of Nothing. But why would you want a plugin that doesn't actually do anything? The answer is simple: JST Black Box is the perfect tool for impressing your clients and making them feel like they're getting their money's worth. By turning some knobs and fiddling around with the controls, you can make it look like you're making changes to the mix, when in reality, nothing is really happening.

  It's Open Source. While most developers want to keep their trade secrets and never share their source code, JST Black Box's source is worth sharing considering the number of hours it will save you. The complete source: void process() { // Do nothing }
