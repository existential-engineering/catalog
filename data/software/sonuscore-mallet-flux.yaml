description: Beautifully sampled mallets meet innovative arrangement sequencing. Create moving and expressive compositions easily with simple chords and control the instruments' rich and magical dynamics with the mod-wheel.
details: |-
  Mallet Flux pairs sampled mallet percussion with an arrangement sequencer. Alongside glockenspiel, celesta, xylophone, vibraphone and marimba, the instrument's centre is its Flux Engine and playing engine, a pattern automation feature that turns simple chords into complex rhythmic phrases and intricate arrangements. The fusion of rhythm, melody and sound is aimed at developing ideas fast, turning simple drafts into arrangements for soundtracks and scores.

  The five orchestral percussion instruments were recorded by sampling experts at Sonuscore and played by a seasoned composer and musician, with multiple articulations covering hard and soft mallets, long and short tones, bowed bars and reverse samples. Multi-effect chains turn those authentic sounds into cinematic pads, drones and other distinctive tones, and the mod wheel morphs sequences in real time to change a pattern's dynamics and generate shifting rhythmic structures.

  The library ships with 270 preset scenes, predesigned arpeggios, sequences and single hits in multi-instrument arrangements, filterable by note value and time signature. Flux and drone scenes use complex effect chains for celestial sounds and imaginative textures, morph scenes respond to the mod wheel, and any scene parameter can be customised. The flexible sequencer allows step dynamics, sequence length, arpeggio settings, rate, repeats and octaves to be modified.

  Mixing covers ensemble balance and panning, EQ and compression, a blend between close and far mics, REPLIKA delay based on the REPLIKA XT plug-in with multiple delay modes, and a choice of room, hall and plate reverbs. On a Komplete Kontrol keyboard, chords feed the flux engine while all parameters map automatically to the eight display knobs and preset scenes light up on the light guide.
specs: |-
  - Works with the FREE Native Instruments KONTAKT 6 PLAYER or KONTAKT 6 (version 6.0.2 or higher)
  - Product type: KOMPLETE instrument
  - 2 NKIs covering five mallet percussion instruments: glockenspiel, celesta, xylophone, vibraphone and marimba
  - 270 preset scenes (arpeggios, sequences and single hits)
  - Sound categories: acoustic instruments and tonal percussion
  - Flux Engine pattern automation
  - Multiple articulations: hard and soft mallets, long and short tones, bowed bars, reverse samples
  - Real-time mod-wheel morphing of sequences
  - Flexible sequencer with step dynamics, sequence length, arpeggio settings, rate, repeats and octaves
  - Close and far mic blend
  - EQ, compression and panning per ensemble
  - REPLIKA delay based on the REPLIKA XT plug-in with multiple delay modes
  - Room, hall and plate reverbs
  - Komplete Kontrol / NKS integration with light guide and eight mapped display knobs
  - Intel i5 processor recommended
  - macOS 10.12 or higher
  - Windows 7 or higher
  - 4 GB RAM
  - Download size 5.57 GB
