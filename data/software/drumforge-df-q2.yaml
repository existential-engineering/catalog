description: "The first EQ designed by mix engineers specifically for mixing drums to bridge the gap between technicality and musicality. DF-Q2 combines popular drum EQ techniques into one plugin, letting you shape your drum sound with modes refined over many years of real-world mixing experience. Turn a knob to add low end PUNCH, dial your range and find the perfect ATTACK, or press a button for pristine CLARITY."
details: |-
  DF-Q2 is the first EQ designed by mix engineers specifically for mixing drums, bridging the gap between technicality and musicality. It lets you EQ the punch, clarity, and attack ranges of your drums with EQ modes refined over many years of real-world mixing experience. Selector buttons let you switch between classic EQ curves, and the mix knob enables 100% parallel equalizing — shape your drum sound to exactly how you envision it while preserving the original tone.

  Version 2 adds de-bleed functionality that reduces unwanted frequencies in your source, an Enhance mode that adds EQ to any transient which crosses a set threshold, and a Combo mode that runs both simultaneously. An external sidechain input, a dynamic EQ section, and instrument presets for bus, guitar, bass, vocals, and synths round out the feature set.

  The plugin ships with a perpetual single-user license, free lifetime updates, and unlimited customer support.
specs: |-
  - Windows 8.1+ (64-bit): VST3, AAX
  - macOS 11+ (64-bit): VST3, AU, AAX
  - Mac Intel and Apple Silicon compatible
  - Pro Tools 11 or higher required for AAX
  - Cubase 6.5 or higher required for VST3
  - Perpetual license — single user
  - Free lifetime updates
  - Includes user manual
