description: DF-Q2 is an EQ designed by mix engineers specifically for drums, combining sought-after drum EQ techniques into one plugin. It adds punch, attack, and clarity controls, a 100% parallel mix knob, wide-range filters, and a dynamic EQ section with de-bleed and enhance modes.
details: |-
  DF-Q2 is built to bridge the gap between technicality and musicality when mixing drums. It gathers several of the most popular drum EQ techniques into a single plugin, so the results normally requiring several different equalizers can be reached in one place.

  The interface is deliberately simple, so the technical side of equalizing gets out of the way: turn a knob to add low-end punch, dial in a range to find attack, or press a button for clarity. Classic EQ curves are available on selector buttons and can be switched between instantly.

  A mix knob provides fully parallel equalization. Drastic or minimal EQ moves can be blended back against the original tone, and automating the mix knob makes the drum performance more dynamic across a song while preserving the original character of the kit.

  Version 2 adds a dynamic EQ section. De-bleed reduces unwanted frequencies such as cymbal bleed in kick, snare, and tom tracks; Enhance applies EQ to any transient crossing a set threshold to bring out excitement without affecting the natural body of the drum; and Combo mode runs both at once for transformational results on poorly recorded performances. An external sidechain mode and new instrument preset modes for bus, guitar, bass, vocals, and synths round out the release.
specs: |-
  - Drum-focused EQ modes for punch, clarity, and attack ranges
  - Classic EQ curves on instant-switch selector buttons
  - Mix knob for 100% parallel equalizing
  - Wide-range high and low pass filters
  - Version 2: De-bleed reduces unwanted frequencies in the source
  - Version 2: Enhance adds EQ to transients crossing a set threshold
  - Version 2: Combo mode runs de-bleed and enhance simultaneously
  - Version 2: external sidechain mode
  - Version 2: instrument preset modes for bus, guitar, bass, vocals, and synths
  - Version 2: dynamic EQ section and improved UI with visual style EQing
