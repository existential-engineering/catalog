details: |-
  Big Bang Orchestra: Black Eye by Vienna Symphonic Library. Ready-to-use
  orchestral textures for super-quick orchestrations. Unique orchestral elements
  and effects played by a large 70-piece orchestra. Wide variety of clusters,
  arpeggios, hits, runs and accents. Multiple microphone positions, additional
  close mic positions. Exceptional acoustics of the large synchron stage Vienna.
  A universe of new sounds at the touch of a single key.

  Bbo: black eye is the second in a series of tutti orchestra recordings for the
  big bang orchestra. It expands the series with ready-orchestrated phrases and
  fx for modern effect-oriented composing, enabling you to create large-scale
  orchestrations from scratch effortlessly, quickly, and with a massive sound
  out-of-the box. Bbo: black eye provides you with all-new musical elements,
  such as hits, rips, runs, clusters, tension sustains, rhythms, arpeggios,
  grace notes, echo effects and more, all played by a large 70-piece orchestra
  at synchron stage vienna.

  Hundreds of tension-charged clusters are available in several dynamic levels,
  short and long, with and without marcato, and as short and long crescendos.
  Sustained textures are grouped in several categories, some either slightly
  changing in pitch (microtuning) or gravitating slowly toward the root note (or
  vice versa). Others don't change in pitch, but in volume, with different
  sections of the orchestra alternating their volume resulting in a sustained
  tone that's constantly changing its colors.

  A "seagull arpeggio" effect is created by flageolet glissandos played on open
  strings, with the accompanying wind instruments playing arpeggios that follow
  the overtone series of the strings. The so-called shuffled sustains deliver
  some form of controlled chaos, where different groups of the orchestra play
  complementary rhythmic patterns. Due to its complex structure, this effect can
  be used independently of tempo and provides a propelling density that lends
  itself well to underscores, for instance.

  A special effect for dramatic accents is provided by the "graced" patch, in
  which the instruments of the high register rip towards a target note, which is
  reinforced by the rest of the orchestra with a powerful marcato-staccato. The
  "staccato-sordino sustains" provide a special spine-tingling sensation while
  the fortississimo staccato of brass and low strings rings out, a very soft
  high note played by the muted strings remains, illustrating the dynamic range
  of the orchestra in a split second. The echoes and the register delay patches
  add even more variety to the category of hits. Big bang orchestra: black eye
  provides a wide range of "classic" orchestra hits with all major, minor, open
  and diminished chords, octave grace notes, octave trills, a variety of short
  rips as well as longer major and minor runs in breathtaking tempos, where
  especially the instruments of the lowest register were deliberately pushed to
  their limits.
