description: Channel strip of the iconic Helios type console that defined
  classic rock of the 1970s with preamp, twin EQs & FET compressor/limiter.
details: |-
  Warm, Rich, and Punchy: The Sound of Classic Rock. Helios Type 69 consoles are known for their smooth and harmonic sound, heard on legendary records by the likes of Led Zeppelin, Jimi Hendrix, David Bowie, the Who, Black Sabbath, Pink Floyd, AC/DC, and Bob Marley. Lindell's 69 Channel Strip faithfully recaptures this classic tone in plugin form.

  The Sound of The Original Analog Console with Expanded Features. Coveted for their unique-sounding preamps, precise filters, and smooth and musical EQs, Helios arguably made the coolest consoles of the 60s and 70s. Selected by The Rolling Stones for their famous mobile recording studio and used to record Led Zeppelin's most enduring albums, Helios consoles were simple in operation but offered a complex and characterful tone that was hard to resist. Lindell's plugin adds to the original by bringing the Helios bus EQs and compressors directly into a channel strip.

  Timelessly Classic EQ on Every Channel. The Lindell emulation features the Pre-EQ-69 module which is a 3-band active bell filter loved for musical-sounding boosts and cuts that can add presence and air without harshness and fullness to lows without excessive rumble.

  Includes HUGE-Sounding FET Compression. Used on some of the most iconic drum sounds in history, the powerful F760 Compressor/Limiters were part of what made the Helios line so alluring. The only drawback is that they were designed and implemented as bus compressors, so you could never reasonably have one on every channel, until now. With its distinctive sound and variable attack, release, and ratio, the F760 is often considered a fun and flexible alternative to the 1176 by the few engineers lucky enough to own or use them.

  Use It Anywhere. Lindell's 69 channel can add warmth, presence, and character to vocals, helping them stand out in the mix. Use it to provide punch and clarity to drum recordings or to shape the tone of guitars, adding warmth, body, and sparkle to the sound. It can imbue digital keyboards and synths with uncanny character and depth, bring out the natural warmth of bass instruments, or impart a cohesive, three-dimensional, and decidedly analog tone to any mix.
specs: |-
  - Authentic Helios Type 69 emulation: captures the rich, musical character of the classic Helios Type 69 console, revered for its smooth, open sound and unmatched harmonics
  - Helios F760 Compressor/Limiter: versatile FET compressor/limiter, offering a wide range of transparent to aggressive compression
  - Pre-EQ-69: provides the full-bodied warmth and natural presence of the iconic Helios preamp and EQ, meticulously modeled for the digital realm
  - Passive 69: recreates the smooth, musical response of the classic passive equalizer, renowned for its ability to add depth and warmth to any source material
  - Intuitive interface with a resizable window
  - Supported plugin formats: AAX AudioSuite, AAX Native, AU, VST2, VST3
  - Supported operating systems: macOS 26 down to macOS 13, Windows 11 down to Windows 10
  - Mac: Intel, or Apple Silicon
  - PC: x64-compatible CPU
  - Display resolution: 1440 x 900px or 1280 x 960px or higher
  - Memory: 2 GB RAM
