description: UFX LOFI offers no less than 20 distinct retro algorithms that emulate audio equipment through the ages, from 50s vinyl and 70s tape machines to 80s samplers and 90s bitcrushing.
details: |-
  UFX LOFI offers no less than 20 distinct retro algorithms that emulate the beautiful imperfections of all kinds of audio equipment through the ages, from the vinyl records of the 50s to the tape machines of the 70s to the first samplers of the 80s and the signature bitcrushing effects of the 90s.

  From various kinds of aging (vinyl, tape, aliasing, saturation, wow/flutter) to electric disturbances (dropouts, stutter, random pitch) to outright "unfit" equipment (broken speaker, cheap filter, cheap compressor), there is a mode for any situation, no matter whether you want to go for realism or creative spark.

  While the Highlighter filter removes low or high-end, tape stop simulates a real tape mechanism being momentarily stopped or released, and noise adds a distinct noise floor for every one of the 20 modes: powerful creative control for extra realism and inspiration.

  Wet and dry signal can be separately mixed into the Filter, which offers basic EQs, synth filters and more, and the Finisher which comes loaded with all kinds of effects from a simple chorus to a cloud of grains and rhythmification. The intelligent randomization of UFX plug-ins provides instant surprises on the press of a button, adjustable using the Small/Big control from subtle variations to totally new LOFI presets.
specs: |-
  - 20 algorithms from vinyl to tape to aliasing to bitcrushing to creative degradation
  - Modes: Downsample, Bitcrush 1, Bitcrush 2, Harsh Degradation, Aliasing, Wow, Flutter, Tape Saturation, Vinyl, Transformer, Dropouts, Stutter, Jitter, Random Pitch, Granular Glitch, Broken Speaker, Cheap Filter, Muffle, Cheap Compressor, Slowed Down
  - Original noise in every algorithm for extra realism, plus automatable filter and tape stop effects
  - Built-in multi-effect section with 40 Filter and 50 Finisher effects, plus intelligent randomization
  - 150+ quality, categorized presets
  - Operating systems: Windows 10 to Windows 11, macOS Catalina (10.15) to macOS Tahoe (26)
  - Minimum 8GB of RAM
  - 0.3GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - VST 2, AAX and AU 2 supported on Intel Macs and Apple silicon Macs
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Requires the latest version of the UJAM App, which installs the UFX plug-in that hosts all titles
