details: |-
  Woodwind Evolutions gives you some of the most instantly gratifying sounds we've ever had the pleasure of making. Recorded dry at the amazing Air Edel studios, London, this eclectic collection of woodwind evolutions provides composers with a unique palette of inspirational tools to create ultra-minimal, realistic textures, from dark and arresting, to soaring and beautiful. Now presented in our own sophisticated GUI with an ingenious grid layout, you have an almost infinite number of configurations at your fingertips, to hold your listeners spellbound. The Spitfire team have also created a range of straight-out-of-the-box presets, offering you instant playability and inspiration.
specs: |-
  - 48 evolutions and 19 presets
  - Two player line-ups: Band A Woods (flutes and clarinets) and Band B Reeds (oboe, cor anglais, bass clarinet, baritone sax, bassoons)
  - 12 x 48 Evo Grid interface with 'Feeling Lucky' randomisation
  - Signals: Close, Tweaked, Ambient, Distorted, Stretch X2, Stretch X8
  - Approximately 3312 samples
  - 20.0 GB download size
  - 19.80 GB disk space required during install
  - macOS 11 to 26, Intel and Apple Silicon, 8 GB RAM minimum (16 GB recommended)
  - Windows 10 or 11 (64-bit), 8 GB RAM minimum (16 GB recommended)
  - 32-bit systems are not supported
  - Recorded to tape at Air Edel Studios, London by Nick Taylor
  - Spitfire Audio App required
