description: A collection of impulse responses capturing seven premium British
  4x12 guitar cabinets loaded with green-backed M-magnet speakers, ranging from
  vintage to modern reproductions. Each cabinet is captured with ten blendable
  microphone options including bright and dark sweetspots, with phase-coherent
  IRs for safe mixing. Includes a master EQ and export capability for use in
  external software or hardware.
details: |-
  Goldstack is a collection of amazing-sounding historic and modern examples of the most revered cabinet and speaker combination in rock - the classic British 4x12 loaded with "green-backed" M-magnet speakers.

  Known for its articulate, resonant and engaging sound, this combination of cab and speaker can sound silky, raucous, vocal, or crushingly heavy depending on the era and recording methods used. Goldstack gives you access to museum-grade vintage pieces through to polished-sounding contemporary reproductions, so you can explore the sonic heritage for yourself.

  All IRs captured and engineered by Adam Getgood

  GGD Studio Cabs: Goldstack offers you an archive of world-beating, genre-defining guitar cab sounds. Whether you want to sound like Jimi, Eric and Eddie, or to find a new voice for cutting edge guitar, there are nearly endless options here for you to fall in love with.

  The journey to find your sonic identity as a musician and producer is one full of technical and engineering challenges. These obstacles ultimately disrupt your creative headspace and workflow. Stop scrolling endlessly through lists of files, and focus on your creativity. Let us handle the engineering.
