description: A collection of impulse responses capturing seven premium British 4x12 guitar cabinets loaded with green-backed M-magnet speakers, ranging from vintage to modern reproductions. Each cabinet is captured with ten blendable microphone options including bright and dark sweetspots, with phase-coherent IRs for safe mixing. Includes a master EQ and export capability for use in external software or hardware.
details: |-
  Cabinet simulation plugin featuring the classic British 4x12 with green-back speakers. iLok authorization required.
specs: |-
  - Mac: OS X 10.11 or higher, Intel / M1 / M2, 500 MB disk space, iLok License Manager required
  - Windows: Windows 7 or 10 (64-bit), Intel Core 2 Duo or AMD Athlon 64 X2, 500 MB disk space
  - 64-bit only
  - 7 Goldstack-style 4x12 cabinet IRs
