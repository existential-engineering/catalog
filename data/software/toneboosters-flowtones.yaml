description: Virtual analog synthesizer with two parts, each featuring two analog-modelled voltage-controlled oscillators, over 30 analog-modelled VCF filter types, and pro-grade effects.
details: |-
  Flowtones is a modern, unique-sounding virtual analog synthesizer with two parts featuring two analog-modelled voltage-controlled oscillators (VCOs) each.

  Each oscillator has an extensive feature set including pulsewidth and ringmodulation, subharmonic synthesis, noise and unison synthesis and a wide range of modulation options. There are 36 waveform types and four VCO synthesis modes simulating modern or vintage circuitry, plus a ring and self-modulation matrix.

  Over 30 analog-modelled VCF filter types, pro-grade effects including a best-in-class formant filter, low-frequency oscillators and envelope generators provide a colourful palette to create a wide range of sounds. The effects section covers EQ, reverb, echo, formant, chorus and a master limiter, and hundreds of modulation paths reach the VCOs, filters and effects.

  An intuitive step sequencer creates, edits and triggers sequences, and the intelligent randomizer creates new and unique sounds instantly on top of the hundreds of categorized presets provided.

  Flowtones is also available for iPhone and iPad, as a companion sound editor for Android, and as an in-app purchase for Audio Evolution Mobile Studio on Android and iOS.
specs: |-
  - Two parts, each with two analog-modelled VCOs
  - 36 waveform types
  - Four VCO synthesis modes simulating modern or vintage circuitry
  - Pulsewidth modulation, ring and self-modulation matrix, subharmonic synthesis, noise and unison synthesis
  - Over 30 non-linear analog-modelled VCF filter types
  - Hundreds of modulation paths to VCOs, filters and effects
  - Effects: EQ, reverb, echo, formant filter, chorus and master limiter
  - Step sequencer
  - Intelligent randomizer over hundreds of categorized presets
  - Resizable user interface that fits every screen and resolution
  - Dozens of colour themes
  - Undo, redo and A/B switching
  - Preset management with import and export
  - Multiple simultaneous instances
  - License activation without a hardware dongle
  - Sample rates up to 384 kHz
  - Personal, perpetual desktop licence for Windows, macOS and Linux, for use on up to 4 computers
