  - Brick-wall peak limiter
  - Stereo channel recording plug-in
  - VST plugin
  - Audio units plugin
  - VST 3 plugin
  - AAX plugin
  - Up to 192 khz sample rates
  - Automate any control
  - Factory presets
  - High-pass filter (20hz to 80hz selectable)
  - Peak and rms compressor modes
  - Phase switch
  - Bell and shelf filter options
  - 12ax7 tube emulation
