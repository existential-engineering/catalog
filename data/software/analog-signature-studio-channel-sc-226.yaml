details: >-
  Studio channel sc-226 is a stereo channel recording plug-in, featuring four
  band equalizer, an analog "signature" optical compressor and at the heart of
  the shelving and bell filters, a tube simulator and brick-wall peak limiter
  designed to reproduce the warmth of vintage recordings with quality and
  realism.


  The studio channel is tube style virtual equalizer / compressor. It is equally
  suited for delicate vocal as well as dynamic instrument recordings such as
  lead guitar, bass guitar, drums and horns.


  The algorithm was designed to emulate the response of a high-end vintage
  analog equalizer/compressor.


  Analog signature studio channel sc-226 by nomad factory is a virtual effect
  audio plugin for macos and windows. It functions as a VST plugin, an audio
  units plugin, a VST 3 plugin and an AAX plugin.


  Up to 192 khz sample rates supported. Automate any control. Factory presets.
specs: |-
  - Four band equalizer
