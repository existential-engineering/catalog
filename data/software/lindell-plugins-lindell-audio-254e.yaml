description: "Faithful emulation of a vintage British broadcast diode bridge
  limiter/compressor (Neve 2254). Originally designed for broadcast use, it
  became popular with rock producers for its rich harmonic character and musical
  energy. Features added wet/dry Mix knob and selectable slow/fast attack
  times."
details: |-
  Vintage diode bridge compressor/limiter circuit emulation
  Wet/dry mix control for parallel processing
  Selectable attack times (slow and fast)
  Rich analog tone with harmonic character
  Designed for drum buss and master bus applications
