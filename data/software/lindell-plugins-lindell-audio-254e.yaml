description: The Classic English Analog Limiter, inspired by a legendary
  limiter/compressor. The sound of Rock n’ Roll for the Master Buss, Drums,
  Guitar groups and more.
details: |-
  Warm, punchy, and ready to rock. When a certain vintage British limiter first hit the scene, it quickly became a fixture in broadcast production facilities around the world. But it was when rock and roll producers began to experiment with it that its reputation truly took off. Engineers discovered that when driven hard, its distinct compression and limiter circuits produced a warm, punchy character that added musical weight and energy to tracks and master busses alike.

  Enhance the power of your drum buss. Lindell’s faithful emulation of this classic broadcast limiter provides several useful added features, including a wet/dry Mix knob and selectable slow and fast attack times. Sometimes, the secret to the sound you’re looking for simply involves using the right tool for the job. If you’re looking to turn a meek drum buss into bombs from Bonham, the 254E might just help do the trick.

  Achieve a rich analog tone. The original vintage diode bridge compressor/limiter used a unique circuit design to apply gain reduction, producing a rich, analog tone that became highly sought-after across decades of music production. The Lindell Audio plugin version brings that same colorful, punchy sound into your DAW with stunning realism. Originally crafted for broadcast use, this style of limiter quickly found favor in rock and pop studios for its distinct harmonic character and ability to add musical energy to tracks and busses.
specs: |-
  - Emulation of a vintage British diode bridge compressor/limiter
  - Distinct compression and limiter circuits
  - Wet/dry Mix knob
  - Selectable slow and fast attack times
  - Toolbar with A/B presets
  - Calibration level setup
  - Oversampling setup
  - External sidechain support
  - Supported plugin formats: AAX Native, AU, RTAS, VST2, VST3
  - Supported operating systems: macOS 26 down to macOS 13, Windows 11 down to Windows 10
  - Mac: Intel or Apple Silicon
  - PC: x64-compatible CPU
  - Display resolution: 1440 × 900px or 1280 × 960px or higher
  - Memory: 2 GB RAM
