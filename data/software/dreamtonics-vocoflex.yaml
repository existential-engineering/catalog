description: "Real-time voice creation and transformation plugin that lets you
  import, record, blend, morph, replace and transform vocals into any voice of
  your choice."
details: |-
  Vocoflex is Dreamtonics' experimental approach to voice morphing. Import voice samples or generate a new voice using an X/Y pad voice color picker. Blend between multiple voices on a 2D canvas. Add movement to voice transformations using DAW automation. Control voices via MIDI by setting up waypoints and assigning them to MIDI controllers. Includes 40 licensed voice presets. Does not require training on large sample sets - a 10-second excerpt works as input. Works entirely offline with no GPU or internet connection required. Supports real-time input from microphone/plugin interface.
specs: |-
  System Requirements: Windows 11, macOS 11.0+. CPU: i5-7300U / Ryzen 3 3300U minimum. RAM: 4 GB. Storage: 200 MB. Plugin Formats: VST3 Effect, AAX Effect, AU Effect. Highest Quality Mode: 105 ms round-trip latency. Lowest Latency Mode: 35 ms round-trip latency.
