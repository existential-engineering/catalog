name: Blofeld Plug-in
manufacturer: waldorf
primaryCategory: synthesizer
url: https://waldorfmusic.com/blofeld-plugin/
description: Blofeld expands its power. The versatile and most popular Waldorf
  synthesizer classic blofeld is now also available as a software instrument.
details: |-
  The sound generation of the blofeld plug-in delivers the typical fat and rich
  waldorf sound character that so many waldorf users worldwide love when they
  are playing their blofeld. The secret of its sound is a powerful wavetable
  engine that enables these intense and expressive sounds. This unique synthesis
  system is based on the revolutionary ppg synthesizers of the early 80s.

  The 'synth' section contains all the important parameters for the sound
  design, giving access to the oscillators, wavetables, filters, envelopes, lfos
  and effects. The modulation matrix offers 16 freely assignable connections in
  addition to 9 fixed predefined routings. Additionally 4 freely assignable
  'modifiers' are available that enable mathematical operations which can be
  used as a modulation source.

  The blofeld plug-in has a powerful preset browser with a database structure
  and is offering extensive sorting and filter functions. The arpeggiator of the
  blofeld is one of the most powerful ones to be found in a waldorf synthesizer.
  In addition to 15 basic patterns, it offers a complex pattern editor for
  creating own variations.

  Like the hardware, the plug-in also features a 16 part multimode. The MIDI
  channel, velocity and keyboard zone can be set individually for each part.
  This multimode allows the creation of complex layer sounds. The sample browser
  provides an overview of the imported and available wavesets. Users can also
  load their own samples and assign them to the oscillators.
specs: |-
  - 3 oscillators per voice
  - Wavetable synthesis
  - Va synthesis
  - Sample playback
  - All microwave ii/xt/xtk wavetables
  - Frequency modulation between oscillators
  - 38 slots for user wts
  - 2 independent multi-mode filters per voice
  - Filter FM
  - Filter drive with selectable drive curves
  - 4 envelopes with multiple envelope modes
  - Envelope modulation
  - 3 LFOs with adjustable shapes
  - LFO phase and speed control
  - LFO delay and fade parameters
  - Per-voice or globally synced LFOs
  - DAW tempo clocking
  - Modulation matrix with 16 slots
  - 4 modifier for complex modulations
  - 16 part multi-timbral
  - Layer and split modes
  - Split by key zone and velocity range
  - Multi instrument mixer
  - Volume, panning, detuning, transpose parameters
  - Freely programmable arpeggiator
  - Up to 16 steps per sound
  - Arpeggiator timing, accentuation and velocity adjustment
  - 2 effect slots per sound
  - Chorus effect
  - Flanger effect
  - Phaser effect
  - Overdrive effect
  - Triple FX effect
  - Delay effect
  - Reverb effect
  - Factory presets from 2008 and 2012 banks
  - 20 additional original sounds by synth_nyc
  - Import .mid and .syx presets
  - Preset browser with search and sort
  - Custom preset format with tags
  - Internal preset database
  - Import/export of sound files
  - User presets contain sample data
  - Hardware blofeld control
  - Full spectre functionality coverage
  - Multi-sample playback per oscillator
  - Sample management with editing options
  - Import hardware sample content from .wpc files
  - Import user samples from .xml files
  - Sample sets sendable to hardware
  - Resizable graphical user interface
  - MIDI cc mapping via MIDI learn
  - macOS: VST, VST3, audiounit and AAX
  - Windows: VST and AAX
