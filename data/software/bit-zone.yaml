description: "Bit Zone - powerful analog tones from '80s Italy: Massive warmth,
  impressive tones, and a unique analog sound."
details: |-
  Bit Zone is inspired by the italian-born crumar bit 99, an obscure
  digitally-controlled 6-voice polyphonic analog synth released in competition
  to the popular 6-voice analog synths coming out of Japan at the time. No
  slouch, this formidable synth was designed with 2 dcos and 2 LFOs per-voice,
  per-voice cem 3328 analog filters, and per-voice VCAs, making it exceptionally
  versatile.

  Everything you hear in bit zone started on the real hardware, as our sound
  designers pushed the instrument to its limits to create an impressive range of
  sounds, with both era-specific and contemporary styles in mind. On top of
  that, every sample was recorded both with and without a hardware yamaha spx90
  "symphonic" chorus inline, allowing you to activate this defacto '80s effect
  at will in your own sound design.

  In the end we recorded over 29,000 samples from the bit 99, packing bit zone
  with 370+ presets made from 160+ layers. Explore patch categories including
  animated arp, animated chord step, animated one key, bass, bells, brass, fx,
  keys, leads, organ, pads, pluck, polysynth, strings, and winds.

  Each sound in bit zone is fully-customizable and can be used straight-away or
  as the starting point for a new sound. Raw waveforms from the bit 99 are also
  available for those wanting to create from scratch.

  Bit zone's aesthetic was adapted to closely follow the design cues of the
  hardware, giving you the feel of this uniquely styled instrument as you edit
  the dual-layer sounds including oscillators, envelopes, multimode filters, lfo
  and step modulator, dual arpeggiators and a featured effect section including
  eq, drive, thorus, ensemble, phasor, delay, and sparkverb.
