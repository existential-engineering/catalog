description: Horns of Hell is a massive percussion, organ and brass VST library featuring 67 varied articulations, including mighty Tenor Horns, diabolic Evil Brass, and a massive Organ. It includes 48 powerful brass patches, 15 organ registrations, and an Ensemble Engine with arpeggiators and velocity envelopes.
specs: |-
  - Requires Kontakt Player (free) or Kontakt 6.2.2 or higher
  - Mac OS X 10.10+ or Windows 7+
  - 4 GB RAM minimum
  - 5.7 GB free disk space
  - 8,300+ individual samples (3.55 GB compressed)
  - 67 articulations total
  - 48 brass patches: Trumpet Ensemble (3 players), French Horn Ensemble (4 players), Tenor Horn Ensemble (4 players), Trombone Ensemble (3 players), Low Brass (2 players), Evil Brass (4 players)
  - 15 organ registrations (10 manuals, 5 pedal)
  - 71 ensemble presets and 45 multi-rack patches
  - True Legato Interval Sampling
  - Ensemble Engine with arpeggiators and velocity envelopes
  - MIDI-Export feature
  - Non-pitched percussion: drums, deep hits, tubular bells, timpani
