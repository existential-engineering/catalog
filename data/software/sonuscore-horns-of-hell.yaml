description: Horns of Hell is a massive percussion, organ and brass VST library featuring 67 varied articulations, including mighty Tenor Horns, diabolic Evil Brass, and a massive Organ. It includes 48 powerful brass patches, 15 organ registrations, and an Ensemble Engine with arpeggiators and velocity envelopes.
details: |-
  Horns Of Hell is Sonuscore's brass, organ and percussion expansion for THE ORCHESTRA family, built to push the range of THE ORCHESTRA COMPLETE past its natural borders in all directions. It carries 67 varied articulations and sections the page describes as unique to it, among them the Tenor Horns, the Evil Brass and a large pipe organ. The library works as a stand-alone instrument and is also included in THE ORCHESTRA COMPLETE 2, and in the current THE ORCHESTRA COMPLETE 4.

  A 20-piece brass ensemble split into six sections was recorded in the classic room of Studio 22 in Budapest, with all sections captured in their traditional seating positions. Those sections are a Trumpet Ensemble (3 players), a French Horn Ensemble (4 players), a Tenor Horn Ensemble (4 players), a Trombone Ensemble (3 players), Low Brass (2 players) and Evil Brass (4 players: Brass Trombone, Contrabass Trombone, Contrabass Tuba and Cimbasso). Beside the brass sit 15 organ patches drawn from 10 manual and 5 pedal registrations across more than 5000 recorded pipes, and a non-pitched percussion set of taikos, tom ensemble, gran cassa, tam tam, snare drum, piatti and suspended cymbals.

  The instrument runs a reworked version of the Ensemble Engine from THE ORCHESTRA, introduced here with a new preset browser that filters and categorises presets. The engine drives a set of independent arpeggiators and velocity envelopes, inspired by the Sonuscore Origins series, so pulsating rhythms and full arrangements are generated from whatever chord or note is played rather than from pre-recorded phrases. Up to 5 instruments load into independent slots and play together, with every slot assignable to one of five modules, and the drums and hits are integrated into the engine alongside the sustained material. On the Engine page the arpeggiators shape the short notes with a rhythm stepper while the velocity envelope, whose shape can be drawn freely, shapes the sustains.

  Aside from the ensemble instrument the library holds 48 brass patches, 5 brass FX and phrase patches, 15 organ registrations and the percussion, for writing from scratch. Ensemble-multi patches load and layer multiple instances of Horns Of Hell for quick sketching, with Orchestral Rhythm and Animated Orchestra multis combining several engine instances into more complex patterns. A performance built from a preset can be dragged and dropped out of the instrument into a DAW as MIDI. It runs in the free KONTAKT PLAYER.
specs: |-
  - 67 varied articulations in total
  - 20-piece brass ensemble split into 6 sections, recorded in the classic room of Studio 22 in Budapest in traditional seating positions
  - Trumpet Ensemble (3 players)
  - French Horn Ensemble (4 players)
  - Tenor Horn Ensemble (4 players)
  - Trombone Ensemble (3 players)
  - Low Brass (2 players)
  - Evil Brass (4 players: Brass Trombone, Contrabass Trombone, Contrabass Tuba and Cimbasso)
  - 15 organ patches from 10 manual and 5 pedal registrations, over 5000 recorded pipes
  - Non-pitched percussion: taikos, tom ensemble, gran cassa, tam tam, snare drum, piatti, suspended cymbals
  - 48 brass patches, 5 brass FX and phrase patches, 15 organ registrations and various percussion
  - 40+ war and battle patterns
  - 50+ new single NKIs
  - 85 new multi articulations
  - 120 versatile ensemble presets
  - 71 ready-to-go ensemble presets
  - 45 multi-rack patches
  - True legato interval sampling
  - Complete set of standard articulations for all instruments
  - Ensemble Engine with independent arpeggiators and freely drawable velocity envelopes
  - Preset browser with filters and categories
  - Load up to 5 different instruments in independent slots, each slot assignable to 1 of 5 modules
  - Drums and hits fully integrated into the Ensemble Engine
  - Ensemble-multi patches that load and layer multiple instances, including Orchestral Rhythm and Animated Orchestra multis
  - MIDI export by drag and drop of a performance into the DAW
  - 8300+ individual samples
  - 3.55 GB of data (4.46 GB uncompressed)
  - Works with the FREE KONTAKT PLAYER
  - KONTAKT 6.2.2 or higher
  - Mac OS X 10.10 or higher, Intel Core 2 Duo
  - Windows 7 or higher, Intel Core 2 Duo or AMD Athlon 64 X2
  - 4 GB RAM
  - At least 5.7 GB of free hard disc space
