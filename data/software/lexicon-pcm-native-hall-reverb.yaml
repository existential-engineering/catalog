description: Hall reverb plug-in based on Lexicon's legendary hall algorithms,
  delivering lush, natural, panoramic large-space reverberation for mix and post
  production.
details: |-
  Lexicon has been doing Halls since, well, you could do a Hall. Our digital Halls first hit the studio in the 1970's with the legendary 224 and haven't missed a day since. With the introduction of the PCM Native Hall Reverb, you can create incredible mixes on your laptop or desktop anywhere in the world.

  A hall is a comparatively large space with wall-to-wall distances that are typically several tens of meters. They are the principal venue for classical ensembles, but have proven to be useful for all types of music. The Lexicon Hall algorithm provides an exceptional reproduction of these large, wide, panoramically wonderful spaces.

  The Hall algorithm shares these basic characteristics with the Random Hall and Concert Hall algorithms, but is smoother with a more even decay. Its initial density is also lower than Random Hall. The Hall plug-in provides a lush, natural, and unobtrusive reverb and works great on orchestral or classical instruments.

  Authorization requires an iLok2. The plug-in is also available as part of the TEC Award nominated PCM Native Reverb Bundle.
specs: |-
  - 60 studio-quality presets
  - Real-time spectral display with input and output metering
  - Parameter automation support
  - Portable preset format
  - iLok2 authorization required
