description: Remove Reverb from Audio. AI-powered plugin for dialogue cleaning
  in post production.
details: |-
  DeRoom is a Machine-Learning based audio plug-in to reduce or remove reverb
  and room resonances in real-time. An artificial neural network has been
  trained on many different room scenarios in order to be able to separate
  direct sound from reflection components. Reverb tails and echoes are
  automatically detected and then precisely suppressed or if desired entirely
  removed.

  DeRoom is perfectly suited to increase the quality and intelligibility of
  speech which has been recorded in very reverberant environments.

  Features include increased speech intelligibility and automatic parameter
  estimation.

  Compatible with Pro Tools, Cubase, Nuendo, Reaper, Ableton Live, Logic Pro,
  Adobe Premiere, Final Cut, and DaVinci Resolve.
