description: DeRoom is a machine-learning based plugin that reduces or removes reverb and room resonances from speech recordings in real time.
details: |-
  DeRoom uses an artificial neural network trained on many different room scenarios to separate direct sound from reflection components, automatically detecting and suppressing reverb tails and echoes.

  The standard version includes automatic room size detection and is well suited to increasing the quality and intelligibility of speech recorded in reverberant environments.

  Compatible with Pro Tools, Cubase, Nuendo, Reaper, Ableton Live, Logic Pro, Adobe Premiere, Final Cut, and DaVinci Resolve.
