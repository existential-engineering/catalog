details: |-
  For 40 years, the BBC Radiophonic Workshop was the place to go for the sound of the impossible – the unruly engine behind the music and effects of Doctor Who, the Goon Show, The Hitchhiker's Guide to the Galaxy, and countless other BBC productions. It was a place of other worlds, and of other sounds.

  Dive into an immaculately sampled collection of vintage synthesisers, tape loops, iconic archives and brand new performances from Workshop members. Revitalised with Spitfire's Solar engine, this library passes the torch from the most forward-thinking minds of early electronic music on to the next generation of producers.

  Learn more
specs: |-
  - 98 presets
  - 1,087 unique sounds
  - Spitfire Solar engine with eDNA interface
  - Content groups: Archive Content, Maida Vale and Found Sounds, Junk Percussion, Tape Loops, Synths and Misc
  - Synths sampled include VCS3, Roland System 100, EMS Vocoder and ARP Odyssey
  - Spitfire Audio App required
