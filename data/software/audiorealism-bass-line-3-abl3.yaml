description: Bring the iconic sound of the TB-303 to your music with ABL3. This
  powerful bassline synthesizer captures the essence of classic acid and rave
  tones, making it ideal for producers of electronic, techno, and house music
details: |-
  AudioRealism Bass Line 3 (ABL3) is the next generation of our critically acclaimed 303 emulation plug-in. ABL3 is a complete redesign from scratch and has been in development for several years with the goal of creating the most authentic emulation possible. Suitable for acid, house and techno.

  The legendary silver box which is hallmark in electronic music has been recreated in ABL3. Sophisticated analog modeling techniques have been employed to create a DSP-algorithm that accurately emulates every aspect of the original TB-303, from growling basses to hollow middles and beeping highs with metal rattling accents. Patterns are composed in a fashion similar to the 303 using the integrated step sequencer with easy to use manipulation functions such as transpose and randomization.

  All controls such at cutoff and resonance have an effective range that is unmatched by most other software synthesizers. The characteristic 18dB/Octave low-pass filter can resonate from 20Hz to 22kHz covering the whole spectrum of sounds that the original 303 produces. This plug-in contains no samples. (The filter is actually 24dB/oct with a 18dB response in audible range.)

  The Pattern Editor provides precise control for writing bass sequences with quick, step-based sequencing. Click and drag pitches to transpose sequences, and unfold the pitch lane for detailed pitch editing across your pattern. Adjust parameters like accent, slide, and octave per step for customization, while real-time editing and previewing let you hear adjustments instantly.

  The Wave Analyzer allows users to transcribe audio patterns from a TB-303 directly into the ABL3 environment, identifying the pitch, timing, and accents of each note played on the original instrument. It can also be used to create random patterns by feeding it any audio file, and it can operate as a pattern sequenced sampler. The Advanced Randomiser can randomize various parameters, including pitch, accent, slide, and step lengths, to create dynamic and evolving sequences that maintain the signature TB-303 feel.
specs: |-
  - Massively authentic TB-303 emulation engine
  - Host hard sync
  - Resizable GUI
  - Classic edit view
  - 3+ Emulation Models ranging from ABL2 to the latest ABL3 version
  - 3 VCO Models, each which different characteristics
  - Pattern edit view
  - Real time advanced randomizer
  - Wave analyzer (for automatically transcribing your TB-303 patterns)
  - Import patterns from Reason Rebirth, Roland T-8, Roland TB-03 and Behringer TD-03
  - Ultra natural knob response, tuned to match the original 303 both in range and response
  - macOS Intel and Apple Silicon, requires macOS 10.13 or higher
  - Windows 64-bit, requires Windows 7 or higher
  - 18dB/Octave low-pass filter resonating from 20Hz to 22kHz (filter is actually 24dB/oct with an 18dB response in audible range)
  - Contains no samples
