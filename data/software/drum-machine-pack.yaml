details: >-
  The air drum machine pack brings together two of the most popular drum machine
  software products ever released, combining drum synth 500 and boom into one
  comprehensive bundle.


  Drum synth 500 is a software drum synthesizer that delivers full control of
  all electronic drum sounds in an easy-to-use, comprehensive interface, with an
  exclusive library produced by sound design veterans behind air music tech
  strike, air structure, sonivox big bang, akai professional's mpc and alesis
  e-drums.


  Drum synth 500 can be used with a MIDI keyboard, pad controller, electronic
  drumkit, or digital audio workstation (DAW) software, and features a powerful
  all-new engine for both live performance (via pc or mac desktop app without
  DAW required) and studio use with all popular plugin formats supported.


  Boom features a slick modern interface that pays homage to the most popular
  vintage drum machines of the past, includes a diverse collection of 10
  different classic electronic drum kits with variations on classic 808 and 909
  kits, more aggressive dance and urban-style kits, and a powerful retro style
  kit modelled on the concept of a 'cr78 merged with a 606'.


  Boom includes an on-board sequencer that enables you to create and trigger
  your own patterns which can be saved and recalled as presets, with a matrix
  display for pattern programming, pattern edit mode with keys along the bottom,
  ability to copy patterns, and controls for adjusting pattern playback in
  normal, double, half or triplet time with swing control mirroring classic
  mpc's and other vintage drum machines/samplers.
