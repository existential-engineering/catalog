description: "The VEQ-1A plugin is not only breathing a new life into a classic,
  but sounds as thick as the real piece and it does hide quite a few tricks."
details: |-
  The VEQ-1A is a 2-band tube EQ plugin that takes you back 60 years to when a tube legend was born and became a part of every pro studio in the world. It breathes new life into a classic, sounding as thick as the real piece while still hiding quite a few tricks.

  One of its signature characteristics is the ability to simultaneously cut and boost the same frequency, which gives the sound a unique quality you can't really get with another EQ. Massive bass, gentle highs and richness — these knobs surely do some analog magic.

  The plugin runs natively in your DAW on macOS or Windows, or in real-time on your Antelope Synergy Core interface, making it suitable for both standard mixing workflows and tracking with low-latency hardware acceleration.
specs: |-
  - 2-Band Tube EQ plugin
  - Tube circuit emulation
  - Simultaneous cut and boost on the same frequency
  - Massive bass, gentle highs and analog-style richness
  - Runs natively in your DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core interfaces
  - macOS: 10.14 Mojave minimum (11 Big Sur or higher recommended), Intel or Apple Silicon
  - Windows: 10/11 (64-bit)
