description: DeeGlue is a bus compressor plug-in designed for glue compression —
  blending individual sounds into a cohesive, integrated mix. With just three
  main parameters (AMOUNT, WIDE, and BASS), it delivers FAT glue compression
  with a groovy, feel-good character, suitable for both beginners and
  experienced engineers.
details: |-
  DeeGlue is a bus compressor plug-in by Dotec-Audio focused on glue compression — a style of dynamics processing that enhances cohesion between individual elements of a mix. The plug-in is designed to be extremely easy to use while delivering professional-quality results for both amateur producers and experienced engineers.

  The core control is the AMOUNT parameter, which adjusts the degree of integration applied to the mix. Simply increasing AMOUNT brings a sense of unity and weight to the sound, making it ideal for bus processing on a master mix or submix channel. The processing is described as producing a FAT glue compression character with a groovy and feel-good sonic quality.

  DeeGlue also includes a WIDE parameter for adjusting stereo width, allowing the compressed signal to be shaped for mono compatibility or enhanced stereo presence. The BASS parameter further enhances low-frequency content through the compression process, adding weight and body to the mix.

  The plug-in has been tested with over 20 DAW hosts including Ableton Live, Logic Pro X, Cubase, Pro Tools, Studio One, FL Studio, Reason, BITWIG STUDIO, Digital Performer, GarageBand, and OBS Studio. A free demo version is available with a 1-second silence every 30 seconds until registration.

  DeeGlue was originally released in October 2022 and received a graphics performance update in January 2026. Sound design was by Franck Shigetora, UI by IZMOJUKI and FUKUDAKOGYO, developed by DOTEC-AUDIO.
