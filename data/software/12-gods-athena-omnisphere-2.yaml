details: |-
  12 gods: athena is the next part of the omnisphere libraries series influenced by the greek gods. This library is dedicated to the goddess of wisdom. Born from the head of zeus, athena was one of the most important goddess of the pantheon and protector of many cities, athens included.

  Each patch is inspired by myths and persons connected with athena in greek mythology. Other bring a sonic dimension to the epithets that were following the goddess and other are dedicated to places or festivals dedicated to athena.

  This soundbank contains 50 intellectual sounds like pads, organs, leads and poly synths. Most of them hold a melodic style identity and dressed with cinematic elements from sci-fi to electronic style soundcolors.

  Mw is assigned to create the classic vibrato and aftertouch is used for modulating the pitch of the patches. The effect rack of each one gives a rich dimension to the sound.
