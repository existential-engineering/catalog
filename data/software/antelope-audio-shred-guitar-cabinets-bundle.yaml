details: |-
  The Shred Guitar Cabinets Bundle is a collection of matching speaker cabinets for the Shred Guitar Amps Bundle. From tiny, yet shrieking 1 x 12 cabs all the way to mighty 4 x 12 half-stacks, it has everything you need to make those amplifiers sing! All speaker and cabinet modeling happens in real-time, letting you record and monitor live with the exact settings you want. Don't worry about latency - it's now a thing of the past.

  Darkface 65 2x12 - classic two-speaker cab from the 60s for vintage rock, jazz, blues and country

  Top30 2x12 - timeless British-tone cabinet for both clean and overdriven sounds

  Modern 4x12 - crushing metal cab with massive low end, thick mid-range and smooth highs

  Green 2x12 - pair of 12-inch OB Green speakers with meaty bass and smooth mids for rock, metal and blues

  Vintage 4x12 - four roaring Vintage speakers, the rock and metal standard for cutting through the mix

  Green 4x12 - four hard-driven OB Green speakers with added bass extension and wider mids

  Caliper 50 1x10 - single 10-inch speaker delivering warm, well-rounded tones from lush cleans to saturated overdrive

  Bluelux 1x12 - dedicated blues cabinet for heartfelt lead tones and hot-rodded rhythms

  Clst 1x12 - British 1x12 known for fearsome distortion

  England 4x12 - balanced rock and metal all-rounder pushable to utter viciousness without losing definition

  Bass Tube 1x15 - 70s-inspired bass cab with a 15-inch speaker for rock, metal and beyond

  Runs in real-time on your Synergy Core interface
