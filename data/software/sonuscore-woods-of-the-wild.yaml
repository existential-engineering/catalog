description: Illuminate the beautiful, mystical side of orchestral music with Woods of the Wild, the latest expansion into the world of THE ORCHESTRA COMPLETE. Features 13 solo wind instruments with 5+ articulations each, ensemble capabilities, and a full orchestral percussion section.
specs: |-
  - 13 solo wind instruments (Flute 1&2, Piccolo, Alto Flute, Oboe 1&2, English Horn, Clarinet 1&2, Bass Clarinet, Bassoon 1&2, Contrabassoon)
  - 5+ articulations per solo instrument
  - 4 ensemble articulations
  - 34 voicings for Ensemble Engine
  - 38 ensemble voicings
  - 75 ensemble rhythms
  - 128 ensemble presets
  - 100+ single NKIs
  - 13 multi-articulation NKIs
  - Pure Performance Legato technology
  - MIDI-export functionality
  - 16,000+ individual samples
  - 6.1 GB data storage
  - Orchestral percussion: Taiko, Tom Ensemble, Gran Cassa, Tam Tam, Snare, Cymbals, Celesta, Crotales, Marimba, Vibraphone, Xylophone, hand percussion
  - Requires Kontakt 6.7.1 or higher (Free Kontakt Player compatible)
  - macOS 10.14+ (Intel Core 2 Duo or higher)
  - Windows 10+ (Intel Core 2 Duo or AMD Athlon 64 X2 or higher)
  - 8 GB RAM minimum
  - 6.1 GB free disk space
