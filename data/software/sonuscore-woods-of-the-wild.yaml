description: Illuminate the beautiful, mystical side of orchestral music with
  Woods of the Wild, the latest expansion into the world of THE ORCHESTRA
  COMPLETE. Features 13 solo wind instruments with 5+ articulations each,
  ensemble capabilities, and a full orchestral percussion section.
details: |-
  Woods Of The Wild is Sonuscore's woodwind expansion for THE ORCHESTRA COMPLETE, an individually recorded woodwind section intended to complete an orchestral palette. It reaches past the standard section with triple tongues, rips and trills, and covers wind instruments beyond the core four, including piccolo, alto flute and English horn. Alongside the winds it carries mallets and other wooden drums for percussive weight. The library works as a stand-alone instrument and is also included in THE ORCHESTRA COMPLETE 3, and now in THE ORCHESTRA COMPLETE 4.

  The instrument list runs to Flute 1&2, Piccolo Flute, Alto Flute, Oboe 1&2, English Horn, Clarinet 1&2, Bass Clarinet, Bassoon 1&2 and Contrabassoon, plus three percussion groups: big percussion (taikos, tom ensemble, gran cassa, tam tam, snare drum, piatti, suspended cymbals), tuned percussion (celesta, crotales, marimbaphone, vibraphone, xylophone) and hand percussion (castanets, claves, rods, shaker, sticks, woodblocks, finger cymbals, marktree, tambourine, triangle). All woodwind instruments were recorded in three dynamic layers, with each sample hand-edited to morph smoothly between layers.

  A redesigned Pure Performance Legato engine distinguishes fast true legato from staccato runs without key switches, with more than 400 transitions per instrument fitted independently into the intervals. The Ensemble Engine, carrying the updates from THE ORCHESTRA COMPLETE 3, lets a full orchestration be played from a single chord: instruments can be assigned to individual chord tones through the Voicings selection or taken from the pre-arranged voicings, and up to 5 instruments load at once with each slot assignable to one of five modules. The Sequence Designer, also carried over from THE ORCHESTRA COMPLETE 3, runs three independent arpeggiators and two envelope engines whose shapes can be drawn freely, so patterns can be built rather than chosen from a fixed list.

  Beyond the ensemble patches the library holds over 86 single articulation patches, 13 multi articulation patches and 7 percussion patches for writing from scratch, and ensemble-multi patches that load and layer multiple instances for quick orchestral sketching and for animated orchestra and orchestral rhythm arrangements. A performance built from a preset can be dragged and dropped out of the instrument into a DAW as MIDI. It runs in the free KONTAKT PLAYER.
specs: |-
  - 13 solo wind instruments with 5+ articulations each, plus bonus winds
  - 4 ensemble articulations
  - Woodwinds: Flute 1&2, Piccolo Flute, Alto Flute, Oboe 1&2, English Horn, Clarinet 1&2, Bass Clarinet, Bassoon 1&2, Contrabassoon
  - Big percussion: taikos, tom ensemble, gran cassa, tam tam, snare drum, piatti, suspended cymbals
  - Tuned percussion: celesta, crotales, marimbaphone, vibraphone, xylophone
  - Hand percussion: castanets, claves, rods, shaker, sticks, woodblocks, finger cymbals, marktree, tambourine, triangle
  - Woodwinds recorded in three dynamic layers, hand-edited to morph between layers
  - Pure Performance Legato with more than 400 true legato transitions per instrument, no key switches needed
  - Ensemble Engine with 38 ensemble voicings and assignable chord tones across instrument groups
  - 75 ensemble rhythms
  - 128 ready-to-go ensemble presets with filters and categories
  - Sequence Designer with three independent arpeggiators and two freely drawable velocity envelopes
  - Load up to 5 different instruments together, each slot assignable to 1 of 5 modules
  - Over 86 single articulation patches, 13 multi articulation patches and 7 percussion patches
  - 100+ new single NKIs and 13 new multi articulation NKIs
  - Ensemble-multi patches that load and layer multiple instances
  - MIDI export by drag and drop of a performance into the DAW
  - 16,000+ individual samples, 6.1 GB of data
  - Works with the FREE KONTAKT PLAYER (KONTAKT 6.7.1 or higher)
  - Mac OS X 10.14 or higher, Intel Core 2 Duo
  - Windows 10 or higher, Intel Core 2 Duo or AMD Athlon 64 X2
  - 8 GB RAM (more recommended)
  - At least 6.1 GB of free hard disc space
