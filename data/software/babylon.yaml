description: Babylon gives you the ultimate control of your frequency domain
  through a stunning, modern interface.
details: |-
  Babylon is a comprehensive multi-band EQ featuring eight fully automatable
  filter types, a high-resolution spectrum analyser, the ability to combine any
  of the eight filter types across the seven filter bands, and stunning visuals.

  Each of the seven built-in filters can use any of the eight filter types
  giving a huge amount of customisation for you to achieve your perfect sound.

  The colourful spectrum analyser gives you the perfect visual representation of
  your frequency domain and with the option to choose the block size and ramp
  you can adjust the analyser to your exact needs.

  The input signal is shown in the background of the spectrum in grey to show
  the exact effect of your chosen filter settings.

  Use the control points on the spectrum analyser to quickly and easily adjust
  the parameters of each filter.
specs: |-
  - Eight fully automatable filter types
  - Seven filter bands
  - High-resolution spectrum analyser
  - Multi-band EQ
  - Adjustable block size and ramp
  - Control points on spectrum analyser
