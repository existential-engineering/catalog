details: >-
  Ableton drum racks for superior drummer 3 the blues ezx features separate
  ableton drum racks for all factory presets for the toontrack superior drummer
  3 and the blues ezx library supplied with toontrack ezdrummer. These racks
  provide out of the box integration workflow between ableton live and toontrack
  superior drummer using the toontrack libraries including a host of features
  ready to use for composition and performance using ableton push or similar
  controllers.


  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all the blues ezx factory presets from ableton push
  controller device browser. Colour coded pad design for visual performance and
  finger drumming.


  10 ableton drum racks to instantly load the factory library mix ready presets
  with ableton mappings. 5 ableton live templates designed to host the multi
  channel output routing presets with track level audio routing from superior
  drummer 3 into ableton live. Vast array of instrument articulations ready to
  go in one massive layout using ableton push 64 pad layout mode.


  Singleout presets feature 5 ableton drum racks for all the blues ezx factory
  presets single audio output to a single ableton track. Multiout presets
  feature 5 ableton drum racks for all the blues ezx presets in multiple audio
  channel output from the plug in to multiple ableton audio tracks using the 5
  multi output ableton templates also provided designed for the kit presets.


  Use the template racks and extend to your own toontrack superior drummer 3 the
  blues ezx presets, swapping out individual sounds or articulations. You are
  100% ready to go with the factory presets but there is no limitation to
  creating your own presets from these templates. Simply save a new drum rack
  based upon the modified timbresandtones template.
