details: |-
  BPB Bassaturator is a freeware bass booster plugin for Windows and macOS.
  Designed for bass processing, it combines a push-pull style equalizer with
  three saturation types to transform ordinary bass sounds into powerful
  basslines that cut through the mix.

  The "sub" section uses a boost knob to target a specific frequency range while
  attenuating the surrounding frequencies, resulting in a clearer and more
  defined low-end. This technique is inspired by the pultec eq push-pull method,
  commonly used to achieve a balanced bass response.

  The "bass" section adds three types of harmonic saturation (dirt, body, and
  tape) and shapes the tone of the bass signal. Dirt adds aggressive distortion
  ideal for cutting through a mix. Body enhances clarity in the mids and
  saturates the high-mid frequencies, perfect for bass guitars and tightening
  synth bass sounds. Tape smoothens and adds warmth, creating a rounded, present
  bass tone and is also suitable for use on bus channels.

  Once saturation is applied, users can shape the sound further with a low-pass
  filter and balance the processed and dry signals using the mix knob.
specs: |-
  - VST3 plugin format
  - Audio Units plugin format
  - Push-pull style equalizer
  - Three saturation types (dirt, body, tape)
  - Sub-bass EQ with boost knob
  - Harmonic saturation
  - Low-pass filter
  - Dry/wet mix control
  - Resizable gui
  - Bypass function
