description: A compressor and saturation plug-in developed by Korneff Audio with
  Shure and Tchad Blake, modelled on the Shure Level-Loc. Usable on drums,
  vocals, guitars, keyboards and the mix bus. Features three vintage units
  modeled (two owned by Tchad Blake), adjustable filtering, battery drain
  simulation, impedance settings, customizable release times and sidechain EQ,
  gain and mix controls, and hundreds of presets.
details: |-
  The only Level-Loc plug-in licensed by Shure and endorsed by Tchad Blake. Tchad discovered the Shure Level-Loc while working on Tom Waits' album Bone Machine. As Tchad puts it, "The Level-Loc changed my life." He's not made a record without it since.

  Digital Control to Unleash Your Creativity. The Shure Level-Loc plug-in can be used on all sound sources. Get slamming drums, soulful vocals, wicked lo-fi guitars and bass with attitude, thanks to expanded controls that greatly extend the versatility of Level-Loc. It's no longer just a box for drums. Use it on everything, even the mix bus. Korneff Audio modeled three vintage units, including two owned by Tchad Blake, and there's hundreds of presets to get your ideas flowing.

  Experience the Magic of the Hardware. The unique combination of compression and saturation that is the Level-Loc is waiting for your tracks. The entire circuit is precisely modeled, from the FET limiter to the transformers, in the only Level-Loc plug-in that is approved by Shure and endorsed by Tchad Blake.

  What can you do with a Level-Loc? Squash and mangle with compression for huge, punchy drums that jump out of the speakers. Overdrive transformers for warm saturation to enhance low-end. Add a vintage glow to vocals and acoustic instruments. Get ratty, lo-fi guitar and keyboard sounds. Parallel process anything for a larger, analog sound.
specs: |-
  - Filtering: pass filters to focus on exactly the frequencies you want to process and remove excessive lows and highs
  - Battery Drain: mimic the effect of old, dying batteries, lowering voltage to change saturation and the bloom of the Level-Loc
  - Impedance: change the gain structure and the effect of transformer saturation and lag
  - Release: adjustable release times to fit the dynamics of the track
  - Sidechain: fully adjustable sweepable sidechain EQ to target the compression
  - Gain & Mix: gain staging plus a mix control for how much Level-Loc flavor is applied
  - Three vintage units modeled, including two owned by Tchad Blake, with hundreds of presets
  - Entire circuit modeled, from the FET limiter to the transformers
  - Licensing: iLok dongle or iLok Cloud account, up to four (4) simultaneous machine activations, internet connection required for activation and for all demos, 7 day full-function demo
  - Minimum system: Intel, AMD or Apple Silicon i5 quad core processor, 4GB of RAM, Mac OS X 10.14 or higher, Windows 7 and above, screen resolution 1024 x 768 or higher
  - Supported plugin formats: Mac 64bit (VST3, AU, AAX), Windows 64bit (VST3, AAX)
