description: The ultimate character compressor, developed by Korneff Audio with Shure and Tchad Blake. This is the best sounding, most versatile Level-Loc available. Functions as a compression and saturation tool for drums, vocals, guitars, keyboards, and mix bus processing. Features three vintage units modeled (two owned by Tchad Blake), adjustable filtering, battery drain simulation, impedance settings, customizable release times and sidechain EQ, gain and mix controls, and hundreds of presets.
details: |-
  The Shure Level-Loc plugin is the only Level-Loc plugin officially licensed by Shure and endorsed by Tchad Blake. It faithfully models the vintage FET limiter with transformer saturation that Grammy-winning producer Tchad Blake famously discovered while working on Tom Waits' iconic Bone Machine album.

  The plugin features adjustable pass filters for frequency targeting, a Battery Drain control that simulates the effect of a dying battery on the saturation character, and Impedance Controls for modifying the gain structure and transformer saturation behavior. Release time controls allow detailed dynamics sculpting across a wide range of applications.

  A fully sweepable Sidechain EQ enables frequency-selective compression, while Gain and Mix controls provide precise output staging and parallel blend capabilities. The plugin supports parallel processing workflows, making it suitable for drum rooms, vocals, guitars, bass, and mix bus applications.

  Licensing is software-based with no USB dongle required, supporting up to four simultaneous machine activations.
