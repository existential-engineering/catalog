description: The ultimate character compressor, developed by Korneff Audio with Shure and Tchad Blake. This is the best sounding, most versatile Level-Loc available. Functions as a compression and saturation tool for drums, vocals, guitars, keyboards, and mix bus processing. Features three vintage units modeled (two owned by Tchad Blake), adjustable filtering, battery drain simulation, impedance settings, customizable release times and sidechain EQ, gain and mix controls, and hundreds of presets.
details: |-
  The only Level-Loc plug-in licensed by Shure. The original unit was used by Tchad Blake while working on Tom Waits' album Bone Machine.

  The plug-in can be used on all sound sources: slamming drums, soulful vocals, wicked lo-fi guitars and bass with attitude, thanks to expanded controls that greatly extend the versatility of the Level-Loc. It is no longer just a box for drums. Three vintage units were modelled, including two owned by Tchad Blake, and hundreds of presets are included to get ideas flowing.

  Squash and mangle with compression for huge, punchy drums, overdrive the transformers for warm saturation that enhances the low end, add a vintage glow to vocals and acoustic instruments, or get ratty, lo-fi guitar and keyboard sounds. Parallel processing gives anything a larger, analog sound.

  The digital controls extend the hardware. Pass filters focus on exactly the frequencies you want to process. Battery Drain mimics the effect of old, dying batteries, lowering the voltage to change saturation and bloom. Impedance settings change the gain structure and the effect of transformer saturation and lag. Adjustable release times sculpt the unit to the dynamics of a track without a soldering iron.

  A fully adjustable sweepable sidechain EQ targets the compression so you can pick out what to emphasize or ignore, and Gain and Mix controls set the gain structure and how much Level-Loc flavor is blended in. The entire circuit is modelled, from the FET limiter to the transformers.
specs: |-
  - Modelled on three vintage Shure Level-Loc units, two of them owned by Tchad Blake
  - Complete circuit model, from FET limiter to transformers
  - Hundreds of presets, including Shure, Korneff and Tchad Blake sets
  - High and low pass filters
  - Battery Drain control to simulate dying batteries
  - Switchable impedance affecting gain structure, transformer saturation and lag
  - Adjustable release times
  - Fully adjustable sweepable sidechain EQ
  - Gain and Mix controls for parallel processing
  - Software-based licensing, no USB or hardware dongle and no special drivers
  - Activation on up to four machines at the same time
  - Minimum: Intel, AMD or Apple Silicon i5 quad core processor
  - Minimum: 4GB of RAM
  - Minimum: macOS 10.14 or higher, Windows 7 and above
  - Minimum screen resolution: 1024 x 768
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
  - Internet connection required for activation and for demos
