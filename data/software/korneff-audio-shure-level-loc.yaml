description: "A compressor and saturation plug-in developed by Korneff Audio with Shure and Tchad Blake, modelled on the Shure Level-Loc. Usable on drums, vocals, guitars, keyboards and the mix bus. Features three vintage units modeled (two owned by Tchad Blake), adjustable filtering, battery drain simulation, impedance settings, customizable release times and sidechain EQ, gain and mix controls, and hundreds of presets."
details: |-
  The only Level-Loc plug-in licensed by Shure. The original unit was used by Tchad Blake while working on Tom Waits' album Bone Machine.

  Expanded controls extend the plug-in past the drum applications the hardware was known for, to vocals, guitars and bass. Three vintage units were modelled, including two owned by Tchad Blake, and hundreds of presets are included.

  Documented applications include heavy compression on drums, transformer overdrive for low-end saturation, gentler settings on vocals and acoustic instruments, and lo-fi guitar and keyboard tones. Gain and Mix support parallel processing.

  The digital controls extend the hardware. Pass filters restrict the range being processed. Battery Drain models the effect of dying batteries, lowering the voltage to change saturation and bloom. Impedance settings change the gain structure and the effect of transformer saturation and lag. Release times are adjustable, which the hardware does not offer.

  A fully adjustable sweepable sidechain EQ targets the compression to particular frequencies, and Gain and Mix controls set the gain structure and the balance of processed to dry signal. The entire circuit is modelled, from the FET limiter to the transformers.
specs: |-
  - Modelled on three vintage Shure Level-Loc units, two of them owned by Tchad Blake
  - Complete circuit model, from FET limiter to transformers
  - Hundreds of presets, including Shure, Korneff and Tchad Blake sets
  - High and low pass filters
  - Battery Drain control to simulate dying batteries
  - Switchable impedance affecting gain structure, transformer saturation and lag
  - Adjustable release times
  - Fully adjustable sweepable sidechain EQ
  - Gain and Mix controls for parallel processing
  - Software-based licensing, no USB or hardware dongle and no special drivers
  - Activation on up to four machines at the same time
  - Minimum: Intel, AMD or Apple Silicon i5 quad core processor
  - Minimum: 4GB of RAM
  - Minimum: macOS 10.14 or higher, Windows 7 and above
  - Minimum screen resolution: 1024 x 768
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
  - Internet connection required for activation and for demos
