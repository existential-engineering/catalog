description: A free spring reverb emulation modeled on an incredibly rare compact spring reverb unit from the 1960s, originally built for the BBC. The original hardware offered only a single effect gain control; VREV-666 adds a Mix knob, up to 150 ms of pre-delay, a Tone EQ to tame the pronounced bass resonance typical of the spring system, and a built-in limiter to prevent digital clipping. Delivers vibrant, bouncy, and unpredictable electromechanical spring character.
details: |-
  Emulates a rare 1960s BBC compact spring reverb unit (the unit bears the same VREV-666 designation — specific manufacturer not publicly documented). Original hardware: single Effect gain control. Plugin adds: Mix knob, PreDelay up to 150 ms, Tone EQ (attenuates bass resonance from spring system), built-in limiter with GR indicator light and Effect Limiter knob. Free with account creation on fuseaudiolabs.de. 32-bit and 64-bit versions.
specs: |-
  - Controls: Effect (gain), Mix, PreDelay (up to 150 ms), Tone, Limiter (Effect Limiter knob + GR LED)
  - macOS 10.9+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+ (32-bit and 64-bit), 2 GB RAM, 1280x1024 display
  - Formats: VST2, VST3, AU, AAX
  - No copy protection required; account creation needed
