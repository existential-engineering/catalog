description: Acon Digital Verberate is an algorithmic reverb plug-in that simulates real acoustical spaces with a new degree of realism. Verberate is available for PC and Macintosh and supports the VST, AAX and AU plug-in formats. Both 32 bit and 64 bit versions are available.
details: |-
  The free Verberate Basic is based on Verberate 2 and offers the same highly praised audio quality. It is built around the revolutionary Vivid Hall algorithm, which is time variant and resonance free, so reverb tails avoid the stiffness of convolution while keeping a natural, high density character.

  The plug-in offers four high quality presets drawn from Verberate 2 that showcase the quality and versatility of the algorithm. Plate is a realistic simulation of plate reverb with the typical frequency dispersion and decay properties that give plate reverb its airy touch. Room is a warm wooden room that gives a great sense of space without being obtrusive.

  Hall is a natural and gorgeous sounding hall, while Lush Hall is a colorful, out-of-world hall with frequency modulated tails that sounds amazing on synth pads. The intuitive user interface has a button for each of the four reverb programs along with a mix knob for adjusting the balance between dry and reverb signal levels.

  Under the hood, independent early reflections and reverberation tail processors work together with true stereo processing. The realistic early reflections blend into the mix without unpleasant comb filter effects and are followed by dense late reverberation tails, and an optional swirl effect models the frequency modulated, cloud-like tails of vintage digital reverb units.

  Acon Digital Verberate Basic 2 is available as VST, VST3 or AAX for both Windows and Mac, or as an AU plug-in on Mac. There are 32 bit and 64 bit versions for Windows; the Mac version is 64 bit and runs natively on both ARM (such as Apple M1) and Intel processors.
specs: |-
  - Based on the Vivid Hall algorithm that is time variant and resonance free
  - Four reverb programs: Plate, Room, Hall and Lush Hall
  - Mix control for adjusting dry and reverb signal levels
  - Independent early reflections and reverberation tail processors
  - True stereo processing
  - Realistic early reflections that blend into the mix without unpleasant comb filter effects
  - Dense late reverberation tails
  - Able to model frequency dispersion in mechanical plate reverbs
  - Optional swirl effect models the frequency modulated cloud-like reverb tails of vintage digital reverb units
  - Uncluttered user interface
  - Supports sampling rates up to 96 kHz
  - Mono and stereo (true stereo processing)
  - Native 32 bit or 64 bit versions of all plug-ins are available for Windows; the Mac version is 64 bit
  - Windows: Windows 7 / 8.x / 10 / 11, Intel Core i3 or AMD multi-core processor, 1 GB RAM, 1 GB free HD space, 1366 x 768 display
  - macOS: macOS / OS X 10.9 or later, runs natively on ARM64 and Intel, 1 GB RAM, 1 GB free HD space
  - Requires a host application compatible with VST, VST3, AAX (Pro Tools 10.3.5 or higher on Windows, 11 or higher on Mac) or AU (Mac)
