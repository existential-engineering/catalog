description: Acon Digital Verberate is an algorithmic reverb plug-in that simulates real acoustical spaces with a new degree of realism. Verberate is available for PC and Macintosh and supports the VST, VST3, AAX and AU plug-in formats. Both 32 bit and 64 bit versions are available.
details: |-
  The free Verberate Basic is based on Verberate 2 and offers the same highly praised audio quality. The plug-in offers four high quality presets from Verberate 2 that showcase the quality and versatility of the algorithm: Plate, a realistic simulation of plate reverb with the typical frequency dispersion and decay properties that give plate reverb the airy touch; Room, a beautiful and warm wooden room that gives a great sense of room without being obtrusive; Hall, a natural and gorgeous sounding hall; and Lush Hall, a colorful out-of-world hall with frequency modulated tails that sounds amazing on synth pads.

  The intuitive user interface has buttons for each of the four reverb programs along with a mix knob that lets you adjust the dry and reverb signal levels.

  Acon Digital Verberate Basic 2 is available as VST, VST3 or AAX for both Windows and Mac or as AU plug-ins for Mac. There are 32 and 64 bit versions for Windows. The Mac version is 64 bit and runs natively on both ARM (such as Apple M1) and Intel processors.
specs: |-
  - Based on the Vivid Hall algorithm that is time variant and resonance free
  - Independent early reflections and reverberation tail processors
  - True stereo processing
  - Realistic early reflections that blend into the mix without unpleasant comb filter effects
  - Dense late reverberation tails
  - Able to model frequency dispersion in mechanical plate reverbs
  - Optional swirl effect models the frequency modulated cloud-like reverb tails of vintage digital reverb units
  - Uncluttered user interface
  - Available as VST, VST3 or AAX plug-ins on PC (Windows)
  - Available as VST, VST3, AAX or AU plug-ins on Apple Macintosh (macOS)
  - Native 32 bit or 64 bit versions of all plug-ins are available for Windows. The Mac version is 64 bit.
  - Supports sampling rates up to 96 kHz
  - Mono and stereo (true stereo processing)
  - Windows: Windows 7 / 8.x / 10 / 11, Intel Core i3 or AMD multi-core processor (Intel Core i5 or faster recommended)
  - Windows: 1366 x 768 display resolution (1920 x 1080 or higher recommended), 1 GB RAM (4 GB or more recommended), 1 GB free HD space
  - Windows: A host application that is compatible with (32 bit or 64 bit) VST, VST3 or AAX (Pro Tools 10.3.5 or higher)
  - macOS: macOS / OS X 10.9 or later, runs natively on ARM64 and Intel
  - macOS: 1 GB RAM (4 GB or more recommended), 1 GB free HD space
  - macOS: A host application that is compatible with (64 bit) AU, VST, VST3 or AAX (Pro Tools 11 or higher)
