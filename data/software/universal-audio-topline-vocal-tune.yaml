description: Realtime vocal tuning with ultra-low latency, covering subtle
  correction through hard-tuned effects.
details: |-
  Topline Vocal Tune applies realtime pitch correction to vocals at near-zero latency, so a tuned signal can be monitored in headphones while tracking.

  Shift Mode adds creative pitch shifting with formant controls, and a key finder locks to any key and scale automatically. Natural vocal settings preserve the character of the source.

  The plug-in runs natively on macOS and Windows, or accelerated on Apollo audio interfaces and UAD Accelerators. In the LUNA digital audio workstation the native and Apollo DSP versions can be exchanged with settings preserved.
specs: |-
  - Realtime pitch correction at near-zero latency
  - Shift Mode with pitch shifting and formant controls
  - Automatic key and scale detection
  - MIDI repitching
  - UAD Native and Apollo DSP versions
  - Settings preserved when exchanging versions in LUNA
