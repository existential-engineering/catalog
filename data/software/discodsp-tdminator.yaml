description: TD-3 editor and acid sequencer for iPhone, iPad and Mac with
  piano-roll grid, pattern generator and full SysEx control.
details: |-
  A performance editor and programmer for the Behringer TD-3, covering every color variant (TD-3-BK, RD, SR, AM, BU, WH) plus the TD-3-MO. Program patterns on a fast piano-roll grid, generate 303-style acid lines in a tap, and send them straight to the hardware, or run the built-in sequencer with no device connected. Editing works while the pattern plays, so notes, accents and slides can be changed as it runs.

  Single-octave piano-roll grid with piano-key pitch column and octave-selector rows, note-name labels on every active note, per-step Accent and Slide rows, and a red-glow playhead. Tracker-style two-row computer keyboard note entry (ZXCV and QWER rows). RANDOM generates scale-locked 303-style acid lines with acid scales, octave hops, groove density, beat accents and glides.

  Full TD-3 MIDI SysEx control with auto-reconnect, working with every TD-3 color edition and the TD-3-MO. Explicit Backup (device to file) and Send (file to device), with a software fallback sequencer when no hardware is connected. Synthtribe .sqs bank import and export, plus MIDI (.mid) export for a single pattern or the whole bank.

  AUv3 plugin and standalone app for AUM, GarageBand, Cubasis, Logic and any AUv3 host, with host tempo and transport sync. Fully resizable editor that scales to fit iPhone, iPad and Mac.
