description: Babylon 2 is a single page virtual synthesizer built around multi-voice oscillators and morphing wavetables, with a wavetable editor for creating, editing and importing waves. It expands the original Babylon with new filter types, reworked effects, additional modulators, an arpeggiator and per-note microtonal tuning in cents across 11 octaves.
details: |-
  Babylon 2 is a complete overhaul of the original one page Babylon synthesizer. It keeps the single interface page of its predecessor while shifting the focus onto multi-voice oscillators and morphing wavetables, with expanded filters, reworked effects and wider control over modulation, arpeggiation and tuning.

  The multi-voice oscillators cover traditional stereo unison and detuning alongside two new modes: Multi for seamless waveform blending and Quad for live morphing. The W-Lab wavetable editor removes the limit of predefined waveforms, letting users create, modify or import their own WAV files.

  Filter types include SVF, IIR and Bi-quad designs alongside classic and more experimental options. The effects section covers improved reverb, delay and distortion, a newly added tempo-synced phasing effect, and a stereo ping-pong effect.

  Modulation includes a curve editor for the envelope modulators, additional envelope followers and two new key-track modulators with precise line editors, on top of the LFO, vibrato and envelope modulators carried over from version 1. The arpeggiator has an intelligent pattern generator with population and complexity parameters.

  The microtonal tuning section allows every individual note across 11 octaves to be tuned in cents, and the Scale Bank holds 23 standard scales plus 34 further scales, some using quarter tones. Other additions include eight new noise types, extended detune modes and range, a customizable pitch pedal parameter, improved legato and portamento and increased polyphony. Over 200 high-resolution waveforms and 858 factory presets ship with the synth, catalogued in an onboard browser.
specs: |-
  - One page synth programming
  - Multi and Quad oscillation modes
  - W-Lab wavetable editor with WAV import
  - Scale and per-note microtonal options across 11 octaves
  - 23 standard scales and 34 additional scales
  - Intelligent arpeggiator with population and complexity controls
  - SVF, IIR and Bi-quad filter types
  - Reverb, delay, distortion, tempo-synced phasing and stereo ping-pong effects
  - Curve editor for envelope modulators, envelope followers and key-track modulators
  - Eight noise types
  - 200+ high-resolution waveforms
  - 858 factory presets
  - Retains the original Babylon features
  - Full PDF manual and tutorial video
  - Windows 8 and later
  - macOS 10.13 and later
