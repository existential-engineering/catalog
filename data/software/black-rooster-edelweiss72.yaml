description: A vintage channel strip plugin combining an expander, 5-band M/S EQ, compressor and limiter with K-metering for mixing and mastering.
details: |-
  The Edelweiss'72 is a vintage-flavoured channel strip that puts a full mixing and mastering chain behind a single insert: an expander, a five-band equalizer, a compressor and a brickwall limiter, wired in the order a seasoned engineer would actually patch them. It's the plugin you reach for when a mix is nearly there but needs shaping step by step, opening the dynamics back up, carving the tone, gluing it together, and capping the peaks without leaving the channel.

  Most channel strips ask you to commit to their signal flow. This one hands you seventeen individual bypasses and per-section solo, so you can audition each stage on its own, compare before and after, and switch a module out of the path the moment it stops helping.

  The chain opens with an expander that widens dynamic range back out and decimates unwanted distortion around the threshold with a static soft-knee before tone shaping begins. From there the signal hits a five-band EQ with fixed frequency centres (80Hz low shelf, 450Hz low band, 1.5kHz mid, 4.5kHz high band, 12kHz high shelf), each offering plus/minus 15dB, with a per-section plus/minus 30dB output gain trim. Flipping to M/S mode lets you edit the mid and side signals separately, and linear-phase filtering keeps band edges phase-coherent on buses and masters. After the EQ, a soft-knee compressor with auto-gain adds density, and a final limiter with ceiling and auto-gain catches remaining peaks.

  A full metering toolchain stays in view: K-12, K-14 and K-20 scales borrowed from Bob Katz's metering system, plus phase correlation and L/R balance monitoring, so the impact of compression or EQ-based stereo widening is visible in real time.

  On the mix bus, the expander can recover snap on a drum-heavy submix, the EQ in M/S can brighten the sides without touching a centred vocal, and the compressor and limiter provide glue and peak control in a single pass. In mastering, the linear-phase EQ and K-scale metering support surgical spectral moves and controlled final loudness.
specs: |-
  - Expander: Threshold, Ratio 1:1 to 10:1, Attack, Release, static soft-knee
  - Five-band fixed-frequency EQ: 80Hz low shelf, 450Hz low band, 1.5kHz mid, 4.5kHz high band, 12kHz high shelf, each +/-15dB with +/-30dB output gain trim per section
  - L/R and M/S processing modes with anti-circular gain inversion band linking
  - Linear-phase (FIR) EQ option in addition to standard IIR filtering
  - Compressor with auto gain: Threshold, Ratio to 10:1, Attack, Release, Gain
  - Brickwall limiter stage: Ceiling, Release, Gain, Auto Gain
  - 17 individual bypasses and per-section solo
  - K-12/K-14/K-20 metering with phase correlation and L/R balance
  - Real-time SPICE-type component-based circuit emulation
  - SSE2-optimised DSP
  - Auto-adjusted oversampling (linear-phase Dolph-Chebyshev polyphase design)
  - HighDPI/Retina support on macOS and Windows
