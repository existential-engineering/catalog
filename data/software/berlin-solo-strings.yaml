details: |-
  Expressive and detailed solo strings—take control of four virtuoso soloists,
  ready to perform each note with finesse and precision. With three distinct
  playing styles, multiple legato options, and a wealth of articulations, these
  four solo instruments deliver the sweet spot between intuitive playability and
  comprehensive detail.

  The four instruments in berlin solo strings are designed to perform as
  soloists—their rich, complex sound and expression let them shine when playing
  alone. But they're equally at home taking on melodic duties in front of a
  bigger string section, where their character and dynamics allow them to soar
  over the wider sections.

  3 styles or moods, each with legato and special transitions including slurs
  and portamento. Expressive vibrato control. Up to 27 articulations per
  instrument, consistent across instruments. Multiple rebow options. Measured
  trills with multiple intervals. Special fx articulations, swells, and
  ornaments. 8 mic positions.

  Works perfectly with other berlin series collections. Recorded at teldex
  scoring stage, berlin.

  And of course, recorded in situ, these four soloists also combine well as a
  quartet.
specs: |-
  - Virtual instrument collection plugin
  - Sineplayer
  - Four solo instruments (violin I, violin ii, viola, cello)
  - 3 playing styles
  - Multiple legato options
  - Up to 27 articulations per instrument
  - Expressive vibrato control
  - Multiple rebow options
  - Measured trills with multiple intervals
  - Special FX articulations
  - Swells and ornaments
  - 8 mic positions
