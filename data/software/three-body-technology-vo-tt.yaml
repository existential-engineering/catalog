description: VO-TT (VOcal-oTT) is an OTT-style multiband dynamics processor designed specifically for vocal mixing. It features five frequency bands with expander, upward compressor, and downward compressor components to professionally balance vocal sounds.
details: |-
  VO-TT (VOcal-oTT) is an intuitive OTT-style multiband dynamics processor designed for vocal mixing. With minimal tweaks it transforms vocal content into a balanced, professional sound.

  OTT, short for "Over The Top," is a preset in Ableton's Multiband Dynamics processor known for making tracks sound bold, exciting, and larger than life. Although highly prized by EDM producers, the original OTT poses many limitations when applied to vocals. VO-TT takes the OTT concept of expander, upward compressor and downward compressor and tunes it across five vocal-specific frequency bands, for mixing, live performance or casual singing alike.

  Each of the five frequency bands is dedicated to a different facet of vocal sound. Within a band, the downward compressor tames overly loud peaks, the upward compressor subtly boosts softer signals, and the expander further attenuates the quietest sounds to reduce noise, giving vocals a frequency-balanced sound that stands out in the mix.

  Twelve processing styles cover almost every usage scenario, so a suitable starting point is available for any type of vocal content. In most cases adjusting the sliders for each frequency band is enough. The Amount and Mix controls allow extreme effects at 200% or a subtle touch instead.

  VO-TT takes a non-intrusive role in the workflow, enhancing processing rather than replacing the engineer's own touch, and resolves most vocal issues with minimal adjustment so that attention can stay on creative tasks.
specs: |-
  - Five vocal-specific frequency bands, each with downward compressor, upward compressor and expander
  - Twelve processing styles
  - Amount and Mix controls, with effects up to 200%
  - Zero latency for live and production use
  - Dry mix
  - Undo/Redo
  - A/B switching
  - User-defined default settings
  - Supports L/R and M/S stereo processing modes
  - Extreme CPU optimization
  - Apple Silicon native support
  - macOS Retina / Windows high-DPI support
  - Minimum system requirements: Intel or AMD CPU with SSE 4.1 instruction set, or Apple Silicon
  - macOS 11 / Windows 8
  - 4GB RAM and 100MB disk space
  - Supported plugin formats: 64-bit VST2, VST3, AAX and Audio Unit
  - Free demo has no time limit and needs no registration. Saving and loading are disabled and there is 2 seconds of silence every 10 minutes
