description: All-in-one mastering software to create Red Book CDs, DDP images, vinyl and digital exports with built-in HOFA plugins and pro metadata support.
details: |-
  CD-Burn.DDP.Master is HOFA-Plugins' standalone mastering and pre-mastering application for macOS and Windows. It covers the final stage of a production inside a single project, producing Red Book audio CDs, DDP images for pressing plants, vinyl-ready exports and files for streaming and download distribution.

  Audio files are imported and assembled on a timeline where clips can be cut and trimmed, given fade-ins and fade-outs from six different fade curves, and overlapped to create crossfades using the same curve set. Track markers are created automatically from markers found in imported wave files, and an audio CD can be imported directly and converted into a DDP image along with its track markers, CD-Text and other metadata where the drive supports it.

  All HOFA plugins, which the page values at over €1,000 in total, can be used inside the app at no additional cost, and all of their parameters can be automated. Dithering is handled by HOFA's internal processing in this edition; hosting third-party VST3 and AU plugins, plugin chain presets, clip-based plugin processing and True Peak normalisation are reserved for the separate PRO version.

  The Tag Editor manages CD-Text, ISRC and EAN codes alongside track titles and artist and album information, and PQ sheets can be exported as customisable PDFs. Multi-CD projects let a long recording or audiobook be split across any number of discs in one project and burned as a batch or exported as DDP images, while multi-session CDs can carry computer-readable data such as pictures, videos or lyrics beside the audio tracks. A connection to HOFA DDP Player Maker turns a finished DDP into a player for client review.

  Vinyl preparation uses special markers to assign tracks to each side of the record, with the predefined maximum side length checked automatically. For online distribution, high-resolution WAV, AIFF, MP3 and other exports carry metadata, and an itmsp package can be prepared for iTunes directly from the app. Integrated EBU R128 tools measure loudness in LUFS.
specs: |-
  - Burns Red Book compatible audio CDs with CD-Text, ISRC and EAN codes
  - Creates professional DDP images for pressing plants with one click
  - Imports audio CDs and converts them to DDP images, transferring track markers and metadata
  - Vinyl mastering with side markers and automatic maximum-length checking
  - Exports WAV, AIFF, MP3 and other formats with metadata, plus itmsp packages for iTunes
  - Clip editing with cut and trim, six fade curves and crossfades
  - Free use of all HOFA plugins inside the app, with automatable parameters
  - Internal dithering (third-party dithering plugins are PRO only)
  - Automation of plugin parameters
  - Tag Editor for CD-Text, ISRC and EAN metadata
  - Customisable PQ sheet export as PDF
  - Multi-CD projects with batch burning or DDP export
  - Multi-session CDs for storing computer-readable data alongside audio
  - Automatic track markers from markers in imported wave files
  - Connection to HOFA DDP Player Maker
  - Integrated EBU R128 loudness measurement (LUFS)
  - Two licenses per purchase, managed via the HOFA Plugins Manager, with offline activation supported
  - Operating system: macOS 10.13 or later, Windows 10 or later
