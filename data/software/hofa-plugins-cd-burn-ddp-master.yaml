description: All-in-one mastering software to create Red Book CDs, DDP images, vinyl and digital exports with built-in HOFA plugins and pro metadata support.
details:
  - CD-Burn.DDP.Master is a professional all-in-one mastering application for creating Red Book audio CDs, DDP images, vinyl masters, and online distribution packages within a single project. It handles the full pre-mastering workflow from audio editing through to final delivery.
  - The software includes a complete suite of HOFA plugins (valued at over €1,000) at no extra cost, covering dynamics, EQ, metering, and other processing needs. All plugin processing happens inside the application, eliminating the need for a separate DAW.
  - Audio editing capabilities include cutting, trimming, fades, and crossfades with 6 fade curve options for customizable transitions. The application supports multi-CD and multi-session projects, wave file marker import with automatic track creation, and CD import with metadata preservation.
  - Metadata management is comprehensive, supporting CD text, ISRC codes, EAN/UPC codes, and ID3 tags. Online distribution export supports WAV, AIFF, MP3, and iTunes packages, covering both physical and digital delivery formats in one workflow.
  - Licensing allows two activations per purchase, managed through the HOFA Plugins Manager with offline activation supported. A 14-day free trial is available. A PRO version adds third-party VST3/AU plugin support, clip-based processing, plugin presets, and advanced dithering options.
specs: |-
  - Red Book audio CD creation and burning
  - DDP image generation meeting professional standards
  - Vinyl mastering with automatic track side assignment
  - Audio editing: cutting, trimming, fades, crossfades
  - 6 fade curve options for customizable transitions
  - All HOFA plugins included at no extra cost
  - CD import with metadata preservation
  - Multi-CD and multi-session project support
  - Wave file marker import with automatic track creation
  - Metadata: CD text, ISRC codes, EAN/UPC codes, ID3 tags
  - Online distribution export: WAV, AIFF, MP3, iTunes packages
  - DDP Player Maker connection for client preview creation
  - Automation support for plugin parameters
  - Two licenses per purchase
  - Offline activation supported
  - Requires macOS 10.13 or later, or Windows 10 or later
