description: 4 Band Shifter is a VST plug-in that is able to shift independently
  the pitch of 4 adjacent, user-definable frequency bands.
details: |-
  Code is based on stephan m. Bernsee's article, pitch shifting using fourier
  transform.

  Fast: it uses fftw library to perform fast stfts.

  Can shift each frequency band independently in a range of (-12, +12)
  semitones.

  Big display representing the frequency bands / gain per band / volume per
  band.

  Can work in continuous or discrete mode.
specs: |-
  - 4 independent frequency band pitch shifting
  - Pitch shift range: -12 to +12 semitones
  - Fftw library for fast stfts
  - Continuous or discrete mode
  - Fourier transform-based pitch shifting
