details: |-
  Drive your recordings! From a single recording, generate any engine speed on
  demand and get instant access to any detected rpm seamlessly.

  Audiomotors pro comes with a royalty free sample pack containing 8 cars and
  one motorbike recorded with high quality dpa and rodes microphone: triumph gt6
  mkii, audi a4 tdi, formula 2.0 renault, volkswagen golf tdi 2l, suzuki sv650,
  citroen xsara, peuet 308 sw, peugeot 407 sw, peugeot hybrid 508.

  Audiomotors pro features new intuitive interface with realistic drive mode and
  tire & engine-rolling sound scratch mode capabilities.
specs: |-
  - 32/64-bit
  - Realistic drive mode
  - Tire & engine-rolling sound scratch mode
  - Open sound control supported
  - Multichannel support
