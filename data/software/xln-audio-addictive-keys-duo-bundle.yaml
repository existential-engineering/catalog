details: |-
  Addictive keys is a blend of innovative design and creative expression. Addictive keys is slim enough to run on both stationary and laptop computers without compromising sound quality. The standalone version is perfect for spontaneous jamming and live performances and the plug-in version supports all major DAW hosts.

  Addictive keys is designed to keep the user creative by offering a collection of unique instruments packaged in an intuitive and easy to use interface. Create truly unique sounds never heard before: mix and match different microphone perspectives. Apply effects like eq, filter, noise, compression, distortion, reverb, delay, chorus, phaser and tremolo add advanced envelopes for filter, pitch and volume.

  The online service mycloud makes it possible to work from anywhere by automatically synchronizing presets and memos across all of your computers and allowing preset sharing with other users. The built-in memo recorder lets you record melodies and musical ideas instantly and all the session settings are stored along with the music.

  No expenses have been spared in finding the right sounding instruments; the perfect sounding grand piano was found after auditioning more than ten candidates. The recordings were made using the best conditioned vintage tube microphones in studios complying with the highest demands regarding acoustics - capturing the instruments at several different perspectives, from close up with microphones next to the soundboard to far away perspective with natural room ambience. The result is a warm and vibrant sound.

  The duo bundle offers two world-class instruments from the addictive keys range - choose from studio grand, modern upright, electric grand and mark one. Studio grand: a world-renowned german grand piano with a crystal clear sound ideal for demanding pianists; captured from six selectable microphone perspectives from mono to stereo in a large studio with natural ambience at both close and far perspective intimate or larger-than-life. Modern upright: comes with a tight and defined tone together with an airy ambience that makes it the perfect companion for demanding musicians. This upright piano has slightly stretched tuning to enhance the character of this majestic instrument recorded in a large auditorium recording room. Electric grand: this unique instrument combines three distinct characters (acoustic hammers, direct line output, and amplified output) captured in seven different ways. Mark one: a classic electric piano with a warm and intimate tone perfect for a rainy day. Choose from seven different perspectives ranging from clean line to analogue chorus and tube amplifier with several microphone setups close-up mono to ambient stereo.
