description: Phoenix is a TDM plug-in suite for Pro Tools HD that adds analog
  color to the digital domain by increasing apparent loudness without increasing
  gain, modeling analog tape compression. The suite contains five separate
  plug-ins (Luminescent, Iridescent, Radiant, Dark Essence, and Luster), each
  emulating different tape characteristics.
details: |-
  Phoenix is a TDM plug-in suite for Pro Tools HD that is designed to put analog color into the digital domain by increasing apparent loudness without increasing gain (e.g., by modeling analog tape compression). The result is added realism that is missing in many modeled synths, EQs and digital samplers. The five different "flavors" of Phoenix can result in a much more musical and satisfying sound.

  Each of the five TDM plug-ins emulates different tape characteristics and incorporates a color change button with three choices: Gold, where the color is approximately flat in frequency response, Sapphire, a bit brighter, and Opal, with a warmer tonality. A level control determines the amount of the Phoenix process integrated into the audio signal, and an input trim determines how hard the tape is driven; because the DSP process is level dependent, reducing the input level also changes the sound.

  The input trim can also be used to prevent clipping in cases where material is hitting close to or at digital zero. When the input trim is at 0dB (no change in gain) and no tape process is being added to the sound, the plug-in is bit accurate, meaning the output exactly matches the input.

  The Phoenix suite contains five separate plug-ins: Luminescent is the most neutral sounding of the five. Iridescent has a similar magnetic character but with a fatter bottom and midrange, and is the most similar to the tape knob on HEDD-192. Radiant is characterized by a more aggressive compression curve. Dark Essence is even more aggressive, with a wider frequency range that, when used on a vocal, can reduce sibilance problems by increasing the apparent loudness of the rest of the signal. Luster starts more gently than the other four processes but becomes as aggressive as Dark Essence when the process is at full scale.

  Running within Avid's multi-shell architecture, Phoenix is very DSP efficient, running approximately twenty instances of a plug-in on a single DSP chip on an HD system running at a 44.1 kHz sample rate. Phoenix runs on all TDM hardware (MIX, HD, Venue) on PC, Mac, and Mac Pro.
specs: |-
  - Three-position color button per plug-in: Gold (flat frequency response), Sapphire (brighter), Opal (warmer tonality)
  - Level control determines the amount of Phoenix process integrated into the signal
  - Input trim control adjusts how hard the tape is driven and can prevent clipping
  - Bit-accurate bypass when input trim is at 0dB and no process is added
  - Runs approximately 20 instances per DSP chip on an HD system at 44.1 kHz
  - Suite includes five plug-ins: Luminescent, Iridescent, Radiant, Dark Essence, Luster
