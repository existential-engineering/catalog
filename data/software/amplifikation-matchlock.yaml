details: >-
  Amplifikation matchlock is inspired by fender* combo amps and thanks to the
  3rd gen tube simulation engine guarantees a more dynamic natural sounding,
  realistic amp recording experience for guitarists.


  With its thick, loud, and harmonically rich tone, fender* amps are known to be
  the choice for clean sound. Not only for electric guitars, but also for
  instruments such as harmonicas and synthesizers.


  Numerous guitar players also calls these amplifiers as "pedal palette": the
  perfect companion for tone building mastery via effect pedals. Guitarists who
  love to fiddle around with effect pedals will surely love these amps.


  Seven types of workhorse mics: shure* sm57, sennheiser* md421, sennheiser*
  md441, shure* ksm313, royer* r121, akg* c414, neumann* tlm103. Freely
  adjustable dual-miking with mono or stereo configuration, just like a
  real-life guitar recording session with mix option.


  Photorealistic graphics for lifelike guitar playing experience.
  Straightforward and easy to use interface.
