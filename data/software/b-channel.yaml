details: |-
  B-channel is an eq plug-in with comprehensive equalization controls including
  low frequency, low-mid frequency, high-mid frequency, and high frequency
  bands.

  The plugin features a built-in compressor with variable ratio control,
  adjustable threshold, and switchable attack modes for dynamic processing.
specs: |-
  - Lf 60hz & 120hz switchable/shelf
  - Lmf 100hz to 1500hz variable/peak
  - Hmf 1000hz to 15000hz variable/peak
  - Hf 8000hz & 12000hz switchable/shelf
  - HPF 50hz switchable
  - Peak boost q proportional q
  - Peak cut q fixed q
  - Compressor
  - Ratio 2db to 20db variable
  - Threshold 0db to -40db
  - Release 100ms to 2000ms variable
  - Attack slow & fast switchable
  - Windows compatible
