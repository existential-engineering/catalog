description: "Digital de-essing plugin based on the classic dBx 902 hardware
  unit from the 1980s. Features a minimalist 2-knob workflow with sophisticated
  automatic frequency detection that adapts to various sources without requiring
  threshold adjustment."
details: |-
  Automatic de-essing without fixed threshold control
  Real-time graphical display of processing
  Mix knob for parallel processing
  Air control to restore brightness after de-essing
  Listen feature for monitoring frequency detection
  Suitable for vocals, cymbals, guitars, and instruments with harsh transients
