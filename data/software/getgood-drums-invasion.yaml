description: GetGood Drums' most extreme drum library, featuring an extensive collection of drums and cymbals. All samples are tuned and phase-coherent for seamless layering, with built-in processing for mix-ready results.
details: |-
  Powered by Kontakt Player (no additional full Kontakt license required). Includes 4 kicks, 7 snares, 12 toms, and 30 cymbals (3 hi-hats, 3 rides, 4 chinas, 2 x-hats, 4 splashes, 3 stacks, 2 bells). Ships with preset kits including Default Kit, Nastier Than Thou, and Low Tuned Brute.
specs: |-
  - macOS 10.12+ (Intel, 64-bit)
  - Windows 7/8/10 (32-bit or 64-bit)
  - Kontakt Player 6 or Kontakt 6 required
  - 4 GB RAM minimum (6 GB recommended)
  - 20 GB total disk space
  - OpenGL 2.1+ graphics support
  - Internet connection required for activation
