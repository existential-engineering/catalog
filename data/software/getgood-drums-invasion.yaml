description: GetGood Drums' most extreme drum library, featuring an extensive
  collection of drums and cymbals. All samples are tuned and phase-coherent for
  seamless layering, with built-in processing for mix-ready results.
details: |-
  Invasion is our most extreme drum library in every sense of the word. More drums, more cymbals, and even more features!

  Our largest drum setup yet including seven snares, four kicks, twelve toms and thirty cymbals from a range of drum manufacturers.

  All of those drums, cymbals and features with the same attention to detail. Tuned to perfection, you'll never be fighting against sour notes in your mix and every sample is phase-coherent for easy layering.

  Whether you're sketching out a song idea or working on a final mix, Invasion gives you all the tools you need to bring your ideas to life.

  This instrument uses the latest version of Kontakt Player from Native Instruments. Installation and activation is managed via Native Access.
specs: |-
  - macOS 10.12+ (Intel, 64-bit)
  - Windows 7/8/10 (32-bit or 64-bit)
  - Kontakt Player 6 or Kontakt 6 required
  - 4 GB RAM minimum (6 GB recommended)
  - 20 GB total disk space
  - OpenGL 2.1+ graphics support
  - Internet connection required for activation
