description: SX1000 is a faithful emulation of the JEN SX1000, a vintage Italian
  synth released in 1978. Available for macOS, Windows, Linux, and iOS.
details: |-
  SX1000 is a faithful emulation of the JEN SX1000, a vintage Italian synth released in 1978, and one of the earliest affordable analog synthesizers designed for musicians who wanted hands-on control without breaking the bank. AudioThing emulated the SX1000's M110 chip and expanded its capabilities with a polyphonic mode, a sub-oscillator down to -3 octaves, and additional controls for legato modes.

  The JEN SX1000 Synthetone is an analog monophonic synthesizer introduced in 1978 by the Italian company JEN Elettronica S.r.l. It was one of the first affordable synthesizers widely available in Europe. At its core it is a monophonic synth with a single oscillator capable of sawtooth, square and pulse waveforms, complemented by a noise generator with white and pink sources. The filter section features a 24dB/octave resonant low-pass filter with a distinct organic sound and classic self-oscillation, plus an LFO for vibrato, tremolo or filter modulation, and two ADSR envelopes for volume and filter.

  The SX1000 was notably easy to modify, and AudioThing modded theirs nearly 20 years ago by adding a sub-oscillator using a simple flip-flop circuit, on the same principle as divide-down organs. The plugin also emulates the MM5837 digital noise source found in classic synths such as the Sequential Prophet 5, Korg MonoPoly and Oberheim OB-X, and lets you disable it, since its very short 17-bit LFSR makes the noise repeat audibly every few seconds.

  The original SX1000 had no arpeggiator, so the plugin borrows and expands one from the Juno 60: up, up and down, down and random modes, a 4 octave range, adjustable rate and sync, hold and latch, note order by pitch or key pressed, and a chord mode.

  Four effects complete the instrument: a Tape Echo based on AudioThing's Space Echo emulation Outer Space, a Spring Reverb, a Wave Folder inspired by the Serge Wave Multipliers, and a BBD-based Flanger, all rearrangeable by drag and drop. SX1000 is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP, Standalone), and on the App Store for iOS and iPadOS (AUv3 and Standalone).
specs: |-
  - 1 Osc (saw, square, pulse)
  - Suboscillator (up to -3 octaves)
  - 1 LFO (vibrato, filter, PWM)
  - 2 envelopes (volume, filter)
  - 24 dB/oct resonant filter
  - Oversampling
  - 4 Effects (echo, spring reverb, wave folder, flanger)
  - Arpeggiator
  - Resizable Window
  - Brightness and Contrast Controls
  - Preset system with randomizer
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP, Standalone 64-bit)
  - macOS 10.13 - macOS 26, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP, Standalone 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP, Standalone 64-bit)
  - 1 license up to 3 computers, no iLok, no internet connection required to activate
