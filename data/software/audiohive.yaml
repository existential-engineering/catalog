description: Audiohive is a unique node-based, integrated recording,
  compositing, editing and mixing solution for collaborative audio
  post-production.
details: |-
  The tree structure means that the project is a multi-level composition,
  instead of a linear multitrack arrangement. Therefore partitioning and
  re-joining parts of a production, key to parallel workflows, are natural to
  audiohive. New compositions are created simply grouping smaller compositions
  and/or single elements. The effects library handles complex effects as
  compositions instead of simple audio files, meaning that they are open to
  editing/processing modifications.

  A bus in audiohive is an audio stem carrying a number of channels configured
  as any surround format. All of the modules in audiohive (all editing features,
  processors and processing plug-ins) handle a number of busses as such
  abstractions, hiding the complexity of their internal structure. Direct
  connection of two different surround format busses is supported, with
  audiohive correctly distributing audio from/to channels.

  Unlimited multi-format busses, both at single elements and at composition
  nodes, serve as mix, monitor, group and effects send streams. Each single
  audio element has its own processing. Processing and mix busses operate at
  full 64-bit floating point arithmetic. Dynamic automation on all parameters,
  with write/read at any transport direction and speed.

  The aps is a high performance multiprocessor mac os x platform that carries
  out real-time low latency audio I/o and processing. A single aps can open
  several independent sessions, meaning that a number of workcells (rooms) can
  work with a single server. A number of aps can integrate into an audiohive
  environment, sharing metadata and media from the central storage and
  databases.
specs: |-
  - Node-based architecture
  - Multi-level composition
  - Real multi-format audio support
  - Unlimited multi-format busses
  - 64-bit floating point arithmetic
  - Dynamic automation on all parameters
  - Internal sample rate unlimited (above 384khz)
  - Aaf import/export
  - Multi-track recording
  - Clip editing with fade-in/fade-out curves
  - Track recording with entry generation
  - Segment editing with time compression/expansion
  - Pitch-shifting capability
  - Multiple operator capability
  - Euphonix eucon protocol support
  - Sd/hd video stream support
  - Quicktime movie file compatibility
  - Audio Unit plugin hosting
  - macOS platform
