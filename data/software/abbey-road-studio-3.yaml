description: The Abbey Road Studio 3 plugin brings the acoustic environment of
  the legendary Abbey Road Studio 3 control room to your headphones, so you can
  have better reference for your mixes and productions wherever you are.
details: |-
  Abbey Road Studio 3 is a plugin, created in collaboration with abbey road
  studios and powered by Waves' nx immersive audio technology. The studio 3
  control room is abbey road's flagship mix room, designed by the world's
  greatest acousticians to provide the ultimate music production and mixing
  environment.

  The waves abbey road studio 3 plugin brings the acoustics of the studio 3
  control room into your headphones in glorious three-dimensional sound, powered
  by waves' pioneering nx technology for immersive 3d audio. This unique plugin,
  used with any set of headphones, gives you the same stellar audio qualities
  that make studio 3 the world's best studio control room.

  With abbey road studio 3 inside your headphones, you can now trust your
  headphone mixes like never before, and you can produce and mix with greater
  confidence: you have the ultimate reference environment for your headphone
  mixes. You can better predict how your headphone productions will translate to
  speaker systems of all types. You can hear true-to-life spatial depth on your
  headphones, with the same detail and panoramic sound image you would hear
  sitting in the sweet spot of studio 3. You can reliably mix the low end on
  headphones.

  In addition, this plugin also delivers full 5.1 and 7.1 surround sound,
  modeled after the studio's original surround setup. You can mix professionally
  for surround on any set of stereo headphones.

  Abbey road studio 3 is useful in a wide range of scenarios in which many
  producers and mixers often find themselves: if you're on the go, you can take
  abbey road studio 3 with you. If you don't have a perfectly treated mix room
  now you do. If you do have a great room now you have the world's best room for
  more reliable reference. If you collaborate on music with others now you all
  have the same acoustic environment to refer to when sending mixes back and
  forth. If you need to start a 5.1 or 7.1 mix workflow in your DAW without
  having access to a full set of surround speakers, or if you need to create a
  5.1 or 7.1 premix before going into a surround sound mix studio for final
  tweaks now you can do so on headphones.
