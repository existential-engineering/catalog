description: Cinematic ensembles and divisi created with award-winning composer
  benjamin wallfisch, this collection redefines string orchestration.
details: |-
  Created with award-winning composer benjamin wallfisch, this collection
  redefines contemporary sampled strings, setting a new standard for realism and
  expression. Write for strings like you would for a live orchestra—with no
  compromises. With loop-free long notes, a consistently dynamic sound, divisi
  for all sections, upbow and downbow strokes, 5 dynamic layers, an atmos mic
  setup, and a mix curated by benjamin wallfisch, these strings are the new
  benchmark for contemporary film scoring.

  All long notes here are genuine long recordings, avoiding the looping common
  in sample libraries. All long notes have legato options too. The result:
  maximum realism.

  Benjamin wallfisch strings offers tutti and divisi sections, as well as a
  choice of upbow and downbow strokes, for all long notes and legatos. For
  example, the 14 first violins form the tutti, and you get two groups of 7
  violins as divisi sections. Each section was independently recorded in situ,
  ensuring a consistent and entirely natural sound—no recordings were re-used
  here.

  When writing for real strings, it's common to specify the bowing
  direction—this can have a notable effect on the sound. Sample libraries rarely
  offer this level of control, but benjamin wallfisch strings is an exception.
  Here you get a choice of upbow or downbow for all long notes from all
  sections. This means total control and maximum realism.

  Recorded at teldex scoring stage, berlin.
specs: |-
  - Loop-free long notes
  - 5 dynamic layers
  - Tutti and divisi sections
  - Upbow and downbow strokes
  - Legato options
  - Atmos mic setup
  - Sineplayer
