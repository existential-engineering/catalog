description: "STL Tonality is an all-in-one Guitar Plug-In Suite developed
  exclusively from Andy James’s Signature Guitar sounds. Using the most advanced
  modelling algorithms, users can experience real-time simulations of Andy
  James’s actual go-to amps. Our software uses internal circuit simulations from
  the schematic’s of the specific amplifier’s Andy uses every day. Designed by
  STL Tones, the Andy James Plug-In Suite has been developed to capture every
  song aspect of what makes Andy James’s guitar tones so sought after. The
  plug-in suite takes your direct input guitar signal all the way to a fully
  mixed guitar tone with its unique all-in-one design. Experience an all-access
  pass to Andy James’s mix-ready guitar tones. AMP FEATURES STL Tonality is an
  all-in-one Guitar Plug-In Suite developed exclusively from none other than
  Andy James's Signature Guitar sounds. Andy handpicked his 3 favorite
  amplifiers that incapsulate his dream setup, our team then went to work on
  developing software versions of these amps, using the most advanced modeling
  technology, deriving systems of non-linear differential questions directly
  from the amplifiers physical schematics. AMP 1 One of the main Amps that Andy
  uses in his day to day rigs is modeled from a modern version of one of the
  worlds most well-known amps. AMP 2 Modeled from arguably one of the most
  well-known Amps in the metal industry. This Amps sole focus in the circuitry
  is based on the characteristics of the lead channel. AMP 3 A legendary British
  Amp from the 1960’s that covers many styles, from crystal clean to amazing
  mid-gain crunch tones. We also included the Tremelo functionality in this
  model. THE REVENANT Included in the Andy James - Tonality Suite is a virtual
  model of our first-ever hardware release: The Signature Andy James Revenant
  Pre Amp Pedal. Click the button below to learn more about how you can get your
  hands on The Revenant. FOCUSED OVERDRIVE SECTION Users have access to 2 of
  Andy James’s go-to Overdrive pedals, including a digital recreation of his
  Signature Preamp pedal The Revenant. EFFECTS MODULE Andy worked closely with
  the STL Tones team to incorporate a combination of his favorite Delay, Reverb
  and Lo-Fi effects, to give the user an all-access pass to his essential effect
  units. STANDALONE The Standalone version of Tonality: Andy James allows users
  to easily install the Plug-In, without the need of a DAW (Pro Tools, Logic, or
  Cubase). The Standalone version is perfect for practice on the go and for use
  in live situations. WHAT ELSE? SESSION FILES INCLUDED! Andy James wrote 3 new
  unreleased songs for the launch of his Tonality Plug-In Suite. We are going to
  be including the session files for these 3 songs with the paid version of this
  product, at no additional cost. You can get your hands-on session files, and
  more importantly DI tracks recorded and played by Andy. Jam along to the
  songs, and use the Plug-In to create your own mixes. This offer is not
  included in the Trial/Demo version."
