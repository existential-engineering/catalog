details: |-
  Atmosia 2.5 is a 4 voice atmospheric/cinematic instrument ideal for film, tv,
  advertising and video game production as well as ambient and similar genres. A
  comprehensive extension to atmosia 1 that now features over 520 sound sources
  from atmosia 1, electria 1, mechia 1 and firewalker as well as over 200 all
  new presets.

  Atmosia 2.5 includes our distinctive x/y pad to allow you to dynamically move
  between the four sound sources. X/y movements can be recorded, and retriggered
  automatically on each new note, or the x/y pad can be left as "free running",
  where it will loop endlessly (forwards, or forwards and backwards).

  Atmosia 2.5 updates the effects section adding 4 slot-based send effects.
  These slots can hold any of 8 different effects, and each voice has 4
  independent send levels. Further this slot-based approach has been applied to
  the master effects, so again 4 slot-based effects where you can select any of
  the 8 master effects including a multi-node parametric eq.

  Atmosia 2 has extended the control over each sound source so you have full
  control for each voice over envelopes, filters, vibrato, tremolo, pitch
  position and bend range. Atmosia 2 includes the innovative physical modelling
  engine from a1 but extends it further, with fully independent processing per
  voice, in addition there's the all new per-voice drone engine, allowing you to
  configure static drones or drones that move with MIDI input.

  Finally we added a per-voice arp system so you can run arps for each voice
  separately(or not at all) with independent DAW-synced tempo controls, step
  count, octave range, step velocity and note length.
specs: |-
  - 4 voice atmospheric/cinematic instrument
  - X/y pad with dynamic movement between four sound sources
  - X/y movement recording and retriggering
  - 4 slot-based send effects
  - 8 different effects available
  - 4 independent send levels per voice
  - 4 slot-based master effects
  - 8 master effects including multi-node parametric EQ
  - Tag-based sound browser
  - Text search facility
  - Independent randomisation options for voices, modelling and drones
  - Per-voice envelope control
  - Per-voice filter control
  - Per-voice vibrato
  - Per-voice tremolo
  - Per-voice pitch position and bend range control
  - Physical modelling engine with fully independent processing per voice
  - Per-voice drone engine
  - Static drones and MIDI-responsive drones
  - Per-voice field effect convolution with over 50 custom designed IRs
  - Depth modulation and control
  - Per-voice arp system
  - Independent DAW-synced tempo controls
  - Step count control
  - Octave range control
  - Step velocity control
  - Note length control
  - Over 520 sound sources from atmosia 1, electria 1, mechia 1 and firewalker
  - Over 200 all new presets
