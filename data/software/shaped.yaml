details: |-
  Shaped is a creative multi-FX shaper plugin that empowers you to turn shapes
  into six incredible effects, all within a single, streamlined interface. With
  Shaped, you have the keys to shaping your soundscapes with six powerful
  effects: volume automation, panning, filter, delay, reverb, and distortion.

  Shape your volume with precision volume automation to sculpt your audio's
  dynamics with pinpoint control. Create smooth volume fades, tight rhythmic
  automation patterns, and dramatic swells that add life to your mix. Shape your
  panning with creative stereo imaging to take full command of your stereo field
  and design immersive panoramas that sweep across the soundstage, adding width,
  depth, and dimension to every track.

  Shape your filter with advanced filter modulation to shape your frequencies
  with resonant precision and apply creative filter sweeps, evolving textures,
  and tonal movements. Shape your delay with rhythmic delay effects to turn your
  shapes into dynamic delay patterns and add movement, groove, and depth with
  echoes that enhance every note. Shape your reverb with immersive reverb design
  to create lush reverbs and expansive sonic spaces that wrap your sound in
  atmospheric detail and 3d depth. Shape your distortion to add edge, grit, and
  character to your audio with distortion patterns that deliver raw power and
  unique sonic personality.

  What sets shaped apart is the freedom to use your shapes across multiple
  effects. With the advanced spline editor, crafting your shapes is a breeze by
  editing existing shapes graphically or starting from scratch, tailoring every
  contour to perfection. The sync settings let you perfect the timing of your
  shapes, ensuring they hit the mark exactly when you want them to. Take control
  even further with MIDI note control, allowing you to trigger your shapes
  on-demand, infusing your music with dynamic flair.

  Shaped features not just a preset manager, but also the ability to save
  multiple slots per preset. The MIDI trigger is your gateway to sonic
  exploration, allowing you to draw MIDI notes within your DAW and watch as
  shaped transforms your musical ideas into reality. The plugin is designed to
  recognize and respond to your MIDI input with precision, allowing you to
  sculpt your sound like a true artist.
