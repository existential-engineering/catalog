description: A true peak brickwall limiter combining adaptive limiting with advanced psychoacoustic analysis to maximize loudness while keeping mixes clean and punchy. Five selectable limiting algorithms adapt to different source material. A switchable soft clipper at the front of the signal chain captures isolated peaks early, reducing limiter workload and minimizing pumping. True peak detection complies with ITU-R BS.1770.
details: |-
  Released 2024-12-17 (first in the OCELOT Studio Series). Five selectable limiting algorithms for different source materials. Adaptive limiting with psychoacoustic analysis. Switchable soft clipper at signal chain input to reduce limiter workload. True peak detection compliant with ITU-R BS.1770 — anticipates inter-sample peaks to prevent distortion during analog conversion. Smooth adaptive release to prevent pumping. Intelligent lookahead processing. Noise shaping, dithering, and quantization. 1:1 and delta (Δ) listen monitoring modes. Threshold, output ceiling, release, and lookahead controls. Low CPU usage with support for multiple instances. Universal 2 Binary (Apple Silicon native).
specs: |-
  macOS 10.12+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+ (32-bit and 64-bit), 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX. Activation: Fuse Audio Labs account. 14-day trial available.
