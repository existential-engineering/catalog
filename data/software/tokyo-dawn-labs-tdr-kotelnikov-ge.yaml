description: "A wideband dynamics processor combining high-fidelity dynamic
  range control with musical flexibility. Features a stealthy sonic signature
  that manipulates dynamic range while preserving original tone, timbre, and
  punch."
details: |-
  Version 1.6.5. 64-bit multi-rate processing structure. Delta oversampled signal path, bit transparent at 0dB gain reduction. Crest factor-based control scheme with independent peak/RMS release controls. Flexible sidechain high-pass filter. Advanced stereo linking options. Delta preview function. Latency compensated parallel bypass. External sidechain input. Frequency dependent ratio function (FDR). Yin/Yang modes. Equal loudness output gain trimming. Multiple quality modes including Insane and Live low-latency. UI rescaling at 100%, 125%, 150%.
specs: |-
  Windows 7 or above. Mac OS X 10.9 or above. VST2, VST3, Audio-Unit, or AAX compatible plugin host. OpenGL support required.
