details: |-
  The a series eq digitally recreates the sound of API's 550b vintage four band equalizer.

  Each band offers 7 switchable filter frequencies spanning 4 to 5 octaves. The four bands overlap for track sweetening or specific problem solving.

  The low and high bands are selectable peak or shelving.
specs: |-
  - Four bands
  - Low and high bands peak/shelf switchable
  - Low-mid and mid-high peaking type
  - 7 switchable filter frequencies per band spanning 4 to 5 octaves
  - Filter frequency centers: low: 30, 40, 50, 100, 200, 300, 400hz
  - Filter frequency centers: low-mid: 75, 150, 180, 240, 500, 700, 1khz
  - Filter frequency centers: mid-high: 800, 1.5k, 3k, 5k, 8k, 10k, 12.5k
  - Filter frequency centers: high: 2.5k, 5k, 7k, 10k, 12.5k, 15k, 20k
  - Filter boost/cut: +/- 12db variable to 0.1db
  - Filter slope: 12db per octave
  - Gain clipping indicator
  - Phase reverse switch
  - In / out bypass switch
  - Numeric windows for click on entry
  - Plasma style input and output vu meters
  - Input line trim -12db to +4db variable to 0.1db
  - VST plugin
  - Audio units plugin
  - Macos and windows compatible
