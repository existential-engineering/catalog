description: A software delay plugin modeled after tape and bucket-brigade delay
  circuits, with a 30ms to 1250ms range moving from slapback to blurred
  soundscapes. Features a variable LFO for modulation and pitch movement, with
  feedback that opens into self-oscillation.
details: |-
  Originating from a deep history of servicing tape and bucket-brigade circuits, the Benson Delay was designed around a simple idea: repeats that feel alive. Proprietary component-level modeling recreates that floaty, unstable character in plugin form. A 30 ms to 1250 ms range moves from tight slapback, chorus and vibrato into expansive, blurred soundscapes, while analog filtering and careful gain staging keep time changes smooth rather than sterile. A fully variable LFO adds anything from tape-like drift to deeper pitch movement, and pushing the feedback opens into expressive self-oscillation. Available as a 64-bit VST3, AU or AAX plugin for macOS and Windows. An iLok account and iLok License Manager are required (both free). Includes a 14-day free trial through iLok. We present, MixWave: Benson Delay .
