description: "Plugin emulation of the rare Klein & Hummel UE-100 hardware
  equalizer. Features six discrete filter modules creating a collection of
  band-pass filters with an all-tube design known for musical warmth. Includes
  low/high-pass filters, four shelf bands, and dual parametric band-pass
  filters."
details: |-
  Level calibration with 0.5 dB step adjustments
  Internal oversampling capability
  Analog mode with hardware coloration and noise extraction
  Low- and high-pass filters
  Rounded or high-Q shelf bands for body and presence
  Pushbutton frequency selectors
  Suitable for source mixing, vocal tracking, and mastering
