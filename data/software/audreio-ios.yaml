id: hSaunOt8KEWMPMJ428oMq
name: iOS
manufacturer: audreio
primaryCategory: recorder
description: Stream and record full bandwidth audio between iOS devices or iOS
  and desktop DAWs (running Audreio AU plugin). No audio interface needed.
details: |-
  The received audio can then be routed to the speaker, an iaa host, or captured
  to a file using the built-in recorder. Audreio's easy-to-use interface will
  have you streaming audio in no time. Simply select a device on your local
  network that you would like to send audio from, and you're ready to stream.
  There are no ip addresses to enter and no complicated set-up to deal with.

  Audio streaming (via cable): stream 32-bit audio between your ios device and
  the audreio plug-in running on a mac DAW (e.g. Logic, live, dp, studio one).
  Wireless audio streaming: stream 16-bit audio between other ios devices
  running audreio, or between a desktop DAW running the audreio plug-in.

  Recorder: capture the incoming audio from a remote device, an iaa app, or the
  microphone. Safe record: when recording from a remote connection, the audio
  file will not have glitches even under poor network conditions where live
  streaming produces audible glitches.

  File export: export recorded files via audiocopy or itunes file sharing.
  Transport: control playback and recording on a remote device and iaa host with
  the transport controls. New in v1.5: iaa effects hosting.
specs: |-
  - 32-bit audio streaming via cable
  - 16-bit wireless audio streaming
  - Inter-app audio (iaa) support
  - Built-in recorder
  - Safe record technology
  - File export via audiocopy
  - Itunes file sharing
  - Transport controls
  - Iaa effects hosting
  - Local network streaming
  - Device cable connections
