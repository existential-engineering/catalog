description: "Vibrant soul keys: organic, warm flavors ranging from Neo Soul to RnB, from Top 50 Pop to Hip Hop, enriched with inspiring sequences and soothing effects."
details: |-
  These organic, warm flavors breathe soul and warmth, enriched with inspiring sequences and soothing effects. From Neo Soul to RnB, from Top 50 Pop to Hip Hop, treat your tracks to comforting vibes and bliss.

  A great RnB or Hip Hop mix really grooves with bespoke sounds of various vintages. With Usynth DELUXE you get warm synth textures ranging from the mid-1950s to late-1980s. Its built-in Finisher multi-effects give your keys a modern touch.

  Usynth features a built-in reverb unit that is simple to set up, yet super-flexible. From a small echo chamber to huge cathedral-style rooms, just select an Ambience preset and adjust the amount. To get a detailed explanation of the Sequencer section's key switches, click the little keyboard symbol to the right of the keyboard.

  All three sections of Usynth, Sequencer, Synthesizer and Finisher, come preloaded with ready-made presets. Just browse, mix and match to build your own sound within seconds.
specs: |-
  - Fully customizable sequencer
  - 2 individual layers per note
  - Custom Finisher featuring 90 presets
  - Built-in Ambience reverb unit, from small echo chamber to cathedral-style rooms
  - Sequencer key switches documented in-plug-in via the keyboard symbol
  - Ready-made presets across the Sequencer, Synthesizer and Finisher sections
  - UJAM App integrated
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8GB of RAM
  - 2.2GB of free disk space
  - 1280x768px display, internet connection
  - Moving the .blob sample content file to an external drive is not supported
  - Plug-in formats: AAX, AU 2, VST 2 and VST 3, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Requires the latest version of the UJAM App, which installs the Usynth plug-in that hosts all titles
