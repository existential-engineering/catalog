description: A clean, smooth gain reduction compressor with punch designed with both electro-optical and vari-mu characteristics. Features two distinct compression curves for transparent or aggressive character, a blend knob for parallel compression, and sidechain input support.
details: |-
  Compression
  Limit
  Blend (Dry/Wet)
  Sidechain Input

  Electro-optical and vari-mu characteristics
  Two compression curves: transparent and aggressive (Limit mode)
  Soft-knee compression with ~5:1 peak ratio
  Hard-knee higher ratio curve in Limit mode
  Blend knob for parallel compression
  External sidechain input support
  Preserves source material 'air'

  Session-restore, automation, preset support, stereo and multi-mono support
specs: |-
  - peakRatio: ~5:1 (standard mode)
