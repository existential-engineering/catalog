description: "A compressor plugin with both electro-optical and vari-mu
  characteristics providing clean and smooth gain reduction with a little punch.
  Features two distinct compression curves for transparent or aggressive
  character, a blend knob for parallel compression, and sidechain input
  support."
details: |-
  Compression
  Limit
  Blend (Dry/Wet)
  Sidechain Input

  Electro-optical and vari-mu characteristics
  Two compression curves: transparent and aggressive (Limit mode)
  Soft-knee compression with ~5:1 peak ratio
  Blend knob for parallel compression
  External sidechain input support
  Preserves source material 'air'

  Session-restore, automation, preset support, stereo and multi-mono support
specs: |-
  - peakRatio: ~5:1 (standard mode)
