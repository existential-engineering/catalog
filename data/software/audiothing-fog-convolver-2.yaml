description: Fog Convolver is a convolution reverb plugin. Convolution works by
  applying the sonic character of an impulse response to another sound in real
  time.
details: |-
  Fog Convolver 2 is a true stereo convolution reverb/processor plugin. This new version has been rewritten and redesigned from scratch, and now features modulation, effects, a space simulator, an impulse response generator, and a lot of improvements and new features.

  You can load 2 separate impulse responses (or one true stereo/quad channel impulse response) and have separate or linked controls for both. There are 6 different routing modes to arrange the impulses: single, serial, parallel, parallel mix, true stereo, and mid/side. Each impulse can have 2 LFOs, with 10 waveforms and 18 destinations, one dedicated multi-mode filter (with pre, IR, or post modes), and a 5-band graphic EQ.

  Fog Convolver features 9 factory banks with more than 740 impulse responses made from spaces, analog and digital equipment, organic sources, handmade devices, and more: Craft Spaces (211), DIY (48), OpenAIR (83), Organic Compounds (45), Polarity (67), Test Equipment (53), Unusual (128), Vintage Mics (65), and Old Times (40).

  With the Space Simulator, powered by Lese Audio Technologies, you can create impulse responses of virtual rooms, changing dimensions, manually placing the source and listener, and experimenting with combinations of materials on each of six walls. As an alternative, the built-in impulse response generator creates artificial spaces with a more synth-like approach. The Export page renders the current impulse response to an audio file with control over sample rate, bit depth, format, gain, trim and filename.

  Any audio file (WAV, AIFF, or FLAC) can be loaded with a simple drag and drop or through the built-in browser. A Snapshot System saves the plugin's current settings into slots for quick recall, stored within the DAW session and automatable through the Snapshot parameter. Fog Convolver 2 is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP).
specs: |-
  - Lightweight Real-Time Convolution Engine
  - 6 Modes including True Stereo
  - Dual IR Engine with Parameter Link
  - 4 LFOs with multiple destinations
  - 2 Multi-mode Filters
  - Chorus, Phaser, Compressor, Waveshaper
  - Impulse Response Space Simulator
  - Impulse Response Generator
  - Preset Browser with customizable categories, tags, ratings
  - 740+ Impulse Responses across 9 banks
  - Resizable Window
  - Preset system with randomizer
  - Snapshot system
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM, 1.5 GB HD (VST2, VST3, AAX, CLAP 64-bit)
  - macOS 10.13 - macOS 26, 2GHz CPU, 4 GB RAM, 1.5 GB HD, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM, 1.5 GB HD (VST2, VST3, CLAP 64-bit)
  - 1 license up to 3 computers, no iLok, no internet connection required to activate
