description: DeeChannelTool is a channel tool and console simulator plugin
  offering Solo and Phase Invert monitoring functions, Mid-Side balance
  adjustment, and two analog console simulators for mixing and mastering.
details: |-
  DeeChannelTool is a versatile channel tool plugin designed for mixing and mastering workflows. It provides essential monitoring utilities including Solo and Phase Invert functions that allow engineers to quickly audition individual channels or flip polarity during a session.

  The plugin features Mid-Side balance adjustment, giving users control over the stereo width and the relationship between the mid (mono) and side (difference) components of a stereo signal. This is especially useful during mastering or when fine-tuning the stereo image of a mix.

  DeeChannelTool includes two analog console simulators that emulate the harmonic character of real hardware: TYPE-A produces a cleaner, more open sound with enhanced stereo definition, while TYPE-N adds punch and warmth reminiscent of more saturated console circuits. Both modes simulate subtle overdrive characteristics.

  The plugin is available as a free demo with a one-second silence imposed every 30 seconds. A purchased serial key removes all restrictions. Registration requires an internet connection. Downloads are provided as ZIP archives for both Windows and macOS, with manuals in English and Japanese included.

  DeeChannelTool has been tested with a wide range of DAWs including Ableton Live, Cubase, Logic Pro X, Pro Tools, Studio One, FL Studio, Reason, BITWIG STUDIO, GarageBand, Digital Performer, Audacity, OBS Studio, and several others.
