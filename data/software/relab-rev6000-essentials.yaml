description: REV6000 Essentials is a streamlined, lower-priced version of Relab's VSR REV6000, a re-creation of an iconic Danish hardware reverb favored in Hollywood, with realistic cinematic reverb and precise imaging for room sounds and large halls.
details: |-
  REV6000 Essentials is a streamlined version of Relab's VSR REV6000, a machine-learning-based re-creation of an iconic Danish hardware reverb long favored in Hollywood. It offers the same core reverb in a smaller feature set and ships with hand-crafted factory presets.

  REV6000 Essentials uses iLok account-based authorization with no hardware dongle required. It is a 64-bit only plugin for Mac (OS X 10.15+, Intel and M1 native) and Windows (10+), compatible with major DAWs including Logic Pro, Pro Tools, Cubase, Nuendo, and Ableton Live.
specs: |-
  - Mac requirements (64-bit only): OS X 10.15 or higher, Intel processor or M1 processor, 2GB of RAM
  - Windows requirements (64-bit only): Windows 10 or higher, Core 2 or higher, 2GB of RAM
  - Compatible hosts (Mac): Logic Pro 10.x, Pro Tools from 11.3.2 and up, Cubase 9.5 and up, Nuendo 8 and up, Live 9 and up
  - Compatible hosts (Windows): Pro Tools from 11.3.2 and up, Cubase 9.5 and up, Nuendo 8 and up, Live 9 and up
  - macOS build: VST3/AU/AAX (64-bit)
  - Windows build: VST3/AAX (64-bit)
  - No hardware dongle required: local computer authorization or iLok USB key (V2 or above)
  - Free PACE iLok account, internet connection and latest PACE drivers required at activation
  - Hand-crafted factory presets included
