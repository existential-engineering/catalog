description: The world's most accurate recreation of an iconic Danish 'Hollywood' favorite hardware reverb, in a more streamlined and wallet-friendly form. REV6000 Essentials delivers ultra-realistic cinematic reverb with precise imaging for room sounds and large hall reverbs.
details: |-
  REV6000 Essentials is an ultra-realistic cinematic reverb plugin from Relab Development, described as the world's most accurate recreation of a peerless Danish hardware reverb. Built using years of research and precision machine learning, the plugin faithfully captures the character of a legendary Hollywood-favorite hardware unit in a more accessible, wallet-friendly package.

  The Essentials version offers a streamlined feature set compared to the full REV6000, making it an entry point to the same core reverb quality. It ships with hand-crafted factory presets designed by industry professionals, enabling users to get great results immediately across a wide range of music production contexts.

  REV6000 Essentials uses iLok account-based authorization with no hardware dongle required. It operates as a 64-bit only plugin supporting Mac (OS X 10.15+, Intel and M1 native) and Windows (10+), and is compatible with major DAWs including Logic Pro, Pro Tools, Cubase, Nuendo, and Ableton Live.

  Purchase includes exclusive community access for networking with other audio professionals, industry-leading customer support, and a 30-day money-back guarantee.
specs: |-
  - Mac requirements (64-bit only): OS X 10.15 or higher, Intel processor or M1 processor, 2GB of RAM
  - Windows requirements (64-bit only): Windows 10 or higher, Core 2 or higher, 2GB of RAM
  - Compatible hosts (Mac): Logic Pro 10.x, Pro Tools from 11.3.2 and up, Cubase 9.5 and up, Nuendo 8 and up, Live 9 and up
  - Compatible hosts (Windows): Pro Tools from 11.3.2 and up, Cubase 9.5 and up, Nuendo 8 and up, Live 9 and up
  - macOS build: VST3/AU/AAX (64-bit)
  - Windows build: VST3/AAX (64-bit)
  - No hardware dongle required: local computer authorization or iLok USB key (V2 or above)
  - Free PACE iLok account, internet connection and latest PACE drivers required at activation
  - Hand-crafted factory presets included
