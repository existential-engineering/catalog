description: Bigsteps is a collection of 14 MIDI step sequencers. Connect them
  together to create many combinations. Needs a VST host with flexible MIDI ...
details: |-
  Sequencers include: melody, drums, chords (major, minor, 6th, 7th, maj7th,
  plus 1st, 2nd and 3rd inversions), bars, filter, gate and fxp.

  MIDI only. Triggered by any note-on or the included start/stop button. Up to
  16 steps. Manual bpm. Bpm division. Swing. Octave. Velocity.

  Needs a VST host with flexible MIDI routing.

  Demo includes 4 fully functional plug-ins.
specs: |-
  - 14 MIDI step sequencers

  - Melody sequencer

  - Drums sequencer

  - Chords sequencer (major, minor, 6th, 7th, maj7th, plus 1st, 2nd and 3rd
  inversions)

  - Bars sequencer

  - Filter sequencer

  - Gate sequencer

  - Fxp sequencer

  - MIDI only

  - Up to 16 steps

  - Manual bpm

  - Bpm division

  - Swing

  - Octave

  - Velocity

  - Triggered by any note-on or the included start/stop button


  - Requires VST host with flexible MIDI routing

  - Windows compatible
