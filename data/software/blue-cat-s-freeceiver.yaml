details: |-
  Blue Cat's Freeceiver is a free plug-in and application that can receive audio
  or MIDI streams sent over the network by blue cat's connector and fader hub in
  real time.

  Working with remote clients, you can send them audio and MIDI in real-time
  from your DAW without the need for them to acquire a license to the software.
  Freeceiver is 100% free, like all free software.

  Available both as a plug-in and application, it lets you either stream and
  record into your favorite DAW, or simply play the stream straight into your
  speakers or headphones on whatever machine that is connected to the network.

  You can also use it locally on the same machine as connector or fader hub to
  stream audio from one application to another.
