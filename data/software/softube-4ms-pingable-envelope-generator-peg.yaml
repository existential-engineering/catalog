description: Two-channel pingable envelope generator created as a Modular
  expansion in collaboration with 4ms. It's a module that not only expands but
  explodes the rhythmic capabilities of your Modular system.
details: |-
  A long-awaited addition to the Softube Modular platform, the 4ms Pingable Envelope Generator opens up a vast array of possibilities beyond the basic ADSR envelope generator included in the core Modular package.

  Two independent envelope generators can be 'pinged' by external sources (your DAW clock, for example) to define the cycle length of the envelope(s) and generate rhythmic effects and interactions never before possible in Modular. Add to this the extensive options for shaping those envelopes, and multiplying or dividing their cycle length, and you have a module which not only expands but explodes the rhythmic capabilities of your Modular system.

  Use one side at a time to sync the rhythmic aspects of a sound to your track tempo, or use both sides to quickly concoct awesome generative rhythmic chaos.

  The module is officially licensed and endorsed by 4ms. Dan Green, founder of 4ms: "I was very pleased to see that you kept the original PEG's internal sampling rate and that self-patched feedback loop patch also works on the virtual version!"
specs: |-
  - Made for Modular, Softube's Eurorack platform
  - Officially licensed and endorsed by 4ms
  - Two-channel pingable envelope generator
  - Use one side at a time to sync the rhythmic aspects of a sound to your track tempo
  - Use both sides to quickly concoct awesome generative rhythmic chaos
  - Detailed control of the shape of the envelope when generating drum sounds
  - Easily create some controllable motion in your textures
  - Adds hugely to the capabilities of your Softube Modular system
  - Cycle length of the envelopes can be multiplied or divided
  - Envelope generators can be pinged by external sources such as the DAW clock
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Three activations, 20-day trial, 14-day returns
