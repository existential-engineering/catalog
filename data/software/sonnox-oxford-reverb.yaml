description: Oxford Reverb builds a reverb space from its component parts rather than a fixed algorithm or a convolution capture, with separate control over early reflections and tails plus equalisation, dispersion and absorption. Over 120 presets cover small rooms through plates and large halls.
details: |-
  The Sonnox Oxford Reverb builds a reverb space from its component parts rather than from a fixed algorithm or a convolution snapshot. Separate control over early reflections and reverb tails, plus built-in equalisation, dispersion and absorption, covers everything from tight room ambiences to large concert halls. Its EQ section shapes the reverb's frequency response to suit a given instrument or vocal.

  More than 120 presets are included as starting points, covering small dry rooms to reverb chambers and vast halls, from vintage Lexicon-inspired reverbs to EMT plates and modern ambient spaces.
specs: |-
  - Separate early reflection and reverb tail control, with independent adjustment of the size, shape and stereo image of the space
  - Integrated 5-band reverb EQ built on the Oxford EQ, for sculpting the frequency response of the reverb
  - Dispersion, phase and absorption controls, including phase adjustment between stereo signals to widen or narrow the sound field
  - Over 120 presets, from small dry rooms to reverb chambers and vast halls
  - Formats: Audio Unit (AU), VST3, AAX-Native (Pro Tools 11 or later), AAX-DSP (Pro Tools Ultimate, Pro Tools HD, or Avid VENUE systems)
  - macOS 10.13 High Sierra or later
  - Windows 10 (64-bit) or later
  - AAX-DSP instances per chip at 44.1/48 kHz: 1 mono, 1 stereo
  - Licence includes two simultaneous activations, authorised via an iLok account on Local Machine, iLok device (iLok2 or iLok3 USB dongle) or iLok Cloud
  - Free trial available, authorised with a free iLok account
