description: Record in real-time with near-zero latency using the V12 Chorus
  with the Antelope Audio Synergy Core interfaces.
details: |-
  Multi-Voice Stereo Chorus that infuses old and proven modulation principles with futuristic technologies, allowing new applications of chorus effects with full control over the desired outcome.

  Powerful Voicing generator capable of producing up to 12 different voicings based on the source material, with separate controls for time between voicings, tuning, and number of repeats.

  Unique frequency filter called Colorize uses the Color Shifter for fine-tuning its parameters and ensuring the desired effect sits well in the mix; Space control augments the spatial positioning of the delayed voicings by changing their placements in relation to the filters.

  Humanize engine introduces specially designed randomization that disrupts all parameters and the relationships between processes, from subtle human-like feel to aggressive chaos for sound design and music production.

  Runs natively in your DAW on macOS or Windows, or in real-time with near-zero latency on Antelope Audio Synergy Core interfaces. Use with the AFX2DAW plugin to mix with V12 Chorus inside your DAW while running on Synergy Core hardware. Included in the Antelope Cosmos subscription (75+ Antelope Native Plugins).
specs: |-
  - Up to 12 different voicings generated based on source material
  - Voicing generator with separate controls for time, tuning, and number of repeats
  - Colorize frequency filter with Color Shifter for parameter fine-tuning
  - Space control for spatial positioning of delayed voicings
  - Humanize engine for subtle to aggressive randomization
  - Real-time operation with near-zero latency on Synergy Core interfaces
  - Native operation in DAW on macOS or Windows
  - AFX2DAW plugin integration for mixing on Synergy Core hardware
