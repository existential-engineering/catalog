details: |-
  1987x-sg is a virtual effect audio plugin by mercuriall audio software for macos and windows. It functions as a VST plugin, an audio units plugin, a VST 3 plugin and an AAX plugin.

  Amp model on the marshall 1987x specially modified for sergey golovin. It includes a custom variation of the jose mod with an additional pregain knob and an jumped switch on two channels.

  1987x-sg is part of mercuriall ampbox platform. You will get ampbox for free with 1987x-sg purchase.

  1987x-sg highlights: accurate and detailed white-box modeling mercuriall audio is known for. Neural hybrid engine 3.0 in 1987x-sg. Made it possible to achieve a more correct tone when operating a tube power amp with a guitar cab.

  50 presets from our artists and friends to cover even the most bizarre tones.
