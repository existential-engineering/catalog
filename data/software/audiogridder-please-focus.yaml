name: AudioGridder Please Focus
manufacturer: dontstealfocus
primaryCategory: utility
categories:
  - plugin
description: "AudioGridder Please Focus solves three issues for audiogridder by
  andreas pohl on Windows systems: the position of the hosted plugins not
  remembered, the hosted plugins disappearing when you click anywhere except on
  the plugins themselves when they are opened or on agridder, and the hosted
  plugins stealing focus."
details: |-
  AudioGridder Please Focus solves three issues for audiogridder by andreas pohl
  on Windows systems: the position of the hosted plugins not remembered, the
  hosted plugins disappearing when you click anywhere except on the plugins
  themselves when they are opened or on agridder, and the hosted plugins
  stealing focus.

  It makes the hosted plugins stay on top of other windows, they don't steal
  focus anymore and are now tied to the position of the agridder plugin.

  When a hosted plugin is opened, simply press "a" or play your DAW with the
  spacebar then it will follow the agridder plugin wherever it goes. Click on it
  to un-link it.

  It's free to download. It won't work with metaplugin don't steal focus at the
  same time, so close that before and it will work without any issues.
specs: |-
  - Windows systems compatibility
  - Focus management for hosted plugins
  - Plugin position memory
  - Plugin window layering control
platforms:
  - windows
