description: An advanced MIDI processor and controller with 24 independent
  sequencer lanes, 200+ presets, and maps for 100+ hardware and software
  devices.
details: |-
  Zenith is an advanced MIDI controller and sequencer that enables modification
  of continuous controllers via independent sequencer lanes, each operating at
  unique rates and step counts.

  The plugin features 24 x 32 step sequencers capable of controlling MIDI CCs,
  pitch, velocity, and gate at varying rates. It comes with over 200 presets
  with pre-configured maps for more than 100 devices including Serum, Massive,
  Sylenth, Roland Juno 106, MKS-80, and Yamaha DX7.

  Zenith includes a customizable control surface where users can map knobs,
  faders, sliders, LFOs, filters, and envelopes to MIDI CC and SysEx functions.
  A smart chord generator supports 792 chords with automatic scale generation.

  Custom SysEx scripting support allows control of obscure or vintage hardware,
  while MIDI learn functionality provides compatibility with modern synths.
  Zenith functions both as an advanced processor and a simple custom interface.
specs: |-
  - 24 x 32 step sequencers
  - Controls MIDI CCs, pitch, velocity, and gate
  - 200+ presets with maps for 100+ devices
  - Customizable control surface with knobs, faders, sliders
  - MIDI CC and SysEx mapping
  - Chorder supporting 792 chords
  - Automatic scale generation
  - Velocity limiter
  - Custom SysEx scripting
  - MIDI learn support
