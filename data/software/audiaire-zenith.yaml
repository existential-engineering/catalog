description: Zenith is an advanced MIDI processor that allows any continuous controllers in a device to be modified by an independent sequencer lane, with each lane running at a unique rate and number of steps.
details: |-
  Zenith is an advanced MIDI processor that allows any continuous controllers in a device to be modified by an independent sequencer lane, with each lane running at a unique rate and number of steps. Take control of hardware and software instruments like never before. Unlock and hack functionality. Write patterns and design sound with unparalleled flexibility.

  It offers a unique dual operation. As a feature-rich MIDI processor it carries a host of filters, chorder, scaler, LFOs, envelopes, and 24 x 32 step sequencers controlling MIDI CCs, pitch, velocity and gate at a variety of rates, with complex tools and presets for modifying lanes. Or it can be used as a handy custom interface for simply controlling MIDI and SysEx receiving gear.

  Zenith features 200+ presets, with pre-configured maps for over 100 devices, and is AU / VST2 compatible for PC/Mac. The preset library offers default maps for popular software and hardware including Serum, Massive, Sylenth, Roland Juno 106, MKS-80, Yamaha DX7 and much more.

  The control surface is customisable: knobs, faders, sliders, LFOs, filters, and envelopes can be mapped to MIDI CC and SysEx functions in any device, to realise unparalleled sound generation functionality in MIDI gear and soft synths. Individual sequencers cover up to 24 MIDI CCs, each running at up to 27 unique rates with 100 sequence lane presets and a variety of unique lane modifiers.

  A smart chord generator supports up to 792 individual chords, alongside automatic scale generation and note velocity manipulation. Custom SysEx scripting makes it easy to add obscure SysEx devices and unlock unique functionality in rare, vintage hardware, with a simple MIDI learn function for compatible soft synths.
specs: |-
  - Advanced MIDI processor: modifies any continuous controller in a device via an independent sequencer lane
  - Each lane runs at a unique rate and number of steps
  - 24 x 32 step sequencers controlling MIDI CCs, pitch, velocity and gate
  - Individual sequencers for up to 24 MIDI CCs, each running at up to 27 unique rates
  - 100 sequence lane presets plus a variety of unique lane modifiers
  - 200+ presets with pre-configured maps for over 100 devices
  - Default maps for software and hardware including Serum, Massive, Sylenth, Roland Juno 106, MKS-80 and Yamaha DX7
  - Chorder with support for up to 792 individual chords
  - Scaler with automatic scale generation
  - Note velocity manipulation (velocity limiter)
  - Filters, LFOs and envelopes
  - Customisable control surface: map knobs, faders, sliders, LFOs, filters and envelopes to MIDI CC and SysEx functions
  - Custom SysEx scripting for obscure and vintage SysEx devices
  - MIDI learn function for compatible soft synths
  - AU / VST2 compatible for PC/Mac
