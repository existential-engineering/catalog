details: |-
  Ample China Dadi (acdd) is built on the latest development of the woodwind sample engine, with 5.8 GB samples, including head and body articulations, FX sounds, as well as a select collection of improvised licks. The artist: xiaokui ding (china national traditional orchestra). The instrument: the singing of dragon c d e f g key 5 dadis (xuehua dong masterbuilt).

  Sampling: recorded with 5 mics (front, middle, back, stereo ambient). Each mic volume is adjustable and equipped with channel eq. 3 mic modes: mono, modern and traditional, capable of colorful sound designs. There are 3 kinds of articulations head group (blue keyswitches), body group (yellow keyswitches) and special effect group (red keyswitches). Each group occupies one octave.

  The woodwinds have great dynamic range and timbre variation. The sample library provides 5 velocity layers, with sound from mildly soft to bright and strong. There are 2 velocity layers for expression articulation, 2 velocity layers for vibrato articulation, and real samples of trill sounds. Together with sahds virtual modulation system, they can create vivid and realistic notes.

  Features: intelligent legato system detects the duration of each note. The auto legato system triggers different legato types based on velocity: velocity126-127 triggers layering legato (ascending) and ripple legato (descending); velocity96-125 triggers grace legato; velocity32-96 triggers straight legato; velocity16-31 triggers soft legato 1; velocity1-15 triggers soft legato 2. In slide legato mode, low velocity triggers slide notes. Hold pedal can be used to turn on double legato mode.

  Fx: high order 8-band eq with intuitive control of frequency response and real-time visualization of input and output spectrum. 2-line compressor with real-time visualization of input and output signal, two detection modes rms & peak, support of soft knee, auto release and auto makeup. 6-tap echo with real-time visualization of stereo signal processing. Ir reverb providing four types of ir: room, studio, hall, and larger hall with 3d visualization of ir spectrum.
specs: |-
  - 5.8 GB samples
  - 5 velocity layers
  - Woodwind sample engine
  - Head group articulations
  - Body group articulations
  - Special effect group articulations
  - 3 mic modes (mono, modern, traditional)
  - 5 microphone recording (front, middle, back, stereo ambient)
  - Adjustable mic volume with channel EQ
  - Intelligent legato system
  - Auto legato system
  - Slide legato mode
  - Double legato mode
  - Endless articulation legato
  - Creative mirroring feature
  - Voice independent sahds modulation system
  - Adjustable wind effect
  - Sample skipping technology
  - Random articulation
  - Keyboard mode for playing chords
  - 8-band EQ
  - 2-line compressor
  - 6-tap echo
  - IR reverb (room, studio, hall, larger hall)
  - macOS support
  - Windows support
