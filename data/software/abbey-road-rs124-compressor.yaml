details: >-
  Give your music the sound of silky-smooth abbey road rs124 compression the
  legendary velvety tones heard on every beatles recording made at abbey road.
  With two distinct flavors to choose from, this classic tube model is the only
  software emulation of the ultra-rare rs124s, approved by abbey road studios.


  The custom-built rs124 compressors were the secret weapon of abbey road
  engineers during the '60s favored by geoff emerick for punchy bass sounds; by
  ken scott for lush guitar treatment; by norman smith for lightly gluing the
  entire rhythm bus. Rs124 was also a popular choice for mastering in abbey
  road's cutting rooms.


  The rs124 was actually an extensive in-house modification of the american
  altec 436b compressor. It is believed only 25 units were ever created, and
  each serial number was hand-built by abbey road/emi technical legends bill
  livy, len page, and mike bachelor. Naturally, no rs124 unit sounded exactly
  the same.


  The waves abbey road plugin features two distinct rs124 flavors, modeled from
  the original hardware: studio models rs124 serial no. 60070b a favorite unit
  used for tracking at abbey road from the late '50s into the '60s, due its
  faster attack and release times. Cutter is a modification with slower attack
  and release times favored for studio reduction mixes and in abbey road's
  cutting rooms during the '60s.


  The rs124 is a feedback compressor with a variable recovery. The included
  super-fuse mode matches release time to attack time, creating a brutal
  compression character that sounds like it's fighting against itself. Since its
  rediscovery in the early 2000s, this important, rare, and unique compressor is
  still being used at abbey road studios today.
