details: >-
  Ableton drum racks bundle for ezdrummer country edition is a collection of
  ezdrummer pop performance drum racks on ableton push featuring over 100
  ableton drum racks and over 50 ableton live routing templates configured for
  leading toontrack ezdrummer2 core libraries and 2 additional country genre ezx
  expansions -traditional country and nashville.


  This library contains 4 timbresandtones ableton drum rack products bundled for
  toontrack ezdrummer modern kit, vintage kit, traditional country ezx and
  nashville ezx: ableton drum racks for ezdrummer modern kit with 34 ableton
  drum racks individually mapped to all modern kit factory library content
  presets, with 17 predesigned ableton live templates to cater for the multi
  track audio routing of the ezdrummer modern rock kit presets in ableton live.


  Ableton drum racks for ezdrummer vintage kit with 24 ableton drum racks
  individually mapped to all vintage kit factory content presets, with 12
  predesigned ableton live templates to cater for multi track audio output
  routing of the ezdrummer vintage kit presets in ableton live.


  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all ezdrummer factory presets from ableton push
  controller device browser. Over 100 ableton drum racks to instantly load the
  factory library "mix ready" presets with ableton mappings. Over 50 ableton
  live templates for prebuilt multi track audio routing to each ezx expansion.


  Audio routing options: singleout presets featuring 52 ableton drum racks for
  all factory presets single audio output to single ableton track. Multiout
  presets featuring 52 ableton drum racks for all presets in multiple audio
  channel output from the plug in to multiple ableton audio tracks using the
  multi output ableton template also provided.
