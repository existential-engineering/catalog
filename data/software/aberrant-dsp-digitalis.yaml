description: Digitalis is a multi-effect digital degradation and glitch tool. Inspired by bad converters, unearthed CDs, weak internet connections, and catastrophic errors, Digitalis is your personal vehicle through an endless digital wasteland.
details: |-
  Digitalis is a multi-effect digital degradation and glitch tool inspired by
  bad converters, unearthed CDs, weak internet connections, and catastrophic
  errors.

  The Data manipulation window features a spectral filtering PaintBox for
  filtering audio with custom patterns, a Pitch section with pitch shifting,
  formant shifting, and pitch quantization, and a Telecommunications section for
  lossy audio effects.

  The Corruption window includes a Decimate section for flexible downsampling,
  dynamic bitcrushing with multiple modes, and a Bitrot section emulating data
  loss and corruption on old digital media.

  The Time window offers a highly adjustable Repeater section for tempo-synced
  or free-floating retrigger and beat-repeat effects, with Pitch Shift and Bend
  controls, plus Rhythm Glitch and Pitch Glitch controls for added chaos.

  Digitalis also features customizable window order for changing signal flow, a
  16-step tempo-synced sequencer with 4 slots for effects, an advanced AI
  assistant named Jon, and 98 factory presets. Requires Windows 10+ (VST3, AAX
  64-bit) or macOS 10.13+ Intel or Apple Silicon (AU, VST3, AAX 64-bit).
specs: |-
  - Spectral filtering PaintBox for custom audio patterns
  - Pitch shifting, formant shifting, and pitch quantization
  - Telecommunications section for lossy audio effects
  - Decimate section for flexible downsampling
  - Dynamic bitcrushing with multiple modes
  - Bitrot section emulating data loss on old digital media
  - Repeater section for tempo-synced retrigger and beat-repeat
  - Pitch Shift, Bend, Rhythm Glitch, and Pitch Glitch controls
  - Customizable window/signal flow order
  - 16-step tempo-synced sequencer with 4 effect slots
  - Advanced AI assistant Jon
  - 98 factory presets
  - Windows 10+ (VST3, AAX 64-bit)
  - macOS 10.13+ Intel or Apple Silicon (AU, VST3, AAX 64-bit)
