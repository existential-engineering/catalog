description: CHROMA - UPRIGHT PIANO is the essence of intimacy and warmth, capturing the soul of a century-old Wilhelm Diemer upright piano.
details: |-
  CHROMA - UPRIGHT PIANO is built on a century-old Wilhelm Diemer upright piano from a small workshop in Würzburg, Germany, lovingly restored with new strings, felts and mechanics. The restoration preserved the instrument's authentic, vintage character while Sonuscore layered a modern sampling engine on top, so the library both recreates the piano's original sonority and creates new and abstract soundscapes. The project began when the team set out to record a grand piano and were captured instead by the unassuming upright standing in the same studio.

  The recording process used a plethora of microphone positions to capture every nuance: FRONT (two Coles 4038s close to the strings with another ribbon mic in the middle), ABOVE (two Neumann km140s a metre from the piano pointing over the player's shoulders, plus a pair of SCHOEPS mk5 in ORTF higher and further away), BELOW (two Gefell m930s under the keybed and a pair of Sennheiser mkh8020s behind the piano), and the unique RUMBLE (a single LOM Audio Geofon fixed to the metal plate with a magnet). All four positions are freely adjustable in the mix page, alongside a velocity curve control.

  Beyond conventional keys, the library records articulations that push it past a traditional piano: felt, palm mutes, plucked strings, flageolets and bowed e-bow tones, plus mechanical Note On, Note Off and Pedal sounds for added realism. Its core engine, inspired by TIME TEXTURES, offers full mod wheel support, octave pitch control and detailed effect swapping.

  The interface is split across a main page (articulation mix, FX and mechanics), an engine page for extended soundscape creation, a preset browser holding over 90 presets, and a mix page for microphone balance and velocity response. The page presents it as the ideal companion to CHROMA - GRAND PIANO, noting it sits naturally in a mix where a grand piano can dominate.
specs: |-
  - Works with the FREE KONTAKT PLAYER
  - Requires KONTAKT version 7.10.4 or higher
  - macOS 10.15 or higher
  - Windows 10 or higher
  - 8 GB RAM (more recommended)
  - At least 17 GB of free hard disk space, SSD recommended
  - Some presets require a fast CPU, Intel i7 processor or higher
  - 27 velocity layers for normal piano sound
  - 8 round robins for all mechanical sounds
  - 4 freely adjustable microphone positions: FRONT, ABOVE, BELOW, RUMBLE
  - Over 90 ready-to-go naturalistic and cinematic ensemble presets
  - Multiple modifiable articulations: felt, muted, plucked, flageolet, bowed
  - Adjustable mechanics: Note On, Note Off, Pedal
  - Full mod wheel support of its core engine, inspired by TIME TEXTURES
  - Engine enhancements: octave pitch control, detailed effect swap
  - Sampled from a restored century-old Wilhelm Diemer upright piano
