description: "A meticulously modeled virtual tonewheel organ replicating the
  most famous tonewheel organs in the world, including the B-3, C-3, A-100,
  L-100, CV, and M-3. Features 31 tonewheel sets accurately capturing variations
  between vintage instruments, 91 modeled tonewheels with phase synchronization,
  and authentically emulated scanner vibrato/chorus. Uses modeling technology
  with no samples. Includes full polyphony for upper, lower, and pedal manuals,
  customizable keyboard split, over 200 presets, rotary speaker simulation with
  six speaker options, microphone simulation, and three stompbox-style effects
  (tape echo delay, reverb with spring/plate/hall modes, and seven-band graphic
  EQ)."
