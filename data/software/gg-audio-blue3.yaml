description: A meticulously modeled virtual tonewheel organ replicating the most famous tonewheel organs in the world, including the B-3, C-3, A-100, L-100, CV, and M-3. Features 31 tonewheel sets accurately capturing variations between vintage instruments, 91 modeled tonewheels with phase synchronization, and authentically emulated scanner vibrato/chorus. Uses modeling technology with no samples. Includes full polyphony for upper, lower, and pedal manuals, customizable keyboard split, over 200 presets, rotary speaker simulation with six speaker options, microphone simulation, and three stompbox-style effects (tape echo delay, reverb with spring/plate/hall modes, and seven-band graphic EQ).
details: |-
  Blue3 is a meticulously modeled — not sampled — virtual instrument that replicates the most famous tonewheel organs in the world: the B-3, C-3, A-100, L-100, CV, and M-3 models. With 31 tonewheel sets accurately capturing variations between vintage instruments, 91 modeled tonewheels with phase synchronization, and authentically emulated scanner vibrato/chorus, Blue3 delivers the iconic, soulful sounds associated with nearly a century of blues, gospel, rock, and jazz classics.

  Cherry Audio's Blue3 features a new, beautifully designed user interface with Main, Edit, Cabinet, and Perform sections. And it goes beyond the traditional B3 sound by adding three studio-quality stompbox-style effects: Tape Echo Delay, Reverb with Spring, Plate, and Hall, and a Seven-band Graphic EQ.

  Blue3 offers full polyphony for upper, lower, and pedal manuals, a customizable keyboard split function, and handy drawbar utilities including Copy, Swap, Reset, and Randomize. Tones can be further refined with settings for condition, key click, percussion, and multiple overdrive options.

  The Cabinet page provides six speaker options and adjustable rotary speed with acceleration and deceleration. The microphone simulation includes spread and distance controls, four mic selections, and click-and-drag placement in an updated UI.

  With MIDI mapping and a rich library of over 200 presets covering classic to modern tones, Blue3 is the ultimate package for both stage and studio.
specs: |-
  - 31 tonewheel sets based on vintage B-3, C-3, A-100, L-100, CV and M-3 instruments
  - 91 modeled tonewheels with accurate phase synchronization
  - Full polyphony for upper, lower, and pedal manuals
  - Registration (inverted) keys with A# & B drawbar presets
  - Adjustable Condition settings with tonewheel crosstalk, flutter, leakage, noise, and transformer settings
  - Selectable foldback for the 16' drawbar
  - Customizable keyboard split function
  - Global three-band output EQ
  - Copy, swap, reset, and randomize options for Upper and Lower drawbars
  - Accurately simulated "scanner" vibrato/chorus with swell, great, and type and depth settings
  - Key Click options for volume and tone
  - Percussion for top manual with fine-tuning controls for volume, decay, and harmonic selector
  - Drive with four different tube simulations to emulate the preamp and rotary enclosure's amplifier
  - Classic 122, 147, RA-200, 4x12 guitar amp, and custom rotary speaker simulations, along with direct
  - Adjustable rotary speeds with acceleration and deceleration
  - Accurate microphone simulation, with spread and distance controls, four mic (dynamic and condenser) selections, and click-and-drag placement
  - Diffuser, Front Stop, Memphis, and Wind options for rotary speaker
  - Three studio-quality stompbox-style effects: Tape Echo Delay, Reverb with Spring, Plate, and Hall, Seven-Band Graphic EQ
  - Over 200 presets spanning from classic to modern tones
  - Complete MIDI control and DAW automation for all controls, with easy-to-use MIDI learn and mapping (Preset and Global)
  - Focus zoom-in feature, as well as standard UI zoom and resize via drag
  - User-adjustable oversampling quality control
  - macOS 10.13 or above, macOS 13 Ventura supported, 64-bit required, native Apple M1 or greater processor support including Ultra, 3.4 GHz Quad-Core or M1 CPU with 8GB of RAM recommended
  - Windows 7 or above (including Windows 11), 64-bit required, 3.4 GHz Quad-Core computer with 8GB of RAM recommended
  - Hard disk space: 182 MB
  - Internet connection required for product activation
