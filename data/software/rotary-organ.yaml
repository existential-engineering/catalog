description: Adam monroe's Rotary Organ is a 32/64-bit virtual instrument plugin
  that simulates a hammond b3 organ with rotating leslie speaker.
details: |-
  It includes 60 note range, percussion, vibrato scanner, leslie simulation, key
  click, and 10 harmonics per note.

  Features distortion and smoothing effects, with 115 built-in presets.

  Includes vacuum tube sims and eq speaker curves.

  Offers algorithmic reverb and irs (spring, plate, hall, etc.) and cabinet irs.
specs: |-
  - 32/64-bit virtual instrument plugin
  - Hammond b3 organ simulation
  - Rotating leslie speaker simulation
  - 60 note range
  - Percussion
  - Vibrato scanner
  - Leslie simulation
  - Key click
  - 10 harmonics per note
  - Distortion effects
  - Smoothing effects
  - 115 built-in presets
  - Vacuum tube sims
  - EQ speaker curves
  - Algorithmic reverb
  - Spring reverb IR
  - Plate reverb IR
  - Hall reverb IR
  - Cabinet IRs
  - macOS support
  - Windows support
  - Intel core i3 or higher (Windows minimum)
  - Intel core i5 or higher (macOS minimum)
  - 400 MB RAM (Windows)
  - 400 MB RAM (macOS)
  - Os x 10.9-11.0 support
  - Pro Tools full required for AAX version
  - Universal 2 binary
