description: "SampleTank 4 is the latest version of the IK Multimedia sound and
  groove workstation virtual instrument with an extensive sound, instrument, and
  groove library"
details: |-
  SampleTank 4 features 4 HD sampling engines including STRETCH disk streaming technology for loading massive libraries without excessive RAM usage. The MAX edition includes over 8,000 instrument presets and 250+ GB of sound content spanning every musical genre and style.

  The sound engine provides 16 filter types, 70 professional effects (5 per sound plus master effects), up to 6 modulation envelopes per element, and 4 ADSR generators (Amplifier, Filter, Pitch, Modulation). A modulation matrix enables complex sound design possibilities.

  Four groove players -- Arpeggiator, Strummer, Phraser, and Loop Manager -- provide 7,500+ loops and 4,000+ MIDI patterns for instant musical inspiration. The 16-part multitimbral architecture with 16 individual stereo outputs supports complex arrangements and live performance setups. Live Mode and a resizable interface adapt to any workflow.
specs: |-
  - 4 HD sampling engines with STRETCH disk streaming
  - 8,000+ instrument presets (MAX edition)
  - 250+ GB sound content (MAX edition)
  - 70 professional effects, 16 filter types
  - 4 groove players: Arpeggiator, Strummer, Phraser, Loop Manager
  - 16-part multitimbral with 16 stereo outputs
  - Modulation matrix, 4 ADSR generators
  - Live Mode with resizable interface
  - macOS 10.13+ / Windows 7+
  - AU, VST2, VST3, AAX, Standalone
