details: |-
  Roland synthesizers have inspired artists and defined genres for decades. With
  the analog polysynth collection, you get five of our most revered synthesizers
  from the late '70s and early '80s. Backed by our analog circuit behavior (acb)
  technology, these iconic instruments are brought to life with breathtaking
  realism in your DAW or system-8 hardware.

  These recreations sound and behave exactly like the original hardware with
  stunning accuracy. And going further, they also offer lots of extended
  functionality to meet the needs of today's workflows. Thanks to our
  proprietary circuit modeling technology, these classics are ready to imbue
  your tracks with retro energy and fuel tomorrow's masterpieces.

  The acb process involves carefully analyzing original hardware units, circuit
  diagrams, and other historical data. We then use this information to recreate
  the authentic circuit behaviors of the vintage instrument—including all the
  beloved quirks and instabilities—giving these synths their amazingly lifelike
  sound and organic response.

  The jupiter-4 software synthesizer is an authentic recreation of the first
  synthesizer to carry the iconic jupiter name. Introduced in 1978, the
  jupiter-4 kicked off the storied legacy of roland analog polysynths and sounds
  exactly like you'd expect—warm, fat, and evocative of synth pop, new wave, and
  other emerging styles of the era.

  The juno-106, released in 1984, was a standard-setting analog polyphonic
  synthesizer. Following the juno-6 and juno-60, it was the third and most
  advanced model in the juno series, and the first to incorporate the new MIDI
  standard. The 106 built on the innovations introduced with its predecessors,
  offering easy programmability, digitally controlled oscillators, expanded
  patch memory, a lush stereo chorus effect, and more.
specs: |-
  - Analog circuit behavior (acb) technology
  - Additive synthesis
  - MIDI support
  - Digitally controlled oscillators
  - Stereo chorus effect
  - Extended patch memory
  - Component-level circuit modeling
  - Five synthesizer recreations
