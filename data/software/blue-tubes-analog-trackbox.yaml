details: |-
  The Blue Tubes Analog TrackBox is an all-purpose channel strip tool designed
  with the ultimate in sound quality and audio character for maximum musical
  flexibility.

  The tube-emulator section has the unique option of being able to switch
  between two different sounding tube options from single-triode to dual-triode.
  The independent amount and color controls permit overdrive of the
  tube-emulator stage to vary the harmonic content of the signal.

  The gate/expander section tames the noise floor so that you hear only the
  audio you want to keep. This fully-adjustable gate/expander reduces (or cuts)
  the signal if the level becomes too low (as determined by the gate threshold
  setting). Like a compressor, the attack and release controls determine how
  fast the gate opens and closes.

  The compressor section, derived from our popular blue tubes compressor cp2s
  emulates analog compressors in terms of looks, functions, and warm analog
  sound found in vintage compressors to provide the classic feedback response
  unique to the characteristics of the blue tubes analog trackbox.

  The equalizer section, derived from the blue tubes peq322 is designed to meet
  the most demanding studio tracks, features 2 parametric bands with center
  frequency, bandwidth-q and amplitude controls as well as low-shelf and
  high-shelf filters.
