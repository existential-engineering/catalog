description: Voltage Modular is a virtual modular synthesizer environment for
  Windows and macOS, designed from the ground up to address the shortcomings of
  other virtual modular synth instruments.
details: |-
  Voltage Modular 2 for Windows and macOS is available as an Apple Silicon Native application. The update brings new features, workflow improvements, and new sonic possibilities to software modular synthesis.

  Unlimited cables per jack allows for endless modulation possibilities. The Busses feature offers another way to build complex patches and eliminate messy cables. Variations makes unlimited variations available per patch: play variations individually, or use triggers or CV to move through them. The IO Panel includes an integrated Recording section, generating 32-bit floating point audio files sourced from the IO Panel main left and right outputs. Workflow improvements range from custom module categories and search terms to optional auto-alignment of modules in cabinets.

  Unparalleled Workflow: designed to address the shortcomings of other virtual modular synth instruments. It features unlimited pop-up mults on all inputs and outputs, repositioning of modules or groups of modules, cables that can be moved and rerouted at all times, and control panels with extensive visual feedback, including cable signal flow indicators.

  Fantastic Sound Quality: all audio processing in Voltage Modular uses 64-bit double precision math, and all module processes are zero-latency and operate on individual samples for true modular performance. This translates to audio-rate frequency and amplitude modulation, oscillator sync, extended delay feedback, and more.

  Infinitely Expandable: the module browser allows users to purchase and automatically install modules and sound presets directly from within Voltage Modular for immediate expandability.
specs: |-
  - Unlimited cables per jack
  - Busses for building complex patches with fewer cables
  - Variations, with unlimited variations per patch, navigable by trigger or CV
  - Integrated Recording section in the IO Panel, generating 32-bit floating point audio files
  - Custom module categories and search terms
  - Optional auto-alignment of modules in cabinets
  - Unlimited pop-up mults on all inputs and outputs
  - Cables can be moved and rerouted at all times
  - Cable signal flow indicators
  - 64-bit double precision audio processing, zero-latency, sample-accurate module processes
  - Integrated module browser for installing additional modules and presets
  - Apple Silicon native
  - macOS 11 or above, 64-bit required; macOS 11.6 or higher required for Apple silicon support
  - Windows 7 or above, 64-bit required
  - Internet connection required for product activation
