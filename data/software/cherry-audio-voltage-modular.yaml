description: >-
  Voltage Modular is a virtual modular synthesizer environment for Windows and
  macOS, designed from the ground up to address the shortcomings of other
  virtual modular synth instruments.
details: |-
  Voltage Modular 2 for Windows and macOS is now available as an Apple
  Silicon Native application for even more impressive performance. It
  obliterates all patching limitations and introduces groundbreaking new
  ways to build complex patches with fewer cables.

  Designed from the ground up to address the shortcomings of other virtual
  modular synth instruments, Voltage Modular features unlimited cables per
  jack, a busses feature for complex patches, and unlimited variations
  per patch.

  The innovative module browser allows users to purchase and automatically
  install modules and sound presets directly. With 64-bit double precision
  math for audio processing and zero-latency module processes, Voltage
  Modular delivers professional-grade performance.

  Voltage Modular is available in three tiers: the free Nucleus edition,
  Ignite at $50, and Core + Electro Drums at $99, each offering
  increasing module collections.
specs: |-
  - Unlimited cables per jack
  - Busses feature for complex patches
  - Unlimited variations per patch
  - Integrated 32-bit floating point audio recording
  - Custom module categories and search terms
  - Auto-alignment of modules in cabinets
  - 64-bit double precision math for audio processing
  - Zero-latency module processes
  - Sample-accurate operation
  - Unlimited pop-up mults on inputs/outputs
  - Moveable and reroutable cables
  - Cable signal flow indicators
  - Apple Silicon native support
