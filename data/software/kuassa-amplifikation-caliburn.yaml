description: Amplifikation Caliburn is our most realistic amp simulator (yet).
  We are confident to say that this is our best amp yet.
details: |-
  In the history of music, british-made amplifiers have had undeniable
  influences on the evolution of rock music. The loud, chimey clean, and thick
  crunchy mids of those amps were popularized by big acts such as jimi hendrix,
  LED zeppelin, and the who. It is the sound of rock music that lasts through
  generations until today.

  Following our extensive experimentation and never-ending quest to be the
  prominent guitar amplifier on your pc, now you can have the famous "british
  crunch" right from your personal computer. Powered by the 3rd generation of
  our research and technology, kuassa amplifikation caliburn brings the soul of
  the iconic sound to your desktop.

  Key features: 3 amp types, taken inspiration from marshall jtm45, jcm800, and
  jcm900 master volume. 2 channels for each amp: clean and lead. Power amp sag
  and bias feature. Five types of cabinets with celestion speakers: high pass
  and low pass filters. Seven types of workhorse mics: shure sm57, sennheiser
  md421, sennheiser md441, c&t naked eye, royer 121, akg c414, neumann tlm103.
specs: |-




  - Rack extension plugin


  - 3rd generation modeling technology

  - 3 amp types (marshall jtm45, jcm800, jcm900 inspired)

  - 2 channels per amp (clean and lead)

  - Master volume

  - Power amp sag

  - Power amp bias

  - 5 cabinet types with celestion speakers

  - High pass filter

  - Low pass filter

  - 7 microphone types (shure sm57, sennheiser md421, sennheiser md441, c&t
  naked eye, royer 121, akg c414, neumann tlm103)

  - Impulse response feature

  - Windows xp, vista, 7, or later (32/64-bit)

  - Mac os 10.5 or later (32/64-bit)

  - VST/vst3/AU/AAX compatible host required
