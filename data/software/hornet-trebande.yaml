description: HoRNet TreBande is a a three-band semi parametric equalizer that mirrors the character of the equalizer found in your average mixer
details: |-
  HoRNet TreBande is a three-band semi-parametric equalizer that replicates the character of the equalizer found in a typical mixer. This free plugin reproduces the warmth, subtle coloration and precision of traditional mixing desks in a modern digital environment.

  TreBande is derived from the equalizer section of HoRNet's Cassette644 plugin, bringing the same precision and control of an average mixer's parametric equalizer into the DAW. The controls are deliberately simple rather than overwhelming, focused on reliable, accurate equalization that stays true to its analog roots.

  What sets it apart is its ability to infuse warmth and subtle saturation into the audio. Rather than only adjusting frequencies, it adds a layer of richness, and the subtle harmonic distortion helps elements of a mix blend together more naturally.

  The plugin mirrors the equalization controls found on most classic mixers across three ranges. A High Shelf controls brilliance, adding shine to the high end or taming excess brightness. A Mid Band shapes midrange presence between 250Hz and 5000Hz. A Low Shelf sculpts the bass, adding depth and warmth or tightening excess rumble.

  Dark and light mode settings follow the OS or the user's preference, the interface is scalable, and the plugin runs natively on Apple Silicon.
specs: |-
  - Precise emulation of a three-band semi-parametric EQ as found on some vintage portable tape-recording machines
  - Adds a subtly saturated and warm sound
  - Authentic hiss simulation that can be enabled or disabled
  - High Shelf to control brilliance, attenuating or boosting from -15dB to +15dB
  - Mid Band to enhance presence, adjusting midrange frequencies (250Hz to 5000Hz) and their gain
  - Low Shelf to control the bass frequencies with a +/-15dB gain control
  - Adapts to dark and light mode according to OS settings
  - Scalable user interface
  - Apple Silicon native support
  - macOS (10.13 and later) and Windows (Windows 10 and later) support
  - 64-bit on Mac and Windows
  - Audio Units, VST, VST3 and AAX format
  - No copy protection
