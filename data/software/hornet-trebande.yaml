description: HoRNet TreBande is a three-band semi parametric equalizer that mirrors the character of the equalizer found in your average mixer.
details: |-
  Introducing HoRNet TreBande, a meticulously crafted three-band semi-parametric equalizer that replicates the distinctive character of the equalizer found in your typical mixer. This free plugin goes beyond being just a standard equalizer; it embodies the very essence of your mixer's sound, expertly reproduced to allow for precision shaping in a modern digital environment.

  Designed as the equalizer section of HoRNet's acclaimed Cassette644 plugin, TreBande brings the same precision and control of your average mixer's parametric equalizer to your digital workstation. The equalizer offers adjustable frequency bands that let you sculpt your sound to perfection, enabling you to adjust highs, mids, and lows to suit your needs.

  What sets TreBande apart from other equalizers is its ability to infuse a sense of warmth and subtle saturation into your audio. The subtle harmonic distortion that TreBande adds ensures that your elements blend together naturally, helping your mix feel more organic and cohesive.

  TreBande mirrors the equalization controls found on most classic mixers, offering precise control over three essential frequency ranges: brilliance, midrange presence, and bass. The high and low shelving filters give you the ability to shape the overall tonal balance, while the midrange band allows you to focus on specific elements like vocals, guitars, or drums.

  TreBande features dark and light mode settings, boasts native support for Apple Silicon, and is compatible with macOS (10.13 and later) and Windows (Windows 10 and later). It is available in 64-bit Audio Units (AU), VST, VST3, and AAX formats.
specs: |-
  - Precise emulation of three-band semi-parametric EQ as it was available on some vintage portable tape-recording machines
  - Adds a subtly saturated and warm sound
  - Authentic hiss simulation that can be enabled or disabled
  - High Shelf: control the brilliance of your audio by attenuating or boosting from -15dB to +15dB
  - Mid Band: enhance the presence by adjusting the midrange frequencies (250Hz-5000Hz) and their gain
  - Low Shelf: control the bass frequencies or add some boomy low end with a +/-15dB gain control
  - Adapts to dark and light mode according to your OS settings or needs
  - Scalable user interface
  - Apple Silicon native support
  - macOS (10.13 and later) and Windows (Windows 10 and later) support
  - 64-bit on Mac and Windows
  - No copy protection
