details: |-
  London's best symphonic brass and woodwinds sections — 19 players recorded in the reverberant acoustics of AIR Studios, London. Six essential articulations across both Brass and Woodwinds sections, each with Long and Short presets, as well as Live patches that combine the two. Three signals let you shape the sound: Room for the full AIR Studios acoustic, Close for added punch and definition, and Distorted for a gritty, characterful edge.

  Originals Epic Brass and Woodwinds requires the free Splice INSTRUMENT plugin to run.
specs: |-
  - File size: 1.5 GB
  - 19 players recorded at AIR Studios, London
  - 6 presets
  - 3 mic signals: Room, Close, Distorted
  - macOS 12 or later, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
