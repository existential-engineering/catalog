description: "An advanced mixing and mastering equalizer expanding upon SlickEQ
  with a Tilt-filter, flexible high-pass and low-pass filters, five distinct EQ
  models, and switchable non-linearity with eight output stages for varied tonal
  coloration."
details: |-
  Version 1.3.9. Three semi-parametric filter bands with two shape options each. Five EQ models: American, British, German, Soviet, Japanese. Eight output stages: Linear, Silky, Mellow, Deep, Excited, Toasted, Funky, Seven. Low-pass filter with 6dB/Oct and 12dB/Oct slopes. High-pass filter with optional Bump mode. Parametric Tilt filter with optional V mode. 64-bit multi-rate processing. Stereo, mono, mid/side processing modes. Real-time frequency analyzer. Auto gain compensation. Smart operations including Match Pink, Match Reference, De-resonate.
specs: |-
  Windows 7 or above. Mac OS X 10.9 or above. VST2, VST3, Audio-Unit, or AAX compatible plugin host. OpenGL support required.
