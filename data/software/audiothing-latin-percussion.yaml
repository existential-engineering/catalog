description: Latin Percussion is a sample-based plugin emulation of the vintage
  Sound Master Latin Percussion, a rare analog drum machine from the 80s.
details: |-
  Latin Percussion is a sample-based plugin emulation of the Sound Master Latin Percussion, a rare analog drum machine from the 80s.

  The instrument features 6 classic latin sounds: Bass, Low Conga, High Conga, Bongo, Claves, and Maracas, which can be pitched, panned or mixed independently. The sound can be shaped further with the onboard Overdrive and Reverb.

  The sequencer lets you build patterns that can be dragged and dropped to your DAW or host as MIDI. It ships with 20 factory presets and 9 factory patterns.

  Latin Percussion is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP). It is also available on the App Store for iOS and iPadOS (AUv3 and Standalone).
specs: |-
  - 6 classic analog sounds
  - 20 Factory Presets / 9 Factory Patterns
  - Overdrive and Reverb Effects
  - Sequencer with MIDI Drag to DAW
  - Preset system with randomizer
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP 64-bit)
  - macOS 10.13 - macOS 26, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP 64-bit)
  - 1 license up to 3 computers, no iLok, no internet connection required to activate
