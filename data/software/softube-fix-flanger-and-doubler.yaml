details: |-
  Versatile flanger and rich doubler from the mind of Paul Wolff. Fix Flanger delivers the sound of classic flanging, with extreme control and flexibility, while Fix Doubler provides lush chorus and rich textures to your vocals.

  In 1979, Paul Wolff formalized a vision which was turned into an exclusive limited edition hardware, that became loved among musicians and sound engineers. In 2015, the Fix Flanger and Doubler is the reincarnation of this vision, a plug-in package that handles hands-on flanging with unique stereo widening methods, as well as vocal doubling with lush chorus and rich textures.

  The plug-in offers unprecedented hands-on VSO flange control, with servo motor bounce emulation. 'Auto Double' uses a unique method of accurate phase-cancellation to make a natural sounding doubler effect.

  This product supports Extended Features: easy-access panels with modern precision and workflow innovations alongside the VU meters, Bakelite knobs, and analog quirks of the original.

  Fix Flanger and Doubler is also available as a part of Flow Mixing Suite and Flow Complete Suite. No USB iLok key is required.
specs: |-
  - Fix Flanger delivers the sound of classic flanging, with extreme control and flexibility
  - Unprecedented hands-on VSO flange control, with servo motor bounce emulation
  - Fix Doubler provides lush chorus and rich textures to your vocals
  - 'Auto Double' uses a unique method of accurate phase-cancellation to make a natural sounding doubler effect
  - No USB iLok key required
  - Supports Softube Extended Features
  - Designed by Paul Wolff
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26
  - System requirements: Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access for downloading installers and managing licenses
  - Three activations included
