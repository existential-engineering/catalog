description: Created by analog synthesizer collector and world-class sound designer Alessandro Cardinale, STRANGER draws heavily on textures sampled from his collection of vintage synthesizers.
details: |-
  Usynth STRANGER puts a sonic toolbox of otherworldly, strange, dark synthesizer textures into your hands. Created by analog synthesizer collector and world-class sound designer Alessandro Cardinale, STRANGER draws heavily from his collection of vintage synthesizers.

  While STRANGER's aesthetic is focussed on warm, retro, saturated, it offers a wide range of categories from Arps to Basses, from Leads to Pads, from Poly to Strings. Add a beat (or not) and effects and you are done. Perfect (not only) for ambient, electronic, film scores and game soundtracks.

  Usynth STRANGER includes 50 presets by the acclaimed British producer, composer, and electronic musician, Sunglasses Kid. Specializing in cinematic 80s, pop, synthwave, and retro instrumentals, Sunglasses Kid brings his signature nostalgic sound to your music production.

  Usynth is made for people who want to program their own synth sounds without programming synths, like most musicians. It features a powerful synthesizer engine that combines Virtual Analog, Wavetable, FM, and Multi Sampler, with dozens of filter modes, modulation matrices, envelopes, LFOs, and hundreds of parameters.
specs: |-
  - A sonic universe inspired by groundbreaking sci-fi series of the last decade
  - Arps, Atmos, Basses, Brass, Keys, Leads, Pads, Picked, Poly, Sequences and Strings
  - 50 exclusive presets by Sunglasses Kid
  - Revolutionary interface: create your own sounds without synthesizer knowledge
  - Powerful synthesizer engine with virtual analog, FM, wavetable and multisampler
  - 7-day fully functional trial, with trials of all other Usynth titles startable from within Usynth
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8GB of RAM
  - 1.21GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Requires the latest version of the UJAM App, which installs the Usynth plug-in that hosts all titles
