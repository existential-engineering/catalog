details: >-
  Aeterna by wide blue sound is a virtual instrument audio plugin and a software
  application and soundware for macos and windows. It includes, and is therefore
  powered by, kontakt player, which functions as an audio units plugin, a VST 3
  plugin, an AAX plugin and a standalone application.


  Colossal, ominous, lethal. Eclipse's ferocious might is amplified further by
  aeterna, ideal for action, drama and trailers. Fiery leads, aggressive
  sequences, and colossal moments inject energy to your compositions.


  Provide unrelenting tension and abstraction with aeterna.
