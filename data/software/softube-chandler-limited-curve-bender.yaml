details: |-
  An expertly emulated version of the Chandler Limited Curve Bender, fully-endorsed by the creator of the original hardware, Wade Goeke. It is an extremely musical mastering equalizer based on legendary console EQ circuits from Abbey Road Studios in London.

  With tremendous pedigree, huge yet controlled power, and most importantly, exceptional sound quality, thanks to component-level modelling of the original germanium and inductor circuits, the Curve Bender, now available for the first time in native format, reigns supreme over the domain of tone-shaping in analog mastering.

  The sound of this unit comes from equalizer circuits which can trace their lineage back to one of the most legendary high-end British consoles of all time, the EMI TG12345. With its gentle, carefully designed curves, silky top-end, and tight lows, it is impossible not to improve your sound. Just set and forget.

  In software form, the Curve Bender plug-in not only allows you the luxury of using this ultra-special crown-jewel mastering EQ in multiple places in the same mix (across instrument groups and the master bus, for example), but also adds functionality to the original hardware, with Mid/Side processing and channel linking. A mastering grade processor, the Curve Bender is perfect for gently sculpting the entire mix, with never a hint of harshness despite its endless power.

  To help you get the best out of the Curve Bender, Softube asked top professional mixing and mastering engineers to create presets. Quickly and easily dial in a sound you like by referencing Joe Chiccarelli, Tony Maserati, Howard Willing, Kevin Kadish, and Maor Appelbaum.
specs: |-
  - Mastering grade analog equalizer, with silky top-end and tight lows
  - Based on legendary British console EQ circuits used on innumerable classic records
  - Professional engineer presets from Joe Chiccarelli, Tony Maserati, Howard Willing, Kevin Kadish, and Maor Appelbaum
  - Console 1 Ready: works as a native plug-in and in Softube Console 1
  - Improved with more bands, more filter-points, greater gain and Q flexibility, and additional low and high pass filters
  - Added Mid/Side processing and channel linking in the plug-in
  - Subtle yet authoritative; carefully considered curves and exceptional quality mean you can boost with confidence
  - Supports Softube Extended Features panels
  - Component-level modelling of the original germanium and inductor circuits
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26; Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Three activations, 20-day trial, 14-day returns
