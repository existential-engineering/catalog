description: "Playable delay plugin built with hardware controllers and analog
  vibe in mind. Features single or dual delay modes with ping pong options,
  quantizable note sync from 128th note to whole note, milliseconds mode from
  3ms to 8 seconds, controllable glide time, tape section with LOFI and wobble
  controls, filter and spring reverb sections, spatial panning, zero latency
  operation, and momentary macro controls (Kill All, Kill Feedback, Infinite
  Hold, Spring Hold)."
details: |-
  1 page

  Single (A) or dual delay (A+B) modes
  Ping pong delay with crossfeeding
  Note sync: 128th note to whole note range
  Milliseconds mode: 3ms to 8 seconds
  Controllable glide time for delay transitions
  Tape section with LOFI and wobble controls
  Filter section for tone shaping
  Spring reverb section
  Spatial panning controls
  Zero latency operation
  HQ mode
  Momentary macros: Kill All, Kill Feedback, Infinite Hold, Spring Hold
