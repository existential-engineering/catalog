description: Playable delay plugin built with hardware controllers and analog
  vibe in mind. Features single or dual delay modes with ping pong options,
  quantizable note sync from 128th note to whole note, milliseconds mode from
  3ms to 8 seconds, controllable glide time, tape section with LOFI and wobble
  controls, filter and spring reverb sections, spatial panning, zero latency
  operation, and momentary macro controls (Kill All, Kill Feedback, Infinite
  Hold, Spring Hold).
details: |-
  A delay in motion — that's a beautiful thing. DC19 is a playable delay, an experimental plugin built with hardware controllers and analog vibe in mind. Where a standard delay gives you a button, DC19 gives you a slider.

  From springy surf echoes and tape'd out slapbacks to weirdo magnetic tape loops and sci-fi sound design, DC19 may have started out life as a weird little delay concept, but these days is a one-stop shop for everything worth repeating.

  DC19 has two main delay lines: A and B. You can use DC19 as a single delay (just A), a dual delay (A and B together), a ping pong delay (A only), or a dual ping pong delay (A + B both crossfeeding the feedback). It can get pretty deep. The Quantization controls for A/B give you complete control over how the delay lands in relation to the beat, making it easy to be 'in time' or very much not.

  'A' is the primary delay, and the 'A/B Time Sync' parameter controls the synchronization between A and B's delay times: moving B in the direction of A (great for getting B just out-of-sync enough with A). In the Advanced Pane, there are a bunch of controls for the routing, panning, and level of A/B, with some of the panning options borrowed from the Panpot plugin.

  The Glide controls change how the delay times move and glide around (you can also turn off gliding completely, but delay times will still change gracefully without clicks or pops). The macros KILL ALL, KILL FEEDBACK, INFINITE HOLD, and SPRING HOLD are great for playing the delay. These are momentary controls, so the amount of time you hold them matters.
specs: |-
  - Single (A) or Dual Delay (A+B) or anything in between (via the Sync/Free control)
  - Quantizable/selectable note sync
  - Tempo multiplier: slide from a 128th note to a whole note when synced to a BPM, and when unsynced
  - Milliseconds mode: slide all the way from 3 milliseconds to 8 seconds
  - Ping Pong Delay (A only) + Dual Ping Pong (A+B crossfeeding the feedback)
  - Controllable Glide time for all delays
  - Convenient macros for instant control of feedback and reverb
  - Tape section featuring unique LOFI + Wobble controls
  - LOFI moves through several different tape machines seamlessly
  - Wobble invites a little chaos into your life, either in mono or stereo
  - Filter section for shaping delay tone
  - Spring Reverb section that can be applied to just the delay or the dry signal + the delay
  - Sophisticated spatial panning section for precise control of where each delay line lands in space
  - Zero latency
  - HQ Mode
  - 1 page of advanced controls
  - 64-bit; requires a 64-bit DAW and macOS 10.13+ or Windows 10+
  - Localized in English, French, Italian, Spanish, Portuguese, Korean, Japanese, and Chinese (Simplified & Traditional)
