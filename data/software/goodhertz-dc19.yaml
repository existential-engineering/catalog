description: Playable delay plugin built with hardware controllers and analog vibe in mind. Features single or dual delay modes with ping pong options, quantizable note sync from 128th note to whole note, milliseconds mode from 3ms to 8 seconds, controllable glide time, tape section with LOFI and wobble controls, filter and spring reverb sections, spatial panning, zero latency operation, and momentary macro controls (Kill All, Kill Feedback, Infinite Hold, Spring Hold).
details: |-
  DC19 is described as 'a delay in motion' — a playable delay plugin designed with hardware controllers and analog vibe in mind. It supports Single (A) or Dual Delay (A+B) modes with Sync/Free control, Ping Pong Delay, and Dual Ping Pong configurations, with quantizable note sync and tempo multiplier support.

  Delay time ranges from 3ms to 8 seconds in milliseconds mode, with controllable glide time for smooth transitions between delay settings. The plugin includes a Tape section with LOFI and Wobble controls for analog character, a Filter section for tone shaping, a Spring Reverb section, and spatial panning controls.

  DC19 features playable macros including KILL ALL, KILL FEEDBACK, INFINITE HOLD, and SPRING HOLD — designed for live performance and expressive sound manipulation. All parameters, including on/off switches, can be automated freely and smoothly without clicks, pops, or zipper noises (except HQ Mode).

  The plugin operates at zero latency and supports mono-to-stereo and stereo-to-stereo channel configurations. It is available in nine languages: English, Spanish, Portuguese, French, Italian, Korean, Japanese, Simplified Chinese, and Traditional Chinese.
specs: |-
  - Single (A) or Dual Delay (A+B) modes
  - Ping Pong and Dual Ping Pong configurations
  - Sync/Free control with quantizable note sync and tempo multiplier
  - Delay time range: 3ms to 8 seconds (milliseconds mode)
  - Controllable glide time
  - Tape section: LOFI and Wobble controls
  - Filter section for tone shaping
  - Spring Reverb section
  - Spatial panning controls
  - Zero latency operation
