url: https://www.auditory-lab.com/
description: Banjo v2 is a five-string Banjo emulator plugin with down and
  up-picked samples to give your tracks an authentically resonant twang.
details: |-
  Banjo v2 provides high-quality samples that were recorded from a real banjo
  and it has three dynamic levels with two round robins giving it an incredibly
  realistic sound and it will bring your tracks to life with the quality of a
  real five-string banjo.

  This instrument is widely used for playing county, folk and bluegrass as well
  as blues, jazz and pop.

  Banjo v2 is pc & mac compatible and is available in 32-bit & 64-bit VST, mac
  VST and audio units formats.
specs: |-
  - Five-string Banjo emulator
  - Down and up-picked samples
  - Three dynamic levels
  - Two round robins
  - 32-bit VST
  - 64-bit VST
  - Mac VST
  - Audio Units
  - Pc compatible
  - Mac compatible
