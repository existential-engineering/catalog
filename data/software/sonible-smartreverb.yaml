description: smart:reverb is a source-adaptive reverb plug-in that learns from
  the incoming audio and builds a custom-tailored reverb around it, with a
  Reverb Matrix XY pad for browsing reverb styles. It has been replaced by
  smart:reverb 2.
details: |-
  smart:reverb adjusts its processing to the individual characteristics of the input material. After a profile is chosen and the learning process has analyzed the playing track, the plug-in sets its learned parameters, fits the Reverb Matrix to the signal and enables its detailed shaping controls. The Reverb Matrix is a parameter space covering different reverb styles, navigated as an XY pad guided by semantic descriptors.

  The Particle Display shows the reverb's anatomy and activity across frequency bands, and its Spectral Shaper Grid lets the decay rate be adjusted per band. The Temporal Shaper shows and edits how decay, spread and density evolve over time. Global Width, Color and Clarity controls fine-tune the result, with Clarity unmasking direct signal components to keep the reverb transparent.

  Reverb time, pre-delay and dry/wet sit beside Freeze, which captures the current tail as a layered sound, and Infinite, which holds the reverb indefinitely. A pre-filter EQ shapes the signal before it reaches the reverb. sonible released smart:reverb in August 2020 and replaced it with smart:reverb 2 in 2025.
specs: |-
  - Source-adaptive reverb with profile-based learning
  - Reverb Matrix XY pad across reverb styles
  - Particle Display with Spectral Shaper Grid for per-band decay
  - Temporal Shaper for decay, spread and density over time
  - Width, Color and Clarity controls
  - Reverb time, pre-delay and dry/wet
  - Freeze and Infinite modes
  - Pre-filter EQ
  - States for A/B comparison and presets
  - Plug-in formats: AU, VST, VST3, AAX
  - Authorization: machine-based or iLok
  - Windows 10 (64 bit) or macOS
  - Intel Core Duo or i5 CPU, 2 GB RAM
