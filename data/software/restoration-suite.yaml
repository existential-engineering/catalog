details: |-
  Restoration Suite 2 is a suite of four cutting edge plug-in for audio restoration and noise reduction: denoise 2, declick 2, dehum 2, and declip 2.

  Denoise 2 introduces the novel dynamic noise profiles that help reducing noise that varies randomly over time, such as wind noise or rustle from lavalier microphones. The noise suppression algorithm estimates the most suitable noise threshold curve for the noisy input signal using the measured statistics.

  Denoise 2, declick 2 and dehum 2 now support mid/side (m/s) processing, which can reduce unwanted fluctuations in the stereo image. The core algorithm in declick 2 received major improvements and now better preserves transients and can be pushed to higher click and crackle sensitivities without introducing artifacts.

  Dehum 2 has a new automatic fine-tune button that triggers automatic estimation of the hum noise frequency. Declip 2 was improved in terms of audio quality and now offers even more impressive reconstruction of clipped signal peaks.

  Acon digital restoration suite 2 is available as VST, vst3 or AAX for both windows and mac or as AU plug-ins for mac. All the plug-ins in the suite now support surround and immersive audio formats up to 7.1.6 channels.
