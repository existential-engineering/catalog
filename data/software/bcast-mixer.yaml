details: |-
  BCast Mixer is a dedicated standalone software mixer developed for events
  broadcasting, including conferences, meetings, speeches, podcasting or radio.
  It allows to manage any small or medium broadcasting event using only your
  computer, soundcard, optional MIDI controller and your favourites audio
  plug-ins, instead of a hardware audio mixer.

  Includes an auto-mic processing mode to avoid feedback and background noise
  coming from open microphones not in use. Audio input signals below the
  selected threshold will be deactivated until it reaches the minimum input gain
  selected, meaning that when nobody is talking to a specific microphone it will
  be automatically deactivated and muted.

  Each channel includes a 3-band parametric eq, hpf & lpf. Load up to 2 VST/AU
  plug-ins per channel. Up to 2 stereo sends (s1/s2). Gain control. Output
  metering. Includes 3 stereo sub-groups. Load up to 2 VST/AU plug-ins on each
  sub-group.

  Includes room eq (5-band parametric eq) & compressor. Room eq is designed to
  apply "room correction eq" after your measurements and eq corrections. You can
  also use a plug-in eq on channel 1 to make the right corrections to audio
  spectrum and just copy this parameters to the same plug-in eq loaded on stereo
  output.

  Set up your own configuration depending your soundcard and needs at any time.
  Control any fader or gain pot via your MIDI device. Create your own presets.
  Store & recall the whole session data.
specs: |-
  - 8 mono inputs / 6 mono + 1 stereo inputs

  - Optional -20db gain reduction to input signals

  - Input gain +/- 15db

  - Optional 80hz or 100hz hpf

  - 3-band parametric eq with hpf & lpf per channel

  - Load up to 2 VST/AU plug-ins per channel

  - Up to 2 stereo sends (s1/s2)

  - 3 stereo sub-groups

  - Load up to 2 VST/AU plug-ins on each sub-group

  - Auto-mic processing mode

  - 5-band parametric eq on master output

  - Compressor on master output

  - Pink noise generator

  - Individual l & r control on master output

  - Channels link available

  - 8/16/24/32-bits & wav/aiff files recording

  - MIDI control for faders and gain pots

  - Preset manager with session recall

  - VST/AU plugin host


  - Mac: intel machine running os x 10.6 or later (including 10.9), minimum ram
  1gb

  - Pc: windows xp, vista, or windows 7 with pentium 4 or celeron compatible
  processor or higher, minimum ram 1gb
