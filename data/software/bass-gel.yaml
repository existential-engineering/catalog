details: |-
  Bass Gel is the single bass unit taken from "kick n Bass Gel". 2 oscillators
  with dedicated lowpass and highpass filters that can work separate or be
  combined for a highly dynamic sound, these filters can be modulated by the
  included LFO, by velocity and by their individual graphical filter envelopes
  winch are very flexible.

  You also have a selection of 3 different types of distortion to beef up your
  bass, these are analogue distortion, parabolic saturation and overdrive.

  Instead of the typical equalizers, bass gel is equipped with harmonic
  attenuators that track the main bass harmonics saving you from having to find
  them and giving you the peace of mind of not having to automate your equaliser
  parameters to follow the bass note changes.

  There's also a multiband section were you can add analogue distortion to
  individual bands, control their different volumes and for the hi band you have
  a dedicated chorus unit to give a nice spread to the bass hi frequencies
  without affecting the low end.
specs: |-
  - 2 oscillators with 13 waveforms
  - Phase control
  - Fine tuning (modulatable by LFO)
  - LP/HP dual filters (modulatable by velocity, LFO and filter envelopes)
  - Dedicated multi stage envelopes for each oscillator filter
  - Analogue distortion
  - Parabolic saturation
  - Overdrive
  - LFO
  - Offset (+/- 50ms range)
  - 3 band multiband distortion
  - Chorus for hi band
  - Harmonic attenuators
  - HP/BP/LP filter
  - Compressor
  - Phase inverter
  - Right channel phase inverter
  - Mono switch
  - Windows
