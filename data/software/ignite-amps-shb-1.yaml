description: The SHB-1 is modeled after the Extreme Bass Head hardware unit built for Federico Fulceri, bassist for Italian thrash metal band Subhuman. It features 6 triode stages and a 1300W Class D power-amp, designed for bass amplification in live, jamming, tracking, or mixing contexts within compatible DAW hosts.
details: |-
  Dynamic 12AX7 / ECC83 coupled triode stages analog modeling
  Mono / Stereo processing support
  Selectable oversampling rate (up to 8x)
  Global input / output level controls
  Double precision (64-bit) floating point mathematical model
  Fully automatable controls
