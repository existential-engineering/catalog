details: |-
  Launched as the "fastest compressor in the world" with a 20-microsecond attack time, the classic hardware Softube modeled FET Compressor Mk II on is exceedingly popular and heard on countless hit recordings. With a FET gain reduction stage, Class A solid-state amplifiers, input and output transformers, beloved aggression, and tasty distortion, it's easy to see why.

  Softube's FET Compressor Mk II keeps that original sound and character while supporting a DAW-based workflow. There may be more than 1176 emulations of this compressor on the market, but only Softube's meticulously remodeled FET Compressor Mk II features Softube sound quality, extra features, and added control.

  Designed by Experts, Built on Legacy: Softube has been emulating professional audio gear for two decades. With partnerships with premium brands like Tube-Tech, Solid State Logic, Chandler Limited, and Marshall Amplification, it has a strong record of accurately recreating analog standards in software form. FET Compressor Mk II builds on this legacy, delivering nothing less than the same classic character as the original hardware, superior sound quality, and added modern features.

  The glow up: FET Compressor Mk II gives you the lightning-quick, in-your-face character of the hardware, plus more modern features for a DAW-based workflow. You can use the two different drives, FET and transformer, together or separately. Dry/Wet and a Sidechain section deliver more control and increased usability for mixing and mastering. With Stereo Link, you can toggle from Stereo Linked mode, with linked Left and Right gain reduction, to Unlinked Dual Mono for independent gain reduction for Left and Right channels. The High Frequency Make-up feature allows you to offset the minor loss of higher frequencies when compressing sound sources as varied as vocals, snares, kick drums, guitars, and more.

  This product supports Extended Features: VU meters, Bakelite knobs, and analog quirks are lovable, but modern precision and workflow still matter. The answer? Softube Extended Features. Easy-access panels with the innovations you need close at hand.
specs: |-
  - A complete and expertly executed remodel of one of the most popular analog compressors in the world
  - Perfect for vocals, drums, and other sources that require considerable compression
  - Added modern features, such as Drive, Stereo Link, a Sidechain section, a High Frequency Make-up feature, and Dry/Wet
  - Authentically modeled All-buttons-in mode, or British mode
  - Console 1-ready
  - Included in Icons: The Compressor Collection
  - Added features such as new ratios, two different drives, parallel compression, and detector filtering
  - Modeled on hardware with a 20-microsecond attack time
  - FET gain reduction stage, Class A solid-state amplifiers, input and output transformers
  - Requires a Softube account and an iLok account (no physical iLok required)
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Three activations, 20-day trial, 14-day returns
