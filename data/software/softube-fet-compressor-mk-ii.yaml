description: FET Compressor Mk II, Softube's totally remade compressor plugin,
  is modeled on hardware with a 20-microsecond attack time. Wildly popular and
  heard on countless recordings, it is beloved for its aggression and
  distortion. FET Compressor Mk II has the original sound and added modern
