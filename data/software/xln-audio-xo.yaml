description: >-
  Discover XO, the ultimate drum sampler plugin by XLN Audio. Explore AI-powered
  drum sampling, limitless creativity, and a vast library of high-quality
  sounds.
details: |-
  XO is not your ordinary beat machine. XO visually organizes your samples and its intuitive workflow focuses you on listening instead of folder-diving. Audition samples and rhythms to find what you like, then tweak to perfection.

  A revolutionary new way of exploring sounds and making beats. XO collects all your one-shot drum samples and sorts them by similarity in the XO Space. It uses machine learning to visually organize samples by sonic similarity, letting you discover sounds you never knew you had.

  XO includes 8,700+ one-shot samples and 240+ fully editable beat presets. Its powerful filtering and search capabilities let you quickly find the right sounds, while groove templates and the nudge patterns feature help you shape rhythms with precision.

  The Accentuator adds dynamics to your beats, and drag-and-drop export makes it easy to render audio or MIDI stems directly into your DAW. XO also supports 23 expansions for additional genre-specific content.
specs: |-
  - 8,700+ one-shot drum samples included
  - 240+ fully editable beat presets
  - Visual sample organization by sonic similarity (XO Space)
  - Powerful filtering and search
  - Groove templates
  - Nudge patterns functionality
  - Accentuator for dynamics
  - Drag-and-drop export (audio/MIDI stems)
  - 23 expansions available
  - macOS 10.13 or later (64-bit)
  - Windows 10, 11 (64-bit)
