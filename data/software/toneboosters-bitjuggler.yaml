description: The most complete tool to simulate vintage digital processing and recreate digital imperfections, from 1980s home-computer sound and vintage sampler character to 1990s lossy audio codecs. Combines bit crushing, resampling with precise aliasing control, codec simulation and a beat-synced LFO.
details: |-
  BitJuggler is the most complete tool to simulate vintage digital processing and recreate digital imperfections. Whether you would like to go down memory lane to create that 80s digital sound from the Commodore era or early personal computers, add vintage sampler character to your audio tracks, simulate lossy audio codecs from the 90s or shape your audio beyond analog simulation, BitJuggler delivers the digital imperfections with painstaking accuracy.

  Bit crushing with a wide range of algorithms. Resampling with precise aliasing control. Codec simulation covering speech and transform codecs. Beat-synced LFO for movement.

  Up to 16-channel spatial audio support, with unique visual feedback on what the processing is doing.

  Resizable user interface with dozens of color themes. Undo, redo and A/B switching. Preset management with import and export. Multiple simultaneous instances. License activation without a hardware dongle.
specs: |-
  Sample rates up to 384 kHz. Up to 16-channel spatial audio support. Personal, perpetual desktop license for Windows, macOS and Linux, for use on up to 4 computers. Desktop installer v2.1.8 (July 2026). Windows 10 or up with a 64-bit DAW supporting VST, VST3 or AAX, Intel or AMD SSE2 processor. macOS 10.13 or up with a 64-bit DAW supporting VST, VST3, AAX or AU, Intel or Apple Silicon. Linux plug-in archive requiring glibc 2.31 or up and a 64-bit DAW supporting VST or VST3.
