description: "A precise disk mastering simulator for professional lathe
  operators. Functions as a complete disk production laboratory featuring a
  fully parametric virtual disk cutting lathe with specialized preprocessors and
  analysis tools."
details: |-
  Version 1.1.1. Fully parametric virtual disk cutting lathe. Advanced audio processor section with highpass, lowpass, and elliptical filter options. Unique limiters operating on groove excursion, width, and velocity. Three physically modeled turntable pickups for monitoring and test cuts. Groove microscope for detailed inspection. Heatmap-based disk inspection for Excursion, Width, Velocity, and Land. Multi-side and multi-disk support. Imperial and metric unit support throughout UI.
specs: |-
  Windows 7 or above. Mac OS X 10.9 or above. VST2, VST3, Audio-Unit, or AAX compatible plugin host. OpenGL support required. 64-bit only.
