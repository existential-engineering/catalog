description: "Digital emulation of a famous US high-gain guitar amplifier.
  Includes pedal board, amp head with preamp and power amp, dual IR loader, and
  FX rack with tuner, delay, equalizer, and reverb."
details: |-
  Version 2.4.8. Includes pedal board (NoiseGate, TSE808, R47, Phaser, Pandora's Box, SDM-2), X50 v2.0 Pre+PA amp, X30 v2.0 preamp, rack (Tuner, Delay, Equalizer, Reverb), dual IR loader with analyzer, preset manager, 6L6GC/EL34 power tube switching, bias control, 2X-8X oversampling, input learn, movement control for poweramp-to-speaker emulation. Bundled IRs from Chop Tones, SinMix, 3 Sigma Audio, Rosen Digital, Fat Lazy Cabs, Kalthallen Cabs, Frozen Sun Audio, Trackmix Studio, GuitarHack, and Ryan Harvey Audio.
