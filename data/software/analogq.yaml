details: |-
  AnalogQ allows you to equalize your material the analog way. While most available equalizer plugins suffer from having problems near nyquist (half sample rate), such as distortion of the EQ shapes, AnalogQ is capable of generating an analog-like frequency response up to nyquist while even allowing EQ center frequencies up to 30khz, all without oversampling!

  The additional natural phase mode generates a near-perfect magnitude/phase response at the expense of very low (1ms) latency.

  Eq without conventional problems when approaching nyquist, realized without oversampling, offering a frequency response following the analog domain model very closely.

  Pultec-style boost/cut low shelf, based on simulation of pultec eqp-1a schematic. Eq frequencies can be adjusted up to 30khz (except for pultec-style low shelf).

  Integrated highly reactive, customizable spectrum analyzer with dual spectrum display for input & output. Seamlessly resizeable interface. Low cpu usage (typically less than 1% on half-decent systems). High quality 64-bit floating point numbers processing.
specs: |-
  - Analog-like frequency response up to nyquist
  - EQ center frequencies up to 30khz
  - No oversampling
  - Natural phase mode
  - 1ms latency
  - Pultec-style boost/cut low shelf
  - Pultec eqp-1a schematic simulation
  - Per-band stereo/mid/side/left/right processing
  - Spectrum analyzer with dual spectrum display
  - Seamlessly resizeable interface
  - 64-bit floating point processing
  - Low CPU usage
  - Universal 2 binary
