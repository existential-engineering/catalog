details: |-
  BPB Dirty LA is a freeware compressor plugin inspired by vintage limiting
  amplifiers. It delivers musical-sounding compression while relying on a
  streamlined workflow and a simple user interface.

  The plugin also implements a dirt algorithm that enables saturation with
  gentle transient reduction. The default compression mode sports a relatively
  fast attack time and moderate compression ratio.

  The algorithm is fine-tuned to deliver musical-sounding compression on most
  audio signals. The limiting mode provides faster attack times and a higher
  compression ratio. It is suitable for use as "mix glue" on the master bus.

  The mix knob enables easy parallel compression. Bpb dirty la uses 4x internal
  oversampling when the dirt mode is enabled. The oversampling is bypassed when
  dirt is switched off to reduce cpu usage.

  Available for windows & macos in vst3/AU plugin formats.
specs: |-
  - Compression algorithm inspired by vintage limiting amplifiers
  - Limiting mode
  - Optional analog-style saturation
  - Internal oversampling
  - Vu metering
  - Mix (0-100%)
  - Output volume (12 dB)
  - 64-bit compatible
  - VST3/AU plugin formats
  - 4x internal oversampling when dirt mode enabled
  - Dirt algorithm with gentle transient reduction
