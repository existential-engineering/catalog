description: Make pop music that goes straight to the pleasure centers with Usynth GLAM. Think of GLAM like the sibling of 2080 and CORE that lives in Beverly Hills.
details: |-
  Make pop music that goes straight to the pleasure centers with Usynth GLAM. It has got the basses, pads, polys and leads and all the hooks you will ever need. Think of GLAM like the sibling of 2080 and CORE that lives in Beverly Hills.

  GLAM gives you the pristine sheen that only money can buy, from home. Sound bigger than you ever thought you could with its built-in multi-effect Finisher.

  Usynth features a built-in Delay unit that is simple to set up, yet super-flexible. Instead of a dozen parameters you have to set, simple and complex Delay configurations are already prepared, so all you have to do is select a Delay preset and adjust Mix and Feedback.

  Roll the dice and Usynth will change any setting to a new random value, setting by setting or all at once, with the amount of randomness dialled in. The bright-to-dark control takes command of timbral evolutions with one knob, engaging new oscillators and changing multiple filter settings as you move the dial.
specs: |-
  - 100 Synth Modes, 34 Sequences
  - 2 individual layers per note
  - Custom Finisher featuring 88 Modes
  - 100 Global Presets
  - Built-in Delay unit with prepared Delay presets, Mix and Feedback controls
  - Surprise randomisation with adjustable depth
  - Operating systems: Windows 10 to Windows 11, macOS Catalina (10.15) to macOS Sonoma (14)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 0.34 GB of free disk space
  - 1280x768px display, internet connection
  - Moving the .blob sample content file to an external drive is not supported
  - Plug-in formats: AAX, AU 2, VST 2 and VST 3, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Installed through the UJAM App, which installs the Usynth plug-in that hosts all titles
  - On macOS Catalina, UJAM App 1.1.1 is the final version that runs and still installs GLAM (only Usynth 1.4.1 titles DUST, VORTEX and WEBCORE need a newer app)
