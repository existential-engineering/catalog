details: |-
  Most analog tape plug-ins do almost nothing just simple classic saturation,
  but real reel-to-reel hardware recorders affect sound in many non-linear ways:
  producing not just basic saturation but also natural non-linear compression,
  wow and flutter effect, variable noises and hiss, hysteresis, rounding and
  softening sharp transients and trebles.

  Analog tape asx-72 was designed to offer various types of tape sound for
  various styles of use and high level of sound creativity: from very gentle
  invisible modern tape sound to add just little bit of warmth to very fat,
  grungy vintage sound, emulating various types of analog tapes and their
  electronics (recording electromagnets, pre-amps) from various ages 1960 to
  warm 1980 and clean 90s.

  You can use asx-72 during mixing modern tracks with subtle settings, to add
  massive amount of dirt to rock / indie music, to add real analog sound to
  techno or dnb tracks, to add noisy wavy sound to synthwave tracks, psychedelic
  atmosphere of twisted old tapes to psytrance / dub or psychill tracks or just
  to make your digital beats / synths more realistic and natural.

  Analog tape asx-72 is lot of fun and sound creativity, it is not just another
  mix plug-in with almost inaudible effect designed only for few audiophile mix
  engineers, with asx-72 you can totally change character of your drums, synths,
  guitars, vocals, strings and other instruments while you can still use it as
  very gentle mix processor with low settings.
specs: |-
  - Drive / warmth control
  - Fatness knob
  - Flutter knob
  - Wow knob
  - Bias control
  - Feedback control
  - Drive switch
  - Emphasis
  - Type of tape selector (tape a421 or c24)
  - Device clip
  - Device limiting
  - Hiss control
  - Tape speed selector (30ips / 15ips)
  - Output volume knob
  - Power (bypass) switch
  - X32-bit / x64-bit native VST effect plug-in
  - Natural non-linear compression
  - Hysteresis
  - Rounding and softening sharp transients
