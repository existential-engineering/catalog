details: |-
  The TDR Feedback Compressor II is a major design update of its critically acclaimed predecessor. The compressor is dedicated to compressing the highest fidelity stereo program (2-buss), but equally shines in classic mixing tasks.

  Most modern compressors analyze the input signal to control gain reduction, using a “feed-forward” topology. TDR Feedback Compressor II, however, analyzes the output. This approach delivers an unobtrusive and highly musical compression characteristic. The plug-in takes this traditional compression topology to new heights with a highly flexible, yet intuitive control scheme, carefully tuned for intuitive and musical operation for almost every situation.

  The processor neither tries to emulate any previously available device, nor does it follow popular trends like “virtual analogue” or “circuit modeling”. This is a proud digital processor.

  The product is discontinued. Tokyo Dawn Labs directs users to TDR Kotelnikov for new projects, and offers the download for historical reasons only, with no active support and no guarantee of compatibility with modern systems.
