description: 3-band diode bridge compressor plugin replicating the distinct
  behavior and rich sonic character of a legendary vintage hardware unit.
  Features multi-band and single-band modes, ideal for drums, electric guitars,
  and rock vocals.
details: |-
  The lindell 354E is a multiband model of the most famous vintage diode bridge
  compressor, the neve 2254e, precisely replicating its distinctive behavior and
  rich sonic character in each of its three bands. But in practical use, the
  354E really is two compressors in one: turn on its nuke mode to radically
  shape individual tracks, and turn it off for lighter, more nuanced compression
  when mastering or for surgical mixing.

  Unlike its single-banded cousin, the 254e, three independent compression bands
  (low, mid and high), powerful nuke mode, and niveau and highpass sidechain
  filters let you dramatically reshape tracks for maximum size, punch and
  bottom-end weight. And with an adjustable attack time as fast as 2 sec (two
  millionths of a second), the 354e is one of the fastest compressors available,
  capable of shaping sounds in extreme ways most other compressors can only
  dream of.

  The 354e's nuke mode is the poster child for rock 'n' roll excess. Use nuke
  mode to explode the room ambience and make the drums pump like a jackhammer.
  Use the built-in filters to shield bass frequencies from compression,
  inflating the kick drum in the room mics to monster size. Then adjust the
  three bands' ratio and gain controls to balance the level of hi hat and
  cymbals with that of the trap drums for the perfect blend.

  When you turn off nuke mode, the 354e takes on the highly nuanced behavior
  needed for master-bus compression and mastering. Use the 354e's mild 1.5:1
  ratio to add solidifying glue to mixes. Kick in the niveau filter to add
  punch, fullness and weight to the bottom end of thin mixes. Use the 354e's m/s
  (mid-side) mode to compress hard-panned guitars without affecting the kick
  drum, bass and lead vocals.

  Calibrate the 354e's internal operating levels to adapt to any mastering
  situation and handle the hottest or weakest mix with equal ease and grace. A
  and b workspaces let you compare alternate control setups for perfect, nuanced
  results. Whether using it to pump up individual tracks to ginormous size, add
  density to full mixes, or apply subtle surgical compression to correct
  imbalanced masters, the versatile lindell 354e is your paint brush for
  colorful vintage sound.
specs: |-
  - Multiband compression (low, mid, high bands)
  - Adjustable crossover frequencies
  - Ratio range 1.5:1 to 6:1
  - Nuke mode
  - Mid/side (m/s) mode
  - Highpass sidechain filter
  - Niveau filter
  - Attack time as fast as 2 microseconds
  - Auto release
  - Mix control (parallel processing)
  - Band linking and soloing
  - Optional auto-makeup gain
  - Three-way meter (I/O and gain-reduction)
  - Internal operating level calibration (nine 1db steps)
  - Resizable user interface
  - Up to 16x oversampling
  - VST plugin format
  - Audio Units (AU) plugin format
  - Windows 7 through 10 compatible
  - Pro Tools 10.3.10 or higher
  - Intel-compatible CPU with SSE2 instruction set
  - Minimum 2 GHz CPU recommended
  - 2 GB RAM minimum
  - Display resolution 1440x900px or 1280x960px or higher
  - Mac OS X 10.8 through 10.12 compatible
  - Mac intel CPU only
  - 14-day fully functional demo available
