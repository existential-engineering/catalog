description: >-
  A unique plugin that allows users to sculpt custom LFO curves and shapes,
  process incoming audio, and generate MIDI CC messages for controlling other
  instruments.
details: |-
  LFO Tool is a powerful LFO shaping plugin from Xfer Records. It features a customizable point and tension-curve editor with 12 graphs in a preset, switchable via MIDI notes or automation. Up to 4 graphs can run simultaneously for controlling Cutoff, Resonance, and Pan parameters.

  The plugin processes incoming audio and can also generate a MIDI message stream for controlling other softsynths, effects, or external hardware that responds to MIDI CC messages. Graph preset shapes are available from a drop-down menu, and users can save their own custom shapes.

  LFO Tool offers BPM-synced rate control with optional swing, as well as Hz-based LFO rate control with sample-accurate sync. Dozens of presets are included to help achieve desired results quickly.

  Consistent with other Xfer Records products, LFO Tool is coded entirely in C++ to minimize CPU load during operation. Both macOS and Windows versions are included with purchase.
specs: |-
  - LFO with customizable point+tension-curve editor
  - 12 graphs in a preset, switchable via MIDI notes or automation
  - Up to 4 graphs simultaneously (Cutoff/Reso/Pan)
  - Graph preset shapes from drop-down menu with save functionality
  - MIDI CC output for controlling other softsynths, effects, or external hardware
  - BPM (with optional swing) or Hz LFO rate control
  - Sample-accurate sync
  - Coded in C++ for minimal CPU load
  - 32-bit and 64-bit support
