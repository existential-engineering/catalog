description: "A filter designed to control ultrasonic content accumulation in
  oversampled recording, processing, or playback chains. Prevents ultrasonics
  from interfering with nonlinear systems like limiters, distortion devices, and
  compressors."
details: |-
  Version 1.0.4. Linear phase, continuously variable slope filtering. Ultrasonic gate with dynamic control. Support for sample rates up to 20MHz. Precise ultrasonic frequency analyzer. Bypass All function for A/B testing. Freely resizable hardware-accelerated UI with full-screen capability.
specs: |-
