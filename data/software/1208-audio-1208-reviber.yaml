details: |-
  1208 Reviber is a sonic exciter enhancer with only two knobs: "shine" and "thick". The developers are quick to point out that the real magic happens behind the scenes.

  "shine" adds a bit of glitter and sparkle to your sound, while "thick" is capable of some serious fattening. Reviber looks like a quick and easy way to polish individual sounds and tracks, or even entire mixes.

  It's a windows-only plug-in, available in 64-bit vst2 and vst3 versions.

  The plugin uses 0% resources with 0 ms latency, which means you can put this plugin on multiple tracks and buses to add enhancement where needed.

  Reviber has been replaced with an upgraded version that has all of the same goodness + new features available as reviber 2, but the original is still available for download.
