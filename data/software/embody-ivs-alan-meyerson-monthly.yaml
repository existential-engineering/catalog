description: A spatial audio plugin and standalone application that lets users
  mix surround sound and Atmos content on headphones inside a virtualized
  version of Alan Meyerson's Studio M. It creates a personalized HRTF profile
  and includes a virtual audio routing bridge.
specs: |-
  - Monthly Subscription: Auto-renewal with option to pause at any time; own after 12 payments
  - Mix Surround Sound and Atmos content on headphones from inside Alan Meyerson's Studio M
  - Immerse Engine: Create your completely unique HRTF profile in seconds
  - Room virtualization tested and certified by Alan Meyerson himself
  - Standalone Software: Monitor your Dolby Atmos Renderer output in Alan Meyerson Studio M
  - Also available as VST3, AU, and AAX plugins
  - Immerse Audio Bridge: Virtual cable which can route up to 16-channel audio between applications
  - Compatible with all headphones
