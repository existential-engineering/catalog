description: >
  Bus TRANSIENT is a professional transient shaper designed to give you instant control over the attack and sustain of your sound. From tighter drums to punchier mixes, it delivers fast, musical results with an intuitive interface and clear visual feedback.
details: |-
  Bus transient is a professional transient shaper designed to provide instant control over the attack and sustain of audio signals. It delivers fast, musical results with an intuitive interface and real-time visual feedback, making it suitable for tightening drums, creating punchier mixes, and refining dynamics across any audio source. Whether adding presence, taming unwanted reflections, or accentuating an entire bus, it brings punch, clarity, and definition without complexity.

  The plugin features dual-stage shaping with independent transient and body modules that work in tandem for complete dynamic control. The transient stage shapes the initial impact with adjustable slope angle and attack length, while the body stage controls sustain and resonance with gain and timing controls. A built-in soft/hard clipper manages peaks and adds character, introducing warmth and saturation when driven, while tone controls allow brightening, darkening, or thickening of both transients and body.

  The interface provides six main control sections: input with sensitivity adjustment for fine-tuning transient detection, a real-time visualizer showing shaping applied to the waveform, independent transient and body controls for gain and timing, dedicated tone controls for frequency shaping, bands section offering full-band or three-band multiband control for frequency-specific dynamics, and output section for mix blending and peak management. Every parameter can be mapped to MIDI controllers for hands-on mixing control.

  Bus transient includes a comprehensive preset library with expertly-designed templates covering various mixing scenarios: dark drum room for moody, atmospheric grooves; groove tightening for locked, punchy rhythms; guitar softer folk pick for gentle, natural guitar tones; master precision and density for detailed, translatable masters; snare stamps for crisp, cutting snare presence; and transient grit for punchy, saturated definition. The streamlined preset browser allows filtering by instrument type, genre, and production technique for quick recall.

  The plugin is fully compatible with all major daws on both windows and macos, managed through arturia software center for easy installation, organization, and license management across multiple devices. Built-in tutorials guide users through crucial parameters and mixing techniques, while the resizable gui accommodates different workflow preferences. Delta mode enables isolation of only the affected signal portion for precise monitoring and adjustment.
specs: |-
  - Transient stage with slope angle and time control
  - Body stage with gain and time control
  - Multi-band control with three frequency bands
  - Full-band mode for broad adjustments
  - Soft/hard clipper for peak management
  - Tone control for transients and body
  - Real-time visualizer
  - Sensitivity adjustment for transient detection
  - Delta mode for isolated signal monitoring
  - MIDI controller mapping support
  - Resizable gui
  - VST, AAX, audio unit, nks plugin formats
  - Windows 10+ (64-bit), 4gb ram, 4 cores cpu 3.4 ghz, 1gb free disk space, opengl 2.0 gpu
  - Mac os 10.13+, 4gb ram, 4 cores cpu 3.4 ghz or m1 cpu, 1gb free disk space, opengl 2.0 gpu
  - Parallel processing with dry signal blending
  - Preset browser with filtering and organization
