details: |-
  Adelay is a granular synthesis based audio effect processing tool. The app
  takes live sound input through the internal microphone (or via audiobus), the
  built in audio player or both simultaneously.

  By using the simple and clean interface, audio is processed using the sliders
  controls. Each slider parameters automation can be stored in one of four
  different pattern banks for playback.

  Stored pattern banks can also be saved in the form of projects.

  Share recorded tracks with audioshare, audiocopy2, email, and soundcloud.
  Import with audioshare and audiocopy2.

  Purchase sample packs with a wide variety of quality produced sounds to remix.
specs: |-
  - Extreme pitch shifting
  - Window adjustment
  - Modulated feedback delay
  - Filter and bitcrush effects
  - Slider automation
  - 4 pattern banks per slider for storing automation data
  - Project save and recall
  - Audio export
  - Audiobus support (in/out/filter)
  - Audioshare support
  - Audiocopy2 support
  - Itunes import and export
  - Soundcloud sharing
  - Email sharing
  - Granular synthesis based audio effect processing
