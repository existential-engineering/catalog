description: Augmented STRINGS combines rich sampled strings with state-of-the-art
  synthesis in an approachable, inspiring software instrument, giving modern
  producers immediate access to a comprehensive range of authentic, abstract,
  and evocative string sounds.
details: |-
  Augmented strings' hybrid palette unlocks the truly exciting and unique power
  that strings can bring to your projects. This isn't just a selection of string
  samples; these are traditional instruments transformed into sounds unlike
  anything you've ever heard.

  Build your own ensemble with augmented strings' multi-engine flexibility.
  Experiment with 2 layers, each containing 2 sound sources, and weave your own
  custom combination of sampling and synthesis for a string sound that
  transcends the real thing.

  With over 60 articulations, multiple mic setups, solo & ensemble performances,
  4 types of synthesis, and built-in fx, explore a near-limitless spectrum of
  modern string textures and timbres for any style.

  Augmented strings' morph control gives you truly unique & ever-evolving sound
  with one click. Unlock huge sonic territory within a single sound, move and
  transform between layers a and b, and adjust up to 8 custom destinations - all
  with one control.
specs: |-
  - 2 layers with 2 customizable sound sources per layer
  - Over 60 articulations
  - Multiple mic setups
  - Solo and ensemble performances
  - 4 types of synthesis
  - Virtual analog with TAE technology
  - Granular engine
  - Harmonic engine with additive synthesis
  - Wavetable engine
  - Morph control
  - 7 additional macros
  - 2 LFOs
  - 2 function generators
  - 2 random generators
  - 4 keyboard modulation sources
  - Vibrato and tremolo
  - 2 FX slots per layer with 14 FX
  - Dedicated delay and reverb sends
  - 5 spatial/time-based algorithms
  - Built-in 16-step arpeggiator
  - Over 250 factory presets
  - MPE compatibility
  - Mts-esp oddsound microtuning compatibility
