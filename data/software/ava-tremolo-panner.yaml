details: |-
  The Harrison AVA Tremolo Panner is a highly customizable tremolo panner
  plugin, ideal for introducing stereo width and dynamic movement to your
  sounds. Tremolo panner can generate a wide-range of tremolo panning effects,
  from subtle tremors to extreme room-spinning tremolos.

  Optimized for the task of mixing, tremolo panner can synchronize with your
  song's position and tempo, allowing you to set the perfect speed and lfo
  offset for your song. You can smoothly automate your settings, so each part of
  your song gets the desired effect and treatment it deserves.

  Featuring a comprehensive set of controls, tremolo panner includes
  customisable waveform selection, syncopated lfo, speed controls, phase shift,
  switchable filters, selectable ramp modes, and adjustable stereo width.

  Lfo display synchronizes with your DAW playhead position, so you can see (and
  modify) the phase of the lfo for each part of your song.

  Tremolo panner performs exceptionally well with guitars, synthesizers, string
  pads or even vocals (for those who dare to experiment), harrison's tremolo
  panner is an essential addition to your creative toolkit.
specs: |-
  - Customizable waveform selection
  - Syncopated LFO
  - Speed controls
  - Phase shift
  - Switchable filters
  - Selectable ramp modes
  - Adjustable stereo width
  - LFO display with DAW playhead synchronization
  - Switchable ramp modes: swells, linear, gated with step selection
  - Tempo synchronization
  - Automation support
