description: Circuit-modeled emulations of three Pultec passive tube equalizers,
  the EQP-1A Program EQ, MEQ-5 Mid-Range EQ and HLF-3C filter set, modeling
  their tube amplifiers and transformers.
details: |-
  Get the "must-have" tube EQs that have shaped over 70 years of popular music.
  The collection models the entire electronic path of three Pultec equalizers,
  including their tube amplifiers and transformers.

  Sculpt fat and punchy bass, synths, and drums with the EQP-1A. Experience rich
  midrange textures on guitars, vocals, and keys with the MEQ-5. Create retro
  filter effects or reduce unwanted frequencies with surgical precision using
  the HLF-3C.

  First released for UAD-2 and Apollo in 2013, succeeding UA's legacy Pultec
  and Pultec Pro plugins, and available natively (UADx) since 2022 with no UA hardware
  required. A purchase includes both the native and the UAD-2/Apollo versions.
specs: |-
  - EQP-1A Program EQ
  - MEQ-5 Mid-Range EQ
  - HLF-3C filter set
  - Tube amplifier and transformer modeling
  - Native UADx and UAD-2/Apollo versions
