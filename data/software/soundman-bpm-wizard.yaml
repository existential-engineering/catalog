details: |-
  With BPM Wizard from soundmanufacture you can set a reference tempo and up to
  four subdivisions of the reference to automate Ableton lives tempo. There's
  also an LFO driven envelope where you're able to modulate lives tempo.

  Beside this, you can enable ableton link inside bpm wizard and can set the
  devices in your network to another tempo.

  All tempo divisions are depending on the reference tempo you set in the
  device. If you change the reference tempo all subdivisions of that tempo will
  follow.

  You're able to connect the device to the link network, which enables you to
  make polyrhythm patterns in combination with a link device.

  Both tempi, the host & link tempo can be controlled independently from each
  other.
specs: |-
  - Reference tempo setting
  - Four tempo subdivisions
  - LFO driven envelope
  - Ableton link support
  - Tempo modulation
  - Tempo offset control
  - Link network connectivity
  - Polyrhythm pattern creation
  - Independent host and link tempo control
  - Universal 2 binary
platforms:
  - mac
  - windows
