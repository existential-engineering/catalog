description: Seize control over your stereo imaging with this one-stop stereo plug-in. Keep your sounds three-dimensional and dynamic by using Stereolab to morph your mono signal into a full-range stereo sound, or shrink your wide field into a coherent, single mono mix.
specs: |-
  - Formats: VST3, AU, AAX (64-bit only)
  - Windows: Windows 8 (64-bit) or later, Intel Core i5 or equivalent, 8 GB RAM
  - macOS: macOS 10.13 (64-bit) or later, Apple Silicon or Intel Core i5, 8 GB RAM
  - Disk space: 96 MB
  - Licensing: iLok (machine license or USB dongle); free iLok account required
  - Not standalone — requires a host DAW
  - Supported DAWs: Logic Pro, Pro Tools 11+, Cubase, Nuendo, Ableton Live, Reaper
  - 14-day free trial available
  - Modules: WIDEN, M/S, STEREO, WIDTH
  - Features: L/R independent panning, M/S gain adjustment, interaural time delay (ITD), width control, bass frequency splitting, vectorscope display
