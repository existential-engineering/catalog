description: Seize control over your stereo imaging with this one-stop stereo plug-in. Keep your sounds three-dimensional and dynamic by using Stereolab to morph your mono signal into a full-range stereo sound, or shrink your wide field into a coherent, single mono mix.
details: |-
  STEREOLAB is an all-in-one stereo and mono plug-in that brings the common stereophonic effects together in one place. It can morph a mono signal into a full-range stereo sound or shrink a wide field back into a coherent single mono mix, with left/right independent panning, mid-side gain and left and right delays used to create interaural time differences. The stated aim is surgical control over audio position with very simple controls, on any FX chain.

  The plug-in is built from four main stereophonic modules whose order is completely customizable. WIDEN creates a side signal from any source algorithmically while leaving the mid signal unaltered. M/S gives separate control over the mid or side elements of the stereo field, useful for adding a sense of movement. STEREO covers panning and balance along with IDT (interaural time delay) options. WIDTH tames the width in a signal and includes an optional band splitter so low frequency width can be controlled selectively.

  At the end of the effects chain a vectorscope gives visual feedback on what is happening to the sound. Key features include left/right independent panning, M/S adjustment and rotation, precision delays for interaural time differences, width increases to extreme proportions, independent control of lower frequency width, and tools for ensuring full mono compatibility, including bass bypassing, which the product page notes is often left out of other stereo plug-ins.

  The listed use cases run from wider, more spacious drums and huge wide-sounding synths through precise placement of sound effects, vocal effects such as flanging and phasing, and manipulating the stereo image of ambient recordings to give a sense of depth. The plug-in requires an audio host and does not work as a standalone application.
specs: |-
  - Four stereophonic modules with completely customizable order: WIDEN, M/S, STEREO and WIDTH
  - WIDEN creates a side signal from any source while leaving the mid signal unaltered
  - M/S adjustment and rotation for separate control of mid and side elements
  - STEREO module with panning, balance and IDT (interaural time delay) options
  - WIDTH module with optional band splitter for selective low frequency width control
  - Output vectorscope for visual feedback on the stereo image
  - Left/right independent panning and precision delays for interaural time differences
  - Mono compatibility tools including bass bypassing
  - Format: Software Plugin (VST 3, AU, AAX) for Windows and Mac
  - Requires an audio host; does not work as a standalone application
  - Officially works with Logic Pro, Pro Tools (11+), Cubase, Nuendo, Ableton Live and Reaper
  - Required hard disk space: 96 MB
  - Available as: Download
  - Windows 8 (64-bit), 8 GB RAM, Intel Core i5 or similar
  - macOS 10.13 (64-bit), 8 GB RAM, Apple Silicon or Intel Core i5
  - Requires a free iLok account; machine license activation and USB dongle licensing available
  - A 14-day free trial version is offered alongside the full version
