description: "Advanced equalizer with 658 filter types and shapes with steepness
  between 6-96 dB/Oct. Features dynamic equalization, adaptive filters, EQ learn
  and match, loudness matching compliant with EBU R128 and ITU bs.1770, and
  linear phase filter options."
details: |-
  658 filter types and shapes. Steepness between 6-96 dB/Oct. Dynamic equalization with compression and expansion. Adaptive filters for transients, ambiance, sibilance, and background elements. Spectrum analyzers with configurable resolution and peak hold. EQ learn and match with spectral analysis. Zero-latency processing with latency-free lookahead. Linear phase filter options. EUCON control surface integration. Up to 128-channel audio (OBAM format).
specs: |-
  Sample rates up to 384kHz. Up to 64 channels (VST/VST3/AAX/AU), 128 channels (OBAM). Frequency range 5 Hz - 22 kHz. Q range 0.02 - 50. Max 24 filter sections. Gain resolution 0.01 dB. Zero latency for all filter types except linear phase variants. Personal perpetual license for up to 4 computers.
