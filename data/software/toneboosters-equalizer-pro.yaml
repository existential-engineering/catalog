description: Flagship equalizer with 658 static, dynamic and adaptive filter shapes at steepnesses from 6 to 96 dB/Oct, including adaptive filters for transients, ambiance, sibilance and background elements. Adds EQ learn and match, EBU R128 and ITU bs.1770 compliant loudness matching, latency-free lookahead and support for up to 128 audio channels.
details: |-
  658 low-noise, zero-latency static, dynamic and adaptive filter shapes, with steepness between 6 and 96 dB/Oct. Shelving and peaking filters can be static or dynamic, linear phase and zero-latency filter types can be mixed in one instance, and dynamic filters can compress and expand. Adaptive filter types EQ specific content elements such as transients or ambiance, and an audition mode isolates the affected frequency range.

  Configurable analyzers support the workflow: pre and post EQ spectrum analyzer with external side-chain support, configurable frequency resolution, spectral tilt, speed and dynamic range, peak hold, a vertical spectrogram mode, and an interactive piano keyboard for frequency adjustment.

  Learn average spectra and create match-EQ settings interactively, pre EQ, post EQ or from an external side-chain input, with import and export of learned spectra. Loudness matching is fully compliant with EBU R128 and ITU bs.1770, measuring pre and post EQ loudness simultaneously and converting to output gain automatically.

  All EQ sections can run on any number of channels, with mid/side support and channel activity indicators, covering surround, higher-order ambisonics and Dolby Atmos. Host integration shows EQ curves in the host's mixer or track panel and supports EUCON control surfaces. Predictive and adaptive analysis gives the benefit of lookahead without the latency.

  Resizable user interface with dozens of color themes. Undo, redo and A/B/C/D switching. Cross-platform preset manager. MIDI learn. License activation without a hardware dongle.
specs: |-
  658 filter shapes. Maximum filter steepness 96 dB/Oct. Max 24 filter sections. Center frequency range 5 Hz to 22 kHz. Q range 0.02 to 50. Gain resolution 0.01 dB. Main input bus up to 64 channels on VST, VST3, AU and AAX, and up to 128 channels through the OBAM module. Sample rates up to 384 kHz on desktop and 96 kHz on iOS and iPadOS, where channel support is currently limited to two-channel audio. Zero latency for all filter types except linear phase variants. Personal, perpetual license for use on up to 4 computers. Desktop installer v2.1.8 (July 2026). Windows 10 or up with a 64-bit DAW supporting VST, VST3 or AAX, Intel or AMD SSE2 processor. macOS 10.13 or up with a 64-bit DAW supporting VST, VST3, AAX or AU, Intel or Apple Silicon. Linux plug-in archive requiring glibc 2.31 or up and a 64-bit DAW supporting VST or VST3.
