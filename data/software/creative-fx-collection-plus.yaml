details: >-
  Air creative fx plus is no longer in development, it is available in its
  current form by popular request as it is much loved by producers worldwide. It
  fully supports apple silicon and VST 3 but will not be getting any further
  updates.


  This collection includes our twenty classic air fx plugins for the first time
  in AU/VST formats plus eight all-new fx (AU/VST/AAX), expertly created by our
  team based on extensive feedback and requests from customers.


  The original air creative fx collection has been included as part of pro tools
  since version 8 and is considered the reference fx suite by some of the
  world's most respected audio professionals.


  This exclusive and diverse collection provides all you need for creative
  production, mixing and mastering, including reverbs, compressors, equalizers,
  delays, filters and so much more.


  Each plugin has been expertly designed with ease of use in mind and will
  ensure professional results each time.
