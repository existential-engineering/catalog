description: The NA 501 Chorus Echo is a meticulous digital model of the Roland RE-501 Chorus Echo, delivering authentic spring reverb, classic tape delay, and lush BBD chorus in a cutting-edge plugin. Developed by Nembrini Audio, it combines vintage analog character with modern production features like DAW tempo sync, expanded parameter ranges, and independent SOS timings.
details: |-
  The NA 501 Chorus Echo is a plugin recreation of the iconic Roland RE-501 Chorus Echo, reborn with modern digital functionality for today's music producers. This meticulously modeled plugin captures the essence of the legendary tape echo, BBD chorus, and spring reverb that defined the sound of countless recordings.

  Equipped with features tailored for modern production, the NA 501 includes DAW tempo synchronization, a wide parameter range for the BBD chorus and analog tape delay, separate left and right SOS (Sound-on-Sound) timings, and a linear preamp option. The plugin is ideal for adding rich, analog textures to any genre — from rock and electronic to ambient music.

  The NA 501 is available as a desktop plugin supporting VST2, VST3, AAX, and Audio Units formats, as well as a mobile app for iPhone and iPad via the Apple App Store. The plugin requires a 64-bit DAW host and supports both Intel and Apple Silicon Macs running macOS 10.13 or newer, and Windows 7 or newer.

  Nembrini Audio developed the NA 501 Chorus Echo based on its own modeling techniques. Roland RE-501 Chorus Echo is a registered trademark of Roland Inc. Roland has not endorsed nor sponsored the NA 501 Chorus Echo in any manner, nor licensed any intellectual property for use in this product.
specs: |-
