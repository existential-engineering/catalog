details: |-
  Rediscover the iconic sound of the Roland RE-501 Chorus Echo, now reborn as the NA 501 Chorus Echo plugin by Nembrini Audio.

  This meticulously modeled plugin captures the essence of the legendary tape echo, BBD chorus, and spring reverb, enhanced with modern digital functionality for today's music producers.

  Ideal for adding rich, analog textures to any genre, the NA 501 is a versatile tool for musicians and producers seeking that classic sound with contemporary flexibility.

  Equipped with features tailored for modern production, the NA 501 includes DAW tempo synchronization, a wide parameter range for the BBD chorus and analog tape delay, separate left and right SOS timings, and a linear preamp option.
specs: |-
  - Authentic Sound Reproduction: Delivers the classic warmth and character of the Roland RE-501 through precise digital modeling.
  - Extended Creative Control: Offers advanced features like DAW tempo sync, expanded chorus and delay parameters, and independent SOS timings.
  - Intuitive User Interface: Designed for ease of use, blending vintage aesthetics with modern digital efficiency.
  - Versatility for Any Genre: Whether you're producing rock, electronic, ambient, or beyond, the NA 501 fits seamlessly into any musical project.
  - Plugin Formats: a VST2, VST3, AAX or AudioUnits compatible host
  - System: an Intel compatible or Apple Silicon CPU, 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
