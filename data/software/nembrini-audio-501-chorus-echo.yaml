details: |-
  Rediscover the iconic sound of the Roland RE-501 Chorus Echo* , now reborn as the NA 501 Chorus Echo plugin by Nembrini Audio. This meticulously modeled plugin captures the essence of the legendary tape echo, BBD chorus, and spring reverb, enhanced with modern digital functionality for today's music producers. Ideal for adding rich, analog textures to any genre, the NA 501 is a versatile tool for musicians and producers seeking that classic sound with contemporary flexibility.
