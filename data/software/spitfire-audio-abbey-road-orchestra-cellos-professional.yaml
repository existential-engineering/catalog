details: |-
  Celebrating the stunning sound of a Cello section captured at Abbey Road Studios, this VST offers a comprehensive collection of long and short articulations, 8 technologically advanced legato techniques — with extended velocity triggered patches (portamento and detaché), a high level of sampling depth and 16 curated mix signals hand-crafted by GRAMMY award winner Simon Rhodes, this library sets a new standard for the sound of the cello in the digital age.

  A remarkably authentic cello sound that embodies the timeless essence of one of the most renowned recording spaces in the world — Abbey Road Studio One.

  Expression at the highest degree.

  Do you already own an Abbey Road Orchestra Library? Log in to see your exclusive price.

  Also available in Core .
specs: |-
  - Legato techniques: Performance Legato (Extended), Lyrical Legato (Extended), Performance Legato, Lyrical Legato, Legato Runs, Legato Detache, Legato Portamento, Legato Slurred, Legato Allegro
  - Long techniques: Long (Extended), Long, Flautando, Tremolo, Harmonics, Trills (major and minor 2nds and 3rds), Measured Tremolo at 150 and 180 BPM
  - Short techniques: Spiccatissimo, Spiccato, Staccato, Marcato, Pizzicato, Col Legno
  - 16 signal options: Mix 1, Mix 2, Close, Close Ribbons, Pop Main, Pop Room, Tree 1, Tree 2, Outriggers 1, Outriggers 2, Mids, Ambients, Vintage 1, Vintage 2, Leader, Spill
