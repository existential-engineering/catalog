details: |-
  Software for creating DJS-TSP projects and scenes

  DJS-TSP Project Creator is software for creating projects and scenes to be used on the DJS-1000 stand-alone DJ sampler and TORAIZ SP-16 professional sampler . Editing on a PC/Mac browser allows you to quickly create more scenes and projects. You can export the projects and scenes created on DJS-TSP Project Creator to a USB device, or import the projects and scenes on the USB device to your computer. How To Install Download the software from the relevant link below. DJS-TSP Project Creator for Mac DJS-TSP Project Creator for Windows Unzip/open the downloaded zip file. Double-click 'Install DJS-TSP Project Creator ***.exe file' and install.
