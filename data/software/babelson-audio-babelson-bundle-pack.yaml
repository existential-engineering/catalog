details: |-
  Babelson bundle includes 8 audio plugins and a free copy of DAW regulator.

  The bundle contains: bbcmp (dual band compressor), bab drive (saturator),
  delfeed (vintage style delay), proximad (modulation), rojbash (modulation),
  babel mode 1976 (modulation), b-comp (stereo compressor), and belle filter
  (free filter eq).

  Once the package is downloaded double-click the downloaded .pkg (mac) / .msi
  (win) file to start the installation. The installer will be verified and a
  welcome window will pop up.

  Get a free and fully functional 7-day trial of any babelson audio plug-in.
