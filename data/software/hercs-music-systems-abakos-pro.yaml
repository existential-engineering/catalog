details: |-
  Abakos PRO is the commercial big brother to the freebie abakos, functioning as
  a VST plugin for Windows.

  Features include triangle waveform added to oscillator section, arpeggiator
  with plenty of control onboard including tempo and division, and support for
  tun (tuning files).

  The improved filter includes a saturation button for wild self oscillation,
  with lp and hp filter types offering 12, 24 and 48 db/oct options.

  New distortion module adds low bit grit to sounds for extreme sonic mess, and
  new rotary effect with lfo to pan goodness.

  Special config program gives all users access to some of the internal
  behaviour of abakos pro, allowing choice of oversampling rate, global volume
  and polyphony settings, along with a new and improved preset system making
  choosing presets much more intuitive.
specs: |-
