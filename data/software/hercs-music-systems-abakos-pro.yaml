  - 12 dB/oct
  - 24 dB/oct
  - 48 dB/oct
  - Saturation button
  - Distortion module
  - Rotary effect
  - LFO
  - Pan
  - Oversampling rate control
  - Global volume control
  - Polyphony settings
  - Preset system
  - Windows compatible
