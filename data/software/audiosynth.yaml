description: Multi-timbral polyphonic sample player that supports soundfonts and
  can split and layer wav's in 8 programs with individual portamento controls.
details: |-
  Multi-timbral polyphonic sample player. Supports soundfonts. Can split and
  layer wav's in 8 programs.

  Samples have individual portamento/glide. 3 filter modes. Distortion.

  Most parameters can be controlled by 2 envelopes, 1 lfo, a beat generator, a
  random generator and any control change message.
specs: |-
  - Multi-timbral polyphonic sample player
  - Soundfonts support
  - 8 programs with split and layer capability for wav files
  - Individual portamento/glide per sample
  - 3 filter modes
  - Distortion
  - 2 envelopes
  - 1 LFO
  - Beat generator
  - Random generator
  - Control change message support
  - Windows compatible
