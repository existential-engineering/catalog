details: |-
  Classic drum synthesis is back with a vengeance! Flexible and tweakable, Heartbeat is your source for familiar, yet unique, drum machine sounds.

  Heartbeat offers eight channels of drum sounds, mostly based on modeled analog synthesis, together with a mixer providing volume, EQ, effect sends and panning for each channel.

  Use the built-in effects and the innovative Auto Layer Machine to take your beats to unexpected places. The four channel Auto Layer Machine layers sounds or triggers beat patterns, and a chaos slider adds randomness to its behavior.

  Adapted versions of TSAR-1 Reverb and Valley People Dyna-mite are included, as well as Filter Echo and output saturation.

  Heartbeat is Modular Ready: its instrument and EQ modules can be used in Modular, Softube's Eurorack platform. This applies only to those components, not to TSAR-1 and Dyna-mite.
specs: |-
  - Eight channels of drum sounds, mostly based on modeled analog synthesis
  - Mixer with volume, EQ, effect sends and panning for each channel
  - Four channel Auto Layer Machine for layering sounds or triggering beat patterns
  - Chaos slider adds randomness to the behavior of Auto Layer Machine
  - Adapted versions of TSAR-1 Reverb and Valley People Dyna-mite included, as well as Filter Echo and output saturation
  - Modular Ready: use Heartbeat's instrument and EQ modules in Modular, Softube's Eurorack platform (applies only to these components, not TSAR-1 and Dyna-mite)
  - No iLok USB dongle required
  - Three activations
  - 20-day trial, 14-day returns
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26; Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access for downloading installers and managing licenses
