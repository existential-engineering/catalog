details: >-
  Ambience enhancer standard by novonotes is a virtual effect audio plugin for
  macos. It functions as an audio units plugin, a VST 3 plugin and an AAX
  plugin.


  The lite version (free) supports 2 channels, while the standard version
  supports multi-channel I/o up to 24 channels. In addition to the perpetual
  license, a 30-day license is also offered for subscriber-like operations and
  one-off events.


  If your recording contains natural room acoustics but seems a bit dry, use the
  ambience enhancer to enhance the room acoustics before adding artificial
  reverb. This will avoid the unwanted side effect of adding reverb to the
  already existing reverberation and will give a more natural result.


  The ambience enhancer analyzes the incoming audio and decomposes it into
  ambience and direct component. By adjusting various parameters such as gain,
  filter, delay, etc., you can control the ambience sound as you wish.


  When combined with 3dx, you can instantly create the perfect upmix or downmix.
  This is also effective when you want to use stereo material to blend into a
  surround music.
specs: |-
  - Vst3 plugin
  - Audio units plugin
  - AAX plugin
  - Multi-channel I/o up to 24 channels
  - Ambience and direct component decomposition
  - Adjustable gain, filter, delay parameters
  - Binaural processing
  - Stereo to surround upmix/downmix capability
  - Macos compatible
