details: |-
  Regroover pro is the world's first artificial-intelligence beat machine based on accusonus' patent-pending advanced audio analysis (a3) technology. It analyzes audio clips and extracts underlying sound layers, allowing producers, musicians, djs and sound designers to remix, rearrange and manipulate grooves with unprecedented flexibility. Users can extract inspiring samples from the layers, drag them into the kit editor, combine them with external sounds and create inspiring expansion kits.

  Rhythmiq uses a.I. To help turn tracks into a performance by allowing real-time loop reshaping and safe improvisation while performing live. It analyzes and understands beats to instantly create new arrangements, generating unlimited musically structured rhythms. The a.I. Beat assistant performs loops in real-time, injecting beats with nuanced micro-variations to musical, evolving changes while remaining user-controlled.

  Beatformer effortlessly shapes the sound of beats with 4 intuitive controls: boom, punch, squash and air, allowing transparent fine-tuning or full transformation while blending analog-style processing with modern digital technology.

  Drumatom is the world's first microphone leakage suppression tool for multichannel drum recordings based on patent pending advanced audio analysis (a3) technology. It reduces cross-microphone bleed on recorded drum tracks without altering drum tones, using advanced signal analysis and processing to determine the difference between different drum hits while preserving individual drum sounds.

  Era 4 bundle pro is a collection of eight powerful, human-friendly audio repair plugins offering fast and high-quality processing. It includes era 4 noise remover, era 4 reverb remover, era 4 plosive remover, era 4 de-esser, era 4 de-esser pro, era 4 voice leveler, era 4 de-clipper, and era-d.
