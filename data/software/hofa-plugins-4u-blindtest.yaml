description: 4U+ BlindTest is a plugin for objective, blind A/B comparison of audio inside your DAW. Tracks can be anonymised and shuffled into random order, rated and commented, with per-track peak metering and gain control to remove level bias. The free version compares up to 3 tracks; an upgrade unlocks unlimited tracks.
details: |-
  The HOFA 4U+ BlindTest allows you to objectively compare equipment (e.g. plugins) inside your DAW. Only if you compare objectively, will you get the best sounding result.

  HOFA 4U+ BlindTest is free. You can compare up to 3 tracks. The HOFA 4U+ BlindTest upgrade for unlimited tracks can be purchased.

  We often get distracted by appearance or names: we think we hear differences that do not exist, simply because of the connection between visual and auditory perceptions. Therefore, we unconsciously often compare the expectations we have of a product, rather than the actual sound character. In order to avoid this problem, we have developed a reliable blind test, so you can concentrate on what is important: the sound!

  Most important: the Shuffle button. Click on "Shuffle" to anonymise the tracks and put them in a random order. Now you can switch between the signals to compare them objectively. Assign a rating from 0 to 5 and write down comments about your aural impression. The names of the tracks can then be revealed again. You can use the shuffle mode multiple times. This way you get an average, creating your personal sound study. The comments can be displayed together, so you can compare whether your aural impressions were the same every time.

  To make sure that the results are really objective, there is a peak level display and a gain control for every track, so you can make sure the volume differences do not influence your decisions, and the GUI is freely scalable, so that you can use it to hide anything on your screen that may influence your decisions like your DAW's mix window. You might not want to compare all tracks at once: simply drag unused tracks to the "INACTIVE" section. This can be used to sort out tracks during a test run.
specs: |-
  - Formats: VST3, AU, AAX
  - Operating system: macOS 10.13 or later, Windows 10 or later
  - Free version compares up to 3 tracks; upgrade available for unlimited tracks
  - Shuffle button anonymises tracks and puts them in a random order
  - Rating from 0 to 5 per track, plus written comments that can be compared across test runs
  - Multiple shuffle runs can be averaged into a personal sound study
  - Peak level display and gain control for every track
  - Freely scalable GUI, usable to hide distracting parts of the screen
  - "INACTIVE" section for dragging unused tracks out of a test run
  - Two licenses available, managed via the HOFA Plugins Manager, deactivatable and transferable
  - Offline activation supported; USB stick licenses usable alongside other manufacturers' USB licenses
  - Continuously tested on Ableton Live, Apple Logic, Avid Pro Tools, Bitwig, Cockos Reaper, Image Line FL Studio, Magix Samplitude/Sequoia, Fender Studio Pro, Steinberg Cubase/Nuendo/Wavelab
  - 14 days free trial
