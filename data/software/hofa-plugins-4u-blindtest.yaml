description: 4U+ BlindTest is a plugin for objective, blind A/B comparison of audio inside your DAW. Tracks can be anonymised and shuffled into random order, rated and commented, with per-track peak metering and gain control to remove level bias. The free version compares up to 3 tracks; an upgrade unlocks unlimited tracks.
details: |-
  The HOFA 4U+ BlindTest allows you to objectively compare equipment (e.g. plugins) inside your DAW. Only if you compare objectively, will you get the best sounding result.

  We often get distracted by appearance or names: we think we hear differences that do not exist – simply because of the connection between visual and auditory perceptions. Therefore, we unconsciously often compare the expectations we have of a product, rather than the actual sound character. In order to avoid this problem, HOFA developed a reliable blind test so you can concentrate on what is important: the sound.

  Click on "Shuffle" to anonymise the tracks and put them in a random order. Now you can switch between the signals to compare them objectively. Assign a rating from 0 to 5 and write down comments about your aural impression. The names of the tracks can then be revealed again.

  You can use the shuffle mode multiple times to create an average, forming your personal sound study. The comments can be displayed together, so you can compare whether your aural impressions were the same every time.

  HOFA 4U+ BlindTest is free for up to 3 tracks. An upgrade for unlimited tracks can be purchased. The plugin is licensed via the HOFA Plugins Manager, supports offline activation, and comes with two available licenses.
specs: |-
  - Formats: VST3, AU, AAX
  - Operating System: macOS 10.13 or later, Windows 10 or later
  - Shuffle button for track anonymisation and random ordering
  - Peak level display and gain control per track
  - Rating system (0–5) with comment fields per track
  - Inactive section for excluding tracks during a test run
  - Multiple shuffle runs for averaged results
  - Freely scalable GUI
  - Tested DAWs: Ableton Live, Apple Logic, Avid Pro Tools, Bitwig, Cockos Reaper, Image Line FL Studio, Magix Samplitude/Sequoia, Presonus Studio One, Steinberg Cubase/Nuendo/Wavelab
  - Two licenses included; managed via HOFA Plugins Manager
  - Offline activation supported
