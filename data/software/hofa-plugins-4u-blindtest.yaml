details: |-
  The HOFA 4U+ BlindTest allows you to objectively compare equipment (e.g. plugins) inside your DAW. Only if you compare objectively, will you get the best sounding result. HOFA 4U+ BlindTest is free. You can compare up to 3 tracks. The HOFA 4U+ BlindTest upgrade for unlimited tracks can be purchased. You are currently viewing a placeholder content from YouTube . To access the actual content, click the button below. Please note that doing so will share data with third-party providers. More Information Unblock content Accept required service and unblock content We often get distracted by appearance or names: we think we hear differences that do not exist – simply beacuse of the connection between visual and auditory perceptions. Therefore, we unconsciously often compare the expectations we have of a product, rather than the actual sound character. In order to avoid this problem, we have developed a reliable blind test, so you can concentrate on what is important: the sound! Most important: The Shuffle-Button Click on “Shuffle” to anonymise the tracks and put them in a random order. Now you can switch between the signals to compare them objectively. Assign a rating from 0 to 5 and write down comments about your aural impression. The names of the tracks can then be revealed again. You can use the shuffle mode multiple times. This way you an average, creating your personal sound study. The comments can be displayed together, so you can compare whether your aural impressions were the same every time. To make sure that the results are really objective… … there is a peak level display and a gain control for every track, so you can make sure the volume differences do not influence your decisions. … the GUI is freely scalable, so that you can use it to hide anything on your screen that may influence your decisions like your DAW’s mix window. You might not want to compare all tracks at once. Simply drag unused tracks to the “INACTIVE” section. This can be used to sort out track
