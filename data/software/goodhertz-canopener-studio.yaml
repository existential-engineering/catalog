description: CanOpener Studio is a headphone listening processor that uses
  crossfeed technology to make headphones behave more like loudspeakers,
  enabling better mix translation and more accurate monitoring.
details: |-
  CanOpener is the most transparent headphone listening processor available. Get better mixes on headphones with no fuss, gimmicks, "room simulations", or 3D spatialization, simply better, more accurate translation to speakers.

  By making your headphones behave a bit more like loudspeakers, the CanOpener Studio crossfeed algorithm allows you to recreate the rich sonic experience of listening to high-end speakers in a finely tuned room. Combined with a gorgeous equalizer and serious monitoring controls, CanOpener Studio is great for tracking, allowing performers to get the perfect headphone mix, and it's also equally useful on the master output, to help correct or enhance any monitoring environment.

  Under the right conditions, headphones can be excellent, high-fidelity monitoring tools. In reality, though, these conditions are rarely met, and headphones often end up sounding unnatural, uninspiring, and fatiguing when listened to for long periods of time. The main problem with headphones is that most music is still created (recorded, mixed, mastered) on speakers, with tools that were primarily designed for loudspeaker playback.

  Compared to speakers, music often sounds overly wide when listened to on headphones, as if there were a section missing from the center of the stereo image. Headphones also offer poor externalization (i.e. mono sounds typically appear to originate from inside the listener's head as opposed to externally). Similarly, headphones often have irregular, exaggerated, or unnatural frequency response curves, either because they were designed that way or because they lack the natural bass reinforcement that would occur in a real room with speakers.

  CanOpener Studio takes a less-is-more approach: fix the bad things about headphones with as little coloration or alteration as possible. Rather than emulate a specific studio control room or loudspeaker setup (along with all its flaws), the CanOpener crossfeed algorithm uses an idealized loudspeaker and room as its guide and gives you the control to use as much or as little of it as you need.
specs: |-
  - Proven, transparent Goodhertz crossfeed algorithm
  - Baxandall treble & bass equalizer, borrowed from Tone Control
  - Extensive monitoring features: Mono, Flip L/R, Polarity, Dim, Balance, Compensation
  - Soft Start: Gently starts playback, avoiding loud transients
  - Safe Gain: Avoids clipping, regardless of equalizer or crossfeed settings
  - Mastering-grade dithering, borrowed from Good Dither
  - One page of advanced controls
  - 64-bit DAW and 64-bit processor required
  - macOS 10.13 or later; Windows 10 or later
