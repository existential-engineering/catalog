description: Here comes Virtual Pianist VOGUE, the smart way to produce realistic piano performances. Create dazzling results while staying in the flow, zero piano skills required.
details: |-
  The grand piano, the prima donna amongst pop music instruments, breathes grandezza and glamour into any production like nothing else. So important, so beautiful and so hard to master. Virtual Pianist VOGUE is the smart way to produce realistic piano performances, creating dazzling results while you stay in the flow, with zero piano skills required.

  VOGUE is first and foremost a modern and perfectly produced grand piano. It is based on a legendary Austrian large concert grand piano, a gold standard in studio and stage sound, with tuning and setup customized for pop and rock. It is punchy and crispy, and with pristine full-bodied sound and lots of dynamics it can hold its own within a band.

  VOGUE is a professional session player well-versed in contemporary musical styles. This virtual musician can contribute rhythmic tracks as part of a band, accompaniments for singers and instrumentalists, or simple but appealing solo passages and instrumental playbacks. Pick from 30 styles, trigger the phrases and adjust to fit, or play freely in Instrument mode.

  Character presets switch between aesthetics for any occasion, from soft intimate sensual ballads to intense 90s house stabs, and together with the piano-optimized Finisher modes they create a large palette of engineered piano sounds. Setting the key of your song lets Player mode play more varied and custom-tailored phrases and harmonies.
specs: |-
  - Grand piano model based on a legendary Austrian large concert grand piano, tuned and set up for pop and rock
  - 30 styles with 180 phrases and 150 fills and add-ins
  - 30 Finisher multi-effect modes and 30 Ambience FX presets
  - More than 130 global presets
  - MIDI drag and drop, resizable user interface
  - Player mode and Instrument mode with key-aware phrasing
  - Supported standards: MIDI
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 3.3 GB of disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery: automated installation via the UJAM App, which also installs the Virtual Pianist plug-in host
  - Authorization via the UJAM App
  - All MIDI phrases and included sounds are royalty-free
