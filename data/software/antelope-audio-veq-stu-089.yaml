description: "This EQ is a simple, but powerful tool modeled from the channel
  strip of a world-renowned mixing console. Dating back from the '70s, this EQ
  and the console it came from are still revered for their deep analog sound."
details: |-
  The VEQ-STU 089 is a semi-parametric EQ with 2 variable filters and a Presence knob with its own frequency dial. Modeled from the channel strip of a world-renowned 1970s mixing console, it delivers deep analog character that engineers still revere today.

  The plugin will give your sound a warm and authentic analog treatment and is especially powerful when processing drum sounds. It runs natively in your DAW on macOS and Windows, and in real time on Antelope Synergy Core audio interfaces.
