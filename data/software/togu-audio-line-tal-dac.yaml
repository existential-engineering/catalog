description: "TAL-DAC brings back the character and sound of 80's samplers and
  lo-fi devices in one effect plug-in. It emulates the unique sound of vintage
  digital-to-analog converters, faithfully reproducing the subtle imperfections,
  harmonics, and nonlinearities that give digital audio a vintage vibe and
  character. Can be used for subtle sound changes or extreme effects. Free for
  TAL-Sampler owners."
