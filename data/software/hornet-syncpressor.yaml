description: SyncPressor is a bus compressor designed for the master bus that syncs with your track's tempo and always sets the right attack and release.
details: |-
  HoRNet SyncPressor is a dynamics processor developed specifically for master bus compression, designed in collaboration with the Italian mixing engineer Antonio Porcelli. It is built to deliver the glue that brings mixes together, with a transparency and musical responsiveness aimed at final mix processing.

  What sets SyncPressor apart is its tempo-synchronized design. Rather than offering static attack and release parameters, it features two dropdown menus where musical time divisions such as 1/8, 1/16 or 1/4 notes are selected and calculated against the plugin's internal tempo engine. That internal tempo can be synchronized to the DAW, set manually, or auto-detected directly from the incoming audio.

  While designed for the master bus, SyncPressor is not limited to stereo summing and performs equally well on individual tracks. It offers variable knee control, RMS or peak detection, feedback processing and external sidechain support, along with a high-pass filter available on both internal and external sidechain paths. The left and right channels can be unlinked in the detector circuit, making the plugin behave like a dual mono compressor and enhancing stereo width.

  A dry/wet mix control allows parallel compression within the plugin, and a tempo multiplier makes it easy to double or halve the attack and release times. The graphical interface is fully hardware accelerated using OpenGL on Windows and Metal on macOS, offloading graphics processing from the CPU. The plugin also ships with bus compressor presets designed by Antonio Porcelli.
specs: |-
  - Clean digital compression
  - Attack and release synced to track tempo
  - Tempo sync to DAW, manual or automatic detection from audio input
  - Variable compression knee
  - Internal or external sidechain
  - RMS mode for the sidechain
  - High pass filter up to 1000Hz for the sidechain
  - Feedback or feedforward modes
  - Dual mono mode for wider stereo image
  - Up to 16x oversampling
  - Dry/wet mix knob for parallel compression
  - Presets designed by Antonio Porcelli
  - Hardware accelerated GUI (OpenGL on Windows, Metal on macOS)
  - Apple Silicon native support (except for AAX)
  - Mac OS X (10.11 and later with Metal support) and Windows (7 and later) support
  - 64-bit plugins for macOS and Windows
  - Audio Units, VST, VST3 and AAX format
  - No copy protection
