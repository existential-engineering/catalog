details: |-
  Mobile DJ app for iPad

  Start mixing music on your iPad with WeDJ, our DJ app. The colourful, animated 2-channel interface with waveforms, jog wheels, play/cue buttons, tempo sliders and a crossfader, make it easy to get creative with tracks from your iTunes library. With WeDJ, your DJ skills are really mobile: simply use your headphones to practice wherever you are, or plug your iPad into speakers and play wherever you may be. Take your performance to the next level by connecting to the DDJ-WeGO4 controller for tactile control of the DJ app’s features.
