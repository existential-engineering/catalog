details: |-
  The fun and funky Surrealistic MG-1 Plus Synthesizer is a super authentic
  recreation of the Realistic MG-1 synthesizer sold in Radio Shack stores in
  the 80's. The Surrealistic MG-1 Plus delivers fat analog tone in spades,
  along with a unique polyphonic oscillator section, bell tone ring modulation,
  glide, auto repeat note triggering, oscillator sync, and a number of
  improvements that tremendously expand its capabilities.

  Best of all, the Surrealistic MG-1 Plus is absolutely free. It features
  ultra-accurate analog modeling with a dual oscillator monophonic section plus
  a polyphonic oscillator bank, giving it a unique sonic character among
  vintage synthesizer recreations.

  The super fat 24dB ladder filter delivers the classic analog sound, while
  over 130 presets provide a wide range of starting points. Additional features
  include bell tone ring modulation, a tempo syncable LFO, expanded octave
  ranges, and multiple note priority modes including legato and retrigger.

  All controls are fully MIDI assignable with complete DAW automation support,
  preset level MIDI mapping, and preset favoriting from the toolbar. Advanced
  one-click UI magnification rounds out the modern feature set.
specs: |-
  - Ultra-accurate analog modeling
  - Dual oscillator monophonic plus polyphonic oscillator bank
  - Super fat 24dB ladder filter
  - Over 130 presets
  - Bell tone ring modulation
  - Tempo syncable LFO
  - Expanded octave ranges
  - Multiple note priority modes including legato and retrigger
  - Advanced one-click UI magnification
  - All controls MIDI assignable
  - Full DAW automation of all controls
  - Preset level MIDI mapping and automation
  - Preset favoriting from the toolbar
