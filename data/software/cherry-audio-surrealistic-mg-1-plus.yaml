details: |-
  The fun and funky Surrealistic MG-1 Plus Synthesizer is a super authentic recreation of the Realistic MG-1 synthesizer sold in Radio Shack stores in the 80's. The Surrealistic MG-1 Plus delivers fat analog tone in spades, along with a unique polyphonic oscillator section, "bell tone" ring modulation, glide, auto repeat note triggering, oscillator sync, and a number of improvements that tremendously expand its capabilities.

  The instrument pairs a dual-oscillator monophonic section with a separate polyphonic oscillator bank, routed through a 24db "ladder" filter, and adds a tempo-syncable LFO, expanded octave ranges and multiple note priority modes including legato and retrigger.

  Modern workflow additions include one-click UI magnification, MIDI assignment for all controls, full DAW automation, preset-level MIDI mapping and automation, and preset favoriting from the toolbar. Over 130 presets are included.

  macOS 10.13 or above is required, with macOS 13 Ventura supported, 64-bit only, and native Apple M1 or greater processor support including Ultra. A 3.4 GHz Quad-Core or M1 CPU with 8GB of RAM is recommended. On Windows, Windows 7 or above (including Windows 11) is required, 64-bit only, with a quad-core computer and 8GB of RAM recommended. An internet connection is required for product activation.
specs: |-
  - Ultra-accurate analog modeling
  - Dual oscillator monophonic plus polyphonic oscillator bank
  - Super fat 24db "ladder" filter
  - Over 130 presets
  - "Bell tone" ring modulation
  - Tempo syncable LFO
  - Expanded octave ranges
  - Multiple note priority modes including legato and retrigger
  - Advanced one-click UI magnification
  - All controls MIDI assignable
  - Full DAW automation of all controls
  - Preset level MIDI mapping/automation
  - Preset favoriting from the toolbar
  - macOS 10.13 or above, 64-bit required, native Apple M1 or greater processor support
  - Windows 7 or above (including Windows 11), 64-bit required
  - Internet connection required for product activation
