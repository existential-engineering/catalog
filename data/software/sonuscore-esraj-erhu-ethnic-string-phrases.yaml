description: "The two string instruments cover a huge variety of different styles and techniques: From very simple, touching phrases, all the way to extremely virtuous. Features 670+ live-performed phrases across 19 themes using Esraj (Indian) and Erhu (Chinese) instruments for Native Instruments Kontakt or Steinberg HALion."
details: |-
  Esraj & Erhu - Ethnic String Phrases is a phrase-based scoring instrument covering two traditional bowed string instruments from India and China. It continues the Ethnic Series and is built the same way as the Lyrical Series: the recordings are complete live performances rather than sustained notes, so a key press returns a played line with its own phrasing and expression intact.

  The Esraj is a North Indian stringed instrument known for extremely soft and smooth tones, used for the last 300 years largely as an accompanying instrument for voices, its warmth coming from a bank of sympathetic resonance strings. The Erhu is a Chinese spike fiddle with two strings, known for a strong character that still sits comfortably in both traditional and contemporary arrangements. The two are presented together as one instrument.

  The library carries over 670 live performed phrases across 19 themes, running from very simple and touching lines to virtuoso and stirring ones. Phrases can be adjusted in key, speed, length, succession and connection, with a speed knob at the centre for timing control, and they were recorded to suit multiple tempi without being locked to a set meter. Each theme comes with 15 different phrases as starting, middle and end phrases, plus two short endings for concluding or switching between passages.

  An Erhu legato instrument and an Esraj sustain instrument are included so that traditional and phrase-based sampling can be combined, either to connect or extend existing phrases or to write new lines outright. The interface is the Lyrical Series one, with multiple phrases assignable across the keyboard, a waveform preview for each phrase and an FX page for EQ, delay and reverb. It runs in the full version of Native Instruments KONTAKT or in Steinberg's free HALion Sonic.
specs: |-
  - 670+ live performed phrases
  - 19 themes
  - 2 ethnic string instruments (Esraj and Erhu)
  - Erhu legato and Esraj sustain instruments included
  - 15 different phrases per theme as starting, middle and end phrases, plus 2 short endings
  - Phrases adjustable in key, speed, length, succession and connection, with a central speed knob
  - Multiple phrases assignable across the keyboard with a waveform preview for each
  - FX page with EQ, delay and reverb
  - Requires the FULL version of Native Instruments' KONTAKT 5 (version 5.8.1 or higher), or Steinberg's free HALion Sonic
  - The free Kontakt Player is not sufficient: it only runs the instrument in DEMO mode
  - HALion Sonic is currently not compatible with Notion by PreSonus
  - Intel Core 2 Duo processor recommended
  - Mac OS X 10.11 or higher
  - Windows 7 or higher
  - 4 GB RAM
  - At least 2.5 GB of free hard disc space
