description: "The two string instruments cover a huge variety of different styles and techniques: From very simple, touching phrases, all the way to extremely virtuous. Features 670+ live-performed phrases across 19 themes using Esraj (Indian) and Erhu (Chinese) instruments for Native Instruments Kontakt or Steinberg HALion."
specs: |-
  - 670+ live-performed phrases across 19 themes
  - Instruments: Esraj (Indian) and Erhu (Chinese)
  - Includes Erhu legato and Esraj sustain instruments
  - Starting, middle, and end phrase variations
  - Customizable speed and length controls
  - Built-in effects page: EQ, delay, reverb
  - Waveform preview functionality
  - Keyboard phrase assignment capability
  - Requires: Native Instruments KONTAKT 5 (5.8.1+) or Steinberg HALion Sonic (free)
  - Processor: Intel Core 2 Duo minimum
  - OS: macOS 10.11+ or Windows 7+
  - RAM: 4 GB minimum
  - Disk space: 2.5 GB
