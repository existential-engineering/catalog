description: Analogflux is a suite of Windows VST effect plug-ins designed to
  deliver the sounds of the analog days.
details: |-
  This suite consists of tapebus, delay, impulse, insert and chorus plug-ins.

  Analogflux delay models sound of an old analog delay module. Beside this it offers the user modern two-tap delay controls including separate pre-delay and feedback delay controls which together allow you to build ping-pong kind of echo soundscapes.

  Delay also contains a cross-feedback path between the channels which enables you to create even more complex echo structures. It also offers you a bpm control with the ability to sync it to the host tempo changes.

  You can choose the response of the delay module: from moderately bright to endlessly dark, taken from the real analog delay module.
specs: |-
  - Convolution processing
  - Two-tap delay controls
  - Pre-delay
  - Feedback delay controls
  - Cross-feedback path
  - Bpm control
  - Host tempo sync
  - Analog delay module modeling
