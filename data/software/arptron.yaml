details: >-
  Arptron by psychic modulation is a virtual instrument audio plugin for
  windows. It functions as a VST plugin.


  Features include 2 cross-fading oscillators with phase distortion on osc1,
  unison detune, and an arpeggiator section that can also be used as a MIDI arp.


  The synth includes 3 envelopes consisting of dedicated filter and amp
  envelopes plus a mod envelope, along with high, band & lowpass filters that
  can all be used simultaneously.


  2 lfos with bpm sync, dual stereo delay, and external audio processing through
  the arp gate and delay are included.


  An audio mixer allows cross-fading the oscillators with incoming audio, and
  the plugin comes with 64 presets.
