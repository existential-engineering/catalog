description: smart:EQ 4 is an equalizer that uses AI to correct spectral issues
  and achieve tonal balance in individual tracks. Intelligent cross-channel
  processing adds hierarchical control over multiple tracks, so spectral
  unmasking can be set up by dragging and dropping.
details: |-
  Unlike equalizers that leave the context of a mix out of their processing, smart:EQ 4 allows multi-track unmasking across up to 10 tracks arranged by drag and drop. Priorities set for each smart:filter bring some elements to the forefront of the sonic stage, leave others in the middle and push the rest into the background. Any instance within the same group can be remotely controlled from any other instance, so switching back and forth between plug-in windows is not needed. The traditional bottom-up approach, starting with individual elements and building a mix piece by piece, still works here thanks to the plug-in's spectral shaping of each channel.

  The centerpiece is the smart:filter, which automatically balances a signal against a target profile chosen for the track. The smart:filter widget exposes a Smoothing parameter for gentler filtering and an Adaptive option for highly dynamic signals, and the green weighting curve can be split so the intelligent algorithms only work on a defined frequency range. The smart:filter runs in three modes: Track balances the channel, Group leaves the channel alone but reduces masking between it and other group members, and Track and Group applies balancing while also subjecting the channel to unmasking.

  Profiles cover instruments and vocals for use on single tracks or busses, plus genre-based profiles for a final spectral polish on a mix. Loading a reference track creates a custom profile so smart:EQ 4 emulates that spectral character and balance on the channel or buss, and the maximum learning time used to analyze the input signal can be specified.

  Beyond the smart:filter, the standard EQ bands offer dynamic behavior through a Dynamic Filter Widget with familiar compressor-like controls, and they can be used alongside or instead of the smart:filter bands in any instance. An auto gain feature compensates for level changes, mid-side processing is available throughout, and the analyzer shows not only the track at hand but every instance in the same group.
specs: |-
  - AI-powered smart:filter for automatic correction of tonal imbalances
  - Intelligent cross-channel processing for spectral unmasking across up to 10 tracks
  - smart:filter modes: Track, Group, Track and Group
  - Instrument, vocal and genre-based target profiles, plus custom profiles from a reference track
  - Adjustable maximum learning time for input analysis
  - Smoothing and Adaptive controls, splittable weighting curve with a definable frequency range
  - Dynamic standard EQ bands with a Dynamic Filter Widget
  - Auto gain, mid-side processing, group-wide analyzer
  - Remote control of any instance within a group from any other instance
  - Plug-in formats (Mac): VST, VST3, AU, AAX
  - Plug-in formats (Windows): VST, VST3, AAX
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok
  - Native Apple Silicon support
  - Windows 10 (64 bit) or macOS 10.14 and later
  - 4 GB RAM, Intel Core i5 or Apple Silicon CPU, OpenGL 3.2+ GPU
