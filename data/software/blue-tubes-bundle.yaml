description: The Blue Tubes Bundle is a collection of 18 plug-ins processors
  designed to improve the quality of digital sound recordings.
details: |-
  This bundle recreates the warm sound qualities of classic analog hardware and
  all 18 plug-ins provide a simple and functional "vintage-style" interface, as
  well as low cpu consumption.

  Blue tubes bundle includes: bt brickwall bw2s, bt compressor cp2s, bt deesser
  ds2s, bt compressor fa770, bt expandergate gx622, bt limiter lm2s, bt analog
  chorus ch2s, bt analog phaser aph2s, bt oilcan echo tle2s, bt tempo delay
  dl3d, bt stereo imager st2s, bt valvedriver adr2s, bt equalizer bq2s, bt
  equalizer bx2s, bt equalizer geq12, bt equalizer peq2b, bt equalizer peq5b, bt
  equalizer peq322.

  Blue tubes bundle by nomad factory is a virtual effect audio plugin for macos
  and windows. It functions as a VST plugin, an audio units plugin and an AAX
  plugin.

  The plugins offer a smoothness, fidelity and character with very low cpu
  usage.
specs: |-
  - 18 plug-in processors
  - Low CPU consumption
  - Vintage-style interface
  - Multi FX
  - Deesser
  - Delay/echo
  - Distortion/overdrive/amp
  - Dynamics (compressor/limiter)
  - EQ
  - Gate
  - Imaging
  - Modulation (flanger/phaser/chorus/tremolo)
