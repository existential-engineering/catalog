details: |-
  The Vocal Intensity Processor from Harrison is a powerful plugin that lets you
  polish your vocals with some of the best features once only found in
  Harrison's legacy of analog consoles.

  Smooth out the dynamics of your vocal track with an extremely easy to use
  vocal leveler. No more fiddling with complex compressors or gates. Just dial
  in the amount of leveling you want and let the plugin do the rest.

  Also you can attenuate any unwanted frequencies with the iconic 32c high and
  low-pass filters. Visualize how your vocal sounds before and after filtering
  with an rta that clearly shows the spectrum of the signal.

  Keep your vocal level consistent with the k-12 output meter and prevent
  distortion or clipping with a built-in limiter. This meter helps you achieve a
  balanced and professional mix that sounds great on any system. You can also
  switch between different metering modes to suit your needs.

  The vocal intensity processor is the ultimate vocal enhancer for any genre or
  style.
specs: |-
  - Vocal leveler
  - 32c high and low-pass filters
  - Rta (real-time analyzer)
  - K-12 output meter
  - Built-in limiter
  - Multiple metering modes
  - macOS support
  - Windows support
  - Linux support
  - Universal 2 binary
