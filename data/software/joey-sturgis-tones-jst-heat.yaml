  Vocals
  Vocal Warmth
  Vocal Warmth
  A vocal processor designed to add warmth and lo-fi vibes
  Ideal for achieving a vintage, analog feel on vocals
  Use sparingly on lead vocals to enhance character without overwhelming clarity
  Great for use on guitars, adding subtle overdrive, ideal for blues and rock tones
  Try using it before a high-gain amp and use the individual bands to emphasize different frequencies
  Drum Power
  An audio level destroyer with a vintage vibe, capable of massively transforming drum sounds
  Use on room mics to exaggerate room ambience and add a sense of power and depth
  Adjust the Heat knob to saturate vocals, adding a distinct, vintage character to the mix
  Blood Thirsty
  An aggressive distortion mode that adds even and odd harmonics
  Great for adding bite to synth leads or bass lines in electronic music
  Make It Hot
  A custom distortion circuit tailored for crushing the low end
  Push the low band's Heat to make 808s growl (automate it to create interesting effects)
  Extra Spice
  A custom circuit featuring analog spice and frequency-dependent saturation paths
  Perfect for adding harmonic complexity to flat-sounding tracks
  Reheat
  Distortion with built-in feedback
  Creates unique, self-oscillating effects, especially on sustained notes
  Ideal for sound design and creating atmospheric textures
  Just A Touch
  Subtle saturation based on a custom transformer circuit
  Apply lightly to the master bus for a cohesive, polished feel
  Enhances overall mix warmth without drastic changes to the sound character
  Hellraiser
  A brutal-sounding bass amp
  Provides a fierce, aggressive tone to rock and metal bass lines
  Set the crossovers at 350 Hz and 3000 Hz, and adjust the mid band's Heat to achieve an aggressive bite
  Use all band's level controls as a tonestack
  Use the high cut control to simulate a basic bass cab
  Black Glass
  A bass preamp for modern bass tones
  Delivers a clean, defined low end suitable for modern metal genres
  Try it on synthesized basses for added clarity and punch
  Use pre-distortion tone control to set the amount of low frequency / treble content to saturate
  Use the high cut control to simulate a basic bass cab
  No Name
  A processor designed for modern metal guitar tones
  Use on rhythm guitars for a fuller, more present sound in the mix
  Blow Torch
  Elevate your mix with tube magic using series and parallel circuits for a bigger, punchier sound
  Ideal for drums and percussive elements, adding a dynamic, energetic character
  Experiment with parallel processing on vocals for a unique, layered effect
  Pain
  A fusion of aggressive saturation and hard compression
  Use on dynamic sources like vocals for a pronounced, upfront sound
  Great for adding intensity and focus to lead guitar parts
  California Reaper
  Aggressive multiband upward compression and distortion
  Use each band's Heat knob to blend the compressed signal in parallel, pushing a specific frequency range into distortion and chaos
  Try it on full mixes as an effect to get a dense, impactful atmosphere
  Electrify
  A distortion with a distinctive electric character based on unique power-tube designs
  Enhance bass lines with a touch of this tube-inspired distortion, adding depth and character while maintaining clarity
  Experiment with this mode on synth leads to achieve a vintage, tube-driven sound that stands out in the mix - Try placing it after an amp and gently pushing the mid band's Heat to add a nice warmth to the tone (adjust mix to taste)
  Infrared
  Add fatness with a blend of even and odd harmonics
  Use on thin-sounding tracks to add body and depth
  Particularly effective on acoustic instruments for a richer, fuller sound
  Overload
  A multiband foldback distortion unit
  Use on synthesizers to create complex and interesting timbres
  Perfect for sound design tasks to achieve unique tones
  Ideal for experimental electronic music, adding unique textures
  Xallarap
  A processor designed to sculpt and refine modern bass tones
  Distort the mids and highs while maintaining a solid low-end
  Especially effective on bass synths and electronic drum elements
  Inferno
  Raise some hell with a blend of aggressive wideband upward compression and distortion
  Use the main Heat knob to blend the compressed signal in parallel, pushing everything into distortion and chaos
  Achieve unique textures and ambients by automating the main Heat knob while using it on synths
  Hair Clippers
  A Multiband Hard Clipper for Precise Control.
  Great for taming peaks while adding character to each band.
  Diode Screamer
  A multiband distortion for classic overdrive tones.
  Perfect for adding warmth and grit to guitars while maintaining clarity.
  Use bands to shape which frequencies get that signature overdrive character.
  Fuzzy Logic
  A multiband fuzz processor for thick, woolly distortion.
  Shape your Fuzz tone by driving each band independently.
  Overblown
  An aggressive multiband broken tube distortion.
  Creates intense, harmonically rich distorted tones.
  Perfect when you want to push things to the extreme.
  Custom
  Choose different Heat algorithms independently for each frequency band.
  Experiment with new combinations to create your own unique sounds.
  Understanding the JST Heat Workflow
  Select a Mode: Begin by selecting a Mode suitable for your track. Each mode automatically configures the processing type for each frequency band.
  Adjust the Heat Knob: Control the intensity of the overall effect with the Heat Knob. This adjusts the saturation across all bands equally.
  Fine-Tune with the Character Panel: Use the Tone controls to adjust the distortion’s character, experiment with Pre / Post. The Thump switch adds low-end presence, and the Low/High Cut knobs help shape the frequency response. The Steep switch enables a steep low pass filter for more aggressive frequency shaving. Use Auto-Gain to avoid being influenced by the illusion of “louder is better”.
  Multiband & Analyzer Section
  Band Adjustment: Each band can be adjusted in volume to balance the mix. Increase the volume to emphasize a band, or reduce it to blend the effect.
  Add additional Heat to Bands: Click and drag anywhere within the band to apply additional processing within each band to intensify the effect specific to the frequency range.
  Solo, Mute, and Bypass: Isolate bands using Solo, remove them from the mix with Mute, or disengage the heat processing while maintaining the volume balance with the Bypass control.
  Mixing with JST Heat
  Start with Subtlety: Apply JST Heat sparingly at first. Gradually increase the Heat Knob until you achieve the desired level of saturation and process effect.
  Band Processing: Remember, each band has a distinct processing role based on the mode, and they’re not always the same from mode to mode. For example, low-band compression, mid-band distortion plus EQ, and high-band light saturation.
  Mode Exploration: Cycle through different modes to find the best starting point for your track. Each mode offers a unique combination of band processing. You can lock Auto-Gain to maintain its setting state as presets are changed as well as link or relative-link Input and Output for perfect gain staging.
  Tonal Balance: Use the Tone Button to switch between pre or post-distortion tone shaping. Adjust the Tone Knob to find the perfect balance between dark and bright.
  Frequency Shaping: Employ the Low Cut and High Cut knobs to remove unwanted frequencies or to focus the effect. The Steep switch is there for more aggressive cuts.
  Mix and Output: Blend the processed signal with the original using the Mix controls. Adjust the Output knob to match the level of bypassed signal.
  Saving and Managing Presets
  Explore Factory & Artist Presets: Broken down by category and/or use-case, these pre-made presets can be really helpful for quick results and exploring the plugin.
  Create Custom Presets: Save your finely tuned settings as new presets for future sessions, ensuring quick recall of your signature sounds.
  Share & Download User Presets: Check online for other users’ presets in the Joey Sturgis Tones forum on Facebook!
  Final Touches
  Automation: Bring life to your mix by automating the Heat Knob and Mix controls, creating movement and excitement within the track.
  A/B Testing: Regularly bypass the JST Heat processing to ensure it’s enhancing and not overpowering the original signal. You can also temporarily store your settings in A | B modes to compare similar settings quickly.
