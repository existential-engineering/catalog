description: "An advanced bitcrushing plugin with extensive timbral and
  modulation features for creating distinctive bitcrushed tones. Excels at
  providing stereo modulation capabilities across all parameters with flexible
  sound design options."
details: |-
  Bitcrushing with drive stage, bit depth, and sample rate reduction. Wavecrushing (wavesets-based distortion). Ring Modulation/Frequency Shifting (switchable). Additive Modulation (additive synthesis-based). Pre/Post-FX Filtering (LP, HP, Bandpass, Comb). 3 LFOs (stereo, 6 waveforms, host-syncable). 2 Step Sequencers (16 steps, 6 directions, stereo mode). 1 Envelope Follower (stereo). 3 Macros with drag-and-drop support. Dark and light themes. Multi-language support.
specs: |-
  Version 1.1.4. Demo available with audio fade-out.
