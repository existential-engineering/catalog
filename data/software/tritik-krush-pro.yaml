description: KrushPro is the advanced version of the free bitcrusher Krush, with extensive timbral and modulation features for creating distinctive bitcrushed tones.
details: |-
  KrushPro takes the bitcrusher Krush to the next level. It adds multiple modulation options, including LFOs, step sequencers, and an envelope follower, for more creative control over your sound.

  A standout feature of KrushPro is its pioneering full stereo modulation capabilities, where every modulator operates in stereo. This is complemented by a stereo balance knob for each modulation slot, facilitating cutting-edge modulation techniques across the stereo field for every parameter.

  In addition to the bit-crushing processor, KrushPro includes a new 'Wavecrushing' distortion module built on an innovative wavesets processing algorithm, introducing a variety of new tonal qualities. The plugin also features a dual frequency shifter/ring modulator FX module and two input/output filter sections for additional sound design flexibility.

  KrushPro is designed for those looking beyond traditional bitcrushing, giving you all the tools to craft distinctive bitcrushed tones.

  The demo is fully functional, but the audio fades out occasionally. You can unlock the full version by purchasing a license.
specs: |-
  - Bitcrushing module with crunchy drive stage, bit depth and sample rate reduction
  - Wavecrushing distortion module built on a wavesets processing algorithm
  - Dual frequency shifter / ring modulator FX module
  - Additive modulation: modulating signals built via additive synthesis
  - All modulators are stereo, with per-slot stereo balance knob
  - Modulation routing via colour-coded menus and drag-and-drop
  - 3 LFOs: stereo output, 6 waveforms, host-syncable, extended frequency range
  - 2 step sequencers: 16 steps, 6 direction options, stereo mode, per-step bypass, host-syncable
  - 1 stereo envelope follower driven by the input signal
  - 3 macros with drag-and-drop support and stereo output
  - Pre and post-FX filtering stages
  - 4 filter types including bandpass and comb, plus improved LP and HP responses
  - Scalable high resolution interface
  - Dark and light UI themes
  - Tooltips and preferences in English, French, Portuguese and Spanish
  - File based preset system with menu or browser access
  - Presets 'freezer' for safe recall
