description: Stark is a fully-fledged guitar/bass/instrument rig for all your
  tone-shaping needs, with 12 amplifier models, 10 speaker cabinets, six room
  types, built-in noise reduction and a four-slot pedal board with 17 FX pedals.
details: |-
  Stark is a fully-fledged guitar/bass/instrument rig for all your tone-shaping needs. It has a unique and flexible amplifier simulation with 12 different amp models, an award-winning unique built-in noise reduction, 10 different speaker cabinets, six room types, and a pedal board with four slots and 17 different FX pedals to choose from. The modules are processing audio separately (and optionally), which makes it possible to combine different amplifiers with different cabinets and rooms.

  What separates Stark from other amp simulators is that the Cab, Amp and Ambience modules are built on Klevgrand's very own algorithms that doesn't involve any convolution or FFT analysis. This approach renders a more natural response to dynamics over the whole frequency spectrum, plus the ability to fine-tune each profile in ways that just isn't possible when using convolving methods.

  From version 1.2, a special version of Brusfri, Klevgrand's highly advanced audio noise reducer, is now an integrated part of Stark. When only the noise is playing, a simple push on the ear is all you need, once the noise is "learned", Brusfri will instantly reduce your background noise.

  The 17 different effects lets you shape your tone into whatever you like, from clean and slightly saturated tones, to more dreamy soundscapes, djent:y thunders and playful escapades.

  Included is also a large collection of presets, covering many different genres and styles. To quickly get started, explore the "Song starter" category and just start playing.
specs: |-
  - 12 high-quality amp models, with both clean and overdrive channel
  - 10 amp cabinets of various sizes and sound
  - Noise reduction from award-winning plugin Brusfri included (v1.2)
  - Six room types, each with three different sizes and variable decay time
  - FX board with four slots
  - 17 different FX pedals available (distortion/overdrive, modulation, EQ, dynamics, delay, reverb etc.)
  - Three new FX pedals: Spinner (rotary effect), Envelope Filter and a brand new Reverb (v1.2)
  - Plenty of factory presets covering most genres and styles
  - 30 brand-new "Song starter" presets featuring the new FX pedals (v1.2)
  - Ultra low latency
  - Bypass switch for the Amp and Cab sections (v1.2)
  - Amplifier module with clean and overdrive modes, equalizer including presence, and a booster controlling end stage amplification saturation
  - Cabinet module with a stereo width knob simulating the distance between two microphones in front of the cone
  - Room module with six room kinds in Small, Medium and Large sizes, a decay parameter and a dry/wet mix
  - Pedal order can be changed using drag and drop
  - Requires macOS 10.10 or later (optimized for the M1 processor), Windows 7 (SP1) or later, running an AU, VST or AAX compatible 64-bit host
  - iPad version available as AUv3 and standalone
