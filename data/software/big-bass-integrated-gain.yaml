details: |-
  Big, short for bass integrated gain, is a highly tweakable bass amp and
  effects suite. Big comes with a built in noise gate, AcmeBarGig's granite
  compressor, and a preset manager with web interaction for sharing presets.

  Big also comes with acmebargig's proprietary cabinet shaper technology, which
  is capable of emulating virtually any cabinet. Just like dig, big also
  contains "gut" technology.

  Gut technology allows you to go into the inner workings of the amp itself and
  change its primary functionality. Crossovers and filters can be adjusted to
  dramatically change the way the amp functions.

  Twin 12ax7 preamp tubes, individually bypass-able for an infinite range of
  bass tones. Tweakable tonestack eq for precision sculpting your tone. 2
  tweakable crossovers and 2 filters for emulating your favorite amps.

  Whisper: clean amp with powerful eq section, with a wide range of tones.
  Phoenix compressor, acmebargig's solution for perfect dynamics. Noise gate, so
  that your playing isn't mixed with noise, even when cranked up to full volume.
  Cabinet shaper for getting the perfect cabinet tone.
specs: |-
  - Noise gate
  - Granite compressor
  - Cabinet shaper
  - Gut technology
  - Twin 12ax7 preamp tubes
  - Tweakable tonestack EQ
