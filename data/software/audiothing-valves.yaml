description: Valves is a vintage valve emulation plugin (VST, VST3, AU, AAX)
  with multimode resonant filter and cabinet/EQ section.
details: |-
  Valves is a vintage valve emulation plugin with multimode resonant filter and cabinet/EQ section. The valve section is modelled after classic vintage tubes, with added grit and custom gain control.

  The filter section is modelled after a classic ladder filter (2-pole or 4-pole) with low pass, high pass, bandpass and notch modes. The state variable filter can be used pre or post valve.

  The cabinet/EQ section features a selection of modelled cabinets with classic bass and treble EQ controls, letting you emulate several types of guitar amplifiers and further shape the overdrive sound.

  With up to 16x oversampling, Valves can be used to add authentic tube character to your tracks. It ships with 35 presets, a resizable window, a preset system with randomizer, and brightness and contrast controls.

  Valves is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP). It is also available on the App Store for iOS and iPadOS (AUv3 and Standalone).
specs: |-
  - Tube Overdrive
  - 8 cabinets with Bass and Treble EQ
  - State Variable Filter: LP, HP, BP, and Notch (2 or 4-pole)
  - 16x Oversample
  - 35 Presets
  - Resizable Window
  - Preset system with randomizer
  - Brightness and Contrast Controls
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP 64-bit)
  - macOS 10.13 - macOS 26, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP 64-bit)
  - 1 license up to 3 computers, no iLok, no internet connection required to activate
