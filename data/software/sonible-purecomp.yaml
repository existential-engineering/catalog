description: pure:comp is an AI powered compressor plug-in that allows you to
  instantly control a track's dynamics.
details: |-
  pure:comp is a straightforward compression plug-in that can instantly control a track's dynamics. It is straightforward compression for pro-level sound, with maximum precision and transparency.

  AI-powered algorithms at your service: pure:comp simplifies the process of applying compression to any instrument or voice track. With its intelligent algorithms, unique learning-feature and input specific profiles, you can rely on pure:comp to deliver professional signal shaping without any artifacts or overcooking. With this tool in your arsenal, expect to spend much more time focusing on the creative aspects instead of tweaking interdependent compression parameters.

  Create, compress, conquer: use pure:comp to make 808s punchy, get rid of muddiness in a kick or transform a drum track from weak to powerful in no time, shaping the dynamics of your track without any hassle. The compressor's visualization will let you know exactly how the plug-in is enhancing your input signal. You can modify the compression of the AI-powered processing by simply using the single compression parameter, a control that combines all the general compression parameters such as threshold, ratio, attack and release.

  Style and clarity, nail your sound by fine-tuning: pure:comp comes with two very effective sound-shaping options, Style and Clarity. Toggle through the clean, mixed and dirty styles to decide what kind of compression character you want to dial in. Clarity has got you covered whenever you want to increase the transparency of your track. The Clarity control dials in spectral compression, making sure that tonal imbalances are dynamically smoothened out.
