details: |-
  Psytrance music is characterized by exciting and elaborate intros, outros,
  intermezzos, breakouts. The plugin is designed to provide interesting thematic
  voices and vocals for these passages, offering ai-generated sounds that are
  different from traditional vocal samples.

  The ai voices instrument is full of robotic, synthetic psytrance themed
  psychedelic voices and slogans. The sounds are created by artificial
  intelligence, then resampled and resynthesized with various futuristic sound
  design methods. They sound excellent in a wide range of octaves.

  You will find every voice in different sound variations from classic ais, to
  robotic, mystical, crystal-glass-sounding ethereal beings, matrix entities and
  witches, created deep in the mind of artificial intelligence. These notes can
  be used in intros/interludes as well as together with beats.

  Very well usable in genres such as: psytrance, hitech, darkpsy, full-on
  psytrance, progressive, darkprog, tech trance, psycore, experimental,
  neurofunk, psybient, but also techno, minimal and others.
specs: |-
  - 31 high quality multi-octave instruments
  - Class a audio interpolation/resampling
  - LFO modulation with depth and rate knobs
  - Triangle, sinus, square, saw, and exp shape waveforms
  - Glide knob
  - Space knob
  - Polyphonic mode
  - Mono mode
  - Legato mode
  - Amplitude envelope with attack, decay, sustain, release knobs
  - Resampling quality selector
  - Velocity curve selector
  - Pitch bend knob
  - Pan knob
  - External bonus instrument loading capability
  - Multi sample hard drive disk-streaming
  - Memory reading mode
  - High quality resampling/interpolation engine
  - Universal 2 binary
