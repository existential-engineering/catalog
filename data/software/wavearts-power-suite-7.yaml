description: "Comprehensive bundle of five plug-ins covering essential aspects
  of sound design: TrackPlug (channel strip), MasterVerb (reverb), FinalPlug
  (peak limiter and loudness compliance), MultiDynamics (multi-band dynamics),
  and Panorama (3D binaural processor)."
details: |-
  Includes TrackPlug 7, MasterVerb 7, FinalPlug 7, MultiDynamics 7, and Panorama 7. Native Apple Silicon support. Scalable user interfaces with high DPI support. Optional information tips display. A/B edit buffers and infinite undo. Serial number or iLok licensing. Built-in preset management.
specs: |-
  Mac: AU, VST3, AAX. macOS 10.13+, Apple Silicon native, 64-bit only. Windows: VST2, VST3, AAX. Windows 7/8/10/11, 64-bit only. iLok supported but not required.
