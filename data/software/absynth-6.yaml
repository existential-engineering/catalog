details: >-
  Absynth 6 is a semi-modular synthesizer developed by native instruments in
  collaboration with original creator brian clevinger. It features a hybrid
  sound engine that integrates subtractive, fm, wavetable, granular, and
  sampling synthesis architectures. Designed for complex sound design and
  scoring, the instrument utilizes a flexible topology allowing users to route
  audio through three independent oscillator channels, supported by a distinct
  68-point envelope generator for intricate, evolving modulation.


  This iteration modernizes the platform with full mpe and polyphonic aftertouch
  support, enabling per-note expression for compatible controllers. The audio
  engine has been updated to support true multichannel surround spatialization
  and mts-esp for global microtuning.


  Workflow improvements include the new ai-powered preset explorer, which
  organizes the library into a visual map based on timbral analysis rather than
  traditional lists, and "the mutator" for intelligent randomization and
  variation of patch parameters.


  The options for sound sculpting are endless, starting right with the
  oscillators - load a standard oscillator, draw one, create it by fractalizing
  a primitive shape, lowpass filter it if it's sounding too trebly, morph
  between osc shapes, ring mod or fm them, select individual partials in the
  overtone series, load a sample and granulize it - and this is before coming to
  any of the filters or waveshapers or effects.


  One of the most exciting and criminally under-explored features is the tuning
  tab, where you can create and load tuning files - everything from exotic world
  scales to alternate tunings from early and modern classical, or create your
  own from scratch. There are other synths that let you load scala .scl and .tun
  files, but not many that let you create your own custom tuning right in the
  plugin.
