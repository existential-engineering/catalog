details: |-
  The stunning sound of a world-class Clarinets a2 section - captured at Abbey Road Studios. This virtual instrument offers key articulations and playing styles: lyrical and performance legatos, a wide selection of longs and shorts, and control over a variety of articulations allowing you to create both intimate and epic soundscapes.

  Recorded in the timeless acoustics of Abbey Road Studio One, this library includes two hand-crafted mix signals by GRAMMY award winner Simon Rhodes.

  Realism at the highest degree.

  Do you already own an Abbey Road Orchestra Library? Log in to see your individual up-/crossgrade offer.

  For the ultimate virtual orchestra, combine Clarinets with Abbey Road Orchestra: Flutes Core as well as Low , High & Metal percussion.

  Are you after the pinnacle in expression for your compositions? Want extended articulations and complete sonic control with custom mic mixes? Check out Professional .
specs: |-
  - Clarinets a2 section recorded in Abbey Road Studio One
  - 2 legato techniques: Performance Legato, Lyrical Legato
  - Long techniques: Long, Long SFZ, Long Flutter, Trills (major 2nds, minor 2nds, minor 3rds)
  - Short techniques: Staccato, Staccato ALT, Staccatissimo, Marcato, Tenuto
  - 1 signal option: Mix 1 by Simon Rhodes
  - 3.0 GB download size
  - macOS 11 to OS 26, Apple Silicon supported
  - Windows 10 or 11 (64-bit)
  - Minimum 8GB RAM, 16GB recommended
  - SSD for installs advised, 32-bit DAWs not supported
  - Spitfire Audio App required for installation
