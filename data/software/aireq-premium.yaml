details: |-
  Aireq was designed with a vision of achieving musical, technical and sonic
  excellence. Simple, intuitive and quick to use, aireq is a musical equalizer
  plugin at its best. The water and fire curves, as the character and strength
  parameters were adjusted by ear, so mixing engineers can focus on one thing -
  making music sound great.

  Five fully parametric eq bands with 18db of gain. Shelving filters are
  switchable on first and fifth bands. Steep bell curve for surgical adjustments
  available on all five bands. Fully parametric high and low pass filters with 6
  / 12 / 18 / 24 / 36 slopes.

  Band bypass switches for all bands. Character curves for unprecedented control
  over resonances; globally or per-band. Strength is an advanced dry/wet control
  that allows for parallel processing; globally or per-band. Earth for easy
  adjustment of low frequencies. Air for easy adjustment of high frequencies.

  Input and output gains 18db. Frequency analyzer with realtime and average
  analysis displays. Frequency analyzer can be hidden for "ears only" mode. Rms
  and peak input and output metering configurable to display dbfs, rms
  difference, and k-system. Polarity reverse switch.

  Unlimited undo and redo steps. Frequency finder and band solo tools for
  finding problematic frequencies or listening to a band in isolation. Gain and
  q knobs can be adjusted continuously or stepped. Rename bands to make your own
  presets. A / b snapshot slots for comparing two eq settings. Momentary toggle
  key command for all buttons. Mono, stereo, and 5.1 channel configurations.
  Mid-side and left / right processing modes. Bands can be assigned to process
  only one channel.
