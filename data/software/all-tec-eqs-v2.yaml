details: |-
  The all-tec eqs plug-in is a faithful emulation of the legendary altec passive
  analog equalizers range from the 50's. The hardware has been heard on
  countless records and are still being used today.

  The all-tec eqs v2 plug-in adds an adjustable analog circuit module that
  replicates the complex behavior of analog tubes and transformers. It generates
  a pleasant analog saturation effect, to any sound you feed into it.

  V2 features a completely rewritten dsp engine, a brand new resizable ui with
  two skins, a new 9067 filter module, along with many other improvements. The
  all-tec eqs include 3 equalization modules modeled after altec hardware in a
  single plug-in. Each module can be individually disabled or used
  simultaneously for full range equalization.

  The 9067 filter is a vintage filter module made of two high quality 18
  db/octave high-pass and lowpass filters. Each band provides 10 frequency
  options or can be individually disabled. The 9063 equalizer is a vintage
  equalizer for low and high frequencies equalization. It consists of 2 bands
  that can be individually boosted or attenuated. The 9062/73 graphics equalizer
  is a vintage equalizer which consists of 7 bands that can be individually
  boosted or attenuated up to 8 db. The band frequencies can be switched between
  9062 and 9073 models.

  The pre-2c is the master section of the entire eq chain. Use it to adjust the
  input and output levels, the amount of analog character and the dry/wet mixing
  ratio.
