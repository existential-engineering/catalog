description: Acon Digital DeVerberate is plug-in that can attenuate or boost the reverberation that is already present in recorded material. DeVerberate is available for PC and Macintosh and supports the VST, VST3, AAX and AU plug-in formats. Both 32 bit and 64 bit versions are available.
details: |-
  DeVerberate 3 uses deep learning to automatically remove unwanted reverb from dialogue recordings, no manual tuning required. Trained on thousands of high-quality voice recordings across a wide range of acoustic spaces, its AI separates dialogue from reverb with remarkable precision, rescuing recordings with excessive room sound and eliminating the need for costly reshoots or ADR.

  For music and other sources, DeVerberate 3 retains the proven algorithm from version 2, splitting audio into direct and reverberated components that can be freely recombined. A unique Early Reflections Filter adds a further layer of control, using sophisticated statistical modeling to estimate and cancel out early reflections for cleaner, more precise results.

  Fully automatic reverb reduction, driven by deep learning, analyzes your dialogue and removes unwanted room sound instantly, no manual settings to dial in. Just drop it on your track and let the AI do the work, turning boomy, reverberant recordings into clean, broadcast-ready dialogue in seconds.

  For material outside dialogue, take direct control over the reverb itself. Adjust the level and decay time of the original reverberation to shape the sound exactly how you want it, whether you're taming a boomy room or sculpting a mix with precision.

  Early reflections are often the hardest part of a room's sound to remove, and the most noticeable when they're not. This filter uses sophisticated statistical modeling to isolate and cancel them out, delivering a cleaner, more natural result that works alongside either reverb reduction mode.
specs: |-
  - Fully automatic dialogue reverb reduction based on deep learning
  - Manual mode for music and other signal types with adjustments of the original reverberation's level and decay times
  - Separate adjustments of the direct sound and the reverberation levels
  - Early reflections filter
  - Frequency spectrum representation of the input signal, output signal and estimated reverberation
  - Frequency emphasis filter for the reduction level
  - High and low shelving filters with variable slopes (-3 to -96 dB / octave)
  - High and low peak filters with adjustable bandwidth (0.1 to 3.0 octaves)
  - Graphical representation of frequency response with editing through handles in the curve
  - EUCON and full Pro Tools HW controller support
  - Native 32 bit and 64 bit versions are available
  - Mac version runs natively on ARM64 and Intel
  - Supports sampling rates up to 96 kHz
  - Windows 10 / 11, Intel Core i3 or AMD multi-core processor (Intel Core i5 or faster recommended)
  - macOS / OS X 10.13 or later
  - 1 GB RAM (4 GB or more recommended), 1 GB free HD space
  - 1366 x 768 display resolution (1920 x 1080 or higher recommended)
  - Requires a host compatible with VST, VST3, AU or AAX (Pro Tools 2018 or later)
