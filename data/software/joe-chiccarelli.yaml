description: Capturing the signature sound of multi-award-winning engineer and
  producer Joe Chiccarelli.
details: |-
  The Joe Chiccarelli signature plugin was developed with producer/engineer Joe Chiccarelli. After going through the process successfully with the late Al Schmitt, Leapwing Audio found a new challenge, as Joe uses much more processing to get his signature sound. The team researched and analyzed even more pieces of gear, from EQs, pre-amps to compressors, distortion units, reverbs, and several other effects, then used the outcomes to create distinctive features that define his unique sound.

  The plugin has 11 distinct profiles: kick, snare, toms, drum overhead, drum room, bass DI, bass amp, acoustic guitar, electric guitar, electric piano, and lead vocal. Each profile has a set of parameters controlling drive, EQs, compression, parallel compression, and effects. Distilled to the right amount of control, conceived to get your sound instantly.

  Joe Chiccarelli is a ten-time Grammy and Latin Grammy Award-winning producer/engineer/mixer whose credits include Tori Amos, Beck, U2, The Strokes, The Killers, Elton John, The Shins, The White Stripes, Morrissey, Alanis Morrisette, Jason Mraz, Juanes, The Raconteurs, and My Morning Jacket.

  It looks good and it sounds good. The algorithm makes it easy to get a good sound and the simple interface lets you visualise the adjustments you make as you hear them.
specs: |-
  - 11 unique profiles: kick, snare, toms, drum overhead, drum room, bass DI, bass amp, acoustic guitar, electric guitar, electric piano, and lead vocal
  - Drive, EQ, compression, parallel compression, and effects controls per profile
  - Beautiful Retina design with most common controls on one screen
  - Mac OSX 10.13+ (M1-Native compatible)
  - Windows 8, 10 (64-bit only)
