description: Monarch of electronic organs, the rich sounding b3 has been a
  staple of jazz, gospel, rock, reggae and r&b—not to mention pro studios.
details: |-
  Monarch of electronic organs, the rich sounding b3 has been a staple of jazz,
  gospel, rock, reggae and r&b—not to mention pro studios everywhere—for over a
  half century. Its electromagnetic tonewheel design gave it a beefy quality not
  found on later transistor organs. Our faithful homage includes an authentic
  rotary speaker and an array of stomp boxes, plus inspiring updates like analog
  circuit mods and drawbar modulation for new animated and syncopated effects.

  Where most other attempts are based on samples that only capture some of the
  qualities, we created the b-3v using the same critically acclaimed modeling
  technology that distinguishes our entire v collection of classic instruments.
  We put that same attention to detail into the included rotary speaker as well.

  The b-3 v improves on a classic, with everything you need in an organ rig and
  more built right in. Rotary speakers have become an essential part of the
  tonewheel organ sound, so we've naturally included one. We've added lots of
  other options including multiple reverbs, an array of effects pedals, and even
  the ability to modify previously fixed analog circuit features like key click.

  Our most radical enhancement is the addition of a modulation section to
  automate the movement of drawbars using envelopes, lfos and step sequencers,
  letting you infuse your music with new animated textures. With its combination
  of faithful realism and new mods, the b-3 v has you covered whether you're
  playing standards, rocking classics or pioneering new musical ground.
specs: |-
  - Physical modeling engine (no samples)
  - Dual manual interface
  - 9 drawbars per manual
  - 3 modeled chorus and vibrato settings
  - Separate upper and lower on/off
  - Preamp drive
  - Modeled rotary speaker emulator
  - Advanced controls for adjusting the model
  - Convolution based reverb
  - Traditional leslie performance controls
  - Swell pedal
  - Percussion controls
  - On/off
  - Volume soft/normal
  - Slow/fast decay
  - Harmonic selection
  - Output effects
  - Volume
  - Wah
  - Auto-wah
  - Flanger
  - Compressor
  - Chorus
  - Analog delay
  - Advanced drawbar modulators
  - LFO's with multiple waveforms and phase
  - Multipoint envelopes
  - Step sequencer
  - Drawbar destinations with positive and negative amount controls
  - Physical model engine parameters
  - Drawbar leakage
  - Tonewheel leakage
  - Brilliance
  - Background noise
  - Polyphonic percussion
  - Key click volume
  - Attack and release controls
  - 86 factory presets
  - Easy to use MIDI mapping
