description: Art Vista Back Beat Bass is an upright bass sampled instrument for
  acoustic and semi-acoustic genres from jazz to rockabilly.
details: |-
  The instrument includes intuitive "intelligent" playback features that are
  designed to automatically emulate the playback of a real bass player when
  played from a MIDI keyboard. Neck position is automatically chosen depending
  on the user's playing style. Bow legato and bow changes are automatic. Up and
  down slides are chosen depending on melody direction, and there is an
  automatic rockabilly/jazz slap function.

  Art vista back beat bass can be switched from fully automatic intelligent
  playback to complete, or, partial key-switch control.

  The instrument comes in kontakt 5 player format, which supports all major
  plug-in formats and also allows use as a stand-alone application.
specs: |-
  - Upright bass sampled instrument
  - Plucked and arco playing styles
  - Steel and gut strings
  - Intelligent playback features
  - Automatic neck position selection
  - Automatic bow legato and bow changes
  - Automatic up and down slides
  - Automatic rockabilly/jazz slap function
  - Key-switch control
  - Kontakt 5 player format
  - macOS support
  - Windows support
