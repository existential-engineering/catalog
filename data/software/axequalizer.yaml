description: The aXEqualizer by SSA Plugins is an 8-band EQ designed for
  efficient processing of ambisonic signals.
details: |-
  Any processing applied to ambisonic signals has to be handled carefully to
  ensure that the spatial balance of the sound scene is not disturbed. The
  axequalizer is an eq specifically designed to let you sculpt the tone of your
  ambisonic signals without harming delicate spatial balance.

  The axequalizer has the following features and parameters for adjusting the
  frequency balance of your ambisonic signals: 8-bands each with independent
  control of: gain - the amount of boost or cut applied to the signal. Frequency
  - the frequency of the filter for the selected band. Q-factor - controls the
  roll off steepness, shape or width of filters. Filter type - select filter
  type from high shelf, low shelf, peak, notch, high pass, and low pass. Bypass
  - bypass the band. Gain - a gain applied to the output signal.

  The axequalizer is available with 3 levels of spatial resolution, with
  different maximum ambisonic orders: a1equalizer - ambisonics equalizer for
  first-order ambisonic signals. A3equalizer - ambisonics equalizer for
  third-order ambisonic signals. A7equalizer- ambisonics equalizer for
  seventh-order ambisonic signals.
specs: |-
  - 8-band EQ
  - Ambix (sn3d/acn) format ambisonics input
  - Ambix (sn3d/acn) format ambisonics output
  - Independent gain control per band
  - Independent frequency control per band
  - Independent q-factor control per band
  - Filter types: high shelf, low shelf, peak, notch, high pass, low pass
  - Band bypass
  - Output gain
  - Universal 2 binary
  - A1equalizer - first-order ambisonic signals
  - A3equalizer - third-order ambisonic signals
  - A7equalizer - seventh-order ambisonic signals
