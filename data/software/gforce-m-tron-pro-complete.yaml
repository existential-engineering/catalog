description: The largest, most comprehensive and authentic digital collection of
  curated Mellotron/Chamberlin sounds. Includes M-Tron Pro IV instrument plus 15
  expansion packs totaling 13.4GB with 560+ tape banks and 3840+ presets. Covers
  Mellotron, Chamberlin, Optigan, and Orchestron sounds.
details: |-
  M-Tron Pro Complete bundle includes the M-Tron Pro IV instrument with an additional 16 Expansion Packs (10 x Streetly Tapes, OrchesTron, ChamberTron, OptiTron, and Alex Ball, Hainbach and Sound Dust – Artist Expansion) and Lament by Venus Theory, making it the largest, most comprehensive and authentic digital collection of carefully curated Tron sounds in the market and an infinite sound of inspiration.

  The Expansion Packs include original sounds from the Chamberlin, the Optigan, the Orchestron and some of the rarest Mellotron sounds ever recorded. The Streetly Expansion Packs come from the original master tapes that have been painstakingly recorded note by note, carefully curated then meticulously edited to fit in your next composition. Streetly Electronics has direct lineage to those early 1960s instruments guaranteeing authenticity.

  Together with the Expansion Packs, M-Tron Pro Complete provides the huge aforementioned sound library with hundreds of presets from 'Tron aficionados including: David Hentschel (Genesis & Elton John), Steve Hackett (Genesis), Dean & Jarrod (I Monster), Jem Godfrey (Frost), Dave Spiers and Tony Durkin, Nick Magnus (Steve Hackett), Matt Berry (musician, actor, writer, comedian), Paul Godfrey (Morcheeba) and Pendle Poucher (Sound Dust).

  From the flutes on the legendary introduction to The Beatles' "Strawberry Fields Forever" to tracks from The Moody Blues, David Bowie, and The Rolling Stones to the modern sounds of The Flaming Lips, Nine Inch Nails, Modest Mouse, Muse, U2, Sigur Ros, and more, there's no question that the sound of the Mellotron is a deep part of music history. Now, you can experience that tape-based playback sonic experience for yourself, and with 100%-digital convenience, with M-Tron Pro IV.
