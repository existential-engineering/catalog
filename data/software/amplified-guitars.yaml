details: |-
  Auditory Lab's Amplified Guitars features three different types of electric
  guitars: stratocaster, telecaster and les paul. It has three instrument
  channels and each guitar is given its own controls with pan and volume.

  The main panel features 4 master knobs that controls release, attack, pan and
  volume.

  The effects panel features a full multi-effects rack, with reverb, delay,
  rotary, compressor, eq and phaser including 16 specially designed custom fx
  presets.

  This library will give you realistic and high quality samples and it's perfect
  for rock, pop, blues, r&b, and more.
specs: |-
  - Three electric guitar types: stratocaster, telecaster, les paul
  - Three instrument channels
  - Individual guitar controls with pan and volume
  - 4 master knobs: release, attack, pan, volume
  - Multi-effects rack
  - Reverb effect
  - Delay effect
  - Rotary effect
  - Compressor effect
  - EQ effect
  - Phaser effect
  - 16 custom FX presets
  - Realistic high quality samples
