description: Axe-Edit is an application for Mac or Windows that allows you to
  create, view, edit and manage presets for the Axe-Fx II.
details: |-
  Tap the full creative potential of the Axe-Fx II with Axe-Edit, an application for Mac or Windows that allows you to create, view, edit and manage presets. Axe-Edit is reliable and easy-to-use.

  The large intuitive interface shows the entire grid at once and speeds productivity with the ability to edit using mouse and keyboard. Create complex layouts with ease, edit scenes, copy and paste blocks, and much more. Manage presets and user cabs in your hardware with ease.

  It requires the Axe-Fx II, and you can create or edit sounds right on the unit, editing every sound parameter including modifiers. Import and Export files to share with others, Copy and Paste effect blocks between presets, and save snapshots (undo points) while you edit.

  An on-screen tuner and tempo display, on-screen modifier graphs and filter curves, and modifiers showing controller values in real time round out the feature set.

  Version 3.15.0 is dated July 15, 2026. The Mac build is Universal and requires MacOS version 10.13 or newer; the Windows build runs on Win 10, 8.x, 7.x, Vista (x86 or x64) or XP. Both require Axe-Fx II firmware version Quantum 5.0 or newer and the separate Axe-Fx II Driver.
