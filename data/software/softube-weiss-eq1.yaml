description: An EQ plugin that crystallizes the legacy of the Weiss EQ1 hardware
  unit, considered the must-have digital mastering equalizer. This equalizer
  plugin is a line-by-line code port boasting 1:1 accuracy of the pioneering
  original hardware.
details: |-
  There's a reason Weiss Engineering's EQ1 has been at the top of the heap since its release in 1996. The EQ1's dazzling sonic qualities combined with its flexibility as either a Minimum Phase EQ, a Linear Phase EQ, or a Dynamic EQ have made it the must-have digital mastering equalizer. The Weiss EQ1 plug-in crystallizes that legacy, in software form.

  Weiss Engineering's go-to hardware and Softube's workflow and ergonomic advancements combine here to stunning effect. A one-for-one, line-by-line code port of the original, the EQ1 plug-in is the latest and greatest addition to Softube's successful partnership with Weiss Engineering. EQ1 joins DS1-MK3, MM-1, and more out-of-this-world Weiss + Softube products to prove that Swiss and Swedish engineering make a stellar pair.

  Doppelganger: The EQ1 plug-in is a true line-by-line port of the original SHARC assembler code. It's an accurate replica that functions just like the original, but with added features that take it higher.

  Colossal Heights: The Weiss EQ1 is the mammoth of equalizers, but Softube felt compelled to go further. Softube and Weiss gave the EQ1 plug-in a higher sample rate, improved ergonomics, and increased functionality. Picture Perfect: The EQ1 plug-in lets you easily recall Presets (or Snapshots in the hardware counterpart) manually and they'll sound and behave precisely as they do in the hardware.

  Softube & Weiss: Meeting of the Minds. Weiss has been a pioneer in digital audio equipment design since 1979. That's when Weiss founder, Daniel Weiss, joined Willi Studer AG in Switzerland as an engineer. In 1985, Weiss struck out on his own and founded Weiss Engineering with a focus on pioneering digital audio equipment for mastering studios. Softube's relationship with Weiss started in 2008 with a first introduction to Daniel Weiss. Despite having so many guiding principles in common, it wasn't until 2015 that the two companies got serious about working together.
specs: |-
  - A line-by-line code port of the original Weiss EQ1, the standard-bearer of digital mastering EQs and a must-have for mastering houses worldwide
  - A surgical Minimum Phase EQ, a true Linear Phase EQ, and a Dynamic EQ, all in one
  - Threshold, Attack, Release and Ratio parameters available on individual bands in Dynamic Advanced Mode
  - All seven bands available in Dynamic Mode
  - Workflow and ergonomic advancements with four adaptable user interfaces
  - Created in collaboration with, and endorsed by, Weiss Engineering
  - Two plug-ins included: Weiss EQ1 and Weiss EQ MP
  - Increased functionality of the original algorithms, plus 32-bit / 192 kHz operation and updated ergonomics
  - Easy manual recall of Presets that sound and behave exactly like they do in the hardware
  - Console 1 Ready: this plug-in can be used within Console 1, Softube's mixing system
  - Supports Softube Extended Features
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26; Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access for downloading installers and managing licenses
  - Three activations included
