details: |-
  Beat Replacer is a free VST plug-in designed to "translate" any source track's
  beat into a custom MIDI note or a drum sound via an integrated sf2 compatible
  synth.

  It can use any MIDI port on your system as a destination too.

  Similar to drumagog's philosophy, it's not really intended to replace mixed
  drum kit performances, you need a multitrack independent drum recording to
  use, for example, a snare or bassdrum isolated track as a trigger sound to "on
  the fly" get another clean and already mastered percussion sound or sample.
specs: |-
  - Sf2 compatible synth
  - MIDI note output
  - Drum sound synthesis
  - MIDI port destination support
