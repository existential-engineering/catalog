description: >-
  Go beyond typical distortion with Thermal, a cutting edge interactive
  distortion plugin. Easily experiment and dial in new sounds.
details: |-
  Thermal makes it easy to experiment and dial in new distortion sounds. A user-friendly experience is key to controlling the deeply powerful, multi-stage engine.

  A circular XY Control is linked to the distortion parameters, giving you visual and tactile control over the sound. Dial in anything from subtle warmth to extreme destruction.

  With 15+ custom distortion types, 9 built-in FX, and mid-side and time-based width, Thermal goes far beyond typical distortion plugins.
specs: |-
  - 250+ presets for instant playability
  - Circular XY Control linked to distortion parameters
  - Multi-stage distortion and effects processing
  - Mid-Side and time-based width
  - 15+ custom distortion types
  - 9 built-in FX with master compressor and filter
  - Native Apple Silicon support
