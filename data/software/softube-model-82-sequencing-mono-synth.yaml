description: Model 82 synth plugin faithfully captures the raw sound of the
  most-used monophonic synthesizer of the late 80s and early 90s. Modeled in
  exquisite detail, the plugin preserves the proper interaction between sections
  and the famous sequencer and arpeggiator.
details: |-
  The raw sound of the original hardware is the stuff of dance dreams. But the unique and inspiring sequencer and arpeggiator took it from a muted debut to full techno color. Softube recreated every speck of the original circuitry, interactions, and straightforward workflow to give a plug-in with a sound, feel, and interface that stays true to the most-used mono synth of the '80s and '90s.

  The original has been called the sound of electronic music, and Model 82 Sequencing Mono Synth embodies those iconic lead, bass, and arpeggiated sounds. Every circuit and interaction is modeled in detail to preserve the proper interplay between sections and the unmistakable dry mono sound.

  The hardware put techno on a roll, and the sequencer and arpeggiator were the main reason: devotees could let go of the keyboard and focus on wielding the oscillator, filters, and other controls. The plug-in provides the same performance and experimentation opportunities optimized for the DAW. Run the sections freely based on the Internal Clock/LFO speed, or sync them to the DAW at 1/4, 1/8, 1/8T, or 1/16.

  Alongside the accurate emulation there are added modern features. The delightfully straightforward workflow is kept but the labeling and layout were adjusted so the sound you want is easier to find. A new drive knob lets you push it like they did in the heyday, and a new doubling knob enables Model 82 to hold its own in modern stereo productions while retaining its sonic essence.

  Two versions are included. Model 82 for Modular offers six fully integrated instrument sections as individual modules (ARP, VCO, LFO, VCF-VCA, FX, and ENV) that plug into a Eurorack system inside the Modular plug-in, so single components of the synthesizer can be combined in a modular workflow to build patches.
specs: |-
  - An accurate emulation of the most-used mono synth of the late '80s and early '90s
  - The dry mono sound of the original hardware, authentically captured
  - Added modern features, such as stereo doubling and drive
  - The sequencer and arpeggiator that defined techno made DAW friendly
  - Two versions included: the instrument and six modules for Modular
  - Six Modular modules: ARP, VCO, LFO, VCF-VCA, FX and ENV
  - Three original, selectable color schemes
  - An enhanced version of the original, easy-to-use layout
  - A side panel with velocity and aftertouch control of the VCF and VCA
  - Internal Clock/LFO, or DAW sync at 1/4, 1/8, 1/8T or 1/16
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Internet access required for downloading installers and managing licenses
  - Three activations included
  - 20-day trial, 14-day returns
