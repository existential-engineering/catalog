description: miniVerb recreates the classic digital echo/reverb sound, made
  famous by iconic consoles and retro computers of the 80s such as the NES,
  SNES, and Amiga.
details: |-
  miniVerb is an 8-bit/chiptune and lofi reverb effect inspired by the sound of 80s game consoles and retrocomputers.

  Early consoles didn't have much power for DSP effects, so the video game composers at that time had to improvise. The most common way to add a sense of space/reverb to the sound was to sacrifice one of the internal tracks to play a delayed version of the original sound, essentially using a slapback echo to add depth. The technique evolved and eventually consoles started to take advantage of more power for real internal effects.

  miniVerb recreates that classic digital echo/reverb sound, made famous by iconic consoles such as the NES and SNES, topping it with two filters (post/pre), vibrato, and crusher (bit crusher, downsampler, pitch shifter).

  The Echo Section can be used to simulate the tricks used in early video game consoles. For an NES-like reverb sound, use a single delay line, a very short time, no feedback, and width set to mono. To simulate a 90s fake reverb/echo like the SNES, use longer times and add some feedback to simulate a reverb tail. For a more modern approach, switch the Echo to Double Delay Line and increase the width to a wider setting.

  miniVerb is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP), and on the App Store for iPhone and iPad as an AUv3 plugin and Standalone (IAA).
specs: |-
