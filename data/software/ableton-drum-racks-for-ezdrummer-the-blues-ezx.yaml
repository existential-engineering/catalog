details: >-
  Ableton drum racks for ezdrummer the blues ezx features drum racks for all
  factory presets for the toontrack ezdrummer the blues ezx expansion. These
  racks are the most complete integration between ableton live and toontrack
  ezdrummer including a host of features ready to use on ableton push.


  New in v1.1 multiple audio channel output presets and ableton live multi out
  template designed specifically for the blues ezx preset audio routing in
  multi-channel mode.


  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all blues ezx factory presets from ableton push
  controller device browser.


  Singleout presets featuring 11 ableton drum racks for all factory presets
  single audio output to single ableton track. Mixing can be further enhanced
  through ezdrummer mixer or additional ableton audio effects to the track.
  Multiout presets featuring 11 ableton drum racks for all presets in multiple
  audio channel output from the plug in to multiple ableton audio tracks using
  the multi output ableton template also provided.


  Use the template racks and extend to your own the blues ezx presets, swapping
  out individual sounds or articulations. You are 100% ready to go with the
  factory presets but there is no limitation to creating your own presets from
  these templates.
specs: |-
  - 22 ableton drum racks
  - Color coded pad design
  - Individually labelled drum rack pads
  - Mapped ableton macros to ezdrummer macros
  - Singleout presets with 11 ableton drum racks
  - Multiout presets with 11 ableton drum racks
  - Multi-channel audio output
  - Ableton push 2 color pads mode
  - Ableton live 9.5 or above
  - Toontrack ezdrummer2 required
  - Toontrack ezdrummer the blues ezx expansion pack required
  - Ableton live clip editor automation
  - Track level audio mixing control
