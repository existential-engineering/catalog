description: BBD-Chorus is an analog-modeled software effect available in the
  library of all Antelope Audio Synergy Core interfaces. It models a classic
  bucket brigade chorus inspired by the Boss CE-1 Chorus/Vibrato pedal.
details: |-
  Bucket Brigade Chorus emulation inspired by the 1976 Boss CE-1 Chorus/Vibrato pedal, which itself adopted the Roland JC-120 Chorus Amplifier circuit

  Captures the thick organic modulation and gooey pitch-shifting vibrato that defined late-70s guitar tones used by Andy Summers, Jeff “Skunk” Baxter and John Frusciante

  Antelope measured and emulated the non-linear response of every component in the original pedal and recreated it digitally from the original schematics

  Includes the same stereo modes found on the hardware unit – Split (Dual) and Basic (Classic) – plus two additional modes unique to Antelope's design: Wide and Cross

  Two effect types selectable: Chorus and Vibrato

  Runs natively in your DAW on macOS or Windows, or in real-time on Synergy Core interfaces with near-zero latency

  Use with AFX2DAW plugin to mix with BBD-Chorus inside your DAW while running on Synergy Core hardware

  Included in the Antelope Cosmos subscription (75+ Antelope Native Plugins)
