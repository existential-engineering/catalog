description: The essence of aireq within the vmr. The air & earth modules bring
  the musicality of aireq within the slate digital virtual mix rack.
details: |-
  The air &amp; earth modules bring the musicality of aireq within the slate digital virtual mix rack. Additionally to the air and earth filters, those modules feature resonant low pass and high pass filter, with slopes from 6db to 36db/oct.

  Air is a new type of filter that helps you to restore or to add brightness to the sound, while always remaining natural. It allows to gently add high frequencies, without adding harshness or unpleasant digital artifacts. The smoothness of the air allows you to bring an instrument to the front of a mix, add a subtle brilliance to a sound or to make a vocal track breathe, simply by increasing air.

  The hicut is useful for attenuating frequencies above the cutoff frequency. Unlike many digital equalizers, the air module's hicut filter is perfectly matched to an analog filter curve. The hicut slope goes from 6db/oct to 36db/oct, allowing a broad range of uses, with a musical adjustment of the resonance.

  Earth brings deep and solid sub-lows. It can be described as an "adjustable transformer." inspired by real transformer behavior, it is now accessible with an easy, one-knob adjustment. The result is always a tight and precise bass sound, without being muddy or boomy.

  The lowcut is useful for attenuating frequencies below the cutoff frequency. With its adjustable resonance and slopes from 6db/oct to 36db/oct, it is useful in many situations, from gentle sub removal to drastic kick enhancements with the highest resonance setting.
