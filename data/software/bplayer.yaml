name: bPlayer
manufacturer: gerzonic
primaryCategory: synthesizer
url: https://www.gerzonic.net/?rub=2
description: bPlayer is a first and second order ambisonic file player (plays 4
  channel wxyz and 9 channel fmh files) with 9 output channels.
details: |-
  bPlayer is a first and second order ambisonic file player (plays 4 channel
  wxyz and 9 channel fmh files).

  9 output channels. Plays 16 and 32-bit wav-files at any sample-rate.

  Play, play looped, tracking cursor (only available when playback paused or
  stopped). Volume fader.
specs: |-
  - First and second order ambisonic file player
  - 4 channel wxyz support
  - 9 channel fmh support
  - 9 output channels
  - 16-bit wav file support
  - 32-bit wav file support
  - Any sample-rate playback
  - Play mode
  - Play looped mode
  - Tracking cursor
  - Volume fader
  - macOS support
  - Windows support
