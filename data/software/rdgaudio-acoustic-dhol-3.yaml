details: |-
  Acoustic Dhol 3 is the world's first and the most powerful and unique dhol
  drum synthesizer engine to create real indian dhol sound inside your digital
  audio workstation.

  Over 1350 samples with numerous articulations. Ai powered dynamic rr with
  controllable velocity. Multiple effects such as eq, reverb, filter,
  compressor, saturation.

  Features: multi tab user interface. 2 layers with 17 different dhol kits. Over
  1350 sound samples with articulations. Ai powered dynamic rr and velocity
  sensitivity. Over 60 factory presets. Save own presets as .rdg format.

  Sub oscillator engine for low frequency and for sub harmonic enhancement with
  saturation. Eq, filter, reverb, saturation and compressor effects. Sequencer
  and MIDI browser.

  After purchase please drop a mail to rdgaudios@gmail.com having stated your
  preferred os (mac or windows) & kvr order number. We will send AU or vst3
  plugins based on your os selection.
