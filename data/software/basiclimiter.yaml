name: BasicLimiter
manufacturer: uhhyou
primaryCategory: limiter
url: https://ryukau.github.io/VSTPlugins/
description: Notes macOS build is experimental. Linux build only works on ubuntu
  22.04. Build instruction is available for other distributions.
details: |-
  BasicLimiter is a basic single band limiter. The sound is nothing new, but the
  design of true peak mode is a bit luxurious.

  Functionalities: attack, sustain, and release for envelope control. Gate.
  Stereo link. True peak mode spec: 8x oversampling. 512 taps fir for up and
  down sampling. 64 taps fir for near nyquist frequency elimination. Flat
  amplitude response under 18 khz on 48 khz sampling rate.

  Basiclimiter by uhhyou is a virtual effect audio plugin for macos, windows and
  linux. It functions as a VST 3 plugin.

  Macos build is experimental. Linux build only works on ubuntu 22.04. Build
  instruction is available for other distributions.

  Source code is available on github.com/ryukau/vstplugins.
specs: |-
  - Single band limiter
  - Attack control
  - Sustain control
  - Release control
  - Gate
  - Stereo link
  - True peak mode
  - 8x oversampling
  - 512 taps fir for up and down sampling
  - 64 taps fir for near nyquist frequency elimination
  - Flat amplitude response under 18 kHz on 48 kHz sampling rate
  - macOS support
  - Windows support
  - Linux support
