description: Spoken-word audio editing software built for journalists,
  broadcasters and podcasters, pairing waveform editing with a transcript-based
  workflow that runs from recording through montage, mixing and publishing.
details: |-
  Hindenburg PRO is positioned by its maker as a storytelling tool rather than a general digital audio workstation. The workflow it describes is record, transcribe, edit, montage, mix and publish, and the interface is built around dialogue rather than around music arrangement.

  Transcription is central to the product. Recordings can be transcribed in 99 languages, with offline processing available, and the resulting transcript can be edited much like a word processor document so that cutting text cuts the audio behind it.

  Raw material is gathered in a clipboard system that holds interviews, atmospheres and other takes before they are placed on the multitrack montage. Editing is non-destructive throughout, and a video track is available for audio post-production against picture.

  Mixing tools are aimed at broadcast delivery, with automatic loudness handling to reach broadcast-ready levels, a built-in sound library through Soundly integration and music reporting for rights logging.

  The product is currently at version 2, and the company also sells Hindenburg Lite, which was previously called Hindenburg Journalist, and the Narrator audiobook tool alongside it.
specs: |-
  - Transcript-based editing of recorded speech
  - Transcription in 99 languages, with offline processing
  - Multitrack recording and non-destructive montage editing
  - Clipboard system for organising raw material
  - Automatic loudness levelling for broadcast delivery
  - Built-in sound library via Soundly integration
  - Video track for audio post-production
  - Music reporting for rights logging
  - Publishing directly from the application
