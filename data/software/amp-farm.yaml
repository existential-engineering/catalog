details: |-
  Since its introduction in 1998, the Amp Farm plug-in has been used to add
  quintessential guitar tones to countless platinum albums, hit television
  shows, and major motion picture soundtracks. Once only available to Pro Tools
  tdm users, the new Amp Farm 4.0 plug-in supports 64-bit AAX, AU, and VST
  formats, and sample rates of up to 192khz, making it compatible with virtually
  any DAW.

  Select from more than a dozen amp models based on classic amplifiers by
  marshall, fender, vox, mesa/boogie, soldano, and more—plus 48 cab models with
  choice of four mic setups.

  Amp farm 4.0 is fully programmable and automatable, providing powerful control
  over your tone. Mix and match amps, speakers, and mics for all-new
  combinations. The amp farm plug-in makes it easy to do things that are simply
  not possible with physical amps. And not just on guitar. It can impart
  exciting color and character—from subtle tube warmth to extreme distortion—to
  bass, drums, keyboards, vocals, or complete mixes.

  Pro tools users will appreciate full backward compatibility and the ability to
  open old sessions without losing previous sounds or settings.

  Now supporting 64-bit AU, VST, and AAX formats, amp farm works with any DAW.
  Process live guitar inputs or reamp and modify pre-recorded tracks. Add tube
  amp warmth, distortion, or cab tone to any instrument—not just guitars.
