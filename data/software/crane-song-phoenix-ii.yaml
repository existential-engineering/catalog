details: |-
  Phoenix II is an update of Crane Song's suite of TDM plug-ins designed to emulate the unique properties of a magnetic tape machine. Phoenix II runs both NATIVE and DSP on Avid's AAX format. Beta now available with additional AU and VST3 formats! Phoenix II uses 32 bit floating point math and has a lower noise floor than the original release.

  Designer Dave Hill has crafted this software with the same attention to detail he used to create the electronics for ATR Service's much heralded "Aria" discrete tape recorders. His intimate knowledge of analog electronics, as well as decades of experience as a recording engineer has spawned a very useful, musical suite of plug-ins. The Phoenix II process not only incorporates the nonlinear saturation characteristics created by magnetic tape itself, but also includes the interrelation of an analog tape recorder's record/reproduce electronics and equalization curves. Phoenix II is a ground-up application derived from HEDD technology, and specifically engineered and optimized for Avid's AAX architecture.

  Phoenix II has five different tape-analog characteristics. The type is selected with a switch for easy comparison between the types, and the brightness is also selected with a switch. Gold is the position where the color is approximately flat in frequency response, with Sapphire being brighter, and Opal being a warmer tonality. A level control determines the amount of the Phoenix II process integrated into the audio signal, and an input trim determines "how hard you hit the tape." Because the DSP process is level dependent, the input level trim control has been improved and an output trim control has been added.

  The input trim can also be used to prevent clipping in the rare cases where clipping may be a problem, and to bring up the level of a track for an increased amount of color. This can be useful on material that is hitting close to or at digital zero and on material that has a low recorded level. When the input trim and output trim controls are at 0dB (no change in gain) and no tape process is being added to the sound, the plug-in is bit accurate, meaning the output exactly matches the input.

  The Phoenix II contains five separate flavors: Luminescent, the most neutral sounding process of the five; Iridescent, with a similar magnetic character but a fatter bottom and midrange (most similar to the tape knob on HEDD-192); Radiant, characterized by a more aggressive compression curve; Dark Essence, even more aggressive, with a color across a wider frequency range that can reduce sibilance problems on vocals by increasing the apparent loudness of the rest of the signal; and Luster, which starts more gently than the other four but becomes as aggressive as Dark Essence at full scale.
specs: |-
  - AAX native and DSP support on Avid platforms
  - Beta AU and VST3 formats also available
  - 32-bit floating point math with a lower noise floor than the original Phoenix
  - Five tape-analog flavors: Luminescent, Iridescent, Radiant, Dark Essence, Luster
  - Type switch selects tape-analog characteristic; brightness switch selects Gold (flat), Sapphire (brighter), or Opal (warmer)
  - Level control, input trim, and output trim; bit-accurate at 0dB trims with no process added
  - Derived from HEDD technology, engineered by Dave Hill
