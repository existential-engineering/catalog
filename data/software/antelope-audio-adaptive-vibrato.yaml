description: "Latch and trigger modes, rate and depth knobs, five waves of
  modulation, delay and rise controls with the Vibrato plugin"
details: |-
  On/Standby Button

  Rate control - Slow/Fast

  Depth control - Min/Max

  Wave selector - sine, triangle, square, sawtooth right, sawtooth left

  Mode control - Latch/Trigger

  Delay control - Min to Max

  Rise control - Slow to Fast

  Threshold - Min to Max

  Endfreq - x0.5 to x2

  Dry/Wet mix knob

  Runs natively in DAW or in real-time on Synergy Core interfaces

  Included in Antelope Cosmos subscription
