details: |-
  The UAD 4K Buss Compressor emulates the console dynamics from the ssl 4000.
  With its simple control set and transparent compression characteristics, ua
  says it has captured this icon of record production with exacting accuracy.

  The uad 4k buss compressor is a circuit emulation of the 4000 g+ and a
  companion to the uad 4k channel strip.

  The simple control set of the uad 4k buss compressor has fixed attack and
  release controls with an auto release that incorporates a program dependent
  response. Three fixed ratio settings are available: 10:1, 4:1 and 2:1.
  Continuous threshold control and make-up gain along with a compressor bypass
  are also included.

  Uad circuit emulation of the 4000 g compressor. Specially tailored dynamics
  ideal for compressing the full mix.
specs: |-
  - Fixed attack and release controls
  - Auto release with program dependent response
  - Three fixed ratio settings: 10:1, 4:1 and 2:1
  - Continuous threshold control
  - Make-up gain
  - Compressor bypass
