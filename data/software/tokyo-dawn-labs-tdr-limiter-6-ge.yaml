description: "A modern dynamics compression and limiting toolkit featuring six
  specialized modules in variable order. Designed for loudness control,
  brick-walling, and creative mix bus processing."
details: |-
  Version 1.3.0. Six modules: Dynamics Compressor, Clipper, High Frequency Limiter, Peak Limiter, Output Protection Limiter, True Peak and EBU Loudness Meter. Advanced true peak and EBU R128 compliant loudness metering. Equal loudness bypass. Visual aesthetics with detailed signal dynamics insight. Preset starting points for loudness maximization.
specs: |-
