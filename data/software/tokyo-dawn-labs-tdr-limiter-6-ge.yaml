description: A modern dynamics compression and limiting toolkit featuring six specialized modules in variable order. Designed for loudness control, brick-walling, and creative mix bus processing.
details: |-
  TDR Limiter 6 GE is a modern dynamics compression and limiting toolkit featuring six specialized modules that can be arranged in variable order. Together, they cover a remarkable range of applications from creative crunching to precise and competitive loudness control.

  Each module offers dedicated control over different types of events, from macro to micro, and allows you to determine the signal path. Combined wisely they can greatly increase the perceived loudness of a mix while preserving superior musical fidelity, punch, and excitement.

  With its appealing visual aesthetic, the advanced metering section gives a detailed insight into the signal's dynamics, incl. EBU compliant True Peak and Loudness meters, and a psycho-acoustically most elaborate Zwicker Loudness meter. The equal loudness bypass will also make sure the operators' aural perception doesn't get tricked by any loudness differences.

  A collection of sensible starting points allows for quick, yet precise loudness maximization. If needed, a wide range of options offer endless creative possibilities for getting that optimal setting. Going further, Limiter 6 also enables the operator to build their own personal take on loudness maximization, bus processing, and much more.
specs: |-
  - Module: Dynamics Compressor
  - Module: Clipper, both upward and downward
  - Module: High Frequency Limiter, with absolute and relative control
  - Module: Peak Limiter
  - Module: Precise True Peak Output Protection Limiter
  - Module: EBU compliant True Peak and Loudness Meter, further supporting the Zwicker Loudness algorithm
  - Modules can be arranged in variable order
  - VST2, VST3, Audio Unit or AAX compatible plugin host. Windows Vista or higher, Mac OS X 10.9 or higher, Linux x86-64 with GLIBC 2.14 or higher. OpenGL support required. Windows 32-bit: VST2, VST3. Windows 64-bit: VST2, VST3, AAX. Mac 64-bit: VST2, VST3, AU, AAX. Linux 64-bit: VST2, VST3.
