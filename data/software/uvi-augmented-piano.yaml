description: UVI Augmented Piano is a one-of-a-kind creative instrument with 24
  unique preparations and a mixable multi-mic signal path.
details: |-
  Augmented Piano is a one-of-a-kind piano workshop including 24 configurations
  recorded on a 1909 pleyel grand piano. Full 88-key preparations cover the
  gamut from brushed, finger-plucked and muted preparations to haunting ebow
  resonances and brilliant metallic sounds by way of tacked hammers.

  Augmented piano provides an inspiring range of sonic territory from
  beautifully recorded traditional piano to new, eclectic and avant-garde tones
  ready to breathe life into your compositions by taking the sound of the piano
  further than it's ever been.

  Deep onboard sample controls and numerous effects combined with 3
  fully-mixable mic sets, including a pair of condenser mics, a stereo ribbon
  mic and a floor-mounted pzm mic, provide tremendous flexibility and total
  control over your pianos sound.

  A complete instrument workshop, augmented piano delivers sounds impossible to
  make with any other piano library, from incredible ready-to-play presets to a
  world of sound design potential.

  Augmented piano offers native 64-bit standalone operation by way of falcon or
  the free uvi workstation, providing comprehensive support for all modern daws
  and simultaneous authorization on up to 3 computers or ilok keys.
specs: |-
  - 64-bit standalone operation
  - 88-key preparations
  - 24 unique preparations
  - 3 fully-mixable mic sets
  - Condenser mics
  - Stereo ribbon mic
  - Floor-mounted pzm mic
  - Sample controls
  - Effects
  - MIDI support
  - Simultaneous authorization on up to 3 computers or ilok keys
