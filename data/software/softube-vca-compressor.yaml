description: VCA Compressor plugin is an authentic emulation of a must-have
  compressor and its signature snappy sound. This compressor plugin has a
  grabby, vintage character, and modern features for mixing and production.
details: |-
  Quirky and characterful, the legendary hardware used to model VCA Compressor is unique and highly acclaimed. Much of that is owed to its famed hard knee compression curve and the harmonic content it adds in the gain stages.

  Softube left the grabby, vintage character and the unique attributes, such as RMS level detection and feed-forward gain reduction, intact but gave VCA Compressor a slate of modern features for mixing and production. The combination delivers snap and sheen in spades, plus superior Softube sound quality and an enhanced workflow.

  Designed by Experts, Built on Legacy: Softube has been emulating professional audio gear for two decades. With partnerships with premium brands like Tube-Tech, Solid State Logic, Chandler Limited, and Marshall Amplification, Softube has a strong record of accurately recreating analog standards in software form. VCA Compressor builds on this legacy, delivering nothing less than the same classic character as the original hardware, superior sound quality, and added modern features.

  Mod features: VCA Compressor delivers the snappy, analog character beloved by many, plus DAW-friendly attributes and expanded parameters. The added Sidechain section (with punch, filter, and external gain), Dry/Wet, and Drive give you the possibility to add more harmonic content. With Stereo Link, you can toggle from Stereo Linked mode, with linked Left and Right gain reduction, to Unlinked Dual Mono for independent gain reduction for Left and Right channels.

  The High Frequency Make-up feature allows you to offset the minor loss of higher frequencies when compressing sound sources. It's the go-to comp for a snappier snare sound, but it is also excellent for adding texture, sheen, and attack to guitars, as well as low-end glue and weight on bass sounds.

  This product supports Extended Features: Softube loves VU meters, Bakelite knobs, and analog quirks. But Softube wants modern precision and workflow. The answer? Softube Extended Features. Easy-access panels with the innovations you need close at hand.
specs: |-
  - A meticulous model of an iconic 1970s-era compressor and its famous punchy sound
  - An authentic emulation of a must-have compressor and its signature snappy sound
  - Added features such as new ratios, parallel compression, and detector filtering
  - Added modern features, such as Drive, a Sidechain section, Stereo Link, a High Frequency Make-up feature, and Dry/Wet
  - Famed hard knee compression curve, with harmonic content added in the gain stages
  - RMS level detection and feed-forward gain reduction, as in the original hardware
  - Sidechain section with punch, filter, and external gain
  - Stereo Link toggles between Stereo Linked and Unlinked Dual Mono gain reduction
  - Excellent for adding musical texture, sheen, and attack to snare drums, guitars, and bass
  - Great for easily adding warmth, weight, and glue to your bass, guitars, and vocals, for getting aggressive, snappy snares or blown-up room channels
  - Console 1-ready
  - Included in Icons: The Compressor Collection
  - Also available as part of Flow Mixing Suite and Flow Complete Suite
  - Computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires a Softube account and an iLok account (no physical iLok required)
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Internet access (for downloading installers and managing licenses)
  - Three activations, 20-day trial, 14-day returns
