description: PSP NobleQ combines the features of passive program equalizers with a wide range of frequency settings and extended functionality, featuring an adjustable high pass filter, switchable Boost or Attenuation modes for high peak and shelf filters, FAT double sampling for natural analog-like response, and a valve-like output rounding algorithm with adjustable processing depth.
details: |-
  PSP NobleQ is a passive-style equalizer plugin combining vintage program EQ character with modern functionality. The low shelf filter combines two shelving sections for rich bottom end without low-midrange muddiness. The high frequency section combines a peaking filter with adjustable bandwidth and a shelf filter. FAT double sampling provides natural analog-like response. A valve-like output rounding algorithm with adjustable depth adds warmth. Licensing requires a free iLok user ID and iLok License Manager; 3 activation locations supported.
