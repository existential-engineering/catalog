description: PSP NobleQ combines the features of passive program equalizers with a wide range of frequency settings and extended functionality such as an adjustable high pass filter, and the ability to switch the high peak and shelf filters to "Boost" or "Attenuation" modes.
details: |-
  PSP NobleQ combines the features of passive program equalizers with a wide range of frequency settings and extended functionality. To make the plug-in a versatile tool, PSP added several modern features such as an adjustable high pass filter, and the ability to switch the high peak and shelf filters to "Boost" or "Attenuation" modes.

  PSP NobleQ stands out for its warm sound, its boost and attenuation low-shelf filters, and its combined peak and shelf high frequency processing. The warm and musical sound in PSP NobleQ is made possible thanks to its finest processing utilizing FAT double sampling for natural, analog-like response. An output valve-like rounding algorithm with adjustable processing depth is also included.

  The low shelf filter actually combines two shelving sections: the first one boosts low frequencies while the other one attenuates them, but is tuned slightly higher. Together, they help to get a rich bottom end without low-midrange muddiness.

  The high frequency range consists of two filters, a peaking filter with adjustable bandwidth (usually set to Boost) and a shelf filter (usually set to Attenuate). Both filters interact in such a way that the more attenuation to high frequency is applied, the more the selective peaking filter becomes while keeping its center frequency similarly boosted.

  PSP NobleQex is an extended version of the PSP NobleQ. It offers all the features of PSP NobleQ combined with an extra middle bell filter and an adjustable low-shelf dip frequency shift.
specs: |-
  - Passive program equalizer with a wide range of frequency settings
  - Adjustable high pass filter
  - High peak and shelf filters switchable to Boost or Attenuation modes
  - Low shelf filter combining two shelving sections, one boosting low frequencies and one attenuating them tuned slightly higher
  - High frequency range built from a peaking filter with adjustable bandwidth plus a shelf filter, interacting so that more high frequency attenuation makes the peaking filter more selective
  - FAT double sampling for natural, analog-like response
  - Output valve-like rounding algorithm with adjustable processing depth
  - Windows 7 to Windows 11 (64-bit VST, VST3, AAX / Pro Tools)
  - macOS 10.14 to macOS 15 Sequoia, Intel and Apple Silicon (64-bit AudioUnit, VST, VST3, AAX / Pro Tools)
  - iLok user ID required, no hardware dongle needed
  - License activatable in 3 separate locations (computer or 2nd generation or above iLok dongle)
