description: The HoRNet AutoGain Pro is an advanced volume automation and leveling utility.
details: |-
  HoRNet AutoGain Pro is the evolution of one of our best-selling plugins, the original HoRNet AutoGain. It takes the same powerful and efficient DSP algorithm at its core and enhances it with advanced features like internal reference selection, peak detection, reversed gain processing, and customizable gain limits. While keeping all the fast and effective capabilities of the original, AutoGain Pro offers significantly more flexibility and precision for those who need deeper control over volume automation and dynamic leveling.

  If you’re working with vocal tracks, instruments, or any source where maintaining consistent volume levels is key, AutoGain Pro is designed to intelligently assist you in creating smooth, musical gain adjustments in real time. Whether you’re mixing, mastering, live streaming, or post-producing, this plugin becomes an essential tool to automate gain riding with transparency and control.

  The heart of AutoGain Pro lies in its adaptive behavior. The plugin works by listening to your audio signal and attempting to keep it dynamically balanced with a reference signal. This reference can be either external —fed from another track or sidechain—or internal, allowing the plugin to respond to its own input. This makes it incredibly flexible in different contexts: from ducking effects and leveling dialogue against background music, to creating tight parallel compression-like dynamics or even automating vocals for constant perceived loudness.

  You also get complete control over how the plugin reacts to both the main and the reference signal. With adjustable attack and release times for each side, you can precisely shape the responsiveness of the automatic gain adjustments. Whether you want fast, transparent corrections or slower, more musical movements, AutoGain Pro lets you tailor the behavior to your exact needs.
specs: |-
  - internal and external reference
  - gate from -60dB to 0dB for main signal when using internal reference
  - independent attack and release for reference and main signals
  - high pass and low pass filters on the reference input
  - reference gain adjustable from -30dB to +30dB
  - peak or RMS processing
  - reverse gain operation
  - “classic” mode works like the original AutoGain
  - can write and read automation
  - independent adjustment of minimum and maximum gain range
  - relative gain range adjustment
  - graphical gain adjustment and reference signal display
  - Apple Silicon native support
  - Mac OS X (>=10.11) and Windows (7 and later) support
  - 64bit only on both on Mac and Windows
  - Audio Units VST2.4, VST3 and AAX format
