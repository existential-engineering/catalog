details: |-
  Audiodia is a real-time sound processing application. Simply turn on your
  microphone and your speakers, select the desired audio filter and press play
  or record.

  Audiodia gives you access to the audiounit filters that ship with mac os x,
  such as the reverb and the delay filters. It also ships with a built-in
  pitch-shifting filter.

  Audiodia lets you pick favorite filters and quickly switch from one filter to
  another during use.

  The sound output is mixed with your other applications' sound output, so you
  can add your voice over music playing in itunes, for instance.
specs: |-
  - Audio Unit host
  - Real-time sound processing
  - Audiounit filter support
  - Built-in pitch-shifting filter
  - Reverb filter
  - Delay filter
  - Audio mixing capability
  - macOS compatible
