description: >-
  A multi-effect plugin combining guitar amp simulation, mixing tools, and
  mastering capabilities with AI-powered amp captures, preset stacking, and a
  Similarity Map for intuitive browsing.
details: |-
  EZmix 3 is a multi-effect plugin that combines guitar amp simulation,
  mixing tools, and mastering capabilities in a single interface. It
  features 40+ presets for common instruments and AI-powered amp
  captures and analysis.

  The plugin offers a scalable, resizable GUI with up to 10
  user-adjustable macros per preset. A Similarity Map enables intuitive
  preset browsing, and presets can be stacked and chained for complex
  signal processing.

  AI-assisted processing covers vocals, guitar, bass, drums, keys, and
  mastering applications. The full core content from EZmix and EZmix 2
  is included, providing a comprehensive starting library.

  EZmix 3 is expandable through EZmix Packs — additional preset
  collections designed by professional mix engineers for specific
  instruments and genres.
specs: |-
  - 40+ presets for common instruments
  - AI-powered amp captures and analysis
  - Scalable, resizable GUI
  - Up to 10 user-adjustable macros per preset
  - Similarity Map for preset browsing
  - Preset stacking/chaining capability
  - Full core content from EZmix and EZmix 2 included
  - 2 GB disk space required
  - 4 GB RAM minimum, 8 GB+ recommended
  - Windows: 64-bit Windows 10 or newer
  - macOS: 10.13 or higher (Intel or Apple Silicon)
