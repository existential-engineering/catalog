description: Plate reverb plugin featuring five models based on legendary hardware
  including the EMT 140, EMT 240, and EcoPlate III, with three preamp options and
  infinite decay.
details: |-
  SuperPlate features five classic plate reverb models using advanced algorithms to capture the character of legendary electromechanical plate reverb hardware.

  The five models include Classic 140 (EMT 140 from 1957), Goldfoil 240 (EMT 240 from 1970 with 24-karat gold foil), Audicon (The Plate from 1971), Stocktronics (RX4000 from 1978 with Swedish steel alloy), and E. Plate III (EcoPlate III from 1982 with stainless steel).

  Three preamp options are available: Tube, Solid-State, and Clean. Features include infinite decay time, built-in predelay, modulation controls, and decay ducking (Auto-Decay). A full-featured EQ section provides low-cut, high-cut, and two parametric bands for precise tonal shaping. SuperPlate includes the Little Plate plugin as a bonus.
specs: |-
  - Five plate reverb models: Classic 140, Goldfoil 240, Audicon, Stocktronics, E. Plate III
  - Three preamp options: Tube, Solid-State, Clean
  - Infinite decay time
  - Built-in predelay
  - Modulation controls
  - Decay ducking (Auto-Decay)
  - Full-featured EQ with low-cut, high-cut, and two parametric bands
  - Includes Little Plate plugin
  - 64-bit only, sample rates 44.1 kHz to 192 kHz
  - Apple Silicon compatible
