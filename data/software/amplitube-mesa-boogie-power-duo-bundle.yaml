details: >-
  Amplitube 4 is a guitar and bass tone studio for mac/pc that works as a
  standalone application and as a plug-in for your favorite DAW. Amplitube
  recreates the entire guitar/bass signal chain from instrument to recording
  device, and does so in a very realistic and intuitive way.


  Amplitube pioneered and leads the way in guitar amp and effects modeling, and
  amplitube 4 takes it to the outer edges of extreme hyper realism with
  intuitive familiar tools.


  Amplitube mesa/boogie includes officially certified models of: amplifiers:
  mark iii combo, mark iv combo, dual rectifier head, triple rectifier head,
  transatlantic ta-30 combo. Cabinets: 1x12" mark iii combo, 1x12" mark iv
  combo, 2x12" rectifier horizontal, 4x12" recto traditional slant, 2x12"
  transatlantic ta-30 combo.


  Stompbox models include: acoustic sim, chorus, flanger, opto tremolo, delay,
  wah pedal, diode overdrive, compressor, graphic eq, volume pedal (can be
  controlled by external controller). Amplifiers include 5 classic british amps:
  brit 8000, brit 9000, red pig, brit silver and brit valve pre, plus american
  tube clean 1, american tube clean 2, british tube lead 1, solid state bass
  preamp.


  Cabinets include: 4x12 brit 8000, 4x12 brit 9000, 4x12 red pig, 4x12 brit
  silver, 4x12 brit 30, 4x10 open vintage, 1x12 open vintage, 2x12 closed
  vintage, 4x12 closed vintage 1, 1x15 bass vintage. Microphones include: double
  dynamic 57, dynamic 57, condenser 414, condenser 87. Rack effects units
  include: digital delay & parametric eq.
