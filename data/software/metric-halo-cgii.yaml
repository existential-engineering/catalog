description: CGII is a mastering dynamics finishing toolkit that raises the
  loudness of a master without losing the clarity, density and heft of the
  original mix, while holding the true-peak level so there are no inter-sample
  overs. Dither, a DC-block filter and full LUFS and true-peak metering let it
  sit at the end of a master chain.
details: |-
  CGII is the result of a collaboration with Chris Gehringer, Senior Mastering Engineer and Partner of Sterling Sound, and is built as a mastering dynamics finishing toolkit for raising level on loud tracks while adding character.

  It is comprised of two complementary dynamics enhancement sections, a True Peak Limiting stage, DC blocking and dither, with LUFS and true-peak metering shown on tube filament displays, all operating at up to 16x over-sampling or none at all.

  The design prioritizes musical integrity and ease of use, with the ability to add effective loudness, weight and definition without diminishing the spatial depth and visceral impact that traditional dynamics processors often cost. A mix that is already loud can be given a little extra without unpleasant distortion, without flattening out the material and without thinning the low end.

  The Loudness processor excites harmonics, the Density processor brings up bloom and raises low-level clarity without affecting transients, and the transparent true-peak lookahead limiter can be placed wherever it is needed. Although the original spec was to make material good and loud at the same time, the plug-in also works in a variety of other places in a mixing and processing chain.
specs: |-
  - World-class signal processing and workflow
  - User-selectable over-sampling (up to 16x)
  - Density process effectively increases perceived program level by pushing up previously masked detail without affecting higher level peak dynamics
  - Loudness process gives a transparent increase in RMS level while maintaining peak levels below full-scale
  - True Peak Limiter transparently controls output levels, ensuring that the true-peak level never exceeds the specified ceiling
  - DC-block filter removes any residual DC offset
  - Dither allows the output to be dithered to 16 through 24-bits
  - Nixie Tubes provide dB readout of any of the user-selectable meter values (LUFS Integrated, LUFS Short Term or Hold, LUFS Momentary or Hold, True Peak or TP Hold)
  - Many presets included
  - Adjustable UI size
  - MH Preset Manager provides cross-platform presets
