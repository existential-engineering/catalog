description: DeeDoubler is a plug-in that adds a doubling effect to vocals. It brings depth to vocals by layering voices using filters and phase adjustment for a clean and classic effect.
details:
  - DeeDoubler is a vocal doubling plug-in that creates the classic layered-voice effect used across pop, hip-hop, and recorded music. It uses filtering and phase adjustment to synthesize the sound of a doubled vocal take without requiring a second recording.
  - "The plug-in is designed for simplicity, offering just two parameters: AMOUNT, which controls the intensity of the doubling effect, and DELAY, which sets the width and spread of the doubled layer. This minimal interface makes it quick to dial in results on main vocals, chorus parts, and rap tracks."
  - DeeDoubler is compatible with all major DAW hosts on both macOS and Windows. Tested hosts include Ableton Live, Cubase, Logic Pro X, Studio One, Pro Tools, FL Studio, Bitwig Studio, Reason, Digital Performer, GarageBand, and OBS Studio, among others.
  - On macOS the plug-in runs as VST2, VST3, AU, and AAX (64-bit, macOS 10.12 or later). On Windows it runs as VST2, VST3, and AAX (64-bit). Download sizes are approximately 21 MB for Windows and 49 MB for macOS.
  - DeeDoubler was sound-designed by Franck Shigetora, with UI design by IZMOJUKI and FUKUDAKOGYO, and is developed and distributed by DOTEC-AUDIO, cyber rock.LLC, and fmfmsoft Corp.
specs: |-
