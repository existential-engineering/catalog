description: "Faithful digital recreation of the Chop Shop 500 Series analog EQ,
  featuring an intuitive interface for transparent tone shaping with Focus
  filter, variable Lo-Cut with resonance control, and Hi-Cut filter, designed
  for eliminating masking and enhancing intelligibility across entire sessions."
details: |-
  FOCUS: Intuitive filter that focuses energy in bass or treble ranges with constant apparent loudness for A/B comparisons, SHIFT switch for midrange response. LO-CUT: 12 dB/oct filter variable 20-530 Hz with Lo-Rider mode for low-frequency hi-cut with variable resonance. BUMP: Variable resonance control from Bessel to Butterworth to slightly resonant, with MORE switch for dramatic resonance. LO-RIDER: Transforms LO-CUT into low-frequency low pass filter with variable resonance for massive low end on kicks and bass. HI-CUT: 6 dB/oct filter variable 500 Hz-25 kHz with 0.5X switch for octave-lower range with 12 dB/oct slope and resonance.
specs: |-
  Version 1.4.1. CPU efficient for use across entire sessions. Distributed via Plugin Alliance. Mac installer: 136.3 MB. Windows 64-bit installer: 56.0 MB.
