description: A faithful digital recreation of the Louder Than Liftoff 500 Series analog EQ. Accurately reproduces the pristine sound of the original but also offers extra features for tone shaping across mixing sessions with an emphasis on musical transparency and CPU efficiency.
details: |-
  FOCUS: An intuitive filter maintaining apparent loudness with a switchable SHIFT mode. LO-CUT: 12 dB/octave variable filter (20–530 Hz) with jumper-selectable Lo-Rider mode. BUMP: Variable resonance control with MORE switch option. LO-RIDER: Low-frequency centered low-pass filter with variable resonance. HI-CUT: 6 dB/octave filter (500 Hz–25 kHz) with 0.5X switch option. Activation requires a Plugin Alliance account; voucher code redemption required for purchased licenses.
