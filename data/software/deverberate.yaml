description: DeVerberate is a reverb reduction plug-in that can attenuate or
  boost the reverberation that is already present in recorded material.
details: |-
  The reverb reduction algorithm from version 2 is included for music and other
  audio sources. Both algorithms split the incoming audio into an estimation of
  the direct sound and the reverberated sound which can then be recombined
  freely.

  Additionally, a unique early reflections filter that works in conjunction with
  the reverb suppression algorithms is included. The early reflections filter
  uses sophisticated statistical methods to estimate the so called impulse
  response of the early reflections, which is then used to cancel out the effect
  of the early reflections.

  Acon digital deverberate 3 is available as VST, vst3 or AAX for both windows
  and mac or as AU plug-ins for mac. There are 32 and 64-bit versions for
  windows. The mac version is 64-bit and runs natively on both arm (such as
  apple m1) and intel processors.

  This plug-in accords a tremendous degree of control over the amount of
  perceived ambience heard in any audio clip. It is entirely possible to remove
  offending "room" noise from less-than-optimal vocal tracks. This plug-in makes
  it easy to edit a live club or large hall recording and bring "focus" to the
  music whilst greatly lessening unwanted, "boomy" reverberation.
specs: |-
  - Deep learning algorithm for automatic reverb reduction
  - Neural network trained on thousands of high-quality voice recordings
  - Reverb reduction algorithm from version 2 for music and other audio sources
  - Early reflections filter with zero latency
  - Direct sound and reverberated sound estimation and recombination
  - VST plugin format
  - VST3 plugin format
  - AAX plugin format
  - AU plugin format for mac
  - 32-bit and 64-bit versions for Windows
  - 64-bit mac version
  - Native arm64 support (apple m1)
  - Native intel processor support
  - 1536 samples latency at 44.1 kHz for reverb tail suppression
  - Windows 10/8/7 compatibility
  - macOS/os x 10.9 or later compatibility
  - Intel core i3 or amd multi-core processor minimum
  - Intel core i5 or faster recommended
  - 1 GB RAM minimum (4 GB or more recommended)
  - 1 GB free hd space
  - 1366 x 768 display resolution minimum (1920 x 1080 or higher recommended)
  - Compatible with Pro Tools 10.3.5 or higher (Windows)
  - Compatible with Pro Tools 11 or higher (mac)
  - Compatible with final cut pro
  - Compatible with adobe premiere pro
  - Compatible with adobe audition
  - Compatible with logic
  - Compatible with ocenaudio
  - Compatible with amadeus pro
  - Compatible with Ableton live
  - Compatible with Cubase
