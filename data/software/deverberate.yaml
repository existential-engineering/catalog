description: Deverberate is a reverb reduction plug-in that can attenuate or
  boost the reverberation that is already present in recorded material.
details: |-
  Deverberate is a reverb reduction plug-in that can attenuate or boost the reverberation that is already present in recorded material. The new version includes an entirely new algorithm based on deep learning for fully automatic reverb reduction of recorded dialogue. By training a neural network on thousands of high-quality voice recordings and a wide variety of acoustical surroundings, the artificial intelligence can automatically separate dialogue from reverb.

  The reverb reduction algorithm from version 2 is included for music and other audio sources. Both algorithms split the incoming audio into an estimation of the direct sound and the reverberated sound which can then be recombined freely.

  Additionally, a unique early reflections filter that works in conjunction with the reverb suppression algorithms is included. The early reflections filter uses sophisticated statistical methods to estimate the so called impulse response of the early reflections, which is then used to cancel out the effect of the early reflections.

  Acon digital deverberate 3 is available as VST, vst3 or AAX for both windows and mac or as AU plug-ins for mac. There are 32 and 64-bit versions for windows. The mac version is 64-bit and runs natively on both arm (such as apple m1) and intel processors.

  This plug-in accords a tremendous degree of control over the amount of perceived ambience heard in any audio clip. It is entirely possible to remove offending "room" noise from less-than-optimal vocal tracks. This plug-in makes it easy to edit a live club or large hall recording and bring "focus" to the music whilst greatly lessening unwanted, "boomy" reverberation.
