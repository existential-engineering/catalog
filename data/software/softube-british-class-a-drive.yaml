description: The famous British analog console drive. Authentic, unmistakable
  British console character from a precisely emulated console drive.
details: |-
  British Class A Drive is a precisely emulated console drive that brings the authentic, unmistakable character of the famous British analog console to the DAW.

  Take your sound from dark and stormy to blue skies. Drive simulates running the console channel hot with the saturation, distortion, and tone that occur when doing so. Go from a darker sound with less distortion in the mid-range to bright and clear distortion in the highs.

  The plug-in can be used inside Console 1, Flow Mixing Suite and Amp Room, or as a standalone plug-in in any supported DAW.
specs: |-
  - Authentic, unmistakable British console character
  - A precisely emulated console drive
  - Use in Console 1, Flow Mixing Suite, Amp Room or as standalone plug-in
  - Included in the British Class A plug-in
  - Supported sample rates: 44.1, 48, 88.2, 96, 176.4 and 192 kHz, mono and stereo
  - 64-bit only; requires a Softube account and an iLok account (no physical iLok required)
  - macOS Sonoma 14, Sequoia 15 or Tahoe 26; Windows 10 (64-bit) or Windows 11
  - Apple silicon (M1 or newer) supported natively
