description: Electric guitar, acoustic guitar and electric bass harmonics for your music. With included effects, built-in doubler and a full featured sequencer, creating beautiful background is as easy as holding a single key.
details: |-
  Harmonics are most often played by lightly placing a finger on a string at a nodal point of one of the overtones at the moment when the string is driven. The finger immediately damps all overtones that do not have a node near the location touched. The lowest-pitch overtone dominates the resulting sound.

  Harmonix can enrich your music creating both melodies and background textures with the different tonal characteristic of the three types included: acoustic, electric and bass harmonics. The electric guitar harmonics fill up the mids, the acoustic shine on top and the bass harmonics enrich the low end. With all three you have the full spectrum covered.

  From the mixer you can control the different instruments separately with the usual parameters you'd get on an audio mixer, with an extra feature: the doubler, which makes the instrument sound like it was double-tracked for more spatiality. Each channel has a load/purge switch, pan / width, volume, mute, solo, phase shift and an output selector for mixing the different channels in your DAW.

  In the effects page you can add any effect you want in any order, including EQ, compressors, modulation effects, distortion, saturation, tape machine, reverbs, amp simulators and more. This script boosts the sonic capabilities of the library exponentially.

  Harmonix features a full sequencer / arpeggiator that includes 7 presets ready to be played. Adjust the tempo, steps and mode (up, down, random, as played) to create complex patterns easily. Each instrument has its own sequencer table that you can draw, but you can also make them play in Unison. From the settings panel you can control round robin, velocity curve, dynamic range and envelope with attack and release controls.
specs: |-
  - Electric guitar, acoustic guitar and electric bass harmonics
  - 1,369 samples, 1.54 GB library size
  - 3 velocity layers
  - 4 round robins
  - Built-in doubler effect in the mixer
  - Mixer with load/purge per channel, pan / width, volume, mute, solo, phase shift and output selector
  - Effects page with EQ, compressors, modulation, distortion, saturation, tape machine, reverbs and amp simulators
  - Full sequencer / arpeggiator with 7 presets, adjustable tempo, steps and mode (up, down, random, as played), per-instrument tables and a Unison control
  - Settings panel with round robin, velocity curve, dynamic range and attack / release envelope controls
  - Works with Kontakt 5.7.3 and newer; full version of Kontakt required (Kontakt Player runs in demo mode)
