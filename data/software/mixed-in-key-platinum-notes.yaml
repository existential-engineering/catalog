details: |-
  Platinum Notes is a batch audio enhancement application from Mixed In Key that processes an entire music collection so every file sounds consistent. Files added to Platinum Notes are run through high-quality audio filters to improve their volume, so that every song sounds like it came from the same mastering engineer.

  Tracks created by different producers have different loudness, and Platinum Notes standardizes volume across an entire music library. It also fixes clipped peaks caused by overly compressed and limited masters, and heightens the contrast between quiet and loud sections. In an in-house test on 100 files purchased from Beatport, Mixed In Key reports that Platinum Notes fixed 1.1 million clipped peaks, changed 373 decibels of volume, and improved contrast on all 100 tracks.

  Three built-in processing templates offer different sound characteristics. The Official Platinum Notes template is aimed at hi-fi listeners, producers and DJs listening at home and in the club. The Festival template is designed for night clubs, festivals and large venues. The Big Boost targets the loud mastering style popularized by Beatport releases. Expert settings allow further adjustment, and the processor-load setting controls how many songs are processed in parallel.

  Output behaviour is configurable before processing: files can be written to the same folder as the original to preserve file paths used by DJ software, written to a separate location, or set to replace the original files, in which case originals are backed up. The output file format can be chosen explicitly or set to Match Input Format to retain the original file types. Processed files are intended to feed DJ software including Serato, Pioneer DJ Rekordbox, Traktor, Ableton, Denon, Virtual DJ, DJ.Studio and Mixed In Key.

  Platinum Notes 10 is a digital download for Windows and macOS, including native support for Apple Silicon M-series chips. Activation uses a VIP code supplied by email after purchase, entered from the Personalize settings menu.
specs: |-
  - Standardizes volume across an entire music library
  - Fixes clipped peaks and heightens contrast between quiet and loud sections
  - Batch processing of music collections
  - Three built-in processing templates: Official Platinum Notes, Festival, The Big Boost
  - Expert settings for further adjustment of processing
  - Configurable processor load (number of CPU cores used sets how many songs process at once)
  - Output location options: same folder as original, separate location, or replace original files (originals backed up)
  - Output file format selectable, or Match Input Format to retain original file types
  - Supported audio formats: MP3, WAV, AIFF, Apple Lossless, OGG, FLAC
  - Designed to feed Serato, Pioneer DJ Rekordbox, Traktor, Ableton, Denon, Virtual DJ, DJ.Studio and Mixed In Key
  - Operating system: Windows 10 or macOS 10.13 and above
  - Processor: Intel Core i3 or equivalent, or Apple Silicon M1/M2 native
  - RAM: 4 GB or more
  - Installation size: 100 MB
  - Internet connection required
  - Activation via VIP code entered in the Personalize settings menu
