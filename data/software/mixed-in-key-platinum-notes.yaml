description: Audio enhancement software that standardizes volume and improves sound quality across music libraries. Repairs clipped peaks and normalizes loudness with presets for different use cases (Universal, Festival, Big Boost).
details: |-
  Platinum Notes is a standalone audio enhancement application that processes music collections for consistent loudness and quality. It normalizes loudness so every song sounds as if it was mastered by the same engineer — ideal for DJs pulling tracks from multiple labels.

  The software detects and repairs clipped peaks, and heightens contrast between quiet and loud sections to improve dynamic range. In a real-world test on 100 Beatport files, Platinum Notes fixed 1.1 million clipped peaks.

  Includes multiple processing presets: Universal for general listening, Festival for nightclubs and large venues, and Big Boost designed to match Beatport track loudness. Custom template support is available.

  Supports MP3, WAV, AIFF, Apple Lossless, OGG, and FLAC. Compatible with Apple Silicon M-chips. Output integrates with Serato, Rekordbox, Traktor, Ableton, Denon, Virtual DJ, and Mixed In Key.
specs: |-
  - Batch audio file processing
  - Volume normalization and loudness standardization
  - Clipped peak detection and repair
  - Dynamic contrast enhancement
  - Processing presets: Universal, Festival, Big Boost
  - Supported formats: MP3, WAV, AIFF, Apple Lossless (ALAC), OGG, FLAC
  - macOS including Apple Silicon (M-chips)
  - Windows compatible
  - Custom template support
