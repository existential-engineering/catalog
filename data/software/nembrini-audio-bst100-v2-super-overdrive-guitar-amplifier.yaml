description: Nembrini Audio BST100 V2 Super Overdrive Guitar Amplifier is modelled on the Soldano SLO100, capturing legendary high-gain clarity and modern versatility in one iconic amplifier.
details: |-
  "Capture legendary high-gain clarity and modern versatility in one iconic amplifier"

  Nembrini Audio BST100 V2 Super Overdrive Guitar Amplifier is modelled on Soldano SLO100*. Introduced in 1987, this iconic amp has found its place in the rigs of any genre, from screaming metal to pop music. Simple to use, versatility and great tone are the keys to the success of this beautiful all-valve guitar head.

  BST100 V2 is a masterpiece of high-gain amplification, rich harmonics, and versatile tone shaping with modern enhancements for the ultimate guitar sound. Two channels driven by four 12AX7 Virtual Tubes, carefully modelled and fine-tuned for the cutting edge 90s guitar amplifier hi-gain sound: a Normal Channel with Bright and Clean/Crunch switches, from crystal clear to a creamy crunch tone, and a Boost channel for the famous USA Hi-Gain guitar tone.

  Filters include Tight, which reduces low frequency content to tighten the low range and suits 7 and 8 string guitars, Rumbling, which reduces the low-frequency content, and Harsh, which reduces the high-frequency content. The Noise Gate offers Threshold to define the level where the gate is activated, Range to select the quantity of noise reduction, and Gate to adjust the gate speed.

  With Nembrini Audio BST100 V2 Guitar Amplifier it is possible to choose between eight different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs. A complete Mixer section with Solos, Mutes, Pans and Faders allows you to blend together the two microphones with the ambience. The Impulse Loader lets you load up to three third-party impulse responses that you can even blend together using volume, pan, phase, solo and mute controls.

  Legal Disclaimer: Soldano SLO100 is a registered trademark of Soldano Custom Amplification. BST100 V2 was developed by Nembrini Audio SRL based on its own modelling techniques. Soldano Custom Amplification has not endorsed nor sponsored the BST100 V2 in any manner, nor licensed any intellectual property for use in this product.
specs: |-
  - Modelled on the Soldano SLO100
  - Two channels driven by four 12AX7 virtual tubes
  - Normal channel with Bright and Clean/Crunch switches
  - Boost channel for USA hi-gain tone
  - Pre filters: Tight, Rumbling, Harsh
  - Noise gate with Threshold, Range and Gate speed controls
  - Eight guitar cabinets with four microphone emulations, on/off axis switch, position and distance knobs
  - Mixer section with solos, mutes, pans, faders and ambience blending
  - Impulse response loader for up to three third-party IRs with volume, pan, phase, solo and mute
  - Requires a VST2, VST3, AAX or AudioUnits compatible host
  - iOS version for iPhone and iPad
  - Intel compatible or Apple Silicon CPU, 1GB RAM
  - Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
