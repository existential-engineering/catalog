description: BST100 V2 is a guitar amplifier plugin modeled on the iconic Soldano SLO100, delivering high-gain clarity and modern versatility. Introduced in 1987, the original amp has served musicians across genres from metal to pop, and this plugin faithfully recreates its rich harmonics and versatile tone shaping.
details:
  - BST100 V2 is a meticulous emulation of the Soldano SLO100, one of the most celebrated high-gain amplifiers ever made. Introduced in 1987, the SLO100 set a new standard for clarity and dynamic response in high-gain amplification, and this plugin brings that legendary tone to your DAW with modern enhancements.
  - The plugin features two channels driven by four 12AX7 Virtual Tubes. The Normal Channel includes Bright and Clean/Crunch switches for a wide range of clean and edge-of-breakup tones, while the Boost channel delivers the amp's signature USA Hi-Gain sound with searing harmonics and tight low-end.
  - "Three onboard filters allow fine-tuning of the frequency response: Tight reduces low frequencies for extended-range 7- and 8-string guitars, Rumbling attenuates unwanted low-frequency buildup, and Harsh tames high-frequency harshness. An integrated Noise Gate with Threshold, Range, and Gate speed controls keeps the signal clean at high gain settings."
  - BST100 V2 includes eight guitar cabinet simulations and four microphone emulations, each with on/off axis positioning, distance control, and continuous position adjustments. A full mixer section with solos, mutes, pans, and faders allows detailed blending of the microphone signals.
  - An Impulse Response Loader supports up to three third-party IRs simultaneously, each with independent volume, pan, phase, solo, and mute controls for maximum flexibility in cabinet sound design.
specs: |-
  - Two channels: Normal and Boost
  - Four 12AX7 Virtual Tubes
  - Normal Channel: Bright switch, Clean/Crunch switch
  - Boost Channel: USA Hi-Gain tones
  - Filters: Tight, Rumbling, Harsh
  - Noise Gate: Threshold, Range, Gate speed controls
  - Eight guitar cabinet simulations
  - Four microphone emulations with on/off axis positioning
  - Microphone distance and continuous position controls
  - Mixer section: solo, mute, pan, fader per mic
  - Impulse Response Loader: up to three third-party IRs
  - IR blending: volume, pan, phase, solo, mute per IR
  - Formats: VST2, VST3, AAX, AudioUnits (AU)
  - macOS 10.13 or newer (Intel and Apple Silicon)
  - Windows 7 or newer
  - iOS: iPhone/iPad via Apple App Store
  - 64-bit DAW required
  - 1 GB RAM minimum
  - Version 2.0.8
