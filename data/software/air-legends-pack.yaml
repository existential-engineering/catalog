details: >-
  Air legends pack by air music technology / sonivox is a virtual instrument
  audio plugin for macos and windows. It functions as a VST plugin, an audio
  units plugin and an AAX plugin.


  Three legendary virtual instruments in one bundle: db-33: virtual classic
  tonewheel organ. Vacuum classic: monophonic vintage synthesizer featuring
  vacuum tube synthesis. Xpand 2: multitimbral all-in-one workstation.


  Windows system requirements: host application compatible with AAX native
  plugins, VST plugins, windows 10, 8 or windows 7 service pack 1, minimum dual
  core 2ghz (intel core i5 or i7 recommended), minimum ram 4gb (8gb or more
  recommended), 200mb free hard drive space for download and installation,
  internet access (download and authorization), ilok key optional, VST: all
  popular hosts supported, AU (64-bit only): qualified for logic pro x, AAX:
  protools 10.3 (32-bit), protools 11.x (64-bit), protools 12 and protools 2020.


  Macos system requirements: host application compatible with AAX native
  plugins, audio-unit plugins, VST plugins, mac os x 10.8.5-10.15, core duo
  processor (core i5 or i7 recommended), minimum ram 4gb (8gb or more
  recommended), 200mb free hard drive space for download and installation,
  internet access (download and authorization), ilok key optional, VST: all
  popular hosts supported, AU (64-bit only): qualified for logic pro x, AAX:
  protools 10.3 (32-bit), protools 11.x (64-bit), protools 12 and protools 2020.
