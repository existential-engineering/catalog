details: |-
  Automatic double tracking (not only) for vocals. This plugin copies the input four times and pans the copies alternatively left and right by a set amount, delays each by up to 100 ms and also pitch-shifts each copy by up to 150 cents.

  The maximum pan, delay and pitch-shift spread can be independently controlled by parameters as well as the cutoff frequencies of a low- and high-pass filter applied to the stereo output.

  This effect can be used to thicken up lead or background vocals or other signals that need more presence in the mix.

  It can be used as either an insert effect or as a send effect in an auxiliary bus by providing separate dry and wet signal gain parameters.

  Adt by christopher arndt is a virtual effect audio plugin for macos, windows and linux.
specs: |-
  - VST 3 plugin
  - Lv2 plugin
  - Clap plugin
  - Four-voice copying
  - Stereo panning
  - Up to 100 ms delay
  - Up to 150 cents pitch-shift
  - Low-pass filter
  - High-pass filter
  - Dry/wet signal gain parameters
  - Insert effect
  - Send effect capability
