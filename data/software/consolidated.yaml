details: |-
  Airwindows Consolidated is a Consolidated interface for all of the Airwindows plugins, providing 50+ premium-level plugins in the form of a single multi-effect.

  The plugin includes comprehensive categories: ambience (tapedelay2, doublelay, pitchdelay, sampledelay, brightambience3, triplespread, melt, mv2, mv, adt, kchamberar, stereochorus, purestecho, tapedelay, starchild2, starchild, hombre, brightambience2, brightambience, stereoensemble, stereodoubler, chorus, chorusensemble, ensemble), amp sims (grindamp, fireamp, leadamp, crickbass, lilamp, midamp, bigamp, cabs, bassdrive, bassamp), bass (orbitkick, hermepass, basskit, dubcenter, dubsub, floor, infrasonic, fathomfive), and biquads (biquadplus, biquad, biquaddouble, biquadonehalf, biquadtriple, biquad2).

  Additional plugin categories include brightness (platinumslew, debess, goldenslew, slewsonic, acceleration2, deess, smooth, everyslew, slew3, slew2, slew, air2, air, purestair, acceleration, dehiss, hypersonic, hypersonx, ultrasonic, ultrasoniclite, ultrasonicmed, ultrasonx), clipping (cliponly2, clipsoftly, onecornerclip, adclip7, aquickvoiceclip, cliponly), and extensive console emulations (console8litechannel, console8litebuss, console8busshype, console8bussin, console8bussout, console8channelhype, console8channelin, console8channelout, console8subhype, console8subin, console8subout, console0channel, console0buss, purestconsole3buss, purestconsole3channel, purestconsole2buss, purestconsole2channel, console7buss, console7channel, console7cascade, console7crunch, purestconsolebuss, purestconsolechannel, console6buss, console6channel, pdbuss, pdchannel, console5buss, console5channel, console5darkch, c5rawbuss, c5rawchannel, atmospherebuss, atmospherechannel, console4buss, console4channel, everyconsole).

  The plugin features distortion (distortion, edge, dirt, mackity, density2, density, drive, loud, hard vacuum, highimpact, multibanddistortion), dithers (ztapedither, spatializedither, vinyldither, doublepaul, ditherbox, buildatpdf, nodedither, studiotan, dithermetimbers, dithermediskers, rawtimbers, rawglitters, naturalizedither, highglossdither, ditherfloat), and dynamics (pop2, pressure5, dynamics, pop, digitalblack, logical4, varimu, buttercomp2, curve, recurve, pyewacket, blockparty, softgate, thunder, compresaturator, drumslam, buttercomp, brassrider, point, gatelope, podcastdeluxe, podcast, swell, purestsquish, pressure4, surge, surgetide).

  The consolidated interface provides a clean gui and is continuously updated with new plugins added regularly, including effects, filters, lo-fi processors, noise generators, reverbs, saturation, stereo, subtlety, tape, tone color, utility, and xyz filter categories.
