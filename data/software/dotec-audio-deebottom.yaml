details: |-
  DeeBottom is a bass booster plugin from DOTEC-AUDIO that automatically brings out rich low frequencies to achieve optimal bass balance in any listening environment. The Bottom slider intelligently adjusts bass balance according to high frequencies and amplification levels, providing a more substantial and impactful sound.

  The Warm slider delivers a rich acoustic experience even on devices with weak bass reproduction, such as smartphones and laptops. This makes DeeBottom especially useful for content creators who need their audio to translate well across different playback devices and platforms, including social media content.

  DeeBottom features a simple and intuitive interface that is easy to use while offering flexible bass control compatible with various audio sources. The plugin is designed to solve common mastering challenges such as thin audio quality and insufficient low-end impact.

  The plugin is available as a free demo with a 1-second silence inserted every 30 seconds. A full serial key license can be purchased for $50 USD, with discounts available via coupon code ($10 off), existing serial key ($15 off), or bulk purchase ($15 off on second purchase). Registration requires an internet connection.

  DeeBottom has been tested with a wide range of DAWs including Ableton Live, Cubase, Logic Pro X, ProTools, Studio One, FL Studio, Reason, BITWIG Studio, GarageBand, Audacity, OBS Studio, and many more. Both Windows (VST2/VST3/AAX, 64-bit) and macOS (VST2/VST3/AU/AAX, 64-bit, OS 10.12 or later) are supported.
