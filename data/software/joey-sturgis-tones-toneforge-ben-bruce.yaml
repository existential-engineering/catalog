details: |-
  FEATURED IN:
  Larger than life Guitar Tone!
  Toneforge ® Ben Bruce is the signature virtual guitar rig plugin of former Asking Alexandria guitarist, Ben Bruce. It’s an all-in-one suite of tools to take your direct input (DI) signal all the way to a fully-mixed, larger-than-life guitar tone!
  Ben Bruce is well known in the metal, hard rock, and post-hardcore community for his work as lead guitarist with Asking Alexandria. Over the course of his 15+ year career with the band, his playing style has paired well with a wide variety of guitar tones. By combining select elements from each Asking Alexandria production - plus key features from Ben’s live rig - this Toneforge ® rig nails the entire range of tones heard on many of Asking Alexandria’s chart topping songs.
  Dual Channel Functionality
  Toneforge ® Ben Bruce offers two channels to choose from - a heavier, dirtier Lead channel and a Clean channel that can be pushed to the point of breakup when driven harder (or when paired with the onboard Overdrive effect pedal). Achieving all of your rhythms, cleans, and leads is a breeze with this plugin!
  “I love how versatile the plugin is. Guitarists who use this product will not be limited to any one particular genre. You can go all out heavy and write riff after riff, or you can dial it back and play some tasty blues licks. The clean Channel is superb and is capable of delivering crystal clear, crisp tones or can be dirtied up enough to still sound clean and soft but provide players with the grit and balls reminiscent of early Jimmy Page licks.” - Ben Bruce
  Virtual Effects
  A big part of Ben’s tone comes from more than the amplifier he uses; it’s also the pedals he chooses to pair with the amp. In Toneforge ® Ben Bruce, we’ve added four of his favorite effects for creating heavier guitars, stadium/arena presence in the studio, and some of that shimmery, sweet processing that sounds awesome on a blazing solo!
  “I was able to take my favorite elements from working with Ben and Asking Alexandria and bring them together into this special Toneforge ® model. Huge rhythm tone, tight overdrive, and great effects for leads and ambient type material!” - Joey Sturgis
  Overdrive
  A mild distortion/overdrive pedal that enhances the dynamic response of the plugin to a guitarist’s playing. The overdrive sits in front of the amp head and can be used to push the amp further into breakup and saturation. Controls include Drive, Gain & Tone.
  Stereo Delay
  A high-definition digital delay capable of producing studio-quality stereo repeats. Users can sync the effect to their session or dial in the length of delays with the Time knob, plus four other parameters - Tone, Offset, Feedback & Mix.
  Rotary
  A rotary chorus pedal capable of producing effects similar to the Leslie Type 122 rotary speaker cabinet commonly used by Hammond B3 Organists legendary rock guitarists. Users can dial in the Tone and Mix of the effect, plus toggle between Slow/Fast Mode with a switch or via automation.
  Reverb
  A reverb pedal based on modern studio-grade reverb units. Users can dial in the Size of the reverb, the Pre Delay in the signal, the Decay of the reverb's tail, and the overall Tone & Mix of the effect.
  Use all of these effects together or toggle them off individually with software-enabled true bypass.
  JST Matched Cabinet
  To perfectly pair the cabinet with the amp’s topology, Joey Sturgis Tones developed a proprietary matched cabinet emulation that responds and reacts to changes to the amp’s settings and player’s style in the same way a physical cabinet might. This closed loop is one of the biggest benefits to having a virtual guitar rig - by controlling both the front-end inputs from the amp and the output from the cabinet, great tone can be more than captured; it can be reproduced time and time again!
  Industry Standard Mic Locker
  As any studio engineer will tell you, the cabinet is only half the battle when recording guitars in a live room. This is why we’ve also included 4 unique microphone options for your use in Toneforge ® Ben Bruce.
  Condenser
  An expensive-sounding microphone capable of capturing the full frequency spectrum in a detailed, transparent manner.
  421
  A classic dynamic microphone with more focused midrange and extended low end.
  57
  A studio workhorse dynamic microphone placed on-axis for direct, straightforward tone.
  57 off-axis
  The same studio workhorse placed off-axis for a slightly darker, rounded tone.
  Not finding the right combination? With Toneforge ® Ben Bruce’s Impulse Response loader, you can import any of your favorite cabinet/microphone combinations from your collection. Check out our impulse response packs to learn more.
  Studio-Grade Parametric EQ & Limiter
  A huge part of achieving mix-ready guitar tones comes down to the post processing, which is why we’ve included a Parametric EQ and Limiter with Toneforge ® Ben Bruce.
  Both processors are studio-grade effects units that could go toe-to-toe with the best dedicated EQ or limiters on the market, but we’ve chosen to pair them with Toneforge ® Ben Bruce so we could fine-tune them to work their best with this amp. Rest assured you’re getting a fully optimized, end-to-end guitar tone solution with this plugin.
