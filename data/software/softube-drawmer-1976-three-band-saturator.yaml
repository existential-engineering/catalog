details: |-
  Drawmer 1976 Three Band Saturator is a meticulous model of the original Drawmer 1976 Stereo Three Band Saturation and Width Processor, fully licensed and enthusiastically endorsed by Drawmer. It offers three bands of saturation and width, plus added plug-in features.

  The plug-in authentically captures the sought-after sound and features of the original Drawmer hardware so you can accurately target frequency areas of percussion, bass, synths, vocals, and full mixes. Rather than the broad-brush distortion that single-band saturation can introduce, it infuses the sound with warmth, punch, excitement and 3-D immersive qualities.

  Saturation is a sound that evokes the analog era, when recorded signals ran through various pieces of hardware, picking up that hardware's unique character as they traveled. The subtle distortion that is added lends pleasant-sounding harmonics to the mix. Multi-band saturators can do things single-band saturators cannot: with independent bands you can pull out a bassline by adding distortion to the top end without ruining the overall balance, or sweeten vocals without making the bottom sound muddy.

  Three bands of stereo width control take a mix from flat to fully 3-D, letting you position high frequencies across a wider soundstage without impacting the low end. The plug-in includes the original width mode, Analog, plus an added Digital flavor. A Mono Switch combines the stereo channels so you can hear what signal will be lost when played in mono, which makes it obvious when the width controls have been pushed too far.

  Plug-in-only additions include exclusive Low and High cut filters and improved LED metering, laid out in an interface designed to be as intuitive as possible. The plug-in is Console 1-ready and supports Softube Extended Features, which puts easy-access panels of modern conveniences alongside the analog controls. The product is dedicated to the memory of long-time Drawmer Products Manager Kieron Clough.
