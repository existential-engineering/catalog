details: |-
  BeatCounter is a simple plugin designed to facilitate beat-matching software
  and turntables. It displays the current tempo in beats per minute (bpm), and
  an accumulated average over the last few seconds.

  Beatcounter is the perfect tool for dj's that want to integrate computer
  effects with turntables or a live band.

  Beatcounter by teragon audio is a virtual effect audio plugin for macos,
  windows and linux.
