description: Your fast track to orchestral composing - for free. Take your first orchestral steps and create amazing music in no time!
details: |-
  THE ORCHESTRA ELEMENTS is the free version of Sonuscore's THE ORCHESTRA, a scoring tool used for film, TV and game music. It ships with a curated selection of instruments taken from the full library and is driven by the same ensemble-engine, so a beginner can take a first orchestral step and arrive at a finished arrangement quickly. The page describes it as immediately playable, inspiring and deliberately simple.

  The Orchestral Colors presets are practical instrument combinations that can be played live from a keyboard, so melodies or chords can be performed with common orchestral sections without programming each part. Orchestral pulses are built from MIDI input rather than pre-recorded phrases, which means the plug-in adapts to whatever chord or note is played and rhythmic arrangements stay under the player's control.

  The ensemble-engine works through a number of independent arpeggiators and velocity envelopes, the same mechanism proven across the wider THE ORCHESTRA family. Thirty inspirational presets introduce the range of the system, and the included instrument palette covers 23 string, 8 brass and 8 woodwind articulations rounded out with harp and choir.

  The library totals 4.01 GB of data with fast loading times and runs in the free KONTAKT Player from version 6.7.1 upward, so no paid sampler is needed. It is positioned as the free entry point into the THE ORCHESTRA family, with paid expansions and full versions available separately.
specs: |-
  - Breakthrough ensemble-engine built on independent arpeggiators and velocity envelopes
  - Play freely or create orchestral colors with simple chords
  - Curated selection of instruments taken from THE ORCHESTRA
  - 30 inspirational ensemble presets
  - 23 string, 8 brass and 8 woodwind articulations, plus harp and choir
  - Orchestral Colors presets: instrument combinations playable live from a keyboard
  - Orchestral pulses generated from MIDI input with no dependence on pre-recorded phrases
  - 4.01 GB of data with fast loading times
  - Works with KONTAKT / KONTAKT Player version 6.7.1 and higher
  - At least 4.01 GB of free hard disc space
