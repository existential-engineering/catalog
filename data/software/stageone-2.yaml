description: Enhance the soundstage of your stereo mix, and even bring mono
  recordings to life.
details: |-
  StageOne 2 gives you unparalleled control over aspects of your stereo field, either to widen stereo audio, add perceived depth, or even give mono signals a stereo image so they fit better in the mix. You can adjust width, depth, and mono spread without phase or mono-compatibility problems; all thanks to a unique algorithm that produces clean results every time.

  Between a wide range of applications and an intuitive interface to get your sound faster, StageOne 2 offers better results than traditional techniques. This attention to detail lets you bring depth to and compatibility between disparate audio sources, in a way you can trust.

  StageOne 2 introduces 3-band controls over the stereo soundstage with low, mid, and high bands, as well as adjustable crossover frequencies. A unique visualizer shows amplitude, frequency, and perceived stereo width of both the input and output signal.

  The Phase Recovery algorithm intelligently identifies and re-aligns out-of-phase components, skillfully avoiding information loss when summed to mono.
specs: |-
  - Widen stereo audio while leaving the phantom center untouched
  - Add perception of depth with directionally optimized reflections
  - Add rich stereo image to mono sources without sacrificing mono compatibility
  - Phase Recovery algorithm for out-of-phase component realignment
  - 3-band controls (low, mid, high) over the stereo soundstage
  - Adjustable crossover frequencies
  - Unique visualizer showing amplitude, frequency, and perceived stereo width
  - Mac OSX 10.13+ with Apple M1-Native support
  - Windows 8, 10 (64-bit only)
