details: |-
  Polymode is inspired by the groundbreaking Moog Polymoog synthesizer. One of
  the world's first polyphonic synthesizers, its unique multiple parallel filter
  implementation and mod routings give it a sound like no other synth.

  Cherry Audio's Polymode sidesteps all of the drawbacks of the original
  instrument and massively expands its capabilities. With a streamlined user
  interface and immense modulation capabilities, Polymode sets a new standard
  for animated, sonically evolving string, pad, and choral tones.

  Polymode precisely recreates the unusual paraphonic architecture of the
  original with 32-voice polyphony, extensive modulation routings for almost all
  synthesis parameters, and numerous modulation sources including velocity,
  pressure, and noise. Super accurately recreated mode filters and an expanded
  resonators section round out the faithful recreation.

  Integrated effects include ensemble, phaser, tempo-synced echo, and reverb,
  along with a classic Solina-style tri-chorus mode. Two bonus LFOs with five
  waveforms and tempo sync provide additional modulation possibilities. With
  over 150 presets and full MIDI control, Polymode delivers the iconic Polymoog
  sound in a modern package.
specs: |-
  - Precisely recreated unusual paraphonic architecture
  - 32-voice polyphony
  - Over 150 presets
  - Extensive modulation routings for almost all synthesis parameters
  - Numerous modulation sources including velocity, pressure, and noise
  - Simultaneously available saw and pulse waves for both oscillator ranks
  - Super accurately recreated mode filters
  - Expanded resonators section with LFO, 12dB/24dB slopes, and notch mode
  - Classic 24dB ladder-style filter
  - Integrated ensemble, phaser, tempo-synced echo, and reverb effects
  - Classic Solina-style tri-chorus mode
  - Two bonus LFOs with five waveforms and tempo sync
  - Advanced one-click UI magnification
  - Full MIDI control and DAW automation for all controls
