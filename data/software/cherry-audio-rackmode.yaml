details: |-
  Rackmode Signal Processors is a bundle of seven virtual effects and an
  instrument plugin that replicate the classic rack-mounted Moog Signal
  Processors of the 1970s and 80s.

  Cherry Audio's Rackmode Signal Processors collection represents a
  first-time opportunity for producers to explore these studio-quality
  vintage effects that were originally prohibitively expensive and
  extremely rare.

  If tracked down and purchased today, the original hardware would cost
  well over $20,000. Cherry Audio is introducing the entire Rackmode
  Signal Processors bundle at an introductory price, less than $13 per
  plugin.
specs: |-
  - Rackmode Vocoder (instrument and effects versions)
  - Rackmode 12-Stage Phaser
  - Rackmode Ring Modulator
  - Rackmode String Filter
  - Rackmode Frequency Shifter
  - Rackmode 10-Band Graphic EQ
  - Rackmode 3-Band Parametric EQ
