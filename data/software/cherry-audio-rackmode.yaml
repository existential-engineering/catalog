details: |-
  Rackmode Signal Processors is a bundle of seven virtual effects and an instrument plugin that replicate the classic rack-mounted Moog Signal Processors of the 1970s and ‘80s. This collection is the first time this entire line of renowned analog treasures has been recreated as virtual effects.

  Rackmode marks a collaboration with award-winning synth designer and DSP legend Mark Barton (MRB), who modeled the circuit-precise emulations based on the original rack-mounted hardware. The collection includes Rackmode Vocoder (instrument and effects versions), Rackmode Phaser, Rackmode Ring Modulator, Rackmode String Filter, Rackmode Frequency Shifter, Rackmode Graphic EQ, and Rackmode Parametric EQ.

  The vintage effects are expanded with additional features aimed at today's music producers, including presets, syncable LFOs, stereo processing, and full Apple Silicon M1 native support. These effects capture not only the deep sounds and capabilities of the original Signal Processor line, but also the elegant look and heritage of their rack-mounted enclosures.

  In the late ‘70s and early ‘80s, Moog Music Inc., (then owned by Norlin Music, Inc.) wanted to extend their reach further into the production studio. They created the Signal Processor family of rack-mounted products featuring the 16 Channel Vocoder (designed by pioneer Harald Bode), the 12 Stage Phaser, and the Ten Band Graphic and Three Band Parametric Equalizers. Other related rack products were the Harald Bode-designed Frequency Shifter and Ring Modulator, and the singular String Filter created by Moog's Custom Engineering Group.

  The Moog Signal Processors have found a place in production facilities worldwide, both past and present. Artists like Wendy Carlos, Yellow Magic Orchestra, Tangerine Dream, John Carpenter, Genesis, Jan Hammer, Mouse on Mars, and Coldplay have used them to shape their distinctive sounds. Producers as diverse as Giorgio Moroder, Mike Elizondo, and Sylvia Massy have cited these black boxes as treasured parts of their studio gear.
specs: |-
  - Eight circuit-precise emulations based on the original rack-mounted hardware
  - Rackmode Vocoder: two versions of the 16 channel classic, an instrument plugin with a built-in dual oscillator and an effects plugin to modify other input formats and DAW tracks
  - Rackmode Phaser: based on the 12 stage original known for its lush, sweeping textures
  - Rackmode Ring Modulator: based on Moog's Harald Bode Ring Modulator with Squelch control
  - Rackmode String Filter: based on the system created by Moog's Custom Engineering Group, using filter arrays that mimic acoustic string instruments
  - Rackmode Frequency Shifter: mixes two external inputs or sidechains a single input with its own built-in oscillator, modifying the ratio of incoming frequency components
  - Rackmode Graphic EQ: ten selectable frequency bands with Drive and Gain controls
  - Rackmode Parametric EQ: three bands for sculpting Low, Mid, and High-frequency ranges
  - Provided as individual standalone applications and separate DAW plugins, with no stack effects styled interface
  - User preset library, including over 150 presets for common uses and instruments
  - Sync to DAW master tempo
  - Selectable mono/stereo modes
  - Highly optimized coding for high performance with ultra-low CPU load
  - Full MIDI control and DAW automation for all controls
  - Full Apple Silicon M1 native support
  - macOS requirements: 10.13 or above, macOS 13 Ventura supported, 64-bit required, native Apple M1 or greater processor support including Ultra, 3.4 GHz Quad-Core or M1 CPU with 8GB of RAM recommended
  - Windows requirements: Windows 7 or above (including Windows 11), 64-bit required, quad-core computer with 8GB of RAM recommended
  - Rackmode Vocoder requires a sidechain-capable DAW
  - Internet connection required for product activation
