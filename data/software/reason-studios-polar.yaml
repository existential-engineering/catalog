description: >-
  Polar is a harmonizing and pitch-shifting effect that combines classic
  functionality with modern capabilities. It features four re-pitching
  algorithms, dual pitch shifters with feedback, transparent pitch-shifting,
  stereo-widening, and harmonies up to two octaves above or below the original
  signal. Additional creative tools include buffer looping, an audio freeze Lock
  function, and MIDI keyboard pitch-shift control.
