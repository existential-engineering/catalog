details: |-
  Inspired by some of our favorite vintage computers and gaming systems, 8-bit synth delivers a massive collection of authentic sounds created with the hardware. Dial up custom patches created with the commodore 64, game boy, sid station, mode machine and more, and create brand new sonic adventures with the genuine sounds of these classic machines.

  A fantastic instrument for crafting chip tunes and beyond, 8-bit synth digs deep into the capabilities of the hardware and delivers a surprisingly sweet range of sounds covering everything from classic video game favorites to modern genre-style patches.

  Starting with a deep sampling of retro computers, game systems and vintage-inspired instruments, 8-bit synth gives you 375 high-quality patches created by our sound design team, arranged into categories including; bass, brass, chip mod, chords, composite, drums, fx, keys & bells, leads, pads, plucks, polysynth, sweeps, and waveforms, each loaded with ready-to-inspire sonic destinations that can work equally well as starting points for you to tweak and build upon.

  Internally 8-bit synth is made up of two layers, with layer 1 presenting sounds from the sid, and layer 2 loaded with sounds from devices like the gameboy, mode machine, commodore 64, and more, allowing you to quickly and easily explore new combinations and create your very own hybrid sounds.

  Designed to be a source of fun and inspiration, 8-bit synth delivers a huge range of authentic retro chip sounds not to be missed.
specs: |-
  - Dual-layer engine
