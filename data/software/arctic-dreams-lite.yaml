details: >-
  Arctic dreams lite is a free virtual instrument that offers rich cinematic
  ambiance through its dual-layered piano soundscapes, featuring an acoustic
  layer captured from a yamaha c3 piano and a synthetic layer of sound pads
  derived from the same original recordings.


  These layers were designed using a variety of digital processing techniques,
  including reverbs, morphing and structural effects, to create a versatile
  sound palette.


  Designed to complement a wide range of genres from ambient to pop, hip hop,
  trap, edm, and house, arctic dreams also caters to the needs of cinematic
  production, filmmakers and sound designers.


  It is compatible with windows and mac in VST/vst3/AU plugin formats,
  supporting 64-bit systems.


  Samples meticulously edited one by one. Easy to use. Not compatible with
  protools.
specs: |-
  - VST plugin
  - Vst3 plugin
  - Audio units plugin
  - 7 multi-sampled piano presets
  - 2 layers
  - Lfo modulation controls
  - Lowpass/highpass filter cutoff
  - Adsr envelope controls
  - Built-in distortion
  - Built-in delay
  - Built-in reverb
  - Windows 8.1/10/11 compatible
  - Macos 10.14 and above compatible
  - 64-bit systems
  - 890 mb disk space
  - 500 mb ram
  - Universal 2 binary
  - 100% royalty free
  - Sample based rompler
