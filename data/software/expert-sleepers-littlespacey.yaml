description: Little Spacey is a delay effect inspired by classic analogue bucket
  brigade delays, with refinements only possible in the digital arena and a
  maximum delay time that would be very costly to realise in hardware. It works
  in mono, stereo or multi-channel settings and can modulate its delay time for
  chorus and vibrato effects.
details: |-
  Little Spacey is a delay effect inspired by classic analogue bucket brigade delays, but with refinements only possible in the digital arena, including a maximum delay time that would be very expensive to realise in hardware.

  Expert Sleepers has taken great care to give Little Spacey the smooth, creamy sound that keeps analogue delays popular today.

  In common with the best analogue delays, Little Spacey allows the delay time to be modulated for chorus or vibrato effects.

  Unlike most analogue delays, Little Spacey is not restricted to mono operation. It works well in stereo or multi-channel settings, the latter in the Audio Unit version only, and offers variation of the effect between the channels for particularly rich and involving sounds.
specs: |-
  - 64 bit AU, AAX and VST formats
  - macOS and Windows
  - Modulation of the delay time for chorus and vibrato effects
  - Mono, stereo and multi-channel operation (multi-channel in AU only)
  - Activation through an ilok.com account, to an iLok, the iLok Cloud or the local machine
  - A physical iLok is not required
  - 7 day trial available by launching the plug-in without a license
