description: Finisher RETRO is a multi-effect plug-in that captures the classic reverbs, delays, flangers, tube saturation and tape hiss of 1960s to 1990s records.
details: |-
  Do you ever play classic records and think "That. Sounds. GREAT! How do I get that 60s (or 70/80/90s) vibe in my track?" With Finisher RETRO, it's easy. UJAM's experts have done the hard work and captured the classic reverbs, delays, flangers, tubes, tape hiss and magic for you. Just load RETRO and go!

  RETRO is so much more than just one effect. Each of its modes is a web of up to 20 interconnected sound modules. It's like having a huge pedal board AND rack of studio gear with everything set just right.

  Finisher RETRO's modes are presented in decades, from 60s, 70s, 80s or 90s. Each mode is carefully crafted by UJAM's sound designers to give you an authentic snapshot of a great sound from that decade.

  Don't worry, you're never stuck with RETRO's presets. The FINISHER and VARI knobs let you easily push each preset in different directions from "light and subtle hint" to "laying it on real thick!"
specs: |-
  - 50 modes presented in decades, from 60s to 90s
  - 100 individual presets created from the modes
  - Each mode is a web of up to 20 interconnected sound modules
  - FINISHER and VARI knobs for fast, easy tweaking
  - Operating systems: Windows 10 to Windows 11, macOS Catalina (10.15) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 4 GB of RAM
  - 0.354 GB of disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App, or downloadable installer file
  - Authorization: quick authorization via the UJAM App, or email and password within the plug-in
  - Works on macOS and Windows with all major DAWs, including Ableton Live, Logic Pro, Pro Tools, FL Studio, Cubase, Studio One, Bitwig, Reaper and Reason
  - All MIDI phrases and included sounds are royalty-free
