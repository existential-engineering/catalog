details: |-
  Blackice Beta Gamma Bass Amplifier plugin is based on Darkglass Alpha Omega 900 bass guitar head with a virtual recording chain worthy of the best recording studios. This innovative bass amplifier combines a custom-tuned overdrive/distortion circuit, a studio-grade VCA compressor and a flexible six-band graphic equalizer.

  In the amp section, you can blend the clean signal with the incredible Beta Gamma Distortion circuit that can morph from tight and defined overdrive to raw and brutal distortion. A custom VCA style compressor allows you to optimize the bass signal before hitting the six bands graphic equalizer carefully tuned to sculpt your bass tone.

  To obtain a great and usable modern bass sound Nembrini Audio has included an enhanced recording chain with 4 selected bass guitar cabinets and 4 microphone emulations, plus a parallel D.I. Out signal with a console-style compressor that you can blend with 3 ambient sounds. When available in the selected bass cab you can also adjust the tweeter level.

  Instead of the included bass cabs, you can also use your favourite cab impulse responses utilizing the built-in Impulses Loader that let you load up to two 3rd-parties impulse responses, blend them together and mix them with the amplifier D.I. output. A useful browser window has been added so you can easily search through all your third parts IR files.

  Nembrini Audio has also included the Bass Enhancer circuit inspired by Little Labs Voice Of God to increase your low end. This is a fundamental tool for your five-string bass guitar tone!
specs: |-
  - Based on the Darkglass Alpha Omega 900 bass guitar head
  - Custom-tuned overdrive/distortion circuit, blendable with the clean signal
  - Studio-grade custom VCA style compressor
  - Six-band graphic equalizer tuned for bass
  - 4 bass guitar cabinets and 4 microphone emulations with adjustable tweeter level where available
  - Parallel D.I. Out signal with console-style compressor, blendable with 3 ambient sounds
  - Impulse response loader for up to two third-party impulse responses with browser window
  - Bass Enhancer circuit inspired by Little Labs Voice Of God
  - Noise gate
  - Plugin Formats: a VST2, VST3, AAX or AudioUnits compatible host
  - System: an Intel compatible or Apple Silicon CPU, 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
