details: |-
  Blackice Beta Gamma Bass Amplifier plugin is based on Darkglass Alpha Omega 900 * bass guitar head with a virtual recording chain worthy of the best recording studios. This innovative bass amplifier combines a custom-tuned overdrive/distortion circuit, a studio-grade VCA compressor and a flexible six-band graphic equalizer. In the amp section, you can blend the clean signal with the incredible Beta Gamma Distortion circuit that can morph from tight and defined overdrive to raw and brutal distortion.
