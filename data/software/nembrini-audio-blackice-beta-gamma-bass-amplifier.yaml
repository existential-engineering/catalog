description: A bass amplifier plugin modeled after the Darkglass Alpha Omega
  900, featuring a custom-tuned overdrive/distortion circuit, a studio-grade VCA
  compressor, and a flexible six-band graphic equalizer.
details: |-
  Blackice Beta Gamma Bass Amplifier is a plugin modeled after the Darkglass Alpha Omega 900 bass head. At its core is the Beta Gamma Distortion Circuit, which blends a clean signal with distortion ranging from tight overdrive to raw, aggressive distortion.

  The plugin includes a VCA Style Compressor that optimizes the bass signal before the EQ stage, followed by a Six-Band Graphic Equalizer for detailed tonal sculpting. A Bass Enhancer circuit inspired by the Little Labs Voice Of God adds powerful low-end enhancement.

  Four selected bass guitar cabinet emulations are included, each with four microphone emulation choices, plus an Impulse Response Loader that supports up to two third-party IR files for further cabinet customization.

  A Noise Gate circuit is built in to keep the signal clean, and a D.I. Out section provides a parallel signal path with a console-style compressor and three ambient sound options for direct recording scenarios.
specs: |-
  - Modeled after the Darkglass Alpha Omega 900 bass head
  - Beta Gamma Distortion Circuit with clean/distortion blend control
  - VCA Style Compressor
  - Six-Band Graphic Equalizer
  - 4 bass guitar cabinet emulations with 4 microphone emulations each
  - Impulse Response Loader (up to 2 third-party IR files)
  - Bass Enhancer inspired by Little Labs Voice Of God
  - Noise Gate
  - D.I. Out with console-style compressor and 3 ambient sounds
  - macOS 10.13 or newer (Intel and Apple Silicon)
  - Windows 7 or newer (64-bit)
  - iOS (iPhone/iPad via Apple App Store)
  - 1 GB RAM minimum
  - 64-bit DAW required
  - Version 1.0.10
