description: Panagement is a popular stereo placement tool, with binaural pan, algorithmic room simulation and distance control.
details: |-
  Panagement is the spatialization laboratory that has found its way to thousands of studios around the world. Panagement gives you raw power over your stereo tracks.

  The Binaural Distance Panner lets you position a track anywhere in the sound field, the Reverb increases realism of distance modeling with automatic early and late reflections, Width and Tilt open your mix to unforeseen decisions, the LFO dramatically extends the possibilities (eg: reverb ducking), the Binaural Delay revisit the product, allowing more spatial complexity, and it comes with the sought-after PGMT-400 chip mod.

  With uniquely integrated Delay, Reverb, and Binaural processing, Panagement push the limits of practical teleportation.

  Panagement is freemium: Panagement FREE gets everything except the Delay and PGMT-400 chip, while Panagement FULL gets everything.

  Panagement's algorithmic reverb, as opposed to being more diffusive than reality, is sparse like reality. For this reason it easily fits in the mix, even on the master bus, and save precious headroom. Panagement is realistic by default, and then allows for unnatural customization.
