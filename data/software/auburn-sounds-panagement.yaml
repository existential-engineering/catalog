description: Spatialization laboratory plugin featuring a binaural distance
  panner, algorithmic reverb, width and tilt controls, LFO modulation, and
  binaural delay for spatial sound design.
details: |-
  Panagement is a spatialization laboratory plugin providing comprehensive
  spatial sound design capabilities for stereo tracks. It features a binaural
  distance panner that positions tracks precisely within the sound field for
  immersive stereo imaging.

  The plugin includes an algorithmic reverb with a sparse, realistic design
  featuring both early and late reflections. Width and Tilt controls allow
  detailed manipulation of the stereo image, while an LFO provides modulation
  capabilities for animated spatial effects.

  The Full Edition adds a binaural delay and the PGMT-400 chip mod for
  additional character and creative spatial processing options. These features
  extend Panagement beyond basic panning into a complete spatial design toolkit.

  Available in Free and Full editions, Panagement is suited for creative spatial
  sound design, mixing, and any application where precise stereo positioning and
  spatial depth are needed.
specs: |-
  - Binaural Distance Panner
  - Algorithmic Reverb with early and late reflections
  - Width control
  - Tilt control
  - LFO modulation
  - Binaural Delay (Full Edition)
  - PGMT-400 chip mod (Full Edition)
