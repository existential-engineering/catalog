description: A software emulation of the iconic 1993 Novation Bass Station
  analogue synthesizer, developed by GForce Software in collaboration with
  Novation. The plugin preserves the original's raw, punchy, and unmistakably
  analogue character while adding modern enhancements including polyphony,
  advanced modulation, sequencing, and effects.
details: |-
  Designed during a period when digital synthesisers dominated, the Bass Station brought analogue warmth and grit back into the spotlight, making it a cult favourite among producers. Known for its punchy bass, portable size, and affordable price, it quickly became a favourite among producers and electronic musicians who craved an accessible analogue sound with a modern twist.

  The GForce Bass Station delivers a sound as powerful and textured as the iconic Roland TB-303 that its 24dB filter is meant to emulate. Its distinctive filter sweeps and lively oscillators allow for expressive bass lines and leads, from smooth, rounded tones to biting, edgy textures.

  The Novation Bass Station by GForce has been entirely crafted from the ground up and richly enhanced. The signal path retains the authentic tones of the original while adding a new waveform, a sub oscillator, FM, noise, LFO sync and retrig, discreet key tracking for the 24dB filter, additional mod sources, pan spread and a vintage knob. Unlike the monophonic original, polyphony up to 16 voices and mono unison have been added, alongside a high-pass filter and distortion, chorus, delay and reverb effects.

  Using GForce's X-Modifier technology, the X-LFO and X-ADSR sections enable modulation of almost every parameter without having to set up modulation paths, and a dedicated screen monitors the output of the X-Modifier. Two versatile macros give real-time control over key parameters and can themselves be modulated by the sequencer. The built-in arpeggiator and modern sequencer include individual step length, velocity, slide, swing, accent, probability, two macro tracks, arp chords, scales and extensive randomisation options.

  The instrument ships with over 300 brand-new production-ready presets from sound designers and artists including Zardonic, Alex Jann, Jogging House, Polydata, GEOsynth, Jordan Passmore, Boudicca Bass Service, Dave Spiers and Graeme Rawson, browsable through a preset browser with extensive tagging, sorting and search.
specs: |-
  - Modes: Mono, Unison, Poly (up to 16 voices)
  - Filters: 2-pole or 4-pole with resonance
  - Oscillators: dual with sub-oscillators and FM
  - Modulation: X-LFO and X-ADSR (X-Modifier system)
  - Sequencer: built-in with macro automation
  - Arpeggiator: with scales and chord support
  - Effects: High-Pass Filter, Distortion, Chorus, Delay, Reverb
  - 300+ presets from professional sound designers
  - mac: Intel & Apple Silicon native, macOS 10.13+
  - windows: Windows 7+, 2GHz CPU, 2GB RAM
