description: A software emulation of the iconic 1993 Novation Bass Station analogue synthesizer, developed by GForce Software in collaboration with Novation. The plugin preserves the original's raw, punchy, and unmistakably analogue character while adding modern enhancements including polyphony, advanced modulation, sequencing, and effects.
details: |-
  Novation Bass Station is an authentic software emulation of the 1993 Novation Bass Station analogue synthesizer, developed by GForce Software in close collaboration with Novation. It faithfully recreates the hardware's raw, punchy, and unmistakably analogue character while bringing it fully into the modern DAW environment.

  The plugin expands on the original hardware with polyphony up to 16 voices across Mono, Unison, and Poly modes, allowing everything from classic monophonic basslines to full polyphonic pads and leads. The oscillator section retains the original's character while adding sub-oscillators and FM capabilities for extended sound design range.

  GForce has added X-Modifier technology — an X-LFO and X-ADSR system — that layers an additional modulation network over the classic signal path. A built-in sequencer with macro automation and an arpeggiator with scale and chord support are included, along with an effects chain featuring high-pass filter, distortion, chorus, delay, and reverb.

  The plugin ships with over 300 presets curated by professional sound designers. The fully resizable UI includes a preset browser with tagging and search.
specs: |-
  - Modes: Mono, Unison, Poly (up to 16 voices)
  - Filters: 2-pole or 4-pole with resonance
  - Oscillators: dual with sub-oscillators and FM
  - Modulation: X-LFO and X-ADSR (X-Modifier system)
  - Sequencer: built-in with macro automation
  - Arpeggiator: with scales and chord support
  - Effects: High-Pass Filter, Distortion, Chorus, Delay, Reverb
  - 300+ presets from professional sound designers
  - mac: Intel & Apple Silicon native, macOS 10.13+
  - windows: Windows 7+, 2GHz CPU, 2GB RAM
