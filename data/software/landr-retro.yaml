details: |-
  LANDR Retro is a multi-layered lo-fi instrument that combines sampled electric keys, analog-style synthesis, and a dedicated mini-wave engine. Layer three unique sound sources to create everything from dusty bedroom pop pianos to hazy, wobbling soundscapes with authentic vintage grit.

  Generate professional lo-fi sounds with vintage tones in seconds. Transform simple MIDI into living soundscapes with organic studio warmth.

  Create deep, complex patches by blending three distinct sound layers. Combine a steady piano foundation with a drifting synth pad and a gritty mini-wave sub-layer. Each engine features dedicated controls to ensure your sound is uniquely yours.

  Fine-tune your textures with high-end effects designed for instant character. Use the Space engine to intelligently analyze your audio and dial in the ideal reverb. Add stereo width with Dimension or heavy drive with Amp to make your tracks cut through the mix.

  Infuse your tracks with authentic lo-fi saturation. Select from Vinyl, Digit, Bitcrush, and Tape to introduce the organic noise and texture that gives a track its soul. Whether you need the crackle of a dusty record, the lo-fi grit of an early sampler, or the warm magnetic hiss of a worn-out cassette, the final character is yours to shape.
specs: |-
  - Dynamic layer mixing: independently toggle and gain-stage the Keys, Synth, and Mini-wave engines
  - Precision sound sculpting: individual ADSR envelopes and dedicated tone knobs for each of the three engines
  - Advanced randomizer: dedicated randomization buttons for individual layers or global settings
  - Mix-ready presets curated for real musical performance across genres
  - Space engine reverb, Dimension stereo width, and Amp drive effects
  - Lo-fi saturation modes: Vinyl, Digit, Bitcrush, Tape
  - macOS: VST3 64b, AAX 64b, AU 64b
  - macOS: Apple Silicon Native
  - macOS 10.15 and newer
  - Windows: VST3 64b, AAX 64b
  - Windows 10 and newer
  - 120 MB of disk space
  - At least 4GB of memory
