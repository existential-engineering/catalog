description: >-
  Repro-5 is a polyphonic virtual analog synthesizer by u-he, modeled after
  the Sequential Circuits Prophet-5. Part of the Repro suite alongside
  Repro-1, it is known for its detailed component-level analog circuit
  emulation and authentic vintage sound.
details: |-
  Repro-5 is u-he's meticulous recreation of the Sequential Circuits
  Prophet-5, one of the most revered polyphonic analog synthesizers ever
  made. Using the same component-level modeling approach as Diva, Repro-5
  captures the Prophet-5's sound at the circuit level.

  The five-voice polyphonic architecture features two oscillators per
  voice with sawtooth, pulse (variable width), and triangle waveforms,
  plus oscillator sync and white noise. The resonant low-pass filter
  faithfully models the CEM3320 chip used in the original Rev 3.3
  Prophet-5.

  Poly Mod — the Prophet-5's signature modulation feature — is fully
  implemented, routing Filter Envelope and Oscillator B as modulation
  sources to Oscillator A frequency, pulse width, and filter cutoff.
  This enables complex FM-like timbres, metallic textures, and
  animated sounds.

  Beyond the faithful recreation, Repro-5 adds modern enhancements:
  an expanded effects section (chorus, phaser, delay, reverb), an
  arpeggiator, and extended modulation options. The Tweaks page
  provides access to circuit-level parameters like temperature drift,
  component aging, and voice calibration — allowing the sound to range
  from pristine to characterfully imperfect.

  Repro-5 ships bundled with Repro-1 (a monophonic Pro-One emulation)
  as the complete Repro suite.
specs: |-
  - Component-level Prophet-5 circuit modeling
  - 5-voice polyphony
  - 2 oscillators per voice (saw, pulse, triangle)
  - Oscillator sync and white noise
  - CEM3320 modeled low-pass filter
  - Poly Mod (filter env + osc B to osc A freq, PW, filter)
  - 2 ADSR envelopes
  - LFO with multiple waveforms
  - Unison mode with voice detune
  - Tweaks page (drift, aging, calibration)
  - Built-in effects (chorus, phaser, delay, reverb)
  - Arpeggiator
  - Preset browser with categories
  - Bundled with Repro-1 (Pro-One emulation)
  - VST3, AU, AAX formats
  - macOS, Windows, Linux
