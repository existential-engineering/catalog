details: >-
  Apotheca is the new standard of multi-effect modulation. Apotheca has lfo
  independence, so you can drag and drop any of the twelve lfos onto any of
  apotheca's controllers. Unlike other shaper-tools apotheca has two dropboxes
  per control, so multiple lfos can modulate controls.


  Apotheca goes deeper than other shaper-tools, because not only can you
  modulate, but you can also create your own non-linear control paths with
  minimaps. Apotheca also boasts a plethora of modes to work with; ladder
  filters, state variable filters, shelving filters, multi-notch phasers, c259
  distortion, combs, taps, verbs, and more.


  Apotheca's lfos are routed for MIDI retriggering. Complexities are simplified
  by compartmentalizing features; allowance of duplicate effects, drag and drop
  connections, and click and drag to adjust modulation amounts.


  Completely scalable graphics and resizable interface. Creative control to make
  custom multi-effects. Platform agnostic xml presets. Deep sizzling comb
  filters. Artefact-free filters. Lush reverberations that fill the room.
  Millions of combinations. Hundreds of thousands of ways to modulate your
  sound.
