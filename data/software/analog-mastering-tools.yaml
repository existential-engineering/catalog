details: >-
  Analog mastering tools (a.m.t.) is a collection of three dynamics plug-ins -
  a.m.t. Amp leveler, a.m.t. Max warm and a.m.t. Multi max.


  A.m.t amp leveler is a look-ahead brickwall limiter and level maximization. It
  has been designed to be used for mixing, mastering, tracking and live use.


  A.m.t max warm is a look-ahead brickwall limiter, equalizer and level
  maximizer. What makes the a.m.t max warm process unique is the approach used
  for its dynamic signal analysis. Internally, the a.m.t max warm uses a special
  processing algorithm to accurately maximize the incoming signal level while
  limiting the ceiling peak levels. This approach tends to produce a more
  natural warm-sound, the a.m.t max warm also includes a two-band equalizer
  (shelving/peaking) with adjustable frequencies.


  A.m.t multi max multiband peak limiter is a 3 band look-ahead brickwall
  limiter, and level maximizer. The a.m.t multi max uses a special processing
  algorithm to accurately split and maximize the incoming signal level while
  limiting the ceiling peak levels. This approach tends to produce a loud and
  clear natural warm-sound. The a.m.t multi max 3 band crossover with adjustable
  frequencies delivers sweet highs and punchy lows.
specs: |-
  - Look-ahead brickwall limiter
  - Level maximization
  - High quality signal processing algorithms
  - Gain (max level) variable from 0db to +30db
  - Ceiling variable from 0db to -30db
  - Reduction (threshold compression) up to -30db
  - Full automation for all parameters
  - 24-bit / 192 khz supported
  - VST plugin
  - Audio units plugin
  - AAX plugin
  - Pc and mac os x
  - Two-band equalizer (shelving/peaking)
  - Low and high shelving controls - boost / cut up to 12db
  - Low frequency variable from 60 hz to 800 hz (shelving/peaking)
  - High frequency variable from 1.2 khz to 16 khz (shelving/peaking)
  - Recovery (release time) from 10ms to 999ms
  - 3-band crossover high quality signal processing algorithms
  - Low, mid and high bands gain controls - boost / cut up to 12db per band
  - Easy-to-use vintage interface
