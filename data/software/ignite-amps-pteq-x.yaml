description: PTEq-X is a digital emulation of 3 famous vintage passive program equalizers. It has been developed to have all the characteristics of the original hardware, plus some circuit improvements and additional features to increase its versatility.
details: |-
  Three different equalization modules with analog curve response at all frequencies
  Ignite Amps 3rd generation triode stage analog modeling for four tube types
  Additional selectable frequencies for the PEQ1A model
  Refined filter frequency precision for MQ5 and HL3C models
  Switchable equalizers and tube stage modeling for CPU management
  Switchable linear phase oversampling for aliasing reduction
  Global input/output level controls
  Mono/Stereo processing support
  Double precision (64-bit) floating point processing
  Fully automatable controls
  Proprietary preset management with bank file import/export
