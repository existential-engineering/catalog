description: "DRUMFORGE is the fastest, most creative and powerful drum sampler on the market. Built from the ground up to be optimized for speed and performance so you can spend less time waiting and more time creating."
details: |-
  Drumforge Classic is a drum sampler for writing, performing, and mixing realistic drums without needing a drummer, world class recording studio, or hundreds of thousands of dollars in gear. Its hyper-optimized and lightning fast drum sample engine lets you spend less time waiting and more time creating.

  The sampler includes an award-winning sample library featuring 54 drums and 14 cymbals, sourced from a unique collection of highly sought-after drums chosen for their sound on recordings. Each drum has been carefully multi-sampled using a variety of clever engineering techniques to provide endless possibilities in drum tone creation. The library won the Pro Tools Expert Editor's Choice Award and has been featured on major label recordings, radio singles, and television broadcasts.

  To complement the sample library, Drumforge Classic features a powerful premium mixing engine with built-in DSP modules designed specifically for mixing drums. The mixing environment allows near-exact recreations of favorite drum mixes, with included presets from the Drumforge team. Users can change engineering setups and select processed or unprocessed samples per microphone for unparalleled flexibility.

  The plugin ships with fully configurable MIDI mapping and presets to help interpret maps from other samplers. It includes a perpetual license with free lifetime updates and unlimited customer support, and requires a 13.6 GB installation. Apple Silicon native compatibility is included.
specs: |-
  - 54 drums and 14 cymbals from award-winning sample library
  - Hyper-optimized and lightning fast drum sample engine
  - Built-in DSP mixer designed specifically for drums
  - Flexible microphone selection with processed and unprocessed samples per mic
  - Fully configurable MIDI mapping with presets for other sampler map interpretation
  - Intuitive UI for quick drum kit creation
  - 13.6 GB installation file
  - Windows 8.1 and higher (64-bit): VST3, AAX
  - Mac OS X 11 and higher (64-bit): VST3, AU, AAX
  - Apple Silicon native compatible
  - Perpetual license with free lifetime updates
