description: Drumforge Classic is a drum sampler plugin built around an award-winning multi-sampled library of 54 drums and 14 cymbals, paired with a mixing engine whose DSP modules are designed specifically for drums so full mixes can be built without leaving the plugin.
details: |-
  Drumforge Classic is a drum sampler designed for writing, performing, and mixing realistic drums without a drummer, a large recording studio, or an expensive gear collection. The engine was built from the ground up for speed, and the interface is aimed at getting a usable kit together quickly, whether for a songwriting sketch or a finished mix.

  The included library is a collection of drums selected for how they sound on record, each multi-sampled using a range of engineering techniques so tone can be reshaped from a fader rather than a new sample set. The library won the Pro Tools Expert Editor's Choice Award and has appeared on major label recordings, radio singles, and television broadcasts.

  A premium mixing engine sits on top of the library, with built-in DSP modules designed specifically for drums. The mixing environment supports near-exact recreations of familiar drum mixes, and Drumforge ships several of its own as presets, so a complete drum sound can be finished inside the plugin.

  Drumforge positions the sampler as user-directed: feature requests and updates are made available free for the lifetime of the product, with no paid minor updates. MIDI mapping is fully configurable and ships with presets to help interpret maps from other samplers.
specs: |-
  - Drum sampler for writing, performing, and mixing realistic drums
  - Hyper-optimized drum sample engine
  - Award-winning sample library of 54 drums and 14 cymbals
  - Pro Tools Expert Editor's Choice Award winner
  - Per-microphone engineering setups with processed or unprocessed sample selection
  - Built-in mixer with DSP designed specifically for drums
  - Fully configurable MIDI mapping with presets for other samplers
  - 13.6 GB installation file
  - Apple Silicon native compatible
  - Includes user manuals
