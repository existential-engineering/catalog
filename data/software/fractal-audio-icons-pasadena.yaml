description: PASADENA delivers 5153-style amp modeling for hard rock, metal, and
  heavy modern tones, with HD DynaCabs and premium effects.
details: |-
  ICONS: Pasadena is the second release in the ICONS series, built around 5153-style amps for hard rock, metal and heavy modern tones. It expands the lineup with a focused collection of 19 amp models, matched DynaCab HD speaker cabs and dozens of effects, and the series is designed to grow over time with each release centred on a distinct family of amps, cabs and effects.

  The amp lineup covers the 5153 100W in Green, Blue and Red, the 5153 100W Stealth in Green, Blue and Red, the 5153 50W Blue, FAS Stealth Blue, PVH 6160 Block in Clean, Crunch and Lead, PVH 6160+ in Clean, Crunch and Lead, FAS 6160, Plexi 100W in Jumped, Bright and Normal, and FAS Brown. Fractal Audio's modeling technology creates fully adjustable amp models with authentic, interactive controls that behave like the originals, and detailed component-level modeling recreates the preamp, tone stack, cathode follower, power supply, power amp, phase inverter and amp/speaker interaction, so the amp responds naturally across its full range from clean dynamics to saturated high gain.

  Pasadena includes a collection of DynaCab HD speaker cabs chosen for hard rock, metal and heavy modern tones. The virtual mic moves across the speaker with the results audible in real time, and the HD captures offer higher spatial density for smoother, more accurate mic positioning. User Cab mode loads the player's own impulse responses in popular file formats up to 8k, across two slots that can be mixed, blended and time-aligned, and the Cab block also carries a stereo room simulator, a virtual mic preamp, and master high-cut and low-cut filters.

  The premium effects are based on the same algorithms used in the flagship Axe-Fx, with streamlined blocks for building complete tones from drive pedals, compression, EQ, modulation, delay, reverb, pitch and wah. Highlights include Tape Delay, Chamber Reverb, Dual Detune for wide stereo width, and signature vintage effects for classic Brown Sound-inspired tones. The preset browser uses tags and search to filter by tone, character and genre or to search by preset name or author, and Pasadena ships with over 120 ready-to-play presets based on those from Fractal Audio hardware plus community submissions.

  Amp modeling plugins often rely on arbitrary input levels, which can lead to inaccurate gain and response, so ICONS includes a built-in calibration system that makes the models respond to the guitar the way the original amps were designed to. No calibration is required when using the USB audio interface built into any Fractal Audio hardware product, where the default input settings are already correct. ICONS runs as a plugin in AU, VST3 and AAX formats, and also as a standalone macOS or Windows application for performance without a DAW.
