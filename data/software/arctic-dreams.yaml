details: |-
  Arctic Dreams offers a rich cinematic ambiance through its dual-layered piano
  soundscapes, featuring an acoustic layer captured from a Yamaha c3 piano and a
  synthetic layer of sound pads derived from the same original recordings.

  These layers were designed using a variety of digital processing techniques,
  including reverbs, morphing and structural effects, to create a versatile
  sound palette.

  Designed to complement a wide range of genres from ambient to pop, hip hop,
  trap, edm, and house, arctic dreams also caters to the needs of cinematic
  production, filmmakers and sound designers.

  It is compatible with windows and mac in VST/vst3/AU plugin formats,
  supporting 64-bit systems.

  A free version is available at
  https://electroniksoundlab.com/artic-dreams-lite/ for trial before purchasing
  the full version. Note: not compatible with protools.
specs: |-
