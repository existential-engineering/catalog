details: |-
  Mix and master your music with the most popular professional 2-track tape machine ever made Get classic Ampex tape saturation, selectable tape types, and color to "glue" your mix together Use the entire ATR-102 circuit, including its transformers, amplifiers, Repro, Sync, and Input paths Make adjustments to Repro/Record levels while maintaining perfect gain staging Enjoy enhanced retina GUI with interactive tape reels and controls true to the original hardware Use the ATR-102 LUNA Extension to produce with rich, analog tape sound right in LUNA’s mixer
