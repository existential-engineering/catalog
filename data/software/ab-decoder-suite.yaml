details: >-
  Audio brewers 'ab decoder suite' is a collection of plugins designed to
  manipulate, transform and decode ambisonics signals automatically to multiple
  speakers arrays. The collection of plugins was created with three goals in
  mind: they should simply work. They shouldn't have tons of complicated
  settings or routing requirements. They should troubleshoot your signal
  automatically.


  Ab decoder suite also comes with a 'smart troubleshooting' algorithm, which
  will check your signal chain and let you know if something is wrong with it.
  The plugins are not only compatible with all audio brewers libraries, but also
  with any 1oa (first order ambisonics, or ambix b-format) audio file.


  Ab visualiser is designed to visualise the signal, it's a great way to be
  aware of how the signal revolves in the spatial field, especially if the
  signal will later be decoded to immersive format such as surround or atmos
  compatible formats. This plugin doesn't change the signal.


  With 'ab rotator' you can transform your signal in the three-dimensional field
  to have a true translation of how the sound really behaves where you move it
  left/right... And even front/back and above/below. No filters, nothing is
  emulated, this is the real thing.


  Ab decoder includes all the plugins listed above plus a powerful decoder that
  will adapt to the most used speaker-arrays - all the way from stereo, to 7.1.4
  atmos beds. Depending on your DAW, 'ab decoder' might suggest you a speaker
  array, however, you can also manually change to your convenience.
  Additionally, you can control the placement of the speakers as well as their
  elevation.
