details: |-
  Al 9000 2.0 by audiolounge soft is a virtual instrument audio plugin for macos and windows. It functions as a VST plugin, an audio units plugin and a VST 3 plugin.

  This product creates sound inspired by roger linn's past products with new high end quality sounds.

  Playable via MIDI keyboard or MIDI controller with tune function for each instrument.

  Multi outputs can be selected with integrated mixer featuring pan and volume controls.

  Master reverb and master tune are adjustable with dynamic range adjust capability.
