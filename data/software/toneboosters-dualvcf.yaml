description: Dual non-linear analog filter plug-in with 68 filter models drawn from the sound of the 70s, 80s and 90s, running in parallel or in series. Adds unique multi-resonant filters, an intuitive beat-synced modulation editor and an envelope follower to drive filter parameters over time.
details: |-
  DualVCF adds motion, shape and colour. It contains a total of 68 analog filter models with that sought-after sound of the 70s, 80s and 90s.

  It also provides unique multi-resonant filters, an intuitive beat-synced modulation editor and an envelope follower to drive filter parameters over time. Dial in non-linear filter operation for character and shape.

  Run the two filters in parallel or in series. See filter responses in real time. Up to 16-channel spatial audio support.

  Resizable user interface with dozens of color themes. Undo, redo and A/B switching. Preset management with import and export. Multiple simultaneous instances. License activation without a hardware dongle.
specs: |-
  68 filter types. Parallel or series routing of the two filters. Sample rates up to 384 kHz. Up to 16-channel spatial audio support. Personal, perpetual desktop license for Windows, macOS and Linux, for use on up to 4 computers. Desktop installer v2.1.8 (July 2026). Windows 10 or up with a 64-bit DAW supporting VST, VST3 or AAX, Intel or AMD SSE2 processor. macOS 10.13 or up with a 64-bit DAW supporting VST, VST3, AAX or AU, Intel or Apple Silicon. Linux plug-in archive requiring glibc 2.31 or up and a 64-bit DAW supporting VST or VST3.
