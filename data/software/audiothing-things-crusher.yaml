details: |-
  Things - Crusher is an easy-to-use Filter and Bit Crusher effect plugin. This plugin is inspired by the effect section of AudioThing's instrument plugin Noises.

  Crusher features a multimode filter (lowpass, highpass, bandpass, notch) with 2 or 4-pole and an output gain, along with a crisp bit crusher (bits, downsample, mix) paired with a harshness control taken from the Reels plugin.

  Things - Crusher is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP). It is also available on the App Store for iOS and iPadOS (AUv3 and Standalone), for iPhone and iPad.

  A demo version is available with some limitations: silence for 3 seconds every 45 seconds, and saving disabled. If you like it, you can purchase a license and then authorize the demo version.
