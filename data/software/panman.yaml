details: |-
  PanMan is an auto-panning audio effect that transforms basic left-right panning into creative, powerful effects. The plugin combines classic hardware-inspired features with modern modulation capabilities for versatile panoramic sound design.

  The plugin features six panning modes including LFO, step, and random modes. A trigger divider feature inspired by vintage PanScan hardware enables rhythmic pattern creation. Custom rhythmic pattern design and shape mode with custom waveform drawing provide extensive creative control.

  PanMan includes dynamics-responsive threshold control for reactive panning and seven analog emulation algorithms for vintage character.
specs: |-
  - Six panning modes (LFO, step, random)
  - Trigger divider feature (vintage PanScan-inspired)
  - Custom rhythmic pattern design
  - Shape mode with custom waveform drawing
  - Dynamics-responsive threshold control
  - Seven analog emulation algorithms
  - Tempo-synced effects
  - 64-bit only, sample rates 44.1 kHz to 192 kHz
  - Apple Silicon compatible
