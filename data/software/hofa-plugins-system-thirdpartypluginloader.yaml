description: With the HOFA SYSTEM ThirdPartyPluginLoader you can load your VST and AU plugins straight into HOFA SYSTEM and patch them together any way you like, unlocking a whole lot more potential from the plugins you already own.
details: |-
  The SYSTEM ThirdPartyPluginLoader is an add-on for HOFA SYSTEM that lets you load any VST2, VST3 or AU plugin directly into SYSTEM and combine it with SYSTEM's routing and modulation capabilities. Your existing plugins gain features they never shipped with: multiband operation, parallel processing, mid/side processing, feedback loops or oversampling.

  Loaded plugins can be placed in the SYSTEM Multiband module to run frequency-dependently, set up in a mid/side or left/right configuration, blended in parallel signal paths, or wired into creative feedback loops. Complete plugin chains, including routing, modulation and the settings of the loaded third-party plugins, can be saved as presets and recalled in other projects.

  Because HOFA SYSTEM itself runs as VST3, AU and AAX, the ThirdPartyPluginLoader also acts as a wrapper for formats a given DAW does not support natively, such as VST plugins in Logic, AU plugins in Cubase or VST and AU plugins in Pro Tools.

  Plugin delay compensation is applied within the chain, so complex chains built from several latency-inducing plugins stay phase- and timing-accurate. Sidechain inputs are passed through to the loaded plugins and can be processed further via SYSTEM's sidechain insert path. Parameters of loaded plugins can be automated from the DAW and driven by SYSTEM's own modulators.

  A freeware version is available with a reduced feature set: it loads one external plugin at a time, while the full version hosts an unlimited number simultaneously. Installation is handled by the HOFA-Plugins Manager via the HOFA SYSTEM Plugin Bundle entry, and the plugin appears in the DAW under SYSTEM.
specs: |-
  - Loads third-party VST2, VST3 and AU plugins into HOFA SYSTEM
  - Combine loaded plugins freely with SYSTEM modules and routing options
  - Adds multiband, parallel, feedback, oversampling, M/S and L/R processing to any loaded plugin
  - SYSTEM parameter modulation applies to external plugins
  - DAW automation of third-party plugin parameters
  - Plugin delay compensation (PDC) within the chain
  - Sidechain input passed through to loaded plugins
  - Save and load plugin chains as presets
  - Runs plugin formats a DAW does not support natively (e.g. VST in Logic, AU in Cubase, VST in Pro Tools)
  - Freeware version limited to one loaded third-party plugin; full version unlimited
  - Formats: VST3, AU, AAX
  - Operating system: macOS 10.13 or later, Windows 10 or later
  - Two licenses per purchase, managed via the HOFA Plugins Manager, offline activation supported
  - Continuously tested on Ableton Live, Apple Logic, Avid Pro Tools, Bitwig, Cockos Reaper, Image Line FL Studio, Magix Samplitude/Sequoia, Fender Studio Pro, Steinberg Cubase/Nuendo/Wavelab
