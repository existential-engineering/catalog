description: A vocal effects processor that uses granular algorithms to dramatically alter timbre and pitch of monophonic audio. Enables bending and sculpting sounds into entirely new textures, from subtle pitch adjustments to complete sonic transformation. Developed in collaboration with Infected Mushroom.
details: |-
  Manipulator is a vocal effects processor that uses granular algorithms to alter the timbre and pitch of monophonic audio. It covers a range from subtly imposing pitch and harmonization through to heavy mangling that produces an entirely new sound.

  Ten effects are on board, including a pitch shifter, formant shifter, harmonics shifter, sound smearing, granular alternator, and pseudo stereo, and they combine freely. Other monophonic and rhythmic sources work well alongside vocals.

  The plug-in accepts MIDI data in real time, so pitch shifting can be driven from a MIDI controller and the melody of an existing performance can be replayed. Transposition is seamless and adds texture to the incoming audio. Up to 4 polyphonic voices are supported when a MIDI input is used, which allows instant harmonies. Processing is real-time and zero-latency for live performance.

  Modulation covers 5 different mods, and the plug-in ships with hundreds of presets.

  Manipulator was developed in collaboration with the electronic music duo Infected Mushroom, who used changing prototypes across albums and live performances during development. Polyverse Music describes that Artistic Feedback process as what shaped the plug-in into its released form.
specs: |-
  - Granular algorithms for timbre and pitch alteration of monophonic audio
  - 10 effects including pitch shifter, formant shifter, harmonics shifter, sound smearing, granular alternator, and pseudo stereo
  - Real-time MIDI input for on-the-fly pitch control
  - Up to 4 polyphonic voices when used with a MIDI input
  - Change melodies of existing performances
  - 5 modulation sources
  - Hundreds of presets
  - Real-time, zero-latency processing for live performance
  - Supports VST2, VST3, AU, and AAX plug-in formats
  - Windows 64-bit and macOS 10.9+ 64-bit
