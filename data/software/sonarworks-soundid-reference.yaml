description: Speaker and headphone calibration software that compensates for
  room acoustics and speaker/headphone frequency response characteristics to
  deliver accurate studio reference sound. Available as a DAW plugin and
  standalone systemwide application. Supports stereo, 5.1, and up to 9.1.6 Dolby
  Atmos multichannel setups with calibration profiles for 500+ headphone models.
details: |-
  SoundID Reference is a speaker and headphone calibration platform available as both a standalone systemwide app and a DAW plugin. It measures and compensates for room acoustics and headphone frequency response, creating calibration profiles to deliver accurate studio reference sound. Supports 500+ headphone models, stereo to 9.1.6 multichannel setups, zero-latency processing with multiple filter modes, custom target curve control, translation check for simulating various listening environments, and Virtual Monitoring simulations. Trusted by over 250,000 recording studios globally. Compatible with Cubase, Logic Pro X, Pro Tools, Reaper, Ableton Live, FL Studio, and PreSonus Studio One.
