details: |-
  Creating trap bells requires an understanding and incorporation of multiple
  instruments. We can tell you now that your worries have come to an end because
  we have developed the first & the last bells VST for you. And now, it's time
  to say goodbye to sample chopping & boring old sample libraries & be ready to
  create your best music to date!

  We at thenatan are proud to introduce you to the bells, an easy-to-use but
  extremely powerful instrument that can be programmed and tweaked quickly,
  almost effortlessly leveraging its maximum potential. Now it's up to you how
  deep you go. Ideal for trap / chillhop / hophop / lofi and any modern genre...

  Bells features: 4 samplers, each with, filters, reverse, pan, gain, and
  tuning. Pitch designer, get creative with vibrato and pitch envelopes. Xyxy
  pad lets you browse and blend layers quickly. Bells come with 200 x 4 samples
  & extra. Built-in effects (tremolo - panner - compressor - 3band equalizer -
  reverb - delay - bit crusher - saturation - lp/hp filters - stereo widener).
  Glide, velocity control, 24 transpose control. Highly compressed sample
  library (bells 2 is only 150 m.b on your disk.). Fully resizable vector / hd
  interface (up to 200%, sharp and smooth). Get inspired with animations. Preset
  browser system. (125 factory presets & shareable patches). Mac & pc all
  updates compatible. And more...
specs: |-



  - 4 samplers with filters, reverse, pan, gain, and tuning

  - Pitch designer with vibrato and pitch envelopes

  - Xyxy pad for browsing and blending layers

  - 200 x 4 samples included

  - Built-in effects: tremolo, panner, compressor, 3band equalizer, reverb,
  delay, bit crusher, saturation, lp/hp filters, stereo widener

  - Glide

  - Velocity control

  - 24 transpose control

  - Resizable vector/hd interface up to 200%

  - Preset browser system with 125 factory presets

  - Mac os x 10.9.5 mavericks or above

  - 4 gb ram

  - 2 gb free space on system drive

  - Macos catalina/bigsur ready

  - M1 silicon computers compatible under rosetta 2

  - Windows compatible

  - 150 mb disk space
