description: A sample library recreating the classic Talkbox sound using samples
  from Byron Chambers, playable in UVI Workstation with wavetable synthesis and
  bonus DX100 patches.
details: |-
  We are bringing back the classic sound of the legendary Talkbox sound with our new sample library. With the funky sounds from legendary artist such as Zapp and Roger, we are now able to bring the classic sounds to your DAW and computer using UVI.We are featuring the classic funky Talkbox samples from Mr. Talkbox himself, Byron Chambers. Byron Chambers is one of the "New-School" talkbox professionals, scoring hits with Tobie Mack, Martha Munizzi, and a countless number of other well known artists. He is a staple in the music industry and highly sought after for his talkbox sound. Well, we brought our friend Mr. Talkbox to the studio and sampled every single popular vowel sound and phrase we could imagine in order to bring you the most extensive and exhaustive talkbox library. The sample library was recorded at 44kHz/24-bit. The sounds were recorded raw from the official talkbox patches through the tube and straight to your computer. Not only is this library packed with popular phrases, but we have added a slew of sounds reminiscent of the classic 90's Ohio funk era. We were also able to include some digital synthesis technology using UVI workstation's wavetable functionality. With this technology we were able to turn regular samples into real live moving and breathing synths with the classic Pulse-Wave-Modulation features. This immediate turns a simple Talkbox sample library into a Talkbox synthesizer that will be able to do things far beyond what a normal hardware talkbox is able to do. ***BONUS: We have included the "official" Talkbox patches from the DX100 to be used on a real talkbox; in order to give you that classic Ohio/Zapp sound. So no more lugging that small DX100 around. Now you can use the classic patches anywhere you want and from any controller.
