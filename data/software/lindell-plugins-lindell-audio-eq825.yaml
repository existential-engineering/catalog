description: 5-band stereo parametric mastering EQ emulating a rare and sought-after tube mastering equalizer. Features five iconic EQ bands with custom filter networks including inductors, resistors, and capacitors, premium tube and transformer modeling, and up to 16x oversampling for unprecedented analog clarity.
details: |-
  Five-band parametric EQ with custom filter networks
  Premium tube and transformer modeling
  Variable THD (Total Harmonic Distortion) control
  Mid/Side processing capability
  Mono Maker function
  Up to 16x oversampling
  Octave Filler for enhanced low-end (adds lower octave to kicks, 808s, bass)
  Spectrum analyzer for visual feedback
  Continuous gain controls
