description: 5-band stereo parametric mastering EQ emulating a rare and
  sought-after tube mastering equalizer. Features five iconic EQ bands with
  custom filter networks including inductors, resistors, and capacitors, premium
  tube and transformer modeling, and up to 16x oversampling for unprecedented
  analog clarity.
details: |-
  Lindell Audio EQ825 captures one of the rarest and most sought-after mastering EQs ever built. Few pros have ever touched one, yet its retro, technicolored lines are instantly recognizable. If you don't have $20k to spare for an original, this plugin truly does the pinnacle of tube mastering EQs justice. Its presence, warmth, and pristine tone all sum to sonic gold.

  The original hardware was built by an ingenious group of esoteric audiophiles, who cherry-picked the best analog components from a multitude of manufacturers. Lindell Audio are the first to faithfully capture its five iconic EQ bands with their incredibly customized filter networks, all those inductors, resistors and capacitors. Hear them working their magic in the airy highs, tight lows, and midrange presence they add to drums, and the smooth top-end and enhanced air they bring to vocals.

  The extraordinary sonic profile of those special EQ curves is further enhanced by the unit's premium tubes and transformers. This clever combination of components brings sweetness, depth and punch to your mix bus. It also delivers extraordinarily high headroom. Want even more character from those tubes? Just crank the Variable THD control.

  Lindell Audio has resurrected one of the few A-Tier passive tube EQs built around the turn of the century. Its construction combined classic topologies with modern engineering approaches. The result is a premium analog tone with a significantly lower noise floor and greater clarity, which makes the EQ825 plugin suited to demanding applications, including orchestral arrangements and final mastering. Bands are expertly configured to offer musically beautiful EQ combinations, and the continuous gain controls are modeled on one of the earliest units for greater flexibility.

  New features expand the utility and creative potential of the hardware's special sound. These include options for Mid/Side processing, Mono Maker, and up to 16x oversampling, plus a spectrum analyzer for visual feedback while EQing. Bring a new dimension to the EQ's famously tight and punchy low end with the Octave Filler, which adds a lower octave into the signal and sounds amazing on kicks, 808s, toms, and bass.
specs: |-
  - Exacting model of ultra-rare 2010s tube EQ
  - Five-band stereo parametric EQ
  - Transformer-balanced Class-A tube circuitry
  - Custom high-headroom transformers
  - Variable high-pass and low-pass filters
  - Octave Filler for rich low-end extension
  - Variable THD for controlled saturation
  - Proportional-Q design for precision and musicality
  - Quick AB comparison mode
  - Scalable User Interface
  - Mono Maker (under 200 Hz)
  - Integrated FFT spectrum analyzer
  - Supported plugin formats: AAX AudioSuite, AAX Native, AU, VST2, VST3
  - Supported operating systems: macOS 26 down to macOS 13, Windows 11 down to Windows 10
  - Mac: Intel, or Apple Silicon
  - PC: x64-compatible CPU
  - Display resolution: 1440 x 900px or 1280 x 960px or higher
  - Memory: 2 GB RAM
