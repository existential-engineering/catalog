details: |-
  The amp takes the graphic design of modern deluxe but the preamps are flat,
  the distortion, amplification and compression are suitable for bass games.
  Tubes are bringing the heat.

  Two independent identical channels each with an adjustable compression and
  drive level and 9-band equalizers for easy sound adjustment. A pedal board
  with 6 super efficient pedals including a tone drive designed for the bass.

  A beatbox with several styles and a looper to practice (and not lose the
  groove). Original sound design from scratch for more bass. An adjustable boost
  of the presence to hear his fingers sliding on the strings.

  4 models of bass cabinets (1x15, 8x10, 4x10) which reproduce the sound
  characteristics of the most famous bass cabinets.
