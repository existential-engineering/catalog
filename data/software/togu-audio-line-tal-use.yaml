description: TAL-USE (Ultra Simple Eq) is especially designed after some tilt
  eq's from the 70's. This type of eq allows to adjust the audio material
  without changing the character of a sound to much.
details: |-
  TAL-USE stands for Ultra Simple Eq. Togu Audio Line describes it as especially designed after some tilt eq's from the 70's, a type of eq that allows the audio material to be adjusted without changing the character of a sound too much.

  The page calls it an easy way to make an audio signal sound darker or brighter with only one knob.

  A bass lift knob is described as a special addition that boosts or attenuates bass frequencies below 300Hz.

  It has no product page of its own: the plugin is one of four sections rendered on the legacy /products/tal-effects page, each with its own heading, screenshot, downloads and requirements block.

  Downloads are direct zip archives with no installer: Windows 32-bit VST, OSX 32-bit VST and OSX 32-bit AU. Unlike the TAL-Bitcrusher and TAL-Flanger sections on the same page, no 64-bit Windows build is offered. No price, purchase path, version number, changelog or release date appears anywhere on the page.
specs: |-
  - Tilt EQ modelled after eq's from the 70's
  - Single knob to make a signal darker or brighter
  - Bass lift knob that boosts or attenuates bass frequencies below 300Hz
  - Windows XP or higher (32 / 64 bit)
  - OSX 10.6 and < 10.10 (32 bit Host)
  - Downloads: Windows 32-bit VST, OSX 32-bit VST, OSX 32-bit AU
