details: |-
  TAL-USE stands for Ultra Simple Eq. Togu Audio Line describes it as especially designed after some tilt eq's from the 70's, a type of eq that allows the audio material to be adjusted without changing the character of a sound too much.

  It is an easy way to make an audio signal sound darker or brighter with only one knob.

  A bass lift knob is described as a special addition that boosts or attenuates bass frequencies below 300Hz.

  TAL-USE was one of the four free effects TAL distributed as TAL-Effects, alongside the original TAL-Bitcrusher, TAL-Flanger and TAL-Tube. TAL now lists TAL-Effects under "Deprecated Plug-Ins (not supported)".

  It was released as a 32-bit VST for Windows and as a 32-bit VST and AU for OSX 10.6 to 10.9 hosts. Unlike TAL-Bitcrusher and TAL-Flanger it never had a 64-bit Windows build. No installer, VST3, AAX or CLAP build exists.
specs: |-
  - Tilt EQ modelled after eq's from the 70's
  - Single knob to make a signal darker or brighter
  - Bass lift knob that boosts or attenuates bass frequencies below 300Hz
  - Windows: Windows XP or higher, 32-bit VST only (no 64-bit build)
  - OSX 10.6 and < 10.10 (32 bit Host)
  - Builds: Windows 32-bit VST, OSX 32-bit VST, OSX 32-bit AU
