description: DS-2 synthesizer faithfully replicates the unique digital/analog
  sound of Crumar's original hardware synth from 1978. This latest collaboration
  with Crumar Instruments not only captures the distinctive tone and
  multitimbral capabilities of the original but also enhances them, offering an
  impressive combination of innovation and authenticity.
details: |-
  Crumar DS-2 is a virtual instrument recreation of the hardware synthesizer Crumar released in 1978, developed in collaboration with Crumar Instruments. The original paired a monophonic synth engine with a 44-note fully polyphonic (paraphonic) companion section, which together produced a distinctive multitimbral character. "DS" stood for "Digital Synthesizer," and the instrument was an early hybrid design with two digitally-controlled oscillators (DCOs) alongside analog LFOs, VCFs, VCA, and envelope generators.

  To avoid the tuning problems of traditional analog synthesizers, Crumar used a then-novel approach in the Synth section to create oscillators that would not drift. The resulting waveforms were completely stair-stepped, producing a gritty tone and wild harmonics. The Poly section was paraphonic, with a single filter carrying highpass and lowpass knobs and its own VCA, and generated unusual 'sawtooth' waveforms by combining divide-down square waves with resistors and high-pass filtering. The cutoff, resonance, and modulation settings of the Synth section also applied to the paraphonic poly filter, so the timbres the DS-2 produced sit apart from both the polished sounds of most digital synthesizers and the warm tones of classic analog designs, with a jagged, harmonically edgy quality instead.

  The software version expands the design considerably. The monophonic Synth section gains last/high note priority settings plus Unison and Multi voice options with voice cycling, panning, and tuning, and can also run polyphonically with 4, 8, or 16 voices; the Poly section supports up to 32 notes. A keyboard split mode joins the layered mode, with adjustable ranges for both splits and layers across the Synth and Poly tone generators. OSC 2 in the Synth section adds a stair-stepped sine waveform option, and oscillator sync has been added.

  A third LFO joins the original two, offering ramp, triangle, sine, square, sample and hold, and staircase waveforms. Each LFO has its own discrete delay knob in place of the previous global delay control, along with sync, retrigger, and one-shot capabilities, and reverse wave options are available for LFOs 1 and 2. The LFO Mixer, hardwired to fixed destinations on the original, now offers six assignable destinations with 33 options each. The envelopes gain an initial delay stage, velocity sensitivity, and looping, the Poly section gains VCA release control, and touch control adds four click-to-assign slots supporting channel and polyphonic aftertouch. The VCF offers both 12dB 2-pole and the original 24dB 4-pole modes with polarity and key follow.

  For effects, DS-2 provides three independent customizable effects chains, one for the Synth section, one for the Poly section, and a global layer, each with an individual effects modulator. Twenty studio-quality effects can be arranged, saved, and recalled within those chains. Over 300 presets in 14 categories ship with the instrument, created by sound designers James Terris, Andrew Longhurst, James Dyson, and Mike Martin.
specs: |-
  - Based on the 1978 Crumar DS-2, which featured a monophonic DCO synth engine paired with a 44-note fully polyphonic (paraphonic) companion section, two LFOs, a 24dB 4-pole VCF, two ADSR EGs, and a hardwired five-part LFO mixer
  - Improved Synth section: monophonic mode with last/high settings, Unison, and Multi voice options including voice cycling, panning, and tuning, plus polyphonic operation with 4, 8, or 16 voices
  - Improved Poly section: fully polyphonic, accommodating up to 32 notes
  - Keyboard split mode in addition to layered mode for the Synth and Poly tone generators, with adjustable ranges for both splits and layers
  - Two oscillators based on the digitally-controlled oscillators of the original, with stair-stepped sawtooth, triangle, square, and pulse waveforms; OSC 2 in the Synth section adds a matching stair-stepped sine waveform option
  - Oscillator sync
  - A third LFO added to the original two, offering ramp, triangle, sine, square, sample and hold, and staircase waveforms
  - Discrete delay knob for each LFO, replacing the previous global delay knob
  - LFO sync, retrigger, and one-shot capabilities, with reverse wave options for LFOs 1 and 2
  - LFO Mixer, hardwired to OSC 1, OSC 2, VCF, VCA, and pulse width in the original, now with six assignable destinations offering 33 options each
  - DADSR envelopes with an initial delay stage and velocity, plus looped envelopes; polarity added to the VCF EG
  - VCA release control for the Poly section
  - Touch control with four click-to-assign slots, supporting channel or polyphonic aftertouch with compatible controllers
  - VCF with both 12dB 2-pole and the original 24dB 4-pole options, with polarity and key follow
  - Assignable pitch bend range and a dedicated mod wheel control
  - Dynamic arpeggiator for either or both sections, with four pattern modes (Arp, Leap, Order, Random) plus swing, chance, and feel controls
  - Three independent customizable effects chains, one each for the Synth and Poly sections plus a global layer, with an individual effects modulator for each layer
  - 20 studio-quality effects that can be arranged, saved, and recalled within the effects chains: BBD Flanger, Compressor, Digital Delay, Digital Reverb, Distortion & EQ, Dual Delay, Dual Ensemble, Dual Phaser, Envelope Filter, Flanger & Chorus, Galactic Reverb, Lo-Fi, Lushverb, Ring Modulator, Seven Band EQ, Spring Reverb, Tape Echo, DCO Chorus, Panner, and Pulser
  - Mini UI effects control tray with on/off, solo, bipolar modulator amount slider, and dry/wet mix per effect, plus global FX on/off, level, and stereo expand
  - Over 300 presets in 14 categories
  - Standalone virtual instrument and plug-in versions included
  - User-adjustable oversampling control
  - Complete MIDI control and DAW automation for all controls, with MIDI learn and mapping (Preset and Global)
  - Focus zoom-in feature, as well as standard UI zoom and resize via drag
  - Documentation available directly online from the instrument or in downloadable PDF format
  - macOS requirements: macOS 10.13 or above, 64-bit required, Intel or Apple Silicon processor (M1 or greater including Ultra), 3.4 GHz quad-core or Apple Silicon CPU with 8 GB of RAM recommended
  - Windows requirements: Windows 7 or above (including Windows 11), 64-bit required, quad-core computer with 8 GB of RAM recommended
  - Hard disk space: 150 MB
  - Internet connection required for product activation
