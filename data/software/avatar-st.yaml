details: |-
  Avatar ST is most suited for a large variety of pads, soundscapes, atmospheres
  or related FX sounds but can do other sounds like e.g. Certain kinds of basses
  too. The 16-step modulator allows sounds to be fairly rhythmical in various
  ways if required.

  Also you can have one section step-modulated while the other is not as there
  are two complete sections with oscillators, modifiers, vca eg, delay, pan and
  reverb send, plus a grain processor and a multimode filter to be inserted via
  different audio routings. In addition there are a lot of modulation options
  you might select from in order to tailor your sound.

  The avatar st synthesizer plugin transforms sound with customizable settings
  of synthesis routines over 4 wave oscillators of which 2 oscillators have user
  loadable waves. It features a rich set of internal waves, and this avatar st
  synthesizer allows adjusting a patch with randomize buttons for the waves and
  7 other groups of settings of a patch.

  The avatar st has many options to ambiently modulate sound. It is very
  suitable for creating ambient soundbeds and soundscapes and sounds with
  tension. The avatar st does allow creating sounds with a shorter
  decay/sustain/release on the amplification and filter envelopes, although
  longer sustaining sounds more suitable as ambient sounds and pads are the
  thing that this plugin excels in.

  The avatar st synthesizer plugin is stable, and has an understandable, not too
  long manual. It does not consume a very huge amount of cpu, although the
  manual suggests lowering release times for less cpu usage.
specs: |-
  - 2 x 2 PCM wave oscillators with 384 waves in 3 banks

  - 2 x osc mix section with xy-pad and mix option for direct and step modulated
  out

  - 2 x mystify with three selectable types (bright, soft, dark)

  - 1 x grain processor

  - 1 x filter with 4 types (lp, hp, bp and feedback) with adsr eg

  - 2 x vca eg (adsr)

  - 2 x delay

  - 2 x pan

  - 7 x lfo

  - 1 x s&h

  - 16 step modulator

  - Keytrack and modwheel

  - 1 semi-parametric 3-band stereo eq

  - 1 reverb

  - 16 voices

  - 8 lazy buttons


  - Windows compatible

  - 128 internal patches (pro version)

  - 64 internal patches (basic free version)

  - 256 internal waves (basic free version)

  - 384 internal waves (pro version)

  - Sf2 & wave loading with osc b2 (basic free version)

  - User loadable waves

  - Randomize buttons for patches

  - Step modulation syncable to host tempo
