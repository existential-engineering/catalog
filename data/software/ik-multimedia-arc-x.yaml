details: |-
  ARC X is more than just correction — it's a next-generation platform for acoustic calibration, intelligent tuning, advanced voicing, and virtual monitoring. Built on IK's industry-leading VRM (Volumetric Response Modeling) technology, ARC X transforms any room into a precision-tuned monitoring environment, ensuring your creative decisions translate flawlessly across every system. Whether you're producing in a small bedroom setup or mixing in a professional control room, ARC X gives you unmatched sonic accuracy and complete control over your sound.

  Through high-resolution acoustic measurement and advanced frequency domain correction, ARC X creates a custom-tailored response profile that reveals your audio truthfully and naturally. The result is a pristine monitoring environment that lets you trust every detail, so you can work faster, and create mixes that translate with stunning accuracy.

  ARC X combines over a decade of research and development into a seamless solution. From real-time calibration to high-end reference emulation and deep tuning flexibility, every detail is engineered to elevate your workflow and unlock your full creative potential. Key features include automated room correction, advanced tuning flexibility with 9 target curves, voicing emulation for 20+ industry-standard reference monitors, real-time monitor control, and on-speaker operation for latency-free correction.

  The measurement system captures a 3D snapshot of your room's acoustic response using IK's award-winning VRM technology. Choose between a 1-, 3-, or 7-point quick measurement for fast setups or a 21-point ultra-precise scan for fixed installations. The advanced algorithm resolves frequency and phase inconsistencies without overprocessing, providing a seamless experience akin to working in a professionally tuned room.

  ARC X guarantees optimal left-right phase coherence with selectable Natural and Linear phase modes. Users can adjust the low and high correction ranges to keep their monitors' original voicing, and fine-tune the correction filter's resolution to match the room's acoustics.
specs: |-
  - 1-, 3-, 7-, or 21-point acoustic measurement
  - 9 target curves
  - Natural and Linear phase correction modes
  - Adjustable low and high correction ranges
  - 20+ reference monitor voicing emulations
  - On-speaker operation for latency-free correction
  - Supports up to 192 kHz sample rate
  - macOS 10.15+ / Windows 10+
