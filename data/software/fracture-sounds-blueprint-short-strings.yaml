details: |-
  Short strings is a playful sampling of a small chamber-sized ensemble playing
  the staccato articulation. Its versatility spans from intimate pieces to more
  action-orientated compositions, injecting dynamism and liveliness into your
  score.

  Recorded at the nave, studio 1 the library offers an opportunity to experience
  the sound of the hall in which string formations and tom factory were also
  recorded, whilst also complimenting the long con sordino articulation found in
  our previous blueprint: gentle strings.

  To order your copy of any of our blueprint libraries, all you need to do is
  sign up to our mailing list via any blueprint product page. You will then be
  sent an email with all of the order links.
