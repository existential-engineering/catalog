description: A delay worth waiting for. Analog-flavored delay plugin with 14
  colorful effects to sculpt your wet signal. From tape delay sounds to modern
  slap backs and crunchy lo-fi echoes.
details: |-
  Comeback Kid is an analog-flavored delay plugin designed to be the perfect go-to delay with powerful upgrades from standard tools. The delay options give you all the basics laid out in the simplest way possible with no submenus or friction.

  The plugin lets you design your own delay color for any creative need using 14 shaping effects to sculpt the tone of your wet signal. Dial in tape delay sounds, modern slap backs, crunchy lo-fi echoes and beyond.

  Features include tempo-synced modes (Straight, Dotted, Triplet) and free mode (0.01ms to 2500ms), ping-pong stereo, an onboard ducker, analog-modeled filters, transient designers, and creative effects like Cheap (11-bit vintage path), Tape (saturation), Swirl (phasing), Sauce (reverb diffusion), and Destiny (subtle randomization).
specs: |-
  - Tempo-synced modes: Straight, Dotted, Triplet plus Free mode (0.01ms - 2500ms)
  - Ping-Pong stereo delay
  - Onboard Ducker for clarity
  - Analog-modeled Lo-Cut and Hi-Cut filters
  - Attack and Sustain transient designers
  - Cheap: 11-bit signal path inspired by vintage digital delays
  - Tape: Analog-modeled saturation
  - Swirl: Warm organic phasing effect
  - Sauce: Algorithmic reverb diffusion
  - Wider, Richer, Pan, Mono, Destiny controls
  - Native Apple Silicon M-Chip support
  - 64-bit only
