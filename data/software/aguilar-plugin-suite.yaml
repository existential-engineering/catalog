description: The official Aguilar sound in software — iconic Aguilar amps, cabs,
  and pedals now available digitally. Developed with advanced analog circuit
  modeling by KORG, the suite delivers authentic bass amp tones for studio
  production, tracking, and content creation. Works standalone or as a plugin
  within any DAW.
details: |-
  Emulates AG Series amps (AG 500, AG 700), Tone Hammer Series (TH 350), and
  DB 751 amplifier.

  Includes SL Series and DB Series cabinet models, plus the complete Aguilar
  pedal lineup. Version 1.3 adds TLC DLX Compressor EQ and Octamizer DLX.
  Dedicated browsers for amps, cabinets, and pedals with Artist, Factory, and
  User presets.

  Advanced analog circuit modeling developed in partnership with KORG. Works
  standalone or as a DAW plugin. Installs on up to 10 devices with offline use
  supported after activation.

  System requirements: macOS 12 or higher (Apple Silicon native), Windows 11
  or higher (64-bit). Minimum Intel Core i5 / 8 GB RAM; i7 / 16 GB recommended.
