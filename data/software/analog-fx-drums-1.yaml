details: |-
  Analog FX Drums 1 is a vsti & AU plug-in instrument for Windows and mac, that can also be used as an expanding library in the free eplex7 player or in other plug-in instruments. Available as win vsti x32 / x64-bit, apple Mac OS X Audio Unit or mac VST3 plug-in.

  Analog fx drums 1 is a collection of analog film drums perfect for all genres of film music / soundtracks / videogames music (sci-fi music, horror music, futuristic film music, dark dusty post apocalyptic soundtracks, thriller music, action or sci-fi games music, psychological or experimental films, alternative films) but can be used in many genres of electronic music like experimental, techno, rave, tekno, industrial, ambient music, ebm, electro, synthwave, drum and bass intros, etc.

  The plug-in / collection includes analog film drums, horror drums, thriller drums, sci-fi drums, drums processed with real analog hardware and vacuum tubes, drums for video games music / cinematic music / analog kick drums / analog snare drums / analog hi-hats / noises.

  This instrument includes multi-octaved / multi-sampled sounds, instruments, waveforms and synths which sounds perfect in wide range of tones / octaves from c3 to c7 or more. All sounds can be modified by internal parameters like lfo rate/depth (triangle, sinus, saw, square, exponent) with pitch, expression and pan modulation. Low pass / high pass filter with cutoff, reverb/space, amplitude envelope, pan.

  You can play in various modes: polyphonic, monophonic or legato with glide function. You can use external VST plug-in effects from eplex7 or other manufacturer to significantly modify all included instruments and create brand new sounds fast and easy.
