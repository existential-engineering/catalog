details: |-
  The first sample library of its kind to lend itself to multiple genres, this self-contained toolkit offers instant inspiration. At its core is a range of 20 tempo-mapped loops created from multi-layered guitar, keys, synths, sax performances, split into stems across a colour-mapped keyboard. In addition, explore 28 one shots, drum loops and kits, deep sub-basses, old-school wavey synth pads, melodic instruments and visceral textures which can all be manipulated and warped within the plug-in to create immersive atmospheres.

  Our first collaboration with QMF, Colours PST has roots in the UK drill scene — curated by Trinz, a producer with a distinctive sound and impressive production credits, including Digga D , Plutonio , and E1 (3X3) . While designed for beat makers and producers creating drill, grime or hip hop tracks, its bespoke range of in-built sound-sculpting controls and effects enable you to put your own personal spin on these sounds to facilitate your own vision, making it equally useful for contemporary composers looking to add a whole spectrum of fresh new sounds and textures to their TV, film or game scores.
specs: |-
  - 48 curated presets
  - 3 sections: Loops (20), Keys (20) and Drums (8)
  - 20 tempo-synced melodic loops, stems colour-mapped by octave across the keyboard
  - Loops recorded at a default 140 bpm, tempo-syncable to the DAW
  - 20 Keys sounds including synth basses, leads and pads
  - 4 drum kits and 4 drum loops
  - 28 one shots
  - 10 controls: Expression, Processed Signal, Reverb, Attack, Release, Chorus, Distortion, Flanger, Phaser, Portamento
  - 7 bespoke reverbs: Drum Studio, Plate, Church Far, Church Balcony, Kiln, Big Hall, Room
  - Velocity sensitive
  - 1.3 GB download size
  - 1.30 GB disk space required during install
  - macOS 11 to 26, Intel and Apple Silicon, 8 GB RAM minimum (16 GB recommended)
  - Windows 10 or 11 (64-bit), 8 GB RAM minimum (16 GB recommended)
  - 32-bit systems are not supported
  - Spitfire Audio App required
