description: A virtual drum instrument plugin built around the signature drum sample collection of European metal producer Daniel Bergstrand, known for his work with Meshuggah, Behemoth, In Flames, Dimmu Borgir, Soilwork, and Devin Townsend. It pairs a 19.7 GB library with a built-in mixing console and a Song Builder for arranging grooves.
details: |-
  Drumforge Bergstrand is a fully equipped virtual drum instrument plugin for programming realistic rock and metal drum performances or augmenting existing drum recordings. The library contains the actual drum sounds Daniel Bergstrand uses in his own mixes rather than a reprocessed stock collection, recorded, mixed, and tested by Bergstrand for metal production.

  A dedicated drum kit builder lets users assemble a kit from Bergstrand's own engineering setups, choosing the capture scenario per microphone for each sample. The included kit covers 13 kicks, 19 snares, 3 sets of toms (two sets of four and one set of six), 2 hi-hats, 1 crash ride, 3 rides, 2 crashes, 1 china, and 2 splashes.

  A built-in mixing engine with DSP channel inserts allows complete drum mixes to be built inside the plugin, including near-exact recreations of familiar drum mixes. Drumshotz one-shots or any WAV samples can be inserted into the mix for layering and stacking.

  Several features target performance realism. Each kick is sampled with both left and right beaters, and a Foot Switching algorithm alternates them from a single MIDI note based on speed. Individual velocity layers have their own volume controls, a velocity interpretation curve widens or narrows the dynamic range, and a smoothing algorithm handles successive hits.

  The Song Builder uses a Groove and Fill Playlist: grooves are dragged into a queue and intelligent fill logic inserts the selected fills at the end of bars. The plugin ships with a lite version of European Metal Grooves Vol. 1, performed by Leo Margarit of Pain Of Salvation, with the full pack sold separately.
specs: |-
  - Virtual drum instrument plugin for programming or augmenting rock and metal drum performances
  - Signature drum sample collection of producer Daniel Bergstrand
  - 19.7 GB detailed sample library
  - Includes 13 kicks, 19 snares, 3 sets of toms, 2 hi-hats, 1 crash ride, 3 rides, 2 crashes, 1 china, 2 splashes
  - Per-microphone engineering setup selection for each sample
  - Fully featured virtual mixing console with built-in channel inserts
  - Loads Drumshotz or user WAV one-shots for layering
  - Fully configurable MIDI mapping with presets for other samplers
  - Song Builder for writing songs from Drumforge Groove Packs
  - Includes a lite version of the European Metal Grooves pack
  - Apple Silicon native compatible
