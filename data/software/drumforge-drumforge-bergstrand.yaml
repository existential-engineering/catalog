description: "A powerful virtual drum instrument plugin featuring the signature drum sample collection of legendary European metal producer Daniel Bergstrand, known for his work with Meshuggah, Behemoth, Soilwork, In Flames, and Devin Townsend. Includes a 19.7 GB sample library, built-in mixing console with DSP modules, and a Song Builder for composing with included groove packs."
details: |-
  Drumforge Bergstrand is a fully equipped virtual drum instrument plugin designed for programming realistic rock and metal drum performances or augmenting existing drum recordings. It contains the actual signature drum samples Daniel Bergstrand uses in his real-world mixes — not re-processed stock sounds — recorded, mixed, and tested by Bergstrand himself across decades of European metal production.

  The plugin features an intuitive drum kit builder that gives users per-microphone control over each sample's engineering setup, enabling unparalleled tonal flexibility. Users can also load their own Drumshotz or WAV one-shot files for layering and stacking drum tones. The kit includes 13 kicks, 19 snares, 3 sets of toms, 2 hi-hats, 3 rides, 2 crashes, 1 china, and 2 splashes.

  A fully featured built-in mixing console with DSP channel inserts allows users to craft complete drum mixes inside the plugin without needing external mixing tools. The engine is specifically optimized for metal drum mixing, enabling near-exact recreations of classic Bergstrand drum tones.

  Drumforge Bergstrand includes cutting-edge sampler technology for realistic performance: a Foot Switching algorithm alternates left and right kick beater samples based on speed from a single MIDI note, per-velocity-layer volume control aids drum-fill realism, a velocity interpretation curve adjusts dynamic range, and a smoothing algorithm between successive hits mimics human feel.

  The Song Builder feature streamlines songwriting with a Groove & Fill Playlist system — users drag grooves into a queue and the plugin automatically inserts fills at the end of bars. The product ships with a lite version of 'European Metal Grooves Vol. 1' performed by Leo Margarit of Pain Of Salvation.
specs: |-
  - 19.7 GB sample library
  - 13 kicks, 19 snares, 3 tom sets (two 4-piece, one 6-piece), 2 hi-hats, 1 crash ride, 3 rides, 2 crashes, 1 china, 2 splashes
  - Windows 8.1+ (64-bit): VST3, AAX
  - macOS 11+ (64-bit): VST3, AU, AAX
  - Apple Silicon native compatible
  - Foot Switching algorithm for realistic kick drum programming
  - Per-velocity-layer volume control per articulation
  - Velocity interpretation curve for dynamic range control
  - Smoothing algorithm for human-like successive hit transitions
  - Built-in mixing console with DSP modules and channel inserts
  - Song Builder with Groove & Fill Playlist and automatic fill insertion
  - Supports custom Drumshotz and WAV sample loading
  - Fully configurable MIDI mapping with presets for other samplers
  - Includes lite version of European Metal Grooves Vol. 1
  - Perpetual license with free lifetime updates
