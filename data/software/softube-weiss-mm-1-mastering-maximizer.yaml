description: A precise mastering plugin that gives you the right amount of power
  over the feel of your masters. Like other Weiss plugins, it lets you achieve a
  crystal-clear mastering sound with the highest level of loudness you desire.
details: |-
  Discover the future of professional mix maximizing with MM-1 Mastering Maximizer. Based on the esteemed and indispensable DS1-MK3, MM-1 lets you effortlessly achieve an authentic, polished Weiss mastering sound with the highest level of loudness you desire. Featuring the same algorithms as DS1-MK3, plus an easy-to-use style selector, an intelligent amount knob, and a side menu to ensure that your project is ready for any platform, MM-1 gives you the optimal amount of authority over the feel of your masters while keeping the process delightfully simple. Get the levels up without sacrificing your sound with MM-1 Mastering Maximizer.

  Weiss MM-1 Mastering Maximizer is built on Softube's legacy of emulating professional audio gear. After close to two decades working in collaboration with premium brands like Weiss Engineering, Tube-Tech, Solid State Logic, Chandler Limited, and Trident, Softube has a reliable track record of recreating classics in software form that sound exactly like their hardware counterparts. The DS1-MK3 algorithms that grace MM-1 are not merely stunning recreations. They are the algorithms themselves. Softube undertook the daunting, yet rewarding, task of code porting each line of the original DS1-MK3 code used in MM-1. The result is the stunningly transparent sound quality of Weiss Engineering. Nothing less.

  Reach max mastering sound with minimal tweaking. Select any one of MM-1's five limiting styles from Transparent to Deess and then use the amount knob to dial in the proportion of processing defined by that style. With Transparent, you can retain as much of the original transients and dynamics as possible while focusing on adding subtle compression that leaves room to bring up RMS. The Loud setting lets you focus on maintaining headroom for the limiter to reach for a higher RMS. Punch adds weight and brings out transient material for an energetic-feeling mix. Wide allows you to create a three-dimensional sound by widening the drums, backing instruments, or the entire mix. And, to smooth out frequencies that could otherwise be harsh, simply deploy Deess.

  The name Weiss resounds in the pro audio mastering sphere. Since its launch in the 1990s, Weiss DS1-MK3 has become the exemplary mastering unit. Despite its premium price tag, it is indispensable to professional mastering studios around the world. Its unrivaled transparency, unparalleled versatility, and exceptional sound quality have gained it a place on almost every major album of the last twenty-five years. MM-1 Mastering Maximizer features the exact compression, limiting, and deessing algorithms of DS1-MK3. With the Parallel Mix knob, you can apply the perfect amount of the coveted Weiss sound to your original mix, and the line-by-line code porting process means that what you hear is always authentically Weiss.

  Secure your mix's spot on any and every stage with MM-1 Mastering Maximizer. With MM-1's side menu you can instantly and effortlessly select common dBFS standards, ensuring that your mix is presented with the proper headroom for a variety of formats. Use the side menu to make rapid adjustments to the output dBFS from zero to -1.0 and guarantee that your limiting delivers a finished product that's compatible with YouTube, Spotify, physical spaces, and every platform in between.
specs: |-
  - A 1:1 code port of the famous DS1-MK3 for the exact sound of the original
  - Fully licensed and endorsed by Grammy-winner Daniel Weiss
  - Go as loud as you want without sacrificing desirable tone and dynamics
  - Five limiting styles to instantly add Weiss sonics to your mix or master: Transparent, Loud, Punch, Wide and Deess
  - An intelligent amount knob to dial in the proportion of processing defined by the selected style
  - A side menu to ensure your final product is ready for any platform, with common dBFS output standards from zero to -1.0
  - Updated processing resolution and the addition of Waveform view
  - Parallel Mix knob for added transparency
  - Great for maximizing your mix-bus quickly and effectively
  - Supports Softube Extended Features
  - Console 1 Ready: can be used within the Console 1 mixing system
  - Also available in Weiss Complete Collection 3, Flow Mastering Suite and Flow Complete Suite
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26
  - System requirements: Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access for downloading installers and managing licenses
  - Three activations included
  - 20-day trial, 14-day returns
