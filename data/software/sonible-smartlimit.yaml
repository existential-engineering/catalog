description: smart:limit is a content-aware limiter plug-in that finds limiter settings in a few seconds and lets a mix breathe. It pairs that automatic parametrization with extensive loudness and dynamics monitoring for confident publishing.
details: |-
  smart:limit is built around a straightforward set, check and publish workflow. Its intelligent processing preserves the detail of a track while keeping the limiting transparent, and the built-in loudness and dynamics monitoring removes the need for additional metering plug-ins. Real-time loudness readouts are paired with guidance toward the safe zone requirements of streaming platforms and loudness standards, delivered as interactive Quality Check hints.

  The plug-in analyses the incoming signal and proposes limiting parameters within seconds. Genre-based profiles prime it for different limiting characteristics, and a reference track can be uploaded when a specific limiting style is the target. Automatic parametrization is optional, so the limiter can be driven fully by hand, fully automatically, or as a combination of both.

  Extending the Loudness Monitoring section opens an information hub covering loudness readouts, visual guidance for different publishing targets, and the dynamics of the track. The Instant Impact Prediction feature reflects a parameter change in real time, so the loudness measurement does not have to be restarted and the whole input signal does not have to be played back again.

  Four sound-shaping controls sit alongside the limiting. The Style dial moves freely between a soft and a hard limiting style, Saturation adds subtle warmth or inflates the signal outright, Balance applies a spectral polish before publishing, and Bass Control tightens the low end for a rich, compact result.
specs: |-
  - Automatic parametrization in just a few seconds
  - Genre-based profiles and reference track upload
  - Extensive loudness and dynamics monitoring, no extra metering plug-in required
  - Instant Impact Prediction reflects parameter changes in real time
  - Interactive Quality Check hints for streaming platform and loudness standard targets
  - Metrics: loudness (LUFS) integrated, short-term and momentary, loudness range (LU), dynamics (dB) based on peak to loudness ratio, true peak (dBTP) with high-resolution oversampling, gain reduction (dB)
  - Sound-shaping controls: Style, Saturation, Balance, Bass Control
  - Plug-in formats (Mac): VST, VST3, AU, AAX
  - Plug-in formats (Windows): VST, VST3, AAX
  - Supported formats: mono, stereo, Dolby Surround 5.1
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok
  - Apple Silicon support: native
  - Windows 10 (64 bit) or macOS 10.9 and later
  - RAM: 4 GB
  - CPU: Intel Core (i5) or Apple Silicon
  - GPU: OpenGL version 3.2 or later
