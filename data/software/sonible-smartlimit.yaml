description: smart:limit delivers limiter settings in seconds and gives you all the loudness and dynamics info you need for confident publishing.
details: |-
  smart:limit is all about worry-free limiting: Its intelligent processing will preserve the detail of your track and provide a transparent, uncompromised limiting quality. With smart:limit's extensive loudness and dynamics monitoring, you won't have to use any additional metering plug-ins. Besides providing you with all the necessary loudness information in real-time for confident publishing, smart:limit guides you towards hitting the safe zone requirements of streaming platforms or loudness standards, and gives you feedback via interactive Quality Check hints.

  The plug-in analyzes your signal and finds limiting parameters that let your mix breathe, all in just a few seconds. By choosing a genre-based profile that fits your mix, you can prime the smart:limit for different limiting characteristics. Or instead, upload a reference track, if you are aiming for a specific limiting style. You can use smart:limit with or without the automatic parametrization, or go for a combination of both.

  Extend the Loudness Monitoring section to access an extensive information hub on loudness and dynamics: Here you will find all relevant loudness readouts, visual guidance regarding different publishing targets and information on the dynamics of your track. With the Instant Impact Prediction feature you won't have to restart the loudness measurements every time you change a parameter, the change will be reflected in real-time without having to repeatedly play back the entire input signal.

  When your sound is in need of a little bit of extra vibe, smart:limit has got you covered. Use the Style dial to freely choose between either a soft or hard limiting style. Play with Saturation to add some subtle warmth or to really inflate your signal. Adapt the Balance to give your track that perfect spectral polish prior to publishing and tweak the Bass Control for a rich and compact low end.
specs: |-
  - plug-in formats (Mac): VST, VST3, AU, AAX
  - plug-in formats (Windows): VST, VST3, AAX
  - supported formats: mono, stereo, Dolby Surround 5.1
  - supported sample rates: 44.1 kHz to 192 kHz
  - authorization: machine-based or iLok
  - latest version: 1.1.5
  - Apple Silicon support: native
  - System requirements, PC: Windows 10 (64 bit)
  - System requirements, Mac: OSX 10.9+
  - RAM: 4GB
  - CPU: Intel Core (i5), Apple Silicon
  - GPU: OpenGL Version 3.2+
  - Automatic parametrization in just a few seconds
  - Extensive loudness and dynamics monitoring
  - Unique set of sound-shaping tools
  - Loudness [LUFS]: integrated, short-term, momentary
  - Loudness Range [LU]: integrated, short-term, momentary
  - Dynamics [dB]: based on Peak to Loudness Ratio
  - True Peak [dBTP]: using high-resolution oversampling
  - Gain Reduction [dB]
  - Interactive Quality Check hints
  - Instant Impact Prediction
  - Style, Saturation, Balance and Bass Control sound-shaping parameters
  - Genre-based profiles and reference track upload
  - 30-day trial available
