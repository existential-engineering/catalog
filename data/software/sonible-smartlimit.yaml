description: smart:limit delivers limiter settings in seconds and gives you all the loudness and dynamics info you need for confident publishing.
details: |-
  smart:limit is a content-aware limiter built around a straightforward set, check, publish workflow. Its intelligent processing is designed to preserve the detail of a track and provide transparent, uncompromised limiting quality, and its extensive loudness and dynamics monitoring removes the need for additional metering plug-ins. Alongside real-time loudness information, it guides a mix towards the safe zone requirements of streaming platforms and loudness standards and gives feedback through interactive Quality Check hints.

  Automatic parametrization analyzes the signal and finds limiting parameters that let a mix breathe in a few seconds. A genre-based profile primes the plug-in for different limiting characteristics, or a reference track can be uploaded when a specific limiting style is the target. The automatic parametrization can be used on its own, bypassed entirely, or combined with manual settings.

  The Loudness Monitoring section expands into an information hub covering loudness and dynamics, with all relevant loudness readouts, visual guidance for different publishing targets and information on the dynamics of the track. The Instant Impact Prediction feature reflects a parameter change in real time, so the loudness measurement does not have to be restarted and the entire input signal does not have to be played back again. Monitored metrics include integrated, short-term and momentary loudness in LUFS, loudness range in LU, dynamics in dB based on peak to loudness ratio, true peak in dBTP using high-resolution oversampling, and gain reduction in dB.

  A set of sound-shaping controls sits beside the limiting stage. The Style dial moves freely between a soft and a hard limiting style, Saturation adds subtle warmth or inflates the signal more heavily, Balance applies spectral polish prior to publishing, and Bass Control tightens the low end for a rich and compact bottom.
specs: |-
  - Automatic parametrization in just a few seconds
  - Extensive loudness and dynamics monitoring
  - Unique set of sound-shaping tools
  - Genre-based profiles, or parametrization from an uploaded reference track
  - Instant Impact Prediction reflects parameter changes in real time
  - Interactive Quality Check hints against streaming and loudness-standard targets
  - Loudness readouts: LUFS integrated, short-term and momentary, loudness range in LU
  - Dynamics readout in dB based on peak to loudness ratio
  - True peak readout in dBTP using high-resolution oversampling
  - Gain reduction readout in dB
  - Sound-shaping controls: Style, Saturation, Balance, Bass Control
