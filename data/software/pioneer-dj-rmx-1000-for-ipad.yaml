description: DJ effector app for iPad that mirrors the layout of the RMX-1000
  hardware effector, applying high-quality FX to tracks from your iTunes library
  with support for Audiobus and Inter-App Audio.
details: |-
  DJ effector app for iPad

  With the RMX-1000 for iPad app you can add high-quality FX to tracks in your iTunes library . The app exactly mirrors the layout of the RMX-1000 effector and gives you direct access to numerous FX, also allowing you to customise the parameters of the FX to create your own unique sound. Plus the app supports the Audiobus app (bought separately) and Inter-App Audio, which lets you add FX to music you’ve created with DAW apps as well as control and record your creations in one simple GUI .
