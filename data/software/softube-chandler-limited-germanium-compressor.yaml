description: An epic compressor plugin, plus so much more. Chandler Limited
  Germanium Compressor adds color and character to everything. Get the Chandler
  Limited plugin that feels like an instrument.
details: |-
  A highly versatile mojo machine, capable of replacing multiple plug-ins in a chain (EQ, distortion, transient designer, you name it), the Germanium Compressor is so much more than gain reduction. Engineered with an ear for music before mathematics, this is a trusty companion for producers, recording engineers, and creative musicians of all kinds. This is a meticulous model of the Chandler Limited hardware, tested in Softube's lab to ensure it performs like the hardware does, for the same excellent sound quality and inspiring vibe.

  The Germanium Compressor's unique character comes from a blend of several innovative approaches. The ratio settings are tuned by ear rather than arithmetic. The dial takes you from less to more rather than fixing on especially precise numerical values. Knee settings are similarly artistic, named as they are after the different combinations of diodes which achieve each color of curve.

  With a FET gain reduction element, the Germanium is capable of fast and heavily-saturating compression. So there's a choice of clean or dirty compression, toggling between modes which compensate to varying degrees for the harmonic excitement naturally brought about by the unit. It's never transparent, but you have a lot of control over Total Harmonic Distortion (THD) in this compressor. And every track this thing touches will benefit from the drive and feedback on output, the real secret sauce: a gain circuit which can gently caress a signal as easily as it can sizzle and sear it into submission.

  You also have control over the speed of operation, with attack and release times that can be combined to extremely musical effect. Ease off on the attack and the Germanium Compressor becomes a punchy powerhouse for drums. Slow down the release and creamy, smooth tones can be introduced to vocals or bass. Acoustic guitar can be brightened and tightened, or rock axe heated and seated in a dense mix.

  Using the Germanium in software means you can take advantage of features that are exclusive to the plug-in version: Mid/Side Processing and External Sidechain allow you to make better-sounding mixes than ever before. All the character, the musicality, the fun of the original hardware Germanium Compressor from Chandler Limited is right here.
specs: |-
  - A meticulous model of the Chandler Limited Germanium Compressor that performs just like the hardware
  - Far from just a compressor, it's a mojo, color and character machine that almost feels like a musical instrument
  - Capable of replacing many other plug-ins used in a chain, like distortion, EQ/filter, compression, and transient designer
  - Perfect for tone shaping, sound tweaking and sound designing when tracking, producing, mixing and, in some cases, even mastering
  - Clean Comp / Dirty Comp settings with the ability to control the Total Harmonic Distortion (THD)
  - Comp Curve with its unique combination of diodes
  - Attack and Release work in a musical and inspiring way, making an average drum kit go from dull and flat sounding to tight and crisp or to fat with long decay
  - Gain / Germanium Drive and Feedback give you the ability to feed signal back to the input and control the gain, the distortion and the tone shaping capabilities
  - Unique tones not found in any other compressor, not only in plug-in format, but in general
  - Software-exclusive features: External Sidechain, External Sidechain Gain, Mid/Side Processing, In/Out Left/Mid and Right/Side, Output Gain
  - Console 1-ready: can be used within the Console 1 mixing ecosystem
  - macOS Sonoma 14, Sequoia 15 or Tahoe 26
  - Windows 10 (64-bit) or Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires an AU, VST, VST3 and/or AAX compatible DAW host
  - Internet access required for downloading installers and managing licenses
  - Three activations included
