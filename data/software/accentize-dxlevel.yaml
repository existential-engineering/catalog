description: dxLevel is a free automatic loudness leveling plugin for speech and
  dialogue, with a Preserve Ambience mode that adjusts voice while leaving room
  tone untouched.
details: |-
  dxLevel automatically matches loudness across clips, balances different speakers recorded on a single microphone, and smooths out level fluctuations from moving voices or inconsistent recordings.

  Preserve Ambience mode intelligently adjusts only the speech while keeping the original room tone and environmental ambience natural and untouched. Adjustable lookahead and leveling speed parameters handle everything from fast, dynamic conversations to slow, natural dialogue transitions.

  Compatible with Pro Tools, Cubase, Nuendo, Reaper, Ableton Live, Logic Pro, Adobe Premiere, Final Cut, and DaVinci Resolve. Free for mailing list subscribers, with no trials or feature restrictions.
specs: |-
  - Audio Channels: Mono, Stereo
  - Formats: VST3, AU, AAX
  - Sample Rates: 44.1kHz, 48kHz, 88.2kHz, 96kHz, 192kHz
  - LUFS-based automatic loudness leveling
  - Preserve Ambience mode
  - Adjustable lookahead and leveling speed
