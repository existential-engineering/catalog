description: dxLevel is a free automatic loudness leveling plugin for speech and
  dialogue, with Preserve Ambience mode that adjusts voice while leaving
  background room tone untouched.
details: |-
  dxLevel is a free audio plugin for professional speech and dialogue post production. Automatically match loudness across clips, balance different speakers on a single microphone, or smooth out level fluctuations from moving voices and inconsistent recordings.

  Preserve Ambience mode intelligently adjusts only the speech while keeping the original room tone and environmental ambience natural and untouched — consistent dialogue loudness without the artificial or over-processed sound of conventional leveling.

  Adjustable lookahead and leveling speed parameters let you handle everything from fast, dynamic conversations to slow and natural dialogue transitions.

  Compatible hosts: Avid Pro Tools, Steinberg Cubase, Steinberg Nuendo, Reaper, Ableton Live, Logic Pro, Adobe Premiere, Final Cut, DaVinci Resolve. Free for all mailing list subscribers — no trials, limitations, or feature restrictions.
