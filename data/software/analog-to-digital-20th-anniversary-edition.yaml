details: >-
  Analog to digital 20th anniversary edition contains over 1,400 individual
  samples in wav file format - over 2.1gb of data.


  The original a2d audio cd released in 1993 contained over 700 individual
  samples on 68 tracks, recorded from two decades of analog synthesisers and
  digital instruments, it was raved about by dance producers for its usability,
  inspiring qualities and versatility for use in everything from ambient, trance
  and electronica to the hardest of hardcore techno.


  The sequel cd a2d2 released in 1994 added to the flexibility of a2d with a
  more diverse collection adding over 700 atmospheric loops, individual drum and
  percussion samples, pads and moods, plus special effects and synth waveforms
  contained on 90 audio tracks.


  20 years later and both cds have stood the test of time, the sound are just as
  relevant and inspiring to today's musicians as the original instruments were
  40 years ago, and now for the first time available as a single collection.


  Samples recorded from the following instruments: roland jupiter 6, sci pro 1,
  yamaha dx7, korg 01w, arp omni 2, emu emax ii, roland tb303, korg m1,
  sequential pro 5, moog prodigy, crumar multiman, korg ms10, casio cz 5000,
  roland jupiter 8, korg wavestation, ad bit 99, akai s1000, sci sixtrack,
  roland mks 50, waldorf microwave, synare sensor, kurzweil k2000, roland
  jupiter 4, korg mono/poly, roland d50, minimoog, emu proteus, korg poly 6, edp
  wasp, casio fz1, gem s2, oberheim obx, roland jd800, jhs pro rhythm drum
  synth, yamaha tg77, korg dw8000, moog opus 3, korg t1, roland sh 1000,
  powertrain transcendent polysynth, cheeta ms6, roland d70, yamaha tx802, ems
  vcs3, emu vintage keys, oberheim matrix 1000, vox continental, clavinet,
  roland mc202, osc oscar, ensoniq ts 10, rhodes, sequential max, ems synthi
  aks, yamaha ry30, emu morpheus, mellotron m400, roland jd990, arp 2600, e-bow.
