description: A creative multitap delay plugin featuring up to 8 independent taps with individual controls for gain, stereo field, delay time, filtering, modulation, saturation, and reverb. Offers three operation modes (MULTIDELAY, MULTITAP, MULTIFB), LFO and envelope follower modulation, tape saturation based on mastering processor algorithms, and spring/plate reverb simulation. Supports up to 384 kHz/24-bit and full host automation.
details: |-
  Three operation modes: MULTIDELAY, MULTITAP, MULTIFB. Up to 8 seconds delay time per channel. 8 independent taps each with gain, stereo field, delay time, filtering, modulation, saturation, and reverb controls. LFO and envelope follower modulation with +-3 octave range. Tape saturation based on mastering processor algorithm. Spring and plate reverb simulation. Supports up to 384 kHz/24-bit audio. Full host automation of all parameters. iLok License Manager required; activatable in 3 locations.
specs: |-
  - Up to 8 seconds delay time per channel
  - 8 independent taps with individual controls
  - Three operation modes: MULTIDELAY, MULTITAP, MULTIFB
  - Per-tap: gain, stereo field, delay time, filtering, modulation, saturation, reverb
  - Filter types: LP, BP, HP, Peak, Shelf
  - LFO and envelope follower modulation (+-3 octaves)
  - Tape saturation based on mastering processor algorithm
  - Spring and plate reverb simulation
  - Supports up to 384 kHz / 24-bit
  - Full host automation
  - iLok License Manager required (3 activations)
  - Windows 7-11 supported
  - macOS 10.14-15 Sequoia (Intel and Apple Silicon)
