description: A creative multitap delay plugin featuring up to 8 independent taps with individual controls for gain, stereo field, delay time, filtering, modulation, saturation, and reverb. Offers three operation modes (MULTIDELAY, MULTITAP, MULTIFB), LFO and envelope follower modulation, tape saturation based on mastering processor algorithms, and spring/plate reverb simulation. Supports up to 384 kHz/24-bit and full host automation.
details: |-
  PSP 608 MD is perhaps the most fully featured delay plug-in available on the market. It was designed as a creative tool that is not only functional, but also deeply inspiring.

  Each tap has selectable feedback, stereo image and position, delay time, multimode filter, modulation, drive/tape saturation, and reverb. Moreover, the feedback and drive can be placed at the beginning or end of the signal chain for even more sound design options!

  The modulation section offers both an LFO and envelope follower, and the tape saturation algorithm is taken from PSP's renowned mastering processors. All of this can be done at any bit depth and sample rate up to 24-bit/384 kHz.

  Three operation modes are provided. In MULTIDELAY, each tap has its own feedback buffer. In MULTITAP, the Master Feedback operates on one (user selectable) tap. In MULTIFB, turning off a tap leaves its feedback buffer signal active.

  Running the plug-in in 30-day trial mode or activating it requires a free iLok user ID and the free iLok License Manager application, with no hardware dongle needed. The license can be activated in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above).
specs: |-
  - Up to 8 seconds of delay time per channel
  - Continuous control over the delay time in milliseconds and/or chosen note quantization
  - MULTIDELAY operation mode, in which each tap has its own feedback buffer
  - MULTITAP operation mode, in which the Master Feedback operates on one (user selectable) tap
  - MULTIFB operation mode, in which turning off a tap leaves its feedback buffer signal active
  - Each tap includes independent adjustment of gain, stereo field width and balance, delay time, filtering, modulation, saturation simulation, and reverberation
  - Each tap can choose between multiple biquadratic filter types, including Low Pass, Band Pass, High Pass, Peak, and four Shelf filters
  - Modulation section (LFO and envelope follower) offers adjustable modulation depth of ±3 octaves, and can also be used to control filter cutoff
  - Tape saturation simulation with adjustable gain, based on the algorithm used in PSP's mastering processors
  - Filtering module in feedback includes LP/BP/HP filter (either State Variable Filter or Biquad) with adjustable cutoff and resonance
  - Vintage reverberation module for faithful simulation of spring and plate reverbs
  - Host automation of all processing parameters
  - Supports bit depths and sample rates up to 24-bit/384 kHz
  - Windows 7 to Windows 11 (64-bit VST, VST3, AAX for Pro Tools)
  - macOS 10.14 Mojave to macOS 15 Sequoia, Intel and Apple Silicon (64-bit AudioUnit, VST, VST3, AAX for Pro Tools)
  - iLok account required (free iLok License Manager, no hardware dongle needed)
  - License activatable in 3 separate locations
