description: HALO combines meticulously crafted audio with a host of synth
  layers, processing and FX to make huge sounding basses, leads, pads and more.
details: |-
  With a visual and creative workflow, HALO 2 redefines the space between audio and synthesis. Combining meticulously crafted re-sampled audio with a host of Synth layers, processing and FX, HALO 2 effortlessly creates enormous basses, soaring leads, lush pads, stabs and more. The immense presets will either slot straight into your projects or serve as an inspirational start point, but delve deeper into the extensive filter, FX and modulation options to make whole new sounds with just a few clicks. Unlike many Romplers, HALO 2 allows users to add their own custom audio files with infinite sound design possibilities, or simply load in one of the ever increasing range of Expansions, each with their own theme and sonic signature. And if that isn't enough the HALO FX plugin is included with HALO 2, bringing all of the filters, distortions and effects right into your DAW plug-in chain.

  A slicker user interface and refined user experience spearhead the immense upgrades including sampler frequency modulation, split channel arpeggiator, sample unison, precision sample loop editing, and bit-crushing, amongst many many more updates. The User Audio Import System has been totally redesigned offering increased flexibility and can even be modulated by other user audio files.

  At HALO's core are the Sample, Sub and Synth layers. The combination of samples and synthesis allows for huge sound generation with unparalleled weight, clarity, definition, width, and grit. With over 300 Sample Banks to choose from, a new Sample and Synth Unison engine, 4 multi-filters, 3 modulators, 4 FX units, 4 distortions, an Audio FM engine and assignable Arpeggiator, HALO is a unique sandbox of creativity. The Random Preset Generator makes it as simple as possible to create unique presets, with localised random buttons assigned to all the modulators, waveshaper, sample banks and arpeggiator too.

  The assignable on-board Arpeggiator elevates HALO 2 to a whole new plane of audio creation. Featuring a random melody generator, simply choose the scale and hit the random button to effortlessly create new and unique melodies, riffs or progressions. The Arpeggiator can be assigned to any combination of the sampler, sub or synth, allowing users to Arpeggiate their own samples on a bed of synthesis, or vice-versa. With its own preset browser users can store and recall their own arp settings, or browse the existing HALO library of over 30 presets and scales.

  One of HALO 2's finest upgrades is the Sampler FM engine. This functionality allows any Sample Bank or User Sample to be modulated by either a Synth (square and triangle waveforms), a Factory Sample Bank, or even another User Sample file, allowing for either subtle modulations or complete mangling of audio files. Coupled with a selection of four distortion modes (Warm Saturation, Amp Style Drive, Customisable Waveshaper, Crush), as well as the Synth FM engine, and improved Sample Bank editing including loop point manipulation, HALO 2 takes its core sound design potential to a different level.
