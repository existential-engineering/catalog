details: |-
  The air Bassline emulates the sound of classic mono synths with a contemporary
  twist. The Bassline is a monophonic vintage synthesizer featuring vacuum tube
  synthesis with an evolved version of air's vacuum tube circuit modelling
  technology. The evolved engine perfectly captures the crunchy, warm sound of
  the analogue era, with next-generation features, without compromising that
  superb warm sound.

  Featuring a flexible oscillator with continuously variable waveshape including
  octave saw, saw, square, and sine waveforms. Discover sub and fifth
  oscillators for thicker layered timbres. With multiple filters and envelopes
  and built-in audio effects, bassline lets you dive deep into subtractive
  synthesis to recreate those sought-after analogue sounds from the 70s and 80s.

  Bassline has world-class audio effects processing built-in to enhance your
  sounds as you create quickly. Choose from chorus, delay, reverb, compressor
  and the new hype eq., each with a dedicated section to dial-in any
  adjustments. You will also discover two built-in distortion algorithms to
  allow you to tweak your sound.

  Hype eq provides a quick way of enhancing the low- or high- end of any patch.
  Beef up wobbles, basses, and kick-drum sounds with deep sub-bass by adjusting
  the low hype parameter, or turn up hype high to polish off the high end with
  shimmer and sparkle; the latter sounds great on pads, strings, brass, and
  percussive sounds.

  The bassline comes packaged with a comprehensive factory library of over 150
  cutting-edge presets, including sumptuous pads, hard-hitting plucks,
  thunderous basses and screaming lead sounds. Included with your plugin
  purchase is our desktop player application. Fire up the desktop version and
  connect your favourite MIDI controller either by USB or Bluetooth, and you are
  ready to perform live. Originally exclusive to akai professionals mpc and
  force products by popular demand, this plugin is available in AU, VST, AAX
  formats for use in your favourite hosts or as a desktop app.
