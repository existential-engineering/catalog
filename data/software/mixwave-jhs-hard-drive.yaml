details: |-
  Designed to deliver the crushing high-gain tones of the '90s and 2000s alternative rock era, the Hard Drive is the most aggressive distortion JHS has ever made. Modeled in meticulous detail, it captures the amp-like saturation, tight articulation, and rich harmonics of the original hardware. Through advanced component-level modeling, every nuance of its gain staging, hard-limiting circuit, and powerful EQ has been faithfully recreated in plugin form. Introducing, MixWave: JHS Hard Drive .
