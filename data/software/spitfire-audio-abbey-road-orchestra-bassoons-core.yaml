details: |-
  Adding a rich, velvety sweetness to the bass and tenor ranges, the Abbey Road Orchestra Woodwinds section is completed by a world-class Bassoons a2 section. Meticulously captured in the legendary Abbey Road Studio One, the Core version delivers the essential sound and key expressive articulations of this beautiful woodwind instrument with all the character of a legendary recording studio, engineered by GRAMMY Award-winner Simon Rhodes.

  From its rich, warm tone in the lowest registers, to its sweet, piercing sound in higher passages, the bassoon is an immensely versatile instrument with a profound emotional range. Its unique timbre provides a foundational bass voice, supporting the entire orchestra with its resonant presence, executing playful, punchy staccatos, or weaving expressive, lyrical melodic lines with remarkable human-like warmth, akin to a resonant baritone singer.
specs: |-
  - 2 Bassoons (a2 section), 15 articulations
  - 2 legato techniques: Performance Legato, Lyrical Legato
  - Long techniques: Long, Long (sfz), Trills (major 2nds, minor 2nds, minor 3rds)
  - Short techniques: Staccato, Staccato (alt), Staccatissimo, Marcato, Tenuto, Short Double Tongue, Short Triple Tongue, Short Quad Tongue
  - 1 curated mix: Mix 1 by Simon Rhodes
  - 3 GB file size
  - macOS 11 to OS 26, Intel and Apple Silicon supported
  - Windows 10 or 11 (64-bit)
  - Minimum 8GB RAM, 16GB recommended
  - Twelfth instalment in the Abbey Road Orchestra product line
  - Spitfire Audio App required for installation
