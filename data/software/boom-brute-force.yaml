details: |-
  Aggressive sound elements to push the limits. The testament of a powerful
  sound is in its intricate composition. Layered to perfection, a sound emerges
  and envelopes, shaking the foundations of our existence. With this library,
  use the Massive impacts, rattles, and screams on their own or layer them with
  your sounds to make a bigger, more complex and savage sonic experience.

  Included sounds - keywords. Impacts, screams, whooshes, textures, transients,
  sustains, cracks.

  Brute force delivers in-your-face sound design packed with a yet unheard
  explosive energy. This collection of carefully hand-crafted sounds was
  developed and guided by our best sound designers. The intention was to dial up
  the impact of any project and leave the audience reeling. Each one of these
  bellicose sound effects will rattle the windows and shake the earth.

  The impacts, squeals, and whooshes are designed to be used as layers. When
  your sounds just aren't big enough, dip into this library to make them bigger
  than big and get truly nasty with these over-compressed sounds, giving your
  base sounds the right boost to cut through the mix.
