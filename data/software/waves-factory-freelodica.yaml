details: |-
  Freelodica is a sample library for Kontakt based on a melodica recorded with 2 microphone positions with stereo and width controls. Envelope, key-noise and air volume. 3x optional round robin and extended playable range. Select between original tuning or perfectly tuned samples. Dynamics controlled by the selected CC number.
specs: |-
  - Melodica sampled with 2 microphone positions
  - Stereo and width controls
  - Envelope, key-noise and air volume controls
  - 3x optional round robin
  - Extended playable range
  - Original tuning or perfectly tuned samples
  - Dynamics controlled by the selected CC number
  - For the full version of Native Instruments Kontakt
