details: |-
  Ar1 is an algorithmic reverb plugin designed to sound great on all types of
  instruments. Ar1 sounds amazing on pianos, bells, guitars, and vocals, but
  also on more synthetic sounds like synthesizer leads.

  A reverb plugin is used to make instruments sound like they are being played
  in a real place (hall, stadium etc), an algorithmic (ie realtime) reverb has
  to recreate this very convincingly or it will just sound "wrong" or fake. Ar1
  reverb gives you the ability to create a space of your liking with very simple
  to use controls.

  Ar1 sounds great and is easy to use with a high definition interface that is
  pleasing to work with.

  Early size controls the distance or size for any early reflections. Early
  level controls how much of an effect the early size control has on the overall
  sound of the reverb. Size increases the size of the reverb space, also has the
  effect of making the reverb tail last longer. Width is stereo width, at 0% the
  reverb will be completely mono, losing all stereo information, and at 100% the
  reverb sounds as wide as possible in the stereo field.

  Pre delay delays ar1 reverbs response by the pre delay amount in milliseconds,
  which can give the effect of an even larger space or just sound more natural.
  Bandwidth reduces the amount of high frequencies in the reverb. Damping
  controls how fast the high frequencies in the reverb dissipate over time.
  Modulation adds a little pitch modulation to the reverb tail. Mix controls how
  much of the original audio is mixed with the reverberation, with 100 wet to
  get only the ar1 reverb tail.
