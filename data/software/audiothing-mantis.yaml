description: Mantis is a plugin that emulates a rare BBD (bucket-brigade device)
  delay/echo unit of the 70s, faithfully recreating its warm and analog sound.
details: |-
  Mantis is a plugin that emulates a rare BBD (bucket-brigade device) delay/echo unit of the 70s, faithfully recreating its warm and analog sound. As with the original unit, Mantis features an echo section with four taps and four swell selectors, plus a rotafaze section, a modulation that can mimic the wow/flutter of a tape echo or turn the unit into a unique chorus-delay.

  The Mantis has eight TDA1022 chips, often associated with shorter and more precise delay, and these chips are perfect for organic analog slap-back echo. The base delay time is fixed on the hardware, but in the plugin's vintage mode the base delay can be set in the range of 1.02ms up to 102.4ms, as each chip has 512 stages and each tap uses 2 chips. In a BBD circuit the frequency response changes depending on the base delay, brighter at faster rates and darker at slower rates, so a modern mode is also included that allows a base delay of up to 1 second, free or synced to the host tempo.

  Built in the early 70s, the Carlsbro Mantis was probably one of the early, but less common, commercial BBD echo/delay units. As with many BBD echo/delays it has a warm and distinctive dark sound. BBD-based delays were a good alternative to the bulky and fragile tape echoes, although with several limitations: the Mantis had the delay time fixed, adjustable only by opening and tuning each BBD trimmer, and it was quite noisy, especially when using all the taps and swells.

  The BBD (bucket-brigade device) technology was developed by F. Sangster and K. Teer of the Philips Research Labs in 1969. BBDs are essentially a series of capacitors that pass an analog signal down a chain in discrete steps, like a bucket brigade passing buckets of water. The clock rate determines the rate at which the signal is passed down the chain, and because capacitors leak, longer delay times cause the signal to become distorted and darker with each repetition.

  Mantis is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP), and on the App Store for iPhone and iPad as an AUv3 plugin and Standalone (IAA).
