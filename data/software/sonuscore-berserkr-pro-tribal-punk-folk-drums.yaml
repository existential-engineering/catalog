  - CORE: WAV folder with 8000+ mastered audio files
  - CORE: single-level navigation, roughly 30% of the Pro edition's content
  - Round-robin loops with 8 to 32 samples inside each loop
  - Sequencer with dynamic sequencers and an advanced Groove Maker with probability features
  - Requires Kontakt 7.5.2 or newer, and is COMPATIBLE WITH THE FREE KONTAKT PLAYER
