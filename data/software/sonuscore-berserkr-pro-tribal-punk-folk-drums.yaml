  - PRO: WAV folder with 8000+ mastered audio files
  - PRO: 244 instrument patches in total (62 core patches, 97 multi-instruments), over 44 GB of samples, three-tiered folder navigation
  - CORE: 60+ NI Kontakt patches (62 curated instrument patches)
