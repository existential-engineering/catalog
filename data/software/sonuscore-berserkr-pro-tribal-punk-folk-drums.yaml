description: Most comprehensive library of percussion and clockwork samples that
  can be used to create rhythmic and mechanical sounds for all genres. Blends
  tribal authenticity with punk-inspired grit and folk instrumentation,
  featuring leather strikes, wood textures, fire crackling, sword sounds, and
  traditional instruments like nyckelharpa and cello.
specs: |-
  - Requires NI Kontakt 7.5.2 or newer (compatible with free Kontakt Player)
  - Berserkr Pro: 240+ NI Kontakt Patches, 90+ Multi-Patches, 370+ Elements, 4,500+ custom rhythm presets, 44+ GB sample content, 8,000+ WAV files
  - Berserkr Core: 60+ NI Kontakt Patches, 4,500+ custom rhythm presets, 8,000+ WAV files, streamlined single-level navigation
  - 8–32 round-robin samples per loop for natural variation
  - Advanced sequencer with groove-making and probability features
