  ancients, allowing you to craft unique and evolving drum rhythms effortlessly
  with the click of a button.
details: |-
  Berserkr is a tribal, punk and folk drum library built around ancient legends, battlefields, shamanic ceremonies and medieval sagas. Its stated aim is to be a portal into those settings rather than only a sound library, and its rhythms are driven by Keepforest's sequencing and randomizing algorithm.

  The tribal material is drawn from the raw materials of the period: strikes on leather, the textures of various wood types, rustling leaves and crackling fire, for atmospheres set in prehistoric epochs. The folk side adds authentic recordings of swords, leather coin pouches, tambourine jingles and the tones of nyckelharpa and cello, for knights, sword clashes and village tales. Every round-robin loop is mixed and harmonised, with a deliberate dash of punk-inspired grit, crunch and distortion.

  The sequencer redesigns and creates patterns and manipulates them through additional dynamic sequencers and an advanced Groove Maker with probability features. The round-robin loop collection carries 8 to 32 samples inside each loop, usable on their own or layered with other libraries, and is aimed at trailers and soundtracks with themes of epic battles, historical drama and mystical tales.

  Two editions are sold. Berserkr PRO has 244 instrument patches, including 62 core patches, 97 multi-instruments and further sound designs, with more than 44 GB of samples, multi-patches for pattern generation in both audio and nki form, and three-tiered folder navigation. Berserkr Core has the 62 curated instrument patches with single-level navigation and roughly 30% of the Pro edition's content.
specs: |-
  - PRO: 240+ NI Kontakt patches
  - PRO: 90+ NI Kontakt multi-patches
  - PRO: 370+ NI Kontakt elements
