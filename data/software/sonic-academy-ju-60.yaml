description: "JU-60 is a meticulously crafted chorus effect plugin emulating the
  iconic chorus found in the classic Roland Juno-60 synthesizer. Features three
  modes: Mode I (warm analog chorus), Mode II (deeper chorus with greater
  width), and Mode I+II (rotary speaker-type chorus). Simple interface with Mix
  and Level sliders."
details: |-
  Roland Juno-60 Chorus

  I - Classic warm analog chorus
  II - Deeper chorus with greater width
  I+II - Rotary speaker type chorus

  Mix
  Level
  Mode buttons
