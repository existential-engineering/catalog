details: |-
  The bt analog valve driver adr2s delivers that authentic saturation effect
  found in many vintage tube amplifiers. Not only does this model provide a
  tube-like overdrive effect, but also high pass and low pass filters and a
  noise gate to enable greater control of your overdriven sound.

  If your clean tracks call for a powerful and warm overdrive, your answer is
  the adr2s.

  Blue tubes valve driver adr2s by nomad factory / plugivery is a virtual effect
  audio plugin for macos and windows. It functions as a VST plugin, an audio
  units plugin and an AAX plugin.

  System requirements: pentium iv 2ghz / athlon xp 2ghz with 1gb of ram for
  windows; macintosh intel core solo 1.5ghz with 1gb of ram for mac. Windows 7,
  xp, vista are supported (32-bit and 64-bit). Mac os x 10.5 leopard and mac os
  x 10.6 snow leopard supported. Compatible intel macs; ppc are not supported.
