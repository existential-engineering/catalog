description: Butterfly packs four different modules meant to be used for audio mastering but that also shines as a mixing channel strip
details: |-
  HoRNet Plugins is proud to introduce HoRNet Butterfly, an audio mastering tool and channel strip designed to provide everything you need to perfect your stereo mixes or for final mastering. This plugin combines the power of several high-quality audio processing modules that you would typically find in separate plugins, offering exceptional versatility in a single interface.

  HoRNet Butterfly borrows the same advanced technology that has made our SAMP, the Spatial Audio Master Processor used for Dolby Atmos, a go-to solution for mastering professionals. By leveraging this technology, Butterfly brings the same powerful features and processing capabilities to stereo busses and mono channels alike, ensuring high-end results for any project, regardless of scale.

  The plugin includes four key processing modules: an equalizer, a compressor, a clipper, and a limiter. These modules have been carefully designed to offer professional-grade sound shaping and dynamic control.

  One of the standout features of HoRNet Butterfly is its intelligent oversampling technology. This allows the plugin to deliver high-quality processing without introducing aliasing or artifacts at any sample rate. Whether you are working with 44.1kHz or 192kHz audio, Butterfly’s oversampling ensures that your audio is processed with pristine clarity and detail.
specs: |-
  - Equalizer based on TotalEQ with up to 6 different bands
  - Compressor based on SyncPressor
  - Clipper and Limiter based on Magnus MK2
  - Input and output gain slider
  - Attack and release times can be synced to DAW tempo
  - Module order freely selectable
  - Bypass button for each module and global bypass button
  - LUFS input and output metering
  - Online help
  - Intelligent oversampling up to 4x
  - Resizable vector GUI
  - Hardware accelerated GUI
  - Apple Silicon native support
  - macOS (10.11 and later) and Windows (7 and later, OpenGL 2.1 required) support.
  - 64-bit only plugins for macOS and Windows.
  - Audio Units, VST, VST3 and AAX format.
