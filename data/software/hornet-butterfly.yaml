description: Butterfly packs four different modules meant to be used for audio mastering but that also shines as a mixing channel strip
details: |-
  HoRNet Butterfly is an audio mastering tool and channel strip designed to provide everything you need to perfect your stereo mixes or for final mastering. This plugin combines the power of several high-quality audio processing modules that you would typically find in separate plugins, offering exceptional versatility in a single interface. It borrows the same advanced technology that has made SAMP, the Spatial Audio Master Processor used for Dolby Atmos, a go-to solution for mastering professionals, bringing those processing capabilities to stereo busses and mono channels alike.

  The plugin includes four key processing modules: an equalizer, a compressor, a clipper and a limiter. The equalizer uses the same technology found in TotalEQ, offering a wide range of frequency shaping with precise and transparent processing. The compressor uses SyncPressor technology for transparent and musical dynamic control with minimal artifacts. The clipper and the limiter are both based on Magnus MK2, providing clean clipping without harsh digital distortion and transparent limiting that manages peaks without unwanted artifacts.

  Intelligent oversampling lets the plugin deliver high-quality processing without introducing aliasing or artifacts at any sample rate, from 44.1kHz to 192kHz, handling complex frequency ranges and transient details cleanly no matter how far the processing is pushed.

  The order of the four processing modules can be rearranged by dragging their positions in the top tabs control section, so custom processing chains can be built to suit the project: the clipper can be placed before the compressor for more dynamic control, or EQ applied after limiting for tone shaping. A built-in LUFS metering section reports momentary, short-term, integrated and true peak levels, so audio can be calibrated for streaming platforms and broadcast standards.

  Although primarily designed for mastering stereo busses, Butterfly also works on mono channels, effectively turning it into a channel strip usable from tracking through mixing and mastering. Each module can be independently disabled to save CPU, and the plugin is optimized to run across many instances in a large project.
specs: |-
  - Equalizer based on TotalEQ with up to 6 different bands
  - Compressor based on SyncPressor
  - Clipper and Limiter based on Magnus MK2
  - Input and output gain slider
  - Attack and release times can be synced to DAW tempo
  - Module order freely selectable
  - Bypass button for each module and global bypass button
  - LUFS input and output metering (momentary, short-term, integrated, true peak)
  - Online help
  - Intelligent oversampling up to 4x
  - Resizable vector GUI
  - Hardware accelerated GUI
  - Apple Silicon native support
  - macOS (10.11 and later) and Windows (7 and later, OpenGL 2.1 required) support
  - 64-bit only plugins for macOS and Windows
  - Audio Units, VST, VST3 and AAX format
  - No copy protection
