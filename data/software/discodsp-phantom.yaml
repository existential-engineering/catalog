url: https://www.discodsp.com/phantom/
description: Introducing discoDSP Phantom, the ultimate classic PM/FM
  synthesizer. With 8 voices of polyphony, 4 operators, and 8 routings, create
  unique, complex sounds.
details: |-
  8-voice polyphony; 4 operators with 8 routing algorithms; mono/legato/polyphonic
  operation; 4-pole resonant filter with LP/HP/BP/BR modes; ADSD2R envelopes for
  pitch, filter, and amplitude; parameter morphing; built-in stereo multi-effects
  (chorus, delay, reverb); pitch LFO; per-operator key and velocity scaling;
  operator phase modulation self-feedback; free-run phase support; octave shift
  per operator; amplitude LFO per operator; pitch/mod wheel with customizable
  bend range; glide with auto-on-legato mode; SysEx import for Yamaha
  DX27/DX21/DX100/TX81; demo version available
specs: |-
  - voices: 8
  - operators: 4 with 8 routing algorithms
  - architecture: 32-bit VST only (64-bit requires jBridge or 32-bit host)
  - windows: Windows 10+, AVX2-capable (Intel Haswell 2013+ or AMD Ryzen), 8 GB RAM
versions:
  - name: "1.2"
