description: Engine DJ Desktop (Engine PRIME) is a professional DJ management
  tool. Create, manage and prepare your DJ collection from the comfort of a
  computer.
details: |-
  Library management with playlists, folders, drag-and-drop reordering, filtering, and search to build an organized DJ collection on the desktop.

  Third-party library import for rekordbox, Apple Music / iTunes, Serato DJ, and TRAKTOR — including playlists, hot cues, and loops.

  Track preparation tools: beatgrid editing, up to 8 active loops per track, hot cue assignment, and metadata editing.

  Tri-band waveform coloring (blue = low, green = mid, white = high) for quick visual mixing and prep.

  Sync Manager for exporting and synchronizing prepared collections to Engine DJ OS hardware via USB drives or SD card.

  Smartlists that auto-organize tracks based on user-defined criteria, plus a dual-deck audition view for testing blends.

  Personal cloud collection storage and sync via Dropbox.

  Engine Lighting export for synchronized lighting control data.

  Built-in backup and restore tools for the collection database.
