description: Evolution Dragon is a very powerful collection of interacting playable HD sound design and composing tools, to create epic hybrid soundtracks and trailer music in light-speed. It combines sound effects, rhythmic pulse patterns, and tonal instruments in a single Kontakt instrument.
details: |-
  EVOLUTION DRAGON is a collection of interacting playable HD sound design and composing tools for epic hybrid soundtracks and trailer music. Sound effects, rhythmic patterns and melodic instruments all live within a single product.

  Trailer music and hybrid soundtracks interlace sound design elements such as rises, hits and stutters with tonal instruments and rhythmic patterns. The stated aim behind the library was to make playing and controlling all three of those layers at the same time as simple and intuitive as possible.

  The Pulse Designer builds underscore patterns: sample, BPM and rhythmic pattern can all be changed, as can the whole structure of the samples, with 180 designs to choose from and customise. Its rhythmic step sequencer is aimed at modern percussive elements.

  The sound design patches supply more than 280 playable sound effects, including whoosh hits, sub hits, whooshes, short hits, braams, rises and downers. Alongside them sit over 120 tonal patches covering pads, basses, leads, guitars, drones and pianos for writing melodies.

  The product is sold by Sonuscore as a download and requires a full version of Native Instruments KONTAKT; the free Kontakt Player only runs the instrument in demo mode.
specs: |-
  - Requires the FULL VERSION of Native Instruments' KONTAKT 5.5.1 or higher (NOT compatible with the free KONTAKT PLAYER, which runs the instrument in demo mode only)
  - Mac OS X 10.8 or higher, Intel Core 2 Duo
  - Windows 7 or higher, Intel Core 2 Duo or AMD Athlon 64 X2
  - 4 GB RAM
  - At least 3.6 GB of free hard disc space
  - Pulse Designer with 180 designs and a highly-flexible rhythmic step sequencer
  - More than 280 playable sound design patches
  - Over 120 tonal patches
  - SFX: 48 Whoosh Hits, 36 Sub Hits, 48 Whooshs, 30 Short Hits, 48 Braams, 48 Tonal and Untonal Risers, 24 Downers
  - Rhythms: 26 Hybrid Bass Riffs, 48 Bass Pulses Designer, 24 Mid Pulses Designer, 48 High Pulses Designer, 24 Click Rhythms Designer
  - Tonal patches: Pads, Bass, Leads, Guitars, Drones, Piano and more
  - Available as: DOWNLOAD
