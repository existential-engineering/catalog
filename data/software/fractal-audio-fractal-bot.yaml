description: Fractal-Bot is an application for Mac or Windows that enables you
  to send and receive data to and from your Fractal Audio Systems products. It
  is small, lightweight, and extremely easy to use.
details: |-
  Fractal-Bot is an application for Mac or Windows that sends and receives data to and from Fractal Audio Systems products. The page describes it as small, lightweight and extremely easy to use, and the banner above the description sums up the job as updating firmware, backing up and restoring, and more.

  The page carries a callout headed "Fractal-Bot is now built-in to our editors". For most current Fractal Audio products, Fractal-Bot is built directly into the product's editor, so the advice is to open that editor and check its Tools menu for Fractal-Bot before downloading the standalone application. The standalone Fractal-Bot on this page is only needed for older products, or in special cases where the editor is not available.

  The standalone application is still maintained and offered on the page as separate macOS and Windows builds. Version 3.01.00, dated October 30, 2026, ships as a .dmg for the Mac and requires OS X 10.13 or newer, and as an .exe for Windows requiring Windows 7 or newer, 64-bit, with a separate 32-bit build of the same version for Windows 7 or newer. The page notes that a missing MSVCP140.dll error on Windows is resolved by installing the Microsoft Visual C++ Redistributable Update. A Fractal-Bot manual, version 2.9 dated March 22, 2018, is published alongside the installers as a PDF.
specs: |-
  - Sends and receives data to and from Fractal Audio Systems products
  - Handles firmware updates, backup and restore
  - Small, lightweight and easy to use
  - Built directly into the editor for most current Fractal Audio products, reachable from the editor's Tools menu
  - Standalone build needed only for older products or where an editor is not available
  - Version 3.01.00, dated October 30, 2026
  - Mac build ships as a .dmg and requires OS X 10.13 or newer
  - Windows build ships as a 64-bit .exe and requires Windows 7 or newer
  - Separate 32-bit Windows build available
  - Fractal-Bot manual published as a PDF, version 2.9
