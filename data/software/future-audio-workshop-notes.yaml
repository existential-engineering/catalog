description: A new class of instrument that brings dynamic chords, authentic sounds, and smart composition tools together into one fluid workflow. Not your typical synth — it's an Ideas Machine, built to break out of creative blocks and move from idea to music faster. Notes is packed with hundreds of great chord progressions. Drop any audio, loop or MIDI file into The Lab to detect chords and play them. With layered sound engines, effects, and modulation, every sound has texture and atmosphere.
details: |-
  The Ideas Machine. Not your typical synth, it's an Ideas Machine, built to break out of creative blocks and move from idea to music faster.

  Notes is packed with hundreds of great chord progressions. Want to make your own? Drop any audio, loop or midi file into The Lab. We'll detect the chords, you play them. Only available in Notes. White keys play full, expressive chords, black keys transform how your chord plays, and you record what you perform straight to your DAW.

  Layer two sound engines: choose from Sampler, Synth, and playable multi-sampled instruments ranging from legendary analog synths recorded at the Berlin Synthesizer Museum to classical guitar. With layered sound engines, effects, and modulation, every sound has texture and atmosphere.

  The Blob is the macro page: grab it and move it around to instantly transform each sound into something new, with two macros automatically mapped for all presets and drag-and-drop assignment onto any parameter.

  Notes ships with six signature preset packs (Dark Synths, LA Vibes, LoFi, Notes Keys, Pedal Dust, Textures), each with its own collection of chord progressions. You'll receive an activation code instantly, which allows you to use Notes on up to three computers at a time, and there is a 30-day no-questions-asked refund.
specs: |-
  - Available as VST2, VST3, and AU
  - Tested in FL Studio, Ableton Live, and Logic
  - Compatible with macOS 10.12 and higher, 64-bit Intel processor or ARM (Apple Silicon)
  - Compatible with Windows 10 and higher
  - Requires 3.2GB (Windows) or 4.8GB (macOS) of free disk space to install
  - Can be used offline, but an internet connection is required to activate
  - Activation code allows use on up to three computers at a time
  - 3 sound engines: Sampler, Synth, and playable multi-sampled Instruments (two layerable at a time)
  - The Lab: Chord Sampler (drag in audio, loop or MIDI for automatic chord detection) and From Scratch (type in chords, switch voicing styles Wide, Pop, Ghibli, R&B, House, Dilla, Caesar)
  - 6 signature preset packs: Dark Synths, LA Vibes, LoFi, Notes Keys, Pedal Dust, Textures
  - Hundreds of chord progressions with unique voicings and play expressions performed by real musicians
  - Black transformer keys: play style, strum, arpeggio, reverse, and ramp, assignable and usable like a mod wheel
  - MIDI Out: record MIDI from Notes and route it to other instruments in your DAW
  - Synth engine with sine, triangle, sawtooth, square and supersaw, plus a Super Oscillator with unison layering, tuning, detuning, dry/wet mix and widening
  - Sampler engine with automatic pitch detection, root note and fine tune, X-Fade, reverse and loop
  - Sampled instruments include Casio CZ-3000, Yamaha DX7, Classical Guitar, Roland Jupiter-8, Mellotron, Moog Minimoog Model-D, Moog One, Piano, Sequential Prophet-10, Fender Rhodes 73 Mk I, Wurlitzer electronic piano and more
  - Imports Decent Sampler and SoundFont (SFZ) instruments; custom Multikey Instruments can be created
  - Macro page with 2 macros auto-mapped for all presets, drag-and-drop parameter assignment and the musically responsive Blob
  - Effects: Chorus (Clean, Juno I, Juno II, Juno III), Crush (Hardcore, Fizz), Distort (Screamer, Fizz, Dirty Tube, Diode), Lazer phaser, Noise (white noise, tape hiss/hum/air/crackle, clean and dirty vinyl, Space Open/Hellium/Wind), Shaper (Soft, Fuzz, Sine, Crazy), Tape with hiss and wobble, and vintage guitar pedal emulations (Rainger, Ambience, Ambiverb, Breath, Digital Hall, Gated Reverb, Plate, Soft Plate, Tascam, Tunnel)
  - Master effects: Delay with pingpong and sync, EQ, Grains, OTT Compressor, Reverb (Intimate, Studio Room, Concert Hall, Cathedral, Plate, Ambient Wash, Dark Ambient, Drum Chamber) and Shimmer (Pitched Reverb, Lush Synths, Infinite Space)
  - Modulation: 2 LFOs with sine, triangle, saw, square and noise waveforms, rate control and BPM sync
  - Analog-modelled filter with low pass, band pass and high pass shapes, one per sound engine
  - Patch browsing with pack icons, Favorites, user-created packs and browsing by pack name or sound category
  - Fully resizable interface
  - 30-day money-back guarantee
