description: A new class of instrument that brings dynamic chords, authentic sounds, and smart composition tools together into one fluid workflow. Not your typical synth — it's an Ideas Machine, built to break out of creative blocks and move from idea to music faster. Notes is packed with hundreds of great chord progressions. Drop any audio, loop or MIDI file into The Lab to detect chords and play them. With layered sound engines, effects, and modulation, every sound has texture and atmosphere.
details: |-
  3 x Sound Engines: Sampler, Synth, and playable multi-sampled Instruments

  The Lab: chord detection and customization tool for building and customizing chord progressions from audio, loops, or MIDI files

  6 x Signature Preset Packs: Dark Synths, LA Vibes, LoFi, Notes Keys, Pedal Dust, and Textures

  Hundreds of chord progressions with unique voicings and play expressions

  Chorus, reverb, delay, distortion, shimmer effects

  2 LFOs with multiple waveforms

  Customizable macro page with blob interface

  Mix and match FX, LFO modulation, Master FX, Macro Page, and more

  Casio CZ-3000, Yamaha DX7, Classical Guitar, Roland Jupiter-8 and more multi-sampled instruments

  Activation code allows use on up to 3 computers simultaneously; internet required for activation
