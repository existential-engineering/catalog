description: "A new class of instrument built to break creative blocks and move
  from idea to music faster. Combines a sampler, synthesizer, and chord
  progression tool into one workflow. Features chord playback and transformation
  via black/white key mapping, The Lab for chord detection and creation from
  audio files, multi-sampled instruments recorded from classic hardware (Casio
  CZ-3000, Yamaha DX7, Roland Jupiter-8, Classical Guitar), dual sound engines,
  a macro page with blob interface, and a full effects suite including chorus,
  reverb, delay, distortion, and shimmer."
details: |-
  3 engines: Sampler, Synth, and playable multi-sampled Instruments

  Chord detection and customization tool for creating and analyzing chord progressions from audio

  Chorus, reverb, delay, distortion, shimmer

  2 LFOs with multiple waveforms

  Customizable macro page with blob interface

  6 Signature Preset Packs (Dark Synths, LA Vibes, LoFi, Notes Keys, Pedal Dust, Textures), hundreds of chord progressions

  Casio CZ-3000, Yamaha DX7, Classical Guitar, Roland Jupiter-8 and more

  Up to 3 computers simultaneously, internet required for activation
