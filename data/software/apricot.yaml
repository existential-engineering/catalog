name: Apricot
manufacturer: nakst
primaryCategory: synthesizer
description: "Apricot is a free compact hybrid synthesizer with a massive sound.
  Key features: 2 main oscillators, with 6 different subtractive waveforms."
details: >-
  Apricot is a free compact hybrid synthesizer with a massive sound. It
  functions as an audio units plugin and a clap plugin for macos, windows and
  linux.


  Key features include 2 main oscillators with 6 different subtractive
  waveforms, modulatable phase offset and panorama, with unison modeled off the
  supersaw. There is also an additional third oscillator, with less parameters,
  intended for use as a sub-oscillator. A sample layer provides 44 factory
  samples ranging across 10 categories, with the ability to import custom
  samples.


  The synthesizer includes 2 mod envelopes and 2 lfos, each with 2 dedicated
  modulation slots, plus a modulation matrix with 8 additional modulation slots
  for a total of 16. There are over 70 modulation destinations and over 10
  modulation sources available.


  5 effects are included: reverb with 4 selectable algorithms, ping-pong delay,
  stereo phaser, parameter eq, and a distortion unit. The distortion contains
  light, soft, middle and hard algorithms closely modeled after the virus, to
  achieve a distinctive asymmetric distortion, with 3 included wavefolding
  algorithms.


  The multi-mode filter can run in low-pass, band-pass or high-pass modes at
  12db/oct or 24db/oct, with resonance, key track and drive control. The drive
  can be enhanced with a warm boost, which mixes in a subtly inflated signal. An
  arpeggiator and sequencer are included, along with a streamlined single page
  user interface with scaling from 100% to 200%.
specs: |-
  - 2 main oscillators with 6 subtractive waveforms
  - Modulatable phase offset and panorama
  - Unison modeled off the supersaw
  - Third oscillator for sub-oscillator use
  - Sample layer with 44 factory samples across 10 categories
  - Custom sample import
  - 2 mod envelopes with 2 dedicated modulation slots each
  - 2 lfos with 2 dedicated modulation slots each
  - Modulation matrix with 8 additional modulation slots (16 total)
  - Over 70 modulation destinations
  - Over 10 modulation sources
  - 5 effects: reverb with 4 algorithms, ping-pong delay, stereo phaser,
  parameter eq, distortion unit
  - Distortion algorithms: light, soft, middle, hard modeled after virus
  - 3 wavefolding algorithms
  - Arpeggiator and sequencer
  - Multi-mode filter: low-pass, band-pass, high-pass modes
  - 12db/oct or 24db/oct filter slopes
  - Resonance, key track, and drive control
  - Warm boost for drive
  - Single page user interface with 100% to 200% scaling
  - Custom skin template support
  - Over 90 builtin patches in factory rom bank
  - Full clap plugin API support
  - No copy protection or drm
  - Windows 7 and later (64-bit os)
  - Macos 10.14, 10.15, 11, 12 (intel or apple silicon)
  - X11/linux with modern glibc
  - Fl studio plugin format support (fl studio 9 or newer)
  - Bitwig and reaper tested compatibility
  - Polyphonic non-destructive modulation support
  - Slide/glide notes support
  - Sse2 processor support (avx recommended)
  - Approximately 50 mb disk space required
