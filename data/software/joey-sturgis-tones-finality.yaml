details: |-
  FEATURED IN:
  Finality is a limiter designed from the ground up to be both powerful and versatile. Whether your source is very dynamic like drums and vocals, or more flat like distorted rhythm guitars and synth, Finality can be dialed to masterfully control peak and level dynamics in your mix.
  Hard and soft modes will change the character of the transients
  Aggro can alter the release envelope to be more favorable to drums.
  Need a little edge? The color button can add helpful saturation to a signal.
  There’s even a mix control to allow for parallel processing.
  Anticipate and handle any unruly peaks with look ahead.
  Utilize the sidechain to optimally react to low-end material
  Auto gain automatically sets the make-up gain and can be switched off
  Don’t be limited. Be versatile.
  Finality Advanced is our fully featured Limiter built for ultimate versatility and performance. Finality Lite is a more light weight version of Finality Advanced with less controls and less features. Finality Advanced includes Finality Lite.
  Video Manual
  "Two thumbs up with this plugin as a drum limiter! I'd use this for sure on a drum kit."
  ~ Dan Korneff // Producer, Engineer (Breaking Benjamin, Paramore, Crown The Empire)
  (http://www.dankorneff.com)
  Includes
  Audio Plugin (single user license)
  Manual
  NOTE: Finality Advanced includes Finality Lite.
specs: |-
  Requirements
  A computer with an Intel, or M1/M2 compatible processor, Windows or macOS operating system, and a compatible DAW installed (check which plugin formats your DAW supports). This plugin does NOT operate as a standalone!
  Compatibility
  Windows 8.1 or above (64 bit): VST3, AAX
  macOS 10.14 or above (Intel or M1/M2, 64 bit): VST3, AU, AAX
