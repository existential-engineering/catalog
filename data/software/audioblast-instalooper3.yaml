description: This glitch tool can loop the real time audio to apply time and
  pitch changes to create effects on your musical creations.
details: |-
  Instalooper3 is an advanced glitch effect tool designed to loop real-time audio, enabling seamless application of time and pitch changes to enhance your musical compositions. This versatile looper plugin goes beyond conventional boundaries, allowing you to introduce breaks at measure ends, lending an unstructured yet captivating quality to your sound. Its rapid looping capabilities facilitate the creation of dynamic roll effects, adding depth and texture to your tracks.

  Distinguishing itself with 6 integrated FX options, including reverse and pitch manipulation, InstaLooper3 empowers users to craft short, intricate loops within seconds. Additionally, its real-time glitch effects offer unparalleled creativity, transforming audio on the fly.

  Unconventional in its approach, InstaLooper3 stands apart from traditional loop recorders, offering a wide array of creative possibilities. Its intuitive interface and real-time manipulation capabilities provide musicians with innovative tools to sculpt and redefine their soundscapes, delivering unique and engaging results for musical compositions.

  Performers: made to control your glitch effects. Draw patterns of modulation in the Sequencer section and assign it to parameters in order to create embedded automations to apply effects on the loop rows. You can then activate the loops to create inventive effects on the sound. Every knob on the interface is automatable to get more controls and make creative glitch effects.

  Instalooper takes inspiration from many electronic genres like IDM, Breakbeat, Techno, Jungle/Drum n' Bass or even Glitch Hop, and music artists such as Autechre, Aphex Twin, Squarepusher, Venetian Snares, Igorr, or The Glitch Mob.
specs: |-
  - A parameter sequencer with 16 independent and automatable knobs
  - 16 steps by parameter track
  - 4 independent loops to edit
  - 6 integrated FX: Gate, Bit Crusher, Auto Pan, Filter, Phaser, Time Expand
  - A Dry/Wet effect knob
  - A parameter knob
  - A reverse button
  - A pitch modulation
  - 64-bit, compatible from Pro Tools 11 and above for AAX
  - macOS 10.13 to latest, Apple Silicon M1 to M4 compatible, Intel Core i5 or equivalent CPU, 2 GB RAM
  - Windows 7 to 11, Intel Core i5 or equivalent CPU, 2 GB RAM
  - Linux (VST3 installer available)
  - Requires an internet connection in order to install and update
