  - Platforms: Windows 7–11 (64-bit), macOS Intel/Silicon 10.14–15
  - Max sample rate: 400kHz
  - External or internal side-chain with bell-type filter
  - Feedback and feedforward compression modes
  - FAT quad sampling
  - Output: brick wall limiter or soft saturation
