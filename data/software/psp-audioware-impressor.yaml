details: |-
  Wide range of soft knee characteristics. Peak or RMS level detection. External/internal side chain with bell-type filter. Output algorithm with brick wall limiter or soft saturation. FAT quad sampling option. Internal quad sampling; 16x sampling with FAT engaged. Support up to 400kHz sample rate. Feedback and feedforward compression modes. Multiple auto attack/release modes.
