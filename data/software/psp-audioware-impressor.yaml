description: PSP Impressor is an incredibly accurate, a fully-featured, high-precision compressor designed to process whole mixes, busses or single tracks.
details: |-
  PSP Impressor is an incredibly accurate, a fully-featured, high-precision compressor designed to process whole mixes, busses or single tracks. PSP Impressor emulates the magical classic characteristics of compressors with valve and opto-electronic circuits as well as classic modern compressors. PSP Impressor also features a highly configurable side-chain. The side-chain filter has a significant effect on PSP Impressor's sound and operation. Depending on the side-chain filter settings, the filter also allows the compressor to be used as a de-esser or to reduce the pumping effects of heavy kick drums and the like.

  PSP Impressor also works very well in combination with the PSP Saturator. With the PSP Impressor before the PSP Saturator in the signal path, comparable to placing a bus compressor before a tape machine, both plug-ins can be used simultaneously at subtle settings to impart a very cohesive sound, as though the mix were produced on expensive analog hardware. The order can also be reversed, placing PSP Saturator before PSP Impressor.

  The most obvious difference between PSP Impressor and its predecessor, PSP MixPressor, is its new GUI, but PSP Impressor offers many more enhancements and new goodies than just a new interface. PSP Impressor features many refinements in sound quality that make it a vital tool for the future of audio production.

  The entire compression engine runs at internal quad sampling for proper compressor modelling when FAT is disengaged, and 16 x sampling when FAT is engaged. New side chain filter modes were added: HPF and Equal Power. PSP MixPressor only had its powerful Bell type side chain filter, however HPF gives PSP Impressor a more classic touch, and the Equal Power results in extremely transparent and well balanced compression of complex tracks, drum groups or even entire mixes.

  A free demo version is available, which runs for 30 days.
specs: |-
  - A wide range of soft knee characteristics
  - Peak or RMS level detection
  - External or internal side chain signal with a smooth bell-type filter
  - An output algorithm which can operate as either a brick wall limiter or soft saturation algorithm to preserve peaks above 0dBFS
  - New high resolution, scalable GUI
  - FAT quad sampling option
  - Entire compression engine runs at internal quad sampling for proper compressor modelling when FAT is disengaged and 16 x sampling when the FAT is engaged
  - High sample rate support up to 400kHz
  - Feedback and feedback + feedforward compression modes
  - New side chain filter modes: HPF and Equal Power
  - Four Auto Attack and four Auto Release modes
  - Refined compression Shapes for added versatility
  - Adjustable Auto Makeup mode
  - Adjustable channel Link
  - Input (Pre) and output (Post) meter modes with optional Compare mode
  - Adjustable VU reference level
  - Input - Output knobs' link
  - New output Limiter
  - Requires an iLok user ID and the free iLok License Manager application, no hardware dongle needed
  - License can be activated in 3 separate locations, each either a computer or an iLok dongle (2nd generation or above)
  - Windows 7 - Windows 11, 64-bit VST3 / VST / AAX (Pro Tools) compatible host
  - macOS 10.14 - macOS 15 Sequoia, 64-bit AudioUnit / VST / VST3 / AAX (Pro Tools) compatible host
