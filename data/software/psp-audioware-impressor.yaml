description: A high-precision compressor designed for mixing whole mixes, busses, or individual tracks. PSP Impressor emulates classic valve, opto-electronic, and modern compressor characteristics, featuring a configurable side-chain that enables uses such as de-essing and kick drum control.
details: |-
  PSP Impressor emulates valve, opto-electronic, and modern compressor characteristics with a wide range of soft knee characteristics. Features peak or RMS level detection, external or internal side-chain with bell-type filter, feedback and feedforward compression modes, multiple auto attack/release modes, FAT quad sampling, and an output algorithm functioning as either a brick wall limiter or soft saturation.

  Supports sample rates up to 400kHz. iLok License Manager required (no hardware dongle). 30-day trial available.
