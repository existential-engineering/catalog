details: |-
  Beat Morpher is a sample playback drum machine with a difference. You specify
  start and end positions for each drum hit, then you can morph between the two
  patterns using a slider or by just pressing the auto-morph button - the beat
  will gradually morph over a specified number of bars.

  This effect was inspired by the music of simon posford aka hallucinogen and
  shpongle (with raja ram).

  Beat morpher by oli larkin is a virtual instrument audio plugin for windows.
  It functions as a VST plugin.
specs: |-
