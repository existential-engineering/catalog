  also performs perfect ducking of background music when a voiceover enters,
  ideal for podcasts, video production and broadcasting.
details: |-
  The HOFA SYSTEM Ducker elegantly reduces effects such as delay and reverb when you want it to. It also performs perfect ducking of background music when a voiceover enters, ideal for podcasts, video production and broadcasting.

  You want to prevent effects such as reverb and delay from getting too loud while the original sound is playing? The SYSTEM Ducker does this for you in no time, completely without automation! To give you an example: You put a delay on a voice, and you only want it to be heard during the 'pauses.' The ducker controls this exactly as you want. That way, the delay sounds big and atmospheric in the mix, without getting in the way. All you have to do is drag the effect into the Ducked Chain.

  If you want to use spoken audio over music, you usually have to deal with the music being too loud or too quiet. With elaborate automation, you can solve this problem manually, but this is usually time-consuming and tedious. The easiest and best way to do this is to use the HOFA SYSTEM Ducker: place the SYSTEM Ducker on the track with the background music, route the voiceover to the external sidechain input of the SYSTEM Ducker, and set Attack, Hold, Release and LookAhead to your liking. That's it, now your voice always sits perfectly on top of the backing track.

  All plugins from the HOFA SYSTEM series are also available as freeware with a slightly limited feature set. Simply install HOFA SYSTEM using the HOFA-Plugins Manager, and you can then use all freeware features immediately. In the SYSTEM Ducker freeware only one plugin can be inserted in the Ducked Chain, LookAhead is unavailable, and Attack, Hold and Release are fixed at 10 ms, 100 ms and 100 ms respectively.

  Professional audio magazine reviewed the SYSTEM Ducker as "Ducking deluxe", highlighting its "unique feature: The Ducker has a 'Ducked Chain' section, where additional SYSTEM plugins can be inserted easily into the ducking path."
specs: |-
  - Flexible ducker with exceptionally wide adjustment ranges (attack, hold, release, lookahead)
  - Apply delays, reverbs and other effects in Ducked Chain for level control
  - External sidechain input for automatic attenuation of music when a voice is detected
  - Optional invert mode for creative effects
  - Interactive display for easy operation
  - Threshold from -60 to 0 dB
  - Attenuation from -60 to 0 dB
  - LookAhead 0 ms to 1000 ms
  - Attack 1 ms to 1000 ms
  - Hold 0.1 ms to 2000 ms
  - Release 1 ms to 2000 ms
  - Unlimited plugins insertable in the Ducked Chain
  - Also available in a freeware version with slightly reduced feature set
  - Formats: VST3, AU, AAX
  - Operating System: macOS 10.13 or later, Windows 10 or later
  - Continuously tested on Ableton Live, Apple Logic, Avid Pro Tools, Bitwig, Cockos Reaper, Image Line FL Studio, Magix Samplitude/Sequoia, Fender Studio Pro, Steinberg Cubase/Nuendo/Wavelab
  - Two licenses included, managed via the HOFA Plugins Manager; offline activation supported
  - 14 days free trial
