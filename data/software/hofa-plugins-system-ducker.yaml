description: Elegant ducking for effects and voiceover
details: |-
  The HOFA SYSTEM Ducker elegantly reduces effects such as delay and reverb when you want it to. It also performs perfect ducking of background music when a voiceover enters – ideal for podcasts, video production and broadcasting. Flexible ducker with exceptionally wide adjustment ranges (attack, hold, release, lookahead) Apply delays, reverbs and other effects in Ducked Chain for level control External sidechain input for automatic attenuation of music when a voice is detected Optional invert mode for creative effects Interactive display for easy operation Also available in a freeware version with slightly reduced feature set HOFA SYSTEM Ducker in practical use Video content: Ducking delay Ducking reverb Invert mode Ducking music with voiceovers Kick & bass sidechain ducking Two applications for ducking 1. Ducking effects such as delay and reverb You want to prevent effects such as reverb and delay from getting too loud while the original sound is playing? The SYSTEM Ducker does this for you in no time – completely without automation! To give you an example: You put a delay on a voice, and you only want it to be heard during the ‘pauses.’ The ducker controls this exactly as you want. That way, the delay sounds big and atmospheric in the mix, without getting in the way. All you have to do is drag the effect into the Ducked Chain. Here you can see and hear a delay effect in the ducked chain. You can clearly hear how the ducker controls the delay so that it is louder in the pauses. This creates an interesting, dynamic sound. And here is the same delay setting without the ducker. The echo effect interferes with the original signal and disturbs the vocal intelligibility when it is supposed to be loud during the pauses. 2. Ducking background music with voiceovers If you want to use spoken audio over music, you usually have to deal with the music being too loud or too quiet. With elaborate automation, you can solve this problem manually, but this is usually time-consuming