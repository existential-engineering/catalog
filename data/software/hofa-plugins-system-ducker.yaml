description: Elegant ducking for effects and voiceover
details: |-
  HOFA SYSTEM Ducker is a flexible ducking plugin for reducing effects and attenuating background music automatically. Effects such as delay and reverb can be dragged into the "Ducked Chain" so their output level is automatically reduced when audio is detected. An external sidechain input enables automatic music attenuation during voiceovers, making it well suited for podcasts, video production, and broadcasting.

  The plugin features wide adjustment ranges for all key parameters: attack (1–1000 ms), hold (0.1–2000 ms), release (1–2000 ms), lookahead (0–1000 ms), threshold (−60 to 0 dB), and attenuation (−60 to 0 dB). An optional invert mode allows creative applications of the ducking effect. An interactive display provides visual feedback.

  The plugin is part of the HOFA SYSTEM series and is also available as a freeware version with a limited feature set (fixed attack 10 ms, hold 100 ms, release 100 ms, no lookahead). A 14-day free trial is available. Two licenses are included per purchase, managed via the HOFA Plugins Manager, with offline activation and USB stick support. The plugin is included in the SYSTEM All Bundle.
specs: |-
  - Formats: VST3, AU, AAX
  - Operating System: macOS 10.13 or later, Windows 10 or later
  - Lookahead: 0–1000 ms (full version)
  - Attack: 1–1000 ms (full version); 10 ms fixed (freeware)
  - Hold: 0.1–2000 ms (full version); 100 ms fixed (freeware)
  - Release: 1–2000 ms (full version); 100 ms fixed (freeware)
  - Threshold: −60 to 0 dB
  - Attenuation: −60 to 0 dB
  - External sidechain input
  - Optional invert mode
  - Drag-and-drop Ducked Chain for effect routing
  - Interactive display
  - Freeware version available with limited parameters
  - Two licenses included; managed via HOFA Plugins Manager
  - Offline activation supported
  - USB stick compatible
  - Tested DAWs: Ableton Live, Apple Logic, Avid Pro Tools, Bitwig, Cockos Reaper, Image Line FL Studio, Magix Samplitude/Sequoia, Presonus Studio One, Steinberg Cubase/Nuendo/Wavelab
