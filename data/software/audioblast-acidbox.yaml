details: |-
  AcidBox V2 is a powerful bassline synthesizer plugin inspired by the legendary 303 bassline synth that defined the sound of the 1980s Acid House and Techno scenes. Reimagined for today's producers, AcidBox V2 combines the unmistakable analog acid sound with a modern interface, real-time performance controls, and built-in effects for next-level creativity.

  Designed for Acid House, Techno, Rave, and Electronica, this 303-style bass synthesizer lets you create hypnotic acid lines and evolving sequences in seconds. Its redesigned interface ensures smooth workflow and instant hands-on control for both studio production and live performances.

  Whether you're performing live or producing in the studio, AcidBox V2 delivers real-time control and fluid creative flow. Record, tweak, and manipulate your sequences instantly, which suits live techno sets, acid jams, and dynamic performances.

  AcidBox V2 pays tribute to Acid pioneers and Techno masters such as DJ Pierre, Hardfloor, Aphex Twin, Daft Punk, Laurent Garnier, Woody McBride, Leo Anibaldi, and Fast Eddie, artists who shaped electronic music through their innovative use of the 303 sound.

  AcidBox V2 blends the soul of the 303 with modern flexibility, aimed at Techno, Acid House, Trance, and Rave producers who want that acid groove in their tracks.
specs: |-
  - Classic 303 sound, modernized for today's music producers
  - Powerful sequencer from 16 to 64 steps
  - Up to 32 patterns per session, with multiple ways to launch patterns via MIDI programming and launch quantifications
  - Easy pattern view and 303 presets included
  - 4 sync modes: Internal, Host Sync, MIDI In, and ARP
  - ARP mode plays the displayed sequence from a MIDI keyboard, staying synchronized to tempo and transposing to the pitch of the triggered note
  - 6 integrated effects: 5 distortions (Overdrive, Clipper, Hot Valve, Ultracrunch, Bit Crusher) and 1 delay
  - Intuitive delay with Ping Pong and sync mode
  - Create sequences on the fly for live situations, with record on the fly from MIDI in, external devices and external controllers
  - Playing chords automatically arpeggiates the sequence
  - MIDI OUT to sync with an external synth, or drag and drop the MIDI onto clips in live situations
  - Assignable random button and realtime random options for accents, slides, notes, octaves, steps, fine tune, fine time, pan, params, or all
  - Resizable UI at 75, 100, 150 and 200 percent, with dark mode
  - Fine tune, fine time and pan parameters per step
  - Audio reacts to pitch bend, with adjustable pitch bend range
  - Mouse wheel support on knobs, double click on knobs to reset to default value, CTRL click to reset sliders
  - Step shift to move the sequence left or right, and transpose to move the entire sequence up or down
  - Single clear for note, octave, fine params, step, accents or slides, plus clear all patterns
  - Transpose for MIDI Out and a customizable accent threshold value for MIDI In mode and MIDI export
  - Stays in sync when bypassed and un-bypassed, with a MIDI assign chart
  - MIDI export including accents and slides
  - Drag and drop .303 files onto the UI
  - Multiple import and export formats: .303, Phoscyon, ABL2, ABL3
  - Available formats: VST2, VST3, NKS, AAX, Audio Unit, Standalone
  - 64-bit and compatible with Pro Tools 11 and above
  - macOS 10.13 to the latest macOS update, Apple Silicon compatible M1 to M4, Intel Core i5 or equivalent CPU, 2 GB RAM
  - Windows 7 to 11, Intel Core i5 or equivalent CPU, 2 GB RAM
  - Linux
  - Requires an internet connection in order to install and update your products
