description: AcidBox is a bassline synthesizer based on 303 emulation, with a powerful sequencer , 4 distortions,1delay, MIDI in, MIDI out, VST3, VST2, AU, AAX
details: |-
  AcidBox V2 is a bassline synthesizer plugin inspired by the legendary 303 bassline synth that defined the sound of the 1980s Acid House and Techno scenes. Reimagined for today's producers, AcidBox V2 combines the analog acid sound with a modern interface, real-time performance controls, and built-in effects.

  Designed for Acid House, Techno, Rave and Electronica, this 303-style bass synthesizer lets you create hypnotic acid lines and evolving sequences in seconds. Its redesigned interface is built for smooth workflow and instant hands-on control for both studio production and live performance.

  The sequencer runs from 16 to 64 steps with up to 32 patterns per session, and offers four sync modes: Internal, Host Sync, MIDI In and ARP. In ARP mode the displayed sequence can be played from a MIDI keyboard, staying synchronized to the tempo while being triggered and transposed by incoming notes. Patterns can be launched via MIDI programming with launch quantization, recorded on the fly, and driven from external devices and controllers.

  Six integrated effects shape the sound: five distortion units (Overdrive, Clipper, Hot Valve, Ultracrunch and Bit Crusher) plus one delay with ping-pong and sync modes. Per-step fine tune, fine time and pan parameters, an assignable random button with multiple realtime randomization targets, step shift, transpose and MIDI OUT round out the performance feature set.

  The V2 interface is resizable at 75, 100, 150 and 200 percent with a dark mode. Sequences, patterns and banks import and export in multiple formats (.303, Phoscyon, ABL2 and ABL3), with drag and drop of .303 files onto the UI. Demo versions are available for macOS, Windows and Linux, and the plugin is 64-bit and compatible with Pro Tools 11 and above.
specs: |-
  - The "Acid" sound, a 303 bassline emulation
  - Powerful sequencer up to 64 steps (16 to 64 steps)
  - Up to 32 patterns per session
  - Multiple ways to launch patterns: MIDI programming and launch quantifications
  - Easy pattern view
  - 303 presets included
  - 4 sync modes: Internal, Host sync, MIDI in, ARP
  - ARP mode: play the displayed sequence from a MIDI keyboard, synchronized to tempo and transposed by note pitch
  - 5 distortions: Overdrive, Clipper, Hot Valve, Ultracrunch, Bit Crusher
  - 1 intuitive delay with ping pong and sync mode
  - Create sequences on the fly for live situations
  - Record on the fly, MIDI in from external devices and controllers
  - Playing chords automatically arpeggiates the sequence
  - MIDI OUT to sync with an external synth, or drag and drop MIDI onto clips
  - Assignable random button (choose what gets randomized)
  - Realtime random options: accents, slides, notes, octaves, steps, fine tune, fine time, pan, params, all
  - Resizable UI at 4 sizes: 75, 100, 150, 200 percent
  - Dark mode
  - Fine tune, fine time and pan parameters per step
  - Audio reacts to pitch bend, with adjustable pitch bend range
  - Mouse wheel support on knobs
  - Step shift to move the sequence left or right, and transpose for the entire sequence
  - Double click on knobs to reset to default (CTRL/Command + Click also works)
  - CTRL click to reset mini fine sliders to default values
  - Single clear for note, octave, fine params, step, accents or slides, plus Clear all patterns
  - Transpose for MIDI Out
  - Customizable accent threshold value for MIDI In mode and MIDI export/out
  - Stays in sync when bypassed and un-bypassed
  - MIDI assign chart
  - MIDI export including accents and slides
  - Drag and drop .303 files onto the UI
  - Multiple import and export formats: .303, Phoscyon, ABL2, ABL3
  - Updated oscillators and filter for more bass
  - 64-bit, compatible with Pro Tools 11 and above
  - macOS 10.13 to latest, Intel Core i5 or equivalent CPU, 2 GB RAM, Apple Silicon M1 to M4 compatible
  - Windows 7 to 11, Intel Core i5 or equivalent CPU, 2 GB RAM
  - Requires an internet connection to install and update
