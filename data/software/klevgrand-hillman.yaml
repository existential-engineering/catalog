details: |-
  Hillman is a synthlike instrument inspired by old combo-organs, string machines and similar vintage gear. It has 4 voices per note, each with selectable waveform (transistor:ish, tube:ish, sine and special plasma), octave switch and a level control. The sound is generated with an analog approach, but does not use samples or sampled wavetables. Hillman also has an intuitive ADSR envelope control, FX section with Chorus, Phaser & Reverb, and comes with many built-in presets.

  Up to four voices per note are available, each with an individual waveform, and an intuitive ADSR control covers any envelope needs.

  The effects section pairs a smooth ensemble chorus with 3 different modes and a 4-pole phaser with 2 different modes, followed by a one-knob reverb that ranges from a small room to churchlike halls and a drive control for grit and extra character.

  Version 1.1 added semitone pitch adjustment with fine-tune, a peak meter, a scalable UI and the drive control. An iPad edition is available in AUv3 format from the App Store.
specs: |-
  - 4 voices per note
  - Each voice has selectable waveform (transistorish, tubeish, sine and special plasma) + octave switch and level control
  - ADSR Envelope control
  - Smooth ensemble chorus with 3 different modes
  - 4-pole phaser with 2 different modes
  - Lush reverb which ranges from small room to churchlike halls
  - Rich collection of built-in presets
  - Semitone pitch adjustment (with fine-tune)
  - Peak meter
  - Scalable UI
  - Drive control for grit and extra character
  - Analog sound generation approach, no samples or sampled wavetables
  - Requires macOS 10.10 or later (optimized for the M1-processor), Windows 7 (SP1) or later, running a AU, VST or AAX compatible 64-bit host
  - iPad version available in AUv3 format
