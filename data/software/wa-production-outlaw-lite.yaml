description: A free, reduced edition of the Outlaw gain riding plugin. It tracks the incoming signal and compensates for level changes automatically, with Mix, Target, Gate and Gain controls plus a peak and RMS display.
details: |-
  Outlaw Lite is a cut-down edition of the Outlaw gain riding plugin, without the advanced features and presets of the full version. It listens to incoming audio and compensates for volume changes in the way an engineer rides a mixing desk fader, which removes the need to draw detailed volume automation.

  Gain riding of this kind is useful when mixing live sound, smoothing vocals or balancing solo instruments, and the plugin is intended as a first step into the technique.

  Four main dials cover the fundamental parameters. MIX sets the intensity of the effect, TARGET sets the RMS target level, GATE sets a relative level below which the gain rider ignores softer sounds, and GAIN controls the master output, which is useful for setting accurate levels for A/B comparison.

  A bold visual feedback display shows peak and RMS volume for the left and right channels together with the amount of gain riding being applied.

  It is positioned as a first plugin in the chain on live guitars, vocals, bass and drums, or on any source that needs level smoothing.
specs: |-
  - Automatic gain riding against an RMS target
  - Mix, Target, Gate and Gain controls
  - Peak and RMS metering for left and right channels
  - Gain riding amount display
  - Reduced feature set compared with the full Outlaw, without its advanced controls and presets
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
