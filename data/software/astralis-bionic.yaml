description: Like baby bion, Astralis Bionic is based around the bion oscillator
  and soundscaper, but adds an arpeggiator, modulation sequencer and gate.
details: |-
  Astralis Bionic is based around the bion oscillator and soundscaper, but adds
  an arpeggiator, modulation sequencer and gate sequencer (trance gate). As a
  result it is capable of everything baby bion does with the addition of complex
  tempo synced rhythms.

  The uniquely developed dual oscillator provides over 3,500 different waveforms
  which can be mixed in many flexible ways including fm, giving many more
  possibilities.

  The oscillator and filter code has been highly optimized for excellent
  performance using sse instructions where possible.

  Main features include: dual oscillator with multiple mixing modes, cascadable
  filter up to 8 times with various filter types, 32 stage envelopes capable of
  repeating sections, drive with auto volume distortion, arpeggiator with
  multiple modes and voice muter, lfo with standard and custom shapes with
  smooth control, and microtuner supporting standard scala files.

  Additional features include modulation sequencer for routing to any
  destination, gate sequencer/trance gate usable on both envelopes, soundscaper
  for comb/delay/reverb effects, switchable flanger/filter effect with over 300
  predefined lfo shapes, stereo bpm based delay, fx routing with 3 different
  paths, modulation routing with multiple assignment options, and stereo spread
  for random pan control per voice.
specs: |-
  - Dual oscillator with over 3,500 different waveforms
  - Oscillator mixing modes: a+b, a-b, FM modes, dual pitch, split, distorted
  - Cascadable filter up to 8 times
  - Filter types: low passes, hi passes, band passes, comb, low shelf, hi shelf,
  peak
  - 32 stage envelopes with repeating sections capability
  - Drive - auto volume distortion
  - Arpeggiator with multiple modes and voice muter
  - LFO with standard and custom shapes
  - Microtuner with scala file support
  - Modulation sequencer
  - Gate sequencer/trance gate
  - Soundscaper - comb/delay/reverb effect
  - Flanger/filter switchable effect with over 300 predefined LFO shapes
  - Stereo bpm based delay
  - FX routing with 3 different paths
  - Modulation routing with multiple assignment options
  - Stereo spread with random pan control
  - VST plugin format
  - Windows compatible
  - Lightweight synth with optimized oscillator and filter code using sse
  instructions
