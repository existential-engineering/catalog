details: |-
  When inspiration strikes and your new hit song begins to take shape, it feels like magic. The trick is finding that inspiration in the first place, and it also helps a lot if you have an easy way to transport your ideas from inside your head to a flawless recording that you can share with the world.

  Statement is a state-of-the-art, user-friendly polyphonic synth designed with the contemporary producer and songwriter in mind. With carefully recorded and processed sound sources from rare and expensive synths, built-in effects of the highest quality, and modules for Softube's endlessly expandable Eurorack modular synth Modular, Statement inspires you to make a statement. This is the lead synth you need to create hit songs that sound polished and finished with no complications along the way.

  The polyphonic lead synth for modern producers and songwriters. It features careful recordings of rare, expensive hardware synths and unrivaled Softube effects, and the intuitive user interface and the presets make it easy to get started, resulting in polished sounds in no time.

  Sound designer and rare synth collector Tobias Menguser recorded the sound sources, using rare vintage instruments (Synclavier, Four Voice, Deckard's Dream) alongside modern hardware and software synths (Schmidt synth and modular gear), processed rather than raw and dry to reach the waveform sound heard in the plug-in.
specs: |-
  - A 5-octave polyphonic synth designed for lead sounds with an organic, analog feel
  - Three versions included: Statement Lead, Statement Lead for Modular, and Statement Lead for Amp Room
  - Amazing sound quality from careful recordings of rare, expensive hardware synths
  - High-quality effects built right into the plug-in
  - The perfect song writing tool for EDM, drum and bass, house, and more, with an intuitive user interface and 150+ carefully designed presets
  - The lead sounds counterpart to Monoment Bass, with the same type of interface and similar features
  - The 90 sound sources can be used two at a time with smart, modern tools that make it easy to dial in the foundation of the sound
  - Includes three modules for Softube Modular: Source, Filter, and FX
  - Includes two modules for Softube Amp Room: Filter and FX
  - Advanced analog-sounding filter with its own modulation sequencer
  - Advanced Auto Glide for creating organic-sounding analog sounds
  - Analog Dirt feature: adds grit for a richer or dirtier sound
  - Aging feature for less stable pitch, more unpredictable attacks, and even more dirt and grit
  - Requires a Softube account and an iLok account (no physical iLok required)
  - macOS Sonoma 14, Sequoia 15 or Tahoe 26
  - Windows 10 (64-bit) or Windows 11
  - Internet access for downloading installers and managing licenses
  - Three activations, 20-day trial, 14-day returns
