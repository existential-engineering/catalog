details: |-
  The Youth Revolt bundle is a collection of essential effects for classic rock production. Polish drum sound and dial in killer guitar tones with must-have effects used in the production of classic rock hits from the past century.

  The bundle runs natively in your DAW on macOS or Windows, and also operates in real-time on Antelope Audio Synergy Core interfaces. Synergy Core hardware is not required for native DAW operation.

  Included effects span EQs, compressors, a tube mic preamp emulation, an autowah and a vibrato, drawing on classic British and American console hardware as well as vintage studio outboard.
