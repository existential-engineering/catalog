description: Mastering-grade dynamics processor whose compression zone technology selects which frequencies and channels get compressed. Covers upward, downward, parallel and side-chain compression with automatic lookahead, signal-adaptive release, a side-chain equalizer and audition options.
details: |-
  See dynamics processing in action, with a real-time interactive display of levels, gains and curves. Automatic lookahead, signal-adaptive release, parallel compression, upward, downward and side-chain compression, audition options, side-chain equalization and a variety of compressor modes.

  The unique compression zone technology allows you to select what frequencies and channels get compressed, giving spatial and spectral control over what is modified.

  Shape the side chain with the built-in equalizer to create unique character. Ultra-low harmonic distortion and aliasing. Up to 16-channel spatial audio support.

  Resizable user interface with dozens of color themes. Undo, redo and A/B switching. Preset management with import and export. Multiple simultaneous instances. License activation without a hardware dongle.
specs: |-
  Sample rates up to 384 kHz. Up to 16-channel spatial audio support. Personal, perpetual desktop license for Windows, macOS and Linux, for use on up to 4 computers. Desktop installer v2.1.8 (July 2026). Windows 10 or up with a 64-bit DAW supporting VST, VST3 or AAX, Intel or AMD SSE2 processor. macOS 10.13 or up with a 64-bit DAW supporting VST, VST3, AAX or AU, Intel or Apple Silicon. Linux plug-in archive requiring glibc 2.31 or up and a 64-bit DAW supporting VST or VST3.
