description: "Mastering-grade dynamics processor featuring zone-based
  compression technology that allows control over which frequencies and channels
  get compressed. Supports parallel, upward, downward, and side-chain
  compression modes."
details: |-
  Real-time interactive display of levels, gains, and curves. Automatic lookahead and signal-adaptive release. Unique compression zone technology for spatial and spectral control. Side-chain equalizer to shape character. Ultra-low harmonic distortion and aliasing. Up to 16-channel spatial audio support.
specs: |-
  Sample rates up to 384kHz. Up to 16 channel spatial audio support. Personal perpetual license for up to 4 computers.
