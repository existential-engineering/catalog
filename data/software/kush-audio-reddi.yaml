details: |-
  The original hardware REDDI is a legend among professional session players and commercial studio owners. Its hybrid tube/solid state gain circuits, beefy transformer, and oversized power supply have an uncanny ability to both rein in bass transients and punch them up.

  Without any eq, simply through its gentle tube shimmer, REDDI gets bass, synths, and guitars to 'sit' in the mix with less processing and fuss.

  The REDDI plugin, then, is designed to be used as any analog DI would: first in the chain, as an initial treatment before compression, saturation or eq, imparting its unique tube sweetness to any instrument in your mix.

  The plugin's added low shelf, not found on the original hardware, is tuned for electric bass but also adds weight and thickness to kicks, synths and vocals. The Bass control is a pre-emphasis eq, adding level to the low end before it hits the distortion circuit, so a boost raises low-end rms energy proportionally while the resulting level rise depends on how much distortion is being generated.
specs: |-
  - Plugin emulation of the A-Designs REDDI tube direct box
  - Hybrid tube/solid state gain circuit model
  - Input: boosts or attenuates the incoming signal up to 16dB in either direction for gain staging
  - Level: sets tube saturation amount, from punchy smooth distortion to gentle warmth
  - Bass: 100Hz pre-emphasis low shelf tuned for electric bass, not present on the original hardware
  - Headroom switch: pads the input 20dB with an offsetting 20dB output boost for gain-neutral extra headroom, around a quarter of the unpadded distortion
  - Phase Flip: inverts output polarity
  - Output: final output gain trim for gain staging into the next plugin
  - Perpetual licence includes 2 activations, free updates and support, and all available presets
  - Free 10-day demo available via an on-page demo code
