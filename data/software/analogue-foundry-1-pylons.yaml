details: >-
  Christian henson has teamed up with top production duo the flight to create a
  definitive collection of phrases, squeaks, bleeps, hits and fx from their
  enormous selection of classic vintage synths.


  With each instrument they have discussed and defined what that synth does
  best. Recorded in "super mono" via the most pristine neve line amps and
  cranesong ad converters, the team has created a number of parallel mono
  signals that can be switched in and out or mixed and assigned to different
  outputs.


  These include, dry, saturated, circuit bent and a live - and temperamental,
  classic spring reverb signal path. With a selection of specially selected,
  in-the-box mono-to-stereo effects, modulation and filters to warp the signal
  further.


  In this release of 3.1 gb (lossless compressed from over 6gb of raw wav files)
  from over 3800 samples - synthesisers featured include classic juno 60, jx3p,
  ms10, proone, sem, and a moog.


  Requires a full version of kontakt 4.2.4 or kontakt 5 to run.
