details: |-
  Audiokit Bass 808 Synth is perfect for earth-shaking sub bass lines and
  creating your own custom electronic drum sounds. It's the ultimate tool for
  creating your own 808 kicks. Simple controls allow you to easily sculpt your
  own bass or kick sound.

  Includes over 160+ presets by brandon rico simpson, dusti d-sine, sound of
  izrael, tic toc, audio dabbler, dj puzzle, ipadbeatmaking, torley, kelby
  kryshak, and more.

  Works great as an AU plugin in garageband, cubasis 3, bm3, ns2, aum, auria
  pro, and more.

  Efficient! The entire app is under 20mb on most devices.

  Standalone app & ios auv3 with new powerful auv3 code.
specs: |-
  - Pitch modulation
  - Glide
  - Distortion
  - Bit crushing (6-bit, 8-bit, 12-bit)
  - Super sustain
  - Low-pass filter
  - Super smash limiter
  - AUv3 automation
  - iOS AUv3 plugin
  - Universal for iphone & ipad
