description: This Usynth brings you the legendary and still widely used "Rompler" sounds of the late 80s and 90s.
details: |-
  This Usynth brings you the legendary and still widely used "Rompler" sounds of the late 80s and 90s. The Korg M1, Roland JV series or E-mu Proteus defined that era with their signature sound, influencing hundreds of hits then and still used in many genres of music today.

  From single instruments such as piano, bass, guitar, or strings to layered and hybrid sampler and synth sounds, TURBO-XT is the perfect companion for either creating songs and arrangements with a retro aesthetic or simply adding a bit of blissful imperfection to a contemporary song.

  Usynth TURBO-XT includes 50 presets by the legendary German techno and eurodance project U96. Known for their hit "Das Boot" and over 15 million records sold, U96's presets bring their iconic sound to your Usynth TURBO-XT, offering an authentic techno and eurodance experience.

  Usynth is made for people who want to program their own synth sounds without programming synths, like most musicians. It features a powerful synthesizer engine that combines Virtual Analog, Wavetable, FM, and Multi Sampler, with dozens of filter modes, modulation matrices, envelopes, LFOs, and hundreds of parameters.
specs: |-
  - Legendary sounds from the 90s Romplers like Korg M1 or E-mu Proteus
  - Basses, Polys, Leads, Pianos, E-Pianos, Strings, Guitars, Brass and much more
  - 50 exclusive presets by U96
  - Revolutionary interface: create your own sounds without synthesizer knowledge
  - Powerful synthesizer engine with virtual analog, FM, wavetable and multisampler
  - 7-day fully functional trial, with trials of all other Usynth titles startable from within Usynth
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8GB of RAM
  - 0.29GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Requires the latest version of the UJAM App, which installs the Usynth plug-in that hosts all titles
