description: An advanced audio mixing and mastering plugin designed to intelligently balance and improve the clarity of audio tracks.
specs: |-
  - Realtime audio analysis
  - Computational auditory perception model
  - Frequency response changes up to 300 times per second
  - Patent-pending equalizer technology
  - 20ms latency
  - Minimal transient treatment
  - Live music mixing compatibility
  - Mastering application support
  - Two perceptual-model presets (standard and extended auditory models)
