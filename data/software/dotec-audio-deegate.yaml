description: DeeGate is a very simple noise gate plug-in that mutes sounds
  smaller than the volume you set, with a threshold adjustable from -60 to 0 dB.
details: |-
  DeeGate is a straightforward noise gate plug-in from Dotec-Audio that silences audio signals falling below a user-defined threshold. The threshold is continuously adjustable from -60 to 0 dB, giving producers precise control over what level of signal passes through.

  Common use cases include removing background noise from microphone recordings, cutting unwanted room decay as a creative effect, and isolating specific sounds based on their volume level. Its simplicity makes it accessible for both beginners and experienced producers who need a no-frills gate.

  DeeGate is available as a free download, making it one of Dotec-Audio's freeware offerings alongside other free tools in their lineup. No serial key or purchase is required to use its full functionality.

  The plug-in supports a wide range of DAW hosts including Ableton Live, Cubase, Logic Pro X, Pro Tools, FL Studio, Studio One, GarageBand, OBS Studio, and over 15 additional hosts. It has been tested across DAW versions spanning multiple major releases.

  On macOS, DeeGate supports VST2, VST3, AU, and AAX formats. On Windows, VST2, VST3, and AAX are available. Both platforms require a 64-bit OS, with macOS requiring version 10.12 or later.
