description: A carefully designed RMS-based feed-back dynamics compressor
  dedicated to sum/bus compression, the result of an intensive study about the
  musical behavior of the feed-back compressor topology.
details: |-
  A carefully designed dynamic range compressor. The processor is dedicated to sum/bus compression and is the result of an intensive study about the musical behavior of the feed-back compressor topology. Most modern compressors analyze the input signal to control gain reduction. The feed-back compressor design however “listens” to its output. This non-intuitive approach delivers an unobtrusive and highly musical compression characteristic that is able to handle complex signals with ease.

  These unique characteristics were combined with a minimalistic audio-path and state of the art digital signal processing techniques. The compressor is carefully tuned for intuitive and musical operation. The processor neither tries to emulate any previously available device, nor does it follow popular trends like “virtual analogue” or “vintage”. This is a proud digital processor.

  The product is discontinued. Tokyo Dawn Labs directs users to TDR Kotelnikov for new projects, and offers the download for historical reasons only, with no active support and no guarantee of compatibility with modern systems.
