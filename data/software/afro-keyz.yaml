details: |-
  Afro Keyz is a synth VST (mac, Windows) designed for making great african
  beats. Inspired by the best of today's african diaspora hit songs, this synth
  VST has everything you need to get you inspired and quickly produce
  high-quality beats.

  40 instruments include: keys, electronic piano, marimba, kalimba, pad, 808,
  bass, and plucks.

  10 music genres supported: r&b, dancehall, reggaeton, afrobeats, hip-hop,
  baile funk, lo-fi, zouk compas, reggae, and nu soul.

  Fx and controls include reverb, adsr, lfo controls with rate and depth, glide,
  pitch, filter high-low, and pan.
specs: |-
  - 32-bit and 64-bit support
  - Mac installer for macOS catalina and newer
  - Compatible with all DAWs
  - 40 instrument presets
  - Reverb
  - ADSR
  - LFO controls with rate and depth
  - Glide
  - Pitch
  - Filter high-low
  - Pan
