description: MixBoss is an all-in-one mixbus plugin built for topdown mixing, combining a multiband compressor with linear-phase crossovers, a voiced Push EQ, a spectral balance control, a mixbus limiter and three character enhancement modes. It also provides monitoring simulations for small speakers, car stereo, phone and mono.
details: |-
  MixBoss is built around the topdown mixing philosophy and was developed with mix engineer Emrah Celik. It places mastering-grade tools directly on the mixbus from the start of a session, so the overall tone, punch, depth and stereo field are shaped before individual faders are touched, rather than stacking plugins across stems afterwards.

  At its core is a multiband compressor driven by linear-phase crossovers, intended to glue a mix together while preserving its integrity. The Control knob acts as a master dry and wet blend for the compression, and LED meters give real-time feedback across the low, mid and high bands. The Enhance knob unlocks three character modes that can be activated individually or together: Color adds subtle saturation, Depth separates front-to-back positioning without adding reverb tails, and Wide expands the stereo image while maintaining mono compatibility.

  The Push EQ is a specially voiced musical equalizer that drives lows, mids and highs into the processing chain, switchable to run before or after compression. The Balance control gently guides the mix toward a custom noise profile built from thousands of top-charting songs, holding the tonal balance together without forcing it.

  A bespoke mixbus limiter keeps the output punchy and competitive without choking the dynamics, whether the track is going to mastering or out as a premaster. The Mix knob dials the processing back in parallel for more refined results, and oversampling at 4x, a polarity flip and streamlined input and output controls complete the signal path.

  The Monitoring section auditions a mix through gain-matched simulations of a small speaker (Grotbox), a car stereo, a phone and true mono. The GUI is clean and resizable with easy-to-read metering, A and B comparison for critical listening, and undo and redo. Factory presets crafted by industry professionals cover pop, hip-hop, EDM and rock as starting points.
specs: |-
  - All-in-one topdown mixing plugin
  - Multiband compression with linear-phase crossovers
  - Control knob for master dry and wet compression blend
  - LED metering across low, mid and high bands
  - Character enhancement modes: Color, Depth and Wide
  - Push EQ for tonal shaping before or after compression
  - Spectral Balance control based on thousands of professional mixes
  - Professional mixbus limiter
  - Parallel processing via the Mix knob
  - 4x oversampling and polarity flip
  - Real-world monitoring simulations: Grotbox, Car, Phone and Mono
  - Resizable, CPU-friendly GUI
  - Preset system with A and B comparison, undo and redo
  - Factory presets for multiple genres
  - Full PDF manual and video tutorials
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit), Intel and Apple Silicon
  - AAX requires Pro Tools 12 or higher
