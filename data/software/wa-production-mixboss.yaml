details: |-
  Multiband compression with linear-phase crossovers. Character Enhancement modes: Color, Depth, Wide. Push EQ with pre/post compression. Spectral Balance Control. Professional mixbus limiter. Real-world monitoring: Grotbox, Car, Phone, Mono. Parallel processing with Mix control. 4X Oversampling. Factory presets for multiple genres. Resizable GUI with A/B comparison.
specs: |-
  Windows 10/11 (64-bit). macOS 10.15+ (64-bit). Intel and Apple Silicon. ProTools 12+ for AAX.
