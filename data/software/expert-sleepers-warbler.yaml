description: Warbler is a vibrato plug-in from Expert Sleepers whose extra
  controls reach into chorus, flange and delay territory. The vibrato LFO spans
  0Hz to 5kHz, so it covers subtle modulation through to hybrid sounds that are
  not easily categorised.
details: |-
  Warbler is at heart a vibrato effect, with additional controls that allow chorus, flange and delay type effects, as well as quite unusual hybrid sounds that are not easily categorised.

  The vibrato depth ranges from subtle modulations to extreme pitch effects. The vibrato LFO (low frequency oscillator) can be set from 0Hz to 5kHz and is controlled by 3 knobs to allow accurate control over the whole range. The vibrato LFO shape can be selected from a variety of options and smoothly changed between them.

  The LFO speed and the vibrato depth can themselves be modulated by two extra LFOs. A bias control changes the effect from simple vibrato to something more like a traditional chorus or flange. Feedback can also be applied to give deeper, more resonant flanges or to produce echo effects.

  The plug-in works as a generic n-to-n processor, so it will do mono-to-mono, stereo-to-stereo, 5-to-5 and so on. Some hosts also allow its use as a mono-to-stereo effect, Logic among them. A spread control offsets the LFO phase per channel, giving a result much like a classic stereo chorus effect.

  Warbler is available in 64 bit AU, AAX and VST formats for macOS and Windows. Activation runs through an iLok account, onto an iLok, to the iLok Cloud or to the local machine, and a physical iLok is not required.
specs: |-
  - 64 bit AU, AAX and VST formats
  - macOS and Windows
  - Vibrato LFO range 0Hz to 5kHz, controlled by 3 knobs
  - Selectable LFO shapes, smoothly morphed between
  - Two extra LFOs modulating LFO speed and vibrato depth
  - Bias control from vibrato to chorus or flange
  - Feedback control for resonant flange and echo effects
  - Spread control offsetting LFO phase per channel
  - Generic n-to-n channel processing, mono-to-stereo in hosts that allow it
  - iLok account activation, physical iLok not required
