details: >-
  Akkord is a VST synth that has 2 phase distortion oscillators and a noise
  generator. It is possible to mix up to 3 waveforms for each oscillator, there
  are 4 envelopes per oscillator and 2 filters per oscillator.


  The user can turn the chorder on and the VST will play chords instead of
  notes.


  Akkord by beatassist.eu is a virtual instrument audio plugin for windows. It
  functions as a VST plugin and a VST 3 plugin.
specs: |-
  - 2 phase distortion oscillators
  - Noise generator
  - Up to 3 waveforms per oscillator
  - 4 envelopes per oscillator
  - 2 filters per oscillator
  - Basic arpeggio
  - Eq
  - Stereo delay
  - Distortion
  - Phaser
  - Flanger
  - Chorus
  - Reverb
  - Gator
  - Chorder
  - VST plugin
  - VST 3 plugin
  - Windows
