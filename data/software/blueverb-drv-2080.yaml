details: |-
  BlueVerb DRV-2080 is a vintage-style studio reverb with individual two-band
  equalization, as well as ambiance, decay rt60 and pre-delay controls.

  It has the flexibility to custom craft your sound - from sweetening mono or
  stereo tracks to simply adding dimension to an entire mix.

  It is intended to recreate the qualities of vintage-style digital reverbs from
  the 80's.

  Up to 96 khz sample rates supported.

  Automate any control. Factory presets.
specs: |-
