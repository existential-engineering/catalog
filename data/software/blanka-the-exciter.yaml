details: |-
  Blanka is an exciter for clarity, adding presence without losing the weight of
  the tracks.

  The plugin features hi-pass of pre-defined frequencies at 75hz and 105hz,
  weight control for excitation of harmonics at low frequencies, clarity control
  for excitation of harmonics at high frequencies, and punch which is the sum of
  the 'excited' signal to the original and modified signal when passing through
  a sidechain in the middle of the circuit.

  04.22 update: bug fixed in the windows authorization application. Bug fixed in
  AU version for stereo and dual mono channels.
specs: |-
  - Hi-pass filter at 75hz and 105hz
  - Weight control for low frequency harmonics excitation
  - Clarity control for high frequency harmonics excitation
  - Punch control for sidechain mixing
