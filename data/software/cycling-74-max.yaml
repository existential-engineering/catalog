description: Max is an infinitely flexible space to create your own interactive software.
details: |-
  Max is a visual patching environment built around objects and patchcords. Each object does something: Max has objects that generate sound waves, represent hardware, or provide a UI for interaction. Patchcords connect one object to another so objects share their output with connected objects, and UI objects like dials and sliders provide control values or display results.

  Max patching starts on a blank canvas, free of any structure. This makes it natural to build and explore unique ideas that would be too complex to make elsewhere. The Max patcher automatically expands to fit your work as it grows, no matter how much space you take up.

  For sound, you can design a custom synthesizer with as many oscillators and effects as you wish, manipulate samples in every way including timestretch and pitch shifting, and build up more layered sounds using MC objects to patch multichannel audio.

  Max includes full-featured, expandable video and graphics tools with Jitter, optimized for realtime audiovisual work and easy to combine with audio, sequencing, and modulation. Gen lets you patch together fine-tuned processes for audio, matrix data, or texture processing, and Gen objects can also output source code to be used elsewhere.

  Flexible access to hardware makes Max an environment for prototyping: connect a development board and get instant access to sensors, knobs, and switches. Max's built-in Package Manager offers immediate access to over 50 add-ons covering everything from computer vision to support for hardware controllers including Novation, Monome and ROLI controllers, and Max can be extended with C++, NodeJS, Java, or JavaScript.
specs: |-
  - Visual patching environment: objects connected with patchcords
  - MC objects for multichannel audio patching
  - Sample manipulation including timestretch and pitch shifting
  - Jitter: realtime video and graphics tools, including Jitter Geometry for 3D data and the jit.fx image effect library
  - Gen: procedural audio, matrix and texture processing with source code export
  - ABL objects: audio objects built with Ableton's ABL DSP library (for example abl.device.roar~ and abl.dsp.shimmer~)
  - JavaScript V8 engine with v8, v8ui and v8.codebox objects (ES6+ features such as arrow functions and typed arrays)
  - Codebox for text-based coding alongside patching: JS (v8), Gen (gen, gen~, jit.gl.pix, jit.gen), Node for Max, dictionary and coll editing, OSC display
  - Parameter Connect: link UI objects to supported object attributes without patchcords
  - Global OSC address and port preference, with param.osc and osc.codebox objects
  - List View, syntax coloring, Illustration Mode and a REPL command field in the Max Window
  - Global Record Button in the Max Toolbar, CPU/FPS display and multichannel meters on the toolbar
  - Preset mixing and interpolation across a 2D space using a nodes object with preset
  - loudness~ object based on EBU R 128
  - hid object for more robust HID hardware interaction
  - Package Manager with over 50 add-ons, including support for Novation, Monome and ROLI controllers
  - Extensible with C++, Node.js, Java or JavaScript
  - 30-day fully unlocked free trial
  - macOS: OS 11.0 or later, Intel Core 2 Duo (Core i5 or faster recommended) or Apple Silicon, 4 GB RAM (8 GB or more recommended), approximately 3 GB disk space
  - Windows: Windows 10 (version 22H2) or Windows 11 (version 22H2 or higher), 64-bit Intel or AMD multi-core processor (Core i5 or faster recommended), 4 GB RAM (8 GB or more recommended), approximately 2 GB disk space
