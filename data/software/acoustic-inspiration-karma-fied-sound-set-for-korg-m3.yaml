details: |-
  Acoustic inspiration is a new karmafied sound set for korg m3 workstation. This high quality sound set contains 32 combis for the korg m3 in wide variety of rare styles, not represented in factory set or any other 3rd party sets. Each combi is fully programmed with powerful karma function.

  The set includes wide variety of new and rare music styles: soft piano, organ and guitar ballads, 8 beat, 6/8 ballads, rock/progressive, jazz, funk, hip hop, acoustic ballads, unplugged, blues, bossa, waltzes, soundtrack and movie.

  Each of the combis uses all 4 karma modules and is carefully programmed with 8 different scenes, simple to complex, to provide wide variety within a combi.

  Fully programmed realtime controls: 8 sliders, 8 switches, joystick, ribbon, xy pad, 8 realtime knobs /sliders and 2 switches. Complete master layer provides full realtime control and endless possibilities.

  Hundreds of hours of work went into producing this set and we are sure many of you will find it useful.
specs: |-
  - 32 combis
  - 4 karma modules
  - 8 different scenes per combi
  - 8 sliders
  - 8 switches
  - Joystick
  - Ribbon
  - Xy pad
  - 8 realtime knobs/sliders
  - 2 switches
  - Master layer
  - Korg m3 workstation compatible
