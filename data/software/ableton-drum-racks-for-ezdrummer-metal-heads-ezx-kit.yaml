details: >-
  Ableton drum racks for ezdrummer metal heads ezx features drum racks for all
  presets factory presets for the toontrack ezdrummer metal heads kit. These
  racks are the most complete integration between ableton live and toontrack
  ezdrummer including a host of features ready to use on ableton push.


  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all metal heads ezx factory presets from ableton
  push controller device browser.


  36 ableton drum racks to instantly load the metal heads ezx factory library
  "mix ready" presets with ableton mappings. Color coded pad design for visual
  performance and finger drumming. Individually labelled drum rack pads for
  clear visualisation, post performance editing and automation to all drum rack
  / instrument articulations in the ableton live clip editor.


  Mapped ableton macros to ezdrummer macros with preset values for ease of use
  in push and simple to use automation programming. Singleout presets featuring
  18 ableton drum racks for all factory presets single audio output to single
  ableton track. Multiout presets featuring 18 ableton drum racks for all
  presets in multiple audio channel output from the plug in to multiple ableton
  audio tracks using the multi output ableton template also provided.


  Use the template racks and extend to your own presets, swapping out individual
  sounds or articulations of the metal heads ezx sound library. You are 100%
  ready to go with the factory presets but there is no limitation to creating
  your own presets from these templates.
specs: |-
  - 36 ableton drum racks
  - Color coded pad design
  - Individually labelled drum rack pads
  - Mapped ableton macros to ezdrummer macros
  - Singleout presets with 18 ableton drum racks
  - Multiout presets with 18 ableton drum racks
  - Multiple audio channel output
  - Ableton live multi out template
  - Track level audio mixing control
  - Ableton push 2 color pads mode
  - Ableton 9.5 or above
  - Toontrack ezdrummer2 required
  - Metal heads ezx expansion pack required
