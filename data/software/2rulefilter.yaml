details: |-
  2RuleFilter is a self-resonant Moog type filter that allows the filter cut-off frequency to be controlled manually, by LFO, or by an envelope follower. It has an interesting feature called "scrambler" that plays filtered signal randomly depending on the selected beat.

  The "mix" knob mixes wet and dry signals, the "volume" knob is for setting the output volume level. The "bit crusher" produces hard sound. Using its scramble feature you can maintain the rhythmic, choppy, buffered and tempo sync output.

  Modulation of filter cut-off frequency by lfo (tempo-sync), manually or envelope follower (reversable). Bit crusher (16-bit to 1 bit). Scrambler that divides one measure to different time interval and plays them randomly.

  Mix balance in between dry (input signal) and wet (filtered and bit crushed). Sensitivity that allows the filter cut-off frequency be changed from roughly to smoothly. This effect is the same of parameter smoothing.
specs: |-
  - Self-resonant Moog type filter
  - High pass filter
  - Low pass filter
  - Band pass filter
  - Manual filter cut-off frequency control
  - LFO modulation (tempo-sync)
  - Envelope follower modulation (reversable)
  - Bit crusher (16-bit to 1-bit)
  - Scrambler feature
  - Mix knob (wet/dry signal balance)
  - Volume knob
  - Sensitivity parameter (parameter smoothing)
  - macOS compatible
  - Windows compatible
