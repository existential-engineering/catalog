details: >-
  Acoustic dhaak by rdgaudio is a virtual instrument audio plugin for macos and
  windows. It functions as a VST plugin and an audio units plugin. For the first
  time ever indian/bollywood puja dhaak is available as AU, mac and win
  32-64-bit VST plugins.


  Acoustic dhaak by rdgaudio specially built for indian durga puja (worship of
  lord durga). Dhaak is an indian leather instrument. Dhaak is famous for indian
  durga puja (worship of lord durga) and it is mainly played in eastern part of
  india (west bengal). Who plays dhaak is called dhaaki.


  We have sampled that instrument in our studio. It was performed by swapan
  mahato who is a dhaaki of kolkata west bengal. Additionally we have added
  ghanta (bell) and puja aarati ghanta (worship bell) for the extra realism.


  So, when you will play the instrument by a MIDI controller you will get the
  indian puja feelings right inside your host DAW.
specs: |-
  - AU VST plugins
  - Mac and win 32-64-bit VST plugins
  - Sample based instrument
  - Deep sampled indian leather dhaak
  - Round robin sampling
  - Stereo and mono mode
  - Velocity sensitive
  - Attack and release knob
  - Built in algorithmic reverb
  - Deep sampled kaasnsor ghanta (bell)
  - Deep sampled aarati ghanta (worship bell)
  - Volume and pan knob
  - Level meter
  - Info knob slider
  - Modern gui
  - Windows 7, 8, 10 or latest mac os
  - Approx 50 mb disk space (each format)
  - Latest intel or amd cpu
  - 2 gb ram (4 gb recommended)
  - 1 gb video ram (2 gb recommended)
  - Supports all major DAW
  - MIDI keyboard or drum pad
  - Asio driver
