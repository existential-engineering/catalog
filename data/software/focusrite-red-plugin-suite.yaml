url: "https://focusrite.com/software/red-plugin-suite"
description: "The Red 2 and Red 3 Plugin Suite accurately models Focusrite's
  classic Red range equalizer and compressor hardware, letting you exploit the
  originals' famous sound conveniently from within your audio software."
details: |-
  Bundles emulations of two iconic Focusrite Red range hardware units. Red 2 is a 6-band equalizer with high and low-pass filters derived from the ISA 110 equalizer circuits, originally designed for the sidecar upgrade of the Neve console at Sir George Martin's Air Studios, London.

  Red 3 is a compressor based on the same circuit topology as the ISA 130 compressor module, built around a proprietary VCA design that earned Focusrite a TEC award for Outstanding Technical Achievement in Signal Processing Technology. The original Red range hardware was introduced in 1994.
specs: |-
  - Red 2: 6-band equalizer with high and low-pass filters
  - Red 2 circuit derived from ISA 110 equalizer
  - Red 3: VCA-based compressor
  - Red 3 circuit derived from ISA 130 compressor module
