description: Punchy Worm is a one knob punch and saturation processor, with a single central dial that applies transient shaping in one direction and saturation in the other, combined with upward and downward compression. An animated worm in the interface reacts to the incoming audio.
details: |-
  Punchy Worm is a one knob punch and saturation processor with a deliberately playful interface, built around an animated worm that moves in time with the audio being fed into the plugin.

  The control set is kept small so that attention stays on the sound. Dials are dragged to operate and double clicked to return them to their default positions.

  The main dial works in two directions. Set to the left of centre it applies punch, and to the right it applies saturation, in both cases combined with smooth and responsive upward and downward compression. Gentler settings add presence and power, while pushing the dial harder produces more extreme transient shaping and saturated harmonics.

  An Input control drives more signal into the effect, increasing the amount of processing applied, and an Output dial volume matches against the original signal so the result can be judged without an artificial increase in loudness. Clicking the Punchy Worm logo bypasses the plugin for A/B comparison.

  A leaf at the top of the interface acts as an oversampling toggle, switchable between x1, x2 and x4 interval oversampling, which reduces unwanted noise from digital aliasing.
specs: |-
  - One knob punch and saturation processing
  - Main dial applies punch to the left of centre and saturation to the right
  - Upward and downward compression combined with the main effect
  - Input and Output controls for level matched A/B comparison
  - Bypass toggle on the plugin logo
  - Oversampling switchable between x1, x2 and x4 to reduce aliasing noise
  - Dials reset to default on double click
  - Animated worm that reacts to the incoming audio
  - PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
