description: Drumflex is a simple and easy to use audio plugin that helps finalize your drum mix across any genre. Engineered specifically for drum samples, it features four specialized modes for kick, snare, toms, and drum bus processing with analog-emulated EQ, compression, tilt EQ, output clipping, and parallel mix control.
