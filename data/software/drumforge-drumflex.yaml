description: Drumflex is a DSP plugin engineered specifically for drum samples, developed with 16-time Billboard number one mixer Billy Decker. It combines analog-emulated EQ and compression, a tilt EQ, output clipping, and parallel processing across four specialized modes for kick, snare, toms, and drum bus.
details: |-
  Drumflex is a mixing tool built for the final polish on a drum mix, created in collaboration with Billy Decker, a mixer with sixteen number one Billboard hits. It targets the last ten percent of radio-grade drum sound that usually requires several specialized plugins chained together.

  Drum samples are a staple across genres from death metal to hip hop, and a well-chosen sample still often needs shaping before it glues into a track. Drumflex is designed to work directly with a drum sample library so that samples sit in a mix quickly, without stacking multiple complicated processors.

  The plugin exposes four specialized modes tailored to kick, snare, toms, and drum bus. Each mode drives analog-emulated EQ and compression alongside a tilt EQ for musical tone shaping and an output clipping algorithm that raises perceived volume without losing impact.

  A mix control provides parallel processing, so drums can be given extra cut, punch, and fatness without disturbing the surrounding balances of an already-dialled-in mix. The intent is to answer client notes on the drums alone rather than reworking the whole mix.
specs: |-
  - DSP plugin specifically engineered for use with drum samples
  - 4 specialized modes tailored for kick, snare, toms, and drum bus
  - Analog emulated EQ and compression
  - Tilt EQ for musical tone shaping
  - Output clipping algorithm for maximum perceived volume
  - Parallel processing via the mix control
