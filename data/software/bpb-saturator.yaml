details: |-
  BPB Saturator is a freeware saturation effect that is lightweight and easy to
  operate. It utilizes waveshaping to simulate tube and tape saturation. The
  plugin can work as a subtle saturation tool or a tube-based distortion effect.

  The tube and tape saturation modules can be used separately. It is also
  possible to apply both types of saturation at the same time for a cumulative
  effect. Keep the tube and tape models below 15 for a subtle saturation effect.
  Use higher values for audible distortion and a subtle volume boost.

  The plugin also features a pair of transparent filters (high-pass and low
  pass) for removing any unwanted frequencies. The filters are also useful for
  simulating the frequency range of analog gear.

  Bpb saturator is available in VST, vst3, AU, and AAX plugin formats for
  digital audio workstations on pc and mac. Both 32-bit and 64-bit plugin hosts
  are supported.
specs: |-
  - Waveshaping technology
  - Tube saturation module
  - Tape saturation module
  - High-pass filter (20 Hz - 20 kHz)
  - Low-pass filter (20 Hz - 20 kHz)
  - Input volume control (±12 dB)
  - Output volume control (±12 dB)
  - VST plugin format
  - VST3 plugin format
  - Audio Units (AU) plugin format
  - AAX plugin format
  - 32-bit plugin host support
  - 64-bit plugin host support
  - Windows compatibility
  - macOS compatibility
