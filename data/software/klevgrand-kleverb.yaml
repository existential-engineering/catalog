description: Kleverb is a high quality algorithmic reverb effect. An intuitive
  UI combined with a carefully calibrated network of filters and delays makes
  this a powerful effect useful in any context, from acoustic jazz to EDM.
details: |-
  Kleverb is an algorithmic reverb built on a calibrated network of filters and delays. Between the room size setups, the filters on the early and late reflections, and the modulation, damping and diffusion controls, almost any kind of room can be simulated, and the 64 factory presets cover most of its features.

  Three room size setups (small, medium and large) are available, and decay time runs from 0 up to 25 seconds. A pre delay parameter and an early / late signal mix parameter set the balance between the reflection stages.

  Damping, diffusion and stereo spread controls shape the space, for both small and large changes. Filters with a selectable type are available on both the early and the late reflections.

  The ducker is a compressor that takes the dry signal as its sidechain, which is often applied on a send and seldom built into the reverb itself. It lowers the reverb while the dry signal is active and raises it in the pauses, so a reverb-drenched lead vocal or instrument stays distinct.

  The wet signal can also be modulated, which adds movement to the reverb tail.
specs: |-
  - Room size selection (small, medium, large)
  - Filters with selectable type on both early and late reflections
  - Wet signal modulation
  - Damping filter
  - Diffusion and Stereo Spread parameters
  - Decay time between 0 and 25 seconds
  - Pre delay parameter
  - Ducker (compressor), with dry signal as sidechain
  - Early / Late signal mix parameter
  - Wet and Dry signal level parameters
  - 64 factory presets
  - Requires macOS 10.10 or later (optimized for the M1-processor), Windows 7 (SP1) or later, running a AU, VST or AAX compatible 64-bit host
  - iPad version available as AUv3
