details: |-
  In 1987, Jim Marshall celebrated 25 years as a guitar amp manufacturer with the very limited release of the Silver Jubilee series of amps. The Silver Jubilee 2555 amp became a big hit among high-profile rock guitarists and quickly became a rare collectors piece.

  Marshall Silver Jubilee 2555 is a super accurate component modeled plug-in version of the real thing, produced in partnership with Marshall from the reference 2555 amp in the Marshall museum. The plug-in version was component modeled down to the smallest details, resulting in flawless sound quality that will take you down to paradise city.

  Amp Room Ready: works as a native plug-in and as a module in Amp Room, Softube's pro audio guitar platform. Cabinet speakers were expertly recorded by acclaimed engineer/producer Tony Platt, and the plug-in offers numerous options for setting up the mics to your specifications plus a channel strip for mixing your sound right there in the plug-in.

  "The Silver Jubilee is an important amplifier in the Marshall range because it enables such a wide range of sounds from relatively clean through to downright nasty. This makes it a difficult beast to pin down but I really feel we have captured the outright flexibility of the amplifier whilst keeping it raw!" Tony Platt, Producer/Engineer (AC/DC, Iron Maiden, Motorhead, Foreigner)

  "The 2555 always tends to have a certain air of mystique, almost cult status about it, probably due to the fact it was pretty ahead of its time when it was originally launched in 1987 and paired well with what was happening musically at the time. Its original design, distinct tone and hugely versatile EQ make it one of the most loved Marshall amps ever made, all of which has been perfectly replicated for this plug-in." Chris George, International product demonstrator and new product co-ordinator, Marshall Amplification.
