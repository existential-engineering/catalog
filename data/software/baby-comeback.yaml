details: |-
  Baby Comeback is a free delay plugin developed in collaboration between baby
  audio and computer music magazine. It offers a stripped-down version of the
  award-winning comeback kid delay plugin.

  Baby comeback gives you an on-board ducker for cleaning up your delays when a
  dry signal is playing as well as four flavor modes: wide, analog, saucey and
  cheap.

  The simplest delay that still does everything you need. Ducking feature and
  four color modes ranging from big and wide to lofi and dirty.

  Based on the comeback kid delay, which lets you design your own, custom delay
  flavors.

  Baby comeback is a virtual effect audio plugin for macos and windows.
specs: |-
