description: Easy Tools is a set of real-time noise reduction and enhancement
  plug-ins primarily intended for cleaning up noisy and scratchy recordings from
  old vinyl records and tapes. It includes the Easy Tools PlugIn Center
  (supporting up to six plug-ins simultaneously), the Easy Tools Player (a
  WAV/mp3 player with basic editing functions), and the Easy Tools PlayList for
  automated batch playback.
details: |-
  Easy Tools is a very easy-to-use set of real-time plug-ins primarily intended for
  cleaning up noisy and scratchy recordings. It is also very well suited for general
  sound improvement when using plug-ins like the Easy Enhancer. The central design
  challenge was to create software that allows maximal performance with a minimal
  number of parameters to be adjusted.

  The Easy Tools PlugIn Center handles chaining of up to six plug-ins simultaneously.
  It features enhanced preset management allowing the comparison of different parameter
  sets and plug-in compositions with one mouse click. Also integrated is the unique
  Algorithmix difference function, enabling the user to monitor the noise being
  removed in real time.

  The Easy Tools Player is a WAV and mp3 player providing basic editing functions,
  including a wave display with zoom-in and zoom-out, a loop editor, cut and split
  operations, and a store function for saving processed audio files. Precise output
  level meters with resettable peak hold make it easy to prevent clipping. All mp3
  formats (including variable bit rates) and WAV files are supported.

  The Easy Tools PlayList allows automatic playback of multiple files. Single files
  or whole directories can be added or dragged and dropped to the list. Files can be
  arranged using sort, shuffle, or manual reordering. A search function is also included.

  Although Easy Tools with the Player and PlayList is a stand-alone application, the
  plug-ins are also accessible within the Line in Sampling window of Audiograbber, a
  popular freeware CD-ripper and audio recorder for Windows. This allows real-time
  removal of clicks and noise from vinyl records or tapes during the recording process.
specs: |-
  - Version: 1.1.0 build 831
  - Included plug-ins: Easy DeClicker, Easy DeNoiser, Easy Equalizer, Easy Enhancer
  - Easy DeClicker: removes clicks from vinyl records (33 & 45 rpm) and impulse-like
    noises; three click profiles (LP1, LP2, 45); adjustable declicking intensity
  - Easy DeNoiser: eliminates broad-band noise such as tape hiss or background noise;
    three noise profiles (LP, Tape1, Tape2); adjustable denoising intensity
  - Easy Equalizer: 5-band filter with center frequencies at 63, 250, 1k, 4k, 16kHz;
    filter gain range ±12dB; master level slider
  - Easy Enhancer: dynamic bass maximizer, high-frequency booster, stereo wideness;
    Peak Limiter and Soft Clipper; three presets
  - PlugIn Center: up to 6 plug-ins simultaneously; preset management; CPU load meter
  - Player: mp3 and WAV playback; waveform display with zoom; loop editor; level meters
  - PlayList: resizable/dockable window; sort, shuffle, search; drag and drop
  - Audiograbber integration: plug-ins accessible in Line in Sampling window
  - System requirements: Windows 9x/Me/NT4/2000/XP/Vista; 16-bit/44.1 kHz sound card
