description: "A physical modeling drum virtual instrument that uses modal
  synthesis technology to deliver 13 deeply customizable virtual drum kits with
  real-time sound synthesis, 1400+ MIDI grooves, 8 room environments, and 19
  studio processors and effects."
details: |-
  MODO Drum uses real-time modal synthesis technology to physically model every component of a drum kit, delivering infinite velocity layers and round-robins with no sample repetition. The 13 virtual drum kits span a wide range of genres: Studio, Silver, Brit Custom, Metal, Black Oyster, Djentleman, Bubinga, Extreme, Grungy, Jazzy, Plexi, Reference, and Rock Custom.

  Over 1,400 MIDI grooves with smart filters provide instant rhythmic inspiration. 8 convolution-based room environments place drums in realistic acoustic spaces, from tight studios to large concert halls. 19 studio processors and effects from T-RackS and AmpliTube enable detailed mix shaping.

  The resizable GUI adapts to any screen size. Each drum element can be individually customized -- from shell material and size to tuning, dampening, and microphone placement -- providing deep sound design capabilities beyond what sample-based instruments offer.
specs: |-
  - 13 physically modeled drum kits
  - Real-time modal synthesis technology
  - Infinite velocity layers and round-robins
  - 1,400+ MIDI grooves with smart filters
  - 8 convolution-based room environments
  - 19 studio processors and effects
  - Customizable shell material, size, tuning, dampening
  - Resizable GUI
  - macOS 10.13+ / Windows 7+
