details: |-
  Track your working time directly in the DAW Shows the total amount of working time you spent on a project in your DAW Automatic pause function via DAW playback Log function for recording the individual times with comment function Project-based hourly wage and time-budget calculator It’s your choice: freeware or full version with an extended feature set ProjectTime V3 has all the features you need to monitor the time you spend working on your DAW projects. After you have loaded ProjectTime into any plugin slot of your DAW, you can start tracking the time. The measured time is saved when you close the project and can be continued when you open it again. The main innovation is the ability to start the timer automatically, depending on whether playback is running in the DAW or whether an audio signal is detected. In addition, you can now conveniently work with several sessions and edit them later. As with all plugins from the 4U+ series, you can choose: there is a freeware version and a full version with a extended feature set. Watch this 3-minute video to discover all the features: You are currently viewing a placeholder content from YouTube . To access the actual content, click the button below. Please note that doing so will share data with third-party providers. More Information Unblock content Accept required service and unblock content Features Freeware Full version Precise work-time recording in DAW projects ⬤ ⬤ Automatic play/pause detection ⬤ Hourly wage calculator ⬤ Time-budget calculator ⬤ Working on a project with several participants ⬤ Show duration also in decimal hours ⬤ Editing of sessions Limited ⬤ PDF export ⬤ CSV export ⬤ TXT export ⬤ ⬤ Price 49,90 € incl. VAT var baseURL = "https://hofa-plugins.de/en/"; Add to cart Included in Everything Bundle Licenses The freeware version runs without a license on any number of computers. A 14-day demo of the full version is available. The full version can be activated with the HOFA Plugins Manager or directly in