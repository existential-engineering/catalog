description: Monitor and log DAW work time with auto playback detection, hourly wage calculator, and export options. Freeware and full versions available.
details: |-
  ProjectTime V3 has all the features you need to monitor the time you spend working on your DAW projects.

  After you have loaded ProjectTime into any plugin slot of your DAW, you can start tracking the time. The measured time is saved when you close the project and can be continued when you open it again.

  The main innovation is the ability to start the timer automatically, depending on whether playback is running in the DAW or whether an audio signal is detected. In addition, you can now conveniently work with several sessions and edit them later.

  As with all plugins from the 4U+ series, you can choose: there is a freeware version and a full version with a extended feature set.

  The freeware version runs without a license on any number of computers. A 14-day demo of the full version is available. The full version can be activated with the HOFA Plugins Manager or directly in the plugin. Licenses are available for two computers. Licenses can be deactivated at any time and transferred to other computers. It is also possible to activate and use HOFA plugins offline.
specs: |-
  - Shows the total amount of working time you spent on a project in your DAW
  - Automatic pause function via DAW playback
  - Log function for recording the individual times with comment function
  - Project-based hourly wage and time-budget calculator
  - Precise work-time recording in DAW projects (freeware and full version)
  - Automatic play/pause detection (full version)
  - Hourly wage calculator (full version)
  - Time-budget calculator (full version)
  - Working on a project with several participants (full version)
  - Show duration also in decimal hours (full version)
  - Editing of sessions: limited in freeware, full in full version
  - PDF export (full version)
  - CSV export (full version)
  - TXT export (freeware and full version)
  - Formats: VST3, AU, AAX
  - Operating System: macOS 10.13 or later, Windows 10 or later
  - Continuously tested on Ableton Live, Apple Logic, Avid Pro Tools, Bitwig, Cockos Reaper, Image Line FL Studio, Magix Samplitude/Sequoia, Fender Studio Pro, Steinberg Cubase/Nuendo/Wavelab
