description: Monitor and log DAW work time with auto playback detection, hourly wage calculator, and export options. Freeware and full versions available.
details: |-
  4U+ ProjectTime V3 is a DAW-integrated time tracking plugin that monitors and logs the time spent working on music production projects. It works by detecting DAW playback activity and automatically pausing the timer when the session is idle, ensuring accurate time logs without manual intervention.

  The freeware version provides core time recording functionality including precise work-time tracking, automatic play/pause detection based on DAW transport state, and TXT export for basic reporting. It runs unlimited on any number of computers.

  The full paid version extends the tool with professional billing and project management features: an hourly wage calculator, time-budget tracking to compare estimated vs. actual hours, multi-participant project support for collaborative sessions, decimal hours display, full session editing, and export to both PDF and CSV formats.

  The plugin is compatible with a wide range of DAWs including Ableton Live, Logic Pro, Pro Tools, Bitwig Studio, Reaper, FL Studio, Cubase, Nuendo, Studio One, and Samplitude/Sequoia. Each license includes two activations that can be transferred between computers, with offline activation supported.
