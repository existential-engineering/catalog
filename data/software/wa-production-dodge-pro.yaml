description: Dodge Pro is a volume shaping plugin covering sidechain ducking, trance gates, rhythmic motifs and effects, with amplitude shapes drawn across three independent frequency bands. Up to 12 scenes can be programmed and switched over MIDI.
details: |-
  Dodge Pro takes sidechain processing, the technique of ducking the amplitude of one signal while another plays, and extends it into a wider volume shaping tool that also covers rhythmic motifs, gated rhythms and effects. Shapes can be chosen from presets or drawn with point-and-drag nodes and surgical drawing tools, with multiple curve types and note divisions.

  Global presets are dedicated to sidechain ducking, trance gates, arpeggiated patterns and effects. Each of the three EQ bands and the master volume automation also carry one-click shortcuts to the most common ducking, gating and rhythmic shapes.

  Up to 12 MIDI scenes can be programmed and switched on the fly using chosen MIDI triggers. That allows variety across a track and makes the plugin usable in live performance, with scene switching driven by an external controller.

  Clicking the automation line adds a node and dragging it defines the shape and curve, with single and double curve types alongside pulse, wave, saw and step automation. Lines and scenes can be copied and pasted, and each primary automation line carries a second layer that is drawn independently and summed with the first for more complex shapes.

  Audio can be split into three frequency ranges by dragging the multicoloured band graphic to set the crossover points, and each band takes its own Volume, Shape, Sync, Length and Mix settings. Randomisation can be applied to a whole scene or to a single band, the processed audio is shown as a waveform either full range or split into bands, and a smoothed bypass and a central Master Mix control blend the shaped signal with the original audio.
specs: |-
  - Multiband volume shaping for sidechain ducking, gating and rhythmic effects
  - Three-band volume automation with user-set crossover points
  - Per-band Volume, Shape, Sync, Length and Mix settings
  - Advanced line editor with node drawing, curve types and a second summed layer
  - Up to 12 MIDI-triggered scenes
  - Randomisation of whole scenes or a single band
  - Waveform display, full range or split into three bands, with ducking mini-meters
  - Scaleable interface and left and right monitoring
  - Click and pop free bypass and a Master Mix ratio control
  - Factory presets included
  - PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
