details: >-
  1-max is a one-knob maximizer designed to increase loudness and impact with
  minimal user input.


  The amount control engages a custom gain and shaping process that applies
  limiting and harmonic enhancement in a controlled but assertive way.


  It is intended for situations where extra weight, intensity, and forwardness
  are needed, without extensive parameter adjustment.


  1-max by 23dsp is a virtual effect audio plugin for macos and windows.
