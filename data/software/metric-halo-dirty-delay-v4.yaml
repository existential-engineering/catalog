  sounds as well as lush, subtle spaces in a mix.
details: |-
  MH Dirty Delay is a feedback delay processor with integrated Character and filters in the delay path. It is used to create vintage echo and tape-delay style sounds as well as lush and subtle spaces in a mix.

  With integrated filters and Character in the feedback path, the delayed sound can be clean or dirty, vintage or futuristic, subtle or nasty.

  With dual delay lines, crossfeed, feedback and distortion control, Dirty Delay is capable of creating rich and complex textures and patterns from the source audio. It adds texture and movement without the veiling and darkening of the sound often associated with feedback delays.

  Mono and stereo delay lines run up to 5 seconds each. Delay times can be set manually in milliseconds or by note values based on tempo, and tempo can be slaved to the host, set manually or tapped in. Each delay line has feedback and crossfeed with phase invert, a time offset on its output and an independent wet/dry mix and gain, with a 2-band fully parametric filter and MH Character in the delay path for shaping, texturizing and saturating the delayed sound. Dirty Delay is equally at home in production and performance.

  Version 4 adds a VST3 version on both macOS and Windows with native Apple Silicon support for VST hosts including Steinberg products. All v4 plug-ins add undo/redo, A/B snapshots with snapshot blend, software update tracking, more flexible resizability, common controls in the header bar, improved preset management, settings copy and paste between instances, a plug-in details pane reached from the MH logo, a smaller installer download on macOS, configurable themes, selectable knob styles and user preferences for band colors, UI colors and knob rings.
specs: |-
  - World-class signal processing and workflow
  - Mono and Stereo delay lines of up to 5 seconds each
  - Delay times can be set manually in milliseconds
  - Delay times can be set via note values based on tempo
  - Tempo can be slaved to host, set manually or tapped in
  - Each delay line has feedback with phase invert
  - Each delay line has crossfeed with phase invert
  - The output of each delay line can be offset in time
  - Each delay line has an independent wet/dry mix and gain
  - 2-band fully parametric filter for shaping the delayed sound
  - MH Character in the delay path for texturizing and saturating the delayed sound
  - Many presets included
  - Adjustable UI size, disclosable graphs
  - MH Preset Manager provides cross-platform presets
  - macOS 10.10 or newer, Intel processor or Apple Silicon, AU, VST 2 and 3 or AAX (Pro Tools 11 and newer Native) host, 64 bit
  - Windows 7 or newer, Intel processor, VST or AAX (Pro Tools 10, 11 and 12 and Native) host, 64 bit
  - Requires an iLok.com account
  - License includes two activations for the account
  - iLok dongle is optional, the license can be installed on the machine, on an iLok or in the iLok Cloud
  - Only one license required, works on all supported platforms
