description: Drum Machine
details: |-
  Nepheton 2 reincarnates the most iconic and widely used drum machine in over 40 years of music history, faithfully reproducing all the nuances of its booming 808 sounds. It replicates each individual instrument with meticulous accuracy, making it a natural fit for hip-hop, R'n'B, trap, dance music and any style built on the versatile, in-your-face character of the 808.

  A fully furnished effect section helps create punchier, more animated sound that cuts through a mix: add grit with a bitcrusher or distortion, control space with reverb or delay, and fatten the sound with chorus, then mix everything together with dynamics and EQ.

  An easy-to-use, inspiring sequencer offers Tap recording, a Randomizer, and hundreds of factory patterns. Per-step Flam and several variants of Substep with editable properties enrich rhythms with greater expressiveness, and a drag-and-drop MIDI export function lets users quickly finish work on a pattern in their DAW.
specs: |-
  - Faithful emulation of the classic 808 drum machine's full sound set
  - Effect section with bitcrusher, distortion, reverb, delay, chorus, dynamics and EQ
  - Sequencer with Tap recording, Randomizer and hundreds of factory patterns
  - Per-step Flam and Substep articulations with editable properties
  - Drag-and-drop MIDI export
  - Adjustable per-step velocity with optional global accent boost
