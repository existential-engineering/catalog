description: Multilayer Polyphonic Synthesizer
details: |-
  Lush 2 isn't based on just a single machine; it's built from modules found in many modern virtual synths, combined into one compact, logical layout. Its modular, multilayer architecture gives access to virtually limitless sound design possibilities and a wide spectrum of applications: each of its 8 layers works as an independent synthesizer with its own polyphony, parameters, enhanced arpeggiator, and a choice of 8 of the finest insert effects.

  A powerful built-in mixer with parametric EQ, compression and 3 send effects per layer brings it all together easily. Over 1600 curated presets, categorized and tagged into a clear structure, let users quickly find anything from massive basses to complex sequences.

  Multi-layer sounds can be created by simply assigning any (or all) of the 8 layers to the same MIDI channel, resulting in anything from subtle unison thickening to complex layered textures. A beautiful GUI with different themes and sizing helps users work in a way that suits them.
specs: |-
  - 8 independent synthesizer layers, each with its own polyphony and parameters
  - Enhanced arpeggiator per layer
  - 8 selectable insert effect algorithms per layer
  - Built-in mixer with parametric EQ, compression and 3 send effects per layer
  - Over 1600 factory presets, categorized and tagged
  - Multiple GUI themes and sizes with HiDPI support
