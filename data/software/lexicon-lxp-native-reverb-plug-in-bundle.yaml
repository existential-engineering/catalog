details: |-
  The LXP Native Reverb Plug-in Bundle delivers four algorithm-based Lexicon reverbs - Chamber, Hall, Plate, and Room - bundled together as native plug-ins for modern DAW workflows on macOS and Windows.

  The bundle ships with more than 220 studio presets covering a wide range of source material, and provides real-time graphical displays for frequency staging alongside input/output level metering.

  Each plug-in supports mono, stereo, and mono-in/stereo-out operation, full parameter automation, and a DAW-independent preset format so settings transfer across host applications.

  Authorization is handled via iLok (local machine or USB key), with dual simultaneous activations per license and Apple Silicon native support. Current distribution is through the FLUX::Center application.
specs: |-
  - Four algorithm-based reverb plug-ins: Chamber, Hall, Plate, Room
  - Over 220 studio presets included
  - Real-time graphical display for frequency staging
  - Input and output level metering
  - Mono, stereo, and mono-in/stereo-out operation
  - Full parameter automation
  - DAW-independent preset format
  - iLok authorization (local machine or USB key)
  - Two simultaneous activations per license
  - Apple Silicon native support
