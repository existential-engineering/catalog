description: HoRNet HTS9 vst models the circuits and emulate the sound of the vintage tube screamer guitar pedal, made famous by many guitarist in history
details: |-
  HoRNet HTS9 is a VST overdrive plugin that accurately models a classic tube screamer pedal, which was originally produced by a well-known Japanese manufacturer. This particular pedal has been in production since the early 1980s and has since become an iconic piece of gear, widely recognized and cherished in the world of blues and rock guitar. The sound produced by the HTS9 is immediately identifiable in numerous legendary recordings, making it a staple for guitarists seeking to achieve that smooth, punchy, and creamy overdrive tone.

  The primary function of the tube screamer pedal is to slightly distort the guitar signal and provide a unique “boost” effect to the tubes of the amplifier. This is particularly important when it comes to achieving that sought-after saturated sound that still retains clarity, making the pedal perfect for soloing, rhythm work, or adding texture to any musical arrangement. The design of the HoRNet HTS9 plugin replicates this classic effect, ensuring that users can achieve that signature sound, whether they are playing blues, rock, or any genre that demands that classic tube distortion tone.

  The unique design of the pedal’s circuitry consists of two primary stages that each play a crucial role in shaping the final sound. These two stages allow users to experience a natural, musical distortion that is both warm and dynamic, making the pedal an essential tool for guitarists seeking expressive tone manipulation.

  The first stage of the HoRNet HTS9 emulation is a frequency-dependent diode clipper. This stage plays a critical role in the pedal’s character. The clipper only distorts frequencies that are above 720Hz, meaning that lower frequencies such as the bass remain clean and intact, preventing them from becoming too muddy or indistinct. This is a hallmark of the tube screamer’s design, as it maintains a well-balanced sound even when the distortion is pushed to higher levels.
specs: |-
  - Classic overdrive effect.
