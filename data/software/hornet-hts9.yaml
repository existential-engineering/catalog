description: HoRNet HTS9 vst models the circuits and emulate the sound of the vintage tube screamer guitar pedal, made famous by many guitarist in history
details: |-
  HoRNet HTS9 is a VST overdrive plugin that accurately models a classic tube screamer pedal, which was originally produced by a well-known Japanese manufacturer. This particular pedal has been in production since the early 1980s and has since become an iconic piece of gear, widely recognized and cherished in the world of blues and rock guitar. The sound produced by the HTS9 is immediately identifiable in numerous legendary recordings, making it a staple for guitarists seeking to achieve that smooth, punchy, and creamy overdrive tone.

  The primary function of the tube screamer pedal is to slightly distort the guitar signal and provide a unique boost effect to the tubes of the amplifier. This is particularly important when it comes to achieving that sought-after saturated sound that still retains clarity, making the pedal perfect for soloing, rhythm work, or adding texture to any musical arrangement. The unique design of the pedal's circuitry consists of two primary stages that each play a crucial role in shaping the final sound.

  The first stage of the emulation is a frequency-dependent diode clipper. The clipper only distorts frequencies that are above 720Hz, meaning that lower frequencies such as the bass remain clean and intact, preventing them from becoming too muddy or indistinct. The diode clipping action is responsible for the characteristic warmth and smoothness of the overdrive effect, adding harmonic distortion so the sound feels richer and more present without losing its clarity.

  Following the clipping stage, the second part of the plugin is a tone shaper accomplished via a specialized filter that transitions from a low shelf filter to a high shelf filter, allowing the user to sculpt the frequency response of the signal. A low-pass filter with a gentle slope of 3dB per octave then smooths out the top end, reducing the unwanted fizz and harshness that can be introduced by the diode clipping stage.

  A gain compensation algorithm keeps the output level consistent even when you increase the amount of drive, and analog-style processing throughout the signal path adds warmth and character, though it can be disabled for a more transparent overdrive. Automatic oversampling adjusts to the project sample rate, running at 4x at 44.1kHz and 48kHz and 2x at 88.1kHz and 96kHz, minimizing aliasing.
specs: |-
  - Classic overdrive effect
  - Adjustable effect level
  - Tone control from dark to bright
  - Analog emulation, can be disabled
  - Dry / Wet knob
  - Output level compensation
  - Automatic oversampling (4x at 44.1kHz and 48kHz, 2x at 88.1kHz and 96kHz)
  - Frequency-dependent diode clipper distorting above 720Hz
  - Low-pass filter with a 3dB per octave slope
  - Gain compensation algorithm
  - macOS (10.13 and later) and Windows (Vista and later) support
  - 64-bit only both on Mac and Windows
  - No copy protection
