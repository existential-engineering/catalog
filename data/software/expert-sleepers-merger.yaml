details: |-
  Merger is a utility plug-in that combines two audio channels into one.

  This is typically useful for plug-ins such as vocoders, which expect their two inputs on either side of a stereo pair.

  In Logic 7 Merger is used as an insert effect on a mono or stereo track, with the other input selected from the side chain menu.

  Expert Sleepers notes that Merger does not work in Logic 6, presumably because of the limitations of that host's Audio Unit implementation.
specs: |-
  - Combines two audio channels into one
  - Used as an insert effect on a mono or stereo track in Logic 7
  - Second input selected from the host's side chain menu
  - Not compatible with Logic 6
