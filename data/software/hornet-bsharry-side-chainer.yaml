description: BSharry Side Chainer is a production plugin designed to achieve the sidechained compressor sound that is often used in dance tracks
details: |-
  Side Chainer is a streamlined and intuitive sidechain plugin designed to replicate the signature dance music pumping effect without the need for complex routing or setup. Developed by BSharry and powered by HoRNet Plugins technology, this tool makes it easy to inject energy, punch, and rhythm into your tracks with just a few clicks. Whether you are producing house, EDM, trap, or pop, Side Chainer gives you the sound that top DJs and producers rely on, all without the usual hassle of configuring a compressor sidechain.

  In modern music production, sidechain compression is a widely used technique that allows one sound (typically a kick drum) to control the volume of another, such as a pad, bassline, or even the entire mix. This technique creates the distinctive pumping effect that gives electronic music its rhythmic movement and dynamic energy. Achieving it normally involves setting up a sidechain input from a kick track, inserting a compressor on the target track, routing audio correctly (which varies between DAWs), and fine-tuning attack and release times.

  Side Chainer eliminates all of that. It provides a fully self-contained sidechain effect that works without needing a trigger track, without routing, and without a compressor. The plugin generates its own internal control signal and automatically syncs it to your host DAW's tempo, giving immediate and consistent results across any project. The internal modulation curve can be subdivided in rhythmic divisions such as 1/4, 1/8 and 1/16 notes and more.

  Side Chainer features a simple control layout built around four rounded knobs that shape the timing and contour of the ducking curve: Attack controls how quickly the signal ducks when the curve starts, Release determines how fast the volume returns to normal, Depth adjusts the amount of gain reduction, and Shape modifies the curvature of the modulation envelope. These parameters are calibrated so that every setting produces a musically useful result, from gentle volume movement to heavy breathing effects.

  A visual waveform display at the bottom of the interface shows exactly how the plugin is shaping the audio. The collaboration with HoRNet Plugins ensures not only intuitive usability but also high-quality sound and low CPU usage, making Side Chainer suitable for large sessions and live performance scenarios.
specs: |-
  - Automatic side chain effect
  - Effect characteristics like length, smooth and punch adjustable
  - Effect sync to host tempo in: 1/8, 1/8 dot, 1/4, 1/4 dot, 1/2, 1 bar
  - Realtime audio display
  - Mac OS X (>=10.7) and Windows support
  - 64-bit compatibility both on Mac and Windows
  - Audio Units VST2.4, VST3 and AAX format
  - Apple Silicon native
  - No copy protection
