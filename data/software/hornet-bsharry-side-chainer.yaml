description: BSharry Side Chainer is a production plugin designed to achieve the sidechained compressor sound that is often used in dance tracks
details: |-
  Side Chainer is a streamlined and intuitive sidechain plugin designed to replicate the signature dance music pumping effect without the need for complex routing or setup. Developed by BSharry and powered by HoRNet Plugins technology, this tool makes it easy to inject energy, punch, and rhythm into your tracks with just a few clicks, whether you are producing house, EDM, trap, or pop.

  In modern music production, sidechain compression allows one sound (typically a kick drum) to control the volume of another (a pad, bassline, or the entire mix), creating the pumping effect that gives electronic music its rhythmic movement. Achieving it normally involves setting up a sidechain input from a kick track, inserting a compressor on the target track, routing audio correctly (which varies between DAWs), and fine-tuning attack and release times. Side Chainer eliminates all of that with a fully self-contained sidechain effect that works without a trigger track, without routing, and without a compressor.

  Instead of requiring an external audio signal to trigger the ducking, Side Chainer creates an internal modulation curve that simulates the dynamic behavior of a sidechain compressor. The curve is tempo-synced to the project and can be subdivided into rhythmic divisions, freeing the user from complex routing, making the plugin usable on any track instantly, and guaranteeing a consistent rhythmic pulse.

  Four rounded knobs shape the timing and contour of the ducking curve: Attack controls how quickly the signal ducks when the curve starts, Release determines how fast the volume returns to normal, Depth adjusts the amount of gain reduction, and Shape modifies the curvature of the modulation envelope. A visual waveform display at the bottom of the interface shows the original audio signal in white and the processed signal in purple over two bars of musical time.

  Side Chainer was conceptualized and designed by BSharry, a producer and DJ, and uses core DSP technology from HoRNet Plugins. Beyond emulating sidechain compression it can add rhythmic movement to static synths or pads, create pumping effects on vocal reverb tails, shape dynamics on master buses, and synchronize ducking across multiple elements in a mix.
specs: |-
  - Automatic side chain effect
  - Effect characteristics like length, smooth and punch adjustable
  - Effect sync to tempo host in: 1/8, 1/8 dot, 1/4, 1/4 dot, 1/2, 1 bar
  - Realtime audio display
  - Mac OS X (>=10.7) and Windows support
  - 64-bit compatibility both on Mac and Windows
  - Audio Units, VST2.4, VST3 and AAX format
  - Apple Silicon native
  - No copy protection
