description: LANDR Layers listens to your track and generates pro-sounding
  drums, bass, instrumentals, textures and more with ethical, artist compensated
  AI.
details: |-
  Layers is an AI co-producer that listens to a track and creates unique instrument layers to complement it, even transforming any sample into a full stem that matches the key, tone and timing of the music. It generates professional, royalty-free stem layers in seconds, ready for a DAW.

  Importing a track lets Layers analyze its harmony, rhythm and structure so it can generate unique musical parts that naturally complement the music, responding dynamically to every nuance rather than returning generic loops or one-size-fits-all results.

  Performances come from real session musicians playing individual instruments, alongside multi-instrument layers that act like a producer and provide more complex arrangements over a track, with more added regularly. One shots and loops can also be brought in and flipped to fit the track, reshaping and expanding any sample into new layers molded to the music.

  An instrument's timbre, performance dynamics and complexity can be modified and variations auditioned to dial in the right feel, deciding whether the bassist plays with a pick or slaps, or whether the guitarist solos or plays rhythm. Any section of a generated stem can be selected to create a new variation, so specific moments can be refined and alternate performances explored without regenerating the entire layer.

  All models are trained on recordings from consenting musicians who are compensated through a transparent recurring revenue-share model, including through LANDR's Fair Trade AI program. Finished parts export as stereo WAV files at 48 kHz / 24-bit and drag straight into a DAW.
specs: |-
  - Context-aware layer generation from audio input or user guidance, reading tempo, harmony and arrangement
  - Multi-instrument AI performances generating complete musical parts
  - Intelligent sample flipping: reshape imported one shots and loops into new layers
  - Per-layer creative control over role, intensity, complexity, fills and feel
  - Section-level refinement to regenerate part of a stem rather than the whole layer
  - Multiple takes with instant auditioning to compare variations
  - Drag-and-drop, DAW-ready stereo WAV export at 48 kHz / 24-bit
  - Royalty-free output, models trained on compensated consenting musicians (Fair Trade AI)
  - macOS: macOS 13, 8 GB RAM minimum (16 GB recommended for large sessions)
  - Windows: Windows 10 (64-bit) or newer, Intel Core i5 or AMD Ryzen 5 equivalent, 8 GB RAM minimum (16 GB recommended for large sessions)
