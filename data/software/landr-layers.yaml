details: |-
  Context-aware layer generation analyzing tempo and harmony. Multi-instrument AI performances. Per-layer creative control for role, intensity, and complexity. Multiple takes with instant auditioning. DAW-ready stereo WAV exports at 48 kHz, 24-bit. Requires macOS 13+ or Windows 10 64-bit+. 8GB RAM minimum, 16GB recommended.
specs: |-
