description: >-
  A virtual emulation of the 1976 Octave Electronics CAT duophonic synthesizer,
  expanded with up to 16-voice polyphony and integrated effects.
details: |-
  Cherry Audio's Octave Cat emulates The CAT duophonic synthesizer unleashed by Octave Electronics in 1976. Developed in partnership with The CAT's original designer, Octave Cat retains all the growl of the original hardware's fat, savage sound and replicates its aggressive resonant filter.

  Cherry Audio has expanded upon the original with up to 16-voice polyphony and added a feature-packed second page with distortion, phaser, flanger/chorus, echo, and reverb effects. The dual VCOs offer discrete wave, modulation, sample and hold, and sub octave settings, paired with a four-pole 24 dB/oct filter based on the SSM2040.

  The instrument includes a dual-channel eight-step sequencer with quantization, a tempo-syncable LFO with onset delay, and MIDI Polyphonic Expression support. Over 300 presets are included to showcase the full range of sounds available.

  Cherry Audio spared no effort to ensure that the Octave Cat was crafted with the utmost respect and attention to the original instrument's signature features, resulting in a fully realized piece of music technology.
specs: |-
  - Dual VCOs with discrete wave, modulation, S+H, and sub octave settings
  - Four-pole 24 dB/oct filter based on SSM2040
  - Two envelope generators: ADSR and AR
  - Sample and hold with glide functionality
  - Tempo-syncable LFO with onset delay
  - Dual-channel eight-step sequencer with quantization
  - Effects: distortion, phaser, flanger/chorus, delay, reverb
  - Up to 16-voice polyphony with monophonic and duophonic modes
  - MIDI Polyphonic Expression (MPE) support
  - Over 300 presets
