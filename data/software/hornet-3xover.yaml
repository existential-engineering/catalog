description: HoRNet 3XOver is both a crossover and DJ EQ, offering three splittable bands you can assign to multiple outputs
details: |-
  The HoRNet 3XOver blends the functionality of a DJ EQ with the capabilities of a three-band crossover, making it a flexible frequency-management tool for both music production and live performance.

  At its core the 3XOver uses a system of three filters: a low-pass filter for low frequencies, a band-pass filter for mid frequencies and a high-pass filter for high frequencies. Filter slopes can be set to 24 dB/Octave or 48 dB/Octave, the cutoff frequency point for each band is fully adjustable, and each filter carries a gain control for boosting or attenuating its range. ON/OFF switches allow individual frequency bands to be deactivated entirely, which is useful for isolating bands for processing or analysis.

  The plugin also offers a multi-output setup with four distinct stereo outputs: a Master output (marked M on the output selectors) and three auxiliary outputs (marked 1, 2 and 3). Each frequency band can be assigned to a separate output, which enables multiband compression, parallel processing, or splitting a mix for external processing.

  While the 3XOver adheres to the multi-output VST and Audio Units specifications, not all DAWs support multi-output routing, and secondary outputs may not be routable to new tracks in every host. The plugin has been tested successfully with Ableton Live, Cockos Reaper, Motu Digital Performer and Avid Pro Tools (via the VST wrapper). Hosts without native support can still use it through a plugin host such as DDMF Metaplugin.

  Typical uses run from a basic three-band DJ EQ through multiband compression and parallel processing to live sound adjustment and creative sound design, with a dry/wet knob for blending the processed signal.
specs: |-
  - Three band DJ style EQ
  - Selectable 24 dB/Oct and 48 dB/Oct slope
  - Individual output for every band
  - ON/OFF button for every band to kill that frequency range
  - Dry/wet knob
  - Mac OS X (>=10.7) and Windows support
  - 64bit compatibility both on Mac and Windows
  - Audio Units VST2.4 and VST3 format
  - Apple Silicon not supported yet
  - No copy protection
