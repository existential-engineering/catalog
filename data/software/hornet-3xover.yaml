description: HoRNet 3XOver is both a crossover and DJ EQ, offering three splittable bands you can assign to multiple outputs
details: |-
  The HoRNet 3XOver is a unique and innovative plugin that blends the functionality of a DJ EQ with the capabilities of a three-band crossover. By combining these two essential tools, the 3XOver offers a highly flexible and powerful audio processing solution that can meet a wide range of needs in music production and live performance.

  At its core, the HoRNet 3XOver features a system of three filters: a low-pass filter for low frequencies, a band-pass filter for mid frequencies, and a high-pass filter for high frequencies. Each of these filters allows you to manipulate specific frequency ranges, and the plugin provides a variety of controls for shaping the sound to your exact specifications.

  The HoRNet 3XOver allows you to select filter slopes of either 24 dB/Octave or 48 dB/Octave. The cutoff frequency point for each band is fully adjustable, providing precise control over which frequencies are included in each filter band. Each filter also comes with a gain control, allowing you to boost or attenuate the signal in the selected frequency range, and ON/OFF switches let you deactivate individual frequency bands entirely.

  The plugin also features a multi-output setup, providing four distinct stereo outputs: a Master output (indicated by an "M" on the output selectors) and three auxiliary outputs (marked "1", "2" and "3"). This allows you to assign each frequency band to a separate output for multiband compression, parallel processing, or splitting your mix for external processing.

  While the 3XOver adheres to the multi-output VST and Audio Units specifications, not all DAWs support multi-output routing. It has been tested successfully with Ableton Live, Cockos Reaper, Motu Digital Performer and Avid Pro Tools (via the VST wrapper). In hosts without native multi-output routing, a plugin host such as DDMF Metaplugin can be used to route the outputs.
specs: |-
  - Three band DJ style EQ
  - Selectable 24 dB/Oct and 48 dB/Oct slope
  - Individual output for every band
  - ON/OFF button for every band to kill that frequency range
  - Dry/wet knob
  - Mac OS X (>=10.7) and Windows support
  - 64bit compatibility both on Mac and Windows
  - Audio Units, VST2.4 and VST3 format
  - Apple Silicon not supported yet
  - No copy protection
