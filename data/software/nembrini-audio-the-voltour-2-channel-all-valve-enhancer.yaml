  - 2 channels
  - T mode: triode valves, for warming up a sound
  - P1 mode: pentode, adds odd harmonics for a more aggressive sound with valve character
  - P2 mode: unusual valve configuration, can add an extra octave at higher bias settings
  - Mix parameter for parallel processing
  - Continuous Filter parameter
  - Phase parameter blends the dry signal with the reversed-phase wet signal
  - Auto wet output leveling
  - Link parameter for perfectly matched stereo imaging
  - Presets and audio samples by RECnMIX
  - iOS version available for iPhone and iPad
  - Plugin formats: VST2, VST3, AAX or AudioUnits compatible host
  - Intel compatible or Apple Silicon CPU
  - 1GB RAM
