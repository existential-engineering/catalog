description: Nembrini Audio The Voltour 2 Channel All Valve Enhancer plugin is based on the Thermionic Culture The Culture Vulture unit. It extends the possibilities of the original hardware with a Mix parameter for parallel processing, a continuous Filter parameter, a Phase parameter, auto wet output leveling and a Link parameter.
details: |-
  Nembrini Audio The Voltour 2 Channel All Valve Enhancer plugin is based on the Thermionic Culture The Culture Vulture unit, described on the page as a dive into the legacy of analog magic.

  The plugin extends the possibilities of the original hardware with a Mix parameter used for parallel processing, a continuous Filter parameter, a Phase parameter that blends the dry signal with the reversed-phase wet signal, auto wet output leveling, and a Link parameter that allows perfectly matched stereo imaging.

  Three distortion modes are offered. T uses triode valves and is good for simply warming up a sound. P1 is a pentode mode that adds odd harmonics to make the sound more aggressive while retaining valve character. P2 is an unusual valve configuration that can even give an extra octave at higher bias settings.

  Presets and audio samples for the plugin were produced by RECnMIX. An iOS version for iPhone and iPad is available from the Apple App Store alongside the desktop plugin.
specs: |-
