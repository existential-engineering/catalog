description: The Voltour 2 Channel All Valve Enhancer models the Thermionic Culture Culture Vulture hardware unit, bringing its legendary analog valve saturation and harmonic enhancement to the digital realm. It offers three valve modes — Triode, Pentode P1, and Pentode P2 — alongside mix, filter, phase, and link controls for precise stereo enhancement.
details: |-
  - The Voltour is a faithful software model of the Thermionic Culture Culture Vulture, a revered all-valve hardware unit known for its unique harmonic saturation characteristics. Nembrini Audio has extended the original hardware's capabilities with additional parameters not found on the physical unit.
  - "Three valve modes shape the harmonic character of the signal: Triode mode adds gentle warming and even-order harmonics; Pentode P1 introduces aggression and odd-order harmonics for more pronounced saturation; and Pentode P2 offers an unconventional configuration that extends the harmonic range into octave enhancement territory."
  - The plugin includes a Mix parameter for parallel processing, allowing the dry signal to be blended with the processed output for New York-style parallel saturation. A Continuous Filter parameter shapes the tonal response, while a Phase parameter blends the dry signal with a reversed-phase wet signal for creative tonal sculpting.
  - Auto wet output leveling keeps the processed signal at a consistent perceived loudness, making A/B comparisons straightforward. A Link parameter locks the two channels together for matched stereo imaging, ideal for bus and mastering applications.
  - The Voltour is available for macOS and Windows as AU, VST2, VST3, and AAX formats, and is also available as an iOS app for iPhone and iPad via the Apple App Store. Presets and samples are provided by RECnMIX.
