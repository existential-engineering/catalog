details: |-
  The plugin features precise, musically tuned bit depth and sample rate
  reduction, designed to deliver everything from subtle digital grit to
  aggressive lo-fi textures, with a focused interface optimized for real-time
  control and musical results.

  Key features include bit depth reduction with smooth, usable ranges and sample
  rate reduction for classic digital aliasing effects.

  Dry/wet mix for parallel processing and lightweight dsp with modern interface.

  Available in vst3 format for windows, macos, and linux, audio unit format for
  macos, and standalone application for macos, windows, and linux.
