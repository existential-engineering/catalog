details: |-
  The Boss Led Diode Distortion is a faithful software emulation of the Marshall Guv'nor pedal — the instrument widely credited as the first 'amp in a box' pedal. Developed using Nembrini Audio's proprietary analog modeling techniques, it captures the character of the original solid-state unit that helped define the British rock sound.

  At its core, the plugin recreates the two LED distortion circuit and amp-style passive three-band tone controls of the original hardware. This design gives players access to the same gritty, harmonically rich distortion tones favored by legendary guitarists including Gary Moore, Kevin Shields, and Josh Klinghoffer.

  An expanded variant, The Boss Rack, adds production-focused features for studio use: an ultra bass boost band, wet/dry mix control, phase inversion, and mid/side operation. The Analog Link feature introduces micro-variations between stereo channels to simulate the typical unpredictability of analog hardware.

  Version 1.2.8 is available for macOS 10.13 or newer and Windows 7 or newer, supporting 64-bit DAWs on Intel and Apple Silicon CPUs. Plugin formats include VST2, VST3, AAX, and AudioUnits.
