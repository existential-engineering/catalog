details: |-
  The Boss Led Diode Distortion plugin is modeled on the Marshall Guv'nor pedal, the first "amp in a box" pedal that replicates the tone and distortion character of famous black and gold British guitar amps.

  This pedal, used by Gary Moore on Still Got The Blues as well as by Kevin Shields, Josh Klinghoffer and many others, recreates the sound of a classic British stack cranked up with a simple solid-state circuit that Nembrini Audio emulates in every nuance.

  Nembrini Audio recreates the two LED distortion circuit and the amp-style passive three tone controls of the original unit, and adds the versatility that only the digital world permits.

  A separate rack version, The Boss Rack, is aimed at producers and sound designers and carries the same distortion and tone circuit plus an ultra bass boost band, wet/dry mix, phase inversion, mid/side operation and the Analog Link feature.
specs: |-
  - Modeled on the Marshall Guv'nor pedal
  - Recreates the two LED distortion circuit of the original unit
  - Amp-style passive three tone controls
  - Solid-state circuit emulation of a cranked classic British stack
  - iOS version available on the Apple App Store
  - Plugin formats: VST2, VST3, AAX or AudioUnits compatible host
  - Intel compatible or Apple Silicon CPU
  - 1GB RAM
  - Mac OS 10.13 or newer
  - Windows 7 or newer
  - 64-bit DAW required
