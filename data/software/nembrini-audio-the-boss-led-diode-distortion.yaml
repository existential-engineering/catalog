description: "The Boss Led Diode Distortion plugin is modeled on the Marshall
  Guv'nor* pedal, the first “amp in a box” pedal that replicates the tone and
  distortion character of famous black and gold British guitar amps."
details: |-
  This little pedal, which was used by Gary Moore on Still Got The Blues, Kevin Shields, Josh Klinghoffer and many more, recreates the sound of a classic British stack cranked up with a simple solid-state circuit that Nembrini Audio emulates in every nuance. Nembrini Audio perfectly recreates the two LED distortion circuit and the amp style passive three tone controls of the original unit and adds the versatility that only the digital world permits. In addition, Nembrini Audio creates The Boss Rack plugin aimed at producers and sound designers, with the same distortion and tone circuit plus ultra bass boost band, wet/dry mix feature, phase inversion , mid/side operation and the acclaimed Analog Link feature which introduces the typical unpredictability of the analog world by inserting micro-variations between the right and the left channel.
specs: |-
  A VST2, VST3, AAX or AudioUnits compatible host | An Intel compatible or Apple Silicon CPU 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
