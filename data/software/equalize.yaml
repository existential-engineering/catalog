details: |-
  Acon Digital Equalize 2 is a parametric equalizer plug-in that combines unique
  features with excellent workflow and an intuitive user interface. Unlike other
  equalizers, you can freely adjust not only center frequency, gain and
  bandwidths, but also the filter slope for each band. The filter slope can be
  set anywhere from 3 dB to ultra-sharp 120 dB per octave.

  Needless to say, you can operate equalize as a zero latency plug-in when using
  the minimum phase mode or choose to preserve the phase relationships in the
  linear phase mode. Equalize goes one step further, though, and introduces the
  unique mixed phase mode that allows you to set the latency freely in the range
  5 to 120 milliseconds while preserving the phase relationships as far as
  possible. That gives a unique control over potential pre-ringing artifacts
  which is a common problem with linear phase filtering.

  Latency values below 20 milliseconds ensure that any pre-ringing is masked by
  the temporal masking of the human hearing while preserving the time-alignment
  across the audible frequency range. Great care has been taken to provide a
  user interface that is straight forward to use. Band parameters can be
  adjusted using handles directly in the graphical representation of the
  frequency response, including bandwidths and filter slopes.

  A flexible real-time analyzer lets you monitor every aspect of the processing.
  You can easily switch between full, mid, side, left or right channel
  processing for each band and equalize automatically routes the audio signal
  internally to ensure the best results and lowest possible latency.

  Acon digital equalize 2 is available for both windows (pc) and os x
  (macintosh). Both 32 and 64-bit versions are available, and the plug-in
  formats VST, vst3, AAX and audio units (os x only) are supported.
specs: |-
  - Parametric equalizer plug-in

  - VST plugin format

  - Vst3 plugin format

  - AAX plugin format

  - Audio units plugin format (os x only)

  - 32-bit version

  - 64-bit version

  - Windows 10/8/7 compatible

  - Os x 10.9 or later compatible

  - Eight different band filter types (low cut, low shelf, peak, tilt, bandpass,
  notch, high shelf, high cut)

  - Up to twelve independent bands

  - Freely adjustable gain, frequency, bandwidth, resonance and filter slope

  - Filter slope range 3 db to 120 db per octave

  - Three phase modes (minimum phase, linear phase, mixed phase)

  - Mixed phase mode with adjustable latency 5 to 120 milliseconds

  - Zero latency operation in minimum phase mode

  - Channel processing modes (mid, side, left, right, full)

  - Real-time spectrum analyzer

  - Automatic make-up gain

  - Sample rates up to 96khz

  - Mono and stereo support

  - Intel core i3 or amd multi-core processor (intel core i5 or faster
  recommended)

  - 1366 x 768 display resolution minimum (1920 x 1080 or higher recommended)

  - 1 gb ram minimum (4 gb or more recommended)

  - 1 gb free hd space

  - Pro tools 10.3.5 or higher for windows

  - Pro tools 11 or higher for os x

  - Factory presets included

  - Custom preset saving capability
