description: Real-time polyphonic key, scale and pitch correction plugin that enables users to correct or manipulate pitch of any audio material using zplane's TONART V2 pitch detection technology.
details: |-
  Polyphonic pitch correction and manipulation plugin. Supports 1-16 channels I/O, 44.1-192kHz sample rates, surround configurations (7.1.2, 7.1.4, 9.1.4, 9.2.4). Uses TONART V2 pitch detection technology. Plugin latency: 140ms.
specs: |-
  - Real-time processing within DAW
  - Automatic pitch correction to nearest semitone
  - Automatic input key detection
  - Fully configurable input-to-output pitch mapping
  - Built-in scale presets (major/minor, church modes, gypsy, chromatic)
  - Sensitivity, transient, and smoothing controls
  - Audio: 1–16 channels
  - Sample rates: 44.1–192 kHz
  - Compatible with 7.1.2, 7.1.4, 9.1.4, 9.2.4 channel configurations
  - Plugin latency: 140 ms
  - Minimum CPU: 2 GHz
  - macOS 12 or later (64-bit Intel & Apple Silicon)
  - Windows 10 & 11 (64-bit)
