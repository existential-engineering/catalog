details: |-
  Multiband Dynamics is a processor that adds clarity, warmth and punch to a mix.

  It shapes the timbral quality of audio by running it through a three-band crossover and providing independent compression in each frequency range before summing the result through a limiter. Without compression it broadly shapes the timbre of a track, and enabling the compressor for a band provides dynamic range control or dynamic EQ.

  Multiband Dynamics is an essential tool for mixing and mastering, but can also be used for sound design and other audio processing.

  The low, mid and high band compressors offer selectable auto gain and comprehensive linking between bands, with a post-compressor limiter for level maximization. A dynamic transfer function shows the overall response, SpectraFoo spectrum analysis is built in and the gain reduction meters are scalable. Many presets are included, the UI size is adjustable with disclosable graphs, and the MH Preset Manager provides cross-platform presets.

  Version 4 adds a VST3 version on both macOS and Windows with native Apple Silicon support for VST hosts including Steinberg products. All v4 plug-ins add undo/redo, A/B snapshots with snapshot blend, software update tracking, more flexible resizability, common controls in the header bar, improved preset management, settings copy and paste between instances, a plug-in details pane reached from the MH logo, a smaller installer download on macOS, configurable themes, selectable knob styles and user preferences for band colors, UI colors and knob rings.
specs: |-
  - World-class signal processing and workflow
  - Low, mid and high band compressors with selectable auto gain
