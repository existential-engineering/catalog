description: A new era in blockbuster scoring is upon us. Our most epic library yet, this gargantuan, all-in-one toolkit pushes contrast, dynamism and intensity to eleven, elevating your scores to breathtaking new heights.
details: |-
  A new era in blockbuster scoring is upon us. Our most epic library yet, this gargantuan, all-in-one toolkit pushes contrast, dynamism and intensity to eleven, elevating your scores to breathtaking new heights. Action films are nothing without suspense. This feat of musical engineering offers every element needed to seamlessly transport your scores from quiet suspense and tension, through to the most dramatic and epic of soundworlds, featuring two complete orchestras, chamber and symphonic, heavy chugging guitars, a diverse, hard-hitting set of percussion and drum kits, and epic, widescreen synths, expertly crafted for ultra-modern scoring.

  There is no impact without suspense and tension. We have built Albion Colossus with this principle at its core, moving from a delicate moment to powerful rage in a single patch. Build calm by exploring close and small ensembles, flautando chamber strings, tense dark synths, and brooding guitars. Create the storm with the force of a full symphonic orchestra, hard-hitting percussion, epic synths and six guitars re-amped through six stacks in a concert hall.

  Take control of a chamber orchestra (42 players) and a symphony orchestra (111 players) across strings, brass, woodwind and percussion, seamlessly blending between the two to create new dynamism and intensity. The two orchestras were captured at Scotland's Studios, based in the Glasgow Royal Concert Hall, the chamber orchestra in the New Auditorium and the symphony orchestra in the Royal Concert Hall, recorded using the same recording equipment and the same musicians.

  Breaking the formula in this Albion, the Colossus plugin allows us to add much more dynamism to this sample library than previous instalments, delivering dimensions of control rather than the usual two. Accompanying the standard dynamics (volume) and expression (timbre) faders are the brand new Hype, Scale and Depth controls. Hype enhances each preset differently, adding professional production knowledge to your sounds. Scale expands the size of your ensemble seamlessly from chamber to symphony. Depth moves from an extreme close signal to a far and ambient mix in one movement.

  Alongside the orchestra sit crafted brooding guitar tones re-amped in a concert hall, an ultra-modern and diverse selection of percussion from traditional orchestral tuned and untuned instruments through to junkyard smashing and heavy-hitting acoustic and synth drum kits, and masterminded synths that move from clean to dirty and light to dark, created in collaboration with sound artist Snakes of Russia.
specs: |-
  - 2 orchestras: chamber (42 players) and symphony (111 players)
  - 11 sections
  - Instrument groups: low strings, high strings, brass, French horns, woodwinds, flutes, piccolos, percussion, acoustic drum kit, electric guitars, drum machines, synthesisers
  - 150 techniques
  - Hype control: adds production processing from tape saturation and depth to distortion widening
  - Scale control: expands ensemble size from chamber to symphony
  - Depth control: moves from super close signal to tree-based mixes to a super wide ambient mix
  - Standard dynamics (volume) and expression (timbre) faders
  - New eDNA content providing 995 techniques enhanced by 5 distorting warps
  - Evo Grid Mode with 10 string, 4 brass, 4 woodwind and 8 granular evolutions
  - 10 altered drum kits designed by Snakes of Russia
  - Acoustic drum kit with kick, snare, toms, hi-hats, crashes, stacks, splash, china, ride and chokes
  - Electric guitars: 3 amps in New Auditorium (chamber), 6 amps in Glasgow Royal Concert Hall (symphony)
  - Synth library covering bass, drones, keys, leads and pads
  - Percussion: concert kit, timpani, traditional kit, taikos, junkyard kit, crotales, glockenspiel, vibraphone
  - Articulations include longs, legato, spiccato, staccato, staccatissimo, marcato, hairpins, crescendo, flautando, sul tasto, sul pont, tremolo, pizzicato, Bartok pizzicato, col legno and jete
  - Recorded at Scotland's Studios, Glasgow Royal Concert Hall (chamber in the New Auditorium, symphony in the Main Concert Hall)
  - Runs in the dedicated Spitfire Audio plugin, Spitfire Audio App required
  - macOS 11 to OS 26, minimum 2.8GHz i5 quad-core with 8GB RAM, recommended 2.8GHz i7 six-core with 16GB RAM
  - Windows 10 or 11 (64-bit), minimum Intel 2.8GHz i5 quad-core or AMD Ryzen 5 with 8GB RAM, recommended Intel Core i7 6th gen or later or AMD Ryzen 7 with 16GB RAM
  - Both Intel and Apple Silicon/ARM supported, 32-bit systems not supported
  - Approximately 148GB download size
