description: 80s tv drums is a drum module inspired by the drums and percussion
  heard in 80s tv shows.
details: >-
  80s tv drums is a drum module inspired by the drums and percussion heard in
  80s tv shows. It's the result of what would happen if you produced drums the
  way they were produced in the 80s, recorded them on vhs, and sampled and
  mastered them with modern production techniques.


  It's the perfect plugin to produce synthwave, vaporwave, and retrowave.
specs: |-
  - 12 drum kits
  - 10 drum sounds per kit
  - Vhs effect for each drum sound
  - Multi-lfo
  - Lowpass/highpass filter
  - Global reverb
  - Amplitude range controls
  - VST plugin
  - Audio units plugin
  - VST 3 plugin
  - 64-bit vsti/aui host
  - Windows 8.1/10
  - Macos el capitan to mojave
  - 50 mb of hd space
  - Quad-core cpu or better
  - 4 gb of ram or more
