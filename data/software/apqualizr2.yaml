website: https://www.apulsoft.ch/apqualizr2/
description: Apqualizr2 is an audio plugin based on a multiband equalizer
  layered on top of a frequency analyzer with elements of a modular effects
  system.
details: >-
  Apqualizr2 is an audio plugin based on a multiband equalizer layered on top of
  a frequency analyzer with elements of a modular effects system. It features
  graphical editing of top quality low latency filters and modular modulation of
  various filter parameters.


  It can be used for all standard eq applications and can produce many
  modulation/dynamics effects thanks to the dynamics and lfo modules included.


  Filter parameters can be modulated by a configurable network of modules.
  Current module selection: lfo, dynamics detector, signal scope, mix, split,
  knobs.


  Apqualizr2 by apulsoft is a virtual effect audio plugin for macos and windows.
  It functions as a VST plugin, an audio units plugin, a VST 3 plugin and an AAX
  plugin. A mac with an 64-bit intel/apple silicon cpu running os x 10.11 or
  newer. A host application that can load VST, vst3, AU or AAX plugins running
  in 64-bit mode. Pro tools (AAX): pro tools 11 or newer including apple silicon
  native.
specs: |-
  - Multiband equalizer
  - Frequency analyzer
  - Modular effects system
  - High-quality variable poles filters
  - 4 phase correction engines (minimal, analog, mixed, linear)
  - Graphical editing of filter parameters
  - Unlimited number of filter bands
  - Zoomable fft-based frequency analyzer
  - Undo/redo support
  - Frequency band solo feature
  - Lfo module
  - Dynamics detector module
  - Signal scope module
  - Mix module
  - Split module
  - Knobs module
  - Sidechain support with dedicated sidechain module
  - Lfo multi-segment curve editor with unlimited control points
  - Host time sync
  - Copy/paste of modules via xml across instances
  - Mid-side / left-right processing per filter band
  - Comb filter
  - Spectral tilt filter with freely adjustable slope
  - Variable slope high- and low pass filters
  - Harmonic filterbanks with peak, parallel bandpass, and notch bands
  - All pass filter
  - Output clipper with gain reduction graph and high quality antialiasing
  - Interactive piano ruler
  - Import of equalizer config text files from autoeq and rew
  - Bright & dark color schemes
  - User defined color schemes support
  - VST plugin
  - VST 3 plugin
  - Audio units plugin
  - AAX plugin
  - 64-bit intel/apple silicon cpu support
  - Macos and windows compatibility
  - Os x 10.11 or newer
  - Pro tools 11 or newer including apple silicon native
  - Low latency filters
