details: >-
  The analog mastering tools (amt) include three processors that sets a new
  standard for mixing and mastering your music with a subtlety and musical
  character reminiscent of tube systems.


  Amt amp leveling features a proprietary algorithm that ensures smooth, warm
  sound quality, achieves high volume levels without digital-over-clipping, and
  includes look-ahead limiting for precise control to prevent peaks and
  clipping.


  Amt max warm combines proprietary dynamic signal analysis with a special
  processing algorithm that maximizes incoming signal levels while limiting
  ceiling peak levels, includes a two-band equalizer with shelving and peaking
  eq with adjustable frequencies, and functions as a brick-wall limiter and
  level maximizer.


  Amt multi max is a 3-band look-ahead limiter that is highly optimized as a
  multiband peak limiter and level maximizer, features a 3-band crossover with
  adjustable frequencies for sweet highs and punchy lows, and provides low
  latency with comprehensive control over the sound.
