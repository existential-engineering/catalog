description: Philly DI is a lovingly crafted emulation of the rare custom-built
  Sigma Sound Studios DI created by Joe Tarsia, founder and owner of Sigma Sound
  Studios in Philadelphia and New York. It models the original transformer's
  character and adds a level-compensated Drive control and an integrated
  compressor.
details: |-
  The Sigma Sound Studios DI was a general purpose direct box built to direct inject electric keyboards and, more importantly, to get the best out of electric bass and guitar. Joe Tarsia, who founded and ran Sigma Sound Studios, has described it as the only DI used for recording at the studio across the 35 years that followed its opening, and as the box that came out on top in head to head comparisons against both active and passive DIs brought to market. Its sound is part of the recordings associated with 'The Sound of Philadelphia'.

  The heart of the Sigma DI was a high quality audio transformer that had been out of production for years and was nearly impossible to find, which is why so few were ever built. Only 50 of these DIs were ever made.

  The Philly DI plug-in is a digital emulation of a pristine original hardware unit provided by George Hajioannou of Studio Logic Sound, with a couple of additions. It reproduces the transformer characteristics of the Sigma Sound Studios DI box faithfully, and adds an integrated level-compensated Drive control that sets how hard the transformer is hit, plus an integrated compressor matching the signal chain used at Sigma Sound Studios on many classic recordings.

  User-selectable oversampling, an adjustable UI size, a large preset library and the MH Preset Manager for cross-platform presets round out the plug-in, which runs as a Mac AU, a Mac and Windows VST and VST3, and a Mac and Windows Pro Tools AAX (Native) plug-in. A +DSP version of the plug-in, running with zero latency on hardware, is included with Metric Halo 3d audio interfaces.
specs: |-
  - Faithful emulation of the transformer characteristics of the Sigma Sound Studios DI box
  - Integrated level-compensated Drive control to set how hard the transformer is hit
  - Integrated compressor matching the signal chain used at Sigma Sound Studios
  - Many presets included
  - User-selectable oversampling
  - Adjustable UI size
  - MH Preset Manager provides cross-platform presets
  - Cross platform: Mac AU, Mac and Windows VST and VST3, Mac and Windows Pro Tools AAX (Native)
  - macOS 10.10 or newer, Intel Processor or Apple Silicon, AU, VST 2 & 3 or AAX (Pro Tools 11 and newer Native) host, 64 bit
  - Windows 7 or newer, Intel Processor, VST or AAX (Pro Tools 10, 11 & 12 and Native) host, 64 bit
  - Licensing requirements: none, it is free
