description: Punctuate is an intelligent transient shaper that uses auditory
  modeling based on human ear critical bands to reshape transients across 26
  frequency bands independently rather than affecting the entire signal at once.
details: |-
  Punctuate is a multi-band transient shaper that divides audio into 26 critical frequency bands, allowing independent transient emphasis or suppression in each band. This approach mirrors how the human auditory system processes sound, enabling surgical transient control without affecting the full-spectrum signal.

  The plugin uses intelligent adaptive algorithms to control all 26 shapers with just four primary controls, making complex multi-band transient shaping accessible without an overwhelming interface. An advanced filter bank page is available for expert-level customization beyond the main controls.

  Punctuate includes 40 professional presets covering drums, bass, guitars, vocals, and full mixes, along with integrated metering to visualize the effect. Linear phase FIR filters with triangular shaping ensure phase coherence across the frequency bands.

  Punctuate is part of the Elevate Mastering Bundle alongside Elevate, Saturate, and EQuivocate. It is available as a standalone purchase or as part of that bundle, with a free 14-day fully featured trial.
specs: |-
  - 26 critical frequency band transient shapers
  - 4 main controls govern all 26 bands via intelligent adaptive algorithms
  - Linear phase FIR filters (triangularly shaped)
  - Filter bank page for expert customization
  - 40 professional presets included
  - Integrated metering
  - macOS 10.9+ (Apple Silicon compatible), 64-bit only
  - Windows 10+, 64-bit only
  - Formats: AAX, AU (Mac only), VST, VST3
