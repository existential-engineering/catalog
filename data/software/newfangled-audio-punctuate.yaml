  - name: 1.13.2
    releaseDate: 2024-05-31
    description: Fixed a crash on preset save under certain conditions.
  - name: 1.13.0
    releaseDate: 2024-05-04
    description: Preset name is now saved with Session. Fixed reveal preset folder
      on Windows. Unknown is now No Category. Enter button saves preset on
      preset save page. User Bank is added to the preset drop down list. Added
      cycle UI message to OpenGL Button. Added IMPORT button for presets.
      Favorite flags are now persistent load and save, even when modified. Made
      logos render more clearly on Windows. Passes Windows Smart Screen.
  - name: 1.12.6
    description: Preset RESCAN no longer hangs with very large preset collections.
      Clearer descriptions for Unknown preset Categories and Banks. Punctuate
      input meters now show the proper values.
  - name: 1.12.5
    description: Third Party Banks are now shown in the main dropdown. Author and
      Banks now show presets by category as well. EXPORT is now called SAVE AS
      and SAVE is now SAVE TO USER. Neither SAVE nor SAVE AS will clear tags,
      category, or description. SAVE AS remembers your previous save position.
      Added scroll bar to the LIBRARY page. LIBRARY page has resizable columns.
      Removed duplicate files when saving a .tide as a .nfa.
  - name: 1.12.1
    description: Automatically rescans plug-ins folder on every open.
  - name: 1.12.0
    description: New preset librarian adds Categories, Tags, Descriptions, Artist
      links, Favorites, and Search to presets. Multi level undo/redo for easier
      workflow. True A/B comparison for making better mixing decisions. New
      Delta Listen Mode allows you to hear the changes being applied to your
      input. SET AS DEFAULT button allows you to save any settings as your
      default.
  - name: 1.11.0
    description: Support for AAX Silicon Native (Mac Only). Improved performance on
      Windows machines (Windows Only). Plug-ins default to OpenGL Off on
      Windows. Removed support for Windows 8 (Windows Only).
