description: Cab-Lab 4 with DynaCab makes it quicker, easier, more intuitive,
  and more fun to achieve great tone, allowing you to customize and mix cabs,
  mics, and more. It comes with both Standalone and Plugin versions for macOS
  and Windows, and the page states it is now free.
details: |-
  Cab-Lab 4 is an impulse response mixer and tools application, and the page states it is now free: the Standalone and Plugin bundles for macOS and Windows are offered as downloads on the page itself. An impulse response, or IR, is described as a sonic capture, essentially the fingerprint of a tone over time. Fractal Audio is known for amp modeling but was also the first to allow installable impulse responses in a guitar product, which set a new industry standard and let guitarists recreate the sound of their favorite mic'd speaker cabs in a portable format, for both studio recording and live performance.

  The download carries both a standalone application and a plugin. The standalone uses an Axe-Fx III, FM9, FM3 or another audio interface so mics can be selected, positioned and mixed while listening in real time. The plugin version processes audio in a compatible DAW or host and can be used to re-cab raw amp recordings. Features include a 4-channel IR mixer plus tools to EQ, align and more, and Cab-Lab 4 can export IRs for a Fractal Audio hardware product or save files to the computer.

  DynaCab is the technology behind the mic placement. Where artists, producers and engineers have long positioned and mixed mics on guitar speaker cabs by hand, DynaCab replicates that process by letting the result be heard in real time while a virtual mic is moved on a virtual speaker, so a tone can be found without sifting through many individual IRs. The DynaCab system in Cab-Lab 4 offers more resolution and flexibility than the Fractal Audio hardware products, with 360 degrees of placement at variable distances and the possibility of additional microphone choices.

  DynaCab Packs work like plugins for Cab-Lab 4. Each pack contains a 3D set of speaker IR captures made with multiple microphones, for example a vintage 4x12, a modern 2x12 or a boutique 1x12, and with a pack installed the full array of tones that speaker and its available microphones can produce becomes accessible. Packs bought from the Fractal Audio store appear automatically in the Cab Pack Manager once a store username and password, or an email address and order number, are entered, and each purchase may be authorized on up to two computers.

  Cab-Lab 4 is fully compatible with every Cab-Pack ever sold in the Fractal Audio store and with third-party IRs in Fractal Audio or .wav format. Those legacy cab packs do not appear in Cab Pack Manager, so a channel is set to Single IR Mode and the file is dragged into the IR field or located with the Browse button. Factory cab IRs cannot be loaded into Cab-Lab 4 from a connected Fractal Audio device, although many factory cabs are sold separately in the Legacy Cab Packs section of the store. The current release is version 1.02.01, dated October 30, 2026, requiring macOS 10.13 or newer or Windows 10 or newer, with a separate 32-bit Windows build.
