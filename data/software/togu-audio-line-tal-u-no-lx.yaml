description: TAL-U-NO-LX is a synthesizer plug-in that faithfully recreates the iconic sound of the analog Juno 60 synth. Each oscillator, filter, and envelope has been painstakingly modeled to capture the essence of the original hardware, delivering an unparalleled level of authenticity. The synth was calibrated after a hardware device owned by TAL.
details: |-
  TAL-U-NO-LX is a synthesizer plug-in that faithfully recreates the iconic sound of the analog Juno 60 synth. Each oscillator, filter, and envelope has been painstakingly modeled to capture the essence of the original hardware, delivering an unparalleled level of authenticity.

  This virtual instrument captures the warmth, richness, and nostalgic charm of the hardware device. The synth was calibrated after a hardware device that's property of TAL.

  The plug-in ships for Windows, macOS and Linux in VST, VST3, Audio Unit, AAX and CLAP formats. The macOS build is a Universal Binary 2 with native Intel and Apple silicon support (M1, M2, M3 and later), and AAX runs in Pro Tools 10.3.6 or higher (64 bit).

  A large ecosystem of third-party preset banks is available, both free and commercial, from sound designers including Thomas Ueber (64 presets), Alexander Ermolaev (48 presets), Symbiotic (50 presets), kreziesounds (145 presets), TwolegsToneworks (32 presets), Luftrum, Espen Kraft, NEWLOOPS, Reverb Machine, Oblivion Sound Lab and P.O Haas.

  A demo version is available with the restriction that the plug-in produces a rising white noise sound every minute. Older builds remain downloadable for compatibility: v4.9.5 for Windows 7, v4.4.5 for the old serial key scheme, and v3.2.4 including 32 bit support.
specs: |-
  - Emulation of the Roland Juno 60 analog synthesizer, calibrated against a hardware unit owned by TAL
  - MPE support with MPE keyboard view and options for different MPE hardware devices such as the Osmose
  - Direct LFO DCO modulation wheel support
  - Arpeggiator with as-played, random and up-and-down modes, host sync, round robin, poly aftertouch and note-based velocity
  - Unison mode with random unison phases and a round robin voice mode
  - Built-in chorus, plus delay and reverb effects
  - Microtuning via MTS support and .tun tuning file import
  - Portamento with TIME mode and filter keyfollow
  - Preset browser with categories, default-preset support and MIDI program change
  - MIDI learn, MIDI output and 14-bit MIDI controller support for CC 1 to 31
  - Undo and redo functionality
  - Scalable vector user interface with resize support
  - Reduced aliasing through improved oversampling
  - Service Control (SC) dialog with voice detuning, random and lock buttons
  - Roland SFC 60 hardware controller integration, sending parameter values to the controller
  - Windows: Windows 10 or higher (64 bit host)
  - macOS: 10.11 or higher (64 bit host), Universal Binary 2 with native Intel and Apple silicon support (M1, M2, M3 and later)
  - Linux: 64 bit, Ubuntu 18 or similar
  - AAX: Pro Tools 10.3.6 or higher (64 bit)
  - Demo restriction: the plug-in produces a rising white noise sound every minute
