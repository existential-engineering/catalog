description: A faithful emulation of the Webster Electric WSC-515, a rare 1960s Vari-Mu tube limiter by Webster Electric originally designed for US broadcast — a contemporary of the Altec 438. The original was a single-knob push-pull feedback unit; the plugin adds variable attack/release, a sidechain high-pass filter, and a dry/wet mix knob while preserving the characteristic soft-knee compression and rich tube harmonics. A switchable Amplifier mode bypasses gain reduction, turning the plugin into a standalone saturator.
details: |-
  Emulates the Webster Electric WSC-515 (1960s Vari-Mu tube limiter, US broadcast). Circuit modeling: 6BZ7 Vari-Mu tube, 6SN7 output stage triode, custom transformer. Original hardware had only a single input gain knob; plugin adds: variable attack/release controls, sidechain high-pass filter, dry/wet mix, Amplifier mode (bypass gain reduction for saturation-only use). Soft-knee Vari-Mu compression characteristic. Analog-style GR meter.
specs: |-
  Controls: Input gain, Limiter/Amplifier mode switch, Attack, Release, Sidechain high-pass filter, Mix (dry/wet). macOS 10.9+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+ (32-bit and 64-bit), 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX. Copy protection: serial number.
