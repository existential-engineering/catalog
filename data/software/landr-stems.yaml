description: Take control of your mix with LANDR Stems, an innovative audio
  separation tool that transforms any audio file into cleanly separated stems.
details: |-
  LANDR Stems is an audio separation tool that extracts individual vocals, drums, bass, guitar and more into distinct stems. It is powered by AudioShake's award-winning AI, described on the product page as the same stem-separation technology that professionals and major labels use worldwide.

  The tool breaks audio files into vocals, bass, guitar, drums and an "other" track, with LANDR citing cleaner transients and less bleed than alternatives, and naming Disney and Universal as users of the underlying technology.

  Adaptive ingestion accepts audio files of any length, genre and audio quality. A drag-and-drop workflow lets users upload files and generate stems quickly, and stems can be auditioned before downloading using solo and mute functions.

  Separated tracks can be downloaded individually or as a package, giving flexibility for remixing, sampling and reimagining existing tracks or isolating individual elements of a song for rebalancing.

  LANDR Stems is included with a LANDR Studio subscription, which also bundles plugins, samples, mastering and distribution.
specs: |-
  - Separates audio into vocals, bass, guitar, drums and "other" tracks
  - Powered by AudioShake AI stem-separation technology
  - Adaptive ingestion: upload audio files of any length, genre and audio quality
  - Audition individual tracks with solo and mute before downloading
  - Drag-and-drop file upload
  - Download a single stem or all stems as a package
  - macOS: macOS X 10.14 or higher, Apple Silicon native or Intel (VST3, AU, AAX)
  - Windows: Windows 10 (64-bit) or higher (VST3, AAX)
