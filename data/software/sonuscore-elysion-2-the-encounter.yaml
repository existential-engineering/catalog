description: Ambient and powerful hybrid composing tool that is the massive hybrid twin to THE ORCHESTRA, featuring 207 playable instruments and over 400 complex animated themes. Built on handcrafted and synthetic sounds treated like acoustic instruments, enabling users to play simple chords and instantly create overwhelming sound worlds.
details: |-
  ELYSION 2 - THE ENCOUNTER is a hybrid KONTAKT instrument built on handcrafted and synthetic sounds sampled the way an orchestra is sampled. Every sound was recorded across multiple velocity layers and round robins, each layer shaped by hand, so playing harder changes the tone rather than only the volume: more overtones, more grit, more force, with no audible crossfade between two different samples.

  It runs on the same ensemble engine as THE ORCHESTRA. Up to five instruments load across five slots, and playing a chord animates it into a full arrangement, with each slot carrying its own arpeggiator, envelope and effects. A Motion Engine morphs effects between a low and a high value in real time and steers attack, decay and more from the mod wheel or MIDI, with two pan steppers adding movement to a pattern. Performances drag straight into a DAW as MIDI.

  THE ENCOUNTER is the aggressive, driving side of the instrument, built for trailers and blockbusters with distortion and saturation built in, and it includes the complete original ELYSION, the wide, ambient and organic side, at no extra cost. Every theme is named after a planet or interstellar object whose character it carries, from Mars (distortion and hard-edged transients) through Venus, Neptune, Mercury, Terra, Jupiter, Saturn and Uranus to Sagittarius, Antares, Sirius and Orion. Four theme types say how each behaves: Animated, Pad, Hit and Pulse.

  Version 2 adds every instrument as a single-instrument NKI playable outside the engine, new distortion and saturation effects, a refined Ensemble Engine 2.0 and a switchable GUI offering either the ELYSION or the ELYSION 2 interface.
specs: |-
  - Works with the FREE KONTAKT PLAYER
  - Requires KONTAKT version 6.6.0 or higher
  - macOS 10.13 or higher, Intel Core i5
  - Windows 7 or higher, Intel Core i5
  - 4 GB RAM (6 GB recommended for large KONTAKT instruments)
  - At least 21.5 GB of free hard disc space
  - 207 instantly playable hybrid organic instruments
  - Over 400 complex animated and fully customizable themes, featuring up to 5 fully controllable instruments
  - Over 12,500 individual samples, all recorded, sampled and handcrafted
  - Sampled synthetic instruments containing up to 3 round robins and 5 velocity layers
  - Refined Ensemble Engine 2.0
  - Motion Engine allowing fundamental customizations, with two pan steppers
  - All instruments available as single NKIs, to play them freely outside the engine
  - New distortion and saturation FX
  - Switchable GUI between the ELYSION and ELYSION 2 interfaces
  - Includes the complete original ELYSION at no extra cost
  - Four theme types: Animated, Pad, Hit and Pulse
  - MIDI export via drag and drop into the DAW
  - NKS ready
