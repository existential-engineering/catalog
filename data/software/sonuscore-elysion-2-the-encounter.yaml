description: Ambient and powerful hybrid composing tool that is the massive hybrid twin to THE ORCHESTRA, featuring 207 playable instruments and over 400 complex animated themes. Built on handcrafted and synthetic sounds treated like acoustic instruments, enabling users to play simple chords and instantly create overwhelming sound worlds.
specs: |-
  - 207 playable instruments
  - Over 400 complex animated themes
  - 12,500+ individual samples
  - Up to 5 velocity layers and 3 round robins per instrument
  - Ensemble Engine 2.0 (controls up to 5 instruments simultaneously)
  - Motion Engine for MIDI CC customization
  - New distortion and saturation effects
  - MIDI drag-and-drop export
  - Switchable GUI between ELYSION and ELYSION 2
  - NKS Ready (Native Kontrol Standard)
  - Requires KONTAKT 6.6.0 or higher (works with free Kontakt Player)
  - macOS 10.13 or higher; Intel Core i5
  - Windows 7 or higher; Intel Core i5
  - 4 GB RAM (6 GB recommended)
  - 21.5 GB free disk space
