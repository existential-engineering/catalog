description: Design your acoustic space from scratch. Ray-tracing reverb with 3D
  source/mic positioning, per-wall material control, and binaural monitoring.
details: |-
  Spaces MK2 builds an acoustic space from scratch rather than from a library. You set the room dimensions, assign material properties to each wall, position sources and the listener in 3D space, and hear reflections calculated with ray tracing physics, with no impulse-response hunting or guessing involved.

  Room geometry is defined in meters across width, length and height, with the height parameter also governing the ceiling. An option to remove the ceiling entirely allows open-air or semi-open environments that behave less like a box.

  Each wall carries independent high-frequency and low-frequency reflection and diffusion characteristics, so surfaces can be matched to real materials: glass reflects highs and passes lows, curtains absorb highs, concrete reflects everything. The stated aim is control over the acoustics rather than selection of a room preset.

  Sources and the listener are placed independently on X, Y and Z axes. Moving the listener changes perceived distance and room character, while each source can sit anywhere in the room, letting a guitar amp be pushed into a corner and a vocal kept dry and up front inside the same space.

  Output runs in either stereo mode, aimed at studio monitor mixes and mix-bus or send duty, or binaural mode, which uses head-related transfer functions and a virtual head for headphone monitoring with spatial positioning and depth cues. Global macro controls cover Reflections, Diffusion and Dry/Wet, and room configurations can be saved and loaded, including a default room on startup.
specs: |-
  - Ray tracing simulation generates reflections based on room physics
  - Modellable room dimensions: width, length and height set in meters
  - Per-wall material controls with independent low-frequency and high-frequency reflection and diffusion
  - Remove-ceiling option for open-air and semi-open spaces
  - 3D X/Y/Z positioning for listener/mic and for left and right sources
  - Stereo and binaural (HRTF) output modes
  - Global macro controls for Reflections, Diffusion and Dry/Wet
  - Save and load room presets, including a default room at startup
  - Formats: VST3 / AU / AAX
  - macOS 10.13+ (64-bit)
  - Windows 10 / 11 (64-bit)
  - Authorization not required, just download the plugin
