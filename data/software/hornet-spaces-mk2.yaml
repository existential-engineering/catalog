description: Design your acoustic space from scratch. Ray-tracing reverb with 3D source/mic positioning, per-wall material control, and binaural monitoring.
details: |-
  Spaces MK2 builds an acoustic space from scratch rather than from a library. You set the room dimensions, assign materials to each wall, position sources and listener in 3D space, and hear reflections calculated with ray tracing physics, with no impulse responses to hunt through.

  The workflow has four steps: define width, length and height in meters; assign material properties to each wall; place sources and listener in X/Y/Z space; and let ray tracing generate the reflections. Each wall has independent high and low frequency reflection and diffusion characteristics, so glass, curtains and concrete can be modelled separately.

  The listener position can be moved to change perceived distance and room character, and each source can be positioned independently in three dimensions. Two output modes are available: a traditional stereo mode for studio monitors, and a binaural mode that uses head-related transfer functions for immersive headphone listening with accurate spatial positioning and natural depth cues.

  Room configurations can be saved and loaded as presets and a default room can be set on startup. A remove-ceiling option allows open-air environments to be designed, and global macro controls give quick adjustments to reflections, diffusion and dry/wet without digging into individual parameters.
specs: |-
  - Ray tracing physics for room reflections
  - LF/HF wall material controls, independent per wall
  - Modellable room dimensions (width, length, height in meters)
  - 3D positioning (X/Y/Z) for sources and listener
  - Stereo and binaural (HRTF) output modes
  - Save and load room presets, default room on startup
  - Remove ceiling option for open-air environments
  - Global macro controls for reflections, diffusion and dry/wet
  - Formats: VST3 / AU / AAX
  - macOS 10.13+ (64-bit)
  - Windows 10 / 11 (64-bit)
  - No authorization required, just download the plugin
