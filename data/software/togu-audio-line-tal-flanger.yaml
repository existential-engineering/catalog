details: |-
  TAL-Flanger is a stereo flanger effect that Togu Audio Line describes as easy to tweak, with its own special sound and some asymmetric analog like components in the feedback corner.

  The page positions it for a wide range of flanger effects, from subtle movement through to extreme settings.

  It has no product page of its own: the plugin is one of four sections rendered on the legacy /products/tal-effects page, each with its own heading, screenshot, downloads and requirements block.

  Downloads are direct zip archives with no installer: Windows 32-bit VST, Windows 64-bit VST, OSX 32-bit VST and OSX 32-bit AU. No price, purchase path, version number, changelog or release date appears anywhere on the page.
specs: |-
  - Stereo flanger effect
  - Asymmetric analog like components in the feedback path
  - Windows XP or higher (32 / 64 bit)
  - OSX 10.6 and < 10.10 (32 bit Host)
  - Downloads: Windows 32-bit VST, Windows 64-bit VST, OSX 32-bit VST, OSX 32-bit AU
