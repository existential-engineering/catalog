details: |-
  TAL-Flanger is a stereo flanger effect that Togu Audio Line describes as easy to tweak, with its own special sound and some asymmetric analog like components in the feedback corner.

  It suits a wide range of flanger effects, from subtle movement through to extreme settings.

  TAL-Flanger was one of the four free effects TAL distributed as TAL-Effects, alongside the original TAL-Bitcrusher, TAL-USE and TAL-Tube. TAL now lists TAL-Effects under "Deprecated Plug-Ins (not supported)".

  It was released as a Windows 32-bit and 64-bit VST and as a 32-bit VST and AU for OSX 10.6 to 10.9 hosts, so it does not run on current macOS. No installer, VST3, AAX or CLAP build exists.
