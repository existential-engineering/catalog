details: |-
  The Cherry Audio Quadra is a super-accurate and immensely improved emulation of the ARP Quadra synthesizer, originally released in 1978 - a rare and coveted “unicorn” instrument in the synthesizer world, reproduced for the first time as a virtual instrument. It combines four integrated instrument sections: Bass, Strings, Poly Synthesizer, and Lead Synthesizer.

  Cherry Audio's Quadra introduces improvements throughout every section, bringing out the full potential of the original ARP design. Each instrument section can now be layered anywhere across the keyboard, and transposition ranges have been increased for most sections.

  The paraphonic Poly Synthesizer section has been beefed up with an additional octave, optional oscillator drift, velocity control, new modulation capabilities (including pulse-width modulation), and additional waveforms. The Lead Synthesizer section has been enhanced with a more powerful arpeggiator, additional waveforms, adjustable note priority, and numerous other small improvements. The Quadra's rudimentary LFO becomes a full-featured, multi-waveform, tempo-syncable LFO, and a deeply flexible bender section allows pitch bend wheel data to independently bend pitches and modulate filter cutoff for each instrument section.

  The ARP Quadra's 14-stage phaser is modeled, with additional effects - chorus/flanger, echo, and reverb - that can also be turned on and off independently for each instrument section. Strings bathed in reverb, a poly synth slowly phasing and flanging, and a lead synth with a slapback delay can all be layered together.

  Quadra includes a multiple out version for maximum flexibility. The standard “Quadra” instance mixes the four sections to a summed output. “Quadra Multi Out” includes five sets of outputs: a standard stereo mix, plus dry independent outputs for each section, as found on the original hardware.
specs: |-
  - Over 450 presets, programmed by industry veterans
  - All four sections superbly recreated
  - Poly Synthesizer includes Drift control for increased analog realism
  - Independent key range assignment for all four instrument sections
  - Precisely replicated phase shifter with multiple mod sources
  - Tempo-syncable LFO
  - Multi-out instance allows separate processing of each instrument section
  - Improved arpeggiator section w/tempo sync
  - Accurately emulated “Touch Sensor” aftertouch section
  - Highly optimized coding for high performance with ultra-low CPU load
  - User-adjustable oversampling control
  - Advanced one-click UI magnification
  - Full MIDI control and DAW automation for all controls
  - macOS Requirements: 10.13 or above. macOS 13 Ventura supported. 64-bit required. Native Apple M1 or greater processor support, including Ultra. 3.4 GHz Quad-Core or M1 CPU with 8GB of RAM recommended.
  - Windows Requirements: Windows 7 or above (including Windows 11), 64-bit required. Quad-core computer with 8GB of RAM recommended.
  - Internet connection required for product activation.
