details: |-
  The Cherry Audio Quadra is a super-accurate and immensely improved emulation of the ARP Quadra synthesizer, originally released in 1978. A rare and coveted unicorn instrument in the synthesizer world, it is reproduced for the first time as a virtual instrument.

  Cherry Audio's Quadra introduces improvements throughout every section, bringing out the full potential of the original ARP design. Each instrument section can now be layered anywhere across the keyboard, and transposition ranges have been increased for most sections.

  The paraphonic Poly Synthesizer section includes an additional octave, optional oscillator drift, velocity control, new modulation capabilities including pulse-width modulation, and additional waveforms. The Lead Synthesizer has an enhanced arpeggiator, additional waveforms, adjustable note priority, and numerous improvements. The LFO is now full-featured, multi-waveform, and tempo-syncable.

  Cherry Audio modeled the ARP Quadra's 14-stage phaser and added effects including chorus/flanger, echo, and reverb that can be turned on and off independently for each instrument section. Over 450 presets programmed by industry veterans are included.
specs: |-
  - Four instrument sections: Bass, Poly, Strings, and Lead synthesizers
  - Over 450 presets programmed by industry veterans
  - Independent key range assignment for all sections
  - Poly Synthesizer with drift control for analog realism
  - Precisely replicated 14-stage phase shifter with multiple mod sources
  - Tempo-syncable LFO
  - Multi-out instance for separate processing of each section
  - Improved arpeggiator with tempo sync
  - Accurately emulated Touch Sensor aftertouch section
  - Ultra-low CPU load with user-adjustable oversampling
  - Full MIDI control and DAW automation
