details: |-
  BASE is a synthesizer that treats the bass and the kick as a combined musical
  entity: they are linked in terms of volume, spectrum and timing so they work
  together perfectly in your mix.

  The interface is very simple and optimized towards getting a good bassline as
  opposed to tweaking your sounds endlessly. Use the soundsets to get inspired
  and start playing immediately.

  Base is available in VST, vst3 and AU formats for both windows and mac in
  64-bit.

  It's actually 2 synths, 1 kick and 1 bass synth, no samples and it's not a
  loop player.
specs: |-
  - 64-bit
  - Windows compatible
  - Mac compatible
  - Kick synthesizer
  - Bass synthesizer
  - Volume linking
  - Spectrum linking
  - Timing linking
  - Sidechain
