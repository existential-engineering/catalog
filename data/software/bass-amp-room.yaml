description: Bass Amp Room was designed to handle all your bass amp needs, from
  dirty rock to modern clean, keeping two equally important goals in mind.
details: |-
  Bass amp room consists of a model of a classic bass amplifier, three
  distinctive speaker cabinets with click-and-drag mics, and a blendable di
  section with tone controls and a limiter. That's it. And it's all you need to
  create a unique signature sound - the strength lies in the ease of use of the
  individual blocks and the huge range of sounds these can produce when
  combined.

  In short, bass amp room is all about getting a sound you know you can trust,
  and getting it quickly, from a plug-in you don't need a degree in computer
  science to handle.

  Authentic amp and cabinet modeling. Three versatile and good-sounding
  cabinets. Designed for excellent results and fast work flow. Built-in one-knob
  limiter in d.I. Panel. Easy to use mix and d.I. Panel. Flexible & continuous
  click-and-drag mic positioning. Fully automatable parameters. 3-d rendered
  photo-realistic user interface. Compatible with all effects that work with
  real amps. Amp/cab bypass possibilities let you use cabinets from other amp
  room products.
specs: |-
  - Classic bass amplifier model
  - Three speaker cabinets
  - Click-and-drag mic positioning
  - Blendable DI section
  - Tone controls
  - One-knob limiter
  - Fully automatable parameters
  - 3-d rendered photo-realistic user interface
  - Amp/cab bypass
