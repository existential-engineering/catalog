description: Powerful beat manipulation and creation.
details: |-
  Nerve runs as a VSTi or AudioUnit plugin designed and coded by veteran dance music producers, with a diverse sample library included from many of today's top sound designers. Create your own beats entirely from scratch using sounds you already have (AIF/WAV/REX/RX2/AKAI .SND), or utilize the factory-included Drum Kits, Presets, Patterns, and Sounds.

  Nerve has an ergonomic mouse-driven Step Sequencer which allows you to program beats visually or by clicking rhythmically, with minimal mousing. Everything you frequently want to control is instantly accessible — no fumbling and excessive paging around to get things sounding how you want, in a window which won't consume your entire screen real-estate.

  Nerve contains a large, comprehensive 2-Gigabyte library containing full presets, drumkits, patterns, one-shots, and loops made by a variety of world-class sound designers, including SampleMagic, PowerFX, Richard Devine, Dom Kane, SampleSquad, Bitword, Noise Inc., and many others, catering to a wide variety of musical genres.

  You can drag-and-drop sound files onto pads and audition different samples instantly using navigation buttons. On-board editing with 22 simultaneous pre-calculated DSP types allows you to slice/trim, sculpt, stretch, bend, and re-synthesize sounds into completely new sounds with no play-time CPU expense. Nerve allows a single pad to contain up to 16 slices of a loop, with adjustable slice points automatically read from REX/RX2 files.

  Nerve features a unique Repeater control for on-the-fly re-triggering to create fills and variations. Each pad contains a 2x-oversampled State Variable Filter, flexible LFOs, and MultiStage Envelopes with tension curves. Each pad can run its own pattern chain, length, and randomize for polyrhythmic and polymetric beats. The plugin supports 8 stereo output pairs and full MIDI input and output.
specs: |-
  - VSTi and AudioUnit plugin formats
  - Internal mouse-driven step sequencer
  - 2 GB comprehensive sound library included
  - Supports WAV, AIF, REX, RX2, and AKAI .SND sample formats
  - 22 simultaneous pre-calculated DSP types for sound sculpting
  - Up to 16 slices per pad with adjustable slice points
  - Three time-stretching options: slice+fill, granular stretch, resample
  - Groove/swing extraction from REX/RX2 loops
  - Repeater control for on-the-fly re-triggering and fills
  - Per-pad 2x-oversampled State Variable Filter
  - Flexible per-pad LFOs for pan, level, cutoff, resonance, sample start
  - MultiStage Envelopes with tension curves
  - Internal sidechain-input compressor
  - Independent pattern chains per pad for polyrhythmic beats
  - 8 stereo output pairs
  - MIDI input and output with assignable notes and CC messages
