description: Loop Engine 2 is a multi-voice MIDI generation plugin that builds riffs, arpeggios and melodies from chord shapes and harmonic rules. It adds a polyphonic note editor, a revised polyrhythm mode and automatic auxiliary passing notes over the original Loop Engine.
details: |-
  Loop Engine 2 is the successor to W. A. Production and Liminal Sphere's multi-voice loop tools, continuing the MIDI generation approach of the Chords plugins. It moves past static chord shapes and divisible segments, generating riffs, arpeggios and melodies through tonal and rhythmic controls that shape the underlying algorithms.

  The Note Editor adds complex polyphony, allowing melodies, basslines, arpeggios and rhythms that extend beyond conventional chord notes, with note placement, content transfer and a scrollable piano roll. The revised Poly feature builds polyrhythmic patterns from segments that are highlighted during playback. AUX Notes inserts tasteful passing notes automatically to enrich chord transitions, and the revamped Listener provides three modes for managing how those notes are output.

  Core features carry over from Loop Engine 1.1. Routing and playing options integrate up to 8 MIDI parts into a DAW through the Loop Engine Listener plugin. Loop View adjusts chord inversions, lengths, speeds and keys globally or with granular control over individual chord shapes, inversions and velocity, while Chord Mode changes playback options for each chord.

  Tensions and Extensions offers 21 chord types with Type and Tension transformation buttons in Advanced Mode, and the Creation Station generates new progressions from 30 chord types and tensions. Simple segments hold up to 8 chords with 16 partitions each, and Overlap Mode produces self-generating melodies that react to changing chord segments.

  Finished chords and riffs drag and drop directly into a DAW as MIDI for further editing. Version 2 keeps the multi-track routing, chord selection and randomization of the original, streamlines the interface and adds a more comprehensive preset manager along with automation for essential controls.
specs: |-
  - Multi-voice MIDI generation with up to 8 routable parts
  - Note Editor with scrollable piano roll for complex polyphony
  - Revised Poly feature for polyrhythmic patterns
  - AUX Notes for automatic passing notes at chord transitions
  - Loop Engine Listener plugin with three AUX Note output modes
  - Loop View for global chord inversion, length, speed and key control
  - 21 chord types with Type and Tension transformations
  - Creation Station with 30 chord types and tensions
  - Up to 8 chord segments with 16 partitions each
  - Overlap Mode for self-generating melodies
  - MIDI export by drag and drop into the DAW
  - Preset manager with categorized chord, riff and arpeggio presets
  - Automation for essential controls
  - Windows 8 and later (64 bit)
  - macOS 10.13 and later (64 bit)
  - AAX requires Pro Tools 11 or higher
