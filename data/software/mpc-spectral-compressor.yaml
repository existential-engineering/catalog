name: MPC Spectral Compressor
manufacturer: harrison
primaryCategory: compressor
url: https://store.harrisonaudio.com/all-products/mpc-spectral-compressor
description: The spectral compressor is a clever dynamics processor that was
  originally developed for highly demanding film and post-production.
details: |-
  It offers 18 spectral bands of dynamic range control allowing you to sculpt
  the sound of each band individually or use the global controls to adjust the
  overall tone of your mix. Whether you want to smooth out harsh frequencies,
  boost the low end, or brighten the highs, spectral compressor can handle it.

  You can use it as an effective de-esser, a flexible drum bus processor, or
  even a subtle enhancer for vocals and instruments. No matter what genre you
  work in, spectral compressor will help you achieve a professional and refined
  sound.

  The depth sliders below the graph control the maximum amount of gain reduction
  that can be applied to the corresponding frequency bands determined by the
  current range setting. The range can be set to focus on specific areas along
  the frequency spectrum (low, mid, high, etc.), or it can be set to full range
  mode to allow control over the entire spectrum.

  The knee value determines how far the input signal must exceed the threshold
  in a given band, to incur the full depth for that band. With a low knee value
  (hard knee), the compression will activate more abruptly as the signal passes
  over the threshold. A high knee value (soft knee) will apply the gain
  reduction more gradually as the signal passes the threshold.
specs: |-
  - 18 spectral bands of dynamic range control





  - Master threshold control

  - Frequency range selection

  - Band depth controls

  - Gain reduction graph

  - Compressor knee

  - Output trim

  - Threshold range -60 to 0 db

  - Depth range -24 to 0 db

  - Knee range 1 to 30

  - Output trim range -10 db to +10 db

  - Frequency range options: full range (16 hz - 20 khz), high (3 khz - 20 khz),
  high mid (200 hz - 18 khz), mid (180 hz - 7 khz), low mid (12 hz - 8 khz), low
  (15 hz - 500 hz)

  - 6 depth sliders controlling 3 bands each

  - Hard knee and soft knee compression modes

  - Gain reduction visualization

  - Macos support

  - Windows support

  - Linux support

  - Universal 2 binary
