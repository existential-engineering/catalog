details: |-
  All the power and beauty of the human voice at your fingertips…

  All the power and emotion of the human voice, captured at the world's most celebrated scoring stage. Epic Choir is our largest choir to date — 50 of London's finest singers, recorded in the legendary acoustics of Lyndhurst Hall at AIR Studios. Captured in two independent sections (Sopranos & Altos / Tenors & Basses), it ranges from classic shorts and longs to vowel-blending 'episodic' textures inspired by gothic and mediaeval chant. The huge dynamic range shifts seamlessly from hauntingly quiet to raucously powerful, while the treated Ethereal signal adds brightness, width and texture without losing the organic feel of real voices. Instant choral inspiration for film and TV scoring. Explore the endless potential of the human voice.

  Originals Epic Choir requires the free Splice INSTRUMENT plugin to run.
specs: |-
  - File size: ~2.92 GB
  - 50-piece ensemble recorded at Lyndhurst Hall, AIR Studios
  - 12 presets across two sections (Sopranos & Altos, Tenors & Basses)
  - 3 mic signals: Close, Tree, Ethereal
  - 3 controls: Reverb, Release, Tightness
  - macOS 12 or later, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
