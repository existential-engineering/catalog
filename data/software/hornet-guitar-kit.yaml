description: HoRNet Guitar Kit is a guitar amplifier simulator with cabinet and mic emulations allowing to emulate any specific guitar sounds correctly.
details: |-
  HoRNet Guitar Kit is an advanced guitar amplifier simulator designed to offer guitarists a wide array of sounds, complete with cabinet and microphone simulations. It's an ideal tool for musicians who are looking for a highly customizable and realistic guitar rig setup without the need for physical hardware. With this plugin, you can create everything from classic amp sounds to modern, innovative tones, all within your DAW. Whether you're in the studio or performing live, HoRNet Guitar Kit offers you a versatile, responsive solution for crafting your ideal guitar tone.

  What sets HoRNet Guitar Kit apart from traditional guitar amp simulators is its use of physical modeling instead of relying on convolved impulse responses. While many other simulators use pre-recorded snapshots of real-world amps, cabinets, and microphones, which can often feel static and restrictive, HoRNet Guitar Kit offers dynamic and flexible physical models of each of its components. This approach allows you to not only replicate the sound of classic and modern amplifiers but also fine-tune and customize every part of your signal chain to suit your preferences. You can choose the type of tubes used in the amplifier's power and preamp sections, giving you the ability to tailor the tonal characteristics of your amp to suit your musical style.

  HoRNet Guitar Kit consists of three main modules: the amplifier, the cabinet, and the microphone. Each of these modules plays a vital role in shaping the overall sound, and each can be activated or deactivated independently. This flexibility is particularly useful when you want to experiment with different combinations or apply specific effects only to certain parts of your signal chain. For example, you can use the cabinet and mic simulations with an external amp model, or use the amp's built-in cab and mic simulations to create a simpler setup.

  The cabinet module offers the option to pick and choose from different speaker types and sizes, and you can further adjust the cabinet's mic placement to capture the right amount of low end, midrange punch, and high-end clarity. The mic module adds another layer of flexibility, letting you experiment with mic types, placement, and distance from the speaker, whether you're going for the tight, focused sound of a dynamic mic or the more open, atmospheric feel of a condenser or ribbon mic.

  One of the standout features of HoRNet Guitar Kit is its low latency and real-time performance capabilities. The plugin delivers real-time processing without noticeable delay, even when using the high-quality mode, which oversamples the processing up to 8x, making it suitable for both studio and live use. It includes twelve factory presets that showcase its versatility, covering a wide range of iconic guitar sounds from classic clean tones to heavy, high-gain distortion, and these can be loaded directly from the DAW's preset browser (for VST and AU hosts only).

  The HoRNet Guitar Kit has no copy protection.
specs: |-
  - Each module can be turned on or off individually
  - Amplifier simulation made by three tube stages (high gain, preamp, power amp)
  - Tubes can be chosen between 6 different models for preamp and 6 models for power amp
  - Tone stack section can be chosen between three models or turned off
  - Amp module can work in standard (4x oversampling) or high quality mode (8x oversampling)
  - Cabinet can be chosen between open or closed
  - Speaker model can be chosen between 4 different models
  - Cabinet resonance is modeled on the specific speaker chosen
  - Microphone model can be chosen between 4 different models
  - Microphone distance from speaker can be freely adjusted
  - Microphone position on the speaker axis can be freely adjusted
  - Frequency response based on microphone position and type is faithfully modeled
  - Twelve factory presets
  - Mac OS X (>=10.7) and Windows support
  - 64-bit compatibility both on Mac and Windows
  - App, Audio Units, VST, VST3, RTAS and AAX format
  - Apple Silicon native support (except for AAX)
  - No copy protection
