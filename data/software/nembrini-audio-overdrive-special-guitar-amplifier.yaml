description: "The Nembrini Audio Overdrive Special is a plugin modeled on the legendary Overdrive Special By Dumble (schematic #124), the true pioneer of boutique amplifiers. It features a two-channel design where the clean and overdrive channels cascade together to produce rich harmonic distortion."
details:
  - "The Overdrive Special Guitar Amplifier plugin is a meticulous circuit emulation of the Overdrive Special By Dumble (schematic #124), one of the most revered and elusive boutique amplifiers ever built. Nembrini Audio developed this model using their proprietary modeling techniques to capture the nuanced tonal character and dynamic response of the original hardware."
  - The plugin features a two-channel architecture — a clean channel and an overdrive channel — that work together through cascading gain stages. When the overdrive channel engages, it draws from the clean channel's signal path, producing harmonic distortion that evolves organically with pick attack and playing dynamics. Separate LEVEL and RATIO gain controls allow players to dial in the precise interaction between channels.
  - Cab simulation is handled via six selectable guitar cabinet models, each paired with four microphone emulations. Microphone placement can be adjusted on and off axis with continuous position and distance knobs, and a full mixer section with solo, mute, pan, and fader controls lets users blend microphones and room ambience freely.
  - An integrated Impulse Response Loader supports loading up to three third-party IR files simultaneously, each with independent volume, pan, phase, solo, and mute controls and a browser window for searching IR libraries on disk.
  - Additional processing includes a noise gate and a dedicated cleaner circuit designed to reduce low-frequency rumble and high-frequency harshness, ensuring a clean signal path even with high-gain settings.
specs: |-
  - Two-channel design: clean channel + overdrive channel with cascading gain stages
  - 3-band equalizer with shared volume control
  - LEVEL and RATIO gain controls for harmonic interaction
  - Six guitar cabinet simulations
  - Four microphone emulations with on/off-axis positioning
  - Continuous microphone position and distance adjustment
  - Mixer section: solo, mute, pan, and fader per microphone plus ambience
  - Impulse Response Loader: up to three third-party IRs with volume, pan, phase, solo, and mute
  - IR browser window for on-disk IR file search
  - Noise gate included
  - Cleaner circuit for rumble and harshness reduction
  - Supported formats: VST2, VST3, AAX, AudioUnits (AU)
  - macOS 10.13 or newer (Intel and Apple Silicon)
  - Windows 7 or newer (64-bit)
  - iOS (iPhone and iPad via Apple App Store)
  - 64-bit DAW required
  - Minimum 1 GB RAM
