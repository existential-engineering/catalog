details: |-
  Nembrini Audio Overdrive Special Guitar Amplifier plugin is based on a Overdrive Special By Dumble* schematic #124. Nembrini Audio Overdrive Special s a two channel amplifier, which includes a clean channel and an “overdrive”channel. The overdrive channel is described as “cascading” from the first channel into, at least, one additional gain stage in the overdrive channel. This means that the clean channel’s tone stack and gain stages will “cascade” into the gain stage of the overdrive channel, causing the clean channel to become “overdriven".
