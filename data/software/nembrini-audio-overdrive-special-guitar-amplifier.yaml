details: |-
  Nembrini Audio Overdrive Special Guitar Amplifier plugin is based on an Overdrive Special By Dumble schematic #124, the true pioneer of boutique amplifiers.

  Nembrini Audio Overdrive Special is a two channel amplifier, which includes a clean channel and an overdrive channel. The overdrive channel is described as cascading from the first channel into at least one additional gain stage in the overdrive channel, so the clean channel's tone stack and gain stages cascade into the gain stage of the overdrive channel, causing the clean channel to become overdriven.

  Nembrini Audio Overdrive Special features a 3-band equalizer and one volume control for both channels, but each channel has its own gain control. The gain controls LEVEL and RATIO interact when the overdrive channel is engaged to allow a harmonic change in gain.

  With Nembrini Audio Overdrive Special Guitar Amplifier it is possible to choose between six different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs. A complete Mixer section with Solos, Mutes, Pans and Faders allows you to blend together the two microphones with the ambience.

  Impulse Loader lets you load up to three third-party impulse responses that you can even blend together using volume, pan, phase, solo and mute controls. A useful browser window has been added so you can easily search through all your third-party IR files.
specs: |-
  - Two channel amplifier: clean channel and cascading overdrive channel
  - 3-band equalizer and one volume control shared by both channels
  - Independent gain control per channel, with interacting LEVEL and RATIO controls on the overdrive channel
  - Cabinets: six different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs
  - Mixer section with Solos, Mutes, Pans and Faders to blend the two microphones with the ambience
  - Impulse Response Loader: up to three third-party impulse responses blendable with volume, pan, phase, solo and mute controls, with a browser window for searching IR files
  - Cleaner/Noise Gate: noise gate section plus a Cleaner circuit to reduce rumbling and harshness
  - Plugin Formats: a VST2, VST3, AAX or AudioUnits compatible host
  - System: an Intel compatible or Apple Silicon CPU, 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
