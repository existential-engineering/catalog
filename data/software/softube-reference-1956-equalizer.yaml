description: Broad strokes, big tone.
details: |-
  The low-end trick is a classic, but it's not the only trick that has kept this type of passive EQ popular 70 years on. The minimum-phase passive design and extreme musicality make them great for broad strokes and big tones. Cuts and boosts are carried out with resistors, capacitors, and chokes, as opposed to op-amps or transistors. Just pure passive electronics and a beautiful tube amp stage on the output.

  Softube's plug-in version is based on modern hardware that adds stereo functionality and more frequency selections while staying true to the nature of the original design. Softube added Headroom control within the Extended Features panel, to exaggerate the thick low-end character of the transformers, plus built-in Mid/Side functionality, and separate gain controls for the two channels.

  The passive circuit design of this equalizer makes it exceptionally musical, natural sounding, and some say, magical. The magic is kept intact by maintaining the true nature of the original design. Reference 1956 Equalizer gives you the legendary sound, plus modern features like Mid/Side functionality and separate gain controls.

  Want the full experience of the Reference 1956 Equalizer plus visualizations of its unique curves, up to 20 bands of modern curves, frequency content, dynamic EQ features, and more? You can load Reference 1956 Equalizer into the second slot of the Equalizers plug-in to create a one-of-a-kind EQ environment. The result is equalizing that's both corrective and vibey in an ultra-fast workflow.

  The Tube-Tech PE 1C (available in Softube's Tube-Tech Equalizers Mk II set, alongside the Tube-Tech ME 1B) is made to sound like a brand-new, perfectly tuned Pultec EQ with everything to spec and very little distortion as a result. Reference 1956 Equalizer is on the opposite side of the spectrum. It's designed to give more distortion, and some parts are deliberately degraded to deliver that distortion.
specs: |-
  - Authentically captured, classic passive equalizing
  - A modern, musical minimum-phase passive EQ
  - Stereo functionality
  - Additional frequency selections
  - Headroom control
  - Mid/Side functionality
  - Separate gain controls for each channel
  - Compatible with Equalizers
  - Console 1 Ready
  - Supports Softube Extended Features panel
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26; Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Internet access required for downloading installers and managing licenses
  - Three activations included
