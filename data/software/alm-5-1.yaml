details: |-
  Alm 5.1 is designed as a key component in your mixing workflow. Based on the new itu, ebu and atsc loudness standards, the plugin offers you full loudness and true peak metering for mono, stereo and 5.1 channel formats featuring measurements for momentary, short term and integrated loudness, with loudness range and max true peak level.

  Full compliance with loudness standards: bs-1770 (rev.3), ebu r128 and atsc a/85 specifications. Complete loudness measurements using universal descriptors: integrated loudness (program loudness), momentary loudness, short time loudness, loudness range.

  Real-time metering for momentary loudness, short term loudness and loudness range. True peak level metering with peak hold. Max true peak level (calculated using inter-sample peaks that can be missed in quantization).

  Correct measurements for all the usual sample rates: 44.1 khz, 48 khz and their multiples. Low cpu usage due to plugin optimization.
