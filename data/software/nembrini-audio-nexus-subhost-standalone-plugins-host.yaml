description: Nexus is a plugin host and standalone application that loads VST, VST3, and AU format plugins, enabling complex audio signal routing and processing outside of or within a DAW. It features a canvas-based interface for designing signal paths with built-in modules for splitting, mixing, and crossover routing.
details:
  - Nexus functions as a subhost plugin and standalone application, capable of loading and running VST, VST3, and AU format third-party plugins. This allows producers and engineers to use their existing plugin collection in flexible audio signal chain configurations that go beyond standard DAW routing.
  - The canvas interface provides a visual environment for designing audio signal paths. Built-in modules include signal splitters, mixers, and crossovers, enabling complex parallel and serial routing configurations that can be saved as presets.
  - The Scenes feature lets users define up to 8 distinct plugin states and connection configurations within a single preset. Scenes can be switched manually or via MIDI, making Nexus suitable for live performance as well as studio work.
  - All parameters of loaded plugins are fully automatable within a DAW host, and the entire instrument responds to MIDI control surfaces. When used as a standalone application, Nexus operates independently of any DAW.
  - Nexus is compatible with macOS 10.13 or newer and Windows 7 or newer, supporting both Intel and Apple Silicon processors. It requires a 64-bit DAW host when used in plugin mode and a minimum of 1GB RAM.
specs: |-
  - Supported plugin formats (hosted): VST, VST3, AU
  - Plugin formats (Nexus itself): VST2, VST3, AAX, AudioUnits (AU)
  - Standalone application included
  - macOS 10.13 or newer
  - Windows 7 or newer
  - Intel or Apple Silicon CPU
  - 1GB RAM minimum
  - 64-bit DAW required for plugin mode
  - Up to 8 Scenes per preset
  - Full MIDI control and DAW automation support
  - Current version: 1.1.8
