details: |-
  Nexus is an audio processing tool that offers high-quality sound manipulation capabilities in both standalone and plugin formats.

  As a subhost, Nexus is a plugin that hosts other plugins in VST, VST3, and AU format. It is fully capable of recognizing and loading third-party plugins, expanding the user's creative palette with a wide range of external audio processing tools.

  Nexus operates not only as a plugin within a DAW but also as a standalone application. The parameters of all loaded plugins are fully automatable within your DAW and can be adjusted using a MIDI control surface.

  Nexus is equipped with a variety of built-in plugins, offering a robust selection of tools for immediate use in audio production.

  The SCENES feature allows you to switch between 8 different plugin states and connections within a preset. Change scenes manually or via MIDI for quick adaptation during live shows or studio sessions.
specs: |-
  - Subhost: hosts other plugins in VST, VST3 and AU format
  - Third-party plugin support, recognizing and loading external audio processing tools
  - Operates as a plugin inside a DAW and as a standalone application
  - Parameters of all loaded plugins are fully automatable in the DAW and adjustable from a MIDI control surface
  - Variety of built-in plugins included
  - Scenes: switch between 8 different plugin states and connections within a preset, manually or via MIDI
  - Plugin Formats: a VST2, VST3, AAX or AudioUnits compatible host
  - System: an Intel compatible or Apple Silicon CPU, 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
