description: UNMASK is a psychoacoustically informed dynamic EQ. It continuously analyzes your signal and applies real-time corrections to reveal detail, improve tonal balance, and enhance clarity.
details: |-
  UNMASK is a psychoacoustically informed dynamic EQ. It continuously analyzes the signal and applies real-time corrections to reveal detail, improve tonal balance and enhance clarity. It operates across three perceptual dimensions, spectral, tonal and temporal, each handled by a dedicated module with a single Depth control.

  SPEC works in the frequency domain. Every signal contains more spectral detail than is actually heard, much of it masked by dominant neighboring frequencies. SPEC detects both the hidden detail and the peaks that obscure it, then lifts what is buried while pulling back the excess, continuously and dynamically, for a cleaner and more defined result.

  TILT and REF shape the spectral envelope. Human hearing prefers a smooth, gently sloping spectral contour similar to pink or brown noise, and a frequency balance that deviates from it sounds fatiguing. UNMASK analyzes the spectral envelope in real time and guides it toward one of two targets: TILT shapes toward a theoretically ideal slope of -3, -4.5 or -6 dB per octave, while REF, new in v1.1, shapes toward a data-driven contour derived from finished, well-balanced material.

  TIME works in the time domain. A strong transient, a drum hit, a pick attack or a consonant, often masks the quieter sound that follows and makes it inaudible. TIME detects these post-transient shadows across the entire spectrum and dynamically recovers them, returning the body after the snare crack and the sustain behind the pick. EXT Glue takes a different approach to sidechain processing: rather than ducking or compressing, it analyzes the mutual masking between two signals and resolves the psychoacoustic conflicts between them, so a vocal routed against an instrumental sidechain shares the same spectral space, envelope shape and temporal dynamics.

  Precision controls set independent upper and lower gain limits per module or globally, define the processing frequency range independently of the detection range, and scale processing intensity across the spectrum with a Priority Curve. Monitor modes solo each module's boost, cut or combined delta. By default UNMASK uses linear-phase filters, with a Zero Latency Mode offering minimum-phase filters and zero samples of delay, and routing covers LR, MS, Mid-only, Side-only, M2S and S2M channel modes with a Link control and a Dry Mix blend.
specs: |-
  - Three modules, each with a single Depth control: SPEC (spectral), TILT/REF (tonal), TIME (temporal)
  - SPEC: frequency-domain unmasking that lifts masked detail and pulls back masking peaks
  - TILT: spectral envelope shaping toward a -3, -4.5 or -6 dB/oct slope
  - REF: spectral target derived from real-world reference material (new in v1.1)
  - TIME: recovery of post-transient masked content across the spectrum
  - EXT Glue: psychoacoustic fusion resolving mutual masking between two signals
  - Gain Range with independent upper and lower limits, per module or globally
  - Processing frequency range independent of the detection range
  - Priority Curve to scale processing intensity across the spectrum
  - Monitor modes: solo each module's boost, cut or combined delta
  - Master controls: Scale, Smooth, Attack, Release, Gain Range, Processing Frequency Range, Priority Curve
  - View selector switching between MASTER, SPEC, TILT and TIME displays
  - Linear-phase filters by default. Zero Latency Mode with minimum-phase filters and zero samples of delay
  - Channel modes: LR, MS, Mid-only, Side-only, M2S, S2M, with a Link control
  - Dry Mix for parallel processing without extra bus routing
  - Global delta scale, global time adjustment, global mix control
  - Oversampling
  - Real-time spectrum analyzer, sidechain monitoring, external sidechain support
  - Preset library
  - Undo/Redo, A/B switching, user-defined default settings, customizable behavior settings
  - Theme and skin support, Retina / high-DPI support
  - Extreme CPU optimization, GPU-accelerated graphics, native Apple Silicon support
  - Minimum system requirements: Intel or AMD CPU with SSE 4.1 instruction set, or Apple Silicon
  - macOS 10.15 / Windows 8
  - 4 GB RAM and 250 MB disk space
  - 64-bit VST2, VST3, AAX and Audio Unit
  - Free demo: no time limit, no registration required, saving and loading disabled, 1.5 seconds of silence every 15 minutes, 'Demo' shown on the UI
