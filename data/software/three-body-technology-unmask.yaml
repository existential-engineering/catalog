description: UNMASK is a psychoacoustically informed dynamic EQ. It continuously
  analyzes your signal and applies real-time corrections to reveal detail,
  improve tonal balance, and enhance clarity.
details: |-
  SPEC module detects masked spectral detail and dominant frequency peaks, lifting buried content while reducing excess energy for a clearer mix.

  TILT module shapes the overall frequency balance toward target spectral slopes (-3, -4.5, or -6 dB/octave) for natural-sounding tonality.

  TIME module recovers post-transient details masked by strong attacks across the full spectrum, restoring dynamics and definition.

  EXT Glue psychoacoustic sidechain resolves masking conflicts between two signals, letting UNMASK analyze a reference track and apply corrections to the target.

  Supports both zero-latency minimum-phase and linear-phase filter modes, with channel processing options: LR, MS, Mid-only, Side-only, M2S, and S2M.
