description: TAL-Vocoder is a vintage-style vocoder with 11 bands that produces the sound of vocoders from the early 80's. It mixes analog-modeled components with digital algorithms and includes a synth with a VCO to create carrier signals.
details: |-
  TAL-Vocoder is a vintage-style vocoder with 11 bands that produces the sound of vocoders from the early 80's. Togu Audio Line describes it as mixing analog-modeled components and usability with digital algorithms to create an outstanding vocoder sound. It is listed under the FREE Plug-Ins section of the TAL product catalogue.

  The plugin has included a synth with a VCO (Voltage Controlled Oscillator) to create classic analog waveforms, which can produce carrier signals with a lot of overtones. Flexible sidechain routing possibilities also allow feeding external carrier signals into the plugin, and the 3.0.0 release added carrier and modulator volume controls with a meter.

  The plug-in ships in VST, VST3, AU, AAX and CLAP formats, with installers offered for Windows, macOS and Linux. The Linux build is distributed as a 64-bit package covering VST2 and VST3. A user manual PDF is published alongside the installers.

  System requirements given by TAL are Windows 7 or higher with a 64-bit host, macOS 10.9 or higher with a 64-bit host, and 64-bit Linux on Ubuntu 18 or similar. The macOS build is a Universal Binary 2 with native Intel and Apple silicon support (M1, M2, M3 and later). AAX use requires Pro Tools 10.3.6 or higher in 64-bit.

  The download block names version 3.0.4 as current. The changelog's most recent dated entry is 3.0.3 of 16.08.2023, which added a new preset browser, following 3.0.2 and 3.0.1 bug-fix releases and the 3.0.0 rewrite of 24.04.2023 that brought the scalable UI, the file preset browser, the sidechain routing and a documented break in backward compatibility for the old L and R input mode routing. Earlier releases added AAX native M1 support with a JUCE 7 update (2.2.1), native Apple M1 support with a Windows VST3 installer and Linux VST3 support (2.2.0), and further back sidechain input, pitch wheel support and AAX Pro Tools support. Legacy downloads remain available for versions 2.2.1, 2.0.0 (including 32-bit support) and 1.0.0.
specs: |-
  - Vintage-style vocoder with 11 bands, modelled on vocoders from the early 80's
  - Analog-modeled components combined with digital algorithms
  - Built-in synth with a VCO (Voltage Controlled Oscillator) producing classic analog waveforms for carrier signals rich in overtones
  - Flexible sidechain routing for feeding external carrier signals to the plugin
  - Carrier and modulator volume controls with a meter
  - Scalable UI with file preset browser
  - Pitch wheel support
  - Formats: VST, VST3, AU, AAX, CLAP
  - Windows: Windows 7 or higher (64 bit host)
  - macOS: 10.9 or higher (64 bit host), Universal Binary 2 with native Intel and Apple silicon support (M1, M2, M3...)
  - Linux: 64 bit, Ubuntu 18 or similar (x64 VST2 and VST3)
  - AAX: Pro Tools 10.3.6 or higher (64 bit)
  - User manual PDF provided
  - Legacy downloads available: versions 2.2.1, 2.0.0 (with 32-bit support) and 1.0.0
