description: "TAL-Vocoder is a vintage-style vocoder with 11 bands that produces
  the sound of vocoders from the early 80's. Mixes analog-modeled components
  with digital algorithms. Includes a built-in synth with a VCO (Voltage
  Controlled Oscillator) to create classic analog waveforms as carrier signals.
  Flexible sidechain routing allows feeding external carrier signals."
