description: HoRNet Sleek is an innovative automatic resonance suppressor that revolutionizes the way you sculpt and refine your sound.
details: |-
  HoRNet Sleek is an automatic resonance suppressor designed to bring clarity and precision to a mix. It detects and suppresses critical resonances so that every element of the audio stays clear and defined.

  At the heart of Sleek lies its automatic resonance suppression technology, which identifies and attenuates problematic frequencies in real time, addressing harsh overtones, boomy bass lines and muddied midrange.

  Sleek also carries a built-in preprocess equalizer featuring four independently tweakable bands, used to emphasize critical frequencies and tailor the sonic character of a track. An intuitive graphical display shows the audio spectrum, spectral windows can be set precisely, the Sleek Factor adjusts the intensity of the processing, and the filtering stage offers deep control over the number of filters, Q, attack and release.

  Factory and custom presets, light and dark mode support, and a vector-based user interface optimized for sharp visualization at any resolution round out the plugin, which runs on macOS and Windows in Audio Units, VST3 and AAX formats.
specs: |-
  - Resonance suppressor to attenuate or suppress unwanted resonance
  - Automatically detects any critical resonance in your tracks
  - Preprocess equalizer for emphasizing the critical frequencies
  - Graphical visualization of the audio spectrum and applied preprocess equalization
  - The preprocess equalizer offers 4 independently tweakable bands
  - Lower and upper limits for setting the spectral window within which Sleek operates
  - Sleek Factor for adjusting the plugin's response
  - Deep control on the filtering stage (number of filters, Q, attack and release)
  - Gain reduction for controlling the amount of gain applied to reduce the unwanted resonance
  - Delta mode to only listen to the part of the signal which is being removed
  - Load and save for factory or custom presets
  - Light and dark mode supported
  - Vector user interface for a sharp visualization at any resolution
  - Apple Silicon native support
  - macOS (10.13 and later) and Windows (Windows 10 and later) support
  - 64-bit on Mac and Windows
  - Audio Units, VST3 and AAX format
  - No copy protection
