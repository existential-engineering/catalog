  - Overdub tracks
  - Session save and export
  - Wave file export
  - Mixdown export
  - Audio import (wav, mp3, aiff, m4a)
  - Audiobus compatible
  - Ableton link sync
  - USB audio interface compatible
  - iOS compatible
  - Premium app (no in-app purchases, ads, or subscriptions)
