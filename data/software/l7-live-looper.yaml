details: |-
  Audiokit L7 Live Looper is the new live looper from audiokit and coda labs.
  With up to 16 tracks and 8 effects per track it's an incredibly powerful
  looper for iOS. L7 packs dozens of features previously only found in
  professional hardware loopers into a sleek, easy to use package with virtually
  unlimited creative potential.

  L7's killer features include "voicetune" (inspired by auto-tune) and the
  ability to apply eight different effects to each audio track individually. You
  can turn every-day sounds like humming, whistling, and finger tapping into
  dreamy musical motifs that sound like they were recorded in a professional
  studio.

  L7 includes master effects & input effects, pan, reverb, tremolo, tempo delay,
  pitch shift (12 semitones), comb filter, high pass filter, and low pass
  filter. Voicetune features 144 different scales with control amount & speed,
  and can automatically trigger effect changes hands-free.

  Save sessions and export wave files and mixdowns to use in your favorite DAW.
  Import audio from any file format (wav, mp3, aiff, m4a, etc.). Audiobus
  compatible and sync with other apps using ableton link. Works with most USB
  audio interfaces.

  L7 is a premium app, which means that once you've bought it, it's entirely
  yours. There are no in-app purchases, ads, or subscriptions.
specs: |-
  - 16 tracks
