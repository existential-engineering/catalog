description: Free clipper plugin with mastering-grade oversampling. Transparent peak clipping from the makers of KClip 3. VST, AU and AAX on Mac, VST and AAX on Windows, VST3, VST2 and LV2 on Linux.
details: |-
  KClip Zero is a 100% free clipper plugin from Kazrog, billed on its product page as "Mastering-grade clipping. Lightning-fast workflow." It includes the same revolutionary clipping algorithm as its paid sibling KClip 3, along with variable control and oversampling up to 16x.

  The plugin is positioned for transparent competitive loudness, cleanly saturating transient peaks while leaving the signal underneath completely unchanged, or changed as much or as little as desired. Kazrog also frames it as a transient control tool: taming harsh digital peaks so tracks sit better in the mix with less processing.

  Feature highlights called out on the page are the clipping algorithm packed inside a foolproof interface, mastering-grade oversampling (2x online and 16x offline), an all-new visualizer that shows clipping amount in real time, and a resizable window whose visualizer and metering expand to fit the chosen window size.

  A comparison table on the page separates KClip Zero from the paid KClip 3. KClip 3 has adjustable oversampling from 2x to 32x, eight clipping modes, multiband processing, mid/side processing, LUFS metering, a delta function, variable soft clipping, and A/B compare. KClip Zero has fixed oversampling (2x online, 16x offline), a single clipping mode, and the resizable window, and it omits the rest.

  Like every Kazrog plugin, it carries a 100% perpetual license for immediate use on multiple devices, requires no iLok authorization, and involves zero subscription fees. Distribution and updates run through the free Kazrog Plugin Manager app, available for macOS, Windows, and Linux.
specs: |-
  - Same clipping algorithm as KClip 3, in a streamlined interface
  - Mastering-grade oversampling: fixed 2x online, 16x offline
  - Single clipping mode (KClip 3 offers eight)
  - Real-time visualizer showing clipping amount
  - Resizable window; visualizer and metering expand to fit
  - Transparent loudness by saturating transient peaks, leaving the signal underneath unchanged
  - No multiband, mid/side, LUFS metering, delta function, variable soft clipping, or A/B compare (KClip 3 only)
  - 100% free download
  - Mac: macOS 10.13 or later; Universal Binary 2 (Apple Silicon and Intel)
  - Windows: Windows 10 or 11, 64-bit
  - Linux: VST3, VST2 or LV2 compatible host; 64-bit desktop distro
  - Pro Tools 12 or higher required for the AAX version
  - 100% perpetual license for multiple devices; no iLok authorization required; zero subscription fees
  - Installed and updated via the free Kazrog Plugin Manager (macOS, Windows, Linux)
