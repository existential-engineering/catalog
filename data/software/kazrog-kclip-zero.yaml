description: Free mastering-grade clipping plugin featuring the same revolutionary clipping algorithm as KClip 3, with variable soft clipping control and up to 16x oversampling.
details: |-
  KClip Zero provides transparent competitive loudness by cleanly saturating transient peaks while leaving the signal underneath unchanged. It features the same core clipping algorithm as KClip 3 in a free, single-mode package.

  The plugin includes a real-time clipping visualizer, resizable window with expandable metering, and ultra-low CPU impact. Oversampling is available up to 2x online and 16x offline.

  KClip Zero is free to use with no iLok, dongle, or subscription required. It ships as a perpetual license covering multiple devices.
specs: |-
  - Same core clipping algorithm as KClip 3
  - Variable soft clipping control
  - Oversampling: 2x online, 16x offline
  - Real-time clipping visualizer
  - Resizable window with expandable metering
  - macOS 10.13+; Universal Binary 2 (Apple Silicon & Intel)
  - Windows 10+
  - Linux: VST3, VST2, LV2 compatible hosts
  - AAX requires Pro Tools 12+
  - Free; perpetual license; no iLok, no subscription
