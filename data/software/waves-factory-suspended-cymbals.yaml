description: Sample instrument that features 5 crash cymbals sampled with 5 articulation including sustains, bell, edge, mod-wheel controlled rolls and effects.
details: |-
  Zildjian, Paiste and Istanbul cymbals recorded in a dry studio environment. 3 microphone positions: close, mid and far. Multiple articulations played with drum sticks: bell, side, normal hit, effects and mod-wheel controlled cymbal rolls.

  Use the mod-wheel to control the intensity of the rolls, resulting in a perfectly smoothed cymbal performance. No more time-fixed rolls that don't match your track, with Suspended Cymbals you can play them in any way you want. Playing a single key and using the mod-wheel of your MIDI keyboard you can control the dynamics of the cymbal rolls.

  In the Main interface you can see the 5 cymbals: 3 Zildjian, 1 Paiste and 1 Istanbul. Each one of these cymbals will give you a different tonal character to choose whichever better suits your track, or why not using them all together?

  Suspended Cymbals features a full mixer with which you can control the three mic positions separately. With a load/purge switch for each channel, pan, width, volume, mute, solo, phase shift and output selector for mixing the different channels in your DAW.

  In the effects page you can add any effect you want in any order, including EQ, compressors, modulation effects, distortion, saturation, tape machine, reverbs, amp simulators and more. From the settings page you can control round robin, dynamic range, velocity curve of the incoming MIDI velocities and envelope, the volume of each articulation separately, and how many voices can play at a time in order to save CPU cycles.
specs: |-
  - 5 crash cymbals: 3 Zildjian (Custom, Avedis, Dark), 1 Paiste (Masters), 1 Istanbul (Mehmet)
  - 5 articulations: sustains (normal hit), bell, edge/side, effects and mod-wheel controlled rolls
  - 957 samples
  - 4 velocity layers
  - 4 round robin
  - 3 microphone positions: close, mid and far
  - Library size: 1.75 GB
  - Full mixer with load/purge per channel, pan, width, volume, mute, solo, phase shift and output selector
  - Effects page with EQ, compressors, modulation, distortion, saturation, tape machine, reverbs and amp simulators
  - Settings page for round robin, dynamic range, velocity curve, envelope, per-articulation volume and voice count
  - Requires Kontakt 5.7.3 or newer, full version of Kontakt required (Kontakt Player runs in demo mode)
