details: >-
  Analog-digital endorphin by js-synthese is a virtual instrument and a virtual
  effect audio plugin for windows. It functions as a VST plugin.


  Features 3 virtual analogue and 3 digital oscillators each with 14 voices
  (digital 6 voices), 5 waveforms, adsr (volume) and 12 db filter (hipass,
  lopass, bandpass) with keytracking.


  Includes the wave-shapes of access virus, waldorf wave und ensoniq sq80. You
  can import wave-shapes from wav files and 8 bit bmp files. You can draw your
  own wave-shapes in the softsynth or in the endorphin wave-editor.


  3 lfos, 6 adsr envelopes, 2 arpeggiators, 28 drumsets (over 1200 samples).


  7 filter types: 12, 24, 36 db lopass, morphing filter 12db lopass to 12 db
  hipass, moog filter, 12 db hipass, 12 db bandpass. 7 band vocoder (only fx)
  and some effects (reverb, 10 band eq, stereo delay, distortion, compressor,
  downsampling, flanger, phaser).
