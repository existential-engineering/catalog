description: Spin It Again is audio recording and digitizing software by
  Acoustica that lets you convert vinyl LPs and cassette tapes to digital
  formats such as MP3, OGG, WAV, and WMA for playback on computers and portable
  devices.
specs: |-
  - Record from Line In or Analog Mix sources
  - Hookup Wizard for equipment setup
  - Recording Level Wizard for input configuration
  - Automatic silence detection and track splitting
  - Manual track marker adjustment
  - Metadata tagging (artist, album, genre, track name)
  - Export formats: MP3, OGG, WAV, WMA
  - Configurable export bit rate
  - Tape Noise BeGone noise reduction effect
  - ASIO mode support for improved sync
  - Multi-soundcard device selection
  - Direct export to connected MP3 players
