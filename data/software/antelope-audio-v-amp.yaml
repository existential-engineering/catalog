details: |-
  V-AMP is a high-fidelity preamp and cabinet emulation powerhouse designed to bring the legendary warmth of tube circuitry directly to your DAW. The plugin is a precision-engineered journey through the heart of a common-cathode tube stage.

  From subtle 'crunch' to full-throttle overdrive and bass boost, V-AMP offers the technical depth to satisfy your inner gearhead while remaining intuitive enough to let your creativity run wild.

  A Cabinet Convolution engine uses circular convolution to recreate the response of five industry-standard cabinet models — the Sherrif 800 (4x12), Orange Grit (4x12), Tender Twin (2x12), Amaze G52 (1x12), and Voice 5 Teen (1x12) — each measured with various microphones and selectable at the click of a button.

  Finalize your signature sound with a curated selection of virtual microphones, including the Vienna 112 (heavy low-end), Illinois 57 (classic mid-range workhorse), Sydney 4 L/R (wide stereo or focused mono condenser), Sydney 1A (large-diaphragm condenser), and S906 (front-address dynamic).

  Signal flow starts with a 10 Hz high-pass filter to clean up sub-harmonics, followed by tube-response modeling, oversampling and non-linear processing through static curves to emulate real tube valve distortion, plus DC-removing high-pass and anti-aliasing filters to keep high-gain tones clear. Controls include Drive, Crunch, a three-band Tone Stack, Presence, a Bass Boost switch (up to +6 dB low-frequency content), Master Volume, and dedicated IN and OUT gain stages. Runs natively in your DAW on macOS or Windows.
specs: |-
  - Common-cathode tube stage emulation
  - Cabinet Convolution engine using circular convolution
  - 5 cabinet models: Sherrif 800 (4x12), Orange Grit (4x12), Tender Twin (2x12), Amaze G52 (1x12), Voice 5 Teen (1x12)
  - 6 virtual microphone options: Vienna 112, Illinois 57, Sydney 4 L, Sydney 4 R, Sydney 1A, S906
  - 10 Hz high-pass filter for sub-harmonic removal
  - Tube frequency response modeling filter
  - Oversampling and non-linear processing through static curves
  - DC-removing high-pass and anti-aliasing filters
  - Drive control for harmonic distortion
  - Crunch control
  - Three-band Tone Stack (lows, mids, trebles)
  - Presence control for high-frequency bite
  - Bass Boost switch (up to +6 dB low-frequency content)
  - Master Volume
  - IN and OUT gain stages
  - Runs natively in your DAW on macOS or Windows
