description: >-
  Zebra2 is a modular wireframe synthesizer by u-he combining subtractive,
  additive, FM, and wavetable synthesis in a flexible semi-modular
  architecture. Known for its rich sound quality and deep sound design
  capabilities, it has been widely used in film scoring and electronic music.
details: |-
  Zebra2 is a semi-modular synthesizer that provides a unique combination
  of synthesis methods within a flexible routing architecture. Rather than
  committing to one synthesis type, Zebra2 allows oscillators, filters,
  effects, and modulators to be freely patched together.

  The oscillator section offers multiple modes including classic waveforms,
  spectral (additive) editing, FM synthesis, and wavetable playback. The
  spectral editor allows harmonic-level control for additive synthesis,
  while GeoMorph provides morphing between oscillator states.

  The filter section includes a variety of analog-modeled filter types
  with saturation characteristics. Comb filters enable physical modeling
  and resonant effects. Filters can be placed anywhere in the signal
  chain and combined in series or parallel.

  Modulation is handled through a comprehensive system of LFOs, envelopes
  (MSEG-style with visual curve editing), modulators, and a modulation
  matrix. The XY pad provides real-time performance control over multiple
  parameters simultaneously.

  Zebra2 has earned a strong reputation in film scoring — Hans Zimmer and
  other composers have used it extensively. Its combination of versatility,
  sound quality, and CPU efficiency has kept it relevant for over a decade.
specs: |-
  - Semi-modular synthesis architecture
  - Subtractive, additive, FM, and wavetable synthesis
  - 4 oscillators with multiple modes
  - Spectral (additive) harmonic editor
  - GeoMorph wavetable morphing
  - Multiple analog-modeled filter types
  - Comb filter for physical modeling
  - Flexible signal routing (series, parallel, feedback)
  - MSEG-style envelope editor
  - 4 LFOs with multiple waveforms
  - XY performance pad
  - Modulation matrix
  - Built-in effects (reverb, delay, chorus, EQ, distortion)
  - Preset browser with categories
  - Low CPU usage
