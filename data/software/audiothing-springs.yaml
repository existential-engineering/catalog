description: Springs is a plugin (VST, VST3, AU, AAX) featuring a collection of
  vintage spring reverbs paired with an authentic Baxandall EQ emulation.
details: |-
  Springs is a plugin that features a collection of vintage spring reverbs paired with an authentic Baxandall EQ emulation. Springs features emulations from 19 types of spring reverbs, ranging from a long 6-spring pipe to a tiny battery-powered single-spring unit. AudioThing used a combination of convolution and modelling to recreate the vintage character of each reverb.

  Spring reverbs were usually paired with tone stacks from guitar amplifiers. Springs features one of the most iconic and unique sounding tone stack equalizers: the Baxandall EQ. A classic Baxandall tone stack usually features just the bass and treble bands, but Springs also adds a Mid band (with control over the Q). One important characteristic of the Baxandall EQ is that the bands interact with each other, which may seem like an unwanted behavior, but it's one of the reasons why the Baxandall EQ curves are smooth and musical.

  By clicking on the wrench tool button you can open the editor window. Springs uses a combination of convolution and modeling to recreate each spring reverb, and with the editor you can edit the impulse response of the reverb directly. This can be useful to fine-tune the size/decay of the reverb, but can also be used to completely mangle the source.

  While with the Baxandall EQ you can shape the sound of the mix (dry+wet) or just the wet signal, with the Bandwidth control you can filter the input signal that goes into the spring emulation. Some springs have a boomy low end, some are too bright and boingy, and by limiting the bandwidth of the signal you can dampen these characteristics.

  A spring reverb is an electromechanical device that uses transducers/pickups with steel springs in order to simulate the reflections of a reverb. The input signal is passed through a transducer to one or multiple springs, the vibrations are then captured by an output transducer on the opposite side. Springs is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP), and on the App Store for iOS and iPadOS (AUv3 and Standalone).
specs: |-
  - 19 Vintage Spring Reverbs
  - Baxandall EQ (three bands)
  - 80 Presets
  - Resizable Window
  - Brightness and Contrast Controls
  - Preset system with randomizer
  - Impulse response editor
  - Bandwidth control on the input to the spring emulation
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP 64-bit)
  - macOS 10.13 - macOS 26, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP 64-bit)
  - 1 license up to 3 computers, no iLok, online or offline authorization
