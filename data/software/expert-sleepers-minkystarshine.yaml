description: Minky Starshine is at heart an additive synthesiser, augmented with
  possibilities for subtractive synthesis and pulse width modulation. Its
  waveform is built by summing 16 independently controllable partials, which can
  be grouped and animated by envelopes and LFOs.
details: |-
  Minky Starshine is at heart an additive synthesiser, augmented with possibilities for subtractive synthesis (filtering) and pulse width modulation.

  A waveform is created by summing 16 independently controllable partials. By setting the relative levels of the partials appropriately, familiar waveforms such as sawtooth and squarewave can be created, as well as an infinite range of timbres in between.

  As well as setting the levels of the partials, they can be flexibly assigned to three groups. Each group has a very flexible envelope generator and an LFO, so the balance of the partials, and therefore the timbre of the sound, can change over time. The LFOs have a wide frequency range and can also be used as ring modulators.

  The waveform as a whole can have its pulsewidth controlled, with an envelope and an LFO provided as well as control by note velocity. A resonant filter is available, capable of lowpass, bandpass and highpass and a continuous range in between, again with control by envelope, LFO and note velocity.

  A flexible modulation section is provided, capable of chorus, flange and delay effects, and the factory presets showcase some of the range of sounds that can be produced.
specs: |-
  - 64 bit AU, AAX and VST formats
  - macOS and Windows
  - 16 independently controllable partials summed to form the waveform
  - Partials assignable to three groups, each with an envelope generator and an LFO
  - LFOs with a wide frequency range, usable as ring modulators
  - Pulse width modulation by envelope, LFO and note velocity
  - Resonant filter, lowpass to bandpass to highpass and continuously in between
  - Modulation section providing chorus, flange and delay effects
  - Factory presets included
  - Activation through an ilok.com account, to an iLok, the iLok Cloud or the local machine
  - A physical iLok is not required
  - 7 day trial available by launching the plug-in without a license
