description: Kujaku is a multi-FX based on convolution reverb. Impulse reponse is graphically editable, and with post effects, Kujaku achieves various sound making.
details: |-
  Kujaku is a multi-FX plugin from A.O.M. built around convolution reverb. Its impulse response is graphically editable, and combined with post effects the plugin is aimed at a wide range of sound making rather than room emulation alone.

  The signal path pairs the editable convolution reverb with ten post effects that can each be toggled on or off and reordered, so the processing chain after the reverb is arranged by the user. A block diagram of the full signal flow is published on the product page.

  Common to A.O.M.'s plugin line, Kujaku supports sample rates from 44.1 kHz to 384 kHz, runs at 64-bit floating-point internal precision, and reports latency compensation to the host. Factory and user presets, snapshots, undo/redo and reset to default are provided.

  On Windows the plugin requires an x64-compatible CPU and Windows 11 (24H2 or 25H2), and ships as VST2, VST3, AAX-Native and CLAP. On macOS it runs on Intel or Apple Silicon under macOS Monterey 12 through macOS Tahoe 26, adding Audio Unit to the same format list.
specs: |-
  - Graphically editable convolution reverb
  - Togglable, reorderable 10 post effects
  - Supports 44.1k - 384kHz Sample Rate
  - 64-bit Floating-point Internal Precision
