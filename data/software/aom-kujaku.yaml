description: A convolution-based multi-effects plugin with graphically editable
  impulse response and 10 togglable, reorderable post-processing effects for
  diverse sound design applications.
details: |-
  Kujaku is a multi-effects plugin centered on convolution reverb technology. It
  features a graphically editable impulse response that allows direct
  manipulation of the reverb character through visual controls.

  Beyond the convolution engine, Kujaku includes 10 togglable and reorderable
  post-processing effects that can be chained in any order. This modular
  approach enables diverse sound design applications from subtle spatial
  enhancement to creative transformations.

  The plugin supports sample rates from 44.1kHz to 384kHz with 64-bit
  floating-point internal precision. Factory and user presets, snapshot
  functionality, and undo/redo support provide a complete workflow for saving
  and recalling complex effect chains.

  Kujaku was initially released in August 2023 as one of A.O.M.'s more recent
  products, expanding their lineup beyond dynamics and equalization into
  creative effects territory.
specs: |-
  - Graphically editable convolution reverb
  - 10 togglable, reorderable post effects
  - Sample rates: 44.1kHz to 384kHz
  - 64-bit floating-point internal precision
  - Latency compensation included
  - Factory and user presets with snapshots
