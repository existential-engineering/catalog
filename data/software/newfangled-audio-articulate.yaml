description: Articulate is an audio ADSR that puts smack, punch, body, and air
  on four faders, replacing compressors, gates, and expanders in one plugin.
details: |-
  Take control of your mix with Articulate, the next generation envelope shaper that makes fixing dynamics as simple as using an EQ. More than a transient shaper, Articulate separates your audio into four bands: Attack, Decay, Sustain, and Release. By dialing in the desired level on the corresponding fader, you can instantly add Smack, Punch, Body, and Air to any source.

  Articulate divides the envelope of any sound into four powerful segments: Attack (Smack), Decay (Punch), Sustain (Body), and Release (Air). Giving you direct control to enhance transients, boost presence, or subtly control sustain, dial in clarity, punch, and precision exactly how you want.

  Articulate combines two areas of research that are central to Newfangled Audio's work. The company spent 10 years researching the best ways to measure the amplitude envelope of an audio signal. One might think it's a trivial problem, but getting a very accurate measure that is both fast and stable is quite difficult. With this highly accurate envelope detector in hand, a good measure of psychoacoustic understanding was applied to separate the audio signal into elements that are important to how we, as humans, experience sound. This research is ongoing, and the results of these experiments were promising enough to release this product now.

  Transients are one of the most essential elements of a good mix. Both Punctuate and Articulate are first class products for controlling the transient impact of your sound, but how are they different? Punctuate is uniquely suited to mastering and 2-bus scenarios where you want to change the transient impact of an entire mix without artifacts. Articulate is an audio ADSR which gives you unprecedented direct control of the entire envelope of a single instrument, allowing you to fit sounds in the mix almost without thinking about it. Articulate and Punctuate use entirely different algorithms to achieve their unique goals.

  Articulate's Sidechain mode shapes one sound with another, ducking transients and reshaping envelopes based on an external input, so you can tighten bass with a kick, clean up reverb tails, or add groove without crushing dynamics.
specs: |-
  - Independent Envelope Shaping: precision over ATTACK, DECAY, SUSTAIN, and RELEASE stages for transient definition
  - Sidechain Detection: use external audio sources to shape transients and envelopes dynamically
  - Separation Control: adjust from smooth shaping to aggressive transient enhancement
  - Solo and Mute per envelope stage
  - Visual Graphic Display: real-time envelope trace
  - Professional Peak Limiter with adjustable threshold
  - Stereo Link Control: linked detection for consistent stereo imaging, or unlinked for dual-mono shaping
  - Fully resizable UI
  - Color schemes
  - 70+ presets across drums, synths and keys, guitar, effects/ambience/creative, vocals, bass, mixbuss and mastering, and sidechain categories
  - Full preset librarian with categories, tags, descriptions, UNDO, and A/B comparison
  - macOS 10.14+, 64-bit AAX, AU, VST, VST3, all formats Apple Silicon compatible
  - Windows 10+, 64-bit AAX, VST, VST3
