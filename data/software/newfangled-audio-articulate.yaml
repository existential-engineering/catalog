description: An audio ADSR which gives you unprecedented direct control of the
  entire envelope, separating audio into four independent bands (Attack, Decay,
  Sustain, Release) for dynamic shaping. Adds smack, punch, body, and air to any
  audio source.
details: |-
  Articulate is an audio ADSR envelope and transient shaper from Newfangled Audio that gives users direct, independent control over each stage of a sound's envelope: Attack, Decay, Sustain, and Release. Rather than working as a traditional compressor, Articulate isolates and reshapes each envelope stage separately, allowing precise sculpting of dynamics without the side effects of conventional compression.

  The plugin includes sidechain detection capability, solo and mute controls per envelope stage, and a real-time visual envelope display so users can see exactly how the signal is being shaped. A peak limiter with adjustable threshold is included to prevent clipping during aggressive shaping.

  Articulate ships with 70+ professional presets organized by category, a full preset librarian with tag filtering and A/B comparison, and a resizable UI with selectable color schemes. It is compatible with Apple Silicon natively on macOS.

  The plugin is available as a permanent license and includes a free 14-day fully featured trial. Loyalty pricing is offered to existing Newfangled Audio plugin owners.
specs: |-
  - Independent envelope shaping across Attack, Decay, Sustain, and Release stages
  - Sidechain detection capability
  - Solo and mute controls per envelope stage
  - Real-time visual envelope display
  - Peak limiter with adjustable threshold
  - Stereo LINK control
  - Scrolling gain reduction meter
  - 70+ professional presets with category tagging and A/B comparison
  - Resizable UI with color schemes
  - Apple Silicon native (macOS)
  - macOS 10.14 and later, 64-bit
  - Windows 10 and later, 64-bit
