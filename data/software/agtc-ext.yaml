description: Ample Sound has released the agtc neck extension which aims to
  reproduce the sound of the fender telecaster john english master-built guitar.
details: |-
  Sample: 3.7 gb samples, 24-bit 44.1khz. Sustain, hammer on & pull off, legato
  slide, slide in & out, palm mute, pop, natural harmonic, artificial harmonic
  10 articulations. Alternate tuner & lowest to d.

  System requirements: windows vista or newer, pentium 4 or athlon processor
  with 2 gb ram. Mac os x 10.7 or higher, intel-based mac with 2 gb ram. AU,
  VST, AAX or rtas host application and professional sound card recommended.
  Stand-alone version included.

  Agtc neck requires owning and installation of agtc v2.55 or newer.
specs: |-
