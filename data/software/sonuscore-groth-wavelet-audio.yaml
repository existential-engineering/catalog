description: Evoke the atmosphere of mystical old northern gods, ancient cultural traditions, burial mounds, and rugged forests suspended in frost. This toolbox draws on rich and diverse traditions of folk music rooted in the depths of our past, combining classical instruments with folk and traditional recordings for cinematic music inspired by dark ages mythology and epic fantasy soundscapes.
specs: |-
  - 61 programmed instruments with true legato
  - Multiple round robins and dynamic layers
  - 24-bit / 48 kHz lossless NCW format
  - Bonus construction kits and foley sounds
  - Snapshots included
  - 10.6 GB hard drive space required (15.6 GB original samples)
  - Requires NI Kontakt 6.2+ or Free Kontakt Player
  - Compatible with Native Instruments hardware
  - Instruments: tagelharpa, acoustic guitar, dombras, cello, orchestral strings, didgeridoo, orchestral effects, kanglings, war horns, throat singing, drones, and 19 organic synths
