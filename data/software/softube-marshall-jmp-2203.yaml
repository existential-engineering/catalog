  piece for your kit. The father of the Marshall JCM800 and one of the iconic
  Marshall plugins from Softube.
details: |-
  The Marshall JMP 2203 was introduced in 1975. It quickly replaced the Plexi as the go-to Marshall amp and became the amp against which all other rock amps were compared. Artists who used it included Jeff Beck, Andy Summers, Tom Morello, AC/DC, Motley Crue, Judas Priest, Slayer, the Pixies, and more.

  Marshall JMP 2203 is a super accurate plug-in version of the real thing, produced in partnership with Marshall from the reference 2203 amp that Marshall themselves use to define the true 2203 sound in the Marshall museum. The plug-in was component modeled down to the smallest details, resulting in flawless sound quality so you can let there be rock.

  Cabinet speakers were expertly recorded by acclaimed engineer and producer Tony Platt, and the plug-in offers numerous options for setting up the mics to your specifications. A built-in channel strip lets you mix your sound right there in the plug-in.

  Amp Room Ready: the plug-in works both as a native plug-in and as a module in Amp Room, Softube's pro audio guitar and bass platform, where it opens up further creative possibilities.

  The product supports Softube Extended Features, easy-access panels that add modern precision and workflow alongside the analog character of the original. It is officially licensed and endorsed by Marshall.
specs: |-
  - A careful emulation of the legendary JMP 2203 rock amp
  - The father of the JCM800, with the same character and the true sound of rock and hard rock
  - Cabinet speakers recorded by engineer/producer Tony Platt of AC/DC fame
  - Both a native plug-in and a module for Amp Room, the pro audio guitar and bass platform
  - Component modeled down to the smallest details
  - Flawless, authentic sound quality
  - Numerous options for setting up the mics to your specifications
  - Endless creative possibilities in Amp Room
  - A rare collectible with Marshall legacy, now available as software
