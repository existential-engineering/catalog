url: https://kentonuk.com/product/d-sync-flash-update/
description: Firmware flash update for the D-Sync, applying to serial numbers up
  to P4-0850 only. It can be applied with the D-Sync Configuration Manager or
  from a direct firmware download.
details: |-
  A firmware update for the D-Sync, offered both through the D-Sync Configuration Manager and as a direct download, so the owner installs it themselves rather than returning the unit.

  The update applies to serial numbers up to P4-0850 only. Serial numbers P4-0851 onward do not require a firmware update.

  Version 1006, dated 21 August 2023, fixed two bugs. With Continue=Start mode set to OFF, a D-Sync that received an SPP=0 followed by a Start and then a Continue incorrectly treated the Continue message as a Start. Separately, after a reset to defaults the LED colour was not reset to green if the D-Sync had been in Sync-48 mode.

  Earlier releases extended the unit's range and sync options. Version 1004, dated 26 August 2021, increased the maximum clock rate to around 260bpm, and version 1003, dated 15 August 2015, added support for Sync-48.
specs: |-
  - Applies to D-Sync serial numbers up to P4-0850 only
  - Serial numbers P4-0851 onward do not require a firmware update
  - Latest listed firmware version 1006, dated 21/08/2023
  - Version 1004 increased the maximum clock rate to around 260bpm
  - Version 1003 added support for Sync-48
  - Can be applied with the D-Sync Configuration Manager or from a direct download
