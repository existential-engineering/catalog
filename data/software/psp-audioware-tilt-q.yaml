description: A modern tilt and contour equalizer designed for fast, musical tonal shaping. Combines a tilt equalizer with three selectable curve characteristics, a contour (loudness) equalizer with three response options, and high-pass/low-pass filters with selectable slopes. Features stereo, Mid-Side, and mono processing modes, 64-bit double-precision processing, soft saturation at the output stage, and a built-in 31-band spectrum analyzer.
details: |-
  Requires iLok user ID for activation. Supports up to 3 license activations (computer or iLok dongle). Minimum macOS version: 10.14 Mojave. Supports Intel and Apple Silicon. Automatic oversampling for sample rates below 50 kHz.
specs: |-
  - 64-bit double-precision processing
  - Three tilt EQ curve characteristics
  - Three contour (loudness) EQ response options
  - High-pass and low-pass filters: 6, 12, or 24 dB/octave slopes
  - Stereo, Mid-Side, and mono channel processing modes
  - Built-in 31-band spectrum analyzer
  - Soft saturation at output stage
  - Automatic oversampling for sample rates below 50 kHz
  - iLok activation required (up to 3 activations)
  - macOS: 10.14-15 (Intel and Apple Silicon)
  - Windows: 7-11 (64-bit)
