description: A modern tilt and contour equalizer designed for fast, musical tonal shaping. Combines a tilt equalizer with three selectable curve characteristics, a contour (loudness) equalizer with three response options, and high-pass/low-pass filters with selectable slopes. Features stereo, Mid-Side, and mono processing modes, 64-bit double-precision processing, soft saturation at the output stage, and a built-in 31-band spectrum analyzer.
details: |-
  PSP Tilt-Q is a modern tilt and contour equalizer designed for fast, musical tonal shaping. Instead of surgical moves, it encourages broad, meaningful adjustments that naturally glue tracks together and bring clarity, depth, and balance to your mixes.

  With a tilt EQ, contour (loudness) control, and high-quality high- and low-pass filters, each offering multiple response characteristics, PSP Tilt-Q adapts easily to tracks, buses, and full mixes. Its sound remains smooth and cohesive even when used across many channels.

  Powered by 64-bit double-precision processing and PSP's proprietary soft saturation, PSP Tilt-Q delivers musical results without harshness - helping your mix feel open, connected, and effortless.

  In order to run PSP Tilt-Q in 30-day trial mode or activate it, you need an iLok user ID which you can create for free at www.ilok.com, and you need to install the free iLok License Manager application but you don't need any hardware dongle. You can activate the license in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above). You can move these licenses at any time using PACE's iLok License Manager software.
specs: |-
  - Tilt Equalizer with Three Characteristics: musical tilt EQ offering three distinct curve shapes, allowing you to quickly rebalance lows vs highs while choosing between classic, low-high focused, or mid-centric behavior
  - Contour (Loudness) Equalizer with Three Characteristics: a loudness-style EQ designed to enhance lows and highs while shaping the midrange, with three selectable response characteristics inspired by classic hardware loudness designs and soft curve equalisers
  - High-Pass & Low-Pass Filters: independent HPF and LPF with selectable 6, 12, or 24 dB/octave slopes for precise low- and high-frequency range control
  - Flexible Channel Processing: apply processing to Left, Right, Mid, Side, or full stereo signals
  - FAT Double Sampling: automatic oversampling for lower sample rates (below 50 kHz) ensures consistent, high-quality processing across all supported sample rates
  - 64-bit Double-Precision Processing: ultra-high-accuracy internal processing minimizes cumulative errors, preventing noise buildup and preserving natural filter behavior
  - Second-Generation Output Saturation (SAT): optional soft saturation at the output stage adds smooth analog-style drive while protecting against digital clipping
  - Integrated PSP Spector PSPEC-31 Analyzer: built-in 31-band spectrum analyzer with bar or curve display modes, allowing real-time visualization before or after EQ processing
  - Intuitive, console-style interface designed for fast, musical decisions with minimal controls
  - Windows 7 - Windows 11 (64-bit VST, VST3, AAX)
  - macOS X 10.14 Mojave - macOS Tahoe (macOS 26), Intel and Apple Silicon (64-bit AudioUnit, VST, VST3, AAX)
  - Requires a free iLok user ID and the iLok License Manager application, no hardware dongle required
  - License activatable in up to 3 locations
