description: One ultra-simple plugin that delivers the punch, energy, and edge your vocals need to stand out.
details: |-
  Great vocal mixes aren't about knowing the right frequencies. They're about knowing how the vocal should feel, upfront, clear, present, without becoming harsh or thin. Telos Vocals gets you there without a single technical distraction.

  Raw vocals often sound muddy and distant or overly hyped and fatiguing. Telos Vocals transforms your tracks into the hyper-clear, ultra-modern sound of the charts, providing the weight, sparkle, and locked-in feel that turns a raw performance into a professional record.

  EQ, compression, de-essing, saturation and more are all managed under the hood in one plugin, so you get the result without the headache, in five minutes rather than forty-five.

  Works on all vocal styles: lead vocals, harmonies, ad libs, background stacks. Whatever you put it on, it delivers, so every vocal in your session gets the same treatment.
specs: |-
  - High and low cut filters to clean up unwanted sub-rumble or fizzy top-end
  - Low-end shaping to remove muddiness or add warmth, control proximity effects
  - Midrange sculpting to tame boxiness without sounding hollow or harsh
  - High-end modes: Classic (energy and air), Presence (brings vocals forward), Air (sparkle and openness)
  - One-knob de-esser for harsh s and t sounds without dulling the vocal
  - Stage 1 compressor: clean and transparent, smooths uneven dynamics
  - Stage 2 compression with Smooth mode (controlled, energetic) and Aggro mode (punch and intensity)
  - Saturation modes: Smooth (subtle warmth), Rich (fuller low end), Aggro (grit and edge)
  - Limiter to lock in level and tame peaks
  - Anti-aliasing to reduce digital artifacts at higher processing levels
  - Mac OS X 10.15 or higher
  - Windows 10 or higher
  - 64-bit only
  - 200 MB free drive space
