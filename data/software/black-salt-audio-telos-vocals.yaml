description: "One ultra-simple plugin that delivers the punch, energy, and edge
  your vocals need to stand out."
details: |-
  Low Band Processor: variable low-shelf EQ for proximity control
  Mid Band Processor: parametric control for vocal boxiness frequencies
  High Band Processor: selectable high-shelf modes (Top, Presence, Air)
  Dual-Stage Compression: Control and Push stages with Smooth/Aggro modes
  Saturation Engine: Smooth, Rich, and Aggro character options
  De-Esser: transparent sibilance control
  Brickwall Limiter: peak control and consistency
  8x Oversampling to minimize aliasing

  Perpetual license, 3 activations per license, free updates and support
