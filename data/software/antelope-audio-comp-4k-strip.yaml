description: "The COMP-4K-STRIP plugin brings elite channel-strip compression,
  modeled after an iconic British 4K console, to the Synergy Core FX platform."
details: |-
  COMP-4K-STRIP is a VCA compressor / expander with HPF & LPF that runs natively in your DAW on macOS or Windows, or in real-time on Antelope's Synergy Core interfaces.

  Whatever music you are into, chances are a 4K has been heavily involved in your favorite records. Still in use in major studios today, superseded by modern technology but never bested by it, the British 4K series large-format mixing consoles are iconic studio pieces that rightfully earned their respected place in recording history. The 4K is THE mixing board of '80s rock and synthpop, and perhaps one of the most revered desks ever.

  Enthusiastic as we are about great analog sound, bringing the COMP-4K-STRIP to the Synergy Core effects processing platform is a proud moment for Antelope. An actual channel strip from a well-preserved desk was dismounted, painstakingly analyzed and its digital recreation rigorously tested for it to rank among the most faithful 4K reproductions out there.

  Enjoy the classic punch, glue, drive, and saturation of the iconic desk with no latency and zero CPU load, thanks to the Synergy Core processing platform built into your Antelope Audio interface. Strap the COMP-4K-STRIP across the entirety of your session and record, monitor, mix, and master through the time-tested circuits. Bring back the analog magic, stay in the box.

  The dynamic processors found in those early Oxford consoles may look rugged and simplistic, but they were in fact designed to be fully-functional dynamic multi-tools. Engineers and producers have been abusing them for decades and have found many exciting and unique uses — from one-knob compression and brick-wall limiting to side-chained de-essing and flexible pre/post-dynamics filtering.
specs: |-
  - VCA compressor / expander with high-pass and low-pass filters
  - Faithful recreation of a channel strip from a preserved British 4K large-format console
  - Threshold and Ratio interplay enables standard compression, brick-wall limiting, or one-knob workflows
  - 'dyn sc' button routes the filter section as a side-chain to the dynamics for de-essing
  - 'Pre Dyn' button switches the High Pass / Low Pass filters before or after the dynamics processing
  - Runs natively in your DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core interfaces with zero latency and zero CPU load
  - Usable for tracking, monitoring, mixing, and mastering
