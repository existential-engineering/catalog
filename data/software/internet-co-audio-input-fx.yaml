details: |-
  Audio Input FX is the multi effect software for voice input and demonstrate
  great power for adjusting voices in a live broadcast, online meeting, video
  editing and so on. By the action of the mouse click or drag, the voices can be
  upgraded in real-time.

  Audio input fx includes 6 built-in effects, 2 voice changer, compressor,
  reverb, delay and eq. They have many presets of the settings helpful in
  various situations. Other than 6 built-in effects, you can use two VST fx
  (compatible with vst2, 3).

  Voice changer can make you sound like a completely different person. Reverb
  can remind listeners of a large hall. Eq can adjust the voices easy to be
  heard.

  In adding the effects to voice input in real-time, conventionally we needed
  the hardware like an audio interface. But audio input fx can do the same in
  the software-based system.

  Audio input fx can run on the applications with voice input, for example live
  streaming apps like obs, xsplit and n air, video-communication apps like
  skype, zoom and google meet, and video or sound editting apps.
