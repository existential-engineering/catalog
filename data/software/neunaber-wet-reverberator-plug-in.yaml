description: A reverb plugin based on the algorithm in the Immerse Reverberator
  Mk II pedal, offering EQ, damping, modulation, and fidelity controls to add
  spaciousness while maintaining clarity.
details: |-
  The Wet Reverb is a patented algorithm that has been refined over the span of 10 years. The Wet Reverb has the unique ability to add spaciousness while maintaining unparalleled clarity — enhancing your mix without covering it up. The Wet Reverberator Plug-In was personally designed and coded by the algorithm's creator to ensure fidelity and consistency with the algorithm's core sound. This version of the effect is based on the algorithm in the Immerse Reverberator Mk II pedal, with expanded features that offer maximum versatility for mix engineers and producers. -
  Controls

  -
  EQ Controls - This group of controls affects the frequency response of the reverberated (wet) signal. -
  Damping Controls - This group of controls affects how the reverb tail is recursively filtered, in order to simulate the high frequency "damping" effect that occurs in a natural acoustic space. -
  Modulation Controls -This group of controls affects the modulation within the reverberator

  -
  Fidelity Controls - This group of controls affects aspects of the reverberator's sound quality. -
  About

  Licensing

  Compatibility

  We are a small company and new to the plugin market. Although we have made every effort to ensure that our plugin is compatible with newest versions of the most common DAWs, it is not practical for us to test the plugin in every version of every DAW — especially older versions. This is why we make the plugin available to you as a fully-functional trial — so that you may test it in your DAW to ensure compatibility before purchase. Known Issues

