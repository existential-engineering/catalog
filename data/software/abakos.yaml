details: >-
  Abakos is a virtual analogue synth.


  Features include 2 vco with 3 waveforms, lfo with multiple waveforms, 2 adsr
  for sound design, envelope follow, onboard delay, tremolo, vibrato and wah
  wah, noise generator, ring mod, digital / analogue filter modes, and internal
  preset management system.


  The synth is known for its sweet and creamy analogue sound quality,
  particularly excelling in pads and leads with endless sweeping pads and
  penetrating leads that cut through the mix.


  The documentation includes a beginner-friendly synthesis introduction with
  examples on how to use the synth to create certain sounds such as sea waves,
  heartbeats, and strings.


  Hercs music systems has ceased all commercial operations. All formerly
  available freeware, abakos and alien artifact, will remain available from this
  website for the foreseeable future and will remain as freeware.
