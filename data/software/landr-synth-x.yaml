details: |-
  LANDR Synth X is a wavetable software synthesizer aimed at music producers and sound designers. The page frames it as a route to creative freedom and expressive sounds, pairing a cutting-edge wavetable engine with an interface designed to stay approachable rather than demanding a long climb before the first usable patch.

  Sound creation is built around an intuitive interface and advanced synthesis tools that produce rich, dynamic tones without a steep learning curve. The sound design engine combines wavetable oscillators with ADSR envelopes, LFOs and modulation, and an extensive modulation matrix lets LFOs, envelopes and more be assigned to any parameter for flexible sound shaping.

  Wavetable Import is the feature LANDR leans on for signature sounds: any sound can be transformed into a custom wavetable, so the oscillator content is not limited to what ships with the plugin. That sits alongside a library of 400 presets and over 100 wavetables for starting points.

  A built-in FX section modifies sounds with reverb, delay, saturation and a versatile chorus effect, so patches can be finished inside the plugin rather than routed out to separate processors.

  A Randomize button generates new sounds with a single click, offered as a way to spark fresh ideas when a blank patch is the obstacle. Synth X is sold on its own and is also included with the LANDR Studio subscription.
specs: |-
  - Wavetable synthesizer plugin
  - Sound design engine with wavetable oscillators, ADSR, LFO and modulation
  - Wavetable Import: transform any sound into a custom wavetable
  - Built-in FX: reverb, delay, saturation and chorus
  - Extensive modulation matrix, assign LFOs and envelopes to any parameter
  - 400 presets and over 100 wavetables included
  - Randomization function for one-click sound generation
  - Streamlined GUI
