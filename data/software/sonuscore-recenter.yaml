description: Recenter automatically repairs off-center stereo recordings while keeping the original stereo width which makes it an invaluable time-saver and a perfect tool for professional post-production and music producers.
details: |-
  ReCenter is a stereo processor that constantly analyses an incoming stereo signal and dynamically rotates it to the center, or to a given angle, without altering the stereo width. Once the incoming signal is centered, the stereo image can be narrowed or widened inside ReCenter. For better low frequency control the original signal can be summed to mono below a set frequency, and a multiband processing option intelligently shifts more complicated signals.

  Pointing a stereo microphone perfectly at a sound source gets harder the further away the source is, and the result is a recording with a constantly shifting center that would otherwise require manually adjusting and automating the panning across the whole take. ReCenter continuously analyzes the directionality of a stereo or M/S signal and rotates it to a given target angle in real-time, without narrowing the stereo image. Typical uses are fixing off-centered stereo field recordings, dynamically centering a vocal artist or musician who moved around the stage, and centering hard directional effects such as drive-bys and stereo whooshes.

  The plug-in is designed to be effective simply as an insert effect, with a small set of accessible controls: how hard, how fast and how precisely it should adjust the signal, the resulting output angle, and the stereo width. An original-versus-processed comparison is available, M/S input decoding handles both common L/R and Mid-Side recordings, and the multiband mode processes four frequency bands individually to achieve a more precise output on complex material.

  ReCenter requires an audio host application and does not work as a standalone application. It runs in hosts supporting VST 2.4, AU or AAX, including Logic Pro, Pro Tools (11+), Cubase, Nuendo, Ableton Live and Reaper.
specs: |-
  - Real-time stereo centering processor with automatic directionality analysis
  - Dynamically rotates a stereo or M/S signal to a target angle without narrowing the stereo image
  - Adjustable output angle to the left or right
  - Widen or narrow the centered stereo image
  - Input stereo or M/S signals, with automatic M/S decoding
  - Mono filter below a set frequency for low-frequency control
  - Multiband mode processes four frequency bands individually for heavy-duty applications
  - Compare original and processed signal
  - Format: software plug-in (VST, AU, AAX) for Windows and Mac
  - Requires an audio host application; does not run standalone
  - Works in hosts supporting VST 2.4, AU or AAX (Logic Pro, Pro Tools 11+, Cubase, Nuendo, Ableton Live, Reaper)
  - Requires a free iLok account; machine license activation or iLok USB dongle (2nd generation or newer)
  - Required hard disk space: 113 MB
  - Available as download
  - Windows: Windows 8 (64-bit), 8 GB RAM, Intel Core i5 or similar, OpenGL 2.1 capable GPU
  - Mac: macOS 10.13 (64-bit), 8 GB RAM, Apple Silicon or Intel Core i5, OpenGL 2.1 capable GPU
