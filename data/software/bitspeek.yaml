name: Bitspeek
manufacturer: sonic-charge
primaryCategory: effect
url: https://soniccharge.com/bitspeek
description: Bitspeek is a real-time pitch-excited linear prediction codec effect.
details: |-
  Sonic charge applied this technology to create a VST / AU effect plug-in that
  analyzes audio, extracts a number of parameters (including pitch, volume and
  formant data) and then resynthesizes the audio using a simple oscillator,
  noise and filter architecture.

  A number of playback parameters that adjusts the pitch and tonal quality of
  the sound as well as support for MIDI and a beat-synchronized "formant
  freezing effect" have been added.

  Despite having only a few simple controls, this box can produce a broad range
  of sounds from cheap speaking toys to high-end vocoder and talkbox effects.
specs: |-
  - Real-time pitch-excited linear prediction codec effect
  - MIDI support
  - Beat-synchronized formant freezing effect
  - Pitch extraction and adjustment
  - Volume extraction
  - Formant data extraction
  - Oscillator resynthesis
  - Noise resynthesis
  - Filter architecture
  - Formant freezing
