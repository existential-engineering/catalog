details: |-
  BeatBox Anthology 2 is a Massive collection of vintage, modern and unique drum
  sounds representing over 50 years of grooveboxes, beat machines, drum modules,
  synth drums and more, from analog to digital, mainstream to obscure.

  An extraordinarily versatile and easy-to-use percussion instrument that allows
  you to explore the history of hardware drum synthesis while designing your own
  kits, layering different machine sounds together, and creating entirely new
  hybrids with expertly recorded and exquisitely sliced samples that deliver the
  authentic and unmistakable sound of hardware.

  Beatbox anthology 2 offers native 64-bit standalone operation by way of falcon
  or the free uvi workstation, providing comprehensive support for all modern
  daws and simultaneous authorization on up to 3 computers or ilok keys.
specs: |-
  - 111 hardware drum machines
  - 11,000+ samples
  - 12-track/3-layer architecture
  - Built-in sequencer with MIDI drag-n-drop
  - 32 new hardware machines
  - 250+ kits
  - 160+ patterns
  - Step sequencer with MIDI drag-and-drop
  - Per-track effects including 3-band EQ, compressor and sends
  - Master EQ and bit crusher
  - Native 64-bit standalone operation
  - Precision envelopes
  - Sample offsets
  - Simultaneous authorization on up to 3 computers or ilok keys
