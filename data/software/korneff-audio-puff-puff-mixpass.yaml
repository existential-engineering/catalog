description: A dynamic enhancer that makes all material apparently louder, with rich dynamics and an analog sheen. Employs waveshaping technology to increase perceived loudness while maintaining dynamic range rather than relying on traditional compression. Features SONIC INTEGRITY and EMPHASIS controls, BROKEN setting (adds sonic anomalies mimicking worn analog equipment), FUZZ setting (distortion and overdrive), built-in clipper to remove digital artifacts, stereo enhancement, and Lo-Fi effects.
details: |-
  Puff Puff mixPass is a dynamics enhancement plugin from Korneff Audio that increases perceived loudness through harmonic structure enhancement rather than traditional compression or limiting. By employing waveshaping technology, it gives mixes and individual tracks a louder, more impactful sound while preserving the integrity of the source material.

  The plugin features two primary controls: Sonic Integrity, which allows users to experiment with distortion and saturation character, and Emphasis, which adjusts the waveshaping parameters. A special 'Broken' setting emulates the unpredictable character of damaged analog equipment, while 'Fuzz' mode adds distortion and overdrive effects for more aggressive processing.

  An integrated clipper is included and designed to eliminate digital artifacts that can arise from aggressive waveshaping, keeping the output clean even at high enhancement settings. The plugin also offers stereo enhancement capabilities and Lo-Fi effects options, making it versatile across mix bus, individual tracks, guitars, bass, and drums.
