description: "A dynamics enhancer that raises apparent loudness through waveshaping rather than compression or limiting. Features SONIC INTEGRITY and EMPHASIS controls, a BROKEN setting (adds sonic anomalies mimicking worn analog equipment), a FUZZ setting (distortion and overdrive), and a built-in clipper to remove digital artifacts."
details: |-
  Puff Puff mixPass raises the level of a track or mix without limiting or compression.

  It works by enhancing the harmonic structure of the signal to increase apparent loudness, so the dynamic range is not reduced the way it is by heavy compression. The processing is set with two sliders.

  Beyond level there are controls for distortion and saturation. SONIC INTEGRITY and EMPHASIS set parameters of the waveshaping algorithm, and BROKEN adds anomalies modelled on damaged, worn analog equipment.

  The FUZZ setting adds distortion and overload to the signal, for fuzz box and overdrive effects.

  A clipper is included, designed to suppress digital artifacts such as clicks and pops at extreme settings.
specs: |-
  - Harmonic waveshaping that raises apparent loudness without limiting or compression
  - Two-slider main control set
  - SONIC INTEGRITY and EMPHASIS controls over the waveshaping algorithm
  - BROKEN mode adding anomalies reminiscent of damaged, worn analog equipment
  - FUZZ setting for heavy distortion, overdrive and fuzz box effects
  - Built-in clipper designed to suppress digital artifacts such as clicks and pops
  - Software-based licensing, no USB or hardware dongle and no special drivers
  - Activation on up to four machines at the same time
  - Internet connection required for activation and for all demos
  - Minimum: Intel, AMD or Apple Silicon i5 quad core processor
  - Minimum: 4GB of RAM
  - Minimum: Mac OS X 10.14 or higher
  - Minimum: Windows 7 and above
  - Minimum screen resolution: 1024 x 768
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
