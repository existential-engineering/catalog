description: "A dynamic enhancer that makes all material apparently louder, with
  rich dynamics and an analog sheen. Employs waveshaping technology to increase
  perceived loudness while maintaining dynamic range rather than relying on
  traditional compression. Features SONIC INTEGRITY and EMPHASIS controls,
  BROKEN setting (adds sonic anomalies mimicking worn analog equipment), FUZZ
  setting (distortion and overdrive), built-in clipper to remove digital
  artifacts, stereo enhancement, and Lo-Fi effects."
