description: The Puff Puff mixPass is a dynamic enhancer that makes all material
  apparently louder, with rich dynamics and an analog sheen. It's your secret
  weapon in the volume wars.
details: |-
  LOUDER, but not compressed. When you need a track or mix louder, do you slap a compressor or limiter on it, squash it and crank up the gain? Yes, it gets louder, but does it sound, well... good?

  Puff Puff mixPass makes your signal louder by enhancing its harmonic structure to increase the apparent loudness to your ear. Yes, it sounds louder, but it's not crushed with zilch dynamic range and that typical overcompressed flatness. The Puff Puff actually brings back dynamics and adds a warm, analog liveliness that usually requires a room full of tube equipment to emulate. The Puff Puff mixPass does all this with some clever waveshaping and two sliders.

  LOUDER, and with CHARACTER. Puff Puff mixPass has unique controls so you can experiment with distortion, saturation and all sorts of sonic mayhem. It's nice to have pristine sound quality, but sometimes you have to make a glorious mess of things.

  Using the SONIC INTEGRITY and the EMPHASIS control allows you to control parameters of the Puff Puff's waveshaping algorithm. BROKEN adds sonic anomalies reminiscent of the issues caused by damaged, worn analog equipment. The FUZZ setting adds heaps of distortion and overload to your signal. Create fuzz box and overdrive effects, or add a pleasant buzz to a pristine track.

  Of course there's a Clipper. Puff Puff mixPass is, after all, your secret weapon in the loudness wars. So, of course, Puff Puff mixPass includes a clipper so you're properly armed. But even this clipper is different: it's designed to remove annoying digital artifacts like clicks and pops, so feel free to EXTREME CLIP.
specs: |-
  - SONIC INTEGRITY and EMPHASIS controls over the waveshaping algorithm
  - BROKEN control adds sonic anomalies of worn analog equipment
  - FUZZ setting for distortion and overload effects
  - Built-in clipper designed to remove digital artifacts such as clicks and pops
  - Intel, AMD or Apple Silicon i5 quad core processor
