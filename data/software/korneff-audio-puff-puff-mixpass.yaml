description: A dynamic enhancer that makes all material apparently louder, with rich dynamics and an analog sheen. Employs waveshaping technology to increase perceived loudness while maintaining dynamic range rather than relying on traditional compression. Features SONIC INTEGRITY and EMPHASIS controls, BROKEN setting (adds sonic anomalies mimicking worn analog equipment), FUZZ setting (distortion and overdrive), and a built-in clipper to remove digital artifacts.
details: |-
  Puff Puff mixPass is a dynamics enhancer that makes your mixes loud without limiting and compression. When a track or mix needs to be louder, the usual answer is a compressor or limiter, squashed with the gain cranked up. It does get louder, but not necessarily better.

  Puff Puff mixPass instead makes the signal louder by enhancing its harmonic structure to increase apparent loudness to the ear. It sounds louder without being crushed into zero dynamic range and the flatness that comes with overcompression. It brings dynamics back and adds a warm, analog liveliness that would usually take a room full of tube equipment to produce, and it does all of it with clever waveshaping and two sliders.

  Beyond loudness there are controls for experimenting with distortion, saturation and general sonic mayhem. SONIC INTEGRITY and EMPHASIS control parameters of the waveshaping algorithm, and BROKEN adds sonic anomalies reminiscent of damaged, worn analog equipment.

  The FUZZ setting adds heaps of distortion and overload to the signal, for fuzz box and overdrive effects or just a pleasant buzz on a pristine track, all while making things louder and under creative control.

  There is also a clipper, since the plugin is positioned as a weapon in the loudness wars, but it is designed to remove annoying digital artifacts like clicks and pops, so extreme clipping stays usable.
specs: |-
  - Harmonic waveshaping that raises apparent loudness without limiting or compression
  - Two-slider main control set
  - SONIC INTEGRITY and EMPHASIS controls over the waveshaping algorithm
  - BROKEN mode adding anomalies reminiscent of damaged, worn analog equipment
  - FUZZ setting for heavy distortion, overdrive and fuzz box effects
  - Built-in clipper designed to suppress digital artifacts such as clicks and pops
  - Software-based licensing, no USB or hardware dongle and no special drivers
  - Activation on up to four machines at the same time
  - Internet connection required for activation and for all demos
  - Minimum: Intel, AMD or Apple Silicon i5 quad core processor
  - Minimum: 4GB of RAM
  - Minimum: Mac OS X 10.14 or higher
  - Minimum: Windows 7 and above
  - Minimum screen resolution: 1024 x 768
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
