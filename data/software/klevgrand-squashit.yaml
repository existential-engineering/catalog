details: |-
  SquashIt is a powerful distortion filter, with a wide range of uses. Whether you want to completely mangle your sound to the unrecognizable, or just beef up the saturation a bit, SquashIt can be your friend. A simple and effective interface let you tune in the perfect amount of distortion, on three different frequency bands. Combined with a unique distortion algorithm, SquashIt has become essential in many music producers' toolset.

  The plugin is described on the product page as a multi-band distortion that will wake up any sound. Distortion is applied across three independent frequency bands, each with its own level, and the crossover points between the bands can be dragged to change where the three bands split.

  The anatomy section names four controls. Input sets how hard the signal is driven and can go from very soft to way too much. Distortion level sets individual amounts of distortion for each of the three bands. Crossover frequency is dragged to change where the three bands split. Output works the same as Input, only last in the chain.

  Technical specifications on the page state that SquashIt requires macOS 10.10 or later (optimized for the M1-processor), or Windows 7 (SP1) or later, running an AU, VST or AAX compatible 64-bit host. The macOS and Windows builds are offered as AAX, AU and VST, and an iPad/iPhone build is offered as Standalone, AUv3, AB and IAA via the App Store.
specs: |-
  - Unique distortion algorithm
  - Simple but yet powerful user interface
