details: |-
  At the bottom of the interface, you can control the behavior of the
  instrument: legato mode allows you to choose whether playing a legato will
  trigger hammer ons, slides, sustains, or simply have no effect. The legato
  distance will define the maximum interval in which the legato will apply. The
  release volume controls the sound produced when you release a string if a note
  was going on. Cabinet simulation can be turned on or off. Eq allows you to
  edit the bass and treble of the parametric eq. The sensitivity will set the
  minimum volume for velocity 1 and give you access to all the dynamics that you
  want.

  Bassysm-m comes with its own sample player, the uvi workstation 3 (requires
  v3.0.0 or later). It works on mac (10.9 or later) and pc (windows 8 or later),
  in standalone or as a plugin (VST / vst3 / AU / AAX) and in 64-bits only.

  Technical specifications include 260mb uncompressed, 151mb compressed in
  lossless flac format, around 855 samples. 11 velocity layers for the sustain.
  10 velocities for the release. Hammer on samples. Slide samples. Advanced
  vibrato effect controlled via modulation wheel. String noises played randomly.
  Harmonics, ghost notes, string hits samples. Advanced uvi scripting giving you
  access to a simple yet powerful interface and advanced features.
