details: |-
  Yellowjacket synthesizer is a stunning value-packed tribute to the venerable
  Wasp synthesizer, released by the British synth company EDP in 1978. Cherry
  Audio has reproduced the singular buzzy tone and drone of this legendary
  monophonic digital/analog hybrid, from its quirky oscillators to its
  distinctive filter.

  Influenced by the pioneering spirit of its inventors, Cherry Audio has added
  several innovative features including elements of other EDP instruments,
  unison and 16-voice polyphony, emulation of the Wasp's integrated speaker, an
  expanded multimode filter, and an advanced arpeggiator with probability and
  humanise controls.

  Perhaps the most exciting feature is directly inspired by EDP's innovative
  pre-MIDI system that allowed multiple synths to be chained together:
  multi-voice modes that add adjustable mini synths providing subtle or extreme
  variation in tone, single-fingered chords, arpeggiated patterns, and lush
  stereo effects.

  Yellowjacket includes over 270 spectacular presets, a replicated
  touch-capacitive keyboard with diatonic scales and transpose, customizable
  pressure control with polyphonic aftertouch support, and studio-quality
  effects including the new Octafuzz multimode overdrive/distortion, phaser,
  flanger/chorus, echo, and reverb.
specs: |-
  - Precisely modeled EDP Wasp monophonic synthesizer
  - Monophonic, unison, polyphonic (4, 8, or 16 voices), and cycle voice modes
  - Multi voice modes with four mini synth panels for per-note variation
  - Two oscillators with ramp, pulse, square, and modulated pulse waveforms
  - Oscillator sync
  - Vintage-correct two-pole 12 dB state-variable filter with lowpass, bandpass, highpass, and notch
  - Two envelope generators: VCA Envelope with repeat and Control Envelope with looping
  - Syncable control oscillator with six waveforms for pitch, filter, and amp modulation
  - Enhanced capacitive-style keyboard with diatonic scales and transpose
  - Velocity, channel aftertouch, and polyphonic aftertouch support
  - Dynamic arpeggiator with Chance and Humanise controls
  - Speaker effect with Hiss and Hum for lo-fi tone
  - Octafuzz multimode overdrive/distortion effect
  - Studio-quality phaser, flanger/chorus, echo, and reverb effects
  - Multi-touch enabled on compatible Windows touchscreens
  - Over 270 professionally designed presets in 12 categories
  - User-adjustable oversampling control
  - Complete MIDI control and DAW automation
