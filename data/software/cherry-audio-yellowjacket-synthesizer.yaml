description: Yellowjacket synthesizer is a one-of-a-kind tribute to the iconic
  1978 EDP Wasp synthesizer. Cherry Audio has faithfully recreated its unique
  buzzy tone and drone, enhancing it with several exciting features that expand
  on the original design such as 16-voice polyphony and an emulation of the
  integrated speaker.
details: |-
  Yellowjacket is a tribute to the Wasp synthesizer, released by the British synth company EDP in 1978. Cherry Audio has reproduced the singular buzzy tone and drone of this legendary monophonic, digital/analog hybrid, from its quirky oscillators to its distinctive filter.

  Added features include elements of other EDP instruments, unison and 16-voice polyphony, emulation of the Wasp's integrated speaker, an expanded multimode filter, and an advanced arpeggiator with probability and humanise controls. The touch-capacitive yellow and black keyboard of the original is replicated, enhanced with diatonic scales and transpose, and extended with customizable pressure control with support for expressive channel and polyphonic aftertouch.

  Multi-voice modes are directly inspired by EDP's pre-MIDI system that allowed multiple synths to be chained together. They add adjustable "mini synths" that can provide subtle or extreme variation in tone, single-fingered chords and arpeggiated patterns, lush stereo effects, and more. The preset library holds over 270 presets, created by a sound design team led by James Terris.

  In 1978, British studio engineer Chris Huggett collaborated with synthesist Adrian Wagner to create the Wasp synthesizer for Electronic Dream Plant. With a focus on affordability, the Wasp was priced at £200 and featured a distinctive black-and-yellow plastic design. It included a touch-sensitive keyboard, a built-in speaker, and an innovative digital/analog hybrid synthesis system, making electronic music more accessible to a wider audience.

  Despite the commercial challenges that EDP eventually faced, the impact of the Wasp synthesizer is undeniable. It became an influential instrument for many UK musicians, including Nick Rhodes of Duran Duran, Dave Greenfield of The Stranglers, Thomas Dolby, Dave Stewart of Eurythmics, and Chris Carter of Throbbing Gristle, among others. Chris Huggett continued to innovate by creating the more affordable single-oscillator Gnat synthesizer for EDP and later developed the OSCar and the Novation BassStation. Cherry Audio dedicates the Yellowjacket synthesizer to his memory.
specs: |-
  - All aspects of the 1978 EDP Wasp monophonic synthesizer modeled in detail, enhanced with new features
  - Over 270 professionally-designed presets in a dozen categories: Leads, Arps, Pads, Chords, Strings, Basses, and more
  - Monophonic, unison, polyphonic (4, 8, or 16 voices), and cycle voice modes with glide
  - Multi voice modes for unison, poly, and cycle that add per-note variation via three additional "mini synth" panels, each with their own pitch, pan, filter frequency, VCA Envelope Attack, and VCA Envelope Release settings
  - Quick-access Multi voice panel presets such as Hard Panned, Slightly Detuned, and Well Worn
  - Dual panel views: a main Edit view for synthesis controls, and an Arp/FX panel with extended features
  - Two oscillators with ramp, pulse, square wave, and an enhanced modulated pulse-wave based on the EDP Gnat
  - Oscillator sync
  - Mixer for both oscillators and a white noise signal generator
  - Syncable control oscillator (LFO) with free and retrigger modes, and sine, ramp, sawtooth, square, noise, or random waveforms for pitch, filter, and amp modulation
  - Two-pole 12dB state-variable filter based upon the CD4069 logic chip of the original, with lowpass, bandpass, or highpass, plus an extra notch mode and a "Q" resonance setting
  - Two envelope generators: a VCA Envelope for volume control with a repeat function, and a Control Envelope that modulates filter cutoff frequency with positive and negative modulation, looping, and adjustable attack
  - Output control with meter and settings for volume, panning, master tune, and limiter
  - Support for velocity, channel aftertouch, and polyphonic aftertouch with compatible USB/MIDI controllers
  - Keyboard pressure control with six modulation routings: volume, pitch, filter cutoff, mod wheel, reverb decay/mix, and an assignable control covering any one of 29 preset synth and effects parameters
  - Capacitive-style keyboard with root and diatonic scale controls, and a transpose control that quantizes notes from the USB/MIDI controller
  - Multi-touch enabled (Windows only) on compatible touchscreen monitors and gesture-capable tablet devices; UI can be maximized to make Yellowjacket fullscreen
  - User-selectable pitch bend depth from 0-12 semitones
  - Arpeggiator with Chance (step probability) and Humanise controls, combinable with Cycle modes and Scales, plus transposable four-note step sequences through Multi voice panels
  - Speaker effect (mono) with Hiss and Hum controls that simulates the original instrument's onboard speaker
  - Five integrated effects: Octafuzz multimode overdrive/distortion, 4/6/8/10-stage Phaser, Flanger/Chorus, three syncable Echo delays, and five Reverb types, with a global FX Out panel offering On/Off, Level, and Stereo Expand
  - Standalone virtual instrument and plug-in versions included
  - DAW sync
  - User-adjustable oversampling control
  - Complete MIDI control and DAW automation for all controls, with MIDI learn and mapping (Preset and Global)
  - Focus zoom-in feature, plus standard UI zoom and resize via drag
  - Documentation available online from the instrument or in downloadable PDF format
  - macOS 10.13 or above, 64-bit required, Intel or Apple Silicon; 3.4 GHz Quad-Core or Apple Silicon CPU with 8GB RAM recommended; 96 MB disk space
  - Windows 7 or above (including Windows 11), 64-bit required; 3.4 GHz Quad-Core with 8GB RAM recommended; 96 MB disk space
  - Internet connection required for product activation
