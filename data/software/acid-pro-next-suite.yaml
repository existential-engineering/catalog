details: |-
  ACID Pro Next Suite by Magix is an audio plugin host for Windows. It can host
  VST plugins and VST 3 plugins.

  All magix programs are developed with user-friendliness in mind so that all
  the basic features run smoothly and can be fully controlled, even on
  low-performance computers.

  Some advanced program features demand more of your computer's processing
  power. To get the most from these features, your system should at least meet
  the recommended requirements.

  An internet connection is required for program registration, validation and
  individual program features as well as one-time registration.
specs: |-
  - Audio plugin host
