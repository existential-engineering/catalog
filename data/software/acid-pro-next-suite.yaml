details: |-
  Acid pro next suite by magix is an audio plugin host for windows. It can host VST plugins and VST 3 plugins.

  All magix programs are developed with user-friendliness in mind so that all the basic features run smoothly and can be fully controlled, even on low-performance computers.

  Some advanced program features demand more of your computer's processing power. To get the most from these features, your system should at least meet the recommended requirements.

  An internet connection is required for program registration, validation and individual program features as well as one-time registration.
specs: |-
  - Audio plugin host
  - VST plugin support
  - VST 3 plugin support
  - 64-bit windows support
  - Windows 10 compatible
  - Windows 8 compatible
  - Windows 7 compatible
  - 1 ghz processor (multicore or multiprocessor recommended)
  - 1 gb ram minimum (8 gb recommended)
  - Onboard graphics card minimum 1024 x 768 resolution
  - Onboard sound card
  - 500 mb hard drive space for program installation
  - Up to 12 gb hard drive space for included instruments and loops
  - Multiple program languages: deutsch, english, español, français
  - Internet connection required for registration and validation
