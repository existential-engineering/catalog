details: |-
  Spitfire's most detailed and versatile piano to date, the bbcso piano
  faithfully captures the live concert sound of a pristine Steinway model d
  grand, at the iconic home of the bbc symphony orchestra, maida vale studios.
  Recorded in concerto position in studio one, this highly expressive piano has
  been captured with the same expertly curated microphone positions, designed to
  blend seamlessly with the orchestra. A range of specific close mics are
  available for cinematic and pop contexts, as well as pedal and hammers volume
  control, for stunning realism.

  The professional edition is unmatched in its versatility, featuring 15 signals
  for endless sound sculpting possibilities. Whether paired with the bbc
  symphony orchestra or played as a standalone instrument, bbcso piano promises
  to provide a rich, authentic piano sound suited to any genre. The library
  opens in the existing bbcso plugin, allowing for seamless integration with the
  rest of the bbcso line and proving incredibly useful when writing for the
  piano and orchestra together.

  With a beautiful, modern design by ustwo (monument valley, dice), bbc symphony
  orchestra and bbcso piano are housed in spitfire's award-winning dedicated
  plugin (vst2, vst3, AU, AAX & nks ready) developed primarily for composers, by
  composers easy-to-use, intuitive and inspiring.

  Spitfire's groundbreaking mode switching technology makes each edition of
  bbcso piano and bbc symphony orchestra interchangeable, so you can mock up
  your scores quickly and with ease. For composers on the go or with a limited
  technical setup, start writing a piece of music using discover, and finish it
  in the core or professional edition, with a fuller range of signals, controls
  and versatility.

  The professional edition is the definitive tool for writing professional,
  world-class music. Its 15 signals and controls offer all the options you could
  possibly need to curate your own bespoke mix to match the exact sound you're
  looking for. It's also ready to play straight out of the box, with two
  expertly curated professional mixes to choose from mix one offering your
  standard orchestral mix, and mix two offering a wider, more vibrant cinematic
  sound.
specs: |-
