details: >-
  Soundtrack loops intros alien worlds retro sci-fi soundscapes and effects. The
  best vintage sci-fi sound effects are made with the best vintage hardware tech
  and its contemporary boutique inspirations. This package features soundtrack
  loops' own jason donnelly as the controller.


  This package of non-looping sound effects comprises 71 files with classic
  black 'n' white sci-fi authenticity: wobbly analog oscillators, rudimentary
  arpeggios, chattering circuits, and all the classic lfo modulations from pitch
  to noise.


  The paleo-ambient vibe is cold and distant, solitary and baffling, bringing to
  mind eno's simple but elusively deep music for films-era ruminations, as well
  as the best of the archetypal dronesmiths, academic electronic music
  soundscapers, and proto-industrial pioneers of early underground electronic
  music—bear in mind, these are sound effects created by a musician!


  The sounds on alien worlds are internalized and understated, favoring the
  stark, subtle and abstract—the total flip-side of the bombastic modern sci-fi
  takes.


  Formats (24-bit 48khz stereo): acidized .wav. Apple-looped .aif.
