  Aparillo is an advanced 16 voice FM synth tailored for complex sound
  structures, majestic motions, moving and evolving soundscapes and atmospheres
  that are perfect for film, tv or games.

  It's not limited to the conventional fm sounds but also delivers a huge range
  of styles from basses to brasses, pads to leads to even percussion.

  Aparillo ipad edition by sugar bytes is a virtual instrument audio plugin and
  a mobile audio app and a software application for ios. It functions as an
  audio units plugin and a standalone application.
