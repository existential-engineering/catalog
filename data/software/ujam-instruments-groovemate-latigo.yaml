description: Groovemate LATIGO is a top-notch latin percussion rig with a professional percussion player on call, the perfect sidekick to beats or drums.
details: |-
  Groovemate LATIGO is a top-notch latin percussion rig with a professional percussion player on call, the perfect sidekick to beats or drums when it comes to creating top-mix excitement. With grooves produced by multi-instrumentalist Nate Williams (ex-Jamiroquai), LATIGO works great with both electronic beats and acoustic drum grooves of any music genre.

  460 professionally performed phrases organized into 20 styles make it a breeze to find the right groove for any song easily.

  LATIGO's "Depth" control allows you to move the entire kit or individual instruments between the front and back of the virtual stage. It's an excellent tool for creating just the right space in the arrangement. Every style phrase can be dragged straight into your DAW, so you can edit rhythms, change instruments, or layer with your favorite drum plugins while maintaining LATIGO's core vibe.

  Quickly reshape the mix of your percussion with six mix presets that control an under-the-hood multitrack console: Vanilla, Slam, Trippy, Vintage, HiFi, and Tape. Jump from clean and modern to gritty and saturated in seconds.
specs: |-
  - Instruments: 3 x Conga, Maracas, Cabasa, Tambourine, Claves, Cowbells, Claps
  - 460 phrase performances in 20 player styles with real human feel, produced by Nate Williams (ex-Jamiroquai)
  - Multichannel mix console under the hood with 6 mix presets (Vanilla, Slam, Trippy, Vintage, HiFi, Tape)
  - "Depth" control moves the sound forward or back in the virtual room
  - Drag and drop MIDI of every style phrase into the DAW
  - Operating systems: Windows 10 to Windows 11, macOS Big Sur (11) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB RAM
  - 1 GB free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 3, AAX, AU 2 and VST 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App, or downloadable installer file
  - Authorization: quick authorization via the UJAM App, or email and password within the plug-in
  - Supported standards: MIDI
  - Works on macOS and Windows with all major DAWs, including Ableton Live, Logic Pro, Pro Tools, FL Studio, Cubase, Studio One, Bitwig, Reaper and Reason
  - All MIDI phrases and included sounds are royalty-free
