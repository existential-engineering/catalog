details: |-
  TrackGate is a gate/expander plugin with circuit-modeled processing and automatic noise detection. Features include zero-latency capability with variable lookahead, external sidechain support, two-band sidechain EQ, sample-accurate MIDI triggering, and ducking mode. Mac Retina support is included. Windows: VST, VST3, AAX (32+64bit), RTAS (32bit); Vista, Windows 7/8/10, 32 and 64-bit. Mac: VST, VST3, AU, AAX (32+64bit), RTAS (32bit); OS 10.7+, Intel and Apple Silicon.
