description: TrackGate is a professional gate and expander plugin offering circuit modeling, automatic noise detection, and zero-latency operation with variable lookahead as a real replacement for console and outboard gate/expanders.
details: |-
  Gating and Expansion are easy processes to overlook. Until you need them. And then a good gate can make the difference between re-recording and a great mix.

  Large-format console users have had the luxury of a decent gate to-hand for years, but in the box things didn't necessarily sound quite as good.

  So DMGAudio applied the same obsession with circuit modelling to gates and expanders, and the result is TrackGate.

  Latency goes down to zero, CPU usage is frighteningly low, and it sounds fantastic, fixing gating and expansion problems that can often leave you struggling to solve with other gates. Good sounding MIDI Gating and Ducking are also often hard to achieve; TrackGate makes it simple.
specs: |-
  - State of the art gating and expansion
  - Noise detector for automatic gating
  - Quick, simple, ergonomic interface
  - Circuit models of classic gates
  - Ultra-low attack times in circuit model modes
  - External sidechain for triggered gating
  - Sample-accurate MIDI triggering as gate or ducker
  - Two-band sidechain EQ
  - Configurable down to zero-latency
  - Variable lookahead to avoid losing transients
  - Ducking mode
  - Automatic detection of noise in signals
  - Mac Retina support
  - Autolisten for configuring filters
