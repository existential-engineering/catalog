description: TrackGate is a professional gate and expander plugin offering circuit modeling, automatic noise detection, and zero-latency operation with variable lookahead as a real replacement for console and outboard gate/expanders.
details: |-
  TrackGate is a gate/expander plugin with circuit-modeled processing and automatic noise detection. Features include zero-latency capability with variable lookahead, external sidechain support, two-band sidechain EQ, sample-accurate MIDI triggering, and ducking mode. Mac Retina support is included.
