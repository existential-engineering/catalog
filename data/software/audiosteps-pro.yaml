details: |-
  Audiosteps gives hands on access to thousands of footsteps with different
  walking speeds, varied behaviors (walk, break, scuff, tread), and clumsiness.

  Key features: get access instantaneously to thousands of footsteps including
  different walking speeds. Unique recording setup control to change mic
  perspective and footstep perceived distance. Pitch control and randomization.
  Envelope control for each walking type. MIDI in/MIDI out for unlimited control
  surface possibilities as well as mixing synchronicity. Preset system to speed
  up recurrent work. Instant preview for fast browsing. Unique MIDI note off
  mode to offer instant sounding flexibility & soon to come tablet control
  (ios/android).

  Audiosteps propose two very unique features: mic perspective: you can choose
  continuously from close range to distant range. Hearing distance: you can
  choose continuously from close to distant hearing.
specs: |-
  - Thousands of footsteps with different walking speeds
  - Multiple behaviors (walk, break, scuff, tread)
  - Pitch control and randomization
  - Envelope control for each walking type
  - MIDI in/MIDI out
  - Preset system
  - Instant preview
  - MIDI note off mode
  - Mic perspective control (close to distant range)
  - Hearing distance control (close to distant)
  - Clumsiness variations
