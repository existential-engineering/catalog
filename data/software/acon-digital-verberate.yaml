description: Acon Digital Verberate is an algorithmic reverb plug-in that simulates real acoustical spaces with a new degree of realism. Verberate is available for PC and Macintosh and supports the VST, AAX and AU plug-in formats.
details: |-
  Reverb isn't just an effect, it's the soul of your sound. Verberate takes this to heart, delivering algorithmic reverb that authentically recreates real acoustic environments with unmatched realism. The original Verberate set a new standard for sound quality, and now Version 2 elevates the experience even further.

  Verberate has the groundbreaking Vivid Hall algorithm at its core, which introduces time variance to eliminate the mechanical feel often found in convolution-based reverbs. The result is lush, natural-sounding reverb tails that maintain the clarity and density of the original.

  Verberate 2's Vivid Hall algorithm models the subtle variations found in real acoustical environments, like air movement or shifting audiences, without introducing artifacts such as chorusing or pitch drift. This results in a more natural and realistic reverb tail, especially at the fade-out.

  It also introduces Dispersion, simulating how high frequencies travel faster than lows in mechanical plates, ideal for authentic plate reverb tones. Paired with the decay editor, it reproduces the extended high-frequency decay typical of classic plates. The new Swirl parameter recreates the modulation textures found in vintage digital reverb units.

  The 15 early reflection patterns offered are algorithmic, calculated in real time and applied using convolution. A dense and resonance free late reverb tail follows the early reflections, resulting in extremely convincing room simulations with impressive depth combined with the flexibility algorithmic reverbs are known for. A large catalog of factory presets is delivered with Verberate 2 and a clear graphical user interface simplifies the search for a specific reverb quality.
specs: |-
  - Two different late reverb algorithms: the new Vivid Hall and the Legacy Hall from version 1
  - Vivid Hall is time variant and resonance free
  - Independent early reflections and reverberation tail processors
  - True stereo processing
  - Realistic early reflections that blend into the mix without unpleasant comb filter effects
  - Dense late reverberation tails
  - Able to model frequency dispersion in mechanical plate reverbs
  - Optional swirl effect models the frequency modulated cloud-like reverb tails of vintage digital reverb units
  - 15 algorithmic early reflection patterns calculated in real time and applied using convolution
  - Uncluttered user interface
  - Graphical visualization of equalizer frequency response and frequency dependent reverberation times
  - Preset manager and a large number of factory presets
  - Save, load and categorize user presets
  - Supports sampling rates up to 96 kHz
  - Mono and stereo (true stereo processing)
  - Native 32 bit and 64 bit versions on Windows; macOS version runs natively on ARM64 and Intel
  - Windows 10 / 11, Intel Core i3 or AMD multi-core processor, 1 GB RAM, 1 GB free HD space
  - macOS / OS X 10.13 or later, 1 GB RAM, 1 GB free HD space
  - Supported hosts include Logic Pro, Pro Tools, Ableton Live, Cubase, Nuendo, Studio One, Reaper, FL Studio, Luna, Adobe Audition, Adobe Premiere, DaVinci Resolve, Reason and Media Composer
