description: Acon Digital Verberate is an algorithmic reverb plug-in that simulates real acoustical spaces with a new degree of realism. Verberate is available for PC and Macintosh and supports the VST, VST3, AAX and AU plug-in formats. Both 32 bit and 64 bit versions are available.
details: |-
  Reverb isn't just an effect, it's the soul of your sound. Verberate delivers algorithmic reverb that authentically recreates real acoustic environments with unmatched realism. The original Verberate set a new standard for sound quality, and Version 2 elevates the experience even further.

  Verberate has the groundbreaking Vivid Hall algorithm at its core, which introduces time variance to eliminate the mechanical feel often found in convolution-based reverbs. The result is lush, natural-sounding reverb tails that maintain the clarity and density of the original. The Vivid Hall algorithm models the subtle variations found in real acoustical environments, such as air movement or shifting audiences, without introducing artifacts such as chorusing or pitch drift. This results in a more natural and realistic reverb tail, especially at the fade-out.

  Verberate 2 also introduces Dispersion, simulating how high frequencies travel faster than lows in mechanical plates, which is ideal for authentic plate reverb tones. Paired with the decay editor, it reproduces the extended high-frequency decay typical of classic plates. The new Swirl parameter recreates the modulation textures found in vintage digital reverb units.

  The 15 early reflection patterns offered are algorithmic, calculated in real time and applied using convolution. A dense and resonance free late reverb tail follows the early reflections, resulting in extremely convincing room simulations with impressive depth combined with the flexibility algorithmic reverbs are known for. A large catalog of factory presets is delivered with Verberate 2, and a clear and to-the-point graphical user interface simplifies the search for a specific reverb quality.

  Acon Digital Verberate 2 is available as VST, VST3 or AAX for both Windows and Mac, or as AU plug-ins for Mac. There are 32 and 64 bit versions for Windows. The Mac version is 64 bit and runs natively on both ARM (such as Apple M1) and Intel processors. Verberate 2 supports mono and stereo audio formats, and it was nominated for the NAMM TEC Award in the Signal Processing Software (Effects) category.
specs: |-
  - Two different late reverb algorithms: the new Vivid Hall and the Legacy Hall from version 1
  - Vivid Hall is time variant and resonance free
  - Independent early reflections and reverberation tail processors
  - True stereo processing
  - Realistic early reflections that blend into the mix without unpleasant comb filter effects
  - Dense late reverberation tails
  - Able to model frequency dispersion in mechanical plate reverbs
  - 15 algorithmic early reflection patterns, calculated in real time and applied using convolution
  - Optional swirl effect models the frequency modulated cloud-like reverb tails of vintage digital reverb units
  - Uncluttered user interface
  - Graphical visualization of equalizer frequency response and frequency dependent reverberation times
  - Preset manager and a large number of factory presets
  - Save, load and categorize user presets
  - Available as VST, VST3 or AAX plug-ins on PC (Windows)
  - Available as VST, VST3, AAX or AU plug-ins on Apple Macintosh (macOS)
  - Native 32 bit or 64 bit versions of all plug-ins are available
  - Supports sampling rates up to 96 kHz
  - Mono and stereo (true stereo processing)
  - Windows: Windows 10 / 11, Intel Core i3 or AMD multi-core processor (Intel Core i5 or faster recommended)
  - Windows: 1366 x 768 display resolution (1920 x 1080 or higher recommended), 1 GB RAM (4 GB or more recommended), 1 GB free HD space
  - Windows: a host application compatible with (32 bit or 64 bit) VST, VST3 or AAX (Pro Tools 2018 or later)
  - macOS: macOS / OS X 10.13 or later, runs natively on ARM64 and Intel
  - macOS: 1 GB RAM (4 GB or more recommended), 1 GB free HD space
  - macOS: a host application compatible with (64 bit) AU, VST, VST3 or AAX (Pro Tools 2018 or later)
  - Supported hosts: Logic Pro, Pro Tools, Ableton Live, Cubase, Nuendo, Studio One, Reaper, FL Studio, Luna, Adobe Audition, Adobe Premiere, DaVinci Resolve, Reason, Media Composer
