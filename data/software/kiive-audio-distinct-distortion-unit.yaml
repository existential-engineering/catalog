description: Distinct is a saturation and distortion plugin based on the
  harmonic saturation of a modern analog modular channel unit, with HF and LF
  shaping controls before the distortion stage.
details: |-
  Based on the incredible harmonic saturation found in a modern analog Modular Channel unit. "Distinct!" packs all of those rich harmonic characteristics into an easy to use plugin. Create subtle saturation to warm up drums, vocals and mix bus, or drive this plugin into oblivion to create crazy fuzz bass tones, distorted vocal fx and insane synth sounds. Use the added HF and LF knob to shape your sound before hitting the distortion.
