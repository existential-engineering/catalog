details: |-
  Introducing the ultimate retro-analog drum module plugin, now available as a VST, vst3, and AU plugin for windows and macos. Our 606 plugin instrument offers 18 variations of the original drum kit that came with the classic drum machine.

  With its authentic sound and versatile features, this plugin is perfect for producers, beatmakers, and musicians who want to add that iconic 606 sound to their tracks. Whether you're looking for crisp hi-hats, punchy kicks, or snappy snares, our tr-606 plugin instrument has got you covered.

  It's easy to use, with intuitive controls that allow you to tweak the sound to your liking. With its modern interface and sleek design, our tr-606 plugin instrument is a must-have for any music production setup.

  It's the perfect tool for creating everything from classic techno to modern hip-hop beats.

  The original 606 drum kit. 18 variations of the 606 drum kit processed via tubes, amps, cassette, and dsp. Multi-lfo. Sub, distortion, delay, and reverb. Vinyl crackles simulator that morphs over time. Tape hiss generator. Lowpass/highpass filter. Low-cpu usage. Amplitude range controls. 3 voice modes: polyphonic, monophonic, and legato.
