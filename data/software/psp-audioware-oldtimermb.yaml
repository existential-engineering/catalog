description: PSP oldTimerMB is a vintage-style multi-band compressor designed for demanding track processing, buss/mix compression, and mastering. Based on the PSP oldTimer compressor algorithm, it delivers a musical and warm sounding processor with switchable and adjustable output valve emulation.
details: |-
  PSP oldTimerMB is a vintage-style multi-band compressor designed for demanding track processing, buss/mix compression, and mastering. It is based on the multi-band compression algorithm derived from PSP's acclaimed oldTimer compressor.

  The plugin features switchable and adjustable output valve emulation, a stereo spread feature per band, and adjustable filter slope, making it suitable for a wide range of material from individual tracks to full mixes and mastering applications.

  Licensing uses iLok License Manager (no hardware dongle needed). Up to 3 activation locations. 30-day trial available.
