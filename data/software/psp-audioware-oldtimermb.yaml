description: PSP oldTimerMB is a vintage-style multi-band compressor designed for demanding track processing, buss/mix compression, and mastering. Based on the PSP oldTimer compressor algorithm, it delivers a musical and warm sounding processor with switchable and adjustable output valve emulation.
details: |-
  PSP oldTimerMB is a vintage-style multi-band compressor designed for demanding track processing, buss / mix compression, and mastering. The aim in developing this plug-in was to design a high end multi-band processor based on the algorithm from PSP's best-selling oldTimer compressor.

  The result is a musical and warm sounding processor with a range of controls making it a vital tool for virtually any kind of music. The switchable and adjustable output valve emulation stage offers a choice of additional colors to the sound.
specs: |-
  - Multi-band compressor based on the algorithm from the PSP oldTimer compressor
  - Switchable and adjustable output valve emulation stage
  - Adjustable filter slope
  - Stereo spread control for each band
  - Windows 7 to Windows 11, 64-bit VST, VST3 and AAX (Pro Tools) hosts
  - macOS 10.14 to macOS 15 Sequoia, Intel and Apple Silicon, 64-bit AudioUnit, VST, VST3 and AAX (Pro Tools) hosts
  - iLok License Manager authorisation, no hardware dongle required
  - License can be activated in 3 separate locations (computer or iLok dongle 2nd generation or above)
