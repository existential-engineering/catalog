description: Drifter is a modulation effect that applies continuously evolving movement to level, pan, pitch, tone, phase, frequency, harmonics and filtering. Global Depth and Speed controls drive every target, with individual sliders for fine adjustment.
details: |-
  Drifter adds movement and character to audio that sounds static, using a set of evolving modulators that create subtle organic shifts in tone and texture. The result ranges from the gentle pitch wobble of a classic analog synth to the natural variation of a live performer, and suits atmospheric pads, percussion and digital instruments alike.

  Beyond subtle nuance, the plugin can push a track in new directions, from the pitch imperfections of an old tape machine to a wider, more pronounced wobble reminiscent of lo-fi recordings, worn vinyl and vintage gear. Pushing the settings further introduces a sense of groove to otherwise predictable loops, and modulations can be stacked, for example a gentle frequency shift combined with saturation and pushed harmonics.

  A central control is tied to many parameters at once. Depth sets how much modulation is applied globally and Speed sets the rate of movement, while dedicated sliders beneath fine tune how much modulation reaches each target.

  The lower half of the interface splits the parameters into Natural and Creative groups. Natural covers Level, Pan, Pitch and Tone (EQ), emulating the subtle oscillations of analog circuitry and acoustic performance, and Creative covers Phase (an all-pass filter), Shift (frequency), Shape (harmonics) and Filter (high pass and low pass) for more experimental processing.

  The interface is built on vector graphics and is resizable, with live metering and a central visualizer showing the processing in real time. Automatic Gain Compensation keeps levels stable while the sound is modulated, and AB comparison, copy and paste, and undo and redo are available alongside a factory preset library.
specs: |-
  - Multi-parameter modulation plugin for evolving organic movement
  - Global Depth and Speed controls
  - Independent modulation sliders for all targets
  - Natural modulation: Level, Pan, Pitch and Tone
  - Creative modulation: Phase, Shift, Shape and Filter
  - Automatic Gain Compensation
  - Independent input and output gain
  - AB comparison, copy and paste, undo and redo
  - Resizable vector interface with live metering and a central visualizer
  - Factory presets included
  - PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Intel and Apple Silicon Mac CPUs supported, including native AAX
