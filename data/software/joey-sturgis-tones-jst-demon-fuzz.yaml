details: |-
  JST Demon Fuzz is a beautifully dirty, texture-rich distortion plugin for tone design.
  Inspired by the designs of fuzz pedals, JST Demon Fuzz features three distinct tones that mix the smooth, harmonic sustain of a fuzz effect with the grit and depth of distortion, creating the ideal solution for adding bite or saturation to your mix.
  JST · JST Demon Fuzz
  JST Demon Fuzz features a three-way toggle that offers Normal, Bass Boost, and Dry options. Additional Volume, Tone, and Sustain controls provide even more tweaking. Dime the output to hit your signal harder; dial back the Tone to muddy the distortion, or turn it up to add more top end; max the Sustain to more resonance, or turn it down to clean it up just slightly.
  ADVANCED FEATURES
  In addition to the base features on the pedal, the “Advanced” tab opens up all the customization you could ask for:
  Input & Output Control
  Noise Gate
  Mix knob to blend the dry and processed signals
  High Pass & Low Pass filter slider
  Polarity options
  Compression
  Character to control the sound of the distortion
  Mids to control how much the mids are cut or boosted
  Tone button to enable or disable the tone circuit
  “Wicker” to open up the frequency bandwidth for a clear top end
  “Alt Circuit” to enable or disable an alternative fuzz circuit
  Plug and play with your favorite Toneforge or Bassforge Amp Sim, load up presets, or tweak to perfection to create the most sinister sound you can find - the choice is yours! JST Demon Fuzz is perfect for:
  Guitars
  Bass
  Synths
  Sound Design
  Effects
  Drums
  Sculpt your ideal tone with JST Demon Fuzz.
  WHAT YOU’LL GET
