description: Nembrini Audio MP1 Pro Guitar Amplifier plugin is based on an ADA
  MP1 preamplifier, billed as the most tonally flexible guitar amplification
  since the 80s. It features Tri-State Voicing, a virtual EL34 power amp,
  cabinets, an impulse response loader and a full effects chain.
details: |-
  Nembrini Audio MP1 Pro Guitar Amplifier plugin is based on an ADA MP1 preamplifier, the most tonally flexible guitar amplification since the 80s, now a plugin.

  Nembrini Audio MP1 Pro features a Tri-State Voicing selection that allows you to choose between Distortion Tube, Clean Tube, or Solid State virtual circuits. The power amplifier is powered by four EL34 virtual tubes with presence, resonance, volume and power switch in class AB push-pull configuration.

  The effects chain covers a digital delay whose Filter makes the delay Lo-Fi and whose Offset creates a time offset in the left and right delay sections, analog modulations with selectable Chorus or Tremolo, and an ambient Hall reverb algorithm.

  Filters include a Cleaner with a Tight filter suitable for 7 and 8 string guitars and low and high cut filters pre and post amplifier, an analog noise gate tuned for guitar and bass with gate speed control, and a studio compressor to keep your dynamics in check.

  Nembrini Audio MP1 Pro Guitar Amplifier features six different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs, and an Impulse Loader that lets you load up to three third-party impulse responses blended with volume, pan, phase, solo and mute controls.
specs: |-
  - Preamplifier: Tri-State Voicing selection between Distortion Tube, Clean Tube or Solid State virtual circuits
  - Power Amplifier: four EL34 virtual tubes with presence, resonance, volume and power switch in class AB push-pull configuration
  - Digital Delay: Filter makes the delay Lo-Fi and Offset creates a time offset in left/right delay sections
  - Analog Modulations: selectable Chorus or Tremolo
  - Ambient Reverb: Hall reverb algorithm
  - Cleaner filters: Tight filter suitable for 7/8 string guitars, plus low and high cut filters pre and post amplifier
  - Analog Noise Gate tuned for guitar and bass with gate speed control
  - Studio Compressor for dynamics control
  - Cabinets: six different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs
  - Impulse Response Loader: up to three third-party impulse responses blendable with volume, pan, phase, solo and mute controls
  - Bypass for the cabinets section and impulse loader
  - Plugin Formats: a VST2, VST3, AAX or AudioUnits compatible host
  - System: an Intel compatible or Apple Silicon CPU, 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
