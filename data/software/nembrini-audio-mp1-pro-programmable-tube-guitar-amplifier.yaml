description: Nembrini Audio MP1 Pro is a plugin modeled on the ADA MP1 preamplifier, delivering "The Most Tonally Flexible Guitar Amplification Since the 80's" in plugin form with tri-state voicing, a full power amplifier section, built-in effects, and an impulse response loader.
details:
  - The Nembrini Audio MP1 Pro is a comprehensive guitar amplifier plugin modeled on the legendary ADA MP1 preamplifier — one of the most versatile rack-mount preamps of the 1980s. The plugin faithfully recreates the original's Tri-State Voicing system, letting players switch between Distortion Tube, Clean Tube, and Solid State virtual circuits to cover an enormous tonal range from sparkling cleans to aggressive high-gain tones.
  - The plugin includes a full power amplifier section built around four virtual EL34 tubes in a class AB push-pull configuration, complete with presence, resonance, and volume controls. This gives the plugin the feel and response of a real power stage, not just a preamp model in isolation.
  - "A suite of built-in effects rounds out the signal chain: digital delay with a lo-fi filter and time offset, analog modulations (switchable between Chorus and Tremolo), an ambient hall reverb algorithm, an analog noise gate with adjustable gate speed, and a studio compressor for dynamic control. A Tight filter with pre/post-amp placement options is also included for extended-range guitars (7- and 8-string)."
  - For cabinet and speaker simulation, the MP1 Pro offers six guitar cabinet models paired with four microphone emulations, each with continuous on/off axis positioning and distance adjustment. An impulse response loader supports up to three third-party IRs simultaneously, with individual volume, pan, phase, solo, and mute controls plus blending capabilities.
  - The plugin is available as VST2, VST3, AAX, and Audio Units for 64-bit DAWs on Mac (10.13+) and Windows (7+), and also as a standalone application. An iOS version for iPhone and iPad is available through the Apple App Store.
specs: |-
  - Plugin formats: VST2, VST3, AAX, Audio Units
  - Standalone application included
  - Mac OS 10.13 or newer (Intel and Apple Silicon)
  - Windows 7 or newer (64-bit)
