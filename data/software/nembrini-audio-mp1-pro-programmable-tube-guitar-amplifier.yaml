  - Four microphone emulations with axis and distance controls
  - IR Loader: up to three third-party impulse responses with blending
  - Built-in digital delay, chorus/tremolo, hall reverb, noise gate, compressor
  - Tight filter for 7/8-string guitars (pre/post-amp placement)
  - Version: 1.0.8
