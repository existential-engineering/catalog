details: |-
  LANDR Guitar is a virtual guitar instrument that weaves guitar riffs recorded by world-class guitarists into a track. Curated loops, embellishments and effects accommodate a broad range of genres and playing styles, so a producer can discover and arrange guitar flourishes without playing the instrument.

  Playback is mapped across the keyboard. White keys trigger longer loops that give full riffs in a broad range of styles, genres and phasings, while orange keys add embellishments such as bends and trills to accentuate riffs and create realism. A further set of keys controls five onboard FX and manipulates loop parameters like speed, sync and octave.

  The instrument ships with sets of guitar loops recorded by world-class guitarists across eight distinct styles: SLATE (folk/rock), STEEL (hard distortion), SKYLINE (global/dub/urban), GOLD (pop/mainstage), GLIMMER (ambient/spectral), SPIRIT (funk/soul/jazz), SLIDE (blues) and SOLAR (Latin).

  Multiple complementary guitar loops can be played at once because every set automatically matches the project's tempo and key, so composition and arrangement are possible with no music theory or guitar knowledge required.

  Each set can be customised through an effects pedalboard that shapes tone, drive, movement, echo and space, and modifier keys can be applied to any sound to change hold and sync functions as well as play direction, speed and octave. LANDR Guitar is also included with a LANDR Studio subscription.
specs: |-
  - White keys trigger longer loops for full riffs across styles, genres and phasings
  - Orange keys add embellishments such as bends and trills
  - 5 onboard FX plus modifiers for loop speed, sync and octave
  - 8 genre sets: SLATE, STEEL, SKYLINE, GOLD, GLIMMER, SPIRIT, SLIDE, SOLAR
  - Sets automatically match the project's tempo and key
  - Custom effects pedalboard shaping tone, drive, movement, echo and space
  - Modifier keys for hold, sync, play direction, speed and octave
  - macOS X 10.14 or higher, Apple Silicon native or Intel (VST3, AU, AAX)
  - Windows 10 (64-bit) or higher (VST3, AAX)
