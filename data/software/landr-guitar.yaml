description: Virtual guitar instrument featuring riffs recorded by world-class guitarists with curated loops, embellishments, and effects supporting 8 genre styles. Auto-syncs to project tempo and key.
details: |-
  Virtual guitar instrument with riffs recorded by world-class guitarists. Curated loops, embellishments, and effects accommodate a broad range of genres and playing styles. No music theory or guitar knowledge required.

  8 genre styles: SLATE (folk/rock), STEEL (hard distortion), SKYLINE (global/dub/urban), GOLD (pop), GLIMMER (ambient), SPIRIT (funk/soul/jazz), SLIDE (blues), SOLAR (Latin). White keys trigger riffs, orange keys add embellishments (bends, trills). 5 onboard effects with customizable parameters. Auto-sync to project tempo and key. Requires macOS 10.14+ or Windows 10 64-bit+.
specs: |-
  - Formats on macOS: VST3, AU, AAX (Apple Silicon Native, Intel)
  - Formats on Windows: VST3, AAX
  - macOS 10.14 or higher
  - Windows 10 (64-bit) or higher
  - 8 guitar style sets: SLATE, STEEL, SKYLINE, GOLD, GLIMMER, SPIRIT, SLIDE, SOLAR
  - White keys trigger loops, orange keys add embellishments
  - 5 onboard effects
  - Automatic tempo and key matching
