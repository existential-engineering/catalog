description: "Virtual guitar instrument featuring riffs recorded by world-class
  guitarists with curated loops, embellishments, and effects supporting 8 genre
  styles. Auto-syncs to project tempo and key."
details: |-
  8 genre styles: SLATE (folk/rock), STEEL (hard distortion), SKYLINE (global/dub/urban), GOLD (pop), GLIMMER (ambient), SPIRIT (funk/soul/jazz), SLIDE (blues), SOLAR (Latin). White keys trigger riffs, orange keys add embellishments. 5 onboard effects. Auto-sync to project tempo and key. Requires macOS 10.14+ or Windows 10 64-bit+.
