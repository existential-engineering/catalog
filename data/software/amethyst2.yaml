details: |-
  Amethyst is a latest acustica's high performance channel-strip featuring three preamps, 4 filters, four band parametric equalizer and an improved compressor module.

  The 9098 preamp is clean and linear. The 2500 mix preamp has more transient reproduction and is quite clean. The 2500 bus preamp is characterized by a low distortion and harmonics are more stark, also is more colored than 9098.

  The low-pass 1 filter is a variable frequency filter with range from 60 hz to 240 hz. The low-pass 2 filter is a fixed frequency filter at 10 khz. The high-pass 1 filter is a variable frequency filter with range from 27 hz to 1000 hz. The high-pass 2 filter is a fixed frequency filter at 80 hz.

  Low band: from 27 hz to 1000 hz with gain from -12db to +12db and q control from 0.2 to 1.7 plus switchable to shelving. Low mid band: from 27 hz to 1000 hz with gain from -12db to +12db and q control from 0.4 to 3.5. High mid band: from 630 hz to 20000 hz with gain from -12db to +12db and q control from 0.4 to 3.5. High band: from 630 hz to 20000 hz with gain from -12db to +12db and q control from 0.2 to 1.7 plus switchable to shelving.

  Compressor features include threshold from -30 db to 18 db, ratio from 1:2:1 to 16:1, attack from 0.3 ms (fast) to 300 ms (slow), release from 0.1 ms (fast) to 10 ms (slow), makeup from 0 to +24 db, insane mode to increase accuracy and speed of the compressor, and hard knee (hk) mode.
specs: |-
  - Three preamps (9098, 2500 mix, 2500 bus)
  - Four filters (low-pass 1, low-pass 2, high-pass 1, high-pass 2)
  - Four band parametric equalizer
  - Improved compressor module
  - VST plugin
  - Audio units plugin
  - AAX plugin
  - Macos and windows compatible
