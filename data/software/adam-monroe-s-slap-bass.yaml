details: >-
  Adam monroe's slap bass is a 32/64-bit sample library for VST, AU, and
  kontakt. This library was created by sampling a fender jazz bass with carvin
  j99 pickups and ghs boomer strings, and features slap/pop articulations,
  slides, and amp+di channels.


  Adam monroe's slap bass by adam monroe music is a virtual instrument audio
  plugin for macos and windows. It functions as a VST plugin, an audio units
  plugin and an AAX plugin.
specs: |-
  - 32/64-bit sample library
  - VST plugin
  - Audio units plugin
  - AAX plugin
  - Kontakt compatible
  - Slap/pop articulations
  - Slides
  - Amp+di channels
