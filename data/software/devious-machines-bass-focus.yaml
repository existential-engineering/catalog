details: |-
  Bass Focus is an advanced low frequency enhancer for mixing and mastering.
  With Bass Focus, your bass will sound fuller, louder, and more powerful,
  without losing its original character or identity. And on small speakers, bass
  focus reveals low end which would otherwise be lost, ensuring your music
  sounds great everywhere.

  Bass focus can enhance individual instruments or an entire mix. It adds power
  to 808s, solidifies kick drums, thickens synths and bass guitars, and much
  more. At the mastering stage, it can be used to improve mix translation and
  presence, thicken low end, or recover headroom in mixes with too much sub.

  Bass focus generates harmonics which are higher in frequency than the original
  bass, but are perceived as part of the same sound. This makes the original low
  frequency sound louder, increasing perceived presence and power. This
  psychoacoustic effect works even when the original frequency isn't audible,
  such as when listening on smaller speakers.

  Bass focus's unique algorithm goes beyond simple saturation, generating clean,
  controllable harmonics which are independent of input level. It offers precise
  control over the frequencies affected, the balance of even and odd harmonics,
  and the richness of the generated spectrum. Three output faders allow the
  clean, harmonic and top end signals to be balanced independently, and a
  helpful spectrum display offers visual feedback.
specs: |-
  - Low frequency enhancement
  - Harmonic generation
  - Even and odd harmonics control
  - Frequency control
  - Three output faders
  - Spectrum display
