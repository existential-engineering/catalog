details: |-
  After more than 7 years, thousands of downloads, one of our most successful
  product is back, even stronger and bigger. Alien 303 v1 becomes synonymous of
  perfect fast and stable bassline synthesizer for psytrance, trance, and all
  edm styles as well as new kind of acid synthesizer just in one machine.

  With 2 oscillators you can create even bigger basslines, more styles of bass
  perfect for full-on psytrance, goatrance, dark psy, psycore or hitech as well
  as trance, house, techno and all edm styles. You can select between two modes,
  classic stable and analog with slight detuning and analog style of sound.

  While alien 303 v1 had just one filter, v2 have 9 filters. You can select from
  14 oscillator waveforms, rotate oscillator phases, choose semitones and more.

  Preset manager with 55 presets (22 acid lead presets useable for all edm
  styles, 33 bass presets for psytrance, darkpsy, goa trance, hitech, psycore,
  trance, house, techno, and all edm styles).
