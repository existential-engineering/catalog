details: |-
  909 Lab lets you play with the sound of the tr-909 as a chromatic instrument.
  Each tonal sound of the 909 has been tuned to perfection so you can play your
  favorite 909 sounds in key with your track using your piano roll!

  You can easily create punchy 909 basslines with it. Unlike the original
  machine, you have full control of each drum sound: easily shape and modify
  their tonal quality with the easy-to-use interface.

  Just select the sound you want, shape it and you're set.
specs: |-
  - All 11 original tr-909 sounds
  - Tonal drum sounds key mapped to piano roll
  - Tonal shaper
  - Amp floor and ceiling controls
  - Saturation
  - Reverb
