description: pure:limit is an AI-powered limiter plug-in that tames peaks,
  balances dynamics and finds the right level for a mix at the touch of one
  button. Automatic parametrization and genre-based profiles deliver a finished
  level without detailed manual setup.
details: |-
  pure:limit is aimed at situations where time, focus or workflow call for a tool that delivers straightforward results. Its selection of intelligent, genre-based profiles covers material ranging from soulful vocals and bass-heavy samples to distorted guitars and a smooth podcast voice, so the same plug-in can be used across music and spoken-word productions.

  Correct limiting is what makes a mix translate across speaker systems. pure:limit applies the finishing touches without pulling the user into detailed parameter work, keeping the level and dynamics of a mix in the sweet spot before a track leaves the (home) studio.

  Because limiting can also be used creatively, two sound-shaping controls sit alongside the automatic processing. The Style selector changes how forcefully the limiter hits the signal: soft keeps a track natural and clean, neutral balances punch and transparency, and hard intensifies the material for an aggressive, dense quality. Raising the inflate parameter makes the result richer and more vibrant.
specs: |-
  - Automatic parametrization for high-quality results
  - Intelligent processing with genre-based profiles
  - Style selector (soft, neutral, hard) and inflate parameter for sound-shaping
  - Plug-in formats (Mac): VST, VST3, AU, AAX
  - Plug-in formats (Windows): VST, VST3, AAX
  - Supported channel formats: mono, stereo
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok
  - Apple Silicon support: native
  - Windows 10 (64 bit) or macOS 10.9 and later
  - CPU: Intel Core (i5) or Apple Silicon
  - GPU: OpenGL version 3.2 or later
