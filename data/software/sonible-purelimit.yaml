description: pure:limit effortlessly tames peaks, balances dynamics and finds the right level for your mix, all at the touch of one button.
details: |-
  pure:limit is the right limiter when your time, focus or workflow requires a tool that delivers straightforward results. No matter whether your mix features soulful vocals, bass- heavy samples, distorted guitars or a smooth podcast voice, pure:limit has got you covered with its selection of intelligent, genre-based profiles.

  To make a mix sound great on all speaker systems, the correct amount of limiting is essential. With pure:limit you can put the finishing touches on your sound without getting lost in details and still rest assured that the level and dynamics of every mix are in the sweet spot before any track leaves your (home)studio.

  Since limiting also can be used creatively, there are two very effective options in pure:limit for shaping the sound of your mix. Change how forcefully the limiter hits your signal with the Style selector: "Soft" works perfectly when you want to make your track sound natural and clean, "neutral" gives you a good balance between punchy and transparent, and "hard" intensifies your track, giving it an aggressive and dense quality. To make your sound richer and more vibrant, simply boost the value of the inflate parameter.
