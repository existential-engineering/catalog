description: pure:limit effortlessly tames peaks, balances dynamics and finds the right level for your mix.
details: |-
  pure:limit is the right limiter when time, focus or workflow require a tool that delivers straightforward results. No matter whether a mix features soulful vocals, bass-heavy samples, distorted guitars or a smooth podcast voice, its selection of intelligent, genre-based profiles covers the material, so the same plug-in can be optimized for all genres of music including podcasts.

  To make a mix sound great on all speaker systems, the correct amount of limiting is essential. With pure:limit the finishing touches can be put on a sound without getting lost in details, and the level and dynamics of every mix stay in the sweet spot before any track leaves the (home) studio.

  Since limiting can also be used creatively, there are two very effective options for shaping the sound of a mix. The Style selector changes how forcefully the limiter hits the signal: soft works perfectly to make a track sound natural and clean, neutral gives a good balance between punchy and transparent, and hard intensifies a track, giving it an aggressive and dense quality. To make the sound richer and more vibrant, the value of the inflate parameter is boosted.

  pure:limit is compact on the outside but packs a powerful punch within.
specs: |-
  - Automatic parametrization for high-quality results
  - Intelligent processing and genre-based profiles
  - Style selector (soft, neutral, hard) and inflate parameter for sound-shaping
