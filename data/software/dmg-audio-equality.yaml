description: "THE UNIVERSAL EQ — EQuality is designed to be the perfect EQ for
  every track of your session, delivering sound quality comparable to high-end
  console or rack gear with all the features and functionality that digital
  brings."
details: |-
  EQuality features 6 parametric bands (2 shelf/bells, 4 bell/notches) with a Q range of 0.1–50 and ±36dB gain range, plus 2 fully parametric high/low-pass filters at 6–48dB/octave slopes. It offers Linear, Analogue, and Minimum phase modes, as well as M/S (mid-side) processing for precise stereo control. A proprietary Digital+ mode provides enhanced processing quality beyond the standard prototypes. Three UI modes (full, graph, and knobs) accommodate different workflows, complemented by a high-resolution spectrum analyser with configurable readout. The plugin includes 8 A/B comparison banks, full preset management, undo/redo, autolisten mode, and configurable VU metering with K-metering support.
specs: |-
  - 6 bands: 2 shelf/bells, 4 bell/notches; Q 0.1–50, ±36dB gain
  - 2 fully parametric filters (high-pass and low-pass): 6/12/18/24/30/36/42/48 dB/oct, sweepable resonance
  - Linear, Analogue, and Minimum phase modes
  - Digital+ mode for enhanced processing quality
  - M/S (Mid/Side) processing mode
  - High-resolution spectrum analyser with tilt, smooth, and colour preferences
  - 8 A/B comparison banks
  - Three UI modes: full, graph, and knobs
  - Configurable VU metering with K-metering and variable ballistics
  - Autolisten mode for rapid frequency identification
  - Full preset management with undo/redo
  - Control linking for all EQ parameters
  - Adjustable gain-Q interaction
