description: THE UNIVERSAL EQ — EQuality is designed to be the perfect EQ for every track of your session, delivering sound quality comparable to high-end console or rack gear with all the features and functionality that digital brings.
details: |-
  EQuality has been designed to be the perfect EQ to let your mixdowns shine, with something for every track of your session, aiming to sound at least as good as any high-end console or rack gear while bringing all the features and functionality that digital brings.

  EQuality is not a model of a specific piece of hardware; it aims to be a great replacement for all your EQs, sounding as good as an EQ can sound from the bottom up, with prototypes as close to consistent analogue shapes as can be achieved digitally without spending extra CPU, and a Digital+ mode for when extra CPU is worth spending.

  The plugin offers 6 bands (2 shelf/bell, 4 bell/notch) with a +/-36dB range and Q from 0.1 to 50, plus two fully parametric high and low-pass filters with slopes from 6 to 36dB/oct and their own Q range, alongside Linear, Analogue and Minimum phase modes for master and special channels.

  M/S processing lets users process Mid, Side or the Stereo image, and the interface offers three UI modes (full, graph, knobs), a big antialiased graph, a hi-res spectrum analyser, configurable VU metering with K-metering support, 8 banks of A/B, full preset management with undo/redo, and an autolisten mode for quickly finding and adjusting frequencies.
specs: |-
  - Very low CPU usage for every track of your mix
  - Generates super-high-quality prototypes with clear undistorted top
  - Digital+ mode
  - Linear/Analogue/Minimum phase modes for master and special channels
  - 6 bands, 2 shelf/bells, 4 bell/notches, Q 0.1 to 50, +/-36dB range
  - 2 fully parametric filters (high and low-pass), 6/12/18/24/30/36dB/oct, Q 0.1 to 20
  - Three UI modes: full, graph and knobs
  - M/S processing modes
  - Adjustable gain-Q interaction for musical usage
  - Big, clear, antialiased graph
  - Hi-res spectrum analyser with range and frequency shift controls
  - Control linking for all EQ parameters
  - Configurable VU, supporting K-metering and variable ballistics
  - 8 banks of A/B
  - Full preset management system with undo/redo
  - Autolisten mode for quick finding/adjustment of frequencies
  - Clip LED
