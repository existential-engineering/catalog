details: |-
  When sound engineers for major motion pictures need a comprehensive set of
  processors for mixing 5.1 surround sound, they turn to Waves 360 surround
  tools. Conceived and created especially for surround production, 360 surround
  tools includes compression, limiting, reverb, spatial enhancement, and much
  more.

  For the creation of sophisticated, accurate surround mixes for today's
  multi-channel listening environments, absolutely nothing compares: 14
  cutting-edge audio plugins for 5.1 surround mixing.

  Includes compression, limiting, reverb, spatial enhancement, upmixing and
  more. Engineered especially for today's multi-channel listening environments.

  360 surround tools by waves is a virtual effect audio plugin for macos and
  windows. It functions as a VST plugin, an audio units plugin, a VST 3 plugin
  and an AAX plugin.
