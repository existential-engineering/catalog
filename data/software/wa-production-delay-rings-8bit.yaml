description: A bit-crushed version of the Delay Rings engine, with two independent delays that orbit the stereo field in opposite directions. Modulation, reverb, stereo width and a ducker sit alongside the delay section.
details: |-
  Delay Rings 8bit is a version of the Delay Rings dynamic delay engine reworked around bit-crushed texture. It was developed first for Japanese producers and later released more widely, and it keeps the orbiting stereo behaviour of the original while adding a pixel-art interface and a grittier tone.

  The dual-channel engine is tuned for a crisp, bit-crushed top end in the manner of early samplers and games consoles, adding harmonics and saturation to the delay repeats. It suits retro game scoring, EDM and lo-fi production alike, producing a three-dimensional field that moves rather than a static echo.

  Two independent delay engines pulse and move in a circular pattern through the stereo field. Each ring has its own Length (straight, dotted or triplet), Feedback and Gain, its own clockwise or counterclockwise orbit direction, an enable and disable switch for auditioning, and dedicated high-pass and low-pass filters for shaping the trails.

  Modulation adds shimmer or heavier warp through Depth and Rate controls. A reverb section with Dry and Wet and Time controls extends the trails, stereo width can be widened or narrowed for both delay and reverb, and a ducker lowers the delay automatically while the input signal plays, with an adjustable release.

  The interface is built on vector graphics and is resizable, with A/B comparison, copy and paste, and undo and redo for experimentation, and a pop-free bypass for auditioning or DAW automation. Factory presets are sorted into instrument banks and genre effects.
specs: |-
  - 8 bit double delay effect for spatial echo processing
  - Characterful crunchy saturated harmonics
  - Twin rings with independent gain, feedback and filter controls
  - Delay length set to straight, dotted or triplet per ring
  - Orbit each delay clockwise or counterclockwise
  - High-pass and low-pass filters on the delay trails
  - Modulation with depth and rate controls
  - Reverb with dry and wet and time controls
  - Stereo width control for delay and reverb
  - Auto-ducker module with adjustable release
  - Optional linked wet and dry gain controls
  - A/B comparison with undo and redo
  - Pop-free bypass
  - Clean, resizable interface
  - Responsive and CPU friendly
  - Flexible factory presets sorted by instrument and genre
  - Full PDF manual and tutorial video
  - Runs on both Intel and Apple Silicon CPUs
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
