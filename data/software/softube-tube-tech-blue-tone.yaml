description: Multiband compression and classic equalization with simple macro
  controls. The Tube-Tech Blue Tone plugin offers outstanding sound quality and
  an extremely fast workflow for your music productions.
details: |-
  Tube-Tech Blue Tone gives you outstanding sound quality with an ultra-fast workflow. Blue Tone features multiband compression and classic equalization with simple macro controls. It has eight unique modes with typical settings for the most common use cases. Blue Tone ensures fantastic results quickly and easily without having to start from zero and dial in multiple parameters in multiple plug-ins on each bus or channel.

  The Tube-Tech SMC 2B hardware is a staple of the world's most respected studios. Softube modeled every component and stage of this famed three-band stereo optical comp. The result is software that is indistinguishable from the hardware in Softube's tests. Blue Tone gives you the authentic sound of Tube-Tech because it is based on Softube's expertly modeled, officially licensed, and extremely popular Tube-Tech SMC 2B Multiband Compressor.

  Blue Tone's eight unique modes let you quickly handle critical mix and bus tasks that range from the low-end EQ trick to classic vocal compression sounds, multiband widening, fattening up of tracks, and more. Just select a mode and dial the amount to get the sound the pros use in seconds.

  Blue Tone's EQ section is based on the classic Tube-Tech equalizers PE 1C and ME 1B. Sought after by top-of-the-line studios through the decades, their sound enriches the textures of thousands of classic records in every genre imaginable.

  Tube-Tech Blue Tone is also available as a module for Modular, Softube's virtual Eurorack platform, and as a module for Amp Room, Softube's pro audio guitar and bass platform, where it combines with other studio effects, classic amps, cabs, and pedals.
specs: |-
  - Renowned Tube-Tech sound with easy-to-use controls
  - Created in collaboration with and officially licensed by Tube-Tech
  - Featuring the multiband compression of Tube-Tech SMC 2B and the legendary equalization of PE 1C and ME 1B
  - Eight sound enhancing modes: Vocal Clarity, Vocal Focus, Mix Bus, Mix Bus (Wide), Drum Bus, Bass Instruments, Keys/Guitar
  - Console 1-ready with modules for Amp Room and Modular included
  - Supports Softube Extended Features easy-access panels
  - Three license activations included
  - Requires a Softube account and an iLok account (no physical iLok required)
  - 20-day trial and 14-day returns
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Internet access required for downloading installers and managing licenses
