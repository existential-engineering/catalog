description: PS-3300 is an exactingly faithful virtual analog emulation of the
  colossal and ultra-rare semi-modular analog polyphonic synthesizer released by
  KORG in 1977. Cherry Audio has pulled out all the stops to accurately recreate
  and update this mythical monster synth, from its massive stacked sonic
  character and signature multiple-resonator sweeps to the considerable patching
  capabilities that distinguished the PS-3300 from all other polysynths of the
  era.
details: |-
  Before releasing its renowned line of MS monosynths, Keio Electronic Laboratories (under the KORG brand name) introduced its Polyphonic Series of analog synthesizers. The largest and most expensive was the massive PS-3300, a legendary synthesizer produced between 1977 and 1981. It is widely considered one of the most rare analog synthesizers ever made, with around 50 units produced. With its semi-modular design, flexible architecture, and a propensity for rich, sonically evolving timbres, the PS-3300 is often regarded as the holy grail of polyphonic analog synths.

  PS-3300's unique architecture set it apart from the handful of polysynths available at the time. It had three independent "signal generator" panels, each essentially a complete polyphonic synthesizer. Each of these synth panels included 12 independently tunable divide-down oscillator banks as well as independent discrete VCFs, envelope generators, and VCAs for every note. This enabled all 48 keys of the external keyboard to be simultaneously played with independent articulation. Dual LFOs and triple voltage-controllable resonators for each generator further shaped its signature tone. A dedicated master panel featured a mixer with VCAs for each of the three voice panels, sample & hold, an additional envelope generator, and two control voltage processors. It also delivered extensive modulation possibilities through an astounding 67 front-panel input/output jacks.

  Cherry Audio collaborated with the Electronic Music Education and Preservation Project (EMEAPP) to meticulously study and reproduce the exemplary PS-3300 in their collection to celebrate the legacy of this preeminent piece of synthesizer history. EMEAPP is the steward of a privately held curation of rare vintage electronic instruments and stage-used gear.

  The PS-3300 virtual instrument replicates the functionality, layout, and sonic characteristics of each of the three PSU-3301 signal generator panels, including the six-waveform oscillators; two modulation generators (LFOs); dynamic lowpass filters, envelopes, and amps; its distinguishing triple-peak resonators; independent per-note "temperament" tuning knobs; and patchable jacks (with virtual cables) for signal routing. The voice panels have been expanded with additional faculties including PS- or MS-style filter selection, tempo sync, copy/paste between panels, and temperament tuning presets.

  Similarly, the master signal mixer replicates the PSU-3302 sample & hold, a general envelope generator, and jacks for advanced sound-shaping and control. The panel has been expanded with continuously variable CV control of level, per-channel panning, bend range, and studio-quality integrated effects for chorus, delay, and reverb.
specs: |-
  - Exactingly faithful virtual analog emulation of the semi-modular analog polyphonic synthesizer released by Korg in 1977
  - Three independent "signal generator" panels, each with an oscillator, lowpass filter, three-peak resonators, envelope with velocity, amp, two mod generator LFOs, and per-note tuning
  - 3X VCOs with six waveforms: triangle, saw, rectangle (square), two preset pulse waves (with different widths), and PWM (variable-width pulse)
  - 3X resonant VCF 12 dB/oct lowpass filters with the option to select between the standard "clean" PS filter or the "crunchier" MS-style filter
  - 3X modulatable "triple resonators": 12 dB/oct bandpass filters to produce vowel and phasing tones
  - 3X discrete ADSR-type envelope modulators with velocity control, and amplitude modulation
  - 3X two syncable "mod generators" (LFOs) with output jacks: one with triangle, saw, ramp, rectangle, pink noise, and white noise, and the other with triangle waveform
  - 3X temperament section with individual tuning knobs for the 12 chromatic notes, and temperament presets for Equal Tempered, Mean Tone System, Hepatonal System, and Just Intonation
  - Copy/paste settings from one signal generator panel to another
  - Polyphonic mode with up to 24 voices of polyphony and three monophonic modes: last, low, and high note priority
  - Semi-modular synthesizer with virtual jack and cable system, featuring unlimited mults per jack and customizable (color, transparency, animation) cables
  - Master signal mixer panel with sample & hold, general envelope generator, and two control voltage (CV) processors
  - Individual channel panning
  - User-selectable bend range and master tune
  - Studio-quality integrated effects: chorus, echo with sync, and three types of reverb (spring, plate, and Galactic)
  - Over 360 professionally designed presets in a dozen categories, including a bonus Legacy collection of basic presets based on the patch sheets in the original PS-3300 Owner's Manual, a 3100-based Glissando patch, and a 432 Hz Equal Temperament patch
  - Standalone virtual instrument and plug-in versions
  - Complete MIDI control and DAW automation for all controls, with easy-to-use MIDI Learn and mapping
  - Focus zoom-in feature, as well as standard UI zoom and resize via drag
  - Complete documentation available directly online from the instrument or in downloadable PDF format
  - User-adjustable oversampling control
  - macOS requirements: macOS 10.13 or above, 64-bit required, native Apple M1 or greater processor support including Ultra, 3.4 GHz Quad-Core or M1 CPU with 8GB of RAM recommended
  - Windows requirements: Windows 7 or above (including Windows 11), 64-bit required, 3.4 GHz Quad-Core computer with 8GB of RAM recommended
  - Hard disk space: 105 MB
  - Internet connection required for product activation
