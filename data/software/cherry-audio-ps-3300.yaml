details: |-
  PS-3300 is an exactingly faithful virtual analog emulation of the colossal
  and ultra-rare semi-modular analog polyphonic synthesizer released by KORG in
  1977. It is widely considered one of the most rare analog synthesizers ever
  made, with around 50 units produced between 1977 and 1981.

  Before releasing its renowned line of MS monosynths, Keio Electronic
  Laboratories introduced its Polyphonic Series of analog synthesizers under the
  KORG brand name. The PS-3300 was the largest and most expensive model, with a
  unique architecture featuring three independent signal generator panels, each
  essentially a complete polyphonic synthesizer.

  Cherry Audio collaborated with the Electronic Music Education and Preservation
  Project (EMEAPP) to meticulously study and reproduce the exemplary PS-3300 in
  their collection, celebrating the legacy of this preeminent piece of
  synthesizer history.

  The virtual instrument features up to 24 voices of polyphony, a temperament
  section with presets including Equal Tempered, Mean Tone, and Just Intonation,
  semi-modular patching with virtual cables, and over 360 professionally
  designed presets.
specs: |-
  - Three independent signal generator panels with oscillators, filters, resonators, envelopes, and LFOs
  - 3x VCOs with six waveforms (triangle, saw, rectangle, pulse variants, PWM)
  - 3x resonant VCF 12 dB/oct lowpass filters with PS or MS-style options
  - 3x triple resonators (12 dB/oct bandpass filters)
  - 3x ADSR-type envelope modulators with velocity control
  - 3x dual syncable mod generators (LFOs)
  - Temperament section with presets (Equal Tempered, Mean Tone, Hepatonal, Just Intonation)
  - Up to 24 voices polyphony with three monophonic modes
  - Semi-modular with virtual cables (unlimited mults per jack)
  - Master signal mixer with sample and hold and envelope generator
  - Individual channel panning and user-selectable bend range
  - Studio-quality effects: chorus, echo with sync, three reverb types
  - Over 360 professionally designed presets
  - MIDI control and DAW automation with MIDI Learn
  - Focus zoom feature and standard UI zoom
