  Halo interfaces.
details: |-
  HaloVerb is a reverb processor that adds ambience and depth to recordings.

  Based on the original HaloVerb hardware implementation for Metric Halo interfaces, the HaloVerb plug-in expands on that algorithmic sound to give more flexibility and control. The reverb impulse display shows the reverberant field as adjustments are made, or the graphics can be hidden so the result is judged by ear alone.

  HaloVerb can add subtle ambience or generate the sound of a vintage echo chamber, and the extensive presets and simple UI are intended to dial in a sound quickly.

  Low and high frequency pre-filters have a graphic display, bands can be linked, reverb times run up to 7 seconds and a stereo width control is provided. The UI size is adjustable with disclosable graphs, and the MH Preset Manager provides cross-platform presets.

  Version 4 adds a VST3 version on both macOS and Windows with native Apple Silicon support for VST hosts including Steinberg products. All v4 plug-ins add undo/redo, A/B snapshots with snapshot blend, software update tracking, more flexible resizability, common controls in the header bar, improved preset management, settings copy and paste between instances, a plug-in details pane reached from the MH logo, a smaller installer download on macOS, configurable themes, selectable knob styles and user preferences for band colors, UI colors and knob rings.
specs: |-
  - World-class signal processing and workflow
  - Low and High frequency pre-filters with graphic display
  - Comprehensive linking between bands
  - Reverb impulse display to show the shape of the reverb
  - Reverb times of up to 7 seconds
  - Stereo width control
  - Many presets included
  - Adjustable UI size, disclosable graphs
  - MH Preset Manager provides cross-platform presets
  - macOS 10.10 or newer, Intel processor or Apple Silicon, AU, VST 2 and 3 or AAX (Pro Tools 11 and newer Native) host, 64 bit
  - Windows 7 or newer, Intel processor, VST or AAX (Pro Tools 10, 11 and 12 and Native) host, 64 bit
  - Requires an iLok.com account
  - License includes two activations for the account
  - iLok dongle is optional, the license can be installed on the machine, on an iLok or in the iLok Cloud
  - Only one license required, works on all supported platforms
