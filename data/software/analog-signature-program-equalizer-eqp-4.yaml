details: >-
  Program equalizer eqp-4 is a full range stereo channel unit, featuring low and
  high cut, low and high frequency boost and attenuation (shelving or peaking)
  as well as two overlapping bands of equalization.


  The two mid-range frequency sections has variable bandwidth, boost/attenuation
  (peaking) and frequency selector.


  All these features allow the program equalizer eqp-4 to handle several eq'ing
  chores, from the subtleties of mastering to radical tone shaping often needed
  during tracking.


  It is intended to recreate the warmth of classic analog hardware equalizers.


  Up to 192 khz sample rates supported. Automate any control. Factory presets.
