details: |-
  #NOSMALLTIME With Joel Wanasek Bus Glue Mix
  Most mixing engineers aren’t great at mastering, and it’s simply because we’re more like artists and less like technicians. You’re also probably sick of your masters not living up to your expectations. This design is based on top notch mastering gear backed by years of trial and error resulting in a processor that can give your mixes that “finished feeling.” #NOSMALLTIME anymore because JW BG-Mix will take your mix to a whole new level. Whatever you’ve got on your bus right now, it’s small time until you’ve put JW BG-Mix on it.
  Bus Glue Joel Wanasek is a series of bus compressor audio plugins created by Joey Sturgis Tones in collaboration with esteemed producer and mixing engineer, Joel Wanasek. The compressors are specifically designed to Joel's exacting standards as unique mixing tools and are intended to be placed on the main instrument bus / track group buses in your mixer.
  Watch the video below to hear exactly what this amazing plugin can do for your mixes.
