description: Escalator takes a complex process of saturation and reduces it down to just one knob. It sounds great on drums, vocals, strings, guitars and anything else you want to stand out in a mix.
details: |-
  One knob. Endless character. Effortless tone shaping is just a turn away with Escalator. One knob is all it takes to add warmth, grit, and energy. No complex tweaking, just turn it up and let the magic happen.

  Thick sounds, zero mud. Light settings add weight and warmth that sits perfectly in the mix, fuller and louder without losing clarity.

  Beef up your mix in seconds. Push into aggressive territory and Escalator adds grit and energy without the harshness that ruins a distorted mix.

  Works on everything. Drums. Bass. Guitars. Mix bus. Escalator adds depth and character across the board.
specs: |-
  - Single-knob interface
  - Progressive saturation, compression, distortion and clipping stages
