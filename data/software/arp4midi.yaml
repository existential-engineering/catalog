details: |-
  Arp4midi combines chris kerry's arpeggiator with contemporary synchronization
  functions, adding gate offset (e.g. Early or late) host position based sync,
  and "lobster" ("humanize") functions.

  Arp4midi includes arpeggiate and phrase modes and a 16 step sequencer
  assignable to gate or arpeggiator step.

  Arp4midi is included when you purchase talent.

  The plugin allows users to play the arpeggiator in real-time rather than
  inputting notes beforehand, and can send cc data synchronized with arp data to
  control parameters like resonance or frequency in sync with the arping.

  The gate sequencer features can be used to create syncopated rhythms against
  the rhythm of the arp.
specs: |-
  - Arpeggiator
  - Gate offset
  - Host position based sync
  - Humanize functions
  - Arpeggiate mode
  - Phrase mode
  - 16 step sequencer
  - Gate sequencer
  - Cc data output
  - MIDI FX
