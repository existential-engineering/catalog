details: |-
  Blue cat's Free Amp is a free guitar amp simulation plug-in. Using the same
  modeling technology behind the destructor and axiom software, blue cat's free
  amp offers 3 amp models for a wide range of guitar tones: the plug-in can
  produce pristine clean tones, subtle crunches or heavy distortion depending on
  the amp model and the settings dialed with the guitar-friendly tone controls.

  It includes two dozens of factory presets to get started, and additional free
  presets are available for download on the editor's website. The plug-in is
  available as a free download on bluecataudio.com. It is 100% free and does not
  require any registration or dongle to run without any limitation.

  3 amp models inspired by legendary amplifiers: classic clean, classic drive
  and modern drive. Simulations based on the destructor dynamic distortion and
  amp modeling engine.
specs: |-
  - 3 amp models
  - Guitar amp simulation
  - No latency
  - Destructor dynamic distortion and amp modeling engine
  - Guitar-friendly tone controls
  - Two dozens of factory presets
