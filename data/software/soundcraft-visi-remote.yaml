description: Remote control your mixing console
details: |-
  The Soundcraft ViSi Remote is an iPad app which provides wireless control of Soundcraft Si Expression, Si Compact, Si Performer and Vi Series consoles. ViSi Remote allows you to mix and contour your sound from anywhere in a venue without being constrained by cables. Systems can be configured to run in several ways.

  Simply connect a Wireless Router* to the HiQnet port on the console and mix remotely within minutes. * Soundcraft does not guarantee operation with all wireless routers.

  Note: The Latest software listed above is needed in order to access the ACS settings of the console. Older software versions would result in no added control benefit from ViSi Remote V1.2.4. ** Vi series consoles will work with ViSi V2.1 but have the same functionality as V1.2.4. Connection reliability has improved in ViSi 2.1 however there are no other new features for Vi Users. * How to find the version of ViSi Remote if it's already installed: 1. Start the ViSi Remote app. 2. Press the 'Devices' button in top left corner of screen to open the Devices list, if it is not already open. 3. Press the 'info' button in the bottom right of the Devices list to see the version number.

  iOS 6 or higher is required to run ViSi Remote V2.1 Note for iPad Users iPad 1 devices are not compatible with iOS 6 and cannot use the ViSi Remote V2.1 Remote App. ViSi Remote V1.2.4 is still available for iPad 1 users wishing to use the ViSi Remote App.
