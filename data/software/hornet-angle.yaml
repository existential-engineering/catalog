description: HoRNet Angle is a handy tone shaper based on the 'tilt EQ' concept, designed to adjust your track's tonal balance.
details: |-
  HoRNet Angle is a compact and incredibly useful tone shaping plugin designed to help producers and engineers achieve quick and effective frequency balance adjustments. Built around the classic concept of a tilt EQ, this plugin offers a fast, intuitive way to alter the tonal balance of your audio without the need for complex parameter tweaking. Whether you’re looking to brighten a dull track, warm up a harsh mix, or simply experiment with your overall tone, HoRNet Angle delivers musical and transparent results with minimal effort.

  At the heart of HoRNet Angle is the tilt equalizer, a unique type of EQ that modifies the frequency response of a sound by increasing or decreasing the levels of high and low frequencies around a central pivot point. Unlike traditional equalizers that allow control over frequency selection, Q factor, and gain, a tilt EQ operates by “tilting” the frequency spectrum around a fixed frequency.

  In the case of HoRNet Angle, that pivot point is set at 650Hz. Turning the “Angle” knob to the right will boost the high frequencies while simultaneously reducing the low frequencies by the same amount. Turning the knob to the left does the opposite— boosting the lows and cutting the highs. This mirrored behavior allows you to make musical tonal adjustments with a single control, simplifying the process of achieving balance between brightness and warmth.

  This makes the plugin especially useful during both mixing and mastering, where broad tonal shifts can dramatically affect the clarity, weight, and presence of a track. Whether you’re dealing with vocals that need a little air, drums that require more body, or full mixes that need better translation across playback systems, the tilt EQ offers a straightforward solution.
specs: |-
  - Tilt EQ adjustable from -18dB to +18dB.
  - Input and output gain controls with auto-gain.
  - Input and output peak meters.
  - Analog emulation based on AnalogStage’s OpAmp model.
  - Bypass button to exclude the plugin processing.
  - Mac OS X (>=10.7) and Windows support.
  - 32 and 64-bit compatibility both on Mac and Windows.
  - Audio Units VST2.4, VST3 and AAX format.
  - Apple Silicon not supported yet
