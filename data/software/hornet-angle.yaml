description: HoRNet Angle is a handy tone shaper based on the 'tilt EQ' concept, designed to adjust your track's tonal balance.
details: |-
  HoRNet Angle is a compact tone shaping plugin designed to help producers and engineers achieve quick and effective frequency balance adjustments. Built around the classic concept of a tilt EQ, it offers a fast, intuitive way to alter the tonal balance of audio without the need for complex parameter tweaking, whether brightening a dull track, warming up a harsh mix, or experimenting with overall tone.

  At the heart of the plugin is the tilt equalizer, which modifies the frequency response of a sound by increasing or decreasing the levels of high and low frequencies around a central pivot point. In HoRNet Angle that pivot is set at 650Hz: turning the Angle knob to the right boosts the high frequencies while reducing the lows by the same amount, and turning it to the left does the opposite. This mirrored behavior allows musical tonal adjustments with a single control, which is useful during both mixing and mastering where broad tonal shifts affect clarity, weight and presence.

  To make the workflow more efficient, the plugin includes input and output auto-gain features based on a 0VU reference level, keeping perceived loudness consistent as the tonal balance is adjusted. Without auto-gain, EQ changes can be misleading, since boosting high frequencies may appear to improve the sound simply because the volume increases. The auto-gain function can be toggled on or off depending on the mixing environment or preference.

  Alongside its digital tilt functionality, HoRNet Angle features a switchable analog op-amp emulation inherited from the HoRNet AnalogStage plugin. When engaged, the circuit introduces subtle harmonic distortion, adding thickness, warmth and vintage character, enhancing transients and introducing low-order harmonics that help glue elements together within a mix.

  An automatic oversampling system raises the internal sampling rate to reduce aliasing artifacts when processing high frequencies, adjusting the oversampling rate based on the host DAW's sample rate to balance sound fidelity with CPU efficiency. The interface is deliberately minimal, with just Angle, Auto Gain, OpAmp and In/Out level controls, and the plugin has no copy protection.
specs: |-
  - Tilt EQ adjustable from -18dB to +18dB
  - Input and output gain controls with auto-gain
  - Input and output peak meters
  - Analog emulation based on AnalogStage's OpAmp model
  - Bypass button to exclude the plugin processing
  - Mac OS X (>=10.7) and Windows support
  - 32 and 64-bit compatibility both on Mac and Windows
  - Audio Units, VST2.4, VST3 and AAX format
  - Apple Silicon not supported yet
  - No copy protection
