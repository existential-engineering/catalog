description: "A stereo width processor that can increase the stereo field
  without losing punch in the low end, dividing audio into three independent
  frequency bands with adjustable width, gain, and pan per band."
details: |-
  Three independent frequency bands
  Adjustable width, gain, and pan per band
  Accepts L/R and M/S input signals
  Phase flip capability for left/right channels
  Solo options for all bands and channels
  Built-in stereo field analyzer
  Selectable crossover steepness
