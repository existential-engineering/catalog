url: https://ddmf.eu/stereooerets-stereo-field-plugin/
description: "A stereo width processor that can increase the stereo field
  without losing punch in the low end, dividing audio into three independent
  frequency bands with adjustable width, gain, and pan per band."
details: |-
  Three independent frequency bands
  Adjustable width, gain, and pan per band
  Accepts L/R and M/S input signals
  Phase flip capability for left/right channels
  Solo options for all bands and channels
  Built-in stereo field analyzer
  Selectable crossover steepness
specs: |-
  - Three independent frequency bands with per-band width, gain, and pan control
  - Accepts L/R and M/S input signals
  - Phase flip for left and right channels independently
  - Solo option for all bands and individual channels
  - Built-in stereo field analyzer for phase monitoring
  - Selectable crossover steepness between bands
  - Windows 32-bit and 64-bit (VST, VST3, AAX)
  - macOS 10.7+ (Intel and Apple Silicon) — AU, VST3, AAX
  - Linux ARM and x86_64 (VST3)
  - Free demo available for all platforms
