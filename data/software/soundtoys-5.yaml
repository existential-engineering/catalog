description: Complete collection of 23 Soundtoys audio effect plugins including
  SuperPlate, Effect Rack, Decapitator, EchoBoy, and Little AlterBoy.
details: |-
  Soundtoys 5 combines 23 professional audio effect plug-ins into a unified collection. The centerpiece is the Effect Rack, which enables users to build custom effect chains and treat multiple effects as a single processor.

  Version 5.5 introduces SpaceBlender, an experimental reverb for creating immersive spatial textures, alongside established effects like Decapitator (saturation), EchoBoy (echo/delay), and Little AlterBoy (vocal transformation).

  The suite emphasizes workflow efficiency by integrating multiple effects into one interface, eliminating the need to juggle separate windows. Users can configure chains, adjust parameters, and manage routing within a single plug-in.

  Advanced customization is available through Tweak panels that expose circuit-level controls. Modulation effects feature custom LFO shapes and a Rhythm Editor for creating complex motion patterns. All plug-ins support resizable user interfaces as of version 5.5.
specs: |-
  - 23 professional audio effect plug-ins included
  - Effect Rack for building custom effect chains
  - Supports macOS 10.15 or later and Windows 10 or later
  - 64-bit only, sample rates 44.1 kHz to 192 kHz
  - Apple Silicon compatible
  - Resizable user interfaces
  - Computer-based authorization with two activations per license
  - Custom LFO shapes and Rhythm Editor for modulation effects
