description: Aeternus brass is a virtual musical ensemble and solo trumpet,
  trombone, tuba, french horn, flugelhorn and cornet instruments.
details: >-
  Aeternus brass is a virtual musical ensemble and solo trumpet, trombone, tuba,
  french horn, flugelhorn and cornet instruments. It includes brass sections,
  orchestral ensemble and sampled legato and staccato articulations.
  Additionally introduces four analog brasses, based on classic polyphonic
  synthesizers.


  The brass sections ensembles and synthesized brass brings a stereophonic
  widening sound to increase the audible perspective or perceived breadth, even
  without using the built-in reverberation.


  Aeternus brass by syntheway virtual musical instruments is a virtual
  instrument audio plugin for macos and windows. It functions as a VST plugin,
  an audio units plugin and a VST 3 plugin.


  These universal 2 binary (arm64) plugins run natively on both apple silicon
  (m1, m2, m3) and intel-based mac computers.


  DAW host application with audio unit, VST or vst3 support: these plug-ins can
  be used to process audio by applications such as logic pro, garageband,
  cubase, ableton live, reaper, studio one professional, ardour, mainstage and
  digital performer among others.
specs: >-
