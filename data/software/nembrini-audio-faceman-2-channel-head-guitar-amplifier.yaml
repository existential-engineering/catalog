details: |-
  Faceman 2-Channel Head Guitar Amplifier plugin is based on a vintage Fender Bassman "blackface" year 1967 with rare 1x15 cabinet loaded with JBL D130F speaker, made available by Rock 'n' Vintage musical instruments.

  Though the original 1952 design was intended and marketed as a bass guitar amplifier, guitar players all over quickly adopted these venerable amps as their own thanks to amazing breakup and beefy bottom end. Two separate channels, each with its own distinctive sound.

  Faceman 2-Channel Head Guitar Amplifier is raw, in-your-face rock sound when cranked, or easily coaxed into a deep, full, and distinct clean sound when dialed back.

  With Faceman 2-Channel Head Guitar Amplifier it is possible to choose between six different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs. A complete Mixer section with Solos, Mutes, Pans and Faders allows you to blend together the two microphones with the ambience.

  Impulse Loader lets you load up to three third-party impulse responses that you can even blend together using volume, pan, phase, solo and mute controls. A useful browser window has been added so you can easily search through all your third-party IR files.
specs: |-
  - Two separate channels, each with its own sound
  - BASS INSTRUMENT channel suitable for bass instrument
  - NORMAL channel suitable for both bass and guitar instrument
  - Cabinets: six different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs
  - Mixer section with Solos, Mutes, Pans and Faders to blend the two microphones with the ambience
  - Impulse Response Loader: up to three third-party impulse responses blendable with volume, pan, phase, solo and mute controls, with a browser window for searching IR files
  - Cleaner/Noise Gate: noise gate section plus a Cleaner circuit to reduce rumbling and harshness
  - Plugin Formats: a VST2, VST3, AAX or AudioUnits compatible host
  - System: an Intel compatible or Apple Silicon CPU, 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
