description: The Faceman is a plugin emulation of a vintage 1967 Fender Bassman 'blackface' amplifier paired with a 1x15 cabinet featuring a JBL D130F speaker. Though originally designed for bass, this amp became popular among guitarists for its distinctive breakup characteristics and robust low-end response.
details:
  - The Faceman is a faithful emulation of a 1967 Fender Bassman 'blackface' amplifier with a 1x15 cabinet loaded with a JBL D130F speaker. Originally designed for bass players, the Bassman became legendary among guitarists for its warm, full-bodied tone with a characteristic breakup and beefy bottom end that made it a staple in blues, rock, and country music.
  - "The plugin features two independent channels: the Bass Instrument channel optimized for bass frequencies, and the Normal channel which works equally well for both bass and guitar. Each channel faithfully recreates the original amplifier's tonal character, allowing players to explore the different voicings available on the hardware unit."
  - An integrated cabinet section offers six different guitar cabinet choices, each with four microphone emulations. Continuous on/off axis positioning and microphone distance controls let players dial in precise tonal placement, while a full mixer section with solos, mutes, pans, and faders enables detailed blending of two microphones with ambience.
  - An impulse response loader supports up to three third-party IRs simultaneously, complete with volume, pan, phase, solo, and mute controls for each slot and an IR browser for file searching. Free impulse responses are included with the plugin, providing immediate access to additional cabinet tones beyond the built-in selections.
  - A noise gate circuit and cleaner circuit work together to reduce unwanted rumbling and harshness, keeping the signal clean and focused without compromising the natural dynamics of the amplifier emulation.
specs: |-
  - Based on a 1967 Fender Bassman 'blackface' amplifier with 1x15 cabinet (JBL D130F speaker)
  - Two independent channels: Bass Instrument and Normal
  - Six built-in guitar cabinet emulations
  - Four microphone emulations per cabinet with on/off axis and distance controls
  - Cabinet mixer with solos, mutes, pans, and faders
  - Impulse response loader supporting up to three third-party IRs
  - Noise gate and cleaner circuit
  - Free impulse responses included
  - Formats: VST2, VST3, AAX, Audio Units (64-bit only)
  - macOS 10.13 or newer (Intel and Apple Silicon)
  - Windows 7 or newer
  - iOS (iPhone/iPad)
  - Minimum 1GB RAM
  - Version 1.0.7
