description: B-Step Sequencer is a unique, powerful step sequencer plugin and
  standalone application for creating melodic loops, chord progressions,
  arpeggios, drum grooves, and basslines.
details: |-
  B-Step Sequencer is a unique, powerful step sequencer plugin and standalone
  application for creating melodic loops, chord progressions, arpeggios, drum
  grooves, and basslines.

  B-step sequencer comes with an array of features like chord programming,
  sequencer ratcheting, shuffle, drag-n-drop, copy, MIDI learn, and much, much
  more. An embedded manual and intelligently sorted presets help users get up to
  speed quickly.

  The user interface features full multi-touch support, a clean and free
  customizable style, an embedded user manual, and the ability to create your
  own color themes.

  B-step sequencer is designed for creating melodies, arpeggios, chord
  progressions, basslines, drum grooves, and experimental parts.

  The MIDI specification includes MIDI clock master (up to 400 bpm), syncability
  to other MIDI sequencers, 5x MIDI out to control up to 5 hardware or software
  synthesizers (4x independent), 1x MIDI in for sync to another master, MIDI
  thru, MIDI clock/sync thru, 1x in & out for MIDI controller (for MIDI learn),
  and 2x in & out for novation launchpad.
specs: |-
  - Up to four independent sequencers

  - 16-steps * 4-tracks * 16 pattern

  - Shuffle/swing

  - Sequencer ratcheting/step repeats

  - Monophonic and polyphonic playback modes

  - Pattern auto chaining

  - Reverse playback

  - Measurements from 1/16th to more than 4/4th

  - Step probability

  - Partial bar replays

  - Send control and program changes at each step

  - 5x6 chords per project

  - Define random chords from 12 scales

  - Skip, mute, and other functions

  - Drag-n-drop (copy for bars and step)

  - Multi drag

  - Bar snapshots

  - MIDI clock master (up to 400 bpm)

  - Syncable to other MIDI sequencers

  - 5x MIDI out to control up to 5 hardware or software synthesizers (4x
  independent)

  - 1x MIDI in for sync to another master

  - MIDI thru

  - MIDI clock/sync thru

  - 1x in & out for MIDI controller (for MIDI learn)

  - 2x in & out for novation launchpad

  - Auto restore MIDI connections

  - Native novation launchpad support (for up to two launchpads)

  - Advanced MIDI learn

  - Sends feedback to MIDI controllers

  - Coremidi, virtual MIDI, network MIDI

  - Alsa

  - Audiobus (ios)

  - Auto save and load last session

  - Project notes

  - Import and export of your projects and other data

  - Share your projects on the b-projectrepository

  - Full multi-touch support

  - Clean, free customizable style

  - Embedded user manual

  - Create your own color themes
