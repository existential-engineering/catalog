description: A resonator effect plug-in simulating sympathetic string vibration
  in pianos, with 88 virtual strings and controls for tuning, panning,
  pre-delay, tone, chorus, level, decay and damping.
details: |-
  PCM Native Stringbox is a resonator effect plug-in from Lexicon that simulates the sympathetic vibration of strings in a piano. It models 88 virtual strings and offers controls for tuning, panning, pre-delay, tone, chorus, level, decay and damping, allowing for eerie and ethereal resonance-based effects.

  The plug-in is part of the PCM Native Effects Bundle and provides studio-quality presets, full parameter automation support, a real-time spectral display with input and output metering, and portable presets for use across sessions and systems.

  PCM Native Stringbox is a legacy product that has been discontinued by Lexicon. Installers for Mac (Intel) and Windows remain available for existing owners, and authorization requires an iLok2 USB key.
specs: |-
  - 88 virtual strings modeling sympathetic piano resonance
  - Controls for tuning, panning, pre-delay, tone, chorus, level, decay and damping
  - Studio-quality factory presets
  - Full parameter automation support
  - Real-time spectral display with input/output metering
  - Portable presets
  - iLok2 authorization required
