description: Massively musical and organic.
details: |-
  The list of gear that can truly be considered modern classics is short. Despite that, Softube is confident in saying that the inspiration for this plug-in undoubtedly makes the cut.

  The original design is sophisticated. It features four passive, parallel EQ bands that each impart an unmistakable warmth and subtle saturation that's coupled with a tube stage offering superb headroom. The masterstroke, however, is its shelving filters. The shelving filters go from wide and smooth to a colorful unique shape that instantaneously gels with a mix and gives you color that's, simply put, massive.

  This equalizer's original design makes it organic and natural, musical and colorful, warm and sweet, punchy and powerful. It's a combination that has earned it a place in the canon of pro audio gear. Not one to mess with a good thing; Softube has stuck close to the essence of the original design. Reference 1998 Equalizer gives you the legendary tone shaping capabilities and creative possibilities of the original classic unit for mastering and more.

  Want the full experience of the Reference 1998 Equalizer plus visualizations of its unique curves, up to 20 bands of modern curves, frequency content, dynamic EQ features, and more? You can load Reference 1998 Equalizer into the second slot of the Equalizers plug-in to create a one-of-a-kind EQ environment. The result is equalizing that's both corrective and vibey in an ultra-fast workflow.

  Softube's officially licensed and expertly emulated Chandler Limited Curve Bender plug-in is always transparent and always smooth. That is in stark contrast to Reference 1998 Equalizer, which is way more colorful, extreme, and distorted than the Curve Bender. Reference 1998 Equalizer gives you more character, more color, and more creative license.
specs: |-
  - Authentically captured modern classic tube equalizing
  - Four passive, parallel EQ bands for warmth and saturation
  - Shelving filters with built-in "low end trick" shelving curves
  - Massively colorful and great for broad strokes
  - Ideal for mastering and mixing
  - Compatible with Equalizers
  - Console 1 Ready
  - Supports Softube Extended Features panels
  - Tube stage offering superb headroom
  - 20-day trial, 14-day returns, three activations
  - Requires a Softube account and an iLok account (no physical iLok required)
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Internet access required for downloading installers and managing licenses
