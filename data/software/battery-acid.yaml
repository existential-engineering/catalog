details: |-
  Battery Acid was inspired by a deteriorated car battery. It uses a set of dual
  bitcrushers and waveshapers to completely erode your music to "delightful
  dilapidation".

  Each stereo channel can be crushed and mutilated individually. You can
  "dissolve" and "melt" as well as "corrode" and "erode", plus you can set the
  cutoff and resonance.

  Battery acid by darkware is a virtual effect audio plugin for windows. It
  functions as a VST plugin.
specs: |-
  - Dual bitcrushers
  - Waveshapers
  - Stereo channel processing
  - Individual channel control
  - Cutoff control
  - Resonance control
  - Windows compatible
