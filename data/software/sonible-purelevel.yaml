description: pure:level is an AI-powered leveling and level rider plugin that
  keeps the levels of vocals, dialogue, and instruments steady in your mix.
details: |-
  pure:level solves two mixing challenges with one simple tool. Intelligent audio leveling and level riding ensure consistent levels in tracks while keeping dynamics natural and expressive. It also comes with a group feature, so layered tracks can be controlled as one element from a single window without affecting their individual dynamics.

  Content-aware leveling and level riding keep the levels of vocal, dialogue and instrument tracks steady in a mix. The plug-in makes sure tracks stay consistent while their performances keep their natural feel, so nothing gets flattened or over-controlled.

  A group feature makes backing vocals, guitar layers or synth stacks behave like one element. Multiple tracks can be controlled together from one instance window while each track keeps its own character and dynamics, which gives tight, cohesive layers that stay perfectly aligned.

  With intelligent processing and a dual approach of level stabilization and mix placement, pure:level helps tracks fall into place quickly. Signals stay balanced and easy to control as a mix is built, so elements can be moved around without the sound suddenly changing. Less time goes on fixing levels and more on shaping the music.

  The result is a one-knob plug-in aimed at smoother recordings, cleaner stacks and a faster, more intuitive mixing workflow.
specs: |-
