description: pure:level is a AI-powered leveling and level rider plugin that keeps the levels of vocals, dialogue, and instruments steady in your mix.
details: |-
  Solve two mixing challenges with one simple tool: Intelligent audio leveling and level riding ensure consistent levels in tracks while keeping dynamics natural and expressive. pure:level also comes with a group feature, so you can control layered tracks as one element from a single window without affecting their individual dynamics.

  pure:level keeps the levels of your vocals, dialogue, and instruments tracks steady in your mix. This little plug-in packs a punch: it makes sure your tracks stay consistent while their performances keep their natural feel. Nothing gets flattened or over-controlled.

  Backing vocals, guitar layers, or synth stacks instantly behave like one element. With the group feature, multiple tracks can be controlled together from one instance window. Each track keeps its own character and dynamics. The result is tight, cohesive layers that stay perfectly aligned.

  pure:level isn't like any other audio leveler or a level riding plug-in. With its intelligent processing and dual approach of level stabilization and mix placement, it helps tracks fall into place quickly. Signals stay balanced and easy to control as you build your mix. You can move things around without the sound suddenly changing. Less fixing levels, more shaping the music.
specs: |-
