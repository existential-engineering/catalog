description: pure:level is an AI-powered leveling and level rider plugin that
  keeps the levels of vocals, dialogue, and instrument tracks steady in a mix.
  It pairs automatic level stabilization with level riding and adds a group
  feature for controlling layered tracks as one element.
details: |-
  pure:level solves two mixing challenges with one control. Content-aware analysis drives intelligent leveling and level riding, so tracks stay consistent while the performance keeps its natural feel. Nothing gets flattened or over-controlled, which makes the plugin suited to vocals, spoken dialogue and instrument recordings alike.

  A group feature lets multiple instances be controlled together from a single instance window. Backing vocals, guitar layers or synth stacks behave like one element while each track keeps its own character and dynamics, giving tight, cohesive layers that stay aligned.

  The dual approach of level stabilization and mix placement helps tracks fall into place quickly. Signals stay balanced and easy to control while a mix is built, so elements can be moved around without the sound changing abruptly. The result is a one-knob plugin aimed at a faster, more intuitive mixing workflow.
specs: |-
  - AI-powered analysis and processing for automatic leveling and level riding
  - One-knob interface with content-aware level stabilization and mix placement
  - Group feature for aligned levels across multiple tracks from one instance window
  - Plugin formats (Mac): VST, VST3, AU, AAX
  - Plugin formats (Windows): VST, VST3, AAX
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok
  - Apple Silicon support: native
  - Windows 10 (64bit) or macOS 10.14 and later
  - 4GB RAM, Intel Core (i5) or Apple Silicon CPU, OpenGL 3.2 or later
