description: Virtual Guitarist CARBON is a virtual instrument creating versatile modern "sound-designed" guitar sounds for all kinds of genres.
details: |-
  UJAM built CARBON because there was nothing like it, a virtual instrument creating versatile modern "sound-designed" guitar sounds in all kinds of music genres, from the super-quantized accents in electronic music to action-packed big riffs in game soundtracks to subtle vibes in movie scores.

  CARBON is for sound designers and musicians who go beyond borders. It's an otherworldly guitar for game soundtracks and film scores, but can also give electronic and pop music that extra kick. It's a wild and heavily distorted sound, yet that rawness is somehow precise, controlled and sometimes even synth-like at the same time.

  No matter how much you push the edgy digital effects, the underlying sonic textures always remain organic and raw. The instrument always remains playable and musical. This lets CARBON play perfectly alongside synths, drum machines, orchestras and band musicians. It is heavy and in-your-face when pushed but also light and delicate when dialed down.

  CARBON's Ultra Amp and Future Distortion algorithms leave no call for insane overdrive unanswered. Its innovative Layerer feature, a virtual soundstage with up to four guitarists, lets you control bigness and width from a tame mono riff to the earth-shaking quadro Wall Of Doom. Instrument Mode lets you play a wide range of articulations on an 8-string guitar, while Player Mode comes with inspiring riffs and phrases.
specs: |-
  - Organic, distorted and processed rhythm guitar sounds
  - MIDI drag and drop
  - Unique Layerer soundstage combining up to four guitarists
  - Finisher multi-effect rack with 75 cutting-edge effect algorithms
  - Ultra Amp and Future Distortion algorithms
  - Instrument Mode plays articulations on an 8-string guitar, Player Mode supplies riffs and phrases
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 4 GB of RAM
  - 4.5 GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App, or downloadable installer file
  - Authorization: quick authorization via the UJAM App, or email and password within the plug-in
  - Supported standards: MIDI, NKS
  - Works on macOS and Windows with all major DAWs, including Ableton Live, Logic Pro, Pro Tools, FL Studio, Cubase, Studio One, Bitwig, Reaper and Reason
  - All MIDI phrases and included sounds are royalty-free
