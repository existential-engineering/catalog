description: 3-band diode bridge compressor replicating vintage hardware
  compression with both multiband and single-band modes. Features attack times
  as fast as 2 microseconds, niveau and high-pass sidechain filters, mid/side
  compression, and A/B comparison. Excels on drums, electric guitars, and rock
  vocals.
details: |-
  Two colorful compressors in one. The Lindell Audio 3-band diode bridge compressor plugin precisely replicates the distinct behavior and rich sonic character of a legendary vintage hardware unit. With multi-band mode engaged, you can radically shape and compress individual tracks. Turning it off results in lighter, more nuanced compression, ideal for mastering or precision mixing.

  Shape the tone of drums, electric guitars, and rock vocals. The 354E sounds great on drums, electric guitars, and rock vocals. Use it to subtly control or dramatically reshape tracks for maximum size, punch, and bottom-end weight thanks to three independent compression bands (Low, Mid, and High), mode, and its Niveau and high pass sidechain filters. With an adjustable attack time as fast as 2µsec (two-millionths of a second), the 354E is capable of clamping down on the most unruly sound sources.

  Classic compression from smooth to severe. Using mode is like throwing TNT on drum room mics. Explode room ambience and make your drums pump like a jackhammer. Shield bass frequencies from compression using the built-in filters and then dial in the sound of your lows, mids, and highs using the ratio and gain controls assigned to each band.

  Gentle enough for mastering. When you turn off mode, the 354E takes on the nuanced behavior needed for buss compression and mastering. Use a gentle ratio setting to glue your mixes together. Kick in the Niveau filter to add punch, fullness, and weight to the bottom end of thin mixes. Use the 354E's mid/side mode to compress hard-panned guitars without affecting your kick drum, bass, and lead vocals. Finally, A/B your plugin configuration settings to confidently finish mixes.
specs: |-
  - Adjustable crossover frequencies between bands.
  - Ratios range from 1.5:1 for mastering to 6:1 for shaping individual tracks.
  - The switchable SMASH mode over-compresses tracks for dramatic effect.
  - Mid/side mode focuses compression on mid/side channels for surgical precision.
  - Sidechain circuit high pass filter for punchy drums and bass guitar.
  - The switchable Niveau filter uses a tilted shape to preserve bass energy, great for creating the killer API-style 'thrust' compression effect.
  - The Mix control delivers instant parallel processing.
  - Bands can be linked and soloed.
  - Blazing-fast 2µsec attack time.
  - Auto release for artifact-free processing.
  - Optional auto-makeup gain for each band.
  - Resizable user interface.
  - 16x oversampling.
  - Supported plugin formats: AAX Native, AU, VST2, VST3
  - Supported operating systems (macOS): macOS 26 down to macOS 13
  - Supported operating systems (Windows): Windows 11 down to Windows 10
  - Mac: Intel, or Apple Silicon
  - PC: x64-compatible CPU
  - Display resolution: 1440 x 900px or 1280 x 960px or higher
  - Memory: 2 GB RAM
