description: An expanded version of the Chords MIDI effect with 30 chord types, A/B comparison and intelligent randomisation. Progressions of up to eight chords can be dragged into the host project as MIDI.
details: |-
  Chords Pro develops the original Chords plugin in response to user requests, roughly doubling the number of chord types and adding A/B comparison modes and intelligent randomisation. It was designed originally for EDM productions but works across genres.

  Placed ahead of any MIDI-triggered instrument, it generates looped options for up to eight chords with control over chord shape, inversions and velocity. The resulting MIDI can be dragged straight from the plugin into the host project.

  An A/B comparison toggle locks in a favoured sequence while an alternative version is developed. The create button randomises one or more chords in a sequence intelligently, based on the chords the riff starts from. Where the original plugin carried 18 chord types, Chords Pro carries 30, with the underlying programming reworked so progressions using the new shapes stay musical.

  Global controls set inversions, length, speed and root key for the whole playback, and clicking a segment gives granular control over chord shape (including major and minor variations), individual inversions and velocity. Up to eight segments each hold a different chord type, trigger between one and four notes, sync to the host BPM and accept inversions from -6 to +6.

  Chord shapes at the centre of the interface cover Tonic, Subdominant and Dominant across 30 types, from simple triads to extended voicings such as Cmadd9 or Am7b5. A refreshed and expanded set of labelled factory preset progressions is included.
specs: |-
  - Professional chord-creating MIDI effect
  - Intelligent randomisation
  - A/B toggle with copy and paste
  - 30 chord types
  - Updated and expanded factory presets
  - Connects to any sequencer
  - Global and per-segment control
  - Intelligent harmonic progressions
  - Preview mode for in-plugin playback
  - Export MIDI by drag and drop
  - Resizable interface
  - PDF manual and tutorial video
  - Up to 8 chord segments, one to four notes per chord
  - Inversions from -6 to +6 per segment
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Tested on Windows with FL Studio 12, Cubase 10, Studio One 5, Ableton Live 9 and Pro Tools 11 or newer
  - Tested on Mac with FL Studio 12, Cubase 10, Studio One 5, Ableton Live 9, Logic Pro X and Pro Tools 11 or newer
  - Also tested with NI Maschine and Mixcraft
  - Not compatible with Maschine 2, which offers no MIDI routing
  - Not compatible with Reason, which offers no MIDI routing
