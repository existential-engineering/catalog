description: Professional MIDI controller for iPhone and iPad with
  touch-optimized piano keyboard, isomorphic grid, drum pads, and XY performance
  controls. Built-in sound engine supports SF2 SoundFonts, SFZ instruments, WAV,
  and M4A samples. Full MPE per-note expression with pitch bend. Network MIDI
  for wireless control of Mac apps. Standalone app or AUv3 plugin for
  GarageBand, AUM, Cubasis, BeatMaker, and Drambo.
