details: |-
  BFS-1, a virtual recreation of the bode frequency shifter. Different from a
  pitch shifter, a frequency shifter moves all frequencies/harmonics by adding a
  fixed amount.

  The sound is similar to a ring modulator but it is possible to get the
  upshifted and downshifted signal separately. Unlike a ring modulator, the
  frequency shifter is also capable of changing the signal by a low amount, e.g.
  1 hz, to obtain effects known as "barberpole flanging".

  This plug-in has some additional features like feedback delays in the shifting
  sections, an lfo (all host synced), an envelope with MIDI trigger and an
  envelope follower to modulate shift and/or volume.
specs: |-
  - Frequency shifter
  - Feedback delays
  - LFO (host synced)
  - Envelope with MIDI trigger
  - Envelope follower
  - Upshifted signal output
  - Downshifted signal output
  - Barberpole flanging
  - Shift modulation
  - Volume modulation
