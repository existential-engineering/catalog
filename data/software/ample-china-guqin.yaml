description: Ample china guqin (acgq) is sampled on a shennong-shape guqin with
  12 gb samples, including head, body, and auxiliary group articulations.
details: |-
  Ample china guqin (acgq) is sampled on a shennong-shape guqin with 12 gb samples, including head, body, and auxiliary group articulations, fx sounds, as well as a select collection of improvised licks. Its tone is classical and rich. To realize the features of a 7-string riffer, every single string on the guqin has been completely sampled.

  There are 3 articulation groups (head, body, and auxiliary), consisting of 17 articulations in total. Head group: sustain, natural harmonic, short tremolo, slide in from below, slow slide in from below, slide in from above. Body group: legato slide up, legato slide down, slide up and return, slide down and return, vibrato, variable vibrato, virtual portamento. Auxiliary group: open + slide in, glissando, phrase. Recorded with 5 mics (left 1, right 1, left 2, right 2 and middle). Each mic volume is adjustable and equipped with channel eq. Providing 5 mic modes: ab1, ab2, ab3, ms1 and ms2, capable of colorful sound designs.

  The 7-string riffer, specifically designed for the guqin, is the core functionality of the acgq. In the riffer, users can easily and efficiently design the fingering positions, articulations, legatos, and expressions for the guqin. Users can drag the riff into the MIDI track of the DAW and achieve accurate playback which is the same as the internal playback in the riffer. Each preset in acgq contains a riffer demo.

  The open string notes differ significantly in timbre from the pressed notes. To ensure that there are open strings available in every key, the guqin requires tuning adjustments for each key. Acgq offers a convenient and efficient tuning system. 3 play modes: instrument mode, keyboard mode, and open string mode. Infinite legatos with the body group. Voice independent sahds modulation system, acgq will trigger the string-rolling noise at the speed set in the settings, in accordance with the sahds modulation system.

  Fx: high order 8-band eq, intuitive control of frequency response, real-time visualization of input and output spectrum, support of soloing single band. 2-line compressor, real-time visualization of input and output signal, two detection modes rms & peak, support of soft knee, auto release and auto makeup. 6-tap echo, real-time visualization of the processing of stereo signal, can tweak the parameters of 6 echo points individually: feedback, pan, volume etc. Ir reverb, providing four types of ir: room, studio, hall, and larger hall. 3d visualization of ir spectrum.
