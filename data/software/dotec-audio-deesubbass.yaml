details: |-
  DeeSubBass is a sub-bass generator plugin from DOTEC-AUDIO designed to add powerful low-frequency depth to modern music productions. By simply selecting the key of your song, the plugin automatically generates a complementary sub-bass signal tuned to fit the track, eliminating complex manual synthesis setup.

  The Drive control applies harmonic saturation via overdrive, adding warmth and fatness to the generated sub-bass. A high-pass filter allows crossover adjustment between the generated sub-bass and the original audio signal, giving producers precise control over how the sub-bass integrates with existing low-end content.

  DeeSubBass uses 64-bit double-precision oscillator calculations to ensure a clean, accurate sub-bass signal even at extreme low frequencies. The interface features a retro-inspired visual design influenced by 1980s anime aesthetics, in keeping with DOTEC-AUDIO's signature style.

  The plugin is available as a free demo with a 1-second silence inserted every 30 seconds. A full serial key license can be purchased for $50 USD, with discounts available via coupon code ($10 off), existing serial key ($15 off), or bulk purchase ($15 off on a second purchase). Registration requires an internet connection.

  DeeSubBass has been tested with a wide range of DAWs including Ableton Live, Cubase, Logic Pro X, FL Studio, Pro Tools, Studio One, Reason, BITWIG Studio, Digital Performer, and more (20+ hosts). Both Windows (VST2/VST3/AAX, 64-bit) and macOS (VST2/VST3/AU/AAX, 64-bit, OS 10.12 or later, including Apple Silicon) are supported.
