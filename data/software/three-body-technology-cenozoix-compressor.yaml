description: Cenozoix is the definitive all-terrain compressor plugin delivering unparalleled sound quality and adaptability with 24 vintage & modern compressor styles. Engineered for the future, Cenozoix is poised to redefine the landscape of compressor plugins.
details: |-
  Features 12 vintage and 12 modern compressor style simulations with 24 freely matchable harmonic distortion styles. Employs Anti-Derivative Anti-Aliasing (ADAA) applied to rectifiers for aliasing suppression and Adaptive Oversampling Interpolation for envelope detection. Includes adjustable Clamp for recompressing leaked transients and De-Click for transforming clicking transients into overdrive. Offers an 8-band parametric side chain EQ powered by Kirchhoff-EQ technology with multiple stereo and mid/side modes. Supports switchable oversampling up to 16x, lookahead, A/B switching, 50+ presets, and full GUI theme customization with resizable interface.
specs: |-
  - 24 compressor styles: 12 vintage (Brit VCA, Dist. VCA, Black FET, Diode-Bridge, Virtual Mu, Vintage Tube, etc.) + 12 modern (Clean, Tight, Vocal, Pluck, Hard, Bus, etc.)
  - Switchable oversampling: 2x, 4x, 8x, 16x
  - Default latency: 4 sample points (~0.1ms at 44100 Hz)
  - Latency at 16x oversampling: 271 sample points (~6.1ms at 44100 Hz)
  - 8-band parametric side chain EQ (powered by Kirchhoff-EQ)
  - Stereo modes: Left/Right, Mid/Side, Mid Only, Side Only, Mid→Side, Side→Mid
  - Peak/RMS blending, feed-forward/feedback mixing
  - Odd/Even harmonic adjustment
  - Lookahead, Hold, Knee, Range, Makeup & Auto Makeup parameters
  - System requirements: Intel/AMD CPU with SSE 4.1 or Apple Silicon, macOS 11 / Windows 10, 2GB RAM, 300MB disk
  - Native Apple Silicon support, Retina display support, high-DPI support on Windows
