details: |-
  Blue cat's Late Replies is a powerful delay and multi effects plug-in that can
  be indefinitely extended by hosting third party VST, VST3 or AU plug-ins
  anywhere in the signal path. With its unique topology, the plug-in is a
  full-featured delay machine with unlimited powers: both the 8 taps pattern
  module and the two nested feedback loops include plug-in slots that can host
  built-in effects or third party plug-ins.

  The plug-in includes 25 built-in effects to further manipulate the delay
  lines: modulation effects, eq and filters, dynamics processors, pitch and
  frequency shifters, wave shaper. With the integrated ducker and its side chain
  input, ducking delays or reverbs has never been so easy.

  Blue cat's late replies is delivered with hundreds of presets producing many
  kinds of audio effects: classic delays, rhythmic or melodic patterns, reverbs,
  vintage echoes, shimmer effects, sci-fi sounds.

  Typical applications: delays with built-in effects, rhythmic patterns, melodic
  patterns, third party plug-ins hosting, reverbs, shimmer, creative effects,
  pitch shifting, modulation effects, looper.

  Comprehensive visual feedback with detailed impulse response display. Protect
  your ears with the included feedback and output brickwall limiters.
