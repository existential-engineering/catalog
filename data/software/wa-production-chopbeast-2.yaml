  randomization modes."
details: |-
  Up to 32 chops per instance. Per-chop volume, reverse, pitch, declick, and formant shifting. Lock option for position and effects during randomization. MIDI audition with one-shot and hold. DAW tempo sync with half and double-time. Pitch randomization to discrete intervals. Resizable interface. CPU-friendly.
