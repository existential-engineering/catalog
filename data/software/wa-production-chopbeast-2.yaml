description: ChopBeast 2 is a loop slicing plugin that chops and rearranges dropped audio into up to 32 slices, with per-slice pitch, volume, formant, reverse and declick control. It adds lock options for slice position and effects, melodic pitch randomization and host tempo sync over the first version.
details: |-
  ChopBeast 2 is a re-engineered version of the original ChopBeast loop slicer. Where the first version leaned on randomness, the sequel trades some of that for control over the result, blending per-slice editing with intelligent randomization. It is aimed at percussion, melodies, vocals and whole mixes, in a lineage of rhythmic slicing that runs from the swing-heavy stutters of Todd Edwards to the hyper-edited productions of Disclosure and Porter Robinson.

  New to this version are deeper per-slice control, including a lock option for position and effects so parts of a sequence can be kept while the rest is randomized, volume control for each slice, pitch randomization to discrete octaves, fifths, thirds and major and minor intervals with an optional formant shaping toggle, MIDI one shot and hold options for per-chop looping, sync to the host tempo with half time and double time options, and playback linked to the host bar position.

  Core behaviour carried over from the previous version includes declicking slices for seamless transitions, independent preview of each chop, preview of the full chopped sequence inside the plugin, sample rate matching so a change of host sample rate does not affect playback, and preservation of a loaded sample's original playback speed and sample rate.

  A dragged in audio file is chopped and rearranged instantly, with up to 32 chops available per instance. Chops can be auditioned or triggered over MIDI, and undo, global transposition and melodic randomization modes widen the range of results. The plugin window is resizable.

  Per-slice controls cover pitch manipulation, volume editing, formant shifting, declicking and reversing individual slices. Favoured results can be locked in and exported to the host for further editing. A PDF manual and a tutorial video are included.
specs: |-
  - Audio chop and remix plugin with advanced options
  - Up to 32 chops per instance
  - Per-chop volume, reverse, pitch, declick and formant shifting
  - Multiple melodic randomization modes
  - MIDI audition with one shot and loop modes, plus DAW export
  - DAW sync with half time and double time modes
  - Playback linked to DAW bar position
  - Lock position and effects per slice
  - Global transpose
  - Independent chop preview and full sequence preview
  - Sample rate matching and preserved sample integrity
  - Resizable interface
  - Full PDF manual and tutorial video
  - Windows 8 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 11 or higher
  - Intel and Apple Silicon CPUs, native AAX format
