description: PSP BBDelay is a creative ambience processor inspired by the legendary
  Dynacord VRS 23.
details: |-
  PSP BBDelay is an analog-inspired delay and ambience processor built around the unmistakable character of classic Bucket Brigade Device (BBD) chips: warm repeats, organic movement, and musical imperfections beyond vintage limits.

  Inspired by a legendary 1980s BBD delay and ambience processor (the Dynacord VRS 23), PSP BBDelay channels the depth, motion, and instability that gave classic analog delays their lasting appeal. Modelled BBD chips, compander behaviour, and analog circuit imperfections make each repeat evolve with texture and life.

  With transient shaping, ducking, gating, saturation, modulation, tone shaping, and chip variation, PSP BBDelay moves from vintage echoes and lush ambience to experimental soundscapes.

  PSP BBDelay is an independent PSPaudioware product and is not affiliated with, endorsed by, sponsored by, or approved by Dynacord, Keenfinity Group, Electro Voice Dynacord B.V., or any other rights holder. Dynacord and VRS 23 are mentioned solely to identify the historical device that inspired aspects of the product's design.
specs: |-
  - Faithful modeling of individual BBD chips
  - Authentic emulation of compander behavior
  - Mono, Dual Mono, Ping-Pong and Reverb modes
  - Delay times up to 800 ms (1600 ms in a x2 mode)
  - Smooth analog-style delay speed control with optional Time and Tempo Sync modes
  - Four modulation waveforms with multiple synchronization options
  - Adjustable BBD chip spread for widened stereo image
  - Adjustable compander alignment for everything from clean repeats to beautifully imperfect vintage coloration
  - Three analog dirt modes with progressively richer character
  - Integrated transient processor for shaping attack on every repeat
  - Built-in ducker for cleaner delays during performance
  - Integrated gate for rhythmic and creative effects
  - Analog-style saturation with multiple response curves
  - High-pass, low-pass and resonant tone shaping inside the feedback path
  - Comprehensive preset browser with Favorites, A/B comparison, Undo/Redo and user default presets
  - High-quality 64-bit internal processing
  - Zero added latency on the dry signal
  - Windows 7 - Windows 11, 64-bit VST, VST3 and AAX (Pro Tools) compatible applications
  - macOS 10.14 Mojave - macOS Tahoe (macOS 26), Intel and Apple Silicon, 64-bit AudioUnit, VST, VST3 and AAX (Pro Tools) compatible hosts
  - iLok account required (iLok License Manager, no hardware dongle needed)
  - License activatable in 3 locations
