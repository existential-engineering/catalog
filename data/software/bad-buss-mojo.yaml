description: Sometimes digital is just too perfect. Sometimes you just want a
  little grit a little dirt a little imperfection. That's where Bad Buss Mojo...
details: |-
  Bad Buss Mojo allows you to dial in specific tweaks to a virtual mix buss
  amplifier. Is the + rail a little low? Dial it in. Psu not quite as stiff as
  it could be? Dial in a bit of knee in the bend. Old-school transistors or even
  tubes? Dial in some nonlinear modulation.

  It'll go from "I can't hear that you've done anything, but I like it" all the
  way up to "why did you run my mix through a guitar amp?".
