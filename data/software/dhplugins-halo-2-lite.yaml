details: |-
  HALO-2 LITE is an entry-level, limited functionality edition of HALO-2. With a visual and creative workflow, it combines re-sampled audio with a host of synth layers, processing and FX to make basses, leads, pads and more.

  The preset library covers arps, bass, reeses, pads, leads and FX, with 55 presets and 18 sample banks. Presets can be used as they are or taken as a start point, with the filter, FX and modulation options available for building new sounds.

  Sound design controls include four multi-mode filters, four distortion modes covering bitcrusher and waveshaping distortion (waveshape editing is disabled in this edition), sample frequency modulation, sample unison, step sequence modulation, editable LFOs, a modulation matrix, a dedicated pitch enveloper and a master EQ. Distortion wave shapes, LFO shapes and sample bank selection can be randomly generated.

  Features reserved for the full HALO-2 are 430+ presets and 300+ sample banks, user audio file import, the HALO-2 FX plug-in, full arpeggiator functionality, custom waveshaping distortion, random preset generation, expansion support and a second synth oscillator.
specs: |-
  - ROMpler and synth in one
  - 55 presets and 18 sample banks
  - Arps, bass, reeses, pads, leads and FX
  - 4 distortion modes including bitcrusher and waveshaping distortion (waveshape editing disabled)
  - Limited version of the arpeggiator
  - Sample frequency modulation and sample unison
  - Step sequence modulation
  - Easy routing and editable LFOs
  - Randomly generate distortion wave shapes, LFO shapes and sample bank selection
  - FX section
  - Modulation matrix
  - Master EQ
  - 4 multi-mode filters
  - Dedicated pitch enveloper
