description: Babylon is a one page virtual synthesizer with multi-voice oscillators, stereo unison and detuning, filters, effects and an internal modulation matrix. It adds per-note microtonal tuning and a scale helper covering 23 standard and 34 traditional scales.
details: |-
  Babylon is a virtual synthesizer built on a one page design that places all major parameters on a single interface page rather than spreading programming across multiple windows and menus. It covers leads, basses, pads, organs, keys and effects sounds through multi-voice oscillators, stereo unison and detuning, high quality filters, effects and an internal modulation matrix.

  Every individual note can be tuned to its own frequency, which allows quartertone and microtonal scales that standard tuning cannot reach. The scale helper holds 23 standard scales and 34 traditional scales and modes from the Middle East, highlights the notes of a chosen scale and key on the virtual keyboard, and sets up microtonal tuning automatically.

  257 high resolution waveforms are included, covering variants of the classic oscillator shapes alongside formant, gritty, voice and instrument waveforms, all of which can be inverted, reversed or both. Over 2300 preset sounds are catalogued into themes in the onboard browser.

  The effects section covers distortion, bit rate and sample rate reduction, filter, chorus, EQ, delay and reverb, and the chain can be reordered by clicking and dragging. The filter section adds five poly effects alongside its standard controls: drive, distortion, saturation, crush and LoFi.

  Further features include a dedicated vibrato LFO with delay and attack settings, 12 curve types for ADSR and filter programming, visual unison feedback showing the width and depth of voicing and detuning choices, FM, RM and AM modulation, skins and a dual-size interface.
specs: |-
  - One page synth programming
  - 257 high resolution waveforms
  - Over 2300 preset sounds
  - Scale and microtonal features
  - 23 standard scales and 34 traditional scales and modes
  - Multi-voice oscillation with stereo unison and detuning
  - Modulation matrix
  - FM, RM and AM modulation
  - Dedicated vibrato LFO with delay and attack
  - 12 curve types for ADSR and filter programming
  - Reorderable effects: distortion, bit and sample rate reduction, filter, chorus, EQ, delay, reverb
  - Five filter poly effects: drive, distortion, saturation, crush and LoFi
  - Skins and dual-size interface
  - Full PDF manual and tutorial video
  - Windows 8 and later
  - macOS 10.13 and later
  - AAX requires Pro Tools 11 or higher
