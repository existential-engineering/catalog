description: "Premium time and pitch manipulation plugin for Pro Tools.
  Professional time-stretching and pitch-shifting with support for surround
  configurations up to 9.2.4."
details: |-
  AAX32/AAX64 and AudioSuite Offline plugin for Pro Tools. Supports 1-8 channels I/O, 32-192kHz sample rates, surround configurations (7.1.2, 7.1.4, 9.1.4, 9.2.4). Pitch range up to +/- 24 semitones. Time-stretching from 25% to 400%. Optional formant preservation and dialogue mode.
specs: |-
  Minimum Pro Tools version 2018.12 or later. TC/E feature requires Pro Tools 12.8.1 or above. Windows 10 & 11 (64-bit). macOS 13 or later (64-bit Intel & Apple Silicon). 1-8 channels I/O. 32-192kHz sample rate.
