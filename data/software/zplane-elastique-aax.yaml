description: Premium time and pitch manipulation for Pro Tools, delivering
  top-rated, program-independent time-stretching and pitch-shifting quality
  based on the ÉLASTIQUEPRO V3 engine.
details: |-
  élastiqueAAX brings zplane's industry-leading ÉLASTIQUEPRO V3 engine to Pro Tools as a native AAX plugin, offering real-time time-stretching and pitch-shifting of the highest quality. It supports both AAX native and AudioSuite Offline processing modes.

  The plugin provides real-time pitch-shifting across a range of ±24 semitones or 25%–400%, and time-stretching from 25% to 400%, with optional formant preservation to maintain natural-sounding vocal and instrument timbres across transformations.

  Multi-channel support extends up to 8 channels, and phase-coherence technology ensures that stereo and surround material remains phase-accurate after processing. A dedicated Dialogue mode is included for speech-oriented material.

  Factory presets for common framerate conversions are bundled, making the plugin particularly useful in post-production workflows. Two editions are available: the full élastiqueAAX and the stripped-down élastiqueAAXtce, which offers time-stretching only as a TC/E plugin.
specs: |-
  - AAX native (32/64-bit) and AudioSuite Offline processing modes
  - Real-time pitch-shifting: ±24 semitones or 25%–400%
  - Real-time time-stretching: 25%–400%
  - Optional formant preservation
  - Multi-channel support: up to 8 channels
  - Phase-coherence technology
  - Dialogue mode
  - Factory presets for framerate conversion
  - Audio: 1–8 channels, 32–192 kHz sample rate
  - Requires Pro Tools 2018.12 or later
  - macOS 13+ (64-bit Intel & Apple Silicon)
  - Windows 10 & 11 (64-bit)
