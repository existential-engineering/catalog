description: Take control over time and pitch in your Pro Tools projects with élastiqueAAX, the best time and pitch manipulation tool for Pro Tools.
details: |-
  Based on the acclaimed ÉLASTIQUEPRO V3 time-stretching and pitch-shifting engine integrated into numerous DAWs world-wise, élastiqueAAX delivers top-rated, program independent time-stretching/pitch-shifting quality.

  Despite the advanced feature set, élastiqueAAX is easy to use thanks to a welcoming user interface that puts all necessary parameters within easy grasp. As an off-line Audio Suite plugin, élastiqueAAX can deliver pitch-shift and time-stretch much faster than real time.

  élastiqueAAXtce is a stripped down version that only supports time-stretching as TC/E plugin in Pro Tools. You'll need Pro Tools 12.8.1 or above to make use of the TC/E option.

  Please Note: Since version 2023.3, élastiqueAAX's time-stretching algorithm is directly integrated within Pro Tools.
specs: |-
  - Real-time pitch-shifting up to +/- 24 semitones or 25% to 400%
  - Time-stretching from 25% to 400%, in real time
  - Optional formant preserving, powered by the ÉLASTIQUEPRO v3 engine
  - Presets for typical framerate conversion jobs
  - Multi-channel support for up to 8 channels
  - Complete phase-coherence, preserving the spatial image and acoustic space
  - Dialogue mode
  - Audio format: 1-8 channels (I/O), 32-192kHz sample rate
  - Compatible with 7.1.2, 7.1.4, 9.1.4 and 9.2.4 configurations
  - Plugin format: AAX64, Audio Suite Offline
  - Pro Tools version 2018.12 or later
  - Windows 10 and 11, 64bit
  - macOS 13 or later, 64bit Intel and Silicon
