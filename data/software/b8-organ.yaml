details: |-
  B8 Organ is a reproduction of the old organs of the '60s and '70s. It has 9
  oscillators, switchable between sine and saw wave, with drawbars, vibrato,
  chorus and reverb.

  Sine waves result in tones typical of a church organ, or "hammond-type"
  sounds. Saw waves sound more like old combo organs.
