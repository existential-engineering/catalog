description: SuperGate is an audio gate whose attack and release gain curves can
  be shaped precisely to the sound being isolated, while referencing a
  specialized WYSIWYG detector display. The curve is applied as a programmed set
  of sample-by-sample gain instructions rather than as a set of dynamic expander
  parameters.
details: |-
  First and foremost, the job of an audio gate is to let the target audio events through unaffected and only attenuate the unwanted signal. In SuperGate, as in any other gate, there are two jobs: find and isolate the target sound, and determine when to trigger the gate.

  Unlike other gates, SuperGate allows the gate attack and release gain curves to be customized precisely to the sound being isolated, while listening, with a specialized WYSIWYG detector display as a visual reference.

  The gate curve that results is not applied as a set of dynamic expander parameters, but as a programmed set of sample-by-sample instructions defining the gain structure and duration of the Attack-Hold-Release gate envelope itself. When the trigger point is reached during playback, that set of instructions modifies the samples describing the target sound, thereby applying the gate. Applying the gain curves this way completely avoids aliasing artifacts, the interpolation stages required to correct for them, and the modulation and smearing effects that degrade the gain transition.

  The audible advantage of the approach is immediately apparent in use. The Open and Close gate curves are applied with perfect repeatability, as if they were copied and pasted onto the audio stream at the trigger point, which is in fact exactly the case, and all the minute variations of each audio event that provide feel and personality can come through the gate completely untouched.

  The processor supports both gating and ducking, with state-machine based attack and release for distortion free gating, adjustable attack and release curves, a delay compensated look-ahead mode, an integrated detector EQ with SpectraFoo analyzer, flexible internal monitoring, threshold and hysteresis plus hold time control, maximum attenuation control, and detailed detector and gain reduction history metering. Many presets are included, the UI size is adjustable with disclosable graphs, and the MH Preset Manager provides cross-platform presets.
specs: |-
  - World-class signal processing and workflow
  - State-machine based attack and release for distortion free gating
