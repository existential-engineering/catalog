description: Drum Machine
details: |-
  Drumazon 2 is a faithful digital emulation of the classic Roland TR-909 drum machine. The classic 909 sounds have reverberated over the decades in dance and techno, remaining relevant to this day, and Drumazon sets a benchmark for faithful emulation in the digital domain.

  The original 909 sounds a bit dry and requires extra processing for the audio to truly bloom, but Drumazon's effect chain is fully equipped to provide the right flavor out-of-the-box, with two bus effect chains offering distortion, reverb, delay, chorus, EQ and dynamics algorithms that can also be used creatively with the addition of a filter.

  Drumazon emulates all 11 sounds of the original 909, matching each individual instrument with meticulous accuracy. A broad feature set and expressiveness make drum programming an inspiring and easy experience, with an easy-to-use sequencer featuring Tap recording, a Randomizer, and hundreds of factory patterns.

  Per-step Flam and several variants of Substep with editable properties enrich rhythms with greater expressiveness, and a drag'n'drop MIDI export function lets users quickly finish work on a pattern in their DAW.

  Each drum sound has a dedicated channel strip with EQ and compression, routable to two FX Buses or directly to the Master Bus, which itself features a 3-band compressor and a limiter with soft-clip option.
specs: |-
  - 11 emulated 909 drum sounds
  - Two bus effect chains with distortion, reverb, delay, chorus, EQ and dynamics algorithms
  - Easy-to-use sequencer with Tap recording, Randomizer, and 100+ factory patterns
  - Per-step articulations (Flam and Substep variants)
  - MIDI export via drag-and-drop
  - Dedicated channel strip per instrument with filter section and in-chain dynamics
  - Master section with 3-band compressor and limiter with soft-clip option
  - Audible trigger outputs
  - MIDI Map editor
  - Over 1000 factory presets and patterns
