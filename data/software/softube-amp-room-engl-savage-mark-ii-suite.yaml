details: |-
  Amp Room ENGL Savage Mark II Suite brings you the real roar of the ferocious ENGL Savage Mark II. With faithful models of both the 120W and 60W versions of the Savage Mark II amp heads, five ENGL cabinets, four pedals, and studio effects, this officially licensed Amp Room suite gives you access to the defining sound of the modern classic high-gain amp: the ENGL Savage Mark II.

  The renowned emulation expertise of the Rock & Roll Scientists at Softube and the rich history of the genre-defining amp manufacturer ENGL Amplification: It's a combination that delivers the absolute best in amp modeling. Amp Room ENGL Savage Mark II Suite is meticulously hand-crafted and component-modeled for authenticity by Softube's expert engineers, without the use of Artificial Intelligence. Players like Ritchie Blackmore, Paul Stanley, Steve Morse, Marty Friedman, and many more love ENGL amps.

  Softube's amp sims are component modeled according to schematics. The physical amp is hand-measured in a lab, and the digital model is carefully adjusted to recreate the exact behavior of the hardware at any setting. AI amp sims, by contrast, are mainly just a snapshot of the amp at a particular setting, where changing the bass does not necessarily correspond to the actual bass knob on the actual amp.

  For the ENGL Savage Mark II Suite, Softube modeled not only the 120W version of this tube icon but its 60W sibling (featured in white, limited edition tolex), too. The power amp section of the 120W amp features ENGL 6550 power amp tubes, while the 60W version gives added tonal choice with its ENGL EL34 power amp tubes. The 3-band EQ for Channel 1 and Channel 2, retooled by celebrated ENGL amp designer Horst Langer, delivers tailored tones and comes equipped with Lean/Bold circuits to supply two distinct midrange characters, while the Gain Lo/Hi circuit turns the Clean channel into a Crunch mode in the Hi setting.

  Suite Mode is an intuitive workflow with hand-selected sets of gear that let you quickly get the sounds you want, with easy access to amps and cabs as well as the pedal and effects sections, and Studio Mode available for deeper tone shaping. Amplifiers, a lighter and faster companion plug-in that supports all Amp Room amps and cabs, is included with every Amp Room Suite.
