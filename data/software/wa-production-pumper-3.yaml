description: A multi-effect combining a four-mode compressor, a saturator and a stereo imager in one plugin, with a real-time waveform display for before and after comparison. It follows the original Pumper, adding parallel compression, RMS shaping and frequency-focused width.
details: |-
  Pumper 3 is a multi-effect that builds on the compressor, saturator and stereo imager modules of the original Pumper, adding further controls for fine tuning the processing. The three modules run together inside one plugin, each with a dedicated input control for balancing the effects.

  The compression module offers four modes. Punchy gives direct punch and clarity, which suits kick drums and percussion. Fat brings out the bottom end and makes audio sound larger. Clean is more transparent and adds cohesion, which suits softer vocals and acoustic instruments. Soft applies subtle compression for the master channel, tightening a mix and increasing clarity. New to this version are adjustable wet and dry parallel compression and RMS shaping controls, which avoid the need for complex channel routing.

  The saturator ranges from subtle warmth and depth through to pronounced distortion with a harder edge. Rise and Fall settings shape transients and smooth the character of the saturation.

  The stereo imager adds width and depth, and dedicated low and high shelf modes with frequency and resonance controls focus the width processing onto specific frequency ranges, which allows the character of a sound to be emphasised.

  A real-time waveform window shows the audio before and after processing, which makes A/B checking straightforward. 50 factory presets cover drums, vocals, bass, keys, synths, acoustic instruments and mastering, all reachable from the plugin menu, and user settings can be stored as presets.
specs: |-
  - 50 factory presets for drums, vocals, synth, bass, acoustic, keys and mastering
  - Four compression types with adjustable RMS
  - One-click parallel compression
  - Hard and soft clip saturation with transient and character controls
  - Stereo imager with frequency focus
  - Per-module and master gain controls
  - Real-time waveform display
  - Resizable interface
  - Updated preset manager
  - Native Apple Silicon and arm64 support
  - Full PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
