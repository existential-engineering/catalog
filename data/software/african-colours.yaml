details: |-
  African colours brings rare instruments, drums and vocals from south & north africa to your fingertips. You can play solo instruments, patterns and phrases through our kontakt engine or shape wav files to your taste.

  You can play many solo multisample instruments, popular ones like kalimba and marimba or rare ones like balafon, kora, ngoni and a handful of drums.

  The library offers sounds from 2 vocal performers, playable phrases to patterns, words and extras. Performers are from segou, mali.

  The library comes with 288 patterns and phrases for all instruments, vocals and drums. You can mix these with the solo instruments to create textural and authentic pieces.
