details: |-
  Awesome Piano by Digital Systemic Emulations is a virtual instrument audio
  plugin for macOS and Windows. It functions as a VST plugin and an Audio Units
  plugin.

  1855 broken and dissonant pleyel piano. About 30 mo of samples (recorded in
  .wav 48 khz 16-bits). Slightly re-tuned to be able to play with other
  instruments but keeping dissonant.

  A simple piano? No, that's boring. Get ready for some unique sounds: this is
  worn, out of tune, old and dusty piano that will fit well in a halloween
  soundtrack. Very versatile and easy to use.
