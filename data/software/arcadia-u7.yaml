details: >-
  The arcadia u7 is inspired by the iconic direct box found in geddy lee's rig
  and in studios around the world! Add subtle warmth to your direct signal and
  process with the 7 included eq curves, 6 of which are taken from the hardware
  unit and the 7th being a custom curve created as the ideal curve for his bass
  di.


  Perfect for bass, guitar, and keyboards with subtle class a warmth and 7
  pre-set eq curves.


  Plugin formats: mac os x (64-bit) vst3, AU, AAX - (apple silicon and intel).
  Windows (64-bit) vst3.


  System requirements: mac os 11, 12 or 13, intel processor or apple silicon.
  Windows 10, or windows 11, x64 architecture.


  Required disk space: 20mb.
