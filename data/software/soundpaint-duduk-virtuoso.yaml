details: |-
  The Art of Emotional Legato

  Duduk Virtuoso is an ultra deep-sampled (UDS) virtual instrument carefully crafted to deliver authentic realism and emotional depth. Capturing the full spectrum of expressive legato transitions and detailed vibrato techniques performed by master Duduk soloists, every note resonates authentically and naturally. The Duduk, an ancient Armenian woodwind, is celebrated globally for its profoundly evocative sound, prominently featured in iconic film scores such as Dune Series, Gladiator, Avatar, The Last Temptation of Christ, Syriana, Munich, Chronicles of Narnia and countless others. We collaborated with Duduk soloist Mher Mnatsakanyan to record his personal Bb Duduk, selected from over 100 handcrafted instruments in his collection. The instrument was built by his father as part of the Nurwind family legacy, using dense apricot rootstock to produce a tone rich in warmth and character. Duduk Virtuoso offers four premium microphone positions. Neumann TLM 103 Stereo, U47 Stereo, U87 Mono Left, and U87 Mono Right. Capturing every nuance and subtlety with pristine sonic detail. Duduk Virtuoso captures the full emotional range of the instrument through a diverse set of legato styles—from subtle, breath-infused phrases to bold, expressive transitions. Each articulation is designed to reflect a specific emotional and musical quality, as detailed below.
