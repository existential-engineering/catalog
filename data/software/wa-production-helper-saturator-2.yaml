description: A saturation plugin with tube and tape distortion modules and a pair of low pass and high pass filters for shaping the saturated signal. It can process the stereo signal, the mid, the side, the left or the right channel alone.
details: |-
  Helper Saturator 2 is a saturation plugin from the Helper series, intended to add analog style warmth to a signal without over-distorting it. Two saturation modules, two filter modules and five channel modes make up the whole of the plugin.

  The two saturation modules are tube distortion and tape distortion. Both colour a signal rather than tearing it apart, and the plugin is aimed at drums, bass and vocal tracks as much as at sub-mixes and complete mixes.

  Low pass and high pass filter modules cut unwanted frequencies out of the saturated signal. They can also be used to reshape a sound deliberately rather than simply to clean one up.

  Five channel modes select which part of the source is saturated: stereo, mid, side, left or right. Input and output gain controls allow gain staging before and after the saturation stage.

  Ten factory presets ship with the plugin, and the interface is resizable and described as CPU friendly.
specs: |-
  - Tube and tape saturation modules
  - Low pass and high pass filter modules
  - Five channel modes (stereo, mid, side, left, right)
  - Input and output gain controls for gain staging
  - 10 factory presets
  - Preset manager
  - Resizable interface
  - Responsive and CPU friendly
  - Version 2.0.0 added a new interface, a preset manager, Catalina compatibility and Pro Tools AAX support
  - Version 2.1.0 added a resizable interface, an updated preset manager and updated license management
  - Version 2.2.0 added native Apple Silicon and arm64 support
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
