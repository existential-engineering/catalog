name: Sibelius
manufacturer: avid
primaryCategory: notation
description: Sibelius is Avid's music notation software for composing,
  arranging, and publishing scores and parts, sold in three tiers (First,
  Artist, and Ultimate) with a companion mobile app.
details: |-
  Sibelius is a scorewriter for macOS and Windows that covers writing, engraving
  and publishing notated music, from a lead sheet to a full orchestral score with
  extracted parts. It plays scores back through bundled sounds, imports and
  exports MusicXML and MIDI, and shares scores to the cloud for review.

  Three desktop tiers differ by the size of score they allow. Sibelius First is a
  free registered download limited to four staves, Sibelius Artist supports up to
  16 staves, and Sibelius Ultimate has no staff limit and adds the customization,
  worksheet and publishing tools aimed at professionals and educators. Artist and
  Ultimate are sold as a monthly or annual subscription or as a perpetual licence.

  Sibelius for mobile runs on iPad, iPhone and Android, and unlocks the tier tied
  to the user's Avid Master Account. Projects move between the desktop and mobile
  apps, and a single user can run Sibelius for mobile on up to five devices.

  Recent releases have added a dark colour theme and refreshed ribbon icons
  (2026.2), VST3 plugin support for playback and QR codes for shared scores
  (2026.5), cross-staff accidentals and macOS Quick Look previews of .sib files
  (2026.6), and line style customization with macOS Spotlight search (2026.8).
specs: |-
  - Three tiers: Sibelius First (4 staves), Artist (16 staves), Ultimate (unlimited)
  - Score playback with bundled sound library
  - VST3 plugin support for playback devices
  - MusicXML import and export
  - MIDI import and export, including Flexi-time recording
  - Note entry by MIDI keyboard, computer keyboard and mouse
  - Cloud sharing of scores for review and comment
  - PhotoScore score scanning (Lite or First depending on tier)
  - AudioScore audio transcription (Lite or First depending on tier)
  - Dynamic parts extracted from the score
  - Sticky note and text comments for review
  - Cloud Licensing through Avid Link
