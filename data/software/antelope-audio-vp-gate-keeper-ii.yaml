details: |-
  VP Gate Keeper II is a VCA gate and expander effect modeled after the classic Kepex II unit. The plugin delivers fast response, clean sound and unparalleled musicality through five continuously variable parameters.

  Key capabilities include active expansion for transient-heavy sources, leakage prevention, and creative effects via keying mode. The device uses proprietary Anticipatory Release Computation technology to prevent waveform modulation and excessive pumping.
