description: TIME TEXTURES EXPANDED advances the creation of rich, evolving musical textures with an even broader range of tonal possibilities. Utilizing advanced algorithms, it enhances orchestral and solo instruments with unprecedented depth, movement, and beauty.
details: |-
  TIME TEXTURES EXPANDED builds on the original TIME TEXTURES, using advanced algorithms to fold orchestral and solo instruments into themselves and create evolving musical textures with a broader range of tonal possibilities. It contains all the content of the original and adds new tonalities, instruments and features, so it doubles as an upgrade path for existing users. Unlike synthetic alternatives it is rooted in high-quality acoustic recordings, giving soundscapes that evolve naturally and carry a human touch suited to film scoring in the style of Inception, Arrival or Dune 2.

  The engine consists of two sound emitters that produce sound particles from each individual instrument source. Five basic parameters are controlled separately for both instrument layers and tied to the mod wheel: Dynamic for intimacy through power, Movement to add special articulation particles and morph between sounds, Flow to blend legato transitions into the texture for a naturalistic legato stream when holding chords, Octaves to set how many octaves the source emits, and Speed to set how densely particles are played back. Further parameters, Attack Volume, Seed, Note Select, Spread, Gain and Pan, make every texture customizable.

  The library holds 37 instrument patches, each meticulously recorded and sampled with up to six round robins and up to five dynamic layers, plus instrument-specific articulations recorded alongside the sustains and faded in with a slider. String patches carry tremolo and staccato, woodwinds carry Tenuto, Triplet Tongue and Staccato, brass carries Tongue Staccato, Flutter Marcato and Muted Staccato, and the keys section adds harp harmonics and prepared grand piano alongside harp, felt piano and grand piano.

  Against the original, the Expanded version adds 12 new instruments including orchestral soloists and exotic Persian string instruments, the Flow slider, live repetition elements that add rhythmic pulsation, more than 150 new presets for a total of over 360, an expanded sound palette, new FX and sustain pedal support. Presets are divided by feel and character, spanning naturalistic orchestral textures that merge with the mod wheel and cinematic presets that expand the orchestral sounds with a wide effects chain.
specs: |-
  - Works with the FREE KONTAKT PLAYER
  - Requires KONTAKT version 7.10.1 or higher
  - Contains all content from the original TIME TEXTURES
  - 37 meticulously recorded and sampled instrument patches, 12 of them new
  - Over 360 ready-to-go naturalistic and cinematic ensemble presets, 150+ of them new
  - Up to six round robins and up to five dynamic layers per instrument patch
  - 22 GB of uncompressed data
  - Two sound emitters with independent Dynamic, Movement, Flow, Octaves and Speed parameters tied to the mod wheel
  - Attack Volume, Seed, Note Select, Spread, Gain and Pan controls per emitter
  - Flow slider for organic legato transitions
  - Live repetition elements adding rhythmic pulsation
  - Multiple articulations per orchestral section: tremolo and staccato strings, Tenuto/Triplet Tongue/Staccato woodwinds, Tongue Staccato/Flutter Marcato/Muted Staccato brass, harp harmonics and prepared grand piano
  - Sustain pedal support and additional FX
  - macOS 10.12 or higher
  - Windows 10 or higher
  - 4 GB RAM (6 GB recommended for large KONTAKT instruments)
  - At least 13.76 GB of free hard disk space
  - Some presets require an Intel i7 processor or higher to run smoothly
