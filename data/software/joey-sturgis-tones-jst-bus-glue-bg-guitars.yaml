details: |-
  The ultimate compressor for guitar bus glue.
  JST Bus Glue BG-Guitars is a flagship compressor from Joey Sturgis Tones designed specifically to address guitar bus compression needs in any mix. This workhorse audio plugin brings a variety of flavors and character to your guitar bus, unmatched by any other guitar bus processor.
  Nothing rocks more than a big stack of guitars, but keeping those guitars loud and proud without drowning out the rest of your mix can be a challenge. JST Bus Glue BG-Guitars is a unique bus compressor that solves for that exact problem by controlling your guitar dynamics (while optionally adding tone and harmonics to your guitar bus)! Interact with your guitars like never before with JST Bus Glue BG-Guitars.
  Tone Circuit
  Adjust the overall tone of your guitars by switching from Dark to Bright depending on the overall needs of your mix.
  Harmonic Boost
  Add lush harmonics to your guitars with the optional harmonic boost built into JST Bus Glue BG-Guitars.
  Three Compression Modes
  Tame (Least Compressed)
  Clamp
  Smash (Most Compressed)
  Compression Strength
  Once you've selected a compression mode, dial in how hard it works with a straightforward Comp Knob from Low to Medium to Max strength.
  Mix Control
  Blend the compressed and uncompressed signals for parallel compression and punch with the Mix Knob.
  Makeup Gain
  For proper gain staging, use the Output Knob to set the perfect output level from the plugin.
  Metering & Threshold Override
  See the amount of gain reduction applied by your compressor and use the meter screw to transform JST Bus Glue BG-Guitars from a fixed-threshold compressor to a user-defined threshold value.
  About Bus Glue
  Bus Glue is a series of Bus Compressors designed to excel at controlling the dynamics of specified mix bus groups in a mix using a variety of compression and saturation types combined with over a decade of mixing knowledge and lots of practical field testing across several genres of music.
  The goal was to come up with a set of compressors that could do something other compressors weren’t made to do. Most compressor designs are too broad in application and that is why you typically need to stack compressors or insert other processors in your bus chain to achieve desired results.
  However, Bus Glue compressors are about as specific as you can get by design, but that’s what makes them so useful. By using Bus Glue as your dynamic control across your various mix busses, you’ll expand your dynamic palette while crafting a whole new sound that is unrivaled by other compression processors.
