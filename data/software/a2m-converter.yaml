details: >-
  The a2m tool is designed for real-time audio to MIDI conversion. Convert your
  audio source directly to MIDI. Connect your guitar to the line input or a
  different analogue instrument via a microphone, play it, and hear any
  instrument selected from a range of samplers and synthesizers.


  A2m itself does not have any built-in samples, but it allows you to use
  thousands of excellent third-party virtual instruments. Any instrument which
  receives MIDI (both physical instruments as well as virtual plug-ins) will
  work with the application.
specs: |-
  - Real-time audio to MIDI conversion
  - MIDI output
  - Windows 8 (64-bit) or later
  - Macos 10.11 (el capitan) or later
  - 4gb ram minimum
  - 8gb ram recommended
  - Built-in or external audio interface support
  - Standalone application
  - No polyphony
  - No pitch bending
  - First default audio-in channel only
