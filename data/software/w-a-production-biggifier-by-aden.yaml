description: A one-knob enhancement plugin developed with producer Jonas Aden that thickens and widens kicks, vocals, synths and other material. Five bespoke signal chains cover processing built around ideas such as chorus, reverb and overdrive, shaped further by Mix and Length dials.
details: |-
  BIGGIFIER by Aden is a one-knob processor built to make a source sound bigger, fatter and more room filling, from a thin kick to a quiet vocal or a flat sample. The single Bigness dial drives the processing, and the plugin is aimed at experienced producers and at people starting out in sound design alike.

  It was designed by artist, songwriter and producer Jonas Aden together with W. A. Production. Aden has released records on labels including Spinnin, Musical Freedom, Hexagon, Heldeep and STMPD, has collaborated with Brooks, Mesto and Mike Williams, has remixed Katy Perry, Zedd, Tiesto, Jonas Blue and Rita Ora, and holds co-writing and production credits with Martin Garrix, Alan Walker and ASAP Rocky.

  Five modes each run a separate signal chain for making audio fatter, wider and juicier. Some are based on familiar processing such as chorus, reverb and overdrive, with further settings applied under the hood. Mix and Length dials shape the result, so the same mode covers anything from a subtle thickening of a synth line to a harder hitting kick.

  Input and output gain are adjustable, and live input and output meters show the signal in real time as it passes through the plugin. The input fader carries a safety limiter, and the Mix ratio control blends the processed signal with the original audio for parallel processing.

  Factory presets cover guitars, bass, drums, synths, vocals and other material, ranging from subtle thickening to full transformation effects. A PDF manual and a tutorial video are included.
specs: |-
  - Designed by Jonas Aden
  - Artist curated bespoke effect chains
  - 5 distinct BIGGIFIER modes with Length control
  - Adjustable input and output gain
  - Input fader carries a safety limiter
  - Live input and output metering
  - Mix ratio control for parallel processing
  - Factory presets
  - Full PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
