details: |-
  BIGGIFIER by Aden is a powerful one-knob that delivers an instant and
  addictive shot to the metaphorical arm of any sound. Jack up that wimpy kick,
  beef up the faintest of vocals and juice any flaccid sample into a big, fat,
  room-filling sound.

  Biggifier houses 5 bespoke signal chains for making any type of audio fatter,
  wider and juicer. Some of these modes are based on tried-and-tested concepts
  like chorus, reverb and overdrive but each has been given that special jonas
  aden twist. Secret settings under the hood push these once-familiar processing
  tools into territory that will breathe new life into your productions.

  The biggifier is ludicrously simple to use and the interface allows you to
  easily make tweaks to the processing so that every element is personal to you
  and your music. Utilise the mix and length dials to shape the effects further.
  So whether you want a subtle thickening of your synth line, or a
  harder-hitting kick, there's a perfect setting in biggifier to get you the
  sound you desire as quickly as possible.

  With adjustable gain levels, the live input and output meters show exactly
  what's happening to the signal as it travels through the plugin in real time.
  The input fader also features a safety-limiter. Choose to combine the
  processed signal with your original raw audio via the mix ratio control,
  allowing you to dial in parallel processing effects.

  The many included presets will speed up your search for the perfect starting
  point to begin beefing up elements of your track. These factory options can be
  used on guitars, bass, drums, synths, vocals and any kind of audio. The
  presets include everything from subtle thickening to more full-on
  transformation effects.
