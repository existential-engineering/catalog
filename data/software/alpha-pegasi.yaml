details: |-
  Alpha pegasi is a sample-based synthesizer. It has four oscillators, each containing 86 instruments in 6 categories. Every osc has its own gate, 3 band eq, delay, envelope and vibrato.

  There are 4 lfos that can be routed to any osc amp, pan and eq.

  Plugin is designed mostly for pad and synth sounds, but due to full-spectrum modulation it can produce miscellaneous atmospheric effects.
specs: |-
  - Four oscillators
  - 86 instruments per oscillator
  - 6 instrument categories
  - Gate per oscillator
  - 3-band eq per oscillator
  - Delay per oscillator
  - Envelope per oscillator
  - Vibrato per oscillator
  - 4 lfos
  - Lfo routing to osc amp
  - Lfo routing to osc pan
  - Lfo routing to osc eq
  - Full-spectrum modulation
  - VST plugin
  - Windows compatible
  - Sample-based synthesizer
