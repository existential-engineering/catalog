description: Aparillo is an advanced 16-voice FM synthesizer, tailored for
  majestic sonic motions.
details: |-
  Aparillo uses just 4 operators that share a single adsr envelope. It's
  relatively easy to wrap your head around so if you have a bit of an
  understanding of fm synthesis, you won't have any trouble making a few basic
  patches with that distinctive fm edge to them. But that's just the start of
  what aparillo has to offer because it has 16 copies of this set-up ready for
  you to modulate and sequence in amazing ways.

  The lfos are used to offset the 16 voices to provide anything from a subtly
  shifting thickness to the sound or complete mayhem. Add in a simple sequencer
  that plays off what's happening with the lfos, sequencing each of the 16
  voices in turn, and you've got yourself an absolute monster of a synth.

  The orbit is a dynamic, visual tool for provoking even more
  modulation/mutation of the sound. It consists of 16 widgets for each of the
  modulatable parameters, including some effects parameters, plus the orbiter,
  which is the control element. As you move the orbiter around it connects with
  different parameter widgets and as it gets closer to a widget, the amount of
  modulation on that parameter increases. You can record the movement of the
  orbiter to create a patch that morphs over time in a very natural, organic way
  or you can set it up statically to add an extra layer of modulation to any
  parameter(s).

  Aparillo also has a polyphonic mode where you can play chords and get all 16
  voices per note. The effects include a filter, a delay, a reverb, a panner and
  a spatialiser effect, and as their controls can be modulated, they add a bit
  extra to the sound design process.
specs: |-
  - 16-voice FM synthesizer
  - 4 operators with shared ADSR envelope
  - Sine wave modulation
  - LFO modulation
  - Pattern sequencer
  - Orbit dynamic visual modulation tool
  - Multi-mode filter
  - Delay effect
  - Reverb effect
  - Panner effect
  - Spatialiser effect
  - Wave shaping
  - Formant shifter
  - Wave folder
  - Wave shifter
  - Sample and hold
  - Sound morphing
  - Arpeggiator
  - Polyphonic mode
  - macOS support
  - Windows support
  - Universal 2 binary
  - Resizable gui
