description: Tube Delay is a slightly dark and distorted delay plugin. It's a
  vintage-style echo plugin that allows you to create everything from clean
  doubling effects to endless dub delays with filthy feedback. This dub delay
  plugin features three distinct tube stages in its design.
details: |-
  A slightly dark and distorted delay has a way of giving a great sense of space and size to a mix without really drawing attention to itself. Tube Delay is a vintagey analog style echo box that allows you to create everything from clean doubling effects to endless dub delays with filthy feedback.

  The plug-in is built around three distinct tube stages, with a tube preamp simulation, a vintage style passive EQ in the feedback path, and a gritty feedback feature that lets the repeats degrade as they build up.

  Delay time runs from 1 to 1000 ms and can be synced to the host tempo, so the same unit covers tight slapback doubling and long dub-style echoes.

  Tube Delay supports Softube Extended Features: easy-access panels that add modern precision and workflow on top of the vintage-styled main interface.

  It is Modular Ready and Amp Room Ready, so it works both as a native plug-in and as a module inside Softube Modular (the Eurorack platform) and Amp Room (the pro audio guitar platform).
specs: |-
  - 1-1000 ms delay
  - Sync tempo to host
  - Vintage style passive EQ
  - Gritty feedback feature
  - Tube preamp simulation
  - Three distinct tube stages
  - Supports Softube Extended Features
  - Modular Ready: works as a native plug-in and as a module in Softube Modular
  - Amp Room Ready: works as a native plug-in and as a module in Amp Room
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Softube account required
  - iLok account required (no physical iLok required)
  - Internet access required for downloading installers and managing licenses
  - Three activations
