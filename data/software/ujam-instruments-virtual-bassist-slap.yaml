description: SLAP will energize any production with electric bass lines, but it's particularly great on Pop, Funk, Jazz and Rock tracks. Especially highly rhythmical patterns and uptempo styles are its forte.
details: |-
  SLAP is the wild child among the UJAM bassists: a modern, sophisticated and off the wall virtuoso. Driving your song with character and soul, it is an ever energetic creative live wire, and in parallel there is all the reliable professionalism you expect, laying down incredibly realistic basslines.

  The advanced recording and phrase techniques used in SLAP are based on a Stingray bass with an active pick-up system, which provides its spirited yet balanced character. The playing styles and patterns are convincingly realistic with the sophistication of a highly seasoned professional bass player, and all of it is controlled with just a few MIDI notes and clicks.

  A Finger/Slap toggle switch swaps between a fingered and a slapped playing technique, which drastically changes the sound, and both playing styles can be combined effortlessly. SLAP, with its combined slap and finger techniques, complements Virtual Bassist ROWDY, which is plectrum-based.

  The Amp knob offers three different combinations of bass amps and speakers, each with its distinct sound character, plus a direct setting for external amplification gear or plug-ins. The Character rotary switch changes the overall character of the bass sound and response. Instrument Mode gives complete access to all articulations so you can play exactly as you want with a MIDI controller, including dead notes, full stops and slides.
specs: |-
  - Sampled Stingray-style bass with active pick-up system
  - 30 styles with over 350 individual phrases
  - Both slap and finger style playing techniques, with a Finger/Slap toggle
  - More than 100 presets
  - 30 Finisher multi-effect modes
  - Amp knob with three amp and speaker combinations plus a direct setting
  - Character rotary switch
  - Instrument Mode with full access to all articulations
  - MIDI drag and drop
  - Resizable user interface
  - PreSonus chord and key track support in Studio One 4.6.2 or later
  - Operating systems: Windows 10 to Windows 11, macOS Catalina (10.15) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 7.23 GB of disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, 64-bit only
  - Automated installation via UJAM App, or downloadable installer file
  - Authorization via the UJAM App, or email and password within the plug-in
  - Supported standards: MIDI
