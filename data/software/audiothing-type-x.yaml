description: Vintage dynamic range expander plugin based on the dbx 1BX, with
  added features like sidechain filtering and soft clipping (VST, AU, AAX,
  CLAP).
details: |-
  Type X is a faithful emulation of the dbx Model 1BX, a compact dynamic range expander from the golden age of consumer hi-fi audio. Built to expand dynamics and add expressive contrast, Type X adds life, punch, and presence to any track by dynamically increasing the difference between loud and soft passages.

  While the original was designed to enhance playback from compressed sources like tape or broadcast, Type X introduces modern flexibility. It features a sidechain input with high-pass and low-pass filters, allowing precise control over what drives the expansion. Additional parameters for internal attack and release times give deeper shaping capabilities beyond the fixed response of the original hardware.

  Type X works by applying wideband dynamic expansion, a process that increases the difference between quiet and loud parts of a signal. Instead of compressing like a traditional compressor, it does the opposite: quiet sounds get quieter, and loud sounds stay loud (or even get slightly louder), making the music feel more dynamic and expressive. Internally it analyzes the input using a true RMS detector, just like the original hardware, and applies gain changes based on the expansion ratio when the signal crosses a user-defined transition level.

  The filtered sidechain lets you shape exactly what content triggers the expansion. You can choose between the main input and an external sidechain signal as the source, then sculpt it with dedicated high-pass and low-pass filters, adjust the sidechain level independently with the Gain control, and enable source listening to hear exactly what audio the expander is using.

  Introduced in 1978, the dbx 1BX was designed to enhance the listening experience by increasing the dynamic range of audio playback. As a single-band expander with an expansion ratio adjustable up to 1.5:1, it could deliver up to a 50% improvement in stereo dynamic range across a wide frequency spectrum, making it a valuable tool for revitalizing compressed sources like vinyl records, cassette tapes, and FM broadcasts.

  Type X is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP). It is also available on the App Store for iOS and iPadOS (AUv3 and Standalone).
