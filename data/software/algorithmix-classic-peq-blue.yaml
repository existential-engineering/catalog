description: DirectX/VST 10-band high-resolution parametric equalizer switchable
  among twelve equalizer characteristics emulating the most legendary analog
  equalizer circuits.
details: |-
  Classic PEQ Blue is 12-in-1: the most complete collection of classic
  equalizers ever in one DirectX/VST PlugIn with ten serial plus two parallel
  types. It offers precise emulation of legendary analog equalizers, extended by
  progressive new models across standard, vintage, modern, and experimental
  categories.

  Every PEQ type has 10 bands with five freely assignable parametric filter
  types including bell, low-shelf, high-shelf, low-cut, and high-cut. The
  collection includes Classic Symmetrical, three Proportional PEQs, three
  Constant-Q variants, Algorithmix proprietary constant-Q types, and two vintage
  parallel equalizers (Parallel LC and Parallel FF-FB).

  Classic PEQ Blue combines the best of both the analog and digital worlds.
  Reference-quality upsampling techniques are automatically applied at 44.1 or
  48 kHz to avoid bell filter asymmetry at high frequencies. The proprietary
  filter algorithms achieve huge dynamic range, extremely low noise and
  distortion.

  The whole equalizer collection works with sample rates up to 384 kHz, suitable
  for DSD post-processing. The true frequency response display is zoomable and
  the DirectX version can be enlarged to full screen.
specs: |-
  - 12 equalizer types in one plugin
  - 10 bands per type with 5 filter types each
  - Classic Symmetrical, Proportional, Constant-Q, and Parallel types
  - True emulation of delay-free feedback loops
  - Q adjustment on 2nd order shelving filters
  - Reference-quality upsampling at 44.1/48 kHz
  - Supports sample rates up to 384 kHz
  - Zoomable frequency response display
  - Compatible with Sequoia, Samplitude, Pyramix, WaveLab, Adobe Audition, Nuendo, Cubase
