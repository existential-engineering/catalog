details: |-
  The 32classic channel strip plug-in by harrison audio is a fully featured channel strip complete with four-band parametric eq, high pass and low pass filters, transformer saturation with 'drive' control, compressor and gate/expander everything you need to make music with the classic harrison sound.

  Emulating the harrison 32classic analog mixing console, the 32classic channel strip plug-in delivers the sound and workflow that generations of artists and engineers have trusted to help craft their sound.

  Classic four-band parametric eq with proportional q providing versatile, musical results on nearly all instruments and sounds. Switch between shelf and peak mode on the high and low bands and use the overlapping mid bands to carve out your classic sound.

  Experience the ultra-wide frequency ranges of these famous filters. High pass from 25hz to 3.15khz and low pass from 160hz to 20khz allows a range of filter control from extreme to beautifully subtle. Use them in combination with the 32classic eq for unique results.

  The full-featured compressor provides all the control you would expect in a standalone unit, with three types of compression (comp, level, limit) and a sidechain filter with sweepable frequency and a 'listen' function. The 'emphasis' knob allows you to access more vintage character by forcing the compressor to react more quickly to louder sounds resulting in smoother results.
specs: |-
  - Four-band parametric eq with proportional q
  - High pass filter (25hz to 3.15khz)
  - Low pass filter (160hz to 20khz)
  - Transformer saturation with drive control
  - Jensen jt-mb-cpca transformer-coupled mic pre emulation
  - Compressor with three compression types (comp, level, limit)
  - Sidechain filter with sweepable frequency
  - Gate/expander
  - Shelf and peak mode switching on high and low eq bands
  - Overlapping mid bands
  - Emphasis knob for vintage character
  - Gain-reduction reporting
