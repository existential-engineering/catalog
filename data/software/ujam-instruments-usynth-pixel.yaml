description: Usynth PIXEL takes you back to the days of classic game consoles of the 80s and 90s, with a treasure trove of classic console sounds, from fluty leads to juicy bleeps.
details: |-
  Usynth PIXEL takes you back to the days of classic game consoles of the 80s and 90s. UJAM joined forces with legendary composer David Wise (Donkey Kong Country) to deliver the real deal. Explore a treasure trove of classic console sounds, from fluty leads to juicy bleeps. All driven by a state-of-the-art synthesizer engine fit to save a princess.

  Usynth PIXEL covers the full range from basses via chords to melodies and arcade FX. Even drums. Time-travel to the glorious days of gamepads, pixels and quirky tunes. Mood-boost your tracks with nostalgic sonic eyewinks.

  Unleash effortless inspiration with Usynth and its powerful Synthesizer Engine, game-changing Finishers, flexible built-in delay and reverb units, intuitive browser, and a user-friendly interface. The Finisher transforms PIXEL's classic retro synth modes into a modern take on mix-ready synthesizer sounds, and the Surprise function creates random variations of adjustable depth with just one click.

  Usynth's Sequencer is more than just that, it is also an Arpeggiator, Phrase Generator and Melody Player. Transform your sound with the five Vari knobs and add a dash of surprise, with no synth skills needed.
specs: |-
  - Retro game multi-synthesis engine
  - 100 Synthesizer Presets
  - 100 Global Presets
  - 30 versatile Sequencer Presets with 180 phrases
  - Sequencer doubles as Arpeggiator, Phrase Generator and Melody Player
  - Five Vari knobs plus Surprise randomisation
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8GB of RAM
  - 0.28GB of free disk space
  - 1280x768px display, internet connection
  - Moving the .blob sample content file to an external drive is not supported
  - Plug-in formats: AAX, AU 2, VST 2 and VST 3, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Requires the latest version of the UJAM App, which installs the Usynth plug-in that hosts all titles
