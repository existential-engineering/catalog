description: PERRCS delivers top-end orchestral percussion straight from Hans Zimmer's vault. From shakers to rimshots, every sound is built to add energy, motion, and cinematic punch.
details: |-
  PERRCS delivers top-end orchestral percussion straight from Hans Zimmer's vault. From shakers to rimshots, every sound is built to add energy, motion, and cinematic punch. It brings thunderous hits and shimmering textures ready to inject raw energy, drama, and rhythm into everything from film scores to pop tracks.

  Percussion splits into low and high layers that can be crossfaded, and each is shaped with Character, Motion FX and EQ for precise, cinematic control.

  Built-in rhythmic styles and solo parts create dynamic phrases. Everything locks to tempo and adapts instantly to your production.

  The sound design section uses Finisher and FX to reshape the percussion, moving from natural orchestral sounds to gritty textures and modern cinematic pulses in seconds.
specs: |-
  - Wide range of top-end percussion performances, including sticks, shakers, daiko, wood blocks, surdos, drums, triangles and anvils
  - 74 rhythm styles, each containing 17 playable phrases, intros, fills, endings and hits
  - 320 sound designer presets
  - 74 Finisher multi-effect modes and 29 ambient treatments
  - Low and high layer control with crossfade, Character, Motion FX and EQ
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 1.5 GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery: automated installation via the UJAM App, or downloadable installer file
  - Authorization via the UJAM App, or email and password within the plug-in
  - All MIDI phrases and included sounds are royalty-free
