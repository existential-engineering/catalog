details: |-
  Birds Noise is a VST format plug-in for Windows, which adds the sound and
  atmosphere of alive nature to your recordings: bird songs, bird trills,
  twittering, chirping etc.

  The purpose of the plug-in is to add sounds produced by birds such as
  nightingales, sparrows, crows, thrushes, larks, starlings, goldfinches,
  siskins and many other in their natural habitat.

  There are three slots in birds noise VST which you can use to mix different
  noise profiles to produce complex and variable birds noise environments.

  With the help of the embedded equalizer, it is possible to either emphasize or
  mute those parts of the noise profile you want. The features of the equalizer
  are selected in such a way that it keeps its use of noise sounding natural.

  In the set there are 32 of factory presets based on 21 of birds noise profile.
  The built-in preset manager makes it easy to save the settings and quickly
  access them or share them with other birds noise users. In addition, VST
  automation and full MIDI learning are supported.
specs: |-
  - VST format plug-in
  - Windows
  - Three noise profile slots
  - Embedded equalizer
  - 32 factory presets
  - 21 Birds Noise profiles
  - Preset manager
  - VST automation
  - MIDI learning
