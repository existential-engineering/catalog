details: |-
  Blackhole is based on Eventide's space blackhole effects pedal. While most
  reverbs are constrained by the physics of the real world, Eventide's blackhole
  reverb creates virtual spaces that could never exist in our reality.

  At large sizes, its soft attack and lingering, harmonic tails allow it to
  really shine on guitars, strings and pads.

  Over 50 presets to inspire, including artist presets by: richard devine, flood
  & alan moulder, sigur rs, vernon reid and john agnello.

  Unique "gravity" control allows you to invert the decay mode of the reverb.
  Mix lock allows you to scroll through presets or settings while keeping the
  wet/dry mix constant. Flexible mono and stereo options for inputs and outputs.
  Kill switch kills the input so you only hear the reverb, great for sound
  design and automation. Innovative ribbon and hotswitch allow for changing any
  combination of parameters simultaneously.

  H9 series: blackhole by eventide is a virtual effect audio plugin for macos
  and windows.
specs: |-
  - Reverb
  - Gravity control
  - Mix lock
  - Mono and stereo input/output options
  - Kill switch
  - Ribbon control
  - Hotswitch
  - Delay effects
  - Spatial effects
  - Over 50 presets
  - Universal 2 binary
