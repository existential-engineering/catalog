details: >-
  Amboea is a modulated multi-tap/multi-delay effect designed for a specific
  effect for ambient music. It was designed to delay parts of the sound by
  different synced periods with modulated feedback to transform pads, arpeggios
  etc. Into expansive, shifting, panoramic environments.


  This effect is implemented as eight parallel delays with crossfading before or
  after each. Delays can also be arranged in serial form so that each echo can
  be specified by duration, panning, filtering and pitch shift.


  This configuration is appropriate for creating irregularly timed echoes,
  panning echoes, audio arpeggiation and other effects suitable for ambient,
  glitch and other styles.


  Features: twenty algorithms to suit cpu use to the application. 8 stereo
  biquad filtered, panned integer delay lines. Serial or parallel configuration.
  Host synced algorithmic crossfading before or after delay lines. Windowed
  pitch shifting. Randomised lfo modulation of feedback amount (optionally amp
  or cutoff).
specs: |-
  - Eight parallel delays with crossfading
  - Serial or parallel configuration
  - Host synced algorithmic crossfading
  - 8 stereo biquad filtered, panned integer delay lines
  - Windowed pitch shifting
  - Randomised lfo modulation of feedback amount
  - Twenty algorithms
  - Int length delays with best signal reproduction
  - VST plugin
