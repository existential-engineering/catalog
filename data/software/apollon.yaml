details: |-
  Apollon is a software drumcomputer with eight instruments and a sequencer.
  Each instrument is synthesized (no sampling) based on old analog drummachine
  sounds.

  A delay and reverb effect can be added to each track separately. The sequencer
  is simple to use and offers a shuffle parameter for each sequence to get
  groovy rhythms.

  The sequencer can be synchronized to your DAW or turned off to trigger the
  instruments via MIDI.
specs: |-
  - Eight virtual analog instruments (bass drum, snare, low tom, high tom,
  closed hihat, opened hihat, CLAP, rimshot)
  - Step sequencer with accent capability
  - Shuffle parameter for each instrument track
  - Level control per instrument
  - Panning per instrument
  - Delay effect per instrument
  - Reverb effect per instrument
  - Three sequencer modes (standalone, DAW clock sync, MIDI trigger)
