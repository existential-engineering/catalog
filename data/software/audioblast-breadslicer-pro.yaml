description: The BreadSlicer Pro is a creative glitch effect tool that cuts
  audio input into slices and transforms into breaks, rolls and glitches
  instantly.
details: |-
  BreadSlicer Pro is a powerful glitch effect tool designed to take your audio manipulation to the next level. With a simple press of the "ACTIVE" button, the tool slices your audio into segments, creating real-time breaks, rolls, and glitches that sync with the tempo of your track.

  This tool is designed for creativity and unpredictability. BreadSlicer Pro features controls like Reverse, FX, PAN, PITCH, and ROLL, all influenced by a random algorithm. As you increase the values of these controls, more randomization is applied to each slice, enhancing the dynamic nature of your sound.

  BreadSlicer Pro captures live audio input in real-time. It slices your audio according to the "Slice Size" fader and rearranges the slices, perfectly synchronized with the track's tempo. The random algorithm introduces spontaneous effects, ensuring each performance is unique.

  Perfect for musicians, producers, and sound designers, BreadSlicer Pro offers endless creative possibilities for transforming audio. Whether used on a track or return track, it allows you to experiment and shape your sound in real time.
specs: |-
  - Auto Glitch
  - Host tempo synchronized
  - Slice Size
  - Slice Amount
  - Gate
  - Reverse
  - Random FX
  - PAN
  - Pitch
  - Roll
  - 4 integrated FX: Reverb, Bit Crusher, Hi Pass Filter, Pitch FX
  - Control the amount of Random with knobs
  - Just activate the plugin to get instant glitches
  - Slice Amount fader increases the likelihood of applying effects to the slices
  - Gate knob is a global, non-randomizable control that sets the gate for each slice as it plays
