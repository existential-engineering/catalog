description: MasterVerb 7 is a reverb plugin designed to create pristine-sounding spaces. It features two distinct algorithms, Hall and Plate, allowing for the recreation of a wide range of acoustic environments, from intimate rooms to expansive concert halls and dense plate reverbs, all with silky-smooth decays free from artifacts.
details: |-
  With independent controls for early reflections and late reverberation, including adjustable size, decay time, and dual 3-band EQs, MasterVerb offers extensive flexibility for shaping the reverb's character.

  The graphical interface includes a 3D frequency response plot, making it easy to visualize and fine-tune settings. A ducker increases the clarity of foreground sounds, an envelope processor creates gated and reverse reverb effects, and delay times can be beat synchronized.

  MasterVerb 7 is included in Power Suite 7.
specs: |-
  - Two late reverb algorithms, Hall (for all sizes of rooms) and Plate (for super dense plate reverbs)
  - Early reflection section covering halls, rooms, plates, chambers, echo, cathedral, nightclub, and ping-pong
  - 3-band EQs for early and late frequency response adjustment
  - Triggered envelope control for special effects such as gated and reverse reverb
  - Ducking compressor ducks reverb during foreground sounds
  - Beat synchronization options for delays and envelope times
  - Graphical displays for EQ curves, time response, and 3-D frequency response
  - Normal and detailed view modes
  - Scalable interface supports hi-DPI displays
  - Requires a host program that supports audio plug-ins
  - iLok licensing is supported but not required
  - Macintosh formats: AU, VST3, AAX
  - Windows formats: VST2, VST3, AAX
  - macOS 10.13 (High Sierra) and higher
  - Apple Silicon natively supported (AU, VST3, AAX)
  - Windows 7/8/10/11
  - AAX requires Pro Tools 11 and higher
  - 64-bit hosts only
