description: "Powerful reverb plugin with two distinct algorithms (Hall and
  Plate) for creating pristine-sounding spaces, from intimate rooms to expansive
  concert halls. Features independent controls for early reflections and late
  reverberation, dual 3-band EQs, ducking compressor, envelope processor for
  gated and reverse reverb effects, and beat synchronized delay times."
details: |-
  Two late reverb algorithms (Hall and Plate). Early reflection section with halls, rooms, plates, chambers, echo, cathedral, nightclub, ping-pong. 3-band EQs for early and late frequency response. Triggered envelope control for gated and reverse reverb. Ducking compressor. Beat synchronization. Graphical displays for EQ curves, time response, and 3D frequency response. Normal and detailed view modes. Scalable interface with hi-DPI support.
specs: |-
  Mac: AU, VST3, AAX. macOS 10.13+, Apple Silicon native, 64-bit only. Windows: VST2, VST3, AAX. Windows 7/8/10/11, 64-bit only. iLok supported but not required.
