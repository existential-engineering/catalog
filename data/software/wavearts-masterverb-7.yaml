description: MasterVerb 7 is a reverb plugin designed to create pristine-sounding spaces, featuring two distinct algorithms (Hall and Plate) for recreating a wide variety of acoustic environments. It includes an early reflection section, dual 3-band EQs, triggered envelope control for gated and reverse reverb effects, and a ducking compressor for foreground clarity.
details: |-
  - MasterVerb 7 offers two late reverb algorithms — Hall and Plate — capable of recreating halls, rooms, plates, chambers, cathedrals, nightclubs, and more, with an early reflection section offering multiple preset types including echo and ping-pong.
  - Dual 3-band EQs let you shape the frequency content of early reflections and late reverb independently, while graphical displays provide real-time feedback via EQ curves, time response, and 3D frequency analysis.
  - A triggered envelope control enables gated and reverse reverb effects, and a ducking compressor automatically reduces reverb when the source signal is present, enhancing foreground clarity.
  - Beat synchronization locks delay and envelope times to the host tempo, ensuring rhythmic reverb tails stay in time with the track.
  - The scalable interface supports hi-DPI displays and offers both normal and detailed view modes; on macOS, a corner resize control allows freeform interface scaling.
specs: |-
  - Algorithms: Hall, Plate late reverb; multiple early reflection types (halls, rooms, plates, chambers, echo, cathedral, nightclub, ping-pong)
  - EQ: Dual 3-band EQs (early and late sections)
  - Envelope: Triggered envelope control (gated and reverse reverb)
  - Dynamics: Ducking compressor
  - Sync: Beat synchronization for delays and envelope times
  - Display: EQ curve, time response, and 3D frequency analysis graphical views
  - Interface: Scalable with hi-DPI support; normal and detailed view modes
  - macOS formats: AU, VST3, AAX
  - Windows formats: VST2, VST3, AAX
  - Platform requirements: macOS 10.13 (High Sierra) or higher, Apple Silicon native; Windows 7/8/10/11
  - Host requirement: 64-bit host application; Pro Tools 11+ for AAX
