description: Gospel Organ is a virtual instrument that emulates the gritty,
  expressive tone of a classic church organ using a sampled A100 organ model. It
  includes a separate physically modeled Leslie rotary effect plugin with real
  cabinet impulse responses for authentic cabinet tone.
details: |-
  Gospel Organ is a deeply authentic gospel organ virtual instrument and rotary effect bundle designed for players and producers who want the real grit, texture, and dynamic character of the church organ heard in live worship settings. Unlike typical organ emulations, Gospel Organ focuses on the raw soul, mechanical noise, and expressive imperfections that define the classic gospel tone heard in thousands of services and recordings around the world.

  When you purchase Gospel Organ, you receive both the organ instrument and a fully separate **Gospel Rotary effect plugin** — now included at no extra cost — so you can craft full cabinet rotations and sonic depth just like real hardware.

  🎹 Soulful Organ Sound

  🔊 Gospel Rotary Leslie Emulation

  🎛️ Performance & Workflow Features

  🎶 Ideal For

  Gospel Organ is perfect for players who want:

  ⭐ Summary

  Gospel Organ captures the soul and grit of the classic church organ and pairs it with a physically modeled rotary speaker that rivals hardware emulations. Featuring an advanced sampled A100 model, a powerful separate rotary effect plugin, and deep performance and tone-shaping control, it delivers the expressive character that gospel musicians and producers seek — all in a modern virtual instrument format.
specs: |-
  - Advanced Sampled A100 Organ Model Carefully sampled from an authentic vintage A100 organ with hybrid synthesis to emulate harmonic foldback, percussion, key click, noise controls, and dynamic tone behavior.
  - Dedicated Expressive Controls Full drawbar control, percussion levels, vibrato/wah, key click, and noise controls for lifelike performance response.
  - Tone Customization Each manual and section (Upper, Lower, Bass) has dedicated synthesis controls and effects, letting you dial in gritty or clean tones as needed.
  - Separate Rotary Plugin Included Comes with a physically modeled Leslie rotary effect that can be used on the organ or *other instruments*.
  - Real Cabinet Impulse Sampling Impulse responses from 12 real Leslie horn and drum positions were captured to recreate the exact cabinet tone, including true mic angles and room behavior.
  - Adjustable Mechanical Motion Control Slow/Fast speeds, Rise/Fall times, rotor noise, horn and drum motion independently.
  - Dynamic Mic Positioning Mix between mic types and positions to tailor the rotary sound uniquely for your mix or live rig.
  - Dedicated EQ per Driver Separate 11-band EQ and filters for both horn and drum speaker models.
  - Resizable Standalone App Use Gospel Organ as a standalone instrument with a scalable interface for gigging or studios.
  - VST/AU/AAX Plugin Support Works in all major DAWs on Mac and Windows, including M1 native support.
  - Easy Drawbar MIDI Learn Right-click or long-press parameters to map controls quickly to your MIDI hardware and save custom templates.
  - Chord & Note Display Organ modes include visual chord and note displays for teaching, performance visuals, and streaming.
  - Dedicated Tone-Tailoring FX Each manual and percussion section offers insert effects plus global racks, allowing deep tone shaping unique to gospel and soulful playing.
  - Authentic, gritty church organ tones with expressive dynamics
  - A standalone organ instrument with full live control
  - Comprehensive rotary cabinet emulation for true Leslie behavior
  - DAW-based organ tracks that feel and *sound* like a real church organ
  - A visual display mode ideal for lessons and live streams
