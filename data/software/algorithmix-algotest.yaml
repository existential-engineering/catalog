description: AlgoTest is an easy-to-use testing program for measuring the noise
  level of soundcards and their frequency distribution. It displays noise
  parameters including peak-to-peak and true RMS noise level, DC offset, and a
  real-time FFT analyzer showing the frequency distribution of the input signal
  from 20 Hz to 20 kHz.
details: |-
  AlgoTest is a free soundcard testing tool from Algorithmix designed for measuring
  the noise characteristics of soundcards and external analog-to-digital converters.
  It provides accurate noise level measurements that allow users to reliably test and
  compare even high-quality soundcards or external ADCs connected via digital interface.

  The tool measures and displays key noise parameters including the noise level
  peak-to-peak (p-p) and true RMS values, as well as the DC offset of the input
  signal. These measurements are precise enough to evaluate professional-grade hardware.

  An integrated DC-Filter is included to remove the influence of DC components present
  in the input signal, allowing for cleaner baseline measurements.

  The FFT analyzer window displays the frequency distribution of the input signal
  between 20 Hz and 20 kHz for both channels in real time. This enables detection of
  all types of artifacts arising from the analog-to-digital conversion process.

  AlgoTest is available as a free full-version download from the Algorithmix website.
specs: |-
  - Noise measurement: peak-to-peak (p-p) and true RMS
  - DC offset measurement with integrated DC-Filter
  - Real-time FFT analyzer: 20 Hz – 20 kHz, both channels
  - Supports soundcards and external ADCs via digital interface
  - Free full-version download
