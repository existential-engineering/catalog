details: |-
  The bohemian cello was created to free you to perform real cello performances
  fast, without the need to be a cellist yourself. To achieve realism, a large
  amount of samples for a solo instrument were recorded, with the virtual
  performer controlling all the varied legatos, bow types and emotive
  expressions as you play, all from one patch and all in real time.

  The virtual performer can be directed to alter its emotion during performing
  by switching through alternative play styles called moods. Play harsh with
  assertive, through too emotional and gentle with emotive or play a varied off
  the cuff mockup with improv, classical mood and finally short, sharp, lively
  with sprightly, all with the tap of a key. Switch into maestro, the first poly
  performer legato, play as many notes together as you wish and let the poly
  performer choose the appropriate legatos and bow types.

  Every note is sampled with hundreds of intervals, multiple dynamics and varied
  speeds, packing emotion into every performance while remaining in true musical
  phrase, from first note to the last. The legato is always captured in phrase
  and in a musical context, resulting in each legato played being a true sample
  of a real performance.

  The virtual performer enables incredibly easy live play, auto selecting the
  bow types, legatos and bow positions based on your play style. Each
  articulation and mood can be forced upon the performer using an assignable
  key, granting you the ability to adjust the performers behaviour should you
  choose to.
