details: |-
  Bass Chorus can avoid muddy bottom end problems by separating the bass and
  treble frequencies, where you set the cutoff frequency. The effect is only
  applied to the treble portion, which is then mixed back with the bass for
  output.

  It's not just a chorus - it's a true thru-zero flanger. It's not just for bass
  - it's flexible and full-featured.

  It can create a huge, wide bass sound without sacrificing punch and focus.
