details: |-
  The Eddie Kramer Phazevibe pedal by F-Pedals is unusual in that it is not the clone of anything else. It has received strong ratings from musicians around the world and is included in the list of "must-have pedals" posted on Premier Guitar by Pete Thorn, alongside the Echobandit by F-Pedals.

  The Eddie Kramer Phazevibe Plugin, Rack version, is modelled after the original F-Pedals Phazevibe. The Rack version features 3 modes of phaser effects that are selected by a slide switch, and adds 3 different waveform shape options for each phaser mode.

  Mode 1, Classic Vintage Phaser, uses the large red speed knob to range from a classic phaser through a vibrato and even a Leslie-style effect. Mode 2, Phase-Wha, is a phaser with a hint of wah that becomes an auto-wah at low speed and turns into a distinctive vibrato as the speed is increased. Mode 3, Phase-Univibe, is a phaser with a hint of univibe at low speed that becomes a Hendrix Uni-Vibe sound as the speed rises, described as warm with a smooth vibrato.

  The Rack version has been enhanced with 2 independent Phazevibe channels that can be used in mono, dual mono and stereo. Each channel has independent controls for Speed, Filter, Pan and Dry/Wet, making it a flexible phaser capable of a wide range of sounds for musicians and producers in any genre.

  Rack controls add an oscillator phase inverter toggle, an Analog Link switch for a more analog feel, and a Sync toggle that locks the phaser speed to the host DAW, with one LCD per channel showing the tempo division when synced or the speed in milliseconds when not. Link buttons tie the controls of the two channels together, a Master Link sets all four link buttons at once, and a VU meter monitors input and output signal.
specs: |-
  - 3 modes of phaser effect selected by a slide switch
  - 3 waveform shape options for each phaser mode
  - 2 independent Phazevibe channels usable in mono, dual mono and stereo
  - Independent Speed, Filter, Pan and Dry/Wet per channel
  - Mode 1: Classic Vintage Phaser, from classic phaser through vibrato to a Leslie-style effect
  - Mode 2: Phase-Wha, phaser with a hint of wah that becomes auto-wah at low speed
  - Mode 3: Phase-Univibe, phaser with a hint of univibe that becomes a Uni-Vibe sound at higher speed
  - Tone knob boosts or rolls off high frequencies of the processed signal only
  - Speed knob sets the modulation rate
  - Oscillator Phase inverter toggle switch
  - Analog Link switch for a more analog feel
  - Sync toggle synchronises phaser speed to the host DAW
  - One LCD per channel showing tempo division when synced or speed in milliseconds when not
  - Link buttons to link the controls of the 2 separate channels
  - Master Link sets all 4 link buttons on or off simultaneously
  - VU meter for monitoring input and output signal
  - Plugin formats: VST2, VST3, AAX or AudioUnits compatible host
