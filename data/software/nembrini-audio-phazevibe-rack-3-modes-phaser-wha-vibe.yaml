description: "A rack-format plugin modeled after the F-Pedals Eddie Kramer Phazevibe pedal, featuring two independent Phazevibe channels with three phaser modes: classic vintage phaser, phase-wha, and phase-univibe. The rack version supports mono, dual mono, and stereo operation with individual Speed, Filter, Pan, and Dry/Wet controls per channel."
details:
  - The Phazevibe Rack is the rack-format version of Nembrini Audio's Phazevibe plugin, based on the F-Pedals Eddie Kramer Phazevibe pedal — a design endorsed by legendary engineer Eddie Kramer and recognized by Pete Thorn at Premier Guitar as a must-have pedal. The plugin faithfully captures the unique character of this boutique phaser circuit.
  - "The plugin features three distinct phaser modes: Mode 1 is a classic vintage phaser with speed ranging from subtle phasing through vibrato to Leslie-like rotary effects; Mode 2 is Phase-Wha, combining phaser with auto-wah characteristics; and Mode 3 is Phase-Univibe, delivering the warm, swirling Hendrix-style univibe sound."
  - The rack configuration provides two fully independent Phazevibe channels, each with its own Speed, Filter, Pan, and Dry/Wet controls. Channels can operate in mono, dual mono, or stereo configurations, making it highly flexible for studio and live production workflows.
  - Additional controls include a Tone knob for shaping the processed signal frequencies, an Oscillator Phase inverter toggle, an Analog Link feature for authentic analog character, and a Sync toggle for DAW tempo synchronization with BPM display. VU-meter monitoring and a Master Link button for unified control are also included.
  - The plugin is available at version 1.0.9 and is sold through the Nembrini Audio store, compatible with all major DAW formats including VST2, VST3, AAX, and AudioUnits.
specs: |-
  - Plugin formats: VST2, VST3, AAX, AudioUnits (AU)
  - Two independent Phazevibe channels
  - Three phaser modes: Classic Vintage Phaser, Phase-Wha, Phase-Univibe
  - Channel operating modes: mono, dual mono, stereo
  - Per-channel controls: Speed, Filter, Pan, Dry/Wet
  - Global controls: Tone, Oscillator Phase inverter, Analog Link, Sync (tempo sync), Master Link
  - VU-meter signal monitoring
  - DAW tempo synchronization with BPM display
  - Current version: 1.0.9
