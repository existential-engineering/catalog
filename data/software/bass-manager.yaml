details: |-
  The Bass Manager VST plug-in is especially designed for Cubase sx and nuendo.
  It simulates the bass management systems found on most dolby digital and dts
  surround sound receivers.

  This allows surround sound engineers to hear what their 5.1 surround mix
  sounds like without having to burn a cd-r or dvd-r and then play it through a
  consumer 5.1 surround receiver.

  Please note that dvd-audio 5.1 bass management isn't really standardized.
  There are some dvd-a players that don't use bass management or use it in a new
  and very different way.
specs: |-
  - Surround sound bass management
  - 5.1 surround mix simulation
  - Dolby digital support
  - Dts support
