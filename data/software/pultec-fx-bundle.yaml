details: >-
  Apogee pultec fx bundle is a virtual effect audio plugin for macos and
  windows. It functions as a VST plugin, an audio units plugin, a VST 3 plugin
  and an AAX plugin.


  Includes: pultec eqp-1a and pultec meq-5. Eqp-1a + meq-5 pultec bundle program
  equalizer + mid-range equalizer.


  In the obsessive quest to reproduce every nuance of the pultec program
  equalizer and mid-range equalizer, apogee partnered with steve jackson of
  pulse techniques, the current manufacturer of new pultec hardware. During the
  10 years steve spent to recreate the legendary eqp-1a, he learned the
  intricate secrets of each component from eugene shenk, the original pultec
  designer.


  After careful analysis of several vintage and new pultec eqp-1a and meq-5
  units, apogee chose to model the plugin after steve's new hardware. Apogee's
  software pultecs are the only eqp-1a and meq-5 type plugins endorsed and fully
  licensed by steve and pulse techniques.


  System requirements - windows: windows 10 and higher, 4 gb minimum ram, 8 gb
  or higher recommended, free pace ilok account (physical ilok not required).
  Mac: mac os x 10.12.6 or higher, 10.14 mojave fully supported, 4 gb minimum
  ram, 8 gb or higher recommended, free pace ilok account (physical ilok not
  required).
