details: |-
  BFD Player is easy to use. Simply open it up as a virtual instrument in your
  favourite DAW, or in standalone mode and you've got fantastic real drum
  sounds, imaginative professional grooves and an easy to use mixer. You can
  have that radio ready drum sound in minutes.

  Bfd player comes with 340 grooves created by top drummers that bring the kit
  to life. All the grooves are fully searchable based on such tags as genre,
  tempo, and even leading hand, so you can find the right one to fit your song.

  The kit piece browser takes bfd player to another level, infusing tracks with
  vibrant, lifelike drum elements. This feature enables users to swap drum
  components with exciting alternatives from diverse expansion packs, igniting a
  world of sonic exploration.

  The free version comes with a spectacular 5gb library, which is not limited in
  terms of velocity layers nor channels available. When you've got the drums and
  grooves just how you like them, use the inbuilt mixer to get a pro drum sound,
  and even route the drum outputs separately to process the sounds with your
  favourite plugins.
specs: |-
  - 3d kit view with switchable drums
  - Groove browser with filtering mechanics
  - 340 drum patterns
  - Kit piece browser
  - Simplified mixing experience with 4 macros
  - 5gb library
  - Velocity layers
  - Separate drum output routing
  - Production ready presets
  - Original mix preset
