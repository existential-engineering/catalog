description: Sound personalization app that analyzes your unique hearing ability
  and sound preferences to create individualized audio profiles. Uses
  patent-based technology combining headphone calibration, listener preferences,
  and hearing specifics. Available free on iOS and Android.
details: |-
  Audio personalization app built on 2.4M+ sound comparisons from 350K+ participants. Integrates three layers: headphone calibration, listener sound preference, and listener hearing specifics.

  Features include guided A/B comparison testing, continuous profile adaptation, custom bass/treble controls, Studio Reference Mode for flat playback, and equal loudness compensation. Works across 55+ supported headphone and earbud devices.

  Also integrated into enabled consumer electronics from partner manufacturers including Corsair and 1MORE.
