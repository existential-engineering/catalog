details: |-
  GPU Audio have announced the second instalment of their free beta suite, with
  the space and time bundle. This bundle includes three standalone tools for
  creating space using classic time-based effects - all utilising GPU Audio's
  patented technology, powering the next generation of audio plugins via your
  computer's graphics card.

  The space & time bundle includes three fully featured delay and reverb plugins
  - including the original fir convolver, the powerful fireverb reverb unit, and
  a flexible delay module.

  Each plugin comes with a host of parameters and features which are detailed
  below.
specs: |-
  - Fireverb reverb time 0 to 10 seconds
  - Early & late reflection time control
  - One pole band pass filter
  - Filter reflection freq and q control
  - Fast preset recall
  - Size & width control
  - Wet/dry mix control
  - Scalable ui from 66% to 400%
  - Independent time controls per channel
  - Micro time shift feature
  - Ping pong and looping modes
  - Free & sync modes
  - Tempo sync from 1/32 to 2 bars
  - Delay time from 10ms to 2 seconds
  - Channel linking
  - 10 impulse responses
  - Additional IR packs available
  - GPU Audio patented technology
  - Graphics card acceleration
