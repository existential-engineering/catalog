description: The Bassysm-S bass is a four strings musicman stingray bass with
  roundwound strings. The is the slapped version of the bassysm line.
details: |-
  At the bottom of the interface, you can control the behavior of the
  instrument: legato mode: you can choose whether playing a legato will trigger
  hammer ons, slides, sustains, or simply have no effect. The legato distance
  will define the maximum interval that in which the legato will apply. The
  release volume: the sound produced when you release a string if a note was
  going on. Cabinet: you can turn the cabinet simulation on or off. Eq: you can
  edit the bass and treble of the parametric eq. The sensitivity will set the
  minimum volume for velocity 1 and give you access to all the dynamics that you
  want.

  Bassysm-s comes with its own sample player, the uvi workstation 3 (requires
  v3.0.0 or later). We provide it for free with every library that you buy, you
  don't need to buy an expensive sampler to use our products. It works on mac
  (10.9 or later) and pc (windows 8 or later), in standalone or as a plugin (VST
  / vst3 / AU / AAX) and in 64-bits only.

  Technical description: 1.52gb uncompressed, 703mb compressed in lossless flac
  format, around 2152 samples. 12 velocity layers for the sustain pop. 12
  velocity layers for the sustain slap. 2 round robins for pop and slaps. 10
  velocities for the release. Hammer on samples. Slide samples. String noises
  played randomly. Harmonics, ghost notes, string hits samples. Advanced uvi
  scripting giving you access to a simple yet powerful interface and advanced
  features.
