description: PSP auralControl is an essential tool for multichannel tracking, mixing and mastering. Individually adjusts level, polarity, bandwidth and timing for each channel in a multichannel set. Supports predefined industry standard multichannel formats, grouping capability, and displays all features on a single screen. Covers formats from stereo to 7.1.4.
details: |-
  Requires iLok License Manager (dongle not required). 30-day trial available. Supports multichannel formats from stereo to 7.1.4. macOS 10.12 or later (Intel) through macOS 15 Sequoia (Apple Silicon). Windows 7 through Windows 11 supported.
specs: |-
  - Level control faders with Peak Meters on each channel
  - Adjustable Delay Time, High-Pass and Low-Pass Filters
  - Mute and Solo buttons on each channel
  - All parameters controllable in Predefined or Custom Groups, or Individually per channel
  - Predefined industry standard multichannel formats from stereo to 7.1.4
  - Group processing with relative or reversed linking
  - Mid-Side stereo processing support
  - Single-screen display of all controls
