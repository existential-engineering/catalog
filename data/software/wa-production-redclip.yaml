description: RedClip is a multiband clipping plugin that separates audio into 4 user controllable bands before processing, with Fat, Punch and Bone controls shaping the character of each band. Crossovers can be switched between linear phase and analog minimum phase.
details: |-
  RedClip is a clipping plugin designed by the audio engineer Emrah Celik that goes beyond peak clipping into multiband character shaping. It is aimed at mixing, mastering and individual channel processing, using a clipping algorithm that adds character as well as loudness.

  Multiband separation is where the processing starts. Audio is split into 4 distinct bands before sculpting, and the crossovers are all user controllable. One button switches between the transparency of linear phase and the warmth of analog minimum phase, and a frequency adjustment decides exactly where the bands cross.

  The multiband Clip knobs determine how much classic clipping is applied to the signal. They work entirely in parallel under the hood, so the processing is tuned to keep working even at the highest setting. Fat knobs blend soft and hard clipping to add weight and a smooth, controlled distortion. Punch sliders combine compression and harmonic enhancement to add definition without sacrificing clarity, and Bone sliders add thickness and body by boosting the midrange before clipping.

  The interface is built on vector graphics and is resizable. A live spectrum at the top shows frequency changes as the signal travels through the plugin in real time, and AB comparison with copy and paste, along with undo and redo, allows different processing chains to be contrasted.

  A Dry / Wet knob mixes the clipped signal with the original audio for more gentle treatment, and Bypass and Solo buttons monitor each of the multiband signals in turn. A large set of categorised factory presets covers everything from subtle soft clipping through to heavy transformation.
specs: |-
  - Multiband clipping across 4 user controllable bands
  - Linear phase and analog minimum phase crossover modes, switchable with one button
  - Adjustable crossover frequencies
  - Clip knobs that work in parallel at every setting
  - Fat controls blending soft and hard clipping per band
  - Punch sliders combining compression and harmonic enhancement
  - Bone sliders boosting the midrange before clipping
  - Live frequency spectrum monitoring
  - AB comparison with copy and paste, plus undo and redo
  - Dry / Wet control for parallel processing
  - Bypass and Solo monitoring per band
  - Resizable vector interface
  - Categorised factory presets
  - PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Runs on both Intel and Apple Silicon CPUs, including native AAX
