description: Loudness is a free digital volume control plugin by Goodhertz that enables users to hit target loudness levels with confidence and ease, featuring LUFS, RMS, Peak, and True Peak metering with customizable fader glide and stereo control options.
details: |-
  Loudness is part of the Goodhertz Free Series — a perpetually free plugin designed as an upgrade to the standard DAW volume fader. It provides clean, clickless volume control with 64-bit processing throughout, eliminating clicks, pops, or distortion when adjusting levels.

  The plugin features multiple metering types including LUFS, RMS, Peak, and True Peak, each with three time window settings: Momentary, Short, and Long Term. A summary page displays numeric metering data that can be copied to the clipboard for use in documentation or reporting workflows.

  A standout feature is the target loudness automation system, which allows users to set a target level and automatically positions the fader to match. Fader glide times are fully customizable with separate settings for upward and downward movement.

  Stereo controls include Mono Sum, Solo, Mute, Polarity inversion, and a Fine Trim knob. The plugin can automatically balance the stereo field to within 0.01 dB precision.
specs: |-
  - Processing: 64-bit throughout
  - Metering types: LUFS, RMS, Peak, True Peak
  - Metering time windows: Momentary, Short Term, Long Term
  - Stereo controls: Mono Sum, Solo, Mute, Polarity, Fine Trim
  - Auto-balance stereo field to 0.01 dB precision
  - Customizable fader glide times (separate up/down settings)
  - Target loudness automation with Apply function
  - Summary page with copyable numeric metering data
  - macOS 10.13 or newer required
  - Windows 10 or newer required
  - 64-bit only
