description: "Free digital volume control plugin designed as an upgrade to
  standard DAW faders. Features click-free and pop-free 64-bit processing,
  LUFS/RMS/Peak/True Peak metering with three time windows, automatic target
  loudness fader positioning, stereo controls (mono sum, solo, mute, polarity,
  trim), automatic stereo field balancing to 0.01 dB precision, and customizable
  glide times for smoother fader rides."
details: |-
  3 pages

  64-bit click-free and pop-free processing
  LUFS, RMS, Peak, and True Peak metering
  Three time windows: Momentary, Short, Long Term
  Automatic target loudness fader positioning
  Stereo controls: mono sum, solo, mute, polarity, trim
  Apply Balance for automatic stereo field balancing to 0.01 dB
  Customizable glide times (separate up/down)
