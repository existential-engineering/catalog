description: Loudness is a free digital volume control plugin by Goodhertz that
  enables users to hit target loudness levels with confidence and ease,
  featuring LUFS, RMS, Peak, and True Peak metering with customizable fader
  glide and stereo control options.
details: |-
  Enter: Loudness. The Goodhertz plugin for making things louder — and quieter — with confidence & ease. It's our upgrade to the lowly fader, and it's part of the Goodhertz Free Series. (Translation: it is now and always will be free!)

  It sounds better. We realize that this might sound like marketing hyperbole: how can any two digital volume controls sound different?! But in a number of measurable ways, most digital volume controls are imperfect and often poorly implemented. The stock trim plugin is full of tiny digital clicks during the fade out — small discontinuities in the audio — almost like a scratchy potentiometer, but digital. Loudness, on the other hand, is completely clean. Similarly, every DAW we tested caused clicks & pops when automating Mute, Solo, Polarity, or Mono Summing switches — all of which are performed clicklessly in Loudness. With fully 64-bit processing throughout, you can trust that Loudness is the finest volume control available: no clicks, pops, or added distortion — just clean, smooth operation.

  It has really nice metering. With LUFS, RMS, Peak, & True Peak meters and three different time windows (Momentary, Short, & Long Term), you'll always know exactly what's happening in your track (and what's already happened). Fader rides are quicker & easier because you can easily see where things might need adjustment. The Summary page provides a comprehensive numeric summary of all metering types simultaneously and can easily be copied to clipboard to share with collaborators, add to a track log, send to a mastering engineer, etc.

  Advanced options help you work faster. Customizable fader glide times allow you to spend less time smoothing automation points manually — let Loudness take care of it for you! Up and down glide times can be set separately, which can be useful for manually automating transients like drum hits, etc.

  It helps you hit the target. Set a target loudness level, hit "Apply," and the fader snaps to the correct position, taking the guesswork — and the calculator — out of hitting a target reference level. Open up the advanced page and hit "Apply Balance" and Loudness automatically adjusts the fine trims to perfectly balance the stereo field to within 0.01 dB. It has extensive stereo controls & metering: Mono Sum, Solo, Mute, Polarity, Fine Trim — they're all available in the advanced pane.
specs: |-
  - LUFS, RMS, Peak & True Peak meters
  - Three metering time windows: Momentary, Short & Long Term
  - Summary page with numeric summary of all metering types, copyable to clipboard
  - Fully 64-bit processing throughout
  - Clickless Mute, Solo, Polarity and Mono Summing switching
  - Customizable fader glide times, with separate up and down glide times
  - Target loudness level with "Apply" to snap the fader to the correct position
  - "Apply Balance" to balance the stereo field to within 0.01 dB
  - Stereo controls: Mono Sum, Solo, Mute, Polarity, Fine Trim
  - 3 pages of advanced controls
  - Minimum system requirements: OS X 10.13+ and Windows 10+
  - Apple Silicon native support (v3.7.0+); Apple Silicon Pro Tools support (v3.8.0+)
