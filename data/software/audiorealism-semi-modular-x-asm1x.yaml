description: Polyphonic semi-modular virtual analog synthesizer with built-in
  pattern sequencer and a filter based on the classic music composer 202.
details: |-
  Semi Modular X (ASM1X) was created as a 303 on steroids. It grew out of a mock-up by AudioRealism collaborator AlphaDog, enhanced with additional features like patch cables and polyphony. The result is a truly unique and versatile instrument. Although ASM1X has its roots in sequenced synth sounds, it stands out for its exceptional pads and leads, making it a hidden gem for producers. One thing is for sure - nothing else can replicate the distinctive sound of ASM1X.

  The heart of ASM1X is its 202 filter, known for its self-oscillating resonance, precise tuning, and wide frequency range spanning from sub-bass to beyond the upper limit of human hearing. This filter has a powerful voice that can truly captivate. Most of the modules in ASM1X support control voltage (CV), allowing real-time signal path modifications without any audio glitches. The sequencer features CV Gate/Note output and is compatible with playing ASM1X in Note mode, monophonically, or polyphonically.

  macOS Intel, Apple Silicon. Requires macOS 10.13 or higher. Audio Unit, VST2, VST3. Windows 64-bit. Requires Windows 7 or higher. VST2, VST3.
specs: |-
  - High quality aliasing-free oscillators and filters
  - Ultra fast envelopes
  - Audio rate modulation
  - 500+ preset patches and sequences
  - 32-voice polyphonic
  - Internal step sequencer
  - Full MIDI CC control with learning function
  - Two MIDI modes (Pattern or Note)
  - Midi pattern sync to VST and AU hosts
  - Multiple Filter modes (202, Ladder, Diode 303, Highpass)
  - Native Apple Silicon Support
  - macOS: Intel and Apple Silicon, requires macOS 10.13 or higher
  - Windows: 64-bit, requires Windows 7 or higher
