description: Vintage style limiter & master EQ. The bt limiter lm2s is an
  easy-to-use tube emulation limiter.
details: |-
  The straightforward controls and outstanding sound make this limiter the
  perfect tool for mastering.

  In addition to the basic limiting controls (peak reduction, attack, release,
  and output gain), the lm2s also includes a 5-band eq.

  This allows you to address those final sonic details in a mastering session
  while increasing the apparent loudness of your mixes.

  Blue tubes limiter lm2s by nomad factory is a virtual effect audio plugin for
  macos and windows. It functions as a VST plugin, an audio units plugin and an
  AAX plugin.
