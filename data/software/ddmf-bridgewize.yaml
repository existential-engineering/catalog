url: https://ddmf.eu/bridgewize/
description: "A universal cross-platform bit bridging tool that wraps 32-bit
  plugins for use in 64-bit DAWs, allowing seamless bridged versions of legacy
  plugins."
details: |-
  Plugin organizer for 32-bit plugin discovery
  Zero-latency audio transfer between 64-bit DAW and 32-bit bridging app
  Seamless plugin UI integration in host window
  Minimal CPU overhead
  Wrapping and unwrapping capabilities
specs: |-
  - Plugin organizer to display all 32-bit candidates for easy and intuitive wrapping and unwrapping
  - Zero-latency audio transfer between the 64-bit DAW and the dedicated 32-bit bridging app
  - Plugin UI appearing seamlessly in the host's window
  - Negligible additional CPU usage
  - Compatible with VST 2.4 plugins
  - Mac: OSX 10.7 – OSX 10.14 (NOT compatible with macOS 10.15 Catalina and higher)
  - Windows: Vista and higher (untested on Windows XP)
