details: |-
  SirenFX Black Noise Generator is an lfe effect that creates a deep and
  unsettling noise texture that can be used to add atmosphere to any media
  project. As a generator, it outputs the characteristic 'doom' tone often used
  in movies and games to create a sense of menacing foreboding or to allude to
  vast spaces.

  The generated noise can also be modulated with a sidechain input to add power
  and weight to any existing sound lacking low-end, such as gunshots, foley, or
  even the human voice.

  The noise signal is overdriven and filtered in a two-stage process to create a
  texture that is both aggressive and smooth. It is also high-pass filtered to
  create a very focused sound.

  This plugin has been tested and found to work with the following daws: reaper,
  logic, ableton live (vst3 only), cubase, nuendo, waveform, fl studio, and
  davinci resolve.

  Sidechain module is not currently compatible with presonus studio one and fl
  studio.
specs: |-
  - Lfe effect
  - Noise generator
  - Sidechain input
  - Two-stage filtering process
  - High-pass filter
  - Universal 2 binary
