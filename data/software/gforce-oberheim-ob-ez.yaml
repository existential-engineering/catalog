description: Virtual instrument offering the majestic sound of the GForce
  Oberheim OB-E with essential controls in a streamlined interface. Features an
  authentic 8-voice Oberheim emulation with 260+ presets optimized for quick
  workflow, four panning modes, stereo delay and reverb, and multiple play
  modes.
details: |-
  OB-EZ is not a lite version of the multi-award-winning OB-E in terms of sound; it is OB-E under the hood. GForce selected over 260 of the presets designed for OB-E that fit the OB-EZ control set, ensuring optimal tweaking potential. Thanks to their unique octaphonic architecture, not many synths sound as fat as these in the software domain.

  While connoisseurs will see similarities with the 1980 Oberheim OB-SX, a streamlined stage version of the Oberheim OB-X, the intention behind OB-EZ is to make those 8-Voice tones quickly available for producers who need to work fast. OB-EZ lets you tweak all the essentials, such as cutoff, resonance, envelopes, tuning, portamento, delay and reverb, and it lets you save any modification you make.

  OB-EZ is the continuation of the collaboration that began when Tom Oberheim and Marcus Ryle contacted GForce as OB-E neared release and offered support to refine it and release an update carrying their full endorsement. OB-E went on to receive several Best Soft Synth awards, and was followed by the Oberheim SEM and OB-X.

  With a fully resizable UI, CC MIDI mapping, a Vintage knob for adding variation, panning modes for wide soundscapes, vibrato and a preset browser, OB-EZ covers the essentials. If you later decide you need all the power of OB-E, individual SEM voice controls, levels and pans, split patches, advanced modes, advanced FX controls, 700+ presets, sequencer and drum mode, OB-E will import your OB-EZ presets. The presets range from polyphonic keys and octaphonic pads to unison basses.
specs: |-
  - Voices: 8-voice polyphony
  - Modes: Monophonic, polyphonic, legato, unison
  - Presets: 260+
  - Effects: Delay, reverb
  - Panning modes: 4
  - Vintage knob for analog imperfections
  - Fully-scalable UI
  - CC MIDI mapping
  - OB-EZ presets importable into OB-E
  - Mac: Standalone, AudioUnit, VST2, VST3, AAX; macOS 10.13+; Intel & Apple Silicon native
  - Windows: Standalone, VST2, VST3, AAX; Windows 7+; 2GHz CPU, 2GB RAM
