description: Virtual instrument offering the majestic sound of the GForce Oberheim OB-E with essential controls in a streamlined interface. Features an authentic 8-voice Oberheim emulation with 260+ presets optimized for quick workflow, four panning modes, stereo delay and reverb, and multiple play modes.
details: |-
  OB-EZ brings the authentic "FAT Oberheim" 8-voice sound design from the award-winning OB-E into a focused, simplified interface. Designed for producers seeking thick, organic, and majestic sounds with an expedited workflow, it features over 260 presets, a vintage knob for analog imperfections, four panning modes, monophonic, polyphonic, legato, and unison modes, CC MIDI mapping, and built-in delay and reverb effects. The fully-scalable UI makes it adaptable to any screen size. Presets created in OB-EZ can also be imported into the full OB-E. Purchasing OB-E includes a complimentary OB-EZ license.
specs: |-
  - Voices: 8-voice polyphony
  - Modes: Monophonic, polyphonic, legato, unison
  - Presets: 260+
  - Effects: Delay, reverb
  - Panning modes: 4
  - Vintage knob for analog imperfections
  - Fully-scalable UI
  - CC MIDI mapping
  - OB-EZ presets importable into OB-E
  - Mac: Standalone, AudioUnit, VST2, VST3, AAX; macOS 10.13+; Intel & Apple Silicon native
  - Windows: Standalone, VST2, VST3, AAX; Windows 7+; 2GHz CPU, 2GB RAM
