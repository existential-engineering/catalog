details: |-
  Mobile DJ app for iPhone

  Start mixing music on your iPhone with our DJ app, WeDJ. Get comfortable with DJ mixing techniques thanks to its colorful, animated 2-channel interface, featuring waveforms, jog wheels, play/cue buttons, tempo sliders, and a crossfader. When you’re ready to take your performance to the next level, connect the DDJ-200 smart DJ controller for tactile control of the app’s features.  Mix music from your iTunes library or stream popular tracks and discover unknown gems through Beatport LINK and SoundCloud Go+. If you’re just starting to mix, WeDJ for iPhone now features Tutorial and Pop-Hint functions to teach you the basics. Whether it’s your first time blending sounds or you’ve been doing it for a while, you’ll love Transition FX which enables you to perform seamless transitions.
