description: DARK HORIZON is an earth-shattering bass-heavy synth built using synthesizers and a variety of sounds bent and warped into fascinating soundscapes and powerful low ends.
specs: |-
  - Requires KONTAKT 6.6.1 or higher (works with free KONTAKT PLAYER)
  - macOS 10.13 or higher, Intel Core i5 minimum
  - Windows 7 or higher, Intel Core i5 minimum
  - 4 GB RAM minimum (6 GB recommended)
  - 2.3 GB free disk space
  - 80 instantly playable bass-heavy instruments
  - 180 complex animated, customizable themes across 5 categories
  - Modified Ensemble Engine with up to 4 simultaneous instrument layers
  - Motion Engine for dynamic FX customization
  - Pan Engine for spatial movement control
  - MIDI drag-and-drop export
  - Over 1.2 GB of sample content (765 individual samples)
  - Onboard compressor, delay, and hall reverb
