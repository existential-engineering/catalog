description: DARK HORIZON is an earth-shattering bass-heavy synth built using synthesizers and a variety of sounds bent and warped into fascinating soundscapes and powerful low ends.
details: |-
  DARK HORIZON is a bass-heavy KONTAKT instrument in the ELYSION series, built by resynthesizing orchestral sounds and sound FX through rare analog synths and effect boxes. The result is a palette of growling instruments, screaming oscillations and ground-shaking subs, aimed at ambient, modern electronic and experimental music as well as at tension-building underscore for scoring and blockbusters.

  The library carries 80 instantly playable bass-heavy instruments built from 765 individual samples, and 180 complex animated, fully customisable themes across five categories: Poly Animations, Rhythmic Pulses, Mono Arpeggios, Lowest Textures and Playable Sounds. In each of them the mod wheel is the main expressive control, morphing rhythms, raising filters and releasing tension.

  DARK HORIZON uses a modified version of the ELYSION ensemble engine, so up to four instrument modules play at once, each with independent arpeggiator controls. Four sound layers run into an onboard compressor, delay and hall reverb, with every layer linked to its own arpeggiator and two pan engines. A separate Motion Engine allows fundamental customisation of the instruments, steering attack or decay via MIDI CC, and includes two pan steppers.

  The interface follows ELYSION and THE ORCHESTRA, with a main page, mix page, preset browser and dedicated pages for the ensemble, motion and pan engines. Performances can be dragged and dropped into a DAW as MIDI. The sounds were designed by Tobias Menguser, who programmed synths for Waldorf, Ensoniq and Clavia and spent over ten years at Native Instruments.
specs: |-
  - Works with the FREE KONTAKT PLAYER
  - Requires KONTAKT version 6.6.1 or higher
  - macOS 10.13 or higher, Intel Core i5
  - Windows 7 or higher, Intel Core i5
  - 4 GB RAM (6 GB recommended for large KONTAKT instruments)
  - At least 2.3 GB of free hard disc space
  - Over 1.2 GB of sample content
  - 80 instantly playable, bass-heavy instruments
  - 765 individual samples, recorded, sampled and handcrafted
  - 180 complex animated and fully customizable themes, featuring up to 4 fully controllable instruments
  - Five theme categories: Poly Animations, Rhythmic Pulses, Mono Arpeggios, Lowest Textures, Playable Sounds
  - Modified ELYSION Ensemble Engine, plus Motion Engine and Pan Engine
  - Four sound layers with onboard compressor, delay and hall reverb; each layer has an independent arpeggiator and two pan engines
  - MIDI export via drag and drop into the DAW
  - Designed by sound designer Tobias Menguser
  - NKS ready
