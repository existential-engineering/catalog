description: Add is a multi purpose phrase-sampler that combines a powerful
  sampler (sound engine) with a realtime phrase sequencer (rps).
details: |-
  It is 8-part multi-timbral, each part containing its own rps and sound engine. The sound engine works like a pcm tone generator and is composed of 4 keygroups, each with a separate synth engine. This allows you to easily combine and layer sounds in order to rapidly create new and sophisticated timbres.

  An integrated keygroup editor makes it a simple task to load and map your samples. The rps has been designed to "enhance and inspire musical composition". Amongst other functions, it can be used to harmonize or re-arrange music directly using your MIDI keyboard.

  An editor maps sequences within MIDI notes ranges, ready to be triggered via MIDI in several different modes. MIDI effects such as quantize-swing, arpeggiator and humanization have been deeply studied in order to match MIDI sequences in any type of musical styles.

  Add comes with its own unique sound library, which provides sequences and sound-patches. These will be constantly updated.
specs: |-
  - 8-part multi-timbral phrase sampler
  - 4 sound layers per part with independent synth-engine
  - 32-bit sampler engine
  - 338 soundsets, 53 drumkits, 770 MIDI clips
  - Loads 16/24/32-bit @ 44.1/48/88/96khz mono/stereo wav files
  - Play-mode: mono, legato, poly
  - Polyphonic and monophonic glide
  - 2 or 8 stereo output
  - Keygroup can contain up to 128 velocity splits
  - Flexible keygroup-editor
  - Filter LP/HP/2xbp/notch/hs/ls/EQ
  - 2 exp.-envelopes with adjustable slope
  - 2 step LFOs synchronized to host bpm
  - Velocity and notes messages hardwired to parameters via scale editor
  - Built-in filter-delay effect with bpm-host synch option
  - 4 assignable macros knobs
  - 128 clips (patterns) for each of 8 patches
  - Clip assignment to certain range
  - Clip playback via MIDI in legato/split/polyphonic mode
  - Full-featured pianoroll editor
  - Undo/redo copy/paste function
  - Import standard MIDI files
  - Arpeggiator
  - Integrated MIDI humanizer effect
  - Advance swing-quantizer functions
