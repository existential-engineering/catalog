description: A very simple but powerful noise gate plugin especially tuned for guitar and bass. Includes a tube preamp virtual circuit which gives color to the signal in a very special way.
details:
  - Analog Rack Noise Gate is a straightforward yet powerful noise gate plugin designed specifically for guitar and bass applications, offering effective noise reduction without coloring complexity.
  - The plugin features a tube preamp virtual circuit that imparts a distinctive, musical coloration to the signal, giving it character beyond a transparent gate.
  - System requirements include macOS 10.13 or newer, Windows 7 or newer, an Intel-compatible or Apple Silicon CPU, 1 GB RAM, and a 64-bit DAW host.
  - The plugin supports VST2, VST3, AAX, and Audio Units formats and is available as a free download. An iOS version is also available on the Apple App Store.
  - Analog Rack Noise Gate is part of the Analog Rack FX Bundle, a collection of rack-style effect plugins from Nembrini Audio.
