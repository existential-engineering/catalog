details: |-
  Does your bass sound dull and lifeless? Red rock sound bass enhancer will be
  your choice to correct this deficiency. Bass enhancer uses psycho-acoustics to
  calculate precise harmonics. When these harmonics are combined with the
  original ones, it creates the effect of lower, deeper frequencies.

  Bass enhancer is used to accurately target and accentuate low frequency
  material: from vocals to bass guitar and drums adding both heft and precision.

  Features include: on switch allows the user to bypass the bass enhancer for
  before/after comparisons; input control knob for the level of the input
  signal; in meter lets you monitor the output level before bass enhancer
  processing; phase button to invert the phase of the input signal; hp filter
  removes low frequencies from the generated harmonics signal.

  Drive this knob controls the amount of generated harmonics; timbre sets the
  balance between odd and even harmonics; freq this knob simply controls where
  the process begins in frequency domain (for example, with a setting of 85 hz,
  all frequencies below 85 hz will have harmonics generated by the system);
  listen mute the mix signal and listen to the bass signal created by bass
  enhancer; mix sets the amount of bass enhancer enhancement added to the
  original signal; hl meter the level meter for the harmonics that are created;
  out meter lets you monitor the output level after bass enhancer processing;
  output control knob for the level of the output signal; undo/redo; a/b mode;
  2x/4x/8x upsampling with high quality (hq) option.
specs: |-
  - Psycho-acoustics harmonic calculation
  - Phase inversion
  - HP filter for low frequency removal
  - Drive control for harmonic generation
  - Timbre control for odd and even harmonics balance
  - Frequency control
  - Listen mode
  - Mix control
  - Bypass switch
  - Input level control
  - Output level control
  - Input meter
  - Harmonics level meter
  - Output meter
  - Undo/redo
  - A/b mode
  - 2x/4x/8x upsampling with high quality option
  - macOS and Windows compatibility
