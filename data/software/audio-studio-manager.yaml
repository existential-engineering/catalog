details: |-
  Audio Studio Manager was created to answer, in a simple way, questions like:
  how much will it cost your next recording project? How much time you spent on
  your current project? Did you do the backup of the last recording session?
  Where is the user guide of your mixer? How many tube equipment do you have?
  What equipment are in need of assistance?

  Equipment organizer categorize equipment. Create your wish list. Control the
  warranty, prices, dates, units, locations. Tags and notes. Equipment
  condition. Attachments.

  Project management clients and projects (activity status). Estimates. Costs
  and payments by project. Manages the project phases. Independent control of
  services. Control the services charged hourly or flat rate. Independent
  control of each session (notes, tag, engineer, assistant ...). Time tracker by
  phase.

  Dashboard to-dos. Studio notes. Last sessions link. Notifications: sessions
  without backup; equipment in need of assistance.

  Reports advanced searches. Save and recall your searches. Printable: equipment
  list; project accounting, sessions, estimates. Print, save as PDF or send PDF
  by email.
specs: |-
  - Studio management
  - Equipment organizer
  - Project management
  - Time tracker
  - Dashboard
  - Reports
  - Advanced searches
  - Printable reports
  - Session notes
  - Equipment inventory
  - Warranty control
  - Cost tracking
  - Project phases management
  - Service management
  - Hourly and flat rate billing
  - Backup notifications
  - Equipment maintenance alerts
  - PDF export
  - Email PDF distribution
  - macOS compatible
