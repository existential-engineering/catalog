description: A free emulation of the classic V72 tube preamp, originally manufactured in the 1950s by Maihak, TAB, Siemens, and TFK. The V72 became the blueprint for the later V76 and the REDD.47 preamps used on numerous Beatles sessions. Captures the input/output transformers, dual EF804 pentode circuit with its peculiar feedback structure, and the heavy output choke that produces a subtle touch of air. Includes a Drive control for saturation, V76-style low and high-cut filters, gain compensation, and instance grouping.
details: |-
  Free emulation of the Siemens/TAB/Maihak/TFK V72 (1950s German broadcast tube preamp). The V72 is the architectural ancestor of the EMI REDD.47 preamp used on many Beatles recordings. Circuit modeling: input/output transformers, dual EF804 pentode circuit with feedback structure, heavy output choke (produces subtle air/lift). Controls added beyond original: Drive (saturation amount), V76-style low-cut and high-cut filters, gain compensation, instance grouping (link multiple instances). Released November 2023. No activation required.
specs: |-
  - Controls: Drive, High-cut filter, Low-cut filter, Gain compensation, Link groups
  - macOS 10.9+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+ (32-bit and 64-bit), 2 GB RAM, 1280x1024 display
  - Formats: VST2, VST3, AU, AAX
