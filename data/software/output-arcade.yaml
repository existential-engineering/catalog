details: |-
  Output Arcade is the hitmaker's go-to plugin for inspiration. Produce with unlimited pro samples and instruments that you can play, shape, and tweak.

  From vocal hooks and string beds to rhythmic particles and more, Arcade is the producer's secret weapon for adding that special ear candy to help you elevate your track and get it to the finish line.

  Drop in your own sample and Arcade will make it into a playable kit by automatically chopping, slicing, and adding FX. Transform your sounds into something entirely unexpected.

  Arcade offers unlimited access to superior samples and instruments with new samples added daily, all royalty-free. It is supported by all major DAWs on Mac and PC.
specs: |-
  - Apple Silicon M-series natively supported
  - Intel i5 or AMD equivalent minimum, i7 recommended
  - 8GB RAM required, 16GB recommended
  - 64-bit only
  - Unlimited royalty-free samples with new content added daily
