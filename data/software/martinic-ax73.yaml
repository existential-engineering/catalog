details: |-
  A powerful 80s analog synth, reborn as a AAX/AU/CLAP/VST2/VST3 plugin, with
  modern enhancements. With four analog oscillators across two synth layers,
  unique modulation features, extended performance options, and an eight-module
  effects section, the Martinic AX73 unleashes the full power of the original
  synth and more no menu diving required, and all perfectly modeled through our
  advanced circuitry emulation (ace) technology. Plus, it includes a generous
  lineup of 600 inspiring presets to get you started right away.

  An interface for the 21st century: settings view offers a clean, easy-to-use
  set of parameters for quick editing. The keys view, which emulates the look of
  the original hardware, has also been upgraded with many more functions no
  menu-diving required. The robust preset manager allows you to quickly save and
  sort your favorite presets into "collections" that you can easily export and
  share with friends.

  Process the synth's output with eight built-in effects units: compressor,
  phaser, flanger, chorus, delay, reverb, distortion, and eq. These effects can
  be routed in any order you like simply rearrange them by dragging and dropping
  them in the fx chain.

  The ax73 plugin also offers far greater modulation capabilities than the
  original. It features four envelopes per layer (three of which are
  assignable), and four assignable lfos per layer. Taking both layers into
  account, this gives a formidable eight envelopes and eight lfos.

  Uniquely, the ax73 has two layers that can be split across the keyboard -
  allowing you to play two patches simultaneously - or stacked, providing an
  extra dimension of sound design. And, each layer has its own independent
  arpeggiator with 11 built-in modes - including some unusual modes such as
  shuffle and improv - that you can use to quickly create melodies.
specs: |-
  - Four analog oscillators across two synth layers

  - Advanced circuitry emulation (ace) technology

  - Eight built-in effects units: compressor, phaser, flanger, chorus, delay,
  reverb, distortion, and eq

  - Draggable fx chain routing

  - Four envelopes per layer (three assignable)

  - Four assignable lfos per layer

  - Eight envelopes total

  - Eight lfos total

  - Two layers with split or stack capability

  - Independent arpeggiator per layer with 11 built-in modes

  - Extended vco octave range down to 32'

  - Second vco and sub-oscillator

  - 600 presets included

  - Settings view for parameter editing

  - Keys view emulating original hardware

  - Preset manager with collection organization and export







  - Windows 11 arm64ec / snapdragon version available
