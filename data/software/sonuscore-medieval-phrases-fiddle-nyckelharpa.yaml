description: A Fiddle & Nyckelharpa phrase library focusing on the medieval mood, for KONTAKT & HALion SE, featuring inspired live-recorded phrases and techniques. Empower compositions with dramatic live performances by outstanding performers, or freely play the instruments with varied articulations.
details: |-
  Medieval Phrases Fiddle & Nyckelharpa is the entry in Sonuscore's Medieval Phrases series built around two bowed folk instruments: the fiddle, with its rich and expressive tone, and the nyckelharpa, whose keyed-fiddle design and resonant sympathetic strings give it an otherworldly depth. The page frames the pairing as the sound of late medieval markets, festivals and tavern halls, the instruments that set feet tapping above the chatter of merchants, now captured for composers and producers who want either dramatic live performances or the freedom to play the instruments themselves.

  Two performers recorded the material. Izsák Farkas graduated as a violinist in 2010 and has since pushed the electric violin in the band Infusion Trio, performing theatrical fiddler roles and playing in fusion, crossover, jazz and rock bands alongside teaching; his YouTube channel is called 'Follow the Violin'. Thomas Roth, a founding member of the German folk rock band the Geyers, is considered by many the best nyckelharpa player in the world, having developed his own style on the instrument over a thirty-year career.

  The library holds over 600 phrases across 8 fiddle and 7 nyckelharpa themes. The playing styles lean on energy and rhythmic emphasis rather than simple lyrical lines, and the phrases sync to the DAW's tempo and are fully playable as rhythmic material. Both instruments can also be played freely and separately, to link phrases together or to write original parts, with sustains at 3 velocity layers, staccatos and pizzicatos at 4 round robins, and a range of trills and turns.

  The instrument keeps the series' phrase builder, with a main page for choosing phrases, dedicated fiddle and nyckelharpa instrument pages, and an FX page carrying a 4-band equalizer, delay and reverb for modelling anything from an open hillside festival to a crowded tavern hall. It runs in the full version of Native Instruments KONTAKT or in Steinberg's free HALion Sonic.
specs: |-
  - 8 Fiddle and 7 Nyckelharpa themes
  - Over 600 total phrases
  - Syncs to the DAW's tempo
  - Fully playable rhythmic phrases
  - Fiddle and Nyckelharpa also playable freely as single instruments
  - Solo articulations: sustains with 3 velocity layers, staccatos and pizzicatos with 4 round robins, plus trills and turns
  - Phrase builder with main page, Fiddle and Nyckelharpa instrument pages and FX page
  - FX page with reverb, delay and a 4-band equalizer
  - Fiddle performed by Izsák Farkas, Nyckelharpa performed by Thomas Roth
  - Requires the FULL version of Native Instruments' KONTAKT 6.7.1 or higher, or Steinberg's free HALion Sonic
  - The free Kontakt Player is not sufficient: it only runs the instrument in DEMO mode
  - HALion Sonic is currently not compatible with Notion by PreSonus
  - macOS 10.14 or higher, Intel Core i5
  - Windows 7 or higher, Intel Core i5
  - 4 GB RAM
  - At least 2 GB of free hard disc space
