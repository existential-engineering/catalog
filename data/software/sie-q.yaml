details: |-
  Sie-Q is modeled after the Siemens W295b, a German broadcast EQ from the 1960s. This hardware-modeled equalizer brings smooth curves and an airy high-frequency response that's hard to misuse.

  The three-band EQ features High, Mid (switchable), and Low controls that deliver detailed high end, adding space and air to tracks. The intelligent design makes it nearly impossible to get a bad sound.

  A Drive control adds analog saturation character, bringing the warmth and coloration of the original hardware. This makes Sie-Q versatile across vocals, guitars, drums, and full mixes.
specs: |-
  - Modeled after Siemens W295b German broadcast EQ from the 1960s
  - Three-band EQ with High, Mid (switchable), and Low controls
  - Drive control for analog saturation character
  - 64-bit only, sample rates 44.1 kHz to 192 kHz
  - Apple Silicon compatible
