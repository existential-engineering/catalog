description: HoRNet Sybilla Pro is a multi filter de-esser plugin that allows complete and precise control on the de-essing process.
details: |-
  Sybilla Pro is a de-esser that offers eight independent, tunable filters for surgical control over sibilant frequencies, rather than relying on a single narrow band or simple high-frequency detection.

  Unlike most de-essers that rely on static frequency bands, Sybilla Pro analyzes the signal across multiple bands. Each of the eight filters can be individually tuned in terms of center frequency and gain, with a fixed bandwidth of 1kHz, and each can be enabled or disabled independently, giving complete control over the sidechain input that drives the compression stage.

  Sybilla Pro functions as a wideband de-esser, compressing the entire signal when sibilance is detected rather than applying frequency-selective gain reduction. The sum of the active filters is used to detect sibilant energy, and when the combined energy crosses the threshold, compression is triggered, which lets the plugin track dynamic changes in sibilance across the frequency spectrum.

  A relative threshold system compares the filtered signal to the unfiltered, full-range signal and uses the difference as the key input for the compressor, so de-essing remains consistent even during soft vocal phrases. A key listen feature monitors the output of each filter individually or the sum of the entire filter bank, and two compression modes are available: VCA with a hard knee and fast, punchy response, and OPTO with a soft knee and smoother transitions. Attack and release times can be adjusted manually in both modes.
specs: |-
  - Intelligent relative threshold
  - Eight filters for sibilance detection
  - Adjustable frequency and level for each filter
  - Switch to turn each filter on and off
  - Key listen for the entire filter bank and each of the filters
  - Meters for each filter
  - Instantaneous gain reduction meter with peak hold
  - Two different compression modes (VCA and OPTO)
  - Attack and release setting for the compressor stage
  - Dry/wet knob
  - macOS (10.11 and later) and Windows (7 and later) support
  - Apple Silicon native support (except for AAX)
  - 64-bit only both on Mac and Windows
  - Audio Units, VST2.4, VST3 and AAX format
  - No copy protection
