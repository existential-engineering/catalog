description: Heat 2 is a twin distortion and saturation plugin that blends any two of ten modelled distortion types, each with its own drive setting and high and low pass filtering. It is a refreshed version of the original Heat, with a new interface and more accurate frequency monitoring.
details: |-
  Heat 2 revises the original twin distortion plugin with a new interface, more accurate frequency monitoring and a set of internal improvements. The audio processing is laid out from top to bottom, so the signal flow is easy to follow.

  Two of the available distortion and saturation models can be chosen and blended together. Each of the two effected signals can be shaped with high and low pass filters, which produces a more musical output than distortion applied across the full range.

  The starting point is a set of ten modelled distortion types, all with adjustable drive levels. Each produces a different character and timbre, covering everything from subtle harmonics through to heavy distortion, and a central dial blends between the two selected models.

  The two filter controls adjust the high and low cut-off points separately for each distortion module, so processing can be aimed at a particular range. That allows only the midrange of a synth part to be crushed for extra crunch, or only the lowest frequencies of a kick drum to be distorted.

  Input and Output sliders compensate for gain boost or reduction caused by the distortion stages, with a range of plus or minus 48 dB, which supports accurate comparison. A Mix ratio control at the bottom centre sets how much of the distorted signal is heard, from conservative saturation to the fully processed signal. Live frequency meters show the right-hand module output as an orange waveform and the left-hand module output in yellow, and factory presets cover delicate distortion through to heavily saturated settings.
specs: |-
  - Twin distortion and saturation with independent filtering per module
  - 10 modelled distortion types with adjustable drive
  - Central dial blends between the two selected models
  - Separate high and low pass filters for each distortion module
  - Input and Output sliders with a range of plus or minus 48 dB
  - Mix ratio control for parallel processing
  - Live frequency meters, orange for the right module and yellow for the left
  - Click and pop free bypass
  - Resizable interface with top-to-bottom signal flow
  - Factory presets included
  - PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
