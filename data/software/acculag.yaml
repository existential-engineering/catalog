details: |-
  accuLAG is master MIDI beat clock generator and micro-timing controller that
  equips highest preciseness, and unique "lag slider" let's you dig your own
  groove, designed accurately by juno Ju-X.

  Rebuilt all: same look, rebuilt inside. Brushed up here and there, plus, comes
  with new MIDI control change assignment feature let's you control lag sliders
  by MIDI controllers manually, and also automatically by MIDI sequencers such
  as sequera.

  Sends MIDI beat clock and lags each 1/16th position backward or even forward.
  Lag position memory brings a new style of music performance. Also you can
  control lag sliders via MIDI cc.

  Typical setup: use acculag with a sequencer that receives and syncs to MIDI
  beat clock. Launch acculag. Select a MIDI-out port from the popup below the
  tempo slider. Launch your favorite sequencer and set same MIDI port to receive
  the clock. Start acculag then once you see them in sync, move lag sliders to
  make it lagged. The positions can be memorized in 3 buttons. And you can
  quickly load and switch them even while playing.

  Acculag is ideal: for professionals who aim to manipulate "timing" accurately.
  Also ideal for live performances. Acculag is well designed for real time
  control as well as accuracy.
specs: |-
  - Master MIDI beat clock generator
  - Micro-timing controller
  - Lag slider
  - MIDI control change assignment
  - 1/16th position lag control
  - Lag position memory
  - MIDI cc control
  - Real-time control
  - macOS
