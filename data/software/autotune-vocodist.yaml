details: |-
  Auto-tune vocodist delivers the same legendary sounds of vintage vocoders in a
  new plug-in. Auto-tune vocodist is also the only vocoder modeling plug-in that
  has the full force and flexibility of auto-tune built into the software. Now,
  you can create the vocoder effect and tune your vocals without ever leaving
  vocodist, giving you more control over the unmistakable effect than ever
  possible.

  Auto-tune vocodist also offers an expansive collection of the most essential
  vocoder models, a robust set of vocal effects, easy to use controls, and
  custom artist presets. Artists who contributed presets include p-thugg
  (chromeo) and producer buddy ross (frank ocean).

  Built-in auto-tune technology enables you to blend your vocoded sound with the
  perfect amount of pitch correction to create the classic auto-tune effect, or
  apply it subtly with the humanize parameter. Classic analogue tube saturation,
  lush chorus, and mutative ring modulation are built in, helping you achieve
  any combination of subtle enhancements and extreme vocal mutations.

  Multiple pitch tracking options let you control the pitch of your vocoded
  sound with your voice or with your favorite MIDI keyboard. The built-in
  8-voice, dual oscillator helps you start vocoding immediately, or use any
  external audio source via sidechain input and explore.

  Auto-tune vocodist is compatible with the auto-key plug-in and the auto-key
  mobile app, saving you valuable time in the studio by detecting the key and
  scale of your music, and sending it to vocodist with a single click.
