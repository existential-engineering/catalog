details: |-
  In the 1800s, a Swede named Alfred Nobel invented dynamite. In the 1980s, an American named Paul Buff created Dyna-mite. Could the two have ever imagined that, someday, worlds would collide and produce the most perfectly unruly processor plug-in known to man?

  Valley People Dyna-mite is a powder keg of character. And what did Softube do when it arrived in the Swedish lab? Throw more fuel on the fire, of course. Not only is it more versatile and easier to use than ever, but now it's bigger. Softube added two highly-concentrated plug-ins, based on the Dyna-mite sound and cloaked in Scandinavian style. Hit the deck, it's Dyna-mite Original, Slam, and Gate!

  The singular sound of Frank Zappa is due, in part, to the brilliance of Paul Buff, the founder of the company that would eventually become Valley People. Buff built custom gear for Zappa, including the console used to record Zappa's early music. By the time Buff patented his TA-101 VCA, known as The Electronic Gain Control Device (and the eventual heart and soul of the Dyna-mite), in 1980, his profile had blown up.

  Dyna-mite is an invaluable mega-processor for any recording or mixing application. Powerful when used for limiting and gating, it is a fireball compressor, expander, and de-esser too. It brings together several highly sought-after hardware products of its era. Hardware that would be hard to get your hands on today.

  Lucky for you, Softube's precisely-detailed and hyper-accurate model brings the sound of Dyna-mite exploding into the DAW-based modern studio. Officially licensed and approved by Valley People, Softube's Dyna-mite plug-in trio carries with it the legacy of Zappa and Buff in every banger it helps produce.
specs: |-
  - Officially-licensed and developed in close collaboration with Valley People
  - Three plug-ins in one: the Dyna-mite Original, plus the target-locked Slam and Gate
  - Limiting: Peak and average limiting, including negative ratio (-20:1) limiting and detector HF filtering (for de-essing purposes)
  - Expanding: Hard or soft with extreme gate settings and detector HF filtering
  - Ducking or keying: with external side chain
  - Release: from 0.05 to 5 sec/20 dB with Anticipatory Release Computation (ARC) to reduce pumping
  - Distortion: analog-modeled output distortion for fierce attitude and vibe
  - Control: detailed dynamic oversight, quick and easy
  - Console 1 Ready: can be used within the Console 1 mixing system
  - Supports Softube Extended Features panels
  - Dyna-mite Mk II: the full, precisely-modeled original emulation, known for colour and character rather than transparency
  - Dyna-mite Slam: the compressor/limiter section of the original, with a parallel compression knob, as close as possible to a one-knob compressor
  - Dyna-mite Gate: a two-in-one expander and gate with an auto-release circuit
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26
  - System requirements: Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a DAW host compatible with AU, VST, VST3 and/or AAX
  - Requires internet access for downloading installers and managing licenses
  - Three activations
