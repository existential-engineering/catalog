  Create an account and try out the full version of the plug-in free for 15 days. Simply purchase a license key to remove the 15 day limit. Easy to Use

  Simple controls with intuitive functions. Get your funk on and let's groove tonight! Haze come pre loaded with Factory Presets to get you hazing. Ready to Haze All Over Your Tracks? Grab the manual , twist those knobs, and remember: if your mix isn't slightly on fire, you're not using enough Drive. Haze: Because "clean" is for dishwashers. P.S. We're not responsible for excessive head-bobbing, air-guitar solos, or DAW crashes caused by 16x oversampling. You've been warned.
