description: DeeWider is a stereo imager plug-in that widens the sound
  transparently using LCR separation technology, with adjustable bass coloring
  and a DUO button for mono-to-stereo conversion.
details: |-
  DeeWider is a stereo imaging plug-in that widens audio transparently using unique LCR (Left, Center, Right) separation technology. By extracting the true side signal through LCR separation, it expands the stereo field without introducing the phase artifacts common in traditional stereo wideners.

  A single slider controls the amount of stereo widening, making it fast to use on any track or bus. An adjustable bass coloring control lets users tailor the low-end character of the widened signal, and a DUO button converts mono sources into pseudo-stereo, giving the plug-in additional utility on center-panned or recorded-mono material.

  DeeWider is compatible with all major DAW hosts on macOS and Windows. Tested hosts include Ableton Live, Cubase, Logic Pro X, Pro Tools, Studio One, FL Studio, Reason, Bitwig Studio, Digital Performer, OBS Studio, and more — 19 hosts in total.

  On macOS the plug-in runs as VST2, VST3, AU, and AAX (64-bit, macOS 10.12 or later). On Windows it runs as VST2, VST3, and AAX (64-bit). Download sizes are approximately 10 MB for Windows and 18 MB for macOS. A free demo is available with a 1-second silence inserted every 30 seconds.

  DeeWider is developed and distributed by DOTEC-AUDIO, cyber rock.LLC, and fmfmsoft Corp. Registration requires an internet connection.
