description: Nembrini Audio Doubler Real-Time Tracker turns your guitar performance into a stereo, double-tracked signal in real time, as if two guitarists were playing the same track left and right. The plugin enhances guitars, vocals, or polyphonic instruments with a natural doubling effect, adding richness and depth.
details: |-
  - Nembrini Audio Doubler Real-Time Tracker turns your guitar performance into a stereo, double-tracked signal in real time, as if two guitarists were playing the same track left and right. It is designed to give your recordings the larger-than-life quality of classic double-tracked rock and metal guitar tones without requiring a second take.
  - The plugin works beyond guitar — it automatically doubles vocal parts and polyphonic instruments, and can add flam-like effects to drums. Adjustable variation parameters let you dial in the character of the doubling effect, from tight and subtle to loose and lush.
  - Stereo spread is fully controllable while preserving mono compatibility, making the Doubler suitable for both mixing and live performance contexts. Sensitivity and pitch variation controls allow fine-tuning the tracking behavior to match the source material.
  - The Doubler operates in real time with no latency compensation required for tracking, making it practical for use during recording sessions or live rigs. It supports 64-bit DAWs on both macOS (10.13 or newer) and Windows (7 or newer), and is available in AU, VST2, VST3, and AAX formats.
specs: |-
  - Plugin formats: AU, VST2, VST3, AAX
  - macOS 10.13 or newer
  - Windows 7 or newer
  - Intel-compatible or Apple Silicon CPU
  - 1 GB RAM minimum
  - 64-bit DAW required
  - Real-time stereo doubling with no latency
  - Adjustable sensitivity and pitch variation
  - Mono-compatible stereo spread
