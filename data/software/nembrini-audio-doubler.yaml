description: Nembrini Audio Doubler turns your guitar performance into a stereo, double-tracked signal in real time, as if two guitarists were playing the same track left and right, and also works on vocals and polyphonic instruments.
details: |-
  "Nembrini Audio Doubler tracker turns your guitar performance into a stereo, double-tracked signal in real time, as if two guitarists were playing the same track left and right."

  Nembrini Audio Doubler is a plug-in designed to enhance your guitar, vocal or polyphonic instrument with a natural doubling effect, adding richness and depth.

  It makes your guitar riffs and solos sound massive, doubles vocal parts and polyphonic instruments automatically, and can add flam-like effects to drums.

  Just put the Nembrini Audio real-time Doubler tracking plugin on your track, and adjust the variation parameters controls to create exactly the doubling effect you're looking for, for instant doubling.
specs: |-
  - Real-time double tracking to a stereo left/right signal
  - Works on guitar, vocals and polyphonic instruments
  - Flam-like effects on drums
  - Variation parameter controls to shape the doubling effect
  - iOS version for iPhone and iPad
  - Requires a VST2, VST3, AAX or AudioUnits compatible host
  - Intel compatible or Apple Silicon CPU, 1GB RAM
  - Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
