details: >-
  Analog studio - bus comp is a virtual effect audio plugin for macos and
  windows. It functions as a VST plugin, an audio units plugin, a VST 3 plugin
  and an AAX plugin.


  As - bus comp, inspired by a classic famous british console brings the punch
  and glue to your mixes.


  The plug-in comes with an array of presets specifically designed for various
  instruments as your starting point. Utilize them in your mixes, tweak, or
  create your own.


  System requirements: os x 10.8.5 or above (qualified), intel core i3 / i5 / i7
  / xeon processor, 4 gb ram (recommended).
