description: ValhallaUberMod is a unique multitap delay and modulation plugin
  with up to 32 modulated delay taps, extensive diffusion and overdrive
  sections, and parallel slow and vibrato LFOs.
details: |-
  ValhallaUberMod is a unique multitap delay and modulation plugin. With up to 32 modulated delay taps, extensive diffusion and overdrive sections, and parallel slow and vibrato LFOs, UberMod creates lush dimensional choruses, classic string ensembles, tape and BBD echoes, nonlinear and reverse reverbs, and a bunch of sounds that defy categorization.

  The plugin features 9 operational modes: 2TapChorus, 4TapEnsemble, SuperSix, 6TapRandom, DualEnsemble, 8Tap, 16Phase, 16Tap, and 32Tap. Each mode offers a different topology for the delay taps, providing a wide range of sonic possibilities from subtle chorus effects to complex multi-tap delay patterns.

  UberMod excels at creating choruses, string ensembles, tape echoes, BBD echoes, nonlinear reverbs, and reverse reverbs. The extensive modulation and diffusion sections allow for sounds that range from classic vintage effects to experimental textures that defy categorization.
specs: |-
  - Up to 32 modulated delay taps
  - Extensive diffusion section
  - Overdrive section
  - Parallel slow and vibrato LFOs
  - 9 operational modes: 2TapChorus, 4TapEnsemble, SuperSix, 6TapRandom, DualEnsemble, 8Tap, 16Phase, 16Tap, 32Tap
  - 64-bit only
