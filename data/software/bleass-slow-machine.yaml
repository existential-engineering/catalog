details: |-
  BLEASS Slow Machine is a virtual effect audio plugin and mobile audio app for
  macOS, Windows and iOS. It functions as an Audio Units plugin and a VST 3
  plugin.

  Slow machine mutates any beat or melody from predictable to innovative. Revamp
  leads into deep basses, thicken percussion, and add live & sequenced tape stop
  effects. Thanks to 3 different yet complementary ways of manipulating time
  with creativity, bleass slow machine can deepen any beat by completely or
  partially slowing down the audio signal, transform epic leads into heavy
  basses, and add some "tape stop" effect with precision either by touching the
  x/y stop trigger or by dialling in precise sequence automation.

  The slow down stage is a creative and straightforward slowdown effect that
  modulates both rhythm and pitch. You can modulate: loop size, play speed,
  quantization, filter (frequency band), and crossfade between loops.

  The time stop stage is specially made for performance, giving an intuitive and
  visual way to instantly create a classic tape stop effect with trigger, mode
  (4 options: step, ramp up & down, ramp down, ramp up), hold, and speed
  controls.

  The speed sequencer stage offers a unique way to program speed variations in
  your music with controls for length, resolution, grid snap, sequencer (with 4
  different curve modes per step), amount, randomness, and fade.
specs: |-
  - Tape stop effect
  - Slow-down effect
  - Loop size modulation
  - Play speed modulation
  - Quantization
  - Filter (frequency band)
  - Crossfade between loops
  - Time stop stage
  - Slow down stage
  - Speed sequencer stage
  - 4 trigger modes (step, ramp up & down, ramp down, ramp up)
  - Hold function
  - Speed control
  - Sequencer length
  - Step resolution
  - Grid snap
  - Curve modes
  - Randomness control
  - Fade control
  - X/y stop trigger
  - Sequence automation
  - macOS 10.9 and later (64-bit)
  - macOS 11 big sur support
  - M1 processor support
