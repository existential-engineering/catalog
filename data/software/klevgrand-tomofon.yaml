description: Tomofon is a ground-breaking expressive audio synth. This virtual
  instrument introduces a new “Audio Model” format, capable of containing
  thousands of waves extracted from ordinary audio files.
details: |-
  Tomofon is a ground-breaking expressive audio synth. This virtual instrument introduces a new “Audio Model” format, capable of containing thousands of waves extracted from ordinary audio files. These waves - and how they're structured - lays the ground for how Tomofon generates audio, resulting in a highly flexible and instantly expressive instrument, that on one hand sounds very organic, and on the other like something out of this world.

  Tomofon converts audio files into a large set of oscillating waves, which then are mapped into pitch zones where each wave represents one layer (a bit similar to how a sampler structures different velocity zones). The main difference is that since each zone is populated with waves instead of ordinary samples, the synth engine can morph between them (both layers and zones). This makes all transitions between zones and layers continuous and seamless. This structure containing these organized wavetables is what Klevgrand calls an Audio Model, and gives Tomofon its dynamic properties and characteristic sound.

  A significant feature of this plug-in is that users can import their own audio files and create new and unique Audio Models. Ordinary audio files (preferably with monophonic content) can easily be imported and distributed into different pitch zones over the keyboard range, either automatically or manually. Doing an automatic import is basically a one-click process which instantly results in a proper playable Audio Model. A manual import gives the user full control of which waves should end up in which pitch zone.

  Tomofon comes pre-loaded with a pack of 124 Audio Models based on high quality audio recordings of multiple expressions. These models includes several instrument like strings, vocals, brass, woodwind, guitars and more. Along with these models there are over 180 presets to get you going right away. From there on you can venture further and start creating Audio Models based on your own audio files and experiment on the types of sounds they can grow to be.

  The Audio Model Editor offers a fluid workflow, automatically importing audio files and organizing them into sorted wavetables, but also with many options for manual control. Precise editing of wavetables for each pitch zone makes it easy to sculpt any sound into a playable instrument. With the addition of MPE support in v1.2, the expressiveness is taken even further.
specs: |-
  - Wide selection of factory models and presets
  - 124 pre-loaded Audio Models and over 180 presets
  - Integrated audio sample importer and Audio Model editor
  - Pitch and (layer) depth envelopes that can be edited by the user
  - Envelope times can separately be controlled via MIDI velocity
  - Several LFO's (including Sample and Hold with randomness)
  - Modulation matrix (2 x MIDI CC, Velocity and Keymap)
  - Monophonic playback with separate glide times for pitch and velocity
  - Polyphonic legato playback where started notes syncs envelopes with currently playing ones
  - Up to 4 doubling voices with separate pitch, pan and level
  - Filter with modulation possibilities, LP, HP, BP in both 12 and 24 db/oct
  - Post Reverb, Delay and EQ
  - Resizeable window (v1.1)
  - MPE support (MIDI Polyphonic Expression) (v1.2)
  - Physical "body" simulations (v1.2)
  - Custom tunings support, opens .tun files (v1.2)
  - Requires macOS 10.10 or later (optimized for the M1-processor), Windows 7 (SP1) or later, running a AU, VST or AAX compatible 64-bit host
