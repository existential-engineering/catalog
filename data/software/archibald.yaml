details: |-
  Archibald is a complete and powerful tool for creating grooves. Thanks to its
  flexible step-sequencer, you may edit drum parts of virtually any level of
  complexity. Archibald is then able to add its own realistic interpretations of
  your patterns, putting a "human" touch to note, velocity, and attack
  information, according to your own taste.

  Archibald is a virtual drummer who adds improvisational touches to your drum
  patterns. As you build your rhythm in the step-sequencer, you assign archibald
  a margin of interpretation from 0 to 100%. This margin allows for a more
  realistic sound, based upon the simple fact that no drummer plays two
  consecutive eighth notes with exactly the same tone and attack.

  Archibald may interface with your sequencer via rewire technology, allowing
  you to mix the 12 individual outputs from within your favourite sequencing
  software. You may also export your work as audio. Or use archibald to drive
  any MIDI device.

  The program produces either stereo or multi-channel output. When using stereo,
  a mixing window allows you to craft the perfect drum sub-mix, balancing levels
  and panning information to suit your needs. When using multi-channel, it is
  assumed that you will be performing your mix within your sequencer, or sending
  to a hardware mixer for the task, just as though you were using 12
  microphones. You can also insert 2 VST plugins per track.

  Live: play archibald on the stage. This allows you to drive archibald in
  real-time, I.e. For a performance on the stage. Thanks to your computer's
  keyboard or a MIDI keyboard (or foot controller), launch complex sequences and
  apply a modulation to velocities and probabilities.
specs: |-
  - Step-sequencer
  - Flexible drum pattern editing
  - Interpretation margin (0-100%)
  - Sampler engine with 44.1 kHz resolution
  - Multi-bar sequence programming
  - Rewire technology
  - 12 individual outputs
  - MIDI device control
  - Audio export
  - Sampler mode with multi-sampled sounds
  - Synth mode with effects
  - Stereo output
  - Multi-channel output
  - 2 VST plugins per track
  - Pattern creator
  - Live module
  - Real-time performance control
  - MIDI keyboard support
  - Foot controller support
  - Velocity modulation
  - Probability modulation
