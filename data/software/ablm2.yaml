details: >-
  Ablm (ab loudness match) is a gain control which enables level matched and
  sample accurate a/b comparison of fx chains.


  Features include match pre and post-fx loudness and match pre-fx loudness with
  reference level.
specs: >-
  - VST plugin

  - Audio units plugin

  - VST 3 plugin

  - AAX plugin

  - 3 loudness match modes: manual, auto and gain stage

  - Up to 256 sender/receiver pairs including auto channel set/link

  - Automatic latency measurement/compensation

  - 6 measurement modes: rms sum, rms avg, ebu r128 sl, ebu r128 ml, vu, max
  peak

  - Adjustable rms measurement window

  - Auto gain min/max limits

  - Auto gain tolerance

  - Bypass

  - Delta monitoring (sender receiver difference signal)

  - Global activate/deactivate, match mode, abfx, drive and delta monitoring

  - 4 snapshot slots

  - Very cpu friendly

  - Large and easy to use gui

  - Free gui scaling

  - Macos and windows compatibility
