description: Kuvert defines a whole new way of dealing with effects. In short,
  Kuvert allows you to draw five different envelopes. These envelopes control
  different effect parameters, and can be drawn freely or onto a grid.
details: |-
  Kuvert defines a whole new way of dealing with effects. In short, Kuvert allows you to draw five different envelopes. These envelopes control different effect parameters, and can be drawn freely or onto a grid. The envelopes are looped, while the incoming audio isn't (unless you're feeding it looped material of course).

  This is a powerful & fun way of altering your sounds to reach a whole new level, sometimes not even recognizable! Thanks to the looping nature of the plug-in, it will fit very well into any musical context. One way of using it would be to revitalize any looped material (such as beats) within just a few seconds.

  Requires macOS 10.10 or later (optimized for the M1-processor), Windows 7 (SP1) or later, running a AU, VST or AAX compatible 64-bit host.
specs: |-
  - Volume envelope
  - Low cut filter envelope (with resonance)
  - High cut filter envelope (with resonance)
  - ”Glitch” envelope (alters timing)
  - Delay send envelope (with tempo synchronized time, filter and feedback)
  - Envelopes can be drawn freely or onto a grid
  - Envelopes are looped independently of the incoming audio
  - Requires macOS 10.10 or later (optimized for the M1 processor)
  - Requires Windows 7 (SP1) or later
  - Requires an AU, VST or AAX compatible 64-bit host
  - 64-bit only
