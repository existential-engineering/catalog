details: |-
  Born of the imagination of legendary keyboardist jordan rudess and the
  software engineering excellence of french audio developer BLEASS, SampleWiz 2
  is a unique and powerful s&s (sample & synthesis) instrument. BLEASS samplewiz
  2 combines modern features such as granular and cloud sample engines, MPE, and
  iOS/desktop interoperability, with the satisfying, rapid workflow of classic
  hardware samplers.

  With just a few swipes of your finger, or a couple of clicks of your mouse,
  you can easily capture any sound or import any sample a few more swipes/clicks
  will transform your sound into a playable, characterful synth voice. And with
  full support for mpe slide and pressure, samplewiz 2 allows you to create
  nuanced and deeply expressive performances.

  With its unique ios / desktop interoperability, bleass samplewiz 2 fits in
  with your way of creating and performing too. You can capture and work on
  sounds whilst out-and-about using the ios app or auv3 plugin, then transfer
  your creation to your computer via airplay or icloud where you can incorporate
  it into a bigger project. Conversely, you can take a favourite sound from your
  windows or mac computer and transfer it to your ipad or iphone ready for use
  in a live performance, where you to take full advantage of the ios version's
  intuitive touch screen performance controls.

  Creating original sounds with bleass samplewiz 2 is as easy and fun as it is
  to load and play presets. The ui has been carefully designed to give a
  natural, intuitive workflow, with delightfully simple sampling or import of
  sounds, and a comprehensive suite of tools for chopping, granularizing,
  modulating, and adding effects to your sound designs.

  Bleass samplewiz 2 by bleass is a virtual instrument audio plugin and a mobile
  audio app for macos, windows and ios.
