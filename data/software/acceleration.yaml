details: |-
  Acceleration is a virtual effect audio plugin for macos and windows. It functions as an audio units plugin and a VST 3 plugin.

  Great for taming fret noises of bass guitar, fingernails on acoustic guitar, cymbals etc.

  The plugin includes gui, metering, improved mix parameter, inverse action switch and dither on/off switch.

  It is freeware and based on open source code from chris johnson's airwindows collection.
