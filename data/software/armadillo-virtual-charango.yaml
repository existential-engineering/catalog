details: >-
  Armadillo - virtual charango is a virtual instrument based on a south american
  instrument called charango. The origin of the instrument dates back to the
  time when south american lands were colonies of european kingdoms. Back then,
  the natives quickly learnt how to play and build the musical instruments the
  europeans had brought, and soon they were building their own versions of those
  instruments.


  Some researchers have found evidence of charangos being used during the xvii
  century, but no-one has ever been able to give a definitive answer to the
  question of when or where was that instrument created. Today, it is possible
  to find charangos being used in peru, chile, bolivia and argentina, with many
  different sizes, number of strings and tunings available.


  Armadillo - virtual charango employs a modern string-to-keyboard
  implementation that allows articulations such as strums to be achievable using
  a standard keyboard controller. This feature, combined with an intelligent
  chord recognition system which finds out what chord you are playing and
  translates it into a chord voiced specifically for a charango, makes this
  virtual instrument the perfect tool for those in need of a traditional
  south-american sound with all of the advantages associated with using a DAW
  for composing.


  The plug-in recognizes and plays more than 80 different chords including
  major, minor, seventh and diminished chords. Ez chord mode is available for
  those who cannot play chords on a keyboard.


  Full control of every parameter of the plug-in is available via MIDI.
specs: |-
  - String-to-keyboard implementation
  - Strum and arpeggio techniques
  - Chord recognition system
  - 80+ chord recognition (major, minor, seventh, diminished)
  - Ez chord mode
  - MIDI control of all parameters
  - VST plugin
  - Windows compatible
