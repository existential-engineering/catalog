name: Automat
manufacturer: alphakanal
primaryCategory: synthesizer
description: "Automat is a polyphonic stereo subtractive synthesizer. Features:
  subtractive synthesis. 3 anti-aliased oscillators. Filters and amplifier."
details: |-
  Features subtractive synthesis with 3 anti-aliased oscillators, filters and
  amplifier, 2 adsrs for filter and amplifier, and 6 modulators with tempo sync.

  Includes waveshaper / eq, delay with tempo sync, and modulated spatial effect.

  Supports poly-, unisono and legato-mode with MIDI learn functionality.

  Automat 1.01 os x / universal binary 32-bit. Release date 02.09.08 (2.03 mb).
specs: |-
  - Polyphonic stereo subtractive synthesizer
  - 3 anti-aliased oscillators
  - Filters and amplifier
  - 2 adsrs for filter and amplifier
  - 6 modulators with tempo sync
  - Waveshaper / EQ
  - Delay with tempo sync
  - Modulated spatial effect
  - Poly-, unisono and legato-mode
  - MIDI learn
  - macOS
