details: |-
  Albino-3 legend is the resurrection of a software synthesizer from the past. Originally released in 2006, albino-3 was the result of a collaboration between virtual instrument designer peter linsener and dutch sound designer and musician Rob Papen. Now reborn as albino-3 legend and with rob's in-house programmers now at the helm they have added VST3 support, different gui sizes, and compatibility with the latest pc and mac operating systems and processors.

  The albino-3's key features include high-quality presets in a wide range of styles, an easy-to-use interface, highly flexible oscillators, four types of stereo filters, an enormous range of processing and modulation options, a powerful, flexible arpeggiator and a layer system that allows you to combine up to four layers in one preset.

  Sound presets consist of 4 separate layers for rich, complex sound synthesis. 2100 rob papen presets and more. Oscillator modules include analog-type, digital-type, noise-type and audio input-type. Filter modules include silk-type, cream-type, scream-type and comb-type. 3 multimode filters (silk, cream and scream), each with a different basic design thus producing different sounding filters. Filters are stereo with panning and panning modulation options. Saturation knob precedes each filter to add overdrive to the sound before it enters the filter.

  8 envelopes, 2 types: adsfr type and 5-stage envelope type with loop function. Each envelope stage has separate slope/curve settings. Each oscillator has its own volume envelope. 4 lfos with various waveforms and MIDI-syncable. Lfo waves have adjustable start-phase and waveform-symmetry. Lfos can also be set to mono mode. Modulation matrix which includes 16 routings with 27 sources and 36 destinations.

  Arpeggiator with 32 step rhythm sequencer, step length, clock settings, various modes including modulation and chord, switchable keyboard retrigger, swing, velocity mix, save/load functionality. 4 effects units per layer each containing 12 stereo effects including two choruses, two delays, filter, phaser, reverb, flanger, gator, wah wah, compressor and lofi. Mono/polyphonic portamento/glide featuring fingered mode, switchable constant time/constant rate and auto-bend modes.
specs: |-




  - 32 note polyphonic (cpu dependent)

  - 4 oscillators per layer

  - 4 types of oscillators (analog-type, digital-type, noise-type, audio input-type)

  - Fm modulation

  - Am modulation

  - Oscillator sync in analog oscillator 2 and 4

  - 4 types of stereo filters (silk-type, cream-type, scream-type, comb-type)

  - 3 multimode filters (silk, cream and scream)

  - Stereo filters with panning and panning modulation options

  - 4 types of saturation

  - 8 envelopes (2 types: adsfr type and 5-stage envelope type with loop function)

  - 4 lfos with various waveforms and MIDI-syncable

  - Lfo waves with adjustable start-phase and waveform-symmetry

  - Modulation matrix with 16 routings, 27 sources and 36 destinations

  - Velocity control to amp, filter 1 and filter 2

  - Arpeggiator with 32 step rhythm sequencer

  - Spread function for each oscillator

  - Chord memory mode

  - 4 effects units per layer with 12 stereo effects (chorus, delays, filter, phaser, reverb, flanger, gator, wah wah, compressor, lofi)

  - Mono/polyphonic portamento/glide with fingered mode

  - Constant time/constant rate and auto-bend modes

  - Unlimited sound programs

  - Sound browser

  - MIDI program change and bank change supported

  - Adjustable precision setting

  - Gen (randomize) function

  - Microtonal support (scala file import)

  - Adjustable keyboard velocity response curve

  - Adjustable voice limit

  - MIDI activity display

  - Rear panel controls

  - Controller hardware settings save/restore

  - Circular and linear dial operation modes

  - Universal 2 binary

  - Macos and windows compatibility
