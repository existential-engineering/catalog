details: |-
  The brilliance pack provides authentic emulations of the emi rs127 and rs135
  EQ units, which were built in the early 1960s to supplement the EQ on the
  legendary redd mixing consoles. These 'presence boxes' were used on countless
  seminal recordings at abbey road during the '60s, including almost every album
  by the beatles.

  The plug-ins retain the operation and response curves from the original
  hardware and provide control of frequencies which can improve the presence and
  definition of recordings and help instruments stand out in a mix.

  The software is compatible with all popular DAW applications and can be used
  on mono, stereo and multichannel tracks.

  The rs127 rack is modelled on the original rack-mount brilliance control. The
  rs135 recreates the 8khz boost unit. The rs127 box plug-in was created by
  modelling the standalone brilliance control with an emi transformer used to
  connect it to modern consoles.

  The plug-in features an exaggerated response or 'transformer effect' at some
  settings, which is due to an interaction between the rs127 and the
  transformer.
specs: |-
  - Mono track support
  - Stereo track support
  - Multichannel track support
  - Automation support
  - Control surface support
  - Emi rs127 emulation
  - Emi rs135 emulation
  - Redd mixing console EQ supplement
  - Presence box emulation
  - Frequency control
  - Transformer effect
  - Three plug-in modules
