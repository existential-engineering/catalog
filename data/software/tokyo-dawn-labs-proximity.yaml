description: A distance pan pot offering intuitive access to psychoacoustic
  models. Finalist of the KVR Developer Contest '12.
details: |-
  Proximity is a collaborative effort by Tokyo Dawn Labs and Vladg Sound. The plug-in is an easy to use distance “pan-pot” based on several psycho-acoustic models. The idea is to give the mixing engineer a reliable tool which allows manipulating the “depth” of several sound sources in a straight forward and convincing manner.

  Several models can be combined: distance signal delay by speed of sound, distance gain loss, absorption of high-frequencies in air, stereo width manipulation, proximity effect of a virtual microphone, and distance based early reflections. All models can be turned on and off to taste. Distance modulation options extend the creative possibilities even further, and units can be switched from metric (meters) to imperial (inches).

  Proximity was Tokyo Dawn Labs' candidate for the KVR Developer Challenge 2012 and reached 2nd place in the overall category and 1st place in the mac category.

  The product is discontinued. Tokyo Dawn Labs offers the download for historical reasons only, with no active support and no guarantee of compatibility with modern systems.
