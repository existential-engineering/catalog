description: Sapphire Drive is a transparent saturation plugin designed for
  immediate sonic enhancement across any audio track. It offers four saturation
  modes—Bloom, Tape I, Tape II, and Thick—with an integrated tone control and up
  to 16x oversampling.
details: |-
  Four saturation types: Bloom (upper-mid sparkle/air), Tape I (gentle warmth, smooth transients), Tape II (denser vintage coloration), and Thick (low-mid body and weight).

  Integrated tone control built into the saturation circuit rather than applied as post-processing.

  Up to 16x oversampling with minimum or linear phase mode options for alias-free processing.

  Built-in level matching (gain compensation) and dry/wet mix for parallel saturation workflows.

  Latency-free processing at 1x oversampling (0 ms); 0.1–1 ms at 2–16x oversampling.
specs: |-
  - macOS 11+, Windows 8+
  - CPU: Intel/AMD with SSE 4.1, or Apple Silicon
  - RAM: 4 GB minimum
  - Storage: ~100 MB
  - Latency: 0 ms at 1x oversampling; 0.1–1 ms at 2–16x oversampling
  - Oversampling: up to 16x, minimum phase and linear phase modes
