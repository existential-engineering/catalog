description: Sapphire Drive is a transparent saturation plugin designed for immediate sonic enhancement across any audio track. It offers four saturation modes (Bloom, Tape I, Tape II, and Thick) with an integrated tone control and up to 16x oversampling.
details: |-
  Sapphire Drive is a transparent saturation plugin that sounds right the moment it is inserted. Drop it on any track, pick a type, set the amount, and everything simply sounds better.

  Six parameters and four saturation types are all there is. Sapphire Drive is built to get out of the way: load it on a channel and it immediately adds warmth, presence, or weight depending on the type chosen. There is zero latency at 1x oversampling and ultra-low CPU usage, so it can be used on individual tracks, across buses, or on the master, stacking as many instances as needed.

  Four saturation types are provided. Bloom gives shimmering upper-mid sparkle, adding presence, air, and brilliance. Tape I is classic tape warmth with gentle roll-off, smooth transients, and analog glue. Tape II is tape pushed harder, with denser mids, more grit, and vintage weight. Thick is raw low-mid mass, with body, density, and visceral low-end power. From airy vocals to heavy bass, Sapphire Drive delivers the right character with minimal effort.

  The Tone control is not just a post-EQ added after the fact. It works within the circuit itself, shaping the harmonic character as the signal is driven. Turning it up excites more overtones, and pulling it back gives a warmer, darker character. The resulting tonal shift feels organic, because it is part of the saturation rather than separate from it.

  Further features include a built-in Level Match, up to 16x oversampling, a dry/wet Mix for parallel saturation processing, and input/output gain staging for precise level staging.
specs: |-
  - Four saturation types: Bloom, Tape I, Tape II, Thick
  - Six parameters
  - Built-in Level Match
  - Up to 16x oversampling
  - Dry/wet Mix for parallel saturation processing
  - Input/Output gain staging
  - Latency: 0 ms when oversampling is disabled
  - Latency: about 0.1 ms in minimum phase mode when oversampling is enabled
  - Latency: about 0.7 ms to 1 ms in linear phase mode from 2x to 16x oversampling
  - Minimum system requirements: Intel or AMD CPU with SSE 4.1 instruction set, or Apple Silicon
  - macOS 11 / Windows 8
  - 4GB RAM and 100MB disk space
  - Supported plugin formats: 64-bit VST2, VST3, AAX and Audio Unit
