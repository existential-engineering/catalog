description: qwertyGO! allows you to trigger sounds with your keyboard. qwertyGO! has support for midi-devices and an integrated Audio/Plug-in environment which allows you to use VST and AudioUnit-Plugins.
details: |-
  qwertyGO! is a standalone audio triggering application that lets performers trigger sounds, samples, and songs using their computer keyboard or a MIDI device. It is designed for live acts, radio shows, theater productions, art performances, and studio presentations.

  The software supports multichannel and surround output with flexible routing, making it suitable for click-track generation on a separate channel alongside backing tracks. Multiple keyboard layout standards are supported including QWERTY, QWERTZ, and AZERTY.

  qwertyGO! includes an integrated Audio Plugin Environment that allows AU and VST plugins to be used within the application. It supports importing WAV, AIFF, OGG, FLAC, and MP3 audio files.

  Version 1.6 introduced Queues (triggering different sounds with one key), Undo for all key-related operations, and multiple selection with cut/copy/paste.
specs: |-
  - Trigger sounds with computer keyboard or MIDI device
  - Adjustable fade-in, fade-out, and cross-fade times
  - Adjustable pitch per sound
  - Multiple play modes (play loop, stop when key pressed again)
  - Mute groups
  - Multichannel/surround output and routing (up to 16 channels)
  - Imports WAV, AIFF, OGG, FLAC, MP3
  - Click-track generation on separate channel
  - Audio Plugin Environment (AU & VST plugin integration)
  - Queues: trigger different sounds with one key
  - Undo for all key-related operations
  - Supports QWERTY, QWERTZ, AZERTY keyboard layouts
  - Mac Intel, macOS 10.9+; Windows 7/8/10; 2 GB RAM minimum
