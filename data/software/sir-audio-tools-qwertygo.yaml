description: "Standalone sound triggering application for playing jingles,
  songs, sound effects, and loops using computer keyboard or MIDI devices. Ideal
  for radio shows, theaters, sport events, live performances, and studio work.
  Features click-track generation, multichannel/surround output, integrated AU
  and VST plugin environment, queues, and adjustable fade-in/fade-out/cross-fade
  times."
details: |-
  Requires Windows 7/8/10, Mac Intel with OS X 10.9 or newer. 2 GB RAM or more. Supports WAV, AIFF, OGG, FLAC, MP3 formats. 16 channel output option. Supports QWERTY, QWERTZ, AZERTY keyboard layouts.
specs: |-
  Standalone application. Keyboard and MIDI triggering. Multichannel/surround output (up to 16 channels). Integrated AU & VST plugin environment. Click-track generation. Adjustable fade-in/fade-out/cross-fade. Mute groups. Queues. Undo for key operations. Multiple selections with cut/copy/paste. Waveform display with adjustable start/stop positions.
