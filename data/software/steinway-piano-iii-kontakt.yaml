details: >-
  The acustix steinway piano is the result of the challenge to create a
  top-quality digital concert piano with breathtakingly rich and realistic
  sound, whose tonal precision and outstanding dynamic qualities rival those of
  a real, quality acoustic concert grand piano. The result is an awesome sampled
  piano with powerful bass, crystal clear mid-range and brilliant treble.


  Especially in the fortes, this piano is extremely bright, loaded with
  overtones due to sympathetic resonance. The acustix steinway piano was created
  with the smaller equipped music workstation in mind, without compromising on
  sound quality.


  This piano uses only 74 mb of carefully selected samples from 2 famous
  steinway grand pianos blended together. This makes it the ideal choice for
  orchestration setups where the piano part has to survive between the other
  instruments tending to occupy a lot of acoustic space (piano concertos, pop,
  jazz, rock, hip-hop, blues).


  The acustix steinway piano is currently available in kontakt format (sfz and
  halion sample formats are available upon request). To be able to use the
  piano, you need kontakt 5 from native instruments.


  Important: this product is a non-player library and requires kontakt full
  version 5 or later (it may also work with earlier kontakt versions, so please
  test the trial version before buying). For kontakt version 5.6.8 or higher,
  non-player libraries (I.e. Libraries without a serial/activation protection),
  which cannot be used in kontakt player version) need to be loaded via the
  kontakt files tab.
