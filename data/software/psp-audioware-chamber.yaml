description: PSP Chamber is a freeware reverb plug-in designed to emulate the acoustics of physical spaces of various sizes and shapes. Produces rapidly developing, dense reverberations with a smooth and natural decay, adding depth and dimension to audio. Suitable for tracking and mixing applications with a simple interface ideal for beginners and experienced producers.
details: |-
  PSP Chamber is available as a free download requiring an active PSPaudioware account. Supports 64-bit hosts on Windows 7-11 and macOS 10.14 Mojave through macOS 15 Sequoia (Intel and Apple Silicon).
