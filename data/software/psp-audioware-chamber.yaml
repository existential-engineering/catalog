description: PSP Chamber is a freeware reverb plug-in designed to emulate the acoustics of physical spaces of various sizes and shapes. Produces rapidly developing, dense reverberations with a smooth and natural decay, adding depth and dimension to audio. Suitable for tracking and mixing applications with a simple interface ideal for beginners and experienced producers.
details: |-
  PSP Chamber is a freeware reverb plug-in that adds depth and dimension to audio. Like classic hardware reverbs, it is designed to emulate the acoustics of physical spaces of various sizes and shapes. The Chamber algorithm is carefully crafted to produce rapidly developing, dense reverberations with a smooth and natural decay. It is a simple-to-use, great-sounding effect and a go-to option for many tracking and mixing applications.

  PSP Chamber is available for free to anyone with an active PSPaudioware account.
