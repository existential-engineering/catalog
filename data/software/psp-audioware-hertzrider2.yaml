description: PSP HertzRider2 can be an incredible tool for tuning in-harmonic sounds like snares, and when used on harmonic sounds it becomes a creative and crazy sonic destruction tool.
details: |-
  PSP HertzRider2 is the successor to the original PSP HertzRider frequency shifter. This update benefits from algorithm optimizations, and adds numerous significant new features. PSP HertzRider2 been designed to be as simple as possible, to take as few resources as possible, and to incur only very slight (and frequency dependent) latency.

  PSP HertzRider2 can be an incredible tool for tuning in-harmonic sounds like snares, and when used on harmonic sounds it becomes a creative and crazy sonic destruction tool. In addition to a wide range of shifting settings, the algorithm contains an LFO to provide interesting modulation options allowing you to further experiment and get creative.

  In order to run PSP HertzRider2 in 30-day trial mode or activate it, you don't need any hardware dongle but you need an iLok user ID which you can create for free at www.ilok.com, and you need to install the free iLok License Manager application.

  You can activate the license in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above). You can move these licenses at any time using PACE's iLok License Manager software.
specs: |-
  - High-quality frequency shifting
  - LFO control
  - Independent frequency shifting of left and right channels
  - LFO synchro mode - synchronisation to musical note values referenced to an audio host's tempo setting
  - Envelope Follower with side chain input
  - SideChain Bar with smooth mix between internal and external modulation sources
  - Additional factory presets
  - Windows 7 - Windows 11, 64-bit VST, VST3 and AAX compatible applications
  - macOS 10.14 - macOS 15 Sequoia, Intel or Apple Silicon, 64-bit AudioUnit, VST, VST3 and AAX compatible hosts
  - AAX requires Pro Tools
  - Requires a free iLok user ID and the iLok License Manager application (no hardware dongle needed)
  - License activatable in 3 separate locations, each a computer or an iLok dongle (2nd generation or above)
