description: PSP HertzRider2 is a stereo frequency shifter plugin and the successor to the original PSP HertzRider. It can be used as a precise tool for tuning inharmonic sounds like snares, or as a creative sonic destruction tool for harmonic content.
details: |-
  PSP HertzRider2 features high-quality frequency shifting with LFO control, host-synced synchro mode, independent left/right channel shifting, an Envelope Follower with sidechain input, and a SideChain Bar for mixing modulation sources. Supports Apple Silicon natively.

  iLok License Manager required (no hardware dongle). 30-day trial available.
