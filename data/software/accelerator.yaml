details: >-
  Accelerator by tekky synths is a virtual instrument audio plugin for windows.
  It functions as a VST plugin.


  Accelerator offers "accelerated synth parts".
specs: |-
  - Preset manager
  - Master gain
  - 2x wavedraw osc with save/load waveforms
  - Host/manual sync wavedraw lfo pitch modulation
  - Host sync gater/chopper with adjustable length and speed
  - Filter section with multiband select
  - Moog filter type
  - 4x chained overdrive modules
  - Multi fx section (phazer/flanger/chorus/stereo widener/3d spacialiser/delay)
  - Random fx button
  - Full easy MIDI learn
  - VST plugin
  - Windows
