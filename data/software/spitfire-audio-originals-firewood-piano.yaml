details: |-
  A detailed upright piano, with a cracked bridge, creating unique resonances. Performed by Jeremiah Fraites of The Lumineers. Recorded at Colorado Sound Studios. Five presets, including Felt and Warps. Close, Mid and Pad signals. Six controls and effects.

  Originals Firewood Piano requires the free Splice INSTRUMENT plugin to run.
specs: |-
  - File size: 7.3 GB
  - 5 presets: Firewood, Firewood+Pad, Felt, Felt+Pad, Warps
  - 3 mic signals: Close, Mid, Pad
  - Recorded at Colorado Sound Studios
  - macOS 12 or later, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
