details: |-
  Analog foundations is a growing set of sounds for the elektron analog keys and analog four. Analog foundations contains emulations of the iconic sounds of classic analog synthesizers. For example, many sounds are inspired by the ob8, prophet, dx7, pro1, jp8, and juno synths.

  Analog foundations contains: 80's inspired keys, basses, leads, and chiptune sounds. Classic brass, string, organ and piano sounds. Pads, drums, effects, and ethnic instruments, and many more.

  Analog foundations is not only a 'sound set'. It is an ever growing library of patches for the elektron analog keys/four. You do not have to buy all the sounds at once, but you can if you want direct from nwp!

  Each sound contains one zipped .syx file. After unzipping it's ready to load into your elektron synth. The exception to this is drum sets. The 'mini kits' contain more than one .syx file for one low price.

  Analog foundations gives you the solid building blocks you need for a wide variety of musical genres. New sounds are always being added at nwp so check us out.
