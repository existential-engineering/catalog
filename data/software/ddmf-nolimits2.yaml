url: https://ddmf.eu/nolimits2-limiter-plugin/
description: "A limiter plugin offering 4 different limiting algorithms with
  control over attack, release and lookahead times, up to 8x oversampling, and
  state-of-the-art LUFS loudness metering."
details: |-
  4 different limiting algorithms
  Adjustable attack, release, and lookahead parameters
  Up to 8x oversampling
  Stereo channel linking
  LUFS loudness metering
  32-bit and 64-bit versions
  Intel and Apple Silicon support
specs: |-
  - 4 distinct limiting algorithms (clean to saturated)
  - Adjustable attack, release, and lookahead times
  - Up to 8x oversampling
  - Stereo channel linking
  - LUFS loudness metering (broadcast/streaming standard compliant)
  - Windows 32-bit and 64-bit support
  - macOS 10.7+ (Intel and Apple Silicon)
  - Linux ARM (aarch64) and x86_64 support
  - iOS AUv3 support (GarageBand, Cubasis compatible)
  - Free demo available for all desktop platforms
