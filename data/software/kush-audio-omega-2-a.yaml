description: Model A vibes like a mic plugged straight into an API console from
  1976. Adding a hint of sparkle and sheen, it slowly breaks up into a gritty
  white cloud of antique saturation.
details: |-
  Omega 2 A is the "Vintage Console Sheen" voicing of the Omega 2 saturation plugins, a soft, pillowy vibe.

  Per the designer's notes, Omega 2 keeps the distortions of the original Omegas exactly as they were and changes everything around them: after a decade spent on how subtle filtering before and after distortion can shape an overall tonal curve, the original Magpha EQ algorithms are used to gently focus each saturation on the parts of the signal where it naturally excels, so the curve sounds like a natural result of the saturation rather than a separate, pasted-on effect. To the maker's ears the result is a bigger, more open sound at lower settings while remaining surprisingly smooth at more aggressive settings.

  Workflow controls were added only as far as needed to increase versatility while retaining the simplicity of the originals, so Omega 2 remains centered around a single Intensity control and every other control exists to shape what Intensity does. Increasing Intensity gradually brings each Omega's character into focus and then, pushed further, lights it up until it glows.

  The manual documents Input and Output Gain adjusting gain pre- or post-EQ over a range of +/- 12dB, a 0VU Trim that sets which dBFS value corresponds to 0dBu on the VU meter (default -18dBFS = 0dBu), a Phase switch that flips the output, and a -20dB pad that trims the input by 20dB and raises the output by 20dB for an extra 20dB of headroom. The hi- and lo-pass filters offer 6, 12, 18 and 24 slopes, with the HPF corner from 20Hz to 5kHz and the LPF corner from 40Hz to 22kHz, and XY controls move both filters together, or Blend and Makeup together.

  The plugin is sold as a perpetual licence covering 2 activations, free updates and support, and all available presets, with a free 10-day demo offered via a demo code. Mac and Windows installers and a user manual are available from the maker, and an upgrade licence is sold separately.
specs: |-
  - Phase-friendly HPF and LPF filters to shape the sound before saturation
  - Parallel Blend with pre-blend Makeup Gain
  - Dual input/output peak metering
  - Analog-style VU metering
  - Analog Highs + Oversampling or Low Latency modes
  - Freely resizable interface
  - Cross-Plugin Copy/Paste: copy settings from one Omega and paste into another
  - Single Intensity control at the centre of the plugin, with every other control shaping what it does
  - Input and Output Gain with +/- 12dB range, pre- or post-EQ
  - 0VU Trim, default -18dBFS = 0dBu
  - Phase flip and -20dB input pad for an additional 20dB of headroom
  - Selectable 6 / 12 / 18 / 24 filter slopes, HPF 20Hz to 5kHz and LPF 40Hz to 22kHz
  - Perpetual licence includes 2 activations, free updates and support, and all available presets
  - Free 10-day demo available via demo code
