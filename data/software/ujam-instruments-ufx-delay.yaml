description: "The Musical Delay: a delay plug-in with 20 delay modes plus two multi-effect sections, offering classic delay types, creative granular modes and complex patterns."
details: |-
  Although UFX DELAY is a powerful delay plus 2 multi-FX sections, it is incredibly easy to use: get instant goodness from the 150+ presets, dive into the 20 delay modes and tweak away, or let the intelligent randomization vary or even invent delays for you.

  By offering no less than 20 modes, basic to complex to creative, and making them fully adjustable, UJAM tried to keep you in the flow while giving you a plethora of creative options. Forget about programming complex delay setups: you just select which of the musical delay modes suits your signal best and tweak it to your liking.

  Delays can drown the signal in echoes, leading to a mushy mix. Ducking allows you to have more echo and a pristine input signal by suppressing the wet signal while the dry signal level is high, for example on drum beats or guitar note attacks.

  The delay signal as well as your input signal can be sent into the Filter, which offers synth filters as well as all manner of character shaping, and the Finisher which comes loaded with all kinds of effects from a simple chorus to a cloud of grains and rhythmification. The intelligent randomization of UFX plug-ins provides instant surprises on the press of a button, adjustable using the Small/Big control from subtle variations to totally new Delay presets.
specs: |-
  - 20 delay modes offering classic delay types, creative granular modes and complex patterns
  - Modes: Clean, Doubling, Digital, Dirty, Tape, Low Bandwidth, Warm, Diffuse, Grain, Random Pitch, Oct Up, Oct Down, Filter Up, Filter Down, Filter Complex, Flam, Ricochet, Ricochet Filt, Staccato Boost, Sequencer
  - Easy customization of each delay effect using controls like time to type and spread to modulation
  - Built-in multi-effect section with 40 Filter and 50 Finisher effects
  - Ducking suppresses the wet signal while the dry signal level is high
  - 150+ presets plus intelligent randomization that varies or invents entirely new delay effects
  - Operating systems: Windows 10 to Windows 11, macOS Catalina (10.15) to macOS Sequoia (15)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 300MB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
