details: |-
  Al D1 2.0 (old name dx) is a vintage drum machine AU/VST plug-in by
  Audiolounge soft. This product creates sound inspired by tom Oberheim's past
  products.

  Features new high end quality samples converted from the original eproms.
  Playable via MIDI keyboard or MIDI controller with multi outputs that can be
  selected.

  Includes an integrated mixer with pan and volume controls. Master reverb and
  master tune are adjustable, with dynamic range adjust capability.

  Available for os x and windows in 32/64-bit versions.
specs: |-
  - 32/64-bit
  - MIDI keyboard compatible
  - MIDI controller compatible
  - Multi outputs
  - Integrated mixer
  - Pan control
  - Volume control
  - Master reverb
  - Master tune
  - Dynamic range adjust
  - Tune function for each instrument
