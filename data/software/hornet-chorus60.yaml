description: Chorus60 is the recreation of the chorus module found in a famous 80s keyboard and gives you the fat and wide sound typical of a vintage chorus
details: |-
  Chorus60 is a plugin that emulates one of the most famous vintage chorus effects, originally found in an iconic 80s keyboard. This specific keyboard model, when it was released, only had one oscillator per voice, which presented a challenge in creating a richer and fuller sound. To address this, the manufacturer employed a unique chorus effect, which became the signature sound of many memorable tracks, including the hit “Sweet Dreams” by the Eurythmics.

  To recreate this legendary effect, we took the original schematic of the chorus unit, carefully analyzed it, and then simulated the entire process in a plugin. The result is Chorus60, a faithful recreation of the sound, with modern enhancements that provide you more control over the chorus parameters. While it remains true to the analog nature of the original, Chorus60 allows for greater flexibility to fit into contemporary music production workflows.

  At the heart of the original chorus effect was a particular analog BBD (Bucket Brigade Device) that played a crucial role in shaping the sound. The BBD is responsible for the delay lines that create the characteristic detuned, thickened sound. The use of this BBD, along with pre- and post-filtering, gives the chorus its distinct, warm analog sound. We have faithfully recreated the same technology in Chorus60, including its saturation and inherent hiss, and these analog characteristics can be toggled on or off.

  One of the key advantages of the Chorus60 plugin over the original hardware is the added flexibility and control over parameters. The control set includes adjustments for LFO rate, dry/wet mix, and chorus wideness. The plugin also provides modern features like 2x oversampling, which improves the quality of the audio by reducing aliasing, particularly useful when working with higher sample rates.

  While the original chorus was designed with keyboards in mind, Chorus60 is versatile and sounds great on a variety of instruments, from keyboards to vocals to guitars. When you first open the plugin, it defaults to the original settings of the classic chorus, so it sounds right out of the box, and the essential parameters are clearly laid out for quick adjustment.
specs: |-
  - Smooth fat and wide chorus
  - Mode I, Mode II and Mode I+II available as in the original unit
  - LFO rate adjustable for each of the three modes
  - Chorus stereo wideness control
  - Dry/Wet control
  - Analog saturation and hiss with separate controls
  - 2x oversample mode for best quality
  - Input and output faders with VU meters
  - Apple Silicon native support (except for AAX)
  - macOS (10.11 and later) and Windows (Vista and later) support
  - 64-bit only on Mac and Windows
  - No copy protection
