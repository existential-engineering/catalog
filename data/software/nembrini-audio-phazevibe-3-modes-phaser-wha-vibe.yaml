details: |-
  The Phazevibe is modeled after the original F-Pedals hardware version, the Eddie Kramer Phazevibe pedal. It is a unique effect because it is not a clone of any existing pedal, featuring a warm and silky tone signature inspired by legendary producer Eddie Kramer.

  Mode 1 offers a Classic Vintage Phaser, covering a range from classic phaser through vibrato to Leslie-style rotary effects. Mode 2 is a Phase-Wha mode that combines phaser with wah-wah hints, transforming into an auto-wha effect at higher speed settings.

  Mode 3 delivers a Phase-UniVibe character with warm univibe-inspired tones reminiscent of the Hendrix Uni-Vibe sound. All three modes share the same intuitive control set: Level, Tone, Speed, and a footswitch for on/off engagement.

  The plugin requires a 64-bit DAW and is compatible with macOS 10.13 or newer (Intel and Apple Silicon) and Windows 7 or newer. Current version is 1.0.9.
