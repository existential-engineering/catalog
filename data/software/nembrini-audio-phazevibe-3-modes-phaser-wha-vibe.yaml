description: The Eddie Kramer Phazevibe Plugin, Pedal version, is modelled after the original F-Pedals Phazevibe. The pedal version features 3 modes of phaser effects that are selected by a slide switch.
details: |-
  The Eddie Kramer Phazevibe pedal by F-Pedals is unusual in that it is not the clone of anything else. It has received strong ratings from musicians around the world and is included in the list of "must-have pedals" posted on Premier Guitar by Pete Thorn, alongside the Echobandit by F-Pedals.

  The Eddie Kramer Phazevibe Plugin, Pedal version, is modelled after the original F-Pedals Phazevibe. The pedal version features 3 modes of phaser effects that are selected by a slide switch.

  Mode 1, Classic Vintage Phaser, uses the large red speed knob to range from a classic phaser through a vibrato and even a Leslie-style effect. Mode 2, Phase-Wha, is a phaser with a hint of wah that becomes an auto-wah at low speed and turns into a distinctive vibrato as the speed is increased. Mode 3, Phase-Univibe, is a phaser with a hint of univibe at low speed that becomes a Hendrix Uni-Vibe sound as the speed rises, and is described as warm with a smooth vibrato.

  The Pedal version is presented as a faithful reproduction of its analog hardware counterpart, with the same warm and silky tone, developed with and inspired by the work of music producer Eddie Kramer.

  Controls comprise a Level knob for balancing the processed signal against the original level, a Tone knob that boosts or rolls off the high frequencies of the processed signal only, a Speed knob for the modulation rate, and an on/off footswitch that takes the effect in and out of the signal path.
specs: |-
  - 3 modes of phaser effect selected by a slide switch
  - Mode 1: Classic Vintage Phaser, from classic phaser through vibrato to a Leslie-style effect
  - Mode 2: Phase-Wha, phaser with a hint of wah that becomes auto-wah at low speed
  - Mode 3: Phase-Univibe, phaser with a hint of univibe that becomes a Uni-Vibe sound at higher speed
  - Level knob balances processed signal against the original signal level
  - Tone knob boosts or rolls off high frequencies of the processed signal only
  - Speed knob sets the modulation rate
  - Footswitch takes the effect in and out of the signal path
  - Modelled after the original F-Pedals Eddie Kramer Phazevibe analog pedal
  - Plugin formats: VST2, VST3, AAX or AudioUnits compatible host
  - Intel compatible or Apple Silicon CPU
  - 1GB RAM
  - Mac OS 10.13 or newer
  - Windows 7 or newer
  - 64-bit DAW required
