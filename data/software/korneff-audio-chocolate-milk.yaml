description: "A multiband processor that applies tape-style processing across three bands: MOO (low end saturation with proprietary waveshaping), SQUISH (midrange compression with a fully adjustable compressor), and FROTH (high end shaping with vintage Baxandall EQ modeling)."
details: |-
  Chocolate Milk is a multiband processor that applies low-end saturation using adjustable waveshaping algorithms, giving control over the amount and character of that saturation.

  Analog tape clips transients. Chocolate Milk instead compresses the midrange with a clean compression algorithm with adjustable attack and release, so the midrange is compressed without clipping the signal, and shapes the high end through a dedicated EQ stage rather than by retuning tape deck electronics.

  The plugin splits into three named stages. MOO is a proprietary waveshaping process that adds harmonics to thicken and define the low end, applied only to the lows. SQUISH is a fully adjustable compressor working strictly on the midrange, between MOO and FROTH, without affecting the lows or the highs. FROTH recreates a vintage Baxandall EQ through analog modeling solved in real time.

  Saturation is selectable between blends of odd and even harmonic distortion for control of the low end, and every parameter of the mid-band compressor can be adjusted. Crossover frequencies, levels, mutes and phase are all adjustable and displayed in real time, and individual bands can be soloed or shifted in phase.

  Documented applications include low-end processing on kicks, bass and keyboards, vocal processing combining compression, saturation and high-end EQ, and processing of a full mix.
specs: |-
  - MOO: proprietary low-band waveshaping saturation with selectable odd and even harmonic blends
  - SQUISH: fully adjustable midrange-only compressor with attack and release control
  - FROTH: vintage Baxandall EQ recreated by real-time analog modeling for high-end sparkle
  - Adjustable crossover frequencies, band levels, mutes and phase with real-time display
  - Per-band solo for lo-fi effects and band-restricted phase shift
  - Software-based licensing, no USB or hardware dongle and no special drivers
  - Activation on up to four machines at the same time
  - Internet connection required for activation and for all demos
  - Minimum: Intel, AMD or Apple Silicon i5 quad core processor
  - Minimum: 4GB of RAM
  - Minimum: Mac OS X 10.14 or later
  - Minimum: Windows 7 and above
  - Linux minimum: Ubuntu 18.04 LTS or equivalent (x86-64)
  - Linux recommended: Ubuntu 20.04 LTS or later, Debian 11+, Fedora 36+, or any modern distribution using glibc 2.28 or newer
  - Minimum screen resolution: 1024 x 768
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
  - Linux 64-bit: VST3, LV2
