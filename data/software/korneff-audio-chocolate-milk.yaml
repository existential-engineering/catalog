description: Chocolate Milk is a sonic enhancer that brings the warmth and
  harmonics of analog tape without sacrificing punch and clarity. Three bands of
  processing give you complete control over your signal. It's like tape, but so
  much better.
details: |-
  Analog tape emulation reimagined. Low-end saturation and plenty of punch. Magnetic tape is known for imparting warmth and bottom-end girth to a signal. Chocolate Milk does exactly that, using adjustable waveshaping algorithms to give you more control of bottom-end saturation. But it goes beyond that.

  Analog tape also clips transients, and that takes away punch and clarity. Chocolate Milk puts the squeeze on the midrange using a clean compression algorithm with adjustable attack and release to get compression without clipping the signal. In the old days, engineers would tweak tape deck electronics to sweeten the high end. It sounded good, but it was difficult to do and limited. With Chocolate Milk, you can easily get glossy highs, and far more effectively.

  MOO is a proprietary waveshaping process that adds harmonics that thicken and add definition to the low-end. Because the effect is applied only to the lows, you get control and enhancement without artifacts. Switch between blends of Odd and Even harmonic distortion for fine-grained control of low-end saturation.

  SQUISH is a fully adjustable compressor that works strictly on the midrange, between the MOO and the FROTH. Get punch and sustain without touching the lows or crimping the highs, and adjust all parameters of the mid-band compressor to precisely tailor the response.

  FROTH recreates a vintage Baxandall EQ through precise analog modeling, solving the circuit in real time. It delivers silky, natural high-end enhancements, adding air and gloss without introducing any harshness. Crossover frequencies, levels, mutes and phase are all adjustable and displayed in real time.
specs: |-
  - Three bands of processing: MOO low-end waveshaping, SQUISH midrange compression, FROTH high-end Baxandall EQ
  - Selectable blends of odd and even harmonic distortion for low-end saturation
  - Fully adjustable mid-band compressor with attack and release
  - Real-time analog modeling of a vintage Baxandall EQ for the high band
  - Adjustable crossover frequencies, levels, mutes and phase with real-time display
  - Band-restricted phase shift, and individual band solo for lo-fi effects
  - No latency
  - Intel, AMD or Apple Silicon i5 quad core processor
  - 4GB of RAM
  - Mac OSX 10.14 or later
  - Windows 7 & Above
  - Linux minimum: Ubuntu 18.04 LTS or equivalent (x86-64)
  - Linux recommended: Ubuntu 20.04 LTS or later, Debian 11+, Fedora 36+, or any modern distribution using glibc 2.28 or later
  - Screen res: 1024 x 768 or higher
  - Mac 64bit: VST3, AU, AAX
  - Windows 64bit: VST3, AAX
  - Linux 64bit: VST3, LV2
  - Software-based licensing, no USB or hardware dongles
  - Activation on up to four machines at the same time
  - Internet connection required for activation and for all demos
