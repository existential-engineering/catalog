description: "A multiband sonic enhancer that has the flavor of tape with none of the downsides. Brings the warmth and harmonics of analog tape without sacrificing punch and clarity through three processing bands: MOO (low end saturation with proprietary waveshaping), SQUISH (midrange compression with fully adjustable compressor for punch and sustain), and FROTH (high end sparkle with vintage Baxandall EQ modeling for air and gloss)."
details: |-
  Magnetic tape is known for imparting warmth and bottom-end girth to a signal. Chocolate Milk does exactly that, using adjustable waveshaping algorithms to give you more control of bottom-end saturation. But it goes beyond that.

  Analog tape also clips transients, and that takes away punch and clarity. Chocolate Milk instead puts the squeeze on the midrange using a clean compression algorithm with adjustable attack and release, so you get compression without clipping the signal. In the old days engineers would tweak tape deck electronics to sweeten the high end, which sounded good but was difficult and limited. Chocolate Milk makes glossy highs easy.

  The plugin splits into three named stages. MOO is a proprietary waveshaping process that adds harmonics to thicken and define the low end, applied only to the lows so you get enhancement without artifacts. SQUISH is a fully adjustable compressor working strictly on the midrange, between MOO and FROTH, for punch and sustain without touching the lows or crimping the highs. FROTH recreates a vintage Baxandall EQ through precise analog modeling solved in real time, delivering air and gloss without harshness.

  Saturation is selectable between blends of odd and even harmonic distortion for fine-grained control of the low end, and every parameter of the mid-band compressor can be adjusted to tailor the response. Crossover frequencies, levels, mutes and phase are all adjustable and displayed in real time, and individual bands can be soloed for lo-fi effects or shifted in phase for original sounding processing.

  Usage ideas run from huge low-end textures on kicks, bass and keyboards, to polishing vocals with compression, warmth and high-end gloss, to adding definition and punch to any source including the full mix.
specs: |-
  - MOO: proprietary low-band waveshaping saturation with selectable odd and even harmonic blends
  - SQUISH: fully adjustable midrange-only compressor with attack and release control
  - FROTH: vintage Baxandall EQ recreated by real-time analog modeling for high-end sparkle
  - Adjustable crossover frequencies, band levels, mutes and phase with real-time display
  - Per-band solo for lo-fi effects and band-restricted phase shift
  - Software-based licensing, no USB or hardware dongle and no special drivers
  - Activation on up to four machines at the same time
  - Internet connection required for activation and for all demos
  - Minimum: Intel, AMD or Apple Silicon i5 quad core processor
  - Minimum: 4GB of RAM
  - Minimum: Mac OS X 10.14 or later
  - Minimum: Windows 7 and above
  - Linux minimum: Ubuntu 18.04 LTS or equivalent (x86-64)
  - Linux recommended: Ubuntu 20.04 LTS or later, Debian 11+, Fedora 36+, or any modern distribution using glibc 2.28 or newer
  - Minimum screen resolution: 1024 x 768
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
  - Linux 64-bit: VST3, LV2
