description: "A multiband sonic enhancer that has the flavor of tape with none of the downsides. Brings the warmth and harmonics of analog tape without sacrificing punch and clarity through three processing bands: MOO (low end saturation with proprietary waveshaping), SQUISH (midrange compression with fully adjustable compressor for punch and sustain), and FROTH (high end sparkle with vintage Baxandall EQ modeling for air and gloss)."
details: |-
  Chocolate Milk is a multiband sonic enhancer designed as a better alternative to traditional tape emulation. It uses adjustable waveshaping algorithms to give you more control of bottom-end saturation, delivering the warmth and girth that magnetic tape is known for—without its limitations.

  The plugin features three distinct processors working across separate frequency bands. MOO handles low-end saturation using a proprietary waveshaping process that adds harmonics to thicken and define the low-end, with selectable odd/even harmonic distortion for fine-grained control. SQUISH is a fully adjustable midrange compressor with adjustable attack and release parameters that delivers punch and sustain without affecting the lows or highs. FROTH recreates a vintage Baxandall EQ through precise analog modeling, delivering silky, natural high-end enhancement—adding air and gloss without harshness.

  Unlike traditional tape emulators, Chocolate Milk provides adjustable crossover frequencies, independent band muting, phase reversal per band, real-time visualization, and zero-latency operation. This gives engineers precise control over each frequency region that tape emulation cannot match.

  The plugin supports Mac (VST3, AU, AAX), Windows (VST3, AAX), and Linux (VST3, LV2) in 64-bit formats. It uses a software-based licensing system with no dongles required, supporting up to four simultaneous machine activations.
specs: |-
  - Three-band multiband processing: MOO (low-end), SQUISH (midrange), FROTH (high-end)
  - MOO: proprietary waveshaping with selectable odd/even harmonic saturation
  - SQUISH: fully adjustable midrange compressor with adjustable attack and release
  - FROTH: vintage Baxandall EQ analog modeling for high-end enhancement
  - Adjustable crossover frequencies between bands
  - Independent band muting per frequency region
  - Phase reversal per band
  - Real-time visualization
  - Zero-latency operation
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
  - Linux 64-bit: VST3, LV2
  - Minimum: Intel, AMD or Apple Silicon i5 quad core processor
  - Minimum: 4GB RAM
  - Mac: macOS 10.14 or later
  - Windows: Windows 7 and above
  - Software-based licensing, no USB dongle required
  - Up to 4 simultaneous machine activations
