description: Five high quality reverb algorithms in one easy to use plugin. Core
  Dimensions is a collection of five characterful, high-quality reverbs
  algorithms with curated reverb controls designed for speed, flow, and ease of
  use.
details: |-
  Five high quality reverb algorithms, one easy to use plug-in. From analog-modeled reverbs to modern digital designs, Core Dimensions gives you five distinctive and characterful reverb algorithms to choose from. The curated set of reverb controls, with an intuitive reverb tail visualization, additional creative effects with Shimmer pitch-shifting, and automatic reverb tail ducking, help you stay in your flow but delivering the utmost speed and ease of use.

  Five flavorful reverb algorithms. Core Dimensions gives you a range of characterful reverbs to play with. There's the bright and obvious Spring reverb, great for guitars, and the dark and dense Plate Analog for your vocals and drums. You also have Plate Digital, which is warm and lush, and also good for vocals and guitars. Synth Hall is long and lush and perfect for pads and synths. And then there's the dense and immediate Chamber reverb, which works on everything, including buses.

  Core controls. Core Dimensions is designed to help you go fast and maintain your flow. With that in mind, Softube put the main controls, Time, Dry/Wet, Dark/Bright and Predelay, dead center for easy access. On the right, you'll find further controls, like Ducking and Shimmer effect. The Ducking control automatically ducks the reverb tail when there is an input signal present, while the Shimmer effect pitch shifts the reverb for extra glitter. To the left is the reverb tail visualizer that gives you an intuitive illustration of the sound of the tail.

  The Art of Rock & Roll Science. Softube's reputation for creating tools that enhance workflow and offer superior sound quality is rock solid. Softube's partnerships with premium brands like Tube-Tech, Solid State Logic, Chandler Limited, Weiss Engineering, and Trident have spanned decades. Core Dimensions is built on this legacy of passion, expert modeling, and attention to detail.
specs: |-
  - A collection of characterful, expertly recreated reverbs
  - Five distinctive algorithms: Spring, Plate Analog, Plate Digital, Synth Hall, and Chamber
  - Includes Shimmer effect, Ducking, and reverb tail visualizer
  - Main controls: Time, Dry/Wet, Dark/Bright and Predelay
  - Shimmer effect pitch shifts the reverb tail
  - Ducking automatically ducks the reverb tail when an input signal is present
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Requires a Softube account
  - Requires an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Internet access required for downloading installers and managing licenses
