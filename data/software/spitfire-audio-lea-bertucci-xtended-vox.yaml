description: Explore the outer reaches of the human voice with this incredibly
  unique world of cutting-edge textures, rhythms and evolving drones.
details: |-
  Explore the outer reaches of the human voice with this incredibly unique world of cutting-edge textures, rhythms and evolving drones. Curated and produced by composer and sound artist Lea Bertucci, this powerful tool captures the radical visceral vocalisations of herself and three renowned pioneers of the avant-garde — Audrey Chen, Cansu Tanrikulu & Phil Minton. From earth-shaking bass drones to window-shattering sound effects, whispers, rhythmic clicks and glissandi to haunting multiphonic choirs; these alien-like instruments will hum, hiss, heckle and haunt to create immediate tension, atmosphere, horror and beauty — a wealth of delights and terrors for any experimental producer, beatmaker or film composer.

  The plugin's radically transformative processed signal and in-built controls take the organic sounds to new sonic realms to create complex otherworldly synth textures, rhythms and sound effects beyond your wildest dreams — designed to inspire and breathe new life into your compositions.
specs: |-
  - 49 original presets (Audrey Chen 14, Cansu Tanrikulu 13, Lea Bertucci 6, Phil Minton 16)
  - Vocal recordings warped through outboard, tape and digital processing, cycled from the dynamics fader
  - 8 controls: Expression, Dynamics, Reverb, Start point, Attack, Decay, Sustain, Release
  - Seven bespoke reverbs, from Kiln to Church Balcony
  - Approximately 2.5GB, 2.5GB space required during install
  - NKS compatible
  - macOS 11 to OS 26, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
  - Minimum 8GB RAM, 16GB recommended
  - Spitfire Audio App required
