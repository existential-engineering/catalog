description: Acid bass synthesizer plugin designed for acid techno music production with characteristic acid bass accent and slide. Features ladder low-pass filter, detune, sub-oscillator, drive controls, phrase generator with MIDI export, and Type II filter.
details:
  - DeeACID is an acid bass synthesizer plug-in designed to make it easy to create and perform acid bass lines within any DAW environment. It features a classic ladder low-pass filter with two filter types — the original and a Type II variant — giving users a range of tonal options from clean resonant sweeps to aggressive acid tones.
  - The plug-in includes a phrase generator capable of generating unlimited patterns, along with drag-and-drop MIDI integration so users can export generated phrases directly into their DAW timeline. Sub-oscillator, detune, and drive controls extend the core synthesis engine beyond the classic acid bass template.
  - DeeACID supports sawtooth and square wave mixing, a DIABLO filter switch for more extreme timbres, and a 90s-style oscilloscope visualization. The UI supports screen resizing for flexible use across different monitor setups.
  - On macOS, DeeACID runs as VST2, VST3, AU, and AAX (64-bit, macOS 10.12 and later). On Windows it runs as VST2, VST3, and AAX (64-bit). The plug-in has been tested with Ableton Live, Cubase, Logic Pro X, Pro Tools, Studio One, FL Studio, and more than thirteen other DAW platforms.
  - A separate iOS version is available for iPhone and iPad, enabling acid bass performance and creation on mobile devices.
specs: |-
  - Ladder low-pass filter with two modes: original and Type II
  - Sawtooth/square wave oscillator with wave mixing
  - Sub-oscillator and detune controls
  - Drive/overdrive with auto-level adjustment
  - DIABLO filter switch for aggressive filter tones
  - Phrase generator with unlimited pattern generation
  - Drag-and-drop MIDI export to DAW
  - MIDI controller assignment optimized for DAW integration
  - 90s-style oscilloscope visualization
  - Resizable UI
  - 64-bit only
  - macOS 10.12 (Sierra) or later
  - Windows 64-bit
  - Formats: VST2, VST3, AU (macOS), AAX
