details: |-
  The Tube 176 is a Vari-Mu Tube Compressor / Limiter effect that runs natively in your DAW on macOS or Windows, or in real-time on your Synergy Core interface.

  The hardware original behind Tube 176 owes its sound to a unique variable-mu dual triode tube which is long out of production. Now this cult studio piece is brought back to life in the FPGA realm as a powerful, fast compressor, which can be used on everything — vocals, guitar solos, bass lines, drums, or even a full mix.

  Able to smooth the sound or completely flatten it when pushed real hard, Tube 176 makes drum transients shine and boosts vocals through a busy mix.
specs: |-
  - Vari-Mu Tube Compressor / Limiter emulation
  - Recreates a classic hardware unit built around a variable-mu dual triode tube that is no longer in production
  - Fast, powerful compression suited to vocals, guitar solos, bass lines, drums, and full mixes
  - Can smooth program material gently or flatten it aggressively when pushed
  - Brings out drum transients and helps vocals cut through busy mixes
  - Runs natively in your DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core interfaces
