description: Mashup Software is an app for making your own songs, mashups,
  remixes and unique edits. See the top 10 best mashups of all time, get
  inspired, and make your own music.
details: |-
  Mashup 2 helps you discover compatible songs and helps you mix them together, using harmonic mixing and other techniques used by top DJs. The pitch on the site is that you can find tracks that sound good together, beatmatch them instantly, and produce your own mashups in as little as 5 minutes.

  Mashups work when tracks are harmonically compatible. If basslines, vocals, or melodies clash, your mashup will suffer. With Mashup 2, harmonic mixing happens instantly: the software analyzes your music and helps you discover tracks that are 100% compatible.

  Synching tempos of two tracks played at different speeds is called beatmatching. When done properly, two songs sound like one. Mashup 2 instantly detects the BPM of your first track and adjusts the tempo of any additional tracks to match. On the screenshots page the maker describes lining up the drums in different tracks in the audio wave display to hear a perfect beatmatch.

  Mixed In Key describes the goal of the Mashup app as creating an ultra-fast audio editor: beatmatch files in seconds and try different combinations of harmonic tracks. Making mashups is trial-and-error, and they felt Ableton Live was too slow for that process. Files can be dragged in, analyzed automatically using Mixed In Key's algorithm, and beatmatched quickly in a simple timeline view.

  The site positions Mashup alongside the maker's other tools: Mixed In Key analyzes key, energy and song structure but does not mix for you, and Flow is the live on-stage performance app with a Serato/Traktor-style layout, where Mashup uses a timeline view for producing mashups that would be hard to perform live.
specs: |-
  - Harmonic mixing: analyzes your music and surfaces tracks that are 100% compatible
  - Auto beatmatching: detects the BPM of the first track and adjusts the tempo of additional tracks to match
  - Timeline view audio editor with beatmatching built in
  - Drag files in and analyze them automatically with Mixed In Key's algorithm
  - Works with your own MP3 files
  - Layer vocals and acapellas over an instrumental track
  - Produce mashups of 20+ songs
  - Build DJ mixes, radio shows and workout music
  - Plan DJ sets and build playlists of tracks that sound good together
  - Audio wave display for lining up drums between tracks
