description: LiquidSonics’ Seventh Heaven is dedicated to the reproduction of
  thirty of the best reverbs from the legendary Bricasti M7.
details: |-
  Designed for rapid workflows with a focus on simplicity and affordability, Seventh Heaven is the perfect distillation of Seventh Heaven Professional. It presents some of the most well loved presets from Seventh Heaven Professional in one of the easiest to use reverbs ever designed, all for an incredibly low price.

  For years the Bricasti M7 eluded all attempts to capture and reproduce the subtle beauty of this legendary hardware, and many in the industry considered it impossible. Fusion-IR is a unique modulated convolution-based capture and reproduction technology developed specifically around the needs of the M7. It redefines the rules of acoustic and workflow possibilities for convolution based reverberation processors.

  A selection of the M7’s best halls, plates, chambers, rooms, spaces and ambiences is accessed through a single dial, making it quick and easy to find a beautiful reverb for any track from drums, to vocals to orchestral ensembles. Its simplicity belies the power within: the most crucial parameters of a reverb such as decay times, levels and delays are fully controllable, freeing producers from many of the limitations associated with sampled reverbs.

  Each of the thirty presets’ decay times can be edited freely across the M7’s full decay time range, from 200 milliseconds right up to 30 seconds. The M7’s pre-delay and multi-voice delay can be modified and synchronised to DAW tempo, and simple low and high roll-off filter curves help place the reverb with the source.

  The M7 contains three individual reverb components: early, late and low frequency. All can be balanced in Seventh Heaven with individual reverb engines and a precise early/late reverb dial. The fully modulated low frequency reverb level, especially critical in small rooms, can be fine-tuned for a perfect mix on drums and percussion.
specs: |-
  - Thirty multi-sampled Fusion-IR presets
  - Selection of M7 v1 algorithm presets
  - Sampled at 96 kHz with high quality internal resampling where necessary
  - Samples are provided in a proprietary true-stereo multi-sampled Fusion-IR format
  - Precise decay time control: minimum 200 ms, maximum 30 seconds
  - High quality interpolation between sampled positions
  - Low, early and late reverb level control (early / late from -20 dB to 0 dB, VLF from -20 dB to 0 dB or off)
  - Pre-delay from 0 to 500 ms, optionally synced to host tempo, applied only to the low frequency and late reverb as per M7
  - Delay from 100 ms to 1 second, fixed at -6 dB, optionally synced to host tempo, applied only to the late reverb as per M7
  - Mix and gain level control
  - 2-band oversampled master equaliser: 1x high pass (12 dB / oct), 1x Massberg high cut (12 dB / oct)
  - Tool-tip help available on most parameters
  - Input and output discrete-point metering (-60 to +6 dB)
  - Mono and stereo channel configurations
  - Low CPU modes
  - Silence detection with automatic bypass
  - Fixed reflection pattern, fixed multi-band decay and fixed early/late filters
  - System requirements: iLok 2/3, iLok machine activation or iLok Cloud
  - System requirements: Windows 7 and above
  - System requirements: OS X / macOS 10.13 and above
  - System requirements: VST 2.4, VST3, Audio Unit (AUv2) and AAX Native plug-in formats
  - System requirements: 64-bit DAWs are recommended (32-bit is supported)
  - System requirements: 500 MB hard disk space is required
  - System requirements: at least 8 GB of main memory is recommended
  - System requirements: a dual core i5 processor or above is recommended
  - System requirements: Apple Silicon and Intel Macs supported
  - Perpetual license
