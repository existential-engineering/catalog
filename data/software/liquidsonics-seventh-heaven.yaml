description: Designed for rapid workflows with a focus on simplicity and affordability, Seventh Heaven is the perfect distillation of Seventh Heaven Professional, using Fusion-IR technology to capture the Bricasti M7 hardware reverb's characteristics.
details: |-
  Seventh Heaven is LiquidSonics' streamlined reverb plugin built around their proprietary Fusion-IR technology, which captures the characteristics of the acclaimed Bricasti M7 hardware reverb unit. It is designed for rapid workflows with a focus on simplicity and affordability, offering a curated selection of 30 expertly crafted M7 presets.

  The plugin provides essential reverb controls including decay time (200ms to 30 seconds), early/late/low-frequency reverb level mixing, and pre-delay with tempo sync (0–500ms). A 2-band master EQ with high-pass and high-cut filters allows straightforward tonal shaping at the output stage.

  Seventh Heaven supports mono-to-stereo and stereo-to-stereo signal configurations, with input/output metering ranging from -60 to +6 dB. Low CPU mode options help manage processing overhead in demanding sessions.

  Licensing uses the iLok ecosystem, supporting iLok 2/3 hardware, machine activation, or iLok Cloud. A free 14-day trial is available.
specs: |-
  - 30 expertly curated M7 presets
  - Decay time: 200ms to 30 seconds
  - Pre-delay: 0–500ms with tempo sync
  - 2-band master EQ (high-pass and high-cut filters)
  - Early/late/low-frequency reverb level mixing
  - Mono-to-stereo and stereo-to-stereo configurations
  - Input/output metering: -60 to +6 dB
  - Low CPU mode options
  - 64-bit only; Apple Silicon and Intel x64 Universal Binary (macOS)
  - Formats: VST 2.4, VST3, Audio Unit (AU), AAX Native
  - OS: Windows 7+, macOS 10.13+
  - Licensing: iLok 2/3, machine activation, or iLok Cloud
  - Disk space: 500MB minimum
  - RAM: 8GB+ recommended
  - CPU: Dual-core i5 or above recommended
