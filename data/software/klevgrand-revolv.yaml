details: |-
  Revolv is a unique reverb plugin like no other, emerging directly from Swedish cultural and sonic heritage. Whether you place your mix in a peaceful forest, an ancient ruin, or a sweaty sauna, Revolv's impulse responses capture the unique ambiance of each location. Explore historically and acoustically unique spaces like the medieval Gotland ruins or Uppsala Cathedral, meticulously recorded to give your audio a sense of depth and authenticity that sets it apart.

  At the heart of Revolv is the dedication of sound designer Oscar Bjork, who embarked on an epic journey across Sweden in a project called "Echoes of Our Time", capturing the unique acoustic fingerprints of a diverse selection of handpicked locations. His passion for preserving the soul and sound of these locations has resulted in an extraordinary collection of impulse responses, each a testament to his painstaking efforts and deep appreciation for Sweden's acoustic heritage.

  Revolv features an innovative design, revolving around "location wheels" and a loupe selector. Simply move the selector around the wheels to change location and sound. Each location also offers a detailed view where you can learn more about the site and customize the decay, predelay, and width, as well as adjust your microphone preference and recording distance. Six wheels are available, each representing a group of locations, ranging from rare and quirky to epic halls.

  A convolution reverb blends your audio with an impulse response (IR) from a real acoustic space. Revolv simplifies this complex process, offering a user-friendly interface and an extensive variety of authentic environments.

  Revolv's impulse responses are hand-recorded and processed (no AI involved). Each IR is a genuine audio snapshot of a space's natural acoustics, ensuring that the reverb you add to your recordings is as real and rich as the location itself. This authenticity makes Revolv an invaluable tool for musicians, sound designers, and audio engineers, particularly in fields like film and video game sound design where convincing space replication is key. Despite convolution reverbs being resource-heavy, Revolv is designed for efficient performance without sacrificing quality.
specs: |-
  - 100+ carefully captured impulse responses from historic and modern Swedish locations.
  - Unique, fast workflow for quickly switching between different IR:s.
  - Works both as a traditional reverb and an exquisite room processor.
  - Extensive background info on the many different locations.
  - Up to three mic placements for each locations, featuring different microphone models.
  - Fine-tune decay, predelay, width, and more for precise control over each space.
  - Efficient optimized CPU design allows high-quality reverb without sacrificing your system's performance.
  - Tailor-made for film, TV, and video game sound design where authenticity and realism are critical.
  - Powerful EQ featuring two parametric filters available (low / high cut, low / high shelf, bell)
  - Requires macOS 10.10 or later (optimized for the M1-processor), Windows 7 (SP1) or later, running a AU, VST3 or AAX compatible 64-bit host.
  - Each location has a secondary view, reachable by clicking the magnifying glass, that will let you customize various settings, such as Pre-delay, Decay Time, Mix, Gain, EQ, Width, microphone type, and, if available, microphone placement.
  - Each IR has a 360 degree view of the captured room.
  - iPad version available as AUv3 and standalone.
