description: Distortion plugin VST VST3 Audio Unit.
details: |-
  Blowfish was built to fulfill the goal of adding crisp and sparkling sound to
  leads. Blowfish slaps the input signal with a complex chain of distortions and
  adds a side-chained bright topping on the sound transients.

  What results is a very sparkling and shiny sound with that crisp garnish that
  you can hear in professional productions.

  A broad range of controls are here to help you tailor the sound you need.

  The plugin allows you to blend the original signal with the one at the end of
  the processing chain, while controlling the output volume. It controls the
  gain of a sidechained bright noise over the transients of the input signal.

  The plugin sets the drive for the first stages of the distortion algorithm and
  controls the intensity for the last stage in the distortion chain which
  softens the heavily distorted harmonics.
specs: |-
  - Distortion
  - Side-chained bright topping
  - Complex chain of distortions
  - Transient processing
  - Blend control
  - Output volume control
  - Sidechained bright noise control
  - Drive control
  - Intensity control
