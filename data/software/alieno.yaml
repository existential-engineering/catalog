description: Alieno is a hybrid synthesizer. Its sci-fi styled, object-oriented
  environment allows the user to mix-up different synthesizing techniques
details: |-
  Alieno is a hybrid synthesizer with a sci-fi styled, object-oriented
  environment that allows the user to mix-up different synthesizing techniques
  and develop powerful and articulated voices.

  The synthesizer is equipped with advanced internal modulation and external
  MIDI control, built-in effects and an extended library of leads, sequences,
  chords, basses and special fx.

  Patches can be loaded in .txt format using the file menu in the LCD bottom
  right corner. Banks are available also in .fxb format; in that specific case
  you must use the host loading function instead.

  The yellow knob controls brilliance, the green knob controls fade-in, and the
  smallest violet knob is a menu for random, preset, and other functions.
specs: |-
  - Hybrid synthesizer
  - Sci-fi styled object-oriented environment
  - Advanced internal modulation
  - External MIDI control
  - Built-in effects
  - Patch loading in .txt format
  - Bank loading in .fxb format
  - Subtractive synthesis
  - FM synthesis
  - Semi-modular synthesis
