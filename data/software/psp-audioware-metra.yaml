description: Metering plugin designed for engineers who need absolute confidence in loudness, dynamics, and stereo image. Built strictly as an analysis tool, Metra never alters your audio, its sole purpose is to give you clear, reliable information you can trust when critical decisions matter.
details: |-
  PSP Metra is a high-end real-time analysis and metering plugin built for engineers who need absolute confidence in loudness, dynamics, and stereo image. Designed strictly as an analysis tool, Metra never alters your audio - its sole purpose is to deliver clear, reliable information when critical decisions matter.

  It brings together professional level, dynamics, stereo, and loudness metering in one unified interface, featuring Sample and True Peak, PPM, RMS and VU, Dynamic Range and Crest Factor, stereo correlation and balance, goniometer and Lissajous displays, as well as fully standards-compliant loudness metering including LUFS, LRA, PLR, PSR, and optional Dialogue Integrated Loudness. Everything you need to confidently monitor modern mixes, masters, and broadcast deliverables is always in view.

  Inspired by the clarity of classic 1980s plasma meters and powered by modern measurement standards, PSP Metra combines exceptional visual readability with state-of-the-art loudness compliance - making it equally at home in music production, mastering studios, and broadcast environments.

  PSP Metra allows simultaneous display of two different measurement panels on the left and right sides of the window. Each panel can independently present a different type of measurement, but the same view cannot be active on both sides at the same time. Dedicated views tailored to different stages of production include Metra View (full level, dynamics, balance, and correlation overview), Minimal View (compact metering for everyday mixing), History View (visual trace of levels, dynamics, and distribution over time), Goniometer and Lissajous Views (detailed stereo field and phase inspection), and Loudness View and Loudness Values View (focused loudness compliance monitoring). Each view is designed to reduce visual clutter while keeping critical information instantly readable.

  PSP Metra does not process audio. It does not clip, compress, or modify your signal in any way. With the exception of an optional weighted filter monitoring mode (for inspection only), what you hear remains untouched, what changes is your insight.
specs: |-
  - Peak, RMS, and VU metering with selectable ballistics
  - Dynamic Range and Crest Factor monitoring for micro- and macro-dynamics
  - Stereo image analysis, including correlation, balance, and goniometer displays
  - History and waveform views showing up to 120 seconds of level evolution
  - Momentary, Short-Term, and Integrated Loudness (ITU-R BS.1770 / EBU R128)
  - True Peak detection with oversampling for accurate inter-sample peak monitoring
  - Loudness Range (LRA) for program-level dynamics
  - PLR and PSR to assess headroom and transient preservation
  - Optional Dialogue Integrated Loudness using licensed Dolby Dialogue Intelligence
  - Built-in presets for platforms such as EBU R128, ATSC A/85, Spotify and Apple Music
  - Stereo and Mono operation with advanced Mid/Side analysis
  - Fully customizable scales, colors, and metering behavior
  - High-resolution GUI with 100% scalable interface
  - Windows 7 to Windows 11, 64-bit VST, VST3 and AAX (Pro Tools) hosts
  - macOS 10.14 Mojave to macOS Tahoe (macOS 26), Intel and Apple Silicon, 64-bit AudioUnit, VST, VST3 and AAX hosts
  - Free iLok user ID and iLok License Manager required, no hardware dongle needed, license activatable in 3 separate locations
