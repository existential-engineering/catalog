description: A high-end real-time analysis and metering plugin built for engineers who need absolute confidence in loudness, dynamics, and stereo image. Features peak, RMS, and VU metering with adjustable ballistics, dynamic range and crest factor monitoring, stereo analysis with goniometer and Lissajous displays, 120-second history, standards-compliant loudness metering (LUFS, LRA, PLR, PSR), true peak detection with oversampling, and platform presets for EBU R128, ATSC A/85, Spotify, and Apple Music. Pure analysis only — no audio processing.
details: |-
  iLok License Manager required (no hardware dongle needed). License activation available in 3 locations. Supports M/S analysis and optional Dolby Dialogue Intelligence for speech measurement. Fully scalable GUI with customizable scales and colors.
