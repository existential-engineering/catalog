details: |-
  "analog bass" (model 01) is a 25 key synth bass rompler plugin for Mac OS X.
  It features 5 unique patches along with a chorus generator for patch #01. Five
  patches play simultaneously and can be mixed with the dedicated volume knobs.

  A gain knob controls the overall output gain. The sounds are recorded from
  custom programmed patches on a hardware analog synth.

  Most suited for: electronic music - arpeggio style bass lines.
specs: |-
  - 25-key synth bass instrument
  - 5 patches + 1 chorus generator
  - 78 one-shot samples
  - 24-bit/44.1khz quality samples
  - Level meter
  - macOS compatible
