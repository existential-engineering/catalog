description: Rassel – Pocket Shaker truly transforms your iPhone into a shaken
  percussion instrument. Just pick up the device and shake it.
details: |-
  Rassel – Pocket Shaker truly transforms your iPhone into a shaken percussion instrument. Just pick up the device and shake it. Rassel comes with four different instruments: egg, shaker, tambourine and bells. Simply swipe the screen to change between them.

  Unlike similar apps, Rassel is based on a unique audio rendering engine that accounts for continuous velocity changes based on how the sampled instruments are agitated. The device's gyroscope is directly mapped to this velocity which makes any movement sound the way a real instrument would.
specs: |-
  - Four different instruments: egg, shaker, tambourine and bells
  - Loose, normal or tight instrument setting
  - Loudness boost to crank it up
  - Swipe the screen to change between instruments
  - Audio rendering engine accounting for continuous velocity changes
  - Device gyroscope mapped directly to instrument velocity
  - iPhone, standalone
