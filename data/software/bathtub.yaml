details: |-
  Bathtub is more than just a simple compressor: it does multi-band compression,
  multi-layer parallel compression, series compression, mid/side compression,
  left/right compression, rms/peak detection, side-chaining, look-ahead,
  limiting & maximizing and has comprehensive metering and clip counting.

  Bathtub is really two flexible and configurable stereo compressors that can be
  routed to be in series or parallel, can be fed the input signal split into
  high/low frequencies or full band, and can perform as different styles of
  compressor, limiter or maximizer to produce a range of flavours and effects.

  The metering shows you visually what is happening too, so you can see how much
  compression and gain you are getting.

  Each band has stereo balance for independent left and right channel
  compression. Each band has mid/side stereo narrow/width control, which can be
  used to narrow the low frequency and spread the high, or have independent
  mid/side compression.

  Either or both bands can use sidechaining to drive the compressor from an
  external signal. Either or both bands can be muted to help with sound design
  or save cpu in single band mode.
specs: |-
  - Multi-band compression
  - Multi-layer parallel compression
  - Series compression
  - Mid/side compression
  - Left/right compression
  - Rms/peak detection
