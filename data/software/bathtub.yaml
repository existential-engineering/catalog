  - Comprehensive metering
  - Clip counting
  - 2 band multi-function compressor
  - Flexible stereo balance
  - Adjustable frequency split point
  - Adjustable overlap/gap of bands
  - Independent compression controls per band
  - Stereo balance for left and right channel compression
  - Mid/side stereo narrow/width control
  - External side-chaining capability
  - Mutable bands
  - Linear or non-linear attack/release curve
  - Linked or unlinked stereo input detection
  - Filtered input detection
  - Stereo average or max level detection
  - Peak or rms level detection with adjustable window
  - Optional soft limit at final output
  - User-defined look-ahead in ms
  - Wet/dry mix control
  - Stereo input/output metering
  - Gain reduction metering
  - Clip indicator/counter with adjustable sensitivity
  - Peak level metering
  - VST plugin format
  - Windows compatible
