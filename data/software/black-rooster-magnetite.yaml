description: Tape saturation plugin inspired by Studer reel-to-reel machines. Add warmth, glue and analog grit to drums, vocals and bus.
details: |-
  Magnetite is a tape saturation plugin, an homage to the sound of magnetic tape recorders. You set the Recording Level, pick a tape type, and Magnetite lays the analog sonics over your track: harmonic warmth, a little compression, that top-end that softens the harshness digital tends to leave behind. Push the input harder for grit and drive; back it off for a clean, subtly-glued tone. It is the kind of processor you stop noticing until you bypass it and the mix suddenly sounds flat.

  Recording to tape was never neutral. The magnetic medium saturates as you drive it, rounding transients and adding even and odd harmonics; the Class-A record and playback amplifiers colour the signal; the NAB-style pre- and de-emphasis EQ tilts the frequency response; and the machine's speed and bias settings shape how much low-end bump and high-frequency detail you keep. Magnetite models the whole chain — Class-A amps, tape response and saturation, NAB EQ, bias, tape speed, plus the hiss, hum, wow and flutter — as a system, so the parts interact the way they do on a real deck instead of sounding like a bolted-on distortion.

  The Tape Type buttons swap between three formulations — Black, Blue and Red — each with its own frequency response, from the low-end head-bump region up through the treble roll-off. Tape Speed toggles between 7.5 and 15 ips. 15 ips runs a flatter, more extended response; 7.5 ips shifts the head bump lower and more pronounced and changes how the highs behave. The Bias control (Normal, +3dB, +5dB) trades linearity against saturation character. Recording Level and Playback Level (both -24 to +24dB) set how hard you drive the tape and the Class-A playback amp; right-drag either knob to inverse-link the two.

  On drums, drive the Recording Level hard at 7.5 ips for fat, glued room and bus tones. On vocals, a gentler setting adds air and self-levelling. Across a full mix or stems, run Magnetite as the first insert of the chain for cohesion and analog weight. Duplicating a track, applying Magnetite and flipping the phase on one copy while riding Wow & Flutter produces a lush 70s phasing effect.
