description: An exhaustive set of 55 orchestral percussion instruments, recorded at Studio 22, Budapest. Percussion offers superb balance between precision and ambience, and the range and playability to meet the needs of any orchestral production task.
details: |-
  PERCUSSION is a set of 55 orchestral percussion instruments recorded at Studio 22 in Budapest, balancing precision against ambience and covering the range and playability needed for orchestral production work. It also serves as a percussion set for pop and electronic genres. The palette spans symphonic classics such as timpani, snare and concert toms, tuned percussion including celesta, marimba and vibraphone, and hand percussion such as agogo, jawbone and temple blocks. Each instrument can be played on its own or as part of one of seven combined kits.

  The library uses a sampling and playback system built for realism. Drum Head Resonance Simulation (DHRS) intelligently switches between recordings of strikes on still drum heads and recordings with resonating heads, so round-robin sets recreate the real-world sound of played drums and adjust for style and performance. An ultra-detailed spot microphone for transient detail joins four distinct room mixes, providing depth and versatility across compositions and genres.

  PERCUSSION ships in two editions built from the same recordings and sharing the same interface, keyboard and articulation layouts. The full SYMPHONY SERIES edition is 29 GB compressed and carries 55 recorded instruments across 67 NKIs including 7 kits, five microphone mixes with a Mixer page, and an Effects page with EQ, reverb, compression and filter. The streamlined SYMPHONY ESSENTIALS edition is 4 GB compressed with the 18 most important instruments across 21 NKIs including 1 kit, a single stereo microphone mix and no Mixer page, keeping the same articulations, performance features and Effects page.

  Both editions offer Tremolo, Crescendo Roll, Flam, Edge variations and FX articulations, and both run in the free KONTAKT 5 PLAYER as well as the full KONTAKT 5.
specs: |-
  - Works with the FREE KONTAKT 5 PLAYER or KONTAKT 5 (version 5.6.8 or higher)
