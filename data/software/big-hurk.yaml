details: |-
  Big hurk is the first release in Reign Design's "emuration" line. Emuration is
  what they call comparative emulation based on impulse responses.

  It is made of several impulses at varied levels of intensity all on the same
  unit.

  If you are wanting to add thick rounded yet still detailed sound to your mixes
  then you should give the "big hurk!" demo a try.
