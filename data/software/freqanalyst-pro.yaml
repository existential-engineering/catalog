details: |-
  Blue cat's FreqAnalyst Pro is an extended version of the freeware blue cat's
  freqanalyst. Blue cat's FreqAnalyst Pro is a real time spectrum analyzer with
  extremely smooth response and complete control over the audio spectrum
  analysis, including slope and offset correction.

  It offers memory slots to save/restore frequency response curves for easier
  a/b comparison and a customizable user interface with a transparency feature
  letting you see behind it.

  A spectrogram view has been added to the picture to monitor the evolution of
  the spectrum over time.

  This plug-in is able to extract frequency information from the audio signal
  and export it as MIDI cc or automation curves in real time: audio effects or
  MIDI hardware can now be controlled by the pitch of the signal.

  Blue cat's freqanalyst pro is available as a single product or within the
  analysis pack or all plugins pack bundles.
specs: |-
  - Real time spectrum analyzer
  - Mono and stereo analysis
  - Slope and offset correction
  - Smart interpolation algorithm
  - Spectrum and spectrogram views
  - Zooming and precise measurement capabilities
  - Instant, peak and average curves display
  - Memory slots for frequency response curves
  - Audio to MIDI conversion
  - Automation curve export
  - MIDI cc export
  - Custom absolute and relative threshold control
  - Customizable user interface
  - Transparency/opacity control
