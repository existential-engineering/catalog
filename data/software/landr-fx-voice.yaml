description: LANDR FX Voice effects plugin. Polish your vocals with
  professionally designed EQ, reverb, saturation, delay and more. Included in
  LANDR Studio.
details: |-
  LANDR FX Voice is a multi-effect plugin built for vocals. The page frames it as letting the voice take centre-stage in a mix, polishing, smoothing and controlling vocals with everything from tastefully tailored EQ to epic reverb to full-on distortion, with over 40 curated presets.

  The plugin ships with 46 meticulously crafted presets that deliver a polished sound instantly, so a vocal take can be fast-tracked without assembling a chain by hand.

  Control is centred on an easy-to-use blender dial that takes the guesswork out of complex mixing techniques, letting the user reach a target sound faster than by tweaking individual parameters.

  LANDR positions the plugin around two use cases. The first is adding polish, saving time and money in the studio with expertly dialled-in EQ and effects, cleaning up vocals with corrective presets such as De-Mud and De-Ess, and skipping complex plugin chains to reach radio-ready colour and character. The second is finishing vocals fast, blending FX for hooks, top-lines and harmonies, and finding new colour and character in seconds from expertly combined multi-FX in a single plugin.

  FX Voice is included with the LANDR Studio subscription, which bundles plugins, samples, mastering and distribution. The product page carries a demonstration by Oscar-winning engineer Daniel Rowland using the plugin to add clarity and space to lead and backing vocals.
specs: |-
  - 46 presets (page intro also cites 'over 40 curated presets')
  - Blender dial for simplified control
  - EQ, reverb, saturation, delay and distortion
  - Corrective presets including De-Mud and De-Ess
  - macOS: MacOS X 10.14 or higher
  - macOS: Apple Silicon Native or Intel (VST3, AU, AAX)
  - Windows: Windows 10 (64 bit) or higher (VST3, AAX)
