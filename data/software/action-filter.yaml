details: |-
  Action Filter is designed to be flexible enough to fulfil your needs whenever you reach for any type of filter, with a user friendly interface and quick deeply customizable controls. There are two serial filters in the signal chain. You can blend this two filters with your modulation design and analog saturation to create classic or modern or amazing beyond time filter sound effects.

  There are three modulation sources: a custom shape envelope follower, the lfo with 5 waveforms, a 32-step sequencer and each modulation sources can be assigned in-sync or free-sync modes. You can be so experimental or innovative with twaking parameters in depth.

  With tons of classic filter models, unique advanced modulation options and convincing analog character, action filter is definately an addiction.

  Noiseash's magical, fast & hd quality dsp engine. Two individual multi mode filter modules. For each filter module; 13 popular analog & digital filter models are all in one package.

  2 individual advanced modulation engines (7 modulation wave shapes - including saw, square, triangle, sine, randomizer, custom envelope wave forms and 32 bar step sequencer sync/free modes) for each filter module. Simplified controls, lot's of creative possibilities. Vintage analog stauration unit. Resizable gui. Friend of cpu.
