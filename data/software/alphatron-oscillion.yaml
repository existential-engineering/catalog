details: |-
  Alphatron Oscillion is a polyphonic subtractive synthesizer to produce a vast
  array of sounds, utilizing three main signal modules: frequency
  (voltage-controlled oscillator VCO), timbre (voltage-controlled filter VCF)
  and amplitude (voltage-controlled amplifier VCA). Four VCOs initiate the sound
  waveform and control its frequency. It also determines the initial timbre by
  the waveform option selected (sawtooth or square).

  The vcf module shapes the timbre via a low-pass filter with cutoff and
  resonance parameters controlled by an envelope generator. The amplitude of the
  sound is shaped by the vca envelope.

  It generates iconic vintage synthesizer sounds with distinctive pads, peculiar
  keys, punchy basses, sparkle leads, creepy effects, charming ambient
  soundscapes or unearthly and otherworldly atmospheres. Suitable for many
  genres and styles of music and pliability to custom design over a diverse
  sonic palette.

  The voltage controlled oscillator (vco) envelope changes the produced
  frequency and can be used to modify the attack phase or to create special
  effect sounds. The voltage controlled amplifier (vca) envelope controls the
  volume or amplitude of the sound with independent control over each adsr stage
  (attack, decay, sustain, release) over the vca amplifier that varies its gain
  depending on a control voltage.

  The voltage controlled filter (vcf) is a low-pass filter that lets the lower
  frequencies or harmonics pass unchanged, while it attenuates or reduces the
  strength of the higher frequencies, offering a simple and effective tone
  control to shape and color the sound source. The vcf envelope section provides
  control of the filter cutoff frequency over time, with independent control
  over each adsr stage (attack, decay, sustain, release).
specs: |-
  - Polyphonic subtractive synthesizer

  - Four voltage controlled oscillators (vco1, vco2, vco3, vco4)

  - Voltage controlled filter (vcf) with low-pass filter

  - Voltage controlled amplifier (vca)

  - Vco fine-tuning

  - Vco octave control (-2 to +3 octaves)

  - Vco shape morphing (sawtooth and square waveforms)

  - Vco speed control

  - Vco gain modulation

  - Vco envelope with adsr control

  - Vca envelope with independent adsr stages (attack, decay, sustain, release)

  - Vcf cutoff frequency control

  - Vcf resonance control

  - Vcf envelope with independent adsr stages

  - 4-voice stereo chorus effect

  - Stereo delay with time and feedback parameters

  - Integrated reverb module with size and width controls

  - Pitch bend wheel

  - Virtual keyboard

  - Preset manager with browser

  - MIDI automation

  - 50 internal presets

  - VST plugin support

  - Vst3 plugin support

  - Audio units (AU) plugin support

  - Windows 11, windows 10, windows 8.1, windows 8, windows 7 (64-bit)

  - Macos sonoma 14, macos ventura 13, macos monterey 12, big sur 11, catalina
  10.15, mojave 10.14, high sierra 10.13, sierra 10.12

  - Intel cpu processors

  - Apple arm-based m1/m2/m3 silicon chips support under rosetta 2 mode

  - DAW host application with vst2 support (64-bit)

  - DAW host application with vst3 support (64-bit)

  - DAW host application with audio unit (AU) support

  - MIDI keyboard controller compatible

  - Asio compatible sound card recommended
