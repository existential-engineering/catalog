details: |-
  AutoTremWahLight, being the light version of the autotremwah, performs
  modulation of a filter by the low frequency generator taken from the
  pechenegtremolo. You can choose 3 types of filter, set resonance and cutoffs
  of the filters.

  As in the pechenegtremolo you can set the lfo parameters: use all the features
  of pechenegtremolo plugin. Choose between low pass (lp), band pass (bp) and
  wah filters. The wah filter parameters were adapted to fit the vox v847 wah
  pedal.

  Control filter resonance by the res knob. Control lower and upper filter
  cutoffs by cutoff 1 and cutoff 2 knobs. Control dry/wet ratio by the mix knob.

  Autotremwahlight by pechenegfx is a virtual effect audio plugin for macos and
  windows. It functions as a VST plugin and an audio units plugin.
specs: |-
  - Filter modulation
  - Low frequency generator (LFO)
  - 3 filter types (low pass, band pass, wah)
  - Filter resonance control
  - Cutoff frequency control
  - Dry/wet mix control
  - Wah filter (vox v847 adapted)
