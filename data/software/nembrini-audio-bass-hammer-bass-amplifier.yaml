details: |-
  The Nembrini Bass Hammer plugin, modeled on the Aguilar Tone Hammer* , is engineered for advanced bass tone shaping, featuring Adaptive Gain Sculpting, comprehensive EQ adjustments, and versatile cabinet simulations. AGS (Adaptive Gain Sculpting) transforms your signal’s EQ curve and gain structure, altering the behavior of the MID parameter. Six bands centered at 125 Hz, 250 Hz, 500 Hz, 1 kHz, 2 kHz, and 4 kHz, enabling nuanced sculpting across the bass frequency range
