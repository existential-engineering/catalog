description: Advanced Tone Sculpting Bass Amplifier modeled on the Aguilar Tone Hammer, featuring Adaptive Gain Sculpting, comprehensive EQ adjustments, and versatile cabinet simulations.
details: |-
  - Bass Hammer is an advanced bass amplifier plugin independently modeled by Nembrini Audio on the Aguilar Tone Hammer, delivering professional-grade bass tone shaping for studio and live use. The plugin is not officially endorsed or licensed by Aguilar Amplification LLC.
  - The Adaptive Gain Sculpting (AGS) circuit transforms the signal's EQ curve and gain structure, altering the behavior of the MID parameter to deliver the characteristic tone-shaping response the original hardware is known for.
  - A six-band Graphic EQ provides precise frequency sculpting at 125 Hz, 250 Hz, 500 Hz, 1 kHz, 2 kHz, and 4 kHz, giving players detailed control over the low-end and midrange character of their bass tone.
  - Cabinet simulations include 4 modeled bass guitar cabinets paired with 4 microphone emulations, plus a parallel D.I. signal path with a console-style compressor and ambient reverb blending for full signal chain versatility.
  - An Impulse Response Loader supports two third-party impulse responses that can be blended together, with flexible pre/post D.I. mixing, complemented by a Noise Gate with adjustable threshold, range, and speed controls.
specs: |-
  - macOS 10.13 or newer, Apple Silicon compatible
  - Windows 7 or newer
  - iOS: iPhone and iPad via Apple App Store
  - 64-bit DAW required
