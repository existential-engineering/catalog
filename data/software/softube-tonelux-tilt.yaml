description: A collection of EQ plugins that allows you to go from shimmering
  bright to warm and wide with a twist of a knob. This tilt EQ plugin is a fast
  and effortless way of making a track sit better in a mix.
details: |-
  Go from shimmering bright to warm and wide with a twist of a knob! The Tonelux Tilt plug-in is a fast and easy way of making a track sit better in a mix or make it sound 'warmer' or 'cooler'. It's also perfect in a live situation where you need to tweak the whole mix to adjust for ear fatigue.

  Three versions are included: Tonelux Tilt, Tonelux Tilt Live, and Tonelux Tilt and Tilt Live for Amp Room. The plug-in was created in close collaboration with Tonelux designer Paul Wolff.

  Alongside the single tilt knob, the plug-in offers High and Low Pass filters with a 12 dB/oct possibility, and modeled output transformer distortion.

  The product supports Softube Extended Features: easy-access panels that add modern precision and workflow on top of the analog-style interface. It is also Console 1 Ready, so it can be used within Softube's Console 1 mixing system.

  Tonelux Tilt and Tilt Live is also available as part of Flow Mixing Suite and Flow Complete Suite.
specs: |-
  - Quickly get the basic sound in place with just a single knob
  - Three versions included: Tonelux Tilt, Tonelux Tilt Live, and Tonelux Tilt and Tilt Live for Amp Room
  - Created in collaboration with Tonelux designer Paul Wolff
  - High and Low Pass filters, with 12 dB/oct possibility
  - Modeled output transformer distortion
  - Supports Softube Extended Features panels
  - Console 1 Ready: can be used within the Console 1 mixing system
  - Includes native plug-ins plus Amp Room modules
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a DAW host compatible with AU, VST, VST3 and/or AAX
  - Internet access required for downloading installers and managing licenses
  - 20-day trial, 14-day returns, three activations
