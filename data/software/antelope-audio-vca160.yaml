details: |-
  VCA160 is a VCA Compressor / Limiter effect that runs in real-time on Antelope Audio Synergy Core interfaces.

  VCA160 combines classic sound, perfect metering and ease of use. Suitable for both 'brick wall' limiting and subtle pushing, the hardware original has been carefully modeled to preserve its distinct character in both bad-ass hard knee or gentle low ratio compression.

  This fast and firm VCA-style compressor is great for controlling vocals, bass guitar or individual drums. When used with aggressive transient sounds, such as kick drums or bass, the VCA160's fast response can create a classic punch or 'thwack', which has become a unique part of its famously punchy pedigree.
specs: |-
  - VCA Compressor / Limiter emulation
  - Modeled after the classic hardware original
  - Hard knee mode for aggressive 'brick wall' limiting
  - Low ratio mode for gentle, subtle compression
  - Fast VCA-style response well suited to vocals, bass guitar and individual drums
  - Punchy transient response for kick drums and bass
  - Runs in real-time on Antelope Synergy Core interfaces
