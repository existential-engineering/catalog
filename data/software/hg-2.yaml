description: High-end tube processor that emulates four different vacuum tube
  stages combined in series and parallel circuits. Makes tracks sound richer,
  fuller, louder, bigger, and punchier at the same peak level.
details: |-
  Meet your mix buss' best friend: the black box analog design HG-2. There's
  good reason why celebrated mix engineers like dave pensado, bob horn, and jack
  douglas use the high-end black box analog design HG-2 tube processor on their
  mixes. The boutique stereo processor's multiple, diverse tube circuits not
  only make tracks sound richer and fuller, they also make them sound louder,
  bigger and punchier at the same peak level.

  Brainworx collaborated with black box to model the hg-2's sweet tubes and
  creamy-sounding transformers, and then added a host of powerful digital mods
  to greatly expand the processor's tonal palette and range of saturation-based
  compression.

  Hg-2 emulates four different vacuum tube stages combined in series and
  parallel circuits to color your mix and individual tracks with a wide range of
  rich and varied harmonics. Separate gain controls for emulated 6u8a pentode
  and triode tubes are placed in series between buttery virtual transformers
  warming the plugin's input and output.

  Two virtual 12ax7 tubes—each voiced differently—can be alternately driven in a
  parallel saturation circuit to add tube sheen or blistering overdrive
  distortion to just low or high frequencies or across the entire frequency
  spectrum—great for shaping individual tracks, creative sound design and adding
  energy to full mixes.

  The saturation circuit's output feeds the pentode and triode tubes, giving you
  a massive combined effect that transforms thin, digital tracks into fat analog
  beasts. Drench just the bass and low-midrange frequencies in the saturation
  circuit to grow a beard on a sterile bass track or add massive body and weight
  to a kick drum.
