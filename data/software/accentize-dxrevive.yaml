description: dxRevive intelligently restores dialogue recordings by reducing
  noise, improving clarity and enhancing speech quality in real time.
details: |-
  dxRevive is a versatile speech restoration plugin, dedicated to enriching the
  quality of various dialogue recordings. Unlike many other restoration plugins,
  dxRevive doesn't merely filter the signal. It goes beyond, identifying and
  reintegrating missing frequency components, yielding studio-like recordings
  from diverse source materials.

  The plugin uses a highly optimized neural network trained on a global speech
  database. It is designed for professional audio production and post-processing
  workflows.

  Due to the local execution of advanced neural network algorithms, higher CPU
  usage is expected. For best performance and efficiency, Apple Silicon-based
  systems are recommended.

  Compatible with Pro Tools, Cubase, Nuendo, Reaper, Ableton Live, Logic Pro,
  Adobe Premiere, Final Cut, and DaVinci Resolve.
