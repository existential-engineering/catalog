description: dxRevive intelligently restores dialogue recordings by reducing noise, suppressing reverb, and enhancing speech quality in real time.
details: |-
  dxRevive is a speech restoration plugin dedicated to enriching the quality of dialogue recordings. It removes noise, suppresses reverb, restores frequency content lost in compression or bandwidth-limited sources, and eliminates codec artifacts common in Skype and Zoom recordings.

  The plugin can recover clipped audio, apply spectral corrections, and restore band-limited audio such as phone calls, all processed locally on-device. It handles multiple speakers, languages, and accents through a single-knob workflow.

  Compatible with Pro Tools, Cubase, Nuendo, Reaper, Ableton Live, Logic Pro, Adobe Premiere, Final Cut, and DaVinci Resolve.
