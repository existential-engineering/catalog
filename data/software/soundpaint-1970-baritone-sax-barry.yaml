details: |-
  Bold Baritone Brilliance

  Unleash your inner jazz virtuoso with the 1970 Baritone Sax Barry—an unmatched low-end powerhouse! Soundpaint's Hyper Acoustic Legato (H.A.L) Technology brings true-to-life polyphonic legato to your fingertips, offering seamless realism in every note. Barry boasts an extensive range of deep-sampled parts, including legatos, sustains, staccatos, arcs, runs, drops, scoops, trills, and more, delivering an astonishingly authentic experience. From mellow murmurs to spirited jazziness, play Barry however you want and let H.A.L work its magic. Its versatile articulations allow the Bari Sax to shine in any context. Silky-smooth legatos for soulful solos, burly brassy lines when amped up, and adjustable staccato lengths and marcatos to match any note length using the TIME rack module. Barry's rich sonorous sustains, sultry scoops, and expressive arcs add soulful layers and emotional depth. This robust and agile instrument is the epitome of depth and warmth, effortlessly elevating jazz, funk, R&B, and beyond. Whether anchoring the rhythm or taking center stage with blazing solos, the Bari Sax's unmistakable sound adds character and resonance to your music.
