details: |-
  Dual Tube Mic Preamp with HPF — emulation of the Gyraf Audio G9.

  Variable-gain input tube with a SRPP output stage, designed for flawless analog amplification.

  Comprehensible set of controls including input and output level switches, allowing you to balance both the input and output signals.

  Includes a high pass filter and a phase reverse switch.

  Runs natively in your DAW on macOS or Windows, or in real-time on your Synergy Core interface.

  Included in the Antelope Cosmos subscription (75+ Antelope Native Plugins).
specs: |-
  - Variable-gain input tube
  - SRPP output stage
  - Input level switch
  - Output level switch
  - High pass filter (HPF)
  - Phase reverse switch
