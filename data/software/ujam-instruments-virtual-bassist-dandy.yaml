description: DANDY is your first-call when you need a seasoned professional bassist that is totally present in a mix without ever sounding "shouty" or obnoxious. It lays down ultra-smooth, highly polished basslines without hogging the spotlight or taking up too much room in a mix.
details: |-
  DANDY uses its understated charm to make you sound and feel amazing. A meticulously sampled bass guitar with flat-wound strings has a classy, warm and restrained vintage sound that is markedly different than the more modern and in-your-face ROYAL 2 and ROWDY 2 virtual bassists. However, when paired with the included multi-effects, DANDY effortlessly delivers fantastic tones that sound right at home in both modern and vintage productions.

  DANDY sounds fantastic on any production that needs electric bass, but it's particularly great on Soul, Pop, Blues and Rock tracks. Custom-made DSP algorithms push the raw sound of the bass in many directions from soft, round tones (perfect for vibey old school soul and blues tracks) all the way to bright modern pop and rock.

  Player Mode brings ultra-realistic bass performances into your music even if you don't play the bass or keyboards, with 990 masterfully played phrases in 30 different musical styles that can be easily and seamlessly strung together to create the perfect performance for your song. DANDY automatically follows the key and chord you play and intelligently selects the most musical articulations.

  If you prefer to record your own phrases (or even bass solos), Instrument Mode gives complete access to all articulations, so you can use a MIDI controller to play exactly as you want including dead notes, full stops and slides. The versatility is further expanded with easy-to-use sound shaping options: a variety of amps and effects, a character control, plus EQ and dynamics.
specs: |-
  - World-class vintage bass guitar and player, flat-wound strings
  - 30 styles, 990 phrases and 100 presets
  - 15 Finisher multi-effect modes
  - Player Mode and Instrument Mode
  - MIDI drag and drop
  - Resizable user interface
  - Amp, effect, character, EQ and dynamics controls
  - PreSonus chord and key track support in Studio One 4.6.2 or later (Virtual Bassist 2.1 update)
  - Operating systems: Windows 10 to Windows 11, macOS Catalina (10.15) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 4 GB of RAM
  - 7 GB of disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, 64-bit only
  - Automated installation via UJAM App, or downloadable installer file
  - Authorization via the UJAM App, or email and password within the plug-in
  - Supported standards: MIDI
