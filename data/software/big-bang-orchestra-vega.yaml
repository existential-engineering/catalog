details: |-
  This string section pack brings the realism and artistry of synchron strings
  pro to the big bang orchestra. Bbo: vega is packed with vivid ensemble
  performances, featuring eight acclaimed viola players from the synchron stage
  orchestra who perform frequently on diverse productions from hollywood film
  scores to movie trailers, bbc documentaries and classical recordings.

  The homogeneous, well balanced sound of this cohesive, well-rehearsed viola
  ensemble was captured at synchron stage vienna where the outstanding acoustics
  and our team's engineering know-how yield recordings that effortlessly
  transform your arrangements into organically passionate pieces of music.

  All articulations were taken from synchron strings pro, including short notes
  (bold, agile, fortissimo), long notes with light and strong vibrato
  (blendable) as well as played espressivo, legatos with light and strong
  vibrato as well as with marcato attacks, sforzato, several swells, pizzicatos,
  and tremolos. The included measured tremolos, which are fast note repetitions
  at 120, 130, 140 and 160 bpm, can be synced to the host tempo.

  Bbo: vega also includes our unique soft releases of long notes, where the
  musicians carefully play slightly longer note fade-outs that sound very
  musical without having to use MIDI controllers to shape the ending of a tone.
  The included mixer presets deliver a perfect sound out-of-the-box that
  integrates seamlessly with all the other modules of the big bang orchestra
  series.

  Big bang orchestra: vega supports native instruments' nks format and is
  compatible with komplete kontrol keyboards and maschine. Use the light guide
  to quickly identify key switches and play ranges of your instruments, browse
  and preview sounds, and quickly adapt them using pre-configured control knobs.
