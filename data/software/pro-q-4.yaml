description: FabFilter Pro-Q 4 is a high quality equalizer plug-in with
  unrivalled sound and interface. Available in VST, VST3, AU, CLAP, AAX and
  AudioSuite formats for Windows and macOS.
details: |-
  An equalizer is probably the tool you use most while mixing and mastering, so you need the best of the best. FabFilter Pro-Q 4 delivers with the highest possible sound quality, a very extensive feature set, and a gorgeous, innovative interface with unrivalled ease of use.

  Pro-Q 4 offers everything that a demanding engineer could wish for: top-quality linear phase operation in addition to the zero latency and unique Natural Phase modes, smooth dynamic and spectral EQ, per-band mid/side processing, full surround support (up to Dolby Atmos 9.1.6), an intelligent solo feature, optional Auto Gain and a built-in, fully customizable spectrum analyzer.

  FabFilter Pro-Q 4 is designed to help you achieve your sound in the quickest way possible. Via the large interactive EQ display, you can add or sketch bands where you need them, enable dynamic EQ for any band, and select and edit multiple bands at once. Unique features like Spectrum Grab, Full Screen mode and EQ Match will speed up your workflow even more.

  In Spectral dynamics mode, Pro-Q 4 doesn't change the gain of the whole band, but triggers per specific frequency within a band when it exceeds the threshold, leaving other frequencies untouched. This is a great way of treating varying problem frequencies.

  Work fast and efficiently using the Instance List to view and control any other Pro-Q 4, Pro-C 3, Pro-DS and Pro-G instance in your session from one convenient overview.
specs: |-
  - Highest possible sound quality
  - Up to 24 EQ bands
  - Optional Dynamic EQ mode for all bands with adjustable attack and release
  - Advanced Spectral dynamics processing
  - Full immersive / Dolby Atmos functionality (up to 9.1.6)
  - EQ Sketch: draw the desired EQ curve in one go
  - Continuous slope setting up to 96 dB/oct and ultra-steep Brickwall slope
  - Instance list to view and control any other Pro-Q 4 instance
  - Gorgeous Retina interface with large interactive EQ display
  - Per-band mid/side or left/right processing
  - Zero latency, linear phase, or Natural Phase mode
  - Gentle and Warm Character modes
  - Spectrum Grab
  - EQ Match feature
  - Built-in spectrum analyzer
  - Auto Gain and Gain Scale
  - GPU-powered graphics acceleration
  - Sample-accurate automation of all parameters
  - MIDI Learn
