details: |-
  Bloom Drum Breaks fuses high-energy drum loops, fills and one-shots into a
  dynamic and playable instrument, made to infuse your tracks with rhythmic
  vitality and designed to provide for genres that thrive on rhythm. Whether
  you're looking to add the pulsating grooves of drum and bass, the intricate
  intensity of breakcore, or the laid-back beats of hip-hop, this tool offers a
  gateway to crafting beats with unprecedented ease and versatility.

  With bloom drum breaks, switch between authentic royalty-free loops to concoct
  distinctive rhythms, amplify their impact with extensive modulation, and shape
  them with a suite of drum-focused effect processors. Selecting the perfect
  drum break for your project is now an intuitive, and enjoyable experience,
  offering seamless keyboard control for triggering and tweaking sounds.

  Start in your desired tempo, choose a sample bank or preset, and trigger one
  of 14 bpm-synced drum loops spread across two octaves. White notes set off
  drum samples and loops, while black notes alter properties like playback speed
  and pitch, as well as trigger custom sequences and effect modulation.

  Bloom drum breaks' edit page is your control centre for tailoring its sample
  material, allowing you to tweak, chop and rearrange any of the existing drum
  samples and make them uniquely yours. In the sample edit panel, manipulate how
  the 14 source samples in each bank respond. Adjust sample start and endpoints,
  trigger types, playback direction, and speed. Fine-tune pitch, formant,
  attack, and release, and explore choke groupings for intricate rhythmic
  interactions.

  Make the bloom instrument your own with the ability to drag and drop audio
  files into it. You can do this via the waveform view on the edit page or any
  empty slot on the banks page. Set the key and bpm of your samples to make them
  integrate seamlessly with the bloom engine.
specs: |-
  - 14 sample keys

  - 5 factory modifiers: half-time, double-time, reverse, octave down, octave up

  - 5 custom modifiers

  - 8 sample banks / 112 drum phrases

  - Samples synced to host bpm

  - Key selection

  - Sample randomise

  - 4 macros: digital, lo-fi, slap verb, phaser

  - 5 main fx parameters: saturation, dynamics, noise, lo-cut, hi-cut

  - Global bypass

  - 250 presets

  - Waveform display

  - Playback direction: forwards, backwards, pendulum, loop

  - Playback modes: hold, latch, relative

  - Playback speed: normal, double, half

  - 4 choke groups

  - Start / end markers with snap to grid, snap to transient

  - Sample crossfade, attack, release, pan, volume

  - Sample pitch, fine, formant, pitch warp

  - Sample mode for triggering sequences

  - Fx modulation: saturation, dynamics, noise, lo-cut, hi-cut, pitch, velocity

  - Sample / modulation randomise

  - Phrase rate, sync, swing, steps, latch, beat retrigger controls

  - 3 rearrangable effects: saturation, dynamics, noise

  - Saturation mode: tube, tape, fuzz

  - Saturation parameters: drive, dynamics, mix, feedback amount / frequency,
  tone

  - Dynamics parameters: transient attack / sustain, mix, gate amount,
  compression amount / attack / release

  - 15 noise types: vinyl crackle, cassette & tape static, crowd noise, white
  noise, amp hiss & more

  - Noise mode: constant, dynamic, ducked

  - Noise parameters: level, envelope threshold / release, tone

  - Global lo-cut, hi-cut, tone, dry, wet






  - Macos 10.15 or higher

  - Intel / native apple silicon supported

  - Windows 7 or higher

  - 64-bit compatible only

  - Daws supported: ableton live, pro tools, logic pro, fl studio, cubase,
  nuendo, reaper, reason + more

  - Internet connection required for software authorisation
