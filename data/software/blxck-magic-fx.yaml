details: |-
  Blxck magic is a free dark, experimental FX plugin built for a streamlined
  workflow. It packs 16 effect engines controlled by macro-style buttons,
  letting textures shift from subtle warmth to full distortion in seconds.

  Hit randomize to instantly generate unpredictable combinations—perfect for
  sound design, transitions, and eerie atmospheres.

  Designed to stay simple on the surface but deep in character, blxck magic
  turns clean audio into something raw, cinematic, and alive.

  Output controls the final output level. Mix blends the processed signal with
  the dry input. Randomize generates new effect combinations.

  Button 1 a simple lowpass filter. Button 2 a deeper lowpass filter. Button 3 a
  phaser and stereo spreader hybrid. Button 4 pitch-shifts the signal up 12
  semitones. Button 5 reverb and delay hybrid for space. Button 6 hybrid phaser
  with a subtle sweep. Button 7 constant tremolo + chorus. Button 8 highpass
  stutter effect for rhythmic cuts and motion. Button 9 choppy pitch-down effect
  at 12 semitones. Button 10 drive distortion. Button 11 small-space reverb for
  tight, subtle ambience. Button 12 detuned widener for stereo thickness. Button
  13 slow filter sweep. Button 14 bandpass filter. Button 15 heavy distortion.
  Button 16 infinite reverb for drones, swells, and atmospheric tails.
