description: Action Strikes delivers high-impact, cinematic percussion with ultimate playability. It contains hundreds of timeless rhythms, adaptable for any project.
details: |-
  ACTION STRIKES is an instrument for huge cinematic percussion, built around 12 carefully-assembled ensembles suited to anywhere the sound of a live orchestra is needed. Each ensemble has its own character, and the high, middle and low sections of any ensemble can be mixed and matched with any other, giving over 1,700 unique sonic combinations. Alongside the ensembles are 65 single instruments and 12 compiled Hit Sets, all exclusively recorded.

  The instrument puts a live percussion ensemble under the player's direction. Rhythms change on the fly through key switches, with the left hand controlling accents while the right hand chooses variations. The mod wheel takes the performance from a light rumble to a thundering crescendo and back, the pitch wheel adjusts accent strength, and fills, rolls and flams can be played on top of an arrangement in real time.

  Rather than working as a loop library, ACTION STRIKES lets 105 time-tested rhythms be freely combined into original arrangements, each with five variations per ensemble section. The 65 single instruments carry 32 playable rhythms, and 12 playable sets of single hits round out the content, so arrangements can range from simple accompaniment to a full percussive assault.

  Sonuscore sells the library as a download and offers crossgrade pricing for owners of Action Woodwinds or Action Strings 2. It is part of the ACTION Series.
specs: |-
  - 12 carefully-assembled ensembles plus 65 single instruments
  - 12 carefully-compiled Hit Sets
  - Over 1,700 unique sonic combinations from mixing high, middle and low ensemble sections
  - 105 time-tested rhythms, each with five variations per ensemble section
  - 32 playable rhythms for the single instruments
  - 12 playable sets of single hits
  - Real-time control: key switches for accents and variations, mod wheel for dynamics, pitch wheel for accent strength
  - Playable fills, rolls and flams over an arrangement
  - Available as: DOWNLOAD
