details: |-
  BOLD | a sample instrument is the first instrument from Shout Audio with
  sounds by producers dresage and bad snacks. Illustrated by ruby taylor. Both
  simple and inspiring to use. With enough sounds and variety to produce a whole
  track.

  Lovingly built from over 350 hand crafted samples. Over 600mb of content. 24
  presets from drums, bass, keys, fx, and vocals.

  Built-in effects with drive, delay, reverb, and stereo width. Vst2 & audiounit
  on mac. Vst2 on windows.

  Bold | a sample instrument by shout audio is a virtual instrument audio plugin
  for macos and windows. It functions as a VST plugin and an audio units plugin.

  Our products are always free for non-profits dedicated to the music education
  of young people.
