description: Softube Echoes mastering and mixing plugin offers a rich sonic
  palette of musical, rhythmic, and stereo delay sounds. This effects plugin
  features serious adjustability options, sweeping visualizations, comprehensive
  presets, and six distinct modes to play with.
details: |-
  Help yourself to a rich sonic palette of musical and rhythmic stereo delay sounds. Plunge into the depths of delay design with serious adjustability options and intuitive visualizations. Play with presets that cover the most common delay uses in modern productions. Paint with the colors of six distinct modes, from classic Tape sounds to gritty BBD delays. Echoes invites you to explore, experiment, and go deep.

  Echoes' comprehensive preset collection is designed to cover most delay needs within your productions. Any one of the presets can be used as a starting point to explore all of Echoes' different modes. The X and Y axes on the Echoes interface offer a visual representation of the taps in the stereo field. You can load a preset and then go deeper by simply moving the echoes around and experimenting to find your perfect delay sound.

  Echoes features six different modes that provide you with a variety of colors to choose from: Filter is a normal delay mode with filtered feedback that's perfect for vocals. Utilizing the echo taps to provide an algorithmic reverb effect, Reverb mode is great for synths and guitars. BBD, or Bucket Brigade Device, is the technology behind those famous warm-sounding stompboxes from the 70s, complete with the desired aliasing artifacts. Based on tape echo machines immortalized by countless records, Tape mode is a classic sound on vocals and allows users to control drive, dirt, and wobble. Pan widens mono sources and adds movement to static sounds, such as a sustained keyboard. Excellent for getting creative, the dirty degradation Lo-fi mode combines bit crushing and modeled synth 4-pole filtering.

  Echoes is outfitted with parameters that let you tweak your sound to perfection. You can adjust time in milliseconds or sync it to your DAW tempo and set the amount of Feedback you want. (To ensure your repeats never exceed -6 dB, a feedback limiter is included.) And you'll never have your vocals obscured by your delay again. By adjusting the threshold in the built-in ducking feature, most echoes are ducked under the vocals, and you get the full sound of the echo trail off at the end of each verse. The Output section lets you widen your stereo image, collapse low frequencies to mono, or filter your echoes to fit your track perfectly.

  Echoes was built on this legacy of creativity, passion, and obsession with details. Because to create tools that innovate and elevate, you have to have heart, soul, and Rock & Roll Science.
specs: |-
  - Musical and rhythmic stereo delay sounds
  - Presets to cover most delay needs within a production
  - Six delay types: Filter, Reverb, BBD, Tape, Pan, and Lo-fi
  - Intuitive visualizations and easy workflow
  - Automatic feedback limiting
  - Built-in ducking compressor and output filters
  - Supports Softube Extended Features panels
  - X and Y axes give a visual representation of the taps in the stereo field
  - Delay time adjustable in milliseconds or synced to DAW tempo
  - Feedback limiter keeps repeats from exceeding -6 dB
  - Output section for stereo widening, low-frequency mono collapse and filtering
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Three activations included
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
