description: Perception AB instantly and automatically matches the level of the music you're listening to, allowing you to hear past the 'loudness deception' and make clear, real-world decisions about the best possible sound for your music. It enables level-matched A/B comparisons of entire processing chains for mixing and mastering.
details: |-
  Perception AB is a level-matched A/B comparison plugin designed to eliminate loudness bias in mixing and mastering decisions. It automatically matches the loudness of your signal so you can make accurate before/after comparisons without being deceived by volume differences.

  The plugin allows you to bypass entire processing chains — including EQ, compression, limiting, and other effects — while maintaining matched loudness levels. This enables honest evaluation of whether processing is actually improving the sound or simply making it louder.

  Perception AB includes plugin delay compensation and can be inserted in bulk across multiple channels. It supports both mixing and mastering workflows, and can also compare reference tracks at streaming delivery levels.

  The plugin has received recognition from major industry publications, including Sound on Sound Magazine, MusicTech Magazine Excellence Award, and Audio Media Gear of the Year 2014.
specs: |-
  - Automatic loudness level matching for accurate A/B comparisons
  - Plugin delay compensation
  - Bypass entire processing chains with a single click
  - A/B test EQ, compression, limiting, and more
  - Multiple loudness matching modes
  - Bulk insertion capability across multiple channels
  - Reference track comparison at streaming levels
  - macOS 10.7 or later (64-bit Intel or Apple Silicon)
  - Windows XP SP3 or later (32/64-bit)
