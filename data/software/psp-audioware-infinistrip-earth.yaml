description: PSP InfiniStrip is an infinitely configurable channel strip plug-in offering 30+ unique processors across 8 module types — preamps, filters, compressors, equalizers, limiters, dynamic modules, control, and special processors — arranged across 7 dedicated slots plus 2 flexible insert slots. Features zero-latency processing, intelligent parameter matching when swapping modules, three view modes, external side-chain support, and 250+ presets.
details: |-
  PSP InfiniStrip Earth (v1.4.0) includes 30+ processors: preamps (Gain, Pre 60s, Pre 70s, Pre 80s, ADC 90s), filters, compressors (Opto, FET, VCA, oldTimer variants), equalizers (ChannelQ, PreQursor, RetroQ), limiters (VCA, Opto, BrickWall, Saturator), and special modules including Levelizer, SnapForger, TiltEQ, Enhancer, and BigBass. Mono and stereo versions included. Licensing via iLok License Manager (no hardware dongle required), up to 3 activations. 30-day trial available.
specs: |-
  - Platforms: Windows 7-11 (64-bit), macOS 10.14-14 (Intel and Apple Silicon, 64-bit)
  - Formats (macOS): AU, VST, VST3, AAX
  - Formats (Windows): VST, VST3, AAX
  - Processing: Zero-latency
  - Slots: 7 dedicated + 2 flexible insert slots
  - Processors: 30+ unique across 8 module types
  - Presets: 250+ factory presets
