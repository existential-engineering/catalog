description: PSP InfiniStrip is an infinitely configurable channel strip plug-in offering 30+ unique processors across 8 module types (preamps, filters, compressors, equalizers, limiters, dynamic modules, control, and special processors) arranged across 7 dedicated slots plus 2 flexible insert slots. Features zero-latency processing, intelligent parameter matching when swapping modules, three view modes, external side-chain support, and 250+ presets.
details: |-
  PSP InfiniStrip is an infinitely configurable channel strip plug-in based on PSP's 20 years of experience in developing handcrafted plug-ins for tracking, mixing and mastering. It can be used for mixing, tracking, or live streaming and broadcasting, anywhere a great sounding and easy to configure channel strip is needed without latency concerns.

  PSP InfiniStrip is part of PSP's series of Zero Latency Processing plug-ins, making it ideal for situations such as live monitoring, live broadcast production, and use while tracking.

  The Earth Edition (1.4.0) adds 5 new modules: Levelizer, a level-rider type module, suggested for controlling track level in a fader-like manner or using EXT side-chain mode to operate relative to an external signal such as the mix. SnapForger, a transient and decay controller, suggested for emphasizing or softening transients, lengthening or shortening decay, making drums punchier or more distant, and reducing or exaggerating room response. TiltEQ, a tilt and contour (loudness) processor, suggested for shaping overall tonal balance and spectral character and adjusting lows and highs relative to the midrange. Enhancer, a dynamic low- and high-frequency processor, suggested for psychoacoustic enhancement of low and high bands in quieter sections without harshness or overload in louder parts. BigBass, a sub-bass synthesizer, suggested for extending the low end or precisely controlling very low frequencies when extra sub-bass is needed, or when the original signal lacks weight.

  The module list spans eight types. Preamps: Gain (pure gain with automated gain adjustment), Pre 60s (valve type of preamp emulation), Pre 70s (discrete preamp with a transformer), Pre 80s (discrete transformerless preamp) and ADC 90s (12 bit nonlinear analog to digital converter). Filters: Basic Filters, Pro Filters and S.C.Filters. Gate/Expander/Ducker: Expander, Gate and Ducker, each with built in side chain filters and optional external side chain input. Compressors: Opto Pressor, FET Pressor, VCA Pressor and old Timer. Equalizers: ChannelQ, PreQursor and RetroQ. Limiters: VCA Lim, Opto Lim, BrickWall and Saturator. Control: Master Control (fader, width, balance and meter). Special: De-esser, De-hummer, ReactivEQ, Levelizer, SnapForger, TiltEQ, Enhancer and BigBass.

  Running PSP InfiniStrip in 30-day trial mode or activating it requires an iLok user ID, which can be created for free at www.ilok.com, and the free iLok License Manager application, but no hardware dongle. The license can be activated in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above).
specs: |-
  - 30+ unique processors divided into 8 types of modules (preamps, filters, compressors, equalisers, limiters, dynamic modules [expander, ducker and gate], control and special modules) for building a custom channel strip
  - 7 dedicated "slots" taking one module from each type of processing module, and 2 flexible insert slots for any module type
  - Intelligent parameter matching, swapping between different compressors or EQs without touching a knob to find a preferred colour and flavour
  - 3 different view modes (full, resizeable, and mini view mode) designed for different workflows and screen sizes
  - External side-chain support for each module
  - Includes both Mono and Stereo plug-in versions for different track types
  - Zero latency processing
  - Over 250 presets designed by top sound engineers from around the world
  - Windows 7 - Windows 11, 64-bit VST, VST3 and AAX compatible applications (AAX: Pro Tools 11, 12, Pro Tools HD 11, 12 or Pro Tools Ultimate)
  - macOS 10.14 - macOS 14 Sonoma (Intel or Silicon), 64-bit AudioUnit, VST, VST3 and AAX compatible host applications
  - Requires a free iLok user ID and the iLok License Manager application, no hardware dongle needed
  - License activatable in 3 separate locations, each either a computer or an iLok dongle (2nd generation or above)
