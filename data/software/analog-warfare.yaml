details: |-
  Analog Warfare by Angular Momentum is a virtual instrument audio plugin for
  Windows. It functions as a VST plugin and is categorized as a synth (hybrid)
  with FM synthesis, phase distortion, and semi modular capabilities.

  The sound quality is simply fantastic, right up there with many of the
  commercial softsynths. The built-in step sequencer for arpeggios is a great
  feature, and it's dead simple to use. The presets definitely show that analog
  warfare is capable of a very wide variety of sounds and textures.

  Analog warfare would be very useful for musicians working in any number of
  genres. You can get 70s-style bass synths out of it, acid-type leads, and
  really nice ambient pads as well. The arpeggiator allows you to quickly put
  together a rhythmic bed for your song.

  The ui is lovely to look at and fairly straightforward to understand. The one
  thing that might be wished for is a comprehensive user's guide, as analog
  warfare is very powerful and very flexible.
specs: |-
  - 2 standard modelled oscillators
  - 1 phase distortion modelled oscillator
  - 2 ring modulators (osc ab and bc)
  - 3 independent clippers
  - 3 independent amp envelopes
  - 3 independent sv filters with crossmix
  - 3 independent filter envelopes
  - 1 modulator envelope
  - 1 frequency modulation envelope module
  - 1 modulator with 78 destinations
  - 2 bpm synced LFOs with 2x78 destinations
  - 234 routing options
  - 2 bpm synced filter delays with auto-panning and auto-crossing
  - Stereo chorus l/r
  - CV/groove sequencer
  - 1 phrase arpeggiator with groove control
  - 4 panels (effects / arpeggiator-CV / groovesettings / miscellaneous / about)
  - 64 standard editable patches
  - Windows compatible
