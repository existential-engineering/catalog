description: Cataract 2 is a segment multiplexer plugin that uses dual sample scanners to dynamically scan and crossfade between segments across multiple audio files, enabling complex glitch and granular-style textures. Dedicated scan, effects, and global parameter sequencers give precise control over how audio segments are selected, filtered, and processed over time.
details: |-
  Dual Sample Scanner Modules
  XMOD Crossfade/Morph Module
  Global Parameter Sequencer
  Scan Sequencers and Effects Sequencers
  FX Module with Dedicated Sequencer
  Multi-Mode Filter & Delay
  Extensive Randomization Tools
  Redesigned Scalable Interface
  100 Factory Presets
  Curated Sample Bank
