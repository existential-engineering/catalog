description: "Plugin sampler instrument based on the E-mu SP-1200, emulating the
  characteristic gritty 12-bit digital sound of the landmark 1987 hardware
  sampler. Features 32 sample slots across 4 banks of 8 pads, SSM2044 low-pass
  filter emulation, 8 assignable outputs, chromatic play mode, and a
  non-destructive visual sample editor. Includes 900+ factory samples in 50
  presets."
details: |-
  12-bit, 26.041 kHz sample rate

  4 banks of 8 pads

  900+ samples in 50 presets

  Ambient Collection
  Drum & Bass Collection

  ~300 MB

  64-bit
specs: |-
  - filter: SSM2044 4-pole resonant low-pass (switchable)
  - outputs: 8 assignable outputs
  - sampleLength: Unrestricted
  - playback: Stereo and mono
  - Tune/decay/mix controls
  - Panning knobs in Mix mode
  - Chromatic play mode
  - Non-destructive visual sample editor
  - Fade in/out markers
  - Speed feature for lo-fi pitch shifting
  - windows: Windows 10+, 64-bit
  - mac: macOS 10.11+, Intel & Apple Silicon
  - linux: 64-bit, VST2/VST3 only
