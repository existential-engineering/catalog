description: TAL-Dub-3 is an easy to use delay device with its own distinctive
  character — not a tape delay emulation. Features an alias-free saturation
  stage, a non-linear 6dB low pass and 3dB high pass filter in the feedback
  path, an input drive knob for saturation level, and a tap tempo button for
  live use.
