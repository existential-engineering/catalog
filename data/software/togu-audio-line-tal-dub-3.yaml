description: TAL-DUB-III is an easy to use delay device with some special features. Its no tape delay emulation and has its own sound, with an alias free saturation stage and a non-linear 6dB low pass and 3dB high pass filter included in the feedback path of the device.
details: |-
  TAL-Dub-3 is described on the page as an easy to use delay device with some special features. It is explicitly not a tape delay emulation and has its own sound.

  It has an alias free saturation stage, plus a non-linear 6dB low pass and a 3dB high pass filter that are included in the feedback path of the device. An input drive knob adjusts the saturation level.

  Pop-up menus show the current values of the volume, delay-time and feedback knobs, and a tab button allows the delay time to be adjusted for live sessions.

  Downloads are offered as a Windows 32-bit VST, a Windows 64-bit VST, an OSX 32-bit VST and an OSX 32-bit Audio Unit. No installer, Linux build, VST3, AAX or CLAP version is offered.

  TAL lists this page under the 'Deprecated Plug-Ins (not supported)' heading on its products page, so the plugin is no longer supported by the manufacturer. The stated OSX requirement (32-bit host, macOS below 10.10) means it cannot run on current macOS versions.

  The page shows no price and no purchase path for TAL-Dub-3, only direct download archives.
specs: |-
  - Easy to use delay device; not a tape delay emulation, with its own sound
  - Alias free saturation stage
  - Non-linear 6dB low pass filter and 3dB high pass filter in the feedback path
  - Input drive knob to adjust the saturation level
  - Pop-up menus showing current values of volume, delay-time and feedback knobs
  - Tab button to adjust the delay time for live sessions
  - Plug-in formats: VST (Windows 32-bit and 64-bit), VST (OSX 32-bit), Audio Unit (OSX 32-bit)
  - Windows: Windows XP or higher (32 / 64 bit)
  - OSX: 10.6 and < 10.10 (32 bit Host)
