description: TAL-DUB-III is an easy to use delay device with some special features. It's no tape delay emulation and has its own sound, with an alias free saturation stage and a non-linear 6dB low pass and 3dB high pass filter included in the feedback path of the device.
details: |-
  TAL-Dub-3 is an easy to use delay device with some special features. It is explicitly not a tape delay emulation and has its own sound.

  It has an alias free saturation stage, plus a non-linear 6dB low pass and a 3dB high pass filter that are included in the feedback path of the device. An input drive knob adjusts the saturation level.

  Pop-up menus show the current values of the volume, delay-time and feedback knobs, and a tab button allows the delay time to be adjusted for live sessions.

  It was released as a Windows 32-bit VST, a Windows 64-bit VST, an OSX 32-bit VST and an OSX 32-bit Audio Unit. No installer, Linux build, VST3, AAX or CLAP version exists.

  TAL lists the Dub plug-ins under "Deprecated Plug-Ins (not supported)", so TAL-Dub-3 is no longer supported. The OSX builds need a 32-bit host on macOS below 10.10, so they cannot run on current macOS. It remains a free download.
specs: |-
  - Easy to use delay device; not a tape delay emulation, with its own sound
  - Alias free saturation stage
  - Non-linear 6dB low pass filter and 3dB high pass filter in the feedback path
  - Input drive knob to adjust the saturation level
  - Pop-up menus showing current values of volume, delay-time and feedback knobs
  - Tab button to adjust the delay time for live sessions
  - Plug-in formats: VST (Windows 32-bit and 64-bit), VST (OSX 32-bit), Audio Unit (OSX 32-bit)
  - Windows: Windows XP or higher (32 / 64 bit)
  - OSX: 10.6 and < 10.10 (32 bit Host)
