details: |-
  Bitwig Studio Producer is an audio plugin host for macOS, Windows and Linux.
  It can host VST plugins, VST 3 plugins and CLAP plugins.

  Explore bitwig studio with professional tools for studio, stage, and beyond.
  For macos, windows, and linux. 92 instruments, audio & note fx, and more.
  Includes devices in essentials and more (e.g. Polysynth, delay-4, and
  humanize).

  Advanced modulation system with 18 modulators. Extended library of sounds,
  loops, and presets. Unlimited audio, instrument, and hybrid tracks and scenes.

  Unlimited VST/clap plug-ins with full sidechain and multi-out options.
  Professional editing and arranging tools, plus layered editing. Slice to drum
  machine / sampler. 3 audio-stretching algorithms.

  Native hardware integration with MIDI/CV compatibility, plus full mpe support
  and multitouch integration. 8 display profiles for up to 3 screens. Unlimited
  audio I/o busses. Open multiple projects at a time to drag-and-drop between
  tabs. Audio comping in the arranger and in the clip launcher.
