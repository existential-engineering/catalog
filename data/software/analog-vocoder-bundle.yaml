details: >-
  Analog vocoder bundle by xils-lab includes xils 5000 and xils 201 vocoder, two
  emulations of the finest vocoder ever created available in a single license.
  Inspired by the ems flagship vocoder (ems 5000 -1976- probably the most
  complex and powerful analog vocoder ever built), xils-lab used his knowledge
  acquired during the emulation of both the vcs3 synthesizer and the vp300
  vocoderplus to develop the xils vocoder 5000 model.


  A vocoder is a synthesizer which accepts an external sound source, a musical
  instrument or prerecorded signal, so that you can process it, with or without
  the keyboard, into a huge variety of sounds. Human voice, the most variable
  sound of all, can be fed into the vocoder, so that you can alter its pitch,
  tone, vibrato, and all its characteristics, allowing you to synthetize a choir
  from a single voice, or to create melodies from ordinary speech. You can also
  process drums, percussive elements, or guitars and every kind of synthesizer
  itself, to breathe some analog life into them, or completely reshape them.


  The xils vocoder 5000 emulates the sophisticated filtering techniques and
  incredibly complex circuitry of its analog counterpart to achieve the same
  organic sound, precision and clarity. The vocoder 5000 can speak a perfectly
  clear and understandable english, or german as well as japanese. The user
  interface offers a standard single panel view with a lot of presets to get you
  started, and advanced panels displaying the advanced parameters of the module
  of the vocoder 5000 you wish to explore and experiment with.


  Because it's a xils, it offers many advanced features that its ancestor could
  not have offered in its time: we added bands number, filter types, filter's
  emphasis and emphasis ponderation, more slew rate mods, more freeze mods, 2
  lfos (original had none), detailed fm and pwm, more oscillators waveforms, an
  improved input detector (sibilants), gate input. You can also populate the
  matrix by freely drawing lines, and it has its own presets.


  The x201 vocoder was modeled after an ultra rare, ultra pricey (even at the
  time of its release), vocoder unit, whose intelligibility has never been
  surpassed. Each of its two filter banks offer 20 frequency bands. Each filter
  bank can process the incoming signal (usually voice, but any other signal,
  including drums, can be processed), or the carrier signal. You can use the
  internal analog synthesizer as a carrier, which immediately gives the x201 its
  characteristic and recognisable sound. Any other incoming signal can also be
  used, like an external synthesizer, another voice etc.
