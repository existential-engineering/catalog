description: The API® dynamics and EQ sections that are favorites for creating
  professional-sounding drums, guitars, synths and more with attitude and
  presence.
details: |-
  Harness the tight, rich and punchy tone of the best American-made consoles. There's a tight and powerful sound to API consoles, preamps and EQs that have made them some of the world's favorites for creating professional-sounding drums, guitars, synths and more with attitude and presence. Thanks to Brainworx's Tolerance Modeling Technology, you can now access the most convincing model of these classic consoles ever, including the slight channel-to-channel variances in the values of their analog components.

  A lunchbox full of choices. The Lindell 50 Series does more than just model a single console. It provides you with an array of choices in the dynamics and EQ sections, allowing you to swap in your favorite style of these classic 500-series modules. Use them on busses or individual tracks.

  Three classic EQs. Choose between the semi-parametric 50A EQ for three-band processing, the 50B for four bands, and the 60 for a precision graphic EQ for radically reshaping sounds in a way that's as transparent and flexible as it is fun.

  Two amazing compressors. The VCA compressor models API's high end 2500 series compressor, with additional controls to improve upon the original. Meanwhile the included FET compressor provides a unique Lindell Audio design inspired by some of the best FET compressors made, coupled with the tone, simplicity and ease of use of the original 500 series.

  Legal disclaimer: The Lindell Audio 50 Series plugin was developed by Brainworx and Lindell Audio using their own modeling techniques, studying original products from API®. The names 500-series, API, 2500 are trademarks of Automated Processes, Inc. which is unaffiliated with Brainworx. Automated Processes, Inc. has not licensed any intellectual property for use in the Lindell Audio 50 Series, nor have they endorsed or supported the 50 Series in any manner.
specs: |-
  - 72 different TMT Channel emulations in one plugin, just like a real console
  - TMT, Brainworx patent-registered Tolerance Modeling Technology (US Patent No. 10,725,727)
  - Switch between 3 different EQs modeled after the most popular 500-series lunchbox designs
  - Switch between 2 different compressors, VCA and FET
  - Emulation of classic API noise gate and expander
  - Captures the full, tight and punchy tone of the classic API preamps, with automatic gain compensation
  - Continuously variable THD and Virtual Gain controls to add colorful saturation and/or simulated analog noise independently or globally
  - Scalable UI to adapt to your screen size and workflow
  - Loaded with plenty of useful presets to give you a starting place for finding your sound
  - Supported plugin formats: AAX AudioSuite, AAX Native, AU, VST2, VST3
  - Supported operating systems: macOS 26 down to macOS 13, Windows 11 down to Windows 10
  - Mac: Intel, or Apple Silicon
  - PC: x64-compatible CPU
  - Display resolution: 1440 x 900px or 1280 x 960px or higher
  - Memory: 2 GB RAM
