description: Don't be fooled by the name. It's not an only delay unit. It's a
  delay - chorus - reverb – lofi processor combination.
details: |-
  Don't be fooled by the name. It's not an only delay unit. It's a delay - chorus - reverb lofi processor combination. As you can see, totally 4 in 1. We have designed Action Delay with this reasons: full power simplicity creativity.

  You can combine built-in processors with delay section, so you will be able to produce creative delay effects with an easy & fun way. We've simplified controls. Every parameter designed carefully to give the shortest and the most varied result. So you won't get drowned in dozens of parameters.

  We've designed a very strong and hd quality built-in reverb to glue your delayed & dry signals together. There are top 3 reverb types that you can choose and go quickly - easily, just in seconds. In most cases you won't need to use an extra reverb fx.

  Lo-fi degrade parameter can make you get addicted to giving extra harmonics on your delays. It can be used for creative - experimental sound fx too.

  Classic tape delay, ping pong delay, wide stereo sync delay, haas effect, long sequenced delays, experimental psychedelic sound design effects are on your fingertips now.
