details: |-
  Audio Hijack by Rogue Amoeba is an audio plugin host for macOS. It can host
  Audio Units plugins.

  Record any audio, with audio hijack. Save audio from applications like itunes,
  skype or safari, or from hardware devices like microphones and mixers.

  The program supports recording from multiple sources simultaneously,
  functioning essentially as a multi-track recorder, and can be used for
  capturing interviews, stripping audio from streams, and recording
  sound-design/manipulation sessions.
specs: |-
  - Audio plugin host
  - Audio Units (AU) support
  - macOS compatible
  - Multi-track recording capability
  - Audio recording from applications
  - Audio recording from hardware devices
