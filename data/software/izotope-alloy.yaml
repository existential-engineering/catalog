details: |-
  Alloy provides key sound shaping effects for your tracks and busses, bringing
  them to life with six processors designed to give character to every element
  of your mix: equalizer, dynamics, exciter, de-esser, transient shaper and
  limiter.

  Alloy's powerful 8-band eq offers precise controls and a large spectrum
  overlay to give you good visual feedback. Enter eq settings visually or with
  precise numerical values. Choose from low shelf, high shelf, peak, lowpass,
  sharp lowpass, highpass and sharp highpass modes for each band.
  Soft-saturation emulates analog eqs for a natural sound when pushed hard.
  Alt-click and use your mouse to solo and zero in on problem frequencies.

  Alloy's exciter features new harmonic scaling technology that lets you add
  gentle saturation to your tracks by emulating the sounds of tube pre-amps,
  tape, and other hardware devices in a unique new way. Blend between different
  harmonic profiles including tube, tape, transistor and more with an xy pad.
  Switch to multiband mode to apply color to different frequency ranges
  independently. Unique spectrum meter shows you which frequencies are being
  affected by the exciter. Integrated stereo width control allows you to narrow
  or widen different frequency bands.

  Alloy's dynamics module combines the best characteristics of analog and
  digital compressors. Vintage mode combines a forgiving multi-stage release
  curve with program dependent characteristics; digital mode provides clean,
  linear compression. Gate/expander provides gating and even upward compression
  effects. Sidechaining lets you trigger the compressor or gate from external
  sources even to individual frequency bands in multiband mode. Cross-chaining
  lets you trigger dynamics processes on one band with audio from another, for
  completely new gating and ducking possibilities. Two dynamics stages for
  parallel compression effects.

  Macropresets customize alloy's display to show you just the sliders and meters
  you need for the task at hand, giving you powerful preset signal chains with
  simple controls. Over 150 presets included covering individual instruments,
  ensembles, busses, utility tasks, broadcasting & podcasting, post production
  and more. Create or customize your own macropresets that show custom
  configurations of controls in alloy's macro screen.
