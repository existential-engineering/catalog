description: dxRevive Pro adds multiple restoration algorithms, Spectral Focus mode, and per-band bypass controls to dxRevive's dialogue restoration engine.
details: |-
  dxRevive Pro extends dxRevive with multiple selectable algorithms (Studio Sound, Natural Sound, Retain Character, EQ Restore, Studio2, Studio3, Natural2) so engineers can tailor restoration to the source material.

  A Spectral Focus mode allows fine-tuning by frequency range, dedicated presets cover common scenarios like phone and low-end restoration, and quick A/B comparison plus individual per-band bypass buttons speed up the workflow.

  Compatible with Pro Tools, Cubase, Nuendo, Reaper, Ableton Live, Logic Pro, Adobe Premiere, Final Cut, and DaVinci Resolve.
