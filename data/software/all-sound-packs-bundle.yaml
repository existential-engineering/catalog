details: >-
  All sound packs bundle by zendaw is a virtual instrument audio plugin and a
  mobile audio app and soundware (samples or presets that load into other
  products) for macos, windows, linux and ios. It functions as a VST plugin, an
  audio units plugin, a VST 3 plugin, an AAX plugin and a rack extension plugin.


  The bundle includes 21 packs with a full value of $787, offering over 50%
  savings. Included instruments and sound packs: blue swells (all versions),
  lofi tool box 1, prismic, remembrance, memories ahead, emulator 1 organ,
  elorea, elysea, and recollection.


  Blue swells is available in multiple formats: ni kontakt, arturia emulator ii
  v and analog lab v, emu systems emulator three (eiii), emu systems emulator
  three (eiv), korg wavestate and wavestate native with modwave compatibility,
  reason studios mimic creative sampler, and wav files for any sampler or music
  software.


  Lofi tool box 1 includes wav & rex files and reason refill format, created in
  collaboration with planet earth studios. Remembrance features reason studios
  grain sample manipulator functionality.


  Sampling and sound design by stéphane horeczko. Gui design and programming by
  stéphane horeczko. Custom kontakt graphical user interface (gui) for blue
  swells by rawl gelinas. Custom kontakt graphical user interface (gui) for
  prismic by stephen o'connel from cmd shift new.
