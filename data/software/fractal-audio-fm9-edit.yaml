details: |-
  FM9-Edit is a full-featured Mac/PC editor. You can create, view, edit, and manage presets and scenes, and much, much more.

  While almost every aspect of the FM9 can be edited easily using the intuitive front panel controls, nothing is faster than working on a large monitor with a keyboard and mouse/touchpad.

  View entire presets at a glance, edit blocks and parameters, copy/paste, drag and drop, and more. Speed your workflow with Templates, or use the Library to access favorite settings in one click. Easily set up all aspects of onboard footswitches or a connected FC Controller.

  Unlock the full creative potential of your FM9 with FM9-Edit, available below for free. Version 1.03.22 is dated August 25, 2026, and is offered as a Mac build and a Windows build, with a separate 32-bit Windows build also available.
specs: |-
  - Free companion editor and librarian for the FM9
  - View entire presets at a glance and edit blocks and parameters
  - Copy/paste and drag and drop between presets and scenes
  - Templates and a Library for one-click recall of favorite settings
  - Configures onboard footswitches and a connected FC Controller
  - Mac build requires Mac OS 10.13 or newer and is compatible with Intel and M1 processors
  - Windows build requires Windows 10 or newer (64-bit only); a 32-bit build is also offered
