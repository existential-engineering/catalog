details: |-
  Booteq is a classic EQ and preamplifier combination. With four independent
  parametric EQ bands, it offers well selected and musical sounding EQ curves
  with both asymmetric and proportional curve behaviour.

  The unit offers elegant audio colouration capabilities with a dedicated preamp
  stage capable of adding harmonic overtones as well as pleasant tube and
  transformer based saturation effects.

  In its 4th incarnation, the performance of all eqs and filters has been
  improved and further options has been added.

  Booteq mkiv features authentic audio transformer circuitry in the preamplifier
  stage and the signal saturation effects can now be adjusted not only
  continuously, but also fully volume-compensated.

  The update adds vst3 support and also includes bug fixes and a revised manual
  is now available online.
specs: |-
  - Four independent parametric EQ bands
  - Asymmetric and proportional curve behaviour
  - Authentic audio transformer circuitry
  - Harmonic overtones
  - Tube and transformer based saturation effects
  - Volume-compensated signal saturation
  - Windows compatible
