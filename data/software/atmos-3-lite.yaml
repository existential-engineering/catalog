details: |-
  Atmos 3 Lite is a free cinematic ambient piano, with 2 layers of sound with
  adjustable level, one layer of acoustic piano sound recorded from a Yamaha c3
  and another layer of sound pads created from the same original samples, using
  various digital processing such as reverbs, morphing and structural effects
  among others.

  Atmos 3 lite is aimed at all popular genres such as ambient, pop, hip hop,
  trap, edm, house, but also for cinematic production, filmmakers, and sound
  designers.

  Atmos 3 lite is available in VST/vst3/AU plugin formats for windows and mac
  (64-bit).

  System requirements on windows: windows 8.1/10/11, 600 mb disk space, 400 mb
  ram, VST/vst3 host 64-bit.

  System requirements on macos: macos 10.14 and above, 600 mb disk space, 400 mb
  ram, AU/VST/vst3 host (64-bit).
specs: |-
  - 2 layers
  - 6 multi-sampled piano presets
  - LFO modulation controls
  - Lowpass/highpass filter cutoff
  - ADSR envelope controls
  - Built-in chorus
  - Built-in delay
  - Windows & mac
  - 64-bit
  - 100% royalty free
  - Sample based rompler
