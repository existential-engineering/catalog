details: |-
  A new approach to sound design. We created spectral models (violas, woodwinds,
  vintage synths, electric pianos, guitar, basses, etc) for acoustic instruments
  to be accessed via additive synthesis. Akoustic gives you a very precise and
  obsessive way to create new sounds, allowing you to tweak every partial in a
  detailed way. Envelope, tuning, offset or gain for any partial are accessible
  individually. This gives you an unmatched detailed editing power.

  Akoustic is fully based on spectral modeling, it recreates organic sounds by
  additive and spectral synthesis. No samples are needed, we just included the
  spectrum dna for each instrument. This allows to edit elements that makes
  timbres recognizable and unique (harmonic and inharmonic partials).

  Akoustic will allow you to touch every single detail of a sound. From partials
  envelope, tuning and gain, to offsets and micro tuning things to create unique
  and organic-like sounds. Dna for acoustic instruments will remain recognizable
  on any weird editing made with akoustic.

  All of the patches have an organic, wood-like sounding and analog feel.

  Akoustic: spectral synthesizer by sampleson is a virtual instrument audio
  plugin and a software application for macos and windows. It functions as a VST
  plugin, an audio units plugin and a standalone application.
specs: |-
  - Spectral modeling synthesis

  - Additive synthesis




  - Spectral models (violas, woodwinds, vintage synths, electric pianos, guitar,
  basses)

  - Individual partial editing (envelope, tuning, offset, gain)

  - Harmonic and inharmonic partials editing

  - Drive fx

  - Delay fx

  - Reverb fx

  - Basic arpeggiator

  - Hd scalable interface

  - Releases control

  - Mechanical noises knob

  - Windows 7 or later

  - Os x 10.7 or later

  - Online activation required

  - No AAX version available

  - ~35mb installed
