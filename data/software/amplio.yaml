details: >-
  Amplio is a way to enhance boring and dull sound. It's a 3 band equalizer with
  adjustable bands and additional multiband effect modules. The plug-in is
  originally designed to enhance drum patterns but it is powerful enough to be
  used on any type of sound.


  Reverb effect routable to any of three bands will add more space to mix and
  soft limiter will prevent any clipping on final output.


  Version 2 changes: new multiband noise gate with envelope controls will help
  you totally change your beat and create something new. Total overhaul of user
  interface, faster load and smaller file-size. Improved controls. You can now
  use right mouse click to set default values and double right mouse click to
  set value to zero on all controls. Holding shift while dragging will increase
  sensitivity for better value settings. No more overlapping band control points
  on frequency splitter. Improved reverb and fixed wet/dry mix. Low band
  saturation now working correctly. Improved soft limiter to work better with
  distortion module. Control the stereo field with new multiband stereo balance
  module. Handy gadget for centering bass frequencies. Assembly optimization of
  all modules in order to save as much cycles as possible. Even with new noise
  gate cpu usage is same or even better than in previous version. Adjusted all
  existing presets and added new 14 new presets. Total 66 presets including
  amplio presets that use distortion module.


  Version 1.1 changes: additional optimization (up to 12% cpu usage reduction).
  Added knob readout for reverb module. New distort module.
specs: |-
  - 3 band equalizer
  - Adjustable bands
  - Multiband effect modules
  - Reverb effect routable to three bands
  - Soft limiter
  - Multiband noise gate with envelope controls
  - Multiband stereo balance module
  - Distortion module
  - VST plugin
  - Windows compatible
