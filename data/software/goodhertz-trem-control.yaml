description: Trem Control is a classic tremolo plugin for the 21st century,
  combining the immediacy of hardware with the detail of digital. It captures
  subtle human qualities and dramatic sound transformations through a wide range
  of tremolo modes and waveform shaping controls.
details: |-
  Made for everything from recreating the classics, to animating the modern, to hearing the unheard, Trem Control is a classically-inspired tremolo powerful enough for the 21st century.

  We love tremolo because it adds a human touch: the unsteadiness of a singer's voice, or of Coleman Hawkins' tenor on “Body and Soul.” And for nearly a century, innovators have brought that wavering to new instruments, inventing the unforgettable shimmer of Lionel's vibraphone, and the soulful wobble of a Rhodes.

  But we also love tremolo when it's more than a sine wave, that is, when it completely transforms a sound and imparts a rhythm or timbre otherwise unimaginable. And yet most digital tremolos fail to capture all of the above. They're usually hard to control, don't automate smoothly, and they lack the character and richness of a great tube amp tremolo.

  So, with all that in mind, we built something intuitive and limitless, a tremolo that combined the immediacy of hardware with the detail of digital.

  The easiest way to get to know a Goodhertz plugin is to sample the presets. Trem Control's presets cover all of its functionality, from the basics to the bizarre, the evocative to the educational, including Historical presets (Pops Staples 1961, “For What It's Worth” 1967, “No Quarter” 1973, “Money” 1973, “Bones” 1995) and Bizarre presets (Rewind, Broken Digital, Centrifuge, Helicopter).
specs: |-
  - Both Hertz- and tempo-synced operation
  - Wide range of speeds, from 0 Hz to 640 Hz
  - BPM sync with musical rate controls
  - Tap tempo
  - Flexible tremolo shapes, from sine to triangle to square, varied continuously without clicks or pops
  - Variable symmetry
  - Variable bias
  - Tremolo modes: 9 options, from Normal to Harmonic to Deep Harmonic
  - Colorful tube summing amp section, from 0% to 200%
  - Advanced controls: phase offset, stereo phase, swing
  - One page of advanced controls
  - Historical and Bizarre preset banks
  - 64-bit only, requires a 64-bit DAW
  - macOS 10.13+ / Windows 10+
