description: Trem Control is a classic tremolo plugin for the 21st century, combining the immediacy of hardware with the detail of digital. It captures subtle human qualities and dramatic sound transformations through a wide range of tremolo modes and waveform shaping controls.
details: |-
  Trem Control offers rate control in both free-running hertz mode and tempo-synced BPM mode, with speeds ranging from 0 Hz to 640 Hz and tap tempo functionality for live use.

  The Shape section provides continuously variable waveform morphing between sine, triangle, and square waves, with additional symmetry and bias controls and click-free transitions between shapes.

  The Vibe section includes 9 tremolo modes — including Normal, Harmonic, and Deep Harmonic — along with a tube summing amplifier simulation offering 0–200% saturation for warm, driven character.

  Advanced controls include phase offset, stereo phase manipulation, and a swing parameter for rhythmic variation. All parameters support artifact-free automation including on/off switches.
specs: |-
  - Rate range: 0 Hz to 640 Hz
  - Tempo sync with musical rate controls and tap tempo
  - Continuously variable waveform shapes: sine, triangle, square
  - Variable symmetry and bias controls
  - 9 tremolo modes including Normal, Harmonic, and Deep Harmonic
  - Tube summing amplifier simulation: 0-200% saturation
  - Phase offset and stereo phase manipulation
  - Swing parameter for rhythmic variation
  - Supported I/O: Mono->Mono, Mono->Stereo, Stereo->Stereo
  - HQ Mode: ~50ms latency, 2-4x CPU usage
  - macOS 10.13+ (AU, VST, VST3, AAX 64-bit)
  - Windows 10+ (VST, VST3, AAX 64-bit)
