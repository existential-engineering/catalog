description: The realistic sound of famous reverb gears in your ipad and iphone!
  Includes a large built-in library of the highest quality reverb impulses.
details: |-
  The realistic sound of famous reverb gears in your ipad and iphone! Includes a
  large built-in library of the highest quality reverb impulses taken from
  actual devices and possibility to upload your own impulses of reverb spaces.

  You can use this application together with inter-app audio hosts (like a DAW,
  recorders or audio file managers) or with audiobus for adding studio quality
  reverberation effects to the sound of other music applications or pre-recorded
  tracks. Altispace can also be used with external audio interfaces for
  real-time sound processing.

  Suitable for live performance or in the studio together with other equipment.
  Convolution reverb is based on a process that digitally 'captures' the reverb
  characteristics of another reverb effects unit or the reverb response of a
  real acoustic space. It is based on the mathematical convolution operation,
  and uses a pre-recorded audio sample of the impulse response of the device or
  space being modeled.

  Main features: more than 400 factory presets from 24 actual reverb devices.
  High-quality and fast convolution algorithm with 64-bit operations. Low
  latency for comfortable using at live performance. Wide range of reverberation
  types such as plates, springs, halls, rooms, etc.

  Pre/post parametric equalizer with cut-off lp/hp filters. Possibility to
  construct the envelope (like adsr) for device sample. Changing offset from
  beginning of sample (start time of sample). Adjusting stereo width and
  modulation for reverb output. Additional mode 'reverb only output' for use
  with DAW and mixing consoles. Possibility to upload additional samples in
  different audio formats.
specs: |-
  - Convolution reverb
  - Inter-app audio support
  - Audiobus 3 support
  - State saving feature
  - 64-bit convolution algorithm
  - Low latency
  - Pre/post parametric equalizer
  - LP/HP cut-off filters
  - ADSR envelope construction
  - Stereo width adjustment
  - Modulation control
  - Reverb only output mode
  - 400+ factory presets from 24 reverb devices
  - Impulse response library
  - Custom impulse upload
  - Multiple audio format support
  - Spectrum analyzer
  - iOS compatibility
