description: Delay3000 is a chameleon processor that brings the delay FX for your DAW to the next level, drawing inspiration from the Roland SDE-3000 rack unit and the Strymon Timeline. It offers both vintage analog and modern digital delay voices with advanced modulation, saturation, and filtering capabilities.
details: |-
  - Delay3000 Vintage Modern Repeater is inspired by two legendary delay units — the Roland SDE-3000 rack delay and the Strymon Timeline — combining their best qualities into a single DAW plugin. It offers 16 stereo multitap delay patterns and a Hold switch for infinite repetitions, making it equally suited for subtle ambience and dramatic sound design.
  - "At the heart of Delay3000 are two distinct voice types: a Modern digital delay with pristine clarity, and a Vintage analog delay that introduces the warmth and character of classic hardware. Each voice can be sculpted further using the GRIT saturation circuit, which adds tube-like body and harmonic richness, and the SMEAR circuit, which softens the attack of each repeat."
  - The plugin features a fully modulated signal path including a Chorus or Tremolo effect on the delay tail, and a modulated resonant low-pass filter that can be synced to your DAW tempo. A dedicated Ducking section reduces delay volume automatically when the dry signal is present, keeping mixes clear and articulate without manual volume riding.
  - DAW sync is available for all time-based parameters, and the built-in distortion modeling adds further tonal flexibility. The plugin's modulation circuit allows for lush, movement-rich delays that go well beyond simple repeats.
  - Delay3000 is available as a desktop plugin for macOS and Windows in AU, VST2, VST3, and AAX formats, and also as a standalone iOS app for iPhone and iPad.
