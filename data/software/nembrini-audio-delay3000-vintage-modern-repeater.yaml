description: Inspired by the Roland SDE-3000 rack delay unit and Strymon Timeline, the DELAY3000 Vintage Modern Repeater plugin adds new features and an easy to use interface, with 16 stereo multitap patterns, modulation, ducking and filter sections.
details: |-
  "DELAY3000 Vintage Modern Repeater plugin is a chameleon processor that brings the delay FX for your DAW to the next level"

  Inspired on the Roland SDE-3000* rack delay unit and Strymon Timeline*, the DELAY3000 Vintage Modern Repeater plugin adds new features and an easy to use user interface that gives you a complete arsenal of delay effects at your disposal. 16 stereo multitap patterns, repetitions Hold switch, Sync to DAW function, modulation circuit, ducking and filter sections are only a part of the features of this incredible processor.

  The DELAY3000 Vintage Modern Repeater plugin has two separate voices, or modern digital delay type FX or analog vintage sound. Nembrini Audio's distortion modelling is also included in the new DELAY3000 Vintage Modern Repeater plugin.

  The plugin has two separate custom-tuned saturation circuits: GRIT adds body and tube saturation, and SMEAR softens the attack of the repeats while maintaining full frequency response.

  The Ducking circuit is a very useful and practical mode to decrease the delay FX volume when the dry signal is playing. For example, you can hear the delay tail only when the singer stopped singing by simply turning two knobs. You can also add Chorus or Tremolo FX to the DELAY3000 tail and filter the effect output with a modulated resonant Low Pass Filter in sync with your DAW.

  Legal Disclaimer: SDE-3000 is a registered trademark of Roland Inc. Timeline is a registered trademark of Strymon. Delay3000 was developed by Nembrini Audio SRL based on its modeling techniques. Neither company has endorsed nor sponsored the Delay3000 in any manner, nor licensed any intellectual property for use in this product.
specs: |-
  - Inspired by the Roland SDE-3000 rack delay and Strymon Timeline
  - 16 stereo multitap patterns
  - Repetitions Hold switch
  - Sync to DAW function
  - Two voices: modern digital delay and analog vintage sound
  - Two custom-tuned saturation circuits: GRIT (body and tube saturation) and SMEAR (softens repeat attack)
  - Nembrini Audio distortion modelling included
  - Ducking circuit to lower delay volume while the dry signal plays
  - Chorus or Tremolo modulation on the delay tail
  - Modulated resonant low pass filter, synced to the DAW
  - iOS version for iPhone and iPad
  - Requires a VST2, VST3, AAX or AudioUnits compatible host
  - Intel compatible or Apple Silicon CPU, 1GB RAM
  - Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
