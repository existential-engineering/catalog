details: |-
  Inspired on the Roland SDE-3000* rack delay unit and Strymon Timeline* the DELAY3000 Vintage Modern Repeater plugin adds new features and an easy to use user interface that gives you a complete arsenal of delay effects at your disposal! 16 stereo multitap patterns, repetitions Hold switch, Sync to DAW function, modulation circuit, ducking and filter sections are only a part of the features of this incredible processor. The DELAY3000 Vintage Modern Repeater plugin has two separate voices or modern digital delay type FX or analog vintage sound.
