description: An incredibly detailed simulation of several classic rotary speakers, including the Leslie 122 and 147, a custom high-power model, and the Yamaha RA200. Features tube overdrive simulations, reverb with adjustable room size, multiple microphone setups, adjustable rotary speeds with acceleration and deceleration controls, and British guitar amp cabinet simulation. Originally included Blue3's Tube Overdrive and Rotary Cabinet simulations as a standalone effect plugin.
details: |-
  Cherry Audio is excited to announce the acquisition of GG Audio's widely respected vintage tonewheel organ and rotary speaker software emulations, Blue3 and Spin. Renowned for its award-winning virtual instruments and audio software, Cherry Audio will now develop the Blue3 tonewheel organ and Spin rotary speaker plugins, soon adding these legendary emulations to their impressive line-up.

  For a limited time, current users of Blue3 and Spin will have an opportunity to download the latest versions and secure their license codes from the GG Audio website. Users are encouraged to take advantage of this to ensure uninterrupted access to Blue3 and Spin during the transition period. Both companies are dedicated to ensuring a smooth handover and maintaining user continuity with the software, and announcements about the future of the products will be forthcoming from Cherry Audio.
specs: |-
  - macOS: 10.9 - 12.x (Monterey), Intel and Apple Silicon (M1) native support, 64-bit
  - windows: 7 or higher, 32-bit and 64-bit support for VST2/VST3/AAX, 64-bit only for AU
