description: "An incredibly detailed simulation of several classic rotary
  speakers, including the Leslie 122 and 147, a custom high-power model, and the
  Yamaha RA200. Features tube overdrive simulations, reverb with adjustable room
  size, multiple microphone setups, adjustable rotary speeds with acceleration
  and deceleration controls, and British guitar amp cabinet simulation.
  Originally included Blue3's Tube Overdrive and Rotary Cabinet simulations as a
  standalone effect plugin."
