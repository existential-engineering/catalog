description: KStrip is a channel strip plugin that puts three classic large
  format console circuits into one unit, letting you pick a different console
  flavor per module. The preamp, EQ, compression, and saturation modules are
  each switchable between three console personalities.
details: |-
  KStrip puts three classic large format console circuits into one channel strip, and lets you pick the flavor you want per module. The preamp color, EQ, and compression each are all switchable between three console personalities, on every track you use it on. Build the hybrid console channel no studio ever had, then save it as your starting point. Free 14 day trial included.
