details: |-
  The Portable Piano

  The Soundpaint 1980 Rhode Studio 54 is one of the most comprehensively deep-sampled Suitcases ever created. Recorded and processed at 24-Bit / 96Khz at Scotland's Premiere Recording Studio, Gorbals Sound, through a large custom NEVE desk. The Suitcase Piano contains both standard (Sustains and Staccato w/ RR) and prepared articulations (Plucked Tines and Muted Tines). We also opened the Suitcase and recorded the insides of it, plucking the tines and gently muting them for different types of sounds. The Rhode Studio 54 Piano also contains a large selection of presets, demonstrating many variations of the instrument.
