details: |-
  NEON is UJAM's Virtual Drummer plugin for nu disco drums and dance-pop grooves. These are defined by their tight, snappy, on-top-of-the-mix drum sound in combination with a driving, forward rhythmic feel.

  Referring to the legends of 1970s disco like Chic and The Bee Gees, NEON's rhythm engine gives that organic liveliness only an actual human drummer can deliver. The recorded drum kits are original vintage kits from makers like Ludwig and Rogers, tracked in a small booth using era-specific mics and outboard processing such as the Sennheiser MD 421 and Neve 1073. That vintage drum quality is then processed by a mixing console under the hood, macro-controlled by 6 mix presets.

  Pick one of NEON's 30 styles to match a genre or a song's energy level, then select and combine drum phrases for intros, verses, choruses and more. Any of the 23 phrases per style can be dragged into a DAW as a MIDI clip to edit, or triggered as ready-made grooves through single MIDI keys in time with the DAW's tempo.

  NEON's five drum kits were selected, tuned and recorded to sound dry, tight and punchy, each with seven individual drum instruments plus overhead and room mics. A Real/Glam slider moves a kit's sound from natural and acoustic to processed and almost electronic, and 100 presets provide starting points. Hand claps, recorded live by a trio, combine a direct mono signal with stereo room and overhead mics for a wide stereo image.
