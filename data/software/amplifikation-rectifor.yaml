details: |-
  Kuassa developed and carefully modeled the rectification design to present its sound and performance to guitarists as the amplifikation rectifor. They also improve the entire user interface to bring maximum experience for users.

  Amplifikation rectifor delivers a wide range of tones from rounded jazzy cleans, warm crunch, biting overdrive and thick high gain distortion.

  Amplifikation rectifor is now available as VST, vst3, audio unit, AAX, a360 modules, and as a standalone app, while the rack extension version will be released soon after.

  Kuassa also updates their guitar fx platform; amplifikation 360 to version 1.1.0. Featuring native apple silicon support, many new MIDI features, better live mode implementation, bugfixes, and more feature improvements, with an addition of amplifikation rectifor modules and cabinets to mix and combine all the modules with other kuassa amp and effect modules.
specs: |-
  - VST plugin
  - Vst3 plugin
  - Audio units plugin
  - AAX plugin
  - Rack extension plugin
  - Standalone app
  - 3 channels: raw, vintage and modern
  - 3 types: clean, raw and aggressive
  - High-res resizable graphic
  - Sag and bias feature on the power amp section
  - Low pass and high pass filters
  - Five types of cabinets with impulse responses
  - Nine types of workhorse mics
  - Freely adjustable dual-miking configurations
  - Mono or stereo configuration
  - Built-in noise gate and limiter
  - Supports up to 8x oversampling
  - Windows 7 or later (64-bit)
  - Core2 duo, or amd phenom ii x4 or better
  - 4gb minimum ram
  - VST or vst3 compatible host/DAW
  - Pro tools 11 or later for AAX format
  - Propellerhead reason 10.1 or later for rack extension format
  - Mac os x 10.9 or later (64-bit)
  - Native apple m1 compatible
  - Universal 2 binary
