description: DeeComp is a VST2, VST3, AU, and AAX plug-in compressor that uses
  software calculations rather than tube or transistor emulation to deliver
  clean, high-quality dynamics processing. It features multi-core processing,
  sidechain support, M/S input switching, PEAK/RMS detection, and an expander
  mode via sub-1:1 ratio settings.
details: |-
  DeeComp is a software compressor plug-in developed by Dotec-Audio that delivers dynamics processing through a high-speed algorithm described as state-of-the-art technology. Rather than emulating tube or transistor circuits, it relies purely on software calculations to achieve its sound, aiming for ultra quality output.

  The plug-in includes a wide set of controls covering the standard compressor parameters alongside several extended features. The WIDE parameter expands the processed sound, a high-pass filter can be applied to the sidechain path, and a WET control adjusts the dry/wet balance for parallel compression. A built-in limiter prevents output clipping.

  DeeComp supports both PEAK and RMS threshold detection modes, selectable via a fader, and provides M/S (mid-side) input switching for mid-side processing workflows. Setting the RATIO below 1:1 activates the expander function, making the plug-in capable of both upward and downward dynamics processing. A KNEE parameter enables soft-knee compression curves.

  The plug-in supports multi-core processing for efficient CPU usage. Sidechain functionality is available, allowing external signals to trigger the dynamics processing. The product has been noted as no longer available for purchase, though demo downloads remain accessible.

  DeeComp was released in August 2015 and received updates through January 2021, including Apple Silicon support and UI redesigns. Sound design was by Franck Shigetora, UI by IZMOJUKI and FUKUDAKOGYO, distributed by cyber rock.LLC and fmfmsoft Corp.
specs: |-
