description: Analog Passive Equalizer
details: |-
  Pulsatec is a modern equalizer plugin designed to capture the essence of vintage passive EQs, emulating the musical warmth and depth of classic passive equalizers and adding rich, analog-style coloration to a mix. Its design allows simultaneous boosting and attenuation within the same frequency band, enabling tonal shaping techniques prized by audio professionals for decades, especially for creating punchy, impactful low-end resonance.

  Two bands are dedicated to mid-frequency control, and a higher mid band adds brilliance or air while taming harshness and sibilance with surgical control. An amplifier stage can be switched between an ultra-clean model and a triode-based model, with the triode option adding extra coloration to the signal when the input level is high enough.

  Pulsatec includes a built-in, retractable Real-Time Analyzer (RTA) that gives immediate visual feedback on frequency response changes, letting users compare input and output signal curves and view the target equalization curve overlaid on the spectrum for reference while mixing.
specs: |-
  - Simultaneous boost and attenuation within the same frequency band
  - Two mid-frequency control bands plus a higher mid band for air/brilliance
  - Switchable ultra-clean or triode-based amplifier emulation
  - Built-in retractable Real-Time Analyzer (RTA) with input/output/target curve overlay
  - Several UI sizes with HiDPI support
  - MIDI Learn for controller assignment
