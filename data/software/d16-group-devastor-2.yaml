description: Multiband Distortion Unit
details: |-
  Devastor 2 is a multiband distortion unit built around an ultra low-aliasing diode-clipper emulation. Special antialiasing techniques applied to the output signal keep it free of the artifacts that make digital distortion sound cold and unmusical, resulting in a warm, musical, high-quality tone.

  Three filters make the unit multiband and rapidly configurable, offering nine different connection topologies between the filters and the diode-clipper. The filters can process the signal before or after the clipper, and some configurations let the filters work alongside the clipper for an expanded sonic palette. Unlike the peaking-EQ filters common in classic multiband distortion units, Devastor's filters are modeled after analog synthesizer filters (low pass, high pass, band pass and band reject) with adjustable resonance and cutoff.

  A one-knob dynamics-flattener module compresses the input signal to manage loudness before it is clipped, and an optionally activated output limiter with auto-makeup tames the master output while adding pleasant coloration.

  The plug-in supports MIDI Learn for easy controller assignment, and offers several UI sizes with HiDPI support for a good fit on any screen.
specs: |-
  - Ultra low aliasing diode-clipper emulation
  - Nine filter-clipper connection topologies
  - Synthesizer-style filters (low pass, high pass, band pass, band reject) with adjustable resonance and cutoff
  - One-knob dynamics flattener
  - Optional auto-makeup output limiter
  - MIDI Learn for controller assignment
  - Six clipping curves
