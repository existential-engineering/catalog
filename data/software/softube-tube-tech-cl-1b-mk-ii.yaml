description: Tube-Tech plugin compressor for vocal tracks and more.
  Can't-sound-bad operation. A vocal comp VST for classic rock, cutting-edge
  pop, rap, hip hop, and EDM with two versions included.
details: |-
  The Tube-Tech CL 1B is a modern classic and hip hop hero for a reason. As a vocal compressor in particular, its mixture of characteristic warm, musical opto gain reduction and surprisingly versatile can't-sound-bad operation have made it a staple across genres, from classic rock and cutting-edge pop to rap, hip hop, EDM.

  The Mk II version is a complete, ground-up sonic remodel of the Mk I that draws on a decade of advances in experience and technology. It is a two-in-one plug-in featuring both Tube-Tech CL 1B Mk I and CL 1B Mk II, with a Generation Switch to toggle between the sound of the two versions. This luxe studio hardware was modeled and remodeled from the ground up with Softube's component modeling and signal processing tech, and both versions of the comp are combined in a single interface.

  Opto compressors tend to grab hold quickly but then take a while to fully reset, with a strongly exponential release curve. This means the transients are dealt with transparently, but the larger body of the material benefits from a soft and musical leveling as the final ten or twenty percent of the gain reduction lingers before the next transient. For bass, acoustic guitars, vocals, and more, it is a sound every mix engineer should have on lockdown.

  Used by engineers and producers for a variety of genres, from hip hop to pop, CL 1B can beef up drums, warm and smooth vocals, or enrich bass in seconds. The plug-in is Console 1 Ready, so it can be used as a native plug-in or within the Console 1 Mixing System.

  Softube's partnership with Tube-Tech goes back to 2006, when work began on officially licensed plug-in representations of the Danish company's analog hardware units. In 2018, Softube released Mk II versions of CL 1B and Classic Channel, adding high-resolution graphics and additional features.
specs: |-
  - A two-in-one plug-in featuring Tube-Tech CL 1B Mk I and CL 1B Mk II
  - Generation Switch to toggle between Mk I and Mk II versions
  - Characterful yet versatile optical compression for vocals, bass, guitar, and more
  - Opto compression with a strongly exponential release curve
  - Wet/Dry control
  - High-resolution graphics
  - Console 1-ready: works as a native plug-in and in Console 1 Mixing System
