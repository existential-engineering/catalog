description: AudioSourceRE's advanced VOXLESS plugin for splitting vocal and
  instrumental tracks within your favourite DAW.
details: |-
  VOXLESS Version 2 is a powerful real-time vocal removal plugin that enables
  users to remove vocals from a song with ease directly in their DAW. It allows
  rebalancing of vocal and instrumental parts, from minor adjustments to full a
  cappella or karaoke-style vocal removal.

  The plugin features higher separation quality with lower CPU usage compared to
  its predecessor, working with any audio track at any sample rate. Its
  intuitive interface provides independent control over vocal and backing track
  levels.

  All processing happens locally in real-time on the user's device with no
  internet connection required. This makes it suitable for live performance and
  studio workflows where latency and privacy are important considerations.

  VOXLESS can also remove instrumental bleed from live vocal recordings, making
  it useful for mixing and mastering engineers. It is compatible with major DAWs
  including Cubase 10, Logic Pro X, Pro Tools, Reaper, FL Studio, GarageBand,
  Ableton Live, Studio One, and Waveform.
specs: |-
  - Real-time vocal and instrumental separation
  - Higher separation quality with lower CPU usage (Version 2)
  - Works at any sample rate
  - Independent vocal and backing track level adjustment
  - Real-time local on-device processing (no internet required)
  - Remove instrumental bleed from live vocal recordings
  - Available in AAX, VST, and AU formats
  - macOS 10.13+, Windows 10+
  - Minimum 4GB RAM (8GB+ preferred), 2.6GHz CPU (3GHz+ recommended)
  - Minimum buffer size 1024 (512 recommended)
  - iLok account required (cloud authorization, no dongle needed)
  - Compatible with Cubase, Logic Pro X, Pro Tools, Reaper, FL Studio, GarageBand, Ableton Live, Studio One, Waveform
