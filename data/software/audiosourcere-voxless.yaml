description: AudioSourceRE's advanced VOXLESS plugin for splitting vocal and instrumental tracks within your favourite DAW.
details: |-
  VOXLESS Version 2 is a powerful tool that acts as a highly effective vocal remover, enabling you to remove vocals from a song with ease in your DAW.

  Rebalance vocal and instrumental parts, from small adjustments to full a cappella or karaoke vocal removal.

  Experience true real-time vocal separations with no pre-processing required. VOXLESS Version 2 offers fully on-device processing, eliminating the need for an internet connection.

  VOXLESS also allows you to remove instrumental bleed from live vocal recordings, enhancing the clarity and quality of tracks.

  Compatible with all major DAWs, including Pro Tools, Logic Pro X, and Cubase, VOXLESS is ideal for DJs, mash-up enthusiasts, as well as mixing and mastering engineers who want to tweak a mix without requiring the original stems.
specs: |-
  - Real-time vocal and instrumental separation
  - Higher separation quality with lower CPU usage (Version 2)
  - Works at any sample rate
  - Independent vocal and backing track level adjustment
  - Real-time local on-device processing (no internet required)
  - Remove instrumental bleed from live vocal recordings
  - Available in AAX, VST, and AU formats
  - macOS 10.13+, Windows 10+
  - Minimum 4GB RAM (8GB+ preferred), 2.6GHz CPU (3GHz+ recommended)
  - Minimum buffer size 1024 (512 recommended)
  - iLok account required (cloud authorization, no dongle needed)
