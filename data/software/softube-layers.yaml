description: Softube Layers doubling and widening plugin is an intuitive, fast,
  and all-encompassing widening and doubling tool that gives you thicker,
  richer, and wider sounds with no fuss or hassles. It's ideal for vocals and
  vocal doubling, plus so much more.
details: |-
  Intuitive control of doubles, quick macro control over organic modulation, world-class widening algorithms, full- & multiband compression, de-essing, octave effects... Layers gives you all that and none of the common hassles and hang-ups. Get detailed control over doubling and widening for vocals and more with Layers now.

  Layers gives you up to ten doubles – or layers – to play with. You can move them around freely and easily; the placement adds depth and panorama. Quick changes to important parameters, like Level and Pitch, can be addressed directly per layer. Or you can dive deep into the pop-up to tweak in detail. To quickly add swirly modulation to all layers, increase the Pitch and Time variation. The modulation source is perfectly tuned to add organic movement. Want less modulation for a particular layer? Just dial the Variation Amount parameter. With Layers, you're in control and can make things as straightforward or intricate as you wish.

  Layers delivers world-class widening algorithms, like those ported from Softube's popular Widener plug-in: Classic, Frequency Spread, Rotation, Ambience, and Reflections. Each algorithm has a unique strength that helps you find the sweet spot you're looking for. The new Slow Mod – inspired by legendary and sought-after chorus rack units used by Stevie Ray Vaughan, Kate Bush, Peter Gabriel, and others – will take you into another dimension.

  Softube designed Layers to be multipurpose, with extra tools to help you shape your dynamics. Most of the time, you want to create a thick and cohesive track or create drama and contrast between the dry (unaffected) and wet (pitched doubles). With Layers, you can route compression to solve both cases. If your vocal tracks have a lot of sibilance, Layers can also help you with its powerful de-esser. It makes it possible to attenuate this potential buildup of high-frequency energy. For genres like hip-hop, house, pop, and other crossover genres, Layers features easy-to-change octave effects.

  Softube's reputation for creating tools that enhance workflow and offer superior sound quality is rock solid. Softube's partnerships with premium brands like Tube-Tech, Solid State Logic, Chandler Limited, Weiss Engineering, and Trident have spanned decades. Layers is built on this legacy of passion, expert modeling, and attention to detail.
specs: |-
  - An all-encompassing doubling and widening tool
  - Intuitive and fast
  - Instinctive control over doubles
  - Up to ten doubles (layers), freely movable for depth and panorama
  - Six different widening algorithms: Classic, Frequency Spread, Rotation, Ambience, Reflections, Slow Mod
  - Quick command of organic modulation (Pitch and Time variation, Variation Amount per layer)
  - Visualizations to avoid unwanted artifacts and see the doubling
  - Full- & multiband compression
  - De-essing
  - Octave effects
  - Supports Softube Extended Features panels
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Three activations
  - 20-day trial
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
