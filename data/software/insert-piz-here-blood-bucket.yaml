description: Blood Bucket is apparently a pointless experiment in synthetic
  stupidity. Two oscillators are combined in a variety of ways to modulate a
  third oscillator and presets are named after parts of the human head.
details: |-
  Blood Bucket is apparently a pointless experiment in synthetic stupidity. Two
  oscillators are combined in a variety of ways to modulate a third oscillator
  and presets are named after parts of the human head.

  The synth has the basic synthedit waveforms and a simple modulation matrix for
  modulating the two oscillators. You have 3 envelopes controlling different
  aspects of the sound. The matrix modulation has 3 knobs named dog, cat and
  rabbit that controls the 2 onboard lfo depths.

  The sounds are really experimental and has some nice electronica feeling to
  it, not likely the synth you'll go for when it comes to good strings or other
  instruments, but it is more for synthetic sounds la kraftwerk.

  The synth has 16 mediocre patches named after the heads organs, yet another
  sign of how hasty this plugin was created.

  Beautiful noise. Sadly there is only a 32-bit version but the vibe and weird
  sounds are amazing.
specs: |-
  - Two oscillators with modulation capabilities
  - Third oscillator for modulation
  - 3 envelopes
  - Simple modulation matrix
  - 2 onboard LFOs
  - Basic synthedit waveforms
  - 16 presets
  - 32-bit version
  - Windows compatible
