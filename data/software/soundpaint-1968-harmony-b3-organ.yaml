details: |-
  The Future of Nostalgia

  Soundpaint 1968 B3 Organ is a faithfully deep-sampled Hammond organ. The instrument contains over 60 different drawbar configurations. Extensively deep-sampled as both DI, Vibrato, Chorus, Slow and Fast Leslie speaker and many others. Soundpaint offers the ability to true-morph a non-vibrato into Leslie for 100% realistic rendition of the original instrument. No more emulations. The 1968 Hammond B3 Organ is no exception is a faithful reimagination of our very own B3 Hybrid Hammond Organ. Full of soul, the Hammond B3 Organ is associated with gospel music. Having toured with some of the industry's finest musicians and featured on a magnitude of headline festival stages, this work of art deserved to be archived and available for all to play. This Hybrid Hammond Organs tone and color are indicative to the era. With a timbre so raw and pure it is simply unmatchable.
