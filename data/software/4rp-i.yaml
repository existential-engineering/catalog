details: |-
  4rp I, the second release in the carbon series of kontakt 5 formatted classic synthesizer instruments features over 800mb of samples from 3 different vintage arp synthesizers, including both the mk I and mk iii odysseys as well as a beautiful arp 2600.

  The focus here is on bass sounds and the 32 tagged .nki based presets cover a lot of sonic ground, including the squelch of the mk I, the raw electricity of the mk iii and the gorgeous warmth of the 2600, all lovingly captured in 24-bit, 48khz audio.

  4rp I includes fully sampled patches from all 3 instruments as well as raw waveforms and noise from the 2600 for the greatest possible flexibility.

  4rp I utilizes particle sound's carbon interface which is based on a dual layer design with linkable sections. Each layer offers a selection of 6 sampled waves and/or multi-samples with sample start point modulation, an additional noise source and a multimode filter.

  A complement of 2 full envelopes, 1 attack/release envelope and 2 lfos are available and can be assigned to a variety of internal parameters. Each layer also includes it's own controller section where 2 assignable parameters can be controlled in varying amounts by a single knob for easy mod-wheel or aftertouch assignments. A global fx section rounds out the interface with access to up to 6 simultaneous effects for the final polish.
