details: Arpocalypse is a 6 note, 8 step matrix pattern generator. Taking a MIDI
  input it outputs the notes of the chord in a rhythmic sequence defined by the
  user - with the output notes, velocity, gate time, swing and legato
  programmable for each step.
specs: |-
  - 6 note matrix
  - 8 step pattern generator
  - MIDI input
  - Programmable output notes
  - Programmable velocity
  - Programmable gate time
  - Programmable swing
  - Programmable legato
  - VST plugin
  - Windows compatible
