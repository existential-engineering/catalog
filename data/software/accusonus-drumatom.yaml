details: |-
  Drumatom is the world's first microphone leakage suppression tool for multichannel drum recordings. Based on the patent pending advanced audio analysis (a3) technology from greece's Accusonus, this application reduces cross-microphone bleed on recorded drum tracks without altering the drum tones you worked so hard to capture.

  Using advanced signal analysis and processing, drumatom determines the difference between a snare hit and a hi-hat hit, allowing you to reduce the level of the hi-hat from the snare track while preserving the snare sound, even if both snare and hi-hat were struck at the same time. Drumatom uses custom algorithms for each of the following drum types: kick, snare, hi-hat, tom-toms.

  Since drumatom filters out bleed based on tonal content rather than amplitude, low-level signals you want to keep - like ghost notes on a snare - are preserved while mic bleed signals are significantly reduced. Drumatom also reduces phase cancellation and comb filtering effects two problems common with multitrack drum recordings.

  By providing greater track separation, drumatom allows for more individual processing of drum tracks. Boost highs on the snare channel without introducing harsh hi-hat crosstalk. Add reverb on rim shots, mix hot and panned toms without phase shifting or adding harshness to the cymbals.

  The companion drumatom player plugin (sold separately) allows you to control the bleed of your analyzed drumatom tracks from within your DAW, providing a whole new level of control during mixdown.
specs: |-
  - Microphone leakage suppression
  - Advanced audio analysis (a3) technology
  - Cross-microphone bleed reduction
