  - Windows version 10.9.0 or later (64-bit)
  - RAM: 4gb (8+ GB highly recommended)
  - Monitor: 1280-by-800 resolution or higher
  - Hard disk space: 500 MB free
  - Hard disk space (when processing): 5 GB (15 GB recommended)
  - Faster analysis (up to 50% faster depending on CPU power)
