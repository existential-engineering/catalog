description: HoRNet AutoGain Pro MK2 is an advanced gain automation and volume leveling plugin that helps you create volume automation quickly and efficiently
details: |-
  HoRNet AutoGain Pro MK2 is a highly flexible volume automation processor that offers advanced capabilities for volume control and mid/side processing. Building upon the processing code of the original AutoGain Pro, the MK2 version introduces an expanded range of features that enhance the precision and versatility of volume automation. With two detectors and two processors, AutoGain Pro MK2 offers a significantly higher level of control, enabling you to achieve a wide variety of tasks, from simple volume adjustments to complex, compressor-like dynamic processing.

  The AutoGain Pro MK2 provides multiple operation modes. In its “classic” mode, it can emulate the behavior of the original AutoGain Pro, delivering straightforward volume automation. When set to stereo or mid/side mode, the plugin takes full advantage of its expanded processing capabilities. Each of the two detectors can be set to one of five different source types, including internal or external options, and each processor can use either detector one or detector two as its source.

  One of the standout features of AutoGain Pro MK2 is its detector section, which provides fine control over the signal that drives the processing units. Each detector allows you to adjust the attack and release times, and includes high pass and low pass filters so that only the most relevant portions of the signal are used to trigger the processor. The level of the detector signal can also be adjusted to increase or decrease the effect it has on the processor.

  Once the control signal has been created, it is passed to one of the two processors, which compares the control signal with the level of the incoming audio and computes the necessary gain adjustment. The amount of gain applied can be fine-tuned using the “scaler” knob, while “max gain” and “min gain” controls limit the range of gain adjustments. The plugin’s large display provides a detailed graph showing the gain applied over time as well as the levels of the detector signal.

  AutoGain Pro MK2 also offers an automation writing feature that records the movements of the gain graph and saves them as host automation. Once the automation is written, the plugin can be switched to read mode so it uses the stored automation data from the host instead of relying on the internal processing, and the automation can then be edited to taste within the host.
specs: |-
  - Two detectors and two processors
  - Five different sources for each detector
  - Internal and external sources for detectors
  - Gate from -60dB to 0dB for each detector
  - Independent attack and release for each detector and processor
  - High pass and low pass filters on the detectors input
  - Detectors gain adjustable from -30dB to +30dB
  - Peak or RMS processing
  - Reverse gain operation for each processor
  - “classic”, “stereo” and “mid/side” mode
  - Can write and read automation
  - Independent adjustment of minimum and maximum gain range up to 36dB
  - Relative gain range adjustment
  - Graphical display for each detector and processor
  - macOS X (>=10.11) and Windows (Vista and later) support
  - Apple Silicon native support
  - 64bit only both on Mac and Windows
  - Audio Units, VST2.4, VST3 and AAX format
  - No copy protection
