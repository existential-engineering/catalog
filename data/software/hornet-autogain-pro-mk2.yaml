description: HoRNet AutoGain Pro MK2 is an advanced gain automation and volume leveling plugin that helps you create volume automation quickly and efficiently
details: |-
  HoRNet AutoGain Pro MK2 is a highly flexible volume automation processor that offers advanced capabilities for volume control and mid/side processing. Building upon the processing code of the original AutoGain Pro, the MK2 version introduces an expanded range of features that enhance the precision and versatility of volume automation. With two detectors and two processors, AutoGain Pro MK2 offers a significantly higher level of control, enabling you to achieve a wide variety of tasks—from simple volume adjustments to complex, compressor-like dynamic processing.

  The AutoGain Pro MK2 provides multiple operation modes, giving you the flexibility to suit your specific needs. In its “classic” mode, it can emulate the behavior of the original AutoGain Pro, delivering straightforward volume automation. However, when set to stereo or mid/side mode, the plugin takes full advantage of its expanded processing capabilities. Each of the two detectors in AutoGain Pro MK2 can be set to one of five different source types, including internal or external options. This allows for unparalleled flexibility in how the plugin processes audio and reacts to the incoming signal.

  Additionally, each processor can use either detector one or detector two as its source, further enhancing the plugin’s flexibility. This configuration allows you to manipulate both stereo and mid/side signals, enabling a much more nuanced control over the volume and dynamics of your mix. This makes AutoGain Pro MK2 ideal for tasks ranging from simple level automation to more complex compression or transient shaping tasks, blurring the lines between a volume processor and more specialized dynamic processors.

  One of the standout features of AutoGain Pro MK2 is its detector section, which provides fine control over the signal that drives the processing units. Each detector allows you to adjust the attack and release times, giving you precise control over how quickly the processor reacts to changes in the incoming signal. This feature is crucial for achieving natural and musical results, especially when automating dynamics in a complex mix.
specs: |-
  - Two detectors and two processors
  - Five different sources for each detector
  - Internal and external sources for detectors
  - gate from -60dB to 0dB for each detector
  - independent attack and release for each detector and processor
  - high pass and low pass filters on the detectors input
  - detectors gain adjustable from -30dB to +30dB
  - peak or RMS processing
  - reverse gain operation for each processor
  - “classic”, “stereo” and “mid/side” mode
  - can write and read automation
  - independent adjustment of minimum and maximum gain range up to 36dB
  - relative gain range adjustment
  - graphical display for each detector and processor
  - macOS X (>=10.11) and Windows (Vista and later) support
  - Apple Silicon native support
  - 64bit only both on Mac and Windows
  - Audio Units VST2.4, VST3 and AAX format
