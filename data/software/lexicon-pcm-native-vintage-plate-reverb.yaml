description: Vintage plate reverb plug-in that emulates the sound of older plate
  reverberators, with high initial diffusion, a bright coloured tail, and
  additional echo voices for percussion, vocals, and popular-music applications.
details: |-
  PCM Native Vintage Plate Reverb is a Lexicon software reverb plug-in that draws on more than 35 years of digital reverb hardware expertise to recreate the sound of classic plate reverberators. The algorithm preserves the characteristics of older plate implementations while updating the EQ section from the PCM96.

  Compared to other PCM Native algorithms, the Vintage Plate uses a different input diffusion and adds extra echo voices. The result is a high-initial-diffusion, bright, coloured reverberant character that suits percussion, vocals, and popular-music sources.

  The plug-in ships with over 200 studio-quality presets and supports full parameter automation inside the host DAW. A real-time spectral display with input/output metering is provided for visual feedback, and presets are portable between host applications. Authorization requires an iLok2 USB key.

  Lexicon lists this product as Discontinued. The final build was version 1.3.6, released August 2016, with installers for Mac (Intel, 19 MB) and Windows (50.3 MB). The plug-in is part of the broader PCM Native Reverb Plug-in Bundle, which is also no longer offered for new sale.
specs: |-
  - Vintage plate reverb algorithm with characteristics of older plate implementations
  - Updated EQ section from the PCM96
  - Different input diffusion and additional echo voices vs. other PCM Native algorithms
  - Over 200 studio-quality presets
  - Full parameter automation
  - Real-time spectral display with input/output metering
  - Single-screen interface with portable preset format
  - iLok2 USB authorization required
