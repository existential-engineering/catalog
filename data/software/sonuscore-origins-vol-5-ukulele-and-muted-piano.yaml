description: Play bold, grounded and wide-open sequences with the Muted Piano, add the light touch of the Ukulele, let both instruments playfully mingle, use a wide variety of effects from percussive timbres to ambient pads and more. Combines two individually playable instruments with an innovative Multi-Arpeggio-Designer (MAD) featuring 80 rhythm presets and 12 unique color settings.
details: |-
  Discover the 5th member of the Sonuscore Origins series, VOL. 5: UKULELE & MUTED PIANO. Featuring a unique combination between two carefully sampled, distinct instruments, the Multi-Arpeggio-Designer (MAD) gives a wonderful performance when playing chords, melodies or progressions on your keyboard. Play bold, grounded and wide-open sequences with the Muted Piano, add the light touch of the Ukulele, let both instruments playfully mingle, and use a wide variety of effects from percussive timbres to ambient pads and more.

  With its light, familiar tone, the ukulele is at home in the upper ranges. Let it happily pluck away to your score, give it a percussive twist, create ambient pads or run impressive modern-sounding arpeggios with it. The muted piano provides an interesting scope for tonal design: playing simple chords can lay an atmospheric groundwork for your composition, while the Multi-Arpeggio-Designer can give the instrument a characteristic, modern, sometimes futuristic feel.

  The Multi-Arpeggio-Designer is the centerpiece of every Origins instrument. Two fully customizable arpeggiators create interlocking patterns and broad soundscapes by combining the unique timbres of the two instruments. The engine is designed to convey a musically meaningful, human performance, instead of a computer randomly aligning notes. Load up one of 100+ inspiring presets or create your own arpeggios in as much detail as you like.

  The 12 individual color-presets provide even more possibilities to sculpt your sound. All colors are radically different in character and incorporate various effect settings and multiple impulse responses. While each MAD-Preset has an assigned color preset, you can combine everything at will, resulting in over 1200 predefined combinations. Arpeggio designs can also be copied and pasted between different instruments of the ORIGINS series.
specs: |-
  - Two individually playable instruments: ukulele and muted piano
  - Multi-Arpeggio-Designer (MAD) with two fully customizable arpeggiators
  - 80 rhythm presets (MAD section cites 100+ inspiring presets)
  - 12 unique color settings, combinable for over 1200 predefined combinations
  - Full customization of all controls
  - Arpeggio designs can be copied between different ORIGINS instruments
  - Requires FULL VERSION of Native Instruments' KONTAKT 5.8.1 or higher (the free Kontakt PLAYER only runs the instrument in demo mode)
  - Mac OSX 10.11 or higher, Intel Core 2 Duo
  - Windows 7 or higher, Intel Core 2 Duo or AMD Athlon 64 X2
  - 4 GB RAM
  - At least 158 MB of free hard disc space
  - Available as a download
