description: BPB Dirty Spring is a freeware spring reverb effect with adjustable
  pre-delay and a built-in bitcrusher.
details: |-
  You can preview the reverb effect by pressing the kick button. It simulates
  kicking a hardware spring reverb. The dirt knob controls the bitcrushing
  effect. There are six bitcrusher presets which range from subtle to
  over-the-top.

  Bpb dirty spring is available in vst2, vst3, AU, and AAX plugin formats for
  digital audio workstations on windows and macos. Both 32-bit and 64-bit plugin
  hosts are supported.
specs: |-
  - Spring reverb effect
  - Adjustable pre-delay
  - Built-in bitcrusher
  - Decay knob
  - Tone knob
  - Mix knob
  - Dirt knob
  - Kick button
  - Six bitcrusher presets
  - VST2 plugin format
  - VST3 plugin format
  - AU plugin format
  - AAX plugin format
  - 32-bit plugin host support
  - 64-bit plugin host support
