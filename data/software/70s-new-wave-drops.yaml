details: |-
  '70s new wave drops' is the latest drum multi-tracks, drum stems and drum loops album by drumdrops. Featuring drummer pete thomas who played and recorded on nearly all of elvis costello's albums we have focused on delivering 13 drum tracks featuring a number of costello-influenced grooves and 2 country shuffles.

  Producer/engineer roger bechirian came in to record, mix and produce the drum tracks on '70s new wave drops'. Roger was responsible for recording and mixing many of elvis costello's albums, as well as other new wave records by the likes of nick lowe, squeeze and the undertones making him an obvious choice for the production of '70s new wave drops'.

  The kit used was a hybrid gretsch kit and a more modern dw collector series provided by london based drumhire. We used the dw kick drum with gretsch toms and zildjian a cymbals. Two snares were used: pete thomas' ludwig 400 snare (which is the very same snare pete used on the original tracks); and a 1970's ludwig black beauty snare.

  The album was recorded in miloco's the square recording studio, london using an ssl g series console with telefunken and calrec mic pre's. The kit was mic'd up with 12 microphones including coles ribbons, neumann u47 fets and akg c28 valve mics. All of the tracks were recorded on to a 16 track analogue 2" machine.

  Drumdrops offers the '70s new wave drops' as drum multi-tracks, mixes & drum stems and drum loops. All of the multi-tracks come with session templates for pro tools, logic, cubase, ableton live, reaper and studio one. An omf file is also provided should you need to export the 24-bit 44.1 wavs into any other DAW. A beat tempo map is included to help users sync up the drum machines. The stem and mix packs come with the full mix of drums, as well as separate drum stems of each individual drum component. The drum loops packs contain around 8 different 4-bar loops taken from each track and are provided as mixes of the individual drum parts, as well as the full mix. Available formatted as wavs, apple loops and rex2 files, they can be dropped into any software, sampler or drum machine. There are 96 different drum loops on the whole album.
