details: |-
  Bold. Beautiful. Brass

  The Century Solo Trumpet follows the Century Solo Flugelhorn and is the latest masterpiece in our Century Solo Brass Series, redesigned exclusively for Soundpaint. It not only sets a new benchmark in emotive brass sampling but also redefines how it feels to play it on your keyboard. Infinite polyphonic legato, drastically enriching its expressive potential. Five microphone positions, including Mix A and Mix B—which are pre-set in optimal orchestral positions for immediate use—composers can achieve a perfect mix without concerning themselves with mic placement or adjustments. Additional inclusion of Neumann Close, Decca, and Wide microphones also allows for crafting atmospheric surround with ease. Soundpaint's free and modular engine paves the way for groundbreaking explorations. The unique Color Mode transforms the Flugel Horn and Trumpet into other brass instruments like the French Horn, Trombone, or Tuba at the click of a button, offering an expansive creative palette. The Century Solo Trumpet and Flugelhorn transcend the conventional sample library, serving as a conduit for unparalleled emotional and sonic exploration. Seamlessly integrated with Soundpaint, it equips composers to realize their musical visions with sophisticated depth and nuanced precision, directly out of the box.
