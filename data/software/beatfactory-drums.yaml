description: Beatfactory Drums is a free drumkit plugin which works in any DAW
  on Mac OS X and Windows 32/64-bit which supports VST or AU plugins.
details: |-
  The kits included in the plugin were created using the mpc 2500 passing
  through high end outboard eq, compressors, tube and solid state gear, for a
  gritty and punchy sound.

  The plugin contains 10 kits: 808 kit, trap kit, 80s kit, dubstep kit 1,
  dubstep kit 2, hiphop kit 1, hiphop kit 2, samples kit 1, samples kit 2, and
  indian kit.

  The plugin features volume and pan controls for each sample pad, an adsr
  envelope for shaping the kit, and built in reverb.
specs: |-
  - Mac OS X support
  - Windows 32/64-bit support
  - Volume and pan for each sample pad
  - ADSR envelope
  - Built in reverb
  - 10 kits included
