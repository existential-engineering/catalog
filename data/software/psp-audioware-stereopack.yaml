description: PSP StereoPack is a collection of 4 plug-ins. These plug-ins are useful for creating, expanding, improving, controlling and analyzing the stereo image and qualities of the signal in single tracks or entire mixes.
details: |-
  PSP StereoPack is a collection of 4 plug-ins. This bundle consists of: PSP PseudoStereo, PSP StereoEnhancer, PSP StereoController, and PSP StereoAnalyser. These plug-ins are useful for creating, expanding, improving, controlling and analyzing the stereo image and qualities of the signal in single tracks or entire mixes.

  PSP PseudoStereo plug-in enables the conversion of the mono signal into a stereo one. Due to processor operation the mono signal gains features resembling a record performed by the use of a pair of microphones. This appliance proves particularly valuable when mixing MIDI material, when for instance percussion tracks need some depth and natural spatial effect. This plug-in enables the user to create the impression of "vigorous drums" based on mono samples. It can also be used for the purpose of re-mastering mono tracks.

  PSP StereoEnhancer plug-in allows for the improvement of the stereo track spatial effect. Due to three processor operation modes optimal settings can be applied to any audio material. With the use of PSP StereoEnhancer the stereo sound of acoustic instruments as well as poor stereo archive tracks can be improved. This plug-in can also be applied for the purpose of new music material mastering.

  PSP StereoController is used for correcting stereophonic errors. This plug-in allows for removing basic errors such as: reverse signal phase or change of channels. It can also be used for effecting subtle changes into the stereo image. PSP StereoController is particularly helpful whilst mastering tracks performed in poor monitoring conditions. This processor does not break tonal balance and mono compatibility.

  PSP StereoAnalyser is used for measuring and estimating the correctness of the stereo signal. Apart from mean and peak measurement of L R or M S signal levels it allows for oscilloscope observation of stereo sound which reveals phase errors and lack of channel balance.
specs: |-
  - Bundle of four plug-ins: PSP PseudoStereo, PSP StereoEnhancer, PSP StereoController, PSP StereoAnalyser
  - PseudoStereo: mono to stereo conversion with a wide range of effects and visualization of stereo to mono ratio
  - PseudoStereo: emphasis of transients in processor chain
  - StereoEnhancer: three processor operation modes, effects from subtle to extreme
  - StereoEnhancer: visualization of mono compatibility
  - StereoController: independent control of differential signal level and traditional channel balance
  - StereoController: change stability of left and right without moving center channel position
  - StereoController: adjust center position without changing entire stereo image
  - StereoController: swapping and phase change of channels, with visualization of left / right balance and stereo / mono balance
  - StereoAnalyser: stereo oscilloscope with hold option and manually or automatically adjusted operating level
  - StereoAnalyser: L R or S M level meters with mean / peak / peak hold and held peak level text output
  - Sample rates up to 192 kHz supported
  - Presets library included
  - Windows x32 or x64 (XP Service Pack 2, Vista or 7) for VST 2.4, RTAS (Pro Tools LE / TDM 8.0.0 or later) and AAX (Pro Tools 10 or 11)
  - Mac OS X 10.8 or later, 32 or 64-bit host, for AudioUnit (Cocoa view), VST 2.4, RTAS (Pro Tools LE / TDM 8.0.0 or later) and AAX (Pro Tools 11 or later)
