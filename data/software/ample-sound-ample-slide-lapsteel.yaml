description: "Ample Slide Lapsteel by Ample Sound is a virtual instrument audio
  plugin and a software application for macOS and Windows."
details: |-
  Ample Slide Lapsteel by Ample Sound is a virtual instrument audio plugin and a
  software application for macOS and Windows.

  Ample slide lapsteel is sampled on a 70's jedson lap steel (david gilmour
  custom model).

  Polyphonic legato and slide smoother: enables realistic legato across any
  interval and speed. A slide system specifically designed for slide guitars.

  Riffer 4: a MIDI editor tailored for plucked string instruments with dual view
  modes offering seamless real-time switching between piano roll and guitar tab
  views. String visualization system enables MIDI writing that adheres to
  authentic plucked instrument techniques - automatically preventing polyphony
  on the same string and intelligently assigning fingering.

  Amp simulator includes 7 classic amp heads (metal double, metal treble, lead
  800, jazz 120, 65 twang, 65 delight, and 57 delight) paired with 8 guitar
  cabinets, each captured with 8 microphones. Built-in effects include 8-band
  eq, compressor, delay, and convolution reverb.
specs: |-
  - Polyphonic legato and slide smoother
  - Infinite legato system
  - Riffer 4 MIDI editor
  - Dual view modes (piano roll and guitar tab)
  - String visualization system
  - Full MIDI import/export compatibility
  - Intuitive technique editing
  - MIDI cc and velocity editors
  - Amp simulator with 7 amp heads
  - 8 guitar cabinets with 8 microphones each
  - 8-band EQ
  - Compressor
  - Delay
  - Convolution reverb
  - Sustain articulation
  - Natural harmonic articulation
  - Slide in articulation
  - Slide out articulation
  - Quarter slide articulation
  - Legato slide articulation
  - Legato vibrato articulation
  - Buzzing articulation
  - Arpeggio articulation
  - 2.8 GB size
platforms:
  - windows
  - mac
