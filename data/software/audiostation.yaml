name: AudioStation
manufacturer: seelake
primaryCategory: daw
url: https://www.seelake.it/
description: AudioStation is a Windows-based user-definable digital audio
  workstation. It features a mixer that embeds a VST/vsti host with multiple
  slot.
details: |-
  AudioStation is a Windows-based user-definable digital audio workstation. It
  features a mixer that embeds a VST/vsti host with multiple slots per channel,
  independent MIDI routing engine per channel, independent audio monitoring per
  channel, MIDI/wav/mp3 player/recorder plus metronomic click.

  It can be controlled with the provided remote (and integral part of the
  device), and by any external MIDI controller. Plus it can control every
  parameter of VST and MIDI parameters of external MIDI devices.

  It also features a secondary partition with a dedicated os, separated from the
  audio one, so it can be used as standard pc with no risk for the audio system.

  Features include 20 channels with I/o audio and MIDI, microphone class a
  preamps with phantom power, auxiliary and master buses with independent audio
  outputs, and sends for effects and monitoring.

  Routing and MIDI processing with split, layer, merge, filter, velocity and
  crossfade functions applicable to software instruments and external ones, with
  storage of 1000 patches per channel and 1000 scenes of the whole console.
specs: |-
  - Windows-based digital audio workstation
  - VST/vsti host
  - Multiple VST slots per channel
  - 20 channels with I/O audio and MIDI
  - Independent MIDI routing engine per channel
  - Independent audio monitoring per channel
  - Microphone class a preamps with phantom power
  - Auxiliary and master buses with independent audio outputs
  - Sends for effects and monitoring
  - 4 VST slots per channel in series and parallel configuration
  - MIDI/wav/mp3 player/recorder
  - Metronomic click
  - Split, layer, merge, filter, velocity and crossfade functions
  - 1000 patches per channel storage
  - 1000 scenes storage
  - Remote controller hardware
  - 2x19" rack units
  - Internal power supply
  - Secondary partition with dedicated os
platforms:
  - windows
