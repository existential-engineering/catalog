description: Phick is an analog circuit-modeled saturation module for iFX Rack
  that imparts warmth and phat analog character to any sound run through it.
details: |-
  We went into the lab and took the time to craft the most analog sounding module for your iFX Rack. We gathered all of our favorite analog sounding gear and modeled the circuitry in the lab. It's not replicating the distortion curves, rather, it is imparting true physical modeled circuitry to make any sound that you run through it sound warm, phat, and analog.
