details: |-
  The MRH810 V2 Lead Series Guitar Amplifier is modelled on a Marshall JCM800 2210, one of the most acclaimed amplifiers that became an iconic image in Rock History. Two channels are powered by four 12AX7 and four EL34 virtual tubes: a Lead Channel for classic British 800 guitar tone across rock genres from classic rock to metal, and a Clean Channel for crystal clean, creamy crunch tone and a pedal platform.

  The cabinets section offers six different guitar cabinet options with four microphone emulations, on/off axis position switching, and continuous position and distance controls. A full mixer section with Solos, Mutes, Pans, and Faders allows blending of two microphones with ambience for detailed tone shaping.

  An Impulse Response Loader supports up to three third-party impulse responses, blendable via volume, pan, phase, solo and mute controls, with a browser window for searching IR files. This allows players to use their own custom cabinet IRs alongside or instead of the built-in cabinet simulations.

  A Noise Gate section and Cleaner circuit reduce rumbling and harshness in the signal chain, helping maintain a clean and controlled tone especially at high gain settings.

  The plugin is also available as a standalone iOS app for iPhone and iPad on the Apple App Store, bringing the full MRH810 V2 experience to mobile devices.
specs: |-
  - Two channels: Lead and Clean
  - Four 12AX7 virtual tubes
  - Four EL34 virtual tubes
  - Six guitar cabinet options
  - Four microphone emulations with on/off axis position switching
  - Continuous microphone position and distance controls
  - Complete mixer section: Solos, Mutes, Pans, and Faders
  - Impulse Response Loader: up to 3 third-party IRs
  - IR blending via volume, pan, phase, solo and mute controls
  - Noise Gate section
  - Cleaner circuit for rumble and harshness reduction
  - Requires: Intel compatible or Apple Silicon CPU, 1GB RAM
  - Mac OS 10.13 or newer
  - Windows 7 or newer
  - 64-bit DAW required
  - Current version: 1.0.8
