details: |-
  The MRH810 V2 Lead Series Guitar Amplifier modelled on a Marshall JCM800 2210. This legendary head is one of the most acclaimed amplifiers that became an iconic image in Rock History.

  Two channels driven by four 12AX7 and four EL34 virtual tubes: the Lead Channel for the famous British 800 guitar tone heard in every rock genre, from classic rock to screaming and shredding metal for over 40 years, and the Clean Channel for crystal clean, creamy crunch tone and a great platform for pedal based sounds.

  With MRH810 V2 Lead Series Guitar Amplifier it is possible to choose between six different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs. A complete Mixer section with Solos, Mutes, Pans and Faders allows you to blend together the two microphones with the ambience.

  Impulse Loader lets you load up to three third-party impulse responses that you can even blend together using volume, pan, phase, solo and mute controls. A useful browser window has been added so you can easily search through all your third-party IR files.

  A Noise Gate section plus a Cleaner circuit to reduce rumbling and harshness is included.
specs: |-
  - Two channels driven by four 12AX7 and four EL34 virtual tubes
  - Lead Channel for the British 800 guitar tone, from classic rock to metal
  - Clean Channel for crystal clean and creamy crunch tone, a platform for pedal based sounds
  - Cabinets: six different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs
  - Mixer section with Solos, Mutes, Pans and Faders to blend the two microphones with the ambience
  - Impulse Response Loader: up to three third-party impulse responses blendable with volume, pan, phase, solo and mute controls, with a browser window for searching IR files
  - Cleaner/Noise Gate: noise gate section plus a Cleaner circuit to reduce rumbling and harshness
  - Plugin Formats: a VST2, VST3, AAX or AudioUnits compatible host
  - System: an Intel compatible or Apple Silicon CPU, 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
