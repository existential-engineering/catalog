details: |-
  About Bassforge Bonecrusher — Bass Amp Sim Plugin
  Bassforge Bonecrusher is a bass amplifier simulation plugin that streamlines bass tone creation and delivers powerful tools for producers, mixers, and bassists to craft detailed rock and metal tones. Built to handle everything from classic rock to extreme metal, it is the first bass amp simulator to combine dual amp models with advanced Toneforge DI Match™ technology. The plugin features two distinct amp models (Bonecrusher and Skullcrusher), cabinet blending with four microphone models, multi-stage EQ processing, and a comprehensive dual-band compression system. Complete with built-in effects, flexible MIDI mapping, and live performance capabilities, Bonecrusher provides everything needed to achieve professional bass tones suited for modern rock and metal production.
  The Sound
  Bassforge Bonecrusher is a specialized bass processing suite dedicated to the powerful and demanding world of rock and metal production. Its dual-amp design delivers everything from tight, aggressive modern metal tones to warm, vintage-inspired rock sounds. Built for producers who demand both clarity and weight in their mixes, Bassforge Bonecrusher combines advanced DI matching technology, multi-stage EQ, and dual-band compression to give you complete control over your bass tone. No matter if you're crafting crushing modern metal or classic rock anthems, Bassforge Bonecrusher provides all the tools needed to build a solid foundation for your mix.
  Hear Bassforge Bonecrusher In Action: Audio Examples
  Experience Bassforge Bonecrusher in action through these audio demos showcasing its versatility across rock and metal genres. From brutal modern metal tones to smooth classic rock sounds, these examples demonstrate how Bonecrusher shapes your bass tracks into mix-ready foundations. Transform your bass recordings with the dual-amp power of the Crush.
  Bassforge Bonecrusher Features
  Bassforge Bonecrusher features a vast amount of tone shaping and pro mixing tools to create and mix your bass guitar tone from scratch. Here’s an overview of all the included features:
  Two Amps, One Bass Plugin
  At the heart of Bassforge Bonecrusher lies two powerful bass amps that deliver the perfect tones time after time, session after session.
  Bonecrusher Amp — Modern Rock/Metal Bass Tones
  A high-gain powerhouse designed to deliver modern rock and metal bass tones with devastating precision. Fine-tune your distortion with independent Gravel and Grind controls - shape everything from subtle drive to aggressive fuzz while maintaining crystal-clear note definition. Push the Crush knob to add harmonically rich distortion to your mids and highs while keeping your low-end tight and focused. Whether you need earth-shaking metal tones or punchy rock sounds, Bonecrusher gives you the tools to stand out in any mix.
  Skullcrusher Amp — Gain-Morphing Bass Tones
  A legendary, gain-morphing amp, designed to give you full control over your bass tone. With a simple drag of the skull character slider, you can seamlessly morph between clean, smooth tones and aggressive, distorted sounds, allowing you to perfectly tailor the gain to your track's needs. This amp isn't just about power; it's about precision, offering detailed tone-shaping controls like Drive, Contour, Thump, and Bark to carve out the perfect sonic signature for any genre.
  Built-In DI Match Technology
  Toneforge DI Match™ introduces the all-new DI Match Technology to your setup. With Toneforge DI Match, you're not modeling an amp or a mixed bass guitar tone. You’re modeling the starting point - the underlying DI. Using groundbreaking technology, change the sound of any bass to that of another.
  Take your “S-Bass” and instantly match it to a "P-Bass" or a "J-Bass". Boost your bass with an active set of pickups without changing any hardware. Or — match the tone of your current bass setup to a profile of the same bass back when it had fresh strings on it.
  With Toneforge DI Match, one bass guitar transforms into an unlimited number of bass guitars, giving you infinite tonal options for your productions.
  DI Match has many practical applications in the studio, including:
  Creating consistency by matching your DI to the DI from a previous session.
  Bringing uniformity when tracking with different bass guitars or pickups.
  Introducing flexibility to switch your DI's profile to a different configuration.
  Providing the portability to match your DI tone to another artist's DI recording.
  Run Two Cabs in Parallel
  Unlock limitless tonal possibilities with Bassforge Bonecrusher's Dual Cabinet Simulation. This feature puts the power of two distinct cabinets right at your fingertips, offering unparalleled flexibility in shaping your bass tone. Choose between the JST Matched Cab, meticulously tailored for bass, and the legendary Ampeg 8x10 to design the perfect sound for any genre or style.
  With four microphone options: PR40, U87, 421, and JST Sub Kick. You can dial in precise mic placements and blends, capturing the nuances of your tone with exceptional clarity. For even more customization, the built-in Impulse Response loader allows you to incorporate your favorite impulse responses. And when using Dual mode, adjust the Blend slider to seamlessly balance the signals from both cabinets, giving you total control over your final sound.
  Three Stages of Bass EQ
  Shape your tone with precision using our three-tier EQ setup - analog 5-band for vintage warmth, digital 24-band for surgical control, and 7-band graphic for quick amp adjustments.
  The Warmth & Color of Analog
  Add an extra touch of warmth and character with classic analog gear using the Vintage Analog EQ emulation This 5-band EQ, featuring high-pass and low-pass filters along with three mid bands, brings the rich, organic sound of analog processing to your sessions, ensuring they stand out with timeless quality.
  The Precision of Digital
  With support for up to 24 bands of equalization, Bassforge Bonecrusher’s EQ can handle any task - big or small. Each EQ band is highly adjustable, featuring nearly a dozen optional parameters for fine-tuning your equalization efforts, including mid/side and dynamic EQ options. Bass amp sim plugins have never had access to an EQ this approachable or this packed with so many features.
  The Simplicity of Graphic EQ
  To apply the final touches to your bass EQ chain, Bassforge Bonecrusher features a straightforward 7-band graphic equalizer — the same one you'll find on bass at stadium & arena rigs worldwide.
  Specialized Compressor for Bass
  Independent control over low and high frequencies with separate compression settings. Process your clean low-end differently from your distorted mids and highs.
  Bass Effects Pedals in Bassforge Bonecrusher
  Add depth and character with studio-grade chorus and reverb, plus a vintage tube preamp for extra warmth and drive.
  Designed for Studio & Stage
  Bassforge Bonecrusher features both Live Mode and MIDI Mapping. Designed for seamless integration into any live setup, this feature allows you to command your bass tones at every show.
  Bassforge Bonecrusher's Live Mode
  With Live Mode, your sound is always stage-ready, enabling you to switch between different tones and settings in real-time. Whether you’re moving from a clean verse to a distorted chorus or want to make minor adjustments, Live Mode keeps your focus on the performance, not the gear.
  MIDI Mapping in Bassforge Bonecrusher
  Connect your MIDI controller to your DAW and assign specific controls to your favorite parameters. This means you can change amp settings, switch cabinet simulations, or toggle effects instantly, all with the press of a button. No MIDI controller? No problem. Bassforge Bonecrusher also supports fully automatable scene changes within your DAW, so you can pre-program your tone shifts and let your computer handle the rest.
