details: |-
  The Bohemian Violin was created to free you to perform real violin
  performances fast, without the need to be a violinist yourself. To achieve
  realism, we recorded a large amount of samples for a solo instrument, but
  managing all this by loading individual patches would be slow and cumbersome
  and stifle inspiration. This is where the virtual performer comes in,
  controlling all the varied legatos, bow types and emotive expressions as you
  play, all from one patch and all in real time.

  The virtual performer can be directed to alter its emotion during performing
  by switching through alternative play styles called moods. Play harsh with
  assertive, through too emotional and gentle with emotive or play a varied off
  the cuff mockup with improv, classical mood and finally short, sharp, lively
  with sprightly, all with the tap of a key. Switch into maestro, the first poly
  performer legato, play as many notes together as you wish and let our poly
  performer choose the appropriate legatos and bow types for you.

  Every note is sampled with hundreds of intervals, multiple dynamics and varied
  speeds, packing emotion into every performance while remaining in true musical
  phrase, from first note to the last. Our legato is always captured in phrase
  and in a musical context, resulting in each legato played being a true sample
  of a real performance.

  Each articulation and mood can be forced upon the performer using an
  assignable key, granting you the ability to adjust the performers behaviour
  should you choose to.

  The virtual performer enables incredibly easy live play, auto selecting the
  bow types, legatos and bow positions based on your play style.
specs: |-




  - Gorilla engine

  - Background streaming

  - Low memory requirements

  - Multiple instances resource sharing

  - Performer mode: solo, second violin, trio, chamber, divisi trio & divisi
  chamber

  - Articulations: ricochet, col legno, ponti cello, sul tasto & harmonics

  - Convolution & algorithmic reverbs with hall, chamber and studio spaces

  - Velocity control

  - Built in expression control

  - 70,000+ samples

  - 3 deep sampled dynamics for sustains with 2+ round robins per bow (pp-mf-ff)

  - 2 transition (crescendo) dynamic layers with 2 round robin repetitions per
  bow

  - 3 dynamic layers of diminuendos at 6+ seconds length

  - Legato types: slurred on bow, fingered on bow, fingered bow changed, slurred
  bow changed, portamento, runs, tremolo, re-bow action

  - Non vibrato in 3 dynamics with true rebow samples

  - Up bow and down bow motion

  - Mood selection: improv, emotive, assertive, classical, sprightly

  - Maestro performer poly-legato

  - Universal 2 binary
