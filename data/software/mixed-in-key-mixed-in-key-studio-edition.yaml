description: Award-winning key detection plugin for digital audio workstations that analyzes audio in real-time to identify musical keys, scales, and note information.
details: |-
  Mixed In Key Studio Edition is an award-winning key detection plugin that analyzes audio in real-time inside your DAW. Works on individual channels and the master bus to identify the musical key, root notes, and note percentages of any audio.

  Use cases include sample matching to prevent key clashes, mashup creation, drum tuning, acapella remixing, and vocal tuning. Compatible with Melodyne and Autotune.

  Native Apple Silicon support. Requires internet connection for plugin operation.

  Officially supported DAWs (Mac): Ableton Live, Logic Pro X, FL Studio, Pro Tools, Cubase. Windows: Ableton Live, Pro Tools, FL Studio, Cubase. Unofficial support: Reaper, Bitwig Studio, Digital Performer, Reason, Maschine, Studio One.
specs: |-
  - Real-time key detection
  - Works on individual channels and master bus
  - Identifies root key, note percentages, key changes
  - Compatible with Melodyne and Autotune
  - Native Apple Silicon support
  - macOS 10.10.5 or higher
  - Internet connection required for plugin operation
