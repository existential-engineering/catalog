description: Award-winning key detection for your DAW. Find the exact key of
  your samples and detect the key in real-time.
details: |-
  Mixed In Key Studio Edition brings the company's award-winning key detection into the DAW as a VST/AU plugin. Added to an audio channel, a send bus or the master bus, it analyzes whatever is playing and reports the root key along with the notes present in the audio, in real time, without leaving the session.

  The plugin is aimed at sample work: Splice packs, self-written melodies, acapellas, drums and percussion can all be analyzed so a producer can tell when sounds clash. It reports what percentage of the audio uses each note (C, C#, and so on) alongside the root key, and shows key changes occurring inside a single audio source.

  Typical uses given on the product page include making mashups and re-edits by matching two tracks in the same key, remixing acapellas by finding the root key before layering further samples, tuning drums and percussion by reading their exact key and pitch, and reading the key and scale to enter into Melodyne or Auto-Tune when tuning vocals. The results are also intended to feed Mixed In Key's Captain Plugins for writing chords, melodies and basslines.

  Mixed In Key describes the detection algorithm as the same industry-favourite engine behind its original track-analysis software, refined over roughly 4,000 days of development, and Studio Edition as the first time it has been offered as a VST plugin.

  Officially supported hosts on macOS 10.10.5 and higher are Ableton Live 9 and 10, Logic Pro X, FL Studio 20, Cubase 9 and 10, and Pro Tools 12. On Windows the officially supported list is Ableton Live 9 and 10, Pro Tools 12, FL Studio 20, and Cubase 9 and 10. Reaper 5, Bitwig Studio 2, Digital Performer 10, Reason 10, Maschine 2 and Studio One 4 are listed as unsupported but stable, with BlueCat Audio Patchwork noted as sometimes required. An M1 native version is available, and an internet connection is required to use the plugin.
specs: |-
  - Real-time key detection inside the DAW
  - Usable on any audio source, added to an audio channel as a VST or AU plugin
  - Works on send busses and the master bus as well as individual channels
  - Establishes the root key of samples, loops, acapellas, drums and vocals
  - Shows key changes occurring inside an audio source
  - Reports the percentage of the audio using each note (C, C#, and so on)
  - Score view showing the notes present in the analyzed audio
  - Includes the Mixed In Key key-detection algorithm
  - macOS 10.10.5 or higher, M1 native version available
  - Officially supported on Mac: Ableton Live 9/10, Logic Pro X, FL Studio 20, Cubase 9/10, Pro Tools 12
  - Officially supported on Windows: Ableton Live 9/10, Pro Tools 12, FL Studio 20, Cubase 9/10
  - Reported stable but not officially supported: Reaper 5, Bitwig Studio 2, Digital Performer 10, Reason 10, Maschine 2, Studio One 4
  - BlueCat Audio Patchwork may be required in some hosts
  - Internet connection required to use the plugin
