details: |-
  Big bang - universal drums features a deeply sampled custom made sjc drum kit
  played both with sticks and brushes as well as 2 different snare drums and 2
  bass drum beaters for flexibility in most musical contexts.

  An integral part of big bang universal drums is a new technology called
  intelligent rhythm control, or irc. Intelligent rhythm control technology is a
  new concept in music production that offers real-time rhythm correction for
  maximizing in-time musical performance.

  I.r.c. Intercepts and adjusts MIDI events as they occur, seamlessly
  integrating each note into the host timeline and enabling users to create
  propulsive drum & percussion tracks with fluidity and ease. With I.r.c.
  Enabled it is impossible to play out of time.

  To ensure sonivox products are compatible with your configuration check the
  sonivox knowledge base for the latest compatibility info.
specs: |-
  - Intelligent rhythm control (irc)
  - Real-time rhythm correction
  - MIDI event adjustment
  - Sjc drum kit samples
  - Stick and brush articulations
  - 2 snare drums
  - 2 bass drum beaters
