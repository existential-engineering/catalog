description: Get our FREE WARHORNS instrument for cinematic and orchestral compositions, as well as any project that requires a touch of medieval flair. Features recordings of authentic Bronze Age and Viking-era instruments — including a bronze lur, bukkehorn, and neverlur — captured at Stenhamra quarry in Sweden.
details: |-
  WARHORNS is a free Kontakt Player library of ancient Nordic war horns, offered by Sonuscore as a gift to its userbase. The page pitches it at composers who want epic, powerful horn blasts with a medieval or Viking character, and points at the combat scenes of Lord of the Rings and Vikings as the reference.

  The horn blasts were captured outdoors at the Stenhamra quarry near Stockholm, Sweden, a waypoint on the ancient route to Uppsala, chosen for its atmosphere and natural reflections. Three instruments were recorded: a bronze lur, a copy of a Scandinavian Bronze Age wind instrument whose original dates back some three thousand years and is housed in the Copenhagen National Museum; a bukkehorn made from the horn of a billy goat, one of the earliest known lip-vibrating instruments; and a neverlur, a horn the Norsemen crafted from carefully nurtured pine cut in half, carved out and held in shape with birch bark strips.

  The instrument carries controls aimed at the unstable nature of a Viking war horn. Shape controls for Attack, Tuning and Speed set the pitch and timing, and EQ settings for lows, mids and highs fit the sound into a mix. An additional FX section pushes the material further, letting a composer mangle the horns into blasts with an aggressive, modern edge.

  The library is free and runs in the free KONTAKT PLAYER, with a small footprint of roughly 152 MB on disc.
specs: |-
  - Nordic war horns recorded outdoors at the Stenhamra quarry near Stockholm, Sweden
  - Three instruments sampled: bronze lur, bukkehorn and neverlur
  - Shape controls for Attack, Tuning and Speed
  - EQ for lows, mids and highs
  - FX controls for aggressive, modern processing
  - Works with the FREE KONTAKT PLAYER
  - Requires KONTAKT version 7.6.1 or higher
  - Intel Core 2 Duo processor recommended
