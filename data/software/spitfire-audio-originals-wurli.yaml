details: |-
  Originals Wurli is the definitive rendition of the legendary Wurlitzer keyboard. Presented with four separate presets — Classic, Funky, Mellow and Stabs — Wurli allows you to adjust Attack and Release controls to create pads and unique tones, and, in the classic keyboard section of the library, Tremolo Rate and Depth controls offer the ability to curate the perfect sound for your compositions.

  Not only a pillar of RnB classics from Ray Charles to Donny Hathaway, this instrument found its way onto countless hits of the 70s and 80s with Elton John, Richard Carpenter, Edward Van Halen, and famously on Supertramp's Dreamer. Explore the classic sound reimagined.

  Originals Wurli requires the free Splice INSTRUMENT plugin to run.
specs: |-
  - File size: ~5.6 GB
  - 4 presets: Classic, Mellow, Funky, Stabs
  - Signals: Direct, Amp (Ampeg B-15), Speaker, Pads, Drive
  - Controls: Reverb, Attack, Release, Tremolo Rate, Tremolo Depth
  - macOS 12 or later, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
