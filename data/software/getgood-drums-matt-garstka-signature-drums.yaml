description: Matt Garstka Signature Drums is a virtual drum instrument featuring Matt Garstka's signature sound captured from a custom DW Collectors Series kit recorded at Gray Box Studio in Nashville. It delivers unparalleled realism via Fluid+™ technology, a fully featured mixer, studio-quality effects, and 100+ mix presets. Designed for Animals As Leaders fans and producers alike, it includes 4 kicks, 8 toms, 5 snares, 10 Meinl Byzance cymbals, and 450+ MIDI grooves.
