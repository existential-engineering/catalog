description: Matt Garstka Signature Drums is a virtual drum instrument featuring
  Matt Garstka's signature sound captured from a custom DW Collectors Series kit
  recorded at Gray Box Studio in Nashville. It delivers unparalleled realism via
  Fluid+™ technology, a fully featured mixer, studio-quality effects, and 100+
  mix presets. Designed for Animals As Leaders fans and producers alike, it
  includes 4 kicks, 8 toms, 5 snares, 10 Meinl Byzance cymbals, and 450+ MIDI
  grooves.
details: |-
  At the cutting edge of modern drumming, dizzying rhythmic freedom, endless flow, jaw-dropping precision and unshakable groove, Matt Garstka stands as one of the greatest to ever sit behind a kit. From his work in Animals As Leaders and Tigran Hamasyan, to Victoria and beyond, Matt pushes boundaries with fearless creativity, delivering performances that are as explosive as they are inventive.

  Built on our new standalone platform, Matt Garstka Signature Drums is filled with many powerful features to step up your production, no matter your experience level. From our proprietary Fluid+ technology, humanization features and robust mixing tools, there is much to explore. Fluid+ is a proprietary feature of our sampler engine that realistically models the way that drums, cymbals and recording spaces react during live drum performance.

  Captured in breathtaking dynamic detail, Matt's sonic identity leaps from this virtual instrument: organic punch across the kit, short expressive cymbals, and his signature dry, articulate snare tone. The collection features Matt's custom DW Collectors kit in two drumhead and tuning configurations, five of his favorite snares, and his hand-selected Meinl cymbals, including all of his signature models. Recorded in the world-class live room at Gray Box Studio in Nashville, the kit offers two distinct ambiences: warm and intimate up close, and dangerously explosive from afar.

  Matt Garstka Signature Drums marks the first GGD virtual instrument to feature two separate kick drums. Process and shape both kicks together utilizing the kick link functionality or explore unique sound design options to widen the palette of available sounds. It also features a powerful mixer with built-in studio quality effects, and 100+ presets created by the biggest names in rock and metal production.

  This instrument is a standalone plug-in and no additional software is required. Installation and activation is managed via the Cradle Hub.
