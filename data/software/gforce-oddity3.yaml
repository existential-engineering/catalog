description: Virtual analog synthesizer authentically modeling the classic ARP Odyssey, with over 1,250 presets, X-Modifier modulation, and a fully scalable UI with three authentic skins.
details: |-
  Oddity3 is a virtual analog synthesizer by GForce Software that authentically models the classic ARP Odyssey. It delivers a powerful and modern take on the iconic Odyssey sound, combining faithful emulation with contemporary enhancements for music production.

  Version 3 brings over 1,250 presets (including 250+ newly created), a powerful preset browser with tagging and categorization, four programmable Macros, and a Vintage control that introduces authentic analog imperfections. New effects include Distortion and a Matrix Reverb. The fully-scalable UI ships with three authentic skins.

  The synthesizer features three filter types — 4023 (12dB), 4035 (24dB), and 4075 (24dB) lowpass — plus a highpass filter. Two syncable oscillators and a tunable sub-oscillator form the core sound engine, alongside an authentic ring modulator and X-Modifier technology for extensive modulation routing. Voice modes include Monophonic, Legato, Duophonic, and Polyphonic, with stereo pan spread.
