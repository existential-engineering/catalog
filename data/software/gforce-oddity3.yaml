  - Presets: 1,250+ (250+ new in v3)
  - Oscillators: 2 syncable + tunable sub-oscillator
  - Filters: 4023 (12dB LP), 4035 (24dB LP), 4075 (24dB LP), highpass
  - Ring modulator: Authentic ARP Odyssey-style
  - Modulation: X-Modifier technology
