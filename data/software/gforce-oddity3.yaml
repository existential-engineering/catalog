description: Virtual analog synthesizer authentically modeling the classic ARP
  Odyssey, with over 1,250 presets, X-Modifier modulation, and a fully scalable
  UI with three authentic skins.
details: |-
  Oddity3 takes the character and sound of Oddity and adds a wave of enhancements, bringing the spirit of the original to a new generation of music makers. With a preset browser and 1250+ presets including 250+ new ones, new distortion and reverb effects, a Vintage control for dialling in authentic imperfections, four programmable macros and improved performance controls, the desert island synth has been extended.

  With the sound and character of the original hardware at its core, Oddity3 offers authentic models of all three original filters, two syncable oscillators, a recreation of the ring modulator, and AR and ADSR envelopes. Over the years GForce enhanced these original features extensively, adding monophonic and polyphonic playability, a tunable sub oscillator, X-Modifier technology, onboard effects and voice panning.

  Using X-Modifier technology, with a unique LFO and envelope for almost every parameter on the synth, Oddity3 allows you to create complex sounds. While the tone and character of the synth remain authentic to the original, the X-Modifiers take the classic sound to further possibilities.

  Oddity3 is as happy screaming as it is singing. With raw oscillators, gritty filters, hardsync and a ring mod circuit, the original hardware was made to shred, and Oddity3 retains that character while adding new ways to add dirt: the new distortion circuit mangles sounds further, and the Vintage control dials in analogue inaccuracies to taste.

  Alongside 250+ brand-new presets created by GForce sound designers and guest synthesists, Oddity3 gives access to over 1000 legacy presets from Oddity and Oddity2, all categorised and tagged, plus 66 presets faithfully recreated from original patch books, for a total of over 1250. Registered Oddity or Oddity2 owners can upgrade by logging in and adding Oddity3 to the basket.
specs: |-
