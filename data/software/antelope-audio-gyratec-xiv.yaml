description: What makes the Gyratec XIV a true passive tube EQ is its unique
  parallel G14 filter design. Exclusive real-time effect for the Antelope Audio
  Synergy Core.
details: |-
  Inspired by the legendary Pultec passive EQP design, the Gyraf Audio Gyratec XIV uses the same parallel filter topology as its older predecessor whilst extending its versatility and capability to new staggering heights. This modern take on the Pultec EQP offers 5 individual bands with 11 switchable frequencies per band, making a whopping number of 55 individual frequency choices to boost or cut. In addition, each of the bands is equipped with variable 'Q' and a cut/bypass/boost switch.

  What makes the Gyratec XIV a true passive tube EQ is its unique parallel G14 filter design. That allows for a set of inductors and capacitors to switch in and out of the circuit combined with a tube-based makeup gain/output stage.

  One of its unique qualities is the behavior of the variable 'Q' setting. When a band is set to 'boost', the 'Q' is rather wide. When set to 'cut' however, the sharpness of the filter becomes much more narrow and aggressive, approaching a notch in extreme settings. That makes the Gyratec XIV both a powerful mastering equalizer and a precise surgical tool.

  Another side effect of Gyratec's circuit topology is the subtle widening of the stereo picture when used on stereo sources. When applied on a Mix Bus that effect carves more space in the mix without any audible artefacts or phase deformation.

  Here at Antelope Audio we modelled every single component of the original hardware unit, from the inductors & capacitors to the precise impedance of the input and output transformers. We then re-built the Gyratec XIV in a digital form using its original schematics. In addition, our Gyratec XIV AFX offers a mono mode of operation making it an efficient mix tool for practically any source and any situation.
specs: |-
  - Stereo passive tube equalizer modeled on the Gyraf Audio Gyratec XIV (Pultec EQP-style)
  - 5 individual bands with 11 switchable frequencies per band (55 total frequency choices)
  - Variable 'Q' and cut/bypass/boost switch on every band
  - Parallel G14 filter topology with switchable inductors and capacitors
  - Tube-based makeup gain / output stage
  - Variable Q behavior: wide when boosting, narrow/notch-like when cutting
  - Subtle stereo widening on stereo sources without phase deformation
  - Mono mode of operation available
  - Runs in real-time with near-zero latency on Antelope Synergy Core interfaces
  - Runs natively in your DAW on macOS or Windows (up to 36 instances via AFX2DAW)
