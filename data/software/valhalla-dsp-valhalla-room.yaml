details: |-
  ValhallaRoom is a versatile, true stereo algorithmic reverb plugin. It features twelve original reverberation algorithms designed to produce natural, lush reverb sounds suitable for a wide range of mixing and sound design applications.

  The plugin offers both Early and Late reverb sections with independent modulation controls. The main interface provides five primary sliders for immediate sonic shaping: Mix, Predelay, Decay, High Cut, and Depth, allowing quick adjustments to the most impactful parameters.

  ValhallaRoom includes twelve distinct reverb algorithms: Large Room, Medium Room, Bright Room, Large Chamber, Dark Room, Dark Chamber, Dark Space, Nostromo, Narcissus, Sulaco, LV-426, and Dense Room. Each algorithm offers a unique character ranging from realistic room simulations to more creative, otherworldly spaces.

  Version 2.0.0 introduced new Space and Lo Cut controls, expanding tonal shaping capabilities. The plugin features a resizable GUI with two color schemes, a built-in tooltip system for parameter documentation, and full preset management with clipboard sharing support.
specs: |-
  - True stereo processing (stereo-in, stereo-out)
  - 12 original reverb algorithms
  - Independent Early and Late reverb sections with modulation
  - Resizable GUI with 2 color schemes (Blue and Red)
  - Space control for spatial dimension adjustment
  - Lo Cut and Hi Cut frequency controls
  - Preset management with clipboard copy/paste sharing
  - Tooltip system with built-in parameter documentation
  - 64-bit processing only
  - Mac: OSX 10.9+, Intel and Apple Silicon (M1-M5) native
  - Windows: 7, 8, 10, 11
