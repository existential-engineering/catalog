details: |-
  The Bollywood Harmonium is a finely sampled indian harmonium playable virtual
  instrument. Deep sampling with all articulations has been done. Also includes
  stereo width, distortion, chorus, reverb to sculpt your own sounds.

  Also included are 100 MIDI files of played bollywood/bhangra/ indian music
  phrases, chords, leads. Includes a special "vintage mode" wunder audio peq1r
  neve clone eq/ pre amp, for the polished silky, clear, transformer sound.

  Light compression was used to record each note at multiple velocities using
  the empirical labs distressor. The sound was then digitized using the finest
  most musical a/d converters: the apogee symphony system.

  The instrument was stereo mic'ed and the positions were changed for capturing
  each note sonically accurately and keeping a beautiful stereo image intact
  using a pair of akg c414s.

  Operation switches: octave switch, keynoise, wind, legato, attack. Effects:
  chorus, stereo width, distortion, reverb, arpeggiator, additional effects via
  uvi player.
specs: |-
  - Deep sampling with all articulations
  - Stereo width
  - Distortion
  - Chorus
  - Reverb
  - 100 MIDI files
  - Octave switch
  - Keynoise
  - Wind
  - Legato
  - Attack
  - Arpeggiator
  - Additional effects via uvi player
  - Multiple velocities
  - Stereo mic'ed
  - Vintage mode
