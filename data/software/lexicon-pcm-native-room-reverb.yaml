description: Lexicon PCM Native Room Reverb plug-in applies three decades of
  reverb expertise to room simulation, with hundreds of presets built around the
  flexible Room algorithm introduced in the PCM96. Discontinued.
details: |-
  The PCM Native Room Reverb plug-in applies Lexicon's three decades of reverb expertise to room simulation, putting hundreds of presets of unparalleled reverb perfection at your fingertips and letting recordings carry the distinct sound of Lexicon.

  The Room algorithm, originally introduced in the PCM96, is one of the most flexible algorithms Lexicon has created. It's well suited to post-production work such as ADR and Foley, music production where simulating real recording studio spaces matters, and special effects including reverse reverbs, gated reverbs, and unconventional spaces.

  The plug-in includes over 200 studio-quality presets, full parameter automation support, an intuitive user interface, a real-time spectral display with input/output metering, and portable preset files. It runs on Mac and Windows in VST, AU, and RTAS hosts and requires an iLok2 for authorization.
specs: |-
  - Over 200 studio-quality presets
  - Full parameter automation support
  - Intuitive user interface
  - Real-time spectral display with input/output metering
  - Portable presets
  - iLok2 authorization required
