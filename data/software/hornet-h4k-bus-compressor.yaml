description: Discover the H4K Bus Compressor from HoRNet Plugins, offering classic VCA compression with advanced features.
details: |-
  Experience the legendary ‘big console sound’ that has defined countless hit records with the HoRNet H4K bus compressor. This powerful plugin emulates the classic VCA circuitry, enhancing your mix with cohesion, power, and clarity. Whether you’re mixing music, film scores, or broadcast audio, the HoRNet H4K is designed to give your projects that professional edge, often found in iconic mixes that stand the test of time.

  The HoRNet H4K bus compressor brings the iconic “glue effect” directly into your favorite DAW. Known for its ability to tighten up a mix, this plugin mimics the sound of analog compressors that have shaped the sound of countless records. The VCA-based compression design delivers the smooth, transparent compression that brings all your tracks together. With the H4K, you can achieve that coveted, solid sound without needing a physical hardware unit, making it a vital tool for anyone looking to master the art of dynamic control in their mixes.

  The HoRNet H4K bus compressor features a blend of classic and modern features. Traditional multi-position switches for RATIO, ATTACK, and RELEASE are provided for musicians and engineers who are accustomed to working with analog gear. These controls give you the flexibility to dial in compression settings that suit your mix and your preferences. Alongside these, the plugin offers continuously variable potentiometers for THRESHOLD and MAKE-UP, giving you fine control over how the compressor reacts to incoming audio signals. These traditional parameters are complemented by modern features such as fine input/output trim control, Auto Trim, Auto Gain Reduction, Auto Attack/Release calculations, oversampling, and a dry/wet ratio. This blend of classic and contemporary elements ensures that you can get the best possible sound with minimal effort.

  One of the standout features of the HoRNet H4K bus compressor is its ability to bypass the compression stage while keeping the analog amplifier emulation active. This allows you to use the plugin not only as a compressor but also as an analog saturation tool. The analog saturation adds warmth and harmonic richness to your sound, making it an excellent choice for adding character to drums, vocals, and even the entire mix.
specs: |-
  - Classic VCA BUS compression
  - Full analog emulation of the VCA circuitry
  - Ratio control with three preset values: 2:1, 4:1, and 10:1
  - VUMeter for carefully checking the Gain Reduction levels
  - Ability to disable the compressor with the IN button
  - Automatic volume compensation for gain reduction
  - Adjustable pre and post analog emulation input and output levels
  - Automatic input level setting
  - Ability to link input and output to maintain constant signal level
  - Automatic input level setting to achieve the desired gain reduction
  - Automatic attack and release times, with the option for manual adjustment
  - Ability to blend the compressed signal with the original for parallel compression
  - Oversampling from 2x to 8x with automatic setting
  - Bypass button to completely disable the plugin
  - Ability to disable analog emulation and noise separately
  - Load and save buttons for managing presets
  - Compatible with macOS 10.13 and later, and Windows 10 and later
  - Available in VST3, AAX, and Audio Unit formats
  - Freely resizable interface
  - Available in both light and dark themes
  - Apple Silicon native support
  - No copy protection
