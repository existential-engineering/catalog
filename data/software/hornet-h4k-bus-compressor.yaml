description: Discover the H4K Bus Compressor from HoRNet Plugins, offering classic VCA compression with advanced features.
details: |-
  The HoRNet H4K bus compressor emulates the classic VCA circuitry behind the legendary 'big console sound', adding cohesion, power and clarity to a mix. It is aimed at music, film score and broadcast work, bringing the analog 'glue effect' into the DAW without a physical hardware unit.

  The plugin blends classic and modern controls. Traditional multi-position switches handle RATIO, ATTACK and RELEASE for engineers used to analog gear, while continuously variable potentiometers cover THRESHOLD and MAKE-UP. Those are complemented by fine input/output trim control, Auto Trim, Auto Gain Reduction, automatic attack and release calculation, oversampling and a dry/wet ratio for parallel compression.

  The compression stage can be bypassed with the IN button while the analog amplifier emulation stays active, turning the plugin into an analog saturation tool that adds warmth and harmonic richness to drums, vocals or a full mix. Automatic gain compensation manages the volume changes caused by gain reduction, keeping output levels consistent regardless of how much compression is applied. Pre and post emulation gain levels can be set automatically (Auto Trim) or linked together (Link I/O).

  Six selectable attack times are offered (0.1, 0.3, 1, 3, 10 and 30 ms), alongside release times of 0.1, 0.3, 0.6 and 1.2 seconds plus an AUTO setting that adjusts the release in real time to the characteristics of the incoming audio. A VU meter shows gain reduction.

  Variable oversampling from 2x to 8x lets you trade sound quality against CPU load, reducing aliasing and other artifacts, and the oversampling rate can be selected automatically from the session sample rate. Load and save buttons manage presets, the interface is freely resizable with light and dark themes, Apple Silicon is natively supported, and the plugin ships with no copy protection.
specs: |-
  - Classic VCA BUS compression
  - Full analog emulation of the VCA circuitry
  - Ratio control with three preset values: 2:1, 4:1, and 10:1
  - VUMeter for carefully checking the Gain Reduction levels
  - Ability to disable the compressor with the IN button
  - Automatic volume compensation for gain reduction
  - Adjustable pre and post analog emulation input and output levels
  - Automatic input level setting
  - Ability to link input and output to maintain constant signal level
  - Automatic input level setting to achieve the desired gain reduction
  - Automatic attack and release times, with the option for manual adjustment
  - Ability to blend the compressed signal with the original for parallel compression
  - Oversampling from 2x to 8x with automatic setting
  - Bypass button to completely disable the plugin
  - Ability to disable analog emulation and noise separately
  - Load and save buttons for managing presets
  - Compatible with macOS 10.13 and later, and Windows 10 and later
  - Available in VST3, AAX, and Audio Unit formats
  - Freely resizable interface
  - Available in both light and dark themes
  - Apple Silicon native support
  - No copy protection
