details: >-
  Audio design desk is an ai-assisted content creation tool that reinvents the
  process of connecting audio to video. We've developed proprietary a.I., called
  sonic intelligence, to power the user experience in audio design desk (add)
  and completely reinvent the way people think about finding, using, and syncing
  sound with video.


  Audio design desk is intelligent, so it's aware of the types of sounds and
  music you import, use in your projects, and will even make qualified and
  informed recommendations to help keep your projects evolving. This turns a
  once tedious and time-consuming process into a fun and efficient workflow.


  Audio design desk comes bundled with over 50,000+ royalty-free sounds with a
  team of composers releasing new effects, compositions, and sound design each
  week.


  Add's intuitive and innovative content creation tools empower filmmakers,
  sound designers, composers, and creators to produce cinema-quality
  compositions at the speed of thought, giving them a level of creative control
  unmatched by any other software.


  Personal license tier does not offer: weekly sound pack updates, license to
  use sounds royalty-free for broadcast media, commercial use, streaming, and
  vod, multichannel/xml/aaf export, uncompressed audio files.
