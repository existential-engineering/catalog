details: |-
  Introducing autoBUS, part of the autoseries with autodyn and autoeq - the
  first plugins to combine the legendary analogue character of the ssl 4000
  console with sonible's industry-leading ai-assisted audio analysis. Modelled
  on arguably the most converted production tool ever created - the bus
  compressor from the legendary ssl 4000 g console - autoBUS analyses your
  audio, presents profile-based, style-matched settings, and instantly delivers
  mix bus or subgroup processing that remains fully editable.

  Autobus delivers the power, punch, and drive of the legendary ssl bus
  compressor from the g series console - now with intelligent, audio-aware
  assistance thanks to sonible. The ssl 4000 g transcended genres, helping shape
  countless chart-topping hits in pop, rock, and hip-hop. Its capabilities were
  embraced by legendary engineers and producers such as tom lord alge, bob rock,
  and mixedbyali, with artists including bruce springsteen, pink floyd, nirvana,
  and massive attack, all writing music history with the 4000 g.

  Profile tells the ai assistance what source it's working with, genre-specific
  full mix options including electronic, pop, r&b, metal, rock, hip-hop,
  acoustic country, and funk, optimising processing for that signal type and
  genre. Beyond full mix, there are also vocal, guitar, and drum bus profiles,
  giving you even more tailored options for different elements of your
  production. Unlike a preset with fixed parameters, a profile adapts
  intelligently to your input.

  Style shapes the character of the processing: strong, medium, or soft.
  Together, profile and style give you flexible, editable starting points. Let
  sonible's ai analyse your audio and deliver real-time recommendations, so you
  can move fast, stay creative, and achieve musical results with the authentic
  ssl bus compressor sound.

  The ssl autobus delivers console accurate dynamics derived from the ssl 4000 g
  bus compressor. It promises to bring cohesion and strength to your mix, with
  your productions sounding bigger, with more power, punch and drive. The
  autobus comes integrated with sonible's ai assisted audio analysis, which
  detects source characteristics and recommends optimal bus compression settings
  that you can choose to accept, refine, or override.
