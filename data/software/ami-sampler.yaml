details: |-
  The commodore amiga revolutionized the home computer when it hit the shelves in 1985. Not only sporting colourful 16-bit graphics but also boasting four channels of 8-bit sampled audio. With sample sequencing software like protracker and octamed, it was the first computer that allowed its users to record and sequence instruments into a full song; inspiring musicians, programmers, graphic designers, and hackers to show what they could really do with the new technology that the amiga gave them.

  The ami sampler brings that feel and that sound into the modern world of digital audio workstations. Obviously heavily inspired by the amiga, as well as protracker and fasttracker, it also draws inspiration from last trackers like triton's fasttracker ii and milkytracker in addition to some modern sampler VST plugins.

  While in no way an emulator nor a recreation of the limitations that the late 80s software had, the ami sampler strives to take the classic sound of the amiga but still allow it to stand up with a modern DAW setting.
