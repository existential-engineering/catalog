description: Beatmaker EDEN is a dance music and EDM specialist, comfortable headlining any venue from small sweaty Berlin clubs to ginormous global festivals.
details: |-
  Beatmaker EDEN delivers the punchy kicks, tight snares, and driving rhythms needed for EDM, festival anthems, and club bangers. Instant drops, no programming required.

  EDEN is built for festival bangers, club anthems, and high-energy EDM drops, with massive drums, tight grooves, and hands-in-the-air energy.
specs: |-
  - 10 hard-hitting kits
  - 20 styles, 460 patterns
  - Custom-built for EDM
  - Special control: Riser FX
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8GB of RAM
  - 0.96GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Supported standards: MIDI
  - Requires the latest version of the UJAM App, which installs the Beatmaker plug-in that hosts all titles
