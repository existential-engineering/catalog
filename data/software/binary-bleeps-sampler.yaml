name: Binary Bleeps Sampler
manufacturer: binary-bleeps
primaryCategory: sampler
url: https://www.binarybleeps.com/
description: Binary Bleeps Sampler is an audio capture and performance
  instrument with motion-controlled pitch, filter, delay, and lo-fi bit crusher
  effects.
details: |-
  Sampler's pads are velocity sensitive and trigger samples with very low
  latency for expressiveness and great playability. Recording is input sensitive
  to ensure firm sample start points without further editing. Sensitivity is
  adjustable to your input source.

  Effects parameters are motion-controllable and can be individually assigned to
  your device's tilt axes. Sampler comes with a real-time pitch shifter, a
  resonant lowpass filter, a feedback delay and a lo-fi bit crusher, all of
  which can be active simultaneously.

  Additionally, compression and saturation are available to boost and color your
  beats. Performances can be copied into other apps or transferred to your
  computer via itunes file sharing. Audiocopy and audiopaste are supported.

  Record from the microphone or paste audio from other apps. Play your samples
  from velocity sensitive pads. Control effects through the motion of your
  device. Save samples and record performances. Metronome with auditive and
  visual feedback.
specs: |-
  - Velocity-sensitive pads
  - Real-time pitch shifter
  - Resonant lowpass filter
  - Feedback delay
  - Lo-fi bit crusher
  - Motion-controlled effects
  - Compression
  - Saturation
  - Input-sensitive recording
  - Low latency sample triggering
  - Adjustable recording sensitivity
  - Tilt axis motion control
  - Metronome with auditive and visual feedback
  - Audiocopy support
  - Audiopaste support
  - Itunes file sharing
  - iOS standalone application
