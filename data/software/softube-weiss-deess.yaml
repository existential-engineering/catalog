description: With the Weiss Deess plugin Softube aimed to create a truly useable
  de-esser plugin for the modern studio. The de-essing unit used in top
  mastering studios the world over. Like some other Weiss plugins, it has
  code-ported algorithms from the legendary DS1-MK3.
details: |-
  Whether you're trying to tame sibilance in a lead vocal, rein in a sharp-sounding hi-hat, or reduce harshness while mastering, a truly great de-esser is as elusive as it is essential. Enter the Weiss Deess, available as an individual plug-in or as part of the Weiss DS1-MK3 collection.

  With a combination of the highly-prized sonics of the industry gold-standard Weiss DS1-MK3, the go-to digital hardware de-essing unit used in top mastering studios the world over, and a totally modern and focused approach in design, Softube is psyched to announce the Weiss Deess Plug-in. Stop searching, start succeeding, this is the de-esser.

  The Weiss Deess has two completely independent bands. Most de-essers have one, but almost no sibilant has a single-frequency focus, especially when you're dealing with complex material or mastering applications. The variety of filter shapes and excellent band-width control allows you to home in on precisely what you need to deal with, without collateral damage.

  A large, colorful, and intuitive display shows FFT readouts as well as your filter shapes, so you can clearly see what effect you're having on your signal. The uncluttered GUI gives you great visual information, but a side-menu allows control over everything. And that means everything; ratios, attack and release times, knee settings, make-up gain and more.

  The Weiss algorithms, code-ported from the gold-standard DS1-MK3 unit, provide world class de-essing precision, meaning that unlike many de-essers you can rely on the Weiss Deess to improve the sound of your material, even at relatively extreme settings. It does the job effectively and transparently, without hassle or artefact.
specs: |-
  - World class de-essing, with code-ported algorithms from the industry standard DS1-MK3
  - Two bands of de-essing. This is the only de-esser you'll need
  - Stunning and intuitive visualisations make this de-esser a breeze to use
  - Clean tweak-and-go faceplate, with immensely detailed controls hidden in side-menu
  - Ultra-professional tool, but without the daunting, complex look
  - Low-latency mode allows you to de-ess while tracking a vocal
  - All the versatility you need in terms of filter shapes, frequencies etc.
  - FFT readouts and filter shape display
  - Side-menu control over ratios, attack and release times, knee settings and make-up gain
  - Supports Softube Extended Features side panels
  - Console 1 Ready: usable within the Console 1 mixing system
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26
  - System requirements: Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access for downloading installers and managing licenses
  - Three activations included
  - 20-day trial, 14-day returns
