details: |-
  99 sound effects is a collection of sound effects for use in trailers, film scores, game development, music production, podcasts, and other creative purposes. The included sfx files were edited and mastered to be completely production-ready.

  The library includes braams, drones, cinematic impacts, and other types of sound effects designed for use in movies. We have also included a collection of esoteric audio textures and soundscapes that can be useful for adding a dystopian sci-fi atmosphere to your audio and video projects.

  99 sound effects features a selection of retro-inspired sound effects that were crafted using analog synthesizers and outboard gear. The idea here was to recreate the sound design techniques used in the 80s movie soundtracks.

  The library contains 8 braams, 2 downers, 8 drones, 14 impacts, 5 metal hits, 4 noises, 4 punches, 9 retro sounds, 4 risers, 12 short sfx, 4 subs, 9 swish sfx, 10 textures, and 6 whoosh sfx. An instrument patch for ni kontakt is also included.
