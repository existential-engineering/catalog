details: |-
  Pilot Bass is a MIDI-generating plugin from Mixed In Key's Pilot Plugins line, built for writing basslines. Create amazing basslines using the styles inside Pilot Bass.

  On the left side, there is an option to choose the style of music you would like to make. Some styles are meant to be used for pop, some are for melodic techno and other musical genres and every style has its own unique control knobs. As you learn the different styles, you can use them in ways that they weren't intended, like trying a pop melody over a house track, or using a melodic techno arpeggio over trap drums. The possibilities are almost endless.

  Each time you rotate a knob, you'll see different MIDI notes generated in the center preview section. If you want to see the results up close, click on the edit icon to expand for a more detailed view. Pilot Bass is fully MIDI editable on this detailed view, so you can add, delete and move notes to your liking using your mouse or trackpad.

  The plugin is pre-loaded with custom synthesizers, 250+ cutting-edge sounds for every genre, including Neptune 106Bass, Ultra Arp Pluck, Big Room Lead, Vintage Analog and Alternation Bell.

  Pilot Bass is one of the Pilot Plugins that work together in unison, powered by the award-winning Phase Plant synth. You can use Pilot Plugins with Ableton Live, Apple Logic Pro, FL Studio, Studio One, and many other DAWs, on Windows and macOS including the new Apple Silicon chips.
specs: |-
  - 8 bassline styles: Foundation (B1), Offbeat (B2), Disco Bass (B3), Clave (B4), Shape of Bass (B5), Splice (B6), SleepWalker (B7), Gravity (B8)
  - Every style has its own unique control knobs
  - Customizable MIDI canvas with center preview section that regenerates notes as knobs are rotated
  - Fully MIDI editable detailed view: add, delete and move notes with mouse or trackpad
  - Pre-loaded with 250+ custom synthesizer sounds
  - Included instruments: Neptune 106Bass, Ultra Arp Pluck, Big Room Lead, Vintage Analog, Alternation Bell
  - Powered by the Phase Plant synth engine
  - Works with Ableton Live, Apple Logic Pro, FL Studio, Studio One and many other DAWs
  - Compatible with Windows and macOS, including Apple Silicon chips
