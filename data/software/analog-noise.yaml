details: |-
  Analog noise adds the sound and atmosphere of analog recordings to tracks and mixes. The purpose of the plug-in is to add sounds typically found in the recordings of existing devices.

  For this goal, analog noise has 21 sound profiles, including the sound of magnetic tape with various coverings, the sound of vinyl records, and the sound of the signal of various tube and transistor devices.

  With the help of the embedded equalizer, it is possible to either emphasize or mute those parts of the noise profile. The features of the equalizer are selected in such a way that it keeps its use of noise sounding natural.

  A large range of noise level settings makes it possible to saturate the sound a little, or to greatly distort it. This allows analog noise to be used not only for adding effects to sound, but also as a source of the sound of different noises to be used in experimental styles of electronic music.

  In the set there are 55 factory presets based on 21 of noise profiles. The built-in preset manager makes it easy to save the settings and quickly access them or share them with other analog noise users. In addition, VST automation and full MIDI learn are supported.
specs: |-
  - 21 sound profiles
  - Embedded equalizer
  - 55 factory presets
  - VST automation
  - MIDI learn
  - Noise level settings
  - VST plugin
  - Windows compatible
