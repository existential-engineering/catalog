description: Tekno is the new drum synthesizer plugin by Baby Audio. Inspired by
  analog drum machines and supercharged for massive impact, Tekno's 18 drum
  synthesis engines give you deep and flexible electronic drum sounds.
details: |-
  Tekno is a modern take on the legendary drum machines that defined electronic music, hitting harder and deeper thanks to 21st century upgrades. It gives you the power to design infectious synthesized drums from the ground up.

  Tekno is a synthesizer that generates every drum hit from scratch through a complex, non-linear VA circuit. That means it never hits exactly the same way twice. Each of the 18 onboard voice engines is its own unique drum synthesizer, utilizing a combination of analog circuit modeling, FM and digital synthesis.

  Tekno v1.1 includes a brand-new creative sequencer built around two core ideas: fast beat generation using smart randomization, auto-fill and quick on/off and velocity controls, and optional unpredictability creating evolving polyrhythms with variable step lengths and lane speeds.

  Tekno's onboard effects have been crafted with the same deep circuit-modeling efforts as the drum voices. Enhance individual drums with analog-modeled tape saturation, excitation and compression.

  Includes 72 global presets and 1296 individual voice presets created by leading sound designers such as Mr. Bill, Virtual Riot and Yoad Nevo.
specs: |-
  - 18 drum synthesis engines with analog circuit modeling, FM and digital synthesis
  - Built-in creative sequencer with smart randomization and polyrhythmic capabilities
  - Choke groups, freely assignable MIDI mappings, global undo/redo
  - Per-voice Humanize option and per-voice randomization lock
  - Full kit sample export
  - Onboard effects: analog-modeled tape saturation, excitation and compression
  - Dedicated reverb bus in multi-output mode
  - Analog modeled clipper and onboard limiter in master section
  - 72 global presets and 1296 individual voice presets
  - Native Apple Silicon M-Chip support
  - 64-bit only
