description: "Alys for Alter/Ego is the first commercial voice for alter/ego.
  Alys comes with two voice libraries: a french and a japanese one."
details: |-
  Alter/ego is specially tailored for musical needs simply type in your lyrics,
  and then play on your MIDI keyboard. You can also plug it into your DAW and
  create your own scores.

  It's a true synthesizer, the sound can be extensively modified for easy and
  expressive performances.

  On december 15, 2021, phundrak (alys' developer) made alys for alter/ego free
  and released the prototype recordings under the gpl-3.0 license.
specs: |-
  - MIDI keyboard compatible
  - DAW integration
  - Sound synthesis and modification
  - French voice library
  - Japanese voice library
  - English singing capability
  - Gpl-3.0 license
