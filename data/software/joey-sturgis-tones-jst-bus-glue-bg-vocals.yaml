details: |-
  The ultimate compressor for vocal bus glue.
  JST Bus Glue BG-Vocals is a flagship compressor from Joey Sturgis Tones designed specifically to address vocal bus compression needs in any mix. This workhorse audio plugin brings a variety of flavors and character to your vocal bus, unmatched by any other vocal bus processor.
  Vocals are probably the most important element of any mix and getting those vocals to blend just right with the music is often a job for many. JST Bus Glue BG-Vocals is a powerful bus compressor created specifically to blend and balance all of your vocals in a bus while giving them the focus and attention they require. This bus compressor will change the way you work by giving you the exact tool you need for gluing your vocals in any mix.
  Five Compression Modes
  Transparent (Least Compressed)
  Bouncy
  Blend
  Bold
  Squashed (Most Compressed)
  Character Options
  Balance the compressor's response to low/high frequencies. Medium character applies slight attenuation to low frequencies and a slight boost to high frequencies while "Loud" applies more pronounced filtering in these ranges.
  Compression Strength
  Once you've selected a compression mode, dial in how hard it works with a straightforward Comp Knob from Low to Medium to Max strength.
  Mix Control
  Blend the compressed and uncompressed signals for parallel compression and punch with the Mix Knob.
  Makeup Gain
  For proper gain staging, use the Output Knob to set the perfect output level from the plugin.
  Metering & Threshold Override
  See the amount of gain reduction applied by your compressor and use the meter screw to transform JST Bus Glue BG-Vocals from a fixed-threshold compressor to a user-defined threshold value.
  About Bus Glue
  Bus Glue is a series of Bus Compressors designed to excel at controlling the dynamics of specified mix bus groups in a mix using a variety of compression and saturation types combined with over a decade of mixing knowledge and lots of practical field testing across several genres of music.
  The goal was to come up with a set of compressors that could do something other compressors weren’t made to do. Most compressor designs are too broad in application and that is why you typically need to stack compressors or insert other processors in your bus chain to achieve desired results.
  However, Bus Glue compressors are about as specific as you can get by design, but that’s what makes them so useful. By using Bus Glue as your dynamic control across your various mix busses, you’ll expand your dynamic palette while crafting a whole new sound that is unrivaled by other compression processors.
