description: Designed with a focus on user friendliness to facilitate an expedient workflow, Oud & Qanun is an excellent companion in the quest for authentic, fresh and captivating musical experiences.
details: |-
  ORIGINS VOL.4: OUD & QANUN introduces oriental colors and textures to the Sonuscore Origins series. The Qanun, a renowned Arabian relative of the Zither, is famous for its unique, melodramatic sound. The Oud has been the key instrument across Middle Eastern and North African traditional and popular music for centuries, and this forerunner of the European Lute pairs splendidly with the Qanun.

  As with all Origins libraries, both instruments can be played independently or in concord via the built-in Multi-Arpeggio-Designer (MAD). Two fully customizable arpeggiators create interlocking patterns and broad soundscapes by combining the unique timbres of the two instruments, with an engine designed to convey a musically meaningful, human performance rather than randomly aligned notes.

  Over 100 presets kickstart the creative process, and arpeggio designs can be copied and pasted between different ORIGINS instruments for use on the fly. The Colors menu adds 12 individual color presets, each radically different in character and incorporating various effect settings and multiple impulse responses; combined freely with the MAD presets, these yield over 1200 predefined combinations.
specs: |-
  - Two individually playable instruments: Oud and Qanun
  - Innovative Multi-Arpeggio-Designer (MAD) with two fully customizable arpeggiators
  - 90 rhythm presets
  - 100+ Multi-Arpeggio-Designer presets
  - 12 unique color settings, over 1200 predefined MAD/color combinations
  - Arpeggio designs can be copied between different ORIGINS instruments
  - Full customization of all controls
  - Requires the FULL version of Native Instruments KONTAKT 5.7.3 or higher (the free Kontakt Player runs the instrument in demo mode only)
  - macOS 10.11 or higher, Intel Core 2 Duo
  - Windows 7 or higher, Intel Core 2 Duo or AMD Athlon 64 X2
  - 4 GB RAM
  - At least 400 MB of free hard disc space
  - Delivered as download
