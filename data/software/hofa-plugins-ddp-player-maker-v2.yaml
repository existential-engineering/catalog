description: DDP Player Maker V2 is a standalone tool for creating custom DDP player applications for clients on Windows and macOS. Players can be branded with a custom splash screen, logo, info text and website link, support optional CD burning, and play back DDP images with CD-Text, UPC/EAN and ISRC support.
details: |-
  If you want to deliver DDP images to your clients with a matching player software, DDP Player Maker is the perfect solution for you.

  Whether your clients use Windows PCs or Macs, the DDP player works on both platforms. You can customise the splash screen and add your logo, a custom info text and a link to your website. You can also decide whether the DDP player should be able to burn CDs and include your "terms of use" that your clients have to accept before they can use the player.

  The generated player works only with the DDP image it was created for, and images can optionally be encrypted so that the audio can be opened and played back exclusively with its associated player. DDP images to pair with the player can be created using CD-Burn.DDP.Master.

  For playback and checking, the player displays CD-Text, UPC/EAN and ISRC, offers peak and EBU loudness metering plus a goniometer, and validates MD5 checksums for quality control.
specs: |-
  - Create secure encrypted DDP images with an associated player (new in V2.5)
  - Audio file export as WAV, AIFF, FLAC, Ogg-Vorbis and MP3 (new in V2)
  - CD-Text info embedded into exported WAV and MP3 files (new in V2)
  - Track transition playback (new in V2)
  - Support for multisession CDs (new in V2)
  - Revised GUI with scalable font size (new in V2)
  - Create DDP players for Windows and macOS for your DDP image
  - The player will only work with the DDP image it was created for
  - Your company logo can be used as the splash screen
  - Custom info text and website link can be added to the player
  - CD burning function can be enabled or disabled for each player
  - DDP image playback for audio CDs
  - CD-Text, UPC/EAN and ISRC
  - Support for Japanese CD-Text
  - Burn DDP images to CD
  - Export tracks as WAV files
  - ISRC in WAV files
  - Peak and EBU loudness meter
  - Goniometer
  - MD5 checksum validation
  - Easy to use, clear GUI
  - Support for PC and Mac, 32 and 64 Bit
  - English and German version available
  - Operating system: macOS 10.13 or later, Windows 10 or later
  - Two licenses included, managed via the HOFA Plugins Manager, offline activation possible
