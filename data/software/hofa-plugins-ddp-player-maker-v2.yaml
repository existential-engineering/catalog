description: DDP Player Maker V2 is a standalone tool for creating custom DDP player applications for clients on Windows and macOS. Players can be branded with a custom splash screen, logo, info text and website link, support optional CD burning, and play back DDP images with CD-Text, UPC/EAN and ISRC support.
details: |-
  DDP Player Maker V2 is a standalone software tool that lets mastering engineers and audio professionals create custom DDP players for their clients. If you want to deliver DDP images to your clients with a matching player software, DDP Player Maker is the perfect solution.

  Whether your clients use Windows PCs or Macs, the DDP player works on both platforms. You can customise the splash screen and add your logo, a custom info text and a link to your website. You can also decide whether the DDP player should be able to burn CDs and include your 'terms of use' that your clients have to accept before they can use the player.

  Version 2.5 introduced the ability to create secure DDP images with an associated player, so the player will only work with the DDP image it was created for. Version 2 added a range of new features including additional audio export formats (WAV, AIFF, FLAC, Ogg-Vorbis, MP3), CD-Text embedding in exported WAV and MP3 files, track transition playback, multisession CD support, and a revised scalable GUI.

  The software includes peak and EBU loudness metering, a goniometer for stereo monitoring, and MD5 checksum validation. It supports CD-Text, UPC/EAN, ISRC codes, and Japanese CD-Text. Each purchase includes two licenses, managed through the HOFA Plugins Manager, with offline activation and USB stick licensing support.

  DDP Player Maker V2 is available in English and German and supports both 32-bit and 64-bit systems on macOS 10.13 or later and Windows 10 or later. A 14-day free trial is available.
specs: |-
  - Create DDP players for Windows and macOS for your DDP image
  - New in V2.5: create secure DDP images with an associated player (player only works with the DDP image it was created for)
  - New in V2: audio file export in WAV, AIFF, FLAC, Ogg-Vorbis, and MP3 formats
  - New in V2: CD-Text info is embedded into exported WAV and MP3 files
