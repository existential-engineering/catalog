  You are currently viewing a placeholder content from YouTube . To access the actual content, click the button below. Please note that doing so will share data with third-party providers. More Information Unblock content Accept required service and unblock content If you want to deliver DDP images to your clients with a matching player software, DDP Player Maker is the perfect solution for you. Whether your clients use Windows PCs or Macs, the DDP player works on both platforms. You can customise the splash screen and add your logo, a custom info text and a link to your website. You can also decide whether the DDP player should be able to burn CDs and include your “terms of use” that your clients have to accept before they can use the player. Features V2.5.2 : new in V2.5: create secure DDP images with an associated player new in V2: additional formats for audio file export: WAV, AIFF, FLAC, Ogg-Vorbis, MP3 new in V2: CD-Text info is embedded into exported WAV and MP3 files new in V2: track transition playback new in V2: support for multisession CDs new in V2: revised GUI with scalable font size create DDP players for Windows and macOS for your DDP image the player will only work with the DDP image it was created for your company logo can be used as the splash screen custom info text and website link can be added to the player CD burning function can be enabled or disabled for each player DDP image playback for audio CDs CD-Text, UPC/EAN and ISRC support for Japanese CD-Text burn DDP images to CD export tracks as WAV files ISRC in WAV files peak and EBU loudness meter goniometer MD5 checksum validation easy to use, clear GUI support for PC and Mac, 32 and 64 Bit English & German version available Feedbacks
