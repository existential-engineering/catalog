description: Beatmaker CHROMED is a virtual drum instrument built for hyperpop, glitchcore, and high-energy electronic beats. Loud, weird, and fast.
details: |-
  Beatmaker CHROMED is a virtual drum instrument built for hyperpop, glitchcore, and high-energy electronic beats. Loud, weird, and fast. Just load it up and go.

  From distorted mayhem to punchy pop grooves, CHROMED is made for drums that stand out and break the rules, with 10 drum kits drawn from 160 unique instrument samples, 20 styles and 460 patterns, and 12 multi-FX mix modes made for chaos. It was designed by BABii and Derek von Krogh.

  CHROMED is one of 17 genre-focused drum instruments in the Beatmaker series, all hosted inside a single Beatmaker plug-in that is installed by the UJAM App with your first Beatmaker title.
specs: |-
  - 10 drum kits, 160 unique instrument samples
  - 20 styles, 460 patterns
  - 12 multi-FX mix modes
  - Designed by BABii and Derek von Krogh
  - MIDI drag and drop
  - Royalty-free MIDI phrases and sounds
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 0.96 GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, 64-bit only
  - Automated installation via the UJAM App, which also installs the Beatmaker plug-in that hosts all titles
  - Authorization via the UJAM App
  - Supported standards: MIDI
