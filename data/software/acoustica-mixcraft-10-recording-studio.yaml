description: Mixcraft is the renowned digital audio workstation for Windows from
  Acoustica, designed for musicians by musicians. With its unique combination of
  ease of use and professional features at an irresistible price, Mixcraft has
  been a favorite among music enthusiasts and professionals since its
  introduction in 2004.
details: |-
  Mixcraft 10 Recording Studio is the mid-tier edition of Acoustica's DAW,
  offering unlimited audio and MIDI tracks, 16 virtual instruments, and 36
  effects. It builds upon the Home Studio edition with professional features
  including plugin parameter automation, drag-and-drop automation, curved
  automation for volume and panning, and vocoder tracks.

  Recording Studio includes advanced mixer panels, sidechaining support,
  tempo-synced LFOs, natively integrated Celemony Melodyne 5 Essential for pitch
  correction, and ReWire hosting for connecting to other DAWs. The edition
  provides a comprehensive production environment suitable for intermediate to
  advanced users.

  The 10.6 update added an improved Piano Roll with color-coded steps,
  multi-clip viewing, and snap-to-scale functionality, along with enhanced MIDI
  editing with advanced note selection and easier velocity/CC editing. Support
  for over two dozen popular control surfaces was also added.

  Rent-to-own plans are available starting at $8/month, making the software
  accessible through flexible payment options.
specs: |-
  - Unlimited audio and MIDI tracks
  - 16 virtual instruments
  - 36 effects
  - Plugin parameter automation
  - Drag-and-drop and curved automation (Vol/Pan)
  - Vocoder tracks
  - Advanced mixer panels with sidechaining
  - Tempo-synced LFOs
  - Celemony Melodyne 5 Essential integration
  - ReWire hosting
  - Per-track parametric EQ and oscilloscope
  - 7,500+ loops, sound effects, and samples
  - Video editing and scoring environment
  - Improved Piano Roll with snap-to-scale
  - Support for 24+ control surfaces
  - Requires 64-bit Windows 7 SP1, 8, 10, or 11
  - Minimum: 4GB RAM, 1.8 GHz Dual Core CPU
  - Recommended: Windows 10+, 8GB+ RAM, 3.0 GHz Quad Core+ CPU
releaseDate: "2023"
