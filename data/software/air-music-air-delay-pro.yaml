description: "Autoclear gives you the option to have enormous delay based
  effects that stop when you need them to, for example, when the next note hits.
  Once you've used it you'll wonder how you ever used an echo without it."
details: |-
  Autoclear gives you the option to have enormous delay based effects that stop
  when you need them to, for example, when the next note hits. Once you've used
  it you'll wonder how you ever used an echo without it.

  Diffusion is a cool effect that smears the delay sound, taking it into the
  realm of a reverb, it's a way of knocking off some of the hard edges. Just
  like a reverb you can also adjust the size of the space and widen the stereo
  image.

  Envelope follow allows you to control how the delay evolves over time. You can
  have the delay time, feedback, and mix change over time with control over when
  that happens using ceiling and release time.

  Features include a wide range of logically categorised presets, three stereo
  modes for creating complex offset and bouncing delays with width control,
  comprehensive feedback section, modulation section with three distinct modes
  (wobble, stereo and chorus) with slow and fast modulation control for classic
  tape emulation effects, and output section with high and low pass filtering,
  width, balance and mix controls.
specs: |-
  - Dual engine (analog and digital)

  - Up to four second delay time

  - Fully bpm syncable

  - Three stereo modes

  - Digital and analog behaviours

  - High and low pass filters

  - Resonant filter with resonance and lfo

  - Distortion and limiter

  - Auto-clear function

  - Diffusion section with stereo switch and size control

  - Modulation section (wobble, stereo and chorus modes)

  - Envelope follower assignable to time, feedback and mix parameters

  - Parametric eq band

  - Output section with high and low pass filtering, width, balance and mix
  controls

  - VST plugin (32-bit and 64-bit)

  - Audio units plugin (64-bit only)



  - Windows 10, 8 or windows 7 service pack 1

  - Mac os x 10.8.5 - mac os 11.1

  - Minimum dual core 2ghz processor

  - Minimum 1gb ram

  - 1gb free hard drive space

  - Ilok authorisation required
