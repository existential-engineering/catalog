details: |-
  Pro version with full feature set: AI Analysis, Loudness, Loudness Meter, Output Meter, Input Trim, Visualizer, Bypass, Gain Match, Mastering Styles, EQ, Presence, De-Esser, Stereo Width, and Dynamics. Unlimited in-DAW masters. Perpetual license option available. 3-Day Free Trial available. Sound on Sound Awards 2025 — Best Software Plug-In Nominee. Requires macOS 10.14+ (Apple Silicon native or Intel) or Windows 10 64-bit+.

  Real-time processing in the plugin lets you hear your mastered sound as you perfect your mix. Avoid time-consuming bounces out of the DAW and revise track versions on-the-fly.
