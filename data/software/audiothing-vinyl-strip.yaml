description: "Vinyl Strip is a multi-effect plugin featuring 6 modules:
  Distortion, Compressor, Bit Crusher, Tilt EQ, Vintage Reverb, and Vinylizer."
details: |-
  Vinyl Strip is a multi-effect plugin featuring 6 modules: Distortion, Compressor, Bit Crusher, Tilt EQ, Vintage Reverb, and Vinylizer. The modules can be arranged in any combination by simple drag-n-drop. Vinyl Strip will add life and an old school touch to your samples and tracks, and achieve that classic vinyl record sound in your digital environment. The plugin is optimised to be lightweight on the CPU.

  Much more than just a vinyl emulator, Vinyl Strip features 6 modules dedicated to recreating that classic vintage/old school sound of vinyl recording and sampling: Distortion chooses which kind of harmonics you want to generate, Compressor makes it easy to get a softer or harder sound, Sampler recreates the sound quality of early samplers, Tilt EQ balances the sound like an old hi-fi system, Reverb adds a warm vintage space, and Vinyl emulates the dust, noise, warp, and response of vinyl.

  You can customize your channel strip with a simple drag-and-drop. By default, all modules (except the Master module) can be moved and re-arranged to create different signal flows, so you can decide to add the compressor module after the vinyl emulation, or vice versa.

  Vinyl Strip is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP). It is also available on the App Store for iOS and iPadOS (AUv3 and Standalone).
specs: |-
  - 6 modules: Distortion, Compressor, Bit Crusher, Tilt EQ, Reverb, and Vinylizer
  - All modules can be arranged by drag-n-drop
  - Lightweight on CPU
  - Resizable Window
  - Brightness and Contrast Controls
  - Preset system with randomizer
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP 64-bit)
  - macOS 10.13 - macOS 15, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP 64-bit)
  - 1 license up to 3 computers, no iLok, no internet connection required to activate
