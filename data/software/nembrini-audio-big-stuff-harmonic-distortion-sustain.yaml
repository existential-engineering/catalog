description: Nembrini Audio Big Stuff Harmonic Distortion-Sustain is modeled on an Electro Harmonix Big Muff pedal, delivering a sweet violin-like sustaining sound associated with the legendary tone popularized by Jimi Hendrix.
details:
  - Nembrini Audio Big Stuff Harmonic Distortion-Sustain is a faithful model of the iconic Electro Harmonix Big Muff pedal, one of the most celebrated fuzz/distortion pedals in music history. The plugin captures the pedal's distinctive harmonic character and its ability to produce a sweet, violin-like sustaining sound.
  - The plugin features a combined high pass/low pass tone control (Filter) that allows shaping the tonal character of the distortion, from thick and woolly to brighter and more cutting. A -15dB option is included for achieving cleaner tones while still retaining the pedal's harmonic flavor.
  - Big Stuff is available as a free plugin for desktop DAWs on Mac and Windows, as well as a standalone iOS app for iPhone and iPad through the Apple App Store.
