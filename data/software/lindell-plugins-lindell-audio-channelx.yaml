  rearrangeable module order and stereo operation."
details: |-
  The Lindell ChannelX is a virtual collection of 3 amazing Lindell units, the 7X-500 limiter, the PEX-500 EQ and the 6X-500 preamp. Start off with the 6X-500 preamp to add a bit of punch and color, then add some tasty vintage 1176-style FET compression with the 7X-500 limiter, and top it off with some Pultec inspired PEX-500 EQ.

  The Lindell 6X-500 preamp is a fantastic tool for cleaning up and adding a little extra punch to your tracks. The original 6X-500 hardware is a mono transformer-coupled preamplifier and passive 2 band, boost-only EQ. The preamp's all discrete design is based upon Lindell's hybrid amplifier providing smooth, creamy gain and color. This module is a faithful emulation of the original hardware with a few extra features like High and Low Pass filters with variable slopes thrown in. By twisting up the Gain knob a bit and dialing in a little bit more highs or lows, you can pull a track subtly out of the mix, or push it right into your face.

  Lindell's PEX-500 hardware is a mono, transformer-coupled, passive Pultec-style equalizer. Its discrete, Lindell's hybrid based design, provides up to 15dB boost of smooth silky high end and the punchiest low end you're likely to find. Along with unique features closely associated with Pultec EQs, including the ability to simultaneously cut and boost a given frequency. The PEX-500 plugin also includes a few extra tricks not found on the original hardware, like additional high frequency selections and a Mid/Side (M/S) matrix.

  The original Lindell 7X-500 unit is a FET compressor in the vein of the 1176 that incorporates hard-to-find features for a hardware device, such as High Pass sidechain filter, and a Mix control for blending between dry and wet signals for parallel compression effects. It can be smooth and vibey or a complete rock'n'roll monster, using its explosive 100:1 ratio. The 7X-500 plugin, in addition to being a faithful emulation, is a further evolution of the original hardware, adding useful features like stereo operation and continuously variable attack and release controls.

  All 3 models are contained in a single virtual 500 series frame, which lets you use any or all of these modules at once, and even freely rearrange the order of the plugins in the frame. Each of these modules is a memorable tone monster in itself, and all three together will give you some of the most instant analog mojo you can find this side of a mouse.
specs: |-
  - Supported plugin formats: AAX Native, AU, RTAS, VST2, VST3
  - Supported operating systems (macOS): macOS 26 down to macOS 13
  - Supported operating systems (Windows): Windows 11 down to Windows 10
  - Mac: Intel, or Apple Silicon
  - PC: x64-compatible CPU
  - Display resolution: 1440 x 900px or 1280 x 960px or higher
  - Memory: 2 GB RAM
  - Three Lindell 500 series module emulations in one virtual frame: 6X-500 preamp, PEX-500 EQ, 7X-500 limiter
  - Freely rearrangeable module order within the 500 series frame
  - 6X-500: transformer-coupled discrete preamp with passive 2-band boost-only EQ, plus High and Low Pass filters with variable slopes
  - PEX-500: passive Pultec-style EQ with up to 15dB high-end boost, simultaneous cut and boost, additional high frequency selections and Mid/Side matrix
  - 7X-500: FET compressor with High Pass sidechain filter, Mix control for parallel compression, 100:1 ratio, stereo operation, continuously variable attack and release
