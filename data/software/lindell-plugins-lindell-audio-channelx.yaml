description: "Virtual 500 series frame containing three integrated Lindell Audio processors: 6X-500 transformer-coupled preamp, PEX-500 Pultec-style passive EQ, and 7X-500 FET compressor/limiter. Features flexible routing with rearrangeable module order and stereo operation."
details: |-
  6X-500 Preamp: Transformer-coupled mono preamplifier with HP/LP filters
  PEX-500 EQ: Pultec-style passive EQ with up to 15dB boost and Mid/Side matrix
  7X-500 Limiter: FET compressor with 1176-style characteristics and parallel compression
  Flexible routing with rearrangeable module order
  Stereo operation on compressor
  Continuously variable attack and release controls
  Up to 100:1 compression ratio
