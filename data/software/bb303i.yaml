details: |-
  The synth features 6 oscillator waveforms with fm, unison, and unison detune
  capabilities, along with 6 filter types offering 12/24db slopes and 2
  resonance types with filter eg control.

  Lfo can be bpm synced or manual for filter frequency modulation, with
  amplifier eg, bottom booster, and portamento controls available in a
  monophonic configuration with MIDI automation support.

  The gui is completely redesigned with a simple, clear interface that uses
  sliders rather than knobs and does not consume excessive screen space.

  Despite its name, bb303i is not limited to 303 clone sounds and is capable of
  producing a wide range of basses, leads, percussive sounds, analogue, digital,
  and various other sound treatments.
specs: |-
  - 6 oscillator waveforms
  - FM
  - Unison
  - Unison detune
  - 6 filter types (12/24db)
  - 2 resonance types
  - Filter eg
  - LFO (bpm synced / manual)
  - Filter frequency modulation
  - Amplifier eg
  - Bottom booster
  - Portamento
  - Monophonic
  - MIDI automation
