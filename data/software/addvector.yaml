details: >-
  Addvector is an additive synth with 8 oscillators that can generate
  non-specific waveforms.


  The waveforms can be morphed together with 2 xy-pads.


  Features include fft synth, 8 oscillators, 2 xy-pads, 2 multi-mode filters,
  rich modulation possibilities via fft generator, and the possibility to import
  one cycle waves.
