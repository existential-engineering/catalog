details: |-
  BitterSweet Pro is built around a new improved design of the algorithm found
  in Flux's acclaimed freeware transient processor: bittersweet.

  One of the main features of bittersweet pro is its ability to process only a
  certain part of the frequency spectrum, providing extended control of the
  transients processing and making it act like a dynamic equalizer driven by
  transients and/or sustain.

  The frequency dependent transient processing provides the option to process
  only a certain part of the frequency spectrum, making bittersweet pro act like
  a dynamic equalizer driven by transients and/or sustain. When frequency range
  is set from 20 hz to 20 khz the processing is performed on the full band, now
  changing the value of the low cut off frequency turns it into a high shelve
  dynamic eq and setting the high cut off frequency turns it into a low shelve
  dynamic eq, when setting both, it turns it into a peak dynamic eq.

  On any case the gain can be adjusted with the static gain parameter, and the
  slope can be set with the frequency order parameter, from 6db per octave to
  12, 18 and 24 db, the higher the frequency order is the steeper the slope of
  the frequency response becomes.
specs: |-
  - Frequency dependent transient processing
  - Dynamic equalizer
  - Transient designer
  - Frequency range 20 Hz to 20 kHz
  - Static gain parameter
  - Frequency order parameter
  - 6db per octave to 12, 18 and 24 dB slope options
  - High shelve dynamic EQ
  - Low shelve dynamic EQ
  - Peak dynamic EQ
  - macOS support
  - Windows support
  - Universal 2 binary
