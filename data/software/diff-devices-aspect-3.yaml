details: |-
  ASPECT 3 enables you to compare your mix to other mixes with a simple click of
  the a-b button inside Ableton live. It is designed to provide you with an
  easy, elegant workflow. From drag and drop file loading (you can even drop
  multiple reference tracks in one go), loop functions, multiple analysis
  (spectrum, correlation, stereo pan) to industry compliant loudness and
  dynamics metering.

  The trick with using reference files is to be able to instantly hear the
  contrast and differences between your mix and the kinds of sounds you aspire
  to. Adding visual feedback from multiple analyses types gives you the visual
  confirmation of the audio information you are hearing.

  In environments where listening facilities are less than ideal, its even more
  important to be able to do visual checks to ensure the sound is really there.
  Using both audio and visual information provides you with the feedback you
  need to make better decisions on what to do with your mix to get the best
  possible results.

  When you are armed with this level of precision and detail, it empowers you to
  move forward with confidence, knowing that each creative decision is backed by
  undeniable evidence.

  Inside the zip file you have an file: 1. Diff devices - aspect 3.amxd 2. Save
  the .amxd file anywhere on your computer or in a folder that you previously
  saved your maxforlive devices. 3. Drag and drop the device into your master
  track. Note: for better usage I recomend to be your last device in your master
  channel 4. Click on save (on the right hand side of the window: with a 'floppy
  disk' icon). 5. This will automatically save the device to your 'user library'
  folder in 'places' (the 'head outline' icon), and will also save a '.adv' file
  which can be used to store your favourite initial setup. 6. Map "open" button
  to your keyboard and/or MIDI controller. 7. You're good to go.
specs: |-
  - A/b comparison
  - Spectrum analyser (line & full views)
  - Loudness meters (lufs-I, short term, momentary, loudness range)
  - True peak metering
  - Tone balance display
  - Waveform display a/b
  - Waveform zoom (horizontal & vertical)
  - Correlation & soundfield metering
  - Volume match
  - Gain control a/b
  - Limiter
  - Mono/side signal check
  - Loudness target (up to 8)
  - Target curves (up to 8)
  - Genre target curves (up to 11)
  - Filter isolation a/b (lowpass, highpass, bandpass)
  - Drag and drop reference tracks
  - Loop functions
  - Resizable user interface
  - Gui interface
  - Rack interface with loudness display
  - Improved CPU performance 50%
  - Max for live device
  - Requires Ableton live v11 (minimum)
