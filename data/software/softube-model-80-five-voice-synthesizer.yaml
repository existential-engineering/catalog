description: From the makers of your favorite synth plugins comes Model 80 Five
  Voice Synthesizer. An expert model of an industry-defining five-voice
  polyphonic synth from 1980.
details: |-
  It's not overstating things to say that this five-voice synthesizer changed the future. The first synthesizer with a digital microprocessor to control the analog polyphonic synth engine and store sounds, it has graced hits from superstars such as Michael Jackson, Madonna, Peter Gabriel, Radiohead, The Cars, and countless others.

  With great reverence and proven modeling expertise, Softube captured every detail of this storied synth's circuit, interactions, and factory presets. The result is a revelation: the authentic sound, feel, and performance of an industry-defining instrument perfected for modern production. Like a prophecy from 1980 fulfilled, so cometh Model 80 Five Voice Synthesizer.

  Everything about the synth Softube modeled Model 80 after is iconic. Including the presets. To authentically recreate the experience of recalling them on the hardware, Model 80 offers the 40 original factory presets plus buttons on the programmer to call them up. The five voices and their relationship are exactingly replicated for authentic analog and organic sound. Softube paid obsessive attention to every detail of the circuit and interactions in its modeling to give you the real sound, feel, and experience of the original.

  Softube takes modeling very seriously. The modeling of the Voice Mod section of this synth is no exception to that rule. To accurately capture the original hardware, Softube needed to carefully reproduce the phase relationships and modulation polarity. In doing so, Softube has authentically emulated the sound, modulation, and feel of this mythical synth. And, with the added Invert Voice Mod button on the side panel, you will be able to go further than the original hardware. That means more versatility and a more modern workflow.

  Model 80 for Modular offers five modules: VCO, VCF, LFO, ENV, and MULTIPAN. Combine individual components in a modular workflow to build patches and get the authentic sounds that changed an industry. Or create inconceivable combinations that no other hardware or software can deliver.
specs: |-
  - The industry-defining five-voice polyphonic synth from 1980
  - Precisely modeled sound, interactions, and performance of the original unit
  - The easy recall of original factory presets heard on countless classic recordings
  - 40 original factory presets with hardware-style recall buttons on the programmer
  - An accurately modeled and newly versatile Voice Mod section, including an Invert Voice Mod button not on the original hardware
  - Workflow enhancements such as poly-portamento glide, Voice Pan Spread, velocity and aftertouch modulation, quantize filter cutoff, DAW sync, and an Aging knob
  - Two versions included: the instrument and five modules for Modular (VCO, VCF, LFO, ENV, MULTIPAN)
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26; Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Internet access required for downloading installers and managing licenses
  - 20-day trial, 14-day returns, three activations per license
