details: |-
  Bit stands for back in time and represents time travel level 2. Bit-2's main
  focus is on analogue modelled synthesis, focusing on the charm of classic
  analogue type of synthesis that has not yet been covered in this form by the
  Rob Papen brand.

  Although bit-2 has no patch cables, it is modular by all means. The modulation
  matrix is used for the patching, with a smart 'advanced' panel below the
  oscillators that can be accessed by switching the adv switch, allowing quick
  connections such as lfo and envelope to the oscillator parameters.

  New additions to bit-2 include supersaw and supersquare waves, which are
  multiple oscillators generated inside oscillator 1 and/or 2. Oscillator 2 can
  be modulated by oscillator 1 in several ways including phase modulation,
  frequency modulation, and ring modulation, expanding the sound palette
  massively.

  The arpeggiator/sequencer features the option to dynamically change the start
  step and end step number, resulting in interesting real-time changing
  patterns. The 'magic' parameter allows you to alter the played
  arpeggiator/sequencer in a musical manner, and the arpeggiator/sequencer can
  also work as a modulator with an additional free row for modulating other
  parts of bit-2 using the modulation matrix.

  The amp section has been expanded with multiple distortion options at a per
  'voice' level, avoiding ugly sounds if you play chords. A 'ribbon controller'
  in the lowest section of bit-2's gui allows you to change multiple parameters
  dynamically using your mouse or an external MIDI controller, and the fx
  section includes a top-notch reverb.
