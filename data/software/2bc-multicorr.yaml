description: A multiband correlation meter with essential metering & monitoring
  functions wondering about phase? You won't find it in your waveforms...
details: |-
  2bc multicorr is a multiband correlation meter with essential metering and monitoring functions that provides a 360 overview of phase behavior, plus monitor controls for total aural awareness.

  2bc multicorr includes 31 bands of correlation, plus stereo balance, stereo correlation and five essential monitor controls: leftonly, rightonly, l+r, l-r and flip. A multiband approach warns you not to overdo stereo spread, or when your stereo room mics are delivering too much outofphase content, which would cause cancellation when your mix is summed to mono.

  2bc multicorr provides four bands of analysis for the critical bottom octave, six additional bands of metering covering frequencies up to 200 hz, plus three additional band for the 200 to 400 hz range, making it particularly useful for lp distribution and monaural playback compatibility.

  Most correlation meters use a cosine scale derived from old analog meters, while 2bc multicorr employs a truelinear scale. A linear scale better matches your perception and provides higher precision with visuals that match your perception.

  2bc multicorr includes a native version that runs in standalone mode for dedicated metering, and the plugin runs on all major daws: AAX, AU, VST 2 & VST 3, with universal binary 2 for macos.
