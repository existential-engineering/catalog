description: One ultra-simple plugin that delivers the punch, energy, and edge your drums need to stand out.
details: |-
  Telos Drums is an all-in-one drum mixing plugin built to deliver punch and impact without stacking multiple plugins. The number-one drum mixing problem is not tone but impact: getting the kick to hit, the snare to crack, and the whole kit to move air without clipping the bus.

  The plugin combines EQ, compression, parallel processing, and saturation tuned under the hood into a single simplified interface, so drums can be dialed in seconds rather than hours. It is designed to work on any kit, live, programmed, acoustic, or electronic, without reconfiguring presets for different genres.

  Controls include a mode selector to optimize processing for different parts of the kit, Low/Mid/High tone knobs with a Mid Freq slider, a Tight and Smooth section to reduce muddiness and boxiness, a single-knob punch compressor, a SLAM button in Room mode for extra energy, a transparent clipping circuit with Output control, a Drive knob for saturation, and built-in oversampling.
specs: |-
  - Mode selector optimizes processing for each part of the drum kit
  - Low, Mid, and High tone knobs with Mid Freq slider for precise tonal balance
  - Tight and Smooth section reduces muddiness and boxiness, each with a frequency selector
  - Single-knob punch compression based on classic drum compression techniques
  - SLAM button in Room mode pushes the compressor into overdrive for extra energy
  - Transparent clipping circuit with Output control for peak control and loudness
  - Drive knob delivers saturation for added weight, character, and warmth
  - Built-in oversampling for detail, depth, and clarity
  - Mac OS X 10.15 or higher
  - Windows 10 or higher
  - 64-bit only
  - 200 MB free drive space
