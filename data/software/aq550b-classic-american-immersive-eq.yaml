details: >-
  Based on classic american eq from the late '60s, the aq550b is a continuation
  of the eq that played a major role in the history of music recording, but with
  an additional filter band and several new frequencies. With a surprisingly
  wide range of tonal variations, the aq550b is an invaluable and professional
  audio tool with great flexibility and excellent sonic ability.


  Rather than offer a huge assortment of complex features, the aq550b provides
  exactly the right number of controls. Its four eq bands are overlapped
  significantly to aid in dual roles as problem solver and sweetening device
  with each band offering seven switchable filter frequencies that span
  four-to-five octaves.


  These frequencies, purposely selected to be musical rather than numeric.
  Making use of proportional q intuitively widens the filter bandwidth at
  minimal settings and narrows it at higher settings without the need for
  additional bandwidth controls. This unique feature minimizes the phase-shift
  sound found in many equalizers.


  The aq550b extends the features of the original hardware and joins the
  flexibility of the digital world to the character of the analog processing.
  Allows you to choose between equalizer modes (stereo, mid, side) and remove
  analogue saturation from the processing circuit to deliver pure digital sound.
specs: |-
  - 4 bands of classic american equalization
  - 7 selected frequency centers per band
  - 15 db of boost/cut per band
  - Eq band 1 and 4 offer shelf/peak switching
  - Proportional q narrows filter q at extremes
  - Stereo, mid or side eq modes
  - VST plugin
  - Audio units plugin
  - VST 3 plugin
  - AAX plugin
  - Macos and windows compatible
  - Universal 2 binary
  - Modeled vintage eq
  - Analogue saturation removal option
