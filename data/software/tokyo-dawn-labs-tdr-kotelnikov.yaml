description: "A wideband dynamics processor combining high fidelity dynamic
  range control with musical flexibility. Features a stealthy sonic signature
  perfectly suited for stereo bus compression and other critical applications."
details: |-
  Version 1.6.7. 64-bit multi-rate processing structure. Delta oversampled signal path, bit transparent at 0dB gain reduction. Super fast, natural-sounding compression. Crest factor based control scheme with independent release controls for peak and RMS events. Flexible sidechain highpass filter. Advanced stereo linking options for stereo bus. Delta preview mode. Latency compensated, click-free bypass. User interface rescaling at 100%, 125%, 150%.
specs: |-
  Windows 7 or above. Mac OS X 10.9 or above. OpenGL support required. Windows 32-bit and 64-bit: VST2, VST3, AAX. Mac 32-bit and 64-bit: VST2, VST3, AU, AAX.
