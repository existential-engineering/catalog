details: |-
  Pulsar 1178 is an audio plug-in (VST/VST3/AU/AAX) that meticulously recreates
  the original 1178 hardware compressor in its tonal color and compression
  character, while adding several additional features, turning it into a very
  versatile compressor for tracking and mixing.

  A compressor that eats transients for breakfast, the 1178 is a rare and
  expensive legend of the recording studio, cleaner and more versatile than its
  older brother, the 1176.

  But pulsar audio took their 1178 further than the original unit, adding all
  the features you would expect from a modern, versatile plug-in, including a
  full sidechain eq for added control, an optional saturation stage for warmth
  and character, and precise metering.

  Pulsar 1178 also provides several other features: mid/side processing,
  look-ahead and look behind options, external sidechaining, presets from
  world-class sound engineers, smart and resizable graphic interface, and up to
  8x oversampling.
specs: |-
  - Fet compressor
  - Mid/side processing
  - Look-ahead and look behind options
  - External sidechaining
  - Sidechain EQ
  - Saturation stage
  - Precise metering
  - Up to 8x oversampling
  - Parallel compression
  - Universal 2 binary
  - Presets from world-class sound engineers
  - Smart and resizable graphic interface
