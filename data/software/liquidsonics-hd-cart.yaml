description: HD Cart is a high-density reverb plugin modelled after a legendary expansion for one of the most sought after and expensive reverb units of all time, now available in 9.1.6. AAX, AU, VST
details: |-
  HD Cart is a high-density reverb plugin modelled after a legendary expansion cartridge for one of the most sought-after and expensive reverb units of all time. The plugin faithfully recreates the character and sound of the original hardware, while adding modern capabilities and workflow enhancements.

  The plugin supports a wide range of channel configurations from mono through to 9.1.6 surround, making it suitable for both traditional stereo mixing and modern immersive audio workflows including Dolby Atmos. It features luscious chorusing effects with independent reflection and reverb chorusing, alongside extended roll-off curves at 6, 12, 18, and 24 dB slopes.

  HD Cart includes flexible dynamics processing with ducking, gating, and compression modules, all with external sidechain support. Pre-delay can be synced to DAW tempo, and the interface is fully scalable from 70% to 200%.

  The plugin ships with over 200 presets and has a low memory and CPU footprint. It requires iLok licensing via a physical dongle, machine activation, or iLok Cloud, and a 14-day free trial is available.
specs: |-
  - Supported channel formats: Mono, Stereo, LCR, Quad, 5.0–5.1.4, 7.0–7.1.6, 9.0.4–9.1.6
  - Plugin formats: AAX Native, VST 2.4, VST 3, Audio Unit (AUv2)
  - macOS 10.13 and above — Intel and Apple Silicon native; Rosetta 2 supported
  - Windows 7 and above
  - 64-bit only
  - Scalable UI: 70%–200%
  - Pre-delay DAW tempo sync
  - Extended roll-off curves: 6, 12, 18, 24 dB slopes
  - Independent reflection and reverb chorusing
  - Dynamics with external sidechain support (ducker, gate, compressor)
  - Parameter locking
  - iLok license required (dongle, machine, or iLok Cloud)
