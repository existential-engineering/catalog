description: Discover Harmonic Excitement with HoRNet Harmonics Pro - The Ultimate Audio Exciter, Saturator and Clipper Processor
details: |-
  HoRNet Harmonics Pro is a cutting-edge audio plugin designed to provide users with an advanced harmonic shaping experience. Based on the popular free version, Harmonics, this enhanced edition gives music producers, audio engineers, and sound designers a suite of powerful tools for adding depth, warmth, and character to any sound. Whether you are refining a mix or crafting a completely new tone, HoRNet Harmonics Pro ensures full control over your harmonic enhancement process.

  At its core, HoRNet Harmonics Pro acts as a sophisticated audio exciter, introducing harmonics to the incoming signal in a way that emulates analog hardware. Users can add up to 10 independent harmonics, each of which can be tweaked individually in terms of amplitude and phase. Each harmonic can be adjusted not only in volume but also in its phase alignment, offering precise tonal sculpting, from subtle enhancement to bold, transformative effects.

  Beyond its primary function as an audio exciter, HoRNet Harmonics Pro integrates several saturation and clipping modules, each inspired by classic analog circuits. The saturation stage offers dynamic harmonic distortion, giving users the ability to simulate tube warmth or transformer thickness, while the clipper section ensures that audio levels stay under control while still maintaining a musical edge. A hysteresis module emulates the memory effect found in vintage hardware like magnetic tape and vacuum tubes.

  Pre-emphasis and de-emphasis EQ filters allow users to emphasize certain frequency ranges before the harmonic generation process and then compensate after saturation, providing surgical control over which parts of the spectrum are affected most by harmonic processing. The input and output gain knobs are linked by a gain compensation feature, and a master harmonic level fader offers global control over the amount of harmonic processing.

  An intelligent oversampling system automatically selects the most appropriate oversampling rate based on the project's sample rate, minimizing aliasing and keeping harmonic processing smooth even at extreme settings. The interface is built with vector graphics and supports hardware acceleration via OpenGL and Metal, so it stays sharp at any resolution and is fully resizable.
specs: |-
  - Up to 10 different harmonics can be added to the original signal
  - Individual amplitude and phase control per harmonic
  - Master control for harmonics level
  - Soft clipper
  - Pre emphasis and de emphasis EQ with up to 4 different filters
  - Hysteresis simulation (transformer, tube and magnetic tape behavior)
  - Input and output level can be linked to keep level constant
  - Separate dry and wet controls
  - Intelligent oversampling that allows the plugin to always work internally at 192kHz
  - Vector user interface which is sharp on every resolution
  - Freely resizable user interface
  - Apple Silicon native support (except for AAX)
  - macOS (10.11 and later) and Windows (Vista and later) support
  - 64-bit on Mac and Windows
  - Audio Units, VST, VST3 and AAX format
  - No copy protection
