description: Discover Harmonic Excitement with HoRNet Harmonics Pro - The Ultimate Audio Exciter, Saturator and Clipper Processor
details: |-
  HoRNet Harmonics Pro is a cutting-edge audio plugin designed to provide users with an advanced harmonic shaping experience. Based on the popular free version, Harmonics, this enhanced edition gives music producers, audio engineers, and sound designers a suite of powerful tools for adding depth, warmth, and character to any sound. Whether you are refining a mix or crafting a completely new tone, HoRNet Harmonics Pro ensures full control over your harmonic enhancement process.

  At its core, HoRNet Harmonics Pro acts as a sophisticated audio exciter, introducing harmonics to the incoming signal in a way that emulates analog hardware. Users can add up to 10 independent harmonics, each of which can be tweaked individually in terms of amplitude and phase. This level of control makes the plugin a versatile tool for shaping tone and enhancing the presence of any audio track.

  Each harmonic can be adjusted not only in volume but also in its phase alignment, offering precise tonal sculpting. This allows for either subtle enhancement or bold, transformative effects that make a track stand out in a mix. Whether applied to vocals, drums, bass, or synthesizers, the harmonics can bring out the hidden richness in any element of your production.

  Beyond its primary function as an audio exciter, HoRNet Harmonics Pro integrates several saturation and clipping modules, each inspired by classic analog circuits. The saturation stage offers dynamic harmonic distortion, giving users the ability to simulate tube warmth or transformer thickness. The clipper section ensures that audio levels stay under control while still maintaining a musical edge.
specs: |-
  - Up to 10 different harmonics can be added to original signal
  - Master control for harmonics level
  - Soft clipper
  - Pre emphasis and de emphasis eq with up to 4 different filters
  - Hysteresis simulation (transformer, tube and magnetic tape behavior)
  - Input and output level can be linked to keep level constant
  - Separate dry and wet controls
  - Intelligent oversampling that allows the plugin to always work internally at 192Khz
  - Vector user interface which is sharp on every resolution
  - Freely resizable user interface
  - Apple Silicon native support (except for AAX)
  - macOS (10.11 and later) and Windows (Vista and later) support.
  - 64-bit on Mac and Windows.
  - Audio Units, VST, VST3 and AAX format.
