details: >-
  Abstract crystal pads is a collection of 30 abstract pads for your film score,
  ambient soundtrack or your fresh new age project.


  Each sound is royalty-free and can be used in commercial and non-commercial
  projects.


  Also available as a kontakt/decent sampler instrument library and a reason
  12/+ refill.
specs: |-
  - 30 abstract pads
  - Multi-lfo
  - Room reverb
  - Lowpass/highpass filter
  - Low-cpu usage
  - Amplitude range controls
  - 3 voice modes: polyphonic, monophonic, and legato
  - VST plugin
  - Audio units plugin
  - VST 3 plugin
