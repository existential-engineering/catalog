details: |-
  Version 1.0.7. Full featured dynamics compressor. Eleven compression flavor options. Different quality modes including zero-latency operation. High quality signal processing with strict distortion control. Intuitive user interface with unlimited undo/redo. Optional stepped controls and inline help tips.
specs: |-
