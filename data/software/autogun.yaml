description: Autogun offers 4,294,967,296 (four billion two hundred ninety four
  million nine hundred sixty seven thousand two hundred ninety six) presets.
details: |-
  Autogun is based on the ogun vsti synthesizer that can produce rich metallic
  and shimmering timbres, although it's not limited to these sounds as Autogun
  will demonstrate.

  Ogun's distinctive synthesis engine can generate more than 32,000 harmonics,
  modulated by high-level 'harmonic mapping' functions. These synthesis
  parameters have been put under the control of an artificial intelligence,
  patch creation algorithm, the reason autogun can deliver such a huge number of
  presets.

  Every autogun is set to start from a unique preset number, so that each
  autogun user is assigned a personal starting preset-address, ready to explore.
  However, users can at any time, jump to a new location in the preset-space by
  simply entering a preset number.

  With so many presets autogun needs no programming, every sound is already
  somewhere 'out there' and just needs to be found.

  Key features: based on the ogun synthesis engine. Enhanced by the
  soundgoodizer, (maximus) engine. 4,294,967,296 presets to explore. Preset
  number copy/paste field. Preset up/down buttons. Volume control.
specs: |-
  - Additive synthesis
  - 4,294,967,296 presets
  - 32,000+ harmonics
  - Harmonic mapping functions
  - Artificial intelligence patch creation algorithm
  - Preset number copy/paste field
  - Preset up/down buttons
  - Volume control
  - Windows compatible
