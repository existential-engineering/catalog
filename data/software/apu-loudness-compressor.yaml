name: APU Loudness Compressor
manufacturer: apu-software
primaryCategory: compressor
url: https://apu.software/compressor/
description: APU Loudness Compressor is a real-time compressor supporting a
  variety of loudness types and a rich set of advanced features.
details: |-
  The primary feature which motivated starting apu software and building the
  loudness compressor was to integrate lufs directly into a compressor's
  detection circuitry. The loudness compressor is my realization of that
  original goal, and it has evolved to include many more features since then.

  Apu loudness compressor by apu software is a virtual effect audio plugin and a
  software application for macos and windows. It functions as an audio units
  plugin, a VST 3 plugin, an AAX plugin and a standalone application.
specs: |-
  - Real-time compressor
  - Lufs-based compression
  - Loudness types support
  - Compress or expand within lufs units
  - macOS support
  - Windows support
  - Universal 2 binary
