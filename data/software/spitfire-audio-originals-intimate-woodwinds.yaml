description: A curated ensemble of Bassoon, Bass Clarinet, Clarinet, Alto Flute
  and Flute, captured in the reverberant acoustics of Lyndhurst Hall, AIR
  Studios.
details: |-
  A curated ensemble of Bassoon, Bass Clarinet, Clarinet, Alto Flute and Flute, captured in the reverberant acoustics of Lyndhurst Hall, AIR Studios. Each instrument feathers in and out of its most effective playing range, creating a section that blends naturally without the need to manage individual parts.

  From gentle pastoral underscore to atmospheric, barely-there textures — the Long Air preset features half the section producing only the sound of air passing through their instruments. Three bespoke signals (Close, Mix, Vintage) let you shape the tone from defined and present to warm and characterful.

  Originals Intimate Woodwinds requires the free Splice INSTRUMENT plugin to run.
specs: |-
  - File size: 1.2 GB
  - 5 instruments: Bassoon, Bass Clarinet, Clarinet, Alto Flute, Flute
  - 7 presets
  - 3 mic signals: Close, Mix, Vintage
  - 3 controls: Reverb, Release, Tightness
  - macOS 12 or later, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
