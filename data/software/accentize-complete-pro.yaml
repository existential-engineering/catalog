details: |-
  The ultimate toolset for audio post professionals: Capture real surround
  spaces, clean up noise and reverb, balance tone, and achieve natural results,
  all with one powerful bundle. Contains Chameleon Surround (match room reverb
  from real takes, built for fast post workflows), dxRevive Pro (Emmy-winning
  speech restoration with noise removal and reverb suppression), dxSplit
  (high-quality noise reduction, real-time capable algorithm, individual
  parametric EQs for every channel), SpectralBalance, and DeRoom Pro.
