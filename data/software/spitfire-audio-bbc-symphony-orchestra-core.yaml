description: "In partnership with bbc studios and the world-famous bbc symphony
  orchestra, Spitfire Audio has captured what no other sample library has
  before: the musical synergy of a family of astoundingly accomplished players
  with a 90-year heritage of performances and recordings, expertly recorded at
  London's famous maida vale studios home of the bbcso."
details: |-
  In partnership with bbc studios and the world-famous bbc symphony orchestra,
  Spitfire Audio has captured what no other sample library has before: the
  musical synergy of a family of astoundingly accomplished players with a
  90-year heritage of performances and recordings, expertly recorded at London's
  famous maida vale studios home of the bbcso.

  Our most expansive and ambitious project to date, this landmark library is the
  stuff of composing dreams: strings, brass, woodwind and percussion, presented
  in our award-winning dedicated plugin.

  Core has been curated to offer a streamlined package, featuring essential
  instruments and the full range of articulations, with one mix signal fully
  interchangeable with our discover and professional editions.
specs: |-
  - 64-bit DAW
  - Windows 7, Windows 8, Windows 10 (64-bit)
  - Mac OS X 10.10 - Mac OS 11
  - Intel and m1 macs supported
  - Minimum: intel 2.8 GHz i5 (quad-core) or amd ryzen 5
  - Recommended: intel 2.8 GHz i7 (six-core) or amd r7 2700
  - Minimum mac: 2.8ghz i5 (quad-core), 8gb RAM
  - Recommended mac: 2.8ghz i7 (six-core), 16gb RAM
  - Internet connection required during install
  - Strings
  - Brass
  - Woodwind
  - Percussion
  - Full range of articulations
  - Universal 2 binary
