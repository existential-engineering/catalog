description: "In partnership with bbc studios and the world-famous bbc symphony orchestra, Spitfire Audio has captured what no other sample library has before: the musical synergy of a family of astoundingly accomplished players with a 90-year heritage of performances and recordings, expertly recorded at London's famous maida vale studios home of the bbcso."
details: |-
  In partnership with BBC Studios and the world-famous BBC Symphony Orchestra, Spitfire Audio has captured what no other sample library has before: the musical synergy of a family of astoundingly accomplished players with over 90 years of heritage in performance and recording, expertly captured at London's famous Maida Vale Studios, home of the BBCSO, and host to The Beatles, Hendrix and Bowie. Our most expansive and ambitious project to date, this landmark library is the stuff of composing dreams: strings, brass, woodwind and percussion, presented in our award-winning dedicated plugin.

  Core has been curated to offer a streamlined package, featuring essential instruments and the full range of articulations, with one mix signal, fully interchangeable with our Discover and Professional editions.

  For the first time, we have captured a full orchestra: outstanding players who have developed a precise musical affinity, rehearsing and performing some of the most challenging orchestral works together, week in, week out, to create a truly cohesive sound. Every note has been expertly sampled at Maida Vale Studios, a world-class recording space with a rich musical history. Built in 1909, it was one of the BBC's earliest premises, the centre of the BBC News operation during World War II, and the home of the BBC Symphony Orchestra since 1934.

  Orchestral samples have become an essential component of modern scoring, and the range of libraries available is vast. But what if a single product could become the universal starting point for a generation of composers? We've taken over a decade of sampling experience to give you this comprehensive orchestral library of epic proportions, comprising over 200 hours of recordings, sounding exactly as they would if you had the orchestra in the room. Core features 44 different instrument presets captured on world-class Millennia preamps, and 344 techniques including legatos for each melodic instrument. With a beautiful, modern design by ustwo (Monument Valley, DICE), BBC Symphony Orchestra is housed in Spitfire Audio's own dedicated plugin (VST3, AU, AAX) developed primarily for composers, by composers.

  Created as a universal starting point for composers and music creators of every level, BBC Symphony Orchestra now comes in three editions: Discover, Core and Professional. Core features the same outstanding recording quality as Professional in a more streamlined, affordable package. Offering a large range of instruments performing all articulations, with one mix signal, Core has been designed for composers wanting to create instantly professional sounding orchestral music, without taking up too much hard drive space. Mode switching technology makes each edition of BBC Symphony Orchestra interchangeable, so a score started in Discover can be finished in Core or Professional, and vice versa.
specs: |-
  - 44 instrument presets
  - 344 techniques including legatos for each melodic instrument
  - Over 200 hours of recordings
  - One mix signal
  - Recorded at Maida Vale Studios, London, on Millennia preamps
  - Strings: Violins 1 (16), Violins 2 (14), Violas (12), Celli (10), Basses (8)
  - Woodwinds: Flute, Flutes a3, Piccolo, Oboe, Oboes a3, Clarinet, Clarinets a3, Bassoon, Bassoons a2 and related ensembles
  - Brass: Horn, Horns a4, Trumpet, Trumpets a3, Trombones, Tuba and related ensembles
  - Percussion and harp: Celeste, Harp, Timpani, Cymbals, Snare, Bass Drum and auxiliary percussion
  - Housed in Spitfire Audio's own dedicated plugin, no Kontakt required
  - GUI designed by ustwo (Monument Valley, DICE)
  - Mode Switching for session interchange with the Discover and Professional editions
  - Discover edition included free with Core
  - Spitfire Audio App required for download and installation
  - macOS 11 to macOS 26, Intel and Apple Silicon/ARM supported
  - macOS minimum: 2.8GHz quad-core i5, 8GB RAM; recommended: 2.8GHz six-core i7, 16GB RAM
  - Windows 10 or Windows 11 (64-bit, latest service pack)
  - Windows minimum: Intel 2.8GHz quad-core i5 or AMD Ryzen 5, 8GB RAM; recommended: Intel Core i7 6th gen or later or AMD Ryzen 7, 16GB RAM
  - 32-bit systems are not supported
  - 28.2 GB download size, 28.00 GB disk space required during install
