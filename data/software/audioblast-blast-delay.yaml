description: Blast Delay is a simple and intuitive delay with a built-in parameter sequencer. You can program independent loops of motion sequences.
details: |-
  Blast Delay stands as an intuitive and straightforward delay tool featuring a built-in parameter sequencer, offering a seamless experience in crafting dynamic audio effects. With its user-friendly interface, this plugin enables the programming of distinct motion sequences for each knob, each operating at independent speeds.

  Ideal for live performances, Blast Delay facilitates real-time tweaking of effects, allowing for instant parameter adjustments while providing the ability to recall and reproduce all settings through the sequencer.

  The sequencer feature within Blast Delay serves as a comprehensive tool, enabling the sequencing of all plugin parameters. Users can pre-program intricate motion sequences within loops, enhancing creativity and control over their effects.

  Synced seamlessly to the host's tempo, the sequencer operates in perfect harmony, with each step representing a percentage value of the parameter, ranging from 0 to 100%. This synchronization ensures precise control and synchronization of effects, delivering a versatile and synchronized audio experience.
specs: |-
  - Dry/Wet: adjusts the balance between the processed and dry signals
  - Volume: adjusts the volume of the processed signal
  - Time: adjusts the time of the delay in milliseconds, or from 1 Bar to 1/128 when the sync button is activated
  - Feedback: defines how much of each channel's output signal feeds back into the delay lines' inputs
  - Filter: from -100 to 0 the parameter works as a low pass filter, from 0 to 100 it works as a hi pass filter
  - Sync: when on, the delay time is synced to the tempo from 1 Bar to 1/128; when off, the delay time reverts to milliseconds
  - Ping Pong: when activated, the signal jumps from the left to the right output
  - Freeze: loops the delay buffer, the input signal is no longer processed by the delay
  - Polarity: inverts the phase in effect by 180 degrees, more interesting on low values of Time with high feedback
  - Pitch: causes a pitch variation when changing the delay time, similar to the behavior of old tape delay units
  - Parameter Sequencer: sequence all parameters of Blast Delay to pre-program motion sequences of parameters in loops
  - System requirements (Mac): macOS 10.13 to latest, Intel Core i5 or equivalent CPU, 2 GB RAM, Apple Silicon compatible M1 to M4
  - System requirements (Windows): Windows 7 to 11, Intel Core i5 or equivalent CPU, 2 GB RAM
  - Requires an internet connection in order to install and update products
