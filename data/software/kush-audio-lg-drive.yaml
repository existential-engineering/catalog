details: |-
  Distortion is the new EQ. At its heart, LG Drive is an elegantly simple device, a 2-Stage Tube Saturation color-box whose thick, creamy distortions are pulled straight from the AR-1 variable-mµ compressor.

  When those distortions are coupled with a simple but powerful set of filters, then blended with the unprocessed signal, the result is a deceptively powerful tone-shaping tool that rivals (and often surpasses) eq with its ability to thicken and energize anemic drums, dramatically lift and level out dull, unruly vocals, add clarity and definition to murky bass, and fundamentally shift the tone and vibe of an entire mix.

  LG Drive is sold as a perpetual licence including two activations, free updates and support, and all available presets. A free 10-day demo is offered via a published demo code.
