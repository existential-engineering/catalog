description: A high-frequency acceleration limiter designed for mixing and mastering.
details: |-
  OD Limen, named after the Latin word for “threshold”, is a high-frequency acceleration limiter designed for mixing and mastering. Rather than limiting the full signal, Limen isolates and processes only the high-frequency content above a user-defined crossover point.

  Depth controls the intensity of the limiting process, from subtle taming to aggressive control. Crossover sets the split point using a linear-phase filter with adaptive slope for perfect signal reconstruction. Tilt shapes the spectral balance of what the limiter sees, controlling the focus between low and high frequencies. Recover preserves the tonal balance, ensuring Limen only affects the dynamics, not the character of the sound, and values above 100% add a silky high-frequency quality that conventional EQ cannot achieve.

  Traditional high-frequency limiters rely on a fixed threshold and require careful calibration to match the input level. Limen instead responds to high-frequency acceleration directly, adapting automatically to any input level. The processor features Focus Listen for soloing individual frequency bands, an external sidechain input, configurable keyboard shortcuts, and flexible L/R or M/S channel processing.

  Version 1.1.0 added immersive surround support up to 9.1.6, with L-R and M-S channel modes applied per symmetric channel pair, a channels panel with per-channel gain reduction meters, and plugin-internal undo and redo.

  Ohlhorst Digital is a brand by Jan Ohlhorst. Initially developed exclusively for his work as a mastering engineer, these well refined products are now being made publicly accessible.
