description: DF-CLARIFY 2 takes your cymbal and room mic tracks and increases clarity while intelligently removing harshness which causes ear fatigue. Using a proprietary audio learning and processing algorithm refined through extensive real-world mixing experience, it gives users unprecedented cymbal mix control. Version 2 adds two extra user modes for manual algorithm adjustment via graph customization, side-chain EQ matching, a redesigned interface, and enhanced processing algorithms.
details: |-
  DF-CLARIFY 2 processes cymbal and room microphone tracks to enhance clarity while removing harshness that causes listening fatigue. The plugin incorporates a proprietary mixing technique refined over years and featured on established recordings.

  Users can adjust smoothing and weight controls to fine-tune cymbal clarification. Soften knobs relax the upper frequencies, making cymbals more pleasant to hear.

  Version 2 additions include two extra user modes for manual algorithm adjustment via graph customization, side chain EQ matching for quick source EQ matching, an updated interface, and enhanced algorithms.

  The EQ matching feature simplifies equalization tasks. Users can sidechain external sources and apply EQ matching instantly — useful for fixing guitar tones, achieving radio-friendly frequency curves, or perfecting bass response.

  The smooth knob adjusts clarity intensity. The weight control focuses where the algorithm applies strength. The soften control musically relaxes cymbal top-end frequencies, bringing new life to cymbal recordings.
