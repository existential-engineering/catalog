description: DF-CLARIFY 2 takes cymbal, overhead, and room mic tracks and increases clarity while intelligently removing the harshness that causes ear fatigue. Version 2 adds sidechain EQ matching, two manual user modes, improved algorithms, and a new interface.
details: |-
  Mixing overhead and room tracks is difficult no matter how good the engineer or the equipment, and DF-CLARIFY was the first plugin aimed specifically at making cymbal recordings sound more pleasing and musical. DF-CLARIFY 2 uses a proprietary algorithm developed over years of real-world mixing and applies it intelligently to the source recording.

  Version 2 introduces EQ matching. The plugin can sidechain an external source and match its EQ curve onto the source sound, which can be used to fix poor guitar tones, push a mix toward a more radio-ready curve, or find a target bottom end.

  Control is handled by three main parameters. The Smooth knob sets the intensity of the clarity processing, the Weight control focuses where the algorithm applies its strength, and the Soften control relaxes the top end of cymbals in a musically pleasing way. Together they cover everything from drastic surgery to minimal taming.

  The underlying process has been refined over more than a decade, has been used on well-known billboard-charting recordings, and has also been used in Drumforge's own drum sample libraries.
specs: |-
  - Increases clarity on cymbal and room mic tracks while removing harshness that causes ear fatigue
  - Smooth and Weight knobs fine-tune how cymbals are clarified
  - Soften knob relaxes the top end of cymbals
  - Version 2: two additional user modes for manual adjustment of the algorithm curve
  - Version 2: sidechain EQ matching against any source
  - Version 2: new UI and improved algorithms
