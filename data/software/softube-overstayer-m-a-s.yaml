description: Overstayer M-A-S is more than a distortion plugin. It's a hotshot
  harmonic shaper. A high-fidelity saturation plugin, that also offers tone
  sculpting and peak bending.
details: |-
  Handmade in Los Angeles by Jeff Turzo, Overstayer is something of an underground phenomenon. Turzo started out making gear for his personal use, but word of his exceptional designs spread like gossip down Sunset, and in 2009, Turzo gave the people what they wanted. Overstayer Recording Equipment was born and created a near-fanatical following amongst the in-the-know pro audio crowd.

  The Overstayer M-A-S plug-ins offer the same saturation and peak-bending capabilities as the hardware in two new, enhanced versions: the do-it-all guru M-A-S and the tone-sculpting Svengali M-A-S Extended. Masterfully modeled, the harmonic shaping duo is a professional mix engineer's secret weapon for adding energy to tracks, gluing buses, and enhancing mixes.

  With M-A-S, you can increase the apparent volume without getting the timing artifacts associated with compression. It smooths harsh transients and enhances the character and detail of any sound source, bringing it forward, in addition to reducing brittleness in peaks and other unevenness. Designed for ease of use, M-A-S can take the place of compression, limiting, and bus compression on individual tracks and buses by effortlessly balancing mixes.

  An exacting replica of the analog unit, Overstayer M-A-S produces harmonics that are as sweet as a large-format console but with exceptional versatility. While the hardware offered one emphasis type, Softube expanded that to six: Classic M-A-S keeps the fundamental frequencies clean and focuses on the mid to upper ranges, Low Bandwidth concentrates on high and low frequencies and leaves the mids alone, Low Presence homes in on vocal frequencies in the upper mid-range, High Presence deals with vocal frequencies in the lower high-range for shimmer and air, Bass Distortion thins the bass without touching the highs for a transformer-like sound, and Treble Distortion gives an almost tape-like quality.

  In addition to M-A-S and M-A-S Extended, Overstayer M-A-S comes with modules for Amp Room and Modular. In Amp Room, the M-A-S module can be used as a boost pedal before a guitar amp or as a finalizer. As the final stage before output, M-A-S for Modular will thicken synth sections, and can be virtually patched to modules from Doepfer, Buchla, Intellijel and more.
specs: |-
  - Two plug-ins for high fidelity saturation: M-A-S and M-A-S Extended
  - Expertly component modeled after the M-A-S hardware unit
  - Officially licensed and created in collaboration with Jeff Turzo and Overstayer
  - A total of four versions included: M-A-S, M-A-S Extended, M-A-S for Amp Room, and M-A-S for Modular
  - Added auto-compensated levels on the Input (Auto Gain and To Dry)
  - Dual and 2ND modes for increased energy and coherence
  - Five new emphasis types for the M-A-S plug-in make a total of six
  - 4-band fully flexible parametric emphasis EQ (2x Shelf, 2x Bell) for M-A-S Extended
  - 12 dB/octave resonant low and high-pass filters for M-A-S Extended
  - Increases the apparent volume without compression timing artifacts, replacing the need for compression or limiting
  - Supports Softube Extended Features panels
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Internet access required for downloading installers and managing licenses
  - Three activations
  - 20-day trial, 14-day returns
