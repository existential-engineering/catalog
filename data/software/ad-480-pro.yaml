description: The ad 480 is a professional reverb effect for idevices. It comes
  in three different versions, ad 480 free, ad 480 basic and ad 480 pro.
details: >-
  The ad 480 is a professional reverb effect for idevices. It comes in three
  different versions, ad 480 free, ad 480 basic and ad 480 pro. The algorithm is
  inspired by legendary studio reverb units.


  Ad 480 pro by fiedler audio is a mobile audio app and a software application
  for ios. It functions as a standalone application.
specs: >-
  - Professional reverb sound effect with variable room size

  - Ios 7 ready

  - Full audiobus integration

  - Supports internal and external audio interfaces (USB class compliant or mfi)

  - Extensive filter layout for a wide spectrum of sound

  - Access to all sound parameters

  - 108 excellent presets

  - Professional preset management for MIDI, audio and reverb parameters

  - Routing matrix with support for up to 24 inputs and 24 outputs

  - MIDI communication over network and USB-MIDI interfaces, plus inter-app MIDI

  - Supports sample rates of 44.1 khz 96 khz and latencies down to 64 samples

  - Special gui mode for low light environments (e.g. On stage, ipad only)

  - Background audio for multitasking with other apps

  - From ipad 2, ipod touch 5g, iphone 4s and above

  - Interapp audio support

  - Audio recording, playback, offline processing

  - Audio import & export via audiocopy/audiopaste/audioshare

  - Dynamic upgrade (ad 480 free & ad 480 basic are automatically upgraded to
  pro features when ad 480 pro is installed)

  - Itunes library access
