description: Augustus Loop is an emulation of a tape-based delay effect, with
  extra features that make it usable as a looping device.
details: |-
  Augustus Loop is an emulation of a tape-based delay effect, with extra features that make it usable as a looping device. Its maximum delay time is 3600 seconds, a full hour, and tap length and tap record allow the loop delay time to be set while the first phrase is still being recorded.

  The virtual tape at the heart of the plug-in simulates an old-style tape delay, so the tape speed can be changed to pitch the sound up and down, the tape direction can be reversed, the tape can be stopped, and the delay time can be changed smoothly as if the head gap were moving. A multimode filter and saturation sit in the feedback loop, and a Tape Sim section emulates the signal degradation of vintage tape echo machines.

  Four feedback taps, left to left, left to right, right to left and right to right, each carry independent delay time and feedback settings for ping-pong and stereo delays. Pitch and filter LFOs are included, loop length can be set in terms of the host's tempo, MIDI clock messages can be sent to synchronise other applications, and multiple instances running at once can be synced together.

  Automatic fades up and down allow smooth transitions, optionally clearing the loop once it has faded out, and punch in and out can follow the host transport. An inertia free mode suppresses the tape-like behaviour when delay times change, which is also the route to the multiply and divide features found on some popular looping devices.

  The Fx Loop plug-in configuration routes audio through other plug-ins on either side of the virtual tape, so the maker's own filtering and saturation can be substituted or any other plug-in inserted in the delay path. A Record Offset feature addresses latency in digital audio systems, and the GUI is fully scriptable and skinnable, as is control via MIDI and OSC, with scripts able to control other instances of the plug-in for multi-plug-in setups driven from a single source such as a MIDI pedalboard.
specs: |-
  - Maximum delay time: 3600 seconds (one hour)
  - Four feedback taps with independent delay time and feedback settings
  - Multimode filter and saturation in the feedback loop
  - Tape Sim section emulating vintage tape echo degradation
  - Pitch and filter LFOs
  - Loop length settable from the host tempo
  - MIDI clock output for synchronising other applications
  - Scriptable control via MIDI and OSC
  - Scriptable and skinnable GUI
  - 64 bit AU, AAX and VST formats
  - macOS and Windows
