description: EQ plugin modeled on the ultra-rare Langevin 252A. Motown style 7 band EQ with gain compensation for mixing, bus processing, and mastering. Try it free.
details: |-
  True 252 is a precise emulation of the ultra-rare Langevin EQ 252A 7-band graphic equalizer, described on the page as an interactive graphic EQ based on the original "Motor City" EQ circuit. Kazrog says every effort was made to ensure total accuracy to the original hardware, including the same rich EQ curves and gentle natural saturation.

  The seven bands carry per-band gain/Q interactivity taken from the original Langevin design, which is what the page means by "7 bands of motor city mojo" for tracks, busses and masters. Gain control is continuous rather than stepped, which the page contrasts with competing plugin emulations of similar EQs.

  Built-in gain compensation maintains the same apparent loudness irrespective of the slider settings, and the equalization is 100% cramping-free so analog accuracy holds across the frequency spectrum.

  Oversampling runs up to 32x with separate settings for real-time and offline processing, adjustable on the fly. Two UI themes are included, black and gray, based on the faceplates of the original 252-A and its cosmetic variation the 270, and the GUI is resizable.

  The plugin ships as a 64-bit VST, AU and AAX for Mac and Windows (Pro Tools 12 or higher required for AAX), and as VST3, VST2 or LV2 on Linux, all Universal Binary 2 on macOS. It carries a 100% perpetual license for multiple devices with no iLok and no subscription fees. A time-unlimited free demo is available, with random silent output intervals and preset saving disabled.
specs: |-
  - Emulation of the Langevin EQ 252A 7-band graphic equalizer
  - 7 bands with per-band gain/Q interactivity based on the original Langevin design
  - Continuous gain control, not stepped
  - Built-in gain compensation maintains apparent loudness across slider settings
  - 100% cramping-free equalization
  - Oversampling up to 32x, separate real-time and offline settings, adjustable on the fly
  - Two UI themes (black and gray) based on the 252-A and the 270 faceplates
  - Resizable GUI
  - Universal Binary 2 (native Apple Silicon and Intel)
  - Mac: macOS 10.13.x or higher
  - Windows: Windows 10 or higher strongly recommended
  - Linux: VST3, VST2 or LV2 compatible host (tested on Ubuntu, Linux Mint, Debian, Manjaro)
  - Apple M1 or Intel i5 "Ivy Bridge" CPU or newer strongly recommended
  - Pro Tools 12 or higher required for the AAX version
  - 100% perpetual license for multiple devices, no iLok authorization required
