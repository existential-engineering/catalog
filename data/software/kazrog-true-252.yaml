details: |-
  True 252 is Kazrog's emulation of the rare Langevin EQ 252A, a 7-band graphic equalizer celebrated for its vintage tonal character. The plugin is designed to capture the sweet sound that sparked a legacy, making it suitable for both mixing and mastering applications.

  The plugin features a 7-band graphic EQ with continuous gain control and per-band gain/Q interactivity, giving engineers precise control over the vintage EQ curve. A built-in gain compensation feature helps maintain consistent output levels while sculpting tone.

  Oversampling is supported up to 32x with adjustable settings for real-time versus offline rendering, allowing users to balance CPU load against audio quality. The GUI is fully resizable and comes in two themes — black and gray — offering visual flexibility in any workflow.

  True 252 requires no iLok dongle or subscription. It ships with a 100% perpetual license that covers multiple devices.
specs: |-
  - 7-band graphic equalizer emulation of the Langevin EQ 252A
  - Continuous gain control with per-band gain/Q interactivity
  - Built-in gain compensation for consistent output levels
  - Oversampling up to 32x (adjustable for real-time and offline)
  - Resizable GUI; two themes (black and gray)
  - macOS 10.13+; Universal Binary 2 (Apple Silicon & Intel)
  - Windows 10+
  - Linux: VST3, VST2, LV2
  - AAX requires Pro Tools 12+
  - Perpetual license; no iLok, no subscription; multiple devices
