details: >-
  The a-mix eq is a seven band equalizer. It features five bands of fully
  parametric eq plus high and low pass filters with variable slope.


  Each band offers overlapping frequencies spanning 4 to 5 octaves. The five
  bands overlap for track sweetening or specific problem solving.


  The low and high bands are shelving or peak for that tight low end and smooth
  high end.


  Input and output metering and line level trims for complete gain staging.


  The numeric display windows show current settings for all parameters.
specs: |-
  - Seven band equalizer
  - Five bands of fully parametric eq
  - High and low pass filters with variable slope
  - Lf (low) and hf (high) bands are shelving or peak with variable q
  - Lf sweep between 30hz and 400hz
  - Lf q sweep between 3 and 0.25 in peak mode
  - Lmf sweep between 75hz to 12.5k
  - Lmf q sweep between 3 and 0.25
  - Mf sweep between 75hz to 12.5k
  - Mf q sweep between 3 and 0.25
  - Hmf sweep between 75hz to 12.5k
  - Hmf q sweep between 3 and 0.25
  - Hf sweep between 2.5k and 20k
  - Hf q sweep between 3 and 0.25 in peak mode
  - Filter boost/cut: +/- 12db
  - Low pass filter frequencies - off, sweep between 12k and 3k
  - High pass filter frequencies - off, sweep between 20hz and 350hz
  - Separate in/out switch for each band
  - Phase reverse switch
  - Input and output peak meters with gain clip
  - Numeric display windows for gain, frequency and q and input and output
  - Input and output trim adjust -12db to +4db
  - In/out bypass switch
  - VST plugin
  - Audio units plugin
  - Macos and windows compatible
