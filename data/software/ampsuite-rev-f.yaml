details: |-
  This amp sim closely recreates a 90's classic amplifier with every mode available. Channel select offers green, orange and red channels available from clean to high gain modern tones. Channel cloning allows either channel to have a modern or vintage sound. Tube select lets you choose between 6l6 and el34 output tubes. Power select allows you to run in low power mode to emulate the use of a variac. Rectifier select offers a choice between old school saggy tube rectifiers, or diode rectifiers for a tight and modern sound.

  An amplifier is nothing without a good cabinet, that's why we included not one but two fully modelled cabinets based on an oversized 4x12 and a 2x12. Each cabinet is captured with a total of 7 studio-grade microphones, giving you almost endless possibilities for shaping your tone. Our speaker simulator not only lets you precisely place your virtual microphone in front of the cabinet, but also makes the amplifier respond differently to different loads. Each cabinet truly gives its own sound, even when using your own irs.

  Pedals include x-drive, a classic drive with a bit more bite than you're used to, with the sharper midrange making it a perfect match for the rev f. Forte boost provides 22 db of pure boost, perfect for when you need to tune just that little bit lower. A selection of time based fx pedals is included to create inspiring lead tones, including chorus, delay and reverb.

  Utilities include gate to tighten your sound with the built in gate, drop to transpose your guitar down by up to 12 semitones for those ultra low notes, tight to control the low end with this proprietary low frequency compressor that only clamps down on the palm mutes without sucking too much tone out of the guitar, and smooth to get rid of that icy pick sound. The built in tuner allows you to always stay in tune and with the built in mute button, you won't have to annoy anyone in the process.
