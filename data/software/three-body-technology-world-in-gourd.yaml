description: World in Gourd is the deepest sampled ancient Chinese Hulusi in the world, diversify your ethnic library.
details: |-
  World in Gourd is a Chinese Hulusi virtual instrument. The Hulusi is a clarinet-like instrument from southern China, especially favoured by the Dai, Yi and Miao ethnic minorities. It has a bamboo wind tube and a gourd resonance chamber, with two auxiliary wind tubes that play two fixed notes for harmonics. Its mellifluous and lovely sound is widely used to express romantic relationships and to accompany lyrical dance.

  The library holds 1829 samples at 44100 Hz / 24 bit, totalling 1.1GB. Five microphones in different positions captured the spatial and reverb characteristics of the instrument, mixed down to four channels (Yin, Yang and far stereo) whose volumes are adjustable in software to obtain a wide range of tones.

  Performances including mordent, finger pole popping, trill, flutter, vibrato, staccato and gliss can all be triggered in the software. Real-recorded expressions are freely controllable through MIDI CC, gliss is available at three recorded speeds combined with sample synthesis for freely adjustable speed, and a real-sample-based LFO engine drives realistic and adjustable vibrato. Users can switch between bass, alto and treble Hulusi for different tuning, with the alto sounding from the original samples, and the two harmony tubes were recorded into triggerable samples.

  Legato was recorded between notes at two speeds and applied according to playing speed, covering the regular, fast and popping legato specific to the Chinese Hulusi. Because a naive cross-fade between two legato samples induces phase cancellation at the junction, a spectrum fusion legato technique applies frequency-domain fusion instead of a time-domain cross-fade where needed, improving the smoothness of the connection.

  The instrument runs on a purpose-built sampling engine with disk buffer streaming, sample compression and sound fusion technology. Convolution reverb samples recorded at famous natural and historical heritage sites in China place the instrument in spaces such as the Great Wall or the Terracotta Army site, the effect rack from Heavier7Strings adds Compressor, EQ, Chorus and Ping-Pong delay, and a pattern library with updatable presets accepts custom patterns dragged in as MIDI clips.
specs: |-
  - 1829 samples
  - Sample parameters: 44100 Hz / 24 bit
  - Sample size: 1.1GB
  - Five microphone positions mixed down to four adjustable channels (Yin, Yang and far stereo)
  - Performances: mordent, finger pole popping, trill, flutter, vibrato, staccato and gliss
  - Real-recorded expressions controlled by MIDI CC
  - Gliss at three recorded speeds plus sample synthesis
  - Real-sample-based LFO vibrato engine
  - Switchable bass, alto and treble Hulusi tuning, with alto from the original samples
  - Triggerable samples recorded from the two harmony tubes
  - Regular, fast and popping legato, with spectrum fusion legato technology
  - Self-developed sampling engine with disk buffer streaming and sampling compression
  - Convolution reverb recorded at Chinese natural and historical heritage sites
  - Effect rack from Heavier7Strings: Compressor, EQ, Chorus and Ping-Pong delay
  - Pattern library with presets and user patterns from dragged MIDI clips
  - Minimum system requirements: Intel or AMD CPU with SSE 4.1 instruction set, or Apple chip
  - Mac OS X 10.9 / Windows 7
  - 4GB RAM and 2GB disk space
  - Plugin formats provided: 64-bit VST2, VST3, AAX and Audio Unit
  - Extra requirements on specific hosts: Logic Pro X or higher (Logic 9 is not supported)
