details: |-
  Gain Reduction 2 is unmatched control of your vocals in one audio plugin.
  Features
  Compression Modes
  Choose between heavy or light compression to fit your style and genre.
  Light Mode: Delivers softer compression and less saturation than the heavy mode.
  Heavy Mode: the classic Gain Reduction compression/saturation algorithm.
  Warmth
  Add tube saturation to heat up your vocals and unlock rich harmonics in your vocal sound.
  Clarity
  Remove harsh unwanted frequencies from your vocals - automatically and dynamically detected.
  Breath
  Intelligent control of breathing in between syllables all in a simple knob.
  Slay
  Set the exact amount of compression you desire to achieve the perfect dynamic balance
  Sibilance
  Decide exactly how much "ess" you want in your signal with a single knob.
  Body
  Control the exact amount of low-end and low-mids in your vocal with this setting.
  Air
  Add air to your vocal and make it float on the mix with ease, just turn up the air and fly!
  Mix
  Balance the output of GR2 with your input signal at any level.
  Contextual Visualizer
  See exactly what you're doing to the audio as you're changing it with detailed visual feedback.
  Audio Demos
  JST · Gain Reduction 2
  Includes
