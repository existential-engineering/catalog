description: American Class A is based on the greatest of American mixing
  console hardware. It's a fully featured channel strip plugin with intuitive
  layout and a classic sound. Perfect for gut-busting drums, face-melting
  guitars, punching bass, rich vocals, and more.
details: |-
  Gut-busting drums. Crackling, searing, face-melting guitars. Meaty, punching bass. Rich, up-front vocals. Wide-open, airy, living electronics. If you will it, it is no dream with the American Class A.

  Based on the greatest classics of American mixing console hardware, this channel strip is fast and easy to work with, and brings a truckload of character to the party. Both an expansion to Console 1 and a native plug-in, American Class A has it all.

  The American gear on which this strip is based is perhaps best known for the way it brings out the power and energy of modern rock music; acts such as Radiohead, Soundgarden, Foo Fighters, and Pearl Jam have used similar consoles. With a shape section featuring gate and transient designing, a stellar four-band EQ with proportional Q and range control, a fascinating compressor design which can be switched between feedback and feed forward operations, and a warm, crunchy output drive section, no modern studio is complete until this sonic option is at hand.

  Drums leap out of the speakers, vocals grab you by the scruff of the neck, guitars spontaneously combust. But the American Class A is also capable of subtlety. Using the range controls of the EQ to limit the gain boosting and cutting to a half or even a quarter of the starting values, it becomes a high-resolution mastering unit. And running a synth sound through these same hard-rocking controls can result in improved openness and vitality just as easily as increased grunt.

  The sonics are not the only area in which the American Class A is world-class. The plug-in also provides state-of-the-art visual feedback, with a large display offering FFT readouts or a waveform view in which you can see the effect your settings are having on your signal in real time. The plug-in also seamlessly integrates with Console 1 as a channel strip, so if you use Console 1 you'll get the added speed and benefit of hands-on analog workflow.
specs: |-
  - Console 1 Ready: works as a native plug-in and as an expansion for Softube Console 1, with both versions included in one license
  - Amp Room Ready: usable in Amp Room as two separate modules, compressor and equalizer, included in Amp Room
  - Classic American mixing console sound: all the quirks, features, and amazing sound of the original hardware
  - A real and complete workhorse replacement for stock DAW mixing tools
  - Characteristic stepped EQ with proportional Q values, giving bold boosts and clean cuts
  - Four-band EQ with proportional Q and range control
  - Unique compressor design, which can operate in feedback or feed forward topologies
  - Shape section has both gate and transient shaper, with the same analog sound as the strip's circuitry
  - Crunchy drive from the output stage, with controllable character
  - Cutting-edge graphics and waveform visualisations, with a large display offering FFT readouts or a waveform view
  - 20-day trial, 14-day returns, three activations per license
  - Requires a Softube account and an iLok account (no physical iLok required)
