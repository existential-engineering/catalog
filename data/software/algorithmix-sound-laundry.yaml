description: A set of high-end, easy-to-use software modules intended for
  cleaning and mastering noisy, scratchy recordings, especially old vinyl and
  78s records, as well as tapes or cassettes.
details: |-
  Sound Laundry is a modular audio restoration suite from Algorithmix designed to
  clean and master noisy or scratchy recordings. Its primary targets are old vinyl
  records, 78rpm shellac discs, tapes, cassettes, and other degraded audio sources.
  It is also described as an ideal toolset for forensic audio applications. The
  software operates as a standalone application with its own host module (PlugIn
  Station) and an integrated wave file recorder.

  The suite consists of multiple specialized plug-in modules that each address a
  specific type of audio problem. The DeScratcher removes clicks, spikes, digital
  cross-talk, static discharge, crackles, and pops. The DeNoiser targets constant
  background noise including hiss, hum, thyristor buzz, fan noise, and camera sound.
  Additional modules include PEQclassic (six-band parametric equalizer), High/LowCut
  Filter (linear-phase technology), DeRumble (subsonic signal attenuation),
  DC-Removal, AlgoSpec (3D moving spectrum analyzer), and SignalControl (volume,
  stereo balance, polarity).

  Sound Laundry supports real-time preview while fine-tuning parameters, with
  real-time play-through processing (live mode). It also supports offline processing
  at up to 10x real-time speed. The software includes a difference function for
  monitoring the noise being removed, and a wave display with loop editor for precise
  noise print capturing.

  All calculations are performed with 80-bit floating-point accuracy. The software
  supports up to 96 kHz sampling frequency and 32-bit float wave format in offline
  processing mode. It is distributed online and sold as a modular system — each
  plug-in can be purchased separately, or as the 'classic' or 'advanced' bundle with
  discounts of up to 30%.

  The 'classic' bundle includes DeScratcher, DeNoiser, Analyzer, High/LowCut Filter,
  DC-Removal, and SignalControl. The 'advanced' bundle adds PEQclassic, DeRumble, and
  AlgoSpec. The PlugIn Station host module is included with all purchases and features
  a WAV and MP3 file player, wave display with loop editor, and recorder with
  threshold and time limit controls.
specs: |-
  - Processing modes: real-time (live mode) and offline (up to 10x real-time speed)
  - Internal precision: 80-bit floating-point
  - Supported formats: WAV (16-bit, 32-bit float), MP3
  - Sample rates: 44.1, 48, 88.2, and 96 kHz
  - Classic bundle: DeScratcher, DeNoiser, Analyzer, High/LowCut Filter,
    DC-Removal, SignalControl
  - Advanced bundle: adds PEQclassic, DeRumble, AlgoSpec
  - System requirements: Windows 95/98/ME/2000/NT 4.0; 166 MHz Pentium or AMD K6
    200 MHz; 16-bit 44.1 kHz stereo sound card; 10 MB free disk space
