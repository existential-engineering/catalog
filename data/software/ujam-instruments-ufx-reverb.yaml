description: A reverb designer featuring 20 distinct reverb models, each tweakable through Ambience and Character sections with musical, easy-to-grasp parameters such as room size, density, damper and modulation.
details: |-
  UFX REVERB offers 20 distinct reverb models, each tweakable through the Ambience and Character sections with musical, easy-to-grasp parameters such as room size, density, damper and modulation. A multimode filter, Freeze function and ducking control complete the effect.

  Version 2 is an evolution of the same plug-in, based on user feedback. It adds a Dual Mode for a fuller, denser reverb, Early Reflections for improved spatial definition, 10 additional reverb modes (among them Drum Room, Scoring Stage, Gigathedral and Shimmer), 15 new filters, 40 new Finisher modes and 100 new presets, with all existing presets upgraded.
specs: |-
  - 20 reverb modes
  - Version 1 modes: Basic, Room, Hall, Plate, Spring, Digital, 80s, Warm, Gated, Reverse
  - Version 2 modes: Drum Room, Courtyard, Scoring Stage, Parking Garage, Vocal Ice, Gigathedral, Gated Freeze, Shimmer, Fat Shimmer, Long Reverse
  - Dual Mode for instant fuller, denser reverb
  - Early Reflections adding improved spatial definition
  - 15 new filters and 40 new finishers in version 2
  - 100 new presets, all existing presets upgraded
  - Ducking control, Freeze function and multimode filter section
  - Operating systems: Windows 10 to Windows 11, macOS Catalina (10.15) to macOS Sequoia (15)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 300MB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App, or downloadable installer file
  - Authorization: quick authorization via the UJAM App, or enter your email and password within the plug-in
