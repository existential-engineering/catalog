description: Time-saving, high-resolution audio repair processor freeing
  problematic live recordings from unwanted tenacious audio disturbances.
details: |-
  reNOVAtor helps when all other audio tools and editing tricks fail. It can
  eliminate disturbing audio events while perfectly preserving the sound quality
  of your original material, because every spectral modification is executed in
  linear-phase domain.

  This is an extremely time-saving tool for mastering or post-production
  engineers struggling with disturbing noises in live recorded music, interviews
  or film sound. If squeaky chairs, coughs, performance noises, falling keys or
  ringing cell phones make your recording unacceptable, take reNOVAtor.

  reNOVAtor uses several unique denoising techniques developed by Algorithmix.
  The selected part of an audio signal including disturbing sounds is first
  converted to its spectral representation and mapped to a color-coded
  spectrogram. Then the algorithm determines the amplitudes of each spectral
  beam at the edges of marked area and calculates parameters for a denoising
  process working on each single beam within the selection.

  It works like an adaptive linear-phase multiband compressor (up to 16384
  bands) or an inverse noise gate, following psychoacoustic model of masking.
  Functions for automatic detection of clicks and spikes, as well as
  identification of tones and harmonics are also provided.

  The stand-alone editor AlgoEdit allows audio repair and enhancement with the
  reNOVAtor without the need of an external audio editing system.
specs: |-
  - Linear-phase spectral processing
  - Up to 16384 band adaptive multiband processing
  - Color-coded 3D spectrogram display
  - Automatic click and spike detection
  - Harmonics identification and selection
  - Scalable plugin window with zoomable spectrogram
  - Includes AlgoEdit stand-alone editor
  - Supports sampling frequencies up to 384 kHz
  - Compatible with Pyramix Virtual Studio, WaveLab, Sequoia 13
  - Stand-alone runs on Windows 9x/XP/Vista/7/8/8.1 32/64Bit
