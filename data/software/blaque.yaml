description: Simple & unique electric guitar sounds. The Blaque - dark electric
  guitar VST will help you get the grimey & dark electric guitar tones.
details: |-
  Blaque is a sampled electric guitar instrument. We ran our electric guitar
  through countless amps & FX to create 30 different electric guitar sampled
  instruments! Containing 4 total sampler engines, you can blend 4 different
  guitar tones at a time.

  By blending these 4 guitar tones together, we bring you some unique electric
  guitar combinations. With blaque's light & easy-to-use interface, you will
  have no problems finding a preset or creating your own sounds altogether.

  The interface has 3 main sections: top: fx in-depth adjustments + preset
  browser here you will find all of your fx parameters + your preset browser.
  Easily browse, adjust & tweak your sounds in this section. Middle: sampler
  adjustments this section contains the sampler engines for your guitar
  instruments. Quickly edit & change your samples to create the sound you're
  looking for. Bottom: fx quick adjustments linked to the fx with the same name
  in top section, these are an even faster way to add fx & get an idea of your
  sound.

  With streamlining your productions in mind, we kept everything, well, simple!
  Minimal fx allows you to use the fx you're already familiar with, quickly have
  full control over each sound & easily browse presets.

  Blaque is a lightweight that hits like a heavyweight! What we're trying to say
  is it uses minimal cpu but still packs a big punch. With a quick, easy &
  painless install (thanks to our easy to follow install guide), you will be
  creating something fresh in no time!
specs: |-
  - Sampled electric guitar instrument
  - 4 sampler engines
  - 30 electric guitar sampled instruments
  - Minimal FX
  - Preset browser
  - FX in-depth adjustments
  - Sampler adjustments
  - FX quick adjustments
  - Minimal CPU usage
  - Windows 10+ VST3 (64-bit)
  - Mac mojave 10.14+ VST3 & AU (64-bit)
  - 20 factory guitar presets
  - Compatible with all DAWs (excluding pro-tools)
  - Easy install guide
