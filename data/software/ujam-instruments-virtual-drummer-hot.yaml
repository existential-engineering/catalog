description: Virtual Drummer HOT provides real drum performances with punchy drum machine-like processing to replace your sample library with more lively and energizing drum grooves.
details: |-
  The majority of today's charting tracks use electronic drum samples or highly processed combinations of sample layers, and those samples need extensive engineering to sit properly in a radio-ready mix because they are often stale, lifeless and difficult to manipulate. Virtual Drummer HOT provides real drum performances with punchy drum machine-like processing instead.

  Thirty styles cover hundreds of rhythms from the most popular genres, ranging from Hip Hop and Rap to Indie and Electronic, across five drum kits named BOOM, WAVE, VANILLA, FRESH and BRITTLE, for classic Hip Hop through Synthwave and 80s to EDM and modern Trap.

  A seventh instrument channel was added to each drum kit, unique to HOT, so clap sounds can supplement snares and accentuate grooves. Each instrument or group of instruments has its own microphone channel for individual volume and parameter control.

  The Juice fader offers a seamless transition from a completely natural drum variant to the archetypical sample aesthetic of the most popular drum machines, by sending the drum signal through a chain of full-bandwidth hifi microphones. The Master section adds a reverb preset and level, a Saturate or Grit processor, a maximizer and a volume slider with a level meter, while each Mix Preset swaps an entire multi-bus effect chain for every channel.
specs: |-
  - 30 styles, 690 playable phrases and over 100 global presets
  - 5 drum kits (BOOM, WAVE, VANILLA, FRESH, BRITTLE), 6 mix presets, 6 reverb modes
  - 7th instrument channel per kit for clap sounds
  - Per-instrument microphone channels for kick, snare, clap, hi-hat, toms, rides and crashes
  - Special "Juice" FX control
  - Master section with reverb, Saturate or Grit processor, maximizer and level meter
  - MIDI drag and drop, resizable user interface
  - Operating systems: Windows 10 to Windows 11, macOS Catalina (10.15) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - 8 GB of RAM
  - 6.11GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Automated installation via the UJAM App or a downloadable installer file
  - Authorization via the UJAM App or by entering email and password in the plug-in
  - Supported standards: MIDI
