description: "Streamlined vocal effects plugin built on Dehumaniser 2 technology
  for transforming character voices into creature vocalizations using simplified
  controls."
details: |-
  5 dynamic control parameters: Size, Fury, Age, Wildness, Character. 35 preset sounds categorized as Dialogue, Sci-fi, Growls/Roars. 48 animal sounds via Scrubbing Convolution Module. Two interface layouts: slider-based or X/Y Pad control. Solo scrubbing playback. TouchOSC remote control compatibility. iLok account required. 10-day free trial available.
specs: |-
  Mac: macOS 10.13+, Apple Silicon native support. Windows: 10 64-bit+. CPU: 2.4 GHz minimum. RAM: 4 GB minimum. Sample rates: 44.1 kHz to 192 kHz. 64-bit only. 0.02 GB assets. Supported DAWs: Pro Tools 11+, Logic Pro X, Nuendo, Ableton Live, Cubase, Reaper.
