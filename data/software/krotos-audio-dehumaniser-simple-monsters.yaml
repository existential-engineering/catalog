description: Where simplicity meets power, Simple Monsters is a powerhouse of sound design capable of delivering incredible vocal effects without complex plugins. Built on Dehumaniser 2 technology for creature sound design and extreme vocals.
details: |-
  Built on the technology of Dehumaniser 2, Simple Monsters offers a streamlined, user-friendly interface. With just a few sliders and assignable X/Y pads, character voices can be transformed into an infinite range of monster sounds in seconds.

  Use cases the page names include unique vocal effects for music production, creature sounds for sound designers, animators and game designers, character voices and dialogue effects for voice artists, and mangling or distorting drums and other samples.

  Parameters can be performed and controlled remotely from an iOS or Android device using TouchOSC (a TouchOSC licence is not included).

  35 presets are categorised as Dialogue, Sci-fi, and Growls and Roars, and 48 animal sounds are available through the Scrubbing Convolution Module. The interface offers a choice of a slider layout or an X/Y Pads layout, with elements assignable to each axis for unique processing or maximum responsiveness during performance.

  Five dynamic control parameters (Size, Fury, Age, Wildness, Character) plus a sample scrubbing function cover the sound design. A 10-day free trial is available.
specs: |-
  - 2.4 GHz CPU minimum
  - 4 GB of RAM
  - macOS 10.13 or above (working on OS X Ventura but not yet fully tested), or Windows 10 64-bit or above
  - Native Apple Silicon support
  - Formats (64-bit): AAX Native/AudioSuite, VST, VST3, AU
  - Processing up to 192 kHz / 24-bit (minimum sample rate 44.1 kHz, maximum 192 kHz)
  - Solo scrubbing playback
  - Save and recall presets
  - Control parameters: Size, Fury, Age, Wildness, Character
  - Digital download, internet connection required at the time of activation
  - An iLok account (free at ilok.com) is required for both demo and full version
  - An iLok 2 or later is required for dongle use
  - Can only be activated on one computer at a time
  - Supported hosts: Pro Tools (11 or later), Logic Pro X, Nuendo, Live, Cubase, Reaper
  - TouchOSC licence is not included
  - 47 sounds, 0.02 GB assets
