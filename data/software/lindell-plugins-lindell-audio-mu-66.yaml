description: "Emulation of a classic Vari-Mu tube compressor from the 1960s-70s
  era. Captures the sonic character of vintage analog limiters with tube and
  transistor circuitry delivering golden tones. Features adjustable knee, SMASH
  switch for heavy compression, and NIVEAU filter for natural-sounding
  compression."
details: |-
  Precise Vari-Mu compressor emulation
  Fast attack times for tight dynamics control
  Adjustable knee for enhanced versatility
  Tube and transistor circuitry
  Multiple sidechain options
  SMASH switch for heavy compression effects
  NIVEAU filter for natural-sounding compression
  Ideal for vocal production and mastering
