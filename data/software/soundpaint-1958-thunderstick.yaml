details: |-
  Feel The Thunder

  Get ready to journey back in time with the legendary 1958 Thunderstick! This guitar's story is like a rock 'n' roll adventure – originally a Supro catalogue gem, it's technically a Super Belmont Special due to its unique body and 3/4 scale length. Sporting a single coil pickup in the neck, its electronics are nestled in a cool molded plastic pick guard. The carved wood bridge and in-line tuners give this guitar a truly distinctive vibe. Now, onto the sound – we've captured it all, from the original electronics with paper and oil cap to the woody, wooly, and oh-so-saturated tone. Prepare for a bass-heavy, gritty goodness that oozes a sweet Blues vibe. We've meticulously sampled this treasure with a tube amp, clean sound, and even a fuzz pedal, covering everything from palm mutes to slides, rolls, and transitions. With a treasure trove of samples and guitar tones, this Thunderstick is your ticket to musical awesomeness in Soundpaint.
