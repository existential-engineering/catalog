details: |-
  With meticulously crafted, sample-based oscillators and an expansive
  modular-patching system, BEYOND Provenance is an instrument that lets you
  create one of a kind sounds like you've never heard before.

  Boasting a powerful arp/sequencer engine with a wide range of performance
  effects, the rhythmic pulse of beyond is electrifying.

  Loaded with over 250 professionally crafted snapshots from pop driven arps, to
  chugging bass and glitchy effects you'll find inspiration the moment your
  fingers touch the keyboard.

  And because of beyond's unique approach to sound design, you have complete
  control over every detail of every snapshot.

  Regardless of genre, from beatmaking to edm to dramatic underscore, beyond
  provenance sets the stage to inspire audiences around the world.
specs: |-
  - Sample-based oscillators
  - Modular-patching system
  - Arp/sequencer engine
  - Performance effects
  - 1 nki featuring the powerful beyond engine
  - 275 professionally crafted snapshots
  - 32 detailed and multi-sampled sound sources
  - Advanced arpeggiator/sequencer engine
  - 16 individually assignable voices in 2 layers
  - Unison mode
  - Robust FX performance capabilities
  - 65+ modular patchpoints
  - 7 modulation generators
  - Native Instruments Kontakt v6.6.0+
  - macOS 10.11 or higher
  - Windows 7+
  - 2 or more GB of disk space
  - 4 GB RAM (6+ GB recommended)
