  doubling effect — each controllable with a single slider.
details: |-
  DeeVocalTools is an all-in-one vocal processing plug-in that bundles four essential vocal tools into a single interface: a de-esser for reducing harsh sibilance, a multiband compressor for evening out vocal loudness in a balanced way, a vocal EQ for adjusting high frequencies, and a pitch-tracking doubling effect for adding the thickness of layered recordings.

  The defining feature of DeeVocalTools is its simplicity — each of the four processors is controlled by a single slider, making it possible to get professional vocal results without complex settings. The plug-in targets common vocal problems such as thin-sounding, unstable, or unclear vocals and addresses them simultaneously through its combined processing chain.

  DeeVocalTools is compatible with all major DAW hosts on both macOS and Windows. Tested hosts include Ableton Live, Cubase, Logic Pro X, Pro Tools, Studio One, FL Studio, Bitwig Studio, Reason, Digital Performer, GarageBand, OBS Studio, and others — thirteen hosts in total.

  On macOS the plug-in runs as VST2, VST3, AU, and AAX (64-bit, macOS 10.12 or later). On Windows it runs as VST2, VST3, and AAX (64-bit). Download sizes are approximately 20 MB for macOS and 12 MB for Windows. The demo version inserts one second of silence every 30 seconds and requires an internet connection for registration.

  DeeVocalTools was sound-designed by Franck Shigetora and is developed and distributed by DOTEC-AUDIO, cyber rock.LLC, and fmfmsoft Corp.
specs: |-
  - De-esser: reduces harsh sibilance
  - Multiband compressor: evens out vocal loudness in a balanced way
  - Vocal EQ: adjusts the top end (high frequencies)
  - Pitch-tracking doubling effect: adds thickness of layered recordings
  - Each function adjusted with a single slider
  - 64-bit only
  - macOS 10.12 (Sierra) or later
  - Formats: VST2, VST3, AU (macOS only), AAX
