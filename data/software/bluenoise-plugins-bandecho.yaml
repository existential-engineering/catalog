description: Bandecho is a plugin modelled after vintage tape echoes like Roland
  space echo and watkins copicat, but with several extra features.
details: |-
  Bandecho actually consists of eight echoes and not one as you might think. The
  first is the stereo tape echo that is the heart in the plugin and what drives
  all the other functions. This echo can be up to 5 seconds long and can be
  synced to your host bpm for easy beat making. The readouts automatically
  change from milliseconds to beat when set syncing to host. You can change from
  regular quarter notes to dotted and triples. The two sliders adjust the time
  and in stereo mode you can set a different echo time for left and right.

  In bluenoise plugins opinion an echo needs a distortion part to sound great
  and this drive is something special. Because it has a cutoff and a resonance
  it can self oscillate and create tones inside the distortion. Basically you
  can send the whole signal through the oscillating distortion to make it sound
  warm or to give it more bite.

  The effect rack consists of several unique effects perfect for making the echo
  shine. The first part is the old tape which makes the tape slow down and speed
  up like a bad tapehead. The next part is the granilizer which really gives the
  tape a dirty sound. It crouches the echoes down to small fragments. At the
  bottom there is a chorus and that does what you expect. On the right-hand side
  is the comb filter which is the second echo stage in bandecho.

  The multiecho rack consists of the six last echoes in the chain. The first two
  are taken from the input signal making it two extra basic echoes. The third
  and the fourth are taken after the distortion part and will echo the distorted
  signal. The last two echoes are taken after the combfilter and will therefore
  have all the different processes included when echoed.
specs: |-
  - Stereo tape echo
  - Up to 5 seconds delay
  - Host bpm sync
  - Quarter notes, dotted and triple note divisions
  - Stereo independent echo time
  - Oscillating filters
  - LFO modulation
  - Distortion with cutoff and resonance
  - Self-oscillating distortion
  - Old tape effect
  - Granilizer effect
  - Chorus effect
  - Comb filter
  - Six multiecho stages
  - Send/insert effect routing
  - Windows compatible
