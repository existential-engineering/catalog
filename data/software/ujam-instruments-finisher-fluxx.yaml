description: Finisher FLUXX is a creative effect plug-in that is certain to deconstruct, animate and transform your sounds.
details: |-
  Since the beginning of sound design, audio scientists have been toiling away in their labs, micro-dosing fuzz boxes, sample rate reduction and feedback artifacts in careful proportions. One question was always unsolved: can all of these be used at once? Finisher FLUXX answers it with 50 unique effect chains squeezed into a single FX unit.

  Nothing slaughters creativity faster than a patch cord eyesore. With FLUXX, all the complex routing is hidden away so the focus stays on sound design. Every Mode is carefully pre-set for maximum flexibility without hours spent learning a new interface.

  Dial up the saturation, delay, doubletracking, phasing, depth, darkness and more and the audio devolves into an entirely new soundscape. This magic knob reacts differently with every preset, sometimes with grace, more often with rage.

  Four individual macro controls offer surgical precision, each controlling a separate effect cluster, though most of the time simply changing presets and dialing the Finish knob up to max conjures up plenty of chaos on its own.
specs: |-
  - 50 custom sound-designed multi-effect chains
  - Creative FX ranging from light and floating to dark and saturated
  - Single Finish knob plus 4 individual macro controls, each driving a separate effect cluster
  - Saturation, delay, doubletracking, phasing, depth and darkness processing
  - Complex routing hidden behind pre-set modes for fast sound shaping
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Windows: Windows 10 to Windows 11
  - Mac: macOS Catalina (10.15) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 4 GB of RAM
  - 0.08 GB of disk space
  - 1280x768px display, internet connection
  - Delivery: automated installation via UJAM App, or downloadable installer file
  - Authorization via the UJAM App, or email and password within the plug-in
