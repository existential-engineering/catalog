description: Complexx is a dynamics plugin blending compressor, limiter, and
  expander functions, inspired by a vintage British dynamics processor from the
  late 1960s. It is designed for mix bus glue, drum bus punch, instrument
  polish, and vocal enhancement.
details: |-
  Your Gateway to Modern-Vintage Sound

  Complexx perfectly captures the essence of an era where audio processing was both an art and science. Seamlessly blending historic dynamic processing with modern usability. Whether you're mixing individual tracks or glueing your mix-bus, Complexx has your back. Unlock that legendary sound for yourself, today! Mix Bus Processing : The ultimate compressor for your mix-bus. Its soft-knee bus compression binds and glues tracks together while retaining crisp transients! Go further, and take advantage of the mix-knob at the top bar to dial in your processing in parallel to your liking. Drum Bus Dynamics : Recreate the iconic drum sounds that defined legendary tracks. Whether it's slamming room mics or refining the punch of your drum bus, Complexx's attack and release options deliver punch and vigor to any drum recording. Instrument Polish : Maintaining dynamics and detail has never been so easy. The Complexx can add depth, density, and clarity, making every note on virtually any instrument shine. Vocal Enhancement : Transform your vocals with delicate compression or use the integrated expander to minimize ambient noise, resulting in pristine, front-and-center vocals.
