description: A digital emulation of a class AB tube power amplifier for guitar. Designed to pair with any guitar preamp, featuring dynamic analog modeling of EL34, 6L6GC, and KT88 pentodes/tetrodes and ECC83/12AX7 triode phase inverter. Suitable for live playing and jamming, tracking, or mixing.
details: |-
  Dynamic EL34 / 6L6GC / KT88 pentodes/tetrodes analog modeling (push-pull stage)
  Dynamic ECC83 / 12AX7 triode analog modeling (phase inverter stage)
  Mono/Stereo processing support
  Selectable oversampling (up to 8x)
  Global input/output level controls
  64-bit double precision floating point processing
  Fully automatable controls
