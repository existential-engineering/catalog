description: "Class AB tube power amplifier simulator for guitar, designed to be
  paired with preamp plugins. Features dynamic EL34/6L6GC/KT88 pentode modeling
  and ECC83/12AX7 triode modeling. Not based on any particular physical power
  amplifier."
details: |-
  1.0.1

  Dynamic EL34 / 6L6GC / KT88 pentodes/tetrodes analog modeling (push-pull stage)
  Dynamic ECC83 / 12AX7 triode analog modeling (phase inverter stage)
  Mono/stereo support
  Selectable oversampling rate (up to 8x)
  Double precision (64-bit) floating point mathematical model
  Fully automatable controls
