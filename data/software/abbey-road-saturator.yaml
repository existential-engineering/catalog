details: >-
  Musical analog saturation & distortion from the legendary abbey road studios:
  the sound of classic tubes and transistors, driven hard from subtle to
  extreme, and excited by the ultra-rare emi tg12321a secret weapon of abbey
  road engineers. Saturation is the heart and soul of analog recording and
  mixingfrom the subtle soft clipping of a tube preamp, which adds warmth and
  pleasing harmonics to a drum or vocal part; to full-blown console distortion
  that makes a synth, bass or guitar part 'sing' in the mix.


  Modeled directly from time-proven saturation chains at abbey road studios,
  abbey road saturator provides inspiring saturation and distortion, unlike any
  other device. The plugin offers two versatile desk distortion flavors: the
  crunchy tube redd sound, and the rounded solid-state tg12345 tonewith the
  sophisticated input, gain and output stages of both consoles calibrated to
  perfection by abbey road's engineers.


  In 1962, emi central research laboratories patented a tape noise reduction
  system called the tg12321a "compander" that compresses on input (encoding) and
  expands on output (decoding). The first generation of pop engineers at abbey
  road discovered that using the encode-only part of the process resulted in a
  beautiful high-frequency emphasis that added air and excitement and helped
  instruments cut through the mix: a secret weapon in the studio.


  Abbey road saturator models the original tg12321 unit, feeding into the redd
  or tg desks, for a one-of-a-kind excited saturation effect. The plugin also
  gives you flexible control over the compander's crossover frequencies,
  allowing it to focus in on different ranges depending on the source material:
  lower settings will be at home on bass and kick drums, higher values will
  afford unmistakable shine to vocals.


  Abbey road saturator also sports unique m/s processing, letting the distortion
  apply either in stereo or to the mid or sides separately. Activate this beast
  on drums, drive the centered kick and snare into beefy levels, and leave the
  sides (overheads and cymbals) clean and sparkling.
