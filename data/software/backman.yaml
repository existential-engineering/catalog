details: |-
  BackMan reverses incoming audio signal in sync (it will follow host bpm).
  BackMan reconstructs the backwards signal to the strong and weak beats (ie:
  snare, kick) hit on the right places.

  Useful on all sort of things, from build ups to drum fills.

  Useful on guitars, works as a reverse delay.
specs: |-
  - Audio signal reversal
  - Host bpm sync
  - Beat reconstruction
