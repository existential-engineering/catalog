details: |-
  Bpm, or beat production machine, is a complete rhythm production center for
  mac and Windows that combines state-of-the-art rhythm programming technology
  with playable virtual instrument operation inspired by the classic drum
  machines of the 80's and 90's.

  Bpm unites drum machine-style operation with advanced virtual instrument
  technology to give you the ultimate rhythm programming experience. Combine
  drum kits, sequenced patterns, sliced loops and instrument sounds to realize
  your rhythmic vision, mixing and matching any playing style with any drum kit.
  Or plug in your pad controller or MIDI keyboard to capture your live,
  groove-quantized performance directly in bpm.

  Browse bpm's vast 15 gb sound library of expertly recorded and mastered 24-bit
  96 khz rhythmic material for urban, r&b, hip hop, techno, electro, house, pop,
  rock and other music styles. Sample your own drum sounds directly into bpm's
  drum pads, or simply drag and drop clips from your computer desktop, to add
  infinite possibilities to your own, unique sound.

  Trigger scenes during live performance from pads or MIDI notes. Drag and drop
  scenes into a song to build an entire track in seconds. Finalize your track
  with bpm's comprehensive graphic mixer, unlimited effects processing and
  dozens of world-class effects, including multi-band eq, filter, delay, drive,
  distortion and convolution reverb.

  Advanced features include drag & drop audio import/export, multiple outputs,
  universal plug-in compatibility and stand-alone operation.
