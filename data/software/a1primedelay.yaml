description: A1PrimeDelay is an analog-style tape delay plugin, modeled
  internally after the iconic classic analog devices of the 70s and 80s.
details: |-
  When you first open a1primedelay, you will be surprised at how easy it is to
  achieve a great sound. The well-designed and user-friendly gui allows you to
  quickly and easily dial in the desired sound with just three knobs.

  For those who want more control over the fine-grained details of their sound,
  simply click on the "expert" button. This will reveal all the advanced
  settings, giving you the ability to fine-tune the sound to meet your specific
  needs.

  A1primedelay comes feature-packed with: analog-style resonant filters (lp, bp,
  hp) in the feedback loop. A built-in ducker. Transient softening. High-quality
  (oversampled) saturation. An additional chorus effect. An additional room
  reverb effect. Dedicated low- and high-cut filters. Flutter and wow (delay
  modulation effects). Stereo widener. A fully resizable user interface.
specs: |-
  - Analog-style resonant filters (LP, BP, HP) in feedback loop
  - Built-in ducker
  - Transient softening
  - High-quality oversampled saturation
  - Chorus effect
  - Room reverb effect
  - Dedicated low- and high-cut filters
  - Flutter and wow delay modulation effects
  - Stereo widener
  - Fully resizable user interface
  - Nova soft transient engine
  - Three-knob interface
  - Expert mode with advanced settings
  - Universal 2 binary
