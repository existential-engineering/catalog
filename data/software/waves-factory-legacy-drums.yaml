description: "Featuring three drum kits: Tea Towel, Classic Rock and Brush. Sounds from genre-defining eras give you the sound of the 60s, 70s and all-time jazz standards at your fingertips."
details: |-
  Legacy Drums is the modern and updated version of three of the all-time best-selling libraries at Wavesfactory: Tea Towel Drums, Classic Rock Drums, and Brush Drums, re-released in a new and improved form.

  Legacy Drums retains the sound they're famous for and introduces new GUIs and premium features. It is a drum collection suited to a lot of different styles: expressive, dynamic, with true bleeding through microphones and ready to mix.

  The three kits are Tea Towel, a vintage Ludwig with tea towels placed on the heads; Classic Rock, a Ludwig Vistalite with an open, deep and powerful sound; and Brush, a Yamaha drum kit played with brushes and suited to jazz.

  From the mixer you can control the different mics separately with the usual parameters that you'd normally find on an audio mixer, with the particularity that the samples feature the full bleeding of each mic, resulting in a much more natural and real mixing experience.

  In the effects page you can add 23 DSP effects to each channel in any order you want, from an SSL style compressor and EQ to a Transient Shaper and a convolution engine with more than 30 custom impulse responses. From the settings panel you can control the way the library responds to the incoming MIDI messages: round robin repetitions, velocity curve and advanced mapping controls with custom presets based on the most-known drum engines in the market.
specs: |-
  - Three drum kits: Tea Towel (vintage Ludwig with tea towels on the heads), Classic Rock (Ludwig Vistalite), Brush (Yamaha played with brushes)
  - Size: 3.69 GB
  - 15,972 samples
  - 6 round robin
  - 6 velocity layers
  - Up to 10 mic positions
  - 77 presets
  - 3 instruments
  - Mixer with per-mic control and full bleeding between microphones
  - 23 DSP effects per channel in any order, including an SSL style compressor and EQ, a Transient Shaper and a convolution engine with more than 30 custom impulse responses
  - Settings panel with round robin repetitions, velocity curve and advanced mapping controls with presets based on well-known drum engines
  - Works with Kontakt 5.7.3 and newer versions
  - Full version of Kontakt required (Kontakt Player will run in demo mode)
