details: |-
  Mininn Drum is a versatile drum machine plugin that pays tribute to the legendary Linn Drum. Combining nostalgic sounds with modern functionality, this plugin offers three distinct sound ROMs, each carefully designed to provide an authentic and diverse sonic experience.

  Mininn Drum features three sound ROMs, each crafted to offer a different flavor of classic drum sounds: ROM 1 is a faithful recreation of the iconic LM-1 sound selection, ROM 2 captures the essence of the 9000 Version, and ROM 3 is a custom adaptation inspired by authentic '80s drum sounds. These ROMs offer a broad spectrum of sounds, making Mininn Drum suited to pop, electronic, or retro-inspired music.

  Mininn Drum goes beyond traditional drum machines by including a custom pad. This feature allows you to add your own samples, such as drums, bass, or any sound you desire, directly into your presets, giving complete control over your drum sound palette.

  Individual sound modification options give full control over each drum sound. Parameters like pitch, volume, and panoramic settings can be adjusted so each sound integrates into the track, and a multi-output mode makes 16 stereo channels or auxes available to assign, so each sound can be processed independently with the EQ, compression and reverb of your DAW.

  The Linn LM-1 Drum Computer, created by Roger Linn, was the first drum machine to feature digital samples of acoustic drums, and became a favorite among artists like Michael Jackson, Prince, Kraftwerk, Phil Collins, Genesis and Herbie Hancock. Mininn Drum adapts these iconic sounds for modern producers.
specs: |-
  - 3 ROMs: LM-1 recreation, 9000 Version, custom '80s sounds
  - 16 pads: 15 drums and percussion plus one custom sample pad
  - Right click on a pad to create your own MIDI assign
  - Global section adjusts main volume, tuning of all sounds, and velocity sensitivity
  - Tuning section modifies the tune of each sound
  - Mixer sets volume and panoramic position of each sound
  - Multi output: 16 stereo channels or auxes available to assign
  - macOS 10.13 to latest, Intel Core i5 or equivalent, Apple Silicon M1 to M4 compatible
  - Windows 7 to 11, Intel Core i5 or equivalent
  - Linux supported
  - 2 GB RAM
  - Requires an internet connection to install and update products
