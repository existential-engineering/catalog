description: Stereo PAN positioning plugin that controls PAN of the stereo source, not the BALANCE. Features the Haas Effect to reproduce more realistic pan positioning.
details:
  - DeePanpot is a stereo panning plug-in that controls the PAN of a stereo source rather than the BALANCE — a fundamental distinction that makes it uniquely suited to repositioning stereo material in the mix.
  - Unlike a standard balance control that simply attenuates one channel relative to the other, DeePanpot applies true panning to stereo sources by adding the Haas Effect, which introduces subtle inter-channel timing differences to reproduce the perception of a sound moving to a specific position in the stereo field.
  - The Haas Effect implementation provides a more realistic and natural-sounding pan compared to simple level-based approaches, preserving stereo width while repositioning the image — a key advantage when working with full stereo stems, loops, or bus groups.
  - DeePanpot is available as VST2, VST3, AU, and AAX formats for macOS and as VST2, VST3, and AAX for Windows. It has been tested across a wide range of professional DAWs including Ableton Live, Logic Pro X, Pro Tools, Cubase, Studio One, FL Studio, BITWIG STUDIO, and Reason.
  - The demo version inserts periodic silence as a limitation. A serial key purchased from the DOTEC-AUDIO store removes all demo restrictions. Registration requires an internet connection.
