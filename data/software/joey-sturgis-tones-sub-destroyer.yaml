details: |-
  Overview
  Sub Destroyer is the ultimate bass drop/subharmonic generator plugin designed to bring deeper, fuller subs to your sessions. Whether you’re a recording artist, music producer, film scorer, mixer, or engineer — there’s a ton of flexibility and power in its deceivingly simple virtual instrument interface.
  Trigger, program, automate, saturate, enhance — no matter how you use Sub Destroyer, it’s fully capable of generating explosive low end in any situation.
  Music Production
  At its core, Sub Destroyer is a powerful, low-end generating synthesizer. There are several music-focused applications for Sub Destroyer common among users, including:
  Deeper Bass
  Sub Destroyer can be programmed alongside your bass guitar parts to round out the low end and create a clear, consistent tonality for full performances or dense sections where reinforcement is required to cut through the mix. Use a MIDI track to trigger the notes played by your bass with a standard Sine waveform or try one of three other waveforms in combination with Sub Destroyer’s Drive and Harmonic Enhancement controls for a more complex, noteworthy tone.
  Bigger Kick Drums
  Bass isn’t the only instrument that will benefit from Sub Destroyer’s low-end focused design. Kick drums in particular can be beefed up with lots of body and punch by triggering Sub Destroyer. Find the target fundamental frequency where your kick could use a boost from the Trigger menu, then key Sub Destroyer off of your kick drum track.
  Earth-Shaking Bass Drops
  Perhaps most valuable for modern metalcore, rock, and EDM artists is the ability to use Sub Destroyer to create new and unique bass drops for their productions. A great transition effect used on countless records in these genres, bass drops are an essential element to many legendary productions and frankly, they don’t get the love or attention they deserve in the studio.
  With Sub Destroyer, you decide the speed of your bass drop, the frequency it starts at, the frequency it ends at, and the tonality/shape of the drop. These additional controls are integral to crafting bass drops that match the tempo, key, and tone of the song they’re getting added to.
  Get rid of your stock bass drop samples - Sub Destroyer puts the perfect drop at your fingertips in any session.
  Software Synth
  Sub Destroyer’s secret sauce comes from helping out in the low end — especially when it comes to pairing with other instruments. But when used as a standard software synthesizer, producers can program bass and lead parts with simple MIDI inputs.
  Sub Destroyer offers 4 distinct waveforms to choose from with a complete monitoring section, lowpass filter, portamento (glide) controls, and an output trim. It’s even got Polyphonic Mode which allows users to play multiple notes at the same time for more complex arrangements!
  SFX/Film Production
  Beyond music applications, Sub Destroyer has understandably become a favorite of sound effect, movie/television, and video game audio professionals!
  Ever since the successful introduction of bass drops in cinema, these audio teams have been looking for new and unique ways to design the sounds they’re using. For video games and action sequences, there’s not much that’s more impressive than a heavily overdriven bass drop to represent a high-impact moment audibly.
