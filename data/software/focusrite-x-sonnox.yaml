description: "Focusrite x Sonnox is a collaboration between Focusrite and
  Sonnox. The partnership's debut release is Sonnox Soften — a one-knob,
  three-mode plugin that smooths harshness and enhances clarity, ideal for
  polishing vocals, guitars, and full mixes."
details: |-
  Created by Sonnox for Focusrite, Soften's one-knob, three-mode design smooths harshness and enhances clarity. Use it on vocals to tame sharp 'esses' and top-end harshness while keeping the vocal clear and present; on guitar to smooth out brittle highs or nasal mids so tones sit naturally in the mix; or on the mix bus to clean up boxiness and fatigue-inducing frequencies.

  Launched in 2022, the Focusrite x Sonnox partnership unites two heritages — Focusrite's analogue recording lineage from the ISA modules through to the Red range, and Sonnox's digital mixing console legacy from the legendary OXF-R3 plus the Oxford EQ and Dynamics plugins. Soften is also included in the Hitmaker Expansion bundle.
