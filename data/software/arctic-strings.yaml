details: >-
  Arctic strings is a sustained strings instrument that's housed in our powerful
  sample-based-synth engine, floe.


  The whole string section was recorded playing long sustained notes both softly
  and loudly; we turned this into a single, uncomplicated virtual instrument
  with controllable dynamics.


  Smooth sustained strings. Designed for creating lush, ethereal backdrops and
  chords.


  This product is the dead-simple solution for adding warm, delicate,
  atmospheric, backdrops to your track; either by itself or alongside other
  string libraries.
