description: Raindrop & Blade is the deepest sampled ancient Chinese Yangqin in the world, designed to diversify your ethnic library.
details: |-
  Yangqin is a Chinese hammered dulcimer. It was traditionally fitted with bronze strings, which gave the instrument a soft timbre. A professional musician often carries several sets of beaters, each of which draws a slightly different tone from the instrument, much like the drumsticks of Western percussionists. Uniquely, only the Chinese hammer is made of bamboo.

  When samples were recorded, 3 different microphones were used with different positions to capture the spatial and reverb characteristics of Yangqin. Left-hand and right-hand playing were recorded separately to obtain the difference in tone, and three modes of Hand Exchange are provided to make the instrument play in a natural way.

  11 performances were recorded, such as tremolo, vibrato and run-up/down. Vibrato was recorded in two velocities and can be controlled by MIDI CC. In addition, octave- and third-vibrato were recorded for a more realistic performance. Real-recorded expressions are freely controllable, and with the control of MIDI CC the instrument can express tone changes like a real Yangqin performance.

  A self-developed sampling engine provides better sound quality, more powerful disk buffer streaming and sampling compression technology, and sound fusion technology. Convolution reverb samples were recorded at spectacular places and famous natural and historical heritages in China, so Raindrop & Blade can be simulated as played at the Great Wall or the Terracotta Army site.

  The effect rack from Heavier7Strings adds Compressor, EQ, Chorus and Ping-Pong delay. A complete pattern library captures works and ideas, with a rich preset of patterns that can be updated in the future and user patterns created by dragging MIDI clips inside. Presets range from Chinese traditional to experimental.
specs: |-
  - Samples: 6208
  - Samples parameter: 44100 Hz / 24 bit
  - Compression size: 2.9GB
  - 3 microphone positions, with left-hand and right-hand playing recorded separately and three Hand Exchange modes
  - 11 recorded performances, including tremolo, vibrato and run-up/down
  - Minimum system requirements: Intel or AMD CPU with SSE 4.1 instruction set, or Apple chip
  - Mac OS X 10.9 / Windows 7
  - 4GB RAM and 3GB disk space
  - Plugin formats provided: 64-bit VST2, VST3, AAX and Audio Unit
  - Extra requirements on specific hosts: Logic Pro X or Higher (Logic 9 is not supported)
