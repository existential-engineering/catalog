details: |-
  Adm is an 808, 909 and 606 emulator rolled into one also capable of triggering
  the user's own samples. Adm contains 25 drum generators, each one carefully
  modeled after the classics' analog circuits and 4 PCM players, for a total of
  34 sounds (some generators have two sounds).

  Certain sounds have been extended with extra parameters, like the tuning and
  attack of the 606 bassdrum. The accents effect on bridged-t oscillators that
  make up the bassdrum and tom-tom sounds has been closely simulated and the
  hihats and cymbals sound and react very close to the originals.

  The pcf (pattern controlled fx) can be used to automate any of the drum
  machines parameters, for instance it's possible to change the cutoff and q
  parameters for each step. In fact it can control any of the drum machines
  parameters, for example you can set the amount of snappy on each step or
  switch from maracas to handclap on specific steps, giving the illusion of more
  polyphony (something that had to be done by hand on the original machine).

  The pcf can also control the amount of mangle (a type of distortion) on
  specific steps, and if the fx should be applied to a sound or not.

  Features include three realtime switchable drum machine models, internal
  32-step sequencer with global accent per step, four prescale selections per
  pattern, flam and shuffle, 128 patterns per instance, pattern transformation
  functions, full MIDI cc with learning function, rebirth pattern import, 909
  sysex import, two MIDI modes (pattern and note), tempo sync to host, 11 parts
  polyphony, 11 individual unprocessed outputs (VST version only), 2 master
  outputs (processed), pattern library, and the ability to trigger custom .wav
  and .aif samples with 80+ example patterns included.
specs: |-
  - 808 emulation

  - 909 emulation

  - 606 emulation

  - 25 drum generators

  - 4 pcm players

  - 34 sounds total

  - 32-step sequencer

  - Global accent per step

  - Four prescale selections per pattern

  - Flam and shuffle

  - 128 patterns per instance

  - Pattern controlled fx (pcf)

  - Pattern transformation functions (expand, shrink, swap, duplicate steps,
  randomize pattern, randomize part, cut/copy/paste)

  - Undo function for pattern transformation

  - Full MIDI cc with learning function

  - Rebirth pattern import

  - 909 sysex import

  - Two MIDI modes (pattern and note)

  - Tempo sync to host

  - 11 parts polyphony

  - 11 individual unprocessed outputs (VST version only)

  - 2 master outputs (processed)

  - Pattern library

  - Custom .wav and .aif sample triggering

  - 80+ example patterns

