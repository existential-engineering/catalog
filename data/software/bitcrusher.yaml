details: |-
  Sc BitCrusher is a free, fully-featured BitCrusher plugin. Whether you want to
  make your track more retro, heavily distort signals, or just add a little
  fuzz, sc BitCrusher gets it done quickly and easily at no cost.

  Sc bitcrusher comes with an additional filter section allowing you to add
  filtered noise to your mix. Take noise from full-spectrum white to pink, to
  anything in between. The addition of an lfo on the filter lets you sweep the
  noise giving you a truly unique effect.

  All parameters (noise, rate reduction, bit depth, wet/dry mix) are fully
  automatable. This powerful feature unlocks the plugin's full potential by
  allowing you to create more complex and expressive sounds than what's possible
  through manual tweaking.

  You can get instant results from bitcrusher using the built-in presets. You
  can also create your own presets, either from scratch or by building off an
  existing preset. With our preset browser, you can download presets from other
  users or optionally share your own.

  The sc bitcrusher has a beautiful and colorful interface with an incorporated
  stereo field visualization.
specs: |-
  - Bit depth reduction
  - Rate reduction
  - Noise filtering
  - LFO on filter
  - Wet/dry mix
  - Automatable parameters
  - Stereo field visualization
  - Preset browser
  - Custom preset creation
