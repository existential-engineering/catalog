details: |-
  American hardcore volume 1 captures the breakneck speed of pioneering american hardcore punk bands like hsker du, dead kennedys, effigies, and circle jerks, who broke the metronome barrier (I.e. 208 bpm) back in the early 1980s.

  This package contains over 100 loops in 8 tempos, ranging from 200 bpm to a blistering 364 bpm.

  The download includes all of the loops in both 24/48 wave files and rex2 files.
