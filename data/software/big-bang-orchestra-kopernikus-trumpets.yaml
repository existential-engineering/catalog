details: |-
  As with all the brass libraries of our big bang orchestra, the sound of this
  trumpet ensemble delivers the characteristic timbre you're used to hearing in
  countless contemporary film scores. That's why we recorded bb trumpets with
  piston valves rather than instruments with rotary valves that are most common
  in austrian orchestras.

  This sought-after sound is created through a combination of highly skilled
  musicians with scores of scoring sessions under their belt, synchron stage
  vienna's large hall that emphasizes the characteristics of brass instruments,
  and expert miking by the facility's chief recording engineer, bernd mazagg.

  The library boasts a rich set of articulations, with up to five velocity
  layers, variations of short notes, marcatos, real legatos, several dynamic
  articulations (sfz, sffz, various crescendos and decrescendos), flutter
  tonguing, trills and fast repetitions.

  The synchron player offers mixer presets that integrate seamlessly with all
  the other modules of the big bang orchestra. What's more, the "processed"
  category offers mixer presets such as "compressed", "sparkling", "wall of
  trumpets", "outer space trumpets", "threatening sustain" and more that
  correspond with the brass presets of big bang orchestra: hercules, izar and
  jupiter.

  Trumpets: four bb trumpets, recorded at synchron stage vienna. Multiple
  microphone positions, additional close mic positions. Full-fledged set of
  articulations with up to five velocity layers. From dark pianissimos to the
  brightest fortissimos. Real legatos, glissandos, swells, flutter tonguing,
  trills, etc.
