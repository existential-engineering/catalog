description: "Big Bang Orchestra: Lyra high strings: three string ensembles,
  recorded at synchron stage Vienna. 14 first violins, 12 second violins, 8
  vi..."
details: |-
  The city of Vienna has always been famous for its exquisite string players and
  their fine instruments. On our own scoring stage, the string sections of the
  synchron stage orchestra form a marvelous symbiosis with the large hall "stage
  a" to create a shimmering, lush string sound that is now a cornerstone of the
  big bang orchestra. "lyra", the first big bang orchestra module dedicated
  entirely to string ensembles, offers beautiful recordings of three string
  sections.

  With 14 first violins and 12 second violins playing in unison, and 8 violas
  playing an octave below, their captivating performances are perfect for those
  soaring melodies and prominent themes. Recording all three sections playing
  together creates a homogenous, well-balanced sound, as the 34 musicians adjust
  their intonation, tone color, phrasing and vibrato instantly and instinctively
  with each other. It's this exceptional coherency that makes these string
  performances so special and guarantees a beautiful, balanced timbre.

  The library offers a large palette of articulations that includes variations
  of short notes, long notes with two vibrato intensities, legatos, espressivo,
  sfz, sffz, crescendos and diminuendos, tremolos, fast repetitions, half tone
  and whole tone trills, half tone and whole tone slides up and down
  (glissandos), and pizzicatos. As with all libraries powered by the synchron
  player, the tempo of all articulations, e.g., repetitions and glissandos, can
  be easily adjusted using the integrated time stretch feature.

  Room mixes feature an excellent blend of overhead decca tree mics and surround
  mics mixed to a stereo signal that's light on cpu and ram. Other mixer presets
  offer a combination of mic signals that you can adjust to your needs and
  liking, masterfully crafted by synchron stage vienna's chief recording
  engineer, bernd mazagg. These include "stereo decca tree" and "surround to
  stereo" that feed the surround mics to the stereo signal for a richer and
  wider sound. Also included are "surround" presets for 3d audio setups, as well
  as a "processed" category with presets such as "compressed", "sparkling",
  "wall of high strings" and many more.

  Big bang orchestra: lyra by vienna symphonic library (vsl) is a virtual
  instrument audio plugin for macos and windows. It includes, and is therefore
  "powered by", synchron player, which functions as a VST plugin, an audio units
  plugin, a VST 3 plugin and an AAX plugin.
