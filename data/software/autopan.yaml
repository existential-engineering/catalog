description: "Features: pan mono or stereo signals automatically using a 6
  waveform lfo. Volume, lfo frequency and pulse-width can be adjusted, as well
  as pan-width."
details: |-
  Features: pan mono or stereo signals automatically using a 6 waveform lfo.
  Volume, lfo frequency and pulse-width can be adjusted, as well as pan-width.

  Signals can be panned in two modes: normal mode: both input channels are
  panned simultaneously from l to r. Rotate mode: one input channel is panned
  from l to r while the other channel is panned from r to l and vice versa.
specs: |-
  - LFO controlled panner
  - 6 waveform LFO
  - Volume adjustment
  - LFO frequency adjustment
  - Pulse-width adjustment
  - Pan-width adjustment
  - Normal panning mode
  - Rotate panning mode
  - Windows compatible
