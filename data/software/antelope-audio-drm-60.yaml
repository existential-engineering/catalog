details: |-
  The DRM-60 brings the smooth, musical response of vintage tube compression and preamp circuitry straight into your DAW. Modeled after a classic hardware unit and enhanced with intuitive modern controls, this plugin combines soft-knee compression, vintage-style EQ, and tube preamp coloration into one versatile processor. Whether you're smoothing vocals, adding punch to drums, or saturating instruments with rich analog tone, the DRM-60 is a mix-ready powerhouse.

  A warm, soft-knee compression engine inspired by vintage analog gear. Tame peaks, glue transients, and control dynamics with smooth, musical character.

  Dial in dynamic control with a wide threshold range, three switchable attack speeds (Fast, Medium, Slow), and six release settings—including program-dependent behavior that adapts to your material. High-pass filter options (50Hz / 100Hz) prevent low-frequency energy from triggering the compressor unnecessarily, and restore gain post-compression with up to +20 dB of clean makeup gain.

  Activate the AUX section to apply gentle tube-style saturation and broad tonal shaping. Add weight and sparkle with intuitive bass and treble shelving controls, or bypass for pure compression.

  Use DRM-60 on vocals, guitars, drums, or full mix buses. Shape body and warmth on acoustic tracks, or push the preamp for gritty, harmonically rich saturation. DRM-60 is part of the Antelope Cosmos plugin collection.
specs: |-
  - Tube compressor and preamp plugin
  - Soft-knee compression engine inspired by vintage analog gear
  - Wide threshold range
  - Three switchable attack speeds: Fast, Medium, Slow
  - Six release settings, including program-dependent behavior
  - High-pass filter options: 50Hz / 100Hz
  - Up to +20 dB of clean makeup gain
  - Built-in tube-style preamp saturation (AUX section)
  - 2-band EQ with bass and treble shelving controls
  - Runs natively in your DAW on macOS or Windows
