description: One ultra-simple plugin that delivers the punch, energy, and edge your guitars need to stand out.
details: |-
  From the delicate shimmer of a folk acoustic to the crushing weight of a high-gain wall, getting guitars to sit perfectly in the mix should not be a struggle. Whether you are chasing clarity, grit, or pure power, Telos Guitars provides the final polish that turns raw tracks into finished records.

  Quickly clean up unwanted sub-rumble or fizzy top-end with precision high and low cut filters. Add punch or fullness to the low end with a single knob, switching between shelf and peak modes.

  Bring your guitars to life with added air and definition, choosing between top sparkle or presence bite for the perfect top-end focus, while taming harsh upper mids in seconds without killing your guitar tone.

  One knob, instant control: dial in modern guitar compression without worrying about attack, release, or ratios, all optimized under the hood. A built-in limiter keeps levels consistent and controlled in the mix.
specs: |-
  - High and low cut filters to remove unwanted sub-rumble or fizzy top-end
  - Low-end punch/fullness control with shelf and peak modes and frequency slider
  - Midrange presence/space control with frequency slider
  - Top-end air and definition with sparkle or presence bite options
  - Upper mid harshness taming control
  - Palm mute low-end buildup control
  - One-knob simplified compression
  - Saturation/warmth control for analog mojo or bold saturation
  - Built-in limiter for level consistency
  - Mac OS X 10.15 or higher
  - Windows 10 or higher
  - 64-bit only
  - 200 MB free drive space
