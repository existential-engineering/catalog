description: "The only piano instrument you'll ever need - combines
  concert-grade pianos with cinematic effects, robot-assisted sampling
  technology, 33 generative sound Spaces, and 12 creative cinematic effects."
details: |-
  Pianoverse is IK Multimedia's flagship virtual piano instrument, designed to be the definitive piano solution for music producers, composers, and performers. It features nine meticulously sampled concert-grade pianos captured using robot-assisted sampling technology, ensuring unparalleled accuracy and consistency across every key and velocity layer.

  The instrument includes pianos from legendary manufacturers: the Concert Grand YF3 and Royal Upright Y5 (Yamaha), the Black Diamond B280 and Black Pearl B200 (Bosendorfer), the NY Grand S274 and Hamburg Grand S274 (Steinway & Sons), the Gran Concerto 278 (Fazioli), the Liberty Upright, and the Grand Piano Y7. Each piano offers multiple microphone positions for detailed tonal shaping.

  Beyond traditional piano sampling, Pianoverse features 33 generative sound Spaces that place each piano in unique acoustic environments, from concert halls to cinematic soundscapes. The 12 creative cinematic effects allow producers to transform piano sounds into evolving textures and atmospheric pads, making it equally suited for intimate recordings and large-scale film scoring.

  The engine supports continuous pedal control for realistic half-pedaling and catch-pedaling techniques, along with studio-grade EQ, compression, limiting, and stereo width controls. The resizable interface and MIDI learn functionality ensure seamless integration into any production workflow.
specs: |-
  - 9 concert-grade pianos with robot-assisted sampling
  - Multiple microphone positions per piano
  - 33 generative sound Spaces
  - 12 creative cinematic effects
  - Continuous pedal control (half-pedaling, catch-pedaling)
  - Studio-grade EQ, compression, limiting, stereo width
  - Resizable interface with MIDI learn
  - macOS 10.15+ / Windows 10+
  - AU, VST2, VST3, AAX, Standalone
