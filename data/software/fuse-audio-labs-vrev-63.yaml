description: A meticulous emulation of the Fender Reverb Unit, the legendary 1960s valve-driven spring reverb widely known as the godfather of surf guitar sound. Models the original's Dwell, Mixer, and Tone controls — including the signature 'tone suck' high-frequency effect from Mixer/Tone interaction. Three spring tank models, hardware modification options (C10 capacitor mod, NOS valve types), and an integrated Kick Unit to physically kick the virtual reverb tank.
details: |-
  Emulates the Fender Reverb Unit (1960s). Hybrid approach: convolution for onset transient 'drip', algorithm for reverb tail. Three spring tank models: 3-Spring, Short, Stock. Authentic 'tone suck' high-frequency behavior from Dwell/Mixer/Tone interaction. C10 capacitor modification for deeper, richer reverb. Switchable NOS 6K6/6V6 valve types. Integrated Kick Unit simulates physically kicking the hardware tank. Regular $59 (launched at $29 intro through March 9, 2024).
specs: |-
  Controls: Dwell (input drive/reverb intensity), Mixer (wet level), Tone, Tank model (3-Spring/Short/Stock), Valve type (6K6/6V6), C10 mod switch, Kick Unit, Mix. macOS 10.12+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+, 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX. Copy protection: serial number.
