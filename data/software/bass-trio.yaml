details: |-
  Bass Trio features 3 extraordinary bass instruments from lakland, silvertone
  and hofner. The 3 bass became a unique bundle which gave the musician the
  freedom to choose the bass sound they want. Musicians will have a wide range
  of choices of different bass sounds. And can cover metal, rock, pop or other
  music genres with ease.

  Bass trio is deeply sampled over 18gb uncompressed contents over 20,000
  samples with multi velocity layers and round robin samples. Bass trio also has
  modeled vibrato, slide, bend and legato, this gives its sound more freedom and
  can vividly express the emotion. Also we sampled different techniques on each
  bass to ensure musicians have the best choices when playing bass trio.

  Collaborate with hotone; now we can offer the full version of vstomp effect
  system on bass trio. Vstomp is based on hotone's proprietary cdcm system,
  vstomp delivers organic, studio-grade sound quality and the exact character of
  legendary amplifiers.

  Vstomp employs a complex system based on dynamic feature modeling. In this
  matrix, every single circuit component is alive and performs like its
  original. Vstomp has over 26 amps and 20 cabs waiting for you to use. The
  famous brands in vstomp including marshell, fender, ampeg, carvin, mesa,
  peavey, roland, orange and many more.

  Also it has multi effect/fx which could enables users to fudge a whole fx
  chain to get the unique sound.
