description: 'One Kit Wonder: Brutal is a Kontakt drum sample library featuring
  a chaotic, ultra-heavy sound optimized for extreme genres. The kit includes a
  22x20" maple kick, brass snare, single-headed toms, and damaged cymbals, all
  captured as a mix-ready instrument with built-in groove player, master EQ,
  parallel compression, and reverb. Designed for minimal setup in songwriting
  and production workflows, it also includes full NKS integration.'
details: |-
  One Kit Wonder: Brutal brings a chaotic, ultra-heavy sound to the lineup. With a ferocious snare, pummeling kick, tribal single-headed toms and aggressive cymbals, it thrives on the extremes, whether that's straight-up death metal, post-apocalyptic industrial, blackened thrash or reverb-swamped doom, you'll get what you need.

  The One Kit Wonder series was inspired by the many GGD users who use our libraries for songwriting. We know how crucial it is that there is as little time wasted between the moment inspiration strikes and you being able to capture it, and how important it is that you can hear your ideas sounding polished and professional so you stay excited as you develop them.

  It's our hope that this sample library will remove frustrating barriers in your creative process so that you can enjoy making music to the fullest.

  This instrument uses the latest version of Kontakt Player from Native Instruments. Installation and activation is managed via Native Access.
specs: |-
  - Requires Kontakt Player 7 or Kontakt 7 (latest)
  - Mac: 64-bit only, OS X 12 or later, Intel i5+
  - Windows: 64-bit, Windows 10, Intel Core 2 Duo or AMD Athlon 64 X2
  - RAM: 4 GB minimum (6 GB recommended)
  - Disk: 1 GB Kontakt + 3.5 GB instrument
  - OpenGL 2.1+ graphics support
  - Mac: Standalone, VST3, AU, AAX
  - Windows: Standalone, VST3, AAX
