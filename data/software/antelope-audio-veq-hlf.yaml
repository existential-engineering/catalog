description: "This simple and effective filter features two knobs: one each for
  passive low-cut and high-cut filters at carefully selected frequency
  intervals. With 10 frequency selections available per band, it is the perfect
  tool for creating space in your mix by eliminating unneeded frequencies at the
  extremes of the audio spectrum — while ensuring a musical analog tone. Even if
  you don't intend to use the cutoff filters, try inserting the VEQ-HLF in your
  processing chain to obtain its peculiar and highly sought-after sound
  coloration."
details: |-
  This simple and effective filter features two knobs: one each for passive low-cut and high-cut filters at carefully selected frequency intervals. With 10 frequency selections available per band, it is the perfect tool for creating space in your mix by eliminating unneeded frequencies at the extremes of the audio spectrum — while ensuring a musical analog tone.

  Even if you don't intend to use the cutoff filters, try inserting the VEQ-HLF in your processing chain to obtain its peculiar and highly sought-after sound coloration.
