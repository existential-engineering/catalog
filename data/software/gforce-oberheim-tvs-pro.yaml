description: A duophonic synthesizer plugin developed in collaboration with Oberheim, recreating the 1975 original TVS instrument which combined two SEM synthesizers with a keyboard to enable simultaneous two-voice synthesis. The plugin modernizes this classic with contemporary features including a dual 16-step sequencer, built-in effects, and over 635 patches while preserving the original's sonic character.
details: |-
  The Oberheim TVS Pro is a faithful recreation of the 1975 Oberheim TVS (Two Voice Synthesizer), developed in collaboration with Oberheim (a Sequential trademark). The original TVS combined two SEM (Synthesizer Expander Module) synthesizers with a keyboard to produce a duophonic instrument capable of playing two independent notes simultaneously.

  Each of the two modeled SEM synthesizers features dual VCOs, a multi-mode filter, ADS envelopes, and an LFO, precisely replicating the architecture of the original hardware. GForce has also added a third VCO per voice that can function as an additional LFO, expanding the modulation capabilities beyond the original instrument.

  The TVS Pro includes a dual 16-step sequencer, allowing users to create evolving melodic and rhythmic patterns with each voice independently. The plugin ships with over 635 patches — 220 new patches and more than 400 converted from GForce's SEM plugin.

  Built-in effects include a phaser, stereo delay, and reverb. The plugin also supports velocity and aftertouch for expressive performance.
specs: |-
  - Voices: Duophonic (2 independent voices)
  - VCOs per voice: 2 (plus 1 additional VCO/LFO)
  - Filter: Multi-mode filter per SEM voice
  - Envelopes: ADS per SEM voice
  - Sequencer: Dual 16-step sequencer
  - Patches: 635+ total (220 new, 400+ from SEM plugin)
  - Effects: Phaser, stereo delay, reverb
  - Expression: Velocity and aftertouch
  - mac: Intel & Apple Silicon native, macOS 10.13+
  - windows: Windows 7+, 2GHz CPU, 2GB RAM
