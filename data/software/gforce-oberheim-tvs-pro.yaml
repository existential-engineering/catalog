description: A duophonic synthesizer plugin developed in collaboration with
  Oberheim, recreating the 1975 original TVS instrument which combined two SEM
  synthesizers with a keyboard to enable simultaneous two-voice synthesis. The
  plugin modernizes this classic with contemporary features including a dual
  16-step sequencer, built-in effects, and over 635 patches while preserving the
  original's sonic character.
details: |-
  In 1975, Tom Oberheim revolutionised synthesiser design with the original TVS. By combining two SEMs and a keyboard, he introduced true duophony to the world, enabling musicians to play two independent voices simultaneously and explore harmonically rich, evolving soundscapes. It was a bold step forward, embraced by visionaries including Martin Gore, Adrian Utley, Peter Baumann, Lorn, The Prodigy, and Nils Frahm. Decades later, the TVS Pro modernised that vision, adding a built-in sequencer, extended modulation, and refined controls, all while staying true to its unmistakable sonic DNA.

  At the heart of the TVS Pro are two fully modelled SEMs, each offering two VCOs with pulse and sawtooth waveforms, the legendary Multi-Mode Filter, two ADS envelope generators and one LFO. Every component has been carefully emulated to preserve the character and nuance of the original instrument, right down to the subtle analogue inconsistencies that gave it life. GForce have also added a 3rd VCO per SEM, which can be an LFO too, plus velocity and aftertouch which weren't on the hardware.

  Over 400 converted patches from the GForce SEM are included alongside 220+ brand-new sounds, giving immediate access to a world of characterful tones through a categorised patch librarian.

  At the heart of the TVS Pro is its intuitive dual 16-step sequencer, designed not just for precision, but for play. With rapid workflow, fluid modulation, and hands-on control, TVS Pro becomes a true sequencing playground. With the addition of phaser, analogue-style stereo delay and lush reverb, you have everything you need to bring depth and polish to your performances, straight out of the box.

  Our partnership with Oberheim began with the award-winning OB-E v2, and it continues to shape how we approach vintage re-creations. Working with Oberheim on the TVS Pro plugin, and sharing a passion for authenticity, has helped us create something that feels true to the original.
specs: |-
  - Voices: Duophonic (2 independent voices)
  - VCOs per voice: 2 (plus 1 additional VCO/LFO)
  - Filter: Multi-mode filter per SEM voice
  - Envelopes: ADS per SEM voice
  - Sequencer: Dual 16-step sequencer
  - Patches: 635+ total (220 new, 400+ from SEM plugin)
  - Effects: Phaser, stereo delay, reverb
  - Expression: Velocity and aftertouch
  - mac: Intel & Apple Silicon native, macOS 10.13+
  - windows: Windows 7+, 2GHz CPU, 2GB RAM
