details: |-
  Fast, flowing, and fun flute and piccolo performances, with dazzling legato patches, captured within the cinematic acoustics of Abbey Road Studio One. This stand-alone, self-contained library will bring that distinctive Abbey Road magic to your compositions. It also makes the perfect accompaniment to Abbey Road One: Orchestral Foundations.

  The classic pairing of flutes and piccolo, doubling an octave higher, performed by London's first-call session players, is presented here as pre-orchestrated patches giving you instant access to an immediately recognisable sound as heard in scores by John Williams, John Powell and countless others. The library offers essential articulations, including stunning legatos, longs, staccatos, and marcatos, as well as major and minor mordents. There's everything you need to create beautiful, flowing lines and incredibly agile, scurrying flurries of sound.

  Wondrous Flutes is available to purchase as a stand-alone library or as a brilliant addition to Abbey Road One: Orchestral Foundations . You can also purchase this as part of Abbey Road One: The Collection and save 30%.
specs: |-
  - Two flutes with one piccolo sounding an octave higher
  - 8 articulations: Wondrous Legato, Long, Staccato, Marcato, Mordent Min 2nd, Mordent Maj 2nd, Mordent Min 3rd, Mordent Maj 3rd
  - 2 mixes
  - 10 mic signals: Vintage 1, Vintage 2, Pop Close, Pop Room, Close, Tree 1, Tree 2, Ambient, Outriggers, Spill
  - 6.2 GB download size
  - 6.25 GB disk space required during install
  - macOS 11 to OS 26, Intel and Apple Silicon supported
  - Windows 10 or 11 (64-bit)
  - Minimum 8GB RAM, 16GB recommended
  - Single user license, installation on up to two computers
  - Spitfire Audio App required for installation
