details: >-
  5orcery is a "meta-multi-band" compressor using dynamic eq. 5orcery takes a
  different approach to multi-band compression: the signal is still split into
  separate bands using cross-over filters, and these still feed the side-chains
  of separate compressors, but the filtered signals are not mixed back together
  again. Instead the gain modulation signals from all five compressors are
  matrixed into modulation signals for 4 dynamic shelving filters plus a gain
  stage.


  While this plug-in behaves like a multi-band compressor, and allows you to
  solve many of the same problems, it is in actual fact a constantly changing
  4-band equaliser, and when it isn't doing anything, it really isn't doing
  anything. Platinumears has dubbed this approach "meta-multiband compression":
  all the benefits of a multi-band with none of the usual side effects.


  Use it wherever you like, on channels, sub-groups or mixes.


  Features: transparent and easy to use multi-band compression. Dynamic eq
  topology to reduce phase artifacts. Five fl4tt3ry 2 compressors, with
  band-limited side-chains. External side-chain inputs (switchable per band).
  Intuitive "solo in place" function for each band. Optional soft clipping keeps
  your peaks below 0dbfs. Flexible gain / gain reduction meters with switchable
  range. Zero latency.
