description: Waldorf blofeld Audio Unit, VST, VST3, AAX librarian editor
  plug-in, for one waldorf blofeld series. Faster control and organization of
  your waldorf blofeld synthesizer.
details: |-
  Waldorf blofeld Audio Unit, VST, VST3, AAX librarian editor plug-in, for one
  waldorf blofeld series. Faster control and automation access than ever,
  blofeld editor takes your waldorf blofeld into a whole new level in the game.
  Control the same way you use your vsti and Audio Unit plug-ins. Connect your
  hardware seamlessly into your DAW.

  Blofeld editor will recall your patch settings when you open your project and
  the data will be sent to your waldorf blofeld-series automatically once you
  open your project. The only thing you need to worry, is that you power-up your
  synth. We also added the ability to load in waldorf q and microq patches and
  import waldorf pulse & pulse 2 presets.

  It is now much faster to scroll thru patches & make edits within your DAW. The
  best part is, when you reopen your project, you don't have to worry about the
  patch data you had on your synth while producing: our plugin stores all the
  data within the project and when you reopen the project, all of the used data
  gets sent to your hardware, automatically. No more external applications for
  saving, loading or transferring patch data. Welcome total recall.

  Edit almost every parameter of your synthesizer from our plug-in. Plug-in user
  interface reacts to hardware knob & buttons movements. Automate almost every
  parameter within your DAW. Edit each layer from the plug-in individually. You
  can request presets within the plug-in. You can send the parameters from the
  plug-in to your synthesizers temp buffer and save them from there or you can
  directly write user memory from our plug-in.

  You can connect as many blofelds to your computer as you like. Software stores
  last used patch data with plug-in to it's memory. Software loads last used
  patch data with project load and sends it to hardware. Organize patch data in
  librarian and save a new patch bank to hard drive.
specs: |-
  - MIDI device mapping
  - Patch recall
  - Parameter automation
  - Layer editing
  - Preset management
  - Sysex patch loading
  - Patch bank organization
  - MIDI channel selection per slot
  - Hardware knob and button synchronization
  - Patch name editing
  - Multi-instrument support (up to 16 MIDI channels)
  - Waldorf q patch compatibility
  - Microq patch compatibility
  - Waldorf pulse preset import
  - Waldorf pulse 2 preset import
