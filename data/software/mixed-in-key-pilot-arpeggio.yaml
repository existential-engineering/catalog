details: |-
  Pilot Arpeggio is one of the Mixed In Key Pilot Plugins, a MIDI generator built to make amazing arpeggios for any music style. Create amazing arpeggios using the styles inside Pilot Arpeggio.

  The plugin is built around styles. Styles help you generate arpeggio MIDIs for specific music genres. Each style can create countless variations of musical ideas, and custom knobs allow you to tailor them to your own liking. Seven styles are supplied: Up, Down, Texture, Random Walk, Kaleidoscope, Staircase and Cycles.

  Generated results appear on a customizable MIDI canvas. Each time you rotate a knob, you'll see different MIDI notes generated in the center preview section. If you want to see the results up close, click on the edit icon to expand for a more detailed view, which is fully MIDI editable so notes can be added, deleted and moved with a mouse or trackpad.

  Pilot Arpeggio comes pre-loaded with custom synthesizers, 250+ cutting-edge sounds for every genre. Named examples include Neptune 106Bass, Ultra Arp Pluck, Big Room Lead, Vintage Analog and Alternation Bell. The sound engine is the award-winning Phase Plant synth by Kilohearts, with 250+ bundled sounds.

  The macOS installer includes VST and AU versions and the Windows installer includes VST versions, covering Pilot Chords, Pilot Melody, Pilot Bass and Pilot Arpeggio, with Pilot available for Windows and macOS. Pilot Volume 2 added 2 new styles for Pilot Arpeggio alongside 25 new Phase Plant sound presets.
specs: |-
  - 7 arpeggio styles: Up, Down, Texture, Random Walk, Kaleidoscope, Staircase, Cycles
  - Styles generate arpeggio MIDI for specific music genres, with countless variations per style
  - Custom knobs to tailor generated patterns
  - Customizable MIDI canvas with a center preview section that updates as knobs are rotated
  - Expandable detailed view, fully MIDI editable: add, delete and move notes with mouse or trackpad
  - Pre-loaded with custom synthesizers, 250+ cutting-edge sounds for every genre
  - Sounds powered by the Phase Plant synth by Kilohearts
  - Included sound examples: Neptune 106Bass, Ultra Arp Pluck, Big Room Lead, Vintage Analog, Alternation Bell
  - Pilot Volume 2 added 2 new Pilot Arpeggio styles and 25 new Phase Plant sound presets
  - macOS installer includes VST and AU plugin versions
  - Windows installer includes VST plugin versions
