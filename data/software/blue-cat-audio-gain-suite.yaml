details: |-
  Blue cat's Gain Suite plug-ins are simple yet powerful MIDI controllable gain
  utilities which let you adjust the volume of the audio signal from the
  skinnable user interface or any MIDI controller.

  Features include mono, stereo and mid/side gain plug-ins with real time MIDI
  control with advanced settings (MIDI channel and cc numbers, with complete
  response curve control) and MIDI learn.

  The plugin includes a skinnable user interface with smooth update: silent
  (zipper-free) parameters update.

  Full automation support is provided with all parameters able to be automated,
  with smooth and continuous update.
