details: |-
  Philicorda is a faithful plugin emulation of the legendary 1960s Philips Philicorda organ. It replicates the transistor-based sound of the later GM751 models, delivering the distinctively warm yet clear tones that made the Philicorda a classic. Like the original hardware it features a vibrato circuit, a spring reverb, and two speakers, with added overdrive, envelope generator, leakage, bias, and key click.

  The Philicorda organ, introduced in the 1960s, was the first musical instrument produced by Philips. The emulated model, the GM751, had several revisions: early versions had tube preamps and later ones were all-transistor, and the emulation is based on an all-transistor model.

  The Philicorda uses a Top Octave Synthesizer circuit, with 12 oscillators for the upper octave notes and octave divider circuits generating the lower octaves. The same notes on different octaves stay in sync and avoid the phasing issues of sample-based instruments. Each oscillator generates a saw-like waveform by layering multiple overdriven sine waves at different octaves and volumes, and the bias control sets the mix between these layers.

  The spring reverb (called Reverbeo on some models) and the speakers are meticulously sampled, while the core tone generation is fully algorithmic. Oscillator pitch and master tune are adjustable, along with drift, which introduces random changes in the oscillators' pitch, and tunings can be applied globally or saved per preset.

  Philicorda features three effects: a Tape Echo based on AudioThing's Space Echo emulation Outer Space, a Phaser, and a BBD based Flanger, all rearrangeable by drag and drop. It is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP, Standalone), and on the App Store for iOS and iPadOS (AUv3 and Standalone).
