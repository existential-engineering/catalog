description: AutoEQ is a dynamic automatic tonal equalizer for live or post-processing use.
details: |-
  Designed for post-processing audio in daws and sound/video-editors on windows,
  but can also be used in a live VST-host (for example with live-performance
  audio, or with music/tv home-stereo audio). It can be useful with single songs
  or longer programs of mixed material, such as podcasts, recording of
  live-concerts, radio-shows, or television-programs, to generalize the
  audio-tone or minimize tonal fluctuations.

  It is best suited for broadband-sounds, such as bus-signals or mixdowns, and
  less suited for narrow-spectrum sounds, such as individual instruments that
  only cover a part of the sound-spectrum (bass-guitars, for example).

  Technical key points: fully automatic (unlike version 2, which required manual
  setup). Zero latency (for live use or for tracking). New extra tonal-mode in
  v3 ('electronic', for techno-music styles). 'bass trap' mode (less 'sub-bass
  rumble' on some microphone-recordings). Dry/wet mix user-control (so you can
  blend the dry tone with the adjusted tone to taste).

  Autoeq version 3 is a free update if you have a previous version of autoeq or
  if you have otto.
specs: |-
  - Fully automatic
  - Zero latency
  - Dynamic automatic tonal equalizer
  - 2 main tones (normal and electronic)
  - Bass trap mode
  - Dry/wet mix user-control
  - Windows 7, 8, 10 compatible
  - No drm
  - Zip with .dll (no .exe installation)
