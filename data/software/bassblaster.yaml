name: BassBlaster
manufacturer: eplex7-dsp
primaryCategory: effect
url: https://eplex7.com/bassblaster-futuristic-bass-plug-in-effect-vst/
description: Eplex7 DSP BassBlaster is a futuristic VST effect/special generator.
details: |-
  Eplex7 DSP BassBlaster is a futuristic VST effect/special generator where
  every incoming audio becomes modulator for re-synthesized futuristic bass
  engine inside this plug-in. For example if you insert this effect on drum
  beat, effect's engine inside will generate morphoderic alien style bass
  inside.

  You have 2 bass generators inside, you can choose various bass generator
  waveforms, you can modulate basslines inside with incoming audio with attack /
  release controls, you have two parallel filters available, distortion and
  dry/wet knob. The bassline is mechanic, dark, full, complex and futuristic.

  Additional function is pitch distortion of bass generator 1 and 2. Pitch
  distortion modulates pitch/frequency of bass generator based on input signal,
  similar to modulating a rubber string with your fingers.

  Put it on any drum track. Recreate your neurofunk basslines with it, use it as
  effect on basic reese bassline to convert it into complex electromechanoid
  madness. Use it to manipulate sound of any fx sounds coming from synthesizer
  or sampler, simply insert it on mixer track of fx instrument.

  Great for modern drum and bass/neurofunk, dubstep, dark psy, film/videogame
  music or any industrial/experimental progressive music.
specs: |-

  - 2 bass generators

  - Bass generator waveforms (morphing, engine jet, robotic vocoder, heavy dog,
  digital monstah armageddon, monster, transmission, mars, digital core)

  - Pitch distortion

  - Frequency modulation

  - Attack/release controls

  - Two parallel filters (low pass, high pass, band pass, band reject, peaking)

  - Distortion effect

  - Dry/wet knob

  - Output volume knob

  - Cross selector knob (bass1/bass2)

  - Internal modulator engine

  - Preset manager
