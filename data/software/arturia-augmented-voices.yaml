description: Augmented VOICES uniquely fuses detailed vocal samples with modern synthesis
  engines for an intuitive software instrument that equips producers with a
  comprehensive palette of pristine, intimate, and commanding voice sounds for
  modern production.
details: |-
  Augmented voices hybrid engine elevates the human voice to new heights. This
  is no ordinary library of static samples or simulated vowel tones - these
  voices are altered, enhanced, and augmented into sounds that'll reignite your
  musicality.

  Create whatever kind of choral or vocal sound you seek with augmented voices'
  multi-engine architecture. You've got 2 layers to play with, each containing 2
  sound sources, allowing you to build a fully personalized combo of sampled and
  synthesized voices.

  From epic choir soundscapes to processed vocalizations, augmented voices
  combines over 50 voice articulations with 4 synth engines and built-in fx for
  a huge range of modern and abstract vocal sounds for any style.

  Seamlessly move between augmented voices' sound layers and alter multiple
  sonic elements in unison with the innovative morph control. Create dramatic
  and ever-evolving sounds from human to synthetic, light to dark, subtle to
  explosive.
specs: |-
  - 2 layers with 2 customizable sound sources per layer
  - Over 50 voice articulations
  - 4 synth engines
  - Virtual analog with TAE technology
  - Granular engine
  - Harmonic engine with additive synthesis
  - Wavetable engine
  - Morph control
  - 7 additional macros (time, color, motion, FX a, FX b, reverb, delay)
  - 2 LFOs
  - 2 function generators
  - 2 random generators
  - 4 keyboard modulation sources
  - Vibrato & tremolo
  - 2 FX slots per layer with 14 FX
  - Parameq
  - Bitcrusher
  - Bl-20 flanger
  - Dedicated delay and reverb sends with 5 spatial/time-based algorithms
  - 16-step arpeggiator
  - Over 250 factory presets
  - MPE compatibility
  - Mts-esp oddsound microtuning compatibility
