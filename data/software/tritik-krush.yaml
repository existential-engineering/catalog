description: "A free bitcrusher plugin combining bit crushing and downsampling
  with a drive stage and analog-modeled resonant filters. Offers the crispy
  taste of the digital realm with warmth through modulation capabilities."
details: |-
  Bit depth reduction. Sample rate reduction. Crunchy drive stage. Analog-modeled low-pass and high-pass filters. Modulation section (free or tempo-synced). 4 modulation waveforms. Fully resizable interface. File-based preset system. Multi-language support (English, French, Portuguese, Spanish).
specs: |-
  Version 1.3.0. macOS 10.9 or later. Windows 10 or later.
