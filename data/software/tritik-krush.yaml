description: Krush is a free bitcrusher plugin combining bit crushing and downsampling with a drive stage, analog-modeled resonant filters and a modulation section. Tritik still offers it as a free legacy download but no longer maintains it, and Krush2 is its successor.
details: |-
  Bit depth reduction. Sample rate reduction. Crunchy drive stage. Analog-modeled low-pass and high-pass filters. Modulation section (free or tempo-synced). 4 modulation waveforms. Fully resizable interface. File-based preset system. Multi-language support (English, French, Portuguese, Spanish).
specs: |-
  - Final version 1.3.0 (free legacy download)
  - macOS 10.9 or later
  - Windows 10 or later
