description: Plate reverb plug-in drawing on Lexicon's classic 224 and 480XL
  plate algorithms, delivering the bright, clean tone plate reverbs are renowned
  for.
details: |-
  Drawing upon over thirty-five years of being the audio industries pre-eminent maker of hardware digital reverb and multi-effects units, the Lexicon Native Plate Reverb is in a class of its own. As part of classic pieces like the Lexicon 224 and 480XL, our plate reverbs have been used to define the sound of thousands of albums and now you can apply these world class algorithms to your mixes through this powerful plug-in.

  Plate reverbs are renowned for their bright, clean tone. Because they have no pre-delay, they are ideal for percussive instruments. This lack of pre-delay also creates the effect of distance, which makes plate reverbs a valuable effect for backing vocals or any other instrument that needs to be present, but not at the forefront of the mix.

  Providing a gentle 'mellowing and thickening' of the initial sound, plate reverbs are a vital part of any mixing arsenal. The plug-in is also available as part of the PCM Native Reverb Bundle.

  Authorization is handled via iLok2.
specs: |-
  - 35 studio-quality presets
  - Parameter automation support
  - Intuitive user interface
  - Real-time spectral display with input/output metering
  - Portable presets
  - iLok2 authorized
