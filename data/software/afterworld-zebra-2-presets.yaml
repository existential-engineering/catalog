details: >-
  New loops presents afterworld a new inter-dimensional zebra 2 soundset with
  one hundred inspiring zebra presets. You'll find a wide selection of
  cinematic, ambient, downtempo, and electronic presets with an otherworldly
  sound. All meticulously crafted to be expressive and playable.


  There's a good range of presets across 6 categories including, 22 modern
  electronic sequences, 20 huge ambient pads and soundscapes, 18 beautiful synth
  keys packed with emotion, 15 sub, pluck, and sequenced basses, 15 cinematic
  synth leads, and 10 creative sound effects.


  Each of these zebra presets has the mod wheel and one of the xy pads
  pre-mapped, and many of them make good use of velocity and aftertouch for
  added expression. All presets are tagged and have descriptions and usage tips.


  Afterworld zebra 2 presets is perfect for many genres and is especially well
  suited to cinematic, ambient, downtempo, chillout, electronica, trance, modern
  film score, and many more.
