description: "Extract:Dialogue 2 by Acon Digital: AI-powered dialogue cleaning with real-time reverb reduction, M/S processing, and intuitive mixer controls."
details: |-
  Extract:Dialogue 2 delivers next-generation dialogue cleaning for film, TV, and streaming, combining advanced AI with real-time reverb reduction, optional M/S processing, and a streamlined mixer interface. Built with input from post-audio professionals, it offers precise control over dialogue, noise, and ambience while preserving natural tone.

  Already a staple amongst countless post professionals for its transparency and ease of use, Extract:Dialogue 2 builds on the success of the original Extract Dialogue, adding major new features including reverb reduction, EQ editing per channel and true stereo processing. Version 2 takes everything that made the first plugin popular and pushes it much further, combining the latest cutting-edge AI with new precision controls professionals have been asking for.

  For professionals who need precision, Extract:Dialogue 2 introduces a set of advanced workflow tools. Separate faders, mute, and solo for Voice, Reverb, and Noise let you isolate exactly what you are hearing and adjust each piece on its own terms. Independent per-channel sensitivity controls dial in how much signal is treated as voice, reverb, or noise, and frequency-dependent sensitivity curves let you zero in on the exact range causing trouble instead of over-processing the whole signal.

  Per-channel EQ shapes tone instead of just removing it, so you can soften reverb brightness without losing the room, or clear rumble while keeping natural ambience. Full automation of every Voice, Reverb, and Noise control means dialogue perspective can shift as the picture does, without re-processing or swapping settings mid-edit. A real-time spectrum display visualises every part of the signal, with separate colour overlays for the voice, reverb, and noise components.

  Integrating easily into any post chain, Extract:Dialogue 2 can be used in real time or export dialogue, reverb, and noise stems separately for advanced mixing. The fully resizable interface lets you show either the full control set or just the mixer panel, keeping sessions uncluttered. Typical uses include cleaning dialogue tracks for film, TV, and streaming, reducing noise and reflections in interviews or documentaries, restoring ADR and location recordings, enhancing clarity in podcasts and voiceovers, preparing clean stems for dubbing, and recovering intelligibility in archival or field recordings.
specs: |-
  - Fully automatic noise and reverb reduction based on deep learning
  - Independent volume control for the Voice, Reverb, and Noise channels including mute and solo buttons
  - Sensitivity adjustments per channel, for fine-tuning how much signal is being detected
  - Frequency-dependent sensitivity curves to focus processing where it is needed most
  - Dedicated EQ sections for each element, allowing tone shaping within each component
  - All Voice, Reverb, and Noise controls can be automated inside your DAW (supported hosts only)
  - Full stereo processing that applies independent AI models to mid and side channels
  - Multi-output routing to export dialogue, reverb, and noise stems separately
  - Real-time spectrum display with separate colour overlays for voice, reverb, and noise
  - A/B comparison for quick auditioning of alternate settings
  - Undo and redo for experimentation without risk
  - Factory and user presets for common recording situations
  - Audition mode to monitor what is being removed
  - Resizable graphical user interface
  - Native 32 bit or 64 bit versions of all plug-ins are available
  - Supports sampling rates up to 96 kHz
  - Windows: Windows 10 / 11, Intel Core i5 or AMD multi-core processor (Intel Core i7 or faster recommended)
  - Windows: 1366 x 768 display resolution (1920 x 1080 or higher recommended), 1 GB RAM (4 GB or more recommended), 1 GB free HD space
  - Windows: host application compatible with VST, VST3 or AAX (Pro Tools 12 or higher)
  - macOS: OS X 10.13 or later, runs natively on ARM64 and Intel
  - macOS: host application compatible with AU, VST, VST3 or AAX (Pro Tools 12.8.3 or higher)
