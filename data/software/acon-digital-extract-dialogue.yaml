description: "Extract:Dialogue 2 by Acon Digital: AI-powered dialogue cleaning with real-time reverb reduction, M/S processing, and intuitive mixer controls."
details: |-
  Extract:Dialogue 2 delivers next-generation dialogue cleaning for film, TV, and streaming, combining advanced AI with real-time reverb reduction, optional M/S processing, and a streamlined mixer interface. Built with input from post-audio professionals, it offers precise control over dialogue, noise, and ambience while preserving natural tone.

  Already a staple amongst countless post professionals for its transparency and ease of use, Extract:Dialogue 2 builds on the success of the original Extract Dialogue, adding major new features including reverb reduction, EQ editing per channel and true stereo processing. Version 2 takes everything that made the first plugin popular and pushes it much further, combining the latest cutting-edge AI with new precision controls professionals have been asking for.

  While delivering real-time, broadcast-quality results instantly using the latest generation of Acon Digital's AI models, with Extract:Dialogue 2, every part of the process can also be fine-tuned with surgical precision. It's the plugin that works as fast as you do, and still lets you dig deeper when you need to.

  Extract:Dialogue 2 was designed and built with direct input from some of the world's leading dialogue editors, mixers, and sound designers who rely on tools like this every day. They told us what slows them down, what competing products get right, and where they fall short. The result is a voice cleaning tool that sets a new standard for speed, accuracy, and flexibility in real-world dialogue work.

  Integrating easily into any post chain, you can use Extract:Dialogue 2 in real time or export dialogue, reverb, and noise stems separately for advanced mixing. The fully resizable interface lets you show only the controls you need, keeping sessions uncluttered and freeing up valuable screen real estate. A real-time spectrum display visualises every part of the signal, with separate colour overlays showing the voice, reverb, and noise components, while solo and mute buttons make it easy to hear exactly what's happening.
specs: |-
  - Fully automatic noise and reverb reduction based on deep learning
  - Independent volume control for the Voice, Reverb, and Noise channels including mute and solo buttons
  - Sensitivity adjustments per channel, for fine-tuning how much signal is being detected
  - Each sensitivity control features frequency-dependent curves to focus processing where it's needed most, from midrange chatter to high-end reflections
  - Dedicated EQ sections for each element, allowing tone shaping within each component
  - All Voice, Reverb, and Noise controls can be automated inside your DAW (supported hosts only)
  - A/B comparison for quick auditioning of alternate settings
  - Undo and redo for experimentation without risk
  - Factory and user presets for common recording situations
  - Audition mode to monitor what's being removed
  - Full stereo processing that applies independent AI models to mid and side channels for cleaner centre dialogue and natural width
  - Resizable graphical user interface
  - Multi-output routing to export dialogue, reverb and noise stems separately
  - Native 32 bit or 64 bit versions of all plug-ins are available
  - Supports sampling rates up to 96 kHz
  - Windows: Windows 10 / 11, Intel Core i5 or AMD multi-core processor (Intel Core i7 or faster recommended), 1366 x 768 display resolution, 1 GB RAM (4 GB or more recommended), 1 GB free HD space
  - macOS: OS X 10.13 or later, runs natively on ARM64 and Intel, 1 GB RAM (4 GB or more recommended), 1 GB free HD space
  - Host requirements: VST, VST3 or AAX on Windows (Pro Tools 12 or higher); AU, VST, VST3 or AAX on macOS (Pro Tools 12.8.3 or higher)
