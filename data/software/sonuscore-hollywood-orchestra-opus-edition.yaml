description: One of the most awarded orchestral virtual instruments, including the Hollywood Orchestrator Engine which enables real-time orchestral arrangements by playing simple chords. Produced by Doug Rogers and Nick Phoenix with sound engineering by Academy Award and BAFTA winner Shawn Murphy, representing over a decade of recording and programming.
specs: |-
  - Over 130 GB of new recordings
  - Powered by OPUS software engine (replaces PLAY)
  - Hollywood Orchestrator with 500+ customizable presets
  - Three mood settings: Classic, Soft, Epic
  - Master key-switches for full articulation customization
  - MIDI tools and mixer effects
  - Strings: 18 Violins (new), 1st & 2nd Violins, Basses, Celli, Violas, Ensembles, Full Strings
  - Brass: French Horns, Trombones, Trumpets, Tuba, Cimbasso, Bass Trombone
  - Woodwinds: Bassoons, Clarinets, Flutes, Alto Flute, Bass Clarinet, Oboe, English Horn, Piccolo, Contrabassoon
  - Percussion: Timpani, Cymbals, Drums, Chimes, Vibraphone, Marimba, Xylophone, Bells, 25+ additional
  - Solo Instruments: Hollywood Solo Violin, Hollywood Solo Cello, Hollywood Harp
  - Minimum: Quad-core 2.7 GHz+, 16 GB RAM, macOS 10.13+ or Windows 10 (ASIO), 7200 rpm HDD
  - Recommended: Octa-core 2.7 GHz+, 32 GB+ RAM, SSD (SATA or PCIe)
  - DAW support: Logic Pro, GarageBand, Pro Tools, Cubase, Nuendo, Studio One, Reaper, Ableton Live, FL Studio, Digital Performer, Bitwig Studio, Vienna Ensemble Pro
  - Notation: Sibelius, Finale, Dorico
  - Licensing: Requires free iLok account; machine license or USB dongle activation
