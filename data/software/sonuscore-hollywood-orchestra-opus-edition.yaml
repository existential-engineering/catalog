description: One of the most awarded orchestral virtual instruments, including the Hollywood Orchestrator Engine which enables real-time orchestral arrangements by playing simple chords. Produced by Doug Rogers and Nick Phoenix with sound engineering by Academy Award and BAFTA winner Shawn Murphy, representing over a decade of recording and programming.
details: |-
  Hollywood Orchestra Opus Edition was produced by Doug Rogers and Nick Phoenix and sound engineered by Academy Award and BAFTA winner Shawn Murphy, and the page describes it as the culmination of over a decade of recording and programming. The Opus Edition adds over 130 GB of brand new recordings, reimagined original content, new features and effects housed in the OPUS engine, and Hollywood Orchestrator, which creates real-time orchestral arrangements from simple chords using 500 presets.

  The new recordings include an 18 violin string section for Hollywood Strings, new ensembles for Hollywood Brass and Hollywood Orchestral Woodwinds, and new string, brass and wind multi ensembles. Nick Phoenix describes the 18 violins as an alternate to the original first 16 violins with different players, different vibrato and the best legato they have recorded, the two new tenor trombones as warm, full and extremely precise against the original three trombones, and two re-recorded trumpets whose legato is blazing at high velocities. The original content was reprogrammed to take advantage of the Opus engine, with particular focus on Hollywood Orchestral Woodwinds, where new ensembles of 3 bassoons, 3 clarinets and 3 flutes were recorded. The Hollywood Solo Instrument Series is included in the expansion.

  New controls include master key-switches with all articulations customisable in the OPUS articulation palette, and a MOODS feature offering Classic (the original Hollywood Orchestra sound), Soft (for slower, more emotional passages) and Epic. Each mood changes the settings and look of the redesigned interface for Hollywood Strings, Orchestral Woodwinds, Percussion, Solo Violin, Solo Cello and Harp, and all instrument versions were simplified down to LITE and MAX. The OPUS software engine replaces PLAY and was built from the ground up with Wolfgang Kundrus (Cubase, Nuendo, Studio One) as head of software development and Wolfgang Schneider, creator of Kontakt, on the team. It adds individual instrument auditioning and downloads, customised key-switches, dozens of new MIDI Tools and mixer effects, scalable retina GUI upgrades for legacy products and a new script language.

  Hollywood Orchestrator, developed in collaboration with Sonuscore, uses all the instruments in the Opus Edition to build arrangements from MIDI input through its Scoring Engine. Over 500 customisable presets cover Ensembles, Ostinatos, Scores and User presets, and any preset can be altered by changing the melodic pattern in each step sequencer or by switching the instruments and voicings. A Mixer section refines each instrument's volume, pan, equalization, reverb preset, reverb send amounts and reverb controls including pre-delay, length and filters. Included collections are Hollywood Strings, Hollywood Brass, Hollywood Orchestral Woodwinds, Hollywood Harp, Hollywood Solo Violin, Hollywood Solo Cello and Hollywood Orchestral Percussion.
specs: |-
  - Over 130 GB of brand new recordings plus reimagined original content
  - Runs in the OPUS software engine, which replaces PLAY
  - Includes Hollywood Orchestrator with over 500 customizable presets (Ensembles, Ostinatos, Scores, User)
  - Scoring Engine with per-step sequencer editing and instrument/voicing switching
  - Mixer section with volume, pan, equalization, reverb preset, reverb sends, pre-delay, length and filters
  - MOODS feature: Classic, Soft and Epic, each changing instrument settings and interface styling
  - Master key-switches with all articulations customizable in the OPUS articulation palette
  - Instrument versions simplified down to LITE and MAX
  - Hollywood Strings: 18 Violins (new), 1st Violins, 2nd Violins, Basses, Celli, Violas, Ensemble (new), Full Strings
  - Hollywood Brass: 2 French Horns, 2 Trombones EXP (new), 2 Trombones and 1 Bass Trombone, 2 Trumpets, 2 Trumpets EXP (new), 3 Trumpets, 6 French Horns, Low Brass, Solo Cimbasso, Solo French Horn, Solo Trombone, Solo Trumpet, Solo Tuba
  - Hollywood Orchestral Woodwinds: 3 Bassoons (new), 3 Clarinets (new), 3 Flutes (new), Alto Flute, Bass Clarinet, Bass Flute, Bassoon, Clarinet, Contrabass Clarinet, Contrabassoon, Eb Clarinet, English Horn, Flute, Flute 2, Oboe, Piccolo Flute
  - Hollywood Harp articulations: Sustains, Harp Angeles, Bisbigliando, Harmonics, Gliss Technique, Nail Pick, Plucks, Reps, Keyswitch
  - Hollywood Solo Violin articulations: Sustains Vibrato, Sustains Non Vibrato, Flautando, Grand Detache, Marcato, Martele, Pizzicato, Sforzando, Spiccato, Legato, Keyswitch
  - Hollywood Solo Cello articulations: Sustain Vibrato, Sustains Non Vibrato, Flautando, Grand Detache, Tremolo, Marcato, Pizzicato, Sforzando, Spiccato, Legato, Keyswitch
  - Hollywood Orchestral Percussion: Combo Kits, Cymbal Pairs, Sustain Cymbals, Timpani, Field Drums, Bass Drums, Snares, Tambourines, Marching Drum Ensembles, Taos Drums, Brake Drum and Anvils, Crotales, Glockenspiel, Orchestral Chimes, Sleigh Bells, Mark Tree, Triangles, Vibraphone, Castanets, Celesta, Claves, Mahler Hammer, Marimba, Puilli Sticks, Ratchet, Shakers, Slapsticks, Wood Blocks, Xylophone
  - Includes the Hollywood Solo Instrument Series
  - Produced by Doug Rogers and Nick Phoenix, sound engineered by Shawn Murphy
  - Minimum system: quad-core CPU at 2.7 GHz or above, 16 GB RAM, macOS 10.13 or later or Windows 10 with ASIO drivers, HDD (7200 rpm, non-energy saving)
  - Recommended system: octa-core CPU at 2.7 GHz or above, 32 GB RAM or more, macOS 10.13 or later or Windows 10 with ASIO drivers, SSD (SATA or PCIe)
  - Officially supported hosts include EW Opus Stand-Alone 1.0+, EW Play 6 Stand-Alone 6.0+, Ableton Live 10+, Logic Pro 10+, GarageBand 10.3+, Pro Tools 2018.1+, Bitwig Studio 3.0+, Reaper 6.0+, FL Studio 20+, Digital Performer 9.0+, Cubase 9.0+, Nuendo 8.0+, Studio One 4.0+, Vienna Ensemble Pro 6.0+
  - Supported notation software: Sibelius 2018.1+, Finale 25.0+, Dorico 3.0+
  - Requires a free iLok account; licensing options are machine license activation or USB dongle
