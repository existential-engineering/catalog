name: Blackhole Immersive
manufacturer: eventide-audio
primaryCategory: reverb
url: https://www.eventideaudio.com/plug-ins/blackhole-immersive/
description: Blackhole Immersive expands the signature sound of the stereo
  version of Eventide's otherworldly reverb across an entire immersive mix.
details: |-
  Blackhole Immersive expands the signature sound of Eventide's stereo version
  across your entire immersive mix. Designed from the ground up for immersive,
  dolby atmos, and surround workflows, Blackhole Immersive remains respectful
  yet reactive to your carefully chosen track positioning.

  From delicate ambience to massive decays, you create and shape the listener's
  immersed experience what, when, and where they feel it. The clean and
  intuitive interface of the eventide immersive plug-ins seamlessly fits into
  production, whether the project is mixing music, post-production for film, or
  sound design for games.

  Blackhole immersive's gravity, size and feedback parameters allow fast, easy
  tailoring of the reverb to an immersive space while the crossfeed control lets
  users blend the reverb between speakers a mono source can become truly
  immersive with one simple gesture.

  The clean and intuitive interface seamlessly fits into your projects whether
  it be mixing music, post-production for film, or sound design for games. This
  enhanced workflow gives you full control over the reverb across channels, for
  an evolving immersive experience from subtle to radical.

  Supports lcr, quadraphonic, 5.0 5.1.4, and 7.0 7.1.4 channel layouts.
  Transparent signal processing effect always sounds the same across all
  immersive formats, and always maintains incoming spatial image integrity. Kill
  dry, kill wet, and freeze controls are great for creating drastic effects. Mix
  lock allows for scrolling through presets or settings while keeping the
  wet/dry mix constant.
