description: Restorator is a Windows resource editor. Change, add, or remove
  resources such as text, images, icons, sounds, videos, version, dialogs and
  menus in almost all programs.
details: |-
  Restorator is an award-winning utility for editing Windows resources in applications and their components; e.g. files with .exe, .dll, .res, .rc, and .dcr extensions. It has been used for resource editing since 1997, and continuous development based on user feedback made this application the leader in application customization software.

  Restorator is used for translation/localization, customization, design improvement and development. It is the first choice for translation and localization by Fortune 500 companies and thousands of individuals. This resource editor comes with an intuitive user-interface, complete documentation with many examples and prompt user support in the discussion forums or via email.

  Restorator modifies resources: application-dependant data that the respective programmer includes in his program. Inside the program file they are separated from the program itself and therefore may be changed. In the file, resources are organized in a tree, where the first level defines the resource type (Bitmap, Icon, etc.) and the second level defines the name of the resource. Windows provides some standard resource types whereas other resource types may be defined by the programmer and are displayed by Restorator in upper case.

  It is possible for one resource to be stored multiple times for different languages. If this is the case, Restorator adds a level in the tree with the language. You can add several languages to a single application, and your application will automatically start with the correct language, i.e. the default Windows language. The .res file has been standardized, allowing you to save all resources in one file, and Restorator includes full support for creating, editing, opening and saving res files.

  With Restorator you can translate existing applications (localization), customize the look and feel of programs, replace logos and icons (branding), enhance control over resource files in the software development process, and hack into the inner workings of applications on your computer.
specs: |-
  - View and edit resources: browse through your resources and edit them either in Restorator itself, or using applications you can integrate into Restorator's tool menu
  - WYSIWYG dialog editing: edit dialogs with your mouse on the screen, moving, resizing and re-labelling dialog elements with immediate results
  - Add multilingual support to your applications: add several languages to a single application, which then starts with the default Windows language
  - ResPatcher: create a small executable file that will re-do your changes, enabling you to customize any application and share it with others (not available in trial version)
  - Grab Resources: find and save resources in PE files from anywhere on your hard drive (not available in trial version)
  - Locating elements in resources with the resource finder / Find in Files tool
  - Edit and update resource files that are in use: Restorator can cause files to be replaced at system boot time
  - Link resource editing tools: define your own tools to edit sounds, images, and other resources
  - Resource view modes: Default Mode, Hexdump Mode and RC Resource Mode
  - Adding resources: insert resources in .exe or .res files, including extra formats/resolutions for icons and cursors
  - Deleting resources: strip debug information or useless compiler resources to shrink the executable
  - UPX support: upx-compressed files are automatically uncompressed upon loading
  - Command line support for automated execution from batch programs and installers such as InstallShield
  - Extract all resources of an application
  - Adding an XP manifest to an exe file via a dialog
  - Supported file types: .exe, .dll, .res, .rc, .dcr
  - Current version: Restorator 2018, build 1792, June 2018
  - System requirements: Windows 98 and later
  - 30 day trial version available (expires after 30 days, marks modified MENU, DIALOG and VERSION resources, excludes ResPatcher and Grab Resources, limited user support)
