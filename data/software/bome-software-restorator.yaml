description: Restorator is a Windows resource editor for viewing and editing the resources inside applications and their components, such as .exe, .dll, .res, .rc and .dcr files. Change, add or remove text, images, icons, sounds, videos, version information, dialogs and menus in almost all programs.
details: |-
  Restorator is a utility for editing Windows resources in applications and their components; e.g. files with .exe, .dll, .res, .rc, and .dcr extensions. It has been in development for resource editing since 1997.

  Restorator is used for translation/localization, customization, design improvement and development. Documentation with examples is published alongside it, and support runs through the discussion forums or by email.

  Restorator modifies resources: application-dependent data that the programmer includes in the program. Inside the program file they are separated from the program itself and therefore may be changed. In the file, resources are organized in a tree, where the first level defines the resource type (Bitmap, Icon, etc.) and the second level defines the name of the resource. Windows provides some standard resource types whereas other resource types may be defined by the programmer and are displayed by Restorator in upper case.

  It is possible for one resource to be stored multiple times for different languages. If this is the case, Restorator adds a level in the tree with the language. You can add several languages to a single application, and your application will automatically start with the correct language, i.e. the default Windows language. The .res file has been standardized, allowing you to save all resources in one file, and Restorator includes full support for creating, editing, opening and saving res files.

  With Restorator you can translate existing applications (localization), customize the look and feel of programs, replace logos and icons (branding), enhance control over resource files in the software development process, and hack into the inner workings of applications on your computer.
specs: |-
  - Edits Windows resources in PE files, RES files and RC files, with limited support for 64-bit PE files (amd64, ia64)
  - Supported file extensions include .exe, .dll, .res, .rc and .dcr (also .scr and .ocx PE files)
  - WYSIWYG dialog editing: move, resize and re-label dialog elements with the mouse
  - Add multilingual support to an application, which then starts in the default Windows language
  - ResPatcher: build a small executable that re-applies your changes so modifications can be shared (not in trial)
  - Grab Resources: find and save chosen resource types from PE files anywhere on the hard drive (not in trial)
  - Resource finder / Find in Files for locating a specific resource
  - Three view modes: default (preview images and play audio), hexdump (raw data) and RC resource text
  - Add resources to .exe or .res files, including extra formats/resolutions for icons and cursors
  - Delete resources, e.g. to strip debug information or shrink an executable
  - Edit and update resource files that are in use by causing replacement at system boot time
  - Link external editors as tools for sounds, images and other resource types
  - Open multiple files at once with drag and drop of resources between them
  - UPX support: upx-compressed files are uncompressed automatically on load
  - Command line parameters for batch automation and integration into installers such as InstallShield
  - Extract all resources of an application
  - Tool to add an XP manifest to an exe file
  - Resource types handled: BMP, JPEG, PNG and GIF images, icons, cursors, AIFF and Wave sounds, MIDI files, AVI videos, ANSI text, RTF, XML, Manifest, HTML, Delphi Forms, Delphi PackageInfo, dialog boxes, accelerators, menus, version info, and arbitrary programmer-defined types shown as hexdump
  - Only 32-bit and 64-bit files are supported; 16-bit files are not
  - Current version Restorator 2018, build 1792, June 2018, for Windows 98 and later
  - 30 day trial: expires after 30 days, adds "Patched with Restorator" text to MENU, DIALOG and VERSION resources, excludes ResPatcher and Grab Resources, limited support
  - Full version adds full user support, no startup reminder, optional turn-off of modified-resource marking, and unlimited free updates of future releases
