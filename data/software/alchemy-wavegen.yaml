description: Alchemy WaveGen creates custom oscillator and LFO waveforms for the
  camel audio alchemy plug-in. It is a standalone java application.
details: |-
  Alchemy WaveGen creates custom oscillator and LFO waveforms for the camel
  audio alchemy plug-in. It is a standalone java application with a simple
  monophonic synthesizer built in, so you can hear what you are doing.

  Alchemy wavegen has a plug-in architecture; by now it comes with two plug-ins:
  fm generator is a simple fm synth with nine operators you can connect almost
  freely. Audio file reader allows users to extract waveforms from aif or wav
  files.

  Additionally one can create new waveforms by mixing between 4 waveforms, one
  can filter waveforms with a highpass- and lowpass filter (or even a comb
  filter) and manipulate waveforms in some other ways.
specs: |-
  - Standalone java application
  - Monophonic synthesizer
  - FM generator plug-in with nine operators
  - Audio file reader plug-in
  - Highpass filter
  - Lowpass filter
  - Comb filter
  - Waveform mixing between 4 waveforms
  - Custom oscillator waveforms
  - Custom LFO waveforms
  - macOS support
  - Windows support
  - Linux support
