details: |-
  Amplifikation clarent is inspired by orange amps and thanks to the 3rd gen tube simulation engine guarantees a more dynamic natural sounding, realistic amp recording experience for guitarists. Supports various audio plugins: VST/vst3/AU/AAX which compatible with any kind of digital audio workstation softwares. Standalone and amplifikation 360 modules versions are also available.

  Kuassa uses a different approach where we mix and match the tones from different inspirations of orange amplifiers for each channel, resulting in six distinct sounds for you to rock on your personal computer. Powered by the third generation of our proprietary circuit-matching technology, please enjoy the incarnation of british heaviness: amplifikation clarent.

  Run amplifikation clarent as plug-ins inside your DAW's project, or gave an immediate run as standalone app for a quick guitar practice or drafting out presets, or break it down to 3 different amp modules inside amplifikation 360 "playground" where you can mix and match with kuassa's other amplifikations or efektors.

  Clarent a: thick and clean. A powerful choice for playing with effect pedals. Clarent b: meaty and crunchy. Delivers punchy, mid-forward distortion on channel 2. Clarent c: modern high gain type sound. Pushing massive distortion with long sustain.

  Freely adjustable dual-miking configurations with mono or stereo configuration just like a real-life guitar recording session with mix option. Built-in noise gate and limiter. Photorealistic graphics for lifelike guitar playing experience. Straightforward and easy to use interface.
specs: |-
  - VST plugin

  - Vst3 plugin

  - Audio units plugin

  - AAX plugin

  - Rack extension plugin

  - 3 amp types

  - 2 channels per amp (low gain and high gain)

  - Sag and bias feature

  - Low pass and high pass filters

  - Five cabinet types with impulse responses

  - Seven microphone types (shure sm57, sennheiser md421, sennheiser md441, c&t naked eye, royer 121, akg c414, neumann tlm103)

  - Dual-miking configurations (mono or stereo)

  - Built-in noise gate

  - Built-in limiter

  - Up to 8x oversampling

  - 3rd generation tube simulation engine

  - Standalone version

  - Amplifikation 360 modules version

  - Windows xp or later (32/64-bit)

  - Mac os x 10.6 or later (32/64-bit)

  - 512mb ram minimum

  - Pro tools 10 or later for AAX

  - Propellerhead reason 7.1 or later for rack extension
