details: |-
  An expressive and unpredictable performance tool, Blumen und Pflanzen is a
  pulsating FM feedback synthesizer/groove machine. It provides a refreshing and
  unique approach to creating odd rhythms and noise that works great for
  improvising, jamming, re-sampling, sequencing, and even blowing out your
  speaker cones.

  While complex in texture, at its core blumen und pflanzen is quite simple: two
  identical oscillators are set in an fm feedback loop, each pulsating with its
  own speed and envelope. Each oscillator can fm or pm modulate each other, with
  an intuitive xy control pad creating powerful and expressive opportunities to
  make everything from smooth sine tones to brutal noise.

  Control for the tempo, attack, and decay of each oscillator is controlled via
  an xy pad. X axis is attack time and y axis is decay time tempo is calculated
  based on the combined attack/decay time. Under the central xy pad, theres a
  little knob which can speed up or slow down both oscillators together.

  However, for those that want to sync to a tempo or create more precise
  rhythms, each oscillator's internal clock can be switched to receive MIDI
  input making it behave like a weirdo two voice drum synth. Just click the
  "seq" button under each xy pad to switch it into "MIDI" mode. Oscillator 1 is
  triggered by note c3 and oscillator 2 by note c#3.

  Fm feedback is dynamic, powerful, and noisy but if its not noisy enough for
  you, there's also an additional distortion fx to give it even more punch~ the
  distortion comes with a 4-pole lopass filter with cutoff and resonance
  control, as well as an lfo to automate sweeps. Blumen und pflanzen is built
  from the ground up to be a very stereo instrument, so it's delay is as well.
specs: |-
  - FM feedback synthesizer
  - Two identical oscillators
  - FM modulation
  - Pm modulation
  - Xy control pad
  - MIDI input support
  - Two voice drum synth mode
  - Distortion FX
  - 4-pole lowpass filter
  - Cutoff control
  - Resonance control
  - LFO
  - Stereo delay
  - 64-bit
  - macOS support
  - Windows support
  - macOS 10.8 mountain lion or better
