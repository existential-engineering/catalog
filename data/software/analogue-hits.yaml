details: >-
  Analogue hits has been created with the goal of being the definitive 'analogue
  synth music' style sound pack available 'in the box'. At swan audio I want to
  create cool and genuinely useful sounds to make music, and what better
  inspiration than analogue synth driven hit tracks.


  87 sounds from hit tracks were selected and carefully modelled, but there are
  also 40 new sounds to make a grand total of 127 authentic and inspiring sounds
  for your productions.


  Some of these sounds have already made their way onto record releases by my
  testers.
