details: |-
  A charismatic force in modern heavy drumming with ferocious energy, technical flair and a talent for crafting unforgettable grooves, Craig Reynolds has built a global audience as the host of The Downbeat, a wildly popular streetwear brand and music podcast. Known for pulling together the aggression of extreme metal and hardcore with gospel-inspired finesse, Craig brings a distinctive energy and musicality to everything he plays, exemplified by his drumming in Stray From The Path.

  Built on our new standalone platform, One Kit Wonder: The Downbeat is packed with powerful features that make it easy to elevate your productions at any experience level. Captured with obsessive precision, Craig's unmistakable sound comes through with full clarity. Expect a drum sound that absolutely crushes with sheer power and depth, mighty and chaotic cymbals and a jaw-dropping explosive room sound.

  The collection is centred around Craig's personal Tama Star Maple shell pack, paired with his coveted Tama Bell Brass snare and a prototype secondary snare inspired by the Tama Star Reserve Aluminium. The cymbals are hand-picked from Craig's favourite Zildjian models, including his own widely acclaimed K Projection ride.

  Recorded by Nolly and Craig in the legendary Wood Room at Real World Studios, the instrument showcases exceptional acoustics and a world-class signal path built around ultra-high-end microphones and legendary vintage Neve preamps.

  The updated mixer introduces powerful one knob EQ and compression controls on every channel, giving you the freedom to move from raw untouched tones to polished album ready impact or anywhere in between.
