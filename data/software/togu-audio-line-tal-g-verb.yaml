description: TAL-G-Verb is a musical effect capable to build high quality artificial reverb sounds. Suitable for all types of sounds from drums to huge pads and special effects, with an internal editor to manipulate and tune the reverb algorithm and an embedded grain engine.
details: |-
  TAL-G-Verb is a musical effect capable to build high quality artificial reverb sounds. Suitable for all types of sounds from drums to huge pads and special effects. An internal editor allows to manipulate and tune the reverb algorithm for your needs.

  The embedded grain engine has the power to convert mono sounds into complex cinematic stereo sounds, chords and synced arp patterns. TAL-G-Verb contains more than 100 factory presets, divided into different categories such as drums, vocals and synth reverbs, including presets created by Solidtrax.

  The reverb engine has been optimized to reduce coloration and digital artifacts to a minimum. As a result, this reverb can be used for a wide range of material, from small rooms to huge plate-like reverbs. The included graphic EQ can be used to shape the output spectrum of the reverb. A single color control determines how much the reverb is modulated: no color results in a crystal clear reverb, a large amount of color results in a broader and more diffuse reverb sound.

  The degree of coloration and the overall sound, including the early reflections, depends heavily on the internal reverb delays. By default, the plug-in has various carefully tuned delay settings pre-installed. However, it also allows you to create your own delay/reverb templates, which can then be used in the presets. A complex network between the delay lines ensures that the delays do not have to be perfectly adjusted to sound good.

  The grain engine can be used to pitch the sound with different pitch offsets or add more chaos and variation to the final reverb output, and different routings are possible. As an addition, the grain synchronisation allows to create host synced arp patterns, and the pattern can be restarted by MIDI NoteOn events.
specs: |-
  - Reverb engine optimized to reduce coloration and digital artifacts to a minimum
  - Covers small rooms through to huge plate-like reverbs
  - Graphic EQ to shape the output spectrum of the reverb
  - Single color control sets how much the reverb is modulated, from crystal clear to broad and diffuse
  - Internal reverb editor for adjusting the internal reverb delays and early reflections
  - Pre-installed tuned delay settings plus user-created delay/reverb templates usable in presets
  - Complex network between the delay lines, so delays do not have to be perfectly adjusted
  - Grain engine for pitching the sound with different pitch offsets or adding chaos and variation
  - Different grain routings available
  - Grain synchronisation for host-synced arp patterns, restartable by MIDI NoteOn events
  - REVERB mode showing only the reverb without the grain engine (added in 2.1.0)
  - CHAOS parameter for a more diffuse and lush output (added in 2.2.1)
  - Wet Solo (added in 2.0.1)
  - More than 100 factory presets in categories such as drums, vocals and synth reverbs, including presets by Solidtrax
  - Windows: Windows 10 or higher (64 bit host)
  - macOS: 10.11 or higher (64 bit host), Universal Binary 2 with native Intel and Apple silicon support (M1, M2, M3)
  - AAX: Pro Tools 10.3.6 or higher (64 bit)
  - Linux: 64 bit, Ubuntu 18 or similar
  - Demo restriction: the plug-in produces a rising white noise sound every minute
