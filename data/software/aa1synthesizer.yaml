details: >-
  Aa1 synthesizer is an automatable synth plugin by zzsound that functions as
  both a VST plugin and a standalone application for windows.


  Each knob is automatable, and the synth features an automatable module with a
  64 steps sequencer, time selector, number of steps selector, activate button,
  smooth control, and close button.


  The synth includes two oscillator modules, each with four oscillators
  featuring octave control (up, down, reset), wave form selector, pitch, fine
  pitch, pitch modulation/source selector, and frequency modulation/source
  selector.


  The adsr envelope section provides attack, decay, sustain, release, and amount
  controls, each with modulation source selector and modulation power
  adjustment.


  The synth features eight lfos with frequency and wave form selector, four adsr
  envelopes with attack, decay, sustain, release, and amount controls, delay
  effects with time/feedback/mix, reverb effects with room/damp/width/mix, and a
  master filter with filter type selector, cutoff, resonance, and keytrack
  controls.
