details: |-
  Unlock the instruments and notes of any song on your Mac, to not only experience in REACT and 3D spatial playback, but also adjust and remix as you please. RipX Deconstruct is the free desktop companion that lets you take your music on the go.

  Use our unique AI to deconstruct any track into vocals, bass, drums, guitars and more, right down to individual notes. With a simple AirDrop or iCloud transfer, your separated Rip file is ready for you to mix, edit, create and experience within the RipX for iPhone app. It's the easiest way to move your music from your desktop to your pocket and make the most of RipX.
specs: |-
  - Free desktop companion app for RipX for iPhone
  - AI deconstruction of any track into vocals, bass, drums, guitars and more
  - Separation down to individual notes
  - REACT and 3D spatial playback
  - Transfer separated Rip files to iPhone via AirDrop or iCloud
