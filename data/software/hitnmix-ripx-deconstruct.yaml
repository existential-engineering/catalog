description: "RipX Deconstruct is a free macOS desktop companion app for the
  RipX iPhone app that uses AI to deconstruct music tracks into separate stems —
  vocals, bass, drums, guitars, and more — right down to individual notes, with
  transfer to the iPhone app via AirDrop or iCloud."
details: |-
  RipX Deconstruct is a free standalone macOS application that pairs with the
  RipX iPhone app. It uses AI-powered source separation to break down music
  tracks into individual instrumental and vocal stems, and can extract
  individual notes from those stems.

  Processed Rip Audio files are transferred to the RipX iPhone app via
  AirDrop or iCloud. Compatible with RipX DAW and RipX DAW PRO workflows.
specs: |-
  - Transfer: AirDrop or iCloud to RipX for iPhone
  - Free to download
