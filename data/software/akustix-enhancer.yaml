details: |-
  Akustix enhancer is a collection of enhancement effects designed to complement the mix and mastering process. Each effect is based on the latest developments in psycho-acoustic research and offers multiple ways to customize recordings by using psycho-acoustic processing to shape and enhance the sound.

  Psycho eq dynamically boosts and equalizes frequencies based on the non-linearity of the human ear. Stereo width has up to 3 frequency bands available the stereo width effect uses exclusive new technology to provide independent frequency control over the stereo width & spatial image without introducing negative artefacts.

  The ultra stereo section adds transparency while enhancing perceived spaciousness and auditory distance within a mix, it can also be used to up mix from mono to stereo. Phase enhance masks non-linearities and simulates a more natural dispersion and propagation of the sound.

  Multi exciter is designed to enhance presence and brightness the multi-band exciter adds vibrancy and depth to the mix by adding additional harmonics. The smart filter section enhances transparency and adds more detail by using frequency-domain masking.

  Powerful spectrum analyzer & phase meter to visualize imaging and phase. Exclusive new stereo enhancement technology based on the latest in psychoacoustics research. High-end quality processing.
