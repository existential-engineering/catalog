description: An audio and MIDI effect plugin that adds organic, live band humanization to digital tracks. Uses group humanization technology that enables multiple plugin instances to interact like live ensemble musicians, with instrument presets and a central control knob for adjusting humanization intensity.
details: |-
  Group humanization technology enables multiple plugin instances to interact like live ensemble musicians.

  Available as both audio effect and MIDI effect plugin. Instrument-specific presets for realistic feel.

  Central control knob for adjusting humanization intensity. Based on research from Harvard University and Max Planck Innovation; covered by two utility patents.

  Compatible with Ableton Live, Logic Pro, FL Studio, Studio One, Pro Tools, Cubase.
