description: An audio and MIDI effect plugin that adds organic, live band
  humanization to digital tracks. Uses group humanization technology that
  enables multiple plugin instances to interact like live ensemble musicians,
  with instrument presets and a central control knob for adjusting humanization
  intensity.
details: |-
  Human Plugins includes both audio and MIDI FX plugins that seamlessly integrate into your existing workflow. They bring a natural, live band feel across all of your tracks, giving your music the vibe and feel of live musicians. It is an audio effect or MIDI effect you can add to any channel.

  Add Human to all your tracks to achieve that live band feel. Adjusting one plugin adjusts them all. All instances of Human Plugins connect to each other, so changing the setting on one instance will also change it on all of the other instances.

  The magic is in how different instruments push and pull on one another over time, just like pro musicians listening to each other as they play. Bassists will follow drummers, so set the instrument correctly. Set from the drop down option which type of sound you are applying the effect to, for example Drums, Piano, Bass or Synth.

  Rotate the central knob to adjust the human touch across all tracks. Each turn refines the organic feel, adding that human vibe your quantized tracks have been missing. The center display gives a real-time read-out of the amount of effect being applied in milliseconds, and a Bypass button offers quick bypassing of a single instance. The ideal range for Humanization is between 20% and 60%.

  Human Plugins are based on ground-breaking research done at Harvard University and Max Planck Innovation, invented by Dr. Hennig and Mixed In Key. The inventions are covered by two unique patents on how to synchronize audio between multiple channels, and the technology used in Human is not available in any other VST plugins or DAWs.
specs: |-
  - Available as an audio effect and as a MIDI effect plugin
  - Group Humanization: multiple instances interact as if they were musicians in a live ensemble
  - All instances connect to each other, so adjusting one plugin adjusts them all
  - Instrument presets (Drums, Piano, Bass, Synth) determine how instruments push and pull on each other
  - Single large knob controls humanization amount, from Bypass to maximum
  - Real-time read-out of the applied effect in milliseconds
  - Per-instance Bypass button, independent of other instances
  - Settings accessible via the cog icon in the plugin interface
  - Integrates with the DAW's own swing to create Humanized Swing
  - Usable as an audio-effect insert, a MIDI FX insert (Logic Pro), or a MIDI plugin on a MIDI channel
  - Recommended humanization range: 20% to 60%
  - Operating systems: macOS 10.13 or higher (Intel and Apple silicon, Rosetta and native), Windows 10 or higher
  - Plug-in formats: AAX, AU, VST3, 64-bit only (VST2 is no longer supported)
  - Processor: Intel Core i3 or equivalent, Apple Silicon M1/M2 native
  - RAM: 4 GB or more
  - Internet connection required
  - Supported DAWs: Ableton Live, Logic Pro, FL Studio, Studio One, Pro Tools, Cubase
  - Digital download, activated with a VIP code
