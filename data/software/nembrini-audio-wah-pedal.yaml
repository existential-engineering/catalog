description: Nembrini Audio Wah is modeled on the wah pedal created by the Thomas Organ Company and manufactured by JEN in Italy. It is described as Nembrini Audio's reinterpretation of a classic, delivering deep vintage wah tones.
details: |-
  Nembrini Audio's Wah Pedal is a faithful software emulation of the classic wah pedal originally created by the Thomas Organ Company and manufactured by JEN in Italy. This legendary design became the foundation of countless iconic guitar tones, and Nembrini Audio's model brings that same vintage character into modern DAW workflows.

  The plugin is fully MIDI CC compatible, allowing musicians to connect a physical expression pedal for real-time wah control just as they would with a hardware unit. MIDI settings are accessible by clicking the wah image or slider, and calibration options let players fine-tune the pedal response to their preference.

  Available for macOS and Windows as VST2, VST3, AAX, and AudioUnits, the plugin supports 64-bit DAWs and runs natively on both Intel and Apple Silicon CPUs. An iOS version is also available via the Apple App Store, offering AudioUnit v3 support for use with compatible mobile hosts.

  The Wah Pedal is offered completely free of charge, making it an accessible option for guitarists looking to add authentic vintage wah tones to their productions without cost. It is distributed through Nembrini Audio's CENTRAL installer platform.
