details: |-
  Nembrini Audio Wah is modeled on the Wah pedal created by Thomas Organ* Company and manufactured by JEN in Italy. This is the unmistakable wah tone heard on Hendrix classics like "Up From the Sky," "Voodoo Child (Slight Return)," "Little Miss Lover" and "Still Raining, Still Dreaming." *All product names are trademarks of their respective owners, which are in no way associated or affiliated with Nembrini Audio SRL. These product names, descriptions and images are provided for the sole purpose of identifying the specific products that were studied during Nembrini Audio’s sound design process.
specs: |-
  A VST2, VST3, AAX or AudioUnits compatible host | An Intel compatible or Apple Silicon CPU 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW | Contrary to the other reviews of this app, I can confirm this AudioUnit v3 effect works perfectly with a MIDI expression pedal, to give a genuine wah-wah pedal effect. I have this set up in AUM with a Hotone Ampero unit attached to an expression pedal, and it performs just as expected. I can change the filter settings directly from the pedal, and it works just fine. Thanks team for another excellent (and free!!) app!!
