  your most essential needs on any audio track.
details: |-
  Audiotrack gives you the power of three complete Waves processors in one,
  easy-to-use plug-in. With equalization, gating, and compression, it's ideal
  for multimedia, voiceovers, project studios, and more.

  Features: 4-band paragraphic equalizer; compressor / expander; gate.

  Single pass: equalization, compression / expansion and gate. Volume and gain
  reduction meters. Sample-accurate peak hold and clip meters. Instantaneous a/b
  comparisons between on-line settings.
