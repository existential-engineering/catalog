details: |-
  Blue cat's Remote Control is a set of three plug-ins with special MIDI I/O
  capabilities: either as a MIDI Remote Control, remote monitor, MIDI cc mapper
  or automation transformer, this virtual control surface available in 16, 32
  and 64 parameter versions offers advanced skinning capabilities to let you
  customize the way you control your digital audio workstation (DAW) and MIDI
  hardware.

  Virtual MIDI control surface and monitoring tool. Control or monitor in real
  time any MIDI-controllable plug-in or external MIDI device. Customize the
  controls response curve with advanced settings. Create your own digital
  workstation controller thanks to blue cat's skinning language.

  MIDI learn. Full automation support. The gui can be zoomed from 70% to 200%.
  Skins with controls. The plug-in now sends MIDI cc events only when parameters
  change or a new preset is loaded.

  Supports retina displays on mac. Brand new presets management system. Presets
  can be selected using MIDI program change and bank select messages (can be
  activated with the presets menu/MIDI program change item), or MIDI cc events
  for next/previous preset.

  Full unicode support. Apple silicon (m1 processor) support. Vst3 plug-in
  format support. Several step by step tutorials are available.
