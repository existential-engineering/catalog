details: |-
  If you love the sound of classic drum machines but are short on vintage gear,
  circuits brings the analog warmth and classic grooves you need to let the good
  vibes through.

  There are times when you need og electronic drums to get the job done with
  circuits, you'll instantly pull listeners back to the 70s with beautiful
  imperfections you can't get with digital alone.

  Use the mix control for thumping lows, smooth stereo widening, slap delay, eq
  carving and many other processing methods rolled into 12 mix presets, allowing
  you to transform the sound of your beats in moments.

  Circuits features 10 kits with 16 drum instruments each. There are 20 styles
  with 23 ready-made patterns, for a total of 460 patterns.

  Carve out the mids, crank the sub and add shimmer to the highs all once,
  straight into a slammed compressor for maximum impact. You can also set the
  control negative for a tight mid-range knock.
