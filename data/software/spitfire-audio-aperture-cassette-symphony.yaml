  all in the same virtual instrument.
details: |-
  Prepare for orchestral time travel - go from intimate solo players to a full symphony — in an instant — resampled through 200 cassette players, all in the same virtual instrument.

  We've gone back to the early days of tape sampling and taken inspiration from the sound world of the mellotron, and then blown that out of proportion - capturing strings, brass, woodwind and percussion and resampling through a custom built symphony of cassette players.
specs: |-
  - 100 articulations
  - Over 800 tapes of organic orchestral material
  - 200 custom cassette players (Warpman) in classic orchestral positioning
  - 7 sections: Hi Strings, Low Strings, High Woods, Low Woods, High Brass, Low Brass, Percussion
  - 10 custom made performance controllers, 15 speakers
  - 23.28 GB download size
  - 24 GB disk space required during install
  - Minimum 8GB RAM, 16GB RAM recommended
  - macOS 11 to 26, Intel and Apple Silicon
  - Windows 10 or 11, 64-bit
  - Spitfire Audio App required
