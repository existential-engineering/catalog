description: Purpose-built drum detection engine for mixing live-tracked drums. Offers intelligent hit detection, phase-locked alignment across tracks, adaptive decay, and dynamic leveling without losing expressive playing dynamics.
details: |-
  Purpose-built drum detection engine that classifies kicks, snares, hi-hats, and toms. Adaptive decay modeling based on hit velocity preserves natural drum resonance while minimizing bleed. Time, polarity, and phase alignment across multiple drum tracks via the Align module. Leveller module for dynamic consistency and hit clipper with intelligent response. MIDI export for sample-accurate drum triggering and external sidechain/MIDI triggering support.
