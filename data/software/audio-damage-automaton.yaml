name: Automaton
manufacturer: audio-damage
primaryCategory: effect
description: Automaton is a unique look at buffer effects, allowing you to
  experiment with artificial life within your DAW.
details: |-
  Cellular automata sequencer with host tempo-sync, five different musically
  useful rulesets (including a step sequencer), extensive randomization
  features, and a life of its own. Four sequencer-driven effects, including
  stutter (a buffer delay for extremely short loop slices), modulate (a
  self-modulating ring modulator), bitcrush (sample rate and bit depth
  reduction, and our own "error" effect), and replicate (a special version of
  our replicant effect, tuned for use with the cellular automata sequencer).

  Master section allows extensive mixing capabilities, enabling automaton to
  excel at either adding subtlety (like an occasional extra hi-hat) or complete
  self-generating idm madness.

  Automaton is definitely one of the most original plugins to come around in a
  long time. It's an effects sequencer that is based on "cellular automata", the
  idea of patterns evolving in the style of life forms. Basically you choose a
  set of "rules" by which the patterns generate, and populate the grid with
  triggers that can each set off one of four effects (bit crush, modulate,
  replicate, and stutter).

  It's perfect for adding variations to percussive loops, melodic pieces, and
  pretty much anything that you want to enhance with textural glitch
  modification.
specs: |-
  - Cellular automata sequencer
  - Host tempo-sync
  - Five different musically useful rulesets
  - Step sequencer
  - Extensive randomization features
  - Stutter effect (buffer delay for extremely short loop slices)
  - Modulate effect (self-modulating ring modulator)
  - Bitcrush effect (sample rate and bit depth reduction)
  - Error effect
  - Replicate effect (special version tuned for cellular automata sequencer)
  - Master section with extensive mixing capabilities
  - MIDI learn for hardware control of most parameters (VST only)
