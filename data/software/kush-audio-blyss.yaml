description: A mastering-style EQ, sandwiched inside six stages of delicate
  Saturation, feeding a dead-simple 'finishing compressor'. It's an EQ with a
  vibe, the likes of which could only come from Kush.
details: |-
  Blyss Mastering Channel is a 3-stage processor designed specifically to make busses, both mix and instrument, sound "prettier". It also happens to sound incredible on individual tracks too.

  Blyss' Saturation is far and away Kush's most lush color circuit to date, leaning towards "delicate" with a sensitivity and voicing that stays mellow and rich even when driven to extremes.

  When first launching Blyss, it's tempting to grab the big EQ knobs and go to town, but be aware: the heart of this machine is really the unassuming Saturation section, which integrates painstakingly modeled Input, Interstage, and Output transformers plus 3 discrete op-amp stages into one knob with one meter. You can do a lot for your sounds with the Saturation alone.

  The plugin is sold as a perpetual licence covering 2 activations, free updates and support, and all available presets, with a free 10-day demo offered via a demo code on the product page. Mac and Windows installers and a user manual are available from the maker.
specs: |-
  - 3-stage mastering channel processor: Saturation, EQ and compressor
  - Cascading saturations add detailed harmonic character
  - Saturation section models Input, Interstage and Output transformers plus 3 discrete op-amp stages, on one knob with one meter
  - Gentle 6-band EQ
  - Mastering grade compressor
  - Simple, versatile interface
  - Perpetual licence includes 2 activations, free updates and support, and all available presets
  - Free 10-day demo available via demo code
