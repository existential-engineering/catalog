description: Virtual recreation of the Simmons SDS-V/SDS5 analog drum synthesizer from the 1980s, offering authentic analog oscillator modeling with SSM2044 filter emulation and extended features.
details: |-
  VSDSX (Virtual Simmons Drum System Extended) is a software recreation of the
  legendary Simmons SDS-V/SDS5 drum synthesizer from the 1980s, famously used by
  artists like Genesis, Prince, and Herbie Hancock. The plugin offers authentic
  analog oscillator modeling with harmonic emulation and clipping behavior.

  The plugin features SSM2044 filter emulation with resonance and VCF control,
  pitch bending in both directions with optional SDS7 LFO FM modulation, and
  separate multi-outputs for each voice module. Velocity sensitivity control
  spans multiple parameters for expressive performance.

  External EPROM data loading capability supports up to 64KB samples, and a
  digital ClapTrap module emulation is included. The GUI presents a rack system
  displaying 4 modules simultaneously with full MIDI mapping and custom
  assignment capability.

  VSDSX supports both Windows 10+ (VST3) and macOS 10.14+ (VST3 and AU) with
  Universal 2 binary providing native Apple Silicon support. Full preset and
  bank save/load functionality with parameter automation support is included.
specs: |-
  - Voices: 10+ modules -- Bass Drum, Toms (incl. Tom Bass), Snare, Hi-Hat, Cymbal, PROM/PROM2 (EPROM-based), ClapTrap
  - Modeling: Analog modeled oscillator, SSM2044 filter emulation, pitch bending, SDS7 LFO FM modulation, MIDI velocity/trigger sensitivity, custom EPROM loading (1K-64K .bin, U255 companded or Linear PCM), separate multi-outputs, MIDI mapping, parameter automation
  - Architecture: 64-bit only
  - Mac build: Universal 2 (native Intel x86-64 and Apple Silicon ARM64)
