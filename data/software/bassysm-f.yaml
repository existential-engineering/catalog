details: |-
  The Bassysm-F fretless bass is a five string ibanez bass with roundwound
  strings. At the bottom of the interface, you can control the behavior of the
  instrument: legato mode allows you to choose whether playing a legato will
  trigger hammer ons, slides, sustains, or simply have no effect. The legato
  distance will define the maximum interval in which the legato will apply.

  The release volume controls the sound produced when you release a string if a
  note was going on. Cabinet simulation can be turned on or off. Eq allows you
  to edit the bass and treble of the parametric eq. The sensitivity will set the
  minimum volume for velocity 1 and give you access to all the dynamics that you
  want.

  Chorus is included as this is a fretless bass, and you can change the speed
  and depth of it. Advanced vibrato effect is controlled via modulation wheel.
  Slides effects and harmonics, ghost notes, and string hits samples are
  available.

  Bassysm-f comes with its own sample player, the uvi workstation 3 (requires
  v3.0.0 or later). It works on mac (10.9 or later) and pc (windows 8 or later),
  in standalone or as a plugin (VST / vst3 / AU / AAX) and in 64-bits only.

  Technical specifications include 698mb uncompressed, 180mb compressed in
  lossless flac format, around 827 samples, around 10 velocity layers for the
  sustain, around 13 velocities for the release, hammer on samples, and advanced
  uvi scripting giving access to a simple yet powerful interface and advanced
  features.
