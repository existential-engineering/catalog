description: Modeled after the iconic Orange OR120 amplifier from the early '70s, Nembrini Audio Range 120 captures its raw power, bold clean tones and thick, saturated overdrive. It delivers vintage British amp character with modern routing, cabinet flexibility and studio-grade effects.
details: |-
  Nembrini Audio Range 120 is modeled after the iconic Orange OR120 amplifier from the early '70s, capturing its raw power, bold clean tones, and thick, saturated overdrive that shaped the sound of classic and hard rock.

  The amplifier section carries a six-position F.A.C. (Frequency Attenuator Control) rotary switch for tone sculpting and midrange voicing, an interactive Baxandall Bass (Hz) and Treble (kHz) tone stack, an HF Drive control that adds sparkle and bite, and a Gain control that shapes preamp distortion and overall output. Dual High and Low inputs offer clean headroom or enhanced saturation depending on which is selected.

  Six carefully selected cabinet emulations sit alongside four premium microphone emulations with selectable positions, plus a mixer with volume and pan controls for blending cabinet and microphone sounds. An impulse response loader takes up to three IRs at once and draws a visual graph of each loaded IR's waveform.

  Pre-amplifier stomp effects comprise a Noise Gate, a Compressor, a Doubler that creates a wide stereo image from a mono signal using dynamic panning, pitch detuning and time offsets, and 808 Octane, an overdrive based on the classic 808 circuit with an optional octave-up switch. All effects are draggable and re-orderable for full signal chain customization.

  Post-amplifier effects add a studio-grade Equalizer with high, mid and low controls, a combined analog-style Delay and Reverb with tone, size and mix controls, and a Studio Compressor. A standalone version is included so the plugin can be played and tweaked without a DAW, and an iOS version is available for iPhone and iPad.
