  with vintage British amp character. Includes modern routing, cabinet
  flexibility, impulse response loading, and studio-grade effects.
details: |-
  Range 120 is a faithful software emulation of the legendary Orange OR120 guitar amplifier from the early 1970s, renowned for its raw power, bold clean tones, and thick, saturated overdrive. It delivers authentic vintage British amp character in a modern plugin format.

  The amplifier section features dual inputs (High/Low), a Baxandall tone stack with Bass and Treble controls, HF Drive for tonal enhancement, and the signature F.A.C. (Frequency Attenuator Control) — a six-position rotary switch that shapes the high-frequency response of the power amp section.

  Cabinet emulation is handled by six built-in cabinet simulations plus a full impulse response loader that supports up to three simultaneous IRs, paired with four microphone emulations for detailed tonal shaping.

  A comprehensive pre-amplifier stomp effects section includes a Noise Gate, Compressor, Doubler, and the 808 Octane overdrive pedal. Post-amplifier processing provides a Studio Equalizer, Delay-Reverb, and Studio Compressor for a complete signal chain.

  Range 120 runs as a plugin (VST2, VST3, AU, AAX) or standalone application on macOS and Windows, and is also available for iOS on iPhone and iPad via the Apple App Store.
