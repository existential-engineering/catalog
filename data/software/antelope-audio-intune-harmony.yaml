description: "Add 2–4 harmony voices in real time with InTune Harmony by
  Antelope Audio - a vocal harmonizer plugin with pitch correction, stereo
  spread, and timbre shaping. Try free for 14 days."
details: |-
  InTune Harmony is a real-time vocal harmony generator designed to instantly add 2, 3, or 4 harmony voices to your lead vocal. With intelligent scale-based processing, built-in pitch correction, and expressive stereo and tonal controls, it delivers rich, mix-ready harmonies in seconds – perfect for everything from subtle thickening to layered pop vocals and epic choruses.

  Generate 2, 3, or 4 Vocal Harmonies Instantly – create lush backing vocals from a single lead with adjustable key and scale. Easily add natural-sounding support or bold, layered harmonies without complex routing or manual recording.

  Built-In Pitch Correction with InTune Algorithm – activate pitch correction with the InTune button, using the same trusted algorithm from InTune Performer to ensure all generated voices are tightly in key and musically aligned.

  Stereo Spread with Space Control and Timbre Shaping with Color Control – place harmonies across the stereo field using the Space knob for natural separation, wide chorus-style effects, or focused double-tracking. Adjust the character of the harmonies from subtle (Neutral) to bold and textured (Deep) to shape harmonic contrast across the pitch range.

  Ideal for vocal thickening and doubling, creating instant backing parts, or building a chorus section that stands out without needing additional takes or manual harmonization. Runs natively in your DAW on macOS or Windows; part of the Antelope Cosmos plugin collection (75+ Antelope Native Plugins) with a free 14-day trial.
specs: |-
  - Real-time vocal harmony generator producing 2, 3, or 4 harmony voices from a single lead
  - Intelligent scale-based processing with adjustable key and scale
  - Built-in pitch correction using the InTune algorithm (from InTune Performer)
  - Space knob for stereo spread (focused double-tracking to wide chorus-style placement)
  - Color control for timbre shaping from Neutral to Deep
  - Native plugin for macOS and Windows DAWs
