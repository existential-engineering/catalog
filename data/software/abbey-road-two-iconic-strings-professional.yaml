details: >-
  Abbey road two: iconic strings continues spitfire audio's creative partnership
  with abbey road studios. Abbey road two: iconic strings represents something
  truly unique - a landmark, one-off sample library consisting of a signature
  string sound never before available.


  Captured at abbey road's studio two, possibly the most famous recording venue
  in the world. Five of the world's best players, recorded by grammy-winning
  engineer sam okell using a mouth-watering array of beautiful microphones and
  recording equipment from the studio's impressive collection.


  This is your chance to compose using the illustrious and historic abbey road
  signal path. Stunning mixes give you broadcast-level performances with
  groundbreaking, instant playability plus creativity and control.


  This core edition of iconic strings covers essential playing techniques, two
  professionally mixed signals created with the studio's coveted signal path and
  some of spitfire audio's most expressive legatos to date.


  The professional edition offers the most control and customisation featuring
  12 signals including 2 modern mixes, 2 vintage mixes, and 8 microphone
  positions.
