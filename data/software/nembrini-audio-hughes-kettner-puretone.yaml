details: |-
  The Hughes & Kettner Puretone plugin by Nembrini Audio uses hybrid modeling technology to deliver a rich guitar tone that captures the warmth and power of classic tube amps.

  The amplifier section offers classic tone control with Growl for an unfiltered, raw sound, and the plugin includes six carefully selected cabinet emulations plus an impulse loader for your favorite IRs.

  Pre-amplifier stomp effects cover a Noise Gate, Filters and Overdrive for shaping your tone, all draggable for flexible routing. The Overdrive adds warmth and gain, providing classic overdriven tones, from mild to aggressive.

  Post-amplifier effects include an Equalizer with high, mid and low frequency controls, a Tape Delay with adjustable time, feedback and tone controls for a classic echo effect, and a Spring Reverb with size, tone and mix controls to add depth and space.

  The plugin includes a standalone version, allowing you to use it without a DAW.
specs: |-
  - Amplifier Section: classic tone control with Growl for an unfiltered, raw sound
  - Cabinets & Impulse Loader: six carefully selected cabinet emulations and an impulse loader for third-party IRs
  - Pre-Amplifier Stomp Effects: Noise Gate, Filters and Overdrive, all draggable for flexible routing
  - Post-Amplifier Effects: Equalizer, Tape Delay and Spring Reverb, draggable for flexible routing
  - Microphone Emulations: four premium microphones, each with selectable positions
  - Mixer: volume and pan controls to blend cabinet and microphone sounds
  - IR Loader: up to three simultaneous IRs with a visual graph representation of the loaded waveforms
  - Standalone version included, usable without a DAW
  - Plugin Formats: a VST2, VST3, AAX or AudioUnits compatible host
  - System: an Intel compatible or Apple Silicon CPU, 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
