description: A hybrid modeling guitar amplifier plugin that delivers a rich guitar tone capturing the warmth and power of classic tube amps. Features a complete signal chain with pre-amp stomp effects, cabinet emulations with microphone modeling, an IR loader, and post-amp effects.
details:
  - The Hughes & Kettner Puretone is a hybrid modeling plugin officially developed in collaboration with Hughes & Kettner, capturing the essence of their classic tube amplifier designs. The amplifier section features classic tone controls along with a Growl function that delivers raw, unfiltered sound with authentic tube character.
  - The pre-amplifier stomp section provides a complete set of tools for shaping your signal before it hits the amp, including a Noise Gate for cleaning up your signal, Filters for frequency shaping, and an Overdrive pedal with variable intensity for adding grit and edge.
  - The cabinet section offers 6 cabinet emulations and 4 microphone emulations with adjustable microphone position selection, allowing players to dial in the precise cabinet tone they need. Volume and pan mixing controls give further flexibility over the cab sound.
  - An integrated IR Loader supports loading up to 3 simultaneous impulse responses at once, displayed with a visual waveform display. This allows blending custom IRs with the built-in cabinet emulations for endless tonal possibilities.
  - Post-amplifier effects include a 3-band Equalizer for final tone shaping, a Tape Delay with vintage styling for classic echo tones, and a Spring Reverb emulation for authentic ambient depth. Effects routing is flexible with draggable effects blocks.
