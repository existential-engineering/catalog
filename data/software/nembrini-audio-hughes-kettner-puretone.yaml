details: |-
  The Hughes & Kettner Puretone plugin by Nembrini Audio uses hybrid modeling technology to deliver a rich guitar tone that captures the warmth and power of classic tube amps I downloaded this because I remembered my guitar teacher, who also owned a store, playing a Puretone at full throttle once, and I never forgot that sound. The plugin is great, probably one of the most realistic I have heard over all the ones I’ve tried out the last few months. I cannot judge if it’s close to the real Puretone, but with good headphones, I find myself noodling and forgetting that this is not an amp in the room with me. The range is also impressive, you can probably use this for pretty much anything from bluesy cleans, overdrive to real high gain. Plus the added FX are just what I need (noise gate, overdrive, EQ, reverb, and delay). I keep coming back to this plugin in parallel to usinf Bias X and Neural DSP Gojira. Great job Nembrini! Its good, not many HK amp sims out there and this one is pretty decent.
