details: |-
  The Clon Minotaur Transparent Overdrive is a meticulous software emulation of the Klon Centaur, one of the most sought-after and revered overdrive pedals in guitar history. Originally handbuilt between 1990 and 1994, the Klon Centaur became famous for its ability to add warmth and gain without coloring or masking the natural character of the guitar signal.

  At the heart of the plugin are two modeled germanium diodes that handle waveform clipping. The gain control precisely balances the ratio between the diode-clipped signal and the clean, unprocessed signal — at lower gain settings it acts as a transparent clean boost, while higher settings introduce progressively more harmonic saturation and drive.

  The plugin features three controls mirroring the original hardware: Gain, Treble, and Volume. The Treble control adjusts the high-frequency content of the overdriven signal, while Volume sets the overall output level, allowing it to push a virtual amplifier's input stage for additional harmonic richness.

  Available as a free download for desktop (Mac and Windows) and as a mobile app for iOS devices, the Clon Minotaur is compatible with all major plugin formats. It is designed to work within any 64-bit DAW environment and supports both Intel and Apple Silicon architectures on Mac.
