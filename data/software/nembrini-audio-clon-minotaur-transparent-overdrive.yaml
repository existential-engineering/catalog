details: |-
  "Legendary transparent overdrive"

  Clon Minotaur Transparent Overdrive is modelled on The Klon Centaur*, a guitar overdrive pedal developed between 1990 and 1994.

  The Clon Minotaur is characterized as a "transparent" overdrive, meaning it adds gain to the signal without significantly altering the tone of the guitar. Depending on the settings of the control knobs, the Clon Minotaur Transparent Overdrive can act mostly as a clean boost, adding mostly volume and minimal coloring to the sound. This can be used to drive the input valve stage of the virtual amplifier to use the characteristic distortion sound of an overdriven guitar amp.

  Clon Minotaur Transparent Overdrive controls can be set to distort the sound signal in the plugin, where two modelled germanium diodes can perform waveform clipping. The gain parameter controls the balance between the modelled diode clipping stage and the clean stage. The two signals are summed together before they interact with the other two controls, treble and volume.

  Legal Disclaimer: Please note that all marks and models are all trademarks of their respective owners, which are in no way associated or affiliated with Nembrini Audio. These marks and names are used solely for the purpose of describing certain tones produced using Nembrini Audio's modelling technology.
specs: |-
  - Modelled on the Klon Centaur transparent overdrive pedal
  - Two modelled germanium diodes performing waveform clipping
  - Gain control balances the modelled diode clipping stage against the clean stage
  - Treble and Volume controls
  - Can act as a clean boost with minimal coloring
  - iOS version for iPhone and iPad
  - Requires a VST2, VST3, AAX or AudioUnits compatible host
  - Intel compatible or Apple Silicon CPU, 1GB RAM
  - Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
