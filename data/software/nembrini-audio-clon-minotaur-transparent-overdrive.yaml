details: |-
  Clon Minotaur Transparent Overdrive is modelled on The Klon Centaur * a guitar overdrive pedal developed between 1990 and 1994. The Clon Minotaur is characterized as a "transparent" overdrive, meaning it adds gain to the signal without significantly altering the tone of the guitar. Depending on the settings of the control knobs, the Clon Minotaur Transparent Overdrive can act mostly as a clean boost, adding mostly volume and minimal coloring to the sound.
