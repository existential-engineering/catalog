description: A KONTAKT & HALion instrument featuring live-recorded phrases and techniques from the Armenian duduk, an instrument over 1,500 years old recognized by UNESCO as Intangible Cultural Heritage. Includes 600+ live recorded phrases across 17 themes and a fully playable legato instrument with 7 sustain variations.
details: |-
  Ancient Duduk Phrases is a phrase-based instrument built around the duduk, the Armenian double-reed woodwind that originated over 1,500 years ago and is listed on the UNESCO Intangible Cultural Heritage List. The large reed produces a dark, colourful timbre that has carried countless atmospheric soundtracks, and the library presents it as a scoring tool rather than a traditional multisample set, pairing live recorded phrases with a playable legato patch.

  The performances come from Anna Mkhitaryan, a musician and ethno-music-group leader from Yerevan, Armenia, who graduated with a master's degree from the Komitas State Conservatory of Yerevan in 2011. She founded the international festival of ethnic Armenian music, Tshakhruk, and with her sister leads a cultural centre and music group for the physically disabled under the same name. She also plays the pku and zurna and appears regularly on recordings and in concert.

  Over 600 live recorded phrases are split into 10 lyrical main themes in three keys (C, F and A) and seven bonus themes in one key each, giving 17 themes in total. Each theme has its own style and carries a set of expressive phrases, so a line can be assembled by combining material rather than programmed note by note.

  Alongside the phrases the instrument includes a fully playable legato duduk with seven sustain variations covering ornaments such as trills, vibratos and accents. The legato patch can connect or extend existing phrases or be used to write new lines outright. The interface follows the one used across the Lyrical Series, with a main phrase page and an FX page offering EQ, delay and reverb. It runs in the full version of Native Instruments KONTAKT or in Steinberg's free HALion Sonic.
specs: |-
  - 600+ live recorded phrases in 17 themes
  - 10 lyrical main themes in three keys (C, F, A) plus seven bonus themes in one key each
  - Fully playable legato duduk instrument
  - 7 sustain variations with ornaments including trills, vibratos and accents
  - Main phrase page plus FX page with EQ, delay and reverb
  - Requires the FULL version of Native Instruments' KONTAKT 6.6.0 or higher, or Steinberg's free HALion Sonic
  - The free Kontakt Player is not sufficient: it only runs the instrument in DEMO mode
  - HALion Sonic is currently not compatible with Notion by PreSonus
  - Mac OS X 10.13 or higher, Intel Core i5
  - Windows 7 or higher, Intel Core i5
  - 4 GB RAM
  - At least 1 GB of free hard disc space
