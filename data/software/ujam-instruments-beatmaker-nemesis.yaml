description: Beatmaker NEMESIS is an action-packed drum machine that has everything you need to create powerful, dark and complex music.
details: |-
  Beatmaker NEMESIS is an action-packed drum machine designed for creating
  powerful, dark and complex music with aggressive and futuristic drum sounds.
  The heavy-hitting drum sounds have been designed to be aggressive and
  futuristic, with mix presets providing different types of distortion and
  compression for beats that are tough and punchy, cutting through any mix.

  Nemesis brings the rhythms of dystopian cyberpunk scenes and epic space
  battles, offering a range of sounds from mysterious, dark and cold to
  explosive and intense. Inspired by contemporary film and game scores, nemesis
  really shines in any situation that requires heavily processed, broken
  aesthetics.

  Veteran drum and bass producer and DJ Rusher is the musical director and sound
  designer behind nemesis. Rusher's mastery for dystopian soundscapes and
  staccato beats is at the red-hot pulsing heart of this beatmaker.

  The mix presets feature 12 custom mix templates, each a complete multi-bus
  mixing desk under the hood with multiple effect chains per channel.
  Hypercharge uses multi-band distortion for a more aggressive, electrified
  sound and can be driven over the top, especially in combination with the mix
  presets. Pressurize uses multi-band compression to condense the signal and cut
  through the mix.
specs: |-
  - 10 hard-hitting drum kits
  - 20 styles, 460 MIDI loops
  - MIDI drag and drop, resizable UI
  - "Hypercharge" Special Control
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8GB of RAM
  - 0.96GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Supported standards: MIDI
  - Requires the latest version of the UJAM App, which installs the Beatmaker plug-in that hosts all titles
