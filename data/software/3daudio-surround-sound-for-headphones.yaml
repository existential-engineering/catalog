details: |-
  Ultra-realistic surround sound for headphones. Simulates up to 8 distinct sound source positions per audio track. Sound sources may be placed anywhere in 3d space around the listener's head: full 360deg front/back/left/right, 180deg up/down, and in distance ranging from touching the head to far away.

  Sources may be stationary or automated to move on any user-defined 3d path through space. For moving sources, the doppler effect may be optionally enabled. With the doppler effect enabled, the speed of sound may be specified to be anywhere from 0.1m/s to 500m/s (~343m/s being typical for physical air).

  The doppler effect is not just a pitch shifter. The algorithm also takes into account the real time delay for the sound to travel from each sound source to each of the listener's ears, just like how sound propagates in the real world.

  Comes with some basic presets that will help get you started. User-defined presets can be saved and reloaded for use at a later time. Extremely easy to use with a straightforward help screen and editing features such as undo/redo, copy/paste, select all, etc.

  Works inside any digital audio workstation (DAW) software that supports either the audio unit, VST, or vst3 plugin formats. Supports any audio sample rate and buffer size. Provides two processing modes: real-time rendering for continuous playback during editing, and high quality rendering for seamlessly smooth audio when processing the final version of your track.
