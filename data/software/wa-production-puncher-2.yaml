description: Puncher 2 is a multi-effect plugin that combines a transient shaper, a four band multiband compressor and a parallel compressor in one compact interface. Each section carries advanced settings for detailed adjustment, and 48 configured presets cover a range of genres and instruments.
details: |-
  Puncher 2 is a multi-effect plugin built to add power and punch to a mix. Three processors sit inside one compact design, a transient shaper, a multiband compressor and a parallel compressor, so a single plugin covers ground that would otherwise need three separate units.

  Beyond setting how much of each effect is applied, Puncher 2 exposes advanced options for every section, so each aspect can be tuned in detail. 48 configured presets are included, made for various genres and instruments.

  The Transients section shapes the transients and sustain of a track. A main mix control sets the intensity of the effect, while the advanced settings govern stereo linking, bandwidth and envelope length of the detection signal, along with the maximum boost or cut applied to transients or sustain.

  The Multiband section divides a track into 4 bands with subtractive IIR filters, creating a real-time linear phase multiband split. Every band has its own compressor, which applies logarithmic attack and release directly to the required gain reduction value rather than to the detection signal, smoothing the compression in an analog fashion.

  The Parallel section applies smooth parallel compression to even out dynamics naturally, or to create a more forceful compression effect, and it can reduce dynamic range without reducing peak level. A continuous RMS time control and a knee width control tune the compressor's sensitivity from aggressive and digital through to silky and analog, and running parallel compression alongside the multiband compressor raises the effective compression ratio. Puncher 2 also shapes the frequency response of the transient and the sustain signal, not only the transient peaks.
specs: |-
  - Attack and release transient shaping with advanced detection settings
  - Real-time linear phase multiband compression across 4 bands
  - Variable RMS parallel compression with knee width control
  - 48 configured presets for various genres and instruments
  - Built in preset manager
  - Before and after dynamics wave display
  - Smoothed bypass controls
  - Resizable interface, added in version 2.1.0
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
