description: Huge-sounding tube saturation which makes any vocal or instrument
  jump out of the speakers. From delicate to aggressive analog brilliance, BB
  Tubes makes your mixes sound expensive and brings your music to life.
details: |-
  Beauty is perfect for delicate harmonic saturation, where you just want to
  make a sound blossom before it breaks up. You'll hear an instant roundness,
  fatness and glow with this knob, and an unmistakably huge low-mid. Beast gives
  you that immediate in-your-face energy, attitude and aggression, all the way
  to crunch distortion. Even when fully broken up, the sound feels tight and
  controlled, without collapsing into muddiness. There's also an a/b switch to
  select between two different tube types.

  You also have options for a pre and post hi-shelf eq, transformer in/out, bass
  relief which removes the low frequencies from the side-chain input, a
  sensitivity control which lets you choose the point at which you hit the
  tubes, a dry/wet knob and output gain.

  The soft clipping of the tubes brings down transient peak levels, while
  dramatically increasing perceived loudness. You'll get a much louder mix
  before it starts digital clipping. This plugin also includes a license for Lil
  Tube, which is installed with BB Tubes.
specs: |-
  - Tube saturation
  - Pre and post hi-shelf EQ
  - Transformer in/out
  - Bass relief
  - Sensitivity control
  - Dry/wet knob
  - Output gain
  - A/b switch
  - Dual tube types
  - Soft clipping
  - Universal 2 binary
