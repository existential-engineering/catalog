details: |-
  Blue cat's Protector is a stereo brickwall limiter plug-in. This plug-in
  offers very few controls and yet provides a large palette of sounds: from very
  transparent limiting to hard digital clipping or soft analogue saturation, it
  can be used as a master limiter, loudness maximizer or distortion unit.

  Main features: 0 db brickwall peak limiter and waveshaper. Continuous control
  of the dynamics response from transparent limiting to colorful distortion.
  Stereo link control. Dc filter to get rid of dc offset.

  Large zoomable peak and rms audio levels and gain reduction meters for optimal
  monitoring. Loudness boost monitoring. Fully configurable dynamics response
  histogram. Side chaining capability: a unique way to perform side chain
  compression and much more. No latency.
specs: |-
  - Stereo brickwall limiter
  - 0 dB brickwall peak limiter
  - Waveshaper
  - Continuous dynamics response control
  - Stereo link control
  - Dc filter
  - Peak and rms audio levels meters
  - Gain reduction meters
  - Loudness boost monitoring
  - Dynamics response histogram
  - Side chaining capability
  - No latency
