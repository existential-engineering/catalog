description: Ample guitar twelve aims to bring a taylor 956 ce 12-string guitar
  sound to your studio. Strum, finger, thumb-pick three sample libraries.
details: |-
  Ample guitar twelve aims to bring a taylor 956 ce 12-string guitar sound to your studio. Strum, finger, thumb-pick three sample libraries. Sampling: sustain, palm mute, natural harmonic, hammer on & pull off, legato slide, slide in, slide out, pop 8 articulations.

  Polyphonic legato and slide smoother: enables realistic legato across any interval and speed. Drop tuning supported, with lowest note down to d1. Authentic left-hand performance noises. Adjustable acoustic resonance.

  Riffer 4: a MIDI editor tailored for plucked string instruments: all-new strumming and chord system: the innovative "strum note" treats multiple sub-notes within a chord as a single editable object, allowing unified control over strum time, velocity gradient, and legato parameters. Combined with authentic guitar fingering settings, this makes strum creation more intuitive and efficient, delivering results that are closer to real performance.

  Dual view modes: seamless real-time switching between piano roll and guitar tab views — a first of its kind, offering two perspectives for reviewing and editing the compositions. String visualization system: strings are now visualized within the piano roll, enabling MIDI writing that adheres to authentic plucked instrument techniques — automatically preventing polyphony on the same string and intelligently assigning fingering.

  Tab reader 4: supports guitar pro files from gp3 to guitar pro 8. Files created using third-party tab editing software (not officially from guitar pro) are not supported. Capable of importing entire bass tracks into riffer with full retention of fingering, articulations, and performance data. Amp and fx system: built-in effects: 8-band eq, compressor, delay, and convolution reverb.
