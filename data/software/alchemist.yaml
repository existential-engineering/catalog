details: |-
  Alchemist is a sophisticated multi-band processor. Based on the flux dynamic processing algorithms, alchemist features a state-of-the-art iir cross-over with selectable slopes from 18 db per octave to 54 db per octave, with variable corner frequencies.

  Every band owns a complete dynamic processing section including compressor, expander, de-compressor, de-expander, working in parallel with independent angel's share and hysteresis parameters. A transient processor and a ms controller are also available for each frequency band.

  The sound can be processed from single broadband to five bands. The whole processing is completed by an adjustable soft knee clipper. An auto delay function allows to produce a zero attack time by introducing a delay line on the processed signal.

  Angel's share is the parameter controlling the mix of an auto-ratio determined by the signal dynamic and, the manual ratio setting. Hysteresis is the parameter controlling the mix of an auto-threshold determined by the signal dynamic and the manual threshold value.

  Angel's share and hysteresis are the key features of all flux dynamic processors because they depend on on the dynamic range content of the signal, and not only on signal levels as standard processors do.
