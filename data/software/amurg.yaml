details: >-
  Amurg is a virtual instrument for digital audio workstations and other plugin
  hosts on both windows and macos. This sample-based rompler instrument features
  172 presets such as keys, leads, basses, pads, and fx.


  Each preset is customizable with a set of controls such as adsr envelope,
  modulation, filter, reverb, distortion, delay, chorus, etc.


  Amurg is suitable for a wide range of styles: ambient, retro, lofi, hip hop,
  rnb, cinematic, edm, etc.


  Features: 1.40 gb extracted size / 1.17 gb download size. 172 presets
  organized by category: keys, leads, pads, basses, fx. Adsr section,
  lowpass/highpass filter cutoff, lfo modulation section, voice mode & glide,
  velocity curve & MIDI velocity selectors, reverb module, chorus module,
  distortion module, delay module, global gain & pan.


  VST/vst3 64-bit windows & VST/vst3 & AU macos.
specs: |-
