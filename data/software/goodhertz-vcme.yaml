description: Vulf Compressor, Mastering Edition (VCME) is a mastering-focused
  compressor plugin built on Goodhertz's acclaimed Vulf Compressor algorithm,
  offering expanded controls for bus processing and mastering applications with
  four saturation modes and surround support up to 9.1.6.
details: |-
  Of all the things we've engineered at Goodhertz over the past decade, Vulf Compressor remains one of our most wonderful & unusual algorithms. It has that sound. As Vulfpeck's Jack Stratton put it during our first email exchange on the prototype: “NICE! that special sauce. the way it snaps that snare is the $$$!”

  Since its release in 2014, Vulf Compressor has been everywhere: lofi beat tapes to Hollywood film scores, even on Dua Lipa's vocal chain. Surely, you've heard it on some music somewhere. But for all its raw power, Vulf Compressor's iconic three-main-control design, central to Stratton's original vision, can be limiting in situations that demand a lighter touch.

  As legendary mixer Michael Brauer once said of Vulf Comp: “On the outside, it may look like a Volvo, but under the hood, it's a monster truck.” Indeed. But you won't win the 24 Hours of Le Mans with a monster truck.

  That's why we're thrilled to announce the official release of Vulf Compressor Mastering Edition (VCME), a new kind of Vulf Compressor: a Vulf Compressor purpose-built for mastering & bus processing. VCME is cut from the same cloth as the original, yet it unlocks a range of compression that is inaccessible in its predecessor: familiar, yet distinctly refined. It's not for everyone, and that's kind of the point.

  A very special analog soft clipping / saturation section follows the compression stage. Use it to prevent digital overs, add subtle clipping, or apply all-out fuzz and saturation. In fact, the Soft Clip section is so cool we turned it into a standalone plugin: VCME Soft Clip, a plugin you get for free when you purchase VCME.
specs: |-
  - Classic compression controls: ratio, threshold, makeup gain, sidechain HPF
  - Retains the vari-mu characteristics of Vulf Compressor with a classic compressor control set
  - Release “Style” control: opto, FET, or anywhere in between
  - Soft Clip analog soft clipping / saturation stage after the compressor, with four modes
  - Soft Clip mode Chino: hifi, classic tube sound, notes of Hendrix
  - Soft Clip mode Rødovre: round, tube-y, smooth
  - Soft Clip mode Detroit: grungy, warm, notes of Jamerson
  - Soft Clip mode Melbourn: punchy, British, transformer saturation
  - Sidechain Tilt: a completely linear spectral tilt on the sidechain, often eliminating the need for a de-esser or multiband compressor
  - Extensive stereo / surround linking, with support for M/S & surround modes
  - Transparent frequency response: the frequency spectrum remains completely untouched at any setting
  - 3 pages of advanced controls
  - Includes the VCME Soft Clip plugin free of charge with purchase
  - Localized in English, Español, Português, Français, Italiano, Korean, Japanese, Simplified & Traditional Chinese
  - 64-bit only, requires macOS 10.13+ or Windows 10+
