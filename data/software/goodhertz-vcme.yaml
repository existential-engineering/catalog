description: "Vulf Compressor Mastering Edition -- a mastering-focused
  compression plugin building on the original Vulf Compressor algorithm.
  Features classic compression controls (ratio, threshold, makeup gain,
  sidechain HPF), Release Style control with opto/FET/hybrid characteristics,
  Soft Clip section with four saturation modes (Chino, Rodovre, Detroit,
  Melbourn), Sidechain Tilt for spectral frequency control, and M/S and surround
  stereo linking support."
