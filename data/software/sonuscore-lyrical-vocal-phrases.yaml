description: LYRICAL VOCAL PHRASES - BY CONNY KOLLET is a new kind of vocal solo instrument for impressive cinematic soundtracks.
details: |-
  Lyrical Vocal Phrases is a solo vocal instrument built around live-performed phrases rather than sustained notes. Pressing a single key articulates a crystal-clear, celestial vocal phrase, which Sonuscore positions as the antidote to vocal libraries whose sustains sound mechanical and inelegant. The phrases hold the pureness and verve an artist delivers when given the freedom of a performance instead of separated single notes, and the instrument is aimed at composers who want an instant emotional effect on a cinematic cue.

  Every phrase was sung by Conny Kollet, a vocalist Sonuscore describes as one of the first addresses for epic and grand vocals in large productions, working across fantasy, ethnic, medieval and modern settings. Alongside her singing she creates authentic fantasy languages, combining syllables to reach a subtly exotic yet familiar sound that integrates into varied musical settings. The page collects press and composer quotes praising the recording quality and the versatility of the material.

  The library carries more than 300 unique, live-performed phrases split into 17 themes, each theme differing in style and holding a set of cinematic, melancholic and dreamy phrases. Six languages are included, each divided into themes: the self-created Elvish, Ethnic, Medieval and Witch languages, plus Latin and Italian, and themes sung on vowels alone. Because vocal recordings are especially sensitive to pitch shifting, every phrase was recorded in four different keys, so a phrase is never adjusted more than a semitone up or down. Each theme comes with 5 different phrases, and each phrase carries separate starting, middle and end sections that can be freely recombined.

  The interface follows the one introduced with Lyrical Cello Phrases, giving instant access to the essential features with room to shape the sound further. Multiple phrases can be assigned across the keyboard and switched between, each phrase has a waveform preview, and the FX page provides EQ, delay, reverb and a MYSTIQUE feature. The instrument runs in the full version of Native Instruments KONTAKT or in Steinberg's free HALion Sonic; the free Kontakt Player runs it in demo mode only.
specs: |-
  - More than 300 unique, live-performed vocal phrases
  - 17 themes, each different in style with cinematic, melancholic and dreamy phrases
  - 6 languages including spoken themes: Elvish, Ethnic, Medieval and Witch (self-creations), plus Latin and Italian, and vowel-only themes
  - Every phrase recorded in 4 different keys, so pitch is never adjusted more than a semitone up or down
  - 5 different phrases per theme, each split into separate starting, middle and end phrases
  - Multiple phrases assignable across the keyboard with switching between them
  - Waveform preview for each phrase
  - FX page with EQ, delay, reverb and MYSTIQUE feature
  - Solo female vocals performed by Conny Kollet
  - Requires the FULL version of Native Instruments' KONTAKT 5 (version 5.8.1 or higher) or Steinberg's free HALion Sonic
  - The free Kontakt Player is not sufficient: it only runs the instrument in DEMO mode
  - HALion Sonic is currently not compatible with Notion by PreSonus
  - Intel Core 2 Duo processor recommended
  - Mac OS X 10.10 or higher
  - Windows 7 or higher
  - 4 GB RAM
  - At least 5 GB of free hard disc space
