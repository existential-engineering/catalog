description: Fix Phaser plugin provides lush vintage phasing sound and
  out-of-this-world whooshing effects. It lets you create subtle movement in
  flat or dull-sounding instruments.
details: |-
  Have you ever worried that your guitar just doesn't sound enough like a spaceship? Softube knows it has. Coming from the ever-fertile mind of audio legend Paul Wolff, Fix Phaser perfectly covers this concern, and many others too.

  Create subtle movement and texture in a string section or synth pad, wash a drum kit in stratospheric swirling attitude, create a throbbing, oscillating vibrato in a vocal, or simply swoosh and whoosh things to your heart's content.

  This product supports Extended Features. Softube loves VU meters, Bakelite knobs, and analog quirks. But Softube wants modern precision and workflow. The answer? Softube Extended Features. Easy-access panels with the innovations you need close at hand.

  Also available as a part of Flow Mixing Suite and Flow Complete Suite.
specs: |-
  - Lush vintage phasing sound in a modern plugin package
  - Wide and versatile feature set
  - Mix knob allows blending of wet and dry signals to taste
  - Create stereo soundscapes out of mono sources
  - Generate subtle movement in flat or dull-sounding instruments
  - Out-of-this-world whooshing effects
  - Supports Softube Extended Features
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26, Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Three activations included, 20-day trial, 14-day returns
