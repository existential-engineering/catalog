description: Future DS is a spectral de-esser that controls harsh sibilance
  without dulling the air. It identifies problematic high-frequency peaks in
  real time and applies targeted attenuation, leaving the surrounding spectrum
  intact.
details: |-
  Future DS is a spectral de-esser that controls harsh sibilance without dulling the air. Where traditional de-essers trigger on level, Future DS reads the spectrum: instead of asking whether a sound is loud, it asks whether a frequency spike is unnatural in context. It locates and attenuates narrowband energy that breaks the spectral envelope, leaving neighbouring frequencies untouched, so harshness is reduced without sacrificing air.

  Two processing modes are selected with the Sibilance switch. With Sibilance on, processing is triggered only when vocal sibilance is detected, making Future DS a dedicated de-esser. With Sibilance off, it behaves more like a high-frequency limiter, continuously controlling harshness without dulling the air, which also suits sources such as cymbals, strings and bright mix buses.

  Two monitoring options show what the plugin is doing. Delta Monitor solos everything removed by Future DS for direct comparison with the original signal. Sibilance Monitor, available when the Sibilance switch is on, solos only the signal identified as sibilance so detection can be verified against the intended content.

  Frequency Range Control defines the exact processing range so only the frequencies where sibilance or harshness occurs are targeted, with boundary lines dragged directly on the spectrum display. A Priority Curve drawn on the same display weights where more or less processing is applied: raising a band increases processing in that region, lowering it preserves more of the original tone. Every control sits on the panel, including Depth, Sibilance, Smooth, Attack, Release and Hold.

  By default Future DS runs in linear-phase mode for maximum spectral transparency, with a latency of 128 samples (2.9 ms at 44.1 kHz). Zero Latency Mode switches to minimum-phase processing with 0 samples of latency for real-time tracking or live performance. Oversampling runs up to 4x, effectively eliminating aliasing across the processing chain.
specs: |-
  - Spectral detection that attenuates narrowband energy breaking the spectral envelope
  - Two processing modes via Sibilance switch: dedicated de-esser or high-frequency limiter
  - Delta Monitor solos the removed signal
  - Sibilance Monitor solos the detected sibilance
  - Frequency Range Control with draggable boundary lines on the spectrum display
  - Priority Curve drawn on the spectrum display to weight processing across the spectrum
  - Panel controls: Depth, Sibilance, Smooth, Attack, Release, Hold
  - Linear-phase mode with 128 samples latency (2.9 ms at 44.1 kHz)
  - Zero Latency Mode using minimum-phase processing with 0 samples latency
  - Oversampling up to 4x
  - Mix Control
  - Real-time Spectrum Analyzer
  - Sidechain Monitoring
  - External Sidechain Support
  - Preset Library
  - Retina / High-DPI Support
  - Native Apple Silicon Support
  - Undo / Redo
  - A/B Switching
  - User-Defined Default Settings
  - Customizable Behavior Settings
  - Theme & Skin Support
  - Extreme CPU Optimization
  - GPU-Accelerated Graphics
  - Minimum system requirements: Intel or AMD CPU with SSE 4.1 instruction set, or Apple Silicon
  - Minimum OS: macOS 10.15 / Windows 8
  - 4 GB RAM and 250 MB disk space
  - 64-bit plugin formats only
