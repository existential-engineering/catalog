description: Rave Generator 3 – VST/AU/AAX/CLAP plugin for 90's rave & techno
  sounds. 256 presets, 1,000+ stabs, hoovers & basses. Mac/Win/Linux compatible.
details: |-
  Designed for producers who want to revive the raw energy of the 90's without investing in expensive gear, it combines sonic authenticity with modern ease of use. Its engine recreates the grit and punch of vintage samplers while giving instant access to a huge library of rave classics.

  With more than 1,000 recorded stabs, 500 basses, 150 kicks and 100 leads, the plugin delivers all the core elements of oldschool techno, hardcore and rave. The included 256 presets are carefully organized for fast inspiration, while advanced tools such as the Patch Randomizer, filters and onboard effects allow for deep sound design. Whether you need hoovers, rave pianos or atmospheric stabs, Rave Generator 3 provides a complete toolkit to bring the unmistakable 90's energy back into your music.

  At its core, Rave Generator 3 is more than a simple rompler, it is a multi-timbral sampler plugin capable of stacking up to 16 instruments at once. This allows you to build dense layers of sound, from pounding hoovers to atmospheric stabs, and sculpt them into powerful textures that cut through any mix. To keep your creativity flowing, the Patch Randomizer instantly generates new sound combinations.

  For further shaping, you can rely on the built-in filters (low-pass, high-pass, band-pass, band-reject) and classic effects such as delay, reverb and phaser. Another highlight is the Akaize sampler effect, designed to mimic the lo-fi coloration of 90's hardware, adding the vintage grain that made those tracks so unique.

  Rave Generator 3 is constantly evolving thanks to regularly released add-on packs. These expansions extend the sonic palette with fresh stabs, basses and textures. Individual presets can be loaded or saved, and all included stabs, basses, leads and kicks are royalty-free for use in commercial productions.
