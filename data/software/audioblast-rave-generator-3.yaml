details: |-
  Rave Generator 3 delivers the legendary stabs, hoovers, pianos and basslines that shaped oldschool techno, now available as a modern and easy-to-use plugin. Designed for producers who want to revive the raw energy of the 90's without investing in expensive gear, it combines sonic authenticity with modern ease of use, recreating the grit and punch of vintage samplers while giving instant access to a huge library of rave classics.

  With more than 1,000 recorded stabs, 500 basses, 150 kicks and 100 leads, the plugin delivers the core elements of oldschool techno, hardcore and rave. The included 256 presets are organized for fast inspiration, while advanced tools such as the Patch Randomizer, filters and onboard effects allow for deep sound design. Whether the track needs hoovers, rave pianos or atmospheric stabs, the instrument provides a complete toolkit. Individual presets can be loaded or saved for convenience.

  At its core, Rave Generator 3 is more than a simple rompler: it is a multi-timbral sampler plugin capable of stacking up to 16 instruments at once, which allows dense layers of sound to be built from pounding hoovers to atmospheric stabs and sculpted into textures that cut through a mix. The Patch Randomizer instantly generates new sound combinations to keep creativity flowing.

  For further shaping there are built-in filters (low-pass, high-pass, band-pass, band-reject) and classic effects such as delay, reverb and phaser. Another highlight is the Akaize sampler effect, designed to mimic the lo-fi coloration of 90's hardware and add the vintage grain that made those tracks unique.

  The plugin is constantly evolving thanks to regularly released add-on packs that extend the sonic palette with fresh stabs, basses and textures. All included stabs, basses, leads and kicks are 100% royalty-free for use in commercial productions, and a free demo version is available.
