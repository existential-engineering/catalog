details: >-
  Am-pulse is a transient modeler, a creative tool for editing envelope and
  sustain processes on percussive or dynamic signals.


  The signal can be subtly analogued or considerably distorted by modulating the
  subsequent tube saturation and treble exciter sections.


  The plug-ins in the analogue modelling suite recognize the number of incoming
  signals and can function automatically in mono to reduce processor strain by
  preventing the sending of another signal for calculation.


  Am suite - analogue modelling suite includes am-track analogue compressor,
  am-pulse transient designer and am-phibia pre-amp / channel strip, with audio
  tools based on replicas of classic circuit designs.
