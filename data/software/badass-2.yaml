details: |-
  Badass multi-effects distortion plug-in, give to your sounds a little bad
  grain or destroy them completely with the help of a sequencer, a Massive
  modulation system and twelve effects available simultaneously, including two
  distortions, pre and post filters, a lo-fi resampler, a bit degrader, a
  pitch-shifter, a frequency cutter, a frequency booster, a ring modulator, a
  limiter and a compressor.

  Badass 2 offers 16 distortion types from classic fold-back and clipper to
  extreme algorithms. Eleven filter types, from low-pass with an analog tone to
  variants that sounds more digital, through the 12 and 24 db/oct high-pass, to
  the classic bandpass.

  Each knobs can be modulated by an multi segment envelope generator (mseg)
  which allows you to draw your envelope shape using your mouse or a lfo that
  come with 24 waveforms or an envelope follower. The mseg and the lfo can be
  triggered at note play or sync to the tempo of your DAW.

  Assign all the parameters to your MIDI controller easily. Click on "learn" on
  the parameter, move the control on your MIDI controller, and that it. Randomly
  generate your effect with a single click. Undo your changes on all the
  parameters, just as easily.

  Each effect can be used individually, but combined they become a powerful tool
  to distort your sound.
specs: |-
  - 16 distortion types
  - 11 filter types
  - 12 effects available simultaneously
  - 16 step sequencer for each effect
  - Multi segment envelope generator (mseg)
  - LFO with 24 waveforms
