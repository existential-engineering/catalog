  - Pre and post filters
  - Lo-fi resampler
  - Bit degrader
  - Pitch-shifter
  - Frequency cutter
  - Frequency booster
  - Ring modulator
  - Limiter
  - Compressor
  - MIDI automation support
  - 7-bit MIDI continuous controller
  - 14-bit MIDI nrpn and rpn
  - Phase inverter
  - Effect bypass
  - Mono or stereo operation
  - Preset manager
  - 128 factory presets
  - Auto-pan
  - Gate
  - Fold-back distortion
  - Clipper distortion
  - Low-pass filter
  - High-pass filter (12 and 24 dB/oct)
  - Bandpass filter
  - Windows compatible
