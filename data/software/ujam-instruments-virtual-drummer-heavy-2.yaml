description: Virtual Drummer HEAVY is an authoritative, hard-hitting rock drummer, permanently set to beast mode!
details: |-
  Virtual Drummer HEAVY is an authoritative, hard-hitting rock drummer. It punishes the drums with relentless weight and energy behind each hit, driving tracks forward and providing a basis for rock, indie and grunge styles, from soft pop rock ballads to Seattle-style overdrive grunge.

  With 60 styles and 1,380 grooves in total across the original release and version 2, and 5 meticulously recorded drum kits, HEAVY covers a wide range of hard and heavy drumming. Version 2 added drag-and-drop phrases for note editing in the DAW, multi-outs for individual mixing, 30 new styles with 650 new grooves plus 100 presets, and advanced kit editing, mixing and master sections.

  Sound customization runs through the custom FX algorithm "Slam" and six character presets, ranging from high fidelity to downright rude rock. Six mix presets put together by professional sound designers complete the sound, and individual volume control of each kit element sets the balance before adding stadium-style reverb.

  Performance tweaking controls let the drummer push or pull on the beat and become looser or more rigid, which is the frustration-free design philosophy UJAM applies across the range.
specs: |-
  - 5 drum kits
  - 60 styles with 1,380 grooves in total
  - 30 new styles with 650 new grooves plus 100 presets in version 2
  - 6 mix presets and 6 character presets
  - Custom "Slam" FX algorithm
  - Drag-and-drop phrases to the DAW for detailed note editing
  - Multi-outs for individual mixing in the DAW
  - Advanced kit editing, mixing and master sections
  - Performance tweaking controls for push, pull, loose and rigid feel
  - Operating systems: Windows 10 to Windows 11, macOS Catalina (10.15) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - 4 GB of RAM
  - 0.5 GB of disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Automated installation via the UJAM App or a downloadable installer file
  - Authorization via the UJAM App or by entering email and password in the plug-in
  - Supported standards: MIDI
