details: |-
  Walls is a unique and versatile algorithmic space effect, an exploration of sound deconstructing the traditional ideas of what a reverb can be. A bendable structure, on the edge of texture.

  Shape a space for your sound. Stretch it, scale it, tilt it. All sounds are welcome.

  Six acoustic modes, each with its own character. A clean, responsive interface that invites movement over measurement. From grounded realism to bending, impossible geometries, Walls adapts to your sound, and how you choose to inhabit it.

  Shape a room your sound belongs in. Or one that's never existed before. From soft, natural reflections to abstract geometries, Walls gives sound a place.

  The six included acoustics algorithms cover both realistic acoustic spaces and creative effects. Spring ranges from classic spring reverbs to metallic resonators. Hex is a delay/reverb hybrid for granular textures and abstract sound design. Cosmic produces deep, diffused soundscapes. Binary is a deliberately degraded reverb for vintage-style digital ambience. Plate suits general-purpose reverb duties. Hall gives a larger, more realistic sound for emulating real acoustic spaces.
specs: |-
  - Six different acoustics algorithms (Plate, Hall, Spring, Cosmic, Hex, Binary)
  - Based on a hybrid between a Feedback Delay Network and Diffusion system
  - Interactive visualisations for each algorithm
  - Damping filter
  - 2-band EQ
  - Early and Late reflections mixer
  - Up to 40 modulation LFOs with individual frequency, with a unified and intuitive control system
  - Stereo width control
  - Variable diffusion depth
  - Variable room size
  - Large preset collection
  - Requires macOS 10.13 or later (optimized for the M1 processor), Windows 7 (SP1) or later, running an AU, VST or AAX compatible 64-bit host
  - iPad version available as AUv3 and standalone
