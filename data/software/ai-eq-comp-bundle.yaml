details: >-
  Solid state logic and sonible have teamed up to bring an exclusive series of
  pro audio processing plug-in bundles that deliver the perfect combination of
  heritage analogue mixing with modern ai-assisted processing.


  The bus compressor 2 plug-in was built to digitally emulate the centre section
  of ssl's 1980's g series analogue console. Its simple and intuitive interface
  allows users to make their mixes sound bigger and more powerful, with more
  punch and drive.


  Bus compressor 2 features attack, release and compressor ratios, high-pass
  filters that can be used to prevent pumping on low-frequency elements like
  kick or bass, mix control that allows users to add parallel compression and
  punch to their mix, and 2x and 4x oversampling.


  The smart:eq 4 plug-in is the powerhouse in sonible's suite of ai-assistive
  tools. Its unique smart:filter helps you to achieve the right balance for your
  tracks, buses and mixes in an incredibly fast and easy way.


  Smart:eq 4 features smart:filter technology that offers spectral balance on
  single tracks, busses and entire mixes, spectral mixing via drag & drop, wide
  range of intelligent profiles for instruments, speech and entire mixes by
  genre, ability to create custom profiles from reference tracks, and dynamic
  controls for smart:filter as well as standard filters.
