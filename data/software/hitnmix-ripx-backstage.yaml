details: |-
  RipX Backstage is the groundbreaking AR/VR music suite and digital audio workstation (DAW) that redefines music creation, learning, and enjoyment. Exclusively designed for Apple Vision Pro, this innovative suite delivers a hands-free, immersive 3D experience using cutting-edge eye-tracking and gesture recognition technology.

  Whether you're recording, editing, learning or listening to music, RipX Backstage brings dynamic spatial audio and a new dimension of creativity to the forefront of the music world.

  Step into the Band Room, where any song is split into Player Decks for each instrument. Walk around, experiencing the spatial audio, or adjust their positions using simple gestures. Explore the Showcase, a dynamic art space where music comes alive like never before.

  Master songs with real-time visualizations of piano keys, guitar chords, and drumbeats. Customize individual instrument volumes, swap 3D models, slow tempos, and use the built-in metronome for practice. Capture your music using microphone, voice-controlled instruments, Bluetooth MIDI, or innovative Conductor gestures. Edit notes effortlessly, command effects with your voice, and create music with 3D instrument models for an engaging, hands-on experience.

  The Producer Deck adds automated studio-grade effects and refines tracks using curated loops, samples, pitch bends, and musical scale snapping, all within a visually stunning and tactile 3D environment that focuses what you are working on with crystal clarity. RipX Backstage is effortlessly intuitive, utilizing standard Vision Pro gestures for seamless control.
specs: |-
  - AR/VR music suite and digital audio workstation designed exclusively for Apple Vision Pro
  - Hands-free immersive 3D experience using eye-tracking and gesture recognition
  - Band Room splits any song into Player Decks for each instrument
  - Dynamic spatial audio with gesture-based repositioning of Player Decks
  - Showcase art space where music comes alive visually
  - Real-time visualizations of piano keys, guitar chords and drumbeats for learning
  - Customizable individual instrument volumes and swappable 3D models
  - Tempo slowdown and built-in metronome for practice
  - Recording via microphone, voice-controlled instruments, Bluetooth MIDI, or Conductor gestures
  - Note editing and voice-commanded effects
  - Producer Deck with automated studio-grade effects, curated loops, samples, pitch bends and musical scale snapping
  - Audio separation for different instruments
  - Uses standard Apple Vision Pro gestures for control
