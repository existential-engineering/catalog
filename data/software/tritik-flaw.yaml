description: "A lo-fi effect plugin that celebrates imperfections. Enables users
  to give a lo-fi vibe to a whole mix or to a single instrument, injecting
  subtle instabilities to enhance audio liveliness. Also supports strong
  alterations for comprehensive audio texture reshaping."
details: |-
  Modulation section with waveform and rate controls. Lo-fi reverb with character. Noise section (tape, vinyl, crackling sounds). Drive control for warmth. 2 HP and LP analog-modeled filters. Modern resizable UI with high-resolution support.
specs: |-
  Version 1.0.3. macOS 10.10 or later. Windows 7 or later. Demo available with occasional audio fade-outs.
