description: FLAW is an effect plugin that celebrates imperfections. Give a lo-fi vibe to a whole mix or to a single instrument, inject subtle instabilities and make your sound more alive.
details: |-
  Add a lo-fi vibe to your entire mix or a solo instrument for that classic, understated feel. Transform and completely redefine audio textures with bold alterations. Introduce gentle fluctuations to breathe life into your sound.

  Flaw combines a modulation section with waveform and rate controls, a lo-fi reverb, a noise section offering tape, vinyl and crackling sounds, a drive control for extra warmth, and two analog-modeled HP and LP filters. The interface is fully resizable and high-resolution.

  A fully functional demo is available, but the audio fades out occasionally until the full version is unlocked with a license.
specs: |-
  - Modulation section with waveform and rate controls
  - Lo-fi reverb
  - Noise section with tape, vinyl and crackling sounds
  - Drive control for extra warmth
  - 2 analog-modeled HP and LP filters
  - Fully resizable, high-resolution user interface
  - Windows 7 or later with a VST or VST3 host or Pro Tools
  - macOS 10.10 or later with an Audio Units, VST or VST3 host, or Pro Tools
  - Mac downloads: VST3 / AU / AAX
  - Windows downloads: VST3 / AAX
