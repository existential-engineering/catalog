details: |-
  Ample china zheng is sampled on a dunhuang guzheng - purple cloud, a 8 gb sample library with 13 articulations, including plentiful licks and guzheng effect samples. The 13 articulations include: sustain, natural harmonic, expressive tremolo, straight tremolo, glissando, glissando up, glissando down, bend and release, bend up, bend down, single vibrato, fast and slow vibrato.

  5 microphones (left, right, body, and stereo room mics) with individual volume and eq control. 4 mic modes (all, ab, left ms, right ms) to create various sounds. All samples are actual recordings with all semitones recorded with modified tuning.

  Ample sound 4.0 sampling engine with new MIDI cc editor that displays multiple MIDI cc curves with different colors and transparency. Supports MIDI cc import and export with a variety of batch operation functions. Built-in piano roll with riffer piano version allows easy marking of articulations and expressions without keyswitches.

  Gliss mode features original technology created to simulate two-hand glissandos, able to generate two glissandos at the same time (like played with two hands), and will automatically change the sample groups between left hand (mellow) and right hand (bright). Users only need to set the beginning and end notes, and the system automatically generates the pentatonic scale notes (according to the key setting) in between.

  Fx section includes: high order 8-band eq with intuitive control of frequency response and real-time visualization of input and output spectrum; 2-line compressor with real-time visualization of input and output signal, two detection modes (rms & peak), support of soft knee, auto release and auto makeup; 6-tap echo with real-time visualization of stereo signal processing; ir reverb providing four types of ir (room, studio, hall, and larger hall) with 3d visualization of ir spectrum.
