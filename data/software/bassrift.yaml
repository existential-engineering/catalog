description: Bass is the main power source of your tracks. Therefore, we created
  the ultimate all-in-one bass sculpting tool designed for speed and power.
details: |-
  BassRift is an all-in-one bass sculpting tool designed for speed and power.
  BassRift seamlessly separates the low and high frequencies of your bass
  signal, empowering you to craft a tight, rumbling bottom end while
  simultaneously adding captivating and astonishing effects to the upper
  frequencies.

  Bassrift is your gateway to crafting spine-tingling basslines that dominate
  the mix and captivate your audience. Whether you're producing edm, modern pop
  and hip-hop, or any genre that demands a relentless low-end presence, bassrift
  is your indispensable tool for sculpting the foundation of your tracks with
  unparalleled precision and depth. Bassrift delivers incredible results on both
  synth bass and bass guitar.

  The split section of bassrift divides the incoming signal into two streams at
  a selected crossover point: the lower frequencies are refined using the safe
  bass feature for enhanced solidity, while the upper frequencies are subjected
  to various effects for added texture and depth. Each section has an
  independent gain control, and you may decide the steepness of the crossover.

  The safe bass component is dedicated to preserving and enhancing the potency
  of your bass tracks. It includes a compressor and enhancer, fortifying the
  clarity and strength of your basslines for an impactful presence in the mix.
  Furthermore, it offers the ability to consolidate the stereo signal into mono,
  ensuring the solidity and uniformity of low frequencies across various
  playback platforms.

  After the split, bassrift runs upper frequencies through a three-stage effect
  section. Each of the modules can choose from four effects and is easily
  controlled by a dual knob to maximize the speed of your work. The modules'
  order can be changed as you wish.
