description: HoRNet Magnus MK3 is a versatile processor that provides a clipper and a limiter for achieving the perfect balance of loudness and clarity.
details: |-
  Take your audio mastering to new heights with Magnus MK3, the ultimate brick wall limiter designed to offer exceptional control, unmatched precision, and versatile dynamics shaping. Whether you're a music producer, a mixing and mastering engineer, or a broadcast audio professional, Magnus MK3 empowers you to shape your sound with confidence, maximize loudness without sacrificing clarity, and unlock the full potential of every track. At its core, Magnus MK3 is a powerful clipper and limiter combo that gives you complete authority over your audio's loudness and tone. Its advanced engine is the result of years of development, combining cutting-edge digital signal processing with an understanding of the nuanced needs of today's mastering workflows. Designed as a brick wall limiter, Magnus MK3 ensures that no peaks exceed your ceiling, making it ideal for final mastering stages where loudness, transparency, and dynamic control are critical.

  One of the plugin's standout features is its dual-stage architecture, which includes a versatile clipper section and a highly controllable limiter. This allows for creative coloration and technical precision in one easy-to-use interface. The clipper section in Magnus MK3 is anything but ordinary. It features five unique clipping algorithms, including models that emulate tape saturation, soft clipping, and hard digital limiting. These options allow you to shape your audio's transients and harmonic content, adding warmth, grit, or transparency depending on your production goals. The inclusion of tape saturation is especially valuable for users seeking an analog-style warmth and subtle compression, perfect for genres like lo-fi, hip hop, and vintage-inspired electronic music. Whether you're looking to tame harsh peaks or add musical coloration to drums, vocals, or full mixes, the clipper section offers creative flexibility and precise control.

  Moving into the limiter section, Magnus MK3 offers five carefully tuned algorithms, including an authentic analog-style limiter. These algorithms vary in behavior, from transparent and surgical to warm and rounded, allowing you to tailor the limiting process to your material. Whether you need a clean finish for a pop single or want to retain energy and punch in an aggressive electronic track, Magnus MK3 gives you the tools to get it right. One of the key innovations of Magnus MK3 is the ability to set both the clipper and limiter simultaneously, streamlining your workflow and giving you an integrated solution for managing dynamics. This approach is especially useful in mastering chains where you need both creative saturation and strict loudness control in a single plugin.

  The interface provides individual gain controls for the clipper and limiter, making it easy to sculpt your sound precisely. You can adjust the ceiling to determine your peak output level, ensuring your track stays within the loudness standards required by streaming platforms and broadcast systems. Magnus MK3 offers the ability to sync the limiter's release time with your DAW's tempo, which is particularly helpful for maintaining musicality in rhythmically sensitive genres. Alternatively, you can use the auto-release algorithm, which intelligently analyzes the audio material and sets the most appropriate release time for you, balancing transparency and responsiveness. Oversampling is crucial when it comes to high-precision dynamics processing, especially at the mastering stage. Magnus MK3 allows you to apply up to 16x oversampling on both the clipper and the limiter, significantly reducing aliasing artifacts and ensuring the cleanest possible output.

  To help you make objective decisions, Magnus MK3 features an Output Gain Compensation function that automatically adjusts the output volume so that you can compare processed and unprocessed audio at the same loudness. Also included is a Delta Mode, which lets you listen to the difference between the original signal and the processed signal. This is an invaluable tool when making critical mastering decisions, as it reveals exactly what the limiter or clipper is removing or altering. The plugin includes LUFS metering, ensuring your final output meets loudness standards for Spotify, YouTube, Apple Music, and more; a LU range meter, helping you manage the dynamic range of your material; and a True Peak meter, detecting inter-sample peaks to avoid clipping in post-conversion.
specs: |-
  - Clipper and Limiter in a single package for comprehensive audio processing
  - Five versatile clipper algorithms, including tape saturation
  - Five carefully crafted limiter algorithms, including an authentic analog emulation
  - Gain settings for precise control over input levels
  - Adjustable ceiling limit to maintain desired thresholds
  - Synced release time for seamless integration with your DAW
  - Auto-release algorithm for optimized workflow
  - Up to 16X oversampling for enhanced audio quality
  - Output gain compensation for consistent loudness
  - Delta mode for focused auditioning
  - LUFS integrated metering for accurate loudness measurement
  - LU range metering to monitor dynamic range
