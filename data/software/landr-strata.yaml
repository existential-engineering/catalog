description: Create evolving, cinematic textures with LANDR Strata, a hybrid
  instrument fusing granular synthesis and organic guitar for expressive sound
  design.
details: |-
  LANDR Strata is a hybrid instrument that blends granular synthesis with organic guitar recordings to create evolving textures, pads, and atmospheric sounds. It is aimed at adding movement, depth, and character across ambient layers, cinematic soundscapes, and modern productions with expressive, mix-ready results.

  Rather than relying on MIDI-driven synthesis alone, Strata reshapes real-world guitar recordings into evolving textures. The stated goal is to turn simple ideas into epic atmospheres, breathing life into arrangements with material that feels powerful and human.

  The engine blends up to four independent sound layers, each with dedicated controls for delays and diffusion, so complex atmospheres can be built while preserving the natural pluck of a guitar behind deep, moving textures. A dedicated sub-layer with an independent Sub engine adds low-end weight and foundation to even the most ethereal textures.

  Over 200 parameters are accessible through a clean interface. A Chorus processor expands the stereo image, a Color engine adds grit and delay, and a Randomizer shuffles effects independently. Tactile knobs govern grain size and timing to quickly change the feel of a sound, high-pass and low-pass tone filters help textures sit in the mix, and a Glue compressor unifies the four layers into one cohesive result.

  The instrument ships with more than 200 presets crafted from real guitar recordings run through gear including the Meris Polymoon and Pro Co Rat, giving warm recorded character and natural grit ready to drop into a mix. Strata is also included with a LANDR Studio subscription.
specs: |-
  - Hybrid granular synthesis instrument built on organic guitar recordings
  - Up to four independent sound layers, each with dedicated delay and diffusion controls
  - Over 200 parameters
  - 200+ presets crafted from real guitar recordings (gear includes Meris Polymoon and Pro Co Rat)
  - Tactile controls for grain size and timing
  - High-pass and low-pass tone filtering
  - Glue compressor to unify the four layers
  - Dedicated sub-layer with independent Sub engine
  - Chorus processor for stereo expansion
  - Color engine for grit and delay
  - Randomizer to shuffle effects independently
  - macOS: VST3 64b, AAX 64b, AU 64b
  - macOS: Apple Silicon Native
  - macOS 10.15 and newer
  - Windows: VST3 64b, AAX 64b
  - Windows 10 and newer
  - 120 MB of disk space
  - At least 4GB of memory
