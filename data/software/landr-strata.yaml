description: Create evolving, cinematic textures with LANDR Strata, a hybrid
  instrument fusing granular synthesis and organic guitar for expressive sound
  design.
details: |-
  LANDR Strata is a hybrid instrument that blends granular synthesis with organic guitar recordings to create evolving textures, pads, and atmospheric sounds. It adds movement, depth, and character across ambient layers, cinematic soundscapes, and modern productions with expressive, mix-ready results.

  Strata features four independent sound layers, each with dedicated controls for delays and diffusion, allowing you to build complex atmospheres that feel alive. The hybrid architecture preserves the natural pluck of a guitar while layering deep, moving textures behind it.

  With over 200 parameters accessible through a clean interface, fine-grained sound design is kept simple. The Chorus processor expands the stereo image, the Color engine adds grit and delay, and the Randomizer shuffles effects independently for quick inspiration.

  Over 200 presets are included, crafted from real guitar recordings run through legendary gear like the Meris Polymoon and Pro Co Rat, delivering warm, recorded character and natural grit ready to drop straight into any mix.

  Specialized mixing tools include a Glue compressor that unifies all four layers into one cohesive sound, high-pass and low-pass tone filters for mix placement, and a dedicated Sub engine that adds low-end weight and foundation to even the most ethereal textures.
specs: |-
  - Formats on macOS: VST3, AU, AAX (Apple Silicon Native, Intel)
  - Formats on Windows: VST3, AAX
  - macOS 10.15 or higher
  - Windows 10 or higher
  - 4 independent sound layers with dedicated delay and diffusion controls
  - 200+ customizable parameters
  - Chorus processor for stereo expansion
  - Color engine for grit and delay effects
  - Randomizer for independently shuffling effects
  - High-pass and low-pass tone filters
  - Glue compressor for layer cohesion
  - Sub-layer engine for low-end foundation
  - 200+ presets from real guitar recordings (Meris Polymoon, Pro Co Rat)
  - 120 MB disk space, 4 GB RAM minimum
