description: "The Drumforge Mixing Essentials Bundle combines three professional audio plugins designed for achieving pro-level drum mixes: DF-COMP 2, DF-Q2, and Drumflex — covering dynamic compression, EQ shaping, and DSP-driven drum processing."
details: |-
  DF-COMP 2 is a dynamic control plugin offering 10 dedicated compression modes optimized for kick, snare, toms, overheads, rooms, drum bus, vocals, guitar, bass, and master bus. It features three compression styles (Soft, Medium, Hard), advanced sidechain controls, parallel compression via a Mix knob, and low CPU overhead.

  DF-Q2 is an EQ plugin designed by mix engineers for mixing drums. It bridges the gap between technicality and musicality, offering classic EQ curves and parallel processing capabilities.

  Drumflex is a DSP plugin engineered specifically for drum samples with four specialized modes for kick, snare, toms, and drum bus processing. It features analog-emulated EQ and compression, a Tilt EQ for tone shaping, an output clipping algorithm for volume enhancement, and parallel processing via a mix control.

  All three plugins include a perpetual license, free lifetime updates, and unlimited customer support.
specs: |-
  - Includes DF-COMP 2, DF-Q2, and Drumflex
  - Windows 8.1+ (64-bit only)
  - macOS 11+ (64-bit only), Intel and Apple Silicon
  - Pro Tools 11+ required for AAX
  - Cubase 6.5+ required for VST3
  - Perpetual license — single user
  - Free lifetime updates
  - Instant digital download
