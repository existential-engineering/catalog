description: Collection of 4 guitars for Kontakt that play authentic strums. Real strumming patterns with built-in chord recognizer and sequencer.
details: |-
  Strum Guitar is a collection of four guitars where all strums were sampled both up and down stroke. The sampling technique follows the way guitarists play: not all strings are struck, depending on the velocity of the hand.

  Strum Guitar contains all major and minor chords, upstroke and downstroke, from four guitars: electric, acoustic, electric 12 string and acoustic 12 string.

  Includes a built-in sequencer with chord recognition that analyses and plays the desired chords in a realistic way, with extra features to adapt it to the needs of the song. The chord recognizer triggers different chords so you're not tied to only major or minor, but you can also play tensions like add9, 7ths and 6ths. Strum Guitar doesn't support suspended, augmented or diminished chords.

  Strum Guitar features a full mixer with which you can control the guitars separately. With a load/purge switch for each guitar, pan, volume, mute, solo, doubler and output selector for mixing the different channels in your DAW. In the effects page you can add any effect you want in any order, including EQ, compressors, modulation effects, distortion, saturation, tape machine, reverbs, amp simulators and more.

  From the settings page you can control basically any parameter you might ever need. Includes round-robin, velocity curve shaping of the incoming MIDI notes, volumes of the fret and string noises and envelope for controlling the attack and release times.
specs: |-
  - 4 instruments: electric, acoustic, electric 12 string, acoustic 12 string
  - 3,349 samples
  - 5 velocity layers
  - 4 round robin
  - 4.71 GB library size
  - All strums sampled with both up and down strokes
  - Built-in sequencer with chord recognition (major, minor, add9, 7ths, 6ths; no suspended, augmented or diminished chords)
  - Full mixer with load/purge, pan, volume, mute, solo, doubler and output selector per guitar
  - Effects page with EQ, compressors, modulation, distortion, saturation, tape machine, reverbs and amp simulators in any order
  - Settings page with round-robin, velocity curve shaping, fret and string noise volumes, attack and release envelope
  - Requires Kontakt 5.7.3 or newer, full version of Kontakt required (Kontakt Player runs in demo mode)
