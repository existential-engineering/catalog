description: Comet is a reverb plug-in for vocals, melodic instruments and drums. Gliding controls give a smooth transition between up to 5 presets, and parameters can be locked so they stay consistent across the morph.
details: |-
  Comet is a reverb plug-in built for vocals, melodic instruments and drums, aimed at lush, clear textures and living space created in real time rather than at modelling the physics of a room.

  Its distinguishing feature is preset morphing. Five interchangeable preset slots can be blended with a variable glide control, so the reverb transitions smoothly between different settings, and individual parameters can be locked so they stay consistent across the morph.

  The algorithm is designed for immediate density, smooth tails and expansive tones across sizes. Internal saturation, driven from the input gain, adds extra density, and a detune algorithm gives the reverb a rich, musical character.

  Pre delay and glide can be set in milliseconds or in rhythmic subdivisions, and every parameter accepts MIDI and CV control, which makes the whole plug-in automatable.

  Comet supports VST2, VST3, AU and AAX formats and runs on Windows 64 bit and OSX 10.9 or later 64 bit.
specs: |-
  - Five interchangeable preset morphing slots
  - Glide control to morph between parameters
  - Pre delay and glide available in milliseconds and rhythmic subdivisions
  - Lockable parameters for consistency between presets
  - Rich and musical detune algorithm
  - Saturation module driven from input gain for extra density
  - MIDI and CV control for every parameter
  - Supports VST2, VST3, AU and AAX plug-in formats
  - For Windows 64bit and OSX 10.9+ 64bit
