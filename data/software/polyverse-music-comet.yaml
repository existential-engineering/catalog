description: Comet is a reverb effect of unparalleled lushness and versatility. Use gliding controls for a smooth transition between up to 5 presets.
details: |-
  Five interchangeable preset morphing slots
  Glide control to morph between parameters in milliseconds or rhythmic subdivisions
  Pre-delay available in milliseconds and rhythmic subdivisions
  Lockable parameters for consistency between presets
  Uniquely rich and musical detune algorithm
  Saturation module from input gain for extra density
  MIDI and CV control for every parameter
