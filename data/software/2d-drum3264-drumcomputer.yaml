details: >-
  2d_drum3264 drumcomputer is a free drum synth VST instrument for windows.


  Features 3 kits (house, electro, classic) with 11 drums per kit (bass, snare,
  low/mid/high tom, rimshot, clap, open/closed hats, crash & ride).


  10 sound polyphonic with 48 parameters; all accessible with mouse or MIDI.


  Volume, velocity and panning controls available per drum.


  This plug-in does not have a custom gui and uses the plug-in host's default
  interface.
