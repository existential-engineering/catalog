description: A guitar and bass preamp/DI plugin inspired by the Tech 21 SansAmp GT2. Clean, crunch and metal tones plus cab sim.
details: |-
  Inspired by the Tech 21 SansAmp GT2: the little tube-amp-in-a-box that let a whole generation record convincing amp tones straight into the desk, no mic, no bleed, no complaints from the neighbours. The GA-GT2 is a guitar and bass preamp and DI plugin built to be the fastest route to a usable amp tone in your DAW. Feed it a dry DI and it hands back anything from a character-filled vintage clean to full-on heavy metal distortion, with a switchable speaker cabinet on the end. Guitarists reach for it first, but it's just as happy adding warmth and saturation to bass, and producers keep it around for colouring drum and vocal tracks.

  The unit that inspired the GA-GT2 arrived in 1989 as a more affordable, scaled-down take on the SansAmp PSA-1, same core amp-emulation trick, pedal-sized and pedal-priced. Punk rockers, metalheads and country players all patched it in, and bassists discovered it made a killer DI for warmth and grit. Black Rooster Audio rebuilt that circuit with real-time, component-based simulation, then arranged the GUI as a 19-inch rack unit so several instances can be stacked vertically in a DAW.

  The Amplifier Setup section is where the GA-GT2's range lives. Pick one of three amp types, Cali, British or Tweed, each with its own voicing. Choose one of three modes, Clean, Hi Gain or Hot-Wired, which set how hard the tube stage is pushed. Then select one of three mic positions, Off Axis, Center or Classic, to emulate where the microphone sits in front of the speaker. The Drive knob pushes overall gain and overdrive, while the Level control trims volume without touching the tone.

  On guitar, run the Cab Sim in for a finished, mix-ready tone, or bypass it and place the GA-GT2 in front of another amp plugin like a real distortion pedal. The Baxandall-style Treble and Bass controls shape clarity and body, and the Phase switch flips polarity so parallel layers don't cancel. On bass, it delivers the classic SansAmp DI warmth and saturation, with the Mix knob blending dry against processed signal.
