description: Drum Machine
details: |-
  For the first time since its release in the 80s, Nithonat 2 explores what the classic Roland TR-606 would have truly been capable of. Designed as a companion to the 303-style silver box, the 606 may look deceptively simple but is a very versatile unit that has found its place across genres from 80s pop to modern EDM and experimental music.

  Nithonat's synthesis is special even compared to D16's own Nepheton: precise software emulation of the original hardware circuits gives it characteristic hi-hats and cymbals, an unparalleled bass drum attack, and a whole spectrum of harsh, metallic sounds from rumbling kicks to barky snares that cut through a mix.

  An included effect chain (bitcrusher, distortion, reverb, delay, chorus, dynamics, EQ) makes the sound bigger and fatter straight from the output. A super easy-to-use sequencer with tap function, randomizer and hundreds of factory patterns is joined by per-step flam and substep articulations, plus drag-and-drop MIDI export.
specs: |-
  - Software emulation of the classic Roland TR-606 drum machine circuits
  - Characteristic harsh, metallic kick/snare/hi-hat/tom sounds
  - Effect chain with bitcrusher, distortion, reverb, delay, chorus, dynamics and EQ
  - Sequencer with tap function, randomizer and hundreds of factory patterns
  - Per-step flam and substep articulations with editable properties
  - Drag-and-drop MIDI export
