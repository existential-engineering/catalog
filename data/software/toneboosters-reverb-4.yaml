description: Lush reverberation and shimmer, with the reverb spectrum and reverberation time shaped across frequency just like an EQ. Adds dynamic compression, ducking, gating and high-quality freeze, plus a dual pitch-shifter for shimmer effects.
details: |-
  Silky smooth, warm, lush reverberation for creative and all-purpose use. Shape the reverb spectrum and reverberation time across frequency just like you work with your EQ.

  Add dynamic compression, ducking, gating and high-quality freeze. Use the dual pitch-shifter for out-of-this-world shimmer effects.

  Modulate parameters with the integrated LFO to add movement, and see the input and reverb spectrum in realtime. TB Reverb adds smooth and musical space without limits.
specs: |-
  - Studio-quality reverb with precise control over spectrum and reverberation time
  - Gating and ducking for creative reverb use
  - Dual pitch shifter for shimmer effects
  - High-quality freeze
  - 14-channel immersive audio support
  - Integrated LFO with a range of waveforms for parameter modulation
  - Realtime input and reverb spectrum visualization
  - Personal, perpetual desktop licence for use on up to 4 computers
  - Resizable user interface, fits every screen and resolution
  - Dozens of color themes
  - Undo, redo and A/B switching
  - Preset management: organize, import and export presets
  - Easy license activation, no hardware dongle required
  - Sample rates of up to 384kHz
  - Windows 10 or up, 64-bit DAW with VST, VST3 or AAX support, Intel or AMD SSE2 processor
  - macOS 10.13 or up, 64-bit DAW with VST, VST3, AAX or AU support, Intel or Apple Silicon processor
  - Linux, 64-bit DAW with VST or VST3 support, Intel or AMD SSE2 processor, glibc 2.31 or up
  - iPadOS / iOS requires an AUv3-compatible host
