description: Emulation of the 1978 Oberheim OB-1, developed in collaboration
  with Oberheim. Delivers a sound as full and robust as the legendary Minimoog
  yet as aggressive as the MS-20. Features up to 16-voice polyphony, waveshaping
  with hard sync and cross-mod, X-Modifier technology, 16-step sequencer, and
  built-in effects.
details: |-
  The GForce Oberheim OB-1 broadens the Oberheim sound palette in ways that GForce believe will see it become a favourite among techno and electro producers and underground artists, as well as composers for its character and anyone cherishing vintage analogue tones. Its rich, aggressive sound and expansive feature set make it an essential hustler.

  The hardware Oberheim OB-1 holds a special place in the history of synthesizers. Launched in 1978, it was the world’s first programmable monophonic synthesizer. Designed by Tom Oberheim, it brought the power of preset memory to analogue synthesis, allowing musicians to store and recall their sounds with relative ease. Despite its groundbreaking features and historical significance, the OB-1 has remained somewhat under the radar compared to other classic synthesizers like the Minimoog.

  The emulation has been enhanced to bring vintage charm alongside modern possibilities: an enhanced signal path with a new waveform and waveshape modulation, discrete levels for the oscillators, sub and noise, LFO sync and retrig, envelope looping, discrete key tracking, cross-mod and pan spread. Unlike the monophonic original, polyphony up to 16 voices and mono unison have been added, along with a high pass filter, chorus, delay and reverb effects, four macros, a built-in arpeggiator and sequencer, and an advanced patch browser.

  Using GForce’s X-Modifier technology, the scope of sound modulation is immense. The X-LFO and X-ADSR section lets you click a parameter and apply an independent modulation amount without setting up modulation paths, so while the tone and character remain authentic to the original, the additional features turn it into a sonic canvas.

  OB-1 ships with over 300 brand-new production-ready presets from sound designers and artists including Zardonic, An On a Blast, Alex Jann, Jogging House, Lightbath, Polydata, Plug Hugger, GEOsynth, Jordan Passmore, Paul K Hurst, Richard Veenstra and Ramon Kerstens (K/V), Koryu, Boudicca Bass Service, Dave Spiers and Graeme Rawson.
