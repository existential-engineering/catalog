description: Emulation of the 1978 Oberheim OB-1, developed in collaboration with Oberheim. Delivers a sound as full and robust as the legendary Minimoog yet as aggressive as the MS-20. Features up to 16-voice polyphony, waveshaping with hard sync and cross-mod, X-Modifier technology, 16-step sequencer, and built-in effects.
details: |-
  The Oberheim OB-1 is a faithful software recreation of the legendary 1978 Oberheim OB-1 monosynth, developed in collaboration with Oberheim. It delivers a sound described as 'as full and robust as the legendary Minimoog yet as aggressive and snarling as the MS-20.'

  The OB-1 features two oscillators with waveshaping, hard sync, and cross-mod, plus a unique 2-pole or 4-pole VCF with resonance and a High-Pass Filter with keyboard tracking. The X-Modifier technology adds extensive parameter modulation via X-LFO and X-ADSR modulators.

  Built-in effects include Chorus, Delay, and Reverb. A 16-step Sequencer with macro automation and a full Arpeggiator are included. The synth supports Mono Unison, Legato, and Poly modes with up to 16 voices, poly aftertouch, and pan modes.

  Over 300 presets from renowned sound designers are included, with a powerful Preset Browser featuring tagging and search. A fully scalable UI and four programmable Macros round out the feature set.
