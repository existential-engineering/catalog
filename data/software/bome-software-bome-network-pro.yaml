details: |-
  Bome Network Pro is the paid tier of Bome Network, unlocked by entering a license key in the Bome Network settings rather than by installing a separate application. The add-on allows you to establish MIDI connections from computer to computer, and also to Apple tablets and smartphones via Ethernet and via WiFi. Bome positions it as similar to Apple's Network MIDI, except that it seamlessly works with the BomeBox, too, and Network pairings are persistent across reboots; temporary network disconnections, like unplugged cables, are handled gracefully.

  The Pro license is what draws the line against the free tier: MIDI connections to the BomeBox also work without the Pro license, so computer-to-BomeBox routing is the base product's job and computer-to-computer, computer-to-iPhone and computer-to-iPad networking is the Pro tier's. With a Pro license, devices running Bome Network Pro are automatically discovered on the network, so you can connect to exactly the systems you want with one click.

  Remote Direct MIDI extends the same idea to ports rather than machines. With Pro you can access virtual MIDI ports and physical MIDI devices attached to remote computers and mobile devices as if they were connected locally, choosing which ports and devices to make available and leaving the rest private.

  The web shop license is a floating license good for connecting up to 5 devices at a time. You can freely select and change those up to 5 devices as long as you do not exceed the total, where a device is a computer, an iPhone or an iPad; BomeBoxes do not count against the limit, since they can be connected to without the Pro license anyway. Licenses are cumulative, so buying the 5-device license more than once raises the ceiling, and iOS or iPadOS licenses bought in the Apple App Store count towards the same total. Educational pricing is available on request.

  Delivery is a digital download: after purchase you receive a personal license key by email and enter it in the Bome Network settings to activate the Pro features. A key bought in the Bome web shop can also be used on iOS or iPadOS, while a license bought in the Apple App Store cannot be activated on other platforms like macOS or Windows. The web shop license covers macOS, Windows, Linux, Raspberry Pi, iPhone and iPad, the current version is 1.7.0, at least 150MB of free hard disk space is required, and Bome Network is not compatible with Windows on ARM yet.
specs: |-
  - Add-on license that unlocks Pro features inside the Bome Network application
  - Computer-to-computer MIDI over Ethernet and WiFi
  - MIDI connections to Apple tablets and smartphones (iPhone, iPad)
  - Automatic network discovery of devices running Bome Network Pro, one-click connection
  - Remote Direct MIDI access to virtual MIDI ports and physical MIDI devices on remote computers and mobile devices
  - Network pairings persistent across reboots
  - Temporary network disconnections, such as unplugged cables, handled gracefully
  - Works with the BomeBox, though BomeBox connections do not require a Pro license
  - Floating license for up to 5 simultaneously connected devices per web shop license
  - BomeBoxes do not count towards the device limit
  - Licenses are cumulative across web shop and Apple App Store purchases
  - Web shop license keys usable on macOS, Windows, Linux, Raspberry Pi, iOS and iPadOS
  - Apple App Store licenses cannot be activated on other platforms such as macOS or Windows
  - Digital download, personal license key delivered by email
  - Activated by entering the license key in the Bome Network settings
  - At least 150MB free hard disk space
  - Not compatible with Windows on ARM (yet)
  - Student and educational pricing available on request
