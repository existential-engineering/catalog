details: |-
  This Add-On for Bome Network allows you to establish MIDI connections from computer to computer, and also to Apple tablets and smartphones via Ethernet and via WiFi. This is similar to Apple's Network MIDI, except that it seamlessly works with the BomeBox, too, and Network pairings are persistent across reboots. Temporary network disconnections, like unplugged cables, are handled gracefully. MIDI connections to the BomeBox also work without the Pro license.

  With a Bome Network Pro license, you can create reliable, low-latency network MIDI connections between computers, Macs, PCs, iPhones, and iPads. Devices running Bome Network Pro are automatically discovered on the network, allowing you to connect to exactly the systems you want with just one click.

  Using Remote Direct MIDI, you can also access virtual MIDI ports and physical MIDI devices on remote computers and mobile devices as if they were connected locally. Simply choose the ports and devices you want to make available, and Bome Network takes care of the rest.

  The Bome Network Pro (5 devices) license sold in the Bome web shop is a floating license, good for connecting up to 5 devices at a time using Bome Network. You can freely select and change those up to 5 devices as long as you do not exceed the total number of connected devices. A device, in this context, is a computer (macOS or Windows), an iPhone, or an iPad. BomeBoxes do not count, as they can be connected to without the Pro license anyway.

  Licenses are cumulative. You can purchase the 5-device license multiple times in the web shop to increase the number of devices you connect to, and iOS or iPadOS licenses from the Apple App Store count towards the same maximum. Upon purchase in the web shop you receive a personal license key by email, which you enter in the Bome Network settings to activate the Pro features. Keys purchased in the web shop can also be used on iOS or iPadOS, while licenses purchased in the Apple App Store cannot be activated on other platforms like macOS or Windows.
specs: |-
  - Computer-to-computer MIDI over Ethernet and WiFi
  - MIDI connections to Apple tablets and smartphones (iPhone, iPad)
  - Automatic discovery on the network of devices running Bome Network Pro
  - One-click connection to remote systems
  - Remote Direct MIDI access to virtual MIDI ports and physical MIDI devices on remote computers and mobile devices
  - Network MIDI pairings persistent across reboots
  - Temporary network disconnections handled gracefully
  - Works with the BomeBox (BomeBox connections do not require a Pro license)
  - Floating license for up to 5 simultaneously connected devices per web-shop license
  - Licenses are cumulative across web shop and Apple App Store purchases
  - Activated by entering a license key in the Bome Network settings
  - Web-shop license keys usable on macOS, Windows, Linux, Raspberry Pi, iOS and iPadOS
  - Apple App Store licenses cannot be activated on other platforms
  - Delivered as a digital download, license key sent by email
  - At least 150MB free hard disk space required
  - Not compatible with Windows on ARM (yet)
