description: Igniter is the industry-standard vehicle sound design system, a one-stop solution for designing, performing, and automating vehicle sound effects directly within your DAW. It enables rapid creation of sounds for everyday vehicles, sports cars, motorbikes, planes, helicopters, spacecraft, drones, and more using a hybrid engine combining Granular, Synth, One Shot, and Loop modules. Features MIDI performability for real-time automation, Doppler effect processing, convolution reverb with custom IR support, perspective mixing, loop sequencing, electric vehicle presets, and foley integration.
details: |-
  Igniter is a one-stop solution for designing, performing and automating vehicles directly in your DAW, covering everyday vehicles, sports cars, motorbikes, planes, helicopters, spacecraft and drones. Over 20 ready-to-go performable vehicles are included, among them the Ford F150, Harley Davidson and Audi R8, and vehicle sound effects are processed through a hybrid workflow using Granular, Synth, One Shot or Loop modules.

  The page sets out the use cases in sound design. Vehicle Movement designs vehicles with automation while following footage on screen. Driving Pass-bys add a Doppler effect to any preset and perform a vehicle's movement through a space, saved and recalled for later adjustment. Vehicle Foley covers sweeteners, car doors, windows, windscreen wipers and interiors or exteriors, with the One Shot tab holding a collection of samplers.

  Electric vehicle assets are accessible directly in Igniter's File Browser alongside ready-to-go electric vehicle presets. Perspectives and Changes mixes and automates between Engine and Exhaust perspectives per vehicle, and the built-in convolution reverb switches between interior and exterior perspectives, with drag-and-drop support for your own impulse responses.

  The Loop system sequences loops along a timeline to build dynamically changing loop-based systems, so a vehicle can move across different surfaces or wind speeds, or drive loop-based systems from static rev band recordings. Complex Actions cover revs, acceleration, brakes, engines and exhausts, sketched with a mouse or MIDI controller and performed to picture. A large selection of aerial sound effects suits helicopters and drones, and the Synth tab covers spaceships, sci-fi textures and futuristic vehicles.

  Recorded vehicles named on the page include the Agusta Westland 119x, Aston Martin Rapide, Audi R8, BMW i3, Bucker BU 131, Cessna 560XL, CH-47D Chinook, Dacia 1310, De Havilland Tiger Moth, Ferrari 348, Ford F150, Harley Davidson 99 Hog, Honda Civic, Huey UH-1H, Land Rover Defender, Mercedes Actros, Porsche Carrera, Subaru Crosstrek SUV, Subaru Impreza, Tesla Model S P85D, Toyota Chaser, U650M Tractor and Tires. A 10-day free trial is available.
specs: |-
  - 2.4 GHz CPU minimum
  - 4 GB of RAM
  - macOS 10.13 or above (working on OS X Ventura but not yet fully tested), or Windows 10 64-bit or above
  - Apple Silicon fully supported
  - Formats (64-bit only): AAX Native, VST, AU
  - Minimum sample rate 44.1 kHz, maximum 192 kHz
  - Digital download, internet connection required at the time of activation
  - An iLok account (free at ilok.com) is required for both demo and full version
  - An iLok 2 or later is required for dongle use
  - Can only be activated on one computer at a time
  - Licences cannot be resold or moved between iLok accounts
  - Supported hosts: Pro Tools (11 or later), Logic Pro X, Nuendo 8.2.10 or above, Cubase, Reaper, Ableton Live 10 and above
  - Igniter contents: 630 samples, 24 performable vehicles, 284 presets, 4.9 GB additional SFX, tag-driven browser
