details: |-
  24 performable vehicles including Aston Martin Rapide, Audi R8, Ferrari 348, Land Rover Defender, Tesla Model S, Harley Davidson, Ford F150, helicopters and aircraft. Standard: 630 samples, 284 presets, 4.9 GB sound effects. Full Tank: 2,689 samples, 284 presets, 75 GB sound effects library. Tag-driven browser. Apple Silicon native support. iLok account required.
specs: |-
  Mac: macOS 10.13+, Apple Silicon native support. Windows: 10 64-bit+. CPU: 2.4 GHz minimum. RAM: 4 GB minimum. Sample rates: 44.1 kHz to 192 kHz. 64-bit only. Supported DAWs: Pro Tools 11+, Logic Pro X, Nuendo 8.2.10+, Cubase, Reaper, Ableton Live 10+.
