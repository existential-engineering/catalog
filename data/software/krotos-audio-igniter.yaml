description: Igniter is the industry-standard vehicle sound design system — a one-stop solution for designing, performing, and automating vehicle sound effects directly within your DAW. It enables rapid creation of sounds for everyday vehicles, sports cars, motorbikes, planes, helicopters, spacecraft, drones, and more using a hybrid engine combining Granular, Synth, One Shot, and Loop modules. Features MIDI performability for real-time automation, Doppler effect processing, convolution reverb with custom IR support, perspective mixing, loop sequencing, electric vehicle presets, and foley integration.
details: |-
  630 samples, 24 performable vehicles, 284 presets, 4.9 GB additional sound effects. Tag-driven browser. Recorded vehicles include Aston Martin Rapide, Audi R8, Ferrari 348, Land Rover Defender, Subaru Impreza, BMW i3, Tesla Model S P85D, Toyota Chaser, Dacia 1310, U650M Tractor, Mercedes Actros, Bucker BU 131, de Havilland Tiger Moth, Honda Civic, Subaru Crosstrek SUV, Ford F150, Harley Davidson 99 Hog, Porsche Carrera, Tires, Huey UH-1H, Agusta Westland 119x, CH-47D Chinook, Cessna 560XL. 10-day free demo available. Activation via iLok account (free registration required; no dongle required).
specs: |-
  macOS 10.13+, Windows 10 64-bit+. AAX Native, VST, AU (64-bit only). Min CPU: 2.4 GHz. Min RAM: 4 GB. Sample rates: 44.1–192 kHz. iLok account required. Perpetual license.
