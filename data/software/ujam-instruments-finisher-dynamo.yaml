description: Finisher DYNAMO is a powerful multi-effect plug-in for instant inspiration that will add unique movement and groove to your tracks.
details: |-
  With Finisher DYNAMO the journey runs through animated soundscapes and surreal vibes beyond the realm of the ordinary. Every Finisher FX plug-in is designed to deliver the power and flexibility of a full rack of audio processors and effects with the instant gratification that UJAM products are known for.

  There is so much going on under the hood that it is often hard to predict what will happen when a knob is turned in DYNAMO, which is a large part of its appeal.

  DYNAMO is all about moving sounds. A rhythmical pattern is selected to suit the production, from a 5-pattern rhythm selector, alongside a tone control and two variable FX controls.

  The Variation knobs adjust musically useful aspects of the current Mode, for example switching modulation rates, setting EQ characteristics or changing distortion curves, often at the same time.
specs: |-
  - 50 versatile multi-effect modes
  - 290+ presets pre-categorized to maximize workflow and productivity
  - 5-pattern rhythm selector, tone control and 2 variable FX controls
  - Variation knobs that change modulation rates, EQ characteristics and distortion curves
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Windows: Windows 10 to Windows 11
  - Mac: macOS Catalina (10.15) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 0.9 GB of disk space
  - 1280x768px display, internet connection
  - Delivery: automated installation via UJAM App, or downloadable installer file
  - Authorization via the UJAM App, or email and password within the plug-in
