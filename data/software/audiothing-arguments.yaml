description: Arguments is a vintage-style test equipment plugin for tone
  generation and dual audio processing. VST, AU, AAX, CLAP, iOS (AUv3,
  Standalone)
details: |-
  Arguments is a vintage-style test equipment plugin for tone generation and dual audio processing. It takes two signals and smashes them together using math derived from analog nuclear research processors. The results are dynamic, often unpredictable but always unique. Since each part of Arguments can run independently, it also works as a sonically rich test tone generator, as a complex distortion unit, or as a multimode filter. Arguments open nature rewards exploration, the presets are a mere suggestion for you to jump off from.

  At its core Arguments is an analog computing-based combiner and integrator of signals, re-tuned from science to musical use. These instruments were used in analog nuclear instrumentation modular racks (NIM BIN) to allow for quick calculations without employing a dedicated computer. Arguments takes two signals A and B (B is either external via side-chain or from the internal generator) and puts them together using the argument block. The result is then put through a function block that processes it.

  This creates a wide range of tones, from simple boosting to high-passed industrial grit, from rhythmic modulations to raw textures. A multi-mode filter stage then allows for exact shaping and modulation. AudioThing employed analog modeling at every stage to make Arguments sound not like a calculator but like the rare vintage units that inspired it.

  Oversampling is a sonic shaping tool. Due to the high internal gain of the plugin, you can get extreme sounds fast. If you tune the oversampling you will hear fizzling high-end frequencies appear the lower you go. If you are into industrial fuzz and destruction, turn it off. By running the generator in LFO mode in time with a drum beat, you can shape the accent of it.

  Arguments was developed with Hainbach, a Berlin-based electro-acoustic composer who creates experimental music using esoteric synthesizers, test equipment and magnetic tape. It is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP), and on the App Store for iOS and iPadOS (AUv3 and Standalone).
