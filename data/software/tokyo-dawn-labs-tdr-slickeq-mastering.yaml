description: "A high-end stereophonic mastering equalizer specifically designed
  to support audio mastering workflows. Combines an intuitive interface with a
  staggering array of possibilities for professional audio processing."
details: |-
  Version 2.1.1. Six parametric filter bands for spectral control. Advanced low and high frequency exciters. Dedicated low-frequency mono filter. Meta Filter with brightness, hardness, and equal loudness controls. Smart Operations panel for spectrum matching and resonance detection. Loudness-compensated auto gain control. Real-time spectrum analyzer. A/B comparison, undo/redo, advanced preset management.
specs: |-
  Windows 7 or above. Mac OS X 10.9 or above. VST2, VST3, Audio-Unit, or AAX compatible plugin host. OpenGL support required. Windows 32-bit: VST2, VST3. Windows 64-bit: VST2, VST3, AAX. Mac 64-bit: VST2, VST3, AU, AAX.
