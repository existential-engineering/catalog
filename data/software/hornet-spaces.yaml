description: Spaces is a powerful algorithmic reverb VST plugin designed to simulate realistic rooms and enclosed spaces with a level of detail that sets it apart from traditional reverb plugins.
details: |-
  Spaces is an algorithmic reverb plugin that models a square room of arbitrary dimensions and proportions, letting you create realistic, natural-sounding reverberation for music, sound design and post-production work rather than selecting from a fixed library of impulse responses.

  At its core is a Digital Waveguide Network (DWN) engine that replicates how sound waves interact with the walls, ceiling and floor of a room, reproducing the reflections and resonances that naturally occur within an enclosed space and calculating how much diffusion results from each reflection. Because the reverb is computed in real time rather than convolved with a static impulse response, the room can be adjusted dynamically while you work.

  Room design centres on the interaction between height, width and length. Three preset room types, Small, Mid and Large, use acoustically optimized ratios between the dimensions that reduce unwanted resonances and phase problems, and adjusting the height slider automatically adjusts the other two to keep the preset's proportions. Custom Room Mode unlocks all three dimensions independently and displays the room's modal frequencies, the axial, tangential and oblique modes that shape the tonal and temporal character of the reverb, in real time as you change the geometry.

  Beyond the geometry, Spaces offers controls for reverberation length, reflections amount, frequency response for shaping the tonal balance of the tail, stereo width, and a processing quality setting that trades CPU usage against audio fidelity so the plugin suits both real-time tracking and mastering. The interface is compact, with easy-to-read sliders and real-time visual feedback for room modes in a style HoRNet jokingly calls a 23rd-century GUI.

  The plugin ships with 13 presets crafted by Simon Scholl, covering everything from intimate rooms to wide-open halls. It runs 64-bit on macOS 10.6 and above (Intel) and on Windows, in VST, AU and AAX formats.
specs: |-
  - Digital Waveguide Network (DWN) algorithm for real-time room simulation
  - Three fixed room proportions: Small, Mid and Large
  - Custom Room Mode for independent height, width and length control
  - Real-time display of room modes (axial, tangential, oblique)
  - Reverberation length control
  - Reflections amount control
  - Frequency response shaping of the reverb tail
  - Adjustable stereo width
  - Selectable processing quality (CPU usage versus audio fidelity)
  - 13 presets by Simon Scholl
  - 64-bit, macOS 10.6 and above (Intel) and Windows
