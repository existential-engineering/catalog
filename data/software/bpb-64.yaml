description: BPB 64 is a sample-based freeware commodore 64 virtual instrument
  for Windows and macOS.
details: |-
  A mssiah cartridge was used to program the synth patches and to trigger the
  sampled commodore 64 units via MIDI.

  Bpb 64 includes 37 presets, covering bass sounds, leads, pads, and authentic
  c64 arpeggios.

  The user interface features a filter, an adsr envelope, four built-in effects
  (chorus, reverb, delay, distortion), and modulation.
specs: |-
  - Sample-based virtual instrument
  - 37 presets
  - Low-pass filter
  - ADSR envelope
  - Chorus effect
  - Reverb effect
  - Delay effect
  - Distortion effect
  - Modulation
  - MIDI support
