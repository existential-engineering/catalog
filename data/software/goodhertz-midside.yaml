description: Midside is a professional M/S stereo imaging plugin by Goodhertz,
  designed after years of research on spatial audio and psychoacoustics. It
  offers expressive stereo width control with mid/side gain faders, tilt EQ,
  panning, encoding/decoding, and a dedicated Mono Below section for bass stereo
  management.
details: |-
  Though there are a lot of mid/side plugins on the market, all of them have failed to strike a perfect balance between simplicity and power. So we built our own: Midside.

  After years of research on spatial audio and psychoacoustics, as well hundreds of hours in the mastering room, Goodhertz has designed Midside to strike that elusive balance: a plugin powerful enough to be used on any stereo source; a plugin that gets to the point quickly, but doesn't skimp on the details; a plugin that accomplishes with just a handful of controls what other M/S plugins fail to accomplish with more than 50.

  The elegance of hardware inspired Midside's interface, the precision of software inspired its algorithms, and the power of stereo manipulation brought it to life. Easy-to-use. Beautiful-to-hear. One-of-a-kind.

  Like all our plugins, Midside was built to be automated and moved around (even the mute and solo buttons won't click or pop). Use it to manipulate space and depth; automate it to create more motion in your mixes or masters.

  The M/S microphone technique is extremely flexible and sounds great in lots of applications, but because of the complexity of creating an M/S recording in most DAWs, it's often incorrectly setup or avoided altogether. Before Midside, M/S recording required three audio tracks (M, S+, S-) plus a stereo bus; with Midside it is one stereo audio track, with Midside performing the M/S to L/R conversion.
specs: |-
  - High resolution M/S gain faders
  - Mid & side tilt EQ's, borrowed from Tiltshift
  - M/S mute & solo functionality
  - M/S panning
  - M/S encoding & decoding
  - Built-in metering
  - Stereo width modes: Width, the classic stereo width control
  - Stereo width modes: Natural, a natural sounding width control that uses everything we've learned about spatial audio and psychoacoustics
  - Stereo width modes: Shuffler A, B, C, expansive, spacious stereo shuffler capable of both widening or narrowing the low end
  - Stereo width modes: M/S Blend, directly blends between mid & side
  - Mono Below section makes stereo signals more mono below a certain frequency
  - Mono Below: Strength control dials in the right amount of mono-izing
  - Mono Below: Sweepable center frequency
  - Mono Below: Bass Makeup processing to maintain low end presence
  - Mono Below: Listen function to audition what you're filtering out
  - 1 page of advanced controls
  - Localized in English, Español, Português, Français, Italiano, Arabic, Korean, Japanese, Simplified Chinese and Traditional Chinese
  - 64-bit; requires a 64-bit DAW and macOS 10.13+ or Windows 10+
