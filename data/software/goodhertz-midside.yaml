description: "Mid/side audio processing plugin for expressive stereo imaging.
  Features mid/side gain control with high-resolution faders, stereo width
  manipulation through multiple modes (Width, Natural, Shuffler A/B/C, M/S
  Blend), independent mid and side tilt EQ processing, M/S encoding/decoding,
  M/S panning, and Mono Below feature to control bass stereo width below a
  specified frequency."
details: |-
  Mid/side gain control with high-resolution faders
  Multiple stereo width modes: Width, Natural, Shuffler A/B/C, M/S Blend
  Independent mid and side tilt EQ
  M/S encoding/decoding and mute/solo
  M/S panning
  Mono Below feature for bass stereo width control
  Built-in metering
