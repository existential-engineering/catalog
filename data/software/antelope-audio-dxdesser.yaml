description: "Tame harsh sibilance and sculpt clear, polished vocals with
  DXDesser, a de-essing native plugin by Antelope Audio."
details: |-
  DXDesser is a powerful native plugin for transparent, surgical control of sibilance and harsh high-frequency content in vocals, instruments, and full mixes. Built for clarity and speed, it delivers professional-grade results with intuitive control and visual precision.

  Sweep across a wide range — from 0.8 to 12 kHz — to isolate and reduce unwanted sibilance and sharp transients with exact precision.

  Control the intensity and behavior of processing using dedicated Threshold and Range parameters. Achieve subtle polish or aggressive reduction without compromising tone.

  Choose between three distinct operating modes: Wide-Band applies global reduction across the signal; Split-Band isolates high-frequency content for transparent control; Frequency Mode targets the offending band only.

  A built-in 0–15 ms look-ahead engine ensures smooth, preemptive gain reduction, preventing harsh peaks from slipping through. Waveform visualization, gain reduction metering, and output level monitoring let you see exactly how and where DXDesser is working — no guesswork.

  DXDesser is part of the Antelope Cosmos plugin collection (75+ native plugins) and can be tried free for 14 days via Antelope Cosmos.
specs: |-
  - Native de-essing plugin for vocals, instruments, and full mixes
  - Frequency sweep range: 0.8 kHz to 12 kHz for sibilance isolation
  - Dedicated Threshold and Range parameters for dynamic control
  - Three operating modes: Wide-Band, Split-Band, Frequency Mode
  - Built-in 0–15 ms look-ahead engine for preemptive gain reduction
  - Real-time waveform visualization, gain reduction metering, and output level monitoring
  - Runs natively in your DAW on macOS or Windows
  - Part of the Antelope Cosmos plugin collection (75+ native plugins)
