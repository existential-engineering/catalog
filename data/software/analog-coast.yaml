description: Analog Coast is a virtual analog synth built expressly for use in
  retrowave / synthwave tracks.
details: |-
  Features: gorgeous retro-inspired ui. 2 regular oscillators, with waveform
  selector (sine, sawtooth, square) with fine-tunable pitch controls. 1 sub
  oscillator (square wave). Lfo and mod-lfo. Chorus effect. Reverb effect. Delay
  effect.

  All parameters controllable via MIDI cc. MIDI polyphonic expression support.

  Available in multiple formats: mac: standalone app, 64-bit VST, 64-bit audio
  unit, 64-bit audio unit v3. Windows: standalone app, 32-bit and 64-bit VST.
specs: |-
  - Virtual analog synth
  - 2 regular oscillators
  - Waveform selector (sine, sawtooth, square)
  - Fine-tunable pitch controls
  - 1 sub oscillator (square wave)
  - LFO
  - Mod-LFO
  - Chorus effect
  - Reverb effect
  - Delay effect
  - MIDI cc control
  - MIDI polyphonic expression support
  - 64-bit VST (mac)
  - 64-bit Audio Unit (mac)
  - 64-bit Audio Unit v3 (mac)
  - 32-bit VST (Windows)
  - 64-bit VST (Windows)
  - Standalone app (mac)
  - Standalone app (Windows)
