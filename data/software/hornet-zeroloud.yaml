description: ZeroLoud is an intelligent maximizer that automatically hits your target LUFS. No more guessing, let ZeroLoud calculate gain and limiting.
details: |-
  You know that sinking feeling: your mix sounds incredible, but when you insert a maximizer to hit streaming loudness standards, everything falls apart. Too much gain and it's crushed and distorted. Too little and it's too quiet. You're stuck riding that impossible line between "loud enough" and "destroyed."

  Traditional limiters and maximizers force you to guess. You set threshold by ear, estimate makeup gain, pray the release time doesn't pump, and hope you land somewhere near -14 LUFS for Spotify or -9 LUFS for club play. Meanwhile, every track has different dynamics, and you're manually recalibrating every single time.

  ZeroLoud lets the maximizer analyze your audio and auto-calibrate everything for you. It analyzes your track, calculates the gain and limiting curve, and delivers your exact target LUFS, whether it's -14 for streaming, -9 for CD, or anything in between.

  The plugin runs a four-step guided workflow: Learning, where it records 10 seconds of the loudest section; Target Selection, where you choose the desired LUFS level; Analysis, where it calculates the optimal gain and limiting curve offline; and Application, where it processes in real time. Two fine-tuning controls follow, a TRIM adjusting input level by plus or minus 6 dB post-analysis, and a CEILING setting the maximum True Peak output from -6.0 to 0.0 dB.

  Complete LUFS metering shows Momentary (400 ms), Short-term (3 s) and Integrated values simultaneously, and automatic 2x oversampling for sample rates below 88.2 kHz keeps limiting transparent without aliasing.
specs: |-
  - Target loudness range: -30 to -5 LUFS
  - True Peak ceiling: -6.0 to 0.0 dB (adjustable)
  - TRIM control: plus or minus 6 dB post-analysis adjustment
  - LUFS metering: Momentary (400ms), Short-term (3s), Integrated
  - Analysis method: offline processing on a 10-second buffer
  - Oversampling: automatic 2x for sample rates below 88.2kHz
  - Formats: VST3, Audio Units (AU), AAX
  - macOS 10.13 (High Sierra) or later
  - Windows 10 or Windows 11
  - GPU-accelerated, scalable interface
  - Apple Silicon native
