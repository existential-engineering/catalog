details: >-
  Aurora dsp's absylon is a groundbreaking plugin designed specifically for
  guitarists venturing into the depths of extended range playing. Whether you
  wield a baritone, 7-string, or a low-tuned multiscale guitar, absylon excels
  at taming the unruly lows, delivering clarity and precision even in the most
  extreme tunings.


  At its core lies a meticulously modeled 200-watt guitar/bass amplifier,
  capable of effortlessly handling the crushing weight of an 8-string guitar
  tuned to e, providing a foundation for truly monstrous tones.


  The intuitive 4-knob tone stack provides comprehensive control over your eq,
  while the "grind mode" adds a layer of aggressive saturation for devastating
  riffs. A built-in noise gate ensures your signal remains tight and focused,
  eliminating unwanted noise and feedback.


  The plugin also includes an ir mixer with two meticulously crafted impulse
  responses specifically tailored for low tunings, allowing you to shape your
  cabinet sound with precision.


  For those who demand absolute rhythmic accuracy, absylon features a built-in
  metronome, and a riff recorder allows you to capture your ideas on the fly.
