details: |-
  The fulltone collection for amplitube for mac/pc brings guitarists and all musicians an essential palette of sounds that span from the most classic tones from the past to more modern "waves".

  Guitarist michael fuller founded fulltone back in 1991, with the aim of building stompboxes that sounded as good as vintage pedals, but that were more rugged and reliable than the old, often fragile classics.

  Today, fulltone is recognized as being one of the most committed and scrupulous manufacturers worldwide and ik multimedia teamed up with them to bring you the finest recreations of 3 select effects you can now use directly in amplitube for mac/pc.

  Amplitube fulltone by ik multimedia is a virtual effect audio plugin and a software application for macos and windows. It functions as a VST plugin, an audio units plugin, a VST 3 plugin, an AAX plugin and a standalone application.

  Windows (64-bits) minimal: intel core 2 duo or amd athlon 64 x2, 2gb of ram (4 gb suggested), windows 7, windows 8 or windows 10. Requires an asio compatible sound card. Supported plug-in formats (64-bit): VST 2, VST 3, AAX. Mac (64-bits) minimal: intel core 2 duo, 2 gb of ram (4 gb suggested), mac os x 10.7 or later. Supported plug-in formats (64-bit): audio units, VST 2, VST 3, AAX. Internet connection is required as all of the custom shop operations are web based.
