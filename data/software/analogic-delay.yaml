details: |-
  Features: tape model including tape saturation, wow & flutter, low and high
  pass filtering, smooth parameter for continuous delay time changes like on a
  real tape delay.

  MIDI learn: each control can be automated via MIDI controllers. The default
  assignment of MIDI controllers is documented in the pop-up hints. To assign a
  different controller right-click on a control then choose "learn" from the
  pop-up menu and twiggle the hardware controller you want to assign.
  Alternatively choose "unlearn" or "edit.." to assign a controller from a list.

  You can delay by the four set note timings and you can choose between normal
  notes, or their appropriate diminished and extended versions.

  It does automate wonderfully and provides a booming, evolving filtered delay
  with amazing morphing capabilities.
specs: |-
  - Tape model with tape saturation
  - Wow & flutter
  - Low and high pass filtering
  - Smooth parameter for continuous delay time changes
  - MIDI learn
  - MIDI controller automation
  - Windows compatible
