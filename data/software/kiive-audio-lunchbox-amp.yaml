details: |-
  The Lunchbox Amp Sim is a recreation of one of the most notable british valve amps from the 1960's. The Lunchbox Amp Sim offers tube amp like tones as well as three factory picked cab impulse responses. it also includes drive, delay, and reverb pedals. Take your guitar tones from sparkly and jangly indie rock tones or drive your signal with the included overdrive pedal and get some intense rock and hardcore tones!
