details: |-
  Cableguys and electronic music pioneer bt bring the art of drum layering into one fast, focused effect.

  Snapback detects each hit, layering new samples on top in perfect time.

  Explore 200+ mix-ready transient and snapback layers from bt, goldbaby, virtual riot and cyclick.

  New for snapback v1.1, a handy reverse button flips the play direction of any imported sample.

  Works with ableton live, logic pro, pro tools, cubase, bitwig studio, fl studio, reaper, studio one, and many other daws that support VST, AU or AAX.
