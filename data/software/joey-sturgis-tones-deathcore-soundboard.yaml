details: |-
  The Deathcore Soundboard is a sample-triggering instrument plugin from Joey Sturgis Tones and Drumforge that provides ready-to-use deathcore vocal phrases for metal and heavy productions.

  It includes 16 signature phrases performed by the vocalists of Face Yourself. Samples are triggered within a session via MIDI notes or automation lanes, letting producers place vocal hits into breakdowns and riffs.

  The plugin runs as a VST3, AU (macOS), or AAX instrument in any compatible DAW.
specs: |-
  - 16 signature deathcore vocal phrases from the vocalists of Face Yourself
  - Triggered via MIDI or automation lanes
  - VST3, AU (macOS), and AAX formats
  - Windows 7 or above (64-bit)
  - macOS 10.14 or above (Intel or Apple Silicon, 64-bit)
