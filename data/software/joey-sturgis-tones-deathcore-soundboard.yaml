details: |-
  THIS PLUGIN STARTED AS AN APRIL FOOLS’ JOKE… BUT IT’S 100% REAL.
  Meet the Deathcore Soundboard by Joey Sturgis Tones & Drumforge. It's your new go-to for crushing vocal parts without the usual hassle, drama, or scheduling nightmares.
  Why We Built It
  Recording real vocalists can be a grind. You’ve got scheduling conflicts, unpredictable attitudes, and endless debates over how a proper “BLEGH” should sound. Multiply that by a thousand takes, and you might not finish before your deadlines.
  We decided enough was enough. The Deathcore Soundboard recreates the authenticity of a seasoned deathcore vocalist so convincingly that even we sometimes forget it’s software.
  The Ultimate Replacement
  Tired of:
  Trying to coax memorable performances out of lackluster vocalists?
  Struggling with late calls, blown-out voices, and endless retakes?
  Wasting time comping and tweaking for that perfect “BLEGH”?
  Stop compromising. Load the Deathcore Soundboard in your session, trigger brutal vocals at will, and slash production time. The plugin includes 16 signature phrases from the vocalists of Face Yourself, ready to drop into any breakdown or riff with a click.
  Bonus: It never forgets its lines, never shows up late, and definitely won’t storm out if you want a 0.5 dB change.
  And that's not all, get INSTANT reactions from your favorite Reaction Channels from the likes of Ohrion Reacts, ElderEmunk, Matt&Camryn React, and even Dave's Mom!
  How to Use
  Open the Plugin: Go to your VST Instruments and open Deathcore Soundboard.
  Trigger the Samples: As the session runs, choose from the plugin’s range of deathcore vocal lines to fit your track via midi or automation lanes.
  Enjoy the Free Time: Notice how quickly your session comes together. No warming up, no re-takes, no wasted hours, tons of BLEGH!
  Finalize Your Mix: Export before your vocalist shows up, demanding to know why you don’t need them anymore (we won’t judge).
  What You Get
  Audio Plugin: No drama, just reliable deathcore vocals.
specs: |-
  System Requirements
  Frustration with Vocalists: Must be at your wit’s end.
  Mac or Windows (64-bit): Compatible with major DAWs that support VST3, AU (macOS), and AAX.
  Basic Mouse Skills: Point and click your way to brutality.
  Sense of Humor: This plugin doesn’t take itself too seriously (but it still sounds ferocious).
  Supported OS
  Windows 7 or above (64-bit): VST3, AAX
  macOS 10.14 or above (Intel or M-Series, 64-bit): VST3, AU, AAX
  Linux: Maybe someday. Maybe not.
  Disclaimer: It’s not compatible with real vocalists... by design.
  Known Issues
  Might accidentally spawn a mosh pit in your control room.
  Neighbors could call the cops if “BLEGH” loops at 2 AM.
  Unexplained boost in production speed reported by multiple users.
  Plugin has an odd love for crabcore on Thursdays (we’re looking into it).
