description: TAL-U-No-62 is a polyphonic virtual analogue synthesizer plugin
  modeled after the Roland JUNO 60, featuring its characteristic oscillators and
  filters. It supports self-resonance, envelope and LFO modulation on the
  filter, keyboard tracking, and a non-resonant highpass filter.
details: |-
  TAL-U-No-62 is a polyphonic virtual analogue synthesizer plugin. An original JUNO 60 is used as reference for the oscillators and filters, making it a faithful software emulation of the classic Roland synthesizer.

  Like the original JUNO 60, the plugin is capable of self-resonance, which means it can be used to some degree as a tone generator even without external audio input.

  The filter section features controls for envelope amount and polarity, LFO modulation, and keyboard tracking. A non-resonant highpass filter is also provided to thin out lower frequencies.

  Available downloads include 32-bit and 64-bit VST versions for Windows, as well as 32-bit VST and AU versions for macOS. Requirements are Windows XP or higher and macOS 10.6 up to (but not including) 10.10 with a 32-bit host.
