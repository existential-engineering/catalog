description: Software recreation of the 1975 AXXE analogue synthesizer with
  modern enhancements, featuring X-Modifier technology and over 350 presets.
details: |-
  GForce AXXESS is a quick way to get stunning results in your production and it is a master at bass. It has a fantastic giant sound and a super fun sequencer that will surprise you. Thanks to our unique X-Modifiers, you can also go much deeper. They make it quicker to program complex sounds. AXXESS lends itself superbly to Electronica, Cinematic, Synthpop, Dance, Ambient, Rock, Prog Rock, Hip Hop and more.

  AXXESS retains the warm analogue sound and fundamental architecture at the heart of the original 1975 AXXE, but builds on it in ways that extend its sonic and musical capabilities. This emulation of the famous synth is the sibling of our award-winning Oddity3 and inherited its character.

  AXXESS features an efficient Preset Browser, over 350 new presets, a new sub-oscillator, an arpeggiator and a straightforward 16-step sequencer, biting distortion, analogue delay and luscious Reverb effects, a Vintage control to add authentic analogue imperfections, velocity to filter and VCA for expressivity and a fully scalable UI design.

  Using our unique X-Modifier technology, users can reach new sonic heights with AXXESS. With an independent LFO and Envelope for almost every parameter on the synth, AXXESS allows you to create hugely complex sounds. And, while the tone and character of the synth remain authentic to the original, the X-Modifiers allow you to take this classic sound to unexplored realms of possibility. AXXESS is the AXXE sound on steroids.

  AXXESS features our brand-new preset browser, which gives you the power to organise your sounds how you want. With extensive tagging, sorting and search possibilities, finding the presets you want is quick and easy. We’ve included more than 350 production-ready presets, enlisting an array of diverse sound designers and artists, including Zardonic, GEOsynths, Christian Lafitte, Richard Veenstra and Ramon Kerstens (K/V), Jordan Passmore, Plughugger, Sonic Space Lab, Alex Ball, Dave Spiers, Tom Wolfe, Graeme Rawson, Boudicca’s Bass Service and more.
