description: Software recreation of the 1975 AXXE analogue synthesizer with modern enhancements, featuring X-Modifier technology and over 350 presets.
details: |-
  AXXESS is a faithful software recreation of the 1975 classic AXXE analogue synthesizer, retaining its warm analogue sound and fundamental architecture while extending its sonic capabilities. Described as "fat, gnarly and flexible," it excels at bass synthesis and beyond.

  X-Modifier technology provides an independent LFO and Envelope for nearly every parameter, making it one of the most powerful and flexible virtual synthesizers available. Multiple play modes include polyphonic, monophonic, mono legato, and unison with pan spread for stereo width.

  The instrument ships with over 350 presets crafted by diverse sound designers, covering everything from classic analogue tones to modern textures. A built-in 16-step sequencer with record function and arpeggiator open up rhythmic and melodic possibilities, while onboard effects — distortion, analogue stereo delay, and matrix reverb — complete the signal chain. A Vintage knob introduces analogue imperfections for added realism.
specs: |-
