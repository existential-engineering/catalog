  - Formats (Windows): Standalone, VST2, VST3, AAX
  - Mac requirements: macOS 10.13 or later, Intel or Apple Silicon
  - Windows requirements: 2 GHz CPU, 2 GB RAM, Windows 7 or later
  - Presets: 350+
  - Sequencer: 16-step with record function
  - Play modes: Polyphonic, Monophonic, Mono Legato, Unison
  - Effects: Distortion, stereo delay, matrix reverb
  - UI: Fully scalable
