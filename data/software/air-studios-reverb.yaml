description: AIR Studios Reverb is a groundbreaking convolution reverb plugin
  that brings the legendary acoustics of London's air studios lyndhurst hall
details: |-
  Spitfire audio's revolutionary virtual positioning technology (vpt) allows you
  to position your sound source anywhere within the lyndhurst hall, capturing
  the precise ambience and reflections from every angle. This level of control
  gives you unprecedented freedom to shape your reverb experience and create
  unique sonic spaces.

  Ultra-detailed convolution reverb: air studios reverb captures the nuances of
  the lyndhurst hall with incredible accuracy, thanks to thousands of
  meticulously recorded impulse responses. Virtual positioning technology:
  position your sound source anywhere within the hall, adjusting its distance,
  angle, and orientation to create a truly immersive experience. Customizable
  hall settings: tailor the acoustics of the hall with adjustable parameters
  like canopy height, canopy material, and gallery damping.

  Air studios reverb is a virtual effect audio plugin for macos and windows. It
  functions as a VST plugin, an audio units plugin, a VST 3 plugin and an AAX
  plugin.

  Whether you're composing, mixing, or mastering, air studios reverb offers a
  powerful and versatile tool for adding depth, dimension, and richness to your
  tracks.
specs: |-
