details: |-
  ACID Music Studio helps you get started in loop-based music production. It's
  easy: simply drop a beat on the timeline and begin. The software accomplishes
  tasks normally carried out by a professional, so you can concentrate fully on
  making music.

  Acid music studio accompanies you every step of the way. Compose, edit and mix
  your tracks like a pro in minutes with the help of integrated tutorials.

  Highlights: new! Modern gui. New! 64-bit version. New! Professional virtual
  instruments. New! Professional effects plug-ins. New! Fresh acidized loops.

  For microsoft windows 7 8 10 32-bit and 64-bit systems. All magix programs are
  developed with user-friendliness in mind so that all the basic features run
  smoothly and can be fully controlled, even on low-performance computers.

