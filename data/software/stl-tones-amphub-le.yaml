description: "AmpHub LE is a powerful guitar plugin offering a vast library of
  stompboxes, amps, cabs, mics, and effects, all within a user-friendly
  interface that puts incredible tone right at your fingertips. Powered by
  revolutionary simulation technology, AmpHub LE delivers unparalleled analog
  modeling, making it the most realistic and accurate amplifier emulation plugin
  on the market. Exclusively available to eligible Focusrite and Novation
  hardware owners, AmpHub LE includes three amps, four stompboxes, three
  cabinets, and six classic effects. It’s available in 64-bit VST3, VST2, AU,
  AAX, and standalone plugin formats."
