description: Lexicon PCM Native Chorus plug-in delivers the rich, lush,
  shimmering chorus effect that has been a mainstay of professional studios for
  decades.
details: |-
  A beautiful, subtle chorus effect can be the difference between 'magic' and just another part. The PCM Native Chorus is the sound that gets you there. It's been a mainstay of professional studios for decades and when you use this plug-in, you'll hear why.

  The chorus effect emulates the sound of multiple instruments of the same type, or multiple singers, performing in unison. Chorus is used to thicken a sound and create movement. The Lexicon Chorus algorithm brings this rich, lush, shimmering effect to life.

  By using shorter delay times and introducing feedback, the Chorus algorithm can also generate flanging effects. The Chorus plug-in can be very effectively used on vocals, guitar, and any other instruments which have inherently long sustain.

  PCM Native Chorus is available individually and as part of the PCM Native Effects Plug-In Bundle. The plug-in is marked Discontinued on the Lexicon Pro site; the final release was version 1.2.6 (August 2016) with Intel Mac and Windows installers.
specs: |-
  - Lexicon Chorus algorithm
  - Capable of generating flanging effects via short delay times and feedback
  - Designed for vocals, guitar, and instruments with long sustain
  - Part of the PCM Native Effects Plug-In Bundle
