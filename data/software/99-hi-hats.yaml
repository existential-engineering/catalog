details: |-
  The hi hats recorded were a healthy blend of everything from modern classics like zildjian k's to boutique rarities from the 40s. Synthetic hi hats originate from a modded roland 808, 909, korg ms-10, nord lead 2x, cr-78, el. Machinedrum and many more...

  Every hi hat is partnered with its open hi hat sample, so creating smooth patterns is a breeze. All the sounds were processed with high end analog gear: neve 1073, rca ba6a, pulse tech eqp1a3, chandler zener, ampex 102, shadow hills mc, sontec 432c, retro sta-level + 2a3, tube tech cl1-b, ssl e-series, rockrpel, culture vulture, ams rmx16, bricasti m7 + more...

  Monitored on adam s3x mastering speakers to make sure the sounds cut through but never feel harsh or brittle. 99 hi hats with unique character. Wav files at 96 khz and 44.1 khz 24-bit.

  Healthy amounts of headroom (no limiting or grainy over-eqing) every closed hi hat partnered with open. 100% unique source sounds created by the engineers at six bit deep (no sampling)
