description: Vintage compressor. The bt compressor fa770 provides the operation
  and sound of highly coveted analog limiters.
details: |-
  The bt compressor fa770 provides the operation and sound of highly coveted
  analog limiters. The fa770 is designed with a fixed-ratio and time constant
  switch as part of its characteristic vintage sound.

  This model proves that you do not need many knobs and sliders to achieve the
  great compression sound of the fa770. Adjust the threshold, maybe the time
  constant to adjust the speed, and there you have it.

  Blue tubes limiter fa770 by nomad factory is a virtual effect audio plugin for
  macos and windows. It functions as a VST plugin, an audio units plugin and an
  AAX plugin.

  System requirements include pentium iv 2ghz / athlon xp 2ghz with 1gb of ram
  for windows (7, xp, vista supported in 32-bit and 64-bit), and macintosh intel
  core solo 1.5ghz with 1gb of ram for mac os x 10.5 leopard and mac os x 10.6
  snow leopard on compatible intel macs.
specs: |-
  - Fixed-ratio compression
  - Time constant switch
  - Threshold control
  - macOS compatible
  - Windows compatible
