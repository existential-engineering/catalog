description: Angus 404 models the Aengus 404, the eight-band graphic equalizer
  that Aengus built in the 1970s in the 500-series format. It captures the way
  the bands interact and the harmonic richness and saturation the filters add
  when they are driven.
details: |-
  Angus 404 models the Aengus 404, an eight-band graphic equalizer built by Aengus in the 1970s. Steve Crump designed the 404 with input from Bill Riseman, and a graphic EQ in the 500-series format was a new idea at the time, with the 404 arriving before API's own 560. It breaks up earlier than other graphic EQs, and that is a crucial part of its sound.

  Aengus began in Massachusetts in the early 1970s, when engineer Bill Riseman and an artist he was working with bought one of the last consoles made by the original API, a set of input modules with no frame, center section or patchbay that an API employee helped them finish. Over the course of four years Aengus built somewhere between 20 and 30 consoles, for rooms including Long View Farm and Indigo Ranch in Malibu, and Strawberry Studios in the UK built two 404s into almost every console they made.

  Each of the eight bands, at 50 Hz, 100 Hz, 220 Hz, 500 Hz, 1 kHz, 2.2 kHz, 5 kHz and 10 kHz, has twelve stepped settings from -12 dB to +15 dB. The plug-in captures the real response of the original, including the way neighboring bands overlap and interact, so a nominal 2 dB step is more of a guideline than a rule. A band is broad at gentle settings and narrows as it is boosted or cut harder.

  Drive is level-compensated, pushing the saturation harder or backing it off while the EQ curve and levels stay where they were set, and it can be automated to dig into a hard-driven passage and ease back for cleaner lines. Input and Output gain, each ±24 dB, set how hard the processor is hit and what the next processor in the chain receives.

  On a stereo track Angus 404 runs as L/R, R/L or Mono, or in M/S, where the mid and the side each get their own eight bands. Because the saturation works on the mid and the side as well, M/S allows the center of a mix to be driven differently from its edges.
specs: |-
  - Eight stepped bands at 50 Hz, 100 Hz, 220 Hz, 500 Hz, 1 kHz, 2.2 kHz, 5 kHz and 10 kHz, each from -12 to +15 dB
  - The real response of the original, band interaction included, with a bandwidth that narrows on harder boosts and cuts
  - Drive, level-compensated, to push the saturation while the EQ curve and levels stay put
  - Input and Output gain, each ±24 dB
  - L/R, R/L, Mono and M/S channel modes, with separate eight bands for mid and side in M/S
  - MH Preset Manager provides cross-platform presets
