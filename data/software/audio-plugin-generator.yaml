url: https://audioplugingenerator.com/
description: Audio Plugin Generator is a prototyping tool for audio algorithms,
  allowing you to create VST plugins within minutes.
details: |-
  Plugins are generated in an automated process from simulink models, which
  enables dsp engineers to develop algorithms using a clean and easily
  understandable representation.

  The generated VST plugin gives access to parameters and signals of the
  underlying model. This means that parameters can be tuned in real-time and
  signals can be analyzed graphically.

  Signals can be logged to a file, which can be used for offline analysis and
  easy creation of test cases.
specs: |-
  - VST plugin generation
  - Simulink model support
  - Real-time parameter tuning
  - Graphical signal analysis
  - Signal logging to file
  - Windows xp or Windows 7 compatible
  - Matlab with simulink required
  - Dsp system toolbox required
  - Real-time workshop or simulink coder required
  - Visual studio 2008 or 2010 or visual studio express required
  - VST plugin host required
