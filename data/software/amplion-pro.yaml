details: |-
  Standalone application for guitarist's live performance and a plug-in module
  for any DAW. Amplion turns your computer into an ultimate guitar stack. Use it
  in standalone mode for playing live, learning and rehearsing or as a plug-in
  module to enhance your guitar tracks.

  Amplion features ultra-precise simulation of 9 guitar preamps, 7 power amps,
  12 speakers, 8 microphones and 30 effects deliver extra wide variety of unique
  guitar sounds.

  Amplion's advanced track player lets you play along with your favorite artists
  and learn their songs. Speed control allows you to slow down, if you can't
  make it, or even speed up. Built in recorder will keep every new riff safe.
  Record dry guitar sound, processed or even mix with the track player.

  Amplion can be used as a plug-in module for host applications. That makes
  recording guitar so easy. Forget about miking your (hardware) amp. Just record
  clean guitar signal an decide what sound suits your record best while mixing.

  There's no need to move around heavy guitar stacks for every show. Simply take
  your laptop with amplion installed and use it instead. Amplion can be easily
  controlled by any MIDI controller. In addition live mode offers simplified
  view of presets for live playing.
