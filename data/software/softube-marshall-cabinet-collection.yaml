description: The only officially licensed collection of cab simulator plugins
  from Marshall. It's an Amp Room Expansion that features 8 cabs with many
  microphone options for each one.
details: |-
  Marshall Cabinet Collection gives you eight classic, rare, hand-wired Marshall speaker cabinets exclusive to Softube's pro audio guitar and bass platform Amp Room.

  These cabinets are versatile enough for any style or genre of music, from vintage to modern, and feature seven classic moveable microphones. Use a cab with any amplifier in Amp Room or put multiples of the same cabinet in parallel to create bespoke combos.

  The collection spans 4x12", 2x12" and 1x12" enclosures: the 300W 1960B straight cab in black tolex, the 280W 1960BV vintage cab combining the 1960 enclosure with the aural characteristics of a 1982 model, the 100W G12M-25 Greenback-powered 1960AX, and the hand-wired 120W 1960HW for a 60s retro sound that also suits modern high-gain use.

  Smaller cabs cover the rest of the range: the 150W 1936 2x12" with two G12T-75 Vintage speakers for a softened high-end and higher gain tones, the 140W 1936V 2x12" with two G12 Vintage speakers for classic Marshall tones, the 150W 1912 1x12" with a G12B-150 speaker that suits bass as well as guitar, and the hand-soldered 20W 1974CX 1x12" Open Back with a single 12" G12M-20 Greenback.

  Every cab ships with a wide variety of mix-ready microphone options so a usable sound is available quickly, and the whole collection is officially licensed and endorsed by Marshall Amplification.
specs: |-
  - Versatile collection of eight cabs with seven microphone options
  - Exclusively for Amp Room, the pro audio guitar and bass platform
  - Officially licensed and endorsed by Marshall Amplification
