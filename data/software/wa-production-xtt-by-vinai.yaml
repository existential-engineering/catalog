description: XTT is a five-band multiband compressor and mastering plugin developed with production duo VINAI, combining upward and downward compression with per-band surgical shaping. It adds a brickwall limiter, linkable input and output faders for gain staging, and a real-time frequency display.
details: |-
  XTT is a compression plugin created by W. A. Production in collaboration with Italian production duo VINAI, brothers Alessandro and Andrea Vinai, who are signed to Spinnin' Records. It took over a year to develop and packages the processing chains the duo use on their own productions into a single plugin.

  The five-band compressor passes audio through low, low-mid, mid, mid-high and high bands, each with an adjustable crossover, threshold level and make-up gain dial. Threshold levels and crossover points can be dragged directly while a real-time frequency analyser shows the result. Each of the five bands also has an optional surgical shaping section carrying solo, mute, RMS, attack, release and a mid / side tilt.

  Upward and downward compression have independent controls and can be dialled in at the same time, up to 200 percent. That allows corrective work such as balancing vocal levels or clamping drum transients while simultaneously raising room ambience, as well as creative use that emphasises transients or builds room tone. A Time dial scales the attack and release times of all five bands together, which is useful for previewing before the per-band values are set.

  A built-in brickwall limiter adds saturation to the signal without introducing unwanted distortion, and its behaviour is set with an adjustable Boost control. The input and output faders can be linked so the signal entering the plugin can be trimmed while the output volume stays under control, with meters showing the incoming and outgoing levels.

  The bypass is smoothed to stay free of clicks and pops for A/B testing, and a central Mix control blends the compressed signal with the original audio for parallel compression. Factory presets cover everything from subtle shaping to heavily saturated compression, and user settings can be saved.
specs: |-
  - Designed in collaboration with VINAI
  - Upward and downward multiband compression with surgical shaping
  - 5 adjustable frequency bands with threshold and make-up gain
  - Per-band shaping controls: RMS, attack / release, mid / side
  - Linked input and output faders for gain staging
  - Scalable Time dial for attack and release across all bands
  - Transparent brickwall limiter with adjustable Boost
  - Real-time frequency display
  - Central Mix control for parallel compression
  - Click free and pop free bypass
  - Factory presets
  - PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
