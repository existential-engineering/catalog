description: Own the sound of Console 1 Mixing System's Core Vintage equalizer
  as a standalone equalizer plugin. A smooth and musical plugin it is excellent
  for balancing the mix and gives you broad brushstrokes coloring.
details: |-
  The Core Vintage equalizer was created as the counterpart to the Core Modern equalizer in Softube's Console 1 Mixing System. Now, you can own it outside the mixing system as a smooth and musical standalone EQ plug-in.

  Excellent for balancing the mix and giving it the right feeling, Core Vintage is designed for use with a modern-style EQ. Loading Core Vintage Equalizers into the Equalizers plug-in gives you both broad brushstrokes coloring plus precision and control in a streamlined workflow.

  Core Vintage is a passive parallel equalizer. This means the band interaction differs from modern solid-state equalizers. Many engineers find that, because of that, parallel equalizers are more musical and vibey, albeit a bit quirkier.

  The Core Vintage Equalizer is made to be musical. If it seems like the bands' default Q values are super wide, that's by design. All the bands cover a full frequency range, and the idea is to use the Gain controls to broadly shape the sound without having to touch the Frequency or Q knobs.

  The strange shape of the low shelving band is an artifact of the parallel design. If you boost the low shelf, you'll see a dip above the boost frequency. That is quite typical for this type of design, and it results in a very musical emphasis of the low frequencies.
specs: |-
