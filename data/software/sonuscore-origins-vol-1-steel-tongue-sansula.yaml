description: Meld into rich and diverse sonic landscapes with the soft, but rich sound of the Sansula, an recent advancement of the Kalimba, and the percussive sound of the Steel Tongue Drum.
details: |-
  ORIGINS VOL.1: STEEL TONGUE & SANSULA is the first installment of the Sonuscore ORIGINS series, a line of instruments developed by the team at Dynamedion. The Sansula is a recent advancement of the Kalimba, which has its roots in traditional African music: played by plucking metal tines attached to a membrane, it has a soft but rich sound. The Steel Tongue Drum is a modern instrument played with mallets or by hand, and its percussive sound forms the perfect pendant to the Sansula.

  The two instruments are combined in the Multi-Arpeggio-Designer (MAD), the centerpiece of every Origins instrument. Two fully customizable arpeggiators create interlocking patterns and broad soundscapes by combining the unique timbres of the two instruments, with an engine designed to convey a musically meaningful, human performance instead of a computer randomly aligning notes.

  Over 80 inspiring presets are included as a starting point, and arpeggio designs can be copied and pasted between different ORIGINS instruments. The Colors menu adds 12 individual color presets, each radically different in character and incorporating various effect settings and multiple impulse responses; combined freely with the MAD presets these yield over 900 predefined combinations.
specs: |-
  - Two individually playable instruments: Steel Tongue Drum and Sansula
  - Innovative Multi-Arpeggio-Designer (MAD) with two fully customizable arpeggiators
  - 80+ rhythm presets
  - 12 unique color settings, over 900 predefined MAD/color combinations
  - Arpeggio designs can be copied between different ORIGINS instruments
  - Full customization of all controls
  - Requires the FULL version of Native Instruments KONTAKT 5.5.1.451 or higher (the free Kontakt Player runs the instrument in demo mode only)
  - Mac OS X 10.8 or higher, Intel Core 2 Duo
  - Windows 7 or higher, Intel Core 2 Duo or AMD Athlon 64 X2
  - 4 GB RAM
  - At least 300 MB of free hard disc space
  - Delivered as download
