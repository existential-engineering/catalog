description: Meld into rich and diverse sonic landscapes with the soft, but rich sound of the Sansula, an recent advancement of the Kalimba, and the percussive sound of the Steel Tongue Drum. Two individually playable instruments combine within the Multi-Arpeggio-Designer (MAD) framework for interlocking pattern creation.
specs: |-
  - Requires full version of Native Instruments Kontakt 5.5.1.451 or higher (Kontakt Player runs in demo mode only)
  - OS: Mac OSX 10.8+, Intel Core 2 Duo; Windows 7+, Intel Core 2 Duo or AMD Athlon 64 X2
  - RAM: 4GB minimum
  - Storage: 300MB free space
  - Two individually playable instruments (Sansula + Steel Tongue Drum)
  - Multi-Arpeggio-Designer (MAD) engine with interlocking pattern creation
  - 80+ rhythm presets
  - 12 unique color settings with customizable effects
  - 900+ predefined combinations (MAD presets × color settings)
  - Arpeggio design portable across Origins series products
