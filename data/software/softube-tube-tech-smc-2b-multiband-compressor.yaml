details: |-
  From the company that brought you Tube-Tech CL 1B, PE 1C, and ME 1B plug-ins, ladies and gentlemen, feast your eyes and ears on the one-and-only Tube-Tech SMC 2B Multiband Compressor. Well-known for its remarkable high fidelity and extreme versatility, the SMC 2B is the choice of top engineers, producers, studios, and mastering houses worldwide.

  Softube accurately modeled every component and stage of this supernatural three-band opto compressor and outfitted it with modern features. Get the flexibility and fidelity you've been missing for your dynamic processing tasks, mix buses, and vocal, drum, and bass buses. It's not an illusion. It's the magic of the Tube-Tech SMC 2B Multiband Compressor.

  The SMC 2B's photosensitive components that cause the optical compression, and dynamically affect the responsiveness of the gain reduction, are highly sensitive to ambient rays. So, it was lights out in the laboratory in the heart of Softube headquarters. And the pitch-black magic of precisely modeling this extremely non-linear compressor commenced. The results are clear to see. Softube's Tube-Tech SMC 2B Multiband Compressor offers sound and behavior that perfectly captures the iconic hi-fi hardware.

  The SMC 2B's iconic blue color, musical tube sound qualities, and low distortion make it a staple of the most esteemed studios. Softube modeled every component and stage of this famed three-band optical stereo comp, and the result is software that is indistinguishable from the hardware in Softube's tests. The Tube-Tech SMC 2B Multiband Compressor plug-in gives you the authentic interaction of 6 dB/octave filters that determine the crossover points.

  The SMC 2B's three independent optical stereo compressors offer total control over mix, vocal, bass, and drum buses. Start by choosing which frequencies to treat with compression, then adjust the level of those frequency ranges to rebalance sections of the audio. In addition to that, the sides and mid of a stereo width can be influenced independently. With added features, like unlinked Dual Mono operation, Mid/Side Processing, Parallel Compression via the Dry/Wet Knob, Sidechain input, and mute switches, the SMC 2B compressor gives you even more versatility and control than the storied original.
specs: |-
  - A precise model of the world-renowned Tube-Tech SMC 2B hardware
  - The authentically captured behavior and tube sound
  - Control and flexibility with added modern features
  - Low, Mid, and High bands determined by 6 dB/octave crossover filters with variable frequencies
  - 60-1200 Hz set the point for the Low/Mid bands
  - 1.2-6 kHz set the point for the Mid/High bands
  - Per-band parameters for Threshold, Ratios of 1.5:1 to 10:1, Attack, Release, and Gain
  - Stereo processing via linked or selectable Dual Mono operation
  - Mid/Side processing
  - Parallel Compression via the Dry/Wet knob
  - Sidechain input
  - Mute switches for each band
  - Supports Softube Extended Features panels
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26; Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Three activations included
