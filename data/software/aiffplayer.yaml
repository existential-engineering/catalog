details: >-
  Aiffplayer by kuniox is a virtual instrument audio plugin that functions as a
  VST plugin.


  Features include normal and grain mode playback, 3 filter types, volume &
  filter envelopes, and loop function.


  The plugin is a granular sampler that imports .aiff files and allows playback
  with granular processing capabilities, or alternatively supports normal
  playback mode.
