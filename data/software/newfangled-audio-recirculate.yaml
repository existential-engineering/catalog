description: "Recirculate isn't just a delay plugin; it's the distilled essence
  of what a feedback echo should be. By stripping away the baggage and focusing
  on the sound and control, it's the perfect tool for adding depth and dimension
  to your mixes."
details: |-
  Recirculate is a feedback delay plugin by Newfangled Audio designed to add depth and dimension to mixes. It features dual time control allowing independent manipulation of the initial delay time and the repeat time, enabling complex rhythmic patterns that standard delay plugins cannot achieve.

  The plugin offers four distinct delay modes: Standard, Pitch Warp, Ping Pong, and Granular. Each mode fundamentally changes the character of the echoes, from clean repeats to pitch-drifting textures and scattered grain-based effects.

  Recirculate includes a built-in signal chain of processing tools within the feedback loop: high/low cut filters with morphable shapes, a transient designer, compressor, ducker, and gate. There are also 28 character and noise combinations to color the repeats. Reverb can be added directly into the feedback loop for evolving, spacious tails.

  Spatial and modulation controls include chorus, spread, cross-feed, and granular spray parameters. A DRYFX knob lets users blend effects processing into the dry signal path for creative parallel processing.

  The plugin ships with 180+ professional and artist presets covering a wide range of use cases from vocal swell and rhythmic stutter to ambient pads and ping pong effects. It is compatible with macOS 10.9+ (64-bit, Apple Silicon) and Windows 10+ (64-bit).
specs: |-
  - Dual time control for independent initial delay and repeat timing
  - Four delay modes: Standard, Pitch Warp, Ping Pong, Granular
  - High/low cut filters with morphable shapes
  - Built-in transient designer
  - Built-in compressor, ducker, and gate in feedback loop
  - 28 character and noise combinations
  - Reverb in feedback loop
  - Chorus, spread, cross-feed, and granular spray controls
  - DRYFX knob for parallel dry/wet blending
  - 180+ professional and artist presets
  - macOS 10.9+ (64-bit), Apple Silicon native
  - Windows 10+ (64-bit)
  - Formats: AAX, AU, VST, VST3
