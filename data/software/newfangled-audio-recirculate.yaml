description: Recirculate is a feedback delay built for rhythm, with independent
  control over the first echo and the repeats that other delays lock together.
details: |-
  Recirculate isn't just a delay plugin, it's the distilled essence of what a feedback echo should be. By stripping away the baggage and focusing on the sound and control, it is a direct tool for adding depth and dimension to your mixes.

  Delay is not a new effect. It's been created by tapes, “bucket brigade” chips, garden hoses, and various digital technologies. Other products model those techniques. Recirculate instead starts from the question of why a delay effect belongs on a record, setting aside the conventional delay designer handbook to build an echo plug-in aimed at modern music.

  A feedback delay can add rhythmic spice to your production, but the options are only on-beat, or off-beat. Recirculate fixes this by adding control over the all important first echo. Set a downbeat echo with dotted repeats for a subtle shuffle feel. Or an eighth note first echo with quarter note repeats for a straight echo on the upbeats. It sounds simple, but it's an incredibly powerful rhythmic tool.

  Recirculate has a powerful reverb inside its feedback loop. Because it's in the feedback loop with heaps of complex nonlinear processing it can create giant ethereal reverbs that constantly change, but never end. Its powerful ducker pushes effect out of the way of the dry signal, allowing you to create amazing vocal swells, and the DRYFX knob allows you to blend Recirculate's powerful set of effects into the dry signal as well as the wet, creating an integrated effect to bring focus to your vocal or instrument.

  Recirculate takes a different approach to creating a feedback echo, eschewing modeling specific technologies, but giving you direct control over the complex effects happening in the feedback loop.
specs: |-
  - Simple Yet Deep: craft simple or complex rhythmic echoes effortlessly
  - Dual Time Control: manipulate initial delays and repeats independently for rhythmic diversity
  - Flexible Delay Behaviors: Standard, Pitch Warp, Ping Pong, and Granular delay modes
  - Sync with Precision: align echoes with note values, steps, or milliseconds
  - Shape Your Sound: 5 distinct high and low cut filters, featuring morphable shape controls
  - Transient Designer: keep or remove transients in your echoes
  - Dynamic Mastery: in-built Compressor, Ducker, and Gate for control over echo dynamics
  - Character Section: 28 unique character and noise combinations
  - Ethereal Reverb: reverb for creating diffuse repeats or lush tails
  - Soundstage Controls: Chorus, Spread, XFeed, and Granular Spray
  - Dry FX: blend Recirculate's character and tone into the dry path
  - Over 180 professional and artist presets
  - macOS 10.9+, 64-bit AAX, AU, VST, VST3, all formats Apple Silicon compatible
  - Windows 10+, 64-bit AAX, VST, VST3
