details: |-
  2RuleSynth is a software synthesizer with classical synthesis techniques - subtraction, FM and ring. It has LFOs and ADSR for every two independent oscillators. It has its own characteristic soundscape that can go as far as concrete music. Besides the familiar classical analog sounds, experimental sounds can be found using the randomize button.

  Each oscillators has its own filter, amp and filter adsr and lfos. The synthesizer features self-oscillating moog type filters with low pass, high pass, and band pass options for each oscillator.

  The plugin includes reverb, delay syncable to tempo, chorus, and waveshape distortion effects. It supports 8 note polyphonic operation and includes 49 factory presets, some suitable for musique concrète.

  2rulesynth functions as an audio units plugin and a VST 3 plugin for macos and windows.
specs: |-
  - 2 independent oscillators
  - Waveforms: sine, saw, triangle, square, white noise
  - Waveform control
  - Volume control
  - Fine-tune control
  - Octave control
  - ADSR controls: depth, attack, decay, sustain, release
  - LFOs for amp, filter and pitch syncable to tempo
  - Ring algorithm osc1 x osc2
  - FM modulator oscillator 1 modulates oscillator 2
  - Self resonance Moog type filter
  - Low pass, high pass, band pass filters for each oscillator
  - Mono/polyphonic control
  - Spectrum and wave Windows
  - Reverb
  - Delay syncable to tempo
  - Chorus
  - Waveshape distortion
  - 8 note polyphonic operation
  - Preset randomize button
  - 49 factory presets
