details: |-
  Bass XXL offers a more effective way to get the thick and consistent low end
  that defines modern mixes. Thanks to a proprietary algorithm that creates
  harmonics above the root frequency, your bass will be enhanced even through
  earbuds and small speakers.

  Bass xxl makes use of a proprietary algorithm designed to supersize the low
  end. The plugin accomplishes this by generating additional harmonics that are
  actually above the bass frequency you want to enhance. This concept takes
  advantage of a psychoacoustic phenomenon that causes our brains to interpret
  sub bass audio largely based on its harmonics more so than the lowest sounds
  being produced.

  With so many of today's earbuds and small speakers unable to generate
  satisfying low end, bass xxl comes to the rescue by enhancing your bass with
  fat and beefy harmonics that can be more easily heard.

  Use the plugin to beef up bass lines, kick drums, toms, drum groups, or even
  entire mixes.

  Bass xxl's harmonics algorithm is custom developed for low-end duties. Unlike
  a sub-synth, it generates its harmonics entirely from your dry track,
  resulting in a natural and organic bass enhancement that blends perfectly. The
  algorithm combines the smoothness of analog saturation with digital precision
  and oversampling. Furthermore, we have eliminated the phasing issues that
  sometimes occur with this type of effect.
specs: |-
  - Proprietary harmonics algorithm
  - Analog saturation
  - Digital precision
  - Oversampling
  - Phasing elimination
