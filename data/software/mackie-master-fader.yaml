details: |-
  The Mackie Master Fader app provides complete wireless control over your Mackie DL Series digital mixer. Proven at millions of live mixes worldwide, the incredibly intuitive Master Fader control app is packed with powerful processing and a rich set of mixing tools for any professional application.

  Master Fader 5 offers complete control over the latest DL Series mixers (DL16S, DL32S, DL32R) with frequent updates, factory and user presets, Access Limiting for guest mixers, and offline operation for show prep. Master Fader SE serves the DL16SE and DL32SE mixers, while Master Fader v4.5 remains available for the original DL1608.

  Designed to scale from tablets to desktops, Master Fader runs on iOS, Android, macOS, and Windows so engineers can mix from anywhere on the venue floor.
specs: |-
  - Complete wireless control of Mackie DL Series digital mixers
  - Intuitive layout designed for fast live mixing
  - Factory and user presets for channels and effects
  - Access Limiting for guest mixer control
  - Offline operation for show prep without a connected mixer
  - Tablet and mobile support across iOS and Android
  - Desktop support on macOS and Windows
  - Frequent updates with new features
