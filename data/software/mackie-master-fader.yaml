description: Use the Master Fader Control App to add the industry's leading
  remote workflow fader to your music-mixing tool kit. This app works with all
  DL Series mixers.
details: |-
  Master Fader is the heart of any DL Series system with a proven, intuitive workflow. With a completely customizable UI that is scalable for users of any skill level, Master Fader is an adaptable control app.

  The Mackie Master Fader app provides complete wireless control over your Mackie DL Series digital mixer. Proven at millions of live mixes worldwide, the intuitive Master Fader control app is packed with processing and a rich set of mixing tools for any professional application.
specs: |-
  - Complete control over the AXIS system
  - Intuitive design with proven workflow
  - Quick setup with large library of factory and user-definable presets
  - Access Limiting allows flexible customization of each device, preventing unwanted adjustments
  - Export presets, shows and complete system backups via Dropbox, email and more
  - Complete offline operation allows system creation with just your tablet or computer
  - Pocketable control from iOS and Android devices
  - Master Fader 5 supports DL1608, DL16S, DL32S and DL32R
  - Master Fader SE supports DL16SE and DL32SE
