description: Smooth workhorse gate plugin with psychoacoustic auditory modeling,
  program-dependent processing, and built-in look-ahead for always smooth,
  natural sound.
details: |-
  Renegate is a full-band gate plugin designed for simplicity and natural sound.
  Despite a simplified user interface, it employs advanced internal processing
  including psychoacoustic auditory modeling and program-dependent features for
  intelligent gating behavior.

  The Free Edition includes program-dependent hysteresis, built-in look-ahead
  functionality, program-dependent auto-release, and a 43-band psychoacoustic
  auditory model for envelope detection. These features work together to produce
  smooth, artifact-free gating.

  The Full Edition adds alternative gain reduction methods including 1-pole
  lowpass and highpass filtering, oversampling capability, a built-in sequencer
  for rhythmic gating effects, and a Raw knob for adjusting digital character.

  Renegate emphasizes always delivering smooth, natural sound with quick
  operation, making it suitable as an everyday workhorse gate for mixing
  applications.
specs: |-
  - Program-dependent hysteresis
  - Built-in Look-Ahead
  - Program-Dependent Auto-Release
  - 43-band psychoacoustic auditory model for envelope detection
  - Alternative gain reduction methods (Full Edition)
  - 1-pole lowpass/highpass filtering (Full Edition)
  - Oversampling (Full Edition)
  - Built-in Sequencer (Full Edition)
  - Raw knob for digital character (Full Edition)
