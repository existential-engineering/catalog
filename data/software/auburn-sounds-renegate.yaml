details: |-
  RENEGATE is simply just a full-band Gate plug-in. It has an always smooth, natural sound, and is quick to operate.

  RENEGATE radically simplifies gating. But surface-level simplicity is only possible because it's complicated on the inside: program-dependent hysteresis automatically captures the desired phenomenon, builtin Look-Ahead lets you hit the transient 100% of the time, Program-Dependent Auto-Release, and an expensive 43 bands psychoacoustic auditory model for State-of-the-Art envelope detection.

  Such a refined but quick gating experience is for free, in RENEGATE FREE. RENEGATE FULL also features alternative ways to apply Gain Reduction, namely with a 1-pole lowpass or highpass, Oversampling, a Built-in Sequencer, and a Raw knob to get back digital grit if needed.

  That all makes RENEGATE a workhorse plug-in for all your creative (or boring) gating needs. The LP mode is especially effective for debreathing, the gate LED can be clicked to open the gate manually, and the RETRIG and SEQ+DET parameters can give the illusion of a programmed sequence.
specs: |-
  - Full-band gate plug-in
  - Program-dependent hysteresis automatically captures the desired phenomenon
  - Builtin Look-Ahead lets you hit the transient 100% of the time
  - Program-Dependent Auto-Release
  - Expensive 43 bands psychoacoustic auditory model for State-of-the-Art envelope detection
  - Alternative ways to apply Gain Reduction, namely with a 1-pole lowpass or highpass (Full Edition only)
  - Oversampling (Full Edition only)
  - Built-in Sequencer (Full Edition only)
  - Raw knob to get back digital grit if needed (Full Edition only)
  - Manual gate opening by clicking the LED
  - RETRIG and SEQ+DET parameters
  - VST / AAX / AU / LV2 plug-in for Windows, macOS, and Linux
