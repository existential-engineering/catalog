details: |-
  A truly epic ensemble recorded in the reverberant acoustics of AIR Studios, London. With 11 essential articulations, from expressive Longs and Con Sordino to driving Short Ostinato and Pizzicato, Epic Strings delivers the full power and versatility of a professional string section.

  Three signals: Room for the full Lyndhurst Hall sound, Close for added definition, and Stretch — a unique ambient, synth-like texture created from the Room signal.

  Originals Epic Strings requires the free Splice INSTRUMENT plugin to run.
specs: |-
  - File size: 2.4 GB
  - 60-piece symphonic string section recorded at Lyndhurst Hall, AIR Studios
  - 11 articulations / presets
  - 3 mic signals: Room, Close, Stretch
  - macOS 12 or later, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
