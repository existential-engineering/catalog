details: |-
  The Novachord + Solovox collection emulates two early electronic instruments that were precursors of modern synthesizers. Novachord is based on the revolutionary polyphonic instrument from 1939, while Solovox replicates a related monophonic keyboard instrument intended to provide organ-style leads.

  Manufactured by the Hammond company from 1939 to 1942 and debuting at the World's Fair, the original Novachord contained 163 vacuum tubes and over 1,000 custom capacitors. Its divide-down oscillator architecture combined full 72-key polyphony with an early version of analog subtractive synthesis.

  Due to their unique place in the history of electronic instruments, award-winning developer and DSP designer Mark Barton presented Cherry Audio with the prospect of teaming up to revive these instruments and their unique mystical sounds. The Novachord interface is a magnificent recreation of the original, complete with white Plakson and black Bakelite keys, teardrop rotary levers, and gorgeous cherry wood.

  The result is the Novachord + Solovox experience, a breathtaking feast for both the ears and the eyes, packaged together at one low price with complete MIDI control, DAW automation, and user-adjustable oversampling.
specs: |-
  - Novachord: 32 polyphonic voices, synthesized not sampled
  - Three resonators with bandpass filters at 400 Hz, 800 Hz, and 2000 Hz
  - Deep Tone and Brilliant Tone settings with fixed-frequency filters
  - Attack knob with seven envelope options
  - Adjustable depth vibrato with two options
  - Novachord: 56 presets with integrated reverb
  - Solovox: monophonic virtual analog emulation
  - Bass, Tenor, Contralto, and Soprano octave switches
  - Two bandpass filters, Deep Tone, Brilliant Tone, and Full Tone settings
  - Solovox: 50 presets with glide, vibrato, and reverb
  - User-adjustable oversampling and focus zoom feature
