description: VUMT is an analog style metering plugin offering painstakingly modeled recreations of the general ballistics of classic VU meters. It provides VU, RMS and PPM DIN (Type I) modes with fully customizable ballistics and dedicated trim controls.
details: |-
  Painstakingly modeled behavior and recreation of the general ballistics of classic VU meters. VUMT contains three metering modes: VU, RMS and PPM DIN (Type I). The RMS mode can be set to K-12, K-14 and K-20 scales and offers an integrated peak bargraph.

  The meter ballistics are fully customizable. The VU even has a unique overshoot parameter to match a favorite analog VU meter, alongside tweakable rise and fallback times. The RMS meter adds a selectable "+3dB (AES-17)" option and an adjustable RMS window.

  VUMT offers dedicated trim controls for left, right, mid and side channels to make gain staging easy. A fully customizable smart Clip-LED lights up yellow or orange when exceeding a user defined level (your headroom) and turns red when digital overs are taking place. A switchable hold needle shows the current max VU value, and switchable numerical readouts display peak and meter values.

  The interface offers GUI resizing across six sizes, various options to hide the controls and show the meters only, and a single or dual meter display on stereo channels. Eight different skins are included, along with an optional editable instance label, a preset browser with copy, paste and save-as-default, and global settings to customize knob behavior and the needle refresh rate.

  All formats are included in a single license, and a dedicated standalone application ships with the plugin. The standalone version needs a physical input to display levels, so using it with a media player requires a virtual audio cable such as Soundflower or JackOSX.
specs: |-
  - Painstakingly modeled behavior and recreation of the general ballistics of classic VU meters
  - Three different VU implementations to choose from
  - Unique overshoot control to match your favorite analog VU meter, tweakable rise/fallback times
  - PPM DIN (Type I) mode with adjustable rise/fallback times
  - RMS meter with selectable "+3dB (AES-17)" option and adjustable RMS-window
  - Integrated peak-bargraph and K-12, K-14, K-20 scales to enable proper K-metering
  - Fully customizable smart Clip-LED: yellow/orange when exceeding a user defined level, red on digital overs
  - Switchable and customizable hold needle showing the current max VU value
  - Switchable and customizable numerical readouts for peak and meter values
  - TRIM controls for left, right, mid and side channels
  - Eight skins included
  - Optional editable instance label
  - GUI resizing with six different GUI sizes
  - Option to show the meters only and hide all controls from the GUI
  - Switchable single or dual meter display on stereo channels
  - Preset browser with easy copy/paste and save as default
  - Global settings to customize knob behavior and meter-needle refresh rate
  - Dedicated standalone application included (needs a physical input to display levels)
  - Supported formats are 64bit only
  - Windows 10 or higher (64bit): VST, VST3, AAX, Standalone
  - macOS 10.13 or higher: AU, VST, VST3, AAX, Standalone
