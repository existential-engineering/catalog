description: "Analog-style VU, PPM, RMS metering and trim tool plugin with
  painstakingly modeled VU meter ballistics. Features three VU implementations
  with overshoot control, PPM DIN (Type I) mode, RMS meter with K-scales, smart
  Clip-LED, hold needle, trim controls for L/R/M/S channels, eight skins, and
  standalone application."
details: |-
  Three VU implementations with overshoot control and adjustable rise/fallback times
  PPM DIN (Type I) mode with adjustable ballistics
  RMS meter with K-12, K-14, K-20 scales and integrated peak bargraph
  Customizable smart Clip-LED
  Switchable hold needle showing current max VU value
  Numerical readouts for peak and meter values
  Trim controls for left, right, mid, and side channels
  Eight skins included
  Editable instance label
  Six GUI resize options
  Meters-only display mode
  Single/dual meter display switching
  Preset browser with copy/paste
  Standalone application included
