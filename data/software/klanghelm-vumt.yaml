description: VUMT is an analog-style metering plugin featuring painstakingly modeled behavior and recreation of the general ballistics of classic VU meters. It offers three metering modes (VU, RMS, and PPM DIN Type I), dedicated trim controls for gain staging, and eight skins with GUI resizing.
details: |-
  VUMT features painstakingly modeled behavior and recreation of the general ballistics of classic VU meters. It contains three metering modes: VU, RMS, and PPM DIN (Type I). The RMS mode can be set to K-12, K-14, and K-20 scales and offers an integrated peak bargraph for proper K-metering.

  The meter ballistics are fully customizable. The VU mode includes a unique overshoot parameter to match your favorite analog VU meter, along with tweak-able rise and fallback times. PPM DIN (Type I) mode also features adjustable rise and fallback times.

  VUMT offers dedicated TRIM controls for left, right, mid, and side channels to make gain staging easy. The fully customizable smart Clip-LED lights up yellow/orange when exceeding a user-defined level and turns red when digital overs are occurring.

  The GUI is highly flexible: choose from eight different skins, select from 6 different GUI sizes, optionally hide all controls to show meters only, and switch between single and dual meter display on stereo channels. An editable instance label is also included.

  VUMT includes a preset browser with easy copy/paste and save-as-default functionality, as well as global settings to customize knob behavior and adjust the refresh rate of the meter needles. A dedicated standalone application is also included.
specs: |-
  - Three metering modes: VU (three implementations), RMS, and PPM DIN Type I
  - RMS mode supports K-12, K-14, and K-20 scales with integrated peak bargraph
  - RMS mode includes selectable +3dB (AES-17) option and adjustable RMS-window
  - Unique overshoot control for VU mode; tweak-able rise/fallback times for VU and PPM DIN
  - Fully customizable smart Clip-LED with user-defined headroom threshold
  - Switchable hold needle showing current max VU value
  - Switchable numerical readouts for peak and meter values
  - Dedicated TRIM controls for left, right, mid, and side channels
  - Eight skins included
  - GUI resizing with 6 different sizes
  - Option to show meters only and hide all controls
  - Single and dual meter display switchable on stereo channels
  - Editable instance label
  - Preset browser with copy/paste and save as default
  - Standalone application included
