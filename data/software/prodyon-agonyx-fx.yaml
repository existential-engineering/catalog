description: Agonyx FX is the multi-effects unit from agonyx as a standalone
  plugin and is available for free to all registered users of agonyx.
details: |-
  Modulation: one source can control up to 16 targets.

  Automation: full vst2.0 support for automation. Supports MIDI ccs.
specs: |-
  - Velocity-sensitive filters (4 types, with ADSR)
  - Synced gate for rhythmic effects (16 steps, adr-envelope)
  - Distortion with variable frequency/resonance
  - Lofi with variable frequency
  - Flanger with feedback, rate, modulation and lowcut
  - Bpm-synced dual delay with steps, offset and lowcut
  - Reverb with lowcut, damp, width, length and freeze-function
  - LP/HP master filter
  - Non-synced sine LFO for pitch
  - 4x16 modulation matrix
  - Synced LFO with variable rate and waveform
  - Included random waveform (s/h)
  - Lfo2 free/retrigger-switch
  - Full VST2.0 support for automation
  - MIDI ccs support
