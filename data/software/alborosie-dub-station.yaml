details: >-
  Alborosie dub station is a multi-effect plugin that carefully recreates the
  original filter, echos, and spring reverb pre-owned, modified, and used by the
  legendary osbourne ruddock "king tubby" producer, studio engineer, and pioneer
  of dub reggae from the golden era of the 70s from alborosie's personal vintage
  gear collection.


  Echowuk: directly from federal studios, then king tubby studio in waterhouse
  kingston, the mci 2 track tape that was used to record and also to create the
  echo effect for most of the reggae classics overall and popular tubby's
  instrumental dub mixes.


  Spring bling: directly from king tubby studio in waterhouse kingston, the
  modified fairchild spring reverb used by the maestro himself in most classic
  records and dub mixes he recorded and produced.


  Filter man: modeled after tubby's so-called "big knob", a passive high-pass
  filter with eleven frequency steps from 70hz to 7.5khz. This filter defined
  the sound of the entire 'roots' area of jamaican music.
specs: |-
  - VST plugin
  - Audio units plugin
  - VST 3 plugin
  - AAX plugin
  - Clap plugin
  - Multi-effect plugin
  - High-pass filter
  - Eleven frequency steps (70hz to 7.5khz)
  - Echo effect
  - Spring reverb
  - Macos and windows compatible
