url: https://momo-editors-home.jimdofree.com
description: VST and standalone editor and soundbank for the behringer jt mini synth.
details: |-
  In the plugin VST version you can record the controller movements and so the
  sound change can be saved. Editor features: simple handling of the jt mini
  without menu surfing, complex sound changes can be made easily and quickly,
  change behringer jt mini sounds directly from editor, many controllers can be
  automated, x-y modulation of all parameters, random the controllers of the
  behringer jt mini synth to produce new sounds, use your behringer jt mini as a
  sound module in your DAW.

  A editor sound bank with over 40 new sounds is included.

  The editor are available for: pc as vst2 and standalone for 32-bit and vst2,
  vst3 and standalone for 64-bit windows. Mac as vst2, vst3, AU and standalone,
  compatible with mac intel and silicon.
specs: |-
  - VST2
  - VST3
  - Audio Units (AU)
  - 32-bit Windows
  - macOS intel
  - macOS silicon
  - MIDI editor
  - X-y modulation
  - Parameter automation
  - Controller randomization
  - Sound module functionality
