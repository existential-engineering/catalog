description: Cabinetron is the ultimate IR loader & cabinet simulator that integrates IR browsing, editing, mixing, EQing, tone matching, exporting, born to be your one and only tool to find every missing process between your amp and your ears.
details: |-
  Includes 400+ IR presets across various genres with a full-featured IR file browser supporting search, tagging, and favorites. Features Spectrum Smoothing Technology and 31 EQ Curve Mutations for shaping cabinet tone. Simulates the FRED miking technique with virtual microphone positioning for realistic mic placement. Includes Speaker Impedance Simulation EQ and Non-linear Enhancement modeling that emulates voice coil behavior. Provides a 24-band parametric EQ with 10 filter types, Auto Phase Alignment, and Tone Matching with 100+ classic tones.
