description: Vintage FET compressor plugin inspired by the UREI 1176. Fast, punchy, aggressive compression for drums, bass and vocals.
details: |-
  Inspired by the classic 1176 FET compressor: the leveling amplifier that defined "fast and loud". The VLA-FET is a take on the discrete FET design, built around a modelled FET compression amp, an output transformer with real flux saturation and a discrete Class-A stage, then given a couple of modern tricks the original never had.

  The VLA-FET is a vintage FET compressor, and it plays a completely different game from an opto unit. Where an optical cell breathes, a FET clamps: fast, hard and with attitude. The attack sweeps down to roughly one millisecond, faster than almost anything of its era, which is why the 1176 became the drum-and-vocal weapon it is. Drive the Input gain to set how much compression you get, use Output gain to make up level, and pick a Ratio from a gentle 4:1 up through 8:1, 12:1 and a firm 20:1, or the notorious All mode.

  The original arrived in the late 1960s as one of the first true FET compressors, using a field-effect transistor as the variable-resistance element instead of a tube or an optical cell. Black Rooster Audio modelled the VLA-FET as a living circuit: the FET compression amplifier, the output transformer with its genuine flux saturation and the discrete Class-A output stage, all simulated in real time with a SPICE-style approach, with adaptive oversampling running up to 4x under the hood to keep the fast transients clean.

  The Ratio switch steps through 1:1, 4:1, 8:1, 12:1 and 20:1, then lands on All, the legendary "all-buttons-in" mode where every ratio is engaged at once for a gnarly, aggressive, distorted crush famous on room mics and parallel drums. Attack is very fast (roughly 1 to 7 ms), Release is fully sweepable, and an Auto Fast mode adapts the release to the program for hands-off control on dynamic material.

  Drums are the VLA-FET's home turf: fast attack, high ratio and it turns a limp snare into a crack, or slams a whole kit into All mode on a parallel bus for an exploding-room sound. On bass it locks the low end in place with punch and consistency, and on vocals it adds urgency and forward presence. Modern additions beyond the original hardware include a Sidechain Highpass (7.5 Hz to 1 kHz), a real External Sidechain input, and a Mix knob blending dry and processed signal from 0 to 100% for instant parallel compression.
