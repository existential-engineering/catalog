description: PSP stereoAligner2 is a precision tool for correcting phase, time, polarity, and balance issues in stereo recordings. Features independent phase alignment across three frequency bands, sample-accurate delay correction, stereo balance and width manipulation, polarity control with independent left/right flipping, channel swapping, and a built-in goniometer visualization. All processing is performed in 64-bit double-precision.
details: |-
  PSP stereoAligner2 provides variable phase adjustment across three frequency bands, sample-accurate delay correction for inter-channel timing issues, stereo balance and width manipulation, polarity control with independent left/right flipping, channel swapping, and a built-in goniometer (X-Y scope) visualization with peak metering. Licensing uses iLok (no hardware dongle required) with support for 3 activation locations.
specs: |-
  - 3-band variable phase alignment
  - Sample-accurate inter-channel delay control
  - Stereo balance and width manipulation
  - Polarity inversion with independent L/R control
  - Channel swap capability
  - Built-in goniometer (X-Y scope) visualization
  - Peak metering
  - 64-bit double-precision processing
  - Windows: 7-11 (64-bit)
  - macOS: 10.14-15 Sequoia (Intel and Apple Silicon, 64-bit)
  - iLok License Manager required (no hardware dongle); 3 activations
