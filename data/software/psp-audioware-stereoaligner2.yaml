description: PSP stereoAligner2 is a precision tool for correcting phase, time, polarity, and balance issues in stereo recordings. Features independent phase alignment across three frequency bands, sample-accurate delay correction, stereo balance and width manipulation, polarity control with independent left/right flipping, channel swapping, and a built-in goniometer visualization. All processing is performed in 64-bit double-precision.
details: |-
  PSP stereoAligner2 is a powerful tool designed to correct and refine the stereo image of any dual-channel recording. Whether you're working with spaced microphones, synthetic stereo sources, or complex mix elements, PSP stereoAligner2 gives you precise control over time alignment, variable phase adjustment, polarity, width, balance, and gain.

  With its intuitive visual interface, including a built-in goniometer (X-Y scope) and peak metering, PSP stereoAligner2 makes it easy to diagnose and correct stereo problems quickly. Shape the stereo field with sample-accurate delay correction, independent low/mid/high phase adjustments, channel swapping, polarity flips, and width manipulation, all processed in pristine 64-bit double-precision.

  Built around a variable-phase control engine, PSP stereoAligner2 allows you to independently align inter-channel phase across three frequency bands. This enables precise stereo tuning, especially useful for spectrally rich, stereo-recorded sources like grand piano, drum overheads, or orchestral ensembles.

  Although both plugins deal with stereo image control, PSP stereoController2 and PSP stereoAligner2 are built for different purposes and complement each other in a professional audio workflow. Use stereoAligner2 when you're working with phase-sensitive stereo material or need multi-band spatial precision and creativity, and use stereoController2 for practical stereo fixes, mic correction, and mastering-focused balance and width shaping.

  In order to run PSP stereoAligner2 in 30-day trial mode or activate it, you need an iLok user ID which you can create for free at www.ilok.com, and you need to install the free iLok License Manager application but you don't need any hardware dongle. You can activate the license in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above).
specs: |-
  - Precise control of the phase between the left and right channel to fix inter-channel phase issues or to obtain a proper mono output out of a stereo recording
  - 3-band phase alignment for detailed stereo correction using a variable-phase control engine
  - Precise control of the inter-channel delay to fix inter-channel latency issues due to asymmetric distances between sound source and microphones
  - Control of the stereo balance whenever a stereo track has improperly adjusted levels between channels
  - Individual left or right and common left and right polarity flip
  - Channel swap to deal with swapped channels or routing issues on recording
  - Control over inter-channel delay, balance, and width
  - Creative in/out-of-phase effects for sound design
  - Goniometer (X-Y scope) to control the stereophonic properties of the output signal
  - Peak level meter to control the overall output digital peak level
  - 64-bit double-precision processing
  - iLok License Manager activation, software-only, no hardware dongle required, up to 3 activation locations
  - 30-day trial available for macOS and Windows
