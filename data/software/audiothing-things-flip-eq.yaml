description: Things Flip EQ is an easy to use tilt EQ plugin. It can also be
  applied to the mid or side of a stereo signal to enhance the stereo depth.
details: |-
  Things Flip EQ is an easy-to-use tilting EQ plugin with mid/side mode. Turn the main knob to the right, and you get more highs and less lows. Turn it to the left, and lows are boosted while highs are attenuated. You can choose the cutoff frequency of the EQ with the Cutoff control, or increase the gain of the EQ with the Boost button.

  Things Flip EQ can also be applied to either the mid or side of a stereo signal to further enhance the stereo depth. This can be useful to create a wider stereo image on a full mix or on individual tracks.

  Things - Flip EQ is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP). It is also available on the App Store for iOS and iPadOS (AUv3 and Standalone), for iPhone and iPad.

  A demo version is available with some limitations: silence for 3 seconds every 45 seconds, and saving disabled. If you like it, you can purchase a license and then authorize the demo version.
