details: |-
  Articulator is a modern digital version of the classic talk box, made famous
  on recordings by artists like peter frampton, zapp, and bon jovi. Perfect for
  talking guitars, singing synths, and a wide range of special effects.

  A physical talk box works by applying a filter (the human mouth) to an audio
  signal (usually a guitar or synth). Articulator models this process by
  extracting the formant and amplitude information from a vocal track and
  applying it to another audio track or to its built-in noise generator in real
  time.

  Articulator also features a built-in eq, a formant modulation section, which
  lets you sculpt your vocal sound using our throat modeling technology, and an
  amplitude modulation control, which lets you dial in exactly how much of the
  effect you want on your track.
