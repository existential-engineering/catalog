description: Harmonic tracking resynthesis reverb adaptiverb is a revolutionary
  reflectionsless reverberation plugin. Unlike traditional reflection-based...
details: >-
  Harmonic tracking resynthesis reverb is a revolutionary reflectionsless
  reverberation plugin. Unlike traditional reflection-based acoustic room
  modeling, adaptiverb adds perceived depth, harmonic richness, and
  butter-smooth tails without obscuring the source. Preserving the tonal
  definition and directness of your mix, it adds size, glue and body making it
  perfect for mixing and mastering applications alike.


  Powered by ray tracing, source separation, and advances in artificial
  intelligence, adaptiverb automatically adapts to the input audio like a
  chameleon, blending with your sounds perfectly, and conforming its reverb tail
  to the tonality of the input or a user defined set of notes.


  While exceptionally fast to use, its advanced synthesis, cross-filtering and
  reverb pitch processing functionality provides ambient artists, film composers
  and sound designers with exciting new creative options for making evolving
  drones, organic pads, lush ambient sound scapes, and more.


  Bionic sustain resynthesis creates stunningly organic tails, eliminating noisy
  components from the input for clear, harmonic results. Harmonic contour filter
  (hcf) circuit for removing effect components not in tune with the input, a
  captured harmonic fingerprint, or a set of notes defined using an on-screen
  keyboard.


  More than 400 presets covering a broad range of effects, including
  bread-and-butter reverbs, "invisible" reverbs, instrument-/voice-colored
  reverbs, cross-filtering, adaptively filtered delays, and pads/drones that
  play without input signal.
specs: |-
  - Reflectionsless reverberation
  - Ray tracing reverb engine
  - Allpass based reverb engine
  - Source separation
  - Artificial intelligence adaptation
  - Bionic sustain resynthesis
  - Harmonic contour filter (hcf)
  - Hcf keyboard modes
  - Hcf hold mode
  - Input freeze function
  - Simplify function
  - Additive synthesis
  - Richness parameter
  - Harmonic synthesis based air
  - Pre-processing section
  - MIDI control
  - VST plugin
  - Audio units plugin
  - VST 3 plugin
  - AAX plugin
  - Universal 2 binary
  - Windows 7 or newer
  - Macos os x 10.8.x or newer
  - Intel cpu with at least 2 cores
  - Steinberg VST 2.4
  - Steinberg VST 3
  - Avid rtas/AAX compatible
  - Ilok.com account activation
  - Internet connection for software activation
