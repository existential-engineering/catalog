details: |-
  One of the first keyboards, I ever owned. To this day, no other keyboard has as much character as the SY85. We've included all of the waveforms, including drum kits; and because it's all sample based, you will have no problem recreating your favorite patches from this library. One of our main goals was to capture the analog warmth of the actual hardware and we can say we achieved that with excellence. You will be amazing how warm and fat this synth sounds. The TGX-85 is a Yamaha SY-85/TG-500 virtual instrument library eXpansion for Pure Synth Platinum. In keeping with the amazing structure of as PSP, we have included ALL of the raw waveforms from the actual hardware, including the old school drum kits. You get 4-oscillators in which to combine your patches as well as two filters, and two LFOs of which are not offered on the hardware. The arp can be global or per oscillator as well as global and per oscillator effects, depending on the template you choose. In many ways the TGX-85 rivals that of the actual hardware, because of the added modulation sources, the number of effects, and greater polyphony. The goal of the TGX-85 is to virtually put the feeling of the hardware right into your hands. The Yamaha SY-85 was the first digital synthesizer I ever owned. At the time, I felt that it wasn't up to par with any of the other synths out at the time. I remember I couldn't wait until I saved enough money to replace it. Boy was I wrong! Now listening to the sounds some years later, I realized that this was one of the most forgotten synths, especially for pads and synths. Now we have a slew of VST effects, and racks trying to mimic the good ol' digital sound of the 90's, because those sounds were so raw and grimy. This is what I didn't appreciate back then from the good old SY-85. The SY/TG is best known for it's spacious and lush pads; moog-like synth bass, vintage analog brass sounds, very realistic solo strings, the absolute best dance/house piano, and an overall amazing 90's pop feel. The raw digital/gritty sound makes it sound very unique and special. The synth brass, synth bass, pads, and raw waveforms are very unique and make for some very dirty, digital, and analog sounding pads and synths. The best part is that we feel that M5/UVI has some of the best effects out of any VST, so combing both makes for an amazing virtual emulation. You take those raw low-fi digital samples and you combine them with modern filters and effects, and you get this reminiscent digital synth with an edge.
