details: |-
  BIAS FX 2 Mobile transforms your mobile device into the ultimate all-in-one
  guitar effects processor, letting you explore hundreds of premium amps,
  pedals, and studio racks to create your dream guitar tone.

  Build to your heart's content with a gorgeous user interface, an intuitive
  drag-and-drop operation, and a massive library of world-class guitar and bass
  amps, pedals, and effects, you can easily create a rig that's true to you and
  your playing style for the ultimate custom guitar tone.

  Thanks to the groundbreaking guitar match technology, you can make your guitar
  sound like a classic american guitar, a vintage lp, and an array of
  highly-coveted guitar models. Whether you're recording, performing, or jamming
  at home, you'll have a collection of iconic modern and vintage guitars with
  you at all times right in your mobile device.

  Practice, record, and jam with looper, the perfect companion for nailing down
  riffs and solos for your song ideas. Bias fx 2 mobile supports audiobus,
  garageband, and other iaa host applications so you can take your tones even
  further.

  Connect to tonecloud, discover and download over thousands of custom rigs
  created by artists, producers, and recording engineers. Upload your own custom
  guitar rig and share with fellow musicians from across the world.
specs: |-
  - 101 effects

  - 35 amps

  - 25 cabs

  - 4 mics

  - Dual signal path

  - Hd sound engine

  - 77 factory presets

  - Guitar match (20 legendary axes)

  - Looper

  - Liveview

  - Impulse response

  - Celestion inside (coming soon)

  - Bias ecosystem (coming soon)

  - Tonecloud

  - Iaa (inter-app audio)

  - Audiobus support

  - Full MIDI support (coming soon)

  - Tuner

  - Metronome

  - 9 expansion packs available

  - Ios 11 or later

  - Supported audio interfaces: irig (all series), apogee jam/jam plus,
  focusrite itrack solo, shure mvi, korg plugkey, iconnect audio, mfi or class
  compliant audio interfaces with lightning to USB adapter
