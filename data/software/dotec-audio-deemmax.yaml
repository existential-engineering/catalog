details: |-
  DeeMMax is a loudness maximizer designed specifically for mastering. It increases the loudness without losing sound quality and the feeling of music. Just raise the lever for basic operation — powerful sound pressure increase is possible with minimal effort.

  The special design for mastering keeps the mix balance and increases the sound pressure transparently. It suits a wide range of genres including EDM, rock, unplugged, and a cappella, and is also compatible with 32-bit float field recordings.

  Original high-speed processing enables accurate TruePeak limiting, ensuring compliance with broadcast loudness standards. The True Peak limiter can be toggled ON/OFF, giving mastering engineers precise control over peak management.

  The Softness parameter allows priority to be given to dynamic range, letting engineers balance loudness against dynamics to taste. The AUTO SOFTNESS CONTROL button automates this process for convenience.

  A Monitor function allows you to check the effect while keeping input and output volume levels consistent, making it easy to evaluate the processing without level-matching confusion. Input and gain reduction meters provide clear visual feedback during operation.
