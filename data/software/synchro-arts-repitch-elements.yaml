description: An affordable, trimmed-down version of the award-winning
  pitch-correction plugin that provides everything you need to tune vocals
  quickly and easily.
details: |-
  Powerful. Easy-to-use. Exceptionally transparent. Make detailed pitch, timing or vibrato changes in seconds and maintain the ultimate control over your tuning with advanced technology that lets you shape your pitch curve.

  Simplify your process and make complex vocal corrections in seconds with an intuitive range of pitch correction shortcuts.

  Access timing tools in the note blocks to adjust the length of notes and move them horizontally to find the perfect “pocket” for your vocals.

  The Elements tier covers Enhanced Musical Pitch Analysis, Tuning Macros, Multi-Region Editing Mode, Time Editing, Center Note Tools and the Split Tool, with an ARA2 version for compatible DAWs and two activations per licence.
specs: |-
