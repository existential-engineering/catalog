details: |-
  Bad Bad Lead is a dedicated leadline synth offering two oscillators: a
  sawtooth wave sampled from a 1970s goodwill transistor signal generator, and a
  super-sine sinewave oscillator one octave above, which is taken from a 1940s
  taylor valve (tube) signal generator.

  Distortions and instabilities in the sampled waves combine to give bad bad
  lead a singular character of its own.

  Main sawtooth oscillator sampled from a 1970s transistor-based signal
  generator. Super-sine oscillator sampled from a 1940s valve (tube) signal
  generator.

  Multimode filter with resonance and envelope. Tube drive, distortion and
  compression effects in the signal path.

  Oscillator drift control for added analogue warmth.
specs: |-
  - Two oscillators

  - Sawtooth wave oscillator sampled from 1970s transistor signal generator

  - Super-sine sinewave oscillator sampled from 1940s taylor valve (tube) signal
  generator

  - Multimode filter with resonance and envelope

  - Tube drive effect

  - Distortion effect

  - Compression effect

  - Oscillator drift control

  - Requires kontakt 4.2.3 and later
