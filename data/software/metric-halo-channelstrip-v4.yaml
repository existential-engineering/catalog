description: ChannelStrip is a signal processing plug-in that integrates an
  expander, compressor, multi-band EQ and limiter in one unified interface for
  processing mix channels and the mix bus.
details: |-
  For over 25 years, Metric Halo's ChannelStrip has been an integral part of the sound of records, TV shows and movies, and has been a tool for getting a sound quickly for professional recording engineers, composers and musicians world-wide.

  As a signal processing bundle, ChannelStrip integrates everything needed to process the channels that make up a mix as well as the entire mix bus.

  Featuring an expander, compressor, multi-band EQ and a limiter, ChannelStrip provides a unified interface for processing tracks. It also includes phase invert, channel delay, comprehensive metering and SpectraFoo spectrum analysis, so the audio can be seen as well as heard.

  More than 250 presets are included, the gain reduction meters are scalable, the UI size is adjustable with disclosable graphs, and the MH Preset Manager provides cross-platform presets. Dynamics blocks have individually switchable side-chains with side-chain listen, an integrated side-chain EQ and EQ/compressor routing control.

  Version 4 adds a VST3 version on both macOS and Windows, with native Apple Silicon support for VST hosts including Steinberg products and VST3 native side-chain support. It adds support for EQ and dynamics graphs in Pro Tools and enables the EQ and dynamics pages in Avid Control/EuCon when running in Pro Tools. All v4 plug-ins add undo/redo, A/B snapshots with snapshot blend, software update tracking, more flexible resizability, common controls in the header bar, improved preset management, settings copy and paste between instances, a plug-in details pane reached from the MH logo, a smaller installer download on macOS, configurable themes, selectable knob styles and user preferences for band colors, UI colors and knob rings.
specs: |-
  - World-class signal processing and workflow
  - Expander, Compressor, EQ and Limiter in one processor
  - Fully parametric interpolated EQ
  - Integrated side-chain EQ for dynamics
  - Individually switchable side-chains for dynamics blocks
  - Individual side-chain listen for dynamics blocks
  - EQ/Compressor routing control
  - SpectraFoo spectrum analysis built-in
  - Scalable gain reduction meters
  - More than 250 presets included
  - Adjustable UI size, disclosable graphs
  - MH Preset Manager provides cross-platform presets
  - macOS 10.10 or newer, Intel processor or Apple Silicon, AU, VST 2 and 3 or AAX (Pro Tools 11 and newer Native) host, 64 bit
  - Windows 7 or newer, Intel processor, VST or AAX (Pro Tools 10, 11 and 12 and Native) host, 64 bit
  - Requires an iLok.com account
  - License includes two activations for the account
  - iLok dongle is optional, the license can be installed on the machine, on an iLok or in the iLok Cloud
  - Only one license required, works on all supported platforms
