description: Analog Rack Chorus is a simple but powerful chorus plugin inspired by the most famous chorus pedals and rack effect units. It features a tube preamp virtual circuit that gives distinctive color to the signal.
details: |-
  Analog Rack Chorus is a straightforward yet capable chorus effect plugin drawing inspiration from celebrated chorus pedals and rack-mounted effects units. The plugin is designed with simplicity in mind, making it easy to dial in lush, classic chorus tones without a steep learning curve.

  A key feature of the Analog Rack Chorus is its tube preamp virtual circuit, which imparts distinctive warmth and coloration to audio signals. This adds an analog character that goes beyond a purely digital chorus effect, giving recordings a more musical and organic feel.

  The plugin is available for Mac (OS 10.13 or newer) and Windows 7 or newer, supporting Intel-compatible and Apple Silicon CPUs. It requires a 64-bit DAW host and at least 1GB of RAM. An iOS version is also available for iPhone and iPad via the Apple App Store.

  Analog Rack Chorus is offered completely free of charge, making it accessible to producers and musicians at any level. Despite being free, it delivers professional-quality chorus suitable for guitars, synths, vocals, and other instruments.
