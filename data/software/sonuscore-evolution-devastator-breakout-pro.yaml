  - Smart XY Morphing Engine for flexible sound design control with all samples integrated
  - 48 kHz (96 kHz) / 24-bit
  - 14 GB uncompressed samples
  - Komplete Kontrol integrated (NKS-ready)
  - Compatible with the FREE KONTAKT PLAYER
