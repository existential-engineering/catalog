description: Back with a fresh perspective, this time focusing on deeply textured and visceral bass sounds, hellish braams and intimidating, distorted leads. Designed for contemporary film and video game composition, it delivers 105 patches across 15 categories with a Smart XY Morphing Engine.
details: |-
  Evolution: Devastator Breakout Pro is the latest installment of the KeepForest Evolution series, returning with a fresh perspective focused on deeply textured and visceral bass sounds, hellish braams and intimidating, distorted leads. It looks deep into the modern and often violent sound design of current video games and movies to create sonics that tear through a mix and demand the audience's attention.

  Amongst the library's thousands of sounds are breathtaking percussion and drum sounds, fully playable instruments, dynamic tick-tock layers, thumping pulse sounds, staggering signature sounds, one shots, gun handlings, artist stems and cinematic loops. It is positioned as a tool for keeping productions ahead of the curve in contemporary film and video game composition.

  The content is organised into 105 patches across 15 categories, with over 2,300 WAV files and more than 900 loop samples. A Smart XY Morphing Engine gives flexible control during sound design with all samples integrated, and 63 kit presets each carry seven scene presets. Over 1,300 hand-crafted sound design WAV samples round out the package.

  The library was produced by Arseni Khodzin, credited as producer, sound designer and mixing engineer, with Joe Ford credited as sound designer.
specs: |-
