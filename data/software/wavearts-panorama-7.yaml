description: An advanced virtual acoustics plugin utilizing HRTF-based binaural synthesis and acoustic environment modeling. It replicates 3D sound propagation within physical spaces for both headphone and loudspeaker playback.
details: |-
  Panorama 7 is billed as the definitive 3D spatializer, using head-related impulse response (HRIR) binaural synthesis to place audio sources anywhere in a 3D space around the listener.

  The plugin models complete acoustic environments including early room reflections and late diffuse reverberation, simulating how sound propagates within physical spaces.

  A position sequencer enables trajectory automation and beat-synced movement effects, while Doppler pitch shifting and distance modeling add further realism to moving sources.

  For loudspeaker playback, Panorama 7 includes a crosstalk canceling mode that converts binaural output for stereo speakers. SOFA format HRIR and user-supplied HRIR files are supported for custom head measurements.

  The dark-theme UI features an expandable panning area spanning -100 to +100 feet, zoom controls, and multiple view options. A fully functional 30-day demo is available. The plugin is also included in the Power Suite 7 bundle.
specs: |-
  - HRIR binaural synthesis
  - Early room reflection and late diffuse reverberation modeling
  - SOFA format HRIR support
  - User-supplied HRIR support
  - Position sequencer for trajectory automation and beat-synced effects
  - Doppler pitch effect and distance modeling
  - Crosstalk canceling for loudspeaker playback
  - Stereo panning and binaural-to-loudspeaker conversion
  - Dark theme UI with expandable panning area (-100 to +100 feet)
  - Zoom controls and multiple view options
  - Mac: AU, VST3, AAX (64-bit hosts, macOS 10.13+, Apple Silicon native)
  - Windows: VST2, VST3, AAX (64-bit hosts, Windows 7/8/10/11)
  - Pro Tools 11+ required for AAX format
  - 30-day fully functional demo available
