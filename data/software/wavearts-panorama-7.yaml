description: Panorama is an advanced virtual acoustics plugin that delivers lifelike auditory experiences suitable for both headphone and loudspeaker playback. Using HRTF-based binaural synthesis and acoustic environment modeling, Panorama replicates 3D sound propagation within physical spaces.
details: |-
  Panorama has many possible uses. For 3D audio production it is inserted on each track in a mix and used to pan individual sounds around a virtual space, which works best for headphone mixes but applies to loudspeaker playback as well. Source positions can be driven by the sequencer as motion trajectories or simply automated.

  In conventional stereo mixes, 3D processing can create a panning effect that stands out from conventional power panning, and the sequencer allows all kinds of modulating auto-pan effects. Panorama can also process stereo mixes to sound very wide over loudspeakers, and it can simulate stereo and surround playback on headphones for virtual monitoring.

  The main new feature in Panorama 7 is the position sequencer, which pans a sound along a set of trajectory waypoints for trajectory automation and beat-synced musical effects. Version 7 also brings a new dark-theme interface, a larger panning area with side and rear view options, a zoom control, and a virtual area extended from the range of -10 to +10 feet in Panorama 6 to a range of -100 to +100 feet.

  Panorama 7 adds support for SOFA format HRIRs, the standard file format for interchange of head-related impulse responses, via a conversion application called Sofa2Pan. Third-party HRIRs are specified by filename and sample rate converted to the session rate when loaded. A Near Head Model improves reproduction accuracy for positions close to the head, and Stereo Pan and Stereo Passthru HRIRs implement traditional stereo panning and binaural to loudspeaker conversion. Panorama 7 is included in Power Suite 7.
specs: |-
  - Head-related impulse response (HRIR) based binaural synthesis
  - Early room reflection modeling
  - Late diffuse reverberation
  - Doppler pitch effect
  - Distance modeling
  - Position sequencer for automating trajectories and creating musical panning effects (auto-pan)
  - Crosstalk canceling based on real head models for loudspeaker playback
  - Support for SOFA format HRIRs
  - Support for user supplied HRIRs
  - Conventional stereo panning mode
  - Binaural to loudspeaker conversion
  - Requires a host program that supports audio plug-ins
  - iLok licensing is supported but not required
  - Macintosh formats: AU, VST3, AAX
  - Windows formats: VST2, VST3, AAX
  - macOS 10.13 (High Sierra) and higher
  - Apple Silicon natively supported (AU, VST3, AAX)
  - Windows 7/8/10/11
  - AAX requires Pro Tools 11 and higher
  - 64-bit hosts only
