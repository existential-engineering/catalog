description: "Advanced virtual acoustics plugin delivering lifelike 3D auditory
  experiences for both headphone and loudspeaker playback. Uses HRTF-based
  binaural synthesis and acoustic environment modeling to replicate 3D sound
  propagation within physical spaces."
details: |-
  HRIR-based binaural synthesis. Early room reflection modeling. Late diffuse reverberation. Doppler pitch effect. Distance modeling. Position sequencer for automating trajectories and auto-pan effects. Crosstalk canceling for loudspeaker playback. Support for SOFA format HRIRs. Conventional stereo panning mode. Binaural to loudspeaker conversion.
specs: |-
  Mac: AU, VST3, AAX. macOS 10.13+, Apple Silicon native, 64-bit only. Windows: VST2, VST3, AAX. Windows 7/8/10/11, 64-bit only. iLok supported but not required.
