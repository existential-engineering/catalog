description: Digital artifacts, on demand. The infinitely desirable sound of
  crappy mp3’s, broken cellphones, streaming videos, and much more.
details: |-
  In June of 2014, producer & friend-of-Goodhertz, Tyler Duncan, wanted a certain drum fill to sound like the year 2001 — that is, like a low bitrate digital mp3 ripped from KaZaA. We understood him immediately. Since the dawn of the second recording format, mankind has longed for the aesthetic imperfections of the previous recording format.

  “Would a bitcrusher do?” No, Tyler didn’t have 8-bit in mind. He wanted lossy digital audio: streaming music on a 56k modem, an mp3 ripped from a CD-R, light jazz music streamed over a cellphone, a YouTube video uploaded in 2007. What if a plugin could degrade digital audio and simulate those quintessential compressed sounds in realtime?

  So we built Lossy: artifacts of heavily compressed audio in a highly tweakable realtime plugin.

  Goodhertz asks: are you ready to nostalgize the beautiful harmonics of heavily compressed digital audio? Are you ready to enter the underwater cathedral?

  Lossy has 1 page of advanced controls. You can also read about the advanced controls in the plugin manual. Lossy is also now available as a pedal from Chase Bliss.
specs: |-
  - Realtime simulation of heavily compressed digital audio artifacts
  - 1 page of advanced controls
  - 64-bit only, requires a 64-bit DAW
  - macOS 10.13+ and Windows 10+
  - Native support for Apple silicon computers (releases ≥ v3.7.0)
  - Native Pro Tools support on Apple silicon (releases ≥ v3.8.0)
  - Mac formats: AU, AAX, VST, VST3
  - Windows formats: AAX, VST, VST3
  - A single license entitles you to all formats
  - Localized in English, Spanish, Portuguese, French, Italian, Arabic, Korean, Japanese, Simplified Chinese and Traditional Chinese
