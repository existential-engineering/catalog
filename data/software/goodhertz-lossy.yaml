description: Lossy simulates the infinitely desirable sound of crappy MP3s, broken cellphones, streaming videos, and more — recreating the artifacts of heavily compressed audio in a highly tweakable realtime plugin.
details: |-
  Lossy is an audio plugin by Goodhertz that recreates the sonic character of digitally compressed and degraded audio sources. Originally created in June 2014 for producer Tyler Duncan who wanted to capture the aesthetic of early 2000s digital audio, it has since become a go-to tool for adding lo-fi digital texture to productions.

  The plugin simulates the artifacts of low-bitrate MP3 compression, streaming audio over slow connections, compressed mobile phone audio, and early internet video uploads. The effect is achieved through real-time processing with a highly tweakable interface.

  Lossy features a Loss section with seven modes including Standard, Inverse, Phase Jitter, and Packet modes, allowing users to target specific types of digital compression artifacts. Loss Amount, Loss Speed, and Loss Gain parameters with an embedded level meter provide precise shaping.

  Additional processing sections include a Verb block (with Pre/Post positioning and Amount/Decay controls) and a Filter section with selectable slope from 6 to 96 dB/Oct and adjustable low-cut and high-cut frequencies. A Stereo Mode selector offers Stereo, Joint Stereo, and Mono options.
specs: |-
  - Formats: AU 64-bit, VST 64-bit, VST3 64-bit, AAX 64-bit
  - Mac: OS X 10.13 or later, 64-bit host
  - Windows: Windows 10 or later, 64-bit host
  - Channel configurations: Mono->Mono, Stereo->Stereo
  - Loss modes: Standard, Inverse, Phase Jitter, Packet (7 total)
  - Filter slope: 6-96 dB/Oct
  - Low cut / high cut: 20 Hz - 20 kHz default range
  - Verb section with Pre/Post positioning, Amount and Decay controls
  - Stereo Mode: Stereo, Joint Stereo, Mono
  - Weighting: Perceptual / Flat
