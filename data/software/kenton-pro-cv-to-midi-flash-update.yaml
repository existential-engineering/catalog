name: Flash update for the Pro-CV to MIDI
manufacturer: kenton
primaryCategory: utility
categories:
  - midi
url: https://kentonuk.com/product/pro-cv-to-midi-flash-update/
description: Firmware flash update for the Pro CV to MIDI converter, offered as
  a download. The page also explains how to read the installed firmware version
  off the unit's display.
details: |-
  A downloadable firmware image for the Pro CV to MIDI converter. The page links the file directly, so the owner installs it themselves rather than returning the unit.

  To check the firmware version already installed, power the Pro CV to MIDI on while holding the INC button pressed. The software version is shown as a four digit number beginning with 1, displayed in three groups in repetition, for example 10 50. Releasing the buttons returns the unit to normal operation.

  The firmware history on the page lists a single release, version 1052 dated 28 August 2017, which brought improvements to MIDI clock out.
specs: |-
  - Latest listed firmware version 1052, dated 28/08/2017
  - Version 1052 improves MIDI clock out
  - Installed version is shown by powering on while holding the INC button
  - Version number is displayed as [1xxx] in three repeating groups
versions:
  - name: "1052"
