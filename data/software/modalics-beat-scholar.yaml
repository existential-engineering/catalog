description: Beat Scholar is a modern beat-making powerhouse. It presents an
  entirely new way to compose rhythm in the digital domain.
details: |-
  Place any drum on any beat, beat scholar gives you total freedom to create
  drum fills, linear grooves and place them anywhere. Add bars, change measures
  and beat values easily. Beat scholar keeps you in musical context, encouraging
  experimentation and innovation.

  Over 250 carefully curated factory samples, from classic drum machine sounds
  to hand-made synthesized drums, we have the bases covered. Load your own
  custom samples with a simple drag n' drop interface. A wide variety of samples
  for each pad, control the attack, length & pitch to shape them to perfection.

  Built-in effects - minimum hassle, get your samples nice and stylish just by
  turning a couple o' knobs. Divide beats into up to 42 slices and combine
  multiple drums on the same beat. Quintuplets & triplets on the same pattern?
  No problem.

  Easy MIDI file export - drag directly from the plugin's interface to your DAW.
  Use beat scholar to output MIDI to any instrument or even to hardware drum
  machines.
specs: |-
  - macOS compatible
  - Windows compatible
  - iOS compatible
  - Over 250 factory samples
  - Drag and drop sample loading
  - Built-in effects section
  - Beat division up to 42 slices
  - Triplets and quintuplets support
  - MIDI file export
  - MIDI output to hardware drum machines
  - Drum pad sample control (attack, length, pitch)
  - Pitch control
  - Damp control
  - Drive control
  - Distortion control
  - Intuitive beat/pattern visualization
  - Flexible randomization tools
  - Multiple measures per bar
  - Keyboard shortcuts
  - Full screen editor
