details: >-
  Ambi verb hd contains 30 ambisonic room impulse responses, to simulate small
  and large halls, churches, music venues, stairs, bedrooms, exteriors, living
  rooms, cars, studios. Recorded with an ambeo vr mic, these impulses have been
  carefully selected and pre-processed for accurate and immersive listening.


  Ambi verb hd supports ambisonic in/out up to third order (16 channels). It
  provides decay time control, and allows spatial spreading of room reflections.
  The plugin can be used as a direct insert in a track, or in an auxiliary bus.


  Distance can be accurately simulated thanks to the dry/wet balance. Dynamic
  switch between rooms is possible via MIDI program changes.


  Adding reverberation to 360 audio is crucial for source externalization and
  realism. The aim of ambi verb hd is to create such immersive content easily,
  ready for 360 videos, games and vr applications.


  Ambi verb hd is an ambix convolution reverb, supporting high order ambisonics
  up to order 3. The input can be either monophonic (w channel only) or ambix
  with 4 (order 1), 9 (order 2) or 16 audio channels (order 3). The output is an
  ambix stream.
specs: |-
  - Ambix convolution reverb
  - High order ambisonics up to order 3
  - 30 ambisonic room impulse responses
  - Monophonic input (w channel only)
  - Ambix input with 4 channels (order 1)
  - Ambix input with 9 channels (order 2)
  - Ambix input with 16 channels (order 3)
  - Ambix output stream
  - Dry/wet control
  - Decay time control
  - Spatial spreading of room reflections
  - Custom room impulse response loading
  - Mono or ambix (foa) format support
  - MIDI program change for dynamic room switching
  - VST plugin
  - Audio units plugin
  - VST 3 plugin
  - AAX plugin
  - Macos and windows compatible
