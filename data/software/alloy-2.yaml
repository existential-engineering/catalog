details: >-
  Alloy 2 provides key sound shaping effects for your tracks and busses,
  bringing them to life with six processors designed to give character to every
  element of your mix.


  Alloy's 8-band eq combines exceptional sonic quality with precise control.
  Choose from a broad range of classic and surgical filter types to sculpt your
  sound, then refine your settings easily within a spacious and intuitive
  interface. And for extra guidance, alloy's large spectrum overlay provides the
  best visual feedback of any eq available.


  Accentuate the attack of a mix element or blend it back into the mix with
  alloy's simple yet mighty transient shaper. Perfect for upping the smash
  factor on drums and other percussive sounds, the transient shaper can also
  fine-tune the character of hammered or plucked instruments. For greater
  flexibility on more complex material, like drum loops and buses, enable
  multiband mode: you can then independently shape mix elements that coexist
  within a broader frequency range.


  Bring brilliance, warmth, and crunch to your mix with alloy's fully-redesigned
  harmonic exciter. Equally primed to go bold or go subtle, the revamped exciter
  can add harmonic flavor to a wide variety of material, including vocals,
  strings, guitars, drums and more. Emulate the subtle warmth of tube preamps,
  the aggressive grit of tape, the screech of a distortion, and anywhere in
  between.


  Whether you're smoothing out vocals and bass or slamming your drum bus hard,
  the dynamics module helps balance your mix, combining characteristics of
  analog and digital compressors. To make things twice as nice, alloy includes
  two independent dynamics modules, available for creative use anywhere in your
  signal chain. With advanced sidechaining, multiband processing, and parallel
  configuration options, the dynamics module is sure to be among the most
  versatile mixing tools in your arsenal.
