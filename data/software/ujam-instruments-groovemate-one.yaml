description: Groovemate ONE lets you quickly and easily spice up your tracks with that important feel by adding sophisticated percussion patterns.
details: |-
  You've cooked up your track, you've got bass and drums, melodies and chords and yet there's something missing. Why does it still lack taste? Percussion! Think of salt as a spice, working dutifully in the background, a little bitter when consumed in masses. But no dish will come to full expression of flavours without it. Same goes for pop songs and percussion.

  Groovemate ONE quickly and easily spices up your tracks with that important feel. Just select one of the ready-made phrases and adjust them to your needs. Or play the contained instruments yourself, directly via MIDI input.

  The secret of the vibe-machine: percussionists often use sophisticated patterns that work against or around the basic beat and emphasis, such as 3-over-4 and syncopations. Playing or programming these yourself might be tricky unless you're a percussionist yourself. With Groovemate ONE, you just browse through the presets and pick what works for you. Patterns trigger instantly and perfectly in sync with the rest of your session.
specs: |-
  - 30 presets, combi style and solo styles
  - 4 sounds (Shaker, Claps, Tambourine, One Shot Shaker)
  - 9 mix and 4 ambience presets
  - MIDI drag and drop
  - Operating systems: Windows 10 to Windows 11, macOS Catalina (10.15) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta only)
  - Minimum 4 GB of RAM
  - 0.09 GB of disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, AAX, AU 2 and VST 3, all 64-bit only
  - Delivery format: automated installation via the UJAM App, or downloadable installer file
  - Authorization: quick authorization via the UJAM App, or email and password within the plug-in
  - Supported standards: MIDI
  - Works on macOS and Windows with all major DAWs, including Ableton Live, Logic Pro, Pro Tools, FL Studio, Cubase, Studio One, Bitwig, Reaper and Reason
  - All MIDI phrases and included sounds are royalty-free
