description: "Three rare vintage tube compressors in one plugin: Presto 41A, ITA LA1B, and Collins 26W. Musical compression for any source or style. Try it free."
details: |-
  True Dynamics puts three vari-mu tube compressors in one plugin: the Presto 41A, the ITA LA1B and the Collins 26W. Kazrog calls them three of the most sought-after and hard-to-find vintage tube compressors in pro audio, available in plugin form for the very first time.

  The page positions the set as a compression trifecta for any source across any genre, citing vocals, drums, bass, mix bus and masters. Running all three in one CPU-friendly plugin is a workflow argument as much as a sonic one, since the same settings can be carried across the three units for direct comparison.

  Controls are unified across the three models, covering gain reduction, recovery time, mix percentage and level, so each compressor can be auditioned quickly and accurately against the others. A built-in mix knob handles parallel compression, and the internal bypass is fully compensated for reliable A/B comparison.

  Oversampling goes up to 32x with separate settings for real-time and offline processing, adjustable on the fly, and the GUI is resizable.

  The plugin ships as a 64-bit VST, AU and AAX for Mac and Windows (Pro Tools 12 or higher required for AAX), and as VST3, VST2 or LV2 on Linux, all Universal Binary 2 on macOS. It carries a 100% perpetual license for multiple devices with no iLok and no subscription fees. In 2021, True Dynamics was nominated for the 36th annual NAMM TEC Awards.
specs: |-
  - Three vari-mu tube compressor models: Presto 41A, ITA LA1B, Collins 26W
  - Unified gain reduction, recovery time, mix percentage and level controls across all three models
  - Built-in mix knob for parallel compression
  - Fully compensated internal bypass for A/B comparison
  - Oversampling up to 32x, separate real-time and offline settings, adjustable on the fly
  - Resizable GUI
  - Nominated for the 36th annual NAMM TEC Awards in 2021
  - Universal Binary 2 (native Apple Silicon and Intel)
  - Mac: macOS 10.13.x or higher
  - Windows: Windows 10 or higher strongly recommended
  - Linux: VST3, VST2 or LV2 compatible host (tested on Ubuntu, Linux Mint, Debian, Manjaro)
  - Apple M1 or Intel i5 "Ivy Bridge" CPU or newer strongly recommended
  - Pro Tools 12 or higher required for the AAX version
  - 100% perpetual license for multiple devices, no iLok authorization required
