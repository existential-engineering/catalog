description: True Dynamics is a plugin bundle featuring three vintage tube
  compressor emulations — Presto 41A, ITA LA1B, and Collins 26W — designed for
  versatile compression across vocals, drums, bass, mix bus, and mastering
  applications.
details: |-
  True Dynamics bundles three classic tube compressor emulations into a single package: the Presto 41A, ITA LA1B, and Collins 26W. Each plugin faithfully recreates the character of its vintage hardware counterpart, covering a wide range of tonal and dynamic flavors suited to any source material.

  All three compressors share a unified control set including gain reduction, recovery time, and a mix percentage knob that enables built-in parallel compression without any additional routing. Oversampling is adjustable up to 32x and can be set independently for real-time and offline processing.

  The bundle was nominated for the 2021 NAMM TEC Awards and carries a 4.9/5 star rating from over 200 users. Michael Brauer, a 7x Grammy-winning mixer, has publicly endorsed the Presto 41A emulation.

  True Dynamics ships as a perpetual license with no iLok, dongle, or subscription required. It supports installation on multiple devices and is available in 64-bit formats for Mac, Windows, and Linux. A free demo is available with random silent output and preset saving disabled.
specs: |-
  - Three vintage tube compressor emulations: Presto 41A, ITA LA1B, Collins 26W
  - Unified gain reduction, recovery time, and mix percentage controls
  - Built-in parallel compression mix knob
  - Oversampling up to 32x (adjustable for real-time and offline)
  - Resizable GUI
  - Mac: AU, VST, AAX (64-bit); macOS 10.13+; Universal Binary 2 (Apple Silicon + Intel)
  - Windows: VST, AAX (64-bit); Windows 10+; Intel i5 Ivy Bridge or newer
  - Linux: VST3, VST2, LV2
  - Pro Tools 12+ required for AAX
  - No iLok, dongle, or subscription; perpetual license; multiple devices
