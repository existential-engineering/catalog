description: "The ultimate room simulator combining the latest in modulated
  constant-density reverb technology with an interface tailored to the demands
  of modern surround production."
details: |-
  For the most demanding score mixing and post-production workflows. Includes Surround Editing Planes allowing precise definition of reverberation within the surround field, with optional deviation of parameters in front, rear, side, centre or elevated planes relative to the master preset. Supports up to 9.1.6 Atmos. 64-bit Universal Binaries with Apple Silicon and Intel support. iLok required.
specs: |-
  64-bit VST2, VST3, AU and AAX. macOS Universal Binary (Apple Silicon and Intel x64). Two activations included per license. Professional license also unlocks the Standard edition.
