description: Cinematic Rooms Professional is the new standard in transparent and
  realistic room simulation for music, score and post mixing professionals.
  Advanced surround workflow tools allow you to design intricate acoustic spaces
  of incredible purity, supporting channel formats from stereo up to 9.1.6 for
  use with the latest Atmos workflows.
details: |-
  Cinematic Rooms is a reverb dedicated to the intense acoustic demands of surround room simulation. Deep yet accessible, advanced surround workflow tools allow you to design convincing rooms with incredible transparency up to 9.1.6 Atmos. LiquidSonics consulted with industry-leading composers, mixers and post-production engineers, including Alan Meyerson, Marti Humphrey, Steve Genewick and Scott Michael Smith, to design the reverb from the ground up around three stated needs: a room reverb with best-in-class sound, innovative creative tools for complex surround mixes, and a workflow simple and intuitive enough to be fast.

  For the most demanding score mixing and post-production workflows, the Professional edition is the ultimate room simulator, combining modulated constant-density reverb technology with an interface tailored to the demands of modern surround production. It supports stereo, LCR, Quad, 5.0 to 5.1.4, 7.0 to 7.1.6 and 9.0.4 to 9.1.6 channel formats, with decay to 45 seconds or infinity, and ships with 480 presets including 80 post-production rooms plus artist presets from Alvin Wee, Scott M Smith, Simon Franglen and others.

  Surround editing planes are the Professional edition's central workflow feature: parameters can be deviated in the front, rear, side, centre or elevated planes relative to the master preset, for example extending and filtering the reverb tail in the sides and rears, emphasising and widening reflections in the front and side channels, or applying a tempo-synced pre-delay and echo in the rears and elevations. Because every surround plane deviation tracks the master controls, a change to the master preset immediately propagates throughout the space, and the deviations are shown by surround editing indicators beneath each parameter.

  Advanced crossfeed control gives what LiquidSonics calls superior pan tracking. Where other surround reverbs typically create a homogeneous wash of equal magnitude in all channels, the crossfeed controls let you glue the reverb to the source of the action while tracking panning naturally, with additional filtering, level and delay control. The Professional edition also adds reflection and reverb chorus engines, reverb echo, enhanced reflection control, width control and crossfeed disparity definition.

  A dynamics section is exclusive to the Professional edition. Ducking prevents the reverb overwhelming the dry signal and enhances clarity and intelligibility, and because only the reverb is ducked rather than the reflections, the spatialisation of the early room is retained. Compression can be added to thicken the reverb and accentuate the speed of its onset, and a gate, with wet, dry or sidechain trigger options, keeps a reverb tail in check for drums or for creative 1980s-style effects. The ducker and compressor accept an optional external sidechain trigger.
specs: |-
  - Channel formats: stereo, LCR, Quad, 5.0 to 5.1.4, 7.0 to 7.1.6, 9.0.4 to 9.1.6 (Atmos)
  - Decay to 45 seconds or infinity
  - Reverb and reflection roll-off
  - Advanced reverb contouring
  - Pre-delay with sync
  - Level monitoring
  - Surround / True Stereo (optionally +LCR) / Multi-Mono propagation
  - 480 presets, including 80 post-production rooms
  - Artist presets including Alvin Wee, Scott M Smith and Simon Franglen
  - Surround plane parameter editing (front, rear, side, centre, elevated)
  - Reflection and reverb chorus engines
  - Reverb echo
  - Enhanced reflection control
  - Width control
  - Crossfeed disparity definition
  - Ducker / compressor with optional external sidechain trigger
  - Gate including wet / dry / sidechain trigger
  - Clustered surround propagation modes (Professional only, added in 1.3.8)
  - 64-bit DAW required, not available for 32-bit DAWs
  - Windows 7 and above
  - OS X / macOS 10.13 and above
  - VST 2.4, VST3, Audio Unit (AUv2) and AAX Native plug-in formats
  - macOS installers are 64-bit Universal Binaries (Apple Silicon and Intel x64)
  - iLok 2/3, iLok machine activation or iLok Cloud required
  - Two activations per license, both associated with the same iLok account
  - A Professional edition license also unlocks the Cinematic Rooms standard edition plug-in
  - 200 MB hard disk space required
  - At least 8 GB of main memory recommended
  - Modern quad-core (or higher) processors recommended
