description: LiquidSonics' Cinematic Rooms Professional is the expanded edition of Cinematic Rooms, adding artist presets, enhanced dynamics, and advanced surround plane control for immersive audio production up to 9.1.6 Atmos.
details: |-
  Cinematic Rooms Professional combines modulated constant-density reverb technology with an interface tailored to the demands of modern surround production. It is designed for post-production, scoring, and immersive audio workflows requiring advanced surround plane control and expanded dynamics processing.

  The Professional edition includes all Standard edition features plus 480 presets (including 80 post-production rooms) and 150 artist presets from industry professionals such as Alan Meyerson, Steve Genewick, and Scott Michael Smith. Additional surround plane parameter editing enables precise control over how reverberation is distributed across the full speaker array up to 9.1.6 Atmos.

  Unique to the Professional edition are reflection and reverb chorus engines, reverb echo control, enhanced reflection control, width control, crossfeed disparity definition, and a full dynamics section including a ducker/compressor with optional external sidechain and a gate with wet/dry/sidechain triggering options.

  Licensing is handled via iLok 2/3, machine activation, or iLok Cloud. Each license includes two activations and also grants access to the Standard edition. A 14-day free trial is available for both macOS and Windows.
specs: |-
  - Supported channel formats: Stereo, LCR, Quad, 5.1, 7.1–7.1.6, 9.1.6 Atmos
  - Plugin formats: VST 2.4, VST3, Audio Unit (AUv2), AAX Native
  - Platforms: macOS 10.13 and above (64-bit), Windows 7 and above (64-bit)
  - Universal Binaries on macOS (Apple Silicon + Intel x64)
  - Decay time: up to 45 seconds or infinity
  - 480 presets including 80 post-production rooms and 150 artist presets
  - Surround plane parameter editing
  - Reflection and reverb chorus engines
  - Reverb echo control
  - Enhanced reflection control
  - Width control and crossfeed disparity definition
  - Clustered surround propagation modes
  - Ducker/compressor with optional external sidechain
  - Gate with wet/dry/sidechain triggering
  - Propagation modes: Surround, True Stereo, Multi-Mono, LCR + stereo planes
  - Minimum 8 GB RAM recommended
  - 200 MB hard disk space required
  - iLok 2/3, iLok machine activation, or iLok Cloud required
  - Two activations per license; includes Standard edition access
  - 64-bit only
