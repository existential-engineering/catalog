details: |-
  Recreating the sound of a classic synthesizer is no easy task. DCO-106
  lovingly recreates the unique sonic footprint of one of the most iconic
  80s polysynths in exhaustive detail, while adding modern features for
  massively expanded creativity.

  The DCO-106 is both easy to understand and powerful to explore, creating
  a massive array of sonic landscapes, cutting lead sounds, warm and hazy
  pads, punchy synthetic electro drums, and far more.

  Every aspect of the original hardware has been precisely modeled in
  exacting detail, including the rich stereo chorus and multiple voice
  assign modes that defined the character of the original instrument.

  Modern enhancements include three lush reverb modes with a proprietary
  reverb algorithm, a full-featured delay section with tempo sync, an
  expanded LFO section with six waveforms, and MPE support.
specs: |-
  - Every aspect precisely modeled in exacting detail
  - 330+ presets, including original 106 Factory Presets
  - Up to 16-voice polyphony
  - Rich stereo chorus
  - Three lush reverb modes with proprietary reverb algorithm
  - Full-featured delay section with tempo sync
  - Multiple voice assign modes
  - Single-key chord memory mode
  - Expanded LFO section with six waveforms and tempo sync
  - Unison detune for massive lead and bass sounds
  - Advanced one-click UI magnification
  - MPE support
  - Full MIDI control and DAW automation
  - Preset level MIDI mapping/automation
  - Fully compatible with original 106 SysEx commands
