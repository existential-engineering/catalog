description: Dual voice pitch shifter with a creative freeze effect for vocal doubling, pitch shifting and freezing. Adds one or more virtual tracks with LFO-driven dynamic pitch shift and delay for a more natural doubling effect than a chorus or conventional doubler.
details: |-
  TB VoicePitcher 4 is a dual voice pitch shifter with creative freeze effect. Help vocals stand out by adding one or more virtual tracks, with LFO-driven dynamic pitch shift and delay for a more natural doubling effect than a chorus or conventional doublers.

  The unique freeze option can freeze vowels instantly for creative effects. Formant control improves the naturalness of pitch shifting, and the dual pitch shifter creates new harmonies.

  The snapshot selector allows you to quickly change and recall settings for dynamic switching, real-time performance effects and easy automation, with instant vocal doubling at the press of a button.
specs: |-
  - Dual pitch shifter for creating new harmonies
  - LFO-driven delay and pitch changes for natural movement
  - Freeze effect for creative vowel freezing
  - Formant control to improve naturalness of pitch shifting
  - Quick snapshots to instantly change and recall settings
  - Instant vocal doubling at the press of a button
  - Personal, perpetual desktop licence for use on up to 4 computers
  - Resizable user interface, fits every screen and resolution
  - Dozens of color themes
  - Undo, redo and A/B switching
  - Preset management: organize, import and export presets
  - Easy license activation, no hardware dongle required
  - Sample rates of up to 384kHz
  - Windows 10 or up, 64-bit DAW with VST, VST3 or AAX support, Intel or AMD SSE2 processor
  - macOS 10.13 or up, 64-bit DAW with VST, VST3, AAX or AU support, Intel or Apple Silicon processor
  - Linux, 64-bit DAW with VST or VST3 support, Intel or AMD SSE2 processor, glibc 2.31 or up
  - iPadOS / iOS requires an AUv3-compatible host
