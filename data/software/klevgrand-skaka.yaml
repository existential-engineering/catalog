description: Skaka is a sample-based sequencer plugin for shaker percussion
  instruments. It has 12 slots, each with its own instrument, parameters (lots
  of them!) and pattern.
details: |-
  Skaka is a sample-based sequencer plugin for shaker percussion instruments. It has 12 slots, each with its own instrument, parameters (lots of them!) and pattern. Klevgrand built both the sequencer and the sampler from the ground, to optimize this instrument for these types of sounds. Each pattern contains events, with individual parameters like pitch, velocity (as in how fast the instrument is shaken), and envelope.

  With full control over shuffle/swing amount, an advanced humanizer function, internal awareness of in- and out shakes (yes, they sound different), using grids divided into triplets/quintuplets/septuplets, timing fine-tuning and variable sequence lengths, Skaka can get very close to how a human percussionist would sound in almost any tempo without any use of degrading time stretching or similar techniques.

  To top it off, there's a nice reverb, a room simulator and a high shelf filter. Skaka comes with nearly 200 ready-made patterns covering most genres and styles.

  Unlike a "regular" sample player, Skaka also includes a sequencer adapted for the samples used. Each sound is tagged with an offset that tells when the musical accent occurs, and the sequencer takes this offset in account and adjusts accordingly during playback. This is crucial when it comes to controlling the timing of each shake, and in turn to create sequences with the right groove.

  While Skaka already pretty much covered the whole spectra, its toolbox was still missing dirtier, darker and overall grittier percussion sounds. That gap led Klevgrand to look beyond the percussion already recorded and to craft new instruments, experimenting with different containers, materials and contents of shakable stuff until the "darker" percussion set was achieved. All this experimenting resulted in 6 new premium sounding instruments for Skaka, all captured in top-tier stereo recordings.
specs: |-
  - 12 parallel slots, each with individual settings for instrument and pattern
  - 18 different shaker instruments (Egg, Shaker, Tambourine, Caxixi, Single Shot, Ghungroos, Calabash & Seeds + much more)
  - High quality reverb plus room simulation
  - High-precision editing of each pattern, with a plethora of controls for getting the exact right timing, pitch and velocity
  - Wide range of presets covering most genres and styles
  - Advanced and customizable humanizer
  - 8 (or 9) velocity layers with more than 30 round-robins per layer for each instrument (thousands of samples used)
  - 6 new instruments in v1.2 (Pepper Puck, Tin Box, Nut Shells, Pocket Tamb, Match Box, Paper Roll)
  - Double/half time in relation to DAW tempo
  - Resizeable UI
  - Nearly 200 ready-made patterns covering most genres and styles
  - Shuffle/swing amount control, timing fine-tuning and variable sequence lengths
  - Grids divided into triplets/quintuplets/septuplets
  - High shelf filter
  - Requires macOS 10.10 or later (optimized for the M1-processor), Windows 7 (SP1) or later, running an AU, VST or AAX compatible 64-bit host
  - Available for iPad as AUv3
