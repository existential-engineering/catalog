details: |-
  The Matt Greiner Artist Bundle brings together three components:

  Drumforge Matt Greiner — A virtual drum instrument with a vast collection of meticulously captured samples from metal drummer Matt Greiner, mixed by Carson Slovak and Grant McFarland. Includes 2 kicks, 7 snares, 2 tom sets, and a wide range of cymbals, all recorded multi-sampled, multi-layered, multi-velocity in high fidelity. Features an advanced mixing console with channel inserts for in-plugin sound shaping.

  Drumforge Matt Greiner Grooves: Vol. 1 — 972 drum grooves and fills performed by Matt Greiner as MIDI files, compatible with Drumforge Samplers or any DAW.

  Drumshotz Carson Slovak, Grant McFarland & Matt Greiner — One-shot samples for adding punch, clarity, and character to drum tracks. Perfect for mixing and matching with the Drumforge Matt Greiner virtual instrument.

  Purchase includes instant digital download, perpetual license, free lifetime updates, and unlimited customer support.
