description: LMMS is a free, cross-platform music production application for
  creating melodies and beats, synthesizing and mixing sounds, and arranging
  samples in one interface.
details: |-
  LMMS is a 100% free, open source, community-driven project that runs on
  Linux, Windows and macOS. Instruments, samples and plugins are played from a
  typing keyboard or a MIDI keyboard, and the application is bundled with
  ready-to-use content ranging from instrument and effect plugins to presets
  and samples.

  Songs are assembled in the Beat and Bassline Editor, which consolidates
  instrument tracks, and the Piano Roll Editor, which is used to fine tune
  patterns, notes, chords and melodies. Tracks carry full user-defined
  automation alongside computer-controlled automation sources, and MIDI files
  and Hydrogen project files can be imported.

  The bundled instruments include 16 built-in synthesizers, among them
  emulations of the Roland TB-303, the Commodore 64 SID microchip, the
  Nintendo NES and GameBoy and the Yamaha OPL2 chip, plus an embedded
  ZynAddSubFX for polyphonic, multitimbral, microtonal additive, subtractive
  and pad synthesis. Multisample playback covers SoundFont (SF2), Giga (GIG)
  and Gravis UltraSound (GUS) patches and banks.
specs: |-
  - Sequence, compose, mix and automate songs in one interface
  - Beat and Bassline Editor for consolidating instrument tracks
  - Piano Roll Editor for patterns, notes, chords and melodies
  - Note playback via MIDI or typing keyboard
  - Track-based automation with computer-controlled automation sources
  - Import of MIDI files and Hydrogen project files
  - 16 built-in synthesizers plus embedded ZynAddSubFX
  - 64-bit VST instrument support with 32-bit VST bridge on 64-bit Windows
  - SoundFont (SF2), Giga (GIG) and Gravis UltraSound (GUS) multisample support
  - Drop-in LADSPA plugin support
  - Drop-in VST effect plugin support on Linux and Windows
  - Built-in compressor, limiter, delay, reverb, distortion and bass enhancer
  - Bundled graphic and parametric equalizers
  - Built-in visualization and spectrum analyzer
