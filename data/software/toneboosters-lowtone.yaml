description: Innovative bass synthesizer plug-in with three voltage-controlled oscillators, a voltage-controlled noise synthesizer and a re-designed non-linear voltage-controlled filter, built around loudness-domain harmonic synthesis.
details: |-
  TB Lowtone is an innovative bass synthesizer plug-in featuring three voltage-controlled oscillators with a large variety of waveform algorithms, continuous pulse-width modulation (PWM), frequency modulation (FM) and oscillator hard sync, complemented by a voltage-controlled noise synthesizer, parameter modulation and a re-designed non-linear voltage-controlled filter.

  ToneBoosters describes it as the world's first bass synthesizer featuring loudness-domain harmonic synthesis. Loudness perception of tones and harmonics is highly non-linear and frequency and level dependent, as the equal-loudness contours show, so the loudness of a bass note and all its harmonics depends strongly on the note played. Lowtone's loudness-domain algorithms adjust each harmonic individually to compensate for those deviations across frequency.

  The three re-designed VCOs feature more than 30 waveform synthesis algorithms, from conventional square and triangle waveforms to complex, multi-pulsed signals. Each VCO algorithm supports hard sync, continuous pulse-width modulation and frequency modulation, and can run with up to 12 unison voices. Spectral shaping comes from a non-linear VCF with 20 filter types, including dual, triple and quadruple resonance filters.

  Two extended low-frequency oscillators (X-LFOs) can be beat and key synced with a configurable onset delay and cycle count, alongside a conventional ADSR envelope with configurable onset delay and a gate editor for modern production modulation patterns. Reverb, chorus and delay effects and a high-quality peak limiter produce production-ready sounds.

  Lowtone ships with a preset browser supporting sorting, searching and categorization, and cross-platform user patches and libraries shared across Windows, macOS and iOS. A smart randomizer creates new presets with a single click and learns from the patches you have created or imported to generate personalized suggestions. It is also available for iPhone and iPad, as a companion sound editor for Android, and as an in-app purchase for Audio Evolution Mobile Studio.
specs: |-
  - Three voltage-controlled oscillators plus a voltage-controlled noise (VCN) synthesizer
  - More than 30 waveform synthesis algorithms per VCO
  - Hard sync, continuous pulse-width modulation and frequency modulation on all waveform algorithms
  - Up to 12 unison voices per VCO
  - Loudness-domain harmonic synthesis
  - Non-linear VCF with 20 filter types including dual, triple and quadruple resonance
  - Two extended LFOs with beat and key sync, onset delay and cycle count
  - ADSR envelope with configurable onset delay, plus a gate editor
  - Reverb, chorus and delay effects with a high-quality peak limiter
  - Preset browser with sorting, searching and categorization; cross-platform user libraries
  - Smart randomizer that learns from existing patches
  - Resizable user interface that fits every screen and resolution
  - Dozens of colour themes
  - Undo, redo and A/B switching
  - Preset management with import and export
  - Multiple simultaneous instances
  - License activation without a hardware dongle
  - Sample rates up to 384 kHz
  - Personal, perpetual desktop licence for Windows, macOS and Linux, for use on up to 4 computers
