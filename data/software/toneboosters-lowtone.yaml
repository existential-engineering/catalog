description: "The world's first bass synthesizer featuring loudness-domain
  harmonic synthesis for creating deeper, more consistent bass sounds. Features
  three VCOs with 30+ waveform algorithms, non-linear VCF with 20 filter types,
  and a smart randomizer."
details: |-
  Three VCOs plus voltage-controlled noise synthesizer. Loudness-domain synthesis compensates for frequency-dependent loudness perception. Two X-LFOs, ADSR envelope, gate editor. Non-linear VCF with 20 filter types including dual, triple, and quadruple resonance. Hard sync, PWM, FM modulation. Reverb, chorus, delay, and peak limiter effects. Smart randomizer that learns from existing patches. Up to 12 unison voices per VCO.
specs: |-
  Sample rates up to 384kHz. Up to 12 unison voices per VCO. Personal perpetual license for up to 4 computers.
