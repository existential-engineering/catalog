details: |-
  Flavor Pro is a flagship lo-fi multi-effects plugin designed to manipulate samples, melodies, loops, and instruments for modern lo-fi sound production. It transforms audio into a future/retro sonic landscape with extensive creative capabilities.

  The plugin features six powerful effects modules that provide immersive lo-fi control, including pitch flutter, tape saturation, tape dropouts, distortion, and bit sampling. It offers nine analog emulation models including tube, speaker, vinyl, and synth effects with dedicated controls for rate, speed, drift, and mix.

  Users can access 100 inspiring presets crafted by the AIR engineering team, with dedicated controls for manipulating sound characteristics like stereo width, modulation, and vintage-style audio degradation. The plugin includes advanced features like accurate vinyl noise emulation, tape machine drift simulation, and 32 creative EQ profiles.

  Flavor Pro is compatible with Akai Professional MPC and Force standalone hardware, offering seamless integration between standalone hardware and DAW environments with support for systems running version 2.11 or later.
specs: |-
  - Six creative effects modules
  - Nine analog emulation models (tube, speaker, vinyl, synth)
  - 100 factory presets
  - 32 creative EQ profiles
  - Vinyl noise emulation
  - Tape machine drift simulation
  - Compatible with Akai Professional MPC and Force standalone
  - Windows 10/11 and macOS 12-15
  - Native Apple Silicon support
  - Minimum: 4 GB RAM, dual-core 2.5 GHz CPU
  - 10-day trial available
