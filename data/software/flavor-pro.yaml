details:
  - Flavor pro is a flagship lo-fi multi-effects plugin designed to manipulate samples, melodies, loops, and instruments for modern lo-fi sound production. It transforms audio effects into a future/retro sonic landscape with extensive creative capabilities.
  - The plugin features six powerful effects modules that provide immersive lo-fi control, including effects like pitch flutter, tape saturation, tape dropouts, distortion, and bit sampling. It offers nine analog emulation models including tube, speaker, vinyl, and synth effects with dedicated controls for rate, speed, drift, and mix.
  - Users can access 100 inspiring presets crafted by the air engineering team, with dedicated controls for manipulating sound characteristics like stereo width, modulation, and vintage-style audio degradation. The plugin includes advanced features like accurate vinyl noise emulation, tape machine drift simulation, and 32 creative eq profiles.
  - Flavor pro supports multiple plugin formats including VST, AU, and AAX, and is compatible with akai professional mpc and force standalone hardware. It offers seamless integration between standalone hardware and DAW environments, with support for systems running version 2.11 or later.
  - The plugin requires minimal system resources, supporting windows 10/11 and macos 12-15, with recommended specifications of 4gb ram and a dual-core 2.5ghz cpu. It includes native apple silicon support and offers a 10-day trial version for users to explore its capabilities.
