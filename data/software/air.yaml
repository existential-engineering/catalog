details: |-
  Air is a powerful air remixer plug-in. It separates the harmonic content and the noise content of a sound and remixes them.

  The harmonic content consists in pure frequencies, which define for example the pitch of a sound. The noise content is for example the breath in a singing voice or the transients.

  The air plug-in can be used for example to extract and increase the air of a vocal sound.

  Features: partial tracking threshold. Mix between harmonic and air. Wet frequency and wet gain. Output gain.
