description: PSP Xenon is a full band, dual-stage limiter plug-in featuring an integrated leveler, advanced K-System metering, and psychoacoustically optimized word-length reduction. It delivers pristine 64-bit precision processing and operates at sample rates up to 192kHz.
details: |-
  PSP Xenon is a full band, dual-stage limiter plug-in featuring an integrated leveler, advanced K-System metering, and psychoacoustically optimized word-length reduction. PSP Xenon offers pristine 64-bit precision processing throughout its entire signal path, and can operate at sample rates up to 192kHz.

  PSP Xenon is aimed at mastering and other critical audio applications, with a transparent response and an intuitive design.

  Running PSP Xenon in 30-day trial mode or activating it requires a free iLok user ID and the free iLok License Manager application, but no hardware dongle. The license can be activated in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above), and can be moved at any time using the iLok License Manager.
specs: |-
  - Full band, dual-stage limiter
  - Integrated leveler
  - Advanced K-System metering
  - Psychoacoustically optimized word-length reduction
  - 64-bit precision processing throughout the entire signal path
  - Operates at sample rates up to 192kHz
  - Windows 7 - Windows 11 (64-bit VST, VST3, AAX)
  - macOS 10.14 - macOS 15 Sequoia, Intel and Apple Silicon (64-bit AudioUnit, VST, VST3, AAX)
  - AAX supported in Pro Tools
  - Requires a free iLok user ID and the iLok License Manager application, no hardware dongle needed
  - License can be activated in 3 separate locations (computer or iLok dongle 2nd generation or above)
