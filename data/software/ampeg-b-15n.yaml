details: >-
  Defining the sound of electric bass, the ampeg b-15n has been instrumental in
  everything from motown cuts with james jamerson to classic stax records with
  donald "duck" dunn. The 30-watt, 1x15 all-tube power machine is filled with
  character, giving you a thick fundamental note that has been responsible for
  huge records from the '60s and '70s - rock, funk, soul, you name it.


  Accurately capturing the original amp's dual 6l6-powered circuit along with a
  great sounding baxandall eq, the ampeg b-15n bass amplifier could easily
  become your go-to bass amp. Using the best digital emulation technology,
  brainworx recreates the world's most recorded bass tone with ease.


  The two channels 1964 and 1966 both deliver different styles of equally
  legendary tones. The 1964 offers a 25-watt cathode biased circuit, while the
  1966 puts out a 30-watt, fixed bias circuit. The timbre of the 1964 is a bit
  softer, while the 1966 input presents you with more headroom and midrange.


  The b-15n plugin offers further refinement of your sound with brainworx's
  signature fx rack. Here you will find a noise gate that controls any kind of
  possible buzzing in the lows, selectable hp and lp filters which will allow
  you to further sculpt your bass tone. On top of that, you can play with the
  power soak circuit for further distortion avoiding over-boosting your output
  gain.


  42 recording chains with multiple speaker cabinets recorded in a state of the
  art neve equipped studio.
