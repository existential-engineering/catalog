description: Self-Adaptive Versatile Limiter
details: |-
  Frontier is available only for registered D16 software users, who have purchased any product in the past or will do it in the future. It is available free of charge. Quality and performance makes Frontier a perfect tool for almost any studio situation. Its simple and clear interface in combination with excellent sound quality will surely be appreciated by any engineer looking for an efficient way of controlling dynamics of a channel, bus or even master output. Frontier can be used as a very transparent mixing/mastering limiter with just licking the loudest amplitude peaks, or can be utilized more creatively, as a sound shaper, when more extreme settings are at stake.

  Algorithm for automatic gain makeup used in Frontier automatically normalizes the signal's volume after it passes the limiting section, contributing to an efficiency boost when setting the plug-in up.

  Frontier is not just a simple limiter. With a selectable Control Input and optional Soft Clipping, it becomes a quite versatile and creativity-releasing tool.

  Appropriately configured in your DAW, Frontier can act as e.g. a mono ducker (using the Left or Right channel as a control signal for the input feed).
specs: |-
  - Self-adaptive automatic gain makeup algorithm
  - Soft Clip option
  - Configurable Control Input (usable as mono ducker)
  - MIDI Learn for easy controller assignment
