description: DeeTP is a True Peak limiter plug-in that automatically adjusts the
  True Peak value to a set level, solving resampling problems such as those
  caused by MP3 conversion. It uses a proprietary algorithm performing 16x
  oversampling or more while maintaining low CPU load.
details: |-
  DeeTP is a True Peak limiter plug-in developed by Dotec-Audio, designed to address the practical problem of inter-sample peaks that arise during lossy encoding such as MP3 conversion. By automatically adjusting the True Peak value to a user-defined target level, it prevents digital overs that would otherwise be introduced in the resampling stage.

  The plug-in is built around a proprietary oversampling algorithm that operates at 16x or higher rates while keeping CPU consumption low. This makes it viable for use across a broad range of DAW setups without imposing significant performance overhead.

  DeeTP is intentionally focused in scope: it specialises exclusively in True Peak processing, which lets users keep their preferred mastering chain intact and simply insert DeeTP as a dedicated True Peak stage rather than replacing existing limiters or maximizers.

  The plug-in supports VST2, VST3, AU, and AAX formats on macOS (64-bit, OS 10.12 or later) and Windows (32/64-bit). Apple Silicon native support was added in version 1.0.2. English and Japanese manuals are included with the download.

  DeeTP was discontinued in December 2021 and is no longer available for purchase. It was initially released in October 2020 and received two updates before being retired.
specs: |-
