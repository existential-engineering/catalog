details: |-
  Blue cat's Axe Pack is the ultimate software package to shape the tone of your
  favorite axe, and play your instrument "in the box". The blue cat's axiom
  application and plug-in, our multi effects processor and amp simulator for
  guitar and bass, already contains built-in versions of blue cat's destructor,
  re-guitar and late replies.

  Blue cat's axiom is a powerful and open multi effects processor and amp
  simulation software for guitar and bass. Based on the acclaimed destructor
  plug-in for amp simulations, axiom offers an infinite number of exceptional
  tones for your axe.

  Blue cat's destructor is a powerful distortion and amp sim modeling tool
  capable of simulating any kind of distortion: from harsh digital destruction
  to smooth compression or guitar amp simulation (works for clean tones too!).

  Blue cat's hot tuna is a high precision chromatic tuner plug-in that can dim
  or mute the signal when active. The reference frequency can be adjusted to
  support any type of tuning.

  Blue cat's patchwork is a universal plug-ins patchbay and multi fx that can
  host up to 64 VST, vst3, audio unit or built-in plug-ins into any digital
  audio workstation (DAW) in a single instance, with both serial and parallel
  routing options.
specs: |-
  - Multi-effects processor
  - Amp simulator
  - Guitar and bass support
  - Distortion modeling
  - Amp simulation
  - Chromatic tuner
  - Delay and reverb
  - Plug-in hosting (up to 64 VST/VST3/AU/built-in)
  - Serial and parallel routing
  - Guitar tone emulation
