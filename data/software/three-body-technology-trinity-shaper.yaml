description: Trinity Shaper is the next-generation single/multi-band transient shaping plugin, offering a revolutionary approach to dynamics processing with signature control flexibility.
details: |-
  Trinity Shaper is a single and multi-band transient shaping plugin. Mastering the trinity of Attack, Sustain and a proprietary Body stage, it sculpts dynamics with a few knob tweaks, whether enhancing snare punches, reducing decay or amplifying room sounds. With its 'Focus' filters and multi-band mode it can target fully customizable frequency ranges, tightening snare hits by boosting midrange transients, eliminating high-frequency clicks from bass slaps, or fine-tuning dynamics across the entire mix.

  Beyond the conventional Attack-Sustain division found in most transient shapers, Body is a middle stage that completes the Triple-Stage processing. In two-stage shapers the initial 1-10 ms of a drum hit is identified as Attack and everything after it is grouped into Sustain, which then carries the decay, the reverb and any recording noise at once, so any Sustain adjustment affects every sound after the first 10 ms. The Body stage targets the content 20-50 ms after a transient to isolate most of the decaying part of a hit, so decay and tail can be adjusted separately. The lengths of the Attack and Body stages are fully customizable.

  ADAA (Anti-Derivative Anti-Aliasing) technology, also used in Cenozoix Compressor, reduces aliasing and digital distortion, while a refined envelope detection algorithm keeps the processed sound transparent whether a stage is boosted or reduced. Processing is entirely time-domain, which blocks the FFT artifacts that frequency-domain processing introduces. Switchable 2x, 4x, 8x and 16x oversampling is available, along with a switchable Lookahead that detects the signal in advance to smooth the curve of rapid transients, and an optional analog-modeled clipper in place of a cold digital one.

  In single-band mode, High Pass and Low Pass filters focus processing on a specific frequency range at each of the three detected stages: low-mids to tighten a snare without emphasizing high-end clicks, high-mids to add punch without muddying the lows, highs to reduce harshness in a tail while preserving the ringing. Multi-band mode splits the audio into four customizable frequency bands with Attack, Body and Sustain adjusted and monitored separately on each, and its Perfect Reconstruction Filter Banks algorithm achieves zero processing latency and zero static phase shift when no gain processing is applied.

  Side chain controls cover Left/Right and Mid/Side stereo processing modes, channel linking anywhere from 100% stereo linked to 100% dual mono, and an 8-band parametric side chain EQ powered by Kirchhoff-EQ. Activation requires a Plugin Alliance account, and a fully functional 14-day trial licence is available after installation.
specs: |-
  - Triple-Stage processing: Attack, Body and Sustain
  - Body stage targets content 20-50 ms after transients
  - Fully customizable Attack and Body stage lengths
  - ADAA (Anti-Derivative Anti-Aliasing) technology
  - Complete time-domain processing
  - 'Focus' High Pass and Low Pass filters per stage in single-band mode
  - Multi-band mode with 4 customizable frequency bands
  - Perfect Reconstruction Filter Banks: zero processing latency, zero static phase shift with no gain processing
  - Switchable 2x, 4x, 8x and 16x oversampling
  - Switchable Lookahead
  - Optional analog-modeled clipper (Limit)
  - Side chain modes: Left/Right and Mid/Side
  - Stereo/MS linking from 100% linked to 100% dual mono
  - 8-band parametric side chain EQ powered by Kirchhoff-EQ
  - Real-time waveform display, gain change display, side chain monitoring, external side chain
  - Dry mix
  - 20+ presets with preset selector
  - Undo/Redo, A/B switching, user-defined default settings
  - Customizable behavior settings and knob speeds, theme customization
  - Resizable GUI, full-screen mode, GPU accelerated GUI
  - Apple Silicon native support, macOS Retina / Windows high-DPI support
  - Latency: 0 in both single and multi-band modes with oversampling and lookahead disabled
  - Latency: 2x oversampling 144 samples (about 3.3 ms at 44,100 Hz)
  - Latency: 4x oversampling 216 samples (about 4.9 ms at 44,100 Hz)
  - Latency: 8x oversampling 252 samples (about 5.7 ms at 44,100 Hz)
  - Latency: 16x oversampling 270 samples (about 6.1 ms at 44,100 Hz)
  - Minimum system requirements: Intel or AMD CPU with SSE 4.1 instruction set, or Apple Silicon
  - macOS 11 / Windows 10
  - 4 GB RAM and 100 MB disk space
  - 64-bit VST2, VST3, AAX and Audio Unit
  - Activation requires a Plugin Alliance account, with a 14-day fully functional trial licence
