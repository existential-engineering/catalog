description: Trinity Shaper is the next-generation single/multi-band transient
  shaping plugin, offers a revolutionary approach to dynamics processing with
  our signature control flexibility.
details: |-
  Triple-stage processing: Attack, Body (20–50ms post-transient), and Sustain stages with customizable lengths. Proprietary 'Body' stage for enhanced control over the critical post-transient region. Multi-band mode with 4 customizable frequency bands. 'Focus' filters: high-pass and low-pass filtering for targeted frequency processing. ADAA (Anti-Derivative Anti-Aliasing) technology to reduce digital distortions.

  Lookahead function for smooth transient curve detection. Analog-modeled clipper for warm, transparent limiting. Flexible sidechain controls with Mid/Side and Left/Right modes. 8-band parametric sidechain EQ. Real-time waveform display. 20+ factory presets.

  GPU-accelerated GUI with resizable interface and full-screen mode. Zero latency in single-band and multi-band modes (no oversampling/lookahead) 2x–16x oversampling options (3.3–6.1ms latency at 44.1kHz)
