details: |-
  Axon is an FM plug-in instrument with a "neuron sequencer". Triggering 7
  percussion-tuned FM voices, the neuron sequencer, loosely adapted from the
  concept of artificial neural networks, easily creates rhythms and patterns
  unheard of in modern electronic music. With on-board effects and mixing, and
  full MIDI I/O capabilities (in the VST version only) axon drops right in to
  any production environment.

  Axon's hex-based neuron sequencer revolves around seven neurons, which can be
  interconnected in virtually limitless ways to trigger each other, the internal
  voices, and external synths and samplers. The results can be unpredictable,
  but are not random. The purpose of the neuron sequencer is to get away from
  grid pattern generation and to explore longer, less repetitive rhythm
  patterns.

  The sequencer can drive external synths and drum machines as well as its seven
  internal fm percussion voices.

  All new neuron sequencer, a seven-node hexagonal counter sequencer. Seven fm
  percussion-tuned voices, also capable of melodic expression. Unique fm and
  ring mod busses for global fm and ring mod.

  Full MIDI output control (VST only) for driving external synths, drum
  machines, and samplers. Full internal mixer that also controls MIDI output
  velocity, with solo and muting. Internal stereo delay, taken from the best of
  audio damage's delay algorithms, with low- and high-pass filters and a
  playable feedback control. Full MIDI learn mode, for external hardware control
  of all axon parameters.
specs: |-
