details: |-
  Bob Perry Audio crossfader is the ultimate tool for crossfading between two
  signals. Perfect for blending different guitar and bass amps, different
  synthesizers, or any different microphone sounds, for example on drums. Mix
  two signals into one, always maintaining a perfect output volume.

  Gain even more control with the crossfader's integrated cross eq, for boosting
  one signal's lows and cutting the other signal's highs, or vice versa.

  Main features: real sidechaining. Easy-to-use graphical user interface. Fine
  crossfading control. Bypassable integrated equalizer with controls for
  crossover frequency, overlap, and cut/boost (gain). Phase and gain correction
  for the side chain signal.
specs: |-
  - Real sidechaining
  - Easy-to-use graphical user interface
  - Fine crossfading control
  - Bypassable integrated equalizer
  - Phase and gain correction for the side chain signal
  - Windows and Mac OS X support
  - 32-bit and 64-bit versions
  - Universal binaries for os x
  - Retina display support on os x
  - Crossfade gain from -dB to 0db
  - EQ crossover frequency: 60hz to 10khz
  - EQ crossover frequency offset/overlap: 12 semitones (1 octave)
  - EQ gain: 12db
  - Side chain phase correction / delay: 20ms
  - Side chain gain correction: 12db
