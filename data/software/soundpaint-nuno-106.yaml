details: |-
  Nuno-106. The ultra-deep sampled (UDS) Juno-106. Bruno Mars calls it "The Secret Sauce". Beloved for its lush chorus and instant playability, the Juno-106 became a defining voice of the '80s and beyond. Heard on records by Depeche Mode, Max Martin, Aha New Order, Tears for Fears, Talk Talk, Cyndi Lauper, The Prodigy. Later embraced by Daft Punk, Tame Impala, The Weeknd, Calvin Harris, Deadmau5, Mark Ronson, and Vince Clarke, one of the most recorded synthesizers in history. There is a reason they are in all major studios. 106 programs by Chimy. Over 18,500 UDS samples. Ambient, Bass, Brass, Arp, Keys, Leads, Pads, Plucks, Strings and the most famous factory presets ever programmed. The chorus, from Chorus I to Chorus I+II, UDS sampled across every variation. Dozens of expressive variations for each program. You don't just get one Juno pad. You get dozens and with virtually every key deep-sampled. Nuno-106 also unlocks the Juno C.A.F Analog Per Voice Filter.
