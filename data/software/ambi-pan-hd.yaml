details: |-
  Ambi Pan HD is a 3d ambix panner, supporting high order ambisonics up to order
  3. It lets you create 3d positional audio in a minute, ready to embed in 360
  videos, games and vr applications.

  Two different panning views, from above or equirectangular, offer flexibility
  to design complex trajectories. A transparent window allows to pan on top of a
  360 video in equirectangular mode.
specs: |-
  - 3d ambix panner
  - High order ambisonics up to order 3
  - 3d panning (azimuth, elevation, distance)
  - Spatial width control
  - Distance attenuation factor
  - Azimuth/distance pad
  - Azimuth/elevation pad
  - Ambi scene with transparent equi-rectangular window
  - Input: mono, stereo, 4.0, 5.1, 7.1, 8.0
  - Output: ambix (order 1, 2 or 3)
