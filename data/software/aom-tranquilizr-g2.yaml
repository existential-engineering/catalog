description: A second-generation equalizer plugin with fully configurable eight
  bands, per-band channel options, three equalizer types, and dual spectrum
  analyzers.
details: |-
  tranQuilizr G2 is the second generation of A.O.M.'s transparent equalizer,
  expanding to eight fully configurable bands with enhanced capabilities across
  the board.

  Each band can be configured as peaking, shelving, baxandall, or cutting type,
  with independent per-band channel options including Stereo (LR), Left, Right,
  Mid, and Side processing. The frequency range extends from 1Hz to 50kHz center
  frequency.

  Three equalizer types are available: Minimum-Phase, Maximum-Phase, and
  Conventional, each offering different sonic characteristics. Multiple
  gain-bandwidth interaction modes provide further tonal flexibility. M/S
  balance adjustment allows fine-tuning of the stereo field.

  Dual spectrum analyzers are included: a traditional graph analyzer and a
  belt-shaped analyzer for alternative visualization. Automatic Gain
  Compensation and multi-channel support round out the feature set.
specs: |-
  - Eight fully configurable bands (peaking, shelving, baxandall, cutting)
  - Per-band channel: Stereo, Left, Right, Mid, Side
  - Frequency range: 1Hz to 50kHz
  - Gain: -24 to +24dB, Bandwidth: 0.05-10 octaves
  - Three EQ types: Minimum-Phase, Maximum-Phase, Conventional
  - Multiple gain-bandwidth interaction modes
  - M/S balance adjustment
  - Dual spectrum analyzers (Graph and Belt-Shaped)
  - Automatic Gain Compensation
  - Multi-channel support
  - Sample rates: 44.1kHz to 384kHz
  - 64-bit floating-point internal precision
