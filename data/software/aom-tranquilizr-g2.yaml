description: tranQuilizr G2 is an equalizer plugin employing fully configurable eight bands.
details: |-
  tranQuilizr G2 is an equalizer plugin employing fully configurable eight bands. Each band can be configured as peaking, shelving, baxandall or cutting, with center frequency from 1Hz to 50kHz, gain from -24 to +24dB and bandwidth from 0.05 to 10 octaves.

  Every band carries its own channel setting, covering Stereo (LR), Left, Right, Mid and Side, and the plugin adds an M/S balance adjustment alongside multi-channel support. Monitoring channels are selectable across the same Stereo (LR), Left, Right, Mid and Side set.

  Three equalizer types give different sound characters: Minimum-Phase, Maximum-Phase and Conventional. Gain-Bandwidth interaction can be set to Standard, Gentle, Focus or Hybrid, and Automatic Gain Compensation is available. The over-sampler was totally rewritten for this version and is A.O.M.'s fourth generation engine.

  The interface provides dual spectrum analyzers, a graph display and a belt-shaped display, plus a configurable mouse modifier key. Common features across A.O.M. plugins include factory and user presets, snapshots, undo/redo and reset to default.

  Windows builds run on an x64-compatible CPU under Windows 11 (24H2, 25H2) in VST2, VST3, AAX-Native and CLAP formats. Mac builds run on Intel or Apple Silicon under macOS Monterey 12 through macOS Tahoe 26 in VST2, VST3, Audio Unit, AAX-Native and CLAP formats.
specs: |-
  - Eight bands configurable as peaking, shelving, baxandall, cutting
  - Per-band channel setting: Stereo(LR), Left, Right, Mid and Side
  - Band parameter covers from 1Hz to 50kHz center frequency, -24 to +24dB gain and 0.05 to 10 octave bandwidth
  - Three equalizer types of different sound characters: Minimum-Phase, Maximum-Phase, Conventional
  - Automatic Gain Compensation
  - M/S balance adjustment
  - Gain-Bandwidth interaction: Standard, Gentle, Focus, Hybrid
  - Totally rewritten over-sampler (fourth generation engine)
  - Selectable Monitoring Channels: Stereo(LR), Left, Right, Mid and Side
  - Multi-channel support
  - Dual spectrum analyzers: Graph and Belt-Shaped
  - Configurable mouse modifier key
  - Supports 44.1k - 384kHz Sample Rate
  - 64-bit Floating-point Internal Precision
  - Latency Compensation
  - Factory Preset, User Preset, Snapshot, Undo/Redo, Reset to Default
  - Windows: x64-compatible CPU, Windows 11 24H2 / 25H2
  - Mac: Intel / Apple Silicon, macOS Monterey 12 through macOS Tahoe 26
