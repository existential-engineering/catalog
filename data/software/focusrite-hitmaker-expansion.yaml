details: |-
  Software bundle included free with Scarlett 3rd/4th Gen, Clarett+, Clarett USB, and Red interfaces purchased and registered after July 1, 2023. Melodyne Essential and Softube Flow Guitar Essentials are available for registrations after October 30, 2025. Bundle is accessed via registration at customer.focusritegroup.com.
specs: |-
  - Celemony Melodyne Essential — vocal and instrument pitch/timing correction
  - Softube Flow Guitar Essentials — 2 amp simulators and 3 effects
  - XLN Audio Addictive Keys: Studio Grand — Steinway piano instrument
  - Native Instruments MASSIVE — synth engine with 1,300+ presets
  - XLN Audio Addictive Drums 2: Studio Rock Kit — drum samples
  - Sonnox VoxDoubler — vocal doubling plugin
  - Relab LX480 Essentials — 4 reverbs modeled on Hit Factory NYC
  - Sonnox Soften — one-knob EQ/enhancement
  - Brainworx bx_console Focusrite SC — channel strip with preamps
  - Red 2 & 3 Plug-in Suite — EQ and compressor models
  - Klevgrand Essentials Bundle — Korvpressor and REAMP
  - Landr Studio — 2-month subscription with 5 free masters
