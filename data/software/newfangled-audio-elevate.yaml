description: "All-in-one mixing and mastering plugin solution including sections
  for a limiter, EQ, transient shaper, and saturator. Get the right sound with
  customizable frequency bands modeled on your ears."
details: |-
  Elevate Mastering Bundle is an all-in-one mixing and mastering plugin with a multiband limiter, EQ, transient shaper, and spectral clipper. Includes Elevate Mastering Limiter, Saturate Spectral Clipper, EQuivocate Human Ear EQ, and Punctuate Intelligent Transient Designer. Features over 200 professional and artist presets, six different types of metering, and a spectral clipper for a more aggressive sound. 64-bit only. Apple Silicon compatible.
specs: |-
  macOS 10.9+: 64-bit AAX, AU, VST, VST3 (Apple Silicon compatible). Windows 10+: 64-bit AAX, VST, VST3.
