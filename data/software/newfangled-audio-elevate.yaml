description: The most advanced mastering plug-in ever created. This unique multi-band limiter, human-ear EQ and powerful audio maximizer will increase the loudness of your mix while maintaining or improving its dynamic perception.
details: |-
  Elevate is a mastering limiter plugin by Newfangled Audio (distributed by Eventide) that analyzes and modifies gain, speed, and transients across 26 frequency bands in real time. It uses linear phase auditory filters based on the Mel Scale to match the way human ears perceive sound, resulting in a more natural and musical loudness increase.

  The plugin's adaptive algorithms intelligently reduce common limiting artifacts such as pumping and breathing, maintaining or even improving the dynamic perception of your mix at higher loudness levels. A built-in Spectral Clipper is also available for more aggressive coloration and saturation-style processing.

  Elevate includes six different metering types for comprehensive monitoring, plus an Auto Output Level compensation feature that lets you compare the limited and unlimited signals at matched loudness. Band soloing allows detailed inspection of per-band processing.

  The plugin ships with over 66 professional presets crafted by industry engineers, covering a wide range of musical styles and mastering scenarios. A 14-day fully featured free trial is available. macOS 10.9+ and Windows 10+ are supported; the macOS version is Apple Silicon compatible.
specs: |-
  - 26-band multiband limiter with per-band gain, speed, and transient control
  - Linear phase auditory filters based on the Mel Scale
  - Adaptive algorithms to reduce pumping and breathing artifacts
  - Spectral Clipper for aggressive coloration
  - Six metering types
  - Auto Output Level compensation for matched-loudness A/B comparison
  - Band soloing for per-band inspection
  - 66+ professional presets
  - macOS 10.9+ (64-bit), Apple Silicon compatible
  - Windows 10+ (64-bit)
  - Formats: AAX, AU, VST, VST3
