details: >-
  The amt max warm is a highly optimized look-ahead brick-wall limiter,
  equalizer and level maximizer.


  What makes the amt max warm process unique is the approach used for its
  dynamic signal analysis. Internally, the amt max warm uses a special
  processing algorithm to accurately maximize the incoming signal level while
  limiting the ceiling peak levels.


  This approach tends to produce a more natural warm-sound, the amt max warm
  also includes a two-band equalizer (shelving/peaking) with adjustable
  frequencies, making this plug-in an amazing advanced and versatile tool.
