details: |-
  Sub bass including one hundred 808 sub-bass samples available in wav 24-bit format. Perhaps these are some of deepest sub bass sounds ready for any music producer who need to shake his audience.

  All these bass samples were created in hexloops studio using our tr-808 drum machine and analog synth emulations.

  As bonus you will get 58 MIDI files to get instant inspiration and create your bass line in seconds. MIDI files offers you maximum flexibility to edit and change any note, tempo, and pitch of your bass track.

  Sub bass sample pack is perfectly suitable to house, trap, hip-hop, garage, grime, dubstep, dnb, electro, edm and more.
specs: |-
  - 100 sub bass one-shots
  - Wav 24-bit / 96khz / 4,608 kbps
  - 58 MIDI bass loops
  - Xsub (VST/AU) plugin
  - Compatible with fl studio
  - Compatible with ableton live
  - Compatible with logic pro
  - Compatible with reason
  - Compatible with reaper
