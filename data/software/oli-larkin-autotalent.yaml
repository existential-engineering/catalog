description: Autotalent is a real-time pitch correction plug-in. You specify the
  notes that a singer is allowed to hit, and Autotalent makes sure that they do.
details: |-
  Autotalent is a real-time pitch correction plug-in. You specify the notes that
  a singer is allowed to hit, and Autotalent makes sure that they do.

  You can also use autotalent for more exotic (cher / t-pain) effects. It also
  can be used as a pitch shifter or for faux vocal doubling.

  Oli larkin did the VST/AU port of tom baran's open source pitch correction
  ladspa plug-in. All credit goes to tom for the algorithm.

  At the moment it is designed to be used on a mono track, if used on a stereo
  track, the left channel will be copied to the right.
specs: |-
  - Real-time pitch correction
  - Ladspa plugin
  - Mono track processing
  - Pitch shifter
  - Vocal doubling
  - Note specification control
