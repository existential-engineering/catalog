details: >-
  Randomisers series is a themed sample library collection for modern producers
  and composers. It includes recordings of real, modeled, synthesized and
  designed instruments, resulting in an original palette of inspiring sounds for
  creators of electronic and organic music.


  The 1.2 engine features two multisample, 3 round robins sound sources, a twin
  step sequencer, an arpeggiator (and yes, they work in tandem.), step effects,
  trails layer, a sequence MIDI drag & drop function, a crystal generator and
  the trademark intelligent randomisation function which allows to generate
  fresh and useful sounds every time.


  On-the-fly reverseable sounds: reverse sounds on the fly. Adjust the sample
  start of reversed sounds with the mod wheel. Mutate your sound layers with
  180+ effects included in each of the two new convolvers. Play both sound
  sources at once (single map mode), one per key zone (dual map mode) or
  randomly (random map mode), creating interesting changing textures.


  Audiofier's new "intelligent" randomiser feature makes it incredibly easy to
  create new sounds quickly and makes presets redundant. Sounds can be
  randomised fully, or within one or a blend of two of the 5 available sound
  categories. It also possible to recall past randomisations and go back and
  forth in the randomisation history, also recalling past randomisation on the
  fly.


  Includes a selection of bowed stringed instruments like violin, viola, cello,
  bass, but also bowed guitars and ethnic instruments, woodwinds like duduk,
  kaval, bamboo flutes, ocarina and gralla. Female voices. The different
  categories include natural instruments samples, granulised, ambient, designed
  and spacey sounds. 205 + 20 multisampled sound sources. Over 22gb, ncw over
  8500 samples.
