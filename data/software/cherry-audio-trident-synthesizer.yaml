description: >-
  Cherry Audio's Trident Mk III synthesizer revives the multitimbral experience
  and sonic capabilities of the original Trident hardware synths while
  exponentially enhancing them with modern features.
details: |-
  Cherry Audio's Trident Mk III synthesizer is a stunning virtual instrument
  that not only revives the multitimbral experience and sonic capabilities of
  the original Trident Mk I and Mk II hardware synths but also exponentially
  enhances them, offering an unparalleled combination of innovation and
  authenticity.

  Cherry Audio has meticulously recreated each section of the original Trident
  hardware - the sweeping Synth, the bold Brass, and the stirring Strings - and
  enhanced the entire ensemble with additional features. The voice count has been
  increased to 16 for each section, and now includes velocity sensitivity and
  aftertouch, as well as polyphonic aftertouch.

  The synthesizer section features two VCOs with a multimode filter per voice,
  two envelope generators, and a dedicated modulation generator. The brass
  section includes a dedicated filter with vibrato and auto damp, while the
  string section offers a dedicated filter with equalizer and bowing control.
  All three sections can be layered and split across the keyboard.

  Trident includes a 16x2 polyphonic step sequencer, two assignable dynamic
  arpeggiators, four independent customizable effect chains with 20
  studio-quality effects, and over 380 professionally designed presets in 14
  categories.
specs: |-
  - Based on the 1981 Mk I and 1982 Mk II Trident analog polyphonic synthesizer
  - Three sections: Synthesizer, Brass, and Strings each with up to 16 voices
  - Polyphonic Synthesizer section with two VCOs and multimode filter per voice
  - Paraphonic Brass and String sections with dedicated mixers
  - Velocity, aftertouch, and polyphonic aftertouch support
  - Independent key range assignment for layering and splitting
  - 16x2 polyphonic step sequencer with DAW clock synchronization
  - Two assignable dynamic arpeggiators with Arp, Leap, Order, and Random modes
  - Swing, Chance, and Feel groove controls
  - Four independent customizable effect chains with 20 studio-quality effects
  - Over 380 professionally designed presets in 14 categories
  - Pedal expression independently assignable to sections
  - User-adjustable oversampling control
  - Complete MIDI control and DAW automation
  - Focus zoom-in feature and UI zoom/resize
