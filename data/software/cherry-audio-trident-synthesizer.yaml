description: The Trident Mk III synthesizer is a stunning virtual instrument
  that not only revives the multitimbral experience and sonic capabilities of
  the early 80s Trident hardware synths but also exponentially enhances them,
  offering an unparalleled combination of innovation and authenticity.
details: |-
  In 1981, Korg introduced a synthesizer called the Trident to the music world. This versatile, multi-timbral, multi-section analog polyphonic synthesizer included three instruments: a robust polyphonic synthesizer, a smooth string machine, and a powerful brass section. This combination made it a comprehensive tool for creating symphonic sounds. In 1982, Korg released an enhanced “Mk II” version of the Trident. Over the years, it has been featured in the music of various artists, including Keith Emerson, Paul Humphreys of OMD, and Rick Wakeman of YES. Musicians such as Boards of Canada, Tycho, Phoenix, and Pulp have also used the Trident in their work.

  Despite its innovative features, the Trident never reached the same level of popularity as the Prophet-5 or the Jupiter-8. The Trident faced several challenges, including its high price, complex design, and unfortunate timing. When Yamaha's DX7 introduced affordable digital synthesis, it overshadowed the Trident's warm analog sound. As the music scene shifted toward digital instruments like the Korg M1 and Roland D-50, the Trident faded from prominence.

  Each section of the original Trident hardware has been recreated, the Synth, the Brass, and the Strings, with additional features across the ensemble. Each section now offers 16 voices. The Synthesizer section is fully polyphonic, with a filter for each voice, allowing for independent shaping. The Brass and Strings sections remain paraphonic, like the hardware, each having its own filter to shape their ensemble character. In addition to supporting velocity, Trident Mk III offers both channel and polyphonic aftertouch.

  The all-new Motion panel allows users to assign key splits and layers using both one-click Quick Split templates and draggable zone controls. It also features discrete vibrato controls for each section, aftertouch assignment, a transposable 32-step polyphonic sequencer, and two advanced arpeggiators that can be customized. These features enable users to set up and play the Synth, Brass, and String sections simultaneously in various ways.

  The original Trident hardware featured a single BBD flanger and a built-in ensemble effect for Strings. Trident Mk III offers an expanded set of Effects panels with 20 different effects. Chains of up to five effects can be arranged in each section, Synthesizer, Brass, and Strings, plus a Global effects chain that processes all three sections together. Each effect pedal can be adjusted, bypassed, reordered by dragging, copied, soloed, and duplicated, chains can be saved and recalled for use in other presets, and a dedicated LFO Effect Modulator can modulate entire chains.
specs: |-
  - Based on the 1981 Mk I and 1982 Mk II versions of the Trident analog polyphonic multitimbral synthesizer
  - All three sections (Synthesizer, Brass, and Strings) recreated and enhanced with expanded functionality and modulation options
  - Up to 16 voices for each section
  - Polyphonic Synthesizer section with dedicated mixer
  - Paraphonic Brass and String sections with dedicated mixers
  - Support for velocity and aftertouch (including polyphonic aftertouch with compatible controllers) and pedal expression, independently assignable to the sections to control volume, filter, and modulation
  - Synthesizer voice modes: Monophonic, two Polyphonic modes, or 2, 4, 6, or 8 Unison
  - Two VCOs: one with sawtooth, pulse width, and PWM waveforms; the other with sawtooth, triangle, and pulse width
  - VCF per voice with LP, HP, Band, or Notch response and keyboard tracking, based on the original's SSM 2044
  - Two envelope generators (EG) in the Synthesizer section
  - Syncable dedicated Modulation Generator (LFO) with triangle, sawtooth, ramp, square, and sample & hold waveforms, with delay and retrigger
  - Brass section: dedicated filter with cutoff, resonance, EG intensity, auto damp; dedicated vibrato with delay and EG; silence note and multi-trigger options
  - String section: dedicated filter with attack/release envelope, equalizer, bowing control, and vibrato with delay
  - Master Mixer with stereo panning, transpose, and master tune
  - Pitch bend and vibrato joystick controls, with glide for the synthesizer section
  - Hideable switching lower panels for Keyboard, Motion, and Effects
  - Independent key range assignment for all three instrument sections for layering and splitting, with crossfade, assignable through draggable zone handles or “Quick Split” templates
  - 16x2 polyphonic step sequencer with start, stop, and auto start options, with DAW clock and step synchronization
  - Notes and chords can be programmed as steps with ties and accents, with Pattern A and Pattern B variations and combinations, and patterns are transposable during live performance
  - Two assignable dynamic arpeggiators with four modes: Arp, Leap, Order, and Random
  - Swing, Chance, and Feel groove controls for both the sequencer and arpeggiators
  - Four independent customizable chains of effects, one for each instrument section plus global, with an effect modulator for each layer
  - 20 studio-quality effects that can be arranged, saved, and recalled within the four effects chains: BBD Flanger, Compressor, Digital Delay, Digital Reverb, Distortion & EQ, Dual Delay, Dual Ensemble, Dual Phaser, Envelope Filter, Flanger & Chorus, Galactic Reverb, Lo-Fi, Lushverb, Ring Modulator, Seven Band EQ, Spring Reverb, Tape Echo, DCO Chorus, Panner, and Pulser
  - Mini UI effects footer tray with controls for on/off, solo, bipolar modulator amount slider, and dry/wet mix for each effect, plus Global FX on/off, level, and stereo expand
  - Effect chains can be shared with Cherry Audio's Mercury-8 and most releases from October 2025 onward
  - Over 380 presets in 14 categories, accessible in a preset browser
  - Standalone virtual instrument and plug-in versions included
  - User-adjustable oversampling control
  - Complete MIDI control and DAW automation for all controls, with MIDI learn and mapping (Preset and Global)
  - Focus zoom-in feature, as well as standard UI zoom and resize via drag
  - Complete documentation available directly online from the instrument or in downloadable PDF format
  - macOS Requirements: macOS 10.13 or above. 64-bit required. Intel or Apple Silicon processor. 3.4 GHz Quad-Core or Apple Silicon CPU with 8GB of RAM is recommended. Hard disk space: 110 MB.
  - Windows Requirements: Windows 7 or above (including Windows 11), 64-bit required. 3.4 GHz Quad-Core computer with 8GB of RAM recommended. Hard disk space: 110 MB.
  - Internet connection required for product activation
