description: Comprehensive delay plugin with 30 built-in echo styles modeled on
  classic hardware including EchoPlex, Space Echo, and Memory Man. Features groove
  controls, stereo modes, and a 16-tap Rhythm Echo mode.
details: |-
  EchoBoy is a comprehensive delay effect plug-in that consolidates decades of vintage echo technology into a single, modern tool. The plugin includes 30 built-in styles modeled on classic hardware units like EchoPlex, Space Echo, Memory Man, and DM-2. It features warm, tape-inspired saturation derived from vintage Ampex recording equipment.

  The plugin is specifically designed for musicians, making tempo-locked delays straightforward while offering advanced groove controls including shuffle, swing, and accent adjustments. Beyond basic delay functions, EchoBoy provides stereo echo modes and a distinctive Rhythm Echo mode with up to 16 customizable taps for creating unique rhythmic delay patterns.

  For deeper sound design, the Style Editor allows fine-tuning of analog saturation, tape wobble, and diffusion characteristics.
specs: |-
  - 30 pre-configured echo styles modeling vintage gear
  - Single Echo, Dual Echo, and Ping-Pong stereo modes
  - Rhythm Echo mode with up to 16 customizable taps
  - Groove controls: shuffle, swing, accent
  - Style Editor for saturation, tape flutter, and diffusion control
  - CE-1 chorus emulation
  - Tempo-synchronization capabilities
  - 64-bit only, sample rates 44.1 kHz to 192 kHz
  - Apple Silicon compatible
