name: APU Spectrum Analyzer
manufacturer: apu-software
primaryCategory: effect
url: https://apu.software/spectrum/
description: The APU Spectrum Analyzer plug-in is a free spectrum analysis tool
  supporting a variety of fft configuration options.
details: |-
  You can adjust the fft window type (rect, hann, hamming, blackman, kaiser) and
  size (from 64 up to 65536) to suit your needs.

  Quickly switch between standard db ranges or auto-range and view the frequency
  spectrum in log, linear, or note-based scale.

  Supports histogram hold for measuring long term frequency response.

  You can also adjust the bucket size independent of the fft size and take
  snapshots of the frequency response for reference.
specs: |-
  - Fft window types (rect, hann, hamming, blackman, kaiser)
  - Fft size (64 to 65536)
  - Standard dB ranges
  - Auto-range
  - Log frequency scale
  - Linear frequency scale
  - Note-based frequency scale
  - Histogram hold
  - Bucket size adjustment
  - Frequency response snapshots
  - Universal 2 binary
