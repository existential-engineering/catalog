description: "Comprehensive stereo toolkit and audio visualization suite for
  mastering and post-production, combining M/S encode/decode, stereo field
  control, monitor controller, extensive metering, and loudness analysis."
details: |-
  Dualism is a complete toolkit for stereo work, featuring a comprehensive audio visualisation suite. Used as a final stage in mastering and monitor control, and at the top and bottom of every channel, Dualism ensures absolute stereo mastery. It includes channelstrip input controls, M/S encode and decode, high-pass filters for Mid and Side channels, comprehensive stereo field control, and monitor controller functionality with dual-input A/B support. The visualization suite includes FFT Spectrum Analyser (Octave, 1/3rd Octave, 1/12th Octave), 2D and 3D Spectrographs, Lissajous and Oscilloscope displays, Phase Meter, Correlation Meter, Bit Scope, and full ITU1770/EBU R128/ATSC A/85 loudness metering with loudness history and histogram display. Full-screen mode with PNG screenshot capability is included.
