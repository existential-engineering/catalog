description: Comprehensive stereo toolkit and audio visualization suite for mastering and post-production, combining M/S encode/decode, stereo field control, monitor controller, extensive metering, and loudness analysis.
details: |-
  Dualism is a complete toolkit for stereo work, featuring a comprehensive audio visualisation suite. Used as a final stage in mastering and monitor control, and at the top and bottom of every channel, Dualism ensures absolute stereo mastery.

  The input section provides channel-strip style controls for A/Bs, signal correction and gain structuring, including M/S encode and decode, high-pass filters for Mid and Side, and monitor controller functionality. It supports dual inputs with crossfade and delay for A/B comparison of signals.

  The visualisation suite includes PPMs and Bendymeters, a fully featured FFT Spectrum Analyser with Octave, 1/3rd Octave and 1/12th Octave displays, 2D and 3D Spectrographs, Lissajous and Oscilloscope displays, Phase and Correlation meters, a 1/3rd Octave RMS Analyser, Phase Spectrum analyser, Bit Scope, and full ITU1770/EBU r128/ATSC A/85 loudness metering with short-term loudness history and histogram display, plus full-screen mode with PNG screenshot capability.

  According to the manufacturer, Dualism started out as a mastering tool for easy A/Bs between tracks and grew to include channel-strip niceties and monitor-controller features, handling edge cases of everyday audio work that would otherwise require a collection of disparate tools.
specs: |-
  - Fully equipped stereo toolkit
  - Input section for A/Bs, signal correction and gain structuring
  - Stereo processing section with Width, Mid -> Side and Side -> Mid
  - M/S encode and decode
  - High-pass filters for Mid and Side
  - Comprehensive stereo field control
  - Monitor controller functionality
  - Supports dual inputs with crossfade and delay for A/B of signals
  - PPMs and Bendymeters
  - Fully featured FFT Spectrum Analyser
  - Octave, 1/3rd Octave and 1/12th Octave displays
  - 2D and 3D Spectrographs
  - Lissajous and Oscilloscope displays
  - Phase Meter and Correlation Meter
  - 1/3rd Octave RMS Analyser
  - Phase Spectrum analyser
  - Bit Scope
  - ITU1770 Short-Term loudness history and histogram display
  - Full ITU1770 / EBU r128 / ATSC A/85 loudness metering support
  - Full-screen mode and PNG screenshots
