name: Atom
manufacturer: audiomodern
primaryCategory: synthesizer
url: https://audiomodern.com/shop/instruments/atom
description: Introducing Atom, a unique new virtual instrument for Kontakt with
  a powerful custom engine fully equipped to spark your creativity.
details: |-
  Atom is a unique new virtual instrument for Kontakt with a powerful custom
  engine fully equipped to spark your creativity. The machine is built around a
  beautifully diverse collection of intricate textures and organic elements,
  that were created from a huge collection of field recordings, custom made
  acoustic instruments including a tuned anker, propellers, the famous koka's
  experimental box even a wwii torpedo and analogue machine noises, which were
  then painstakingly recorded, edited using the most advanced sound design
  techniques and finally assembled into a stunning collection of abstract
  cinematic & experimental organic elements.

  A unique sound design tool to create a huge range of distinctive cinematic
  sounds, otherworldly atmospheres, mesmeric drones, emotive synths, noisy pads,
  organic keys, impressive cinematic fx, transitional elements, impacts and
  melodic motifs each with its own character and concept behind the creation
  hand-crafted with passion, innovation and technology.

  This virtual instrument plugin comes with 3,000+ samples, a highly versatile
  collection of on board effects, an incredibly intuitive multi-layer engine
  with separate effects and arpeggiator engine for each layer to provide
  hundreds of sonic combinations. Atom has two layers of sound sources. The same
  180+ sources are available on both layers and you can mix and match as you
  need to.

  Atom features a custom convolution reverb impulse engine, full synthesiser
  lfos, filters, envelopes and a powerful dual arpeggiator engine for those
  looking to take their sound further than the preset patches.

  Atom is preloaded with over 180 exquisitely crafted presets divided into five
  main categories atmo, keys, fx, percussive & synthetic. Each sound can be
  shaped into lush evolving pads, dense uplifting chords, strange acoustic
  tones, deep textures, ambient soundscapes, layered ambiences, impacts,
  transitional cinematic fx and elements for adding drama and movement into your
  compositions with all advanced features that allow unlimited flexibility over
  morphing, manipulating and processing.
specs: |-
  - Kontakt instrument plugin
  - VST3 Audio Unit AAX
  - 180+ sound-sources
  - 7.2 total GB of sounds (compressed to 6.73 GB using .ncw lossless format)
  - Full keyboard range of sample playback
  - Multi-layer engine
  - Individual effects for each layer
  - Individual arpeggiator for each layer
  - Random sequence generator
  - Custom convolution reverb impulse engine
  - 24-bit/48khz resolution
  - Full synthesiser LFOs
  - Filters
  - Envelopes
  - Dual arpeggiator engine
  - 180+ exquisitely crafted presets
  - 3,000+ samples
  - NKS-ready (komplete kontrol compatible)
