details: |-
  Band-in-a-box (biab) is an intelligent automatic accompaniment program for
  your computer. You can hear and play along to many song ideas and go from
  "nothing" to "something" in a very short period of time with band-in-a-box as
  your "on demand" backup band.

  Band-in-a-box is a powerful and creative music composition tool for exploring
  and developing musical ideas with near-instantaneous feedback. Over the years
  many features have been added to band-in-a-box - notation, lyrics, melody
  tracks, harmonization, and a programmable stylemaker.

  The soloist and the melodist are two major "intelligent" features; the soloist
  generates professional quality solos over any chord progression, the melodist
  can create songs from scratch with chords, melodies, intros, solos, and even a
  title.

  Band-in-a-box for windows can also record an acoustic instrument or voice to
  add to the composition, with processing through directx and VST audio effects.
  Its built-in audio harmonies will turn your audio track into multiple harmony
  parts and even adjust its pitch by tracking the band-in-a-box melody track.

  With the VST plugin, you can type in chords, choose the style you'd like and
  generate your arrangement from the comfort of your digital audio workstation
  (DAW). The VST DAW plugin is included with any band-in-a-box 2020 package.
