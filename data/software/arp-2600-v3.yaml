details: |-
  The arp2600 v is a reproduction of the arp 2600. Introduced in 1972 with its
  "blue meanie" version, the arp 2600 has evolved over the years to become a
  synthesizer celebrated by respected musicians. Capable of creating amazing
  sounds thanks to the exclusive arp technologies, it can be operated with or
  without patch cords since all of the functions are internally wired and can be
  controlled via sliders and switches.

  With the arp2600 v, arturia brings this powerful semi-modular synthesizer back
  to life. Offering all the features of the original version, arturia has added
  new functions such as MIDI control, polyphony, and, hidden behind the speaker
  panels, tracking generators and additional effects.

  The 2600 was a "partial modular" synth which means that it wasn't as flexible
  as a fully modular synth, but it had more flexibility than the hard wired osc
  to vcf to vca signal chain that most every other synth comes with.
specs: |-
  - 3 voltage-controlled oscillators
  - Low pass resonant filter
  - 1 LFO synchronized to host sequencer tempo
  - 1 sample and hold
  - Env 1: ADSR
  - Env 2: ar
  - 1 envelope follower
  - 1 ring modulator
  - 1 noise generator
  - 1 arp original sequencer
  - 1 tracker/interactive LFO exclusive module
  - Arp2500 multi-mode 12 dB filter with notch/low shelf filter combination
  - Osc1 and osc2 synchronization
  - 1 chorus
  - 1 stereo delay synchronized via MIDI
  - Updated voltage processors as inverters, mixers or lag processors
  - New keyboard following management
  - Polyphony from 2 to 32 voices with unison
  - More than 400 presets
  - All parameters controllable via MIDI
