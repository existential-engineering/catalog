details: |-
  In partnership with BBC Studios and the world-famous BBC Symphony Orchestra, BBCSO Piano faithfully captures the live concert sound of a pristine Steinway Model D grand, recorded at the iconic home of the BBC Symphony Orchestra, Maida Vale Studios — also host to The Beatles, Hendrix, Bowie, and countless film scores.

  Recorded in concerto position in Studio One, this piano has been captured with the same expertly curated microphone positions, designed to blend seamlessly with the orchestra. Whether paired with the BBC Symphony Orchestra or played as a standalone instrument, BBCSO Piano promises to provide a rich, authentic piano sound suited to any genre.

  Core has been curated to offer a streamlined piano package, featuring one bespoke mix signal and full controls — fully interchangeable with our Discover and Professional editions.
specs: |-
  - Steinway Model D grand recorded in concerto position at Maida Vale Studio One
  - One standard signal mix
  - 4 round robins
  - 6 dynamic layers
  - Reverb, tightness, hammers and pedal volume control
  - Velocity curves
  - NKS ready
  - Approximately 2.8 GB disk space required during install
  - Minimum 8GB RAM, 16GB RAM recommended
  - macOS 11 to 26, Intel and Apple Silicon
  - Windows 10 or 11, 64-bit
  - Spitfire Audio App required
