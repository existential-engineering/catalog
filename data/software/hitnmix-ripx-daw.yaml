description: AI-powered digital audio workstation featuring advanced stem
  separation and note-level audio editing. Separates audio into 6+ stems (vocal,
  instrument, percussion, effects) using AI, with real-time remix capabilities
  including tempo adjustment, pitch shifting, and key/scale modification.
  Includes live effects (reverse, delay, vibrato, harmony, formant shift,
  filters), musical scale detection, copy/paste between tracks with automatic
  tempo matching, acapella creation, and MIDI conversion.
details: |-
  In RipX DAW, audio is stored in Hit'n'Mix's proprietary Rip format. It's a major leap beyond traditional waveforms, giving you full control over every layer of sound.

  Seamlessly mix, experiment, and create with RipX DAW. Combine your favorite parts, then easily adjust tempo, pitch, key/scale, effects, time-stretch, stereo panning (even on mono tracks), volume, and EQ. Craft loops and edit them in real-time for instant new music. Plus, copy and paste parts between tracks with automatic tempo matching.

  Apply powerful built-in live effects ranging from Reverse to Delay to Vibrato. Add Harmony to thicken out a vocal, Shift Formant to change the characteristics or apply a Low/High Pass filter for a different atmosphere.

  To help get the right notes & chords, you can set the musical scale or key of the track, or click Detect and let RipX DAW work it out for you. Notes will snap to the pitches that are part of the scale as you change their pitch by clicking and dragging up/down. Turn on Auto Pitch To Scale and RipX DAW automatically fits notes to the scale, whilst keeping it sounding natural.

  The Randomize effect means you can set up a loop and hear sections of music played back in different scales, to find the one that you like best. Drop your own background image (PNG or JPEG) onto the rip to set the mood when creating music.
specs: |-
  - 6+ stem AI separation of fully mixed audio
  - Note-level editing of each separated layer
  - Proprietary Rip audio format instead of traditional waveforms
  - Create virtual instruments from any single sound extracted from a loop, sample or audio file
  - Replace any instrument or vocal part with another instrument
  - Print Audio to MIDI to load a specific part into a VST of your choice
  - Add FX (delay, reverb and others) to an individual note within an instrument layer
  - Adjust level, EQ and panning of any instrument inside an already mixed audio file
  - Built-in live effects: Reverse, Delay, Vibrato, Harmony, Formant Shift, Low/High Pass filter
  - Musical scale/key detection with Auto Pitch To Scale and Randomize
  - Time-stretch, tempo, pitch and key/scale adjustment in real time
  - Stereo panning on mono tracks, transforming old mono recordings to stereo
  - Copy and paste layers or parts between tracks with automatic tempo matching
  - Chord and note charts for any instrument part within a song
  - Export separated stems straight to WAV
  - Dozens of built-in sounds and loops playable with MIDI
  - Custom background image (PNG or JPEG) per rip
  - ASIO compatible on Windows
  - System requirements: macOS 10.15+ (2012 and later models, including M1 onwards) / Windows 8/10/11 (64-bit)
  - Minimum: 2 core 2.5GHz CPU, 8 GB RAM, 20 GB free disc space
  - Recommended: 4+ core CPU or Apple Silicon M1/M2, 16+ GB RAM, 20 GB free disc space
  - Faster ripping on Windows 10/11 with NVIDIA GeForce 1070/1080/1080Ti/2070/2080/2080Ti/3070/3080/3090/40XX/50XX GPUs with 16 GB RAM
  - Internet connection required for first activation and at least once every 15 runs; offline activation available on request
  - 21-day free trial
