details: >-
  This is a very special bundle that includes air's mini grand and sonivox's
  essential keyboard collection. Mini grand is a simple to use yet powerful
  virtual piano instrument with seven different acoustic piano sounds to suit a
  broad range of musical styles and production needs.


  Essential keyboard collection includes a selection of thirteen powerful
  instruments, each with their own intuitive ui built into one powerful player
  supporting all popular plug-in formats. They can also be used as a standalone
  pc and mac app when you want to plug in your keyboard and just play.


  Ek features stunning piano models, including a steinway grand piano, yamaha
  grand piano, a classic upright piano, celeste, and even a toy piano for times
  when you need a taste of something different. If the electric piano is more
  your thing, you will absolutely love the essential keyboard collection.
  Incredibly authentic, both in playability and sound, ek features all the
  classic models including the rhodes mark I and mark ii, wurlitzer, clavinet,
  and a hard to find pianet.


  The essential keyboard collection includes 20 tonewheel organ presets designed
  to cover jazz, rock, pop and other music styles. If you're looking for
  something more traditional, ek offers a church organ, celeste, and 4
  harpsichord models for classical or worship productions.


  Air essential pianos pack by air music technology / sonivox is a virtual
  instrument audio plugin for macos and windows. It functions as a VST plugin,
  an audio units plugin and an AAX plugin.
