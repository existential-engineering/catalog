description: Cozy's grooves have that perfect lazy feel that comes from hitting the snare just a little late. Combined with drum sounds that have just the right amount of tape warmth and dusty vinyl crackle, this beatmaker will have you vibing in an instant.
details: |-
  COZY delivers laid-back hip hop drums with soft saturation, vinyl crackle, and loose timing. Instant chill with zero setup, just load a kit and vibe.

  COZY lays down warm, textured LoFi beats with soft vinyl crackle and a chilled-out feel, in grooves made to relax, focus and zone in. A "Nostalgia" tone shaper dials in the dusty character, and micro timing gives the lazy swing that LoFi hip hop depends on, across 10 kits and 20 styles with 460 patterns.

  COZY is one of 17 genre-focused drum instruments in the Beatmaker series, all hosted inside a single Beatmaker plug-in that is installed by the UJAM App with your first Beatmaker title.
specs: |-
  - 10 LoFi drum kits
  - 20 styles, 460 patterns
  - "Nostalgia" tone shaper
  - Micro timing for lazy swing
  - MIDI drag and drop
  - Royalty-free MIDI phrases and sounds
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 0.98 GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, 64-bit only
  - Automated installation via the UJAM App, which also installs the Beatmaker plug-in that hosts all titles
  - Authorization via the UJAM App
  - Supported standards: MIDI
