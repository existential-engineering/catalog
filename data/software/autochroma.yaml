details: |-
  Autochroma is a granular effects unit built for fun. It features 3
  simultaneous grain streams, a rolling resample buffer, and a large preset
  library.

  The plugin includes 4 highly customizable modulators and can be used with live
  audio or existing audio files.

  Autochroma can function as a drum thickener, a wow filter, a radio effect, a
  chorus, and even a reverb, extending beyond traditional granular sound design.
