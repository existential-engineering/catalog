details: |-
  Splat-to-Clat is a Neo-Soul and Hip-Hop drum rompler and sequencer built for producers chasing that unmistakable behind-the-beat, humanized groove heard in classic records. It is designed for musicians inspired by the feel and pocket associated with artists and producers like J-Dilla, D'Angelo, Robert Glasper, The Roots, A Tribe Called Quest, Pete Rock, Slum Village, and Wu-Tang-era hip-hop. This instrument focuses on dirty, gritty, grimy drum textures paired with deep groove control—giving you the kind of laid-back, swinging feel where the drums sit slightly behind the beat, creating that unmistakable Neo-Soul and classic Hip-Hop pocket. Neo-Soul & Hip-Hop Drum Philosophy

  What's Included

  Groove & Sequencing Tools

  Sound Shaping & Routing

  Ideal For

  Summary

  Splat-to-Clat is not a clean, modern drum plugin—it's a groove-driven instrument built for feel. With dirty, soulful drum sounds, MPC-inspired swing, behind-the-beat timing control, and a complete all-in-one workflow, it delivers the Neo-Soul and classic Hip-Hop drum vibe that defined a
specs: |-
  - Behind-the-Beat Groove Designed to emulate the late, relaxed pocket heard in D'Angelo-style Neo-Soul and J-Dilla-inspired productions.
  - Old-School Hip-Hop Feel Drum sounds and grooves inspired by the raw, vinyl-era textures of boom-bap, conscious hip-hop, and underground soul-hop.
  - Humanized Timing Grooves feel played—not programmed—perfect for musicians who want swing, push, pull, and pocket.
  - All-Inclusive Drum Library A massive collection of kicks, snares, hats, percussion, chops, and loops—dirty, textured, and ready to play.
  - Built-In MIDI Beats Hundreds of MIDI grooves inspired by Neo-Soul, boom-bap, and laid-back hip-hop—just press play.
  - 36-Pad Drum Engine Classic pad-based workflow for finger drumming and live groove triggering.
  - Import Your Own Sounds Load your own samples and loops and run them through the same groove engine and effects.
  - MPC-Inspired Swing Groove templates modeled after classic swing feels used in hip-hop and Neo-Soul production.
  - Slug Control A dedicated control for laying drums behind the beat—the key to that D'Angelo and J-Dilla-style pocket.
  - Built-In Sequencer Create, tweak, and export drum patterns without leaving the plugin.
  - Dirty & Grimy Processing Shape drums with saturation, filters, distortion, and texture for true old-school character.
  - Per-Pad FX & Routing Route pads to individual outputs and apply insert effects for full mix control.
  - Plugin FX Hosting Load your own VST/AU effects directly inside the drum engine.
  - Neo-Soul producers chasing that D'Angelo-style pocket
  - Hip-Hop beatmakers inspired by J-Dilla, Pete Rock, and Slum Village
  - Artists and producers wanting gritty, soulful drum textures
  - Musicians who want complete drums + MIDI + groove in one instrument
