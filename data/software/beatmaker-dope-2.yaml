description: Beats will keep you warm this winter – your studio is about to heat
  up with the version 2.0 update of the popular beatmaker series.
details: |-
  Beatmaker Dope 2 is a virtual beat maker for street-credible hip hop, boom bap
  and rap tracks. Each plug-in is a specialist for a certain sound and genre
  designed for minimum complexity. Guaranteed to get you producing in no time.

  Select instruments, add creative automated fx, shape the sound in the master
  section. You have creative control over every aspect of your track. We doubled
  the number of kits and more than doubled the included styles and presets.

  All three plug-ins have sizzling-hot new interfaces. They now boast MIDI
  drag-and-drop, so that you can edit patterns in your DAW or trigger other
  instruments. Adding individual outputs for each instrument opens an entirely
  new world of mixing options. There are now more sound shaping controls per
  instrument so that you can fine-tune your sounds to fit your style perfectly.

  Beatmaker dope features a selection of carefully crafted drum kits and loads
  of matching grooves, integrated with professional mixing tools, ready whenever
  you need genre-authentic, great-sounding beats. Drum kits are professionally
  layered, compiled and mixed, but still with enough room for your own
  creativity and to give it your signature sound.

  Vinyl drive simulates retro turntable noise & compression to add that retro
  dirt and punch we all love so much.
specs: |-
  - MIDI drag and drop
  - Multiple audio outputs
  - 10 drum kits
  - Over 60 styles
  - More than 1000 patterns
  - 12 smart mix presets
  - Custom FX algorithms
  - Sweep FX
  - Ambience FX
  - Vinyl drive FX
  - Master section sound shaping
  - Individual instrument sound shaping controls
  - Windows 7 or later
  - Mac OS X 10.11 or later
  - 4 GB of RAM
  - Up to 71 MB of disk space
  - 1280x768 px display
  - Internet connection
  - Logic 10 and newer for AU version
  - Universal 2 binary
