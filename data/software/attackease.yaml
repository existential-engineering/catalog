details: |-
  Attackease takes an audio input (I.e. A drum mic track) and separates the
  incoming audio into two tracks, attack and sustain, with selectable threshold
  and time constants.

  Attack and sustain can be processed separately and then re-combined.

  Internal compressors for attack and sustain are included.

  Really different from a compressor, any external processor can be used to
  further process attack and sustain.

  The plug-in can trigger MIDI notes on attack (with selectable channel and note
  number).
specs: |-
  - Audio input separation
  - Attack and sustain tracks
  - Selectable threshold
  - Time constants
  - Internal compressors
  - MIDI note triggering
  - Selectable MIDI channel
  - Selectable note number
  - Automatable threshold
  - Internal sidechain
  - External sidechain
  - Sidechain filter
  - Separate attack output
  - Separate sustain output
