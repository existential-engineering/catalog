details: >-
  Acoustica 7 is the perfect solution for audio editing, podcast creation,
  mastering and audio restoration on both mac and pc. The application is
  available in a premium edition and a lower cost standard edition. Both include
  a powerful and sample accurate clip editor that lets you navigate and edit
  single track audio with pristine quality.


  The premium edition adds advanced features such as spectral editing with
  powerful retouch algorithms and multi-channel support up to 7.1.2. The new
  acoustica ara plug-in offers the complete functionality of acoustica's clip
  editor and can be seamlessly integrated into digital audio workstations (daws)
  with ara2 support.


  You can also create multitrack sessions where you can import or record audio
  clips to separate tracks that you can mix and process. A large collection of
  plug-ins are included and seamlessly integrated into the application. With the
  premium edition, you can also use these in other host applications supporting
  VST, vst3, AAX or audio units (mac only).


  Acoustica offers support for state-of-the-art audio resolutions up to 32-bit
  and sampling rates up to 384 khz, ensuring that all of your work comes across
  at the highest quality. Acoustica premium edition even supports multichannel
  audio recording and editing such as 5.1, 7.1 or 7.1.2 dolby atmos.


  The flexible user interface with docking window panes gives access to an
  arsenal of real-time analysis tools, including ebu r-128 and itu-r bs.1770
  compliant loudness metering, true peak level metering, phase correlation
  measurements and spectrum analysis.
