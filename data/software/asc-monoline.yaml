name: ASC MonoLine
manufacturer: audiosonic
primaryCategory: synthesizer
description: Asc monoline is a monophonic stereo subtractive synthesizer
  featuring lots of modulatable parameters and a double-filter.
details: >-
  Asc monoline is a monophonic stereo subtractive synthesizer featuring lots of
  modulatable parameters and a double-filter.


  It is capable of producing everything from basslines and 303 sounds to weird
  rhythmic patterns, sweeps and percussion.


  Features include up to 4 note polyphonic capability with 7 waveforms: sine,
  saw, ramp, triangle, pulse, white noise & pink noise.


  The synthesizer includes a flexible bpm syncable lfo with 7 bipolar
  destinations at all times, and two 12db filters available through 2 different
  modes: serial and parallel.


  Four filter types are available for both filters: low pass, band pass, band
  reject & high pass, along with full adsr envelope, distortion and saturation,
  velocity sensitivity and glide (portamento).
specs: |-
  - Monophonic stereo subtractive synthesizer
  - Up to 4 note polyphonic
  - 7 waveforms: sine, saw, ramp, triangle, pulse, white noise, pink noise
  - Flexible bpm syncable lfo with 7 bipolar destinations
  - Two 12db filters with serial and parallel modes
  - Four filter types: low pass, band pass, band reject, high pass
  - Full adsr envelope with user definable bipolar routing
  - Distortion and saturation
  - Velocity sensitivity
  - Glide (portamento)
  - VST plugin
  - Windows compatible
  - Modulatable parameters
  - Double-filter
