description: Inspired by the Mellotron M400. The same sound of the original unit with modern features and more instruments.
details: |-
  Newmello Collection includes volume I, II & III. It brings you back to the sound that shaped an era, the Mellotron M400, with 75 instrument patches.

  Newmello is inspired by the original unit, but no Mellotron was sampled. Instead, how the original unit works and sounds was recreated by sampling 75 custom instruments into cassette tapes using lo-fi cassette decks. It has a very retro and vintage quality to it that evoke the golden era of the 60s and 70s.

  The Mellotron used tape loops with pre-recorded single notes. The instruments were also recorded directly into two different tapes that you can mix however you want. The original unit featured just a few instruments (flute, strings, cello and male choir). Newmello Collection includes 75 instruments ranging from woodwinds to percussion.

  In the main view of the instrument you can control the background noise of the tape. You'll also find a tape blend knob that lets you morph between the two tapes. Adjust the attack and release times and tweak the tone of the instrument with the tilt-style EQ. 75 patches are selectable from the main display.

  In the effects page you can add any effect you want in any order, including EQ, compressors, modulation effects, distortion, saturation, tape machine, reverbs, amp simulators and more. From the settings page you can control round robin using the neighbour-borrowing technique, velocity curve, dynamic range of the samples, start offset of the samples and a loop option.
specs: |-
  - 75 instrument patches
  - 5,214 samples
  - Size: 2.79 GB
  - 2 tape decks with a tape blend knob
  - Round robin: up to 3 (neighbour-borrowing technique)
  - Velocity layers: 1
  - Tilt-style EQ, attack and release controls, tape noise control
  - Effects page with EQ, compressors, modulation, distortion, saturation, tape machine, reverbs and amp simulators in any order
  - Works with Kontakt 5.7.3 and newer versions
  - Full version of Kontakt required; Kontakt Player will run in demo mode
