name: Basskey
manufacturer: nts-audio
primaryCategory: synthesizer
url: https://www.ntsaudio.com/synthesizers/basskey
description: Basskey is a virtual analogue bass synthesizer with top quality
  antialiased oscillators and huge ultraplucked non linear envelopes.
details: |-
  Basskey is a virtual analogue bass synthesizer with top quality antialiased
  oscillators and huge ultraplucked non linear envelopes, specially suited to
  produce rich and hardly plucked basses.

  It is featured with a selectable swing, a sequencer/arpeggiator, a tb-303
  style sequencer and a gate sequencer.

  It has an 'in built' MIDI filter to keep scales and keys in melody creations
  and play chords in any scale or key.

  Sequencer/arpeggiator with random functions can be used to control note
  pitches, velocities or filter track values.

  Scale wizard is an integrated MIDI filtering tool that permits to stay in
  harmony with your song, play chords and chords scales.
specs: |-
  - Virtual analogue bass synthesizer

  - Antialiased oscillators

  - Non-linear envelopes

  - 5 oscillators total

  - 2 antialiased oscillators with saw, square, pwm square and triangle
  waveforms

  - 2 antialiased fat oscillators with highly detunable saw, square and triangle
  waveforms

  - 1 bonus waveform oscillator to load any .wav

  - Amp envelope

  - Filter envelope

  - Pitch envelope

  - Amp lfo

  - Filter lfo

  - Pitch lfo

  - Filter effect (lp, hp, bp, pk)

  - Tone equalizator

  - Delay effect

  - Customized pitch bend

  - Assignable mood wheel

  - Swing

  - Portamento

  - Sequencer/arpeggiator with random functions

  - Tb-303 style sequencer

  - Gate sequencer

  - Scale wizard

  - Integrated MIDI filtering tool



  - Windows compatible
