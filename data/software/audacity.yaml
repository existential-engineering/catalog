details: |-
  Audacity is a free multi-track wave (audio) editor designed for recording,
  analyzing, editing and processing audio.

  Features include full record and edit functionality, import and export of wav,
  aiff, ogg vorbis, mp3 and more formats, with unlimited undo capability.

  The editor includes an amplitude envelope editor, customizable spectrogram
  mode, and a frequency analysis window for detailed audio analysis.

  Audacity supports VST, AU and lv2 plug-ins, with many built-in effects
  available for audio processing.

  Macros and scripting options are available for automation and advanced
  workflow customization. Audacity does not support MIDI recording (import,
  export, basic editing and playback only).
