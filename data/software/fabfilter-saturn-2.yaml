description: FabFilter Saturn 2 is a warm, analog-sounding multiband distortion
  and saturation plug-in. Available in VST, VST3, AU, CLAP, AAX and AudioSuite
  formats for Windows and macOS.
details: |-
  Distortion and saturation play a very important role in music production. From subtle, clean and warm tube or tape saturation to the wildest multiband guitar amp effects: FabFilter Saturn 2 delivers.

  Saturn 2 introduces a host of new features such as a redesigned interface with modulation visualization, new subtle saturation and linear phase processing for mastering, many new distortion styles, and more.

  FabFilter Saturn 2 offers a range of different high quality distortion models, inspired by the vintage sound of tubes, tape, transformers and guitar amps. With 28 different distortion styles and multiband processing with up to 6 bands, it covers everything from subtle warmth to extreme destruction.

  Add life and depth to your music using the extensive modulation section. With 16-step XLFOs, XY controllers/sliders, envelope generators, envelope followers, and MIDI sources, plus an easy drag-and-drop modulation system with a 50-slot modulation matrix, the creative possibilities are virtually unlimited.
specs: |-
  - 28 different distortion styles
  - Multiband processing (up to 6 bands) with optional linear phase processing
  - Adjustable crossover slope (6, 12, 24 and 48 dB/oct)
  - Per-band drive, mix, feedback, dynamics, tone and level controls
  - Live modulation visualization
  - Optional HQ modes: Good (8x oversampling) and Superb (32x oversampling)
  - Interactive multiband display
  - 16-step XLFOs, XY controllers, envelope generators, envelope followers, MIDI sources
  - Easy drag-and-drop modulation with 50-slot modulation matrix
  - Mid/side processing
  - GPU-powered graphics acceleration
  - MIDI Learn
  - Undo, redo and A/B switch features
  - Sample-accurate automation of all parameters
