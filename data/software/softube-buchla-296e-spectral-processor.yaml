description: Buchla 296e Spectral Processor provides high-end spectral filtering
  and processing to be used as a Modular expansion. It features 16 band-pass
  filters, each with its own VCA and envelope follower. The only software
  version of this rare and exclusive module officially licensed by Buchla.
details: |-
  Scratch the surface of any synthesizer, and you'll find the heritage of a few great brands. Buchla has been responsible for some of the most innovative, creative, and sonically spectacular electronic musical equipment ever made, and Softube is proud to have such a legendary name in Softube Modular.

  In addition to the previously released 259e Twisted Waveform Generator, take advantage of the myriad spectral processing capabilities of the big friendly filter bank, the new 296e Spectral Processor, the only software version of this module officially licensed by Buchla U.S.A.
specs: |-
  - Made for Modular, Softube's Eurorack platform
  - Officially licensed and endorsed by Buchla U.S.A., the only such emulation of this rare and exclusive module
  - 16 band-pass filters, each with its own VCA and envelope follower
  - Separate envelope decay times for each band
  - Programmable graphic EQ
  - Real time performance filter
  - Morph between 'A' and 'B' level settings
  - Performs complex spectral transfer functions
  - Special new feature allows for 'playing' the filters with MIDI
  - Use as a vocoder, split into two banks of eight, or using two modules at once for full 16-band operation
  - Externally controllable 'freeze' function stores the input spectrum as envelope values, or A and B levels, in the module's memory
  - Multiband extraction of envelopes from audio inputs
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26, or Windows 10 (64-bit) and Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Internet access required for downloading installers and managing licenses
  - Three activations included
  - 20-day trial and 14-day returns
