description: Puncher 2 Lite is a stripped back version of Puncher 2 that combines a transient shaper, a multiband compressor and a parallel compressor in one streamlined interface. The advanced features and presets of the full version are not included.
details: |-
  Puncher 2 Lite is a reduced version of the Puncher 2 plugin, with the advanced features and presets of the full version removed. The original controls are stripped back to the most useful parts of the interface, which keeps operation simple while retaining the compression and transient shaping of the larger plugin.

  Three processors are combined to give tonal control over transient energy. The main Transient mix dial sets the intensity of the transient shaping, with 5 levels running from no effect at all through to a fully processed signal, which makes kicks hit harder and snares snappier.

  The multiband section divides audio into 4 bands using subtractive IIR filters, producing a real-time linear phase multiband split. Each band carries its own independent compressor, and the combined result is a smooth analog-like effect.

  Parallel compression is applied from a single dial, evening out the dynamics of a track in a natural way. Pushed harder it produces a more pronounced compression effect that suits acoustic material, and the dial is set from 0 to 100 percent in increments of 25 percent.

  The bypass control is smoothed to be as click and pop free as possible, which supports A/B testing alongside the Gain dial. Live before and after waveforms at the centre of the interface show what happens to the signal as it passes through each module in real time, and an onboard preset browser saves and recalls settings.
specs: |-
  - Three stage chain of transient shaper, multiband compressor and parallel compressor
  - Transient mix dial with 5 levels of shaping
  - Multiband section splits audio into 4 bands with subtractive IIR filters
  - Independent compressor on each band
  - Parallel compression dial adjustable in 25 percent increments
  - Real-time before and after waveform display
  - Pop and click free bypass with master Gain dial
  - Preset browser for saving and loading settings
  - PDF manual and tutorial video
  - Advanced features and presets of Puncher 2 are not included
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
