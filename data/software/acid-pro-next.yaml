details: |-
  Acid pro next is the next generation of music production. With a world first for any DAW, it includes zynaptiq stem maker audio source separation technology. It takes a standard stereo file, and separates it into its component tracks for sampling and remixing.

  Acid pro next combines cutting edge sampling technology, a fully featured DAW and unique acidized loops that lock in time and key with your new compositions.

  Acid has always used groundbreaking audio technology for producing music, seamlessly allowing you mix and match sample pitches and tempos. Now acid pro next brings the next generation of sampling to the masses with all-new audio file separation technology.

  Acid pro next includes high quality audio source separation technology, powered by zynaptiq stem maker. Algorithms based on deep learning, as well as patent pending dsp algorithms split your tracks into vocals, drums and music, so you can use these results in your own music and remixes.
specs: |-
  - Audio plugin host

  - VST plugin support

  - VST 3 plugin support

  - Audio source separation

  - Zynaptiq stem maker technology

  - Deep learning algorithms

  - Patent pending dsp algorithms

  - Vocal separation

  - Drum separation

  - Music separation

  - Sample pitch adjustment

  - Sample tempo adjustment

  - Acidized loops

  - Time-lock capability

  - Key-lock capability

  - Processor: 1 ghz (multicore or multiprocessor recommended)

  - Ram: 1 gb (8 gb recommended)

  - Graphics card: onboard, min. Resolution 1024 x 768

  - Sound card: onboard

  - Hard drive space: 700 mb for program installation, up to 16 gb for included instruments and loops

  - Program languages: deutsch, english, español, français

  - Internet connection required for registration and validation
