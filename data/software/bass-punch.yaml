details: |-
  Bass punch has the following controls: boost controls how much you want to
  boost the bass. Length controls some part of the dynamic processing. You have
  to experiment with this to get optimal settings. Freq controls the frequency
  below which the process takes place.

  Bass punch uses the plug-in host's default interface.
specs: |-
  - Dynamics compressor/limiter
  - Windows compatible
  - Boost control
  - Length control
  - Frequency control
