description: Free stereo image analysis plugin that visualizes the spatial sound field, stereo balance, left/right balance spectrum and correlation spectrum in real time.
details: |-
  GonioMeter visualizes the spatial sound field, stereo balance, left/right balance spectrum and correlation spectrum in real time.

  It shows stereo waveforms in 2D, carries a correlation meter for inter-channel issues, a correlation spectrum that instantly identifies problematic frequency ranges, and a left/right pan spectrum for checking that the image stays balanced across frequency.

  ToneBoosters presents it as the tool to ensure that content you create is of high quality and mono down-mix compatible, which it calls an absolute must for mobile entertainment.

  GonioMeter is completely free and included in the ToneBoosters software installer.
specs: |-
  - 2D goniometer display of stereo waveforms
  - Correlation meter
  - Correlation spectrum
  - Left/right pan spectrum
  - Variety of colour schemes
  - Free, included in the ToneBoosters plugin installer
  - Resizable user interface that fits every screen and resolution
  - Dozens of colour themes
  - Undo, redo and A/B switching
  - Preset management with import and export
  - Multiple simultaneous instances
  - License activation without a hardware dongle
  - Sample rates up to 384 kHz
