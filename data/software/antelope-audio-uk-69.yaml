details: |-
  The UK-69 is a 3-Band EQ / HPF plugin modeled on a classic British console equalizer historically used in recordings by iconic artists such as The Beatles and Led Zeppelin.

  The plugin runs natively in your DAW on macOS or Windows, or in real-time on Antelope's Synergy Core audio interfaces, and is also accessible via the Antelope Cosmos subscription that bundles 75+ Antelope native plugins.

  It allows Antelope Audio users to achieve depth and texture formerly the sole territory of standalone hardware. The bass band is a stepped 50 Hz shelf filter or frequency-selectable peak EQ, the treble band is a fixed 10 kHz shelf EQ, and the mid section sports a frequency-selectable peak or notch EQ with 8 frequencies available. The control panel is rounded out with a level knob and EQ bypass buttons.

  This EQ is notable for its ability to preserve transparency while adding space and presence. Antelope Audio's model of this highly coveted circuit delivers unprecedented authenticity.
specs: |-
  - 3-Band EQ with high-pass filter
  - Modeled on a classic British console equalizer
  - Bass band: stepped 50 Hz shelf filter or frequency-selectable peak EQ
  - Treble band: fixed 10 kHz shelf EQ
  - Mid section: frequency-selectable peak or notch EQ with 8 frequencies
  - Level knob and EQ bypass buttons
  - Runs natively in your DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core interfaces
  - Included in the Antelope Cosmos subscription bundle
