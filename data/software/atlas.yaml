url: https://algonaut.audio/
description: Atlas is a sampler powered with artificial intelligence that will
  change the way you find sounds and make beats.
details: |-
  The map: find that perfect sample faster. Atlas' ai can find every drum sound
  on your computer and create a map you can scroll and zoom with all your
  samples in one place. Instant drum kits: find inspiration in randomization.
  One click and atlas chooses 8 samples. Lock or hot swap them individually.
  Rinse and repeat. Tweak how they sound using the combo controls.

  Drag and drop: drag and drop samples from atlas to your favourite
  sampler/sequencer for more control. Atlas can be used as a replacement browser
  for your existing workflow. Like/dislike: the more you use atlas, the more it
  gets to know you. As samples are liked or disliked, atlas learns the styles of
  samples you prefer and helps you hone your sound.

  Analyse your own samples: analyze any of your own sample packs regardless of
  size. Create separate maps for genre, brand, style or however you organise
  your samples. Analysis happens locally, not in the cloud.

  At the centre of all our products is soundclass, our own proprietary ai with a
  little bit of magic that is the first of its kind. It has been built from the
  ground up using customised neural networks, deep learning, and tailored audio
  analysis techniques. We've trained soundclass to be capable of listening to
  any new audio content and determining its category and a description of its
  characteristics.
specs: |-
  - 64-bit only
  - Ai-powered sample classification
  - Map-based sample visualization
  - Instant drum kit generation
  - Drag-and-drop functionality
  - Like/dislike learning system
  - Local sample analysis
  - Soundclass proprietary ai
  - Customised neural networks
  - Deep learning audio analysis
