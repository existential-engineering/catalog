description: The Chord and Arp Monster. VST MIDI-FX Plug-In. Harmonic
  Inspiration, Made Easy.
details: |-
  Cthulhu is a dual-module MIDI effect plugin combining chord generation with pattern-based arpeggio capabilities.

  The Chords Module allows you to experiment with creating and reworking chord progressions with single-note presses. Included are over 150 factory chord presets allowing for a near-unlimited amount of possible musical-sounding chord progressions. Import MIDI or 'record' chords straight in, Cthulhu is able to analyze the chords you play and allow for various sorting options (Circle of 5ths, Chromatic, low note, etc) allowing for easy access over your chords.

  The Arp Module is a unique pattern-based arpeggiator, allowing incoming notes or chords to be manipulated in various rhythmic ways. The 8 tabs of the step sequencer allow you to completely reshape the incoming MIDI notes, even a single note fed into the arp can become a unique and rhythmic riff. Advanced features include chord-arpeggio mode, ties, duration/velocity sequencing, intelligent transpose, harmony, and more. Every tab of the sequencer can operate on its own length, allowing for evolving polymetric arpeggios.

  Logic users are recommended to use Logic X with the included MIDI FX version of Cthulhu. Reason is not supported as it does not support MIDI out.
specs: |-
  - Over 150 factory chord presets
  - Chord analysis with sorting options (Circle of 5ths, Chromatic, low note)
  - MIDI import and chord recording
  - 8-tab pattern-based step sequencer
  - Chord-arpeggio mode with ties, duration/velocity sequencing
  - Intelligent transpose and harmony
  - Polymetric arpeggio support (independent tab lengths)
  - MIDI FX version included for Logic X
