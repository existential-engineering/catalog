details: |-
  Albion 3: iceni is an investigation into low end, thundering enormity, horrifying rasp and obliterating distortion. Featuring over 300 sickeningly fat, grimy, epic and mangled loops by uk-based producers and composers including the flight, stanley gabriel, and christian henson.

  The largest and lowest sets of drums available for use in london, including rare british marching toms, played by the leader and members of the olympic opening ceremony's drum corps. Stephenson's set of synth basses, pads and sequences generated from the largest, assembled world-class, low-end orchestra for a commercial sample project to-date.

  Winds: 2 contra bassoons, 2 contrabass clarinets, heckelphone, 2 bassoons, 2 bass clarinets, 1 bass saxophone. Brass: 2 tubas, 2 cimbassi, 2 contra bass bones, 3 bass bones. Strings: 24 'celli and 8 basses. Recorded both tutti and in two 'celli sections with the 'celli split into two on either side of the room with the basses in the middle.

  Recorded to tape via the rarest set of valve and ribbon mics in the hall at air lyndhurst, one of the greatest recording studios in the world.

  The orchestral tool-set is primitively simple and effective; longs, legatos, shorts, with some of the most mind boggling fx in the brass and woods. They're designed for anyone to use regardless of their experience or understanding of orchestral disciplines and is scaleable on a variety of systems.
