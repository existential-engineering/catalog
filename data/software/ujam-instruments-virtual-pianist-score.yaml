description: SCORE is based on a pristine Steinway Grand specifically tuned and set up for emotional, haunting piano textures. The integrated Pianist player features both basic and virtuoso performances reminiscent of movie and game soundtracks.
details: |-
  If you love movies and games, you know just how much the backing music can make or break the feeling of a story. With more than 175 powerful presets, Virtual Pianist SCORE lets you effortlessly guide your viewers and listeners to the feelings of your story.

  SCORE's complex sound character is based on a detailed study and sampling of the legendary Steinway D Grand Piano, recorded and mixed so you can dial in the perfect sound with a couple of clicks. Great sound that gels with your mix is better still, and SCORE lets you set the tone anywhere from soft and expressive to bright and assertive.

  Skip piano lessons and get straight to making music. Set Virtual Pianist SCORE to Player Mode and choose from over 180 customizable phrases with the feel of a pro, or play freely in Instrument mode.

  Choose between the Abyss, Damped, Mellow, Pure and Royal characters to get the perfect tone for your soundtrack, then finalize the build with 45 Finisher and 45 Ambience settings. In Player mode, the Busyness control sets how many notes the performance plays.
specs: |-
  - Grand piano model based on recordings of a Steinway D Grand piano
  - 5 characters: Abyss, Damped, Mellow, Pure and Royal
  - Over 180 customizable phrases in Player mode
  - 45 Finisher multi-effect modes and 45 Ambience FX presets custom-tailored for SCORE
  - More than 175 presets
  - MIDI drag and drop (use the player with other instruments)
  - Supported standards: MIDI
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 5.68 GB of disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery: automated installation via the UJAM App, which also installs the Virtual Pianist plug-in host
  - Authorization via the UJAM App
  - All MIDI phrases and included sounds are royalty-free
