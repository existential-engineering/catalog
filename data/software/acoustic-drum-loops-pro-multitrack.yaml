  - 24-bit / 44khz

  - 19.8 gigabytes

  - Intros, verses, bridges, choruses, fills, endings, and alternate grooves

  - Multiple style variants

  - Requires presonus studio one version 2.6.4 or higher

  - Macos and windows compatible

  - Windows 7 x64/x86 sp1, windows 8 x64/x86
