description: Designed from the ground up to be easy to access but allow deep
  control when you need it. Hype brings cutting-edge, multi-band compression,
  harmonic generation and stereo placement together in a new streamlined
  workflow.
details: |-
  HYPE offers revolutionary processing tools for compression, harmonics, and
  stereo placement. Each algorithm has been carefully hand tuned to solve a
  specific problem, create a possibility or open the doorway to something new
  and unique.

  Easily combine multiple harmonic generators and compression algorithms to
  drive, saturate, or enhance signals. Apply distinct harmonic modes across
  three bands, allowing for tailored dynamic shaping across low, mid, and high
  frequencies. Hype's Multi-band X-Over can operate in either low latency or
  linear phase mode for pristine phase accurate parallel processing.

  From the extreme Slam and Brick, to the classic Opto, and unique Gated mode,
  Hype's six compressor modes range from radical and over the top to subtle and
  nuanced. The six harmonic algorithms deliver beautiful color from subtle
  excitement to rich saturated overtones. The harmonic engine uses advanced ADAA
  algorithms in tandem with UrsaDSP's Trajectory technology to achieve
  consistent harmonics with substantially reduced inharmonic content.

  Enhance stereo image and depth with complete mid/side settings across all
  three bands and independently adjust dry and wet signals. Over 200 presets
  with categories for common instruments, mix bus, mastering and production
  styles. A B C D variations allow you to load and audition multiple presets.
specs: |-
  - 3-band multiband processing with low latency and linear phase modes
  - 6 compressor modes: Slam, Brick, Opto, Gated, Combo, Gentle
  - 6 harmonic algorithms with ADAA and UrsaDSP Trajectory technology
  - Full mid/side stereo placement per band
  - Independent dry and wet stereo width control
  - Aggregate macro controls for quick multi-band editing
  - Over 200 presets with category filtering
  - A B C D preset variations with copy and paste
  - Per-module preset loading and X-Over locking
  - Tone control for human hearing compensation
  - Introduces harmonics without additional gain change
