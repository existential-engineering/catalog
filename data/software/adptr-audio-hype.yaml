description: Designed from the ground up to be easy to access but allow deep control when you need it. Hype brings cutting-edge, multi-band compression, harmonic generation and stereo placement together in a new streamlined workflow.
details: |-
  HYPE offers revolutionary processing tools for compression, harmonics, and stereo placement. Fulfilling the same role as mixing hardware without falling into the same trope as emulations. Each algorithm has been carefully hand tuned to solve a specific problem, create a possibility or open the doorway to something new and unique.

  Easily combine multiple harmonic generators and compression algorithms in HYPE to drive, saturate, or enhance signals. Apply distinct harmonic modes across three bands, allowing for tailored dynamic shaping across low, mid, and high frequencies. Hype's Multi-band X-Over can operate in either low latency or linear phase mode for pristine phase accurate parallel processing.

  From the extreme Slam and Brick, to the classic Opto, and unique Gated mode, Hype's six compressor modes range from radical and over the top to subtle and nuanced. Combo merges two modes for a unique blending experience, while Gentle offers elegant, minor adjustments ideal for mastering, providing versatile dynamics control for every creative endeavor.

  The harmonic engine in HYPE uses advanced ADAA algorithms, in tandem with UrsaDSP's Trajectory technology in order to achieve consistent harmonics with substantially reduced inharmonic content. Hype introduces harmonics without adding additional gain change, letting you hit the harmonic sweet spot at any gain level.

  Enhance stereo image and depth with complete mid/side settings across all three bands and independently adjust the dry and wet signals to achieve optimum exposure in the mix. By separating the wet and dry width it is also possible to push the harmonics out to create engaging stereo soundscapes from the new tonal content whilst leaving the original signal unchanged.
specs: |-
  - 6 unique, modern compression algorithms with Trajectory envelope detection developed by UrsaDSP
  - 9 high end harmonic generation algorithms with advanced ADAA, developed by Chowdhury DSP
  - Stereo module for mid/side processing on the dry and wet signals across all three bands
  - HYPE knob mixes wet and dry signals for parallel (New York style) processing
  - Multi-band X-Over crossover with adjustable frequencies and per-band gain
  - Linear phase filter mode for parallel, bus and send processing, plus a low latency mode
  - Multi-band gate within the compressor section with Classic and Parallel modes
  - Auto Level for consistent perceived loudness
  - Brick walled final clipper assignable to the full mix or the wet signal only
  - Tone control for a creamier mid range lift or a brighter, more dominant sound
  - Per band gain metering in the compressor section and THD monitoring in the harmonics section
  - Over 200 presets covering drums, bass, vocals, guitars, synths, mixing and mastering, each with mix notes
  - A B C D preset variations with copy and paste between instances and across DAWs
  - Tooltips available from the menu
  - Display resolution: 1440 x 900px or 1280 x 960px or higher
  - Memory: 2 GB RAM
  - macOS 10.11 El Capitan through macOS 15 Sequoia (Intel, or Apple Silicon M1 and M2)
  - Windows 7 through Windows 11 (x64-compatible CPU)
