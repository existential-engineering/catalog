details: |-
  1980 vol.4 for arturia cs-80 v4 and analog lab v synths contains 20 arp presets derived from the classic 80's sound era and carrying this distinct cs-80 sound identity.

  This soundbank has 20 classic synth arps mainly adjusted in sixteenths notes speed. Adjust the gate slider on will to adjust the length of the arpeggiated notes.

  Disable the arp by pushing the on/off button on the arpeggiator section and transform the presets into classic 80's poly synths.

  All presets designed with cs-80 v4.1.0.2880 (x64) and run best with this or newer edition. Analog lab edition: soundbank needs at least version analog lab v 5.6.1.2942 (x64) or newer.
specs: |-
  - 20 arp presets
  - Classic synth arps
  - Sixteenths notes speed
  - Gate slider control
  - Arpeggiator section on/off button
  - Compatible with cs-80 v4.1.0.2880 (x64) or newer
  - Compatible with analog lab v 5.6.1.2942 (x64) or newer
  - 80's sound era
  - Cs-80 sound identity
  - Poly synth transformation capability
