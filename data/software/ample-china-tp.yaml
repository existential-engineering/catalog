details: >-
  Ample china traditional percussion (actp) presents a chinese ethnic percussion
  ensemble, covering a wide range from bass to treble, including membrane, wood,
  and brass instruments. It includes 19 instrument slots totaling 49 percussion
  instruments, such as drum ensemble, solo drum, gongs, cymbals, opera
  percussion, and vocals.


  The actp adopts a dual-layer mixer design. The first layer is the instrument
  track, and each instrument track contains multiple microphone tracks. This
  setup is to adapt to the diverse nature of chinese percussion, as the miking
  configuration for drum ensembles and small wood percussion differs. However,
  every percussion instrument uses the same overhead microphones to ensure tonal
  consistency.


  Ample sound's legato technology from dizi, xiao, and erhu is introduced to
  percussion. Instruments like gongs, cymbals, singing bowls, temple bowls, and
  bells feature various legato expression changes, such as striking a singing
  bowl first and then legato into a sing (the effect of a mallet rubbing
  continuously around the rim).


  Each percussion has an independent adsr envelope modulation system, allowing
  for adjustments of parameters like pitch, velocity curve, and more.


  The drum ensembles and solo drums include articulations such as center, stick,
  rim, rimshot, edge-center, edge, muting with stick, muting with hand, slap,
  nails, roll, rims roll, and expressive roll up to 13 articulations in total.
  The drum ensemble is recorded with 11 microphones, including left 1, left 2,
  mid low, mid high, mid mid, right 1, right 2, overhead, and room.
