description: Wasted Space is a reverb plugin that gives you instant and extreme
  digital lo-fi vibes. It features authentic aliasing artifacts and distortion
  in a perfectly imperfect lo-fi plugin.
details: |-
  When you need extreme digital lo-fi character quickly, the reverb to reach for is Wasted Space. Wasted Space gives you the retro '80s aliasing artifacts currently in vogue in pop and electronic genres and takes them to eleven.

  Put Wasted Space straight on a track to bring elements to the front of the mix or get a full low-fidelity sound by using it on a bus. With Wasted Space, you can go from lackluster to out-of-this-world in a flash.

  With an inspiring retro-futuristic interface and essential features, Wasted Space is the perfect tool for innovative sound design. Wasted Space's variable sample rate lets you quickly find your lo-fi sweet spot. You can use the filter options to sculpt the distortion with 12, 24, and 48 dB/octave types. Off gives you the most aggressively distorted sound, with 48 dB offering the smoothest of the types. The high pass slider lets you reduce the distortion in the high frequencies while keeping the distorted low frequencies, thereby removing the rumble often caused by low-frequency buildup.

  Three versions are included. The native plug-in is classic reverb pushed to the outer limits of lo-fi. The Amp Room module runs inside Softube Amp Room, the pro audio guitar and bass platform, alongside other studio effects, classic amps, cabs, and pedals. The Modular module runs inside Softube Modular, where it can be virtually patched to modules from Doepfer, Buchla, and Intellijel.

  This product supports Softube Extended Features, easy-access panels that add modern precision and workflow controls on top of the main interface.
specs: |-
  - Instant, extreme lo-fi digital reverb for creative production and sound design
  - Authentic aliasing artifacts and distortion with Softube-quality sound and workflow
  - Three versions included: the native plug-in, the Modular module, and the Amp Room module
  - Intentional exaggeration of aliasing artifacts that were present in early digital reverbs
  - Variable sample rate and selectable aliasing filter types let you quickly find your ideal lo-fi vibe
  - Selectable aliasing filter types: 12, 24 and 48 dB/octave, plus Off
  - High pass filter to reduce low-end rumble
  - Predelay and time sliders to effortlessly adjust traditional reverb parameters
  - Dry/wet slider for finding the perfect balance on a track or going completely wet on a bus
  - Featuring Softube Extended Features for even more control
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Internet access required for downloading installers and managing licenses
  - Three activations
  - 20-day trial
  - 14-day returns
