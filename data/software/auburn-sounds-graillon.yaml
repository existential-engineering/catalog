description: Live voice changer with pitch correction, pitch shifting, formant
  shifting, and built-in vocal effects including compressor, gate, chorus,
  preamp, and bitcrusher.
details: |-
  Graillon is a live voice changer and enhanced pitch correction tool for
  vocals, offering both standard and edgy sound options. It provides pitch
  shifting, formant shifting, and pitch correction with hard-tune and natural
  modes for versatile vocal processing.

  The plugin features three pitch engines: G2 (legacy), G3 (updated), and I1
  (derived from Inner Pitch), giving users multiple algorithms to choose from
  depending on the desired character. Built-in effects include a compressor,
  gate, chorus, preamp, and bitcrusher, all optimized for vocals with zero
  latency.

  The Full Edition adds Pitch-Tracking Modulation (PTM), keyboard tuning with
  non-equal temperament support, and a vocal doubler for richer vocal textures.
  These advanced features extend Graillon beyond basic pitch correction into
  creative vocal design territory.

  Available in both Free and Full editions, Graillon serves as a comprehensive
  vocal processing toolkit suitable for both corrective and creative
  applications.
specs: |-
  - Pitch Shifter
  - Formant Shifting
  - Pitch Correction (hard-tune and natural modes)
  - Three Pitch Engines: G2, G3, I1
  - Built-in Compressor
  - Built-in Gate
  - Built-in Chorus
  - Built-in Preamp
  - Built-in Bitcrusher
  - Zero latency vocal effects
  - Pitch-Tracking Modulation (Full Edition)
  - Keyboard tuning with non-equal temperament (Full Edition)
  - Vocal doubler (Full Edition)
