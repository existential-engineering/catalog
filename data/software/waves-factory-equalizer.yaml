description: "Intelligent, dynamic EQ plugin that analyzes tracks and
  intelligently decides where to apply corrections to make them sound more
  natural. Operates with zero latency and can function with a single control
  knob while offering extensive customization."
details: |-
  Dynamic tone shaping with real-time analysis. Mid/Side processing. Tilt knob for brightness control. Attack/release controls. Sidechain input. HQ mode with offline-only rendering option. Mix and output gain with auto-gain. Drawable spectrum interface. Factory presets. Zero latency processing. Resizable interface (Retina-ready). Auto-updater. No iLok required.
specs: |-
