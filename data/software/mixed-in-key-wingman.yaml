description: Get chords and bassline ideas that fit the audio in your DAW.
  Wingman listens to your track, gives you ideas that make musical sense, and
  lets you shape the results without leaving your session.
details: |-
  Wingman is a plugin that runs inside a DAW and listens to the audio on a track, then returns compatible musical parts. It analyses what it hears and suggests chord progressions and basslines that match the track's key, rhythm and feel, so a producer can start with a vocal, a loop or a full track and build the music around it.

  Alongside idea generation it performs instant stem separation into vocals, bass, drums and other parts, and converts audio to editable MIDI. Ideas can be based on a chosen stem (vocals, instruments, bass or drums) so the suggestions follow the part that matters most, and the separated stems can be dragged straight back into the session.

  Version 3.0 adds a complete drums channel with suggestions by genre, optional kicks and transitions, and per-element export, plus Real Guitars, live-recorded guitar parts by session musicians that adapt automatically to the chosen chord progression. Chord control was deepened with a dedicated passing-chord button, advanced chord timing that sets how often the harmony changes, and the ability to split, delete and resize chords in the progression.

  Sound shaping happens inside the plugin: chord and bass rhythm presets, an accent editor, and built-in filter, delay, reverb, OTT, sidechain and special FX. Wingman can also host the user's own VST instruments, including Serum, Diva, Pigments, Omnisphere, Kontakt, Nexus, Massive X, Sylenth and Phase Plant, so previews use the sounds already in the producer's workflow.

  Everything exports back to the DAW as MIDI, WAV, separated stems or individual drum elements. Wingman is compatible with Ableton Live, Logic Pro, FL Studio, Cubase, Studio One and Pro Tools, and is sold as a one-time purchase rather than a subscription.
specs: |-
  - Context-aware chord and bassline generation from the audio playing in your DAW
  - Instant stem separation into vocals, bass, drums and other stems
  - Audio to MIDI conversion
  - Drums channel with genre-based patterns, optional kicks and transitions
  - Real Guitars: live-recorded guitar parts that adapt to the chord progression
  - Chord editing: passing chords, advanced chord timing, split, delete and resize
  - Chord and bass rhythm presets, accent editor with waveform view and grid options
  - Built-in effects: filter, delay, reverb, OTT, sidechain and special FX
  - Hosts your own VST instruments and presets
  - Export as MIDI, WAV, separated stems, or individual drum elements
  - Base ideas on vocals, instruments, bass or drums
  - Key override with instant regeneration of suggestions
  - Incorrect tempo detection warns when captured audio does not match the DAW tempo
  - Compatible DAWs: Ableton Live, Logic Pro, FL Studio, Cubase, Studio One, Pro Tools
  - macOS 12 and above, with all features on Apple Silicon and Intel except stem separation, which requires Apple Silicon (M1/M2/M3/M4/M5)
  - Windows 10 and above, where stem separation recommends a dedicated GPU with at least 4 GB of RAM
  - Plugin only, not a standalone application
