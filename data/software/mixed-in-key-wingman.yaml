description: Get chords and bassline ideas that fit the audio in your DAW. Wingman analyzes audio input and generates harmonically-matched chord and bassline suggestions, with instant stem separation, audio-to-MIDI conversion, and a built-in effects chain.
details: |-
  Context-aware chord and bassline generation based on audio analysis.

  Instant stem separation (vocals, bass, drums, instruments). Audio-to-MIDI conversion. Support for user's own VST synths.

  Rhythm presets for chords and basslines. Accent controls and groove shaping. Built-in effects chain (filters, delay, reverb, OTT, sidechain).

  MIDI and WAV export. Key detection and modification.

  Version 2.0 added Pro Tools support, hundreds of Serum presets, performance optimizations, and presets with built-in effects.
specs: |-
  - macOS 12 or above; Apple Silicon (M1/M2/M3/M4/M5) or Intel
  - Windows 10 or above
  - Stem Separation requires Apple Silicon (Mac) or GPU with 4GB+ VRAM (Windows)
  - Compatible with Ableton Live, Logic Pro, FL Studio, Studio One, Cubase, Pro Tools
