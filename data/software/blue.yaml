name: Blue
manufacturer: acustica-audio
primaryCategory: equalizer
url: https://www.acustica-audio.com/store/products/blue-eq
description: Blue EQ is a detailed emulation of vintage-revisited semiconductor
  equaliser, inspired by legendary british devices.
details: |-
  Originally equipped with germanium, this eq sounds thick & huge with its beefy
  bottom, musical mid-range and "expensive" air. Modeled after an incredible eq
  heard on many hit records, this unit has both passive and active signal paths.

  The blue eq features an accurately emulated selection of bands and frequencies
  you can choose from. The low frequency band with a range from 30 up to 220hz,
  switchable from bell to shelf, the mid-range band with frequencies ranging
  from 300hz to 8300hz, and the high frequency band, which features a bell and
  shelf mode, ranges from 3200hz up to the highest point of 20.000hz.

  Beside the precise modeling of sound and features, you will also get authentic
  harmonic distortions that the original unit imparts so beautifully. This is a
  very unique and musical sounding eq, suitable for mixing, mastering, and any
  other creative sound processing.

  We call it "the rock'n'roll box" because it is so full of character and
  creative sound shaping possibilities.
specs: |-
  - Low frequency band (30hz-220hz)
  - Bell to shelf switchable
  - Mid-range band (300hz-8300hz)
  - High frequency band (3200hz-20000hz)
  - Bell and shelf mode
  - Passive signal path
  - Active signal path
  - Harmonic distortion emulation
  - Low shelf filter (0-9db gain)
  - Low bell filter (0-9db gain)
  - High shelf filter (10db gain)
  - High bell filter (10db gain)
