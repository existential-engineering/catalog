description: Ashen Scoring Cello is a solo cello library with an intimate, melancholic tone designed for minimal post-classical compositions, trailer music, and post-horror soundtracks. It features 12 playable articulations, a Performance Designer engine, true legato with realistic vibrato, and up to 8 Round Robins and 4 dynamic layers recorded via "Repetition Sampling."
specs: |-
  - Format: 24-bit / 48 kHz lossless NCW
  - Storage: 3.01 GB (5.2 GB original material)
  - Requires: NI Kontakt 6.0.2+ (including free Kontakt Player)
  - 12 playable articulations
  - Up to 8 Round Robins and 4 Dynamic Layers
  - Performance Designer engine for harmonies, melodies, and rhythmic patterns
  - True legato (Rebow) with realistic vibrato algorithm
  - Repetition Sampling technique for short articulations
  - Bonus sound design elements
  - Dozens of snapshot presets
