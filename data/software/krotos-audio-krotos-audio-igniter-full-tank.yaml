description: Igniter Full Tank is a vehicle sound design plugin for DAWs that lets designers craft, perform, and automate vehicle audio in seconds. The Full Tank edition includes 2,689 samples across 24 vehicles (sports cars, motorbikes, planes, helicopters, spacecraft, drones), 284 performable presets, and 75 GB of additional SFX. Combines granular synthesis, sampled vehicle libraries, and MIDI-driven performance for rapid post-production workflows.
details: |-
  Igniter is a one-stop solution for designing, performing and automating vehicles directly in your DAW, covering everyday vehicles, sports cars, motorbikes, planes, helicopters, spacecraft and drones. Igniter Full Tank is the tier aimed at sound professionals needing a large vehicles library from the world's best recordists alongside the Igniter plugin.

  Over 20 high-quality performable vehicles are ready to go, including the Ford F150, Harley Davidson 99 Hog and Audi R8. Vehicle sound effects can be processed as part of a hybrid workflow using Granular, Synth, One Shot or Loop modules, and Igniter saves hours of editing by letting you perform vehicle sound effects via MIDI or change the length or type of sound in a complex vehicle scene in seconds.

  Use cases span vehicle movement and automation, driving pass-bys with an instantly applied Doppler effect, vehicle Foley such as car doors, windows and windscreen wipers, electric vehicle assets and presets, engine and exhaust perspective mixing with a built-in convolution reverb, loop-based movement across surfaces, complex actions such as revs, acceleration and brakes, aerial vehicles including helicopters and drones, and sci-fi spaceships designed through the Synth tab.

  Full Tank's vehicle list includes the Aston Martin Rapide, Audi R8, Ferrari 348, Land Rover Defender, Subaru Impreza, BMW i3, Tesla Model S P85D, Toyota Chaser, Dacia 1310, U650M Tractor, Mercedes Actros, Bucker BU 131, de Havilland Tiger Moth, Honda Civic, Subaru Crosstrek SUV, Ford F150, Harley Davidson 99 Hog, Porsche Carrera, tires, the Huey UH-1H, Agusta Westland 119x, CH-47D Chinook and Cessna 560XL.

  Igniter is available to try free with a 10 day trial, and is supported in Pro Tools (11 or later), Logic Pro X, Nuendo 8.2.10 or above, Cubase, Reaper and Ableton Live 10 and above.
