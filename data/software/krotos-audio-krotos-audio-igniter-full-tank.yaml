description: Igniter Full Tank is a vehicle sound design plugin for DAWs that
  lets designers craft, perform, and automate vehicle audio in seconds. The Full
  Tank edition includes 2,689 samples across 24 vehicles (sports cars,
  motorbikes, planes, helicopters, spacecraft, drones), 284 performable presets,
  and 75 GB of additional SFX. Combines granular synthesis, sampled vehicle
  libraries, and MIDI-driven performance for rapid post-production workflows.
