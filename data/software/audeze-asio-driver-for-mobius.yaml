description: Free ASIO Windows driver for the Audeze Mobius headphone,
  providing low-latency, bit-perfect playback for professional audio use.
details: |-
  ASIO Windows driver for the Audeze Mobius headphone. Provides an ASIO compliant interface integrating with 32 and 64 bit Windows 7 and up as a standard WDM/DirectX compatible sound device.

  Optimized for low latency and low CPU load to meet professional audio requirements. Enables bit-perfect playback with an adjustable control panel where buffer depths can be customized.

  Includes a volume mixer allowing individual channel volume adjustment, simultaneous WDM and ASIO playback, and support for multiple parallel ASIO applications.

  Note: These drivers are not necessary for normal Mobius functionality and installation is optional unless ASIO drivers are specifically required.
specs: |-
  - ASIO 2.3.1 compliant
  - Supports Windows 7 and up (32 and 64 bit)
  - WDM/DirectX compatible
  - Low latency optimization
  - Bit-perfect playback support
  - Adjustable buffer depth
  - Multi-channel volume mixer
  - Simultaneous WDM and ASIO playback
  - Multiple parallel ASIO applications support
  - MME, DirectSound, WASAPI interface support
  - WASAPI bit-perfect playback support
