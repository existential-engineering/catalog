description: Chameleon lets you capture real spaces and transform them into
  realistic reverb. Supports stereo, surround and immersive formats.
details: |-
  Accentize Chameleon is the go-to solution for audio engineers and sound
  designers seeking to replicate natural room reverbs. This plugin excels at
  analysing audio and recreating a room's acoustic profile with precision, yet
  operation is incredibly simple.

  Chameleon is an intelligent audio plugin that uses artificial neural networks
  to estimate and model the exact reverb content of any source recording.
  Available in a standard stereo version, Chameleon allows you to build reverb
  profiles in seconds and apply them seamlessly to dry studio recordings.

  Features include state-of-the-art machine learning, exact room condition
  analysis, fast matching workflow, and two different modes.

  Compatible with Pro Tools, Cubase, Nuendo, Reaper, Ableton Live, Logic Pro,
  Adobe Premiere, Final Cut, and DaVinci Resolve.
