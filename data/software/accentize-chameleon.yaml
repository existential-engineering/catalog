description: Chameleon lets you capture real spaces and transform them into realistic mono and stereo reverb using neural network-based room matching.
details: |-
  Accentize Chameleon is a neural network-based reverb matching plugin for audio engineers and sound designers who want to replicate natural room reverbs. It analyzes real production recordings and recreates their room acoustics with precision, using models trained on over 30,000 unique room examples.

  Chameleon estimates and models the exact reverb content of any source recording, letting you build a reverb profile in seconds and apply it seamlessly to dry studio recordings. The standard version includes 2D/3D spectrogram visualization, a profile library window, and 27 built-in presets, with impulse response export for use elsewhere.

  Compatible with Pro Tools, Cubase, Nuendo, Reaper, Ableton Live, Logic Pro, Adobe Premiere, Final Cut, and DaVinci Resolve.
