details: |-
  Whisper of Loong is a Chinese Dizi virtual instrument. The Dizi is a transverse flute-like instrument made of bamboo. Unlike similar instruments it carries a bulrush membrane that vibrates with airflow, which gives it a uniquely clear and bright sound. Besides smooth and beautiful melodic parts, the Dizi can be played with a rich set of performance techniques such as rapid finger-popping, tongue-flutter and airflow vibrato, allowing it to carry the most complex solo parts.

  There are two major variants of Dizi: the Qudi, or melodic Dizi, usually used for solo works as the primary instrument of complex pieces, which is the variant presented in Whisper of Loong, and the Bangdi, or opera Dizi, with a very bright sound that usually serves as the accompanying instrument of traditional Chinese opera.

  The library holds 1745 samples at 44100 Hz / 24 bit, totalling 1.5GB. Ten microphones in different positions captured the spatial and reverb characteristics of the instrument, mixed down to four channels (Yin, Yang and far stereo) whose volumes are adjustable in software to obtain a wide range of tones.

  Performances including mordent, finger pole popping, trill, flutter, vibrato, staccato and gliss can all be triggered in the software. Real-recorded expressions are freely controllable through MIDI CC, gliss is available at three recorded speeds combined with sample synthesis for freely adjustable speed, and a real-sample-based LFO engine drives realistic and adjustable vibrato. Legato was recorded between notes at two speeds and applied according to playing speed, alongside the popping legato specific to the Chinese Dizi.

  The instrument runs on a purpose-built sampling engine with disk buffer streaming, sample compression and sound fusion technology. Convolution reverb samples recorded at famous natural and historical heritage sites in China place the instrument in spaces such as the Great Wall or the Terracotta Army site, and the effect rack from Heavier7Strings adds Compressor, EQ, Chorus and Ping-Pong delay. A pattern library with updatable presets accepts custom patterns dragged in as MIDI clips, and presets range from Chinese traditional to experimental.
specs: |-
  - 1745 samples
  - Sample parameters: 44100 Hz / 24 bit
  - Sample size: 1.5GB
  - Ten microphone positions mixed down to four adjustable channels (Yin, Yang and far stereo)
  - Performances: mordent, finger pole popping, trill, flutter, vibrato, staccato and gliss
  - Real-recorded expressions controlled by MIDI CC
  - Gliss at three recorded speeds plus sample synthesis
  - Real-sample-based LFO vibrato engine
  - Two-speed legato plus popping legato specific to the Chinese Dizi
  - Self-developed sampling engine with disk buffer streaming and sampling compression
  - Convolution reverb recorded at Chinese natural and historical heritage sites
  - Effect rack from Heavier7Strings: Compressor, EQ, Chorus and Ping-Pong delay
  - Pattern library with presets and user patterns from dragged MIDI clips
  - Minimum system requirements: Intel or AMD CPU with SSE 4.1 instruction set, or Apple chip
  - Mac OS X 10.9 / Windows 7
  - 4GB RAM and 2GB disk space
  - Plugin formats provided: 64-bit VST2, VST3, AAX and Audio Unit
  - Extra requirements on specific hosts: Logic Pro X or higher (Logic 9 is not supported)
