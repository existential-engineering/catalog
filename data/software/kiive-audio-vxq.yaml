details: |-
  VX-Q is our take on a rare, clean British EQ known for staying musical on detail heavy sources, paired with a swappable transformer section the hardware never had. Clarity comes first, then five saturation modes to dial in when you want color. Clean enough for the master bus, color when you need it.
