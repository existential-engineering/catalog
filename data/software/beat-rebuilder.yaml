details: |-
  One of the biggest obstacles in beat-making is friction; sometimes you want to
  remix that awesome loop you just heard, but between finding the right samples,
  lining them up correctly, and balancing the audio, it can be laborious. Or
  when you're making your own beats, it's easy to find yourself with no clear
  direction, spending lots of time with nothing to show for it. Recognizing
  this, we at Stagecraft software have been making something special to help
  make remixing and beat-building easier. We call it Beat ReBuilder.

  Using advanced audio classification and fingerprinting, beat rebuilder detects
  percussive sounds within audio. Once identified, you can layer your own
  samples on top of the beat or replace it entirely. Alternatively, you can
  drag-and-drop the MIDI data for use in your own drum machine.

  Beat rebuilder can also act as a real time beat layering machine, creating a
  layer of new beats to augment the input. The addition of eq and a crossfade
  means you can treat this like a dj environment, using the newly created beats
  for transitions in a variety of ways.

  Beat rebuilder keeps a loop of the most recent audio, allowing you to take
  audio loops and create a corresponding MIDI loop, which can be dragged into
  the DAW for use in drum tracks or sequencers.

  Additionally, beat rebuilder continuously parses incoming audio and outputs a
  MIDI stream to match it in real time. Once tuned, this output can be used to
  find the position of each beat in a song, and used to quickly build a track
  for augmenting the existing audio drum track.
specs: |-
  - Advanced audio classification
  - Fingerprinting
  - Percussive sound detection
  - Sample layering
  - Beat replacement
  - MIDI data export
  - Real-time beat layering
  - EQ
  - Crossfade
  - MIDI loop creation
  - Continuous MIDI output
  - Real-time MIDI stream parsing
