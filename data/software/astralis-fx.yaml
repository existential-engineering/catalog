details: >-
  Astralis fx is based on the effects section of the homegrown sounds' astralis
  range of synthesizers and offers a world of sound transformation, ranging from
  lush pads to industrial destruction.


  The effects in astralis synths play a large part in shaping their sound, the
  idea with astralis fx is that the same can be applied to any live sound source
  sent through the plugin such as drumloops or guitars etc.


  It also includes a modulation sequencer and programmable gapper for creating
  tempo-based rhythm effects.


  It can be used as an insert or send and the effects can be used in 127
  different possible routings.


  The flanger/filter provides a choice of flanger or modulated filter with a
  unique lfo with hundreds of shape combinations, and the resonant filter offers
  a choice of many filter types including low passes, hi passes, band passes,
  notch, hi shelf, low shelf and comb types, cascadable up to 8 times.
specs: |-
  - VST plugin
  - Multi fx
  - Delay/echo
  - Modulation (flanger/phaser/chorus/tremolo)
  - Reverb
  - Soundscaper (echo/comb/reverb)
  - Organic effect
  - Flanger/filter with lfo
  - Stereo delay (freeform or tempo synced)
  - Ring modulator
  - Compressor/limiter
  - 8 band eq
  - Programmable gapper
  - Modulation sequencer
  - Lfo with customizable shape (300+ predefined shapes)
  - Resonant filter (cascadable up to 8 times)
  - Drive (auto leveling distortion)
  - Global randomizer
  - Direct wav recorder (16/24/32/32-bit float)
  - 128 presets
  - 127 different possible routings
  - Windows compatible
