description: A guitar cabinet impulse response plugin engineered by Adam
  Getgood, featuring Cali-style cabinets renowned for smooth treble, rich
  midrange, and tight bass — ideal for heavily distorted guitar tones. Includes
  six cabinet options, seven independent microphone channels, eight microphone
  models, a master EQ, and export capability.
details: |-
  The journey to find your sonic identity as a musician and producer is one full of technical and engineering challenges. These obstacles ultimately disrupt your creative headspace and workflow.

  Introducing the second in the series GGD Studio Cabs: Cali Oversized Edition.

  A deep dive into the legendary studio staple of our time, famed for its smooth top end, rich mid-range, and tight low-end. The perfect cab for heavily distorted guitar tones. Using a carefully curated selection of microphones and speakers we distilled all these sounds into an intuitive design, allowing you to make immediate changes in color with the freedom to mix, combine and blend tones, creating your own unique palette of sounds.

  All IRs captured and engineered by Adam Getgood

  Stop scrolling endlessly through lists of files, and focus on your creativity. Let us handle the engineering.
specs: |-
  - 6 cabinet options: Massive, Upfront, Thick, Smooth, Detailed, Guttural
  - 7 independent microphone channels
  - 8 microphone models: C414, KM184, M160, MD421-II, MD421-U, R121, SM57, Fredman
  - Master EQ, phase-coherent IRs, export capability
  - macOS: 64-bit, Intel/Apple Silicon, OS X 10.11+
  - Windows: 64-bit, Windows 7 or 10
  - Disk: 300 MB
