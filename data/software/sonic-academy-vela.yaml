  classic reverb emulations, customizable early reflections, integrated
  de-esser, ducking, pre/post 4-band EQ, dual-stage diffusion networks, and 200+
  presets."
details: |-
  200+

  Node-based late reflection engine
  Customizable early reflections
  Integrated de-esser
  Ducking system
  Pre and post EQ (4-band each)
  Dual-stage diffusion networks
  Low CPU usage
  Decay shape editing via node graph
  Reverse reverb capability
