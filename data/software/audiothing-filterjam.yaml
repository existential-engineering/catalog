description: Filterjam is a free multi-band resonant filter plugin for Mac,
  Windows, Linux, and iOS, delivering weird ringmod-like filtered sounds.
details: |-
  Filterjam is a multi-band resonant filter delivering weird ringmod-like filtered sounds. The input signal is divided into 4 bands that are then summed or multiplied together according to the selected mode.

  Filterjam can be very harsh or gentle, it can add brightness or depth to synth sounds, but it can also completely mangle acoustic sources.

  Filterjam is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP). It is also available on the App Store for iOS and iPadOS (AUv3 and Standalone).

  The plugin is freeware: download links are sent by email after filling in the form on the product page. Activation needs no iLok dongle and no internet connection.
specs: |-
  - Multi-Band Resonant Filter
  - Input signal split into 4 bands, summed or multiplied per the selected mode
  - Oversample up to 16x
  - Lightweight on CPU
  - Preset system with randomizer
  - Windows 7, 8, 10, 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP 64-bit)
  - macOS 10.13 - macOS 26, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP 64-bit)
