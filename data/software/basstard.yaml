details: |-
  Titanium BASSTard rhymes with low end. It is completely free, superbly easy to
  use and is derived directly from the EQ module of our titanium dreamware
  suite.

  Basstard helps you shape the low end of your recorded tracks with character
  and attitude.

  Definitely not for mastering engineers. Absolutely perfect for serial sound
  manglers who want their low end to be as full as a stuffed turkey.

  Titanium basstard is available through aquarius as a forever-free download.
