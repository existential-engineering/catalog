details: |-
  BianZhong is a virtual instrument featuring a chinese chime bells - BianZhong.
  BianZhong is an ancient chinese musical instrument consisting of a set of
  bronze bells, played melodically.

  China is the earliest country to manufacture and use musical chimes. These
  sets of chime bells were used as polyphonic musical instruments and some of
  these bells have been dated at between 2,000 to 3,600 years old. They were
  hung in a wooden frame and struck with a mallet.

  Using a wooden hammer and a rod to beat the bronze bell can make different
  pitch. Along with the stone chimes called bianqing, they were an important
  instrument in china's ritual and court music going back to ancient times.

  To ensure the maximum accuracy and musicality in the reproduction of this
  complex and beautiful sound, recordings were made at the hubei provincial
  museum which has marquis yi of zeng bianzhong to record their wide variety of
  sounds. Best recording gears were chosen to ensure the highest sound quality.
