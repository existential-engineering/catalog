description: Chameleon Surround extends Chameleon's reverb matching to multi-channel and immersive audio formats up to 9.1.6, with 3D room estimation from mono signals.
details: |-
  Chameleon Surround is the immersive-format edition of Chameleon, adding mono, stereo, and multi-channel support up to LCR, 5.1, 7.1, and 9.1.6 surround. It can estimate a full 3D room model from mono signals alone.

  The plugin offers dual visualization modes, Speaker Output and Perceived Source, plus profile image customization and a dockable profile library with 80 presets. Impulse responses can be exported for use elsewhere, and licensing is via iLok, compatible with the standard Chameleon license.

  Compatible with Pro Tools, Cubase, Nuendo, Reaper, Ableton Live, Logic Pro, Adobe Premiere, Final Cut, and DaVinci Resolve.
specs: |-
  - Audio Channels: Mono, Stereo, LCR, 5.1, 7.1, up to 9.1.6 surround
  - Formats: VST3, AU, AAX
  - Sample Rates: 44.1kHz, 48kHz, 88.2kHz, 96kHz, 192kHz
  - 3D room estimation from mono signals
  - Speaker Output and Perceived Source visualization modes
  - 80 built-in presets
  - Impulse response export
  - Licensing: iLok
