description: CR-78 accurately recreates the punchy analog sounds and 34 onboard
  preset rhythms of the first true classic drum machine and takes it much
  further. Unlike sample-based emulations, it uses modeled synthesis to recreate
  the classic tones of the original and makes a quantum leap forward by making
  these sounds fully editable.
details: |-
  In 1978, a not-so-little box that made a massive impact. Coming from a legacy of preset-based devices intended to sit atop an organ, the CompuRhythm CR-78 was entirely new: the first programmable, microprocessor-controlled, analog beatbox.

  With its colorful buttons for pattern presets, distinctive analog tones, and basic pattern programming, the CR-78 was the first drum machine as we know it. Pro musicians such as Blondie, Ultravox, Phil Collins and Genesis, Orchestral Manoeuvres in the Dark, Roxy Music, The Cars, Hall and Oates, and many others immediately embraced and immortalized this revolutionary gear. Cherry Audio modeled its virtual instrument on Greg Hawkes' CR-78 hardware, as heard on The Cars' hit albums Candy-O (“Shoo Be Do”) and Panorama (“You Wear Those Eyes”).

  Pattern creation has been simplified with X0X-style 16- or 24-step sequencing, copy-and-paste, and real-time entry using trigger, keyboard, or MIDI device. CR-78 also includes an expansive song mode for chaining up to 99 patterns. All of the original variations for fills, accents, voice cancel, and fades are present, along with new swing and velocity options.

  Unlike sample-based instruments, Cherry Audio has emulated the original's tones through modeled synthesis, and a Voice Edit panel allows extensive instrument parameter editing, enabling a range of sonic and melodic possibilities far surpassing the original.

  The innovative Effects/Mixer panel delivers discrete level, pan, mute/solo; studio-quality effects, including overdrive, flanger, delay, gated reverb with effects send buttons; and a master compressor and a six-band graphic EQ. CR-78 can be played standalone and includes versatile plug-in options loaded with such DAW-friendly features as auto-sync, drag-and-drop MIDI export, individual outs, and complete automation.
specs: |-
  - All 34 factory preset rhythms and “variation/fill-in” patterns included
  - Simple shift-click action to combine two factory presets
  - Over 250 additional rhythm and sound presets, including Kits and Melodic categories
  - All original sounds exactingly modeled, no samples used
  - Voice Edit panel for mild or extreme sound editing
  - Familiar X0X-style 16- or 24-step pattern programming
  - Super flexible pattern and instrument copy and paste capabilities
  - Swing percentage setting
  - Real-time step entering via Trigger button
  - Unlike original, all sounds independently addressable in user pattern mode
  - Easy to use Song Mode with up to 99 patterns and 99 steps per song
  - External MIDI sound triggering with velocity sensitivity and user-assignable note mapping
  - Effects/Mixer panel with studio-quality effects for overdrive, flanger, delay, and gated reverb that can be individually applied to each kit instrument through a one-button mixer send
  - Mixer with independent level, pan, and solo/mute for each instrument
  - Master compressor and six-band graphic EQ in the Effects/Mixer panel
  - Drag-export function allows mouse-drag conversion of patterns to DAW MIDI tracks (plug-in version) or Standard MIDI Files on the desktop (standalone version)
  - Separate out plug-in version for independent processing of each instrument in a DAW
  - Super accurate DAW sync
  - User-adjustable oversampling control
  - Complete MIDI control and DAW automation for all controls, with MIDI learn and mapping (Preset and Global)
  - Focus zoom-in feature, as well as standard UI zoom and resize via drag
  - Complete documentation available directly online from the instrument or in downloadable PDF format
  - macOS requirements: macOS 10.13 or above, 64-bit required, native Apple M1 or greater processor support including Ultra, 3.4 GHz Quad-Core or M1 CPU with 8GB of RAM recommended
  - Windows requirements: Windows 7 or above (including Windows 11), 64-bit required, 3.4 GHz Quad-Core computer with 8GB of RAM recommended
  - Hard disk space: 58 MB
  - Internet connection required for product activation
