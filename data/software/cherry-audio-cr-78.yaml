details: |-
  Cherry Audio's CR-78 is a visionary virtual drum machine that re-envisions
  the original by meticulously recreating and extending its distinctive sounds
  and beats with new programmability features, and adds over 250 additional
  presets that take it from mild to wild.

  The instrument accurately recreates the punchy analog sounds and 34 onboard
  preset rhythms of the first true classic drum machine. Rather than using
  samples, Cherry Audio has emulated the original's tones through modeled
  synthesis, and a Voice Edit panel allows extensive instrument parameter
  editing, enabling a range of sonic and melodic possibilities far surpassing
  the original.

  The Effects/Mixer panel delivers discrete level, pan, mute/solo, and
  studio-quality effects including overdrive, flanger, delay, and gated reverb
  with effects send buttons. A master compressor and six-band graphic EQ handle
  final output processing.

  DAW-friendly features include X0X-style 16- or 24-step pattern programming,
  Song Mode with up to 99 patterns, external MIDI sound triggering with
  velocity sensitivity, and drag-export MIDI conversion for easy integration
  into any production workflow.
specs: |-
  - All 34 factory preset rhythms and variation/fill-in patterns included
  - Over 250 additional rhythm and sound presets
  - All original sounds modeled through synthesis (no samples)
  - Voice Edit panel for extensive sound editing
  - X0X-style 16- or 24-step pattern programming
  - Song Mode with up to 99 patterns
  - External MIDI sound triggering with velocity sensitivity
  - Studio-quality effects: overdrive, flanger, delay, gated reverb
  - Master compressor and six-band graphic EQ
  - Drag-export MIDI conversion function
  - Separate outputs (plugin version) for individual instrument processing
  - Complete MIDI control and DAW automation
  - macOS 10.13+ and Windows 7+ (64-bit)
  - 58 MB disk space required
