description: TAL-J-8 is a synthesizer plug-in that meticulously emulates the legendary Jupiter 8 and is calibrated after TAL's own hardware device, delivering the most authentic and faithful reproduction of its iconic sound.
details: |-
  TAL-J-8 is a synthesizer plug-in that meticulously emulates the legendary Jupiter 8 and is calibrated after TAL's own hardware device, delivering the most authentic and faithful reproduction of its iconic sound.

  This virtual instrument captures the essence of the hardware, one of the most revered analog synthesizers in music history, allowing you to infuse your compositions with its timeless warmth, depth, and unmatched sonic character.

  The plug-in offers a calibration section for extreme resonance and filter overdrive, VCO based UNISON with a stereo spread option and a full stereo signal path, MPE support, and microtuning support through tun file import and an MTS Client.

  More than 300 factory presets by solidtrax, emptyvessel, Electric Himalaya and others ship with the plug-in, and TAL links further free preset packs from Saif Sameer, ROM88, Thomas Ueber, Sound Author, Heat Audio, Funkybot, Xenos Sound Works, Swift Tuttle and Arcade Summer.

  Later releases added a Jupiter 8 hardware voice mode (SOLO and POLY II), Round Robin voice mode, poly aftertouch and note based velocity in the arpeggiator, an improved preset browser, multi-out layer stereo outputs, and the CLAP plug-in format including polyphonic expression support.
specs: |-
  - Authentic emulation of the 80's hardware synthesizer
  - Calibration section for extreme resonance and filter overdrive
  - VCO based UNISON with stereo spread option and a full stereo signal path
  - MPE support
  - Microtuning support (tun file import and MTS Client)
  - More than 300 factory presets by solidtrax, emptyvessel, Electric Himalaya and others
  - Calibrated after TAL's own hardware device
  - Jupiter 8 hardware voice modes (SOLO and POLY II) and Round Robin voice mode
  - Arpeggiator with poly aftertouch and note based velocity support
  - MULTI OUT button to enable or disable layer stereo outputs
  - Windows: Windows 10 or higher (64 bit host)
  - macOS: 10.11 or higher (64 bit host), Universal Binary 2 with native Intel and Apple silicon support (M1, M2, M3)
  - Linux: 64 bit, Ubuntu 18 or similar
  - AAX: Pro Tools 10.3.6 or higher (64 bit)
  - Demo restriction: the plug-in produces a rising white noise sound every minute
