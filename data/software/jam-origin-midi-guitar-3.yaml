description: MIDI Guitar 3 transforms your guitar into a polyphonic MIDI controller. It listens to and recognizes what you're playing on your instrument then generates MIDI output to drive synthesizers, all in real time while using state-of-the-art audio tracking models.
details: |-
  MIDI Guitar 3 transforms your guitar into a polyphonic MIDI controller. It listens to and recognizes what you're playing on your instrument then generates MIDI output to drive synthesizers, all in real time while using state-of-the-art audio tracking models.

  Unlike most guitar synthesis devices, MIDI Guitar 3 simply requires the audio signal from your instrument's 1/4" jack (via a standard USB audio interface) to generate MIDI output. And, yes, MG3 can generate MPE or standard MIDI.

  With guitar-to-MPE finally here, every note now has four dimensions of expression (strike, pressure, brightness and pitch). Multidimensional expressivity keeps the player more closely connected to the sound of the virtual instrument. By harnessing the playing nuances and gestures that make your guitar feel like a guitar, MIDI Guitar 3 makes controlling virtual instruments feel more guitaristic.

  MIDI Guitar 3 is a powerful, versatile, easy-to-use, modular system, that brings together third-party plugins, virtual instruments and MIDI controllers into a package that is easy for guitarists to use, in the studio and on the stage. All Jam Origin plugins integrate with one another as native modules and extensions.

  MIDI Guitar 3 is widely regarded as the best solution for producing fast, accurate, polyphonic MIDI from any standard guitar. But far from magic, the technology inside MIDI Guitar 3 is the result of painstaking development with continuous refinements over the last 18 years. It continues to astound new users and has been validated by thousands of guitar players since its inception. However, no pitch-to-MIDI system is perfect (blame the laws of physics) and as such there are some compromises that can only be addressed by MIDI Guitar 3 Hex.
specs: |-
  - Polyphonic pitch-to-MIDI conversion from any standard guitar
  - No special pickup required, works from the instrument's 1/4" jack via a standard USB audio interface
  - Generates MPE or standard MIDI
  - MIDI Polyphonic Expression with four dimensions per note: strike, pressure, brightness and pitch
  - Modular and extensible system that hosts third-party plugins, virtual instruments and MIDI controllers
