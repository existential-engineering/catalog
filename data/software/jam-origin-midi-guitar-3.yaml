description: MIDI Guitar 3 transforms your guitar into a polyphonic MIDI
  controller, listening to and recognizing what you're playing then generating
  MIDI output to drive synthesizers in real time using state-of-the-art audio
  tracking models.
details: |-
  Transforms standard guitar audio (1/4" jack via USB audio interface) into polyphonic MIDI — no special pickup required
  Generates MPE (MIDI Polyphonic Expression) with four dimensions of expression: strike, pressure, brightness, and pitch
  Real-time polyphonic audio tracking using state-of-the-art models, refined over 18 years of development
  Modular and extensible: integrates third-party plugins, virtual instruments, and MIDI controllers
  All Jam Origin plugins integrate with MG3 as native modules and extensions
