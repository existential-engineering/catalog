description: "Transforms any guitar into a polyphonic MPE MIDI controller using
  state-of-the-art audio tracking models. Listens to and recognizes what you
  play, then generates MIDI output to drive synthesizers in real time. Features
  four dimensions of expression per note (strike, pressure, brightness, and
  pitch), modular architecture for integrating third-party plugins and virtual
  instruments, and functions as a standalone pedalboard for live performance."
details: |-
  Real-time polyphonic audio-to-MIDI conversion
  MPE (MIDI Polyphonic Expression) support with four dimensions of expression
  No special hardware or pickup required — works with standard 1/4" jack via USB audio interface
  Modular architecture with third-party VST/AU plugin hosting
  Standalone pedalboard application for live performance
  Machine-learning-based audio tracking models
  MIDI notation recording capability
  Lifetime free updates included
