description: Simulate different listening spaces on headphones with SoundID
  Virtual Monitoring. Check mix translation across real-world environments with
  confidence.
details: |-
  SoundID Virtual Monitoring is an add-on for SoundID Reference for Headphones that simulates different listening environments on headphones. It provides pre-made spatial simulations of studio monitors and consumer devices, enabling producers and engineers to check how their mixes translate across real-world playback systems.

  Requires a Sonarworks-supported headphone (500+ models supported) with a SoundID Reference for Headphones license. Unlike the PRO version, it uses pre-made spatial simulations rather than personalized room cloning and does not require a binaural measurement microphone.

  Includes 3 studio monitor simulations (near-field, mid-field, far-field), 7 consumer device simulations, and 3 car presets.
