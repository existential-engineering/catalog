description: B00GA is a studio and live instrument designed by Hainbach to
  create experimental rhythms and textures. Based on the Word Generator 8006A.
details: |-
  B00GA is a studio and live instrument designed to create experimental rhythms and tonal textures. Inspired by a rare piece of lab equipment, the Hewlett-Packard Word Generator 8006A, it offers an excitingly different way to sequence clicks, pulses, and noise. Use it to create tight grooves, off-kilter beats, and forever shifting micro-sound patterns, or speed them up into rich drones and tonal structures. It comes with a suite of four vintage-flavored effects that allow for unique radiophonic effects.

  The starting point for B00GA was a rare piece of US-American test equipment, the binary word generator, used to produce the complex waveforms necessary for logic circuit testing, telecommunications system development, and interface simulation. When Hainbach found one for a few bucks on eBay, he quickly realized the musical potential: without any modification, it became the rhythmic core of his test equipment music. Their main use in test equipment music is in pinging, causing other devices, like filters or lock-in amplifiers, to resonate and play rhythmic patterns.

  B00GA combines a dual sequencer that is variable in speed from 0.1 Hz to 5 kHz with a crossfading sample player and a noise synthesizer. You can select samples from the factory banks or add your own sounds. By crossfading between them you get new combinations, and randomizing will change the sound per step, so no pattern repetition sounds the same. The noise section lets you generate, filter, and shape noise bursts freely, useful for percussion and crackling textures.

  The effect section includes a new passive octave bandpass filter designed especially for this instrument, with 10 bands of octave filtering and a mix knob, alongside a spring reverb, a phaser inspired by vintage analog units, and a tape echo based on AudioThing's Space Echo emulation Outer Space. The effects can be rearranged in any order using drag and drop.

  The factory banks began by sampling the original unit, then drew on collections of vintage pulse generators, digital generators, and recordings cut up from drum machines, analog synths, acoustic instruments, and field recordings. You can also create your own banks: open the Banks Folder from Global Settings and drop samples in, and the plugin scans the first 8 samples in each folder alphabetically. B00GA can load WAV, AIFF, FLAC, and OGG.

  B00GA is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP). It is also available on the App Store for iOS and iPadOS (AUv3 and Standalone).
specs: |-
  - 2 Sequence Lines (Pulse and Noise)
  - 28 Pulse Banks
  - 8 Patterns per preset
  - Several step randomization options
  - 4 Effects (echo, spring reverb, octave filter, phaser)
  - Resizable Window
  - Preset system with randomizer
  - Brightness and Contrast Controls
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP 64-bit)
  - macOS 10.13 - macOS 26, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP 64-bit)
  - 1 license up to 3 computers, no iLok, no internet connection required to activate
