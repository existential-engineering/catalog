description: A macro-oscillator plugin created for Modular in collaboration with
  Mutable Instruments. A hugely sophisticated sound-generation module, perfect
  for crazy complex waveform synthesis.
details: |-
  Braids, by French Eurorack pioneers Mutable Instruments, is not an oscillator. It sort of looks like one, with fine and coarse pitch/frequency controls, a v/oct input, and voltage-controllable tone/timbre controls. It even sort of sounds like one, in as far as it outputs audio.

  Mutable Instruments call it a macro oscillator, but even that is an understatement. It's a hugely sophisticated digital synthesis engine, able to produce and manipulate complex sounds by means of 45 or so fully-realized synthesis algorithms, featuring multiple oscillators, wavetables, filters, VCAs, ring modulators, and so on under the hood.

  Any Sound You Like: classic waves from vintage synths, bells, resonant filters, plucked and bowed strings, vocals and vowel/formant sounds, wind instruments, percussion, noise, granular clouds and more.

  Meta-Parameters: 'Timbre' and 'Colour' controls affect multiple different parameters per mode, morphing through all the sweet spots and ensuring every sound is lush, gorgeous, and useful.

  Built-In Envelope: using the trigger input and built-in AD envelope, each algorithm can even become a self-contained synth voice. No other modules required.
specs: |-
  - Made for Modular, Softube's Eurorack platform
  - Macro oscillator featuring 40+ fully-realized digital synthesis algorithms
  - Produce millions of different sounds easily, classic waves and telecoms babble, bells and whistles, percussion and ambience
  - Just two controls morph through the sweet spots of each algorithm
  - Great for triggered percussion
  - Awesome for crazy complex waveform synthesis
  - Phenomenal for glitchy out-of-control modulated sounds
  - Incredibly deep, but easy to use
  - Fine and coarse pitch/frequency controls, v/oct input, voltage-controllable tone/timbre controls
  - Trigger input with built-in AD envelope
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26
  - System requirements: Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a DAW host with AU, VST, VST3 and/or AAX support
  - Internet access required for downloading installers and managing licenses
  - Three activations
