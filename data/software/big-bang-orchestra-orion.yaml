details: |-
  Big Bang Orchestra: Orion offers four separate ensembles of flutes, oboes,
  clarinets and bassoons, with three musicians playing in unison in each
  ensemble. For each ensemble, all three musicians performed together and were
  recorded together with an array of microphones, including individual close
  mics for each ensemble, mid mics, decca tree (left - center - right), surround
  and high surround outriggers.

  All ensembles include a wealth of articulations, with a special focus on the
  beautifully performed legatos that are available in two variations, regular
  and espressivo. Other playing techniques include short notes, long notes,
  repetitions, espressivo, soft swells, sforzando, sforzatissimo, crescendos,
  flutter tongues (for flutes and clarinets) and fast repetitions.

  These are available in three tempos (120, 140, 160 bpm) but they can always be
  synced to your host tempo using the synchron player's time-stretch feature.
  The woodwinds of bbo: orion are completely new recordings that can be
  seamlessly combined with the tutti recordings of the other big bang orchestra
  modules to add even more and varied colors.

  As always, the synchron player offers mixer presets that blend perfectly well
  with all the other bbo sections and ensembles. What's more, the "processed"
  category offers mixer presets such as "compressed", "sparkling", "distorted
  delays" and many more.

  Big bang orchestra: orion is a virtual instrument audio plugin for macos and
  windows. It includes, and is therefore "powered by", synchron player, which
  functions as a VST plugin, an audio units plugin, a VST 3 plugin and an AAX
  plugin.
