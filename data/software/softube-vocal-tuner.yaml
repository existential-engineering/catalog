description: Automatically tune vocals to perfection with the Softube Vocal
  Tuner plugin, a real-time automatic pitch-correction processor plugin. Vocal
  Tuner lets you fine-tune vocals in real-time or go full Hard Tune and add
  colorful effects.
details: |-
  High-quality Softube sound. Lightning-fast workflow. A few easy-to-dial-in controls and the power to fine-tune vocals in real-time or go full Hard Tune and add colorful effects from pitch and formant shifting to octave up and down, a Tone Enhance slider, and more.

  Softube has equipped Vocal Tuner with all that, plus a Low Latency setting for confidence in tracking, precise metering to show how the processing affects the input signal, and two different pitch correction methods. Get vocals and more with star quality in mere seconds with Vocal Tuner.

  Pick your pitch correction method: Vocal Tuner is Softube's take on a real-time automatic pitch-correction processor. It gives you two distinct methods of pitch correction. You can choose from the Classic method, which delivers the traditional automatic pitch correction sound. Or you can pick the Modern method, which uses a more advanced pitch-shifting algorithm to preserve the formants of your vocal while tuning.

  In full effects: With Vocal Tuner, you can easily go from natural pitch shifting to hard tuning. If you want to add some exciting effects to color your sound further, Softube has outfitted the Vocal Tuner plug-in with independent or linked pitch and formant shifting. In addition, you can quickly add an octave up and an octave down to mix with your corrected vocal (both with individual gain controls). You can also use the Tone Enhance slider to control a dynamic and tone processor to enhance your vocals post-pitch correction.

  Low Latency mode: Softube gave Vocal Tuner a Low Latency mode to help with tracking and live performance situations. In this mode, the reported latency of Vocal Tuner is under 1 millisecond.
specs: |-
  - Automatic pitch correction
  - Go from subtle to hard tuning and add creative effects
  - Classic method for a traditional automatic pitch correction sound
  - Modern method to maintain the formants of the vocal while tuning
  - Subtle/Hard slider for speed of pitch correction
  - Natural/Robotic slider for pitch correction amount applied to note transitions
  - Quickly add an octave up and octave down to be mixed with your corrected vocal, to add a fatter ensemble sound
  - Tone Enhance adds dynamic processing and equalization to instantly make your vocal sound more polished
  - Low Latency setting, precise metering, inspiring visualizations
  - Low Latency mode reports under 1 millisecond of latency
  - Supports Softube Extended Features panels
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26; Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access for downloading installers and managing licenses
  - Three activations included
  - SKU S1360
