description: Echoes of the past, present and future. Valhalla Delay is a classic
  and modern delay and echo plugin featuring tape echo, BBD, old-school digital,
  and pitch shifting.
details: |-
  ValhallaDelay offers the classics, and expands them into new dimensions, with the unique Ratio and Quad delay styles, the Ghost mode (which adds frequency shifting), and a powerful diffusion section that can create anything from smeared echoes to ethereal reverbs.

  The plugin features 17 delay modes including Tape, HiFi, BBD, Digital, Ghost, Pitch, Reverse Pitch, BBDuck, Clarity, DuckTape, PitchDuck, LoFi, Quartz, PhaserDDL, RichPitch, Chrome Tape, and Analog. Each mode models a different type of delay unit with unique sonic characteristics.

  The Tape mode is a detailed model of a tape delay with variable motor speed, based upon the RE-201 and RE-301 with all the beloved features and quirks found in the old hardware. The Ghost mode is a Valhalla DSP original combining the tape model from the HiFi mode with frequency shifting and a unique diffusion algorithm.

  Five delay styles are available: Single, Dual, Ratio, Ping Pong, and Quad, providing flexible routing and timing options for creative delay effects.
specs: |-
  - 17 delay modes: Tape, HiFi, BBD, Digital, Ghost, Pitch, Reverse Pitch, BBDuck, Clarity, DuckTape, PitchDuck, LoFi, Quartz, PhaserDDL, RichPitch, Chrome Tape, Analog
  - 5 delay styles: Single, Dual, Ratio, Ping Pong, Quad
  - Delay lengths from 0 ms to 20 seconds
  - Beat sync with straight, dotted, and triplet options
  - Comprehensive diffusion section for smeared echoes to reverbs
  - Age control for noise and tape splice artifacts
  - Era control for switching between different modeled tape echoes
  - 1-knob ducking control
  - Drive control
  - Frequency shifting capability
  - Pitch shifting
  - 64-bit only
  - Mac: Intel and Apple Silicon (M1-M5) native
  - Windows: 7, 8, 10, 11
