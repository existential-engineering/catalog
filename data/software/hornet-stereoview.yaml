description: StereoView is a correlation meter designed to help you visialize the stereo field of your tracks and identify phase issues.
details: |-
  HoRNet StereoView is a correlation meter designed to help you visualize the stereo image of your tracks. Many tracks are mixed with wide stereo elements, and being able to see how they are placed across the stereo field helps ensure a mix is balanced and translates well across different playback systems, whether the track is played in stereo or in mono.

  The interface is dominated by the goniometer, a visual representation of the mix that takes the form of an X-Y graph. The graph displays the intensity of the stereo signal and how it moves across the stereo field, so the position of every element is visible, from wide panned instruments to more centered sounds. The plugin updates dynamically, so adjustments to the mix can be observed in real time.

  Two display modes are available. The default view, “fireworks”, presents each audio sample as a straight line extending from the center of the graph, where the more extended the lines are from the center, the more stereo width that element has. The second view, “abstract”, connects each sample to the next, creating a continuous “wire” effect that illustrates the movement and flow of the stereo image, which suits complex mixes where elements shift constantly between the left and right channels.

  The interface is freely rescalable, so the goniometer can be resized to fill the appropriate space on screen, from a small laptop display to a large studio monitor. An old CRT display persistence simulation is applied to make the visualisation easier to read.

  StereoView also helps identify phase issues that affect the coherence of a mix. Phase cancellation arises when two similar signals are out of phase, often producing a hollow or thin sound that becomes especially problematic when the track is collapsed to mono. The goniometer shows a tight cluster or overlapping lines when phase problems are present, so anti-phase issues can be caught and corrected by altering stereo placement or applying phase inversion.
specs: |-
  - Display of stereo position and level of each sample
  - Old CRT display persistence simulation for easier visualisation
  - Two display modes: “fireworks” and “abstract”
