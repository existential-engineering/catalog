description: StereoView is a correlation meter designed to help you visualize the stereo field of your tracks and identify phase issues.
details: |-
  HoRNet StereoView is a correlation meter designed to help visualize the stereo image of a track. It provides the tools to directly observe and manage the stereo field of a mix, so that tracks sound right whether they are played in stereo or mono.

  The interface is dominated by the goniometer, a visual representation of the mix in the form of an X-Y graph. The graph displays the intensity of the stereo signal and how it moves across the stereo field, updating dynamically so that changes to the mix are immediately visible.

  StereoView offers two display modes. The default view, fireworks, presents each audio sample as a straight line extending from the center of the graph, showing the exact placement of every element in the stereo field. The second view, abstract, connects each sample to the next, creating a continuous wire effect that illustrates the movement and flow of the stereo image and is useful for mixes with a lot of panning or movement.

  The plugin helps identify phase issues that could affect the coherence of a mix. Phase cancellation arises when two similar signals are out of phase with each other, often leading to a hollow or thin sound, which becomes especially problematic when a track is played in mono. The goniometer makes such problems visible as a tight cluster or overlapping lines. The interface can also be freely rescaled to suit the screen or workflow.
specs: |-
  - Display of stereo position and level of each sample
  - Old CRT display persistence simulation for easier visualisation
  - Two display modes: fireworks and abstract
  - GUI can be freely rescaled
  - macOS (10.7 and later) and Windows (Vista and later) support
  - 32 and 64-bit on Windows, 64-bit on Mac
  - Audio Units, VST2.4, VST3 and AAX format
  - Apple Silicon not supported yet
  - No copy protection
