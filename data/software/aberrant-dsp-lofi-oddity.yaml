details: |-
  Lofi Oddity is a free toolkit for sonic destruction and experimentation,
  incorporating effects from SketchCassette, Digitalis, ShapeShifter, and Lair
  into an immediate and easy-to-use ear candy playground.

  The plugin includes a Corruption module for digital artifacting and stutter
  effects inspired by Digitalis, a reverb section full of Lair's uncharted
  spaces, a Tape effect featuring greatest hits of SketchCassette's warm
  degraded tones, and a Comp section for extra glue and punch inspired by
  ShapeShifter.

  A Master Mix control allows any combination of settings to range from tasteful
  to abominable. The custom preset system includes 18 factory presets.

  Lofi Oddity requires Windows 10+ (VST3, AAX 64-bit) or macOS 10.13+ Intel or
  Apple Silicon (AU, VST3, AAX 64-bit).
specs: |-
  - Corruption module for digital artifacting and stutter effects
  - Reverb section inspired by Lair
  - Tape effect featuring SketchCassette's tones
  - Comp section inspired by ShapeShifter
  - Master Mix control
  - 18 factory presets
  - Windows 10+ (VST3, AAX 64-bit)
  - macOS 10.13+ Intel or Apple Silicon (AU, VST3, AAX 64-bit)
