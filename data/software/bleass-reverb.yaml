details: |-
  BLEASS Reverb is a unique Audio Unit effect with filters, freeze toggle
  button, frequency shifter/waveshaper x/y panel, and side-chained compressor
  for duck effect, bringing your music production and live performances towards
  new soundscapes.

  The input stage modifies the input source by correcting the gain and setting
  up early reflections pre-delay in order to re-create distant walls. This first
  stage also contains a filter to modify frequencies. Switch between two
  different filter types: the low-shelf filter can reduce or boost your basses.
  The high-pass filter cuts the low part of the signal and creates a resonant
  peak on interesting frequencies.

  The reverb stage offers a unique-sounding reverb with size modulation and
  length controls. It also contains a high-frequency damping control in order to
  re-create plate reverb effects, as well as a freeze toggle button for infinite
  sound soaring and exploration. This reverb offers also an x/y panel which
  applies a set of fine-tuned frequency shifter as well as a waveshaper in order
  to mutate your reverb space on the go.

  The ducker stage offers a duck effect made of a compressor side-chained on the
  dry input in order to bring clarity to heavy kicks and basses. Finally, a
  dry-wet controller offers control over the reverb level.

  Bleass reverb is a virtual effect audio plugin and a mobile audio app for
  macos, windows and ios. It functions as an audio units plugin and a VST 3
  plugin. Macos 10.9 and later (64-bit only) (including macos 11 big sur and m1
  processors).
