description: 2nd thoughts for zebra is the second soundset by simon stockhausen
  for the legendary software synthesizer by u-he.
details: |-
  2nd thoughts for zebra is the second soundset by simon stockhausen for the legendary software synthesizer by u-he. For years simon wanted to create another soundset for zebra, as the patchpool journey started with some kontakt patches and a sound-bank for zebra.

  2nd thoughts contains 86 fresh patches, since his first soundset for it, simon gathered even more experience and knowledge about synth programming, sound design and sonic art in general, all of this has accumulated in this set.

  This collection includes rich animated textures, drones and pads, often tempo-synced, expressive and fat leads, intricate sequencer grooves, snappy plucks and versatile bass sounds, beautiful tonal and haunting atonal soundscapes, experimental noises and physically modeled fantasy instruments.

  All of the oscillator waveforms and wavetables were created in zebra's wavetable editor and all patches have up to four x/y-macros assigned.

  All patches also make use of the modulation wheel and often aftertouch.
specs: |-
  - 86 patches
  - X/y-macros (up to four per patch)
  - Modulation wheel support
  - Aftertouch support
  - Oscillator waveforms created in zebra's wavetable editor
  - Wavetables created in zebra's wavetable editor
  - Tempo-synced patches
