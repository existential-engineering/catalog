details: |-
  BASSalicious 2 is a hybrid urban synth bass instrument that combines advanced wavetable synthesis and high-quality sample playback to deliver thick, warm, and expressive bass tones. Designed specifically for Hip-Hop, Neo-Soul, Funk, Trap, and modern urban music , it provides the depth, glide, and analog-style warmth that today's producers demand. Instead of thin digital bass sounds, BASSalicious 2 uses a unique hybrid architecture—layering thousands of wavetables with sampled bass sources—to create ultra-warm, organic low-end that sits perfectly in modern urban mixes. A dedicated glide and slide engine allows notes to flow naturally without retriggering, giving bass lines a realistic, musical feel whether programmed or played live. 🎶 Urban Bass Sound Architecture

  🎛️ Filters, FX & Control

  🎧 Presets & Content

  🎹 Performance & Workflow

  🎶 Ideal For

  ⭐ Summary

  BASSalicious 2 is built to be the best synth bass plugin for urban genres. With its hybrid sample + wavetable engine, ultra-warm PhatTable technology, authentic glide behavior, and analog-style filters, it delivers powerful bass tones for Hip-Hop, Neo-Soul, Funk, Trap, and modern urban music production .
specs: |-
  - Hybrid Sample + Wavetable Engine Combines deep sampled bass content with thousands of wavetables for powerful, flexible urban bass design.
  - PhatTable Warmth Technology A proprietary wavetable system that preserves thickness and harmonic warmth often lost in digital synths—perfect for Hip-Hop, Neo-Soul, and Trap bass lines.
  - Thousands of Wavetables From smooth and round to aggressive and modern, covering the full spectrum of urban bass tones.
  - Authentic Glide & Slide True mono-bass glide behavior prevents note retriggering, ideal for expressive Trap slides, Funk lines, and Neo-Soul movement.
  - Analog-Style Moog-Inspired Filters Warm low-pass filtering with resonance that gives bass sounds punch, movement, and classic analog feel.
  - Multi-Mode Filtering Shape bass tones for everything from smooth R&B grooves to aggressive Trap sub bass.
  - Extensive Modulation Envelopes, LFOs, velocity, and aftertouch add life and expression to urban bass performances.
  - 400+ Urban-Ready Presets Bass sounds crafted for Hip-Hop, Neo-Soul, Funk, Trap, and R&B production.
  - Hybrid Bass Library Includes synth basses, sampled bass textures, and layered hybrid patches.
  - Mono & Poly Modes Optimized for solid sub bass lines or expressive synth bass performances.
  - MIDI Learn Ready Map controls easily for live play and automation.
  - Low-Alias Full-Band Engine Maintains warmth and clarity across the entire frequency range.
  - Hip-Hop producers needing punchy, warm bass
  - Trap producers using glide-heavy bass lines
  - Neo-Soul and Funk musicians seeking expressive low-end
  - Urban producers wanting a single, versatile bass instrument
