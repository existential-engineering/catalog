details: |-
  AIR Music Technology originally created Boom as part of the creative
  collection of instrument plug-ins included as part of avid Pro Tools. As the
  popularity of Pro Tools grew, more and more musicians and producers relied on
  the incredible sonic firepower of this amazing drum machine. Boom continued to
  evolve, and demand grew.

  Boom features a slick modern interface that pays homage to the most popular
  vintage drum machines of the past. Boom has been used on many famous projects
  since its launch, ranging from hit albums, feature films and radio projects.
  It's one of the most loved pro tools plugins.

  Boom includes a diverse collection of 10 different classic electronic drum
  kits, offering variations on the classic 808 and 909 kits, more aggressive
  dance and urban-style kits and a powerful retro style kit modelled on the
  concept of a 'cr78 merged with a 606'. Each one has been created with great
  attention to detail and provides serious sonic impact.

  Each kit contains 10 different drums, and you can adjust the panning, volume,
  tuning and decay of each drum within a kit. Each drum channel also contains a
  special tuning screw that can be turned to make a sonic adjustment, specific
  to a particular drum. This tweaking ability provides for nearly limitless
  possibilities with a user-friendly interface.

  You can mix and match drums from different kits to make your own custom kit,
  and the drum sounds can be triggered individually via standard MIDI pitch
  mappings. For instant inspiration, over 50 presets are included cover
  contemporary, classic electronic/urban musical genres. Boom also has an
  on-board sequencer that enables you to create and trigger your own patterns,
  which can be saved and recalled as presets.
specs: |-
  - 10 different classic electronic drum kits
  - Classic 808 and 909 kits
  - Dance and urban-style kits
  - Cr78/606 retro style kit
  - 10 drums per kit
  - Panning adjustment
  - Volume adjustment
  - Tuning adjustment
  - Decay adjustment
  - Per-drum tuning screw
  - Custom kit creation
  - MIDI pitch mappings
  - Over 50 presets
  - On-board sequencer
  - Pattern select mode
  - Pattern edit mode
  - Color-coded MIDI mapping
  - Matrix display
  - Pattern copy function
  - Playback modes: normal, double, half, triplet time
  - Swing control
