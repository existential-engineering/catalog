description: Plugin collection emulating classic vintage British console preamp/EQs, a diode bridge limiter/compressor, and a legendary line amplifier module. Inspired by 80-series hand-wired consoles used at Sound City, Electric Lady, and Sphere Studios. Features Brainworx Tolerance Modeling Technology with 32 distinct channels, Mix knob, variable THD, and V Gain adjustments.
details: |-
  Multiple vintage processor modules (preamp/EQ, limiter/compressor, line amplifier)
  Diode bridge limiter/compressor with smooth, creamy character
  Buss mode for analog console character
  Tolerance Modeling Technology (licensed from Brainworx) with 32 distinct channels
  Plugin-exclusive controls: Mix knob, variable THD, V Gain adjustments
