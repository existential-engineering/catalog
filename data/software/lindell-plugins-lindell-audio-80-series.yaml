description: Plugin collection emulating classic vintage British console
  preamp/EQs, a diode bridge limiter/compressor, and a legendary line amplifier
  module. Inspired by 80-series hand-wired consoles used at Sound City, Electric
  Lady, and Sphere Studios. Features Brainworx Tolerance Modeling Technology
  with 32 distinct channels, Mix knob, variable THD, and V Gain adjustments.
details: |-
  Lindell Audio's 80 Series is an exacting emulation of classic vintage preamp/EQs, a diode bridge limiter/compressor, and a legendary line amplifier module, all faithfully recreated for your DAW. Each module is inspired by components from a hand-wired British console that shaped the sound of countless seminal records over the past 30 years. Think Queen, David Bowie, Nirvana, Red Hot Chili Peppers, Slipknot, and more. The sound of this analog legend is nothing short of extraordinary, and in the Lindell 80 Series, you'll find that same full-bodied, aggressive power to help your productions sound as rich and analog as possible.

  Dating back to 1969 when it was first brought to the market, the 80 series analog mixing desks attained somewhat of a cult-like status due to their uniqueness and rarity. Known for their breathtaking depth, pristine high end and rich definition, the individual modules that comprise these desks have stood the test of time, and have inspired countless high-end clones. It's no wonder that institutions like Sound City Studios, Oscilloscope Labs, Electric Lady Studios and Sphere Studios have relied on the sound and features offered by this desk. Lindell 80 Series Channel brings the sound of this desk into the digital domain.

  On its own, this classic British-style preamp/EQ is one of the most revered in recording history, capable of beautifully musical high-end boosts and incredibly full, weighty low-end amplification. Add to that a faithful recreation of a more flexible and precision-focused EQ variant, beloved by engineers for its versatility, and you'd already have a plugin worth more than the price of admission. But the 80 Series offers even more: a smooth and creamy diode bridge limiter/compressor, a vintage line amplifier for added richness and harmonic color, and a special Buss mode that delivers the analog console character without added complexity.

  To complete their new console offering, Lindell Audio has licensed the patented Tolerance Modeling Technology from Brainworx to provide an authentic analog experience in the digital realm. Mix your songs using 32 distinct channels to replicate the various component tolerances found in the original hardware. Plugin-only features include a Mix knob for the limiter/compressor, variable THD and V Gain and more.
specs: |-
  - Lindell 80 Series Channel: the vintage sound of classic British preamps, EQs, and diode bridge compression, right in your DAW
  - TMT, Brainworx patent-registered Tolerance Modeling Technology (US Patent No. 10,725,727)
  - True analog algorithmic emulation of all part components
  - Three-band equalizer with mic and line transformer modelling
  - Switchable vintage EQ inspired by a legendary preamp design, with a different palette of frequency selections
  - Single-sided, discrete, Class-A electronics and a trio of transformers in the audio path
  - Auto Recovery, parallel mix control on the compressor, THD, 32 channels of TMT
  - Oversampling: from 2x up to 16x
  - GUI Zoom: scale the plugin GUI from 70% of standard size up to 100%
  - Lindell 80 Series Buss: a vintage line amplifier originally designed for legendary 80 Series consoles
  - Fat low-end response, extreme console mix separation
  - Supported plugin formats: AAX AudioSuite, AAX Native, AU, VST2, VST3
  - Supported operating systems: macOS 26 down to macOS 13, Windows 11 down to Windows 10
  - Mac: Intel or Apple Silicon
  - PC: x64-compatible CPU
  - Display resolution: 1440 x 900px or 1280 x 960px or higher
  - Memory: 2 GB RAM
