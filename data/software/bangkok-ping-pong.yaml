id: _SW5pZ_hx_9-VSxeL3Qr7
name: Bangkok Ping Pong
manufacturer: witch-pig
primaryCategory: delay
description: Set the initial delay direction by using balance. Set to 0.5 to
  centre the delays so there is no 'ping pong' between the left and right.
details: |-
  Set the initial delay direction by using balance. Set to 0.5 to centre the
  delays so there is no 'ping pong' between the left and right.

  Use delay to either set the length of the repeats in seconds, or click on
  'sync' to set the time in fractions related the bpm of the DAW.

  Lfo will set the width of the filter applied to the repeats, and frequency
  sets how quickly the filter moves backwards and forwards.
specs: |-
  - Ping pong filtered delay
  - Balance control
  - Delay time control
  - Sync to DAW bpm
  - LFO filter width
  - Filter frequency control
  - macOS support
  - Windows support
