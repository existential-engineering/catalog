description: Oxford EQ is a five-band parametric EQ derived from the Sony OXF-R3 console. Four EQ types cover everyday mixing, corrective resonance control, tonal shaping and mastering. A GML-8200 emulation is available to Pro Tools HDX owners as an upgrade.
details: |-
  The Sonnox Oxford EQ is a 5-band parametric EQ derived from the Sony OXF-R3 console. It provides four distinct EQ types covering a range of tasks, from corrective adjustments through to tonal shaping, with ultra-low noise and transparent performance for precise edits without colouring the sound. It is aimed at music, film and live sound work.

  Type 1, the Workhorse, is a versatile SSL E-style EQ providing smooth, transparent results with minimal effort, the go-to for everyday mixing needs where balance and clarity are essential. Type 2, the Surgeon, is designed for more remedial work, offering asymmetrical cut and boost curves that make it highly effective for resonance control and corrective EQing, and it excels on drums, percussion and other transient-heavy instruments.

  Type 3, the Sculptor, is based on classic console EQs like the Neve and SSL G series and provides softer, musical curves perfect for tonal shaping on vocals, instruments, or entire mixes. Type 4, the Polisher, is the go-to choice for mastering, delivering smooth, gentle curves that help blend and balance entire tracks, giving them a cohesive, polished finish.

  Exclusively for Pro Tools HDX users, a GML-8200 emulation is available as an upgrade to Oxford EQ HDX owners through their user areas. It is the only GML-8200 emulation developed with and endorsed by George Massenburg, faithfully reproducing the characteristics of the legendary hardware EQ, renowned for its ability to deliver airy, detailed top-end frequencies, and suited to mastering engineers seeking extra precision and clarity.
specs: |-
  - 5-band parametric EQ modelled on the Sony OXF-R3 console
  - Four selectable EQ types: Type 1 (Workhorse, SSL E-style), Type 2 (Surgeon, asymmetrical cut and boost curves), Type 3 (Sculptor, Neve and SSL G-inspired curves), Type 4 (Polisher, mastering)
  - Ultra-low noise, transparent performance
  - Variants: 5-Band EQ & Filters, 5-Band EQ, 3-Band EQ, Filters, in mono and stereo
  - Optional GML-8200 EQ upgrade for Pro Tools HDX owners, endorsed by George Massenburg
  - AAX-Native requires Pro Tools 11 or later
  - AAX-DSP for Pro Tools Ultimate, Pro Tools HD, or Avid VENUE systems
  - AAX-DSP instances per chip, 5-Band EQ & Filters: 16 mono / 9 stereo at 44.1-48 kHz, 8 mono / 4 stereo at 96 kHz, 3 mono / 2 stereo at 192 kHz
  - AAX-DSP instances per chip, 5-Band EQ: 31 mono / 18 stereo at 44.1-48 kHz, 15 mono / 8 stereo at 96 kHz, 7 mono / 4 stereo at 192 kHz
  - AAX-DSP instances per chip, 3-Band EQ: 38 mono / 22 stereo at 44.1-48 kHz, 18 mono / 10 stereo at 96 kHz, 8 mono / 5 stereo at 192 kHz
  - AAX-DSP instances per chip, Filters: 30 mono / 16 stereo at 44.1-48 kHz, 14 mono / 8 stereo at 96 kHz, 6 mono / 3 stereo at 192 kHz
  - macOS 10.13 High Sierra or later
  - Windows 10 (64-bit) or later
  - Two simultaneous activations per licence, authorised with an iLok account (Local Machine, iLok2/iLok3 USB device, or iLok Cloud)
  - Free trial available
