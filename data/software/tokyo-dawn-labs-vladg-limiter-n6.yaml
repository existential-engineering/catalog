description: Vlad's original Limiter N°6, a combination of 5 different dynamic processors.
details: |-
  Limiter N°6 is Vladislav Goncharov's original mastering limiter, combining five dynamic processing modules in one plug-in: an RMS compressor, a peak limiter, a high-frequency limiter, a clipper and a true peak limiter.

  It offers brickwall and soft limiting with different timing settings, M/S and multiband modes, optional 4x oversampling, true inter-sample peak (ISP) limiting, analog-style indication and two different GUI skins.

  The product is discontinued. Tokyo Dawn Labs offers the download for historical reasons only, with no active support and no guarantee of compatibility with modern systems.
