description: DirectX/VST plugin that significantly reduces any kind of broadband noise while excellently preserving the audio quality of the original signal.
details: |-
  NoiseFree automatically removes or reduces any kind of constant background
  noise like hiss, surface noise, hum, air-conditioning equipment or camera
  sound. Due to the Algorithmix proprietary, psycho-acoustically optimized noise
  reduction algorithm, NoiseFree efficaciously preserves timbre, ambience, and
  low-level details of the original signal.

  It can be used for high-resolution re-mastering tasks, and is a real weapon in
  cleaning up critical speech recordings for forensic purposes.

  The de-noising process can work based on either the built-in white noise
  profile or a recorded noise profile. The unique Learn algorithm allows
  recording a noise sample from virtually any part of the audio material, even
  if there is no noise-only portion available. A sophisticated 5-band Noise
  Profile EQ is provided for modifying the shape of noise profiles.

  The advanced parameters Ambience, Recovery and Decorrelation allow fine tuning
  NoiseFree to differentiate between real noise and sharp signal transients. The
  Chase function automatically detects any fluctuations in the background noise
  and adaptively adjusts the noise profile.

  NoiseFree works impeccably with sampling rates up to 384 kHz, perfectly
  suitable for high-resolution DSD post-processing.
specs: |-
  - Psycho-acoustically optimized noise reduction
  - Built-in white noise profile and custom noise profiling
  - Unique Learn algorithm for noise sample extraction
  - 5-band Noise Profile EQ
  - Chase function for adaptive noise tracking
  - Differ function for monitoring removed signal
  - Supports sampling rates up to 384 kHz
  - Low CPU requirement with real-time processing
  - Compatible with Sequoia, Samplitude, Pyramix, WaveLab, Adobe Audition, Nuendo, Cubase
