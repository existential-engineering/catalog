description: Analog-modelled dynamic equalizer providing up to 16 non-linear, dynamic filter sections supporting over 30 different filter types. Each filter type can run in static or dynamic mode with external side chain support.
details: |-
  ToneBoosters Equalizer 4 provides up to 16 non-linear, dynamic filter sections supporting over 30 different filter types. Each filter type can run in static or dynamic mode with external side chain support.

  Dynamic equalization includes upward and downward compression as well as upward expansion for transient equalization. Each filter section also has auto level make-up.

  Each filter can run with digital purity for pristine results, or using advanced analog circuit simulation for character and warmth, and each section is configured independently.

  The integrated spectrum analyzer allows for quick and informed EQ decisions, and the AI assistant can provide content-type dependent EQ suggestions. Up to 16-channel spatial audio is supported.

  Equalizer is also available for iPhone and iPad from the App Store, and as an in-app purchase for Audio Evolution Mobile Studio on Android and iOS.
specs: |-
  - Up to 16 non-linear, dynamic filter sections
  - Over 30 filter types
  - Static or dynamic mode per filter, with external side chain support
  - Upward and downward compression plus upward expansion for transient equalization
  - Digital-purity or analog circuit simulation per filter section
  - Auto level make-up per filter section
  - Integrated spectrum analyzer with AI-assisted EQ suggestions
  - Up to 16-channel spatial audio support
  - Resizable user interface that fits every screen and resolution
  - Dozens of colour themes
  - Undo, redo and A/B switching
  - Preset management with import and export
  - Multiple simultaneous instances
  - License activation without a hardware dongle
  - Sample rates up to 384 kHz
  - Personal, perpetual desktop licence for Windows, macOS and Linux, for use on up to 4 computers
