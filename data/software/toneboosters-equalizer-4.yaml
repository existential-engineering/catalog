details: |-
  Over 30 filter types to choose from. Dynamic processing with compressive/expansive equalization and transient shaping. Each filter can operate digitally or with analog circuit modeling. Built-in spectrum analyzer with AI-powered EQ suggestions. Auto makeup gain per filter section. Up to 16-channel spatial audio support.
specs: |-
  Sample rates up to 384kHz. Up to 16 channel spatial audio support. Personal perpetual license for up to 4 computers.
