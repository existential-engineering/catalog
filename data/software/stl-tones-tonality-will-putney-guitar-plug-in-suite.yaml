description: "OVERVIEW Tonality - Will Putney is an all-in-one guitar & bass
  plug-in suite from record producer/engineer/mixer Will Putney. We've spent the
  last year developing this plug-in alongside Putney to recreate the power and
  quality of Will's production work, and we are all extremely proud of the
  result. Will's entire setup is in this plug-in, including the modeling of his
  amps, pedals, cabs, summing mixer, and master eq module. Aside from the stock
  Presets, we have included nearly 100 of Wills guitar & bass album tones, which
  were recreated meticulously with unique amp/cab settings. Will Putney is an
  American producer, mixer, and engineer based in Belleville, New Jersey. He is
  responsible for releases from bands like Every Time I Die, The Amity
  Affliction, The Acacia Strain, Body Count, Thy Art Is Murder, Northlane,
  Gojira, Silent Planet, After The Burial, Terror, Unearth, Knocked Loose, Norma
  Jean, Fit For An Autopsy, Vein, Harms Way, Stray From The Path, and
  Counterparts. Click HERE to view Will's full discography."
