details: |-
  In 2012, Kush dropped the UBK-1 into a world where nobody expected plugin compressors to have any kind of special or interesting vibe. Built on faithful models of the strange and aggressive curves Gregory Scott developed for the enigmatic UBK Fatso hardware, UBK-1 was the first plugin to give ITB mixers a movement-and-groove-based tool that encouraged blind turning of a few knobs to quickly get at sounds and textures that tended to be as surprising and novel as they were useful.

  UBK-2 takes all of the things that made the original special, one big knob for more-or-less compression tuning, rapid switching thru preset attack-release-knee-ratio curves, analog-voiced saturation, and leaves them all intact, you can use UBK-2 the same way you used UBK-1. Alternatively, you can dive deeper and exert a degree of control over nearly every aspect of the UBK-2's functions.

  3 new compression presets enable styles of compression not possible with UBK-1, including the very gentle low-ratio Cream for delicate jobs like the mix buss. All 8 compression curves can have their baseline attack and release times adjusted faster or slower, and all feature tight Gain Reduction matching between them, so you can freely switch between them while keeping gain reduction and overall gains consistent.

  UBK-2 flanks the updated compressor section with two newly-tuned saturation engines, one pre- and one post-compression, each voiced to suit the types of transients it's likely to be presented with. An old school, pre-everything 4 band EQ leverages Kush's new, Magpha-based equalizer algorithms.

  All of these linear and non-linear processes can now be monitored via Kush's signature 'Tri-Meter' display, first introduced in the dirt-loving Silika compressor. This VU meter allows for effortless, at-a-glance monitoring of Input and Output levels, Gain Reduction, or all three at once.
specs: |-
  - 8 compression curves, all with adjustable baseline attack and release times
  - 3 new compression presets versus UBK-1, including the low-ratio Cream curve for the mix buss
  - Tight gain reduction matching across all compression curves, so curves can be switched without level jumps
  - Two newly-tuned saturation engines, one pre-compression and one post-compression
  - Pre-everything 4 band EQ using Kush's Magpha-based equalizer algorithms
  - Tri-Meter VU display showing Input level, Output level and Gain Reduction, individually or all three at once
  - 2 activations per licence, free updates and support, all available presets
  - Free 10 day demo via a demo code on the product page
