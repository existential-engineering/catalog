description: "Antelope Cosmos - The hardware-quality Antelope Audio Synergy Core
  FX are now available in native plug-in formats, ready to be incorporated into
  your recording, mixing, or mastering projects."
details: |-
  Antelope Cosmos (formerly Synergy Core Native) is a subscription-based collection of 75+ world-class native audio plugins covering compressors, EQs, reverbs, delays, pitch correction, modulation, metering and more. New plugins are added to the collection regularly at no extra cost.

  The plugins are built on Antelope Audio's analog modeling expertise, originally developed for the company's FPGA and DSP-based Synergy Core hardware. The same sonic depth and authenticity is delivered here in pure software form, without requiring any Antelope hardware to run.

  The collection includes emulations of world-famous studio classics — iconic compressors, EQs, reverbs and effects used on countless chart-topping albums — alongside exclusive in-house plugins not available elsewhere, such as pitch correction, creative delays, modern reverbs, distortion and ultra-rare hardware models.

  Every plugin in the collection ships with pro-made presets crafted by experienced engineers and producers, helping users dial in great-sounding starting points quickly across any style or session.

  Each subscription includes 2 licenses for activation on 2 machines and a 14-day free trial upon sign-up. Licensing is handled via iLok Cloud or iLok USB (2nd gen or higher).
specs: |-
  - 75+ world-class native plugins included
  - New plugins added regularly at no extra cost
  - VST3, AU and AAX plug-in formats
  - Runs on macOS (Apple Silicon native, no Rosetta required) and Windows
  - 2 licenses included for activation on 2 machines
  - 14-day free trial available upon sign-up
  - iLok Cloud or iLok USB (2nd generation or higher) required for licensing
  - Tested DAWs: Avid Pro Tools, Ableton Live, Image-Line FL Studio, PreSonus Studio One, Steinberg Cubase, Bitwig Studio, Cockos Reaper
  - No Antelope Audio hardware required
  - Plugin categories included: Compressors, Equalizers, Reverbs, Delays, Pitch Correction, Modulation, Preamps, Guitar Amps, Special Processing, Antelope Exclusives, Metering
