description: "Add classic tape echo to your mix with Antelope Audio's Tape Delay
  native plugin. Vintage sound, 4 tape types, stereo ping-pong, tempo sync, and
  Tap Tempo control. Try free for 14 days."
details: |-
  Tape Delay delivers the unmistakable sound of analog tape delay—with all the warble, saturation, and depth that define vintage echo hardware—enhanced with intuitive digital features for precise tempo control, stereo imaging, and tonal variety.

  The plugin recreates the lush, saturated sound of vintage tape echo, complete with subtle pitch modulation, saturation, and analog-style imperfections that add warmth and depth. Delay time can be set in BPM or milliseconds for precise syncing with your project, and the Tap Tempo button enables quick, hands-on adjustment without manual value entry.

  Activate Ping-Pong mode for rhythmic echoes that alternate between left and right, with a Spread control to dial in stereo width—from subtle movement to wide, immersive delay effects. Four unique tape flavors, each with its own saturation, tone, and texture, let you fine-tune the character of the delay and shape how the repeats sit in the mix.

  A clean, responsive interface with vintage-inspired visuals makes it easy to dial in inspiring delay effects fast—whether you're after tight rhythmic slaps or expansive ambient tails. Tape Delay runs natively in your DAW on macOS or Windows and is part of the Antelope Cosmos plugin collection, with a 14-day free trial available.
