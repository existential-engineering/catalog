description: Easy-to-use parametric equalizer effect that is exclusive to
  Antelope Audio interfaces. Sounds great even when pushed.
details: |-
  ClearQ is Antelope Audio's integrated parametric equalizer that runs in real-time on Synergy Core interfaces, providing tracking and mixing-grade EQ powered by the platform's onboard DSP/FPGA processing.

  The plug-in offers 5 fully parametric bands: the two outer bands can operate in filter or shelving mode, while the three middle bands cut or boost selected frequency ranges.

  Designed with a simple yet musical voicing, ClearQ is positioned by Antelope as a go-to EQ for both tracking and mixing because it provides everything users might need in an everyday equalizer.
specs: |-
  - 5 fully parametric bands
  - Two outer bands switchable between filter and shelving modes
  - Three middle bands for cut/boost across selected frequency ranges
  - Runs in real-time on Synergy Core interfaces
  - Suitable for tracking and mixing workflows
