details: |-
  AuToBaSsYx 2 is a virtual analog bass synth with an integrated 16 steps
  sequencer. Sequences are generated by a random function or from hand drawn
  patterns. Sequences can then, be arranged with the scaler module to stay in a
  desired scale or to create different melodies from the same inputed keys.

  2 different envelope types are available, one emulates a tb303 behaviour. 3
  different lfo types modulate the signal to achieve swoosh and wobble sounds,
  sought-after in psytrance and dubstep productions.

  All controls are cc assignable (even the sequencer individual keys or the lfos
  memory selection)
specs: |-
  - 8 voices polyphony
  - 1x osc (saw)
  - 1x porta/glide control
  - 2x envelope type (ADSR/303 style)
  - 1x detuner (+24/-24) with fine adjustment
  - 1x 16 steps sequencer with random and variable speed (1x & /2)
  - 1x scaler (with drawn pattern recall and random)
  - 1x variable state filter
  - 3x LFOs with memory slots (5 per LFO): 2 sync and 1 sync/free type
  - 1x ADSR
  - 1x phaser FX unit
  - 1x distortion FX unit
  - 1x chorus/flanger FX unit
  - 1x reverb FX unit
  - 1x bpm delay FX unit
  - 1x gain control
  - 1x preset manager with copy/paste
  - Windows
