description: PSP MicroWarmer delivers the rich, analog-style warmth and punch of PSP VintageWarmer in a streamlined, single-band design. Ideal for individual tracks, it combines transparent limiting with smooth tape-like saturation, all with ultra-low latency.
details: |-
  PSP MicroWarmer delivers the rich, analog-style warmth and punch of the legendary PSP VintageWarmer in a streamlined, single-band design. Ideal for individual tracks, it combines transparent limiting with smooth tape-like saturation, all with ultra-low latency.

  Featuring precise VU and PPM metering, professional overload indicators, and 64-bit processing, PSP MicroWarmer brings classic analog character and modern precision together in one essential mixing tool.

  Running PSP MicroWarmer in 30-day trial mode or activating it requires a free iLok user ID and the free iLok License Manager application. No hardware dongle is needed.

  The license activates in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above), and the locations can be changed at any time using PACE's iLok License Manager.
specs: |-
  - High quality signal processing algorithms
  - Single-band signal processing
  - 64-bit, double precision floating point processing
  - Shelf filters for bass and treble frequencies with constant corner frequencies optimized for track processing
  - Accurately calibrated VU and PPM meters with the overload indicators
  - Up to 192kHz sample rates supported
  - Library of presets
  - Lowest possible latency for a given "Warmer Family" algorithm
  - Windows 7 - Windows 11, VST, VST3 and AAX, 64-bit host required
  - macOS X 10.14 Mojave - macOS 16, Intel and Apple Silicon, AudioUnit, VST, VST3 and AAX, 64-bit host required
  - AAX supported in Pro Tools
  - Requires a free iLok user ID and the iLok License Manager application, no hardware dongle needed
  - License can be activated in 3 separate locations (computer or iLok dongle, 2nd generation or above)
  - 30-day trial available for macOS and Windows
