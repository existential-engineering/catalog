description: PSP MicroWarmer delivers the rich, analog-style warmth and punch of the legendary PSP VintageWarmer in a streamlined, single-band design. Ideal for individual tracks, it combines transparent limiting with smooth tape-like saturation — all with ultra-low latency.
details: |-
  PSP MicroWarmer is a single-band saturation and limiting plugin based on the algorithms behind PSP VintageWarmer. Features shelf filters for bass and treble with constant corner frequencies optimized for track processing. Licensing is iLok-based (free iLok user ID required, no hardware dongle needed) with activation across up to 3 locations.
specs: |-
  - 64-bit double precision floating point processing
  - Sample rate support up to 192kHz
  - Ultra-low latency
  - Calibrated VU and PPM meters with overload indicators
  - Shelf filters for bass and treble
  - Single-band signal processing
  - Preset library included
  - Windows: 7-11 (64-bit)
  - macOS: 10.14-16 (Intel and Apple Silicon)
  - iLok License Manager required (no hardware dongle); up to 3 activations
