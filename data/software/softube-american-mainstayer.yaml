details: |-
  Legendary high-gain tone with massive punch. An absolute "mainstay" in the scene since its origin in the early 1990s.

  An exacting emulation of an iconic 1990s high-gain tube amp, for tight lows, aggressive mids, and searing gain.
specs: |-
  - An exacting emulation of an iconic 1990s high-gain tube amp
  - For tight lows, aggressive mids, and searing gain
  - Use in Flow Mixing Suite, Amp Room, or as a standalone plug-in
  - Supported sample rates: 44.1, 48, 88.2, 96, 176.4, and 192 kHz, in both mono and stereo
  - Requires a Softube account and an iLok account (no physical iLok required)
