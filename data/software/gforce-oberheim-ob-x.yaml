description: Officially endorsed emulation of the classic 1980s Oberheim OB-X synthesizer. Preserves the original's character while adding modern production capabilities including up to 16-voice polyphony, X-Modifier technology, chord mode with scaler, arpeggiator, and built-in effects. Used by artists including Japan, Ultravox, Depeche Mode, and Queen.
details: |-
  GForce Software's Oberheim OB-X is the world's first officially endorsed emulation of the classic 1980s Oberheim OB-X synthesizer. The original instrument was used by legendary artists including Japan, Ultravox, Depeche Mode, Queen, Herbie Hancock, and Chick Corea. This modern software version preserves the beloved character of the original while introducing contemporary sound design capabilities suited for electronica, EDM, drum and bass, ambient, rock, and hip hop production.

  The OB-X offers up to 16-voice polyphony with poly, mono, legato, and unison modes. It includes a vintage control for simulating analog imperfections, four programmable macros, separate PWM controls for oscillators, and 4-stage filter and loudness envelopes. Advanced modulation features include sync, intro, retrigger, phase, and smoothing options for the LFO.

  X-Modifier technology enables extensive parameter modulation through independent X-LFO and X-ADSR controls. Additional features include a chord mode with scaler, arpeggiator, built-in chorus, stereo delay, and matrix reverb effects. The fully-resizable interface includes per-voice panning for wide stereo effects and ships with 400+ production-ready presets.
specs: |-
  - Polyphony: up to 16 voices
  - Voice modes: Poly, Mono, Legato, Unison
  - Oscillators: 2 per voice with separate PWM controls
  - Filter: 4-stage filter envelope
  - Envelopes: 4-stage filter and loudness
  - Vintage control for analog imperfection simulation
  - Modulation: X-Modifier (X-LFO and X-ADSR per voice)
  - Chord mode with scaler and arpeggiator
  - Per-voice panning for stereo width
  - Macros: 4 programmable
  - Effects: Chorus, Stereo Delay, Matrix Reverb
  - Presets: 400+
  - Fully scalable UI
  - Mac: Intel & Apple Silicon native, macOS 10.13+
  - Windows: 2GHz CPU, 2GB RAM, Windows 7+
  - Mac formats: Standalone, AudioUnit, AAX, VST2, VST3
  - Windows formats: Standalone, VST2, VST3, AAX
