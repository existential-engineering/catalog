description: Officially endorsed emulation of the classic 1980s Oberheim OB-X
  synthesizer. Preserves the original's character while adding modern production
  capabilities including up to 16-voice polyphony, X-Modifier technology, chord
  mode with scaler, arpeggiator, and built-in effects. Used by artists including
  Japan, Ultravox, Depeche Mode, and Queen.
details: |-
  The original synth was used by artists and groups such as Japan, Ultravox, BBC Radiophonic Workshop, Chick Corea, Herbie Hancock, Depeche Mode, Queen, Larry Dunn, Youth, Chris Franke and Styx. GForce’s OB-X preserves the sound everybody loves and has been upgraded to offer new sonic possibilities.

  Oberheim OB-X provides an authentic experience enhanced with features designed for the modern setup: up to 16-voice polyphony, a Vintage control for adding subtle analogue imperfections, four programmable macros, new intro, retrigger, phase and smoothing features for the LFO, a new level destination for the LFO, separate PWM1 and 2, discrete levels and tracking, an arpeggiator, a chord mode with scaler, and chorus, stereo delay and reverb effects. It is also augmented with X-Modifiers, dedicated LFOs and ADSRs for almost all parameters.

  Using GForce’s X-Modifier technology the scope of sound modulation is immense. The X-LFO and X-ADSR section enables you to work faster without setting up modulation paths; they are already set up for you. X-Mods provide the ability to create extensive modulations of almost every parameter, so while the tone and character at the heart of the synth remain authentic to the original, the additional features turn it into a sonic canvas.

  OB-X features a preset browser with extensive tagging, sorting and search, and over 400 brand-new production-ready presets from sound designers and artists including Lightbath, GEOsynth, Christian Lafitte, Richard Veenstra and Ramon Kerstens (K/V), Tontario, Stuart Thomas, Zardonic, Drew Schlesinger, Drew Neumann, Noyzlab, Dave Spiers, Tom Wolfe and Graeme Rawson. The patches range from resolutely modern to passionately classic.
specs: |-
  - Polyphony: up to 16 voices
  - Voice modes: Poly, Mono, Legato, Unison
  - Oscillators: 2 per voice with separate PWM controls
  - Filter: 4-stage filter envelope
  - Envelopes: 4-stage filter and loudness
  - Vintage control for analog imperfection simulation
  - Modulation: X-Modifier (X-LFO and X-ADSR per voice)
  - Chord mode with scaler and arpeggiator
  - Per-voice panning for stereo width
  - Macros: 4 programmable
  - Effects: Chorus, Stereo Delay, Matrix Reverb
  - Presets: 400+
  - Fully scalable UI
  - Mac: Intel & Apple Silicon native, macOS 10.13+
  - Windows: 2GHz CPU, 2GB RAM, Windows 7+
  - Mac formats: Standalone, AudioUnit, AAX, VST2, VST3
  - Windows formats: Standalone, VST2, VST3, AAX
