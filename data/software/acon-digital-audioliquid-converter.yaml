details: |-
  AudioLiquid Converter helps users handle the multitude of different audio file
  formats. AudioLiquid Converter converts audio quickly and with great ease of
  use to a desired target format. Audio can be imported from audio cds or
  complete folder structures as well as from audio or video files.

  After defining the target format and, if desired, adding any number of
  processing tools, a single mouse click is sufficient to convert and process
  complete music collections. Furthermore, the integrated audio cd burner lets
  users create audio cds without leaving the program.

  The integrated processing tools range from high frequency synthesis for
  restoration of strongly compressed audio files to equalizing and dynamic
  processing. The support for third party VST and directx plug-ins allows users
  to further extend the integrated processing capabilities.

  Supported audio formats: wav, mp3, wma, ogg, AU, aiff (only import), avi (only
  import), wmv (only import).

  Reads and writes the following file formats: ogg vorbis format (ogg), wave
  audio format (wav), windows media audio (wma), mpeg layer 3 (mp3), sun audio
  format (AU). Reads the following file formats: aiff (macintosh audio files).
  Imports audio tracks from the following video file formats: mpeg video (mpg,
  mpeg), windows media video (wmv), audio video interleave (avi - additional
  codec may be required).
