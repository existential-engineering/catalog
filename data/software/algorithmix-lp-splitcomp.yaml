description: High-resolution linear-phase split compressor for VST-compatible
  audio workstations, featuring parallel mode, linear-phase split filters,
  adjustable soft knee, intelligent auto-release, and parameterized soft
  clipper.
details: |-
  LP SplitComp is a creative dynamic tool with unparalleled transparency and
  sound purity combining the best of both the analog and digital worlds. The
  split function allows dynamic processing only in the band of interest, with
  the frequency crossover made using low-noise linear-phase filters for perfect
  band recombination after processing.

  The character of the PlugIn can be continuously adjusted between being more
  compressor or rather limiter. It provides psychoacoustically optimized
  features like automatic dynamic characteristics, soft knee, and parameterized
  soft clipper. Reference-quality oversampling reduces alias frequencies.

  LP SplitComp is the second one in the Algorithmix CHROMIUM SERIES. In
  Split-Band mode, the signal is divided in two complementary parts: one is
  compressed and the other is passed through without dynamic changes. The
  linear-phase technology ensures reconstruction without phase distortion.

  The side chain includes a range of filters for frequency-dependent signal
  detection. A sophisticated release computer provides program-dependent
  reaction to complex audio material. The Differ function allows listening to
  the difference between input and output signal.

  A compact auxiliary Metering panel shows all level meters and indicators
  simultaneously.
specs: |-
  - Linear-phase split band compressor
  - Full-Band and Split-Band modes
  - Parallel compression with exact delay alignment
  - Selective mode for unique parallel compression derivative
  - Adjustable Com/Lim ratio (compressor to limiter)
  - Soft knee with adjustable rounding
  - Parameterized soft clipper
  - Program-dependent adaptive release computer
  - Side chain with frequency-dependent filters
  - Reference-quality oversampling
  - Differ function (linear-phase path)
  - Compact auxiliary metering panel
  - Part of Algorithmix CHROMIUM SERIES
