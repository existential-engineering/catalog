details: |-
  Can an exciter be transparent? Weiss Exciter does what no other exciter plug-in can: it adds harmonic content so naturally it feels like part of the original sound. With no overcooked distortion or exaggerated EQ in sight. The result is the subtle, transparent enhancement of vibrancy and crispness, plus the preservation of the mix's integrity. The harmonics sound so organic, it's like they were always there. Making this the exciter you'll always reach for.

  Traditional exciters typically add a lot of "normal" EQ-ing with just a smidge of distortion. The overall effect is essentially that of an equalizer, which is very transparent. On the other hand, if you overdo the distortion with a traditional exciter, you often end up with too much audible distortion that doesn't sound very nice. So, with a traditional exciter, you often have either a lot of EQ-ing or too much distortion. But with Weiss Exciter, you get sonically pleasing harmonics with minimal EQ effect.

  Several features make Weiss Exciter truly transparent and help to battle the traditional issue of excess EQ-ing or too much distortion. Adaptive non-linearity ensures the harmonics are relevant and consistent regardless of the signal level. The Mastering switch reduces the amount of the fundamental frequency in the distortion, thereby reducing the EQ effect. You can also use precise pre- and post-filtering to target specific areas of your mix. Four mathematically designed Harmonics Modes ensure an elegant sound with enough harmonics to create the exciter effect, and the filters are phase-compensated to avoid phase-cancellation effects between the added harmonics and the original audio.

  Weiss Exciter uses a parallel signal path with a completely unaffected "dry" path, so the integrity of the original audio is preserved without unwanted side effects. It is distortion without coloration, without "box tone." It can also operate in linear phase mode, with no phase shift throughout the algorithm, for pristine audio. In minimum phase mode, all internal audio paths are phase compensated so that the blend between dry and wet happens without phase warping or cancellations.

  Despite its advanced processing, Weiss Exciter offers straightforward operation. The Frequency visualization lets you define a focus band for excitation and an output band for where the harmonics are added. You also control the four harmonic modes, stereo width, filter types, and the unique Mastering switch. Professional mastering engineers will appreciate the expert panel where you can get deeper control over harmonic shaping for precision and transparency at the highest level.
