description: Crushing, aggressive compressor based on the 1960s Shure Level-Loc
  brick wall limiter. Adds Darkness control, switchable release times, and dry
  signal mixing over the standard Devil-Loc.
details: |-
  Devil-Loc Deluxe is a crushing, aggressive compressor effect plugin based on the original 1960s Shure Level-Loc brick wall limiter used in public address systems. Soundtoys adapted this concept for modern production, notably influenced by engineer Tchad Blake's creative abuse of the hardware device.

  The Deluxe version includes a Darkness control for tone shaping, switchable slow/fast release times, and a mix knob to blend dry signal with the effect. The plugin excels at extreme compression capability for massive drum sounds and is automation-friendly for dynamic processing.

  The purchase includes both the standard Devil-Loc plugin (two-knob version) and the expanded Deluxe version.
specs: |-
  - Based on 1960s Shure Level-Loc brick wall limiter
  - Darkness control for tone shaping
  - Switchable slow/fast release times
  - Mix knob for parallel compression
  - Extreme compression capability
  - Automation-friendly design
  - Includes standard Devil-Loc (two-knob version)
  - 64-bit only, sample rates 44.1 kHz to 192 kHz
  - Apple Silicon compatible
