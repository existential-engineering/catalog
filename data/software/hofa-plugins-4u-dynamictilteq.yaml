description: 4U+ DynamicTiltEQ is a tilt EQ that balances bass and treble with a single control, offering up to 24 dB of boost/attenuation, variable tilt width, separate bass and treble processing, low/high cut filters, dynamic processing, and an integrated analyser, with up to 32x oversampling for Mac and PC.
details: |-
  HOFA 4U+ DynamicTiltEQ is the best freeware Tilt EQ plugin out there. It does everything the legendary analog models did: optimise the balance between bass and treble with one simple control at the highest audio level.

  We wanted to know which features the best Tilt EQ of the world needs and came up with a list, that leaves no wishes unfulfilled. The freeware version includes boost/attenuation of up to 24 dB, variable tilt width for transparent adjustments as well as musical sound shaping, separate bass and treble processing, low cut and high cut filters (6 & 12 dB/octave), individual routing for stereo, mid, side, left and right processing, up to 32x oversampling, and support for Mac and PC, 32- and 64-bit DAWs.

  It's extremely worth it to activate the dynamic feature for treble and bass processing and the integrated analyser. The very affordable paid version also offers parallel processing and a DRY/WET control.

  Despite all these extras, the 4U+ DynamicTiltEQ is a simple, self-explaining sound shaper: install it, start working and enjoy the good sound.

  HOFA 4U+ DynamicTiltEQ, the world's first dynamic Tilt EQ: sound shaping on the highest level, balanced sounds, intuitive workflow, analog feel of handling and sound, new creative expressions.
specs: |-
  - Formats: VST3, AU, AAX
  - Operating system: macOS 10.13 or later, Windows 10 or later
  - Boost/attenuation of up to 24 dB
