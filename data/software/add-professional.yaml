details: |-
  Audio Design Desk was awarded product of the year and best of show at nab
  2023. Audio Design Desk is an ai-assisted content creation tool that reinvents
  the process of connecting audio to video. We've developed proprietary a.I.,
  called sonic intelligence, to power the user experience in Audio Design Desk
  (add) and completely reinvent the way people think about finding, using, and
  syncing sound with video.

  This massive evolution grants access to next-generation technology,
  royalty-free professional sounds, and music to users of all kinds. The only
  tool you need to get started is your qwerty keyboard, which you already used
  to get here!

  Audio design desk is intelligent, so it's aware of the types of sounds and
  music you import, use in your projects, and will even make qualified and
  informed recommendations to help keep your projects evolving. This turns a
  once tedious and time-consuming process into a fun and efficient workflow.

  Audio design desk comes bundled with over 60,000+ royalty-free sounds with a
  team of composers releasing new effects, compositions, and sound design each
  week. Add's intuitive and innovative content creation tools empower
  filmmakers, sound designers, composers, and creators to produce cinema-quality
  compositions at the speed of thought, giving them a level of creative control
  unmatched by any other software.

  Audio design desk has earned numerous awards and mentions, including most
  recently fast company's "next big thing in tech" and videomaker "best
  software" at ces 2022.
