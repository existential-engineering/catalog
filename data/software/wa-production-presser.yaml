description: A compressor developed with producer Aiden Kenway, pairing standard threshold, ratio, attack, release and makeup controls with Glue, Punch and Heat character stages. Detector options cover channel link, a high-pass filter and a variable sidechain.
details: |-
  Presser is a compressor built in collaboration with producer and educator Aiden Kenway, carrying processing chains drawn from his own productions. Alongside dynamic range control it shapes the character of the audio, and is aimed at transient shaping, adding bite and glueing a mix together.

  Three character controls sit above the compressor. GLUE changes the behaviour of the detector and processor, acting as a fast peak compressor at 0 percent and as a classic bus compressor at 100 percent, with more sustained and smoother results. PUNCH introduces transient punch through a built-in dynamic equaliser, which suits kicks, snares and bass lines. HEAT adds analogue style saturation both before and after the compressor, from subtle warmth through to gritty overdrive.

  The detector section carries a CHANNEL LINK dial that sets whether the stereo channels are processed independently or together, a HIGH-PASS control that filters the detection signal to reduce unwanted pumping, and a variable SIDECHAIN control that blends between normal compression at 0 percent and sidechain input only at 100 percent.

  The standard compression parameters are all present, with ratio, threshold, attack, release and makeup gain. A MIX ratio control blends the compressed signal with the raw source for parallel compression, a LIMITER button limits the output, and the OUTPUT setting pushes more signal into it for a louder result. The bypass is smoothed to stay free of clicks and pops for A/B testing.

  Live interface meters show what happens to the signal as it travels through the compression stages in real time. Artist-curated factory presets are named and categorised, ranging from subtle shaping to more complex chains with heavier compression.
specs: |-
  - Artist-curated compressor developed with Aiden Kenway
  - Glue control between fast peak and bus compression behaviour
  - Punch control using a built-in dynamic equaliser
  - Heat control for analogue style saturation before and after the compressor
  - Channel link control for stereo detection
  - High-pass filter on the detection signal
  - Variable sidechain from 0 to 100 percent
  - Ratio, threshold, attack, release and makeup gain
  - Mix ratio control for parallel compression
  - Output limiter
  - Real-time metering through the compression stages
  - Resizable interface
  - Pop and click free bypass
  - A/B and copy for comparing settings
  - Responsive and CPU friendly
  - Artist-curated factory presets
  - Full PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Intel and Apple Silicon CPUs, with native AAX format
