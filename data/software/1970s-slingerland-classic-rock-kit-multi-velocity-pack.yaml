details: |-
  The 1970s slingerland classic rock kit - multi-velocity pack as mixed by alan moulder comes with patches for eleven different samplers and contains 447 stereo 24-bit wav samples.

  The kit consists of a 24" kick drum, five toms - 12", 13", 14" and 15" rack toms a huge 18" floor tom and a signature 14" x 7" deep radio king snare. The cymbals used were 14" zildjian new beat hi-hats, a zildjian k custom 22" ride, a zildjian k dark thin 18" crash and a zildjian vintage cie 16" crash.

  The "multi-velocity pack" is suited for customers who want multiple velocity levels of each articulation. You can either use our built in patches or build your own using the samples included. The pack includes up to sixteen velocities of each articulation totalling 447 drum samples.

  All of the samples are mixed from a combination of the overhead, room and close mics recorded as 24-bit 44.1 khz wav files, meaning they can be loaded into almost any sampler or drum machine. To make things easier we have included patches for some of the most commonly used software packages including: kontakt v5.2.0. Battery v3.2.3. Exs24 vlogic 9 / logic x ableton drum rack v9.0.5. Reason v7.0.1 combinator refill containing nn-xt sampler & fx. Maschine v1.8.0. Geist v1.0.0.7. Studio one's impact v2.5.1 soundset. Idrum v1.73.625. Reason v7.0.1 redrum refill. Renoise v3.0.0 (courtesy of jon halford) tx16wx v2.4.0 free sampler (courtesy of suleiman ali)

  We also include over 500 MIDI loops to the multi-velocity packs, covering a variety of genres. The loops are mapped to the default MIDI map.
