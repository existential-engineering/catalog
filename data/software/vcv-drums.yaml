details: |-
  9 standalone drum instruments: Kick, Snare, Tom, Rim, Clap, Closed Hat, Open Hat, Crash, and Ride. Includes a combined drum machine module with stereo mixing, volume and pan controls. Multiple drum circuit models based on classic hardware (808, 909-style). CV modulation inputs for each parameter, global tune and accent controls. Dark panel option available. Built on Vult DSP modeling technology.
