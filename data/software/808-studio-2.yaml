description: 808 studio 2 was designed for cutting edge quality 808 sub bass.
  Perfect for hip hop and trap or any genre that requires a hard hitting bass.
details: |-
  808 studio 2 was designed for cutting edge quality 808 sub bass. Perfect for hip hop and trap or any genre that requires a hard hitting bass synth. With 808 studio 2 we went one step further by adding advanced features such as drag and drop modulation for advanced synthesis, and a piano roll style sequencer which allows overlapping notes to get that classic pitch glide effect used in trap music.

  808 studio 2 can now also load samples, drag and drop onto the sampler or select from the many kick and 808 samples included. Multiple high quality and advanced effects are built-in, such as the 3 band equaliser and analog modelled filter, with an epic sounding chorus which can be applied only to the high end, so the sub part stays clean.

  808 studio 2 comes with 80 presets to get you started. Modifying any sound to your liking is super easy and will sound good with little effort. From clean sub bass, to down and dirty basses, 808 studio is the perfect bass synth for the task.

  The side chain uses the sample as its source and 'ducks' the volume of the rest of the oscillators and sub. This is useful if you have a kick sample and you want the transient part to cut through so it hits harder.

  Drag the bottom right corner to make 808 bass synth the perfect size for your screen.
