description: DeRoom Pro is the professional version of DeRoom, adding room resonance suppression, spectral focus mode, and separate L+R channel processing for advanced reverb removal.
details: |-
  DeRoom Pro builds on DeRoom's neural-network reverb removal with room resonance suppression, a Pro-tier algorithm, and spectral focus mode. Attack and release controls, a reverb-only listening mode, and separate left/right channel processing give more precise control over dialogue restoration.

  Spectrogram and gain visualization make it easier to monitor the correction being applied in real time.

  Compatible with Pro Tools, Cubase, Nuendo, Reaper, Ableton Live, Logic Pro, Adobe Premiere, Final Cut, and DaVinci Resolve.
