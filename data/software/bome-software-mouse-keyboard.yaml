description: Use your computer keyboard and mouse to play and control MIDI
  instruments. Bome Mouse Keyboard is a flexible tool for composing, playing,
  and controlling synths without hardware.
details: |-
  A MIDI Keyboard for your computer. Use your computer keyboard and mouse to play and control MIDI instruments, perfect for composing on the go or as a virtual controller.

  Play music as if you had a MIDI keyboard connected to your computer, without the hardware hassle. Mouse Keyboard makes it easy to compose your music while on the road with only a laptop, or to play software synthesizers like Reason live with your computer keyboard.

  Additionally, it can serve as a virtual control surface using mouse, mouse wheel, and joysticks as input. User-definable knobs control MIDI synths and software, the mouse wheel sends pitch bend and MIDI controllers, and joysticks can act as MIDI controllers.

  Entire chords can be played from a single key, with a built-in chord editor, and all MIDI notes can be transposed. Instrument names are supported via patch scripts. Tutorials are provided for Reason, Cubase, Sonar, and Acid.

  Version 2.0 for Windows is offered as a download. If you are a commercial user, or if you want to remove the nag screen at start-up, you are asked to purchase a license (EUR 20 incl. VAT).
specs: |-
  - Play and compose music with the mouse or the computer keyboard
  - Play entire chords with one key, includes chord editor
  - Transpose all MIDI notes
  - Instrument name support via patch scripts
  - User-definable knobs to control MIDI synths and software
  - Use your mouse wheel to send pitch bend and MIDI controllers
  - Use your joysticks as MIDI controllers
  - Tutorials for Reason, Cubase, Sonar, and Acid
  - Version 2.0 for Windows
