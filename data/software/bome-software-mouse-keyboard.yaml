description: Use your computer keyboard and mouse to play and control MIDI
  instruments. Bome Mouse Keyboard is a flexible tool for composing, playing,
  and controlling synths without hardware.
details: |-
  Mouse Keyboard turns the computer's own input devices into a MIDI instrument, letting you play music as if a MIDI keyboard were connected without the hardware. Bome pitches it at two situations in particular: composing on the road with nothing but a laptop, and playing software synthesizers such as Reason live from the computer keyboard.

  Beyond note entry, the application doubles as a virtual control surface. Mouse movement, the mouse wheel and attached joysticks can be mapped to MIDI output, so the wheel can send pitch bend or a MIDI controller number and a joystick can drive continuous controllers on a soft synth.

  Playing is not limited to one note per key. A chord mode plays entire chords from a single keystroke, and a built-in chord editor lets users define their own; all MIDI notes can be transposed, and user-definable knobs are provided for controlling MIDI synths and other software. Instrument names are supported through patch scripts, so target devices show readable program names rather than raw numbers.

  Distribution is a single Windows download, listed on the page as Version 2.0 for Windows, alongside a PDF user's manual. The page also carries tutorials for using Mouse Keyboard with Reason, Cubase, Sonar and Acid, and a separate user contributions page hosts community-made chord files and a quick start guide.

  Licensing follows Bome's try-before-buy pattern rather than being outright free: the download runs with a nag screen at start-up, and commercial users, or anyone who wants that nag screen removed, are asked to buy a licence at EUR 20 including VAT (shown on the page as approximately US$ 23).
specs: |-
  - Play and compose music with the mouse or the computer keyboard
  - Play entire chords with one key, includes a chord editor
  - Transpose all MIDI notes
  - Instrument name support via patch scripts
  - User-definable knobs to control MIDI synths and software
  - Mouse wheel sends pitch bend and MIDI controllers
  - Joysticks usable as MIDI controllers
  - Tutorials for Reason, Cubase, Sonar and Acid
  - Windows-only standalone application, current build is version 2.0
  - Free download that displays a nag screen at start-up; a licence removes it and is required for commercial use
