details: |-
  The Nembrini Audio IR Loader is a powerful and complete impulse response loader designed to host your favorite cabinet IRs.

  The IR Loader lets you load and blend up to three IRs, with tone shaping tools including a 6-band parametric equalizer and a custom console-style compressor. The Bass Enhancer makes the Nembrini Audio IR Loader the ideal tool for managing and shaping guitar and bass cabinet IRs.

  With the Nembrini Audio IR Loader, you can load up to three cabinet IR files. The integrated browser lets you browse your IR library and load impulse responses quickly, without interrupting your workflow.

  The Bass Enhancer is inspired by the Little Labs Voice Of God design, adding focused low-end weight. More than 24 dB of low-end boost is available, and frequencies below the selected point are attenuated to keep the boosted low end tight and controlled.

  The 6-band equalizer includes a real-time spectrum analyzer and delivers precise, detailed control for shaping cabinet tone.
specs: |-
  - Loads and blends up to three cabinet IR files
  - Integrated browser for browsing an IR library and loading impulse responses without interrupting the workflow
  - Power Amplifier modeled after a Class AB push-pull EL34 tube amplifier, with three selectable negative feedback modes
  - Custom-designed console compressor with a side-chain high-pass filter
  - Bass Enhancer with more than 24 dB of low-end boost and attenuation below the selected point
  - 6-band equalizer with a real-time spectrum analyzer
  - Plugin Formats: a VST2, VST3, AAX or AudioUnits compatible host
  - System: an Intel compatible or Apple Silicon CPU, 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
