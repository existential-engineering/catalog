description: A powerful and complete impulse response loader designed to host
  your favorite cabinet IRs, enabling users to load and blend up to three
  impulse responses with integrated tone-shaping capabilities.
details: |-
  IR Loader is a professional impulse response loader that allows guitarists and producers to load up to three cabinet IR files simultaneously, blending them together for a customized cabinet sound. An integrated IR browser lets you navigate your IR libraries without interrupting your workflow.

  The plugin includes a comprehensive 6-band parametric equalizer with a real-time spectrum analyzer, giving you precise tonal control over the loaded impulse responses. This makes it easy to dial in exactly the cabinet character you need for any mix.

  A custom console-style compressor with a side-chain high-pass filter is built in, providing dynamic control over the signal. The Bass Enhancer section, inspired by the Little Labs Voice of God design, delivers over 24 dB of low-end boost for massive bottom-end weight.

  IR Loader also features a Power Amplifier section modeled after a Class AB push-pull EL34 tube amplifier, complete with three selectable negative feedback modes. This adds authentic tube warmth and feel to the signal chain, making it a complete end-of-chain solution.

  Available as a plugin for macOS and Windows DAWs, as well as an app for iPhone and iPad on the Apple App Store, IR Loader supports all major plugin formats and is compatible with both Apple Silicon and Intel processors.
specs: |-
  - Load and blend up to 3 cabinet IR files simultaneously
  - Integrated IR library browser
  - 6-band parametric equalizer with real-time spectrum analyzer
  - Console-style compressor with side-chain high-pass filter
  - Bass Enhancer inspired by Little Labs Voice Of God (24+ dB low-end boost)
  - Power Amplifier modeled after Class AB push-pull EL34 tube amp
  - 3 selectable negative feedback modes
  - macOS 10.13 or newer
  - Windows 7 or newer
  - Apple Silicon and Intel CPU compatible
  - 64-bit DAW required
  - 1 GB RAM minimum
  - Plugin formats: VST2, VST3, AAX, AU
  - iOS app available on Apple App Store
