details: |-
  PS-20 is an ultra-realistic, polyphonic, hot-rodded tribute to Korg's renowned
  MS-20. First and foremost, PS-20's dual highpass/lowpass filters super
  accurately recreate the MS-20's famous raunchy sound in all of its squelchy,
  screaming glory. In addition to its unique filters, the MS-20's other
  signature feature is its modular-style patch panel, which has been
  reconfigured with many desired in and out patch points for all oscillators,
  filters, and VCAs.

  Every part of the instrument has been souped up with killer features, including
  16-note polyphony, a unique three-layer eight-step sequencer with flexible CV
  outs, and integrated effects including a beastly distortion, modulation echo
  with stereo spread, and a lush digital reverb with fantastic spring and plate
  emulations.

  The PS-20 truly is one of the most quirky and unique instruments Cherry Audio
  has released. Between its sometimes unpredictable filter behavior and the
  tremendous flexibility of its patch panel and sequencer, the possibilities are
  endless, and the creative happy accident quotient is simply off the charts.

  PS-20 features an advanced next-generation patch panel cabling system from
  Voltage Modular, an external signal processor section with normalled sidechain
  input, and four user-selectable interface color themes. Both virtual instrument
  and effect plug-in versions are included.
specs: |-
  - Super-accurate modeling of classic MS-style highpass and lowpass filters
  - Up to 16-voice polyphony with random voice panning
  - Over 320 presets
  - Three-channel eight-step sequencer with half-step quantizer and tempo sync
  - Single-key chord memory mode
  - Expanded and simplified full-function patch panel
  - Advanced next-generation patch panel cabling system from Voltage Modular
  - External signal processor section with normalled sidechain input
  - Virtual instrument and effect plug-in versions included
  - Tempo-syncable modulation generator
  - Unison detune for massive lead and bass sounds
  - Advanced one-click UI magnification
  - MPE support
  - Four user-selectable interface color themes
  - Distortion, studio-quality reverb, and mod echo with tempo sync effects
  - Full MIDI control and DAW automation for all controls
