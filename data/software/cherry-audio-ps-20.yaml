description: PS-20 is an ultra-realistic, polyphonic, hot-rodded tribute to
  Korg's renowned MS-20. Its dual highpass/lowpass filters recreate the MS-20's
  raunchy sound, and its modular-style patch panel is expanded with additional
  in and out patch points for all oscillators, filters, and VCAs.
details: |-
  PS-20 is an ultra-realistic, polyphonic, hot-rodded tribute to Korg's renowned MS-20. First and foremost, PS-20's dual highpass/lowpass filters super accurately recreate the MS-20's famous raunchy sound in all of its squelchy, screaming glory.

  In addition to its unique filters, the MS-20's other signature feature is its modular-style patch panel. Cherry Audio reconfigured the patch panel from the original instrument, adding many desired in and out patch points for all oscillators, filters, and VCAs, correcting the confusing terminology of the original, and adding a few extras that expand its usability.

  Every part of the instrument has been "souped up" with additional features, including 16-note polyphony, a unique three-layer, eight-step sequencer with flexible CV outs, and integrated effects, including distortion, modulation echo with stereo spread, and a digital reverb with spring and plate emulations.

  Between its sometimes unpredictable filter behavior and the flexibility of its patch panel and sequencer, PS-20 is one of the more unusual instruments in the Cherry Audio range.
specs: |-
  - Super-accurate modeling of classic MS-style highpass and lowpass filters
  - Up to 16-voice polyphony with random voice panning available
  - Over 320 presets
  - Three-channel, eight-step sequencer with 1/2-step quantizer and tempo sync
  - Single-key chord memory mode
  - Expanded and simplified full-function patch panel
  - Advanced, next-generation patch panel cabling system from Voltage Modular
  - External Signal Processor section with normalled sidechain input
  - Virtual instrument and effect plug-in versions included
  - Tempo-syncable modulation generator
  - Unison detune for massive lead and bass sounds
  - Advanced one-click UI magnification
  - MPE support
  - Four user-selectable interface color themes
  - Distortion, studio-quality reverb, and mod echo with tempo sync effects
  - Full MIDI control and DAW automation for all controls
  - macOS 10.13 or above. macOS 13 Ventura supported. 64-bit required. Native Apple M1 or greater processor support, including Ultra. 3.4 GHz Quad-Core or M1 CPU with 8GB of RAM recommended
  - Windows 7 or above (including Windows 11), 64-bit required. Quad-core computer with 8GB of RAM recommended
  - Internet connection required for product activation
