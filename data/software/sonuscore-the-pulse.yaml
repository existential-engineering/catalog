description: A groundbreaking tool for modern composers and producers, bringing the driving heartbeat of today's most iconic scores directly into your hands. Features a dynamic ensemble engine for real-time pulse-driven compositions with 80+ customizable sessions and 100+ expertly crafted sound elements.
specs: |-
  - Works with the FREE KONTAKT PLAYER
  - Requires KONTAKT version 7.10.7 or higher
  - Dynamic Ensemble Engine that generates evolving, pulse-driven compositions in real time
  - 80+ fully customizable sessions, with 10 instrument slots per session
  - 100+ crafted basses, drums, leads and orchestral textures
  - 30+ basses
  - 40+ drum kits
  - 40 leads and plucks
  - 25 ambient pads
  - Arrangement presets, keyswitch section changes and mod wheel intensity control
  - MIDI export for DAW integration
  - Instruments can be played individually outside the engine
  - Apple Silicon Macs: macOS 12, 13 or 14 (latest update)
  - Intel Macs (i5 or higher): macOS 12, 13 or 14 (latest update)
  - Windows 10 or 11 (latest Service Pack), Intel Core i5 or equivalent CPU, 2 GB RAM
  - Some sessions require an Intel i7 processor or higher to run smoothly
  - Graphics hardware support for OpenGL 2.1 or higher and Direct3D 11.1
  - 4 GB RAM (6 GB recommended)
  - At least 2.65 GB of free hard disc space
