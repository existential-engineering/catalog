description: A groundbreaking tool for modern composers and producers, bringing the driving heartbeat of today's most iconic scores directly into your hands. Features a dynamic ensemble engine for real-time pulse-driven compositions with 80+ customizable sessions and 100+ expertly crafted sound elements.
specs: |-
  - Requires KONTAKT 7.10.7 or higher (FREE KONTAKT PLAYER compatible)
  - 4 GB RAM minimum (6 GB recommended)
  - 2.65 GB free hard disk space
  - OpenGL 2.1+ or Direct3D 11.1 graphics support
  - macOS: Apple Silicon or Intel i5+, macOS 12–14
  - Windows: Windows 10 or 11, Intel Core i5+ (some sessions require i7+)
  - 80+ customizable sessions
  - 10 instrument slots per session
  - 100+ sound elements: 30+ basses, 40+ drum kits, 40 leads/plucks, 25 ambient pads, orchestral color elements
  - MIDI export for DAW integration
  - Arrangement presets and single instrument playback modes
