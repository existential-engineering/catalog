details: |-
  A record breaking wall of sound comprised of 56 guitar amps, 4 subs on 4
  levels of rigging, with sources from an unbelievable selection of vintage
  synths, drum machines, eurorack and guitars, all captured in the rarified
  space of air lyndhurst hall.

  The sound of this library is truly one-of-a-kind: single aperture mix. 13
  presets. Six controls. Nks compatible. ~7.14gb.

  Aperture - the stack is its own self contained plugin built for VST, AU and
  AAX, so once you've downloaded and installed you're ready to go.
specs: |-
  - NKS compatible
  - 56 guitar amps
  - 4 subs on 4 levels of rigging
  - Vintage synths sources
  - Drum machines sources
  - Eurorack sources
  - Guitar sources
  - Air lyndhurst hall recording space
  - 13 presets
  - Six controls
  - ~7.14gb
