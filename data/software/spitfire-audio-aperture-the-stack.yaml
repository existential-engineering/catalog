description: A record-breaking wall of sound comprised of 56 guitar amps, 4 subs on 4 levels of rigging, with sources from an unbelievable selection of vintage synths, drum machines, Eurorack and guitars, all captured in the rarified space of AIR Lyndhurst Hall. The sound of this library is truly one-of-a-kind.
details: |-
  A record-breaking wall of sound comprised of 56 guitar amps, 4 subs on 4 levels of rigging, with sources from an unbelievable selection of vintage synths, drum machines, Eurorack and guitars, all captured in the rarified space of AIR Lyndhurst Hall. The sound of this library is truly one-of-a-kind.

  A monstrous ensemble of electronic equipment captured through the largest amount of amps ever recorded. Featuring: The Colossus (aka Dave), 8 x Lyras-8 S, modular rig (aka the Wall), 4 x electric guitars, 2 x bass guitars, 2 x Deckard's Dream MkII, 2 x Juno 6, 2 x Sequential Prophets, an original Roland Tr-808.

  Four amp levels make up The Stack. Each effortlessly activated via Aperture's unique controls. Achieve new seismic levels of expression by controlling dynamics and the number of amps simultaneously. Moving from the smallest Aperture setting, the tight and precise sound from fewer amps building with ferocity and intensity as you open up the Aperture ring giving you a range of sounds you are unlikely to hear again, an imagined Aperture in sound. A single row of amps gives a tame focused sound, 2 or 3 rows a driven, focused sound, and all rows a wild, colossal sound.

  The library is divided into Dave, The Synths, The Guitars and The Machines. Dave draws on the many analogue oscillators of a once-in-a-generation synthesizer for raw, evolving Longs, sharp, dynamic Shorts and host-synced Pulses. The Synths covers Replicants (haunting sounds steeped in Sci-Fi cinematic history), Legends (a multitude of powerful sounds produced with legendary electronic music gear), Swarm (8 uniquely experimental and deeply organic instruments) and The Wall (a panorama of modular synths, effects and processors), with Swarm and The Wall also supplied as mono instruments with portamento.

  The Guitars is a talented ensemble of four electric guitars and two basses, playing a wall of amps turned all the way up to 56, with Longs, Swells, Cloud, Tremolo, Power Chords and muted Shorts. The Machines holds The Original Kits (that classic drum machine, bigger and boomier than ever, with dedicated tuned kick drum and tuned toms techniques), Afrorack Kits created by AFRORACK from modular gear, and Surge Kits of modern machine sounds.
specs: |-
  - 56 guitar amps and 4 subs on 4 levels of rigging
  - Recorded at AIR Lyndhurst Hall
  - Four amp levels (rows) activated via the Aperture ring control
  - Sources include vintage synthesizers, drum machines, Eurorack and guitars
  - Featuring The Colossus (aka Dave), 8 x Lyras-8 S, modular rig (aka The Wall), 4 x electric guitars, 2 x bass guitars, 2 x Deckard's Dream MkII, 2 x Juno 6, 2 x Sequential Prophets, an original Roland TR-808
  - Instrument groups: Dave, The Synths, The Guitars, The Machines
  - Swarm and The Wall supplied in stereo and in mono with portamento
  - Host-synced Pulses at 80, 90 and 135 BPM
  - Drum kits: The Original Kits, Afrorack Kits by AFRORACK, Surge Kits
  - Uses a dedicated plugin, Spitfire Audio App required
  - macOS 11 to macOS 26, both Intel and Apple Silicon/ARM supported
  - macOS minimum: 2.8GHz i5 quad-core, 8GB RAM; recommended 2.8GHz i7 six-core, 16GB RAM
  - Windows 10 or Windows 11 (latest service pack, 64-bit)
  - Windows minimum: Intel 2.8GHz i5 quad-core or AMD Ryzen 5, 8GB RAM; recommended Intel Core i7 6th gen and later or AMD Ryzen 7, 16GB RAM
  - 32-bit systems are not supported
  - Demo install size 554 MB
  - Full install size 7.5 GB
