description: TAL-Chorus-LX is a vintage chorus effect that emulates the Juno 60 chorus.
details: |-
  TAL-Chorus-LX is a vintage chorus effect that emulates the Juno 60 chorus. It is listed by Togu Audio Line under the FREE Plug-Ins section of the TAL product catalogue.

  The plug-in ships in VST, VST3, AU, AAX and CLAP formats, with installers offered for Windows, macOS and Linux. The Linux build is distributed as a 64-bit package covering VST2 and VST3.

  System requirements given by TAL are Windows 7 or higher with a 64-bit host, macOS 10.9 or higher with a 64-bit host, and 64-bit Linux on Ubuntu 18 or similar. The macOS build is a Universal Binary 2 with native Intel and Apple silicon support (M1, M2, M3 and later). AAX use requires Pro Tools 10.3.6 or higher in 64-bit.

  TAL highlights the plug-in's use on the guitars in the track "Am I Wrong" by Nico & Vinz, and hosts a second demo comparing the hardware with the plug-in.

  The current release is version 1.6.3, dated 28.06.2023, which added smooth volume and dry/wet parameter changes plus minor fixes. Earlier releases brought native AAX M1 support and a JUCE 7 framework update (1.6.2), a backward compatibility mode for pre-1.3.1 volume behaviour (1.6.1), a vector UI (1.6.0), and Apple M1 support, DC offset removal, a Windows VST3 installer and Linux VST3 support (1.5.0). Legacy downloads remain available for version 1.3.1 (including 32-bit support) and for the older TAL-Chorus-60.
specs: |-
  - Vintage chorus effect emulating the Juno 60 chorus
  - Formats: VST, VST3, AU, AAX, CLAP
  - Windows: Windows 7 or higher (64 bit host)
  - macOS: 10.9 or higher (64 bit host), Universal Binary 2 with native Intel and Apple silicon support (M1, M2, M3...)
  - Linux: 64 bit, Ubuntu 18 or similar (x64 VST2 and VST3)
  - AAX: Pro Tools 10.3.6 or higher (64 bit)
  - Smooth volume and dry / wet parameter changes
  - Backward compatibility mode for volume matching versions >= 1.3.1 when dry/wet is not centered
  - Vector UI
  - Legacy downloads available: version 1.3.1 with 32-bit support, and TAL-Chorus-60
