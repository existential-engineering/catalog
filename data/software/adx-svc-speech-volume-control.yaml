details: >-
  The adx speech volume control (svc) plug-in allows you independent volume
  level control over both speech and background elements within a mono or stereo
  mix. Lower the level of background noise within troublesome production audio,
  or easily boost dialogue levels without requiring access to stems or the full
  multi-track session.


  Svc uses a speech-optimized version of adx vex, a cloud-based,
  multi-algorithmic voice extraction technology that automatically separates
  audio from within your favorite DAW.


  Svc is very easy to use. Its elegant interface and simple controls provide
  access to advanced separation algorithms and standard volume sliders. The
  brand new, integrated consonants detection algorithm automatically identifies
  and separates difficult noisy consonants.


  Speech settings can be used to easily target typical male, female and child
  speech frequency ranges.
specs: |-
  - Volume control of speech content up to +/- 12 db
  - Volume control of background noise and effects up to +/- 12 db
  - Speech-optimized separation algorithm
  - Automatic consonants detection algorithm
  - Automatic voice activity detection algorithm
  - Gpu-enhanced processing speeds
  - Works with stereo and mono sources
  - Available in AAX, AU, VST formats
  - Windows and mac compatible
  - VST plugin
  - Audio units plugin
  - AAX plugin
