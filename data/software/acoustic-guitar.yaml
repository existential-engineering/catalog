description: Acoustic guitar samples from a customized version of martin d-28
  steel string guitar. It has 2 sample sets as pick and finger.
details: >-
  Acoustic guitar samples from a customized version of martin d-28 steel string
  guitar. It has 2 sample sets as "pick" and "finger". We sampled over 2900
  samples, and over 10 techniques on this guitar. Finally we obtain a 4 gb
  guitar library.


  By using the latest hybrid modelling technology, our acoustic guitar could
  provide both authentic sound from a sample library and playability for a
  modelling instrument. The design philosophy of acoustic guitar is simple as
  "top notch steel guitar sound in an affordable price, while maximum the sound
  shaping possibilities to provide more choices on sound"


  In acoustic guitar, musicians can start legato or glissando anytime they want,
  on any technique it has, not limited to the patch that has sampled legato.
  Also, they can change timbre in real times as a modeled instrument. With
  modeling technology, users can get an instrument that sound keeps changing,
  not the fixed or dead as a sampled instrument.


  Acoustic guitar is powered by the latest neo orchestra engine using hybrid
  modeling technology. It offers both the authentic sound of sample library and
  the playability of physical modelling instruments. Acoustic guitar provides
  musicians with everything they need for a great sounding guitar suitable for
  many different styles of sound.


  Acoustic guitar offers far more sound-shaping options than a sampling
  instrument with five bands parametric eq and more control over the harmonic
  partial sounds. This means users can quickly change timbre with a simple turn
  of a knob or tune every single note with the scala tuning system. Sound magic
  also has made it possible to switch to different stops on a single track with
  our performance keyswitch system that allows acoustic guitar to be used in
  live performances without sacrificing quality or efficiency.
