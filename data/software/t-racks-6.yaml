description: "The latest generation of IK Multimedia's acclaimed mixing and
  mastering software with 63 world-class processors, streamlined ecosystem with
  single effects, all-in-one plug-in, and standalone mastering console."
details: |-
  T-RackS 6 includes 63 mixing and mastering processors in a streamlined ecosystem offering single effects, an all-in-one plug-in, and a standalone mastering console. New modules include Prism Reverb, Lurssen Mastering EQ, Triad Chorus, Master Match X, Channel Strip X, Bass ONE, LO-FI Punch, Dual Spring, Delay Lab, Quad Saturator, and Filter Fusion.

  The Module Manager provides workspace control, while Master Match X enables intelligent auto-mastering. All dynamic modules feature side-chain functionality for advanced processing. The Master Bus Panel offers comprehensive tools, with In/Out Metering in Chain View, an Enhanced Floating Preset Window, and a Customizable Meter Window.

  ARC System integration enables room correction within the mixing environment. Supports operation as individual plug-ins, within the T-RackS shell with up to 16-processor chains, or as a standalone mastering application.
specs: |-
  - 63 mixing and mastering processors
  - Single effects, all-in-one plug-in, and standalone modes
  - Module Manager for workspace control
  - Master Match X intelligent auto-mastering
  - Side-chain support on all dynamic modules
  - ARC System integration
  - Up to 16-processor chains in T-RackS shell
  - macOS 10.15+ / Windows 10+
  - AU, VST3, AAX, Standalone
