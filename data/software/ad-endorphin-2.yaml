details: >-
  Ad-endorphin 2 by js-synthese is a virtual instrument audio plugin for
  windows. It functions as a VST plugin.


  Features 3 virtual analogue and 3 digital oscillators each with 14 voices
  (digital 6 voices), 5 waveforms analog, 250 waveforms digital, adsr (volume)
  and 12 db filter (hipass, lopass, bandpass) with keytracking.


  Includes the wave-shapes from access virus, waldorf wave and ensoniq sq80.
  Import wave-shapes from wav files and 8-bit bmp files. Draw your own
  wave-shapes in the softsynth or in the endorphin wave-editor.


  3 lfos, 6 adsr envelopes, 2 arpeggiators, 39 drumsets (over 5000 samples / 800
  mb), 1 gb gm-bank with sounds from virus a, virus ti, korg trinity, korg m1,
  dx7, evolver, pro53.


  7 filter types: 12, 24, 36 db lopass, morphing filter 12db lopass to 12 db
  hipass, moog filter, 12 db hipass, 12 db bandpass. Effects include reverb, 10
  band eq, stereo delay, distortion, downsampling, flanger, phaser, oscillator
  morphing, and joystick.
