details: |-
  Silent Way is a suite of plug-ins designed for use with analogue synthesisers, and especially as part of a modular analogue synthesiser system. The plug-ins produce no sound themselves, nor do they process sound, rather they generate signals to be used as control voltages (CVs), which can be patched into the control inputs of oscillators, filters and VCAs of an analogue system. With the addition of the CV Input plug-in, it is also possible to bring CVs from the synth into the computer, for recording or processing.

  The suite currently holds eighteen plug-ins: AC Encoder, CV Input, CV To MIDI, CV To OSC, DC, ES-4 Controller, ES-5 Controller, ESX-4CV Combiner, Follower, Learner, LFO, Quantizer, SMUX, Soundplane, Step LFO, Sync, Trigger and Voice Controller.

  Silent Way Voice Controller is a virtual instrument plug-in designed to directly control an analogue synthesiser by generating the appropriate CV and gate signals via an audio interface. By listening to the synthesiser's output signal, the plug-in is able to calibrate itself to generate the appropriate pitch CV for the incoming MIDI notes, and alongside the basic pitch and gate signals it can generate three multi-stage envelope CVs to feed VCAs and VCFs in the synth.

  Silent Way CV Input provides a means of getting control voltages from an analogue synth into the computer, which is not normally possible since the DC voltages of CVs are blocked by the inputs of all current audio interfaces. LFO and Step LFO generate modulation, the latter from a waveform drawn in the GUI that doubles as a traditional analogue step sequencer, Quantizer constrains incoming continuous CVs to discrete values such as exact semitones, DC generates constant output signals for use with host automation, Trigger makes a gate or envelope from an incoming MIDI note, and CV To MIDI and CV To OSC translate CV signals into MIDI or OSC messages.

  To work out of the box, the audio interface between the computer and the synth needs to be DC coupled, meaning capable of maintaining a DC voltage at its outputs. Many interfaces include high-pass filters on the outputs which makes this impossible, and a device compatibility page carries up-to-date information. The exception is Silent Way CV Input, which works with any interface since it is specifically designed to overcome the lack of DC coupling on audio interface inputs. Because the Voice Controller calibrates itself by listening to the output of the synth, it is not limited to the 1V per octave standard and can even drive modules not originally intended as oscillators, such as LFOs, and still track pitch correctly.
specs: |-
  - Eighteen plug-ins in the suite
  - 64 bit AU, AAX and VST formats
  - macOS and Windows
  - Audio interface outputs need to be DC coupled, except for the CV Input plug-in
  - Voice Controller calibrates itself by listening to the synth, so it is not limited to 1V per octave
  - Voice Controller generates pitch and gate plus three multi-stage envelope CVs
  - iLok account required to redeem the activation code
  - Activation to a physical iLok, the iLok Cloud or the local machine
  - A physical iLok is not required
  - Demo mode is fully functional and times out after 15 minutes of use, reset by reloading the plug-in
  - A registration allows activation on up to three computers at once
