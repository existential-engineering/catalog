description: Transient Shaper lets you control the attack and decay of a track.
  Transient Shaper plugins can be very important to give each sound just the
  right size and position in the mix.
details: |-
  Transient shaping has become a vital technique in music mixing. The abilities to sharpen or soften the onset of a sound and to lengthen or shorten the decay have been very useful for giving each sound just the right size and position in the mix.

  Transient Shaper takes this concept one step further, by letting the user affect either the entire frequency range, which is what most similar tools do, or the treble frequencies or bass frequencies individually. Use the dual band processor to affect only the treble or bass portion of a sound, separately for the Sustain and Punch parameters, and leave the rest untouched.

  The Transient Shaper lets you control the attack and decay of a track. Optimal for drum mixing, but also a perfect tool to give a vocal track clarity and presence.

  Use Transient Shaper on drum overheads, turn up the Sustain knob and set its frequency control to Wide. This will simultaneously stretch out the room sound and cymbals, as well as give you more sustain and boom to the toms. But say you don't want boomier toms. Then you set the Sustain knob's frequency control switch to Hi, in which case the Sustain processing only affects the high frequencies, i.e. the cymbals and room, but leaves the toms just the way they are. Set the switch to Lo, and hear how you now only get boom from the toms, but the room sound and cymbals stay unaffected.

  The dual band operation makes Transient Shaper useful for much more than drum and percussion sounds. Give a vocal track clarity and presence by adding some high frequency transients, add Punch with its frequency slider set to Hi. Or create a darker and more rounded sound that oozes with vintage vibe by instead turning down the Punch knob. Use it on piano, bass, guitar, electronic drums, Transient Shaper works on a wide range of sound types.
specs: |-
  - Dual band transient processing tool
  - Add or reduce punch and/or sustain from any sound
  - Affect either the whole frequency spectrum, only the high frequencies or only the low frequencies
  - User selectable crossover frequency
  - Punch behavior switchable between Fast and Slow
  - Clip section adds output distortion
  - Supports Softube Extended Features panels
  - Console 1 Ready: can be used within the Console 1 mixing system
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Softube account and iLok account required (no physical iLok required)
  - Three activations
