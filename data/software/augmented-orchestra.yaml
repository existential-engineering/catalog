description: "Augmented Orchestra - beyond the ordinary: multi-part architecture
  with 400+ exclusive acoustic and electronic sources."
details: |-
  UVI Augmented Orchestra pushes deep into the creative world of hybrid
  instrument design, carving out new realms of twisted symphonic technique and
  trodding with breathtaking soundscapes. With an exclusive library of new
  material, showcasing over 400 expertly played and immaculately designed
  instrument layers and hundreds of professionally hand-crafted presets to
  explore, Augmented Orchestra is an expansive sonic playground ready to inspire
  with unique and imaginative sounds.

  Uvi augmented orchestra allows you to create incredible sonic motifs with a
  versatile multi-part architecture, letting you weave between 4 deeply
  customizable instrument layers. Utilize rich modulation, innovative
  arpeggiators, and powerful effects to create dynamic and moving sequences,
  pads, chords, melodies and more.

  The story of uvi augmented orchestra begins in the recording hall accompanied
  by over 100 musicians, with a deep chromatic multi-sampling of a complete
  symphony orchestra. We recorded with both conventional and unconventional
  approaches, adding a number of orchestrated chords and fx to the library.
  Strings, brass, and woodwinds are arranged creatively with low and high
  sections to provide a full playable range across the keyboard, as well, all
  instruments were recorded with both close mono and wide decca tree stereo
  allowing morphing between close and far positions. Over 70 hours of recordings
  made across dozens of sessions went into creating the acoustic instruments for
  augmented orchestra, ending with 11 sections arranged as follows: strings low,
  strings high, string ensemble, brass low, brass high, brass ensemble, winds
  low, winds high, winds ensemble, orchestral fx, and orchestral chords.

  Using the well-understood conventions of subtractive synthesis each part
  provides expressive control over amplitude, dynamic multi-mode filters,
  voicing, numerous effects, a creative arpeggiator, and extensive modulation
  possibilities with an all-new multi-source/target matrix driven in part by 2
  fully customizable lfos and step lanes per part. If that weren't enough the
  layers of each part can be crossfaded both manually or with modulation,
  allowing for a dynamic, expressive, and ever-changing landscape of sound to be
  created with the flick of a fader.

  The latest in our augmented series, uvi augmented orchestra is an inspiring
  and massively capable instrument, a true powerhouse for those looking for new
  acoustic, hybrid, and even electronic sounds, and a deep, dynamic, environment
  for exploration.
specs: |-




  - Multi-part architecture with 4 customizable instrument layers

  - 400+ exclusive acoustic and electronic sources

  - Over 500 professionally crafted presets

  - Deep chromatic multi-sampling

  - 11 orchestral sections: strings low, strings high, string ensemble, brass
  low, brass high, brass ensemble, winds low, winds high, winds ensemble,
  orchestral fx, orchestral chords

  - Close mono and wide decca tree stereo recording options

  - 8 additional source categories: tape orchestra, string machines, modeled,
  synth stacks, processed, synth textures, fm exploration, waveforms

  - Subtractive synthesis controls

  - Dynamic multi-mode filters

  - Creative arpeggiator

  - Multi-source/target modulation matrix

  - 2 fully customizable lfos

  - Step lanes per part

  - Layer crossfading with manual and modulation control

  - High-quality effects collection

  - Intuitive ui


  - Powered by uvi workstation
