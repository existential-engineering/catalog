description: Araucann is a synthesizer. It offers frequency modulation,
  amplitude (ring) modulation, phase modulation, additive and subtractive
  synthesis.
details: >-
  Araucann is a synthesizer that offers frequency modulation, amplitude (ring)
  modulation, phase modulation, additive and subtractive synthesis techniques,
  all at the same time. It has 6 filtered oscillators modulated by 32 envlfos
  (envelopes and lfos that interact with each other).


  Araucann does not rely on presets. It is completely randomizable and produces
  very complex and unique sounds at the push of a button.


  The synthesizer features 6 oscillators, 33 envelopes, 32 lfos, compression,
  delay unit, reverb unit, modulated post filter unit, output math unit, unison
  and monophonic/polyphonic modes, and randomization algorithms for global or
  per unit parameter randomization.


  Fully automatable controls, preset saving and loading, loudness
  protection/auto-gain function (no signal will be too loud or too quiet), and
  full sse and sse2 support are included.


  Araucann functions as a VST plugin and a standalone application for windows.
