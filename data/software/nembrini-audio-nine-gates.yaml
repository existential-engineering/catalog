details: |-
  Nembrini Audio's Nine Gates is an original preamplifier, designed for metal enthusiasts who demand precision and power in their tone.

  Nine Gates features dual gain stages and an interactive 3-band EQ with circuit interaction. It also includes advanced DSP edge filtering for precise tone shaping.

  The audio samples on the product page were recorded using only an IR after the Nine Gates Diabolic Distortion, and that impulse response is offered as a free download.
