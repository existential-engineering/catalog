details: |-
  Nine Gates is an original preamplifier plugin by Nembrini Audio, designed for metal enthusiasts who demand precision and power in their tone. It delivers the high-gain sounds modern and classic metal players need with surgical control over every aspect of the distortion.

  The plugin features dual gain stages that allow players to stack gain for increasingly aggressive tones. Whether dialing in tight, punchy rhythm tones or sustain-heavy lead sounds, the dual-stage architecture provides flexible gain structure.

  An interactive 3-band EQ with circuit interaction shapes the tone in a way that mirrors real analog circuitry — adjusting one band affects the behavior of adjacent frequencies, producing naturally musical results rather than clinical cuts and boosts.

  Advanced DSP edge filtering provides precise control over the high-frequency character of the distortion, allowing players to tame harshness or accentuate presence and cut to sit correctly in a dense mix.

  Nine Gates ships with a free Van Halen-style 4x12 cabinet impulse response (VH_4x12_C414.zip), giving players a complete metal tone chain out of the box.
