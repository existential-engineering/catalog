description: TRINITY DRUMS 2 is a powerful mix of cinematic and modern grooves housed in a versatile, cutting-edge percussive virtual instrument. It enables users to create massive drum hits, tension-building sequences, and electronic grooves in real-time with 200+ rhythmic presets and 1,000+ variations.
details: |-
  Trinity Drums 2 is a percussive virtual instrument for the free Kontakt Player that mixes cinematic and modern grooves. The included rhythms make it straightforward to craft massive drum hits and epic subs, softer tension-building hits, or electronic and funk grooves, all synced for use in real time. Every rhythm is built from high-quality percussion recordings and sounds by the sound design specialists at BOOM Library and produced by Sonuscore's composers.

  The central idea of the Trinity system is to separate the elements of a groove into individual parts and put the player in charge of how they are arranged. Every rhythmic theme is divided into three independent layers, Low, Mid and High Drums, that provide varying levels of complexity and can be used on their own or together. Phrase Sync Mode lets you swap and combine multiple variations and layers while playing on the keyboard, with the instrument intelligently adapting the timing of newly triggered grooves to the present playing rhythm, so it stays playable both in the studio and on stage.

  Open Layer Exchange allows single layers to be swapped across the instrument's sound banks, so sounds and presets crafted for cinematic, industrial, funk, rock, punk and EDM material can be mixed and matched into fresh rhythms. The interface spans a main page for commanding the three layers in Phrase Sync or Free Trigger, a mixer page for FX and dynamics per channel and across the ensemble, an FX page giving each track its own independent FX chain, and a preset browser covering over 200 presets in various meters and tempos.

  Trinity Drums 2 brings new content to the Trinity Drums line, with an all-new interface and an enhanced sound bank that includes the recordings from the original as well. It adds 500 new sounds from BOOM Library and over 100 completely new presets, and the previous blue colour scheme remains available as a freely switchable option.
specs: |-
  - Works with the FREE Native Instruments KONTAKT PLAYER
  - Requires KONTAKT version 7.10.9 or higher
  - 200+ rhythmic presets across various meters and tempos
  - 1,000+ variations and single hits
  - 500 new sounds from BOOM Library
  - Three-layer design: Low, Mid and High Drums
  - Phrase Sync Mode and Free Trigger playback
  - Open Layer Exchange between sound banks
  - Multiple time signatures
  - Improved preset browser
  - Freely switchable colour scheme
  - Per-track FX chains plus mixer with FX and dynamics control
  - macOS 13, 14 or 15 (latest update)
  - Windows 10 or 11 (latest service pack)
  - 4 GB RAM
  - At least 4.44 GB of free hard disc space
