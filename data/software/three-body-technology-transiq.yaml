description: Transi-Q is a transient-preserving EQ inspired by analog classics, designed for fast, smooth, and punchy character. It excels on percussion and any source where preserving attack and transient definition is essential.
details: |-
  Transi-Q is a transient-preserving EQ. Inspired by a revered analog classic, it is defined by a fast, smooth and punchy character, and performs exceptionally well on percussion and any source where preserving transients is essential.

  It features one high-pass filter, one high-shelf filter, one low-shelf filter, and three proportional-Q bell filters, whose bandwidth tightens with gain to deliver more focused shaping while retaining attack and definition. Whichever filter type is used, the handling of transients stays intact.

  The plugin runs at zero-sample latency, which suits live tracking and performance as well as mixing.
specs: |-
  - One high-pass filter
  - One high-shelf filter
  - One low-shelf filter
  - Three proportional-Q bell filters whose bandwidth tightens with gain
  - Zero-sample latency
  - Minimum system requirements: Intel or AMD CPU with SSE 4.1 instruction set, or Apple Silicon
  - macOS 11 / Windows 8
  - 4 GB RAM and 100 MB disk space
  - 64-bit VST2, VST3, AAX and Audio Unit
  - Free demo: no time limit, no registration required, saving and loading disabled, 1.5 seconds of silence every 15 minutes, 'Demo' shown on the UI
