description: Transi-Q is a transient-preserving EQ inspired by analog classics,
  designed for fast, smooth, and punchy character. It excels on percussion and
  any source where preserving attack and transient definition is essential.
details: |-
  Features one high-pass filter, one high-shelf filter, one low-shelf filter, and three proportional-Q bell filters for focused EQ shaping.

  Proportional-Q bell filters tighten bandwidth as gain increases, preserving transient attack and definition while shaping tone.

  Zero-sample latency design makes it ideal for live tracking and real-time performance monitoring.

  Inspired by analog classic EQ character, delivering fast, smooth, and punchy results especially on percussion.
