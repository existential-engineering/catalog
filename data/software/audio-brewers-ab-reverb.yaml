details: |-
  ab Reverb is a digital reverb with spatial properties, which add not only
  width but also height and depth to your signal with both early and late
  reflections that can be manipulated independently.

  Whether you are working with a mono, stereo or ambisonics source (1oa, 2oa,
  3oa), ab reverb will automatically adapt its input to whatever you throw at
  it. Ab reverb will then output a stereo or ambisonics signal so that you can
  later decode it to any speaker-array possible, from binaural all the way to
  surround, atmos, custom speaker arrays, anything.

  Ab reverb's internals work natively in ambisonics, meaning you can apply
  spatial transformations to the reverberations for real psycho acoustic
  results. Have your spaces rotate towards any direction whilst you keep your
  source steady in the middle. Freeze your reverberations to create infinite
  pads, anything goes.

  Independent early and late reflections help you configure each of the
  reverberations stages so that you can personalise your own spaces. Each of
  them with their own size, pre-delay, damp, density, and wet control as well as
  a 1-band parametric eq.

  Ab reverb also comes with a 'smart troubleshooting' algorithm, which will
  check your signal chain and let you know if something is wrong with it.
specs: |-
  - Spatial reverb
  - Ambisonics support (1oa, 2oa, 3oa)
  - Mono input support
  - Stereo input support
  - Ambisonics input support
  - Stereo output
  - Ambisonics output
  - Early reflections control
  - Late reflections control
  - Independent reflection manipulation
  - Size control
  - Pre-delay control
  - Damp control
  - Density control
  - Wet control
  - 1-band parametric EQ
  - Smart troubleshooting algorithm
  - Spatial transformations
  - Reverb freezing
  - Surround format support
  - Atmos format support
  - Immersive format support
  - Binaural decoding
  - Custom speaker array support
