details: >-
  When using more than one microphone to record a sound source, you might
  encounter phase or polarity issues between different tracks. This could be due
  to mic distance, or any other factor which causes the audio to reach one track
  before the other.


  Often this is almost imperceptible, but in many cases it can result in the
  recording sounding "thin" or "weak".


  Aligner is an automatic phase and polarity alignment tool, designed to speed
  up the daily workflow of audio engineers.


  Minimum system requirements: mac os x 10.9.x, 512 mb ram; windows xp or above,
  512 mb ram
specs: |-
  - Phase alignment
  - Polarity alignment
  - VST 3 plugin
