description: Trident A-Range is an EQ plugin with a will of its own, modeled
  after a legendary equalizer of which only 13 units were ever made. It's one of
  the most iconic equalizer plugins and gives you a sweet but edgy sound,
  featuring four bands of equalization plus high and low pass filters.
details: |-
  The Trident A-Range equalizer is a legendary piece of equipment. Only thirteen A-Range consoles were ever made, but it remains a holy grail for sound engineers and producers around the world due to the list of classics that were originally recorded on the A-Range, David Bowie's Ziggy Stardust, records by Queen, Elton John, Rainbow, Metallica, the list goes on.

  Sweet but edgy sound, and organic, musical interactions between the bands make this a more powerful companion than it may seem. Balance guitars, vocals, drums, and much more, with the rare and raw sound of Trident.

  This product supports Extended Features. Softube loves VU meters, Bakelite knobs, and analog quirks. But Softube wants modern precision and workflow. The answer? Softube Extended Features. Easy-access panels with the innovations you need close at hand.

  Console 1 Ready: this plug-in can be used within Console 1, Softube's mixing system.

  Professor Malcolm Toft, original designer of the A-Range console at Trident Audio Developments: "I am pleased to say that this is an incredibly accurate software recreation of my original A-Range design."
specs: |-
  - Console 1 Ready: works as a native plug-in and in Softube Console 1, the Softube mixing ecosystem
  - Amp Room Ready: works as a native plug-in and as a module in Amp Room, Softube's pro audio guitar platform
  - EQ with a will of its own
  - Created together with original designer Professor Malcolm Toft
  - Each and every component carefully modeled
  - Saturation control
  - Very CPU friendly
  - Supports Extended Features
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Softube account required
  - iLok account required (no physical iLok required)
  - Computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Internet access (for downloading installers and managing licenses)
  - 14-day returns, 20-day trial, tech support, three activations
