details: |-
  Ardour is a professional, full-featured hard disk recorder and digital audio
  workstation featuring unlimited audio tracks and buses, non-destructive,
  non-linear editing with unlimited undo, and anything-to-anywhere signal
  routing.

  Ardour loads plugins in the vst2, vst3 and lv2 formats on windows, linux and
  macos. It additionally loads AU plugins on macos. You can use plugins from any
  3rd party.

  Ardour is licensed under the gpl. You may obtain the source code without
  charge, you may build and modify it yourself, and use it for any purpose. You
  may give copies to your friends, run it on as many computers as you wish to.

  The live performance sequencer includes support for novation launchpad and
  support for control surfaces like presonus faderport and steinberg cc121.
specs: |-
  - Unlimited audio tracks and buses
  - Non-destructive, non-linear editing with unlimited undo
  - Anything-to-anywhere signal routing
  - Live performance sequencer with support for novation launchpad
  - Support for ladspa, LV2, VST/VST3, and audiounit plugins
  - Support for control surfaces like presonus faderport and steinberg cc121
  - VST2, VST3 and LV2 plugin formats on Windows, Linux and macOS
  - AU plugins on macOS
  - Gpl licensed
  - Available on macOS, Windows and Linux
