details: |-
  Designed and tested by metal and electronic artists seeking the next level of
  pure energy for their music, the Argent Compressor takes any sound you give it
  and transforms it into something truly aggressive, raw, and powerful.

  Use it on a bassline to bring it right to the front of the mix. Use it on
  reverb tails to create nearly infinite ambiance. Use it on drums to shape
  transients or completely mangle the mix.

  Apply up to 100db of upwards compression, bringing even the quietest sounds up
  to max loudness. Enable the multiband mode to engage the effect in 3 separate
  frequency bands, like an ott on steroids.

  Adjust the timing, range, filtering, and limiting options for incredible
  flexibility in use cases and genres. Use one of the fine-tuned presets to get
  you up and running quickly.

  This is the ultimate sound design tool for creating industrial monsters and
  dancefloor bangers. The effect is extreme... Can you handle it?
specs: |-
  - Up to 100db upwards compression
  - Multiband mode with 3 separate frequency bands
  - Timing adjustment
  - Range adjustment
  - Filtering options
  - Limiting options
  - Preset library
