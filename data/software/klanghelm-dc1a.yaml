description: "Free effortless character compressor and the little brother of
  DC8C. Minimal interface designed to just work: gentle, faithful, from almost
  invisible smooth leveling to heavy pumping with nice crunchy saturation.
  Features negative (over) compression, parallel (New York style) compression,
  dual mono mode, relaxed RMS compression switch, and DEEP high-pass filter to
  reduce pumping on bass-heavy material."
details: |-
  Minimal interface with input and output controls
  Negative (over) compression capability
  Parallel (New York style) compression
  DUAL MONO switch for independent L/R compression
  RELAXED switch for RMS compression (peak default)
  DEEP feature with high-pass filter to reduce bass pumping
  Stereo unlink functionality

  3.5.0
