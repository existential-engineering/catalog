description: "Free effortless character compressor and the little brother of DC8C. Minimal interface designed to just work: gentle, faithful, from almost invisible smooth leveling to heavy pumping with nice crunchy saturation. Features negative (over) compression, parallel (New York style) compression, dual mono mode, relaxed RMS compression switch, and DEEP high-pass filter to reduce pumping on bass-heavy material."
details: |-
  DC1A is the little brother of the compression monster DC8C. Taking a few favorite settings from DC8C and making them work in a two-control context, DC1A is sound-wise comparable to the PUNCH mode in DC8C but offers additional features such as negative ratio and stereo unlink.

  DC1A is designed to be a compressor that just works: gentle, faithful, from almost invisible smooth leveling to heavy pumping with a nice crunchy saturation and punchy enough to treat drums with. Despite its minimal interface, DC1A has several tricks up its sleeve that make it versatile across a wide range of material.

  Features include negative (over) compression, parallel (New York style) compression, the option to compress left and right channels independently via the DUAL MONO switch, peak and RMS compression modes via the RELAXED switch, and a DEEP mode that activates a high-pass filter to reduce pumping on bass-heavy material.

  DC1A is freeware. Since DC1A 3 has a unique plugin ID and filename, it can be used alongside the original DC1A 2 simultaneously.
specs: |-
  - Negative (over) compression capability
  - Parallel (New York style) compression
  - Stereo unlink via DUAL MONO switch
  - Peak compression mode (default) and RMS compression mode (RELAXED switch)
  - DEEP mode with high-pass filter to reduce pumping on bass-heavy material
  - Two-knob interface: input and output
  - No copy protection
