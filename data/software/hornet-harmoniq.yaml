description: HarmoniQ is an automatic equalizer that focus on automatically removing inharmonic frequencies from your audio tracks
details: |-
  HarmoniQ is an automatic equalizer that helps you in removing inharmonic frequencies. Acoustic instruments and complex sounds often carry a mix of harmonic and inharmonic elements. While the harmonics enrich your sound, the inharmonic frequencies create muddiness and a boxy effect. Traditionally, removing these unwanted frequencies required manual equalization—tedious and time-consuming. HarmoniQ revolutionizes this process with real-time analysis and automatic filtering, making it the perfect inharmonic equalizer for your audio needs.

  HarmoniQ automatically analyzes incoming audio, detects the fundamental frequency, and identifies inharmonic frequencies. Our advanced algorithm then applies up to 50 precise filters to eliminate these unwanted frequencies, ensuring a clearer, more refined sound. This advanced approach to harmonic equalization guarantees your audio tracks retain their natural warmth while removing disruptive elements.

  HarmoniQ now includes “Lower Limit” and “Upper Limit” controls to restrict the processing to a specific frequency range. This allows for more precise control over which part of the audio spectrum is being equalized, providing even greater flexibility and accuracy in your sound shaping.

  HarmoniQ is your intuitive and powerful automatic equalizer for achieving pristine audio clarity through effective harmonic equalization. Whether you’re working with acoustic instruments or complex soundscapes, HarmoniQ removes unwanted inharmonic frequencies, delivering a cleaner, more professional sound. This inharmonic equalizer is designed to make harmonic equalization straightforward and efficient, ensuring your audio tracks always sound their best.
specs: |-
  - Detects fundamental and inharmonic frequencies automatically.
  - Applies up to 50 filters for a clearer sound.
  - Control intensity of frequency reduction up to -18dB.
  - Restrict processing to a specific frequency range.
  - Smart Learn Mode.
  - Delta Function: Audition differences between input and filtered signals.
  - Bypass Mode: Temporarily disable for comparison.
  - Reset Button: Restart detection and filtering process.
  - Load and Save Settings: Save and recall favorite settings.
  - Intuitive Interface: Easy navigation and control.
  - Resizable UI
  - macOS (10.13 and later) and Windows (windows 10 and later)support
  - 64bit compatibility both on Mac and Windows
  - Audio Units, VST3 and AAX format
  - Apple Silicon native support
