details: |-
  BA-1 is an analog-modeled synthesizer plugin by Baby Audio, described as a synth with a soul. It enables users to create rich, nostalgic synth sounds dripping with analog color, with the ability to drain the battery and bend the circuits for authentic lo-fi grit.

  The synth includes over 500 factory presets and a Smart Re-Gen feature for automatic patch generation. It is designed to be easy to program and full of sweet spots, mimicking the experience of real hardware synthesizers.

  BA-1 features a built-in 80s-style FX strip that includes overdrive, filter, tone-shaper, delay, reverb, chorus, and speaker simulation effects. The battery drain emulation and circuit-bending capabilities add authentic lo-fi character to the sound.
specs: |-
  - Analog-modeled synthesizer with battery drain emulation
  - Circuit-bending capabilities for lo-fi character
  - Built-in 80s-style FX strip with overdrive, filter, tone-shaper, delay, reverb, chorus, speaker sim
  - Over 500 factory presets
  - Smart Re-Gen feature for automatic patch generation
  - Native Apple Silicon M-Chip support
  - 64-bit only
