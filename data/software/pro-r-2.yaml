description: FabFilter Pro-R 2 is a high-end reverb plug-in. Available in VST,
  VST3, AU, CLAP, AAX and AudioSuite formats for Windows and macOS.
details: |-
  As one of the most used effects in the audio world, reverbs come in all forms and flavors. FabFilter Pro-R 2 stands out with stellar sound quality, being able to recreate natural spaces as well as classic vintage and plate reverbs that sit in the mix perfectly. At the same time, our unique interface design with intuitive musical controls make it simply a joy to work with.

  FabFilter Pro-R 2 takes a musical approach to reverb, offering user-friendly, non-technical controls like Brightness, Character and Distance to achieve the reverb sound you are looking for, without requiring a degree in reverb science. The stepless Space control lets you fade between dozens of different, carefully tuned room models, automatically choosing a matching decay time for a natural-sounding result.

  The decay time of a real room often varies wildly over the frequency spectrum, which is one of the key ingredients of a room's reverb character. To simulate this, the industry-first Decay Rate EQ concept in FabFilter Pro-R 2 offers completely free adjustment of the decay time over the frequency spectrum. Together with the integrated 6-band Post-EQ, designing reverbs of any style or character has never been easier.

  New Vintage and Plate algorithms let you recreate classic digital reverb units of the 80s and 90s, as well as the evocative metallic sound of plate reverbs. The Thickness control adds saturation and compression, while the built-in Ducking feature makes it easy to let the reverb blend in with the mix.
specs: |-
  - Beautifully designed room models from small ambiences to huge cathedrals
  - Full immersive / Dolby Atmos functionality (up to 9.1.6)
  - Two brand-new reverb algorithms: Vintage and Plate
  - Gorgeous Retina interface with large interactive reverb display
  - Impulse Response import
  - Thickness, Ducking and Auto Gate controls
  - Stepless Space control with over a dozen room models
  - Decay Rate control from 25% to 400%
  - Freeze button
  - Distance control
  - Character control
  - Innovative six-band Decay Rate EQ
  - Six-band Post EQ
  - Intelligent Stereo Width control
  - Real-time spectrum analyzer
  - Resizable interface, full screen mode and customizable scaling
  - MIDI Learn, Smart Parameter Interpolation, sample-accurate automation
