description: Stereo Delay plugin that is a semi-clean digital delay with simple
  stereo widening and a 1980s-inspired chorus unit. Plus, separate left and
  right controls for easy stereo widening. When you want something with a sound
  and vibe.
details: |-
  You want that classic '80s delay with quarter notes on the left and eight notes to the right? Maybe a smidge of chorus? Something simple to use, something with a sound and a vibe? Something that isn't just another clean digital stock delay? You want Stereo Delay.

  Delivering an obvious tone and super ease of use, Stereo Delay's separate sliders for left and right delay time make stereo widening a cinch. On top of that, Stereo Delay gives you an '80s-inspired chorus unit for your DX7 or clean Strat that'll really blow your hair back.

  Radically easy to use, Stereo Delay offers a plug-in interface that's made to keep you in your creative flow. You've got separate Left and Right Time controls, which set the length of the delay, plus DAW Sync to automatically sync the delay lengths to the tempo set in the DAW. Ping Pong creates a delay in which the echoes alternate between left and right outputs. Chorus gives you that sweet chorus effect on the output. Chorus Type I has a slower modulation while Chorus Type II is faster. The Feedback control lets you set how long the delay will repeat, Tone allows you to set the tonal character of the delay, and Mix controls how much delay is added to the audio.

  Softube's reputation for creating tools that enhance workflow and offer superior sound quality is rock solid, with partnerships with premium brands like Tube-Tech, Solid State Logic, Chandler Limited, Weiss Engineering, and Trident spanning decades. Stereo Delay is built on this legacy of passion, expert modeling, and attention to detail.
specs: |-
  - Semi-clean digital delay plug-in
  - Separate left and right controls for easy stereo widening
  - '80s-inspired chorus unit with two chorus types (Type I slower modulation, Type II faster)
  - Ping Pong mode alternates echoes between left and right outputs
  - DAW Sync automatically syncs delay lengths to host tempo
  - Feedback, Tone and Mix controls
  - Intuitive interface for extreme ease of use
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Internet access required for downloading installers and managing licenses
