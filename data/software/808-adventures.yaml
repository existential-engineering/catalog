  808 adventures contains 139 drum one shots. 69 mb multiformat material. All loops & samples in this library are licensed to you 'royalty-free' so you can use them in your commercial compositions with no extra costs.

  Wav: 139 files (24-bit wav). 139 files (16-bit wav duplicate). Aiff / apple loops: 139 files (24-bit aiff).
