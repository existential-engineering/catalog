details: |-
  BitFuzzer is an unholy alliance between a bitcrusher, fuzz and distortion. The
  bitfuzzing algorithm is complimented by a powerful filter and EQ section,
  helping you tame the chaos and create beautiful mayhem.

  This hybrid effect not only adds an instant edge to your music but also offers
  deep customization through finely tuned synth-style filters and a versatile eq
  section. Choose between series and parallel operation modes to precisely shape
  the intensity and texture of the effect.

  Unique crush algorithm provides a wide range of flavors from warm fuzz to
  complete meltdown. Gain clips the signal and drives the crusher, unlocking an
  even wider range of distorted sounds.

  The hold algorithm will create wild harmonies and tonal variations on the
  crushed signal. Filter section complete with synth filters and a finely tuned
  4 band eq.

  Parallel mode with independent dry/wet controls and another synth filter.
  Oversampling control from 1x to 8x.
specs: |-
