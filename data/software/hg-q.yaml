details: |-
  The HG-Q plugin is a meticulously modeled version of the forthcoming HG-Q
  hardware EQ that's seven years in the making. Building on the acclaimed
  collaboration that brought the hg-2 to life, this revolutionary EQ combines
  analog warmth with cutting-edge flexibility and tonal depth, bringing an
  entirely new dimension to eqs.

  Featuring six bands of fully independent boosts and cuts, hg-q is a creative
  powerhouse that reshapes and enhances your sound in a totally unique way.
  Boosts combine gain with black box's trademark analog tubes, adding rich,
  creamy harmonic content without muddying transients or compromising mix
  clarity. Cuts are performed with a pristine solid-state circuit for reduced
  distortion.

  Unlike conventional saturation, the hg-q's circuit brings out lower-level
  details and enhances the mix density, resulting in a fuller, more vibrant
  sound. The "2x" mode further expands the eq's range, allowing up to 16db
  boosts and cuts with intensified saturation that brings out every harmonic
  nuance.

  Hg-q has a one-of-a-kind topology. Its bands interact with one another in a
  totally new way. You'll love hearing how boosts and cuts add character to
  frequencies on other bands, or watching and controlling these special
  interactions with the built-in spectrum analyzer.

  As you start boosting, cutting, adding saturation and switching between series
  and parallel, you will unlock a new wildly complex set of satisfying
  interactions and curves. The hg-q is not your conventional eq, as its strength
  lies in dramatically contouring and reshaping audio material to enhance your
  mix in a masterfully musical way.
specs: |-
  - Six-band EQ with fully independent boosts and cuts
  - Tube saturation in boost bands
  - Solid-state technology for cut filters
  - 2x mode with up to 16db boosts and cuts
  - Dynamic phase interactions
  - Independent q value adjustment per band
  - Stereo processing
  - M/s processing
  - Dual mono processing
  - Mono processing
  - Series and parallel switching
  - Built-in spectrum analyzer
  - Aggressive saturation mode
  - High-resolution EQ-curve visualization
  - Auto-listen
  - Scalable ui
  - Universal 2 binary
