details: |-
  Beatmaker is a streamlined drum sequencer that integrates seamlessly with
  Splice sounds. Designed to make beats quickly—your way—with the least creative
  resistance.

  Choose pads view to build your perfect drum kit in a 4x2 grid, then trigger
  your beats using your DAW or an external groovebox or MIDI controller. You can
  also dig into the sequencer view, home of beatmaker's 16-step grid, to create
  your own patterns from scratch.

  Sketch out patterns to get a fresh perspective on your beats, then drag and
  drop individual drum lanes or entire sequences into your DAW. From there, you
  can always keep refining or experimenting with your creations in your
  arrangement—without missing a beat or losing an idea.

  You're one click away from the most useful parameters: volume, pitch,
  distortion, mix, reverb and delay. For a deeper, tweakier dive, open the
  per-lane all fx parameter settings, and adjust sample start/end points, the
  multi-mode filter, and play with envelope, eq, flanger and distortion
  controls—all within the visual interface.

  Build common kick and snare patterns, percussion sequences and fx loops using
  preset sequences available on every sequencer lane. With one click, beatmaker
  autofills a four-to-the-floor kick or triplet hi-hat pattern, to get your
  drums hitting as quickly as possible.
specs: |-
  - 16-step grid sequencer
  - 4x2 pads grid
