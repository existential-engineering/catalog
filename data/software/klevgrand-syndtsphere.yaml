details: |-
  SyndtSphere is a spherical polyphonic synthesizer. With a minimalistic approach, it offers a unique experience of 'surfing' between presets. All parameters morph dynamically based on the proximity of different presets.

  By rotating a sphere containing over 70 professionally designed sound states, anyone can effortlessly dial in the perfect sound without needing to adjust specific parameters. SyndtSphere is available for macOS, Windows, iPad and iPhone, making it easy to bring your magical and addictive spinning instrument wherever you go, in the studio, on the stage, on the bus or at a family dinner.

  SyndtSphere is free of charge for macOS and Windows.

  Sphere: the different nodes represent presets. When you're between these nodes, the parameters are morphed according to the proximity of all surrounding nodes. Modulation: Pitch Bend Range, Glide and Legato control. Delay: a pure and simple built-in ping-pong delay.
specs: |-
  - Highly innovative interface, seamlessly browse between 70+ professionally made presets
  - Save current state
  - Ping pong delay
  - Modulation with Pitch Bend Range, Glide and Legato control
  - Requires macOS 10.10 or later (optimized for the M1-processor), Windows 7 (SP1) or later, running a AU, VST or AAX compatible 64-bit host
  - macOS/Windows: AU, VST
  - iPad/iPhone: Standalone, AUv3
  - Resizable window (desktop version)
  - Volume slider
