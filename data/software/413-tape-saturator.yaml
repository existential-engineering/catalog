details: |-
  The 413 tape saturator reproduces the non-linear characteristics that would result when overdriving analog tape, as magnetic saturation occurs with increasing amplitude of the 'recorded' signal. It offers 3 different types of analog tape, as well as 3 different types of distortion.

  For the saturation process, the signal gets dynamically changed, especially high frequency information, in response to its amplitude. The resulting effect simulates the saturation of analog tape, in a controllable environment which can be adjusted according to your preference.

  The user can choose among 3 different types of analog tape, each corresponding to the noise and saturation characteristics of 3 different well known tape brands. 3 distortion types are also available, enabling the user to produce the harmonic content/distortion one would get by overdriving certain tube or transistor circuits.

  The subtle saturation-to-increased-drive can really breath life into an otherwise dull mix or individual instrument, and focus elements upfront.
