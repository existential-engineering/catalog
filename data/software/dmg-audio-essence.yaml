description: "Essence is the most powerful and transparent De-Esser in the
  world. It's much more than just a vocal de-esser; it's a flexible sub-band
  processor that can reach in and invisibly control any element in a mix."
details: |-
  Essence is a professional de-esser and sub-band processor offering psychoacoustically optimized sibilance control with surgical precision and full transparency. It supports Linear Phase and zero-latency minimum phase modes, a dual-release Peak/RMS-based time detector, an analogue-modelled single-release time detector, and a three-band sidechain EQ with configurable Split EQ. M/S and L/R processing, lookahead, oversampling, upward expansion, variable stereo linkage, and a full parallel processing mixer section are all included. A spectrum analyser and time-plot visualisation aid monitoring, while 8 A/B comparison banks with intelligent undo/redo support creative workflows.
