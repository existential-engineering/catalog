description: Evolution Atlantica is a collection of very powerful high-quality sound effects, as well as aggressive and ingenious instruments for creating vigorous state-of-the-art trailer & cinematic music and game soundtracks in no time.
details: |-
  EVOLUTION ATLANTICA gathers trailer sound effects and the matching musical instruments behind a single interface, aimed at modern and massive trailer cues: synths, transitions, transformations, rises, whooshes, booms, drops, alarms and more, alongside bad-ass trailer brass, guitars and pulse patterns.

  The Pulse Designer is the rhythmic heart of the library. It builds underscore patterns from 125 supplied designs, with control over sample, BPM and rhythmic pattern, and over the whole structure of the samples, through a flexible rhythmic step sequencer for modern percussive elements.

  The sound design patches supply more than 600 playable sound effects, including epic trailer hits, whooshes, tonal reversed FX, braams, transformations, shutters, rises and downers, for putting emphasis on a single key visual.

  Beyond rhythm and sound FX, the tonal patches cover pads, basses, leads, drones and plucks for melodic writing. The page notes that pre-designed synth sounds can be combined and stacked into custom patches, which the Epicomposer review quoted on the page calls one of the library's most interesting concepts.
specs: |-
  - SFX: 37 braams
  - SFX: 100 epic trailer hits
  - SFX: 105 whooshes
  - SFX: 44 booms
  - SFX: 72 short punch hits
  - SFX: 36 short punch metal hits
  - SFX: 18 tonal reversed FX
  - SFX: 14 rises
  - SFX: 48 downers
  - SFX: 32 alarms & signals
  - SFX: 120 transformation FX
  - SFX: 20 transition shutters
  - Brass: low trailer brass and bends
  - Guitars: trailer bass guitar and trailer electric guitars
  - 125 pulses, with a Pulse Designer step sequencer for building custom patterns
  - More than 600 playable sound design patches
  - Tonal patches: pads, basses, leads, drones and plucks
  - Requires the FULL version of Native Instruments' KONTAKT 5.5.1 or higher (NOT compatible with the free KONTAKT PLAYER, which runs the instrument in demo mode only)
  - Mac OS X 10.8 or higher, Intel Core 2 Duo
  - Windows 7 or higher, Intel Core 2 Duo or AMD Athlon 64 X2
  - 4 GB RAM
  - At least 8 GB of free hard disc space
  - Available as a download only
