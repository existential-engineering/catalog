details: |-
  The X902 De-Esser is a precision tool for controlling harsh consonants, excessive top-end, and piercing transients – while preserving the natural tone of the voice or instrument. With intuitive controls, surgical targeting, and real-time auditioning, it delivers clean, clear results with minimal setup. Whether you're treating sung vocals, voiceovers, or cymbal-heavy tracks, X902 offers refined de-essing that simply works.

  Reduce harsh "S", "T", and "F" sounds without dulling the overall tone. The X902 keeps your vocals bright, clear, and natural while eliminating distracting high-frequency spikes.

  Quickly select the offending sibilant range using intuitive frequency and threshold controls. Focus only on what needs taming – no need for heavy-handed EQ cuts.

  Engage HF Only mode to attenuate just the high-frequency content, leaving the rest of the signal untouched. Ideal for preserving vocal warmth and low-end body.

  Solo the exact frequencies being attenuated with a single click. Hear exactly what you're removing, for confident mix decisions and pinpoint accuracy.

  Use X902 to clean up sung vocals, voiceovers, podcasts, and even harsh cymbal transients. It's a mix-ready utility for any high-frequency trouble spot.
