description: A palette of epic sound design textures, made in collaboration with
  experimental New York-based composer, Lea Bertucci.
details: |-
  A palette of epic sound design textures, made in collaboration with experimental New York-based composer, Lea Bertucci. The library is made up of brass and percussion instruments performing a selection of extended techniques, transformed by the extraordinary recording space in which they were captured — a cavernous industrial fridge, with stunningly reverberant acoustics.

  From deep, ominous textural beds to eerie swells and thunderous hits, organic elements are complemented by evolving granular-based pads, made from the recorded material. These instantly playable cinematic sounds will add momentum, suspense and tension to your trailer music and compositions. Available in our dedicated plug-in.
specs: |-
  - 44 presets, from epic hits to evolving pads, drones and rhythmic textures
  - Recorded in a cavernous industrial fridge with a 10 second reverb tail
  - Extended techniques on trumpet and tenor trombone (pitch bend, directional movement, stabs, glissandi)
  - Tuned and untuned percussion performances
  - Granular pads built from the organic material using a convolution reverb of the space
  - Dynamics, Expression, Delay and Release controls
  - File size 1.3 GB
  - macOS 11 to OS 26, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
  - Minimum 8GB RAM, 16GB recommended
  - Spitfire Audio App required
