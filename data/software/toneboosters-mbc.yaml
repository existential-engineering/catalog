description: "Multi-band compressor and saturator offering up to 12 bands of
  compression with dual compressor curves per band. Features pre-amp saturation,
  external side-chain input, and integrated peak limiter."
details: |-
  Up to 12 compression bands with two curves each. Pre-amp saturation with positive or negative modes. External side-chain input support. Analog saturation per band with stereo width control. Drag-and-drop frequency divider adjustment. Spectrum analyzer with multiple modes. Integrated peak limiter. Embedded UI for DAW mixing desks. Up to 16-channel spatial audio support.
specs: |-
  Sample rates up to 384kHz (desktop), 96kHz (iOS). Ultra-low latency design, peak limiter adds approximately 1.5ms (host-compensated). High-quality oversampling. Personal perpetual license for up to 4 computers.
