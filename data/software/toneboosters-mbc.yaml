description: Multi-band compressor and saturator with up to 12 bands, two compressor curves per band, per-band analog pre-amp saturation and an external side-chain input.
details: |-
  MBC is a multi-band compressor and saturator offering up to 12 bands of compression, with two compressor curves per band so downward and upward compression can be combined. Ratio, knee, range, attack and release are adjustable for each compressor curve in each band, and interactive compressor curves show exactly what is going on.

  The interface is information rich and built for navigation rather than clunky sliders: cross-over frequencies are set by dragging the frequency dividers, the spectrum editor expands for microscopic gain adjustments and visualization, the integrated spectrum analyzer has multiple modes, and a band can be split in two with a single action.

  Dry and wet signals mix seamlessly for New York style or parallel multi-band compression, an integrated pro-quality peak limiter gets results ready for export, the filterbank cross-over steepness is configurable, oversampling is high quality, and the external side chain input drives multi-band side-chain compression on hosts and formats that support it.

  Each band carries an analog pre-amp with adjustable saturation, plus stereo width control, and ToneBoosters' positive or negative saturation feature shapes beyond the usual range. A VST and VST3 embedded UI shows basic MBC operation from a track inspector or virtual mixing desk without opening the full interface, on hosts that support embedded UIs.

  The design is ultra-low latency even with oversampling, so high-quality oversampling can run in live, auditioning and studio use cases. Presets are organized in searchable categories that move across Windows, macOS, iOS and iPadOS by drag and drop. MBC is also available for iPhone and iPad as an AUv3 plug-in.
specs: |-
  - Up to 12 bands of compression
  - Two compressor curves per band, combining downward and upward compression
  - Ratio, knee, range, attack and release per compressor curve per band
  - Analog pre-amp saturation per band, positive or negative, with stereo width control
  - External side-chain input for multi-band side-chain compression (requires a host and plug-in format that supports external side chain inputs)
  - Integrated pro-quality peak limiter; enabling it adds about 1.5 ms of latency, compensated by hosts that support plug-in latency compensation
  - Dry/wet mixing for parallel multi-band compression
  - Configurable filterbank cross-over steepness and high-quality oversampling with ultra-low latency
  - Integrated spectrum analyzer with multiple modes; drag frequency dividers to set cross-overs
  - Embedded VST and VST3 UI for hosts that support embedded UIs in mixer or track views
  - Up to 16-channel spatial audio support
  - Sample rates up to 384 kHz on desktop, limited to 96 kHz on iOS and iPadOS
  - Resizable user interface that fits every screen and resolution
  - Dozens of colour themes
  - Undo, redo and A/B switching
  - Preset management with import and export
  - Multiple simultaneous instances
  - License activation without a hardware dongle
  - Personal, perpetual desktop licence for Windows, macOS and Linux, for use on up to 4 computers
