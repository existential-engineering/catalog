details: |-
  CS1x-Edit is a program for Windows 95, 98, and ME to administer the Yamaha CS1x Control Synthesizer through your PC. It is available for free.

  The program is a solution for 4 main tasks. Edit your own Performances with the Performance Editor: an easy-to-use interface provides access to every parameter of a performance, so you have all parameters at one glance, and the changes you make are instantly audible. Additionally, you can create exciting new sounds with the Randomizer.

  Manage the preset and user bank of performances in the main window (Control Panel) and the Bank Compiler. With the Player you can play your MIDI files while editing a performance, thus hearing your new sounds alive. The Utility allows you to set the system parameters of the CS1x (set up the controller assignments, the MIDI channels, etc.).

  In every window you have the possibility to load and save the respective data as a System Exclusive (*.syx) or MIDI (*.mid) file. Moreover, CS1x-Edit offers high flexibility regarding sending and receiving data to and from the CS1x via MIDI (bulkdumps).

  The download is V1.24 from 17 Jan 99, 449 KB, for Windows 3.11/95/98/ME. The page carries a warning that CS1x-Edit is made for Windows 95, 98, and ME and does not run on newer versions of Windows. After downloading, a freeware license key is published on the page (name "CS1x Freeware").
specs: |-
  - Performance Editor with access to every parameter of a performance, with changes instantly audible
  - Randomizer for creating new sounds
  - Preset and user bank management via the Control Panel and the Bank Compiler
  - Player for MIDI files while editing a performance
  - Utility for setting CS1x system parameters (controller assignments, MIDI channels)
  - Load and save data as System Exclusive (*.syx) or MIDI (*.mid) files in every window
  - Sending and receiving data to and from the CS1x via MIDI (bulkdumps)
  - Mouse Keyboard: play notes with the mouse to listen to the current performance, with a hold function to browse material voices
  - Automatic recognition of the device number
  - Support for multiple CS1x's
  - Realtime controls (knobs, scene switches, etc.) fully accessible within the Control Panel, repositioning automatically if evoked from the synth
  - All changes (scroller movements) and notes on the Mouse Keyboard are displayed while playing
  - MIDI clock when playing MIDI files, to sync the Arpeggiator to your music
  - MIDI-thru, removing the need to switch local on/off when using sequencers and CS1x-Edit
  - "Add a Scrolling Message to your Song in the Player" function, adding text into a MIDI file that scrolls in the CS1x display during playback
