description: CS1x-Edit is a program for Windows 95, 98, and ME to administer the
  Yamaha CS1x Control Synthesizer through your PC.
details: |-
  CS1x-Edit is a Windows editor and librarian for the Yamaha CS1x Control Synthesizer. It connects to the synth over MIDI and gives the player a full graphical view of a performance, so every parameter can be seen and changed from the PC rather than through the instrument's own display.

  The program covers four main tasks. The Performance Editor exposes every parameter of a performance at a glance, with changes audible instantly, and adds a Randomizer for creating new sounds. The Control Panel and Bank Compiler manage the preset and user banks. The Player plays MIDI files while a performance is being edited, so new sounds can be heard in context. The Utility sets the CS1x system parameters, including controller assignments and MIDI channels.

  Every window can load and save its data as a System Exclusive (.syx) or MIDI (.mid) file, and data can be sent to and received from the CS1x over MIDI as bulk dumps. The device number is recognised automatically, and multiple CS1x units are supported.

  Extra conveniences include a Mouse Keyboard for auditioning notes without the synth at hand, realtime controls that mirror and follow the synth's own knobs and scene switches, MIDI clock output when playing MIDI files so the arpeggiator stays in sync, MIDI-thru that removes the need to toggle local on/off alongside a sequencer, and a function that embeds a scrolling text message into a MIDI file for display on the CS1x.

  The program is distributed as freeware with a published registration name and password. The last release is version 1.24 from 17 January 1999, a 449 KB download. Bome warns that it targets Windows 3.11, 95, 98 and ME and does not run on newer versions of Windows, and lists the product as discontinued on its products index.
specs: |-
  - Editor and librarian for the Yamaha CS1x Control Synthesizer
  - Performance Editor with every performance parameter on one screen and instantly audible changes
  - Randomizer for generating new sounds
  - Control Panel and Bank Compiler for preset and user bank management
  - Built-in MIDI file Player for auditioning performances in context
  - Utility page for CS1x system parameters, controller assignments and MIDI channels
  - Load and save data as System Exclusive (.syx) or MIDI (.mid) files
  - Send and receive bulk dumps to and from the CS1x over MIDI
  - Automatic recognition of the device number
  - Support for multiple CS1x units
  - Mouse Keyboard for playing notes with the mouse, with a hold function for browsing material voices
  - Realtime controls mirror the synth's knobs and scene switches and reposition when changed on the hardware
  - MIDI clock output when playing MIDI files, for syncing the arpeggiator
  - MIDI-thru passthrough, removing the need to switch local on/off when using a sequencer
  - Adds a scrolling text message to a MIDI file for display on the CS1x
  - Download size 449 KB
  - Runs on Windows 3.11, 95, 98 and ME; does not run on newer versions of Windows
