description: "Physical modeling synthesizer that simulates acoustic properties
  of real instruments including vibrating strings, resonating tubes, and struck
  surfaces. Includes 74 models of plucked and hammered strings, bells, and
  hybrid sounds."
details: |-
  74 instrument models across six categories: Bass, Bells, Guitar, Keys, Synth, and Traditional. Model morphing and blending capabilities. Six adjustable parameters (HIT, DTN, POS, TONE, RING, DCY) ranging from -100% to 100%. CV modulation inputs for performance control. Polyphonic capability. MIDI compatible via V/OCT and GATE inputs.
specs: |-
  Requires VCV Rack 2.
