description: 'Prism Reverb is more than just another shimmer reverb; it''s a
  playground for sonic exploration. Designed for sound designers, producers, and
  guitarists to push beyond "beautiful washes," Prism Reverb allows you to shape
  infinite, evolving textures with depth and creative freedom.'
details: |-
  Prism Reverb is a 4-module creative reverb plug-in designed for sound designers, producers, and guitarists. The reverb core features Size and Diffusion controls, while a dedicated modulation section offers Depth, LFO Rate, and randomization for evolving textures.

  Dual independent pitch shifters provide a ±2-octave range with 1/100th semitone fine tuning, each with dedicated level and pan controls. The feedback engine allows frequency-specific shaping for highs and lows, with FB PITCH and FLIP switches for routing pitch-shifting in or out of the feedback loop and per-sample stereo swaps on each pass.

  Presets are organized for Bass, Guitar, Keys, FX, Voice, and more. Works standalone or inside the T-RackS 6 shell with up to 16-processor chains. Supports up to 192 kHz at 32-bit floating-point processing.
specs: |-
