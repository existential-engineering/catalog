details: |-
  A stripped-down version of REAMP. Even though FreeAMP may look simple, all the algorithms from Klevgrand's amplifying modeler plugin REAMP are still in there. In this free version, the favourite profiles from REAMP are combined into one universal profile.

  When processing audio through FreeAMP you'll get the sound of tape and tube saturation at the same time. It can be used on anything that needs to be vitalized, from single tracks, stems or full mixes.

  The interface is built around two controls. Drive sets the amount of saturation, and a Blend slider is useful for a parallel approach.
specs: |-
  - Carefully trimmed combination of a modelled tape algorithm and a tube algorithm
  - Super-simple and friendly interface
  - Drive control
  - Blend slider: useful for a parallel approach
  - Requires macOS 10.10 or later (optimized for the M1 processor), or Windows 7 (SP1) or later
  - Runs in an AU, VST or AAX compatible 64-bit host
