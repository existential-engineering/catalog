details: |-
  Vintage Vibes

  1974 Jagra was lovingly sampled from a beautiful vintage 1974 Jaguar electric guitar. This model features a double circuit system for lead and rhythm tones, a shortened scale length, and an additional 22nd fret for greater range. Used by Kurt Cobain and Jimi Hendrix, this is a truly classic rock & roll guitar, filled with emotion, heritage and history. We created Jagra with the iconic sounds of the 70s, 80s and 90s in mind. Alongside gorgeous sustaining notes full of chime and bite, we've included percussive guitar effects, a variety of arps, and pre-designed guitar styles to get you riffing right away. From indie to hard rock to metal, to blues and jazz, this wonderfully flexible instrument has got you covered.
