description: Bitwig Studio 16-Track is an entry-level version of Bitwig studio,
  the music creation and performance software.
details: |-
  Native cross-platform DAW (windows, macos, linux). Modular device structure
  with advanced nesting and routing. Instruments & effects, including sampler
  and polysynth.

  Unlimited VST and vst3 support, with built-in 32-/64-bit bridging, plug-in
  crash protection, and delay compensation.

  Modulate any device, VST plug-in, or hardware parameter with bitwig's
  program-wide modulators (macros, note expressions, lfos, and more).

  Industry-leading hardware integration: connect synthesizers, drum machines and
  other hardware devices seamlessly into your workflow over MIDI, CV/gate, and
  analog clock.
specs: |-
  - Native cross-platform DAW (Windows, macOS, Linux)
  - Modular device structure with advanced nesting and routing
  - Instruments & effects, including sampler and polysynth
  - Unlimited VST and VST3 support
  - 32-/64-bit bridging
  - Plug-in crash protection
  - Delay compensation
  - Program-wide modulators (macros, note expressions, LFOs)
  - Hardware integration over MIDI
  - CV/gate support
  - Analog clock support
  - 16-track sequencer
  - Audio plugin host
  - MPE support
  - Universal 2 binary
