name: AudioBox
manufacturer: nbm
primaryCategory: synthesizer
categories:
  - effect
description: AudioBox is an audio scripting language for Windows that allows you
  to develop VST effect and vsti plugins in a simple way.
details: |-
  It is based on the traditional model of unit generators (oscillators, filters,
  envelopes, noise generators, etc..) which can be connected together to form
  anything you want, from a chorus effect to an additive synth.

  Its main feature is to compile the user scripts in native VST/vsti format.

  It currently is in very beta stage, and does not have any documentation yet.
specs: |-
  - VST effect plugin development
  - Vsti plugin development
  - Unit generators (oscillators, filters, envelopes, noise generators)
  - Native VST/vsti compilation
  - Windows platform
