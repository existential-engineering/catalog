details: |-
  Create magical, lyrical woodwind lines with this brilliant set of performances captured in Abbey Road's iconic Studio One. This self-contained, stand-alone library will add that unmistakable Abbey Road magic to your compositions. It also makes the perfect accompaniment to Abbey Road One: Orchestral Foundations.

  This stunningly orchestrated woodwind section, performed by London's leading session players, lets you create everything from beautiful, reflective passages to sprightly runs using our new, easy-to-use legato patches. This new selection includes the classic movie pairing of woodwinds and glockenspiel, adding energy and intrigue to your score and allowing you to lose yourself in the magical world of woodwinds. And with our new methods for capturing these legato performances, the virtual instruments are vital and alive.

  Sparkling Woodwinds is available to purchase as a stand-alone library or as a brilliant addition to Abbey Road One: Orchestral Foundations . You can also purchase this as part of Abbey Road One: The Collection and save 30%.
specs: |-
  - Woodwind section with glockenspiel pairing
  - 3 articulations: Sparkling Legato, Long, Staccato
  - 2 mixes
  - 10 mic signals: Vintage 1, Vintage 2, Pop Close, Pop Room, Close, Tree 1, Tree 2, Ambient, Outriggers, Spill
  - 6.41 GB disk space required during install
  - macOS 11 to OS 26, Intel and Apple Silicon supported
  - Windows 10 or 11 (64-bit)
  - Minimum 8GB RAM, 16GB recommended
  - Single user license, installation on up to two computers
  - Spitfire Audio App required for installation
