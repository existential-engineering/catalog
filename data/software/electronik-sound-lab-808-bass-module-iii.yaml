details: |-
  808 bass module 3 is a powerful 808 bass rompler for Windows & mac. 808 bass
  module 3 contains 200 ready-to-use and freshly designed layered presets, to
  bring grit and rumble to your productions.

  The sounds are now even more powerful and are ready to play in the key of your
  project.

  Features include lpf filter, adsr, 200 presets for electronic music, lfo
  modulation, glide time control, distortion control, pitch bend control, and is
  easy to use.

  100% royalty free.

  System requirements on windows: windows 8.1/10, 600 mb disk space, 600 mb ram,
  VST | vst3 host 32 or 64-bit. System requirements on mac os x: os x 10.13.6
  and above, 600 mb disk space, 600 mb ram, AU or VST host (32-bit or 64-bit).
specs: |-
  - LPF filter
  - ADSR
  - LFO modulation
  - Glide time control
  - Distortion control
  - Pitch bend control
  - 200 presets
  - Sample based rompler
  - Windows 8.1/10 compatible
  - Os x 10.13.6 and above compatible
  - 600 MB disk space
  - 600 MB RAM
  - 32-bit or 64-bit support
