description: Fusing musical instruments and sound effects, Nordic Spheres features an unpolished, ambient sound to create musical soundscapes of ice and snow. A granular Kontakt instrument that blends four independent sound layers with an advanced Grain Engine to produce frozen, atmospheric textures for cinematic composition.
details: |-
  NORDIC SPHERES is a Kontakt instrument that creates vast, frozen soundscapes and musical spheres using a combination of rich sound effects content, granular synthesis and percussive sounds. Sonuscore worked with Mats Lundgren and Amina Hocine from the Sweden-based audio post production company Pole Position to gather a treasure trove of tonal and non-tonal audio from a wealth of creative sources, then combined those recordings with the company's own layering and arpeggiator engine. The page describes it as the sonic sibling of TIME TEXTURES and CHROMA.

  The instrument is built from four independent layers. The bottom two focus on hits, particles and sustains, while the top two are Grain Engines loaded with tonal, non-tonal and looping sounds. Each layer carries its own ADSR, arpeggiator or LFO, and an FX section offering EQ, saturation, chorus and tremolo. The Grain Engines expose density, starting position and timing controls, so no two sounds come out the same.

  Motion is central to the design. Each FX grid has Motion options that can be tied to the mod wheel with a single setting, letting the timbre shift drastically between icy detachment and volcanic rage over the course of a performance. The advanced arpeggiator engine allows complex weaves to move through the sonic spectrum while the modulation knob controls any number of motion effects.

  The library ships with a preset browser holding a large collection of atmospheric presets, designed either to be used as they are or picked apart as starting points. The interface is split across a main page for the four layers, a grain page, an arpeggiator page, an FX page, and the preset browser.
specs: |-
  - Works with the FREE KONTAKT PLAYER
  - Requires KONTAKT version 7.10.9 or higher
  - macOS 13, 14 or 15 (latest update)
  - Windows 10 or 11 (latest service pack)
  - 8 GB RAM (more recommended)
  - At least 8.5 GB of free hard disk space, SSD recommended
  - Some presets require a fast CPU, Intel i7 processor or higher
  - 4 independent sound layers, two of them Grain Engines
  - 170 carefully crafted presets (page elsewhere cites over 200)
  - Sound effects content and granular synthesis
  - Per-layer ADSR, arpeggiator or LFO, and FX (EQ, saturation, chorus, tremolo)
  - Full mod wheel support of its core engine
  - Powerful motion engine to drastically change the timbre
  - Sounds recorded by Mats Lundgren and Amina Hocine of Pole Position
