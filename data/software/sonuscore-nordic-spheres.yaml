description: Fusing musical instruments and sound effects, Nordic Spheres features an unpolished, ambient sound to create musical soundscapes of ice and snow. A granular Kontakt instrument that blends four independent sound layers with an advanced Grain Engine to produce frozen, atmospheric textures for cinematic composition.
specs: |-
  - Requires Kontakt 7.10.9 or higher (works with free Kontakt Player)
  - macOS 13, 14, or 15
  - Windows 10 or 11
  - 8 GB RAM minimum
  - 8.5 GB free disk space (SSD recommended)
  - Intel i7 or higher recommended
  - Four independent sound layers
  - Grain Engine with advanced granular controls
  - 170+ presets
  - Full mod wheel support
  - Arpeggiators and FX (EQ, saturation, chorus, tremolo)
  - Motion engine for timbral transformation
