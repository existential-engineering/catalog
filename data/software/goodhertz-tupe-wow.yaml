description: Tupe Wow combines tube and tape emulation with wow and flutter
  effects, merging Goodhertz's Tupe and Wow Control plugins into a single
  processor. It features 8 tube modes, 8 tape machine models, an optical
  compressor, and a ladder filter in one CPU-efficient plugin.
details: |-
  Tupe Wow is a mashup of two of our most popular plugins: Tupe — and — Wow Control.

  Tupe = Tube + Tape. Wow Control = Wow & Flutter (…and a lot of controls).

  On its own, Tupe is a deep plugin that can replicate entire analog signal chains of tubes & tape machines (both real and imagined). It does, however, lack one pretty significant thing that most tape machines have: — you guessed it! — wow & flutter.

  Our original thinking was: well, we already make a great wow & flutter plugin (Wow Control), so if you want wow, just use that! But we kept getting requests to combine them and somehow offer the functionality of Wow Control inside Tupe. Eventually, we came to realize that there would be some big benefits to combining the two, and after using Tupe Wow for a few minutes, it became clear that we needed to release this plugin.

  Tupe Wow = Tube + Tape + Wow & Flutter + More!
specs: |-
  - New 8 Track Reel-to-Reel Tapes (coming to Tupe eventually)
  - New C90 Toy Cassette Tape (coming to Tupe eventually)
  - New Tape Speed Adjustment and Tape Wow Speed Adjustment controls can change both wow & flutter speed and the tape's response for endless tonal variations
  - New Tube Ripple section for adding extra grit and grime caused by tube power supply ripple
  - New presets
  - Wow & flutter are linked to the Tape Mode selection, enabling accurate, full-machine reproduction with one click
  - More CPU efficient (especially in HQ Mode) by intelligently sharing CPU resources between the Tupe & Wow Control algorithms
  - Includes a large oscilloscope view of exactly what's happening with the pitch modulation
  - 3 pages of advanced controls
  - Supported channel configurations: mono in / mono out, mono in / stereo out, stereo in / stereo out
  - System requirements: Mac OS X ≥ 10.13 with an Audio Unit 64-bit, VST 64-bit, VST3 64-bit or AAX 64-bit host
  - System requirements: Windows ≥ 10 with a VST 64-bit, VST3 64-bit or AAX 64-bit host
