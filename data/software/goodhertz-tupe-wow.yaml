description: "Combined plugin merging Tupe (tube and tape emulation) and Wow
  Control (wow and flutter effects) into a single processor. Replicates analog
  signal chains using tube and tape machine emulation with wow and flutter.
  Includes tube ripple section for adding grit from tube power supply ripple,
  tape speed adjustment controls, oscilloscope visualization, and new FE90 and
  C90 Toy cassette tape models."
details: |-
  3.10 (beta)

  Combined Tupe + Wow Control in single plugin
  Tube ripple section for power supply grit
  FE90 and C90 Toy cassette tape models
  Tape Mode selection linking wow & flutter to tape machines
  Tape speed adjustment controls
  Oscilloscope visualization of pitch modulation
  Improved CPU efficiency especially in HQ Mode
