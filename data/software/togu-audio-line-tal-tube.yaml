details: |-
  TAL-Tube is a saturation plugin with the characteristic of tubes, plus an additional amplifier mode.

  Togu Audio Line describes it as very suitable for adding higher harmonics, giving more excitement and analog character to digital sounds or drums.

  At extreme values it can also be used as a grungy distortion effect.

  TAL-Tube was one of the four free effects TAL distributed as TAL-Effects, alongside the original TAL-Bitcrusher, TAL-Flanger and TAL-USE. TAL now lists TAL-Effects under "Deprecated Plug-Ins (not supported)".

  It was released as a 32-bit VST for Windows and as a 32-bit VST and AU for OSX 10.6 to 10.9 hosts. Unlike TAL-Bitcrusher and TAL-Flanger it never had a 64-bit Windows build. No installer, VST3, AAX or CLAP build exists.
specs: |-
  - Tube style saturation with an additional amplifier mode
  - Adds higher harmonics for analog character on digital sounds or drums
  - Usable as a grungy distortion effect at extreme values
  - Windows: Windows XP or higher, 32-bit VST only (no 64-bit build)
  - OSX 10.6 and < 10.10 (32 bit Host)
  - Builds: Windows 32-bit VST, OSX 32-bit VST, OSX 32-bit AU
