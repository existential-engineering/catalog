description: "Big Bang Orchestra: Ymir let the children sing!: recordings of an
  internationally renowned children's choir. Angelic and pure sound. Vowels..."
details: |-
  For the second vocal installment of the big bang orchestra we were happy to
  enlist the talents of the internationally acclaimed "gumpoldskirchner spatzen"
  children's choir. With a tradition of over 70 years, this illustrious choir
  has performed at the Vienna state opera, many years at the famous "christmas
  in Vienna" concerts, as well as on countless recordings with luminaries such
  as leonard bernstein, sir george solti, claudio abbado, diana ross, michael
  bolton, charles aznavour and many others.

  For big bang orchestra: ymir, 24 young voices between 8 and 14 years of age
  entered the stage with a joyful energy and lightheartedness that was such a
  delight to experience. Though sampling sessions are rarely as fun as written
  choir pieces, they approached the sessions with utmost focus, discipline, and
  professionalism, and the result is really special the recordings shine with
  clarity and a soulful purity.

  The children sang the vowels aa and uu as sustains and legatos, as well as
  humming mm. Attack consonants include l, b, and n.

  As with all the other installments of the big bang orchestra, the ensemble was
  captured with an array of microphones to give you more flexibility and sound
  options using the synchron player's internal mixer. In addition to the usual
  synchron stage mic setups including mid, decca tree and surround microphones,
  our engineers deployed a pair of ribbon mics behind the conductor's podium as
  well as front row and back row mics.

  Bbo: ymir offers several room mixes (mix-downs from various mic positions to a
  stereo signal), decca tree, surround to stereo and real surround presets for
  immersive audio applications. In the "processed" category you'll find mixer
  presets such as cathedral, compressed, room slapback, and many more.
