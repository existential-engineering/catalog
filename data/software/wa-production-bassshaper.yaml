description: BassShaper is a bass processing plugin that combines subtone generation, saturation, transient shaping and cleanup controls in one interface. Its modules include Deboom, Demud, Level, Punch, Fade and Subtone alongside a three band EQ and an enhancement section.
details: |-
  BassShaper is a plugin for shaping bass lines, sub-bass and 808s, built around algorithms intended to clear muddy frequencies and keep low end audible in a busy mix. It gathers subtone generation, saturation, transient shaping and cleanup controls into a single interface, with factory presets as starting points.

  Deboom is activated by amplitude and tames booming content. It shares a name with the control in the maker's KickShaper plugin, but uses a different algorithm designed for bass information. Demud uses a pitch tracking system to dynamically reduce muddiness caused by note transitions and resonances, making individual pitches more pronounced. The Level control is driven by a pink noise signal and evens out amplitude fluctuations so the bass stays consistently audible.

  Punch targets only the transient-heavy portion of a bass note, applying compression or expansion to the first milliseconds. Fade works inversely, compressing or expanding only the tail of the audio, which can shorten long bass notes or lengthen short ones.

  Subtone is a low frequency generator that enriches the tone by generating complementary frequencies rather than simply adding low end, with SUB working an octave below and HIGH an octave above. The EQ panel splits audio into three linear bands with broad range band gain and proportional saturation, plus a gentle Cut control with a 6dB per octave slope. The enhancement controls are Press, a 670-style compression algorithm, Depth, which applies analog hardware convolution, Heat for saturation, and Mix as a dry and wet control for parallel processing.

  The interface is built on vector graphics and is resizable, with a central window showing the live audio as it travels through the plugin. AB comparison, undo and redo, auto gain compensation, oversampling and limiting options are included, along with genre-spanning factory presets, a PDF manual and a tutorial video.
specs: |-
  - Bass designer plugin with advanced features
  - Subtone low frequency generator with SUB and HIGH modes
  - Surgical shaping controls: Punch, Fade, Deboom, Demud and Level
  - Three band linear EQ with proportional saturation and a 6dB per octave Cut
  - Enhancement section: Press, Depth, Heat and Mix
  - AB comparison with undo and redo
  - Auto gain compensation, oversampling and limiting
  - Resizable vector interface with live signal display
  - Genre-spanning factory presets
  - Full PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Intel and Apple Silicon CPUs, native AAX format
