description: "Big Bang Orchestra: Regulus FX strings: ready-to-use musical
  elements and textures, from ethereal pads to pulsating patterns."
details: |-
  Big Bang Orchestra: Regulus reveals an abundance of effects and unusual
  playing techniques, originally recorded for the synchron FX strings I
  collection. Evoke mesmerizing soundscapes and inspiring loops played by a
  50-piece string section, from lightly bowed whispers to rumbling swarms.

  Easily create a panoply of colors and entire sonic worlds by simply holding
  one or two keys, and change intensity or add variety by moving pre-configured
  controllers. Bbo: regulus offers production-ready musical elements in these
  categories: spherical textures, character textures, glissandos, rises and
  hits, clusters, harmonic effects, pizzicato effects, special pads, and
  "inspiration crossfades".

  While 50 microphones were used to capture an array of positions, from close to
  ambient, the synchron player's integrated mixer presents you with 16 channels
  that offer close mic signals of each ensemble, front and back mics, decca
  tree, main surround, and high surround signals.

  A host of perfectly balanced mixer presets is readily available, from
  optimized stereo room mixes to immersive audio applications. Microphone
  positions include room mix, close mics for each ensemble, mid mic front of
  high and low string ensembles, back mic back of high and low string ensembles,
  main/room mic decca tree, main surround, and high surround signals.

  Big bang orchestra: regulus is a virtual instrument audio plugin for macos and
  windows powered by synchron player, which functions as a VST plugin, an audio
  units plugin, a VST 3 plugin and an AAX plugin.
