  layered, and finished tracks can be exported for sharing or as live backing.
details: |-
  VoiceJam is the original TC-Helicon iOS vocal looping app, built for singers who want to layer harmonies, loops and effects directly from an iPhone or iPad. Loops are recorded with a single tap and up to four parts can be layered, with reverb, echo, doubling and pitch effects applied on top.

  Finished tracks can be exported to share or to use as backing for live performance. The app is free to download, with optional in-app expansion packs.
specs: |-
  - Up to four layered loop parts
  - One-tap loop recording
  - Reverb, echo, doubling and pitch effects
  - Export of finished tracks
  - Optional in-app expansion packs
