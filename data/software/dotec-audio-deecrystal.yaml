description: Harmonics synthesis gives the sound a clearer outline, clarity and
  brightness. DeeCrystal is the crystalizer. It gives brightness like a crystal
  to the muddy sounds.
details: |-
  DeeCrystal is a crystalizer plug-in that uses harmonics synthesis to enhance clarity and brightness in audio material. Rather than boosting existing high-frequency content, it synthesizes new harmonic information to give muddy sounds a clearer outline and crystal-like brightness.

  The plug-in is well suited to mastering applications, particularly for adding treble presence to a master bus where traditional EQ lifts may introduce harshness. It can also be used on individual tracks where recordings lack definition or air.

  DeeCrystal is capable of restoring presence to historical or degraded recordings such as old tape transfers, where high-frequency content has been lost over time. The harmonics synthesis approach recovers the sense of detail without introducing noise or artifacts from over-boosting.

  Supported formats on macOS are VST2, VST3, AU, and AAX (64-bit, macOS 10.12 or later). On Windows the plug-in runs as VST2, VST3, and AAX (64-bit). DeeCrystal has been tested with Ableton Live, Cubase, Logic Pro X, Pro Tools, FL Studio, Studio One, GarageBand, Bitwig Studio, and more than ten other DAW hosts.

  A free demo version is available for both platforms; the demo inserts one second of silence every 30 seconds. Download sizes are approximately 10 MB for Windows and 18 MB for macOS.
specs: |-
  - Harmonics synthesis engine for clarity and brightness enhancement
  - Designed for master bus and individual track use
  - Formats: VST2, VST3, AU, AAX
  - 64-bit only
  - macOS 10.12 (Sierra) or later
  - Demo: 1-second silence every 30 seconds
