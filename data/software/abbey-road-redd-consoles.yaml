details: >-
  London's abbey road studios were at the epicenter of a seismic shift that
  rocked the world of music during the 1960s, and changed the course of popular
  culture forever. The beatles, the hollies, pink floyd and countless other
  luminaries made musical history at abbey road studios, trailblazing a
  revolution that resonates to this day. And at the heart of it all: the redd
  consoles, custom-designed, built by and named for abbey road studios' in-house
  record engineering development department.


  Renowned for their silky smooth eq curves, extraordinary warmth and lush
  stereo imagery, there's something magical about the redds that sound like no
  other consoles. Waves meticulously recreated the color, character and tonal
  complexity of the original desks: the redd.17 which still belongs to abbey
  road studios, and the redd.37 console now owned by lenny kravitz. The result
  is a pair of plugins that deliver the dimension, depth and richness of these
  console classics.


  Based on the legendary redd.17, redd.37 and redd.51 consoles. Delivers the
  classic british sound of the 1960s. Continuous eq controls. Developed in
  association with abbey road studios.


  Amp type determines the type of amplifier. (redd .37-.51 only). Channel select
  determines the channel configuration. Bass lift controls the 9 db low shelf
  that compensates for low frequency loss caused by using condenser microphones
  in a figure 8 configuration. Eq select toggles between classic and pop eq
  types. The classic treble eq features a shelf boost or cut at 10 khz; pop eq
  is a peak boost centered around 5 khz, with a shelf cut centered at 10 khz.
  Both pop and classic settings feature a continuous 10 db of boost or cut at
  100 hz. (redd .37-.51 only).


  Tone high controls high shelf equalization. Tone low controls low shelf
  equalization. Monitor controls the source of the monitor output. Spread
  selects stereo processing mode. (stereo component only). Drive controls the
  amount of drive added to the signal. Lower values result in a cleaner sound;
  higher values result in a more distorted sound. Analog controls the level of
  modeled noise and the hum. Output controls the output level of the signal. Vu
  meters display output vu readings.
