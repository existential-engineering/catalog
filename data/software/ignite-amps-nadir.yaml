description: NadIR is a dual IR convolver cabinet simulator plugin for guitar and bass amplifiers. It features zero latency IR processing with minimal CPU overhead, supporting mono, dual mono, and stereo routing configurations. Includes analog-modeled filters, delay control for phase interactions between IRs, IR morphing, algorithmic room reverb simulation, automatic resampling for varied sampling rates, and bundled studio-quality cabinet IRs and presets.
details: |-
  Zero latency processing
  Low CPU consumption
  Three routing configurations: Mono, Dual Mono, and Stereo
  Selectable IR length up to 0.5 seconds
  Automatic resampling for varied sampling rates
  Analog-modeled filters
  Delay selection for phase interactions between IRs
  Resonance control for power-amp/speaker interaction
  IR morphing capabilities
  Algorithmic room reverb simulation
  Input/output and individual IR level controls
  Fully automatable parameters
  Proprietary preset management with import/export
  Bundled studio-quality cabinet IRs and presets
