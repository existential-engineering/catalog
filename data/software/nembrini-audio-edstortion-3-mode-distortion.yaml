  heavily compressed distortion to subtle crunch with great dynamic response.
details: |-
  Like the original acclaimed Eddie Kramer Edstortion Pedal by F-Pedals, the plug-in features 3 modes of classic distortion based on the legendary work of Eddie Kramer with Jimi Hendrix, Led Zeppelin, Rolling Stones, The Beatles, Traffic and so many more.

  Edstortion is available in two versions: the original pedal-shaped GUI and a rack version designed for producers and engineers working in a traditional DAW channel-strip layout.

  With just a few knob tweaks you will be transported into the classic tones of the Golden Age of Rock. Edstortion is a phenomenal tool with an attitude to rock that allows you to achieve an incredibly wide spectrum of tones from heavily compressed distortion to a very subtle crunch with great dynamic.

  The plugin's three distortion modes cover a broad tonal range suitable not just for rock guitar, but also for hip-hop, dance, and other genres that benefit from harmonic saturation and grit.
