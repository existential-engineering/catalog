description: "Like the original acclaimed Eddie Kramer Edstortion Pedal by
  F-Pedals , the plug-in, features 3 modes of classic distortion based on the
  legendary work of Eddie Kramer with Jimi Hendrix, Led Zeppelin, Rolling
  Stones, The Beatles, Traffic and so many more."
details: |-
  The Plug-in comes in two different versions, one in the shape and sound of the original pedal and one totally new, in a rack version packed with extra features and a sonic concept to serve primarily music producers and engineers. With just a few knobs tweaks you will be transported into the classic tones of the Golden Age of Rock. Edstortion is a phenomenal tool with an attitude to rock that allows you to achieve an incredibly wide spectrum of tones from heavily compressed distortion to a very subtle crunch with great dynamic. Those classic tones will add amazing presence, space, flavour and vibe to any production in any style of music from Rock to Hip-hop and dance! My only complaint with going digital was that I could never get the big, heavy, fuzz sound that was in my head. This solved my problem. Excellent distortion pedal that sounds great whether using for subtle crunch or full on driven classic tones. A pedal I find myself going back to time and again. Give it a try!
