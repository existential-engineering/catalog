details: |-
  Aquamarine5 is a high-end mastering and mixing plugin suite which includes a
  monster compressor - sampled from one of the most highly regarded units on the
  market - featuring a smooth and warm sounding opto comp section and a punchy,
  discrete VCA-style dynamic processor which can go from a subtle 1.2:1 ratio to
  savage 'flood' limiting.

  Aquamarine5 includes an astoundingly precise recreation of an american
  ultra-rare passive equalizer from the '50s. The owner of this unit, which was
  sampled in berlin, explained how only a few of these beasts - possibly less
  than 5 - can still be found in good working order.

  New features: improved audio quality thanks to the oversampling inside the
  compressor. New "hyper" engine. New input - output - gr meters with numerical
  values. Numerical value parameters of the compressor. Various optimizations
  and graphical improvements.

  Resizable interface (for both comp and eq). New additional buttons (bypass lr
  and delta) to the compressor. New satu knob on compressor (range: 0, +24).
  Note: input trim acts only on compressor. Added bypass button to the
  aquamarine eq.
specs: |-
  - Opto compressor section
  - VCA-style dynamic processor
  - Compression ratio 1.2:1 to flood limiting
  - Passive equalizer
  - Oversampling
  - Hyper engine
  - Input-output-gr meters with numerical values
  - Numerical value parameters
  - Resizable interface
  - Bypass lr button
  - Delta button
  - Satu knob (range: 0 to +24 dB)
  - Input trim
  - Bypass button
