description: Brand-new free KONTAKT instrument. Inspired, live recorded phrases and techniques. 4 selected Asian flutes.
details: |-
  The FREE “Ethnic Flute Phrases” instrument is a handy scoring tool, made to breathe life into every composition. It includes 100+ live recorded ethnic flute phrases, providing an expressiveness which is unachievable in traditional sampling.

  This freebie offers an insight into the phrase-concept of Sonuscore's “Lyrical Series”, a cosmos full of outrageously beautiful and fully-playable phrase instruments. It contains bonus themes from the full “Ethnic Flute Phrases” instrument.

  Each instrument of the Lyrical Series includes a variety of live recorded phrases in multiple tonalities with countless different expressions, bringing the artistic soul of every instrument right at your fingertips.

  Inspired by the Lyrical Series, the same intuitive and easy to use interface gives instant access to the most essential features as well as the freedom to dive deeper and shape the sound as you wish.
specs: |-
  - 100+ live recorded ethnic flute phrases
  - 4 selected Asian flutes
  - Phrases in multiple tonalities with varied expressions
  - Bonus themes from the full Ethnic Flute Phrases instrument
  - Interface and phrase concept taken from the Lyrical Series, including an FX page
  - Requires a FULL version of Native Instruments' KONTAKT 5 (version 5.8.1 or higher); the free KONTAKT PLAYER is not sufficient and only runs the instrument in demo mode
  - Intel Core 2 Duo processor recommended
  - Mac OS X 10.11 or higher
  - Windows 7 or higher
  - 4 GB RAM
  - At least 170 MB of free hard disc space
