description: FabFilter Pro-C 3 is a high quality compressor plug-in. Available in VST, VST3, AU, CLAP, AAX and AudioSuite formats for Windows and macOS.
details: |-
  FabFilter Pro-C 3 is a high-quality compressor plug-in for the most demanding engineers. Whether you need subtle mastering compression, an upfront lead vocal, that magic drum glue or deep EDM pumping: Pro-C 3 gets the job done with style.

  Pro-C 3 offers 14 different, program-dependent compression styles and various character modes to introduce smooth saturation, vintage color and analog drift. You also get full immersive / Dolby Atmos functionality (up to 9.1.6), up to 32x oversampling, unique auto-threshold, intelligent auto-gain and auto-release, a variable knee and hold, smooth lookahead, external side-chain and host tempo sync triggering, variable stereo linking and mid/side processing.

  The fully redesigned interface in FabFilter Pro-C 3 offers insightful metering with real-time displays that will greatly improve workflow. The large animated level/knee display visualizes exactly when, why and how compression is applied to incoming audio.

  The new character panel brings Pro-C 3 to life through carefully designed analog saturation, coloring and drift, including customizable drive and pre/post-compression routing settings.

  Add up to 6 EQ bands with all shapes from Pro-Q 4, including all-pass and brickwall filters. You can also choose to let the compressor trigger on the external side chain signal, MIDI or to a host-tempo-synched pulse.
specs: |-
  - Fourteen different compression styles including Versatile, Smooth, Vari-Mu, El-Op, Upward and TTM
  - Character modes: analog saturation, coloring and drift with customizable Drive
  - Full Screen mode with large level display and side-chain EQ controller
  - Host tempo triggering with customizable sync, offset and pulse length
  - Auto Threshold: level-independent threshold for dialog processing
  - Instance List integration with Pro-Q 4
  - Full immersive / Dolby Atmos functionality (up to 9.1.6)
  - Side-chain EQ section: up to 6 bands including brickwall or all-pass filters
  - Up to 32x oversampling
  - Program-dependent attack and release curves
  - Smooth lookahead (optional, up to 20 ms)
  - Intelligent Auto Gain and Auto Release
  - External side chain triggering and optional MIDI triggering
  - Custom knee, variable from hard knee to a 72 dB soft knee
  - Variable stereo linking and mid/side processing
  - Sample-accurate automation of all parameters
