details: |-
  LUXE is an effect plugin that compresses and saturates an audio signal in a quite subtle but musical way. It is very useful for making a track "fit in the mix", and can be used with very good results on a drum bus, a vocal track or anything in between.

  LUXE is very easy to use, simply choose between the LUXE or FINESSE algorithms, and set the desired processing level. Don't be fooled by the modest control possibilities, under the hood is a very sophisticated set of parameters that will treat your incoming audio with great care, musicality and warmth. The slider sets the amount of the effect. Under the hood this parameter controls a set of internal (non-visible) parameters which makes LUXE an easy tool to use for quick results. The OUT knob sets the output volume and ranges from silence to +6 dB.

  The alternate FINESSE algorithm offers a slightly different frequency response, and also adds some edge to the internal saturation module.

  The interface has four parts: the algorithm choice between LUXE and FINESSE, an indicator showing the amount of LUXE treatment given to the signal, the amount slider, and the output level control.
specs: |-
  - Super-simple interface that lets you focus on more important stuff than knobs
  - Two carefully developed algorithms that cover a wide array of uses
  - Output control for the signal
  - Low CPU footprint
  - Single slider sets the amount of the effect, driving a set of internal non-visible parameters
  - OUT knob sets output volume, ranging from silence to +6 dB
  - Indicator shows the amount of LUXE treatment applied to the incoming signal
  - Requires macOS 10.10 or later (optimized for the M1 processor), or Windows 7 (SP1) or later, running an AU, VST or AAX compatible 64-bit host
  - iPad version available as AUv3
