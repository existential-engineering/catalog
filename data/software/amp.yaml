details: |-
  AMP is an effect plugin designed specifically as a tool to quickly make drum
  sounds punchier, more present and more demanding in a mix.

  Amp is also a great all-around tool for individual instrument sounds when it
  comes to making them sound louder and more interesting without over processing
  or clipping.

  Amp brings you a highly sensitive eq, a near transparent limiter with soft
  clip, saturation and stereo control.

  Easily make drums, 808's and other sounds louder and more present in your mix
  without over processing.

  Quick, point and click eq with unlimited bands, easy to read analyzers and
  straight forward controls.
