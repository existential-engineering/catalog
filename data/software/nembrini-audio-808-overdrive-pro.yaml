details: |-
  NA 808 Overdrive Pro is modelled on the Ibanez TS808* pedal with the JRC4558D IC chip. The knobs on this classic “stomp-box” plugin are Drive , Tone and Level. Regularly remarked as the “Holy Grail” of overdrive pedals, it should be an integral part of every guitarists’ plugins arsenal. This pedal plugin produces breathtaking tones, honouring its tradition and quality. NA 808 Overdrive Pro classic overdrive pedal is everything that made its original release fantastic, and more.
