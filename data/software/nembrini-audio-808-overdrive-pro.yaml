description: NA 808 Overdrive Pro is modelled on the Ibanez TS808 pedal with the JRC4558D IC chip, featuring Drive, Tone, and Level controls. An essential and versatile overdrive plugin suited for jazz, rock, and metal genres, available for free.
details: |-
  NA 808 Overdrive Pro is modelled on the Ibanez TS808 pedal with the JRC4558D IC chip. The knobs on this classic "stomp-box" plugin are Drive, Tone and Level.

  Jazz, Rock, Metal, no matter what genre you play, the NA 808 Overdrive Pro little magic box plugin will prove to be essential to your collection. It is very responsive, versatile, and available completely free.

  Regularly remarked as the "Holy Grail" of overdrive pedals, it should be an integral part of every guitarist's plugins arsenal. This pedal plugin produces breathtaking tones, honouring its tradition and quality.

  NA 808 Overdrive Pro classic overdrive pedal is everything that made its original release fantastic, and more. If you'd like to push the boundaries of this brilliant "stomp-box" to its maximum potential, you can attach it to an amp plugin distortion setting, for producing that slick valve tune.
specs: |-
  - Modelled on the Ibanez TS808 overdrive pedal with JRC4558D IC chip
  - Three controls: Drive, Tone, and Level
  - Compatible with VST2, VST3, AAX, and AudioUnits (AU) plugin formats
  - Requires Mac OS 10.9 or newer (64-bit)
  - Requires Windows 7 or newer (64-bit)
  - Intel compatible or Apple Silicon CPU
  - 1GB RAM minimum
  - 64-bit DAW required
  - Also available as iOS app (App Store)
  - Version 1.0.7
