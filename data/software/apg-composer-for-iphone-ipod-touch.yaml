details: >-
  Apg composer combines a 3-voice fm synthesizer with an implementation of the
  logique analogique sequencer, which triggers notes when a weighted sum of
  different signals exceeds a threshold.


  Apg composer was created from a simulink model without writing app-specific
  code, using the audio plugin generator source code.


  Compared to the ipad version of apg composer, the user interface for the
  iphone app has been simplified by controlling several parameters using just
  one knob. The underlying sound synthesis algorithm however remains the same.


  The iphone app will work only with devices with an apple a4 processor (or
  faster). Currently, this includes the iphone 4, the iphone 4s, and the 4th
  generation ipod touch.
specs: |-
  - 3-voice fm synthesizer
  - Logique analogique sequencer
  - Weighted sum signal threshold triggering
  - Single knob parameter control
  - Apple a4 processor or faster required
  - Ios compatibility
  - Standalone application
