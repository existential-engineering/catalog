details: |-
  AutomaticLite is a simplified, free version of the automaticdynamic plugin.
  It's an automatic compressor that's effortless to calibrate to your material.
  There are no dials for threshold or make-up gain because these are automatic.
  Thus the device stays configured and delivers a consistent dynamic signature,
  even as your material gets louder and quieter.

  The plugin also sounds great, with proprietary gain-reduction dynamics
  designed to preserve transients.

  Available in vst3 format for pc, and vst3 & AU formats for mac. AAX support
  coming soon. Requires a compatible digital audio workstation or other plugin
  host.

  Set the release time to best match the groove of your material. The mix dial
  has a sweet spot at 33% wet. Click the gain reduction display for instant a/b
  test (plugin will keep listening to the input and stay calibrated).
  Double-click to reset a dial to its default value, or hold / to fine-tune.

  Use automaticlite on your master bus or on individual audio tracks.
specs: |-
  - Automatic compression threshold
  - Adjustable compression ratio (1-4x)
  - Adjustable attack/release times
  - Automatic gate with adjustable range up to 6db
  - Parallel processing via gain-matched dry/wet mix control
  - Automatic make-up gain
  - Mid-side processing (100% unlinked)
  - Zero latency
