details: |-
  The TSAR-1 Reverb is not an emulation. It's not a stock design. It's not a static snapshot of a space. The TSAR-1 is a powerful, modern reverb algorithm. It's alive and vibrant, it's gentle and dreamy, and above all, it's natural and believable.

  The True Stereo Algorithm inside the TSAR-1 is what gives it its magic. The strength lies in its sophisticated sound and versatility, no matter whether it's used on strings and brass or rock drums and lead vocals, it always shines.

  TSAR-1 has a comprehensive and easy-to-use interface that is unparallelled in other high-end reverb products. Instead of a myriad of controls, Softube gave the user interface five sliders and a couple of switched options. But you may very well find you never need to use even these simple controls, because a solid bank of presets is included, which will cover most of your needs. The presets are clearly named for their intended use, so find a setting you like, maybe tweak a little, and you're good to go.

  The five main sliders are Predelay (a rhythmic effect or a way to match the tail with the early reflections), Time (longer or shorter reverb tail), Density (smooth, modern and dense, or sparse, lush and vintage), Tone (dark or bright character) and High Cut (cutting excess highs). Further controls cover Early Reflections Type (Large, Medium or Small), Early Reflections Mix, Diffusion, Modulation (vintage chorus-style or modern), Reverb Mix and Output Volume.

  The product supports Softube Extended Features, easy-access panels that add modern precision and workflow to the classic interface. It is also available as part of Flow Mixing Suite and Flow Complete Suite.
specs: |-
  - True Stereo Algorithm
  - Extraordinary versatility
  - Comprehensive user interface
  - Modern and powerful high-end reverb
  - Extensive preset library: 41 presets categorized into a 'modern' and a 'vintage' set
  - Also includes the TSAR-1R Reverb
  - Interactive display shows both current and previous settings, toggled by clicking each parameter value display
  - Supports Softube Extended Features
  - Requires a Softube account and an iLok account (no physical iLok required)
