details: |-
  BLEASS Fusion is a unique and powerful waveshaping tool that harnesses the
  limitless flexibility of wavetables to unleash sumptuously smooth saturations,
  disgracefully dirty distortions, and maximally mad mashups.

  Bleass has designed fusion to be one of the if not the most versatile and
  adaptable distortion and saturation plugins available today, able to
  completely change its entire tone and character in an instant.

  The magic comes from the way in which wavetables define the sonic results of
  processing, and so empower the plugin with the versatility to satisfy your
  every sonically-destructive whim.

  A pair of multi-mode resonant filters allow bleass fusion to focus its fury on
  particular frequencies, or can be used to tame its more extreme excesses.

  And with a full complement of modulators that add movement and dynamism to
  your sound, a huge palette of expressive, rhythmic and evolving distortions
  are just waiting to be explored.
specs: |-
  - Wavetable-based waveshaping
  - 58 included wavetables
  - Custom wavetable import
  - Multi-mode resonant filters
  - Modulators
  - Distortion and saturation
