details: |-
  Black q is a 4 band tube EQ with 2 modes of saturation. These are modeled from
  analog equipment featuring sowter and lundahl transformers and various tubes.

  A new and improved version of black q v2, now features overlapping bands and
  new frequency ranges as well as oversampling for more "analog" behavior.

  Black q v2 by tone empire is a virtual effect audio plugin for macos and
  windows. It functions as an audio units plugin, a VST 3 plugin and an AAX
  plugin.
specs: |-
  - 4 band tube EQ
  - 2 modes of saturation
  - Sowter transformers
  - Lundahl transformers
  - Overlapping bands
  - New frequency ranges
  - Oversampling
  - macOS support
  - Windows support
