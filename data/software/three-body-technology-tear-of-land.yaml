description: Sampled Chinese Xun virtual instrument holding 1,152 samples at 44.1 kHz and 24 bit across four mixable microphone channels, with eight performance techniques including mordent, trill, flutter, vibrato and gliss.
details: |-
  Xun is a wind instrument with a deep, vacant sound, with a history of about seven thousand years. The earliest unearthed examples have been widely found at many archaeological sites, such as the Hemudu site, the Zhaobaogou relics, and the Banpo site of the Yangshao culture. Xun usually has an egg- or pear-shaped body made of pottery, with one blowing hole on top and multiple finger holes along one side. It was a component of court and ritual bands in ancient times, fell out of use during the turmoil of the late 19th and early 20th centuries, and was revived by archaeologists and artists in the 1980s. Today it is commonly used in historical themes with murky or declining scenes.

  The library holds 1,152 samples recorded at 44,100 Hz / 24 bit, totalling 2 GB. Five microphones in different positions captured the spatial and reverb characteristics of the Xun, mixed down to four channels: Yin, Yang and far stereo. The volume of each channel is adjustable in the software, making a wide range of tones available from one instrument.

  By controlling airflow and fingers, the Xun has a rich set of performances such as mordent, finger pole popping, trill, flutter, vibrato, staccato and gliss, all of which can be triggered in the software. Eight techniques were selected, covering traditional performance, film and television soundtrack, and the special techniques common in Chinese ancient-style songs. Real-recorded expressions are freely controllable through MIDI CC, two speeds of real-recorded gliss samples combine with sample synthesis for gliss at freely adjustable speed, and a real-sample-based LFO engine drives realistic, adjustable vibrato.

  Legato uses sound recorded between notes at two speeds and applied according to playing speed, alongside regular, popping and cry legato specific to the Chinese Xun, with cry and non-cry styles selected by keyswitch. A spectrum fusion legato technology replaces the naive cross-fade that induces phase cancellation, using frequency-domain fusion where necessary to smooth the transition between samples. The sampling engine adds disk buffer streaming, sample compression and sound fusion technology.

  Convolution reverb samples for the Chinese Traditional series were recorded at famous natural and historical heritage sites in China, so the instrument can be placed at the Great Wall or the Terracotta Army site. An effect rack carried over from Heavier7Strings adds compressor, EQ, chorus and ping-pong delay, and a pattern library with preset patterns and drag-and-drop MIDI clips captures ideas quickly.
specs: |-
  - 1,152 samples
  - Sample parameters: 44,100 Hz / 24 bit
  - Sample size: 2 GB
  - Adjustable sound field with four mixable channels: Yin, Yang and far stereo
  - Five microphone positions captured during recording
  - Eight Xun performance techniques including mordent, finger pole popping, trill, flutter, vibrato, staccato and gliss
  - Real-recorded expressions controllable via MIDI CC
  - Gliss at freely adjustable speed from two recorded speeds plus sample synthesis
  - Real-sample-based LFO vibrato engine
  - Regular, popping and cry legato with keyswitch-selectable cry styles
  - Spectrum fusion legato technology using frequency-domain fusion
  - Convolution reverb recorded at Chinese natural and historical heritage sites
  - Effect rack: compressor, EQ, chorus and ping-pong delay
  - Pattern library with presets and user patterns via MIDI clip drag-and-drop
  - Minimum system requirements: Intel or AMD CPU with SSE 4.1 instruction set, or Apple chip
  - Mac OS X 10.9 / Windows 7
  - 4 GB RAM and 2 GB disk space
  - 64-bit VST2, VST3, AAX and Audio Unit
  - Logic Pro X or higher required on Logic (Logic 9 is not supported)
