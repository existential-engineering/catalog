description: Versatile algorithmic reverb plugin designed to create lush,
  spacious, and immense environments while remaining easy to fit in the mix.
details: |-
  Selene is a versatile algorithmic reverberation plugin designed to create
  lush, spacious, and immense environments, while remaining easy to fit in the
  mix. It features an internal duck and gate for automatic level management,
  making it straightforward to blend reverb tails without cluttering the mix.

  The plugin includes a Vintage knob that simulates classic reverb character, a
  Diffusion knob ranging from sparse to plate-like settings, and a Drive knob
  for adding saturation to the reverb signal. A visual low-shelf and high-shelf
  post-EQ allows precise tonal shaping of the wet signal.

  Selene offers a Freeze function for creating infinite reverb tails, an 8-band
  Damping EQ for detailed frequency-dependent decay control, and a 64-bit double
  processing signal path for high-fidelity audio. The Full Edition adds 2x
  Oversampling and a High-Quality Shimmer effect with 4 modes.

  Available as both a Free Edition with core features and a Full Edition with
  advanced capabilities, Selene provides professional reverb processing
  accessible to producers at any level.
specs: |-
  - Internal Duck and Gate
  - Vintage knob for classic reverb simulation
  - Diffusion knob (sparse to plate-like settings)
  - Drive knob
  - Visual low-shelf and high-shelf post-EQ
  - Freeze function for infinite reverb tails
  - 8-band Damping EQ
  - 64-bit double processing signal path
  - Extensive Mix section
  - 2x Oversampling (Full Edition)
  - High-Quality Shimmer with 4 modes (Full Edition)
