description: Saturate is a detail-preserving clipper plugin that lets you
  overdrive signals up to 24dB while maintaining tonal balance and fine detail,
  processing individual frequency sine waves independently to prevent low
  frequencies from masking midrange and high-frequency content.
details: |-
  Saturate is built around Newfangled Audio's Detail Preservation algorithm, which processes each frequency independently rather than treating the full signal as a whole. This approach prevents low-frequency content from obscuring midrange and high-frequency detail during heavy saturation — a common problem with traditional clippers and saturators.

  The plugin offers up to 24dB of overdrive with a Shape control that morphs between hard clipping and smooth saturation curves. A Symmetry control lets you introduce even-order harmonics, while the Ceiling control sets the clipping threshold. An optional anti-aliasing mode is available for cleaner results at the cost of additional latency.

  Saturate includes independent INPUT and OUTPUT level controls with AUTO gain compensation, mastering-quality peak and RMS metering, and 24 factory presets covering a range of saturation styles. A resizable interface and full undo/redo support are included.

  Version 1.12.0 introduced a major preset librarian overhaul with A/B comparison and Delta Listen Mode, allowing users to hear only the saturation artifacts being added. The plugin supports Apple Silicon natively and is compatible with macOS 10.9+ and Windows 10+.
specs: |-
  - Up to 24dB of overdrive
  - Detail Preservation algorithm processes individual frequency sine waves independently
  - Shape control morphs between hard clipping and smooth saturation curves
  - Symmetry control for even-order harmonic generation
  - Ceiling control for clipping threshold
  - Optional anti-aliasing mode
  - Independent INPUT/OUTPUT levels with AUTO gain scaling
  - Mastering-quality peak and RMS metering
  - 24 factory presets
  - Resizable UI
  - Undo/redo support
  - A/B comparison
  - Delta Listen Mode
  - Apple Silicon native (AAX Silicon Native from v1.11.0)
  - macOS 10.9+, Windows 10+
  - 64-bit AAX, AU, VST, VST3
