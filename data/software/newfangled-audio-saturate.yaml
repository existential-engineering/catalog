    description: Fixed a crash on preset save under certain conditions.
  - name: 1.13.0
    releaseDate: 2024-05-04
    description: Preset name is now saved with Session. Fixed reveal preset folder
      on Windows. Unknown is now No Category. Enter button saves preset on
      preset save page. User Bank added to the preset drop down list. Added
      cycle UI message to OpenGL Button. Added IMPORT button for presets.
      Favorite flags are now persistent on load and save. Made logos render more
      clearly on Windows. Passes Windows Smart Screen.
  - name: 1.12.7
    description: Fixes a potential crash and/or distortion that could be caused with
      DETAIL PRESERVATION on and SHAPE off.
  - name: 1.12.6
  - name: 1.12.5
    description: Third Party Banks are now shown in the main dropdown. Author and
      Banks now show presets by category. EXPORT is now called SAVE AS and SAVE
      is now SAVE TO USER. Neither SAVE nor SAVE AS will clear tags, category,
      or description. SAVE AS remembers your previous save position. Added
      scroll bar and resizable columns to the LIBRARY page. Removed duplicate
      files when saving a .tide as a .nfa.
  - name: 1.12.1
    description: Automatically rescans plug-ins folder on every open. Delta Listen
      Mode now works correctly for high DRIVE values.
  - name: 1.12.0
    description: New preset librarian adds Categories, Tags, Descriptions, Artist
      links, Favorites, and Search to presets. Multi level undo/redo. True A/B
      comparison. New Delta Listen Mode. SET AS DEFAULT button allows you to
      save any settings as your default.
  - name: 1.11.0
    description: Support for AAX Silicon Native (Mac only). Improved performance on
      Windows machines. Plug-ins default to OpenGL Off on Windows. Removed
      support for Windows 8.
  - name: 1.10.2
    description: Mac only. Added support for macOS Ventura.
  - name: 1.10.1
    description: Fixed a potential initialization bug.
  - name: 1.10.0
  - name: 1.9.1
    description: Mac only. Fix Pro Tools bypass button. Fix problem with Saturate
      Drive at 0 dB. Fix Saturate's latency reporting.
  - name: 1.9.0
    description: Mac only. Native support for Apple Silicon.
  - name: 1.8.1
    description: Added resizable UI, click and drag the bottom right corner to
      resize. Animated meters can now be drawn with or without OpenGL.
  - name: 1.7.0
    description: Added DETAIL PRESERVATION knob which allows you to control the
      amount of audio detail that's preserved while clipping. Added gain
      reduction meter. Added scrolling waveform meter. Removed 32-bit Windows
      builds. Signed Windows installers.
  - name: 1.6.6
    description: Fixed preset location. Fixed the INFO button so that it launches
      the manual again.
  - name: 1.6.4
    description: Plug-ins now load and work in GarageBand in Catalina. Fixed error
      message when installing VST3 without VST2 on Mac. Fixed potential crash.
  - name: 1.6.2
    description: Mac only. Fixed Tooltips.
  - name: 1.6.1
    description: Mac only. Support for OSX Catalina. Moved plug-ins from the
      Eventide subdirectory to the Newfangled Audio subdirectory. Moved Presets
      and Manuals from ~/Documents/Eventide to ~/Music/Newfangled Audio.
  - name: 1.5.15
    description: Windows only. Fixed an issue where plug-ins might get blacklisted
      in Cubase 10.
  - name: 1.5.12
    description: Windows only. Fix an issue where plug-ins would crash on Windows 7.
  - name: 1.5.11
    description: Initial release.
