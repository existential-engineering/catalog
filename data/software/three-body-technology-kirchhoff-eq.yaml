description: Kirchhoff-EQ is an ultimate 32-band parametric EQ plugin featuring refined sound quality, analog-matched curves, 15 filter types with continuously variable shape, 32 EQ types modeled from vintage hardware, and flexible low-distortion dynamic processing functions.
details: |-
  Kirchhoff-EQ is a 32-band parametric EQ plugin built for critical professional applications. It combines refined sound quality, analogue-matched curves, 15 filter types with continuously variable shape and 32 vintage EQ types modeled from real-world devices, with built-in dynamic processing functions that are highly flexible and have ultra-low distortion.

  An originally developed Robust Nyquist-matched Transform brings the digital-domain frequency response closer to its analogue counterpart without the high-frequency cramping found in regular IIR equalizers, and the technique is applied to all filter types. Internal processing is always 64-bit regardless of the host DAW's working precision, and a Double-Double technique makes a switchable 117-bit internal precision available (linear-phase mode remains 64-bit because it is an FIR filter). Psychoacoustic Adaptive Filter Topologies change the filter structure to a best-fitting state as band frequency changes, optimising sound quality in both low and high frequencies.

  The 15 filter types include low pass, high pass and band pass continuously variable from 0 dB/oct to 96 dB/oct, bell and notch from 12 dB/oct to 96 dB/oct, low shelf, high shelf and tilt shelf from 6 dB/oct to 96 dB/oct, flat tilt and flat top, a sword type with a sharper slope than bell for digging out resonances, plus brickwall low pass, brickwall high pass, allpass low and allpass high. Nine vintage EQ hardware units are modeled as a total of 32 EQ types, each with adjustable frequency points rather than the fixed positions of the original hardware, and only the ideal linear parts of the physical models are reproduced. Phase mode switches between zero-latency, analogue, linear phase and a mixed mode that uses zero-latency at low band frequencies and linear phase at high ones.

  Dynamic processing can be applied to all filter types except low/high pass, band pass and notch, including the vintage-modeled ones. A Harmonic Shifted Envelope shifts most of the energy of odd harmonics into even harmonics for an ultra-low noise floor. A two-way threshold lets the above stage act as a compressor or upward expander while the below stage acts as an expander or upward compressor. Detect/Relative Envelope Detection weighs a band against the overall volume envelope, with a freely adjustable detect and relative band frequency and Q, a sidechain option, and an adjustable contribution from 0% to 100%. An Onsets mix makes the envelope detector react more specifically to transients.

  Further features include spectrum grab for locating peaks directly on the analyzer, switchable 2x oversampling, per-band mid/side or left/right directional EQ, global left/right/mid/side monitoring, lookahead, global stereo width control, an operational band list, hand-written assembly optimisation for low CPU use, reduced clicking noise on parameter and type changes, an OpenGL-accelerated and themeable GUI, and a configurable spectrometer whose decibel range, refresh speed, resolution, frequency scaling, brightness and centre frequency can all be set.
specs: |-
  - 32-band parametric EQ
  - Robust Nyquist-matched Transform applied to all filter types
  - 64-bit internal processing, switchable to 117-bit Double-Double precision
  - Psychoacoustic Adaptive Filter Topologies
  - 15 filter types with continuously variable slopes up to 96 dB/oct
  - 32 filter types modeled from 9 historic vintage EQ hardware units
  - Four phase modes: zero-latency, analogue, linear and mixed
  - Dynamic processing with Harmonic Shifted Envelope and two-way threshold
  - Detect/Relative envelope detection with sidechain option
  - Onsets detection mix
  - Switchable 2x oversampling
  - Per-band mid/side and left/right directional EQ
  - Lookahead and global stereo width control
  - OpenGL GPU-accelerated, resizable and themeable GUI
  - 40+ presets for mixing and mastering, undo/redo and A/B switching
  - Multiple display ranges: 3 dB, 6 dB, 12 dB, 18 dB, 30 dB
  - Latency, minimum-phase: 0
  - Latency, analog phase: 63 sample points, about 1.4 ms at 44100 Hz
  - Latency, mix phase: 63 to 2047 sample points depending on band frequency
  - Latency, linear phase: 2047, 4095, 8191, 16383 or 32767 sample points
  - Minimum system requirements: Intel or AMD CPU with SSE 4.1, or Apple Silicon
  - Minimum system requirements: macOS 11 / Windows 10
  - Minimum system requirements: 2 GB RAM and 300 MB disk space
  - Plugin formats: 64-bit VST2, VST3, AAX and Audio Unit
  - Activation requires a Plugin Alliance account
