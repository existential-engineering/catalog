description: Kirchhoff-EQ is a ultimate 32-band parametric EQ plugin featuring refined sound quality, analog-matched curves, 15 filter types with continuously variable shape, 32 EQ types modeled from vintage hardwares, and flexible low-distortion dynamic processing functions. Built for all critical professional applications, Kirchhoff-EQ is ready to be your next-generation go-to.
details:
  - 32-band parametric EQ with 15 unique filter types including low/high pass, band pass, bell, notch, shelves, flat tilt, flat top, sword, brickwall, and allpass variants.
  - Continuously variable filter slopes from 0 dB/oct up to 96 dB/oct across most filter types.
  - 32 filter types modeled from 9 historic vintage EQ hardware units with adjustable frequency points.
  - "4 phase modes: zero-latency (minimum-phase), analogue phase, linear phase, and mixed phase."
  - Flexible dynamic EQ functions across all filter types (except low/high pass, band pass, notch) including vintage-modeled types.
  - Harmonic Shifted Envelope technology shifts odd-harmonic energy to even-harmonics for ultra-low noise floor in dynamic processing.
  - "Two-way threshold control: above-threshold acts as compressor/upward-expander; below-threshold acts as expander/upward-compressor."
  - Detect/Relative Envelope Detection with freely adjustable detect and relative band frequency/Q, plus sidechain mode.
  - Onsets Detection Mix for fine-tuning transient response independently from sustained envelope.
  - Robust Nyquist-matched Transform for analog-matched frequency response without high-frequency cramping.
  - 64-bit internal processing standard with switchable 117-bit ultra-high precision (Double-Double technique).
  - Psychoacoustic Adaptive Filter Topologies auto-adjust filter structure based on band frequency for optimized round-off error.
  - Switchable 2x oversampling, lookahead function, and GPU-accelerated GUI via OpenGL.
  - Per-band mid/side or left/right processing; global stereo width control with Mid/Side ratio and Side gain.
  - Spectrum Grab for rapid frequency peak location directly on the spectrum display.
  - 40+ factory presets for mixing and mastering; fully customizable GUI themes.
specs: |-
  - Bands: 32 parametric bands
  - Filter types: 15 unique types (low pass, high pass, band pass, bell, notch, low shelf, high shelf, tilt shelf, flat tilt, flat top, sword, brickwall low pass, brickwall high pass, allpass low, allpass high)
  - Vintage models: 32 filter types modeled from 9 hardware EQ units
  - Filter slopes: continuously variable from 0–96 dB/oct (type-dependent)
  - Phase modes: minimum-phase (zero-latency), analogue, linear, mixed
  - Internal processing: 64-bit standard; 117-bit ultra-high precision (switchable)
  - Oversampling: 2x (switchable)
  - Latency – Minimum-Phase: 0 samples
  - Latency – Analogue Phase: 63 samples (~1.4 ms @ 44100 Hz)
  - Latency – Mixed Phase: 63–2047 samples (frequency-dependent)
  - Latency – Linear Phase: 2047 / 4095 / 8191 / 16383 / 32767 samples (user-selectable)
  - OS: macOS 11 or later; Windows 10 or later
  - CPU: Intel/AMD with SSE 4.1, or Apple Silicon (native)
  - RAM: 2 GB minimum
  - Disk: 300 MB
  - Activation: Plugin Alliance account required
  - Trial: 14-day fully functional free trial
