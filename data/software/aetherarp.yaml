description: Aetherarp ambient & cinematic soundscapes generator. Overall this
  bundle is a sound designer's dream and a must-have for any...
details: >-
  Aetherarp is a 4 sound engines and cloud arpeggiator library for kontakt 5.8.1
  which creates evolving soundscapes, overtime mutating sounds, and
  ethereal/out-worldly moods that add movement and unpredictability to your
  ambient productions and filmscores.


  Each sound layer and shimmer layer offers 30 multisampled sound sources to
  choose from. Mutate your sounds with 180+ impulse responses in 10 categories
  included in each of the four convolvers.


  All the parameters of this unique arpeggiator can be randomised, generating
  unpredictable sound evolutions. When the cloud arpeggiator is in hold mode,
  the sound evolves for ever, creating unexpected evolutions.


  Aetherarp sound sources are multi-samples of organic instruments and analog
  synths, but you will never hear them in their "dry" state as the 200+ impulse
  responses will always process all samples rendering them un-recogniseable and
  unique in your sounds arsenal.


  Aetherarp's sounds blend perfectly in your orchestral template and are ready
  for your next blockbuster film score. Format: kontakt library (5.8.1 or
  above). Size: 3.27 gb (ncw compressed). Samples amount: 3095. It will not work
  with the free kontakt player. Sounds and presets installation requires pulse
  downloader.
specs: |-
  - 4 sound engines
  - Cloud arpeggiator
  - 2 main sound layers
  - 2 shimmer layers
  - 30 multisampled sound sources per layer
  - 180+ impulse responses in 10 categories
  - 4 convolvers
  - 200+ impulse responses
  - Randomisable parameters
  - Pre and post convolver distortion effects
  - Chorus effect
  - Master delay and reverb
  - Random generation of new sounds
  - Undo of last randomisation
  - Kontakt 5.8.1 or above
  - 3.27 gb ncw compressed
  - 3095 samples
  - 150+ presets (snapshots)
  - Hold mode for continuous sound evolution
