details: |-
  Original vintage style noise-gate / expander. The bt expandergate gx622 tames
  the noise floor so that you hear only the audio you want to keep.

  This fully-adjustable gate/expander reduces (or cuts) the signal if the level
  becomes too low (as determined by the gate threshold setting). This controls
  unwanted background noise on the track(s).

  Like a compressor, the attack and release controls determine how fast the gate
  opens and closes. To help the gate decide when to open, you can use the two
  filter controls (side chain).
