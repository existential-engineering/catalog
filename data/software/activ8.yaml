description: "Activ8 is finally here and it's a beast. Grab the demo and try it
  for yourself. Main features: over 300 factory presets. 250 waveforms"
details: |-
  Activ8 by rewired records is a virtual instrument audio plugin for windows. It functions as a VST plugin.

  Main features: over 300 factory presets. 250 waveforms (analog shapes, brass, voice, organ and more). Unison with up to 8 voices per osc (that means huge supersaws.). Multiple filter modes including lp, hp, 303 and vowel. 8 built-in fx modules (eq, delay, reverb, etc.). Fm synthesis. MIDI learn (link your MIDI keyboard to the VST controls). Bank and preset browser (save, load and make your own banks).

  This VST requires 'visual c++ redistributable packages for visual studio 2013' which you can download here for free from: www.microsoft.com/en-AU/download/details.aspx?id=40784

  Update log: 09/10/21: fixed formant vowel filter 12/24db. Updated init preset defaults (retrig and flip off, full rnd phase, less detune).
