description: The BAE-1023 plugin from Antelope Audio offers more frequencies in
  the mids and in the high ranges.
details: |-
  The BAE-1023 is a 3-Band EQ / HPF plugin that runs natively in your DAW on macOS or Windows, or in real-time on Antelope's Synergy Core interfaces.

  Ever felt like the BAE 1073 sounded ace but didn't offer enough control? BAE 1023 is here to save the day. It offers five more frequencies in the mids and four in the high range than its 1073 sibling, giving engineers significantly more tonal options across the spectrum.

  The EQ offers even more tone shaping options — for example, it lets you use the mid-bell curve directly against the low and high shelving EQs where they overlap. This results in a very organic analog sound. High frequencies can be boosted or cut in shelving mode, and the mids are EQ'd in peaking mode.

  The high pass filter works on an 18dB per octave slope and is switchable between 45Hz, 70Hz, 160Hz and 360Hz, giving you precise control over low-end cleanup before the EQ stage.
specs: |-
  - 3-Band EQ / High-Pass Filter plugin
  - Lows: +/-16dB at 35Hz, 60Hz, 110Hz and 220Hz
  - Mids: +/-12dB or +/-18dB at 160Hz, 270Hz, 360Hz, 510Hz, 700Hz, 1.6k, 3.2k, 4.8k, 7.2k, 8.2k and 10kHz
  - Highs: +/-16dB at 10kHz, 12kHz, 16kHz, 20kHz and 24kHz
  - High-pass filter: 18dB/octave slope, switchable at 45Hz, 70Hz, 160Hz and 360Hz
  - High frequencies in shelving mode; mids in peaking mode
  - Overlapping mid-bell against low and high shelves for organic analog response
  - Runs natively in your DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core interfaces
