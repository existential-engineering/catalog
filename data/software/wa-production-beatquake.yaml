description: BeatQuake is a tone shaping plugin for drums and beats built around four character controls, Tone, Enhance, Lofi and Shape, and four psychoacoustic pre-filtering colour modes. Designed by sound engineer Emrah Celik, it also works on bass lines, pads and vocals.
details: |-
  BeatQuake is a tone shaping plugin for drums and beats, crafted by award-winning sound engineer Emrah Celik, whose background in drum mixing runs to over 300 productions a year. It is built on psychoacoustic filtering and tuned tonal controls, with 100 discrete points on every knob. It is not limited to drums, and the page also names bass lines, pads and vocals as targets.

  Four control knobs each carry a distinct tonal character and can be used alone or combined. Tone draws on Pultec style EQ and a modern multiband exciter to add warmth and harmonic enhancement, reaching a V-shape curve in a single twist. Enhance boosts the attack power of a beat, increasing dynamics and adding sub-harmonic low end. Lofi replicates the texture of 12-bit samplers. Shape introduces inflation combined with a compressor algorithm, aimed at 808s and highly dynamic tracks.

  Four psychoacoustic pre-filtering colour modes are dialled in from the central control and were developed over two years. Shock punches up attack and strength while keeping the low end clean, Rift adds a gritty texture by stretching sustain and enhancing rumble, Tremor delivers heavy low end, and Fault enhances content above 60Hz for a clean gain boost. The modes preserve transients, enhance sustain and maintain low end rather than working as plain saturation.

  The interface is built on vector graphics and is resizable, with input and output faders for monitoring. AB comparison, copy and paste, and undo and redo let different processing chains be contrasted, while an auto gain compensation button and an onboard limiter cover gain increases and clipping.

  A preset suite and a snapshot manager cover drums, percussion, breakbeats and other audio, and user settings can be saved and categorised as presets for later recall. A PDF manual and a tutorial video are included.
specs: |-
  - Four character controls: Tone, Enhance, LoFi and Shape
  - Colour selector with Shock, Rift, Tremor and Fault psychoacoustic modes
  - Quake Magnitude control
  - Frequency shaping filters
  - 100 discrete points on every knob
  - AB comparison with copy, paste, undo and redo
  - Auto gain compensation and onboard limiter
  - Click and pop free bypass
  - Preset and snapshot manager
  - Resizable vector interface with input and output faders
  - PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.14 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Intel and Apple Silicon CPUs, native AAX format
