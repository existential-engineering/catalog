details: |-
  This set contains 79 free sounds for softube's model 84. With this soundset the creator has recreated favorite sounds from the past, as well as some sounds that are based on more modern songs.

  You import the sounds in model 84 in the "preset collection" section and select the menu item "import preset(s)...". In the zip archive you will find the complete bank with 79 sounds, but also each sound as a single file.

  These are really great sounds, mainly focused on that '80s synthwave' vibe. Since they're free, it's pretty much a must-have if you own that synth.
