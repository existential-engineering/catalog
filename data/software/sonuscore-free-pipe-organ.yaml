description: "A free expressive keyboard instrument from Sonuscore, with custom mixing for three settings: Pedal, Toccata, and Principal."
details: |-
  FREE Pipe Organ is Sonuscore's sampled American Skinner pipe organ, given away as a thank you to its userbase. It reaches either end of the instrument's range, from delicate toccata flourishes and fugues at one extreme to massive pipe blasts at the other.

  The organ was sampled in the Saalkirche in Ingelheim, Germany, a church over 200 years old in its present form that doubles as a concert hall because it houses a famous E.M. Skinner pipe organ. Sonuscore positioned its microphones to reveal the majestic, famously orchestral timbres of the instrument.

  Recording covered three different settings, adjusted through a mixer and captured across 10 presets: Pedal (big, bassy and bold), Toccata ('back to Bach') and Principal (soft and angelic). Custom mixing between those settings is the instrument's main control.

  E.M. Skinner dropped out of school and came to organs while sweeping an organ shop, founded his Boston-based company in 1901, and built pipe complexes renowned for lush, romantic and orchestral qualities that were delivered across the United States and Europe. After the company merged with the Aeolian Organ Firm no more E.M. Skinner pipes were made, so each surviving set is a historical piece. The brand was used for the organ parts of the Interstellar soundtrack. The library is free and runs in the free KONTAKT PLAYER.
specs: |-
  - American E.M. Skinner pipe organ sampled in the Saalkirche in Ingelheim, Germany
  - Three recorded settings adjustable through a mixer: Pedal (big, bassy, bold), Toccata (back to Bach) and Principal (soft and angelic)
  - 10 presets with mixer adjustments included
  - Works with the FREE KONTAKT PLAYER
  - Requires KONTAKT version 6.7.1 or higher
  - Intel Core 2 Duo processor recommended
  - Mac OS X 10.11 or higher
  - Windows 7 or higher
  - 4 GB RAM
  - At least 182 MB of free hard disc space
