description: EQuilibrium is a professional-grade parametric equalizer with 32 bands of EQ, circuit models of vintage equipment, and a fully reconfigurable user interface — designed for mixing, mastering, and post-production.
details: |-
  Drawing on 50 years of EQ heritage, EQuilibrium is a custom-designed power tool for audio professionals. User-adaptable design, a cutting edge feature set, built for tackling critical mix/mastering tasks.

  Massively flexible EQ suitable for all critical professional applications. The audio engine can run at incredibly low CPU usage, or incredibly high for mastering applications. EQuilibrium features pristine digital curves, plus circuit models of vintage EQs, and engineering filters.

  The UI is completely reconfigurable with a set-up wizard to suit any workflow, alongside extensive routing, grouping, channel and metering control. Analyser functionality includes 1/3 octave, 1/12 octave, and spectrograph modes.

  Even in its lowest CPU mode, EQuilibrium generates super-high-quality prototypes with clear undistorted top-end. In FIR mode, phase control can be set to Linear, Analogue, Minimum, Zero-Latency Analogue, or Free.
specs: |-
  - 32 bands of EQ, Q 0.1 to 50, +/-36dB range
  - Each band can be Peak, HPF, LPF, High Shelf, Low Shelf or Notch
  - Circuit models of vintage EQs alongside pristine digital curves and engineering filters
  - In stereo, each band can process Mid, Side or the full stereo image
  - Surround support for channel groupings in DTS
  - Fully parametric filters (high and low-pass), 6/12/18/24/30/36/42/48dB/oct
  - Per-band phase control: Linear, Analogue, Minimum, Zero-Latency Analogue, or Free
  - Extensive analyser functionality including 1/3 octave, 1/12 octave, spectrograph
  - Completely reconfigurable UI with set-up wizard
  - Extensive routing, grouping, channel and metering control
