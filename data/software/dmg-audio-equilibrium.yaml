description: EQuilibrium is a professional-grade parametric equalizer with 32 bands of EQ, circuit models of vintage equipment, and a fully reconfigurable user interface — designed for mixing, mastering, and post-production.
details: |-
  EQuilibrium ('EQ, Ascended') provides 32 bands of fully parametric EQ with a Q range of 0.1–50 and ±36dB gain range. Band types include Peak, HPF, LPF, High/Low Shelf, and Notch. It includes circuit models of seven vintage EQs (models 4000, 3, 110, 550, 88, 32, and 250) for analogue character. Phase modes span Linear, Analogue, Minimum, Zero-Latency Analogue, and Free. Stereo processing options include M/S and L/R modes, with surround support up to 7.1 DTS. The plugin features a spectrum analyser (1/3 octave, 1/12 octave, and spectrograph), autolisten and autogain functions, and 8 banks of A/B comparison. Computer Music awarded it 10/10: 'This could well be the greatest EQ ever made...Utterly essential.'
specs: |-
  - 32 bands of parametric EQ; Q 0.1–50, ±36dB gain range
  - Band types: Peak, HPF, LPF, High Shelf, Low Shelf, Notch
  - Circuit models: 4000, 3, 110, 550, 88, 32, 250 (vintage analogue emulations)
  - Phase modes: Linear, Analogue, Minimum, Zero-Latency Analogue, Free
  - M/S (Mid/Side) and L/R stereo processing modes
  - Surround support up to 7.1 DTS
  - Spectrum analyser: 1/3 octave, 1/12 octave, spectrograph
  - 8 A/B comparison banks
  - Autolisten and autogain features
