details: |-
  Amplifikation VVV by Kuassa is inspired by a signature amp of a legendary guitarist, an inventor who has inspired the 5xxx signature guitar amplifier which delivers a very specific kind of guitar tone, dubbed as the "brown sound". It implements Kuassa's next-generation user interface, streamlining the process of operating the plugin for users with a cleaner, resizable interface.

  Supports various audio plugins: VST/vst3/AU/AAX which are compatible with any kind of digital audio workstation softwares. Standalone and amplifikation 360 modules versions are also available.

  Powered by kuassa's 3rd generation tube engine, amplifikation vvv recreates and tweaks all three major versions of the 5xxx amps to deliver the infamous brown sound. The amp has become a staple of metal sound.

  Type a, mark I features a beautiful and rich clean channel ideal for dreamy ballads or softer passages, works great with paf type pickups, and includes a crazy good crunch channel and tight lead channel with 80s flavor. Type b, mark ii delivers thick and full midrange with tight low end that delivers the famous brown sound, great for crunchy and dynamic rhythm tones, with 70's british tones. Type c, mark iii is deep and aggressive with monstrous gain that will please all metalheads, and on maximum gain, some will say that it's out of control, making it a must for modern productions.

  Nine types of workhorse mics are included: shure sm57, sennheiser md421, sennheiser md441, shure ksm 353, royer 121, akg c414, neumann tlm103, sennheiser e609, and beyerdynamic m 201. Freely adjustable dual-miking configurations with mono or stereo configuration are available, just like a real-life guitar recording session with mix option.
specs: |-
  - High gain guitar amp simulation
  - Rack extension plugin
  - 3 channels: red, green and blue
  - 3 amp types: type a mark I, type b mark ii, type c mark iii
  - Sag and bias feature on power amp section
  - Low pass and high pass filters
  - Five types of cabinets with impulse responses
  - Nine types of workhorse mics
  - Dual-miking configurations with mono or stereo configuration
  - Built-in noise gate and limiter
  - Up to 8x oversampling
  - 3rd generation tube engine
  - High-res resizable graphic
  - Standalone version available
  - Amplifikation 360 modules version available
  - Universal 2 binary
