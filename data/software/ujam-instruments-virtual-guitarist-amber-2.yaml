description: Don't waste any time getting your brilliance out and into the DAW with acoustic accompaniments from your very own session pro.
details: |-
  Don't waste any time getting your brilliance out and into the DAW with acoustic accompaniments from your very own session pro, Virtual Guitarist AMBER 2. Whether it's an intimate indie song, a larger-than-life pop ballad or a legendary rock hymn, the countless chords, octaves and riffs of this beautiful steel string will have you singing instantly.

  AMBER 2 plays with the feel of a studio vet, the kind that takes thousands of hours of practice. With a frustration-free design, you're guaranteed to get results in only a few seconds. AMBER 2 sounds like the cabin songwriting retreat of your dreams: the fire crackles, wood smoke is in the air and the sweet song of this steel string envelops you like a warm blanket.

  Virtual Guitarist AMBER 2 was recorded with carefully selected microphones to get the best possible sound variety. Just like its celebrated physical counterparts, AMBER 2 is a versatile instrument, with an on-demand session player offering 30 different styles containing over 350 phrases for instant gratification when composing. From clean to saturated, fat to shimmering: singer-songwriter, indie and contemporary pop and rock, AMBER 2 has got you covered.

  The in-built effects and tonal controls make it simple to dial in your perfect sound. Choose one out of 30 different stomp box combinations, including compressors, filters, delays, reverbs and wahs, then pick one out of 60 multi-FX chains under the Finisher knob for amazing textures and ambiences.
specs: |-
  - Instrument mode, completely new guitar model and phrases
  - Open Chords feature for extra variety and picking on top of strumming
  - More than 30 styles and 350 phrases
  - 30 stomp box emulations, 60 Finisher FX modes
  - Recorded with several handpicked microphones, pickups and recording setups
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 8 GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App, or downloadable installer file
  - Authorization: quick authorization via the UJAM App, or email and password within the plug-in
  - Supported standards: MIDI
  - Works on macOS and Windows with all major DAWs, including Ableton Live, Logic Pro, Pro Tools, FL Studio, Cubase, Studio One, Bitwig, Reaper and Reason
  - All MIDI phrases and included sounds are royalty-free
