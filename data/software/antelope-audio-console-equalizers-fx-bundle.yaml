details: |-
  True

  {'name': 'BAE-1073', 'description': '3-Band EQ / HPF modeled after one of the most iconic units in recording history; shapes any source with a warm and true vintage sound.'}

  {'name': 'VEQ-HA32C', 'description': '4-Band EQ / HPF / LPF inspired by one of the richest and most characteristic-sounding four-band channel EQ modules; versatile on vocals, bass and electric guitars, and drums.'}

  {'name': 'VEQ-STU 169', 'description': '3-Band EQ / HPF modeled after the first portable mixing console from the late 1950s; transparent yet gently colored analog sound.'}

  {'name': 'VEQ-55A', 'description': '3-Band EQ / HPF / LPF based on a legendary 1960s console, known for unique coloration on acoustic instruments.'}

  {'name': 'VEQ-55B', 'description': '4-Band EQ / HPF / LPF modeling the proportional Q behavior of each band on a classic American console unit.'}

