description: "One Kit Wonder: Architects captures the signature sound of Architects drummer Dan Searle, delivering huge, punchy, mix-ready modern drum tones straight out of the box. Built on Dan's custom SJC kit with low-tuned snare and dark Zildjian cymbals, the library includes a built-in Groove Player, Master EQ, Parallel Compression, and Reverb. Phase-coherent samples make layering effortless, and full NKS integration is included. Runs in the free Kontakt Player."
details: |-
  Kontakt-based One Kit Wonder drum library featuring Dan Searle's signature sound.
specs: |-
  - Requires Kontakt Player 6 or Kontakt 6 (latest)
  - Mac: 10.14 or higher, 64-bit only
  - Windows: 7, 8, or 10 (32/64-bit)
  - CPU: Intel i5 (Mac) or Intel Core 2 Duo / AMD Athlon 64 X2 (Windows)
  - RAM: 4 GB minimum, 6 GB recommended
  - Disk: 4.6 GB for instrument + 1 GB for Kontakt Player
  - GPU: OpenGL 2.1 or higher
  - Internet required for download and activation; offline use supported after
  - Drums: SJC Custom 24x18" kick, 12x8" rack tom, 16x16" and 18x16" floor toms, 14x8" SJC Dudley snare
  - Cymbals: Zildjian K Thin hi-hats, K Dark crashes, A Sweet Ride, Oriental Trash China
