description: "One Kit Wonder: Architects captures the signature sound of
  Architects drummer Dan Searle, delivering huge, punchy, mix-ready modern drum
  tones straight out of the box. Built on Dan's custom SJC kit with low-tuned
  snare and dark Zildjian cymbals, the library includes a built-in Groove
  Player, Master EQ, Parallel Compression, and Reverb. Phase-coherent samples
  make layering effortless, and full NKS integration is included. Runs in the
  free Kontakt Player."
details: |-
  One Kit Wonder: Architects delivers the huge and punchy modern drum sounds that Architects drummer Dan Searle is famous for. So famous, in fact, that we've been getting requests for an Architects library for years!

  Dan's kit comprises a big kick drum and floor toms, with a tone-full single rack tom and hefty, low-tuned, dry snare. He plays quite an extensive array of fairly dark Zildjian cymbals, with big crashes, big hi-hats, some very cool FX cymbals, a pair of x-hats, and also an extremely crashable ride, something we know lots of GGD users have been calling out for.

  The One Kit Wonder series was inspired by the many GGD users who use our libraries for songwriting. We know how crucial it is that there is as little time wasted between the moment inspiration strikes and you being able to capture it, and how important it is that you can hear your ideas sounding polished and professional so you stay excited as you develop them.

  It's our hope that this sample library will remove frustrating barriers in your creative process so that you can enjoy making music to the fullest.

  This instrument uses the latest version of Kontakt Player from Native Instruments. Installation and activation is managed via Native Access.
specs: |-
  - Requires Kontakt Player 6 or Kontakt 6 (latest)
  - Mac: 10.14 or higher, 64-bit only
  - Windows: 7, 8, or 10 (32/64-bit)
  - CPU: Intel i5 (Mac) or Intel Core 2 Duo / AMD Athlon 64 X2 (Windows)
  - RAM: 4 GB minimum, 6 GB recommended
  - Disk: 4.6 GB for instrument + 1 GB for Kontakt Player
  - GPU: OpenGL 2.1 or higher
  - Internet required for download and activation; offline use supported after activation
  - Drums: SJC Custom 24x18" kick, 12x8" rack tom, 16x16" and 18x16" floor toms, 14x8" SJC Dudley snare
  - Cymbals: Zildjian K Thin hi-hats, K Dark crashes, A Sweet Ride, Oriental Trash China
