description: A Celtic harp with a divinely inspired sound, Celestial Harp has a unique tone that is warm and soft in its plucks, but lush and enveloping with its full strums.
details: |-
  Celestial Harp is a sampled Celtic harp with a tone that is warm and soft in its plucks and lush and enveloping in its full strums, aimed at fantasy worlds and ancient settings. The Glow slider is the centrepiece, transmuting the sound into an airy pad through a particle effect whose speed and dynamic range can both be adjusted.

  The instrument was recorded with 5 round robins and includes the flageolet technique as a separate Harmonic layer. The Natural and Harmonic layers can be balanced against each other to move between a plain pluck and one with more shimmer, and 10 presets are supplied to take advantage of both the natural harp tone and the ethereal pad effect.

  A Celtic harp is much smaller and more compact than a classical concert harp such as Sonuscore's HA-PI, and its size makes it the harp more commonly heard in folk and traditional music. Alongside the layer balance, the streamlined interface carries Attack, Release, Dynamic Range and Mix knobs, three delay types and three reverb types.
specs: |-
  - 2 recorded articulations: Natural and Harmonics
  - 4 velocity layers (3 for the flageolet)
  - 5 round robins
  - Glow particle effect for atmospheric pad textures, with speed and dynamic range control
  - Attack, Release, Dynamic Range and Mix knobs
  - 3 delay types: Vintage (4ths), Modern (8ths) and Tape (dotted 8ths)
  - 3 reverb types: Room, Hall and Dream
  - 10 color presets
  - Lightweight, streamlined interface
  - 1.5 GB sample library
  - Requires the FULL version of Native Instruments KONTAKT 6.7.1 or higher (the free KONTAKT PLAYER only runs the instrument in demo mode)
  - Mac OS X 10.13 or higher, Intel Core i5
  - Windows 7 or higher, Intel Core i5
  - 4 GB RAM
  - At least 1.5 GB of free hard disk space
  - Available as a download only
