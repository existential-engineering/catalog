description: The Score Essentials introduces you to Sonuscore's acclaimed cinematic scoring family. With 45 expressive Stories and a curated selection of orchestral tools, this inspiring film scoring plugin offers a focused starting point for composers looking to create emotional, story-driven music with clarity.
specs: |-
  - Requires Kontakt 7.10.7 or higher (works with FREE Kontakt Player)
  - macOS: 12, 13, or 14 (latest updates); Apple Silicon or Intel i5+
  - Windows: 10 or 11; Intel Core i5 minimum (i7+ recommended)
  - RAM: 4 GB minimum; 6 GB recommended
  - Storage: 11.7 GB free space
  - GPU: OpenGL 2.1+ or Direct3D 11.1+
  - 45 dynamic, customizable Stories with four arrangement variations each
  - 10 instrument slots per Story (swappable)
  - Instrument palette: Strings, Brass, Woodwinds, Percussion, Synths, Guitars, Keys, Choir, and World instruments
  - JAM Station for exploring sounds without a keyboard
  - DAW-friendly MIDI workflow
