description: The Score Essentials is the ideal way to explore the creative possibilities of modern cinematic composition – without the usual technical distractions.
details: |-
  THE SCORE ESSENTIALS is Sonuscore's entry point into its cinematic scoring family, pairing 45 expressive presets called Stories with a curated selection of orchestral tools. The page frames it as a focused starting point for composers writing emotional, story-driven music, with a streamlined interface that gives direct access to premium orchestral textures rather than sprawling menus and routing.

  The Stories are the centre of the instrument. Each of the 45 contains two different arrangements with a wide dynamic range, and each is built from 10 arranged instrument slots that can be swapped freely. Stories are fully customizable, and users can create, save and share their own alongside the included set. The instrument palette spans Strings, Brass, Woodwinds, Percussion, Synths, Guitars, Keys, Choir and world instruments such as Oud, Taikos and Ronroco.

  A JAM Station lets a composer audition Stories without external hardware: enter the Jam Station, click the preset chords, and hear how each Story sounds. Expression is shaped through mod wheel dynamics, tweakable Stories and an FX suite, and the page describes the instrument as DAW-friendly and suited to a MIDI workflow.

  Sonuscore positions the product as part of THE SCORE ecosystem, with crossgrade pricing for owners of several of its other libraries and an upgrade path to the full THE SCORE. It runs in the free KONTAKT PLAYER and the page reproduces endorsements from educators at the University of Winchester, SAE Institute Belgrade and a professor of audio engineering, reflecting the shop's EDU categorisation.
specs: |-
  - 45 expressive, flexible presets called Stories, each containing two different arrangements with a vast dynamic range
  - 10 arranged instrument slots per Story, freely swappable
  - Stories can be created, saved and shared
  - JAM Station for auditioning Stories with preset chords, no external keyboard needed
  - Mod wheel dynamics, tweakable Stories and an FX suite
  - Includes Strings, Brass, Woodwinds, Percussion, Synths, Guitars, Keys, Choir, and world instruments such as Oud, Taikos and Ronroco
  - Upgrade path to THE SCORE, plus crossgrade pricing for owners of other Sonuscore libraries
  - Works with the FREE KONTAKT PLAYER
  - Requires KONTAKT version 7.10.7 or higher
  - Apple Silicon Macs: macOS 12, 13 or 14 (latest update)
  - Intel Macs (i5 or higher): macOS 12, 13 or 14 (latest update)
  - Windows 10 or 11 (latest Service Pack), Intel Core i5 or equivalent CPU
  - Some sessions need a fast CPU and require an Intel i7 processor or higher
  - Graphics hardware support for OpenGL 2.1 or higher and Direct 3D 11.1
  - 4 GB RAM (6 GB recommended, as it is a large Kontakt instrument)
  - At least 11.7 GB of free hard disc space
