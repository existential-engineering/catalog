details: >-
  Accordions 2 - folk accordion is a virtual instrument audio plugin and
  software application for macos and windows, powered by engine player.


  Produced by eduardo tarilonte, accordions 2 is considered the first choice for
  a realistic and playable accordion library, with numerous renowned composers
  and producers praising its authenticity and expressiveness.


  With single folk accordion you get a virtual mengascini accordion from eduardo
  tarilonte's accordions 2 as a single instrument with 5 registers including
  left-handed basses, perfect for folk music.


  Features include 3 kinds of bellow shake, 3 different dynamics, 3 round
  robins, and key and button noises for ultra-realistic performances.


  This single instrument was exclusively designed for best service engine 2 and
  is therefore not compatible with the kontakt player.
