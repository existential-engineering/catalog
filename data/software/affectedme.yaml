details: |-
  AffectedME is based around a 32-step random trance-gate which syncs to the
  host. By raising or lowering the bars on the gui you can increase / decrease
  the probability of the individual steps allowing the sound through or muting
  it.

  There are also various effects which can be used to shape the sound to create
  everything from subtle movement to wild electronic bleeps and screeches.

  Affectedme by cacofx is a virtual effect audio plugin for windows. It
  functions as a VST plugin.
specs: |-
  - 32-step random trance-gate
  - Host sync
  - Probability control per step
  - Multi FX
  - Delay/echo
  - Filter
  - Gate
  - Imaging
  - Modulation (flanger/phaser/chorus/tremolo)
  - Reverb
