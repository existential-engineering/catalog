description: HoRNet VU Meter MK4 analyzes your audio and calibrates the gain automatically. Peak hold, clipping alert and 0 VU reference.
details: |-
  VU Meter MK4 shows at a glance where levels sit. Rather than requiring the engineer to adapt to the meter, it lets the meter adapt to the audio: it analyses the material in real time, auto-calibrates the gain level and displays accurate readings.

  Automatic gain calibration analyses the audio's level distribution and automatically sets the optimal level for correct gain staging. Insert it on a track, hit play, and it learns the material, with no guesswork and no endless manual adjustment.

  Peak hold indicators give visual feedback on peak levels and clipping, with a red clipping alert and a 0 VU reference, so the maximum level of a track and any digital clipping are both visible.

  The metering engine follows the VU standard with 300ms of integration time for consistent, musical readings across all material types, alongside consistent peak tracking and a digital clip indicator.

  A Reference Level control sets the target VU level for the meter to display: at -18 dB the meter shows the standard 0VU level, and the reference can be changed to match the headroom of the equipment in use. Eight assignable groups organise instances for synchronised parameter changes, and any meter can be displayed from any other meter's UI.
specs: |-
  - Real-time signal level analysis
  - Automatic gain calibration
  - Peak hold indicators and red clipping alert
  - 0 VU reference with adjustable reference level
  - VU meter standard with 300ms integration time
  - Eight assignable groups for synchronised parameter changes
  - Show any meter from any other meter UI
  - Zero latency, suitable for live tracking
  - Hardware-accelerated, scalable graphics
  - Apple Silicon native support, optimized for M1/M2/M3/M4
  - macOS 10.15+ and Windows 10+
  - Audio Units (AU), VST3 and AAX formats
  - No copy protection, only a watermark carrying the buyer's email
