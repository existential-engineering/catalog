description: HoRNet VU Meter MK4 analyzes your audio and calibrates the gain automatically. Peak hold, clipping alert and 0 VU reference.
details: |-
  VU Meter MK4 helps you identify exactly where your levels sit at a glance. Every audio source has its unique dynamic characteristics, and traditional meters leave you guessing whether the reading is accurate. Meanwhile, the material you're working on keeps changing, and you're there constantly checking and re-checking your meters.

  That's exactly why we created VU Meter MK4. After years of plugin development and thousands of hours studying how engineers actually work, we understood something fundamental: the fastest way to achieve accurate gain staging is to let the meter adapt to your audio, not the other way around. The result? A VU meter that analyzes in real-time your material, auto-calibrates the gain level, and displays accurate, trustworthy readings you can rely on.

  No more guessing whether your levels are correct. VU Meter MK4 features automatic gain calibration that analyzes your audio's level distribution and automatically sets the optimal level for correct gain staging. Just insert it on your track, hit play, and watch it learn your material.

  Visual feedback shows peak levels and clipping. You'll know exactly where your tracks has their maximum level and if you have any digital clipping. The metering engine is designed for accurate, consistent readings, ensuring consistent, musical results across all material types, using the VU meter standard with 300ms of integration time.

  Set your target Reference Level for your desired VU display, and enable 'auto' to let the plugin set the level to your desired target. At -18 dB, the meter shows standard 0VU level. Organize your VU Meter instances into groups for synchronized parameters changing: enable any 'auto' button for the whole group or for any instance, and show any meter from any other meter UI.
specs: |-
  - Platforms: macOS 10.15+, Windows 10+
