description: A free guitar amp head plugin inspired by the Orange Tiny Terror. Clean, crunch and lead tones with built-in cab sim.
details: |-
  Inspired by the Orange Tiny Terror: the low-wattage British lunchbox head that proved you don't need a full stack and a wall of knobs to sound huge, just a great tube circuit and the good sense to keep it simple. The Cypress TT-15 is a free guitar amp head plugin that meticulously models a versatile, uniquely voiced low-wattage amplifier, its pre-amp and power-amp tube stages, tone filter and output transformer, as a living circuit rather than a snapshot of one setting. Six controls, no menu-diving, and a switchable speaker cabinet simulation baked in.

  The amp that inspired the Cypress TT-15 built its reputation on a switch most of its rivals didn't have: a power selector that drops from 15 watts down to 7. Fewer watts means the power section clips sooner and harder, giving a saturated, singing breakup at bedroom-friendly levels instead of only at high volume. This behavior is captured with real-time, SPICE-style circuit simulation, so the amp reacts to picking dynamics and the guitar's volume knob the way a real tube head does.

  Starting with Gain low gives open, glassy clean tones with plenty of headroom. Pushing it thickens the pre-amp into crunch, and running it flat out tips the head into heavy, biting distortion that keeps its note definition. The Tone control is a single roll-off filter, counter-clockwise for a darker, warmer voice and clockwise to brighten. The Volume knob drives the power-amp stage into a gentle overdrive of its own, so the amp's final character comes from balancing Gain against Volume, exactly like on the hardware. A clip lamp on the panel lights up as the output level climbs.

  Dropping the Cypress TT-15 on a DI guitar track and switching the Cabinet section in gives an instant, mix-ready tone with no impulse-response hunting required. The cabinet can be bypassed for an external cab sim or power-amp and speaker rig. It works as an easy first amp for building a rig, a reliable scratch tone while tracking, and a keeper for crunch and lead parts.
