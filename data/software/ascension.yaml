details: >-
  Ascension is a pc & mac compatible 64-bit workstation synth. Awarded 4/5 stars
  by computer music magazine (issue cm259). With 4 powerful, fm enabled
  oscillators you can choose any mixture of subtractive, wavetable synthesis and
  a huge 6 gb rom sound library. You'll also get over 1300 ready-to-go presets
  along with over 1600 oscillator waveforms and 3400 MIDI loops.


  November 2024 update: version 1.6.1 out now. Free download for registered
  users. The synth also includes a multi-fx unit with 'drag n drop' signal
  processing chain, an arpeggiator with MIDI loop player (with 'drag and drop'
  support straight in to your DAW) along with a collection of over 1700
  dancefloor ready royalty-free MIDI loops and much more.


  Ascension by dance MIDI samples / cubicaudio is a virtual instrument audio
  plugin for macos and windows. It functions as an audio units plugin and a VST
  3 plugin. Vst3 - 64-bit plugin-in only. 32-bit bridging software not
  supported. Windows 10 or higher. Modern processor with 16 gb ram or more
  recommended. 10 gb free disk space. Os x 10.15 or higher. Compatible with
  intel based big sur and m1 based mac os 11+ natively.


  Dms ascension excels in the generation of sounds like lead, synth-bass, pad,
  soundscapes, guitar, piano and arpeggio sequences, it is an adequate solution
  for a wide range of musical styles. Dms ascension scores at something many
  products from renowned software manufacturers currently miss: an
  uncompromising good sound and an amazing ease on system resources.


  Hi, I have to admit it's a very good plug-in tool with a very nice and rough
  sound. Clear and easy to work with. Really a lot of sounds for edm and pop
  music. MIDI pattern freely transferable to your DAW software.
specs: |-
  - 64-bit vst3 plugin
  - Audio units plugin
  - 4 fm enabled oscillators
  - Subtractive synthesis
  - Wavetable synthesis
  - 6 gb rom sound library
  - Over 1300 presets
  - Over 1600 oscillator waveforms
  - 3400 MIDI loops
  - Multi-fx unit with drag n drop signal processing chain
  - Arpeggiator with MIDI loop player
  - Over 1700 dancefloor ready royalty-free MIDI loops
  - 3 oscillator types (subtractive, waveform, rom)
  - High shelf and low shelf filters for each oscillator
  - Frequency modulation controls for each oscillator type
  - Pitch detune for each oscillator with unison voices and width control
  - Waveform generator and editor for oscillators and lfos
  - Waveform import
  - 2 arpeggiator types (MIDI player mode with 3400 loops and internally
  controlled)
  - Arpeggiator velocity as modulation source
  - Preset, oscillator & MIDI library browsers
  - 16 filter types (lowpass, highpass, bandpass, formant)
  - Asdr amplitude and filter envelopes
  - Four auxiliary modulation envelopes
  - 32 modulation matrix destinations
  - 2 lfos with 4 waveforms and custom waveform mode
  - 6 fx units with configurable signal chain
  - 4 skin options plus user mod capabilities
  - Windows 10 or higher
  - Os x 10.15 or higher
  - Modern processor with 16 gb ram recommended
  - 10 gb free disk space
  - Intel based big sur and m1 based mac os 11+ native compatibility
  - Universal 2 binary
