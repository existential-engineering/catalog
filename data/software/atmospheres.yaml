details: |-
  An ethereal, desirous collection of tuned field recordings. Complex &
  comforting reconditioned environmental recordings with unpredictable, deeply
  textured & transportive layers of sound. Each note triggers tuned recordings,
  where the frequency for each key has been accentuated in sympathy amongst a
  bed of sonic material.

  Savor fluctuating timbres that meld together, forming a warming & resinous
  acoustic experience.

  Atmospheres was captured in a series of divergent locations; birdsong, forest
  ambience, rainfall & thunderstorms are featured within this stirring curation.
  Enjoy an intriguing instrument, with a hint of eccentricity.

  Atmospheres by organic instruments is a virtual instrument audio plugin and a
  software application and soundware (samples or presets that load into other
  products) for macos and windows. It includes, and is therefore "powered by",
  elemental player, which functions as an audio units plugin, a VST 3 plugin, an
  AAX plugin and a standalone application.
