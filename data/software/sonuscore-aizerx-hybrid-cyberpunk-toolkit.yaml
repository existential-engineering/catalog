description: AizerX Hybrid Cyberpunk Toolkit offers the signature sound randomizing feature, delivers a deep library of samples from classic braams, trailer hits, signals, alarms to screaming resonators and distortions. Centered around tempo-synced drum loops, hybrid pulses, and stems, it enables composers to build energetic, dynamic patterns with multi-sampled playable basses, leads, plucks, and artist stems from established trailer composers.
details: |-
  AizerX Hybrid Cyberpunk Toolkit is the latest addition to the Keepforest's successful AizerX series. Inspired by the atmosphere of the cyberpunk world, this library offers a lot of character and personality with a cinematic futuristic vibe that captures the philosophy of the genre. As a powered-by-AizerX-engine tool for composers and sound designers, it simplifies the sound design process and opens up new possibilities for creative ideas.

  The centerpiece of the AizerX Hybrid Cyberpunk Toolkit is a selection of tempo-synced drum loops, hybrid pulses, and stems of different categories. You can create variations of energetic, dynamic drum and pulse patterns at different tempos, varying among themselves and combining individual sound layers.

  A collection of multi-sampled playable basses, leads, plucks, pulses and signals is also a main feature of the library.

  In collaboration with various artists established in the movie trailer industry, the library includes a special Artist Stems category containing stems and cues made by those artists, so elements, structures and techniques from experienced composers can be borrowed directly.
specs: |-
  - Requires the FULL VERSION of Native Instruments' KONTAKT version 5.8.0 or higher (not compatible with the free Kontakt Player, which runs the instrument in DEMO mode only)
  - Samples in .WAV format, 48kHz (96kHz) / 24bit
  - Powerful sound design engine with over 50k lines of code
  - Playable instruments: 18 basses, 10 braams, 13 leads, 4 pads, 8 plucks, 18 pulses, 5 signals
  - Pulses, stems and loops: 16 artist stems, 11 cyberpunk stems, 10 drum stems, 20 full hybrid pulse stems, 20 low classic pulses, 28 cyberpunk pulses, 101 hybrid low pulses, 65 hybrid mid pulses, 24 hybrid high pulses, 12 hybrid motion pulses, 73 elements & layers, 323 hybrid pulses, 133 trailer drum loops, 46 tonal loops, 382 global layers
  - Sound FX: 85 trailer hits, 41 wild resonators & benders, 38 distortions, 62 braams, 58 downers, 31 benders, 33 tonal & ambience, 22 signals, 12 alarms, 13 reversed FXs, 28 kicks, 17 boom hits
  - 819 AizerX engine presets by Keepforest
