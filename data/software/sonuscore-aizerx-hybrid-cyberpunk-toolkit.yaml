description: AizerX Hybrid Cyberpunk Toolkit offers the signature sound randomizing feature, delivers a deep library of samples from classic braams, trailer hits, signals, alarms to screaming resonators and distortions. Centered around tempo-synced drum loops, hybrid pulses, and stems, it enables composers to build energetic, dynamic patterns with multi-sampled playable basses, leads, plucks, and artist stems from established trailer composers.
specs: |-
  - Requires full version of Native Instruments Kontakt 5.8.0 or higher
  - Not compatible with free Kontakt Player
  - WAV format, 48kHz (96kHz available) / 24-bit
  - Over 50,000 lines of code
  - Playable instruments: 18 basses, 10 braams, 13 leads, 4 pads, 8 plucks, 18 pulses, 5 signals
  - Pulses, stems & loops: 323 hybrid pulses, 133 trailer drum loops, 46 tonal loops, 16 artist stems, 11 cyberpunk stems, 10 drum stems, 20 full hybrid pulse stems, 20 low classic pulses, 28 cyberpunk pulses, 101 hybrid low pulses, 65 hybrid mid pulses, 24 hybrid high pulses, 12 hybrid motion pulses, 73 elements & layers
  - Sound FX: 382 global layers, 85 trailer hits, 41 wild resonators & benders, 38 distortions, 62 braams, 58 downers, 31 benders, 33 tonal & ambience, 22 signals, 12 alarms, 13 reversed FXs, 28 kicks, 17 boom hits
  - 819 AizerX engine presets by Keepforest
