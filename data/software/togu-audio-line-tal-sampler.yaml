description: TAL-Sampler is a full-featured analog modeled synthesizer with a sampler engine as sound source, including a powerful modulation matrix and high quality self-oscillating filters. Features vintage DAC modes (Emu II, AM6070, S1000, Sample Hold, Linear, Clean), variable sample rate, four sample layers, three AHDSR envelopes, three LFOs, high quality effects, self-resonating zero feedback delay filter, SFZ/SF2 import, and microtuning support.
details: |-
  TAL-Sampler is not just a sample player. It's a full featured analog modeled synthesizer with a sampler engine as sound source, including a powerful modulation matrix and high quality self-oscillating filters.

  Don't expect a 40GB piano sample library with samples for every velocity or something similar. The idea is to bring back the fun sampling was in the good old times with small samples, fast loading times and an intuitive work-flow to create your own sample presets without getting lost in the settings.

  It's possible to choose between different digital analog converters (DAC's) to get the vintage sound of different hardware samplers inside your DAW. There is no cheap bit crushing or decimation on the output signal. The sample is really down-sampled to the desired sampling frequency, then the data is processed depending on the chosen DAC and up-sampled to the desired pitch. Most DAC modes offer a LEVEL slider. This feature allows the user to reduce the volume of the recorded sample and decreases the sample quality. Load your favorite high quality sample and make it sound vintage and noisy. The 24dB low pass filter will like it!

  The plug-in has four layers an can play four samples simultaneous. There is also a simple SFZ import for samples that imports the mapping and sample paths, but the plug-in also contains an easy to use mapping editor.

  TAL-Sampler is available in the VST, VST3, Audio Unit, AAX and CLAP plug-in formats. You can load and play your own samples in every common sample format (*.wav, *.aiff, *.aif, *.mp3, *.ogg, *.flac). Import samples with drag & drop from finder or explorer. There is also an intuitive sample browser that helps to find samples fast. Some nice additions like a vintage real-time time stretcher and the possibility to modulate the sample loop positions.
specs: |-
  - Vintage DAC modes (Emu II, AM6070, S1000, Sample Hold, Linear, Clean).
  - Steep 96dB low-pass reconstruction filter (Emu II and AM6070 F).
  - Variable sample rate.
  - Powerful MOD-Matrix.
  - Four sample layers.
  - Three AHDSR envelopes with vintage Digital / RC mode.
  - Three LFO's (Triangle, Saw, Rectangle, Random, Noise).
  - High Quality effects (Reverb, EQ, Delay).
  - Self resonating zero feedback delay filter (24/12/6 dB LP, HP, BP, AP, Notch).
  - Wide range of audio formats supported (*.wav, *.aiff, *.aif, *.mp3, *.ogg, *.flac).
  - Scalable high resolution user interface.
  - The possibility to change font and background colour.
  - Fast sample and preset loading.
  - Load SFZ presets (mappings and samples up to 4 layers).
  - SF2 sample import (mappings and samples up to 4 layers).
  - Microtuning support (tun file import and MTS Client).
  - More than 100 presets available as download.
  - Windows requirement: Windows 10 or higher (64 bit host).
  - macOS requirement: 10.11 or higher (64 bit host). Universal Binary 2 with native Intel and Apple silicon support (M1, M2, M3...).
  - AAX requirement: Pro Tools 10.3.6 or higher (64 bit).
  - Linux requirement: 64 bit / Ubuntu 18 or similar.
  - Demo restriction: the plug-in produces a rising white noise sound every minute.
