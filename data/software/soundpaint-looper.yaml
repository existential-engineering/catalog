details: |-
  Vintage Recording Studio Inside Soundpaint

  Ask yourself this question: "What do all the greatest hits of all time have in common?"

  They were recorded with analog means. Everything was recorded to tape. Everything was played. Had to be felt. No prompting. No grid. I think we lost some of that with modern technology. All the million overengineered solutions for problems we never had in the first place. Does music really belong on a static grid or inside a soulless algorithm? The difference between a drum machine and a fantastic drummer is the groove. What is groove? Groove is perfect imperfection. To me. The real joy of music is being in the creative flow state. A place where the music isn't interrupted. But rather feels like I am jamming with my favorite band. I am in control. Everything is real-time. I am inside the music. Meet the Looper:

  The Looper is designed for those of us who want to stay in the creative flow at all times. An environment designed for happy accidents. Mess around. The sudden moment where it all clicks. The slight drift. The honest take. The moment was captured instead of corrected. Music made by hands, not prompts. If that's how you hear music, the Looper was built for you. Looper lets you record and layer anything - as many times as you want it. You can record all your instruments in Soundpaint. Import any loop you want, just drag it straight in. But Looper also let's you record the output of your computer. Record any microphone. Even your webcam, which can sound like a million dollars in Soundpaint. At its heart sit five Looper Pods. Each one can synchronize with the others or run free and independent. Layer them. Stack them. Let them drift. A micro DAW that feels like a vintage studio with tape machines. Designed by composers for composers. Built on a single mantra: the shortest distance between thought and creation. - - - - - - - - - -

  Important disclaimer:

  Looper is $69 on pre-order. Price goes to $99 when Soundpaint V is released. Never on sale again. Looper is currently in BETA. Coming Summer 2026. - - - - - - - - - -
