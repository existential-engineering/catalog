details: |-
  One Hall. 5 Cimbaloms

  The Cimbalom is a type of dulcimer that is common in the folk music of Central and Eastern Europe. Bring 5 of those into a beautiful concert hall and you have a recipe for a captivating, exotic sound ensemble with an epic and dramatic sound that is sure to inspire! Cimbaloms can sound harsh or mysterious, so we recorded all kinds of strikes and plucks including sustains, soft and hard staccatos, snap/Barok pizz, looser strums, 4 varieties of tremolo, and more. The ensemble is great for creating tension and light atmosphere alike! With 3 microphone perspectives (close, decca, wide), the range of colors in the ensemble is massive. The sounds of the Cimbalom Ensemble are, for lack of a better word, awesome! It can stand on its own with its distinct timbre, support other instruments with a sharp attack, or even become an ethereal, prickly pad. We fell in love with the sound instantly, and we think you will too.
