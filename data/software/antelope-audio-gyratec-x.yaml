details: |-
  Gyratec X carries the might of a true tube stereo compressor. Widely recognized for its speed, and featuring technology used in early limiters like the coveted Fairchild 670, this Vari-Mu beast from Gyraf Audio comes alive in the Synergy Core domain.

  Thanks to its smooth high-pass filtering, it allows hard compression of the low end without dirtying up the sound. The Gyratec X is perfect for using along with other types of compressors and the growing list of vintage effects processors.

  Antelope Audio is proud to be the first to offer a Synergy Core recreation of this unit, originally designed by Gyraf Audio.

  Runs natively in your DAW on macOS or Windows, or in real-time on a Synergy Core interface.
specs: |-
  - Stereo Vari-Mu tube compressor emulation of a Gyraf Audio unit
  - Technology inspired by early limiters such as the Fairchild 670
  - Smooth high-pass filtering for hard low-end compression without dirtying the sound
  - Runs natively in your DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core interfaces
  - Apple Silicon supported natively (no Rosetta required)
  - Free iLok account required for Native Plugin license management
