details: |-
  8 bit generator is a library of alden nulden productions for native instruments kontakt 5. It is suitable for music composition for arcade games, 8 bit music, lofi, glitch, electronica, chiptune, retro games etc.

  Bit generator is an analog synthesizer. It has three oscillators with each containing eight waveforms. It has an adsr separately for amp, filter and pitch, separate for each oscillator or synchronized.

  It also has seven different filters, five lfo waveforms in both amp, filter and pitch. Including an arpeggiator, selection at how many bits synth will work. There are poly, mono, legato, portamento, auto chord functions with eight different effects.

  As well as 392 samples at 16-bit and 44100hz. 8 bit generator has 160 presets which are split into seven categories to quickly select the sound that suits you.

  Also, an init instrument is available, enabling you to make your own sound and save it as well. 8 bit generator requires the full version of kontakt (5.5.2 and above).
specs: |-
  - Three oscillators with eight waveforms each
  - Adsr for amp, filter, and pitch
  - Seven different filters
  - Five lfo waveforms in amp, filter, and pitch
  - Arpeggiator
  - Bit depth selection
  - Poly, mono, legato, portamento, auto chord functions
  - Eight different effects
  - 392 samples at 16-bit and 44100hz
  - 160 presets in seven categories
  - Init instrument for custom sound creation
  - Requires kontakt 5.5.2 and above
