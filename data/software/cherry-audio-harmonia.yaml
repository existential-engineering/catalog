details: |-
  Harmonia is an innovative virtual instrument from Cherry Audio, designed to easily create rich, evolving polyphonic tones through its intuitive visual interface. The magic behind Harmonia lies in its two sample-based oscillators that can simultaneously produce up to eight pitches, individually tuned to a harmonic series or semitones.

  Harmonia derives its distinctive organic sound from hundreds of sampled waveforms recorded from various synthesizers, traditional instruments and voices, colorful lo-fi sounds, and more. With 285 waveforms across 11 categories plus user-imported sample support, the sonic possibilities are vast.

  The synthesizer features a stereo multimode filter with seven filter types, a modulation matrix with eight slots offering 19 sources and 80 destinations, and four tempo-syncable polyphonic LFOs with ten waveforms. Click-and-drag ADSR envelopes provide intuitive control over filter and amplifier shaping.

  Harmonia includes 17 integrated studio-quality effects and over 350 professionally designed presets across 16 categories, making it immediately useful for a wide range of musical styles.
specs: |-
  - Dual sample-based interpolated scanning harmonic oscillators
  - 285 waveforms in 11 categories plus user-imported sample support
  - Monophonic and polyphonic voice modes up to 16 voices
  - Four tempo-syncable polyphonic LFOs with ten waveforms
  - Stereo multimode filter with seven filter types
  - Modulation matrix with eight slots, 19 sources, 80 destinations
  - Click-and-drag filter and amp ADSR envelopes
  - 17 integrated studio-quality effects
  - Over 350 presets in 16 categories
  - Full MIDI control and DAW automation
