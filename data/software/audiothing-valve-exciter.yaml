details: |-
  Valve Exciter is a Harmonic Enhancer plugin with vintage valve emulation.

  The exciter section features hand tuned filters with the ability to sweep the center frequencies via the Harmonics knob.

  The valve section is modelled after a softer custom version of the vintage Telefunken ECC83 tubes, with drive, triode/pentode mode and bias settings.
specs: |-
  - Harmonics Enhancer: Bass and Treble (with Harmonics sweep)
  - Valve Emulation with drive
  - Lightweight on CPU
  - Preset system with randomizer
  - Windows XP SP2, 7, 8, 10 (32/64 bit), Intel Core 2 Duo or AMD Athlon 64 X2, 4 GB RAM (VST2 or AAX, 32-bit or 64-bit host)
  - OS X 10.7 - macOS 10.13, Intel Core 2 Duo, 2 GB RAM (VST2, AU, or AAX, 32-bit or 64-bit host)
