  recognized as the most versatile bass virtual instrument available.
details: |-
  Trilian is the Total Bass Module that brings many different types of bass together into one extraordinary-sounding virtual instrument. It has long been recognized as the most versatile bass virtual instrument available and has become an essential tool for serious producers.

  The 34GB library is 10 times the size of Spectrasonics' original Trilogy bass instrument and features all new acoustic, electric, and synth basses. Over 60 different 4, 5, 6, and 8-string electric basses are presented in fingered, picked, fretless, slapped, tapped, and muted technique variations.

  The stunning acoustic bass is one of the most detailed instruments available, with richly detailed bass tones suitable for any production style. The comprehensive design covers everything from traditional bass sounds to cutting-edge synthesis for creating custom tones.

  Includes bonus classic Bass Legends sounds featuring legendary bassists Abraham Laboriel, Marcus Miller, and John Patitucci. Trilian integrates seamlessly with Omnisphere for extended synthesis capabilities.
specs: |-
  - 34GB library, 10 times the size of original Trilogy
  - Over 60 different bass instruments (4, 5, 6, and 8-string)
  - Multiple techniques: fingered, picked, fretless, slapped, tapped, muted
  - Comprehensive acoustic, electric, and synth bass collection
  - Highly detailed acoustic bass recordings
  - Includes bonus Bass Legends sounds (Abe Laboriel, Marcus Miller, John Patitucci)
  - Integrates with Omnisphere for extended synthesis
  - 64-bit native on both Mac and Windows
