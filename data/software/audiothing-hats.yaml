description: "Hats is a drum synthesizer plugin dedicated to hi hats and cymbals
  sounds with two independent sources: synthesized noise and sample section."
details: |-
  Hats is a drum synthesizer plugin dedicated to hi hats and cymbals sounds. It features two independent sources: synthesized noise and a sample section. Instead of generic white or pink noise, the noise section features 6 square wave oscillators with different pitches and phases, like the famous TR808, giving a noise sound with a controllable metallic character.

  The factory bank comes with more than 50 samples, ranging from rare analog drum machines to real acoustic hi hats and cymbals. Some of the samples were also processed with a classic Aphex Aural Exciter and recorded to tape with a vintage Revox B77 MkII.

  Both sources can then be processed with 4 effects: Ring Modulator, Bit Crusher, Filter, and Reverb. The effects can be arranged in any order with a simple drag and drop. The filter section features a HighPass and BandPass in series, both 12dB/oct.

  Hats is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP).
specs: |-
  - Two Sources: synthesized noise and custom sample
  - 55 Samples / 80 Presets
  - Ring Modulator, Bit Crusher, Reverb, Filter (SVF/ZDF)
  - Preset system with randomizer
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP 64-bit)
  - OS X 10.9 - macOS 14, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP 64-bit)
  - 1 license up to 3 computers, no iLok, no internet connection required to activate
