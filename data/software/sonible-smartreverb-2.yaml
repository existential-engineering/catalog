description: smart:reverb 2 is a content-aware reverb plug-in that analyzes the
  incoming signal and builds a tailor-made reverb response fitted to the
  spectral and temporal context of the sound. It is designed to work across
  single tracks and entire mixes, with cross-channel processing between
  instances for coherent depth staging.
details: |-
  smart:reverb 2 is a content-aware reverb that shapes itself around the sound it is fed. Whether the goal is subtle space or immersive depth, the plug-in is built around clarity, control and creative freedom, and it understands single tracks and entire mixes alike so the reverb environment that was imagined is the one that gets built.

  Built for your audio, not just any audio: with intelligent processing, smart:reverb 2 analyzes the input signal and builds a tailor-made reverb response that fits naturally within the sound's spectral and temporal context, enhancing the sound without adding new problems like masking or cluttering. This intelligent reverb plug-in is also designed for use on multiple tracks within a project. With different smart:reverb instances in the same group, the cross-channel processing manages overlapping frequencies for a spatially coherent and uncluttered mix.

  Command the virtual sound stage: smart:reverb 2 understands acoustic perception, and makes it controllable. Dial in the perception-based Distance parameter and simply move a sound source forward or back in space, and smart:reverb 2 automatically adjusts the reverb to match. In Group mode, this makes depth staging more intuitive, since multiple sources can be positioned by dragging any track to its designated spot, all within a single plug-in instance.

  Style your space: each space is tailored to the material, clean, dynamic and tonally matched. The AI-powered processing works with the spectral characteristics of the input audio to deliver a space that does not sound harsh or overcooked, and resonates in all the right places. A powerful but simple visual reverb matrix is the sound-shaping surface, navigating between Room, Hall, Spring and Plate styles, with Width and Color controls to fine-tune the response for natural realism or creative flair.
specs: |-
  - Cross-channel processing for mix clarity and depth staging between multiple instances
  - Improved sound processing and Reverb Matrix with new styles: Room, Hall, Spring and Plate
  - Perception-based parameters like Size, Width and Distance, combining common parameters into more intuitive controls
  - Streamlined interface and inter-plugin communication for smoother workflows
  - Easy depth staging across multiple tracks with single-instance control (Group mode)
  - AI-processing for custom-tailored reverb
  - Width and Color controls for fine-tuning the reverb response
