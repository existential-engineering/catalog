description: smart:reverb 2 is a content-aware reverb plug-in that analyzes the
  incoming signal and builds a tailor-made reverb response fitted to the
  spectral and temporal context of the sound. It is designed to work across
  single tracks and entire mixes, with cross-channel processing between
  instances for coherent depth staging.
details: |-
  Intelligent processing examines the input signal and shapes a reverb response around it, so the space enhances the source instead of introducing masking or clutter. The plug-in is built for use on many tracks in a project: instances placed in the same group communicate, and the cross-channel processing manages overlapping frequencies to keep the mix spatially coherent and uncluttered.

  Perception-based controls turn acoustic perception into something adjustable. The Distance parameter moves a sound source forward or back in space and the reverb adapts to match, while Size and Width combine familiar reverb parameters into more intuitive controls. In Group mode, several sources can be positioned by dragging each track to its spot, all from a single plug-in instance, which makes depth staging across a session a single-window task.

  A visual reverb matrix is the main sound-shaping surface. It allows browsing between Room, Hall, Spring and Plate styles, with Width and Color controls to fine-tune the response. Because the AI-powered processing works with the spectral characteristics of the input audio, the resulting space stays clean and tonally matched rather than harsh or overcooked.

  The second generation adds cross-channel processing for mix clarity and depth staging between instances, improved sound processing with the new reverb matrix styles, the perception-based parameter set, and a streamlined interface with inter-plugin communication. Authorization is machine-based or via iLok, and Apple Silicon is supported natively.
specs: |-
  - Content-aware, AI-based processing that tailors the reverb response to the input signal
  - Cross-channel processing between instances in the same group for mix clarity
  - Depth staging of multiple sources from a single plug-in instance in Group mode
  - Visual reverb matrix for browsing between Room, Hall, Spring and Plate styles
  - Perception-based parameters including Size, Width and Distance
  - Width and Color controls for fine-tuning the reverb response
  - Streamlined interface with inter-plugin communication
  - Plug-in formats (Mac): VST, VST3, AU, AAX
  - Plug-in formats (Windows): VST, VST3, AAX
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok
  - Apple Silicon support: native
  - Windows: Windows 10 (64 bit)
  - macOS: 10.14 or later
  - RAM: 4 GB
  - CPU: Intel Core (i5) or Apple Silicon
  - GPU: OpenGL version 3.2 or later
