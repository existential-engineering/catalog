details: |-
  Your amp manager for positive grid bias amps. If you are as addicted as we are
  on positivegrid tones, you probably wish there'd be a way to organise the tons
  of great amps you've downloaded from tonecloud. There is. With Ampl4, import
  amps from your positivegrid apps, manage and organise them in collections,
  export them back in seconds.

  Import: import bias amps from compatible positivegrid apps (bias amp
  mobile/desktop, bias fx mobile/desktop, jamup).

  Manage your amps: tired of the vague amps naming? Want to learn more about
  legendary amps? Start creating your own ampcyclopedia. Rename your amps using
  their real names, add descriptions and working notes, find duplicates in your
  collection and more.

  Manage your collections: drag amps from one collection to another. Create
  collections by style, brand, years, features, etc.

  Export: pick a collection and export it back in few clicks to bias amp desktop
  or your ipad/iphone apps (bias amp, bias fx, jamup, etc.).
specs: |-
  - Preset browser
  - Manager application
  - macOS compatible
  - Import from positivegrid apps
  - Amp management and organization
  - Collection management
  - Export functionality
