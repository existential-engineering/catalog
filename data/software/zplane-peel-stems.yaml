description: Real-time stem separation plugin for splitting stems in your DAW. Isolate instruments or vocals – and remix, rebalance or remove stems in already mixed audio. All in real-time.
details: |-
  PEEL STEMS is a real-time audio stem separation plugin that lets users split mixed audio into four stems — Drums, Bass, Vocals, and Other — directly inside their DAW. It is powered by zplane's STEMS EFFICIENT technology and optimized for low-latency real-time processing.

  Insert PEEL STEMS on any track and work creatively with mixed audio as though you have access to separate instrumental tracks. The plugin requires read-ahead processing for audio separation, introducing approximately 480ms of latency, which most DAWs automatically compensate for.

  The plugin features a Soundfield Display that provides visual stem identification with color coding and frequency/stereo-field visualization, helping users understand the content of each separated stem at a glance.

  PEEL STEMS supports four core use cases: Remove (deactivate stems to isolate or eliminate specific elements), Rebalance (adjust stem volume with visual feedback), Remix (solo or mute stems for live performance drops), and Refine (use Focus EQ for spectral isolation with invert capability).

  Secondary output routing to external processing is supported in select DAWs including Ableton Live, FL Studio, Pro Tools, Reason, and Reaper.
specs: |-
  - Four stem categories: Drums, Bass, Vocals, Other
  - Soundfield Display with color coding and frequency/stereo-field visualization
  - Focus EQ spectral isolation tool with invert capability
  - Stem mute, solo, and rebalance controls
  - Dual-output routing supported in Ableton Live, FL Studio, Pro Tools, Reason, and Reaper
  - Processing latency: approximately 480ms (auto-compensated in most DAWs)
  - Powered by zplane STEMS EFFICIENT technology
  - Recommended CPU: Apple Silicon M1 or higher
