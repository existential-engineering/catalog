details: >-
  Alchemist is a powerful kontakt engine to create deep and complex cinematic
  sounds. The first two kontakt libraries to be released are alchemist cinematic
  textures and alchemist cinematic impacts. Each instrument is composed of six
  layers. The libraries feature several gb of sample material, giving you a lot
  of combinations and sound colors.


  Alchemist engine is divided into four sections: main, color, motion and
  effects.


  Main engine: individual layer controls for pitch, volume, pan, solo, mute,
  effects bypass, layer lock, envelope, layer boost and cut, pan and amp lfo
  send.


  Motion engine: arpeggiator, pan and amp lfo. Color engine: 65 convolution
  impulse responses, randomize function. Effect engine: skreamer, lo-fi, chorus,
  tape saturation, delay, chorus and distortion (controlled by the modulation
  wheel). Powerful randomize function.


  Requires full retail version (sold separately) of kontakt 5.5.1. This library
  is not supported by the free kontakt player.
specs: |-
