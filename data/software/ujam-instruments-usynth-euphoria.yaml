description: Usynth Euphoria makes it faster than ever to create driving and lyrical EDM sounds. With ready-made sequences and custom Finisher FX chains the next dance floor banger is fair game.
details: |-
  Usynth Euphoria makes it faster than ever to create driving and lyrical EDM sounds. Skip the operation manual and get straight to the point. With ready-made sequences and custom Finisher FX chains the next dance floor banger is fair game.

  From bombastic stadium crowd-pleasers to subtle minimal sophistication, EUPHORIA is the right tool for the job.

  Usynth's all-new browser adds a lot of flexibility to the browsing experience. While in the Browser, you can click Title icons to switch between Usynth Titles, all while your last state before entering the browser is retained. If you switch a Title and load the preset afterwards, Usynth will switch to the new Title interruption-free, and you can preview presets of Titles that you do not own yet.

  Set the Sequencer's note rate relative to your host's tempo. Turning the knob up gradually steps up the rate, and the in-between note resolution values are shown below the knob as you turn it.
specs: |-
  - Chords, arpeggios, risers and leads
  - Fully customizable Sequencer
  - 2 individual layers per note
  - Custom Finisher featuring 90 presets
  - UJAM App integrated
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8GB of RAM
  - 0.26GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: AAX, AU 2, VST 2 and VST 3, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Requires the latest version of the UJAM App, which installs the Usynth plug-in that hosts all titles
