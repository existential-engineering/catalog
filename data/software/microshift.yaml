description: Stereo widening plugin using pitch shifting and time-varying delay
  based on classic hardware units like the Eventide H3000 and AMS DMX 15-80s.
  Includes Little MicroShift.
details: |-
  MicroShift is designed to create super wide vocals and instruments through a combination of pitch shifting and time-varying delay. The plugin offers three different widening flavors based on classic hardware units like the Eventide H3000 and AMS DMX 15-80s.

  The plugin features detune control for adjusting micro pitch shifting amount, delay control for time-varying delay characteristics, and a focus control to sculpt away muddy low and mid frequencies. The hardware-modeled design captures saturation and deglitching algorithms from the original units.

  MicroShift excels at background vocal blending and widening, lead guitar enhancement, synth thickening, and general instrument width expansion. The plugin includes Little MicroShift, a simplified three-button, one-knob version with a streamlined interface.
specs: |-
  - Three selectable widening algorithms
  - Detune control for micro pitch shifting adjustment
  - Delay control for time-varying delay characteristics
  - Focus control for frequency sculpting
  - Hardware-modeled saturation and deglitching
  - Includes Little MicroShift mini version
  - 64-bit only, sample rates 44.1 kHz to 192 kHz
  - Apple Silicon compatible
