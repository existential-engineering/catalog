details: |-
  Amped roots 2.0 is made in collaboration with ryan "fluff" bruce and the sims featured are the best amps from fluff's personal collection. This plugin runs ml sound lab's vorna amp modeling, indistinguishable from real tube amplifiers.

  The amped roots 2.0 cab section features mega oversize, freeman v30 and freeman m25 speakers. Choose from 4 mics and move them from the middle to the edge of the speaker, front or back and even angle mics. The cab section allows you to also load in irs. Also when you buy a full license you will get fluff's personal guitar cabinet as a loadable ml ir.

  Amped roots 2.0 features a pedalboard with high quality effects pedals and studio effects. Included pedals: noise gate, compressor, drive pedal, chorus, analog delay, reverb.

  Amped roots 2.0 comes with a standalone program that is MIDI controllable and stage ready.

  The latest amped platform includes a reliable and precise guitar tuner section.
