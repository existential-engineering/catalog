details: |-
  Beatmaker Vice is a virtual drum machine plugin inspired by legendary classic
  drum machines from companies like linn, Roland, simmons and Korg. It delivers
  drum sounds and patterns for 1980s, synthwave, retrowave, and futuresynth
  music production, featuring authentic 80s vibes with pristine 21st century
  sound quality.

  The time machine special control lets drum tracks travel in time from the
  sound of 80s tape recording and early sampling artifacts to a full and heavily
  pumping future of an imaginary year 2080. Micro timing lets you control the
  speed and timing of your beats, dialing in the tempo of your host from half to
  normal to double speed.

  Vice features 10 separate kits built from legendary analog drum machines, each
  with two different kick samples, two snares and various other percussion
  sounds. The plugin includes over 1000 patterns arranged in preset groups with
  intros, verse patterns, chorus patterns, fills and outros spread over two
  octaves of keys.

  Individual instrument controls allow editing and controlling the volume,
  decay, pitch and filter of individual instruments per drum kit. Four macro
  sliders on the left side alter the balance between kick and snare and how much
  the kick pumps (compression), while sliders on the right control effects mix
  and intensity.

  MIDI drag and drop functionality allows exporting patterns to your DAW by
  simply dragging them from the on-screen keyboard and dropping them into your
  track. The plugin offers either a single output or multi-out option with a
  separate mixer channel for each sample.
