description: HoRNet CLMS are two plugins designed to let you monitor and tweak your effects while keeping perceived loudness constant
details: |-
  As is widely known the human ear perceive each frequency differently at different loudness levels, this effect may lead to misjudgement while taking decision in mastering and mixing.

  When using any effect like an equaliser or a compressor the level of the affected signal may change significantly and this variance may let you take wrong mixing decisions.

  CLMS is based around the concept of LU (Loudness Units) and it’s actually two different plugins, one is called HoRNetCLMS_Send (used to “read” the LU level of the track before processing) and the other one, called HoRNetCLMS_Receive that is usually set as the las plugin of the master chain and has the duty to apply the necessary gain to keep everything at the sender’s level.

  CLMS inner working is quite easy, the HoRNetCLMS_Send reads the LU level of the track and stores it in a common memory area, then HoRNetCLMS_Receive reads that area, compute the differences between its input LU level and the one recorded by HoRNetCLMS_Send, and applies the necessary gain to keep the output level at the same LU amount of the one recorded by HoRNetCLMS_Send.
specs: |-
  - Continuous monitoring of perceived loudness
  - As many HoRNetCLMS_Send as you desire
  - Real time loudness adjustment
  - Loudness display on both sender and receiver
  - Loudness normalization to the requested level
  - macOS (10.11 and later) and Windows (vista and later) support.
  - 64-bit only both on Mac and Windows.
  - Apple Silicon M1 native
  - Audio Units, VST, VST3 and AAX format.
