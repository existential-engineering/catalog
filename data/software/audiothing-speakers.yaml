description: Speakerphone alternative without iLok, a speakers and microphones
  simulation with distortion / degradation effect plugin.
details: |-
  Speakers is a plugin effect designed to emulate a wide range of loudspeakers and microphones using AudioThing's state-of-the-art convolution engine. Shape any sound like it's being played by an old telephone, radio, or classic cabinet, or like it's being recorded by a vintage ribbon microphone or even a toy recorder.

  Speakers features a freely configurable effects chain, comprising compression, distortion, and filtering, as well as an array of looping background noises for setting the sound in a variety of environments. Speakers is a zero-latency post-production dream plugin, with no iLok or any other dongle required.

  It features 64 speakers (cabinets, devices, phones, radios, speakers, toys), 42 microphones (condensers, dynamics, phones, ribbons, and more), 18 distortion/degradation algorithms (from carbon mic overdrive to GSM interference), and 42 background noises (devices, places, organic, and more).

  Clicking the spanner button at the top left of either panel reveals a five-band EQ, low and high shelves and three parametric bands, for shaping the frequency response of the Microphone and Speaker emulations. Drag the nodes around to set band frequencies and gains, scroll the mousewheel over a node to tweak the Q, double click to reset the band.

  Speakers includes a Snapshot System, enabling you to save the plugin's current settings into any of the available slots for quick recall. These snapshots are stored within the DAW session and each instance of the plugin has its own independent set of snapshots, and you can automate snapshot changes directly through the Snapshot parameter in your DAW. Speakers is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP), and on the App Store for iOS and iPadOS (AUv3 and Standalone).
specs: |-
  - 64 Speakers
  - 42 Microphones
  - 18 Distortion/degradation algorithms
  - 42 Background noises (190MB)
  - EQ, Compressor, Multimode Filter
  - Flexible Routing
  - Zero Latency / Ultra Low CPU (some degradation algorithms introduce latency)
  - Resizable Window
  - Brightness and Contrast Controls
  - Preset system with randomizer
  - Snapshot system
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP 64-bit)
  - macOS 10.13 - macOS 26, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP 64-bit)
  - 1 license up to 3 computers, no iLok, online or offline authorization
