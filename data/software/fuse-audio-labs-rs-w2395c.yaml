description: A free neo-classic Baxandall EQ emulation developed in close collaboration with its original designer Roger Schult. The W2395c is a boutique active Baxandall-style equalizer, prized for its musically interacting curves. Features a low band switchable between 80 Hz and 110 Hz, a high band switchable between 2 kHz and 5 kHz, and a semi-parametric mid-band continuously sweepable from 155 Hz to 3.5 kHz with a three-position Q switch. A plugin-exclusive Drive control adds harmonic saturation.
details: |-
  Emulates the W2395c hardware Baxandall EQ by Roger Schult ('RS' in the plugin name stands for Roger Schult — developed directly with him). Three-band design: Low shelf (80 Hz/110 Hz switchable), Semi-parametric Mid (155 Hz–3.5 kHz sweep, 3-position Q switch), High shelf (2 kHz/5 kHz switchable). Plugin-exclusive Drive control adds harmonic saturation and grit not on the original hardware. Trim (input level) and bypass switch. No copy protection or registration required — completely free. Universal 2 Binary (Apple Silicon native).
specs: |-
