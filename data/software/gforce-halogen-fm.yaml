description: Halogen FM is a four-operator FM synthesizer designed to make FM synthesis accessible and intuitive, removing the complexity of traditional FM programming. It features a generative Spark core for instant patch creation, macro controls for quick sound shaping, and over 320 professional patches.
details: |-
  Halogen FM is built around the premise that FM synthesis is notoriously difficult to program — complex, technical, and often unintuitive. Halogen FM changes that by inviting users to discover sound through play, functioning as a generative instrument that responds to instinct rather than requiring deep technical knowledge.

  At the heart of Halogen FM is the Spark core, which provides instant patch generation. Users can randomize individual parameters or generate entirely new patches at the click of a button, making it possible to explore vast sonic territory without manual programming.

  Five macro controls — Timbre, EG1, EG2, Modulation, and FX — allow users to shape and tailor sounds quickly to fit their tracks. The synthesizer ships with over 320 professional patches spanning a wide range of FM timbres, along with an Advanced Preset Browser for search and audition.
specs: |-
  - Engine: Four-operator (4-OP) FM synthesis
  - 320+ professional patches
  - Macros: Timbre, EG1, EG2, Modulation, FX
  - Modes: Mono and Poly
  - MIDI: CC mapping, poly-aftertouch, poly-pitchbend
  - Effects: Flexible reverb engine
  - Fully-scalable UI
  - mac: Intel & Apple Silicon native, macOS 10.15+
  - windows: Windows 7+, 2GHz CPU, 2GB RAM
