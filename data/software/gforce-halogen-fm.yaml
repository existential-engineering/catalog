description: Halogen FM is a four-operator FM synthesizer designed to make FM
  synthesis accessible and intuitive, removing the complexity of traditional FM
  programming. It features a generative Spark core for instant patch creation,
  macro controls for quick sound shaping, and over 320 professional patches.
details: |-
  FM synthesis is notoriously difficult to program, complex, technical, and often unintuitive. Halogen FM changes that. We built it to remove the barriers that have kept so many from exploring the raw, expressive power of FM.

  Instead of diving into confusing algorithms or endless parameters, Halogen invites you to discover sound through play. It's a generative instrument that responds to instinct, not instruction, giving you evolving textures, organic tones, and sonic surprises without requiring deep synth knowledge. Halogen FM lets everyone tap into the beauty and unpredictability of FM synthesis, whether you're a seasoned producer or just curious. Your ears lead the way, and happy accidents are part of the design.

  At the heart of Halogen FM is the Halogen Spark core, a powerful engine that generates unique, musical sounds full of character and spontaneity. Just hit the global Spark button and a brand-new patch comes to life instantly. Refining your discovery is easy, simply tweak the Timbre, Envelope Generators for OPR 1 and 2, Modulation, and FX macro knobs to explore subtle shifts and surprising variations.

  Halogen is designed to be intuitive, no programming required. But we also know that sometimes, you want to go deeper. That's why each operator's parameters are fully accessible, giving you detailed control when you need it, without ever standing in your way when you don't.

  With Halogen FM, crafting unique sounds is lightning-fast, yet the depth of character might surprise you. Start by hitting the global Spark button to explore new patches instantly. Then, shape the sound further: turn the Timbre knob left for a softer tone or right for a bolder, more aggressive feel. Likewise, the Modulation knob dials in dynamic unpredictability to the right or a more refined tone to the left. For a smooth pad, turn the EG controls to the right; for a more percussive, plucking sound, turn them to the left.
specs: |-
  - Engine: Four-operator (4-OP) FM synthesis
  - 320+ professional patches
  - Macros: Timbre, EG1, EG2, Modulation, FX
  - Modes: Mono and Poly
  - MIDI: CC mapping, poly-aftertouch, poly-pitchbend
  - Effects: Flexible reverb engine
  - Fully-scalable UI
  - mac: Intel & Apple Silicon native, macOS 10.15+
  - windows: Windows 7+, 2GHz CPU, 2GB RAM
