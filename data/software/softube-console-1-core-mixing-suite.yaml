description: Core Mixing Suite delivers the award-winning sounds of the Tape,
  FET Compressor Mk II, and Bus Processor plug-ins in versatile Tape/Preamp,
  Filter, Shape, Equalizer, and Compressor sections. Plus, an innovative drive
  befitting Softube's stellar reputation for saturation.
details: |-
  Softube combined your feedback and its DSP knowledge to create its idea of the perfect channel strip. Core Mixing Suite gives you the sound of your favorite tools, your preferred workflow, and the ability to paint with broad strokes or get very precise. All in a single channel strip.

  Core Mixing Suite was originally created exclusively for Console 1. The Core Mixing Suite software is included with Console 1 Channel Mk III & Console 1 Compact. It is available for purchase for Console 1 users who wish to use it with their Mk I or Mk II hardware.

  The core of every mixing console is its sound, and Softube wanted to make sure Core Mixing Suite delivers the best. That's why it is equipped with the high-quality sounds of the award-winning Tape, Bus Processor, and FET Compressor Mk II plug-ins. What better way to get the authentic sounds of top-tier studios than to go straight to the Rock & Roll Scientists known for component modeling at an incredibly high level?

  Twenty years' worth of listening, analyzing, and modeling more mixing consoles than Softube can count have gone into Core Mixing Suite. What Softube learned through experience, and speaking with you, is how much the workflow influences the sound and, therefore, just how damn important it is to get it perfect. A turn of a knob needs to feel right, and the action needs to be in harmony with the change in the sound. That's why Core Mixing Suite gives you more processing at your fingertips than most tracks will ever need.

  Core Mixing Suite lets you get the most possible out of the nine sections of the Console 1 plug-in. If you're a Console 1 Mk I or Mk II user, you can rest assured that, with few exceptions, Core Mixing Suite will function for you virtually as it does with newer generations of Console 1. Key differences to note if you use Mk I or Mk II hardware: your access to dual sections and the Tape/Preamp section will be available via the Console 1 plug-in, not from the hardware.
specs: |-
  - Channel strip software that includes tape, filters, three shape processors, two equalizers, three compressors and a drive section
  - Featuring the sounds of Tape, FET Compressor Mk II, Bus Processor, and more
  - Hand-picked, high-quality processing for Console 1 Mixing System
  - Tape/Preamp section with three processing options: Core Tape, Core Modern Preamp, and Core Vintage Preamp
  - Input Gain overdrives the Tape/Preamp stage when the input level reaches above 0 dBFS, with output volume for level matching when bypassed
  - Filter section with low-pass and high-pass Butterworth filters, selectable slope (6, 12, 18, 24, and 48 dB/octave), maximally flat with more linear phase in the passband
  - Three Shape sections: Core Shape (Gate & Shape), Core Panner, and Core Dual Dynamics, covering gating, expansion, compression, transient shaping and mono-compatible binaural panning
  - Two equalizers: a smooth passive Vintage Equalizer for broad strokes and a precise Modern Equalizer for corrective work
  - Three compressors based on FET Compressor Mk II, Bus Processor, and OPTO Compressor
  - Newly designed Core Drive algorithm, with a Character control that pushes either the high or the low frequencies harder
  - Dual compressor slots on Console 1 Channel Mk III (for example FET plus Opto on a vocal chain)
  - Also available as part of Flow Mixing Suite and Flow Complete Suite
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26; Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access for downloading installers and managing licenses
  - 14-day returns, 20-day trial, tech support, three activations
