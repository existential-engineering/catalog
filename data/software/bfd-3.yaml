details: |-
  Bfd3 is the third generation of the flagship software acoustic drum studio:
  new levels of realism and ground-breaking features in an intuitive redesigned
  engine. With stunning new kits, mix-ready presets and modelling technology for
  tom resonance and cymbal swells, bfd3 delivers uncompromising detail.

  The revamped interface has a new mixer and sound browser for the easiest bfd
  experience yet. Bfd3 is designed to sound great while offering as much depth
  as you need. Browse for entire presets, quickly compile custom kits or mould
  any drum sound you desire by retuning, damping and processing multiple mics
  with the powerful internal mixing engine.

  With detail levels of up to 80 velocity layers, rim-clicks and rim-shots for
  toms and bells and splashes for hihats, bfd3's sounds are more expressive than
  ever before. The library's 160gb of audio data is squeezed into 55gb thanks to
  bfd3's lossless compression system meaning less space usage and playback
  strain on your hard disk.

  4 of the included kits are recorded in la's ocean studios and feature
  additional mono room and hardware-compressed channels in addition to stereo
  overhead and room mics. The remaining 3 kits are stick, brush and mallet
  versions of a custom mapleworks kit recorded in a tight but vibrant room at
  omega studios in rockville, maryland.

  The internal bfd3 mixing engine has dcam-modelled compression, filtering and
  other effects alongside great-sounding eq and algorithmic reverbs. You can
  even use an external signal as a compression sidechain source. New workflow
  enhancements let you hide multiple drum and ambient mics for simpler mixing
  approaches and it's easy to route multiple channels to discrete outputs for
  processing with other plugins or outboard gear.
specs: |-





  - Apple m-series chips support (mac m1 + m2 arm)

  - Universal 2 binary

  - 80 velocity layers

  - Rim-clicks and rim-shots for toms

  - Bells and splashes for hihats

  - Lossless compression system

  - 160gb audio data compressed to 55gb

  - Modelled tom resonance and bleed

  - Swell-modelling algorithm for cymbal washes

  - Dcam-modelled compression

  - Filtering and effects

  - Eq and algorithmic reverbs

  - External signal compression sidechain source

  - Multi-channel audio export

  - Groove engine with pattern editing

  - Rudiments tool

  - 7 new kits

  - Rock, metal, jazz and brush kits

  - Mix-ready presets

  - Extendable interface

  - New effects including algorithmic reverb and dcam envshaper

  - Minimum: core2duo 2.0ghz, 2gb ddr3 ram, 7200rpm mechanical hard disk or fast
  ssd, 1280x800 screen resolution

  - Recommended: quad-core processor or faster, 3gb ddr3 ram or higher,
  dedicated drive for audio content

  - Internet connection for authorization and downloads
