details: >-
  A high quality african slit drum for kontakt. These samples were produced by
  ethan winer originally as a sound font instrument. Ethan has made the samples
  freely available to everyone through his website.


  The drum used for these samples has seven slit sections, and each was recorded
  in stereo and sampled at three velocity layers.


  Xtant audio has taken these samples and put them into a single kontakt
  monolith file for ease of use by kontakt users.
