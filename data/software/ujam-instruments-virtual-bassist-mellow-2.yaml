description: Virtual Bassist MELLOW is a meticulously recorded acoustic double bass, played with soul and feel, implanted in a virtual instrument adding realism, behavior and a player who knows his stuff.
details: |-
  Virtual Bassist MELLOW is a double bass playing jazzy acoustic hipster that provides body, texture and a big bottom end. At the heart of it is a meticulously recorded acoustic double bass, smooth and elegant, with the odd noise here and there. At home as a subtle foundation in a jazz trio as well as a powerful second voice in Hip Hop.

  MELLOW isn't just for jazz trios though, feeling equally at home adding smooth, soulful and acoustic realism to singer-songwriter, RnB and Hip-hop styles. As with every UJAM product, MELLOW benefits from a frustration-free design philosophy, so anyone can use it regardless of production experience. Simple controls on the user interface trigger one of over 60 styles and 1380 phrases.

  MELLOW has two distinct modes. Player Mode gives easy access to the traditional fail-free control set: set the musical key, decide on the chords of the song, and MELLOW does the hard work, even intelligently choosing the most appropriate articulations. Instrument Mode lets you access the whole of MELLOW's meticulously sampled fretboard with a MIDI controller, complete with dead notes, full stops and satisfying slides.

  Sound shaping covers five sound characters affecting dynamic range and overall tone, four mix presets of the multiple direct microphone signals, 15 Finisher multi-effect modes, amp selection, note vibrato level, room reverb level, octave effects, dynamics and EQ. Favourite phrases can be dragged and dropped into the bass track of your DAW.
specs: |-
  - Meticulously recorded acoustic upright/double bass
  - 60 styles and 1380 phrases
  - 20 new styles and 30 new presets in version 2
  - 15 Finisher multi-effect modes
  - Five sound characters
  - Four mix presets of the direct microphone signals
  - Adjustable microphones, pick position and mixer channel
  - Real recorded room for ambience
  - Player Mode and Instrument Mode
  - DAW quantization and UI resizing
  - MIDI drag and drop
  - Amp selection, vibrato, room reverb, octave effects, dynamics and EQ
  - PreSonus chord and key track support in Studio One 4.6.2 or later (Virtual Bassist 2.1 update)
  - Operating systems: Windows 10 to Windows 11, macOS Catalina (10.15) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 4 GB of RAM
  - 6 GB of disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, 64-bit only
  - Automated installation via UJAM App, or downloadable installer file
  - Authorization via the UJAM App, or email and password within the plug-in
  - Supported standards: MIDI
