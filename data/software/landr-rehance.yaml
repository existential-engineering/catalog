description: LANDR ReHance™ listens to your audio tracks and removes background noise, reverb, and bleed with pro-grade AI. Get studio-quality results directly in your DAW.
details: |-
  An AI audio enhancement plugin powered by insoundz that distinguishes between unwanted noise and the audio you want to keep. Instantly remove background hum, reverb, room echo, and technical artifacts directly in your DAW.

  Context-aware audio restoration: ReHance listens to your audio track to distinguish between the core performance and the surrounding noise floor, creating a custom restoration profile.

  Multi-artifact AI cleanup: Target and eliminate the four major track killers in one interface — background noise, room reverb, technical clicks/pops, and instrument bleed from other mics in the room.

  Three-stage intensity control: Use Low for subtle transparency, Medium for standard cleanup, or High for aggressive restoration of heavily compromised audio recordings.

  Non-destructive workflow as channel insert. Low-latency, optimized for high track counts. Powered by insoundz AI neural network. Requires macOS 10.15+ (Intel and Apple Silicon) or Windows 10 64-bit+.
specs: |-
  - Formats: VST3, AU, AAX (64-bit only)
  - macOS 10.15 or higher (Intel and Apple Silicon Native)
  - Windows 10 (64-bit) or newer
  - Processor: Intel Core i5, AMD Ryzen 5, or Apple Silicon equivalent
  - Non-destructive channel insert workflow
  - Low-latency, optimized for high track counts
