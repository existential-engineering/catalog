description: "AI audio enhancement plugin powered by insoundz technology.
  Identifies and removes background hum, reverb, room echo, and technical
  artifacts directly in your DAW with context-aware restoration profiles."
details: |-
  Context-aware AI audio restoration. Multi-artifact cleanup targeting background noise, room reverb, clicks/pops, and instrument bleed. Three-stage intensity control (Low, Medium, High). Non-destructive processing as channel insert. Low-latency CPU efficiency for multi-track sessions. Powered by insoundz AI neural network technology. Requires macOS 10.15+ (Intel and Apple Silicon native) or Windows 10 64-bit+. 64-bit only.
specs: |-
  Formats: VST3, AU, AAX (64-bit only). macOS 10.15+ (Intel, Apple Silicon native). Windows 10 64-bit+. Processor: Intel Core i5, AMD Ryzen 5, or Apple Silicon equivalent.
