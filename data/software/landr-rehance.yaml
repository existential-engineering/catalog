description: LANDR ReHance listens to your audio tracks and removes background
  noise, reverb, and bleed with pro-grade AI. Get studio-quality results
  directly in your DAW.
details: |-
  LANDR ReHance is an AI audio enhancement plugin powered by insoundz that distinguishes between unwanted noise and the audio you want to keep. It instantly removes background hum, reverb, room echo, and technical artifacts directly in your DAW.

  Rather than applying a static filter, ReHance listens to the audio track to distinguish between the core performance and the surrounding noise floor, creating a custom restoration profile. Its multi-artifact cleanup targets four major track killers in one interface: background noise, room reverb, technical clicks and pops, and instrument bleed from other mics in the room.

  A three-stage intensity control keeps the signal under the engineer's control: Low for subtle transparency, Medium for standard cleanup, or High for aggressive restoration of heavily compromised recordings. Surgical repair tools automatically detect and eliminate technical flaws including clipping, clicks, pops, and harsh plosive sounds.

  The plugin runs natively on macOS and Windows in VST3, AU, or AAX formats, processing tracks non-destructively as a channel insert so restoration levels can be tweaked at any stage of the mix without bouncing, exporting, or leaving the session. It is engineered for high track counts, so multiple sources can be cleaned simultaneously without draining CPU resources.

  The processing uses the InSoundz AI engine, a set of neural networks that isolate performances from complex background environments and electrical interference. ReHance is included with LANDR Studio plans.
