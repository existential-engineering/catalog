details: |-
  Sweet, Sweet Swing

  Introducing the hip 1959 Swingmaster – a guitar that's all about that jazzy flair! The Swingmaster is your jazz lover's dream, though it's got more tricks up its sleeve. Our guitar virtuoso, Darren Jones strummed it with heavy flat wound strings and a jazz pick, giving it that undeniable jazzy edge. He even dropped the tuning to hit that sweet low register sweet spot. The single coil neck pickup packs a low-fi punch, perfect for an old-school, cool-as-ice vibe. With its round bass and gritty character, it's your ticket to vintage bop and swing jazz heaven. But here's the twist – that grit means it can groove across genres and eras. Built by Kay, a pioneer in affordable electric guitars, the Swingmaster originally went for a steal at $99.95. Picture this: thin, cutaway design, rosewood fingerboard, spruce top, curly maple back and sides. Triple selector switch, separate tone volume and control, and a lustrous walnut finish with golden highlights – it's a time capsule of musical history in your hands with Soundpaint.
