description: "A professional drum library recorded during the creation of
  Periphery V: Djent Is Not A Genre, captured at Real World Studio's Wood Room.
  Features Matt Halpern's signature kit pieces including Pearl Masters Birch and
  Reference Custom kicks, Pearl Reference toms, and an extensive cymbal array.
  Built as a Kontakt Player instrument with built-in processing for mix-ready
