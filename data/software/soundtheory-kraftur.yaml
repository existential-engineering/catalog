description: Kraftur has been carefully engineered to enrich your mix, allowing
  you to increase power while preserving the original integrity of its dynamics.
  Using proprietary DSP methods, Kraftur relies on innovative algorithms to
  avoid artifacts that come with more traditional approaches to soft clipping.
details: |-
  Kraftur is a saturation and loudness enhancement plugin from Soundtheory that uses proprietary DSP methods to enrich audio while preserving dynamic integrity. It avoids the artifacts associated with traditional soft clipping approaches.

  Used on the mix bus, Kraftur helps increase the power of the signal while containing the signal peaks. It can excite the top end to introduce more detail, depth and crispness. On individual mix elements such as vocals, drums or strings, Kraftur is effective for adding frequency-specific saturation while maintaining quality and dynamics.

  When driven harder, Kraftur can sculpt sound by inducing pleasant distortion to create unique colors, warmth and space.

  There are two editions available: Kraftur (zero latency, more transparent loudness enhancement) and Kraftur Focus (40-50ms latency, suitable as a send effect with realigned phase).
specs: |-
  - Minimized aliasing and intermodulation distortion via unique oversampling and DSP algorithms
  - Innovative triangular blend control for seamless mixing between single and multi-band processing
  - Fine tuning of the distortion curve for punchy or dense character
  - MATCH mode with dynamic loudness compensation
  - Three frequency bands with individual distortion curves and frequency ranges
  - VisionTone color rendering pipeline based on human perception
  - Two editions: Kraftur (zero latency) and Kraftur Focus (40-50ms latency)
