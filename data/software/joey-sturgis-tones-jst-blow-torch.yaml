details: |-
  JST Blow Torch: Ignite Your Mixes with Dynamic Energy and Punch
  Overview
  Introducing JST Blow Torch, a compact but powerful tool for adding dynamic energy and punch to your drums and percussive elements. Whether you're looking to restore vitality to your tracks or create bigger, punchier sounds, JST Blow Torch delivers the power and movement that make your music stand out. Designed for producers who demand high-quality sound with ease, JST Blow Torch is your new favorite plugin for transforming your drum and percussion tracks.
  Hear It In Action
  Check out these audio examples to experience the transformative power of JST Blow Torch on various tracks. From subtle enhancements to full-on transformations, JST Blow Torch provides the versatility you need to take your productions to the next level.
  Features - Restore Missing Energy and Punch with JST Blow Torch
  Series and Parallel Tube Circuits
  JST Blow Torch utilizes series and parallel analog-modeled tube circuits with precise digital control to add distinct harmonics and saturation to your mixes. This unique combination gives dynamic energy and movement to your tracks, making them sound bigger and more vibrant.
  Global Heat Adjustment
  Dial in the overall effect intensity with a master Heat knob, blending processed and unprocessed signals seamlessly.
  Tone Shaping Controls
  Customize your sound with JST Blow Torch's comprehensive tone shaping controls. Adjust controls such as Heat, Spice, Tone, and filters to create a sound that perfectly fits your track. The tone knob lets you find the right balance between low and high frequencies, while the filters help you sculpt your sound to perfection.
  Easy-to-Use Interface
  The user-friendly interface of JST Blow Torch makes it easy to achieve professional results quickly. The straightforward controls allow you to dial in the perfect amount of distortion and tone shaping with minimal effort, whether you're a seasoned producer or just starting out.
  Parallel Processing
  JST Blow Torch includes parallel processing, allowing you to blend the processed signal with the original signal. This feature gives you more control over the final sound, enabling you to add subtle enhancements or completely transform your audio.
  Latency-Free and CPU-Efficient
  Designed to integrate seamlessly into your workflow, JST Blow Torch operates with zero latency and minimal CPU usage. This efficiency allows you to use multiple instances of the plugin without compromising performance, making it perfect for complex sessions.
  Professional Quality Sound
  JST Blow Torch brings the analog warmth and digital precision of the original JST Heat plugin into a specialized tool for drum and percussion enhancement. Experience the same high-resolution, analog-modeled saturation that gives your tracks the full-bodied low end and sparkling high end found in professional mixes.
  Upgrade Your Drums and Percussion Today
  Ready to add dynamic energy and punch to your mixes? Download JST Blow Torch today and elevate your sound to a new level of professionalism. Whether you're working on individual tracks or mastering a full project, JST Blow Torch is your secret weapon for achieving a polished, powerful sound.
  Saving and Managing Presets
  Explore Factory & Artist Presets: Broken down by category and/or use-case, these pre-made presets can be really helpful for quick results and exploring the plugin.
  Create Custom Presets: Save your finely tuned settings as new presets for future sessions, ensuring quick recall of your signature sounds.
  Share & Download User Presets: Check online for other users’ presets in the Joey Sturgis Tones forum on Facebook!
