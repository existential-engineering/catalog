description: A channel strip emulation of the Tascam Midistudio 688 — a semi-professional 8-track cassette multitrack recorder introduced in 1990 that shaped the sound of countless demo tapes. Faithfully recreates the preamp, tape system, and 3-band EQ of the original hardware, delivering the characteristic crunchiness, inherent tape compression, and lo-fi warmth of cassette multitracking. Each section can be used individually or combined.
details: |-
  Emulates the Tascam Midistudio 688 (1990, 8-track cassette multitrack recorder). Three independently switchable sections: Preamp (drive/input gain shaping), Tape (cassette saturation, compression, harmonics), and 3-band EQ (tone shaping). Optional Hiss effect adds vintage cassette noise. Panner, Trim pot, Gain fader per channel. Signal flow matches the original hardware's channel strip topology. Version 2.7.
specs: |-
  Controls: Preamp section (drive, enable switch), Tape section (enable switch), 3-band EQ (enable switch), Hiss (on/off), Panner, Trim, Gain. macOS 10.9+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+ (32-bit and 64-bit), 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX. Copy protection: serial number.
