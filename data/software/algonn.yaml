details: >-
  Algon was developed as a sketch board for algomusic's algorithmic ideas which
  developed into the current version of the m42 nebula.


  Algon comes with 128 presets by sound designers tim conrardy and ugo.


  Features include: 2 separate synths, each with: 1 oscillator with multiple
  waveforms including two types of noise. A low pass filter. 2 lfos. 2 envelope
  generators. Multiple modulation routings. A rhythm grid. Algorithmic scale
  generator to enable ever changing sequences with user scale selection. Stereo
  panning for each synth. Split keyboard capacity. Reverb. X-y bpm synced
  delays.
specs: |-
  - 2 separate synths
  - 1 oscillator with multiple waveforms
  - Two types of noise
  - Low pass filter
  - 2 lfos
  - 2 envelope generators
  - Multiple modulation routings
  - Rhythm grid
  - Algorithmic scale generator
  - Stereo panning for each synth
  - Split keyboard capacity
  - Reverb
  - X-y bpm synced delays
  - VST plugin
  - Windows compatible
  - 128 presets
