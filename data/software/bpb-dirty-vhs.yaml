details: |-
  BPB Dirty VHS emulates the sound characteristics and non-linearities of vhs
  tapes and vcr video recorders. The plugin is based on a thorough analysis of
  multiple vcr and vhs units, examining their pitch variation, circuit and
  transport noise, dynamics, and frequency response.

  The eight processing modes available in bpb dirty vhs utilize all this
  information to recreate the sound and vibe of each analyzed unit: golden
  (modelled on a vhs player from the 90s in fairly good condition), old
  (modelled on an old vhs player in poor condition with dirty heads), 80s
  (modelled on a 1980s vhs player using an old, heavily worn-out vhs cassette),
  generation (emulates the effect of recording the same signal repeatedly until
  there is significant generation loss), broken (modelled on a broken vhs player
  in dire need of repair), long-play (emulates accidentally switching the vhs
  recorder into long play mode), circuit-bent (modelled on a circuit bent vhs
  player with deliberate modifications), and console (models the sound of a
  vintage video game console recorded onto a vhs tape).

  The internal tape emulation algorithm slices the incoming audio into small
  chunks, with tiny crossfades for each slice, so that the musical timing of the
  incoming material will be preserved even with extreme variations in pitch.

  Features include mode selection to choose from eight unique vcr models, pitch
  modulation that closely mimics vcr motor inconsistencies and tape condition
  effects, tone shaping carefully modeled after actual vcr hardware, and
  authentic vhs noise blendable with the original signal complete with noise
  gate and filtering.

  The noise gate cuts off the noise when there is no input signal, the dirt
  algorithm emulates the overload effect characteristic of vhs tapes, tape
  chorus simulates the chorusing effect of recording to dual vhs tapes with
  stereo widening options, and the whammy engine turns the plugin into a pitch
  shifter with full parameter randomization capabilities.
