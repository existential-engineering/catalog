description: One ultra-simple plugin that delivers the punch, energy, and edge your bass need to stand out.
details: |-
  Telos Bass is an all-in-one bass mixing plugin from Black Salt Audio that replaces a multi-plugin bass chain with a single tool combining amp simulation, EQ, compression, and saturation. It targets electric, acoustic, synth, and sub bass sources without reconfiguring or mode-switching.

  The signal path includes precision high and low cut filters, a low-end compressor for punchy, consistent subs, and a midrange weight/body section with built-in compression. An amp section offers Clean, Grit, Grind, or Fuzz modes (or bypass), and midrange shaping includes a Bright presence boost for cutting through dense mixes.

  Further processing includes classic bass compression, a sub-bass enhancer that adds harmonics, four saturation modes (Smooth, Hot, Grit, Feather), a built-in limiter for peak control, and anti-aliasing to reduce digital artifacts at higher processing levels.
specs: |-
  - High/low cut filters to remove unwanted sub-rumble or fizzy top-end
  - Low-end compressor for punchy, consistent subs
  - Midrange weight/body targeting with built-in compressor
  - Amp section with Clean, Grit, Grind, or Fuzz modes (or bypass)
  - Midrange shaping with selectable frequency and Bright presence boost
  - Bass compression with a single control for tightened dynamics
  - Sub-bass enhancer adding super-sub power and upper harmonics
  - Four saturation modes: Smooth, Hot, Grit, Feather
  - Built-in limiter for peak control
  - Anti-aliasing to reduce digital artifacts at higher processing
