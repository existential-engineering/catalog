details: |-
  Inspired by the elegant simplicity of vintage pultec style designs, renowned for their ability to simultaneously boost and cut the low frequencies using separate controls - creating powerful, tight bass boost with focus and detail.

  The acm-2sa combines high performance processing with an intuitive stylized user interface. Perfect for adding that big studio sound to 'in the box' mixes.

  Smooth controls with no 'zipper noise' when adjusting the plug-in settings. Physically modelled rotary control modes. Resizable graphical user interface.

  Separate low frequency boost and cut to shape the signature sound. Transformer-coupled valve / tube amplifier emulation enhances the desirable vintage tone.

  Innovative processing models analogue filter behaviour - without additional latency or high cpu demand. Valve / tube emulation adds subtle character even with the eq bypassed.
