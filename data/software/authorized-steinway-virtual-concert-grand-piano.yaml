details: |-
  The Authorized Steinway Virtual Concert Grand Piano is a sample-based software
  instrument developed in collaboration with Steinway & sons, maker of some of
  the world's finest pianos. It accurately captures the distinctive sound of the
  hallmark Steinway & sons concert grand piano - with authenticity and
  musicality.

  The library comes in three versions: professional, standard and basic. The
  professional version offers the steinway model d piano with five different
  listening perspectives: player perspective from the bench, a classical
  recording perspective, an under-the-lid perspective, a stage perspective, and
  a close audience perspective. The standard version offers the under lid and
  classic perspectives. The basic version, ideal for students, amateur
  musicians, and educators, is a light version that offers a single perspective.

  The steinway concert grand piano chosen for the sample set is among steinway's
  finest model d's newly voiced, regulated, and meticulously tuned by a master
  steinway technician. Recording was done in one of the finest venues in the
  world, the troy music hall.

  Created in partnership with steinway & sons. The finest concert grand
  piano—the steinway model d concert grand hand-picked by steinway & sons.
  Overseen by steinway & sons' most accomplished master technician.

  Powered by the robust and reliable aria player, the garritan authorized
  steinway virtual concert grand runs on these platforms: mac os x 10.4+,
  windows xp/vista, linux version under development, standalone, plug-in (VST,
  audio units and rtas), as well as supported notation programs.
specs: |-




  - MIDI playback and record in standalone

  - Sustain/sostenuto/soft pedal support

  - Proportional sustain pedaling

  - Multiple-stage tracking release triggers

  - Sustain resonance and sympathetic resonance using convolution-based dsp
  modules

  - Adjustable mechanical noises

  - Adjustable velocity curves

  - Recorded soft pedal samples including releases

  - Adjustable polyphony

  - Historical tunings and scala file import

  - Aria sample player by plogue included

  - Ambience reverb and 3 band eq

  - Graceful copy protection (no dongles or challenge response)

  - Mac os x 10.4+

  - Windows xp/vista

  - Linux version under development

  - Supported notation programs
