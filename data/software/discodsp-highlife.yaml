description: HighLife is a performance sampler with a built-in wave editor, five effects, morphable parameters, and a 32-bit floating point engine.
details: |-
  32 voices with multilayered zone sampling

  SINC 128 with offline SINC 512 bounce

  Zero Delay Feedback (Lowpass, Highpass, Bandpass, Notch)

  5 integrated: chorus, delay, reverb, Daft, Rock Da Disco

  ADSR envelopes, bipolar modulation envelope, syncable LFO

  WAV, MP3, OGG, FLAC, RAW, SND, AKAI S5000/S6000 (.AKP), SFZ, ZBP (Bliss Program)

  SFZ, 24-bit FLAC ZBP, WAV with loop points

  Built-in wave editor with 1:1 zoom, 128 MIDI-triggerable cues, morphable parameters, ThreadPool SSD-optimized loading, 2x oversampling
