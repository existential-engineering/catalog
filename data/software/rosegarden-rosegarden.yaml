description: Rosegarden is a music composition and editing environment for
  Linux, based around a MIDI sequencer that features a rich understanding of
  music notation and includes basic support for digital audio.
details: |-
  Rosegarden is an easy-to-learn, attractive application that runs on Linux,
  aimed at composers, musicians, music students, and small studio or home
  recording environments. Its editing windows can be open at the same time,
  and the application keeps each view up to date as the others change.

  Unlike other MIDI sequencers, Rosegarden stores details of musical structure
  and presentation far in excess of what MIDI itself can describe, and it can
  tidy up recorded notation with a heuristic notation quantizer without losing
  the original performance timings. Scores are edited and previewed in a
  multi-page layout and printed through LilyPond for typeset output.

  On the audio side, the sample-accurate audio engine handles as many audio
  tracks as the hardware supports, routed through up to eight submaster groups
  with five insert effect slots per track, and mixed in a dedicated mixer
  window. Effects use the LADSPA plugin API and synth plugins use DSSI, each
  of which can be controlled from its own custom interface as well as from
  Rosegarden. Rosegarden also talks to standalone Linux soft synths over the
  ALSA sequencer, and connects to other Linux audio applications through JACK.
specs: |-
  - MIDI sequencing with recording, editing and playback
  - MIDI port, bank, program and controller management by name
  - Score entry, editing and printing through LilyPond
  - Heuristic notation quantizer that preserves performance timings
  - Sample-accurate audio engine with move, snap, resize, zoom and repeat editing
  - Audio mixer window for levels and routing
  - Up to eight submaster groups with five insert effect slots per track
  - LADSPA plugin support for effects
  - DSSI synth plugin support with custom plugin interfaces
  - ALSA sequencer connections to standalone Linux soft synths
  - JACK integration with other Linux audio applications
  - Translated into many languages
