details: |-
  Co-Producer is a plugin that listens to your session and finds samples that seamlessly fit your track. Find samples that work rhythmically and harmonically with your music with sounds synced to your session key and tempo.

  Transform any sample into unlimited, one-of-a-kind, royalty-free versions so you never sound like anyone else. Finding the right sample is no longer a chore — its suggestions are both accurate and inspiring.

  Supported by all major DAWs on Mac and PC.
