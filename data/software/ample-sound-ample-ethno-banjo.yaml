  - Adjustable acoustic resonance

  - Multiple stereo and mono microphone mode options

  - Riffer 4 MIDI editor

  - Strumming and chord system

  - Strum note

  - Dual view modes

  - Piano roll and guitar tab views

  - String visualization system

  - Full MIDI import/export compatibility

  - Intuitive technique editing

  - MIDI cc and velocity editors

  - Strummer

  - Chord detection modes

  - Strum seq

  - Tab reader 4

  - Guitar pro files support (gp3 to guitar pro 8)

  - Bass track import

  - 8-band eq

