details: |-
  Ample ethno banjo aims to bring a deering sierra banjo sound to your studio with 9 articulations including sustain, palm mute, natural harmonic, hammer on & pull off, legato slide, slide in, slide out, pop, and strum.

  Polyphonic legato and slide smoother enables realistic legato across any interval and speed, with authentic left-hand performance noises and adjustable acoustic resonance. Multiple stereo and mono microphone mode options are available.

  Riffer 4 is a MIDI editor tailored for plucked string instruments featuring an all-new strumming and chord system with the innovative "strum note" that treats multiple sub-notes within a chord as a single editable object, allowing unified control over strum time, velocity gradient, and legato parameters. Dual view modes enable seamless real-time switching between piano roll and guitar tab views, and the string visualization system visualizes strings within the piano roll to enable MIDI writing that adheres to authentic plucked instrument techniques.

  Tab reader 4 supports guitar pro files from gp3 to guitar pro 8 and is capable of importing entire bass tracks into riffer with full retention of fingering, articulations, and performance data. The amp and fx system includes built-in effects: 8-band eq, compressor, delay, and convolution reverb.
specs: |-






  - Polyphonic legato and slide smoother

