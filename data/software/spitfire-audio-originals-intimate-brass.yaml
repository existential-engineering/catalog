details: |-
  A custom ensemble of Tuba, Euphonium, Tenor Trombone and Flugelhorn, playing warm and delicate articulations in the reverberant acoustics of Lyndhurst Hall, AIR Studios. Unlike conventional brass libraries built for power and scale, Intimate Brass goes in the opposite direction — restrained, nuanced and human. Each instrument feathers in and out of its most effective playing range for a naturally blended section sound. Three bespoke signals (Close, Mix, Vintage) let you shape the tone from defined and detailed to warm and characterful. Pair with Originals Intimate Woodwinds and Intimate Strings for a complete orchestral section that feels up close and personal.

  Originals Intimate Brass requires the free Splice INSTRUMENT plugin to run.
specs: |-
  - File size: 897 MB
  - 4 instruments: Tuba, Euphonium, Tenor Trombone, Flugelhorn
  - 7 presets
  - 3 mic signals: Close, Mix, Vintage
  - 3 controls: Reverb, Release, Tightness
  - macOS 12 or later, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
