description: Instantly create electrifying rhythm keys with GRIT. It's ready for soul, funk, indie, and modern pop productions.
details: |-
  Virtual Pianist GRIT gives you the gnarly bite and iconic bark only a rare, customized Wurlitzer piano from the 1950s can. From 60s soul to 70s funk, from 80s glitz to 90s indie roughness, this workhorse has got you covered. Thanks to the built-in advanced interactive player, you don't even need any piano skills. And if you got them, there's always the Instrument mode.

  If you're looking for the edgiest electric keys on the market, this rare customized 1950s Wurlitzer 120 will hit you right in the feels. GRIT offers a timeless sonic texture that will take your songs to a new level.

  GRIT is designed to play the most soulful chords and funky licks you can imagine. Its Pianist engine creates endlessly expressive rhythms and beautiful chord progressions with just a single key press. And if you want to dig deeper, you can easily build your own progressions and rhythms.

  Push it to new sonic territory with the dedicated Finisher Modes and Ambience presets, and add subtle mechanical sounds to make it dirtier. GRIT can sound like a guitar-like riffer just as easily as a dreamy indie chord bed.
specs: |-
  - Created from a rare, customized Wurlitzer 120 electric piano with one-of-a-kind edge and bite
  - 5 distinct characters from Gentle to Gritty to Hyped
  - 30 rhythm pianist styles to add movement and drive to any kind of mix
  - 45 Finishers (including mechanical noises) and 45 Ambience presets
  - Player mode and Instrument mode
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 1.55 GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery: automated installation via the UJAM App, which also installs the Virtual Pianist plug-in host
  - Authorization via the UJAM App
  - All MIDI phrases and included sounds are royalty-free
