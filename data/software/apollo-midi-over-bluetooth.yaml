name: Apollo MIDI over Bluetooth
manufacturer: secret-base-design
primaryCategory: sequencer
url: http://www.secretbasedesign.com/apps/apollo
description: With apollo, you can send MIDI between ios devices, or between an
  ios device and a mac.
details: >-
  With apollo, you can send MIDI between ios devices, or between an ios device
  and a mac. Between ios devices, MIDI messages can be sent in either direction
  at any time. With a mac and an ios device, you can toggle the MIDI direction
  any time you like.


  You can use the apps to use one ios device to control synthesizers and
  sequencers on another, sequence an ios device using logic, or use an ios
  device as a controller for garageband.


  Because the MIDI messages are carried over a Bluetooth connection, they are
  very low latency, and the bandwidth is also high. Bluetooth is commonly used
  in game controllers because of the responsive nature. With apollo, you get low
  latency and easy set-up, without a tangle of MIDI adapters and cables.


  Both the mac and ios versions require Bluetooth le. This is a standard feature
  of recent mac desktop and laptop computers; older macs can use a compatible
  USB Bluetooth le adapter. Bluetooth le is available in the ipad3, 4, air, and
  mini, and in iphones starting with the iphone4s and newer.


  The mac version is free -- but can only connect to the ios version, which is
  available in the itunes app store.
specs: |-
  - Bluetooth le support
  - MIDI over Bluetooth
  - Bidirectional MIDI messaging
  - Low latency
  - Standalone application
  - Macos compatible
  - Ios device connectivity
  - Os x 10.7 or newer
