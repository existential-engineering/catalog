description: PSP stompFilter is a creative filtering tool designed for sound designers, offering modulated filter and gain effects. It features LFO-modulated low pass filtering, auto-wah functionality, switchable filter modes, and compression capabilities with flexible cross-modulations.
details: |-
  PSP stompFilter is a creative audio plugin providing modulated filter and gain effects for sound designers. Features LFO-modulated low pass filtering, auto-wah functionality, switchable filter modes (low/band/high-pass), and compression capabilities with flexible cross-modulations between the LFO and envelope detector. LFO randomization adds analog-like character.

  iLok License Manager required (no hardware dongle). 30-day demo available.
