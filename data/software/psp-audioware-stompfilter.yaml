description: PSP stompFilter is a creative tool designed to provide an exceptionally wide range of modulated filter and gain sounds. PSP stompFilter is able to provide vivid, expressive filtering.
details: |-
  PSP stompFilter is a creative tool designed to provide an exceptionally wide range of modulated filter and gain sounds. Its effects include an LFO-modulated low pass filter, auto-wah, a compressor, and low, band or high-pass filter modes. Thanks to the smoothly adjustable filter type and flexible cross-modulations of the LFO by the envelope detector, PSP stompFilter is able to provide vivid, expressive filtering. Just a pinch of adjustable LFO randomization will provide analog-like "imperfections," ensuring that you will never get bored of it.

  In order to run PSP stompFilter in 30-day trial mode or activate it, you need an iLok user ID which you can create for free at www.ilok.com, and you need to install the free iLok License Manager application but you don't need any hardware dongle.

  You can activate the license in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above). You can move these licenses at any time using PACE's iLok License Manager software.
specs: |-
  - LFO-modulated low pass filter
  - Auto-wah
  - Low, band, or high-pass filter modes
  - Compressor
  - Smoothly adjustable filter type
  - Flexible cross-modulations of the LFO by the envelope detector
  - Adjustable LFO randomization for analog-like imperfections
  - Windows: Windows 7 to Windows 11, 64-bit VST, VST3 and AAX (Pro Tools) hosts
  - macOS: macOS 10.14 to macOS 15 Sequoia, Intel and Apple Silicon, 64-bit AudioUnit, VST, VST3 and AAX (Pro Tools) hosts
  - iLok authorization: iLok user ID and iLok License Manager required, no hardware dongle needed
  - License can be activated in 3 separate locations (computer or 2nd generation or above iLok dongle)
