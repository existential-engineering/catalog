description: Q82 Natural Resonance Reverb is Relab's dual-engine re-creation of a beloved 1980s hardware room simulator, revered for its highly realistic ambience and long reverb times, with a reverb engine and an enhancement engine working together.
details: |-
  Q82's dual-engine design pairs a reverb engine with an enhancement engine, each with its own set of four outputs. Used together they set both the width and the "front-to-back" depth of the reverb in real time.

  Where most reverbs rely on the time sound takes to reflect off surfaces, Q82 uses resonators to replicate the behavior of sound traveling through air, treating the room as an instrument. Seven room sizes run from 1 to 1 million cubic meters, with an adjustable first reflection.

  Enhance mode creates the impression of a space with minimal reverb, capturing the first echoes off a room's surfaces like an extra set of close microphones. It adds three-dimensional depth without the muddiness of layering longer reverb tails.

  Two reverb algorithms are selectable: a pristine, factory-spec German unit and a characterful, time-worn US unit whose unstable crystal clock and aging components are modeled. A Temperature Control knob emulates the change in sound from a cold startup to a unit left on for 72 hours.

  The original unit's frequency response rolled off at 8kHz, limited by the internal sample rate and analog filters. Q82 extends this to a range of 4kHz to 16kHz, recalculating the behavior of the internal sample rate and analog filters rather than applying a typical low-pass filter.
specs: |-
  - Dual-engine design: reverb engine plus enhancement engine, each with its own set of four outputs
  - Real-time control of reverb width and "front-to-back" depth
  - Frequency-based resonator approach replicating sound travelling through air
  - Seven room size options from 1 to 1 million cubic meters
  - Adjustable first reflection, with first reflection channel swapping
  - Enhance mode for three-dimensional depth with minimal reverb tail
  - Two selectable reverb algorithms: factory-spec German unit and time-worn US unit
  - Temperature Control knob emulating cold startup through 72 hours of warm-up
  - Hand-tuned 8-voice modulation (Advanced Chorus Ensemble, ACE) embedded in the reverb algorithm
  - Expanded bandwidth control from 4kHz to 16kHz, roll-off points following the Renard Series
  - Hand-crafted factory presets
  - 64-bit only; macOS 10.15 or higher (Intel or M1), Windows 10 or higher (Core 2 or higher), 2GB RAM
  - Compatible hosts: Logic Pro 10.x (Mac), Pro Tools 11.3.2 and up, Cubase 9.5 and up, Nuendo 8 and up, Live 9 and up
  - No hardware dongle required: local computer authorization or iLok USB key (V2 or above), free PACE iLok account needed at activation
