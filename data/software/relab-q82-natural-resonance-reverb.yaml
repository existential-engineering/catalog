description: A premium dual-engine recreation of an iconic 80s hardware reverb unit (version 2.0). Features frequency-based resonators for natural sound behavior, enhancement mode for spatial dimensionality, temperature control to toggle between pristine and characterful algorithms, hand-tuned 8-voice modulation with proprietary ACE technology, expanded bandwidth control from 4kHz to 16kHz, and seven room size options ranging from 1 to 1,000,000 cubic meters.
details: |-
  Q82 2.0 is a dual-engine premium re-creation of a beloved 80s hardware reverb unit, combining two reverb algorithms representing a German factory-spec unit and a characterful US unit, each with independent outputs for precise control over width and depth.

  The plugin features advanced machine learning-assisted design, a Temperature Control parameter for emulating hardware aging, and an 8-voice hand-tuned modulation system called Advanced Chorus Ensemble (ACE) that delivers the characteristic shimmer of the original hardware.

  Frequency-based resonators allow users to shape the tonal character of the reverb tail, while an expandable bandwidth control spanning 4kHz to 16kHz provides flexibility from dark vintage tones to bright modern textures.

  Seven room size options ranging from 1 to 1 million cubic meters, adjustable first reflections, and channel swapping give producers extensive creative control. Hand-crafted factory presets are included for immediate inspiration.

  Authorization is handled via PACE iLok (local machine or USB key v2+); no hardware dongle is required. The plugin runs 64-bit only on both Mac and Windows.
specs: |-
  - Dual-engine reverb design with independent outputs per engine
  - Two reverb algorithms: German factory-spec unit and characterful US unit
  - Temperature Control for emulating hardware aging behavior
  - 8-voice Advanced Chorus Ensemble (ACE) hand-tuned modulation
  - Frequency-based resonators for tonal shaping
  - Expandable bandwidth control: 4kHz-16kHz range
  - Seven room size options: 1 to 1,000,000 cubic meters
  - Adjustable first reflections and channel swapping
  - 64-bit only (Mac and Windows)
  - Mac: OS X 10.15 or higher, Intel & Apple M1
  - Windows: Windows 10 or higher, Core 2 processor or higher
  - Authorization: PACE iLok (no hardware dongle required)
  - Minimum 2GB RAM
  - Compatible with Logic Pro 10.x+, Pro Tools 11.3.2+, Cubase 9.5+, Nuendo 8+, Ableton Live 9+
