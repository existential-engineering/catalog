description: Q82 2.0 is the world's only dual-engine premium re-creation of a beloved 80's hardware reverb, revered for its highly realistic ambience and long reverb times. This legendary resonance reverb, once the cornerstone of many world-class studios, has been meticulously re-created.
details: |-
  Q82's unique dual-engine design combines two powerful reverb systems, each with its own set of four outputs, working in harmony. This dual approach gives you the ability to fine-tune both the width and "front-to-back" depth of your reverb in real time.

  Most reverbs rely solely on the time the sound takes to reflect off surfaces. But Q82 uses unique resonators to replicate the natural behavior of sound traveling through the air. Essentially, Q82 uses the room as an instrument, giving you a reverb that feels alive and integrated with the original signal, and producing a more natural and enveloping experience.

  Enhance mode helps Q82 distinguish itself from other reverbs by creating the illusion of a space with minimal reverb. Imagine having an additional set of hyper-focused microphones, capturing the very first echoes that bounce off surfaces in a room. This adds an extra sense of three-dimensionality to your tracks without introducing the muddiness that often comes with layering longer reverb tails.

  Toggle between two unique reverb algorithms, a pristine, factory-spec German unit and a deeply characterful, time-worn US unit. With the Temperature Control knob, you can now emulate the evolution of sound from a cold startup to the warm, rich tones of a hardware unit left on for 72 hours.

  The original unit's frequency response was limited by its internal sample rate of the digital algorithm and analog filters, resulting in a natural roll-off at 8kHz. Q82 gives you full control over this and offers a range from 4kHz to 16kHz. Instead of a typical low-pass filter, Relab recalculated the behavior of the internal sample rate and analog filters, to give you a highly unique and resonant frequency curve.
specs: |-
  - Dual-engine design: reverb engine plus enhancement engine, each with its own set of four outputs
  - Real-time control of reverb width and "front-to-back" depth
  - Frequency-based resonator approach replicating sound travelling through air
  - Seven room size options from 1 to 1 million cubic meters
  - Adjustable first reflection, with first reflection channel swapping
  - Enhance mode for three-dimensional depth with minimal reverb tail
  - Two selectable reverb algorithms: factory-spec German unit and time-worn US unit
  - Temperature Control knob emulating cold startup through 72 hours of warm-up
  - Hand-tuned 8-voice modulation (Advanced Chorus Ensemble, ACE) embedded in the reverb algorithm
  - Expanded bandwidth control from 4kHz to 16kHz, roll-off points following the Renard Series
  - Hand-crafted factory presets
  - 64-bit only; macOS 10.15 or higher (Intel or M1), Windows 10 or higher (Core 2 or higher), 2GB RAM
  - Compatible hosts: Logic Pro 10.x (Mac), Pro Tools 11.3.2 and up, Cubase 9.5 and up, Nuendo 8 and up, Live 9 and up
  - No hardware dongle required: local computer authorization or iLok USB key (V2 or above), free PACE iLok account needed at activation
