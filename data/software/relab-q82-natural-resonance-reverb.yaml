description: "A premium dual-engine recreation of an iconic 80s hardware reverb
  unit (version 2.0). Features frequency-based resonators for natural sound
  behavior, enhancement mode for spatial dimensionality, temperature control to
  toggle between pristine and characterful algorithms, hand-tuned 8-voice
  modulation with proprietary ACE technology, expanded bandwidth control from
  4kHz to 16kHz, and seven room size options ranging from 1 to 1,000,000 cubic
  meters."
details: |-
  Dual-engine design with separate outputs for width and depth
  Frequency-based resonators for natural sound
  Enhancement mode for spatial dimensionality
  Temperature control between pristine and characterful algorithms
  Hand-tuned 8-voice ACE modulation
  Expanded bandwidth control (4kHz to 16kHz)
  Seven room size options (1 to 1,000,000 cubic meters)
  Adjustable first reflection
  Hand-crafted factory presets

  PACE iLok account required (dongle optional)
