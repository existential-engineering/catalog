  - Stereo in / stereo out
  - Dynamic range: >120 db
  - 4-line fdn architecture with hadamard mixing matrix
  - Advanced input diffusion network (8 all-pass stages)
  - Dc blocking filters
  - Denormal protection
  - Adaptive delay line sizing
  - Simd-optimized math operations
  - Lock-free parameter updates
  - Smoothed parameter changes for click-free automation
  - Windows 10 (64-bit) or later
  - Dual-core processor (2.0 ghz or faster)
  - 4 gb ram
  - 50 mb free disk space
  - Opengl 2.0 compatible graphics
