details: >-
  Abyssfx is a creative reverb and spatial destruction plugin designed for
  producers, sound designers, and audio engineers who demand more than just
  ambience. While traditional reverbs aim for transparency and realism, abyssfx
  embraces character, movement, and transformation. Featuring three distinct
  morphing modes that fundamentally alter the reverb's behavior, advanced pitch
  shifting, and creative destruction tools, abyssfx delivers everything from
  organic cinematic textures to aggressive glitch effects.


  Built on a custom dattorro fdn architecture with hermite interpolation and
  professional dsp enhancements, this plugin combines studio-grade algorithms
  with a bold, character-driven approach. Perfect for when you want your reverb
  to be heard, not hidden.


  Rust mode creates textured, modulated spaces with progressive saturation and
  organic breathing, delivering vintage tape machine warmth, lo-fi cassette
  character, and warm analog textures. Abyss mode is the deepest and cleanest
  mode, creating vast, underwater-like spaces with slow organic movement and
  features the deepest modulation (up to 125 samples) without added drive
  saturation. Magma mode delivers pure sonic aggression with the fastest lfo
  speed (2), increased diffusion, and extreme drive behavior, intentionally
  creating artifacts and distortion for creative destruction.


  The creative drive system features five distinct saturation modes: analog for
  vintage tube-style saturation, tape for tape saturation emulation with smooth
  harmonic compression, bit for bit-reduction distortion, fold for wave-folding
  algorithm, and granular for sample rate reduction with glitchy, stuttering
  textures. All modes include parallel processing with independent amount, mix,
  and tone controls.


  The hybrid pitch fx system offers sub-abyss mode with serial mixing
  architecture optimized for sub-bass generation and octave-down effects, and
  glitch mode with parallel mixing architecture for ethereal shimmer effects.
  Both modes feature adjustable pitch shift from -12 to +12 semitones with
  independent amount control.
specs: |-
  - VST 3 plugin
