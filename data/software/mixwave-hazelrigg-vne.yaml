details: |-
  Founded by brothers George and Geoff Hazelrigg, Hazelrigg Industries creates world-class studio gear that has become a staple in countless hitmakers' arsenals. The VNE evolved from the legendary D.W. Fearn VT-7, featuring a unique Pulse Width Modulation (PWM) gain reduction circuit that delivers transparent, musical compression. Known for its ability to shape dynamics without compromising tone, the VNE has become a favorite for engineers who want clean control with analog soul. In collaboration with Hazelrigg Industries, we've brought this revered piece of gear to the digital world. Using our proprietary component-level modeling process, we've faithfully captured the VNE's distinct sonic character while expanding its flexibility with modern features. Introducing, MixWave: Hazelrigg VNE .
