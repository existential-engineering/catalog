details: |-
  BoomComb is a MIDI tuneable comb filter perfect for creating similar effects
  to a flanger or for just generally doing things like spicing up synthetic
  drums. The delay time to the comb is set in Hz and allows it to be set by the
  notes that are pressed on a MIDI keyboard as well as the pitchbend wheel.

  It can also be used to create sounds similar to stringed instruments if noise
  is input. Also it can be used to create resonating type sounds that can be
  shaped via its damping filter or it can dirty up the sound of the resonation
  via its saturation.

  Tuneable comb filter controlled via MIDI or knob. Damping filter in feedback
  to reduce the harmonics or resonation. Saturation in feedback loop for really
  dirtying a sound or to be used subtly to add character.

  Custom gui designed by leonard "paniq" ritter. Uses custom gui framework using
  the latest windows drawing API.
specs: |-
  - MIDI tuneable comb filter
  - Delay time set in Hz
  - MIDI keyboard control
  - Pitchbend wheel control
  - Damping filter in feedback
  - Saturation in feedback loop
  - Custom gui
  - Windows
