description: A spectrum exciter built around 32 colour profiles that apply saturation and frequency shaping in one move. Depth, Space and Resonate controls extend it into 3D enhancement and stereo width.
details: |-
  ChromaBox is a spectrum exciter aimed at one-click transformation of any kind of audio. It offers 32 colour profiles, each applying its own saturation and frequency shaping, with controls for fine-tuning a colour or preset to fit a mix.

  The Depth dial is the main starting point, scaling every other parameter from a single control and introducing saturation, 3D effects and frequency shaping together. The further it is turned, the more pronounced the processing becomes.

  Hue, Saturation and Luminance controls reshape the colour profile, adding sparkle to guitars or body to acoustic instruments. The 32-colour palette is sorted into Dark, Light, Vivid and Soft categories for browsing.

  Space and Resonate drive the more extreme results. Space sets the amount of reflections within a simulated 3D space, with a character that depends on the selected colour profile, and Resonate controls resonant peaks that ring out, again with timbre that follows the chosen profile.

  The interface is built on vector graphics and is resizable, with a live frequency spectrum on the right showing what the signal is doing in real time. A/B comparison, copy and paste, and undo and redo support experimentation, and a large factory preset library covers multiple genres.
specs: |-
  - Spectrum exciter with one-click transformations
  - 32 colour quick access palette, sorted into Dark, Light, Vivid and Soft
  - Depth control scales every other parameter
  - Sound sculpting with Hue, Saturation and Luminance
  - Space and Resonance adjustment
  - Live frequency spectrum monitoring
  - A/B comparison with undo and redo
  - Resizable vector interface
  - Responsive and CPU friendly
  - Flexible factory presets
  - Full PDF manual and tutorial video
  - Runs on both Intel and Apple Silicon CPUs
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
