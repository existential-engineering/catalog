description: "Plugin host module for VCV Rack that enables loading 64-bit VST2
  and VST3 instrument and effect plugins directly inside the modular
  environment. Provides CV control over VST automation parameters and MIDI
  functionality."
details: |-
  Includes four module variants: Host (VST instrument host with 1V/oct pitch CV and gate inputs), Host-FX (VST effect host with stereo audio inputs), Host-XL (expanded host with 8 audio I/O and 24 parameter inputs), and MIDI output expanders (Host-CV, Host-CC, Host-Gate). Supports 64-bit VST2 and VST3 plugins.
specs: |-
  Requires VCV Rack 2. Supports 64-bit VST2 and VST3 instrument and effect plugins.
