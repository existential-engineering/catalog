description: Use 64-bit VST 2 and VST 3 instrument and effect plugins in VCV Rack. Control VST automation parameters and MIDI with CV.
details: |-
  For hosting VST instruments, synthesizers, samplers, and sound generators, use Host, which includes 1V/oct pitch CV and gate inputs. When the gate input voltage rises, a MIDI note is triggered according to the current 1V/oct signal, rounded to the nearest note. This note is held until the gate falls to 0V. Host supports polyphonic cables patched into its CV and gate inputs, as well as key pressure (aftertouch) and velocity parameters.

  Click the plugin name label (initially displaying “No plugin”) to open the list of installed VST plugins on your system. When a plugin is loaded, its editor GUI window will be shown. If closed, it can be reopened by clicking the “eye” icon next to the plugin name. In the plugin dropdown menu you can add or remove directories to allow VCV Host to search for plugins in different VST installation locations. Searching is recursive, and plugins are searched immediately. There is no need to restart Rack if a new directory is added or a new plugin is installed.

  Up to 16 VST automation parameters (24 in Host-XL) can be modulated with CV, with an input range of 0V to 10V. To map a VST parameter to a parameter input on Host, click a parameter label (initially displaying “- - -”), and the editor window will be shown. Adjust (i.e. wiggle) a knob or slider in the VST editor, and the parameter will be mapped. Alternatively, right-click a parameter label to display a dropdown menu of all available VST parameters. Host also includes mappable MIDI parameters for generating certain MIDI events, such as note velocity and pitch wheel.

  While Rack modules process each sample one-by-one, VST plugins must process blocks of samples in bulk. Because of this, VCV Host waits until the block is filled before requesting the VST plugin to process audio. Lower block sizes result in lower latency but force the plugin to process more often, which consumes more CPU. The default size is 128 samples (2.9ms @ 44.1kHz), the minimum is 16 (0.4ms) and the maximum is 4096 (93ms).

  For hosting VST effects, processors, and pedals, Host-FX includes stereo audio inputs, with the right input normalized to the left so mono audio can be mapped to both stereo channels. If more than 2 channels of audio are needed, Host-XL includes 8 audio inputs, 8 audio outputs, and 24 parameter inputs. If a VST plugin in a Host, Host-FX, or Host-XL module generates MIDI output (such as a sequencer or audio-to-pitch detector), one of the Host-CV, Host-CC, or Host-Gate expanders can be placed on its right to convert the VST plugin’s MIDI output to CV and gates in Rack. Those expanders can be daisy-chained, sending MIDI from their left to their right.
specs: |-
  - Modules included: Host (VST instrument host, 1V/oct pitch CV and gate inputs)
  - Modules included: Host-FX (VST effect host, stereo audio inputs)
  - Modules included: Host-XL (expanded VST instrument/effect host, 8 audio inputs, 8 audio outputs, 24 parameter inputs)
  - Modules included: Host-CV, Host-CC, Host-Gate (MIDI output expanders)
  - Hosts 64-bit VST 2 and VST 3 instrument and effect plugins
  - Up to 16 mappable VST automation parameters (24 in Host-XL), input range 0V to 10V
  - Polyphonic cables supported on CV and gate inputs, plus key pressure (aftertouch) and velocity parameters
  - Mappable MIDI parameters for events such as note velocity and pitch wheel
  - Block size: default 128 samples (2.9ms @ 44.1kHz), minimum 16 (0.4ms), maximum 4096 (93ms)
  - Recursive, user-configurable VST plugin search directories with no need to restart Rack
  - Audio voltage range [-10V, 10V]
  - Transport controls and clock tempo sync
