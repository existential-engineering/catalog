details: |-
  The fastest path from bedroom to club: you don't need to spend hours getting
  the balance of your kick and snare right, changing one sample only to find you
  need to re-do the entire rhythm. With void, you can touch a single key and
  nail the sound you want from the get-go. It instantly syncs to your DAW's
  tempo, and with only a few notes you can craft the perfect fills and
  breakdowns to make your fans scream with delight.

  Void gives you the tools to create the perfect breakbeats without the need for
  samplers, endless beat slicing or monotonous rearranging. Saturation,
  compression and ambience are all dialed in perfectly for every kit. All you
  need to do is choose how much of each effect you want to rock your mix,
  without any need for additional effects.

  Void's transparent interface makes it easy to create crazy bangers without
  overthinking it. No hidden menus or obscure controls, and everything is
  clearly laid out for you. With 10 separate kits, 12 smart-mix presets and easy
  access to the only fx you need to make hard-hitting dnb breaks, void is the
  perfect tool to glue together your dirtiest leads, smoothest pads and thumping
  basslines.

  Special control: the unique control combines a notch filter sweep and
  compression that lets you create mind blowing riser and drops.
specs: |-
