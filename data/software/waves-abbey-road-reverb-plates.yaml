description: State-of-the-art modeling of the four legendary reverb plates
  housed at Abbey Road Studios and used on recordings by the Beatles, Pink Floyd
  and Radiohead.
details: |-
  Introduced over half a century ago, plate reverbs have been a fixture of
  recorded music ever since. Used most prominently in the '60s and '70s by
  pioneering bands, including the beatles and pink floyd, abbey road studios'
  original reverb plates four emt 140 units were first installed in 1957 to
  complement the fixed reverberation times of the studios' echo chambers.

  These beautiful-sounding plates, with a variable reverb time of up to six
  seconds, were then tweaked to perfection by abbey road's technical engineers.
  To keep noise to a minimum, emi's central research laboratories designed
  unique hybrid solid-state drive amps for plates a, b and c. Plate d remained
  fully valve-powered on both drive and output stages, allowing a versatile
  array of sonic characteristics, from warm and dark to lush and smooth.

  In each of these original plates, the stereo reverb effect is created by
  suspending a large sheet of metal with tensioned springs attached to each
  corner. A transducer injects the metal sheet with audio energy, which is
  picked up by two contact mics fixed to the surface of the plate. The reverb
  time can then be adjusted by using an internal damper, and all of this is
  contained within a large wooden unit.

  These historic abbey road plates have been used on countless seminal pop,
  rock, classical and film recordings over the years, and continue to be used in
  all kinds of audio production to this day.

  Waves has now created meticulous models of these unique-sounding units,
  individually modeling the harmonic distortion of both the drive and output
  amps as well as the individual plate/damper behaviors.
specs: |-
  - Stereo reverb effect
  - Variable reverb time up to six seconds
  - Harmonic distortion modeling
  - Drive and output amps modeling
  - Plate/damper behaviors modeling
  - Drive control for thd characteristics
  - Analog noise control
  - Hum control
  - Four original bass cut positions
  - Crosstalk control for stereo leak effect
  - Emt 140 modeling
