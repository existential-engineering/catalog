description: Type B is a plugin inspired by the Aphex Aural Exciter. This plugin
  is designed to add presence and brightness to vocal or instrument tracks.
details: |-
  Type B is a plugin inspired by a legendary hardware unit known for bringing presence and sparkle to vocal and instrument tracks. Originally used to restore high-end detail in recordings dulled by tape overdubs, this classic design became a studio staple for adding clarity and brightness.

  AudioThing's modern take on the circuit goes beyond the original, giving in-depth control over the internal filter, harmonic generator, and more. Filter controls cover mode (pre/post), type (highpass, bandpass), slope (12/24dB) and emphasis, with additional options for direct signal, wet boost, and background noise.

  Exciters generate high-frequency content that is not part of the original signal using a combination of filtering and distortion (harmonic generator). The input signal goes into a filter (usually highpass, but bandpass is also available with Type B) before feeding it into the harmonic generator. The generated harmonics are shaped with the Color parameter, and the signal is then mixed back with the dry signal. Type B also offers an option to swap the filter position with the harmonic generator.

  The original aural exciter algorithm was developed in the mid-1970s by Aphex Systems. At first, it was available to recording studios only to hire (at a cost of $30 per minute of finished recording time in 1975). Eventually, its popularity led to the release of commercially available models like the Type B and Type C.

  Type B is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP). It is also available on the App Store for iOS and iPadOS (AUv3 and Standalone).
