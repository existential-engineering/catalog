description: >-
  OB-Xa V is Arturia's software recreation of the Oberheim OB-Xa polyphonic
  analog synthesizer. Using Arturia's TAE modeling technology, it captures
  the warm, thick sound of the original with added modern features including
  an arpeggiator, effects, and extended modulation.
details: |-
  OB-Xa V recreates one of the most sought-after polyphonic synthesizers
  of the 1980s. The original Oberheim OB-Xa was prized for its warm pads,
  rich brass sounds, and lush strings — heard on records by Van Halen,
  Prince, Depeche Mode, and countless others.

  Arturia's TAE (True Analog Emulation) modeling captures the behavior
  of the original's CEM3320 voltage-controlled filters and CEM3360 VCAs,
  including their nonlinear characteristics and component drift. The
  result is the same organic warmth and subtle instabilities that gave
  the original its character.

  Each voice features two oscillators with sawtooth and pulse waveforms
  (variable width on oscillator 2), plus noise. The dual filter modes
  allow two-pole or four-pole low-pass filtering per voice, following
  the original's distinctive filter architecture.

  Beyond faithful emulation, OB-Xa V adds modern enhancements: a
  built-in arpeggiator with multiple patterns, a chorus/flanger/phaser
  modulation section, delay, and reverb. An extended modulation matrix
  provides routing flexibility beyond the original's capabilities.

  The preset library includes recreations of classic OB-Xa sounds plus
  contemporary patches that push the engine into new territory.
specs: |-
  - TAE analog circuit modeling
  - 8-voice polyphony
  - 2 oscillators per voice (saw, pulse, noise)
  - Variable pulse width on oscillator 2
  - 2-pole and 4-pole low-pass filter modes
  - 2 ADSR envelopes (filter, amplifier)
  - LFO with multiple waveforms
  - Built-in arpeggiator
  - Chorus, flanger, phaser effects
  - Delay and reverb
  - Extended modulation matrix
  - Unison mode with detune
  - Velocity and aftertouch support
  - Preset browser with categories
  - VST3, AU, AAX, standalone formats
  - macOS and Windows
