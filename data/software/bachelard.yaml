description: Bachelard features a delay module with a filter section and a
  reverb module with a second filter section. Many parameters can be controlled.
details: |-
  Bachelard features a delay module with a filter section and a reverb module
  with a second filter section. Many parameters can be controlled with key
  tracking. The effect also features 3 LFOs and a modulation matrix.

  The 3 lfos have 5 different waveforms to choose from and 3 different ways to
  control the oscillator speed. They also have a trigger function controlled by
  MIDI note commands.

  Parameters that feature key tracking can also be assigned to different MIDI
  channels for extra flexibility.

  Delay featuring free, sync to host and key tracking (ktr) controlled rate.
  Delay feedback also features a ktr switch. Reverb parameters include size,
  width, damp and mix. Reverb size and mix controls also have ktr switches.

  Both effects have identical filters with 2 self oscillating svs. The cutoff on
  the filters can also be set to ktr. Each lfo can be assigned in the modulation
  matrix to several destinations: delay rate, feedback, cutoff and resonance,
  reverb size, width, damp, mix, cutoff and resonance.
specs: |-
  - Delay module with filter section

  - Reverb module with filter section

  - Key tracking control

  - 3 lfos

  - Modulation matrix

  - 5 lfo waveforms

  - 3 oscillator speed control modes

  - MIDI note trigger function

  - MIDI channel assignment

  - Delay rate control (free, sync to host, key tracking)

  - Delay feedback with key tracking

  - Reverb parameters (size, width, damp, mix)

  - 2 self-oscillating svf filters

  - Filter cutoff key tracking

  - Lfo modulation destinations (delay rate, feedback, cutoff, resonance, reverb
  size, width, damp, mix)


  - Windows
