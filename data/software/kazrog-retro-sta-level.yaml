description: The only official Retro Sta-Level plugin endorsed by Retro Instruments. Modern and Vintage tube compression modes, sidechain filters, and 100+ presets.
details: |-
  Retro Sta-Level is an official emulation of the hardware, developed by Kazrog in close collaboration with Retro Instruments and subtitled on the page as "The Official Plugin". Noted for its musicality, the Retro Sta-Level easily achieves a "larger than life" signature sound when dynamically processing individual instruments and vocals. Professional music producers and engineers all over the world admire and rely on the Retro Sta-Level for the euphonic qualities it brings instantly to any sound source.

  Kazrog describes it as the only official plugin version of the Retro Sta-Level hardware, officially endorsed by Phil Moore of Retro Instruments.

  The plugin has two voicing modes. Modern Mode emulates a Retro Sta-Level Gold Edition, described as the definitive modern, deluxe, made in USA, all-tube recreation of the classic 1956 design. Vintage Mode emulates an original Gates Sta-Level from Devin Powers' collection, modded by Phil Moore of Retro Instruments to offer the full Retro Sta-Level feature set, giving a vintage, mid-focused, harmonically rich alternate voicing.

  Workflow enhancements over the hardware are sidechain HPF/LPF, wet/dry blend, and Analog Entropy (adjustable component tolerance drift modeling). It ships with 100 pro presets from names including Michael Brauer, Ross Hogarth, and David Kalmusky, with new presets promised in future free updates. Kalmusky is quoted on the page calling the collaboration between Retro Instruments and Kazrog "truly stunning" and saying he is using the Sta-Level plugin all over the place.

  System requirements are listed per platform. Mac needs macOS 10.13.x or higher and a VST, AU, or AAX (64-bit) host, with Pro Tools 12 or higher for AAX; all Kazrog plugins are Universal Binary 2 with native Apple Silicon and Intel support. Windows needs Windows 10 or higher and a VST or AAX (64-bit) host. Linux needs a VST3, VST2, or LV2 compatible host and has been tested on Ubuntu, Linux Mint, Debian, and Manjaro. The licence is 100% perpetual for multiple devices with no iLok and no subscription fees, and the demo is time-unlimited with random silent output and preset saving disabled.
specs: |-
  - The only official plugin version of the Retro Sta-Level hardware, endorsed by Phil Moore of Retro Instruments
