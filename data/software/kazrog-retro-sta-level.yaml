description: Official emulation of the Retro Sta-Level hardware tube compressor, developed collaboratively by Kazrog and Retro Instruments. The plugin delivers a 'larger than life' signature sound for dynamic processing with both Modern and Vintage modes.
details: |-
  The Retro Sta-Level is a meticulously crafted software emulation of the legendary Retro Sta-Level hardware tube compressor, developed in direct collaboration between Kazrog and Retro Instruments. It captures the iconic character and warmth of the original hardware unit.

  The plugin features two distinct operational modes: Modern Mode emulates the Retro Sta-Level Gold Edition, while Vintage Mode is based on the original Gates Sta-Level with Retro Instruments modifications. This dual-mode design allows producers and engineers to access a spectrum of tonal character from classic vintage warmth to modern refined punch.

  Advanced features include sidechain HPF/LPF filters, a wet/dry blend control for parallel compression, and Analog Entropy — a sophisticated component tolerance drift modeling system that recreates the subtle inconsistencies and character of real analog hardware. The plugin ships with 100 professional presets curated by renowned engineers including Michael Brauer, Ross Hogarth, and David Kalmusky.

  Licensing is fully perpetual with no iLok authorization required, no subscription fees, and support for multiple devices.
specs: |-
  - Two operational modes: Modern (Gold Edition) and Vintage (original Gates Sta-Level)
  - Sidechain HPF/LPF filters
  - Wet/dry blend control for parallel compression
  - Analog Entropy component tolerance drift modeling
  - 100 professional presets
  - macOS 10.13+; Universal Binary 2 (Apple Silicon + Intel)
  - Windows 10+
  - Linux: VST3, VST2, LV2 compatible hosts
  - AAX requires Pro Tools 12+
  - Perpetual license; no iLok, no subscription
