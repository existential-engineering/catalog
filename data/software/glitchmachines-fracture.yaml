description: Fracture is a free buffer effects plugin for producing robotic
  artifacts and musical malfunctions. It chains buffer, delay, and filter
  effects in a reconfigurable signal path with three LFOs and a randomize
  function for rapid texture exploration. Suited to electronic musicians and
  sound designers looking for glitchy articulations without a price tag.
details: |-
  Fracture is a versatile effects processor geared toward electronic musicians and sound designers. This plugin was designed to add glitchy articulations and abstract textures to your projects. Use it on anything from drums and percussion to synth lines and sound effects. Fracture's intuitive interface and diverse features make it simple to give your projects a unique technical edge.

  Fracture features a buffer effect, a multimode filter, three LFOs and a delay. At the Config Menu of Fracture's interface, you will find a drop down menu which allows you to reconfigure the order of the effects in the chain. This is particularly useful since the order of the effects will significantly influence the final result of your patch.

  If you're running low on inspiration, the randomize function will set all the parameters to random values, which can quickly yield interesting creative results. Automate Fracture's parameters via your DAW to gain precise control, allowing you to construct complex passages of parameter animations within the context of your sessions.

  Our free downloads feature exclusive releases developed with the same uncompromising production values as our paid products. These critically acclaimed free plugins and packs have been featured on countless 'best-of' lists and are favorites among electronic musicians and sound designers.
