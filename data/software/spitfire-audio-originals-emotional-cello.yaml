details: |-
  Created with London-based cellist Reinoud Ford, Emotional Cello captures the full expressive range of the solo cello, from tender and lyrical to visceral and unsettling. Subtle vibrato, natural dynamic movement, and 11 techniques covering an array of long, short, and experimental articulations. Recorded at Spitfire Studios with three bespoke mic signals — including a Vintage signal treated through an analogue effects chain for organic warmth and character.

  Originals Emotional Cello requires the free Splice INSTRUMENT plugin to run.
specs: |-
  - File size: 2.5 GB
  - 10 presets
  - 3 mic signals: Close, Room, Vintage
  - 4 controls: Reverb, Tightness, Release, EQ
  - macOS 12 or later, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
