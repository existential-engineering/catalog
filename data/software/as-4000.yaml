name: AS-4000
manufacturer: benedict-roff-marsh
primaryCategory: synthesizer
url: http://www.benedictroffmarsh.com/
description: As-4000 presents as a string synth like a polymoog or solina.
details: >-
  As-4000 presents as a string synth like a polymoog or solina. Beyond this,
  though, the synth was designed from the start to have other methods of
  operation, which can range from a simple additive "organ" to strums and
  evolving pads.


  Each uses the same architecture but changes the mindset used to approach the
  knobs. I have taken the 'technologies' behind 4-lines later and 6th dimension
  and built them into a synth, which is very thick & rich as a result of
  uncommon approaches under the hood.


  This is a character instrument focused on things that can't easily be done in
  a typical uber-synth.


  The video above is the complete manual. All support requests must be made via
  the discussion on youtube.
specs: |-
  - VST 3 plugin
  - String synth
  - Additive organ mode
  - Strum functionality
  - Evolving pads
  - MIDI compatible
