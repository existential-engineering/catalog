description: 4ms Spectral Multiband Resonator is an innovative multiband
  resonant filter, created in collaboration with 4ms as a Modular expansion. It
  features six channels of resonant bandpass filters, and can process audio like
  a classic resonant filter, vocode, re-mix tracks, harmonize and so much more.
details: |-
  A deeply useable and versatile module by USA West Coast synth specialists 4ms, the Spectral Multiband Resonator (SMR) for Softube Modular can process audio like a classic filter bank, ring like a marimba when plucked or struck, vocode, re-mix tracks, harmonize, output spectral data, quantize other oscillators to scales and much more. It's colourful, complex, and musical, infinitely expanding what is possible to achieve with Modular.

  Softube's 4ms Spectral Multiband Resonator software module is officially endorsed by 4ms. It faithfully emulates both the hardware and firmware of the original unit, with some minor alterations and improvements.
specs: |-
  - Made for Modular, Softube's Eurorack platform
  - Officially licensed and endorsed by 4ms
  - Innovative multiband resonant filter with six channels of resonant bandpass filters
  - Wide range of uses: filter bank, plucked or struck marimba-like resonance, vocoding, track re-mixing, harmonizing, spectral data output and scale quantizing of other oscillators
  - Includes 75 new presets
  - Low CPU usage
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26, or Windows 10 (64-bit) and Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a DAW host compatible with AU, VST, VST3 and/or AAX
  - Internet access required for downloading installers and managing licenses
  - Three activations included
