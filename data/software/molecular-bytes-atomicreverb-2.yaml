description: AtomicReverb 2 is a fully re-imagined high-end algorithmic reverb
  plugin designed for VST, AAX and audiounits.
details: |-
  With over 260 factory presets and more than 190 distinct early reflection
  signatures, atomicreverb 2 provides a broad sonic base that can be freely
  shaped in tone, size, diffusion, and color. The rebuilt processing engine
  delivers highly realistic and musical reverb spaces ranging from subtle
  ambience to expansive cinematic depth. The new 'diffuse room' tail type
  further expands the creative palette with a rich, airy texture perfect for
  modern productions.

  Unlike many conventional reverb effects that focus primarily on tail design,
  atomicreverb 2 puts early reflections at the center of its spatial modeling
  approach. These early reflections are the key to perceived room character, yet
  they're often neglected or oversimplified. Atomicreverb's edge lies in the
  accurate recreation of real-world reflection patterns, carefully modeled after
  impulse responses but entirely algorithmic and dynamic.

  At the heart of atomicreverb 2 is a sophisticated 64-bit internal architecture
  with optional 2x oversampling that ensures precision and sonic integrity
  across the entire signal path. Each preset stores its own level of detail to
  optimize cpu usage, while the new processing engine allows for ultra-long,
  accurate tails even beyond minutes. Highly optimized code (and native arm
  support on macos systems) delivers excellent performance, even in large
  projects.

  The all-new user interface combines clarity and speed, offering a powerful
  preset search with category counters, a streamlined previous/next preset
  navigation, and intuitive parameter displays such as reverb time and pre-delay
  now shown in host-synchronized musical values. Atomicreverb 2 features a fully
  integrated 5-band eq with real-time spectrum analyzer, and parameters like
  dry/wet, gain, and density can be locked to maintain consistency while
  browsing presets.
specs: |-
  - 64-bit internal architecture
  - Optional 2x oversampling
  - Zero latency
  - 5-band EQ with real-time spectrum analyzer
  - MIDI learn functionality
  - Fully dynamic algorithmic reverb
  - Three tail models: hard room, diffuse room, full-dense
  - Resonance suppression
  - Frequency-dependent decay
  - Smooth parameter transitions
  - Gated reverb
  - Reverb hold
  - Mono frequency control
  - Ducking
  - Emphasis
  - Softening
  - Over 190 early reflection signatures
  - 260+ factory presets
  - Preset browser with search and category filtering
  - A/b comparison
  - Undo/redo functionality
  - Xml-based preset sharing
  - Scalable/resizable user interface
  - Two ui skins
  - Host-synchronized musical values display
  - Adjustable peak meter
  - Parameter locks for dry/wet, gain, and density
  - Standalone application for Windows
  - Native arm support on macOS
  - Per-preset CPU optimizations
