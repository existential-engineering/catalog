description: A soft synth with the authentic sound of Blade Runner, Chariots of
  Fire, Billie Jean, Africa, Human Nature, and more? This Model 77 Dual Layer
  Synth plugin gives you the iconic sound you want and the workflow you need.
details: |-
  Model 77 Dual Layer Synth gives you one of the most influential sounds of modern times. It is the iconic sound of Blade Runner, Chariots of Fire, Billie Jean, Africa, and Human Nature, among countless others.

  Softube modeled and accurately articulated every detail of the circuits of three legendarily expressive Japanese synthesizers from 1977 and put them in one user-friendly plug-in. The sound, interaction, and performance remain as close to the hardware as possible, while the complex interfaces of the original instruments are enhanced with an intuitive redesign.

  When designing Model 77, Softube took great care to create a more efficient user interface that makes the plug-in easier to navigate. Two layers are accessible directly from the front panel, but the focus stays on one layer at a time. Softube also redesigned the position of the sections to communicate the instrument's proper signal flow. Now, the Ring Mod section on the interface corresponds to its location in the signal flow, and the balance slider is between the upper and lower layers.

  With presets that can be heard on countless incredible recordings, Softube had to include all the original factory presets for all three synthesizers with Model 77. In addition to the Single Layer Presets, Model 77 features Dual Layer Presets, which allow you to recreate classic sounds through the combination of the upper and lower presets that were so famously used.

  More than a strict model, Model 77 has added features and workflow enhancements, like stereo processing and DAW sync, that ensure its authenticity integrates seamlessly into modern productions. An Aging Slider provides vintage vibes such as oscillator drift and variations over filter cutoff, pulse width, and envelope time, and a new stereo algorithmic reverb whose Reverb Slider controls both dry/wet and decay time. Model 77 is the first Softube instrument to support true Polyphonic Aftertouch for some of the parameters featured in the Expanded View, and it also supports normal aftertouch.
specs: |-
  - The esteemed, influential dual-layer synthesizer
  - The authentic sound, interactions, and performance of three famed Japanese hardware units from 1977
  - A redesigned, intuitive new interface for an improved and modern workflow
  - Three versions included: the instrument, seven modules for Modular, and two modules for Amp Room
  - The precisely modeled sound, interactions, and performance of the original units
  - Perfectly captured polyphonic aftertouch and voice allocation
  - The easy call-up of original factory presets heard on countless celebrated recordings
  - Workflow enhancements such as a redesigned interface, stereo processing, DAW sync, keyboard tracking, unison mode, and more
  - Seven modules for Softube Modular: Oscillator, Dual Mode Filter, Amplifier, Envelope Generator, Low Frequency Oscillator, Ring Modulator, and Reverb
  - Two modules for Amp Room: Ring Modulator and Reverb
  - Aging Slider for oscillator drift and variations over filter cutoff, pulse width, and envelope time
  - Stereo algorithmic reverb with a Reverb Slider controlling dry/wet and decay time
  - Supported sample rates: 44.1, 48, 88.2, 96, 176.4, and 192 kHz, in both mono and stereo
  - Requires a Softube account and an iLok account (no physical iLok required)
  - macOS Sonoma 14, Sequoia 15 or Tahoe 26; Windows 10 (64-bit) or Windows 11
  - Apple silicon (M1 or newer) supported natively
