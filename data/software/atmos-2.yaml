details: |-
  Atmos 2 is a free ambient piano plugin instrument for Windows & mac. The
  samples of Atmos 2 were recorded in november 2019, using a Yamaha c3 grand
  piano as a source, at a music school in mallorca (balearic islands). To obtain
  the samples a zoom h6 digital recorder was used.

  Mac users: now each of our plugins shares a single instrument library, saving
  you a lot of space on your hard drive.

  Atmos 2 by electronik sound lab is a virtual instrument audio plugin for macos
  and windows. It functions as a VST plugin, an audio units plugin and a VST 3
  plugin.
specs: |-
  - 56 samples
  - 2 layers
  - ADSR controls
  - LFO modulation
  - Filter HP/LP
  - macOS catalina support
  - 32-bit support
  - 64-bit support
  - Windows 8.1/10 compatible
  - Os x 10.13.6 and above compatible
  - 500 MB disk space requirement
  - 500 MB RAM requirement
