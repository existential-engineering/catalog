details: |-
  8080f is a side chain filter ensemble with m/s processing. It's a creative tool perfect for pads processing.

  8080f allows processing of the stereo (side) signal or application of a low pass filter on the mono (mid) signal and a high pass filter on the stereo (side) signal while the cutoff envelope is modulated independent in the mono and stereo signal.

  The cutoff envelope is modulated by the difference between the side chain signal and the threshold settings with attack and release settings.

  For feeding 8080f side chain the user can send an audio signal in the 3/4 inputs from reaktor 5 in a DAW (ableton live, logic, cubase, reaper, pro tools) or ni maschine.

  The user has independent controls for the both channels (l-mono/r-stereo) but can also control the filter parameter in link mode by pressing the link switch and tweaking the left parameters.
specs: |-
  - Side chain filter ensemble
  - M/s processing
  - Low pass filter on mono (mid) signal
  - High pass filter on stereo (side) signal
  - Independent cutoff envelope modulation for mono and stereo signals
  - Cutoff envelope modulation by side chain signal and threshold settings
  - Attack and release settings
  - Independent channel controls (l-mono/r-stereo)
  - Link mode for unified parameter control
  - Reaktor 5 compatibility
  - 3/4 inputs support
  - DAW compatibility (ableton live, logic, cubase, reaper, pro tools)
  - Ni maschine compatibility
  - Macos and windows support
