description: Beatmaker is an intuitive audio and MIDI workstation. Its
  streamlined workflow lets you perform and shape your ideas quickly and
  effectively.
details: |-
  Beatmaker is an intuitive audio and MIDI workstation. Its streamlined workflow
  lets you perform and shape your ideas quickly and effectively, turning your
  instruments into full productions.

  Inspirational performance tools such as repeat, roll, swing, key scales &
  chords and macro controls will boost your creativity tenfold. Take control of
  it all with your MIDI gear and the new smart binding system.

  128 banks of 128 pads, where each one of them is a full-fledged instrument
  with multiple dimensions. Record and chop live, assemble, mangle and resample:
  our state of the art sampling engine will sculpt your ideas, giving life to
  your instruments with a full modulation and layering system. With zplane's
  elastique live stretch and pitch shift, adjust your loops and instruments to
  match the tempo or go experimental. You can even integrate your favorite synth
  & effect apps with full auv3 and iaa support.

  The classic timeline based pattern & song editor gives all the modern
  sequencing features you'd want to arrange complete tracks. Adding to this
  foundation, the new flexible scene mode opens up opportunities for remixing
  and live performances, looping and arranging clips in new ways. All the
  patterns, automations and sequencing tools are available right where you would
  expect. Add audio tracks to the mix, stretch them, turn your arrangements into
  a complete masterpiece. You can even play in sync with other software using
  ableton link.

  Multi-channel recording & input/output routing is now a reality with the
  support of USB audio interfaces. Fine-tune your mix with the modern mixing
  board: every track, every pad has its own channel with unlimited effects and
  up to 8 sends. Add new depths to your sound with our palette of effects
  (internal or external auv3/iaa). Export your compositions and separated
  elements into single stems to share, re-use, re-work, re-master within a
  traditional studio setup.
