details: >-
  Our most comprehensive and powerful separation software, trax pro sp includes
  access to the latest breakthroughs in automated speech separation as well as
  the entire trax pro feature set.


  Recommended for isolating speech from full soundtracks, dialogue editing and
  easy denoising, audio restoration and professional vocal and instrument
  isolations.


  Separate, isolate or remove speech from full mixes. Equip your edit rooms and
  re-recording stages with the most advanced speech and melodic separation
  technology.


  Precisely edit and refine files with the integrated, fully conservative
  spectral editor.


  Audio engineers: gain the most advanced access to vocals, speech and lead
  melodies within mono or stereo files whether you work in post or music, trax
  pro 3 sp offers the most advanced solution.
specs: |-
  - Standalone application
  - Speech separation
  - Vocal and instrumental isolation
  - Mono and stereo support
  - Up to 192khz, 32-bit floating point audio files
  - Gpu-enhanced separation
  - Automatic consonants detection
  - Speech optimized pitchogram
  - Full-frequency spectral toolkit
  - Pan-specific spectral editor
  - Smart attenuate tool
  - Tonal / noise filter
  - Integrated pitchogram refinement tools
  - Conservative spectral editor
  - Macos
