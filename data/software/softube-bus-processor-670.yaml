description: A modern take on the legendary dual-channel variable-mu tube
  compressor that's just like magic, Bus Processor 670 is the Softube plugin
  version of a famous glue compressor. It gives weight, warmth, and authority to
  the any and every bus, from the drum bus to the mix bus.
details: |-
  This plug-in is the product of Softube's quest to discover where the magic of the mythological 670 hardware lies, and distil it. Modern, musical, and that special kind of magical, Bus Processor 670 delivers the unmistakable weight and warmth of the original. Plus, added saturation control, spatialization, and sidechain features for a flexible, modern workflow. Finally, this rare, sought-after, and expensive dual-channel variable-mu tube compressor has transcended its original form so it can transform your mix or master.

  Pricey and prized, fewer than a thousand 670s were ever made, and it was originally used as a mastering limiter for vinyl. With a characteristic vibe heard from Motown to Abbey Road, the unit is known for adding sound and harmonic distortion even when you don't do a thing. If you push it, it gives pump but, at its more subtle settings, the 670 is great for gluing things together in a warm, musical way. You can see why it's useful on everything from the mix bus to drums, vocals, and electric guitars, and has earned its place in top studios worldwide.

  Variable-mu compression uses tubes to alter gain, and the compression ratio changes dynamically in response to the signal level. The result is the harmonically rich and musical compression that has made the original 670 legendary. This style of vintage processing is great for gluing things together with analog warmth and cohesion, making it ideal for mastering as well as mixing.

  To create the Bus Processor 670 plug-in, Softube took the finest elements of the original and added its own wouldn't-it-be-cool-if ideas to make a totally unique tone machine. Starting with full control of saturation points with dedicated knobs for tube and transformer saturation, and a calibration knob to influence the unique compression-dependent saturation of the variable-mu architecture. Softube also included sidechain options that give you control over filters, tone shift and mono/stereo linking, as well as separate outputs for M/S channels. Then there are the new spatialization features that include air band, mono maker, and stereo widening knob.

  Full-featured but dead-simple to use, Bus Processor 670 lets you find the magical sound of the 670 for yourself, with a workflow fit for your modern studio.
specs: |-
  - A dual-channel variable-mu tube compressor
  - The essence of the legendary 670, distilled and made modern
  - Unmistakably weighty and warm, just like the original hardware
  - Added modern features, like saturation controls and spatialization features
  - Dedicated knobs for tube and transformer saturation
  - Calibration knob influencing the compression-dependent saturation of the variable-mu architecture
  - Sidechain options with filter, tone shift and mono/stereo linking controls
  - Separate outputs for M/S channels
  - Spatialization features: air band, mono maker, and stereo widening knob
  - Enhanced workflow for modern engineering and production processes
  - Supports Softube Extended Features panels
  - Console 1 ready: compatible with the Console 1 mixing system hardware
  - Flow Studio ready: compatible with Flow Studio hardware
  - Included in Flow Mixing, Mastering and Complete Suite subscriptions
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26; Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access for downloading installers and managing licenses
  - Three activations per license
  - 20-day trial, 14-day returns
