details: |-
  TAIP is an AI-powered tape saturator plugin by Baby Audio, described as the most faithful tape emulation plugin yet, based on machine learning. It adds silky warmth and analog saturation that begs to be driven hard.

  Tape recordings have a natural thickness and glue to their sound that digital mixes often lack. TAIP uses machine learning to faithfully recreate the characteristics of real analog tape.

  The plugin features a versatile feature set that lets you customize any tape flavor for any creative need, making it suitable for a wide range of mixing and production scenarios.
specs: |-
  - Machine learning-based tape emulation
  - Customizable tape flavor controls
  - Native Apple Silicon M-Chip support
  - 64-bit only
