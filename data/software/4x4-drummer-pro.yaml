details: >-
  4x4 drummer pro is an automated drum machine capable of generating tech
  house/techno/trance rhythms - it allows you to instantly generate exciting
  drum loops.


  Features include automated randomized drum machine with the ability to keep or
  change sounds like a poker machine, and live playable functionality in
  standalone mode or in ableton live.


  One mouse click to instantly generate 100 drum loops at a time (every key of
  the MIDI keyboard will be filled with a loop), with the ability to create
  loops in progressive musical order.


  Direct export to wav file for all loops with unique mouse click (from 4 to 32
  beats), with guaranteed synchronization with ableton live, cubase and fruity
  loops.


  Internal drum samples library can be changed with user sounds - point to user
  folders to pick kickdrums, claps & snares, hats, with a lot of factory sounds
  included. Includes standalone version for live performances, VST studio
  version (for cubase, ableton, fl studio, sonar, etc.), sounds bank, and
  documentation.
specs: >-
  - Stereo audio output at 16-bit/24-bit 44100hz

  - Accurate/precision timings

  - True stereo channels

  - Each channel can load samples at any sample rate and any bit rate
  (8-/16-/24-/32-bit)

  - Intellidrums v2.1 technology

  - Swing routine

  - Customizable sidechainer

  - Save loops to .wav files (16-/24-bit)

  - Ai randomizers

  - 10 filters (coded in asm)

  - VST plugin

  - Standalone version

  - MIDI recognition for external MIDI controllers

  - Bpm or host synchronization

  - Kick sidechained output
