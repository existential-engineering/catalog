details: |-
  Verberate immersive 2 is a surround and 3d capable edition of verberate 2 our algorithmic reverb plug-in that simulates real acoustical spaces with exceptional realism. Verberate immersive 2 replaces verberate surround and supports all common surround and immersive formats up to 7.1.6 channels.

  The new vivid hall algorithm adds time variance to avoid the stiffness that plagues convolution based reverbs while preserving the natural high density reverb tails of verberate surround 1. Verberate immersive 2 was developed in close cooperation with professionals in film and tv post production.

  Verberate immersive 2 offers complete and independent control over the panning of the dry sound, late reverberation and early reflections. The panners work in up to three dimensions and have adjustable divergence. The pan positions and divergences are visualized and adjusted in an intuitive way, thus simplifying automation of complex movements.

  The decay editor resembles a fully parametric equalizer and allows you to set frequency dependent reverb times quickly and effortlessly. Additionally, there are integrated and fully parametric input and output equalizers, each with five bands. A large catalog of beautiful factory presets is delivered with verberate immersive 2.

  Acon digital verberate immersive 2 is available for both windows (pc) and macos (macintosh). Both 32 and 64-bit versions are available, and the plug-in formats VST, vst3, AAX native / audiosuite and audio units (macos only) are supported.
