details: |-
  MixHead is a classic 90s style tape emulation. Rather than trying to be an absolutely faithful simulation of analog tape, it captures some of the key elements of the excitement that tape brings to the recording process without many of its downsides.

  It adds saturation and glue, making disparate elements across the audio spectrum jell together and sit in a mix, without dulling the high end or causing the audio to lose its transient response.

  While the original device was generally used as a mix bus processor and has not been available on the market for many years, MixHead can be used to great effect on the main bus, on groups and even on individual channels. The 3.75 IPS mode adds more aggressive tape distortion and frequency response, which can help with a lo-fi sound on a bus or simply beef up individual channels.

  The original device is a key component of Serban Ghenea's stereo mix bus, and he contributed a preset with the settings he most often used with it, which is included with MixHead. Three processing modes offer varying levels of EQ and distortion, there is a unique HF shelf, and over-sampling is user-selectable up to 16x.

  A +DSP version of the plug-in, running with zero latency on hardware, is included with all Metric Halo 3d audio interfaces. Licensing requires an iLok.com account, each license includes two activations, and the license may be installed on the machine, on an iLok dongle or in the iLok Cloud.
