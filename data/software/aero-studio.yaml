details: >-
  Aero studio by ioneo is an audio plugin host for windows. It can host VST
  plugins.


  Combines traditional piano roll/parameter automation editing with pattern
  editing (tracker style). Modular mixer model (complex chaining of plugins.
  Connect individual channels).


  Superior quality (every single calculation is done using 64-bits precision).
  Continuous event timing. Event chaining technology (perfect automation).


  Great visualizers (analyze the input and output of any machine with the high
  precision spectral graphs and vu meters). Render to 64-bit wav (every single
  calculation done using 64-bits precision).


  20 machines included (instruments & effects) - samplers, synths, compressor,
  limiter, filters/eq, reverbs, delays, flanger, distortion, etc.
specs: |-
  - VST plugin host
