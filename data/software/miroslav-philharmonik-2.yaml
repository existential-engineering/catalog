details: |-
  Miroslav Philharmonik 2 is an orchestral virtual instrument workstation from IK Multimedia, featuring over 2,700 stereo instruments captured in more than 58 GB of 24-bit/96kHz samples. The library was recorded at the legendary CNSO Studios in Prague, delivering authentic orchestral tones with a rich, classic character rooted in the legacy of Miroslav Vitous.

  The instrument offers a 16-part multitimbral architecture with 16 stereo outputs, providing flexible routing and layering for complex orchestral arrangements. It includes multi-articulation support with key-switch controls, allowing performers to switch between playing styles in real time. Four play modes are available: Poly, Mono, Legato 1, and Legato 2.

  Miroslav Philharmonik 2 includes 34 studio-quality effects, among them the ConvoRoom convolution reverb featuring a 3D GUI for intuitive spatial placement. Additional effects cover EQ and dynamics (Black 76, Model 670, Vintage EQ-1A, White 2A), modulation (Chorus C1, Electric Flanger, Rotary Speaker, Small Phazer, Uni-V), reverb and delay (Acoustic Resonance, Hall Reverb, Plate Reverb, Tape Echo), and utility processors (Piano Lid, Stereo Manager).

  The mixer interface provides a full 16-part mixing console with per-channel effect inserts, while the advanced synthesis and editing engine allows deep sound design with macro controls for quick parameter adjustments. The instrument runs as both a plugin and a standalone application.
