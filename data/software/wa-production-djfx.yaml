description: DJFX is a multi-effect plugin modelled on the effects found on DJ hardware, with six modules that can be stacked and run at the same time. Each module carries two styles, one close to the familiar hardware behaviour and one that pushes further.
details: |-
  DJFX brings the sweeping filters, distortions, rhythmic delays and reverbs associated with DJ hardware into the DAW, reimagined for production work. It is a collaboration between W. A. Production and BVKER.

  Where DJ hardware usually limits the user to one of these effects at a time, DJFX allows up to six to run simultaneously, so a chain can combine a pulsating Push-Cut, a gritty Bitgrind, a swirling Sweep, a Riser, an Echo and a Reflect reverb.

  At the centre of the plugin is the Master FX knob. It is bidirectional rather than a simple dry and wet control, morphing up to six chosen effects with a single twist, with one set of combinations clockwise and another counter-clockwise.

  Each of the six effects has two distinct styles, giving 12 movements in total. Sweep is a filter (Style A) with added flanging (Style B), Bitgrind offers sample rate and bit reduction (Style A) or sample-and-hold manipulation (Style B), Push-Cut compresses to the left and gates to the right in a classic (Style A) or wobbler-infused (Style B) form, Riser builds with filtered noise either clean (Style A) or distorted (Style B), Reflect covers classic wash reverb (Style A) and studio depth (Style B), and Echo provides vari-synced delays from classic dub (Style A) to alternative timings (Style B).

  Look-ahead limiting and automatic gain compensation keep the output clean. A Randomize button generates new settings, All Off and Zero switches reset the effects and the main knob, and AB comparison, copy and paste, and undo and redo are available. Factory presets supply complete effect chains as starting points.
specs: |-
  - Multi-effect processor for classic DJ effects
  - Bi-directional Master FX knob controls up to six effects at once
  - Six effects modules, each with two styles, for 12 movements in total
  - Effects: Sweep, Bitgrind, Push-Cut, Riser, Reflect and Echo
  - Randomize button for new settings
  - All Off button clears all effects
  - Zero button resets the FX knob
  - Look-ahead limiting and automatic gain compensation
  - AB comparison, copy and paste, undo and redo
  - Developed with BVKER
  - Manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Intel and Apple Silicon Mac CPUs supported, including native AAX
