details: |-
  The HOFA IQ-Series DeEsser is the best tool for editing harsh sibilance in vocals or in an entire mix. The specialised and very natural sounding voice recognition makes the IQ-Series DeEsser easy to use and very intuitive.

  HOFA IQ-Series DeEsser – DeEssing in its most natural form and a BUS mode that is second to none.

  The integrated voice recognition algorithm can control sibilants in a very transparent and effective way. The vocal sound remains natural and authentic, even with heavy processing.

  The groundbreaking BUS mode can control a selectable frequency range with extraordinary precision. This makes the IQ-Series DeEsser a game changer for mixing and mastering.
specs: |-
  - intelligent processing of high-frequency content
  - attenuation of aggressive frequencies in vocals, speech, instruments & entire mixes
  - very natural vocal sound, even with heavy gain reduction
  - great results with simple operation
  - custom-made voice recognition by HOFA for precise attenuation of unpleasant sibilance
  - 4 Modes for different applications: WIDE, DARK, PEAK and BUS
  - WIDE – the standard for successful vocal de-essing
  - DARK – perfect for bright vocals
  - PEAK – hissing and resonating sibilance are history
  - BUS – ideal for mix groups, mastering, stems and unbalanced vocal- & instrument sounds
  - Formats: VST3, AU, AAX
  - Operating System: macOS 10.13 or later, Windows 10 or later
  - Continuously tested on Ableton Live, Apple Logic, Avid Pro Tools, Bitwig, Cockos Reaper, Image Line FL Studio, Magix Samplitude/Sequoia, Fender Studio Pro, Steinberg Cubase/Nuendo/Wavelab
  - Two licenses per purchase, managed via the HOFA Plugins Manager, deactivatable and transferable to other computers
  - Offline activation and use supported, USB stick licenses work alongside USB licenses from other manufacturers
