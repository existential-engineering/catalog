description: Tymee is a free delay plugin with a built-in spectrogram for real-time visualization.
details: |-
  Tymee is a free delay plugin. Designed with simplicity in mind, it offers straightforward controls and quality sound.

  It features a 10 seconds delay line with tap tempo functionality, a down-sampler, a low-pass resonant filter and a built-in spectrogram for real-time visualization.

  You might wonder why a delay plugin would include a spectrogram. The truth is, Tymee was originally developed for teaching audio programming at a university, and incorporating a spectrogram into the workshop was valuable for educational purposes (and also because it looks great!).
