name: BassMatrix
manufacturer: kiwitechnics-group
primaryCategory: synthesizer
url: https://www.witech.se/#bassmatrix
description: BassMatrix is a synth that trying to sound like the classic tb-303
  bassline synth and provide a simple interface to program the patterns.
details: |-
  Normaly you want to use host sync to sync with your DAW and change the
  patterns with MIDI notes. There is also int. Sync that is useful when you play
  the synth standalone (there is a loop size knob for this purpose so you can
  automatically change patterns in live mode).

  The instrument is created with the dsp code from the open source project
  open303 (sourceforge.net/projects/open303). The implementation uses iplug2
  open source project (github.com/iplug2/iplug2) to interface with computers and
  DAW's.

  This bassmatrix instrument is also open source, so if you have a bugfix or
  feature please commit it to the open source project
  github.com/olawistedt/bassmatrix so we can improve it.

  As stand alone you can program 24 patterns and loop through them. Test it on
  the web first (olawistedt.github.io/bassmatrix) before you download.
specs: |-
  - MIDI play
  - Key sync
  - Host sync
  - Int. Sync
  - 24 patterns
  - Loop size control
  - Tb-303 emulation
  - Pattern sequencer
  - Arpeggio mode
  - Parameter automation
  - macOS support
  - Windows support
