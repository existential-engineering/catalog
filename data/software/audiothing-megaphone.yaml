description: Megaphone is a bullhorn / loudspeaker plugin emulation (VST, AU,
  AAX). It can be used to make any audio source sound as if it's being played by
  a megaphone.
details: |-
  Megaphone is a plugin that emulates an amplified bullhorn / PA loudspeaker. It features two loudspeaker emulations (Mode I and Mode II), feedback control (slapback echo), and a noise section. Megaphone can be used to make any audio source sound as if it's being played by a bullhorn.

  The feedback section is essentially a slapback effect. When using megaphones, the output of the loudspeaker can be captured again by the input microphone, introducing a delay/reflection and the usual feedback tones, which can be triggered with high gain sources and a feedback amount higher than 50%.

  The megaphone noises can be enabled by the Trigger button. There are two types of noise, Button and Burst, and the mix between them is balanced with the Source parameter. The button noise is the noise made by clicking on the megaphone button to enable its microphone, and the burst is the typical background noise of the loudspeaker. If the envelope is enabled, the Burst noise follows the transients of the input signal.

  Megaphone is available for macOS, Windows, and Linux (VST, VST3, AU, AAX, CLAP).
specs: |-
  - 2 Loudspeaker emulations
  - Overdrive + Bandwidth control
  - Feedback / Slapback
