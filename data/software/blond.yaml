details: |-
  With 4 plugins based on nearly impossible-to-find italian-made hardware from
  the 1950s through the 1980s, blond takes you on a fascinating sonic journey
  through the bel paese of yesteryear. This unique plugin suite that embodies
  unbelievably rare hardware units manufactured in italy up to 60 years ago.

  Eq model a: an extremely transparent 4-band eq, with 24 line-mic preamps that
  faithfully recreate the 1970s console experience as intended by one of the
  greatest italian designers in music history. Eq model b: a transparent
  "sontec-style" 4-band parametric eq from the 1980s that works wonders while
  mastering. It's transformer-based, juicy preamp offers you tons of sonic
  character to have experiment with.

  Based on unusual italian-made studio units from the 1960s, 70s, and 80s, its
  distinct palette of tones will function as a "mojo booster' for your mix.
  These basic, solid-state tubes, or fet units, show a heavily non-linear
  response, which means their effect is big and bold.

  The blond comp plugin is equipped with 5 different dynamics processors,
  including tube, optical, and fet models. The machines we sampled to create
  this plugin were often produced in minimal quantities, which means that these
  italian-made units are as rare as they get.
specs: |-
  - 4-band EQ (model a)
  - 4-band parametric EQ (model b)
  - 24 line-mic preamps
  - Transformer-based preamp
  - 74 preamp models divided into four banks
  - 5 different dynamics processors
  - Tube dynamics processor
  - Optical dynamics processor
  - Fet dynamics processor
  - Non-linear response
