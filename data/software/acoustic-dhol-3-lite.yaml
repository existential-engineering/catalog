description: Acoustic Dhol 3 Lite is the world's first and the most powerful and
  unique dhol drum synthesizer engine to create real indian dhol sound
details: |-
  Over 50 samples with numerous articulations. Ai powered dynamic rr with
  controllable velocity. Multiple effects such as eq, reverb, filter,
  compressor, saturation.

  Features: multi tab user interface. 2 layers with 2 different dhol kits. Over
  50 sound samples with articulations. Ai powered dynamic rr and velocity
  sensitivity. Comes with 5 factory presets.

  Sub oscillator engine for low frequency and for sub harmonic enhancement with
  saturation. Eq, filter, reverb, saturation and compressor effects.

  Lite version limitations: you can not save presets. 2 dhol kits & 1 sub osc.
  No dhol sequencer. No external MIDI drag & drop.
