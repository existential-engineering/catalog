details: |-
  The Ultimate FX Bundle is Antelope Audio's flagship plugin collection, packaging 35 world-class real-time effects designed for music production, tracking and live performance. It pairs the smooth warmth of iconic compressors and the precision of classic EQs with reverbs, delays and modulation effects for end-to-end mix coverage from a single bundle.

  Plugins run natively in any DAW on macOS or Windows, and also run with zero-latency performance on Antelope Synergy Core interfaces for tracking and live use. Five of the included plugins (Sonaverb, X902, Halo, InTune Performer, and bX3) are Native only.

  Modeled emulations cover legendary preamps (VPA76, BAE-1073, BAE-1073MP, BAE-1084, BAE-10DCF, RD47, UK-69), variable-mu and FET compressors (Tubechild670, COMP-4K-STRIP, COMP-4K-BUS, Tube 176, Gyratec X, BA-6A, MG4+), and classic EQs (LANG-PEQ2, VEQ-4K BLACK, VEQ-56, VEQ-432C, Gyratec XIV, Filtek MK3, Blonder Tongue Audio Baton, Liverpool), alongside a Reel-To-Reel tape machine.

  Creative and modulation tools include BBD-Chorus, V12 Chorus, Vari-Speed Tremolo, Adaptive Vibrato, Space Flanger, Memory Cat Brigade and the VP Brainiac II vocoder, plus the Halo multitap delay and Sonaverb reverb. Vocal-focused processors include the X902 de-esser, InTune Performer pitch correction, and the bX3 vocal processor.

  All 75+ Antelope Native plugins can additionally be unlocked via an Antelope Cosmos subscription; the Ultimate FX Bundle is offered as a perpetual-license bundle for users who prefer a one-time purchase.
specs: |-
  - 35 real-time and native audio plugins in one bundle
  - Runs natively in a DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core interfaces with zero-latency performance
  - Includes preamps, compressors, EQs, tape, modulation, delay, reverb, de-esser and pitch correction plugins
  - Five plugins are Native only: Sonaverb, X902, Halo, InTune Performer, bX3
  - Bundled plugins: VPA76, Tubechild670, Reel-To-Reel, COMP-4K-STRIP, BAE-1084, BBD-Chorus, Vari-Speed Tremolo, Sonaverb, X902, Halo, BAE-1073MP, COMP-4K-BUS, Gyratec X, Adaptive Vibrato, LANG-PEQ2, VEQ-4K BLACK, Tube 176, VEQ-56, Gyratec XIV, InTune Performer, VP Brainiac II, V12 Chorus, RD47, MG4+, BA-6A, BAE-10DCF, BAE-1073, Liverpool, Space Flanger, Blonder Tongue Audio Baton, Filtek MK3, VEQ-432C, Memory Cat Brigade, UK-69, bX3
