description: A channel strip with a-type EQ, filters and 436 style compressor.
  It has lots of capabilities for tone shaping with its own custom design.
details: |-
  A channel strip with a-type EQ, filters and 436 style compressor. It has lots
  of capabilities for tone shaping with its own custom design and internal
  routing.

  There is no line or mic preamp as an input module but input knob will drive eq
  circuit's gain trim to get nasty op-amp saturation.

  Compressor section based on 436c with extra modifications. Compressor has
  amount knob to compression and make-up gain. So, it will be gain compensated.

  Hpf & lpf: a-type filters. Hpf 20hz to 600hz. Lpf 20khz to 500hz. Equalizer:
  a-type 3 band inductor based eq.

  Compressor: 436c style compressor with modified attack and release times.
  Also, amount knob will adjust compression amount and make-up gain at the same
  time. Each modules have their own bypass buttons.
specs: |-
  - A-type EQ
  - A-type filters
  - 436 style compressor
  - HPF 20hz to 600hz
  - LPF 20khz to 500hz
  - 3 band inductor based EQ
  - Input knob with op-amp saturation
  - Amount knob for compression and make-up gain
  - Gain compensated compressor
  - Individual module bypass buttons
  - Master volume control
  - Custom internal routing
