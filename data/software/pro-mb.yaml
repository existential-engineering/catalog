description: FabFilter Pro-MB is a professional multiband compressor and
  expander plug-in. Available in VST, VST3, AU, CLAP, AAX and AudioSuite formats
  for Windows and macOS.
details: |-
  Multiband compression and expansion are powerful tools, but notoriously difficult to set up and control. Enter FabFilter Pro-MB: making multiband dynamics processing intuitive yet powerful at the same time.

  Instead of conventionally splitting the entire spectrum with crossovers, Pro-MB enables you to directly create a new band at the frequency range you want to work on. Think bands, not crossovers. The interactive multiband display clearly shows that the rest of the spectrum stays untouched. And if desired, you can easily snap bands together to recreate a traditional crossover system.

  FabFilter Pro-MB introduces a unique Dynamic Phase processing mode. It has virtually the same frequency response as traditional multiband processing, but doesn't introduce latency or pre-ringing, and only introduces minor phase changes when the gain actually changes. Of course, we have also included an excellent Linear Phase mode and a traditional Minimum Phase mode.

  The powerful combination of high quality processing, optimized workflow using the interactive multiband display and all the expert features you need, makes Pro-MB both a lifesaver and timesaver.
specs: |-
  - Up to six processing bands, freely placed anywhere in the spectrum
  - Bands can be snapped together to form a traditional crossover system
  - Handles any form of dynamics processing from transparent compression to punchy gating
  - Unique Dynamic Phase processing mode with zero latency and no static phase changes
  - Excellent Linear Phase processing mode
  - Minimum Phase processing mode
  - Up to four times linear-phase oversampling
  - Fully customizable per band: threshold, range, attack, release, output gain, ratio, variable knee, lookahead, stereo linking
  - Crossover slope adjustable between 6 dB/oct and 48 dB/oct
  - Intelligent program- and frequency-dependent attack and release curves
  - Global dry/wet mix from 0% to 200%
  - Beautiful Retina interface with interactive multiband display
  - Real-time frequency analyzer with pre- and post-processing options
  - High-quality 64-bit internal processing
  - GPU-powered graphics acceleration
  - Sample-accurate automation of all parameters
