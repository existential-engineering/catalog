details: |-
  Abbey Road One: Grand Brass is designed to be the iconic sound of cinema.
  Performed by London's first-call session players, grand brass offers you
  exceptional performances of horns and tuba, as well as the idiomatic pairing
  of horns and cellos, beautifully orchestrated to allow you to create moving,
  stately, and momentous melodic lines.

  This diverse collection of techniques, including shorts, powerful longs,
  purposeful swells, and spitfire audio's new easy-to-use legato patches, are
  essential for creating heroic drama and distinctive themes, all recorded in
  the iconic space of studio one.

  Grand brass elegantly captures expert performances of four horns, supported by
  a deeply resonant tuba, sounding an octave below. For ultimate control,
  articulations such as legato, long, staccato, tenuto, as well as short,
  medium, and long swells are present and easily accessed via our dedicated
  plug-in.

  Spitfire's majestic four-horn section is combined with an enchanting ensemble
  of ten cellos, presented in both soaring long and soaring legato patches for
  exclusive control. Composers from gustav holst to john williams have used the
  idiomatic pairing of brass and strings for its characteristic mellow and rich
  timbre, which elegantly represents these instrument's 'cantabile' or 'singing'
  ranges.

  With a beautiful, modern design, grand brass and all of the abbey road one
  selections are housed in our award-winning plug-in, which loads directly into
  all major daws (vst2, vst3, AU, AAX & nks-compatible) without the need for any
  additional software.
