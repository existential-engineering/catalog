description: "MIDI generation plugin using procedural generation to create
  songs, melodies, chords, and arrangements with transparent musical rules and
  user control across up to 6 simultaneous tracks."
details: |-
  Generate up to 6 simultaneous tracks: melody, riff, ostinato, rhythm, bass, pad, chord, drums. 8 scenes per song section. One-click song generation. MIDI import and drag-and-drop. Slash chord support and advanced chord detection. Range control. Comprehensive piano-roll MIDI editing. Multiple scale support including exotic options.
specs: |-
  Windows 8+. macOS 10.13+. Compatible with FL Studio 12+, Cubase 10+, Ableton Live 9+, Logic Pro X.
