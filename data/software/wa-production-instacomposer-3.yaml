description: MIDI generation plugin that creates songs, chords, riffs and rhythms from configurable musical rules using procedural generation. Adds song section architecture, DAW playback sync, one click song generation and MIDI import across up to six simultaneous tracks.
details: |-
  InstaComposer 3 is a MIDI generation plugin rebuilt around a songwriting workflow. It uses transparent procedural generation, where every song, chord, riff and rhythm comes from configurable musical rules, and the maker states that nothing in it is trained on copyrighted material.

  Song structure is the main addition. Material is organised into multiple song parts, each holding its own scenes and tracks, and generated content can follow the DAW playhead across those sections. One click assembles a full arrangement of intro, verse, pre-chorus, chorus, post-chorus, bridge, breakdown and outro.

  Harmonic handling is deeper in this version. Slash chords allow a non root bass note to be assigned to any chord, giving voicings such as G/B or A/C sharp. The chord editor allows chord partitions to be dragged and resized, and chord, progression, scale and tonal centre detection runs over generated, manually entered or imported MIDI.

  MIDI files can be loaded or dragged into the plugin to start an idea or to blend with generated content, and a range control sets upper and lower bounds for generated notes. Up to six simultaneous tracks cover melody, riff, ostinato, rhythm, bass, pad, pad 2, chord and drums, with eight scenes available for variations inside one preset.

  The onboard piano roll allows generated output to be moved, duplicated and trimmed before export, and finished songs or individual tracks drag and drop into a DAW as MIDI. Scale support spans standard major and minor, pentatonics and exotic scales such as Spanish and Arabic, and the preset library covers individual chords and full chord sequences.
specs: |-
  - Next generation MIDI generation plugin
  - Creates songs, melodies, phrases, riffs and chords
  - Six tracks generated simultaneously
  - Up to eight scenes per song section
  - Dedicated song section architecture with intro, verse, pre-chorus, chorus, post-chorus, bridge, breakdown and outro
  - One click song generation
  - Song sync to DAW playback
  - Slash chord support
  - Drag and resize chord partitions in the chord editor
  - Chord, chord progression, scale and tonal centre detection
  - MIDI import and blending with generated content
  - Range control for upper and lower note bounds
  - Multi track and multi channel MIDI routing
  - Comprehensive piano roll MIDI editing
  - MIDI drag and drop export
  - Multiple time signatures
  - Controls for probability, complexity and variation
  - Factory presets covering chords and full chord sequences
  - Full PDF manual and tutorial video
  - Windows 8 and later
  - macOS 10.13 and later
