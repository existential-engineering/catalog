details: |-
  A-pian by acousticsamples is a virtual instrument audio plugin for macos and windows. It includes, and is therefore "powered by", uvi workstation, which functions as a VST plugin, an audio units plugin, a VST 3 plugin and an AAX plugin.

  The a-pian grand piano is an old french gaveau piano. Gaveau was a french piano manufacturer. The company was established in 1847 in paris and used to be one of the three largest piano makers in france. This particular piano was built in 1960 and is referred to as a "crapaud" ("petite grand" in english), which means that it's a little smaller than a "quart de queue" (baby grand).

  It has a very particular sound, very bright and full of inharmonicity in the bass due to the short length of the strings. This library was the first attempt at finding new ways of sampling a piano, with efforts to reduce the size while keeping the most important parts.

  Features include 820mb of content with 232 samples, 3 velocity layers for the sustain, 3 velocities for the release, pedal down resonance and true pedal action, key noises samples, and sustain pedal noises (up and down) triggered automatically.

  Advanced uvi scripting gives access to a simple yet powerful interface and advanced features.
