description: DirectX/VST 10-band mastering linear-phase parametric equalizer with unique continuous-slope shelving and low/high cut filters for punchy lows and silky highs.
details: |-
  The LinearPhase PEQ Red does not shift the phase. It only boosts or cuts the
  amplitude in a given frequency range. Consequently, you can apply much more
  boost without changing the sound character of your recording. Due to the
  proprietary low-noise filter design in the frequency domain, the distortions
  (THD+N) are extremely low, ensuring crystal clear sound quality.

  Almost all parametric equalizers are implemented with filters that accomplish
  phase shift. The result is that a nice sharp bass drum becomes slurred and
  muddy, and vocal tracks become strident or brittle. The LinearPhase PEQ Red is
  a true remedy against difficult equalizing tasks.

  The LinearPhase PEQ Red features the Continuous Slope Filter technology,
  proprietary to Algorithmix and the only one of its kind worldwide. Unusual
  flexible shelving and cut filters allow adjustment of any slope in the range
  from 0 to 24dB/octave.

  You can boost lower frequency regions by even 10dB without mud or slush and
  with no loss of transients at all. You can remove the sibilance from a vocal
  with a sharp notch without affecting the whole mix.

  The LinearPhase PEQ Red works in the frequency domain. It perfectly performs
  with up to 384kHz and allows extended frequency setup up to 80kHz, making it
  perfectly applicable for high-resolution DSD post-processing.
specs: |-
  - 10-band linear-phase parametric equalizer
  - Proprietary Continuous Slope Filter technology
  - Shelving and cut filter slopes from 0 to 24dB/octave
  - Works in frequency domain
  - Supports sampling rates up to 384 kHz
  - Extended frequency setup up to 80 kHz
  - Extremely low THD+N distortion
  - Compatible with Sequoia, Samplitude, Pyramix, WaveLab, Adobe Audition, Nuendo, Cubase
