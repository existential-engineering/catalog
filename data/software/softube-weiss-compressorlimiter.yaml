description: A modern and transparent compressor and limiter plugin. Like Softube's
  other Weiss plugins, the Compressor/Limiter has the same digital compression
  and limiting algorithms as the gold-standard in mastering, the Weiss DS1-MK3.
  It's an essential mastering plugin for any serious mastering engineer.
details: |-
  The name Weiss is synonymous with quality in mastering, and a truly exceptional compressor/limiter is essential to any serious mastering engineer. The Weiss DS1-MK3 is the gold-standard for the world's greatest mastering gurus, and for the Weiss Compressor/Limiter, Softube draws on its essence (and code-base) to bring a totally focused modern answer to the question 'how should I deal with dynamics on my mix bus?'

  The Weiss Compressor/Limiter contains the same digital compression and limiting algorithms as the top-of-the-line Weiss DS1-MK3 plug-in, so you get the very same sound-quality. New hi-res visuals, including waveform view and FFT readouts, mean you can see your work, and the effect you're having, with greater clarity than ever before. All the most vital controls are at your fingertips in an all-new interface, while access to the epic detail of the Weiss processing sits in an 'expert' side-menu.

  Loved and needed in equal measure by top mastering engineers around the globe, the DS1 was first introduced in hardware in the early 1990s, and has continued to command pride of place in the best mastering facilities there are. Due to its enormous desirability the hardware will set you back around $10,000, so distilling its essence in this suite of plug-ins for a fraction of the cost felt like a very Softube mission indeed.

  The mastering stage is the last chance to make or break a track, so getting it right can be the difference between a battle won or lost. That is why the startling transparency and effectiveness of the Weiss digital compression algorithms, and its unrivalled versatility in terms of detailed control over attack and release times, knee settings, ratio, threshold, filters (low pass and band pass), and other crucial factors, are a must-have. With two brand-new advanced limiter algorithms on top of the Weiss original (including the Type 2 true peak limiter), you have more top-of-the-line options with Weiss than ever before.

  This being a plug-in, you can run as many instances of it as you like, so there is nothing to stop you using its uniquely clear and precise character on individual instrument tracks. Take a bass guitar, for example, through the Compressor/Limiter with a low-pass filter applied, to compress only the lowest frequencies and fatten out the body of the instrument. Or use the Compressor/Limiter on a vocal in conjunction with the Deess, for perfectly tailored dynamics processing across the frequency range.
specs: |-
  - A modern and transparent digital compressor and limiter, with code-ported algorithms from the industry standard DS1-MK3
  - Total control, without an over-complicated interface. The 'expert' tools are all in a hidden side-menu
  - Stunning and intuitive visualisations for detailed control, and an intuitive experience
  - Clean tweak-and-go faceplate, with immensely detailed controls hidden in side-menu
  - Ultra-professional tool, but without the daunting, complex look
  - Compress selectively, with low pass and band pass filters
  - Two brand-new advanced limiter algorithms in addition to the Weiss original
  - Hi-res visuals including waveform view and FFT readouts
  - Supports Softube Extended Features
  - Console 1 Ready: can be used within the Console 1 mixing system
  - Available as a single plug-in, or as part of the Weiss DS1-MK3 collection
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26
  - System requirements: Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access for downloading installers and managing licenses
  - Three activations included
  - 20-day trial, 14-day returns
