description: A new class of synthesizer designed specifically for creating powerful 808-style sub-bass for hip-hop, future bass, and trap production. Combines a sample engine, an analog-style synth engine, and the proprietary X-Sub™ psychoacoustic technology to deliver hard-hitting sub-bass that sounds punchy on every speaker, every time. Get all the tools you need to sample, layer, widen, and distort any kick into a uniquely powerful sub in one plug-in.
details: |-
  Three sound engines: Synth (sine, triangle, sawtooth, square wave oscillators), Sample (250 factory kicks and 808s with drag-and-drop support, delayed start, loop mode, internal maximizer, lo/hi-cut filtering), and X-Sub™ (psychoacoustic sub-bass oscillator that maintains consistent deep subs across all bass notes)

  Four distortion modes: Darkdrive (Fatness control), Overdrive (Tone control), Grunge (Fizz control), Tube (Heat control) — with visualizer and parallel mix controls

  Compressor with auto-sidechain and parallel mix control

  Analog-modeled filter with low pass, band pass, and high pass shapes and parallel mix control

  Frequency meter displaying synth, sample, and X-Sub engine frequencies overlaid across three key frequency bands; master maximizer and true peak meter

  6 signature Bass Packs: Richie Souf Signature Subs, Hits DNA Vol. 1, Divine Bass, Crushed, Analog Machines, Pure Subs

  250 bonus kick drum and 808 samples recorded from classic hardware including Roland TR-808, Roland TR-707, JoMoX MBase 11, Dave Smith Tempest, Korg Volca Kick, Vermona Mono Lancet '15, Waldorf Blofeld, Mutable Instruments Plaits, and more

  NKS ready for Native Instruments Maschine and Komplete Kontrol

  Fully resizable interface, editable glide curves, BPM-synced glide times, favorites patch system

  Activation code for up to three computers; requires internet connection to activate, offline use after
specs: |-
  - macOS 10.13 or higher
  - Windows 8 or higher
  - 64-bit only
  - Available as VST2, VST3, AU, AAX
  - Tested in FL Studio, Ableton Live, Logic Pro, Studio One, Pro Tools, Cubase
  - NKS ready for Native Instruments Maschine and Komplete Kontrol
  - Internet connection required for activation; offline use after activation
