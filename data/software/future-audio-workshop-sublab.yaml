description: Built to create hard-hitting 808 style sub-bass. A new class of synthesizer designed for hip-hop, future bass and trap genres, giving you the tools to sample, layer, widen and distort any kick into a uniquely powerful sub in one plug-in.
details: |-
  Three sound engines. An analog style synth engine with sine, triangle, sawtooth and square wave options. A sample engine with a factory library of 250 kicks and 808s plus drag and drop for your own samples, delayed sample start for creating delayed 808s, an internal maximizer for expanding and distorting, loop mode so any sample can be sustained, and lo-cut and hi-cut filtering for sculpting. And the X-Sub engine, a newly developed psychoacoustic sub bass oscillator that always keeps your notes in the sub range and lets you control the exact harmonics to create the perfect sub bass.

  Four distortion modes: Darkdrive with a Fatness control, Overdrive with a Tone control, Grunge with a Fizz control and Tube with a Heat control. Each has a visualizer to display how the distortion is working, lo-cut and hi-cut filters for post filter distortion, and mix amount controls for parallel distortion. A compressor adds an auto sidechain button so the kick punches through, again with mix controls for parallel compression, and the analog modelled filter offers low pass, band pass and high pass shapes with parallel mix controls.

  The meter and master section shows a frequency and note cursor display with the Synth, Sample and X-Sub engine frequencies overlaid, divided into the three most important frequency bands, alongside a master maximizer for expanding and fattening and a true peak value meter for clipping control.

  SubLab ships with six signature Bass Packs: Richie Souf Signature (808 sounds produced by Atlanta's Richie Souf, who works with Future, Young Thug and Gunna), Hits DNA Vol. 1 (top 808 sounds of the moment rebuilt from scratch in SubLab, including 808s from ScHoolboy Q, 21 Savage and Post Malone), Divine Bass (smooth 808s and deep dark subs by YouTube trap production educator Sean Divine), Crushed (the heaviest distorted 808 basses), Analog Machines (warm analog sounds recreated in SubLab) and Pure Subs (the purest of subs to layer in when your track already has a kick drum).

  A bonus sample pack of 250 meticulously recorded kick drums, kick transients and 808s is bundled in, sampled from analog drum machines and modules including the Roland TR-808, Roland TR-707, Waldorf Blofeld, Jomox MBase 11, MFB 522, Nord Lead, Noise Engineering Basimilus Iteritas, Befaco Kickall, Intellijel Dixie, Hexinverter BD9, Mutable Instruments Plaits, Dave Smith Tempest, Korg Volca Beats, Korg Volca Kick and Vermona Mono Lancet '15. Patch browsing gives every patch pack an icon for easy search, a favourites category, and the ability to create your own patch packs. The interface is fully resizable, with editable glide curves and BPM synced glide times. You receive an activation code instantly which allows you to use SubLab on up to three computers at a time, and there is a 30 day full refund policy.
specs: |-
  - Available as VST2, VST3, AU, AAX
  - Tested in FL Studio, Ableton Live, Logic, Studio One, Pro Tools and Cubase
  - NKS ready for Native Instruments Maschine and Komplete Kontrol
  - Compatible with Mac OS 10.13 and higher
  - Compatible with Windows 8 and higher
  - Can be used offline, but an internet connection is required to activate
  - Activation code covers up to three computers at a time
  - 3 sound engines: Sampler, Synth and X-Sub
  - 6 signature Bass Packs included
  - 250 bonus kick and 808 samples
  - Fully resizable interface, editable glide curves, BPM synced glide times
