description: "A synthesizer designed specifically for creating powerful
  808-style sub-bass for hip-hop, future bass, and trap production. Combines
  sampling, synthesis, and proprietary X-Sub psychoacoustic technology to
  deliver punchy sub-bass that translates across every speaker system. Features
  a synth engine with sine, triangle, sawtooth, and square waves, a sample
  engine with 250 factory samples, multiple distortion modes, compressor with
  auto-sidechain, and analog-modeled filter."
details: |-
  Sine, triangle, sawtooth, and square wave oscillators

  Proprietary psychoacoustic sub-bass oscillator maintaining consistent deep subs across all bass notes

  250 factory samples, drag-and-drop custom sample support, loop mode, internal maximizer

  4 modes: Darkdrive, Overdrive, Grunge, Tube with visualization and parallel processing

  Compressor with auto-sidechain, analog-modeled filter, frequency meter

  Fully resizable, editable glide curves, BPM-synced parameters, favorites system

  6 signature Bass Packs (Richie Souf, Hits DNA Vol.1, Divine Bass, Crushed, Analog Machines, Pure Subs), 250 sampled kick drums and 808s from classic hardware

  Internet connection required for activation, offline use after
