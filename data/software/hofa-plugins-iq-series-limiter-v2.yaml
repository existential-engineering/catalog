details: |-
  The HOFA IQ-Series Limiter V2 is the mastering limiter that allows you to achieve maximum transparency even when going for high loudness. The XY pad allows you to enhance the sound with harmonics and musical pumping. Maximum transparency. Maximum loudness. Maximum sound. Innovative, focused user interface with XY pad Extensive LUFS metering for absolute control IQ-Series Limiter V2 Trailer 6 outstanding algorithms The name says it all: in Transparent mode , the limiter works almost inaudibly and prevents distortion efficiently. This mode is ideal for all genres in which natural sound is more important than maximum loudness. Hard mode , on the other hand, was developed for maximum loudness. It makes transients sound very direct, and harmonics intensify the sound in any way you like – perfect for heavy genres. Bass-heavy music needs its own mode. The IQ-Series Limiter V2 offers the Electronic mode especially for this. With low-frequency audio, it delivers a particularly powerful sound without interfering artifacts. You can also choose from the award-winning Fast, Med and Slow algorithms from the previous version. This means that the limiter is fully downward compatible. Innovative user interface Shape the limiter’s sound by simply using the XY pad, without worrying about countless technical parameters. Moving on one axis, you can change the sound more towards clipping. Adding more harmonics results in a squarer visualization. The other axis softens the sound and modifies it towards “musical pumping”. Here, too, the visualization in the background provides you with visual control. By combining the two parameters in the XY pad, you can quickly achieve the optimal setting for your production – from perfectly transparent to extremely heavy or somewhere in between. Precise metering An informative metering section lets you always keep an eye on the loudness. You can see the level reduction, output level, loudness, loudness range and true peak. Clicking on these values reset
