description: Achieve transparent, loud masters with the HOFA IQ-Series Limiter V2, featuring XY pad control, LUFS metering, True Peak protection and 6 algorithms.
details: |-
  The HOFA IQ-Series Limiter V2 is a next-generation true peak mastering limiter designed to deliver maximum transparency and maximum loudness simultaneously. It functions as both a professional mastering tool and a creative sound design instrument.

  Six processing algorithms cover a wide range of use cases: Transparent (inaudible limiting), Hard (maximum loudness), and Electronic (optimized for bass-heavy music), plus three legacy modes — Fast, Med, and Slow — retained for full backward compatibility with projects created using the original IQ-Limiter V1.

  The signature XY Pad interface is available in Transparent and Hard modes and combines two musical parameters: the Clip axis (Y-axis) adds harmonics and saturation for more punch and presence, while the Pump axis (X-axis) shifts the sound toward a musical pumping effect for softer, more dynamic character. Real-time visualization in the XY pad reflects these changes graphically — more Clip produces an edgier, more jagged background; more Pump produces wider gaps between the dynamic circles.

  A comprehensive metering suite conforms to EBU R 128 and includes short-term LUFS, integrated LUFS, loudness range (LRA), true peak measurement, and a time chart displaying input, output, gain reduction, and short-term loudness over time.

  Additional features include a channel link slider (0–100%, with surround support above 100%), DC cut (5 Hz high-pass filter), oversampling from 2x to 8x, true peak limiting to prevent intersample peaks, dither for lower bit-rate exports, and an external sidechain input.

  The plugin is developed at HOFA-Studios in Karlsdorf, Germany. Licensing is handled via the HOFA Plugins Manager, with two licenses per purchase, offline activation support, and license transferability between computers. A 14-day free trial is available.
specs: |-
  - Formats: VST3, AU, AAX
  - Operating System: macOS 10.13 or later, Windows 10 or later
  - Six algorithms: Transparent, Hard, Electronic, Fast, Med, Slow
  - XY Pad with Clip (Y-axis) and Pump (X-axis) parameters
  - EBU R 128 metering: short-term LUFS, integrated LUFS, loudness range (LRA)
  - True peak measurement with intersample peak prevention
  - Time chart: input, output, gain reduction, short-term loudness
  - Oversampling: 2x to 8x
  - DC cut at 5 Hz
  - Channel link slider: 0–100% (surround support above 100%)
  - External sidechain input
  - Dither function for lower bit-rate exports
  - Fully backward compatible with IQ-Limiter V1 projects
  - Tested DAWs: Ableton Live, Apple Logic, Avid Pro Tools, Bitwig, Cockos Reaper, Image Line FL Studio, Magix Samplitude/Sequoia, Presonus Studio One, Steinberg Cubase/Nuendo/Wavelab
  - Two licenses included; managed via HOFA Plugins Manager
  - Offline activation supported
