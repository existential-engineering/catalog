description: Achieve transparent, loud masters with the HOFA IQ-Series Limiter V2, featuring XY pad control, LUFS metering, True Peak protection and 6 algorithms.
details: |-
  The HOFA IQ-Series Limiter V2 is the mastering limiter that allows you to achieve maximum transparency even when going for high loudness. It can also be used effectively as a sound design tool to add more punch, saturation and musical pumping.

  Six algorithms are available. In Transparent mode the limiter works almost inaudibly and prevents distortion efficiently, which suits genres where natural sound matters more than maximum loudness. Hard mode was developed for maximum loudness, making transients sound very direct while harmonics intensify the sound. Electronic mode is aimed at bass-heavy music, delivering a powerful sound with low-frequency audio without interfering artifacts. The award-winning Fast, Med and Slow algorithms from the previous version are also included, so the limiter is fully downward compatible and older projects created with the IQ-Limiter V1 sound identical.

  The sound is shaped with an XY pad instead of countless technical parameters. One axis (Clip) moves the sound towards clipping, adding harmonics and resulting in a squarer visualization; the other axis (Pump) softens the sound and modifies it towards musical pumping. Combining both parameters lets you move from perfectly transparent to extremely heavy limiting, with the background visualization giving real-time visual control over what the processing is doing.

  An informative metering section shows level reduction, output level, loudness, loudness range and true peak in accordance with EBU R 128 (Short Term LUFS, Integrated LUFS, Loudness Range and True Peak), and clicking a value resets its display. A time chart plots input, output, gain reduction and short-term loudness along a timeline. A channel link slider sets how much the left and right channels influence each other, from 100% for a stable stereo image down to 0% for fully independent processing; for surround productions stereo pairs are coupled, and values above 100% also link the centre channel.

  Additional features include a DC cut that removes frequencies below 5 Hz to free up headroom, a True Peak function that avoids the distortion intersample peaks can cause on playback devices, dither for exporting at lower bit rates with the limiter last in the chain, oversampling to reduce aliasing (values between 2x and 8x are recommended to keep CPU load in check), and an external sidechain input. The plugin was developed as part of everyday work at the HOFA-Studios in Karlsdorf.
specs: |-
  - Six limiting algorithms: Transparent, Hard, Electronic, Fast, Med, Slow
  - XY pad with Clip (Y-axis, harmonics and saturation) and Pump (X-axis, musical pumping) parameters
  - Real-time visualization of signal changes behind the XY pad
  - True peak limiting with intersample peak protection
  - EBU R 128 metering: Short Term LUFS, Integrated LUFS, Loudness Range (LRA), True Peak
  - Time chart showing input, output, gain reduction and short-term loudness over time
  - Channel link slider from 0% to above 100%, with stereo pairs coupled for surround productions
  - DC cut filter at 5 Hz
  - Dither for export at lower bit rates
  - Oversampling, 2x to 8x recommended
  - External sidechain input
  - Backward compatible with IQ-Limiter V1 projects and presets
  - Two licenses managed via the HOFA Plugins Manager, offline activation supported
  - Formats: VST3, AU, AAX
  - Operating system: macOS 10.13 or later, Windows 10 or later
