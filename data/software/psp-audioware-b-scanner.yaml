description: PSP B-Scanner is an emulation of the analog scanner-based effect available in the most sought-after models of vintage Hammond tonewheel organs. Although PSP B-Scanner has been meticulously designed to recreate the classic sound of the Hammond B-3 Vibrato and Chorus, it offers a wide range of options allowing you to maximize the potential of this unique effect.
details: |-
  PSP B-Scanner is an emulation of the analog scanner-based effect available in the most sought-after models of vintage Hammond tonewheel organs (such as B-3, C-3, A-100 and others).

  Although PSP B-Scanner has been meticulously designed to recreate the classic sound of the Hammond B-3 Vibrato and Chorus, it offers a wide range of options allowing you to maximize the potential of this unique effect.
