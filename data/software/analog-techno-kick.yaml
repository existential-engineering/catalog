details: >-
  Analog techno kick has 243 phat techno kicks sampled from different analog
  drum machines such as jomox, roland tr and many many others.


  It's possible also to mix sounds to create new kicks.


  Analog techno kick pro is powered with a low harmonic boosting psychoacoustic
  algorithm from syncersoft to enrich low frequencies, essential for the sound
  of the kick drum.


  It also allows pitch control of samples.
specs: |-
