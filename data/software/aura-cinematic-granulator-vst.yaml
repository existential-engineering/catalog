details: |-
  Aura granulator VST transforms any audio into breathtaking cinematic textures,
  giving you the power to sculpt soundscapes. Perfect for producers, sound
  designers, and musicians, aura offers an intuitive interface loaded with
  cutting-edge features.

  Prepare to be amazed as you effortlessly transform your audio files into
  captivating, ever-changing soundscapes. Just drop your file into the interface
  and experience the magic unfold before your eyes and ears. Whether it's a
  powerful drum loop, catchy melody loop, or an entire song, aura will magically
  turn it into a breathtaking, ethereal, and rich audio experience.

  Harness the power of the advanced particle generator in aura to transform
  sound like never before! With built-in lfos (sync and ms modes, tremolo, and
  panner), you can create mind-blowing modulations that will leave you amazed in
  no time.
