description: AlgoRec is a WAV hard disk recorder that records directly to hard
  disk according to the red-book standard (16-bit 44.1 kHz stereo), with
  recording time limited only by available disk space. It includes a built-in
  lossless real-time compression engine (AlgoPress) that can save up to 60% disk
  space, along with a professional digital DC-removal filter in the recording
  path.
details: |-
  AlgoRec permits easy recording of audio files according to the red-book standard
  (16 bit 44.1 kHz stereo), making it ideally suited as an add-on to CD recording
  programs. Unlike the Windows audio recorder, AlgoRec records directly to the hard
  disk, allowing recording of very long audio files with the only limitation being
  the amount of available free disk space.

  AlgoRec includes the real-time compression engine AlgoPress built-in, saving
  hundreds of megabytes of storage space. AlgoPress preserves the original data
  during compression — after decoding, the samples are exactly the same as before.
  The achieved compression rate can be up to 60% for typical audio data.

  To avoid low-signal distortion and decreased dynamic range arising from
  low-quality analog-to-digital converters, a professional digital DC-removal filter
  is integrated into the recording path.

  For users who don't need compression or a DC-removal filter, AlgoRec compact is a
  lower-priced alternative version of the product.
specs: |-
  - WAV recording format (red-book standard: 16-bit, 44.1 kHz stereo)
  - AlgoPress lossless real-time compression engine (up to 60% compression)
  - Professional digital DC-removal filter in recording path
  - Unlimited recording time (limited only by available disk space)
