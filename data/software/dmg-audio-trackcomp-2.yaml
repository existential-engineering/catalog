description: "TrackComp 2 spans nine classic hardware compressors across
  pro-audio history, from filthy and distorted to invisible and clean,
  featuring tubes, optos, FETs, transistors and VCAs with realtime SPICE
  simulation."
details: |-
  Nine compressor models spanning the history of pro-audio including tube, optical (opto), FET, transistor, and VCA designs. Models include 76A/D FET, 2A opto, 160 VCA, G-Bus/2k5 VCA bus, E-Channel console, Zener, and DMG digital. Features zero-latency processing, sidechain filtering and response controls, global resizing, oversampling, and Retina/HiDPI support. Compatible with ProTools 7+, Cubase, Nuendo, Ableton Live, Reaper, Logic, GarageBand, and others. Windows: VST/VST3/AAX 32+64bit/RTAS 32bit (Vista/7/8/10, 32+64bit). Mac: VST/VST3/AU/AAX 32+64bit/RTAS 32bit (OS 10.7+, Intel and Apple Silicon).
