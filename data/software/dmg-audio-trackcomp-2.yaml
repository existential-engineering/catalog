description: TrackComp 2 spans nine classic hardware compressors across pro-audio history, from filthy and distorted to invisible and clean, featuring tubes, optos, FETs, transistors and VCAs with realtime SPICE simulation.
details: |-
  TrackComp is a compressor designed for musicians, producers and mix engineers. It has comparatively low CPU usage, zero latency, a streamlined workflow and features a collection of analogue and digital compressors.

  The units included are: DMG (Digital compressor), E-channel (British console channel compressor), G-bus (British console bus compressor), 76D (Revision D FET compressor), 2A (1960s valve and opto compressor), 76A (Revision A FET compressor), 160 (Very early VCA compressor), Zener (Zener diode-bridge compressor), and 2k5 (American VCA stereo bus compressor).

  DMGAudio's approach has been to optimise SPICE circuit simulation for real-time usage; typically a simulation takes between ten and a hundred times as long to execute as the audio it is processing. The company reports optimised implementations that typically run at less than 1% CPU core usage on modern processors.

  SPICE creates a mathematical description of the unit from the circuitry itself, yielding a result as accurate as physics, capturing all behaviours of the hardware, rather than relying purely on the expertise of the designer to match the unit by ear.
specs: |-
  - Revision A and D of the classic 76 FET compressor
  - British (G-Bus) and American (2k5) VCA bus compressors
  - 2A Opto compressor with lush valve output stage
  - Zener Comp/Limiter
  - 160 early VCA comp for drums
  - British E-channel console compressor
  - Mini Compassion
  - Realtime SPICE simulation of hardware units
  - Common hardware mods like Sidechain filter and Response
  - Zero-latency
  - Quick, simple, ergonomic interface
  - Authentic end-to-end models with distortion
  - Digital compressor with variable curves based on Compassion
  - Controls to calibrate the plugin to match and replace hardware
  - Mac Retina and Windows HiDPI support
  - Autolisten for configuring filters
  - Freely resizable
