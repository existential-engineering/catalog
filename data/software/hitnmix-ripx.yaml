description: Mobile music creation and listening app for iPhone. Transforms how
  you listen, remix, and create music. Features tilt-based real-time harmonic
  and vocal shifts (REACT), AR immersion with 3D spatial audio instrument
  models, Track Starter with evolving loops of rhythm/bass/harmonic instruments
  with note-level editing, and a credit meter showing percentage of original
  user invention. Supports AirDrop integration with RipX DAW/DAW PRO and import
  via RipX Deconstruct app.
details: |-
  RipX bridges the gap between passively listening to music and actively creating it, letting you experience songs in ways you've only imagined.

  REACT to Emotion lets you tilt your iPhone to transform any track in real time, so you feel the harmony shift, vocals intensify and energy change, guided by the artist's intent rather than AI. FX and Sounds can be layered on top.

  AR Immersion lets you walk through 3D models of instruments in Spatial Audio. Move closer to hear each part clearly, or tap to join in, then tap Record and share your music video on social media.

  Track Starter offers evolving loops of rhythm, bass and harmonic instruments. Every loop is 100% original and fully editable down to the note, with non-destructive FX. A credit meter recognises every contributor and shows what percentage is your own invention, incentivising originality and supporting a fairer music ecosystem.

  Portrait mode handles advanced listening with REACT and AR, and rotating to landscape opens remixing and full creation. Any song can be uploaded in seconds using the free RipX Deconstruct app, or AirDropped straight from RipX DAW or DAW PRO.
specs: |-
  - REACT to Emotion: tilt the iPhone to transform any track in real time (harmony, vocals, energy)
  - Layer on FX and Sounds
  - AR Immersion: walk through 3D models of instruments in Spatial Audio
  - Move closer to hear each part clearly, or tap to join in
  - Record and share music videos to social media
  - Track Starter: evolving loops of rhythm, bass and harmonic instruments
  - Loops are fully editable down to the note, with non-destructive FX
  - Credit meter shows what percentage of a track is your own invention
  - Portrait mode for listening with REACT and AR, landscape mode for remixing and creation
  - Upload any song via the free RipX Deconstruct app, or AirDrop from RipX DAW or DAW PRO
