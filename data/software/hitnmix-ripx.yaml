description: Mobile music creation and listening app for iPhone. Transforms how you listen, remix, and create music. Features tilt-based real-time harmonic and vocal shifts (REACT), AR immersion with 3D spatial audio instrument models, Track Starter with evolving loops of rhythm/bass/harmonic instruments with note-level editing, and a credit meter showing percentage of original user invention. Supports AirDrop integration with RipX DAW/DAW PRO and import via RipX Deconstruct app.
details: |-
  RipX for iPhone lets you REACT to Emotion: tilt your iPhone to transform any track in real time, feeling the harmony shift, vocals intensify, and energy change, guided by the artist's intent rather than AI. Layer on FX and sounds effortlessly.

  AR Immersion lets you walk through 3D models of instruments in Spatial Audio, moving closer to hear each part clearly or tapping to join in. Tap Record and share your Music Video instantly on social media.

  The Track Starter feature provides evolving loops of rhythm, bass, and harmonic instruments — every loop is 100% original and never borrowed, fully editable down to the note with non-destructive FX.

  The Credit and Fairness system recognizes every contributor. The credit meter shows what percentage of a creation is your own invention, incentivizing originality and supporting a fairer music ecosystem.

  The app features a seamless workflow with portrait mode for advanced listening with REACT and AR, and landscape mode for remixing and full creation. Upload any song using the free RipX Deconstruct app, or AirDrop tracks directly from RipX DAW or DAW PRO.
specs: |-
  - Available on Apple App Store
  - Portrait mode: REACT and AR listening features
  - Landscape mode: Remixing and full creation
  - Compatible with RipX DAW and RipX DAW PRO via AirDrop
  - Song import via free RipX Deconstruct companion app
  - Spatial Audio / AR instrument visualization
  - Real-time stem separation and track transformation
