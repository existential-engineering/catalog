details: |-
  Authentic Studio Strings for Disco & Pop

  We always wanted to create an ultra-realistic library of Studio Violins with an emphasis on Disco and Pop writing. A library so deep would essentially cover all our needs for rhythmic string writing. 18 months and 33,000 samples later, our dream is now a reality! Introducing Disco Studio Strings UDS. A new generation of live-sounding Studio Strings, exclusively recorded and designed for Soundpaint. The library features a hand-picked ensemble of 7 master violinists. All with prior experience playing on top Disco & Pop albums. The library covers all articulations needed for completely realistic string writing. True polyphonic and acrobatic run-building legatos. Every possible short- and long note we would ever need. But equally important deep variety of new ornamental articulations featuring thousands of playable ornaments. The end result is an articulation matrix, which is both fast and intuitive but virtually covers all needs for hyper-realistic studio strings. Indistinguishable from the real deal. Disco Studio Strings UDS was recorded in a uniquely warm and 100% wooden vintage studio. We used three iconic vintage microphones: Neumann U47s, Royers 121-S and AKG 414s. The sound is rich and volumetric, while still being intimate and warm. Think Jamiroquai's " Virtual Insanity ", Abba's " Dancing Queen " and Bee Gee's " Stayin' Alive ".
