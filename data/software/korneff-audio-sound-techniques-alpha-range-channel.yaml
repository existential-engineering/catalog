description: The Sound Techniques Alpha Range Channel is a digital recreation of
  the rare Sound Techniques console channel, which was used to make some of the
  most iconic records of the late 1960s and 70s. It features a warm, saturatable
  preamp, a unique EQ and a VCA compressor.
details: |-
  Rediscover the console that crafted the most iconic music of the late 60s and early 70s, the Sound Techniques. The Alpha Range Channel has all the tonality and magic of the hardware, brought into the future and now in your DAW.

  You know the sound: crisp, detailed highs. Punch that pops tracks out of the speakers. A warm, huge low end. It was the essence of iconic recordings made in the late 1960s and early 70s. It was the signature sound of the Sound Techniques recording console. The Sound Techniques A-Range was the desk of choice in major studios in England, such as Trident and De Lane Lea, and was the first British recording console ever in the United States, in Sunset Sound's fabled Studio 2.

  The unique design of the Sound Techniques preamp gives the Alpha Range strip saturation characteristics that impart size, warmth and sparkle to any sound source. A few clicks on the Mic Gain Preamp are a great start, but you can fine tune the transformers and amplifiers to tailor response to your mix.

  The Alpha Range EQ is two bands of inductor-based equalization. The high band features sweepable frequencies and a boost and a cut at the same time, it's a high end "Pultec Trick" that adds air while controlling harshness. The low end is designed for big bottom end, low mid warmth, and reduced muddiness. A set of high and low pass filters is included as well.

  The ElektraComp is a vintage VCA-based design providing plenty of punch. Easy mode has just two knobs, a Threshold and a Blend (all set for parallel processing). Switch off Easy, and you get access to all the parameters, and a useful display to guide your choices. A summing bus emulation gives the Alpha Range Channel the full sonic breadth of the console, and comprehensive back panel controls allow for unlimited tweaking of all the amplifier circuits in the channel and resource management.
specs: |-
  - Component-level model of the Sound Techniques A-Range console channel
  - Preamp: polarity switch, mic/line switch, input transformer impedance, mic preamp gain drive
  - Two-band inductor-based EQ with sweepable high band, simultaneous high boost and cut, bandwidth selector (wide/medium/narrow)
  - Low band switchable between 80 and 150 Hz with boost/cut
  - High and low pass filters
  - EQ editor with real time analyser
  - ElektraComp vintage VCA compressor with Easy mode (Threshold and Blend) and full parameter mode
  - Compressor blend preset for parallel processing, compressor in/out bypass, channel link for matched stereo compression
  - Channel fader, channel cut, compressor editor with visualizer
  - Summing bus emulation switchable in or bypassed
  - VU meters with analog-style ballistics, switchable between output level and gain reduction
  - Output faders with fader link, L/R swap
  - Software-based licensing, no USB or hardware dongle, up to four simultaneous machine activations, internet connection required for activation and demos
  - Minimum system: Intel, AMD or Apple Silicon i5 quad core, 4GB RAM, macOS 10.14 or later, Windows 7 and above, Linux Ubuntu 18.04 LTS or equivalent (x86-64), screen resolution 1024 x 768 or higher
