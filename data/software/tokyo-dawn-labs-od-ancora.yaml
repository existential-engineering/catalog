description: Stereo image correction that intelligently anchors the stereo field for improved mono compatibility.
details: |-
  OD Ancora, named after the Latin word for “anchor”, is a stereo image correction processor that intelligently anchors the stereo field for improved mono compatibility. Three primary parameters provide intuitive control of the operation, each freely adjustable over frequency.

  Depth adjusts how strongly corrections are applied, bringing excessively wide elements closer to a controlled stereo field. Timing defines how quickly the processor responds to changes in the stereo content. Target sets the threshold at which correction begins, preserving the natural stereo field below.

  Operating without fixed crossovers, Ancora offers two complementary modes: L/R mode redistributes panning energy between channels using minimum phase filtering, while M/S mode provides active correlation control using linear phase filtering. The unique RePhase feature compensates for phase artifacts and energy loss introduced by stereo width processing, maintaining natural punch and presence. The processing is independent of input level, providing true “set & forget” functionality.

  Ohlhorst Digital is a brand by Jan Ohlhorst. Initially developed exclusively for his work as a mastering engineer, these well refined products are now being made publicly accessible.
