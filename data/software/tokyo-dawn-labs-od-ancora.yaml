description: "A stereo image correction processor that intelligently anchors the
  stereo field for improved mono compatibility. Developed by Ohlhorst Digital
  for mastering applications."
details: |-
  Version 1.0.3. Three primary parameters: Depth, Timing, and Target, all frequency-adjustable. Two modes: L/R mode with minimum phase filtering and M/S mode with linear phase filtering. RePhase feature compensates for phase artifacts from stereo width processing. Level-independent processing with set and forget functionality.
specs: |-
  Windows 7 or above. Mac OS X 10.13 or above. VST2, VST3, Audio-Unit, or AAX compatible plugin host.
