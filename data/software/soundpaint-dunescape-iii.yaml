details: |-
  Spice Up Your Score

  The Secret Weapon for Thousands of Pros Dunescape is a massive cinematic virtual instrument for composers who want their music to feel like it's coming from another world. Designed and recorded by our BAFTA Award-winning team, it turns a single idea into an evolving atmosphere. It is built for big film, AAA game titles, and anyone needing blockbuster immersive sound design. Explore a vast sonic universe of ambiences, textures, pads, vocals, duduks, and more. With over 500 handcrafted presets and 125+ deep-sampled analog building blocks, Dunescape 3.0 lets you go from first note to finished mood in seconds. No deep sound design skills required. We did it for you and Soundpaints modularity lets you change it in an instant. Every sound is created through a 100% analog hardware chain. From arrays of hardware vintage synths to mystic acoustic instruments captured through analog outboard. Nothing feels sterile. Exotic voices, windswept duduks, modified nyckelharpe, shimmering analog synths, alien percussion ensembles, and raw strings blend into rich sonic stories that sit instantly in your mix. For the modern composer who desires otherworldly emotions. Dunescape is the secret spice that makes a cue feel bigger, stranger, and more alive than any basic pad library.
