description: Professional studio-quality true-peak limiter that tames peaks and digital overs transparently, with manual control or automatic signal-adaptive modes. Adds dithering with noise shaping for digital masters, a non-linear input modeller for analog, tape and digital-clipping character, and an EBU and ITU compliant loudness meter.
details: |-
  Barricade is a professional, studio-quality true-peak limiter that can tame peaks and digital overs transparently. Configure it manually to sculpt your own signature sound, or use the automatic, signal-adaptive modes to get results quickly.

  Reduce peaks without distortion. Verify loudness with ITU 1770 compliant measurement. Add character with the non-linear input modeller, which simulates analog circuitry, tape saturation or digital clipping. Reduce bit depth with dithering and noise shaping.

  The integrated EBU and ITU compliant loudness meter shows output loudness levels in real time. Up to 16-channel spatial audio support.

  Resizable user interface with dozens of color themes. Undo, redo and A/B switching. Preset management with import and export. Multiple simultaneous instances. License activation without a hardware dongle.
specs: |-
  Sample rates up to 384 kHz. Up to 16-channel spatial audio support. Personal, perpetual desktop license for Windows, macOS and Linux, for use on up to 4 computers. Desktop installer v2.1.8 (July 2026). Windows 10 or up with a 64-bit DAW supporting VST, VST3 or AAX, Intel or AMD SSE2 processor. macOS 10.13 or up with a 64-bit DAW supporting VST, VST3, AAX or AU, Intel or Apple Silicon. Linux plug-in archive requiring glibc 2.31 or up and a 64-bit DAW supporting VST or VST3.
