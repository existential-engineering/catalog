description: The most intuitive Clipper on the market. The only way to achieve modern loudness without destroying the punch and impact is with smart, purposeful clipping in the mix.
details: |-
  Clipping solves the age-old problem of how to get loudness without sacrificing punch. Other clipping plugins make you spend 10 minutes tweaking pointless settings; BSA Clipper gives you all you need for punchy, transparent clipping in only two controls.

  Two controls, that's it. Input gain drives the signal. Threshold sets the ceiling. No menus, no modes, no second-guessing. Just turn the knob until it sounds right, then move on.

  Works everywhere in the chain. Snare, drum bus, master bus - Clipper holds up anywhere you need controlled aggression without sacrificing tone.
specs: |-
  - Two controls: Input gain and Threshold
  - Hard clipping preserves transients versus limiting
  - Visual feedback shows clipped signal in light blue
  - Works on individual tracks, buses, or master bus
  - Mac OS X 10.15 or higher
  - Windows 10 or higher
  - 64-bit only
  - 200 MB free drive space
