description: prime:vocal will transform vocals recorded under less-than-ideal
  circumstances into commercial-standard audio ready for mixing.
details: |-
  prime:vocal lets you achieve world-class studio-quality vocals, regardless of your recording environment. Available as standalone software and ARA plug-in (Beta), prime:vocal is packed with features that will transform demo sketches or vocals recorded under less-than-ideal circumstances into commercial-standard audio ready for mixing.

  Your voice, front and center without compromising: with prime:vocal you can make vocal recordings sound as if they were recorded and treated in a professional studio. Based on years of experience in artificial intelligence and making trained audio processors, prime:vocal has been specifically developed to work with vocal audio.

  Industry-leading technology for natural sounding vocals, without the noise: spare yourself the hassle of having to use a variety of different tools to prepare a vocal track for mixing. prime:vocal easily removes artifacts such as buzzing, mechanical noise and reverberant reflections, as well as overemphasized sibilants and plosives. With prime:vocal's AI-powered processing, the clean-up and enhancing happen in one tool, giving you studio-quality vocal audio.

  A professional sound lies in the details: when your creativity demands action but time and space are less-than-ideal, you can still achieve the highest standards with your vocal tracks thanks to the features of prime:vocal. This tool for enhancing any vocal recording also optimizes dynamics, average loudness as well as spectral balance, and you can choose to tailor the strength of each process to match what's in your head.

  Record your vocals on-the-go and make them shine: whether you are in a rehearsal room, a hotel room or in your apartment, record your vocals on-the-go and then run them through prime:vocal before starting to mix.
specs: |-
  - AI technology trained especially for vocals
  - Easy vocal clean-up, noise and room reduction
  - Enhances spectral balance and dynamics in seconds
  - AI-powered de-essing and removal of plosive sounds
  - Optimizes dynamics, average loudness and spectral balance, with per-process strength control
  - Section-by-section playback while the analysis runs in the background
  - Software formats: standalone application, ARA VST3 (Beta), ARA AU (Beta)
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok (dongle and cloud)
  - Latest version: 1.0.3
  - Apple Silicon support: native
  - System requirements (PC): min. Windows 10 (64 bit)
  - System requirements (Mac): macOS 11+
  - RAM: min. 16GB
  - GPU: OpenGL Version 3.2+
  - CPU: Intel Core (i5), Apple Silicon
