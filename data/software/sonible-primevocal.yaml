description: prime:vocal is an AI-powered vocal enhancer that turns recordings
  made outside a treated studio into mix-ready audio. It cleans up noise and
  room reflections, tames sibilance and plosives, and optimizes dynamics and
  spectral balance in one pass.
details: |-
  prime:vocal is built on sonible's trained audio processing, with models developed specifically for vocal and speech material. It runs as a standalone application and as an ARA plug-in (beta) in supporting DAWs, so a raw take can be repaired either before it enters a session or in place on an ARA track.

  The processing chain addresses the problems typical of an untreated space in a single tool: buzzing and mechanical noise, reverberant reflections, overemphasized sibilants, and loud plosives. Instead of assembling a de-noiser, a de-reverb unit, a de-esser and a corrective EQ by hand, the analysis runs across the whole recording and applies its decisions section by section.

  Beyond clean-up, prime:vocal targets the spectral profile of a professionally recorded vocal, and also optimizes dynamics and average loudness. The strength of each individual process can be dialled in, so the automatic result is a starting point rather than a fixed treatment.

  The intended workflow is short: load a raw vocal or speech recording, let the AI analysis run in the background while enhancements become audible, fine-tune the parameters, then export. Typical uses include rescuing a demo sketch, salvaging a take with electrical or mechanical noise, improving a phone recording, and saving time on ADR for repair work.
specs: |-
  - AI technology trained specifically for vocal and speech audio
  - Vocal clean-up: noise reduction and room or reverb reduction
  - AI-powered de-essing and plosive reduction
  - Enhancement of spectral balance, dynamics and average loudness
  - Adjustable strength per process for fine-tuning
  - Section-by-section audition while background analysis runs
  - Formats: standalone application, ARA VST3 (beta), ARA AU (beta)
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok (dongle and cloud)
  - Apple Silicon support: native
  - Windows: minimum Windows 10 (64 bit)
  - Mac: macOS 11 or later
  - CPU: Intel Core (i5) or Apple Silicon
  - RAM: minimum 16 GB
  - GPU: OpenGL version 3.2 or later
