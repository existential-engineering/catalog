details: |-
  The Lowdown Bass Synthesizer recreates the super-fat, room-rattling sounds of the most legendary dual-oscillator bass pedal synth ever made. Heard on countless prog-rock and new wave tracks in the 70s and 80s, this floor pedal comes to the desktop for the first time. From the dual “constant-beat” oscillators to the ladder filter, synth designer Mark Barton (MRB) has modeled every aspect of the original with exceptional accuracy.

  Outside of a handful of organ-oriented instruments, the original instrument was the first dedicated foot-controlled bass synthesizer. It was used by some of the top acts of the 70s and 80s, including Rush, Yes, Genesis, U2, and The Police.

  The original design used Hz/V oscillator scaling (as opposed to the more conventional volts/oct oscillator scaling), allowing the oscillator detuning amount to remain constant across the keyboard by minimizing the phase cancellation that can happen when two oscillators play simultaneously. Along with a couple of other engineering tricks, this contributes to its sound.

  To create Cherry Audio's Lowdown, synth designer Mark Barton carefully analyzed the original's synthesis circuits and recreated them for a virtual bass instrument.

  Lowdown Bass Synthesizer is available in AU, VST, VST3, AAX, and standalone formats. A free 30-day demo is available, which plays white noise periodically but is otherwise unlimited. An internet connection is required for product activation.

  macOS requirements: macOS 10.13 or above, macOS 13 Ventura supported, 64-bit required, native Apple M1 or greater processor support including Ultra. A 3.4 GHz quad-core or M1 CPU with 8GB of RAM is recommended. Windows requirements: Windows 7 or above (including Windows 11), 64-bit required, quad-core computer with 8GB of RAM recommended.
specs: |-
  - Virtual analog emulation of a monophonic bass pedal synth
  - Every aspect modeled in detail with a realistic interface
  - Range from deep bass up to lead tones
  - Dual oscillators
  - 24dB/octave lowpass filter with controls for Cutoff, Emphasis, and Contour
  - Single-button access to Bull, Tuba, and Bass factory presets
  - Variable live-panel mode, available with a single click
  - Additional one-button controls to activate Glide, Decay, and Octave
  - Loudness and Filter master “foot” sliders
  - Recessed panel provides access to programmable functions: Tune, Beat, Glide, Octave, Mix, and OSC B Frequency
  - Rendered and animated foot pedal keyboard
  - Select from 14 under-the-pedals floor surfaces
  - Over 40 presets in an extensive preset browsing menu and unlimited user preset storage
  - Full MIDI control
  - Full DAW automation for all controls
