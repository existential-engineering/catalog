description: Single preset e-piano module. Low cpu usage.
details: >-
  4front e-piano module by 4front technologies is a virtual instrument audio
  plugin for macos and windows. It functions as a VST plugin.


  The plugin produces a dx-style electric piano sound with a very 80's digital
  sound character. It faithfully reproduces its sound over a very broad key
  range, from about c0 to c7, managing to create an fm-type e-piano sound with
  high sonic quality.


  The plugin is extremely lightweight and consumes almost no cpu power, loads
  quickly, and is beyond stable with no crashes or system problems reported.


  4front is extremely responsive and helpful when it comes to customer support,
  with the lead developer george young actively engaged with users and willing
  to answer questions and concerns.
specs: |-
  - VST plugin
  - Macos and windows compatible
  - Low cpu usage
  - Fm/dx-style electric piano sound
  - Broad key range c0 to c7
  - 64-bit available
