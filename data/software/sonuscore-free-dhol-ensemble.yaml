description: A free library of unique and intense hand-struck percussion from
  the South Caucasus, built around the Caucasian dhol.
details: |-
  The dhol is a potent mid-range percussion instrument from the South Caucasus, covering nearly the same range as a taiko. It can stir up the emotion and tension of a cinematic piece as well as offer a strong rhythmic grounding for folk music styles.

  The DHOL ENSEMBLE was recorded on a beautifully crafted scoring stage at Georgian Film in Tbilisi, Georgia. Recorded in pairs with a center percussionist, it gives the true feel of a 5-person ensemble. With the 5 velocity layers and 8 round robins included in this meticulously sampled instrument, the possibilities for customizing authentic-sounding percussion phrases are practically endless.

  The Caucasian dhol is a double-sided barrel drum that was traditionally used throughout the Caucasus to stir up the spirits of warriors before a battle. It has a distinct sound that sets it apart from its mallet-struck Iranian and Indian counterparts. The dhol from Georgia and Armenia, which Sonuscore present here, is played with the hands, giving it a different sound due to the nature of the attack. This is what makes the DHOL ENSEMBLE so special, the intimacy and energy of a hand struck percussion paired with the mass and immediacy of a full ensemble.
specs: |-
