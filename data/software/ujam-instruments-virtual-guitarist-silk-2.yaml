description: Virtual Guitarist SILK 2 beautifully captures the essence of nylon-string guitars with its completely new guitar model.
details: |-
  SILK 2 beautifully captures the essence of nylon-string guitars with its completely new guitar model. A large collection of phrases, and a wide variety of chords, octaves and riffs makes SILK 2 perfect for crafting elegant pop and rock songs, or adding an intimate touch to just about any genre.

  SILK 2 performs with the finesse of a seasoned studio virtuoso, someone who has honed their craft through countless hours of practice. UJAM meticulously curated the perfect guitar for SILK 2 and recorded it with a range of microphone set-ups to open up sonic possibilities. Its creative effects make for seamless crafting of your signature sound.

  SILK 2 stands out with its user-friendly design and creative possibilities. From the new smart chord engine to the Instrument mode, each element is tailored to elevate your artistic expression. No guitar skills are needed: the smart chord engine turns basic chords or notes into realistic performances with a few clicks, while Instrument mode lets you play individual notes and articulations.

  Tailor your tracks with SILK 2's Mix and Character controls. Select from five mixes and four characters to sculpt your ideal nylon-string sound.
specs: |-
  - Instrument mode
  - Picking and strumming styles
  - Open Chords feature
  - 40 stomp box emulations, 75 Finisher FX modes
  - Smart chord engine
  - Five mixes and four characters
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 7.1 GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App, or downloadable installer file
  - Authorization: quick authorization via the UJAM App, or email and password within the plug-in
  - Supported standards: MIDI
  - Works on macOS and Windows with all major DAWs, including Ableton Live, Logic Pro, Pro Tools, FL Studio, Cubase, Studio One, Bitwig, Reaper and Reason
  - All MIDI phrases and included sounds are royalty-free
