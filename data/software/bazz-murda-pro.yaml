details: |-
  Bazz::Murda Pro is a full-featured AU/VST synth dedicated to kick-drums and
  bass synthesis. It is aimed at hard electronic music like hardcore, gabber,
  drum&bass and dubstep.

  If you like heavy and distorted hardcore sounds or massive wobble bass-lines
  don't miss it in your audio plug-ins collection.

  Bazz::murda pro by distocore is a virtual instrument audio plugin for macos
  and windows.

  3 alias-free algorithm- and wavetable-based oscillators. 1 additional
  sub-oscillator with 5 waveforms and a separate modelling path for a clean
  bass-layer. 3 free-running or tempo-synced lfos with different signal modes
  allowing oscillator cross-modulation.

  Two filter-banks with 15 filters per oscillator with cross fade control per
  oscillator, volume and filter adsr with independent shape, amount and duration
  control, sophisticated pitch envelope for complex bass/kick drum models, 9
  voices unison unit with fade-in option for bass/kick drum application, and fm
  modulator unit with fade-in option for bass/kick drum application.
specs: |-
  - 3 alias-free algorithm- and wavetable-based oscillators
  - 1 sub-oscillator with 5 waveforms
  - 3 free-running or tempo-synced LFOs
  - 15 filters per oscillator
  - Volume and filter ADSR
  - Pitch envelope
  - 9 voices unison unit
  - FM modulator unit
  - 16 different note modes
  - Tempo delay with stereo FX
  - Multi-mode filter
  - Ring modulator
  - Phaser
  - 3 band EQ
  - Hardcore bass unit
  - Distortion unit with editable distortion curves
  - Advanced visualization for output and LFO signals
