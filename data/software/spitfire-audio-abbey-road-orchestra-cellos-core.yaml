description: The stunning sound of a Cello section captured at Abbey Road Studios.
details: |-
  The stunning sound of a Cello section captured at Abbey Road Studios. This VST, offers an extensive range of articulations and playing styles — lyrical and performance legatos, a wide selection of longs and shorts, and control over a variety of articulations to allow you to create both intimate and epic soundscapes.

  Recorded in the timeless acoustics of Abbey Road Studio One, this library also includes a hand-crafted mix signal by GRAMMY award winner Simon Rhodes.

  Expressive to the highest degree.

  Do you already own an Abbey Road Orchestra Library? Log in to see your exclusive price.

  Also available in Professional .
specs: |-
  - 10 Cellos, 18 articulations
  - 2 legato techniques: Performance Legato, Lyrical Legato
  - Long techniques: Long, Flautando, Tremolo, Harmonics, Trills (major and minor 2nds and 3rds), Measured Tremolo at 150 and 180 BPM
  - Short techniques: Spiccatissimo, Spiccato, Staccato, Marcato, Pizzicato, Col Legno
  - 1 curated mix: Mix 1 by Simon Rhodes
  - 4 GB download size
  - macOS 11 to OS 26, Apple Silicon supported
  - Windows 10 or 11 (64-bit)
  - Minimum 8GB RAM, 16GB recommended
  - SSD drive for install advised
  - 32-bit DAWs not supported
  - Spitfire Audio App required for installation
