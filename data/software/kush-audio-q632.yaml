details: |-
  q.632 is a modestly updated repackage of Magpha EQ, an obscure and defunct plugin whose unusual phase-modeled filters earned it a reputation for smoothness and fidelity that rival what comes out of $9,000 analog mastering EQs.

  Spotting an opportunity to revive this lovely tech, Kush reached out to John Flynn, the mastering engineer who developed Magpha, and secured an exclusive license both to Magpha and its underlying EQ algorithms.

  The plugin is presented under the banner of Minimalist Excellence, with an extended gain range, analog-phased high frequencies, and ultra-transparent filters that protect the sound as it is shaped.

  A perpetual licence covers 2 activations, free updates and support, and all available presets. A free 10-day demo is offered via a published demo code.
specs: |-
  - Extended gain range
  - Analog-phased high frequencies
  - Ultra-transparent filters protect your sound as you shape it
  - Phase-modeled filters licensed from Magpha EQ (developed by mastering engineer John Flynn)
  - Perpetual licence includes 2 activations
  - Free updates and support
  - All available presets included
  - Free 10-day demo available
  - Mac and Windows installers
