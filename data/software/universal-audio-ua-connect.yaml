url: https://www.uaudio.com/products/ua-connect
description: Free desktop application for installing Universal Audio plug-ins
  and registering and updating UA hardware.
details: |-
  UA Connect is a desktop management application that consolidates control of Universal Audio software and hardware in one place.

  It provides access to UAD Spark and native UAD plug-ins and downloads the LUNA digital audio workstation. Apollo and Volt audio interfaces, UA microphones and UAFX pedals can be registered through it, and device software updated.

  The application is available for Mac and Windows at no cost. On Windows it also supplies the ASIO driver used by Volt interfaces.
specs: |-
  - Installs UAD Spark and native UAD plug-ins
  - Downloads the LUNA digital audio workstation
  - Registers Apollo and Volt interfaces, UA microphones and UAFX pedals
  - Updates device software and firmware
  - Supplies the Windows ASIO driver for Volt interfaces
  - Available at no cost
