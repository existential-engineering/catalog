details: >-
  Experimental synth combining wave table, subtractive, phase distortion and
  physical modeling for sound generation. The idea was to add humanization to
  the sound on oscillator level in order to simulate behavior of real world
  instrument where each hit is different.


  Instead of complex modulation, the wavelet osc is split into two layers that
  each has its own control. You can easily control (for example) attack per
  velocity without assigning any modulation source. You can detune each layer,
  enable comb filter, enable pitch envelope or phase distortion to each layer
  individually.


  All blending control have individual shape setting for each layer or even
  inverse mode in order to have different amount or phase while using same MIDI
  cc or velocity. The mod section for phase distortion includes sync option, and
  the filter has a mod section as well.


  The plugin features an interactive gui with mouse over for each element that
  can be changed or adjusted. Each control that have assignable MIDI cc have
  additional display for assigned controller, and all envelope controls have
  additional 6 quick sub presets to choose from.


  Known bugs: MIDI learn does not work in vst3. But you can still assign
  controller directly to selected controls.
specs: |-
  - Wave table oscillator
  - 118 wave tables
  - Comb filter
  - Phase distortion
  - 5 phase distortion shapes
  - Noise sub synth
  - Round robin simulation
  - MIDI cc assignment
  - Exponential to logarithmic control
  - Filter with parallel or serial mode
  - Shaper with two modes
  - Saturation
  - Portamento for mono
  - Vibrato module
  - Interactive gui
  - MIDI cc display
  - 6 quick envelope presets
  - Ensemble module
  - Soft clipper
  - Randomization
  - Preset manager
  - Gui scale 80-150%
  - VST plugin
  - VST 3 plugin
  - Windows only
