details: |-
  A studio-quality compressor and preamp emulation, the Pulp N Peel brings smooth, natural dynamics with a touch of vintage warmth. Whether used as a transparent leveler or pushed into harmonic grit, it retains the feel of your playing while enhancing sustain and clarity. Using advanced modeling, we've faithfully recreated the parallel compression circuit and tonal flexibility of the original, now with expanded control in the digital domain. Introducing, MixWave: JHS Pulp N Peel .
