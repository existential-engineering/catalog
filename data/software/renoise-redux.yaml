details: |-
  Redux is a sample-based instrument, combined with a powerful phrase
  sequencer. Enjoy the full-featured MIDI implementation and
  performance-friendly features, for the first time available outside
  of Renoise.

  Built around tracker notation, Redux brings Renoise's phrase
  sequencing workflow to any DAW as a VST3 or AudioUnit plugin
  instrument. It pairs a sample-based engine with per-note polyphonic
  modulation and eight macro controls for performance automation.

  The instrument includes a built-in waveform editor with a sample
  recorder and draw tool, plus a quasi-modular DSP effects system
  for shaping sounds directly inside the plugin. It also supports
  the .sfz multi-sample format for loading external sample libraries.
specs: |-
  - Sample-based instrument with phrase sequencer
  - Tracker notation interface
  - Full MIDI implementation including MIDI output
  - Built-in waveform editor with sample recorder and draw tool
  - Per-note polyphonic modulation
  - Eight macro controls for performance automation
  - Quasi-modular DSP effects system
  - Supports .sfz multi-sample format
  - Windows: 64-bit VST3
  - macOS: Universal (Intel & Apple Silicon), VST3 and AudioUnit
  - Linux: x86_64 64-bit VST3
