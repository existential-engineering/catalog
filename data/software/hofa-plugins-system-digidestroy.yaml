description: Digital LoFi meets Destruction
details: |-
  Rough, dirty, digital – that's the power of the SYSTEM DigiDestroy. Use this bitcrusher to create fascinating artefacts and push it all the way to digital demolition. Ideal for digital retro sounds, experimental transitions and crunchy drums with vintage flair. Bitcrusher with adjustable bit depth, sample rate, jitter and anti-aliasing filter Digital clipper with hard, fold and wrap modes Schematic display for precise visualisation of the sound effect Dry/wet function for parallel applications Also available in a freeware version with slightly reduced feature set HOFA SYSTEM DigiDestroy in action Video content: Feature overview Bit depth Sample rate Jitter Clip modes Sound examples Creative sound design with DigiDestroy Three sound examples https://vimeo.com/1104520541/b29d8ddd23https://vimeo.com/1104520587/ec2a02c875https://vimeo.com/1104520566/57a4e5fa7b That’s how the parameters affect the sound: Bit depth This control reduces the bit depth of a signal. The result are typical artefacts such as digital distortion, noise and a crackling sound typically associated with a retro vibe. At an extremely low bit depth, the signal can become almost unrecognisable – a creative effect for sound design and electronic music. Jitter Jitter randomly changes the times at which the audio signal is sampled. Instead of regular sampling intervals, small shifts occur. Dependent on the input signal, these fluctuations generate digital noise which makes the sound livelier and more chaotic. Sample rate reduction This parameter affects the sampling rate, which will have an impact on the sound: Clarity is lost, replaced by raw character. The sound gets gritty, fragmented, at times close to a digital glitch. Particularly popular for glitch, lo-fi, industrial and game sound design. Additionally, a high-cut filter can be used for anti-aliasing. Clip The gain-compensated clipper modifies audio signals in various ways to create distortion, loudness or creative effects. There are three modes to
