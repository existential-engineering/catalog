description: SYSTEM DigiDestroy is a bitcrusher and digital distortion plugin with adjustable bit depth, sample rate, jitter and anti-aliasing filter, plus a digital clipper with hard, fold and wrap modes. It includes a schematic display and dry/wet control for parallel use, and is also available as freeware with a reduced feature set.
details: |-
  Rough, dirty, digital, that is the power of the SYSTEM DigiDestroy. Use this bitcrusher to create fascinating artefacts and push it all the way to digital demolition. Ideal for digital retro sounds, experimental transitions and crunchy drums with vintage flair.

  The bit depth control reduces the bit depth of a signal. The result are typical artefacts such as digital distortion, noise and a crackling sound typically associated with a retro vibe. At an extremely low bit depth, the signal can become almost unrecognisable, a creative effect for sound design and electronic music.

  Jitter randomly changes the times at which the audio signal is sampled. Instead of regular sampling intervals, small shifts occur. Dependent on the input signal, these fluctuations generate digital noise which makes the sound livelier and more chaotic.

  Sample rate reduction affects the sampling rate, which will have an impact on the sound: clarity is lost, replaced by raw character, and the sound gets gritty, fragmented, at times close to a digital glitch. It is particularly popular for glitch, lo-fi, industrial and game sound design. Additionally, a high-cut filter can be used for anti-aliasing.

  The gain-compensated clipper modifies audio signals in various ways to create distortion, loudness or creative effects. There are three modes to choose from: Hard for classic digital clipping with a direct and loud sound, Fold which folds back the signal for complex, metallic distortion, and Wrap which is even more intense, creating lots of unpredictable harmonics.
specs: |-
  - Bitcrusher with adjustable bit depth, sample rate, jitter and anti-aliasing filter
  - Digital clipper with hard, fold and wrap modes
  - Schematic display for precise visualisation of the sound effect
  - Dry/wet function for parallel applications
  - Bit depth from 3 to 16 bit
  - Jitter from 0 to 100% (full version only)
  - Sample rate reduction from 1 to 65
  - Anti-aliasing hi-cut filter
  - Gain-compensated clip from -24 to +24 dB
  - Clip modes: Hard, Fold and Wrap in the full version, Hard only in the freeware version
  - Also available in a freeware version with slightly reduced feature set, installed via the HOFA-Plugins Manager
  - Formats: VST3, AU, AAX
  - Operating system: macOS 10.13 or later, Windows 10 or later
  - Two licenses included, managed via the HOFA Plugins Manager; offline activation supported
  - Continuously tested on Ableton Live, Apple Logic, Avid Pro Tools, Bitwig, Cockos Reaper, Image Line FL Studio, Magix Samplitude/Sequoia, Fender Studio Pro, Steinberg Cubase/Nuendo/Wavelab
  - 14 days free trial
