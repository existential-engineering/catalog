details: >-
  Alpha-ray is a three oscillator per voice, 10 voice polyphonic va synthesizer.
  This instrument has an inbuilt poly overdrive. The vcf can switch from a
  ladder to a state variable mode. The main filter in connection with a 6 db hp
  filter gives a bp-filter with adjustable bandwidth.


  Alpha-ray is usable for all kind of va sounds and specially also for really
  heavy distortion lead sounds. On board are four additional effects, overdrive,
  chorus, delay and reverb.


  Features: two main oscillators and one sub-oscillator / 10 voices polyphony.
  Two main lfos and one modulation lfo (pitch wheel), tempo host sync and phase
  sync. Three filter, a 6 db hp, a 24 db ladder or a main 12 db state variable
  filter. The 6db filter coupled to the main filter gives a bp filter.


  Osc fm with osc 1+2 and osc sync with osc 1+2. Polyphonic overdrive for osc 1,
  2 and sub osc. Auto portamento. Aftertouch. Manual in 4 languages, german,
  english, french, italian. MIDI learn for the most important functions.


  Two stage overdrive. Three stage chorus. Delay 'x' and ' normal mode, tempo
  sync to host. Special reverb, delay cluster, normal reverb, oil tank effect.
