description: Discover the H160 Compressor, a powerful analog compressor plugin that combines vintage punch with modern precision.
details: |-
  The H160 is an analog compressor plugin that brings the power and precision of legendary analog compression into the digital realm, enhanced with cutting-edge features designed specifically for today’s producers and engineers. With its rich history and modern enhancements, the H160 is a must-have tool for anyone looking to capture that sought-after analog sound while maintaining the flexibility and convenience of digital workflows.

  Modeled after one of the most iconic analog compressors in audio history, the H160 delivers that unmistakable punch and control over dynamics that made its analog counterpart a studio staple for decades. Whether you’re shaping the drums, bass, or any percussive element, the H160 captures the bold, tight sound that has made this type of compression legendary. The ability to apply tight control while still retaining the liveness and energy of the performance is what sets the H160 apart, making it an invaluable tool for mixing and mastering.

  One of the standout features of the H160 is its intuitive controls, designed to make it easy for you to dial in your ideal compression settings quickly. With threshold, ratio, and output gain controls, you have everything you need to shape dynamics efficiently. The plugin’s hard knee compression curve gives you precise control, making it ideal for adding presence to any instrument, while still maintaining natural dynamics. Whether you’re adding punch to a drum kit or smoothing out the dynamics of a vocal track, the H160 ensures that you achieve the right sound without losing the natural feel of the audio.

  The H160 is equipped with both input and output trim controls, which provide you with the flexibility to fine-tune your signal levels before and after compression. This level of control is essential for managing gain staging and ensuring that the analog emulation is driven to the desired saturation level. This not only allows you to control the compression but also ensures that you can optimize the sound quality by adjusting your signal flow to perfection. With this level of control, you can achieve a more consistent, polished sound in your mixes.
specs: |-
  - Classic Hard Knee Compression
  - Threshold, Ratio, and Output Gain Controls
  - Input and Output Trim
  - Auto Input Trim
  - Auto Gain Reduction (GR) Target
  - Dry/Wet Control
  - Automatic and Manual Oversampling (2x, 4x, 8x)
  - Analog Saturation and Hiss Control
  - Auto Make-Up Gain
  - Full Plugin Bypass
  - Load and save buttons for managing presets
  - Compatible with macOS 10.13 and later, and Windows 10 and later
  - Available in VST3, AAX, and Audio Unit formats
  - Freely resizable interface
  - Available in both light and dark themes
  - Apple Silicon native support
  - No copy protection
