description: A MIDI chord generator that builds progressions from single four-note chords up to eight-chord riffs inside a circular interface. Generated progressions can be dragged straight into the host project as MIDI.
details: |-
  Chords is a MIDI effect for starting chord progressions quickly. It was designed originally for EDM productions but works across genres, suggesting anything from a single four-note chord to a complete eight-chord riff in a few clicks.

  Placed ahead of any MIDI-triggered instrument, the plugin generates looped options for up to eight chords with control over chord shape, inversions and velocity. The result can be dragged as MIDI straight from the plugin into the host project.

  Global controls set inversions, length, speed and root key for the whole playback. Clicking an individual segment opens granular control over its chord shape (including major and minor variations), its own inversion and its velocity.

  Up to eight segments each hold a different chord type and can trigger between one and four notes. Playback syncs to the host BPM, segments can be added or removed, and each takes inversions from -6 to +6 so the root note can be placed inside the chord.

  Eighteen buttons at the centre of the interface select Tonic, Subdominant and Dominant shapes, from simple triads through to extended voicings such as G7sus4 or Bm7b5. Multiple labelled factory preset progressions are included.
specs: |-
  - Chord-creating MIDI effect
  - Connects to any sequencer
  - Global and per-segment control
  - Intelligent harmonic progressions
  - Preview mode for in-plugin playback
  - Export MIDI by drag and drop
  - Factory presets
  - Resizable interface
  - PDF manual and tutorial video
  - Up to 8 chord segments, one to four notes per chord
  - 18 chord types across Tonic, Subdominant and Dominant
  - Inversions from -6 to +6 per segment
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Tested on Windows with FL Studio 12, Cubase 10, Studio One 5, Ableton Live 9 and Pro Tools 11 or newer
  - Tested on Mac with FL Studio 12, Cubase 10, Studio One 5, Ableton Live 9, Logic Pro X and Pro Tools 11 or newer
  - Also tested with NI Maschine and Mixcraft
  - Not compatible with Maschine 2, which offers no MIDI routing
  - Not compatible with Reason, which offers no MIDI routing
