description: KAYA is designed specifically for afrofusion styles, covering a wide range of West African-origin rhythms from afrobeat to amapiano drum patterns.
details: |-
  KAYA is designed specifically for afrofusion styles. It covers a wide range of West African-origin rhythms from afrobeat to amapiano drum patterns, providing sounds and grooves that reflect the complex intersecting rhythms of these genres.

  KAYA includes a curated collection of drum sounds that are designed to be authentic and ready to use, whether the target is smooth and laid-back or raw and energetic. A built-in library of rhythmic patterns helps get a track started quickly and can serve as a starting point for original ideas.

  The sound of afrofusion has become a global phenomenon. This is not just an electronic drum plug-in, it is a vibrant, versatile rhythm engine, specifically designed to provide the drum patterns and energy of West African influences.
specs: |-
  - 10 unique drum kits, 16 instruments each
  - 20 Styles with 23 beats each, a total of 460 MIDI loops
  - 12 Mix Modes to kickstart projects
  - Special control: Life
  - 75 Global Presets
  - 17 ambience / reverb effects
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8GB of RAM
  - 1GB of free disk space
  - 1280x768px display, internet connection
  - Moving the .blob sample content to an external drive is not supported
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Supported standards: MIDI
  - Requires the latest version of the UJAM App, which installs the Beatmaker plug-in that hosts all titles
