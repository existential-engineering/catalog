description: DeePopMax is a maximizer plug-in optimized for CD and digital distribution that automatically adjusts the loudness balance of each frequency range to create a catchy sound with amazing quality.
details: |-
  DeePopMax is a maximizer plug-in by Dotec-Audio designed specifically for pop music mastering targeting CD and digital distribution. Its core algorithm automatically adjusts the loudness balance across frequency ranges to produce a catchy, polished result suited to playback on smartphones and computers.

  The plug-in's main control lets users adjust the overall loudness balance and sound pressure in a single operation. As loudness increases, the spectral balance is managed internally so that the result remains musical rather than harsh or fatiguing.

  The WARMTH function adds warmth to the signal during the loudness increase process, helping to counteract the thinning effect that can occur at high levels. This makes the output feel fuller and more natural even at mastering-level gain reduction.

  The MONITOR function allows users to check the effect of the plug-in at a constant output level, enabling accurate A/B comparison between the processed and bypassed signal without the bias introduced by level differences.

  DeePopMax ships as VST2, VST3, AU, and AAX for Windows and macOS (64-bit, OS 10.12 or later) and has been verified against more than 20 DAW hosts including Ableton Live, Cubase, Logic Pro X, Pro Tools, Studio One, and FL Studio. The plug-in was first released in February 2020 and has been updated through January 2026.
