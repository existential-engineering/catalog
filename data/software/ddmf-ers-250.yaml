url: https://ddmf.eu/ers-250/
description: "A faithful digital replication of the EMT 250, the first digital
  hardware reverb ever made, with careful reproduction of original schematics
  and an additional modern alternative."
details: |-
  Reproduction of original EMT 250 schematics
  Adjustable reverb decay time (0.4 to 5 seconds)
  Low and high frequency response controls
  Predelay adjustment
  Additional low-pass filter
  Dry-wet ratio control
  Alternative modern schematics
  Comprehensive preset library
specs: |-
  - Careful reproduction of the original EMT 250 schematics
  - Adjustable reverb decay time from 0.4 to 5 seconds
  - Configurable low frequency response, high frequency response, and predelay
  - Additional low-pass filter to create darker sounds
  - Dry-Wet ratio adjustable
  - Alternative "modern" schematics available
  - Comprehensive set of presets included
  - Available in 32-bit and 64-bit formats
  - Mac: OSX 10.7 or higher required; Intel and Apple Silicon supported
  - iOS: AUv3 format, compatible with GarageBand and Cubasis
  - Linux: ARM and x86_64 VST3 builds available
