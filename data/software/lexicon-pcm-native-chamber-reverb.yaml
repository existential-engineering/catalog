description: Algorithmic chamber reverb plug-in that faithfully reproduces the
  complex 'miniature-space' effect of physical echo chambers, with rapid high
  density and randomized reverberant tails to avoid artificial wall-slap
  artifacts.
details: |-
  PCM Native Chamber Reverb is a Lexicon software reverb plug-in modelled on the physical echo chambers used in professional recording studios. It reproduces the dense, randomised reverberant tails that make real chambers sound natural, avoiding the slap-back artefacts of cruder simulations.

  The plug-in ships with 35 studio-quality presets covering a range of source material, and supports full parameter automation inside the host DAW. A real-time spectral display with input/output metering provides visual feedback while dialling in settings.

  The user interface is a single-screen design with a portable, DAW-independent preset format so settings transfer across host applications. Authorization requires an iLok2 USB key.

  Lexicon lists this product as Discontinued. The final build was version 1.3.6, released August 2016, with installers for Mac (Intel, 18.6 MB) and Windows (50.2 MB). The plug-in is part of the broader PCM Native Reverb Plug-in Bundle, which is also no longer offered for new sale.
