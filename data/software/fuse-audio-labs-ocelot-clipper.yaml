description: A peak shaper built for peak reduction and mastering dynamics, with independent knee controls for positive and negative signal swings to shape harmonic content — from transparent limiting to warm saturation. Combines up to 32× oversampling, ADAA (Anti-Derivative Anti-Aliasing), and True Peak mode. Three real-time displays — waveform, waveshaper graph, and harmonic spectrum analyzer — visualize exactly what the clipper is doing to transients and harmonics.
details: |-
  Second plugin in the OCELOT Studio Series (released 2025-02-20). Independent Positive and Negative Knee controls for asymmetric clipping curves — both set to 0 for hard clipping, raised for soft. True Peak mode prevents inter-sample peaks. User-selectable oversampling: 2×, 4×, 8×, 16×, 32× (~2.5% CPU at 2×, ~20%+ at 32×). HQ mode with ADAA as alternative anti-aliasing option. Under 1.5 ms latency. Input gain, Output gain, and Ceiling controls. 1:1 level-matching mode for A/B comparison. Delta function to audition only the clipped signal. Resizable UI (100–125%). Three visualizers: waveform display, waveshaper graph, harmonic spectrum analyzer.
specs: |-
  Latency: <1.5 ms. Oversampling: 2×, 4×, 8×, 16×, 32×. UI scaling: 100–125%. macOS 10.12+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+ (32-bit and 64-bit), 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX. Activation: Fuse Audio Labs account. 14-day trial available.
