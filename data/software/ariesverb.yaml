description: Ariesverb is a multi-effects processor based on a highly flexible
  feedback delay network (fdn) design with extremely low cpu usage.
details: >-
  Ariesverb is a multi-effects processor based on a highly flexible feedback
  delay network (fdn) design with extremely low cpu usage.


  When used conservatively as a room simulator, this plugin can do smooth
  reverbs with a lively and present sound. In addition, this plugin can do more
  than just room simulation.


  Most parameters can be adjusted over a wide range of many orders of magnitude,
  allowing for phasing effects in the microseconds (s) range, even below the
  actual sampling rate used.


  The delay length modulation can be adjusted in depth and speed, where the
  modulation speed may be so high that fm like effects are possible. An envelope
  follower as modulation source allows for ducked or gated reverb effects.


  A non-linear saturation can be activated in the feedback path, either to give
  the sound an analog feel, or to create chaotic limit cycles.
specs: |-
  - Feedback delay network (fdn) design
  - Extremely low cpu usage
  - VST plugin
  - Macos and windows compatible
  - Sse compatible processor required (intel pentium-3, amd athlon-xp, or
  higher)
  - Windows server 2003 or later
  - Base delay time: 1 microsecond to 1 second
  - Decay time: up to 10000 seconds
  - Linear filtering with decay time adjustable in 3 bands
  - Non-linear filtering with saturation and optional overunity
  - 2 lfo modulation sources (0.1 hz to 1khz)
  - 1 envelope follower modulation source
  - Modulation targets: delay length, phase inverter, decay time, output level
  - Freely adjustable input/output connections
  - Reverbs
  - Delays, echoes and reflections
  - Choruses and flangers
  - Stereo transformations
  - Body resonances and filters
  - Distortion
  - Dynamics
  - Pitch shifting
  - Fm effects
  - Non-linear limit cycles
  - Phasing effects in microseconds range
  - Delay length modulation with adjustable depth and speed
  - Ducked or gated reverb effects
  - Non-linear saturation in feedback path
