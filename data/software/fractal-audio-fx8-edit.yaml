description: FX8-Edit is an application for Mac or Windows that lets you create,
  view, edit and manage presets for the FX8 Multi-Effects Pedalboard.
details: |-
  Unleash the FX8 with FX8-Edit, an application for Mac or Windows. Based on the successful Axe-Edit for the Axe-Fx, FX8-Edit allows you to create, view, edit and manage presets.

  The program is easy-to-use and even provides some nice "bonus" capabilities. The large intuitive interface shows many parameters at once and speeds productivity with the ability to edit using mouse and keyboard. You can edit scenes, copy and paste effect blocks, re-order presets, and much more.

  The interface shows FX8 LED statuses, and the application is kept up to date with new firmware. It requires the FX8, and you can create or edit sounds right on the unit, editing every sound parameter including modifiers.

  Import and Export files to share with others, Copy and Paste effect blocks between presets, and save snapshots (undo points) while you edit. An on-screen tuner and tempo display, plus on-screen modifier graphs and filter curves, round out the feature set.

  Version 1.8.1 is dated July 21, 2026. The Mac build is Universal and requires MacOS version 10.13 or newer, with a legacy 32-bit build (Version 1.7.0) still offered for OSX 10.6.8 or newer. The Windows build runs on Win 10, 8.x, 7.x or Vista (x86 or x64). Both require FX8 firmware version 5.00 or greater.
