description: Shaping & EQing of Transients. The SYSTEM TransientShaper gives
  control over transients and sustains in a natural sounding way, with effective
  processing that is either full-range or frequency-focused.
details: |-
  The SYSTEM TransientShaper gives control over transients and sustains in a natural sounding way, with effective processing that is either full-range or frequency-focused, and easy and intuitive handling. It can be used as a standalone plugin and inside HOFA SYSTEM.

  There are two ways of transient processing. In the standard mode, you process transients and sustains in the entire frequency spectrum, the traditional way. Alternatively, you can use the innovative 'Transient + Sustain EQs' to optimize the sound in an adjustable frequency range, and you will be surprised how often this frequency-focused processing sounds better.

  Both modes provide a wide control range of ± 18 dB, and even at extreme settings you won't hear any technical artifacts.

  All plugins from the HOFA SYSTEM series are also available as freeware with a slightly limited feature set. Simply install HOFA SYSTEM using the HOFA-Plugins Manager, and you can then use all freeware features immediately. The SYSTEM TransientShaper freeware can boost and attenuate transients, while boosting and attenuating sustain and the Transient + Sustain EQ (frequency focus) are reserved for the full version.

  The page hosts five sound examples demonstrating the plugin on drums: intensifying room sound, boosting transients for more punch, reducing transients for a more indirect sound, adding sustain for a more ambient sound, and cutting sustain for less crosstalk and room.
specs: |-
  - Control over transients and sustains in a natural sounding way
  - Effective processing, full-range or frequency-focused
  - Standard mode processes transients and sustains across the entire frequency spectrum
  - Transient + Sustain EQs optimize the sound in an adjustable frequency range
  - Wide control range of ± 18 dB in both modes, without technical artifacts at extreme settings
  - Easy and intuitive handling
  - Can be used as a standalone plugin and inside HOFA SYSTEM
  - Also available in a freeware version with slightly reduced feature set (transient boost and attenuation only)
  - Formats: VST3, AU, AAX
  - Operating System: macOS 10.13 or later, Windows 10 or later
  - Continuously tested on Ableton Live, Apple Logic, Avid Pro Tools, Bitwig, Cockos Reaper, Image Line FL Studio, Magix Samplitude/Sequoia, Fender Studio Pro, Steinberg Cubase/Nuendo/Wavelab
  - Two licenses included, managed via the HOFA Plugins Manager; offline activation and USB stick licensing supported
  - 14 days free trial
