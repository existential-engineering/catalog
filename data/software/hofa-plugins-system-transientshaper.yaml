description: Shaping & EQing of Transients
details: |-
  Control over transients & sustains in a natural sounding way Effective processing – full-range or frequency-focused Easy and intuitive handling Can be used as a standalone plugin and in HOFA SYSTEM Also available in a freeware version with slightly reduced feature set What’s so Special about the SYSTEM TransientShaper? https://www.youtube.com/watch?v=sdKASpslfZQ Two ways of transient processing In the standard mode, you process transients and sustains in the entire frequency spectrum – the traditional way. Alternatively, you can use the innovative “Transient + Sustain EQs” to optimize the sound in an adjustable frequency range. You will be surprised how often this frequency-focused processing sounds better! Both modes provide a wide control range of ± 18 dB, and even at extreme settings you won’t hear any technical artifacts. Sound examples SYSTEM TransientShaper Playlist 5 Videos Intensify the room sound of drums: 0:14 Boost the transients to make drums more punchy: 0:20 Reduce the transients for a more indirect sound: 0:14 More sustain for a more ambient sound: 0:22 Less sustain for less crosstalk and room: 0:21 Freeware version All plugins from the HOFA SYSTEM series are also available as freeware with a slightly limited feature set. Simply install HOFA SYSTEM using the HOFA-Plugins Manager . You can then use all freeware features immediately. Here is an overview that shows the differences between the SYSTEM TransientShaper freeware and the full version: Feature Available in the freeware Available in the full version Boost and attenuate transients ⬤ ⬤ Boost and attenuate sustain ⬤ Transient + Sustain EQ (frequency focus) ⬤
