description: "Reel-To-Reel plugin by Antelope Audio combines the best tape
  formulas, the best tape heads and the finest electronics."
details: |-
  In modern production, adding tape saturation has become like adding reverb – you need it everywhere because nobody likes the sterile perfection of digital sound. With all the love and knowledge Antelope Audio founder Igor Levin has gathered about tape machines since the 70s, he set our team on a mission not to revive the classics, but to build the ideal tape machine of today.

  Reel-To-Reel combines the best tape formulas, the best tape heads and the finest electronics. The combinations between all those will create endless scenarios. You can experiment with bias settings, tape hiss amounts, switch between four types of tape, and adjust wow & flutter amounts. Mastering these parameters will allow you to achieve the warmth and color you crave in the desired amounts.

  Reel-To-Reel is a Synergy Core effect, meaning it functions with no latency. The Antelope Audio tape machine will finally allow producers and recording artists to monitor the effect of our Synergy Core tape machine in real-time, and not only during post-production.
specs: |-
  - Adjustable bias settings
  - Adjustable tape hiss amount
  - Four selectable tape types
  - Adjustable wow & flutter amounts
  - Synergy Core effect with zero latency
  - Runs natively in your DAW on macOS or Windows, or in real-time on Synergy Core interfaces
  - Included in Antelope Cosmos subscription
