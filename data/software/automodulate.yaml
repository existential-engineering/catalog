details: |-
  AutoModulate is a max 4 live MIDI device that can be placed on any track and
  automatically triggers random sequences of parameter control, allowing users
  to randomly step sequence any parameter of any device on any track while
  controlling the minimum, maximum and curve values for each parameter.

  The device provides selection of up to 7 different parameters of any device
  (including track volume/pan, sends, etc.) on any track, even a different one
  from the one containing automodulate, with minimum and maximum values that can
  be inverted for negative modulation.

  Smooth parameter controls the speed of modulation from instant to 2 seconds,
  functioning like the attack and release of an adsr envelope, with curve
  control for each parameter ranging from -100% to 100% for attack and release
  shaping.

  Step time allocation can be controlled between 1/32, 1/16, 1/8 and 1/4
  occurrences with a global duration multiplier (up to 64x, that is 16 bars
  max), plus minimum and random duration per step as a percentage of the time
  step triggered, and step probability to insert random zero steps and lower
  density.

  The device features 3 full oscillators that stack on top of the step
  sequencer, each being morphable with several shapes, amplitude and phase
  controls, with v2.0 revamping the oscillator section with morphable
  multishapes, wavetables, and function draw with new ui design.
specs: |-
  - Max 4 live MIDI device
  - Up to 7 different parameters control
  - Minimum and maximum value control per parameter
  - Smooth parameter modulation (instant to 2 seconds)
  - Curve control (-100% to 100%)
  - Step time allocation (1/32, 1/16, 1/8, 1/4)
  - Global duration multiplier (up to 64x)
  - Step probability control
  - 3 morphable oscillators
  - Negative modulation support
  - Compatible with live suite 10.1.41+
  - Compatible with live 11
  - Compatible with live 12
  - macOS and Windows support
