description: TAL-Elek7ro is a virtual analog synth with some special features like oscillator hardsync and frequency modulation. Including improved alias free oscillators, new developed fast envelopes and lfo's with a wide range from 0.1Hz up to 400 Hz.
details: |-
  TAL-Elek7ro is a virtual analog synth with some special features like oscillator hardsync and frequency modulation. Including improved alias free oscillators, new developed fast envelopes and lfo's with a wide range from 0.1Hz up to 400 Hz. A free routable envelope with attack and decay is available too. This synth is useful for a wide range of sounds from percussion to deep bass sounds.

  TAL lists TAL-Elek7ro under "Deprecated Plug-Ins (not supported)", alongside TAL-BassLine, the TAL-Dub plug-ins, TAL-Effects and TAL-U-NO-62.

  The last release, version 2.7 (TAL-Elek7ro-II), remains a free download as a Windows 32-bit VST, Windows 64-bit VST, OSX 32-bit VST and OSX 32-bit AU.

  Stated requirements are Windows XP or higher (32 / 64 bit) and OSX 10.6 and earlier than 10.10 with a 32-bit host. There is no 64-bit macOS build, no VST3, AAX or CLAP build, and no Linux build.

  About 80 factory presets for the synth were made by xenos. Installers for the original Elektro version 1 remain available as separate Windows VST, OSX VST and OSX AU downloads.
specs: |-
  - Virtual analog synthesizer with oscillator hard sync and frequency modulation
  - Improved alias free oscillators
  - New developed fast envelopes
  - LFOs with a wide range from 0.1 Hz up to 400 Hz
  - Free routable envelope with attack and decay, useful from percussion to deep bass sounds
  - About 80 factory presets by xenos
  - Formats: VST (Windows 32 bit and 64 bit), VST (OSX 32 bit), AU (OSX 32 bit)
  - Windows: Windows XP or higher (32 / 64 bit)
  - macOS: OSX 10.6 and < 10.10 (32 bit host)
  - Legacy downloads available: Elektro version 1 (Windows VST, OSX VST, OSX AU)
