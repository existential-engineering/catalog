description: TAL-Elek7ro is a virtual analog synth with oscillator hard sync and
  frequency modulation. Features improved alias-free oscillators, fast envelopes
  and LFOs with a wide range from 0.1 Hz up to 400 Hz, and a routable envelope
  with attack and decay. Suitable for a wide range of sounds from percussion to
  deep bass sounds.
