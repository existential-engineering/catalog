details: >-
  Arcsyn by spc plugins is a virtual analog modulator synth that is not based on
  any particular vintage hardware, but successfully captures the essence of that
  era of beasts. The purchase, download, install, and authorize process is
  simple and smooth. There are no dongles of any kind I.e., ilok, smarkkeys,
  etc.


  Arcsyn uses waveform synthesis with all oscillator waveforms generated from
  scratch. There are over 70 one-of-a-kind waveforms on board, including
  sub-harmonics for low overtones. There are several lfos and a mod arranger
  that can be used to sequence up to 16 waveforms. Additionally, users will find
  an adhsr, two routing modes (series and parallel), and mod matrix with 16
  slots.


  The self-oscillating filters are based on the oberheim matrix 12 and include
  many unusual filter types like frequency shifter, scramble and multi-alias.
  The synthesizer features two filters that can be routed in different
  configurations to get more sonic variations, and even with a mono signal path,
  users can easily set up a stereo sound by panning the filters and routing
  different oscillators to each of them.


  Oscillators and filters are 4x oversampled, all audio processing is done in
  64-bit arithmetic and control signals are updated at 5500hz or higher. The
  modulation sources include lfos (sequencers) coupled with the modulation
  matrix, with the ability to combine modulation sources via math operations.
  Audio input allows any sound that comes before this vsti to get sent through
  the effects chain.


  Arcsyn comes with over 500 preset programs and features a randomiser that
  quickly generates patches, allowing users to discover sounds efficiently. The
  plugin also has an excellent preset management directory system and supports
  MIDI controller learn functionality. From version 4, the gui is resizable and
  there is vst3 support with serial number activation.
