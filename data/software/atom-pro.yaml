details: |-
  Features 2 oscillators (saw & variable pulse), 12 voice polyphonic with
  dynamic voice allocation, resonant lpf, and lfo for pwm.

  Includes 2 adsr envelopes for amplifier and filter cutoff modulation, 64 bit
  audio engine, and is fully automatable via MIDI.

  Responds to velocity, pitch bend & modulation wheel for expressive control.

  The synth is capable of producing good leads and pads with a wide range of
  sounds, and includes good presets.
