details: |-
  A cutting-edge binaural technology powered by aspen, for virtualising stereo
  or immersive audio setups and listening rooms for headphone monitoring, with
  excellent tonal/spatial fidelity and a highly accurate translation to real
  loudspeakers.

  Key benefits: realistic virtual immersive mix/listening rooms, which can be
  customised acoustically for your own or other rooms. Effective externalisation
  and accurate localisation of virtual loudspeakers essential for making correct
  mix decisions on headphones. Excellent tonal naturalness just like listening
  to premium loudspeakers in real life. Highly accurate translation to real
  loudspeakers. Less headphone listening fatigue.

  Main features: 53 loudspeaker configurations from mono to 26 channels,
  including all popular immersive audio formats, e.g. Itu-r, dolby atmos,
  auro-3d, mpeg-h and regular arrays for ambisonics. Seven presets of
  scientifically tuned virtual rooms. Customisable acoustic parameters. Head
  tracking (osc and manual). Routing matrix with solo, mute and level controls.
  Downmix options. Hrtf set options. Headphone compensation eq (65 models).
  Loudspeaker on-axis response modelling eq (11 models).
