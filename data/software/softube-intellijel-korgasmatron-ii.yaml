description: Intellijel Korgasmatron II is a dual six mode filter which can also
  be used as a limited oscillator, created in collaboration with Intellijel as a
  Modular expansion. Any sound passed through it comes out richer, more nuanced,
  and colorful.
details: |-
  Taking inspiration from a classic Japanese synth, Intellijel Korgasmatron II is a dual voltage controlled filter which can also be used as a limited oscillator. Any sound passed through it comes out richer, more nuanced, more fiesty and colorful, largely due to the distortion characteristics of the resonant drive controls on each filter, and the fact that you can modulate and blend between two bold filters on settings as widely divergent as you like.

  Fire it up in Softube Modular and start producing magic, from classic MS-20 type sounds to totally new territory.

  Made for Modular, Softube's Eurorack platform.

  The Korgasmatron hardware is probably my favourite filter/drive Eurorack unit. The software in Modular does not disappoint at all, it sounds crunchy and in your face. - Rik Simpson, record producer, sound engineer and musician known for his work with Coldplay.

  With two multimode filters based on the famed MS20 circuit featuring resonant drive controls and serial, parallel or crossfade options, the Korgasmatron looks rather intimidating at first. But learning the ropes is well worth it, as it produces some gritty-sounding modulations. - Jan Hennig a.k.a. Kabuki, music producer and sound designer for New Forms, V Recordings.
specs: |-
  - Dual filter plus Xfade
  - Six filter types per filter (LP 1-pole, LP 2-pole, BP 1-pole, HP 2-pole, HP 1-pole, BR 1-pole)
  - Both filters track 1v/oct over 3-4 octaves (can be used as a limited VCO)
  - Switch to configure serial or parallel routing
  - Output soft and hard clipping
  - Resonance soft clipping control (Q drive)
  - Made for Modular, Softube's Eurorack platform
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Softube account required
  - iLok account required (no physical iLok required)
  - Computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Internet access (for downloading installers and managing licenses)
  - Three activations included
  - 20-day trial, 14-day returns
