details: |-
  Beat Slammer is a dynamics plugin designed for aggressive compression on
  drums, beats, and mix busses. Some compressors are designed to be subtle. This
  one is not! We set out to make the ideal compression plugin for smashing and
  squashing drums, beats or entire mix busses.

  Beat slammer will give you that pumping and 'bouncy' compression sound that
  slaps you in the face. The plugin is based on ihny-2 by baby audio and
  functions as a parallel compressor.

  This means you can compress even harder than you normally would and just blend
  in the compressed signal to taste, while retaining the dynamics of your dry
  signal.

  Get that aggressive compression sound that makes your beats 'bounce'. Add
  punch and intensity to your drums and mix busses.

  Use the xy pad to set the compression amount and dry / wet mix in one motion,
  then adjust the make-up gain and output.
specs: |-
  - Parallel compressor
  - Xy pad
  - Make-up gain control
  - Output control
  - Dry/wet mix blending
