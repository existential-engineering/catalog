description: Verberate Immersive 2 is a professional algorithmic reverb plugin built for Dolby Atmos, spatial audio, and multichannel formats up to 9.1.6. Its time-variant design produces rich, natural reverb tails that feel like part of the space—not layered on top.
details: |-
  Immersive Room Reverb That Sounds Real. Verberate Immersive 2 is a professional algorithmic reverb plugin built for Dolby Atmos, spatial audio, and multichannel formats up to 9.1.6. Its time-variant design produces rich, natural reverb tails that feel like part of the space—not layered on top. Whether you're mixing film dialogue, immersive music, or game audio, Verberate Immersive 2 gives you a believable sense of depth and place. No metallic tails. No phasey weirdness. Just clean, organic reverb that sits naturally in the mix.

  Designed for Modern Immersive Workflows. Verberate Immersive 2 was built for immersive audio from the start, with independent control of early reflections and reverb tails, plus full 3D panning for all components. It fits perfectly into large-scale Atmos music production, Foley editing, and film post-production sessions. You can position the dry signal, reflections, and tail separately within the surround field, shaping each with visual panners, divergence controls, and full support for immersive formats like 7.1.4, 9.1.6, and everything in between.

  CPU-Efficient and Session-Ready. Reverb plugins designed for immersive audio often carry a heavy CPU load, especially those using convolution. Verberate Immersive 2 avoids that entirely. Its algorithmic engine delivers high-fidelity room modelling at a fraction of the processing cost, ideal for large sessions with hundreds of channels and multiple reverb instances. It's also built for speed. Preset switching is instantaneous. You can audition different spaces mid-playback without a break in sound.

  Seamless EUCON Integration for Serious Workflows. Verberate Immersive 2 supports EUCON, giving you tight, tactile control on Avid control surfaces like the S6, S4, S3, and Dock. Its parameters are smartly mapped by default, so you can adjust reverb times, position elements in 3D space, and shape EQ and decay right from your surface.

  Made For Professional Surround Mixes. Verberate Immersive 2 is used by professionals in music and post because it lets them move quickly, sound great, and keep their systems responsive. Whether you're placing ADR in a virtual room, expanding a lead vocal in a 7.1.4 Atmos session, or building cinematic transitions with rich reverb tails, this is a tool you can trust to deliver immersive results without compromises.
specs: |-
  - Two different late reverb algorithms: the new Vivid Hall and the Legacy Hall from version 1
  - Vivid Hall is time variant and resonance free
  - Independent early reflections and reverberation tail processors
  - Integrated panners for direct signal, reverb and early reflections
  - Realistic early reflections that blend into the mix without unpleasant comb filter effects
  - Dense late reverberation tails
  - Able to model frequency dispersion in mechanical plate reverbs
  - Optional swirl effect models the frequency modulated cloud-like reverb tails of vintage digital reverb units
  - Parametric decay editor to shape reverb time by frequency
  - Built-in 5-band equalizer on input and output
  - Graphical visualization of equalizer frequency response and frequency dependent reverberation times
  - Preset manager and a large number of factory presets; save, load and categorize user presets
  - Supports all common speaker layouts up to 7.1.6
  - Support for sample rates up to 192 kHz
  - EUCON support for Avid control surfaces (S6, S4, S3, Dock)
  - Native 32 bit and 64 bit versions available on Windows; macOS runs natively on ARM64 and Intel
  - Windows 10 / 11, Intel Core i3 or AMD multi-core processor, 1 GB RAM, 1 GB free HD space
  - macOS / OS X 10.13 or later, 1 GB RAM, 1 GB free HD space
  - Supported hosts: Logic Pro, Pro Tools (2018 or later), Ableton Live, Cubase, Nuendo, Studio One, Reaper, FL Studio, Luna, Adobe Audition, Adobe Premiere, DaVinci Resolve, Reason, Media Composer
