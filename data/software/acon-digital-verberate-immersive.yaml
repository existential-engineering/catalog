description: Verberate Immersive 2 is a professional algorithmic reverb plugin built for Dolby Atmos, spatial audio, and multichannel formats up to 9.1.6. Its time-variant design produces rich, natural reverb tails that feel like part of the space—not layered on top.
details: |-
  Verberate Immersive 2 is a professional algorithmic reverb plugin built for Dolby Atmos, spatial audio, and multichannel formats up to 9.1.6. Its time-variant design produces rich, natural reverb tails that feel like part of the space, not layered on top. Whether you're mixing film dialogue, immersive music, or game audio, Verberate Immersive 2 gives you a believable sense of depth and place. No metallic tails. No phasey weirdness. Just clean, organic reverb that sits naturally in the mix.

  Verberate Immersive 2 was built for immersive audio from the start, with independent control of early reflections and reverb tails, plus full 3D panning for all components. It fits perfectly into large-scale Atmos music production, Foley editing, and film post-production sessions. You can position the dry signal, reflections, and tail separately within the surround field, shaping each with visual panners, divergence controls, and full support for immersive formats like 7.1.4, 9.1.6, and everything in between.

  Reverb plugins designed for immersive audio often carry a heavy CPU load, especially those using convolution. Verberate Immersive 2 avoids that entirely. Its algorithmic engine delivers high-fidelity room modelling at a fraction of the processing cost, ideal for large sessions with hundreds of channels and multiple reverb instances. It is also built for speed: preset switching is instantaneous, so you can audition different spaces mid-playback without a break in sound.

  Verberate Immersive 2 is used by professionals in music and post because it lets them move quickly, sound great, and keep their systems responsive. Whether you are placing ADR in a virtual room, expanding a lead vocal in a 7.1.4 Atmos session, or building cinematic transitions with rich reverb tails, this is a tool you can trust to deliver immersive results without compromises. It targets film and TV mixers working in Dolby Atmos or surround, music producers building immersive tracks, post engineers handling dialogue, ADR, and Foley, and game sound designers crafting believable environments.

  The plugin supports EUCON, giving tight, tactile control on Avid control surfaces like the S6, S4, S3, and Dock. Its parameters are smartly mapped by default, so you can adjust reverb times, position elements in 3D space, and shape EQ and decay right from the surface. Supported hosts include Logic Pro, Pro Tools, Ableton Live, Cubase, Nuendo, Studio One, Reaper, FL Studio, Luna, Adobe Audition, Adobe Premiere, Davinci Resolve, Reason, and Media Composer.
specs: |-
  - Two different late reverb algorithms: the new Vivid Hall and the Legacy Hall from version 1
  - Vivid Hall is time variant and resonance free
  - Independent early reflections and reverberation tail processors
  - Integrated panners for direct signal, reverb and early reflections
  - Realistic early reflections that blend into the mix without unpleasant comb filter effects
  - Dense late reverberation tails
  - Able to model frequency dispersion in mechanical plate reverbs
  - Optional swirl effect models the frequency modulated cloud-like reverb tails of vintage digital reverb units
  - Parametric decay editor to shape reverb time by frequency
  - Built-in 5-band EQ on input and output
  - Graphical visualization of equalizer frequency response and frequency dependent reverberation times
  - Uncluttered user interface
  - Preset manager and a large number of factory presets
  - Save, load and categorize user presets
  - EUCON support for Avid control surfaces (S6, S4, S3, Dock)
  - Supports all common speaker layouts up to 7.1.6
  - Supports sampling rates up to 96 kHz
  - Available as VST or AAX plug-ins on PC (Windows)
  - Available as VST, AAX or AU plug-ins on Apple Macintosh (macOS)
  - Native 32 bit or 64 bit versions of all plug-ins are available
  - Windows: Windows 10 / 11, Intel Core i3 or AMD multi-core processor (Intel Core i5 or faster recommended)
  - Windows: 1366 x 768 display resolution (1920 x 1080 or higher recommended)
  - Windows: host application compatible with (32 bit or 64 bit) VST, VST3 or AAX (Pro Tools 2018 or later)
  - macOS: macOS / OS X 10.13 or later, runs natively on ARM64 and Intel
  - macOS: host application compatible with (64 bit) AU, VST, VST3 or AAX (Pro Tools 2018 or later)
  - 1 GB RAM (4 GB or more recommended)
  - 1 GB free HD space
