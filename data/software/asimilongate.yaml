details: >-
  Asimilongate is a trance gate with internal 16 step sequence and controllable
  by MIDI.


  3 to 16 step internal sequencer, with 4 step types. Host synced or free
  running or MIDI control of internal sequencer.


  Can also be used as a simple MIDI gate. Adjustable attack & decay times as
  well as mix amount for ultimate sonic control.
