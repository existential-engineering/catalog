details: |-
  Create instant suspense, tension and atmosphere with these cutting-edge cinematic textures — from the heart and mind of Berlin-based composer and experimental sound artist Yair Elazar Glotman.

  From beautifully haunting, evolving drones with visceral undertones to ambient swells and earth-shattering atmospheres, this all-in-one toolkit of multi-layered electroacoustic textures have been created from a selection of extended techniques performed on double bass, vocals, guitar, as well as modular synths sounds, custom tape loops and more — developed into visceral abstract environments through sophisticated granular processing and layering techniques. Travel to new sonic dimensions with the plugin's radically transformative processed signals — from tape FX to our cavernous spatial signal, created at the legendary MONOM Studio at Funkhaus, Berlin – while our in-built controls and effects offer even further opportunity for sonic exploration.
specs: |-
  - Presented in Spitfire Audio's dedicated plugin (VST2, VST3, AAX, AU)
  - 41 techniques: 9 vocal, 2 guitar, 11 modular synthesiser (Buchla 200), 12 textures, 7 double bass
  - 8 controls including Expression, Dynamics, Re-amp, Random start, Reverb and Delay
  - 7 reverb impulse responses
  - Spatial signal recorded on the MONOM 4D Sound System at Funkhaus, Berlin
  - ~10GB, 9.8 GB disk space required during install
  - NKS compatible
  - Spitfire Audio App required
