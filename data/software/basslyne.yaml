details: |-
  Instant access to different presets is quick and easy. The ability to use
  multiple oscillators allows basslyne to produce powerful electronic and
  virtual analog-bass instruments.

  Features include a powerfully simple interface, stack module synthesis, easy
  to use design, sophisticated eq, overdrive, advanced automation, user friendly
  interface, integrated full-featured fx racks, expandable sound architecture,
  and fm oscillators.

  Basslyne by dasample is a virtual instrument audio plugin for macos and
  windows.
specs: |-
  - Multiple oscillators
  - FM oscillators
  - Module synthesis
  - Sophisticated EQ
  - Overdrive
  - Advanced automation
  - Integrated FX racks
  - Expandable sound architecture
