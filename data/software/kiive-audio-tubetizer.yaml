details: |-
  Tubetizer brings 3 Tube Saturation circuits, alongside built-in compression to be the perfect color-box for any element in your mix! From subtle warmth to aggressive distortion, the 3 included circuits have you covered for any element in your mix! Flexible Tube Saturation Inside Your DAW

  3 Unique Tube Circuits Meticulously Modeled to Compliment Every Element of Your Mix! It's no secret that tube saturation is many producers go-to saturation type when they want to make their mix feel expensive. With complete control over the tonality, through various controls like the Type, Tone, and Mode controls, you'll find just how easy Tubetizer will fit into your mixing projects as it brings life, and excitement to any signal! Fine Tuned Control

  Use the Distortion knob to dial in the perfect amount of tube saturation, and adjust the Tone control to brighten, or add weight to the signal. Included at the top, you will find Mix (Blend) controls, as well as Oversampling, and Gain-Link controls for additional finetuning. 3 Unique Saturation Modes. Each of the 3 modes was selected and meticulously modeled for its character to cover every aspect of your music. From adding weight and density to low-end instruments, to adding sheen, and character to a vocal mix, there's a mode for the job. Dynamic Control

  Control the dynamics of your freshly-saturated tracks with the Compressor control. Gently control peaks, or drive into the compressor hard for a more extreme, pumpy compression effect perfect for drums and transient heavy material!
