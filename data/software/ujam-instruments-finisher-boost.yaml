description: Create massive impacts and uplifters with one knob. A multi-effect plug-in for maximum energy transitions.
details: |-
  If transitions are lifeless or nonexistent, turning to a risers folder and smacking on some samples is a surefire way to sound generic. With BOOST, any audio track or buss becomes a new transition that meshes with the mix. Bland choruses all suffer from the same ailment, no drama, and BOOST adds a natural ebb and flow to a track with a complex combination of effect modules and processing techniques that drop in within seconds.

  BOOST syncs to the DAW's grid. Choose phrase lengths of 2, 4 or 8 measures, choose which beat hits max intensity and let it run. Everything else is handled automatically. For total control, go manual and freely automate the Finisher knob position in the DAW.

  Perfectly synced swells, downlifters and impacts can be created without diving under the hood, because BOOST tracks the playhead position of the DAW so that no matter where playback starts, the effect always hits the same bars at the same time.

  BOOST features 50 modes with more than 200 presets, divided into Track, Instrument, Drums and Vocals categories to speed up the workflow. The amount control can be cranked up for more of everything, or turned negative to filter the dry signal into oblivion and print only the boosted signal, and loop length is either set or freehanded for complete control over the dramatic arc.
specs: |-
  - 60 versatile multi-effect modes
  - 200+ included presets
  - Modes divided into Track, Instrument, Drums and Vocals categories
  - Loop control, intuitive Flip button, and Vari controls custom-tailored to each mode
  - Phrase lengths of 2, 4 or 8 measures, synced to the DAW grid and playhead position
  - Finisher knob is freely automatable in the DAW
  - Available natively on Apple Silicon
  - Plug-in formats: AAX, AU 2, VST 2 and VST 3, all 64-bit only
  - Windows: Windows 10 to Windows 11
  - Mac: macOS Catalina (10.15) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 4 GB of RAM
  - 720 MB of free disk space
  - 1280x768px display, internet connection
  - Delivery: automated installation via UJAM App, or downloadable installer file
  - Authorization via the UJAM App, or email and password within the plug-in
