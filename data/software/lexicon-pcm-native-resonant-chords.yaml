details: |-
  PCM Native Resonant Chords is a discontinued Lexicon plug-in built around an algorithm that allows multiple delay voices to be tuned to resonate on specific notes. The effect uses impulsive energy to excite six resonant voices, producing glistening chords, strange ringing delays, or truly bizarre room sounds.

  The plug-in delivers studio-quality presets, parameter automation support, an intuitive user interface, real-time spectral display with input/output metering, and portable presets that can be moved between Mac and Windows systems.

  Distributed as part of the PCM Native Effects family, Resonant Chords ships in VST, AU, and RTAS formats and requires an iLok2 for authorization. The final release (version 1.2.6) was published in August 2016.
specs: |-
  - Six resonant voices excited by impulsive energy
  - Multiple delay voices tunable to specific notes
  - Studio-quality presets
  - Parameter automation support
  - Intuitive user interface
  - Real-time spectral display with input/output metering
  - Portable presets (Mac/Windows interchange)
  - iLok2 authorization required
