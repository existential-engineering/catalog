description: Arturia microfreak editor and sound generator for the arturia
  microfreak synthesizer.
details: >-
  Arturia microfreak editor and sound generator provides direct access to the
  parameters of the arturia microfreak synthesizer and allows you to generate
  new sounds with 4 random methods to explore the sound potential of the
  microfreak.


  In the plugin VST version you can record the controller movements and
  integrate the arturia microfreak synth into your DAW project.


  Editor features include complex sound changes, direct access to the sound
  parameters, all controllers can be automated, x-y modulation of all
  parameters, and the random function to generate new sounds quickly.


  The editor is available for pc as VST / standalone 32/64-bit and for mac as
  VST / AU / standalone 64-bit.


  Arturia microfreak editor and sound generator is a virtual instrument and a
  virtual effect audio plugin and a software application for macos and windows.
specs: |-
