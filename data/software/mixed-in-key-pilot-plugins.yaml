details: |-
  Pilot Plugins is a suite of four dynamic MIDI generator plugins: Pilot Chords, Pilot Melody, Pilot Bass, and Pilot Arpeggio. Uses a knob-to-MIDI workflow for spontaneous and interactive music creation.

  Includes 250+ sounds powered by Phase Plant synth technology. Forty-nine compositional styles across two style packs: Futurism (Melodic Techno, House, Electro Pop, Deep House, Mainstage) and Pop Foundation (Pop, Rock, R&B, Hip Hop, EDM, Country, Latin, Indie).

  Apple Silicon (M1/M2/M3) natively supported. Compatible with Ableton Live, Logic Pro, FL Studio, Studio One, Pro Tools, Cubase. Works in tandem with Captain Plugins Epic.

  Version 2.0 is the current release.
