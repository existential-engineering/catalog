details: |-
  Pilot Plugins is a suite of four MIDI generator plugins from Mixed In Key, described on the page as "Your go-to for making chords, melodies, basslines and arpeggios." The page frames the product as the fastest way to write a chord progression, make a bassline and compose a melody, with the headline "Say Goodbye to Writer's Block."

  The suite includes Pilot Chords, Pilot Melody, Pilot Bass and Pilot Arpeggio, described as "4 Plugins That Work Together In Unison". The page states the plugins are powered by the award-winning Phase Plant synth and ship with 250+ synth and sampled sounds usable as placeholders or final audio bounces. Named example sounds include Neptune 106Bass, Ultra Arp Pluck, Big Room Lead, Vintage Analog, Alternation Bell and iWood.

  Pilot is sold with two style packs. Pilot Vol 1: Futurism is aimed at underground electronic producers (Melodic Techno, Melodic House, Tech House, Electro Pop, Deep House, House, Mainstage), influenced by trips to Ibiza and Amsterdam. Pilot Vol 2: Pop Foundation covers Pop, Rock, R&B, Dancehall, Hip Hop, Vocal House, EDM, Country, Latin and Indie, based on the sounds of Los Angeles and Miami. The page reports 49 styles of MIDI composition developed so far across both packs.

  The page's FAQ contrasts Pilot with Captain Plugins Epic: Pilot offers a "knob to MIDI" workflow for spontaneous and interactive creation of chords, melodies, basslines and arpeggios, while Captain Plugins Epic uses a traditional keyboard and mouse approach with a stronger emphasis on music theory and structured songwriting. The two can be used together, for example connecting Captain Chords Epic to Pilot Melody so changes in Captain automatically adjust Pilot.

  Pilot Plugins are described as dynamic MIDI generators rather than preset-based plugins, actively generating new musical ideas and MIDI patterns based on user input and adjustments. The download page notes that Pilot Volume 2 added Pilot Chords with 6 new chord styles, 6 new Melody styles, 9 for Pilot Bass and 2 for Pilot Arpeggio, plus 25 new Phase Plant sound presets on top of the existing 250+ built-in sounds.
specs: |-
  - Four MIDI generator plugins: Pilot Chords, Pilot Melody, Pilot Bass, Pilot Arpeggio
  - Powered by the Phase Plant synth engine
  - 250+ built-in synth and sampled sounds
  - 49 MIDI composition styles across both style packs
  - Two style packs: Pilot Vol 1: Futurism and Pilot Vol 2: Pop Foundation
  - "Knob to MIDI" workflow for spontaneous MIDI generation
  - Plugins work together in unison so composition stays in key
  - macOS download includes VST and AU plugin versions
  - Windows download includes VST plugin versions
  - Compatible with Windows and Mac, including Apple Silicon (M1, M2, M3)
  - Works with Ableton Live, Apple Logic Pro, FL Studio, Studio One, Pro Tools and Cubase
  - Pilot Volume 2 added 25 new Phase Plant sound presets
