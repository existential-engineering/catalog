description: A virtual drum instrument plugin built on hand-built Savior Custom Drums shells and a handpicked collection of TRX cymbals, with a deep set of engineering setups, left and right hand sampling, and a built-in mixing engine.
details: |-
  Drumforge Savior is a collaboration with Savior Custom Drums that brings a collection of hand-built custom shells into a virtual drum instrument. The kit spans tone woods, acrylic hybrids, and metals, including a one-of-a-kind kick drum that changes size along its length, with shells built by Tony Spinuzzi and Kenny Sienkiewicz.

  Cymbals come from a partnership with TRX, whose models were handpicked for versatility and for how they translate across mixes. Drums and cymbals were recorded and mixed through outboard analogue gear.

  Savior expands Drumforge's engineering setup concept further than the earlier samplers. Overhead microphones can be swapped on cymbals and mid-side ambience blended to control width, inside and outside kick microphones can be combined with a choice of felt or wood beaters, several direct snare microphones can be mixed with ambience combinations, and toms can be augmented with a bottom microphone or an overhead condenser.

  Realism features include left and right hand sampling, switchable by programming or by an auto-switching detection algorithm, a velocity interpretation curve for controlling the difference between loudest and softest hits, and a smoothing algorithm between successive hits.

  A built-in mixing engine with DSP modules designed for drums allows near-exact recreations of familiar drum mixes, and Drumshotz or user WAV one-shots can be inserted for layering. The Song Builder arranges grooves and fills from a playlist with intelligent fill logic, and the plugin ships with a lite version of European Metal Grooves Vol. 1 performed by Leo Margarit of Pain Of Salvation.
specs: |-
  - Virtual drum instrument plugin for programming or augmenting drum performances
  - Custom drum shells hand built by Tony Spinuzzi and Kenny Sienkiewicz of Savior Custom Drums
  - All cymbals are TRX branded
  - Includes 12 kicks, 12 snares, 8 sets of toms, 4 hi-hats, 2 crash rides, 2 rides, 7 crashes, 3 chinas, 6 splashes
  - Recorded and mixed with outboard analogue gear
  - Per-microphone engineering setup selection for each sample
  - Left and right hand sampling with auto-switching detection algorithm
  - Velocity interpretation curve and successive-hit smoothing
  - Fully featured virtual mixing console with built-in channel inserts
  - Loads Drumshotz or user WAV one-shots for layering
  - Fully configurable MIDI mapping with presets for other samplers
  - Song Builder for writing songs from Drumforge Groove Packs
  - Includes a lite version of the European Metal Grooves pack
  - Apple Silicon native compatible
