description: "A fully equipped virtual drum instrument plugin featuring custom drums hand-built by Savior Custom Drums and TRX cymbals. Designed for programming realistic drum performances of any kind or augmenting existing drum recordings."
details: |-
  Drumforge Savior is a virtual drum sampler built around an exclusive collaboration with Savior Custom Drums and TRX Cymbals. The instrument ships with custom-built kick drums, snares, and tom sets alongside a comprehensive TRX cymbal library including crashes, rides, hi-hats, chinas, and splashes.

  Each instrument is captured with multiple microphone configurations, giving users detailed control over the tone and character of every hit. The built-in mixing console includes per-channel inserts, enabling in-the-box mixing without leaving the plugin.

  The Song Builder feature allows users to quickly sketch out compositions using the included MIDI groove library, and the plugin supports both left- and right-hand sampling for realistic performance nuance. Custom WAV samples and Drumshotz packs can be loaded alongside the built-in content.

  Purchase includes European Metal Grooves Vol. 1 Lite, a user manual, and free lifetime updates. The license is perpetual with instant digital delivery.
specs: |-
  - 12 kicks, 12 snares, 8 tom sets, 4 hi-hats, 2 crash rides, 2 rides, 7 crashes, 3 chinas, 6 splashes
  - Multiple microphone configurations per instrument
  - Built-in mixing console with channel inserts
  - Song Builder for quick composition
  - Left/right hand sampling for realistic performances
  - MIDI mapping with preset configurations
  - Support for custom WAV samples and Drumshotz packs
  - Windows 8.1+ (64-bit): VST3, AAX
  - macOS 11+ (64-bit): VST3, AU, AAX
  - Apple Silicon native compatible
  - Perpetual license, free lifetime updates
