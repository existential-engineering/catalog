description: The new PSP Saturator brings a new updated sound engine to a classic PSP Audioware plug-in! With a brand new UI, refined algorithms, and many under-the-hood enhancements, this new addition to the PSP Audioware lineup is ready to bring some heat into a production.
details: |-
  PSP Saturator emulates the way that analog devices such as tape recorders and valve circuits warm up and "saturate" audio material. This is achieved by adding harmonics, dedicated filtering, and dynamic processing. PSP Saturator uses three algorithms to emulate these devices, and offers eight different shape modes for loads of flexibility from subtle 'mix mojo' to outright audio destruction.

  A new addition to the PSP Audioware lineup, PSP Saturator brings its refined algorithms and pushes the quality of saturation to a new level and can virtually heat up a production.

  PSP Saturator is based on the concept of the now legendary PSP MixSaturator, which was developed 20 years ago. That concept was reintroduced and brought up to modern standards, drawing on what PSP had learned across the following decades of plug-in development. During the long months of the development cycle it became apparent that each part of its algorithms had to be written from scratch, or at least seriously redesigned, on the basis of 21 years of DSP experience.

  Rather than simply copying the older engines, PSP took the opportunity for a total refresh of one of its most lauded plug-ins while still keeping true to its roots. The extended development process addressed some of the original's weaknesses and added support for retina screens, scalable interfaces, and oversampling up to 384 kHz.

  Now, how about the new PSP Saturator vs. the Saturator module of PSP InfiniStrip? Although these two appear very similar on the surface and do share a few bits of their sonic DNA, there are a few key changes under the hood! PSP Saturator includes many more options to deeply refine the overall tone and character of the saturation like the included High Pass Filter (HPF), the output saturation/limiter stage, and the inclusion of two additional saturation shapes (for a total of 8 instead of PSP InfiniStrip's 6). The FAT quad-oversampling toggle is also new to PSP Saturator, along with the dedicated High and Low frequency algorithms to further refine the sound.
specs: |-
  - 8 different saturation shapes for a variety of tonal flavors.
  - Three signal sculpting engines (low, high, overall saturation).
  - Adjustable Low and High band processing engines for adequate, band related warming effects.
  - Parallel mix option, with internal intelligent phase alignment.
  - Multiple metering modes for signal analysis.
  - Additional control panel for fine-tuning of various saturation parameters and smoothing.
  - Three output modes (off, sat, lim) for shaping the final output stage.
  - Input and Output gain controls, with optional relative link.
  - Optional "FAT" quad-sampling for pristine saturation quality.
  - Very low internal latency of 6 samples.
  - 200 presets designed by top engineers and producers.
  - Windows: Windows 7 - Windows 11, 64-bit VST, VST3 and AAX (Pro Tools) host application.
  - macOS: macOS 10.14 - macOS 14 Sonoma, Intel or Silicon, 64-bit AudioUnit, VST, VST3 and AAX (Pro Tools) host application.
  - Requires a free iLok user ID and the iLok License Manager application, no hardware dongle required.
  - License activatable in 3 separate locations (computer or iLok dongle 2nd generation or above).
  - 30-day trial available for macOS and Windows.
