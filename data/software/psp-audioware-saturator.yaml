description: PSP Saturator emulates analog saturation devices like tape recorders and valve circuits by adding harmonics, dedicated filtering, and dynamic processing. Offers flexible saturation ranging from subtle mix mojo to outright audio destruction, featuring 8 saturation shape modes, three signal sculpting engines, parallel mix with intelligent phase alignment, and a FAT quad-sampling option with up to 384MHz oversampling. Comes with 200 presets.
details: |-
  PSP Saturator requires iLok user ID and iLok License Manager. License activates in up to 3 locations. Low internal latency of 6 samples. FAT quad-sampling option available. 200 presets by industry professionals included. A 30-day free trial is available.
specs: |-
  - 8 saturation shape modes
  - Three signal sculpting engines: low, high, overall
  - Parallel mix with intelligent phase alignment
  - Multiple metering modes
  - Output modes: off, saturation, limiter
  - FAT quad-sampling option (up to 384MHz oversampling)
  - Input/Output gain controls with optional linking
  - 200 presets by industry professionals
  - Low internal latency: 6 samples
  - Windows: 7-11 (64-bit)
  - macOS: 10.14-15 (Intel and Apple Silicon)
  - iLok required (up to 3 activations)
