description: A fat analog sound filter bank vocoder plugin with 8/16/32 band switching, zero latency, formant shift, and sidechain input for expressive voice processing in music production.
details: |-
  DeeVocoder is a filter bank type stereo vocoder plugin from DOTEC-AUDIO, designed to deliver a fat analog sound character. Unlike FFT-based vocoders, it uses a true filter bank architecture for zero-latency processing, making it suitable for live performance and real-time tracking scenarios.

  The plugin features switchable band resolution with 8, 16, or 32 bands, allowing users to balance between a smoother, more characterful analog tone (fewer bands) and higher definition voice intelligibility (more bands). LOW, MID, and HIGH faders provide direct control over the spectral balance across the vocoded signal.

  A formant shift control enables voice gender modification by shifting the resonant characteristics of the filter bank up or down, useful for creative character transformation or natural-sounding pitch correction on vocal material.

  DeeVocoder supports sidechain input, allowing any instrument or audio source to act as the carrier signal for the vocoder — not just the built-in synthesizer. This enables classic robotic vocal effects as well as more experimental timbral combinations. The plugin has been tested with over 27 DAW hosts including Ableton Live, Cubase, Logic Pro X, FL Studio, Pro Tools, Studio One, Reason, BITWIG STUDIO, Digital Performer, and GarageBand.

  The plugin is available as a free demo with one second of silence inserted every 30 seconds. The full license is priced at $50 USD, with coupon and serial key discounts available for existing DOTEC-AUDIO customers.
