description: Invisible Limiter G2 is focusing to allow precise control to user. Its basic algorithm is inherited from the predecessor Invisible Limiter, but there are a lot of enhancements, such as reduction shape controls, softknee, channel link, manual attack/release time, dither, side chain filter, etc.
details: |-
  Loudness war is over, limiting just for loudness is no longer an issue, however, how we should limit signals is still an issue. Limiters continue to play one of crucial roles in mastering process, and become a more aggressive part in sound tuning.

  Invisible Limiter G2 is focusing to allow precise control to user. Its basic algorithm is inherited from the predecessor Invisible Limiter, but there are a lot of enhancements, such as reduction shape controls, softknee, channel link, manual attack/release time, dither, side chain filter, etc. You will get huge amount of freedom.

  The freedom of control also brings complexity and difficulties in learning. Invisible Limiter G2 offers "Easy Mode". In this mode, the limiter shows only essential controls for rapid learning and practical use.

  Loudness affects to perception. Louder sound often brings better impression for listeners, but the same effect leads engineers to a wrong sound judgement. The idea of Unity Gain Monitoring is simple, putting negative gain on output stage. The amount of negative gain is same as makeup gain. Using Unity Gain Monitoring, the makeup gain is cancelled and you can focus the sound difference through limiting.

  Non-oversampling peak limiters have a problem on detecting peaks. Non-oversampling(1x) limiters cannot detect a true peak in resulting analog waveform. In contrast, oversampling(8x) limiters can detect and process the true peaks. Note that Invisible Limiter G2 is true peak aware, but it is for sound, not for measurement. There is an obscure but important improvement in oversampling low-pass filter. In Invisible Limiter the filter has achieved 70 to 80dB reduction, the corresponding part in Invisible Limiter G2 does 160dB.
specs: |-
  - Reduction shape controls, softknee, channel link, manual attack/release time, dither, side chain filter
  - Easy Mode showing only essential controls
  - Unity Gain Monitoring cancels makeup gain for unbiased sound judgement
  - 8x oversampling with true peak aware detection
  - Oversampling low-pass filter with 160dB reduction
  - Supports 44.1k - 384kHz Sample Rate
  - 64-bit Floating-point Internal Precision
  - Latency Compensation
  - Factory Preset
  - User Preset
  - Snapshot
  - Undo/Redo
  - Reset to Default
  - Windows: x64-compatible CPU, Windows 11 24H2, Windows 11 25H2
  - Mac: Intel / Apple Silicon, macOS Monterey 12 through macOS Tahoe 26
