description: An advanced mastering limiter prioritizing precise control and
  sound quality, with Easy Mode, multiple reduction algorithms, and support for
  up to 12-channel symmetric I/O.
details: |-
  Invisible Limiter G2 is the second generation of A.O.M.'s flagship mastering
  limiter series. It focuses on practical limiting beyond mere loudness
  maximization, incorporating advanced features for precise control over the
  limiting behavior.

  The plugin features an Easy Mode for simplified operation alongside deep
  controls including reduction shape, soft knee, and channel linking parameters.
  Multiple reduction mode algorithms (Modern II through V variants) offer
  different sonic characteristics for various source material.

  Unity Gain Monitoring reduces loudness-based perception bias during critical
  listening. The 8x oversampling engine with true peak awareness employs
  advanced low-pass filtering achieving 160dB reduction in the oversampling
  stage. The plugin supports up to 12-channel symmetric I/O for immersive audio
  formats.

  Additional features include built-in dither, sidechain filter, manual
  attack/release controls, and a comprehensive preset system with factory and
  user presets.
specs: |-
  - Easy Mode for simplified operation
  - Unity Gain Monitoring
  - 8x oversampling with true peak awareness
  - 160dB low-pass filtering in oversampling stage
  - Multiple reduction algorithms (Modern II-V)
  - Up to 12-channel symmetric I/O
  - Built-in dither
  - Sidechain filter
  - Manual attack/release controls
  - Sample rates: 44.1kHz to 384kHz
  - 64-bit floating-point internal precision
