name: BotteX
manufacturer: midi-mobiles
primaryCategory: sequencer
description: BotteX is a MIDI plugin similar to fadory but for only sending a
  binary message on/off.
details: |-
  BotteX is a MIDI plugin for sending binary message on/off commands. It can be
  used in mono mode to activate a single trigger, or in poly mode to activate
  multiple triggers simultaneously in synthesisers or effect processors that can
  learn MIDI messages.

  The interface is customisable with different MIDI parameters, and a panel
  option allows additional functions. The plugin supports different operational
  modes through button interface and frame mode selection.

  Bottex includes a step sequencer with chord save and trigger capabilities,
  chord writing functionality, and an arpeggiator mode supporting 8 notes
  polyphony simultaneously.

  You can record notes with intensity and length from a keyboard in real time
  when using bottex with lfo time functionality.

  A user manual is available, and a pro version with lfo in different buttons
  and additional parameters is planned.
specs: |-
  - MIDI plugin
  - Mono mode
  - Poly mode
  - Binary message on/off
  - Customisable interface
  - MIDI parameters
  - Step sequencer
  - Chord save
  - Chord writing
  - Arpeggiator mode
  - 8 notes polyphony
  - Note recording with intensity and length
  - Button interface
  - Frame mode selection
