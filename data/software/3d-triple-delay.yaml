details: |-
  The 3d triple delay is harrison's modern take on delay. To the right of the plug-in are 8 vigorously tweaked presets to get you started without much hassle.

  For tweakheads, the 3d triple delay includes 3 separate delay taps (left, right, and l+r) that can be panned and timed independently upon the plug-in's grid. Each delay tap includes controls for input gain, output gain, and a fine delay adjustment.

  The feedback controls allow you to get even more tweaky. The first knob allows you to adjust how much the l+r delay tap feeds into the left and right taps, or vice versa, which is useful in creating a spacial effect. The second knob adjusts how much the left and right feed-back into each other, which is good for creating a ping-pong effect. The third knob adjusts how much each delay tap feeds into itself, creating a tape-style loop delay. A fourth knob is added to adjust how much hf roll-off occurs over time.

  Version 2.3 of the plug-in added an oversampling feature, allowing the mixer to adjust the quality of the delay as needed.

  3d triple delay is available as part of the plug-in essentials pack for mixbus.
specs: |-
  - 3 separate delay taps (left, right, and l+r)
  - Independent panning and timing
  - Input gain control
  - Output gain control
  - Fine delay adjustment
  - L+r to left/right feedback control
  - Left/right cross-feedback control
  - Self-feedback control
  - Hf roll-off control
  - Oversampling feature
  - Lv2 plugin
  - Macos support
  - Windows support
  - Linux support
