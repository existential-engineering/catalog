details: >-
  Recorded using sophisticated engineering techniques and exclusive vintage
  gear, abbey road 60s drums provides a versatile arsenal of classic drum sounds
  with absolute tonal authenticity, supreme playability and immense sonic
  flexibility. For use in the free kontakt player and the kontakt 4 sampler, it
  provides a unique resource for typical sixties sound aesthetics as well as for
  modern pop, rock and urban music styles.


  Abbey road 60s drums features two quintessential drum kits of the sixties era,
  a gretsch and a ludwig, which were recorded in painstaking detail utilizing
  abbey road's engineering expertise and arsenal of vintage equipment. Classic
  akg, neumann and stc microphones from the studios' famed microphone
  collection, the exclusive redd.17 and emi tg mixing desks, a valve-based
  studer tape machine and other authentic outboard gear all contributed to the
  sound of abbey road 60s drums.


  With up to 30 velocity layers per instrument, each utilizing up to six
  randomly selected variation samples, as well as separate left- and right-hand
  samples and individually adjustable snare bleed, abbey road 60s drums delivers
  ultimate authenticity both for DAW-based rhythm programming and for real-time
  MIDI-controlled drum playing.


  To cover both classic and contemporary sound aesthetics, users can choose
  between vintage and modern microphone setups, and select separate tea towel
  samples for an even more distinctive, punchier sound. A special room
  microphone configuration was used to fully capture the acoustic room sound of
  abbey road's famous studio two, with the ambience individually adjustable for
  each instrument.


  The concise user interface of abbey road 60s drums makes full use of the
  advanced gui features of the kontakt platform, with convenient controls for
  articulation, sound shaping, mixing and routing functions. Advanced
  randomization features can even add additional subtle nuances to the tone and
  timing, making it sound completely organic and virtually indistinguishable
  from a conventional studio-recorded drum performance.
