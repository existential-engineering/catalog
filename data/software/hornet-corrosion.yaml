description: Corrosion is a ring modulator designed to give your tracks grit and weird distortions, it has both internal and external modulation sources
details: |-
  Corrosion is an audio effect born from the collaboration between The Buildzer and HoRNet Plugins. The plugin is designed to create distorted, corroded sounds, giving musicians, sound designers and producers a tool to add grit and texture to their tracks. It is particularly effective on snare drums, kick sounds, or any element that needs to be thickened with a powerful, noisy distortion.

  At its core Corrosion uses ring modulation. A synthesized source such as white noise, sine, saw or square waves modulates the input sound, introducing intermodulation distortion and creating new harmonics that enrich the original signal. When the modulator and carrier are not in tune they produce dissonant metallic distortion, which can transform any sound into something more aggressive, full and distorted. The white noise option brings an intense, chaotic character, while the sine wave produces a smoother, more controlled distortion.

  What sets Corrosion apart from other ring modulators is its resonant filter. The modulation signal can be filtered with resonant low pass, band pass and high pass filters, letting you tune the modulator to a specific frequency. The track pitch option makes the modulator automatically follow the fundamental frequency of the input sound in real time, so the modulated sound stays in tune with the source and the harmonic resonance evolves with the input's pitch.

  Corrosion also includes analog saturation across the signal path. Driven hard, this saturation mimics the characteristics of transistor distortion, adding a fat and punchy tone. On drum loops the saturation adds thickness and punch while the modulation creates complex, evolving textures.

  An external audio input can be used as the modulator source, so an existing track can modulate another: a vocal modulating a bass line, or one drum loop modulating another. The interface stays clean and straightforward with input, output and bypass controls plus an X,Y trackpad for easy filter manipulation.
specs: |-
  - Ring modulation that creates intermodulation distortion
  - Modulator sources: noise, stereo noise, sine, saw, square wave, external input
  - Resonant low pass, band pass and high pass filters for the modulator
  - Analog saturation across the signal path
  - 'Track pitch' feature that automatically tunes the filter
  - Input, output and bypass controls
  - X,Y trackpad to allow easy filter manipulation
  - macOS (10.13 and later) and Windows (Vista and later) support
  - 64-bit compatibility both on Mac and Windows
  - Audio Units, VST3 and AAX format
  - Apple Silicon native support
  - No copy protection
