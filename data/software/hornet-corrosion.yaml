description: Corrosion is a ring modulator designed to give your tracks grit and weird distortions, it has both internal and external modulation sources
details: |-
  Corrosion is an innovative audio effect born from the collaboration between The Buildzer and HoRNet Plugins. The plugin is specifically designed to create distorted, corroded sounds, giving musicians, sound designers, and producers a tool to add grit and texture to their tracks. Whether you want to introduce roughness to smooth bass lines, add character to synthetic sounds, or enhance drum loops, Corrosion offers a wide range of possibilities. It's particularly effective when used on snare drums, kick sounds, or any element that needs to be "thickened" with a powerful, noisy distortion.

  At its core, Corrosion utilizes a very straightforward but effective processing technique known as ring modulation. The basic concept involves modulating a synthesized source, such as white noise, sine waves, saw waves, or square waves, to modulate the input sound. This process introduces intermodulation distortion, which is the result of combining two signals that create harmonic content. This harmonic distortion is what gives Corrosion its distinct, noisy character, making it ideal for adding metallic textures to your sound design.

  One of the key features that set Corrosion apart from other ring modulators is its resonant filter. Unlike other ring modulators, which often rely on static, simple filters, Corrosion allows you to filter the modulation signal using a resonant filter. This filter is adjustable, giving you the ability to tune the modulator to a specific frequency. The track pitch option enables you to have the modulator automatically follow the fundamental frequency of your input sound, adjusting the modulation in real-time, so the modulated sound stays in tune with the original source.

  The flexibility of Corrosion doesn't stop there, it also includes analog saturation. This feature allows you to add warmth and grit to your signal by introducing analog-style distortion. When enabled and driven hard, this saturation mimics the characteristics of transistor distortion, adding a fat and punchy tone to any sound. Corrosion also allows you to use an external audio input as the modulator source, so you can take an existing audio track and use it to modulate another track.

  Corrosion is designed with ease of use in mind. The plugin interface is clean, intuitive, and straightforward, with simple controls for input, output, and bypass. You can easily adjust the level of modulation and distortion, fine-tune the resonant filter, or switch between different modulation sources with minimal effort.
specs: |-
  - Ring modulation that creates intermodulation distortion
  - Modulator sources: noise, stereo noise, sine, saw, square wave, external input
  - Resonant low pass, band pass and high pass filters for the modulator
  - Analog saturation across the signal path
  - "Track pitch" feature that automatically tunes the filter
  - Input, output and bypass controls
  - X,Y trackpad to allow easy filter manipulation
  - macOS (10.13 and later) and Windows (Vista and later) support
  - 64-bit compatibility both on Mac and Windows
  - Audio Units, VST3 and AAX format
  - Apple Silicon native support
  - No copy protection
