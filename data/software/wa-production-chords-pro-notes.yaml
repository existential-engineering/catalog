description: A chord and arpeggio MIDI effect that builds progressions of up to eight chords from a circular interface. A separate Notes page partitions each chord into up to eight steps for melodies, arpeggios and gated patterns.
details: |-
  Chords Pro + Notes creates chords and arpeggios from simple starting ideas, all editable within a circular interface. It was designed originally for EDM productions but works across genres, suggesting anything from a single four-note chord to a complex eight-chord multi-note arpeggio.

  Placed ahead of any MIDI-triggered instrument, the plugin generates looped options for up to eight chords with control over chord shape, inversions, velocity, partitions and arpeggio notes. The resulting MIDI can be dragged straight from the plugin into the host project.

  The Notes mode is an entirely separate interface page carrying a note-pattern editor built into the chord playback. As well as sounding four notes at once per chord, it can partition each chord into up to eight segments with independent control over every note of every partition, which suits piano melodies, plucked arpeggios and gated chords. Preset sequences, copy and paste controls and repeat functions speed up programming.

  Global controls set chord inversions, length, speed and root key for the whole playback, and clicking a segment gives granular control over chord shape (including major and minor variations), individual inversions and velocity. An A/B comparison toggle holds one sequence while another is tried, and the create button randomises one or more chords intelligently from the chords the riff starts on.

  Up to eight chord segments each carry up to eight partitions and can trigger between one and four notes per chord. Playback syncs to the host BPM, inversions run from -6 to +6 and apply to the note playback as well as the chords, and 30 chord types cover Tonic, Subdominant and Dominant from simple triads to shapes such as Dbm7b5. A large set of labelled factory chord progressions and arpeggio sequence presets is included.
specs: |-
  - Professional chord and arpeggio MIDI effect
  - Connects to any DAW
  - 30 chord types
  - Factory presets for chords and sequences
  - AI randomization
  - Intelligent harmonic progressions
  - A/B toggle with copy and paste
  - Global and per-segment control
  - Note partition control
  - Preview mode for in-plugin playback
  - Export MIDI by drag and drop
  - Resizable interface
  - PDF manual and tutorial video
  - Up to 8 chord segments with up to 8 partitions each
  - Inversions from -6 to +6, applied to chord and note playback
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Tested on Windows with FL Studio 12, Cubase 10, Studio One 5, Ableton Live 9 and Pro Tools 11 or newer
  - Tested on Mac with FL Studio 12, Cubase 10, Studio One 5, Ableton Live 9, Logic Pro X and Pro Tools 11 or newer
  - Also tested with NI Maschine and Mixcraft
  - Not compatible with Maschine 2, which offers no MIDI routing
  - Not compatible with Reason, which offers no MIDI routing
