description: "A saturation plugin built on real analog circuit modeling,
  featuring the Relab 176's variable-gain 6BC8 tube circuit with input/output
  transformers. Offers true hardware saturation in software form with drive
  control ranging from subtle warmth to bold crunch, calibration control for
  bias adjustment and harmonic tuning, low-end crossover filter, and pre/post
  tilt emphasis filters."
details: |-
  Real-time circuit solving of 6BC8 tube stage with transformers
  Drive control for tube saturation
  Output transformer coupling switch
  Calibration control for bias adjustment and harmonic tuning
  Low-end crossover filter
  Pre/post tilt and high-shelf emphasis filters
  Expandable architecture for future color pack upgrades
  Hand-crafted factory presets

  PACE iLok account required (dongle optional)
