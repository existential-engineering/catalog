details: |-
  Battery 4 is the drum sampler designed for the 21st century. It combines a
  supercharged library, tailor-made for electronic and hip hop music, with a
  radically-intuitive workflow that keeps the focus on creativity. Instantly
  find and arrange sounds with a new, tag-based browser, and route powerful new
  effects with drag-and-drop simplicity.

  The gui change from battery 3 to 4 is huge. Editing start and end points is
  now much easier and faster. Loading samples and assigning them to a cell is
  straightforward. Layering samples within a cell is supported, and layered
  samples can be tweaked separately for important parameters like pitch, vol and
  pan. The new file explorer is faster and gives you the possibility to tag your
  own samples.

  Processing and sound warping your samples within battery 4 is straightforward
  and features a lot of different ways. You can even group cells on a bus and
  then tweak and process the bus internally. Battery 4 runs tight with 8 mono
  and 8 stereo individual outs.

  Battery 4 comes with a lot of complete drum presets. The included library is
  huge and has its own sound character. The samples sound very good and clean
  and come well tagged. Battery 4 is a virtual instrument audio plugin for macos
  and windows.
specs: |-
  - Tag-based browser
  - Drag-and-drop effects routing
  - 8 mono outputs
  - 8 stereo individual outputs
  - Sample layering
  - Pitch control
  - Volume control
  - Pan control
  - Internal effects
  - Compressors
  - Filters
  - Sound warping features
  - Cell grouping on bus
  - MIDI triggering
  - Custom kit creation
  - Sample tagging system
  - Envelope presets
  - Universal 2 binary
