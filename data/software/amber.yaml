details: |-
  Amber is part of dcam: synth squad, a collection of 4 software instruments designed for macOS and Windows.

  One of the first attempts to realistically model the divide-down string ensemble synths from the '70s, amber captures the lush, psychedelic sound of these much-loved but often-forgotten instruments.

  A formant filter, 3 separate chorus models, a variety of playing responses and flexible modulation build upon the legacy to deliver a new take on these vintage classics.
