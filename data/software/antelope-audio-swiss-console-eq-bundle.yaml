description: The Swiss Console EQ Bundle features 3 effects modeled after iconic
  console effects. They give your sound a warm and authentic analog treatment.
details: |-
  The manufacturer of the hardware originals these effects are modeled after, set a real standard of sonic excellence with its renowned mixing consoles. These desks earned their place as top music recording devices with their transparent, yet gently colored sound.

  Give your sound that warm and authentic analog treatment with the Swiss Console EQ Bundle, which includes three plugins modeled after vintage Swiss mixing consoles spanning the late 1950s through the early 1980s.

  The bundle runs natively in your DAW on macOS or Windows, and in real time on Synergy Core interfaces.
specs: |-
  - VEQ-STU 169: late 50s, modeled after the first portable mixing console
  - VEQ-STU 089: late 60s, modeled after a full discrete transistor-based console
  - VEQ-STU 900: early 80s, modeled after one of the best-sounding analog mixing desks
  - Runs natively on macOS / Windows and in real time on Synergy Core interfaces
