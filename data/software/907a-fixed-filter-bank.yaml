details: |-
  907a fixed filter bank is a faithful recreation of the moog modular synthesizer's 907a module, and it creates a variety of tonal effects by passing its input signal through eight band-pass filters, one low-pass filter and one high-pass filter.

  The 907a is a subtle effect, capable of adding rich luster to pads, and giving percussive and lead synth sounds a vocal quality.

  It is simple to use yet capable of complex and unique timbres.

  Full MIDI learn mode, for MIDI cc control of every control (VST only; handled by host in AU version).
specs: |-
  - 24db low-pass and high-pass filters
  - Eight fixed-frequency band-pass filters
  - True stereo operation
  - Low cpu usage
  - Full MIDI learn mode
  - VST plugin
  - Audio units plugin
  - Macos and windows compatible
