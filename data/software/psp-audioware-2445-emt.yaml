details: |-
  PSP 2445 EMT is a reverb processor plug-in inspired by two legendary early digital age reverberators: the EMT 244 and the EMT 245. PSP thoroughly researched how to bring the specific features of those simple, yet very musical sounding reverbs to life as a plug-in.

  PSP 2445 EMT goes beyond the originals with a set of parameters for controlling details of the sound and mixing the reverb that were not available in the original hardware. PSP 2445 is capable of processing using one selected engine or both of them simultaneously.

  The reverb algorithms implemented in PSP 2445 are based on original algorithms designed by Dr. Barry Blesser (one of the grandfathers of the digital audio revolution). Thanks to Dr. Blesser's extensive consultation and support, the algorithms sound as good as the originals, and the plug-in could be officially endorsed by EMT Studiotechnik GmbH.

  Running PSP 2445 EMT in 30-day trial mode or activating it requires no hardware dongle, but does require an iLok user ID, which can be created for free at www.ilok.com, and the free iLok License Manager application. The license can be activated in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above). Licenses can be moved at any time using PACE's iLok License Manager software.
specs: |-
  - Two reverb engines modelled on the EMT 244 and EMT 245, usable individually or both simultaneously
  - Reverb algorithms based on original designs by Dr. Barry Blesser, officially endorsed by EMT Studiotechnik GmbH
  - Additional sound-shaping and mix parameters not available on the original hardware
  - Windows 7 to Windows 11, 64-bit host application (VST, VST3, AAX / Pro Tools)
  - macOS 10.14 to macOS 15 Sequoia, Intel and Apple Silicon, 64-bit host application (AudioUnit, VST, VST3, AAX / Pro Tools)
  - iLok authorisation via iLok License Manager, no hardware dongle required, 3 activation locations
