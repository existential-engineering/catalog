description: "PSP 2445 EMT is a reverb processor plug-in inspired by two legendary early digital age reverberators: the EMT 244 and the EMT 245. Improves upon the originals with controllable parameters for sound details and reverb mixing unavailable in the original hardware. Can process using one selected engine or both simultaneously. Algorithms are based on designs by Dr. Barry Blesser and carry official endorsement from EMT Studiotechnik GmbH."
details: |-
  Dual reverb engine based on the EMT 244 and EMT 245 early digital reverberators. Algorithms designed by Dr. Barry Blesser, officially endorsed by EMT Studiotechnik GmbH. Can use one or both engines simultaneously. Suitable for vocals, guitars, drums, percussion, synths, and bass. License activation via iLok user ID (no hardware dongle required). Activatable in 3 separate locations. 30-day trial available.
