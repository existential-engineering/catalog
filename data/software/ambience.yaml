details: >-
  Ambience is a free reverb that rivals the quality of the best commercial
  reverbs.


  The plugin features a gui with an excellent layout where every knob is
  positioned correctly. It includes approximately 60 to 70 presets, many
  contributed by kvrians, providing good starting points for various reverb
  treatments.


  Special features include the quality/cpu parameter which helps manage cpu
  usage during mixing, and the hold parameter which effectively freezes the
  reverb tail until the button is released, enabling automated effects.


  The plugin is designed to be super-intuitive with minimal need for
  documentation. It functions as both a VST plugin and an audio units plugin for
  macos and windows.


  Ambience excels as a plate or spring reverb with a metallic character, and is
  particularly effective for creating room effects on drums and other percussive
  elements. The gating feature is noted as a significant strength, essential for
  certain drum treatments with plate and spring reverb types.
