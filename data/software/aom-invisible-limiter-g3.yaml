description: The third generation mastering limiter with significant algorithmic
  updates, featuring separate Soft Limiter and Brickwall Limiter sections,
  Mid/Side processing, and oversampling up to 1.5MHz.
details: |-
  Invisible Limiter G3 is the third generation of the Invisible Limiter series,
  featuring significant updates to the fundamental limiting algorithm and
  oversampling engine. It is designed to support modern mastering techniques
  with enhanced flexibility.

  The plugin introduces a conceptual separation between intermediate peak
  envelope control and final brickwall limiting. The Soft Limiter section
  provides flexible peak envelope control, while the refined Brickwall Limiter
  handles final peak management.

  Mid/Side processing and parallel compression capabilities expand the creative
  possibilities. The flexible reduction curve shape adjustment includes
  time-axis bending for precise control over the limiting character. True peak
  limiting is supported with dedicated reduction, peak, and level meters.

  The oversampling engine can reach approximately 1.5MHz internal sample rate,
  combined with Unity Gain Monitoring for unbiased critical listening during
  mastering sessions.
specs: |-
  - Separate Soft Limiter and Brickwall Limiter sections
  - Mid/Side processing
  - Parallel compression
  - Flexible reduction curve shape with time-axis bending
  - True peak limiting with dedicated metering
  - Oversampling up to approximately 1.5MHz
  - Unity Gain Monitor
  - Sample rates: 44.1kHz to 384kHz
  - 64-bit floating-point internal precision
  - Latency compensation included
