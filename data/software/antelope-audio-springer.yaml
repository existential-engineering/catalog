description: "Add vintage spring reverb to your mix with Antelope Audio's
  Springer - a flexible plugin with adjustable tension, decay, damping, and tone
  controls. Retro sound, modern control. Free 14-day trial."
details: |-
  Springer captures the vintage charm of analog spring tanks while giving you deep control over every detail of the reverb's behavior. Whether you're chasing surf rock authenticity or experimenting with lo-fi textures, Springer lets you sculpt everything from subtle shimmer to bold, washed-out character with precision.

  The plugin emulates the distinct sound of mechanical spring tanks with rich resonance, metallic overtones, and natural modulation, making it ideal for adding vintage color to guitars, vocals, keys, and more. Going beyond basic emulation, direct control over tank size, spring tension, and density lets you fine-tune the physical response of the reverb - whether you want tight, bouncy reflections or wide, chaotic trails.

  Detailed tone shaping is handled via damping and tone controls, letting you darken or brighten the tail, control resonance buildup, and sculpt the decay to suit clean or saturated mixes. Pre-delay and stereo depth settings adjust the timing and spatial placement of the reverb, great for enhancing separation, adding rhythmic space, or dialing in cinematic ambiance.

  Designed for both classic reverb fans and experimental producers, Springer's intuitive interface encourages quick results while offering deep parameter control for truly custom spring textures. Springer runs natively in your DAW on macOS or Windows and is part of the Antelope Cosmos plugin collection, with a free 14-day trial available.
