description: HoRNet DeeLay Plus is an advanced delay audio plugin rich in modulation options and with graphic sound display to create moving sounds and rich spaces.
details: |-
  HoRNet DeeLay Plus is a versatile and advanced delay plugin designed for those who want more than just echoes. Whether you’re aiming to add space, create movement, or dive into experimental sound design, DeeLay Plus delivers. At its core, this plugin features two independent delay units, each with flexible routing and modulation options that offer an impressive range of creative possibilities. From traditional stereo delay to cross-feedback loops, pitch-shifting echoes, or crushed rhythmic textures, HoRNet DeeLay Plus transforms a simple delay into a dynamic sound design tool.

  The plugin’s architecture revolves around two separate delay lines, referred to as Left and Right for convenience. Each line can be routed independently to the left or right channel, giving you full control over the stereo image. This routing flexibility means you can create tightly synced stereo delays or wide, asynchronous effects that evolve across the stereo field. In addition, each delay unit includes its own feedback control, and you can also cross-feed the feedback signal between the two units—allowing echoes from one side to feed into the other and vice versa. This opens the door to complex feedback networks and chaotic, evolving textures.

  DeeLay Plus includes all the standard delay controls you’d expect, such as feedback and delay time. These parameters can be linked for synchronized editing, or you can adjust them individually for asymmetric delays. The delay time can be set in milliseconds or synced to the host tempo, making it easy to build time-based effects in rhythm with your track. Whether you’re using it as a tempo-synced stereo delay, a subtle slapback echo, or a rhythmic tool, DeeLay Plus adapts to your needs.

  One of the most useful features of DeeLay Plus is its visual feedback system. At the top of the plugin window, a waveform display provides a real-time view of both the input and output levels, allowing you to instantly see how your signal is being affected. These levels are also mirrored in two small but handy peak meters next to the input and output gain knobs, so you’re always aware of your signal flow at a glance. This attention to visual detail makes it easy to stay focused while adjusting parameters.
specs: |-
  - Two separate delay elements with feedback.
  - Max. 5s delay time.
  - Tempo sync with host DAW.
  - Routable feedback to each one of the two delays.
  - Endless loop mode.
  - Routable output to left or right for each delay line.
  - Delay time and feedback link.
  - Input and output graphic display.
  - Adjustable hi pass and low pass filter on delay output.
  - Adjustable feedback distortion.
  - Analog to digital converter emulation.
  - Two separate LFO.
  - Four wave shape for each LFO (sine, saw, triangle and square).
  - Each LFO can modulate both time and feedback for each delay.
  - Dry / Wet knob.
  - macOS (>=10.13) and Windows (>= win7) support.
  - 64-bit compatibility both on Mac and Windows.
  - Audio Units VST2.4, VST3 and AAX format.
  - This plugin is natively compatible with Apple Silicon (M1/M2) processors.
  - Apple Silicon native support
