details: |-
  VCV Rack 2 is the virtual modular platform based on Eurorack synthesizers. Rack 2 Free is the standalone, open-source edition: it runs as a standalone application, includes the Free modules, and is backed by community support. The DAW plugin formats (VST2, VST3, Audio Unit, CLAP) and the Pro modules belong to Rack 2 Pro only.

  New in VCV Rack 2: a dark room mode that saves your eyes at night with adjustable room brightness, module selections, letting you save, share, edit, and move around selections of modules, and an enhanced module browser where you can zoom, favorite, and sort your module collection.

  Learn modular synthesis basics and advanced patch techniques. Perform sounds in real-time and process live audio. Compose unique rhythms and melodies with algorithmic and generative techniques. Record complete multi-track pieces and design your own synth patches. Extend beyond hardware limitations with polyphonic cables, module preset sharing, total patch recall, and more.

  Rack integrates with hardware and software through multi-interface input/output for audio or CV and polyphonic MIDI input/output for hardware control. VST plugins can be hosted inside Rack and their parameters controlled with CV using VCV Host, which is purchased separately.

  Modules: 30+ built-in modules with all the tools you need to get started, 170+ official modules from Eurorack manufacturers, and 2000+ modules available on the VCV Library. You can also develop your own modules with the C++ VCV SDK.
specs: |-
  - Standalone application (DAW plugin formats are Rack 2 Pro only)
  - Free modules included, open-source
  - Community support
  - Current version: 2.6.6 (Windows x64, macOS x64 + arm64, Linux x64)
  - 30+ built-in modules
  - 170+ official modules from Eurorack manufacturers
  - 2000+ modules available on the VCV Library
  - Develop your own modules with the C++ VCV SDK
  - Multi-interface input/output for audio or CV
  - Polyphonic MIDI input/output for hardware control
  - Polyphonic cables, module preset sharing, total patch recall
  - Dark room mode with adjustable room brightness
  - Module selections: save, share, edit, and move selections of modules
  - Enhanced module browser: zoom, favorite, and sort
  - System requirements: Windows 7+, macOS 10.9+, or Linux (such as Ubuntu 16.04+)
  - CPU: Intel/AMD 64-bit processor (x64) supporting SSE4.2 (2011 or later), or Apple M1 (ARM64) or higher
  - Graphics: dedicated Nvidia/AMD graphics card from 2013 or later with recent driver update. Integrated graphics such as Intel HD are not recommended and may cause significantly increased CPU usage
  - Memory: 1 GB
  - Disk space: 1 GB
