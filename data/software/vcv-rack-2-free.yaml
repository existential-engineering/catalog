details: |-
  Open-source virtual Eurorack synthesizer. Features dark room mode, module selections for saving/sharing/editing groups of modules, and an enhanced module browser with zoom, favorites, and sorting. Supports multi-interface audio I/O, polyphonic MIDI I/O, and CV integration with hardware.
specs: |-
  System requirements: Windows 7+, macOS 10.9+, or Linux (Ubuntu 16.04+). CPU: Intel/AMD 64-bit (SSE4.2, 2011+) or Apple M1+. Dedicated Nvidia/AMD GPU from 2013+. 1 GB RAM, 1 GB disk space. Version: 2.6.6.
