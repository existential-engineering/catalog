description: "Austrian Grand - exquisitely crafted concert grand piano:
  experience the rich and powerful sound of a world-class concert grand piano."
details: |-
  Austrian Grand is an exquisitely crafted concert grand piano plugin that
  delivers the rich and powerful sound of a world-class concert grand piano.
  Captured in the renowned guillaume tell sound stage in paris, it is billed as
  the ultimate concert grand, renowned for its rich sound and exemplary
  dynamics.

  Deeply multi-sampled at the guillaume tell sound stage in paris, painstakingly
  balanced, and lovingly optimized through collaborative feedback with concert
  pianists, austrian grand delivers the pure sound of a majestic and
  effortlessly beautiful piano in a world-class studio.

  Through a comprehensive and meticulous recording process, austrian grand
  delivers an extraordinarily natural playing experience allowing expression
  across the full dynamic range, from the softest kiss of the high c to
  thundering hammers of the low a. With advanced scripting, numerous keygroup
  layers, and intelligent rule switching, every subtlety and nuance of your
  performance is accurately translated into sound, while a handy front-panel
  velocity curve control helps you quickly find the sweet spot no matter what
  keybed you happen to be playing.

  A selection of studio-grade effects are at your disposal, with both ir-based
  and algorithmic reverb processors, 3-band eq with tone and drive, multi-mode
  modulation processor with phasor, thorus, flanger and rotary speaker
  simulator, and a digital delay.

  The library includes sound design tools like filter, envelopes, tone and pitch
  as well as mod wheel assignments, allowing you to set your piano in a small
  club, a concert hall, a thick wave of ambient wash, or wherever else your
  creativity guides you.
specs: |-
  - Multi-sampled
