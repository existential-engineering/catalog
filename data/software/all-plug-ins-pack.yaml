details: |-
  A complete professional digital audio processing environment in a single
  bundle, with the complete collection of Blue Cat Audio's commercial audio
  plug-ins and applications.

  Blue cat's acoufiend is an acoustic feedback simulator plug-in that can make
  your guitars scream, growl, or sing, even at low volume or through headphones,
  and it gives you total control over it.

  Blue cat's axiom is a powerful and open multi effects processor and amp
  simulation software for guitar and bass. Based on the acclaimed destructor
  plug-in for amp simulations, axiom offers an infinite number of exceptional
  tones for your axe.

  Blue cat's dp meter pro (dpmp) is a unique audio analysis tool that combines
  very flexible and customizable audio meters with advanced side chaining
  control capabilities thanks to its MIDI and automation outputs.

  Blue cat's dynamics is a full featured dynamics processor: it can be used as a
  compressor, limiter, gate, expander, waveshaper or all at once! The dynamics
  response of the plug-in can be tweaked with a unique two-thresholds system,
  and provides detailed visual feedback about its behavior.
