details: >-
  Amethyst3 is acustica audio's high performance channel-strip and bundle
  featuring a complete channel strip plug-in, a single eq plug-in, a single
  preamp plug-in, and single compressor plug-in.


  Amethyst3 adds support to core x audio engine featuring a new algorithm for
  hard-clipping with +3 dbfs of maximum level, multi-input system, and blending
  algorithm.


  An acqua plug-in is a stand-alone skinned nebula library, in other words it is
  a software product developed as a parametrization of one or more nebula's
  instances. Parametrization is achieved using the script languages proprietary
  to acustica audio and does not require external tools and compilers.


  Acustica audio is a company that is active in the field of information
  technology and audio engineering. The company's goal is to provide the most
  authentic reproduction of sampled vintage gear and other high-end hardware
  devices. Over the years it has become well known for audio plug-ins, by
  manufacturing its own software products and marketing them both in italy and
  worldwide.


  Acustica technology is based on a software engine of dsp (digital signal
  processing) developed by acustica audio that emulates other dsps, by modelling
  them through a proprietary sampling technique. Acustica technology can sample
  and emulate the behavior of an audio processor, by reproducing its harmonic
  response, harmonic distortion and dynamic response as time and other external
  variables (like user controls) change.
