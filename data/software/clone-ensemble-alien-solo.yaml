details: |-
  Alien Solo is a fully-featured monophonic synth that is controlled by your
  voice. Sing, hum or doo-wop the lead or bassline and then dial up the synth
  patch you want.

  You can also process other monophonic sources, but the pitch tracking function
  is optimised for the human vocal range.

  Features: stable, accurate pitch and envelope tracking algorithm. Auto-tune
  feature to keep you right on the note.

  Dual analogue-style oscillators with 5-octave transpose range. Mix, fm & ring
  mod modes.

  Vocoder-like morphing filter to apply your voice's characteristics to the
  synth sound. Analogue-style 2/4/6-pole filters with envelope follow and pitch
  tracking control.
specs: |-
  - Monophonic synth
  - Voice-controlled
  - Pitch tracking algorithm
  - Auto-tune feature
  - Dual analogue-style oscillators
  - 5-octave transpose range
  - Mix mode
  - FM mode
  - Ring mod mode
  - Vocoder-like morphing filter
  - Analogue-style 2/4/6-pole filters
  - Envelope follow
  - Pitch tracking control
  - Windows compatible
