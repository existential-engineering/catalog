  mastering, and stem work."
details: |-
  Three independent compression bands
  SMASH button for aggressive compression on drums/vocals
  Sidechain filter circuit with optional low cut and high boost
  Selectable feedforward/feedback operation modes
  Adjustable left/right channel interaction control
  Suited for mastering and stem-based mixing
