description: Artillery is a MIDI-controlled multi-effect plug-in that comes with
  32 effects which can be put to keyboard zones and triggered with MIDI.
details: >-
  Artillery is a MIDI-controlled multi-effect plug-in that comes with 32 effects
  which can be put to keyboard zones and triggered with MIDI notes. With
  artillery you can create unlimited effect combinations and modulate effect
  parameters with an unlimited number of modulator engines.


  The included effects vary from classics (delay effects, filters, compressors,
  etc.) to innovative creations like looper, step looper, reverser, vocoder with
  internal synth, vowel filter, karaoke or a turntable effect.


  Artillery allows audio fx to be punched in and out with keys on your MIDI
  keyboard/controller, making it especially useful with ableton live for
  creating separate MIDI tracks and recording clips of audio fx in a spontaneous
  and improvised way.


  You can modulate any parameter of artillery with lfo, envelope, envelope
  follower or step sequencer, with each fx having its own mix envelope and MIDI
  learn capability on every parameter.


  Artillery is a virtual effect audio plugin for macos and windows, functioning
  as a VST plugin, an audio units plugin, a VST 3 plugin and an AAX plugin.
