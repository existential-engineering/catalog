description: THE SCORE is a groundbreaking all-in-one scoring tool, covering a massive palette of genres, styles and instruments.
specs: |-
  - Works with the FREE KONTAKT PLAYER
  - Requires KONTAKT version 7.8.1 or higher
  - macOS 11 or higher
  - Windows 10 or higher
  - Intel Core i5 or equivalent CPU with 2 GB RAM
  - Graphics hardware support for Direct 3D 11.1 (Feature Level 11_0) or higher
  - 4 GB RAM (6 GB recommended for large KONTAKT instruments)
  - At least 19.5 GB of free hard disc space
  - 19.5 GB of uncompressed data
  - 160 instruments in total: 46 orchestral, 37 synth, 20 band, 34 world, 18 drum
  - 150 animated Story presets, each with four different arrangements
  - 13 genres and 12 styles
  - 10 instrument slots per Story, fully exchangeable
  - Up to 4 keyswitchable variations per Story
  - Four power tools: Chord Studio, Melody Studio, Dynamic Mixer, Adaptive Customizer
  - Melody Studio uses a Markov chain-based melody generation algorithm
  - Customizer controls up to 5 simultaneous pitches and becomes a drum map for percussion
  - 23 FX from KONTAKT 7, including EQ, dynamics, distortion, delay, modulation and reverb
  - Free Mode and External Mode (per-slot MIDI channel playback) added in free update 1.2
  - MIDI export including dynamics
