description: THE SCORE is a groundbreaking all-in-one scoring tool, covering a massive palette of genres, styles and instruments. Compose professional scores quickly and joyfully in a jam-like composition process.
specs: |-
  - 160 total instruments (46 orchestral, 37 synth, 20 band, 34 world, 18 drum)
  - 150+ animated Stories with multiple arrangements
  - Chord Studio for harmonic exploration
  - Melody Studio with algorithm-based melody generation
  - Dynamic Mixer for control
  - Adaptive Customizer
  - MIDI export capability
  - Free Mode for playing instruments independently
  - Requires Kontakt 7.8.1 or higher (works with free Kontakt Player)
  - macOS 11+ or Windows 10+
  - CPU: Intel Core i5 equivalent minimum
  - RAM: 4 GB minimum (6 GB recommended)
  - Storage: 19.5 GB free space
  - Graphics: Direct3D 11.1 support (Feature Level 11_0+)
