details: |-
  Aeria ii is the second volume of aeria I. This is a darker collection of 130 ominous, dreamy and aggressive sounds for repro-1.

  Aeria ii is suited for action, suspense, dramatic film scoring, soundtracks and trailer music.

  Inspired by the music of ludwig gransson, junkie xl, max ritcher and tangerine dream, aeria ii is formed by deep bassloops, aggressive percussion loops, dreamy sequences and arpeggios, dystopian soundscapes, edgy leads and pads and cutting edge ominous effects.

  Aeria ii is a great toolbox for your electronica and film score projects, speed up your workflow and to get new ideas.

  All presets are nks tagged, modwheel and velocity are assigned adding an extra of playability.
