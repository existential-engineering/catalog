description: Desktop application for managing TC-Helicon vocal processors over
  USB, covering firmware updates, preset transfers and backups. It also gives
  access to TC-Helicon's community preset library.
details: |-
  VoiceSupport 2 is the official desktop application for managing, updating and backing up TC-Helicon hardware. With a TC-Helicon vocal processor connected over USB, the application handles firmware updates, preset library management, factory and user preset transfers, and backup of custom sounds.

  It also provides access to the TC-Helicon preset library, where community-made presets for VoiceLive, Play Acoustic, Perform and the VoiceTone family can be browsed, downloaded and shared. It is a free download.
specs: |-
  - Firmware updates for a connected TC-Helicon vocal processor over USB
  - Preset library management and factory or user preset transfer
  - Backup of user presets
  - Access to the TC-Helicon community preset library
  - Covers VoiceLive, Play Acoustic, Perform and the VoiceTone family
