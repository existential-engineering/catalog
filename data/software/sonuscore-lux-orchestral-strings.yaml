description: LUX Orchestral Strings is a professional 70-piece symphonic string library recorded on a Hollywood scoring stage, designed for film composers seeking unprecedented realism, warmth, and scale. It features Seamless Articulation Transitioning (S.A.T.) technology, 48 microphones across four positions, and Natural String Change Legato for cinematic scoring.
specs: |-
  - 70-piece string ensemble (18 Violins 1, 16 Violins 2, 14 Violas, 12 Celli, 10 Basses)
  - Recorded on a Hollywood scoring stage
  - 48 total microphones (26 main, 22 bleed mics)
  - Four microphone positions: Close, Decca, Far, Bleed
  - Seamless Articulation Transitioning (S.A.T.) technology
  - Natural String Change Legato
  - Morphing articulations controllable via mod wheel
  - Articulations: legato (full, whisper, runs, adaptive), sustains, shorts, trills, tremolos, harmonics, sul ponticello, pendulum glissandi, trill figures, arpeggios, gestures
  - Requires Kontakt Player 7.10.9 or higher (free version supported)
  - macOS 13+ (Apple Silicon or Intel i5+)
  - Windows 10/11 (Intel Core i5+)
  - 8 GB RAM minimum (32 GB recommended)
  - 76 GB free disk space
  - OpenGL 2.1+ / Direct3D 11.1 required
