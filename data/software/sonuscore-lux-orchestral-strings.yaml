description: LUX Orchestral Strings is a professional 70-piece symphonic string
  library recorded on a Hollywood-scale scoring stage, designed for film composers
  seeking unprecedented realism, warmth, and scale. It features Seamless
  Articulation Transitioning (S.A.T.) technology, 48 microphones across four
  positions, and Natural String Change Legato for cinematic scoring.
details: |-
  LUX Orchestral Strings is a 70-piece symphonic string ensemble recorded on a large concert stage, positioned between smaller 30 to 40 player sections and oversized 90+ ensembles so it keeps cinematic weight alongside clarity and expressive nuance. The seating was arranged in traditional symphonic layout with each section placed as it would be on a scoring stage, and it was recorded with StarRecordings productions and score mixer Peter Fuchs using microphones from DPA, Schoeps, Neumann and Coles.

  Its headline technique is S.A.T., Seamless Articulation Transitioning, which lets articulations change while a note is held so a sustain can become a tremolo without a break or restart, with a gentle key switch producing a gradual shift and a stronger one a quick change. Morphing Articulations blend between two or more articulations in real time from the mod wheel, so sustains melt into tremolos or a staccato transforms into a sforzando. Natural String Change legato, created by violinist and developer Jonas Meyer, detects when the next note would fall on a different string and lets the previous one resonate into it, so wide intervals and arpeggiated figures connect the way real players would take them.

  The microphone setup is unusually broad: 48 microphones in total, 26 for the main capture (tree, far and close mics for the string sections) plus another 22 close bleed microphones across the brass, woodwinds and percussion sections to record their natural spill into the strings. That yields four positions, the three standard ones (Close, Decca, Far) plus the exclusive Bleed option, so the amount of scoring-stage spill in the mix is adjustable from a touch of colour to the full character of the room.

  Beyond those innovations the library carries adaptive legato, a complete set of core articulations including staccato, spiccato, marcato, tremolo, pizzicato, portamento and con sordino emulation, and extended techniques such as whisper sustains, harmonics legato, soft interval trills, pendulum glissandi, slow bends and swarm textures. Composer-Crafted Ensembles with flexible voicing and octave options allow quick sketching with polyphonic legato, dedicated Key Switch sets are tailored to specific scoring contexts (action, lyrical, soft, melodic), and articulation pages support up to 24 keyswitches in one patch. Polyphonic aftertouch and an added octave (+8VA) feature work throughout the instrument, and dynamics run from whispering ppp to roaring fff.
specs: |-
  - 70-piece symphonic string ensemble recorded on a large concert stage in traditional symphonic seating
  - 48 microphones total: 26 for the main capture (tree, far, close) plus 22 close bleed microphones across brass, woodwinds and percussion
  - 4 microphone positions: Close, Decca, Far, plus the exclusive Bleed option
  - S.A.T. (Seamless Articulation Transitioning): change articulations mid-note
  - Morphing Articulations: blend between two or more articulations in real time via mod wheel
  - Natural String Change legato, developed by violinist and developer Jonas Meyer
  - Adaptive legato that responds to playing with natural phrasing
  - Core articulations including staccato, spiccato, marcato, tremolo, pizzicato, portamento and con sordino emulation
  - Extended techniques: whisper sustains, harmonics legato, soft interval trills, pendulum glissandi, slow bends, swarm textures
  - Live-recorded trill figures, measured arpeggios and performance gestures
  - Fluid staccatos recorded in real rhythmic contexts, with an intelligent staccato mode for ostinatos
  - Composer-Crafted Ensembles with flexible voicing and octave options
  - Ensemble instrument with polyphonic legato for sketching instant orchestrations
  - Key Switch sets tailored to specific scoring contexts; articulation pages support up to 24 keyswitches in one patch
  - Polyphonic aftertouch and +8VA added octave feature throughout the instrument
  - Dynamics from ppp to fff, pushed to 110%
  - Recorded with StarRecordings productions and score mixer Peter Fuchs, using DPA, Schoeps, Neumann and Coles microphones
  - Works with the FREE KONTAKT PLAYER
  - Requires KONTAKT Version 7.10.9 or higher
  - Apple Silicon Macs: macOS 13, 14 or 15 (latest update)
  - Intel Macs (i5 or higher): macOS 13, 14 or 15 (latest update)
  - Windows 10 or 11 (latest Service Pack), Intel Core i5 or equivalent CPU
  - Graphics hardware support for OpenGL 2.1 or higher and Direct 3D 11.1
  - 8 GB RAM (more recommended; 32 GB recommended for the full 70-player section and extensive microphone setup)
  - At least 76 GB of free hard disc space
