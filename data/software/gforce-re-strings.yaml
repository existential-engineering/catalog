description: A vintage string machine emulation for Reason, based on GForce's
  Virtual String Machine with 67 sample sets from classic analogue ensembles
  including the Solina, Mellotron, Eminent 310, and Roland VP330.
details: |-
  Re-Strings brings GForce's award-winning Virtual String Machine technology to the Reason Rack Extension format, featuring 67 individual sample sets spanning the full range of classic analogue string ensembles — including the Freeman String Symphonizer, Solina String Ensemble, Eminent 310, Logan String Ensemble, Mellotron, Korg Lambda, and Roland VP330. Each sample set covers 49 notes across 4 octaves.

  The dual-layer engine provides independent controls per layer: resonant LP, BP, and HP filters; two envelope generators; pitch/filter LFO; and dynamic control with filter aftertouch. Global Ensemble and Phaser effects are included. 700+ patches created by sound designers including Billy Currie.
