description: Blue cat's parametr'EQ is a 7-band parametric equalizer combining
  the advantages of both the digital and analog worlds.
details: |-
  Blue cat's parametr'eq series includes three plugins: blue cat's parametr'eq,
  blue cat's stereo parametr'eq, and blue cat's widening parametr'eq.

  True wysiwyg 7 bands parametric equalizer, with single, left/right or mid/side
  dual channels. Filters designed after analog circuits. Non linear modeling:
  add some warmth or analog distortion to each eq stage.

  Output brickwall limiter. Output peak meter. Oversampling for optimal sound
  quality, whatever your sampling rate. ±40 db range for each band with
  customizable effective range. Automatic gain compensation. No latency.

  Real time display of the frequency response with precise measurement and
  zooming capabilities. Window opacity control: make the plugin window
  transparent. Native dsp code for optimal performance. Skinnable user
  interface. Smooth update: silent (zipper-free) parameters update. Full
  automation support (all parameters can be automated, with smooth and
  continuous update). Real time MIDI control with advanced settings (MIDI
  channel and cc numbers, with complete response curve control) and MIDI learn.
  Any sample rate supported.
specs: |-
  - 7-band parametric equalizer
  - True wysiwyg interface
  - Single, left/right or mid/side dual channels
  - Filters designed after analog circuits
  - Non-linear modeling
  - Output brickwall limiter
  - Output peak meter
  - Oversampling
  - ±40 dB range per band with customizable effective range
  - Automatic gain compensation
  - No latency
  - Real-time frequency response display
  - Precise measurement and zooming capabilities
  - Window opacity control
  - Native dsp code
  - Skinnable user interface
  - Smooth parameter update (zipper-free)
  - Full automation support
  - Real-time MIDI control
  - MIDI learn
  - Any sample rate supported
