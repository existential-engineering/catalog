details: |-
  Audiokit Digital D1: hybrid synth is an epic 64-voice virtual analog / PCM
  ipad synth - a beautiful and lush digital synth inspired by the 80s/90s.
  Digital D1 is a modern re-imagining with new sounds and new synthesis, perfect
  for modern production with a retro feel.

  Each voice is composed of two layers. Each layer has: option of virtual analog
  or pcm synthesis, per-voice harmonic adsr envelope filters, dedicated
  sample-set and note-range, dedicated adsr amp envelopes, dedicated stereo
  filter (low/high/band-pass), dedicated level and pan controls, and MIDI
  velocity scaling controls.

  Three (3) independent lfos with 60+ destinations including: filter cutoff,
  resonance, pan, layer mix, detune, distortion, chorus depth, flanger depth,
  and more. Lfo has selectable sine/square/ramp up/ramp down, rate and depth
  controls. Lfos can modify other lfos.

  Fully loaded with 400+ presets by brice beasley, matthew fecher, red sky
  lullaby, jakob haq, dean daughters (electronisounds), sound of izrael,
  afrodjmac, and more. Full 1+ gigabyte of original samples recorded from analog
  & fm synths over 30+ years old. Space-saving compression - the whole app is
  under 150mb.

  Additional features include: ableton link, audiobus 3 & inter-app audio (iaa),
  lush sean costello reverb w/ lo-cut, vintage-style arp/step sequencer that can
  be routed to specific layers, keyboard splits, autopan (rate & depth), tremolo
  (rate & depth), stereo widen, analog tape-style ping-pong delay, stereo
  phaser, crusher, amp/distortion, and chorus & flanger.
