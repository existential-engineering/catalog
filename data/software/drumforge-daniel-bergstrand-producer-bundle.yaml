description: Daniel Bergstrand Producer Bundle Unleash the power of professional metal and rock production with the Daniel Bergstrand Producer Bundle , now available for an unbeatable price of $139 – a saving of 22%. This exclusive bundle combines the Drumshotz Daniel Bergstrand and Drumforge Bergstrand, offering a comprehensive toolset for creating impactful drum tracks.
details: |-
  The Daniel Bergstrand Producer Bundle includes two products:

  Drumforge Bergstrand — A virtual drum instrument plugin featuring signature samples recorded and mixed by legendary metal producer Daniel Bergstrand. Includes 13 kicks, 19 snares, 3 tom sets, hi-hats, crashes, rides, and cymbals. Features a built-in mixing console with DSP modules, Song Builder for groove arrangement, fully configurable MIDI mapping, support for custom WAV files and Drumshotz samples, and a lite version of the European Metal Grooves pack. Requires 19.7 GB disk space. Available for Windows (VST3, AAX) and macOS (VST3, AU, AAX), Apple Silicon native.

  Drumshotz Daniel Bergstrand — Over 40 high-quality one-shot drum samples in WAV format at 44.1 kHz / 24-bit, handpicked by Daniel Bergstrand. Includes kicks, snares, and tom sets. Compatible with any DAW on Mac, Windows, or Linux.

  Purchase includes instant digital download, perpetual license, free lifetime updates, and unlimited customer support.
