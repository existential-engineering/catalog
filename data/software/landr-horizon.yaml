description: LANDR Horizon is a hybrid string synthesizer that creates cinematic
  pads and evolving textures by blending organic strings with modern synthesis.
details: |-
  Horizon is a hybrid instrument that blends rare analog synthesis with organic string performances to create massive, cinematic soundscapes. It is built to add immediate emotional weight and environmental depth to a track with a 4-layer engine designed for expressive, mix-ready results.

  Rather than static pads, Horizon uses a hybrid engine to blend organic performances with rich synthesis, creating immersive environments that respond dynamically to playing. The 4-layer engine lets complex atmospheres be built by blending four distinct sound modules, stacking diverse sonic characters within a single patch for a level of detail and richness single-layer instruments cannot achieve.

  The central Morph interface controls a track's energy: moving to the right gives a bright, open sound, while shifting to the left produces dark, hollow and moody textures. The controller is interactive, so automation can be performed in real time and the plugin evolves alongside the melody.

  Spatial shaping is handled by the Lusher and Harmonic Delay processors, which move sounds into the distance or bring them into sharp focus, with a Randomizer for instantly discovering new spatial atmospheres. A dedicated Sub-Module with selectable wave shapes and a built-in Drive control keeps soundscapes grounded without cluttering the mix, and the Motion knob creates pulsing, rhythmic low end that stays clear and focused.

  The instrument ships with 150 factory presets and 30 custom-designed sound sources derived from meticulously captured cellos and bowed acoustics. A glue compressor prevents volume spikes and clipping to keep massive textures balanced, and a global tone and filter knob shifts the entire frequency character of a patch to move from underscores to soaring leads. It runs natively as VST3, AU and AAX with no third-party plugins required.
specs: |-
  - 4-layer hybrid engine blending four distinct sound modules
  - Morph controller for real-time bright-to-dark texture automation
  - Lusher and Harmonic Delay processors for 3D placement, with Randomizer
  - Sub-Module with selectable wave shapes and built-in Drive control
  - Motion knob for pulsing, rhythmic low end
  - Glue compressor for dynamics control
  - Global tone and filter knob
  - 150 factory presets
  - 30 custom-designed sound sources from captured cellos and bowed acoustics
  - macOS: VST3 64-bit, AAX 64-bit, AU 64-bit, Apple Silicon native, macOS 10.15 and newer
  - Windows: VST3 64-bit, AAX 64-bit, Windows 10 and newer
  - 120 MB of disk space
  - At least 4GB of memory
