description: LANDR Horizon is a hybrid string synthesizer that creates cinematic
  pads and evolving textures by blending organic strings with modern synthesis.
details: |-
  Horizon is a hybrid string synthesizer built around a 4-layer engine that blends organic string performances with rich synthesis. It goes beyond static pads to create immersive environments that respond dynamically to your playing.

  The Morph controller lets you shape your mood in real time, shifting tonal character from bright to dark across the entire patch. A Randomizer allows instant discovery of new spatial atmospheres.

  Sculpt your 3D field using the Lusher and Harmonic Delay processors to move sounds into the distance or bring them into sharp focus. A Sub-Module with selectable wave shapes and Drive control adds deep low end with rhythmic movement.

  Horizon includes 150 factory presets and 30 custom-designed sound sources derived from meticulously captured cellos and bowed acoustics. A built-in Glue compressor prevents volume spikes and keeps massive textures balanced and focused.

  Global tone and filter controls let you shift the entire frequency character of your patch with a single knob, moving from underscore textures to soaring leads. The plugin runs natively as VST3, AU, and AAX with minimal CPU load and no third-party plugins required.
specs: |-
  - 4-layer hybrid engine blending synthesis and organic string performances
  - Morph controller for real-time tonal shaping (bright to dark)
  - Lusher and Harmonic Delay processors for 3D spatial placement
  - Sub-Module with selectable wave shapes and Drive control
  - Glue compressor for dynamics processing
  - Global tone and filter controls
  - 150 factory presets
  - 30 custom sound sources (captured cellos and bowed acoustics)
  - Formats on macOS: VST3, AU, AAX (Apple Silicon Native)
  - Formats on Windows: VST3, AAX
  - macOS 10.15 or newer
  - Windows 10 or newer
  - 120 MB disk space, 4 GB RAM minimum
