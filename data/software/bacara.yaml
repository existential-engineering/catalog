details: |-
  Bacara stands as a multi-channel MIDI generating plugin designed with
  performance at its core, prioritizing fluidity over meticulous
  micro-management. It excels in crafting cohesive patterns, avoiding the
  haphazard melodies often associated with basic random generators.

  Multiple plugin formats allow bacara plugin to be used in multiple DAW's. Clap
  is good for bitwig & reaper. Vst3 is good for ableton live. AU is good for
  logic pro. App will work without a DAW (standalone).

  Bacara plugin is not conceived as merely a sequence editor, although it can
  serve that purpose, but primarily as a melody generator with editing
  capabilities. By clicking the dice icon, you initiate the generation of a
  16-step sequence in this example, with a temperature set to 1.0 degree. Higher
  temperatures will give more diversity but at cost of more mistakes. The
  concept of temperature might seem complex initially; it's essentially a
  parameter ranging from 1.0 to 5.0, influencing how intense the generator
  algorithm operates.

  This area serves as the central hub of bacara plugin, displaying the generated
  notes along with their respective attributes such as length, mute status
  (affected by gate), channel assignment (red or blue), accentuation, sliding,
  octave placement, and more. While you can experiment with moving notes around,
  the specific attributes of a note (gate, channel, accent, slide, velocity,
  length, octave) are adjusted through their designated aspect lanes located
  above.

  The eight macro encoders offer versatile assignment options to any parameter
  within bacara plugin, although they come pre-assigned with sensible defaults,
  indicated by the labels above them. Following a common practice in the synth
  world, macros don't directly alter a parameter but instead modulate it.
specs: |-
