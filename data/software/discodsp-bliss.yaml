description: Bliss is a sampler that imports Akai S1000/S3000 ISO disk images and CUE sheets alongside SFZ, SoundFont2, NKI (Kontakt 1-4), EXS, and Renoise formats. It succeeds HighLife with an enhanced engine and can capture audio from VST/AU plugins or external hardware via MIDI-triggered sampling.
details: |-
  64 voices with 4-voice unison

  SINC 128 (up to SINC 512)

  Dual filters (24dB/Oct modes)

  8 macro knobs, parameter morphing, dual syncable LFOs, independent envelopes

  Reverb, delay, chorus, EQ, distortion, phaser, bit reducer

  WAV, AIFF, FLAC, OGG, MP3, SFZ, SoundFont2, NKI (Kontakt 1-4), EXS, Renoise, Akai S1000/S3000 ISO

  ZBP/ZBB (24-bit FLAC), SFZ, 16/24-bit WAV

  Built-in VST/AU plugin host, automatic sampling with MIDI triggering, audio recorder with oscilloscope, visual key mapper
