description: Sampler plugin with built-in VST/AU host for direct lossless
  instrument capture, MIDI-triggered hardware sampling, and import for Akai
  S1000/S3000 ISO disk images, SFZ, SoundFont 2, NKI (Kontakt 1-4), EXS, AKAI
  S5000-S6000, AKAI XPM (Keygroup), and Renoise. SINC 128 interpolation up to 64
  voices, visual key mapper, built-in wave editor, dual filters, MPE and seven
  effects with 8x oversampling.
details: |-
  64 voices with 4-voice unison

  SINC 128 (up to SINC 512)

  Dual filters (24dB/Oct modes)

  8 macro knobs, parameter morphing, dual syncable LFOs, independent envelopes

  Reverb, delay, chorus, EQ, distortion, phaser, bit reducer

  WAV, AIFF, FLAC, OGG, MP3, SFZ, SoundFont2, NKI (Kontakt 1-4), EXS, Renoise, Akai S1000/S3000 ISO

  ZBP/ZBB (24-bit FLAC), SFZ, 16/24-bit WAV

  Built-in VST/AU plugin host, automatic sampling with MIDI triggering, audio recorder with oscilloscope, visual key mapper
specs: |-
  - windows: Windows 10+, Intel/AMD with AVX2, 8 GB RAM
  - mac: macOS 10.14+, Apple Silicon or Intel, 8 GB RAM
  - linux: Debian 10+, Intel/AMD with AVX2, 8 GB RAM
