description: TheNormalizer it's an auto gain staging plugin that helps you prepare your mix faster and better thanks to the automatic normalisation
details: |-
  TheNormalizer is a gain plugin designed to automate and simplify the process of achieving optimal gain staging for a mix. Whether working on a single track or an entire project, it sets each track and bus to the desired level automatically, removing the manual effort typically involved in adjusting individual gain levels.

  At its heart is auto-gain technology that adjusts the gain for every track in a project so each element is correctly balanced in terms of volume. A grouping function applies the same adjustments across multiple tracks at once, which suits large-scale mixes where adjusting every drum element, vocal or instrumental layer by hand would be time-consuming.

  The plugin normalizes buses and tracks to a desired LUFS level, making it straightforward to meet the loudness requirements of streaming platforms or broadcast services, and it also normalizes to a specific dBFS level for strict peak-level requirements such as those set by radio stations or film studios.

  Once the gain levels are set, TheNormalizer uses minimal CPU because adjustments are a simple multiplication process. A continuous mode makes real-time adjustments to gain as the track plays, similar to AutoGain Pro with an internal reference, which suits dynamic content such as voiceover, podcasts and narration.

  The interface is deliberately simple, with clear visual feedback showing how much gain is being applied to tracks and buses, and it integrates into a mastering chain in any DAW.
specs: |-
  - Automatic audio normalization to the set level
  - Level can be expressed in dBFS, VU, RMS or LUFS (integrated, short term or momentary)
  - Peak or continuous normalization
  - Group function to apply the same parameters to a group of plugins
  - Gate to prevent normalization from working for low levels
  - macOS (10.13 and later) and Windows (Vista and later) support
  - 64-bit only on both Mac and Windows
  - Apple Silicon native support
  - Audio Units, VST3 and AAX format
  - No copy protection
