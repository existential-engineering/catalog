description: TheNormalizer it's an auto gain staging plugin that helps you prepare your mix faster and better thanks to the automatic normalisation
details: |-
  TheNormalizer is an innovative gain plugin designed to automate and simplify the process of achieving optimal gain staging for your mix. Whether you're working on a single track or an entire project, TheNormalizer ensures that each track and bus is set to the desired level automatically. This removes the manual effort typically involved in adjusting individual gain levels, allowing you to focus more on the creative side of your work.

  At the heart of TheNormalizer lies advanced auto-gain technology. This technology automatically adjusts the gain for every track in your project, ensuring that each element is correctly balanced in terms of volume. The grouping function makes it especially convenient, as you can apply the same adjustments across multiple tracks at once. This is perfect for large-scale mixes, where manually adjusting gain levels for each track would be time-consuming and tedious.

  One of the standout features of TheNormalizer is its ability to normalize buses and tracks to a desired LUFS (Loudness Units Full Scale) level. LUFS is a standardized measure of perceived loudness, and many platforms require specific LUFS levels for mastering purposes. In addition to LUFS normalization, TheNormalizer also offers the ability to normalize to a specific dBFS (decibels full scale) level, which is crucial for meeting strict peak level requirements, such as those set by radio stations, film studios, or certain online streaming platforms.

  TheNormalizer's design is optimized for efficiency. Once the gain levels are set, the plugin uses minimal CPU resources. Unlike other gain plugins that can heavily tax your system, TheNormalizer performs adjustments with a simple multiplication process, which ensures that your computer's performance remains unaffected. This feature is particularly beneficial for large sessions where system resources are limited.

  The plugin also includes a handy continuous mode that allows you to make real-time adjustments to the gain as the track plays. This is similar to how the AutoGain Pro plugin behaves when using an internal reference, making it especially useful for tracks with dynamic volume fluctuations. For example, voiceover recordings often require adjustments to maintain consistent loudness throughout the track, so the continuous mode is a good fit for dynamic content such as podcasts or narration.
specs: |-
  - Automatic audio normalization to the set level.
  - Level can be expressed in: dBFS, VU, RMS, LUFS (integrated, short term or momentary).
  - Peak or continuous normalization.
  - Group function to apply the same parameters to a group of plugins.
  - Gate to prevent normalization from working for low levels
  - macOS (10.13 and later) and Windows (Vista and later) support.
  - 64-bit only on both on Mac and Windows.
  - Apple Silicon native support
  - Audio Units, VST3 and AAX format.
  - No copy protection
