description: Esspresso is a de-esser that decouples the detection frequency
  range from the suppressor's frequency range, so a wider band can be reduced
  than the one being detected. It offers four suppressor modes and a timeline
  view of what it has been doing over the past seconds.
details: |-
  Esspresso is a de-esser for audio recording, with updated filters, a timeline view and a collection of presets.

  In almost all modern audio production, the menace of sibilance (those pesky high-frequency noises) has long troubled creators, engineers and producers. For instance, achieving a pristine vocal tone and fine-tuning the EQ can turn into a daunting task when the 's':s distort and throw your mix off balance.

  Unlike many conventional de-essers, it decouples the detection frequency range from the suppressor's frequency range, so specific frequencies can be pinpointed and compressed. A frequency response display shows the detection and suppression in place.

  The timeline view shows what Esspresso has been doing in the past seconds, the threshold control sets the audio level at which it starts working, and the preset collection is there to get started quickly. Four suppressor modes are available, a solo switch isolates the detector signal so only the intended sibilance is captured, and the decoupled detector and suppressor ranges allow reducing a wider band than the one being detected.
specs: |-
  - Visual reduction RMS
  - Visual detector RMS
  - Detector sensitivity gain
  - Solo switch for the detector signal
  - Four suppressor modes (link, wide, shelf and band)
  - Intuitive and unique user interface
  - Threshold and ratio control
  - Attack and release controls
  - Timeline view
  - Collection of presets
  - Requires macOS 10.9 or later, Windows 7 (SP1) or later, running a AU, VST or AAX compatible 64-bit host
  - iPad: Standalone, AUv3, AB, IAA
  - 64-bit only
