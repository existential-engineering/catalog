description: "A groundbreaking audio filter plug-in offering over 30 filter
  types with 250+ cutting-edge algorithms, ranging from classic designs to
  experimental creations. Features 3 simultaneous filters with extensive routing
  options, 8 modulation sources, audio-rate modulation, stereo and Mid/Side
  processing, and 1000+ presets."
details: |-
  30 filter types with 250+ algorithms
  3 simultaneous filters with serial/parallel routing
  8 modulation sources including sequencer/LFO, ADSR, envelope follower, pitch detector, audio-rate oscillator
  Audio-rate modulation optimization
  Stereo modulation, panning, and Mid/Side processing
  Cross-modulation between sources
  1000+ presets from world-renowned producers
  Included modules: Robo Comb, Tempolay, Cabinator, Space
