description: A multi-filter plug-in offering 30 filter types with 250+ algorithms, ranging from classic designs to experimental creations. Features 3 simultaneous filters with extensive routing options, 8 modulation sources, audio-rate modulation, stereo and Mid/Side processing, and 1000+ presets.
details: |-
  Filterverse is a multi-filter plug-in that combines a large filter collection with an intuitive workflow, giving access to 30 filter types that range from classic designs to experimental ones. It is aimed at sculpting, mangling, or creating entirely new textures rather than at a single filtering task.

  The filter set spans saturating, synth-style designs such as Swiss Army Knife and the creamy Bread and Butter, linear and transparent options such as Clear Glass, and the aggressive Brick Wall. Ripples and Double-Slit are multi-peak creations, and Robo Comb nests filters within filters. Further audio processors include Tempolay, a rhythmic granular delay, Cabinator, an amp simulator, and Space, an elastic reverb.

  Three processing slots can each be populated with any of the filter types. Filter tabs can be dragged to change position, and the routing tab offers serial, parallel, or combination setups. Panning, phase, and mid-side controls per filter shape the sonic image further.

  Modulation is handled by eight sources available at once: Meta Knob, sequencer/LFO, ADSR, envelope follower, randomizer, pitch detector, MIDI/CV input, and audio-rate oscillator. Sources can address multiple destinations, destinations can accept multiple sources, and sources can cross-modulate each other. Stereo modulation is directly accessible without menu diving, and the engine is optimized for audio-rate modulation.

  The plug-in ships with over 1000 presets contributed by producers, and its interface is built around immediate results.
specs: |-
  - 30 filter types ranging from classic to experimental
  - 250+ algorithms
  - 3 filter slots with serial, parallel, and combination routing
  - Drag-to-reorder filter tabs
  - 8 modulation sources available at once: Meta Knob, sequencer/LFO, ADSR, envelope follower, randomizer, pitch detector, MIDI/CV input, audio-rate oscillator
  - Modulators can cross-modulate each other
  - Optimized for audio-rate modulation
  - Stereo modulation, panning, and mid/side processing
  - Per-filter panning, phase, and mid-side controls
  - Additional processors: Tempolay rhythmic granular delay, Cabinator amp simulator, Space reverb
  - Many filters self-resonate and produce saturation
  - 1000+ presets
  - Supports VST2, VST3, AU, and AAX plug-in formats
  - Windows 64-bit and macOS 10.13+ 64-bit
