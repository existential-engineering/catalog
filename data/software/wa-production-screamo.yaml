description: Screamo is a distortion plugin that pairs two resonant shelving filters with a drive stage, both driven by a built in tempo synced waveform shaper. The results range from a talk box style effect to rhythmic overdrive.
details: |-
  Screamo wraps several familiar ideas into a single plugin, producing a talk box and screamer hybrid that can move in time with a track. Half of the interface is given over to a dedicated waveform shaper that modulates resonant filters, distortion and gain, which removes the need for complex audio routing and separately synced LFOs.

  The Smear section uses two resonant shelving filters. Used with restraint they give a talk box like effect, and pushed hard they become a full screamer. Three styles of smear can be switched, with upward, downward or two way frequency modulation.

  The Drive control takes a signal from subtle saturation through to extreme overdrive, making percussion loops crack or synths cut through a mix, and soft, medium and hard distortion modes can be activated.

  Smear, Drive and Makeup are synced together, so tempo synced scream effects can be built without the routing they would normally require. The bottom row of Shape, Speed and Smooth dials designs the waveform that controls the three parameters on the top row, covering a slowly evolving talk box effect through to fast fluttering overdrive.

  25 factory presets cover settings from subtle saturation through to wild overdriven rhythms, all reachable from the plugin menu, and user settings can be saved alongside them. A real time level monitor and gain control support accurate A/B comparison.
specs: |-
  - 25 factory presets for one-click transformations
  - 3 smear modes with upward, downward and two way frequency modulation
  - Two resonant shelving filters in the Smear section
  - 3 distortion types, soft, medium and hard
  - 5 sync modulation wave shapes with adjustable start points
  - Sync speed control with straight, triplet and dotted rhythms
  - Smear, Drive and Makeup synced together
  - Real time output level display and gain control
  - User presets can be saved
  - Resizable interface, added in version 2.1.0
  - PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
