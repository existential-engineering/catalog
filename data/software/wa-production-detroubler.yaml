  targeting six problematic frequency areas."
details: |-
  Research-based psychoacoustic processing. Six targeted frequency areas: boomy, boxy, muddy, honky, harsh, sizzle. Listen mode for real-time monitoring. Live frequency spectrum display. AB comparison and undo/redo. Resizable interface. CPU-efficient. Factory presets.
