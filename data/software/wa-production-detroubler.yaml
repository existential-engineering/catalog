description: Detroubler is a psychoacoustic processor that reduces six categories of fatiguing frequency, from boomy and boxy low end through to harsh and sizzling highs. Each area has its own clickable meter, and a Listen mode makes audible what the plugin is capturing.
details: |-
  Detroubler smooths audio that sounds overly harsh, boxy or boomy, working from psychoacoustic research rather than from manual frequency hunting. It applies techniques including Fletcher-Munson curves and the Bark Scale to identify the areas most likely to cause listening fatigue.

  A dedicated Listen button makes the parts of the audio that need attention audible. Raising the main Detrouble knob reveals what the plugin captures in real time, and switching Listen off returns those changes to context.

  Six glowing orbs surround the main knob and act as clickable meters, one per frequency area, so processing can be enabled or disabled area by area. The brighter an orb, the more processing is being applied, and an orb showing minimal activity indicates that no gain reduction is needed there.

  The six areas are Boomy (excessive low-frequency resonance, often in the 100-250 Hz range), Boxy (a hollow resonant quality that makes drums and vocals sound as if they are in a small box), Muddy (overlapping frequencies in the 200-500 Hz region), Honky (a nasal midrange quality around 500-1500 Hz), Harsh (aggressive high mids, often in the 2-6 kHz range) and Sizzle (uncontrolled high-frequency energy in the 8-12 kHz range).

  The interface is built on vector graphics and is resizable, with a live spectrum at the top for monitoring the signal in real time. AB comparison, copy and paste, and undo and redo support experimentation, and a large factory preset library covers everything from subtle surgical correction to broader transformations.
specs: |-
  - Psychoacoustic frequency-smoothing plugin based on Fletcher-Munson curves and the Bark Scale
  - Six targeted areas: Boomy, Boxy, Muddy, Honky, Harsh and Sizzle
  - Clickable orb meters enable or disable processing per area
  - Listen mode for monitoring what is being captured
  - Main Detrouble knob sets the overall amount
  - Live frequency spectrum display
  - AB comparison, copy and paste, undo and redo
  - Resizable vector interface
  - Factory presets included
  - PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Intel and Apple Silicon Mac CPUs supported, including native AAX
