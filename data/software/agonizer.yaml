details: >-
  Agonizer is a monophonic bass synth designed in close collaboration with
  youtuber jakob haq of haq attaq.


  Monophonic synth engine with focus on bass sounds. Wavetable synthesis with
  morphing and 40+ wavetables per oscillator.


  Built-in stereo effects. 140+ fine tuned factory presets designed by jakob
  haq.


  Supports roli seaboard and other mpe controllers out of the box (single
  channel mode only). Standalone operation with support for USB audio
  interfaces, wired, network & Bluetooth MIDI.


  Audio unit v3 extension. Inter app audio support. Audiobus support. Ableton
  link.
specs: |-
  - Monophonic synth engine
  - Wavetable synthesis
  - Morphing wavetables
  - 40+ wavetables per oscillator
  - Built-in stereo effects
  - 140+ factory presets
  - Roli seaboard support
  - Mpe controller support
  - USB audio interface support
  - MIDI support (wired, network, Bluetooth)
  - Audio unit v3 extension
  - Inter app audio support
  - Audiobus support
  - Ableton link support
  - Standalone operation
