details: |-
  Amber3 VST/AAX/AU plugin suite offers an accurate reproduction of an original, pure class a optical compressor - a redesigned iconic EQ and preamp by a celebrated us company.

  In designing amber3, we aimed at achieving total sound purity and depth, achieved through the use of class-a discrete solid-state circuitry, as well as a thoughtful mixture of active and passive filter cells, absence of any dc-blocking capacitors on the signal path and more.

  We then squeezed all the sampled units into a high-performance channel-strip for your own earvana.

  In addition to all this we implemented a brand new creative control called shine, which allows you to go smoothly from a shelf filter to peak.

  Amber 3 by acustica audio is a virtual effect audio plugin for macos and windows.
