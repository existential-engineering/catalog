details: |-
  Agnarohm is a stereo EQ / overdrive suite. It also features noise gate,
  compression, tuner, flanger, tonestack, preamp, uniphaser, cab simulation,
  delay and reverb units, making it suitable for guitar and bass (or any other
  instrument) signal processing.

  Instead of simulating existing hardware preamp heads, agnarohm offers totally
  customizable tonestack, preamp and pre / post equalizer units in order to
  achieve a great variety of amplification character and sound.

  Randomization functions are also available so that the user can focus on
  performing while quickly trying new complex settings and combinations
  literally at the push of a button.

  Features: noise gate, compression, tuner, flanger, equalizers, preamp / drive,
  tremolo, uniphaser, cabinet simulator, reverb, delay. Internal oversampling
  for aliasing reduction. Fully automatable controls. Randomization function for
  the whole unit as well as the individual chain parts. Preset saving and
  loading. Loudness protection / auto-gain function (no signal will be too loud
  or too quiet). Low cpu usage (full sse and sse2 support).
