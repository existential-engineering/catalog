details: |-
  808 bass module 4 is a powerful 808 bass rompler for windows & mac. 808 bass module 4 contains 318 ready-to-use and freshly designed layered presets, to bring grit and rumble to your productions.

  808 bass module 4 is the new version of our most popular and best-selling plugin since we began our journey in creating VST instruments. In this new version, we have added new and powerful 808 basses and also those of the previous version have been improved and included as an expansion so you can continue enjoying your favorite 808 basses.

  All sounds are ready to play in the key of your project.

  Features: cut-off, adsr, 318 presets for electronic music, lfo modulation, glide time control, distortion control, easy to use, 100% royalty free.
