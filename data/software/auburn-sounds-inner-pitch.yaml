    description: Free major update that enhances sound, adds hard-tuning pitch correction (Full Edition only), and supports larger screen resolutions (window now scales from 200% to 350%). Works on single instruments and full mixes, more open high-end, pitches down without tonal breakdown, less spectral leakage, and drops the slight compression of v1. The v1 sound remains available by clicking the version number. Shipped as a separate plug-in from Inner Pitch v1.
