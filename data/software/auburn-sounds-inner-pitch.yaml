details: |-
  Inner Pitch is a high-quality pitch shifting plugin designed to preserve the
  character of source material while enabling creative sound design. It offers
  pitch shifting with formant shifting to maintain natural vocal and instrument
  tones even at extreme settings.

  The plugin includes bass reinforcement with dry/wet control, track doubling
  capability, and stereo L/R pitch difference for wide spatial effects. It can
  create experimental soundscapes including endless ascending or descending
  sounds for unique creative applications.

  Additional processing features include an internal delay limiter, 3-band EQ,
  and diffusion effects for smoothing pitch-shifted signals. The Full Edition
  adds vocal hard-tuning capabilities, extending the plugin into pitch
  correction territory.

  Available in Free and Full editions, Inner Pitch serves both corrective pitch
  adjustment and experimental sound design workflows.
specs: |-
  - Pitch shifting
  - Formant shifting
  - Bass reinforcement with dry/wet control
  - Track doubling
  - Stereo L/R pitch difference
  - Endless ascending/descending sound creation
  - Internal delay limiter
  - 3-band EQ
  - Diffusion effects
  - Vocal hard-tuning (Full Edition)
