details: |-
  Banshee is an all-in-one vocal processing plugin designed for modern music
  production. With nine fully re-orderable modules, it provides a complete
  end-to-end vocal chain inside a single, streamlined interface from input gain
  staging to final output polish.

  Four preamp emulations offer tonal flexibility ranging from clean and
  transparent to saturated and character-driven. Integrated pitch correction,
  noise gate, and de-esser ensure clean, controlled vocals at the source.

  A precision graphic eq provides both corrective and creative tonal shaping.
  The dynamics section includes dual compressors inspired by classic 1176 and
  la-2a designs, allowing everything from transparent leveling to aggressive
  dynamic control.

  The drive module features four distortion architectures blended via an x/y
  pad, making it easy to add warmth, grit, or aggressive character. Additional
  modules such as doubler and beast expand stereo width and introduce bold,
  modern textures. Built-in chorus and shimmer add movement and harmonic depth.
  Special fx include lo-fi, radio, telephone, megaphone, and pixelator for
  creative and experimental vocal treatments.

  Banshee includes multiple delay types (classic, ping-pong, slapback, tape) and
  dual reverb processors with room, plate, hall, vintage, and other spatial
  algorithms all without leaving the plugin. Finalize your sound with a
  brickwall limiter, stereo widener, and final de-esser for loudness control,
  spatial enhancement, and polished high-frequency detail.
