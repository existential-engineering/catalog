description: "Attack EP88 - tacked electric piano: world's first tacked electric
  piano library. Massively customizable: 5 signal sources, over 47,000 samp..."
details: |-
  Attack EP88 is the world's first tacked electric piano library and possibly
  the most comprehensive electric piano library of any kind. Built on a
  foundation of over 47,000 samples, Attack EP88 is an incredibly rich sounding
  and deeply customizable instrument, providing numerous discrete signal paths
  including DI, tube, contact mic, mono mic and stereo pair, unique envelopes
  and effects for both the electric and acoustic signals, and discrete voicing
  and tuning controls for all 88 keys.

  The only library of its kind, attack ep88 delivers an entirely new take on the
  much-loved electric piano sound, in the most user-friendly and comprehensive
  way we could imagine.

  Attack ep88 is a virtual instrument audio plugin and soundware (samples or
  presets that load into other products) for macos and windows. It includes, and
  is therefore "powered by", uvi workstation, which functions as a VST plugin,
  an audio units plugin, a VST 3 plugin and an AAX plugin.
specs: |-
  - 88-key rhodes mark 1 prepared with brass tacks

  - 5 discrete and fully mixable signals (di, tube, contact, mono and stereo
  pair)

  - Internal signal routed via 3 busses (contact, mono and stereo, and di and
  tube)

  - Independent envelopes and effects per-bus (including thorus, dual delay and
  sparkverb)

  - 8 velocity layers and up to 5 round-robins per-mic, per-note

  - Pedal-up, pedal-down and key noise recordings (7 round-robins each)

  - Contact mic recordings made per tine

  - Per-note voicing control (3 tack positions recorded, per-signal, per-note)

  - Per-note tuning control

  - 70 presets

  - 47,000+ sample library, losslessly streamed for speed and efficiency

  - Flexible licensing supports 3 concurrent authorizations





  - Uvi workstation
