details: |-
  Ambient v4 is a unique ambient soundscape generator capable of producing a vast array of ambient textures, from the bizarre to the beautiful. The module has already featured on numerous professional recordings demonstrating its versatility in bringing inspiration to the creative process.

  Ambient processes any wav or aiff sound you care to load into it. Once the artist has achieved the sculpted sound they desire they simply press record to output the new sound wav with the option of live recording any tweaks or changes they choose to make. Often the output wav will be then imported into a DAW of the artist's choice.

  Version 4 update: ambient v4 updates, improves and builds upon customer feedback provided by v1. It is now compatible with the latest os x and windows platforms and has an improved gui. The design of software includes randomly loaded graphic backdrops created by mike podolak.

  The granular function is capable of transforming and mutating sounds into gentle molecules of ambience all the way to harsh and crunchy autechre style sound-assaults.

  Ambient is a unique standalone audio processing software capable of producing radically transformed audio, sound sculpting and design.
specs: |-
  - Granular sampler with random pitch function
  - Amplitude envelope with trigger speed control
  - Three pitch shift controls
  - Tape delay
  - Multi-mode filter
  - Ambient reverb
  - MIDI learn link to hardware controller
  - Preset save and recall
  - Wav and aiff sound file support
  - Live recording capability
  - Standalone application
  - Mac os x and windows compatible
