url: https://www.ssa-plugins.com/product/aXrotate/
description: Ambisonics allows for very efficient rotation of sound fields
  containing a large number of sound sources because they can all be rotated at
  once.
details: |-
  Alternatively, you can use it to adjust the orientation of an individual track
  to fit better within an existing scene or to align with visual cues from a
  video.

  The axrotate plugin allows you to rotate the ambisonics signal around three
  different axes in the order yaw, pitch and roll. The axrotate plugin also
  allows you to add small oscillations to the sound scene to simulate the micro
  head movements listeners make all the time. This can increase the sense of
  spaciousness in static binaural renderings.

  The axrotate can be connect to an inexpensive edtracker head tracking device.
  The allows it to rotate the whole sound field to adapt to the movements of
  your head, just like listening to real sounds. Or, control the sound field
  rotation with osc messages, giving you even more flexibility on the kinds of
  trackers you can use.

  The axrotate is available with 3 levels of spatial resolution, with different
  maximum ambisonic orders: a1rotate - rotate first-order ambisonic sound
  scenes. A3rotate - rotate up-to third-order ambisonic sound scenes. A7rotate -
  rotate up-to seventh-order ambisonic sound scenes.
specs: |-
  - First to seventh order ambix (sn3d/acn) format ambisonics
  - Rotation around three axes: yaw, pitch, and roll
  - Head tracking via edtracker device
  - Osc message control
  - Micro head movement oscillation simulation
  - Universal 2 binary
  - First-order ambisonic rotation (a1rotate)
  - Up-to third-order ambisonic rotation (a3rotate)
  - Up-to seventh-order ambisonic rotation (a7rotate)
