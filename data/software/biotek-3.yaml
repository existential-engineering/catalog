details: |-
  A new generation of software synth that combines the sounds of nature with a
  complex synthesis engine to create weird and wonderful organic soundscapes.

  The latest version of the biotek organic synthesizer features vast arrays of
  controls allowing you to tweak every parameter of each sound as desired. The
  large xy controller at the center of the main gui or "wild" layer gives the
  synth its most unique aspect the ability to easily blend various patches into
  new sounds and morph them in real time.

  Biotek features 4 oscillators per sound layer capable of creating multiple
  forms of synthesis: fm synthesis, virtual analog, sample playback and
  karplus-strong. With unlimited sound layers per patch, you can create simple
  or extremely complex, expressive instruments.

  Biotek takes modulation to the next level it features 200 modulation routes
  and 32 modifier routes performing mathematical functions on the modulation
  sources. It also features 8 unique flow lfos, each with 8 individual parallel
  syncable sub lfos on every sound layer. With so much routing available, it is
  possible to program "life", an organic randomness, into your sounds.

  Every parameter in biotek's engine can be quickly assigned to the stunning
  front panel macro controls, allowing users to completely build their own
  instruments, making the instrument perfect for studio or live performance.
