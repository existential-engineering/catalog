description: Virtual Guitarist SPARKLE 2 is your session specialist for chords, octaves and single note electric guitar riffs, supporting your songs with just the right amount of swagger and style.
details: |-
  Virtual Guitarist SPARKLE 2 delivers crisp, electric rhythm guitar performances with ease. No matter if you need shimmering clean pop chords, crunchy rock riffs or funky rhythm guitar, SPARKLE 2 is your companion for creating professional-sounding guitar tracks without the need for complex programming or playing skills.

  SPARKLE 2 instantly turns simple note input into dynamic rhythm guitar tracks. Whether you need tight funk strumming or open, airy chords, its flexibility lets you achieve the perfect guitar backing.

  Two performance modes are on hand: Player for automatic guitar performances and Instrument for hands-on play. Built-in Stomp Box effects and Finisher multi-effects round it out with a wide range of ready-to-mix guitar sounds.
specs: |-
  - A great-sounding electric rhythm guitar for clean to crunchy parts
  - More than 30 styles and 350 phrases, covering a wide range of picking and strumming techniques
  - Two performance modes: Player for automatic guitar performances and Instrument for hands-on play
  - Built-in Stomp Box effects and Finisher multi-effects
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 8 GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App, or downloadable installer file
  - Authorization: quick authorization via the UJAM App, or email and password within the plug-in
  - Supported standards: MIDI
  - Works on macOS and Windows with all major DAWs, including Ableton Live, Logic Pro, Pro Tools, FL Studio, Cubase, Studio One, Bitwig, Reaper and Reason
  - All MIDI phrases and included sounds are royalty-free
