details: >-
  Aethernity is a collection of seven max for live devices oriented towards the
  creation of ethereal and atmospheric music.


  Paysage: a soundscape creator tool with an interactive mixer featuring 20
  professionally recorded and seamlessly looping soundscapes.


  Ksenia: a polyphonic synthesizer based on karplus-strong synthesis, ideal to
  create physical models of guitar and piano strings. It also has some effects
  to shape the sound without the need of additional devices.


  Padradise: a polyphonic subtractive synthesizer specialized in the creation of
  lush and evolving pads and textures.


  Babel: an effect processor with 16 parallel filters, pitchshifters, delays and
  pan units followed by a thick reverberator, able to transform any kind of
  sound into a deep evolving texture.
specs: |-
  - Max for live devices
  - Polyphonic synthesizer
  - Karplus-strong synthesis
  - Subtractive synthesizer
  - 16 parallel filters
  - Pitchshifters
  - Delays
  - Pan units
  - Reverberator
  - Interactive mixer
  - 20 professionally recorded soundscapes
  - Seamlessly looping soundscapes
  - Effect processor
