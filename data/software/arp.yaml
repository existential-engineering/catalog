description: Arp is an advanced polyphonic arp and note sequencer with scale
  remapping for powerful sequencing possibilities.
details: >-
  Arp is an advanced polyphonic arp and note sequencer with scale remapping for
  powerful sequencing possibilities. Sequences can be re-mapped based on the
  played note so, for example, a sequence can be forced to fit to the major
  scale. The idea behind this is to break away from the typical note sequencer
  where every key simply transposes the sequence, the ability to remap each note
  results in a much more creative sequence.


  The muter section is a gate sequencer which decides which notes will play. Arp
  is also polyphonic and so can be used as a typical gate sequencer, or even
  more interesting as a polyphonic sequencer that syncopates.


  There is also the ability to offset the start note of each sequence so that
  when 2 notes are pressed together they automatically play syncopated. Finally
  there is omnichorder which allows triggering up to another 2 notes when one
  note is pressed to create a chord, this becomes interesting when used with the
  scale remapper which can leave you with a selection of interesting one finger
  chords.


  The demo version is fully featured, but times out after 30 minutes per
  session. A manual is included in a sub directory called manual with a PDF that
  covers the features.
specs: |-
  - Polyphonic arp
  - Note sequencer
  - Scale remapping
  - Muter section (gate sequencer)
  - Omnichorder
  - MIDI out
  - Latch control
  - Hold control
  - Polyphonic mode
  - Syncopation
  - Sequence offset
  - VST plugin
  - Windows compatible
