details: |-
  ALMx 5.1 (stands for audio loudness and true peak meter with extended
  features) is a standalone application developed as an extended version of the
  alm 5.1 plugin, offering more control and power for use in more complex
  situations.

  Almx 5.1 offers full loudness and true peak metering for mono, stereo and 5.1
  channel formats featuring measurements for momentary, short term and
  integrated loudness, with loudness range and max true peak level.

  The application can offer a general or more detailed overview of measured
  material at any time, with information saved in a .xml file.

  Full compliance with loudness standards: bs-1770 (rev.3), ebu r128 and atsc
  a/85 specifications.

  Complete loudness measurements using universal descriptors: integrated
  loudness (ilk), momentary loudness (mlk), short time loudness (slk), and
  loudness range (lra).
specs: |-
  - Standalone loudness and true peak metering for Windows and mac
  - Channel formats: mono, stereo and 5.1
  - Bs-1770 (rev.3) compliance
  - Ebu r128 compliance
  - Atsc a/85 compliance
  - Integrated loudness (ilk) measurements
  - Momentary loudness (mlk) measurements
  - Short time loudness (slk) measurements
  - Loudness range (lra) measurements
  - Real-time metering for momentary loudness
  - Real-time metering for short term loudness
  - Real-time metering for loudness range
  - True peak level metering with peak hold
  - Max true peak level with inter-sample peaks
  - Sample rates: 44.1 kHz, 48 kHz and multiples
  - Low CPU usage
  - Xml format logging files
  - Variable colors for loudness descriptors
  - Variable threshold for true peak
  - Variable threshold for short term loudness
  - Ipad application available for remote monitoring
