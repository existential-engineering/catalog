description: Music learning software that displays virtual instruments and
  widgets driven by MIDI for practice, teaching, and content creation. With the
  Pro Expansion it can also load audio, video, and MIDI files with pitch, speed,
  and key adjustment.
details: |-
  MIDIculous 4 is music learning software for teachers and musicians that lets you learn faster by practicing with MIDI-driven visual tools and (with the Pro Expansion) learning from your own audio, video, and MIDI files. Use it to display professional-looking virtual instruments and music widgets on-screen for virtual lessons and content creation. Whether you're trying to learn songs by ear, teach online, or make clean tutorial videos, MIDIculous is built around what modern musicians actually search for: slow down media, change pitch/key, see what's being played, and present it clearly on Zoom/OBS. 🔥 Why MIDIculous Exists

  🎹 Core Features Musicians Actually Want

  ⏱️ What People Are Searching For (and how MIDIculous answers it)

  ✅ Why Choose MIDIculous Over "Chord-Name Overlay" Apps (without naming anyone)

  Some tools focus mainly on identifying chord names and helping with reading/labels. That's useful—but it often stops there. MIDIculous is a full learning + teaching workflow:

  ⚠️ Important Note (Honest + Builds Trust)

  MIDIculous does not convert video/audio into MIDI automatically. For note display, you need a MIDI file or compatible lesson file that includes MIDI. ⭐ Summary

  If your goal is to learn faster, teach better online, and present music clearly on Zoom/OBS —MIDIculous 4 is built to do more than label chords. It's a full music learning workflow powered by media practice + MIDI-driven visual learning.
specs: |-
  - Learn from media files (Pro Expansion): load MIDI, audio, and video and adjust pitch/speed/key to learn from the thousands of files available online.
  - Teach and present professionally : show a high-resolution virtual keyboard and widgets on-screen for Zoom and OBS.
  - See the music : chord view + note names + lit keys + virtual score-style learning (MIDI-driven).
  - High-resolution virtual instrument animations Includes a hi-res virtual keyboard with key lights, note names, pitch wheel, mod wheel, and sustain pedal animations, with multiple keyboard sizes (48/61/88 key options depending on version).
  - Chord View (great for lessons + videos) Detach and display chord widgets with support for enharmonics/accidentals, resize to any layout, and recolor foreground/background for clean on-camera readability.
  - Zoom/OBS lesson workflow Designed to display your keyboard, score, and chord names to students and viewers; the Pro version can detach and resize displays for ergonomic layouts during lessons.
  - "How do I slow down a song without it sounding weird?" MIDIculous is built for practice workflows where changing speed/pitch/key is part of learning—especially when paired with MIDI-driven visuals.
  - "How do I show lit keys + chord names in OBS/Zoom?" MIDIculous is designed specifically around on-screen virtual instruments and detachable widgets for virtual lessons and content.
  - "What's the best way to learn songs by ear?" Combine media learning (speed/pitch/key) with visual reinforcement (keyboard, note names, chord view) so students don't just guess—they understand.
  - Media learning (practice engine) — not just chord labels: with the Pro Expansion you can load MIDI/audio/video and adjust pitch/speed/key for practice.
  - Teacher-first workflow — Pro teachers can create lesson files for students, and students can load teacher lesson files.
  - Presentation-ready visuals — "professional looking keys," hi-res instruments, lit keys, note names, chord view, and detachable widgets for clean OBS/Zoom layouts.
  - DAW integration option — Pro Expansion can load as a plugin inside a DAW/sequencer (VST/AU/AAX) so you can record while keeping the same virtual animations and learning widgets.
  - FREE Load teacher lesson files (.LMS/.LMV) and receive MIDI input to view instruments, but cannot load your own audio/video/MIDI.
  - Player Expansion Adds the ability to play MIDI/audio/video files, but cannot detach widgets and cannot load as a DAW plugin.
  - Pro Expansion Unlocks all features: detach instruments/widgets, create lesson files, plugin support (VST/AU/AAX), and learn from media files with pitch/speed/key control.
