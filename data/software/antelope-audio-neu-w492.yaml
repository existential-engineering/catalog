details: |-
  The NEU-W492 is based on the inimitable circuitry design of the original, carrying its signature German sound. As a favorite mastering tool of generations of record producers and sound engineers, the unit features a 4-band EQ with bypass available for each band or the entire unit.

  Versatile and simple to use, the NEU-W492 is particularly powerful in the midrange, delivering a warm analog sound character.

  Runs natively in your DAW on macOS or Windows, or in real-time on your Synergy Core interface.
specs: |-
  - 4-Band EQ plugin
  - Bypass available for each band or the entire unit
  - Particularly powerful in the midrange
  - Delivers a warm analog sound character
  - Emulation of a classic German mastering EQ
  - Runs natively in your DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core interfaces
