details: |-
  Abyss is a visual synthesiser with character and a bit of fairy dust. It brings to you dark, vibrating drones, vivid cinematic pads and rich evolving textures. With abyss you find instant inspiration for your music and sound design projects.

  The tone colour approach provides a simple way to create complex sounds. This is paired with a modulation system that is as powerful as it is simple to use. Tweak, mangle, modulate your sound to sonic madness or create sensible, nuanced mpe instruments.

  In abyss different sounds are represented by different colours a whole new way to design sounds. The sound engine of abyss combines the rich and deep textures of natural sounds with the effective flexibility of classical synths. Of course there is a virtual analogue filter, but there are also controls to shape tone colours in unheard ways.

  In abyss you can simply surf through a panel with more than 2000 tone-colours. By placing tone-colours on the gradient you create a palette of timbral variation that becomes the base of your patch. Whether you mainly used presets or you are a seasoned sound designer, with abyss you simply follow your intuition to create your own signature sound.

  Abyss synth is created by peter v mathematician by education, musician by heart. He believes you can find music in everything and that drawing inspiration from visual art can only benefit composition and sound design. After quitting his day job it took almost two years of research and dozens of prototypes to develop the innovative sound engine and user interface of abyss.
