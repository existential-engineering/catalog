details: >-
  Astereolizer can be used to control stereo width to audio tracks or master
  channel.


  With this plug-in you can generate pseudo stereo from mono audio tracks.


  Astereolizer is a tool that encapsulates the complete range of standard stereo
  manipulation functions, including phase reversing, channel flipping, balance,
  pan and width.
specs: |-
  - VST plugin
  - Phase reversing
  - Channel flipping
  - Balance
  - Pan
  - Width control
  - Stereo width control
  - Pseudo stereo generation
