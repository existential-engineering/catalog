description: A lo-fi flavoured multi-effect created with producer Arcade, combining bit reduction, filtering, chorus, diffusion and stereo processing behind a small set of macro controls. Build and Wash faders apply the same treatment to a full mix.
details: |-
  Neon Glow is a lo-fi multi-effect created in collaboration with FL Studio producer Arcade, whose own FX chains form the basis of its processing. It is aimed at individual instruments, vocals and whole mixes alike, and the modules are interlinked, so a change to one alters the behaviour of others.

  The central Lo-Fi control remixes the signal through a network of processors together with two submodules, Redux and Space, and sets the balance between them in the final mix. Redux drives a series of filters and bit reduction processors, turning clockwise or counterclockwise for warmer or cooler filtering alongside the bit reduction.

  Space governs a chain of chorus effects inside the Lo-Fi module. At zero it is a retro multi-chorus chain, turning counterclockwise brings in a more traditional multi-chorus effect, and turning the other way degrades the signal using the module's micro delays.

  The Wash fader adds a spatial effect built from filters, stereo expanders and psychoacoustically widened diffusion generators, with a Wash Character dial that alters width and late reflection values. The Build fader combines heavy filtering, diffusion generators and psychoacoustically enhanced stereo delays into a rising wave of energy, and its own Character dial ranges from gentle saturation of specific frequency bands to added spaciousness.

  Input and output levels are adjustable, and a LIM button limits the plugin output, so a hotter input produces more limiting and a more compressed result. The bypass is smoothed to stay free of clicks and pops, two versions of the settings can be stored and copied with the A and B options, and undo and redo are available. Artist-curated factory presets are clearly named and cover subtle shaping through to heavily processed chains.
specs: |-
  - Artist-curated plugin developed with Arcade
  - Creative lo-fi processing with poly-effect controls
  - Multi-stage processing to degrade, saturate, diffuse and chorus the signal
  - Lo-Fi control with Redux and Space submodules
  - Wash and Build faders, each with a Character dial
  - Output limiter with adjustable input and output levels
  - Resizable interface
  - Pop and click free bypass
  - A/B and copy for comparing settings
  - Responsive and CPU friendly
  - Artist-curated factory presets
  - Full PDF manual and tutorial video
  - Windows 8 or higher (64 bit)
  - macOS 10.10 or higher (64 bit)
  - AAX requires Pro Tools 11 or higher
