description: Adam monroe's upright piano is a VST, AU, and kontakt virtual
  instrument sampled from a (slightly used) schafer and sons vs-40 upright
  piano.
details: >-
  Adam monroe's upright piano is a VST, AU, and kontakt virtual instrument
  sampled from a (slightly used) schafer and sons vs-40 upright piano using
  oktava mk-012 (in cardioid pattern) and aea ribbon microphones in wide-stereo
  into grace m101 and aea trp preamps.


  The piano was sampled with both small diaphragm condenser and ribbon
  microphones in order to capture both the transient details and warmth of an
  upright piano.


  This piano library features 10 velocity layers, 2 note round robin, and over
  3500 audio samples.
specs: |-
  - VST plugin
  - Audio units plugin
  - AAX plugin
  - Kontakt virtual instrument
  - 10 velocity layers
  - 2 note round robin
  - Over 3500 audio samples
  - Small diaphragm condenser microphones
  - Ribbon microphones
  - Wide-stereo recording
  - Macos and windows compatible
