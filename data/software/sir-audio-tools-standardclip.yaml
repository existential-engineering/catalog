description: Over the years, our now-iconic clipper has earned its well-deserved recognition among many big names in the music industry and has been used as a secret weapon in the tracks for various major artists. Get StandardCLIP now and use it to increase the volume of your mix or to add unique harmonics to your signal.
details: |-
  StandardCLIP was designed to handle the clipping process as flexible as possible. You can adjust the way the clipping is done easily, like a hard-limiting brick wall or smooth soft-saturated. StandardCLIP also offers input and output RMS-meters and a waveform display for the perfect control of the output volume.

  The filter which is used for up and down-sampling is very important for a good result. You can choose between linear-phase and minimum-phase mode. You are also able to change the filter quality and cut-off frequency of the oversampling process.

  The plugin offers high quality oversampling up to the factor 256 and provides a large variety of options.
specs: |-
  - High quality oversampling up to 256x
  - Hard-limiting and soft-saturation clipping modes
  - Input and output RMS meters
  - Waveform display
  - Linear-phase and minimum-phase oversampling filter modes
  - Configurable filter quality and cut-off frequency
  - 64-bit Intel (Windows and Mac), Apple Silicon Native, 32-bit Windows
  - Mac OS 10.13 or newer; Windows 11 or newer
  - 200 MB hard disk space, 8 GB RAM
  - No dongle required
