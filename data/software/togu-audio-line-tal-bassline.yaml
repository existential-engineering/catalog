description: TAL-BassLine is a virtual analog bass synthesizer especially made for bass, acid sounds and effects. It's based on a robust core and has the usual controls of analogue hardware synthesizers.
details: |-
  TAL-BassLine has a unique -18dB low pass filter with a lot of asymmetric and random components for a warm and analogue sound, and very fast, non linear envelopes.

  TAL lists TAL-BassLine under "Deprecated Plug-Ins (not supported)". It was released as a Windows 32-bit and 64-bit VST and as a 32-bit VST and AU for OSX 10.6 to 10.9 hosts, and remains a free download.
specs: |-
  - System Requirements Windows: Windows XP or higher (32 / 64 bit)
  - System Requirements Mac: OSX 10.6 and < 10.10 (32 bit Host)
  - Architectures: Windows 32 bit and 64 bit VST; OSX 32 bit VST and 32 bit AU
