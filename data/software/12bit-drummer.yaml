details: |-
  This kit is made by recording an acoustic drum with an akai s20 12bit sampler. Some processing where then made in order to keep the sound natural while bringing out the gritty nature of this cheap sampling device.

  The sound is gritty but not lofi, with a solid low end, sharp transients and warm presence for the snares and hi-hats.

  The 'pro' and 'selection' versions of the kit also provides a more hi-fi version of the acoustic set, which were recorded and edited with full 24-bit resolution on the whole signal chain.

  I also added a small tr-808 kit in the 'full pro', because we always like to have one close to us and we like boomy basses.
specs: |-
  - 12-bit sampler recording
