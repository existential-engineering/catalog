details: >-
  The analog phaser module apm 111 is a re-creation of a common effects chain of
  running a signal through two independent phasers working either in tandem or
  in different directions depending on your choice.


  The apm 111 is far more than just two phasers. It is like having a room full
  of classic phaser boxes available 24/7 with a turn of a knob.


  As an added bonus, if you need even more creamy phasing goodness, just run the
  signal back through the phasers again with the "regenerate" section.
specs: |-
  - Dual independent phaser units
  - Regenerate signal section
  - Vintage delay
  - 128 user presets
  - MIDI automation
  - Color and manual modulation of sweep
  - VST plugin
  - Windows compatible
