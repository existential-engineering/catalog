description: Deres is a de-resonance plugin that locates problem harmonics through harmonic analysis and reduces them in either a static or a dynamic mode. Compensation controls restore brightness and presence after the resonant peaks have been removed.
details: |-
  Deres targets hidden resonances and unruly harmonics that build up when several instruments are layered. Rather than guessing at which frequencies need attention, it works from the mathematics of sound harmonics to uncover resonances that are easy to miss, and preview functions allow those interferences to be heard before any processing is applied.

  A dedicated Listen button isolates resonances by exaggerating the frequencies. The Find knob sweeps the 1-8 kHz range to identify unusual peaks that sound muddy or harsh, the Reduce parameter applies the processing, and the Q value widens or narrows the band so more or fewer surrounding frequencies are caught.

  Where a surgical EQ acts on a single narrow slice, Deres can process all the harmonics related to a chosen frequency. The Octave knob reduces the relative components of the main frequency, static mode cuts resonances in a linear way, and an advanced dynamic mode steps in only when it is needed.

  Compensation controls counteract the flatness that removing frequencies can cause. The Tone button applies a convolution response to adjust the tonal balance of supporting instruments such as pads and strings, the Compensate knob boosts frequencies neighbouring those cleared by the resonance removal, and the Excite control adds air and presence. A mid/side mode and low cut filtering are also included.

  The interface is built on vector graphics and is resizable, with a live spectrum at the top showing what happens to the signal in real time. AB comparison, copy and paste, and undo and redo support experimentation, and a large factory preset library covers everything from subtle surgical correction to broader transformations.
specs: |-
  - De-resonance plugin with harmonic processing
  - Find knob sweeps the 1-8 kHz range to identify problem harmonics
  - Listen button exaggerates resonances for identification
  - Static and dynamic reduction modes
  - Octave control processes the relative components of the main frequency
  - Compensation controls: Tone, Compensate and Excite
  - Mid/side mode and low cut filtering
  - Live frequency spectrum monitoring
  - AB comparison, copy and paste, undo and redo
  - Resizable vector interface
  - Factory presets included
  - PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Intel and Apple Silicon Mac CPUs supported, including native AAX
