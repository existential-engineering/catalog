description: "Advanced de-resonance plugin for eliminating muddy sounds and
  pesky overtones with dynamic and static harmonic processing modes and
  real-time frequency spectrum monitoring."
details: |-
  Advanced harmonic processing with dynamic and static modes. Real-time frequency spectrum monitoring. Listen button for isolating resonances. Find knob (1-8 kHz). Reduce parameter. Octave knob for harmonic reduction. Compensation controls: Tone, Compensate, Excite. Mid/Side mode and low-cut filtering. AB comparison. Resizable vector graphics. CPU-friendly. Factory presets.
specs: |-
  Windows 10/11 (64-bit). macOS 10.15+ (64-bit).
