details: |-
  A variation on the VEQ-4k Brown, which's still a huge thing in Japan. Very clear sound and controls simulating valve EQ curves. This one is not just one more module strip revision, but a hardware rarity with a sound of its own.

  4-Band EQ with HPF and LPF, modeled after a legendary line of equalizer modules.

  Runs natively in your DAW on macOS or Windows, or in real-time on your Synergy Core interface.

  Available individually or as part of the Antelope Cosmos subscription, which unlocks 75+ Antelope Native Plugins.
