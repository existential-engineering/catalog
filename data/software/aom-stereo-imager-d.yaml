description: A correlation-based stereo image processor offering true stereo
  processing by decomposing L/R inputs into L'/C/R' components, preserving tonal
  balance without M/S artifacts.
details: |-
  Stereo Imager D is a stereo image processing plugin that takes a fundamentally
  different approach from typical Mid/Side processors. Instead of M/S
  decomposition, it uses a correlation-based algorithm to decompose L/R inputs
  into L', C, and R' components.

  This approach preserves stereo information without breaking the tonal balance
  that can occur with conventional M/S processing. The result is more
  natural-sounding stereo width adjustments that maintain the integrity of the
  original stereo image.

  The plugin operates at 64-bit floating-point precision with support for sample
  rates from 44.1kHz to 384kHz. Factory and user presets with snapshot
  functionality allow quick recall of settings.
specs: |-
  - Correlation-based stereo decomposition (not M/S)
  - L'/C/R' component processing
  - Preserves tonal balance during width adjustment
  - Sample rates: 44.1kHz to 384kHz
  - 64-bit floating-point internal precision
  - Latency compensation included
