description: A.O.M. Stereo Imager D is a correlation-based stereo image processor. It offers non-Mid/Side, a true stereo processing.
details: |-
  A.O.M. Stereo Imager D is a correlation-based stereo image processor. It offers non-Mid/Side, a true stereo processing.

  Common stereo imager (typically using M/S decomposition) plugins can not retain stereo information of source singal. These plugins sometimes emphasizes side component of input signals, however, such processing easily breaks tonal balance and stereo image of input singals.

  In contrast to others, A.O.M. Stereo Imager D uses on correlation-based decomposition. This algorithm decomposes L/R inputs into L'/C/R'. The correlated component of both channels is mapped to C, the decorrelated components are mapped to L'/R'. The L' and R' components have no correlation, it means a true stereo.

  On Windows the plugin requires an x64-compatible CPU and Windows 11 24H2 or 25H2, and ships as VST2, VST3, AAX-Native and CLAP. On Mac it runs on Intel and Apple Silicon under macOS Monterey 12 through macOS Tahoe 26, and ships as VST2, VST3, Audio Unit, AAX-Native and CLAP.

  Common features across the A.O.M. range include sample rates from 44.1 kHz to 384 kHz, 64-bit floating-point internal precision, latency compensation, factory and user presets, snapshots, undo/redo and reset to default.
specs: |-
  - Correlation-based decomposition of L/R input into L'/C/R' components (non-Mid/Side, true stereo processing)
  - Supports 44.1k - 384kHz Sample Rate
  - 64-bit Floating-point Internal Precision
  - Latency Compensation
  - Factory Preset
  - User Preset
  - Snapshot
  - Undo/Redo
  - Reset to Default
  - Windows: x64-compatible CPU, Windows 11 24H2 / 25H2
  - Mac: Intel / Apple Silicon, macOS Monterey 12 through macOS Tahoe 26
