description: Vintage tube compressor plugin modelled on 50s–70s tube leveling amplifiers. Warm glue for vocals, bass, drums and bus.
details: |-
  The VTC-2 is a vintage tube compressor built to do what the great tube leveling amplifiers of the 50s through 70s did, add warmth, density and grease while it controls dynamics, so the compression is part of the tone rather than a chore you tolerate. Rather than clone one specific box, it models the behaviour those units shared: a physically accurate tube gain circuit that saturates smoothly as you drive it.

  At the core of the VTC-2 is a meticulously modelled Class-A 12AX7 tube gain stage wrapped around a clean feed-forward detector with a gentle soft knee. Because it's a real-time circuit simulation rather than a fixed transfer curve, the coloration changes with how hard you hit it. The Drive control runs the compressor hotter and pulls more saturation and grease out of the processed signal, independent of how much gain reduction is applied. Threshold decides how much of the signal gets leveled, and Ratio runs from a gentle 2:1 up through 4:1 and 10:1 to a firm 20:1.

  The envelope is a physically modelled version of a classic attack-and-release circuit, with complete control over both time constants. The Trim knob (±24dB) corrects the processed output so users can gain-match honestly before and after, and the Mix knob runs a wet/dry blend for parallel compression directly inside the plugin, with no send-and-return loop to set up. A modelled VU meter plus a red gain-reduction needle allow threshold and ratio to be fine-tuned by eye.

  On vocals it adds body and a forward, tape-warmed presence. On bass it evens out the low end and thickens the growl without dulling the attack. On drums, a fast attack and a good helping of Drive gives a gritty, saturated thump, or the Mix can be backed off for New York-style parallel crush. It also works on brass, guitar, Rhodes and the mix bus. The Mode switch runs a stereo source Stereo Linked to protect the image, or as Dual Mono to process each side independently.
