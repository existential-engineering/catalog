  supporting a vast ecosystem of third-party sound libraries. It provides
  deep sampling, scripting, and sound design capabilities alongside a
  massive built-in factory library.
details: |-
  Kontakt is the most widely used software sampler in music production,
  serving as the platform for thousands of third-party virtual
  instruments and sound libraries. Its deep architecture supports
  everything from simple sample playback to complex scripted instruments
  with custom interfaces.

  The built-in factory library includes over 55 GB of sampled
  instruments spanning orchestral, cinematic, electronic, vintage, and
  world categories. High-quality recordings of acoustic instruments
  provide realistic playback with round-robin, velocity layering, and
  articulation switching.

  The sampling engine supports multiple playback modes including DFD
  (Direct from Disk) for efficient streaming of large libraries. Time
  Machine Pro provides high-quality time-stretching, and the wavetable
  module adds synthesis capabilities alongside traditional sampling.

  KSP (Kontakt Script Processor) enables developers to create custom
  instruments with scripted behavior, custom GUIs, and complex
  performance logic. This scripting engine powers the sophisticated
  behavior of most commercial Kontakt libraries.

  Effects include filters, EQs, compressors, reverbs, delays, and
  creative processors. A comprehensive modulation system with
  envelopes, LFOs, and step sequencers provides per-voice and global
  modulation of any parameter.
specs: |-
  - Industry-standard software sampler
  - 55+ GB factory library
  - DFD (Direct from Disk) streaming
  - Time Machine Pro time-stretching
  - Wavetable synthesis module
  - KSP scripting for custom instruments
  - Custom GUI support for libraries
  - Multi-output routing (up to 64 outputs)
  - Group-based sample organization
  - Round-robin and velocity layering
  - Articulation switching via keyswitches
  - Built-in effects (filters, EQ, compressors, reverb, delay)
  - Modulation system (envelopes, LFOs, step sequencer)
  - Surround support (up to 16 channels)
  - Third-party library ecosystem (thousands of titles)
