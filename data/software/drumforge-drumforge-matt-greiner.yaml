description: A virtual drum instrument plugin built on the signature drum sample collection of August Burns Red drummer Matt Greiner, captured at Atrium Audio by Grammy-nominated producers Carson Slovak and Grant McFarland, with a built-in mixing console and Song Builder.
details: |-
  Drumforge Matt Greiner is a virtual drum instrument plugin for programming realistic rock and metal drum performances or augmenting existing drum recordings. It carries the signature drum sample collection of Matt Greiner of August Burns Red, captured and mixed by two-time Grammy nominated producers and mixers Carson Slovak and Grant McFarland, whose credits include August Burns Red, Erra, Polaris, From Ashes To New, Galactic Empire, Everclear, and Candlebox.

  The drums were sampled across a variety of scenarios in Slovak and McFarland's studio at Atrium Audio, giving the kit builder a wide range of engineering setups to draw from. Users choose the setup per microphone for each sample, so the kit can be reshaped without swapping libraries.

  A fully featured virtual mixing console with built-in channel inserts allows a complete drum mix to be finished inside the plugin. Drumshotz or user WAV one-shots can be inserted into the mix for layering and stacking.

  Performance realism is handled by sampling both the left and right kick beaters and alternating them from a single MIDI note with a Foot Switching algorithm, per-velocity-layer volume control for fill realism, a velocity interpretation curve for dynamic range, and a smoothing algorithm between successive hits.

  The Song Builder uses a Groove and Fill Playlist so grooves can be dragged into a queue, with intelligent fill logic inserting fills at the end of bars. The plugin ships with a collection of signature grooves from Matt Greiner.
specs: |-
  - Virtual drum instrument plugin for programming or augmenting rock and metal drum performances
  - Signature drum sample collection of Matt Greiner (August Burns Red)
  - Captured and mixed by Carson Slovak and Grant McFarland at Atrium Audio
  - Includes 5 kicks, 12 snares, 4 sets of toms, 2 hi-hats, 2 rides, 5 crashes, 7 chinas, 2 splashes, 1 stack, 2 bells
  - Per-microphone engineering setup selection for each sample
  - Fully featured virtual mixing console with built-in channel inserts
  - Loads Drumshotz or user WAV one-shots for layering
  - Fully configurable MIDI mapping with presets for other samplers
  - Song Builder for writing songs from Drumforge Groove Packs
  - Includes a collection of signature grooves from Matt Greiner
  - Mac Intel and Apple Silicon compatible
