description: "The signature drum sample library of legendary metal drummer Matt Greiner (August Burns Red), meticulously captured and mixed by multi-Grammy nominated producers Carson Slovak and Grant McFarland at Atrium Audio. A fully featured virtual drum instrument plugin with an intuitive UI, built-in virtual mixing console, and advanced sampler technology designed for rock and metal productions."
details: |-
  The Drumforge Matt Greiner plugin captures the signature drum sound of August Burns Red drummer Matt Greiner, recorded and mixed by multi-Grammy nominated producers Carson Slovak and Grant McFarland at Atrium Audio.

  The plugin features an intuitive UI with a robust, workflow-optimized engine and a fully featured virtual mixing console with built-in channel inserts for complete drum sound design within the sampler itself.

  Load custom Drumshotz or WAV samples, configure MIDI mapping with presets, and use the Song Builder feature to quickly compose with Drumforge Groove Packs. Advanced sampler technology includes foot-switching algorithms and velocity interpretation curves.

  Included sample library: 5 Kicks, 12 Snares, 4 Tom Sets (3-piece sets plus 8-inch tom), 2 Hi-Hats, 2 Rides, 5 Crashes, 7 China cymbals, 2 Splashes, 1 Stack, 2 Bells, plus signature Matt Greiner grooves.

  Purchase includes a perpetual license with free lifetime updates and unlimited customer support.
