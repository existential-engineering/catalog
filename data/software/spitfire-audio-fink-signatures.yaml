details: |-
  Signatures is a definitive acoustic guitar toolkit with a human touch, full of character and sonic depth. At the heart of this sample library are three distinctive acoustic guitars, beautifully captured in microscopic detail and offering a range of classic and signature playing styles, from delicate to punchy, including pulled, plucked, muted and thumbed one-shots, pristine harmonics and more.

  These emotive sounds are complemented by a range of guitar-based percussive tempo-synced loops and hits, soothing vocals, and contemplative pads. Made in collaboration and performed by producer, composer and songwriter Fin Greenall, aka Fink, this toolkit has been carefully curated to inspire both composers and songwriters, guitarists and non-guitarists alike — an instantly playable collection that lends itself to a range of compositions, from intimate indie scores to acoustic pop tracks, and beyond.
specs: |-
  - Three acoustic guitars: 2004 Mal Brady Bouchier nylon, 2010 Martin D28, 1984 Martin D35
  - 54 presets in 6 sections (Brady 11, Festy 13, Orwell 14, Percussion 7, Voices 6, Pads 3)
  - 9 controls: Expression, Dynamics, Attack, Release, Reverb, Start Point, Chorus, Delay, String Squeak FX
  - Recorded at Jazzanova Recording Studios, Berlin
  - 9.52 GB file size
  - macOS 11 to OS 26, Intel and Apple Silicon supported
  - Windows 10 or 11 (64-bit)
  - Minimum 8 GB RAM, 16 GB recommended
  - Spitfire Audio App required
