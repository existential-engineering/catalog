description: Grainferno is an advanced granular synthesizer plugin (VST/AU/AAX)
  from Baby Audio. It breaks audio files into fragments and rebuilds them into
  new and unique textures.
details: |-
  Grainferno is a granular synthesizer that generates grains at audio rates, enabling synthesizer-like behavior from any audio source. It features two independent source slots with morphing capabilities across seven unique morphing modes, allowing real-time blending between samples.

  The modulation system includes three envelopes, three LFOs, and three random generators with a drag-and-drop workflow. Modulators can cross-modulate each other for complex evolving textures. Per-grain effects shaping allows effects to be applied at the grain level.

  The onboard effects suite includes delay, reverb, analog-inspired modulation, and multimode saturation with a reorderable signal chain. A Play View provides four macro controls for streamlined performance.

  Grainferno ships with 325 handcrafted presets, 378 royalty-free audio files, and six template configurations, totaling 1.5GB of content. It supports WAV, AIFF, FLAC, MP3, and Ogg Vorbis sample formats.
specs: |-
  - Granular synthesis engine with audio-rate grain generation
  - Two independent source files with seven morphing modes
  - Three envelopes, three LFOs, three random generators
  - Drag-and-drop modulation with cross-modulation between modulators
  - Per-grain effects shaping
  - Onboard effects: delay, reverb, analog modulation, multimode saturation
  - Reorderable signal chain
  - Play View with four macro controls
  - 325 handcrafted presets
  - 378 royalty-free audio files, 1.5GB library
  - Supports WAV, AIFF, FLAC, MP3, Ogg Vorbis samples
  - Key-mapped octave mode and Auto Pitch tuning
  - Native Apple Silicon M-Chip support
  - 64-bit only
