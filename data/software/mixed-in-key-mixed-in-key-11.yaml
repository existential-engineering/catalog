description: The world's first and most accurate key-finding software for DJs. Analyzes music libraries to detect musical keys, BPM, and energy levels for harmonically perfect DJ sets, with automatic cue point generation and integration with major DJ platforms.
details: |-
  Mixed In Key 11 is a standalone desktop application that analyzes audio tracks to detect musical key, BPM, and energy levels with an algorithm described as at least 10% more accurate than any previously existing software. Released September 2024.

  Supports all major audio formats including MP3, WAV, AIFF, Apple Lossless, OGG, and FLAC. Integrates with Serato, Pioneer rekordbox, Traktor, Virtual DJ, Denon, and Ableton Live by writing analysis results directly into ID3 tags using the Camelot Wheel harmonic mixing system.

  Automatically places up to 8 cue points per track using an algorithm that detects the most musically important moments. The unique Energy Level rating system grades each track's danceability.

  Built-in Grand Piano verification tool lets users audibly confirm detected keys. Dark mode interface with full customization of ID3 tag storage. Tag-cleaning feature removes junk metadata.

  Available in two editions: standard ($58) covering core key detection and analysis, and Pro ($99) adding a mashup idea engine, mashup deck players, and mixout idea engine.
specs: |-
  - New data-science key detection algorithm (10%+ more accurate)
  - Energy level analysis with per-track danceability rating
  - Up to 8 automatic cue points per track
  - Supported formats: MP3, WAV, AIFF, Apple Lossless, OGG, FLAC
  - DJ software integration: Serato, rekordbox, Traktor, Virtual DJ, Denon, Ableton Live
  - ID3 tag editing and bulk cleanup
  - Built-in Grand Piano key verification tool
  - Dark mode interface
  - Playlist organisation with emoji support
