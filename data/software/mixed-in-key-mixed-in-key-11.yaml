details: |-
  Mixed In Key 11 is described on its product page as the world's first and most accurate key finding software for music, aimed at improving DJ mixing and music production. The page positions it as an industry standard tool for harmonic mixing, used to analyze a music collection and prepare it for performance.

  Analysis covers key, tempo, energy level, cue points and other metadata in a matter of seconds. The Energy Level system rates how danceable each track is and can be broken down per segment of a track, while Advanced Filtering sorts music by key, tempo, energy level and genre to build playlists for specific moods or events.

  Results are written back into the music files through customizable ID3 tagging, so they can be used in Traktor, Serato, Pioneer CDJs, Virtual DJ, Ableton Live and other DJ software. A tag editor cleans junk out of ID3 tags so playlists across DJ software follow the same scheme, and Tag Comments can automatically insert Key and Energy Level into the comments field.

  The application detects up to 8 automatic cue points per track and exports them to Traktor, Serato and rekordbox, with a Snap Cue function that snaps cue points to the current playback location. A built-in grand piano lets the user verify detected keys by ear, and the interface offers a light/dark mode toggle, a Camelot Wheel view, nested playlist folders and emoji playlist customization.

  The page states that the version 11 algorithm is based on a new type of data science that was previously unavailable, and claims results at least 10% more accurate than any software that has existed before. Two one-time-purchase tiers are shown, a Standard edition and a Pro edition, both listed as non-subscription.
specs: |-
  - Key detection
  - Energy level analysis, including a per-segment energy level breakdown
  - Up to 8 automatic cue points per track, exportable to Traktor, Serato and rekordbox
  - Snap Cue: snap cue points to the current playback location
  - Tempo (BPM) detection
  - ID3 tag editing and tag cleanup, single track or bulk
  - Tag Comments: automatically insert Key and Energy Level into the comments field
  - Camelot Wheel view for harmonic mixing
  - Built-in grand piano for verifying detected keys
  - Advanced filtering by key, tempo, energy level and genre
  - Playlist folders and nested playlists with emoji customization
  - Light and dark mode interface toggle
  - Song Info editor for title, artist, album, key, energy, tempo and genre
  - Supported audio formats: MP3, WAV, AIFF, Apple Lossless, OGG, FLAC
  - Works with Serato, Denon, Pioneer rekordbox, Native Instruments Traktor, Virtual DJ, Ableton Live and Logic Pro
