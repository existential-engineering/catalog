details: |-
  BEAT to MIDI is a fast acting, low overhead beat detection and drum
  replacement tool which producers and musicians can implement to extract MIDI
  data from drum loops.

  Beat to MIDI allows for the correction of poorly captured or performed drum
  recordings after the recording session has taken place.

  Beat to MIDI uses sophisticated algorithms to identify each drum hit (or
  transient) in the time domain. Once this point is detected, MIDI data can be
  used to trigger replacement drum samples to alleviate poor quality recordings
  and/or timing errors.

  Detection of drum strikes and output of detections to a (defined) single MIDI
  note. Supervised pattern matching system to identify drum instruments.

  Detection of drum strikes and drum instruments with output of detections to
  appropriate (general MIDI defined) MIDI notes. Automatic ratio settings to
  allow easy settings of thresholds.
specs: |-
  - Beat detection
  - Drum replacement
  - MIDI data extraction
  - Transient detection
  - Drum strike detection
  - Pattern matching
  - MIDI note output
  - General MIDI support
  - Threshold settings
  - Windows compatible
  - Low overhead processing
