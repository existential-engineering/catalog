details: |-
  The ampknob mlc s_zero 100 is a guitar amp simulator plugin designed for effortless, high-quality boutique tones.

  Minimalist controls: a single knob captures the full range of a three-channel amp, plus a boost pedal for extra drive.

  Focus on playing: simplified design allows guitarists to focus on performance rather than tweaking parameters.

  Built-in standalone app: includes a tuner, metronome, and riff recorder for practice and jamming without a full DAW setup.

  Irdx technology: enhances loaded cabinet impulse responses for realistic speaker dynamics and feel.
