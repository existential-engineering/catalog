details: |-
  The ACM210X1 Graphical EQ plug-in for Windows and Linux proves that digital EQ
  doesn't have to sound digital. Using innovative processing algorithms to
  provide de-cramped filters, accurately modelling analogue equivalents, without
  requiring oversampling, additional latency or high CPU demand, the acm210x1
  delivers the desirable qualities of analogue EQ with digital precision.

  Comprehensive set of filter types, accurately modelled across the full 20hz to
  20khz audio range. Realtime fft display.

  The acm210x1 is also available as part of the acm plug-ins bundle. Learn more
  about the acm series plug-ins at www.acmt.co.uk
specs: |-
  - Up to ten filter bands
  - De-cramped filters
  - Comprehensive set of filter types
  - 20hz to 20khz audio range
  - Realtime fft display
  - Pre / post process fft monitoring
  - Fft slope compensation
  - Smooth parameter interpolation
  - Resizable graphical user interface
  - Windows compatible
  - Linux compatible
  - Linux x86-64 / amd64 64-bit
  - Opengl (glx) 3.x or later
