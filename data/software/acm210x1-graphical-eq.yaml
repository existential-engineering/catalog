details: |-
  The acm210x1 graphical eq plug-in for windows and linux proves that digital eq doesn't have to sound digital. Using innovative processing algorithms to provide de-cramped filters, accurately modelling analogue equivalents, without requiring oversampling, additional latency or high cpu demand, the acm210x1 delivers the desirable qualities of analogue eq with digital precision.

  Comprehensive set of filter types, accurately modelled across the full 20hz to 20khz audio range. Realtime fft display.

  The acm210x1 is also available as part of the acm plug-ins bundle. Learn more about the acm series plug-ins at www.acmt.co.uk
