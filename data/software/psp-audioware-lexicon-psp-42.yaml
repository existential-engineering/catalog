description: A high-quality digital stereo delay and phrase sampler plug-in based on the legendary Lexicon PCM42 processor. Features up to 28800 ms delay time, four processing modes (Clean, Lims, Full, Legacy), tape saturation emulation, analog limiter emulation, A/D and D/A converter emulation, LFO with tempo sync, four directional modes for record/playback, phrase sampler capability, and sidechain input.
details: |-
  Collaborative product between Lexicon and PSP Audioware, emulating the Lexicon PCM 42 digital delay/phrase sampler hardware. Requires iLok License Manager. License activatable in 3 separate locations. Supports sample rates up to 384 kHz.
specs: |-
  - Delay time: up to 28800 ms
  - Processing modes: Clean, Lims, Full, Legacy
  - Sample rate support: up to 384 kHz
  - Tape saturation emulation
  - Analog limiter emulation
  - A/D and D/A converter emulation
  - LFO with tempo sync
  - Four directional modes for record/playback
  - Phrase sampler capability
  - Adjustable Hi Cut filter
  - Sidechain input
  - iLok License Manager required; 3 activations
  - Platforms: Windows 7-11 (64-bit), macOS 10.14-15 Sequoia (Intel and Apple Silicon)
