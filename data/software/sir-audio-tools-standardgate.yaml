description: StandardGATE is a dynamic processing plugin for noise removal, spill reduction, and creative dynamics shaping, enabling more professional-sounding audio recordings. It features intelligent detector algorithms, MIDI-controlled triggering, side-chain control, and multiple processing modes including noise gate, ducking, and upward expander.
details: |-
  StandardGATE is a multi-talent dynamic processing plugin designed for noise removal, spill reduction, and creative dynamics shaping in audio production. It supports music production, podcasting, and other audio applications requiring precise gating control.

  The plugin offers four intelligent detector algorithm modes — Percussive, Transient, Peak, and RMS — allowing users to tailor detection behavior to the source material. A lookahead mode ensures accurate transient capture.

  StandardGATE supports MIDI-controlled triggering for dynamic processing and side-chain control via external signals. De-bleeding filters help isolate the desired signal, while noise gate, ducking, and upward expander modes offer versatile processing options.

  The plugin features GPU-powered real-time audio display, oversampling, and flexible stereo options.
specs: |-
  - Detector modes: Percussive, Transient, Peak, RMS
  - Processing modes: Noise Gate, Ducking, Upward Expander
  - Lookahead: 0, 1, 3, 5, 10, 100, 1000ms
  - MIDI-controlled triggering
  - External side-chain input
  - De-bleeding filters
  - GPU-powered real-time audio display
  - Oversampling support
  - Flexible stereo options
  - Mac: 64-bit Intel and Apple Silicon native, macOS 10.13+
  - Windows: 64-bit Intel, Windows 11+
  - 8 GB RAM, 200 MB disk space
  - No dongle required
