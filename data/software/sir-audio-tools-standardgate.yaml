description: "Versatile noise gate plugin with intelligent detector algorithms
  including Percussive, Transient, Peak, and RMS modes. Features ducking, upward
  expander, and transient extractor modes. Includes GPU-powered scrolling audio
  display, sidechain support, lookahead mode, advanced de-bleeding filters, MIDI
  triggering, and flexible stereo options with oversampling."
details: |-
  Supported architectures: 64-bit Intel Win+Mac, Apple Silicon Native. Requires Windows 10 or newer, Mac OS 10.13 or newer. 30 MB hard disk space, 8GB RAM.
specs: |-
  Plugin formats: VST, VST3, AudioUnit, AAX. 64-bit Intel Win+Mac, Apple Silicon Native. Noise gate, ducker, upward expander, transient extractor modes. GPU-powered scrolling audio display. Sidechain support. Lookahead mode. MIDI triggering. Advanced de-bleeding filters.
