description: >-
  Industry-leading digital audio workstation for music production,
  performance, and sound design. Features Session View for live performance
  and arrangement, powerful MIDI and audio editing, built-in instruments
  and effects, and extensive hardware integration. Known for its intuitive
  workflow and creative flexibility.
details: |-
  Ableton Live is a digital audio workstation built around two complementary
  views: Session View for nonlinear jamming, improvisation, and live
  performance, and Arrangement View for traditional timeline-based
  composition and editing.

  Session View presents clips in a grid where audio and MIDI clips can
  be triggered freely, layered, and combined in real time. Scenes allow
  launching entire rows of clips simultaneously, making it a powerful
  tool for live performance and DJ sets.

  The Suite edition includes a comprehensive collection of instruments
  (Wavetable, Operator, Analog, Simpler, Sampler, Drift, Meld, Collision,
  Tension, Electric) and audio effects (Echo, Hybrid Reverb, Spectral
  Resonator, Corpus, and more). Max for Live integration opens the door
  to community-built devices and custom MIDI/audio tools.

  Audio warping with multiple warp modes (Beats, Tones, Texture, Re-Pitch,
  Complex, Complex Pro) enables real-time time-stretching and tempo
  matching. Comping, linked-track editing, and flexible audio routing
  support professional production workflows.

  Push integration provides hands-on control with deep DAW integration.
  Extensive MIDI mapping, OSC support, and hardware controller templates
  make Live adaptable to virtually any performance or production setup.
specs: |-
  - Dual view: Session View + Arrangement View
  - Unlimited audio and MIDI tracks (Suite)
  - Audio warping with 6 warp modes
  - Comping and take lanes
  - Linked-track editing
  - Max for Live integration (Suite)
  - 17+ software instruments (Suite)
  - 60+ audio and MIDI effects (Suite)
  - 5000+ sounds and 70+ GB library (Suite)
  - Group tracks with nested groups
  - Flexible audio and MIDI routing
  - Return tracks and sends
  - VST2, VST3, AU plugin support
  - ReWire support
  - MIDI mapping and key mapping
  - Push hardware integration
  - 64-bit summing engine
  - Up to 32-bit / 192 kHz audio
  - ASIO, Core Audio, WASAPI driver support
