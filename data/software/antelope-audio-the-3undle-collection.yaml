details: |-
  The Bundle Collection groups three Antelope Audio Synergy Core FX bundles — Swiss Console EQ, Classic American EQ and Vocal FX — into a single package of ten analog-modeled effects covering equalizers, microphone preamps and a vintage compressor.

  The Swiss Console EQ Bundle emulates classic Swiss recording desks prized for their transparent yet gently colored sound, and includes VEQ-STU 169, VEQ-STU 089 and VEQ-STU 900.

  The Classic American EQ Bundle delivers the distinctive coloration of a well-known 1960s American EQ series with three complementary equalizers — VEQ-55A, VEQ-55B and VEQ-56 — designed to work in synergy.

  The Vocal FX Bundle is built around the human voice, pairing a subtle vintage compressor and two classic mic preamps with a timeless equalizer: BAE 1073MP (Mic Preamp), BAE 10DCF (Compressor), BAE-1073 (EQ) and RD47 (Tube Mic Preamp).

  All bundled effects run in real time on Antelope Audio Synergy Core audio interfaces and can be used in any DAW via afx2daw, distributed in standard plugin formats on macOS and Windows.
specs: |-
  - Three Synergy Core FX bundles combined: Swiss Console EQ, Classic American EQ, Vocal FX
  - Ten analog-modeled effects in total
  - Runs in real time on Antelope Synergy Core interfaces
  - Includes afx2daw for DAW integration
  - Swiss Console EQ Bundle: VEQ-STU 169, VEQ-STU 089, VEQ-STU 900
  - Classic American EQ Bundle: VEQ-55A, VEQ-55B, VEQ-56
  - Vocal FX Bundle: BAE 1073MP (Mic Preamp), BAE 10DCF (Compressor), BAE-1073 (EQ), RD47 (Tube Mic Preamp)
