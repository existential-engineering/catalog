details: |-
  Valhalla Freq Echo is a free plugin combining a Bode-Style Frequency Shifter with an Analog Echo Emulation to create a wide range of surprising sonic effects.

  The plugin is capable of producing subtle chorusing and double tracking effects at conservative settings, making it useful for everyday mixing tasks.

  At more extreme settings, Freq Echo generates barberpole phasing and flanging, endless glissandos, and runaway echoes that are perfect for sound design and experimental music production.

  Freq Echo is ideal for dub, psychedelic, and sci-fi sound design applications, offering creative delay and modulation effects in a simple interface.
specs: |-
  - Bode-Style Frequency Shifter
