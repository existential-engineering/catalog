  to an iOS device running Audreio iOS.
details: |-
  The Audreio plug-in is designed to stream high quality audio (32-bit over
  cable, 16-bit over Wifi) from one computer to another computer or to an iOS
  device running Audreio iOS.

  If you're streaming audio between projects/devices set to different sample
  rates, audreio will automatically convert the audio to match the receiver's
  sample rate and channel count.

  The audreio plug-in can be downloaded in the AU format (for apple os x hosts
  such as logic, live, studio one, and digital performer) or vst3 64-bit (for
  apple os x or microsoft windows hosts such as cubase, studio one, fl studio,
  and sonar).

  Stream full-bandwidth audio between computers over a local network. Broad
  compatibility (any os x or windows host that supports AU or vst3). Connect
  your devices wirelessly, via a lightning cable, or via Ethernet.
  Straight-forward and easy-to-use. No web server or complicated set-up to deal
  with.

  Works with audreio's ios app (sold separately) for streaming between desktop
  daws and ios devices.
specs: |-
  - 32-bit audio over cable
  - 16-bit audio over Wifi
  - Automatic sample rate conversion
  - Automatic channel count conversion
  - AU format support
  - VST3 64-bit support
  - Wireless connectivity
  - Lightning cable connectivity
  - Ethernet connectivity
  - MIDI to iaa synth support
  - Audio streaming between computers
  - Audio streaming to iOS devices
