details: |-
  The next generation of the 999 rhythmic MIDI arpeggiator, with improved "ply" and "speed" features.

  999gen2 vsti creates no sound but triggers other vstis that opened in the d.a.w.

  It can generate 999 seeded arpeggios which driven by chords.

  You can set a unique speed, note's length octave range and diversity (ply) to each arpeggio.

  You can also switch between arpeggios with your MIDI keyboard and randomize arpeggios in live sessions.

  The arpeggios are always synced to the d.a.w's bpm and denominator, so you'll always get automatic positioned results.
specs: |-
  - Rhythmic MIDI arpeggiator
  - 999 seeded arpeggios
  - Chord-driven
  - Adjustable speed
  - Note length control
  - Octave range control
  - Diversity (ply) control
  - MIDI keyboard switching
  - Arpeggio randomization
  - DAW bpm sync
  - DAW denominator sync
  - VST plugin
  - Virtual instrument
