description: Seventh Heaven Professional is dedicated to the reproduction of the
  most sought after hardware reverberation tool of a generation - the Bricasti
  M7.
details: |-
  Exhaustively and meticulously sampled, Seventh Heaven Professional is the most comprehensive and realistic simulation of the Bricasti M7 available. For years the Bricasti M7 eluded all attempts to capture and reproduce the subtle beauty of this legendary hardware, and many in the industry considered it impossible.

  Fusion-IR is a unique modulated convolution-based capture and reproduction technology developed specifically around the needs of M7. It redefines the rules of acoustic and workflow possibilities for convolution based reverberation processors. Now used around the world, from the smallest mountain-top backpack studios to the biggest post production facilities in London and Los Angeles, Seventh Heaven Professional is the definitive way to experience the power and beauty of M7 reverbs natively within your DAW in up to 9.1.6 Atmos.

  Seventh Heaven Professional includes every preset from the Bricasti M7. This includes all v1 and v2 firmware revision presets, including the special nonlinear reverbs and even additional interiors presets not available in hardware. It took many months of fully automated capture to produce the thousands of Fusion-IRs needed for Seventh Heaven Professional. The early reflections, low frequency reverb, and late reverb were captured individually for the ultimate in control and acoustic realism.

  Treat Seventh Heaven Professional like any algorithmic reverb and forget what you have heard about the lifeless sound of convolution. It has the flexibility of algorithmic reverbs allowing you to perfect the acoustics of a space just as can be done on an M7, and retains the organic, lively vibe thought to be impossible to capture. The stereo captures can even be used in surround workflows, where LiquidSonics' advanced impulse response decorrelation technology ensures excellent fold-down compatibility.

  Every preset's decay can be set across the M7's full decay time range, from 200 milliseconds right up to 30 seconds. Pre-delay and multi-voice delay can be modified as freely as within the hardware itself, with the added ability to sync both to DAW tempo. Each modulated early reflection pattern has been captured and can be freely swapped at will, and the M7's roll-off curves are augmented by a full 5-band parametric equaliser, frequency dependent reverb decay times, and a reverb ducker with optional external trigger.
specs: |-
  - Over 236 multi-sampled Fusion-IR presets
  - All M7 v1 algorithm presets
  - All M7 v2 algorithm presets
  - All M7 non-linear presets
  - All samples recorded digitally at 96 kHz using AES-EBU with LiquidSonics' proprietary impulse response capture technology
  - Samples provided in a proprietary true-stereo multi-sampled Fusion-IR format
  - Precise decay time control: minimum 200 ms, maximum 30 seconds
  - High quality interpolation between sampled positions
  - Low, early and late reverb level control (early / late from -20 dB to 0 dB, VLF from -20 dB to 0 dB or off)
  - Flexible roll-off frequency control: early reflections 80 Hz to 22 kHz, late reverb 80 Hz to 22 kHz
  - 32 selectable distinct early reflection patterns
  - Pre-delay: 0 to 500 ms, optionally sync to host tempo
  - Delay: 100 ms to 1 second, level from -20 dB to 0 dB (or off), optionally sync to host tempo
  - Multi-band decay time: multipliers from 0.2x to 4x, low 80 Hz to 4.8 kHz, high 200 Hz to 16 kHz
  - Mix and gain level control
  - Ducker with optional external trigger
  - 5-band oversampled master equaliser (high pass 12 dB/oct, low shelf or bell, mid bell, high shelf or bell, Massberg high cut 12 dB/oct)
  - High quality discrete-point metering: input, output and reverb VLF / early / late levels (-60 to +6 dB)
  - Channel formats: mono, stereo, 5.0 to 5.1.4, 7.0 to 7.1.6, 9.0.4 to 9.1.6
  - Low CPU mode (4096 sample delay, approx 50% CPU saving)
  - Store preset data files on an alternative disk
  - Requires iLok 2/3, iLok machine activation or iLok Cloud
  - Windows 7 and above
  - OS X / macOS 10.13 and above
  - VST 2.4, VST3, Audio Unit (AUv2) and AAX Native plug-in formats
  - 64-bit DAWs
  - 10 GB hard disk space recommended (3 GB minimum)
  - At least 8 GB of main memory recommended
  - A dual core i5 processor or above recommended
  - Apple Silicon and Intel Macs supported
