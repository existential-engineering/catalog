description: Seventh Heaven Professional is dedicated to the reproduction of the most sought after hardware reverberation tool of a generation - the Bricasti M7.
details: |-
  Seventh Heaven Professional is a professional reverb plugin by LiquidSonics that simulates the Bricasti M7 hardware reverb unit, marketed as the most comprehensive and realistic simulation of the M7 available. The plugin utilizes proprietary Fusion-IR technology — a unique modulated convolution-based capture and reproduction technology developed specifically around the needs of the M7 — to faithfully recreate the subtle acoustic characteristics of the hardware that were previously considered impossible to capture.

  The preset library contains over 236 multi-sampled presets organized into categories: Ambience, Chambers, Halls, Plates, Rooms, and Spaces. This includes all M7 v1 algorithm presets (148 presets), all M7 v2 algorithm presets (70 presets), and M7 non-linear reverb and interior room presets (18 additional presets). All samples were recorded digitally at 96 kHz using AES-EBU technology in a months-long fully automated capture process.

  The plugin offers precise decay time control from 200 ms to 30 seconds, 32 selectable early reflection patterns, pre-delay from 0–500 ms with optional host tempo sync, multi-voice delay from 100 ms to 1 second, and multi-band decay time multipliers (0.2x–4x) for low and high frequencies. A 5-band oversampled master equalizer and frequency-dependent decay time modification allow detailed tonal shaping.

  Seventh Heaven Professional supports an extensive range of channel formats including stereo, 5.0–5.1.4, 7.0–7.1.6, and up to 9.1.6 Atmos configurations, making it suitable for immersive audio production. A ducking feature with external trigger support helps maintain clarity in dense mixes.
specs: |-
  - 236+ multi-sampled Fusion-IR presets (Ambience, Chambers, Halls, Plates, Rooms, Spaces)
  - All M7 v1 algorithm presets (148) and v2 algorithm presets (70)
  - M7 non-linear reverb and interior room presets (18)
  - Samples recorded at 96 kHz via AES-EBU digital capture
  - Decay time control: 200 ms – 30 seconds
  - 32 selectable early reflection patterns
  - Pre-delay: 0–500 ms with optional tempo sync
  - Multi-voice delay: 100 ms – 1 second with optional tempo sync
  - Multi-band decay time multipliers: 0.2x–4x (low and high frequencies)
  - 5-band oversampled master equalizer
  - Ducking with external trigger (sidechain) support
  - Channel formats: mono, stereo, 5.0–5.1.4, 7.0–7.1.6, 9.0.4–9.1.6 (up to Atmos 9.1.6)
  - Plugin formats: VST 2.4, VST3, AUv2, AAX Native
  - 64-bit universal binaries for Apple Silicon (M1–M4) and Intel x64
  - OS: Windows 7+, macOS 10.13+
  - Recommended: dual-core i5+, 8 GB RAM, 10 GB disk space (3 GB minimum)
  - iLok 2/3 dongle, machine activation, or iLok Cloud required
