details: >-
  "analog bliss" for u-he diva is a preset collection released in celebration of
  the 100th soundset by vintage synth pads.


  The creators worked with many original classic hardware synths over the years
  and recorded sampling for the very first fully sampled recording now displayed
  in the smithsonian museum.


  For "analog bliss" for u-he diva, the team brought their years of working with
  classic hardware to diva.


  "analog bliss" includes 95 presets organized into categories: pads, arps,
  atmospheres, keys, bass, leads, percussion, and fx.
