description: These applications act as MIDI-CI Initiator / Responder. You can
  use them together, or with other MIDI-CI software or hardware.
details: |-
  The Bome MIDI-CI Tools are two desktop applications aimed at MIDI 2.0 and MIDI-CI developers: Bome MIDI-CI Initiator and Bome MIDI-CI Responder. One takes the initiator role and one the responder role of MIDI Capability Inquiry, so the pair can be run against each other on a single machine, or either one can be pointed at third-party MIDI-CI software or hardware that implements the other half of the conversation.

  Discovery is the first of the three areas the tools cover. The Responder answers a discovery request with information the user can edit, which is how a developer makes it stand in for a device under test, and the Initiator handles discovery of more than one device at a time rather than assuming a single responder on the port. A dedicated button sends a Discovery message on demand, and another invalidates the current MUID and generates a new one, which exercises the reconnection path without restarting anything.

  Profiles are modelled on the Responder side, where arbitrary profiles can be added by ID and then enabled or disabled either for a whole port or for one specific channel, with the remote side notified of the change as the specification requires. Profile sets are saved to .json files, and the Responder can load them back, so a device's profile configuration can be kept as a fixture and reused across sessions.

  Property Exchange is implemented in part. The Responder holds arbitrary static resources authored and edited as JSON, and those resources save and load the same way profiles do, so a developer can serve a made-up property set to an initiator under test. The page states plainly that not all Property Exchange features are implemented, which the 0.6.0 version number matches.

  For plumbing, MIDI in and out ports are selected in the application, and the Responder creates a virtual MIDI port pair of its own while still being able to connect to other MIDI ports on the system. Responses to Discovery, Profile Inquiry and PE Inquiry can each be switched off independently in the Responder to see how an initiator copes, and a log window optionally shows the raw MIDI messages in hexadecimal. Settings cover sys-ex size, the number of Property Exchange streams, PE cache time, and a dark or light interface. Version 0.6.0 is offered as separate Initiator and Responder downloads for macOS, Windows, Linux x86-64 and Raspberry Pi OS, and the page states that the tools are free.
specs: |-
  - Two separate applications: Bome MIDI-CI Initiator and Bome MIDI-CI Responder
  - Responder responds with editable discovery info
  - Initiator supports discovery of multiple devices
  - In Responder, add arbitrary profiles (by ID)
  - Enable/disable profile on port or on a specific channel, with the remote side notified
  - Save and (in Responder) load profiles to/from .json files
  - Property Exchange: in Responder, add and edit arbitrary static resources in JSON format (not all PE features implemented)
  - Save and (in Responder) load Property Exchange resources
  - Button for invalidate MUID and new MUID
  - Button for sending a Discovery message
  - Select MIDI in/out ports
  - Responder creates a virtual MIDI port pair, and can also connect to other MIDI ports
  - In Responder, enable/disable response to Discovery, Profile Inquiry and PE Inquiry
  - Log window with option to show hexadecimal MIDI messages
  - Configurable sys-ex size
  - Configurable number of PE streams
  - Configurable PE cache time
  - Dark/light mode
  - Builds for macOS, Windows, Linux (x86-64) and Raspberry Pi OS
