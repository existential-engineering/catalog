details: |-
  The Bome MIDI-CI Tools are two applications for MIDI 2.0 / MIDI-CI developers: Bome MIDI-CI Initiator and Bome MIDI-CI Responder.

  These applications act as MIDI-CI Initiator / Responder. You can use them together, or with other MIDI-CI software or hardware.

  The tools are free.

  Version 0.6.0 is offered as a separate Initiator download and Responder download for each supported platform: macOS (.dmg), Windows (.exe), Linux x86-64 (.zip) and Raspberry Pi OS (.zip).
specs: |-
  - Discovery: Responder responds with editable discovery info
  - Discovery: Initiator supports discovery of multiple devices
  - Profiles: in Responder, add arbitrary profiles (by ID)
  - Profiles: enable/disable profile on port or on a specific channel (remote side will be notified)
  - Profiles: save and (in Responder) load profiles to/from .json files
  - Property Exchange (not all features implemented): in Responder, add and edit arbitrary (static) resources in JSON format
  - Property Exchange: save and (in Responder) load resources
  - Misc: button for invalidate MUID + new MUID
  - Misc: button for sending a Discovery message
  - Misc: select MIDI in/out ports
  - Misc: Responder creates a virtual MIDI port pair, but can also connect to other MIDI ports
  - Misc: in Responder, you can enable/disable response to Discovery, Profile Inquiry and PE Inquiry
  - Misc: log window with option to show hexadecimal MIDI messages
  - Settings: sys-ex size
  - Settings: number of PE streams
  - Settings: PE cache time
  - Settings: dark/light mode
