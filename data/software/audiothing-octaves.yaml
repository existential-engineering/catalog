description: Octaves is a filter plugin featuring Hainbach's passive bandpass
  filter, splitting audio into octave bands for rich, retro-inspired spectral
  sound design.
details: |-
  Octaves is AudioThing's latest collaboration with Berlin-based composer and YouTuber Hainbach. It is a filter plugin designed to take apart the audio spectrum in spreads of octaves, allowing for unique and enchanting spectral sound design effects. Octaves gives you a retro-scientific approach to sound that echoes the timeless productions created in the BBC Radiophonic workshop or the WDR Studio fur Elektronische Musik by the Avantgarde masters, and modern places like Willem Twee, Strom, and Hainbach's own laboratory.

  Passive bandpass filters are designed to listen and especially look at, when connected to an oscilloscope, specific parts of an audio spectrum for signal analysis in broadcast, research and radio communication. They are commonly designed to work in octaves (Oktavesieb) or thirds (Terzsieb), and you switch between these frequencies in steps. As they use no electricity, all the filtering is realized by massive metal coils wound for each frequency band, which makes even the smallest examples heavy: the portable Bruel & Kjaer 1613 modeled for Octaves clocks in at 2kg, while laboratory versions go up to 29kg.

  The Bruel & Kjaer 1613 Octave Bandpass modeled here was meant for portable use on a 2203/2204 sound level meter. That combination of microphone, amplifier, and filter allowed on-site measurements, and inventive recordists realized excellent classical recordings could be made with two of these meters, which probably pushed Bruel & Kjaer into recording mics and later a pro-audio division as DPA.

  The plugin is faithful to the original yet goes beyond it, with input, output, mix, and soft sat controls that let you overdrive the filter. The pops and clicks an unserviced 1613 makes when switching bands became a usable effect: set artifacts to high and you can ping the filter by switching frequencies, turning Octaves into a small drum machine when the switch is modulated or automated. Opening the back panel exposes impedance, which acts as a resonance control, and the dials next to each frequency band open up that band's volume regardless of knob position, turning Octaves into a full filter bank. Oversampling is adjustable up to 16x.

  Suggested uses include creative filtering of rich sources such as saw waves, distorted guitar, noise, piano or cymbals. Others are pinging with a source of short pulses to make a drum machine, sound design for radio voices, hissing textures or dark drones, tight-band mixing to create space while keeping a sound's core, and feedback patching on an aux fed back into itself. Octaves is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP), and on the App Store for iPhone and iPad as an AUv3 plugin and Standalone (IAA).
