details: |-
  Aviram Arabic Strings is a Kontakt-based soundware instrument featuring 11085
  sounds designed for arabic and oriental string music production.

  The instrument includes multiple articulation techniques: legato, spiccato,
  staccato, pizzicato, glissando, portamento, tremolo, trill, and vibrato, with
  keyswitch controls for articulation selection.

  Created by aviram dayan (aka dreamelodic), with ksp scripting, graphic design,
  video animation, and full recording, MIDI arrangement, and mixing/mastering by
  the same author.

  Current version is v5.0 (not released yet) for kontakt 5.5.6, with v2.0
  available for kontakt 5.5.2 and up, supporting both windows and mac systems.

  The product includes layered string arrangements with various tempos and
  musical scales, featuring preset combinations such as sultan legato, spiccato
  with pizzicato modifications, and glissando variations.
