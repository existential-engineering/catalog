description: A contemporary digital recreation of a vintage 1990s analog guitar preamp widely utilized in professional recording studios. Beyond guitar processing, it enhances electric piano, organ, synthesizer, bass, drums, percussion, vocals, and sound effects.
details:
  - PSA1000 Jr is a contemporary digital recreation of a vintage 1990s analog guitar preamp that was widely utilized in professional recording studios worldwide. The plugin captures the warmth and character of the original hardware unit with meticulous attention to its analog saturation qualities.
  - While designed around a guitar preamp circuit, PSA1000 Jr excels across a wide range of source material. It is equally effective on electric piano, organ, synthesizer, and bass, bringing a cohesive analog warmth to any instrument track.
  - At the mixing stage, PSA1000 Jr shines on drums, percussion, vocals, and sound effects, adding the subtle harmonic saturation and tonal character that helps elements sit naturally in a mix. The plugin's dry/wet mix control on both channels allows precise blending of the saturated and clean signals.
  - The plugin features a phase reverse switch that leverages the analog phase characteristics of the original circuit, along with input and output level controls for flexible gain staging. It has been praised by Grammy-nominated producers Greg Wells and Tchad Blake for its versatility and superior tonal characteristics.
  - PSA1000 Jr is available for macOS (10.13 or newer) and Windows (7 or newer), supporting both Apple Silicon and Intel CPUs. It is also available as an iOS app for iPhone and iPad via the Apple App Store.
