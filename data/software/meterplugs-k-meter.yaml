description: "Fully-compliant K-System metering plugin for professional mixing
  and mastering. Supports all three K-System scales (K-12, K-14, K-20) along
  with ITU BS.1770 stereo loudness metering, true-peak metering with up to 4x
  upsampling, and AES-17 RMS metering. Includes pink noise generation for
  monitor calibration."
details: |-
  K-System support with three scales (K-12, K-14, K-20)
  ITU BS.1770 stereo loudness metering
  True-peak metering with up to 4x upsampling
  AES-17 RMS metering
  Pink noise generation for monitor calibration
  Numeric average and peak displays
  Clip indicators
  Peak hold/release functionality
  Collapsible interface
specs: |-
  - mac: macOS 10.7 or later (64-bit Intel or Apple Silicon)
  - windows: Windows XP SP3 or later (32/64-bit)
