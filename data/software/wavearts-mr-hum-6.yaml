description: MR Hum 6 is a precise hum and buzz removal plugin combining hum removal, buzz removal, brickwall filtering, and high-resolution spectrum analysis for cleaning recordings with electrical interference.
details: |-
  MR Hum 6 removes electrical hum and buzz from recordings using up to ten harmonic notch filters. The fundamental frequency is adjustable from 20 to 200 Hz to target any hum source, and notch widths are variable to match the characteristics of the interference.

  A separate Buzz removal processor addresses irregular or broadband buzz that harmonic filtering alone may not resolve. Brickwall filtering removes subsonic rumble and high-frequency hiss at the signal extremes, providing a complete interference-cleaning toolset in a single plugin.

  A high-resolution spectrum analyzer displays the signal before and after processing simultaneously, making it straightforward to verify that hum artifacts have been attenuated without affecting the wanted audio. A Monitor function lets users listen to the removed signal in isolation to confirm the plugin is targeting only the unwanted components.

  MR Hum 6 operates with zero latency, making it suitable for live applications as well as post-production. It supports sample rates up to 192 kHz and processes both mono and stereo audio.

  On macOS, formats available are AU, VST3, and AAX. On Windows, VST2, VST3, and AAX are provided. Apple Silicon is natively supported on macOS 10.13 (High Sierra) and higher. Windows 7/8/10/11 are supported with both 32-bit and 64-bit hosts.
specs: |-
  - Hum removal with 1–10 harmonic notch filters
  - Adjustable fundamental frequency: 20–200 Hz
  - Variable notch widths
  - Dedicated buzz removal processor
  - Brickwall filtering for rumble and hiss
  - High-resolution spectrum analyzer (pre/post processing display)
  - Monitor mode to isolate and audition removed signal
  - Zero latency operation
  - Supports up to 192 kHz sample rates
  - Mono and stereo processing
  - macOS: AU, VST3, AAX; requires 10.13+; Apple Silicon native; 64-bit hosts only
  - Windows: VST2, VST3, AAX; supports Windows 7/8/10/11; 32-bit and 64-bit hosts
