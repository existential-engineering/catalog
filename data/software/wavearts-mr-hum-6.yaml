description: "Combines hum removal, buzz removal, brickwall filtering, and high
  resolution spectrum analysis into one plug-in for cleaning up recordings with
  hum or buzz contamination."
details: |-
  Hum removal using 1 to 10 harmonic notch filters. Buzz removal. Hum and buzz frequencies adjustable from 20 to 200 Hz. Adjustable notch widths. Brickwall filtering for rumble and hiss removal. High resolution spectrum analysis display (pre or post processing). Monitor feature to hear removed signal. No latency. Up to 192 kHz sampling rate. Mono or stereo.
specs: |-
  Mac: AU, VST3, AAX. macOS 10.13+, Apple Silicon native, 64-bit only. Windows: VST2, VST3, AAX. Windows 7/8/10/11, 32-bit and 64-bit. iLok supported but not required.
