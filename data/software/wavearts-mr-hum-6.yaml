description: MR Hum combines hum removal, buzz removal, brickwall filtering, and spectrum analysis into one plug-in for cleaning up recordings carrying any sort of hum or buzz.
details: |-
  MR Hum combines hum removal, buzz removal, brickwall filtering, and spectrum analysis into one plug-in for cleaning up recordings carrying any sort of hum or buzz.

  The hum removal section works by applying a set of notch filters spaced at multiples of the fundamental hum frequency, usually 60 Hz or 50 Hz. The controls set the fundamental frequency, the number of harmonics to eliminate (up to 10), and the width of the notches, and there are presets for the usual cases of 60 Hz and 50 Hz hum. Any fundamental frequency from 20 to 200 Hz can be dialled in continuously, which matters when hum recorded on analog tape is played back on a different machine and the hum frequency shifts.

  The high resolution spectrum display makes the hum frequency and the number of harmonics required easy to see. It can run before processing, to show the input signal spectrum, or after processing, to show the output signal spectrum. The monitor feature plays back the signal being removed, offering another way to set the parameters.

  MR Hum contains a separate processor for buzz, a periodic signal with frequency harmonics through the entire audible spectrum that would otherwise require hundreds of notch filters to eliminate. The buzz algorithm uses a different and far more efficient approach, and because buzz can come from a motor or other interference as well as from the line frequency, the buzz processor also allows any frequency from 20 to 200 Hz. MR Hum also provides brickwall filters to eliminate low or high frequency interference.

  MR Hum 6 is included in Master Restoration Suite 6.
specs: |-
  - Hum removal using from 1 to 10 harmonic notch filters
  - Buzz removal
  - Hum and Buzz frequencies continuously adjustable from 20 to 200 Hz
  - Adjustable notch widths
  - Brickwall filtering for rumble and hiss removal
  - High resolution spectrum analysis display, pre or post processing
  - All sections can be monitored to hear removed signal
  - No latency
  - Up to 192 kHz sampling rate
  - Mono or stereo
  - Requires a host program that supports audio plug-ins
  - iLok licensing is supported but not required
  - Macintosh formats: AU, VST3, AAX
  - macOS 10.13 (High Sierra) and higher
  - Apple Silicon natively supported (AU, VST3, AAX)
  - AAX on macOS requires Pro Tools 11 and higher
  - macOS: 64-bit hosts only
  - Windows formats: VST2, VST3, AAX
  - Windows 7/8/10/11
  - AAX on Windows requires Pro Tools 10.3.5 and higher
  - Windows: 32-bit and 64-bit hosts supported
