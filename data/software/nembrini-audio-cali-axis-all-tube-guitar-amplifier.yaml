description: Nembrini Audio Cali Axis All Tube Guitar Amplifier plugin is based
  on the Mesa Boogie TriAxis preamplifier, an arsenal of powerful guitar tones
  in plugin format.
details: |-
  Nembrini Audio Cali Axis All Tube Guitar Amplifier plugin is based on Mesa Boogie TriAxis* preamplifier. Eight separate modes deliver the elusive creamy gain of the Mk I, the heralded focus of the Mk I, the scooped Rhythm of the Mk IV, and a modified British lead mode. But these are just a few of the classic sounds at your fingertips.

  The FX section lets you select, enable and change the order of the single FXs. The power amplifier is powered by four EL34 virtual tubes with presence, resonance, volume and power switch in class AB push-pull configuration, and a MODERN button changes the negative feedback in a way to have a more "modern" presence behaviour.

  Effects include a digital delay with a FILTER to make the delay Lo-Fi and OFFSET to create a time offset in the left/right delay sections, analog modulations with a choice of Chorus or Tremolo, an ambient Hall reverb algorithm, filters A/B with TIGHT (clockwise rotation reduces low frequency content tightening the low range, suitable for 7/8 string guitars), RUMBLING (clockwise rotation reduces low frequency content) and HARSH (clockwise rotation reduces high frequency content), an analog noise gate tuned for guitar and bass with GATE speed control, and a studio compressor to keep your dynamics in check, whether just thickening the sound or keeping levels consistent.

  Nembrini Audio Cali Axis All Tube Guitar Amplifier features six different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs. The Impulse Loader lets you load up to three third-party impulse responses that you can even blend together using volume, pan, phase, solo and mute controls. Free impulse responses are included, with presets and sound samples by www.choptones.com.

  Legal Disclaimer: TriAxis is a registered trademark of Mesa Engineering. Nembrini Audio Cali Axis was developed by Nembrini Audio SRL based on its own modelling techniques. Mesa Engineering has not endorsed nor sponsored the Nembrini Audio Cali Axis in any manner, nor licensed any intellectual property for use in this product.
specs: |-
  - Based on the Mesa Boogie TriAxis preamplifier
  - Eight separate preamp modes
  - Power amplifier with four EL34 virtual tubes in class AB push-pull, with presence, resonance, volume and power switch
  - MODERN button changes the negative feedback for a more modern presence behaviour
  - Reorderable FX section
  - Digital delay with Lo-Fi FILTER and left/right OFFSET
  - Analog modulation with Chorus or Tremolo
  - Hall reverb algorithm
  - Filters A/B: Tight, Rumbling, Harsh
  - Analog noise gate tuned for guitar and bass with GATE speed control
  - Studio compressor
  - Six guitar cabinets with four microphone emulations, on/off axis switch, position and distance knobs
  - Impulse response loader for up to three third-party IRs with volume, pan, phase, solo and mute
  - Free impulse responses, presets and sound samples by choptones.com
  - Requires a VST2, VST3, AAX or AudioUnits compatible host
  - iOS version for iPhone and iPad
  - Intel compatible or Apple Silicon CPU, 1GB RAM
  - Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
