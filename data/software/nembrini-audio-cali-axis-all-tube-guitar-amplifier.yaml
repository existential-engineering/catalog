details: |-
  Nembrini Audio Cali Axis All Tube Guitar Amplifier plugin is based on Mesa Boogie TriAxis* preamplifier. Eight separate modes deliver the elusive creamy gain of the Mk I, the heralded focus of the Mk I, the scooped Rhythm of the Mk IV, and a modified British lead mode. But these are just a few of the classic sounds at your fingertips. Select, enable and change the order of the single FXs.
