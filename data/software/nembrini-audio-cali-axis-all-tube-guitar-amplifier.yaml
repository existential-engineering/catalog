description: Cali Axis is a plugin modeled after the Mesa Boogie TriAxis preamplifier, delivering an arsenal of powerful guitar tones in plugin format. It features eight distinct amp modes, a full effects chain, six cabinet models, four microphone emulations, and an impulse response loader.
details:
  - Cali Axis is a comprehensive guitar amplifier plugin meticulously modeled after the legendary Mesa Boogie TriAxis preamplifier. It offers eight separate amp modes spanning clean to high-gain voicings, including creamy gain characteristics, focused midrange, scooped rhythm voicing, and modified British lead modes. The power amplifier section features four virtual EL34 tubes in a class AB push-pull configuration with presence, resonance, volume, and power switch controls, plus a Modern button for modified negative feedback behavior.
  - The plugin includes a fully featured effects chain with selectable, orderable individual processors. Available effects include a digital delay with Lo-Fi filter and time offset, analog modulation (switchable between chorus and tremolo), an ambient hall reverb algorithm, an A/B filter with tight, rumbling, and harsh characteristics, an analog noise gate optimized for guitar and bass, and a studio compressor for dynamic control.
  - The cabinet and microphone section provides six guitar cabinet models with four microphone emulations featuring on/off-axis positioning and continuous position and distance controls. An impulse response loader supports up to three third-party IRs with blending capabilities, and free impulse responses from Choptones are included with the plugin.
  - System requirements include Mac OS 10.13 or newer or Windows 7 or newer, an Intel-compatible or Apple Silicon CPU, a minimum of 1GB RAM, and a 64-bit DAW. The plugin is available in AU, VST2, VST3, and AAX formats. A companion iOS app is also available for iPhone and iPad via the Apple App Store.
