description: Marshall Plexi Super Lead 1959 is an amp sim plugin that gives you
  the pro guitar tones of the rock legends. A faithful emulation of Marshall's
  own reference Plexi Super Lead 1959 amplifier. This iconic guitar plugin has
  mic placements and cabinet recorded by Tony Platt.
details: |-
  There is perhaps no other amplifier more vital to the history of rock & roll than the Marshall Plexi Super Lead 1959. Softube took Marshall's own museum-piece Plexi (a pristine model from 1967) under extremely careful security and supervision, and modeled each and every component to produce the most textured, detailed software version imaginable. At any setting it responds exactly like the hardware, and it's sensitive to your playing style like you wouldn't believe.

  A faithful emulation of Marshall's own reference Plexi Super Lead 1959 amplifier from their museum, built in 1967, combined with an era-correct 1960BHW speaker cabinet recorded by famous engineer/producer Tony Platt.

  Microphone selections and placements by Tony Platt, captured in famous Kore Studios, London. Three different microphone combination setups are available, FET, Valve, and Dynamic, with three separate mics per setting, two close and one room.

  It works both as a native plug-in and as a module for Amp Room, the pro audio guitar and bass platform.
specs: |-
  - A faithful emulation of Marshall's own reference Plexi Super Lead 1959 amplifier from their museum, built in 1967
  - An era-correct 1960BHW speaker cabinet recorded by engineer/producer Tony Platt
  - Both a native plug-in and a module for Amp Room, the pro audio guitar and bass platform
  - Microphone selections and placements by Tony Platt, captured in Kore Studios, London
  - Over 50 finely tuned presets designed by AC/DC engineer Tony Platt
  - Three different microphone combination setups available, FET, Valve, and Dynamic
  - Three separate mics per setting, two close and one room
  - Channel Strip includes pans, volume faders, and solo for each mic, plus a two band Main Out EQ
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Softube account and iLok account required (no physical iLok required)
  - Three activations
  - 20-day trial, 14-day returns
