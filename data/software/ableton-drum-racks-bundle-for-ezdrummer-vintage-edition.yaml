  - 24 ableton drum racks for vintage rock ezx
  - 22 ableton drum racks for the blues ezx
  - Ableton push controller support
  - Colour coded pad design
  - Individually labelled drum rack pads
  - Mapped ableton macros to ezdrummer macros
  - Single audio output routing (singleout presets with 52 drum racks)
  - Multiple audio channel output routing (multiout presets with 52 drum racks)
  - Multi track audio routing templates
  - Ableton live integration
  - Factory preset mapping
  - Preset automation capabilities
