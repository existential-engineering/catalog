description: Ableton drum racks bundle for toontrack ezdrummer vintage edition –
  modern kit, vintage kit, vintage rock and the blues ableton drum racks.
details: |-
  Ableton drum racks core bundle for ezdrummer is a collection of ezdrummer rock performance drum racks on ableton push featuring over 100 ableton drum racks and over 30 ableton live routing templates configured for leading toontrack ezdrummer2 core libraries and 2 ezx expansion.

  This library contains 4 timbresandtones drum rack products bundled for toontrack ezdrummer modern kit, vintage kit and vintage rock ezx and the blues ezx: ableton drum racks for ezdrummer modern kit with 34 ableton drum racks individually mapped to all modern kit factory library content presets, with 17 predesigned ableton live templates; ableton drum racks for ezdrummer vintage kit with 24 ableton drum racks individually mapped to all vintage kit factory content presets, with 12 predesigned ableton live templates; ableton drum racks for ezdrummer vintage rock ezx with 24 ableton drum racks individually mapped to all vintage rock ezx factory content presets; ableton drum racks for ezdrummer the blues ezx with 22 ableton drum racks individually mapped to all the blues ezx factory content presets.

  Amazing workflow in ableton and on your push to the full capabilities of the kit library saving setup time and allowing you to focus on music creation. Ease of navigation to load all ezdrummer factory presets from ableton push controller device browser. Over 100 ableton drum racks to instantly load the factory library "mix ready" presets with ableton mappings.

  Colour coded pad design for visual performance and finger drumming. Know your toms from your snares from your hi hats. Individually labelled drum rack pads for clear visualisation, post performance editing and automation to all drum rack / instrument articulations. Mapped ableton macros to ezdrummer macros with preset values for ease of use in push and simple to use automation programming.

  Audio routing options: singleout presets featuring 52 ableton drum racks for all factory presets single audio output to single ableton track. Multiout presets featuring 52 ableton drum racks for all presets in multiple audio channel output from the plug in to multiple ableton audio tracks using the multi output ableton template also provided.
specs: |-
  - Over 100 ableton drum racks
