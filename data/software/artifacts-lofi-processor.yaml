details: >-
  Artifacts is an audio effect designed to add lofi vibes to any audio signal.
  Multiple sections allow for a wide variety of lofi effects ranging from noisy
  vintage gear over crackling vinyl players and wobbly tape machines to crunchy
  digital sounds and everything in between.


  Artifacts is divided into 4 main sections: noise section - noise - electrical
  (hum / whine) - crackling - color control - ducking. Drive section - tone -
  gain - 3 drive models. Digital section - bit depth reduction - sampling rate
  reduction - glitch. Tape section - wow - flutter - dropouts (tape wear / bias)
  - stereo control.


  In addition, fluctuations can be introduced to any of the above using the
  liveliness section.


  Artifacts - lofi processor by numerical audio is a virtual effect audio plugin
  and a mobile audio app and a software application for macos and ios.
