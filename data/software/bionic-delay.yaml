description: This enhanced version of the analogic delay gives you separate
  control over the delay times on left and right channel. Suitable for ping
  pong.
details: |-
  This enhanced version of the analogic delay gives you separate control over
  the delay times on left and right channel. Suitable for ping pong delays and
  drifting delays.

  Tape model including tape saturation, wow, flutter, low and high pass
  filtering. Separate control of delay time for left and right channel. The
  delay time is not entered in milliseconds but as a note length (in relation to
  the song tempo in your sequencer).

  The groove parameter allows fine tuning from triplet to dotted note timing.
  "drift" parameter gives you the possibility to create delays wandering to the
  left or to right in the stereo field. Press the "ping pong" button to create
  delays alternating between left and right speaker.

  Parameter "smooth" creates continuous delay time changes like on a real tape
  delay (no digital clicks when changing delay time during the song). MIDI
  learn: each control can be automated via MIDI controllers.

  Bionic delay 2 is a vst3 plug-in specialized in vintage and modern delay
  effects. It combines a straightforward user interface for the main delay
  parameters with a character dial that allows you to easily select the sounds
  of analog or digital delay units in any condition between brand new and
  extreme lo-fi.
specs: |-
  - Tape model with tape saturation
  - Wow and flutter
  - Low and high pass filtering
  - Separate control of delay time for left and right channel
  - Note-based delay times
  - Groove parameter for triplet to dotted note timing
  - Drift parameter for stereo field movement
  - Ping pong mode
  - Smooth parameter for continuous delay time changes
  - MIDI learn capability
  - Synthedit plugin
  - 32-bit
