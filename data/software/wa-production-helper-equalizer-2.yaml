description: An equalizer plugin built around three controls and five selectable EQ shapes. It can process the stereo signal, the mid, the side, the left or the right channel alone, with input and output gain staging either side of the processing.
details: |-
  Helper Equalizer 2 is an equalizer plugin from the Helper series, built around a deliberately small control set. Five selectable EQ shapes cover the filtering, and three knobs cover everything else, so the plugin stays simple to operate without narrowing what it can do.

  The frequency knob sets which frequency the equalizer acts on. The gain knob raises or lowers the level at that point, either to pull muddiness out of a sound or to add air to it. The quality knob adjusts the filter slope. Gain and quality are unavailable in certain filter modules, where the shape itself determines the response.

  Five channel modes decide which part of the incoming signal is processed: stereo, mid, side, left or right. An EQ shape can therefore be aimed at one side of a stereo image, or at the centre of a mix alone, rather than at the whole signal.

  Input and output gain controls allow gain staging before and after the equalizer. Ten factory presets ship with the plugin, and the interface is resizable and described as CPU friendly.
specs: |-
  - Five EQ shapes
  - Five channel modes (stereo, mid, side, left, right)
  - Frequency, gain and quality controls
  - Input and output gain controls for gain staging
  - 10 factory presets
  - Preset manager
  - Resizable interface
  - Responsive and CPU friendly
  - Version 2.0.0 added a new interface, a preset manager, Catalina compatibility and Pro Tools AAX support
  - Version 2.1.0 added a resizable interface, an updated preset manager and updated license management
  - Version 2.2.0 added native Apple Silicon and arm64 support
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
