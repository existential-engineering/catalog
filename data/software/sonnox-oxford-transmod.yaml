description: Oxford TransMod is a transient shaper that increases or reduces the attack of a signal, with Attack, Overshoot and Rise Time controls and real-time visual feedback. It is used on drums, vocals and other instruments in music production, film scoring and sound design.
details: |-
  Oxford TransMod is a transient modulation plugin that shapes the attack of a signal, emphasising or softening it, with real-time visual feedback. It is used on vocals, drums and other instruments in music production, film scoring and sound design.

  With Attack, Overshoot, and Rise Time controls, TransMod gives engineers the ability to shape dynamics in detail. Its advanced algorithms ensure that transient adjustments remain clean, natural, and free from distortion or tonal coloration, preserving the musical integrity of the original signal while solving dynamic challenges.

  TransMod shines when accuracy matters most, whether it is adding definition to instruments, controlling percussive spikes, or balancing dynamic inconsistencies without resorting to heavy EQ or compression. Typical uses include punching up kicks and snares, softening harsh transients from plucked or strummed acoustic instruments, and boosting bass transients for presence and clarity.
specs: |-
  - Attack, Overshoot and Rise Time controls for detailed transient shaping
  - Increases or reduces transient attack without altering overall tone or balance
  - Adaptive transient detection process with real-time visual feedback
  - Formats: Audio Unit (AU), VST3, AAX-Native (Pro Tools 11 or later), AAX-DSP (Pro Tools Ultimate, Pro Tools HD, Avid VENUE)
  - macOS 10.13 High Sierra or later
  - Windows 10 (64-bit) or later
  - iLok authorisation: two simultaneous activations per licence (local machine, iLok2/iLok3 USB device, or iLok Cloud)
  - AAX-DSP instances per chip at 44.1/48 kHz: 15 mono, 14 stereo
  - AAX-DSP instances per chip at 96 kHz: 7 mono, 6 stereo
  - AAX-DSP instances per chip at 192 kHz: 3 mono, 3 stereo
