details: |-
  Greynote Music's ART plugin is an analog synth rompler plugin featuring 28
  original patches. Each patch contains fully multisampled one-shot samples, up
  to 6 seconds per note created using a waldorf pulse 2 synth.

  The sample playback ranges from MIDI note c1 to c8. Art plugin features round
  robin sample playback and noise & sub oscillator sound generators.

  Additional features include lfo, reverb, gain, attack, release and a low-pass
  filter.

  Art is a virtual instrument audio plugin for macos and windows. It functions
  as an audio units plugin and a VST 3 plugin.
specs: |-
  - Analog synth rompler
  - 28 original patches
  - Fully multisampled one-shot samples
  - Up to 6 seconds per note
  - MIDI note range c1-c8
  - Round robin sample playback
  - Noise oscillator
  - Sub oscillator
  - LFO
  - Reverb
  - Gain
  - Attack
  - Release
  - Low-pass filter
  - 7.68gb total size
