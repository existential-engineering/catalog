description: Dynamic triggered pitch envelope effect using a vintage digital
  pitch-shifter design, functioning as a dynamic Whammy pedal with adjustable
  depth, speed, and contour plus chorus, flange, and reverb modes.
details: |-
  Elastic Bender is a dynamic triggered pitch envelope effect using a vintage
  digital pitch-shifter design. The plugin captures audio peaks to initiate
  customizable pitch envelopes, enabling dynamic bends that return to the
  original pitch, functioning similarly to a dynamic Whammy pedal with
  adjustable depth, speed, and contour control.

  Three trigger sources are available: audio peaks, internal LFO, and MIDI
  notes. The plugin features analog-modeled input/output transistor overdrive
  circuitry with selectable bend direction for pitch rise or fall. Peak
  sensitivity adjustment allows fine-tuning the trigger threshold.

  MODE B provides chorus and flange effect generation with 10ms delay stages
  suitable for real-time use. MODE D creates grainy reverb textures with pitch
  shifting using 300ms delay stages with blended wet/dry processing. Feedback
  control enables flanging and self-oscillation effects.

  The plugin supports true stereo processing with mono-to-stereo conversion
  capability. MIDI learning and automation support is available for most
  parameters. Windows supports VST2 and VST3 formats, while Mac currently
  supports AU with VST3 and native Apple Silicon support planned for v2.1.0.
specs: |-
  - Audio peak-triggered pitch envelopes with adjustable depth, speed, and shape
  - Three trigger sources: audio peaks, internal LFO, MIDI notes
  - Analog-modeled input/output transistor overdrive circuitry
  - Selectable bend direction (pitch rise or fall)
  - MODE B: Chorus and flange generation (10ms delay stages)
  - MODE D: Grainy reverb textures with pitch shifting (300ms delay stages)
  - Feedback control for flanging and self-oscillation effects
  - True stereo processing with mono-to-stereo conversion
  - Peak sensitivity adjustment for trigger matching
  - MIDI learning and automation support
