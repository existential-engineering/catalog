description: FabFilter Volcano 3 is an analog-sounding filter plug-in with many
  modulation options. Available in VST, VST3, AU, CLAP, AAX and AudioSuite
  formats for Windows and macOS.
details: |-
  Nothing beats a vintage sounding, gritty and creamy cut-off filter. That is exactly what FabFilter Volcano has been known for since its first release in 2005. Today, Volcano 3 continues to deliver the best in creative filtering with new non-linear filter shapes and a completely redesigned interface that is an absolute delight to work with.

  Volcano 3 features new vintage-sounding EQ-type filter shapes including bell, low/high shelf, notch, and all-pass, along with ultra-flexible filter routing with per-channel and mid/side modes. Each filter has its own drive setting for internal saturation.

  The plug-in includes a fully redesigned, highly simplified interface with easier workflow, an interactive filter display with optional piano display, and various interface sizes including full screen mode.

  With 16-step XLFOs, XY controllers, envelope generators, envelope followers, and MIDI sources, Volcano 3 provides extensive modulation capabilities. The High Quality option enables maximum internal oversampling for pristine audio quality.
specs: |-
  - New vintage-sounding EQ-type filter shapes (bell, low/high shelf, notch, all-pass)
  - Ultra-flexible filter routing with per-channel and mid/side modes
  - Drive setting per filter for internal saturation
  - High Quality option with maximum internal oversampling
  - Level/Pan per filter
  - 6 dB/oct filter slope option
  - 16-step XLFOs, XY controllers, envelope generators, envelope followers, MIDI sources
  - Interactive filter display with optional piano display
  - GPU-powered graphics acceleration
  - MIDI Learn
  - Undo, redo, A/B switch features
  - Sample-accurate automation of all parameters
