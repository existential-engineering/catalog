details: |-
  AudioTexture is based on concatenative synthesis which analyzes automatically
  the sound signal and decomposes it into adaptively defined units (not equal in
  size, so not the usual granular synthesis) for resynthesis.

  It is equipped with semantic descriptors for intuitive control to generate
  many variations from a given sound sample.

  Audiotexture comes with 3 descriptor controls in additional to the position
  control. This is convenient to create various unit sequences based on
  perceptually meaningful descriptors: energy (instantaneous energy), noisiness
  (the amount of high-frequency content), and brightness (the spectral energy
  center, higher the value brighter the sound).

  Audiotexture by le sound is a virtual instrument audio plugin for macos and
  windows. It functions as a VST plugin, an audio units plugin, a VST 3 plugin
  and an AAX plugin.
specs: |-
  - Concatenative synthesis
  - Automatic unit analysis
  - Position control
  - Descriptor control
  - Range control for randomization
  - Multichannel support
  - Energy descriptor
  - Noisiness descriptor
  - Brightness descriptor
  - macOS support
  - Windows support
