details: |-
  Round. Resonant. Mellow. The 1967 Clarinet Paris is a mellow, deep-sampled orchestral clarinet featuring our new, true polyphonic H.A.L (Hyper Acoustic Legato) Technology. Paris is focused on emotional realism and effortless expression as you play. Paris includes a wealth of parts, including 6 different types of legatos, dozens of arcs, sustains, short notes, trills and more. In addition to the usual non-vibrato clarinet style, there are also multiple vibrato styles. The note length can be precisely controlled using our new Time rack module combined with our H.A.L Technology. Paris has a rich, warm, and round tone. With 3 microphone positions (Close, Decca, Wide) and a high attention to detail, you can hear the mellow tone ringing through the room, the small details of air vibrating against the reed, or morph anywhere in-between. Thanks to polyphonic legato with H.A.L, it's like having a clarinet solo and ensemble library in one!
