details: |-
  The Legacy EQ is a plugin that recreates the sound and feel of the classic mpc
  digital equalizer: a versatile and musical EQ that was originally designed as
  an analog circuit with digital control, and later became a digital staple in
  high-end post-production and film studios around the world.

  The legacy eq lets you shape your mix with smooth and precise control: each
  band has a limited and carefully chosen range that matches the original analog
  knob, and the q factor is optimized to give you the best results for each
  frequency.

  With the legacy eq, you can sculpt your mix with flexible and powerful
  parametric eq bands that let you choose the shape that suits your needs.
  Whether you want to boost the lows, cut the highs, notch out a problem
  frequency, or create a filter sweep effect, the legacy eq gives you the tools
  to shape your sound with accuracy and creativity.

  The legacy eq lets you activate and customize each eq band with simple and
  intuitive controls. You can choose the shape of each band from six different
  options, including bell, low/high shelf, low/high cut, notch, and band-pass,
  to fine-tune the frequency response of your mix. You can also adjust the q
  factor of each band, from wide to narrow, to control how much the eq affects
  the surrounding frequencies. And you can boost or cut the gain of each band,
  within a range of -15/15 db, to balance the levels of your tracks.

  The legacy eq's rta analyzers give you a detailed and accurate view of the
  frequencies in your mix. You can see the full resolution of the bass and
  sub-bass spectrum, without any loss of quality or detail. This helps you to
  fine-tune the low end of your tracks, and achieve a balanced and powerful mix.
specs: |-
  - 5 parametric EQ bands
  - 2 filter bands
  - 6 EQ band shapes
  - 4 filter band shapes
  - Bell shape
  - Low/high shelf
  - Low/high cut
  - Notch shape
  - Band-pass shape
  - Wide notch shape
  - Gain range -15/15 dB
  - Adjustable q factor
  - High-precision rta analyzer
  - Pre/post EQ switching
  - Real-time frequency analysis
  - Bass and sub-bass spectrum resolution
