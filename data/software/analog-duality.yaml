details: >-
  New loops presents: analog duality - a multi-sampled analogue synth library
  for native instruments kontakt, consisting of 281 instrument patches created
  from 894 hardware analog synth samples. This kontakt synth library includes 5
  folders of patches including: 40 arps, 34 chords, 26 pads, 85 dry patches, and
  65 wet patches (with effects). There's also 25 multi instruments consisting of
  2 or more patches.


  Each patch has between 15 and 17 analogue multi-samples mapped over at least 6
  octaves. Most patches have the mod wheel and aftertouch (pressure) assigned to
  multiple parameters to give you control and expression while playing. Many of
  the patches use effects including reverb, delay, saturation, phasers, and
  flangers.


  Also included are 6 kontakt instruments made from moog and doepfer oscillator
  multi-samples. There are 6 waveforms including, 2 saws, 2 squares, 1 pulse,
  and 1 triangle. You can use these as default patches for creating your own
  analogue synth sounds.


  Analog duality can be used for many different styles of modern electronic
  music including, film score and cinematic, techno, trance, house, edm, bass
  music, drum and bass, and more.


  Patches are organised in the following categories: multi patches - kontakt
  instruments made from multiple patches to create new and unique sounds. Raw
  oscillators - the raw oscillators folder contains 6 kontakt instruments made
  from moog and doepfer analogue oscillator multi samples. Single patches -
  these are the main patches and form the bulk of the instruments organized into
  4 folders: arpeggios (contains the arps and sequences), chords (minor, major
  etc.), dry patches (main patches with minimal effects), and wet patches
  (effects) (have effects like delay and reverb), and pads (pads and strings
  patches).
specs: >-
  - 281 kontakt instrument patches

  - 894 moog and doepfer analogue multi-samples

  - 85 dry synth patches

  - 65 patches with effects

  - 40 arpeggios and sequences

  - 34 chord patches

  - 26 pads and string patches

  - 25 stacked multi patches

  - 6 moog and doepfer raw oscillator patches

  - 6 waveforms (2 saws, 2 squares, 1 pulse, 1 triangle)

  - 15-17 analogue multi-samples per patch mapped over at least 6 octaves

  - 24-bit/44.1 khz multi-samples

  - Mod wheel and aftertouch (pressure) assigned to multiple parameters

  - Effects including reverb, delay, saturation, phasers, and flangers

  - All patches editable in kontakt

  - 698 mb pack size

  - Requires native instruments kontakt 5.5 or later (full version, not
  compatible with free kontakt player)

  - Compatible with native instruments komplete kontrol and maschine software
