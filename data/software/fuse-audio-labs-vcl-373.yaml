description: A recreation of an early 1960s broadcasting limiter/compressor that eventually found its way into many mastering studios. Designed for the highest demands of German broadcasters, with an all-discrete class-A audio path and highest-grade components and transformers. Faithfully emulates the audio transformers, feedback compression circuitry, and discrete class-A make-up amplifier of the original. The 1963 transistor-based revision — replacing the original diode-bridge gain reduction — is emulated, allowing for less THD and more reliable control voltage tracking.
details: |-
  Emulates an early 1960s German broadcast limiter/compressor (Fuse Audio Labs does not name the specific hardware; the '373' model number, German broadcast context, and discrete class-A all-transformer design are consistent with the Telefunken/TA U373 broadcast compressor lineage). Post-1963 transistor revision emulated (not the original diode-bridge design). Feedback compression topology. All-discrete class-A signal path. Controls added beyond original: continuous drive control, gain compensation, GR metering, dry/wet mix. Universal 2 Binary (Apple Silicon native).
specs: |-
  macOS 10.12+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+ (32-bit and 64-bit), 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX. Copy protection: serial number. 14-day trial available.
