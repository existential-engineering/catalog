description: 6-Tron is an emulation of a modified Roland tr-606. It features
  some of the best and most effective mods available for the tr-606.
details: |-
  The 6-tron is a complete synthesis emulation following the tr-606 schematics
  and service notes. Every sound is fully editable - just like on a modified
  tr-606.

  Tweakable parameters include bassdrum with level, tune, decay, and pitch
  envelope modulation controls.

  Snaredrum features level, tune, decay, and snappy parameters, while both hi
  tom and lo tom offer level, tune, octave up & down switch, and pitch envelope
  modulation.

  Cymbal, open hihat, and closed hihat each provide level, decay, and cutoff
  controls for sound shaping.
specs: |-
  - Complete synthesis emulation
  - Tr-606 schematics and service notes
  - Fully editable sounds
  - Bassdrum: level, tune, decay, pitch envelope modulation
  - Snaredrum: level, tune, decay, snappy
  - Hi tom: level, tune, octave up & down switch, pitch envelope modulation
  - Lo tom: level, tune, octave up & down switch, pitch envelope modulation
  - Cymbal: level, decay, cutoff
  - Open hihat: level, decay, cutoff
  - Closed hihat: level, decay, cutoff
  - Windows compatible
