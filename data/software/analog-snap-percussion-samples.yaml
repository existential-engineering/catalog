details: >-
  Analog snap - percussion samples from modeaudio is your ticket to the
  captivating, creative and inspiring world of analog percussion synthesis!
  We've put our flair for powerful, unique sound design to extensive use in
  producing this set of 251 insanely potent drum and percussion samples.


  Packed full of window-rattling kicks, intensely characterful snares,
  crackling, frazzled hi hats and so much more, these samples are all you need
  to inject some beautiful chaos into your rhythms.


  We've spent days in the modeaudio analog synth lab, replete with the venerable
  ems synthi a vintage synth amongst other devices, to bring you all manner of
  punchy, percussive thumps, bleeps, squawks, squeaks, scratches and crashes.


  The distinctive sound of these samples can even be seen in their very
  waveforms, which display the micro variations that make analog synth sound so
  compelling: the heaviest kicks have an attack that will slice effortlessly
  through your mix, while the most frenetic crashes retain that alluringly
  smooth analog finish.


  Putting all of this vintage, analog goodness directly at your fingertips, this
  pack also features an array of 12 striking drum kit patches that draw together
  the countless sonic colours and variations contained within the core
  percussion sample content. As an extra-special bonus, we've also crafted 5,
  percussion-processing channel strip presets for your favourite DAW, that
  embellish and ignite the many exciting sonic aspects of these analog drum
  sounds.
