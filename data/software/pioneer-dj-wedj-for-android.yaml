details: |-
  Mobile DJ app for Android™

  Start mixing music on your Android smartphone or tablet with WeDJ, our DJ app. The colorful, animated 2-channel interface with waveforms, jog wheels, play/cue buttons, tempo sliders and a crossfader, make it easy to get creative with tracks from your music library. With WeDJ, your DJ skills are really mobile: simply use your headphones to practice wherever you are, or plug your Android device into speakers and play wherever you may be. Take your performance to the next level by connecting to the DDJ-200 or DDJ-WeGO4 controller for tactile control of the DJ app’s features. * The free version will allow you to play five songs per session. Purchase a license in-app to unlock the full version.
