name: Blowfly
manufacturer: docnashsynths
primaryCategory: synthesizer
description: Blowfly generates a sound-scape by applying random motion (within
  user-defined parameters) to the control points of a bezier curve that defines
  a single cycle of the sound. Thus, both the shape and wavelength of the curve
  change from one cycle to the next.
details: |-
  Blowfly generates a sound-scape by applying random motion (within user-defined
  parameters) to the control points of a bezier curve that defines a single
  cycle of the sound. Thus, both the shape and wavelength of the curve change
  from one cycle to the next.

  Blowfly can be considered a 'method showcase' product as it introduces a novel
  dynamic stochastic synthesis technique via a functioning product, so as to
  bring it to the attention of other developers who may then choose to evolve
  and incorporate it into their existing or future products.

  Blowfly is useable as-is, as a stand-alone, unrestricted synth for producing a
  variety of new sounds and textures, just lacking in 'trimmings' like the
  ability to save and load patches.
specs: |-
  - Stochastic sound synthesis
  - Bezier curve control
  - Random motion parameters
  - Dynamic waveform generation
  - Windows compatible
