details: |-
  'airborne drum kit' from flame audio includes 21 melody loops and drumkit with 186 hot modern/trap/hip hop one-shots inspired by the hottest artists on the world stage such as roddy ricch, drake, pop smoke, sixnine, miksu, macloud, jugglerz, the cratez, metro boomin & more.

  'airborne drum kit' brings you yet another trend-setter, this time these 21 melody loops will take your productions to the next level. This pack will help you create your next big modern/trap/hip hop record.

  All the sounds used in the demo are included in this pack, except the beats. You can find them in other flame audio products.
