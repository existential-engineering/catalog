description: Low Control was designed to give you maximum control from one plugin. Easily dial in the perfect low end in just a few clicks.
details: |-
  A powerful, controlled low end is one of the hardest things to nail in a mix. Low Control handles both sides of that problem. Shape and control the weight without muddying the track. Enhance the harmonics so your bass sounds as big and consistent as you want it, on every system.

  The CONTROL section compresses only below a chosen frequency, leaving the top end untouched.

  Once you're happy with the amount of compression applied to your signal, boost back in as much or as little of that controlled low end as you'd like using the Low Gain slider.

  The ENHANCE section injects rich harmonic enhancement at the turn of a knob, the key to getting a bass that translates across all speakers.

  Low Control comes with a Solo Low mode that allows you to monitor just the low end that you're processing.
specs: |-
  - CONTROL section: compresses only below chosen frequency, leaving top end untouched
  - Gain reduction visualization
  - Low Gain boost slider
  - Frequency selection for compression threshold
  - ENHANCE section: harmonic enhancement
  - Sub bass frequency adjustment slider
  - Solo Low monitoring mode
  - Mac OS X 10.15 or higher
  - Windows 10 or higher
  - 64-bit only
  - 200 MB free drive space
