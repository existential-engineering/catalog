details: |-
  Replicates a boutique autowah pedal from Finland based on a vintage rackmount wah circuit, further refined to sound like a real wah pedal

  Fast tracking, uncanny accuracy and responsive controls; works equally well on guitar and bass

  Bespoke decay control adjusts the filter frequency fall speed, ranging from drenched-in-wah to traditional autowah pedal behavior

  Powered by the Antelope Audio Synergy Core FX platform; works in real-time with no perceived latency

  Runs natively in your DAW on macOS or Windows, or in real-time on your Synergy Core interface

  Can be combined with Shred Guitar Amps & Cabs for a guitar and effects rig that runs on the audio interface without any CPU load

  Included in the Antelope Cosmos subscription (75+ Antelope Native Plugins)
