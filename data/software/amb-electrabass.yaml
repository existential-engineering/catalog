details: >-
  Amb electrabass by algomusic is a virtual instrument audio plugin for windows.
  It functions as a VST plugin.


  Electrabass focuses on bass and leads with a futuristic sound. Along with 4
  different effects, a unique 32 stage sequencer allows you to input your own
  bass and lead lines with ease.


  2 harmonic oscillators offering 11 waveforms each with phase modulation, ring
  modulation, sync and a noise oscillator. Complex filter with 13 types of
  filters and x-y grid for cutoff and resonance.


  8 dedicated envelopes to selected targets with 7 types of velocity curves. 2
  bpm synced lfos with phase modulation. Portamento with re-triggering, pitch
  bend amount, MIDI channel select and master bpm.


  Unique pull down 32 stage sequencer offering piano grid style editing and
  complex algorithmic arpeggiator along with volume and cutoff control for each
  stage. 4 different effects: chorus, phaser, stereo delay, digital reverb.
  Dedicated vibrato for modulation wheel. On board click and learn help system.
  Preset information display. Low cpu. 128 presets by boris k, david haupt, dr.
  Ambient, and tim conrardy.
