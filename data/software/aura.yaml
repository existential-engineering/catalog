name: Aura
manufacturer: zynaptiq
primaryCategory: metering
description: Aura is a real-time audio analysis suite that brings the ultimate
  in flexibility, power, accuracy and beauty to audio visualization.
details: |-
  Aura is a customized auv3 host that contains a suite of metering plug-ins. Use
  the meters in the app for monitoring hardware inputs directly, or use the
  suite of plug-ins in your favorite auv3 host DAW.

  Each meter is completely customizable, resizable, and unflinchingly accurate.
  The meters support all modern metering standards, and can display multiple
  types of "traces" in the same meter.

  Meters and traces available in v1.0 include: spectral: magnitude, magnitude
  difference, phase difference, coherence. Needle: vu, bbc, and lu modes. Bar:
  magnitude, peak, lu. History: correlation, leq, level, loudness, power
  difference, spectrogram, waveform.
specs: |-
  - AUv3 host

  - Real-time audio analysis

  - Customizable meters

  - Resizable meters

  - Spectral metering (magnitude, magnitude difference, phase difference,
  coherence)

  - Needle metering (vu, bbc, lu modes)

  - Bar metering (magnitude, peak, lu)

  - History metering (correlation, leq, level, loudness, power difference,
  spectrogram, waveform)

  - Multiple trace types

  - Modern metering standards support

  - Macos compatible

