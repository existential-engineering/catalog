description: DeeGraphComp is a graphic compressor plug-in that operates like a
  graphic EQ to adjust the dynamics of each level, allowing independent
  compression and expansion settings across level bands to create custom
  compression curves.
details: |-
  DeeGraphComp is a dynamics processor plug-in from Dotec-Audio that takes a graphic EQ-inspired approach to compression. Rather than operating on frequency bands, it divides the signal by level and allows the user to draw a custom compression and expansion curve across those level segments, offering precise control over how different loudness ranges are treated.

  The plug-in allows independent settings for compression and expansion per level segment, enabling creative dynamics shapes not possible with a standard compressor. This makes it suitable for both transparent leveling tasks and more experimental processing, including sound design and special effects.

  DeeGraphComp supports 32-bit and 64-bit operation on Windows and 64-bit on macOS (OS 10.12 or later). Apple Silicon support was added in version 1.0.3. The plug-in is available in VST2, VST3, AU, and AAX formats.

  UI design was by IZMOJUKI and FUKUDAKOGYO, with sound design by Franck Shigetora and development by Dotec-Audio. The product was discontinued on December 14, 2021 and is no longer sold, though demo downloads remain accessible.
specs: |-
