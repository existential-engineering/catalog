details: |-
  Make Your Mixes Sound Like a Record. XBus is our take on one of the most respected bus compressors in history! Known for its ultra-punchy response, smooth glue, and ability to turn a good mix into a great one. Modeled after the modern hardware revision that many engineers secretly favor over the original design! The Most Important Ingredient to a Powerful Mixbus

  There's a reason engineers call this compression style the "mixbus cheat code."

  Whether on a console master section or in modern rack gear, this iconic circuit has remained the go-to for gluing a mix together with power, cohesion, and vibe. XBus gives you all of the musicality of a classic VCA style compression that is known to glue your mix together, with extra flexibility and an added head room knob allowing you to drive into the compression

  Main Compressor

  The main compressor section captures the essence of the iconic bus comp: punchy, musical, and effortless glue .With intuitive controls designed to shape transients, dial in energy, and tighten up the stereo field, this is where your mix locks in and comes to life. Advanced Controls

  Shape the response with sidechain filtering, add harmonic weight with optional saturation controls to tailor the behavior to suit anything from delicate vocals to heavy-hitting masters.All the nuance you need for a modern ITB workflow, with the same compression style you know and love already.
