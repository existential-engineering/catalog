description: HoRNet SW34EQ MK2 models the sound of an 80s analog equalizer found in a vintage console. The plugin also includes analog saturation.
details: |-
  The HoRNet SW34EQ MK2 is more than just an equalizer plugin, it's a time machine that brings the unmistakable analog warmth of the 1980s straight into your DAW. Carefully modeled after a single channel strip from a legendary American mixing console, this plugin faithfully recreates the vintage EQ curves, the smooth tonal shaping, and the subtle yet rich saturation that defined the golden era of analog recording. What makes the SW34EQ MK2 truly special is its origin story. It's not based on just any console, it's modeled after a specific unit from Virus Studio, located in the heart of Siena, Italy. This console has helped shape countless records, and now its essence has been captured in digital form, available at your fingertips.

  The SW34EQ MK2 offers a very musical and gentle EQ response. Whether you're using the bell curves or the shelving filters, every tweak feels natural and refined. The low shelf in particular adds a satisfying weight and warmth to the low end without making the signal feel exaggerated or muddy. This makes it a perfect tool for broad tone shaping, whether you're working on vocals, drums, guitars, or full mixes. Adding to the versatility is an 18dB/octave high-pass filter, which can be activated independently of the rest of the EQ section. This allows for precise low-end control even when you don't want to touch the overall tone of your audio.

  What truly sets the SW34EQ MK2 apart from other EQ plugins is its detailed modeling of the analog saturation found in the original hardware. We're talking about a console packed with op-amps, which means the saturation is harmonically rich and especially warm. At moderate settings, it introduces mainly even harmonics, giving that classic analog 'glow.' But as you push the gain harder, odd harmonics begin to emerge, adding a gritty, characterful edge to your sound. To go the extra mile, each EQ band has been individually modeled to reflect how it behaves and saturates in the original unit. Even the subtle hiss of the hardware is replicated, and yes, you can turn it off if you prefer a cleaner signal path.

  The MK2 version is more than a cosmetic refresh. While it retains everything people loved about the original, it introduces a set of modern workflow improvements and features. The most noticeable improvement is the new graphical interface, redesigned to be more visually appealing, with clearer contrast and sharper controls that make it easier to navigate, especially useful on high-resolution displays or in low-light environments. One of the most useful new features is the pop-up control window: when you hover your mouse over any gain or frequency knob, a dual-knob pop-up appears, giving you more precise control over your settings without cluttering the main interface.

  The MK2 update introduces a 12dB/octave low-pass filter, which wasn't available on the original hardware. This gives users even more control over the high-frequency content, allowing for smoother top-end roll-off when needed. Also added is a linked input/output gain option, which is especially useful when you're driving the EQ for its saturation: as you increase the input gain to get more harmonic richness, the output gain automatically compensates, ensuring your signal remains at a consistent level. If you're a saturation junkie, the MK2 lets you increase the saturation level up to 4x.
specs: |-
  - 4 band analog equalizer
  - High and low shelf filters
  - 2 parametric filters with three different Q
  - High pass filter with adjustable frequency and 18dB/octave slope
  - Low pass filter with adjustable frequency and 12dB/octave slope
  - Automatic input level adjustment to 0VU
  - Automatic output compensation for input knob
  - Analog emulation with saturation and hiss
  - Adjustable saturation level
  - Adjustable hiss level
  - Automatic internal oversampling to guarantee best sound
  - Apple Silicon native support
  - macOS 10.11 and later and Windows Vista and later required
  - 64-bit only on both Mac and Windows
  - Audio Units, VST2.4, VST3 and AAX format
  - No copy protection
