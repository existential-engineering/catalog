details: |-
  Blue Tubes Equalizers Pack is a collection of 6 plug-in processors designed to
  improve the quality of digital sound recordings. This bundle recreates the
  warm sound qualities of classic equalizer analog hardware.

  The sound quality of blue equalizers pack is nothing short of amazing. Yet all
  6 plug-ins provide a simple and functional vintage-style interface, as well as
  low cpu consumption for lightening-fast processing.

  Blue tubes equalizers pack includes: bt equalizer bq2s, bt equalizer bx2s, bt
  equalizer geq12, bt equalizer peq2b, bt equalizer peq5b, and bt equalizer
  peq322.

  Designed by musicians for musicians, the blue equalizers pack is a virtual
  effect audio plugin for macos and windows.

  System requirements include windows 7, 8, 10 or os x 10.8.5 or above, intel
  core i3/i5/i7/xeon processor, 4 gb ram recommended, DAW/host application with
  32/64-bit support, and authorization up to 3 computers.
