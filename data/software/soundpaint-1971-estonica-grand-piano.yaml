details: |-
  Your Keys To Happiness! The Soundpaint 1971 Estonica Grand Piano is a unique Eastern European Grand Piano. This piano line is known as the secret Steinway of Eastern Europe – with a uniquely dark, emotional and melancholic sound. In Soundpaint, this library offers a completely seamless and expressive experience across the keys. These don't feel like samples, but rather a real instrument, full of life, personality, natural resonance and harmonics. The Programs offer a comprehensive range of style and sounds for this gorgeous instrument. Two different mic positions offer spacial depth to this library, and the included picked piano strings add an extra touch of sonic magic!
