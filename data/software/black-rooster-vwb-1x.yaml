description: Vintage channel strip plugin combining VHL-3C filters, the VEQ-5 & VEQ-1P Pultec EQs and the VTC-2 tube compressor.
details: |-
  Four classic circuits, one signal path: the VWB-1X folds the VHL-3C filters, the Pultec-style VEQ-5 and VEQ-1P equalizers, and the VTC-2 tube compressor into a single channel strip, the way an old console kept everything in one strip instead of a rack of separate boxes.

  The VWB-1X Vintage Workbench is a channel strip plugin, and it's assembled from processors you may already know as standalone Black Rooster Audio plugins rather than one vague "console" model. Each stage is a real, individually modelled circuit: passive Pultec-style EQ, tube compression and passive constant-K filtering, wired into one strip so you can go from raw source to finished tone without opening five plugin windows or guessing at the gain staging between them.

  First in the strip is the VHL-3C high/low-pass filter section: a stepped Low Cut from 50Hz to 2kHz and a High Cut from 1.5kHz to 15kHz. Then two passive EQs: the VEQ-5, a take on the Pultec MEQ-5 midrange equalizer with Peak (low-mid), Dip, and Peak (high-mid) bands, and the VEQ-1P, modelled on the Pultec EQP-1A program equalizer with simultaneous Low Frequency boost-and-attenuate, a variable-bandwidth High Frequency boost, High Attenuation, and a Trim. Last comes the VTC-2 tube compressor, adding warm, level-dependent glue at the end of the chain.

  The VTC-2 offers Dual/Link operation, ratios from 1:2 to 1:20, switchable fast/slow attack and release, an in-module Mix knob for parallel compression, and Makeup gain. A Pre-EQ/Post-EQ routing switch places the compressor either before or after the equalizers, a flexibility not found on the original hardware. A strip-wide Mid/Side mode, global dry/wet Mix, and Oversampling switch (Off, 2x, 4x, 8x) round out the strip, alongside a central VU meter reading Input, Gain Reduction or Output, and per-module plus global bypass switches.
