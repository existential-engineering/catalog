description: A drum production instrument for Kontakt Player featuring huge-sounding drums with tonnes of punch and low end, suitable for radio rock to thrash metal and everything in between.
details: |-
  Modern & Massive is a drum library instrument built for Kontakt Player, requiring no additional Kontakt software purchase. It features a wide selection of professionally recorded kit pieces spanning kicks, toms, snares, and cymbals from premium manufacturers including Q Drum Co., Yamaha, Pearl, Tama, Gretsch, Ludwig, and Meinl.

  The library includes built-in processing and drum-optimized reverb, an animated drum view GUI, and full NKS (Native Kontakt Kontrol Standard) integration for use with Native Instruments hardware. A cymbal and snare bleed matrix and phase-coherent samples support realistic and flexible drum production.

  A groove player is included, enabling MIDI-driven playback directly within the instrument. The library covers a broad range of contemporary rock and metal styles, with audio demos spanning Active Rock, Alt Rock, Fusion Rock, Groove, Pop Punk, and Sludge Metal genres.

  System requirements include a minimum of 4 GB RAM (6 GB recommended), 15 GB disk space for the library plus 1 GB for Kontakt Player, macOS 10.12+ or Windows 7+, an i5 processor or equivalent, and OpenGL 2.1 or higher. An internet connection is required for activation; offline use is permitted after installation.
specs: |-
  - Kontakt Player instrument — no full Kontakt purchase required
  - 6 kick drum options: Q Drum Co., Yamaha, Pearl, Tama, Guru
  - 14 tom pieces from multiple manufacturers
  - 9 snare options including Gretsch, Ludwig, and VK Drums
  - Cymbals: hi-hats, crashes, rides, china, and splash from Meinl
  - Built-in processing and drum-optimized reverb
  - Full NKS integration for Native Instruments hardware
  - Cymbal and snare bleed matrix
  - Phase-coherent samples for layering
  - Animated drum view GUI
  - Groove player included
  - RAM: 4 GB minimum, 6 GB recommended
  - Disk: 15 GB (library) + 1 GB (Kontakt Player)
  - OS: macOS 10.12+ or Windows 7+
  - Processor: i5 or equivalent
  - Graphics: OpenGL 2.1 or higher
  - macOS formats: Standalone, VST, AU, AAX (64-bit)
  - Windows formats: Standalone, VST, AAX (32/64-bit)
