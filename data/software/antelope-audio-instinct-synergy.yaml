description: "Powered by Synergy Core and developed by Inertia Sound Systems,
  Instinct Synergy allows you to smooth analog warmth and aggressive
  distortion."
details: |-
  Instinct Synergy is a unique modulation effect developed by Inertia Sound Systems and powered by Antelope Audio's Synergy Core platform. It pushes creativity to the max, exploring new frontiers of sound from smooth analog warmth to aggressive and alienating distortion.

  A Living Organism of Drive, Dynamics and Tone — the effect excels when used for dynamics processing, tone shaping or adding gritty distortion. Use it for creative sound design by bringing forward underlying transients or building on weaker sounds.

  Instinct Synergy delivers when used as a mixing tool too. Results vary from smooth saturation to extremely distorted and noisy breathing sounds, with wide dynamics and very rich frequency spectrum.

  The concept behind Instinct Synergy is to have the ability to control tone, drive and drive-circuit parameters dynamically, based on a modulation signal that is created by shaping of the intensity envelope of the 'SCULPT' section input. This is what makes Instinct Synergy's engine alive and pumping.

  Runs in real time on supported Synergy Core hardware interfaces. With all Synergy Core interfaces it is possible to monitor and/or record clean and processed Instinct Synergy audio simultaneously.
