details: >-
  Armadillo is a colored channel-strip-like utility. Designed to add weight and
  character to stock sounds.


  Armadillo has a dual mode lowpass / hipass filter (12db/oct and 24db/oct),
  variable tube saturation and variable channel voicing.


  Thick and greasy or pristine and clean.
specs: |-
  - Dual mode lowpass/hipass filter (12db/oct and 24db/oct)
  - Variable tube saturation
  - Variable channel voicing
  - VST plugin
  - Windows compatible
