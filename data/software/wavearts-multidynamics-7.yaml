description: "Versatile multi-band dynamics processor with up to 6 independently
  configurable bands for compression or expansion/gating. Suitable for
  mastering, track processing, sound design, noise reduction, and ducking."
details: |-
  Up to 6 independent bands. Proprietary crossover filter network. 6/18/30 dB/oct crossover slopes. Full featured compressor or expander/gate per band. Clean and vintage compression modes. External sidechain input and sidechain EQ filter. Adjustable knees and lookahead. Zero latency when lookahead off. Per band bypass, solo, and mute. Learn function for automatic threshold setting. Realtime spectrum display. Output peak limiter. Peak, RMS, and K-system metering.
specs: |-
  Mac: AU, VST3, AAX. macOS 10.13+, Apple Silicon native, 64-bit only. Windows: VST2, VST3, AAX. Windows 7/8/10/11, 64-bit only. iLok supported but not required.
