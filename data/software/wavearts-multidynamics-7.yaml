description: A versatile multi-band dynamics processor combining equalization and dynamics processing for mastering, track processing, sound design, and noise reduction. Features six independently configurable bands for compression or expansion/gating.
details: |-
  - Up to 6 independent bands, each configurable as a full-featured compressor or expander/gate, providing flexible multi-band dynamics control.
  - Proprietary crossover filter network eliminates amplitude distortion, with selectable slopes of 6 dB/oct, 18 dB/oct, and 30 dB/oct.
  - Clean and vintage compression modes with adjustable knees and lookahead; zero latency operation available when lookahead is disabled.
  - External sidechain input and sidechain EQ filter support, with a learn function for automatic threshold setting and per-band bypass, solo, and mute controls.
  - Real-time spectrum display, output peak limiter, and multiple metering options including Peak, Peak & RMS, RMS, and K-system; iLok licensing supported but not required.
specs: |-
  - Bands: up to 6 independent bands
  - Crossover slopes: 6 dB/oct, 18 dB/oct, 30 dB/oct
  - Compression modes: Clean and Vintage
  - Sidechain: external sidechain input + sidechain EQ filter
  - Lookahead: adjustable (zero latency when disabled)
  - Metering: Peak, Peak & RMS, RMS, K-system
  - Licensing: iLok supported (not required)
  - macOS: AU, VST3, AAX; requires macOS 10.13+; Apple Silicon native; 64-bit hosts only; AAX requires Pro Tools 11+
  - Windows: VST2, VST3, AAX; requires Windows 7/8/10/11; 64-bit hosts only; AAX requires Pro Tools 11+
