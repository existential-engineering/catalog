details: >-
  Aim provides you a vast collection of cinematic sound effects like hits,
  whooshes, risers and others with tools simplifying your workflow: hit point
  syncing, instant sound manglers and one-key rhythm builder.


  Every sound in aim is unique. Every hit, whoosh, riser or downer has strong
  sonic identity. Here you can find anything you may need: from soft and soaring
  textural transitions to aggressive, earth-shaking booms.


  Aim provides smart sound management tools. With them you can identify the
  required samples with their names shown in the gui, mark liked samples as
  favorite and find them quickly the next time, not even re-saving the patch.
  And of course, all samples are labeled with their core tempo and tonality.


  The core function of aim is syncing the "hit points" of samples to the host
  tempo. Enable the aim function, set the desired time and press a key - and the
  sample will hit exactly in that time. Super convenient for transition samples.
  No dragging across the grid.


  Aim provides basic effects like filters, distortion and lo-fi. Besides, you
  can stretch the last played sample across 6 octaves to use it as a melodic
  instrument. And one more addition: you can use the interruption key to create
  any rhythmic passage instead of tiresome audio cutting procedures in the DAW.
