details: |-
  Our logic express bundle includes our soundbanks for 7 software instruments; the efm 1, the es e, the es m, the es p, the es 1, the es 2, and the evoc 20.

  The larger sound banks, those for the es 2, efm 1, and es 1, are grouped into subcategories based on the style of sound. These subcategories are "arp," "bass," "effects," "lead," "pad," and "poly."

  Installation is quick and easy, and detailed instructions are included in your download, so you can get up-and-running with your new sounds as soon as possible.
