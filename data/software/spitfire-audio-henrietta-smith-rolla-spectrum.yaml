details: |-
  Unleash your narrative by delving into a world of colour. Spectrum has been created in collaboration with composer, producer and DJ, Henrietta Smith-Rolla, also known as AFRODEUTSCHE — an innovator known both for her techno house productions and piano-based scores. This toolkit of manipulated, multi-dimensional synth textures and tempo-synced loops provides you with cutting-edge sounds to inspire and enrich your own sound world — from the dance floor to your next score.
specs: |-
  - 50 presets of multi-dimensional synth sounds, from pads to tempo-synced loops and percussion
  - Four sections: Spectral Phases, Spectral Rhythms, Spectral Reflections, Spectral Percussion
  - Controls for Stereo Spread, Attack, Release, Reverb, Delay, Stretch, Distort
  - 7 reverb options
  - 0.50 GB download size
  - macOS 11 to OS 26, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
  - Minimum 8GB RAM, 16GB recommended
  - Spitfire Audio App required
