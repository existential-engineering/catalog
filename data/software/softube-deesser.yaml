description: The Softube de-essing plugin, Deesser, is straightforward and full
  of power. The simple interface helps you intuitively improve vocal
  intelligibility and tame sibilances.
details: |-
  Straightforward and full of power, Deesser gives you a smoother, more natural sound while keeping the overall tonal quality of your audio intact. With Deesser, you can intuitively improve vocal intelligibility and tame sibilances with the simple interface and be on your way. Deesser's low latency and low CPU are excellent for tracking. The easy-to-use frequency detection, relative threshold, and transparent sound make it indispensable, from vocal tracks to harsh frequencies in a full mix.

  Softube made sure that the layout of Deesser felt as intuitive as possible so you can handle harsh sibliances with speed and simplicity. All you have to do to start de-essing is just drag the Deess slider. The frequency range of the detector determines where Deesser should listen for problematic frequencies. To set this range, drag the filter widget or type in your desired values. It's as simple as that.

  Deesser has everything you need and nothing you don't, which makes for a fast and easy workflow. On the interface, you'll find your key visualizations ready to guide you toward the right choices for your sound. The frequency analyzer on top shows the energy in the frequency spectrum, aiding you in setting the detector range. The frequency analyzer also shows the gain reduction, where the de-essing is applied.

  The Waveform View offers a bigger picture of the incoming audio and the amount of de-essing. Showing the GR measured in dBs, the gain reduction meter can be found beside the Waveform View.

  Deesser uses a relative threshold which means it's an automatic level-independent algorithm that makes setting the de-essing amount super easy. Any changes, in terms of input level, made to your chain before Deesser won't affect the response of the de-essing happening.
specs: |-
  - Easy to use sibilance taming with a transparent sound
  - Fast and intuitive improvement of vocal clarity and intelligibility
  - Helpful for taming harsh frequencies in a full mix
  - Frequency detection and relative threshold
  - Low latency, low CPU, and simple interface
  - Relative threshold: automatic level-independent algorithm, unaffected by input level changes earlier in the chain
  - Frequency analyzer showing energy in the frequency spectrum and where gain reduction is applied
  - Waveform View with a gain reduction meter measured in dB
  - Draggable filter widget with typed value entry for the detector frequency range
  - Supports Softube Extended Features panels
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Internet access required for downloading installers and managing licenses
  - Three activations
