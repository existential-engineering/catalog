details: |-
  Sc AutoFilter is designed specifically with the dj/electronic musician in
  mind. All parameters, such as the cutoff frequency, resonance, LFO frequency,
  LFO % (range of frequency sweep), duty cycle warping, and wet/dry mix, are
  fully automatable and quantizable.

  This powerful feature unlocks the plugin's full potential by allowing you to
  create more complex and expressive sounds than what's possible through manual
  tweaking.

  The plugin's colorful interface displays the filter's effect in real-time by
  visualizing filter response and output fft. This enables real-time performance
  and fast exploration of sonic possibilities when you're composing or producing
  music.

  In addition to controlling the filter cutoff frequency and filter resonance,
  you can sweep the filter frequency with a range of lfos, duty cycle warp the
  lfo, and control the wet/dry mix.

  Preset sharing allows you to create and share presets with other sc autofilter
  users online.
specs: |-
  - Variable lowpass filter
  - LFO control for frequency and resonance
  - LFO % (range of frequency swept by an LFO)
  - Duty cycle warping
  - Wet/dry mix
  - Full parameter automation
  - Preset sharing
  - Real-time filter response visualization
  - Output fft visualization
  - Fully automatable parameters
  - Quantizable parameters
