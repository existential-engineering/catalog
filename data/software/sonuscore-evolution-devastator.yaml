description: "Evolution: Devastator offers essential toolkits of hybrid and modern sound effects for movie and game sound designs, as well as for composing trailers and soundtracks available in two extensive libraries."
details: |-
  Evolution: Devastator is the Keepforest Evolution Signature Series entry built around a dark, gritty, futuristic sound character, sold in two libraries that are also available together as a Full Edition. The series is aimed at movie and game sound design as well as trailer and soundtrack composition.

  The Action Twisted Industrial Toolkit is the first library: hybrid and modern sound effects, cinematic hits, punchy percussion and playable instruments of synths, pulses and tonal FX. Nearly 200 original industrial samples were recorded for it, from massive factory machines to passing trains and the machine-driven sounds in between, then processed in detail into hybrid and modern material. Its content ranges from classic, metal and hybrid hits through to round robin pulses and playable braam presets. It credits Colin Root as producer and sound designer and Arseni Khodzin as producer and mixing engineer.

  Deathmatch is the second chapter: a collection of hand-crafted custom signature sound effects, trailer braams, brasses, signals, distorted basses, playable pads and atmos, cinematic loops and artist stems. It adds trailer drum and percussion loops, trailer plucks, low brass and megahorns, distortions, downers, noises and ambiences, reversed and suckback material, plus one-shot banks and 12 trailer stems.

  Both libraries are supplied at 48 kHz / 24 bit and are described as CPU-friendly. Both require the full version of Kontakt 6 and will not run in the free Kontakt Player.
specs: |-
  - Sold in two libraries, Action Twisted Industrial Toolkit and Deathmatch, also available as a Full Edition
  - Nearly 200 original industrial samples recorded for the Action Twisted Industrial Toolkit
  - Trailer hits: 43 classic, 35 metallic, 26 hybrid, 24 acoustic, 43 short, 24 RR synthetic trailer drums, 23 organic rolls & hits, 33 classic booms, 30 hybrid booms, 26 suckbacks
  - Percussion: 26 kicks, 17 snares, 16 RR classic cymbals, 17 RR dirty cymbals, 35 punch, 55 high, 20 noise percussion
  - Trailer FX: 33 classic whooshes, 39 hybrid whooshes, 28 long resonance risers, 18 long noisy risers, 52 short risers, 20 ultra risers, 19 classic downers, 40 hybrid downers, 16 drone noises, 31 glitches, 27 high glitches, 26 noises
  - Tonal FX: 35 soft braams, 52 signature hits, 19 alarms, 25 screams
  - Synths: 7 sub bass, 26 hard bass, 19 leads, 25 pads & textures (one shots)
  - Trailer pulses: 18 low bass, 56 harsh bass, 31 lead synth, 23 high pluck, 16 high percussion
  - Playable: 55 tonal FX, 126 synths, 61 pulses
  - Deathmatch playable instruments include trailer drum and percussion loops, 32 trailer plucks, 9 low brass & megahorns, 34 braams & pads, 55 signature bass & signal, 37 signature synth & scream, 35 Devastator distortions
  - Deathmatch one-shots include 59 trailer brass, 93 signature one-shots, 135 pads & atmos, 110 Tik Tok shots
  - Deathmatch trailer loops: 40 drum loops, 19 hits loops, 20 fills, 46 tonal loops, plus 12 trailer stems
  - High-quality samples at 48 kHz / 24 bit
  - CPU-friendly for fast performance
  - Supported host application: Kontakt 6 VST, AU, AAX, standalone
  - Requires the FULL version of Native Instruments' KONTAKT 6.0.2 or higher (NOT compatible with the free KONTAKT PLAYER)
  - Windows 7, Windows 8 or Windows 10
  - macOS 10.12, 10.13 or 10.14
  - Available as a download only
