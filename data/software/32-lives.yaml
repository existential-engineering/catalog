details: >-
  32 lives is a transparent 32-bit to 64-bit audio units and VST plug-ins
  adapter, which enables you to run your favorite 32-bit-only plug-ins in your
  latest 64-bit DAW.


  32 lives is compatible with virtually all 64-bit audio units and VST host
  applications, including logic pro x, cubase, ableton live and studio one.


  32 lives is capable of generating transparent 64-bit audio units and VST
  adapters for your tried-and-true 32-bit legacy plug-ins, helping you to cross
  over to your latest 64-bit DAW smoothly and transparently.


  Older sessions saved with your 32-bit DAW will fully load into your 64-bit DAW
  version, including all presets, parameters and automation; no special
  re-wiring or routing is required.


  All your 32-bit-only plug-ins will be displayed in the plug-ins menu as they
  always have been.
