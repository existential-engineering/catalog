description: MR Gate 6 is a full-featured expander/gate plugin designed to reduce background noise during quiet sections. It provides quick and simple background attenuation with adjustable threshold, ratio, attack, and release time controls, a dynamic scrolling display showing input and gain level history, and a monitor feature to audition the gated signal separately.
details: |-
  - Gate with threshold, ratio, attack and release time controls
  - Adjustable lookahead
  - Comprehensive metering display
  - Dynamic scrolling display showing input and gain level history
  - Monitor feature to audition the gated signal separately
  - Latency compensation support
  - Up to 192 kHz sampling rate support
  - Mono or stereo operation
  - iLok licensing supported (optional)

  Mac: macOS 10.13 or later (High Sierra and newer); Apple Silicon native support; 64-bit hosts only; Pro Tools 11+
  Windows: Windows 7/8/10/11; 32-bit and 64-bit hosts supported; Pro Tools 10.3.5+
specs: |-
  Mac: AU, VST3, AAX. macOS 10.13+, Apple Silicon native, 64-bit only. Windows: VST2, VST3, AAX. Windows 7/8/10/11, 32-bit and 64-bit. iLok supported but not required.
