description: "Full featured expander/gate for gating noise during quiet
  sections, with adjustable lookahead, variable ratio, attack and decay times,
  and comprehensive time display."
details: |-
  Gate with threshold, ratio, attack and release times. Adjustable lookahead. Comprehensive metering. Dynamic display shows recent history of input and gain levels. Monitor allows hearing gated signal. Latency compensation. Up to 192 kHz sampling rate. Mono or stereo.
specs: |-
  Mac: AU, VST3, AAX. macOS 10.13+, Apple Silicon native, 64-bit only. Windows: VST2, VST3, AAX. Windows 7/8/10/11, 32-bit and 64-bit. iLok supported but not required.
