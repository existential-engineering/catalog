description: MR Gate is a full featured expander/gate that can be used to gate noise during quiet sections. It is a comprehensive gate implementation with adjustable lookahead, variable ratio, attack and decay times.
details: |-
  Quick and simple background attenuation. MR Gate is a full featured expander/gate that can be used to gate noise during quiet sections. It is a comprehensive gate implementation with adjustable lookahead, variable ratio, attack and decay times.

  In addition, it has a scrolling time display that shows the level of the input signal and the gate attenuation, which is handy for setting up the parameters. It also has a monitor feature that lets you hear the gated signal, useful for listening to the background without the foreground.

  MR Gate 6 is included in Master Restoration Suite 6.
specs: |-
  - Gate with threshold, ratio, attack and release times
  - Adjustable lookahead
  - Comprehensive metering
  - Dynamic display shows recent history of input and gain levels
  - Monitor allows you to hear gated signal
  - Latency compensation via compatible hosts
  - Up to 192 kHz sampling rate
  - Mono or stereo
  - Requires a host program that supports audio plug-ins
  - iLok licensing is supported but not required
  - Macintosh formats: AU, VST3, AAX
  - MacOS 10.13 (High Sierra) and higher
  - Apple Silicon natively supported (AU, VST3, AAX)
  - AAX on macOS requires Pro Tools 11 and higher
  - 64-bit hosts only on macOS
  - Windows formats: VST2, VST3, AAX
  - Windows 7/8/10/11
  - AAX on Windows requires Pro Tools 10.3.5 and higher
  - 32-bit and 64-bit hosts supported on Windows
