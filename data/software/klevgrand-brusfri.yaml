details: |-
  Brusfri is a highly advanced audio noise reducer, packed into a simple and straight-forward interface. It is very well suited for cleaning up noisy audio recordings, while retaining sound quality.

  Unlike many other noise reducers on the market, Brusfri doesn't mess with audio phasing to suppress noise (a technique that often comes with audible side effects). Instead, multiple fine-tuned gates are used to silence unwanted noise.

  The Attack, Threshold and Release parameters control all of the internal expanders relatively, so one set of controls shapes the whole suppressor rather than each band individually.

  Brusfri needs some noise to be analysed. Pushing and holding the Learn button feeds audio data and creates a noise profile, which most of the time is the only step needed.

  A Tonality control is there for the cases where the automatic profile needs adjusting, especially when there is heavy noise involved.
specs: |-
  - Several frequency-trimmed expanders build an intelligent noise suppressor
  - No phase-altering, which leaves the desired sound untouched (no squishy artifacts as in many other noise reducers)
  - Intuitive and unique user interface
  - Attack, Threshold and Release control all internal expanders relatively
  - Learn button: push and hold to feed audio data and create a noise profile
  - Tonality control for tweaking the noise profile
  - Requires macOS 10.10 or later (optimized for the M1-processor), Windows 7 (SP1) or later, running an AU, VST or AAX compatible 64-bit host
  - iPad/iPhone: Standalone and AUv3
  - 64-bit only
  - Window zoom functionality
  - Load and save states to file
  - Mix dry/wet parameter
  - Lookahead on/off parameter
  - Small layout mode
  - Automation-enabled Learn button
