details: |-
  The aXCompressor by SSA Plugins is a dynamic range compressor designed to
  compress ambisonic signals while preserving the spatial information they
  contain. Any processing on ambisonics signals has to be handled carefully to
  ensure that the spatial balance of the sound scene is not disturbed.

  The axcompressor lets you apply compression to your tracks or busses without
  harming your signals. This allows you to maintain the highest quality for you
  immersive audio and vr experiences.

  The plugin is available in three versions, with different levels of maximum
  ambisonic order: a1compressor - compress first-order ambisonic signals.
  A3compressor - compress up-to third-order ambisonic signals. A7compressor -
  compress up-to seventh-order ambisonic signals.

  Input: first to seventh order ambisonics using any standard channel ordering
  format. Automatic order detection processing automatically matches the order
  of the input signal to optimise cpu usage when working with lower orders.

  Axcompressor by ssa plugins is a virtual effect audio plugin for macos and
  windows. It functions as an audio units plugin, a VST 3 plugin and an AAX
  plugin.
specs: |-
  - Dynamic range compressor
  - Ambisonic signal compression
  - First to seventh order ambisonics
  - Standard channel ordering format
  - Input gain
  - Output make-up gain
  - Threshold
  - Ratio
  - Knee width
  - Attack time
  - Release time
  - Rms detection
  - Peak detection
  - Automatic order detection
  - CPU optimization
  - macOS support
  - Windows support
  - Universal 2 binary
