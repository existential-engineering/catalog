details: |-
  Based on beloved hardware from the '60s and '70s, the VEQ-55b features four separate bands with up to 12 dB of boost or cut. The high and low bands offer the option of switching between a bell curve or shelving behavior.

  The EQ exhibits proportional Q behavior, ranging from gentle slopes at subtle levels to aggressive slopes at higher levels, with overlapping frequency selections across adjacent bands. It runs natively as a DAW plugin or in real-time on Antelope Audio's Synergy Core interfaces, and is included with the Antelope Cosmos subscription bundle.
