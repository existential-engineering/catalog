description: Precise, flexible, and transparent limiting. The Limit Pro limiter
  plugin gives you full control over loudness with Softube fidelity for mixing,
  mastering, and single tracks. Also included is the quick and easy Limit Go
  limiting plugin for time-sensitive music production projects.
details: |-
  You want a loud mix? You need a fast limiter. But you don't want to end up with a clipper with a lot of distortion. To get a loud and transparent mix, the peak suppression type and release method need to be tailored to the music, and while no single peak suppression approach works for all types of music, most limiters use only a single peak suppression method. Enter Limit Pro.

  Limit Pro delivers maximum loudness and ultimate transparency by giving you extensive control over peak suppression, metering, and precise and flexible limiting for mastering, mixing, and single tracks. The three peak suppression methods, with frequency-adaptive control of release times, are fit for a variety of genres and music styles. The Low Frequency Protection algorithm keeps the bass intact, and Limit Pro also offers a Gain Match feature, delta monitoring, and gives you a good overview of the metering needed, such as true peak, peak, LUFS, loudness loss, distortion metering for desired transparency, and a real-time peak suppression view. All with low latency, low CPU usage, and the included Limit Go plug-in.

  No single peak suppression approach works for all types of music. Most limiters use only a single peak suppression method, and while that method may sound great for dense and bright mixes, for example, it will sound heavily distorted on a dynamic rock track. That's why Softube designed Limit Pro with three different peak suppression methods, Standard, Adaptive, and Fast, that each excels in different circumstances. Fast is almost like clipping, without actually clipping the signal. Adaptive strives to be as fast as possible but can slow down to prevent low-frequency distortion. Standard is predictive, reliable, a workhorse that gets the job done although you might not get that extra dB of loudness.

  Limit Pro goes a step beyond a standard limiter with different release control flavors and frequency-adaptive control of release times. Transient Release is what you would typically see on most limiters and is nearly an extension of peak suppression. But Limit Pro also features Adaptive Release. This setting releases faster for transients than for sustained material and allows you to use longer release times without the limiter punishing the mix. Frequency-adaptive control of release times gives different release times to different frequencies without affecting the tonality or frequency spectrum of the audio, reducing the low-frequency distortion coming from the limiter.

  A fast, loud limiter isn't typically the best at handling low frequencies, and different limiters handle low frequencies in different ways, often with long look-aheads that lead to a lot of latency. Low Frequency Protection assumes control over the limiting for sub-bass frequencies to avoid distortion when, for example, the 808 kicks in. Limit Pro also offers several types of metering and visualizations, including the Distogram, which visualizes how the distortion sounds: a peak at the top of the graph means the harmonics created by the distortion are located at a much higher frequency than the incoming audio, typically perceived as bright or fizzy, while a peak at the bottom means the harmonics are close to the incoming audio, which can be perceived as natural or growly.
specs: |-
  - Maximum loudness with ultimate transparency
  - Two plug-ins for both extensive control and super-fast adjustments
  - For mastering and mixing, as well as single tracks
  - Three unique peak suppression methods (Standard, Adaptive, Fast)
  - Frequency-adaptive control of release times
  - Low frequency protection mode
  - True Peak limiting
  - Transparent oversampling using linear phase filters
  - Gain Match, Delta monitoring, and more
  - Low latency and low CPU usage
  - Console 1 and Flow Studio Ready
  - Two plug-ins included: Limit Pro and Limit Go
  - Included with Flow Mastering and Complete Suite subscriptions
  - Distortion metering and Distogram visualization, Loudness Loss meter, real-time peak suppression view, true peak, peak and LUFS metering
  - Supported sample rates: 44.1, 48, 88.2, 96, 176.4 and 192 kHz (mono/stereo)
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Three activations per license, 20-day trial
