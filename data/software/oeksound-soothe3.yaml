description: A dynamic resonance suppressor that identifies problematic
  resonances on the fly and applies matching reduction automatically. The
  reduction engages only when and where needed, preserving the timbre of the
  original sound source.
details: |-
  soothe3 is a dynamic resonance suppressor. It identifies problematic resonances on the fly and applies matching reduction automatically, which oeksound describes as resulting in a smoother, more balanced sound and as saving the user from having to notch out frequencies by hand. The reduction only kicks in when and where needed, without affecting nearby frequency areas, so the timbre of the original sound source is preserved and treatment stays transparent with minimal artifacts.

  The page positions vocals as a primary use case, noting that they are full of resonances arising from the voice itself, the choice of microphone, mic placement and room acoustics. soothe smooths out harshness in real time, improving clarity, balance and overall tone without sacrificing detail. A low latency mode lets soothe3 be used while tracking, so performers hear a more polished sound from the start. The plug-in adds zero samples of latency at base sample rates and around 1 ms at higher sample rates in that mode.

  Two processing modes are offered. Soft mode is the more transparent of the two, using an adaptive threshold, and is presented as a safe starting point for any sound source and as working especially well with dynamic instruments. Hard mode uses a fixed threshold in the style of soothe2, is more reactive to dynamics, and suits a compressor-like grab, aggressive control, popular sidechain effects, or deliberate over-processing as a creative effect.

  Deeper controls are available when needed. Tilt controls scale detail, attack and release in a frequency-dependent way and offer a quick solve when the low end needs different settings. Multichannel support extends up to 9.1.6 configurations with full control over the linking of channel sets, and a linear phase option is two clicks away, which the page suggests for parallel processing or for unlinked mid-side processing where panning changes should be avoided. Workflow additions include a detail parameter that combines soothe2's sharpness and selectivity under one control, nodes that can be created or deleted across eight band shapes including bandpass and tilt, a max cut parameter that keeps the biggest cuts in check when driving the plug-in harder, and a collapsible side panel that keeps advanced settings out of the way.

  oeksound traces the line back to the original soothe, released in 2016, describing each iteration as a redesign of the algorithm to improve sound quality, performance and flexibility while retaining ease of use, and calling soothe3 another major leap in transparency, usability and versatility. The plug-in requires an iLok account and iLok License Manager, though no iLok dongle. Online access is required for initial activation of the product and the trial, one license allows activation on three machines, and licenses are valid on both Windows and macOS. A fully featured 20-day trial is available.
specs: |-
  - Dynamic resonance suppressor: identifies problematic resonances on the fly and applies matching reduction automatically
  - Reduction engages only when and where needed, without affecting nearby frequency areas
  - Soft mode: most transparent resonance suppression, adaptive threshold, suited to most sources and dynamic instruments
  - Hard mode: fixed threshold in the style of soothe2, for aggressive control, sidechain effects and creative over-processing
  - Low latency mode: zero samples of latency at base sample rates, approximately 1 ms at higher sample rates, for tracking and live use
  - Detail parameter combines soothe2's sharpness and selectivity under a single control
  - Nodes can be created or deleted, with eight band shapes including bandpass and tilt
  - Tilt controls scale detail, attack and release frequency-dependently
  - Max cut parameter limits the largest cuts when driving the processing harder
  - Linear phase mode for parallel processing and unlinked mid-side processing
  - Multichannel support up to 9.1.6 with full control over linking of channel sets
  - Collapsible side panel keeps advanced settings out of the way
  - Windows 10 - 11 (no ARM support), 64-bit VST3 and AAX (Pro Tools 2018.1 and up)
  - Mac OS X 10.14 (Mojave) to macOS 26 (Tahoe), 64-bit VST3, AU and AAX (Pro Tools 2018.1 and up)
  - Apple Silicon Macs supported, Intel support up to macOS 15 (Sequoia)
  - iLok account and iLok License Manager required, iLok dongle not required
  - Online access required for initial activation of the product and trial
  - One license allows activation on 3 machines, valid for both Windows and macOS
  - Fully featured 20-day trial
