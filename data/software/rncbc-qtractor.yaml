description: Qtractor is an audio and MIDI multi-track sequencer for Linux,
  written in C++ with the Qt framework and built around JACK for audio and the
  ALSA sequencer for MIDI.
details: |-
  Qtractor is a Linux desktop audio workstation aimed at the personal
  home studio, following the traditional multi-track tape recorder control
  paradigm. It is free, open source software distributed under the terms of
  the GNU General Public License version 2 or later.

  Sessions hold an unlimited number of tracks and an unlimited number of
  overlapping clips per track, edited non-destructively and non-linearly with
  unlimited undo and redo. Session and project descriptions are stored as XML,
  and editing is point-and-click with multi-select and drag and drop for
  moving, cutting, pasting, splitting, merging and freezing clips.

  Audio files are read through libsndfile, libvorbis and libmad, covering OGG,
  MP3 playback, WAV, FLAC and AIFF, and standard MIDI files in formats 0 and 1
  are supported. Clips can be time-stretched and pitch-shifted through
  librubberband, with sample rate conversion through libsamplerate.

  The application hosts LADSPA, DSSI, native VST2, VST3, LV2 and CLAP plugins
  with no fixed limit per track or bus, and adds a built-in mixer, monitor
  controls and a connection patchbay. MIDI work is covered by a matrix and
  piano roll clip editor, instrument definitions, SoundFont and MIDI Names XML
  files, controller mapping and learn, and system exclusive setups.
specs: |-
  - Multi-track audio and MIDI sequencing and recording
  - JACK for audio and the ALSA sequencer for MIDI
  - Audio file support for OGG, MP3 playback, WAV, FLAC and AIFF
  - Standard MIDI file support, formats 0 and 1
  - Non-destructive, non-linear editing with unlimited undo and redo
  - Unlimited tracks per session and overlapping clips per track
  - XML encoded session and project description files
  - Built-in mixer, monitor controls and connection patchbay
  - LADSPA, DSSI, native VST2, VST3, LV2 and CLAP plugin support
  - Plugin presets, programs and native VST FXB and FXP file support
  - Audio and MIDI effect send and return inserts per track or bus
  - Loop recording and takes
  - Clip fade-in, fade-out and cross-fade with linear, quadratic and cubic curves
  - Track and plugin parameter automation with dynamic curves
  - Time-stretching, pitch-shifting and sample rate conversion
  - Audio and MIDI track export for mix-down, render and merge
  - Unlimited tempo and time-signature map, unlimited location and bar markers
  - MIDI clip editor with matrix and piano roll
  - MIDI instrument definitions, SoundFont and MIDI Names XML file support
  - MIDI controller mapping, learn and assignment
  - MIDI system exclusive setups
  - JACK transport sync as master or slave, JACK session support
  - NSM session management support
  - MMC control surface, MIDI Clock and Song Position Pointer support
