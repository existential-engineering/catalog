  your mixes. Featuring two poly modes with proper voice allocation, plus fresh
  innovations.
details: |-
  The year is 1984. Splashing down is a majorly righteous polyphonic synthesizer that will go on to outrun its era. Thirty-odd years later, Softube is still vibing on the gnarly Synthwave reverberations this paragon can produce. Used on countless records by innumerable artists, it's a six-voice synth that set a standard and established a sound. Now it's time to discover what it can do in the DAW.

  Softube applied its award-winning modeling expertise to a fully-serviced and calibrated 1984 unit and the result is a perfect facsimile of the original hardware. Using rock & roll science, Softube created a plug-in that has all the quirks and non-linearities of the 1980s-era idol. Even the clutch factory presets with easy recall of the '80s sounds heard on copious number-one hits. Added features and flexibility bring the prototype's influential and unmistakable sound motoring into modern production environs: from Softube's official Eurorack platform, Modular, to its pro audio guitar & bass platform, Amp Room, and beyond.

  Softube poured the same fastidious modeling energy into Model 84 Polyphonic Synthesizer that goes into every piece of its gear. The result is voice allocation modes and an EQ, with bass boost for extra oomph on basslines, that mirror the iconic hardware. Softube's meticulous recreation of the unison phase allows you to assign all six voices to one note and to achieve the sounds of the synth that became an industry touchstone.

  Model 84 is about control. Extended unison mode gives authority over sync and enables a more pronounced attack to the start of a note. Velocity and aftertouch support promote enhanced dynamic performance with command over the amp, as well as the filter and PW. And the expanded control panel, with added velocity and aftertouch parameters, makes it easier to fine-tune sound and behavior.

  Three versions are included. The instrument plug-in delivers the six-voice synth with rigorously modeled voice modes, pitch and mod wheel, MIDI CC and velocity/aftertouch support. The Model 84 Chorus module for Softube Amp Room offers the powerful, dirty, fat chorus used in the original hardware. And seven Model 84 modules for Softube Modular expose individual instrument sections for Eurorack-style patching.
specs: |-
  - The authentic sound of the 1980s in plug-in and module form
  - Meticulously modeled on a pristine 1984 polyphonic synthesizer
  - Three versions included: Model 84 Instrument, Model 84 Chorus module for Softube Amp Room, and seven Model 84 modules for Softube Modular
  - Six-voice polyphony with two poly modes and proper voice allocation
  - The unison phase sounds of the original
  - Included factory presets for easy recall of classic sounds
  - Stunning artist presets, from classic sounds to contemporary, crispy leads
  - Increased velocity and aftertouch support for added control over the amp, filter, and PW
  - The addition of extended unison mode for higher control over sync
  - An expanded control panel with added parameters for fine-tuning
  - Pitch and mod wheel assignment, glide, and voice allocation for creative playing
  - EQ with bass boost, mirroring the original hardware
  - Recreated LPF tracking lets you play the filter when self-oscillating
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Three activations per license
  - 20-day trial, 14-day returns
