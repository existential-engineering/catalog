description: "Features: 545 factory presets. Generation of random presets. Four
  part multi-timbral (mono-timbral mode available). Polyphonic (16 voices)."
details: |-
  Features include 545 factory presets with generation of random presets, four
  part multi-timbral capability (mono-timbral mode available), polyphonic (16
  voices) and monophonic operation, 52 basic waveforms, and 3 modulatable
  oscillators with feedback and oversampling. Each osc may use one of the basic
  waveforms or a combination of two, which leads to more than 2000 basic
  waveforms per osc.

  The synth offers 21 types of synthesis (e.g. Additive, ring modulation, fm,
  xfm, pm, etc.), extended waveshaper, 8 modulatable filter types (lowpass,
  highpass, notch, etc.), and a filter-independent resonator. Modulation sources
  include high-flexible lfo, envelopes and combiners as well as MIDI-events
  (velocity, note, MIDI control changes, aftertouch, etc.) and random.

  11 effects are available (delays/reverbs, chorus, flanger, phaser, eq) with 2
  effects that can be serialized. All time-parameters/fx (e.g. Modulation speed)
  can be fix or synchronized to MIDI.

  Support for micro tuning includes scala, tuning files, and MIDI sysex.
  Additional features include pitch-bending, portamento, fully skinable
  interface, poly limiter, oversampling, and graphic envelopes with adjustable
  curves per point.
