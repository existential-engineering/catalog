details: |-
  DAW LP is a vinyl player simulation plug-in for Mac & Windows (AU/VST/AAX), and iPad (AUv3). It simulates various artifacts associated with vinyl, all the way from the vinyl record surface, to the output cable of the RIAA amplifier. Tune in anything from an old 78:s player to a modern HiFi sound.

  Set the level of hum, scratches & noise along with the quality of amp, needle & cable. Use the wobble control for a broken drive belt motor, and fine-tune using the in, out & mix level.

  The interface is laid out around four areas. Where and when emulates traveling around the world with just a click, deciding what type of mains hum you want. Quality matters sets the quality of the RIAA amplifier and pickup needle. Bring the noise decides how much scratches, hum, wear and noise you need. Wobble til you gobble adds a slightly unstable drive belt.
specs: |-
  - Scratches/crackles rate, level and ducking
  - Control vinyl noise, amplifier noise and low frequency hum levels
  - Continuous control of amplifier, pickup needle and cable quality
  - Switch between 50 Hz and 60 Hz hum
  - Additional input gain, output gain and dry/wet mix parameters
  - Wobble control (v1.1.2) simulates a wobbly vinyl disc
  - Resizable UI (v1.1.2, desktop)
  - Requires macOS 10.10 or later (optimized for the M1 processor), or Windows 7 (SP1) or later, running an AU, VST or AAX compatible 64-bit host
