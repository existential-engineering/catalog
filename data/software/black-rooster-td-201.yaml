description: Vintage tape echo inspired by the Roland RE-201 Space Echo. Warm multi-head delay and spring reverb for dub and guitars.
details: |-
  The TD-201 is a vintage tape echo, a multi-head delay that behaves like the tape machine it was modelled on rather than a clean digital line. You dial in a delay time, layer up the playback heads, then push the feedback until the whole thing tips into self-oscillation and takes off. Inspired by the Roland RE-201 Space Echo, it recreates the free-floating quarter-inch tape loop and spring reverb that built dub, roots reggae and half a century of guitar and synth records.

  The 12-position Mode Selector is where the character lives. It routes the three playback heads (H1, H2 and H3) and the spring reverb exactly as the original did: four head-only modes (H1, H2, H3, H2+H3), seven modes that add the spring reverb, and a reverb-only setting. Ride the Feedback and Repeat Rate controls (the plugin's take on the RE-201's Intensity) and the regeneration climbs until the echo tips into self-oscillation, that runaway diving-into-space sound. Each head has its own Position, Level and Pan, so repeats can be spread across the stereo field or tucked behind the source.

  A 2-band Bass/Treble EQ shapes the output, separate Tape Bass and Tape Treble controls set the tape's own tone, Reverb Volume feeds the convolution spring, and Dry Pre runs the dry signal through the Class-A preamp for subtle saturation. Flip the Dry Mute switch on and the direct signal drops out, passing only the repeats and self-oscillation, the classic dub mixing-desk move. Tape-machine imperfection controls (Floor, Dropouts, Wow Flutter, Motor Acceleration) add authentic vintage grit or can be zeroed out for a clean, controllable delay.

  Real-time, component-based modelling captures the tape response, head routing, Class-A preamps and spring reverb of the analog counterpart as a living system rather than a static delay line, so feedback and saturation interact the way the hardware does. The tape and feedback stages run oversampled, with the factor auto-adjusted to the session's sample rate. It runs natively on Apple Silicon and Intel Macs as well as Windows, with HighDPI rendering support.
