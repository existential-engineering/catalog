details: |-
  Absolute Piano Bosendorfer 225 is a virtual instrument audio plugin and
  software application for Windows. It functions as a VST plugin and a
  standalone application.

  This piano has been sampled from a half concert grand bosendorfer 225. It has
  a very large musical spectrum sound. It has been recorded every 2 notes, with
  4 level of velocity. V4 introduce smooth cross fade between each layer for a
  better transition between each velocity layer.

  Version 4.2 introduces a new revolutionary concept that emulates not only the
  sound of the piano by using a quality soundbank and adding real time specific
  effects on it, but truly emulates the resonance of the piano from the inside.

  The absolute piano concept is to bring to the pianist a lightweight yet
  fantastic sounding piano emulation, where you have plethora of options to
  enjoy playing your favorite pieces, but using today's technology for a new
  exciting musical experience.

  Absolute pianos are loading in memory in less than 10 seconds on a regular
  computer and are running on netbooks and small laptops. You can play piano
  using the MIDI, with the mouse, or even with your computer keyboard in stand
  alone mode only. In stand alone mode when the piano play a MIDI file, you can
  see what is playing and you can play on the top of it.
specs: |-
  - 128 notes polyphony
  - Hammer simulation
  - Tonal simulation
  - Sympathic resonance emulation
  - Schroeder reverb algorithm
  - Fdn network reverb
  - MIDI tools
  - Sequencer
  - Piano roll playback
  - MIDI to wav converter
  - Multi-effects
  - Peek punch effect
  - Windows compatible
  - Minihost powered
