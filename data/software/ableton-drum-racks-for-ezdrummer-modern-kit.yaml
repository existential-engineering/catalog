details: >-
  Ableton drum racks for ezdrummer modern kit features drum racks for all
  factory presets for the toontrack ezdrummer modern kit. These racks are the
  most complete integration between ableton live and toontrack ezdrummer
  including a host of features ready to use on ableton push.


  New in v1.1 multiple audio channel output presets and free ableton live multi
  out audio routing template ready made for the modern kit channel routing.


  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all ezx factory presets from ableton push
  controller device browser.


  Mapped ableton macros to ezdrummer macros with preset values for ease of use
  in push and simple to use automation programming. Audio routing options
  include singleout presets featuring 18 ableton drum racks for all factory
  presets single audio output to single ableton track, and multiout presets
  featuring 18 ableton drum racks for all presets in multiple audio channel
  output from the plug in to multiple ableton audio tracks using the multi
  output ableton template also provided.


  Use the template racks and extend to your own toontrack ezdrummer modern kit
  presets, swapping out individual sounds or articulations. You are 100% ready
  to go with the factory presets but there is no limitation to creating your own
  presets from these templates.
specs: |-
  - 36 ableton drum racks
  - Color coded pad design
  - Individually labelled drum rack pads
  - Mapped ableton macros to ezdrummer macros
  - Singleout presets with 18 ableton drum racks
  - Multiout presets with 18 ableton drum racks
  - Multiple audio channel output
  - Ableton push 2 color pads mode
  - Ableton live 9.5 or above
  - Toontrack ezdrummer2 required
  - Toontrack ezdrummer modern kit pack required
