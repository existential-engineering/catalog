description: Analog lab offers the ability to do fast and simple editing and
  customizing of your presets, but it doesn't stop there.
details: |-
  Analog lab offers the ability to do fast and simple editing and customizing of your presets, but it doesn't stop there. Owners of the original individual synthesizer software products or v collection can open one of those sounds in analog lab and edit it in the original software, and then add it to their library.

  Our new multi mode allows you to create amazing layers and splits and then shape, warp and twist them with 17 high-quality effects. Analog lab will take your sound and workflow to a new level.

  When you need high-quality synthesizer or electronic keyboard sounds that you can tweak in-depth and combine, analog lab is the go-to solution.

  Analog lab v is perfect for any one interested in quick access to 11k and more presets from arturia's v collection synths. Even if you have some or all instruments it's a great tool for searching sounds across the collection. Focusing on sound rather than specific instrument is a great way to focus on what matters most. The power of this tool is the ease of use, search and filters of the presets but you can tweak the sounds and create layered sounds which is very useful.
specs: |-
  - VST plugin
  - Audio units plugin
  - VST 3 plugin
  - AAX plugin
  - Multi mode
  - 17 high-quality effects
  - Preset editing and customizing
  - Layer and split creation
  - 11k+ presets
  - Preset search and filters
  - MIDI control support
  - Controller template system
