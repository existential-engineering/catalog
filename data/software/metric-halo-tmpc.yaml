details: |-
  TMPC is a model of the unique signal path character of the front end of producer Terrace Martin's MPC3000, built by Metric Halo in collaboration with Make Believe Studios.

  The MPC has long been a key part of Terrace Martin's production process. The device is valued for its distinctive 16-bit converter sound, which imparts a character and impact often described as knock to drums and samples.

  It is designed for songwriters, producers, musicians, beat makers and multi-instrumentalists, and adds that hip hop knock plus finely controllable layered distortion and character to everything from drums and bass to vocals, as if the material had been sampled that way right at the source. A single drive control tunes the amount of knock.

  The interface size is adjustable, and the MH Preset Manager provides cross-platform presets. Licensing requires an iLok.com account, each license includes two activations, and the license may be installed on the machine, on an iLok dongle or in the iLok Cloud, with one license covering all supported platforms.
specs: |-
  - Faithful recreation of the front end of Terrace Martin's MPC3000
  - Simple to use, tune the drive for the perfect knock
  - Adjustable UI size
  - MH Preset Manager provides cross-platform presets
  - macOS 10.10 or newer, Intel processor or Apple Silicon, 64 bit
  - Windows 7 or newer, Intel processor, 64 bit
  - AU, VST 2 and 3 or AAX (Pro Tools 11 and newer Native) host on macOS
  - VST or AAX (Pro Tools 10, 11 and 12 and Native) host on Windows
  - iLok.com account required, license includes two activations
