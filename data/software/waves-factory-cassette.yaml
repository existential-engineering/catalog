description: "Tape emulation plugin designed to replicate the character of
  cassette tape recording. Captures the organic imperfections and sonic
  qualities of analog cassette tape with four modeled tape types."
details: |-
  Four modeled cassette tape types (I, II, III, IV) with different sonic characteristics. Tape saturation and frequency response emulation. Wow, flutter, and hiss simulation. Randomness parameters for natural variations. Modular settings panel. Re-Cassette parameter for multiple processing passes. Mix parameter. No iLok required.
specs: |-
  Version 1.0.7. macOS 10.9+ (Intel and Apple Silicon native). Windows 7/8/10. 64-bit only.
