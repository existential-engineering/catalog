description: Cassette is an audio plugin (VST, VST3, AAX, AU) that imparts the unique sound of a real cassette tape, with a high quality tape simulation algorithm.
details: |-
  An entire generation heard the music that shaped their lives on cassette tape, at home, in the car or on a Walkman. Cassettes are far from perfect, and Cassette is a tribute to that imperfect sound.

  Cassette has been carefully modelled after exhaustive analysis of a high number of sound signals recorded into real tapes. As a result, it has the same sound and behaviour as the original unit. Magnetic tape is not a sterile media, and some of these non-linear effects are unpredictable, which make the signal sound more natural and alive.

  All four cassette types available are modelled, each one delivering different sonic characteristics. Type I was the standard and most compatible format, with a ferric-oxide coating, first appearing in the 1960s. Type II, a chromium dioxide formulation, was introduced at the dawn of the 1970s with an undeniable increase in high frequency response. Type III, the ferro-chrome, lived a short period between the mid 70s and early 80s. Type IV, metal-formulated, hit the scene at the end of the 70s and features firmer bass as well as louder high frequencies.

  Magnetic tape imparts its own sound signature to signals recorded into it, including different frequency response, frequency dependent saturation, high-frequency compression, hiss and asperity noise. Reproduction systems also induce their fingerprint: wow, flutter, random high-frequency loss, crosstalk and stereo unbalances. All of these little quirks and random fluctuations have been modelled meticulously in Cassette.

  There's much more under the hood than what you see at a first glance. In the settings panel you are able to fully control all the parameters that make tape sound like tape.
specs: |-
  - Emulation of the four cassette tape types (I ferric-oxide, II chromium dioxide, III ferro-chrome, IV metal)
  - Modular tape processing, with each step of the chain able to be enabled or disabled
  - Stability parameter with internal controls, including randomness
  - Artifacts parameter with internal controls, including Random Snap for simulating the tape being caught momentarily
  - Re-Cassette parameter that runs the processing several times
  - Models frequency dependent saturation, high-frequency compression, hiss and asperity noise
  - Models wow, flutter, random high-frequency loss, crosstalk and stereo unbalances
  - Mix parameter and power button
  - Artist presets by Torley and Insight
  - No iLok or challenge response, registration by serial number
  - macOS 10.9 or higher, Intel and M1/Apple Silicon natively supported, 64 bit DAW and OS
  - Windows 7, 8 or 10, 64 bit DAW and OS
