description: Advanced Noise Gate is a software plugin effect. It functions not
  only as a gate for noise reduction, but also as a tool for artistic sound
details: |-
  Advanced noise gate features equalizers for both the input signal and the
  output signal. For the output signal, an additional equalization setting is
  applied to the gate when it is in the closed state. This allows the gate to
  toggle between two equalization settings, and it is equivalent to multi-band
  range control.

  Advanced noise gate also includes four parameters that control the gate based
  on time, logic, and probability. This results in unique creative possibilities
  not found in other products.

  Advanced noise gate also incorporates special anti-clicking technology. Noise
  gates can create a clicking noise when using short attack times. In contrast,
  advanced noise gate never produces a clicking noise, even when using attack
  times under 1ms.
specs: |-
  - Anti-clicking gating algorithm
  - Attack delay
  - Early gate release
  - Probabilistic muting
  - Time-based muting
  - Two attack envelopes
  - Mono, stereo, and various surround sound formats
  - Control signal equalization
  - Dual state output signal equalization
  - Independent and linked channel processing
  - Level detection using both peak and rms
  - Side chaining
  - Ducking
  - Windows
