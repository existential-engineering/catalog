details: |-
  Instantly improve the audio in your videos. Import a video and the app
  immediately cleans its sound and maximizes its volume.

  Choose from 11 filters to clean your audio: mild wind removal, hard wind
  removal, mild hiss removal, strong hiss removal, audio fix mild, audio fix
  medium, audio fix strong, audio fix ultra, silence, audio smoother, and volume
  booster.

  Extract the audio from your video, strip your video of its audio, save as new
  or compress for sharing, and easily compare to your original video. We never
  overwrite your original.

  Save as a new video in the same resolution. You can also use audio fix to
  reduce the file size of your video for easier sharing with the compress video
  option.

  Audiofix: for videos is a mobile audio app and a software application for ios
  that functions as a standalone application. Universal app - buy on iphone, own
  it on ipad too.
specs: |-
  - Automatically optimizes audio in videos
  - 11 audio filters
  - Audio extraction capability
  - Audio removal capability
  - Video compression for sharing
  - Original video comparison
  - iOS 8.0 or later
  - Universal app - iphone and ipad
