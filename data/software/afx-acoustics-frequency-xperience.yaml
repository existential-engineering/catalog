details: |-
  AFX is a drum machine that works with .sf2 files. We got some acoustic samples
  and we have transform them in the digital world in order to create unique
  sounds for you to include in your productions.

  The drum machine has 8 slots that load the soundbanks we provide: bassdrums,
  clshats, cymbals, digital snares, ophats, snares, toms. Each of these slots
  also has a distortion station and a state variable filter.

  The plugin sounds good, and you have enough options to personalize the sounds.
  Simply load the respective sfz bank into the corresponding slots, then you can
  per slot, e.g. Bd or snare etc. Through the different samples, and these with
  the filters, pitch, etc to suit your personal taste.
specs: |-
  - 8 drum slots
  - Sf2 file support
  - Distortion station
  - State variable filter
  - Pitch control
  - Drum kit bank save function
