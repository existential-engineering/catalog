description: MAP is a software synthesizer inspired by West Coast modular synthesis traditions, particularly drawing from the 1970s experimental ethos of Serge, Buchla, and modular systems. A sonic playground for the curious that emphasizes hands-on exploration and sound design flexibility.
details: |-
  MAP is a West Coast/Buchla/Serge-inspired synthesizer featuring a triple oscillator configuration with waveshaping and frequency modulation capabilities.

  The synthesis engine includes dual filters — a five-band resonant EQ and a multimode filter (series/parallel routing) — alongside three looping envelopes and three drawable LFOs, plus MPE support and a noise-powered random LFO.

  A generative polyphonic arpeggiator with XY Pad-based exploration enables non-linear sound design. Custom delay, reverb, and character effects (Colour, Time, Space modules) round out the signal chain.

  Includes 300+ factory presets and a 7-day trial with 100+ alpha patches.
specs: |-
  - Triple oscillator with waveshaping and FM
  - Dual filters: five-band resonant EQ and multimode filter
  - Three looping envelopes and three drawable LFOs
  - MPE support
  - Nine-type noise source
  - Generative polyphonic arpeggiator with XY Pad
  - Custom delay, reverb, character effects
  - 300+ factory presets
  - Fully-scalable UI with dark/light themes
  - mac: macOS 10.15+, Intel & Apple Silicon, 4GB RAM
  - windows: Windows 7+, 4GB RAM
