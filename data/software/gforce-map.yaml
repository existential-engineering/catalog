description: MAP is a software synthesizer inspired by West Coast modular
  synthesis traditions, particularly drawing from the 1970s experimental ethos
  of Serge, Buchla, and modular systems. A sonic playground for the curious that
  emphasizes hands-on exploration and sound design flexibility.
details: |-
  Born from the lineage of Serge, Buchla, and modular synthesis, MAP embodies the fearless spirit of sound explorers who broke every rule in pursuit of the new. It captures that radical 1970s experimentation and reimagines it for today, offering an instrument where vintage soul collides with modern innovation. MAP is not just a synthesiser, it's a sonic playground for the curious. With shimmering oscillations, rich modulation, and effects that ooze colour and character, it invites you to step off the beaten path and into a world of discovery.

  At MAP's heart are three unique oscillators, including a dedicated modulation oscillator, that echoes the West Coast ethos of deep, flexible tone-shaping. You can twist amplitude, frequency, and waveshape into entirely new forms, then run them through dual filters: a five-band resonant EQ and a versatile multimode filter, in series or parallel. Add a nine-type noise source for grit and atmosphere, and you're working with raw sonic clay ready for adventure.

  True to its modular roots, MAP is built for play. Oscillator and filter sections come with interchangeable presets, each with fresh XY Pad macros for expressive control. A single gesture can transform your patch from subtle shimmer to wild, chaotic eruption.

  MAP isn't modular in the traditional patch-cable sense, but it's far deeper and much faster than it first appears, and you never need to connect a single cable. Think of it as a modular synth where every destination is already pre-patched to every source, with an attenuverter and inverter available almost everywhere. Just select a parameter and move a fader in the Modulation window. The 'cables' are already there under the hood.

  With three looping envelopes, three drawable LFOs, MPE support, and a noise-powered random LFO, your sounds gain organic unpredictability. A polyphonic generative arpeggiator fuels instant melodic inspiration, while a clean, intuitive modulation matrix keeps the wildest patches under your command. And then come the effects: Colour to split, sculpt, or devastate your frequencies; Time, a flexible quad delay that reshapes rhythm; and Space, an ocean of grains and reverb for immersion and vastness.
specs: |-
  - Triple oscillator with waveshaping and FM
  - Dual filters: five-band resonant EQ and multimode filter
  - Three looping envelopes and three drawable LFOs
  - MPE support
  - Nine-type noise source
  - Generative polyphonic arpeggiator with XY Pad
  - Custom delay, reverb, character effects
  - 300+ factory presets
  - Fully-scalable UI with dark/light themes
  - mac: macOS 10.15+, Intel & Apple Silicon, 4GB RAM
  - windows: Windows 7+, 4GB RAM
