description: Moon Echo is a free delay based on a communications technique that
  uses the closest cosmic neighbor, the moon, as a reflector for radio waves.
details: |-
  The seventh AudioThing collaboration with Berlin-based musician Hainbach listens to the stars: Moon Echo is a free to download delay based on a communications technique that uses the closest cosmic neighbor, the moon, as a reflector for radio waves. This results in some rather crunchy and lively echoes, modulated by the movement of Earth and moon. The moon's surface is an imperfect mirror and creates artifacts, unlike any other echo technique. Moon Echo is both a musical lo-fi effect and a playful tool for teaching about space.

  That the moon can be an odd reflection in radio broadcasting was discovered by German radio operators during the Second World War, but it was only after the war that moon bouncing was developed as a communications technique. Composer Pauline Oliveros is the most notable composer working with the moon in her music: her composition "Echoes from the Moon", first realized in 1987, saw her duet the moon with a conch shell, tin whistle, and accordion. She expressed regret that the process was either send or receive, so the moon could not be used as a true delay line.

  With the help of Martine-Nicole Rojina, Hainbach got in contact with CAMRAS in Dwingeloo, who work with a big radio telescope dish. They agreed to make this historic instrument available for a moon bounce, allowing Hainbach to send test signals, voice and human test tones by sopranist Johanna Vargas and double bassist Paul Cannon, as well as signals from his supporters on Patreon, to the moon. That gave a much more varied set of samples to model Moon Echo on than simple test beeps and sweeps could have done.

  On the first try keep the transmit setting on and stay in Duplex mode, which gives two dishes, one that sends and one that receives. Moon Echo will act as any other musical delay, and it can be rewarding to adjust doppler shift while playing with delay time and feedback to create endlessly modulating soundscapes. Switching to simplex mode puts you in radio transmission mode with a single dish that either sends or receives, and pressing "Ping Moon" makes the plugin connect to NASA for the accurate current distance to the Moon.

  Moon Echo is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP), and on the App Store for iPhone and iPad as an AUv3 plugin and Standalone (IAA).
specs: |-
  - Emulation of radio transmitter input and output stage
  - Emulation of automatic leveling circuitry
  - Emulation of moon bounce phase and frequency shift
  - Simplex and duplex transmission modes
  - Accurate daily moon distance data via NASA's Horizons System
  - Doppler shift adjustment
  - Variable delay time
  - Variable "Moon Dust" noise
  - Feedback control
  - Resizable Window
  - Preset system with randomizer
  - Brightness and Contrast Controls
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP 64-bit)
  - macOS 10.13 - macOS 13, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP 64-bit)
  - Freeware, account required to download, no iLok
