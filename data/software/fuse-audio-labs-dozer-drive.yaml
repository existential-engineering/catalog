description: A dual guitar pedal emulation combining the 1966 Dallas Arbiter Fuzz Face and the 1979 Ibanez Tube Screamer. Flexible routing in series or parallel with switchable germanium and silicone transistor modes, covering everything from smooth overdrive to gnarly fuzz.
details: |-
  Dual pedal emulation combining the Dallas Arbiter Fuzz Face (1966 circular fuzz) and the Ibanez Tube Screamer (1979 green overdrive). Routing modes: series (fuzz into overdrive, or reversed), parallel (blend both simultaneously). Transistor switch: silicone for tighter, more aggressive character; germanium for warmer, more vintage fuzz response. Zero-latency for live performance. Optional oversampling (32 samples latency when enabled).
specs: |-
  - Controls: Fuzz (Fuzz Face section — Volume, Fuzz, Transistor Type), Drive (Tube Screamer section — Overdrive, Tone, Level), Routing switch (series/parallel)
  - Latency: zero-latency (oversampling adds 32 samples)
  - macOS 10.12+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+, 2 GHz Intel CPU+, 2 GB RAM, 1280x1024 display
  - Formats: VST2, VST3, AU, AAX
  - Copy protection: serial number
