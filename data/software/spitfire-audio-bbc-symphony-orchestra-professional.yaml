description: "In partnership with bbc studios and the world-famous bbc symphony orchestra, Spitfire Audio has finally been able to capture what no other sample library has before: the musical synergy of a family of astoundingly accomplished players with a 90-year heritage of performances and recordings, deep sampled at London's famous maida vale studios home of the bbcso, and host to the beatles, hendrix and bowie."
details: |-
  An industry standard, universal starting point for composers and music creators of every level, this all-in-one sample library features strings, brass, woodwind and percussion performed by the world-renowned BBC Symphony Orchestra, captured at London's famous Maida Vale Studios, host to The Beatles, Hendrix and Bowie, and countless film scores.

  This definitive collection of orchestral instruments captures a musical synergy from a collective of astoundingly accomplished players with over 90 years of heritage, made playable by all via our award-winning plugin designed by ustwo. Start scoring with a wide range of articulations for each instrument, captured at the highest quality with a stunning selection of professionally mixed signals.

  Professional is the definitive, comprehensive collection for writing professional, world-class orchestral music: 67 different instruments (including groups and soloists), 468 techniques, 45 legatos including new Extended Legatos, and 20 signals. Over a decade of sampling experience went into a library comprising over 200 hours of recordings and more than 1,000,000 samples.

  The eleven microphone positions give you much more than the standard Close, Tree, Ambient and Outriggers: Mono mics used by the BBC since the 1930s for a vintage sound, Leader mics placed above the leader in each section for a more intimate sound, Stereo Coles 1438s, Close Wides, Balcony mics for even more distance, Sides for the widest sound, and Atmos for Dolby Atmos mixing. On top of those sit five spill signals, microphones left open from other sections, plus two out-of-the-box stereo mixes by Jake Jackson.

  The BBC Symphony Orchestra series comes in three editions, and each is fully interchangeable through Spitfire's mode switching technology, making it easier to share and collaborate with fellow composers regardless of which edition they own.
specs: |-
  - 67 different instruments, including groups and soloists
  - 468 techniques
  - 45 legatos including new Extended Legatos
  - 20 signals: 12 microphone positions, 5 spill microphones and 3 mixes
  - Microphone positions: Mono, Close, Tree, Outriggers, Ambient, Balcony, Leader, Stereo, Mids, Sides, Close Wide Pan
  - Spill microphones: Strings, Woodwinds, Brass, Percussion, Full
  - Mixes: Mix 1 (Full), Mix 2 (Jake Jackson), Atmos (front and rear)
  - Over 200 hours of recordings, more than 1,000,000 samples
  - Recorded at Maida Vale Studios, London
  - Housed in the dedicated Spitfire Audio plugin designed by ustwo, no third-party sampler required
  - Mode Switching for interoperability with the Discover and Core editions
  - Latest update adds around 36GB of new content, new Muted Brass techniques, new Cimbasso and an Extended Legato update
  - 630.3 GB download size, 632.00 GB disk space required during install
  - macOS 11 to 26, Intel and Apple Silicon/ARM supported, 64-bit only
  - Windows 10 or Windows 11, 64-bit only
  - Minimum 2.8GHz i5 quad-core (or AMD Ryzen 5) with 8GB RAM, recommended 2.8GHz i7 six-core (or AMD Ryzen 7) with 16GB RAM
  - Single user licence, installable on up to two computers at a time
