details: |-
  808 Lab lets you play with the sound of the tr-808 as a chromatic instrument. Each tonal sound of the 808 has been tuned to perfection so you can play your favorite 808 sounds in key with your track using your piano roll.

  You can easily create 808 basslines with it. Unlike the original machine, you have full control of each drum sound: easily shape and modify their tonal quality with the easy to use interface.

  Just select the sound you want, shape it and you're set.

  808 lab by samplescience is a virtual instrument audio plugin for macos and windows.
specs: |-
  - 64-bit VST plugin instrument
  - All 16 original 808 sounds
  - Tonal shaper
  - Amp floor and ceiling controls
  - Saturation
  - Reverb
  - Windows 8.1/10 compatible
  - macOS el capitan to mojave compatible
  - 12.4 MB hd space required
  - Quad-core CPU or better
  - 4 GB RAM or more
  - 64-bit vsti/aui host required
