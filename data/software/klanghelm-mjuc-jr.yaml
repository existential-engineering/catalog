description: MJUC jr. is a freeware variable-tube compressor plugin, the little brother of Klanghelm's MJUC. It is a variable-mu design with two gain stages and interstage transformer simulation, capable of smooth leveling as well as heavy pumping effects.
details: |-
  MJUC jr. is the little brother of the colorful MJUC. It is a variable-mu design with lots of vibe, capable of smooth leveling but also heavy pumping effects. With its two gain stages and interstage transformer simulation it offers a very deep and lively soundstage.

  The three-position timing switch not only controls the attack and release times of the unit, but also the slew rate of the transformers and the timing of the other parts of the circuitry, that are directly influencing the generated harmonics (saturation).

  MJUC jr. is a mix of Mk1 and Mk2 of its big brother MJUC. It combines the very natural, dense compression characteristics of the early days of this type of compression with a more forward sounding approach and more harmonics creating of the variable-mu comps of the early 1960s.

  MJUC jr. is freeware. Klanghelm notes that the correct technical term for this kind of compression is variable-mu, but since that term is a registered trademark of Manley Labs, the product is described as a variable-tube compressor instead.

  The plugin runs on Windows 10 or higher and macOS 10.13 or higher, on Intel Macs and Apple Silicon natively, and Klanghelm plugins use no copy protection at all.
specs: |-
  - Variable-mu (variable-tube) compressor topology
  - Two gain stages with interstage transformer simulation
  - Three-position timing switch controlling attack and release times
  - Timing switch also sets transformer slew rate and circuit timing, shaping the generated harmonics (saturation)
  - Voiced as a mix of MJUC Mk1 and Mk2 character
  - 64-bit VST, VST3, Audio Units and AAX Native plugin formats
  - Windows 10 or higher, 64-bit VST or VST3 host (Pro Tools 11 or higher for AAX)
  - macOS 10.13 or higher, 64-bit VST, VST3 or Audio Unit host (Pro Tools 11 or higher for AAX)
  - Intel Mac and Apple Silicon supported natively
  - No copy protection
