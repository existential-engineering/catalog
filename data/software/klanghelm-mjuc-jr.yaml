description: "Free variable-tube compressor plugin and the smaller version of
  MJUC. Employs variable-Mu design capable of smooth leveling and heavy pumping
  effects. Features two gain stages with interstage transformer simulation,
  three-position timing switch affecting attack, release, slew rate, and
  harmonic generation. Combines characteristics from Mk1 and Mk2 models of the
  full MJUC."
details: |-
  Variable-Mu compression design
  Two gain stages with interstage transformer simulation
  Three-position timing switch affecting attack, release, slew rate, and harmonic generation
  Combines Mk1 and Mk2 characteristics from full MJUC
  Natural, dense compression characteristics
  Smooth leveling to heavy pumping effects

  1.5.0
