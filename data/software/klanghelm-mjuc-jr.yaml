description: MJUC jr. is a free variable-tube compressor plugin and the little brother of MJUC, offering smooth leveling to heavy pumping effects via a variable-mu design with two gain stages and interstage transformer simulation.
details: |-
  MJUC jr. is the little brother of the colorful MJUC plugin. It is a variable-mu design with lots of vibe, capable of smooth leveling but also heavy pumping effects. With its two gain stages and interstage transformer simulation it offers a very deep and lively soundstage.

  The three-position timing switch not only controls the attack and release times of the unit, but also the slew rate of the transformers and the timing of the other parts of the circuitry, that are directly influencing the generated harmonics (saturation).

  MJUC jr. is a mix of Mk1 and Mk2 of its big brother MJUC. It combines very natural, dense compression characteristics of the early days of this type of compression with a more forward sounding approach and more harmonics creating of the variable-mu comps of the early 1960s.

  MJUC jr. is freeware.
specs: |-
  - Variable-mu compression topology
  - Two gain stages with interstage transformer simulation
  - Three-position timing switch controlling attack, release, slew rate, and harmonic generation
  - Hybrid design combining Mk1 and Mk2 characteristics from MJUC
  - No copy protection
