url: https://ddmf.eu/metaplugin-chainer-vst-au-rtas-aax-wrapper/
description: "A plugin wrapper and chainer that loads other plugins to build
  custom effect networks, enabling VST/VST3/AU effect chaining with included
  tools like mid-side matrix, fourband crossover, and routing plugin."
details: |-
  Up to 8 individual channels (effect version) or 16 stereo output buses (instrument version)
  Double precision audio processing
  Stereo sidechain input
  Plugin organizer with drag-and-drop interface
  32/64-bit internal bridge
  Intel to Apple Silicon bridge (v4.0+)
  Up to 16x oversampling (realtime) / 64x (offline)
  Parameter automation (up to 100 parameters)
  Full plugin delay compensation
  Freely resizable window
  Included: mid-side matrix, multiband splitter, cross-track routing, A/B switch, 8x2 mixer, MIDI filter, FunctionPlugin
specs: |-
  - Effect version: up to 8 individual channels (surround/multichannel)
  - Instrument version: up to 16 stereo output buses
  - Double precision audio processing (DAW/format permitting; not AU)
  - Additional stereo sidechain input
  - Convenient plugin organizer: scan once, drag and drop to graph
  - Auto-connect option
  - Internal 32/64-bit bridge with seamless plugin window integration
  - Intel-to-Apple Silicon bridge (since v4.0)
  - Support for native Apple Audio Unit plugins
  - Per-plugin dry/wet ratio adjustment
  - Per-plugin individual bypass
  - Full plugin delay compensation
  - Automate up to 100 parameters with parameter learning
  - Negligible additional CPU overhead
  - MIDI support: load and play synths with any MIDI control
  - Up to 16x oversampling (realtime); up to 64x (offline/rendering)
  - Included: mid-side matrix, multiband splitter, cross-track send/receive, A/B switch, 8x2 channel mixer, MIDI channel filter, FunctionPlugin
  - Custom color palette support
  - Freely resizable plugin window
  - Format conversion: VST/VST3-to-AAX, AU-to-AAX, VST-to-AU, AU-to-VST
  - Platforms: Windows 32/64-bit (VST/VST3/AAX); Mac OS X 10.13+ 32/64-bit (VST/VST3/AU/AAX)
