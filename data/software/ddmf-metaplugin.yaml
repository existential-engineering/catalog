url: https://ddmf.eu/metaplugin-chainer-vst-au-rtas-aax-wrapper/
description: "A plugin wrapper and chainer that loads other plugins to build
  custom effect networks, enabling VST/VST3/AU effect chaining with included
  tools like mid-side matrix, fourband crossover, and routing plugin."
details: |-
  Up to 8 individual channels (effect version) or 16 stereo output buses (instrument version)
  Double precision audio processing
  Stereo sidechain input
  Plugin organizer with drag-and-drop interface
  32/64-bit internal bridge
  Intel to Apple Silicon bridge (v4.0+)
  Up to 16x oversampling (realtime) / 64x (offline)
  Parameter automation (up to 100 parameters)
  Full plugin delay compensation
  Freely resizable window
  Included: mid-side matrix, multiband splitter, cross-track routing, A/B switch, 8x2 mixer, MIDI filter, FunctionPlugin
