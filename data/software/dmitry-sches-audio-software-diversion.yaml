description: "Diversion is a versatile, high quality software synthesizer,
  designed for use in any genre of professional electronic music production.
  Diversion takes the full advantage of modern processors to bring you the
  perfect sound quality that fits standards of hardware synthesizers."
details: |-
  1.41

  32-bit and 64-bit

  4 oscillators with wide range of waveforms, near-zero aliasing, X/Y timbre parameters

  Stereo filters with many modes in 2 bus processors

  2 flexible FX lines with up to 8 effect instances each

  4 LFOs, 4 ADSR Envelopes, 4 MSEGs, XY Master Morph controller, Modulation Matrix

  Up to 8X oversampling within processing path

  32-step Arpeggiator/Sequencer

  16-step Trance Gate module

  2 bus processors with stereo filter, distortion and LO-FI sections

  Comprehensive Wavetable Editor for single cycle WAV files with time/frequency editing

  FM synthesis
  RM synthesis
  Wave shaping
  Wavetable editing
  Granular synthesis
  Sample playback
  Audio recording
  Up to 8X oversampling
specs: |-
  - Modern processor with SSE3 support (Intel Core i5 or i7 recommended)
  - Windows Vista or higher
  - OSX 10.9.X or higher
  - VST 2.4 or AU compatible host software
