description: Diversion is a versatile, high quality software synthesizer, designed for use in any genre of professional electronic music production. Diversion takes the full advantage of modern processors to bring you the perfect sound quality that fits standards of hardware synthesizers.
details: |-
  Diversion is a versatile, high quality software synthesizer, designed for use in any genre of professional electronic music production. Diversion takes the full advantage of modern processors to bring you the perfect sound quality that fits standards of hardware synthesizers.

  Diversion offers 4 oscillators with a wide range of different waveforms with a near to zero level of aliasing. The oscillators generate sounds in real-time using algorithms that don't degrade sound quality at high frequencies. All waveforms have two independent parameters X and Y allowing timbre adjustment. The oscillators also feature FM, RM, wave shaping and filtering. Since version 1.2, Diversion offers a comprehensive Wavetable Editor for loading arbitrary single cycle WAV files and editing waveforms in time and frequency space. Since version 1.3, Diversion provides sample playback with granular synthesis and output audio recording.

  Two bus processors in Diversion allow transforming the oscillators' output into a wide variety of possible sounds. Each bus processor consists of a stereo filter with many modes, distortion and a LO-FI section, supporting genres such as Trance, Psy, Dub Step and Ambient.

  Diversion uses two flexible FX lines for separated processing of each bus processor's output, with up to 8 effect instances stackable per FX line. Oversampling up to 8X is used throughout the processing path (excluding FX) to minimize aliasing.

  Many parameters can be modulated by 4 LFOs, 4 ADSR Envelopes, 4 MSEGs and one XY-controller called Master Morph, along with a Modulation Matrix; automation and MIDI controllers are supported. Diversion also features a 32-step Arpeggiator/Sequencer and a 16-step Trance Gate module.
specs: |-
  - Modern processor with SSE3 support
  - Windows Vista or higher
  - OSX 10.9.X or higher
  - VST 2.4 or AU compatible host software
  - Recommended: Intel Core i5 or i7 (audio engine may consume lots of CPU power)
  - Formats: VST/AU, 32/64bits
  - Demo limitation: noise sample played every 90 seconds
