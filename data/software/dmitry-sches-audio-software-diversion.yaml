description: Diversion is a versatile, high quality software synthesizer, designed for use in any genre of professional electronic music production. Diversion takes the full advantage of modern processors to bring you the perfect sound quality that fits standards of hardware synthesizers.
details: |-
  Diversion offers 4 oscillators with a wide range of different waveforms with a near to zero level of aliasing. The oscillators generate sounds in real-time using proprietary algorithms that don't degrade sound quality at high frequencies. All waveforms have two independent parameters X and Y allowing timbre adjustment, and the oscillators also feature FM, RM, wave shaping, and filtering synthesis techniques.

  Since version 1.2, Diversion offers a comprehensive Wavetable Editor that allows loading arbitrary single-cycle WAV files. Waveforms can be edited in both time and frequency space with various effects applied. Since version 1.3, Diversion also provides sample playback with granular synthesis and output audio recording.

  Two bus processors in Diversion allow transformation of oscillator output into a wide variety of sounds. Each bus processor consists of a stereo filter with many different modes, distortion, and a LO-FI section, supporting popular styles including Trance, Psy, Dub Step, and Ambient.

  Diversion uses two flexible FX lines for separated processing of each bus processor's output. Up to 8 effect instances can be stacked in one FX line. Oversampling up to 8X is applied throughout the entire processing path (excluding the FX section), ensuring minimal aliasing even after non-linear processing.

  Many parameters in Diversion can be modulated by 4 LFOs, 4 ADSR Envelopes, 4 MSEGs, and one XY-controller called Master Morph, all configurable via a Modulation Matrix. Diversion also features a 32-step Arpeggiator/Sequencer and a 16-step Trance Gate module, MIDI controller support, and host automation.
specs: |-
  - Modern processor with SSE3 support required
  - Recommended: Intel Core i5 or i7 (high CPU consumption)
  - Windows Vista or higher
  - macOS 10.9.X or higher
  - VST 2.4 or AU compatible host software
  - 32-bit and 64-bit support
