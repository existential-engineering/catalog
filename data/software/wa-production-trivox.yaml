description: Trivox is a harmony effect plugin with three voices, each tunable from -12 to +12 semitones and carrying its own level control. Voices can be locked to one of 20 scales or left chromatic, with unison, detune and spread controls for wide stereo harmonies.
details: |-
  Trivox is an audio effect plugin that adds harmony voices to any type of source material, aimed at producers, musicians and sound designers.

  Three harmony voices can each be tuned anywhere from -12 semitones to +12 semitones, with independent level controls for balancing the blend. Harmonies can be locked to a choice of 20 scales, or left in chromatic mode for unrestricted intervals.

  A Super Unison feature works alongside the Detune and Spread settings to build wide stereo results, and a character slider moves the voices between a synthetic and an organic tone. Dry, wet and output gain knobs set the balance between the original sound and the harmonies.

  Workflow features include copy, paste, undo and redo, a randomizer that introduces unexpected harmony settings, a preset browser for auditioning and loading presets, and an A/B option for comparing two sets of effect settings. A global limiter keeps output levels in check and prevents unwanted clipping.

  A full PDF manual and a tutorial video are included, and the plugin is built for responsive, CPU-friendly operation.
specs: |-
  - Three harmony voices
  - Tuning range of -12 to +12 semitones per voice
  - Independent level control per voice
  - 20 scales to choose from
  - Chromatic mode
  - Super Unison knob with Detune and Spread controls
  - Dry, Wet and Output Gain controls
  - Randomizer feature
  - Character slider for organic and synthesized sound
  - Global limiter toggle
  - Copy, paste, undo and redo
  - Preset browser and A/B comparison
  - Factory presets
  - Full PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Intel and Apple silicon CPUs, with native AAX format
