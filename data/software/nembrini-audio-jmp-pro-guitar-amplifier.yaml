description: A plugin emulation of the iconic Marshall JMP-1 preamplifier featuring four uniquely voiced channels (OD1, OD2, Clean1, Clean2) with a complete signal chain including power amplifier, cabinet simulation, impulse response loader, and studio effects.
details:
  - JMP Pro Valve Guitar Amplifier is Nembrini Audio's faithful emulation of the legendary Marshall JMP-1 rack preamplifier, delivering four uniquely voiced channels — OD1, OD2, Clean1, and Clean2 — each capturing the distinct tonal character that made the original unit a studio and stage staple.
  - The plugin includes a fully modeled power amplifier section with four virtual EL34 tubes running in Class AB push-pull configuration, complete with presence and volume controls, giving players the feel and response of a real tube power stage in the digital domain.
  - "A comprehensive built-in effects section covers all essential processing needs: digital delay with Lo-Fi filter and time offset, analog modulations (chorus and tremolo), hall reverb, pre/post amplifier low and high-cut filters, an analog noise gate tuned specifically for guitar and bass, and a studio compressor."
  - The cabinet section offers six guitar cabinet options with four microphone emulations, each supporting on/off-axis positioning and continuous position and distance controls. A full mixer with solos, mutes, pans, and faders gives precise control over the final blended tone.
  - An integrated impulse response loader allows up to three third-party IRs to be loaded simultaneously, with per-IR volume, pan, and phase controls and a built-in browser window for navigating IR files — making it easy to blend custom cab sounds with the built-in options.
specs: |-
  - Four voiced channels: OD1, OD2, Clean1, Clean2
  - Power amplifier: four EL34 virtual tubes, Class AB push-pull
  - Six guitar cabinet simulations
  - Four microphone emulations with on/off-axis positioning and continuous position/distance controls
  - IR loader: up to three third-party IRs with volume, pan, and phase controls
  - Digital delay with Lo-Fi filter and time offset
  - Analog modulations: chorus and tremolo
  - Hall reverb algorithm
  - Pre/post amplifier low and high-cut filters
  - Analog noise gate (tuned for guitar/bass)
  - Studio compressor
  - macOS 10.13 or newer, Intel or Apple Silicon
  - Windows 7 or newer
  - 64-bit DAW required
  - 1 GB RAM minimum
  - Version 1.0.8
