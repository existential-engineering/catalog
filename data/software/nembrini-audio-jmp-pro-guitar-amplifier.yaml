details: |-
  Nembrini Audio JMP Pro Guitar Amplifier plugin is based on a Marshall JMP1 preamplifier, offering four voiced channels of pure tone.

  JMP Pro Valve Amplifier drives pure tone into each of its four uniquely voiced channels OD1, OD2, Clean1 and Clean2, powered by four EL34 virtual tubes with presence, volume and power switch in class AB push-pull configuration.

  The effects chain covers a digital delay with a Lo-Fi filter and an offset that creates a time offset in the left and right delay sections, analog modulations with selectable Chorus or Tremolo, and an ambient Hall reverb algorithm.

  Additional processing includes a Cleaner with low and high cut filters pre and post amplifier, an analog noise gate tuned for guitar and bass, and a studio compressor to keep your dynamics in check, whether just thickening the sound or keeping levels consistent.

  Nembrini Audio JMP Pro Valve Guitar Amplifier lets you choose between six different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs. Impulse Loader lets you load up to three third-party impulse responses that you can blend together using volume, pan, phase, solo and mute controls.
specs: |-
  - Preamplifier: four uniquely voiced channels, OD1, OD2, Clean1 and Clean2
  - Power Amplifier: four EL34 virtual tubes with presence, volume and power switch in class AB push-pull configuration
  - Digital Delay: Filter makes the delay Lo-Fi and Offset creates a time offset in left/right delay sections
  - Analog Modulations: selectable Chorus or Tremolo
  - Ambient Reverb: Hall reverb algorithm
  - Cleaner filters: low and high cut, pre and post amplifier
  - Analog Noise Gate tuned for guitar and bass
  - Studio Compressor for dynamics control
  - Cabinets: six different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs
  - Mixer section with Solos, Mutes, Pans and Faders to blend the two microphones with the ambience
  - Impulse Response Loader: up to three third-party impulse responses blendable with volume, pan, phase, solo and mute controls, with a browser window for searching IR files
  - Bypass for the cabinets section and impulse loader
  - Plugin Formats: a VST2, VST3, AAX or AudioUnits compatible host
  - System: an Intel compatible or Apple Silicon CPU, 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
