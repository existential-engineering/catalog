description: "Create fire vocal sounds that inspire and impress. From soft and airy ballads to screaming rock to pitch-tuned choppy trap vocals: VOXCRAFT gets you there, failsafe and fast."
details: |-
  VOXCRAFT is a vocal manipulation plug-in built to turn stale samples into signature sounds, covering everything from soft and airy ballads to screaming rock to pitch-tuned choppy trap vocals.

  The core Voice processor shifts pitch and formant independently to transform tone, gender and texture, from subtle polish to bold, otherworldly vocal designs. Pitch correction locks loops into tune fast, with chromatic, major, minor and pentatonic scales for either transparent correction or stylized tuning.

  Six multi-effect modules follow: Dynamics, Character, Filter, Delay, Reverb and Chopping. They stack, blend and automate to build depth and movement, and the chopper turns a simple vocal into a complex rhythmic texture by running loops and samples through it at a set rate.

  A single click reshuffles everything for happy accidents, and 100 presets are included to kickstart a session.
specs: |-
  - Core Voice processor section for pitch correction, tuning, multiplication and formant shifting
  - Six FX modules with six bespoke vocal-processing modes each: Dynamics, Character, Filter, Delay, Reverb and Chopping
  - One-click random preset generation
  - 100 presets
  - Operating systems: Windows 10 to Windows 11, macOS Big Sur (11) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - 8GB of RAM
  - 0.25GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Automated installation via the UJAM App or a downloadable installer file
  - Authorization via the UJAM App or by entering email and password in the plug-in
  - Supported standards: MIDI
