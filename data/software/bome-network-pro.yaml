name: Bome Network Pro
manufacturer: bome-software
primaryCategory: sequencer
url: https://www.bome.com/shop/bomenetpro
description: This add-on for bome network allows you to set up a MIDI network
  between Windows, macOS, Linux, and iOS devices via Ethernet and via Wifi.
details: |-
  All available computers and devices are auto-detected, and a simple click on
  the connect button (plus confirmation on the remote device) will establish a
  network MIDI connection.

  This software is made for rough live environments. Network MIDI pairings are
  always persistent.

  If a device gets rebooted or temporarily gets unplugged from the network --
  bome network pro will always re-establish the MIDI connection as soon as the
  device is available again.

  MIDI connections to the bomebox also work without this pro add-on.
specs: |-
  - MIDI network setup
  - Ethernet connectivity
  - Wifi connectivity
  - Auto-detection of computers and devices
  - Persistent network MIDI pairings
  - Bomebox integration
