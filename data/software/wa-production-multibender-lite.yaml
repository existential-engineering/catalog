description: A free, reduced edition of the MultiBender delay plugin, released with Computer Music magazine. It splits the signal into three independently adjustable bands, each with its own tempo-synced delay time, feedback and gain, plus saturation, bitcrushing and detuning.
details: |-
  MultiBender Lite is the cut-down edition of the MultiBender delay plugin, produced together with Computer Music magazine. The advanced features and presets of the full version are not included. It is a tempo-synced approach to creative delay processing, aimed at percussion patterns, ping-pong synths and moving lead lines.

  The delay processing is split into three separate modules that can each be adjusted independently. Crossover points are dragged in the waveform display to set the frequency ranges of the three bands, and each band takes its own delay time (including dotted and triplet feel), feedback level and gain adjustment. A short delay can be used on the low end with longer ones on the mids and highs. On and off buttons for each band allow unwanted processing to be disabled, for example to keep a bass line tight or a mid-range clean.

  Each of the three bands also carries three further effects that run entirely independently: saturation, bitcrushing and detuning. Any amount of each can be applied, so harmonics can be added to the upper frequency range, the midrange delay can be detuned for a wavering analog feel, or the low end can be crushed.

  The main window shows what is happening to each of the three bands as audio passes through the plugin. The three coloured waveforms display the effect of each module's processing, which supports monitoring and shaping at every stage of the chain.
specs: |-
  - Tempo-synced delay processing
  - Independent multiband processing for high, mid and low frequency ranges
  - Saturate, Crush and Detune for each band
  - Straight, dotted and triplet delay times
  - Click and pop free bypass
  - Waveform graph for visual feedback
  - Draggable crossover points in the waveform display
  - On and off switch per band
  - Reduced feature set compared with the full MultiBender, without its advanced features and presets
  - Windows 8 and later (32 / 64 bit)
  - macOS 10.15 and later
  - AAX requires Pro Tools 11 or higher
  - Apple Silicon native and arm64 compatible as of version 1.1.0
