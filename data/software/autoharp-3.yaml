details: |-
  Our latest version, autoharp version 3, is more than just an update of the old
  version. Rather, we've re-recorded almost everything, replaced old sounds, and
  implemented a whole host of new features in Autoharp 3. So now you can sound
  even more realistic and you can achieve more complex results.

  Each of the autoharp's 36 strings has been recorded in five different
  articulations. There are four plucked articulations (muted, thumb, hammer,
  rough) and for even more variety we bowed the autoharp with a violin bow.
  Especially this last articulation creates a unique sound. This gives a huge
  variety of different sound combinations.

  A major goal was to simulate the typical strumming of the autoharp. For this
  we have specially developed a new strumming engine. In a step sequencer you
  can decide per step if you want to play a note or not or if you want to play
  the autoharp with dead notes. Of course, all this can be programmed
  dynamically.

  But to achieve this typical autoharp strumming feeling, we included a
  strumming speed control that decides at what tempo the individual strummings
  should occur: from fully quantized to almost glissando. And this is exactly
  what creates a very realistic impression of an autoharp accompaniment.

  Furthermore, we have also applied the unique glissando function of our grand
  harp, as well as the tremolo known to cinematique instruments. There is also a
  pad function, which allows you to play pad sounds with a long attack and a
  short function that will shortens your sounds.
specs: |-
  - 36 strings
  - Five articulations per string
  - Plucked articulations (muted, thumb, hammer, rough)
  - Bowed articulation with violin bow
  - Step sequencer
  - Strumming engine
  - Strumming speed control
  - Glissando function
  - Tremolo
  - Pad function
  - Dead notes
  - Dynamic programming
  - Kontakt 5 compatible
  - macOS and Windows
