description: Expurgate is an advanced noise-detecting, circuit-modeled gate and expander featuring MIDI sample accuracy, zero-latency operation, and linear-phase sub-band processing.
details: |-
  Expurgate is a gate and expander plugin that combines automatic noise detection with circuit models of classic gates. It features an external sidechain with a three-band EQ, sample-accurate MIDI triggering, and a Split EQ with linear-phase crossover for sub-band processing. Additional processing modes include ducking and upward compression, M/S and L/R processing, and zero-latency or oversampled operation. The UI offers both a simplified three-control mode for fast workflow and an advanced precision mode. A built-in spectrum analyzer, 8 A/B preset banks, and full preset management are included. Supported on Windows Vista/7/8/10 (32/64-bit) and macOS 10.7+ including Apple Silicon.
