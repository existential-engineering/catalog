description: Expurgate is an advanced noise-detecting, circuit-modeled gate and expander featuring MIDI sample accuracy, zero-latency operation, and linear-phase sub-band processing.
details: |-
  Expurgate is the most advanced noise-detecting, circuit modelled, MIDI sample accurate, zero-latency, ultra-fast, lookahead, linear-phase sub-band gate. Set the threshold and Expurgate removes your noise.

  It offers state of the art gating and expansion with an automatic noise detector for automatic gating, a quick, simple, ergonomic interface, and circuit models of classic gates. It is configurable from zero-latency, ultra-low CPU operation up to oversampled ultra-high resolution, with ultra-low attack times available when the safety is disabled.

  External sidechain is available for triggered gating, along with global bypass for all instances in a session and sample-accurate MIDI triggering as a gate or ducker. A three-band sidechain EQ and a massively configurable Split EQ are included, alongside a Separated mode allowing fine mixing control, per-channel or ganged control, and M/S and L/R processing.

  Sound features include a linear phase crossover (Split) EQ, a zero-latency minimum phase mode with Linkwitz-Riley crossovers, variable lookahead to avoid losing transients, an oversampling mode to eliminate intermodulation distortions, a full mixer section, ducking and upwards compression, and automatic detection of noise in signals.
specs: |-
  - State of the art gating and expansion
  - Noise detector for automatic gating
  - Circuit models of classic gates
  - Configurable from zero-latency, ultra-low CPU to oversampled ultra-high resolution
  - External sidechain for triggered gating
  - Global Bypass for all instances in a session
  - Sample-accurate MIDI triggering as gate or ducker
  - Three-band sidechain EQ, and massively configurable Split EQ
  - Separated mode, allowing fine mixing control
  - Per-channel or ganged control
  - M/S and L/R processing
  - Linear Phase crossover (Split) EQ
  - Zero-latency minimum phase mode, with Linkwitz-Riley crossovers
  - Variable lookahead to avoid losing transients
  - Oversampling mode to eliminate intermodulation distortions
  - Full mixer section
  - Ducking and upwards compression
  - Freely-resizable UI
  - Mac Retina support
  - 8 A/B banks
  - Intelligent Undo/Redo
