description: Softube's Empirical Labs Professor Punch-Knuckles delivers warm,
  gentle saturation and distortion all the way to forceful, explosive character
  for drums, vocals, and more. Based on ELI Mike-E and the Distressor, this
  saturator plugin features the unmistakable sonic character of Empirical Labs.
details: |-
  If you make a short list of once-in-a-decade modern classics, Empirical Labs Distressor is sure to be on it. The combination of Dave Derr's clever compressor design and the unique, colorful saturation circuits make it a must-have for every recording studio. The Distressor circuit has made its way into other ELI products, such as the versatile preamp/compressor Mike-E. Softube's Empirical Labs Professor Punch-Knuckles plug-in, created in collaboration with Empirical Labs and Dave Derr, is the brilliant but unruly lovechild of Mike-E and the Distressor.

  But don't let the refined and analytical side of Professor Punch-Knuckles fool you; it can crush your audio to pieces. Smooth, warm, and musical, Professor Punch-Knuckles delivers the highest degree of ELI saturation like a sophisticated punch in the gut.

  There's more to the Professor than brute force. With the easy-to-use interface and three distinct types of modeled distortion/saturation, Toasty, Crunchy, and Distress, you can quickly take your sound from warm vintage tones, through gentle breakup, all the way to the classic distortion/compression sound of the Empirical Labs Distressor. Toasty and Crunchy are based on the saturation and preamp distortion of Mike-E. Distress originates from the compressor circuit of the Distressor and Mike-E.

  To deliver a sonic punch in the gut, not a slap to the face, the Professor is equipped with extra tools to shape the sound. These include the unique Mode switch, which utilizes Empirical Labs' emphasis filters on the sound. With this mode, you can easily add the recognizable sound of transformer and tape, making the rough punch smoother and more refined.

  Softube's history of modeling professional gear is long. For over two decades, Softube has collaborated with premium pro audio brands like Empirical Labs, Tube-Tech, Solid State Logic, Chandler Limited, Weiss Engineering, and others. In doing so, it has solidified a track record of recreating indisputable classics in software form that sound precisely like their hardware counterparts.
specs: |-
  - Three classic saturation flavors: Toasty, Crunchy, and Distress
  - The distortion sound of the Distressor
  - Tone shaping options including emphasis filters
  - Mode switch applying Empirical Labs emphasis filters for transformer and tape coloration
  - Easy-to-use and instantly gratifying
  - Supports Softube Extended Features panels
  - Console 1-ready
  - Created in collaboration with Dave Derr and Empirical Labs
  - Available in Flow Mixing Suite, Flow Complete Suite, Empirical Labs Complete Collection 2, and as a standalone plug-in
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Three activations per license
  - 20-day trial, 14-day returns
