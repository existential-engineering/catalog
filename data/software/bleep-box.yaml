description: bleep!BOX is a analog-style drum and synth groove box. It allows
  x0x style sequencing of synthesized percussion and melody parts.
details: |-
  Features include 10 synth / drum parts (aka voices) with emulations of
  'classic' x0x drum sounds (snares, hihats, claps, bassdrums, toms, cymbals).

  Advanced synthesis capabilities include ringmod, fm, phase modulation, and
  sync with 50+ parameters available for sound design.

  Effects processing includes global delay fx and soft / hard distortion fx,
  with 8 waveforms (saw, square, sine, triangle, etc.) for synthesis.

  Performance and workflow features include step sequencing, recording modes,
  parameter automation, live performance modes (loop / stutter, mute), song mode
  to make songs from multiple patterns, and .wav export capability.
specs: |-
  - 10 synth / drum parts
  - X0x style sequencing
  - Emulations of classic x0x drum sounds
  - Ringmod
