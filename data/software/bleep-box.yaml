  - Sync
  - 50+ parameters
  - Global delay FX
  - Soft / hard distortion FX
  - 8 waveforms (saw, square, sine, triangle)
  - Save patches and presets
  - Live performance modes (loop / stutter, mute)
  - Step sequencing
  - Recording modes
