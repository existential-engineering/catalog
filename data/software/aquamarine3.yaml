details: |-
  Acustica Audio is pleased to introduce Aquamarine3 dual, electroluminescent
  optical attenuator plus discrete voltage controlled amplifier, mastering
  compressor upgraded from murano compressor developed as a high-end mastering
  unit, and equipped with several powerful features.

  First compressor is a smooth and warm sounding opto style compressor, simple
  to use with just a threshold and gain make up control, it is great at
  effortlessly controlling dynamic range and to and finesse the signal. Second
  compressor is a discrete vca style which is punchy and can really grab a
  signal. It can go from a subtle 1.2:1 ratio for gentle control and transient
  preserving compression, to a savage "flood" over-limit, to be used for
  creative compression effects.

  Discrete vca compressor has controllable timings to suit many situations and
  with digital technology the attack time has been improved to reach almost zero
  with very low aliasing. One of the exciting new features in aquamarine3 is
  what we call "shmod". This is an adjustable shape control for discrete vca
  compressor attack behavior.

  Another innovative feature that also exponentially increases the versatility
  of this compressor is the look-ahead implementation where the input signal is
  divided, and one side is delayed, the non-delayed signal is used to drive the
  compression of the delayed signal, which then appears at the output. This way
  a smooth-sounding slower attack rate can be used to catch transients.

  Aquamarine3 is based on core8, the revolutionary upgraded multithreading
  technology by acustica audio based into an optimization of core7 in terms of
  high performance but also introduces new and important features like fir/iir
  algorithmic side-chain, and predisposition for fir/iir clipper, and dynamic
  loading.
specs: |-
  - Dual electroluminescent optical attenuator
  - Discrete voltage controlled amplifier
  - Opto style compressor
  - Discrete VCA style compressor
  - Shmod adjustable shape control
  - Look-ahead implementation
  - Core8 multithreading technology
  - Fir/iir algorithmic side-chain
  - Fir/iir clipper predisposition
  - Dynamic loading
  - Threshold control 0 to 23 dB
  - Gain control 1 to 23 dB
  - Look-ahead 0 to 4
  - Attack time 0.1 to 30 ms
  - Release time 0.1 to 1.2 seconds with auto-release
  - Ratio 1.2 to flood
  - Internal side-chain filter at 90 Hz
  - Output level -192 to +6 dB
  - Mix control 100% to 0%
  - Challenge-response authorization system
  - Two computers activation per license
  - VST2 plugin format
  - AAX plugin format
  - AU Audio Units plugin format
  - 32-bit architecture support
  - 64-bit architecture support
  - Os x support
  - Windows support
