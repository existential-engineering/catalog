description: Venom is a spectral processing plugin that freezes incoming audio and transforms it through a hot-swappable chain of seven effects. It covers subtle granular movement, expansive reverbs, frozen spectral tones and heavily altered soundscapes.
details: |-
  Venom is a spectral processing plugin for transforming raw audio, from subtle granular movement through to unrecognisable soundscapes. Included presets act as starting points, with a hot-swappable effects chain, granular sizes and tone shaping available for deeper work.

  Processing happens in two stages. A freeze stage captures and accumulates a snapshot of the incoming sound, applying the audio effects continuously and creating feedback, so the output signal changes over time in the manner of a reverb tail. A direct output stage then applies a user-defined spectral operation to the signal.

  Seven creative effects shape the spectral processing. Focus, Feaze, Decay and Damping are aimed at unusual ambiences, while Mirror, Pitch and Slope generate more experimental spectral transformations. Any combination of the seven can be used together.

  The interface is completely modular, so an individual effect can be dragged into any position in the processing chain to set the order of processing. Multi-core support helps prevent glitches and audio dropouts, and user-controllable spectral resolution parameters allow settings to be tuned for studio, mobile or live use.

  The Venom logo acts as a bypass control for the whole plugin and is smoothed to be click and pop free for A/B testing. Factory presets cover a range of special effects and spectral shaping, are reachable from the menu, and user settings can be saved as presets of their own.
specs: |-
  - Spectral freeze and processing
  - Real-time frequency display
  - Seven individual effects: Focus, Feaze, Decay, Damping, Mirror, Pitch and Slope
  - Hot-swappable FX chain
  - Creative presets for special FX and spectral shaping
  - Click-free bypass control
  - Multicore support for glitch free performance
  - Input, output level and mix controls
  - Full PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Stated host compatibility covers Ableton Live 10 and later, Bitwig Studio 2, Cubase 10, FL Studio 20 (VST, not VST3), Logic Pro X (Mac only), Studio One 4, Maschine 2 and later, Reason, Reaper, Pro Tools 11 and later, and Max/MSP
