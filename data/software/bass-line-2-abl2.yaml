details: |-
  Bass line is kind of a new version of freebee, the free stand alone 303
  emulation, although the engine has been rewritten from scratch and features an
  improved filter and control signal model.

  The sound is authentic to the 303, with subtle movements and proportions that
  change beyond simple filter modulations. The way the accents bob up and down
  slightly, as if on the surface of a liquid; the way the main body/character of
  the sound changes when you adjust the resonance; the clear, wide variation of
  sound, from piercing high-pitched resonant bubbles to dark, chunky rubber.

  Abl affords the luxury of adjusting the internal pots of the simulated 303,
  allowing you to supercharge or tone down the sound to fit the flavour of your
  current project. You can make the cutoff range go out the top of human
  hearing, choose between overdriven filters, or pure liquid sinewave resonance,
  and even simulate flaws such as the vca clicks which occurred on every
  sequencer step.

  Resonance gain compensation gets around volume drop issues by causing the
  oscillator volume to increase in proportion to your resonance. Subtle
  distortions such as simulated filter overdrive, and the internal clipping that
  is caused when the volume knob exceeds 75%, create an output signal almost
  indistinguishable from the real deal.

  Features such as pattern randomization, sequencer swing, and an audio
  detection routine to detect the notes from a source loop, round out the acid
  experience. The gui is bold and iconic without being overly nostalgic, but the
  option is there to skin if so desired.
specs: |-
  - Authentic bass line emulation (monophonic - 1 VCO/1 VCF/1 VCA)
  - Tone generator: 5 octaves range (c1-c5)
  - Two waveforms (sawtooth and square wave)
  - Filter type: low pass resonant
  - Filter range: 20hz-22khz resonance frequency
  - Filter slope: 18 or 24db/octave
  - Envelope control: modulation, decay and accent
  - Decay time approx 0.2 - 3.5 sec
  - Internal step sequencer
  - Pattern memory: 128 patterns
  - 1 to 64 steps per pattern
  - Effects per step: accent, slide and transpose (up/down)
  - Time modes: 16th notes and rest
  - Tempo range: 25-250 bpm or 1-500 bpm in host sync mode
  - Full MIDI cc control with learning function
  - Analog tuning mode
  - Integrated distortion unit
  - High pass filter (low cut)
  - Rebirth rb-338 pattern import
  - Freebee pattern import/export
  - Two MIDI modes (pattern or note)
  - Sample accurate sync to VST host
