description: "A plugin host featuring 4 plugins in serial before a 4x4 multiband
  block with parallel processing capabilities, including a standalone
  application for live software synth playing."
details: |-
  4-band frequency splitter
  Double precision audio processing
  Plugin organizer with drag-and-drop interface
  32/64-bit internal bridging
  Up to 16x oversampling (realtime) / 64x (offline)
  Parameter automation (up to 100)
  Full plugin delay compensation
  Individual plugin bypass
  Standalone application included
specs: |-
  - 4 serial plugin slots → 4x4 multiband block → 4 more serial plugin slots
  - Parallel section in multiband or fullband parallel mode
  - Double precision audio processing (DAW/format permitting; not AU)
  - Plugin organizer: scan once, drag and drop to graph
  - Individual bypass for each loaded plugin
  - Full plugin delay compensation
  - Automate up to 100 parameters mapped to any loaded plugin parameter
  - Internal 32/64-bit bridge with seamless plugin window integration
  - Intel-to-Apple Silicon bridge for non-native plugins in Apple Silicon hosts
  - Support for native Apple Audio Unit plugins
  - Standalone version for software synths and effects without a DAW
  - MIDI support: load and play synths with any MIDI controller
  - Up to 16x oversampling (realtime); up to 64x (offline rendering)
  - Negligible additional CPU overhead
  - Format conversion: VST/VST3-to-AAX, AU-to-AAX
  - Platforms: Windows 32/64-bit (VST/VST3/AAX); Mac OS X 10.13+ 32/64-bit (VST/VST3/AU/AAX)
