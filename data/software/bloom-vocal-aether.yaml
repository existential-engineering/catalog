details: |-
  Bloom Vocal Aether combines vocal loops, one-shots and phrases into a playable
  instrument and has been engineered and curated to provide a stunning sonic
  experience out of the box. Phrases can be triggered, transformed and
  rearranged to add a unique emotional element to your music all in key and in
  time with your project.

  Choose your key signature, select a bank of samples or a preset and trigger
  one of 14 bpm-synced phrases spread across 2 octaves. White notes trigger
  samples and loops, while black notes change properties like playback speed and
  tuning as well as trigger custom-made sequences and effect modulation.

  Bloom vocal aether's edit page lets you take ultimate control over its sample
  material, allowing you to tweak any of the existing sounds and make them your
  own. In the sample edit panel, you can change how the 14 source samples in a
  bank behave, setting sample start and end points, trigger type, playback
  direction and speed.

  Bloom vocal aether's effects include excite audio's proprietary delay, reverb
  and modulation algorithms as well as global filters, tone, dry and wet
  parameters. These rearrangeable effects modules let you refine and transform
  your vocal phrases in a completely new direction.

  Make the bloom instrument your own with the ability to drag and drop audio
  files into it. You can do this via the waveform view on the edit page or any
  empty slot on the banks page. Set the key and bpm of your samples to make them
  integrate seamlessly with the bloom engine.
specs: |-
  - 14 sample keys

  - 5 factory modifiers: half-time, double-time, reverse, octave down, octave up

  - 5 custom modifiers

  - 8 sample banks / 112 vocal phrases

  - Samples synced to host bpm

  - Key selection

  - Sample randomise

  - 4 macros: warmer, speaker, doubler, ethereal

  - 5 main fx parameters: reverb, delay, modulation, lo-cut, hi-cut

  - Global bypass

  - 250 presets

  - Waveform display

  - Playback direction: forwards, backwards, pendulum, loop

  - Playback modes: hold, latch, relative

  - Playback speed: normal, double, half

  - 4 choke groups

  - Start/end markers with snap to grid, snap to transient

  - Sample crossfade, attack, release, pan, volume

  - Sample pitch, fine, formant, bpm warp

  - Sample mode for triggering sequences

  - Fx modulation: delay, reverb, modulation, lo-cut, hi-cut, pitch, volume

  - Sample/modulation randomise

  - Phrase rate, sync, swing, steps, latch, beat retrigger controls

  - 3 rearrangable effects: reverb, delay, modulation

  - Reverb mode: plate, hall, spring

  - Reverb length, size, mix, pre-delay, duck, lo-cut, hi-cut, input, output

  - Delay mode: stereo, ping pong

  - Delay r/l time, sync time, r/l link, mix, feedback, duck, lo-cut, hi-cut,
  input, output

  - Modulation mode: chorus, vibrato, flanger

  - Modulation depth, rate, sync rate, mix, shape, feedback, input, output

  - Modulation shape: sine, triangle, inverted triangle, random

  - Global lo-cut, hi-cut, tone, dry, wet






  - Macos 10.15 or higher

  - Intel / native apple silicon supported

  - 64-bit compatible only

  - Windows 7 or higher

  - Daws supported: ableton live, pro tools, logic pro, fl studio, cubase,
  nuendo, reaper, reason

  - Internet connection required for authorization
