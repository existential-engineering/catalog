details: >-
  The studio grand features a classic steinway model d concert grand piano. The
  first choice of many pianists, steinways are famous for their character and
  unrivaled sound.


  The included exploremaps offer production presets in a variety of styles from
  natural to strange.


  The product is designed to have the response, dynamics and character of a
  steinway grand piano.


  The full addictive keys engine is included.


  Addictive keys studio grand by xln audio is a virtual instrument audio plugin
  for macos and windows.
specs: |-
  - VST plugin
  - Audio units plugin
  - VST 3 plugin
  - AAX plugin
  - Windows 7, 8, 10 (32 & 64-bit)
  - Macos 10.10 or later (32 & 64-bit)
  - Internet connection (during installation only)
  - Steinway model d concert grand piano
  - Exploremaps production presets
