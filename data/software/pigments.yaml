description: >-
  Pigments is Arturia's polychrome software synthesizer blending six
  cutting-edge synthesis engines with drag-and-drop modulation, premium
  effects, generative sequencing, and a vivid color-coded interface. Designed
  for modern sound design across electronic, cinematic, and experimental
  genres.
details: |-
  Pigments provides six synthesis engines that can be combined in a
  dual-layer architecture: virtual analog, wavetable, granular, harmonic
  (additive), sample, and utility (noise/input). Any two engines can be
  layered, split, or blended for complex hybrid sounds.

  The wavetable engine includes a large library of factory wavetables
  plus the ability to import custom wavetables and audio files. The
  granular engine processes audio files or live input into clouds of
  micro-sounds with control over grain size, density, position, and
  randomization.

  The harmonic engine offers additive synthesis with visual harmonic
  editing, while the virtual analog engine provides classic subtractive
  synthesis with multiple oscillator shapes and analog-modeled filters.

  A comprehensive modulation system uses drag-and-drop routing with
  visual feedback. Sources include envelopes, LFOs, function generators,
  random sources, macro knobs, and keyboard/velocity. The sequencer
  and arpeggiator add rhythmic modulation and melodic pattern generation.

  Three insert effect slots per layer plus a master effects section
  provide built-in processing. The preset browser includes thousands
  of factory presets organized by category, character, and style.
specs: |-
  - 6 synthesis engines (VA, wavetable, granular, harmonic, sample, utility)
  - Dual-layer architecture with blend/split modes
  - Drag-and-drop modulation routing
  - Function generators, LFOs, envelopes, random sources
  - 4 macro knobs
  - Built-in sequencer and arpeggiator
  - 3 insert effects per layer + master effects
  - Extensive filter section with analog-modeled types
  - Wavetable import and editing
  - Granular processing of audio files
  - Harmonic (additive) visual editor
  - Polyphonic with unison and voice modes
  - MPE support
  - Thousands of factory presets
  - Preset browser with categories and tags
  - AU, VST, VST3, AAX, standalone formats
  - macOS and Windows
