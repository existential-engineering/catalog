details: |-
  This plugin is based on a handmade diy version of one of the best and most
  musical program passive eqs ever made. It is extremely accurate, offering a
  sonic performance that is indistinguishable from the originals, thanks to the
  cutting-edge impulse response based modeling technology.

  Introducing the "blues tech": an exceptional digital replica of a handmade
  passive equalizer, meticulously crafted to deliver unprecedented accuracy.
  Through the employment of fft convolution-based emulation, we have achieved an
  exact digital "fingerprint" which perfectly captures the distinct curves of
  the original models.

  Blues tech has that 3d feel. Put it on your masterbus and get analog depth on
  your mix. Control the amount of "mojo" with the input gain. The more you drive
  it, the more non-linear harmonic distortions you get.

  Each band now features a corresponding gain knob positioned conveniently
  below, eliminating the unintuitive arrangement found in the original hardware.
  By introducing controlled amounts of harmonic saturation to the audio signal
  (thd), our emulation technique adds richness, depth, and character to digital
  recordings, mimicking the unique nonlinearities of analog device.

  We have expanded the low-frequency band by dividing it into two sections,
  empowering you to cut and boost at two distinct frequencies. This creative
  freedom, previously unattainable with the original hardware, allows for
  unparalleled audio manipulation, such as cutting at 30 hz while simultaneously
  boosting at 100 hz.
specs: |-
  - Fft convolution-based emulation
  - Impulse response based modeling technology
  - Harmonic saturation (thd)
  - Dual low-frequency band sections
  - Input gain control
  - Mastering ready
  - Audiophile quality
