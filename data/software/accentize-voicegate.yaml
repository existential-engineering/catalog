details: |-
  VoiceGate is a Machine-Learning based audio plug-in that reduces noise from speech and vocal recordings in real time. An artificial neural network trained on thousands of recordings learns the characteristics of human speech, automatically adapting to the type of noise present while letting the user control the reduction amount.

  VoiceGate was Accentize's first audio plugin, released in 2019. It is no longer available for purchase and new licenses cannot be issued. Existing users may continue to download and use it with a valid license. Accentize recommends dxRevive as the modern replacement.
