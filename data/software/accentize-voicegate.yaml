description: Accentize VoiceGate reduces noise in vocal recordings in real-time
  using machine learning.
details: |-
  VoiceGate is a Machine-Learning based audio plug-in which can be used to
  reduce noise from speech and vocal recordings in real-time. An artificial
  neural network has been trained on thousands of different audio recordings to
  learn the characteristics of human speech. The plugin can automatically adapt
  to any type of noise and lets you easily control the amount of noise reduction
  you need.

  In 2019, Accentize released VoiceGate as their very first audio plugin. It was
  warmly received by the audio community and marked an important milestone.
  Since then, audio technology has advanced rapidly, and while VoiceGate still
  works as originally designed, it no longer represents the state of the art.
