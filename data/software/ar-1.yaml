details: >-
  Ar-1 is a variable-mu tube compressor whose roots are in the raucous sound of
  the rockin' american 50's, yet it enjoys a posh british image thanks to its
  use at abbey road studios in late 60's, notably on the later beatles and
  earlier pink floyd records.


  Kush painstakingly captured the sweet breakup of ar-1's beefy tubes being
  driven into the dirt, then added more than a half dozen significant ui and
  functional enhancements. The resulting emulation is every bit as chunky as the
  original, and 10x more flexible.


  The real magic of ar-1 lies under the hood, with new algorithms that step
  kush's digital compressor technology forward. A common complaints about plugin
  compressors is that they're "too fast". Even when a plugin's attack time is
  identical to the hardware, it generally sounds markedly different, resulting
  in transients that are excessively bright while lacking in low end impact.


  Kush addressed this by obsessively tuning not just the speed, but also the
  taper of the attack and release. The result is a gentle beast that's still
  capable of cooking a sound to a deliciously charred crisp. The typically
  overused audio marketing terms 'warm' and 'smooth' now really do apply.
specs: |-
  - Variable-mu tube compressor
  - VST plugin
  - Audio units plugin
  - VST 3 plugin
  - AAX plugin
  - Macos and windows compatible
  - Tube saturation
  - Attack and release taper tuning
  - Transient handling
