description: Sample library for Kontakt featuring a trumpet with a Harmon mute. With true legato, offering the true sound of the trumpet.
details: |-
  Harmon mutes have captured the imagination of music aficionados across the world through amazing performances from artists like Miles Davis. Today Harmon mutes are played all over the globe by professional orchestras, soloists, recording artists, and students alike.

  Played by the talented Bernat Xamena. Each note and transition sampled, no pitch shifting. Optional round robin, staccato, polyphonic sustains and true legato articulations selectable via key-switches.

  True legato is achieved by sampling every interval that the trumpet can play, sustain into true legato with sustain, using one cross-fade and minimizing the possible phase issues.

  The interface features a trumpet viewed from the side. When you play a note, the trumpet moves its pistons to the real position, which converts Muted Trumpet into a fun learning tool too. In the main panel you select the different articulations and control the dynamics, expression and vibrato using the knobs, pre-mapped to default MIDI CCs.

  In the effects page you can add any effect you want in any order, including EQ, compressors, modulation effects, distortion, saturation, tape machine, reverbs, amp simulators and more. This script boosts the sonic capabilities of the library exponentially, in a simple and intuitive design.
specs: |-
  - 399 MB
  - 731 samples
  - 3 velocity layers
  - 1 mic position
  - 1x round robin
  - Articulations: round robin, staccato, polyphonic sustains and true legato, selectable via key-switches
  - True legato with every interval sampled, no pitch shifting
  - Animated interface with trumpet piston movement
  - Dynamics, expression and vibrato pre-mapped to default MIDI CCs
  - Effects page with EQ, compressors, modulation effects, distortion, saturation, tape machine, reverbs and amp simulators in any order
  - Kontakt 5.7.3 and newer versions
  - Full version of Kontakt required, Kontakt Player will run in demo mode
