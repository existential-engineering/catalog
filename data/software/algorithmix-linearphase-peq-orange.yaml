description: DirectX/VST 10-band precise linear-phase parametric equalizer for mastering and re-mastering of complex mixes with unrivaled transparency, free of unwanted sound coloration and transient smearing.
details: |-
  The LinearPhase PEQ Orange does not shift the phase, it only boosts or cuts
  the amplitude in a given frequency range. Consequently you can apply much more
  boost without changing the sound character of your recording. Due to the
  proprietary low-noise filter design in the time domain, the distortions
  (THD+N) are extremely low ensuring crystal clear, neutral, and uncolored
  sound.

  The LinearPhase PEQ Orange successfully copes with sonic problems that cannot
  be solved with any classical equalizer without side effects. You can boost
  lower frequency regions by even 10dB without mud or slush and with no loss of
  transients at all.

  LinearPhase PEQ Orange better preserves the time relationships of harmonics in
  the original waveform. This translates to smoother top end, sweeter and bigger
  midrange, and a clearer more distinct bottom end as compared with
  phase-shifted EQ.

  The LinearPhase PEQ Orange works in the time domain. It sounds more analytical
  than its brother, the LinearPhase PEQ Red, and therefore is specially
  recommended for difficult mastering and re-mastering tasks on dense mixes. It
  performs flawlessly with up to 384 kHz sampling frequency and allows extended
  frequency setup up to 80 kHz.
specs: |-
  - 10-band linear-phase parametric equalizer
  - Works in time domain (more analytical than PEQ Red)
  - Supports sampling rates up to 384 kHz
  - Extended frequency setup up to 80 kHz
  - Extremely low THD+N distortion
  - Crystal clear, neutral, uncolored sound
  - Compatible with Sequoia, Samplitude, Pyramix, WaveLab, Adobe Audition, Nuendo, Cubase
