description: "A mixing and mastering equalizer designed for intuitive use,
  musical flexibility and impeccable sound. Features three filter bands in a
  classic semi-parametric layout with four distinct EQ modes and five output
  stages."
details: |-
  Version 1.3.9. Three and a half filter bands in a classic Low/Mid/High semi-parametric layout. Four EQ modes: American, British, German, Soviet. Five output stages with saturation models. Auto gain compensation. Stereo and sum/difference processing. 64-bit multirate processing structure. Advanced preset management with undo/redo and A/B comparison.
specs: |-
  Windows 7 or above. Mac OS X 10.9 or above. OpenGL support required. Windows 64-bit: VST2, VST3, AAX. Mac 64-bit: VST2, VST3, AU, AAX.
