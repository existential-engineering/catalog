description: The RES-09 is a plugin emulation of the classic Roland RS-09 Organ
  and Strings Synthesizer. Available as VST, AU, AAX, CLAP, and Standalone.
details: |-
  RES-09 is a faithful emulation of a classic analog organ and strings machine from the late 1970s, the Roland RS-09. Though not as widely known as some classic vintage synths, it remains a sought-after gem for its lush ensemble effect, rich divide-down organ tones, and warm analog strings. Each oscillator can be fine-tuned separately, and four effects can be mixed and matched to shape the sound further.

  The Roland RS-09 was an analog organ and strings synthesizer, closely related to the Saturn-09, which was limited to organ sounds. The Mark I model was launched at the end of 1978 and was refreshed as a Mark II model in May 1980. The string and organ sounds can be used separately or together, with the ensemble effect adding movement and stereo depth, similar to the classic JUNO 6/60 chorus but with a distinctive sound. It also included an external audio input, a rare feature for synths of its type.

  The RS-09 uses a Top Octave Synthesizer circuit for both organ and strings, featuring 12 oscillators for the upper octave notes with octave divider circuits generating the lower octaves. This ensures that the same notes on different octaves stay in sync and avoid the phasing issues of sample-based instruments. The organ section can mix 4 square waves, while the strings section uses a saw-like waveform generated by layering multiple squares at different octaves and volumes, with the bias control setting the mix between these layers.

  As with other classic synthesizers of that era, the RS-09 features a rich and warm BBD-based ensemble chorus effect that adds stereo width and dynamic modulation to otherwise static synth sounds. A rate multiplier adjusts the speed of the internal modulator LFOs. Early RS-09 models used SAD512 BBD chips while later models used MN3004 chips, both with 512 stages, though the early models had higher background noise.

  RES-09 includes four effects: a Tape Echo based on AudioThing's Space Echo emulation Outer Space, a Spring Reverb, an Overdrive inspired by classic guitar pedals, and a Phaser inspired by vintage analog phase shifters, all rearrangeable by drag and drop. It is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP, Standalone), and on the App Store for iOS and iPadOS (AUv3 and Standalone).
