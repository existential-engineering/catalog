description: PolarDesigner is a free post-production plugin by Austrian Audio
  that provides advanced polar pattern control for dual-diaphragm microphones
  such as the OC818 and OC-S10. It enables real-time, frequency-dependent polar
  pattern shaping across up to five independent frequency bands, allowing users
  to design custom directional characteristics rather than selecting fixed
  patterns. Features include spill elimination, proximity effect management, an
  intelligent automatic spill detection (Terminator) function, a zero-latency
  tracking mode, and a full-precision post-processing mode.
details: PolarDesigner gives full control over directional characteristics in
  the frequency domain for dual-output microphones. Up to five independent
  frequency bands can each be assigned their own polar pattern, enabling precise
  acoustic shaping for recording and post-production scenarios. The Terminator
  feature applies intelligent algorithms for automatic spill detection and
  rejection. Zero-latency tracking mode supports real-time use during recording
  sessions; full-precision post-processing mode is available for mixing and
  mastering.
