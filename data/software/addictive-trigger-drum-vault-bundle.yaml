details: |-
  Addictive trigger is the world's first intelligent drum replacer, equipped with powerful features like the audio fingerprint detection algorithm that accurately identifies drum hits and the superstart system that automatically provides suitable detection settings. This means you can have accurate detection in no time, allowing you to focus on creative things like dialing in the perfect drum sound.

  Our new system uses fft analysis to accurately identify drum sounds even if there is a lot of mic bleed or background noise in the source material. It's fast, it's accurate, and we think it'll change the way you work with live-recorded drums.

  Audio fingerprint solves this problem by using a novel fft-based matching system. It is so accurate, it usually has no trouble detecting lightly played ghost notes from background noise while simultaneously rejecting mic bleed and other unwanted sounds. In addition to detecting low level ghost notes with great accuracy, our audio fingerprint system can also differentiate between different stroke types that are played at similar velocities (for example, sidestick and open snare hits).

  The drum vault trigpak is an essential expansion for addictive trigger. Featuring 18 carefully selected kit pieces from our vast library of recordings: kicks, snares (including two previously unreleased gems) and tom kits, that will add punch and extra dimension to your mixes.

  Drum vault contains: kicks: 18x14" premier gen-x, 22x16" yamaha absolute hybrid, 24x18" pork pie usa custom, 22x18" tama starclassic. Snares: 14x3.5" gretsch modded tom, 14x5" ludwig acrolite 1968, 14x5.5" yamaha steve gadd sign, 14x6.5" pork pie bell brass. Toms: 10x8" pork pie usa custom, 13x10" pork pie usa custom, 16x14" pork pie usa custom, 18x16" pork pie usa custom, 10x7.5" yamaha absolute hybrid, 12x8" yamaha absolute hybrid, 14x13" yamaha absolute hybrid, 16x15" yamaha absolute hybrid. Extras: meinl single brass tambourine, body percussion.
