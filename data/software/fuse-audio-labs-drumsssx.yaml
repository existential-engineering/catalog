description: A drum source separator and stem remixer using Non-negative Matrix Factorization (NMF) to decompose mono or stereo acoustic drum recordings into individual components — kick, snare, hi-hat, cymbals, and overhead — for independent remixing, bleed reduction, trigger creation, and creative processing.
details: |-
  Uses Non-negative Matrix Factorization (NMF) algorithm to separate acoustic drum recordings into individual stem tracks. Outputs separate signals for kick, snare, hi-hat, cymbals, and overhead components without requiring multi-mic setups. Applications include: bleed reduction (e.g. removing hi-hat from snare mic), replacement/augmentation trigger generation, per-component EQ and compression, creative remixing of drum bus recordings. Works on both mono and stereo drum bus stems.
