details: |-
  2buscontrol is a free, comprehensive stereo master monitoring and metering plug-in available for all major plug-in formats. It offers five essential options for specialized monitoring modes plus highly responsive and user-friendly metering for left/right balance and correlation.

  Solo is available post-metering with a single button push. Traditional left/right soloing (as phantom center) can be chosen, or the equally useful mono/diff (erence) or m/s (mid/side) rendering of the soloed signal. In addition, the stereo perspective can be swapped or flipped with the left and right channels changing places.

  Each solo control is a single button, allowing you to check placement and amplitude easily for all aspects of your mix. Usable metering is another essential for any engineer, and options are equally practical, with stereo balance and inter-channel correlation occupying the upper half of the user interface.

  2buscontrol's measurement and display algorithms adhere to a guiding philosophy of enhancing your workflow and improving ergonomics through careful attention to the way you actually work. Ballistics are meticulously tuned to achieve the best match between the aural impression you hear, and the optical rendering by the meters.

  All of functionality is wrapped in an information-rich yet visually unobtrusive user interface that occupies only a small slice of screen real estate. Likewise, the plug-in is "light weight" demanding a minimum of cpu resources so it won't slow down your host.
