description: Sharine is the first percussion library that fully retains the pre-roll (also called pre-shift) of each sample while keeping the grooves in sync with your DAW. 8 shakers and 4 tambourines recorded with 3 mic positions.
details: |-
  Sharine is the first percussion library that fully retains the pre-roll (also called pre-shift) of each sample while keeping the grooves in sync with your DAW. You get the best of both worlds: ultra-realistic sound with rock solid timing.

  Sharine covers a wide variety of shakers and tambourines for creating realistic patterns. It carries bi-directional shakes, hits, sticks and rolls articulations, pristine recordings and an advanced script.

  Sharine includes wooden, metal, skin and plastic shakers. Also includes plastic, metal and wooden tambourines. Each of them delivers different sound characteristics. Use a combination of them and place them whenever you want in the stereo field.

  A proprietary script advances the samples just the right amount of time so the main transient is always placed on-beat. This way, you will have perfectly natural sounding rhythm patterns that will be synced to the tempo of your song. Sharine includes 3 mic positions: close, mid and far. Close is mono and mid and far are stereo. Far has a great room sound that sounds great to blend it on a mix. For a more controlled sound, the close position sounds as dry as recorded in an isolation booth.

  Sharine features a full mixer with which you can control the three mic positions separately, with a load/purge switch for each channel, pan / width, volume, mute, solo, phase shift and output selector for mixing the different channels in your DAW. In the effects page you can add any effect you want in any order, including EQ, compressors, modulation effects, distortion, saturation, tape machine, reverbs, amp simulators and more. The settings page features a sequencer that will advance the samples just the right amount so the main hit is synced perfectly to tempo: play one of the predefined patterns or create your own, apply the advanced pre-roll script with the turn of a knob, or use the sample start offset for a more traditional approach. Usual features like beat duration, swing and number of steps are also available.
specs: |-
  - Size: 312 MB
  - Samples: 1,305
  - Velocity layers: 4
  - Round robin: 7
  - Shakers: 8
  - Tambourines: 4
  - Mic positions: close, mid, far (close is mono, mid and far are stereo)
  - Bi-directional shakes, hits, sticks and rolls articulations
  - Wooden, metal, skin and plastic shakers; plastic, metal and wooden tambourines
  - Pre-roll (pre-shift) script that advances samples so the main transient lands on-beat
  - Mixer with load/purge per channel, pan / width, volume, mute, solo, phase shift and output selector
  - Effects page with EQ, compressors, modulation, distortion, saturation, tape machine, reverbs and amp simulators
  - Sequencer with predefined and custom patterns, beat duration, swing and number of steps
  - Works with Kontakt 5.7.3 and newer versions; full version of Kontakt required (Kontakt Player runs in demo mode)
