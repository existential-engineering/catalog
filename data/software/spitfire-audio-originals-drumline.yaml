details: |-
  An extensively sampled collection of marching band percussion, made in collaboration with Bleeding Fingers. Performed by world champion drum corps, the Blue Devils. Recorded by Russell Emanuel in the controlled acoustics of the Newman Stage, 20th Century Fox, for a tight, focused sound. Features snares, tenor drums, bass drums & cymbals. Nine presets. Five controls and effects.

  Originals Drumline requires the free Splice INSTRUMENT plugin to run.
specs: |-
  - File size: 1.5 GB
  - 9 presets
  - 3 mic signals: Close, Room, Hyped
  - macOS 12 or later, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
