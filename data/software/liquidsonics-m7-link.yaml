description: MIDI DAW integration for your Bricasti M7 hardware reverb unit - AAX, AU, VST
details: |-
  M7 Link is a MIDI DAW integration controller plugin for the Bricasti M7 hardware reverb unit, enabling full program recall, parameter control, and M7 system management across major DAWs via industry-standard MIDI protocol.

  The plugin supports full M7 patch save and recall to user presets, live automation capabilities, and system settings control including brightness and I/O configuration. Multi-unit support allows users to create instances for multiple hardware units within the same session.

  M7 Link requires a compatible MIDI device and a Bricasti M7 or M7M hardware unit. Licensing is handled via iLok Cloud, iLok 2/3 dongle, or local iLok activation, with iLok License Manager v5 or later required. The plugin occupies approximately 50 MB of disk space.

  A 14-day free trial is available for both macOS and Windows. macOS support covers 10.13 or later on Intel and Apple Silicon (native and Rosetta). Windows support covers Windows 7 or later on Intel and AMD processors.
specs: |-
  - Supported OS: macOS 10.13+, Windows 7+
  - Architecture: 64-bit only (Intel, Apple Silicon native and Rosetta on Mac; Intel and AMD on Windows)
  - Plugin formats: VST 2.4, VST 3, Audio Unit (AUv2), AAX Native (Pro Tools 12.5.1+)
  - Licensing: iLok Cloud, iLok 2/3 dongle, or local iLok activation; iLok License Manager v5+
  - Disk space: ~50 MB
  - Hardware requirement: Bricasti M7 or M7M hardware unit
  - MIDI device required for integration
