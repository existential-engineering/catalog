description: MIDI DAW integration for your Bricasti M7 hardware reverb unit.
details: |-
  M7 Link is a plug-in that brings a Bricasti M7 hardware reverb under DAW control over the industry standard MIDI protocol. It offers full program recall, parameter control and comprehensive M7 system management across all major DAWs, so the hardware unit can be integrated into a modern studio session workflow.

  Setup connects the MIDI input and output of the Bricasti M7 to a set of dedicated MIDI ports on a compatible MIDI device, after which the port is selected inside M7 Link and the reverb is controlled as though it were a plug-in. Audio is routed separately through the user's own audio interface, since the plug-in carries control data rather than the reverb signal itself.

  Whole M7 patches can be saved and recalled to user-saves, live automation can be performed from the DAW timeline, and M7 unit system settings including display brightness and I/O configuration can be managed from the interface. Studios running racks of M7s can create one instance per hardware unit and drive them all from a single session.

  The plug-in ships as VST 2.4, VST 3, Audio Unit (AUv2) and AAX Native, with the macOS installer providing 64-bit Universal Binaries for Apple Silicon and Intel x64. Licensing runs through iLok Cloud, an iLok 2/3 USB dongle or iLok local machine activation. Version 1.2.0 introduced a resizable interface, and Apple Silicon support arrived in version 1.1.1.

  M7 Link was developed under the Reverb Foundry name.
specs: |-
  - Windows 7 or macOS 10.13
  - VST 2.4, VST 3, Audio Unit (AUv2) and AAX Native (Pro Tools 12.5.1 or above is required on Windows platforms)
  - iLok Cloud, iLok 2/3 USB dongle or iLok local activation
  - iLok License Manager v5 or above
  - 50 MB per plug-in
  - Compatible MIDI device (see the user guide for a list of known compatible devices)
  - Bricasti M7 or Bricasti M7M hardware reverb
  - 64-bit DAW and operating system (v1.0.3 and below available in 32-bit)
  - Intel, AMD or Apple Silicon processor (native and Rosetta)
  - macOS installer contains 64-bit Universal Binaries (Apple Silicon and Intel x64) for VST2, VST3, AU and AAX
