description: Convology XT is a free convolution reverb plugin developed in collaboration between Impulse Record and Wave Arts, featuring 74 factory impulse responses covering extensive vintage and real-space libraries.
details: |-
  Convology XT is a full-featured convolution reverb plugin offered free of charge, created through a collaboration between Impulse Record and Wave Arts. It ships with 74 factory impulse responses drawn from vintage hardware units and real acoustic spaces.

  The plugin supports true stereo impulse responses and can load external WAV and AIF files, making it extensible beyond the bundled IR library. Users can browse and manage presets and IR files through an integrated file browser interface.

  IR modification tools include stretch, decay scaling, frequency-dependent decay, EQ, reverse, and amplitude envelope shaping, giving users significant control over the character of the loaded impulse response.

  The plugin provides both low-latency and zero-latency processing modes to suit tracking and mixing workflows respectively, with CPU-efficient processing throughout. Real-time spectrum analysis and IR time displays are included for visual feedback.

  Apple Silicon is natively supported on macOS, and the plugin supports sampling rates up to 192 kHz with a maximum IR length of 1 million samples (approximately 20 seconds at 48 kHz). On macOS the plugin requires a 64-bit host; on Windows both 32-bit and 64-bit hosts are supported.
specs: |-
  - 74 factory impulse responses (vintage hardware + real acoustic spaces)
  - True stereo IR support
  - External WAV and AIF file loading
  - IR modification: stretch, decay scaling, EQ, frequency-dependent decay, reverse, amplitude envelope
  - Real-time spectrum display and IR time display
  - Low-latency and zero-latency processing modes
  - CPU-efficient convolution engine
  - Maximum IR length: 1,000,000 samples (~20 seconds at 48 kHz)
  - Supported sample rates: up to 192 kHz
  - macOS: 64-bit hosts only; Windows: 32-bit and 64-bit hosts
  - macOS 10.13 (High Sierra) or higher; Apple Silicon native
  - Windows 7, 8, 10, 11
  - Formats: AU, VST2, VST3, AAX (macOS); VST2, VST3, AAX (Windows)
  - High DPI monitor support
