description: "Free convolution reverb with 74 factory impulse responses,
  extensive IR modification features, and support for true stereo responses.
  Features easy-to-use interface for browsing libraries and auditioning presets
  on the fly."
details: |-
  74 factory IRs. Fast loading with quick IR stepping. True stereo IR support. Loads external WAV and AIF files. IR modification: stretch, decay time, EQ, frequency dependent decay time, reverse, amplitude envelope. IR automation support. Low latency and zero latency modes. Max IR length 1M samples. High DPI support. CPU efficient. Up to 192 kHz sampling rate.
specs: |-
  Mac: AU, VST2, VST3, AAX. macOS 10.13+, Apple Silicon native, 64-bit only. Windows: VST2, VST3, AAX. Windows 7/8/10/11, 32-bit and 64-bit. Requires registration with serial number.
