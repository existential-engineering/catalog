description: Convology XT is a free convolution reverb, the result of a collaboration between Impulse Record and Wave Arts. It comes with 70+ impulse responses, lets the user quickly step through presets, and has extensive IR modification features.
details: |-
  Users who want more impulse responses can buy any of twenty IR libraries from Impulse Record, with samples of reverb DSP units, plates, springs and delay units, plus hundreds of samples of real acoustic spaces. The Convology XT Complete Library is focused on vintage reverb effects, sampled from 126 different pieces of vintage studio gear from studios all over the world, across 10 separate libraries: 80s-90s DSP 1 Basic, 80s-90s DSP 2 Classic, 80s-90s DSP 3 Pro, Plates, Springs Bright, Springs Boingy, Springs Warm, Echo Space, Vintage Amps, and Vintage German DSP.

  The Convology XT True Stereo Library consists of 4-channel true stereo impulse responses across four separate libraries, True Stereo 1 through 4, focusing on pro DSP units, plates and springs. The Convology XT Real Spaces Library consists of acoustical recordings of real spaces across six separate libraries: Arenas and Stadiums, Churches and Halls, Outside, Rooms, Diverse, and Space.

  The plug-in features an easy to use interface for browsing the libraries, letting the user quickly step through presets and audition on the fly while the music is playing. Convology XT offers CPU efficient processing, low latency and zero latency modes, a maximum IR length of 2M samples (40 sec at 48 kHz), support for true stereo responses, support for WAV and AIF files, and modulation. IR modification functions include stretch, decay time scaling, EQ, frequency-dependent decay time scaling, time reverse, and amplitude envelope. The interface carries a preset and file browser, a real time spectrum display, an IR time display, and images of the vintage gear and real spaces.

  The plug-in is free but requires registration with a serial number. Wave Arts also provides a free application called IRCapture, which can record impulse responses of hardware gear or acoustical spaces.
specs: |-
  - Comes with 74 factory IRs
  - Fast loading, quickly step through IRs
  - Supports true stereo IRs
  - Loads external WAV and AIF files, organizes favorite IR directories
  - Many IR modification features: stretch, decay time, EQ, frequency dependent decay time, reverse, amplitude envelope
  - Supports IR automation
  - Low latency and zero latency modes
  - Max IR length 1M samples (20 sec at 48 kHz)
  - Supports high DPI monitors
  - CPU efficient
  - 192 kHz sampling rate
  - Requires a host program that supports audio plug-ins
  - iLok licensing is not supported
  - Requires registration with a free serial number
  - Macintosh formats: AU, VST2, VST3, AAX
  - Windows formats: VST2, VST3, AAX
  - macOS 10.13 (High Sierra) and higher
  - Apple Silicon natively supported (AU, VST2, VST3, AAX)
  - Windows 7/8/10/11
  - AAX requires Pro Tools 11 and higher on macOS, Pro Tools 10.3.5 and higher on Windows
  - macOS: 64-bit hosts only
  - Windows: 32-bit and 64-bit hosts supported
