description: Everybody loves the sound of the good old Mrs Mills piano from Abbey Road Studios. With a more percussive sound it’s often used to evoke the feeling of a honky-tonk, associated with ragtime pieces in old Hollywood Western movies.
details: |-
  The tack piano sound, heard on recordings such as “In the Lost and Found” by Elliott Smith, was first covered by Wavesfactory in W-Honky, released in 2010: a basic upright piano mixed with a synthesized metal sample to get the initial pluck, with no round-robins, no velocity layers and no release samples. The first version of The Tack followed in 2015, adding release samples, round robin and built-in effects.

  The Tack Piano is completely re-sampled from scratch, an authentic tack piano with a new GUI. It is equally at home in music, sound design or FX.

  The Tack Piano was recorded using a Yamaha U1 piano with a custom-built bar that holds the metallic pins just between the hammers and the strings.

  The Tack Piano features a full mixer with which you can control the three mic positions separately. Close, mid, far and mix. The mix channel is a combination of the close, mid and far so you can just use that one and save CPU. With load, purge, pan, volume, mute, solo, stereo width and output selector for mixing the different channels in your DAW.

  In the effects page you can add any effect you want in any order, including EQ, compressors, modulation effects, distortion, saturation, tape machine, reverbs, amp simulators and more. In the settings page you can control basically any parameter that you might ever need: round-robin, velocity curve, mechanical noises and sound options like sympathetic resonance, timbre and dynamic range.
specs: |-
  - Size: 14.22 GB
  - Samples: 9,118
  - Velocity layers: 8
  - Round robin: up to 6
  - Mic positions: 3 + mixdown
  - Recorded on a Yamaha U1 piano with a custom-built bar holding metallic pins between the hammers and the strings
  - Full mixer with close, mid, far and mix channels, with load, purge, pan, volume, mute, solo, stereo width and output selector
  - Effects page with freely ordered EQ, compressors, modulation, distortion, saturation, tape machine, reverbs and amp simulators
  - Settings page with round-robin, velocity curve, mechanical noises, sympathetic resonance, timbre and dynamic range
  - Works with Kontakt 5.7.3 and newer versions; full version of Kontakt required, Kontakt Player will run in demo mode
