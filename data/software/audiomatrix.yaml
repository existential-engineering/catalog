description: AudioMatrix is a channel routing utility plugin, capable of
  re-routing any input channel to any output channel, with gain and polarity
  control.
details: |-
  AudioMatrix is a channel routing utility plugin, capable of re-routing any
  input channel to any output channel, with gain and polarity controls.

  Use cases include speaker array management to create speaker arrays and
  reproduce 5.1 audio in a 7.1 studio, bring to center to temporarily send any
  signal to the center channel for easier fine tuning with immersive sounds, and
  middle-side conversion to convert stereo to mid-side and back to stereo for
  additional flexibility in stereo fx processing.

  Additional capabilities include mirror to flip sounds left right for better
  fit with the image from stereo to complex 7.1.2 soundscapes, big mono to
  transform immersive audio into a big mono sound or create custom mono sounds
  controlling the contribution of each channel, and lfe control to control lfe
  level independently of all remaining channels.

  Basic upmixing/downmixing provides a fast way to upmix or downmix something
  while controlling the contribution of each channel, and format conversion
  allows working with different 5.1 formats by simply converting from 5.1 film
  to 5.1 smpte by changing channel ordering.

  Audiomatrix by sound particles is a virtual effect audio plugin for macos and
  windows, functioning as an audio units plugin, a VST 3 plugin and an AAX
  plugin with universal 2 binary support.
specs: |-
  - Channel routing
  - Gain control
  - Polarity control
  - Speaker array management
  - Mid-side conversion
  - Surround sound support
  - 5.1 audio
  - 7.1 audio
  - 7.1.2 soundscapes
  - Lfe control
  - Upmixing
  - Downmixing
  - Format conversion
  - macOS support
  - Windows support
  - Universal 2 binary
