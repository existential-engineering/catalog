details: >-
  Ag watermark generator is an app tool for both mac and pc that will help you
  to add an audio watermark to your original track in a fast & easy way.


  Version 2 features include control of watermark mix volume, preview of
  watermark mix before processing, same output folder selection, totally fresh
  new design, and faster file processing.


  The application includes a process progress bar, convertor preset, and quick
  player for the watermark files with the ability to stop or cancel the process
  at any time.


  You can now watermark short sfx's (0-1sec) and the application is now
  accepting watermark files that are longer than 15sec, with drag and drop file
  order capability and the ability to define tracks order by simply sorting your
  size/length/file name.


  Additional features include 'suggest an idea' section, overwrite file
  notifications, explained error messages, and play sound notification when the
  process ends.
