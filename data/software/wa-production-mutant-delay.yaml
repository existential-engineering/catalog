description: Mutant Delay is a host-synced stereo delay with a built-in ducker that lowers the wet signal in response to the dry source, keeping the original audio defined under heavy feedback. It offers independent left and right delay times, ping-pong routing, two filter shaping modes and compressor-style ducking controls.
details: |-
  Mutant Delay is a host-synced delay plugin with an internal ducker, aimed at vocal processing and other sources that need clarity under a pronounced delay. The ducker listens to the dry source and ducks the wet delay signal to make space for it, replacing the sidechain and compression routing that this mixing technique normally requires. It suits vocals, synths and percussion, where extreme delay effects can otherwise mask the definition of the source.

  The Synced Delay section provides host-synced delay for the left and right channels independently, from 1/1 to 1/16 with straight, triplet or dotted notes, plus high and low pass filters and a ping-pong setting. The Mix dial sets the wet delay level, and the Feedback dial mixes the output of the delay back into its input, with the ping-pong routing option cross-mixing the feedback paths of the two channels for more complex combinations.

  Two filter modes shape the delay tail. Mode A limits the entire delayed signal to the chosen upper and lower frequency limits, while Mode B introduces the frequency shaping gradually as the delay feeds back, which adds movement to the repeats and reduces high and low end clutter.

  The Internal Ducker works like a standard compressor. Threshold sets the level at which it starts working and Ratio dictates how much gain reduction is applied, with Attack, Hold and Release dials for finer shaping. Attack ignores transients in the delay signal, Hold stabilises the generated gain reduction and Release sets the fade out time, so a zero Attack with a long Release produces an atmospheric result.

  A waveform graph at the top of the interface shows the dry source and the wet delay in different colours, so the delay and the ducking are visible in real time. The plugin logo acts as a click and pop free bypass for the whole effect, and factory presets cover delay chains from standard processing through to special effects, alongside user presets. Version 2.1.0 added a resizable interface, an updated preset manager, updated licence management and bug fixes, and version 2.2.0 added native Apple Silicon and arm64 support.
specs: |-
  - Host-synced delay with independent left and right channel times
  - Delay divisions from 1/1 to 1/16 with straight, triplet and dotted notes
  - Ping-pong routing with cross-mixed feedback paths
  - High and low pass filters with two shaping modes
  - Built-in ducker with Threshold, Ratio, Attack, Hold and Release controls
  - Real-time waveform display of dry and wet signals
  - Click free bypass on the plugin logo
  - Factory presets across a wide range of delay parameters
  - User preset saving
  - Resizable interface and updated preset manager in version 2.1.0
  - Native Apple Silicon and arm64 support in version 2.2.0
  - Full PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
