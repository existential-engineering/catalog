details: |-
  The emotive orchestra Berlin Orchestra Inspire 2 expands upon the fast-flowing
  creative freedom of its predecessor with an emotional and atmospheric
  approach. Designed with a streamlined workflow for creating moods and
  atmospheres, inspire 2 is perfect for underscoring and capturing ideas fast.

  This collection of melodic and harmonic colors is the ideal complement to
  inspire 1, adding carefully selected instruments, ensembles, and articulations
  to stir the emotions. Combine both inspire libraries within your scores to get
  the full spectrum of cinematic sound from your laptop or mobile setup.

  Now updated for the sine player, you can choose to purchase single instruments
  instead of buying the whole collection.

  All berlin orchestra inspire instruments are recorded in their natural seating
  positions, with all instruments in perfect equilibrium with one another. This
  is the key to creating a sonic impression in which all the instruments blend
  together naturally.

  Inspire 2 opts for simplicity, offering only the most commonly used
  articulations. And instead of multiple mic positions, inspire 2 offers just a
  single perfectly balanced mix.
