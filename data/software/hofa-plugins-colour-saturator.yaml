details: |-
  Smooth harmonics, powerful punch, analog warmth and even brutal destruction – saturation and distortion are essential in professional music production. Designed for this very purpose, the HOFA Colour Saturator has become a real game changer. Modern neural modeling algorithms enable absolutely authentic saturation like you've never heard before. And with the specially developed BiasEQ©, you have completely new creative possibilities. Subtle harmonics, solid distortion, and extreme fuzz sounds Tape | tube | desk | solid state | hybrid &#8230; Neural modeling algorithms for all kinds of tonal variation BiasEQ© for creative sound shaping Noise, crackle, and hum for authentic retro feel NEW: Soft mode for particularly subtle use of saturation VIDEOS Colour Saturator 4 Videos Review Warp Academy 13:11 Overview of All Features 7:14 The new Soft Mode 2:34 Review Mattias Holmgren 12:39 The Highlights: Input section Dynamics to limit or intensify the dynamics of your signal Tone , a tilt EQ to control the frequency balance of your sound Wow & flutter for the typical retro tape effects Noise, crackle, and hum for infamous LoFi artefacts Algorithms & drive Above the central drive control, you can choose between different algorithms, such as Tape, Tube, Desk, Solid State and Hybrid. We have applied various methods to accomplish this. Among other things, sophisticated neural modeling algorithms are used for maximum realism , as well as CPU-saving variants. Creative shaping The groundbreaking BiasEQ© is available for all algorithms. After saturation, you can make final sound adjustments with hi and low cut . Of course, parallel saturation can be easily achieved with the dry/wet mixer . Incredibly detailed saturation models We have created detailed, high-resolution models of our favourite hardware devices in the HOFA-Studios. Mic PreAmps: 4 iconic microphone preamps of various designs Tape: 3 analogue tape machines with their characteristic harmonics Git / Bass Amp: 7 legendary tub
