description: The HOFA Colour Saturator delivers authentic saturation and distortion thanks to neural modelling and BiasEQ© – ranging from subtle warmth to extreme fuzz power.
details: |-
  The HOFA Colour Saturator delivers smooth harmonics, powerful punch, analog warmth, and even brutal destruction through modern neural modeling algorithms and the specially developed BiasEQ©.

  With 30+ saturation algorithms spanning mic preamps, tape machines, guitar and bass amps, pedals, pedal+amp combinations, studio classics, and legacy CPU-efficient models, the Colour Saturator covers the full spectrum from subtle harmonics to solid distortion to extreme fuzz sounds.

  The proprietary BiasEQ© is a 9-band EQ operating simultaneously before and after saturation, enabling frequency-selective distortion control without phase issues.

  The Input module provides a dynamics limiter/intensifier, tone (tilt EQ), wow & flutter effects, and noise/crackle/hum generation. The Output module offers hi/low cut filters, a dry/wet mixer for parallel saturation, and soft/hard mode calibration options.

  The plugin is licensed via the HOFA Plugins Manager, supports offline activation, USB stick compatibility, and includes 2 licenses per purchase. A 14-day free trial is available.
specs: |-
  - Formats: VST3, AU, AAX
  - Operating System: macOS 11 or later, Windows 10 or later
  - 30+ saturation algorithms: Mic PreAmps (4), Tape (3), Guitar/Bass Amps (7), Pedals (6), Pedal + Amp Combinations (5), Studio Classics (4), Legacy (5)
  - BiasEQ©: 9-band EQ operating simultaneously before and after saturation
  - Input module: dynamics limiter/intensifier, tone (tilt EQ), wow & flutter, noise/crackle/hum
  - Output module: hi/low cut filters, dry/wet mixer, soft/hard mode calibration
  - Tested DAWs: Ableton Live, Logic Pro, Pro Tools, Bitwig, Reaper, FL Studio, Samplitude/Sequoia, Studio One, Cubase, Nuendo, WaveLab
  - Two licenses included; managed via HOFA Plugins Manager
  - Offline activation supported
  - USB stick compatibility available
