description: The HOFA Colour Saturator delivers authentic saturation and distortion thanks to neural modelling and BiasEQ© – ranging from subtle warmth to extreme fuzz power.
details: |-
  Saturation and distortion plugin for mixing and mastering. Smooth harmonics, powerful punch, analog warmth and even brutal destruction – saturation and distortion are essential in professional music production. Designed for this very purpose, the HOFA Colour Saturator has become a real game changer.

  Modern neural modeling algorithms enable absolutely authentic saturation like you've never heard before. And with the specially developed BiasEQ©, you have completely new creative possibilities. Neural modeling is a process based on machine learning that analyzes the nonlinear behaviour of analog hardware (tubes, transformers, tape machines) and then simulates it using neural networks. In the Colour Saturator, this ensures that the tape, tube, and desk algorithms sound virtually indistinguishable from their real-world counterparts.

  The input section offers Dynamics to limit or intensify the dynamics of your signal, Tone, a tilt EQ to control the frequency balance of your sound, wow & flutter for the typical retro tape effects, and noise, crackle, and hum for infamous LoFi artefacts. Above the central drive control, you can choose between different algorithms, such as Tape, Tube, Desk, Solid State and Hybrid, using sophisticated neural modeling algorithms for maximum realism as well as CPU-saving variants. For all algorithms, you can choose between soft and hard mode to change the calibration of the drive control.

  The BiasEQ© has nine bands and a fully parametric mode. This allows you to intensify or reduce the degree of distortion for individual spectra of your sound. For example, you can saturate the mids of a bass sound while removing the low and high ends from the distortion. By default, each frequency boost is counterbalanced by a reduction of the same frequency after the distortion; if you don't want this effect, you can unlink each band and make even more precise adjustments. Traditional multiband saturation splits the signal into frequency bands and saturates each band separately, which usually results in unwanted phase issues, whereas the BiasEQ© controls how strongly a specific frequency range is fed into the saturation algorithm without splitting the signal.

  After saturation, you can make final sound adjustments with hi and low cut, and parallel saturation can be easily achieved with the dry/wet mixer. Two licenses are included per purchase, managed via the HOFA Plugins Manager, where they can also be deactivated and transferred to other computers. It is also possible to activate and use HOFA plugins offline, and licenses on USB sticks can be used alongside USB licenses from other plugin manufacturers.
specs: |-
  - Neural modeling algorithms for authentic analog saturation
  - Over 30 saturation algorithms including Tape, Tube, Desk, Solid State and Hybrid
  - Mic PreAmps: 4 iconic microphone preamps of various designs
  - Tape: 3 analog tape machines with their characteristic harmonics
  - Git / Bass Amp: 7 legendary tube amps from crunchy to heavy
  - Pedals: 6 popular, perfectly modeled stompboxes
  - Pedal + Amp: 5 combinations of guitar pedals and amps
  - Other: 4 renowned studio classics with intriguing harmonics
  - Legacy: 5 CPU-efficient algorithms from the SYSTEM Saturator
  - Soft and hard mode to change the calibration of the drive control
  - BiasEQ© with nine bands and a fully parametric expert mode for frequency-dependent saturation
  - Unlinkable BiasEQ© bands for precise pre/post adjustments
  - Input section with Dynamics to limit or intensify signal dynamics
  - Tone, a tilt EQ to control the frequency balance
  - Wow & flutter for typical retro tape effects
  - Noise, crackle and hum for LoFi artefacts
  - Hi and low cut after the saturation stage
  - Dry/wet mixer for parallel saturation
  - Operating system: macOS 11 or later, Windows 10 or later
  - Formats: VST3, AU, AAX
  - Two licenses per purchase, managed via the HOFA Plugins Manager, offline activation supported
  - Continuously tested on Ableton Live, Apple Logic, Avid Pro Tools, Bitwig, Cockos Reaper, Image Line FL Studio, Magix Samplitude/Sequoia, Fender Studio Pro, Steinberg Cubase/Nuendo/Wavelab
