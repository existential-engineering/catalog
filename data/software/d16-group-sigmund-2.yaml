description: High Quality Flexible Delay Unit
details: |-
  Sigmund is far from just another delay: it consists of four discrete, beefed-up delay units in one box, each with an independent set of parameters, arranged in nine different signal-flow topologies to bring unique delay sounds to a project. Delay times are precisely adjustable across a wide range, so the same four lines can behave like a delay, chorus, or flanger depending on settings.

  Four multipurpose modulators make it quick to apply different types of modulation to several delay-line parameters at once, from subtle movement to wild, expressive delay effects. A musical filter can work either inside or outside the feedback loop, removing unwanted frequencies or creating the impression of a fading sound, and overdrive adds a whole variety of ways to shape the signal, including complex multiband distortion or dynamics when driven across multiple delay lines.

  A convenient preset browser allows quick auditioning of the vast factory library, and a padlock system for locking individual parameters when changing presets lets users zero in on a desired effect with extreme efficiency.
specs: |-
  - Four independent, beefed-up delay units
  - Nine switchable signal-flow topologies between delay lines
  - Four multipurpose modulators for simultaneous multi-parameter modulation
  - Musical filter switchable inside or outside the feedback loop
  - Overdrive per delay line for multiband distortion/dynamics effects
  - Preset browser with per-parameter padlock system
