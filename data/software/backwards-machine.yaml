details: |-
  Backwards Machine reverses continuous audio in real-time. It includes three
  effects: reverse playback, forward backwards, and reverse repeat.

  Reverse playback: reverses and overlaps snippets of the incoming audio, to
  produce an ongoing backwards effect.

  Forward backwards: smoothly cross-fades between forward and backward versions
  of the incoming audio.

  Reverse repeat: plays snippets of the input audio backwards, twice; the second
  time, a slight vibrato is added.

  Backwards machine by the sound guy is a virtual effect audio plugin for macos
  and windows.
specs: |-
  - Real-time audio reversal
