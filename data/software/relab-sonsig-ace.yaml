description: Sonsig ACE is a multi-voice, dual-engine dimensional expander, an ensemble-type chorus built on Relab's ACE modulation technology with 12-in-1 versatility, for adding width, depth and thickness to mixes without comb filtering.
details: |-
  Sonsig ACE uses a multi-engine architecture to go beyond the fixed patterns of basic chorus units, covering transparent stereo thickening through complex swirling textures.

  Six hand-tuned custom waveshaped LFOs (Low-Frequency Oscillators) deliver the modulation. They stay locked together even at extreme settings, which keeps the mix clear and avoids the phase problems and syncing issues of standard chorus effects.

  The COLOR control shapes the modulation across frequencies rather than filtering the output, setting the texture and spatial depth of the effect. Modes include NATURAL, THICK and FAT.

  The ENRICH parameter uses a delay line design to widen the stereo image without altering the source's core character or adding comb-filtering artifacts, and the effect keeps strong mono compatibility.

  Authorization requires no hardware dongle. Local computer authorization or an iLok USB key (V2 or above) can be used, and a free PACE iLok account, internet connection and the latest PACE drivers are required at the time of product activation.
specs: |-
  - Dimensional expander with 12-in-1 versatility
  - Multi-voice, dual-engine design with proprietary ACE modulation technology
  - Six hand-tuned custom waveshaped LFOs
  - COLOR modes including NATURAL, THICK and FAT for tonal character
  - ENRICH parameter for stereo image expansion without comb filtering
  - NATURAL mode maintains a balanced spectrum with minimal roll-off at the frequency extremes, preserving the mid-range
  - Exceptional mono compatibility
  - Hand-crafted factory presets
  - 64-bit only; Mac requires OS X 10.15 or higher (Intel or M1), Windows requires Windows 10 or higher
  - 2 GB of RAM
  - Authorization via local computer activation or iLok USB key (V2 or above); free PACE iLok account required
