description: Sonsig ACE is a cutting-edge dimensional expander designed to be the "Swiss-army knife" of dimensional effects, unlocking a new sonic universe with its powerful 12-in-1 versatility. ACE's unique multi-voice, dual-engine design and proprietary ACE modulation technology will allow you to sculpt lush, immersive soundscapes with the richest, most complex ensemble-type dimensional expander in no time.
details: |-
  Sonsig ACE boldly defies the limitations of conventional dimensional effects with its innovative multi-engine architecture. Basic "chorus" units often trap you with predictable patterns. ACE liberates you with unparalleled flexibility. Achieve transparent stereo thickening, complex swirling textures, and more, all with stunning depth and clarity.

  Six meticulously hand-tuned custom waveshaped LFOs (Low-Frequency Oscillators) deliver a lush, immersive modulation without muddying the mix. ACE's LFOs stay locked in, even when pushed to the limit. This preserves the pristine clarity of your mix, and helps you avoid the traditional phase problems and syncing hassles of standard chorus effects.

  Unlike generic filters, ACE's COLOR injects distinctive character, directly into the modulation, avoiding the flat, lifeless sound of typical chorus effects. It creates rich, complex textures rivaling high-end hardware. Shape the feel of your chorus effect, tailoring modulation across frequencies for precise control of texture and spatial depth. Choose from NATURAL, THICK, FAT, and more, each COLOR mode delivers a unique sonic flavor.

  ACE's ENRICH parameter delivers pristine depth with its delay line design. ENRICH expands your sound without altering its core character, eliminating unwanted artifacts and preserving crystal-clear detail. As you increase the ENRICH value, a luxurious and expansive stereo image unfolds, a smooth, immersive dimensional effect that adds a tangible sense of space to your mix.

  Authorization requires no hardware dongle. You can choose between local computer authorization or the iLok USB key (V2 or above), and a free PACE iLok account, internet connection and the latest PACE drivers are required at the time of product activation.
specs: |-
  - Dimensional expander with 12-in-1 versatility
  - Multi-voice, dual-engine design with proprietary ACE modulation technology
  - Six hand-tuned custom waveshaped LFOs
  - COLOR modes including NATURAL, THICK and FAT for tonal character
  - ENRICH parameter for stereo image expansion without comb filtering
  - NATURAL mode maintains a balanced spectrum with minimal roll-off at the frequency extremes, preserving the mid-range
  - Exceptional mono compatibility
  - Hand-crafted factory presets
  - 64-bit only; Mac requires OS X 10.15 or higher (Intel or M1), Windows requires Windows 10 or higher
  - 2 GB of RAM
  - Authorization via local computer activation or iLok USB key (V2 or above); free PACE iLok account required
