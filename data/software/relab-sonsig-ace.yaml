description: Sonsig ACE is a multi-voice, dual-engine dimensional expander with proprietary ACE modulation technology, designed to add width and depth to mixes. It offers 12-in-1 versatility for creating ensemble-type effects without traditional comb filtering artifacts.
details: |-
  Sonsig ACE is described as the ultimate modulation plug-in for mix engineers seeking unmatched width and depth, functioning as a dimensional expander and the Swiss-army knife of dimensional effects with 12-in-1 versatility.

  The plugin features a unique multi-voice, dual-engine design and proprietary ACE modulation technology, enabling users to sculpt lush, immersive soundscapes with rich, complex ensemble-type dimensional expansion.

  ACE includes six hand-tuned custom waveshaped LFOs that deliver modulation without muddying the mix. The LFOs stay locked in even when pushed to the limit, preserving clarity and avoiding phase problems.

  The COLOR parameter injects distinctive character directly into modulation, offering Natural, Thick, and Fat modes for tailoring texture and spatial depth. The companion ENRICH parameter features a revolutionary delay line design that expands your sound without altering its core character, eliminating artifacts while preserving detail.

  The plugin provides natural, artifact-free stereo spread that reduces center-channel congestion with exceptional mono compatibility. Authorization uses PACE iLok (V2+) or local computer authorization with no hardware dongle required.
specs: |-
  - Six hand-tuned custom waveshaped LFOs
  - COLOR parameter with Natural, Thick, and Fat modes
  - ENRICH parameter with revolutionary delay line design
  - Mono-compatible stereo expansion
  - Artifact-free stereo spreading without comb filtering
  - Multi-voice, dual-engine architecture
  - Formats: VST3, AU, AAX (64-bit)
  - Mac: OS X 10.15 or higher, Intel or M1 native, 64-bit
  - Windows: Windows 10 or higher, 64-bit
  - Authorization: PACE iLok (V2+) or local computer, no hardware dongle required
  - Compatible DAWs: Logic Pro 10.x+, Pro Tools 11.3.2+, Cubase 9.5+, Nuendo 8+, Ableton Live 9+
