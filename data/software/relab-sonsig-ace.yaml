description: "A 12-in-1 dimensional expander modulation plugin with a unique
  multi-voice, dual-engine design and proprietary ACE modulation technology.
  Creates lush, immersive soundscapes with rich dimensional textures, natural
  stereo spread without artifacts, enhanced thickness without comb filtering,
  and full mono compatibility. Features six hand-tuned LFOs with custom
  waveshaped oscillators."
details: |-
  1.1.2

  12-in-1 versatility
  Multi-voice dual-engine design
  Proprietary ACE modulation technology
  Six hand-tuned LFOs with custom waveshaped oscillators
  COLOR parameter (NATURAL, THICK, FAT modes)
  ENRICH parameter with revolutionary delay line design
  Natural stereo spread without artifacts
  Full mono compatibility
  Hand-crafted factory presets

  PACE iLok account required (dongle optional)
