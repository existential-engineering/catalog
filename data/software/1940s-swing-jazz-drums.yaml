details: |-
  Inspired by the swing jazz sound of the 40s, this collection of live acoustic drum loops has been recorded using a simple setup to capture that roomy sound typically found on records engineered by tom dowd.

  Authentic vintage slingerland drum kits with vintage zildjian cymbals were used to capture that swing jazz flavor of the era.

  Authentic vintage slingerland drums recorded in stereo 24-bit 48 khz. 423 drum loops (24-bit 48 khz). 27 one-shots (24-bit 48 khz). 17 vinyl crackles loops (24-bit 44.1 khz). Wav and rex2 format. Royalty-free.
specs: |-
  - 24-bit 48 khz audio quality
  - 423 drum loops
  - 27 one-shots
  - 17 vinyl crackles loops
  - Wav format
  - Rex2 format
  - Royalty-free
  - Authentic vintage slingerland drums
  - Vintage zildjian cymbals
