details: |-
  This dynamic addition to the Spitfire Symphonic series is an inspiring tool created by composers, for composers, offering the flexibility to design expressive shorts and intricate rhythmic patterns with ease, enhancing the realism of your scores and bringing them to life. Spitfire Symphonic Motions features London's finest string players performing a range of rebowing movements, rhythms and playing techniques. Experience the same high-end quality as the rest of our celebrated Symphonic libraries, expertly recorded in The Hall at AIR Studios.

  These performances are presented in an easy-to-use grid interface inside our award-winning dedicated plug-in, for instant access to almost infinite combinations of tempo-locked rhythms, techniques and realistic rebowing. Quickly express new ideas, or find new, unexpected combinations of notes to inspire your arrangements and compositions, creating tension and momentum.
specs: |-
  - 22 violins / 12 cellos
  - 40 articulations
  - 7 essential playing techniques
  - 4 rhythmic patterns (6ths, 8ths, 12ths, 16ths)
  - 6 additional Overlay techniques
  - 3 mic positions: Close, Tree, Ambient
  - 3 curated mixes
  - 12 x 40 Motions grid interface
  - 13.0 GB download size
  - 13.00 GB disk space required during install
  - macOS 11 to 26, Intel and Apple Silicon, 8 GB RAM minimum (16 GB recommended)
  - Windows 10 or 11 (64-bit), 8 GB RAM minimum (16 GB recommended)
  - 32-bit systems are not supported
  - Recorded in The Hall at AIR Studios by Jake Jackson
  - Spitfire Audio App required
