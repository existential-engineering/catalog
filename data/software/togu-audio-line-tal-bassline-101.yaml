description: TAL-BassLine-101 is a monophonic bass synthesizer that faithfully captures the essence of the iconic Roland SH-101, featuring a highly accurate analog emulation with a 24dB low pass filter, built-in sequencer and arpeggiator, filter-FM, distortion effect, and microtuning support.
details: |-
  TAL-BassLine-101 is an accurate emulation of the popular Roland SH-101, a monophonic bass synthesizer. The GUI is intuitive and easy to use, producing the raw sound associated with classic analogue devices, with some additional features like a distortion effect and a 12 dB filter mode.

  At the core of the instrument is a 24dB low pass filter meticulously calibrated to deliver an authentic analog sound without digital artifacts, even when pushed to extremes. All waveforms are generated in real-time rather than sampled, providing unmatched flexibility and sonic authenticity. Precise envelope modeling ensures correct transitions between overlapping notes.

  Filter-FM allows an oscillator waveform to be used as a modulation source for the filter cutoff, enabling a wide array of unique sounds beyond what the original hardware offered. The built-in step sequencer and arpeggiator with swing support make it easy to create classic acid basslines and rhythmic patterns.

  MIDI integration includes full automation support in DAWs and MPE support for cutoff and volume parameters. Microtuning is supported including MTS (MIDI Tuning Standard). The plug-in ships with an extensive factory preset library and supports third-party sound banks.
specs: |-
  - Monophonic (primary) and polyphonic mode
  - 24dB low pass filter with authentic analog calibration
  - 12dB filter mode
  - Real-time oscillator waveform generation (no sample playback)
  - Filter-FM: oscillator waveform as filter cutoff modulation source
  - Sub-oscillator
  - Built-in step sequencer with slide and accent
  - Arpeggiator with multiple modes and swing (50–75%)
  - Bandlimited distortion effect
  - MPE support for cutoff and volume parameters
  - Microtuning support including MTS (MIDI Tuning Standard)
  - 14-bit MIDI controller support for CC 1–31
  - MIDI drag-and-drop export
  - Preset browser with factory and user presets
  - Multiple UI color themes
  - Scalable UI
  - Windows 10 or higher (64-bit host)
  - macOS 10.11 or higher (64-bit host), Universal Binary 2 (Intel + Apple Silicon M1/M2/M3)
  - Pro Tools 10.3.6 or higher for AAX (64-bit)
  - Linux 64-bit / Ubuntu 20.04 or similar
