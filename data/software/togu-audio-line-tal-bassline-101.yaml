description: TAL-BassLine-101 is an accurate emulation of the popular SH 101. The GUI is intuitive and easy to use. It produces the raw sound you know from analogue devices with some additional features like a distortion effect and a 12 dB filter mode.
details: |-
  TAL-BassLine-101 is an accurate emulation of the popular SH 101. The GUI is intuitive and easy to use. It produces the raw sound you know from analogue devices with some additional features like a distortion effect and a 12 dB filter mode.

  Experience the TAL-BassLine-101, a monophonic bass synthesizer that faithfully captures the essence of the iconic SH-101 while adding a touch of modern versatility.

  The 24dB low pass filter is meticulously calibrated to deliver an authentic analog sound without any unwanted digital artifacts, even when pushed to extremes. Every detail, including envelope transitions between overlapping notes, is carefully modeled. All waveforms are generated in real-time rather than sampled, providing flexibility and sonic authenticity.

  Filter-FM uses an oscillator waveform as a modulation source for the filter cutoff, allowing a vast array of unique sounds and adding a modern twist to the classic SH-101 experience. A built-in sequencer and arpeggiator cover intricate bass patterns and rhythms, and a distortion effect adds harmonic richness and crunch.

  Parameters can be controlled and automated over MIDI in the host, including MPE support for cutoff and volume. The plug-in ships with a preset browser and sound banks, and supports microtuning including MTS.
specs: |-
  - Authentic emulation of the Roland SH-101 with raw analog character
  - Monophonic bass synthesizer with poly mode
  - 24dB low pass filter calibrated for authentic analog tone, plus a 12 dB filter mode
  - Precise envelope modeling including transitions between overlapping notes
  - Real-time oscillators, no sampled waveforms
  - Filter-FM using an oscillator waveform as modulation source for filter cutoff
  - Built-in sequencer and arpeggiator
  - Bandlimited distortion effect
  - MIDI control and automation with MPE support for cutoff and volume
  - Preset browser with factory presets and sound banks
  - Microtuning support including MTS
  - Scalable UI with high-resolution screen support and multiple color themes
  - Windows: Windows 10 or higher (64 bit host)
  - macOS: 10.11 or higher (64 bit host), Universal Binary 2 with native Intel and Apple silicon support
  - Linux: 64 bit, Ubuntu 20.04 or similar
  - AAX: Pro Tools 10.3.6 or higher (64 bit)
  - Demo restriction: the plug-in produces a rising white noise sound every minute
