description: Lyrical Violin Phrases contains inspiring instruments for cinematic and creative scoring. Unafraid to take the spotlight, it offers the bold, passionate and high quality solo magic that traditional sampling has yet to achieve.
details: |-
  Lyrical Violin Phrases is the third installment in Sonuscore's "Lyrical" series, a set of phrase-based instruments aimed at cinematic and creative scoring. Rather than sustained single notes, it plays back complete solo violin performances: pressing a key instantly evokes a characteristic, unmistakeably human touch that can then be adjusted in key, speed, length, succession and connection of phrases. The recorded material covers a wide stylistic range, from melodic passages and ethnic phrases to double-strings, trills, sul ponticelli and other techniques.

  The library was performed by two violinists. Veer Csongor is a classically acclaimed violinist from Budapest, Hungary, whose passionate, Hollywood-style playing appears in film and video game soundtracks including the Elder Scrolls Online series. Sebastian Caspar is an award-winning violinist from Berlin who has played with the Berlin Philharmonic Orchestra and taken part in film music recordings alongside his classical orchestra and ensemble work. Sonuscore describes the combination of the two as giving the library a style and character that is impossible to recreate with traditional samples.

  The content runs to over 310 unique, live-performed phrases split into 19 themes, each theme differing in style and mode. Every standard theme carries 5 different phrases, and each phrase is divided into separate starting, middle and end phrases so that passages can be freely recombined. Two short end phrases per theme allow passages to be concluded or switched, and a central speed knob gives precise timing control, the phrases having been recorded to fit multiple tempi and to remain expressive without a set meter. A legato solo instrument is included for connecting and advancing phrases or writing new melodies outright.

  The interface is the same one introduced with Lyrical Cello Phrases: a main page giving instant access to the essential controls, with room to dive deeper and shape the sound. Multiple phrases can be assigned across the keyboard and switched between, each phrase carries a waveform preview, and an FX page provides EQ, delay and reverb. The instrument requires the full version of Native Instruments KONTAKT; the free Kontakt Player runs it in demo mode only.
specs: |-
  - Over 310 unique, live-performed violin phrases
  - 19 themes, each different in style and mode
  - 5 different phrases per standard theme, each split into separate starting, middle and end phrases
  - 2 short end phrases per theme for concluding and switching passages
  - Speed knob for precise timing control; phrases recorded to fit multiple tempi
  - Legato solo instrument included for connecting phrases or playing custom melodies
  - Multiple phrases assignable across the keyboard with switching between them
  - Waveform preview for each phrase
  - FX page with EQ, delay and reverb
  - Performed by violinists Veer Csongor and Sebastian Caspar
  - Requires the FULL version of Native Instruments' KONTAKT 5 (version 5.8.1 or higher)
  - The free KONTAKT PLAYER is not sufficient: it only runs the instrument in DEMO mode
  - Intel Core 2 Duo processor recommended
  - Mac OS X 10.11 or higher
  - Windows 7 or higher
  - 4 GB RAM
  - At least 2 GB of free hard disc space
