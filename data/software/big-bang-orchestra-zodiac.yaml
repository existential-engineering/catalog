details: |-
  Big Bang Orchestra: Zodiac marks the daring finale of our monumental series.
  With 112 string players alone, the Massive sound of its oversized ensembles
  makes for a bold statement that elevates and enriches your arrangements with
  epic breadth and power. The collection includes seven ensembles: first violins
  30 players, second violins 26 players, violas 20 players, cellos 22 players,
  basses 14 players, horns 12 players, trombones 9 players.

  Recording these very large string sections is not so much about volume they
  deliver an especially lush and smooth sound that adds a beautiful warmth to
  your tracks. Likewise, the horns offer round and somber tones at lower volume
  levels. What's really mind-blowing is the extremely powerful and blaring
  fortefortissimo of 12 horn players on the edge of what's possible on their
  instruments. Similarly, the raw and powerful ensemble of nine trombones offers
  an extra fortefortissimo layer, too not for the faint of heart.

  Each of bbo: zodiac's ensembles was recorded separately at our own scoring
  stage, synchron stage vienna, with a multitude of close and mid microphones,
  decca tree, as well as surround and high surround mics. The included mixer
  presets deliver a perfectly engineered sound out-of-the-box that integrates
  seamlessly with all the other modules of the big bang orchestra series.

  Bbo: zodiac also includes combinations of several individual sections within
  one powerful preset, even with polyphonic legato. "all strings" features all
  five string sections playing together, either with the original voicing
  layered over a six octave span, or with condensed voicing over a four octave
  span. Octave combinations provide two ensembles playing in octaves, such as
  first and second violins, violas and cellos, cellos and basses, etc. The "epic
  legato combo" features the horn, viola and cello sections with two additional
  clarinets, all performing legatos together.

  Articulations of the string ensembles include short notes (bold and agile),
  long notes and legatos with regular and soft releases played unerringly by the
  musicians to create beautifully articulated note fade-outs, sforzato,
  sforzatissimo and tremolos. Additional articulations of the brass patches
  include the separately available blaring fortefortissimo layer, short and long
  swells, as well as fast and slow horn rips.
