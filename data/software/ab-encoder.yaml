details: |-
  'ab encoder' is the only encoder you'll ever need: simple, smart, and quick. We created this plugin so that you could grab any mono, stereo, quadraphonic 4.0, surround 5.1, 7.1, atmos beds 7.1.2, or 7.1.4 signal and encode it in a matter of seconds to ambisonics (1oa, 2oa or 3oa).

  No need to spend time tuning or placing speakers or arranging their positions - the algorithm was written to follow the current surround standards so that you can focus on your projects without being distracted. No need to spend time selecting which ambisonics order you want, etc - the algorithm will automatically adapt its encoding algorithm to your track's width.

  Finally, as usual, 'ab encoder' will constantly check for your signal's chain and inform you if there's any anomaly. In a matter of seconds, you will have your traditional wav file converted to the best ambisonics order possible.

  Finally, a panner will help you place the encoded signal in the three-dimensional field, in case you want to lift it, lower it, rotate it, and even increase the distance to the listener - a great tool for creating soundscapes from traditional wav files.
