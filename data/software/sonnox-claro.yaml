description: Claro is an EQ plugin for mixing and mastering with three views. Produce covers broad tonal moves, Tweak adds precise frequency control with a real-time analyser, and Mix displays every Claro instance in a project so frequency masking between tracks can be seen and resolved.
details: |-
  Claro by Sonnox is an EQ plugin for mixing and mastering. Three views, Produce, Tweak, and Mix, adapt the plugin to the stage of production being worked on, from broad tonal ideas through to surgical correction.

  Produce view is for broad moves that shape a track, instantly adding depth, air, or punch to any instrument. Its visualiser gives a clear picture of the track's energy at a glance, helping carve out space while keeping the sound natural.

  Tweak view goes deeper into precise frequency control, offering detailed EQ adjustments with a real-time analyzer that adapts as moves are made. Problematic resonances can be identified and addressed with pinpoint accuracy, sculpting the sound with surgical precision while maintaining musicality.

  Mix view gives a holistic view of the whole mix, displaying all Claro instances across a project so frequency interactions between tracks can be visualised and adjusted simultaneously. Claro shows exactly where frequency masking is happening, helping decide whether it is adding warmth and body or causing muddiness and clashing, so masking issues can be resolved and space created for each element.

  The adaptive interface lets users dive deep into tonal shaping while preserving CPU resources. Each Sonnox plugin licence includes two simultaneous activations, authorised through a free iLok account on a local machine, an iLok2 or iLok3 USB dongle, or iLok Cloud.
specs: |-
  - Three workflow views: Produce, Tweak and Mix
  - Produce view with track energy visualiser for broad tonal moves
  - Tweak view with real-time analyzer for surgical frequency control
  - Mix view showing all Claro instances across the project simultaneously
  - Real-time frequency masking visualisation between tracks
  - Resonance detection with visual feedback
  - Instrument-specific suggestions
  - EQ curve comparison and track pairing in Mix view
  - Adaptive interface designed to preserve CPU resources
  - macOS 10.13 High Sierra or later
  - Windows 10 (64-bit) or later
  - AAX-Native requires Pro Tools 11 or later
  - Licence includes two simultaneous activations
  - iLok authorisation: local machine, iLok2/iLok3 USB dongle, or iLok Cloud (one activation only)
