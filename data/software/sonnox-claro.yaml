description: Built to enhance producer's creativity and create a smoother EQ workflow. It's easy to get distracted with the possibilities that come with modern EQs.
details: |-
  Three adaptive interface views — Produce, Tweak, and Mix — tailored to each stage of the production workflow. Real-time frequency masking visualization to identify clashes between instruments across a mix. Instrument-specific guidance to inform EQ decisions contextually. Per-instance mix analysis with stereo width control and auto-gain functionality. Supports two simultaneous activations per license via iLok.
