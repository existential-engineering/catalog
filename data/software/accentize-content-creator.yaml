description: Content Creator is a bundle of DialogueEnhance and DeRoom for
  podcasters, video creators, and multimedia producers seeking clean,
  professional dialogue with automated processing.
details: |-
  The Content Creator Bundle contains two plugins — DialogueEnhance and DeRoom — designed for podcasters, video editors, and multimedia producers.

  DialogueEnhance is an intelligent automatic speech processing tool with a De-Noise module, Automatic EQ, Automatic Compressor, and Automatic LUFS leveling. It enhances the quality of speech recordings with minimal parameter adjustment.

  DeRoom is a machine-learning based reverb removal plug-in. An artificial neural network trained on many different room scenarios separates direct sound from reflection components in real time, suppressing reverb tails, echoes, and room resonances.

  License delivery via iLok (free iLok account required).
