details: >-
  Absolute piano virtual steinway b is a virtual instrument audio plugin and
  software application for windows that functions as a VST plugin and standalone
  application.


  The steinway b piano has been sampled from a steinway model b piano. It sounds
  large and deep and can be used for all kinds of music from pop/rock to
  classical music. It has been recorded every 2 notes, with 4 levels of
  velocity. V4 introduces smooth crossfade between each layer for a better
  transition between each velocity layer.


  The steinway model b is a magnificent 6' 10 1/2" (211cm) grand piano often
  referred to as "the perfect piano." it's a wonderfully balanced and versatile
  piano that does extremely well in intimate settings, teaching studios, and
  mid-sized venues.


  Version 4.2 introduces a new revolutionary concept that emulates not only the
  sound of the piano by using a quality soundbank and adding real-time specific
  effects on it, but truly emulates the resonance of the piano from the inside.
  New features include hammer simulation, tonal simulation, sympathic resonance
  emulation, a new reverberator using schroeder reverb algorithm with fdn
  network type reverb, a new host for standalone use with piano roll playback
  and recording, new sequencer and MIDI tools, new preset bank manager, and
  enhanced sound using cross-fade and overlaps.


  The absolute piano concept brings to the pianist a lightweight yet fantastic
  sounding piano emulation with plethora of options to enjoy playing favorite
  pieces using today's technology. It can play as a vsti in favorite host on
  windows, as a standalone application powered by minihost, play MIDI piano
  pieces and save them as wav files, add background sounds for different
  environments, record performances, include unique simulation features to tweak
  sounds, provide extensive high-quality multi-effects including the exclusive
  peek punch, load in memory in less than 10 seconds on regular computers, run
  on netbooks and small laptops, support MIDI keyboard input, mouse control, and
  computer keyboard input in standalone mode, and play 4 hands with absolute
  piano playing alongside while recording.
