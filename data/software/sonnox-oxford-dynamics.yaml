description: A Gate, Expander, Compressor, Limiter & side-chain EQ in one
  Plugin. A powerhouse of dynamic control in a single plugin that features six
  independent processes for precision dynamic sculpting of your tracks.
details: |-
  Oxford Dynamics combines six processes in one interface: gate, expander, compressor, limiter, side-chain EQ and a Warmth control. It delivers the dynamics section of the Sony OXF-R3 console, known for its ultra-low noise, and runs with minimal CPU load. Its frequency-selective compression allows targeted control, from vocal peaks through to drum transients.

  Adjustable side-chain EQ lets you target exactly where and how the dynamics processor reacts, allowing techniques like de-essing without affecting the entire signal, or kick-drum-triggered bass compression for rhythmic interplay. This flexibility opens up advanced mix strategies that go far beyond standard dynamics processing.

  Engage the Warmth control to introduce harmonically rich, tube-like saturation that enhances presence and depth without muddying your mix. This blend of clarity and character makes it equally at home in transparent mastering applications or in creative, colour-driven mixing.
specs: |-
  - Six dynamics tools in one plugin: Gate, Expander, Compressor, Limiter, side-chain EQ and Warmth control
  - Three compressor modes: Normal (versatile, forgiving, natural and balanced), Classic (vintage VCA character influenced by the DBX 160), Linear (precise attack and release control for sound design)
  - Frequency-selective compression via adjustable side-chain EQ, for de-essing or kick-triggered bass compression
  - Warmth control for harmonically rich, tube-like saturation
  - Delivers the dynamics section of the Sony OXF-R3 console, with ultra-low noise
  - Advanced DSP technology for transparent processing with minimal CPU load
  - Plugin formats: Audio Unit (AU), VST3, AAX-Native (Pro Tools 11 or later), AAX-DSP (Pro Tools Ultimate, Pro Tools HD, or Avid VENUE systems)
  - macOS 10.13 High Sierra or later
  - Windows 10 (64-bit) or later
  - Two simultaneous activations per licence, authorised with a free iLok account (Local Machine, iLok2/iLok3 USB device, or iLok Cloud)
  - AAX-DSP instances per chip, Dynamics (Full): 10 at 44.1/48 kHz mono, 9 at 48 kHz stereo, 4 at 96 kHz mono, 2 at 96 kHz stereo
  - AAX-DSP instances per chip, Dynamics 5.1 surround: 7 at 44.1/48 kHz, 3 at 96 kHz, 1 at 192 kHz
  - AAX-DSP instances per chip, Comp / Limiter: 14 at 44.1/48 kHz mono, 13 at 48 kHz stereo, 7 at 96 kHz mono, 6 at 96 kHz stereo, 3 at 192 kHz mono, 2 at 192 kHz stereo
  - AAX-DSP instances per chip, Gate / Expander: 18 at 44.1/48 kHz mono, 14 at 48 kHz stereo, 8 at 96 kHz mono, 6 at 96 kHz stereo, 4 at 192 kHz mono, 3 at 192 kHz stereo
