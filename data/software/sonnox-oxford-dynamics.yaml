description: A Gate, Expander, Compressor, Limiter & side-chain EQ in one Plugin. A powerhouse of dynamic control in a single plugin that features six independent processes for precision dynamic sculpting of your tracks.
details: |-
  Six independent processes: Gate, Expander, Compressor, Limiter, side-chain EQ, and Warmth control. Three compressor modes: Normal, Classic, and Linear for versatile dynamic control. Adjustable side-chain EQ for targeted, frequency-selective dynamics processing. Tube-like saturation via Warmth control inspired by the Sony OXF-R3 console design. Ultra-low noise processing with minimal CPU load.
