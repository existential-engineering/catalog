description: "One Kit Wonder: Pop Punk is a Kontakt drum library capturing the high-energy tones of classic pop punk, recorded at Crescent Records Studio with painstaking detail. It features a spanking high snare, compact kick and toms, and bright cymbals for mix-ready punch without losing the natural sound of the kit. Built-in Master EQ, parallel compression, reverb, and a groove player are included out of the box."
details: |-
  Kontakt-based One Kit Wonder drum library with pop punk tones.
specs: |-
  - Requires Kontakt Player 7 or Kontakt 7 (latest version)
  - Mac OS X 10.15+ (64-bit only)
  - Windows 10 (latest Service Pack, 32/64-bit)
  - RAM: 4 GB minimum (6 GB recommended)
  - Disk: 1 GB for Kontakt Player + 4.1 GB for instrument
  - OpenGL 2.1+ required
  - Internet required for download and activation; offline use supported thereafter
