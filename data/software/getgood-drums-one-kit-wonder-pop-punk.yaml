description: "One Kit Wonder: Pop Punk is a Kontakt drum library capturing the
  high-energy tones of classic pop punk, recorded at Crescent Records Studio
  with painstaking detail. It features a spanking high snare, compact kick and
  toms, and bright cymbals for mix-ready punch without losing the natural sound
  of the kit. Built-in Master EQ, parallel compression, reverb, and a groove
  player are included out of the box."
details: |-
  One Kit Wonder: Pop Punk is characterful and fun, capturing the youthful essence of the high-budget glory days of the genre, combined with the full fidelity and impact of modern recordings.

  Overflowing with attitude, expect high energy tones all around with a spanking high snare, compact and toneful kick and toms, and bright, shimmering cymbals that wash in just the right way.

  One Kit Wonder: Pop Punk was recorded to painstaking levels of detail in the epic sounding live room of the Crescent Records Studio; the result is a virtual library dripping with realism and ambience.

  The library has been mixed to the point that it's delivering a knockout mix-ready punch without losing the natural sound of the kit, while simply rebalancing faders can offer wide variation in character to suit your production.
specs: |-
  - Requires Kontakt Player 7 or Kontakt 7 (latest version)
  - Mac OS X 10.15+ (64-bit only)
  - Windows 10 (latest Service Pack, 32/64-bit)
  - RAM: 4 GB minimum (6 GB recommended)
  - Disk: 1 GB for Kontakt Player + 4.1 GB for instrument
  - OpenGL 2.1+ required
  - Internet required for download and activation; offline use supported thereafter
