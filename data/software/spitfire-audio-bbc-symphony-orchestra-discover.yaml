description: Write music with the world-famous BBC Symphony Orchestra, now including a concert grand piano. Discover 34 instruments, brought to life inside our free, easy-to-use plugin, compatible with any major music creation software, from Garageband to Pro Tools.
details: |-
  Designed to make orchestral scoring accessible to music creators of every level, BBC Symphony Orchestra Discover is an inspiring gateway into orchestral composition, recorded at the iconic home of the BBC Symphony Orchestra, Maida Vale Studios, also host to The Beatles, Hendrix, Bowie, and countless film scores. It features the same professional recording process as both the Core and Professional editions in an incredibly lightweight and accessible package (only 240MB).

  We have selected 34 instruments and 47 techniques available with one mix signal, enabling you to write instantly great-sounding orchestral music, presented in a beautifully designed, easy-to-use plugin, with simple controls. Owners of BBCSO Professional and Core will automatically receive Discover for free.

  Now including piano! An exciting new addition to the BBCSO line, the BBCSO Piano faithfully captures the live concert sound of a pristine Steinway Model D grand, captured in the same stunning acoustics as the orchestra, Maida Vale Studio One.

  Presented in our award-winning dedicated plugin (VST3, AU, AAX) we worked with ustwo, one of the world's best design and user-experience agencies to create a composition tool that's easy to use, intuitive and inspiring.

  One orchestra, three editions. Each edition is fully interchangeable through Spitfire's innovative mode switching technology, making it easier than ever to share and collaborate with fellow composers, regardless of which edition they own. This makes Discover an extremely useful tool for composers of all levels writing on the go, or with the most basic technical setup, who can then go on to complete their compositions in Core or Professional.
specs: |-
  - 34 instruments
  - 47 playing techniques
  - 1 mix signal
  - Dedicated Spitfire Audio plugin, no third-party sampler required
  - Recorded at Maida Vale Studios, the home of the BBC Symphony Orchestra
  - Strings: Violin 1, Violin 2, Violas, Celli and Basses with Long (vib), Spiccato, Pizz and Trem
  - Woodwind: Piccolo, Flutes, Oboes, Clarinets and Bassoons with Long and Stacmo
  - Brass: Horns, Trumpets, Tenor trombones, Bass trombones and Tuba with Long and Stacmo
  - Piano: Steinway Model D concert grand recorded in Maida Vale Studio One
  - Mode Switching, fully interchangeable with the BBCSO Core and Professional editions
  - Interface designed with user-experience agency ustwo
  - Library size 240MB, 360 MB disk space required during install
  - macOS 11 to macOS 26, both Intel and Apple Silicon/ARM supported
  - Windows 10 or Windows 11, 64-bit, latest Service Pack
  - Minimum 2.8GHz quad-core i5 or AMD Ryzen 5 with 8GB RAM, recommended six-core i7 or Ryzen 7 with 16GB RAM
  - 32-bit systems are not supported
  - Single-user licence, installable on up to two computers at a time
