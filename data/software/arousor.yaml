details: >-
  Arousor offers empirical labs' classic knee compression in a plug-in.


  Features foolproof operation with an almost impossible chance of getting a bad
  sound. Includes empirical labs white knobs with parameter readout and direct
  entry, proprietary empirical labs detector modeling, and high resolution
  capabilities.


  Broadband saturator controllable by user with a novel approach to allow
  control over peaks. Unique atmod attack modification control changes the shape
  of the initial attack and can lengthen attack times in a different manner than
  the attack control.


  Hp sidechain eq and bp sidechain eq included. Rivet provides a brick wall
  ratio great on room mics and for skimming peaks, and is linkable with the
  stereo version.


  Blend control allows mixing in the dry signal with the compressed one.
  Includes 18 lock n load presets, finely tuned and named intuitively.
