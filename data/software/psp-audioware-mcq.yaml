description: PSP McQ captures the sonic character and functionality of various classic console equalizers such as the versatile MCI console EQs, adding modern features such as adjustable high pass and low pass filters, shelving filter steepness controls, optional bell filters for the low and high bands, and three nominal Q values for the midrange filters.
details: |-
  PSP McQ captures the sonic character and functionality of various classic console equalizers such as the versatile MCI console EQs. However, while PSP McQ was inspired by these analog classics, it adds several modern features such as adjustable high pass and low pass filters, filter steepness (resonance) controls for the shelving filters, optional bell filters for the low and high bands, and three nominal Q values for the midrange filters.

  PSP McQ is packed with musical features, such as gain following Q factors for the midrange bell type filters. The PSP McQ is well suited for deep track tweaking in order to get the desired sound for a track, or to achieve great track separation in the mix.

  PSP McQ also includes PSP's unique second generation SAT(uration) option in the output section. This both protects against digital clipping in software or hardware following the plug-in, and adds a smooth, overdriven sound to hard-driven signals. The Saturation algorithm is located after output level control in PSP McQ's internal chain and its ceiling reference level is set up a fraction of dB below 0dBFS.
specs: |-
  - Emulates the sonic character and functionality of classic console equalizers, particularly MCI console EQs
  - Adjustable high pass and low pass filters
  - Filter steepness (resonance) controls for the shelving filters
  - Optional bell filters for the low and high bands
  - Three nominal Q values for the midrange filters
  - Gain following Q factors for the midrange bell type filters
  - Second generation SAT(uration) option in the output section, placed after output level control with a ceiling reference a fraction of a dB below 0dBFS
  - Windows: VST 2.4 compatible host, Windows XP SP2, Vista or 7 (x32/x64)
  - Windows: RTAS requires ProTools LE 8.0.0 or ProTools TDM 8.0.0 or later
  - Windows: AAX requires Pro Tools 10 or Pro Tools 11 or later
  - Mac (Intel): AudioUnit requires Mac OSX 10.5 or later and a 32 or 64-bit Cocoa-capable host
  - Mac (Intel): VST requires Mac OSX 10.5 or later and a 32 or 64-bit VST 2.4 compatible host
  - Mac (Intel): RTAS requires ProTools LE 8.0.0 or ProTools TDM 8.0.0 or later
  - Mac (Intel): AAX requires Mac OSX 10.8 or later and Pro Tools 11 or later
