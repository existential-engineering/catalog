description: PSP McQ is an equalizer plug-in inspired by classic console equalizers, most notably MCI console EQs. It combines analog character with modern features including adjustable high/low pass filters, resonance controls for shelving filters, optional bell filters, and three Q values for midrange filters.
details: |-
  Three nominal Q values for midrange filters. Gain-following Q factors for midrange bell filters. Adjustable filter steepness/resonance controls. High pass and low pass filters. SAT (saturation) option in output section.
specs: |-
  - Formats: AAX, AU, RTAS, VST2
  - Platforms: Windows XP SP2+ (x32/x64), macOS Intel 10.5+
  - Gain-following Q factors for midrange bell filters
  - Adjustable high pass and low pass filters with resonance controls
  - Optional bell filters for low and high frequency bands
  - Three nominal Q values for midrange filters
  - Second-generation SAT (Saturation) output section
  - Anti-clipping protection with smooth overdrive characteristics
