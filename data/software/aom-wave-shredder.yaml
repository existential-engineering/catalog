description: "Wave Shredder is a collection of destructive processors: Rate Reducer, Zero-time Gate, Waveform Cut&Fold, Chopper and Bit Crusher."
details: |-
  Wave Shredder is a collection of destructive processors: Rate Reducer, Zero-time Gate, Waveform Cut&Fold, Chopper and Bit Crusher.

  Rate Reducer is a zero-order hold rate reducer. Zero-time Gate makes input signal to zero immediately when the signal level falls the threshold. Zero-time Chopper plays the inverse of Gate. Cut&Fold section truncates under zero signal to zero, and in fold mode, the section put inverse truncated signal instead of truncation. Bit Crusher reduces signal's resolution.

  The product page illustrates each processor against a reference input waveform: Rate Reducer, Gate in Zero Mode and DC Mode, Chopper in Zero Mode and DC Mode, Folding Up (full rectifier), Remove Lower (half rectifier), Bit crusher, and Folding combined with DC Cut.

  Common features shared across A.O.M. plug-ins include support for 44.1k to 384kHz sample rates, 64-bit floating-point internal precision, latency compensation, factory and user presets, snapshot, undo/redo and reset to default.

  Version 1.16.2 (2023-04-17) updated the GUI with Hi-DPI images and added a waveform display and a low-pass filter. CLAP support arrived in 1.15.3 (2022-09-09), an AVX2 installer in 1.11.4 (2021-03-15), AAX-Native in 1.6.0 (2013-09-27), and Windows VST 64-bit plus Mac VST and Audio Unit in 1.4.0 (2012-11-21).
specs: |-
  - Rate Reducer: zero-order hold rate reducer
  - Zero-time Gate: sets input signal to zero immediately when the signal level falls below the threshold
  - Zero-time Chopper: plays the inverse of Gate
  - Cut&Fold: truncates under-zero signal to zero; in fold mode inserts the inverted truncated signal instead of truncation
  - Bit Crusher: reduces signal resolution
  - Gate and Chopper offer Zero Mode and DC Mode
  - Folding Up (full rectifier) and Remove Lower (half rectifier)
  - DC Cut
  - Waveform display (added in 1.16.2)
  - Low-pass filter (added in 1.16.2)
  - Hi-DPI GUI
  - Supports 44.1k - 384kHz Sample Rate
  - 64-bit Floating-point Internal Precision
  - Latency Compensation
  - Factory Preset
  - User Preset
  - Snapshot
  - Undo/Redo
  - Reset to Default
  - Windows system requirements: x64-compatible CPU, Windows 11 24H2 / 25H2; VST2, VST3, AAX-Native, CLAP
  - Mac system requirements: Intel / Apple Silicon, macOS Monterey 12, Ventura 13, Sonoma 14, Sequoia 15, Tahoe 26; VST2, VST3, Audio Unit, AAX-Native, CLAP
  - AVX2 installer available
