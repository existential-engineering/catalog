description: A collection of destructive audio processors including Rate
  Reducer, Zero-time Gate, Waveform Cut & Fold, Chopper, and Bit Crusher for
  creative sound design.
details: |-
  Wave Shredder is a creative destruction toolkit containing five distinct audio
  processing modules designed for aggressive sound design and lo-fi effects.

  The Rate Reducer performs zero-order hold rate reduction for classic sample
  rate reduction effects. The Zero-time Gate silences signals that fall below a
  threshold, creating hard gating effects. The Chopper provides inverse gate
  functionality for rhythmic stuttering effects.

  Cut & Fold truncates or inverts waveform sections for waveshaping and
  distortion effects. The Bit Crusher reduces signal resolution for classic bit
  reduction artifacts. Together, these five processors cover a wide range of
  destructive audio techniques.

  All processing operates at 64-bit floating-point precision with support for
  sample rates from 44.1kHz to 384kHz, ensuring that even destructive effects
  maintain technical quality in the signal chain.
specs: |-
  - Rate Reducer: zero-order hold rate reduction
  - Zero-time Gate: threshold-based signal silencing
  - Chopper: inverse gate for rhythmic effects
  - Cut & Fold: waveform truncation and inversion
  - Bit Crusher: signal resolution reduction
  - Sample rates: 44.1kHz to 384kHz
  - 64-bit floating-point internal precision
