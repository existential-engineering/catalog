details: >-
  Ambient nature noise is a VST format plug-in for windows, which adds the sound
  and atmosphere of alive and lifeless nature to your recordings. The purpose of
  the plug-in is to add sounds typically found in the surrounding world.


  For this goal, ambient nature noise has 21 sound profiles, including the sound
  of birds, insects, bats, trees and other flora and fauna, and the sounds of
  lifeless nature such as sound of waterfall and rain, wash, fire crackling and
  much more other.


  There are three slots in ann which you can use to mix different noise profiles
  to produce complex and variable noise environments. With the help of the
  embedded equalizer, it is possible to either emphasize or mute those parts of
  the noise profile you want.


  The features of the equalizer are selected in such a way that it keeps its use
  of noise sounding natural. In the set there are 32 of factory presets based on
  21 of noise profile.


  The built-in preset manager makes it easy to save the settings and quickly
  access them or share them with other ambient nature noise users. In addition,
  VST automation and full MIDI learning are supported.
specs: |-
  - VST format plug-in
  - Windows compatible
  - 21 sound profiles
  - Three mixing slots
  - Embedded equalizer
  - 32 factory presets
  - VST automation
  - MIDI learning
