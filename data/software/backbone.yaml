url: https://www.steinberg.net/vst-instruments/backbone/
description: Backbone drum re-synthesizer a revolutionary way to design your own
  drums. Backbone is your new, innovative drum designer for single kicks.
details: |-
  Backbone is an innovative drum designer for single kicks, snares, hi-hats,
  percussion, rises, hits and more. Layer up to eight samples and shape them
  with classic subtractive synthesis, decompose samples into tonal and noise
  elements, re-synthesize samples to manipulate them in unheard ways and apply
  up to eight effects with two fully routable buses all with a slick, extremely
  fast interface.

  Backbone 1.5 now comes with drumgan, an innovative drum generator developed by
  sony computer science laboratories, inc. (sony csl). Powered by artificial
  intelligence (ai), it creates new kick drum, snare drum and cymbal samples in
  a very fast, intuitive way. It also analyzes samples, can replicate them and
  create countless variations.

  The ai generates fresh kick drums, snare drums and cymbals, which can be
  further adjusted with all the tools that you have come to love in backbone.
  Use newly-created drum samples as a starting point, you can decompose, layer,
  resynthesize or create any other kind of transformation in backbone to craft
  your own, unique sound.

  The research team at sony csl comprises javier nistal and stefan lattner. They
  have developed a new system to generate drum sounds with generative
  adversarial networks (gan). Drumgan analyzed a large collection of kick drums,
  snare drums and cymbals to develop a new way of generating drums.

  Together with steinberg, sony csl has worked on implementing this impressive
  technology within backbone, helping musicians across the world to create new
  and unique, sample-based signature drums sounds.
specs: |-
  - Layer up to eight samples
  - Classic subtractive synthesis
  - Decompose samples into tonal and noise elements
  - Re-synthesize samples
  - Up to eight effects
  - Two fully routable buses
  - Drumgan ai drum generator
  - Artificial intelligence drum creation
  - Kick drum generation
  - Snare drum generation
  - Cymbal generation
  - Sample analysis and replication
  - Generative adversarial networks (gan)
