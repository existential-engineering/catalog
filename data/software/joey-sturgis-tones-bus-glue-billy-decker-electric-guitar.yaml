details: |-
  Overview
  Bus Glue Billy Decker Electric Guitar is an audio plugin made in collaboration with chart-topping mixer Billy Decker. With this plugin, you’ll be able to add Billy’s entire dynamic signal chain for electric guitar bus processing to your mix — EQ, compression, limiting and all. Unlock the tried-and-true secrets of a modern country master and you’ll be “Deckerating” your guitars in no time!
  Bus Glue Billy Decker Electric Guitar
  The Bus Glue Billy Decker Electric Guitar plugin is the perfect example of where Billy really leans into the rock n’ roll playbook — a favorite trick of the trade in modern country mixing. His electric guitar processing follows a similar recipe to the one many rock and metal mixers use. With a focus on driving the low-mids and pick attack, his guitars sound crisp and aggressive.
  This plugin’s got some serious color the harder you drive the input — don’t worry, just send it!
  About Billy Decker
  With 25 years of industry experience, Billy Decker has worked with some of the biggest names in the Nashville music scene. Country superstars including Sam Hunt, Dustin Lynch, Colt Ford, Rodney Atkins, Montgomery Gentry, Billy Ray Cyrus, Trace Adkins, Cassadee Pope, Chris Young, Parmalee & more. They all trust him to help their records achieve radio success and his work speaks for itself. His credits include over a dozen #1 singles, 50+ million albums sold, and billions of streams — and the hits keep coming!
  Decker’s signature sound is all over his recent chart successes — big natural drums, bright clear acoustics, and warm round bass. All of these have been refined down to intuitive plugin layouts for each instrument in the series. As Decker says, “these plugins offer decades of experience to mixers of any skill level.”
  About Bus Glue
  The Bus Glue series consists of bus processors designed to excel at controlling the dynamics of specific groups of instruments in a mix. By combining a variety of dynamic processors like EQs, compressors, saturation plugins, and limiters, with decades of chart-proven mixing expertise, we’re able to distill some of the most complex and awesome-sounding mixing chains into easily accessible tools for mixers and musicians of any experience level or background to enjoy.
  Ultimately, our goal with any Bus Glue plugin is to come up with something unique that no other plugin in your collection can do. For example, most compressors are designed too broadly, which is why you typically need to stack compressors or insert other processors in your bus chain to achieve desired results. However, Bus Glue processors are about as specific as you can get by design; that’s what makes them so useful.
  By using Bus Glue as your dynamic control across your various mix buses, you’ll expand your dynamic palette while crafting a whole new sound that is unrivaled by other plugins.
  See the full Bus Glue Billy Decker collection here.
