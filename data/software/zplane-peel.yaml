description: PEEL offers flexible spectral and spatial isolation, allowing users to isolate or extract specific parts of a stereo recording. Solo, mute or route individual instruments or vocals for external processing, with visual identification of sound elements in a mix.
details: |-
  PEEL is a spectral and spatial isolation plugin that lets you dig inside your stereo recordings to identify and isolate individual instruments or vocals. Its intuitive interface provides visual feedback to help locate specific elements within a mix.

  Once you've identified the sound element you want, you can solo or mute it directly within the plugin. This makes it easy to remove unwanted elements or focus on a particular instrument for closer inspection.

  For more advanced workflows, PEEL supports routing selected audio to external processing chains in DAWs that support multiple plugin outputs. This opens up creative possibilities for re-processing isolated elements.

  PEEL is compatible with both Intel and Apple Silicon Macs (macOS 13+) and Windows 10/11 (64-bit), and is available in AU, VST2, VST3, and AAX formats for broad DAW compatibility.
