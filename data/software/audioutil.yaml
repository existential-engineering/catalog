name: AudioUtil
manufacturer: sound-base-audio
primaryCategory: spectrum-analyzer
url: https://play.google.com/store/apps/details?id=org.sbaudio.audiotools
description: AudioUtil spectrum analyzer captures audio signals and analyzes
  them right on your phone in real-time.
details: |-
  Adjust multiple parameters for each utility, like frame size, zero padding,
  window type, range, and themes to name a few. This app can be used with a
  3.5mm 4-pole (trrs) external microphone (non-USB), if supported by phone.

  Oscilloscope: view sound waves in the time domain. Adjustable frame size.
  Amplitude measurement by dragging on the screen.

  Decibel meter: max-peak or rms amplitude readings in dbfs. View as a solid bar
  or multi-step graph. Peak tracking with variable time falloff.

  Fft graph: linear and logged frequency axis. Six window types. Peak tracking
  with frequency and amplitude readout. Rendering filter for high-accuracy
  readings on stable signals. Spectrogram: definable frequency limits to zoom in
  on desired frequencies. Adjustable zoom/scroll speed. Four themes/color maps.
  Frequency spectrum: view a fft analysis as a color spectrum. Linear and logged
  frequency axis. Four themes/color maps.
specs: |-
  - Real-time audio signal analysis
  - Spectrum analyzer
  - Oscilloscope
  - Decibel meter
  - Fft graph
  - Spectrogram
  - Frequency spectrum
  - 3.5mm 4-pole (trrs) external microphone support
  - Frame size adjustment
  - Zero padding
  - Window type selection
  - Range adjustment
  - Theme customization
  - Display freeze capability
  - Value readout dragging
  - Linear and logged frequency axis
  - Six window types
  - Peak tracking with frequency and amplitude readout
  - Rendering filter for high-accuracy readings
  - Definable frequency limits
  - Adjustable zoom/scroll speed
  - Four themes/color maps
  - Max-peak or rms amplitude readings in dbfs
  - Solid bar or multi-step graph display
  - Peak tracking with variable time falloff
  - Amplitude measurement by dragging
  - Time domain sound wave visualization
  - Screenshot capture via context menu
