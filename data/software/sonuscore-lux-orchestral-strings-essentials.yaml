  articulation palette. Designed for working composers in film, TV, games, and
  trailer music.
details: |-
  LUX Orchestral Strings Essentials is the focused edition of Sonuscore's LUX Orchestral Strings, aimed at composers scoring day to day for documentary, trailer, episodic TV, game cues, production music and sync briefs. It draws on the same source recording as the full version, a 70-piece symphonic string ensemble captured on a large scoring stage with 48 microphones in traditional symphonic seating, mixed by score mixer Peter Fuchs. What changes in Essentials is the scope of the toolset around that recording, narrowed to the sections and articulations the page says come up in everyday scoring work.

  All five sections of the orchestral string body are included, 1st Violins, 2nd Violins, Violas, Celli and Basses, each delivered as its own NKI for direct control inside Kontakt, so lines can be voiced independently and the sections balanced into a detailed orchestral template. The articulation set runs to sustains (Sustain, Strong Sustain, Whisper Sustain, Marcato), legato (Full Legato across the complete playable range, Whisper Legato and Legato), shorts (Staccato, Spiccato, Pizzicato), and tremolo and trills (Tremolo, Sul Ponticello Tremolo, Trill b2, Trill 2, and a Trills patch that autoselects between them).

  On top of the single articulations sit layered combinations playable from one instrument with no patch stacking. The Combis cover pairings such as Staccato with Spiccato, Staccato with Pizzicato, Sustain with Accented Staccato, Tremolo with Marcato and Sustain with Trills, while the Morphs run between two states, for example Sustain to Tremolo, Sustain to Sul Ponticello Tremolo, Whisper to Tremolo and Staccato to Spiccato. Morphing Articulations blend between two or more articulations in real time from the mod wheel, and S.A.T., Seamless Articulation Transitioning, lets an articulation change while a note is held, with a gentle key switch producing a gradual shift and a stronger one a quick change. Three Key Switch sets, Core Articulations, Advanced Textures and Morph Textures, group the articulations by scoring context.

  The rest of the feature set covers layering articulations to play them simultaneously, live-recorded trill figures, measured arpeggios and performance gestures, fluid staccatos recorded in real rhythmic contexts with an intelligent staccato mode for ostinatos, polyphonic aftertouch and a +8VA added octave throughout the instrument, and dynamics running from whispering ppp to roaring fff, pushed to 110%. The page is explicit about what stays with the full version: adaptive legato, legato for all sections, the complete set of core articulations, extended techniques such as harmonics legato and pendulum glissandi, the ensemble instrument, and the four microphone positions (Close, Decca, Far and the exclusive Bleed option). It runs in the free KONTAKT PLAYER, and after the initial download, installation and registration through Native Access it runs fully offline.
specs: |-
  - Five string sections, each delivered as its own NKI: 1st Violins, 2nd Violins, Violas, Celli, Basses
  - Sound source is the full LUX Orchestral Strings recording: a 70-piece symphonic string ensemble on a large scoring stage, recorded with 48 microphones in traditional symphonic seating
  - Cinematic mix engineered by score mixer Peter Fuchs, with DPA, Neumann and Schoeps microphones
  - Sustains: Sustain, Strong Sustain, Whisper Sustain, Marcato
  - Legato: Full Legato (complete playable range), Whisper Legato, Legato
  - Shorts: Staccato, Spiccato, Pizzicato
  - Tremolo and trills: Tremolo, Sul Ponticello Tremolo, Trill (b2), Trill (2), Trills (autoselect between b2 and 2)
  - Combis: Staccato + Spiccato, Staccato + Pizzicato, Spiccato + Pizzicato, Sustain + Accented Staccato, Sustain + Staccato Marcato, Tremolo + Marcato, Tremolo + Accented Staccato, Tremolo + Staccato Marcato, Sustain + Tremolo, Sustain + Trills
  - Morphs: Staccato to Marcato, Staccato to Spiccato, Sustain to Tremolo, Sustain to Sul Ponticello Tremolo, Sustain to Trills, Sustain to Trill (b2), Sustain to Trill (2), Whisper to Tremolo, Whisper to Sul Ponticello Tremolo, Tremolo to Sul Ponticello Tremolo
  - S.A.T. (Seamless Articulation Transitioning): change articulations mid-note
  - Morphing Articulations: blend between two or more articulations in real time via mod wheel
  - Three Key Switch sets by scoring context: Core Articulations, Advanced Textures, Morph Textures
  - Layer articulations and play them simultaneously
  - Live-recorded trill figures, measured arpeggios and performance gestures
  - Fluid staccatos recorded in real rhythmic contexts, with an intelligent staccato mode for ostinatos
  - Polyphonic aftertouch and +8VA added octave throughout the instrument
  - Dynamics from ppp to fff, pushed to 110%
  - Not included (full version only): adaptive legato, legato for all sections, the complete set of core articulations, extended techniques, the ensemble instrument, and the four mic positions (Close, Decca, Far, Bleed)
  - Works with the FREE KONTAKT PLAYER
  - KONTAKT Version 7.10.9 or higher
  - Apple Silicon Macs: macOS 13, 14 or 15 (latest update)
  - Intel Macs (i5 or higher): macOS 13, 14 or 15 (latest update)
  - Windows 10 or 11 (latest Service Pack), Intel Core i5 or equivalent CPU
  - Graphics hardware support for OpenGL 2.1 or higher and Direct 3D 11.1
  - 8 GB RAM (more recommended)
  - At least 9.4 GB of free hard disc space
  - Internet connection required only for initial download, installation and registration through Native Access; runs fully offline afterwards
