description: "Ample china pipa is composed of two sample libraries: master
  (traditional pipa timbre) and expert (modern style)."
details: |-
  Ample china pipa is composed of two sample libraries: master (traditional pipa timbre) and expert (modern style). The recording used ab and ms stereo techniques. The software is encrypted with the ilok anti-piracy system.

  Featured artists: master version: professor yin chen, the principal pipa player of china broadcasting chinese orchestra. Expert version: lisha shang, pipa virtuoso. Featured instrument: feng wei (handmade remake of pipa in dynasty ming, by pipa master weidong cao).

  Ample china pipa is recorded with two stereo techniques: ms and ab. Users can adjust the volume of different microphones to get more variety of sound. The recorded samples of tremolo have a long fade-in time, which can be divided into 90 different start points. They can be controlled by velocity, easily adapting to the need of different situations and styles.

  Resonance is an indispensable part of the expressiveness and realism of an acoustic instrument. Ample china pipa can control the resonance time and volume, simulate more realistic resonance. In real performance, a lot of playing noises are generated. Virtual instrument would sound unnatural without those noises. Ample china pipa can not only generate rich fret noise automatically, but also simulate the subtle sound of the nails touching the string.

  Strummer: real strum samples. 14 strum notes + 26 ways to play for every chord. Strum legato - both slide and hp can be played while strumming. 4 humanization settings. Select and detect 2 chord modes, any chords could be customized. Strum seq with customized rhythm.
specs: |-
  - VST plugin

  - Audio units plugin

  - VST 3 plugin

  - AAX plugin

  - Standalone application

  - Windows 7/8/10 64-bit

  - Macos 10.9 to 10.14

  - 8gb hard disk

  - Intel i5 or higher

  - Ilok anti-piracy system

  - 2 pipa libraries: master and expert

  - 8.6 gb total sample size

  - Ms and ab stereo recording techniques

  - 11 articulations: sustain, natural harmonic, non-exp tremolo, expression tremolo, full bend, bend up, bend down, triple, legato slide, hammer-on & pull-off, strum

  - Various tremolo: tremolo, rolling tremolo, shaking tremolo

  - Legato and slide tremolo features

  - 90 different tremolo start points

  - Tremolo switch and sustain switch

  - Advanced bend with physical modeling system

  - Legato smoother with flexible length & pitch and polyphonic support

  - Resonance control

  - Fret noise generation

  - Nail touching string simulation

  - Strummer with real strum samples

  - 14 strum notes + 26 ways to play per chord

  - Strum legato with slide and hp

  - 4 humanization settings

  - 2 chord modes with customization

  - Strum seq with customized rhythm

  - 8-band eq

  - 2-line compressor with rms & peak detection modes

  - Soft knee support

  - Auto release and auto makeup

  - 6-tap echo

  - Ir reverb with room, studio, hall, and larger hall types

  - 3d visualization of ir spectrum
