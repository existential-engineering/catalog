description: Meet Synth Warmer, a meticulously modeled analog synth filter emulation based on the iconic 1970s monosynth ladder filter. Packed with overload distortion and self-oscillation, Synth Warmer breathes life into synth or bass tracks, drum loops, risers, and more. Make your next track timeless with Synth Warmer!
details: |-
  Synth Warmer delivers the iconic ladder filter and drive circuit from the original 1970s monosynth directly in your DAW. Based on meticulous analog emulation of a 1973 "model d" monosynth, it captures the essence of classic hardware in a modern plugin.

  The plugin features classic low and high-pass filters derived from the legendary '70s monosynth ladder filter design, with a drive circuit capable of +48 dB of gain to achieve the classic "jacked-in" overdriven sound with overload distortion and self-oscillation capabilities.

  Synth Warmer includes a wet/dry knob for onboard parallel processing, oversampling up to 32x with separate settings for real-time and offline processing (adjustable on the fly), and a fully resizable GUI.

  Licensing is straightforward: a 100% perpetual license for use on multiple devices with no iLok authorization required, no hardware dongle, and zero subscription fees.
specs: |-
  - Analog emulation based on 1973 "model d" monosynth
  - Classic low and high-pass ladder filters
  - Drive circuit with +48 dB of gain
  - Wet/dry knob for parallel processing
  - Oversampling up to 32x (separate real-time and offline settings)
  - Resizable GUI
  - macOS 10.13+; Universal Binary 2 (Apple M1 and Intel)
  - Windows 10+ (64-bit)
  - Linux: tested on Ubuntu, Linux Mint, Debian, Manjaro
  - Intel i5 "Ivy Bridge" or newer recommended
