description: Add rich analog warmth and harmonic depth to synths, keys, and any source. Ladder filter, dead-simple controls, and studio-quality saturation. Try it free.
details: |-
  Synth Warmer is a meticulously modeled analog synth filter emulation based on the iconic 1970s monosynth ladder filter. Packed with overload distortion and self-oscillation, Synth Warmer breathes life into synth or bass tracks, drum loops, risers, and more. The page bills it as "the iconic ladder filter and drive circuit from the original 70s monosynth - in your DAW."

  Kazrog describes the emulation as next-gen analog modeling based on a 1973 "model d" monosynth, providing classic low-pass and high-pass filters built on that legendary '70s ladder filter design. The drive circuit supplies up to +48 dB of gain for what the page calls the classic "jacked-in" sound.

  A wet/dry knob provides onboard parallel processing, and oversampling is adjustable up to 32x with separate settings for real-time and offline rendering, changeable on the fly. The GUI is resizable to fit any window size.

  The plugin ships as a 64-bit VST, AU and AAX for Mac and Windows (Pro Tools 12 or higher required for AAX), and as VST3, VST2 or LV2 on Linux. All Kazrog plugins are Universal Binary 2, with native Apple Silicon and Intel support.

  Licensing is a 100% perpetual license valid on multiple devices, with no iLok authorization and no subscription fees. A time-unlimited free demo is available; the demo inserts random silent output intervals followed by a gentle fade and disables preset saving.
specs: |-
  - Analog emulation based on a 1973 "model d" monosynth
  - Classic low-pass and high-pass filters based on the '70s monosynth ladder filter design
  - Drive circuit with +48 dB of gain on tap
  - Self-oscillation and overload distortion
  - Wet/dry knob for onboard parallel processing
  - Oversampling up to 32x, separate real-time and offline settings, adjustable on the fly
  - Resizable GUI
  - Universal Binary 2 (native Apple Silicon and Intel)
  - Mac: macOS 10.13.x or higher
  - Windows: Windows 10 or higher strongly recommended
  - Linux: VST3, VST2 or LV2 compatible host (tested on Ubuntu, Linux Mint, Debian, Manjaro)
  - Apple M1 or Intel i5 "Ivy Bridge" CPU or newer strongly recommended
  - Pro Tools 12 or higher required for the AAX version
  - 100% perpetual license for multiple devices, no iLok authorization required
