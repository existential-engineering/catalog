details: |-
  Ample guitar rb aims to bring a rickenbacker 330 electric guitar sound to your studio. It is suited for 60-80's british pop with bridge pickup sample libraries.

  Sampling includes 11 articulations: sustain, palm mute, natural harmonic, hammer on & pull off, legato slide, slide in, slide out, pop, pinch harmonic, dead note, and mordent. Size: 2.8gb. Polyphonic legato and slide smoother enables realistic legato across any interval and speed. Drop tuning is supported, with lowest note down to d1. Authentic left-hand performance noises are included.

  Riffer 4 is a MIDI editor tailored for plucked string instruments with an all-new strumming and chord system. The innovative "strum note" treats multiple sub-notes within a chord as a single editable object, allowing unified control over strum time, velocity gradient, and legato parameters. Combined with authentic guitar fingering settings, this makes strum creation more intuitive and efficient, delivering results that are closer to real performance.

  Dual view modes enable seamless real-time switching between piano roll and guitar tab views, offering two perspectives for reviewing and editing compositions. String visualization system visualizes strings within the piano roll, enabling MIDI writing that adheres to authentic plucked instrument techniques by automatically preventing polyphony on the same string and intelligently assigning fingering.

  Tab reader 4 supports guitar pro files from gp3 to guitar pro 8 and is capable of importing entire bass tracks into riffer with full retention of fingering, articulations, and performance data. The amp and fx system includes an amp simulator with 7 classic amp heads (metal double, metal treble, lead 800, jazz 120, 65 twang, 65 delight, and 57 delight) paired with 8 guitar cabinets, each captured with 8 microphones. Built-in effects include 8-band eq, compressor, delay, and convolution reverb.
