details: |-
  Mercury-8 synthesizer builds on Cherry Audio's renowned Mercury legacy with a
  passionate focus on detail and modern technical advancements. Every aspect of
  the original hardware has been meticulously modeled to capture the authentic
  sound and behavior that made the JP-8 so legendary.

  Mercury-8 goes beyond Jupiter by offering expanded polyphony, versatile
  modulation options, studio-quality effects, expressive performance
  capabilities, and even data exchange with the original hardware. Cherry Audio
  utilizes advanced circuit and behavior modeling techniques to ensure
  unparalleled sonic accuracy and compatibility with the original synthesizer.

  Mercury-8 features a highly optimized dual-layer architecture that supports 16
  polyphonic voices per layer, enabling powerful split keyboard and dual-stacked
  modes. The comprehensive modulation matrix includes four slots with
  click-to-assign functionality, offering dozens of source and destination
  options.

  Mercury-8 features three independent effect chains with 20 studio-quality
  effects that can be customized, saved, and recalled. With over 600 presets
  including 64 original JP-8 factory patches, Mercury-8 transforms one of the
  greatest analog synths of all time into a fresh and inspiring tool for today's
  musicians and producers.
specs: |-
  - Dual-layer voicing architecture with 16 polyphonic voices per layer
  - Keyboard split and stacked layer modes
  - Two oscillators per voice with classic waveforms, sync, and exponential FM
  - High-pass and resonant low-pass filters with 12 dB and 24 dB slope options
  - Two full ADSR envelopes per layer with velocity control
  - Tempo-syncable LFO for each layer with retrigger option
  - Analog drift and condition controls for age adjustment
  - Solo, Unison, Poly-1, Poly-2, Multi, and Chord Memory assign modes
  - Over 600 presets including 64 original JP-8 factory patches
  - Comprehensive modulation matrix with four slots, 25 sources, 43 destinations
  - Syncable and transposable arpeggiator with Arp, Leap, Order, and Random modes
  - 16x4 polyphonic step sequencer with humanize options
  - Three independent customizable effect chains with 20 studio-quality effects
  - Import original JP-8 patch bank SysEx data via drag-and-drop
  - Export Mercury-8 preset data to SysEx format
  - User-adjustable oversampling control
  - Complete MIDI control and DAW automation
