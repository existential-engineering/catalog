description: Mercury-8 synthesizer builds on Cherry Audio's renowned Mercury
  legacy with a passionate focus on detail and modern technical advancements.
  Every aspect of the original hardware has been meticulously modeled to capture
  the authentic sound and behavior that made the JP-8 so legendary.
details: |-
  The JP-8 was released in 1981 as a flagship analog polysynth. Priced at $5,000, it quickly became a staple on stages and in recordings of the era, prominently featured in Michael Jackson's "Thriller," Duran Duran's "Hungry Like the Wolf," and Marvin Gaye's "Sexual Healing." Today, the JP-8 remains celebrated for its diverse sonic palette, including lush pads, soaring brass and strings, and exhilarating leads. It features 16 analog oscillators, two per voice, and offers eight-voice polyphony, and it was one of the first synthesizers to enable both keyboard splitting and the simultaneous layering of two patches. Production of the original ended in the mid-1980s.

  Cherry Audio's Mercury-8 utilizes advanced circuit and behavior modeling techniques to ensure sonic accuracy and even compatibility with the original synthesizer. Unlike sample-based emulations, Mercury-8 uses virtual analog synthesis, enabling comprehensive, dynamic control over all synthesis parameters while remaining compact. Its precision not only captures the distinctive sound and essence of the JP-8 but also facilitates data exchange with MIDI-modified hardware.

  Mercury-8 features a highly optimized dual-layer architecture that supports 16 polyphonic voices per layer, enabling powerful split keyboard and dual-stacked modes. Analog drift and condition controls allow fine-tuning of the synth's age and state, and the multi-voice mode provides subtle to extreme variations in pitch, panning, filtering, and envelopes for tones and patterns.

  The comprehensive modulation matrix includes four slots with user-friendly click-to-assign functionality, offering dozens of source and destination options. The built-in arpeggiator and 16x4 programmable polyphonic step sequencer are both syncable and transposable, and feature flexible humanize settings to create endless pattern possibilities.

  Mercury-8 features three independent effect chains and provides 20 studio-quality effects for chains that can be customized, saved, and recalled. It ships with over 600 presets, including precise recreations of the original JP-8 factory patches along with "Factory Plus" enhanced versions.
specs: |-
  - Highly optimized, massive dual-layer voicing architecture with 16 polyphonic voices per layer. Keyboard split and stacked layer modes allow two simultaneously playable layers, with separate per-layer controls for all parameters, including synthesis, modulation, patterns, and effects
  - Two oscillators per voice for each layer with classic waveforms, sync, and accurate exponential FM cross-modulation
  - Triangle, ramp, sine sawtooth, noise, and square or variable pulse waveforms with pulse width modulation
  - High-pass and resonant low-pass filters for each layer recreating the Jupiter curves, with 12 dB and 24 dB slope options
  - Two full ADSR envelopes per layer with velocity, independently assignable to filter, amp, and modulation
  - Tempo-syncable LFO for each layer, with retrigger option
  - Analog Drift and Condition controls to fine-tune the "age" of the synth from pristine new to unstable vintage, with adjustable VCO, VCF, VCA drift, and envelope slop
  - Solo, Unison, Poly-1 and Poly-2, Multi, and single-key Chord Memory assign modes
  - Multi-voice mode that adds adjustable "mini synth" trimmers to provide subtle or extreme voice variation in pitch, panning, filter, and envelopes to tones and patterns
  - Repurposed "digital display" interface with clickable access to extended features such as trigger and note priority, unison voices, multi-voice modes, condition, and drift
  - Over 600 presets by ten sound designers, along with recreations of the 64 original JP-8 factory patches (with enhanced versions) and the eight factory setups, all accessible in a preset browser. Also included are template presets for sound design, and a MIDI controller mapping compatible with the X/Xm hardware synthesizer
  - Comprehensive modulation matrix with four slots and click-to-assign functionality: 25 sources and 43 destinations with optional "Via" controls, including Mercury-8's integrated effects
  - Syncable and transposable arpeggiator for each layer with Arp, Leap, Order, and Random modes, and Swing, Chance, and Feel to add degrees of randomness to arpeggiated patterns
  - Syncable and transposable 16x4 polyphonic step sequencer for each layer with Start, Stop, Auto Start, and humanize options, with accurate DAW clock and step synchronization
  - Three independent customizable chains of effects, one for each layer plus a global layer, with an individual effects modulator for each layer
  - 20 studio-quality effects that can be arranged, saved, and recalled within their effects chains, which are compatible and can be shared with Cherry Audio's Trident Mk III synthesizer and other releases from October 2025 onward
  - Effects: BBD Flanger, Compressor, Digital Delay, Digital Reverb, Distortion & EQ, Dual Delay, Dual Ensemble, Dual Phaser, Envelope Filter, Flanger & Chorus, Galactic Reverb, Lo-Fi, Lushverb, Ring Modulator, Seven Band EQ, Spring Reverb, and Tape Echo. New in Mercury-8 are DCO Chorus, Panner, and Pulser
  - Persistent mini UI Effects control tray for on/off, solo, bipolar modulator amount slider, and dry/wet mix for each effect. Global FX on/off, level, and stereo expand
  - Utility panels to copy, paste, swap, and move layers, effects chains, and sequencer data between presets
  - Directly import original JP-8 patch bank SysEx data (Encore Electronics and Groove Electronics formats) via drag-and-drop
  - Export Mercury-8 preset data to SysEx data (Encore Electronics format)
  - Standalone virtual instrument and plug-in versions included
  - User-adjustable oversampling control
  - Complete MIDI control and DAW automation for all controls, with MIDI learn and mapping (Preset and Global)
  - Focus zoom-in feature, as well as standard UI zoom and resize via drag
  - Complete documentation available directly online from the instrument or in downloadable PDF format
  - macOS 10.13 or above, macOS 13 Ventura supported, 64-bit required, native Apple M1 or greater processor support including Ultra, 3.4 GHz Quad-Core or M1 CPU with 8GB of RAM recommended, 87 MB hard disk space
  - Windows 7 or above (including Windows 11), 64-bit required, Quad-core computer with 8GB of RAM recommended, 87 MB hard disk space
  - Internet connection required for product activation
