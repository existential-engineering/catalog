details: |-
  The plugin AutoTremWah combines features of the previous plugin
  pechenegtremolo and envelope filter. You can choose 3 types of filter, 3 types
  of filter envelope regime, set the sensitivity to the input signal and
  parameters of the filters.

  As in the pechenegtremolo you can set the lfo parameters: use all the features
  of pechenegtremolo plugin, switch off lfo and use only input envelope signal
  to control filter cutoffs, or use only lfo or a mix lfo + input envelope.

  Control smoothness of the input envelope by the attack knob and control
  sensitivity of envelope to input signal by the sens sliders. Choose between
  low pass (lp), band pass (bp) and wah filters. The wah filter parameters were
  adapted to fit the vox v847 wah pedal.

  Control filter resonance by the res knob and control lower and upper filter
  cutoffs by cutoff 1 and cutoff 2 knobs. Swap the wah filter peaks shapes by
  the swap button on the filter response plot from the right side.

  Control dry/wet ratio by the mix knob. Autotremwah is a virtual effect audio
  plugin for macos and windows. It functions as an audio units plugin and a VST
  3 plugin.
specs: |-
  - 3 types of filter
  - 3 types of filter envelope regime
  - Input signal sensitivity control
  - LFO parameters
  - Low pass (LP) filter
  - Band pass (BP) filter
  - Wah filter
  - Resonance control
  - Filter cutoff control
  - Dry/wet ratio control
  - Attack knob
  - Envelope smoothness control
  - Input envelope sensitivity sliders
  - Wah filter peak shape swap
  - macOS support
  - Windows support
