details: |-
  Azure is a faithful emulation of a passive hand-made equalizer characterized
  by tube make-up stages and the finest transformers - ideal for mastering. The
  transparency and three dimensional quality of the original hardware is
  unmatched in the industry.

  The latest version of azure upgrades the plug-in to core12 and brings the
  benefits of our super transient technology to it. In addition, in the latest
  update there are both the normal and hd versions included. The hd version is
  intended for mastering and provides even closer to the hardware sound.

  The plugin captures even the smallest of the sonic details and behavior of the
  original unit. While having the tone and the sound purity of passive designs,
  azure has precise sound-shaping capabilities with a q control available for
  all bands. Both stereo and mid-side operational modes are available.

  Azure also truthfully reproduces the dynamic "transformer sound" of the
  original design as well as the characteristics of zino's signal path. One
  thing that makes azure different from the hardware is the summing topology of
  the bands. Azure reacts more like a conventional equalizer where all bands are
  in series, always giving you the exact level of boost or cut dialed.

  Supported plug-in formats: vst2, AAX, and AU. Supported architectures: 32 and
  64-bits. Support operation systems: macos and windows. Challenge-response
  authorization system allowing activation for two computers per license. The
  trial version is fully functional for a duration of four weeks.
