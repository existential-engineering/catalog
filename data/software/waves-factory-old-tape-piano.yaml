description: Old Tape Piano features a grand piano recorded into a very lo-fi cassette recorder. It's full of wow, flutter, saturation and other tape characteristics.
details: |-
  Make no mistake, this isn't some un-tuned relic of a piano. Wavesfactory took a great sounding, tuned piano, not some old piano like the one that sits unloved in your grandparent's house, and recorded it using a lo-fi cassette recorder. Making just another piano instrument plug-in is pointless unless you do it differently.

  88 keys, 8 velocity layers, no loops and no pitch shifting, all notes sampled. Background noise control with volume and color, tape speed and tune, with transport controls. Very simple but effective GUI for a simple but effective instrument. It was recorded into real cassette tape using a very bad cassette recorder, so it sounds like the home demos recorded in the 80s.

  From the main view you can see an animated representation of a cassette tape. It includes knobs for tape speed and tune, and volume and color of the background noise. On the bottom half sit the transport controls that trigger the noise and animation, along with the real mechanical noises of the unit: play, stop, rewind, fast-forward and pause.

  In the effects page you can add any effect you want in any order, including EQ, compressors, modulation effects, distortion, saturation, tape machine, reverbs, amp simulators and more. This script boosts the sonic capabilities of the library exponentially, in a simple and intuitive design.

  From the settings page you can control basically any parameter that you might ever need, including round robin, dynamic range, velocity curve and envelope with attack and release controls.
specs: |-
  - Grand piano recorded into a lo-fi cassette recorder
  - 88 keys, all notes sampled, no loops and no pitch shifting
  - 8 velocity layers
  - 3x round robin
  - 710 samples
  - 609 MB
  - Background noise control with volume and color
  - Tape speed and tune controls
  - Transport controls with real mechanical recorder noises (play, stop, rewind, fast-forward, pause)
  - Effects page with EQ, compressors, modulation, distortion, saturation, tape machine, reverbs and amp simulators
  - Settings page with round robin, dynamic range, velocity curve and attack/release envelope
  - Works with Kontakt 5.7.3 and newer versions
  - Full version of Kontakt required (Kontakt Player runs in demo mode)
