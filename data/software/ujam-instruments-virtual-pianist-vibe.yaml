description: VIBE is an electric piano model based on recordings of a hand-picked 1972 vintage instrument, with a built-in player for creating grooves and phrases without piano skills.
details: |-
  The electric piano, royalty amongst keyboard instruments, wears the crown of cool. Often described as warm and mellow, with a smooth and vibrant tone, its unique character has been used by artists from all genres, from jazz, funk, and soul, to hip-hop, rock, and even EDM. VIBE is UJAM's take on this iconic instrument, a smart way to produce realistic performances and create grooves and phrases with zero piano skills required.

  VIBE is first and foremost a perfectly produced electric piano with pristine full-bodied sound and lots of dynamics. It is based on a legendary instrument from the 1960s whose brand name has become synonymous with this type of sound, and its warm, mellow character has been immortalized by jazz, funk, and soul musicians.

  VIBE is a professional session player well-versed in a range of musical styles. This virtual musician can contribute rhythmic tracks as part of a band, accompaniments for singers and instrumentalists, or simple but appealing solo passages and instrumental playbacks. Pick from 40 styles, trigger the phrases and adjust to fit: adjustable player key range, busyness control and variations create live, every-time-different performances.

  Character modes switch between aesthetics for any occasion, with warm and mellow settings for jazz, funk and soul, and brighter bell-like attack or barkier settings for hip-hop, rock and EDM. Setting the key of your song lets Player mode play more varied and custom-tailored phrases and harmonies.
specs: |-
  - Electric piano model based on recordings of a hand-picked 1972 vintage instrument
  - 40 player styles with adjustable key range, busyness control and variations
  - 45 Finisher multi-effect modes and 45 Ambience FX presets custom-tailored for VIBE
  - More than 150 presets
  - MIDI drag and drop (use the player with other instruments)
  - Player mode and Instrument mode
  - Supported standards: MIDI
  - Operating systems: Windows 10 to Windows 11, macOS Big Sur (11) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 1.4 GB of disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery: automated installation via the UJAM App, which also installs the Virtual Pianist plug-in host
  - Authorization via the UJAM App
  - All MIDI phrases and included sounds are royalty-free
