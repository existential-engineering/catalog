description: A vintage spring reverb plugin with six classic spring tanks. Drip, twang and dub splash for guitars, vocals and synths.
details: |-
  The RO-SPR is a vintage spring reverb that captures the one thing plates and digital halls can't fake: the bouncy, ringy, low-end-heavy character of a real metal spring tank. Where a plate reverb glues and smooths, a spring reverb has attitude, that instantly recognisable boing when you knock the amp, the mechanical splash, the resonant low mids engineers used to shove under guitars and vocals on purpose. Black Rooster physically modelled six different tanks, their springs, transducers and resonant behaviour, and deliver them through efficient real-time convolution, so you get four decades of that sound in one plugin instead of one static spring.

  Laurens Hammond filed the first spring-reverb patent back in 1939, a transducer at one end of a coiled spring, a pickup at the other. The idea landed in Hammond organs from around 1960 and standalone units like the Accusonics Type 4 SR, but it was Leo Fender who made it famous by dropping a spring tank into the 1963 Vibroverb. Springs were cheaper and lighter than plates that could weigh 600 pounds, so they spread everywhere.

  The RO-SPR ships six faithfully modelled spring types: a late-1970s British stereo unit (A), a 1960s classic dub tube spring (B), a 1970s home hi-fi spring (C), a medium 1980s Japanese echo unit (D), a 1960s Austrian large oil-bath spring (E) and an American guitar-amp large spring (F). Spring Length steps through seven positions that reshape the tank's ring from tight to atmospheric, while Decay stretches the perceived room size from short to long. Because springs are naturally low-mid heavy, a 3-band EQ (Low at 200Hz, Mid at 400Hz, High at 900Hz) and a Bass Cut high-pass (10Hz to 1kHz) let you keep the character but pull the mud. Pre-Delay places the tail up to 500ms behind the dry, a Dry Mute switch turns the whole thing into a clean send effect, and per-channel Input/Output gain staging lets you balance the natural stereo spread of multiple springs.

  On electric guitar, spring type F with a longer Decay is pure amp-in-a-room drip, surf, garage, psych. On vocals, a shorter spring and a little Bass Cut adds vintage character without drowning the words in low-mid ring. Feed it synths and the Mono2Stereo mode routes a mono source through two non-identical springs, returning a genuinely wide, slightly detuned stereo image.
