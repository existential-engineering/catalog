details: |-
  Beeper is an auxiliary audio processing plug-in which you can use to insert
  short beep, noise burst, or silence signals to any sound material. This
  plug-in may help you protect your work from an unauthorized use.

  It is safe to apply this plug-in to any mission-critical material because the
  plug-in does not perform any processing over the audio between the inserted
  signals.

  You can specify signal's duration, beep frequency, signal's loudness, period
  between signals, and the amount of random variation of all parameters.

  With this plugin you can add short chunks of beeps (either of the same tone or
  various through the variation parameter), white noise or muted breaks to your
  audio.
specs: |-
  - macOS support
  - Windows support
  - Beep signal insertion
  - Noise burst insertion
  - Silence signal insertion
  - Signal duration control
  - Beep frequency control
  - Signal loudness control
  - Period between signals control
  - Random variation parameter
  - Gain parameter
  - Variation parameter
