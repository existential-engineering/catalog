description: The Best Modulation Sounds of 6 Decades. The PhaserChorusFlanger suite brings 5 high-end plugins for modulation effects into your DAW.
details: |-
  The PhaserChorusFlanger suite brings 5 high-end plugins for modulation effects into your DAW: the best phaser, chorus and flanger sounds of 6 decades, with new and intuitive controls for an optimal workflow. The plugins are usable individually or inside HOFA SYSTEM.

  Phaser: since the 1950's, this FX has added characteristic frequency cancellations due to phase shifts. There are 5 phaser algorithms to choose from, that each have their own unique character.

  Chorus: this plugin gives you warm and dense chorus sounds at the touch of a button, with 3 different algorithms that can be combined in any way. FlangerClassic covers the whole range of auto flangers, from subtle modulation to classic jet-flanging.

  FlangerTape recreates a complex effect that was produced by two tape machines, where one was slowed down by hand and then sped up again. This effect is now available as a plugin and is very easy to use.

  MultiMod is the ultimate chorus/flanger with 8 voices. Ten parameters per voice and the groundbreaking LFO View give you full control over the sound, and the included presets cover highly musical chorus and flanger sounds.

  All plugins from the HOFA SYSTEM series are also available as freeware with a slightly limited feature set, installed via the HOFA-Plugins Manager. The full version comes with two licenses, managed through the HOFA Plugins Manager, where they can also be deactivated and transferred to other computers. Offline activation is possible.
specs: |-
  - 5 modulation plugins: Phaser, Chorus, FlangerClassic, FlangerTape, MultiMod
  - Phaser with 5 algorithms (TOS, TNG, DS9, 7o9, Odo)
  - Phaser: 6 modulation waveforms, invert mode, rate 0.01 to 4 Hz with rate sync, depth 0 to 100, feedback -100 to +100, tune 0.01 to 20 Hz
  - Chorus: 3 freely combinable algorithms, stereo width adjustable 0 to 100%, authentic vintage sound
  - FlangerClassic: mod delay 0 to 10 ms, depth 0 to 100%, 6 modulation waveforms, cross function for bleeding, feedback -100 to +100%, rate 0.01 to 4 Hz with rate sync
  - FlangerTape: slider for manual tape flanging, 4 curve types for attack and release, adjustable transition time with sync, vintage mode, X2 mode for extra strong flanging
  - MultiMod: 8 modulation voices, mod delay 0 to 99 ms, depth 0 to 100, 7 modulation waveforms, rate 0.01 to 10 Hz with rate sync, feedback -100 to +100, low-pass filter 300 Hz to 20 kHz, panorama -100 to +100
  - Formats: VST3, AU, AAX
  - Operating system: macOS 10.13 or later, Windows 10 or later
  - Continuously tested on Ableton Live, Apple Logic, Avid Pro Tools, Bitwig, Cockos Reaper, Image Line FL Studio, Magix Samplitude/Sequoia, Fender Studio Pro, Steinberg Cubase/Nuendo/Wavelab
  - Two licenses included, managed via the HOFA Plugins Manager, offline activation supported
  - 14 days free trial; freeware version with slightly reduced feature set also available
