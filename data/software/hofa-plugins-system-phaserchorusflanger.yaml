description: The Best Modulation Sounds of 6 Decades
details: |-
  The PhaserChorusFlanger suite brings 5 high-end plugins for modulation effects into your DAW. The best phaser, chorus and flanger sounds of 6 decades New and intuitive controls for an optimal workflow Usable as single plugins or in HOFA SYSTEM Also available in a freeware version with slightly reduced feature set Phaser Since the 1950’s, this FX has added characteristic frequency cancellations due to phase shifts. There are 5 phaser algorithms to choose from, that each have their own unique character! Chorus This plugin gives you warm and dense chorus sounds at the touch of a button: 3 different algorithms can be combined in any way – the fastest way to your dream chorus sound. FlangerClassic … covers the whole range of auto flangers. From subtle modulation to classic jet-flanging – let’s get funky! FlangerTape This complex effect was produced by two tape machines. One was slowed down by hand and then sped up again. This effect is now available as a plugin – and it’s very easy to use! MultiMod … is the ultimate chorus/flanger with 8 voices that really leaves nothing to be desired! Ten parameters per voice and the groundbreaking LFO View give you full control over the sound. The included presets cover highly musical chorus and flanger sounds that you’ve never heard before. https://www.youtube.com/watch?v=W-Vx323a6ns Freeware version All plugins from the HOFA SYSTEM series are also available as freeware with a slightly limited feature set. Simply install HOFA SYSTEM using the HOFA-Plugins Manager . You can then use all freeware features immediately. Here is an overview that shows the differences between the SYSTEM PhaserChorusFlanger freeware and the full version: Phaser Feature Available in the freeware Available in the full version Phaser algorithms TOS TOS, TNG, DS9, 7o9, Odo 6 different modulation waveforms ⬤ ⬤ Invert mode ⬤ Rate fixed at 0.22 Hz adjustable from 0.01 to 4 Hz Rate sync ⬤ Depth fixed at 90 adjustable from 0 to 100 Feedback fixed at 20 adjustable fro
