details: |-
  Blent 10 ambient fluctuations is the final installment in the blent series and
  offers users the most unique engine of the series. With blent 10, you have the
  power to displace the played note in time, creating unpredictable ambient
  soundscapes and evolving pads. The motion page allows you to set rules for how
  the notes linger and dance in the time dimension, adding a whole new level of
  depth to your compositions.

  Blent includes four sound layers, each with its own dedicated page packed with
  essential controls to shape your sound. The layer page works seamlessly with
  the blender engine, allowing you to set minimum and maximum values for volume,
  pan, pitch, and filter. These settings are used by the blender engine to
  expertly mold the sound curves for an evolving sound experience. Want to
  fine-tune your sound even further? Blent provides low-pass and high-pass
  filters for that perfect finishing touch.

  The layers blending page is the heart of the blent series. It allows users
  creating dynamic and evolving sounds. With four layers coming together and
  blending, users can activate the mod-wheel to transition between different
  sounds seamlessly. The volume, panning, pitch, and filters can all be
  customized with user-defined curves, giving endless possibilities for unique
  sound design.

  The global page offers master controls for delay and convolution reverb, with
  plenty reverb and sound design impulse responses which will complement,
  enhance or even radically alter the sound. It also includes controls to shift
  the octave of each layer so the instruments will have their proper place
  within the ensemble.

  The sample pool has been meticulously divided into 8 sound categories:
  cinematic noises, woodwinds effects, bowed effects, chilling scapes,
  guitar/bass chaos, vocal experiments, tonal scapes, and atonal scapes. With
  just the touch of a button, blent instruments create a whole new patch,
  allowing musicians and producers to easily and effortlessly explore endless
  sonic possibilities through an intelligent randomisation system.
