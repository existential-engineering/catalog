name: AudioGridder
manufacturer: andreas-pohl
primaryCategory: plugin
description: AudioGridder is a network bridge for audio and MIDI, that allows
  you to offload the dsp processing of audio plugins to remote computers.
details: |-
  AudioGridder is a network bridge for audio and MIDI, that allows you to
  offload the dsp processing of audio plugins to remote computers running os x
  or Windows. This can come in handy when mixing complex projects or running CPU
  intensive instruments for instance.

  Audiogridder comes with a plugin and a server and can host vst2, vst3 and
  audiounit plugin formats. Plugins can be accessed across the network: simply
  run the audiogridder server on a remote machine and connect your DAW using the
  audiogridder plugin. This allows you to add remote insert chains or
  instruments into your DAW's signal paths.

  The dsp code of the loaded remote plugins will be executed on the remote
  machine and the remote plugin ui's will be streamed over the wire. With
  audiogridder you get an experience very close to hosting the plugins directly
  in your DAW but not using your local cpu.

  The server supports audiounit (macos only) and vst2/vst3 plugins. The plugin
  is available as audiounit (macos only) and vst2/vst3/AAX.
specs: |-
  - VST2 plugin hosting
  - VST3 plugin hosting
  - Audiounit plugin hosting (macOS only)
  - Ag plugin available as VST2
  - Ag plugin available as VST3
  - Ag plugin available as AAX
  - Ag plugin available as audiounit (macOS only)
  - Effect plugins
  - Instrument plugins
  - Latency compensation
  - Sandboxing (chains or single plugins)
  - 32/64-bit float processing
  - Audio over network
  - MIDI over network
  - Streaming of plugin uis
  - Local control of remote plugin uis
  - Unlimited remote effect plugin chains
  - Generic plugin parameter editor
  - Automation
  - Plugin search
  - macOS 10.7+ (intel/apple) server support
  - Windows 7+ server support
  - Linux 64-bit server support (experimental)
  - macOS 10.7+ (intel/apple) plugin support
  - Windows 7+ plugin support
