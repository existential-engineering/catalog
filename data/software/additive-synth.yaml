details: >-
  Additive synth by causal agency is a virtual instrument audio plugin for
  windows. It functions as a VST plugin.


  Additive synthesis with 32 sine wave oscillators.


  4 effects (flanger, reverb, phaser, and delay), assignable per oscillator.


  Drawable envelopes for all oscillators (volume, phase and detune).
