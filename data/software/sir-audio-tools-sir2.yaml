description: SIR2 is an easy-to-use native audio plugin for high-quality
  reverberation using non-destructive audio processing of impulse responses,
  featuring zero-latency processing and low CPU consumption.
details: |-
  SIR2 is a convolution reverb plugin that processes impulse responses to deliver high-quality reverberation in a native audio plugin environment. It supports 64-bit Intel architectures on both Windows and macOS, and is not officially compatible with Apple Silicon Macs.

  The plugin offers zero-latency processing with low CPU usage even at small buffer sizes. It includes a linear phase FFT-EQ, pre-delay up to 2000ms, stretch control with high-quality resampling, and forward/reverse switching of impulse responses.

  SIR2 supports loading impulse response files in WAV, AIF, FLAC, BWS, and OGG formats. It features an impulse file browser with picture association, beat-scale mode, amplitude and filter envelopes, and comprehensive preset management.

  The plugin ships with a selection of High Definition Impulse Responses from Pinguin Hamburg, covering Church, Recording Studio, Jazz Chamber, and Theatre acoustic spaces.

  SIR2 has been discontinued and replaced by SIR3. Existing SIR2 license holders can upgrade to SIR3 at a discounted price.
specs: |-
  - Zero-latency convolution processing
  - True stereo convolution
  - Linear phase FFT-EQ
  - Pre-delay: 0–2000ms
  - Stretch control with high-quality resampling
  - Forward/reverse impulse response switching
  - Supported IR formats: WAV, AIF, FLAC, BWS, OGG
  - 64-bit Intel architecture (Windows and Mac)
  - Windows 7 or newer (VST), Mac OS 10.7 or newer (VST/AudioUnit)
  - Key-based licensing, no dongle required
  - Included HDIRs: Church, Recording Studio, Jazz Chamber, Theatre
