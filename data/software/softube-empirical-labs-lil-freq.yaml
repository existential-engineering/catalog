description: A unique EQ plugin, a one-of-a-kind de-ess, and so much more.
  Empirical Labs Lil FrEQ is an equalizer plugin with tone-shaping, correction
  power and superior sound quality. An EQ and de-ess that is odd in the best
  way.
details: |-
  The warm and punchy analog sound of the Empirical Labs Lil FrEQ makes it something of an oddity in the world of equalizers. But it's no sideshow. With its heart-shaped box of tricks, mighty analog tone, and de-essing chops, it is hard to think of a more powerful analog EQ. It's what makes Lil FrEQ the ace in the hole for so many high-profile recording engineers and mixing professionals.

  When your equalizer features eight different processing sections, you can ditch the multi-plug-in setup and get on with it. Softube's native software version, expertly modeled under the watchful eye of Dave Derr himself, gives you all that tone-shaping and correction power, plus supernatural sound quality, and flavor galore. In a word, it's un-freakin-believable.

  This product supports Extended Features. VU meters, Bakelite knobs, and analog quirks are lovable, but modern precision and workflow still matter. The answer? Softube Extended Features. Easy-access panels with the innovations you need close at hand.

  Console 1 Ready: this plug-in can be used within Console 1, Softube's mixing system.

  A potent sound shaping tool with eight processing sections to achieve the sounds you want faster. A flawless recreation of the Lil FrEQ hardware unit, featuring de-essing, developed in conjunction with Dave Derr and Empirical Labs Inc. Also available as a part of Flow Mixing Suite and Flow Complete Suite.
specs: |-
  - An expertly modeled recreation of the ELI Lil FrEQ hardware
  - Available for the first time as a native plugin
  - Developed in collaboration with Dave Derr and Empirical Labs Inc.
  - Eight process sections with bypass switches to A/B the effect of each section
  - 4-band fully parametric EQ with sweep-able frequency and bandwidth (Q)
  - De-ess (Level independent dynamic EQ) / HF Limit (High Frequency Limiter)
  - Extremely powerful and punchy
  - Featuring the legendary ELI sound
  - Supports Softube Extended Features
  - Console 1 Ready
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Softube account required
  - iLok account (no physical iLok required)
  - Computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Internet access (for downloading installers and managing licenses)
  - Three activations
