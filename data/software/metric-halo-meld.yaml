description: MELD is a multi-channel EQ, level and dynamics plug-in that
  provides a comprehensive signal chain for ATMOS and stereo mix processing. It
  combines a 12-band parametric EQ with analyzer, a compressor, a limiter, a
  loudness and clipping processor and the MixHead tape saturation processor
  across any number of instances.
details: |-
  MELD provides a comprehensive signal chain for ATMOS and stereo mix processing: a 12-band fully parametric EQ with analyzer, a compressor, a limiter, a loudness and clipping processor, and the MixHead tape saturation processor. All of the process blocks are dynamically reorderable and groupable across any number of instances. It was developed in collaboration with mixing engineer John Hanes of MixStar Studios, whose immersive workflows it models.

  It addresses the problem of building a cohesive music mix in ATMOS. In ATMOS immersive mixes, channels are mixed to beds and objects. A bed is a multichannel bus or stem and may be processed much as a stereo bus is, as long as multichannel capable tools are available. Objects, which are required for immersive overhead panning, are panned by the renderer and must therefore be delivered discretely, so the bus they conceptually form is virtual and there is no place to apply the bus processing that is key to building proper pop and rock mixes.

  When MELD is inserted into a session, every instance is aware of all the other instances. Any channel can be accessed directly from within the MELD interface, including solo, mute, metering and grouping, with no need to navigate the mix from the host DAW.

  MELD has 26 virtual buses, or groups, and any instance can be added to a group. All instances in a group share the same processor settings, which applies the same processing to many channels as bussing them together would, while each channel remains available discretely to be sent to objects or processed further. The detector sidechain for the compressor and limiter can also be managed per group, keying channels within a group or from any other channel or bus carrying a MELD instance without complex routing in the host, and the default shared-sidechain routing achieves bus compression for channels routed to objects.

  Because the channels that form the bus are still available discretely after processing, levels and EQ can be adjusted post bus compression, whether the channels are sent to objects or simply submixed back to a stereo bus or a multichannel bed. Instances support mono through 9.1.6 channel formats, with LUFS and True Peak metering per channel.
specs: |-
  - 12-band fully parametric EQ with analyzer
  - Compressor
  - Limiter
  - MixHead tape processing
  - Loudness clip processing
  - Instantaneous process block reordering
  - User-selectable over-sampling (up to 16x)
  - Process-overview UI
  - 26 virtual buses/groups
  - Integrated solo and mute
  - Instance table with project overview and metering
  - LUFS and True Peak metering per channel
  - Reference LUFS and True Peak metering readouts for selected channels
  - Support for mono to 9.1.6 channel instances
  - Shared sidechains between instances to support keying and virtual bus compression and limiting
  - Many presets included
  - Adjustable UI size
  - MH Preset Manager provides cross-platform presets
  - macOS 10.10 or newer, Intel processor or Apple Silicon, 64 bit
  - Windows 7 or newer, Intel processor, 64 bit
