details: >-
  4g simply stands for 'four generators'. This multi synth contains a sampler,
  wavetable synth, pure synthesis, fm synth and 4g actually fuses multiple
  sounds into one unified sound, creating new, original sounds that have never
  been heard before.


  4g is a unique and inspiring tool that provokes fun, inspiration and
  originality.


  Over 150 inspiring presets. Merge and fuse any sound into something new. Full
  sampler. Drag any audio into the sampler. 4 oscillators. Wavetable synth. Fm
  synth. Full suite of effects. Tape emulation. Pitch wobble.
