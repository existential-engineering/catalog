description: Gong Amp takes an exciting experimental amplifier from the
  beginnings of electronic music to the plugin world of today.
details: |-
  In 1932, Maurice Martenot was looking for a way to make his groundbreaking proto-synthesizer "Ondes" audible beyond what could be archived with the horns and loudspeakers of the time. He developed a set of "diffuseurs", of which the "Metallique" was one. Instead of a paper cone or horn, Martenot put a gong behind the amplifier circuitry. This seemingly simple idea resulted in resonances and brilliant overtones that excite audiences to this day.

  In 2011, the French company Eowave took inspiration from Martenot's invention and made their own version, the Resonator Metallik. When AudioThing heard what their friend, Berlin composer Hainbach, did with this rare amplifier, it was clear this sound needed to be available to more than a select few. So AudioThing made Gong Amp, their third collaboration with Hainbach since Motors and Wires. Using a complex mixture of convolution processing, physical modeling, and feedback systems, they created an instrument that is true to the responsiveness of the original and even transcends it in terms of sound design possibilities.

  The Mixer offers three recording positions: mono mic, stereo mics, and a unique "resonator" effect Hainbach designed. Mono gives a documentary perspective, stereo a ribbon mic width, and resonator mode feeds reverb into reverb. Input overdrive adds overtones and the soft clip provides output distortion.

  Thick and thin chains can be added to the gong for sympathetic rattling that ranges from a soft shimmer to clangorous noise, and a pillow dampens the long ring so fast passages stay defined. Performance controls cover two gain settings via Dynamic, pre- and post-gong modulation for liveliness and stereo width, a Howl control for overload, and extreme pitch manipulation for cinematic effects.

  Trip Mode adds automated crossfading between the three signal positions of mono, stereo and resonate, with a spread control for the rhythmic shift, from gentle drifts lasting minutes to fast rotary effects. Gong Amp is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP), and on the App Store for iOS and iPadOS as an AUv3 plugin and Standalone.
