details: >-
  Arido is an additive synthesizer with a simple fm feature and a subtractive
  filter. It includes a polyphonic driver to generate variety of timbres. That
  is, a distorter that works on each note separately.


  Arido brings on-panel help, MIDI learn and pedal switch functions. This synth
  allows make sounds such as ambient, bass, pads, organs, distorted, nature,
  emulations, etc.
specs: |-
  - 2 additive oscillators
  - Simple fm feature: oscillator modulated by oscillator 2
  - 1 noise generator with density control
  - 1 polyphonic driver that distorts each voice separately
  - 1 filter with selectable band
  - 1 lfo that can sync with tempo
  - 3 envelope generators that can be modulated by the lfo
  - 1 envelope generator to modulate the lfo itself
  - Small effect box with parameters to make effects from scratch
  - Routing feature
  - Help on panel
  - MIDI learn
  - Pedal switch functions
  - VST plugin
  - Windows compatible
