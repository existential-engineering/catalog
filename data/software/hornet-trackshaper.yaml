description: The HoRNet TrackShaper is a VST plugin that lets you quickly shape the sound of your tracks acting like an auto mix plugin
details: |-
  TrackShaper is a mix-on-autopilot utility designed for producers who want good-sounding tracks without spending hours tweaking individual settings. It automatically adjusts the essential parameters that make a track sound polished, leaving the user free to focus on the music.

  The plugin is built on the technology of HoRNet ChannelStrip MK2, which brings its EQ and compression algorithms into a simpler interface. Sound source-specific algorithms cover kick drum, snare, acoustic instruments, guitars and more, each tailored to optimise its source: the kick algorithm focuses on enhancing low frequencies while the snare algorithm adjusts the mids to bring out snap and presence.

  The effect amount knob is the heart of the plugin, adjusting both the EQ and compression characteristics of the selected algorithm with a single control. The algorithms are dynamic rather than static, so the effect responds in real time to the incoming audio signal and adjusts as the track evolves.

  Because the processing is dynamic, input and output levels matter. Input and output gain knobs are provided along with a level indicator, and a green dot lights up when both signals sit in the optimal range.

  An auto gain adjust feature sets the correct input and output gain automatically from the level of the incoming signal, which helps when source material has inconsistent levels or when several sources need different gain adjustments.
specs: |-
  - 14 different sound source algorithms
  - Adjustable effect amount
  - Adjustable input and output gain
  - Automatic input and output gain adjustment
  - Input and output level meters
  - Apple Silicon native support (except for AAX)
  - macOS (10.11 and later) and Windows (Vista and later) support
  - 64-bit only on both Mac and Windows
  - Audio Units, VST2.4, VST3 and AAX format
  - No copy protection
