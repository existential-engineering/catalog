description: The HoRNet TrackShaper is a VST plugin that lets you quickly shape the sound of your tracks acting like an auto mix plugin
details: |-
  The HoRNet TrackShaper is a plugin designed for those who want to achieve great-sounding tracks without spending countless hours tweaking individual settings. It takes the guesswork out of the process, automatically adjusting the essential parameters to make tracks sound polished, so the user can focus on creativity rather than technical details.

  TrackShaper is built on the technology of the HoRNet ChannelStrip MK2, which brings its EQ and compression algorithms into a simpler interface. It integrates algorithms that cater to a variety of different sound sources, including kick drum, snare, acoustic instruments and guitars, with tailored processing for each source.

  Each algorithm dynamically acts on different EQ and compression parameters, so the plugin adjusts the sound in a way that complements the characteristics of the instrument or sound source. The kick drum algorithm focuses on enhancing low frequencies, while the snare algorithm adjusts the mids to bring out the snap and presence of the snare hit.

  The "effect amount" knob is at the heart of the plugin, adjusting both the EQ and compression characteristics of the selected algorithm from subtle to aggressive with a single control. The effect is not static: it responds in real time to the incoming audio signal, adjusting parameters as the track evolves.

  Because the processing is dynamic, input and output levels matter. The plugin provides input and output gain knobs plus level indicators, and a green dot lights up when both signals sit in the optimal range. An "auto gain" adjust feature sets the correct input and output gain automatically based on the level of the incoming signal.
specs: |-
  - 14 different sound source algorithms
  - Adjustable effect amount
  - Adjustable input and output gain
  - Automatic input and output gain adjustment
  - Input and output level meters
  - Apple Silicon native support (except for AAX)
  - macOS 10.11 and later, Windows Vista and later
  - 64-bit only on both Mac and Windows
  - Audio Units, VST 2.4, VST3 and AAX formats
  - No copy protection
