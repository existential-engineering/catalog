details: >-
  Acoustic dhol 2 is the new sample based acoustic indian dhol instrument. It
  has been sampled from real indian metal, wood and fiber dhol instruments.
  Sampled with condenser mic with various positions. It is velocity sensitive
  instrument with built in round robin ai triggered samples.


  It comes with win 64-bit vst3, AU and mac vst3 plugins. Acoustic dhol 2 comes
  with free player, however you will require to purchase the factory expansion
  to up and run the full instrument.


  Hq instrument presets with low end sub & 808 generator osc, dhol generator,
  filter and reverb. Now just play real dhol instrument right inside your host
  DAW.


  Lite version a.k.a free player comes with one dhol kit. New .rdg file format
  for expansions (easy update to full expansion). Over 15 articulations. Sampled
  from real dhol instrument. New low sub osc. New 808 osc. Tuning. New low pass
  and high pass filters. Velocity sensitive. Ar with volume & pan control.
  Algorithmic reverb. Level meter. All major daws supported(that support vst3,
  AU, mac vst3).
