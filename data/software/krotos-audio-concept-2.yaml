description: "Simply powerful, yet powerfully simple synthesizer with intuitive
  sound design, granular engine capabilities, and drag-and-drop modulation
  routing."
details: |-
  Presets from artists including Roni Size, Richard Devine, and Kayla Painter. Multiple sound sources with granular engine capabilities. Drag-and-drop modulation routing with color-coded visual feedback. Three effects slots with convolution reverb, delay, and compressors. Filter stacking with multiple modulation sources. X/Y automation modes. 2 activations included. No iLok required. Note: not natively compatible with Apple Silicon (requires Rosetta 2). 10-day free trial available.
specs: |-
  Mac: Intel 2.4 GHz dual-core, 4 GB RAM, macOS 10.13+, Monterey supported (Rosetta 2 required for Apple Silicon). Windows: 2.4 GHz Intel dual-core, 4 GB RAM, Windows 10 1909+. 64-bit only. Audio input not supported on FL Studio or Studio One. Supported DAWs: Pro Tools 11+, Logic Pro X, Nuendo 8.2.10+, Cubase 10+, Reaper, Ableton Live 10+, FL Studio 20.7.1+, Reason 10+, Studio One.
