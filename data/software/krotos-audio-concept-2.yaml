description: Concept 2 is everything you want in a modern synth plugin, beautiful sounds without the complexity of operation found in many other synths. A simply powerful, yet powerfully simple synth for musicians, producers, composers and sound designers.
details: |-
  Concept 2 was designed for musicians, producers, composers, sound designers and post-production professionals who want to create sounds fast. The aim is to give access to a rich sound design palette without having to spend time learning how to use it, so you can get lost in the music, not the manual.

  Preset Heaven ships with presets from top artists including Roni Size (Reprazent, Universal), Richard Devine (Google, Warp Records), Kayla Painter (Brownswood Recordings), Dom Ruckspin (Submotion Orchestra, Ninja Tune, EMI), Hieroglyphic Being (Mathematics Records), Alex Retsis (Native Instruments, Pro Sound Effects, Glitchmachines), Jim Stout (Roland, Carma Studio, Beatport Sounds) and Alessandro Mastroianni (Sonora Cinematic). The library covers cinematic lush pads, organic soundscapes, stirring strings, bass synths and leads.

  Presets are just the start. Concept 2 gives access to almost limitless routing parameters to shape the sound: use multiple sound sources, or load your own samples into the granular engine and combine them with conventional oscillators.

  Routing and controlling modulation is as easy as dragging and dropping the connections, and colour coding means modulation sources can be read at a glance. There is also an X/Y automation mode.

  With three effects slots and multiple effects, including convolution reverb, delay and compressors, further dimension can be added to a sound. Filters can be stacked so multiple filters apply to the sound with multiple modulation sources. A fully functional 10-day free trial is available, and the product does not require iLok.
specs: |-
  - Mac: Intel computer with a minimum 2.4 GHz Intel Dual Core processor, 4 GB RAM, OS X 10.13 or later (Monterey supported)
  - Not natively compatible with Apple Silicon (Rosetta 2 required)
  - Windows: 2.4 GHz Intel Dual Core processor, 4 GB RAM, Windows 10 1909 and newer
  - Formats (64-bit only): VST, VST3, AU, AAX Native
  - Does not require iLok
  - Comes with 2 activations
  - Digital download, internet connection required at the time of activation
  - Supported hosts: Ableton Live 10 and above, FL Studio 20.7.1 and above, Reason 10 and above, Pro Tools 11 and above, Logic Pro X, Nuendo 8.2.10 or above, Cubase 10 and above, Reaper, Studio One
  - Audio Input is not supported on FL Studio or Studio One
