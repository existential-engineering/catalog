description: "Arp-edge is a vsti synth plug-in featuring 36 multi-sampled analog
  and digital keyboards, including: nord lead, casio cz & vl-tone, sci."
details: >-
  Arp-edge is a vsti synth plug-in featuring 36 multi-sampled analog and digital
  keyboards, including: nord lead, casio cz & vl-tone, sci 6tracks, sid, an1x,
  voyager and mc505.


  A wide range of arpeggio patches have been selected, taking advantage of the
  glide/portamento feature on overlapping notes.


  Each preset includes 24 multi-samples with sampling quality available in 16
  and 32 bits.
specs: |-
  - 36 multi-sampled analog and digital keyboards
  - 36 presets
  - 24 multi-samples per preset
  - 16 and 32 bit sampling quality
  - Optimized volume/key tracking
  - Glide/portamento
  - Cpu usage < 1%
  - VST automation
  - VST plugin
  - Windows compatible
