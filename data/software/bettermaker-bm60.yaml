details: |-
  The Bettermaker BM60 is a digital reverb plugin inspired by iconic 80s hardware reverb units. It offers two core reverb modes — room and plate — along with a convolution reverb module that includes a library of captured acoustic spaces.

  The BM60 features dynamic room simulation for organic, responsive spatial character and a variable density plate reverb that delivers classic studio-style reverb tones. Its algorithm is rooted in the sound of vintage 80s digital reverb hardware.

  Key adjustable parameters include Time, Length, Contour, Bass, Treble, Predelay, Monofier, Width, and Ducker, giving engineers fine-grained control over the reverb character and mix integration.

  The plugin is designed for ultra-low CPU usage, making it practical for dense multi-track sessions. It supports Intel and Apple Silicon Macs on macOS 11–14 and Windows 10–11 (x64).
