details: |-
  You're looking for gargantuan drums that are still punchy and precise in your
  mix? With definition in the front and depth in the back? Then you've come to
  the right session. Klangmacht - german for 'the power of sound' true to our
  name, we create larger-than-life instruments. We capture the momentum of
  spirit, sound and craftsmanship with striking precision and a good scoop of
  dirt so that you can unleash it in your own creative outburst.

  Spirit: bastian emig-drummer of van canto and studio and live musician for
  countless productions from punkrock to metal is one of the most energetic and
  musical drummers of our time. His dynamic style and great joy of playing
  inspire bands and audiences alike. He set up the drums and played all samples
  in different velocities and articulations. With him on drums, every beat is a
  statement.

  Sound: tama's starclassic bubinga - these drums are slamming! The starclassic
  bubinga offers an extra low-end fullness with a lot of presence and a biting
  attack to power your next killer track. With its tremendous punch and rich
  tonality, it is a very musical kit that can be used in many different styles.
  With a wide range of the finest cymbals from the meinl mb20 series, this set
  leaves nothing to be desired.

  Craftmanship: charlie bauerfeind - all klangmacht drum plugins are
  meticulously crafted by legendary producer charlie bauerfeind. Charlie is a
  powerhouse in metal production, renowned for his impeccable ear and dynamic
  approach. Each microphone was carefully pre-routed to stems, premixed, and
  preprocessed by charlie, ensuring that every hit, crash, and thump you trigger
  is full of character and production-ready, sent with love right into your
  studio, waiting to be shaped into your next masterpiece.

  What you get: 2x 24" kick drums. 5 toms. Tama s.l.p. Brass snare. Joyful noise
  brass snare. Enormous meinl mb20 cymbal set. Both: digital & analog samples
  (paul wolff fix console & mtr 90 otari 2" tape machine). Special articulations
  for an organic playing impression at the highest level.
specs: |-
  - Kontakt player
  - Digital samples
  - Analog samples
  - Stem-based samples
  - Bleed control
  - Overhead signals
  - Multiple velocities
  - Special articulations
