details: |-
  This percussion module offers a collection of pristine sounds in the
  categories of timpani, mallets, and bells & gongs, derived from the synchron
  series libraries synchron percussion I and synchron percussion ii.

  All instruments were recorded "in situ" on their perfect spot in the large
  hall of synchron stage vienna with an expansive, phase-controlled
  multi-microphone set-up, including close and mid mics, decca tree (left -
  center - right), as well as surround and high surround outriggers.

  Bbo: phoenix includes single hits of the following instruments: timpani,
  played with soft mallets; glockenspiel, played with plastic mallets;
  xylophone, played with wood mallets; vibraphone, played with soft mallets;
  tubular bells, played with medium mallets; plate bells; burma gongs. In
  addition to single hits, timpani feature rolls and octave hits. The vibraphone
  comes with motor-on and motor-off variations.

  Getting the right sound out-of-the-box is a breeze, given the host of presets
  that not only match the sound of all the other libraries in the big bang
  orchestra series, but also stand on their own in all kinds of arrangements and
  styles. By expertly combining the available microphone signals with the
  internal effects of the synchron player you get presets such as close,
  classical, wide, comp+reverb, far away echoes, power timps and many more.

  Microphone setup includes: main (decca tree stereo), main (decca tree center),
  main surround stereo, high stereo, high surround stereo, mid microphones, and
  close microphones.
