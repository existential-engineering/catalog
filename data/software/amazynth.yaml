details: |-
  Thenatan and global audio tools are bringing music makers across the globe a
  jam packed tool we like to call "Amazynth". Inspired by some music legends
  such as johnny juliano, cardo got wings, zaytoven beats and many more
  producers that have shaped today's urban music scene.

  With sounds ranging from banging 808 and heavy bass, plucks, pads, keys,
  synths, choirs, woodwinds and more this VST is one for every urban producer to
  add to their plugin arsenal.

  Sound library includes: 20 808s, 19 ambient sounds, 16 bass, 23 bells, 5
  choirs, 20 keys, 13 misc, 11 organs, 19 pads, 13 plucks, 11 reversed, 20
  strings, 20 synth leads, 10 textures, 10 woodwinds.

  Compatible with ableton, cubase, reaper, fl studio, reason, sonar, logic, pro
  tools and other daws. An AAX/rtas to VST converter is required for non VST
  daws.

  Zipped file size: 7 gb; unzipped file size: +17 gb.
