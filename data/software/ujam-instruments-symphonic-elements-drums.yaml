description: Experience the raw power of a world-class cinematic drum ensemble at your fingertips. Featuring Hans Zimmer's iconic recordings.
details: |-
  Experience the raw power of a world-class cinematic drum ensemble at your fingertips. Featuring Hans Zimmer's iconic recordings, DRUMS delivers bold rhythms, thunderous hits, and moody textures with unrivaled simplicity.

  Separate your drums into Low Drums (bass, timpani) and High Drums (snares, toms) for precise control. A Crossfade slider balances these layers, and individual effects like Character and Motion FX add depth and personality to the sound.

  Choose from 60 rhythmic styles packed with professionally arranged patterns and phrases. The intelligent engine transforms even the simplest notes into rich, evolving performances with no programming needed, from subtle grooves to explosive cinematic hits, all locked in time and musically on point.

  The built-in Finisher and Ambience effects go beyond traditional percussion. With over 200 presets, orchestral drums become shimmering textures, distorted impacts, or abstract cinematic layers.
specs: |-
  - Dedicated performance engine by UJAM
  - 60 playing styles and over 300 custom-designed phrases
  - Separate Low Drums and High Drums sections with Crossfade, Character and Motion FX
  - Over 200 Finisher presets plus Ambience effects
  - Created at Hans Zimmer's Remote Control Studios, arranged by Boris Salchow
  - Supported standards: NKS
  - Operating systems: Windows 10 to Windows 11, macOS Mojave (10.14) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 4 GB of RAM
  - 4.7 GB of disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery: automated installation via the UJAM App, or downloadable installer file
  - Authorization via the UJAM App, or email and password within the plug-in
  - All MIDI phrases and included sounds are royalty-free
