details: |-
  Al d2 2.0 by audiolounge soft is a virtual instrument audio plugin for macos and windows. It functions as a VST plugin, an audio units plugin and a VST 3 plugin.

  This product creates sound inspired by roger linn's past products. New high end quality sounds.

  Tune function for each instrument. Playable via MIDI keyboard or MIDI controller.

  Multi outputs can be selected. Mixer integrated: pan and volume. Master reverb and master tune adjustable.

  Dynamic range adjust. Os x and windows 32/64-bit. Audiolounge bring back the 80s.
