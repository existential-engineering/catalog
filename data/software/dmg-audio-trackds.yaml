description: TrackDS is an invisible de-esser featuring intelligent automatic sibilance detection for one-click operation. It uses psychoacoustically optimized processing with dual-release Peak/RMS detection and zero-latency minimum phase design.
details: |-
  An invisible De-Esser that does exactly what it says it will. Add to that intelligent detection of sibilance, and it's one-click to use.

  Designing Essence was an interesting learning process, about how De-Essing should be done right. Whilst Essence is a massive sub-band mastering unit, DMGAudio wanted something with the same power that worked with one click, so TrackDS was designed for very low latency, very low CPU usage, and a handful of controls you shouldn't have to adjust, but just in case you want to.

  The intelligent noise-detector makes De-Essing trivial to achieve rather than an arduous process. It also tames overhead takes, automatically removes breaths, and includes an exciter to brighten dull takes, while preserving the DSP that makes Essence a finely regarded De-Esser.
specs: |-
  - Psychoacoustically optimised to surgically and invisibly control sibilance
  - Quick, simple, ergonomic interface
  - Dual-release Peak/RMS-based time detector for invisible operation
  - Two-band sidechain EQ, and variable crossover control
  - Zero-latency minimum phase, with Linkwitz-Riley crossovers
  - Upward expansion option
  - Complete set of Listen options for monitoring, including signal difference (output-input)
  - Automatic detection of sibilance/fricatives in solo voice
  - Mac Retina support
  - Autolisten for configuring filters
