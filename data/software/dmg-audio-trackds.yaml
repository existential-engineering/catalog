description: "TrackDS is an invisible de-esser featuring intelligent automatic
  sibilance detection for one-click operation. It uses psychoacoustically
  optimized processing with dual-release Peak/RMS detection and zero-latency
  minimum phase design."
details: |-
  Psychoacoustically optimized sibilance control with dual-release Peak/RMS-based detection. Features two-band sidechain EQ with variable crossover, zero-latency minimum phase processing, upward expansion option, automatic sibilance/fricative detection, and listen modes including signal difference monitoring. Uses Linkwitz-Riley crossovers with adjustable threshold, ratio, and gain-reduction ceiling. Freely resizable UI with HiDPI/Retina display support. Windows: VST/VST3 32+64bit, AAX 32+64bit, RTAS 32bit (Vista, 7, 8, 10). Mac: VST/VST3/AU 32+64bit, AAX 64bit only, RTAS 32bit (OS 10.7+, Intel and Apple Silicon).
