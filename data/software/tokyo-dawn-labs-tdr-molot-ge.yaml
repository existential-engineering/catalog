description: "A dynamic range compressor combining classic compression
  mechanisms with sophisticated saturation, creative tone control, and a snappy
  peak limiter. Supports mellow leveling, tight dynamic control, and aggressive
  compression."
details: |-
  Version 1.0.7. Analog style brickwall limiter. Sophisticated saturation section. Creative tone control section. Dual-stage timing section with auto-release control. Feedforward and feedback compression types. Crossover-based adjustable stereo link. Detailed coloration features including negative ratios, sidechain phase rotation, and bit-crushing. Multiple quality modes including zero-latency operation. M/S mode with dedicated width controls. Equal loudness workflow functions.
specs: |-
  Windows 7 or above (32-bit and 64-bit). Mac OS X 10.9 or above (32-bit and 64-bit). VST2, VST3, Audio-Unit, or AAX compatible plugin host. OpenGL support required.
