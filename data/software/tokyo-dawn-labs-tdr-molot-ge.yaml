description: Characterful dynamic range compression with sophisticated saturation, creative tone control, and a snappy peak limiter.
details: |-
  Russian for “Hammer”, Molot is the name of a popular dynamic compressor originally released in 2011 by Vladislav Goncharov. With a modernized concept, extended flexibility, and a generous dose of Rock 'n Roll, Molot GE proudly takes over the job of its predecessor.

  Molot GE is a particularly characterful dynamic range compressor melding several classic compression mechanisms with sophisticated saturation, creative tone control, and a snappy peak limiter. Whether it be mellow leveling, tight dynamic control, or aggressively vibrant compression, Molot GE covers a remarkable wide range of compression colors. While Molot GE doesn't emulate any “vintage” device, its sound and behavior was definitely inspired by their most interesting musical peculiarities. This flexibility makes it suited for almost any source, be it drums asking for more crisp and impact, solidification and enrichment of vocals, or the enhancement of guitar and bass recordings of all types.

  As with all TDR plugins, Molot GE employs state of the art audio processing technology keeping unwanted distortion under strict control. An intuitive and well documented user interface offers quick access to all relevant parameters in a rewarding manner. Several helpers such as the equal loudness bypass and trimming, unlimited undo/redo, optional stepped controls, and many more features help the operator achieve consistent results within a short time.
specs: |-
  - Musically intriguing compression flavours
  - Analog style brickwall limiter
  - Sophisticated saturation section
  - Creative tone control section
  - Dual-stage timing section offering control over auto-release behaviour
  - Feedforward and feedback compression types
  - Crossover based adjustable stereo link
  - Detailed colouration features such as negative ratios, sidechain phase rotation, and bit-crushing
  - Different quality modes including zero-latency operation
  - M/S mode with dedicated width controls
  - Equal loudness workflow, with equal loudness bypass and equal loudness trim
  - VST2, VST3, Audio Unit or AAX compatible plugin host. Windows 7 or above, Mac OS X 10.9 or above. OpenGL support required. Windows 32-bit: VST2, VST3. Windows 64-bit: VST2, VST3, AAX. Mac 64-bit: VST2, VST3, AU, AAX.
