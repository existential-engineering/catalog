description: >-
  Entry-level edition of Melodyne for basic pitch and timing correction of
  monophonic audio, with macro tools and chord track support.
details: |-
  Melodyne 5 Essential provides an accessible entry point into
  note-based audio editing. It offers all algorithms except DNA for
  editing monophonic material like vocals and solo instruments.

  The Main Tool allows intuitive pitch, timing, and duration
  adjustments. Macros for pitch correction, quantization, and
  leveling speed up common editing tasks.

  Chord Track and chord recognition enable musical context-aware
  editing. Audio-to-MIDI export lets you convert audio performances
  to MIDI data. Available as a plug-in via ARA, VST3, AU, and AAX,
  or as a standalone application.
specs: |-
  - All algorithms except DNA for monophonic editing
  - Main Tool for pitch, timing, and duration
  - Pitch correction, quantize, and leveling macros
  - Chord Track with chord recognition
  - ARA integration for supported DAWs
  - Audio-to-MIDI export
  - 64-bit only
  - Intel/AMD Dual Core minimum, Quad Core recommended
  - 4 GB RAM minimum, 8 GB recommended
  - macOS 10.12 or higher with Apple Silicon support
  - Windows 10 or higher
