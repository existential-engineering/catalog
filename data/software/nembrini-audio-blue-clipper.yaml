details: |-
  Converter-style clipping and saturation for louder, denser, more controlled mixes.

  Blue Clipper is modeled on the Lavry Blue 4496*, capturing the character of its saturation and clipping behavior in a simple, modern plug-in format.

  It is designed to add density, control peaks, and increase perceived loudness while keeping the sound focused, musical, and mix-ready.

  Analog Saturation gently softens transient peaks before they hit the clipper, adding density and level control while keeping the sound natural and musical. Perfect for drums, bass, vocals, buses, and full mixes when you want extra loudness without obvious distortion.

  Digital Saturation drives the signal into a stronger saturation curve, adding harmonic color, firmness, and perceived loudness. Use it when you want drums to hit harder, bass to feel thicker, synths and guitars to cut through, or a mix to sound more pushed and energetic.

  *Legal Disclaimer: Lavry, Lavry Blue, and any related product names, logos, or trademarks are the property of their respective owners. Blue Clipper is an independent Nembrini Audio product and is not affiliated with, endorsed, sponsored, or licensed by Lavry Engineering or any related company. Any reference to the Lavry Blue 4496 is used only to describe the sonic inspiration and reference hardware used in the development of the plug-in.
specs: |-
