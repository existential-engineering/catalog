description: FabFilter Timeless 3 is a vintage sounding tape delay plug-in with
  many modulation options. Available in VST, VST3, AU, CLAP, AAX and AudioSuite
  formats for Windows and macOS.
details: |-
  FabFilter Timeless 3 is a versatile, vintage-sounding tape delay, which will fully satisfy your everyday delay needs. And with its unique effects, filters, tap patterns and unlimited modulation options, you can just as easily turn it into the ultimate sound-mangling machine.

  The stereo delay signal is routed through five unique effects and up to six analog-sounding filters, and then routed back to the input with adjustable feedback. Optional Drive, Lo-Fi, Diffuse, Dynamics and Pitch effects give you creative control over the delayed signal.

  Easily set up ducking, wow and flutter, dynamic diffusion or more creative effects, using Timeless's unique and versatile modulation system. With 16-step XLFOs, XY controllers, envelope generators, envelope followers, and MIDI sources, plus a 50-slot modulation matrix, the possibilities are endless.

  Timeless 3 features a fully redesigned, highly simplified interface with improved sound quality of overall feedback, filters, and internal saturation. Create rhythmic patterns using up to 16 delay taps with ping-pong modes, and use the modulatable freeze option for ambient textures.
specs: |-
  - Analog tape delay or smooth time-stretching behavior
  - Optional Drive, Lo-Fi, Diffuse, Dynamics and Pitch effects
  - Up to 6 filters (vintage LP/HP/BP or Bell/Shelving/Notch EQ)
  - Create rhythmic patterns using up to 16 delay taps
  - Ping-pong modes
  - Live modulation visualization
  - Feedback and cross-feedback, modulatable freeze option
  - Interactive delay and filter displays
  - 16-step XLFOs, XY controllers, envelope generators, envelope followers, MIDI sources
  - Easy drag-and-drop modulation with 50-slot modulation matrix
  - Mid/side processing
  - GPU-powered graphics acceleration
  - MIDI Learn
  - Undo, redo and A/B switch features
  - Sample-accurate automation of all parameters
