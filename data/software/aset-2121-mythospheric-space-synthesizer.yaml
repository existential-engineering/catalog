details: |-
  ASET-2121 - MythoSpheric Space Synthesizer is designed to provide a wide
  variety of pads, textures, soundscapes & atmospherics with low CPU usage.

  It is available in two versions - a free 2 voice polyphonic version and a eu20
  8 voice polyphonic version.

  Features: two analog style oscillators featuring sine, triangle, saw, ramp and
  square(pulse) waves. Two digital pcm-wave oscillators powered by 66 different
  waveforms. Two filters (24db lowpass and 12 db low/high pass blendable between
  modes). Three adsr-style envelope generators. Two lfos with three amounts
  routed to nine different destinations (bpm-syncable). One sample & hold with
  three amounts routed to nine different destinations (bpm-syncable). One vlfo
  (for very low frequency modulations and bpm-syncable). One specially modulated
  chorus for the digital oscillators. One synced cross-stereo-delay (with
  feedback modulated by vlfo, lfo1, s&h or manually).
specs: |-
  - Two analog style oscillators with sine, triangle, saw, ramp and square
  (pulse) waves
  - Two digital PCM-wave oscillators with 66 different waveforms
  - Two filters (24db lowpass and 12 dB low/high pass blendable between modes)
  - Three ADSR-style envelope generators
  - Two LFOs with three amounts routed to nine different destinations
  (bpm-syncable)
  - One sample & hold with three amounts routed to nine different destinations
  (bpm-syncable)
  - One vlfo (for very low frequency modulations and bpm-syncable)
  - One specially modulated chorus for the digital oscillators
  - One synced cross-stereo-delay (with feedback modulated by vlfo, lfo1, s&h or
  manually)
  - Windows compatible
  - 2 voice polyphonic version (free)
  - 8 voice polyphonic version (eu20)
  - Low CPU usage
  - 128 patches (free version)
