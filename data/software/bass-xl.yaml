description: Lazer sharp tool for creating a Massive and controlled low end for
  your tracks in seconds. Compression and EQ, eat your heart out.
details: |-
  Lazer sharp tool for creating a massive and controlled low end for your tracks
  in seconds. The bass xl adds weight, and also works great on melodic content.
  Enhance a bass or electric guitar, a kick drum, sub bass, percussion track or
  a whole drum sub mix.

  The plugin features the following highlights: tone dial for full control over
  the character and color of your boost. Ability to solo the added bass for
  reference or apply additional effects like saturation or distortion. Volume
  independent drive for a consistent sound in dynamic tracks. Different filter
  slopes for a defined sound. Low cpu usage. No need for dongles or complex
  licence managers.

  What's great about the bass xl is how fast and precisely you can work with it.
  Choose which frequency to boost, apply the boost with the mix control and then
  choose a filter slope to set the width of the boost. Steep slopes make the
  boost sound more resonant and precise, while gentle slopes make the boost
  sound more gradual and warm.

  Saturate and colour the sound with the drive and tone control. For an extra
  tight or loose sound, use the 'position' to move the bass boost backwards and
  forwards in time.
specs: |-
  - Tone dial
  - Solo function
  - Volume independent drive
  - Different filter slopes
  - Low CPU usage
  - No dongle required
  - Position control
  - Mix control
  - Drive control
  - Saturation
  - Distortion support
