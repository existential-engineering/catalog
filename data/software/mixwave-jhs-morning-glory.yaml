details: |-
  A precise digital recreation of JHS's most celebrated overdrive, the Morning Glory delivers transparent, amp-like breakup with clarity and touch sensitivity. Known for its ability to enhance without overpowering, this versatile overdrive preserves the natural dynamics of your playing while adding warmth and character. Utilizing component-level modeling, every nuance of the original circuit has been captured, from its dynamic response to its ability to stack beautifully with other effects. Introducing, MixWave: JHS Morning Glory .
