name: Art Pyrite
manufacturer: artvera
primaryCategory: synthesizer
description: Art Pyrite is a powerful atmospheric software synthesizer. It
  creates unique and variable atmospheres, soundscapes, pads, textures, ambient,
  sound effects & rhythmic and melodic sequences.
details: |-
  Art Pyrite is a powerful atmospheric software synthesizer. It creates unique
  and variable atmospheres, soundscapes, pads, textures, ambient, sound effects
  & rhythmic and melodic sequences.

  Three full preset banks sorted to sound categories: atmosphere - pad,
  atmosphere - ambient - fx, atmosphere - melody - rhythm. Most of presets have
  the setting to synchronisation of host tempo. These were made at default tempo
  120 bpm. Additional presets made by daniel kemp.

  The separated sf2 file for the possibility to use it also in another software
  applications with sf2 support. Size of "rar" archive is 147 mb - 218 mb
  uncompressed.

  A free version is also available. It has these limitations: 30 pcm waveforms,
  32 presets, no load sf2 and no random parameters.

  Two pairs of oscillators are fed thru a lowpass and a combined
  bandpass/highpass filter, each with their own envelope. The first two
  oscillators feature conventional analogue-style waveforms, the other two a
  selection of high-quality samples. What makes this synth so versatile are its
  extensive modulation capabilities with two conventional lfos, one sample &
  hold and one special slow lfo, each with its own matrix of preset modulation
  targets, and on top of that a 16 step sequencer.
specs: |-
  - Two analog-style oscillators featuring 22 waveforms
  - Two digital-PCM oscillators powered by 256 different waveforms in two
  internal source banks
  - Two filters - 24db lowpass and 12db low/highpass selectable
  - Two amplitude ADSR-style envelope generators
  - Two filter ADSR-style envelope generators
  - 16-step polyphonic sequencer with random button of volume level (bpm
  syncable or manually)
  - Two LFO with three amounts routed to nine different destinations (bpm
  syncable or manually)
  - Sample & hold with three amounts routed to nine different destinations (bpm
  syncable or manually)
  - Vlfo for very low frequency modulations (bpm syncable or manually)
  - Specially modulated droning chorus for the digital-PCM oscillators (9 modes)
  - Synced cross-stereo-delay with feedback modulated by vlfo, lfo1, s&h or
  manually
  - Reverb unit
  - Random button to randomize different sets of waveforms and most parameters
  - Load external sf2 files into digital-PCM oscillators
  - MIDI learn/cc edit for most control elements
  - Inbuilt MIDI cc/value displays and bank/preset manager
  - 12 voices polyphony
  - Low CPU usage
  - Straightforward and readable ui - all control elements are on a single
  screen
  - Suitable for monitors with higher resolutions
  - Windows compatible
