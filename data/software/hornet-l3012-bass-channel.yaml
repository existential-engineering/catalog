description: HoRNet L3012 is a bass channel strip plugin that provides everything you need to make your bass sound great.
details: |-
  HoRNet L3012 is an advanced channel strip plugin designed specifically for bass players, providing all the essential tools required to enhance and shape your bass sound with ease. Developed in close collaboration with the talented Italian bassist Lusi, this plugin is tailored to meet the needs of bass players in both studio and live settings. Whether you’re mixing a recording or performing live, the HoRNet L3012 ensures that your bass tone is always dialed in to perfection.

  At the core of the HoRNet L3012 is an analog tube preamp section, which is the foundation for the plugin’s rich and dynamic sound. This section is designed to provide warmth, depth, and character to your bass signal. The preamp can be overdriven to add a certain grit and harmonic distortion, perfect for bass players who want to add some edge to their tone, whether in a subtle or more aggressive manner.

  The preamp section can be easily adjusted to suit different playing styles, ranging from smooth and clean to punchy and saturated. This versatility ensures that the HoRNet L3012 can handle a wide range of musical genres, from jazz to rock, funk, and metal, offering a powerful tonal palette for any bass player.

  Following the analog tube preamp, the HoRNet L3012 features a smooth bass boost circuit, specifically designed to enhance the low-end frequencies of your bass sound. This circuit provides the extra weight and punch that is often needed to cut through a mix while maintaining a natural and musical feel. By focusing on the low-end, it ensures that your bass retains its fullness and richness without becoming muddy or overbearing.
specs: |-
  - Input pad and phase reversal
  - Tube preamp overdrive with dry / wet control
  - Bass boost
  - Transient designer
  - Adjustable high pass and low pass filter
  - Three band equalizer with one fully parametric band
  - Compressor that uses the VCA160 model from Multicomp Plus MK2
  - Analog emulation with intelligent oversampling (up to 4x)
  - Hardware accelerated GUI
  - Apple Silicon native support (except for AAX)
  - macOS (10.11 and later) and Windows (7 and later) support.
  - 64-bit only for macOS and Windows.
  - Audio Units, VST, VST3 and AAX format.
