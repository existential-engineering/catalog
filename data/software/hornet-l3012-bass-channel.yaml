description: HoRNet L3012 is a bass channel strip plugin that provides everything you need to make your bass sound great.
details: |-
  HoRNet L3012 is an advanced channel strip plugin designed specifically for bass players, providing all the essential tools required to enhance and shape your bass sound with ease. Developed in close collaboration with the Italian bassist Lusi, this plugin is tailored to meet the needs of bass players in both studio and live settings.

  At the core of the plugin is an analog tube preamp section, designed to provide warmth, depth and character to the bass signal. The preamp can be overdriven to add grit and harmonic distortion, and adjusts to suit different playing styles, ranging from smooth and clean to punchy and saturated. Following the preamp, a smooth bass boost circuit enhances the low-end frequencies, adding weight and punch that cut through a mix while keeping the sound from becoming muddy.

  A built-in transient shaper enhances the attack and clarity of the bass sound, letting you emphasize a percussive, punchy attack or soften the transients for a smoother, more rounded tone. The equalization section adds a high-pass filter, a low-pass filter, a low shelf, a high shelf and a fully parametric mid band, so the midrange resonance can be sculpted to remove unwanted honkiness or boxiness.

  The final stage is a compressor modeled after a renowned VCA compressor frequently used for bass processing, using the VCA160 model from Multicomp Plus MK2. It smooths out dynamic spikes while maintaining the punch and power of the bass, adapting to fingerstyle, slap bass or pick playing without sounding squashed.

  Intelligent oversampling adjusts the oversampling rate based on the DAW settings: 4x at 44.1kHz and 48kHz, automatically switching to 2x at higher sample rates. The fully vector-based GUI is hardware-accelerated so it runs smoothly at any screen resolution, and the plugin ships with two custom presets created by Lusi that showcase two of the most popular bass models.
specs: |-
  - Input pad and phase reversal
  - Tube preamp overdrive with dry / wet control
  - Bass boost
  - Transient designer
  - Adjustable high pass and low pass filter
  - Three band equalizer with one fully parametric band
  - Compressor that uses the VCA160 model from Multicomp Plus MK2
  - Analog emulation with intelligent oversampling (up to 4x)
  - Hardware accelerated GUI
  - Apple Silicon native support (except for AAX)
  - macOS (10.11 and later) and Windows (7 and later) support
  - 64-bit only for macOS and Windows
  - Audio Units, VST, VST3 and AAX format
  - No copy protection
