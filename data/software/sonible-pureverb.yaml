description: The AI powered reverb plugin creates reverb effects for any input
  signal and offers a straightforward control set for sound shaping.
details: |-
  pure:verb creates reverb effects that are an impeccable fit for any input signal, and offers a straightforward yet powerful control set for sound-shaping.

  pure:verb is equipped with a unique learning feature and input-specific profiles which ensure that every reverb computed by the plug-in matches the spectral and temporal characteristics of the input signal. Instead of standard presets, a profile is selected and the plug-in automatically takes care of boomy low-ends, muddy mids and harsh high-ends, so the technically tricky parts of working on reverb effects do not have to be fought through by hand.

  The plug-in is aimed at staying in a creative flow while adding space and depth in post-production. Whether the goal is a mix with a warm and personal touch starring soft vocals and solo instruments, or an immersive and dense reverb effect for orchestral sounds and synth pads, controlling the size of the virtual reverb space is enough to highlight a given vibe.

  Powerful fine-tuning options cover more extraordinary sounds. Increasing the Synthetic value transforms a natural-sounding environment reverb into one that is out of this world, and three reverb modes (Infinite, Reverse and Bounce) extend the creative range further.
specs: |-
  - Automatic parametrization for high-quality results
  - Intelligent processing and input-specific profiles
  - Synthetic control, reverb size parameter and 3 reverb modes (Infinite, Reverse, Bounce)
  - Plug-in formats (Mac): VST, VST3, AU, AAX
  - Plug-in formats (Windows): VST, VST3, AAX
  - Supported channel formats: mono, stereo
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok
  - Apple Silicon support: native
  - Windows 10 (64 bit) or OSX 10.9 and later
  - CPU: Intel Core (i5) or Apple Silicon
  - GPU: OpenGL version 3.2 or later
  - 30-day trial available
