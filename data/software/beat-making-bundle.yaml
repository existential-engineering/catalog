description: Accusonus' Beat Making Bundle offers producers a unique, intuitive
  beat-making workflow.
details: |-
  Drop a loop into regroover and convert it into multi-track. Isolate, remove or
  manipulate its individual elements and completely re-arrange your beat.
  Extract stems from your audio loops and enable new beat-making workflows. Use
  regroover's artificial-intelligence engine and get previously-unreachable
  sounds from inside your audio samples. Craft the isolated beat elements to
  create your personal drum kits. Instantly remix your loops and create your own
  loop variations.

  Rhythmiq allows you to instantly jam with your beats. Get unlimited beat
  variations with the turn of a single knob. Generate and save new rhythmiq
  patterns and instantly create fills and build-ups. Enable your a.I. Beat
  assistant and let rhythmiq perform your beats in real-time like when you are
  jamming with a human band-mate.

  Add colour and polish the sound of your beats using beatformer's simple and
  intuitive interface. Effortlessly shape the sound of your beats with 4
  intuitive controls: boom, punch, squash and air. Blend analog-style processing
  with modern digital technology. Transparently fine tune or fully transform
  your beats with the turn of a simple dial.
