description: Addictive Keys brings the world's most inspiring keyboard
  instruments into the studios of songwriters, producers, and music makers with
  outstanding sound quality and fast load times.
details: >-
  Addictive Keys brings the world's most inspiring and interesting keyboard
  instruments into the studios of songwriters, producers, and music makers. Its
  unique sonic capabilities, smart workflow, fast load-times, and outstanding
  sound quality are designed to help you stay in the creative flow and to
  compose great music while you're in the zone.


  Addictive Keys ships with tons of inspiring presets neatly arranged in
  ExploreMaps. Each preset even comes with previews that present the preset in
  the perfect light. If you're in a hurry, you can use presets as-is so you
  don't lose inspiration. If you're in the mood to design new sounds, the
  powerful sound engine gives you great control over each instrument. You can
  even mix and match microphone setups!


  The product line includes four distinct keyboard instruments: Studio Grand (a
  grand piano), Modern Upright (an upright piano), Electric Grand (a vintage
  CP-80 electric grand piano), and Mark One (warm and intimate electric piano
  tones).


  Bundle options include the Complete Collection (all 4 pianos), Duo Bundle
  (pick any 2), and Trio Bundle (pick any 3), offering savings for producers who
  want multiple instruments.
specs: >-
  - macOS 10.13 or later (64-bit)

  - Windows 10, 11 (64-bit)

  - Internet connection required during installation

  - VST, VST3, AU, AAX plugin formats (64-bit)

  - Standalone application (Windows and macOS)

  - ExploreMaps preset organization system

  - Customizable microphone setups

  - Built-in preset previews

  - 4 keyboard instruments: Studio Grand, Modern Upright, Electric Grand, Mark
  One
