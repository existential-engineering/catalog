description: Vintage preamp plugin inspired by the Neve 1073. Add transformer weight, THD and sheen to vocals, guitars and drums.
details: |-
  Inspired by the Neve 1073, the transformer-driven console preamp behind more hit records than anyone has bothered to count, VPRE-73 distills that hardware down to gain, iron and its signature high shelf. It makes a signal sound like it went through something: input and output transformers, a discrete Class-A amplifier, and the pleasant, level-dependent distortion engineers spent decades learning to lean into. Pushing the Gain makes the iron sing, adding weight to a flat DI or a lifeless vocal.

  The original 1073 was a mic-pre and EQ module from a 1970s Neve console. Black Rooster Audio modelled its behaviour with real-time, SPICE-style circuit simulation: the input and output audio transformers, the discrete preamp circuit and the famous HF shelving band are all reproduced as a living circuit, so harmonics shift with level the way the hardware's do. One deliberate change from the original: where the hardware's Gain is stepped in fixed increments, VPRE-73 makes it continuous, letting the THD be dialed in gradually.

  Gain runs from +18 to +78dB and drives the preamp circuit, where the harmonic saturation lives. Holding the right mouse button on the Gain knob makes Trim follow in the opposite direction, so THD can be added without the track jumping in level. Trim itself spans -30 to +30dB and stays perfectly linear, acting as a clean make-up stage. The HF shelf (roughly ±15dB) is the recognisable 1073 top end, and an 80Hz, 12dB/Oct highpass on the HP button clears rumble and pops before the preamp sees them.

  On vocals, a touch of Gain and a small HF shelf boost pulls the singer forward with a recorded-to-a-console sheen. On electric guitars and bass DI, driving it harder adds grit and thickness. On drums, it can be printed on room mics or the whole kit for glue and low-end punch, and it also works across a full mix or master bus for cohesion.
