details: |-
  Fat, tube-driven, passive equalizers can be so much more than functional tools. They impart character and style to any source; drums, synths, vocals, guitars, strings, brass, you name it. As such, they have been sought after in top-of-the-line international studios for decades, and their sound enriches the textures of thousands of classic records, in every genre you can imagine.

  Now combined into a single plug-in, which not only improves the workflow but allows for a revitalized approach to the sonics using Softube's latest digital signal processing technology, the Tube-Tech Equalizers Mk II are a huge step forward for an already phenomenal pair of processors.

  As long ago as 2006, Softube formed a partnership with Tube-Tech of Lydkraft, Denmark, and began work on what would become the definitive plug-in representations of Tube-Tech's best and most highly-prized analog hardware units. In 2018 Softube released the updated Mk II versions; a total ground-up remodel of the CL 1B compressor, and a single combined EQ plug-in, taking advantage of its latest signal processing technology. Stunning high-resolution graphics and additional features were also added to make the best even better.

  Try, for example, the famous 'Pultec' low-end trick. Because the filters for the low frequency boost and attenuate functions are slightly offset in frequency (despite being controlled by the same frequency knob) it is possible to create attractive and well-focused bumps or cuts in the low end by boosting and attenuating simultaneously. Give a kick drum more body, for example, by boosting heavily at 60 CPS and then attenuating to deal with the muddiness. The bump will remain, but you will have cleaned up too.

  The ME 1B was designed to accompany the PE 1C equalizer, and provide control over the frequencies that the PE 1C cannot adjust. On its own it is a great tool to shape the midrange of any audio material, and together with the PE 1C it becomes a versatile and full-featured equalizer. Its interface has three sections, the Low Frequency Peak, Mid Frequency Dip and the High Frequency Peak, where the mid section always attenuates the selected frequency while the low and high sections always boost.
specs: |-
  - Two classics, PE 1C and ME 1B, combined in one musical, versatile and full-featured equalizer
  - A 'Pultec'-style low and high end equalizer
  - Mid-range equalizer with the same passive, tube-driven design
  - Combined into one plug-in for better workflow and sound than ever
  - Console 1 Ready: works as a native plug-in and in Softube Console 1, Softube's mixing ecosystem
  - Created in partnership with and endorsed by Tube-Tech
  - Improved sound, updated using Softube's latest signal processing technology
  - Spectacular new high-resolution graphics
  - Still the same epic audio processors they always were
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26; Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Three activations, 20-day trial, 14-day returns
