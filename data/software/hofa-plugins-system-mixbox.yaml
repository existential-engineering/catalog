description: Combinable plugins for your mix. High quality tools for mixing and
  mastering, with 21 high-end plugins including a highly flexible channelstrip
  with dynamics, EQ, FX and many more.
details: |-
  SYSTEM MixBox is the core collection of the HOFA SYSTEM range: 21 high-end plugins that cover mixing and mastering duties and can be freely combined with one another. It offers a highly flexible channelstrip including dynamics, EQ and FX, plus multiband, mid/side, parallel and dual mono routing options. Every plugin can be used on its own in the DAW or inside the HOFA SYSTEM host, and all SYSTEM plugins offer up to 32x oversampling.

  The dynamics section covers three distinct compressors and two gain-control tools. CompChan sounds like the characteristic channel compressor of the most successful analog mixing boards, delivering punch on drums and making bass and other instruments sound vibrant and controlled. CompSum is a specialist for sums and buses equipped with numerous automatic control functions, which also excels on vocals and solo instruments. CompListenMic is an emulation of the talkback compressor of a famous British mixing console, often used in the 1980s to enhance the room sound of drum recordings. Alongside these sit an upward Expander with adjustable ratio and a standard Gate with hold function for drum processing.

  EQ-Parametric features 11 identically equipped filter bands ranging from 13 to 20,000 Hz, plus a high-precision analyser. Each band can be set to high and lowcut (6, 12, 24 or 48 dB/oct), bandpass with adjustable Q factor, bell (Q 0.1 to 36), high and low shelves, vintage high and low shelves, or GainMode. Filter bands are added by clicking the plus button, so the plugin window is exactly as big as needed, and clicking the frequency curve opens a large curve editor with analyser for precise optical feedback.

  The remaining DAW plugins handle time, pitch, level and measurement. Delay offers delay times of up to 4095 ms with host tempo sync and selectable note values including triplets and dotted notes. Distortion generates harmonics and overtones that pair with #Multiband and EQ-Parametric. PitchMicro shifts pitch by up to 100 cent and PitchMacro by up to 12 semitones. Gain adjusts level from -60 to +20 dB with phase reverse and a DualGain function for the left and right channel separately, Pan adds adjustable stereo width and a DualPanning mode, Meter provides peak hold and intersample peak metering, and PinkNoise is a noise generator for measurement and effect applications.

  A further group of plugins is available only inside HOFA SYSTEM, because they are designed for routing and signal flow within the host rather than as DAW plugins. #SubChain adjusts the DRY/WET ratio of several plugins at once, #Feedback returns part of the signal to the input for complex feedback effects, #DualMono and #Mid/Side process the two channels or the mid and side channels separately, #Multiband chains processors across freely adjustable crossover frequencies and slopes (6, 12 or 24 dB/oct), and #Parallel allows unlimited parallel processing. Parameter Modulations adds sine, square, sawtooth, triangle and random oscillators for modulating any control, and Notepad stores notes with presets. All SYSTEM plugins are also available as freeware with a slightly reduced feature set, with the routing modules, CompListenMic, Distortion, PitchMicro, Gain, Meter, PinkNoise and Notepad unrestricted in the free version.
