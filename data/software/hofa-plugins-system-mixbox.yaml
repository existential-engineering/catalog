  - 21 plugins included: CompChan, CompSum, CompListenMic, EQ-Parametric, Delay, Distortion, PitchMicro, PitchMacro, Expander, Gate, Gain, Pan, Meter, PinkNoise, #SubChain, #Feedback, #DualMono, #Mid/Side, #Multiband, #Parallel, Parameter Modulations
  - EQ: 11 filter bands with visual curve editor and analyzer
  - Compressors: three types emulating analog mixing console stages
