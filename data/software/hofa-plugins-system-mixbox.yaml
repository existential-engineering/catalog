description: SYSTEM MixBox is a flexible channel strip bundling 21 high-end mixing and mastering plugins including dynamics, EQ and FX, with multiband, mid/side, parallel and dual-mono routing options. The plugins can be used individually or combined within HOFA SYSTEM, and a freeware version with a reduced feature set is also available.
details: |-
  HOFA SYSTEM MixBox is a comprehensive collection of 21 high-end audio plugins for mixing and mastering. The plugins can be used individually as standard DAW inserts or combined within the HOFA SYSTEM host environment, which adds powerful routing options including multiband, mid/side, parallel, and dual mono processing.

  The collection includes three compressors (CompChan, CompSum, CompListenMic) emulating different analog mixing console stages, an 11-band parametric EQ with a visual curve editor and real-time analyzer, a tempo-syncable delay (up to 4095 ms), distortion, micro and macro pitch shifters, an expander, gate, gain, pan, meter, and a pink noise generator.

  The SYSTEM-exclusive routing modules — #SubChain, #Feedback, #DualMono, #Mid/Side, #Multiband, and #Parallel — enable advanced signal routing chains directly within a single plugin slot. Parameter Modulations and a Notepad module round out the feature set.

  All processing plugins support up to 32x oversampling. A freeware version is available that includes all routing modules without restrictions; the compressors, EQ, and other tools have reduced parameters in the free tier. A 14-day free trial is also available. Two licenses are included per purchase, managed via the HOFA Plugins Manager, with offline activation and USB stick support.
specs: |-
  - Formats: VST3, AU, AAX
