  High quality tools for mixing & mastering 21 high-end plugins Highly flexible channelstrip incl. dynamics, EQ, FX and many more Multiband, mid/side, parallel and dual mono routing options Usable as single plugins or in HOFA SYSTEM Also available in a freeware version with slightly reduced feature set You are currently viewing a placeholder content from YouTube . To access the actual content, click the button below. Please note that doing so will share data with third-party providers. More Information Unblock content Accept required service and unblock content Overview These plugins are contained in the HOFA SYSTEM MixBox: CompChan The CompChan sounds like the characteristic channel compressor of the most successful analog mixing boards. You will love the punch on drums and the way it makes bass and other instruments sound vibrant and controlled. CompSum CompSum is a specialist for sums and buses equipped with numerous automatic control functions, which also excels when used with vocal and solo instruments. CompListenMic The CompListenMic is an emulation of the talkback compresso r of a famous british mixing console. In the 1980s, this compressor was often used to enhance the room sound of drum recordings. EQ-Parametric The EQ-Parametric features 11 identically equipped filter bands, ranging from 13 to 20,000 Hz and a high-precision analyser. For each band you can choose from: High and lowcut (6, 12, 24, 48 dB/oct) Bandpass filter with adjustable Q factor Bell filter (Q 0.1 – 36) High and low shelves Vintage high and low shelves GainMode Do you need another filter band? Simply click the plus button – the EQ plugin window is exactly as big as you need it. Clicking on the frequency curve opens the large curve editor with analyser for all those who favour a precise optical feedback. In combination with up to 32x oversampling (which is available for all SYSTEM plugins), you get an ultra-flexible, clear and highly musical EQ suitable for all applications. Delay Delay is