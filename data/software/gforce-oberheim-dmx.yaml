description: Virtual drum machine honoring the classic Oberheim DMX. Features 288 authentic DMX/DX sounds, 60+ preset kits, per-track controls, and multi-mode SEM filter. Includes original 1981 and 1983 DMX sound sets plus DX and Sequential Drumtraks variations with 85+ MIDI files of classic recreations.
details: |-
  The Oberheim DMX by GForce Software faithfully recreates the iconic 1981 Oberheim drum machine that shaped new wave, pop, hip-hop, and electronic music throughout the 1980s and beyond. Developed in direct association with Oberheim, it combines authentic vintage sounds with modern production capabilities.

  The instrument provides 288 authentic DMX and DX sounds sourced from 1981 and 1983 machines, organized across over 60 preset kits spanning classic, modern, and hybrid combinations. Each of the eight drum channels offers comprehensive per-track controls including solo, mute, pitch, decay, pan, gain, delay send, and reverb send.

  Master processing includes a multi-mode SEM filter, distortion, and compressor. Over 85 MIDI files are included for classic beat recreation. The fully scalable user interface supports MIDI Learn programming and GM mapping, velocity control, and a preset browser. Version 1.1 added multi-output functionality. A 7-day trial version is available (excludes MIDI pack).
specs: |-
  - 288 authentic DMX and DX sounds (1981 and 1983 machines)
  - 60+ preset kits (classic, modern, and hybrid)
  - 8 drum channels
  - Per-channel controls: solo, mute, pitch, decay, pan, gain, delay send, reverb send
  - Master effects: multi-mode SEM filter, distortion, compressor
  - 85+ MIDI files with classic beat recreations
  - Fully scalable user interface
  - MIDI Learn programming and GM mapping
  - Velocity control and preset browser
  - Multi-output support (v1.1+)
  - Mac: Intel & Apple Silicon native, macOS 10.13+
  - Windows: 2GHz CPU, 2GB RAM, Windows 7+
