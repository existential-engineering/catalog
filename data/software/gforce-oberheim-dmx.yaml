description: Virtual drum machine honoring the classic Oberheim DMX. Features
  288 authentic DMX/DX sounds, 60+ preset kits, per-track controls, and
  multi-mode SEM filter. Includes original 1981 and 1983 DMX sound sets plus DX
  and Sequential Drumtraks variations with 85+ MIDI files of classic
  recreations.
details: |-
  Developed in association with Oberheim, the DMX is a testament to the timeless influence of the classic Oberheim DMX, re-envisioned for today's creative minds. It offers authentic vintage drum sounds meticulously crafted and enhanced for crystal-clear quality, presented through a fully-scalable, user-friendly interface with an advanced knob view and a preset browser.

  The original Oberheim DMX drum machine left an indelible mark on popular music, from the driving beats of New Order's 'Blue Monday' and Madonna's 'Holiday' to the foundational rhythms of Run-D.M.C.'s 'It's Like That', Phil Collins' 'Sussudio', Davy DMX's 'One For The Treble' and the grooves of Eurythmics' 1983 album.

  The original DMX is a sample-based instrument whose samples are programmed onto EPROMs, and thanks to the Oberheim Prommer users could program and swap those EPROMs for their own sounds, or trade them between popular drum machines of the day. GForce reconstituted the original DMX (1981) sound set as well as the later 1983 DMX set and the DX, added Sequential Drumtraks sounds as played by a DMX, and complemented them with alternatives of their own, for 288 sounds in total. GForce cites 336,468,800 possible combinations of sounds before any treatment.

  The original eight-part sound kit is augmented with control over pan, solo, mute, pitch, decay, analogue-style delay send and reverb send for each channel. On the master channel a multi-mode filter, distortion and compressor add depth, warmth and punch. Kits capture both the raw, unprocessed sound of a DMX/DX and professionally produced, production-ready variants, and a collection of classic MIDI files is included as a starting point.
specs: |-
  - 288 authentic DMX and DX sounds (1981 and 1983 machines)
  - 60+ preset kits (classic, modern, and hybrid)
  - 8 drum channels
  - Per-channel controls: solo, mute, pitch, decay, pan, gain, delay send, reverb send
  - Master effects: multi-mode SEM filter, distortion, compressor
  - 85+ MIDI files with classic beat recreations
  - Fully scalable user interface
  - MIDI Learn programming and GM mapping
  - Velocity control and preset browser
  - Multi-output support (v1.1+)
  - Mac: Intel & Apple Silicon native, macOS 10.13+
  - Windows: 2GHz CPU, 2GB RAM, Windows 7+
