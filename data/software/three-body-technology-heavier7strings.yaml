description: Heavier7Strings is a 7-string virtual guitar instrument built from 10,000+ samples at 24-bit/48kHz across 10GB of content, combining a deep sample library with a built-in 31-module effects rack for a complete electric guitar solution.
details: |-
  Features the THRASH (Tonal/Harmonic Reconstruction and Shaping) engine for dynamically adjustable harmonics and formants. Includes 31 built-in effect modules with 16 AMP simulations covering heavy metal to clean styles, plus 66 cabinet IRs. Supports real-time techniques including hammer-on, pull-off, legato, pinch harmonics, tremolo, and palm mute with automatic fret position and picking detection. Ships with 300 factory MIDI patterns (metal, rock, pop, clean, ambient, noise) draggable directly into a DAW. Provides up to 16 round-robins per sample, sampled-LFO vibrato, true stereo doubling, and Drop-A tuning support.
specs: |-
  - Sample library: 10,000+ samples, 24-bit 48kHz, 10GB total
  - CPU: Intel/AMD with SSE3+ or Apple Silicon
  - OS: macOS 11 or later / Windows 8 or later
  - RAM: 4GB minimum
  - Storage: 10GB disk space
  - Effects rack: 31 modules including Screamer, EQ12, AMP, Flanger, Wah, Ping-Pong Delay
  - AMP simulations: 16 AMPs (heavy metal to clean styles)
  - Cabinet IRs: 66 IRs with adjustable delay, volume, and phasing
  - Factory presets: 200 presets
  - Factory MIDI patterns: 300 (metal, rock, pop, clean, ambient, noise)
  - Round-robins: up to 16 per sample
  - Hotkeys: 24 with flexible key-mapping
  - Tuning: standard and Drop-A supported
