description: Heavier7Strings is a 7-string virtual guitar instrument built from 10,000+ samples at 24-bit/48kHz across 10GB of content, combining a deep sample library with a built-in 31-module effects rack for a complete electric guitar solution.
details: |-
  Heavier7Strings is a 7-string metal-style virtual guitar instrument built on four years of recording and engineering, with more than 10,000 samples at 24-bit/48 kHz totalling 10 GB. Individual samples for infinite sustain allow the decay rate to be adjusted freely, and the instrument uses high-quality A/D conversion with an ultra-low noise level.

  Clean samples are paired with a full production-level effect rack, making the plugin a complete electric guitar solution. The rack holds 31 effect modules including Screamer, EQ12, AMP, Flanger, Wah and Ping-Pong delay, 16 amp models ranging from heavy metal to clean with 2x to 8x sample rate processing, and 66 cabinet impulse responses that can be used four at a time with adjustable delay, volume and phasing. 200 factory presets ship alongside a preset manager for user presets. The effect rack can also be used on its own on an audio track, with third-party instruments or with a real guitar.

  The THRASH (Tonal/Harmonic Reconstruction and Shaping) DSP engine drives a self-developed sampler with direct-from-disk streaming. It provides dynamically adjustable sample harmonics, dynamically reconstructed formants, and realistic pitch-bend and pitch-shift that recoup formants rather than simply shifting pitch. Samples carry up to 16 round robins, and the engine induces randomized tone changes beyond the recorded material for more realistic repeated playing. A real-world sampled LFO, recorded from the pitch-shift curve of actual vibrato playing, replaces sine-wave pitch modulation. Every instance shares the same memory pool, so many instances can be loaded without additional resource use.

  The instrument is playable in real time, with hammer-on and pull-off, legato slide in and out, pinch harmonics, tremolo, palm mute, picking noise, polyphonic legato and repeats. Fretboard position, up/down picking and strumming are determined automatically, power chords play automatically, and a chord detect function and Chord Mapping allow guitar chords to be played from a keyboard. There are 24 hotkeys and a flexible key-mapping system covering performance styles, string and fret assignments and humanization, plus true doubling of two guitars on left and right channels with individual random note delay and round-robin selection. Playing styles switch through flexible CC mappings instead of fixed key-switches, and unison bend, tension, resonance, per-string level, palm muting level and attack, Drop-A tuning and a pickup switch are all adjustable.

  A pattern library provides 300 factory MIDI patterns together with effect rack presets, covering metal, rock, pop and clean styles along with non-rhythmic noise and ambient material. Patterns can be dragged into the host DAW, and users can define their own.
specs: |-
  - 10,000+ samples, 24-bit/48 kHz, 10 GB total
  - Four years of recording and engineering
  - Individual samples for infinite sustain with adjustable decay rate
  - 31 effect modules including Screamer, EQ12, AMP, Flanger, Wah and Ping-Pong delay
  - 16 amp models with 2x to 8x sample rate processing
  - 66 cabinet IRs, up to four at once with adjustable delay, volume and phasing
  - 200 factory presets with preset manager
  - THRASH (Tonal/Harmonic Reconstruction and Shaping) DSP engine
  - Up to 16 round robins per sample
  - Real-world sampled-LFO vibrato
  - Shared memory pool across instances
  - True doubling across left and right channels
  - 24 hotkeys with flexible key-mapping and CC mapping
  - Adjustable Drop-A tuning and pickup switch
  - 300 factory MIDI patterns, draggable into the host DAW
  - Minimum system requirements: Intel or AMD CPU with SSE 3 or higher, or Apple Silicon
  - Minimum system requirements: macOS 11 / Windows 8
  - Minimum system requirements: 4 GB RAM and 10 GB disk space
  - Plugin formats: 64-bit VST2, VST3, AAX and Audio Unit
