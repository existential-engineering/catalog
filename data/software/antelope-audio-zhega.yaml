description: Analog-style distortion and tone shaping for modern workflows.
details: |-
  ZHEGA is a distortion and saturation plugin featuring five analog-inspired circuit modes, designed to deliver a wide range of harmonic textures—from subtle warmth to extreme fuzz. It combines authentic analog-style coloration with precise digital control for fast, flexible tone shaping.

  Runs natively in your DAW on macOS or Windows. Part of the Antelope Cosmos plugin collection.
