details: |-
  Welcome to Betelgeuse, the first semi-modular arranger keyboard plugin that
  brings professional-grade entertainment capabilities to your fingertips. This
  revolutionary virtual instrument emulates high-end hardware arrangers and
  workstations, offering more then 430 (and growing!) free loadable and
  shareable styles from any music genre for dynamic, live-oriented performances
  and instant, high-quality backing tracks.

  Betelgeuse is a powerful MIDI engine designed to seamlessly integrate with
  your digital audio workstation (DAW). While it doesn't generate sound on its
  own, it orchestrates your favorite virtual instruments (vstis) by routing MIDI
  sequences through various channels, mimicking the functionality of a hardware
  arranger with enhanced flexibility.

  Betelgeuse combines the best of both worlds: the intuitive interface of a
  hardware arranger with the power and versatility of modern DAW software. This
  synergy, coupled with today's advanced audio equipment, opens up new horizons
  in music production, composing and live performance backing.

  Betelgeuse comes in 4 versions: betelgeuse - full featured vsti plugin for
  windows os only (no demo mode), part of mad MIDI machines pack. Betelgeues
  free editions - totally free 6 variations vsti plugin that lacks some of extra
  features compared to the paid edition. Betelgeuse stand alone edition - full
  featured stand alone software for windows os only (no demo mode), part of mad
  MIDI machines pack, based on MIDI cables. Betelgeues free stand alone edition
  - totally free 6 variations stand alone software that lacks some of extra
  features compared to the paid edition. Based on MIDI cables.

  Integration with gm compliant vstis for robust controlling and
  synchronization. Full DAW integration for recording, mixing, and mastering
  your backing tracks and performances.
