details: |-
  Hammer Mk2 is a tube-modeled EQ plugin sold by Kush Audio under its A-Designs Digital line, modelling the A-Designs Hammer hardware tube equaliser.

  The original Hammer's top end sheen and tube-thickened low end earned it a permanent place on mix busses around the world. Hammer Mk2 preserves the original design while doubling the number of available frequencies per band, including several powerful shelves.

  The upgraded plugin elevates the sonics further with a dead-on model of the hardware's "default" sonic signature.

  A suite of beautiful gain staging and metering tools round out this compelling upgrade from Kush.
specs: |-
  - Tube-modeled EQ plugin
  - Preserves the original Hammer design while doubling the number of available frequencies per band
  - Several powerful shelf options added to the per-band frequency choices
  - Models the hardware's "default" sonic signature
  - Suite of gain staging and metering tools
  - Perpetual licence includes 2 activations
  - Free updates and support
  - All available presets included
  - Free 10-day demo available via a demo code published on the product page
  - Mac and Windows installers provided
