description: Find three real-time effects and afx2daw in the Sound Explosion FX
  Bundle - available for Antelope Audio Synergy Core interfaces.
details: |-
  Energize any heavy guitar and treat loud vocals with three effects that sound great on any aggressive tracks - from hard rock to the influential 'Seattle sound'. But beware - pushing the processing too far might cause a sudden urge to shatter your guitar into pieces.

  Impresser (Stereo Knee Compressor/Limiter) - modeled after one of the most flexible, powerful, and edgy compressors known to the audio world; aggressively pumps up any source audio.

  BAE 1073MP (Mic/Line Preamp) - one of the most famous mic preamps, the BAE 1073MP has shaped the sound of rock and roll records; alter the input impedance with a single switch to control the amount of rich and warm coloration applied to acoustic instruments and vocals.

  BBD-CHORUS (Bucket Brigade Chorus) - the original captivated its listeners with thick organic modulation and gooey pitch-shifting vibrato, which you can now apply to your heavy tracks.

  Runs in real-time on Antelope Audio Synergy Core interfaces; also usable in DAWs via afx2daw.
