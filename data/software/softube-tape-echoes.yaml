description: Many tape delay plugins can give you a realistic tape effect, but
  only Tape Echoes gives you the tape delay you hear in your head. This vintage
  tape echo plugin sounds as dirty as you've always wanted it to.
details: |-
  The warm ambiance that tape delay lends to a track can make it transcendent. From Elvis to King Tubby to Radiohead, the ripple effects of tape echo can be seen on important records that span decades. Analog tape delays are costly to own and maintain and, while plug-in versions have filled the void, they come with an unwelcome cleanliness. Many tape delay plug-ins can give you a realistic tape effect, but only Tape Echoes gives you the tape delay you hear in your head, minus the headaches.

  Tape Echoes is overflowing with all the pulsating color and character you need to take your tape effect from authentically gritty to lavishly analog. With the Drive & Dirt features, you can effortlessly drench your track in as much wobbly, glitchy, distorted delay as you can fathom. And by setting the delay time to Just Dirt, you can achieve a classic old-school grit. It's a plug-in plush with vintage lo-fi vibes and it's an absolute dream to use.

  Tape Echoes' exclusive Drive & Dirt features let you quickly and easily go from gentle realism to extravagant saturation. Drive offers preamp and tape distortion, while Dirt's parameters affect tape speed, wobble, flutter, dropouts, and frequency response. Set it to Just Dirt and turn the reverb off to get the old-school wobble and grit of tape without repetitions, perfect for transforming a hi-def loop into lo-fi vibe.

  The Number of Taps knob captures the resounding depths of classic tape delay hardware. Mimicking the sound, behavior, and timing of analog tape delay heads, the Number of Taps knob glides effortlessly between one, two, or three taps. The feedback dials in and emphasizes the taps for a natural, analog effect. Tape Echoes also features hyper-realistic analog delay and spring reverb that perform just like authentic hardware, with the reverb placeable in parallel or before the delay line.

  Tape Echoes has everything you need to create the tape echo tones of your wildest dreams, plus the contemporary features that make it easy to use in the DAW-based studio. Use Tape Echoes in free mode or synchronize to the DAW with Tempo Sync and mapped out rhythm times. Tap Tempo makes it easier to dial in certain tap times and Tape Echoes also includes stereo- and dual-mono modes, as well as a wet/dry control. All of Tape Echoes' parameters are programmable in the DAW.
specs: |-
  - A tape echo plug-in with the tape delay sounds you hear in your mind
  - Softube-quality modeling of a classic vintage tape delay hardware
  - Drive & Dirt features let you go clean or extremely distorted, and everything in between
  - A Just Dirt setting for gritty, old-school tape sounds
  - Get old-school dub sounds with lots of distortion, tape wobble, and crushing feedback
  - Easily dial in great sounding effects with amazing quality
  - Three versions included: Tape Echoes as a native plug-in, Tape Echoes for Amp Room, and Tape Echoes for Modular
  - Number of Taps knob glides between one, two, or three taps
  - Hyper-realistic analog delay and spring reverb, with the reverb placeable in parallel or before the delay line
  - Tape Glitch creative features
  - Tempo Sync, Tap Tempo and free mode
  - Stereo and dual-mono modes, plus wet/dry control
  - Supports Softube Extended Features
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26; Windows 10 (64-bit), Windows 11
  - Softube account and iLok account required (no physical iLok required)
  - Internet access required for downloading installers and managing licenses
  - Three activations included
