details: |-
  The aXGate by SSA Plugins is an ambisonic noise gate and downwards expander.
  Any processing applied to higher order ambisonics signals has to be handled
  carefully to ensure that the spatial balance of the sound scene is not
  disturbed. The aXGate lets you apply a noise gate to your tracks or busses
  without harming the delicate spatial balance of the ambisonic signals.

  The axgate has the following parameters: input gain - boost or cut the input
  gain. Output make-up gain - adjust the output level to compensate for a
  reduction in overall level due to compression. Threshold - the threshold level
  above which a signal will have compression applied. Ratio - controls the
  amount of gain reduction applied when signals go above the threshold. Knee
  width - control how smoothly the compressor goes from uncompressed to
  compressed as signal level increases.

  Zero knee width is a hard knee. Attack time - the time in milliseconds for the
  compressor to become fully active once the signal goes above the threshold.
  Release time - the time in milliseconds for the compressor to stop acting on
  the signal once it falls below the threshold. Rms or peak detection - control
  whether it is the signals peak or average levels that are used to determine if
  the level is above the threshold. Gain reduction display - shows the amount of
  gain reduction applied over time.

  Input: any ambisonic channel format with the w channel on the first input.
  Output: the same as the output. The axgate is available with 3 levels of
  spatial resolution, with different maximum ambisonic orders: a1gate - gate
  first-order ambisonic signals. A3gate - gate up-to third-order ambisonic
  signals. A7gate - gate up-to seventh-order ambisonic signals.

  Axgate by ssa plugins is a virtual effect audio plugin for macos and windows.
  It functions as an audio units plugin, a VST 3 plugin and an AAX plugin.
specs: |-
