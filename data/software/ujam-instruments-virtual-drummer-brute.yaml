description: "Virtual Drummer BRUTE is for hard-and-heavy music genres driven by a specific drumming style: loud, wild and cutting through the mix."
details: |-
  Contemporary hard-and-heavy music genres are driven by a very specific drumming style: loud, wild, edgy and cutting through the mix. Both the drum sounds and the playing are rooted in aesthetics invented about two decades ago, and Virtual Drummer BRUTE features the essential sounds and styles from Grunge to NuMetal.

  BRUTE was designed, recorded and processed to do one thing really well: compete with layered walls of distorted guitars while maintaining character and detail. The solution was to record with three different sets of microphones that each emphasize a different aspect of the drum sound.

  A vintage Sennheiser MD21 from the 1960s, processed through a Manley Voxbox, emphasizes attack transients for the Click/Smack character. Vintage tube and ribbon overheads capture the Grit/Dirt, the organic noise and resonance that give a warm, coarse, natural quality. Modern high-spec Schoeps microphones capture the kit as is, with as little colorization and distortion as possible, for the Clean/Nice character.

  Mix Presets shape the overall sound by swapping out an entire multi-bus effect chain for every channel under the hood, saving time wrestling with the bus system of a DAW. Smack adds purpose-recorded mic signals that focus attacks and transients while keeping the warm, organic qualities of the kit, and Grit crossfades between two sets of mics, from nice and clean to dirty and mean.
specs: |-
  - 5 genre-specific drum kits
  - 6 mix presets
  - 31 playing styles, each with 23 phrases, 713 phrases in total
  - Smack control for attack and transient emphasis
  - Grit control crossfading between two microphone sets
  - Operating systems: Windows 10 to Windows 11, macOS Catalina (10.15) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - 4 GB of RAM
  - 3.1 GB of disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Automated installation via the UJAM App or a downloadable installer file
