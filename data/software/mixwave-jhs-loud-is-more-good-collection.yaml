details: |-
  Known for innovative sound, quality craftsmanship and user-friendly features, JHS pedals have become immensely popular for their blend of vintage character and modern versatility. This collection captures the essence of their pedal-friendly amplifier and its seamless synergy with a curated selection of JHS's most celebrated pedals, offering everything from transparent overdrive to immersive ambience. Utilizing our proprietary component-level modeling, we've meticulously recreated the amp's clean, articulate response, tube-like compression, and natural interaction with effects. Every nuance, from its harmonic richness to the way it shapes and enhances pedals, has been faithfully recreated. Introducing, MixWave: JHS Loud Is More Good Collection .
