details: |-
  Big Bang - Cinematic Percussion is a virtual instrument for Mac OS X and
  Windows. It features over 12 gigabytes of more than 200 instrument presets all
  designed by SONiVOX's sound designers to deliver explosive sounding drums and
  percussion, for use in a cinematic context.

  An integral part of big bang - cinematic percussion is a new technology called
  intelligent rhythm control, or I.r.c. Intelligent rhythm control technology is
  a new concept in music production that offers real-time rhythm correction for
  maximizing in-time musical performance.

  I.r.c. Intercepts and adjusts MIDI events as they occur, seamlessly
  integrating each note into the host timeline and enabling users to create
  propulsive drum & percussion tracks with fluidity and ease. With I.r.c.
  Enabled it is impossible to play out of time, according to sonivox.

  Big bang - cinematic percussion by sonivox is a virtual instrument audio
  plugin and a software application for macos and windows. It functions as a VST
  plugin, an audio units plugin, an AAX plugin and a standalone application.
specs: |-
  - Over 12 gigabytes of content
  - More than 200 instrument presets
  - Intelligent rhythm control (I.r.c.)
  - Real-time rhythm correction
  - MIDI event interception and adjustment
  - macOS support
  - Windows support
