description: A professional audio effects plugin bundle containing seven Lexicon
  effect algorithms designed for use in digital audio workstations.
details: |-
  The PCM Native Effects Bundle represents Lexicon's collection of high-quality effects plugins built on decades of legacy product expertise. This comprehensive package delivers seven distinct effect processors—Pitch Shift, MultiVoice Pitch, Chorus, Resonant Chords, Random Delay, Dual Delay, and Stringbox—each accompanied by extensive factory presets.

  The bundle integrates seamlessly into popular DAWs including Pro Tools, Logic, and Nuendo, providing professional-grade sonic quality with native plugin flexibility. Users benefit from graphical real-time visualization, comprehensive metering, and full parameter automation capabilities across all effects.

  The plugins are available in AAX, VST, VST3 and Audio Unit (AU) formats and run on macOS 10.14 (Mojave) and newer (including Apple Silicon) as well as Windows 10 and 11 (64-bit). Authorization is handled through iLok Manager via local machine or USB iLok key.

  The current version is distributed through the FLUX::Center app, with legacy installers (v1.2.10 for Intel Mac, v1.2.6 for Windows, v1.0.0 for PowerPC Mac) still available for older systems.
specs: |-
  - 7 Lexicon effect algorithms: Pitch Shift, MultiVoice Pitch, Chorus, Resonant Chords, Random Delay, Dual Delay, Stringbox
  - Extensive factory presets for each effect
  - Real-time graphical display with multiple visualization modes (3D voice view, live impulse view, frequency view)
  - Stereo/phase meters for mono compatibility verification
  - Input, output, and feedback metering
  - DAW-independent preset format for cross-platform compatibility
  - Full parameter control and automation support
  - iLok Manager authorization (local machine or USB iLok)
  - Apple Silicon native support
  - VST3 support
