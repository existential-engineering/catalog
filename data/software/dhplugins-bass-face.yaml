details: |-
  Small Plug-In, Big Sound. BASS-FACE is a 'One-Knob' style multi-effect plug-in designed to add presence and distortion to your sound. With 4 modes to select from, each increasing in drive and presence, BASS-FACE can add a gentle lift or face-melting heat to whatever you feed it.

  A simple interface and huge sound, BASS-FACE is designed as an enhancer / drive unit, processing several effects to add character, drive, width, modulation and presence to your sounds.

  Four TYPE modes step up the amount of processing, from gentle presence, space and subtle modulation through saturation and drive to a mode combining drive, presence, up / down compression and space. Two extra switches sit alongside them: CLIP adds a no-frills hard clipper to the end of the signal chain, and XTRA boosts the spatial and modulation effects.
specs: |-
  - TYPE 1 - Gentle Presence, Space and Subtle Modulation
  - TYPE 2 - Saturation, Presence, Space and Subtle Modulation
  - TYPE 3 - Drive, Presence and Subtle Modulation
  - TYPE 4 - Drive, Presence, Up / Down Compression & Space
  - CLIP - Adds a no-frills hard clipper to the end of the signal chain
  - XTRA - Boosts the Spacial and Modulation effects
  - AU / VST3 / AAX, 64 bit
  - 1GB RAM, 1GB HDD space
  - Windows 7 or later, macOS 10.8 or later
  - M1/M2/M3 ready
  - 3 license activations per purchase
