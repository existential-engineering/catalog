description: Spectral sidechain ducker that listens to your sidechain input in the frequency domain and only ducks the frequencies where your trigger is loud.
details: |-
  SpectraDuck is a sidechain ducker that looks at the spectrum rather than just the loudness. When a kick hits at 60 Hz, SpectraDuck pulls down only around 60 Hz on the channel being ducked, and the rest of the signal passes through untouched. The result is ducking that follows the natural masking of the signal: where there is conflict it cuts, where there is not it leaves things alone. There are no crossovers, no fixed bands and no phase issues between bands.

  Three controls cover most use cases. Amount sets how hard the ducker pushes as a percentage, Range is the maximum number of decibels it can cut at any moment, and Sharpness sets how surgical the cut is, with high values following the sidechain spectrum exactly and low values spreading the cut over neighbouring frequencies.

  A real-time spectral display draws the signal's spectrum in cyan, the post-ducking spectrum in yellow and the gain-reduction curve in magenta. An HP/LP detector filter tells SpectraDuck which frequencies to listen to in the sidechain, Auto Time estimates attack and release from the sidechain content, and Lookahead adds a short buffer so the ducking anticipates transients.

  MS mode offers Linked, Mid Only and Side Only operation, and Listen mode can monitor the sidechain or the delta signal so you can hear exactly what is being cut. The plugin adds approximately 5 ms of latency, compensated automatically by the host, and without a sidechain trigger it runs in passthrough by design.
specs: |-
  - FFT-based real-time spectral analysis, no EQ bands and no fixed crossovers
  - Amount, Range and Sharpness controls
  - Real-time spectral display with input spectrum, post-ducking spectrum and gain-reduction curve
  - HP / LP detector filter to set the sidechain listening range
  - Auto Time estimates attack and release from the sidechain content
  - Lookahead for click-free operation on percussive sources
  - MS mode: Linked, Mid Only or Side Only
  - Listen mode: Off, Sidechain or Delta
  - Latency approximately 5 ms, DAW-compensated (PDC)
  - L/R output meters and gain-reduction meter
  - Formats: VST3, Audio Units (AU), AAX, 64-bit only
  - macOS 10.15+ (Intel and Apple Silicon), Windows 10+ (64-bit)
  - Native ARM support for M1, M2, M3, M4, no Rosetta required
  - No dongle required
