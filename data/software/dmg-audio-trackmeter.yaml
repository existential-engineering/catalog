description: "TrackMeter is a freely resizable metering and audio visualization
  plugin covering every studio use-case. It provides a comprehensive set of
  graphs including FFT spectrum analysis, spectrographs, oscilloscope,
  Lissajous, phase meters, loudness metering, and a chromatic tuner."
details: |-
  TrackMeter offers a comprehensive set of freely resizable metering displays: FFT Spectrum Analyzer (1/3rd and 1/12th octave options), 2D and 3D Spectrographs, Oscilloscope, Lissajous display, Phase Meters, ITU1770/EBU r128/ATSC A/85 loudness metering, and a chromatic tuner. Supports full-screen mode and PNG screenshot export. Mac Retina display support included. Windows: VST/VST3/AAX 32+64bit, RTAS 32bit (Vista/7/8/10, 32+64bit). Mac: VST/VST3/AU/AAX 32+64bit (OS 10.7+, Intel and Apple Silicon).
