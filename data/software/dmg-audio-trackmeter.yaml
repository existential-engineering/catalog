description: TrackMeter is a freely resizable metering and audio visualization plugin covering every studio use-case. It provides a comprehensive set of graphs including FFT spectrum analysis, spectrographs, oscilloscope, Lissajous, phase meters, loudness metering, and a chromatic tuner.
details: |-
  TrackMeter provides a full set of beautiful, responsive graphs for audio monitoring, metering and visualisation, with a freely resizable UI covering every studio use-case.

  After designing Dualism, DMGAudio received many requests for a freely-resizable graphing plugin, so TrackMeter slims down the UI and simplifies the setup while keeping the same graphing engine, as a one-stop solution for metering needs.

  TrackMeter uses OpenGL2 for its graphics; most graphics cards work fine, though integrated Intel graphics may perform poorly.
specs: |-
  - Fully featured FFT Spectrum Analyser
  - Octave, 1/3rd Octave and 1/12th Octave displays
  - 2D and 3D Spectrographs
  - Lissajous and Oscilloscope displays
  - Phase Meter and Correlation Meter
  - 1/3rd Octave RMS Analyser
  - Phase Spectrum analyser
  - Chromatic tuner
  - ITU1770 Short-Term loudness history and histogram display
  - Full ITU1770 / EBU r128 / ATSC A/85 loudness metering support
  - Full-screen mode and PNG screenshots
  - Freely-resizable UI
  - Mac Retina support
