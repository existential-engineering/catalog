description: A channel strip optimized to get great electric instrument sounds. Serves as a comprehensive tool for guitars, bass, keyboards, vocals, and bus processing. Features 4-band fully parametric EQ based on German Klangfilter tube equalizer modeling from the 1950s, VCA compressor based on dbx 202 circuit, frequency dependent gain reduction, Insufferable Midrange Filter (specialized notch filter), proprietary tube/tape/solid-state response modeling, stereo width enhancement, real-time analyzer, high/low-pass filtering, and dry/wet parallel processing.
details: |-
  The Amplified Instrument Processor is a complete suite of tools designed to help you sculpt the ultimate electric guitar tone.

  The AIP is a collection of interconnected processors that help you fix issues, craft tonalities and ultimately fit huge guitars perfectly into the final mix. Compression, EQ, saturation, notch filtering, even stereo width enhancement, everything you need.

  But its power and versatility also make it perfect for other tasks, like polishing keyboards, fine-tuning vocals, even sweetening an entire mix. It was developed by Dan Korneff specifically for his own style and sound.

  The signal path begins with proprietary signal processing that dials in the overall vibe, tape-saturated bottom, tube warmth or mid-forward solid state, followed by transient response tuning. The Insufferable Midrange Filter then notches out the harsh 2 to 8kHz range that guitar overdubs accumulate while retaining air and shimmer, and Frequency Dependent Reduction holds the bottom end down only when guitars get too thick, rather than thinning them.

  Four bands of fully parametric EQ modeled from vintage German Klangfilter tube equalizers fit the result into the mix, a VCA compressor with full attack, release, ratio and saturation control adds the final punch and glue, and a mono-friendly stereo widening stage opens up the center for vocals, bass and drums. A real time analyzer displays frequency response, EQ curve and compression information.
specs: |-
  - Proprietary signal processing with tape, tube and solid state voicings plus transient response control
  - Insufferable Midrange Filter for notching harshness in the 2 to 8kHz range
  - Frequency Dependent Reduction for controlling excessive low end
  - Four-band fully parametric EQ modeled from vintage German Klangfilter tube equalizers
  - VCA compressor with attack, release, ratio and saturation control
  - Mono-friendly stereo widening with maintained phase integrity
  - Real time analyzer showing frequency response, EQ curve and compression information
  - Requires an iLok account for activation and licensing
  - Activation on up to four machines at the same time
  - Internet connection required for activation and for all demos
  - Minimum: Intel, AMD or Apple Silicon i5 quad core processor
  - Minimum: 4GB of RAM
  - Minimum: Mac OS X 10.14 or higher
  - Minimum: Windows 7 and above
  - Minimum screen resolution: 1024 x 768
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
