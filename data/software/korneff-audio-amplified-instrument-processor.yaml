description: "A channel strip aimed at electric instruments, usable on guitars, bass, keyboards, vocals and buses. Features 4-band fully parametric EQ based on German Klangfilter tube equalizer modeling from the 1950s, VCA compressor based on the dbx 202 circuit, frequency dependent gain reduction, Insufferable Midrange Filter (a specialized notch filter), proprietary tube/tape/solid-state response modeling, stereo width enhancement, real-time analyzer, high/low-pass filtering, and dry/wet parallel processing."
details: |-
  The Amplified Instrument Processor is a channel strip for shaping electric guitar tone.

  The AIP is a set of interconnected processors covering compression, EQ, saturation, notch filtering and stereo width enhancement, for correcting problems and fitting guitars into a mix.

  The same processors apply to other sources, including keyboards, vocals and full mixes. It was developed by Dan Korneff for his own work.

  The signal path begins with proprietary signal processing that sets the overall voicing, tape-saturated bottom, tube warmth or mid-forward solid state, followed by transient response tuning. The Insufferable Midrange Filter then notches the 2 to 8kHz range that accumulates across guitar overdubs while retaining high-frequency content, and Frequency Dependent Reduction attenuates the low end only when it exceeds a set level rather than filtering it out.

  Four bands of fully parametric EQ modeled from vintage German Klangfilter tube equalizers shape the result, a VCA compressor with attack, release, ratio and saturation control follows, and a mono-friendly stereo widening stage opens the centre for vocals, bass and drums. A real time analyzer displays frequency response, EQ curve and compression information.
specs: |-
  - Proprietary signal processing with tape, tube and solid state voicings plus transient response control
  - Insufferable Midrange Filter for notching harshness in the 2 to 8kHz range
  - Frequency Dependent Reduction for controlling excessive low end
  - Four-band fully parametric EQ modeled from vintage German Klangfilter tube equalizers
  - VCA compressor with attack, release, ratio and saturation control
  - Mono-friendly stereo widening with maintained phase integrity
  - Real time analyzer showing frequency response, EQ curve and compression information
  - Requires an iLok account for activation and licensing
  - Activation on up to four machines at the same time
  - Internet connection required for activation and for all demos
  - Minimum: Intel, AMD or Apple Silicon i5 quad core processor
  - Minimum: 4GB of RAM
  - Minimum: Mac OS X 10.14 or higher
  - Minimum: Windows 7 and above
  - Minimum screen resolution: 1024 x 768
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
