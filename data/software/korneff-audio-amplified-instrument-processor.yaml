description: A channel strip aimed at electric instruments, usable on guitars,
  bass, keyboards, vocals and buses. Features 4-band fully parametric EQ based
  on German Klangfilter tube equalizer modeling from the 1950s, VCA compressor
  based on the dbx 202 circuit, frequency dependent gain reduction, Insufferable
  Midrange Filter (a specialized notch filter), proprietary
  tube/tape/solid-state response modeling, stereo width enhancement, real-time
  analyzer, high/low-pass filtering, and dry/wet parallel processing.
details: |-
  A Complete Heavy Guitar Solution. The Amplified Instrument Processor is a complete suite of tools designed to help you sculpt the ultimate electric guitar tone.

  The AIP is a collection of interconnected processors that help you fix issues, craft tonalities and ultimately fit huge guitars perfectly into the final mix. Compression, EQ, saturation, notch filtering, even stereo width enhancement, everything you need.

  But its power and versatility also make it perfect for other tasks, like polishing keyboards, fine-tuning vocals, even sweetening an entire mix.

  The AIP is 6 Plug-ins in one: craft professional guitar sounds with a complete toolset of high-end processing, clean up harsh upper mids on sources from guitars to cymbals, easily fit huge guitars into your mix, and polish sources with tube style EQ and two different compressors. AIP works on anything, keys, vocal submixes, ambience. Developed by Dan Korneff specifically for his style and sound.

  The AIP workflow for great guitar sounds begins by dialing in the overall vibe with the Proprietary Signal Processing: tape-saturated bottom, tube warmth or mid-forward solid state, then fine-tuning the transient response.
specs: |-
  - Proprietary Signal Processing: dial in tape-saturated bottom, tube warmth or mid-forward solid state, then fine-tune the transient response
  - Insufferable Midrange Filter: notch out the harsh 2-8 kHz range of guitar overdubs while retaining air and shimmer, and it also works on cymbals and vocals
  - Frequency Dependent Reduction: hold the bottom end down and compress guitars only when they get too thick, with no thinning
  - Parametric Equalization: four bands of fully parametric EQ, modeled from vintage German Klangfilter tube equalizers
  - VCA Compressor: transient enhancement and glue with full control of attack, release, ratio and saturation
  - Stereo Widening: mono-friendly widening that maintains phase integrity with no response anomalies
  - Real Time Analyzer: frequency response, EQ curve and compression information
  - Licensing: iLok account required for activation, up to four (4) simultaneous machine activations, internet connection required for activation and for all demos
  - Minimum system: Intel, AMD or Apple Silicon i5 quad core processor, 4GB of RAM, Mac OS X 10.14 or higher, Windows 7 and above, screen resolution 1024 x 768 or higher
  - Supported plugin formats: Mac 64bit (VST3, AU, AAX), Windows 64bit (VST3, AAX)
