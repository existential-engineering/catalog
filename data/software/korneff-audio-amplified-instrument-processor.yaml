details: |-
  The Amplified Instrument Processor (AIP) is a channel strip plugin from Korneff Audio designed primarily for electric guitar but versatile enough for vocals, keyboards, bus processing, and full mixes. It combines seven processing modules into a single unified interface: Proprietary Signal Processing (PSP), Insufferable Midrange Filter (IMF), Frequency Dependent Reduction (FDR), four-band parametric EQ, VCA compressor, stereo widening, and a real-time analyzer.

  The Proprietary Signal Processing (PSP) module offers tape saturation, tube warmth, and solid-state character options, providing analog-style harmonic coloring. The Insufferable Midrange Filter (IMF) is a dedicated notch filter targeting the 2–8 kHz range, designed to tame harsh midrange frequencies that commonly cause problems in electric guitar recordings and mixes.

  The Frequency Dependent Reduction (FDR) module provides selective compression that targets low-end buildup, allowing high-frequency content to pass more freely while controlling the body and thickness of the signal. The four-band parametric EQ is modeled on vintage German Klangfilter tube equalizers, contributing musical and responsive tonal shaping.

  The VCA compressor section includes transient enhancement capabilities, and the stereo widening module uses mono-friendly, phase-coherent processing to add width without compromising mono compatibility. The built-in real-time analyzer (RTA) displays frequency response and compression activity for visual feedback during processing.

  Licensing uses iLok account activation, supporting up to four simultaneous machine activations. A demo version is available for trial.
