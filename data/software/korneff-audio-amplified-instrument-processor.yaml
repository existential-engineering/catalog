description: "A channel strip optimized to get great electric instrument sounds.
  Serves as a comprehensive tool for guitars, bass, keyboards, vocals, and bus
  processing. Features 4-band fully parametric EQ based on German Klangfilm tube
  equalizer modeling from the 1950s, VCA compressor based on dbx 202 circuit,
  frequency dependent gain reduction, Insufferable Midrange Filter (specialized
  notch filter), proprietary tube/tape/solid-state response modeling, stereo
  width enhancement, real-time analyzer, high/low-pass filtering, and dry/wet
  parallel processing."
