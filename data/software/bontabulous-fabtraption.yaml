description: Bontabulous Fabtraption captures the vintage analog sounds of the
  unique bontempi HP 544-20. This italian synthesizer was introduced to the
  market in the late 1970s. It featured a 49-key keyboard and drum/rhythm
  machine, as well as a variety of knobs and faders to control layer volume,
  instrument type, envelope, modulation and filter.
details: |-
  Bontabulous Fabtraption captures the vintage analog sounds of the unique
  bontempi HP 544-20. This italian synthesizer was introduced to the market in
  the late 1970s. It featured a 49-key keyboard and drum/rhythm machine, as well
  as a variety of knobs and faders to control layer volume, instrument type,
  envelope, modulation and filter.

  Our bontabulous includes synth sustains, staccatos, piano, violin, and "magic
  chords" dialed in from the organ. We also sampled 34 tempo-syncable drum
  machine loops. We recorded the instrument articulations in wide stereo and
  direct line in. After that, we crafted twenty evolving atmospheric pads from
  the source content to enhance versatility.

  We've packed the gui with lots of great sound-shaping controls that give you
  the flexibility to warp the sound in many ways. You have control over volume,
  attack, release, transient offset, vibrato and octave layering. The "glide"
  control slider allows you to play legato and portamento leads.

  You'll also find an adaptable lfo system, with selectable lfo shape,
  modulation target parameter, speed, intensity, tempo-syncing and fade-in time.
  You can also apply your choice of 13 lowpass, high-pass and fx filter, with
  assignable modulation control options, including velocity, modwheel,
  expression, after-touch, key position and step-sequencer table control.

  You can also use our customizable arpeggiator, with a built-in velocity
  sequencer table and control over arp direction, note timing, swing,
  randomization and duration. Bontabulous offers a time-traveling aural preview
  of the historic bontempi line of products, complete with rich tonal colors
  ready to enhance any genre of composition.
