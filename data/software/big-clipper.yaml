details: |-
  One of the brightest stars in the boz digital universe, big clipper offers a
  constellation of unique features for level control, presence, and mix
  cohesion.

  Big clipper combines a variable clipping algorithm and limiter that gives you
  the ability to control peaks and increase loudness transparently, enabling you
  to make tracks louder, compression and reverb sound more natural, and overall
  mixes more cohesive.

  Shape lets you adjust between hard and soft clipping. Four blend modes control
  how the limiter and clipper are blended together. Three-band frequency
  sensitivity controls how the clipper/limiter responds to different parts of
  the frequency spectrum.

  Toolbar with presets and save, a/b comparison, selectable stereo, and mid-side
  operation, wet/dry mix, and bypass.
specs: |-
  - Variable clipping algorithm
  - Limiter
  - Shape control for hard and soft clipping
  - Four blend modes
  - Three-band frequency sensitivity
  - Stereo operation
  - Mid-side operation
  - Wet/dry mix
  - Bypass
  - A/b comparison
  - Presets and save
