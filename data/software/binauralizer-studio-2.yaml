description: Binauralizer studio is a spatial audio plugin (VST3, AU, AAX) to
  convert surround tracks (up to 22.2) to binaural 3d audio.
details: |-
  It conserves all spatial information contained in the original multichannel
  track, and translates it into binaural for listening over headphones.

  Version 2 brings four new features: spatial room effect, head-tracking, an
  improved sofa importer and new input configurations (4.0.4, 9.1.4 and 9.1.6).
specs: |-
  - Surround to binaural conversion
  - Up to 22.2 surround tracks
  - 3d audio
  - Spatial room effect
  - Head-tracking
  - Sofa importer
  - Input configurations 4.0.4
  - Input configurations 9.1.4
  - Input configurations 9.1.6
  - Universal 2 binary
