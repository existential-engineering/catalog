details: |-
  Astralis is described as a "tweaker's synth", great for ambient pads/sounds as
  well as rhythmic effects and very long evolving tones. Aside from having 2
  independent synths with dual and spectral oscillators, 2 cascadable filters
  (8x), 2 modulation sequencers, a gate sequencer (trancegate), and a
  comprehensive FX section, astralis also includes a unique microtonal scale
  system.

  This system uses patches created using the included microtonal bank/patch
  manager. Custom scales of up to 24 notes can be created, and scale entry is
  designed with scala files in mind using either ratio or cent values. 160
  tuning patches are included as default including a wide selection of eastern
  scales. Unlike many other microtonal systems astralis does not rely on the
  pitch bend which remains fully functional.

  Synths: dual oscillator - 11 waveforms, harmonic control, 9 mix modes and
  realtime modulation. Spectral oscillator - sine based oscillator with 16
  partials and realtime modulation. The spectral oscillator can be swapped for a
  second dual osc. 2 complete synths, synth 1 uses the dual oscillator and synth
  2 the spectral oscillator but is swappable for a second dual osc.

  2 polyphonic filters with low pass, high pass, band pass, notch, peak a, peak
  b and both cascadable up to 8 times. Filter limit - reduce the lowest/highest
  filter frequencies. Filter 1 can be routed through filter 2 or filter cutoff
  frequencies can be linked. 2 volume adsr envelopes one per synth. White noise
  source can be added to either synth. Drive/distortion each synth has an
  independent distortion selectable between soft and hard. Each synth has
  independent volume, pan, octave, semitone and fine-tune controls. Synth 1 can
  be used to sync to synth 2.

  Modulation options: modulation matrix - 8 x 8 matrix with a choice of 11
  sources can be mapped to a choice of 26 destinations. Modulation sequencer 1 -
  polyphonic sequencer which can be stepped or smoothed, synced to the host
  tempo. Also has keyboard mapping. Modulation sequencer 2 - monophonic
  sequencer which can be stepped or smoothed, synced to the host tempo. When
  smoother behaves like a programmable lfo. Low frequency oscillator with a
  selection of 17 waveforms. Voice modulator - per polyphonic voice values which
  can be set or random. Other modulation sources are velocity, modulation wheel,
  pitch, aftertouch, expression and pitch bender.
