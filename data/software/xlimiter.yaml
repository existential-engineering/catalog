details: >-
  4front xlimiter is a gentle and soft brickwall limiter processor.


  Primary design goals include master track brickwall compression, vocal track
  compression, and solo track compression.


  A special multistage algorithm provides a very soft transition envelope, thus
  rapid level changes at extreme threshold level will not pump or distort as
  much as with other processors.


  The limiter employs best properties of a single band processor, whereas
  additional techniques are used to provide advantages of continuous multi-band
  processing.
specs: |-
  - VST plugin
  - Brickwall limiter
  - Multistage algorithm
  - Soft transition envelope
  - Single band processor
  - Continuous multi-band processing
