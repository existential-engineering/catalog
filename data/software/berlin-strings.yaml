details: |-
  Combining five meticulously captured string sections with a wide array of
  articulations and exceptional dynamic range, Berlin Strings has earned its
  reputation as the definitive orchestral strings collection. Mid-sized
  ensembles provide exceptional detail and definition, enhanced with multiple
  legato modes, tempo-synced runs, and even a choice of attack options for your
  long notes.

  Recorded on the teldex scoring stage in traditional seating positions, the
  sound is natural, balanced, and blends perfectly with other berlin series
  collections. Now available on sine, berlin strings is the gold standard for
  detailed and true-to-life string composition.

  Berlin strings is part of the acclaimed berlin series—the most comprehensive,
  integrated collection of sampled orchestral instruments available. All berlin
  series libraries were recorded with the finest musicians, in situ, on the same
  teldex scoring stage in berlin.

  Adaptive legato reacts to the playing speed, ensuring the right sound for fast
  runs as well as for expressive melodies. Multiple attack options provide an
  added degree of control, with choices between soft attack, immediate attack,
  and accented attack.

  'blurred' articulations are recorded fast and slightly out of tune, adding new
  realism to fast passages. Tempo-synced string runs are playable runs patches
  and pre-recorded octave runs that sync automatically to your host tempo.
