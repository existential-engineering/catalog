details: >-
  Mid-side equalizer for mixing and mastering. Frequency control, gain and
  attenuation for l+r (mid) and l-r (side).


  Mid: 3 frequency controls divided into low, mid and high. 3 gain controls of
  the respective frequencies from -12db to + 12db. Mid gain gain control of the
  entire central. Mid lp low pass filter from 20khz to 60hz for mid.


  Side: 3 frequency controls divided into low, mid and high. 3 gain controls of
  the respective frequencies from -12db to + 12db. Side gain gain control of the
  entire lateral. Mid hp high pass filter from 1hz to 12khz for side.


  Medula by audiofb is a virtual effect audio plugin for macos and windows. It
  functions as a VST plugin, an audio units plugin, a VST 3 plugin and an AAX
  plugin.
specs: |-
  - Mid-side equalizer
  - VST plugin
  - Audio units plugin
  - VST 3 plugin
  - AAX plugin
  - Frequency control
  - Gain and attenuation for l+r (mid) and l-r (side)
  - 3 frequency controls (low, mid, high) for mid
  - 3 gain controls (-12db to +12db) for mid
  - Mid gain control
  - Mid lp low pass filter (20khz to 60hz)
  - 3 frequency controls (low, mid, high) for side
  - 3 gain controls (-12db to +12db) for side
  - Side gain control
  - Mid hp high pass filter (1hz to 12khz) for side
  - Macos and windows compatible
