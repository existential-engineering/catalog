description: "A sophisticated digital equalizer featuring advanced DSP
  algorithms designed to minimize digital artifacts, offering minimum phase and
  linear phase settings for mixing and mastering."
details: |-
  7 independent EQ bands
  7 band types (Bell, Low Shelf, High Shelf, Low Cut, High Cut, Bandpass, Notch)
  A/B internal states for quick setting switching
  Left-Right or Mid-Side operation modes
  Dual-channel operation (linked/unlinked)
  Two UI style options
  Minimum phase and linear phase settings
specs: |-
  - 7 independent bands
  - 7 filter types: Bell, Low Shelf, High Shelf, Low Cut, High Cut, Bandpass, Notch
  - Minimum Phase algorithm: accurate magnitude and phase matching to analog targets
  - Linear Phase algorithm: forward-backward time-reversal approach with 2x oversampling
  - A/B switching for quick comparison between two settings
  - Left-Right and Mid-Side operation modes
  - Two-channel EQ with link/unlink capability
  - Two alternative UI styles
  - Available in 32-bit and 64-bit formats
  - Mac: OSX 10.7 or higher, Intel and Apple Silicon supported
  - Linux: ARM and x86_64 (VST3 only)
