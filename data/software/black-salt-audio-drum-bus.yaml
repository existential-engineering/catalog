details: |-
  Standard mode: clean, transparent compression that tightens drum mix
  Slammed mode: aggressive, in-your-face compression for punchy drums
  One-knob compression with auto gain compensation
  Saturation (Heat control) with mode-dependent character
  Tone control for frequency balance adjustment
  Salt control for harmonic enhancement
  Built-in transient enhancer (Attack control)
  Sidechain high-pass filter for compression detection
  Dry/wet blend control

  Perpetual license, 3 activations per license, free updates and support
