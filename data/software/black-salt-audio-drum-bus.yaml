description: One ultra-simple plugin that delivers the punch, energy, and edge your drums need to stand out.
details: |-
  The secret to a competitive drum mix lies in the perfect blend of bus compression, parallel processing, saturation, and EQ. BSA Drum Bus distills decades of pro-level techniques into one ultra-simple plugin that delivers punch, energy, and glue without requiring complex plugin chains.

  STANDARD mode delivers subtle punch and glue for gluing a kit together, while SLAMMED mode delivers maximum punch and aggression, ideal for parallel bus processing. Both modes share the same interface but apply different compression and saturation character.

  The plugin combines one-knob compression, saturation with mode-dependent character, a built-in transient enhancer, a tone control (smooth/warm to bright/present), and a SALT control that enhances low-end punch, midrange attack, and high-end presence.

  A side-chain high-pass filter allows filtering out low frequencies in the detection circuit for more precise control over compression and pumping, and a dry/wet blend control sets the balance between the unprocessed signal and the Drum Bus processing.
specs: |-
  - One-knob compression for gain reduction
  - Saturation with distinct character per mode for warmth, fullness, and energy
  - Built-in transient enhancer for added attack
  - Tone control: smooth/warm to bright/present
  - SALT control for low-end punch, midrange attack, and high-end presence
  - Side-chain high-pass filter for detection circuit control
  - Dry/wet blend control
  - STANDARD and SLAMMED modes
  - DAW support: Ableton Live 11+, Bitwig 4+, Cakewalk Next by BandLab, Cubase 13+, Digital Performer 11+, FL Studio 23+, Garageband 10+, Logic Pro 10+, Pro Tools 12+, Presonus Studio One 5+, Reaper v6+
