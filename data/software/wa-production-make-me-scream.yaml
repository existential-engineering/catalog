description: Make Me Scream is a two-stage saturation and distortion plugin that
  pairs an adjustable preamp tube with a distortion module offering four
  distortion types and four timbre modes. A signal follower shapes the
  distortion envelope in line with the transients of the source material.
details: |-
  Make Me Scream is a two-stage distortion and saturation effect. An adjustable preamp tube sits at the start of the signal chain so the distortion module receives an already overdriven signal, which produces a more dramatic result than a single distortion stage. A smart signal follower shapes the distortion envelope in line with the transients of the track, keeping the musicality of the source audio.

  Four distortion types cover analog tube saturation, soft clipping saturation, regular distortion and folded sinus distortion, each producing a different character, with the active mode shown in the interface graphics. Four timbre modes change how the signal frequencies are affected. Fuzz is balanced, Wall gives a more muted tone concentrated on bass, Cliff emphasises the mid range and Make Me Scream brings out the higher frequencies.

  The Boost dial raises the gain of the incoming signal by up to 40 dB before it enters the distortion unit. Smart filter controls offer high, low and band pass modes with an adjustable cutoff, the Emphasis dial sets the level of frequency boost around that cutoff, and the Envelope Follower dial makes the plugin react to the transients of the signal for a rhythmic auto-wah feel.

  Internal oversampling runs from the default x1 up to x16, limiting unwanted non-harmonic artefacts for users with the CPU headroom. An Output slider compensates for gain boost or reduction caused by the distortion so that A and B comparisons stay accurate, and a dry and wet ratio control sets how much of the effect is applied. A live visual meter at the top right shows the signal as it is processed, with boundary lines marking where the output is pushed beyond 0 dB.

  Factory presets are tailored to specific instruments, genres and effects, covering vocals, drums, bass, full mixes and guitar amp simulations, and range from subtle saturation to heavily squashed processing.
specs: |-
  - Two-stage distortion and saturation
  - 4 distortion types: analog tube, soft clipping, regular and folded sinus
  - 4 timbre modes: Fuzz, Wall, Cliff and Make Me Scream
  - Additional tube preamp module
  - Boost dial with up to 40 dB of input gain
  - High, low and band pass filtering with cutoff and Emphasis controls
  - Musical-sounding transient follower
  - Envelope Follower dial for transient-reactive processing
  - Oversampling from x1 to x16
  - Output level compensation and dry and wet ratio control
  - Live visual metering with 0 dB boundary markers
  - Factory presets for vocals, drums, bass, full mixes and guitar amp simulation
  - Full PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
