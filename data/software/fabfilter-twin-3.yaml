description: FabFilter Twin 3 is an analog-sounding, highly modular software
  synthesizer. Available in VST, VST3, AU, CLAP, AAX and AudioSuite formats for
  Windows and macOS.
details: |-
  FabFilter Twin 3 is equipped with the best possible analog-modeled oscillators, award-winning filters and an extensive effects section. Sound design becomes a true pleasure with the completely redesigned, intuitive interface. Twin 3 comes with a library of carefully designed, quality sounds that you can use right away.

  Twin 3 is very easy to program. With its four vintage-sounding oscillators, versatile filters and built-in, high quality effects section, it is a breeze to create unique sounds. Using the new preset browser, you can type to search, tag presets and mark them as favorite, making it easy to find the sound you need.

  With all the XLFOs, EGs, XY controllers, envelope followers and MIDI sources you will ever need, Twin 3 offers practically unlimited modulation possibilities. Even the built-in effects can all be modulated. Creating new modulation connections could not be easier: just drag and drop.
specs: |-
  - Four analog-modeled oscillators with built-in drift
  - Four versatile filters with filter panning and adjustable slope and shape
  - High quality effects section with reverb, delay, chorus, phaser/flanger, drive and compression
  - Full-featured preset browser with tags, favorites and searching
  - Arpeggiator with host tempo sync, groove/legato controls and transpose
  - Endless modulation options with 16-step XLFOs, XY controllers, envelope generators, envelope followers and MIDI sources
  - Easy drag-and-drop modulation with 100-slot modulation matrix
  - Ring modulation for oscillator 1+2 and 3+4
  - 64-voice polyphony and unison
  - GPU-powered graphics acceleration
  - High Quality option enabling internal oversampling
  - Live modulation visualization
  - Polyphonic portamento
  - Undo, redo and A/B switch features
