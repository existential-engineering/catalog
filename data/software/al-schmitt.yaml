details: |-
  The Al Schmitt Signature Plugin was developed with legendary producer-engineer Al Schmitt, who recorded artists for over 7 decades including Frank Sinatra, Ray Charles, Miles Davis, Johnny Cash, Steely Dan, Barbra Streisand, Natalie Cole, Diana Krall, Celine Dion, and Paul McCartney. As a winner of 20 Grammy awards, 2 Latin Grammys, and a Trustees Grammy for Lifetime Achievement, Schmitt helped artists garner an astounding 160 gold and platinum albums.

  The Leapwing team worked with Al in analyzing his workflow, gear, and processes of the last decades, from subtle harmonic characteristics to echos, compression and EQ. This led to creating distinctive features that define his sound.

  The plugin has 6 distinct profiles: vocal, piano, bass, brass, strings, and mix (bus). Each one has different sonic characteristics and parameters based on Al's workflow and perception of each instrument. The profiles are distilled to minimal controls, conceived to allow you to get your sound instantly.

  The reverbs, or echos as Al called them, are carefully tuned reflections that represent the beautiful depth that Al was known for in his mixes. Each echo comes with 3 echo types, so you can select one of 3 tuned reflection patterns depending on the application.
specs: |-
  - 6 distinct profiles: vocal, piano, bass, brass, strings, and mix (bus)
  - Each profile individually tuned with its own parameters
  - 3 tuned echo/reverb reflection types per profile
  - Retina-designed interface with optimal workflow
  - macOS 10.13+ (M1-Native supported)
  - Windows 8, 10 (64-bit only)
