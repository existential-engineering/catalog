description: Plate reverb plugin modeled after the EMT 140, featuring extended decay
  up to infinity, a low-cut filter, and optional modulation for natural variation.
details: |-
  Little Plate recreates the classic electromechanical plate reverb sound inspired by the legendary EMT 140 hardware unit. The developers collected five original EMT 140s and meticulously analyzed their sonic characteristics to capture the warm, rich, and spacious reverb quality.

  The interface emphasizes simplicity with essential controls for Decay Time, Low Cut filtering, and optional Mod switch. Extended decay capabilities allow reverb tails that never fade, enabling creative sound design possibilities.

  A built-in low-frequency filter manages potential buildup in mixes, while subtle modulation adds natural variation to pitched instruments. The modulation feature introduces chaotic variations that thicken reverb on keyboards, guitars, and vocals.
specs: |-
  - Electromechanical reverb modeling based on EMT 140 hardware
  - Extended decay time (up to infinity)
  - Low Cut filter for bass management
  - Optional modulation for natural reverb variation
  - 25 factory presets
  - 64-bit only, sample rates 44.1 kHz to 192 kHz
  - Apple Silicon compatible
