description: >-
  Phase Plant is a modular synthesizer plugin by Kilohearts with a flexible
  signal routing architecture and multiple generator types. Its drag-and-drop
  Snapin system allows any Kilohearts effect to be loaded directly into the
  synth's signal chain.
details: |-
  Phase Plant takes a modular approach to synthesis, providing a blank canvas
  where generators, group processors, and effects can be freely combined.
  Multiple generator types are available including analog-style oscillators,
  wavetable oscillators, sample players, and noise generators.

  The three-lane architecture allows generators to be organized into
  independent groups, each with its own processing chain. Generators within
  a group are summed, then processed through the group's effect chain before
  reaching the master output.

  Kilohearts' Snapin ecosystem is deeply integrated — any Snapin effect
  (distortion, filter, EQ, delay, reverb, etc.) can be loaded directly
  into Phase Plant's effect lanes. Users with the Kilohearts subscription
  or individual Snapins gain access to an ever-growing effects library.

  The modulation system provides LFOs, envelopes, macro knobs, MSEG
  (multi-stage envelope generator), random sources, and audio followers.
  Modulation routing is visual and flexible, with per-voice or global
  options for each source.

  A powerful preset browser and extensive factory library provide
  immediate inspiration, while the open architecture encourages deep
  sound design from the ground up.
specs: |-
  - Modular synthesis architecture
  - Multiple generator types (analog, wavetable, sample, noise)
  - Three-lane group processing system
  - Kilohearts Snapin integration
  - LFOs, envelopes, MSEG, macro knobs
  - Audio follower and random modulation sources
  - Per-voice and global modulation modes
  - Up to 8x oversampling
  - Polyphonic with unison
  - MPE support
  - Preset browser with categories
  - VST3, AU, AAX formats
  - macOS and Windows
