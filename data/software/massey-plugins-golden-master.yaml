description: "A soft-clipping plugin for lifting the loudness of masters without
  damaging the original sense of dynamics. Features a speed control that
  transforms it from a soft-clipper into a more traditional analog-like limiter,
  and a ratio control for broader creative palette. Most useful and transparent
  on percussive-centric music where the highest peaks tend to be drums."
details: |-
  Input Gain
  Threshold
  Speed
  Ratio
  Output Meter

  Soft clipping for transparent loudness increase
  Speed control transforms from soft-clipper to analog-like limiter
  Ratio control for compressor-like behavior
  Shift-click to link input gain and threshold controls
  Shift-click output meter to auto-calibrate

  Session-restore, automation, preset support, mono support, text-editable controls
