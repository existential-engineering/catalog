details: |-
  80s Arcade Sounds give you that particular sound and emulate through sound design the resonance of arcade cabinets as well as the instability of analog circuitry.

  During the 80s, arcade fever was strong and the video game industry was making millions. At that time, many games shared similar sound chips to generate their unique sounds, and it's yamaha that would provide the audio technology behind most of sega, capcom and konami's arcade games.

  The typical stereo effects heard in arcade games and the distance of standing in front of the arcade cabinet was also re-created.
