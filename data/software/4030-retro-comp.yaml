details: |-
  The 4030 retro compressor is a unique dynamic range control topology. It is coupled with a wet/dry mix control to balance compressed and uncompressed signals. An active attack and release design allows aggressive compression settings with minimal artifact generation.

  All retro plug-ins use a mcdsp designed output stage that puts a unique transformer-like touch on the audio signal. Retro plug-ins are a line of 'classics' that can live up to their own name without emulating something else.

  The signal dependent 'smarts' in the 4030 retro compressor make it an ideal choice for vocals. The ratio control is continuous, giving you that 'just right' compression ratio.

  The mix control of the 4030 retro compressor really shines when used on a drum buss.

  The 4030 retro is very capable of delivering a good sound using its internal signal dependent 'smarts'. Its utility across a diverse range of input signal should not be underestimated.
specs: |-
  - Unique dynamic range control topology
  - Wet/dry mix control
  - Active attack and release design
  - McDSP designed output stage
  - Signal dependent compression
  - Continuous ratio control
  - Up to 36 dB of signal gain
  - Unique output stage topology
  - Double precision processing
  - Zero latency
  - Mono and stereo versions
