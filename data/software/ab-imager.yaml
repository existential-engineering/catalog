details: >-
  'ab imager' is a powerful plugin that helps to control the dominance, size and
  even upscale any signal to 3rd order ambisonics. With 'ab imager' you can:
  make any signal wider, taller, longer, narrower, shorter, lower, bigger, or
  smaller. Move the sonic weight of any signal towards any given angle, thus
  shifting its focus whilst keeping its dimensional features - everything
  happens in 3rd order ambisonics, even if your source signal is not.


  Upscale any 1st or 2nd order ambisonics automatically to 3rd order, thus
  increasing its clarity, definition, and spatial awareness. 'ab imager' is
  compatible with any mono, stereo, 1st, 2nd or 3rd order ambisonics signals!
  Additionally, you can work with any quadraphonic, 5.1, 7.1, 7.1.2, or 7.1.4
  signals if you combine it with our 'ab encoder'.


  'ab imager' is perfect for creating multilayer three-dimensional mixes, in
  which some elements are larger and more sparse, others closer or smaller,
  helping you shape your three-dimensional field your way.


  The upscaler is fast, light (perfect for small buffer sizes for dolby atmos
  projects), and completely automatic. Meaning that if it detects a signal that
  needs upscaling, it will automatically kick-in.


  An 'express' version of 'ab imager' is also available in case you're
  interested only in the dominance and size control! The express version doesn't
  include the upscaling engine.
