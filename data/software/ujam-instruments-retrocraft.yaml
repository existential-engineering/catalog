description: RETROCRAFT is a retro effects plugin that transforms piano chords,
  vocal loops, or drum beats into beautifully imperfect tracks with character.
details: |-
  RETROCRAFT pairs analog amps, tape machines, vinyl players and speaker simulations with six modern FX modules for sound designers and producers. It combines the capabilities of industry-standard retro plugins with modern multi-effects for any kind of improvement, from subtle analog character to complex sound design.

  The effects chain starts with three vintage stages: Amplifier (tube, transistor), Player (cassette, vinyl) and Speaker (megaphone, telephone). Each stage adds its own drive, noise and character, and together they create a texture machine that turns any bland audio or MIDI clip into a vintage-vibe recording.

  Six additional effect modules follow. The Lo-Fi module adds digital distortion, crunch or ring modulation. Instability supplies the vibrato of old tape machines and record players. Modulation creates movement and stereo width through chorus, flanger and phaser. Delay and Reverb give depth and size across six types each. Chop offers six glitch variants that bring groove and rhythm back into the signal.

  Over 150 presets ship in categories like "Aging", "Vocals", "Retro Gear" and "Glitchy", and the Surprise Dice generates a new preset on the fly, with an undo button to travel back.
