details: |-
  1973 is a tribute to the neve 1073, often considered to be one of the best large-format console channel modules ever made.

  The high frequency knob is centered around 12khz and you can apply a lot of boost on it without ever sounding harsh, up to +20db.

  The plug includes an oversampling switch that basically doubles the sample rate being used to help reduce aliasing.

  The controls are simple and straightforward with high frequency boost and cut, low boost and cut, high pass filter, and mid frequency boost and cut capabilities.

  The demo plug is identical to the licensed version except for a ten second nag screen when first opened, with no drop-outs, noise bursts, or other limitations.
