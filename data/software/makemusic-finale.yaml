description: Finale was MakeMusic's music notation software for macOS and
  Windows, developed for over 35 years and discontinued in August 2024, with v27
  as the final release.
details: |-
  Finale was a scorewriter for macOS and Windows used to compose, arrange,
  engrave and publish notated music, from single parts to full scores. MakeMusic
  developed it for more than 35 years and calls it the gold standard for music
  notation, and it was sold alongside a family of smaller tools: Finale
  PrintMusic, Finale Songwriter and Finale Notepad.

  MakeMusic announced on 26 August 2024 that it was sunsetting Finale. There would
  be no further updates to Finale or its associated tools, and Finale could no
  longer be bought or upgraded from the MakeMusic eStore. The company pointed to
  the difficulty of maintaining the codebase, noting that technology stacks change
  and operating systems evolve while Finale's millions of lines of code add up.

  Existing installations continue to run, subject to operating system
  compatibility. Technical support for Finale v27.4.1 ran until 26 August 2025.
  MakeMusic partnered with Steinberg to offer Finale and PrintMusic owners a
  crossgrade to Dorico Pro, which the Finale eStore stopped selling on 23 July
  2026.

  The last release, Finale v27, was tested against macOS 12 Monterey and Windows
  11, ran on Apple Silicon Macs through Rosetta 2 rather than natively, and
  exported MusicXML 4.0. Later maintenance releases added macOS Sonoma
  compatibility. macOS Sequoia is not compatible with Finale.
specs: |-
  - Composing, arranging, engraving and publishing of notated scores and parts
  - MusicXML 4.0 export (v27)
  - MIDI import and export
  - Score playback with bundled sounds
  - Companion products: PrintMusic, Songwriter and the free Notepad
  - Final release Finale v27, supported through 26 August 2025
  - Runs on Apple Silicon through Rosetta 2, not natively
  - Not compatible with macOS Sequoia or later
