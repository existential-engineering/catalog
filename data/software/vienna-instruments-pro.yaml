description: Vienna Instruments Pro is the advanced sample player by Vienna
  Symphonic Library, featuring multi-instrument stacking, an auto-playback
  pattern sequencer, time stretching, microtuning scales, and super-fast loading
  times.
details: |-
  Vienna Instruments Pro is a software sample player based on the Vienna Instruments audio engine. Up to eight instruments and articulations can be stacked in a single cell of a matrix, allowing for individual adjustments of volume and panning in the rack mixer, making it easy to create powerful multi-instruments in a single instance that even allow for polyphonic legato-playing.

  An internal auto-playback and pattern sequencer triggers rhythmic patterns, arpeggios, runs and fully orchestrated arrangements in real-time, perfectly synced to the host tempo. Sample lengths of fixed performances, such as runs, fast repetitions or arpeggios can be matched to the required tempo with the time stretching tool.

  Vienna Instruments Pro features super-fast loading times, a browser with a search function, built-in reverb and equalizer, and a user interface with basic and advanced views. Users with a special interest in ancient or non-western music are presented with microtuning scales such as just intonation, Werckmeister or several Arabic, Turkish or Chinese scales, with an option for creating custom scales.
specs: |-
  - Up to 8 instruments stacked per matrix cell
  - Rack mixer with volume and panning per instrument
  - Polyphonic legato playing
  - Auto-playback and pattern sequencer
  - Time stretching tool
  - Microtuning scales (just intonation, Werckmeister, Arabic, Turkish, Chinese)
  - Custom scale creation
  - Built-in reverb and equalizer
  - Super-fast loading times
  - Browser with search function
  - Basic and advanced UI views
  - VST plugin
  - VST3 plugin
  - AU plugin (macOS)
  - AAX plugin
