description: An analog bucket-brigade stereo chorus pedal emulation from the VPB virtual pedal board collection, faithfully recreating the lush, warm modulation of the DOD FX65 Stereo Chorus via MN3007 BBD chip emulation. Delivers slow shimmer through fast vibrato effects with independent Delay, Speed, Depth, and Level controls.
details: |-
  Emulates the DOD FX65 Stereo Chorus pedal via MN3007 BBD (bucket brigade device) chip circuit modeling. Part of the VPB-Bundle virtual pedal board collection alongside El-Germano, Big Sur, Gate-230, and Octafish. Zero-latency operation for live use. Optional oversampling (32 samples latency when enabled). Supports 32-bit and 64-bit operation. Adjustable GUI size.
specs: |-
  Controls: Delay (pre-delay time), Speed (LFO rate), Depth (modulation amount), Level (output gain). Latency: zero-latency (oversampling adds 32 samples). macOS 10.9+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+, 2 GHz Intel CPU+, 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX. Copy protection: serial number.
