description: A transparent equalizer plugin employing a new method of equalizer
  design to avoid the distortion and coloring typical of conventional digital
  equalizers.
details: |-
  tranQuilizr is an equalizer plugin that emphasizes transparent sound through a
  novel approach to digital equalizer design. The plugin aims to avoid the
  distortion and coloring that can occur with conventional digital EQ
  implementations.

  The plugin provides six equalizer bands plus dedicated Lo-Cut and Hi-Cut
  filters. Each band offers flexible channel management with independent Stereo,
  Left, Right, Mid, and Side processing options. Three equalizer types provide
  different sonic characters.

  Frequency range extends from 20Hz to 30kHz for center frequencies, with gain
  of plus or minus 24dB and bandwidth adjustable from 0.05 to 10 octaves.
  Automatic Gain Compensation helps maintain consistent perceived loudness
  during adjustments.

  A built-in spectrum analyzer includes an Ear-Only mode for focused listening.
  The internal sample rate can reach up to 1,536kHz, and the plugin operates at
  just 64 samples of latency with a mouse-friendly graphical interface.
specs: |-
  - Six EQ bands plus Lo-/Hi-Cut filters
  - Per-band Stereo/Left/Right/Mid/Side channel selection
  - Three equalizer types with different characters
  - Frequency range: 20Hz to 30kHz
  - Gain: +/-24dB, Bandwidth: 0.05-10 octaves
  - Automatic Gain Compensation
  - Spectrum analyzer with Ear-Only mode
  - Up to 1,536kHz internal sample rate
  - 64-sample latency
  - Sample rates: 44.1kHz to 384kHz
