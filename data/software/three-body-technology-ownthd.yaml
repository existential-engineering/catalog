  - Windows: Windows 7 or later
  - CPU: Intel or AMD with SSE 4.1 instruction set
  - Apple Silicon: native support not available
  - RAM: 4 GB minimum
  - Disk space: 100 MB
  - Windows formats: 32-/64-bit VST2, 64-bit AAX
  - Mac formats: 64-bit VST2, Audio Unit (AU), AAX
