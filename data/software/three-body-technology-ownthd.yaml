description: Audio processor for customizing harmonic distortion. Simulates nine vintage equipment types plus three ideal circuit modules (solid-state, tube, tape) with adjustable drive, bias, feedback, depth, and sweet spot parameters.
details:
  - 9 types of classic equipment simulation targeting different genres
  - Focuses on nonlinear behavior simulation rather than exact equipment emulation
  - 4 customizable drive knobs for adjusting harmonic color
  - Adjustable Bias, Feedback, and Depth parameters
  - Per-equipment 'sweet spot' frequency characteristic adjustment
  - "3 ideal circuit module simulations: Solid-State, Tube, and Tape"
  - Mix Solid-State, Tube, and Tape simulations in series by proportion
  - "Named equipment types include: 2A, A8, N-Pre, VOC, S-Pre, 4K (referenced in demos)"
  - Free demo available with no time limit (no registration required; saving/loading disabled, 30-second mute every 30s)
specs: |-
