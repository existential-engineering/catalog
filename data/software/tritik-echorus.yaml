description: "A chorus effect plugin featuring four distinct algorithms, an
  echo/delay section, and analog-modeled filters. Delivers one of the most
  analog sounding digital effects available, suitable for diverse sound sources
  and creative applications."
details: |-
  4 Chorus Modes: Retro, Multi, Detune, Random. Chorus controls for Rate, Depth, Width. Echo section with bypass switch, delay time, feedback gain. High-pass and low-pass analog filters. Mix and gain output controls. Resizable Retina/Hi-DPI interface. A/B switching. 50+ presets. Multi-language tooltips (English, French, Portuguese, Spanish).
specs: |-
  Version 1.1.0. macOS 10.9 or later. Windows 7 or later. Demo available with periodic audio muting.
