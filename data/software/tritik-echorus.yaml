description: Echorus is a chorus plugin built around 4 original chorus algorithms, an Echo section and a pair of analog-modeled high-pass and low-pass filters. The four modes cover everything from subtle thickening to experimental, detuned and randomised chorusing.
details: |-
  Echorus is built around 4 original chorus algorithms, an Echo section, and a couple of analog-modeled high-pass and low-pass filters.

  The 4 chorus modes (retro, multi, detune, random) provide a wide range of chorusing effects. They make Echorus versatile and suitable for any type of sound sources, and whether you want a subtle, thick, dark, cheesy, or more experimental chorus sound, Echorus has got you covered.

  Echorus also has an echo section including delay time and feedback gain controls. This allows you to re-inject the output signal within the chorus, expanding further more the possibilities. You can use this feedback loop with some short delay times to strengthen the chorus effect, get some flanging tones or create pitched resonances.

  Longer delay lines bring more classical delay effects, but with the particularity that your sound will pass through the chorus processor at each echo. Set up a sensible echo delay time and increase the feedback gain, and you will end up with big washy ambiences. Adjust it to more moderate settings, and you have the perfect tool for enhancing and enriching pads, keys and guitars.

  The interface is clean, fully resizable and optimised for Retina / Hi Res displays, with an A/B switch and tooltips and preferences in English, French, Portuguese and Spanish. Over 50 presets ship with the plugin through a file-based preset system, accessible from the menu or the browser, with a presets freezer for safe recall and clipboard copy/paste of the full plugin state.
specs: |-
  - 4 chorus modes: Retro, Multi, Detune, Random
  - Chorus controls: Rate, Depth, Width
  - Echo section with bypass switch, delay time and feedback gain
  - Analog-modeled highpass and lowpass output filters
  - Mix and output gain controls
  - Fully resizable interface, optimised for Retina / Hi Res displays
  - A/B comparison switch
  - Tooltips and preferences in English, French, Portuguese and Spanish
  - 50+ factory presets
  - File-based preset system, accessible via menu or browser
  - Presets 'freezer' for safe recall
  - Copy/paste plugin state via the system clipboard
  - Requirements: Windows 7 or later, macOS 10.9 or later
  - Native Apple Silicon support (since 1.1.0)
