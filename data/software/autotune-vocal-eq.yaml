details: |-
  Auto-tune vocal EQ now includes a 1 year subscription to auto-tune producer
  bundle. Equalize your vocal tracks with the power of auto-tune pitch
  technology.

  Pitch metering - seeing is equalizing: watch a vocalist's pitch move across
  the frequency spectrum in real-time to visualize range and thresholds.

  Pitch tracking - focus to fix: lock an eq band to a vocalist's pitch to focus
  on the fundamental pitch or harmonics.

  Vocal learning - a smarter voice: automatically determine input type and
  highlight the average vocal range (alto, tenor, soprano) for a quick start to
  eqing.

  Purpose-built to work seamlessly with auto-tune unlimited, auto-tune vocal eq
  brings a new level of precision control to every track.
specs: |-
  - Pitch metering
