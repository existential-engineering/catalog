description: Phase Motion 2 is a stereo phaser plugin featuring up to 32 phasing
  stages, with the rate adjustable in Hertz or synced to the host tempo.
details: |-
  Phase Motion 2 is a stereo phaser plugin featuring up to 32 phasing stages. The Rate can be adjusted in Hertz or it can be synced to the host/DAW tempo. You can choose 6 waveforms (sine, triangle, ramp up, ramp down, square, random) to modulate the phase, and you can tweak Depth and Feedback to get a classic vintage phaser sound or extreme digital modulations.

  Phase Motion 2 is a stereo phaser, meaning you can have different settings on each channel. Essentially it is like having two phasers, one for the Left and one for the Right channel. By clicking on the L or R button, the parameters will only control the selected channel. Instead, when the Link icon is selected, both L and R parameters will be affected.

  Tips to make a thicker stereo phaser sound: have the same settings on both L and R channel, but slightly change one or two parameters on one channel only. Have a positive amount of Feedback on one channel, and a negative amount on the other channel. Use the Invert button only on one channel.

  Phase Motion 2 is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP).
specs: |-
