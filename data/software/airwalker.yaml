details: |-
  Airwalker is a beautiful sounding analogue modelled reverb based on hand built classic processors. Sometimes with audio plugins less is most definitely more, you don't want to get bogged down with endless amounts of controls and spend all of your time experimenting and not actually creating the sounds you need.

  Our airwalker analogue modelled reverb addresses this issue by only having the essential controls at your fingertips. Airwalker is a high quality reverb plugin with a fantastic analogue sound.

  This sound can be shaped further using the eq module which was added in version 3 of the plugin. Airwalker really shines due to its ease, and the speed in which fantastic sounds can be created.

  Presets designed by jason white and tjo (terry oxby from boomtic records). Professional gui design.

  Minimal system instruments plugins run on windows based pcs using a suitable VST host or DAW. Our plugins have been fully tested within ableton live, adobe audition, cakewalk sonar, fl studio, energy xt, presonus studio one, renoise, and cubase.
specs: |-
  - Analogue modelled reverb module
  - Room control
  - Damping control
  - Width control
  - Drive control
  - Mix control
  - Full 3 band EQ module
  - High pass filter
  - Low pass filter
  - Windows compatibility
  - Very low CPU usage
