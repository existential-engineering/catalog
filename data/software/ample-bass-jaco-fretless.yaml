description: Ample bass jf is based on a fender custom shop jaco pastorius relic
  fretless jazz bass, offering an extensive range of realistic articulation.
details: |-
  Ample bass jf is based on a fender custom shop jaco pastorius relic fretless jazz bass, offering an extensive range of realistic articulations and an all-new MIDI composition system. It is an essential electric bass instrument for modern music production.

  Polyphonic legato and slide smoother: enables realistic legato across any interval and speed. A slide system specifically designed for fretless instruments.

  Riffer 4: a MIDI editor tailored for plucked string instruments with dual view modes offering seamless real-time switching between piano roll and guitar tab views, a first of its kind, providing two perspectives for reviewing and editing compositions.

  String visualization system: strings are now visualized within the piano roll, enabling MIDI writing that adheres to authentic plucked instrument techniques by automatically preventing polyphony on the same string and intelligently assigning fingering.

  Tab reader 4: supports guitar pro files from gp3 to guitar pro 8. Capable of importing entire bass tracks into riffer with full retention of fingering, articulations, and performance data.
