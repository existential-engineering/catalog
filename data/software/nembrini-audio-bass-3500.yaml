  distinctive hybrid preamplifier design of the original amplifier.
details: |-
  Nembrini Audio Bass 3500 is modeled after the legendary Hartke HA3500 bass amplifier, capturing the powerful low end, fast transient response, and distinctive hybrid preamplifier design of the original, with the unmistakable punch, definition, and flexibility of a legendary hybrid bass amplifier.

  The hybrid preamp lets the Tube and Solid State stages be blended independently, combining harmonic warmth with clarity, definition and punch. A built-in compressor controls peaks, evens out dynamics and adds weight and consistency to the bass signal, with an activity LED giving visual feedback for compression and limiting.

  Tone shaping runs deep. A ten-band graphic equalizer provides plus or minus 15 dB at 30 Hz, 64 Hz, 125 Hz, 250 Hz, 500 Hz, 1 kHz, 2 kHz, 3 kHz, 5 kHz and 8 kHz, while broad Low Pass and High Pass contour controls shape the low-frequency region around 100 Hz and the upper-frequency region around 10 kHz. After the amplifier, a six-band parametric equalizer offers multiple filter types with adjustable frequency, gain and Q.

  Four bass-focused pre-amplifier stomp effects are included: Noise Gate, Envelope Filter, Octaver and Modern Tubes Drive, covering everything from clean control to synth-style lows and warm saturation. Every pedal is draggable and reorderable for complete signal-chain customization, as are the post-amplifier effects, which comprise a Studio Compressor, a bass-optimized Modulation and an Analog Delay.

  The recording chain offers four bass cabinet emulations and four microphone models with adjustable microphone positioning and tweeter controls, parallel D.I. processing and three ambience environments. A dual impulse loader takes up to two third-party impulse responses with level, pan, phase, Solo and Mute controls per slot. Cabinet Bypass removes the complete cabinet, recording chain and impulse-loader section for use with external cabinet processors, IR loaders, or a real power amplifier and bass speaker system.
specs: |-
  - Modeled after the Hartke HA3500 bass amplifier
  - Hybrid preamp with independently blendable Tube and Solid State stages
  - Built-in compressor with activity LED for compression and limiting feedback
  - Ten-band graphic equalizer, plus or minus 15 dB at 30 Hz, 64 Hz, 125 Hz, 250 Hz, 500 Hz, 1 kHz, 2 kHz, 3 kHz, 5 kHz and 8 kHz
  - Contour controls: broad Low Pass around 100 Hz and High Pass around 10 kHz
  - Pre-amplifier stomp effects: Noise Gate, Envelope Filter, Octaver, Modern Tubes Drive
  - All stomp effects draggable and reorderable
  - 4 bass cabinet emulations
  - 4 microphone models with adjustable positioning and tweeter controls
  - Parallel D.I. processing and three ambience environments
  - Dual impulse loader for up to 2 third-party IRs with level, pan, phase, Solo and Mute per slot
  - Six-band parametric equalizer with multiple filter types and adjustable frequency, gain and Q
  - Post-amplifier effects: Studio Compressor, bass-optimized Modulation, Analog Delay, each draggable
  - Cabinet Bypass for use with external cabinet processors, IR loaders or a real power amp and bass speaker system
  - iOS version available for iPhone and iPad
  - Plugin formats: VST2, VST3, AAX or AudioUnits compatible host
  - Intel compatible or Apple Silicon CPU
  - 1GB RAM
  - Mac OS 10.13 or newer
  - Windows 7 or newer
  - 64-bit DAW required
