description: Instant k-pop hits beats like your fave idols get your party on
  idol puts the bright and hyper-processed sound of k-pop beats in your hands.
details: |-
  Idol puts the bright and hyper-processed sound of k-pop beats in your hands.
  Keep the good feels coming with clean and polished drum samples, making beats
  just like the ones in countless chart-topping korean pop songs.

  K-pop is a very bright, polished genre, with thumping kicks and snares that
  pop. Its high end glisten and tight low end are carefully compressed to hit
  hard using influences from hip hop, r&b, american/euro pop and traditional
  korean instruments.

  Take the precision and hyper-compression of pop music and dial it up to 11.
  Carefully trim the tail of every sample and keep the releases tight. Editing
  samples to get the perfect k-pop sound can take hours with idol, everything's
  already done for you.

  K-pop is influenced by rhythms from around the world, so it's impossible to
  define it by only one sound. That's why idol gives you 4-to-the-floor kicks,
  chaotic breakbeats, rolled trap hi hats and more all with the same
  larger-than-life production style.

  The proprietary juice control punches up the lows and highs with multiband
  compression and eq for a clean, dramatic sound, with a gentle stereo spread to
  neatly tie everything together and add some excitement.
specs: |-
  - 10 drum kits with 16 drum instruments each
  - 20 styles with 23 ready-made patterns each (460 total patterns)
  - 12 mix settings
  - Juice control with multiband compression and EQ
  - MIDI drag and drop
  - DAW tempo sync
  - Stereo spread
  - On-screen keyboard
  - Windows 7 or later 64-bit
  - macOS x 10.14 or later 64-bit
  - 4 GB of RAM
  - 0.17 GB of free disk space
  - 1280x768px display
  - Internet connection required
