description: Eden WT-800 is a fully featured bass amp sim to cover every need,
  both vintage and modern. Get your best tones from your basses with this bass
  amp plugin.
details: |-
  There are a handful of classic names in bass guitar amplification, but few have the combination of pedigree and sheer modern versatility that comes with the Eden WT-800.

  Featuring a full range of tools from compression and five-band EQ, to easy bi-amping and an 'enhance' knob for quick and effective scooping of mid-frequencies, the 'World Tour' amp really can do it all, around the globe.

  This product supports Extended Features. VU meters, Bakelite knobs, and analog quirks are lovable, but modern precision and workflow still matter. The answer? Softube Extended Features. Easy-access panels with the innovations you need close at hand.
specs: |-
  - Fully-featured bass amp simulation to cover every need, vintage and modern
  - Choice of four classic microphones per cabinet, expertly selected and placed
  - Faithful modelling of class-leading, top-quality equipment
  - Compression and five-band EQ
  - Easy bi-amping
  - 'Enhance' knob for quick and effective scooping of mid-frequencies
  - Supports Softube Extended Features
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Softube account required
  - iLok account required (no physical iLok required)
  - Computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Internet access (for downloading installers and managing licenses)
  - Three activations
  - 20-day trial
  - 14-day returns
