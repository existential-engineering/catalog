details: |-
  2016 stereo room features the legendary reverb algorithm of eventide's sp2016. Long used as an essential reverb for mixing hit records, the eventide sp2016, while long discontinued, is still in use in places like ocean way.

  Now, the top favorite reverb algorithm from this sought after hardware box is now available for pro tools AAX, VST, and AU.

  Features: natural and distinctive; unique sound. Simple, intuitive parametric controls. Complex early reflections. Smooth decay tail. Novel position control for precise room placement.

  Decay control sets the reverb time. Predelay adds a delay before the reverb. Diffusion alters the character of the space. Eq block: corner frequency and gain controls. Input gain control for precise level matching. Kill button for quick effect audition.
