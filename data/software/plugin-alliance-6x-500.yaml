  recordings.
details: |-
  The six x five hundred is a mono/stereo channel transformer coupled
  preamplifier and passive 2 band equalizer. The preamp is an all discrete
  design based upon our hybrid amplifier.

  The equalizer is our take on the magical classic pultec design. It's got 15db
  boost of smooth silky high end and the most punchy low end you can get.

  The 6x-500 plugin is a direct evolution of our hardware. It adds the most
  requested features from our users: high and lowpass filters, variable slopes,
  and wide distortion range.

  The sound is true to the hardware.
