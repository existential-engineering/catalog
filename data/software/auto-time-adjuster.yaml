details: |-
  Auto Time Adjuster (ata) is an RTAS plug-in for Pro Tools le/m-powered,
  designed to ease your workflow when using plug-ins that generate significant
  latency.

  Auto time adjuster uses audio pinging to automatically calculate and
  compensate for insert latency on your audio and aux tracks with the click of a
  button.

  When you add or remove a plug-in on a track all you need to do is click the
  ping button on the master ata to calculate all current latency and synchronise
  your tracks, even when using hardware inserts.

  As ata measures the actual latency of each track in your mix it provides the
  tightest timing possible, native adc relies on values reported by the plug-ins
  themselves, and they don't always report the actual delay they are adding to
  your tracks.
specs: |-
  - RTAS plug-in
  - Pro Tools le/m-powered compatibility
  - Audio pinging technology
  - Automatic latency calculation and compensation
  - Hardware inserts support
  - Master control with ping button
