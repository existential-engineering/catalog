details: |-
  BitTest is a little bitcrusher plug-in. It converts your data to 8 bits, then
  you can turn the bits off (the top row) or invert them (the bottom row)
  individually.

  You can individually flip and invert the bits. This is great for lofi mayhem,
  and quite unique.
specs: |-
  - 8-bit conversion
  - Individual bit manipulation
  - Bit on/off toggle
  - Bit inversion
  - macOS compatibility
  - Windows compatibility
