description: "A virtual synthesizer modeling the legendary Minimoog Model D.
  Retains the original architecture while adding extensive modern features
  including X-Modifier technology enabling modulation of nearly every parameter.
  Features three oscillators, a 24dB ladder filter, 800+ presets, fully-scalable
  UI with three skins, and monophonic, polyphonic, legato, and unison modes."
details: |-
  800+

  Monophonic, polyphonic, legato, and unison modes

  3 VCOs

  24dB ladder filter with bass-preserving alternative

  Reverb, Stereo Delay

  Fully-scalable with three skins (Black, Light wood, Dark wood)

  X-Modifier technology (X-LFO and X-ADSR), 4 programmable Macros

  PWM for VCO1, programmable Aftertouch, expanded Velocity, Vintage control
