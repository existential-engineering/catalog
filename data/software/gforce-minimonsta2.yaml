description: A virtual synthesizer modeling the legendary Minimoog Model D.
  Retains the original architecture while adding extensive modern features
  including X-Modifier technology enabling modulation of nearly every parameter.
  Features three oscillators, a 24dB ladder filter, 800+ presets, fully-scalable
  UI with three skins, and monophonic, polyphonic, legato, and unison modes.
details: |-
  When we first released it, the original Minimonsta gained heavy praise from fans and critics alike for providing an extraordinarily accurate sonic replication of the legendary Model D. But it went much further, augmenting the simplicity of the original design with a host of new features that allowed the deeply familiar tones to be pushed into previously unexplored sonic realms. Minimonsta2 retains the fundamental architecture at the heart of its predecessor, but builds on this in ways that extend its sonic and musical capabilities.

  Minimonsta2 features a new fully resizable UI, an improved audio engine, a powerful new Preset Browser, over 300 new presets, a new Reverb effect, a Vintage control for adding subtle analogue imperfections, four programmable Macros, selectable 4-stage envelopes, an alternative bass-preserving ladder filter, PWM for OSC1 and much more.

  True to the original Model D, the heart of Minimonsta2 provides the full original feature set with precise waveforms, a beautifully accurate resonant filter, snappy ADS envelope generators and the wonderful Mini loop-feedback function. Using just these classic parameters, Minimonsta2 has a huge tonal palette that ranges from fat to fierce, and searing to sizzling.

  Using our unique X-Modifier technology, the scope of sound modulation possibilities is immense. An intuitive X-LFO and X-ADSR section provides you with the ability to create extensive modulations of almost every parameter, allowing you to create hugely complex, yet musical, sounds. First click on the knob for the synth parameter that you wish to modulate, then apply an X-LFO amount via the X-LFO Amp slider and/or an X-ADSR amount via the Amp knob.

  Minimonsta2 features a new, highly flexible preset browser, giving you the power to organise your sounds in a way that suits your workflow. With extensive tagging, sorting and search possibilities, it's quick and easy to find the presets you want. More than 300 brand new production-ready presets are included, and you can also access 500 legacy presets, which have all been categorised and tagged for easy navigation, for a total of over 800 presets.
