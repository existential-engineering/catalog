description: A virtual synthesizer modeling the legendary Minimoog Model D. Retains the original architecture while adding extensive modern features including X-Modifier technology enabling modulation of nearly every parameter. Features three oscillators, a 24dB ladder filter, 800+ presets, fully-scalable UI with three skins, and monophonic, polyphonic, legato, and unison modes.
details: |-
  Minimonsta2 delivers extraordinarily accurate sonic replication of the legendary Moog Model D synthesizer, combining deeply familiar tones with expanded modern capabilities.

  The instrument features a fully scalable UI with three skins (Black, Light wood, and Dark wood), giving users the flexibility to fit Minimonsta2 into any workflow or display size. An improved audio engine powers over 800 presets — including 300+ new additions — accessible through a powerful Preset Browser with tagging and categorization.

  Minimonsta2 adds a host of enhancements over its predecessor: an alternative bass-preserving ladder filter algorithm, selectable 3-stage or 4-stage envelopes, a Matrix Reverb effect, a Vintage knob for authentic analog imperfections, four programmable Macros, and programmable Aftertouch with expanded Velocity controls. Pulse Width Control & Modulation for VCO1 is also included alongside the X-LFO and X-ADSR modulation technologies, allowing modulation of nearly any parameter.

  Playback modes include monophonic, polyphonic, legato, and unison trigger modes, with pan spread for rich stereo sounds.
