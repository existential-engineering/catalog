description: >-
  Serum is an advanced wavetable synthesizer by Xfer Records with a visual,
  high-quality workflow. Its drag-and-drop modulation system, real-time
  wavetable editing, and pristine oscillator engine have made it one of the
  most widely used synthesizer plugins in modern music production.
details: |-
  Serum combines a high-quality wavetable engine with an intuitive visual
  interface that displays wavetable shapes, modulation routings, and filter
  responses in real time. Two oscillators with up to 256 wavetable frames
  each can morph smoothly between frames using multiple interpolation modes.

  The wavetable editor allows creation of custom wavetables from scratch,
  imported audio, or mathematical formulas. Processing functions include
  normalize, fade, crossfade, morph, and FFT-based operations. Users can
  also import single-cycle waveforms or draw directly in the editor.

  A dedicated noise oscillator with its own filter provides layering of
  noise textures. The sub oscillator adds fundamental weight with sine,
  triangle, saw, square, or custom waveforms.

  The modulation system uses a drag-and-drop paradigm — any modulation
  source (LFO, envelope, macro, velocity, etc.) can be dragged onto any
  destination with visual feedback showing modulation depth. Four LFOs
  with custom shapes and three envelopes provide extensive modulation.

  Ten built-in effects include reverb, delay, distortion, compressor,
  flanger, phaser, chorus, EQ, filter, and hyper/dimension. The filter
  section offers a wide selection of filter types including multi-mode,
  formant, comb, and analog-modeled varieties.
specs: |-
  - 2 wavetable oscillators (up to 256 frames each)
  - Sub oscillator with custom waveforms
  - Noise oscillator with dedicated filter
  - Real-time wavetable editing and creation
  - Drag-and-drop modulation routing
  - 4 LFOs with custom shapes
  - 3 DAHDSR envelopes
  - 4 macro controls
  - 10 built-in effects (series/parallel routing)
  - Multi-mode filter section (analog-modeled, comb, formant, etc.)
  - Oversampling up to 4x
  - Global unison with up to 16 voices
  - Built-in wavetable editor with FFT tools
  - MIDI learn for all parameters
  - Preset browser with categories and favorites
