details: |-
  Adonis is a va / AM / FM synthesizer featuring 2x32 notes polyphonic
  capability with 2 independent voices. Each voice includes 4 waveforms, 57
  voice-structures, and graphical amplitude envelopes up to 32 stages with
  analog drift per voice.

  The synthesizer includes 4 graphical mod-envelopes up to 32 stages, 4 lfos
  with host bpm synchronization, and 2 multi-mode serial / parallel filters for
  comprehensive sound shaping.

  A powerful 32 steps graphical sequencer with host sync capability, semi-tones
  setting, and coarse knobs provides sequencing and automation options. The
  synth also features per-voice arpegiators for additional modulation control.

  Multi-effects processing includes phaser-flanger, chorus, delay, 3-band active
  resonators, and static hpf. Individual outputs and a comprehensive
  modulation-matrix with voices-modulation matrix enable deep routing options.

  MIDI learn functionality allows mapping of controls to external MIDI devices.
  The gui features a clean brushed metallic surface with green digits in the
  matrix, with logically organized pages for intuitive navigation.
