details: >-
  As - pulse eq, inspired by the classic and famous "holy grail" blue hardware
  rack unit eq from the mid-50's brings balanced analog curves to your audio.


  The plug-in comes with an array of presets specifically designed for various
  instruments as your starting point.


  Utilize them in your mixes, tweak, or create your own.


  Analog studio rack brought you a "modular rack" that provides hot-swappable
  500 series style eq's, compressors, gate, exciter and a tube driven pre-amp;
  the perfect all-in-one channel strip. The rack has now been split into its
  individual modules for separate and bundle purchase.
