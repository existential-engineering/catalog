description: "An extended emulation of the talkback limiters built into British recording consoles, associated with 1980s drum sounds."
details: |-
  The Talkback Limiter is a fast, heavily compressing limiter modelled on the console circuit, with additional controls added beyond those of the original.

  The talkback limiter's use as a drum processor was discovered by accident in 1979 at a studio in England. It was subsequently adopted by other artists and producers and became a common drum and snare treatment through the 1980s.

  It remains in use as a drum processor, adding density and transient impact, and at lower settings it is applied to vocals and acoustic instruments.

  A single knob sets the amount of compression, and the exact response and saturation of the original hardware can be switched in. Makeup gain and a DRY/WET balance set the output level and allow parallel processing on more delicate sources.

  Changing the saturation characteristics of the FET gives results ranging from added presence to breakup to fuzz, which extends its use to synths and sound design. A hidden mode reached by clicking the panel lights simulates a damaged power supply.
specs: |-
  - One-knob compression control
  - Switchable exact response and saturation modeling of the original hardware
  - Makeup gain
  - Dry/Wet balance for parallel processing
  - Adjustable FET saturation characteristics, from added presence to breakup to full fuzz
  - Hidden damaged-power-supply mode accessed from the panel lights
  - Licensing via iLOK System/Machine authorization, iLOK dongle or iLOK Cloud
  - Activation on up to four machines at the same time
  - 64-bit DAW support only
  - Minimum: 1 GHz Intel Dual Core processor or AMD equivalent (PC)
  - Minimum: 4GB of RAM
  - Minimum: Mac OS X 10.7 or higher, 10.14 or higher recommended
  - Minimum: Windows 7 and above
  - Minimum screen resolution: 1024 x 768
  - Intel Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
  - Internet connection required for activation and for demos
