description: "An aggressive limiter emulation inspired by vintage British
  console talkback limiters. Originally designed for protecting control room
  speakers, this plugin delivers huge amounts of punch to any signal with a
  transient. Features 100:1 compression ratio with FET-style circuit, 30dB input
  gain with LINE/MIC/PAD modes, wet/dry blend control, adjustable low-pass
  filter, oversampling control, and analog character toggle."
