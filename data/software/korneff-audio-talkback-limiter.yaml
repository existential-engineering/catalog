description: An aggressive FET limiter plugin modeled on original 1979 hardware, delivering thick, punchy, and vibey analog character. Originally discovered as a drum processor, it excels across drums, vocals, guitars, bass, and sound design.
details: |-
  The Talkback Limiter is an aggressive FET limiter modeled on original 1979 hardware, giving it a thick, punchy, vibey character that engineers have prized for decades. Originally discovered as a drum processor, it has found its way onto vocals, guitars, bass, and sound design sessions alike.

  At its core is single-knob compression with analog saturation baked in, faithfully capturing the non-linear behavior of the original unit. A switchable original-unit response mode lets you toggle between the precise hardware model and an enhanced version with broader versatility.

  A Dry/Wet blend control enables transparent parallel processing, while a dedicated saturation and distortion section spans the range from subtle presence to full-on fuzz. An easter egg mode emulates a damaged power supply for unpredictable, lo-fi texture.

  The plugin requires iLok for licensing (account, dongle, or cloud) and supports up to four simultaneous machine activations.
