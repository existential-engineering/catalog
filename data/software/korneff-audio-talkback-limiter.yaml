description: The Talkback Limiter is an extended emulation of vintage talkback
  limiters from British recording consoles. Classic drum sounds, huge bass and
  guitars!
details: |-
  Punchy. Loud. Beautifully Destructive. Fun! The Talkback Limiter is an aggressive, in your face limiter. Carefully modeled from the real thing, the Talkback Limiter has the character and anti-social tendencies that made it so popular for drums. Korneff Audio added extra controls to make it much more versatile.

  The Talkback limiter, as a drum processor, was discovered by accident in 1979 at a studio in England. It was quickly adopted by other artists and producers until it became the sound of drums, especially snare, for most of the 1980s.

  The 80s ended, but the Talkback Limiter lived on as an essential processor, adding punch and thickness and a delicious in-your-face aggressiveness. It's on your favorite Grunge and Nu Metal albums, and on Metalcore productions today. But it also has a softer side. Applied gently, the Talkback Limiter is amazing on vocals and acoustic instruments.

  You'll find the Talkback Limiter infinitely useful, whether you're using it to give a lead vocal a bit more presence in the mix, or trashing a drumset into a gritty sludge.

  Sound on Sound: "A useful, characterful compressor, the Talkback Limiter is no one-trick pony." "...a thick, punchy, vibey processor that oozes analogue-like charm..." "...famous listen-mic compressor just got more tweakable."
specs: |-
  - Simply Smashing: dial in insanely punchy compression with one knob, for punch, presence and vibey analog saturation on drums, bass, guitars and vocals
  - Precision Modeling: modeled on the original hardware, with a switch for the exact response and saturation of the original unit
  - Rein in the Beast: makeup gain and DRY/WET balance for parallel processing
  - Distortion and Fuzz: change the saturation characteristics of the FET, from increased presence to breakup to full-on fuzz
  - Easter egg: damaged power supply effects accessed by clicking the panel lights
  - Licensing: iLOK system/machine authorization, iLOK dongle or iLOK Cloud, up to four simultaneous activations, internet connection required for activation and demos
  - 64 bit DAW support only
  - Minimum system: 1 GHz Intel Dual Core or AMD equivalent (PC), 4GB RAM, Mac OS X 10.7 or higher (10.14 or higher recommended), Windows 7 and above, screen resolution 1024 x 768 or higher
