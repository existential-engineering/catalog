description: An extended emulation of the vintage talkback limiters found in British recording consoles. Classic 1980s drum sounds, huge bass and guitars.
details: |-
  The Talkback Limiter is an aggressive, in your face limiter. Carefully modeled from the real thing, it has the character and anti-social tendencies that made it so popular for drums, with additional controls added to make it much more versatile.

  The talkback limiter, as a drum processor, was discovered by accident in 1979 at a studio in England. It was quickly adopted by other artists and producers until it became the sound of drums, especially snare, for most of the 1980s.

  The 80s ended, but the Talkback Limiter lived on as an essential processor, adding punch and thickness and a delicious in-your-face aggressiveness. It is on your favorite Grunge and Nu Metal albums, and on Metalcore productions today. But it also has a softer side: applied gently, the Talkback Limiter is amazing on vocals and acoustic instruments.

  Dial in insanely punchy compression with one knob, and switch in the exact response and saturation of the original hardware for more realism. Makeup gain and a DRY/WET balance rein the effect back in, so parallel processing lets you add a hint to more delicate instruments and have them sit perfectly in the mix.

  Changing the saturation characteristics of the FET gives effects ranging from increased presence to breakup to full-on fuzz, which makes it useful for synths and sound design projects. There is also a hidden mode reached by clicking the panel lights that simulates a damaged power supply.
specs: |-
  - One-knob compression control
  - Switchable exact response and saturation modeling of the original hardware
  - Makeup gain
  - Dry/Wet balance for parallel processing
  - Adjustable FET saturation characteristics, from added presence to breakup to full fuzz
  - Hidden damaged-power-supply mode accessed from the panel lights
  - Licensing via iLOK System/Machine authorization, iLOK dongle or iLOK Cloud
  - Activation on up to four machines at the same time
  - 64-bit DAW support only
  - Minimum: 1 GHz Intel Dual Core processor or AMD equivalent (PC)
  - Minimum: 4GB of RAM
  - Minimum: Mac OS X 10.7 or higher, 10.14 or higher recommended
  - Minimum: Windows 7 and above
  - Minimum screen resolution: 1024 x 768
  - Intel Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
  - Internet connection required for activation and for demos
