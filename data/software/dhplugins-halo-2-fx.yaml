description: HALO 2 FX is the FX only version of HALO-2, combining all of
  HALO-2's unique FX processing right into your Signal Chain. Filters,
  Distortions, EQs, Modulation, Reverbs, Delays and much more!
details: |-
  The HALO FX plug-in brings the pristine filters, customisable distortions, EQs, fx and modulations from the HALO virtual instrument directly into your plug-in effect chain.

  With a signal flow comprising of a triple multi filter complete with individual LFOs, four distortions including a customisable waveshaper and bit-crusher, a post distortion filter with LFO, delay, phaser, chorus, limiter and a choice of two Reverbs and two EQs, HALO FX is a fast way of dialling in experimental FX. Within only a few clicks you can add any or all of the processing available in HALO FX. The Random Preset Generator will create totally new, useable, interesting settings to shape your sounds.

  Featuring a total of 4 filters, each with multiple filter modes, and each with their own LFO. Select between Low-Pass, High-Pass, Notch, Peak, BandPass and finally an all-pass Phase filter. With a further choice of a Tone EQ and Master parametric EQ, the sonic shaping abilities are broad for a single plugin. The Filter LFO clock will sync with your DAW, enabling the LFO movements to be consistent when scrolling and rendering audio.

  With 4 distortion modes there is a wide sonic palette to play with: Warm Saturation, Amp style Drive, Customisable Waveshaping distortion, and Bitcrushing. The versatile Waveshaper allows complete control over the wave shape, Bias, Gain and Rate Reduction, whilst also featuring a preset browser of its own to instantly select pre-made shapes from the HALO library, or quickly save your own for recall later and in other sessions.

  Via the extensive Preset collection you can access a range of fine tuned settings, from intense distortions, huge reverbs, cavernous delays, rhythmic modulations and glitchy effects.
specs: |-
  - 50 fine tuned presets
  - 3 multi filters with modulation
  - Post distortion multi filter with LFO
  - Filter modes: low-pass, high-pass, notch, peak, bandpass, all-pass phase
  - Four distortion modes: warm saturation, amp drive, customisable waveshaping, bitcrushing
  - Custom waveshaping distortion with control over wave shape, bias, gain and rate reduction
  - Reverb, delay, phaser and chorus FX
  - Tone EQ for easy EQ shaping
  - Parametric master EQ
  - Master peak limiter
  - Precision analysers
  - Random preset generation
  - Filter LFO clock syncs with the DAW
  - 64-bit AU / VST3 / AAX
  - Windows 7 or later, macOS 10.8 or later, M1/M2 ready
  - 1GB RAM, 1GB HDD space
  - 3 license activations per purchase
