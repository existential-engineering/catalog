description: The industry standard for pitch correction and vocal effects,
  optimized for real-time tracking and live performance.
details: |-
  It includes all of the advanced real-time pitch correction features of
  auto-tune pro, and is optimized for low latency performance on stage or in the
  studio. This version of auto-tune is also packed with powerful new features
  and enhancements, starting with a sleek new interface, redesigned for
  ease-of-use and optimal workflow.

  We've added basic and advanced views so you can find the tools you need, when
  you need them. We've also added flex-tune for more natural and transparent
  pitch correction, classic mode for the "auto-tune 5 sound," and transpose for
  real-time pitch shifting.

  Compatibility with the auto-key plug-in (sold separately) means never having
  to worry about finding the key of your music before tuning. Auto-key detects
  the key and scale and sends that information to auto-tune with a single click.

  Auto-tune artist also features humanize to preserve subtle pitch variations on
  sustained notes, automatic formant correction, adjustable throat modeling,
  real-time MIDI control, and advanced vibrato controls.
specs: |-
