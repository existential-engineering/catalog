description: Bohemian - cinematic street & new world instruments Bohemian is a
  diverse collection of 800+ exotic, traditional, and morphed instrument.
details: |-
  Bohemian is a diverse collection of 800+ exotic, traditional, and morphed
  instruments & multis. This fresh and innovative library, performed by
  multi-instrumentalist, composer, and teacher laura inserra, is derived
  entirely from recordings of an extensive collection of unique Bohemian street
  and world instruments ranging from hang drums and harmonic tubes, to
  didgeridoo, and beyond.

  Recorded on the scoring stage at skywalker sound with renowned engineer dann
  thompson, bohemian's source sounds capture the unique cinematic space of
  skywalker sound, which allowed sample logic to morph and expand these one of a
  kind instruments, creating a whole new world of bohemian street sounds, ready
  for any composition. Weighing in at over 9 gb, bohemian not only includes
  ready-to-play, psycho-acoustically sampled world percussive, melodic, and
  effectual instruments, but uses these instruments to enter into a world of
  rich and organic score-ready new world hybrid sounds.

  Experience the incredible depth of instruments recorded by an array of 10+
  microphones in 5 different microphone positions, picking up each of the source
  instruments' full bombast and subtlest nuance. In addition, bohemian's
  traditional instruments are delivered as two separate mixes a tight, mostly
  dry "main" mix, and an supporting "ambient" mix that captures the incredible
  scale of the skywalker scoring stage that can be used together dynamically or
  totally separately in the sample logic kontakt interface.

  Bohemian's innovative interface is equipped with 8 studio-quality effects,
  providing the freedom to infinitely transform samples into awesome twisted
  evolving soundscapes, crushing impacts, unprecedented sequences, soaring
  synths, and so much more with enormous power. The interface also includes
  sample logic's signature triggers, wave, and lfos, and now rises to new
  heights with several added features such as: mixer section to blend two
  different mixes of each traditional instrument, an expanded, dual-voice
  additive synthesis engine called "wave", a "dual filter oscillator" for
  unprecedented rhythmic effects, and sample logic's proprietary step animator
  and fx animator sequencers.

  Sample logic introduces a new take on the additive synthesis engine, "wave,"
  with 41 wave shapes to choose from, and a dual-voice engine with
  independently-controllable volume envelopes, hi-cut filters, and fx animator
  engines. With this expanded, transposable wave section, waveforms can be added
  to the instrument's overall sound, leading to endless customization and
  massive synths.
specs: |-
  - 800+ exotic, traditional, and morphed instruments & multis

  - 10+ microphones in 5 different microphone positions

  - Two separate mixes (main and ambient)

  - 8 studio-quality effects

  - Triggers, wave, and lfos

  - Mixer section to blend two different mixes

  - Dual-voice additive synthesis engine (wave)

  - 41 wave shapes

  - Dual filter oscillator

  - Step animator and fx animator sequencers

  - Volume, pan, filter, eq, compressor/dynamics, lofi, distortion, delay,
  reverb effects

  - 6 macro knobs with multi script macros

  - Macro knob step sequencers

  - Kontakt player 5.4.3 or higher compatible

  - Over 9 gb library size

  - Vst3, audio units, AAX plugin formats

  - Standalone application capability
