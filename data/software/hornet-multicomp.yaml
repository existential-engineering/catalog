description: The MultiComp is a compressor vst plugin with three different compression models, oversampling, analog saturation and gain reduction meter with peak hold.
details: |-
  The HoRNet MultiComp is a compressor in VST and Audio Unit format that provides three different compression models: a VCA emulation, a FET emulation and an OPTO emulation. Every model is equipped with a special oversampling mode and a characteristic analog saturation, and it also provides a high pass filter for the sidechain. The algorithm makes no compromise trying to achieve the best possible quality, while still maintaining a reasonable CPU load.

  The three compression models give a wide palette of sound to choose from: the snappy sound of the VCA inspired by typical 80s VCA compressors, the fat vintage FET sound inspired by the fast and big sound of the classic vintage FET compressor, or the smooth sound of the OPTO limiter with its peculiar program dependent release time.

  The gain reduction meter of the MultiComp visually shows the compression characteristics of the chosen model. Most hardware compressors and many software ones use fixed attack and release times to slow down meter action and make it more visible to the human eye. MultiComp's gain reduction meter instead moves at the same speed as the compressor detector so that attack and release times can be seen, with a peak hold display that shows the maximum gain reduction applied in the last 2 seconds.

  Generic presets are provided as a starting point and assume that the input signal is around 0VU, so the input knob should be set so that the input meter flashes red on peaks but stays yellow most of the time.
specs: |-
  - Compressor with three different compression models (VCA, FET, OPTO)
  - Sidechain high pass filter
  - External sidechain
  - Analog emulation adds typical model saturation
  - High quality processing thanks to intelligent oversampling
  - Real gain reduction metering with peak hold
  - Mac OS X (10.7 and later) and Windows support
  - 64-bit compatibility both on Mac and Windows
  - Audio Units, VST, VST3 and RTAS format
  - No copy protection
