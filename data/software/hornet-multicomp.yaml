details: |-
  Compress with style! The HoRNet MultiComp is a compressor in vst and audio unit format that provides you with three different compression models, a VCA emulation, a FET emulation and an OPTO emulation. Every model is equipped with a special oversampling mode and a characteristic analog saturation, it also provide an high pass filter for the sidechain The algorithm makes no compromise trying to achieve the best possible quality, still maintaining a reasonable CPU load. &nbsp; Three flavors for every taste The HoRNet MultiComp has three compression models and gives you a wide palette of sound to choose from: the snappy sound of the VCA (inspired by the typical sound of 80s VCA compressors) or the fat vintage FET sound (inspired by the fast and big sound of the classic vintage FET compressor) or the smooth found of the OPTO limiter (with its peculiar program dependent release time). Real GR metering The Gain Reduction meter of the MultiComp visually show the compression characteristics of
