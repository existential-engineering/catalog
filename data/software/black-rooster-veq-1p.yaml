description: A vintage program equalizer plugin inspired by the Pultec EQP-1A. Low-end weight, silky highs, the Pultec trick on bass.
details: |-
  The VEQ-1P is a vintage program equalizer built the way the original EQP-1A worked, a passive filter network, tube make-up gain and broad, forgiving curves that flatter almost anything you feed them. This isn't a scalpel: you reach for it when a bass drum needs weight and click without mud, when a full mix wants air on top, or when a vocal needs to breathe.

  The EQP-1A earned its reputation on one counterintuitive detail: the Low Frequency section lets you boost and attenuate the same shelf at the same time. Because the filters are slightly off-tuned from each other, the boost and cut don't cancel, they carve a gentle dip just above the boosted region, giving fat, defined low end that stays out of the low-mid mud. Black Rooster Audio rebuilt that behaviour with real-time, SPICE-style circuit simulation: the passive filter network, audio transformers and tube amplifier stage are modelled as a living circuit rather than frozen into a fixed EQ curve.

  The Low Frequency section handles the bottom via interacting shelves selectable at 20, 30, 60 or 100Hz (CPS). The Bell Filter adds mid-high boost tuned by the KCS selector across 3, 4, 5, 8, 10, 12 or 16kHz, with a Bandwidth control sweeping from sharp to broad. A separate High-Shelf attenuates the top end with its own edge frequency (5, 10 or 20kHz), and the Power knob offers a full bypass or up to ±10dB of linear output gain.

  On bass and kick, dialing the CPS to 30 or 60Hz and running the boost-and-cut trick gives low end that hits hard yet stays defined. On a mix bus, a touch of Low boost plus a High-Shelf lift adds mastering polish, and on vocals and acoustic guitars the Bell Filter around 3-8kHz pulls a part forward without harshness. Because the tube make-up amp stays in the signal path even with the EQ section switched out, running the VEQ-1P flat still prints a gentle harmonic colour.
