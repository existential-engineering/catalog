description: Clocker is a utility plug-in that sends MIDI clock, giving a
  separate and adjustable clock source alongside the one the host application
  already provides.
details: |-
  Clocker is a utility plug-in that sends MIDI clock.

  A host application sends MIDI clock perfectly well on its own, so the point of Clocker is that it provides a separate, adjustable source of it. That allows all kinds of unusual tempos to be sent to some outboard gear while the rest of a session plays back in time as usual.

  Expert Sleepers grants that it is a niche requirement. The plug-in is free.
specs: |-
  - Sends MIDI clock
  - Adjustable clock source independent of the host application
  - Free of charge
