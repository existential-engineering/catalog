details: |-
  Modern Baroque

  A true mechanical and musical marvel, the 1676 Vivaldi Harpsichord has been perfectly preserved since the Baroque era—and now, it finds new life in Soundpaint. Captured with eight meticulously placed mic positions, this extraordinary instrument is recorded from every angle, ensuring an authentic, immersive experience. We've deeply sampled both the upper and lower manuals, including sustains (with and without clutch), as well as the intricate mechanical noises that bring this harpsichord to life. With ultra-deep sampling and the boundless power of the Soundpaint engine, this iconic sound has never been more expressive, more detailed, or more playable. Step into the past, reimagine the future, and explore the timeless brilliance of the 1676 Vivaldi Harpsichord like never before.
