details: |-
  BassBooster enriches bass with the creation of new harmonics using an
  algorithm based on a unique new psychoacoustic algorithm: cross-modulation of
  harmonic operators and imposition of new frequencies.

  Creation of new harmonics without using equalisation is the main focus of this
  plug-in.

  It's ideal for use in dance, techno, dubstep, electronica, drum n bass, big
  beat, dub, reggae and all other styles that need powerful bass.

  The plug-in contains: tube emulation section, 8-bit section, harmonics
  operators section, lfo section for dubstep bass effect specially, harmonics
  filter section, gain & limiter section, and harmonics phase section.

  Bassbooster is a collaboration between syncersoft and softrave.
specs: |-
  - Tube emulation section
  - 8-bit section
  - Harmonics operators section
  - LFO section
  - Harmonics filter section
  - Gain & limiter section
  - Harmonics phase section
  - Cross-modulation of harmonic operators
  - Imposition of new frequencies
  - Psychoacoustic algorithm
