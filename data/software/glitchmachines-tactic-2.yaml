description: Tactic 2 is a phrase generator and sample-based sequencer for
  crafting evolving rhythmic patterns and experimental glitch textures. It
  combines 8 sample slots with a multi-mode trigger sequencer, per-step
  probability, generative sequencing, and a 4-bus effects system. Designed for
  electronic producers who need expressive rhythmic variation and on-the-fly
  pattern mutation.
details: |-
  Tactic 2 is a phrase generator geared towards evolving sequences and metamorphic patterns.

  Tactic features 8 sample slots and a master trigger sequencer supported by several modulation sequencers with highlights such as per-step probability, per-step parameter values and per-step randomization, giving you all the tools necessary to create anything from subtle percussive grooves to experimental hyperglitch chaos.

  Version 2 includes highly requested features such as multiple outputs, 4 effects busses, shuffle, cell auditioning, a revamped factory sample bank and numerous other additions. You can of course also load your own samples and pair Tactic 2 with your favorite effects chains thanks to 4 direct outputs. The plugin truly comes to life when paired with our range of signal processing plugins such as the recently released Quadrant 2 and Subvert 2.

  In version 2, we added the brand new Effects Bus system, which features 4 channels with two effects slots and a total of 8 new effects. To extend Tactic's onboard functions, virtually every parameter is available as an automation target, maximizing your options to construct incredibly intricate modulation scenarios via your host application's automation/modulation facilities. Tactic also features a comprehensive randomization panel similar to the ones found in Polygon and Palindrome, which allows you to randomize nearly every parameter in the plugin, either individually or in logically organized parameter groups.

  Tactic comes with a factory bank of 400 percussion samples and sound effects. While this bank includes all of the necessary elements to allow you to take advantage of Tactic's strengths, you can certainly load your own samples in order to fully customize the plugin to your liking. We also offer a large range of separately available sample packs that cover a broad sonic landscape you can explore to keep Tactic loaded with content for years to come. For version 2, we designed a brand new set of 100+ factory presets to showcase what the plugin is capable of.
