description: Tactic 2 is a phrase generator and sample-based sequencer for crafting evolving rhythmic patterns and experimental glitch textures. It combines 8 sample slots with a multi-mode trigger sequencer, per-step probability, generative sequencing, and a 4-bus effects system. Designed for electronic producers who need expressive rhythmic variation and on-the-fly pattern mutation.
details: |-
  8 sample slots with trigger sequencer
  4 flexible sequencers: trigger, dual parameter, and generative
  Per-step probability and parameter values
  4-bus effects system with 8 insert processors
  Master EQ and compressor
  Randomizer panel
  400 factory samples and 100+ presets
  4 direct outputs for custom effects chains
  Scalable UI
  Full automation support
