description: Mellotron MkI/MkII and Chamberlin Musicmaster emulation with 132
  tape-banks from The Streetly Archives, dual rhythm/accompaniment mode, and
  authentic tape controls.
details: |-
  Whilst M-Tron Pro IV continues to focus on the chromatic sounds of the Mellotron M400 and is probably the first 'tron you'll want, its GForce MkII sibling is a unique and exclusive library with specialist tools for tackling the rhythms, accompaniments, and unique playing styles found in earlier Mellotrons MkI/MkII and Chamberlins.

  Originally conceived as the ultimate Home Entertainment Console, the UK-made 1963 Mellotron MkI/MkII was a dual-manual tape-based instrument. The left manual's 35 notes replayed a combination of 18 Rhythms and Accompaniments (66 on the GForce M-Tron MkII), and the right manual (also 35 notes) replayed 18 lead sounds (66 on M-Tron MkII). GForce MkII was designed for composers and producers who want access to the evocative tones of the original dual manual Chamberlin, Mellotron MkI, and MkII instruments. Special emphasis was placed on the Rhythms and Accompaniments, which capture a moment in time between the 1950s and late 1960s.

  Under each key of the original MkII was over 40 feet of magnetic tape. At the press of a button, a scrolling mechanism would move that tape so that one of six different sections could be replayed. These sections are referred to as 'Stations' and each conformed to a specific style, musical key and tempo. On the GForce MkII, we've kept this methodology, but added ways where Rhythms and Accompaniments from different Stations can be mixed and matched, vastly increasing the possible permutations and flexibility of the instrument. GForce MkII also offers the ability to retune an entire bank while maintaining the host tempo.

  GForce MkII features a Dual Rhythm Mode where you can layer two Rhythms and Accompaniments from the Chamberlin and Melly MkI & II to create a fusion of hybrid rhythms and motifs. We've also taken care not to iron out the character of the original tapes so the contrast between US and UK recordings is a joy to behold.

  All the sounds on the GForce MkII are sourced from the MKI, MKII and Chamberlin Tape Archive curated by Martin Smith who prepared the recordings for this project. With these tapes undergoing extensive, but sympathetic tape restoration and tempo remapping, on GForce MkII both microphone and DI'd recorded versions of the lead tapes now sit side-by-side with combinations of rhythms and accompaniments, the latter of which can be synchronised to your host tempo and transposed to fit into your own compositions.
specs: |-
  - 132 tape-banks sourced from The Streetly Archives
  - 4,500+ individual samples
  - 150+ patches
  - Dual Rhythm/Accompaniment mode with Host Sync
  - Tape controls: reverse, rewind, pitch, pan, half-speed
  - Individual key editing: tape start, detune, pan, click
  - Reverb (modern & spring) and delay effects
  - Unlooped tape-banks for authentic playback
  - Chord Finder visual aid
  - macOS: Intel or Apple Silicon, macOS 10.15+; 230 MB + 5 GB library
  - Windows: 2 GHz CPU, 2 GB RAM, Windows 7+; 230 MB + 5 GB library
