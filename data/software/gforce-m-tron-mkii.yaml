description: Mellotron MkI/MkII and Chamberlin Musicmaster emulation with 132 tape-banks from The Streetly Archives, dual rhythm/accompaniment mode, and authentic tape controls.
details: |-
  M-Tron MkII faithfully recreates the rare dual-manual Mellotron MkI/MkII and Chamberlin Musicmaster instruments from the 1960s. With over 4,500 individual samples curated from tape restoration and 150+ patches, it captures the evocative tones of these original instruments with special emphasis on the rhythms and accompaniments that defined recordings from the 1950s through late 1960s.

  The instrument features Host Sync for rhythms and accompaniments, comprehensive tape controls (reverse, rewind, pitch, pan, half-speed), and individual key editing for tape start, detune, pan, and click. Built-in reverb (modern and spring) and delay effects round out the signal chain, while unlooped tape-banks ensure authentic playback character.

  A Chord Finder visual aid assists in composition, and a dual Rhythm/Accompaniment mode allows layering of multiple parts simultaneously.
specs: |-
  - 132 tape-banks sourced from The Streetly Archives
  - 4,500+ individual samples
  - 150+ patches
  - Dual Rhythm/Accompaniment mode with Host Sync
  - Tape controls: reverse, rewind, pitch, pan, half-speed
  - Individual key editing: tape start, detune, pan, click
  - Reverb (modern & spring) and delay effects
  - Unlooped tape-banks for authentic playback
  - Chord Finder visual aid
  - macOS: Intel or Apple Silicon, macOS 10.15+; 230 MB + 5 GB library
  - Windows: 2 GHz CPU, 2 GB RAM, Windows 7+; 230 MB + 5 GB library
