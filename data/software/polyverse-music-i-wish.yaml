description: I Wish is a pitch freezer plug-in that takes any sound and freezes it in time and pitch, for pitched stutter effects, robotic sounds and soundscapes.
details: |-
  I Wish is a pitch freezer plug-in. It takes any sound, a vocal recording, a drum beat or even noise, and freezes it in time and pitch, which suits pitched stutter effects, robotic sounds and soundscapes. The page frames it as both a synthesizer and a granular effect.

  When triggered by MIDI notes, the plug-in creates a tiny loop of audio set at the wavelength of the incoming notes, so the frozen material can be played polyphonically like a wavetable synth. It allows pitch based micro-editing on the fly, and results depend heavily on the audio and MIDI fed into it.

  Controls cover pitch and formant modulation, real-time polyphonic wavetable synthesis and tightly controlled glitch and stutter effects, which lets a voice be played like a synth.

  The concept was inspired by the electronic duo Infected Mushroom and their track of the same name, where the effect was achieved by chopping and editing loops of audio at the wavelength level by hand. Polyverse Music originally built a prototype VST for the group's own use, and after two years it was released publicly.

  I Wish supports VST2, VST3, AU and AAX formats and runs on Windows 64 bit and OSX 10.9 or later 64 bit.
specs: |-
  - Modulate pitch and formant
  - Real-time polyphonic wavetable synthesis
  - Pitch based micro-editing on the fly
  - Produces extremely controlled glitch and stutter effects
  - Play a voice like a synth
  - MIDI triggered loops set at the wavelength of the incoming notes
  - Supports VST2, VST3, AU and AAX plug-in formats
  - For Windows 64bit and OSX 10.9+ 64bit
