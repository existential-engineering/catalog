details: |-
  Bamboo Dreams is a collection of widely used chinese woodwinds instruments. It
  does not only include solo woodwinds such as dizi, xiao, bawu, guanzi and
  hulusi, but also includes woodwinds ensembles. What is more, it also provides
  different models for each solo instrument, such as different types of dizi,
  xiao and hulusi. Over 20 instruments in all, the huge variety of instruments
  in Bamboo Dreams helps our musician have a more comprehensive view on the
  sound of chinese woodwinds and enjoy every bit of the charming chinese sound.

  This deeply sampled 42gb library applies the latest hybrid modeling
  technology; it can also represent glissando, vibrato, bending and harmonic
  more vivid than other sampled instrument. The playability from modeling
  technology enables it to change timbre real time during playing, and this
  gives the sound more varieties and expressive than sampled instrument. What is
  more, we also sampled the portamento samples that will bring a more vivid
  sound.

  Bamboo dreams is designed for simplicity; we make all technique possible
  finish in one track. With our unique performance key switch system. Which you
  can switch technique fluently and easily. Modeling technology also provides
  support for real-time interaction and change on sound. For example, you can
  smooth change from a plain sound to a full vibrato sound. That is difficult to
  achieve by sampling technology. And this adds more realistic to final sound.

  Long dizi is a chinese transverse flute, or chinese bamboo flute. Dizi is a
  major chinese musical instrument, and is widely used in many genres of chinese
  folk music, as well as chinese opera, and the modern chinese orchestra.
  Traditionally, the dizi has also been popular among the chinese common people,
  and it is simple to make and easy to carry.

  Xiao is a chinese vertical end-blown flute. It is generally made of bamboo.
  Xiao is a very ancient chinese instrument usually thought to have developed
  from a simple end-blown flute used by the qiang people of southwest china in
  ancient period. In the oral traditions of the xiao, its sound is said to
  resemble the sweetness of the phoenix's call, the king of birds in chinese
  belief.
