name: BBD Echo-80
manufacturer: audiosyn
primaryCategory: delay
categories:
  - effect
url: https://www.audiosyn.com/home/vstplugins/bbdecho80.htm
description: BBD Echo-80 faithfully emulates the workings of bbd (bucket-brigade
  device) analogue delay-line FX.
details: |-
  Unlike hardware analogue delays, no compromise needs to be made between
  fidelity & delay-time. Bbd echo-80 can be as clean or dirty as you want it.

  Resonant response allows self-oscillating feedback. 2-pole high pass filter
  for less "muddy" sounding delay's (pre-delay).

  Analogue-style vu meter with pre & post db monitoring switch. LCD numeric
  display which displays current delay time (in ms.) or clock/sample rate (in
  hz.).

  In-built help file. Just flick the "help" switch on, and moving the mouse
  cursor over any control displays information on it's function and use.
specs: |-
  - 11 bbd fixed-stage lengths (64->65536) with manual 50%-200% offset

  - Delay time from fraction of millisecond up to +13 seconds @ 48khz

  - Delay-line clock from 1000hz up to host audio rate (44khz, 48khz, 96khz)

  - Delay time modulation with 5 waveform types (sine, tri, ramp, saw, sample &
  hold)

  - Lfo syncable to host MIDI clock

  - Audio re-triggering of lfo modulator with variable phase selection

  - 2-pole bpf for audio frequency triggering

  - 4 or 8-pole low pass filter (post delay) with selectable resonant &
  non-resonant response

  - Self-oscillating feedback capability

  - 2-pole high pass filter (pre-delay)

  - Loop function for infinite delay buffer looping

  - Volume (pre-gain) & dry/wet mix controls

  - Analogue-style vu meter with pre & post db monitoring

  - LCD numeric display for delay time (ms) or clock/sample rate (hz)

  - Hiss knob for white noise

  - In-built help file

  - Save up to 64 preset patches per bank

  - 11 built-in patches included

  - High & low resolution plug-ins for different screen resolutions

  - High resolution VST optimized for 1280x1024 & higher

  - Low cpu usage

  - VST plugin format

  - Windows compatible
