details: >-
  The new air instrument expansion pack is an inspiring collection of virtual
  instruments and progressive sound-design tools for the modern producer,
  composer, and performer. Developed by air music technology, the team
  responsible for creating the award-winning virtual instruments and core
  effects offered with avid's pro tools software, the air instrument expansion
  pack brings the world's most innovative virtual instruments to your favorite
  DAW.


  These seven instruments, ranging from breathtaking emulations of vintage gear
  to unique synthesis technologies, enable you to tap into familiar sounds or
  create something no one has ever heard before. The air instrument expansion
  pack includes: hybrid 3.0 high-definition analog & wavetable synth, loom
  modular additive synthesizer, vacuum pro polyphonic analog tube synthesizer,
  structure multi-timbral sampler instrument, strike ultimate virtual drummer
  instrument, velvet vintage electric piano instrument, and transfuser 2 melodic
  & rhythmic groove-creation instrument.


  The air instrument expansion pack combines multiple synthesis technologies,
  premium instrument samples, high-definition drums, vintage electric pianos,
  and a comprehensive groove-creation platform to provides today's musician,
  composer, and producer with the latest innovations of german-engineered
  software. Hybrid 3.0 is an analog and wavetable synthesizer that combines the
  warmth of analog synthesis with futuristic digital controls; loom is a modular
  additive synthesizer that lets you explore additive synthesis with 30 editable
  modules and a sound-shifting morph pad; vacuum pro is a polyphonic analog tube
  synthesizer that re-invents the gritty glory of the analog age; structure
  delivers a world of sounds with multi-timbral layering and comprehensive
  sample editing; strike is a drum and arranger instrument with a realistic
  performance engine; velvet puts five sought-after electric pianos at your
  fingertips; and transfuser 2 is a melodic and groove creation that offers
  powerful sound manipulation capabilities.


  Altogether, the air instrument expansion pack includes 70+gb (uncompressed)
  samples, loops, effects, and 2000+ tweakable patches and presets programmed by
  legendary sound designers.


  All seven plugin instruments in the air instrument expansion pack are
  available in VST, AU, and AAX formats. Each title seamlessly integrates with
  popular daws such as ableton live, logic, cubase, pro tools, and more. The new
  air instrument expansion pack includes the 2.0.2 enhancements of its 4 core
  offerings (strike, velvet, structure, and transfuser 2), 1.0.1 versions of
  loom and vacuum pro, and air music tech's flagship synthesizer hybrid 3.0.
