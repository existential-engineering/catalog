details: |-
  Cherry Audio's KR-55C is a software emulation combining features from two
  post-punk era Korg drum machines: the KR-55A and KR-55B. It includes all 240
  original factory patterns from both models plus 200 additional patterns
  covering wider genre ranges.

  Unlike sample-based instruments, the sounds are created through analog
  modeling rather than samples. The Instrument Edit panel enables extensive
  parameter editing including tuning and EQ adjustments for each sound, offering
  sonic possibilities exceeding the original hardware.

  The mixer and effects sections provide separate processing for each sound with
  features including panning, mute/solo, overdrive, flanger/chorus, delay, and
  reverb. A bus compressor and limiter handle master amplitude control.

  DAW-friendly features include auto-sync, drag-and-drop MIDI export, and
  individual outputs. The X0X-style step sequencer supports 16- or 24-step
  pattern programming, while Song Mode allows chaining up to 99 patterns.
specs: |-
  - All 240 original preset patterns from KR-55A and KR-55B models
  - 200 additional rhythm and sound presets with genre-matched kits
  - Instrument panel with parametric EQ, tone, tune, and decay controls
  - X0X-style 16- or 24-step pattern programming
  - Song Mode supporting up to 99 patterns
  - External MIDI sound triggering with velocity sensitivity
  - Mixer with independent level, pan, solo/mute per instrument
  - Effects routing matrix with overdrive, flanger/chorus, delay, and reverb
  - Global master compressor and bus limiter
  - Drag-and-drop MIDI export functionality
  - Individual outputs (plugin version)
  - Complete MIDI control and DAW automation
  - Focus zoom feature with standard UI resize
