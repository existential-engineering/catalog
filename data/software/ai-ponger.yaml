details: |-
  Introducing Ai Ponger - the perfect plugin for those much needed ear breaks. Use either your mouse or your MIDI keyboard's mod-wheel to control the paddle. Completely free and ready to take on any human brave enough to challenge it.

  Available as AU and vst3 instruments for mac, and as vst2 and vst3 instruments for windows.

  Ai ponger by exonic uk is a virtual instrument audio plugin for macos and windows. It functions as a VST plugin, an audio units plugin and a VST 3 plugin.
