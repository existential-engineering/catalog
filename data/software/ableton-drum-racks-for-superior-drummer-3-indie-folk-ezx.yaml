description: Ableton drum racks for superior drummer 3 indie folk ezx features
  separate ableton
details: >-
  Ableton drum racks for superior drummer 3 indie folk ezx features separate
  ableton drum racks for all factory presets for the toontrack superior drummer
  3 and indie folk ezx library for toontrack ezdrummer. These racks provide out
  of the box integration workflow between ableton live and toontrack superior
  drummer 3 using the toontrack libraries including a host of features ready to
  use for composition and performance using ableton push or similar controllers.


  22 ableton drum racks to instantly load the factory library "mix ready"
  presets with ableton mappings. 11 ableton live templates designed to host the
  multi channel output routing presets with track level audio routing from
  superior drummer 3 into ableton live.


  Colour coded pad design for visual performance and finger drumming. All our
  racks use consistent drum rack colouring so you can visually and immediately
  spot your rides from your hi hat articulations. Vast array of instrument
  articulations ready to go in one massive layout using ableton push 64 pad
  layout mode.


  Singleout presets 11 ableton drum racks for all indie folk factory presets
  single audio output to a single ableton track. Mixing can be further enhanced
  through ableton track mixer by expanding out the track for individual pad and
  instrument level articulation, or loading additional ableton audio effects to
  the track.


  Multiout presets featuring 11 ableton drum racks for all indie folk ezx
  presets in multiple audio channel output from the plug in to multiple ableton
  audio tracks using the 11 multi output ableton templates also provided
  designed for the kit presets. Track level audio mixing control in ableton.
specs: |-
