description: Bompa was created to do everything that you shouldn't do to audio
  in one highly effective mayhem plugin.
details: |-
  Bompa is unique in the way it let you carve out your own distortion
  characteristic. Use it in mastering to add character and warmth or while
  mixing creatively to mess things up beyond recognition.

  New in 3.0: reworked all graphics from scratch. Reworked the limiter. The dry
  signal can be routed in different ways.
specs: |-
  - Distortion plugin
  - Dry/wet mix control
  - Limiter
  - Dry signal routing
