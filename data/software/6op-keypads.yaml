details: |-
  6op introduces a new line of libraries that derive their sounds from 6-operator fm hardware synthesis. Keypads live pack is the first installment of this series and puts focus on keys and pad sounds.

  Containing 40+ live rack instruments this pack is made for the keyboardist who just wants to stack layers and for the sound designer likewise. The racks have a consistent macro layout so that each sound can be easily tweaked from keyboard to pad and back.

  Especially the modspeed and audiotranspose macros - also in conjunction with the color macro - reveal unexpected modulation possibilities. With this potential it is easy to create interesting variations of the preset sound.

  Keypads multi format contains 44 different patches in 5 multi-purpose formats that load into kontakt, reason, logic, dimension, halion, directwave and a lot more software samplers. This guarantees for easy handling of the included sounds. Included formats: sfz, nki, sxt, exs, fxp.
specs: |-
