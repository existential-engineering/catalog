details: |-
  Acoustic dhol is a sample based indian dhol instruments. It has been sampled
  from 3 types of real indian leather dhol instruments. Wooden dhol, steel dhol
  and fiber dhol.

  It is the first VST and AU plugins that can play real indian dhol inside any
  digital audio workstation. Indian, punjabi, bollywood and bhangra styles are
  available in acoustic dhol.

  Over 100 articulation and 22 presets are available. If you are tired of
  playing boring indian dhol loops, if you hunt daily for new dhol loops, just
  try the acoustic dhol VST and AU plugins.

  You are not just limited to a loop, play real indian dhol right inside your
  favorite host.
specs: |-
  - Sampled from 3 types of indian dhols
  - Over 100 different articulations
  - 22 presets
  - Indian, punjabi, bollywood, bhangra styles
  - Mpc style gui
  - Velocity sensitive
  - Round robin sampling
  - Attack release rotary knob
  - Tune volume pan rotary knob
  - Algorithmic reverb
  - Level meter
  - Windows 7, 8, 10 & latest Mac OS X compatible
  - Intel or amd CPU required
  - 2gb RAM (4gb recommended)
  - 1gb GPU (2gb recommended)
  - Asio supported host DAW required
