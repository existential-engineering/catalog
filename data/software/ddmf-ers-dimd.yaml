description: "A chorus plugin reproducing the Roland Dimension D hardware unit,
  delivering a subtle, stereoizing enhancing, airy effect while preserving
  original sound quality."
details: |-
  4 selectable modes controlling structure, delay length, depth, and oscillator speed
  Individual controls for delay depth, speed, and mix
  Mono/stereo operation option
  Careful reproduction of original Roland Dimension D schematics
specs: |-
  - Careful reproduction of the original Roland Dimension D schematics
  - 4 available modes controlling structure, delay length, depth, and oscillator speed globally
  - Individual controls over delay depth, speed, and mix (improvements over hardware)
  - Mono/stereo processing option
  - Available in 32-bit and 64-bit formats
  - Mac: OS X 10.7 or higher, Intel and Apple Silicon supported
  - Linux: ARM and x86_64 architectures (VST3)
  - iOS: AUv3 format for GarageBand, Cubasis, and compatible hosts
