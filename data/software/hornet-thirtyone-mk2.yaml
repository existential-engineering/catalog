description: ThirtyOne MK2 is a plugin that includes a spectrum analyzer and a graphic equalizer, both have the standard 31 one third octave bands
details: |-
  ThirtyOne MK2 combines a spectrum analyzer and a graphic equalizer, each using the standard 31 one-third octave bands. This pairing is a fundamental part of professional live sound setups, often appearing at the final stage of the master bus, and HoRNet recreated the behaviour and response time of a well-known Italian analog spectrum analyzer.

  The graphic equalizer draws on analog units for a familiar feel in the master chain. The analyzer reproduces the smooth LED lighting behaviour of the original hardware, where the LEDs were driven by a smoothly increasing current flow. Each column of twelve LEDs represents a frequency range, controlled by a 20dB/octave filter as in the analog counterpart, and the analyzer response speed is selectable between 0.25, 1 and 4 seconds.

  Each LED can represent 1, 2 or 3 dB, closely matching the original device, and a 6dB/LED option is included for a more sensitive display. The scale to the left of the LED display updates whenever the resolution is changed. A maximum peak hold LED per frequency band can be enabled or disabled, a feature the original hardware did not offer.

  Beneath the analyzer sit 31 sliders, each controlling a one-third octave second-order filter adjustable from -15 to +15 dB, with values also typed directly into the box below each slider.

  Auto EQ automatically adjusts the gain of each band based on the spectrum analyzer output. Three algorithms are offered, Average, Median and Lucky, and the analysis speed directly affects how the algorithm adjusts equalization. A compensation curve applies an offset to the computed levels and can be saved and loaded, while an EQ Amount knob scales the entire curve.
specs: |-
  - 31 one third octave spectrum analyzer bands
  - Spectrum analyzer crafted to give the feeling of analog hardware units
  - Three different integration times for the analyzer
  - Four scale ranges for the analyzer
  - Peak hold display
  - Displays both the L+R (mid) and L-R (side) component of the audio spectrum
  - 31 one third octave equalizer bands
  - Each band can be bypassed, soloed or disabled for the AutoEQ
  - Each band gain adjustable from -15 to +15 dB
  - Auto EQ automatically balances frequency content
  - Three different algorithms for AutoEQ
  - AutoEQ can work in continuous or fixed mode
  - Each of the two modules can be disabled to save CPU
  - AutoEQ amount knob to scale the effect impact
  - Custom compensation EQ profile for the AutoEQ algorithm, saveable and loadable
  - Preset save and load
  - Bypass button for the equalizer
  - Scalable and hardware accelerated GUI
  - macOS (10.11 or later, Metal required) and Windows (7 and later, OpenGL 2.1 required) support
  - Apple Silicon native support
  - 64-bit plugin for Mac and Windows
  - Audio Units, VST2.4, VST3 and AAX format
  - No copy protection
