description: Weaponiser Fully Loaded is the premium edition of the Weaponiser
  sound design sampler plugin — it includes the full plugin engine plus bundled
  expansion libraries (Footsteps, User Interface, Whooshes, Trailers, Magic).
  Four sample engines trigger up to 80 audio files simultaneously, with MIDI
  trigger support, Burst mode, color-coded timeline, and multichannel output.
details: |-
  6,737 samples, 1,595 weapon samples, 561 presets, 8 GB of assets. Expansion libraries included: Footsteps, User Interface, Whooshes, Trailers, Magic. Four sample engines (Onset, Body, Thump, Tail) trigger up to 80 audio files. Three built-in synthesis engines. MIDI trigger with velocity sensitivity. Burst mode for automatic one-shot asset bursts. Multichannel output (individual stereo tracks per layer). Tag-driven browser with drag-and-drop import. 10-day free trial. iLok account required. Used in: Preacher, Half-Life: Alyx, Terminator Dark Fate, For All Mankind, Agents of S.H.I.E.L.D.
