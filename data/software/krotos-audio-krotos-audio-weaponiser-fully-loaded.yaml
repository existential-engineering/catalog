description: The full-content edition of Weaponiser, a sound design sampler that lets you design, customise and perform a huge range of sound effects from one plugin, bundled with the Footsteps, User Interface, Whooshes, Trailers and Magic expansion libraries.
details: |-
  Weaponiser is a powerful sound design sampler that lets you design, customise and perform a huge range of sound effects quickly, all from within one plugin. Create assets and fully-fledged sounds with a drag and drop, multi-sample interface, and keep all of your layers on a single track in your DAW.

  Hundreds of presets, thousands of assets, and the ability to import your own sounds. Four powerful sample engines can trigger up to 80 audio files in countless variations, and three built-in synthesis engines are also included. The engines are organised into four sections, Onset, Body, Thump and Tail, giving control over the specific layers of your sounds, and the included sound libraries are accessible through the built-in tag-driven browser with drag-and-drop.

  Spotting to picture is simplified: switch between presets while maintaining sync within your DAW rather than adjusting multiple tracks, groups or plugins. Use MIDI to trigger your engines and velocity sensitivity to program or perform precise variations, triggering the entire plugin or individual engines. The timing and arrangement of the engines can be precisely offset using the colour-coded built-in timeline, and Burst mode creates automatic bursts from one-shot assets with an adjustable fire rate. Multichannel output lets you process each engine with your own plugins or route each layer to its own stereo track.

  The Fully Loaded edition carries 6,737 samples, 1,595 weapon samples, 561 presets and 8 GB of assets, along with presets from leading sound designers and the Footsteps, User Interface, Whooshes, Trailers and Magic expansion libraries. The Basic edition, by contrast, ships 1,385 samples, 515 weapon samples, 160 presets and 1.88 GB of assets.

  Weaponiser is used widely in movies, TV and games. Projects that use it include Preacher, The Leviathan Chronicles, Half-Life: Alyx, Colour Out of Space, Terminator Dark Fate, For All Mankind, Titans, Future Man and Agents of S.H.I.E.L.D.
