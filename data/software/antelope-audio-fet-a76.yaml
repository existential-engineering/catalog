description: The Antelope Audio FET-A76 real-time effect captures all the
  subtleties and nuances of a vintage FET compressor.
details: |-
  The FET-A76 is a FET Compressor / Limiting Amplifier effect that runs natively in your DAW on macOS or Windows, or in real-time on your Synergy Core interface.

  Before we can fully understand the capabilities of our FET-A76, we must understand the history of its inspiration. The original sound of these compressors was achieved by using FETs, or field-effect transistors. These are special types of transistors that can be used to create very high impedance circuits. This is what gives the FET design compressor its much sought-after sound. The same holds true for our FET-A76 effect — it captures every nuance of this vintage sound.

  The FET-A76 has a unique sound that is very difficult to achieve with other types of compressors. It has a punchy and aggressive sound that is perfect for drums and other percussive instruments. It also has a bright, yet smooth and energetic sound that is perfect for vocals and other melodic instruments. It can achieve lightning fast attack times which really gives it the upper hand when dealing with unruly transients, making the compressor a very versatile tool that fits in any engineer's arsenal.

  Some favorite ways of using the FET-A76 on vocals is to have it stacked alongside the Opto-2A analog-modeled effect, using the FET-A76 to catch the initial peak transients and then the Opto-2A to compress the rest lightly for a bold yet tamed vocal. One feature of many is its ability to operate with all four ratio buttons enabled simultaneously, allowing the FET-A76 to create a more explosive sound with increased harmonic distortion suitable for drum room mics and electric guitars.
specs: |-
  - FET Compressor / Limiting Amplifier emulation
  - Inspired by vintage 1960s/1970s FET (field-effect transistor) compressor designs
  - Lightning-fast attack times for transient control
  - Four ratio buttons that can operate simultaneously for explosive sound with added harmonic distortion
  - Punchy, aggressive character suited to drums and percussive instruments
  - Bright, smooth tone for vocals and melodic instruments
  - Runs natively in your DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core interfaces
