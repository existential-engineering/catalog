details: >-
  An exquisitely crafted grand piano, recorded in the subdued acoustics of a
  private family lounge. Organic instruments' debut release, a nuanced grand
  piano, designed and recorded with detail for the highest degree of realism.
  With a deep sound, rich in warmth and energy, arcadia is an authentically
  crafted addition for all compositions.


  Up to 5 recorded dynamic layers. Up to 4 round-robins per sample, for natural
  variation and realism. Contains 4 articulations: sustained, staccato, felted
  and una corda. Additional samples of internal key and pedal mechanics.


  Included dynamic filter, for adjusting the playable dynamic range. Built-in
  reverb and envelope controls. Intuitive and resizeable user interface.


  Arcadia is available as a virtual instrument plugin for windows and macos
  (10.6 snow leopard or later). Upon running the arcadia installer, you may
  choose from vst3, AU, AAX or standalone formats. For 64-bit operating systems
  only.


  The audio demonstrations on this page and the soundtrack for the plug-in's
  promotional video were performed digitally, using the arcadia instrument.
