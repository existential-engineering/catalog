description: WaveLab is Steinberg's mastering and audio editing application,
  combining a sample-accurate audio editor, a multitrack audio montage for album
  assembly, and a full spectral editor in one program.
details: |-
  WaveLab is built around two main workspaces. The Audio Editor works on a
  single audio file, with the waveform, spectrum or loudness shown in an upper
  and a lower display, and provides sample-accurate editing, analysis and error
  correction alongside a Spectrum tab used with the spectrogram for spectral
  work.

  The Audio Montage is a multichannel, multitrack, non-destructive environment
  for arranging, editing, playing back and recording audio clips. Track and clip
  effects, volume and pan automation, and fade and crossfade functions assemble
  clips across an unlimited number of mono or stereo tracks for mastering, album
  assembly, radio production and disc authoring.

  Real-time VST 3 plug-ins from any manufacturer, offline processors, external
  audio editors and external hardware devices can all be placed in the signal
  path. Batch processing and Watch Folders automate repeated work, for example
  running a plug-in chain, normalizing to R-128 loudness or converting to MP3.

  Version 13 added Dolby Atmos mastering with ADM file editing, a Dolby Atmos
  master montage and album montage, multicore rendering, sidechain routing from
  clips to track plug-ins, and new plug-ins including MasterRig 2, VocalChain,
  UltraShaper, PitchShifter, MixerDelay and Underwater.

  The range is sold as WaveLab Pro, the full version, alongside the reduced
  WaveLab Elements and the podcast-oriented WaveLab Cast.
specs: |-
  - Sample-accurate audio editor with waveform, spectrum and loudness displays
  - Spectral editing through the Spectrum tab and spectrogram
  - Multitrack, non-destructive Audio Montage with track and clip effects
  - Volume and pan automation with fade and crossfade functions
  - VST 3 plug-in support for third-party effects
  - Offline processors and external hardware effect integration
  - Batch processing and Watch Folders for automated workflows
  - R-128 loudness normalizing
  - Dolby Atmos mastering with ADM file editing
  - Audio CD and DVD-Audio authoring
  - Audio file comparer with residual peak reporting
  - Multicore rendering
