description: "Big Bang Orchestra: Altair - section essentials by Vienna
  symphonic library. Big Bang Orchestra: Altair presents a different take on
  Vienna's orchestral sound."
details: |-
  Big Bang Orchestra: Altair presents a different take on Vienna's synchron full
  orchestra recordings and the perfect enhancement to the tutti performances of
  big bang orchestra: andromeda. Bbo: altair provides completely new recordings
  of short and long notes that are played by the individual sections of the
  orchestra, as well as by all of them together (tutti).

  The appeal of this bbo pack lies in the particular way the tutti performances
  and the sections of strings, woodwinds, and brass were recorded: in the first
  pass, each note was played by the entire orchestra. Immediately afterwards,
  each section played this note with the same phrasing and style. It's as though
  the entire orchestra played the notes together, but in fact they didn't—you
  have separate recordings of strings, woodwinds, and brass ensembles available
  that you can combine and orchestrate any way you like.

  You can easily switch between the various registrations in the vienna synchron
  player that offers the tutti patch, the individual patches of strings,
  woodwinds, and brass, as well as combinations of strings/woodwinds,
  strings/brass, and woodwinds/brass. They all mix and match perfectly, and with
  the corresponding mixer presets they also blend seamlessly with the
  performances of bbo: andromeda, as well as all the other big bang orchestra
  packs.

  If you have bbo: andromeda, bbo: altair also provides you with slightly
  different tutti articulations. They're similar in sound and phrasing, but not
  the same, offering more variety and depth to your tutti performances as well
  as more options for layering.

  Bbo: altair uses the same microphone configuration that was used for recording
  bbo: andromeda, giving you access to a total of eleven mic setups that the
  vienna synchron player provides you with: main (decca tree stereo), main
  (decca tree center), main surround stereo, high stereo, high surround stereo,
  high strings, low strings, woodwinds close, horns close, trumpets close, and
  low brass close.
