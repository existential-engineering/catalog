details: |-
  Ai-de-esser is an ai-powered de-esser that delivers precise, transparent sibilance control for vocals and any audio material.

  Its adaptive engine uses machine learning to target high-frequency energy and apply spectral compression only where needed, preserving the natural tone and dynamics.

  With level-independent performance and an optional "air" boost, ai-de-esser ensures your track stays clear and present, even at maximum de-essing strength.

  The gui features a signature look with a few simple, yet powerful controls.
