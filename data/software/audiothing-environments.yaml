description: Environments is a creative reverb plugin built from remarkable
  real-world spaces, turning unique acoustic identities into living, playable
  reverbs.
details: |-
  Environments is an interactive experience between performer, sound, and acoustic space. Built from real places with unique sonic identities, it turns reverberation into something living and explorable rather than fixed and static. The environment itself becomes a musical instrument, shaping and transforming the sound in ever changing ways.

  The spaces captured in Environments are not ordinary rooms, but remarkable architectural environments chosen for their exceptional acoustics, historical character, and sonic individuality: the Temple of Mercury in Baia, the Piscina Mirabilis in Bacoli, and the Cisternone of Livorno.

  At the heart of Environments is a complex convolution engine that combines multiple impulse responses with different characteristics, giving each space depth and a more lifelike presence. Through the Room section, you can move within each captured environment and reshape its character, while modulation adds further motion and subtle variation over time.

  Environments also includes Gestures, an additional convolution layer built from sounds and resonances collected during the exploration of these places using spare parts, custom DIY feedback gear, and found objects developed through the Spare Parts Sound Project by artist Salvatore Carannante. Rather than traditional impulse responses, it uses resonant objects, actions, and feedback driven gestures captured on site, adding texture, rhythm, and a more physical sense of contact with the space.

  Environments is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP), and on the App Store for iOS and iPadOS (AUv3 and Standalone).
specs: |-
  - 3 Environments with 2 positions each
  - Room Simulator
  - Two LFOs
  - Gestures Loader
  - Resizable Window
  - Preset system with randomizer
  - Brightness and Contrast Controls
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP 64-bit)
  - macOS 10.13 - macOS 26, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP 64-bit)
  - 1 license up to 3 computers, no iLok, no internet connection required to activate
