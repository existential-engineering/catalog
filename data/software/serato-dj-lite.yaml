details: |-
  Serato DJ Lite is the free entry-level version of Serato's DJ software for Mac and PC, designed to help new DJs learn to mix without a license or subscription.

  Practice Mode lets users mix without DJ hardware, while a built-in Sampler panel with 4 slots and 6 FX presets plus 2 channel FX give room for creative routines.

  Serato Stems support enables real-time separation of tracks into vocals, melody, bass, and drum stems for mashups and acapellas.

  Music streaming integration is supported for Apple Music, Beatport, SoundCloud, Spotify, and TIDAL, giving access to large libraries directly inside the application.

  Serato DJ Lite is compatible with 50+ officially supported DJ controllers and offers an upgrade path to Serato DJ Pro via a free 14-day trial of the Serato DJ Pro Suite.
specs: |-
  - Practice Mode (mix without hardware)
  - 6 built-in FX presets and 2 channel FX
  - Sampler panel with 4 slots
  - Serato Stems real-time source separation
  - Music streaming integration (Apple Music, Beatport, SoundCloud, Spotify, TIDAL)
  - Compatibility with 50+ DJ controllers
