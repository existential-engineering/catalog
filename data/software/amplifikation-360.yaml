description: Amplifikation 360 is a virtual playground for stacking pedals,
  amps, and cabs to create the perfect sound you want.
details: |-
  Amplifikation 360 is the answer for a fast patch design, thanks to its uniquely intuitive, single screen graphic interface. Amplifikation 360 is also among the very few guitar amp sims which are really enjoyable to bring on a live performance.

  Create preset within minutes, plug any MIDI pedal controller and set the MIDI channels quickly and use live mode to quickly switch scenes smoothly without glitch/popping.

  Key features: free routing with unlimited device. Every amplifikation and efektor you owned automatically registered. All features from all kuassa plug-ins on a single interface. Assignable MIDI control. Live mode for seamless session change while playing. Movable interface panels. Looper/audio player. Combine effects in the container unit with various routing options. Chromatic tuner.
specs: |-
