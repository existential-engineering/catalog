details: |-
  Room Sound is proud to announce the release of our new collaboration with
  legendary producer and saosin guitarist beau burchell. This all-new library
  was meticulously sampled at the panoramic house studio, just outside of san
  francisco and features a number of drums and cymbals from beau's personal
  collection.

  Notable features include: 26 interchangeable kit pieces, including many types
  of drums and cymbals. 16 mixer channels, each with full microphone bleed and
  internal DAW-style effects modeled on vintage and modern gear.

  Adjustable MIDI mapping for compatibility with all electronic drum kits and
  MIDI controllers. Customized library of MIDI grooves in multiple tempos and
  playing styles.

  Both raw and mix-ready presets by beau burchell using the internal effects -
  no external mixing required.

  Compatible with the free kontakt player from native instruments for full
  compatibility to all major daws.
specs: |-
  - Kontakt player
  - 26 interchangeable kit pieces
  - 16 mixer channels
  - Microphone bleed
  - Internal DAW-style effects
  - Adjustable MIDI mapping
  - MIDI grooves in multiple tempos
