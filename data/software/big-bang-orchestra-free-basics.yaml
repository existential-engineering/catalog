details: |-
  Providing a "tutti" orchestra is a first for Vienna symphonic library. We've
  recorded our entire synchron stage orchestra playing together, all at once,
  with multiple microphones. Capturing the sheer power of a Massive orchestra
  with the signature acoustics of synchron stage Vienna's stage a was one of the
  most riveting sampling experiences we've ever had.

  Create large orchestrations in no time. Beef up your existing tracks by adding
  massive tutti layers. Inject some inspiration into your composing process just
  by pressing a few notes and letting the colossal sound work its magic.
  Articulations include staccatos, sustains, marcatos, swells and runs just what
  you need to create earth-shattering accents, awe-inspiring "braahms" and
  nerve-wracking tension cues.

  Using the synchron player's full-blown mixer, you can adjust the level of the
  various mic signals or change the sound and ambience of the entire ensemble in
  the room. With the included mixer presets with settings from "close" to
  "distant" it's easy to achieve perfect results. Use the "processed" presets to
  summon a modern, fat orchestral sound with a simple mouse click.

  Big bang orchestra supports native instruments' nks format and is compatible
  with komplete kontrol keyboards and maschine. Use the light guide to quickly
  identify key switches and play ranges of your instruments, browse and preview
  sounds, and quickly adapt them using pre-configured control knobs.
