details: >-
  Abstructs is a collection of twelve max for live devices able to create sounds
  or perform sonic transformations that are typical to certain abstract
  electronic music and sound art.


  Abstractsynth: an atmospheric polyphonic synthesizer that creates the sound
  from a dense and ever evolving spectrum. Bishift: an effect that allows to
  shift the magnitude and the phase of the spectrum separately, so that it can
  act as a complex and strange pitchshifter. Brokendelays: a delay that features
  up to 16 delay lines, and that abruptly changes their lengths (and their
  actual chances to be played) rhythmically.


  Disturbances: a generator of stutters and noise interference to the incoming
  audio. Essence: an effect that analyzes the spectrum of the incoming sound and
  returns only its most prominent features. Fromouterspace: a drone generator.
  Infinitetrain: a pulse-train generator that can create abstract punctiform
  sound patterns often found in glitch and minimal music.


  Madhatter: a polyphonic hi-hat synthesizer that it can also work like a
  complete unusual synthesizer. Onetomany: a 32-voice sample player that changes
  its parameters every time it is triggered, so that from a single sample a
  whole range of barely predictable sounds can be obtained.


  Sinebursts: an instrument to create high pitched sounds, noises and glitches.
  Spectroglitch: an effect that randomly suppress or invert the magnitude or the
  phase of the spectrum of the incoming sound. Spectrosynth: a compact
  polyphonic synthesizer to create sounds with a wide and complex timbre.
specs: |-
  - Max for live devices
  - Polyphonic synthesizer
  - Spectral analysis
  - Delay effect with up to 16 delay lines
  - Sample player with 32 voices
  - Pulse-train generator
  - Hi-hat synthesizer
  - Noise generator
  - Glitch generator
  - Pitch shifting effect
  - Phase manipulation
  - Magnitude shifting
