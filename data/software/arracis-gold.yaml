details: |-
  Arracis Gold is an oscillator stepping synthesizer. Its most significant
  feature is the 4 x 8 osc step-sequencer with adjustable gate-length +
  modulation on gate-length. With this step-sequencer you can have a quite
  rhythmical output incl. Short blips (stepping among the oscillators in
  selectable sequence) plus mixing to the normal (steady) output signal for
  vivid pad or atmos.

  In addition the 2 filters provide further means for tweaking. Finally at the
  output section there is spook fx and two delays in series incl. Pan modulation
  for delay and direct out for spatial movement.

  Arracis gold pro is a four oscillator step sequencer synthesizer with a large
  number of built-in sample waveforms which can be switched and modulated in up
  to eight steps per loop (host synced, common note values, dotted, triplet).
  The stepper can advance regularly or in an irregular fashion (e.g. Every 5th
  step).

  The sound is then shaped by a resonant lp-hp filter combination, a "spook"
  effect (kind of a phaser-flanger-delay), a bass enhancer and a synced stereo
  delay effect with pan modulation. Most modulation targets allow selection
  between two synced lfos, two unsynced special wave lfos, two slow lfos and an
  s/h modulator source.

  Arracis gold pro is well suited for eerie sound scapes, beautiful undulating
  pads, melodic sequence and arpeggio lines and rhythmic textures. The wealth of
  parameters with sensibly tuned value ranges and its vivid sound shaping
  possibilities make arracis gold a nice instrument for live performance.
specs: |-
  - 4 PCM wave oscillators with 384 waves in 3 banks
  - 4 x 8 osc step-sequencer with adjustable gate-length
  - Modulation on gate-length
  - Mixable output in groups of 2
  - User wave & sf2 files loadable into each osc slot
  - 1 24 dB resonant LP filter with ADSR eg and modulation
  - 1 12 dB resonant HP filter with ADSR eg and modulation
  - Filter bypass + modulation
  - 1 bass enhance
  - 1 spook FX
  - 2 delays in series
  - 3 pan (direct, delay 1 and delay 2) incl. Modulation
  - 6 LFO + 1 s&h as mod sources
  - 6 lazy buttons
  - 10 voices
  - Key velocity on amp, LP & HP cut, and filter bypass
  - Windows compatible
  - Free version limited to 128 waves per oscillator, three voices, sf2 and wave
  load for osc 1 & 2
