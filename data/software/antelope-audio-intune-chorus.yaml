  correction, and tonal control. Free 14-day trial."
details: |-
  InTune Chorus is a vocal layering plugin that creates a five-part vocal ensemble from one input voice. With fine-tuned pitch, timing, stereo spread, and tonal variation controls, it delivers instantly mixable vocal groups – ideal for pop, R&B, gospel, EDM, or cinematic backing layers.

  Whether you want subtle depth or full choral textures, InTune Chorus puts a professional vocal arrangement at your fingertips.

  Five-Part Vocal Ensemble Generator – instantly create five harmony voices from a single vocal input. Add depth, width, and character without needing multiple takes or external vocalists.

  Detune & Delay for Natural Variation – set pitch and timing offsets between voices to simulate the subtle differences of real vocal groups. Maximum Detune of ±50 cents (spread across ±100) ensures organic, musical variation.

  Voice-Specific Tone & Role Controls – fine-tune the presence of key voices like Bass, Fifth, and Soprano for realistic ensemble shaping. Use the Color control to adjust the tonal character of each generated voice.

  Stereo Imaging with Space Control – arrange the voices across the stereo field using a simple Space dial. A setting of 0 keeps the signal mono; 180 spreads the ensemble fully from left to right for a wide, immersive chorus effect.

  Integrated Pitch Correction with InTune Engine – enable the InTune button for real-time pitch correction of the lead vocal. Ensures all generated voices stay harmonically tight and musically aligned.

  Runs natively in your DAW on macOS or Windows. Included in the Antelope Cosmos plugin collection (75+ Antelope Native Plugins) with a free 14-day trial.
specs: |-
  - Five-part vocal ensemble generator from a single input voice
  - Maximum Detune of ±50 cents (spread across ±100) for natural variation
  - Pitch and timing (delay) offsets between voices
  - Voice-specific tone and role controls (Bass, Fifth, Soprano)
  - Color control for tonal character of each generated voice
  - Space dial for stereo imaging (0 = mono, 180 = full L/R spread)
  - Integrated real-time pitch correction via the InTune Engine
  - Native plugin for macOS and Windows DAWs
