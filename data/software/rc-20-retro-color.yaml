details: |-
  RC-20 Retro Color is a creative effect plugin from XLN Audio that adds life and texture to any recording, easily recreating the warm, cozy feeling of vintage recording equipment.

  The plugin features six distinct effect modules: a Noise Generator for vinyl crackle, tape hiss, studio noise, and circuit hum; Wobble and Flutter for analog pitch inconsistencies; Saturation and Distortion ranging from mild to aggressive; a Degrader and Bitcrusher for vintage digital gear emulation; Reverb for depth and spatial effects; and Volume Drops simulating tape wear and loss.

  Each module can be used independently or combined to create unique textures and sonic character. The Magnitude slider provides a single-knob control for dialing in the overall intensity of the effect chain.

  RC-20 Retro Color is compatible with major DAWs including Ableton Live 10+, Logic Pro 10+, Pro Tools 11+, FL Studio 20+, Cubase 10+, Reaper 5+, Reason 9.5+, and Cakewalk by BandLab. A 10-day free trial is available.
specs: |-
  - 6 effect modules: Noise, Wobble, Distortion, Degrader, Reverb, Volume
  - Noise Generator with vinyl crackle, tape hiss, studio noise, and circuit hum
  - Wobble and Flutter for analog pitch inconsistencies
  - Saturation and Distortion from mild to aggressive
  - Degrader and Bitcrusher for vintage digital gear emulation
  - Reverb module for depth and spatial effects
  - Volume Drops simulating tape wear and loss
  - Magnitude slider for single-knob intensity control
  - macOS 10.13 or later (64-bit)
  - Windows 10 or 11 (64-bit)
