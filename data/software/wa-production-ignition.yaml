description: A single-window multi-effects plugin that chains six processing modules for mixing and sound shaping. The modules can be reordered freely and each offers several character algorithms.
details: |-
  Ignition is a single-page effects toolkit that combines compression, saturation, clipping, EQ shaping, spectral clean up, transient control and stereo widening in one plugin. Factory chains were designed in collaboration with dance music producers, and every effect offers multiple character models.

  Six processing modules make up the core. Dynamics offers seven character modes, from subtle cohesion to heavy compression. Saturate provides seven saturation types covering warm analog character through to harder crunch. Clipper carries six algorithms for peak control. EQ supplies production-ready curves for low and high shaping. Clean Up applies spectrum smoothing to reduce harshness and uneven peaks. Transient adjusts attack and sustain across different frequency ranges.

  The six modules can be reordered by drag and drop, so a signal can be compressed before saturation or transient shaped after an EQ boost. Custom signal flows are possible rather than a fixed chain.

  Beyond the six modules, Ignition adds a preamp for signal boosting, a stereo width control for mono-compatible imaging, a Monomaker for bass placement, and master high pass and low pass filters for overall frequency response.

  The interface is built on vector graphics and is resizable, with live meters for monitoring the signal chain. A/B comparison, copy and paste, and undo and redo are available. Factory presets curated by engineers and artists cover a range of effect chains, and users can save their own snapshots.
specs: |-
  - Hot-swappable multi-effects chain with artist-designed presets
  - Six FX modules: Dynamics, Saturate, Clipper, EQ, Clean Up, Transient
  - Multiple character models per module
  - Global controls for EQ, stereo width, Monomaker and preamp
  - A/B comparison with undo and redo
  - Limiting and automatic gain compensation
  - Resizable vector interface with live metering
  - PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Intel and Apple Silicon CPUs supported, with native AAX
