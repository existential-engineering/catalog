description: Software emulation of the legendary Oberheim 8-Voice synthesizer,
  the first software instrument to receive Tom Oberheim's personal endorsement.
  Features octaphonic architecture with eight independent SEMs, each containing
  three oscillators, a multimode filter, two envelope generators, and modulation
  controls. Includes 8-step sequencer, stereo delay and reverb, and 700+ factory
  patches.
details: |-
  Sounding huge, the OB-E takes the Synthesizer Expander Module (SEM) based 8-Voice, a.k.a. the EVS, into new sonic territory via a raft of enhancements and additions. The concept of the 8-Voice is simple: a single SEM contains two VCOs with pulse and sawtooth waveforms, two ADS envelope generators, one LFO and a multi-mode filter. In isolation each SEM is monophonic, but in the 8-Voice, because eight SEMs are triggered by a polyphonic keyboard, you have an eight-note polyphonic synthesizer. This octaphonic architecture offers creative possibilities to producers, composers and sound designers in the digital realm.

  GForce emulated every section of the synth for sonic authenticity while adding software control over those eight SEMs. Mono, Mono Legato, Poly, Unison and Split keyboard modes are all available. Added to this is a new VCO3, doubling as an audio-rate LFO for each SEM, and performance controls via velocity, polyphonic aftertouch and MPE.

  As GForce neared the release of OB-E they were contacted by Tom Oberheim and Marcus Ryle, an Oberheim engineer in the 1980s, who suggested a collaboration to refine OB-E and release the v2 update carrying their full endorsement. Working under Tom and Marcus’s guidance, the Detune feature was refined and a new Vintage control added, dialling in more realistic musical inaccuracies in line with the original instrument.

  OB-E v2 adds a new reverb, 100+ new patches bringing the total to over 700, a new Zoom function for the sequencer and a Drum Mode enabling each SEM to be triggered by a dedicated key, with 10 drum kit presets included. With the original MS-1 sequencer as a starting reference, an 8-step sequencer is integrated; in keyboard Split mode with the sequencer routed to SEM 8, OB-E can create a three-part soundscape within a single patch, alongside a routable stereo delay and reverb.

  The 8-Voice is not simply eight identical SEMs put together. The interaction of eight independent and slightly different Synthesizer Expander Modules plays a major role in the 8-Voice’s sound, and injecting those authentic inaccuracies into each of OB-E’s eight SEMs is what blurs the line with the hardware. Every Oberheim OB-E purchase now includes a complimentary Oberheim OB-EZ licence.
