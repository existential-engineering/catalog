description: Software emulation of the legendary Oberheim 8-Voice synthesizer, the first software instrument to receive Tom Oberheim's personal endorsement. Features octaphonic architecture with eight independent SEMs, each containing three oscillators, a multimode filter, two envelope generators, and modulation controls. Includes 8-step sequencer, stereo delay and reverb, and 700+ factory patches.
details: |-
  The OB-E authentically recreates the Oberheim Eight-Voice — one of the most iconic polyphonic synthesizers of the 1970s. Its architecture is built around eight independent Synthesizer Expander Modules (SEMs), each operating as a standalone voice, delivering the lush, organic polyphony that defined the original hardware.

  Tom Oberheim personally endorsed and contributed to the development of this emulation, ensuring sonic accuracy and character true to the original instrument. The result is a deeply playable instrument that captures the warmth, drift, and expressiveness of the hardware while adding modern workflow improvements.

  OB-E ships with over 700 factory patches, all tagged and categorized for quick browsing. Beyond classic polyphonic pads, leads, and basses, it includes a Drum Mode with 10 drum kit presets, a built-in sequencer, stereo delay, and reverb. A Vintage control and refined detune parameter let players dial in the characteristic instability of the original hardware.

  Modern performance features include MPE and polyphonic aftertouch support, multiple keyboard modes (mono, poly, unison, split), UI scaling, and a SEM zoom function for detailed per-voice editing. A complimentary OB-EZ license is included with purchase.
