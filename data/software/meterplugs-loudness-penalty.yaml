description: Loudness Penalty 2 is a plugin that shows how online streaming services will adjust your music's loudness levels, letting you preview the impact before uploading.
details: |-
  Loudness Penalty 2 is a major update to the original Loudness Penalty plugin, designed to show producers exactly how streaming platforms will adjust their music's loudness before they upload. It provides real-time loudness penalty scoring across all major streaming services including Spotify, YouTube, Apple Music, Amazon, TIDAL, Deezer, and Pandora.

  The plugin features a new 'block view' that displays true peak, integrated loudness, and loudness range simultaneously, giving a comprehensive snapshot of a track's loudness characteristics at a glance.

  A key feature is the ability to preview Spotify's limiter in action, with a delta button that lets you hear the limiter's effect in isolation. The plugin also supports Spotify's Quiet, Normal, and Loud playback settings, as well as YouTube Music and YouTube Video modes.

  Loudness Penalty 2 includes a fully resizable UI with a compact 'mini' mode for convenience. Score locking functionality is available, and in Pro Tools it supports faster-than-real-time processing via Audio Suite.

  Existing Loudness Penalty v1 users are eligible for a discounted upgrade path.
specs: |-
  - macOS 10.7 or later (64-bit Intel or Apple Silicon)
  - Windows XP SP3 or later (32/64-bit)
  - Streaming services: Spotify (Quiet/Normal/Loud), YouTube, YouTube Music, Apple Music, Amazon, TIDAL, Deezer, Pandora
  - Block view: simultaneous true peak, integrated loudness, and loudness range display
  - Spotify limiter preview with delta/isolation mode
  - Fully resizable UI with compact mini mode
  - Score locking
  - Faster than real-time processing in Pro Tools Audio Suite
