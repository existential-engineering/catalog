description: HoRNet LU Meter MK2 is an LUFS meter with auto gain and grouping functions. The new resizable GUI hides a smart tool for your mixes
details: |-
  The HoRNet LU Meter MK2 is a professional-grade digital loudness meter designed to take your mixing and mastering workflow to the next level. Featuring advanced auto gain staging and grouping functions, this plugin ensures your audio levels are consistent, accurate, and perfectly tailored to modern loudness standards. Its redesigned and resizable GUI offers an intuitive user experience, concealing a powerful tool beneath its simplicity.

  At the heart of the LU Meter MK2 is its use of Loudness Units (LU), a measurement system based on human perception of sound. Unlike traditional meters, which may struggle to provide accurate readings across different frequencies, the LUFS-based approach ensures that sounds of varying frequencies but identical levels are measured accurately. This allows you to make better-informed mixing decisions and achieve a balanced and polished sound.

  The HoRNet LU Meter MK2 provides three essential loudness measurements: momentary, short-term, and integrated loudness, all adhering to the widely recognized EBU R128 standard. Whether you’re mixing for streaming platforms, broadcast, or live performance, this plugin ensures that your audio complies with the appropriate loudness guidelines.

  A standout feature of the LU Meter MK2 is its ability to apply the “ auto gain ” concept. By dynamically adjusting the gain, the plugin keeps your signal within the chosen LU level, ensuring consistent loudness throughout your mix or master. This functionality is incredibly flexible—you can choose to follow the EBU standard (which sums all channels into a single reading) or operate in a non-standard mode, where channels are measured separately. This versatility makes the LU Meter MK2 suitable for a wide variety of audio projects.
specs: |-
  - LUFS meter with momentary, short term and integrated readings.
  - LU peak hold.
  - RED blink clipping indicator.
  - Reference level settable from -60 to 0 LUFS.
  - Input gain from -30dB to +30dB.
  - Bar color freely selectable.
  - Stereo automatic gain adjustment with 6 different settings.
  - Auto gain with momentary or integrated method.
  - Peak protection between (no peak can exceed the set limit).
  - Auto Gain and meter setting can be set to whole group or to every instance at once.
  - Eight different assignable groups.
  - Stereo display.
  - Every instance can be named.
  - Groups names freely editable.
  - Ever instance of the plugin can display the value of every other named instance.
  - Standard compliance mode with EBU R128 momentary, short term or integrated.
  - Hardware accelerated GUI
  - Apple Silicon native support
  - Mac OS X (10.11 and later) and Windows (7 and later) support.
  - 64-bit plugins for macOS and Windows.
  - Audio Units, VST, VST3 and AAX format.
