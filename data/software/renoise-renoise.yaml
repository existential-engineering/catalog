details: |-
  Renoise is a complete, multi-platform and expandable Digital Audio
  Workstation. It lets you record, compose, edit, process and render
  production-quality audio using a music-tracker based approach.
  Unlike traditional timeline-based DAWs, Renoise organizes pattern
  data vertically, enabling quick editing via keyboard shortcuts
  with no floating windows to manage.

  The application runs on Windows, macOS, and Linux with a single
  license covering all platforms. macOS builds ship as Universal
  binaries (Intel and Apple Silicon), while Linux is provided for
  both x86_64 and arm64. JACK is fully supported on Linux, and MIDI
  plus OSC (Open Sound Control) allow Renoise to integrate with
  hardware and other audio applications as a server or client.

  Sound design is powered by over 26 native effects (reverb, delay,
  filters, compressors, EQ, distortion, flanger, phaser, and more)
  alongside Meta Devices such as the Signal Follower, LFO, X/Y Pad,
  and Meta Mixer for modulating other device parameters. Renoise
  supports VST, AU, LADSPA, and DSSI plugin formats, and the Plugin
  Grabber can convert plugin synths into CPU-friendly multi-sample
  instruments.

  A built-in Sample Editor, Render To Sample, Spectrum Analyzer,
  graphical automation envelopes, and a flexible Mixer with
  Send/Group/Master tracks round out the production toolkit.
  Multi-Channel I/O, Multi-Core Support, automatic Plugin Delay
  Compensation, and Track Grouping address performance and routing
  needs.

  Renoise is extensible through a Lua scripting API, exposing
  application internals so users can build custom tools and
  integrations.
specs: |-
  - Cross-platform: Windows, macOS, Linux (single license covers all)
  - Tracker-based interface with keyboard-driven workflow
  - 26+ native effects (reverb, delay, filters, compressors, EQ, distortion, flanger, phaser)
  - Meta Devices: Signal Follower, LFO, X/Y Pad, Meta Mixer
  - Plugin support: VST, AU, LADSPA, DSSI
  - Plugin Grabber converts plugin synths to multi-sample instruments
  - Sample Editor with audition and editing
  - Render To Sample for bouncing effected audio to instruments
  - JACK audio interconnection support on Linux
  - MIDI input/output with master/slave sync
  - OSC (Open Sound Control) server and client support
  - Customizable built-in spectrum analyzer
  - Graphical automation envelopes
  - Flexible mixer with DSP chain management
  - Send, Group, and Master track routing
  - Multi-channel hardware I/O
  - Multi-core CPU support
  - Automatic Plugin Delay Compensation (PDC)
  - Track grouping for organization and routing
  - Lua scripting API for customization and extension
  - macOS Universal binary (Intel and Apple Silicon)
  - Linux available for x86_64 and arm64
