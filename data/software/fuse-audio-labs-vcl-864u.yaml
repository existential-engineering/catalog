description: An uncompromising circuit-model recreation of the Federal AM-864/U, a Vari-Mu tube limiter developed for US military communications during the Korean War. After the war, audio engineers discovered its exceptional compression characteristics — a massive, meaty midrange and musical release curves ideal for taming highly dynamic vocals, drums, and keys. The plugin mirrors every detail of the original circuit while adding switchable release time constants, sidechain high-pass filter, adjustable noise floor, and a dry/wet mix.
details: |-
  Emulates the Federal AM-864/U (Korean War-era Vari-Mu tube limiter, US military communications). Plugin name 'VCL-864U' directly encodes the hardware model number '864U'. The original unit's manual included instructions for destroying it to keep it out of enemy hands. Controls added beyond original: switchable release time constants, sidechain high-pass filter, adjustable noise floor level, dry/wet mix, linear output control, compensated input gain. Introductory launch price was $29 (2019); regular price $69.
specs: |-
  Controls: Gain (compensated input), Release (switchable time constants), Sidechain high-pass filter, Noise floor level, Mix (dry/wet), Linear output. macOS 10.9+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+ (32-bit and 64-bit), 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX. Copy protection: serial number.
