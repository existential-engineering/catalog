description: "A cross-platform plugin analyzer for VST and AU plugins designed
  for both developers and power users, featuring a double precision FFT engine
  and independent stereo channel analysis."
details: |-
  Linear and harmonic analysis modes
  Oscilloscope functionality
  Dynamics testing with ramping and attack-release signals
  Performance measurement (callback timing)
  Dual plugin parallel loading
  Resizable interface
  Three FFT quality settings
  Curve storage and comparison
  Screenshot function
  32-bit and 64-bit standalone and plugin versions
