description: "A cross-platform plugin analyzer for VST and AU plugins designed
  for both developers and power users, featuring a double precision FFT engine
  and independent stereo channel analysis."
details: |-
  Linear and harmonic analysis modes
  Oscilloscope functionality
  Dynamics testing with ramping and attack-release signals
  Performance measurement (callback timing)
  Dual plugin parallel loading
  Resizable interface
  Three FFT quality settings
  Curve storage and comparison
  Screenshot function
  32-bit and 64-bit standalone and plugin versions
specs: |-
  - Highest quality, double precision FFT engine with independent stereo channel analysis
  - Two independent plugin chains with up to 6 plugins per chain
  - Parallel or difference analysis of chains
  - Linear analysis: magnitude and phase response using delta or random input signal
  - Harmonic analysis: THD/THD+N calculation; switchable intermodular distortion mode; sweep function
  - Oscilloscope: real-time visualization of sinusoidal input signal
  - Dynamics testing: ramping signal for compression/expansion; attack-release signal for compressor curves
  - Performance measurement: audio processing callback time as a function of buffer size
  - Freely resizable user interface
  - Three quality settings corresponding to three FFT buffer sizes
  - Curve storage in Linear and Harmonic analysis modes for easy comparison
  - Built-in screenshot function
  - Standalone version: 32-bit and 64-bit executables
  - Plugin version: VST/VST3/AU/AAX format for parallel analyzing in DAW
  - Can load VST, VST3, and AU (Mac) effect plugins
  - Minimum requirements: Windows 10 or macOS 10.13 (64-bit)
