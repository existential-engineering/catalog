  This collection of ableton drum racks features all factory presets for the
  native instruments abbey road vintage drummer.


  Ease of navigation to load all presets directly from your ableton push
  controller device browser. 4 ableton drum racks to instantly load the abbey
  road vintage drummer factory library preset with ableton mappings. Optimized
  for ableton push 2! Color coded pad design for visual performance. Know your
  rides from your crashes.


