details: |-
  Designed specifically for Pro Tools based adr recording studios, and
  incorporating all the features of adr master 2 editor, ADR Master 2 Studio
  adds vital adr recording tools & additional support for a second video
  hardware device output.

  Harness the advanced remote recording & track control of the active pro tools
  session with DAW control. Take a load off by pre-defining in the dedicated
  track matrix which pro tools tracks you want to hear during adr cue rehearse,
  record, or review modes.

  Tightly integrated with your current pro tools session, adr master is your
  perfect companion for recording adr. It provides all the timing cues your
  actors will need to deliver their best performance - including beeps,
  on-screen wipes, countdowns, text, black screens, and more.

  Adr master studio offers many ways to create, import or edit adr cue visual
  events. Create them quickly & directly in adr master with a single button
  press, from a text file stored in one of the many supported formats (csv, adr
  studio xml, pro tools session info text file, script, etc) or grab & fine-tune
  them directly from a pro tools timeline selection.

  Adr master studio is the only solution on the market which allows you to use
  two of the supported blackmagic &/or aja devices at the same time and assign
  different outputs to them (e.g. One masked for the talent and one clean for
  the director). It will display the video on all attached devices as well as
  the inbuilt player view at the same time and ensure that all the displays are
  in perfect sync, using display delay compensation for each video device.
