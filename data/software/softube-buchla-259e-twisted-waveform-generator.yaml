description: Buchla 259e Twisted Waveform Generator is a dual oscillator plugin
  created in collaboration with Buchla as a Modular expansion. It's perfect for
  screeching, metallic, harsh, digital sounds.
details: |-
  With the 259e, the answer is — pretty twisted. A coveted dual oscillator module now available for Softube Modular, Buchla 259e Twisted Waveform Generator is the first-ever officially licensed plug-in version of a Buchla product. While the unit can be used for traditional synth patches, its unusual inner workings makes Buchla 259e excel at metallic, cold, harsh, digital and screeching sounds.

  The digital parts are ported from the hardware line by line, the wavetables byte by byte, and the analog parts are modeled component by component.

  Beyond the harsh end of its range, the 259e can also be tamed to sound quite smooth and organic, and it morphs smoothly between these softer sounds and the more in-your-face sounds.

  Made for Modular, Softube's Eurorack platform. The module runs inside Modular rather than as a standalone plug-in.

  Morton Subotnick, artist, synthesist and musical pioneer: "The Twisted Waveform Generator is one of Buchla's many complicated and mysterious modules. I honestly did not expect a digital version to capture the richness of this maverick device. But, Softube has, amazingly, captured everything I have, so far, imagined about the oscillator. The Twisted plugin is now an important element in my Buchla + Computer performances."
