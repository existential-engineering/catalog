details: >-
  The ad 480 is a professional reverb effect for idevices. It comes in three
  different versions, ad 480 free, ad 480 basic and ad 480 pro. The algorithm is
  inspired by legendary studio reverb units.


  The ad 480 basic has professional reverb sound effect with variable room size,
  ios 7 ready compatibility, and full audiobus integration.


  The application supports internal and external audio interfaces (USB class
  compliant or mfi), and features an extensive filter layout for a wide spectrum
  of sound with access to all sound parameters.


  Compatible with ipad 2, ipod touch 5g, iphone 4s and above, with interapp
  audio support and dynamic upgrade functionality where ad 480 basic is
  automatically upgraded to pro features when ad 480 pro is installed.


  Inapp purchase option available for upgrading to ad 480 pro.
