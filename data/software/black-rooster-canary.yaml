description: A free drum transient and sustain shaper. Add punch to snares, tune weight into kicks and revive dull close-mic'd drums.
details: |-
  Every engineer knows the disappointment: a kit that hit like a truck in the room, tracked to a close mic, and suddenly it sounds like someone drumming on a cardboard box. The Canary is a free drum transient and sustain shaper built to put that lost life back. It doesn't just squash or gate, it synthesises the attack and sustain the recording never captured, then blends it back in. You get punch where the transient went missing and body where the shell rings out, on tap.

  Most dynamics tools work by taking things away, a transient designer clamps down, a gate chops the tail. The Canary goes the other direction. It analyses the input with a differential envelope detector and generates new attack and sustain components that are triggered by the drum hits, so they follow the performance instead of fighting it. That means you can recover tone, attack and sustain that may have been lost during the recording process, or which haven't been there in the first place. Because it runs with zero latency, there's no delay compensation to think about, handy when monitoring while tracking.

  The Attack knob sets how much of the synthesised attack gets added. On a dull, close-mic'd snare or a tom that won't cut, this is the go-to move, it puts the crack and impact back so the drum steps through a dense mix. Depending on the Filter chosen, it reads as either more punch or a crisper top-end snap. The Sustain knob adds a synthetic sustain phase, and its Tune control lets you pitch that sustain to sit in the key of the song. The Filter itself steps through four voicings matched to different shell types, Low Pass, Band Pass, High Pass and Scoop, so the added components land where each drum needs them.

  On a thin, gutless bass drum, dial in a lower Tune, set the Filter to Low Pass, bring up Sustain, and blend to taste for instant weight and thump. On snares and toms, lean on Attack with a Band Pass or High Pass voicing to restore the crack. On drum loops and sampled kits, use it as an effect to reshape a stale one-shot into something with front and body. The Mix knob blends dry against processed signal, starting near three o'clock, then pulling back to whatever fits the track.
