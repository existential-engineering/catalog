details: |-
  The Antelope Audio Power EX is an in-house expander, featured in all of Antelope's interfaces. It features a comprehensive set of controls, including Threshold, Range, Ratio, Attack and Decay knobs with an additional Gain knob allowing some extra control over the volume.

  It is an unpretentious unit, but its simplicity hides a lot of potential for sound shaping. Being powered by the Antelope Audio FPGA platform is a guarantee for an authentic sound, comparable to real hardware expanders.

  PowerEX runs in real-time on Synergy Core interfaces, leveraging Antelope's onboard DSP/FPGA acceleration so the plugin can be tracked through with near-zero latency in addition to use in DAW mixing sessions.
specs: |-
  - Real-time processing on Synergy Core interfaces via Antelope FPGA platform
  - Threshold control
  - Range control
  - Ratio control
  - Attack control
  - Decay control
  - Gain (output) control
  - Modeled to deliver authentic sound comparable to real hardware expanders
