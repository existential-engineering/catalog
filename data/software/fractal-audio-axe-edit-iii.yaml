description: Axe-Edit III is the free companion software for the Axe-Fx III.
  Edit on the big screen with your mouse and keyboard.
details: |-
  Axe-Edit III is a full-featured Mac/PC editor for the Axe-Fx III. You can view, edit, and manage presets, and much more.

  You will immediately discover the advantage of working on a large computer screen with a full keyboard and mouse/touchpad. Axe-Edit III makes it even easier to create and dial in even the most complex setups.

  You can view, edit, copy, paste, save, swap or even drag-and-drop not just presets, but scenes, blocks, channels, user cabs, and more.

  Speed your workflow with preset Templates, or use the Block Library stored on your computer to access your favorite sounds in one click.

  Unlock your full creative potential with Axe-Edit III, available below for free. Version 1.15.03 is dated October 30, 2026, and is offered as a Mac build and a Windows build, with a separate 32-bit Windows build also available.
specs: |-
  - Free companion editor and librarian for the Axe-Fx III
  - View, edit, copy, paste, save, swap and drag-and-drop presets, scenes, blocks, channels and user cabs
  - Build presets and edit parameters including modifiers
  - Enter preset names and scene names from the computer keyboard
  - Axe-Manage for managing presets and user cabs
  - Preset Templates and a computer-side Block Library for one-click recall
  - Mac build requires OS X version 10.13 or newer
  - Windows build requires Windows 10 or newer (64-bit only); a 32-bit build is also offered
versions:
  - name: 1.15.03
    releaseDate: 2026-10-30
