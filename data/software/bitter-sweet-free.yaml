details: |-
  Bitter sweet is a free dynamics processor to manage audio transients. Turning
  the central button on the sweet side, decreases the transients amplitude. On
  the bitter side, the transients amplitude is magnified.

  Bitter sweet also features a control for the signal to be processed. When the
  main position is engaged, the process affects the stereo signal. If center is
  engaged, only the m signal of the internal ms matrix is processed. If stereo
  is selected, only the s signal from the ms matrix is processed.

  The plugin features a time adjustment slider that controls the length of the
  decline. The attack phase is adjustable with flexible results, and the plugin
  uses soft limiting to attempt to remain the original character of the sound
  without additional coloration.

  Bitter sweet is a virtual effect audio plugin for macos and windows. It
  functions as a VST plugin, an audio units plugin, a VST 3 plugin and an AAX
  plugin.
specs: |-
  - Dynamics processor
  - Transient shaper
  - M/s processing
  - Mid/side matrix
  - Stereo signal processing
  - Center signal processing
  - Side signal processing
  - Attack adjustment
  - Decline length adjustment
  - Soft limiting
  - macOS support
  - Windows support
  - Universal 2 binary
