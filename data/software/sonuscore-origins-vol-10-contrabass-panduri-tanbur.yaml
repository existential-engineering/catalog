description: "ORIGINS VOL. 10: CONTRABASS PANDURI & TANBUR is a deeply sampled Kontakt instrument in which the deep sonority of the Contrabass Panduri perfectly complements the twangy drones of the Tanbur."
details: |-
  The deep sonority of the Contrabass Panduri perfectly complements the twangy drones of the Tanbur. Though the two instruments come from neighboring regions, the Contrabass Panduri is so rare that this excellent pairing has perhaps never occurred. Until now.

  A modern innovation, the Contrabass Panduri was modified from the traditional Panduri to answer the need Georgians had for a low-registry instrument for concert folk performances. It is a true rarity of an instrument with perhaps only 10 existing in the country of Georgia itself. The Tanbur is an ancient Middle-Eastern, long-necked lute-like instrument whose drones and picks have graced musical tradition from the Balkans, Turkey, and Arabia to Persia, India, and Central Asia.

  The Multi-Arpeggio-Designer is the centerpiece of every ORIGINS instrument. Two fully customizable arpeggiators create interlocking patterns and broad soundscapes by combining the unique timbres of the two ethnic strings instruments. The engine is designed to convey a musically meaningful, human performance, instead of a computer randomly aligning notes. Load up one of 80+ inspiring presets or create your own arpeggios in as much detail as you like. The presets are divided into Normal, which provides 4/4 arpeggios, and Odd, which explores time signatures such as 5/8, 7/8 and 3/4.

  The 12 individual color-presets provide even more possibilities to sculpt your sound. All colors are radically different in character and incorporate various effect settings and multiple impulse responses. While each MAD-Preset has an assigned color, you can combine everything at will, resulting in over 1000 predefined combinations. Arpeggio designs can also be copied and pasted between different instruments of the ORIGINS series.
specs: |-
  - Two individually playable instruments: Contrabass Panduri and Tanbur
  - Innovative Multi-Arpeggio-Designer (MAD) with two fully customizable arpeggiators
  - 80 rhythm presets, split into Normal (4/4) and Odd (5/8, 7/8, 3/4 and more) categories
  - 12 unique color settings, combinable for over 1000 predefined combinations
  - Full customization of all controls
  - Arpeggio designs can be copied between different ORIGINS instruments
  - Requires FULL VERSION of Native Instruments' KONTAKT 6.7.1 or higher (the free Kontakt PLAYER only runs the instrument in demo mode)
  - Intel Macs (i5 or higher): macOS 10.14, 10.15, 11 or 12 (latest update)
  - Apple Silicon Macs (via Rosetta 2, and natively on ARM in Standalone or in hosts that support it): macOS 11 or 12 (latest update)
  - Windows 10 or 11 (latest Service Pack), Intel Core i5 or equivalent CPU, 2 GB RAM
  - Graphics hardware support for OpenGL 2.1 or higher
  - 4 GB RAM (6 GB recommended for large KONTAKT Instruments)
  - At least 610 MB of free hard disc space
  - Available as a download
