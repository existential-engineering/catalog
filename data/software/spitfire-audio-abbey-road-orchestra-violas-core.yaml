details: |-
  The stunning sound of a Viola section - captured at Abbey Road Studios. This virtual instrument offers key articulations and playing styles: lyrical and performance legatos, a wide selection of longs and shorts, and control over a variety of articulations allowing you to create both intimate and epic soundscapes.

  Recorded in the timeless acoustics of Abbey Road Studio One, this library includes a hand-crafted mix signal by GRAMMY award winner Simon Rhodes.

  Realism at the highest degree.

  Do you already own an Abbey Road Orchestra Library? Log in to see your individual up-/crossgrade offer.

  Combine the Violas with the rest of the Abbey Road Orchestra: Symphonic Strings Core collection for the ultimate virtual string section.

  Want the best in expression, extended articulations, custom mic mixes and more? Check out Professional .
