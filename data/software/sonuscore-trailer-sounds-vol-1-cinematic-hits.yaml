description: "TRAILER SOUNDS VOLUME 1: CINEMATIC HITS compiles 150 jaw-dropping, bass-pounding cinematic booms, hits, and whoosh hits from BOOM Library. Sounds are broadcast-ready WAV files requiring no Kontakt or complex instrument setup — true drag-and-drop for trailer and cinematic soundtrack work."
details: |-
  Trailer Sounds Vol. 1 - Cinematic Hits is a curated folder of pre-designed sound material aimed at the Hollywood trailer sound, the kind of collection successful soundtrack composers keep stashed away and drop straight into a session when a cue needs weight.

  For this first edition, Sonuscore's composers teamed up with the sound designers at partner company BOOM Library and dug through their catalogue for the best and most cinematic hits they have released, compiling 150 booms, hits and whoosh hits. The sounds are massively designed and mostly non-tonal, ranging from heavy metallic sounds to clean drafty ones, from huge epic hits to soft, gentle taps, with booms that include heart-rending thuds and huge downers.

  The pack is crafted for true drag-and-drop use: no Kontakt, no complex instruments and no manual needed. Locate the .wav file you want, drag it into the appropriate place in your DAW, and it is done. The collection totals 280 MB of 48 kHz, 24-bit broadcast-ready WAV content.
specs: |-
