description: PSP PianoVerb2 is a redesigned and improved creative resonant reverb plug-in based on the freeware plug-in PSP PianoVerb.
details: |-
  PSP PianoVerb2 is a redesigned and improved creative resonant reverb plug-in based on the freeware plug-in PSP PianoVerb. This new version offers a redesigned GUI with a brand new resizing feature and a new preset management system. Like the original PianoVerb, it creates its unique sound with twelve resonant filters that mimic the behavior of piano strings. The ability to transpose, tune and detune the set of strings allows PianoVerb2 to deliver a wide range of reverberations ranging from traditional wide spread reverb to unique and unusual resonances.

  With the addition of a brand new modulation section and the ability to set up multiple settings of time and damping and decay freezing (via the A/B comparison function) this plug-in delivers amazing options for creative use. Add to that some other amazing new additions such as a high pass filter section, independent dry/wet controls, and a reverb tail freeze control, it's easy to see how PianoVerb2 has become a comprehensive and truly unique algorithmic reverb.

  PSP PianoVerb2 can add natural resonance to a weak piano track, add sustain to a lead guitar, or place a touch of unique reverb on a track.

  Running PSP PianoVerb2 in 30-day trial mode or activating it requires a free iLok user ID and the free iLok License Manager application, but no hardware dongle. The license can be activated in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above), and can be moved at any time using the iLok License Manager.
specs: |-
  - Twelve resonant filters that mimic the behavior of piano strings
  - Transpose, tune and detune the set of strings
  - Modulation section
  - A/B comparison function for multiple settings of time, damping and decay freezing
  - High pass filter section
  - Independent dry/wet controls
  - Reverb tail freeze control
  - Redesigned GUI with resizing feature
