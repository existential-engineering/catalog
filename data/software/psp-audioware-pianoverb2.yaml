description: A creative resonant reverb plug-in that uses twelve resonant filters mimicking piano string behavior, offering a wide range of reverberations from traditional wide spread reverb to unique and unusual resonances.
details: |-
  PSP PianoVerb2 uses twelve resonant filters to model piano string resonance. Features transposition, tuning, and detuning capabilities, a modulation section, A/B comparison with freeze function, high-pass filter section, independent dry/wet controls, reverb tail freeze control, a redesigned resizable GUI, and a new preset management system.

  iLok License Manager required (no hardware dongle). 30-day trial available.
