description: DeeMute can mute (or invert) audio triggered by MIDI notes. It can
  use it for a wide range of applications other than stutter and ducking!
details: |-
  DeeMute is a MIDI-triggered audio muting and inversion plug-in from Dotec-Audio. When a MIDI note is received, the plug-in mutes or inverts the audio signal passing through it, enabling a wide variety of creative and corrective applications beyond the standard stutter and ducking effects.

  The FLIP button reverses the mute operation — when activated, the audio passes through normally until a MIDI note is received, at which point it is muted or inverted. This makes it easy to create stutter gate effects that are active only during MIDI triggers rather than in between them.

  Adjustable Attack and Release parameters allow DeeMute to function as a ducker, smoothing the mute transitions for more musical, sidechain-style results. Together with the FLIP mode, the attack and release controls cover use cases from sharp rhythmic gates to gentle automated volume ducking.

  An on-board LEVEL control lets users set the output level of the wet signal, and DeeMute has been tested across a broad range of DAW hosts including Ableton Live, Logic Pro X, Cubase, FL Studio, Pro Tools, Studio One, Reason, Digital Performer, GarageBand, OBS Studio, and more.

  On macOS, DeeMute is available as VST2, VST3, AU, and AAX (64-bit, OS 10.12 or later). On Windows, VST2, VST3, and AAX are provided (64-bit). An iOS/iPad version is also available. All Dotec-Audio plug-ins include a free demonstration mode within the paid version.
