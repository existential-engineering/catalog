details: |-
  The AVA Live (ava-lv) is the latest plugin development from Harrison that
  combines a wide range of processing tools and user features specifically
  designed for live performance applications.

  Ava live is an all-in-one, latency-free plugin that addresses the needs of
  customers who are working within a DAW, but need the immediacy of a live
  console workflow, including the ability to switch quickly between sounds in
  the heat of the moment.

  14 tuned factory presets are provided as starting points, and the manual
  provides additional usage notes for each factory preset.

  6 user presets are provided directly on the plugin's ui, allowing you to store
  your own instantly accessible settings without visiting your DAW's preset
  submenu.

  These modules may be re-ordered in the automatable and recallable signal flow
  module, with pre/post fx sends for delay and reverb.
specs: |-
  - Latency-free
  - AAX
  - AU
  - VST
  - VST3
  - Noise gate
  - De-esser
  - Compressor
  - 32c EQ
  - 32c filters
  - Chorus
  - Delay
  - Reverb
  - Master in/out controls
  - Polarity switch
  - Automatable and recallable signal flow module
  - Pre/post FX sends for delay and reverb
  - 14 factory presets
  - 6 user presets
