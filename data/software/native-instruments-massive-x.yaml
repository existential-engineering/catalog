description: >-
  Massive X is a wavetable synthesizer by Native Instruments, the successor
  to Massive. It features a redesigned architecture with new oscillator
  modes, a flexible routing system, and high-quality effects built for
  modern sound design and electronic music production.
details: |-
  Massive X is the next generation of Native Instruments' influential
  Massive synthesizer. While the original Massive defined the sound of
  bass music and EDM, Massive X features a completely redesigned engine
  with new oscillator modes, routing flexibility, and modulation depth.

  Two oscillators offer multiple wavetable modes including standard,
  gorilla, bender, and more exotic algorithms. Each mode provides a
  different approach to wavetable scanning and morphing, expanding the
  timbral range beyond traditional wavetable synthesis. A noise
  oscillator and sub oscillator round out the sound sources.

  The routing section allows oscillators, noise, and feedback signals
  to be freely routed through two insert effect slots and two filters
  in any configuration. The filters include analog-modeled, digital,
  comb, and formant types with multiple slope options.

  Modulation is handled by nine assignable slots with performers
  (rhythmic step-sequencer-style modulators), envelopes, LFOs, and
  trackers. The performer is a standout feature, providing complex
  rhythmic modulation patterns that evolve over time.

  The effects section includes reverb, delay, dimension expander,
  and more, all designed to integrate seamlessly with the synthesis
  engine. Over 170 wavetables and 700+ presets ship with the instrument.
specs: |-
  - 2 wavetable oscillators with multiple modes
  - Noise oscillator and sub oscillator
  - Flexible audio routing matrix
  - 2 insert effect slots
  - 2 filters (analog-modeled, digital, comb, formant)
  - 9 modulation slots
  - Performer (rhythmic step modulator)
  - Envelopes, LFOs, and trackers
  - Built-in effects (reverb, delay, dimension expander)
  - 170+ wavetables
  - 700+ factory presets
  - Polyphonic with voice modes
  - Oversampling options
  - Preset browser with categories
