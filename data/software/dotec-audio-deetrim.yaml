description: DeeTrim is a simple plugin which controls the volume from -12dB to
  +3dB. It can keep the output level constant from any input level.
details: |-
  DeeTrim is an auto-leveling plug-in developed by Dotec-Audio that automatically adjusts gain within a -12dB to +3dB range to maintain a consistent output level regardless of the incoming signal's amplitude. Its core function is to transparently compensate for varying input levels, reducing the need for manual gain riding.

  Version 2.5.0 added a Vocal button tailored for voice tracks, allowing the plug-in to better handle the dynamics and characteristics typical of spoken or sung content. This makes DeeTrim a practical utility for podcasting, voiceover work, and vocal tracks in music production.

  On the performance side, version 2.1.1 reduced CPU load to one quarter of the previous consumption, and subsequent updates brought Retina display support and significantly improved graphics processing on macOS. Apple Silicon native support was introduced progressively across versions 2.5.3 (VST/VST3/AU) and 2.5.4 (AAX).

  DeeTrim supports VST2, VST3, AU, and AAX formats. On Windows it runs in both 32-bit and 64-bit hosts; on macOS it is 64-bit only and requires OS 10.12 or later. English and Japanese manuals are included, and the download size is approximately 10 MB.

  DeeTrim is discontinued and no longer available for purchase. Its successor is DeeTrimX.
specs: |-
  - Formats: VST2, VST3, AU, AAX
  - Windows: 32-bit and 64-bit
  - macOS: 64-bit, OS 10.12 or later
  - Apple Silicon support (VST/VST3/AU added v2.5.3; AAX added v2.5.4)
  - Volume control range: -12dB to +3dB
  - Maintains constant output level from varying input levels
  - Vocal button optimised for voice tracks (added v2.5.0)
  - CPU load reduced to 1/4 of original (added v2.1.1)
  - Retina display support on macOS
  - English and Japanese manuals included
  - Download size: approximately 10 MB
