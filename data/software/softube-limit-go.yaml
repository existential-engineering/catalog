description: Fast, flexible, and transparent limiting. Limit Go is a quick,
  intuitive, and easy-to-use limiting plugin for time-sensitive music production
  projects.
details: |-
  Looking for a limiter that never leaves your mix bus, is always part of your songwriting template, and sticks with you throughout your entire production? Get the limiting capabilities of Limit Pro in a simple, easy-to-use workflow that's critical when fast results are essential.

  Based on the algorithm of Limit Pro, with the same core and quality, Limit Go features three limiting styles, low latency, low CPU usage, and True Peak processing for mastering, mixes, and single tracks. Don't lose your way in a big feature set when you can hit the ground running and focus solely on your music, and results, with Limit Go.

  Fast and flexible, Limit Go features three styles loosely based on genres or production styles. Raw is designed for dense, electronic mixes where a bit of high-frequency distortion doesn't really matter. With Smoothing and Release at 0%, it's almost like a clipper. It can get very loud! Clean is your all-round best bet for pop, rock, and other recorded music. With less distortion, it's not as loud as Raw, but it's a safe bet for most styles. Good for sparser, bass-heavy arrangements. Safe is designed with acoustic music in mind, when you want to preserve the integrity of the song throughout the frequency range.

  Limit Go has a latency below 5ms. Keep it on your master bus while tracking and arranging or use it as a bus limiter throughout your production.

  Limit Go offers just the controls you need to get the result you want and nothing to distract. The interface is intuitively arranged with meters in the top display and controls at the bottom. You can quickly control release, limiter gain, smoothing, and style. Your metering includes true peak, loudness loss, gain reduction, and distortion metering, which measures how the limiter changes the audio and analyzes how that will affect the output audio.

  Delve into the algorithm behind Limit Go with Limit Pro. Limit Pro gives you in-depth, extensive control over peak suppression, metering, and more. It features three different peak suppression methods, with frequency-adaptive control of release times, to suit a variety of genres and styles.
specs: |-
  - Based on the Limit Pro algorithm, with the same core and quality
  - Three limiting styles: Raw, Clean, and Safe
  - Latency below 5 ms
  - Low CPU usage
  - True Peak processing
  - Controls for release, limiter gain, smoothing, and style
  - Metering for true peak, loudness loss, gain reduction, and distortion
  - Meters in the top display, controls at the bottom
  - For mastering, mixing, and single tracks
  - Console 1 and Flow Studio ready
  - Included with Flow Mixing, Mastering and Complete Suite subscriptions
  - Upgrade path to Limit Pro available
  - Requires a Softube account
  - Requires an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access for downloading installers and managing licenses
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - 20-day trial, three activations, 14-day returns
