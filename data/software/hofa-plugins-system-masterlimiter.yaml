description: SYSTEM MasterLimiter is a true-peak brickwall limiter with five mastering algorithms (Smooth, Transparent, Loud, Pump, Hard), one-knob handling, and a histogram showing input/output levels, reduction and LUFS loudness over time. Usable standalone or within HOFA SYSTEM, and also available as freeware with a reduced feature set.
details: |-
  The HOFA SYSTEM MasterLimiter is a true peak brickwall limiter designed for mastering, offering five distinct algorithms to cover a wide range of musical styles and loudness requirements. Its single-knob interface makes it approachable without sacrificing precision.

  Five algorithms address different mastering scenarios: Smooth blends all elements of a production with a soft character; Transparent preserves transients even at high loudness; Loud delivers maximum loudness for mastering; Pump adds audible pumping well-suited for bass-heavy genres; and Hard uses intelligent clipping for paramount loudness and punch.

  A histogram display visualizes input and output levels alongside real-time LUFS loudness metering. Dual input and output gain controls allow precise level management before and after limiting.

  The plugin works both as a standalone insert and within the HOFA SYSTEM framework alongside other SYSTEM plugins. A freeware edition — included in the HOFA SYSTEM Plugin Bundle FREE — provides access to the Smooth algorithm plus full metering and histogram functionality.

  Licensing is managed through the HOFA Plugins Manager. Each purchase includes two licenses, with offline activation and cross-computer transfer supported. A 14-day free trial is available. The plugin is also included in the HOFA SYSTEM All Bundle.
