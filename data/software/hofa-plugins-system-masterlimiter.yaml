details: |-
  The SYSTEM MasterLimiter offers precise true peak brickwall limiting with 5 intelligent mastering algorithms and easy one knob handling. It can be used as a standalone plugin and in HOFA SYSTEM, and is also available in a freeware version with a slightly reduced feature set.

  Five limiting algorithms cover different mastering situations. Smooth is a soft-sounding mode that blends all the elements of your production. Transparent is a universal algorithm that preserves transients even at high loudness. Loud is for the maximum loudness in your masterings. Pump delivers audible pumping for maximum loudness and is perfect for bassy music. Hard uses intelligent clipping for paramount loudness and top punch.

  In the histogram you can see exactly how the limiter works. In addition to the input and output levels and the reduction, it also shows the loudness in LUFS over time.

  The SYSTEM MasterLimiter has been tried and fine-tuned in countless blind tests in the HOFA-Studios. In these neutral listening sessions with reference competitors, HOFA used test signals from a wide variety of genres.

  All plugins from the HOFA SYSTEM series are also available as freeware with a slightly limited feature set. Installing HOFA SYSTEM through the HOFA-Plugins Manager makes the freeware features available immediately. The freeware version includes only the Smooth algorithm, while the full version adds Smooth, Transparent, Loud, Pump and Hard, plus input and output gain, activatable true peak limiting, precise metering with loudness in LUFS, and the histogram.
specs: |-
  - Precise true peak brickwall limiting
  - 5 intelligent mastering algorithms: Smooth, Transparent, Loud, Pump, Hard
  - Easy one knob handling
  - Can be used as a standalone plugin and in HOFA SYSTEM
  - Input and output gain
  - True peak limiting can be activated
  - Precise metering with loudness in LUFS
  - Histogram showing input and output levels, reduction and loudness in LUFS over time
  - Operating system: macOS 10.13 or later, Windows 10 or later
  - Two licenses included, managed via the HOFA Plugins Manager and transferable to other computers
  - Offline activation and USB stick licenses supported
  - Continuously tested on Ableton Live, Apple Logic, Avid Pro Tools, Bitwig, Cockos Reaper, Image Line FL Studio, Magix Samplitude/Sequoia, Fender Studio Pro, Steinberg Cubase/Nuendo/Wavelab
  - 14 days free trial
