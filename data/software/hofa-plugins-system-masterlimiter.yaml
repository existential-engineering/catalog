description: SYSTEM MasterLimiter is a true-peak brickwall limiter with five
  mastering algorithms (Smooth, Transparent, Loud, Pump, Hard), one-knob
  handling, and a histogram showing input/output levels, reduction and LUFS
  loudness over time. Usable standalone or within HOFA SYSTEM, and also
  available as freeware with a reduced feature set.
details: |-
  Precise true peak brickwall limiting 5 intelligent mastering algorithms Easy one knob handling Can be used as a standalone plugin and in HOFA SYSTEM Also available in a freeware version with slightly reduced feature set Smooth Soft-sounding mode that blends all the elements of your production. Tip: Included in the SYSTEM Plugin Bundle FREE! Transparent Universal algorithm that preserves transients even at high loudness. Loud For the maximum loudness in your masterings. Pump Audible pumping for maximum loudness. Perfect for bassy music. Hard Using intelligent clipping for paramount loudness and top punch. Histogramm In the histogram you can see exactly how the limiter works. In addition to the input and output levels and the reduction, it also shows the loudness in LUFS over time. Developed in the HOFA-Studios The SYSTEM MasterLimiter has been tried and fine-tuned in countless blind tests. In these neutral listening sessions with reference competitors, we used test signals from a wide variety of genres. To be honest, it was no easy task to develop a superior limiter 😉 Freeware version All plugins from the HOFA SYSTEM series are also available as freeware with a slightly limited feature set. Simply install HOFA SYSTEM using the HOFA-Plugins Manager . You can then use all freeware features immediately. Here is an overview that shows the differences between the SYSTEM MasterLimiter freeware and the full version: Feature Available in the freeware Available in the full version Limiting algorithms Smooth Smooth, Transparent, Loud, Pump, Hard Input and output gain ⬤ ⬤ True peak limiting can be activated ⬤ ⬤ Precise metering with loudness in LUFS ⬤ ⬤ Histogram ⬤ ⬤
