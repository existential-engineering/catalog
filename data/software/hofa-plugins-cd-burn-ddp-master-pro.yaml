description: The PRO version of the popular mastering software!
details:
  - CD-Burn.DDP.Master PRO is a comprehensive mastering application for macOS and Windows that combines CD burning, DDP image creation, and professional audio mastering in a single workflow. The PRO version adds third-party plugin support (VST3 and AU), allowing engineers to use their preferred processing tools directly within the mastering session.
  - The software supports vinyl mastering, multi-CD and multi-session projects, and produces Red Book Audio-compliant CDs. It handles all standard CD metadata including CD Text, ISRC codes, and EAN tags, and can export customizable PQ sheets in both PDF and CSV formats.
  - Advanced features include True Peak normalization, clip-based plugin processing, plugin chain presets, and a render cache system for CPU optimization. All HOFA plugins are bundled at no additional cost, and licensing covers two activations per purchase with offline activation and USB stick license support available.
  - A 14-day free trial is available for download. The PRO version is also available as an upgrade for existing CD-Burn.DDP.Master and CD-Burn & DDP V1 Standalone owners.
specs: |-
  - Third-party plugin support (VST3 and AU formats)
  - Plugin chain presets
  - DDP image creation
  - Red Book Audio CD burning
  - Audio CD import
  - Vinyl mastering support
  - True Peak normalization
  - Advanced dithering options
  - Clip-based plugin processing
  - Render cache for CPU optimization
  - Multi-CD and multi-session project support
  - Comprehensive metadata handling: CD Text, ISRC, EAN, ID3, CSV
  - Customizable PQ sheets (PDF and CSV export)
  - Two licenses per purchase
  - Offline activation supported
  - USB stick license compatibility
  - Requires macOS 10.13 or later
  - Requires Windows 10 or later
  - All HOFA plugins included at no additional cost
