description: Professional mastering software with VST3/AU support, plugin chain presets, advanced dithering, DDP creation, and full metadata control.
details: |-
  The PRO version of the popular mastering software. It adds support for third-party plugins (VST3 / AU), presets for complete plugin chains, comprehensive metadata handling (ID3, CSV support), advanced dither options and additional features for professional users, on top of all features of the standard version.

  You can use and automate all your favourite plugins on the individual tracks as well as on the master track. If you often use the same plugins in the mastering process, you can save entire plugin chains as presets and reload them at any time. The integrated plugin manager is an easy way to organize, sort, show and hide your plugins.

  Plugins can also be used on individual clips. This way you can master well structured and resource-saving. For dithering you can use the excellent internal dithering or a dithering plugin of your choice.

  Professional mastering engineers choose the PRO version primarily because of its enhanced workflow flexibility and open plugin architecture. While the standard version supports only proprietary HOFA plugins, the PRO version allows you to use any external plugins in VST3 or AU format, with all parameters automatable. It also offers advanced editing capabilities directly at the clip level, so engineers can apply plugins individually to each track rather than relying solely on global track and master effects.

  The render cache reduces the load on the CPU by rendering plugins with high CPU load in the background, ensuring smooth, high-precision playback and maximum stability for complex projects. Because the clips are already prepared (rendered) in the cache, the time required for the final export of DDP images or audio files is significantly reduced, which is particularly useful when exporting multiple formats one after another.
specs: |-
  - Burn Red Book Audio CDs
  - Import Audio CDs
  - Create DDP images
  - Mastering for vinyl
  - Free use of all HOFA plugins within CD-Burn
  - Insert third-party VST3 and AU plugins
  - Plugin chain presets
  - Clip based plugin processing
  - Arranging files during import
  - Dithering: internal and third-party plugins
  - True Peak normalization
  - Automation
  - Clip processing (editing, fades, crossfades)
  - Metadata: CD text, ISRC, EAN, additional ID3 tags
  - Advanced audio export with metadata
  - Customisable PQ sheets (PDF, CSV)
  - Multi CD projects
  - Multi Session CDs
  - DDP Player Maker connection
  - Render cache for CPU-intensive plugins
  - Operating System: macOS 10.13 or later, Windows 10 or later
  - Two licenses included, managed via the HOFA Plugins Manager, with offline activation possible
