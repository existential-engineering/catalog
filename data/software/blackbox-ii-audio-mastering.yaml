details: |-
  Blackbox is a mastering grade processing suite intended to make your music
  sound polished. Blackbox faithfully emulates a natural analog style mastering
  chain and accurately configures the settings based on user preference.

  Blackbox adds punch, loudness and quality to your mix, whilst providing the
  overall balance found in many of today's top productions.

  Blackbox masters and improves the quality of almost any genre of music: dance
  / edm, rock, pop, techno / tech house, trance / progressive, indie,
  electronic, r&b / hip hop, breakbeat, jungle / drum & bass, and many more.

  Producers and artists can use blackbox through 8 expressive controls. Instead
  of getting involved with the intricacies and subtleties of analog mastering
  chain, users can simply express through simple knobs how they want their audio
  to sound.

  Make your demos sound great and give your stream-able media the wow factor.
