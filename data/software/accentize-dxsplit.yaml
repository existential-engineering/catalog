description: Separate Voice, Reverb and Noise in Dialogue Recordings with
  dxSplit, giving audio professionals precise control over speech recordings.
details: |-
  dxSplit is an intelligent multi-tool for dialogue recordings. It automatically
  splits dialogue audio into three individual sections, allowing you to
  perfectly balance Voice, Reverb and Noise.

  Features intuitive component faders to precisely control the level of each
  component. Solo or mute each channel independently for accurate monitoring.
  Each component features its own parametric EQ for detailed tonal shaping.

  The CORE separation algorithm is optimized for fast rendering and real-time
  use as an insert plugin. On macOS, the high-precision EXTENDED algorithm
  leverages the Apple Silicon Neural Engine for unmatched offline noise
  reduction. On Windows only the CORE algorithm is available.

  Compatible with Pro Tools, Cubase, Nuendo, Reaper, Adobe Premiere, and DaVinci
  Resolve.
specs: |-
  - Audio Channels: Mono, Stereo
  - Formats: VST3, AU, AAX
  - Sample Rates: 44.1kHz, 48kHz, 88.2kHz, 96kHz, 192kHz
  - CORE algorithm: real-time, macOS + Windows
  - EXTENDED algorithm: offline, macOS Apple Silicon only
  - Parametric EQ per component
  - Component faders with link/solo/mute
  - Apple Silicon native support (Universal Binary)
