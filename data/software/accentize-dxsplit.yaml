description: dxSplit separates dialogue recordings into independent Voice, Reverb, and Noise components, giving audio professionals precise control over speech recordings.
details: |-
  dxSplit automatically splits dialogue audio into three individual components, Voice, Reverb, and Noise, each with its own fader and parametric EQ for detailed tonal shaping. Components can be soloed or muted independently, or linked for grouped adjustments.

  The CORE separation algorithm is optimized for fast, real-time use as an insert plugin on macOS and Windows. On Apple Silicon Macs, the high-precision EXTENDED algorithm offers offline processing, while Windows supports CORE only. dxRevive Pro can be loaded directly within dxSplit for additional restoration.

  Compatible with Pro Tools, Cubase, Nuendo, Reaper, Adobe Premiere, and DaVinci Resolve.
specs: |-
  - Audio Channels: Mono, Stereo
  - Formats: VST3, AU, AAX
  - Sample Rates: 44.1kHz, 48kHz, 88.2kHz, 96kHz, 192kHz
  - CORE algorithm: real-time, macOS + Windows
  - EXTENDED algorithm: offline, macOS Apple Silicon only
  - Parametric EQ per component
  - Component faders with link/solo/mute
  - Licensing: iLok
