description: TAL-DUB-II is an extended version of TAL-Dub-I with a completely new sound engine. A 4x oversampled distortion stage allows to add vintage distortion to the delayed signal, but it's also possible to make clean delays.
details: |-
  TAL-Dub-2 is an extended version of TAL-Dub-I with a completely new sound engine. A 4x oversampled distortion stage allows vintage distortion to be added to the delayed signal, while clean delays remain possible.

  A sine LFO can modulate delay time and low pass filter cutoff, and adjustable LFO stereo width is included.

  An analog sounding 6dB low pass filter with resonance and a 3dB high cut filter are also part of the plugin, and different routing options open a wide range of possibilities.

  It was released as a Windows 32-bit VST, a Windows 64-bit VST, an OSX 32-bit VST and an OSX 32-bit Audio Unit. No installer, Linux build, VST3, AAX or CLAP version exists.

  TAL lists the Dub plug-ins under "Deprecated Plug-Ins (not supported)", so TAL-Dub-2 is no longer supported. The OSX builds need a 32-bit host on macOS below 10.10, so they cannot run on current macOS. It remains a free download.
specs: |-
  - Extended version of TAL-Dub-I with a completely new sound engine
  - 4x oversampled distortion stage for vintage distortion on the delayed signal; clean delays also possible
  - Sine LFO able to modulate delay time and low pass filter cutoff
  - Adjustable LFO stereo width
  - Analog sounding 6dB low pass filter with resonance
  - 3dB high cut filter
  - Different routing options
  - Plug-in formats: VST (Windows 32-bit and 64-bit), VST (OSX 32-bit), Audio Unit (OSX 32-bit)
  - Windows: Windows XP or higher (32 / 64 bit)
  - OSX: 10.6 and < 10.10 (32 bit Host)
