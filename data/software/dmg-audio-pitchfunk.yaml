description: PitchFunk is an audio manipulating colossus that combines pitch shifting with delay, filtering, and extensive modulation capabilities, drawing on 10 pitch-shifting algorithms based on classic hardware for sound design and electronic production.
details: |-
  PitchFunk is a modulating multi-effects plugin built around pitch shifting combined with delay, filtering, and deep modulation. It offers 10 pitch-shifting algorithms modelled on classic hardware alongside 3 delay-line algorithms spanning vintage and modern character. Signal routing topology is fully configurable. Modulation is handled by 3 bezier-drawable LFOs with swing and tempo sync plus a sidechain-able envelope follower, all routable through a full modulation matrix. Processing modes include stereo, M/S, and independent L/R. Pitch control is MIDI-playable with pitch-bend support. A movable modulated gain stage enables pan and gain effects.
specs: |-
  - 10 pitch-shifting algorithms based on classic hardware
  - 3 delay-line algorithms (vintage and modern)
  - Configurable signal routing topology
  - 3 bezier-drawable LFOs with swing and tempo sync
  - Sidechain-able envelope follower
  - Full modulation matrix
  - Stereo, M/S, and L/R independent processing modes
  - MIDI playable pitch control with pitch-bend support
  - Movable modulated gain stage for pan/gain effects
