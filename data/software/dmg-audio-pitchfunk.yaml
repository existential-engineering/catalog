description: PitchFunk is an audio manipulating colossus that combines pitch shifting with delay, filtering, and extensive modulation capabilities, drawing on 10 pitch-shifting algorithms based on classic hardware for sound design and electronic production.
details: |-
  DMGAudio PitchFunk is an audio-manipulating multi-effects plugin that feeds a pitch shifter into delay and filter stages with feedback, layering on extensive modulation to keep everything moving while it feeds back. It offers 10 pitch-shifting algorithms based on classic hardware and optimised for modern CPUs, plus 3 delay-line algorithms covering vintage and modern delay lines, with a configurable effect-routing topology.

  Modulation is handled through 3 Bezier-drawable LFOs with swing and tempo sync, a sidechain-able envelope follower, and a full modulation matrix that can route any source to any control. A movable modulated gain stage adds pan/gain effects, and the plugin supports Stereo, Mid/Side independent, and Left/Right independent processing modes. MIDI-playable pitch bend is supported for the pitch control.
specs: |-
  - 10 pitch-shifting algorithms, based on classic hardware, optimised for modern CPUs
  - 3 delay-line algorithms, covering vintage and modern delay lines
  - Configurable topology for control over effect routing
  - Movable modulated gain-stage for pan/gain effects
  - Stereo, M&S independent and L&R independent modes
  - 3 Bezier-drawable LFOs with swing and tempo sync
  - Sidechain-able envelope follower with extensive control
  - Full mod-matrix to route any source to any control
  - MIDI playable / pitch-bend for pitch
