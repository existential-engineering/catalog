description: Precision DeEsser is a linear-phase, frequency-sensitive dynamics
  processor that removes excessive high-frequency content from a track without
  dulling the high end. It combines linear phase filtering with dynamics
  processing and SpectraFoo metering and analysis.
details: |-
  Precision De-Esser combines high-precision linear phase filter technology with the dynamics processing of ChannelStrip and the metering and analysis of SpectraFoo, so offending frequencies can be isolated and corrected quickly and efficiently.

  The plug-in features comprehensive listening controls that make audible exactly what is or is not being removed, with five different points in the processing chain available to monitor. As with all Metric Halo plug-ins, parameters are fully automatable for full control of the processing during mixdown.

  The Precision DeEsser is an essential tool for vocal tracks, but can also be used for sound design and other audio processing.

  The linear-phase filter block offers Center, Bandwidth and Sharpness controls, and the Ess-Compressor adds Threshold, Ratio, Attack and Release. SpectraFoo spectrum analysis with selectable displays and scalable gain reduction meters are built in, alongside many presets and the MH Preset Manager for cross-platform presets.

  Version 4 adds a VST3 version on both macOS and Windows, including native Apple Silicon support for VST hosts such as Steinberg's Cubase and Nuendo. All v4 plug-ins add undo and redo, A/B snapshots with snapshot blend, software update tracking, more flexible resizability, common controls in the header bar, improved preset management, settings copy and paste between instances, a plug-in details pane, user configurable themes, selectable knob styles and preferences for band and UI colors.
specs: |-
  - World-class signal processing and workflow
  - High precision linear-phase filter block with Center, Bandwidth and Sharpness controls
  - Ess-Compressor with Threshold, Ratio, Attack and Release controls
  - Comprehensive listening control
  - SpectraFoo spectrum analysis built-in, with selectable displays
  - Scalable gain reduction meters
  - Many presets included
  - Adjustable UI size and disclosable graphs
  - MH Preset Manager provides cross-platform presets
  - macOS 10.10 or newer, Intel Processor or Apple Silicon, AU, VST 2 & 3 or AAX (Pro Tools 11 and newer Native) host, 64 bit
  - Windows 7 or newer, Intel Processor, VST or AAX (Pro Tools 10, 11 & 12 and Native) host, 64 bit
  - Licensing requires an iLok.com account
  - License includes two activations per account
  - iLok dongle is optional, the license can be installed on the machine, on an iLok, or in the iLok Cloud
  - Only one license required, works on all supported platforms
