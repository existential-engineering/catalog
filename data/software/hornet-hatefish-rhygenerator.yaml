description: RhyGenerator creates euclidean rhythm patterns in a matter of few seconds, up to 16 different sequencers are available that can work in 5 different modes
details: |-
  RhyGenerator is an Euclidean step sequencer made by HoRNet Plugins together with the electronic music artist HATEFISh. The sequencer is designed to distribute as evenly as possible a certain number of "beats" in a given number of "steps".

  The Euclidean rhythm in music was discovered by Godfried Toussaint in 2004 and is described in a 2005 paper "The Euclidean Algorithm Generates Traditional Musical Rhythms". The greatest common divisor of two numbers is used rhythmically giving the number of beats and silences, generating almost all of the most important World Music rhythms. The beats in the resulting rhythms are as equidistant as possible; the same results can be obtained from the Bresenham algorithm.

  Simply put, with RhyGenerator you can create up to 16 different rhythms, consisting of up to 32 steps each. Those 16 lanes on the GUI of the plugin are actually 16 different step sequencers linked to your DAW tempo, and each of the sequencers can work in multiple modes: Single note, Arpeggiator up, Arpeggiator down, Chord and MIDI Control.

  In the "Note" mode the sequencer outputs the specified note following the rhythm generated by the Euclidean algorithm, in "Arpeggiator up" or "Arpeggiator down" mode the sequencer outputs the notes on the plugin input from lowest to highest (or vice versa) following the specified rhythmic pattern. In "Chord" mode all the notes on the input are played together on every active beat, and in the last mode, the "Control" mode, MIDI control change messages are used instead of notes, allowing you to automate rhythmically any parameter of your synths.

  Every one of the sequencers allows you to control the number of steps and beats separately. In note mode you can control the velocity and the length of the note, while in control change mode the note number becomes the "control number" and the velocity becomes the "control value". You can assign a different MIDI channel to every one of the step sequencers to control up to 16 different synths, and each sequencer also has an LFO that can modulate the MIDI message value. The plugin has no copy protection.
specs: |-
  - Up to 16 different euclidean step sequencers
  - Five different working modes for each of the sequencers
  - Up to 32 steps for each sequencer
  - Shift option for each sequencer
  - Speed option from 1 bar to 1/64th note for each sequencer
  - Automatic euclidean rhythm generation
  - One LFO on each sequencer to create modulations
  - MIDI effect in Logic Pro X
  - Resizable vector GUI
  - Stand alone APP mode available
  - Hardware accelerated GUI
  - Apple Silicon native support
  - Mac OS X (10.11 and later) and Windows (7 and later) support
  - 64-bit plugins for macOS and Windows
  - Audio Units, VST, VST3 and AAX format
  - No copy protection
