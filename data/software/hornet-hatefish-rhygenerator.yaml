details: |-
  RhyGenerator is a Euclidean step sequencer made by HoRNet Plugins together with the electronic music artist HATEFISh. The sequencer is designed to distribute as evenly as possible a certain number of beats in a given number of steps.

  The Euclidean rhythm in music was described by Godfried Toussaint in a 2005 paper, 'The Euclidean Algorithm Generates Traditional Musical Rhythms'. The greatest common divisor of two numbers is used rhythmically, giving the number of beats and silences, generating many of the most important world music rhythms, with the beats as equidistant as possible.

  With RhyGenerator you can create up to 16 different rhythms, each consisting of up to 32 steps. The 16 lanes on the plugin's GUI are 16 separate step sequencers linked to the DAW tempo, and each of them can work in five different modes. In Chord mode all the notes on the input are played together on every active beat, and in Control mode MIDI control change messages are used instead of notes, which lets you rhythmically automate any parameter of your synths.

  Each sequencer allows separate control of the number of steps and beats. In note mode you also control the velocity and the length of the note; in control change mode the note number becomes the control number and the velocity becomes the control value. A different MIDI channel can be assigned to each of the 16 step sequencers, so up to 16 different synths can be driven at once.

  Every sequencer carries an LFO that can modulate the MIDI message value, velocity in Note mode and value in Control mode. Speed runs from 1 bar to 1/64th note per sequencer, each lane has its own shift option, and a stand alone app mode is available alongside the plugin formats. There is no demo version: HoRNet offers an instantaneous full refund within 15 days of purchase instead.
specs: |-
  - Up to 16 different euclidean step sequencers
  - Five different working modes for each of the sequencers
  - Up to 32 steps for each sequencer
  - Shift option for each sequencer
  - Speed option from 1 bar to 1/64th note for each sequencer
  - Automatic euclidean rhythm generation
  - One LFO on each sequencer to create modulations
  - MIDI effect in Logic Pro X
  - Resizable vector GUI
  - Stand alone APP mode available
  - Hardware accelerated GUI
  - Apple Silicon native support
  - Mac OS X (10.11 and later) and Windows (7 and later) support
  - 64-bit plugins for macOS and Windows
  - Audio Units, VST, VST3 and AAX format
  - No copy protection
