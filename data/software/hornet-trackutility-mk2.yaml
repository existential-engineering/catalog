description: TrackUtility MK2 is a utility plugin for audio, it offers all the needed processors for your tracks in one solution with a handy GUI
details: |-
  TrackUtility MK2 is an incredibly versatile audio tool, acting as a true swiss army knife for your production needs. With its wide array of useful processors, it eliminates the need for loading many different plugins. Instead, you get a highly efficient and logically designed GUI that can stay on your screen alongside other plugins, ensuring you have everything you need right at your fingertips.

  This powerful plugin comes with a variety of features that allow you to handle tasks you'd typically need separate plugins for. Whether you need to convert a track from stereo to mono, remove DC offsets, adjust panning, trim audio, and more, TrackUtility MK2 has you covered. These essential utilities are all available within one interface, meaning you don't have to load multiple plugins for these tasks.

  When working on mixing or mastering, TrackUtility MK2 can also serve as a powerful tool for your master bus. The plugin features a built-in limiter in the output section, which helps to control the overall level and avoid clipping. It also includes a stereo wideness control, which can be used to adjust the stereo image of your mix, and can even act as a fake stereo simulator, giving mono tracks a more spacious, stereo-like feel.

  TrackUtility MK2 offers a number of improvements over its predecessor. One of the most useful updates is the grouping function, which allows you to apply changes to multiple instances of the plugin at once. Another notable upgrade is the revamped RMS meter, which now features a freely adjustable window, providing greater flexibility in monitoring levels. It also introduces the latest auto gain algorithm for smoother transitions and more accurate automatic level adjustments.

  In addition to these updates, TrackUtility MK2 borrows the limiter code directly from the renowned Magnus plugin. This brings with it the option to choose from three different auto release times for the limiter, allowing you to tailor the limiter's response to the specific characteristics of your track, whether you're aiming for more transparent limiting or a more aggressive dynamic control.
specs: |-
  - Track muting.
  - DC removal.
  - Channel Selector (work on L + R or just L or R or invert L and R).
  - Phase reversal (separate for L and R channels).
  - Gain adjustment (from -60dB to +60dB).
  - Auto Gain adjustment in Peak and RMS mode.
  - Pan control.
  - Stereo width control that acts as fake stereo simulator on mono tracks.
  - Output clipper.
  - Magnus Output limiter with three different auto release times.
  - Peak output meter.
  - RMS output meter with adjustable window analysis length.
  - Grouping function to change settings to many instances at once.
  - macOS (10.11 and later) and Windows support.
  - Apple Silicon native support.
  - 64-bit only on both on Mac and Windows.
  - Audio Units, VST2.4, VST3, AAX format.
  - No copy protection.
