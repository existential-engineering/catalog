description: TrackUtility MK2 is a utility plugin for audio, it offers all the needed processors for your tracks in one solution with a handy GUI
details: |-
  TrackUtility MK2 is a swiss army knife for audio production, packing a wide array of processors into one efficient, logically designed GUI that can stay on screen alongside other plugins. It handles tasks that would otherwise need several separate plugins: converting stereo to mono, removing DC offsets, adjusting panning and trimming audio.

  It works with stereo and mono tracks alike, converting between the two with high audio quality, whether for compatibility with different playback systems or to optimise balance.

  On the master bus it serves as a quick mastering tool. The output section holds a limiter to control overall level and avoid clipping, plus a stereo wideness control that adjusts the stereo image and can act as a fake stereo simulator on mono tracks. An auto gain RMS mode makes quick mastering straightforward: set the RMS to the desired maximum level, engage auto gain and activate the limiter.

  Improvements over the original include a grouping function that applies changes to multiple instances at once, a revamped RMS meter with a freely adjustable analysis window, and the latest auto gain algorithm for smoother and more accurate automatic level adjustments.

  The limiter code is taken directly from the HoRNet Magnus plugin, bringing three different auto release times so the limiter's response can be tailored from transparent limiting to more aggressive dynamic control.
specs: |-
  - Track muting
  - DC removal
  - Channel selector (L+R, L only, R only, or invert L and R)
  - Phase reversal, separate for L and R channels
  - Gain adjustment from -60dB to +60dB
  - Auto gain adjustment in Peak and RMS mode
  - Pan control
  - Stereo width control that acts as a fake stereo simulator on mono tracks
  - Output clipper
  - Magnus output limiter with three different auto release times
  - Peak output meter
  - RMS output meter with adjustable window analysis length
  - Grouping function to change settings on many instances at once
  - macOS (10.11 and later) and Windows support
  - Apple Silicon native support
  - 64-bit only on both Mac and Windows
  - Audio Units, VST2.4, VST3 and AAX format
  - No copy protection
