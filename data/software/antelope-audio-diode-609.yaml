details: |-
  Diode 609 is a diode-bridge compressor plugin that runs natively in your DAW on macOS or Windows, or in real-time on Antelope's Synergy Core interfaces. It is modeled after one of the most versatile and demanded compressors of all time – the 33609, a classic from the 1980s known for its unparalleled creamy-thick and smooth sound.

  The 33609 Diode-Bridge compressor offers the perfect blend of character and versatility, which is why it has been heard on hundreds of records in the past four decades. Its unique feedback circuitry generates distinct harmonic energy that fills the empty spaces around the source and creates an illusive creamy thickness and weight. Combined with its musical and forgiving compression, independent limiter, and a plethora of controls, this dense energy can shape the tone of any source and place it in front of the mix.

  When used on a 2-bus, this diode-bridge workhorse can glue tracks like no other, while bringing the whole mix to life. Many consider the 33609 to be in a class of its own as it offers no compromise in sound or performance, regardless of the application or source.

  Released in 1985, the 33609 draws its heritage and circuitry from the legendary 2254 and 2253 Diode-Bridge compressors. Pairs of those early 2254 mono-blocks were found in the iconic British 80-series consoles from the 70s and played an essential part in shaping the classic Neve sound. The 33609 was the answer to a growing demand for a stereo-rack version of the 2254.

  Antelope took a well-preserved vintage 33609 and deconstructed it to its bare bones, measuring every single component from the diodes and transformers down to the wires and the unique non-linear relationship of the internals. Each component was then individually re-created in digital form, using the original blueprints for the hardware, to produce the Diode 609 — a faithful modern recreation. To answer the needs of modern hit-makers, an HP filter was added in the control chain of the compressor with its own preview button that lets you hear the high-passed signal, along with a 200ms Recovery setting and a 10:1 Ratio.
specs: |-
  - Diode-bridge compressor plugin modeled after the classic 33609 (1985)
  - Component-level modeling of a vintage 33609 unit (diodes, transformers, wiring, non-linear internals)
  - Musical compression with independent limiter section
  - High-pass filter in the control chain with a preview button to hear the high-passed signal
  - Additional 200ms Recovery setting (beyond the original)
  - Additional 10:1 Ratio option (beyond the original)
  - Suitable for 2-bus glue, drum compression, parallel drum compression, and individual track processing
  - Runs natively in your DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core interfaces
  - Part of the Antelope Cosmos subscription (75+ native plugins)
