details: |-
  A0 parametric equalizer features eight analog-sounding filters: four peaking filters - or bell-shaped - with a boost of +/-24 db, two shelving filters with slope of one or two octaves, a high-pass and a low-pass filter with adjustable quality factor (resonance) and selectable slope.

  To ensure the maximum sound quality of the filters, the internal audio processing is entirely done at full 80 bit floating point accuracy.

  The built-in sat0 mastering limiter makes this equalizer ideal for both track and level-safe mastering application.
specs: |-
  - Eight analog-sounding filters
  - Four peaking filters with +/-24 db boost
  - Two shelving filters with slope of one or two octaves
  - High-pass filter with adjustable quality factor and selectable slope
  - Low-pass filter with adjustable quality factor and selectable slope
  - 80 bit floating point accuracy internal audio processing
  - Built-in sat0 mastering limiter
  - VST plugin
  - Windows compatible
