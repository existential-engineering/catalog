details: |-
  Choirs have always been an archetypal and powerful means of adding human
  vibrancy, soul and glory to any piece of music, and these choirs from our big
  bang orchestra do exactly that. Drawing from their manifold experiences of
  singing for major movie and game productions, the synchron stage choir
  delivers emotional performances and a clear style with reduced vibrato that is
  widely used in modern scores.

  Bbo: ganymede includes the classic individual sections of soprano, alto, tenor
  and bass as well as several tutti patches. Offering several variations of
  tutti mappings proves helpful for creating quick arrangements that sound great
  without the need for detailed orchestrating. "tutti choir" combines all
  sections into one powerful patch, all layered on top of each other.
  "male/female" places the male ensembles in the lower octaves and the female
  ensembles in the higher octaves of the keyboard. "choir stacked" blends the
  sections from the lowest to the highest register, keeping the natural ranges
  intact. "tutti effects" includes major and minor chords, clusters, cluster
  glissandos, cluster builds and shouts.

  Articulations include staccato, sustain, espressivo, real legato, sforzato and
  several swells. As with all the other installments of the big bang orchestra,
  the ensembles were captured with an array of microphones to give you more
  flexibility and sound options using the synchron player's internal mixer.

  Bbo: ganymede offers several room mixes (mix-downs from various mic positions
  to a stereo signal), decca tree, surround to stereo and real surround presets
  for immersive audio applications. In the "processed" category you'll find
  mixer presets such as cathedral, soft canon, compressed, bass to the middle,
  and many more. Being recorded in the same large hall of synchron stage vienna,
  the choirs of big bang orchestra: ganymede perfectly complement the majestic
  sound of all the other libraries of the series.

  Big bang orchestra: ganymede by vienna symphonic library (vsl) is a virtual
  instrument audio plugin for macos and windows. It includes, and is therefore
  "powered by", synchron player, which functions as a VST plugin, an audio units
  plugin, a VST 3 plugin and an AAX plugin.
