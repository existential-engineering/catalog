details: |-
  UJAM is teaming up with the Bob Moog Foundation to bring you Vox Humana from the legendary Polymoog 280A. 100% of all proceeds go toward the Foundation's efforts in education, preservation, and the Moogseum.

  The Vox Humana plug-in delivers a lush, vocal-like tone with rich movement and warmth, defining late '70s synth sounds. Its expressive character remains a favorite for electronic and pop music. The original Polymoog was meticulously recorded by synth expert Alex Ball.

  The interface is beautiful, simple yet powerful, featuring sound variations, envelope, multi-effects and presets.
