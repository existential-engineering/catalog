description: Usynth 2080 makes it faster and easier than ever to create a diverse range of synthwave sounds. No knowledge of digital audio theory or sound design principles are needed to get a fantastic-sounding result with little to no hassle.
details: |-
  Usynth 2080 makes it faster and easier than ever to create a diverse range of synthwave sounds. No knowledge of digital audio theory or sound design principles are needed to get a fantastic-sounding result with little to no hassle.

  Surreal, spheric and sexy: synthwave has brought back to life the aesthetics of the 1980s, and that with better sound quality than had been possible back then.

  Usynth's synthesizer section is one of the most powerful software synthesizers out there, with multiple synthesis types, a fully-fledged voice architecture and hundreds of control and modulation possibilities. In the synthesizer section, all you see is two big "hardware" and three "software" knobs, because the sound designers have already done the work of mapping each of these knobs to multiple destinations inside the engine to expose only the most musically useful parameters for any given preset.

  Finisher presets are organized into three categories: Single (one single effect with four controls), Dual (two effects with two controls each) and Quad (four effects with one control each).
specs: |-
  - Fully customizable sequencer
  - 2 individual layers per note
  - Custom Finisher featuring 90 presets
  - Finisher presets organized into Single, Dual and Quad categories
  - Five macro knobs (two "hardware", three "software") mapped to multiple engine destinations per preset
  - UJAM App integrated
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8GB of RAM
  - 0.45GB of free disk space
  - 1280x768px display, internet connection
  - Moving the .blob sample content file to an external drive is not supported
  - Plug-in formats: AAX, AU 2, VST 2 and VST 3, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Requires the latest version of the UJAM App, which installs the Usynth plug-in that hosts all titles
