details: |-
  The 6060 includes over 30 unique modules for eq, compression, saturation, distortion, specialized filtering, dynamic range expansion, gating, and more. Custom modules include bass optimized biasing for the larger than life low end, transformer-based tone shaping circuits for high end shine, tape simulation, de-essing and new eq and compression designs.

  The 6060 has twelve equalizer modules (so far). All have up to four bands of eq and/or filters. Relative control values are retained when switching between modules for rapid preview of each module's sound.

  The 6060 has ten compressor modules (so far). The algorithms vary from the gentle to very aggressive. New features are included like feedback (in addition to feedforward) compression, and a negative compression mode.

  The 6060 has many other processing options including saturation modules like the s671, specialized filtering, tape machine emulations, transformer circuit modeling, bass optimized biasing, de-essing, and plenty more.

  Features: largest collection of processing options of any module-based plug-in. Easy drag & drop on the fly module. Split mode operation for two separate parallel signal paths. Double precision processing. Zero latency. Collection of presets from award winning mix engineers. Mono and stereo versions.
