details: |-
  Bass Tuner BT1 is a specialized instrument tuner optimized for tuning
  low-frequency musical instruments. Tune any bass instrument (bass guitar,
  double bass, bassoon, bass clarinet, bass trombone, bass saxophone, cello,
  etc.) with this extremely accurate and easy-to-use chromatic tuner.

  Bass tuner bt1 also comes with a handy tone generator that plays any note as a
  reference for tuning.

  Displays the current note being tuned along with its deviation and current
  frequency. Includes historical graph of the pitch that helps you with the
  tuning process.

  Tone generator that can generate reference tones over a note-range of 3
  octaves. Ability to set the frequency of a (for tunings where a is not 440
  hertz).
specs: |-
  - Chromatic tuner
  - Extremely accurate (0.1 cents)
  - Tone generator
  - 3 octaves note-range
  - Pitch history graph
  - Adjustable a frequency
  - Available for Android and iOS
