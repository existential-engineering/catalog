description: FabFilter One is a simple, analog-sounding synthesizer plug-in.
  Available in VST, VST3, AU, AAX and AudioSuite formats for Windows and macOS.
details: |-
  For FabFilter One, tremendous effort was put into creating the best cut-off filter ever. The new design approach has resulted in the fattest and smoothest self-oscillating digital filter available. It has been tuned carefully to achieve the character and warmth of a classic analog synthesizer. FabFilter One's filter sounds raw but never cheap or digital, even at full resonance.

  The filter is fed by an equally high-quality solid-sounding oscillator, developed from scratch to be completely aliasing-free. It features sawtooth, triangle, and square wave forms with pulse width modulation.

  The oscillator and the filter can be modulated by the LFO and the EG. The LFO offers triangle and square wave forms, with adjustable wave balance so any wave form between sawtooth and triangle can be selected. The tempo can be synchronized to the host.

  What FabFilter One excels at is the attention to detail and fine-tuning visible throughout the plug-in. The portamento feature uses a carefully selected algorithm to make your playing more lively. Smart Parameter Interpolation handles changes to any parameter, ensuring both responsiveness and smooth transitions with no digital clicks or zipper effects.
specs: |-
  - Aliasing-free high quality oscillator with triangle, sawtooth, and square wave forms
  - Fat and ultra-smooth self-oscillating low-pass filter
  - LFO with tempo sync, triangle and square wave forms, and adjustable wave balance
  - Fine-tuned EG with additional Hold setting
  - Frequency and filter cut-off modulation
  - Pulse width modulation
  - Filter keyboard tracking
  - Velocity sensitivity
  - 10-voice polyphony
  - White/pink noise generator
  - Smooth portamento
  - Over 100 presets
  - MIDI Learn
  - Smart Parameter Interpolation
  - Sample-accurate automation of all parameters
