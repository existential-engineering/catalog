description: "Premium Fazioli F-228 grand piano sample library recorded at
  Metropolis Studios in London by Grammy Award-winning engineer Paul B. Norris.
  Warm and emotional, suitable for intimate tracks while remaining punchy at
  high velocities."
details: |-
  Mercury Lite: 1 merged mic position, 2x round-robin, 8 velocity layers, 4,784 samples, 3.59 GB. Mercury Pro: 5 mic positions, 4x round-robin, 8 velocity layers, 37,172 samples, 34.36 GB, 42 presets, NKS support. 3D interface. Professional mixing controls. Built-in effects (compressor, EQ, chorus, reverb). Sympathetic resonance modeling. Per-note temperament control.
specs: |-
  Requires Kontakt 5.7.3+. Mercury Lite requires full Kontakt. Mercury Pro works with Kontakt Player.
