description: Premium Fazioli F-228 grand piano sample library recorded at Metropolis Studios in London by Grammy Award-winning engineer Paul B. Norris. Warm and emotional, suitable for intimate tracks while remaining punchy at high velocities.
details: |-
  Fazioli pianos pursue perfection. They're delicate and sophisticated with a very rich low-end and lots of body resonance. Mercury piano was recorded by Grammy Award-winning Paul B. Norris at Metropolis Studio's Studio A. It sounds warm and very emotional, perfect for intimate low-key tracks, but it's also very punchy and aggressive on high velocities, a combination that you don't usually find on piano libraries.

  Harnessing the power of Kontakt, Mercury has an interface rendered in 3D. From the mixer you can control the different mics separately with the usual parameters that you'd normally get on an audio mixer, and with extra features like a new way of mixing that Wavesfactory calls "position enhanced". Each channel has a load/purge switch, pan/width, volume, mute, solo, phase shift and an output selector for mixing the different channels in your DAW.

  The effects page adds 4 DSP effects specially designed for piano. Metropolis Plates capture the sound of the EMT 140s from Metropolis Studios, in solid state and valve versions with different decay times. Beside them sit a peak compressor with threshold, ratio, attack, release and make-up controls, a tilt EQ that cuts or boosts the high and low frequencies with additional HP and LP filters, and a chorus with stereo spread, speed and depth controls.

  The piano was sampled with four true round-robin repetitions. From the settings page you can shape how the library reacts to incoming MIDI notes using the velocity curve parameters, control the volume of the non-tonal sound of the piano (release samples, sympathetic resonance, key and pedal noises), and set sample start offset, overall timbre, dynamic range, low enhancement and per-note temperament.

  Mercury Lite gives you the heart of the Mercury piano but with less load for those who have limited resources, designed to be lighter while retaining full sound and expressive capabilities. It merges all the mic positions with unity gain, the same sound as when you have all mic positions enabled at 0 dB on Mercury Pro.
specs: |-
  - Fazioli F-228 grand piano recorded at Metropolis Studios, Studio A, London
  - 5 mic positions, from ultra-close stereo to a spaced pair at the back of the room
  - 4x round robin
  - 8 velocity layers
  - 37,172 samples
  - 34.36 GB
  - 42 presets
  - NKS support
  - Works in Kontakt Player
  - Download via Continuata's Connect app
  - Mixer with load/purge per channel, pan/width, volume, mute, solo, phase shift and output selector
  - Effects page with Metropolis Plates, peak compressor, tilt EQ with HP and LP filters, and chorus
  - Settings page with velocity curves, non-tonal sound level, sample start offset, timbre, dynamic range, low enhancement and per-note temperament
