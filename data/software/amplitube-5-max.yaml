details: |-
  Holding the highest standard of accuracy and realism amplitube 5 was forged with 20 years of research and collaboration with the industry's top brands and artists, ik's dynamic interaction modeling captures every nuance of each gear model. And amplitube 5 premieres our volumetric impulse response engine, leveraging over 600 distinct impulse responses per speaker to set a new standard in cabinet sampling.

  Captures the sound, feel and vibe of over 400 of the most sought-after guitar & bass gear ever. Developed with top brands & artists: official gear from icons like fender, mesa/boogie, orange, slash, brian may, joe satriani and many more.

  Covers the entire signal chain: stomps, amps, cabs, speakers, mics, rooms and rack fx all in one interface, all routed the way you want. All-in-one recording & performance studio: with an 8-track recorder + DAW, looper, tuner, practice tools and live features all in one.

  An all-new drag & drop signal chain supports up to 57 simultaneous models, series / parallel routing and blended di signal for unprecedented creative freedom. New cabinet section with vir technology ("volumetric impulse response") radically transforms all 100+ cabinets in amplitube 5 with over 143,000 impulse response measurements in all.

  129 brand new models, including 2 new stomps, 5 acclaimed amps, 2 new rooms, 19 new rack fx and over 100 completely re-captured cabinets. Custom ir loader allows you to load, tilt and re-size your own impulse responses in place of any cabinet. A new mixer lets you easily blend multiple cabs, mics and di, with 19 new mixing effects, include some from t-racks 5 to add a final studio sheen to any track.
