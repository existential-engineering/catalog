description: The Reverb for a Better Spatial Arrangement. HOFA SYSTEM AlgoVerb
  is a postmodern premium reverb plugin that brings the sound of classic
  hardware reverb units into your DAW.
details: |-
  Reverb is certainly the most important effect in the studio. HOFA SYSTEM AlgoVerb is a postmodern premium reverb plugin that brings the sound of classic hardware reverb units into your DAW. Your mixes and masters will greatly benefit from AlgoVerb's distinctive three-dimensionality and the resulting depth.

  We've meticulously analysed the best reverb devices of the last 50 years for AlgoVerb. First of all, we wanted to preserve the classic reverb structures, because they defined our ideas of spatial depth and musical emotion. In addition, we wanted to evolve the processing possibilities, so we implemented modern technology and new ideas to make the use of reverb much easier and more effective.

  There are 9 impressive algorithms to choose from: Ambience, Plate, PlateHall, Chamber, ConcertHall, Cathedral, Deep, Huge and Cheap. The intensity of the early reflections can be controlled in AlgoVerb, it goes up to 200%, and combined with the diffusion control you can achieve a very interesting depth. Various algorithms have a special chorus that makes the reverb sound as dense as you want it, and the vintage mode goes late '70s with legendary downsampling and some "dirt".

  A novelty in algorithmic reverbs: the three decay multipliers can be used to change the length of low, mid and high frequencies of the reverb spectrum. Combined with the high and low cut filters, you have complete control over the reverb colour. More than just a gate, the AlgoVerb gate is triggered by the dry input signal, a feature also integrated into the IQ-Series Reverb, and can be used for precise and powerful gated reverb sounds.

  Plenty of presets are included so you can get started right away, organised into the categories Ambience, Cathedral, Chamber, Concert Hall, Drums, FX, Gated, Plate and Vox. AlgoVerb can be used as a single plugin in your DAW or inside the HOFA SYSTEM host.
specs: |-
  - 9 unique reverb algorithms: Ambience, Plate, PlateHall, Chamber, ConcertHall, Cathedral, Deep, Huge, Cheap
  - 3 decay multipliers for the length of low, mid and high frequencies of the reverb spectrum
  - High and low cut filters for control over the reverb colour
  - Early reflections adjustable up to 200%, with diffusion control
  - Vintage mode with downsampling and added "dirt"
  - Gate triggered by the dry input signal
  - Modulation chorus on various algorithms
  - Realistic early reflections and dense, smooth reverb tails
  - True stereo signal processing
  - Up to 32x oversampling
  - Scalable GUI for optimum readability at all times
  - "What you see is what you get" user interface
  - Presets organised in categories: Ambience, Cathedral, Chamber, Concert Hall, Drums, FX, Gated, Plate, Vox
  - Usable as a single plugin or within the HOFA SYSTEM host
  - Formats: VST3, AU, AAX
  - Operating system: macOS 10.13 or later, Windows 10 or later
  - Two licenses included, managed via the HOFA Plugins Manager; offline activation supported
  - Continuously tested on Ableton Live, Apple Logic, Avid Pro Tools, Bitwig, Cockos Reaper, Image Line FL Studio, Magix Samplitude/Sequoia, Fender Studio Pro, Steinberg Cubase/Nuendo/Wavelab
  - 14 days free trial
