description: The Reverb for a Better Spatial Arrangement
details: |-
  The Reverb for a Better Depth 9 unique reverb algorithms 3 groundbreaking DecayTime filters Usable as a single plugin or in HOFA SYSTEM Reverb is certainly the most important effect in the studio. HOFA SYSTEM AlgoVerb is a postmodern premium reverb plugin that brings the sound of classic hardware reverb units into your DAW! Your mixes and masters will greatly benefit from AlgoVerb’s distinctive three-dimensionality and the resulting depth. We’ve meticulously analysed the best reverb devices of the last 50 years for AlgoVerb. First of all, we wanted to preserve the classic reverb structures, because they defined our ideas of spatial depth and musical emotion. In addition, we wanted to evolve the processing possibilities, so we implemented modern technology and new ideas to make the use of reverb much easier and more effective. https://youtu.be/fMw9YOBNUJA HOFA SYSTEM AlgoVerb Early Reflections The intensity of the early reflections can be controlled in AlgoVerb – it goes up to 200%! Combined with the diffusion control you can achieve a very interesting depth. Presets Plenty of presets are included so you can get started right away. All presets are organised in the following categories: Ambience, Cathedral, Chamber, Concert Hall, Drums, FX, Gated, Plate and Vox. Algorithms There are 9 impressive algorithms to choose from: Ambience, Plate, PlateHall, Chamber, ConcertHall, Cathedral, Deep, Huge, Cheap Vintage Mode Go late ’70s with the vintage mode: legendary downsampling and some “dirt”. Modulation Various algorithms have a special chorus that makes the reverb sound as dense as you want it. Gate More than just a gate: the AlgoVerb gate is triggered by the dry input signal . This feature is also integrated into the IQ-Series Reverb and can be used for precise and powerful gated reverb sounds. Decay Multipliers A novelty in algorithmic reverbs: the three decay multipliers can be used to change the length of low, mid and high frequencies of the reverb spectrum – combined
