description: High-end mixing tool offering dynamic processing for compression,
  harmonics, and stereo width adjustment. Three mixing plugins in one elegant
  workflow.
details: |-
  HYPE is a powerful mixing plugin that brings the capabilities of high-end
  hardware to your DAW. It offers advanced multi-band compression, rich harmonic
  enhancement, and precise stereo width controls for sculpting
  professional-grade mixes.

  Easily add warmth, saturation, or distortion with multiple harmonic generators
  and six flexible compressor modes. Hype's innovative technology ensures clean
  harmonic overtones at any gain level, preventing unwanted distortion.

  Control your sound with unprecedented precision using hype's multi-band
  functionality and mid/side processing. Enhance stereo image, shape transients,
  and target specific frequencies across your mix.

  The built-in auto level feature lets you focus on creative decisions, not
  perceived loudness. Whether you're working with drums, vocals, or your entire
  master, hype delivers the tools to take your sound to the next level.

  Multi-band compression with six versatile compressor modes (slam, opto, brick,
  transient, combo, gentle) ideal for drums, vocals, mastering, and more.
  Advanced harmonic enhancement adds warmth, grit, or pure saturation with
  multiple harmonic generators and modes across three frequency bands.
specs: |-
  - Multi-band compression
  - Six compressor modes (slam, opto, brick, transient, combo, gentle)
  - Advanced harmonic enhancement
  - Multiple harmonic generators
  - Stereo width control
  - Mid/side processing
  - Dry/wet controls
  - Tone shaping
  - Auto level
  - Universal 2 binary
