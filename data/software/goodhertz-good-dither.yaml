description: Good Dither is a dither plugin featuring smooth, perceptually
  optimized noise shaping designed for reducing bit depth in audio production,
  with auto-blanking when input is silent.
details: |-
  Good Dither is a very good dither that's very easy to work with. Set it on "Optimal," and it will optimize the dither and noise shaping for any combination of bit depth and sample rate.

  Every time you reduce the audio bit depth you should dither to prevent distortion and quantization error. 24 bit to 16 bit, 32 bit to 24 bit, any time you reduce the word length.

  There are a lot of very bad dither algorithms in use: ones with nasty, overly aggressive noise shaping curves that can do more harm than good. Good Dither's noise shaping increases resolution while staying smooth and natural-sounding and avoiding extreme high-frequency peaks.

  Dither adds noise to audio signals in order to prevent distortion that otherwise would occur. The noise shaping of the dither affects the frequency spectrum of that noise. Generally, the goal of a noise shaping algorithm is to move noise energy away from areas that the human ear is very sensitive to and to push it to places that we're not as sensitive (very high or very low frequencies). The tradeoff is that aggressive noise shaping adds higher peaks in the dither signal, so the best dithers strike a good balance between noise reduction and avoiding excessive peaks.

  Goodhertz positions Good Dither as the first plugin in their "Good" series of inexpensive utility plugins, and it is also available for licensing into third-party apps.
specs: |-
  - Smooth, perceptually optimized noise shaping
  - Designed for all sample rates
  - Auto blanking when input is silent
  - Simple controls
  - "Optimal" mode auto-selects dither and noise shaping for any combination of bit depth and sample rate
  - Goodhertz "Optimal": 6 dB perceived noise reduction, 16 dB highest peak relative to flat dither
  - Goodhertz "High": 8 dB perceived noise reduction, 24 dB highest peak
  - Goodhertz "Low": 4.5 dB perceived noise reduction, 10 dB highest peak
  - 64-bit only; requires a 64-bit DAW
  - macOS 10.13 or later, Windows 10 or later
