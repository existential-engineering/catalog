description: smart:gate is a content-aware gate that features intelligent source
  detection, looking for a chosen target source in the input signal. Compared
  with conventional gates, it delivers solid results and makes parametrization
  fast and easy.
details: |-
  Gating can be a tricky task. With smart:gate it comes down to selecting a target source from a drop-down menu, whether that target is vocals, electric guitar, piano or one of many other options. The intelligent gate stays reliable even when the target source varies in level, or when a competing instrument is louder than the signal meant to be kept, so its content-aware processing works where conventional gate plug-ins struggle.

  The plug-in is able to differentiate between a mix and the signal component contained within it, and both the target signal activity and the gating itself are visualized in detail. Together with Instant Replay, that visual guidance provides the insight needed to finish parametrization and tweaking much faster, using familiar controls rather than guesswork.

  Beyond its target source detection, smart:gate carries a range of features for fine-tuning, including a three-band suppression network for weighting the gating across the frequency spectrum. The level bias increases the level dependency of the processing, which helps when refining the response to transient target sources. Since gating and ducking are closely related in their processing, the plug-in can also be switched to ducking mode with the same target-focused functionality, and its content-aware features can be turned off so it works as a conventional gate.
specs: |-
  - Content-aware gate processing with intelligent target source detection
  - Wide range of instrument and sound profiles
  - Detailed visualization of target signal activity and gating, plus Instant Replay
  - Three-band suppression network for weighting gating across the frequency spectrum
  - Level bias for increased level dependency on transient sources
  - Switchable ducking mode, and a conventional gate mode with the AI features disabled
  - Plug-in formats (Mac): VST, VST3, AU, AAX
  - Plug-in formats (Windows): VST, VST3, AAX
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok
  - Apple Silicon support: native
  - Latency: about 80 ms
  - Windows: Windows 10 (64 bit)
  - Mac: macOS 10.13 or newer
  - RAM: 4 GB
  - CPU: Intel Core (i5) or Apple Silicon
  - GPU: OpenGL version 3.2 or newer
