description: smart:gate is a content-aware gate that features intelligent source
  detection, looking for your chosen target source in the input signal.
details: |-
  smart:gate features intelligent source detection that focuses on your selected target source in the signal. In comparison with conventional gates, smart:gate delivers solid results and makes parametrization incredibly fast and easy.

  Gating can be a tricky task, and with smart:gate, it's as simple as selecting a target source from a drop-down menu. Whether you're targeting vocals, electric guitar, piano or one of many other options, the intelligent gate reliably delivers even when the target source varies in level, or a competing instrument is louder than the signal you want to keep. smart:gate's content-aware processing unlocks its full power where conventional gate plug-ins struggle.

  Finally, a gate that is truly able to differentiate between a mix and the signal component contained within it. Both the target signal's activity and the gating are visualized in detail. Together with Instant Replay, you are provided with all the insights you need to get your parametrization and tweaking done much faster, all with familiar controls and without any guesswork.

  Besides its intelligent target source detection, smart:gate sports a host of features for fine-tuning, such as a three-band suppression network for weighting the gating across the frequency spectrum. The level bias enables you to increase the level-dependency of the processing, extremely handy when you want refine the response to transient target sources. And, since gating and ducking are closely related in their processing, the gate plug-in can be switched to ducking mode, offering you the same target-focused functionality. You can also use smart:gate without its content-aware AI features as a conventional gate.
specs: |-
  - Content-aware gate processing
  - A wide range of instrument and sound profiles
  - Visual guidance and intelligent ducking
  - Intelligent source detection: the target source is picked from a drop-down menu (vocals, electric guitar, piano and many other options)
  - Three-band suppression network for weighting the gating across the frequency spectrum
  - Level bias to increase the level-dependency of the processing
  - Ducking mode with the same target-focused functionality as the gate
  - Instant Replay, with the target signal's activity and the gating visualized in detail
  - Can also be used as a conventional gate, without the content-aware AI features
  - Plug-in formats (Mac): VST, VST3, AU, AAX
  - Plug-in formats (Windows): VST, VST3, AAX
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok
  - Apple Silicon support: native
  - Latency: about 80ms
  - Latest version: 1.0.1
  - System requirements (PC): Windows 10 (64 bit)
  - System requirements (Mac): MacOS 10.13+
  - RAM: 4GB
  - CPU: Intel Core (i5), Apple Silicon
  - GPU: OpenGL Version 3.2+
