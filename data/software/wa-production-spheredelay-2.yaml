description: SphereDelay 2 is a multimode delay with Mono, Stereo, Ping-Pong and Ping-Pong Separate modes, each offering LFO and envelope follower modulation of the delay time. It builds on the original SphereDelay with a revised interface and engine, plus new Space Length and Space Amount parameters.
details: |-
  SphereDelay 2 is a multimode delay effect plugin built on the foundation of the original SphereDelay, adding new features and a set of enhancements to the earlier design.

  The interface is modernised and resizable, so it can be fitted to any screen or workflow, and the engine is upgraded for sound quality and performance. Compatibility with current DAWs and operating systems was extended at the same time.

  Three parameters are new to this version. Space Length adds a further dimension to the delay effect for more expansive results, Space Amount gives fine control over the intensity of that space effect, and envelope time modulation adds dynamic modulation for more complex textures.

  Four delay modes are retained from the original: Mono, Stereo, Ping-Pong and Ping-Pong Separate, each with its own delay characteristics. Delay time can be modulated by an LFO and an envelope follower in every mode, and a reverse feature reverses the input while leaving the integrity of the feedback signal intact.

  A stereo filter with saturation, LFO and envelope follower modulation shapes the delayed signal, and over 50 presets are included, ranging from classic tape delay imitations through to psychedelic and spacious effects.
specs: |-
  - Four delay modes, Mono, Stereo, Ping-Pong and Ping-Pong Separate
  - Delay time modulation by LFO and envelope follower in every mode
  - Reverse feature that keeps the feedback signal intact
  - Stereo filter with saturation, LFO and envelope follower modulation
  - Space Length and Space Amount parameters
  - Envelope time modulation
  - Over 50 presets
  - Resizable interface
  - Windows 10/11 or higher (64 bit)
  - macOS 10.14 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
