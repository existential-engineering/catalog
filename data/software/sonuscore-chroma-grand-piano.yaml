description: Chroma Grand Piano is not only a high-quality go-to piano for even your most demanding orchestra needs, it is also an endless source for inspiration. Recorded from a Yamaha C3 with 23 velocity layers and 8 round robins, it features 4 freely adjustable microphone positions and unique sound design capabilities.
details: |-
  CHROMA - GRAND PIANO is the Sonuscore flagship grand piano, recorded from a world class Yamaha C3, the highest quality studio piano Yamaha offers and an instrument known for its responsive touch, expressive tonal qualities and rich resonance. The library aims to be both a perfect recreation of the instrument's acoustic properties and a full exploration of it, reaching from the profundity of a single note through to mallets, pads and e-bow for rich and inspiring soundscapes.

  The recordings cover 23 velocity layers and 8 round robins for mechanical sounds. Beyond conventional keys, the piano was explored with palm mutes, brushes, mallets, e-bow and chains, all adjustable and combinable within the instrument. Mechanical detail is separately controllable through Note On (press), Note Off (release) and Pedal sounds.

  Four microphone positions (A/B, X/Y, ORTF and a submic) are freely adjustable, and an adjustable velocity curve lets the dynamic response be matched to nearly any keyboard. The sound can be shaped further by attack, decay, delay, density, octavation, detune, sample-start and a pan randomizer.

  The engine, inspired by TIME TEXTURES and carrying full mod wheel support, uses the different recordings of the piano and its body along with a set of creative effects to move the instrument well past a piano, from new and abstract soundscapes to mimicking the sound of rain. The interface spans a main page for articulation mix, FX and mechanics, an engine page, a preset browser holding over 90 presets, and a mix page for microphone balance and velocity curve.
specs: |-
  - Works with the FREE KONTAKT PLAYER
  - Requires KONTAKT version 7.10.9 or higher
  - macOS 13, 14 or 15 (latest update)
  - Windows 10 or 11 (latest service pack)
  - 8 GB RAM (more recommended)
  - At least 11 GB of free hard disk space, SSD recommended
  - Some presets require a fast CPU, Intel i7 processor or higher
  - 23 velocity layers
  - 8 round robins for mechanical sounds
  - 4 freely adjustable microphone positions: A/B, X/Y, ORTF, submic
  - Over 90 creative and inspiring presets
  - Multiple modifiable articulations: brushes, mallets, e-bow, palm mutes, chains
  - Adjustable mechanics: Note On, Note Off, Pedal
  - Adjustable velocity curve to match nearly any piano keyboard
  - Sound shaping via attack, decay, delay, density, octavation, detune, sample-start and pan randomizer
  - Full mod wheel support of its core engine, inspired by TIME TEXTURES
  - Sampled from a Yamaha C3 grand piano
