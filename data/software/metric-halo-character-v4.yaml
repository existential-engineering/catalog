details: |-
  Character is a plug-in that adds the distortion characteristics of classic analog circuits to source tracks.

  Character was built by asking tracking, mixing and mastering engineers for the analog hardware they used, the mic pres, DIs and EQs relied on for recording, mixing and mastering. SpectraFoo was then used to measure the ways those processors add analog distortion to the sound run through them, and that distortion was modeled with Metric Halo's proprietary +DSP technology.

  Character provides 24 different models, incorporating the sound of tubes, transformers and solid state devices. A Drive control, with an autodrive mode, allows the distortion to be pushed harder for extreme sound mangling, and an output gain control is provided for level matching.

  The processing is oversampled and antialiased for euphonic analog distortion, with user selectable oversampling modes. The UI size is adjustable and the MH Preset Manager provides cross-platform presets.

  Version 4 adds additional oversampling options and a new UI for Character, plus a VST3 version on both macOS and Windows with native Apple Silicon support for VST hosts including Steinberg products. All v4 plug-ins add undo/redo, A/B snapshots with snapshot blend, software update tracking, more flexible resizability, common controls in the header bar, improved preset management, settings copy and paste between instances, a plug-in details pane reached from the MH logo, a smaller installer download on macOS, configurable themes, selectable knob styles and user preferences for band colors, UI colors and knob rings.
specs: |-
  - Provides 24 different Character models
  - Oversampled and antialiased for analog euphonic distortion
  - User selectable oversampling modes
  - Manual Drive control to set how hard the distortion is hit
  - Autodrive for consistent distortion at all signal levels
  - Output Gain for level matching
  - Adjustable UI size
  - MH Preset Manager provides cross-platform presets
  - macOS 10.10 or newer, Intel processor or Apple Silicon, AU, VST 2 and 3 or AAX (Pro Tools 11 and newer Native) host, 64 bit
  - Windows 7 or newer, Intel processor, VST or AAX (Pro Tools 10, 11 and 12 and Native) host, 64 bit
  - Requires an iLok.com account
  - License includes two activations for the account
  - iLok dongle is optional, the license can be installed on the machine, on an iLok or in the iLok Cloud
  - Only one license required, works on all supported platforms
