description: DF-TRANSIENT 2 is a transient designer for drums with adjustable attack and sustain slope envelopes, three operation modes including filtered detection and internal or external sidechain, an adjustable detector threshold, and a mix knob for parallel processing.
details: |-
  DF-TRANSIENT 2 dynamically transforms drum sounds musically rather than mechanically. Whether the mix needs extra snare crack, less kick sustain, overheads turned into faux room mics, or extreme transformation across percussive loops, the plugin is built to deliver that result.

  Dynamic shaping is handled through full control over the slope envelope on both attack and sustain, with three independently selectable slope envelopes and adjustable slope times. Each 2x button independently extends the range of attack and sustain.

  Two sidechain modes can be used internally or externally. Filter mode inserts a high pass or low pass filter into the detector circuit so a specific frequency range drives the detection, and Focus mode pinpoints a distinct frequency for processing. A parallel mix control blends the processed and unprocessed signals for more organic results.

  The practical use is groove: injecting life into stale drum loops, tightening a performance to feel more intimate, relaxing attack to make a kit feel softer and more organic, pushing attack forward for punch, or driving sustain so the kit breathes more.
specs: |-
  - Three operation modes: classic, filter detection, and sidechain via external source or internal frequency focus
  - Optimized attack and sustain times on switchable buttons designed for mixing drums
  - 2x buttons independently increase the range of attack and sustain
  - Built-in mix knob for parallel processing
  - New and improved attack and sustain algorithms
  - Adjustable attack and sustain slope times with three independently selectable slope envelopes
  - Improved detection algorithm with adjustable detector threshold
  - Two stereo link mode types
  - Improved sidechain flexibility
