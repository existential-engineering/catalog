description: DF-TRANSIENT 2 is a drum transient shaping plugin that gives you dynamic control over the attack and sustain characteristics of your drum sounds. From adding snare crack and tightening kick sustain to creating extreme percussion effects, it offers three operation modes — classic, filter detection, and sidechain — for comprehensive mixing flexibility.
details: |-
  DF-TRANSIENT 2 is a professional drum transient shaping plugin designed to give producers and mix engineers precise dynamic control over drum sounds. It targets the attack and sustain phases independently, allowing you to enhance snare crack, tighten kick sustain, or push percussion to extreme, creative territory.

  The plugin ships with three distinct operation modes. Classic mode provides standard transient detection, Filter Detection mode uses frequency-selective analysis for more surgical shaping, and Sidechain mode allows an external signal to drive the detector — enabling creative parallel and hybrid processing setups.

  Attack and sustain parameters each feature dedicated 2x range extension buttons and three selectable slope envelopes, giving you fine-grained control over how aggressively transients are shaped. An adjustable detector threshold and two stereo link modes round out the detection engine.

  A built-in parallel processing mix knob lets you blend the processed signal with the dry input without needing an external parallel chain, preserving the natural feel of the source while adding punch or sustain control.

  DF-TRANSIENT 2 is compatible with macOS 11+ (Intel and Apple Silicon native) and Windows 8.1+, and ships in VST3, AU, and AAX formats. It includes a perpetual single-user license with lifetime updates and unlimited customer support.
specs: |-
  - Three operation modes: classic, filter detection, and sidechain
  - Independent attack and sustain controls with 2x range extension buttons
  - Three selectable slope envelopes for attack and sustain
  - Adjustable detector threshold
  - Built-in parallel processing mix knob
  - Two stereo link modes
  - macOS 11+ — VST3, AU, AAX (Intel and Apple Silicon native)
  - Windows 8.1+ 64-bit — VST3, AAX
  - Perpetual single-user license with lifetime updates
