details: >-
  Analog studio preamp is a virtual effect audio plugin for macos and windows
  that functions as a VST plugin, an audio units plugin, a VST 3 plugin and an
  AAX plugin.


  Analog studio rack provides a modular rack with hot-swappable 500 series style
  eq's, compressors, gate, exciter and a tube driven pre-amp as an all-in-one
  channel strip. The rack has been split into individual modules for separate
  and bundle purchase.


  As - preamp is a tonal colouration box designed to saturate your music,
  increase the warmth and drive the circuit for some sweet flavours.


  The plug-in comes with an array of presets specifically designed for various
  instruments as your starting point, which can be utilized in mixes, tweaked,
  or customized to create your own.
