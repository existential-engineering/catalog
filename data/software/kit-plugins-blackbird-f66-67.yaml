description: "Deep within the heart of blackbird studio lies a sacred rack of
  gear, meticulously curated and fiercely protected: martina's vocal chain."
details: |-
  The f66/67 plugins embody the essence of martina mcbride's personal fairchild
  660 compressor as a true real world model. The f66 and 67 give you the secret
  sauce behind some of the most beloved tracks ever recorded, adding that
  unmistakable warmth and control heard on countless records.

  The bb f66 replicates martina's iconic 660 with that classic warm, rich tone.
  Carefully modeled to ensure that it captures the true character and feel of
  the original.

  The bb f67 has the same legendary 660 sound with the added offering of a 670s
  mid/side processing and individual stereo controls, providing more flexibility
  and creative possibilities.

  A free ilok account and ilok license manager installation is required.
  Activation support for ilok cloud, ilok gen 2 or 3 keys (machine activation
  not support). 2 activations are provided per license purchase for use.
specs: |-
  - Fairchild 660 compressor modeling
  - Mid/side processing
  - Stereo controls
  - Ilok cloud activation support
  - Ilok gen 2 or 3 keys support
  - macOS 10.14 or above (intel, and m-series)
  - Windows 7 or above (intel i3, amd quad-core, or later)
  - 64-bit operating system and DAW required
  - Minimum 4 GB RAM
  - 4 GB free disk space required
  - 2 activations per license purchase
  - Universal 2 binary
