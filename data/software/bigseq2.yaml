details: |-
  BigSeq2 is a Massive extension to the feature set of Audio Damage's bigseq
  gate effect. With twelve sequencers controlling ten effects in six blocks,
  BigSeq2 is capable of everything from short staccato gate sequences to long,
  evolving filter sweeps and frequency shifts, and everything in between.

  The six effect "blocks" contain ten effects in total, and these blocks can be
  re-arranged simply by dragging them, giving you full control over the routing
  of the effects. Each effect block has a gate sequencer and a modulation
  sequencer.

  The gate sequencer turns that effect on and off (or in the case of the delay
  block, activates the "send" control), while the modulation sequencer can
  affect any and all parameters in that block.

  The gate and modulation sequencers for each effect block run on their own
  time-base, allowing different time signatures and step times for each effect.
  Each sequencer has three independent modes of operation: forward, reverse, and
  random step.

  The included effects are vca, pan, multi-mode filter, fuzz, sine warp, delay
  (with chorus and flanger modes), frequency shifter (also providing ring mod
  and phasing), sample rate reduction, bit depth, and our own "error" effect.
  MIDI learn on all published parameters for external hardware control. (VST
  only.)
