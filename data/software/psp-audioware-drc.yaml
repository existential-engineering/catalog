details: |-
  PSP DRC is a powerful new dynamic processor plug-in inspired by the legendary DBX 118. With a fresh perspective on the classic concept, PSP DRC offers advanced processing capabilities that are seldom found in contemporary hardware or software, making it an essential tool for modern music production.

  While the PSP DRC draws inspiration from the DBX 118, it is not a direct emulation of the original hardware. Instead, it re-imagines and expands upon the original concept, incorporating additional features to enhance its utility in various audio processing scenarios. This unique approach allows users to harness both compression and expansion across the entire dynamic range of the signal. Additionally, the processor can isolate and handle signals above or below the threshold, providing a more refined level of control.

  PSP DRC also introduces a complementary compressor-expander pair function, which can be achieved by setting the Ratio to 2:1 in the compressor and down to 1:2 in the expander. The inclusion of advanced side chain features and external side chain support further elevates PSP DRC's capabilities, transforming it into a comprehensive compander system.

  In order to run PSP DRC in 30-day trial mode or activate it, you need an iLok user ID which you can create for free at www.ilok.com, and you need to install the free iLok License Manager application but you don't need any hardware dongle. You can activate the license in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above). You can move these licenses at any time using PACE's iLok License Manager software.
specs: |-
  - Dynamic range controller inspired by the DBX 118, re-imagined rather than a direct emulation
  - Compression and expansion across the entire dynamic range of the signal
  - Can isolate and handle signals above or below the threshold
  - Complementary compressor-expander pair function (Ratio 2:1 in the compressor, down to 1:2 in the expander)
  - Advanced side chain features with external side chain support, forming a comprehensive compander system
  - Windows 7 - Windows 11, 64-bit VST / VST3 / AAX (Pro Tools) hosts
  - macOS 10.14 Mojave - macOS 15 Sequoia, Intel and Apple Silicon, 64-bit AudioUnit / VST / VST3 / AAX (Pro Tools) hosts
  - iLok user ID and iLok License Manager required, no hardware dongle needed
  - License activatable in 3 separate locations
