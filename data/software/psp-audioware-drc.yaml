description: PSP DRC is a powerful dynamic processor plug-in inspired by the legendary DBX 118. Rather than being a direct emulation, it reimagines the classic concept with expanded capabilities, allowing users to harness both compression and expansion across the entire dynamic range of the signal.
details: |-
  PSP DRC is a powerful new dynamic processor plug-in inspired by the legendary DBX 118. With a fresh perspective on the classic concept, PSP DRC offers advanced processing capabilities that are seldom found in contemporary hardware or software.

  Rather than directly emulating the original DBX 118, PSP DRC reimagines the concept with expanded features. It enables users to harness both compression and expansion across the entire dynamic range of the signal, and can isolate and handle signals above or below the threshold.

  The plugin includes a complementary compressor-expander pair function with external sidechain support, high-pass sidechain filtering, adjustable attack and release controls, a mix control, and saturation modeling.

  Licensing uses iLok License Manager (no hardware dongle required). 30-day trial available.
