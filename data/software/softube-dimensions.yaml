description: Get the greatest reverbs for music production in one plugin.
  Dimensions by Softube features seven distinctive reverb algorithms, from
  mechanical plates to Random Hall, for a variety of colors and sounds.
details: |-
  Seven distinctive reverb algorithms, from mechanical plates to Random Hall, for a variety of colors and sounds. An inspiring visualizer that intuitively illustrates the sound of the reverb tail. A comprehensive and thoughtful preset collection. And an added Shimmer Effect that turns any of the reverbs into a shimmer reverb.

  This isn't just another reverb plug-in. This is a transcendent tool for your sound. Access all the essential reverbs needed for your productions in one elegant plug-in. Enter Dimensions.

  At the root of Dimensions lies seven distinctive algorithms designed to cover most of your production needs and offer a variety of colors and sounds. There are vibey and colorful mechanical reverbs, such as the Spring and Plate reverbs, and recreations of the most coveted reverb designs in music production, such as the ethereal Concert Hall and the famous Random Hall, with its beautiful spatialization that glues together any source. In addition, there is the Room reverb, a variation of the Concert Hall algorithm that is tuned for smaller sizes with less pronounced echoes, and the Cathedral reverb which was originally developed as a synth reverb but has been improved upon and designed to be lush and long.

  The new Chamber reverb is based on an all-new reverb tail generation method and is perfect for short decays, such as drum rooms. At longer decay times, this algorithm's preserved pitch provides a sound that offers a different flavor from the other long reverbs in Dimensions.

  The Shimmer section allows users to turn any of the reverbs into a shimmer reverb. As with nearly every tweak you make in Dimensions, users can watch their adjustments to the Shimmer section play out with the Reverb Tail Visualizer. Taking inspiration from the waveform display of a pioneering sampler workstation from 1979 and Joy Division's Unknown Pleasures cover, Softube created something that intuitively illustrates the sound of the reverb tail with inspiring effect.
specs: |-
  - A collection of the greatest reverbs in recorded history, expertly recreated in one plug-in
  - Seven distinctive reverb algorithms: Spring, Plate, Concert Hall, Room, Random Hall, Cathedral, and Chamber
  - Shimmer effect that makes any reverb a shimmer reverb
  - The inspiring reverb tail visualizer
  - A comprehensive collection of presets
  - Controls: Time, Dry/Wet, Dark/Bright, and Predelay
  - Spring: bold and obvious classic spring reverb, modeled from a tape echo unit
  - Plate: dark and dense vocal and drum reverb, with three mechanical plate emulations and one emulation of a classic digital plate reverb from 1976
  - Concert Hall: lush and sparse vocal and synth reverb, designed in 1978
  - Room: dense and versatile, excels at studio ambiance and shorter reverbs
  - Random Hall: open and clear '80s classic with spatialization that glues with any source
  - Cathedral: long and lush, synthetic and big, with beautiful modulation
  - Chamber: maximally dense and modulated, without audible pitch artifacts, using a newly developed reverb tail generation method
  - Supports Softube Extended Features panels
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26
  - System requirements: Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access for downloading installers and managing licenses
  - Three activations included
