details: |-
  Bent is a circuit-Bent resynthesis effect. It will recreate the incoming audio
  into an approximation of itself using a waveform-morphing audio oscillator.
  Depending on the volume and pitch of the audio, it will gate, stutter and
  morph the output in sync with your host tempo.

  Bent has a nice little interface, pretty easy on the eyes and easy to use. The
  "jitter", "morph" and "grain" controls are easy to use with their slider
  interface. They were pretty responsive.

  The sound is nice and dirty, with lots of grit and stuttering added to the
  source sound. It's cool to drop bent onto a signal chain and just let it mess
  something up, you can make something new out of that pretty easily.
specs: |-
  - Circuit-Bent resynthesis effect
  - Waveform-morphing audio oscillator
  - Gating
  - Stuttering
  - Morphing output
  - Host tempo sync
  - Jitter control
  - Morph control
  - Grain control
  - Windows compatible
