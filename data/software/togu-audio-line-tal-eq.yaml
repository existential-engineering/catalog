description: TAL-EQ is a versatile graphical equalizer designed for great sound and a fast workflow, featuring analog frequency response and phase behavior, zero latency operation, dynamic band processing, and MIDI learn for all band parameters.
details: |-
  TAL-EQ is a versatile graphical equalizer designed for great sound and a fast workflow. The frequency display shows frequency content and all changes in real time, supporting band frequencies up to 30 kHz.

  The plugin always runs with zero latency without oversampling and emulates the frequency response and phase behavior of analog equalizers, with no cramping near the Nyquist frequency. The topology-preserving TPT filter core remains stable even with fast dynamic changes.

  Shelf and bell filters support dynamic processing — the EQ band gain is controlled by the input level of the affected frequency range, achieving more transparent mixes with frequency-specific compression. Most filters support slopes from 12dB up to 96dB per octave.

  All band parameters support full DAW automation and MIDI Learn including band selection. Undo/redo and A/B comparison are included. Double-click to create a new EQ band; hold SHIFT while creating to enable dynamics immediately.
specs: |-
  - Zero latency, no oversampling
  - Analog frequency response and phase behavior (no Nyquist cramping)
  - Per-band frequency range up to 30 kHz
  - Robust TPT filter core stable under modulation
  - Dynamic processing on shelf and bell filters
  - Slopes from 12dB to 96dB per octave
  - Full DAW automation and MIDI Learn for all band parameters
  - A/B comparison and undo/redo
  - Windows 10 or higher (64-bit host)
  - macOS 10.11 or higher, Universal Binary 2 (Intel + Apple Silicon)
  - Pro Tools 10.3.6 or higher for AAX (64-bit)
  - Linux 64-bit / Ubuntu 20.04 or similar
