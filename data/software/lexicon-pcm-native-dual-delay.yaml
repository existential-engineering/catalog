description: Lexicon PCM Native Dual Delay is a state-of-the-art digital delay
  plug-in offering four independently adjustable delay voices (two per input
  channel) with delay times up to 9.5 seconds.
details: |-
  Lexicon invented digital delay, and the PCM Native Dual Delay plug-in is the natural progression from those early models into the modern computing era. The plug-in delivers a state-of-the-art digital delay generator with four total delay voices — two per input channel — each with independently adjustable delay times of up to 9.5 seconds.

  Each delay voice includes EQ, filter, polarity, pan, and level controls, making it easy to dial in classic effects like slapback, echo, tape echo, digital delay, ping pong, and double tracking. The interface mirrors the workflow of Lexicon's hardware processors so that engineers familiar with PCM-series units feel immediately at home.

  The PCM Native Dual Delay is available individually and as part of the PCM Native Effects Plug-In Bundle. It runs as a VST, AU, or RTAS effect plug-in on Mac and Windows hosts and requires an iLok2 for authorization.

  The product is marked Discontinued on the Lexicon Pro site; the final release was version 1.2.6 (August 2016) with Intel Mac and Windows installers. No Apple Silicon, AAX, or VST3 build was released.
specs: |-
  - 4 total delay voices (2 per input channel)
  - Delay times up to 9.5 seconds per voice
  - Per-voice EQ, filter, polarity, pan, and level controls
  - Effects include slapback, echo, tape echo, digital delay, ping pong, and double tracking
  - iLok2 authorization required
  - Part of the PCM Native Effects Plug-In Bundle
