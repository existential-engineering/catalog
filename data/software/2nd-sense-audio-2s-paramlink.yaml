description: Paramlink plugin helps you make parameter connections between
  multiple paramlink plugin instances, hence saves your automation drawing.
details: |-
  You can define their relationship: following by the same value, following by a scaled value, or following by its reversed value.

  Imagine you want track a to follow the same volume envelope/changing trend of track b's volume, you can simply insert two paramlink plugin instances on these two tracks and let track a's volume parameter in its paramlink plugin to follow the same value of track b's volume parameter.

  If you want track a's volume to drop when track b's volume is rising, simply set the rule as reverse. You only need to define track b's volume behavior, and track a's corresponding parameter will follow automatically by the selected rule.

  2s paramlink is a virtual effect audio plugin for macos and windows.
specs: |-
  - Parameter linking
  - Multi-instance support
  - Automation drawing
  - Value following
  - Scaled value following
  - Reversed value following
  - Parameter relationship definition
