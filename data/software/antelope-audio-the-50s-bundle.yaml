details: |-
  There’s whole lotta shakin’ goin’ on in The Sound of 50’s FX Bundle. The four included effects recreate hardware units that not only defined the 50’s, but transcended recording studios and became deeply rooted in the culture of the time. The bundle is aimed at producers wanting authentic vintage character from the decade that gave rise to rock‑and‑roll and pop‑art.

  Reel‑to‑Reel (Tape Saturation) combines the best tape formulas, the best tape heads and the finest electronics, letting you add unique tape effect to your mix. Blonder‑Tongue Audio Baton (Tube Graphic Equalizer) is a rare all‑tube graphic equalizer capable of increasing the clarity of instruments and vocals alike. Tubechild 670 (Vari‑Mu Tube Compressor/Limiter) is modeled after the most expensive and sought after tube compressor/limiter of all time, its colorful vintage transformers having shaped the sound of more hits than any other piece of gear in the history of music. VPA76 (Tube Mic Preamp) is based on a vintage German microphone preamp hailed as the “Rolls‑Royce” of tube mic preamps, built to exceedingly high technical and engineering standards.

  The bundle runs natively in any DAW on macOS or Windows, or in real time on a Synergy Core audio interface.
