details: |-
  BLEASS Phaser delivers a comprehensive and highly versatile phasing effect.
  Whether you're looking for gentle movement, resonant swirls, or stunning
  atmospheric soundscapes, BLEASS Phaser can do it all. The plugin's interface
  is dominated by a colourful and captivating visualisation that illustrates the
  notch frequencies that create the phasing effect.

  Phasers use all-pass filters to create frequency-specific phase changes within
  a sound. When this sound is overlaid on the original unprocessed sound, it
  creates notch filters at the cutoff frequencies of the all-pass filters. By
  using multiple all-pass filters, with frequencies that spread from a "centre"
  frequency determined by the first all-pass filter, a complex comb filtering
  effect is generated.

  Adding modulation to the filter frequencies leads to the characteristic
  sweeping, whooshing sound that phasing is known for. Bleass phaser has two lfo
  modulation sources. The first modulates the notch filter cutoff frequencies,
  the second modulates the spread of notch frequencies around the initial centre
  frequency.

  This detailed and intuitive display, coupled with bleass' trademark tactile
  interface design, demystifies the entire phasing process, and makes working
  with bleass phaser a joy. The bleass phaser visualisation provides an
  intuitive readout of the processor's activity. Vertical bars represent the
  notch filters, whilst the horizontal position of these bars indicates the
  current frequency at which each filter is operating.

  This allows the plugin to create classic repetitive phasing effects, as well
  as complex, ever-shifting notch patterns that add tons of sonic interest to a
  part.
specs: |-
  - All-pass filters
  - Frequency-specific phase changes
  - Notch filters
  - Comb filtering effect
  - Two LFO modulation sources
  - Frequency LFO
  - Spread LFO
  - Beat mode synchronization
  - Free mode
  - Sine wave LFO
  - Triangle wave LFO
  - Phase offset control
  - Notch filter count adjustment
  - Centre frequency control
  - Spread frequency range control
  - Feedback/resonance control
  - High frequency reduction (color)
  - Frequency visualization
  - macOS support
  - Windows support
  - iOS support
