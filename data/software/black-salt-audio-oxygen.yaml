description: Oxygen uses a unique process to control & enhance the top-end of any track in your mix, with a smooth & musical character you can't get from EQ.
details: |-
  Oxygen boosts, shapes, and controls the top end of a mix without the harshness that comes from stacking EQ boosts at 12k or 16k. It uses a smooth crossover filter with three precision cutoff points, Bite, Presence, and Air, each targeting a different part of the high end without pulling in the mids or muddying what's underneath.

  A tape saturation circuit adds harmonics to vocals, overheads, and acoustics in a controlled way, aiming to avoid brittleness as the signal is pushed. Two compression modes tuned specifically for high frequencies, Punch and Smooth, are included for cutting through a mix or letting a vocal breathe.

  The stereo version includes a Width control that lifts the side signal in the high end only, widening cymbals, room mics, and acoustic guitars without touching the mono image underneath. Producer presets are included to help set a starting point.
specs: |-
  - Smooth crossover filter with three cutoff points: Bite, Presence, Air
  - Tape saturation circuit for harmonic enhancement
  - Two compression modes: Punch and Smooth, tuned for high frequencies
  - Stereo Width control for widening cymbals, room mics, and acoustic guitars
  - Producer presets included
  - Mac OS X 10.15 or higher
  - Windows 10 or higher
  - 64-bit only
  - 200 MB free drive space
