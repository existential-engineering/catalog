details: |-
  Bome MIDI Translator Classic is the smaller sister of MIDI Translator Pro. It has the same powerful MIDI processing engine, but can only convert MIDI messages to other MIDI messages, or to keystrokes. Also, the rules and conditional MIDI translation are not available with the Classic Edition.

  The Classic Edition is only available for Windows and it will not evolve anymore. It is free for personal use, except that it displays a nag screen at start-up.

  Bome MIDI Translator Classic provides an easy to use interface for defining your translator definitions. It covers MIDI-to-MIDI conversion and MIDI-to-keystroke mapping, lets you organize mappings in presets, create your own presets, and exchange presets with other MIDI Translator users.

  Compared with the Pro edition, Classic handles incoming MIDI messages and outgoing MIDI messages, keystroke emulation, preset switching and preset enabling, with unlimited translators per preset and unlimited presets per project. Keystroke-to-MIDI, mouse emulation, timers, serial port actions, virtual MIDI ports, the MIDI Router and scripting, rules and conditional execution are Pro features.

  If you are a commercial user, or if you want to remove the nag screen at start-up, you are asked to purchase a license. The commercial license is EUR 29 including VAT, and the current download is version 1.6.1 for Windows.
