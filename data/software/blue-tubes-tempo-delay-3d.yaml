description: Original vintage style 3d delays. The bt tempo delays dl3d is a
  tempo-driven delay effect with a classic analog sound.
details: |-
  The bt tempo delays dl3d is a tempo-driven delay effect with a classic analog
  sound. No more trial-and-error in setting tempo-based delay times. Simply sync
  the tempo of the song, and select the note value corresponding to the desired
  delay time.

  This delay provides three separate channels. Using the pan controls, you can
  pan all three delay channels to the center, or spread the channels out across
  the stereo field (left, center, right). Gain controls set the levels for each
  channel individually.

  Blue tubes tempo delay 3d by nomad factory is a virtual effect audio plugin
  for macos and windows. It functions as a VST plugin, an audio units plugin and
  an AAX plugin.

  System requirements: pentium iv 2ghz / athlon xp 2ghz with 1gb of ram. Windows
  7 - xp - vista are supported (32-bit and 64-bit). Macintosh intel core solo
  1.5ghz with 1gb of ram. Mac os x 10.5 leopard and mac os x 10.6 snow leopard.
  Compatible intel macs, ppc are not supported.
specs: |-
  - Tempo-driven delay effect
  - Three separate delay channels
  - Pan controls
  - Gain controls
  - Classic analog sound
  - Tempo sync
  - Note value selection
