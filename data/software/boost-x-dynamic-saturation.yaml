url: https://initialaudio.com/product/boost-x-dynamic-saturation/
description: Boost x is a dynamic and smart saturation/overdrive plugin. Used to
  make any sound warmer by adding extra harmonics.
details: |-
  Many other saturation/overdrive plugins use a static (stateless) algorithm
  that doesn't change depending on the audio passed through. These effects rely
  on a gain boost, when the audio hits a certain threshold then saturation is
  applied. They are either on or off and the amount of saturation is heavily
  dependent on the loudness of the audio passed into them.

  Boost x is different, it reacts to the input audio and applies the perfect
  amount of saturation at the current loudness. This means even quiet sounds can
  be overdriven without any gain in loudness. Boost-x also compensates for
  perceived loudness, bringing the loudness down even further so you get nice
  rich harmonics added to your sound, without destroying the balance of your
  mix.

  Gives your sounds a rich depth and warmth that sits well in your mix, bringing
  your vocals and instruments to life with a true analog warmth and feel.
specs: |-
  - Dynamic saturation
  - Stateful saturation which dynamically responds to the input signal
  - 16 times oversampling
  - 7 saturation types
  - Large amount knob for fine control
  - High definition resizable gui
