details: |-
  Analog creator is a powerful emulation of the sound character of many real
  analog hardware units. It allows you to sum your mixing and mastering tracks
  with analog creator models, shaping your sound like real analog hardware.

  The collection includes five models: 34n128 (rare analog vintage 34128 series
  emulation for adding character, clarity, and color), 5a12c (discrete 500
  series model adding characteristic punch and warmth), 1m73 (73 model tone
  shaper with real transformer emulation on m 500 series providing full-bodied
  sound with formidable lows, assertive midrange presence and sweet, airy
  highs), 1v73 (73 model tone shaper with real transformer emulation on v 500
  series, smooth and sweet like the original 1073), and 1x73 (included free).

  The wd analog creator 34n128 is a vintage classic model based on real analog
  hardware console, providing a vintage touch particularly effective on vocals.

  The graphical interface is basic but functional with input output meter
  display.

  The plugin supports future model additions beyond the currently included
  collection.
specs: |-
  - Universal 2 binary
  - Analog summing
  - Tone shaping
  - Harmonic shaper
  - Master buss effect
  - 34n128 model
  - 5a12c model
  - 1v73 model
  - 1m73 model
