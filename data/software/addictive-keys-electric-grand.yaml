description: Its recognizable sound can be heard on countless records from
  classic artists like u2, peter gabriel and abba, as well as contemporary acts
details: >-
  This member of the addictive keys family combines three distinct characters in
  one instrument: the acoustic sound of hammers hitting strings, the direct line
  signal from the built in pickups, and finally a crunchy amped sound to add
  some grit to the mix.


  This makes the electric grand very versatile and suitable for just about
  anything from indie rock and pop to house to r'n'b ballads.


  The included exploremaps and presets cover everything from clean studio setups
  to swirling synthetic textures.


  This instrument was cutting edge 30 years ago and we've made sure it's cutting
  edge today.


  The full addictive keys engine is included.
