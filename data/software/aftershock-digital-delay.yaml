details: |-
  Aftershock digital delay is the first plug-in in the "kevin briggs signature series". Aftershock can hold a delay for up to 6 seconds and features 3 independent delays: one left, one right and one center.

  Each of these delays has separate controls for feedback level, volume level and delay type. You can select from tap delay, host tempo delay and standard delay.

  Additionally, dry/wet mix knobs are included, giving you a transparent, flexible, and powerful delay effect.

  Delay times controllable via tapping, tempo, and standard knob methods. Delay can be synced to your DAW for easy integration with your other effects.

  Transparent and honest character allow for use on any sound source.
specs: |-
  - Three independent delays (left, right, center)
  - Delay times up to 6 seconds
  - Tap delay
  - Host tempo delay
  - Standard delay
  - Feedback level control
  - Volume level control
  - Dry/wet mix knobs
  - VST plugin
  - Windows compatible
