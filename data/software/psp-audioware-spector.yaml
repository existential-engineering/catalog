details: |-
  PSP Spector is a precise and free 31-band spectrum analyser plug-in that offers Peak and RMS measurements, along with a range of visual customization options. Access requires a free PSP User Area account, no purchase necessary.

  The analyser covers 31 bands with a selectable dB range and an adjustable 0 dB reference level, and channel selection determines which channel or channels are displayed. Peak hold time is configurable, peaks can be drawn as mark lines or as a smooth curve, and RMS can be shown as bars or as a curve. A built-in high-pass filter handles low-frequency content, the interface size is adjustable, and 15 tutorial factory presets are included.

  PSP Spector was originally introduced as PSP Spector PSPEC-31 within the PSP ConsoleQ and PSP preQursor3 plug-ins, and is also released as an independent plug-in.
specs: |-
  - 31-band spectrum analysis for detailed frequency monitoring
  - Selectable dB range for flexible metering precision
  - Adjustable 0 dB reference level
  - Channel selection - choose which channel(s) to display
  - Customizable peak hold time
  - Peak display options - mark lines or smooth curve view
  - RMS display options - bars or curve view
  - Built-in High-Pass Filter for low-frequency control
  - 15 tutorial factory presets for quick learning and setup
  - Adjustable interface size
  - Windows 7 - Windows 11, 64-bit VST, VST3 and AAX (Pro Tools) hosts
  - macOS 10.14 Mojave or later (Intel and Apple Silicon), 64-bit AudioUnit, VST, VST3 and AAX (Pro Tools) hosts
releaseDate: 2025-11-07
