description: PSP Spector is a precise and free 31-band spectrum analyser plug-in that offers Peak and RMS measurements, along with a range of visual customization options. Originally part of PSP ConsoleQ and PSP preQursor3, it is now available as an independent free plug-in.
details: |-
  PSP Spector is a 31-band spectrum analyser plug-in originally introduced within PSP ConsoleQ and PSP preQursor3, now available as a standalone free plug-in. Access requires a free PSP Audioware account.

  Provides detailed frequency monitoring with selectable dB range and adjustable 0 dB reference level. Users can choose which channel(s) to display, customize peak hold time, and select between line or smooth curve peak display modes. RMS can be displayed as bars or a curve.

  Includes a built-in High-Pass Filter for low-frequency control, 15 tutorial factory presets, and an adjustable interface size.
specs: |-
  - 31-band spectrum analysis
  - Selectable dB range, adjustable 0 dB reference level
  - Peak display: mark lines or smooth curve
  - RMS display: bars or curve
  - Built-in High-Pass Filter
  - 15 tutorial factory presets
  - Adjustable interface size
  - Formats: AU (macOS), VST, VST3, AAX
  - Platforms: Windows 7–11 (64-bit), macOS Intel/Silicon 10.14–16
releaseDate: 2025-11-07
