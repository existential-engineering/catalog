description: TAL-Pha is an instrument plug-in that emulates the sound of the analog 80's synthesizer Alpha Juno II (MKS-50 is the rack version). The plug-in produces the classic analog sound, combined with modern flexibility and many additional features including resonance boost, DCO pulse modulation, FX section with delay/reverb/bell-eq, arpeggiator, stereo unison mode, aftertouch and MPE support, and microtuning.
