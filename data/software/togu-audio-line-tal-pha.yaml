description: TAL-Pha is an instrument plug-in that emulates the sound of the analog 80's synthesizer Alpha Juno II (MKS-50 is the rack version). The plug-in produces the classic analog sound, combined with modern flexibility and many additional features.
details: |-
  TAL-Pha is an instrument plug-in that emulates the sound of the analog 80's synthesizer Alpha Juno II (MKS-50 is the rack version). The plug-in produces the classic analog sound, combined with modern flexibility and many additional features. The plug-in can read and convert sysex information from the hardware and can also be used as a controller.

  Beyond the authentic emulation of the 80's hardware synthesizer, the plug-in adds a resonance boost for filter self-oscillation, the possibility to detune, modulate and sync the pulse part of the DCO, and individual tuning for every voice, which converts the synth's DCO into a VCO. A stereo UNISON mode runs up to seven voices and an arpeggiator offers different modes.

  A simple but powerful FX section provides delay, reverb and a bell-eq. The plug-in supports aftertouch and MPE, along with microtuning through tun file import and an MTS Client.

  The original factory banks are included alongside more than 380 fresh presets by Electric Himalaya, The Unfinished, Saif Sameer, emptyvessel and TAL. The plug-in reads Sysex files and Sysex MIDI from the hardware device, and can also control a hardware device by sending Sysex through the plug-in MIDI output when the DAW supports it.

  System requirements: Windows 7 or higher (64 bit host); macOS 10.9 or higher (64 bit host) as a Universal Binary 2 with native Intel and Apple silicon support (M1, M2, M3...); AAX requires Pro Tools 10.3.6 or higher (64 bit); Linux 64 bit, Ubuntu 18 or similar. The demo version produces a rising white noise sound every minute.
specs: |-
  - Authentic emulation of the 80's hardware synthesizer
  - Resonance boost for filter self-oscillation
  - The possibility to detune, modulate, and sync the pulse part of the DCO
  - Simple but powerful FX section with delay, reverb, and a bell-eq
  - Arpeggiator with different modes
  - Stereo UNISON mode with up to seven voices
  - Aftertouch and MPE support
  - Microtuning support (tun file import and MTS Client)
  - Original factory banks included
  - More than 380 fresh presets by Electric Himalaya, The Unfinished, Saif Sameer, emptyvessel and TAL
  - Individual tuning for every voice converts the synths DCO into a VCO
  - Reads Sysex files and Sysex MIDI from the hardware device
  - Can also control a hardware device, sending Sysex through the plug-in MIDI output when supported by the DAW
  - Windows: Windows 7 or higher (64 bit host)
  - macOS: 10.9 or higher (64 bit host), Universal Binary 2 with native Intel and Apple silicon support
  - AAX: Pro Tools 10.3.6 or higher (64 bit)
  - Linux: 64 bit, Ubuntu 18 or similar
