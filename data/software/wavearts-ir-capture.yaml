description: An application used to measure impulse responses. IR Capture can capture room reverberation, digital effects, speaker cabinets, and other audio systems for use with ConvologyXT. Supports sinusoid sweeps and maximum-length sequence (MLS) measurements, up to 16 channels out x 16 channels in.
details: |-
  Accurate impulse response measurement. Supports sinusoid sweeps and maximum-length sequence (MLS) measurements. Measures up to 16 channels out x 16 channels in. Auto normalization and auto crop options. ASIO device support on Windows. Supports any sampling rate provided by audio interface. Output formats: 32-bit float WAV, 24-bit WAV, 16-bit WAV, ASCII text files.
