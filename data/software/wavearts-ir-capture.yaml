description: IRCapture is an application used to measure impulse responses. It can measure the room reverberation of acoustical spaces, or measure digital effects units, speaker cabinets, and spring or plate reverbs.
details: |-
  Free application to measure impulse responses. IRCapture is an application used to measure impulse responses. It can measure the room reverberation of acoustical spaces, or measure digital effects units, speaker cabinets, and spring or plate reverbs. The impulse responses from IRCapture can be loaded into the Convology XT plug-in to reproduce the measured system. There is no purchase or registration required.

  On MacOS, IRCapture is distributed as a package installer in a DMG file. Open the DMG and then double-click on the PKG file to run the installer. On Windows, IRCapture is distributed as a zip archive containing the application and a PDF manual.

  After installing, run the application and select Audio Settings to choose the playback and recording devices. After selecting the audio devices, click Start to begin the measurement. The app will play a sinusoid sweep, and will then write the measured impulse response to the file 'impulse.wav'. At this point one generally repeats the measurement a few times while tweaking the output and input levels to get a good record level. When the levels are correct you can examine the impulse response in a sound editor, or load it directly into Convology XT.
specs: |-
  - Accurate impulse response measurement application
  - Supports sinusoid sweeps and maximum-length sequence (MLS) measurements
  - MacOS (Apple Silicon or Intel) or Windows
  - Measure up to 16 channels out x 16 channels in
  - 32-bit float WAV, 24-bit WAV, 16-bit WAV or ASCII text output files
  - Auto normalization option
  - Auto crop option
  - Supports ASIO devices on Windows
  - Supports any sampling rate provided by audio interface
  - An external USB audio device is recommended for both playback and recording
  - MacOS 10.11 and up, 64-bit only
  - Universal binary supports Apple Silicon and Intel x86
  - Windows 7/8/10/11
  - IRCapture is a 32-bit Windows application
versions:
