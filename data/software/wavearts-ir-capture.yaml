description: "Free standalone application for measuring impulse responses of
  acoustical spaces, digital effects units, speaker cabinets, spring or plate
  reverbs. Results can be loaded into Convology XT."
details: |-
  Accurate impulse response measurement application. Supports sinusoid sweeps and maximum-length sequence (MLS) measurements. Measure up to 16 channels out x 16 channels in. 32-bit float WAV, 24-bit WAV, 16-bit WAV or ASCII text output files. Auto normalization option. Auto crop option. Supports ASIO devices on Windows. Supports any sampling rate provided by audio interface.
specs: |-
  Mac: macOS 10.13+, Apple Silicon or Intel. Windows: Windows 7/8/10/11 (32-bit application). Recommended to use an external USB audio device. No purchase or registration required.
