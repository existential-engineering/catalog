description: Modular is a modular synthesizer plugin, and the only Eurorack
  software to offer licensed modules. A modular synth plugin that allows quick
  and easy building and breakdown of patches, as well as instant recall with
  presets.
details: |-
  Created in close collaboration with Doepfer, the creators and original stewards of the Eurorack modular synth standard, Softube Modular gives you the sound, the freedom, and the expandability of a hardware modular synthesizer, without the constraints. Seven essential component-modeled Doepfer modules are included, plus 50 stock modules, from utilities like mixers and multipliers to sequencers and performance panels. And premium modules from other renowned hardware brands are available to expand your collection.

  Modular features officially licensed, branded modules from top hardware innovators: Doepfer in the base set, and Buchla, Intellijel, 4ms, Doepfer, and Mutable Instruments as premium add-ons. Unlike in a hardware system, any particular module can be duplicated endlessly in your system. Try four LFOs. Or fourteen.

  Experienced Eurorack synth users will be right at home from the start. Modular works just like hardware Eurorack systems do, right down to the voltage standards (indeed you can even patch out of your computer using an interface with DC-coupled outputs and interact with hardware systems). Add modules, connect them using virtual patch cords, adjust knobs and switches, it's as close as anything gets to the real thing.

  But beginners are equally welcome. There are 156 expertly designed presets included and available to be immediately put to use in your music. As you go, you can expand your arsenal of modules and gain access to 500+ presets. When you are ready to learn more about patching a Eurorack synth, dig into the step by step patching tutorials included in the manual.

  Many Softube effects, including Saturation Knob, Tube Delay, the TSAR-1 and TSAR-1R reverbs, and Spring Reverb can be used as modules in Modular, as can Softube's drum machine, Heartbeat. Modular FX enables you to bring in external audio and process it in the Modular environment, so you can build your own complex effects: distortion circuits, compressors, modulation effects like choruses, flangers, and doublers, and more.
specs: |-
  - Modular is a modular synthesizer plug-in, developed in partnership with Doepfer
  - Works as both an instrument and an effects processor
  - Comes with component-modeled versions of seven analog hardware modules from Doepfer
  - 50+ stock modules also included, to cover essential functions
  - ROLI Seaboard RISE module included, to interface with the ROLI Seaboard RISE keyboard controller
  - Premium add-on modules available, and more released regularly
  - Performance modules help organize key elements of patches for playability
  - Many Softube effects (sold separately) can be loaded as modules in Modular
  - Heartbeat drum machine available as a set of Modular modules too
  - Quality presets covering a huge range of styles and sounds
  - High internal sample rate within system enables true feedback
  - 156 presets included, expandable to 500+ presets with add-on modules
  - Softube's Saturation Knob plug-in includes a free module to use in Modular
  - Component-level modeling of module circuitry, connection port impedances and the underlying rack
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Three activations included
