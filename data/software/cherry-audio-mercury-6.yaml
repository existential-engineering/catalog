description: Mercury-6 is a meticulous recreation of the JP-6 analog polyphonic
  synthesizer, initially released in 1983. Sandwiched between the earlier JP-4
  and JP-8 models in name only, the sophisticated JP-6 has sometimes been
  considered a sleeper release.
details: |-
  Released in 1983 as a more affordable alternative to the flagship eight-voice JP-8, the six-voice JP-6 nevertheless staked out an essential position in the history of analog polysynths. Though similar in appearance and feature set, the JP-6 stood apart from the JP-8 in its sound and capabilities. Unlike earlier polysynths with lowpass filters plus a rudimentary non-resonant highpass filter, the JP-6 featured a true multimode filter with 24 dB/oct lowpass, 24 dB/oct highpass, or 12 dB/oct bandpass modes. This versatile filter design lent a more aggressive sound, making the JP-6 a natural for cutting-edge techno and electro styles.

  Though something of a "hidden feature," the JP-6 VCOs supported multiple simultaneous waveforms, and its two LFOs and oscillator cross mod capabilities provided extensive modulation possibilities. Its earthshaking solo and poly unison modes enabled massive lead and bass sounds, and it was notably one of the first synthesizers to include the then-new MIDI protocol.

  Although often praised for its harmonic complexity and ability to cut through a mix, the cost-cutting in the JP-6 design resulted in some disadvantages. Output was mono only and it was limited to six-voice polyphony. The JP-6 had an impressive (for the time) split keyboard and patch preset storage functionality, but this six-voice maximum hampered its potential. And though it was considerably less expensive than the JP-8, its timing was ill-fated when the digital revolution was ignited by the release of Yamaha's revolutionary DX-7 FM digital synth the same year.

  Mercury-6 captures all that is exceptional in this classic and boosts the extraordinary feature set and functionality for today's DAW production and workflow. It adds velocity sensitivity, an improved split mode, and a layer mode capable of stacking two different sounds simultaneously with per-layer stereo panning, detuning, and sustain. A panel control lets users easily select and navigate between these layers and includes a utility function for exchanging settings between the lower and upper layers, or even between presets. With polyphony extended to 16 notes, Mercury-6 will not easily run out of voices.

  The arpeggiator is reproduced, including the hidden Down/Up mode of the original, and augmented with a Random mode and MIDI tempo sync. A chord memory mode enables multiple notes to be stored and played back with a single key. The LFOs gain a retrigger for LFO-1 and an always-on option for LFO-2, both syncable to MIDI tempo. An integrated studio-quality effects panel provides distortion, phaser, flanger/chorus, delay, and reverb, and with per-layer drift control, over 500 presets, and flexible MIDI mapping, Mercury-6 will satisfy both vintage synth aficionados and today's music producer.
specs: |-
  - Highly optimized, massive dual-layer voicing architecture with 16 polyphonic voices per layer. Keyboard split or stacked layer modes allow two simultaneously playable layers, with separate per-layer controls for all parameters, including effects
  - Two VCOs per voice with combined waveform capabilities: triangle, ramp sawtooth, noise, and square or variable pulse
  - Multimode filter with a 24 dB/oct lowpass, 24 dB/oct highpass, or 12 dB/oct bandpass modes
  - Accurate reproduction of the original's advanced VCO-2 to VCO-1 FM cross-modulation for searing tones
  - Precisely implemented portamento and glissando modes
  - Exactingly replicated arpeggio section with MIDI tempo sync, the hidden Down/Up mode of the original, and the addition of a Random mode
  - Powerful solo and polyphonic unison modes for fat, stacked sounds
  - Two tempo-syncable LFOs with extended retrigger functionality
  - Per-layer drift control for oscillators and filter frequencies for authentic analog character
  - Single-key chord memory mode
  - Over 500 presets, created by a talented team of sound design veterans, easily accessible in a convenient preset browser
  - Panel Control for selecting layer controls, including extensive utility functions for duplicating and exchanging synthesis and effects parameters between layers and presets
  - Studio-quality integrated effects: distortion, 4/8/12 stage phaser, flanger/chorus, three types of delay with sync, and four types of reverb, with easy-to-access global or layer settings
  - Complete MIDI control and DAW automation for all controls, with easy-to-use MIDI learn and mapping (Preset and Global)
  - Focus zoom-in feature, as well as standard UI zoom and resize via drag
  - Complete documentation available directly online from the instrument or in downloadable PDF format
  - Highly optimized coding for optimal performance with ultra-low CPU load, and multithreaded processing for presets using Split and Layer modes
  - User-adjustable oversampling control
  - macOS 10.13 or above, macOS 13 Ventura supported, 64-bit required, native Apple M1 or greater processor support including Ultra, 3.4 GHz Quad-Core or M1 CPU with 8GB of RAM recommended
  - Windows 7 or above (including Windows 11), 64-bit required, Quad-core computer with 8GB of RAM recommended
  - Internet connection required for product activation
