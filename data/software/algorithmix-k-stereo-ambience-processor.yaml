description: High-resolution VST processor for natural and unobtrusive
  enhancement, expansion, and equalization of the ambience, space, imaging,
  depth and width in a recording without adding artificial reverberation.
details: |-
  K-Stereo is a patented psychoacoustical process (US Pat.7076071) that extracts
  the ambience inherent in ordinary recordings, and is capable of spreading that
  uncorrelated ambience around the soundstage, and enlarging the size of that
  soundstage, both deeper and wider.

  K-Stereo enhances the depth and imaging of the instruments and vocals without
  adding any artificial reverberation. It does not have a sound of its own; it
  just enhances the existing ambience and early reflections. K-Stereo is also
  capable of making a natural mono to stereo conversion.

  The plug-in is the first in the new Algorithmix CHROMIUM SERIES, a set of
  reference mastering plug-ins. For the first time, the mastering engineer can
  easily enhance, expand, and equalize the ambience in a recording unobtrusively
  and naturally.

  K-Stereo helps to glue a recording together without need for dynamic
  compression. Recordings made with multiple stereo microphone techniques sound
  more realistic and cohesive. It can restore or enhance the front-to-back depth
  in stereo recordings that otherwise sound flat and one-dimensional.

  K-Stereo also performs natural mono-to-stereo conversion by bringing out the
  ambience in the original mono source and spreading it to the sides in a
  stereophonic fashion with an extremely mono-compatible result.
specs: |-
  - Patented psychoacoustical ambience recovery process (US Pat.7076071)
  - Natural ambience enhancement without artificial reverb
  - Stereo depth and width expansion
  - Mono-to-stereo conversion
  - Ambience equalization controls
  - VST 3.0 compatible
  - Part of Algorithmix CHROMIUM SERIES
