description: "A modern vocal chain plugin: EQ, compressor, reverb, echo and stereo width in one channel strip for fast, clean vocal mixing."
details: |-
  The opening release of the Black Rooster Audio Professional Series: everything fourteen years of modelling classic studio hardware taught the developer, rebuilt as one precise modern vocal chain.

  The PS-VC1 is a complete vocal chain: six processing modules (Low End, High End, Compress, Reverb, Echo and Width) sharing one panel and one signal path. It comes out of the same workbench as the developer's vintage collection: since 2012 Black Rooster Audio has modelled classic studio hardware component by component, and that work distilled into a precise modern design rather than an emulation of one particular unit, aimed at speed and clarity instead of period character.

  The chain runs in a fixed, mix-ready order: clean the low end, control the dynamics, shape the top, then place the vocal in a space. Every module carries a preset selector, a fader and its own bypass, with plus/minus 15dB range on Low End, High End and Compress, and a 0 to 100 mix on Reverb, Echo and Width. Low End offers Sub, Floor, Boom and Mid presets across 20Hz to 640Hz; High End offers Sharp, Silk, Edge and Air presets from 1.2kHz up to 20kHz.

  Compress offers Slight, Punch, Smack and Limit presets with selectable peak or vintage detection and auto makeup gain, so bypassing the module compares character rather than loudness. Reverb runs Tight, Chamber, Large and Church; Echo runs tempo-synced or free with Fast, Eight, Quarter and Space settings; Width uses All-Pass, Haas and Hilbert algorithms across Tight, Close, Far and Outer presets.

  On lead vocals it handles proximity buildup, dynamics, top-end and depth in one pass; on backing stacks a wider Width setting plus per-module bypass helps a double sit behind the lead; for spoken word and voiceover, Slight and a touch of Silk give a clean, even read. For period character instead of transparency, the manufacturer points to its VWB-1X plugin, built from the same modelling work.
