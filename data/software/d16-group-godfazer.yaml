description: Advanced Modulation Unit
details: |-
  Godfazer is D16's most versatile and powerful modulation effect yet. Use it as a tremolo, chorus, rotary speaker, filter or phaser, or mix multiple processing styles for spectacular, complex results. Its built-in Ensemble and filter types provide a vast sonic palette, comprising many classic vintage chorus, rotary speaker and phaser models, plus dozens of additional custom modes.

  Both Multi Filters and the Ensemble module can be configured in any of six preset topologies, offering all the signal routing combinations a sound designer could need. Both Modulators are routed independently to each Multi Filter, for truly complex signal blending, bringing movement and dynamism to the Multi Filters via one of several LFO shapes.

  Each Multi Filter offers 40 filter types/models with adjustable cutoff/center frequency and emphasis, a balance control with optional Mid/Side mode, and independent modulation amount control with invert options.
specs: |-
  - 22 effect types spanning choruses, rotary speaker emulations, tremolo and auto-panning
  - Two Multi Filters, each with 40 filter types/models
  - Six preset topologies for filter/ensemble signal routing
  - Dual independent Modulators with 6 LFO waveforms and tempo sync
  - Balance control with optional Mid/Side mode
  - Independent Value offset for Left/Right channels with Link option
