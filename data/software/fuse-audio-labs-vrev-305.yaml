description: A faithful emulation of the MicMix Master Room XL-305, a rare 1970s 12-spring chamber reverb renowned for producing lush, dense tails with more of a plate-like ambience than typical single-spring designs. The virtual tank features 12 individual springs with logarithmically-spaced timings following the musical scale, producing a harmonic series of reflection patterns rather than the characteristic twang of simple spring reverbs.
details: |-
  Emulates the MicMix Master Room XL-305 (rare 1970s 12-spring reverb). 12 individual springs with logarithmically-spaced timings (following the musical scale) produce dense, plate-like tails instead of spring twang. Hardware's fixed decay time limitation removed in the plugin. Separate PreDelay parameters per channel. Switchable stereo summing before and after the spring system. Interactive EQ section for tone shaping. Mix control. Regular price $59 (launched at $29 intro through October 23, 2022).
specs: |-
  Controls: Decay, PreDelay (per channel, L and R), Stereo summing switch (pre/post spring), EQ (interactive tone shaping section), Mix. macOS 10.9+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+, 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX. Copy protection: serial number.
