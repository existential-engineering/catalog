details: |-
  The PCM Native Random Delay is a digital delay plug-in that combines precision with randomization capabilities. It features diffusion controls with LFO and a Wander parameter that allows up to one second of additional delay time per voice, with voices that can be randomized or fixed.

  The plug-in includes studio-quality presets, parameter automation support, an intuitive user interface, real-time spectral display with input/output metering, and portable presets.

  PCM Native Random Delay is available as part of the PCM Native Effects Bundle and requires iLok2 authorization. This product has been discontinued by Lexicon.
specs: |-
  - Studio-quality presets
  - Parameter automation support
  - Intuitive user interface
  - Real-time spectral display with input/output metering
  - Portable presets
  - Diffusion controls with LFO
  - Wander parameter — up to one second of additional delay time per voice
  - Voices can be randomized or fixed
  - iLok2 authorization required
