  2s equalizer is a parametric eq featuring a straightforward user interface. We believe everyone can use it without learning. And it is free.

  2s equalizer by 2nd sense audio is a virtual effect audio plugin for macos and windows. It functions as a VST plugin, an audio units plugin and an AAX plugin.

  The high and low pass filters are noted for their surgical cutting capabilities, providing clean and precise frequency removal.
