details: |-
  Blue Cat's FreqAnalyst CM Edition is a spectrum analysis plug-in, exclusively
  available for free on the cover-dvd with computer music magazine (cm 130),
  which also includes a tutorial to get started with the plug-in.

  Blue cat's freqanalyst cm is a frequency analyser for windows in VST and dx
  formats.

  It offers average, instant and peak modes, curve comparison functionality, and
  lots more.

  If you're serious about perfecting your tracks, freqanalyst cm will give you
  invaluable insight into what's really going on in your mixes.
