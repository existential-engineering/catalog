details: |-
  Tremolator is a tremolo effect plugin with auto-gate functionality that delivers analog guitar tremolo effects and beyond with beat-synced rhythmic chopping. The plugin emulates classic hardware tremolo effects from units like the Fender Vibrolux and Wurlitzer.

  The plugin features MIDI sync for tempo-locked tremolo and dynamic controls for speed and depth modulation. A programmable Rhythm Editor enables custom pattern creation, while auto-gate functionality provides rhythmic control.

  Tremolator includes analog mode emulation for authentic vintage character, along with swing/shuffle and accent controls for musical flexibility. The LFO waveshape editor recreates vintage hardware waveforms.
specs: |-
  - Emulates classic hardware (Fender Vibrolux, Wurlitzer)
  - MIDI sync for tempo-locked tremolo
  - Dynamic controls for speed and depth modulation
  - Programmable Rhythm Editor for custom patterns
  - Auto-gate functionality with rhythmic control
  - LFO waveshape editor
  - Analog mode emulation
  - Swing/shuffle and accent controls
  - 64-bit only, sample rates 44.1 kHz to 192 kHz
  - Apple Silicon compatible
