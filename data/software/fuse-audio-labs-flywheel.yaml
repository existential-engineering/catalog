description: Reel-to-reel tape emulation that distills the best characteristics of multiple vintage tape machines into a single streamlined plugin. Covers saturation, hysteresis, high-frequency loss, head bump, wow and flutter, crosstalk, and tape hiss. Two selectable tape formulas offer a linear (Formula I) or more colored (Formula II) character. Tape speed switches between 15 IPS and 30 IPS, affecting both high-frequency response and low-end character.
details: |-
  Not a clone of a single machine — deliberately blends characteristics of multiple reel-to-reel units. Two tape formulas: Formula I (linear, cleaner character), Formula II (more colored, richer harmonics). Tape speed: 15 IPS (warmer, more bass, softer highs) vs 30 IPS (extended highs, tighter bass). Controls: Record Gain (input/saturation amount), Playback Gain (output level), Hysteresis (magnetic crossover distortion), HF EQ (compensates for head playback loss), Speed Variance (wow and flutter pitch modulation), Hiss (tape noise), Crosstalk (−60 dB stereo channel bleed). VU meter with 5 selectable calibration models. Animated reels with realistic transport stop/start sounds. Optional oversampling. Version 2.7.
specs: |-
  Formats: VST2, VST3, AU, AAX. macOS 10.12+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+, 2 GHz Intel CPU+, 2 GB RAM, 1280x1024 display. Copy protection: serial number. 14-day trial available.
