details: >-
  Adverb2 is a full update of the classic adverb (originally named "reverence")
  vintage digital plate reverb. We took the dsp code from the original, greatly
  expanded the maximum decay time, and created versions for all popular plugin
  platforms.


  Simple-to-use reverb settings, with pre-delay, time, and size, plus an
  extensive filtering section to shape the reverb tail.


  Logical vintage-style user interface, vector-based for resizability and
  future-proofing.


  Xml-based cross-platform preset manager, with copy and paste. (you can even
  move presets between the ios version and the desktop version with handoff.)


  Optimized reverb algorithm for low cpu load.
