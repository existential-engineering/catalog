details: |-
  FET Compressor / Stereo Peak Limiter

  Runs natively in your DAW on macOS or Windows, or in real-time on your Synergy Core interface

  Punchy, classic-style compression heard on countless pop and rock records

  Suitable for drums, guitars, vocals, backing vocals, overheads, and synth layers

  Stereo mode for treating stereo tracks and taming overly dynamic bass lines

  Included in Antelope Cosmos subscription
