description: TAL-Dub is a vintage style delay effect. It can be used for a wide range of delay effects from clean to extreme distorted, resonating never ending delays.
details: |-
  TAL-Dub is a vintage style delay effect from Togu Audio Line, usable for a wide range of delay effects from clean through to extreme distorted, resonating never ending delays.

  It is the first plugin in TAL's Dub delay line, followed by TAL-Dub-2 and TAL-Dub-3, all three of which share this single product page.

  Downloads are offered as a Windows 32-bit VST, a Windows 64-bit VST, an OSX 32-bit VST and an OSX 32-bit Audio Unit. No installer, Linux build, VST3, AAX or CLAP version is offered.

  TAL lists this page under the 'Deprecated Plug-Ins (not supported)' heading on its products page, so the plugin is no longer supported by the manufacturer. The stated OSX requirement (32-bit host, macOS below 10.10) means it cannot run on current macOS versions.

  The page shows no price and no purchase path for TAL-Dub, only direct download archives.
specs: |-
  - Vintage style delay effect
  - Range from clean delays to extreme distorted, resonating never ending delays
  - Plug-in formats: VST (Windows 32-bit and 64-bit), VST (OSX 32-bit), Audio Unit (OSX 32-bit)
  - Windows: Windows XP or higher (32 / 64 bit)
  - OSX: 10.6 and < 10.10 (32 bit Host)
