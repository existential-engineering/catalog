  and capture impulse responses of objects around you.
details: |-
  Outsidify is an iOS application for exploring sonic worlds using your smartphone's microphone and speaker as instruments. The app enables feedback creation, resonance manipulation, and impulse response capture of real-world objects.

  The player module offers loop, variable speed (1/4x to 4x), and crop functions. The recorder features a microphone/player crossfader for live blending. A feedback pad with amount and tone controls allows microphone delay routing for custom feedback loops.

  Timer macros enable automated recording triggers and impulse response capture. WAV file export is supported for use in other applications.
