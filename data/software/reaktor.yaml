description: Reaktor 6 is a modular DSP lab by Native Instruments for deep sound
  exploration, featuring rack-style modular patching, anti-aliased oscillators,
  zero-delay feedback filters, and granular synthesis engines.
details: |-
  Reaktor 6 is a modular DSP lab that lets users build custom synthesizers, samplers, effects, and sound design tools. It features rack-style modular patching via the Blocks interface, anti-aliased oscillators, zero-delay feedback (ZDF) filters, and granular synthesis engines.

  It ships with 70+ included instruments plus access to thousands of sounds in the Native Instruments User Library. Connectivity includes MIDI, OSC, CV/Gate, and Ableton Link, with deep integration with KOMPLETE KONTROL keyboards and MASCHINE hardware.
specs: |-
  - 70+ included instruments
  - Blocks modular patching interface
  - Anti-aliased oscillators
  - Zero-delay feedback filters
  - Granular synthesis engines
  - MIDI, OSC, CV/Gate connectivity
  - Ableton Link support
  - AU plugin (macOS)
  - Native Apple Silicon support
  - macOS 13 or newer
  - Windows 10 or newer
  - 64-bit only
  - 4 GB RAM minimum (6 GB recommended)
