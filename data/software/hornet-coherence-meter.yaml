description: HoRNet Coherence Meter checks if you have a balanced mix, ready for mastering and gives you helpful insights about what it's off.
details: |-
  HoRNet Plugins, in collaboration with The Buildzer, presents the Coherence Meter, a visual aid designed to help musicians and producers achieve more balanced and professional-sounding mixes. It is engineered to help you assess whether your mix is ready for mastering and provides feedback if there are issues that need to be addressed before proceeding with the final stage of production.

  The Coherence Meter works by comparing your mix to a curated reference level, providing a visual representation of how your mix deviates from the ideal during the mastering phase. The plugin normalizes the input level of your mix, filters and processes the audio, and then matches it against the reference level, compressing and limiting your mix to create a consistent comparison with a recorded reference.

  A range selector lets you adjust the meter's expectations to the demands of the project. Working on a highly compressed rock track with little dynamic range, setting the range selector to 6 expects up to 6dB of dynamic range; mixing a more dynamic style such as classical or orchestral music, setting the range to 21 anticipates a wider dynamic range to match the variations in volume typical of those genres.

  The meter identifies issues that could affect the quality of a track, such as excessive bass, insufficient bass, or heavy transients that overwhelm the overall balance. On bass-heavy mixes it can highlight too much low-end information that might make the mix sound muddled or distorted, and it can also help detect when there is not enough bass, which results in a thin mix.

  Real-time feedback lets you immediately see the results of changes made to the mix. Whether you are adjusting EQ, adding compression, or tweaking levels, the meter updates instantly, offering a visual representation of how those changes affect the balance of the track. The plugin has no copy protection.
specs: |-
  - Input meter and waveform display
  - Graphic indicator of “coherence” using the “Eye of Horus”
  - Indication of the difference with the ideal dynamics behavior
  - Realtime display of coherence with peak hold and percentage
  - Reset button to start again the measurement
  - Automatic internal normalization so that you don't have to care about input level
  - macOS (10.13 and later) and Windows support (XP and later)
  - 64-bit compatibility both on Mac and Windows
  - Audio Units, VST, VST3 and AAX format
  - Apple Silicon native support
  - No copy protection
