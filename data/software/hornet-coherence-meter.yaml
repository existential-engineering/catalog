description: HoRNet Coherence Meter checks if you have a balanced mix, ready for mastering and gives you helpful insights about what it's off.
details: |-
  HoRNet Plugins, in collaboration with The Buildzer, presents the Coherence Meter, a visual aid designed to help musicians and producers achieve more balanced and professional sounding mixes. It is engineered to help you assess whether your mix is ready for mastering and provides feedback if there are issues that need to be addressed before the final stage of production.

  The Coherence Meter works by comparing your mix to a carefully curated reference level, providing a clear visual representation of how your mix deviates from the ideal during the mastering phase. The plugin normalizes the input level of your mix, filters and processes the audio, and then matches it against the reference level, compressing and limiting the mix to create a consistent and accurate comparison with a recorded reference.

  A range selector lets you adjust the meter's expectations to the demands of the project. Setting the range to 6 expects up to 6 dB of dynamic range, which suits a heavily compressed rock track, while setting it to 21 anticipates the wider dynamic range of classical or orchestral material. This adaptability makes the meter useful regardless of the musical style being worked on.

  The plugin identifies issues that could affect the overall quality of a track, such as excessive bass, insufficient bass, or heavy transients that overwhelm the balance. It gives a clear visual readout of where the mix stands in relation to the ideal reference, including a coherence indicator drawn as an Eye of Horus, a realtime coherence percentage with peak hold, and a reset button to start the measurement again.

  Transient response analysis is a particular strength: if transients are too aggressive or unbalanced they can throw off the mix's cohesion, and the meter provides visual feedback that helps decide whether they need to be tamed through compression or limiting. Automatic internal normalization means the input level does not have to be managed by hand.
specs: |-
  - Input meter and waveform display
  - Graphic indicator of 'coherence' using the 'Eye of Horus'
  - Indication of the difference with the ideal dynamics behavior
  - Realtime display of coherence with peak hold and percentage
  - Reset button to start the measurement again
  - Automatic internal normalization so that you don't have to care about input level
  - macOS (10.13 and later) and Windows support (XP and later)
  - 64-bit compatibility both on Mac and Windows
  - Audio Units, VST, VST3 and AAX format
  - Apple Silicon native support
  - No copy protection
