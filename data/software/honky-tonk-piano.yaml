details: |-
  Adam monroe's honky-tonk piano is a 16-bit piano sample library VST/AU/AAX/kontakt plugin for windows and os x daws.

  For anyone looking for a worn (but in-tune) piano sound, it is suitable for playing ragtime, or any style of music that requires a dirtier, grittier tone.

  Includes 32/64-bit versions, reverb, delay, chorus, lo-fi, equalization, partial round-robin, and pedal/non pedal samples.

  VST version can be used with 32/64-bit daws, AAX version requires protools 10 full or later.

  Os x 10.9 or later.
