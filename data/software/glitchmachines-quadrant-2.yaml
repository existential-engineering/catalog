description: Quadrant 2 is a modular effects plugin that functions as both an
  audio processor and a self-generating sound source, built for experimental
  sound design and electronic music production. It provides 50 configurable
  modules — including oscillators, sequencers, effects, and utilities —
  connected via a graphical patching system with virtual patch cables.
details: |-
  Quadrant is a modular effects processor geared toward experimental sound design and electronic music production.

  Quadrant's streamlined patching system and diverse set of modules provide a customizable processing environment capable of a broad range of creative audio effects. Version 2 builds upon this, adding 4 additional module slots, 14 new modules and numerous new features and refinements. Quadrant 2 excels at generating vivid electronic tones, textures and patterns and processing your drum loops, soft synths and external hardware.

  We originally set out to create a signal processing plugin with an intuitive yet deep modular workflow that harnesses the fun factor of patching hardware modules, while giving you several advantages such as the ability to run multiple instances of the plugin/modules and DAW integration. We then took years of customer feedback and technical experience into account in order to make version 2 even more flexible, powerful and user friendly.

  Quadrant 2 offers a selection of modules you can freely configure by populating up to 12 slots. Once populated with a module, a slot will give you access to up to 4 input and output nodes, which you can freely connect via Quadrant's virtual patch cables. Nodes feature built-in attenuators and are configured to send and receive multiple signals at once, making complex modulation scenarios possible. Quadrant 2 ships with 50 modules ranging from oscillators and effects to sequencers and utilities.

  Quadrant's unique workflow and interface will change the way you think about modulation and signal processing. The plugin makes it possible to set up completely self generating patches, making it equally capable as a sound generator and effects processor. Our designers have crafted a variety of external and internally generated effects patches to show what the plugin is capable of. Factory patches are separated into three banks and additional banks can be added via the new preset bank system.
