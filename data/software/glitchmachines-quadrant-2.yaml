description: Quadrant 2 is a modular effects plugin that functions as both an audio processor and a self-generating sound source, built for experimental sound design and electronic music production. It provides 50 configurable modules — including oscillators, sequencers, effects, and utilities — connected via a graphical patching system with virtual patch cables.
details: |-
  50 Flexible Modules (oscillators, effects, sequencers, utilities)
  Up to 12 Configurable Slots with up to 4 Input/Output Nodes Each
  Graphical Patching System with Virtual Patch Cables
  Built-in Attenuators Supporting Multiple Simultaneous Signals
  Self-Generating Patch Capability
  100+ Factory Patches in Three Banks
  Scalable User Interface
  Functions as Signal Processor and Generator
