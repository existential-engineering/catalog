details: |-
  Amplifikation 360 Bundle will jump-start your amplifikation 360 rig into its full potential: with 16 (+1 upcoming) plugins to unlock every available modules inside amplifikation 360.

  Amplifikation 360 is a virtual "playground" for stacking pedals, amps, and cabs to create the perfect sound you want. Imagine a pedalboard with virtually unlimited possibilities.

  Amplifikation 360 is the answer for a fast patch design, thanks to its uniquely intuitive, single screen graphic interface.

  Amplifikation 360 is also among the very few guitar amp sims which are really enjoyable to bring on a live performance. Create preset within minutes, plug any MIDI pedal controller and set the MIDI channels quickly and use "live" mode to quickly switch scenes smoothly without glitch/popping.

  Every amplifikation and efektor you owned automatically registered. All features from all kuassa plug-ins on a single interface.
specs: |-
  - Universal 2 binary
  - 16 (+1 upcoming) plugins
  - Free routing with unlimited device
  - Assignable MIDI control
  - Live mode
  - Movable interface panels
  - Looper/audio player
  - Container unit with various routing options
  - Chromatic tuner
  - Single screen graphic interface
  - MIDI pedal controller support
