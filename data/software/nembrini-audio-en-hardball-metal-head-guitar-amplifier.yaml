description: EN Hardball is a metal-focused guitar amplifier plugin modeled on the ENGL Powerball II, delivering pure, uncompromising metal tones with four channels covering clean, crunch, lead, and solo sounds. It features built-in noise gate, six cabinet options, four microphone emulations, and an impulse response loader for complete tone shaping.
details:
  - EN Hardball is modeled on the legendary ENGL Powerball II amplifier, offering pure, uncompromising metal tones with razor-sharp attack suited for drop-tuned and extended-range guitars. Its four channels — Clean, Crunch, Lead, and Solo — are optimally matched so that all degrees of distortion fit together seamlessly, providing crystal-clear clean tones through dense, saturated solo sounds and everything in between.
  - "Three filter options give players precise control over their low- and high-end response: the Tight filter reduces low frequencies for better clarity with 7- and 8-string guitars, the Rumbling filter cuts low-frequency content for tighter response, and the Harsh filter trims high frequencies to tame aggressive treble."
  - An integrated noise gate with adjustable Threshold, Range, and Gate Speed controls keeps unwanted noise in check during high-gain playing, making it ideal for tight, percussive rhythm work.
  - The cabinet section offers six guitar cabinet simulations with four microphone emulations and on/off-axis positioning, complemented by an impulse response loader that accepts up to three third-party IRs simultaneously with individual blending controls. A full mixer section provides solo, mute, pan, and fader controls for each IR slot.
  - Available for Mac (OS 10.13+, Intel and Apple Silicon), Windows (7+), and iOS (iPhone/iPad via App Store). Requires a 64-bit DAW, VST2, VST3, AAX, or Audio Units compatible host, and a minimum of 1GB RAM.
