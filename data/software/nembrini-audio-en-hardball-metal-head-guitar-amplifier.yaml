details: |-
  Nembrini Audio EN Hardball Guitar Amplifier plugin is based on an ENGL Powerball II.

  EN Hardball Metal Head Guitar Amplifier is a pure, uncompromising metal amp plugin. This is the way of modern metal! But the EN Hardball also produces crystal clear Clean tones, crispy Crunch, dense solo sounds and everything in between.

  Its four Channels are optimally matched to each other so that all the degrees of distortion fit together seamlessly. Every gain setting is differentiated and delivered with razor-sharp attack. Total joy for any guitar with drop tunings!

  With Nembrini Audio EN Hardball Guitar Amplifier it is possible to choose between six different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs. A complete Mixer section with Solos, Mutes, Pans and Faders allows you to blend together the two microphones with the ambience.

  Impulse Loader lets you load up to three third-party impulse responses that you can even blend together using volume, pan, phase, solo and mute controls.
specs: |-
  - Four channels covering clean, crunch, lead and solo gain stages
  - Filters: Tight reduces low frequency content tightening the low range, suitable for 7/8 strings guitars
  - Filters: Rumbling reduces the low-frequency content
  - Filters: Harsh reduces the high-frequency content
  - Noise Gate: Threshold defines the level where the gate is activated
  - Noise Gate: Range selects the quantity of noise reduction
  - Noise Gate: Gate adjusts the gate speed
  - Cabinets: six guitar cabinets, four microphone emulations with on/off axis switch, continuous position and distance knobs, plus a mixer section with solos, mutes, pans and faders
  - Impulse Response Loader: up to three third-party impulse responses blendable with volume, pan, phase, solo and mute controls
  - Plugin Formats: a VST2, VST3, AAX or AudioUnits compatible host
  - System: an Intel compatible or Apple Silicon CPU, 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
