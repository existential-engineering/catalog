details: |-
  Nembrini Audio En Hardball Guitar Amplifier plugin is based on a ENGL Powerball II* . EN Hardball Metal Head Guitar Amplifier is a pure, uncompromising metal amp plugin. This is the way of modern metal! But the EN Hardball also produces crystal clear Clean tones, crispy Crunch, dense solo sounds and everything in between. Its four Channels are optimally matched to each other so that all the degrees of distortion fit together seamlessly. Every gain setting is differentiated and delivered with razor-sharp attack. Total joy for any guitar with drop tunings!
