description: "Analyze your mix with The Judge by Antelope Audio - a complete
  metering plugin for loudness, levels, spectrum, stereo field & dynamics.
  Broadcast-ready and built for critical listening. Try free for 14 days."
details: |-
  The Judge is Antelope Audio's advanced metering and analysis plugin - built for engineers, producers, and broadcast professionals who need reliable, real-time feedback across every critical domain. With five integrated modules covering loudness, levels, spectrum, stereo field, and dynamics, The Judge delivers total mix clarity and compliance in a single window.

  All-in-One Metering Environment: Combines Peak, RMS, Crest Factor, LUFS, True Peak, Spectrum, Stereo Field, and PSR metering in a single, intuitive interface. Say goodbye to plugin stacking and second-guessing your numbers.

  Broadcast-Ready Loudness Monitoring: Compliant with EBU R128 and ITU-R BS.1770 standards. Track Momentary, Short-Term, Integrated Loudness and True Peak in real-time, with history graphs and target indicators for platform-safe delivery.

  Dynamic & Frequency Insight: Spot EQ issues and monitor dynamics at a glance with a fast, responsive spectrum analyzer and clear crest factor and PSR (Peak-to-Short-term Loudness Ratio) displays - ideal for mastering, parallel chains, and limiter tuning.

  Advanced Stereo Field Visualization: A detailed goniometer and L/R/M/S indicators reveal width, balance, and phase coherence, helping you refine stereo imaging and avoid mono compatibility issues.

  Flexible, Lightweight Workflow Integration: Designed for fast decision-making and low CPU impact, The Judge fits seamlessly into any mix or master session - insert pre- or post-compression to track dynamic shifts, compare limiter stages, or monitor entire signal chains.

  The Judge is part of the Antelope Cosmos plugin collection (75+ Antelope Native Plugins). Free 14-day trial available.
specs: |-
  - Five integrated metering modules: loudness, levels, spectrum, stereo field, dynamics
  - Peak, RMS and Crest Factor metering
  - LUFS metering (Momentary, Short-Term, Integrated)
  - True Peak metering with target indicators
  - PSR (Peak-to-Short-term Loudness Ratio) display
  - Real-time loudness history graphs
  - EBU R128 and ITU-R BS.1770 compliant
  - Responsive spectrum analyzer
  - Goniometer for stereo field visualization
  - L/R/M/S indicators for phase coherence and stereo imaging
  - Low CPU impact design
  - Runs natively in DAW on macOS or Windows
  - Included in Antelope Cosmos plugin collection
