details: |-
  Arpanjo is a semi-modular FM synth that features 3 FM mini-synths with arp and
  trancegate. Connect via patch cables to the phaser, reverb or directly to the
  output. Also features chorder for each mini-synth, master stereo spread and
  master stereo delay.

  Arpanjo by psytrance plugins is a virtual instrument audio plugin for macos
  and windows. It functions as a VST plugin, an audio units plugin and a VST 3
  plugin.

  This VST has a big gui..it may not fit your laptop screen. Try a demo before
  buy in order to avoid refunds.
specs: |-
  - Semi-modular FM synth
  - 3 FM mini-synths
  - Arp and trancegate
  - Patch cables connectivity
  - Phaser
  - Reverb
  - Chorder for each mini-synth
  - Master stereo spread
  - Master stereo delay
