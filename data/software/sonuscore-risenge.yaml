description: Risenge is a huge source of thrilling rises, heart-stopping suckbacks, dramatic build-ups and downfalls, in combination with cinematic hits.
details: |-
  Risenge is a source of rises, suckbacks, build-ups and downfalls, alongside a collection of cinematic hits, aimed at building tension and dynamics in a composition. The library is available in three editions: Pro, Core and Essential. It was designed by the Keepforest team, and its sounds are powered by Keepforest and BOOM Library.

  Keeping the best features of the AizerX engine, Keepforest developed a completely new CPU-friendly engine for even more outstanding performance and a minimalistic modern and smooth design for a fluid workflow. Eight modules of layers can be easily randomized, combined, and modified with an arsenal of more than 4000 fully designed rises, suckbacks, hits, stutters, classic drops and layers and hybrid, engine & motor, mechanical, orchestral, sci-fi, and horror sounds, as well as a powerful easy-to-use sequencer that gives you the ability to create tense and expressive cinematic build-ups for your composition in no time.
specs: |-
  - Requires Kontakt 6.0.2 or newer, and works with the FREE KONTAKT PLAYER
  - Supported host application: Kontakt 6 VST, AU, AAX, Standalone
  - High-quality samples at 48 kHz / 24-bit (96 kHz)
  - 8 units for layers
  - Layers randomizing function
  - Easy-to-use sequencer
  - XY Pad, LFO and PAN functions
  - Minimalistic design
  - CPU-friendly for fast performance
  - Available in three editions: Pro, Core and Essential
  - Risenge Pro: 5 nki files and 4,976 wave samples (174 Full Rises, 1,195 Rise Layers, 651 Full Suckbacks, 1,711 Suckback Layers, 245 Hits, 50 Drops, 38 Buildups & Downfalls, 158 Buildups & Downfalls stems, 754 Resampled engine presets)
  - Risenge Core: 3 nki files and 1,669 wave samples (174 Full Rises, 651 Full Suckbacks, 179 Hits, 50 Drops, 25 Buildups & Downfalls, 100 Buildups & Downfalls stems, 490 Resampled engine presets)
  - Risenge Essential: 377 wave samples (80 Full Rises, 150 Full Suckbacks, 40 Hits, 10 Drops, 20 Toolkits & Buildups plus sorted stem layers)
  - Windows 7, Windows 8 or Windows 10
  - macOS 10.12, 10.13 or 10.14
