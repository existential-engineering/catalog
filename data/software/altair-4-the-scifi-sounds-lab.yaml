details: >-
  Altair 4 - the scifi sounds lab is best suited for creating soundtracks for
  movies or games in the genres of scifi, suspense, horror, fantasy and similar,
  that need special, spacey, wobbly fx sounds. It can do more than these, e.g.
  Bell-like stuff, and it even fits well in fairly conventional songs.


  Altair 4 is also an homage to the movie 'forbidden planet' from 1956, it being
  the first movie with a complete electronic soundtrack using sounds that could
  have been done with this plug-in.


  The VST is a synthedit design made by hg fortune for windows only. It is not a
  general purpose synth, in fact it is aptly named 'the scifi sounds lab'
  because it specializes in making certain types of sounds - typically those
  associated with science fiction effects. Especially, the classic sci-fi from
  the 50's and 60's which featured signal generators and theremins and stuff
  like that.


  There are two resonators that generate ring modulated and fm modulated effects
  - or at least they sound like this to me. The effects have a variety of
  modulators and controls, a synchronizable delay stage and a reverb stage. No
  filters and only an ar envelope - this is a very specialized tool.


  Typical types of sounds that you are likely to make with this are: bell,
  bleeps, arcade noises, sample and hold sequences, inharmonic timbres,
  experimental sounds, heavy lfo designs, and weird and strange things.
specs: >-
  - 2 oscillators with two sound-sources with one (b) driving the other (a) to
  resonate

  - 3 lfo with 7, 8, and 7 waves respectively

  - L1 with key restart on first key pressed

  - L2 with phase modulation

  - L3 with optional modulation by sub lfo

  - 2 hidden lfo: l12 (mix of l1 and l2), l13 (mix of l1 and l3)

  - 1 sample & hold (6 modes)

  - 1 vca with ar eg

  - Pan for un-delayed sound at rev section

  - 1 main volume with level control: fixed, velocity, aftertouch, or wheel

  - 1 delay (bpm-synced) with dedicated pan

  - 1 bass boost

  - 1 reverb with predelay

  - 1 hold button to hold last played key

  - 1 joypad with 3 balls to control 6 destinations

  - 8 voices

  - 256 patches (2 banks)

  - VST plugin

  - Windows

  - Synthedit design
