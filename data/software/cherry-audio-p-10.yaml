details: |-
  Cherry Audio's P-10 is modeled after one of the most desirable flagship analog
  polysynths ever created by Sequential Circuits in 1980. The original could
  operate as two independent five-voice synths, a single ten-voice synth,
  dual-patch layered, or alternating between layers with each keystroke.

  The virtual instrument reproduces the original's exceptional features while
  modernizing the experience. It includes original P5 and P10 factory presets
  and adds expanded 16-voice polyphony per layer, a four-track step sequencer,
  velocity, polyphonic aftertouch, and keyboard split capabilities.

  The synth features comprehensive modulation systems including Mono Mod with
  LFO/Noise source mixing, Poly Mod with individual voice modulation paths,
  Aux Mod extending pedal mod capabilities, and Pressure Mod supporting mono
  and polyphonic aftertouch.

  An additional panel contains an arpeggiator with tempo sync and an
  independent effects section for each layer, including distortion, phaser,
  flanger/chorus, delay, and reverb.
specs: |-
  - 16 polyphonic voices per layer (configurable as dual-layer or single synth)
  - Dual VCOs per voice based on CEM3340 with ramp, triangle, pulse waveforms
  - VCF filter based on CEM3320 with 24 dB/oct lowpass and highpass modes
  - Step sequencer with four monophonic sequences, up to 128 steps each
  - Arpeggiator with tempo sync
  - Effects chain: distortion, phaser (4/6/12-stage), flanger/chorus, delay, reverb
  - Original P5 and P10 factory presets included
  - Velocity and polyphonic aftertouch support
  - Keyboard split capabilities
  - Complete MIDI control and DAW automation
  - macOS 10.13+ and Windows 7+ (64-bit)
  - 104 MB disk space required
