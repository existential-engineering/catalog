details: |-
  FM3-Edit is a full-featured Mac/PC editor for the FM3. You can view, edit, and manage presets, and much more.

  You will immediately discover the advantages of working on a large computer screen with a full keyboard and mouse/touchpad. FM3-Edit makes it even easier to create and dial in even the most complex setups.

  View entire presets at a glance, edit blocks and parameters, copy/paste, drag and drop, and more.

  Speed your workflow with preset Templates, or use the Block Library stored on your computer to access your favorite settings in one click.

  Unlock your full creative potential with FM3-Edit, available below for free. Version 1.07.17 is dated August 25, 2026, and is offered as a Mac build and a Windows build, with a separate 32-bit Windows build also available.
specs: |-
  - Free companion editor and librarian for the FM3
  - View entire presets at a glance and edit blocks and parameters
  - Copy/paste and drag and drop between presets
  - Preset Templates and a computer-side Block Library for one-click recall
  - Mac build requires Mac OS 10.13 or newer and is compatible with Catalina
  - Windows build requires Windows 10 or newer (64-bit only); a 32-bit build is also offered
