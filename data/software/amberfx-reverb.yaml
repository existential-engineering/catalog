description: Amberfx is a reverb effect designed for ambient sounds, featuring
  long tails reverberations and modulations as well as a modulated pitchshift.
details: >-
  Amberfx is a reverb effect designed for ambient sounds, featuring long tails
  reverberations and modulations as well as a modulated pitchshifter.


  This plug-in comes with signed installers (both for windows and macos).


  Version 1.0.2 (march 2021) introduced preset system for audio unit. Reworked
  audio parameters to be smooth.


  Version 1.0.1 (february 2021) introduced versioning. Introduced manual pages.
  Reworked early reverberations. Reworked ui (shadows, orbs). Calibration of
  rt60 decay times.


  Version 1.0.0 (january 2021) initial version.
specs: |-
  - Blz reverb engine
  - Bandpass filter
  - Stereo enhancer
  - Pitchshifter (-12/+12 semitones)
  - Fully automatable
  - Configurable modulations
  - 5 presets (audio unit only)
  - Tuned for low-frequency sounds
  - VST 3
  - Audio unit
  - Windows (x86)
  - Mac (x86, m1)
