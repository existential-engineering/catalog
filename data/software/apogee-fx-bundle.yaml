name: Apogee FX Bundle
manufacturer: apogee
primaryCategory: effect
url: https://apogeedigital.com/product/apogee-fx-rack-bundle/
description: Apogee FX rack plugins are made with the same quest for quality and
  obsessive attention to detail as Apogee hardware products.
details: |-
  Pultec eqp-1a program equalizer precisely recreates the pultec eqp-1a's unique
  characteristics: broad eq curves, to gently but powerfully shape your sounds
  while maintaining their integrity. Interaction of bands, to create
  characteristic eq curves used by engineers for decades. Circuit
  non-linearites, to add the "magic" that hardware units are renown for.
  Developed with pulse techniques, current manufacturer of hardware pultec eqs.
  Apogee plugin modeled from brand new pultec unit. Officially licensed and
  endorsed by pulse techniques.

  Pultec meq-5 midrange equalizer plugin precisely recreates the original
  hardware to sculpt critical midrange frequencies with precision and warmth.
  Developed with pulse techniques, current manufacturer of hardware pultec eqs.
  Apogee plugin modeled from brand new pultec unit. Officially licensed and
  endorsed by pulse techniques.

  Opto-3a vintage compressor/limiter reproduces the reactive compression
  characteristics of modeled hardware with optical compressor/limiter
  functionality, extended hf emphasis functionality, sidechain hp filter, and
  dry/fx mix.

  Modeq 6 modern 6 band visual equalizer features 6 band parametric eq with lo
  pass, hi pass, 2 peak/shelf, and 2 peak/notch bands, along with visual user
  interface, spectrum analyzer, band solo, and proportional/constant q options.
  Modcomp modern visual compressor/limiter features modern compressor/limiter
  with visual user interface, 3 user selectable styles (punch, easy and level),
  2-band sidechain eq, auto makeup, and dry/fx mix.
specs: |-
  - Dualpath dsp-native technology
  - Pultec eqp-1a program equalizer
  - Pultec meq-5 mid-range equalizer
  - Opto-3a vintage compressor/limiter
  - Modeq 6 modern 6 band visual equalizer
  - Modcomp modern visual compressor/limiter
  - Optical compressor/limiter
  - Extended hf emphasis functionality
  - Sidechain HP filter
  - Dry/FX mix
  - 6 band parametric EQ
  - Lo pass
  - Hi pass
  - Peak/shelf
  - Peak/notch
  - Visual user interface
  - Spectrum analyzer
  - Band solo
  - Proportional/constant q
  - 3 user selectable styles (punch, easy, level)
  - 2-band sidechain EQ
  - Auto makeup
  - FX and FX rack versions
  - Dualpath monitoring
  - Windows 10 and higher
  - Mac OS X 10.12.6 or higher
  - 4 GB minimum RAM
  - 8 GB or higher recommended
  - Free pace ilok account
  - Universal 2 binary
