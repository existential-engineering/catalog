description: Enhance your vocals with Sonnox VoxDoubler. Create rich,
  professional-sounding harmonies and double-tracked effects.
details: |-
  VoxDoubler is a vocal doubling tool from the Sonnox Toolbox range, shipped as two dedicated plugins that share one licence. Thicken stacks doubles behind the lead for body and weight, while Widen spreads them across the stereo field. Timing and pitch variation are applied per layer so the result reads as a genuine second take rather than a copied layer.

  Pitch and timing controls adjust each layer independently, so a double can be dialled in without overpowering the original signal.

  Sonnox suggests Thicken with high pitch and low timing humanisation for bold, aggressive rap or metal leads, automated in and out of the mix for a hype-man effect, and Widen with lower pitch and higher timing humanisation to turn a single take into a wide, choir-like backing part. Placed earlier in an FX chain, before a reverb or a delay, it produces spacey depth or tape-like delays with evolving variations.

  It is not restricted to voices: doubling a brass or string part turns a solo into an ensemble, which Sonnox pitches at film scoring and larger band arrangements. Each Sonnox licence includes two simultaneous activations, authorised through an iLok account on a local machine, an iLok2 or iLok3 USB device, or iLok Cloud (only one activation may sit in the cloud).
specs: |-
  - Two plugins under one licence: Thicken (weight and depth) and Widen (stereo spread)
  - Timing humanisation control varies each double's alignment against the source
  - Pitch humanisation control detunes each double for a natural, non-cloned result
  - Works as an insert or as a send/return effect
  - Usable on instruments as well as vocals, for ensemble-style thickening of brass, strings or guitars
  - Plugin formats: Audio Unit (AU), VST3, AAX-Native (Pro Tools 11 or later)
  - macOS 10.13 High Sierra or later
  - Windows 10 (64-bit) or later
  - iLok authorisation: two simultaneous activations per licence, via local machine, iLok2/iLok3 USB device, or iLok Cloud
