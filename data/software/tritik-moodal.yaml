description: "A spectral resonator plugin enabling users to model and excite
  objects and spaces through audio processing. Features a modal filter with up
  to 1000 resonances, allowing transformation of various sound sources from
  drums to vocals to guitars."
details: |-
  Up to 1000 resonance modes. Simulation of real and virtual objects/spaces. Editable curves for frequency-dependent amplitudes and decay times. Modal density and spectral characteristic controls.
specs: |-
  Version 1.2.1. macOS 10.9 or later. Windows 7 or later. Demo available with periodic audio muting.
