description: Moodal is a resonator plugin that lets you create objects and spaces to sculpt your sound. A unique tool for musicians and sound-designers.
details: |-
  Moodal is an audio plugin that models objects and spaces to be excited by the sounds you run through it.

  Make your snare deeper, or turn it into a bottle. Send your voice through a phone, or slide it along a string. Give your guitar a new soundboard, or throw some notes onto a plate and quickly create rich textures.

  Moodal lets you transform your sound in a lively and refreshing way.

  At the heart of Moodal is a one-of-a-kind resonance engine, built around a dense modal filter with up to 1000 modes. This modal reverberation approach allows Moodal to replicate realistic objects such as strings or plates, as well as simulate reverberant spaces like rooms and halls that require high modal density.

  Moodal's controls are designed to let you sculpt your sound deeply yet intuitively. The user interface, including 3 editable curves, allows you to quickly shape the resonators properties across the whole frequency range and create unique timbres within seconds.

  Its flexibility and its character make Moodal a versatile tool for musicians and sound designers.
specs: |-
  - Up to 1000 resonant modes
  - Simulation of real and virtual objects and spaces
  - Editable curves for frequency dependent amplitudes and decay
  - Intuitive control over modal density and tonal characteristics
  - 3 editable curves in the user interface
  - Mac: VST, VST3, AU, AAX
  - Windows: VST, VST3, AAX
  - Requires Windows 7 or later
  - Requires macOS 10.9 or later
