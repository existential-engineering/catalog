description: An authentic emulation of a bucket brigade (BBD) analog delay circuit, faithfully modeling the BL-3208 delay chip and SA-571 compandor system for warm, organic echoes that degrade naturally across repetitions. Features a tilt filter, stereo cross-feed, delay clock LFO for flanging effects, and host tempo synchronization.
details: |-
  Bucket brigade delay (BBD) emulation modeling the BL-3208 delay chip, SA-571 compandor system, anti-aliasing and reconstruction filters from the original hardware. Delivers warm echoes with natural degradation across repetitions and transient clarity. Tilt filter in the feedback path for tone shaping. Stereo cross-feed for spatial offset effects. Delay clock LFO for flanging/modulation. Extended delay time range (10ms–1000ms) beyond original hardware. Host tempo sync for BPM-locked repetitions. Insert/send mode toggle (dry mute). Optional +3dB feedback for self-oscillation. Universal 2 Binary (Apple Silicon native).
specs: |-
  Delay time: 10ms–1000ms (L/R independent). macOS 10.12+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+, 2 GHz Intel CPU+, 2 GB RAM, 1280×1024 display. Formats: VST2, VST3, AU, AAX. Copy protection: serial number.
