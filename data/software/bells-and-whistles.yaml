details: |-
  For this production, we've thrown our toys out of the pram... And sampled them
  all. Here's a treasure trove of bells, whistles, rattles, special percussion,
  animal calls and lots of other crazy musical toys that we could get our hands
  on.

  Our love of all things animated has inspired bells & whistles and within the
  library you'll find many familiar effects, which have been heard for decades
  in vintage film animation, tv stop motion and everything in between.

  Our fun-house of source instruments include classic slide whistle, duck call,
  football rattle and flexatone, to name but a few. These have been categorized
  into groups and articulations and the tonal whistles have been multi-sampled
  and turned into playable instruments too.

  Available for the free kontakt player version 5.7.1 and above. Nks compatible.
specs: |-
