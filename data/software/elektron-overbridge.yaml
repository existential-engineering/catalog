description: Overbridge is a free of charge software suite offering powerful tools and deep control when connecting compatible Elektron instruments to computers.
details: |-
  Overbridge is a free software suite that bridges Elektron hardware instruments with computer-based DAWs. It provides VST, AU, and AAX plugins that function as software instruments, enabling multi-channel audio streaming directly through the plugin interface.

  Compatible hardware can be used as a high-quality sound card, allowing digital computer audio to be processed through analog hardware circuits. Individual track streams from a device can be processed inside the DAW, and stand-alone plugins offer built-in multi-tracking capabilities.

  Overbridge runs natively on Apple Silicon and supports macOS 11 Big Sur or later, and Windows 10 or 11. Compatible instruments include Analog Four MKI/MKII, Analog Keys, Analog Rytm MKI/MKII, Analog Heat MKI/MKII/+FX, Digitakt, Digitakt II, Digitone, Digitone Keys, Digitone II, and Syntakt.
specs: |-
  - Free of charge software suite for compatible Elektron instruments
  - Dedicated VST, AU and AAX plugins
  - Stand-alone plugins with built-in multi-tracking
  - Multi-channel audio streaming through the plugins
  - Use a compatible Elektron instrument as a high-quality sound card
  - Overbridge Enabled Instruments: Syntakt, Digitakt II, Analog Rytm MKII, Analog Heat +FX, Analog Four MKII
  - Also supports Analog Four MKI, Analog Keys, Analog Rytm MKI, Analog Heat MKI/MKII, Digitakt, Digitone, Digitone Keys, and Tonverk (multistreaming only, no plugin)
  - macOS 11 Big Sur or later, runs natively on Apple Silicon
  - Windows 10 (latest Service Pack) and Windows 11
