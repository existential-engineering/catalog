details: |-
  5.1 master eq is a 5.1 graphic equalizer that works without phase shifting and resonance peaks and features 158 "quantum filters" "at work".

  Due to its design, 5.1 master eq uses cpu for active filter channels only - whenever a frequency level slider is at 0db the filter channel is inactive.

  It is equipped with a 158-point routing matrix to handle this amount of filters easily.

  158 bands of pd's "hand calibrated" quantum filters with high precision filters and sliders.
specs: |-
  - 5.1 graphic equalizer
  - 158 quantum filters
  - No phase shifting
  - No resonance peaks
  - 158-point routing matrix
  - Cpu optimization for active filter channels only
  - High precision filters and sliders
  - No sideband interacting
  - 6 and 12 db mode
  - VST plugin
  - Windows compatible
