description: "Matrix is a fully featured live streaming mixer software for the
  Mackie MainStream interface, providing hardware and virtual inputs, flexible
  outputs, sample pads, vocal processing, and effects for content creators on
  Windows."
details: |-
  Matrix is Mackie's companion live streaming mixer software for the MainStream interface. It surfaces hardware inputs for connected devices alongside dedicated inputs for the MainStream HDMI game feed and the mic/headset, giving streamers a unified mixing surface for everything happening on their desk.

  Six virtual inputs route audio from Discord, Spotify, games, and other software into the mix, while four flexible outputs send tailored mixes to OBS, monitors, headphones, and other destinations. Three banks of eight virtual pads (24 total) trigger samples on the fly during a stream.

  Matrix includes M-Voice vocal processing with optional one-knob control and an M-FX engine featuring reverb, delay, telephone, and other effects. The software is available for Microsoft Windows computers.
specs: |-
  - Fully featured streaming mixer software for the MainStream interface
  - Hardware inputs for connected devices
  - Separate inputs for MainStream HDMI game feed and mic/headset
  - Six virtual inputs for Discord, Spotify, games, and other software
  - Four flexible outputs for OBS, monitors, and more
  - Three banks of eight virtual pads (24 total) for triggering samples
  - M-Voice vocal processing with optional one-knob control
  - M-FX effects including reverb, delay, and telephone
  - Available for Microsoft Windows
