description: Live streaming mixer software for the MainStream interface. Matrix
  gives you a fully featured virtual live streaming mixer that can pull audio
  from your mic, game feed, headset, Discord, Spotify and more.
details: |-
  Matrix is a virtual live streaming mixer that pairs with the MainStream interface. Hardware devices plug into MainStream, and Matrix combines those inputs with software sources into one high-quality audio stream.

  Alongside the hardware inputs, six virtual inputs bring in audio from software such as voice chat, music services and a browser, and each channel's level is controlled separately.

  Four separate virtual outputs send mixes to OBS or another streaming application, to headphones and to a voice chat at the same time. Matrix works with Discord for control of audio going to and from the app.

  M-Voice condenses a chain of vocal processors into a single knob, with separate control of the EQ, gate, compressor and de-esser. M-FX adds effects pulled from the Mackie DLZ Creator, including reverb and delay, plus telephone and voice disguiser.

  Three banks of eight virtual pads, 24 in total, trigger samples and sound effects such as laughter, applause and a censor beep, or custom sounds, fired from the mouse, the keyboard or MainStream's multifunction keys.
specs: |-
  - Fully featured streaming mixer software
  - Hardware inputs for connected devices
  - Separate inputs for MainStream HDMI game feed and mic or headset
  - Six virtual inputs for Discord, Spotify, games and other software
  - Four flexible outputs for sending mix to OBS, monitors and more
  - Three banks of eight virtual pads for triggering samples and sound effects (24 total)
  - M-Voice vocal processing on every channel with optional one-knob control
  - M-FX effects on every channel with reverb, delay, telephone and more
  - Available for Microsoft Windows computers
