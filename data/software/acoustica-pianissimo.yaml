description: Pianissimo virtual piano uses a combination of sample playback and
  advanced physical modeling to create a stunning acoustic grand piano sound,
  starting with 250 MB of high quality samples of a Steinway Model D grand
  piano.
details: |-
  Pianissimo is a virtual grand piano that combines sample playback with
  advanced physical modeling. It starts with 250 MB of high quality samples of a
  Steinway Model D grand piano and uses complex signal processing and
  programming to recreate the warmth, response, and playability of a real grand
  piano.

  The plugin features modeled sympathetic resonance, incidental mechanical
  hammer sounds, remarkable control over tone and velocity response, 256 voices
  of polyphony, and incredibly low CPU usage.

  Adjustable parameters include piano lid position, velocity curve, tone
  controls, sympathetic resonance amount, reverb, and chorus effect, allowing
  users to tailor the piano's tone and response to fit their playing style.

  The standalone version features a metronome, two-track sequencer, and the
  ability to mix down recordings to WAV, MP3, WMA, or OGG Vorbis audio files.
  Pianissimo is also included with Mixcraft Pro Studio.
specs: |-
  - 250 MB Steinway Model D grand piano samples
  - Advanced physical modeling engine
  - Modeled sympathetic resonance
  - Incidental mechanical hammer sounds
  - 256 voices of polyphony
  - Low CPU usage
  - Adjustable piano lid, velocity curve, tone controls
  - Built-in reverb and chorus effects
  - Standalone: metronome, two-track sequencer
  - Export to WAV, MP3, WMA, OGG Vorbis
