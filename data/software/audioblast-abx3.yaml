description: ABX3 is a powerful multi-engine synth, designed for creating Acid, Techno, Trance, and Hard Dance music with ease. Packed with motion sequencers, preset morphing, and 606 sounds and patterns.
details: |-
  Abx-3 is a cutting-edge bass line synthesizer, at first designed as a modern tribute to the legendary 303 bass line synthesizer from the 1980s. With a completely redesigned interface, Abx-3 makes it easier than ever to craft real-time sequences and dynamically adjust them during live performances and by the way in studio situation too.

  Unleash Your Creative Potential with Abx-3, the ultimate tool for live performances and studio production. This innovative bass line synthesizer is packed with powerful features, including a robust 16 to 64-step sequencer, 32 independent patterns, 8 powerful distortion types and 7 integrated effects and in addition a patch randomizer that offer unparalleled creative freedom. In conclusion it's not a classic 303 synthesizer, it does much more than that.

  Explore the next generation of acid sound design possibilities with 606 presets available in the factory sound bank. Explore New Sonic Territories with Abx-3, a simple yet powerful tool for real-time musical creation, inspired by the works of Techno, House, Acid House, Hard Acid, like Laurent Garnier and Daft Punk.

  Abx-3 also pays homage to Acid House legends such as DJ Pierre, Phuture and Hardfloor, embodying the spirit of vintage 80s synthesizers. Today, we can thank the TB-303 for the birth of Acid House, as well as its part in the evolution of Hard House, Techno and Rave music to name a few. Audio Blast Abx-3 proudly represents these exciting styles of electronic music, and offers creative new ways to build upon these genres with a modern music production workflow.

  A demo version is available for Mac, Windows and Linux, and an internet connection is required in order to install and update the product.
specs: |-
  - 606 presets
  - 32 oscillator shapes
  - Sub oscillator (selectable sine or square)
  - 8 distortion units: Overdrive, Clip Inferno, Hot Valve, Ultracrunch, Turbo Fuzz, RageClip, Brutal Bill and Bit Crusher
  - Sequencer with up to 64 steps and 32 patterns, easy pattern view and MIDI-programmable pattern launching with launch quantisation
  - Sequencer speed ranging from /4 to x8 with various time divisions
  - Parameter sequencer with independent speed and parameter control
  - 4 sync modes: Internal, Host sync, MIDI in and ARP mode
  - ARP mode: play sequences with a MIDI keyboard while staying synced to the tempo
  - 3 FX slots with 7 effects available: Reverb, EchoVerb, SynthVerb, Stereo Chorus, Mono Chorus, 4Band-Fuzz and Flanger
  - Delay effect with Ping Pong and Sync modes
  - Reverse MIDI functionality for backward MIDI control
  - Pattern browser for quick access to other patterns and variations
  - Random scale selection, assignable random button and real-time randomization of accents, slides, notes, octaves, steps and scale
  - Live creation and recording of note and parameter sequences on the fly
  - Advanced step control: fine-tune parameters, time and pan per step, shift and transpose sequences
  - Enhanced MIDI capabilities: MIDI export with accents and slides, drag and drop of .Abx3 files, customizable accent thresholds
  - MIDI OUT to sync with external synths
  - 5 GUI themes, resizable at 75%, 100%, 150% and 200%
  - 64-bit and compatible with Pro Tools 11 and above
  - macOS 10.13 to latest, Intel Core i5 or equivalent, Apple Silicon M1 to M4 compatible, 2 GB RAM
  - Windows 7 to 11, Intel Core i5 or equivalent, 2 GB RAM
  - Internet connection required for installation and updates
