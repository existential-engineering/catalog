description: ABX3 is a powerful multi-engine synth, designed for creating Acid,
  Techno, Trance, and Hard Dance music with ease. Packed with motion sequencers,
  preset morphing, and 606 sounds and patterns.
details: |-
  ABX3 is a modern, TB-303-inspired acid bassline synthesizer plugin built for Acid House, Techno, Acidcore, Trance and Hard Dance production. Create squelching basslines, evolving sequences and aggressive lead sounds with an integrated pattern sequencer, real-time randomization and performance-ready controls.

  Most acid plugins focus on recreating a single iconic machine. ABX3 starts with the raw spirit of the classic 303 and expands it into a complete bassline instrument for modern production and live performance.

  Build evolving sequences, switch between 32 patterns, explore 32 oscillator shapes and transform your sound with parameter sequencing, 8 distortions and 3 integrated FX slots. From classic Acid House squelch to aggressive Techno, Acidcore, Trance and Hard Dance lines, ABX3 lets you create more with fewer tracks.

  Explore New Sonic Territories with ABX3, a simple yet powerful tool for real-time musical creation, inspired by the works of Techno, House, Acid House, Hard Acid, like Laurent Garnier and Daft Punk. ABX3 also pays homage to Acid House legends such as DJ Pierre, Phuture and Hardfloor, embodying the spirit of vintage 80s synthesizers.

  A free demo is available for Mac, Windows and Linux. An internet connection is required in order to install and update the product.
specs: |-
  - 606 presets
  - 32 oscillator shapes
  - Sub oscillator, selectable sine or square
  - 8 distortion types
  - Parameter sequencer with independent speed and parameter control
  - Sequencer speed ranging from /4 to x8 with various time divisions
  - 16 to 64 step sequencer with 32 independent patterns
  - Reverse MIDI functionality for backward MIDI control
  - Pattern browser for quick access to other patterns and variations
  - Random scale selection
  - 3 FX slots with 7 effects available: Reverb, EchoVerb, SynthVerb, Stereo Chorus, Mono Chorus, 4Band-Fuzz and Flanger
  - 5 GUI themes
  - 64-bit and compatible with Pro Tools 11 and above
  - macOS 10.13 to latest, Apple Silicon M1 to M4, Intel Core i5 or equivalent CPU, 2 GB RAM
  - Windows 7 to 11, Intel Core i5 or equivalent CPU, 2 GB RAM
  - Linux compatible
  - Requires an internet connection to install and update
