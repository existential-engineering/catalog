description: "A software recreation of the Binson Echorec2 delay, emulating the
  classic hardware unit used on early Pink Floyd recordings with a dreamlike,
  psychedelic quality."
details: |-
  Input and delay volume controls
  Tone control for delayed signal
  Delay selector with multiple patterns
  Tube emulation in input and post-delay sections
  Adjustable delay length with auto-oscillation capability
  Three stereo-crossing channel selector knobs (software-exclusive)
  Host BPM synchronization or custom BPM setting
specs: |-
  - Careful reproduction of the original Binson Echorec2 schematics
  - Control over input and delay volume
  - Tone control of the delayed signal
  - Delay selector for selection of different delay times and patterns
  - Tube emulation in input and post-delay section
  - Delay length from short slaps all the way to characteristic auto-oscillation
  - Three "channel selector" knobs for stereo crossing effects (software-exclusive feature)
  - Delay timings adjustable to host BPM or custom BPM setting
  - Available in 32-bit and 64-bit formats
  - Mac: OSX 10.7 or higher required; Intel and Apple Silicon supported
  - iOS: AUv3 format, compatible with GarageBand and Cubasis
  - Linux: ARM and x86_64 VST3 builds available
