description: "A software recreation of the Binson Echorec2 delay, emulating the
  classic hardware unit used on early Pink Floyd recordings with a dreamlike,
  psychedelic quality."
details: |-
  Input and delay volume controls
  Tone control for delayed signal
  Delay selector with multiple patterns
  Tube emulation in input and post-delay sections
  Adjustable delay length with auto-oscillation capability
  Three stereo-crossing channel selector knobs (software-exclusive)
  Host BPM synchronization or custom BPM setting
