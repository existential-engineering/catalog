description: "A linear phase multiband compressor featuring four frequency bands
  with independent dynamics control per band, double-precision linear phase band
  splitters, and a built-in brickwall clipper."
details: |-
  4 frequency bands
  Linear phase crossover processing
  Independently adjustable compression parameters per band
  Soft/hard knee modes
  Built-in clipping function
  A/B testing capability
  Double-precision linear phase band splitters
specs: |-
  - 4 frequency bands with double-precision linear phase band splitters
  - Freely adjustable transition frequencies between bands
  - Per-band controls: threshold, gain, ratio, attack, release
  - Solo and bypass options per band
  - Hard and soft knee compression modes
  - Built-in brickwall clipper
  - A/B state comparison
  - Windows 32-bit and 64-bit support
  - macOS 10.7+ (Intel and Apple Silicon)
  - Linux ARM and x86_64 support
  - Free demo available
