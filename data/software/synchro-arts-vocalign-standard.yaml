description: An award-winning vocal time-alignment plugin — a workflow must-have for the everyday vocal producer.
details: |-
  VocAlign Standard delivers fast and accurate vocal time-alignment with SmartAlign technology. Features include Tightness control for alignment strength adjustment, multiple track alignment capability, Pro Tools ARA compatibility, Undo/Redo functionality, Arm Capture All, and Improved Synch Points. Available as a 64-bit plugin for Mac and Windows. Supports 2 activations per license.
specs: |-
  - Mac: macOS 10.14 or higher, Intel or Apple Silicon (M Series), AU/VST3/AAX 64-bit
  - Note: Apple Silicon Logic Pro lacks ARA support
  - Windows: Windows 10 or higher, Intel or AMD processor, VST3/AAX 64-bit
