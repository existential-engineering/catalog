description: VocAlign Standard is the entry-level version of Synchro Arts' vocal
  time-alignment plugin, a workflow tool for the everyday vocal producer. It
  aligns vocal tracks to a guide with a re-imagined user interface.
details: |-
  VocAlign Standard is the entry-level tier of the VocAlign family, described as the entry-level version of the award-winning vocal time-alignment plugin and a workflow must-have for the everyday vocal producer.

  The plugin offers fast, accurate, transparent vocal alignment, with efficiency-boosting features such as SmartAlign, which intelligently aligns multiple clips to a guide track with no pre-editing needed, and presets for finding a sound quickly.

  Tightness control lets the strength of the alignment be dialled up or down with a single knob, so the result can stay natural across different vocal scenarios and genres.

  Version 6 adds dark-theme visuals, Pro Tools ARA compatibility, Arm Capture All, and undo/redo. Pitch-related features (Match Pitch, SmartPitch, Formant Shift, Transpose, Protected Areas), Process Groups, improved Sync Points and SynchroLink are Pro-tier only and are not part of Standard.

  A licence covers 2 activations and includes a digital download of VocAlign Standard for Mac and PC.
specs: |-
  - Match Timing
  - Align multiple tracks (supported ARA-compatible DAW required)
  - SmartAlign: intelligently aligns multiple clips to the guide track with no pre-editing
  - Tightness control for alignment strength
  - Improved UI (dark-theme visuals)
  - Pro Tools ARA compatibility
  - Arm Capture All
  - Undo / Redo
  - 2 activations per license
  - Digital download of VocAlign Standard for Mac and PC
  - macOS: macOS 10.14 or higher
  - macOS: Intel or Apple Silicon (M Series) processor
  - macOS: AU, VST3 or AAX 64-bit host
  - Apple Silicon version of Logic does not support ARA plug-ins
  - Windows: Windows 10 or higher
  - Windows: Intel or AMD processor
  - Windows: VST3 or AAX 64-bit host
