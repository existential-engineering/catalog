description: A lightweight mid/side processing plugin offering M/S encoding,
  decoding, gain control, monitoring, and metering. A streamlined free plugin
  for mid/side matrixing workflows.
details: |-
  Midside Matrix pares down our acclaimed mid/side processor, Midside, to just the essentials: mid/side matrixing, gains, monitoring, & metering, all in a simple, lightweight package. And, because we love M/S processing so much at Goodhertz, we decided to make Midside Matrix free for everyone!

  Changing the stereo width in Midside Matrix is as simple as boosting or cutting the side signal. Want to make a stereo source wider? Try a +6dB sides boost. Need to make something mono? Just mute the sides altogether. Need more fine-tuned stereo width controls? Check out all the expressive stereo width modes in the full version of Midside.

  Using Midside Matrix, it's incredibly easy to convert between M/S and L/R stereo signals without needing to worry about extra buses, gain staging, or incorrect panning. Using two instances of Midside Matrix, any stereo processor, even analog hardware, can be converted into a mid/side-capable stereo processor.

  The M/S microphone technique is extremely flexible and sounds great in lots of applications, but because of the complexity of creating an M/S recording in most DAWs, it's often incorrectly setup or avoided altogether. Before Midside Matrix, M/S recording usually took three audio tracks (M, S+, S-) plus a stereo bus, with manual panning and a polarity reversal on S-. With Midside Matrix, one stereo audio track carries the M & S signals as the input and the plugin performs the M/S to L/R conversion.

  Like all our plugins, Midside Matrix was built to be automated and moved around (even the mute and matrix buttons won't click or pop). Use it to manipulate space and depth; automate the mid/side gains to create more motion in your mixes or masters.
specs: |-
  - M/S encoding & decoding
  - M/S mute functionality
  - High resolution M/S gain faders
  - Pre/post fader level metering
  - Flip left/right
  - Click-free operation (fully automatable)
  - Large goniometer
  - Part of the Goodhertz Free Series; an internet connection is required if you don't own any other Goodhertz plugins
  - 64-bit download requiring a 64-bit DAW
  - macOS 10.13 or later, Windows 10 or later
