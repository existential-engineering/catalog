description: A lightweight mid/side processing plugin offering M/S encoding, decoding, gain control, monitoring, and metering. A streamlined free plugin for mid/side matrixing workflows.
details: |-
  Midside Matrix is a free plugin from Goodhertz that provides essential mid/side processing in a clean, minimal interface. It is part of the Goodhertz Free Series and serves as a stripped-down companion to their full Midside plugin.

  The plugin supports M/S encoding and decoding, allowing users to convert stereo signals to mid/side format and back. It includes click-free M/S mute functionality and high-resolution M/S gain faders for precise stereo field control.

  A large goniometer (vectorscope) display provides real-time visual feedback of the stereo image. Embedded level meters in the gain sliders show pre and post fader peak levels, making it easy to monitor levels during processing.

  The plugin uses double-precision floating-point processing to prevent internal clipping, and supports full automation with artifact-free parameter changes on all controls including on/off switches.
specs: |-
  - M/S encoding & decoding
  - Click-free M/S mute
  - High-resolution M/S gain faders
  - Pre/post fader level metering
  - Flip left/right
  - Large goniometer (vectorscope) display
  - Full automation support with artifact-free parameter changes
  - Double-precision floating-point processing
  - Stereo input/output only
  - Mac: AU, VST, VST3, AAX (64-bit); requires macOS 10.13+
  - Windows: VST, VST3, AAX (64-bit); requires Windows 10+
