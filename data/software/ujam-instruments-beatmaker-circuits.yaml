description: The Beatmaker plug-in to create the perfect back-to-future drum groove with the sounds of classic drum machines.
details: |-
  CIRCUITS gives you classic drum machine sounds without the vintage gear. Inspired by 70s and 80s analog boxes, it's perfect for retro grooves, lo-fi beats, synth pop, and everything electro. Load it up and vibe instantly, with no sample digging and no complex routing, just warm, analog-flavored drums that sit right in the mix.

  CIRCUITS brings the raw punch of vintage drum machines into your mix and handles synthwave, retro pop, electro, and more with no tweaking needed. A Vintage/Modern control shapes the tone between period-correct and contemporary, across 10 analog-style kits and 20 styles with 23 patterns each.

  CIRCUITS is one of 17 genre-focused drum instruments in the Beatmaker series, all hosted inside a single Beatmaker plug-in that is installed by the UJAM App with your first Beatmaker title.
specs: |-
  - 10 analog-style drum kits
  - 20 styles with 23 patterns per style (460 total)
  - Vintage/Modern control for tone shaping
  - MIDI drag and drop
  - Royalty-free MIDI phrases and sounds
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 0.96 GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, 64-bit only
  - Automated installation via the UJAM App, which also installs the Beatmaker plug-in that hosts all titles
  - Authorization via the UJAM App
  - Supported standards: MIDI
