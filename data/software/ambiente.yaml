details: |-
  Ambiente is Audio Modeling's revolutionary room simulator, allowing you to
  place any instrument or recorded track into a shared, realistic acoustic
  space.

  Use ambiente as a standalone app or plugin, positioning and shaping each sound
  source with precision to create cohesive, natural-sounding mixes that bring
  all your elements together in one immersive environment.

  Ambiente by audio modeling is a virtual effect audio plugin and a mobile audio
  app and a software application for macos, windows and ios.
