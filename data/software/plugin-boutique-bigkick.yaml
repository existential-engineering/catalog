details: |-
  BigKick is a kick drum generator plugin that combines synthesis for
  flexibility and samples for extra character. It was created to allow users to
  achieve professional kick drum results without the frustration of searching
  through samples or layering kick drums manually. The plugin provides complete
  flexibility over the low end and attack of the kick drum.

  Features include drag-and-drop instant sample import and export to your DAW or
  desktop, the ability to drag finished samples straight out of the plugin to
  your host's sampler, and the option to drag sounds straight from your track
  onto the load sample button to layer them with the synthesized kick drum.
  Users can easily integrate their existing sample libraries and set the pitch
  to match their bass-line or play the pitch of the kick drum with their MIDI
  keyboard.

  The plugin includes two kick drum body models: original (covering a range of
  styles) and tough (which gets a harder edged more electronic sound great for
  trance and other clean, tight and hard genres). Creative options include
  overdrive, three unique waveforms and a hard clipper. A high pass filter helps
  avoid nasty surprises in the sub-bass, and built-in eq makes presets sit right
  in the mix quickly with a punch control to tuck the drum into your mix or have
  it leap out and smack you in the face.

  Split output mode can be enabled using the button on the front of the ui. This
  routes the attack samples to a separate channel in your DAW for further
  processing, allowing the user to use other plugins for processing the kick
  attack and body separately. The second sample layer allows for more
  fine-tuning of your kick sound with attack (load your existing kick samples to
  utilise their attack and character) and body (tone generator to shape the
  perfect low end into your kick with detailed envelope, pitch and note
  parameters).

  The factory library includes more than 300 attack types and 110 presets.
  Preset designers include audialize, cutline, daniel daly, d-product,
  freemasons, jamie anderson, jim credland, john lead, kris o'neil, niche audio,
  rasmus faber and timo garcia. Bigkick expansion packs are available as a great
  collection of bespoke, genre inspired packs specifically designed for bigkick.
