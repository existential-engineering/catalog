description: pure:deess is an AI-powered de-esser plug-in that removes the sharp
  edges from vocal and speech recordings. Detection and parametrization are
  automatic, so sibilance is smoothed with a single suppression dial.
details: |-
  The plug-in analyzes a source in a few seconds and builds a voiceprint, a profile of the sibilance characteristics of that particular voice, which then serves as the target for how the voice should sound once it is balanced. Rather than reacting to Ess sounds alone, the analysis computes separate target profiles for Z, Sh, Ch and T phonemes, so the processing follows the source content and stays natural across different kinds of sibilants.

  Day-to-day control is deliberately narrow. The main Suppression dial raises or lowers the amount of suppression to suit the context, and the balance within the voice is refined by ear. Solo voice-overs and sparse, intimate arrangements typically need less reduction than busy, full-range mixes, and the amount is left to the engineer.

  Two further parameters cover more detailed changes. Color sets the character of the sibilants to Soft, Balanced or Sharp, and it works through the voiceprint analysis to arrive at a new target spectrum for each sibilant sound rather than simply changing the amount of gain reduction. Shaping is linked to the chosen Color: raising it applies more spectral processing to the sibilant sound instead of broadband, uniform shaping.

  pure:deess shares its de-essing algorithm with smart:deess and belongs to the pure series, which pairs an intuitive interface with complex processing underneath. It is aimed at fast-paced mixing, mastering, film and video sound, and spoken-word work where a de-esser needs to drop into the chain and work immediately.
specs: |-
  - AI-powered detection of the source's sibilance characteristics, including separate target profiles for Z, Sh, Ch and T phonemes
  - Automatic parametrization for a natural sound
  - Single Suppression dial for the overall amount of de-essing
  - Color parameter with Soft, Balanced and Sharp settings
  - Shaping parameter linked to Color for spectral rather than broadband processing
  - Plug-in formats (Mac): VST, VST3, AU, AAX
  - Plug-in formats (Windows): VST, VST3, AAX
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok
  - Latency: approx. 70 ms
  - Apple Silicon support: native
  - Windows: Windows 10 (64 bit)
  - macOS: 10.14 or later
  - RAM: 4 GB
  - CPU: Intel Core (i5) or Apple Silicon
  - GPU: OpenGL version 3.2 or later
