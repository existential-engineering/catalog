description: pure:deess allows for easy de-essing. This audio plug-in removes
  the sharp edges from a vocal or speech recording for a smooth sound.
details: |-
  Simple de-essing for removing the sharp edges from a vocal or speech recording - get a smoother and more professional sound instantly without the risk of overthinking it. AI-powered detection and processing, automatic parametrization for a natural sound, and easy-to-use options to customize results.

  Thanks to its neural networks, it just takes a few seconds for pure:deess to analyze your vocal's sibilance. During that time, it builds a 'voiceprint' - a profile of the sibilance characteristics for that particular voice, ready to use as a target for how the voice should sound when balanced properly. And pure:deess doesn't just detect "Ess" sounds to build the profile, it computes the target profiles for Z, Sh, Ch and T phonemes individually, leading to a more natural sound that varies with the source content.

  Intuitive interface meets complex processing under the hood - that's what the pure series is all about and pure:deess is no exception. Simply use the main Suppression dial to increase or decrease the amount of suppression to fit your specific context, and refine the balance within the voice by ear. Solo voice-overs and sparse, intimate musical arrangements may require less reduction than busy, full-range mixes.

  Set the Color parameter to Soft, Balanced or Sharp to define the sound of sibilants in the voice. Rather than just affecting the gain reduction amount, pure:deess uses the 'voiceprint' analysis to arrive at a new target spectrum for each sibilant sound. The Shaping parameter is linked to the chosen Color. When increased, this feature performs more spectral processing to the sibilant sound rather than broadband, uniform shaping.
