description: HoRNet Magnus Lite is a free limiter and clipper each with their gain control, giving you complete control over the loudness of your audio
details: |-
  Magnus Lite is an ideal tool for musicians, podcasters, and audio engineers, offering precision and ease when shaping the sound of your audio. Whether you are producing music, creating podcasts, or working with audio in any other capacity, Magnus Lite offers professional-level features that cater to both beginners and experts. The plugin provides a free limiter and a clipper, each equipped with its own gain control, which gives you complete control over the loudness and dynamic range of your audio.

  The clipper's gain control adjusts the input level of the audio signal before it enters the clipper, which is essential in ensuring that you set the desired loudness without causing unwanted distortion. The clipper can be used to add warmth or intensity to your audio by controlling the level at which the signal starts to clip. On the other hand, the limiter's gain control ensures that your audio doesn't exceed a fixed threshold of -0.2dB, which ensures clear, distortion-free sound.

  Magnus Lite goes beyond basic audio processing by incorporating a release time control for the limiter. This feature allows you to adjust how quickly the limiter releases the gain reduction after the audio signal falls below the threshold. The release time can be fine-tuned to ensure that your audio maintains its natural dynamic flow while still staying within the desired loudness range.

  One of the standout features of Magnus Lite is its sleek and intuitive interface. The layout is clean, with all the essential controls easily accessible. The interface includes both a light mode and a dark mode, which automatically adjusts to match your operating system's settings.

  For those using modern hardware, Magnus Lite is compatible with both Windows and Mac operating systems. It requires Windows 10 or higher and macOS 10.13 or higher. The plugin is also natively compatible with Apple Silicon, which is a major advantage for those using newer Mac models with Apple's custom M1 or M2 chips.

  The HoRNet Magnus Lite has no copy protection, we don't believe in copy protection, they are always cracked and they are annoying for the users. So simply download the plugin and enjoy your recordings!
specs: |-
  - Brickwall limiter and clipper in one plugin
  - Gain control for the clipper and the limiter
  - Release time control for the limiter
  - Limiter fixed threshold of -0.2dB
  - Light and dark mode interface, automatically adjusting to your operating system's settings
  - Vector user interface which is sharp on every resolution
  - Apple Silicon native support
  - macOS (10.13 and later) and Windows (Windows 10 and later) support
  - 64-bit on Mac and Windows
  - Audio Units, VST, VST3 and AAX format
  - No copy protection
