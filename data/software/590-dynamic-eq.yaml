description: A dynamic eq with analog character the 590 is a 5 band dynamic eq,
  offering dynamic equalisation under mia laboratories' envelope detector
details: |-
  The 590 is a 5 band dynamic eq, offering dynamic equalisation under mia laboratories' envelope detector, based on the analogue envelope detector circuit. It features parallel band compression or expansion under double precision processing and can be operated in x4 oversampling.

  Colour and distortion can be applied to each band, delivering a characteristic analogue feel through tube or class-a - flavoured equalisation and a fine-tuned triode distortion algorithm.

  Each band of the 590 can be operated in compression or expansion mode, with attack and release times reaching up to 200 ms and 2.000 ms, respectively. Under the hood, our custom envelope detector, used in 925 and 409 compressors, utilises the classic feed-back topology, resulting in smoother and more "controllable" dynamic response. The user is able to select between more subtle or aggressive dynamic response, by switching between "slope" and "ratio" modes.

  The "colour" knob, coming from the musiqual eq series, applies a specific set of filters to enhance the harmonic and subharmonic frequencies, related to the selected main frequency. This creates a more natural and musical result, often accompanied by a profound change in timbre. Bands 1 and 2 utilise musiqual red, emulating the "slower" tube pre-amps, which tend to push sounds back - in terms of perceived depth of field. Bands 3 to 5 utilise musiqual blue, inspired by the "fast" class a pre-amps, which tend to bring sounds forward.

  The "distortion" knob emulates the corresponding harmonic distortion introduced by a triode vacuum tube amp when driven "hot". The user has control over the amount of distortion applied to the signal -without the need of additional gain stages-, easily achieving the characteristic analog feel.
