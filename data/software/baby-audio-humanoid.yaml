description: Humanoid by Baby Audio is an over-the-top pitch corrector and voice
  manipulation plugin (VST/AU/AAX) designed for extreme hard-tuning and radical
  effect processing.
details: |-
  Humanoid is a vocal transformer and hard-tuner plugin from Baby Audio that takes an entirely new approach to vocal processing. It combines pitch correction, vocoding, and wavetable synthesis into a single instrument, enabling extreme voice manipulation that goes far beyond traditional auto-tune effects.

  At its core, Humanoid features a smooth FFT-based re-tuning engine with automatic hard-tuning capabilities and full MIDI control for pitch manipulation. The plugin's proprietary phase-vocoding technology powers its voice resynthesis engine, allowing users to turn any vocal into a synthesizer with 64 factory wavetables or custom imported wavetables.

  The plugin offers high-fidelity formant shifting, resynthesis, and freeze effects, along with a comprehensive set of controls including Transform dial, Robotify, Quantize, key and scale selection, Gate, De-Ess, Smoothing, Attack, Hold, Note Range, and buffer size options.

  Humanoid ships with 281 factory presets crafted by leading sound designers, with an additional 101 presets added in the 1-year anniversary update.
specs: |-
  - Smooth FFT-based re-tuning engine with automatic hard-tuning
  - Full MIDI control for pitch manipulation
  - Proprietary phase-vocoding voice resynthesis engine
  - 64 factory wavetables with custom import support
  - High-fidelity formant shifting, resynthesis, and freeze effects
  - 281 factory presets plus 101 anniversary presets
  - Low-latency option for live performance
  - Native Apple Silicon M-Chip support
  - 64-bit only
