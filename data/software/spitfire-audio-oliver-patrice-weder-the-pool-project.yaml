details: |-
  Breathe new life into your compositions with this versatile toolkit of unique timbres, created by contemporary composer, Oliver Patrice Weder. For his second sample library, the expert sound curator has recorded a wide variety of instruments and techniques in the remarkable setting of a reverberant pool house — surrounded and inspired by nature. The sounds range from contemplative solo and trio vocal chants and breathy woodwind swells to personalised piano sounds, delicate percussion and shimmering organic and electronic loops — carefully sculpted to blend together seamlessly and complete with a range of bespoke controls, effects and reverbs. Adding a much sought-after human quality and fragility to your music, these transcendental textures are suited to intimate film scores and contemporary classical or ambient tracks alike.
specs: |-
  - 40 presets: Vocal Trio (6), Gentle Breeze (6), Solo Voice (7), Pianos (Double Felt and Taped), Toys (5), Percussion (4), Synth Loops (10)
  - 1.7 GB download size
  - 1.70 GB disk space required during install
  - 13 specially curated IR reverbs
  - Controls: Dynamics, Expression, Attack, Release, Reverb, Stretch, Distort, Variation, plus Key Release and Pedal on piano presets
  - Two piano sounds from a 1960s Petrof treated with felt and tape
  - Recorded in a reverberant pool house
  - macOS 11 to OS 26, minimum 2.8GHz quad-core i5 and 8GB RAM
  - Windows 10 or 11 (64-bit), minimum 2.8GHz quad-core i5 or Ryzen 5 and 8GB RAM
