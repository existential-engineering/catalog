description: Award-winning plugin suite for music composition featuring five connected plugins — Captain Chords, Captain Melody, Captain Deep, Captain Beat, and Captain Play — that work together inside your DAW to help write chord progressions, melodies, basslines, drum patterns, and play in-scale notes in real time. Includes 250+ bundled sounds powered by Phase Plant.
details: |-
  Captain Plugins is a suite of five connected composition plugins that sync chord progressions in real time across Captain Chords, Captain Melody, Captain Deep, Captain Beat, and Captain Play.

  Includes 250+ bundled sounds powered by Phase Plant synth technology. Drag-and-drop MIDI import for building on existing progressions. Rhythm presets inspired by world-class pianists with humanize controls (swing, strum, space).

  Roman numeral chord progression filtering by genre and style. Double/half-time playback. External VST synths can be used directly within Captain Chords.

  Version 7 (Epic 7) added curated presets, enhanced beat organization, improved song tabs, and an Explore chord progression browser. Compatible with Ableton Live, Logic Pro, FL Studio, Studio One, Cubase, Pro Tools.
versions:
