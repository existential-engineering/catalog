details: |-
  Captain Plugins is Mixed In Key's flagship music composition software, described on its product page as "The flagship for music composition" that lets producers "Add great chord progressions, melodies and bass to your music." It runs inside a DAW as a set of five connected plugins that write chords, melodies, basslines and drums, all in key and in sync with each other.

  Captain Chords is the harmonic core: it writes chord progressions, applies rhythms to them, sets the Key and Scale for the entire song, and offers "Magic Buttons" at the top of the screen for building progressions, with a bottom row of variations such as sus and extended chords. Complexity buttons add more note layers to thicken the sound, and octave and rhythm-speed controls (halve /2 or double x2) reshape the progression. Workspaces organise song sections such as verses and choruses and sync with the other Captain Plugins for playback.

  Captain Melody writes melodies that suit the chord progression, connects to the Chords plugin, applies rhythms and arpeggiators that move MIDI notes, and lets the user adjust the tension between chords and melody, with 100+ different sounds available. Captain Deep writes basslines that groove along with the chords and auto-adjusts whenever the chord progression changes. Captain Play maps four octaves of in-scale notes onto the computer keyboard or a MIDI controller, playing complex chords with a single key-press. Captain Beat mixes and matches rhythm patterns per channel with hundreds of drum sounds, a waveform visualiser, sophisticated MIDI editing, user samples, and advanced audio and MIDI export.

  The Epic 7.0 update, released in 2023, was built from user feedback and added curated and categorised presets, enhanced beat organisation in Captain Beat, redesigned song tabs, a Roman-numeral chord progression workflow filterable by Genre and Style, double and half time playback across every plugin, drag-and-drop MIDI import, a revamped rhythm presets menu, and Humanize controls for Space, Strum and Swing on both Mac and Windows.

  Sounds are powered by sampled instruments and Phase Plant, with 250 sounds bundled: 129 Keys patches, 118 Bass patches, 53 Leads and 79 Plucks, all customisable through macro knobs and a pop-out Sound Design interface. Third-party VST synths can be loaded directly inside Captain Chords, or driven via MIDI OUT. Finished parts render to audio or drag out as MIDI clips into the DAW. The software runs on Windows and Mac, including Apple Silicon.
specs: |-
  - 5 connected plugins: Captain Chords, Captain Melody, Captain Deep, Captain Play, Captain Beat
  - 250 built-in sounds powered by sampled instruments and Phase Plant
  - 129 Keys patches, 118 Bass patches, 53 Leads, 79 Plucks
  - Set Key and Scale for the entire song
  - Magic Buttons for building chord progressions, with sus and extended chord variations
  - Chord progression presets filterable by Genre and Style, shown in Roman numerals
  - Rhythm presets recorded from world-class pianists, applied to chords and basslines
  - Complexity buttons to add note layers and thicken the sound
  - Workspaces for organising song sections, synced across the plugins
  - Sync to positions on the DAW timeline
  - Double and half time playback, plus /2 and x2 rhythm speed controls
  - Arpeggiators and tension control between chords and melody
  - Basslines auto-adjust to follow chord changes
  - Play 4 octaves in any Key and Scale from computer keyboard or MIDI controller
  - Captain Beat: per-channel rhythm patterns, hundreds of drum sounds, custom sample import, waveform visualizer, MIDI editing
  - Humanize controls: Space, Strum and Swing
  - Import MIDI files, including drag and drop onto the canvas
  - Export as MIDI by dragging to the DAW, or render and export audio
  - Load third-party VST synths inside Captain Chords, or route via MIDI OUT
  - Save chord progressions as presets, including chords, rhythm or sound
  - Runs natively on Apple Silicon (M1, M2, M3)
  - Compatible with Ableton Live, Logic Pro, FL Studio, Studio One, Cubase and Pro Tools
  - Digital download
