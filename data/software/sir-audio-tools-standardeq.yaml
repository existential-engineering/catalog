description: "High-precision equalization plugin with various filter
  characteristics and a high-definition spectrum analyzer. Every filter can work
  in left/right/mid/side mode or process channels individually. Features
  intelligent peak detection for identifying resonant frequencies, oversampling
  for symmetric behavior and natural phase response, link gain/Q option, and
  multi-channel support for up to 8 channels."
details: |-
  Requires Windows 7 or newer, Mac OS 10.9 or newer. 30 MB hard disk space. Resizable and scalable interface with adjustable display range and colors. Preset manager and A/B compare switch.
specs: |-
  Plugin formats: VST, VST3, AudioUnit, AAX. Various filter characteristics. Left/Right/Mid/Side mode per filter. Multi-channel aware (up to 8 channels). Intelligent peak detection. Oversampling for symmetric behavior. Link gain/Q (proportional/inverse). High-definition spectrum analyzer. Preset manager. A/B compare switch.
