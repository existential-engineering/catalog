description: StandardEQ is a high-precision equalization plug-in offering various filter characteristics and a high-definition spectrum analyzer. It supports left/right/mid/side processing modes with up to 50 filters per instance.
details: |-
  StandardEQ is a high-quality equalizer plug-in built around 24 filter types based on Butterworth, Legendre, and Bessel characteristics. Up to 50 filters can be used per instance, giving engineers precise control over complex equalization tasks.

  The plug-in features a dual-engine spectrum analyzer that combines FFT analysis with an analog-style IIR analyzer. Intelligent peak detection assists in identifying resonant frequencies quickly, and mid/side stereo analysis is supported.

  Oversampling is available to improve precision and maintain a natural phase response. The interface is fully resizable and scalable, and includes a preset manager with A/B comparison for workflow efficiency.

  Multi-channel awareness supports up to 8 channels, and individual channel processing is available alongside linked left/right or mid/side modes.
specs: |-
  - 24 filter types (Butterworth, Legendre, Bessel characteristics)
  - Up to 50 filters per instance
  - Dual-engine spectrum analyzer: FFT + analog-style IIR
  - Left/right, mid/side, and individual channel processing modes
  - Intelligent peak detection for resonant frequency identification
  - Oversampling support
  - Multi-channel awareness (up to 8 channels)
  - Resizable and scalable interface
  - Preset manager with A/B comparison
  - 64-bit Intel (Windows + Mac), Apple Silicon native, 32-bit Windows
  - 200 MB disk space, 8 GB RAM; macOS 10.13+; Windows 11+
