description: Flagship woodwind instruments part of the acclaimed berlin series,
  Berlin Woodwinds raises the bar for detailed and true-to-life woodwinds.
details: |-
  Recorded on the teldex scoring stage, the sound is natural, rounded, and
  blends perfectly with other berlin series collections. Now available on sine,
  berlin woodwinds is the gold standard for professional sampled woodwinds.

  Multiple players per section allow you to devise complex voicings with
  individual players for each section and create custom ensembles or polyphonic
  woodwind chorales. Adaptive legato reacts to the playing speed, ensuring the
  right sound for fast runs as well as for expressive melodies.

  Multiple attack options provide an added degree of control, allowing you to
  choose between soft attack, immediate attack, and accented attack. Playable
  runs are recorded as very fast transitions, so that runs and arpeggios sound
  authentic.

  Berlin woodwinds is part of the acclaimed berlin series—the most
  comprehensive, integrated collection of sampled orchestral instruments
  available. All berlin series libraries were recorded with the finest
  musicians, in situ, on the same teldex scoring stage in berlin, designed for
  complete consistency across the series.
specs: |-
  - 12 individual instruments
  - Adaptive legato
  - Multiple attack options
  - Playable runs
  - Multiple players per section
  - 187 GB of samples
  - 54 GB sinearc compressed
  - 24-bit / 48 kHz patches
  - Mac OS 10.13
  - Windows 10
  - Intel core i5 or similar
  - 4 GB RAM minimum
  - 16+ GB RAM recommended
  - Sine player required
