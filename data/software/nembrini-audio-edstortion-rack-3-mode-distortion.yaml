description: Edstortion Rack is a 3-mode classic distortion plugin inspired by the legendary work of Eddie Kramer with Jimi Hendrix, Led Zeppelin, Rolling Stones, and The Beatles. It delivers an incredibly wide spectrum of tones from heavily compressed distortion to subtle crunch, with rack-format stereo processing features for modern music producers and engineers.
details:
  - Like the original acclaimed Eddie Kramer Edstortion Pedal by F-Pedals, the plug-in features 3 modes of classic distortion based on the legendary work of Eddie Kramer with Jimi Hendrix, Led Zeppelin, Rolling Stones, The Beatles, Traffic and so many more. With just a few knob tweaks you will be transported into the classic tones of the Golden Age of Rock.
  - Edstortion is a phenomenal tool with an attitude to rock that allows you to achieve an incredibly wide spectrum of tones from heavily compressed distortion to a very subtle crunch with great dynamic. The three distinct distortion modes cover a broad range of vintage rock character, from aggressive saturation to gentle harmonic enhancement.
  - The rack version expands on the original pedal design with professional studio features including independent left and right channel controls, Mid/Side encoding and decoding, and stereo spread control. These additions make it the perfect complement for any modern musician and producer looking for the ultimate vintage feel to add to their productions.
  - Additional processing features include Dry/Wet blending for parallel processing, an Analog Link function that introduces classic vintage vibe through channel offsetting, and a Phase Reverse switch offering 180-degree phase rotation on the wet signal. Input and Output level knobs provide versatility for matching levels across different signal chains and DAW environments.
specs: |-
  - Plugin formats: AU, VST2, VST3, AAX
