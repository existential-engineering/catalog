  - Intel compatible or Apple Silicon CPU
  - 1 GB RAM minimum
  - Current version: 1.0.12
  - Independent left/right channel controls with individual and global links
  - Dry/Wet blending of effected and dry signal
  - Mid/Side encoder/decoder
  - Stereo spread control
  - Analog Link for vintage channel offsetting
  - Phase Reverse (180° phase rotation for wet signal)
  - Input/Output level knobs
