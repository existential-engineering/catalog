description: The rack version of the Eddie Kramer Edstortion by F-Pedals, with 3 modes of classic distortion plus independent left and right channels, mid/side encoding, stereo spread and analog channel offset.
details: |-
  Like the original acclaimed Eddie Kramer Edstortion Pedal by F-Pedals, the plug-in features 3 modes of classic distortion based on the legendary work of Eddie Kramer with Jimi Hendrix, Led Zeppelin, Rolling Stones, The Beatles, Traffic and so many more.

  The Plug-in comes in two different versions, one in the shape and sound of the original pedal and one totally new, in a rack version packed with extra features and a sonic concept to serve primarily music producers and engineers. With just a few knob tweaks you will be transported into the classic tones of the Golden Age of Rock.

  Edstortion is a phenomenal tool with an attitude to rock that allows you to achieve an incredibly wide spectrum of tones from heavily compressed distortion to a very subtle crunch with great dynamic. Those classic tones will add amazing presence, space, flavour and vibe to any production in any style of music from Rock to Hip-hop and dance.

  The Edstortion Rack plugin is the perfect complement for any modern musician and producer looking for the ultimate vintage feel to add to their productions.

  Edstortion Rack features independent controls for left and right channels with individual and global links, Dry/Wet to blend the effected and dry signal, Mid/Side to activate a MID/SIDE encoder and decoder, Spread for widening the stereo image, Analog Link to add classic vintage vibe by offsetting the 2 channels, Phase Reverse to rotate the wet signal phase of both channels by 180 degrees, and INPUT/OUTPUT level knobs for maximum versatility.
specs: |-
  - Modelled on the Eddie Kramer Edstortion pedal by F-Pedals
  - 3 modes of classic distortion
  - Independent left and right channel controls with individual and global links
  - Dry/Wet blend
  - Mid/Side encoder and decoder
  - Spread control for the stereo image
  - Analog Link offsets the two channels for a vintage vibe
  - Phase Reverse rotates the wet signal phase of both channels by 180 degrees
  - INPUT and OUTPUT level knobs
  - Requires a VST2, VST3, AAX or AudioUnits compatible host
  - Intel compatible or Apple Silicon CPU, 1GB RAM
  - Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
