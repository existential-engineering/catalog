details: |-
  Collection for MPC by AIR Music Technology is a virtual instrument audio
  plugin for macOS and Windows. It functions as a VST plugin, an Audio Units
  plugin and an AAX plugin.

  This exclusive new collection is exclusively included at no cost inside the
  new mpc touch. The new mpc touch includes over $1000 worth of instruments and
  sounds.

  Included products: hybrid 3, loom, vacuum pro, velvet, xpand.2, minigrand,
  db33, theriser.
