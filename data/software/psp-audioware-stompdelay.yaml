description: PSP stompDelay is a creative delay plug-in designed to provide a wide range of sounds from lush analog tape delays through vibrant loops, to classic ping-pong delays and scratchy pitch shifts. It includes looper functionality (Infinity mode), continuous tap tempo, and accurate tape simulation.
details: |-
  PSP stompDelay offers diverse sound capabilities ranging from lush analog tape delays to vibrant loops, classic ping-pong delays, and pitch shifts. Features looper functionality via Infinity mode, continuous tap tempo, and accurate tape simulation including volume drop effects during fast forward and cueing.

  Named most creative effect plug-in of 2016 by Computer Music magazine. iLok License Manager required (no hardware dongle). 30-day trial available.
