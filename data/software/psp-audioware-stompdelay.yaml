description: PSP stompDelay is a creative delay plug-in designed to provide a wide range of sounds from lush analog tape delays through vibrant loops, to classic ping-pong delays and scratchy pitch shifts. It includes looper functionality (Infinity mode), continuous tap tempo, and accurate tape simulation.
details: |-
  PSP stompDelay is a creative delay plug-in designed to provide a wide range of sounds from lush analog tape delays through vibrant loops, to classic ping-pong delays and scratchy pitch shifts. It features both traditional delay effects as well as a looper when in “infinite operation mode” (Infinity mode). PSP stompDelay offers continuous tap tempo, as well as accurate tape simulation, including simulating the volume drop that occurs when fast forwarding or cueing the tape.

  In order to run PSP stompDelay in 30-day trial mode or activate it, you need an iLok user ID which you can create for free at www.ilok.com, and you need to install the free iLok License Manager application but you don't need any hardware dongle.

  You can activate the license in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above). You can move these licenses at any time using PACE's iLok License Manager software.
specs: |-
  - Creative delay covering analog tape delays, loops, ping-pong delays and pitch shifts
  - Infinity mode: infinite operation mode that turns the delay into a looper
  - Continuous tap tempo
  - Tape simulation including the volume drop that occurs when fast forwarding or cueing the tape
  - 64-bit AudioUnit, VST, VST3 and AAX (Pro Tools) plug-in formats
  - Windows 7 to Windows 11
  - macOS 10.14 to macOS 15 Sequoia, Intel and Apple Silicon
  - iLok authorization: iLok user ID and iLok License Manager required, no hardware dongle needed
  - License can be activated in 3 separate locations (computer or iLok dongle, 2nd generation or above)
  - 30-day trial available for macOS and Windows
