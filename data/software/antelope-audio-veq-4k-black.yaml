details: |-
  VEQ-4K BLACK is a 4-band equalizer with high-pass and low-pass filtering, modeled after a classic console EQ module.

  Likely the most popular version of the EQ module, this unit was designed following the recommendations of many of the world's top engineers. The 'original black' features a louder EQ with +/-18dB cut/boost and a steeper High Pass cut off slope (18dB).

  Runs natively in your DAW on macOS or Windows, or in real-time on your Synergy Core interface.

  Available as an individual purchase or included with an Antelope Cosmos subscription, which unlocks all 75+ Antelope Native Plugins.
specs: |-
  - 4-band EQ with HPF/LPF
  - +/-18dB cut/boost range
  - 18dB high-pass filter slope
  - Native operation in macOS and Windows DAWs
  - Real-time processing on Synergy Core hardware
  - Included with Antelope Cosmos subscription (75+ plugins)
