description: DialogueEnhance automatically cleans, balances and levels speech
  recordings, ideal for podcasts, video and fast content workflows.
details: |-
  DialogueEnhance is an intelligent automatic speech processing tool that improves recording quality without requiring manual parameter adjustment. It removes background noise, then automatically applies EQ and compression to make recordings sound professional.

  The plugin combines a noise reduction module with automatic spectral correction, dynamics control, and loudness boost to a target LUFS level, useful whether an interview was recorded in a noisy environment or with a cheap microphone.

  Compatible with Pro Tools, Cubase, Nuendo, Reaper, Ableton Live, Logic Pro, Adobe Premiere, Final Cut, and DaVinci Resolve.
