description: Automatically clean, balance and level speech recordings. Perfect
  for podcasts, video and fast content workflows.
details: |-
  DialogueEnhance is an intelligent automatic speech processing tool. You can
  use it to easily enhance the quality of your speech recordings without having
  to adjust many parameters. No matter if you recorded an interview in a noisy
  environment or with a cheap microphone, DialogueEnhance will remove the
  background noise and automatically apply an EQ and Compressor to make your
  recording sound professional.

  A useful tool for podcast and video editors!

  Features include automatic estimation, intelligent adaption, automatic
  compression, and automatic level adjustment.

  Compatible with Pro Tools, Cubase, Nuendo, Reaper, Ableton Live, Logic Pro,
  Adobe Premiere, Final Cut, and DaVinci Resolve.
specs: |-
  - Audio Channels: Mono, Stereo
  - Formats: VST3, AU, AAX
  - Sample Rates: 44.1kHz, 48kHz, 88.2kHz, 96kHz, 192kHz
  - Automatic noise removal
  - Automatic EQ and compression
  - Automatic level adjustment
  - Licensing: Serial key
  - Apple Silicon native support (Universal Binary)
