description: The first and only officially endorsed software recreation of the legendary Maselec MLA-4 hardware unit, developed in direct collaboration with Leif Mases. A triband compressor/expander designed for mixing, mastering, and stem processing.
details: |-
  The Maselec MLA-4 Triband Compressor/Expander is the first and only officially endorsed software recreation of the legendary hardware unit, developed in direct collaboration with Leif Mases. Designed for mixing, mastering, and stem processing, the MLA-4 delivers natural, musical dynamic shaping with precise multiband control, now enhanced with modern workflow features only possible in software.

  With compression (up to 6:1) and expansion (down to 1:2) per band, the plug-in can tighten low-end boom while lifting air in the highs, or recover lost transients from an over-processed mix, all in real time. Per-band threshold, ratio, attack, and release controls allow compression and expansion to work in harmony without unwanted pumping, dulling, or overcorrection.

  A five-mode sidechain linking system adapts compression and expansion behaviour to the material. Full linking provides full-band cohesion, independent bands provide surgical control, and the in-between modes let low frequencies shape mid and high-band compression and expansion while maintaining clarity.

  Auto Spectral Balance applies independent gain compensation to the low, mid, and high bands so heavy processing in one band does not throw off the balance of the mix, and an Auto Level option lets the user choose between preserving tonal balance or reshaping it. Per-band THD control decides exactly where harmonic colour is introduced rather than applying distortion across the whole spectrum.

  Monitoring goes beyond the original hardware with per-band solo and left/right cut functions. Left and right cut focus on a single channel's contribution to the processing, while per-band soloing isolates lows, mids, or highs to hear how compression or expansion is affecting each frequency range.
specs: |-
  - Triband compressor/expander modelled on the Maselec MLA-4 hardware, endorsed and developed with Leif Mases
  - Compression up to 6:1 and expansion down to 1:2 per band
  - Per-band threshold, ratio, attack, and release controls
  - Five-mode sidechain linking system
  - Auto Spectral Balance with independent per-band gain compensation
  - Auto Level
  - Per-band THD (harmonic distortion) control
  - Per-band solo monitoring
  - Left and right input cut monitoring
  - Phase-coherent multiband processing
  - Hand-crafted factory presets
  - Mac: OS X 10.15 or higher, Intel or M1 processor, 2GB RAM, 64-bit only
  - Windows: Windows 10 or higher, Core 2 or higher, 2GB RAM, 64-bit only
  - Compatible hosts: Logic Pro 10.x (Mac), Pro Tools 11.3.2 and up, Cubase 9.5 and up, Nuendo 8 and up, Live 9 and up
  - No hardware dongle required: local computer authorization or iLok USB key (V2 or above), free PACE iLok account needed for activation
