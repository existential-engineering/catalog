description: "An officially endorsed software recreation of the legendary
  Maselec MLA-4 triband compressor/expander, developed in collaboration with
  Leif Mases. Delivers natural, musical dynamic shaping with precise multiband
  control, featuring auto spectral balance, per-band THD control, compression up
  to 6:1 and expansion down to 1:2, and a five-mode sidechain linking system."
details: |-
  1.1

  Auto Spectral Balance
  Per-band THD (harmonic distortion) control
  Compression (up to 6:1) and expansion (down to 1:2) per band
  Five-mode sidechain linking system
  Per-band solo and left/right cut monitoring
  Independent channel monitoring
  Advanced monitoring options
  Hand-crafted factory presets

  PACE iLok account required (dongle optional)
