description: The first and only officially endorsed software recreation of the legendary Maselec MLA-4 hardware unit, developed in direct collaboration with Leif Mases. A triband compressor/expander designed for mixing, mastering, and stem processing.
details: |-
  The Maselec MLA-4 is a triband compressor/expander plugin developed in direct collaboration with Leif Mases, the designer of the original hardware unit. It is the first and only officially endorsed software recreation of the legendary Maselec MLA-4 hardware, which retails for approximately $10,000 new.

  The plugin features Auto Spectral Balance, a proprietary algorithm that preserves the overall tonal integrity of a mix while dynamics processing is applied across the three frequency bands. This allows for transparent dynamic control without shifting the perceived spectral balance of the source material.

  Per-Band THD Control enables selective harmonic enhancement on a band-by-band basis, allowing engineers to add saturation characteristics inspired by the analog hardware. Each band supports compression up to 6:1 and expansion down to 1:2 ratios.

  A five-mode sidechain linking system gives users precise control over inter-band relationships and transient behavior, while per-band solo and left/right cut monitoring facilitate detailed surgical adjustments. Auto Level functionality helps maintain consistent output levels during processing.

  Authorization is handled via PACE iLok, which can be tied to a local computer license or a physical iLok USB key (V2 or higher). No hardware dongle is required if using computer-based authorization.
specs: |-
  - Triband compressor/expander architecture
  - Compression up to 6:1 per band
  - Expansion down to 1:2 per band
  - Auto Spectral Balance algorithm
  - Per-Band THD (Total Harmonic Distortion) control
  - Five-mode sidechain linking system
  - Per-band solo monitoring
  - Left/right cut monitoring per band
  - Auto Level functionality
  - 64-bit only
  - macOS: 10.15 or higher, Intel or Apple Silicon M1+, 2 GB RAM
  - Windows: Windows 10 or higher, Core i7 8th-gen+ or AMD Ryzen 5+, 2 GB RAM
  - DAW compatibility: Logic Pro 10.x+, Pro Tools 11.3.2+, Cubase 9.5+, Nuendo 8+, Ableton Live 9+
  - Authorization: PACE iLok (computer license or iLok USB key V2+)
