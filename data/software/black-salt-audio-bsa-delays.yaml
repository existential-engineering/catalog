description: BSA Delays strips away the clutter and gives you everything you actually need to make delay sound incredible. From tight slapbacks to atmospheric tails, every mode is hand-tuned for instant inspiration.
details: |-
  BSA Delays strips away the clutter and gives you everything you actually need to make delay sound incredible. From tight slapbacks to atmospheric tails, every mode is hand-tuned for instant inspiration. Shape, saturate, and widen your delays with ease and never waste time chasing the perfect delay again.

  Curated delay modes: distinct, hand-tuned delay styles crafted to sit perfectly in a modern mix, so you can instantly jump between vibes.

  Instant depth and dimension: transform simple repeats into lush, immersive echoes using a built-in reverb, blending subtle ambience or pushing further for rich, cinematic textures.

  Character on demand: adds tape-style warmth and saturation (Drive) to repeats, giving modern digital tracks analog soul and grit.

  Wider, more impactful sound: a single-click Wide button expands the stereo image for instruments, adding width, clarity, and a more expensive-sounding finish.
specs: |-
  - Hand-tuned delay modes, from tight slapbacks to vocal pockets
  - Tempo-synced delays or manual time control, interface adapts to the selected mode
  - Repeats control adjusts how many times the delay repeats
  - Built-in reverb adds space and depth to the delay signal
  - Drive saturation adds analog-style warmth, grit, and character
  - Wide button for instant stereo spread
  - Low and High cut filters to shape delay tone
