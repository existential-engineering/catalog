details: |-
  JST X-Repeater - Effortless Stutters, Endless Possibilities
  Overview
  Introducing X-Repeater, the plugin designed to add bold, attention-grabbing glitches and stutters to any track with ease. Whether you’re crafting intricate beats, enhancing vocals, or designing flawless transitions, X-Repeater gives you intuitive control and endless creative freedom. Perfect for music creators who want to explore new sonic territories, this plugin transforms ordinary audio into unforgettable moments with minimal effort. From subtle rhythmic shifts to intense stutters, X-Repeater seamlessly fits into your workflow, giving you the power to shape your sound without limits.
  New features have been added with the v1.0.1 update, adding a dynamic effects section where you can stack and re-order the distortion modes, and Repeater Length for each Repeater module.
  Hear it In Action
  Check out these audio examples to experience the unique impact of X-Repeater on various tracks. You can create anything from subtle transitions to chaotic transformations, X-Repeater gives you every tool you need to build authentic sounding glitch effects, giving your tracks a taste of the digital age.
  Features – Control the Chaos with X-Repeater
  Effortless Stutter Creation - Automate Glitch Effects in Seconds
  Add authentic crackles, hisses, and with five BPM-synced repeater lanes, X-Repeater allows you to create stutter and glitch effects instantly, without the hassle of manual editing. Simply load X-Repeater onto your track, choose your preferred time length, and let the plugin do the heavy lifting. Design anything from subtle rhythmic chops to bold, chaotic stutters. X-Repeater makes it effortless to create the perfect effect.
  Dynamic Pitch Shifting - Add Edge with Real-Time Pitch Control
  X-Repeater’s built-in pitch-shifting feature allows you to easily adjust the pitch of your stutters from -12 to +12 semitones, giving your effects excitement and variation. You can add subtle timbral shifts or dramatic pitch changes, this control is perfect for adding tension, excitement, and movement to any track.
  Three Distinct Distortion Modes - Shape Your Sound with Grit and Aggression
  Enhance your audio with three unique distortion flavors: Digitized, Hardcore, and Lofi. These options let you dial in the perfect amount of grit, anywhere from subtle warmth to extreme digital destruction. Add subtle character to your stutters, or go all out with an aggressive, bitcrushed sound that cuts through any mix. You can also stack and re-order these distortion effects at will!
  Instant Control at Your Fingertips - Automate and Trigger Effects in Real Time
  With X-Repeater, you can assign triggers to your MIDI controller for real-time performance. Automate effects seamlessly or control them with the push of a button, whether you’re performing live or refining your track in the studio. The on-the-fly speed adjustment lets you create effects in seconds, perfect for adding dramatic transitions and creating tension.
  Efficient, Seamless Workflow - Create Without Complication
  X-Repeater was built from the ground up to seamlessly fit into your workflow. With easy-to-use pitch control, 5 repeater modules, 3 distortion modes, and more, you can harness your creativity all within one window. No more searching through your plugins folder for effects or figuring out which distortion sounds best, and definitely no cutting and arranging audio. Just simple controls, tailored effects, and results in seconds
  Light On Your System - More Is More
  Designed with optimization in mind, X-Repeater delivers versatile audio processing capabilities without overwhelming your CPU. This efficiency is vital for ensuring your projects run smoothly, especially when using multiple instances of the plugin in complex projects.
  Bend Time, Build Chaos, Break Boundaries
  X-Repeater offers next-level control for sound designers, producers, and engineers who need their glitch effects to stand out. It’s not just about creating stutters, it’s about sparking the listener’s curiosity with unique and authentic sound effects. No matter what chaotic digital effect you have in mind, X-Repeater brings your vision to life every single time. Let X-Repeater handle the heavy lifting, so you can focus on creating standout moments in your tracks, all while maintaining system performance and workflow efficiency.
  Saving and Managing Presets
  Explore Factory Presets: Broken down by category and/or use-case, these pre-made presets can be really helpful for quick results and exploring the plugin.
  Create Custom Presets: Save your finely tuned settings as new presets for future sessions, ensuring quick recall of your signature sounds.
  Share & Download User Presets: Check online for other users’ presets in the Joey Sturgis Tones forum on Facebook!
