description: A gritty free compressor plugin with three release modes and an
  adjustable sidechain highpass filter for punch and edge.
details: |-
  XTMax may be XTComp's (Plugin Alliance little brother), but it's more than capable to stand on his own for any mix! Make your drums explode with this renowned gritty compressor, and use its 3 release modes to add edge and punch to your mix. Plus - using the adjustable SC-HPF makes NUKE super versatile for nearly any compression scenario! Supported Plugin Formats

  Minimum System Requirements:

  The XTMax was developed by Kiive Audio using its own modeling techniques, and one of the products studied was the DISTRESSOR by Empirical Labs which is not affiliated with Kiive Audio. Empirical Labs has not licensed any intellectual property for use in the XTMax, nor has it endorsed or supported the XTMax in any manner.
specs: |-
  - Mac 64bit / M1 Native: VST3, AU, AAX
  - Windows 64bit: VST3, AAX
  - 1 GHz Intel Dual Core Processor or AMD equivalent (PC)
  - 4GB of RAM
  - Mac OS X 10.7 or higher, 10.14 or higher recommended
  - Windows 7 & Above
  - Screen res: 1024 x 768 or higher
  - 64 bit DAW support only
