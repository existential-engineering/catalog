description: "Combined vacuum tube amplification and magnetic tape recording
  modeling plugin delivering analog character from subtle harmonic enhancement
  to intense distortion. Features 9 tube circuit models (5751, 6L6, EL34,
  12AX7), 4 analog tape models (2 Track, C90), opto-style compressor/limiter,
  1960s-style ladder filter with self-oscillating resonance, Tiltshift
  equalizer, level-compensated input drive, and HQ Mode."
details: |-
  2 pages

  9 tube circuit models: 5751 (Lo/Med/Hi), 6L6 (Lo/Med/Hi), EL34 (Lo/Hi), 12AX7
  4 analog tape models: 2 Track (Hi/Lo), C90 (Hi/Lo)
  Opto-style compressor/limiter
  1960s-style ladder filter with self-oscillating resonance
  Tiltshift equalizer built in
  Level-compensated input drive
  HQ Mode
  Novel emphasis section for targeted saturation
  Bias controls for tube and tape harmonic shaping
