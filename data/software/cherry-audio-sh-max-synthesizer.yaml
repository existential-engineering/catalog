details: |-
  SH-MAX is Cherry Audio's unique blend of three remarkable SH-series
  synthesizers from the 1970s: the SH-5, SH-7, and SH-3A. Cherry Audio took
  the undeniably bold sound of the SH-5, combined it with the best features
  from the other models, and infused it with even more power and versatility.
  With its assertive tone and stunning interface, SH-MAX promises to transform
  your studio experience.

  SH-MAX reproduces the SH-5's dual oscillators, two LFOs, parallel filter
  sections, ring modulator, and sample and hold functionality, enhanced with the
  SH-7's autobend, duophony, filter FM, and syncable VCOs, plus the SH-3A's
  additive-style oscillator. Additional features include expressive capabilities
  from the SH-2000 and a sequencer influenced by the Model 104.

  The powerful SH-style mixer includes stereo functionality and offers signal
  routing options comparable to those of a modular synthesizer. Each source is
  independently routable to the Voltage Controlled Filter, Bandpass Filter, or
  Voltage Controlled Amplifier, each with its own independent effects chain.

  SH-MAX includes 20 studio-quality effects that can be arranged and reused
  within its four effect chains. Producers will find immediate inspiration in
  the extensive preset library of over 300 presets organized into 14 categories,
  curated by veteran sound designers James Terris and Andrew Longhurst.
specs: |-
  - Dual oscillators based on the SH-5 architecture
  - Five sound sources: VCO-1, VCO-2A, VCO-2B, Ring Modulator, and Noise
  - Two parallel filter sections: Multimode and dedicated bandpass filter
  - Monophonic, duophonic, unison, and 16-voice polyphonic modes
  - Two tempo-syncable LFOs with retrigger options
  - Sample and hold, ring modulator, autobend, vibrato, and portamento
  - Two full ADSR envelopes per layer with velocity and loop options
  - Flexible signal routing to filters or VCA bypass
  - Adjustable VCO, VCF, VCA drift and EG slop for analog character
  - Four-slot touch effects inspired by SH-2000 with 47 assignable destinations
  - Four-channel step sequencer with up to 16 steps each and chaining
  - Four independent customizable effects chains with 20 studio-quality effects
  - Three retro interface themes reflecting SH-3A, SH-5, and SH-7 aesthetics
  - Over 300 professionally designed presets in 14 categories
  - User-adjustable oversampling control
  - Complete MIDI control and DAW automation
  - Focus zoom-in feature, UI zoom, and resize capability
