description: "SH-MAX is Cherry Audio's fantastic fusion of three remarkable
  SH-series synthesizers from the 1970s: the SH-5, SH-7, and SH-3A. But SH-MAX
  is far from a first-time emulation of these classic instruments in software."
details: |-
  SH-MAX is Cherry Audio's unique blend of three remarkable SH-series synthesizers from the 1970s: the SH-5, SH-7, and SH-3A. It takes the bold sound of the SH-5, combines it with the best features from the other models, and adds more power and versatility.

  SH-MAX reproduces the vibrant sounds and essential features of the SH-5, including its powerful dual oscillators, two LFOs, the parallel filter sections (multimode and bandpass), ring modulator, and sample & hold functionality. It is enhanced with elements from the SH-7, such as autobend, duophony, filter FM, and syncable VCOs with extra waveforms, plus the additive-style oscillator from the SH-3A for greater flexibility. It also incorporates a touch of the expressive capabilities inspired by the SH-2000, along with a classic sequencer influenced by the Model 104, and three retro interface themes reflecting the distinct aesthetics of the SH-3A, SH-5, and SH-7.

  What stands out about the SH-MAX is the distinctive personality of its filters, which can quickly shift from warm analog tones to aggressive sounds. It excels at producing raw, powerful timbres that cut through a mix without the need for additional effects. Optional drift and slop controls for the oscillators, filters, amp, and dual envelope generators lend additional analog vibe.

  The SH-style mixer includes stereo functionality and offers signal routing options comparable to those of a modular synthesizer. Each source (VCO-1, VCO-2A, VCO-2B, Ring Mod, and Noise) is independently routable to the Voltage Controlled Filter (VCF), Bandpass Filter (BPF), or Voltage Controlled Amplifier (VCA), each with its own independent effects chain. SH-MAX includes 20 studio-quality effects that can be arranged and reused within its four effect chains.

  SH-MAX can be played as a classic mono or duophonic synthesizer, layered for unison, or run with 16 voices of polyphony. The Touch Effects panel features four assignable controls and supports polyphonic aftertouch. A four-channel step sequencer runs patterns of up to 16 steps in parallel or chains them in 32 or 64-step cycles, and the preset library holds over 300 presets curated by sound designers James Terris and Andrew Longhurst.
specs: |-
  - Software virtual instrument plugin based on the sound and features of the SH-5, SH-7, and SH-3A synthesizers of the 1970s
  - Three interface themes, each reflecting the distinct aesthetics of the SH-3A, SH-5, and SH-7
  - Highly optimized voicing architecture with monophonic, duophonic, unison, and 16 voice polyphonic modes
  - Five sound sources: VCO-1, VCO-2A, VCO-2B, Ring Modulator, and Noise
  - Two parallel filter sections: Multimode with lowpass, bandpass, and highpass, and a separate dedicated bandpass filter
  - Two tempo-syncable LFOs with retrigger options
  - Sample/Hold, ring modulator, autobend, vibrato, and portamento
  - Two full ADSR envelopes per layer with velocity and loop options
  - Flexible signal path options allow individual sound routing to either or both filters, or bypass them directly to the VCA
  - Adjustable VCO, VCF, and VCA drift, and EG slop for a more analog vibe
  - Over 300 professionally designed presets in 14 categories
  - Comprehensive touch effects inspired by the SH-2000 with four slots and click-to-assign functionality with 47 destinations controlled by channel or polyphonic aftertouch with compatible controllers
  - Syncable, transposable and chainable step sequencer (four channels, up to 16 steps each) inspired by the Model 104 with start, stop, audition, and humanize options, DAW clock and step synchronization, and MIDI output to compatible DAWs
  - Four independent customizable effects chains, one for each of the three signal paths plus a global layer, with an individual effects modulator for each layer
  - 20 studio-quality effects: BBD Flanger, Compressor, Digital Delay, Digital Reverb, Distortion & EQ, Dual Delay, Dual Ensemble, Dual Phaser, Envelope Filter, Flanger & Chorus, Galactic Reverb, Lo-Fi, Lushverb, Ring Modulator, Seven Band EQ, Spring Reverb, Tape Echo, DCO Chorus, Panner, and Pulser
  - Persistent effects quick controls for on/off, solo, bipolar modulator amount slider, and dry/wet mix for each effect, plus global FX on/off, level, and stereo expand
  - Standalone virtual instrument and plug-in versions included (AU, VST, VST3, AAX)
  - User-adjustable oversampling control
  - Complete MIDI control and DAW automation for all controls, with MIDI learn and mapping (Preset and Global)
  - Focus zoom-in feature, as well as standard UI zoom and resize via drag
  - Complete documentation available directly online from the instrument or in downloadable PDF format
  - macOS requirements: macOS 10.13 or above, 64-bit required, Intel or Apple Silicon processor, 3.4 GHz Quad-Core or Apple Silicon CPU with 8GB of RAM recommended, 210 MB hard disk space
  - Windows requirements: Windows 7 or above, 64-bit required, 3.4 GHz Quad-Core computer with 8GB of RAM recommended, 210 MB hard disk space
  - Internet connection is required for product activation
