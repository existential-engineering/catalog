description: HOFA DDP Player lets you play, check and burn DDP images, view CD-Text, ISRC and UPC codes, and monitor peak and EBU loudness on PC and Mac.
details: |-
  The HOFA DDP Player is a professional tool with which you can easily play, check and burn DDP images to CD.

  In addition, CD text and other metadata such as ISRC and UPC codes embedded in the DDP image are displayed for you to check.

  Peak and EBU loudness meters and a goniometer are also available.

  Please note: If you want to create individual DDP players for your customers and send them to them, you need the HOFA DDP Player Maker.

  HOFA DDP Player is also available in the Mac App Store.
specs: |-
  - Additional formats for audio file export: WAV, AIFF, FLAC, Ogg-Vorbis, MP3 (new in V2)
  - CD-Text info is embedded into exported WAV and MP3 files (new in V2)
  - Track transition playback function (new in V2)
  - Support for multisession CDs (new in V2)
  - Revised GUI with scalable font size (new in V2)
  - Playback DDP-Images for audio CDs
  - Burn DDP images to CD
  - Export tracks as WAV audio files
  - ISRC in WAV files
  - CD-Text, UPC/EAN and ISRC
  - Support of Japanese CD-Text
  - Peak and EBU Loudness Meter
  - Goniometer
  - MD5 checksum validation
  - Easy to use, clear GUI
  - Support for PC and Mac, 32 and 64 Bit
  - English and German version available
  - Operating System: macOS 10.13 or later, Windows 10 or later
  - Two licenses per purchase, managed via the HOFA Plugins Manager, offline activation and USB stick licensing supported
  - 14 days free trial
