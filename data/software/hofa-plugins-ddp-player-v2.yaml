description: DDP Player V2 is a standalone tool to play back, check and burn DDP
  images to CD on Mac and PC. It displays embedded CD-Text and metadata such as
  ISRC and UPC codes, exports tracks to WAV, and includes peak and EBU loudness
  meters and a goniometer.
details: |-
  The HOFA DDP Player is a professional tool with which you can easily play, check and burn DDP images to CD. In addition, CD text and other metadata such as ISRC and UPC codes embedded in the DDP image are displayed for you to check. Peak and EBU loudness meters and a goniometer are also available. Please note: If you want to create individual DDP players for your customers and send them to them, you need the HOFA DDP Player Maker . HOFA DDP Player is also available in the Mac App Store . Features V2.0.4: new in V2 additional formats for audio file export: WAV, AIFF, FLAC, Ogg-Vorbis, MP3 CD-Text info is embedded into exported WAV and MP3 files track transition playback function support for multisession CDs revised GUI with scalable font size playback DDP-Images for audio CDs burn DDP images to CD export tracks as WAV audio files ISRC in WAV files CD-Text, UPC/EAN and ISRC support of Japanese CD-Text peak and EBU Loudness Meter goniometer MD5 checksum validation easy to use, clear GUI support for PC and Mac, 32 and 64 Bit English & German version available
