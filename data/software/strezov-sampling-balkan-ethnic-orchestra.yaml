description: Balkan Ethnic Orchestra is a highly unique and fresh sounding
  collection giving you access to a huge amount of eastern european soloists.
details: |-
  Every instrument inside this collection was recorded with the same attention
  to detail than our other libraries, featuring multiple mic positions,
  different short and long articulations, expressive phrases, true polyphonic
  legato and various ensemble sizes.

  Recorded at sofia session studio using high-end recording equipment and the
  same approach towards liveliness and realism as our next generation choir
  series, balkan ethnic orchestra provides inspiration from the roots.

  Over 40 of the finest ethnic folklore soloists from the balkans (wind, bowed
  and plucked string and brass instruments, vocal quartet and percussion
  soloists) with various ornamented short and long articulations including
  multiple true legato recordings.

  True polyphonic legato ethnic quartet choir featuring agile legato for 10
  syllables in three different speeds, special layer of 'shake' sustain singing
  for all patches and the syllabuilder version 3 from the next generation choir
  series. Full deeply sampled balkan brass band. Special percussion section
  featuring ethnic percussion players using the x3m percussion engine.
specs: |-
  - Kontakt player
  - Multiple mic positions
  - True polyphonic legato
  - Agile legato
  - Syllabuilder version 3
  - X3m percussion engine
  - NKS compatible
  - Custom convolution reverb
