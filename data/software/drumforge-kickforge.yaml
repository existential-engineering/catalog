description: Kickforge is a fully automatable kick drum creation plugin that layers premixed kick attacks and kick subs into over 2,900 combinations, with per-channel filtering, harmonics, sustain control, and a built-in mixer section.
details: |-
  Kickforge is a virtual instrument audio plugin built around a single job: constructing a kick drum that stands out in a modern mix. It combines a collection of premixed kick attacks with a collection of kick subs, and the two are selected independently, which yields over 2,900 unique kick drum combinations. The source sounds were recorded in a world-renowned studio, then crafted and tested in real-world mixes to deliver punch, detail, and clarity.

  Tone shaping happens through independent channel filtering, a harmonics switch that injects harmonic density into the low end, sustain control per sample, and a custom-designed mixer section carrying EQ, compression, and transient processors. Every parameter is automatable. Multi-samples are used by default for realistic acoustic kicks, and a One-Shot switch swaps to a more aggressive behaviour suited to heavier styles.

  The instrument ships with Drumforge's Factory Library alongside guest sample and preset packs. Vorso contributed a sample and preset pack aimed at drum and bass and halftime bass music, with many sounds synthesised from sine waves and then vocoded, phase distorted, or otherwise transformed. Atrium Audio's Grant and Carson, producer Kane Churko, and Prince Fox each contributed preset banks covering EDM, rock, metal, and industrial territory.

  An iLok account is required for licensing, though no dongle is needed. iLok Cloud is not supported.
specs: |-
  - Fully automatable kick drum creation tool for crafting unique kick sounds
  - Individually selectable attack and sub samples yielding over 2,900 kick drum combinations
  - Includes both acoustic and electronic kick drum samples
  - Mixing processors for EQ, compression and transient shaping
  - Per-sample sustain control and filtering to remove unwanted frequencies
  - Harmonics switch adds harmonic density to the low end
  - Multi-sampled acoustic kicks by default, with a One-Shot switch for a more aggressive response
  - Producer presets spanning EDM to death metal, plus user-created presets
  - 13 Natural Acoustic Subs, 40 Electronic Subs, 24 Multi-sample Natural Acoustic Tops, 32 Electronic One-shot Tops
  - Vorso Sample & Preset Pack: 30 Presets for Drum & Bass, 20 Top and Transient Samples, 20 Body Layer Samples
  - Atrium Audio Presets: 9 presets useable for EDM, Rock, and Metal
  - Kane Churko Presets: 10 presets for Rock, Metal, EDM, and beyond
  - Prince Fox Presets: 9 presets for use in EDM productions
  - Apple Silicon native compatible including M4
  - An Intel or AMD computer and compatible DAW
  - Requires a free iLok account, no dongle required (iLok Cloud not supported)
