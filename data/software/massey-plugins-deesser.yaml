description: A sibilance reduction plugin with a dynamic threshold algorithm that ensures consistent reduction regardless of vocal dynamics. Features band-split option, dry-wet control for ratio shaping, multiple listen modes (invert/filtered), and hidden extra controls for response, speed, re-ess, and output trim.
details: |-
  Reduction
  Frequency
  Band-Split
  Dry-Wet/Ratio
  Listen Mode
  Response (X/V/D)
  Speed
  Re-Ess
  Output Trim

  Dynamic threshold algorithm for consistent sibilance reduction
  Band-split option with linear phase filter
  Dry-wet control for compression ratio reshaping
  Two listen modes: Invert and Filtered
  Auto/On/Off listen activation
  Response modes optimized for vocals (X, V) and drums (D)
  Re-ess mode for sibilance accentuation

  Session-restore, automation, preset support, multi-mono support
