description: "Specialized low-frequency filter addressing predominantly
  inaudible low-frequency regions of a mix. Operates in minimum and mixed phase
  modes with variable filter slope control, dry mix options, and creative energy
  compensation methods."
details: |-
  Version 1.1.1. Minimum phase and mixed phase operation. Continuously variable filter slope. Energy compensation options including Dynamic Bump mode and Harmonic generators. Highly precise low frequency spectrum analyzer down to DC. Subwoofer channel creation. Inv mode inverts filter to low-pass. Low Clamp option with distortion-shielded clipper. ECO mode. Freely resizable hardware-accelerated UI with full-screen capability.
specs: |-
  Windows Vista or above. Mac OS X 10.9 or above. VST2, VST3, Audio-Unit, or AAX compatible plugin host. Windows 32-bit: VST2, VST3. Windows 64-bit: VST2, VST3, AAX. Mac 32-bit: VST2, VST3, AU, AAX. Mac 64-bit: VST2, VST3, AU, AAX.
