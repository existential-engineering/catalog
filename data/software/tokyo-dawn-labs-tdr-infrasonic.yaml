description: Specialized low-frequency filter addressing predominantly inaudible low-frequency regions of a mix. Operates in minimum and mixed phase modes with variable filter slope control, dry mix options, and creative energy compensation methods.
details: |-
  TDR Infrasonic addresses the predominantly inaudible low-frequency regions of a mix. This specialized filter operates in minimum and mixed phase mode, it features a continuously variable filter slope control, a dry mix option and an exotic range of filtering loss compensation methods: A dynamic bump mode and a set of harmonic generators help the operator to creatively compensate for any unwanted energy-loss introduced by the filtering process.

  The plugin is an ideal choice when transferring material to a medium/environment of lower spectral bandwidth, such as disk mastering, audio cassettes, analogue broadcast or P.A. systems. It's exotic filtering compensation options further make it a valuable tool in all traditional recording, mixing, restoration, and mastering applications.

  The plugin comes in a modern, freely resizable user interface. Its low frequency spectral analyzer offers exceptionally detailed insight into the lowest registers of a mix, down to DC.
specs: |-
  - Minimum phase and mixed phase operation
  - Continuously variable filter slope
  - Various energy compensation options including a Dynamic Bump mode and harmonic generators
  - Highly precise low frequency spectrum analyzer
  - Freely resizable hardware accelerated user interface, full-screen capable
  - Subwoofer channel creation
  - VST2, VST3, Audio Unit or AAX compatible plugin host. Windows Vista or higher, Mac OS X 10.9 or higher, Linux x86-64 with GLIBC 2.14 or higher. OpenGL support required. Windows 32-bit: VST2, VST3. Windows 64-bit: VST2, VST3, AAX. Mac 64-bit: VST2, VST3, AU, AAX. Linux 64-bit: VST2, VST3.
