details: >-
  Simple and cost effective speech separation. Our intuitive speech separation
  software, trax sp includes access to the latest breakthroughs in automated
  speech detection and separation.


  Recommended for troubleshooting dialogue and noise in production sound as well
  as basic melodic separations.


  For production recordists. Easily fix production recordings by turning down
  disruptive background interference without affecting dialogue levels. For
  dialogue editors. Troubleshoot production sound issues including unwanted
  background noise, music, plane bys and more. For re-recording mixers.
  Independently adjust dialogue levels relative to background noise, music and
  effects. For post-production studios. Equip your edit rooms and re-recording
  stages with the most advanced speech separation technology for troubleshooting
  production sound and dialogue levels.


  Isolate or remove speech. Isolate or remove vocals and melodic content.
  Available for mac os (standalone architecture). Works on both mono and stereo
  sources. Supports up to 192khz, 32-bit floating point audio files.
  Gpu-enhanced separation speeds. Automatic consonants detection. Speech
  optimized pitchogram.


  Integrated pitchogram refinement tools.
