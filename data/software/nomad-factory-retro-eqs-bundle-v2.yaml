details: |-
  The Retro EQs Bundle v2 brings together three iconic equalizer plug-ins
  inspired by the most musical passive EQ designs of the 1950s to 1970s
  faithfully modeled after the legendary hardware from pultec, altec, and motown
  studios. Now featuring the newly released motown eqs v2, this bundle delivers
  the warm, smooth tone of classic analog gear, updated with modern features and
  compatibility for today's production environments.

  Pulse-tec eqs v2: inspired by the legendary pultec eqp-1a and meq-5 units,
  this emulation delivers silky highs, powerful lows, and the unique ability to
  boost and cut simultaneously for rich tone-shaping possibilities.

  All-tec eqs v2: based on the classic altec 9063b program eq, this plugin
  offers a simple, musical interface with broad tone curves that are perfect for
  shaping tracks in a mix without harshness.

  Motown eqs v2: meticulously modeled after the custom-built units used at
  motown's hitsville studios, this new addition captures the character and
  curves that defined the sound of an entire era of soul, funk, and r&b. It
  includes two distinct eq modules: music tone designed to bring warmth, punch,
  and presence to full mixes and individual instruments, and film tone tailored
  for dialogue and post-production work, offering smooth tonal control and
  clarity.
