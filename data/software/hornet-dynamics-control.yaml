description: HoRNet Dynamics control is a broadcast compressor designed to let you control the dynamic range of your tracks thanks to its three compressors
details: |-
  HoRNet Dynamics Control is a broadcast compressor designed to give you complete control over the dynamic range of your sounds. Whether you're working on a mix, a master, or a podcast, it helps you manage both the loudest and softest parts of your audio with precision.

  Thanks to the three different compressors it provides, the plugin allows you to limit the difference between the loudest and the softest parts of your audio, effectively controlling the dynamic range. The first compressor is a regular compressor with a soft knee and a smooth response that focuses on limiting the loudest parts of the signal, working on the loudest transients so they don't cause distortion or clipping.

  The second compressor is based on the CompExp algorithm, designed to adjust the gain level in a way that squeezes the signal around a threshold level, for more precise control over mid-range dynamics without over-compressing or losing the natural tone. The third is an upward compressor, which amplifies the signal when it falls below the threshold instead of reducing it, boosting the softer parts of the audio without affecting the louder sections.

  Global attack and release times let you set those values for all three compressors simultaneously, and the included saturation algorithm acts like a soft clipper, reducing peaks and adding a touch of analog warmth. Gain reduction (or increase) is displayed using both a classic meter and a graphical transfer function view, so you can see how the compression is affecting your audio.

  Sound quality is guaranteed by the internal oversampling feature, which adapts to the sample rate of the host DAW to reduce the risk of aliasing and distortion. While designed as a broadcast compressor, it also suits the master buss, very dynamic vocal or voiceover tracks, and podcasting, where it smooths out louder moments and boosts quieter parts.
specs: |-
  - Soft knee compressor/limiter
  - Upward and downward compressor based on CompExp
  - Upward compression with soft knee
  - Threshold and ratio controls for each compressor
  - Attack and release controls
  - Variable saturation to cut small peaks and add character
  - Gain adjustment graphical display
  - Internal automatic oversampling
  - Mac OS X (>=10.7) and Windows support
  - 64-bit compatibility both on Mac and Windows
  - Audio Units, VST2.4, VST3 and AAX format
  - Apple Silicon not supported yet
  - No copy protection
