description: "A powerful sound design sampler that lets you design, customise,
  and perform a huge range of sound effects quickly with drag-and-drop
  multi-sample interface and four sample engines."
details: |-
  Four sample engines organized as Onset, Body, Thump, and Tail. Three built-in synthesis engines. MIDI triggering with velocity sensitivity. Burst mode for automatic one-shot sequences. Adjustable fire rate in real-time. Multichannel output to separate tracks. Tag-driven browser. Basic edition: 1,385 samples, 160 presets, 1.88 GB. Fully Loaded edition: 6,737 samples, 561 presets, 8 GB. Apple Silicon native support. iLok account required.
specs: |-
  Mac: macOS 10.13+, Apple Silicon native support. Windows: 10 64-bit+. CPU: 2.4 GHz minimum. RAM: 4 GB minimum. Screen: 1280x1024+. Sample rates: 44.1 kHz to 192 kHz. 64-bit only. Supported DAWs: Pro Tools 11+, Logic Pro X, Nuendo, Ableton Live, Cubase, Reaper, Studio One.
