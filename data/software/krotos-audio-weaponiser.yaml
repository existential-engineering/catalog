description: A powerful sound design sampler that lets you design, customize,
  and perform a huge range of sound effects quickly — all from within one
  plugin. Four sample engines trigger up to 80 audio files in countless
  variations, with three built-in synthesis engines, MIDI triggering, Burst
  mode, color-coded timeline, and multichannel output.
details: |-
  Four sample engines (Onset, Body, Thump, Tail) trigger up to 80 audio files. Three built-in synthesis engines. Color-coded timeline for precise engine timing. Burst mode for one-shot assets. MIDI triggering with velocity sensitivity. Multichannel output routing each engine to separate stereo tracks. Tag-driven browser. Drag-and-drop multi-sample interface. Native Apple Silicon support. Supported DAWs: Pro Tools 11+, Logic Pro X, Nuendo, Live, Cubase, Reaper, StudioOne. 10-day free trial available.
specs: |-
  macOS 10.13+, Windows 10 64-bit+. AAX Native/AudioSuite, VST, VST3, AU (64-bit only). Min CPU: 2.4 GHz. Min RAM: 4 GB. Storage: 1.88 GB. Sample rates: 44.1–192 kHz. iLok account required. Perpetual license.
