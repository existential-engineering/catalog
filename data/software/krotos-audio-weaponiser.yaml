description: "Weaponiser is an inspiring sound design layering solution: design and perform any sound effect including gunshot sounds, Foley and footsteps in real time, all from within one plugin."
details: |-
  Weaponiser is a sound design sampler that lets you design, customise and perform a huge range of sound effects quickly, all from within one plugin. Assets and fully-fledged sounds are created with a drag-and-drop, multi-sample interface, and all layers stay on a single track in your DAW.

  Four sample engines can trigger up to 80 audio files in countless variations, and three built-in synthesis engines are included alongside hundreds of presets and thousands of assets, with your own sounds importable. The engines are organised into four sections, Onset, Body, Thump and Tail, giving control over the specific layers of a sound.

  Included sound libraries are reachable through the built-in tag-driven browser and dropped into a design by drag and drop, covering real and sci-fi weapons, sci-fi sound effects, footsteps and surfaces, and whooshes and transitions.

  For spotting to picture, presets can be switched while sync is maintained in the DAW rather than adjusting multiple tracks, groups or plugins. MIDI triggers the engines, with velocity sensitivity for programmed or performed variations, and either the whole plugin or an individual engine can be triggered.

  The timing and arrangement of the engines is offset precisely using the colour-coded built-in timeline. A Fire button triggers sounds, Burst mode creates automatic bursts from one-shot assets, and the fire rate can be adjusted in real time. Multichannel output processes each engine with your own plugins or sends each layer to its own stereo track for mixing. A 10-day trial is available.
specs: |-
  - 2.4 GHz CPU minimum
  - 4 GB of RAM
  - macOS 10.13 or above (working on OS X Ventura but not yet fully tested), or Windows 10 64-bit or above
  - Native Apple Silicon support
  - Formats (64-bit only): AAX Native/AudioSuite, VST, VST3, AU
  - Minimum sample rate 44.1 kHz, maximum 192 kHz
  - Hard disk space: 1.88 GB (Basic), 8 GB (Fully Loaded)
  - Screen resolution of 1280x1024 or higher
  - Digital download, internet connection required at the time of activation
  - An iLok account (free at ilok.com) is required for both demo and full version
  - An iLok 2 or later is required for dongle use
  - Can only be activated on one computer at a time
  - Supported hosts: Pro Tools (11 or later), Logic Pro X, Nuendo, Live, Cubase, Reaper, Studio One
  - Weaponiser Basic contents: 1,385 samples, 515 weapon samples, 160 presets, 1.88 GB assets, tag-driven browser
