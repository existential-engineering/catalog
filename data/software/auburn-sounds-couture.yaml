description: Couture is a distortion audio plug-in with preceding transient
  shaper. It operates in a level-independent manner.
details: |-
  Couture gives you exquisite control over your dynamics, and particularly attacks. Raw Efficiency: increase or decrease dynamics, and get a usable result, now.

  Fully Volume-independent. Keep the freedom to change input gain when needed, including the Saturation stage. Couture's 2-bands, half-spectral, RMS, program-dependent detector finds each and every transient, with no internal thresholds.

  Couture is unusually versatile: make individual drum tracks a lot more dynamic and punchy, remove the "click" out of a kick drum sample, make a whole bus more or less dynamic in a single click, give glue to a mix with light compression and saturation, use a subtle saturation that preserve dynamics, deess the very start of notes for vocals, and give life to inane lead synths.

  This is Freemium software. There are two versions: Couture Free has the saturation part disabled, and Couture Full gets the whole deal. It's the real Couture.

  Our sonic quality control has been refined to the next level of obsessiveness at the Auburn Sounds monastery.
specs: |-
  - VST, AAX, AU and LV2 plug-in formats
  - Windows, macOS and Linux support
  - 2-bands, half-spectral, RMS, program-dependent transient detector
  - No internal thresholds
  - Fully volume-independent processing, including the saturation stage
  - Analog-sounding distortion
  - Subtle distortion
  - Volume-preserving distortion
  - Equal gain compensation
  - Transient design and transient shaping
  - Oversampling (1x, 2x, 4x, 8x)
  - Free Edition available with the saturation part disabled
