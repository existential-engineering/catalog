details: |-
  Couture is a dynamics-preserving distortion and transient shaper plugin
  offering exquisite control over dynamics and attacks. It allows users to
  increase or decrease dynamics with immediately usable results, combining
  saturation with transient shaping in a single processor.

  The plugin detects and shapes transients via a 2-band, half-spectral, RMS,
  program-dependent detector. It applies volume-independent saturation that
  preserves the natural dynamics of the source material, unlike conventional
  saturation plugins.

  Couture excels at making drum tracks punchier and more dynamic, removing
  clicks from kick drum samples, adding glue to mixes with light compression and
  saturation, de-essing vocals, and enhancing synthesizers. It can process
  individual tracks or entire buses.

  The Free Edition has saturation disabled, while the Full Edition unlocks the
  complete feature set for professional dynamics and saturation processing.
specs: |-
  - Dynamics-preserving distortion
  - Transient shaper
  - 2-band half-spectral RMS program-dependent detector
  - Volume-independent saturation
  - Drum punch enhancement
  - Click removal for kick drums
  - Mix glue with light compression and saturation
  - De-essing capability
  - Synthesizer enhancement
  - Individual track and bus processing
