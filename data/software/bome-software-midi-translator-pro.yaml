description: Bome MIDI Translator Pro is a versatile MIDI mapping, processing, and scripting tool. Create custom MIDI routings, rules, logic, layers. And with keystroke and mouse emulation, you can control any software on your computer using a MIDI controller.
details: |-
  Bome MIDI Translator Pro is a popular MIDI and keystroke mapping tool: use it for controlling arbitrary software by way of MIDI and keystrokes. Its rich feature set also allows it to be used for general computer automation.

  With Bome MIDI Translator Pro you can control your computer from MIDI or other devices. For example: you can control your favorite software with a MIDI control surface, use MIDI turntables with arbitrary DJ software, map MIDI messages to other MIDI messages, and much more. You can create your own mappings by defining the translations, or use one of the many pre-existing translation presets. Bome is constantly working on new presets, and the active community expands the available pool of presets, too.

  MIDI Translator Pro works by specifying mappings for different input and output types, combining a list of trigger types (Incoming Actions) with a list of action types (Outgoing Actions). Any combination is allowed, so keystroke-to-MIDI conversion or MIDI-to-mouse mapping are both possible. Between the two sits a sequence of rules that is processed when the incoming action matches, supporting variable assignments, simple expressions, labels and goto, and conditional execution.

  The software is used by musicians (both hobbyists and professionals), by DJs and controllerists, by lighting engineers, in music studios and TV studios, on big and small stages, in theaters, by photographers for raw development, for MIDI control of games, and in research and development for rapid prototyping.

  A trial version is available that runs 20 minutes at a time, with unlimited restarts. Project files saved with the trial will not run in the BomeBox until they are loaded into the fully registered version and saved there, and the trial itself cannot be unlocked. The full product is a digital download: the license key and download link arrive by email after purchase, and one license covers both Windows and macOS, though only one instance of a license may run at a given time. The Classic edition is a reduced, Windows-only version, and an OEM/Player runtime edition with the full feature set but no editor is available under OEM licensing.
specs: |-
  - Incoming Action (trigger): MIDI messages
  - Incoming Action: MIDI Port plugged in/unplugged
  - Incoming Action: keystrokes
  - Incoming Action: timer
  - Incoming Action: application focus
  - Incoming Action: opening a project file
  - Incoming Action: enable/disable the current preset
  - Incoming Action: bytes or text on a serial port
  - Incoming Action: perform (callback from outgoing perform)
  - Processing ("Rules"): assignments of variables, e.g. pp = 20
  - Processing ("Rules"): simple expressions, e.g. pp = og + 128
  - Processing ("Rules"): labels and goto, e.g. goto "2nd Options"
  - Processing ("Rules"): conditional execution, e.g. IF pp < 20 THEN do not execute Outgoing Action
  - Outgoing Action: MIDI messages
  - Outgoing Action: MIDI port
  - Outgoing Action: add/remove/disable/enable MIDI routes
  - Outgoing Action: keystrokes
  - Outgoing Action: mouse movements
  - Outgoing Action: application focus
  - Outgoing Action: create/start/stop timer
  - Outgoing Action: change active preset
  - Outgoing Action: enable/disable the current preset
  - Outgoing Action: execute program
  - Outgoing Action: open a project file
  - Outgoing Action: send bytes or text to serial ports
  - Outgoing Action: execute AppleScript (macOS only)
  - Outgoing Action: trigger the incoming perform action
  - Specify a delay for Outgoing Actions
  - Create and edit projects (.bmtp files); opens regular .bmtp, signed .bmtp and encrypted .bmte files
  - Use MIDI IN and MIDI OUT, multiple MIDI ports, MIDI messages as hex strings, selection of MIDI messages by type, and 14-bit MIDI controllers
  - Virtual MIDI ports and definable MIDI Port Aliases
  - MIDI Router with editable THRU connections
  - Unlimited translators per preset and unlimited presets per project
  - Log Window
  - Windows 10, 11; fully compatible with Windows 64-bit on Intel or AMD processors
  - macOS 11 - 26; fully compatible with Apple Silicon and Intel processors
  - Virtual MIDI ports are not compatible with Windows on ARM; 32-bit versions are available in the Download Archive
  - Software protection: modified binary executables stop working and must be reinstalled from the original installer
