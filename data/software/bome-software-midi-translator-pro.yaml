description: Bome MIDI Translator Pro is a versatile MIDI mapping, processing,
  and scripting tool. Create custom MIDI routings, rules, logic, layers. And
  with keystroke and mouse emulation, you can control any software on your
  computer using a MIDI controller.
details: |-
  Bome MIDI Translator Pro is a popular MIDI and keystroke mapping tool: use it for controlling arbitrary software by way of MIDI and keystrokes. Its rich feature set also allows it to be used for general computer automation.

  With Bome MIDI Translator Pro you can control your computer from MIDI or other devices. For example: you can control your favorite software with a MIDI control surface, use MIDI turntables with arbitrary DJ software, map MIDI messages to other MIDI messages, and much more.

  You can create your own mappings by defining the translations, or use one of the many pre-existing translation presets. Bome is constantly working on new presets, and the active community expands the available pool of presets, too.

  MIDI Translator Pro works by specifying mappings for different input and output types. There is a list of different trigger types (Incoming) and action types (Outgoing), and you can combine them as you wish (e.g. do keystroke-to-MIDI conversion, or MIDI-to-mouse mapping). A sequence of rules can be defined to be processed if the incoming action matches, supporting variable assignments, simple expressions, labels and goto, and conditional execution.

  It is used by musicians (both hobbyists and professionals), by DJs and controllerists, by lighting engineers, in music studios and TV studios, on big and small stages, in theaters, by photographers for raw development, for MIDI control of games, and in research and development for rapid prototyping.

  The trial version only runs 20 minutes at a time (the program can be restarted as often as you like), and project files saved with the trial version will not run in the BomeBox until they are loaded and re-saved in the fully registered version. The trial version cannot be unlocked; the full version is purchased as a digital download, with the license key and download link delivered by email. A single license covers Windows and macOS, but only one license may run at a given time.
specs: |-
  - Incoming Actions (triggers): MIDI messages
  - Incoming Actions: MIDI Port plugged in/unplugged
  - Incoming Actions: keystrokes
  - Incoming Actions: timer
  - Incoming Actions: application focus
  - Incoming Actions: opening a project file
  - Incoming Actions: enable/disable the current preset
  - Incoming Actions: bytes or text on a serial port
  - Incoming Actions: perform (callback from outgoing perform)
  - Processing ("Rules"): assignments of variables, e.g. pp = 20
  - Processing ("Rules"): simple expressions, e.g. pp = og + 128
  - Processing ("Rules"): labels and goto, e.g. goto "2nd Options"
  - Processing ("Rules"): conditional execution, e.g. IF pp < 20 THEN do not execute Outgoing Action
  - Outgoing Actions: MIDI messages
  - Outgoing Actions: MIDI port
  - Outgoing Actions: add/remove/disable/enable MIDI routes
  - Outgoing Actions: keystrokes
  - Outgoing Actions: mouse movements
  - Outgoing Actions: application focus
  - Outgoing Actions: create/start/stop timer
  - Outgoing Actions: change active preset
  - Outgoing Actions: enable/disable the current preset
  - Outgoing Actions: execute program
  - Outgoing Actions: open a project file
  - Outgoing Actions: send bytes or text to serial ports
  - Outgoing Actions: execute AppleScript (macOS only)
  - Outgoing Actions: trigger the incoming perform action
  - Virtual MIDI ports, MIDI port aliases and a MIDI Router with editable THRU connections
  - Unlimited translators per preset and unlimited presets per project
  - Opens regular .bmtp, signed .bmtp and encrypted .bmte project files
  - macOS 11 - 26, fully compatible with Apple Silicon and Intel processors
  - Windows 10, 11, fully compatible with Windows 64-bit on Intel or AMD processors
  - Virtual MIDI ports are not compatible with Windows on ARM; 32-bit versions are available in the Download Archive
versions:
  - name: 1.9.2
    releaseDate: 2025-12-30
    description: "Variable Storage (store and retrieve variable state, even after a
      restart, to internal persistent storage or a file), Timer Action
      Parameters, and native 64-bit on Windows. Minimum OS versions: Windows 10,
      macOS 11."
    url: https://www.bome.com/products/miditranslator/version-history
  - name: 1.9.1
    description: "New Perform action to trigger Incoming Actions from an Outgoing
      action and pass parameters along, ELSE/ELSE IF statements in Rules,
      HighDPI support with optional UI scaling up to 300%, and a macOS universal
      build for Intel and Apple Silicon. Minimum OS versions: Windows 7, macOS
      10.10."
  - name: "1.9"
    description: New Active Application, MIDI Router and MIDI Port actions, a
      Project Close incoming action, an improved Keystroke action with a new
      Shortcut mode, 710 global variables, a new Log rule, and new command line
      parameters.
  - name: 1.8.4
    description: Multi-monitor support for mouse emulation, mix and match modifiers
      on macOS, MPE Configuration Message and HUI Ping MIDI message types,
      preset comments, Windows Hi-DPI mouse emulation, and automatic virtual
      ports. Last version supported on 32-bit Intel macOS computers.
  - name: 1.8.3
    description: High contrast schemes for vision impaired users, raw MIDI capture
      options, improved international keyboard compatibility, macOS 64-bit only,
      a newly designed event monitor and a new look and feel.
  - name: 1.8.2
    description: Full macOS Sierra 10.12 support, improved serial port support
      including serial port aliases and SerialMIDI, and safeguards for the
      settings file.
  - name: 1.8.1
    description: Tray / menu bar icon, Key Sequence and Text modes for the Keystroke
      Input action, special keys list, Windows screen reader compatibility,
      improved keyboard navigation, and single-instance operation.
  - name: 1.8.0
    description: Single window user interface on Windows with a modern look and
      feel, serial port support (incoming and outgoing actions, serial ports as
      MIDI ports, serial port aliases), and no Java requirement. Last version
      supported on Windows XP.
