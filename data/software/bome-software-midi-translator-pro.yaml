    description: "Variable Storage (store and retrieve variable state, even after a restart, to internal persistent storage or a file), Timer Action Parameters, and native 64-bit on Windows. Minimum OS versions: Windows 10, macOS 11."
    url: https://www.bome.com/products/miditranslator/version-history
  - name: 1.9.1
    description: "New Perform action to trigger Incoming Actions from an Outgoing action and pass parameters along, ELSE/ELSE IF statements in Rules, HighDPI support with optional UI scaling up to 300%, and a macOS universal build for Intel and Apple Silicon. Minimum OS versions: Windows 7, macOS 10.10."
  - name: "1.9"
    description: New Active Application, MIDI Router and MIDI Port actions, a Project Close incoming action, an improved Keystroke action with a new Shortcut mode, 710 global variables, a new Log rule, and new command line parameters.
  - name: 1.8.4
    description: Multi-monitor support for mouse emulation, mix and match modifiers on macOS, MPE Configuration Message and HUI Ping MIDI message types, preset comments, Windows Hi-DPI mouse emulation, and automatic virtual ports. Last version supported on 32-bit Intel macOS computers.
  - name: 1.8.3
    description: High contrast schemes for vision impaired users, raw MIDI capture options, improved international keyboard compatibility, macOS 64-bit only, a newly designed event monitor and a new look and feel.
  - name: 1.8.2
    description: Full macOS Sierra 10.12 support, improved serial port support including serial port aliases and SerialMIDI, and safeguards for the settings file.
  - name: 1.8.1
    description: Tray / menu bar icon, Key Sequence and Text modes for the Keystroke Input action, special keys list, Windows screen reader compatibility, improved keyboard navigation, and single-instance operation.
  - name: 1.8.0
    description: Single window user interface on Windows with a modern look and feel, serial port support (incoming and outgoing actions, serial ports as MIDI ports, serial port aliases), and no Java requirement. Last version supported on Windows XP.
