details: |-
  Celebrating the exquisite sound of a Viola section captured at Abbey Road Studios, this virtual instrument offers a comprehensive collection of long and short articulations. With eight technologically advanced legato techniques, including extended velocity-triggered patches (portamento and detaché), and a massive sampling depth, it provides unparalleled realism and expression.

  Featuring 16 curated mix signals, with two hand-crafted by GRAMMY award winner Simon Rhodes, this library sets a new standard for violin sound in the digital age. Experience the warmth and authenticity of a masterfully recorded instrument, designed to elevate your compositions.

  This is a remarkably authentic Viola sound that embodies the timeless essence of one of the most renowned recording spaces in the world: Abbey Road Studio One.

  Capturing your orchestral vision with ultimate realism.

  Combine the 2nd Violins/Violas with the rest of the Abbey Road Orchestra: Symphonic Strings Professional collection for the ultimate virtual string section.

  Only after the basics? Check out Core .
specs: |-
  - 8 legato techniques including extended portamento and detache patches
  - 16 microphone signals, including two Simon Rhodes mixes and two Decca trees
