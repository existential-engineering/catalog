description: The akebono collection is a sample-based emulation of the akebono
  koto synthesizer – a unique suitcase instrument from japan
details: >-
  The akebono collection is a sample-based emulation of the akebono koto
  synthesizer a unique suitcase instrument from japan for native instruments
  kontakt 4 & 5. Akebono was released exclusively in japan some time in the
  1980s.


  It was designed as a portable practice instrument for koto players, and as
  such it features many unique features that make performing in the traditional
  style a lot easier than using a MIDI keyboard.


  It can be considered a kind of workstation for traditional japanese
  instruments.


  All sounds were sampled and integrated into in a custom kontakt instrument
  that emulates the performance options available on the original hardware.
specs: |-
  - Native instruments kontakt 4 & 5 compatible
  - 15 instrument sounds sampled
  - 13 percussion sounds sampled
  - 24-bit 48khz sample quality
  - 7 impulse responses of the original speaker
  - 5 custom effects: amp, eq, mod, echo, and dynamics
  - Custom kontakt instrument
  - Original performance features emulated with custom scripts
