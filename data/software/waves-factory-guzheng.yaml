description: Sample library for Kontakt. Get the sound of this ancient Chinese instrument for your music. With multiple articulations, included effects and much more.
details: |-
  The Guzheng is a Chinese plucked zither, ancestor of several Asian instruments such as the Japanese koto, the Mongolian Yatga and the Korean gayageum. It has 21 strings and movable bridges.

  5 articulations: fingers, pick, stick, bow and e-bow. Traditional and alternative techniques in order to get the most out of this beautiful instrument with up to 4 round robin and 4 velocity layers.

  Realistic tremolo effect where the last played note is re-triggered on release, control the velocity and intensity of the tremolo more naturally and musically. Pitch wheel affects only the last played note in order to create the effect of stretching a string on the real instrument.

  From the mixer you can control the different articulations separately with the usual parameters you'd get on an audio mixer, with a load/purge switch for each channel, pan / width, volume, mute, solo, phase shift and output selector for mixing the different channels in your DAW.

  In the effects page you can add any effect you want in any order, including EQ, compressors, modulation effects, distortion, saturation, tape machine, reverbs, amp simulators and more. From the settings panel you can control round robin, velocity curve, dynamic range and the envelope of each plucked and bowed articulation separately.
specs: |-
  - 5 articulations: fingers, pick, stick, bow and e-bow
  - 711 samples, 1.28 GB library size
  - 4 velocity layers, 4 round robin
  - Tremolo script that re-triggers the last played note on release
  - Pitch wheel affects only the last played note
  - Mixer with load/purge, pan / width, volume, mute, solo, phase shift and output selector per articulation
  - 21 DSP effects including convolution with 30+ custom impulse responses, EQs and compressors
  - Settings page for round robin, velocity curve, dynamic range and per-articulation envelope
  - Kontakt 5.7.3 and newer versions; full version of Kontakt required (Kontakt Player runs in demo mode)
