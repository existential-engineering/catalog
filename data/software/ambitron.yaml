details: |-
  Ambitron is an experimental electronic synthesizer that employs granular
  synthesis in two separate and programmable layers each with extensive FX and
  modulation matrix modules to provide the user with control over sound
  creation.

  Ambitron comes with scores of samples built in but can also support the import
  of user samples in .wav format for sound creation that can be customized to
  user preferences and musical styles.

  As an experimental synthesizer it is meant to be used as a laboratory for the
  exploration of new sonic and timbral creations that would be difficult to
  achieve another way. The nature of ambitron is that it allows for sonic
  evolution over time. It is ideal for ambient soundscapes or experimental
  genres.

  The delay & reverb options are superb - a lot of options for delay taps and
  you can have various timing for each left and right delay channel (same with
  reverb, many options that seem to be omitted on separate reverbs).

  Complete patch randomization, the ability to morph between patches via
  winamp-style queue, and custom morph times allow users to cycle through
  patches over extended periods, with the signal flow navigated by a tabbed
  section where each sample has its own grouping for more control.
