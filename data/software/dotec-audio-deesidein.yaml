description: A free utility plug-in that enables inserting and mixing sound at any point within a signal chain, useful for merging harmonies/drums or splitting sound to separate tracks.
details:
  - DeeSideIn is a free routing utility plug-in from Dotec-Audio that allows inserting and mixing audio at any point within a DAW signal chain. Its primary use cases include merging harmonies or drum sounds from an external send into a target track, and splitting audio off to a separate track for parallel processing.
  - The plug-in makes it possible to apply effects that come after it in the signal chain to a sidechain signal, effectively letting users route audio into positions in the chain where it would otherwise be inaccessible. This opens up creative routing configurations that many DAWs do not natively support.
  - DeeSideIn has been tested with over 19 DAW hosts including Cubase, Logic Pro X, Ableton Live, Pro Tools, Studio One, FL Studio, Reason, Digital Performer, GarageBand, OBS Studio, and others. Apple Silicon is fully supported across all provided formats.
  - On macOS, the plug-in is provided as VST2, VST3, AU, and AAX (64-bit, OS 10.12 or later). On Windows, VST2, VST3, and AAX are available (64-bit). The download is approximately 9 MB on Windows and 16 MB on macOS.
  - "DeeSideIn is available at no cost. Credits: sound design by Franck Shigetora; UI design by IZMOJUKI and FUKUDAKOGYO; distributed by cyber rock.LLC and fmfmsoft Corp."
