description: An all-tube preamp and EQ plugin modeled after the D.W. Fearn
  preamp design, offering Mic, Line and Instrument input modes each with unique
  gain structure, saturation and EQ curve, plus a passive-style EQ with High/Low
  Cut and Boost.
details: |-
  Founded by brothers Geoff and George Hazelrigg, Hazelrigg Industries brings a unique artist-centric approach to designing studio equipment. Their debut offering, the VLC, is a versatile All-Tube Preamp and EQ combo that combines the legendary D.W. Fearn preamp design with modern functionality, delivering exceptional sonic transparency for a wide range of sources. Enlisting our component level modeling technology in concert with the team at Hazelrigg Industries, we were able to debut the world-class sonics of the VLC to the digital world. Introducing, MixWave: Hazelrigg VLC.
