details: |-
  Bad Channel is the affordable multi-FX channel strip plug-in of your
  nightmares. Packed with cutting distortion, wide and weird modulation, a
  broken comb filter, sketchy tape-machine delay, resonant filters, and built-in
  brick wall limiting, this plug-in is the one-stop-shop for all extreme sound
  enthusiasts to mangle new tones quickly.

  This plug-in is great for shredding any instrument - a searing solo, crushing
  drums, dark-chorus on bass, ripping synths, or resurrect a di guitar track.
  Slap this on anything and get lost in the chaos.

  Features include distortion with in gain, out gain, tone, filter level, and
  mix controls; modulation with rate, width, delay time, feedback, and mix
  controls; broken comb with frequency and intensity controls; delay with delay
  time, feedback, and mix controls; and filter with low-pass and high-pass
  controls.

  One (1) license valid for five (5) activations. Vst3 / AU formats for mac and
  windows.

  Installation requirements: 64-bit pc with windows 7 (with sp 1), windows 8 or
  windows 10 with DAW vst3 support; or 64-bit intel mac os 10.11 and above with
  DAW vst3 or AU support. Broadband internet connection for installation and
  10mb free disk space required.
