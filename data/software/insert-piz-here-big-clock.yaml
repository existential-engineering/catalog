id: TMXDbgt5TxuLoII75A3Yf
name: Big Clock
manufacturer: insert-piz-here
primaryCategory: utility
url: https://thepiz.org/plugins/?p=Big%20Clock
description: "Configurable, resizable clock/counter plug-in. Can show: host
  timeline as bars/beats/ticks, hours/minutes/seconds/frames, or samples."
details: |-
  Configurable, resizable clock/counter plug-in. Use it if your host's counter
  is the wrong color, or isn't big enough. Bigger is better.

  Can show: host timeline as bars/beats/ticks, hours/minutes/seconds/frames, or
  samples. Recording time (only works if host informs plugins of recording
  state). Stopwatch, with automatable controls. Plugin time - total time since
  the plugin was loaded. Actual time - "real life" time of day.

  Sample-accurate up to one hundred billion hours at 44100 hz. Can also set up
  "cues" to display at selected times.
specs: |-
  - Configurable clock/counter plug-in
  - Resizable display
  - Host timeline display (bars/beats/ticks)
  - Hours/minutes/seconds/frames display
  - Samples display
  - Recording time display
  - Stopwatch with automatable controls
  - Plugin time display
  - Actual time display
  - Sample-accurate up to one hundred billion hours at 44100 Hz
  - Cue display at selected times
  - Color customization
  - VST plugin format
  - Windows compatible
platforms:
  - windows
