description: An analog-style EQ plugin, with three quite different and unique
  equalizers. A 3-in-1 collection of EQ plugins, each with character and quirks.
details: |-
  The Passive-Active Pack is a collection of three very different equalizers, each with its own character and quirks. Together they make an excellent secret-weapon analog-style EQ toolbox.

  The Passive and Active equalizers emulate real workhorse units, used on thousands of recordings from past to present. The Focusing Equalizer, an original creation of Softube's, combines these with analog saturation and a novel workflow, to give you musical results, and a wonderful sound every time.

  The Focusing Equalizer sparks your creativity with built-in saturation and the possibility to choose between passive and active EQ sound. The pack is described as perfect for both broad brushstrokes and surgical applications.

  The product supports Softube Extended Features, easy-access panels that add modern precision and workflow to the classic VU meters, Bakelite knobs and analog quirks of the original interfaces.

  It is Console 1 Ready, so the plug-ins can be used within Console 1, Softube's mixing system. It is also available as part of Flow Mixing Suite and Flow Complete Suite.
specs: |-
  - Three analog-style equalizers: Passive Equalizer, Active Equalizer and Focusing Equalizer
  - Focusing Equalizer is a Softube original with built-in analog saturation
  - Focusing Equalizer can switch between passive and active EQ sound
  - Suited to both broad tonal shaping and surgical correction
  - Supports Softube Extended Features control panels
  - Console 1 Ready
  - Three license activations included
  - 20-day trial available
  - Requires a Softube account
  - Requires an iLok account (no physical iLok required)
  - Requires internet access for downloading installers and managing licenses
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
