details: |-
  Manuel is one of the most forward-thinking guitarists of his generation. His playing fuses jaw-dropping precision, percussive technique, and melodic fluidity into a voice that feels both futuristic and deeply human. From explosive rhythmic bursts to delicate ambient layers, every note reflects his unique balance of control and emotion. Built from the ground up around his signature tone, this captures the essence of Manuel's sound, with sharp transients, articulate gain structure, and expressive effects that define his approach. Each element was shaped to reflect his modern versatility and the tactile feel of his performances, creating a complete expression of his musical identity.
