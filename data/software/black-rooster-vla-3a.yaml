description: Vintage opto compressor plugin inspired by the Teletronix LA-3A. Faster, brighter leveling for vocals, drums and guitars.
details: |-
  Inspired by the Teletronix / UA LA-3A: the LA-2A's quicker, brighter cousin. The VLA-3A keeps the modelled T4B opto cell but wraps it in a discrete solid-state audio path, so it grabs faster and sits forward in a way the tube-based LA-2A never quite does.

  The VLA-3A is a vintage opto compressor that solves a specific problem: you love the smooth, program-dependent feel of an optical unit, but the source is percussive and the LA-2A is just too slow to catch it. Same two-and-a-switch layout — Peak Reduction, Gain, and a Limit/Compress mode toggle — but the response is snappier and the top end brighter, thanks to the solid-state amplifier and a high-frequency contour filter in the detection path.

  When the LA-3A arrived in the early 1970s it took the optical attenuator idea from the LA-2A and dropped the tube amplifier in favour of discrete solid-state circuitry. Black Rooster modelled the whole path with a real-time, SPICE-style circuit simulation: the input and output transformers, the discrete sidechain and audio-amplifier stages, the high-frequency contour filter network, and the T4B cell at the centre.

  The VLA-3A's attack catches transients the LA-2A would sail past, so drums and plucked guitars keep their snap while still getting leveled. The high-frequency contour in the sidechain gives it a lively, present top end, and the discrete gain amplifier adds a subtle, musical saturation as you push the Gain knob.

  Vocals are a classic LA-3A move: the faster attack tucks consonants and breaths in tighter than a LA-2A, and the brightness keeps the take from getting dull under compression. On drums and room mics, Peak Reduction brings up ambience and glues the kit without smearing transients.
