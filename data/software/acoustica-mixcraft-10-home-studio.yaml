description: Mixcraft is the renowned digital audio workstation for Windows from
  Acoustica, designed for musicians by musicians. With its unique combination of
  ease of use and professional features at an irresistible price, Mixcraft has
  been a favorite among music enthusiasts and professionals since its
  introduction in 2004.
details: |-
  Mixcraft 10 Home Studio is the entry-level edition of Acoustica's digital
  audio workstation, supporting up to 16 audio and MIDI tracks. It includes
  access to 7,500+ loops, sound effects, and samples, along with video editing
  capabilities and music notation tools.

  The Home Studio edition features a scalable interface, project templates for
  podcasting, mastering, and video editing, and access to the integrated
  Mixcraft Store with over 100 items from brands like FabFilter, Cherry Audio,
  and Antares.

  Mixcraft 10.6 introduced a Quick Access Panel for rapid instrument and effect
  management, a Project Start Panel for streamlined project launching, preset
  project templates, and a customizable Hotkeys Editor. The improved Plugin
  Manager with safe mode and auto-save functionality enhance stability.

  The software supports 17 languages and is complemented by Mixcraft Remote, a
  free companion app for iOS 14+ and Android 14+ for remote control via
  smartphone or tablet.
specs: |-
  - Up to 16 audio and MIDI tracks
  - 7,500+ loops, sound effects, and samples
  - Video editing and scoring environment
  - Music notation and editors
  - Scalable interface
  - Project templates for podcasting, mastering, video editing
  - Improved Plugin Manager with safe mode
  - Auto-save functionality
  - Integrated Mixcraft Store with 100+ items
  - Hotkeys Editor with saveable shortcut sets
  - Quick Access Panel
  - 17 language support
  - Requires 64-bit Windows 7 SP1, 8, 10, or 11
  - Minimum: 4GB RAM, 1.8 GHz Dual Core CPU
  - Recommended: Windows 10+, 8GB+ RAM, 3.0 GHz Quad Core+ CPU
