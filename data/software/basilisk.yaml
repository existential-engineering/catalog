description: Basilisk is a full stereo, two-channel multi-band 'vibe' style
  effect geared towards electric piano, strings, pads and guitars.
details: |-
  The wet channel passes your signal through a 9-band equalizer, each band being
  modulated at an independently set rate with an adjustable waveform (4
  choices). In addition, each band has a knob for adjusting the bandwidth for
  its dedicated center frequency.

  Next, your signal is fed into a stereo chorus effect (5 selectable waveforms)
  capable of everything from smooth flange to a glitchy blitter -- and for those
  more 'crusty' moods, a very fat lowpass filter is right there in order to trim
  off some of the highs.

  All that's left is to mix and match your wet and dry signals with two
  independent volume knobs in order to find that perfect blend.

  Utilizes phasing for smoother effect.
specs: |-
  - Full stereo, two-channel multi-band effect
  - 9-band equalizer
  - Independent modulation rate per band
  - 4 waveform choices for band modulation
  - Bandwidth control per band
  - Stereo chorus effect
  - 5 selectable chorus waveforms
  - Moog style master lowpass filter
  - Independent wet/dry signal volume controls
  - VST plugin format
  - Windows compatible
