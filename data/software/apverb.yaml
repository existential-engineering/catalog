details: |-
  apVerb is an audio plugin to create algorithmic reverbs with exceptional
  smoothness and flexibility. The plugin generates reverb from thousands of
  semi-randomly spaced delay lines - inspired by a recently invented form of
  noise called 'velvet noise'. The carefully spaced delays offer resonance-free
  reverb tails that can surpass the smoothness, flexibility and stereo width of
  traditional reverb algorithms.

  The delay lines are processed by filters and effects to achieve all kinds of
  reverbs and innovative effects. Apverb provides full control of many
  parameters over time, thanks to the 23 curve-based multi-segment envelopes.
  Besides traditional reverb types, this enables the creation of reverse
  reverbs, reverb losing density over time, increasing frequency bandwidth over
  time, delay-like effects.

  Additionally, apverb can sync all envelope and pre-delay times to the host
  tempo, making it possible to create rhythmic effects. It also includes an
  early reflections generator based on simulated virtual room geometries and 3
  effects: chorus, phase distortion, and saturation that can be applied to
  user-defined time/frequency regions of the reverb.

  The wet signal can be controlled by input dynamics using a ducking algorithm
  or by resetting the reverb tail at attacks/transients.
specs: |-
  - Algorithmic reverb
  - Velvet noise algorithm
  - 23 curve-based multi-segment envelopes
  - Early reflections generator
  - Virtual room geometries simulation
  - Chorus effect
  - Phase distortion effect
  - Saturation effect
  - Envelope sync to host tempo
  - Pre-delay sync to host tempo
  - Rhythmic effects
  - Input dynamics control
  - Ducking algorithm
  - Reverb tail reset at attacks/transients
  - Reverse reverbs
  - Stereo width control
  - Resonance-free reverb tails
  - macOS support
  - Windows support
  - Universal 2 binary
