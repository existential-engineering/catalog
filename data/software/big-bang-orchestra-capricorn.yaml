details: |-
  Big Bang Orchestra: Capricorn is a free bonus pack that adds three more
  musical patterns with ostinatos in 4th, 8th and 16th notes available in
  strings only versions as well as tutti versions. The patterns can be used in a
  variety of harmonic settings, adding drive and forward pushing energy to any
  arrangement, with pre-configured patches called stacked riffs also available.

  With bbo: capricorn, the series of epic tutti recordings reaches further
  toward instant modern scoring with captivating riffs and patterns, played with
  exhilarating intensity by the entire synchron stage orchestra. This massive
  library offers a wide variety of 4-bar phrases that can be combined to make
  hundreds of variations, from subdued tension patterns to angst-inducing
  marches or massive chase cues.

  The patches are organized in three main categories and can be easily accessed
  and combined using key switches: main themes presenting the entire tonal
  spectrum of the symphony orchestra, low riffs played by the lower registers of
  strings, woodwinds and brass, and high riffs played by the higher registers of
  strings, woodwinds and brass.

  All phrases are available in 120, 130 and 140 bpm on all root notes over up to
  two octaves, allowing combination of main riffs, low riffs and high riffs of
  different phrases and different root notes. The large number of microphone
  positions and their availability in the full-fledged mixer of the synchron
  player allow for sonic flexibility and variation possibilities.

  Mixer presets include war fanfare and string is king to emphasize certain
  sections of the orchestra, room mixes featuring decca tree and surround mic
  positions for cpu and ram-saving sound, stereo decca tree and surround to
  stereo presets, surround presets for 3d audio setups, and a processed category
  with presets such as close big, wide big, ambient big, massive, lush, and
  vintage tape.
