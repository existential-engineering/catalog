description: A modern and powerful high-end reverb plugin. The better-sounding
  alternative to traditional reverbs.
details: |-
  TSAR-1R Reverb is the little sibling of the more adjustable TSAR-1 Reverb. They share exactly the same high end reverb algorithm, but TSAR-1R offers extreme ease of use for a fast and intuitive workflow.

  Essentially, TSAR-1R is operated with a single control, the Time slider. Add depth and dimension to any sound with short and controlled room sounds, or slide it up towards hall settings for large, dramatic spaces.

  It really is as easy as that, and it always sounds stellar.

  This product supports Extended Features: easy-access panels with modern precision and workflow innovations close at hand.

  TSAR-1R Reverb is bundled for free when you buy TSAR-1 Reverb, and an upgrade to TSAR-1 Reverb is possible. It is also available as a part of Flow Mixing Suite and Flow Complete Suite.
specs: |-
  - True Stereo Algorithm, same as in TSAR-1 Reverb
  - Operated with a single control, the Time slider
  - Extremely easy to use
  - Modern and powerful high-end reverb
  - Bundled for free when you buy TSAR-1 Reverb
  - Upgrade possible to the TSAR-1 Reverb
  - Supports Softube Extended Features panels
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Apple silicon (M1 or newer) supported natively, or Intel Core i3/i5/i7
  - Softube account and iLok account required (no physical iLok required)
  - Supported sample rates: 44.1, 48, 88.2, 96, 176.4 and 192 kHz, mono and stereo
  - 20-day trial, 14-day returns, three activations
