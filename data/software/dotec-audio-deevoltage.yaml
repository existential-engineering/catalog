description: DeeVoltage is a saturator plugin that adds density and presence to tracks, ranging from subtle harmonic warmth to extreme distortion with its METAL Mode for intense, aggressive tones.
details:
  - DeeVoltage is a saturator plugin from Dotec-Audio designed to add life, energy, density, and presence to tracks through enhanced harmonics and saturation. It covers the full spectrum from subtle warmth to extreme distortion, all within a single plugin.
  - The plugin features METAL Mode, which delivers intense, aggressive tones suited for high-gain distortion applications. It also allows independent shaping of positive and negative waveforms, enabling creative sound design possibilities that go beyond standard saturation.
  - DeeVoltage is effective on individual tracks as well as the master bus. It is compatible with a wide range of DAWs including Ableton Live, Cubase, Logic Pro X, Pro Tools, Studio One, and FL Studio, among 19 or more tested hosts.
  - A free demo version is available for download (approximately 25MB for Windows, 57MB for macOS) with a 1-second silence inserted every 30 seconds. The full version requires internet connection for registration.
  - The plugin is available for $50 USD with discount options including coupon codes ($10 off), serial key holder discounts ($15 off), and bulk purchase discounts ($15 off when purchasing a second product). Sound design by Franck Shigetora; UI design by IZMOJUKI and FUKUDAKOGYO; developed by DOTEC-AUDIO.
