details: |-
  A modern score does as much work in sound design as it does in melody. The tension under a scene is as likely to come from a detuned drone or a granular texture as from the string section. Phoenix, the new deep hybrid synthesizer from Spitfire Audio and Grammy-nominated composer and technologist BT, carries a soaring theme into a storm of cinematic sound design — composed one moment, decomposed the next, under the fingers of a single patch.

  Within every note, six synthesis engines percolate and intermodulate, sharing a unified architecture and signal path — spectral wavetables, FM, sampler, 2OP FM transients, subharmonic generation and a complex noise oscillator, all breathing, undulating, evolving. Add brain-breaking cross-modulation, modulation built on the rhythmic language of BT's patented StutterEdit, and 37 bespoke effects, and this is a synth for truly intricate, cinematic sound design.

  Save 20% - on introductory offer until 25th October.
specs: |-
  - 552 presets
  - 6 synthesis engines
  - 37 effects
  - Full MPE support with up to 16 voices of stereo polyphony
  - 80-plus warp modes across two serial slots
  - File size: 40 GB
  - 80 GB or more free space needed for installation
  - macOS 15 or later, Intel and Apple Silicon supported
  - Windows 10 22H2 or Windows 11, 64-bit
  - Minimum 16 GB RAM, 32 GB recommended
  - SSD and 64-bit DAW required
