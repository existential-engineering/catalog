details: |-
  Akkordica is a virtual accordion, concertina, bandoneon, harmonica and
  melodica instrument that covers a wide range of sounds and combines a
  traditional hand-held bellows-driven performance and modern digital
  functionality.

  This squeeze box and free reed wind instrument is suitable for different
  musical styles, be it traditional, popular or classical.

  A wide selection of sounds, playing and feeling the traditional sounds as well
  as the new vast array built-in effects for the digital age, to reproduce many
  different accordion types (diatonic and chromatic) for various genres of
  musical styles such as folk, rock, blues, jazz, polka, tango, bal-musette,
  cajun, zydeco, classical, schrammelmusik, klezmer, levenslied, sevdalinka,
  boeremusiek, forr, merengue, cueca, milonga, chamam, cumbia, vallenato,
  norteo, tex-mex, saltarello, tarantella, ceol, basque trikitixa and inuit
  music.

  These universal 2 binary (arm64) plugins run natively on both apple silicon
  (m1, m2, m3) and intel-based mac computers.

  Implementation of MIDI continuous controller parameters for use with external
  hardware control via DAW.
specs: |-



  - Mode selector

  - Anglo concertina

  - Chemnitzer concertina

  - Hohner accordion

  - Strasser accordion

  - Musette accordion

  - Bandoneon (tango accordion)

  - Bayan (chromatic button accordion)

  - Melodeon (diatonic button accordion)

  - Steirische harmonika (styrian accordion)

  - Piano keyboard accordion

  - Accordina (harmonicon)

  - Harmonica (natural)

  - Harmonica (vibrato)

  - Melodica (pianica)

  - Adsr envelope generator

  - Low frequency oscillator section

  - Modulation rate and depth

  - Pitch bend

  - Filter section

  - Virtual reverb room

  - Amplitude range parameters

  - MIDI cc automation

  - MIDI continuous controller parameters

  - Windows 11, windows 10, windows 8.1, windows 8, windows 7 (32 or 64-bit)

  - Macos sonoma 14, macos ventura 13, macos monterey 12, big sur 11, catalina
  10.15, mojave 10.14, high sierra 10.13, sierra 10.12

  - Universal 2 binary (arm64) plugins

  - Apple silicon (m1, m2, m3) and intel-based mac computers

  - DAW host application with vst2 support (32 or 64-bit) and/or vst3 support
  (64-bit)

  - MIDI keyboard controller

  - Asio compatible sound card
