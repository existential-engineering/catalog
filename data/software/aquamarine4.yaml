details: |-
  Aquamarine4 is a high-end mastering and mixing plugin suite which is ideal on
  virtually all kinds of musical genres thanks to its extended versatility.

  It includes a monster compressor that we sampled from one of the most highly
  regarded - and not exactly cheap - units on the market - featuring a smooth
  and warm sounding opto comp section and a super punchy, discrete vca-style
  dynamic processor which can go from a subtle 1.2:1 ratio - for a gentle
  dynamic massage - to savage 'flood' limiting, for more creative compression
  effects.

  Aquamarine4 now features an astoundingly precise recreation of an american
  ultra-rare passive equalizer from the 1950s.
specs: |-
  - Opto compressor section
  - VCA-style dynamic processor
  - Compression ratio 1.2:1
  - Flood limiting
  - Passive equalizer
  - macOS compatible
  - Windows compatible
