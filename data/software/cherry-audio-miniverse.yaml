description: >-
  A painstaking virtual analog emulation of the Minimoog Model D synthesizer
  with expanded polyphony up to 16 voices.
details: |-
  Miniverse is a painstaking virtual emulation of the granddaddy of all portable synthesizers, the venerable Model D. Introduced in 1971, no other instrument is more associated with the word synthesizer, and it is perhaps the best-known and loved analog synthesizer ever made.

  Miniverse was conceived as the ultimate tribute to the original instrument. Cherry Audio focused on a single principle of absolute authenticity, studying and measuring every nuance, every curve, and every response of the audio to faithfully recreate the Model D experience.

  Three oscillators offer triangle, sawtooth-triangular, ramp sawtooth, square, wide rectangular, and narrow rectangular waveforms through the classic four-pole 24 dB/octave ladder filter. Feedback and sidechain with accurately replicated overdrive deliver the unmistakable warmth and grit of the original.

  Whether seeking monstrous leads, funky basslines, or warm atmospheric pads, Miniverse delivers with monophonic and polyphonic modes supporting 1, 2, 4, 8, or 16 voices. Over 250 factory presets, MIDI Polyphonic Expression support, and ultra-low CPU optimization make it ready for any production scenario.
specs: |-
  - Three oscillators with six waveform types
  - Classic four-pole 24 dB/octave ladder filter
  - Feedback and sidechain with accurately replicated overdrive
  - Over 250 factory preset patches
  - Monophonic and polyphonic modes: 1, 2, 4, 8, or 16 voices
  - Pitch bend range settings: 1-24 semitones
  - MIDI Polyphonic Expression (MPE) support
  - Complete MIDI control and DAW automation
  - Preset and global level MIDI mapping
  - Focus zoom-in feature
  - Ultra-low CPU load optimization
  - User-adjustable oversampling control
