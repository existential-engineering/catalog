details: |-
  Miniverse is a virtual emulation of the granddaddy of all portable synthesizers, the venerable Model D. Introduced in 1971, no other instrument is more associated with the word "synthesizer", and it is perhaps the best-known and loved analog synthesizer ever made. Though its innards weren't identical to the massive modular synths, it shared the thick, juicy, "fat" analog sound that remains unchallenged 50 years later. It set the standard for future synthesizers, inspired whole new genres of music, and defined the sound of artists as diverse as Kraftwerk, Herbie Hancock, Rick Wakeman, Pink Floyd, Parliament, Gary Numan, and countless others.

  Miniverse was conceived as a tribute to the original instrument, focused on a single principle: absolute authenticity. It was developed in association with DSP specialist Mark Barton (MRB), with every nuance, curve and response of the audio studied and measured. The interface is a meticulous recreation of the original, from the maple cabinet and textured surface to the unmistakable "Cosmo" knobs and switches. Extra features such as additional LFOs or effects were deliberately left out so as not to distract from the spirit and vibe of the classic model.

  Whether the goal is monstrous leads, funky basslines or warm atmospheric pads, Miniverse covers it. Where one classic synth voice isn't enough, two, four, eight or sixteen polyphonic voices can be dialled in. Miniverse also includes a library of over 250 presets created by professional sound designers, spanning brass, keys, percussion, sound effects, MIDI Polyphonic Expression (MPE) presets, and the signature basses and leads the Minimoog is renowned for.

  Custom MIDI controller mappings can be saved to individual presets, globally, or both.

  MINIMOOG and MINIMOOG MODEL D are registered trademarks of Moog Music and INMUSIC MMI ACQUISITION LLC. There is no association, affiliation or endorsement of Cherry Audio or its products by Moog Music or InMusic.
specs: |-
  - Faithful virtual analog emulation of the legendary Model D hardware
  - All features of the original in a realistic interface exactly as the original
  - Three oscillators with triangle, sawtooth-triangular, ramp sawtooth, square, wide rectangular, and narrow rectangular waveforms
  - Classic four-pole, 24dB/octave ladder filter
  - Feedback and Sidechain, replicating the original instrument's External Input function with accurately replicated overdrive characteristics
  - Fully programmable with over 250 factory preset patches created by pro sound designers
  - Monophonic and polyphonic modes: 1, 2, 4, 8, or 16 voices
  - Pitch Bend Range settings: 1, 2, 3, 4, 5, 7, 8, 12, 22, 24 semitones
  - Accurate modeling of inherent oscillator mixer and VCA overdrive characteristics
  - MIDI Polyphonic Expression (MPE) support for expressive performances using MPE-compatible controllers
  - Complete MIDI control and DAW automation for all controls, with MIDI learn
  - Preset and Global level MIDI mapping
  - Focus zoom-in feature
  - Highly optimized coding for optimal performance with ultra-low CPU load
  - User-adjustable oversampling control
  - macOS requirements: macOS 10.13 or above, macOS 13 Ventura supported, 64-bit required, native Apple M1 or greater processor support including Ultra, 3.4 GHz Quad-Core or M1 CPU with 8GB of RAM recommended
  - Windows requirements: Windows 7 or above (including Windows 11), 64-bit required, Quad-core computer with 8GB of RAM recommended
  - MPE requires a DAW and hardware controller supporting MIDI Polyphonic Expression
  - Internet connection required for product activation
