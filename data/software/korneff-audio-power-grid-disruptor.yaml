description: A DAW-synced glitch and destruction processor that adds damage, drive, bit crushing, decimation and impact samples to a track.
details: |-
  The Power Grid Disruptor adds glitch and distortion effects to a track, syncing to the DAW tempo so the effects stay in time. It includes a ducker.

  The Disrupt button is momentary: the effect builds while it is held and triggers on release. Drive, BitCrush, Decimate and Noise can each be selected on their own, or set to "All" so the audio runs through all four simultaneously.

  Over 40 different samples are selectable, giving a large number of Surge and Impact combinations. The LMM (Last Minute Modeling) process, developed by Dan Korneff, plays the Disruptor forwards and backwards in time, with adjustable direction, duration and length.

  The Impact Duck parameter attenuates the dry signal so the impact sample is audible. At 100% the dry signal is removed entirely and only the sample remains.

  The Glitch Engine offers four patterns: Stutter, Gate, Random and Chaos.
specs: |-
  - Disrupt button that builds tension while held and detonates on release
  - Drive, BitCrush, Decimate and Noise stages, selectable individually or all at once
  - Over 40 selectable Surge and Impact samples
  - LMM (Last Minute Modeling) forward and reverse playback with adjustable direction, duration and length
  - Impact Duck control that silences the dry signal, up to complete removal at 100%
  - Glitch Engine with four patterns: Stutter, Gate, Random and Chaos
  - Syncs to DAW tempo
  - Software-based licensing, no USB or hardware dongle and no special drivers
  - Activation on up to four machines at the same time
  - Internet connection required for activation and for all demos
  - Minimum: Intel, AMD or Apple Silicon i5 quad core processor
  - Minimum: 4GB of RAM
  - Minimum: Mac OS X 10.14 or later
  - Minimum: Windows 7 and above
  - Linux minimum: Ubuntu 18.04 LTS or equivalent (x86-64)
  - Linux recommended: Ubuntu 20.04 LTS or later, Debian 11+, Fedora 36+, or any modern distribution using glibc 2.28 or newer
  - Minimum screen resolution: 1024 x 768
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
  - Linux 64-bit: VST3, LV2
