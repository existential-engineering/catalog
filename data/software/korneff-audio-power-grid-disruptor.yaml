description: The Power Grid Disruptor is the answer to dull, lifeless mixes.
  Blow up your tracks and the local substation with the latest from Korneff
  Audio!
details: |-
  Holy Crumbling Infrastructure, Batman! Korneff Audio's latest plug-in is shockingly good! Add Power to your Mixes: add glitch and damage to your tracks, sync to the DAW with no more rushing or dragging, add bite and the smell of burnt rectifier tubes to guitars, and it has a ducker. Everything should have a ducker.

  You're gonna need a bigger surge protector. This may look like a joke, but it's real and it actually works.

  Hold to Chaos, Release to Impact. The Disrupt button works like a detonator: hold it down to build tension, release it to blow everything up.

  Make Things Crispy! Sure, you could choose Drive OR BitCrush OR Decimate OR Noise. Or you could set it to "All" and run your audio through all four simultaneously. Go from "Licking a Nine Volt" to "French Kissing a Truck Battery" with the click of a mouse!

  Ride the Glitch! The Glitch Engine offers four patterns: Stutter, Gate, Random, and Chaos. Each setting has the perfect amount of WTF?
specs: |-
  - Disrupt button that works like a detonator, held to build tension and released to trigger the impact
  - Four destruction processors, Drive, BitCrush, Decimate and Noise, selectable individually or all four at once
  - Over 40 different samples for combinations of Surge and Impact
  - LMM (Last Minute Modeling) process runs forward and backwards in time, with adjustable direction, duration and length
  - Impact Duck parameter silences the dry signal so the impact sample can punch through, up to a full 100% duck
  - Glitch Engine with four patterns: Stutter, Gate, Random and Chaos
  - Syncs to the DAW tempo
  - Licensing: software-based licensing with no USB or hardware dongles and no special drivers, up to four (4) simultaneous machine activations, internet connection required for activation and for all demos
  - Minimum system: Intel, AMD or Apple Silicon i5 quad core processor, 4GB of RAM, Mac OS X 10.14 or later, Windows 7 and above, screen resolution 1024 x 768 or higher
  - Linux: minimum Ubuntu 18.04 LTS or equivalent (x86-64), recommended Ubuntu 20.04 LTS or later, Debian 11+, Fedora 36+, or any modern distribution using glibc 2.28 or higher
  - Supported plugin formats: Mac 64bit (VST3, AU, AAX), Windows 64bit (VST3, AAX), Linux 64bit (VST3, LV2)
