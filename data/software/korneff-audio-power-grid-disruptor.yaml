description: Power Grid Disruptor adds glitch and damage to your tracks with
  distortion, bit-crushing, decimation, and noise generation effects. Features a
  Disrupt detonation-style button, a glitch engine with four patterns, and over
  40 impact samples with DAW synchronization.
details: |-
  Power Grid Disruptor is a glitch and damage effect plugin from Korneff Audio. At its core is the Disrupt button, which triggers a detonation-style effect with hold/release mechanics that introduce controlled chaos into your audio signal.

  The plugin features four simultaneous effect engines — Drive, BitCrush, Decimate, and Noise — that can all run at the same time for layered sonic destruction. With over 40 different impact samples, each triggering of the Disrupt button produces a unique result.

  The Glitch Engine offers four patterns — Stutter, Gate, Random, and Chaos — giving producers precise or unpredictable rhythmic disruptions that sync to the DAW tempo. The Impact Duck parameter controls how much the impact samples duck against the main signal.

  The plugin is software-licensed (no USB dongle required) and supports up to four simultaneous machine activations per license.
