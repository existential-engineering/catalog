description: FREE vintage tape saturation plugin by HoRNet. Add analog warmth with two tape speeds and 4x oversampling. VST3/AU for Mac & Windows.
details: |-
  Digital recordings sound clean and precise, sometimes too clean. We all love the convenience of digital recording, with unlimited tracks, instant recall and a zero noise floor, but mixes can feel sterile or separated because digital capture is linear: it doesn't react, it doesn't push back, it just records.

  HoRNet TapeLite brings back the non-linear behaviour of magnetic tape. It adds the harmonic distortion, the subtle compression and the frequency bumps that act as the glue for your tracks, based on the legendary Otari MX80, with selectable 15 IPS and 30 IPS modes and fixed 4x oversampling.

  The modelled machine was the workhorse of the late analog era, known for being cleaner than 60s tube machines while having more vibe than early digital recorders: punchy low end, smooth highs, and a saturation curve that feels musical rather than broken.

  Tape speed changes the physics of how sound is magnetized onto the reel, and TapeLite gives you both classic options. 15 IPS is warmer and fatter with rolled-off highs, a stronger low-end head bump and more saturation at lower levels, suited to drums, bass, electric guitars and lo-fi textures. 30 IPS is brighter, tighter and more transparent, with extended high-frequency response, less noise and a flatter low end, suited to vocals, acoustic guitars, the master bus and modern pop or rock mixes.

  Gain staging is handled by the Input and Output controls, so you can drive the input harder for more saturation and compression and level match on the output for fair A/B comparisons. Bias controls the magnetization current, smoothing high frequencies and changing the distortion texture, while Mix provides built-in parallel processing to thicken tracks without losing transient definition. TapeLite is the little brother of the flagship Tape MK2, sharing the same DSP engine while Tape MK2 adds five emulated decks, adjustable oversampling up to 8x and auto gain.
specs: |-
  - Authentic emulation based on the Otari MX80 tape machine
  - Selectable 15 IPS and 30 IPS tape speeds
  - Fixed 4x oversampling
  - Input and Output gain staging controls
  - Bias control for high-frequency smoothing and distortion texture
  - Mix control for built-in parallel processing
  - 64-bit internal precision
  - macOS 10.13+ (Apple Silicon native) and Windows 10+
  - No copy protection, no iLok required
