description: FREE vintage tape saturation plugin by HoRNet. Add analog warmth with two tape speeds and 4x oversampling. VST3/AU for Mac & Windows.
details: |-
  HoRNet TapeLite brings back the non-linear behavior of magnetic tape. It adds the harmonic distortion, the subtle compression and the frequency bumps that act as the glue for tracks, countering the linear, non-reactive character of digital capture.

  The emulation is based on the Otari MX80, the workhorse of the late analog era, known for being cleaner than 60s tube machines while having more vibe than early digital recorders: punchy low end, smooth highs and a saturation curve that feels musical.

  Two tape speeds are selectable. 15 IPS is warmer and fatter, with rolled-off highs, a stronger low-end head bump and more saturation at lower levels, suited to drums, bass, electric guitars and lo-fi textures. 30 IPS is brighter, tighter and more transparent, with extended high-frequency response, less noise and a flatter low end, suited to vocals, acoustic guitars and the master bus.

  Controls cover input and output gain staging, the speed toggle, a bias control that sets the magnetization current and changes the distortion texture, and a mix control for built-in parallel processing.

  TapeLite is the smaller sibling of Tape MK2 and uses the same DSP engine for the tape recorder model, with one deck instead of five, fixed 4x oversampling instead of adjustable up to 8x, and manual rather than automatic gain.
specs: |-
  - Authentic emulation based on the Otari MX80
  - Two selectable tape speeds: 15 IPS and 30 IPS
  - Fixed 4x oversampling
  - Input and output gain controls
  - Bias control
  - Mix control for parallel processing
  - 64-bit internal precision
  - macOS 10.13+ (Apple Silicon native) and Windows 10+
  - VST3, AU and AAX formats
  - No copy protection and no iLok required
