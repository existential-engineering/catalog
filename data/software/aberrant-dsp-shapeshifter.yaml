details: |-
  ShapeShifter is a one-of-a-kind dynamics remodeler and character compressor
  inspired by SketchCassette's NR Comp algorithm. It molds a blend of multi-band
  upward and downward compression into a toolbox for adding color, body, and
  grit to your sounds.

  The plugin features upward and downward compression controlled with a common
  Ratio, a Transients section with separate Ratio and Threshold controls for
  independent downward compression control, and an upward compression Floor
  control for taming room sound or unwanted noise.

  Flexible envelope shaping is available through Attack and Release time
  controls, along with a Tone adjustment for broad shifts in color and
  character. The wide-ranging Drive control offers two models: A (gentle) and B
  (hard), with an Asymmetry control for harsher, grittier textures via
  even-order harmonics.

  A Dry/Wet mixer enables easy parallel processing. The custom preset system
  includes 64 factory presets. Requires Windows 10+ (VST3, AAX 64-bit) or macOS
  10.13+ Intel or Apple Silicon (AU, VST3, AAX 64-bit).
specs: |-
  - Upward / Downward compression with common Ratio
  - Transients section with separate Ratio and Threshold controls
  - Upward compression Floor control
  - Attack and Release time controls
  - Tone adjustment for color and character
  - Drive control with two models: A (gentle), B (hard)
  - Asymmetry control for even-order harmonics
  - Dry / Wet mixer for parallel processing
  - 64 factory presets
  - Windows 10+ (VST3, AAX 64-bit)
  - macOS 10.13+ Intel or Apple Silicon (AU, VST3, AAX 64-bit)
