description: Combining the sonic excellence of two completely discrete
  compressors with extreme flexibility for a fast and simple workflow. Smash &
  Grab 2.0 features a dual compressor design — 'Grab' (VCA-style) for impact and
  attack, and 'Smash' (FET-style) for weight and size — with a Drum Type knob,
  built-in pre/post EQ sections (Beef and Air), saturation control, and a Pro
  mode.
details: |-
  Compression is an extremely important element to all areas of a modern mix, but none more so than drums. Too little, and your drums will lack attack and weight. Too much, and your drums will sound small and lackluster.

  Being how passionate we are about drums we wanted to find a solution to help beginners and professionals alike improve their work flow, and get great results every time. We present to you, Smash & Grab 2.0.

  Smash is based on several FET style compressors. This side of the compressor helps to give your drums length, weight and size. Perfect for snares, rooms, and your parallel bus. Grab is based on several VCA style compressors, helping to give your drums impact and attack, and is great for shaping kicks, toms and controlling overheads.

  The drum type knob is a very simple yet powerful control. Each drum is optimized for its particular style, taking the headache out of finding the right settings, compressor, EQ points and more.
specs: |-
  - Dual compressor design: Grab (VCA-style) for attack and impact; Smash (FET-style) for weight and size
  - 12 specialized styles of compression
  - Drum Type knob with hundreds of preset optimizations
  - Built-in pre-compression EQ ('Beef') and post-compression EQ ('Air')
  - Built-in saturation control
  - Pro mode giving full access to both compressors
  - Disk: 100 MB
  - Mac: macOS 10.11+, Intel/M1/M2, VST3/AU/AAX
  - Windows: 64-bit Windows 10 or 7, VST3/AAX only
