details: >-
  Acoustic guitar (steel) is described as "very simple and convenient, and is
  easy to operate even for users who are not familiar with guitar".


  Two types are available: pick version and finger version. All the guitar
  playing skills can be fulfilled and displayed on the main page of guitar
  interface.


  Many guitar playing skills have been represented authentically, including:
  standard, natural harmonic, various sliding sounds, chords and finger noises.
  All the sounds are sampled authentically from top musical instruments and
  acclaimed recording equipments.


  Complete guitar attack time and adjustable function of start time, which
  retains the integrity of every note and precision of performance. Exclusive
  rhombic sampling design means that in often-used range and velocity, sampling
  density will increase, otherwise reduce.


  Technique for same pitch circulation (robin) makes that each pitch of guitar
  has different circular timbre. Background noise is low, and the sampling
  process is extremely precise.
