details: |-
  AmpFire is a special effect designed for metal guitar players. AmpFire is a
  preamplifier, distortion, power amplifier and speaker cabinet simulator in
  one.

  Ampfire contains 38 speaker cabinet models, 8 distortion/preamp models, 4
  clean guitar amplifier models and an acoustic guitar simulation.

  Features include a built-in noise gate, 13 preamp/distortion models, 4 clean
  amp models, acoustic guitar simulation, 8 distortion models, 3 band equalizer
  for every preamp/distortion model, 38 amp/cabinet models, bass and treble
  control, and loudness control.

  Ampfire includes a separate preset manager with over 80 presets and is
  designed to be easy to use with low cpu usage (less than 4% on p4 2.4ghz).
specs: |-
  - Built-in noise gate
  - 13 preamp/distortion models
  - 4 clean amp models
  - Acoustic guitar simulation
