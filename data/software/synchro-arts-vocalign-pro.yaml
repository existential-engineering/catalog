details: |-
  VocAlign Pro is the advanced tier of Synchro Arts' vocal alignment plugin, adding pitch matching and creative vocal processing on top of the time alignment found in VocAlign Standard. The current release is VocAlign 6, which introduced dark-theme visuals, Process Groups and SmartPitch.

  Time alignment is described as fast, accurate and transparent, with efficiency features such as SmartAlign for processing vocal stacks and presets for finding a sound quickly. Processing speed and accuracy are further supported by Process Groups and improved Sync Points.

  Tightness Control sets the strength of the alignment, so a natural sound can be maintained in any vocal scenario or genre by dialing the tightness of the alignment up or down with a single knob.

  Pitch matching applies the pitch of the guide track to any other vocal track, removing the need to pitch correct twice when working with vocal stacks. SmartPitch intelligently determines when tuning needs to be applied to backing vocals, which the page describes as harmony tuning.

  Pro-only capabilities beyond Standard are Match Pitch, Formant Shift, Transpose, Protected Areas, Process Groups and SmartPitch. The plugin is SynchroLink enabled for connection with RePitch Standard, and VocAlign 6 added Pro Tools ARA compatibility, Arm Capture All and Undo/Redo.
specs: |-
  - Match Timing
  - Align multiple tracks (supported ARA-compatible DAW required)
  - SmartAlign
  - Tightness Control
  - Match Pitch
  - Formant Shift
  - Transpose
  - Protected Areas
  - Process Groups
  - SmartPitch
  - Improved Sync Points
  - Pro Tools ARA compatibility
  - Arm Capture All
  - Undo / Redo
  - SynchroLink enabled (connection with RePitch Standard)
  - 2 activations per licence
  - macOS 10.14 or higher, Intel or Apple Silicon (M Series) processor, AU, VST3 or AAX 64-bit host
  - Windows 10 or higher, Intel or AMD processor, VST3 or AAX 64-bit host
  - Apple Silicon version of Logic does not support ARA plug-ins
