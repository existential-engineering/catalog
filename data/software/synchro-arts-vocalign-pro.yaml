description: Advanced vocal timing and pitch-matching with creative vocal processing features like formant shifting and transpose.
details: |-
  VocAlign Pro includes all features from VocAlign Standard plus formant shifting, pitch alignment, group processing, SmartPitch, and improved sync points. Licensed with 2 activations per license as a digital download for Mac and PC. macOS requires 10.14 or higher on Intel or Apple Silicon (M Series); note that Logic Pro on Apple Silicon does not support ARA plugins. Windows requires Windows 10 or higher on Intel or AMD processor with a VST3 or AAX 64-bit host. SynchroLink enabled for connection with RePitch Standard.
specs: |-
