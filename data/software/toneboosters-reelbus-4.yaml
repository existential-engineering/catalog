details: |-
  Faithful tape simulation across various recorder types. Master bus mode for quick warmth addition. Configurable tape start/stop times. Tape echo and flanger effects. Tape wear simulation for creative effects. Drive EQ for frequency-specific saturation control. Tape hysteresis, saturation, and compression. Wow-and-flutter effects. Hiss and asperity noise adjustment. 16-channel immersive audio support.
specs: |-
  Sample rates up to 384kHz. Up to 16 channel spatial audio support. Personal perpetual license for up to 4 computers.
