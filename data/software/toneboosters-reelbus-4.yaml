description: Magnetic tape recording, echo and flanger simulator covering everything from the 80s compact cassette sound to professional 30-IPS studio recorders. Adds tape hysteresis, saturation, compression and musical wow-and-flutter, with tape echo and flanger effects as a bonus.
details: |-
  Simulation of the 80s compact cassette sound through to professional 30-IPS studio recorders. Adjustment of tape hiss and asperity noise. Sweeten your mix with a touch of tape hysteresis, saturation and compression, or create that 'Boards of Canada' sound with some musical wow-and-flutter. ReelBus is the perfect magnetic-tape track 'glue', and generates tape echo and flanger effects as a bonus.

  The ReelBus master mode is the fastest and easiest way to get that signature tape sound. Dial in the tape recording level, compression, hysteresis and tape noise to get results fast. Engage the 'High Quality' mode to step up your results a notch, while you watch those analog VU meters do their magic.

  ReelBus tape recorder mode provides the ultimate control with a unique drive EQ, different tape saturation models, and control over saturation, hysteresis, compression, tape spectrum, wow and flutter, tape wear, hiss and asperity noise. Dial in anything between pro-quality reel-to-reel decks and broken compact cassette tape, and anything in between.

  ReelBus features a tape flanger and two independent tape echo modules for vintage flanging and echo effects. Use ReelBus as a creative send or insert effect using its dedicated insert or send effect modes.

  The unique drive EQ controls how hard different frequencies are driven into tape saturation. It works similar to a pre-emphasis EQ prior to tape recording with a perfectly matching inverse de-emphasis EQ at the output. Presets are neatly organized in a program browser with search, import and export across Windows, macOS, iOS and iPadOS, and drag and drop to move programs across libraries or categories.
specs: |-
  - Faithful tape simulation, from compact cassette to pro deck
  - Master bus mode for fast warmth
  - Configurable tape start and stop times
  - 16-channel immersive audio support
  - Tape echo and flanger effects
  - Tape wear simulation for creative worn-out tape effects
  - Unique drive EQ for frequency-dependent tape saturation
  - Personal, perpetual desktop licence for use on up to 4 computers
  - Resizable user interface, fits every screen and resolution
  - Dozens of color themes
  - Undo, redo and A/B switching
  - Preset management: organize, import and export presets
  - Easy license activation, no hardware dongle required
  - Sample rates of up to 384kHz
  - Windows 10 or up, 64-bit DAW with VST, VST3 or AAX support, Intel or AMD SSE2 processor
  - macOS 10.13 or up, 64-bit DAW with VST, VST3, AAX or AU support, Intel or Apple Silicon processor
  - Linux, 64-bit DAW with VST or VST3 support, Intel or AMD SSE2 processor, glibc 2.31 or up
  - iPadOS / iOS requires an AUv3-compatible host
