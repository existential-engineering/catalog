description: Advanced Clipper is basically a hard-clipping plugin with two
  stages. Additional oversampling reduces alias noise.
details: |-
  The oversampling algorithm is based on butterworth filters and thus will
  affect the group delay (you can notice a delay of some samples in extreme
  cases).
specs: |-
  - Two stages of minimum phase butterworth oversampler
  - Hard clip at higher sample rates
  - Oversampling of up to 16x in both stages
  - Filter order up to 64
  - Tunable transition frequency in parameter view
  - VST plugin format
  - Windows compatible
