description: "A complete simulation of the disk mastering process for
  referencing and early quality control. Offers hands-on insight into disk
  cutting with specialized preprocessors, virtual cutting lathe, turntable
  pickup models, and metering tools."
details: |-
  Version 1.1.1. Precise virtual disk cutting lathe with four configurations. Classic disk mastering filter section with highpass, lowpass, and elliptical filters. Extensive metering: groove excursion, width, velocity, gain on disk. Three physically modelled turntable pickups. Groove microscope for accurate inspection in all dimensions. Disk inspection via heatmaps for Excursion, Width, Velocity, and Land. Multi-side and multi-disk support. HTML project report generation. Support for imperial and metric units.
specs: |-
  Windows 7 or above. Mac OS X 10.9 or above. VST2, VST3, Audio-Unit, or AAX compatible plugin host. OpenGL support required. 64-bit only.
