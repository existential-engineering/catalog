description: Senfine is a handmade extensive toolkit that features a collection of truly atmospheric and emotive sounds which will inject elusive magical atmosphere into your productions. It combines deeply sampled guitars, orchestral instruments, drums, and synthesizers in a custom-built Kontakt engine designed for cinematic ambient and post-rock music.
specs: |-
  - Requires full Native Instruments KONTAKT 5.8.0 or higher (free Kontakt Player insufficient)
  - 130+ instruments
  - 3,600+ samples
  - 5.94 GB hard drive space (9.92 GB original samples)
  - Audio format: 48 kHz / 24-bit lossless NCW
  - Instrument categories: Ambient Keys (8), Synths (59+: pads, plucks, dream synths, basses, leads), Guitars (23: tremolo, ambient, overdrive, distortion, bass, 8-string, swell & ebow), Orchestral Warps (8+: strings, woodwinds, brass, piano warp), Full Drums (kicks, snares, toms, cymbals, hi-hats, rides, sticks)
  - Custom engine features: graphical EQ, atmosphere designer, macros, LFOs
  - Download via Pulse downloader with automatic extraction
