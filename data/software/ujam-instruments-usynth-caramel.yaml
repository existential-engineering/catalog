description: Usynth CARAMEL comes with all the rich, lush pad sounds you could ever want. Creating dreamy ambient soundscapes is easy, with the heavy lifting done behind the scenes (wavetable selection, unison, effects and far more).
details: |-
  Usynth CARAMEL comes with all the rich, lush pad sounds you could ever want. Creating dreamy ambient soundscapes is easy, with the heavy lifting done behind the scenes (wavetable selection, unison, effects and far more), meaning less time spent on sound design and more time spent finishing songs.

  Synth pads: what would music be without them. They can lift you up, embrace, seduce and enhance a track, like sprinkling the right amount of spice on a dish to bring its ingredients to shine.

  Usynth is UJAM's "smartphone camera" take on the synthesizer, in that under the hood it is a very powerful, versatile, professional instrument but with a user interface designed for musicians. The Surprise function creates random variations of adjustable depth, and everything can be affected by the randomization: every control and button, including the preset selections for Sequencer, Synthesizer and Finisher.

  For soloing and effects you can bend Usynth's pitch using a MIDI controller, usually a wheel. Each synthesizer preset in Usynth has been set up with what the sound designer deemed the most useful modulation.
specs: |-
  - Fully customizable sequencer
  - 2 individual layers per note
  - Custom Finisher featuring 90 presets
  - Surprise function creates random variations of adjustable depth across every control, including Sequencer, Synthesizer and Finisher preset selection
  - Mod and pitch bend via MIDI controller, with a sound-designer-chosen modulation target per preset
  - UJAM App integrated
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8GB of RAM
  - 1.44GB of free disk space
  - 1280x768px display, internet connection
  - Moving the .blob sample content file to an external drive is not supported
  - Plug-in formats: AAX, AU 2, VST 2 and VST 3, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Requires the latest version of the UJAM App, which installs the Usynth plug-in that hosts all titles
