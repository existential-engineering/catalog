details: |-
  Accurately modeled after the 'black' version of a classic and sought-after VCA
  compressor the sc-5 opens up a whole world of versatility: you're going for
  super gentle compression to sweeten up the signal on your masterbuss? You're
  looking for a colorful or smashed sound on your drum buss? You want to tame
  lively and dynamic material? The BlackAsh SC-5 handles it all.

  The blackash sc-5 adds an external sidechain input that can be engaged by
  depressing the "ext sc" button. The blackash sc-5 is a feedback compressor
  design, thus feeding an external sidechain input into the existing feed-back
  loop circuit would result in feed-forward topology, which would result in
  different compression behaviour. To overcome this problem, the external
  sidechain input is treated just like the normal audio signal, while the
  resulting control voltage is fed into a mirror vca that modulates the audio
  signal. This way feed-back operation can be retained in both the normal and
  external sidechain modes.

  The blackash sc-5 is a fixed threshold compressor: more compression can be
  achieved by increasing the input gain. This will of course boost your signal's
  volume. Drag the input gain knob while holding the right mouse button and the
  output gain will be adjusted so the perceived output level will remain
  approximately the same.

  Our real time spice type component based circuit simulation approach allows to
  authentically capture the sound and feel of the analog counterpart in all
  nuances. Every crucial part of the circuit, including the custom vca design,
  the dual time-constant detector circuit, the feedback compressor loop and the
  audio path have been faithfully modeled. Dsp operations are pipe-lined using
  the sse2 instruction set. This ensures highest possible performance operation
  despite very complex computations.

  Aliasing artifacts are efficiently attenuated using a low latency linear phase
  dolph-chebyshev poly-phase design. The oversampling is auto adjusted to your
  session's sample rate to save valuable cpu power while offering the most
  transparent sound possible. All our plug-ins support high pixel density on mac
  os x and windows to bring you the most enjoyable user experience on high dpi
  displays.
