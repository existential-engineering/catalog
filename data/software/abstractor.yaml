details: >-
  Abstractor is a complete free additive synthesizer with a variety of features.


  Features include additive synthesis, fm, am, xy-pad, and a two step sequencer.


  Includes import from single cycle wave-forms, fft wavegenerator with lfo,
  analog like filter, and 110 presets.


  Functions as a VST plugin and a standalone application for windows.
