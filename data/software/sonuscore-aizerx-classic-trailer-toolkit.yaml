description: AizerX Classic Trailers Toolkit contains a massive collection of different categories like trailer hits, whooshes, braams, and more, universally applicable for hybrid, epic trailer music.
details: |-
  The AizerX Classic Trailers Toolkit is the third main product of the AizerX series from Keepforest studio, built on the original AizerX engine with improved functionality. It keeps the smart sample randomization that creates unique and authentic sound effects, and extends it to be more flexible and effective for building custom sound elements for hybrid and epic trailer music, film scores and any other kind of music.

  The library holds a fresh, hand-crafted collection of high-quality sound effects grouped into categories such as trailer hits, whooshes, suckbacks, downfalls, downers, stutter, risers, braams, resonators, signals, ambient effects, sustains and trailer pianos, each with their own sub-categories. Alongside the effects sits an AizerX synth with presets covering pads, piano, basses, plucks and keys, plus further instruments to explore.

  Like the rest of the AizerX series, the Classic Trailers Toolkit offers deep sound customization through easy-to-use parameters: frequency filters, LFO, ADSR, sample playback modes and a channel mixer, together with an effects section carrying EQ, reverb, delay and distortion, and an XY pad.

  The product is sold by Sonuscore and requires a full version of Native Instruments KONTAKT; the free Kontakt Player only runs the instrument in demo mode.
specs: |-
  - Requires the FULL VERSION of Native Instruments' KONTAKT 5.8.0 or higher (NOT compatible with the free KONTAKT PLAYER, which runs the instrument in demo mode only)
  - Samples in .WAV format, 48kHz (96kHz) / 24bit
  - 5.9 GB of hard drive space (Kontakt Library)
  - 7.7 GB of hard drive space (WAV Samples)
  - Powerful sound design engine with frequency filters, LFO, ADSR, sample playback modes, channel mixer and an XY pad
  - Effects section with EQ, reverb, delay and distortion
  - 39 Trailer Whooshes, 42 Trailer Hits
  - 29 Hybrid Whooshes, 30 Hybrid Hits
  - 51 Organic Whooshes, 53 Organic Hits
  - 65 Whooshes, 37 Braams, 26 Sub Tails, 20 Kicks
  - 48 Crackle snares and claps, 48 Suckbacks
  - 35 Downers, 35 Risers, 12 Shtutter
  - 64 Benders, 90 Sub benders, 113 Elements
  - 23 Trailer Pianos, 56 Resonators
  - 11 Badass intro kits, 12 Tension build-up kits, 7 Downfall kits
  - 8 Loop categories (drums, percussions, pulses, etc.)
