description: >-
  Pam Sync is a FREE simple ‘just works’ DAW plugin for syncing Pamela’s
  Workout to your DAW’s clock via low latency audio signals. It uses 2
  audio (i.e. line-level) outputs from your host DAW to provide the
  necessary clock and run signals. All configuration is done within Pam
  itself. Available as VST3, AU, and AAX.
