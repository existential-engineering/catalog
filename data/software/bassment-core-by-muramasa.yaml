details: |-
  Bassment Core by Muramasa is a simplified yet powerful bass amp and cabinet
  simulator plugin. It is a stripped-down version of bassment that focuses on
  just the amp and cabs, removing additional effects to provide a fast way to
  achieve desired bass tones.

  The plugin features a flexible amp with input gain ranging from gentle to
  brutal, a perfectly tuned 5-band eq, and dedicated controls for bass,
  midrange, and high-frequency treatment. Bass treatment includes a dedicated
  compressor for the low-end, low-pass filter, aggression and presence knobs.
  Midrange controls include frequency, low-cut, brightness, colour, and drive.
  High frequencies have 6 dedicated controls including drive, colour,
  brightness, and corrosion control.

  Bassment core's unique cabinet simulation brings 15 types of cabinet
  simulations combined with 15 alterations, providing over 200 models. The
  cabinet produces a natural sound without relying on simple ir sets.

  The plugin uses 64-bit internal audio processing and can handle any sampling
  rate up to 192 khz or higher. It features intelligent bypass management that
  prevents clicks or harmful noises when automating parameters and compensates
  for latency. Intelligent sleep mode detects when processing is unnecessary and
  temporarily reduces cpu usage to virtually nothing.

  Activation requires no ilok, dongle, or internet access—only license files.
  Users can freely use the purchased software on all their computers. The plugin
  includes a 15-day unlimited trial version with no saving limits, and after the
  trial period expires, it continues working as a second-hand edition with
  limited feature access. Free-for-life updates are provided to keep the plugin
  compatible with current operating systems and daws.
