description: Arcus is an ambient envelope shaping plugin built on SyncBand ADSR Technology. Dual ADSR envelopes operate across two separate frequency ranges from a single trigger source, which can be incoming audio, a sidechain signal, or MIDI, and can be synced to DAW tempo.
details: |-
  Arcus is powered by SyncBand ADSR Technology, which enhances ambient sounds through dual ADSR envelopes spread across two separate frequency ranges. Both envelopes are driven simultaneously by one trigger, so the ambience can be reshaped coherently while each band is still adjusted independently for precise control.

  Three trigger types are available. The Audio trigger uses a threshold control to activate the envelopes when input levels exceed a set limit, with filters that refine the frequency range for more precise triggering. The Sidechain trigger uses filters to focus on specific frequency bands so the envelopes respond only to targeted elements in the signal. The MIDI trigger activates the envelopes from MIDI input for synchronization with other MIDI-controlled elements.

  Arcus can be synchronized to the tempo of the DAW, so envelope shaping is set in musical bars and beats rather than milliseconds. This allows real-time sound sculpting that follows the rhythm of the track.

  Additional shaping tools include Tilt Control for spectral balance, High and Low Pass Filters for managing frequency content, and Phase Inversion for correcting phase issues or creatively altering sounds. Together these make Arcus a tool for exploring new layers and textures inside ambient samples and room tracks.
specs: |-
  - SyncBand ADSR Technology with Wide and Multi-Dual ADSR envelopes across two frequency ranges
  - Independent ADSR adjustment per frequency band from a shared trigger
  - Audio trigger with threshold control and frequency filters
  - Sidechain trigger with band-focusing filters
  - MIDI trigger for synchronization with MIDI-controlled elements
  - Tempo synchronization to DAW bars and beats
  - Tilt Control for spectral balance
  - High and Low Pass Filters
  - Phase Inversion
