description: Arcus is an ambient envelope shaping audio processing plugin featuring SyncBand ADSR technology. It operates across two separate frequency ranges with independent ADSR envelopes that can be triggered by audio, MIDI, or sidechain signals, with DAW tempo synchronization for precise rhythmic control.
details: |-
  Arcus is a simple and easy-to-use ambient envelope shaping plugin built around SyncBand ADSR Technology. It operates across two separate frequency ranges — Wide and Multi-Dual ADSR Envelopes — giving you independent envelope control per band while sharing a common trigger source.

  Three trigger modes let you drive the envelopes in different ways: Audio triggering uses a threshold control and frequency filters to detect transients in your signal; Sidechain triggering routes an external signal to focus on specific frequency bands; and MIDI triggering locks the envelopes to rhythmic note input for tight synchronization with your arrangement.

  Additional sound-shaping tools include Tilt Control for spectral balance, High and Low Pass Filters for managing frequency content, and Phase Inversion. All envelope parameters sync to DAW tempo for consistent rhythmic results.

  Arcus includes an instant digital download, easy activation with a perpetual license, lifetime free updates, and unlimited customer support.
specs: |-
  - Windows 8.1+ (64-bit) — VST3, AAX
