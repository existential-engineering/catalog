description: Risers, build-ups, drops, breaks, downlifters, swells, sweeps, falls – it has never been so easy to hype your audience. Forget samples, just turn the knob or let LiftFX even do that for you, automatically, in beat sync at the length you need it to be.
details: |-
  Build-ups and risers are core parts of modern music and trailer productions. They are what catches a listener and generates an unstoppable tension over time, culminating in a peak that can move a whole stadium of people. LiftFX is built to achieve exactly that, covering risers, build-ups, drops, breaks, downlifters, swells, sweeps and falls, all in beat sync at whatever length is needed.

  Rather than dragging samples into a project, which then have to be synced and tuned and whose individual components cannot be altered, LiftFX relies on real-time synthesis to generate builds on the fly. Every aspect is freely alterable in a few clicks while remaining sharp and clear over insane lengths. The plug-in works as a generator plug-in or virtual instrument: hit any key and let the effect develop automatically, or use the modwheel to control it live. Each of the four macros is automatable independently and steers the complex processes happening under the hood, and the interface gives instant visual feedback on what is happening.

  LiftFX is built on the synthesis engine of BOOM Library's award-winning TURBINE plug-in. Where Turbine emulates turbojet sounds with precision and authenticity, LiftFX takes the original concept further and pours the synthesis technology gathered since then into musical FX. Because it is synthesis-based rather than sample-based, it is a lightweight plug-in.

  The library ships with a 275-strong package of presets covering risers and downlifters, both tonal and noise-based, bass drops, rhythmic and percussive builds, basic and more complex designs, and bonus FX. Sound adapts quickly to any track: LiftFX starts out in perfect sync to the DAW but any pitch, duration or tempo is possible, and a timelock control lets different presets be auditioned while keeping the same length. High cut and low cut filters, reverb and delay are built in. The plug-in requires an audio host application and does not work standalone.
specs: |-
  - Real-time synthesis based riser and transition generator, no samples
  - Built on the synthesis engine of BOOM Library's TURBINE plug-in
  - Playable in real-time with instant auditive and visual feedback
  - Works as a generator plug-in or virtual instrument, triggered from a keyboard
  - Any length, tempo, pitch range and root note possible
  - Tempo sync or time (s) duration
  - Control key parameters independently or automatically, including reversed
  - Automation and modwheel (CC1) support for each parameter, four independently automatable macros
  - 275 presets included
  - Optional time lock and control lock to try different presets with the current setting
  - High cut and low cut filters, reverb and delay
  - Lightweight plug-in, as it relies on synthesis
  - Format: software plug-in (VST, AU, AAX) for Windows and Mac
  - Requires an audio host application; does not run standalone
  - Works in hosts supporting VST 2.4, AU or AAX (Logic Pro, Pro Tools 11+, Cubase, Nuendo, Ableton Live, Reaper)
  - Requires a free iLok account; machine license activation or iLok USB dongle (2nd generation or newer)
  - Required hard disk space: 154 MB
  - Available as download
  - Windows: Windows 8 (64-bit), 4 GB RAM, Intel Core i5
  - Mac: macOS 10.13 (64-bit), 4 GB RAM, Apple Silicon or Intel Core i5
