details: |-
  Shimmering Beauty. Exquisite Detail

  A bold and shimmering Venus Concert Harp, effortlessly balancing delicacy and elegance. With its broad dynamic range, Centurion Harp 1 can evoke the gentlest feathery pianissimo or strong fortissimo passages. We wanted to capture the full magic of the harp, preserving the natural essence of the instrument. The Harp offers a versatile range of plucking techniques, including long and soft sustains, short plucks, harmonics, bisbigliando (tremolo), and an extensive selection of glissandi in various scales. With three meticulously captured microphone perspectives - intimate close, balanced decca tree, and airy wide - you have the flexibility to achieve the ideal mix for every composition, ensuring a rich and immersive sonic experience. We have taken great care to maintain the subtle nuances, including the feather-like touch, airy shimmer, and even the faint hiss, which contribute to the authenticity and character of the softer tones. If you appreciate the organic beauty of the harp and seek a collection that embraces its natural qualities, Centurion Harps are the perfect choice.
