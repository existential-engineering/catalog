details: |-
  Enjoy studio monitor sound in your headphones with Re-Head, a unique
  head-response plugin. Re-Head uses a head response model to recreate the
  effect of your head and skull on the audio coming in from your speakers.
  Together with stereo processing, impulse response treatment, EQ and more,
  Re-Head takes care of the most common problems associated with headphone use
  in professional work: unnatural sound and ear fatigue.

  Listening through headphones creates an unnatural sound that's quite different
  from how we hear music from speakers. Re-head will create a mixing room
  experience when using headphones, even when recording distorted guitars and
  other instruments that tend to sound unnaturally in-your-face in a headphone
  mix.

  At the center is a head response model that mimics the effect of your own
  skull on your hearing when listening through loudspeakers. Add to that stereo
  processing to avoid the hard-panned sound so common in headphones, a spectrum
  analyzer and eq. There is even an impulse response representation of your
  favored mixing room to let you feel right at home, even when you're not.

  Warning: when the plug-in is placed on the master bus, do not forget do
  disable it when exporting a mix!
specs: |-
  - Head response model
  - Stereo processing
  - Impulse response treatment
  - EQ
  - Spectrum analyzer
  - Adjustable virtual speaker position and angle
  - Brightness adjustment
  - Impulse response (IR) loader
  - Channel flip (left/right)
  - Zero latency
