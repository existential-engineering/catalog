description: MIDI generation plugin that produces melody, rhythm, bass, pad and chord parts at the click of a button using an algorithmic composition engine. Includes a piano roll editor and drag and drop MIDI export across five tracks.
details: |-
  InstaComposer is a MIDI generation plugin that produces melody, rhythm, bass, pad and chord parts at the click of a button. It uses an algorithmic composition engine to choose notes, harmonies and chords according to the settings supplied.

  That engine combines mathematical rules with musical knowledge and takes a set of user parameters into account, from repetition probability to the complexity of chord shapes. Harmonic variation, strumming technique and note density are among the adjustable options in the lower panel.

  Generation respects the chosen scale, time signature and riff length. New sequences can be created for one track, several tracks or all five at once, in any combination of melody, rhythm, bass, pad and chord.

  An onboard MIDI editor allows the output to be reworked inside the plugin, with notes moved, copied, deleted and re-velocified in a piano roll interface. Tracks can be dragged straight into a DAW, or the MIDI can be routed to multi channel instruments so all five tracks play back without leaving the plugin.

  A large factory preset library supplies musical motifs as starting points that can grow into whole tracks.
specs: |-
  - Intelligent MIDI generation plugin
  - Creates melodies, phrases, riffs and chords
  - Five tracks generated simultaneously
  - Multi track and multi channel MIDI routing
  - Automatic harmony and chord progression generation
  - Piano roll MIDI editing with velocity control
  - MIDI drag and drop export
  - Multiple time signatures
  - Controls for probability, complexity and variation
  - Sync start and stop to host playback, quantize start and follow song position
  - Per track chord inversion and add bass note options
  - Undo and redo for note changes
  - Factory presets
  - Full PDF manual and tutorial video
  - Windows 10 or 11 or higher, 64 bit
  - macOS 10.15 or higher, 64 bit
