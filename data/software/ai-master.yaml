details: |-
  Ai master automatically analyses your music and applies the optimal settings to achieve a great sounding fully mastered track. Ai master will enhance and optimise the dynamic range, spectral balance, stereo field and overall level to conform to established standards, making your music ready to distribute across multiple platforms, and played on any audio system.

  No user input required other than switching from 'analyse' to 'master' mode when the track has finished playing.

  This plugin analyzes your mix and automatically takes care of everything you need for a great mastering - loudness, stereo image, eq, etc.

  There are no presets or mastering style options. Each mix gets its own private treatment according to its analysis.

  All you have to do is to play your track on your DAW (you have to keep the right mix level) while the plugin is in analyse mode. Once the track ends just click master and than the magic happens.
