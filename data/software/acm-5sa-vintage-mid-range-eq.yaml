details: >-
  Inspired by the vintage pultec meq-5 mid-range eq, the acm-5sa combines
  high-performance processing with an intuitive stylized user interface.


  A versatile mid-range equalizer capable of subtle sonic enhancement or more
  obvious presence - highlighting elements of a mix without harshness or
  fatigue.


  Ideal for acoustic instruments, drums and vocals.


  Transformer-coupled valve / tube amplifier emulation enhances the desirable
  vintage tone. Innovative processing models analogue filter behaviour - without
  additional latency or high cpu demand.


  Valve / tube emulation adds subtle character even with the eq bypassed. The
  acm-5sa is also part of the acm-sa-series bundle.
