description: "An advanced spectral and resonance processor with a focus on audio
  mastering contexts. Uses advanced minimum phase filtering techniques for
  detailed spectral control without interfering with transients and phase
  relationships."
details: |-
  Version 1.0.10. Three primary parameters: Depth for processing intensity, Timing for smoothness, Guard as a protective layer for spectral details. ReTilt feature compensates for applied spectral changes to maintain original tonal balance. Processing independent of input level with set and forget functionality. Transparent demasking tool for mastering applications. 33% latency reduction, new color themes, ALT modifier for curve editing.
specs: |-
  Windows 7 or above. Mac OS X 10.13 or above. VST2, VST3, Audio-Unit, or AAX compatible plugin host.
