description: An advanced spectral and resonance processor with a focus on audio mastering contexts. Uses advanced minimum phase filtering techniques for detailed spectral control without interfering with transients and phase relationships.
details: |-
  OD Finesse is a spectral processor that intelligently manages resonances with exceptional transparency and musical elegance. Three primary parameters provide intuitive control of the operation, each freely adjustable over frequency.

  Depth adjusts the processing intensity, automatically reducing excessive resonances. Timing defines how smoothly the process behaves. Guard sets a protective layer that musically retains favourable spectral details.

  Building on advanced minimum phase filtering techniques, Finesse offers detailed spectral control that doesn’t interfere with the material’s original transients and phase relationships. The unique ReTilt feature intelligently compensates for applied spectral changes to maintain the original tonal balance and perceived loudness. The processing is independent of input level, providing true “set & forget” functionality.

  Ohlhorst Digital is a brand by Jan Ohlhorst. Initially developed exclusively for his work as a mastering engineer, these well refined products are now being made publicly accessible.
