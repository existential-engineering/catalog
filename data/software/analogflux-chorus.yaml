details: |-
  Analogflux is a suite of windows VST effect plug-ins designed to deliver the sounds of the analog days. In the core of these processors voxengo has extensively used convolution processing to match the response of the original analog gear.

  This suite consists of tapebus, delay, impulse, insert and chorus plug-ins.

  Analogflux chorus offers a stereo chorus plug-in which features 8 operators (4 for each output channel) creating together a huge and convincingly-sounding chorus applicable to vocals, guitars and synth instruments.
