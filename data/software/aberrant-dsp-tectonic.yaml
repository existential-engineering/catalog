description: Tectonic is a multi-band toneshaping channel strip. Combining
  equalization, imaging, and dynamics processing, Tectonic is a complete sonic
  toolkit for anything from subtle sweetening to total tonal transformation.
details: |-
  Tectonic is a multi-band toneshaping channel strip combining equalization,
  imaging, and dynamics processing into a complete sonic toolkit.

  The plugin provides 4 bands of upward/downward compression. Boosting a band
  applies upward and downward compression, while cutting applies only downward
  compression. Each band offers -12 dB to 12 dB trim gain, selectable transition
  frequencies between adjacent bands, and per-band Mute, Solo, and processing
  Bypass.

  A Mid/Side panner per band allows independent stereo narrowing and widening of
  each frequency range. Master controls include mix, input gain, and output
  gain.

  Six style selections adjust the feel and intensity of the dynamics processing.
  The custom preset system includes 65 factory presets. Requires Windows 10+
  (VST3, AAX 64-bit) or macOS 10.13+ Intel or Apple Silicon (AU, VST3, AAX
  64-bit).
specs: |-
  - 4 bands of upward / downward compression
  - Boost applies upward + downward compression; Cut applies downward only
  - -12 dB to 12 dB trim gain per band
  - Selectable transition frequency between adjacent bands
  - Per band Mute, Solo, and processing Bypass
  - Mid / Side panner per band for independent stereo control
  - Master mix, input gain, and output gain
  - Six style selections for dynamics intensity
  - 65 factory presets
  - Windows 10+ (VST3, AAX 64-bit)
  - macOS 10.13+ Intel or Apple Silicon (AU, VST3, AAX 64-bit)
