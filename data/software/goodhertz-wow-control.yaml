description: "Analog tape and playback device modulation plugin that accurately
  captures the essence of three tape machines spanning three decades. Features
  high-quality wow and flutter effects with HQ Mode, pitch range with expressive
  shape controls, controllable speeds with beat-syncing, three analog tape modes
  (15 IPS, 7.5 IPS, Cassette), magnetic tape coloration and saturation, and an
  advanced randomization section."
details: |-
  HQ Mode for enhanced analog-like sound
  Three analog tape modes: 15 IPS, 7.5 IPS, Cassette
  Pitch range with expressive shape controls
  Controllable speeds, beat-syncing, phase, and stereo phase
  Magnetic tape coloration and saturation modeling
  Advanced randomization section
