description: Add deep, focused low-end resonance without mud. Bass Resonance is
  modeled on the legendary Little Labs Voice Of God 500 Series, bringing focused
  low-end resonance and weight to your mixes.
details: |-
  Shape the weight and depth of your tracks with a focused bass resonance circuit designed to add size, punch, and controlled sub energy. Bass Resonance is modeled on the legendary Little Labs Voice Of God 500 Series, bringing focused low-end resonance and weight to your mixes.

  Tune the Fundamental: sweep the resonance point to lock the low end to the source, from huge kick drums and bass guitars to vocals, synths, and drums.

  Bigger Sound, Less Mud: enhance the lows you want while keeping unnecessary sub buildup under control, helping tracks feel larger without clouding the mix.

  Fast, Musical Control: a simple, direct interface lets you dial in powerful low-frequency character in seconds, from subtle body to massive bass reinforcement.
specs: |-
  - Modeled on the Little Labs Voice Of God 500 Series
  - Sweepable resonance point to tune the fundamental to the source
  - Controlled sub energy to enhance lows without sub buildup
