details: |-
  Bass Resonance is a resonant low-end enhancement plugin modeled on the legendary Little Labs Voice Of God 500 Series hardware unit. It shapes the weight and depth of your tracks with a focused bass resonance circuit designed to add size, punch, and controlled sub energy.

  The plugin features a tunable resonance point that sweeps across the frequency range, letting you target the exact low-end region you need to reinforce. This allows you to enhance low frequencies with precision while avoiding unwanted sub buildup or mud.

  Designed for use on kick drums, bass guitars, vocals, synths, and full drum buses, Bass Resonance provides a simple, direct interface for quick adjustments that work in the context of a mix.

  The plugin is compatible with Mac OS 10.13 or newer (Intel and Apple Silicon) and Windows 7 or newer, requiring a 64-bit DAW and a minimum of 1GB RAM. An iOS version is also available for iPhone and iPad via the Apple App Store.
