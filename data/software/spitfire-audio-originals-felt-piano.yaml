details: |-
  Performed by jazz legend and Mercury Prize nominee Gwilym Simcock, Felt Piano was recorded dry at Spitfire Studios with soft felt placed between the hammers and the strings. Condenser, Ribbon, and Hammers signals. Ten presets, from dry and close, to reverberant and pad-like. ADSR and sustain pedal level control.

  Originals Felt Piano requires the free Splice INSTRUMENT plugin to run.
specs: |-
  - File size: 3 GB
  - 10 presets
  - 3 mic signals: Condenser, Ribbon, Hammers
  - ADSR and sustain pedal level control
  - macOS 12 or later, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
