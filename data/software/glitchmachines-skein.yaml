description: "An FM synthesizer focused on experimental sound design and
  electronic music production. Takes an unconventional approach, diverging from
  classic digital FM synths to prioritize sound design and sonic
  experimentation, generating an incredibly diverse and expressive range of
  tones and timbres through multiple modulation sources and processors."
details: |-
  4 Operator Modules with Skew & Noise
  FM Matrix with Per-Cell Modulation
  8 Overwritable FM Algorithm Presets
  4 LFOs with 15 wave shapes and integrated scopes
  4 Sequencers with 32 steps and 10 utility functions
  4 Multi-Mode Amplitude Envelopes
  2 Multi-Mode Filters (Lowpass, High Pass, Band Pass, Notch)
  12-voice polyphony or monophonic mode with glide
  Quad Multi-Effects Chain (distortion, bit crusher, chorus, phaser, delay, reverb, buffer effects)
  160 factory presets across 4 banks
