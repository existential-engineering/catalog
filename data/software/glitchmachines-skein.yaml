description: Skein is an experimental FM synthesizer built for sound design and electronic music production, not for emulating classic digital FM instruments. It features a 4-operator FM matrix with per-cell modulation depth, paired with multi-mode filters, sequencers, and a reconfigurable effects chain for shaping complex, evolving tones.
details: |-
  4 Operator Modules with Skew & Noise
  FM Matrix with Per-Cell Modulation Depth
  8 Overwritable Factory FM Algorithms
  4 LFOs with 15 Wave Shapes & Oscilloscopes
  4 Sequencers (up to 32 steps each)
  4 Multi-Mode Amplitude Envelopes
  2 Multi-Mode Filters (Lowpass, High Pass, Band Pass, Notch)
  12-Voice Polyphony with Monophonic/Glide Mode
  4 Multi-Effects (distortion, bit crusher, chorus, phaser, delay, reverb, buffer)
  160 Presets across 4 Banks
  Reconfigurable FX Chain Interface
