details: |-
  Audio Unit Manager provides a simple way to organize Audio Units into sets so
  users can load just the Audio Units they need for a particular application.
  This can mean accelerated application launch times and exclusion of
  incompatible Audio Units for some hosts.

  Audio unit manager's command line option makes it possible to select a set in
  an applescript before launching an audio unit host.

  Audio unit manager also makes tedious trial by error trouble shooting easier
  by allowing simple disabling of an audio unit.

  Overview: intuitive main window. Audio units menu. Enable/disable all audio
  units. Verify audio units (via auval) with results. Move audio units to trash.
  One-of-a-kind integrated help desk.
specs: |-
  - Audio Unit hosting
  - Audio Units plugin support
  - Command line option
  - Applescript integration
  - Audio Unit enable/disable
  - Audio Unit verification via auval
  - Audio Unit organization into sets
