description: A dual octave engine delivering thick, musical octave-down weight and crisp octave-up presence in one streamlined plugin. Dedicated Tune controls per octave focus the frequency range of the effect. An advanced detection algorithm delivers consistent, phase-stable performance even on fast transients or harmonically complex sources. Zero latency with minimal CPU load.
details: |-
  Released 2025-06-19 (part of the OCELOT Studio Series). Dual octave engine: independent Oct-1 (octave-down) and Oct+1 (octave-up) sections, each with Amount, Tune, Listen, Bypass, and Solo controls. Tune controls adjust frequency focus range rather than interval amount — the octave interval is fixed at ±1 octave. Global output Level control (±12 dB) with main level meter plus individual meters per octave. Collapsible FFT/spectrum analyzer view showing spectral footprint. State-of-the-art detection algorithm for clean, phase-stable tracking. Zero latency. Minimal CPU load.
specs: |-
  Controls: Oct-1 (Amount, Tune, Listen, Bypass, Solo), Oct+1 (Amount, Tune, Listen, Bypass, Solo), Level (±12 dB), Spectrum Analyzer. macOS 10.9+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+, 2 GHz Intel CPU+, 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX. Activation: Fuse Audio Labs account. 14-day trial available.
