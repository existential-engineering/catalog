details: >-
  Amp locker is an all-in-one solution that seamlessly integrates into your
  recording setup, enabling you to capture studio-grade sound in real-time.
  Shape your sound with a vast selection of virtual stompboxes, amps, cabs and
  effects, opening up endless avenues for musical creativity.


  Immerse yourself in the genuine tones of iconic guitar amplifiers, faithfully
  recreated in the digital realm. Amp locker's amp, pedal and cab collection are
  always expanding, wishing to meet all your tone needs. Try out new amps
  directly within the plug-in interface, opening up a world of sonic
  possibilities.


  In the world of music, your unique sonic fingerprint matters. Amp locker not
  only boasts a diverse array of meticulously crafted guitar amplifiers but also
  houses an ever-expanding treasure trove of effects at your fingertips. With
  our continuously growing fx library, you have the power to mold your tone into
  a sonic masterpiece that resonates with your artistic vision.


  Amp locker comes with free gear to get you started: prestige 1950 - a british
  hotrodded amp. 7 fx pedals - 7 rack fx. 11 3d cabs - fully adjustable with 11
  mics.


  Amp locker is a virtual effect audio plugin and a software application for
  macos, windows and linux. It functions as an audio units plugin, a VST 3
  plugin, an AAX plugin and a standalone application.
