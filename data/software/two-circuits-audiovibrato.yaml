description: Audiovibrato is for those of you who love the sound of vibrato, but
  find yourselves in a sticky situation where your audio has none.
details: |-
  Controls: depth - controls the depth/intensity of the vibrato. Mix - controls
  the dry/wet of the effect and the original input. Rate - controls the rate of
  the vibrato effect, including the option to sync to tempo.

  Sync button - toggles between free-range analog rate vibrato and tempo-synced
  timings - I.e. 4 ppq, 8 ppq, 16 ppq, etc.
specs: |-
  - Vibrato effect
  - Manual rate control
  - Tempo sync
  - Depth control
  - Mix control
  - Rate control
  - Sync button
  - Free-range analog rate
  - Tempo-synced timings
  - 4 ppq
  - 8 ppq
  - 16 ppq
