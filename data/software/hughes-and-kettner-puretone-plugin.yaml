details: |-
  The Hughes & Kettner Puretone plugin by NEMBRINI is a digital recreation of the original Puretone amplifier, which was developed with an unmistakable personality for individual expression and has become a legend over the years. Built for tube purists, it is a no-frills, straightforward original.

  The Puretone offers a single channel for pure, stunning sound. You can evoke anything from crystal-clear clean tones to blues crunch and even rough-and-ready overdrive. Every detail is crafted to ensure your guitar signal remains pristine.

  The GROWL feature allows you to cut the tone stack, delivering an unfiltered and raw guitar sound. The Puretone plugin delivers the same inspiring tone, reliability, and feel as the original, now with the convenience of a plugin for your recording sessions. Enjoy the pure tone and let it guide your music.
specs: |-
  - 6 carefully selected cabinet emulations
  - 4 premium microphone emulations used in real recording sessions
  - A powerful impulse response (IR) loader to load your favorite IRs
  - Selectable microphone positions with volume and pan controls
  - Pre-amplifier stomp section featuring noise gate, filters and overdrive
  - Post-amplifier effects section with equalizer, tape delay and spring reverb
  - System: Intel compatible or Apple Silicon CPU
  - System: 1GB RAM
  - System: Mac OS 10.13 or newer
  - System: Windows 7 or newer
  - System: 64-bit DAW
  - Plugin formats: VST2, VST3, AAX or Audio Units compatible host
