description: Outer Space is a faithful Roland RE-201 Space Echo plugin, an
  iconic vintage tape echo made in the early seventies (macOS, Windows, Linux,
  iOS).
details: |-
  Outer Space is a faithful Space Echo plugin emulation, the iconic vintage tape echo made in the early seventies. As the original unit, Outer Space features a tape echo section with three playback heads and two spring reverb tanks.

  AudioThing modelled three different tape frequency responses and saturations, along with all the analog imperfections of tape recording/playback. The ballistic response of the delay rate (repeat rate) is also modelled, which can create eerie pitch shifts (due to the Doppler effect), one of the classic tape echo-based sound effects.

  Introduced in 1974, the Roland Space Echo RE-201 was an instant hit among engineers, guitar players, and dub pioneers. A real analog system providing both tape echo and spring reverb for a rich and organic sound.

  Three different tape types are modelled: the original RT-1L, a more modern replacement, and an older worn out tape. Each tape will affect the sound in a subtle but different way, especially at higher feedback (Intensity) settings. WOW/Flutter, Drops, and other parameters will also change according to the selected tape, creating different amounts of pitch and volume changes. Changing the speed of the repetitions (Repeat Rate) will also affect the tape frequency response.

  Just like the original unit, with the Mode selector you can choose 12 different combinations of echo playback heads and reverb: 4 Echo only, 7 Echo+Reverb, and 1 Reverb only. Outer Space 2 is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP), and on the App Store for iOS and iPadOS (AUv3 and Standalone).
specs: |-
  - Vintage Tape Echo
  - 3 Tape modes: Original, Modern, Old
  - Spring Reverb (Dark/Bright and Short/Long)
  - Background Noise with Envelope
  - Oversample up to 16x
  - Mix Control
  - Resizable Window
  - Brightness and Contrast Controls
  - Preset system with randomizer
  - Soft Clip
  - Mono Sum / Stereo Control
  - Volume/Pan for each Head
  - Low/Hi Cut for Feedback Section
  - Drops control
  - Pre-Emphasis Filter
  - Rate Ballistic control
  - Variable Speed (± 50 ms)
  - Preamp switch
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP 64-bit)
  - macOS 10.13 - macOS 26, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP 64-bit)
  - 1 license up to 3 computers, no iLok, online or offline authorization
