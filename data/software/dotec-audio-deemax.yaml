description: DeeMax is a VST2, VST3, AU, and AAX maximizer plug-in that adds
  loudness with a single slider control. It features fat saturation, a TURBO
  switch for punchier sound, a SAFE switch for real-time saturation monitoring,
  and a MONITOR switch for constant-volume evaluation. Low CPU usage makes it
  suitable for live performance.
details: |-
  DeeMax is a maximizer plug-in developed by Dotec-Audio that aims to add loudness without disturbing the character of a mix. Its defining design philosophy is simplicity: a single slider controls the entire loudness process, making it accessible for producers at any skill level.

  The plug-in produces fat saturation as the slider is increased, adding harmonic richness alongside volume gain. The TURBO switch engages a mode that delivers a more punchy, aggressive sound character for material that benefits from a harder transient response.

  The SAFE switch monitors the signal in real time and guards against excessive saturation, helping users avoid over-processing. Paired with the MONITOR switch, which locks the output to a constant volume for fair A/B comparison, DeeMax provides basic but effective quality-control tools around its core loudness function.

  DeeMax is optimised for low CPU consumption, making it viable for use in live performance contexts as well as studio mixing and mastering. The plug-in has been tested for compatibility with more than 20 DAWs, including Ableton Live, Cubase, Logic Pro X, Pro Tools, Studio One, FL Studio, and Reason.

  DeeMax was originally released in November 2015 and has been updated through January 2026. Sound design was by Franck Shigetora, UI design by IZMOJUKI and FUKUDAKOGYO, developed by Dotec-Audio.
