details: >-
  3dx is the first release under magnetica studio's "novonotes" brand which is
  focused on the development of innovative sound production software. It
  combines the highest sound quality with a sophisticated workflow and an
  intuitive interface to herald a new era of immersive 3d sound.


  Although novonotes 3dx incorporates all the functions needed for 3d audio
  production including panning, binaural processing, and ambisonics, its refined
  workflows allow the system to be operated intuitively, thus freeing and
  inspiring creators to do what they do best create sound.


  The incorporation of an acoustic field hpl (headphonelistening) processor
  marks the start of a new era in 3d audio by connecting hpl with many creators.
  Hpl is a binauralization technology that enables artists and engineers to
  deliver the precise balance and mix of music to the listener through
  headphones without compromising the sound quality.


  Features include all the functions needed for 3d audio production (panning,
  binaural processing, and ambisonics) in a single plug-in, transparent
  high-resolution sound without unwanted artifacts, a newly designed 3d panner
  for dynamic sound image movement, and sophisticated workflows that eliminate
  complex effects chains.
