details: |-
  Velvet is a virtual electronic piano that combines five legendary electric pianos from the 60s and 70s into one versatile instrument. Based on the fender rhodes suitcase, fender rhodes mk I and mk ii stage pianos, wurlitzer 200a and hohner pianet-t, velvet accurately emulates the sound quality, response, and nuances of each original instrument to bring your piano tracks to life.

  Velvet features a pallet of onboard effects and allows you to control every aspect of the sound for unparalleled realism: turn up the tube drive controls in the preamp section to warm up your tone; adjust the timbre, dynamic response, and velocity curve to customize the playing feel; and mix in the sound of pedal and other keyboard mechanical noises to recreate an authentic electric piano track.

  Db-33 tonewheel organ is a virtual organ that recreates the sounds and controllability of classic tonewheel organs such as the hammond b3, and the rotary-speaker cabinets they are often played through. It includes 122 preset sounds plus an extra-realistic convolution rotary cabinet and tube overdrive emulation. The rotary-speaker cabinet can also be used as an effect in its own right on an audio track.

  Mini grand is a simple to use yet powerful virtual piano instrument with seven different acoustic piano sounds to suit a broad range of musical styles and production needs.
