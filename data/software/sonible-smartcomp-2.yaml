description: smart:comp 2 is a spectro-dynamic compressor plug-in that learns
  from the input signal to set its parameters and blends broadband compression
  with Spectral Compression across more than 2000 bands. It has been replaced by
  smart:comp 3.
details: |-
  smart:comp 2 analyzes the incoming audio during a learning pass and computes ratio, threshold, attack and release for a well-balanced, transparent result, with instrument, bus and mix profiles to prime it for different sources. Spectral Compression then works like an ultra-high-resolution multiband compressor across more than 2000 bands, applying gain reduction only where the spectrum needs it; set to zero, the plug-in behaves as an ordinary broadband compressor.

  Sound-shaping tools go beyond the first smart:comp. The Attack and Release Shaper adds hold and curve shape to both time constants, with tempo-synced release, and a Free-form Transfer Function with a level histogram allows shapes such as expansion below the threshold. A Style control moves the character from clean to dirty.

  In external sidechain mode, Spectral Ducking carves space in the main signal only where the sidechain source sits. Mid/side and 5.1 surround processing, input riding, a soft-clip limiter, a sidechain EQ and eight states complete the feature set. sonible released smart:comp 2 in July 2022 and replaced it with smart:comp 3 in December 2025.
specs: |-
  - AI-driven learning with instrument, bus and mix profiles
  - Spectral Compression across more than 2000 bands
  - Spectral Ducking in external sidechain mode
  - Attack and Release Shaper with hold, shape and tempo sync
  - Free-form Transfer Function with level histogram
  - Style control from clean to dirty
  - Mid/side and 5.1 surround processing
  - Input riding and soft-clip limiter
  - Sidechain EQ
  - Eight states
  - Plug-in formats: AU, VST, VST3, AAX
  - Authorization: machine-based or iLok
  - Windows 10 (64 bit) or later, macOS 10.12 or later
  - Intel Core i5 or Apple M1, 4 GB RAM, OpenGL 3.2 or later
