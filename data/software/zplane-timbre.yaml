description: A real-time formant-shifting plugin for reshaping the character of
  vocals, instruments, entire mixes and more.
details: |-
  TIMBRE is a real-time formant-shifting plugin for producers, mixing engineers, and sound designers. Reshape the character of vocals, instruments, loops, and full mixes without affecting pitch.

  Unlike EQs that boost frequencies or pitch shifters that change notes, TIMBRE transforms the formants that define a sound's identity, offering an entirely new approach to mixing, vocal production, and creative sound design. TIMBRE delivers immediate, musical results with an ultra-low latency of just 23ms.

  Use the built-in noise generator for whisper-like textures, or feed any external sidechain signal into TIMBRE for expressive formant vocoding with remarkable intelligibility.

  TIMBRE is powered by an expanded timbre-shifting engine based on zplane's renowned ÉLASTIQUE technology, which also powers the ELASTIQUE PITCH plugin. Where ELASTIQUE PITCH shifts pitch and formants by ±12 semitones, TIMBRE shifts the formants of an audio signal by ±36 semitones without shifting the pitch, and can operate in dual-band mode for greater control over the processing.

  Two independent formant-shifting bands allow processing to be applied to only one frequency range, or different processing to two frequency ranges. Linking the High and Low Shift controls applies the same processing across the entire frequency range, and per-band bypass disengages processing for one band.
