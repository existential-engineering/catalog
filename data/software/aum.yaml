description: "AUM is the flexible audio mixer, recorder, and connection hub for
  your ipad, iphone and ipod touch."
details: |-
  AUM is the flexible audio mixer, recorder, and connection hub for your ipad,
  iphone and ipod touch.

  Connect hardware inputs and outputs, audio unit extensions, inter-app audio
  apps, audiobus, soundfile players, built-in signal processing and filters, in
  any configuration you want. Route anything to anywhere with mix-busses, effect
  sends, audiobus ports, and external multi-channel audio interfaces.

  Play hosted synths and instruments using the built-in keyboard or external
  MIDI controllers, or sequence them from other apps using virtual MIDI.

  Record mixes, individual tracks, or both, straight into the storage space of
  audioshare (no copying of files needed). Play back recordings, soundfiles and
  loops as channel sources in the mixer for backing tracks, further processing
  or mixing.

  Synchronize everything with the sample-accurate transport clock and play in
  time with other apps or devices using ableton link, a new technology that
  synchronizes beat, phase and tempo of ableton live and link-enabled ios apps
  over a wireless network.
specs: |-
  - Audio Unit extensions hosting
  - Inter-app audio apps support
  - Audiobus support
  - Built-in signal processing and filters
  - Mix-busses
  - Effect sends
  - Audiobus ports
  - External multi-channel audio interfaces support
  - Built-in keyboard
  - External MIDI controllers support
  - Virtual MIDI
  - Audio recording to audioshare
  - Soundfile playback
  - Loop playback
  - MIDI matrix routing
  - Sample-accurate transport clock
  - Ableton link synchronization
  - Stereo processing nodes
  - Mid/side balance and conversion
  - Eqs and filters
  - Limiting
  - Clipping and saturation
  - MIDI control of all mixer controls
  - MIDI control of hosted plugin parameters
  - MIDI control of built-in plugin parameters
  - 3rd party Audio Unit extension support
  - Inter-app audio effect support
  - iOS 13.2.1 compatible
  - Auv2 v1.3.5
