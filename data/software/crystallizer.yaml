details: |-
  Crystallizer is a granular echo synthesizer based on the Eventide H3000's Reverse Shift algorithm. It combines pitch shifting and reversed echo to transform simple melodies and chords into shimmering, textured soundscapes.

  The effect employs old-school pitch-shifting techniques that introduce audible artifacts, creating the characteristic glitchy, 80s-futuristic character essential to the sound.

  The plugin enhances the original concept with modern conveniences including MIDI sync, automation, a built-in Gate and Duck feature for dynamic control, and low/high-cut filters for tonal shaping.
specs: |-
  - Recreates classic H3000 crystalline sounds
  - Pitch shifting granular reverse echo synthesis
  - MIDI tempo sync and automation support
  - Gate and Duck dynamic control features
  - Low- and high-cut filters for sound shaping
  - 200+ preset library
  - 64-bit only, sample rates 44.1 kHz to 192 kHz
  - Apple Silicon compatible
