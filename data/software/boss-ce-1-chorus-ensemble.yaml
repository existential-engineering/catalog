details: |-
  In 1976, boss originated the chorus effect pedal. Its warm, analog stereo
  chorus and vibrato have been heard on countless tracks--particularly on
  guitars, bass and electric keys.

  Universal audio was commissioned by roland to accurately model the ce-1. The
  ce-1 provides a choice of either chorus or true pitch shifting vibrato.

  The vibrato/chorus "stomp switch" allows for chorus or vibrato effects, while
  the normal/effect stomp switch bypasses the effect. One knob is dedicated to
  the chorus intensity, while two knobs allow manipulation of the vibrato depth
  and rate.

  When used with stereo tracks, the ce-1 may be used in "classic mode"
  (l=direct, r=delay) which behaves exactly as the original pedal or "dual mode"
  which acts as two ce-1's patched using their mono outputs (direct+delay). In
  this mode, the lfos are 90 degrees out of phase (quadrature) for maximum l-r
  spread.

  Accurate model of original ce-1 chorus effect with look, controls, and
  operation of its analog cousin.
specs: |-
  - Stereo chorus
  - Vibrato
  - True pitch shifting vibrato
  - Chorus intensity control
  - Vibrato depth control
  - Vibrato rate control
  - Classic mode
  - Dual mode
  - LFO quadrature phase
  - Input gain control
  - Bypass switch
  - Chorus/vibrato stomp switch
  - Normal/effect stomp switch
  - macOS support
  - Windows support
