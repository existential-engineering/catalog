description: Free kick shaping plugin carrying the tools of the kick module from the KSHMR Essentials multi effect. Eight single dial controls cover sub tuning, mid and high frequency adjustment, transient shaping, tape saturation, multiband and single band compression and stereo width.
details: |-
  Essentials Kick is a free kick shaping plugin from the collaboration between the producer KSHMR and W. A. Production. It is based on the artist signature Essentials multi effect plugin and carries the same tools as that plugin's kick module, presented on a single page.

  Eight controls make up the chain. Sub handles bass frequency tuning, Mid adjusts the middle band and Air adjusts the high frequencies. Transient shaping sharpens the initial hit, and Tape applies saturation and distortion.

  Pressure provides multiband compression, Compressor provides single band compression and Width sets the stereo spread. The single page layout keeps the interface simple and the plugin light on CPU.
specs: |-
  - Free kick shaping plugin
  - Based on the kick module of the KSHMR Essentials multi effect
  - Sub control for bass frequency tuning
  - Mid control for middle frequency adjustment
  - Air control for high frequency adjustment
  - Transient control for shaping the initial hit
  - Tape control for saturation and distortion
  - Pressure control for multiband compression
  - Compressor control for single band compression
  - Width control for stereo spread
  - Single page interface, light on CPU
  - Windows 10 or 11 or higher, 64 bit
  - macOS 10.15 or higher, 64 bit
  - AAX requires Pro Tools 12 or higher
  - Apple Silicon native and arm64 support from version 1.1.0
