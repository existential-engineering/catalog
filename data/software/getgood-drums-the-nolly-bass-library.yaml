description: 'A signature Kontakt bass instrument built around Adam "Nolly" Getgood''s personal Dingwall NG6, capturing the percussive attack, rich distorted midrange, and massive low end heard on Periphery 5: Djent Is Not A Genre. The library features 3 selectable tonal options, intelligent alternate picking control, and a fully-featured UI with mix-ready built-in processing. Full NKS integration is included alongside built-in pitch shifting and MIDI transpose tools.'
details: |-
  Kontakt Player Library with full NKS integration. Recorded on Nolly's personal Dingwall NG6. Features 3 selectable tonal options, intelligent alternate picking control, E0 to G4 range, built-in pitch shifting and MIDI transpose tools. Requires Kontakt Player 7 or Kontakt 7.
specs: |-
  - Requires Kontakt Player 7 or Kontakt 7 (latest version)
  - macOS 11, 12, or 13 (64-bit only; Apple Silicon via Rosetta 2; Intel i5+)
  - Windows 10 or 11 (32/64-bit; Intel Core i5 or equivalent)
  - 4 GB RAM minimum (6 GB recommended)
  - Disk: 22 GB
  - Mac: Standalone, VST, AU, AAX
