description: 'A signature Kontakt bass instrument built around Adam "Nolly"
  Getgood''s personal Dingwall NG6, capturing the percussive attack, rich
  distorted midrange, and massive low end heard on Periphery 5: Djent Is Not A
  Genre. The library features 3 selectable tonal options, intelligent alternate
  picking control, and a fully-featured UI with mix-ready built-in processing.
  Full NKS integration is included alongside built-in pitch shifting and MIDI
  transpose tools.'
details: |-
  After many years of fine tweaks and meticulous refinement, both live on stage and in the studio, Nolly has crafted an instantly recognizable signature bass sound that has helped define the sound of an entire genre.

  A perfect symbiosis of technique and equipment, Nolly's tone is renowned for its percussive attack, rich distorted midrange and massive low end; and now, for the first time ever, that sound is yours. Introducing the long-awaited, especially requested Nolly Bass Sample Library.

  Bring the power and versatility of Adam “Nolly” Getgood's signature sound to your music. While no one can have him in their band, you can all have him in your productions.
