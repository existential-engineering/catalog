details: |-
  Get all the tools you need to measure, monitor, understand your audio signal and also reuse these measurements to control other plug-ins or any MIDI controllable hardware.

  Blue cat's dp meter pro plug-in will tell you everything about your audio levels. Blue cat's freqanalyst pro and freqanalyst multi plug-ins provide extremely smooth spectrum and frequency content analysis.

  The stereoscope plug-ins series let you visualize the stereo image of your audio content in details.

  While the 'pro' plug-ins offer unique possibilities to create your own signal-controlled effects, the 'multi' versions have unique multiple instances features to perform the analysis on several tracks or anywhere in a signal chain.
