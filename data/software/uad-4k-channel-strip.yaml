details: >-
  The uad 4k channel strip is an exacting circuit emulation of the 4000 g+
  complete with the type e "black knob" four-band eq and filters widely held to
  be the favorite in ssl's signal processing lineage.


  The uad 4k channel strip features high and low cut filters, independent
  expander/gate and compressor/limiter features, plus the famous type e
  four-band eq. The middle eq bands are fully parametric, while the high and low
  bands provide the user with switchable bell or shelving filters.


  The limit/comp provides threshold, a fixed fast or slow attack time, a.1 to 4s
  release, and a continuously variable ratio control. The gate/exp provides
  threshold, a fixed fast or slow attack time, a.1 to 4s release and range to
  tailor the gate or expansion effect.


  The uad 4k channel strip adds a second gate setting which incorporates a
  "no-chatter" gate circuit borrowed from later ssl designs. Pre-dyn button
  reorders the signal chain so that the eq is before the dynamics section.
  Dyn-sc button engages a sidechain feature to achieve frequency-dependent
  compression using the eq, the cut filters or both.


  Lastly, the link button adds the ability to have the sidechain linked or
  unlinked when using the stereo version of the plug-in.
