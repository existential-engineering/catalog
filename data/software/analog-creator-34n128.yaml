  Analog creator 34n128 by wavdsp is a virtual effect audio plugin for macos and
  windows. It functions as a VST plugin, an audio units plugin, a VST 3 plugin
  and an AAX plugin.


  Analog creator is a powerful emulation of the sound character of many real
  analog hardware. The 34n128 is a rare analog vintage 34128 series emulation in
  analog creator.


  Analog creator is a tone shaping plugin on vintage 34128 series. It easily
  adds character, clarity, and color to your audio.


  The wd analog creator 34n128 is a vintage classic model based on real analog
  hardware console. Bring your track, mixbus or master to the legendary 34128
  series.
