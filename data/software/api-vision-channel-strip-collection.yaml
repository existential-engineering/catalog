details: |-
  The iconic color of API's flagship analog console, with expanded EQ. From
  stevie wonder's innervisions to radiohead's in rainbows, API desks have shaped
  hit albums with unmistakable punch, presence, and color for over 50 years.

  In 2013, universal audio released the API vision channel strip plugin,
  artfully capturing API's flagship analog console. Today, the updated API
  vision channel strip collection gives you more authentic API tone, now with
  switchable eq modules and expertly modeled output section, plus all the
  critical recording and mixing functions of API's iconic compression, gating,
  and filter modules.

  Track and mix through a stunning emulation of API's flagship analog console
  channel. Sculpt sources with new 560l series 10-band graphic eq module and
  beloved 550l parametric eqs. Punch up signals through the API 212l preamp with
  famed 2520 API op-amp and custom API transformers.

  Reshape ambience and create dynamic effects with the 235l gate/expander. Tame
  transients and craft bold new textures with API's legendary 225l compression
  circuit.

  Mix with artist presets from joe chiccarelli, neil dorfsman, david isaac, and
  more.
specs: |-
  - 560l series 10-band graphic EQ module
  - 550l parametric eqs
  - API 212l preamp
  - 2520 API op-amp
  - Custom API transformers
  - 235l gate/expander
  - 225l compression circuit
  - Unison (uad2 version with apollo interface only)
  - macOS and Windows compatibility
