description: "Combines the best features of a sonic enhancer and a graphical
  parametric EQ. Applies high quality saturation just where you want it to,
  working like an EQ for better results."
details: |-
  Five-band parallel EQ with graphical workflow. 10 saturation algorithms (tube, warm tube, solid, tape, diode, class B, bit, digital, rectify, half rectify, plus clean mode). Per-band saturation and processing mode selection. Mid/Side processing. 4x and 16x oversampling. Three saturation intensity modes (subtle, medium, aggressive). De-emphasis feature. Resizable UI. No iLok required.
specs: |-
  macOS 10.9+ (Intel and Apple Silicon native). Windows 7/8/10. 64-bit only.
