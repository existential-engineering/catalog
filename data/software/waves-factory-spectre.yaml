description: Spectre is an audio plugin that combines the best features of a sonic enhancer and a graphical parametric EQ. It applies high quality saturation just where you want it to.
details: |-
  Spectre processes the difference between the input signal and the EQ signal. Introduces harmonic content to just the part of the spectrum that you want from a variety of saturation algorithms based on analog hardware.

  Spectre brings colours and life to the sound. It makes dull recordings sound bright, it can make a bass track more suitable for small speakers and it can even work as a high-end stereo widener thanks to the mid/side matrix.

  Spectre processes the incoming signal with a five band parallel EQ. It extracts the difference between this signal and the dry one and process each band through one of the ten saturation algorithms included.

  Spectre is more versatile than a simple enhancer as you can choose from different saturation algorithms: tube, warm tube, solid, tape, diode, class B, bit, digital, rectify and half rectify. An additional clean mode acts like a parallel EQ where the boosts feel extremely natural and unprocessed.

  The de-emphasis feature compensates the EQ boosts after the distortion stage, so harmonics can be added to parts of the spectrum without changing the overall level of the track. Spectre can process mono, stereo, left, right, mid and side channels on each band independently.
specs: |-
  - Five band parallel EQ with difference processing
  - 10 saturation algorithms: tube, warm tube, solid, tape, diode, class B, bit, digital, rectify, half rectify
  - Additional clean mode that acts as a parallel EQ
  - Different saturation algorithm and processing mode per band
  - Per-band channel processing: mono, stereo, left, right, mid and side
  - Mid/side matrix
  - 3 saturation modes: subtle, medium and aggressive
  - Optional 4x and 16x oversampling with no aliasing
  - De-emphasis filters that compensate EQ boosts after the distortion stage
  - Resizable, resolution-independent vector UI with dark mode
  - Presets browsable with the mouse wheel or keyboard arrows
  - No iLok or challenge/response authorisation, serial number only
  - macOS 10.9 or higher, Intel and Apple Silicon (M1/M2) native, 64-bit DAW and OS
  - Windows 7, 8 or 10, 64-bit DAW and OS
