description: ADX Trax Pro 3 boasts faster separation processing speeds, new
  stems file format export, consonants annotation tool, and zoom-to-fit options.
details: |-
  ADX Trax Pro 3 boasts faster separation processing speeds, new stems file
  format export, consonants annotation tool, and zoom-to-fit options; all of
  which allow users to work smarter not harder, when separating and isolating
  melodic content within a mono or stereo mastered mix.

  Adx trax pro 3 also includes spectrogram enhancements, and a first-of-its-kind
  pan-specific editing feature to directly edit audio content in specific slices
  of the stereo field for precision cleanup.

  The original trax software was developed to assist producers, audio engineers,
  djs, and all creative artists in isolating vocal or melodic motifs to create
  new hooks, innovative remixes and virtual duets.

  Trax enables users to raise or lower the level of a vocal or solo instrument
  in a mono or stereo mix without requiring access to the multi-track sessions.

  Trax pro adds a unique approach to spectral editing to this already powerful
  technology. Using our innovative, non-destructive spectral editing tools, it
  is now possible to further refine the results you get from the initial trax
  separation process.
