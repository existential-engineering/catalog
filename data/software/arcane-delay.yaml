details: >-
  Arcane delay is audio fx plugin which create and manipulate with echoes in
  easy way. Contains two filters for each signal side (left and right). It is
  not classic feedback delay, each delay is individual.


  Instead control each delay separately, only start and end state of delay is
  set. Process between start and end state can be linear or curved.


  With that options can be simulated classic feedback delay, and with filters
  make low or hi frequencies disappear in time.
specs: |-
  - VST 3 plugin
  - Two delays (left and right)
  - Delay range 1ms to 1000ms (1 second)
  - Tempo sync mode from 16 to 1/2 note (triola and dotted)
  - Minimum 1 and maximum 128 delays per side
  - 2 filters per side
  - 3 filter types (lowpass, highpass, bandpass)
  - Resonance control
  - Amplitude controls (start and end of signal level with curve control)
  - Filter controls (type, start and end frequency, resonance, curve control)
  - Ping-pong mode
  - Dry/wet control
  - Windows compatible
