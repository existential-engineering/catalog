details: |-
  Bbo: izar includes all of the articulations of the low brass prequel hercules,
  sans legatos, played as clusters. You get short notes, marcatos, several
  dynamic articulations (sfz, sffz, various crescendos and decrescendos),
  flutter tonguing, trills, glissandos and fast repetitions, all played as
  half-tone clusters consisting of three adjacent semitones.

  The played note is at the center of three clustered notes, with one a semitone
  higher and the third a semitone lower. The low brass ensemble consists of four
  bass trombones, one bass tuba, and one contrabass tuba. For sustained notes
  you can choose whether to use an additional fff layer.

  There's a preset that combines patches of bbo: hercules (if installed) and
  izar that lets you crossfade from straight notes to clusters. Bbo: izar offers
  the usual mixer presets that integrate seamlessly with all the other modules
  of the big bang orchestra, with the "processed" category offering mixer
  presets such as "compressed", "sparkling", "wall of low brass", "howling
  brass", and "threatening sustain".

  Microphone setup includes main (decca tree stereo), main (decca tree center),
  main surround stereo, high stereo, high surround stereo, mid stereo, and low
  brass close. Download file size is 1.2 gb with an installed file size of 3.6
  gb.
