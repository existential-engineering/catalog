details: |-
  Armchair Guitarist is a vsti plug-in that allows a standard guitar controller
  for the xbox 360, pc or playstation 3 to be used as a MIDI input.

  By using only the controls on the controller itself, the user can change the
  position of the controller's fret buttons to cover any group of five notes on
  the finger board of a virtual guitar.

  Notes can either be played instantly with the fret buttons, or strummed with
  the fret buttons and strum bar.

  Users can also bend notes up or down in pitch using the whammy bar, and flip
  the string order of the virtual instrument to match their own play style.

  Armchair guitarist is compatible with a wide range of hosts, including cubase,
  ableton live, reaper and energy xt.
specs: |-
  - Vsti plug-in
  - MIDI input
  - Fret button controls
  - Strum bar
  - Whammy bar pitch bending
  - String order flipping
  - Virtual guitar fingerboard
  - Five-note fret coverage
  - Compatible with Cubase
  - Compatible with Ableton live
  - Compatible with reaper
  - Compatible with energy xt
  - Xbox 360 controller support
  - Pc controller support
  - Playstation 3 controller support
