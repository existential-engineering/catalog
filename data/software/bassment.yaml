details: |-
  Bassment is a 16-step monophonic bass-sequencer-synth. It consists of three
  main- and four sub-panels through which the sound modulation and sequencing is
  done.

  Synth panel: two oscillators (saw and pulse); both have their own modulation
  sources (lfo, amp and filter envelope generator, distortion etc.).

  Pitch panel: two pitch sequencers named in accordance with their destinations
  (saw/pulse oscillators). Filter panel: two other sequencers routed to filter
  cutoff.

  Each sequencer has similar controllers. With them you can define: start and
  end points. Direction. Tempo of a sequence.

  You can alter the length of the steps and add distortion or 'slide effect' to
  any individual step.
specs: |-
  - 16-step monophonic bass-sequencer-synth
  - Two oscillators (saw and pulse)
  - LFO modulation
  - Amp envelope generator
  - Filter envelope generator
  - Distortion
  - Two pitch sequencers
  - Two filter cutoff sequencers
  - Step length alteration
  - Slide effect
  - Windows
