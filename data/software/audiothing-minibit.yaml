description: miniBit is a 8-bit and chiptune style synthesizer that emulates the
  sound of the 80s best game consoles and retrocomputers with 18 classic
  waveforms.
details: |-
  miniBit is an 8-bit/chiptune style synthesizer plugin that emulates the sound of 80s game consoles and retro computers. It features a main oscillator with 18 waveforms paired with a sub oscillator, a square wave pitched one octave below.

  The waveforms are not bandlimited and will produce aliasing. Using the built-in bitcrusher, you can create even more noisy and retro sounds. From noisy, snare-like steps to ambient subs, miniBit has many uses beyond what one expects from a chiptune synth.

  The Custom Waveform Editor features 32 steps and 8 waveform slots per preset. You can draw your waveforms by clicking and dragging on the editor, or use the built-in examples as a starting point. Each preset has its own set of custom waveforms, and Copy/Paste buttons move a custom wave to another preset.

  miniBit features an 8 step sequencer that can automate pitch, volume, cutoff, resonance, waveform, and downsampling. Sequencing the waveforms generates sounds reminiscent of early trackers and wavetable synthesizers, and each track can be randomized using the dice buttons.

  miniBit is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP, Standalone). It is also available on the App Store for iOS and iPadOS (AUv3 and Standalone).
specs: |-
  - 18 Waveforms + Custom Waves + Sub Oscillator
  - Poly and Mono mode with Glide
  - 2-poles LowPass/HighPass Filter
  - Pitch and Volume Envelopes
  - Delay and BitCrusher effects
  - LFO with multiple destinations
  - 8 Steps Stepper with multiple destinations
  - 128 Presets + Preset randomizer
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP, Standalone 64-bit)
  - macOS 10.13 - macOS 26, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP, Standalone 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP, Standalone 64-bit)
  - 1 license up to 3 computers, no iLok, no internet connection required to activate
