details: |-
  Introducing a more streamlined, easy-to-use AIR Studios Reverb Essentials, an immensely detailed convolution reverb — created in collaboration with the team at London's iconic AIR Studios. Using our very own "Virtual Positioning Technology", you can position your sounds anywhere in the legendary Lyndhurst Hall - one of the world's most sought-after recording spaces.

  With 64 curated presets to suit different instruments based on real-life mixing situations. The Essentials version differs from our flagship AIR Studios Reverb by offering fewer advanced controls. Simply load a preset and play.
