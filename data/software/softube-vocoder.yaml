description: Vocoder plugin is a fun, MIDI-controlled FX great for vintage
  vocoder sounds as well as creative experimentation. A FX plugin that colors
  your sound with classic vocoder vibes, it gives you the feeling of a vintage
  vocoding machine plus Softube sound quality and workflow.
details: |-
  Developed by Bell Labs and used by the military to obscure voiced messages during World War II, the vocoder has had a clandestine foothold in music culture since the 1970s. With subtlety, or not, the vocoder appears on a parade of favorites from Electric Light Orchestra and Imogen Heap to Daft Punk and Herbie Hancock.

  With Softube sound quality and workflow, Vocoder delivers the sensations of vintage machines. A built-in six-voice carrier synth with MIDI capability and an easy-to-use Attack Hold Decay Envelope, plus a visionary Freeze section, mean that you're in for an array of sonic spectacle and revelry. Which is to say, you're gonna have a real good time.

  Softube Vocoder hooks the imagination with the look and feel of vintage vocoders. MIDI capability enables you to record and reproduce the notes that the stellar carrier synth will perform. Softube Vocoder is not an effect that mimics vocoding sounds. Softube Vocoder is true vocoding. Masterful on a multitude of sources, including drums, Vocoder's vintage tone and ease of use make Vocoder suited to electronic and pop music production.

  A pivotal element of Softube Vocoder is the excellent six-voice polyphonic carrier synth. Move between four distinct waveforms, Saw, Square, Noise, and Pulse, with the ability to select octave adjustments, pitch modulation, and Pulse Wave Modulation. The Attack Hold Decay Envelope is simple-to-use and replaces traditional ADSR for in-the-moment performance. While the Unvoiced section provides control of plosive and high-frequency consonant sounds, bringing realism back to drum transients or vocal syllables that might be hard to comprehend.

  Create everything from full-spectrum synth sounds to android exclamations with variable band selection of four, eight, twelve, sixteen, and twenty. Build stereo width by assigning bands left to right based on odd-even numbering. Three knobs make it simple to adjust the sound of the resynthesis section: control resonance, tilt to favor higher or lower bands, and adjust the speed versus slop of all the bands at once. And with the fantastical Freeze section, you can manually make a rhythmic hold of specific formants or employ a DAW sync to set subdivisions of a beat.
specs: |-
  - The look and feel of vintage vocoding with Softube innovations
  - High-quality Softube sound, excellent shaping tools, and an inspiring workflow
  - A superb six-voice polyphonic carrier synth with four selectable waveforms and MIDI capability
  - An easy-to-use Attack Hold Decay Envelope
  - Transpose Chord Mode lets you create a chord with the on-screen keyboard and then transpose it via MIDI Notes
  - Control of plosive and high-frequency consonant sound reproduction via the Unvoiced section
  - Stereo widening that adjusts the amount of spread between even and odd bands
  - Spectral Tilt to swiftly set the spectral weight of the vocoder output
  - Variable band selection between 4, 8, 12, 16, and 20 bands
  - Unique Freeze section that allows rhythmic hold of certain formants manually and via MIDI Notes or a DAW Sync
  - Shape section that controls slop of resynthesis and Emphasis section to manage the response of each band
  - Add subtle vibrato to dramatic wobble effects with the Pitch Modulation section
  - Supports Softube Extended Features panels
  - Carrier synth waveforms: sawtooth, square, white noise, and pulse with adjustable pulse width modulation
  - Carrier synth receives MIDI notes on all channels (omni mode)
  - Master Tune covers plus or minus 2 semitones around A4 = 440 Hz
  - Carrier Attack and Carrier Decay reach approximately 4 seconds fully clockwise
  - Freeze can be clocked by the DAW at 1 bar, 1/2 bar, 1/4, 1/8 or 1/16
  - Output section provides stereo width, Parallel Blend wet/dry mix, and output volume
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26
  - System requirements: Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access (for downloading installers and managing licenses)
  - Three activations
