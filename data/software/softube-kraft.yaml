details: |-
  A classic overdrive pedal that is featured on more of your favorite albums than you probably realize.

  Kraft is included in Amp Room Marshall Suite, Amp Room Bass Suite, and Amp Room Metal Suite.
specs: |-
  - Classic crunch and distortion.
  - Use in Flow Mixing Suite or in Amp Room.
  - Great for guitars or synths.
  - Supported sample rates: 44.1, 48, 88.2, 96, 176.4, and 192 kHz, in both mono and stereo.
  - Requires a Softube account and an iLok account (no physical iLok required).
  - macOS Sonoma 14, Sequoia 15, Tahoe 26; Windows 10 (64-bit), Windows 11.
  - Apple silicon (M1 or newer) supported natively.
