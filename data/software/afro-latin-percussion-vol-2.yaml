details: |-
  Afro-latin percussion vol 2 offers an impressive collection of authentic afro-latin percussion loops, drum hits and mixed percussive ensembles, designed for adding excitement and energy to pre-programmed drum tracks or layering with one-shot drums to create unique and organic percussion grooves.

  Volume 2 focuses on 'drum heavy' afro-caribbean and latin american percussion instruments including; multiple congas, quinto and tumba drums, djembe, bongos, cajon, mini-timbales and timbales.

  The library explores a wealth of different playing styles and rhythms which have been expertly played and recorded by world-class percussionist ed uribe and engineer jeff trueman from new york, usa.

  The result is a unique and highly useable collection of full-bodied afro-latin percussion loops/samples which suit a wide range of musical styles; from house music and electronic genres, to film scores and media/tv applications.

  All loops and samples have been recorded with multiple high-end microphones via API 3124 and avalon vt737sp pre-amps, with sound sources being mixed to perfection (post recording) to achieve finalized high-quality stereo loops, hits and performances.
