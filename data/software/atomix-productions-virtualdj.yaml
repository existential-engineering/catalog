description: DJ mixing and performance software for audio and video, built
  around real-time stem separation and support for more than 300 controllers.
details: |-
  VirtualDJ is Atomix Productions' DJ application for Windows and macOS. The company describes it as the most used DJ software on the planet, citing more than 150 million downloads, and the current release is branded VirtualDJ 2026.

  Real-time stem separation is the headline technology. It isolates vocals, instruments and other elements of a track as it plays, which the application then uses for instant acapellas and instrumentals and for building mashups on the fly.

  Beyond mixing decks, the software carries a library manager with AI-assisted track suggestions, an unlimited sampler, and a set of professional audio and video effects. Video mixing is supported alongside audio, covering a range of media formats.

  Hardware support runs to more than 300 controllers, and the application can also work as a stand-alone mixer without any controller attached. A free VirtualDJ Home edition sits alongside the paid Pro licences.
specs: |-
  - Real-time stem separation for vocals, instruments and drums
  - Instant acapella and instrumental extraction
  - On-the-fly mashup creation
  - Audio and video mixing
  - Built-in professional audio and video effects
  - Unlimited sampler
  - Library management with AI-assisted suggestions
  - Support for over 300 DJ controllers
  - Stand-alone mixer mode with no hardware required
  - Requires Windows 10 64-bit or macOS 10.14 or later
