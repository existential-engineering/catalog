details: |-
  We extended bob perry ducker with side chain low and high cut filters,
  mid/side matrix processing, longer time parameters, gain boosting, a unique
  one shot mode and plenty of lookahead.

  Pro features include m/s ducking, up to 10 seconds attack/release/hold, side
  chain low & high cut filters, one shot mode, and lookahead.

  The one shot mode is designed for special effects and is perfect for pumping
  effects.
specs: |-
  - Side chain low and high cut filters
  - Mid/side matrix processing
  - Gain boosting
  - One shot mode
  - Lookahead
  - M/s ducking
  - Input and output gain from -24db to +24db
  - Attack from .1ms to 10000ms
  - Hold from .1ms to 10000ms
  - Release from .1ms to 10000ms
  - Range/gain reduction/gain increase from -dB to +24db
  - Full m/s matrix on main and aux chains
  - Side chain low cut from 20hz to 10khz
  - Side chain high cut from 50hz to 20khz
  - Listen function
  - Lookahead from 0 to 2000ms
