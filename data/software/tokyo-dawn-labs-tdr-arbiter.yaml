description: "A frequency-specific spectral balancer that operates independently
  of absolute level. Ideal for de-essing, plosive attenuation, and frequency
  balance corrections in mixing, restoration, and mastering."
details: |-
  Version 1.2.1. Six freely adjustable bands with bell, flat top, and shelving shapes. Supports both positive (upward) and negative (downward) control. Harmonic generators for creative sonic compensation. Antialiased, low-distortion algorithm. Band-specific and wideband modulation modes. Band solo and Delta functions. Wideband spectral analyzer. Freely resizable UI with fullscreen capability.
specs: |-
  Windows Vista or above. Mac OS X 10.9 or above. VST2, VST3, AU, or AAX compatible plugin host.
