description: AEVIUM is a powerfully unique collection of fierce lead synths and atmospheric pads, developed in partnership with the premier sound effects and foley production house BOOM Library, sound designed by our team using only source sounds from their Birds Of Prey avian sound effect library as our point of origin.
specs: |-
  - Format: Open Kontakt (.nki) instrument bank
  - Requires: Full Native Instruments Kontakt 5.8 or later (free Player not supported)
  - Samples: 1,810 stereo 24-bit samples at 48kHz
  - Install size: 11.2 GB
  - Layers: 4-layer morphing synthesis engine with XY pad mixer
  - Filters: 39 filter types per layer
  - Presets: 400+ factory presets across 20 categories
  - Effects: 18 DSP effect modules including convolution reverb with 100+ impulse responses
  - Arpeggiator with rhythm, direction, and swing controls
  - Glide/portamento support
  - Random preset generator
  - OS: Windows 7+ or macOS 10.9+
  - CPU: Dual-core minimum, 2 GB RAM minimum
  - Storage: SATA/SSD recommended
