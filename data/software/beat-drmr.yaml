details: |-
  Beat DRMR is a VST/AU plugin for Windows and macOS, instantly providing 178
  drum kits for electro, techno, detroit, minimal, acid and other styles that
  need punchy drums. The pack includes a total 2,136 sounds, the sources include
  airbase, analog rytm, dreadbox, drumbrute, a huge modular system and other
  fancy sources.

  The drum kits include: 10 airbase kits, 13 analog rytm kits, 16 defeated drum
  kits, 8 drumbrute kits, 16 hybrid kits, 10 lectro kits, 19 modular drum kits,
  15 synthetic kits, 16 tr-909 kits, 8 kits taken from its drums, 26 bonus
  percussion kits, and 11 selected synth kits (blofeld, dreadbox, monark, nova
  and others).

  The global and per-channel controls are sensible and intuitive, and make
  adjustments easy to understand.

  Beat drmr has no multi-out access, nor does it allow MIDI control for any
  parameter.

  The ui features oversized pads and undersized knobs that can be difficult for
  some users to click accurately.
