name: B-Decoder - Ambisonic Decoder
manufacturer: digenis
primaryCategory: filter
categories:
  - effect
description: B-Decoder - Ambisonic Decoder is a 3rd order ambisonic decoder with
  speaker distance-amplitude compensation and the ability to specify individual
  speaker distances.
details: |-
  B-Decoder - Ambisonic Decoder is a 3rd order ambisonic decoder.

  Speaker distance-amplitude compensation allows the user to specify the
  individual speaker distance from the center of the listening area, enabling
  decoding for speaker array configurations where the speakers are not equally
  distanced from the center of the listening area. The plug-in allows the user
  to set the speaker's distance from the center only, and the volume is
  automatically adjusted by the plug-in. If the volume of a speaker reaches the
  maximum, and its distance setting is further increased, the volume will not be
  increased. Instead the volume for all the other channels will be decreased
  accordingly. This prevents amplifiers and speakers from distorting, while
  maintaining an accurately volume balanced speaker array. The distance sliders
  have a range of 0 to 10 meters with the default being 5.

  Fully adjustable order-balance per speaker implements four sliders for all
  individual speakers that control the order balance of each speaker. The
  sliders control the percentage of the zeroth, first, second, and third base.
  The user can now control the orders on a per speaker basis.

  Features include fully adjustable per-speaker azimuth, elevation, distance,
  amplitude, and order balance, along with global distance, amplitude, and order
  weighting capabilities.
specs: |-
  - 3rd order ambisonic decoder
  - Speaker distance-amplitude compensation
  - Fully adjustable order-balance per speaker
  - Per-speaker azimuth adjustment
  - Per-speaker elevation adjustment
  - Per-speaker distance adjustment
  - Per-speaker amplitude adjustment
  - Per-speaker order balance adjustment
  - Global distance weighting
  - Global amplitude weighting
  - Global order weighting
  - 0th order processing
  - 1st order processing
  - 2nd order processing
  - 3rd order processing
  - 14 preset speaker array configurations
  - Up to 16 speakers
  - Distance sliders range 0 to 10 meters
  - 64 bit processing
  - macOS support
  - Windows support
