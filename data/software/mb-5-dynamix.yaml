details: |-
  Blue cat's MB-5 Dynamix is an all-in-one multiband dynamics processor that can
  act as a multiband compressor, limiter, expander, gate or waveshaper. It
  offers up to 5 separate bands and all types of effects can be combined
  together.

  Its advanced internal side chaining capabilities enable unique interactions
  between spectral bands or audio channels. This results in finer control of the
  dynamics response and unprecedented flexibility.

  The plug-in offers premium visual feedback about its internal processors
  thanks to several real-time meters and curves.

  Full featured multiband dynamics processor with unique envelope routing
  capability for cross-band dynamics effects (one band may trigger another).
  Dry/wet control for parallel processing ("new york compression") and stereo or
  mid-side processing with multiple channels linking options.

  Easy copy/paste settings between bands. Side chaining made easy: a unique way
  to perform multi-band side chain compression, ducking, gating and much more.
  Plug-in window transparency management.
specs: |-
  - Multiband dynamics processor
  - Compressor
  - Limiter
  - Expander
  - Gate
  - Waveshaper
  - Up to 5 separate bands
  - Crossover filters from 6 to 60 dB/oct
  - Envelope routing capability for cross-band dynamics effects
  - Dry/wet control for parallel processing
  - Stereo or mid-side processing
  - Multiple channels linking options
  - Post brickwall limiter or waveshaper
  - Real-time response curves and levels display
  - Side chaining capabilities
  - Peak and rms envelope follower/detection circuit
  - No latency
