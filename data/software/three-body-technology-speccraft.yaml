description: SpecCraft is a next-generation dynamic resonance suppressor,
  spectrum compressor, and smart EQ designed to eliminate unwanted resonances in
  audio mixing while maintaining sound quality and dynamics. It features
  real-time adaptive threshold control, self-adaptive spectral compensation, and
  analog-modeled processing with zero latency and linear phase modes.
details: |-
  Real-Time Adaptive Threshold Control with self-adaptive amplitude-based thresholding. Self-adaptive Spectral Compensation with three potential global EQ curves. Dynamics Compensation based on psychoacoustic loudness restoration. Formant Boost to preserve spectral character. Treble Compensation with adjustable high-frequency response. Spectrum Slope with 0–12 dB/OCT tilt adjustment. Priority Curve for surgical frequency sculpting. Profiling for custom frequency response thresholds.

  Zero Delay Feedback Level Detector. Analog-modeled processing. Zero Latency Mode and Linear Phase Mode. Lookahead feature. 2x, 4x, 8x oversampling. Flexible stereo/Mid-Side linking controls. 8-band parametric side chain EQ.

  GPU-accelerated GUI with theme customization and resizable interface. A/B switching, Undo/Redo. 25+ presets included. Free unlimited demo available (no registration required)
specs: |-
