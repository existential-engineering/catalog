  - Zero Delay Feedback level detector
  - Analog-modeled resonance suppression and compensation
  - Zero Latency Mode with minimum phase filters
  - Adjustable Lookahead
  - Switchable 2x, 4x and 8x oversampling
  - Side chain modes: Left/Right and Mid/Side
  - Stereo linking / MS linking from 100% stereo linked to 100% dual mono
  - 8-band parametric side chain EQ
  - Real-time frequency display
  - Side chain monitoring
  - External side chain
  - Dry mix
  - 25+ presets, preset selector
  - Undo/Redo, A/B switching
  - User-defined default settings, customizable behavior settings
  - Theme customization, resizable GUI, full-screen mode
  - Extreme CPU optimization, GPU accelerated GUI
  - Apple Silicon native support
  - macOS Retina / Windows high-DPI support
  - Latency in Linear Phase Mode: 2048 sample points, about 46 ms at 44100 Hz
  - Latency in Zero Latency Mode: 0 sample points, 0 ms
  - Minimum system requirements: Intel or AMD CPU with SSE 4.1 instruction set, or Apple Silicon
  - macOS 11 / Windows 8
  - 4GB RAM and 100MB disk space
  - Supported plugin formats: 64-bit VST2, VST3, AAX and Audio Unit
