description: "Next-generation dynamic resonance suppressor, spectrum compressor,
  and smart EQ. Identifies and dynamically suppresses unwanted resonances at
  each audio frame while generating real-time spectrum compensation curves."
details: |-
  Real-time adaptive threshold control. Self-adaptive spectral compensation with dynamics compensation, formant boost, and treble compensation. Spectrum slope (0-12 dB/oct). Priority curve. Profiling with custom frequency response curves. Zero Delay Feedback level detector. Analog-modeled resonance suppression. Zero latency mode. Lookahead. Oversampling. Flexible side chain controls.
specs: |-
  macOS 11 or later. Windows 8 or later. Intel or AMD CPU with SSE 4.1 or Apple Silicon. 4GB RAM. 100MB disk space. 64-bit only.
