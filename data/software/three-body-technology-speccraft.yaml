description: SpecCraft is a next-generation dynamic resonance suppressor, spectrum compressor, and smart EQ designed to eliminate unwanted resonances in audio mixing while maintaining sound quality and dynamics. It features real-time adaptive threshold control, self-adaptive spectral compensation, and analog-modeled processing with zero latency and linear phase modes.
details: |-
  SpecCraft is a next-generation dynamic resonance suppressor, spectrum compressor, and smart EQ. It specializes in eliminating the greatest enemy in a mix: unwanted resonances. Whether harsh shrills or muddy booms, SpecCraft identifies them all and dynamically applies matching suppression at each and every audio frame. It also fills the void left behind by generating real-time spectrum compensation curves, so there is no dynamics loss or artifacts due to resonance suppression.

  Resonances are not inherently bad, unwanted resonances are, so they are better adjusted with care than subdued with force. Complete and concise controls locate unwanted resonances quickly, and a smart amplitude-based real-time thresholding algorithm continuously finds the optimal amplitude threshold for the resonances that need suppression, functioning like a self-adaptive threshold automation. Threshold adjustments can be fully automated, fully manual, or anywhere in between.

  A proprietary self-adaptive spectral compensation algorithm continuously calculates three potential global EQ compensation curves based on the amount, frequencies, and levels of the suppressed resonances, avoiding a flat, unnatural, and overly compressed sound. A psychoacoustic-based dynamics compensation algorithm restores the volume envelope lost to suppression, Formant Boost compensates for the suppressed resonances' contribution to their formants, and an adjustable Treble Compensation preserves high-frequency presence or, with no compensation, lets SpecCraft function like a de-esser.

  Spectrum Slope tilts the spectrum display from 0 dB/OCT to 12 dB/OCT so that high and low unwanted resonances interact equally with the threshold curve, and the Priority Curve fine-tunes the amount of processing across different frequency bands. Profiling applies a custom frequency response curve as the threshold, similar to EQ-matching but executed dynamically on every audio frame, chosen from preset threshold profiles, extracted from audio files, or recorded and captured on the fly.

  A Zero Delay Feedback filter structure is applied to the envelope detector for superior sound quality on fast percussive sounds and continuously changing sibilants, and suppression and compensation are modelled after classic hardware for a natural, warm tone. Linear phase filters are used by default, while Zero Latency Mode switches to minimum phase filters for live performance and arranging. An adjustable Lookahead preserves musical transients at minimal Attack settings, and switchable 2x, 4x and 8x oversampling eliminates aliasing.

  Side chain controls support Left/Right and Mid/Side stereo processing modes, channel linking from 100% stereo linked to 100% dual mono compression, and an 8-band parametric side chain EQ powered by Kirchhoff-EQ.
