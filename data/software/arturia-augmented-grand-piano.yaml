description: Augmented GRAND PIANO delivers a multitude of expressive, contemporary, and
  abstract piano sounds, beautifully recorded, fused with cutting-edge
  synthesis, and tailor-made for modern composers & producers.
details: |-
  From the authentic to the impossible, unlock premium piano sounds for
  cinematic score & library composition, immersive game soundscapes, and slick
  modern DAW production with an intuitive & inspiring piano experience that
  transcends virtual instruments.

  Starting with beautifully captured recordings of an '80s steinway grand,
  embellished with unusual techniques like bowing, ping pong balls, and
  tape-processing, and fused with synthesis for fresh, exciting, outside-the-box
  piano sounds.

  Users can animate tracks with timbres that flow between familiar & far-out,
  acoustic & synthetic, and pure & transformed with the powerful morph control.
  Move between sound layers and make broad changes to multiple aspects of a
  sound with one control.

  Every aspect of augmented grand piano's sound can be customized with 2
  distinct layers, each including 2 sound sources, for weaving compound textures
  with whatever combination of samples and synthesis that users need.

  Augmented grand piano is a shortcut to perfect piano sounds, but its advanced
  panel lets users go deeper when a project calls for it. Add complex
  modulation, keep it moving with smart arpeggiation, and fine-tune sound layers
  in one place.
specs: |-
  - 2 distinct layers
  - 2 sound sources per layer
  - Morph control
  - Macro controls
  - Complex modulation
  - Smart arpeggiation
  - Granular sampler
  - Synthesis
  - Universal 2 binary
