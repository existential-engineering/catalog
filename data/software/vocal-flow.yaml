details: |-
  The Vocal Flow is an all-in-one signal processing suite for mixing vocals in
  your music. It contains 7 route-able signal processing elements along with
  input and output controls.

  The ava-vf is a "greatest hits" compilation of harrison's most sought-after
  console elements, specifically selected for mixing vocals.

  Harrison's unique vocal character tracks individual notes to boost the body
  (fundamental) or clarity (overtones) of a sung vocal. Boost the higher
  harmonics to get an effect similar to distortion but without any aliasing.

  The enormously popular harrison 32c four band parametric equalizer with
  proportional gain and separate high-pass and lo-pass filters.

  Leveler: a compressor specifically designed for vocal tracks - derived from
  the harrison mixbus channelstrip. Deesser: harrison's de-esser is smart enough
  to de-ess only the sibilance of a vocal track, and not lose the sizzle in
  voiced consonants like z's. An effects section with chorus, delay and reverb
  for adding subtle musical effects to vocals. A full routing section allowing
  the various processing sections to be arranged and auditioned in any order.
specs: |-
  - 7 route-able signal processing elements
  - Input and output controls
  - Vocal character
  - 32c four band parametric equalizer
  - Proportional gain
  - High-pass filter
  - Lo-pass filter
  - Leveler compressor
  - De-esser
  - Chorus effect
  - Delay effect
  - Reverb effect
  - Full routing section
