description: A free reissue of the original Tube Saturator that uses 64-bit circuit simulation technology to faithfully reproduce the sound of a dual triode preamp. Simulates a basic circuit with a three-band EQ feeding two 12AX7 triode preamp stages for adding analog warmth or distortion to recordings.
details: |-
  - 64-bit circuit simulation technology faithfully reproduces the sound of a dual triode preamp circuit, providing authentic analog warmth and harmonic saturation.
  - Simulates two common cathode 12AX7 triode preamp stages preceded by a Baxandall 3-band EQ with bypass option for tonal shaping before saturation.
  - Drive control allows adjustment of distortion amount; FAT mode increases punch for more aggressive saturation characteristics.
  - Zero latency operation with support for sample rates up to 192 kHz (CPU dependent), suitable for both tracking and mixing workflows.
  - Supports mono or stereo processing with analog-style metering; Apple Silicon natively supported; GUI scaling and dark theme options available.
specs: |-
  - Formats (macOS): AU, VST2, VST3, AAX
  - Formats (Windows): VST2, VST3, AAX
  - Platform: macOS 10.13 (High Sierra) and higher; Apple Silicon native
  - Platform: Windows 7, 8, 10, 11
  - Host requirement: 64-bit DAW only
  - Pro Tools AAX (Mac): Pro Tools 11+
  - Pro Tools AAX (Windows): Pro Tools 10.3.5+
  - Latency: Zero latency
  - Maximum sample rate: 192 kHz (CPU dependent)
  - Processing: Mono or stereo
  - Tube stages: Two common cathode 12AX7 triode preamp stages
  - EQ: Baxandall 3-band with bypass
  - Licensing: Free, requires registration
