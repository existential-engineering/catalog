details: |-
  This powerful utility for Windows creates small Sys Ex messages and can send them to any MIDI device. It's also a great little MIDI monitor, and can easily test small Sys Ex requests, since the reply as well as all other events from the MIDI device are displayed.

  Additional features include loading and saving of Sys Ex files, so you can archive bulk dumps from your MIDI device and send them later back to the device.

  The current download is version 1.4 (February 2019) for Windows. An older build, Bome SendSX 1.1 (June 1999), is also offered for 16-bit Windows 3.11.

  Version 1.4 changed the default font to Courier New, added the ability to disable throttling and send data "as is" for full messages, added an option to disable chunking in 128-byte chunks when sending, and added a "/send" command line parameter that sends the outgoing data.
