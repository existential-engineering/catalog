description: Triple-band enhancer that adds depth, clarity and presence, combining a low-end sub-harmonic generator with a triple-band saturator and precise control over in-band and out-of-band harmonics. An AI-driven automatic dynamics and timbre correction and an integrated spatial widener round it out.
details: |-
  Enhancer provides the seasoning for your tracks. Add depth, clarity and presence, and let your performances sparkle and shine.

  It combines a fat low-end sub-harmonic generator and a triple-band saturator with precise control over in-band and out-of-band harmonics generation. In addition, an AI-driven automatic dynamics and timbre correction helps to get professional-sounding results quickly.

  A built-in spectrum analyzer supports quick decisions, and an integrated spatial widener handles stereo and immersive width. Up to 16-channel spatial audio support.

  Resizable user interface with dozens of color themes. Undo, redo and A/B switching. Preset management with import and export. Multiple simultaneous instances. License activation without a hardware dongle.
specs: |-
  Triple-band saturation. Sub-harmonic generator. Integrated spatial widener. Sample rates up to 384 kHz. Up to 16-channel spatial audio support. Personal, perpetual desktop license for Windows, macOS and Linux, for use on up to 4 computers. Desktop installer v2.1.8 (July 2026). Windows 10 or up with a 64-bit DAW supporting VST, VST3 or AAX, Intel or AMD SSE2 processor. macOS 10.13 or up with a 64-bit DAW supporting VST, VST3, AAX or AU, Intel or Apple Silicon. Linux plug-in archive requiring glibc 2.31 or up and a 64-bit DAW supporting VST or VST3.
