description: The free LANDR Samples plugin lets you browse and audition over 3
  million royalty-free samples and exclusive packs directly in your DAW.
details: |-
  Samples Plugin changes the way you browse, audition and download samples with a single plugin. It automatically syncs the LANDR Samples library to your project so you can browse, audition and add samples to your tracks, all in your DAW.

  Browse better: audition over 3 million royalty-free samples and exclusive packs directly in your DAW. Work in sync: sync the LANDR Samples library to your DAW to spend less time tweaking and more time creating. Drag, drop and you're done: hot-swap samples to find the right sound faster, then just drag and drop into your DAW to download.

  The plugin automatically syncs samples to the key and BPM of your project so you can quickly drag and drop what you like into your DAW. Samples works with all major DAWs.

  Getting started takes five steps: download and install the plugin, open your favorite DAW and launch the plugin, log in or sign up to LANDR, take the tour, then start browsing LANDR Samples.

  Samples Plugin is included with LANDR Studio, which bundles Plugins, Samples, Mastering, Distribution and more.
specs: |-
