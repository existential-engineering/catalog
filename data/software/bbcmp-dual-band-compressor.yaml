name: BBCMP Dual Band Compressor
manufacturer: babelson-audio
primaryCategory: compressor
url: https://babelson.com/product/bbcmp/?v=11aedd0e4327
description: A special feature of the bbcmp is that it enables the operator to
  split the incoming signal using the low pass and high pass filters.
details: |-
  The great advantage of processing in this way is that you have full control
  over the extent to which the 2 bands are processed rather than only the summed
  signal being processed. This means that if, for example, the low end is strong
  and pushing the compressor to attenuate the signal when it comes into play, in
  a standard compressor the higher frequencies would also be compressed at these
  times.

  With the bbcmp you can separately control the low end and leave the high end
  relatively unprocessed, if that is what you need, or conversely deal with the
  high end and leave the low end with lesser processing.

  The analog/digital options vary the attack and release characteristics of the
  processor and will vary the 'colour' of the output. You will notice that the
  actual attack and release times are fully controllable for each band.

  The bbcmp does not introduce 'hiss' or 'analog noise' when in the 'analog'
  mode.
specs: |-
  - Dual band compression
  - Low pass filter
  - High pass filter
  - Independent band processing
  - Compression
  - Limiting
  - Expansion
  - Gate
  - Analog/digital mode selection
  - Controllable attack and release times
  - macOS support
  - Windows support
