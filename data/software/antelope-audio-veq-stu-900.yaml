details: |-
  This EQ is modeled after a channel strip of one of the best-sounding analog mixing desks. What makes it special? The VEQ-STU 900 is a very flexible 4-band semi-parametric EQ with cut/boost controls and variable frequencies.

  Its HF and LF bands support bell and shelf modes, and its LMF and HMF bands have two options for Q. With this functionality, the VEQ-STU 900 lets you shape the sound in fairly extreme ways without deforming it. With its thick lows and gentle mids, you might like it even more than a comparable brand-name EQ.

  Runs natively in your DAW on macOS or Windows, or in real-time on your Synergy Core interface.
