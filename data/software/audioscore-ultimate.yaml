details: |-
  AudioScore Ultimate 8 is the full featured version of the audioscore lite
  audio transcription software included with sibelius | ultimate. With
  AudioScore Ultimate 8, you can quickly and easily turn cd tracks, mp3s, MIDI
  files, and even your own vocal and instrument performances into detailed music
  notation.

  With version 8, audioscore's audio recognition engine has been completely
  re-engineered to provide better music precision and detail. Get improved
  recognition of multiple overlapping notes. Minimize interference caused by
  drum and percussion sounds. And experience superior pitch recognition and note
  separation.

  With audioscore ultimate, you can open a cd track or mp3 file and transcribe
  it to a score. The software employs the most intelligent technology available
  today to convert up to 16 instruments or notes at a time into multiple staves,
  with up to four voices per staff. After transcribing your music, you can send
  it directly to sibelius or save it as a musicxml, niff, or MIDI file for use
  in most other music programs.

  Audioscore ultimate enables you to view, play, and edit the most intricate
  nuances of a performance—such as the subtle changes in pitch, volume, and
  timing. You can also produce new versions of music using MIDI instruments of
  your choice. Audioscore analyzes the original music in great detail, and plays
  it back with tremendous realism.

  Audioscore ultimate can "serve" you a set of notes, which you can quickly
  split, join, resize, and adjust pitch, purely on a performance level—no
  worrying about rests and technicalities such as the key signature,
  accidentals, augmentation dots, beaming, ties, etc.
