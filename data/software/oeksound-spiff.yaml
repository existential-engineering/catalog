description: An adaptive transient processor that lets you control transients with great detail. Uses spectral analysis and dynamic filters rather than crossovers, eliminating crossover artifacts. Enables removal of mouth clicks and subtle noises from vocals, adds clarity and expression to instruments, and pushes sounds forward or back without volume changes.
details: |-
  spiff is described by oeksound as an adaptive transient processor that cuts or boosts transients with great detail. It analyzes the incoming signal and recognizes adaptively when and where transients appear, and its time- and frequency-specific controls are intended to let an engineer take charge of transients no matter how big or small. The page presents this adaptive approach as opening up possibilities not usually associated with transient control, summarising the plug-in as a way to cut or boost transients where it matters.

  The plug-in was originally designed to remove mouth clicks in vocal recordings. According to the page, mouth clicks occur when a vocal is recorded close to the microphone and often become an issue when high frequencies are boosted and compression is added, so spiff is positioned as a time-saver when editing vocals, voiceovers and podcasts.

  Engaging boost mode turns spiff into a transient enhancer for adding attack to drums and other rhythm material. The adaptive approach is said to give additional control over which transients are boosted and in which frequency area, so fundamentals on drums can be boosted without additional boominess, or a sound can be brought to the front of a mix without increasing its RMS level. The page lists pushing sounds forward or back in a mix without affecting their volume, and adding dynamics and detail to an over-compressed mix, among the stated uses.

  Beyond mouth clicks, the page describes other mixing applications for the detailed transient recognition: softening the pick attack of a guitar recording while retaining the top-end shimmer, or softening transients across a whole mix in a manner compared to tape saturation. More extreme applications named on the page include making an electric bass sound fretless and creating room mics out of overheads.

  Where traditional transient shapers work as compressors and envelope shapers over one or more bands, spiff analyzes the incoming signal using spectral analysis and applies cuts or boosts using dynamic filters. No crossovers are used in the process, which the page states eliminates any possibility of the crossover artifacts that can occur in multiband transient processors. The plug-in ships with an integrated tutorial and presets, and a fully featured 20-day trial is available.
specs: |-
  - Adaptive transient processing: analyzes the incoming signal and recognizes when and where transients appear
  - Time- and frequency-specific controls for cutting or boosting transients
  - Spectral analysis with dynamic filters instead of crossovers, avoiding multiband crossover artifacts
  - Cut mode for removing mouth clicks and other subtle noises in vocals, voiceovers and podcasts
  - Boost mode for adding attack to drums and other rhythm material
  - Frequency-targeted boosting, for example drum fundamentals without added boominess
  - Moves sounds forward or back in a mix without changing their RMS level
  - Integrated tutorial and factory presets
  - Windows 7 - 11, 64-bit, no ARM support
  - Windows formats: 64-bit VST, VST3 and AAX (Pro Tools 11 and up)
  - Mac OS X 10.14 (Mojave) - macOS 26 (Tahoe)
  - macOS formats: 64-bit VST, VST3, AU and AAX (Pro Tools 11 and up)
  - Apple Silicon Macs supported, Intel support up to macOS 15 (Sequoia)
  - iLok account and iLok License Manager installation required, iLok dongle is not required
  - Online access required for the initial activation of the product and trial
  - One license allows activation on 2 machines, valid for both Windows and macOS
  - Optional hardware accelerated rendering: OpenGL 2.1 or newer on the graphics card chipset
  - Fully featured 20-day trial
