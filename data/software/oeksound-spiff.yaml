description: "An adaptive transient processor that lets you control transients
  with great detail. Uses spectral analysis and dynamic filters rather than
  crossovers, eliminating crossover artifacts. Enables removal of mouth clicks
  and subtle noises from vocals, adds clarity and expression to instruments, and
  pushes sounds forward or back without volume changes."
details: |-
  Remove mouth clicks and subtle noises from vocals
  Add clarity and expression to instruments
  Push sounds forward/back without volume changes
  Add dynamics to over-compressed material
  Boost mode for transient enhancement
  Frequency-specific and time-specific controls
  Spectral analysis with dynamic filters instead of crossovers

  iLok account required. One license activates on 2 machines. Valid for both Windows and macOS. Online activation required.

  20-day fully featured trial

  OpenGL 2.1+ for hardware-accelerated rendering
specs: |-
  - mac: OS X 10.14 (Mojave) through macOS 26 (Tahoe). 64-bit only. Apple Silicon supported. Intel support through macOS 15 (Sequoia).
  - windows: Windows 7-11. 64-bit only. No ARM support.
