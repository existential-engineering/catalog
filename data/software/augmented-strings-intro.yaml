details: |-
  Part of the augmented series, Augmented Strings Intro is a streamlined version
  of an instrument that combines rich sampled strings with state-of-the-art
  synth engines in an approachable and inspiring way, giving today's sound
  explorers the quickest route to the fresh string sounds they've always wanted.

  Advanced hybrid sounds, instant sound morphing, simple macro controls, and a
  mix-ready sound - software strings reinvented.

  In the search for the next generation of acoustic instrument sounds, arturia
  have enlisted some of the world's best recording houses, sound designers, and
  instrumentalists, combining them with state-of-the-art synthesis and
  workflow-oriented design, resulting in an entirely new sonic experience.

  Every preset features up to 4 layers of sound, with any combination of string
  samples, virtual analog, wavetable, harmonic, and granular synthesis.

  The morph control gives you truly unique & ever-evolving sound with one click.
  Move and transform between layers and adjust multiple parameters at once.
specs: |-
  - Up to 4 layers of sound per preset
  - String samples
  - Virtual analog synthesis
  - Wavetable synthesis
  - Harmonic synthesis
  - Granular synthesis
  - Morph control
  - Macro controls
  - Color control
  - FX controls
  - Delay
  - Reverb
