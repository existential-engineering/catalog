description: VCV Kompas is a free probability trigger generator module for VCV Rack with three-coordinate probabilistic pattern navigation across three 32-step pattern generators, generating new looping patterns based on direction selection with dedicated trigger outputs per coordinate. It is a software recreation of the Bastl Instruments Kompas hardware Eurorack sequencer.
