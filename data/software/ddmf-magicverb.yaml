description: "A reverb plugin developed in collaboration with MagicDeathEye,
  modeling studio spaces and chambers with multiple reverb algorithms including
  chamber, plate, and classic digital reverb emulations."
details: |-
  Multiple reverb models (chambers, plate, digital)
  Simple control interface
  32-bit and 64-bit versions
  Intel and Apple Silicon support
  iOS AUv3 version available
specs: |-
  - Reverb types: chamber, plate, and classic digital reverb models
  - Available in 32-bit and 64-bit formats on Windows and Mac
  - Mac: OSX 10.7 or higher required; Intel and Apple Silicon supported
  - Linux: ARM and x86_64 formats available as VST3
  - iOS: AUv3 format, compatible with GarageBand and Cubasis
  - Formats: VST, VST3, AU, AAX (desktop); AUv3 (iOS)
  - Demo versions available for Windows, Mac, Linux ARM, and Linux x86_64
