description: "What's proper low- and high-end with no guts in the mids? VMEQ-5
  is mid range's best friend! Two peak bands and a dip band are all you need to
  give your vocals, synth, guitar leads or snare drum the analog punch they've
  always needed. This little beast can also clean up a murky midrange like a
  boss!"
details: |-
  VMEQ-5 is a 3-Band Tube Mid-Range EQ Plugin modeled after the classic Massenburg MEQ-5-style mid-range equalizer. Two peak bands and a dip band are all you need to give your vocals, synth, guitar leads or snare drum the analog punch they've always needed.

  This little beast can also clean up a murky midrange like a boss! VMEQ-5 runs natively in your DAW on macOS and Windows, or in real-time on Antelope Audio's Synergy Core hardware.
