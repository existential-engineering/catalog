description: A studio-grade AI voice changer plugin designed for digital audio workstations (DAWs). Transform vocals into different voices and instruments, create backing vocals, produce demo songs, and build harmonies without leaving your DAW.
details: |-
  SoundID VoiceAI offers 90+ voice and instrument presets (factory + expansion packs), Unison Mode for stacking up to 8 vocal layers, zero-latency local processing, and pay-as-you-go cloud processing via a token system. A 7-day free trial includes 9,000 processing tokens and all features. A free mode provides unlimited local processing with 8 presets and no time limit. Genre-specific voice packs (Rock, Kids, Pop, K-pop) are available as add-ons. Compatible DAWs include Logic Pro X, Ableton Live, Pro Tools, Cubase, FL Studio, Studio One, and Reaper.
specs: |-
  - os_mac: macOS 11 Big Sur through macOS 15 Sequoia
  - os_windows: Windows 10, 11
  - ram: 4 GB minimum for local processing
  - storage: 4 GB
  - cloud: 10 tokens per second of audio
