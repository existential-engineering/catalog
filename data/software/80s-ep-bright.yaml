description: The 80s eps are virtual versions of 4 iconic 80s ep sounds from the
  yamaha dx7 mark ii, each counting two times 1144 24-bit/48khz samples.
details: |-
  The 80s eps are virtual versions of 4 iconic 80s ep sounds from the yamaha dx7 mark ii, each counting two times 1144 24-bit/48khz samples for the pro versions. 88 keys sampled in 12 velocity layers. The 140 versions, at half the price, have 140 samples. There are three more of them: 80s ep classic, fm and warm.

  No software emulation beats the expressiveness and bite of the real thing. I played around two thousand ep presets, customized 32 of my favourites on my tx802/dx7ii and then sampled 4 like all the virtual wurlitzers and rhodes out there: extremely detailed and programmed to behave exactly like the original.

  "bright" is based on the famous "fulltines" preset from the dx7 mark ii. It is heard in dozens of hit ballads.

  Requires the full version of kontakt 3.5 or higher. The 80s eps will only work for 30 minutes in the free kontakt player.
specs: |-
  - 88 keys sampled in 12 velocity layers
  - 24-bit/48khz samples
  - Kontakt 3.5 or higher required
  - 30 minutes playback in free kontakt player
  - Based on yamaha dx7 mark ii
  - Fulltines preset
