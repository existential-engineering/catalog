details: |-
  Spectral Conquest is an effect plug-in that lets you directly manipulate the frequency spectrum of audio signals.

  The incoming signal is analysed via an FFT (Fast Fourier Transform), resulting in the familiar spectrum plot where the full audio spectrum is split into a number of narrow frequency bands. The outgoing audio is then regenerated by an inverse FFT, and the interesting part is that the plug-in lets you modify the frequency spectrum in between.

  The spectrum can be modified by setting a multiplier for each frequency band, drawn out directly in the GUI.

  It can also be modified by applying a script to the spectrum. Some basic scripts are included with the plug-in to perform operations such as filtering and gating, and users can also write their own scripts to do whatever they like.
specs: |-
  - FFT analysis with an inverse FFT resynthesis stage
  - Per-band multipliers drawn in the GUI
  - Scriptable spectral processing, with basic filtering and gating scripts included
  - 64 bit AU, AAX and VST formats
  - macOS and Windows
  - iLok account required to redeem the activation code
  - Activation to a physical iLok, the iLok Cloud or the local machine
  - A physical iLok is not required
  - 7 day trial started by launching the plug-in without a license
