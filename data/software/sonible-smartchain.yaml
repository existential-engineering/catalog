details: |-
  smart:chain is an intelligent channel strip and AI-powered mixing plug-in that brings intelligent EQing, compression, de-harshing, gating, input riding, saturation, and leveling together in one connected workflow. The combination of intelligent processing and mix-wide control takes care of the repetitive groundwork and keeps your session moving.

  One chain, shared intelligence: instead of operating independently, smart:chain's processors share an understanding of your audio and interact to create a coherent processing chain. One analysis of your audio material provides optimized starting points across the modules, while intuitive sound-shaping controls make it easy to explore different directions. Every parameter remains fully editable, so the intelligent starting point can be shaped further.

  Mix-wide intelligence and centralized control: smart:chain takes AI-assisted mixing beyond individual tracks. Multiple plug-in instances communicate across a session, allowing tracks to be managed and shaped in the context of the entire mix. Intelligent depth staging places elements in Front, Middle, and Back Layers, automatically adapting processing to support separation, depth, and clarity. Centralized session control brings Groups, track navigation, and access to every smart:chain instance into one window.

  Project-wide Auto Leveling: instead of building every rough mix from silence, smart:chain's project-wide Auto Leveling analyzes the relationships between learned tracks and establishes a genre-aware starting balance across the session. Tracks are intelligently balanced against each other to create a coherent overall mix, and dedicated trim controls refine the result without losing the established level relationships.
