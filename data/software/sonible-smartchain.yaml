details: |-
  smart:chain is an intelligent channel strip and AI-powered mixing plug-in that brings intelligent EQing, compression, de-harshing, gating, input riding, saturation, and leveling together in one connected workflow. The combination of intelligent processing and mix-wide control takes care of the repetitive groundwork and keeps your session moving. With smart:chain, you'll mix with less setup and more instinct.

  Instead of operating independently, smart:chain's processors share an understanding of your audio and interact to create a coherent processing chain. One analysis of your audio material provides optimized starting points across the modules, while intuitive sound-shaping controls make it easy to explore different directions. And because every parameter remains fully editable, you can shape the intelligent starting point entirely to your own vision.

  smart:chain takes AI-assisted mixing beyond individual tracks. Multiple plug-in instances communicate across your session, allowing tracks to be managed and shaped in the context of the entire mix. Intelligent depth staging lets you place elements in Front, Middle, and Back Layers, automatically adapting processing to support separation, depth, and clarity. Centralized session control brings Groups, track navigation, and access to every smart:chain instance into one window, making even complex mixing sessions easier to manage.

  Instead of building every rough mix from silence, smart:chain's project-wide Auto Leveling analyzes the relationships between learned tracks and establishes a genre-aware starting balance across your session. Tracks are intelligently balanced against each other to create a coherent overall mix. Dedicated trim controls let you refine the result without losing the established level relationships. You get to a solid starting point faster, while the final balance - and every creative decision - stays yours.
