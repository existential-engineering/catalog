description: smart:chain is an intelligent channel strip and AI-assisted mixing
  plug-in that brings EQing, compression, de-harshing, gating, input riding,
  saturation and leveling together in one connected workflow. Eight processors
  share a single analysis of the material, and multiple instances communicate
  across a session so tracks can be shaped in the context of the whole mix.
details: |-
  Rather than operating independently, the processors in smart:chain share an understanding of the audio and interact to form a coherent chain. One analysis of the material provides optimized starting points across the modules, while sound-shaping controls make it easy to explore different directions. Every parameter stays fully editable, so the intelligent starting point can be reshaped entirely by hand.

  The plug-in takes AI-assisted mixing beyond individual tracks. Multiple instances communicate across a session, allowing tracks to be managed and shaped in the context of the entire mix. Intelligent depth staging places elements in Front, Middle and Back layers, adapting processing to support separation, depth and clarity. Centralized session control brings groups, track navigation and access to every smart:chain instance into one window, which keeps complex sessions manageable.

  Project-wide Auto Leveling analyzes the relationships between learned tracks and establishes a genre-aware starting balance across the session, so a rough mix does not have to be built from silence. Tracks are balanced against each other to create a coherent overall picture, and dedicated trim controls refine the result without losing the established level relationships. The final balance and every creative decision remain the mixer's own.

  Authorization is machine-based or via iLok, and Apple Silicon is supported natively. Sample rates from 44.1 kHz to 192 kHz are supported.
specs: |-
  - Eight intelligent processors in one plug-in, including EQ, compression, de-harshing, gating, input riding, saturation and leveling
  - Shared analysis across modules for a connected processing chain
  - Session-wide communication between plug-in instances
  - Intelligent depth staging with Front, Middle and Back layers
  - Centralized session control with groups and track navigation
  - Project-wide, genre-aware Auto Leveling with dedicated trim controls
  - Fully editable parameters on top of the intelligent starting point
  - Plug-in formats (Mac): VST3, AU, AAX
  - Plug-in formats (Windows): VST3, AAX
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok
  - Apple Silicon support: native
  - Windows: Windows 10 (64 bit)
  - macOS: 11 or later
  - RAM: 4 GB
  - CPU: Intel Core (i5) or Apple Silicon
  - GPU: OpenGL version 3.2 or later
