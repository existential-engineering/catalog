description: An intuitive and great-sounding vocal processor for recording,
  production, and mixing that incorporates 6 highly optimized algorithms.
details: |-
  UltraVox 2 is a set-and-forget vocal processor plugin designed for any songwriter, producer, and engineer wanting to achieve a great vocal sound quickly. It features six carefully tuned algorithms that work seamlessly on any type of vocal: Compression, Gate, Harmonics, Air, De-Esser, and Reverb.

  Compression employs a single band soft-knee compressor with variable program-dependent attack and release times, evening out the performance and controlling peaks for a smooth, balanced level. The musical Gate cleans up background noise and softens unwanted breaths or mouth sounds that often appear after compression.

  Harmonics adds rich tonal character and warmth through primarily 2nd and 3rd order harmonics. Air employs equalization focused around 12kHz to give the vocal shine without introducing harshness, with both boost and cut capability.

  The De-Esser provides transparent and natural control over harsh sibilants through precise frequency analysis. The built-in Reverb delivers a beautiful, ready-to-use vocal space that enhances the performance without clouding the mix.
specs: |-
  - Single band soft-knee compressor with variable program-dependent attack and release
  - Musical gate with variable program-dependent timing for noise and breath removal
  - 2nd and 3rd order harmonics generation for vocal character
  - Air equalization focused around 12kHz with boost and cut capability
  - Precise frequency analysis de-esser for sibilant control
  - Built-in vocal reverb
  - One-screen Retina interface design
  - macOS 10.13+ with M1-Native support
  - Windows 8 and 10 (64-bit only)
