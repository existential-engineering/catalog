details: |-
  Novatron is an analog-modeled compressor that borrows so many sonic properties from so many different classes of hardware units that, ironically, it could only exist in the world of DSP.

  With separate in/out Transformer Saturation, two optional Tone Circuits, and a monstrous compressor with groundbreaking attack and release characteristics, the Novatron produces the same three-dimensional 'solidity' and tone typically reserved for expensive hardware.

  The plugin is sold as a perpetual licence that includes 2 activations, free updates and support, and all available presets. A free 10-day demo is offered via a demo code.
specs: |-
  - Analog-modeled compressor
  - Separate input and output Transformer Saturation
  - Two optional Tone Circuits
  - Attack and release characteristics described as groundbreaking
  - Perpetual licence includes 2 activations
  - Free updates and support
  - All available presets included
  - Free 10-day demo available
