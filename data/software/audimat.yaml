details: |-
  Inspired by the automat - a famous self-service eatery in new york city where
  diners could choose from a variety of dishes available from a rack of vending
  machines - Audimat is a VST host in which you can load up a rack with your
  plugins for a variety of sounds.

  To edit a VST's parameters, you can either display the VST's own editor, or
  use audimat's default editor. Switch between the VST's programs using the
  selector on its rack panel. Either send MIDI data from an external MIDI
  controller or use the on-screen keyboard.

  Save the current configuration of plugins you have loaded into the rack (a
  "rig") to a file so that you can easily reload all of them later. For a given
  rig, you can also save the current programs of the individual plugins as a
  patch, so that you can switch between patches without having to set each
  plugin's program separately every time.

  For the windows platform; you need to have .net 4.0 installed to run it. The
  user interface is written in c# (audimat.exe) and the engine is written in c++
  (vashti.dll). As with all transonic software, this is open source.
