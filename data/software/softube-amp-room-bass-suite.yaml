details: |-
  Get album-ready bass tones for everything from vintage '60s & '70s vibes to modern chart music and the heaviest distorted metal. Amp Room Bass Suite includes expertly modeled amps like Bass Standard Line V8, Supernova Parallel Channel 300W, and The Cardinal 100W.

  An Amp Room suite packed with amps, cabs, and pedals, such as Bass Standard Line V8, Supernova Parallel Channel 300W, The Cardinal 100W, and a Direct Input DI. It includes the Amp Room platform, three amps, one DI module, five cabs, ten stompboxes, 12 effects and utilities, microphone options, presets, and more, featuring cabinet IR captures with moveable microphones and a parametric equalizer for added tone shaping.

  Suite Mode is an intuitive workflow with hand-selected sets of gear that let you quickly get the sounds you want with Bass Suite. You have easy access to your amps and cabs, as well as the pedal and effects sections. If you want to go further into tone shaping, you can switch to Studio Mode.

  Bass Standard Line V8 is an all-tube amp for a bass sound with punch and grit, but also for superb tone and clarity, with a quad of 6L6s offering an unexpected fullness of sound and sparkly, clean guitar tones too. Supernova Parallel Channel 300W is a modern parallel bass amp with predefined EQ modes, a channel that can be distorted, and a clean DI signal that can be blended back in. The Cardinal 100W is based on an early '70s 100W UK valve PA amp and delivers thick bass, firm mids, and clear treble. The Direct Input DI is inspired by the Softube Focusing Equalizer, with a mid-band tone in the musical middle, low cut, high cut, and a thin-to-fat tone control.

  Amplifiers is the lighter Amp Room companion plug-in: lighter on resources, faster to load, and simpler to use. It is included with every Amp Room Suite and supports all Amp Room amps and cabs. Amp Room Bass Suite is expandable with other Amp Room Suites and Amp Room Ready Softube products, and is also available as a part of Flow Mixing Suite and Flow Complete Suite.
specs: |-
  - Amps: Bass Standard Line V8, Supernova Parallel Channel 300W, The Cardinal 100W
  - DI module: Direct Input DI
  - Cabinets: Bass Standard Line 8x10, Bass Standard 1x15, Solid 1x15, Pacific '59 BM 4x10, Marshall 1960 4x12
  - Pedals: Softube EQnäs EQ, Softube JJB chorus, Softube Jet Town compressor, Softube Wahstena autowah, Bass Octave octaver, RMS 63, Softube Wild Boar, Softube Trollegater, Softube Doom Chvrch, Kraft
  - Studio FX: Softube RoomIR, American Class A 55 EQ, American Class A 25 Comp
  - Fully redesigned user interface
  - 7 microphone options
  - 12 effects and utilities
  - Custom IR loader
  - 8 IR Producer Packs
  - A curated set of great-sounding presets
  - Customizable signal chains
  - Expandable with other Amp Room Suites and Amp Room Ready Softube products
  - Cabinet IR captures with moveable microphones
  - Parametric equalizer for added tone shaping
  - Suite Mode and Studio Mode workflows
  - Includes the Amplifiers companion plug-in
  - Three activations per license
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26
  - System requirements: Windows 10 (64-bit), Windows 11
  - Requires a Softube account
  - Requires an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access for downloading installers and managing licenses
