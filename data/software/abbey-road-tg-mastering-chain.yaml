details: >-
  Abbey road tg mastering chain is a modular mastering chain plugin modeled
  after the emi tg12410 transfer console used in all abbey road's mastering
  suites since the early '70s to this day. You can use the abbey road tg
  mastering chain to create custom processing chains with a flexible flow and
  the tg magic on the master bus, or on individual tracks/groups in a mixing
  session.


  The distinct solid-state transistor-based sound of the tg12410 has proven
  itself time and again over many decades. Whether it's used for mastering as a
  complete console, or for mixing with only select modules, the tg brings
  nothing less than magic the same magic heard on albums like pink floyd's the
  dark side of the moon, nirvana's in utero, radiohead's ok computer and ed
  sheeran's "+".


  Just like the original console, the tg mastering chain plugin is made out of
  modules (or cassettes): tg12411 input module, tg12412 tone module (eq),
  tg12413 compressor/limiter module, tg12414 filter module, tg12416 v.a.l
  (spread) module (stereo component only) incorporated into the output module.
  Modules can be interchanged (except for input/output modules) and switched
  on/off to allow for a flexible processing flow and creating custom chains.


  The compressor/limiter module offers two flavors original and modern and is
  coupled with 48 db/oct linear-phase sidechain filters to help you take
  complete control over your sound: original aggressive and "dirty" just like
  the '70s and exactly how waves modeled it. Modern an original waves and abbey
  road design based on the tg topology, that will help you get pristine sound
  with higher levels of perceived loudness.


  Alongside the tg mastering chain is the meter bridge component (separate
  plugin), offering a new approach to metering. Open one meter bridge component
  on any channel and get access (via drop-down) to all abbey road tg mastering
  chain instances in the session. Get a clear reading of vu, ppm, phase and peak
  at a glance, and stay focused on the music.
