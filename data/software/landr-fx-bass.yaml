description: LANDR FX Bass. The multi-FX plugin design for bass. Enhance the
  sound of your bass with the LANDR FX Bass plugin. Included in LANDR Studio.
details: |-
  LANDR FX Bass is a multi-FX plugin built specifically for bass instruments. It gathers tonal shaping, compression and effects processing into a single plugin so bass parts can be dialled in without chaining several separate processors.

  The plugin ships with 49 presets covering a range of bass sounds, from thick and juicy 808s to funky bass slaps. LANDR positions the preset library as a way to reach a polished sound instantly rather than building a chain from scratch.

  A blender dial is the plugin's central control. LANDR describes it as an easy-to-use dial that takes the guesswork out of complex mixing techniques, letting the user move toward a target sound with a single knob rather than adjusting each processor individually.

  Alongside tonal shaping and compression, FX Bass includes amp and modulation effects such as Auto Wah, Flanger and Phasers, intended for adding colour and character to bass instruments across genres.

  The product page features Oscar-winning engineer Daniel Rowland demonstrating FX Bass to accentuate bass lines with depth, high end and grit. The plugin is sold on its own and is also included with the LANDR Studio subscription.
specs: |-
  - 49 presets for tonal shaping, compression and effects
  - Blender dial control for simplified mixing
  - Amp and modulation effects including Auto Wah, Flanger and Phasers
  - macOS: MacOS X 10.14 or higher
  - macOS: Apple Silicon Native or Intel (VST3, AU, AAX)
  - Windows: Windows 10 (64 bit) or higher (VST3, AAX)
