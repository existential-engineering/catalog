description: Multi-effects bass plugin with 49 presets for tonal shaping, compression, and effects. Features amp and modulation effects including Auto Wah, Flanger, and Phasers with blender dial control.
details: |-
  49 meticulously crafted presets for bass processing. Amp and modulation effects including Auto Wah, Flanger, and Phasers. Easy-to-use blender dial control interface. Low-end shaping and character enhancement. Designed for 808s, funky bass slaps, and more. Part of FX Suite. Requires macOS 10.14+ or Windows 10 64-bit+.
