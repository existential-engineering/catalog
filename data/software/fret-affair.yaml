details: |-
  With fret affair we pay tribute to the glory l.a. Guitar session days from the
  80's, when clean-silky rack tones were on the first page of every production
  book. Whether it was toto or dozens of david foster hit-songs, this specific
  sound was the epitome of the popular westcoast music during that era.

  Fret affair allows keyboard players to jump into the souls and hands of
  legendary studio musicians like michael l, dann h, michael t. Fret affair
  allows you to access the iconic world of first-class rack guitar tones.
  Perfectly mixed and balanced and ready to play.

  Whether you're using it as swells, arpeggios or any other guitar-like parts in
  your production, the sound will integrate seamlessly even without using any
  additional processing or eq.

  Audiolounge teamed up with italian session guitarist claudio cervino, who's
  taste and experience with sounds, instruments and equipment is unparalleled.
