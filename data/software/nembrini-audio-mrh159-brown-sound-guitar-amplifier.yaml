details: |-
  Mrh159 Brown Sound Guitar Amplifier is modelled after a vintage Marshall Super Lead 1959 100W. With the MRH159 Brown Sound Guitar Amplifier, you can switch to a modified Marshall Super Lead 1959 setting to achieve the legendary BROWN SOUND.

  MRH159 Brown Sound Guitar Amplifier gives you the tools to craft your ideal tone. Channel 1 is voiced for a brighter, high-treble response, while Channel 2 offers a more balanced, normal response. Each channel features two inputs and its own loudness control for flexible sound shaping.

  The modifications to the stock amplifier used to achieve the legendary Brown Sound include a variable transformer reducing the mains voltage to 90V, power tubes replaced with 6CA7 "Fat Bottle" tubes, the middle tone stack potentiometer changed to 50kΩ, and a 25µF cathode bypass capacitor ("fat cap") added to the V2 preamp tube.

  The main part of the BROWN SOUND is the cabinet loaded with a JBL D120 on top and a Celestion G12M 25W Greenback on the bottom, blended with a Shure SM57 microphone.

  With Mrh159 Brown Sound Guitar Amplifier it is possible to choose between six different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs. Impulse Loader lets you load up to three third-party impulse responses that you can blend together using volume, pan, phase, solo and mute controls.
specs: |-
  - Two channels: Channel 1 voiced for a brighter, high-treble response, Channel 2 for a more balanced, normal response
  - Two inputs and an independent loudness control per channel
  - Brown Sound modifications: variable transformer reducing mains voltage to 90V
  - Brown Sound modifications: power tubes replaced with 6CA7 "Fat Bottle" tubes
  - Brown Sound modifications: middle tone stack potentiometer changed to 50kΩ
  - Brown Sound modifications: 25µF cathode bypass capacitor ("fat cap") added to the V2 preamp tube
  - Brown Sound cabinet: JBL D120 on top and Celestion G12M 25W Greenback on bottom, blended with a Shure SM57 microphone
  - Cabinets: six different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs
  - Mixer section with Solos, Mutes, Pans and Faders to blend the two microphones with the ambience
  - Impulse Response Loader: up to three third-party impulse responses blendable with volume, pan, phase, solo and mute controls, with a browser window for searching IR files
  - Cleaner/Noise Gate: noise gate section plus a Cleaner circuit to reduce rumbling and harshness
  - Plugin Formats: a VST2, VST3, AAX or AudioUnits compatible host
  - System: an Intel compatible or Apple Silicon CPU, 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
