description: MRH159 is a guitar amplifier plugin modelled after a vintage Marshall Super Lead 1959 100W, featuring both standard and modified "Brown Sound" settings with a full cabinet, microphone, and impulse response section.
details: |-
  MRH159 Brown Sound Guitar Amplifier is modelled after a vintage Marshall Super Lead 1959 100W. With the MRH159 you can switch between a standard Marshall Super Lead 1959 setting and a modified configuration to achieve the legendary BROWN SOUND.

  The amplifier offers two channels: Channel 1 is voiced for a brighter, high-treble response, while Channel 2 offers a more balanced, normal response. Each channel features two inputs and its own loudness control for flexible sound shaping.

  The Brown Sound modifications include a variable transformer used to reduce the mains voltage to 90V, power tubes replaced with 6CA7 "Fat Bottle" tubes, a middle tone stack potentiometer changed to 50kΩ, and a 25µF cathode bypass capacitor ("fat cap") added to the V2 preamp tube.

  The cabinet section is loaded with JBL D120 on top and Celestion G12M 25W Greenback on bottom, blended with a Shure SM57 microphone. Six different guitar cabinets are available with four microphone emulations featuring on/off axis position switching, continuous position and distance knobs, and a complete mixer section with solos, mutes, pans, and faders.

  An impulse response loader lets you load up to three third-party IRs that can be blended together using volume, pan, phase, solo, and mute controls. A built-in browser window makes it easy to search through your IR files. A noise gate and cleaner circuit to reduce rumbling and harshness are also included.
specs: |-
  - Modelled after vintage Marshall Super Lead 1959 100W
  - Two channels: Channel 1 (bright/high-treble) and Channel 2 (balanced/normal)
  - Brown Sound modifications: 90V variable transformer, 6CA7 power tubes, 50kΩ middle pot, 25µF cathode bypass cap
  - Six guitar cabinet options with JBL D120 + Celestion G12M 25W Greenback
  - Four microphone emulations with on/off axis switching, position and distance controls
  - Impulse response loader supporting up to three blendable third-party IRs
  - Complete mixer section with solos, mutes, pans, and faders
  - Noise gate and cleaner circuit
  - Formats: VST2, VST3, AAX, AudioUnits (AU)
  - Platforms: macOS 10.13+, Windows 7+, iOS (iPhone/iPad)
  - Requires 64-bit DAW, Intel or Apple Silicon CPU, 1GB RAM minimum
  - Version 1.0.7
