description: A multiband transient designer with three frequency bands, adjustable crossover points and a real-time display. Each band adds width, smooth, attack and release controls for shaping transient response.
details: |-
  Imprint is a multiband transient designer aimed at bringing audio forward and adding punch, from reinforcing kick drums through to taming the tails of synth lines. It runs in the major plugin formats on Mac and Windows.

  The three-band workflow boosts transients occurring in different frequency ranges. A multiband graphic interface sets the crossover points and the gain of each band, and each band carries a mix control that boosts transient content in its range, along with a bypass.

  An advanced panel sits under each band's mix controls, reached through a triangular control. It exposes peak width, smooth, attack and release. Width sets the width of the peaks being targeted, smooth softens those peaks for a subtler effect, attack dampens the transients, and release stretches the generated gain boost over time for a more extreme result.

  The Imprint logo acts as a bypass for the whole plugin. It is smoothed to be free of clicks and pops so that A/B testing is not interrupted.

  Over 20 factory presets provide tailored settings for a range of instruments, mastering chains and special effects, all reachable from the plugin menu, and user settings can be saved as presets. Version 2.1.0 added a resizable interface, an updated preset manager and updated license management. Version 2.2.0 added native Apple Silicon and arm64 compatibility.
specs: |-
  - Multiband transient shaper with three frequency bands
  - Adjustable crossover points and per-band gain
  - Per-band advanced controls for width, smooth, attack and release
  - Click-free bypass per instance and per band
  - Over 20 presets for bass, drums, vocals, mastering and effects
  - Output level and master gain control
  - Real-time waveform display
  - Resizable interface added in version 2.1.0
  - PDF manual and tutorial video
  - Windows 10 or 11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Native Apple Silicon and arm64 support added in version 2.2.0
