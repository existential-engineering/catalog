details: |-
  Acoustic grand piano is a library of samples recorded from a steinway d acoustic piano and powered by the uvi workstation.

  It's designed to be not about figures (velocity, memory, number of mikes) but about feeling. This sampled piano is uvi's fourth.

  Uvi solicited the advice of two different classical and jazz pianists, both outstanding concert performers, to find the ideal piano. Then they booked for several days one of the best recording studios in europe.

  After testing tons of microphones amongst the world's best ones and looking for the right placing, every single note was carefully multi-sampled at multiple velocity levels for both normal playing and with the sustain pedal pressed.

  The sounds benefit from the uvi engine's advanced keygroup layers and rule switching, which allow the sustain pedal and release samples to perform and feel like a real piano.
specs: |-
  - VST plugin
  - Audio units plugin
  - VST 3 plugin
  - AAX plugin
  - Multi-sampled at multiple velocity levels
  - Sustain pedal support
  - Release samples
  - Advanced keygroup layers
  - Rule switching
  - Macos support
  - Windows support
