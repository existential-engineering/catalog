description: "The ultimate creative semi-modular delay machine capable of
  producing effects ranging from simple echoes to complex rhythmic patterns and
  pitch-shifting effects."
details: |-
  Up to 10 seconds delay time per channel. Semi-modular architecture with cross-channel feedback. Stereo (L/R) and Mid-Side (M/S) operating modes. 6 LFO waveforms with tempo sync. 17 filter types with adjustable cutoff and resonance. Multi-algorithm reverb module (springs, plates, spaces). 64-bit floating point signal path. Supports up to 384 kHz sample rates. Nearly 400 presets included.
