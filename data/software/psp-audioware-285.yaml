description: The ultimate creative semi-modular delay machine built upon the legacy of PSP 84 and PSP 85. PSP 285 offers extensive delay-based effects capabilities ranging from traditional echoes to complex rhythmic patterns and pitch-shifting effects, featuring up to 10 seconds delay time per channel, a semi-modular architecture with cross-channel feedback, stereo and Mid-Side operating modes, 17 filter types, a multi-algorithm reverb module, 6 LFO waveforms with tempo sync, drive/saturation, support for sample rates up to 384 kHz, and nearly 400 presets.
details: |-
  PSP 285 is based on the legendary PSP 84 and PSP 85 delay plug-ins. It is PSP's latest exploration of the endless possibilities offered by variable sample rate delay lines. It can produce an extremely wide variety of delay-based effects, from simple slapbacks and echoes to complex rhythmic patterns, from faithful magnetic tape delay simulations to twisted out-of-this-world pitch-shifting and resonant filtering effects, all at world-class audio quality.

  NOTE: Because of its many new features, PSP 285 is not backward compatible with PSP 85, which will no longer be developed further. Installing PSP 285 does not replace PSP 85, and PSP recommends using PSP 285 for new and future projects.

  The semi-modular architecture offers up to 10 seconds of delay (pre + main) time per channel, depending on internal sampling frequency, with pre-delay for each channel, continuous delay time control, cross-channel feedback and independent channel settings, a channel link mode, delay gating for improved control over number and level of echoes, stereo (L/R) or Mid-Side (M/S) operating modes, and wet signal ducking for improved sound clarity.

  A modulation section combines a tempo-synced LFO and an envelope follower that can be mixed in any proportion, with 6 click-free LFO waveforms as well as variable LFO offset and phase channel spread. A selection of 17 different filter types with adjustable cutoff and resonance sits alongside a post-filter or independently routed Drive algorithm with hard and soft saturation modes, and a multi algorithm reverberation module including springs, plates, various spaces, and reverse, available in both mono-to-stereo and dual mono modes.

  Running PSP 285 in 30-day trial mode or activating it requires no hardware dongle, but does require an iLok user ID, which can be created for free at www.ilok.com, and the free iLok License Manager application. The license can be activated in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above).
specs: |-
  - Semi-modular architecture
  - Up to 10 seconds of delay (pre + main) time per channel, depending on internal sampling frequency
  - Pre-delay for each channel
  - Continuous delay time control over the delay time
  - Cross-channel feedback and independent channel settings
  - Channel link mode
  - Delay gating for improved control over number and level of echoes
  - Stereo (L/R) or Mid-Side (M/S) operating modes
  - Wet signal ducking for improved sound clarity
  - Modulation section with a tempo-synced LFO and envelope follower that can be mixed in any proportion
  - A wide selection of envelope follower control signals in linked or unlinked mode
  - 6 click-free LFO waveforms as well as variable LFO offset and phase channel spread
  - A selection of 17 different filter types, with adjustable cutoff and resonance as well as flexible routing capabilities
  - Post filter or independently routed Drive algorithm with hard and soft saturation modes
  - Multi algorithm reverberation module including springs, plates, various spaces, and reverse, available in both mono-to-stereo and dual mono modes
  - Flexible reverb positioning in the signal chain: dry, wet, or mixed wet+dry delay output
  - Mixer parameters can be stored in each preset, or applied to any preset selected when in Global mode
  - Wet mode switch for use in sends
  - Control signal filtering for smooth, click-free operation
  - High quality 64-bit floating point signal path and unique proprietary processing algorithms
  - Support for sample rates of up to 384 kHz
  - Almost 400 presets
  - Windows 7 - Windows 11 (64-bit)
  - macOS 10.14 - macOS 15 Sequoia (Intel or Apple Silicon)
  - AAX requires Pro Tools
  - Requires a free iLok user ID and the iLok License Manager application, no hardware dongle required
  - License activatable in 3 separate locations
