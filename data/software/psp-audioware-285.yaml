description: The ultimate creative semi-modular delay machine built upon the legacy of PSP 84 and PSP 85. PSP 285 offers extensive delay-based effects capabilities ranging from traditional echoes to complex rhythmic patterns and pitch-shifting effects, featuring up to 10 seconds delay time per channel, a semi-modular architecture with cross-channel feedback, stereo and Mid-Side operating modes, 17 filter types, a multi-algorithm reverb module, 6 LFO waveforms with tempo sync, drive/saturation, support for sample rates up to 384 kHz, and nearly 400 presets.
details: |-
  Semi-modular delay plugin successor to PSP 84 and PSP 85. Supports stereo L/R and Mid-Side M/S modes. 64-bit floating-point signal path. Nearly 400 factory presets. Licensing via iLok (free iLok ID required); supports 3 activations on computers or iLok dongles. Compatible with Windows 7-11 (64-bit) and macOS 10.14-15 Sequoia (Intel and Apple Silicon).
specs: |-
  - Delay time: up to 10 seconds per channel
  - Operating modes: Stereo (L/R), Mid-Side (M/S)
  - Filter types: 17, with adjustable cutoff and resonance
  - Reverb: multi-algorithm (springs, plates, reverse)
  - LFO waveforms: 6, with tempo sync
  - Drive: hard/soft saturation algorithm
  - Sample rate support: up to 384 kHz
  - Signal path: 64-bit floating-point
  - Presets: nearly 400 included
  - Activations: 3 (computers or iLok dongles)
  - Windows: 7-11 (64-bit)
  - macOS: 10.14-15 Sequoia, Intel and Apple Silicon (64-bit)
