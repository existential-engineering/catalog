details: |-
  Artphase is a pd (phase distortion) synths and is capable of producing a
  variety of waveforms by distorting the read phase angles of sine and cosine
  waves.

  Patch editing is quite easy, but be sure to check out the multiple layers on
  the envelopes a/b, modulation and effects windows. It has the same selection
  of waveforms as the cz as well as the two oscillators (or lines). The ring
  modulator has some nice variations/combinations applying to the lines 1/2 -
  a/b, the mix between and the filter. Great delay and chorus features creates a
  wide stereo feel with sweeping pans!

  The gui at would at first peg the arthphase to be an overly simplistic first
  attempt and looks a little utilitarian, but in fact contains quite a few
  "hidden" parameters that you would miss if you were just browsing. Click on
  the arrows/pointers (on the headers that have one) to discover bonus bits that
  include 2 more modulation matrices (one of which is assignable tempo synced),
  chorus, distortion, a left/ right delay and a total of three different
  envelopes for each oscilliator making for a pretty versatile instrument.

  The artphase generates very deep and wide soundschemes that can be
  surprisingly thicker and heavier than one might expect. It is extremely easy
  to use and becomes intuitive within a matter of a few moments of exploration.
specs: |-
  - Phase distortion (pd) synthesis
  - Waveform distortion via phase angle manipulation
  - Two oscillators
  - Envelopes a/b
  - Modulation matrices
  - Ring modulator
  - Delay
  - Chorus
  - Distortion
  - Left/right delay
  - Three envelopes per oscillator
  - Tempo-synced modulation
  - Windows compatible
