description: The Echobandit Plug-ins Rack is modelled after the original Echobandit by F-Pedals , the combination of both Gold and Silver edition withs some extra features. The Echobandit original pedal is in the list of “must-have mini pedals” made by sound guru Pete Thorn . The rack version of the Plug-in includes a FILTER knob control that allows a sound range from the Gold to the Silver version of the original pedal and everything in between. It will cover an incredibly wide range of sounds from an awesome classic slapback to experimental modern long distorted sounds. It can be warm and smooth or aggressive and punchy to cover all your possible soundscapes needs.
details: |-
  The Echobandit Plug-ins Rack is modelled after the original Echobandit by F-Pedals, the combination of both Gold and Silver editions with some extra features. The Echobandit original pedal is in the list of "must-have mini pedals" made by sound guru Pete Thorn.

  The rack version of the Plug-in includes a FILTER knob control that allows a sound range from the Gold to the Silver version of the original pedal and everything in between. It will cover an incredibly wide range of sounds from an awesome classic slapback to experimental modern long distorted sounds. It can be warm and smooth or aggressive and punchy to cover all your possible soundscapes needs.

  The Rack version has been enhanced and has actually 2 independent EchoBandit channels that can be used in mono, dual mono and stereo. Each channel has independent controls. It's a super flexible delay plugin capable of a wide range of sound possibilities, to allow musicians and producers of any genre to enjoy the wonderful palette of tones that the Echobandit has to offer.

  Additional Rack version features include PAN, which moves the channel position to L or R, DRY/WET, which blends the effected and dry signals, a SYNC button to synchronize the time of the echo to your hosting DAW, and LCDs (one per channel) that display the tempo division when in SYNC mode or the speed in milliseconds when not synched to the host.

  LINK buttons link the controls of the 2 separate channels, and a MASTER LINK sets all 4 link buttons on or off simultaneously. INPUT and OUTPUT level knobs give maximum versatility, and a very handy VU-Meter monitors the signal at input and output.
specs: |-
  - Modelled after the F-Pedals Echobandit, combining the Gold and Silver editions
  - Two independent EchoBandit channels, usable in mono, dual mono and stereo
  - FILTER knob sweeps from the Gold to the Silver voicing and everything in between
  - PAN control per channel
  - DRY/WET blend
  - SYNC button to synchronize echo time to the host DAW
  - LCD per channel showing tempo division in SYNC mode or speed in milliseconds
  - LINK buttons to link the two channels' controls, plus MASTER LINK
  - INPUT and OUTPUT level knobs
  - VU-Meter for input and output monitoring
  - Requires a VST2, VST3, AAX or AudioUnits compatible host
  - Intel compatible or Apple Silicon CPU, 1GB RAM
  - Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
