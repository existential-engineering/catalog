details: |-
  The Echobandit Rack Analog Tape Echo Delay is modelled after the original Echobandit by F-Pedals, combining both the Gold and Silver editions in a single plugin with additional features. A dedicated Filter knob lets you blend seamlessly between the characteristics of the two editions, giving you access to warm, smooth, or aggressive tape echo tones.

  At the core of the plugin are two fully independent EchoBandit channels that can operate in mono, dual mono, or stereo modes. Each channel features Pan control for left/right positioning, a Dry/Wet blend knob, and an LCD display showing either tempo division (when synced) or delay time in milliseconds.

  The Sync button locks the delay time to your DAW host tempo, while Link buttons allow you to couple individual channel parameters together. A Master Link toggle connects all four link controls simultaneously for fast, unified adjustments. Input and Output level knobs and a VU-Meter complete the signal chain controls.

  The plugin covers an incredibly wide range of sounds — from an awesome classic slapback to experimental modern long distorted tape sounds — making it equally at home on guitars, vocals, synths, and full mixes.
