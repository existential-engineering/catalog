description: "The Echobandit Plug-ins Rack is modelled after the original
  Echobandit by F-Pedals , the combination of both Gold and Silver edition withs
  some extra features. The Echobandit original pedal is in the list of
  “must-have mini pedals” made by sound guru Pete Thorn . The rack version of
  the Plug-in includes a FILTER knob control that allows a sound range from the
  Gold to the Silver version of the original pedal and everything in between. It
  will cover an incredibly wide range of sounds from an awesome classic slapback
  to experimental modern long distorted sounds. It can be warm and smooth or
  aggressive and punchy to cover all your possible soundscapes needs."
details: |-
  The Echobandit original pedal is in the list of “must-have mini pedals” made by sound guru Pete Thorn . The rack version of the Plug-in includes a FILTER knob control that allows a sound range from the Gold to the Silver version of the original pedal and everything in between. It will cover an incredibly wide range of sounds from an awesome classic slapback to experimental modern long distorted sounds. It can be warm and smooth or aggressive and punchy to cover all your possible soundscapes needs. The Rack version has been enhanced and has actually 2 independent EchoBandit channels that can be used in mono, dual mono and stereo. Each channel has independent controls. It’s a super flexible delay plugin capable of a wide range of sound possibilities, to allow musicians and producers of any genre, to enjoy the wonderful palette of tones that the Echobandit has to offer.
