description: HoRNet Spikes is a transient shaper with intelligent auto settings, offering one-knob control and full manual tweakability.
details: |-
  HoRNet Spikes is a transient shaper and processor designed to give precise control over the dynamics of a sound. Its standout feature is its intelligent automatic settings, which allow the transients of an audio signal to be manipulated with just one knob, while all settings remain fully accessible for detailed customization.

  Traditional compressors require a fixed threshold, which demands careful monitoring of the input level. Spikes instead uses a relative threshold which automatically adjusts based on the input signal, so it responds without constant attention to levels.

  Spikes responds to fast transients, such as those created by a snare drum or acoustic guitar, even faster than the peaks themselves. It uses an envelope follower system that compares two different envelopes, one with a fast attack and one with a slow attack; the difference between them indicates the presence and strength of transients, and that difference signal feeds a gain stage which dynamically adjusts the volume according to the spike level set.

  Both peak length and release time can be adjusted, and an auto-release mode synchronizes to the tempo of the project. A high-pass filter with a 12dB/oct slope sits before the transient detector to reduce the impact of low-frequency content on detection. The central spikes level knob adjusts the amount of gain applied to detected transients, an auto-output gain compensation option maintains a consistent output level, and a real-time gain meter plus upper and lower gain limit sliders keep the processing within a chosen range.
specs: |-
  - Relative threshold gain manipulation
  - Adjustable amount of gain applied
  - Adjustable output level
  - Auto output level
  - Upper and lower gain limiting
  - High pass filter on the detector
  - Adjustable detector attack and release
  - Auto release time based on song tempo
  - Gain meter
  - Input and output peak meters
  - Mac OS X (10.7 and later) and Windows support
  - 64-bit compatibility both on Mac and Windows
  - Audio Units, VST2.4, VST3 and AAX format
  - Apple Silicon native support
  - No copy protection
