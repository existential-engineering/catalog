description: A rare instrument that was sold door to door in the XX century. Played with the bouncing metal hammers, pick and using fingers.
details: |-
  The Marxophone was produced by the Marxochime Colony of New Troy, Michigan. Billed as easy to play and sold on time-purchase plans by door-to-door salesman. The sound of the Marxophone is reminiscent of the various types of hammered dulcimer in music traditions world-wide. It has four sets of chord strings to be strummed with the left hand and two octaves of double melody strings, which are struck by metal hammers activated by the right hand.

  Apart from the obvious melody strings, the library also includes a complete set of major and minor chords that can be played with the left hand. The right hand can play melodies using the different articulations that Marxophone offers: springs, pick and fingers, in any combination. Being a fretless dulcimer, with strings attached on a hollow wooden body that resonates, the sound that comes out of it is very magical.

  The Marxophone was sampled using different articulations, all of them controllable from the mixer panel, with a load/purge switch for each channel, pan/width, volume, mute, solo, phase shift and an output selector for mixing the different channels in your DAW.

  In the effects page you can add any effect you want in any order, including EQ, compressors, modulation effects, distortion, saturation, tape machine, reverbs, amp simulators and more. This script boosts the sonic capabilities of the library exponentially, in a simple and intuitive design.

  From the settings page you can control round robin, dynamic range, velocity curve and envelope, along with a springs release parameter that sets the volume of the mechanical noises and vibrating strings when releasing the keys.
specs: |-
  - 1.58 GB
  - 1,033 samples
  - 4 articulations: chords, springs, pick and fingers
  - 4x round robin
  - 4 velocity layers
  - Kontakt 5.7.3 and newer versions
  - Full version of Kontakt required, Kontakt Player will run in demo mode
  - Mixer with load/purge per channel, pan/width, volume, mute, solo, phase shift and output selector
  - Effects page with EQ, compressors, modulation, distortion, saturation, tape machine, reverbs and amp simulators in any order
  - Settings page with round robin, dynamic range, velocity curve, envelope and springs release
