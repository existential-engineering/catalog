details: |-
  prEDITOR is a desktop editor and librarian for Ottobit X, Enzo X, MercuryX and LVX. It can connect over MIDI via USB-C as well as a standard MIDI device, and includes a built-in PatchStorage community portal to upload, download, browse, search and like community presets without leaving the app.

  The editor allows instant switching between the four devices, drag-and-drop import and organization of presets and libraries, renaming, duplicating, swapping, exporting and deleting presets, and moving or copying full banks between libraries. Live device sync enables on-the-fly auditioning with safeguard editing, and left and right favorite banks can be assigned by drag and drop.

  Other features include a dynamic ADSR graph for Enzo X, a bypass switch, instant access to global parameters, and always-available factory presets. prEDITOR is a free download for Mac and Windows desktop.
