description: Free companion software for Darkglass gear that manages presets,
  loads impulse responses, installs firmware, and configures amplifiers, pedals,
  and footswitches from desktop and mobile.
details: |-
  Free and feature-packed, the Darkglass Suite combines with your favorite Darkglass gear to take full advantage of its potential. It serves as a control hub for the company's audio equipment ecosystem, unifying preset creation, cabinet simulation management, and device configuration in a single interface.

  Core functions include preset management (create, edit, and share presets across devices), impulse response loading (access factory IRs or load custom third-party IRs), firmware updates, device configuration over USB or wireless connection, and signal chain editing on compatible devices. The software adapts its feature set to the connected hardware: Infinity Combos unlock full signal chain modification, while pedals like the Element and Ultra series gain cabinet simulation and firmware management.

  The Suite is available on desktop (Windows and macOS) and mobile (iOS and Android). A legacy version remains available for older devices, specifically the Element v2.0 and below, Ultra series, and classic 900 amplifier line.
specs: |-
  - Preset management: create, edit, and share presets across devices
  - Impulse response loading: factory IRs and custom third-party IRs
  - Firmware updates for connected Darkglass devices
  - Device configuration over USB or wireless
  - Signal chain editing on compatible devices
  - Free download
