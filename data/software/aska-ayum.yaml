name: Aska Ayum
manufacturer: wantech
primaryCategory: synthesizer
description: "Features: single oscillator. Low/high/band pass filter. Adsr envelope."
details: >-
  Aska ayum is a virtual instrument audio plugin for windows that functions as a
  VST plugin.


  The synth features a simple 2 operator fm architecture with one envelope and a
  nice filter, designed for easy automation and flexible sound design.


  The plugin is known for its wysiwyg interface and simple, flexible
  architecture that allows users to create sounds from hi-hats to bass in
  seconds with minimal cpu usage.
specs: |-
  - Fm synthesis
  - 2 operator fm
  - Envelope
  - Filter
  - VST plugin
  - Windows
  - Virtual instrument
  - MIDI compatible
  - Cc automation
