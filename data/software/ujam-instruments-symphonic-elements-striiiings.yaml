description: Symphonic Elements STRIIIINGS gives you access to the emotive power of several world-class string sections, featuring exclusive recordings from Hans Zimmer's personal multi-million-dollar library.
details: |-
  Symphonic Elements STRIIIINGS gives you access to the emotive power of several world-class string sections, featuring exclusive recordings from Hans Zimmer's personal multi-million-dollar library. Whether you are scoring films, crafting dramatic pop tracks, or adding orchestral depth to your beats, STRIIIINGS brings a full cinematic orchestra to your fingertips, no formal training required.

  Split your orchestra into two layers, Low Strings (basses and celli) and High Strings (violins and violas). Adjust each section independently or blend them with the Crossfade control for balanced performances. Each section includes a dedicated sound design engine with effects like Character and Motion FX, so the strings can be sculpted and animated separately.

  Choose from a variety of pre-arranged Styles, each offering unique phrases and string sections. From cinematic swells to rhythmic motifs, the Styles match the feel and tone of your track with ease.

  Shape the sound with the integrated Finisher and Ambience FX. Add lush reverb, creative motion effects, or completely transform the strings with experimental Finisher presets designed to push the boundaries of traditional orchestral sounds.
specs: |-
  - World-class string section performances, no orchestration skills required
  - Dedicated instrument engine by UJAM
  - 60 styles and more than 200 sound designer presets
  - Separate Low Strings and High Strings sections with Crossfade, Character and Motion FX
  - Integrated Finisher and Ambience FX
  - Supported standards: NKS
  - Operating systems: Windows 10 to Windows 11, macOS Mojave (10.14) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 4 GB of RAM
  - 4.7 GB of disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery: automated installation via the UJAM App, or downloadable installer file
  - Authorization via the UJAM App, or email and password within the plug-in
  - All MIDI phrases and included sounds are royalty-free
