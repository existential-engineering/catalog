details: |-
  '80s synths volume 1' contains 110 presets for spire (and respire), bringing you the distinctive oldschool sounds of that cherished era. Inspired by many beloved 80's pop hits, theme songs from popular 80's tv shows, and vintage analog hardware, this sound library is a powerful toolkit for giving your tracks that special retro mojo.

  Each preset has, at the very least, modwheel and velocity assignments for added expression and live playability.

  Download includes: 110 presets for spire (respire format also included): 25 basses, 20 leads, 19 keys and polysynths, 16 pads, 16 plucks, 5 brass synths, 4 fx risers, 3 bells, 1 melodic tom, 1 horror soundscape.
