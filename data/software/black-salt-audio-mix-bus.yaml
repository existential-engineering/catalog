description: Glue, sculpt and polish your mix with BSA Mix Bus, an intuitive
  all-in-one plugin for smooth compression, low-end control, tone shaping, and
  loudness.
details: |-
  Glue, sculpt & polish your mix. BSA Mix Bus is an all-in-one mix bus plugin combining compression, low-end control, tone shaping, and loudness control in a single interface.

  Effortlessly dial in satisfying glue or explosive impact by toggling between the Glue and Punch compression modes with a single main control.

  Lock in and stabilize your low end with a dedicated circuit that tames low-frequency mud and gives you full control over the bottom end.

  The Sculpt section goes far beyond basic EQ: dial in Beef, Body, and Air to instantly inject analog saturation, mid-range weight and warmth, and glossy top-end clarity without harshness.

  Push your track to competitive commercial volume with one knob, then toggle Gain Match to audition your changes without loudness bias.
