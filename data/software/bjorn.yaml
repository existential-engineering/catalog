name: Bjorn
manufacturer: fanan-team
primaryCategory: filter
description: Bjorn is a filter module containing 14 types of filters for any
  purpose, controlled by an x, y pad for live matters.
details: |-
  The filters had been borrowed from our latest developed tools and added
  together into one collection.

  Bjorn is cpu friendly and latency free.

  Multi type filter (standard, state variable, zelda) with distinct fanan style
  sound that sounds digitally harsh and very bright.

  Filter is very simple with a 2d controller with cut frequency and resonance
  axis.
specs: |-
  - 14 types of filters
  - X, y pad controller
  - Standard filter type
  - State variable filter type
  - Zelda filter type
  - CPU friendly
  - Latency free
  - 2d controller with cut frequency and resonance axis
