details: |-
  Modeled after a unit originally appearing in the late 80s, the VEQ-4K features proportional gain settings and shelving HF & LF EQs with a signature combo of dip and bump right before the shelf boost and cut. The Pink module has a wider frequency range with the boost/cut and gain range above +/- 20dB.

  VEQ-4K PINK runs natively in your DAW on macOS or Windows, and also runs in real-time on Antelope Audio Synergy Core hardware interfaces.
