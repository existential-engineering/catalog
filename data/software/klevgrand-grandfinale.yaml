description: Grand Finale is a multi effect plug-in designed for finalizing
  complete mixes, stems, buses and/or individual audio tracks. The plug-in
  offers several modules in a pre-routed configuration.
details: |-
  Grand Finale is a multi effect plug-in designed for finalizing complete mixes, stems, buses and/or individual audio tracks. The plug-in offers several modules in a pre-routed configuration. Each module has parameters to alter, and most modules offer a set of different algorithms to select. These features come together to make Grand Finale a powerful tool for quickly finalizing a track, bus or mix.

  Version 2 gave the plug-in a major face lift and some extra horse power under the hood, including a revamped UI optimized for a quick and creative workflow.

  In use, you trim the input signal, add your desired amount of compression, multi-band compression, stereo width and EQ, blend in some additional compression and/or distortion, and glue it all together by balancing the input and output trim. The meters are there to monitor and adjust the output level to whatever destination.

  The signal chain runs through six sections: an input section with input level and high-pass filter, a compressor, a multiband compressor, a combined width and EQ stage, an additional parallel signal path carrying distortion and/or squashed compression, and a master section with LUFS and RMS metering plus an optional limiter.
specs: |-
  - High quality effects, trimmed for high-precision audio finalizing
  - LUFS and RMS output metering
  - Parallel signal in aligned phase
  - Additive signal path with distortion and/or compression
  - Revamped UI optimized for a quick and creative workflow
  - Stereo width enhancer
  - Multi-band compressor
  - Fine-tuned limiter
  - Collection of pre-made presets
  - Input section with input level and high-pass filter
  - Requires macOS 10.10 or later (optimized for the M1 processor) or Windows 7 (SP1) or later
  - Requires an AU, VST or AAX compatible 64-bit host
  - iPad/iPhone version available as Standalone and AUv3
