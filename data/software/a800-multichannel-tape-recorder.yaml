details: |-
  The studer a800 plug-in is the world's only authentic emulation of the famed a800 machine located at ocean way studios in los angeles.

  Used on classic records from stevie wonder and tom petty to metallica, and a tribe called quest, the studer a800 stands alone for its ability to add warmth, presence, and glue to tracks and mixes.

  The ips control steps through tape speeds, each with distinct frequency shift and distortion characteristics.

  The tape control gives you four of the most popular magnetic tape formulas each with their own subtle sonic variation.

  Far beyond a simple tape plug-in, the studer luna extension is woven into luna's mixer, giving you an analog-inspired workflow with bona fide analog sonics to match.
