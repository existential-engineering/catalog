description: The best sampler VST/AU/AAX plugin to chop, flip, isolate track
  stems, pitch shift and time stretch your audio. Fast, inspiring and with
  powerful audio quality.
details: |-
  Serato Sample is a powerful sampler plugin with stem separation that isolates acapella, melody, bassline, and drums from any track in real time.

  Pitch shifting and time stretching preserve audio quality while transforming samples. Up to 32 cue points per sample with BPM sync and key shifting let producers explore creative chops fast.

  Find Samples algorithm helps identify the best sections of any track for sampling. Keyboard Mode plays samples as melodic instruments across the keyboard.
specs: |-
  - Stem separation (vocals, melody, bass, drums)
  - Pitch shifting and time stretching with pitch preservation
  - Up to 32 cue points per sample
  - BPM sync and key shifting
  - Find Samples algorithm
  - Colored waveform visualization
  - Keyboard Mode (play samples as instruments)
  - Beat grids and quantization
  - MIDI hardware integration with velocity sensitivity
  - Native control for AlphaTheta SLAB pad controller
