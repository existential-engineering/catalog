description: A deep-sampled virtual instrument of a 1975 Gibson jazz guitar with
  Tarback humbucker neck pickups, offering expressive dynamic playing.
details: |-
  Soft. Soulful. Guitar. The uniquely looking Gibson 1975 has a gorgeous soft quality to it. One of the most soulful vibes on soft velocities, but as you gradually play it harder the Soundpaint Engine generates more dynamic velocities, so you can truly express over the entire range of the real instrument. A big part of the 1975 Gibson Jazz Guitar is the neck pickup design by Bill Lawrance. The pickups are known as Tarbacks (aka Super Humberkers. They get the "Tarback" nickname due to the black epoxy the pickups where encased in which looks like tar. The interesting thing is that the epoxy encasing was an early attempt to lessen microphonic feedback in humbucking pickups.
