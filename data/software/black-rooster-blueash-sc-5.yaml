description: "Accurately modeled after the original 70s blue-faced version of a classic and sought-after VCA compressor the sc-5 opens up a whole world of versatility: gentle compression to sweeten the signal on your master buss, distorted smashed-up sound on your drum buss, or taming lively and dynamic material. The full-blown set of parameters allows you to dial in just the right setting for your application while always maintaining its own pleasant and characteristic tone."
details: |-
  Inspired by the Ashly SC-50: the BlueAsh SC-5 recreates the original blue-faced 1970s revision of a classic and sought-after American VCA compressor, open, colourful and fast on its feet.

  The BlueAsh SC-5 is a feedback VCA compressor that refuses to be pinned to one job. Super-gentle leveling to sweeten a master bus, a distorted smashed-up drum bus, or taming lively dynamic material without squashing the life out of it, the full parameter set lets you dial in exactly the setting a source needs, and through all of it the unit keeps its own pleasant, characteristic tone.

  The blue-faced SC-50 came first, and it earned its reputation on versatility and a musical VCA that flattered almost anything you fed it. Black Rooster Audio rebuilt that behaviour with real-time, SPICE-style circuit simulation, modelling every crucial stage as a living circuit: the custom VCA, the dual time-constant detector, the feedback compressor loop and the audio path are all captured component by component rather than baked into a static transfer curve. Because it's a feedback design, gain reduction is derived from the compressor's own output, giving the BlueAsh its smooth, self-correcting grab. It's a fixed-threshold compressor, so you set the amount of compression by driving the input Gain and make up level with the Output knob.

  Attack times reach down to a very fast 200 microseconds and stretch to 20ms, release runs from 100ms to 2s, and the Ratio steps from a gentle 1:2 up through 1:2.5, 1:3, 1:5.5, 1:7, 1:10, 1:20, 1:30, 1:100 to a full 1:infinity for outright limiting. Unlike its sibling the BlackAsh, there is no 31.2kHz audio-path lowpass shaving the top, so the BlueAsh stays brighter and more airy. The Link switch sets stereo-linked or dual-mono operation, and the Limit button bypasses the compressor path alone for A/B comparison.

  On drums, the fast attack lets you clamp and pump a bus into a solid, aggressive groove, or back off for punch that still breathes. On electric guitars it tightens dynamics and adds forward colour. On the mix bus it glues without smearing, and its clean, transparent side makes it usable in mastering when only a decibel or two of controlled leveling is needed.
specs: |-
  - Attack: 200 microseconds to 20ms
  - Release: 100ms to 2s
  - Ratio: stepped 1:2, 1:2.5, 1:3, 1:5.5, 1:7, 1:10, 1:20, 1:30, 1:100, 1:infinity
  - Fixed-threshold Gain control with auto gain compensation
  - Stereo Link switch (stereo-linked or dual-mono operation)
  - Limit bypass switch (bypasses compressor path only)
  - No top-end lowpass filter in the audio path (sub-1Hz DC-blocking highpass only)
  - Real-time SPICE-style component-based circuit simulation
  - SSE2-optimised DSP code
  - Auto-adjusted oversampling (linear-phase Dolph-Chebyshev polyphase design)
  - HighDPI/Retina interface support
  - Minimum 1GB RAM, 1280x1024 display resolution or more
