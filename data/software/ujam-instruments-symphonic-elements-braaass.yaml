description: Symphonic Elements BRAAASS brings Hans Zimmer's legendary brass recordings to life in a phrase-based instrument.
details: |-
  Symphonic Elements BRAAASS brings Hans Zimmer's legendary brass recordings to life in a phrase-based instrument. Featuring world-class recordings of French horns, trumpets and trombones, BRAAASS transforms the power and majesty of orchestral brass into an intuitive instrument. Whether you are crafting cinematic scores, bold hip-hop beats, or experimental techno, it delivers million-dollar sound without the complexity.

  Low Brass (tubas, bass trombones) and High Brass (trumpets, horns) are controlled separately. A Crossfade slider blends the two sections, and each layer's tone can be customized with built-in Character and Motion FX for dynamic results.

  Choose from 78 playing Styles, each offering six phrases and four one-shot Additions. These patterns are designed to enhance compositions with everything from swelling crescendos to bold, rhythmic accents.

  The sound design section transforms the brass with over 250 Finisher presets, from subtle reverb and delay for cinematic warmth to experimental effects that turn traditional brass into entirely new textures.
specs: |-
  - Dedicated performance engine by UJAM
  - World-class recordings of French horns, trumpets and trombones
  - 78 styles with 468 pre-arranged phrases and one-shot additions
  - Separate Low Brass and High Brass sections with Crossfade, Character and Motion FX
  - Over 250 Finisher presets for sound design
  - Created at Hans Zimmer's Remote Control Studios
  - Operating systems: Windows 10 to Windows 11, macOS Catalina (10.15) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta only)
  - Minimum 8 GB of RAM
  - 6.31 GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery: automated installation via the UJAM App, or downloadable installer file
  - Authorization via the UJAM App, or email and password within the plug-in
  - All MIDI phrases and included sounds are royalty-free
