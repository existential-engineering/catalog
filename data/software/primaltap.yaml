description: Retro dual delay with freeze for lo-fi pitch warped loops and delays.
  Inspired by the sound of the Prime Time delay.
details: |-
  PrimalTap is a retro dual delay with a freeze function for lo-fi pitch warped loops and delays. Inspired by the sound of the Prime Time delay, it delivers vintage character with modern features.

  Dual independent delay taps provide flexible stereo delay effects. The Multiply control creates lo-fi pitch effects by changing delay time without time-stretching, creating pitch shifts reminiscent of tape delays.

  A VCO (voltage controlled oscillator) modulation section adds movement and texture to delays. The Freeze function samples and loops audio in real-time, creating evolving soundscapes. Maximum delay time extends to 2500ms with four feedback algorithm options and input drive saturation control.
specs: |-
  - Dual independent delay taps
  - Multiply control for lo-fi pitch effects
  - VCO modulation section
  - Freeze function for sampling and looping audio
  - DAW tempo sync capability
  - Maximum 2500ms delay time
  - Four feedback algorithm options
  - Input drive saturation control
  - 64-bit only, sample rates 44.1 kHz to 192 kHz
  - Apple Silicon compatible
