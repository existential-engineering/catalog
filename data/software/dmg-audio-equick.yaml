description: EQuick is a streamlined, ultramodern EQ built to help you make your mixes magnificent. Fast, intuitive and unbelievably flexible, it features 32 bands of parametric EQ with linear phase mode and per-band mid/side processing.
details: |-
  EQuick is a streamlined, ultramodern EQ built to help make mixes magnificent: fast, intuitive and unbelievably flexible, packed with digital functionality. Its beautiful, clear graph was built with accessibility and efficiency in mind, intended to refine workflow.

  EQuick offers 32 bands of EQ with a Q range of 0.1 to 50 and +/-36dB gain range. Each band can be set to Peak, HPF, LPF, High Shelf, Low Shelf or Notch, and each bank can process Mid, Side, or the full stereo image with per-band M/S listen. Filters are fully parametric (high and low-pass) at slopes of 6/12/18/24/30/36/42/48dB/oct, and a Linear phase mode is provided for mastering and special channels.

  The interface offers five different UI sizes, a big, clear, antialiased graph, a hi-res spectrum analyser with configurable readout, Range (to scale the EQ response) and Frequency Shift (to retune the response) controls, control linking to move sets of bands together, a configurable VU meter with variable ballistics, 8 banks of A/B, full preset management, undo/redo, and an autolisten mode for quickly finding and adjusting frequencies.

  According to DMGAudio, EQuick was designed as a follow-up to EQuality: after EQuality's success, the team explored making the EQ interface more intuitive and direct by stripping the interface down to its most essential element, the graph, while retaining controls like Range and Shift.
specs: |-
  - Unbelievably low CPU usage for high instance counts
  - Generates super-high-quality prototypes, clear undistorted top
  - Linear phase mode for mastering and special channels
  - 32 bands of EQ, Q 0.1 to 50, +/-36dB range
  - Each band can be Peak, HPF, LPF, High Shelf, Low Shelf or Notch
  - Each bank can process Mid, Side or the full stereo image
  - Fully parametric filters (high and low-pass), 6/12/18/24/30/36/42/48dB/oct
  - Five different UI sizes
  - M/S processing per-band with listen
  - Big, clear, antialiased graph
  - Hi-res spectrum analyser
  - Range control to scale the EQ response, both +ve and -ve
  - Frequency shift to retune the response
  - Control linking to move sets of bands together
  - Configurable VU meter with variable ballistics
  - 8 banks of A/B
  - Full preset management system
  - Undo/redo
  - Autolisten mode for quick finding/adjustment of frequencies
