description: EQuick is a streamlined, ultramodern EQ built to help you make your mixes magnificent. Fast, intuitive and unbelievably flexible, it features 32 bands of parametric EQ with linear phase mode and per-band mid/side processing.
details: |-
  EQuick is a streamlined, ultramodern EQ designed for fast and intuitive mixing. Features include: unbelievably low CPU usage for high instance counts; linear phase mode for mastering and special channels; 32 bands of EQ with Q range 0.1–50 and ±36dB gain range; each band can be Peak, HPF, LPF, High Shelf, Low Shelf, or Notch; per-band Mid/Side processing with listen; fully parametric filters (high and low-pass) at 6/12/18/24/30/36/42/48 dB/oct; five different UI sizes; hi-res spectrum analyser; frequency shift and range scaling; control linking to move sets of bands together; configurable VU with variable ballistics; 8 banks of A/B; full preset management; undo/redo; autolisten mode.
