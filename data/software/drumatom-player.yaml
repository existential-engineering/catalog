details: |-
  The drumatom2 application is the world's first microphone leakage suppression tool for multichannel drum recordings.

  Drumatom player imports .dls files that have been analyzed in the drumatom2 app so you can control the bleed of each track, as well as the overall bleed, while listening to the rest of your mix.

  The drumatom player plugin gives you the ability to dial in the amount of bleed to taste for each track while listening to the rest of your mix.

  Some projects may demand the preservation of a little bleed in order to maintain that raw drum vibe; being able to adjust bleed from within the context of such a mix is quite helpful.

  Drumatom player supports all major plugin formats (AAX, AU, VST).
