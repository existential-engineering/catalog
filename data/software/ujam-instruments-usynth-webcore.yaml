description: WEBCORE is a playful, glitchy Usynth for chaotic modern genres like Glitch Pop, Hyperpop, Digicore, and Botanica. Bells & plucks, arps & leads, pads & textures, basses, metallic & synthetic.
details: |-
  WEBCORE is a playful, glitchy Usynth for chaotic modern genres like Glitch Pop, Hyperpop, Digicore, and Botanica. Its sounds are proudly synthetic, metallic, clean, and digital rather than acoustic or retro. UJAM pairs it stylistically with Beatmaker CHROMED.

  High energy listening: dive into the colorful, GoreTex-clad hypebeast world of dopamine beats for the chronically online generation. Playful, glitchy, glassy, metallic clean, and digital.
specs: |-
  - Bells & plucks, arps & leads, pads & textures, basses, metallic & synthetic
  - 100 synthesizer patches, 100 global presets
  - Multi-synthesis engine, sequencer/arpeggiator, multi-FX
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8GB of RAM
  - 0.14GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Requires the latest version of the UJAM App, which installs the Usynth plug-in that hosts all titles
  - MIDI phrases and included sounds are royalty-free
