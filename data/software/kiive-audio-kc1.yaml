details: |-
  The KC1 Tube Comp brings to you one of the most coveted vocal compressors on the market. With its opto-style compression and streamlined UI, this compressor makes it foolproof to achieve professional results on pretty much any source! From enhancing the subtlest nuances in a vocal to slamming a drum kit, KC1 handles it all with flawless precision. "WOAH! Kiive's KC1 has been a godsend for that first stage of compression on lead vocals."

  -Joe Begalla (Joji, Burna Boy, Flume)

  Download it today and see for yourself why it's the go-to compressor for so many producers! Experience unparalleled warmth and silky-smooth compression with the all-new KC1 Tube Comp! Inspired by a legendary studio staple loved by producers worldwide, KC1 brings classic tube warmth and an insanely musical sounding compression that sounds great on just about every source. With its intuitive interface and meticulously modeled circuit, KC1 allows you to sculpt your mix with precision!
