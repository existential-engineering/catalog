description: A New Dimension In Composition — a plugin suite that equips composers with tools to control microtuning across their whole studio, enabling alternative tuning systems beyond standard 12-tone equal temperament.
details:
  - Until recently most music software only allowed working with the same 12 notes, equally divided over an octave. Whilst microtuning additions have broadened this considerably, it can still be cumbersome to get all plugins and external synths in tune — the MTS-ESP Suite solves this.
  - The MTS-ESP Suite equips composers with tools to get everything tuned quickly and accurately, as well as presenting entirely new compositional methods. Change notes or chords whilst they're being played, transpose all instruments at once or morph into an entirely different tuning system.
  - The suite provides the computer musician with an intuitive toolset for rapidly composing and finessing microtonal pieces. Existing MIDI compositions can be easily converted to a different tuning system and given an entirely different emotional context.
  - The product includes the MTS-ESP Master plugin for studio-wide tuning control and a MIDI Client plugin for retuning plugins and MIDI devices via MTS-ESP, MPE, MTS SysEx or MIDI pitch bend. A free, fully functional 30-day demo is available.
specs: |-
  - Import and export .scl, .kbm and .tun tuning and mapping files
  - Create new tuning systems, manually and algorithmically
  - Control the tuning of your whole studio from within a single plugin
  - Retune any plugin or MIDI device with either MTS-ESP, MPE, MTS SysEx or MIDI pitch bend
  - Automate tuning changes across all plugins and MIDI devices
  - Visualize and compare tuning systems
  - Convert compositions from one tuning system to another
  - Create subset scales by analysing MIDI to only include used notes
  - Use a Novation Launchpad as a microtonal keyboard and chord player
  - Create tunings by ear and tune instruments with the built in synth
  - Zero-latency, low CPU use
  - Simple, ergonomic resizable interface
  - Mac Retina and Windows HiDPI support
  - Free, completely functional 30-day demo
  - Windows: Vista / 7 / 8 / 10 / 11, 32-bit or 64-bit, VST / VST3 / AAX host required
  - Mac: macOS 10.9 or newer, 64-bit only, Intel or ARM, VST / VST3 / AU / AAX host required
