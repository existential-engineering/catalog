description: HoRNet Multicomp Plus MK2 is an audio compressor plugin with 5 different compression modes and visual feedback of the compression process.
details: |-
  HoRNet Multicomp Plus MK2 is the second version of HoRNet's high quality and versatile audio compressor. It features five audio compressor models (VCA, OPTO, FET, Console4K and VCA160) and an expander based on the VCA model.

  Multicomp Plus MK2 is aimed at every mixing need, providing five classic compression algorithms from the dry VCA to the very fat FET model, including two models (Console4K and VCA160) based on timeless VCA designs. The OPTO model has been re-designed to be more faithful to the classic optical compressors of the past.

  If you need analog warmth, Multicomp Plus MK2 provides a different emulation for every model and the intensity of the saturation can be adjusted. The analog emulation is the same as the one found in AnalogStage and includes an input transformer model too, and the hiss that comes with analog can be turned off. Gain staging is handled by the internal makeup gain algorithm and the auto input and output gain adjustment.

  Each compressor model supports external side-chain input, with both high-pass and low-pass filters ranging from 20 to 20,000Hz. The plugin offers standard attack, release, ratio and threshold controls along with a waveform display that shows both input and output signals, plus a visual gain reduction meter with a RealGR meter for real-time reduction monitoring and a peak hold function. High-quality processing is ensured with 2x or 4x oversampling and an auto option that optimizes oversampling for each model, while the dry/wet knob simplifies parallel compression and the auto threshold function automatically adjusts the threshold to achieve the desired gain reduction.
specs: |-
  - Five compression models (VCA, FET, OPTO, Console4K, VCA160) and one expander
  - Auto make up gain algorithm
  - Auto threshold to desired gain reduction
  - Analog emulation based on AnalogStage
  - Adjustable analog emulation level
  - Input transformer emulation option
  - Separate hiss control
  - Input, output and gain reduction waveform visualisation
  - RealGR meter showing real speed gain reduction with peak hold
  - External side-chain
  - High pass and low pass filters for the side-chain
  - Up to 4x oversampling with Auto option
  - Input and output gain control with automatic gain adjustment
  - Dry / Wet knob for parallel compression
  - Apple Silicon native support
  - macOS (10.13 and later) and Windows (Vista and later) support
  - 64-bit only both on Mac and Windows
  - Audio Units, VST3 and AAX format
  - No copy protection
