details: >-
  Additions is a small collection of 16 preset for diva and is meant to be an
  addition to the dimensions soundbank.


  The 16 presets, which range from strange atmospheres to smooth arpeggios, were
  made to the compliment dimensions presets nicely, but can of course also be
  used on their own.


  As usual, great attention has been paid to small details and most of the
  presets have many MIDI controls assigned, to make them as flexible as
  possible.
specs: |-
  - 16 presets for diva
  - MIDI controls assigned to presets
