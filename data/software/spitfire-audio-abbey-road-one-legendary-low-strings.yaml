details: |-
  Create impact and intrigue with epic low-string performances inspired by classic legend and fantasy films. This self-contained, stand-alone library will add that unmistakable Abbey Road magic to your compositions. It also makes the perfect accompaniment to Abbey Road One: Orchestral Foundations.

  Deep, powerful, and even threatening, Cello and Bass sections from London's leading players provide you with incredibly detailed and beautifully orchestrated performances. A range of versatile patches including marauding short notes, powerful longs, and Spitfire Audio's new easy-to-use legato patches, enhancing vitality and realism still further.

  Legendary Low Strings is available to purchase as a stand-alone library or as a brilliant addition to Abbey Road One: Orchestral Foundations .
specs: |-
  - Cello and double bass sections
  - 4 articulations: Epic Legato, Long, Staccato, Spiccato
  - 2 mixes
  - 10 mic signals: Vintage 1, Vintage 2, Pop Close, Pop Room, Close, Tree 1, Tree 2, Ambient, Outriggers, Spill
  - 7.51 GB disk space required during install
  - macOS 11 to OS 26, Intel and Apple Silicon supported
  - Windows 10 or 11 (64-bit)
  - Minimum 8GB RAM, 16GB recommended
  - Spitfire Audio App required for installation
