description: Triple Path Analog Chorus
details: |-
  Syntorus flawlessly emulates the bucket-brigade device (BBD) technology behind vintage solid-state electronic delays, delivering an evocative, characterful sound through painstakingly accurate modelling of a high-quality analog BBD delay line. Where most chorus plugins use just a single delay, Syntorus deploys three analog delay lines to conjure a richer, fuller, deeper chorus sound.

  Syntorus offers a choice of two BBD delay-line models: by default the chorus is exceptionally clean and pristine, while activating Analog BBD Emulation adds even more analog warmth and character. Three LFO generators serve as flexible modulation sources, routed to the delay lines in a number of switchable topologies, each offering 6 waveforms, timeline-locked tempo sync, independent phase-shift controls for left and right channels with a link option, and amplitude control with an invert option.

  Each delay line also has a multimode filter and a tremolo effect built in, governed by the same modulation sources as delay time, ideal for cooking up convincing Leslie-speaker sounds. Output strips represent the signal from all 3 delay lines with panning and volume parameters plus VU metering for level control.
specs: |-
  - Three analog BBD delay lines for chorus generation
  - Two BBD delay-line models: clean/pristine and Analog BBD Emulation
  - Three LFO modulation sources with 6 waveforms and tempo sync
  - Independent per-channel phase-shift controls with link option
  - Multimode filter and built-in tremolo per delay line
  - Per-line output strips with panning, volume and VU metering
