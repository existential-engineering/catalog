description: Instinct EQ is a four-band EQ plugin designed with broad, musical
  curves that encourage ear-based mixing decisions rather than visual analyzer
  reliance. It features an independent Surgery module for transparent resonance
  removal and optional analog-mode processing for warmth and cohesion.
details: |-
  Instinct EQ is a four-band EQ (High, Dual Mid, Low) built around the philosophy of using your ears rather than your eyes. It strips away visual frequency analyzers and visualizers, encouraging mixing decisions based purely on listening.

  The High and Low bands support both shelf and peak modes, while the dual Mid bands offer overlapping coverage with switchable wide and narrow curve options. All bands are designed to produce broad, musical boosts and cuts without phasey or harsh artifacts.

  An independent Surgery module provides four notch filters (two high-frequency, two low-frequency), each available in ultra-narrow and moderately narrow Q settings for transparent surgical resonance removal.

  Optional analog-mode processing adds subtle harmonic enhancement and transient smoothing, contributing warmth, cohesion, and perceived depth to processed audio.

  A/B switching allows quick before/after comparison. Compatible with Ableton Live 11+, Bitwig 4+, Cakewalk Next, Cubase 13+, Digital Performer 11+, FL Studio 23+, GarageBand 10+, Logic Pro 10+, Pro Tools 12+, Studio One 5+, and Reaper v6+.
specs: |-
  - Four-band EQ: High, Dual Mid, Low
  - High and Low bands: selectable shelf and peak modes
  - Dual Mid bands: overlapping coverage, switchable wide/narrow curves
  - Surgery module: 4 notch filters (2 HF, 2 LF) with ultra-narrow and moderately narrow Q
  - Analog-mode processing: harmonic enhancement and transient smoothing
  - A/B switching
  - 64-bit only
  - Formats: AAX, AU, VST3
  - Mac: macOS 10.15 or higher (64-bit)
  - Windows: Windows 10 (64-bit)
  - Minimum 200 MB free drive space
