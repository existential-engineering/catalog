description: 808XD is a free and simple virtual instrument (sample-based)
  featuring a variety of dirty, deep & hard-hitting bass presets. The plugin
details: |-
  The interface includes modulation & distortion modules, cabinet emulation,
  filter cutoff, voice selector & glide, as well as gain, pan, and
  attack/release envelope.

  808xd is primarily aimed at genres such as trap, hip hop, edm, hardstyle, pop
  etc, but it can be used in any track where dirty and aggressive basses fit
  well.

  808xd by audiolatry is a virtual instrument audio plugin for macos and
  windows. It functions as a VST plugin, an audio units plugin and a VST 3
  plugin.
specs: |-
  - Sample-based virtual instrument
  - 31 808 bass presets
  - Modulation & distortion modules
  - Cabinet emulation
  - Filter cutoff (lowpass/highpass)
  - Voice selector & glide
  - Gain & pan controls
  - Attack/release envelope
  - LFO modulation section
  - Distortion with drive, gain & mix
  - VST 64-bit plugin
  - VST3 64-bit plugin
  - Audio Units (AU) plugin
  - Windows 8.1 64-bit to Windows 11 64-bit compatible
  - macOS el capitan to monterey compatible
  - 2 GB RAM requirement
  - 106 MB hard disk space (Windows)
  - 109 MB hard disk space (macOS)
