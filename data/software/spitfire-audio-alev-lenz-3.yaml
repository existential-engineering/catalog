details: |-
  '3' is a collection of evolving drones, haunting vocals and textural beds made in collaboration with acclaimed composer Alev Lenz ( Black Mirror ). Discover 21 original patches bursting with invention, ideal for creating dark, cinematic trailer music and sound design, adding texture, suspense and beauty to your sonic landscapes.

  Presented in Spitfire's dedicated plug-in, '3' brings you Alev's most distinctive sounds — synthesised, unravelled, stretched and manipulated to spark your creativity. As a songwriter, Alev has forged a uniquely dark, otherworldly sound using her voice, piano and experimental electronics, leading to her work finding placement in hit dystopian dramas.
