description: A collaborative cabinet simulation tool created with Zilla Cabinets
  that provides studio-quality guitar cabinet sounds. The plugin allows users to
  mix, combine and blend tones, creating their own unique sonic palette without
  extensive file browsing.
details: |-
  Extracting the best sounds from Zilla's lineup of cabinets, using a carefully curated selection of microphones and speakers we distilled all these sounds into an intuitive design, allowing you to make immediate changes in colour with the freedom to mix, combine and blend tones, creating your own unique palette of sounds.

  The journey to find your sonic identity as a musician and producer is one full of technical and engineering challenges. These obstacles ultimately disrupt your creative headspace and workflow.

  In collaboration with Zilla cabs we created a tool aimed to solve one of these issues. Introducing GGD Studio Cabs: Zilla Edition.

  All IRs captured and engineered by Adam Getgood alongside the Zilla team at Middle Farm Studios, the home of both Invasion and Modern & Massive. This amazing live room isn't just great for drums, but just about any instrument you can throw at it.

  Stop scrolling endlessly through lists of files, and focus on your creativity. Let us handle the engineering.
