description: "A sample-accurate recreation of a legendary 1980s-90s digital
  reverb unit featuring dual independent algorithmic engines. Includes 5 reverb
  algorithms (Hall, Plate/Room, Chorus, Random Hall HD, Twin Delays, and
  Panorama), real-world early reflection engine with thousands of randomized
  reflections, advanced filter section, dual workflow modes, and 300+ presets
  including EDM and 80s Synthwave collections."
details: |-
  Dual-engine routing with 4 unique configurations
  5 reverb algorithms (Hall, Plate/Room, Chorus, Random Hall HD)
  Twin Delays and Panorama algorithms
  Real-world early reflection engine with 1000s of randomized reflections
  Advanced filter section with EQ, high-pass, and low-pass
  Shape and Spread parameters for envelope control
  32-bit float processing
  Dual workflow modes (Hardware Mode and Advanced Mode)
  300+ presets including EDM and 80s Synthwave
  Digital and analog output render modes

  PACE iLok account required (dongle optional)
