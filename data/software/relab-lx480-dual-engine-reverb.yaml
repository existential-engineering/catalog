description: The LX480 Dual-Engine Reverb is a sample-accurate dual-engine software recreation of a legendary 1980s-90s hardware reverb unit, featuring dual independent algorithmic engines with four unique routing configurations for creative flexibility.
details: |-
  The LX480 Dual-Engine Reverb is marketed as the only sample-accurate dual-engine recreation of a legendary 1980s-90s hardware reverb processor. It features five core reverb algorithms — Hall, Plate, Room, Chorus, and Twin Delays — along with a Panorama algorithm for stereo widening, all accessible across two simultaneously running independent engines.

  The dual-engine architecture supports four unique routing configurations, allowing users to layer, split, or otherwise combine the two reverb engines for complex spatial effects. Each engine can be set to a different algorithm, enabling hybrid combinations such as Hall into Plate or Room into Chorus.

  The plugin includes an advanced early reflection engine with randomized reflection clusters, Shape and Spread parameters for envelope control, and a filter section with EQ plus high- and low-pass filtering. Output render modes include a digital mode and a modeled analog mode to approximate the circuit character of the original hardware.

  Two workflow modes are offered: Hardware Mode, which mirrors the parameter layout of the original unit, and Advanced Mode, which exposes additional controls for deeper sound design. Over 100 hand-crafted presets are included, with optional bonus packs adding 200+ EDM and 80s Synthwave presets.

  The plugin uses iLok for license activation and supports 32-bit float processing. On Mac it runs natively on Apple Silicon (M1 and later) as well as Intel machines running macOS 10.12 and above. On Windows, version 10 or above is required.
specs: |-
  - Dual independent algorithmic reverb engines
  - 5 reverb algorithms: Hall, Plate, Room, Chorus, Twin Delays
  - Panorama algorithm for stereo widening
  - 4 dual-engine routing configurations
  - Advanced early reflection engine with randomized reflection clusters
  - Shape and Spread parameters for reverb envelope control
  - Filter section: EQ, high-pass and low-pass filters
  - Digital and modeled analog output render modes
  - Hardware Mode and Advanced Mode dual workflow
  - 100+ hand-crafted factory presets
  - 32-bit float processing
  - iLok license activation
  - Mac: macOS 10.12+, Apple Silicon (M1) native, VST/VST3/AU/AAX 64-bit
  - Windows: Windows 10+, VST/VST3/AAX 64-bit
  - Minimum 2 GB RAM
