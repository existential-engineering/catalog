description: The LX480 Dual-Engine Reverb Plug-in is the definitive re-creation of a legendary digital reverb from the mid-1980s and early 90s. It is the next evolution in the critically-acclaimed LX480 reverbs, used on countless hit records and films by top mixers.
details: |-
  The LX480 Dual-Engine Reverb Plug-in is the only sample accurate dual-engine re-creation of the original hardware, with two independent algorithmic engines for flexibility and creative control. It is described as the only re-creation that truly captures the width, depth, and complexity of the original.

  The LX480 puts 40 years worth of classic reverb algorithms in a single plug-in, and is the only recreation to include the Dual-Engine routing capabilities from the original, allowing two LX480 algorithms to run at once in 4 unique engine configurations.

  Beyond reverb, the Twin Delays algorithm provides classic doubling effects, ping-pong delays and complex echo patterns, while the Panorama algorithm widens the sound of any stereo source and adds width control for mono summing, phase inversion and channel swapping.

  A full chorus engine goes beyond the hardware for lush vintage reverb tails from the early days of digital, and Random Hall HD with 32-bit float mode takes advantage of the processing power of modern computers. Recreations of the Shape and Spread parameters control the attack and sustain of the reverb envelope, and a real-world early reflection engine randomizes clusters of thousands of reflections for fewer artifacts and less phase interference.

  The interface offers dual workflow modes: Hardware Mode mirrors the original hardware's remote control, while Advanced Mode adds an interactive screen, extra visual feedback and sound shaping functionality. Digital or modeled analog output render modes change the color and character of the sound, and an added filter section provides EQ plus high-pass and low-pass filters with a graphical display.
specs: |-
  - Sample accurate dual-engine re-creation of the original 1980s hardware digital reverb
  - Two independent algorithmic engines with 4 unique engine configurations
  - Five classic reverb algorithms plus Twin Delays and Panorama
  - Full chorus engine for vintage reverb tails
  - Random Hall HD algorithm with 32-bit float mode
  - Shape and Spread reverb envelope parameters recreated from the original
  - Real-world early reflection engine randomizing clusters of thousands of reflections
  - Digital or modeled analog output render modes
  - Filter section with EQ, high-pass and low-pass filters plus graphical display
  - Hardware Mode and Advanced Mode dual workflow interface
  - Hundreds of hand-crafted presets including original factory presets and signature presets
  - Over 200 additional premium presets for EDM and 80s Synthwave
  - iLok licensing
  - macOS 10.12 and above (Apple Silicon native), 64-bit only
  - Windows 10 and above, 64-bit only
  - Mac formats: VST, VST3, AU, AAX (64-bit); Windows formats: VST, VST3, AAX (64-bit)
