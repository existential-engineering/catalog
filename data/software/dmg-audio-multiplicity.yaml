description: "Multiplicity is a multiband dynamic processor offering
  compression, expansion, gating, and dynamic EQ across 8 bands with
  dual-stage dynamic handling that separates transients and dynamics for
  precise mastering control."
details: |-
  Multiplicity delivers multiband compression, expansion, gating, and dynamic EQ across 8 bands of crossover processing. Dual-stage dynamic handling separates transients and dynamics independently, with a dual-timing release mechanism to eliminate pumping. A bit-transparent linear phase crossover divides the spectrum, with ratios above and below threshold plus independent floor and ceiling controls per band. Full MS/LR linkage, per-band sidechain targeting, per-band adjustable lookahead, a 3-band sidechain EQ per band, and an external sidechain input offer comprehensive signal routing. ITU-1770-based autogain, configurable oversampling, a built-in spectrum analyzer, 8 A/B preset banks, full undo/redo, Mac Retina support, and a freely resizable UI round out the feature set.
