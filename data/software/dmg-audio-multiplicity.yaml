description: Multiplicity is a multiband dynamic processor offering compression, expansion, gating, and dynamic EQ across 8 bands with dual-stage dynamic handling that separates transients and dynamics for precise mastering control.
details: |-
  Multiband compression, expansion, gating, and dynamic EQ in a single processor for precision mastering. Dual-stage dynamic handling separates transients and dynamics, with dual-timing release designed to avoid pumping. Bit-transparent linear phase crossover and band-splitting, extensive per-band graphing and metering, MS/LR linkage and sidechain targeting, and a 3-band sidechain EQ per band.

  Sound-shaping controls include ratios above and below threshold with independent floor and ceiling, per-band dry gain for parallel processing, per-band dual-stage release with configurable RMS detection and crest factor, per-band adjustable lookahead and dynamics character, external sidechain input, configurable oversampling, and ITU-1770 based autogain.

  Visual feedback includes a spectrum analyser for crossover configuration, per-band dynamics and sidechain EQ graphs, per-band metering of sidechain PPM and GR, per-parameter linking/locking and MIDI Learn, instance and per-band presets, a freely resizable UI with Mac Retina support, full undo/redo, 8 A/B banks, and configurable zoomable PPM/GR meters.
specs: |-
  - 8 bands of crossover and dynamic EQ
  - Dual-stage dynamic handling separates transients and dynamics
  - Dual-timing release, no pumping
  - Bit-transparent linear phase crossover and band-splitting
  - Ratios above and below threshold with independent floor and ceiling
  - Full MS/LR linkage and targeting for sidechain and processing
  - Per-band dry gain for parallel processing
  - Per-band dual-stage release with configurable RMS detection and crest factor
  - Per-band adjustable lookahead and dynamics character
  - External sidechain input
  - Configurable oversampling for realtime and render
  - 3-band sidechain EQ per band
  - ITU-1770 based autogain
  - Instance and per-band presets
  - Freely-resizable UI
  - Mac Retina support
  - 8 A/B banks
