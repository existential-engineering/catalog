description: IHNY-2 is a comprehensive update to the original cult favorite
  compressor by Baby Audio, I Heart NY. It expands on the original with improved
  sound, features and workflow for a flexible and hard-hitting parallel
  compression tool.
details: |-
  IHNY-2 is a modern mix plugin dedicated to perfecting the parallel compression technique with a faster workflow and a more forceful sound. Use it to add weight and punch to drums, vocals and even full masters.

  The plugin includes a tweak panel for surgical flexibility, featuring controls for Attack, Release, Ratio, Punch, Harmonics (dynamic saturation based on gain reduction), Shape (custom smiley EQ curve), Tilt, and Lo/Hi Preserve filters.

  IHNY-2 comes loaded with 156 presets created by Baby Audio and friends, organized into themed folders named after New York City boroughs: Brooklyn, Staten Island, Manhattan, Bronx, and Queens.
specs: |-
  - Internal signal flow optimized for fast parallel compression
  - Tweak panel with Attack, Release, Ratio, Punch, Harmonics, Shape, Tilt controls
  - Lo/Hi Preserve filters
  - Autogain algorithm with AGR display
  - Oversampling: 1x, 2x, 4x modes
  - Solo wet signal monitoring
  - 156 presets organized by NYC boroughs
  - Native Apple Silicon M-Chip support
  - 64-bit only
