description: MasterRestoration 6 combines in one plug-in the features of MR
  Noise 6, MR Click 5, MR Hum 6, and MR Gate 6. It is an all-in-one cleanup
  plug-in covering broadband noise reduction, hum and buzz removal, de-click and
  de-crackle, and gating.
details: |-
  All-in-one cleanup plug-in. MasterRestoration 6 combines in one plug-in the features of MR Noise 6, MR Click 5, MR Hum 6, and MR Gate 6.

  MasterRestoration 6 is not available separately. It is included with the Master Restoration Suite 6 bundle.
specs: |-
  - Frequency spectrum based noise reduction
  - Low latency suitable for live monitoring
  - Hum removal using from 1 to 10 harmonic notch filters
  - Buzz removal
  - De-click and de-crackle algorithms
  - Gate with threshold, ratio, attack and release times
  - Monitor to hear removed noises
  - Latency compensation via compatible hosts
  - Up to 192 kHz sampling rate
  - Mono or stereo
  - Requires a host program that supports audio plug-ins
  - iLok licensing is supported but not required
  - Macintosh formats: AU, VST3, AAX
  - MacOS 10.13 (High Sierra) and higher
  - Apple Silicon natively supported (AU, VST3, AAX)
  - AAX on macOS requires Pro Tools 11 and higher
  - 64-bit hosts only on macOS
  - Windows formats: VST3, AAX
  - Windows 7/8/10/11
  - AAX on Windows requires Pro Tools 10.3.5 and higher
  - 32-bit and 64-bit hosts supported on Windows
