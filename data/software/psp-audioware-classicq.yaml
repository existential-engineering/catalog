description: PSP ClassicQ is an equalizer plugin inspired by classic British-style EQs, emulating the sound of early Neve designs. It features class A circuitry simulation and output transformer simulation for vintage analogue character.
details: |-
  PSP ClassicQ is an equalizer plugin inspired by classic British-style EQs, emulating the sound of early Neve designs. Features class A circuitry simulation and output transformer simulation for vintage analogue character.

  Designed for individual track processing, it is light on CPU while delivering warm, musical equalization with high and low filters, a precise mid-range bell-type filter, adjustable high-pass filter, and switchable Q for low and high-shelf filters.

  A PSP ClassicQex (extended version) is also available with an additional Low Mid section.
specs: |-
  - High and low filters with musical character
  - Precise mid-range bell-type filter
  - Adjustable high-pass filter
  - Switchable Q for low and high-shelf filters
  - Selectable class A circuitry simulation
  - Output transformer simulation
  - Low CPU usage
  - Formats: AU, VST2, AAX, RTAS
  - Platforms: Windows XP SP2/Vista/7 (x32/x64), macOS Intel 10.5+
