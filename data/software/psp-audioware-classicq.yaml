description: PSP ClassicQ is inspired by various classic British-style equalizers. It captures the sound and flavor of famously musical high and low filters (such as those in early Neve EQs), melded to very precise mid-range filter.
details: |-
  PSP ClassicQ is inspired by various classic British-style equalizers. It captures the sound and flavor of famously musical high and low filters (such as those in early Neve EQs), melded to very precise mid-range filter. In addition, PSP ClassicQ offers a selectable simulation of class A circuitry and output transformer for a unique, vintage-style color.

  On top of these classic features, PSP ClassicQ adds extremely useful features such as an adjustable high pass filter, switchable Q for low and high-shelf filters, as well as a sweepable mid-range bell-type filter. The design of PSP ClassicQ lends it especially well to fixing and shaping individual tracks.

  Also included is PSP ClassicQex, which is extended version of the PSP ClassicQ plug-in. All features of the previous version are available, but ClassicQex brings an additional Low Mid section for more precise tonal adjustments.
specs: |-
  - Adjustable high pass filter
  - Switchable Q for low and high-shelf filters
  - Sweepable mid-range bell-type filter
  - Selectable simulation of class A circuitry
  - Selectable output transformer simulation
  - Includes PSP ClassicQex with an additional Low Mid section
  - Windows: VST requires Windows x32 or x64 (XP Service Pack 2, Vista or 7) and a VST 2.4 compatible application
  - Windows: RTAS requires ProTools LE 8.0.0 or ProTools TDM 8.0.0 (or later)
  - Windows: AAX requires Pro Tools 10 or Pro Tools 11 (or later)
  - Mac (Intel): AudioUnit requires Mac OSX 10.5 or later and a 32 or 64-bit host capable of running AudioUnit plug-ins with Cocoa view
  - Mac (Intel): VST requires Mac OSX 10.5 or later and a 32 or 64-bit VST 2.4 compatible host application
  - Mac (Intel): RTAS requires Mac OSX 10.5 or later with ProTools LE 8.0.0 or ProTools TDM 8.0.0 (or later)
  - Mac (Intel): AAX requires Mac OSX 10.8 or later and Pro Tools 11 or later
