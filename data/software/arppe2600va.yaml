details: >-
  Based on arp's legendary semi-modular analog monosynth, arp2600va aims to
  emulate the original arp2600. Like the original, it's a monosynth, but also
  like the original, it has many frequency modulation options which enable it to
  create some truly weird sound effects.


  Pwm, sample & hold, virtual spring reverb, ring modulation, and a dedicated
  noise generator are all there.


  With 3 osc you can have great basses. The matrix is not as easy as cables,
  sometimes it's a bit tricky to know how it works.
specs: |-
  - Monosynth
  - Semi-modular
  - Frequency modulation
  - Pwm
  - Sample & hold
  - Virtual spring reverb
  - Ring modulation
  - Noise generator
  - 3 oscillators
  - VST plugin
  - Windows
