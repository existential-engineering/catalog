details: |-
  Serato Visualizer creates audio-reactive videos for music marketing, optimized for Instagram, YouTube, Spotify, and Facebook.

  Access millions of videos and photos from Pexels, upload custom logos and artwork, and export clips in portrait, landscape, and square formats with no watermarks.

  Visualizer runs in a desktop browser at visualizer.serato.com; mobile and tablet browsers are not supported. The tool is currently free during public beta.
specs: |-
  - Audio-reactive visuals for music videos
  - Access to millions of videos and photos from Pexels
  - Custom logo and artwork upload
  - Export in portrait, landscape, and square formats
  - No watermarks
  - Optimized for Instagram, YouTube, Spotify, and Facebook
