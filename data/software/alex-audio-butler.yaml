details: |-
  Alex Audio Butler automatically gets your audio up to par. Leaving more time to focus on the story to tell.

  The audio editing and mixing tools in adobe premiere pro and other video editors are very complex, making it difficult to create an adequate mix if you're not an expert. But if speed and efficiency are keys let us help you get to a four-star mix with close to zero work.

  Automatic volume. All voice clips will be set to a correct volume. Automatic ducking. Music volume goes down during voice parts. Compression & mastering. It creates a fitting loudness for your production.

  For many video projects, the goals are clear: consistent, clean, intelligible vocals (voice-over or recorded on site). Music filling silent parts, ducking away during a speech. Total loudness fitting for the target medium.

  Let the computer handle the tedious work
