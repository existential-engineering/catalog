description: Software emulation of the classic Oberheim SEM monophonic
  synthesizer, developed in collaboration with Tom Oberheim. Features two VCOs
  with Pulse and Sawtooth waveforms, two ADS Envelope Generators, one LFO, and a
  legendary Multi-Mode Filter. Enhanced with a third VCO, tempo-syncable LFOs,
  arpeggiator, sequencer, and effects.
details: |-
  When Tom Oberheim created the first Oberheim Synthesizer Expander Module (model SEM-1) in 1974, he had one goal, to make a synth that sounded great, whilst being extremely simple to use. In the decades since the release of this iconic synth, it's been used by countless legendary musicians, making the SEM one of the most revered synthesizers of all time.

  We first worked with Tom Oberheim and Marcus Ryle (an inspirational Oberheim engineer during the 80s) when creating the GForce Oberheim OB-E v2. During this time, Tom and Marcus revealed that they felt there were no software emulations of the SEM that accurately recreated the sound and the ethos of the original monophonic SEM. We decided to change that, and under the close guidance of Tom and Marcus, we've developed the GForce Oberheim SEM to ensure an experience that is truly authentic to the original instrument.

  Centered around two VCOs with Pulse and Sawtooth waveforms, two ADS Envelope Generators, one LFO, and a magical, legendary Multi-Mode Filter, the SEM sound is more than the sum of its parts. In the GForce Oberheim SEM, every section of the synth has been painstakingly emulated to ensure sonic authenticity. We've even modelled the authentic analog inaccuracies of the original SEM, blurring the lines between analog character and digital precision.

  While staying true to the original SEM, we also added a number of enhancements to make the GForce Oberheim SEM even more useful for modern music production. Alongside a new VCO3, which doubles as an LFO with audio rate for additional modulation and FM possibilities, the SEM now has tempo-syncable LFOs with multiple wave shapes, and a host of performance controls via velocity and aftertouch. We've also integrated a fun, fast arpeggiator and sequencer, and added a stereo delay and a beautifully lush reverb to sonically complement your sounds.

  Finally, we've included 400+ factory patches designed by top sound designers, each created to demonstrate the incredible sonic character of the SEM. Every patch has been categorised and is quickly accessible from the patch browser. The SEM even integrates with the GForce Oberheim OB-E, allowing users to load their SEM presets in either device.
specs: |-
  - Dual VCOs with authentic SEM voice architecture
  - 400+ categorized factory patches
  - Extended mode with augmented rear panel controls
  - Arpeggiator and step sequencer
  - Built-in stereo delay and reverb effects
  - Velocity and aftertouch modulation
  - SEM preset compatibility with Oberheim OB-E
  - Mac: Intel or Apple Silicon, macOS 10.13 or later
  - Windows: 2 GHz CPU, 2 GB RAM, Windows 7 or later
