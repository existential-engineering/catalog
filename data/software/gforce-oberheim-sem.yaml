description: Software emulation of the classic Oberheim SEM monophonic synthesizer, developed in collaboration with Tom Oberheim. Features two VCOs with Pulse and Sawtooth waveforms, two ADS Envelope Generators, one LFO, and a legendary Multi-Mode Filter. Enhanced with a third VCO, tempo-syncable LFOs, arpeggiator, sequencer, and effects.
details: |-
  GForce Oberheim SEM recreates the authentic monophonic sound of the original 1974 Oberheim SEM-1 hardware, developed in close collaboration with Tom Oberheim and Marcus Ryle. The plugin captures the character of dual VCOs and the iconic multimode filter, with modern enhancements including an arpeggiator, step sequencer, and built-in stereo delay and reverb effects.

  Over 400 categorized factory patches are included, and the plugin offers an extended mode with augmented rear panel controls for deeper sound shaping. Velocity and aftertouch modulation are supported, and presets are compatible with the Oberheim OB-E.
specs: |-
  - Dual VCOs with authentic SEM voice architecture
  - 400+ categorized factory patches
  - Extended mode with augmented rear panel controls
  - Arpeggiator and step sequencer
  - Built-in stereo delay and reverb effects
  - Velocity and aftertouch modulation
  - SEM preset compatibility with Oberheim OB-E
  - Mac: Intel or Apple Silicon, macOS 10.13 or later
  - Windows: 2 GHz CPU, 2 GB RAM, Windows 7 or later
