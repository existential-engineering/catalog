details: |-
  In partnership with bbc studios and the world-famous bbc symphony orchestra,
  Spitfire Audio has finally been able to capture what no other sample library
  has before: the musical synergy of a family of astoundingly accomplished
  players with a 90-year heritage of performances and recordings, deep sampled
  at London's famous maida vale studios home of the bbcso, and host to the
  beatles, hendrix and bowie.

  This landmark library is the stuff of composing dreams: strings, brass,
  woodwind and percussion, all housed inside our award-winning plugin. Including
  three editions (discover, core and professional) interchangeable through our
  groundbreaking mode-switching technology, bbcso professional is our definitive
  orchestral library.

  Professional is the definitive, comprehensive collection for writing
  professional, world-class orchestral music, featuring 67 different instrument
  presets recorded on world-class millennia preamps, including groups and
  soloists, and 468 techniques, including 45 legatos, for each melodic
  instrument as well as a staggering 20 signals.

  In the latest update to bbc symphony orchestra professional spitfire has added
  an extra set of stunning performances from the brilliant brass section, as
  well as updating a selection of legatos with abilities including fast runs and
  shorts: ~36gb of new content. New muted brass techniques. New cimbasso.
  Extended legato update. Various bug fixes.
specs: |-
