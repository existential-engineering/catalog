description: "Memorymode 2 is a virtual instrument inspired by one of the most
  iconic polyphonic programmable analog synthesizers of the 1980s: the legendary
  Memorymoog. Cherry Audio has completely transformed its highly acclaimed 2021
  flagship synthesizer by employing cutting-edge analysis and emulation
  techniques, resulting in unmatched accuracy and precision."
details: |-
  The 1982 Memorymoog set a new standard for sound quality with its rich analog tones. It featured six-voice polyphony and is often described as “six Minimoogs in one,” with a total of 18 voltage-controlled oscillators (VCOs) and the 24 dB/octave Moog ladder filter. Cherry Audio's Memorymode, modeled after a vintage Memorymoog once owned by jazz legend Chick Corea, enhanced the original design without compromising its sound and functionality, while also eliminating the reliability, maintenance, and tuning issues often associated with the hardware.

  Memorymode 2 features significantly improved analog modeling, bringing greater depth and detail to the oscillators and filters, as well as more accurate envelopes. It introduces a newly CPU-optimized dual-layer architecture that contains two complete 16-voice polyphonic synthesizer layers or splits within a single preset. The ladder filter with both the original 24dB (4-pole) and the added 12dB (2-pole) per octave options has been perfected and enhanced with a “modern” setting for richer lows and more sparkling highs, and an emphasis compensation option to keep the volume steady.

  The unison stacking option allows for 48 massive voices per layer. Memorymode also features an analog drift control, and the new multi-voice mode introduces subtle or extreme variations for each note across pitch, panning, filtering, and envelope parameters. The scope for organic expression has been significantly enhanced, now including velocity, channel and polyphonic aftertouch, MPE (MIDI Polyphonic Expression), and four lanes of touch-oriented modulation with over 50 possible routing options.

  Each 16-voice layer features a powerful three-oscillator voice engine, advanced modulation capabilities, chord mode, and a motion panel with an arpeggiator and a 16x4 programmable polyphonic step sequencer, both syncable and transposable. It also includes the innovative Touch Animator for expressive automation modulation tied to the four touch controls. Memorymode's effects have been significantly upgraded with three independent effect chains, offering a wide array of 22 studio-quality effects, including new additions like the Wide Phaser and Rotary Speaker. Producers can start creating immediately with over 800 exceptional presets in the newly redesigned preset browser, including exact replications of the original Memorymoog factory patches, imported directly from a cassette tape for unparalleled accuracy compared to the hardware.
specs: |-
  - The ultimate Memorymoog emulation, reengineered by Cherry Audio with its latest comprehensive circuit and behavior modeling techniques to provide unparalleled accuracy to, and exclusive compatibility with, the original hardware
  - Highly optimized, massive dual-layer voicing architecture with 16 polyphonic voices per layer. Keyboard split and stacked layer modes allow two simultaneously playable layers, with separate per-layer controls for all parameters, including synthesis, modulation, patterns, and effects
  - Newly remodeled three-oscillator voice architecture with ramp, triangle, and variable-width pulse waves, with noise and oscillator sync
  - Precisely recreated ladder filter with selectable 12- and 24-dB/octave slopes
  - Modern button for beefy lows and crystalline highs
  - New optional Emphasis Compensation switch to maintain sound level and low-frequency weight as emphasis is increased
  - Two full ADSR envelopes per layer with velocity, independently assignable to filter, amp, and modulation for expressive control and dynamic sound shaping
  - Two tempo-syncable LFOs for each layer with seven waveforms, with reset option
  - Two voice modulation panels per layer using oscillator 3 and filter envelope as modulation sources, with up to six simultaneous destinations
  - Analog drift control for increased analog realism
  - Mono and Unison modes with note priority, Polyphonic modes with voice cycling, and single-key Chord Memory assign mode
  - Enhanced performance capabilities through polyphonic aftertouch and MIDI Polyphonic Expression (MPE)
  - Multi-voice mode with presets and adjustable trimmers to provide subtle or extreme voice variation in pitch, panning, filter, and envelopes to tones and patterns
  - “Digital display” interface with before/after parameter values, and display of extended settings such as number of voices, trigger and note priority, unison voices, multi-voice modes, condition, and drift
  - Over 800 presets, including the Memorymode version 1 presets and precise recreations of the 100 original Memorymoog factory patches, all accessible in the newly redesigned preset browser
  - Comprehensive Touch modulation matrix with four slots and simple click-to-assign functionality with 52 destinations, with optional MPE assignment for Velocity, X, Y, and Z expression
  - Syncable and transposable arpeggiator for each layer with Arp, Leap, Order, and Random modes, and Swing, Chance, and Feel to add degrees of randomness to arpeggiated patterns
  - Syncable and transposable 16x4 polyphonic step sequencer for each layer with Start, Stop, Auto Start, and humanize options, with accurate DAW clock and step synchronization
  - Touch Animator, an additional per-layer sequencer that acts as a 16-step x 4-pattern modulation source, varying the amount of modulation applied by the four Touch modulation slots
  - Three independent customizable chains of effects, one for each layer plus a global layer, with an individual effects modulator for each layer
  - 22 studio-quality effects that can be arranged, saved, and recalled within their effects chains: BBD Flanger, Compressor, DCO Chorus, Digital Delay, Digital Reverb, Distortion & EQ, Dual Delay, Dual Ensemble, Dual Phaser, Envelope Filter, Flanger & Chorus, Galactic Reverb, Lo-Fi, Lushverb, Panner, Pulser, Ring Modulator, Seven Band EQ, Spring Reverb, and Tape Echo. New in Memorymode 2 are Wide Phaser (the updated Phaser effect from the original Memorymode) and Rotary Speaker
  - Effects control tray for on/off, solo, bipolar modulator amount slider, and dry/wet mix for each effect. Global FX on/off, level, and stereo expand
  - Utility panels to easily copy, paste, swap, and move layers, effects chains, and sequencer data between presets
  - Tape Data Import: Import 100-program Memorymoog cassette tape data backups made with the original Chroma (uncompressed .wav files, mono/stereo, any sample rate or bit depth)
  - Directly import original Memorymoog patch bank SysEx data (Lintronics Advanced Memorymoog format) via drag-and-drop
  - Standalone virtual instrument and plug-in versions included
  - User-adjustable oversampling control
  - Complete MIDI control and DAW automation for all controls, with easy-to-use MIDI learn and mapping (Preset and Global)
  - Cherry Audio's popular Focus zoom-in feature, as well as standard UI zoom and resize via drag
  - Complete documentation available directly online from the instrument or in downloadable PDF format
  - macOS Requirements: 10.13 or above. macOS 13 Ventura supported. 64-bit required. Native Apple M1 or greater processor support, including Ultra. 3.4 GHz Quad-Core or M1 CPU with 8GB of RAM is recommended. Hard disk space: 186 MB
  - Windows Requirements: Windows 7 or above (including Windows 11), 64-bit required. Quad-core computer with 8GB of RAM is recommended. Hard disk space: 166 MB
  - An internet connection is required for product activation
