details: |-
  The Audeze Reveal+ plugin functions as a personalized virtual studio for producers and engineers. It integrates AI-powered spatial audio technology allowing users to create custom HRTFs by submitting ear photographs via QR code within 30 seconds. The plugin features proprietary EQ profiles for current and future Audeze headphone models, with selectable minimum and linear phase filters for audio processing.

  The plugin includes access to multiple world-class studio environments crafted by Grammy-winning engineers including Carlos de la Garza, Bob Horn, Erik Reichers, and Warren Huart. Users can customize spatial listening through adjustable ambience controls, virtual speaker positioning, and L/R balance management to recreate authentic mixing environments on headphones.

  Reveal+ integrates with major digital audio workstations including ProTools, Logic, Ableton Live, Digital Performer, and REAPER, as well as audio playback software like JRiver, Audirvana Plus, Pure Music, and VOX. The plugin received optimization for Apple M1 processors in version 2.1.0, delivering reduced CPU usage and native performance.

  The software offers a free 14-day trial period with limited Aural Map features, while the full version provides lifetime access to personalized spatial audio profiles, studio virtualization, and continuous Aural Map updates for two years.
