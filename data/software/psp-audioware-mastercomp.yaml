description: A high-fidelity mastering compressor utilizing 64-bit double-precision floating point processing with double-sampled FAT technology. Maintains unrivaled transparency even at extreme compression settings. Includes PSP MicroComp for bus and track processing during mixing. Features a Smooth Level Detector algorithm, automatic attack/release options, over-threshold compression and expansion, advanced sidechain filtering and channel linking, Mid/Side/Stereo/Left/Right processing modes, a brick wall output limiter, and PPM/VU metering.
details: |-
  Requires free iLok user ID and iLok License Manager (no hardware dongle required). Supports macOS 10.14-15 Sequoia (Intel and Apple Silicon) and Windows 7-11. Includes both PSP MasterComp (mastering) and PSP MicroComp (bus/track) versions.
specs: |-
  - 64-bit double-precision floating point processing
  - Double-sampled FAT technology
  - Smooth Level Detector algorithm
  - Automatic attack and release modes
  - Over-threshold compression and expansion
  - Advanced sidechain filtering and channel linking
  - Mid/Side, Stereo, Left, Right processing modes
  - High-quality brick wall output limiter
  - PPM/VU metering with adjustable parameters
  - Wet/dry mix control
  - macOS: AU, VST, VST3, AAX (Intel and Apple Silicon)
  - Windows: VST, VST3, AAX (64-bit)
