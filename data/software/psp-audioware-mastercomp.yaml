details: |-
  Double-precision 64-bit floating point processing. Optional Smooth Level Detector algorithm. Intelligent automatic attack/release times. Over-threshold compression and expansion. Advanced side-chain filtering and channel linking. High-quality brick wall output limiter. Selectable channel processing (Mid, Side, Left, Right, Stereo). Mix control for wet/dry blending. Includes PSP MicroComp variant.
