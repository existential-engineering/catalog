description: A high-fidelity mastering compressor utilizing 64-bit double-precision floating point processing with double-sampled FAT technology. Maintains unrivaled transparency even at extreme compression settings. Includes PSP MicroComp for bus and track processing during mixing. Features a Smooth Level Detector algorithm, automatic attack/release options, over-threshold compression and expansion, advanced sidechain filtering and channel linking, Mid/Side/Stereo/Left/Right processing modes, a brick wall output limiter, and PPM/VU metering.
details: |-
  PSP MasterComp is a high fidelity stereo dynamics processor. Its double-precision 64-bit floating point and double-sampled FAT (Frequency Authentication Technique) processing offers unrivaled transparency even at extreme compression settings and high sample rates.

  The PSP MasterComp installer includes two versions of the plug-in: PSP MasterComp, designed for mastering compression and expansion, and PSP MicroComp, designed for using on buses and track processing during mixing.

  Applications: controlling or revitalizing signal dynamics during mixing or mastering, creating the final sound of the mix, providing classic analog-like smooth compression, and revitalization of transients.

  PSP MicroComp offers a simple and effective control layout, a CPU efficient algorithm optimized for mixing purposes, low distortion thanks to the optional Smooth Level Detector algorithm, optional automatic release time, a wide range of controls dedicated for mixing purposes, over threshold compression and expansion, side chain filtering and channel linking controls, and advanced PPM/VU meters with contextual readings and adjustable operation parameters.

  Running PSP MasterComp in 30-day trial mode or activating it requires a free iLok user ID and the free iLok License Manager application. No hardware dongle is needed. The license activates in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above).
specs: |-
  - Total high frequency transparency thanks to double sampled processing (excluding output limiter)
  - Low distortion due to the optional Smooth Level Detector algorithm
  - Optional intelligent automatic attack and release times
  - Wide range of controls designed for mastering purposes
  - Over threshold compression and expansion
  - Advanced side chain filtering, channel linking, and compression tilting controls
  - Mix control to allow fine blending between the processed and clean signal
  - Optional high quality brick wall output limiter with automatic release time
  - Advanced PPM/VU meters with contextual readings and adjustable parameters
  - Selectable channel processing: Mid, Side, Left, Right or Stereo
  - Double-precision 64-bit floating point and double-sampled FAT (Frequency Authentication Technique) processing
  - Includes PSP MicroComp, a CPU efficient variant optimized for buses and track processing during mixing
  - Requires a free iLok user account and the iLok License Manager application, no hardware dongle necessary
  - License activatable in 3 separate locations (computer or iLok dongle, 2nd generation or above)
  - Windows 7 to Windows 11, 64-bit hosts
  - macOS 10.14 to macOS 15 Sequoia, Intel and Apple Silicon
