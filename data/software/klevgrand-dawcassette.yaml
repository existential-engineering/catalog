description: Bring your sound back to the golden age of cassette tapes (minus
  the tangle). DAW Cassette takes you back to the magic of the 1980s by
  emulating the iconic sound of a tape deck.
details: |-
  DAW Cassette is a tape deck emulation that takes you back to the magic of the 1980s by emulating the iconic sound of a cassette deck. Saturation, distortion, noise and wobble are all part of the model.

  The level of 'cassetteness' is dialled in with controls for input and output gain, tape, motor and head quality, plus tape type and noise type. Three tape types are offered (Normal, Chrome and Metal), and the noise level can be set with noise reduction emulation including a noise-free option.

  The Quality section sets the desired quality of the Tape (magnetic band saturation), Head (frequency response) and Motor (speed consistency). The Emul80ies section selects the cassette tape type and the noise reduction emulation, and a third section trims the sound with Input, Output and Mix.

  The reverse panel adds channel crosstalk (bleed) amount, fine noise level adjustment, a tape head tilt angle for phase effects, and a four-band peak EQ. Bleed, head tilt, noise gain and type, and the four-band peak EQ were introduced in v1.1.

  Klevgrand also publishes Web Cassette, a free online version of DAW Cassette.
specs: |-
  - Three different tape types (Normal, Chrome, Metal)
  - Noise level control with noise reduction emulation, including a noise-free option
  - Tape, head and motor quality knobs
  - Input gain, output gain and dry/wet mix parameters
  - Bleed amount (crosstalk between channels)
  - Tape head tilt angle
  - Noise gain and type
  - Four-band peak EQ
  - User preset support (preset system with user presets since v1.1.4)
  - Window zoom functionality (v1.2.3)
  - Requires macOS 10.10 or later (optimized for the M1 processor) or Windows 7 (SP1) or later, running an AU, VST or AAX compatible 64-bit host
  - macOS binaries support ARM (M1) CPU natively
  - 64-bit only
