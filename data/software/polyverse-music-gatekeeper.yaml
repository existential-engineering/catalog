description: A sample-accurate volume modulation tool equipped with a variable smoothing algorithm. Features 8 independent volume envelopes with expressive drawing tools, enabling drastic punchy gating and sequencing while keeping output smooth. Developed in collaboration with Infected Mushroom.
details: |-
  Gatekeeper is a volume modulation plug-in built around sample-fast transitions and a variable smoothing algorithm, so drastic, punchy gating and sequencing can happen while the output stays smooth. The page frames it as working with silence as a production element rather than as a conventional noise gate.

  It can act as a simple ADSR or a complex envelope, and also as an LFO, a gate, a step sequencer, a sample-accurate volume automator, or a CV modulator. Eight MIDI-programmable envelopes, hundreds of presets, and CV/MIDI output for external hardware cover production, mixing, and sound design tasks.

  The drawing tools use curve brushes and a shortcut system, with 31 kinds of envelope brush and 4 copy slots for intricate designs. Up to 1024 nodes are available per envelope, which the page states can create a sequence up to 20 hours long.

  Beyond volume, Gatekeeper can control other devices. It sends MIDI CC to control plug-ins and digital hardware, and it sends CV to control analog and modular synthesizers.

  The plug-in was developed in collaboration with the electronic music duo Infected Mushroom, through Polyverse Music's Artistic Feedback process, and carries techniques the duo has used for many years.
specs: |-
  - Sample-fast and precise volume modulation
  - 8 independent volume envelopes
  - MIDI-programmable envelopes
  - Envelope drawing tools with curve brushes and a shortcut system
  - 31 kinds of envelope brush and 4 copy slots
  - Up to 1024 nodes per envelope, for sequences up to 20 hours long
  - Boost and clip features
  - Smoothing algorithm to eliminate clicks and pops
  - Fully customizable MIDI triggering
  - Panning tools
  - Tempo mapped looping
  - CV output for modular synths
  - MIDI CC output for controlling other instruments and effects
  - Hundreds of presets
  - Supports VST2, VST3, AU, and AAX plug-in formats
  - Windows 64-bit and macOS 10.9+ 64-bit
