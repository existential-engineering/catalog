description: "The ultimate gating effect -- a sample-accurate volume modulation
  tool equipped with a unique smoothing algorithm. Features 8 independent volume
  envelopes with expressive drawing tools, enabling drastic punchy gating and
  sequencing while keeping output smooth. Developed in collaboration with
  Infected Mushroom."
details: |-
  Sample-fast and precise volume modulation
  8 independent volume envelopes
  Expressive envelope drawing tools with 31 brush types
  Boost and clip features
  Smoothing algorithm to eliminate clicks/pops
  Fully customizable MIDI triggering
  Panning tools
  Tempo-mapped looping
  CV output for modular synths
  MIDI CC output
  1024 nodes support for sequences up to 20 hours
  Hundreds of presets
