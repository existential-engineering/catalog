description: The ultimate gating effect -- a sample-accurate volume modulation tool equipped with a unique smoothing algorithm. Features 8 independent volume envelopes with expressive drawing tools, enabling drastic punchy gating and sequencing while keeping output smooth. Developed in collaboration with Infected Mushroom.
details: |-
  Sample-fast and precise volume modulation
  8 independent, MIDI-programmable volume envelopes
  Expressive envelope drawing tools with 31 brush types
  Boost and clip features for added punch
  Click/pop elimination via unique smoothing algorithm
  Fully customizable MIDI triggering
  Panning tools
  Tempo-mapped looping
  CV output for modular synthesizers
  MIDI CC output for external hardware/plugin control
  100+ presets included
  Up to 1024 nodes per sequence (supports up to 20-hour patterns)
