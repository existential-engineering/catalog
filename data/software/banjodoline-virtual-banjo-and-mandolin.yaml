details: |-
  Banjodoline is a virtual banjo and mandolin which also includes a mandocello,
  mandola, octave mandolin, banjolin and electric mandolin fretted stringed
  instruments emulation.

  Quick loader to select between different instruments: mandolin, mandolin
  tremolo, archtop mandolin, mandocello, mandola, octave mandolin, electric
  mandolin, banjolin, tenor banjo, plectrum banjo, banjolele banjo uke, 5-string
  banjo.

  These universal 2 binary (arm64) plugins run natively on both apple silicon
  (m1, m2, m3) and intel-based mac computers.

  Windows 11, windows 10, windows 8.1, windows 8, windows 7 (32 or 64-bit)
  supported; DAW host application with vst2 support (32 or 64-bit) and/or vst3
  support (64-bit) required.

  Macos sonoma 14, macos ventura 13, macos monterey 12, big sur 11, catalina
  10.15, mojave 10.14, high sierra 10.13, sierra 10.12 supported; DAW host
  application with audio unit, VST or vst3 support compatible with logic pro,
  garageband, cubase, ableton live, reaper, studio one professional, ardour,
  mainstage and digital performer.
specs: |-
  - ADSR envelope generator
  - Low frequency oscillator with modulation depth and rate
  - Filter section
  - Reverb control
  - Amplitude range control
  - Pitch bend control
  - Universal 2 binary (arm64)
  - MIDI keyboard controller support
  - Asio compatible sound card recommended
