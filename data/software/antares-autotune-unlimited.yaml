details: |-
  AutoTune Unlimited delivers the complete set of tools you need to make any
  vocal performance a perfect performance. Used on countless recordings,
  autotune is recognized as the leading tool for tuning vocals.

  The classic "autotune effect" is often copied but never equalled, it's the
  sound of modern music. Beyond just tuning, it's a comprehensive collection of
  plug-ins for creating radio-ready vocal tracks.

  Autotune unlimited includes autotune pro (the most advanced and fully-featured
  version for professional pitch correction), autotune hybrid (designed for
  lightning-fast performance on avid dsp hardware, including carbon interfaces,
  hdx systems, and venue | s6l live sound systems), and autotune artist
  (optimized for low-latency processing for live performances).

  Autotune vocodist combines the legendary sound of vintage vocoders with the
  full force and flexibility of autotune built in. Autotune slice is a hybrid
  sampler and synthesizer powered by autotune that lets you play vocals like an
  instrument and make samples sing.

  Autotune efx+ combines the essential features of autotune with a powerful
  effects rack and melodic pattern generator for more creative workflows.
  Autotune access delivers the most streamlined experience for tuning vocals
  with a light cpu footprint and simplified interface. Auto-key automatically
  detects the key and scale of your song and works with autotune and harmony
  engine for a faster, more efficient workflow.
specs: |-
  - Pitch correction
  - Autotune effect
  - Vocal production tools
  - Compatible with every major DAW
  - Free upgrades to new versions
  - Automatic licenses for new Antares plug-ins
  - Low-latency processing
  - Pattern generator
  - Sampler and synthesizer
  - Vocoder
  - Effects rack
  - Key and scale detection
