description: Vintage EPROM-based drum machine emulator faithfully recreating the internal circuitry, DAC, and analog filtering of a legendary early-1980s drum computer with built-in WAV resampler and EPROM burner.
details: |-
  VProm 3.0 is a drum machine plugin that emulates the internal circuitry and
  filtering of a legendary early-1980s drum machine. It faithfully recreates
  EPROM-based vintage drum sounds with authentic sample-rate emulation at
  approximately 27kHz and analog filtering characteristics using real-time DAC
  and EPROM sound processing.

  The plugin includes a built-in WAV resampler and EPROM burner for custom
  sample conversion, with real-time muLaw DAC curve control for transient
  shaping. It features 14 drum voices including a new Ext2 voice, with expanded
  voice card features including CEM filters and VCA envelope control.

  A 48 PPQN internal clock with adjustable clock drift (1-40ms) provides
  authentic timing feel. The enhanced mixer offers multi-output routing options
  including Single Mix, Multi Post-Mixer, and Multi Pre-Mixer modes. Enhanced
  oversampling at X16 ALL mode ensures clean signal quality.

  VProm 3.0 introduces the .VPromKit format for saving custom drum kit
  configurations and includes an advanced EPROM management panel with waveform
  visualization. Maximum EPROM size is 64K (approximately 2.5 seconds at 27kHz)
  with muLaw 8-bit compression providing 12-bit quality.
specs: |-
  - Formerly named VLinn (renamed to VProm at the request of the Linn Electronics trademark holder)
  - Compatibility: Windows 10+ (64-bit VST3 host); macOS 10.14+ (64-bit VST3 or Audio-Unit host), Universal 2 binary for native Intel and Apple Silicon. No AAX; can be hosted in Pro Tools via a VST/AU wrapper such as DDMF Metaplugin or Blue Cat's PatchWork. VST2 and 32-bit support removed as of v3.0.
  - Maximum EPROM size: 64K (~2.5 seconds at 27kHz)
  - Resampling rate: ~27 kHz emulated R2R ADC
  - Compression: µLaw 8-bit (12-bit quality)
  - Internal clock: 48 PPQN with adjustable clock drift (1-40ms)
  - 14 drum voices
  - Skins: LM1, DMX, Linndrum
  - Backward compatible with VPROM v2.0 presets
