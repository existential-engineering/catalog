details: |-
  Atonoise is a vsti synthesizer (with pro and VST effect versions too) for
  spooky, sci-fi and other similar sounds. It has not got a filter, by design,
  and you'll hardly ever hear the basic waveforms of the two oscillators, which
  just provide different flavours to the modifiers.

  It works atonally, I.e. With no real defined pitch, therefore it is suitable
  for various kinds of spacey and noisy sounds, which are created by four
  modifiers.

  Inferno adds, via inferno mix, some upper harmonics generated from the input -
  very similar to the timbre feature of hgf's swamp vsti.

  Spook 1 and spook 2 modifiers can be used as single, in parallel 1|2 or in
  series 1-2. The spook amount is determined by the two spook knobs while the
  xy-pad add more or less density, I.e. A fairly metallic sound in lower left
  corner or less density at upper right corner.

  This can be modulated by selectable, invertible and even intermitting lfos.
  Spook 3 adds some kind of reverbish flavour when the slider is moved to the
  right.
specs: |-
  - Vsti synthesizer
  - Two oscillators
  - Four modifiers
  - Inferno modifier
  - Spook 1 modifier
  - Spook 2 modifier
  - Spook 3 modifier
  - Xy-pad
  - LFO modulation
  - Invertible LFO
  - Intermitting LFO
  - No filter by design
  - Atonal synthesis
  - Pro version
  - VST effect version
