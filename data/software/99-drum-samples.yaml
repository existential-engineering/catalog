details: |-
  99 drum samples is a free collection of electronic and acoustic drum hits which were built from various analogue and digital sound sources and processed with internal and external audio gear.

  The library includes 99 individual drum hits in 24-bit wav format, featuring the sounds of an acoustic drum kit, the korg electribe er-1 mkii drum machine, lell uds analogue drum module, among other sound sources.

  Some of the included samples were re-sampled from a cassette deck and an old tape delay unit.

  Contents: 99 drum samples. 24-bit wav format. 44.1 khz stereo. 7.53 mb size on disk. 6.86 mb download size (zip archive).
