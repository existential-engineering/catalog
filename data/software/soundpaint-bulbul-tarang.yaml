details: |-
  Bright. Button Controlled Strings

  The Bulbul Tarang (aka The Indian Banjo) is a 15-string instrument commonly found in India and Pakistan. The instrument employs three sets of strings, a double set of melodic strings and two sets of drone strings, that also function as part resonators. The Bulbul Tarang is usually played with a guitar-like strum. The melodic strings contain a bass and treble string. We deep-sampled both strings individually, with multiple velocity layers on each string and round robins on the sustains. With The Bulbul Tarang, you have full control over each string. The drone strings are divided into a group of 10 and a group of 3. We deep sampled these at multiple velocity layers and 10 round robins per layer. In Soundpaint this deep-sampling is taken to another level with 127 discreet velocity layers. The Bulbul Tarang also contains a variety of other deep-sampled articulations, including drone strings in both minor and major scales, muted notes on melodic strings, tremolo, trills, and a wide assortment of effects. Additionally, we added a large phrase collection to the library focused on strums. The strums come both as multi-samples and phrase-samples, so you can create the ideal soundscape for your needs.
