description: An emulation of the rare 1950s RCA Model BA-2C all-tube booster amplifier, originally used as a microphone preamplifier and transcription turntable booster amp. Faithfully recreates the two triode-strapped 6J7 pentodes and original transformer configuration, delivering a rich THD spectrum. Lower gain settings produce a well-defined balanced sound with mid-range accent; higher gain adds warmth, weight, and smoothness. Includes selectable pre/de-emphasis filter, Mix control, and Boost mode.
details: |-
  Emulates the RCA Model BA-2C (1950s all-tube transformer-based booster amp). Circuit modeling: two triode-strapped 6J7 pentodes, input/output transformers. Controls added beyond original: level-compensated gain (0–20), 3-position Tone switch (Low/Flat/Hi), Boost mode (increases drive and coloration), Mix (dry/wet blend), Trim (output level), Power bypass. Universal 2 Binary (Apple Silicon native). 15-day free trial available.
specs: |-
  Controls: Gain (0–20, level-compensated), Boost switch, Tone (Low/Flat/Hi), Mix, Trim, Power. macOS 10.9+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+, 2 GHz Intel CPU+, 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX. Copy protection: serial number.
