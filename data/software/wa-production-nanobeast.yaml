description: A granular effect that slices incoming audio into tempo-synced grains and reassembles them, with a sidechain input for morphing between two different sources. Grain FX, filters, reverb, tape modulation and bit crushing shape the result.
details: |-
  NanoBeast is a granular processor for reconstructing any audio source. It can turn vocals into sustained textures, break drums into irregular rhythms and reshape synths, and its sidechain input allows morphing between two entirely different sound sources for transitions.

  Audio is sliced into small grains and reassembled with tempo-synced accuracy, from 1/64 note slices through to smooth evolving textures. Grain fade time is adjustable for sharp transients or diffuse clouds, and a real-time grain morphing display shows what the engine is doing.

  The Morph control offers three playback options. Sidechain progressively swaps random grains between two routed audio sources, Input duplicates the source audio so that the FX processing dominates, and Mute produces stuttered, gate-like effects that break apart over time.

  A dedicated Grain FX rack refines grain behaviour. Drops creates random dropouts for unpredictable rhythmic patterns, Spread throws individual grains across the stereo field, and Shift and Scatter apply random pitch variation and timing offsets.

  Two further layers of processing polish the result. The A and B FX options provide high-pass and low-pass filters, Space adds reverb, Flow adds vintage style tape modulation, and Crush provides bit reduction and rate reduction for a lo-fi character. A large factory preset library covers everything from soundscape creation to extreme transformation.
specs: |-
  - Granular morphing and manipulation
  - Real-time slicing visualisation
  - Morph between Input or Sidechain sources, or Mute
  - Syncable grain size down to 1/64 with smooth grain fade
  - High-pass and low-pass filters
  - A and B FX: Crush (bit crush), Space (reverb), Flow (tape modulation)
  - Grain FX: Drops, stereo Spread, pitch Shift, Scatter
  - Resizable interface
  - Responsive and CPU friendly
  - Full PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Intel and Apple Silicon CPUs, with native AAX format
