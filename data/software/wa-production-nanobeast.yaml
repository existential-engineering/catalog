description: "Advanced granular processing plugin that atomizes audio into
  microscopic grains, rebuilds sounds with precision, and morphs between two
  audio sources for creative transitions."
details: |-
  Real-time grain visualization and morphing display. Three morph modes: Sidechain, Input, Mute. Tempo-synced grain sizes from 1/64th note to smooth textures. Grain FX rack: Drops, Stereo Spread, Pitch Shift, Scatter. A and B effects: High/Low-pass filters, Crush, Space, Flow. Resizable CPU-efficient interface. Factory presets.
specs: |-
  Windows 10/11 (64-bit). macOS 10.15+ (64-bit). Intel and Apple Silicon.
