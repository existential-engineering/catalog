details: |-
  FEATURED IN:
  Tominator is a filter-based plugin solution for killing bleed on your drums. Built on advanced, adjustable filter automation - users are able to treat bleed in a more natural approach than gating. A process that used to be tedious and complicated is now simplified and streamlined, meaning you can spend less time cleaning up tracks, and more time mixing.
  Find out how Tominator can improve your drums today!
  Features:
  Eliminates cymbal bleed with an internal moving filter
  Internal / controllable filter for effectively removing cymbal bleed
  Speed control for changing how fast filter works on your signal
  Cutoff parameter sets where the filter will stop after the transient
  Enables you to have more versatility when processing your drums
  Includes
  Audio Plugin (single user license)
  Manual
specs: |-
  Requirements
  A computer with Intel, or M-Series compatible processor, Windows or Mac operating system, and a compatible DAW installed (check which plugin formats your DAW supports). This plugin does NOT operate as a standalone!
  Compatibility
  Windows 8.1+ (64-bit): VST3, AAX
  macOS 10.14+ (Intel or M-Series, 64-bit): VST3, AU, AAX
