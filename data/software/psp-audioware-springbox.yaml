description: PSP SpringBox is an emulation of a hardware spring reverberator. It recreates several features typical of a spring reverb such as the characteristic “boing” on transients, and a repeatable resonating musical character with an adjustable presence.
details: |-
  PSP SpringBox is an emulation of a hardware spring reverberator. It recreates several features typical of a spring reverb such as the characteristic “boing” on transients, and a repeatable resonating musical character with an adjustable presence.

  A selection of configurations from two to six springs is provided, as well as the ability to set stereo spread and pan/balance configured to suit various mix setups - from a typical guitar reverb to creative uses as a send reverb in the mix. Thanks to PSP SpringBox’s two channel A and B settings and range of presets, operation is fast and easy.

  In order to run PSP SpringBox in 30-day trial mode or activate it, you don't need any hardware dongle but you need an iLok user ID which you can create for free at www.ilok.com, and you need to install the free iLok License Manager application.

  You can activate the license in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above). You can move these licenses at any time using PACE's iLok License Manager software.
specs: |-
  - Emulation of a hardware spring reverberator
  - Recreates the characteristic “boing” on transients
  - Repeatable resonating musical character with an adjustable presence
  - Selection of configurations from two to six springs
  - Adjustable stereo spread and pan/balance
  - Two channel A and B settings
  - Range of presets
  - Windows 7 – Windows 11, 64-bit VST, VST3 and AAX (Pro Tools)
  - macOS 10.14 – macOS 15 Sequoia (Intel and Silicon), 64-bit AudioUnit, VST, VST3 and AAX (Pro Tools)
  - iLok authorization: iLok user ID and iLok License Manager required, no hardware dongle needed, up to 3 activations
