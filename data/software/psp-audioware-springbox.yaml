description: PSP SpringBox is an emulation of a hardware spring reverberator, recreating the characteristic 'boing' on transients and a repeatable resonating musical character with adjustable presence. Offers configurations from two to six springs, stereo spread and pan/balance controls suited for guitar amp-style or studio send reverb use, and dual channel A/B preset settings.
details: |-
  Emulates vintage hardware spring reverberators with characteristic spring transient 'boing' and resonating musical qualities. Configurable from 2 to 6 springs. Dual channel A/B settings with a range of presets. Licensed via iLok (no hardware dongle required) — activatable in 3 separate locations.
specs: |-
  - Platforms: Windows 7-11 (64-bit), macOS 10.14-15 Sequoia (Intel and Apple Silicon)
  - Formats: AU (macOS only), VST, VST3, AAX
  - Spring configurations: 2 to 6 springs selectable
  - Dual channel A/B preset system
  - Stereo spread and pan/balance controls
  - Adjustable presence control
  - Licensing: iLok (no dongle required), 3 activations allowed
