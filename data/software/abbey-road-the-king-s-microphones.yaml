details: |-
  In early 2011 the king's speech captured the imaginations of movie-goers the
  world over. Now abbey road studios and Waves audio have captured the sounds of
  the majestic microphones used in the film. Used exclusively by the royal
  family for speeches on momentous occasions, each of these three priceless
  microphones dating back to the 1920s and 1930s was tailored and tuned
  especially for its specific user: king george v, king george vi, and queen
  elizabeth.

  Beautifully designed and decorated with gold, silver, and chrome adornments
  bearing the royal coats of arms, each is a one-of-a-kind aesthetic masterpiece
  with its own distinctive sonic character.

  The king's microphones plugin offers accurate recreations of the originals'
  unique frequency responses, with three proximity settings for each.

  Discovered deep within the vaults of emi outside london by peter cobbin,
  senior recording engineer at abbey road studios, the microphones were used to
  record music and dialogue for the film, the first time they had been used by
  anyone outside the royal family.
specs: |-
  - Microphone modeler
  - Universal 2 binary
  - Three proximity settings for each microphone
  - Accurate frequency response recreations
