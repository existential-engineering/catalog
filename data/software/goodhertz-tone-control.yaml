description: Tone Control is an equalizer plugin inspired by Peter J. Baxandall's 1950s tone circuit design, refined for modern music production. It offers Baxandall low/high shelves with slope control, variable slope cut filters, and a Master Air filter for broad-stroke tone shaping.
details: |-
  Tone Control is Goodhertz's take on timeless EQ design, brought forward from Peter J. Baxandall's influential 1950s tone circuit. Rather than surgical precision, it is designed for broad-stroke tone shaping that feels musical and natural across a wide range of sources.

  The plugin features Baxandall-style low and high shelf filters with adjustable slope control, allowing the character of the EQ curve to be sculpted beyond just gain and frequency. Variable slope low-cut and high-cut filters add further flexibility for managing the extremes of the spectrum.

  A 'Master Air' filter provides refined control over the uppermost treble frequencies, while the 'Master Mix' control allows overall tone-shaping balance to be dialed in globally.

  Tone Control supports mono, mono-to-stereo, and stereo channel configurations. An HQ Mode is available that prioritizes audio quality at the cost of approximately 50 ms of additional latency, suitable for mixing and mastering contexts where real-time monitoring is not required.
specs: |-
  - Baxandall low/high shelf filters with slope control
  - Variable slope low-cut and high-cut filters
  - Master Air filter for high treble refinement
  - Master Mix control for overall tone shaping
  - Mono, mono-to-stereo, and stereo channel support
  - HQ Mode with ~50ms additional latency
  - macOS 10.13+ (AU, VST, VST3, AAX 64-bit)
  - Windows 10+ (VST, VST3, AAX 64-bit)
