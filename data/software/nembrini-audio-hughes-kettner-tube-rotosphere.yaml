details: |-
  The Hughes & Kettner Tube Rotosphere plugin modeled by Nembrini Audio with its advanced modeling technology captures the lush swirl, warm tube saturation, and authentic rotary motion of the original hardware. A friend of mine uses the “Roto” extensively so I know the sounds it imparts very well. Nembrini audio, just like, with the PSA1k and all the other amazing plugins they offer have nailed it. The character, the way it responds, it’s so close, it boggles the mind. Highly recommended!! I have a number of Rotary Speaker plug ins - they are great for many purposes - The H K Rotary Pedal has a personality all its own so I am glad to have added to my palette of tools
specs: |-
  WATCH VIDEO Plugin Formats A VST2, VST3, AAX or AudioUnits compatible host | An Intel compatible or Apple Silicon CPU 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
