description: A faithful software emulation of the original Hughes & Kettner Tube Rotosphere hardware rotary speaker effect, delivering classic rotary sounds with rich tube warmth and easy rotor speed control.
details:
  - The Hughes & Kettner Tube Rotosphere plugin is a meticulous emulation of the legendary Hughes & Kettner hardware rotary speaker unit, faithfully recreating its distinctive sound through advanced tube saturation modeling. The plugin captures the authentic rotary motion and harmonic richness that made the original hardware a staple among guitarists and keyboardists.
  - The plugin features independent Low Frequency and High Frequency rotor speed controls, allowing precise adjustment of the rotary effect for both bass and treble speakers. Rotor speeds can be set in Hz for precision or synchronized to the DAW tempo for rhythmic applications, offering maximum creative flexibility.
  - A dedicated Breaker function halts rotor motion while preserving the tube coloration, enabling players to freeze the rotary effect at any position while retaining the characteristic warmth of the tube circuitry. Separate guitar and keyboard input modes optimize the plugin's response for different source materials.
  - Full stereo processing capabilities ensure the wide, immersive spatial effect of a real rotary speaker cabinet is accurately reproduced. The intuitive interface provides real-time visual feedback of rotor movement, making it easy to dial in the perfect rotary sound.
