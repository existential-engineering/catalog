details: |-
  A modern string orchestra imitating classic synth sounds, from the mind of Grammy-nominated composer, electronic music pioneer & technologist Brian Transeau, AKA BT, Polaris is a mesmerising aural innovation which tastefully pairs the worlds of synthesis and orchestra, an encyclopaedia of new and inspiring sounds with almost endless possibilities, perfect for taking your scores into 2022 and beyond.

  Massive multi-layers of complex yet accessible organic string orchestral recordings, resampled using an array of classic and rare synthesisers (Fairlight, EMU E-II and more), a cosmic collection of new string techniques has been specifically orchestrated to emulate electronic music production techniques. This sophisticated and eclectic sound library, performed by London's top tier contemporary players at renowned AIR Lyndhurst Hall, captures the future of blockbuster scoring.
specs: |-
  - Download size: 44.7 GB
  - 44.70 GB disk space required during install
  - 421 presets
  - 129 articulations: 94 including the original string performances, plus 35 layered Synergy patches for the eDNA engine
  - 54 noise sources
  - String band of 6,6,5,4,3 recorded at AIR Studios Lyndhurst Hall
  - 8 mic signals plus Tight and Hall mixes
  - macOS 11 to OS 26, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
  - Minimum 2.8 GHz quad-core i5 and 8 GB RAM
  - Recommended 2.8 GHz six-core i7 and 16 GB RAM
  - 32-bit systems are not supported
