details: |-
  Alionoctis combines many of the benefits from h. G. Fortune's protoplasm, sts and atonoise plug-ins with the ease of use many still love from the sts-21. Sound-wise it goes beyond all the aforementioned plug-ins with vivid atmos, complex textures and pads but also some rhythmic sounds, all of which can be enriched by the "out-of-this-world" flavour of the "inferno", "spooks" and "bass enhancer" features.

  The third oscillator has a wave-sequencer in which, when used correctly, could bring a lot of interest to a song not dominated by bass. The inclusion of both low-pass and high-pass filters with their own envelope generators is a real treat, along with a lfo modulating each envelope.

  The super modulation joystick is perhaps this synth's best-known feature to those who haven't heard how it sounds like. For the lazy composers out there, it would be enough to use two slow lfos to move the joystick around. However, automating it is recommended, especially while a bunch of notes are held.

  Alionoctis pro comes with three banks, plus a so-called "init" bank, each with 128 presets. The included presets are good for the most part, but too many of them fill in almost all the locations of the super modulation joystick.

  This synth is primarily for evolving textures with the 3 soundfont oscillators; there's no virtual analog imitation here. That said, the sound, even without any audio effects, is quite splendid.
specs: |-
  - Three digital pcm-wave oscillators with 128 selectable waveforms

  - 3rd oscillator with 8 slot wave-morphing

  - Oscillator mix via x/y pad and various modulations

  - Two resonant filters (24db lowpass and 12db highpass)

  - Three adsr-style envelope generators

  - Inferno feature for adding generated upper harmonics

  - Spook 1 & 2 effects with x/y pad and various modulations

  - Super modulation x/y control pad to modulate up to 10 destinations simultaneously

  - Lfo section with 7 lfos plus one sample & hold with bpm synced tempo and key sync

  - Bass enhancer

  - 8 dedicated lazy buttons

  - VST plugin

  - Windows compatible

  - Soundfont oscillators

  - Wave-sequencer on third oscillator

  - Low-pass and high-pass filters with own envelope generators
