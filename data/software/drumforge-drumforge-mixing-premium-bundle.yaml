  compression, EQ, drum processing, clipping, and harmonic excitation for
  professional-quality drum productions."
details: |-
  The Drumforge Mixing Premium Bundle contains five purpose-built audio plugins for drum production.

  DF-COMP 2 is a comprehensive drum compressor with 10 dedicated compression modes (Kick, Snare, Toms, Overheads, Rooms, Drum Bus, Vocals, Guitar, Bass, Master Bus) and 3 compression styles (Soft, Medium, Hard) for precise dynamic control.

  DF-Q2 is a specialized EQ designed for drum mixing, bridging technical precision and musical creativity with classic EQ curves and a dynamic EQ section.

  Drumflex is a versatile drum processing plugin with analog-emulated EQ and compression, Tilt EQ, output clipping, and parallel processing — purpose-built for finalizing drum mixes across any genre.

  DF-CLIP 2 is a multi-band clipper that adds clarity and punch to drums through peak clipping and targeted frequency shaping.

  DF-XCITE 2 is a multiband harmonic exciter with six saturation models, four-band frequency targeting, and instrument-specific presets for breathable warmth and presence.

  All plugins include a perpetual license, free lifetime updates, and unlimited customer support.
specs: |-
  - Includes: DF-COMP 2, DF-Q2, Drumflex, DF-CLIP 2, DF-XCITE 2
  - Windows 8.1+ (64-bit): VST3, AAX
  - macOS 11+ (64-bit, Intel and Apple Silicon): VST3, AU, AAX
  - Pro Tools 11+ required for AAX
  - Cubase 6.5+ required for VST3
  - Perpetual license
