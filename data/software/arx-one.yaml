details: |-
  Arx One is a tool to help correct phase and stereo compatibility issues. It
  splits signal to four frequency bands that can be adjusted individually. You
  can adjust panning for each split and choose source channel to use for output.
  Thanks to this individual band panning arx can also create stereo from mono
  source.

  Mono compatibility is important not only for situations when your music is
  played on mono systems but also for stereo speakers. With speakers there is
  always some audio summing and you're basically hearing it in collapsed mono.
  Any element in your mix that has left and right channels significantly out of
  phase will be played at a significantly lower volume level or in worst
  scenario when the channels are completely out of phase, that element may
  completely vanish when summed in mono.

  Arx is meant to tame the sound and normalize stereo width. If you are making
  music just for headphones (binaural) listening then arx may not be suitable.
  If you want to have a mono compatible mix then arx could be the tool for you.

  Version 1.1 improvements include: fixed phase trace causing high cpu usage
  when enabled, added option for phase trace to change frames per seconds, and
  bypass processing has better visual feedback.

  The phase trace display takes 20480 samples of audio in order to show a nice
  preview of phase in time. The phase trace preview can be disabled or paused by
  clicking on it to decrease cpu usage.
specs: |-
  - 4 adjustable frequency bands
  - Left, right or stereo input for each band
  - Solo preview for each band
  - Rotate audio
  - Dual master pan with individual left and right channel panning
  - Low frequency mono preservation
  - Bypass processing
  - Phase trace preview
  - Windows compatibility
