details: |-
  BG Extasy Boutique Guitar Amplifier is meticulously modelled on the Bogner Ecstasy* 101B head guitar amplifier. Nembrini Audio has carefully reproduced the incredible tone and versatility of this famous boutique guitar amplifier, being one of the most desirable guitar amps on the market today. We have also extended the possibilities of the original hardware thanks to the versatility of the digital world with new features for the maximum control of your tone: WATCH VIDEO CABINETS With BG Extasy Modern Tube Guitar Amplifier is possible to choose between six different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs.
