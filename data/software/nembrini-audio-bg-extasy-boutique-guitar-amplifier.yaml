description: BG Extasy Boutique Guitar Amplifier is meticulously modelled on the Bogner Ecstasy 101B head guitar amplifier. Nembrini Audio has carefully reproduced the incredible tone and versatility of this famous boutique guitar amplifier, with extended possibilities through digital versatility and new features for maximum tone control.
details:
  - BG Extasy Boutique Guitar Amplifier is meticulously modelled on the Bogner Ecstasy 101B head guitar amplifier. Nembrini Audio has carefully reproduced the incredible tone and versatility of this famous boutique guitar amplifier, being one of the most desirable guitar amps on the market today, with extended possibilities through digital versatility and new features for maximum tone control.
  - The plugin features a 3-channel all-tube design. Channel 1 provides independent gain, bass, middle, treble, and volume controls along with a 3-position pre-EQ and gain boost. Channels 2 and 3 share common bass, middle, and treble controls as well as a common gain-structure switch, gain boost, and plexi mode switch, each with individual gain and volume controls. Dual assignable presence controls with excursion switches deliver a loose or tight feel.
  - A complete recording chain is included with six selected guitar cabinet emulations and four of the best microphone emulations featuring on/off axis position switching, continuous position, and distance knobs. The powerful three-slot Impulse Loader lets you load up to three third-party impulse responses with blending capabilities including volume, pan, phase, solo, and mute controls, plus a browser window for navigating IR files.
  - Additional processing includes an optimized Noise Gate and a Cleaner circuit to reduce rumbling and harshness and improve your tone. A complete mixer section with Solos, Mutes, Pans, and Faders rounds out the signal chain for a full recording-ready output.
specs: |-
  - 3 channel all tube design
  - Ch 1: gain, bass, middle, treble and volume control
  - Ch 1: 3 position pre eq and gain boost
  - Ch 2: gain, volume and 3 position pre eq
  - Ch 3: gain, volume and 3 position pre eq
  - Ch 2/3: common bass, middle and treble controls
  - Ch 2/3: common gain-structure, gain boost and plexi mode switch
  - Dual assignable presence controls with excursion switches for loose and tight feel
  - Six selected guitar cabinet emulations
  - Four microphone emulations with on/off axis position switch, continuous position and distance controls
  - Three-slot Impulse Loader supporting third-party IRs with volume, pan, phase, solo and mute per slot
  - Optimized Noise Gate and Cleaner circuit
  - Mixer section with Solos, Mutes, Pans and Faders
  - macOS 10.13 or newer (64-bit DAW required)
  - Windows 7 or newer (64-bit DAW required)
  - 1 GB RAM minimum
  - Version 1.0.7
