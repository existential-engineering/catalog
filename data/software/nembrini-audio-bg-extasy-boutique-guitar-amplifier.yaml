  meticulously modelled on the Bogner Ecstasy 101B head guitar amplifier.
details: |-
  BG Extasy Boutique Guitar Amplifier is meticulously modelled on the Bogner Ecstasy 101B head guitar amplifier.

  Nembrini Audio has carefully reproduced the incredible tone and versatility of this famous boutique guitar amplifier, being one of the most desirable guitar amps on the market today. Nembrini Audio has also extended the possibilities of the original hardware thanks to the versatility of the digital world with new features for the maximum control of your tone.

  BG Extasy Modern Tube Guitar Amplifier lets you choose between six different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs. A complete Mixer section with Solos, Mutes, Pans and Faders allows you to blend together the two microphones with the ambience.

  Impulse Loader lets you load up to three third-party impulse responses that you can even blend together using volume, pan, phase, solo and mute controls. A useful browser window has been added so you can easily search through all your third-party IR files.

  Noise Gate section plus a Cleaner circuit to reduce rumbling and harshness is included.
specs: |-
  - 3 channel all tube design
  - Ch 1: gain, bass, middle, treble and volume control, 3 position pre eq and gain boost
  - Ch 2: gain, volume and 3 position pre eq
  - Ch 3: gain, volume and 3 position pre eq
  - Ch 2/3: common bass, middle and treble controls
  - Ch 2/3: common gain-structure, gain boost and plexi mode switch
  - Dual assignable presence controls with excursion switches for loose and tight feel
  - Complete recording chain with six selected guitar cab emulations
  - Four mic emulations with position and distance controls
  - Cleaner circuit to improve your tone
  - Optimized Noise Gate
  - Powerful three-slot Impulse Loader with browser window for third-party IR files
  - Mixer section with Solos, Mutes, Pans and Faders
  - Plugin Formats: a VST2, VST3, AAX or AudioUnits compatible host
  - System: an Intel compatible or Apple Silicon CPU, 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
