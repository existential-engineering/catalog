details: |-
  AudioRealism bass line pro (abl pro) is a virtual instrument and virtual
  effect audio plugin for macOS and Windows that functions as a VST plugin and
  an Audio Units plugin, designed as a synth (analogue / subtractive).

  The synth features two oscillators with all analog waveshapes and an lfo which
  can go audio-rate and be patched in as a 3rd oscillator, feeding a lowpass
  filter with multiple filter types including a legacy 18db/oct slope filter.
  The main filter design is more in the vein of the mc-202, featuring
  self-oscillation and vcf tracking capabilities.

  Features include a waveshaper with wave folding, filter and oscillator fm,
  ring modulation, control signal patching, audio rate lfo, and quick envelopes.
  The synth can be used in monophonic mode with the built-in sequencer or
  switched to polyphonic mode for use as a standard softsynth.

  The integrated sequencer provides extensive controllable randomization with
  the ability to choose the density of notes, ties, and accents, lock
  randomization to different scales and modes, and automatically create relevant
  variations. It supports rebirth pattern import and freebee pattern
  import/export.

  The oscillators are designed to emulate the characteristic roland sound with
  complex spectrum and organic waveshapes that change timbre with pitch,
  featuring no perfect digital waveshapes and resulting in a sound that is
  evocative of analog hardware while expanding into new territory.
specs: |-
  - 2 voltage controlled oscillators with sawtooth, squarewave, pulse, triangle
  and sinus waveforms

  - 1 voltage controlled noise generator

  - 1 modulation generator with audio output, which can be used as 3rd vco

  - 1 voltage controlled filter (3 filter types, 18db, 24dbso and 24dbso
  2xoversampled)

  - 2 envelope generators (main envelope generator and volume envelope
  generator), with voltage control

  - Oscillation operator unit (ring and sync between oscillators)

  - Noise generator with variable color

  - 1 envelope follower for aux signals

  - 2 inverter modules

  - 2 attenuators, one with lag output

  - 1 sequencer with CV note/gate output and gate outputs for slide and accent

  - 7 octave range

  - 64 steps x 128 patterns

  - Effects per step: accent, slide, transpose up & down

  - Prescale per pattern: 1/16, 1/32, 1/16t and 1/8t

  - Full range oscillators with no aliasing

  - Non-linear filter with self oscillation and vcf tracking

  - Can be used to process external signals through the vcf

  - Stereo delay unit with modulatable delay time (left & right)

  - 32-voice polyphonic mode

  - Patch cable system that allows additional CV routing

  - 500+ preset patches and sequences

  - Internal pattern sequencer

  - User skinnable

  - Full MIDI cc control with learning function

  - Rebirth pattern import

  - Freebee pattern import/export

  - Two MIDI modes (pattern and note)

