details: >-
  The creative collection is included with pro tools and select titles are also
  available to purchase separately in AU/VST formats.


  Boom is a classical drum computer with pattern sequencer featuring 10 analog
  drum machine kits, 10 instruments with pitch, level, decay, and pan per kit,
  50 settings covering contemporary and classic electronic musical genres, a
  slick user interface reviving the feel of legendary analog drum machines, and
  an additional matrix sequencer.


  Db-33 is a tonewheel organ simulator featuring air-proprietary vintage organ
  model, air-proprietary extra-realistic convolution rotary cabinet, and
  air-proprietary tube overdrive emulation.


  Mini grand is an acoustic grand piano with premium quality piano samples, 7
  selectable piano models covering a wide range of piano sounds, re-pedaling
  technology recreating super realistic string resonance behavior, built in room
  simulation, and equal and stretched tuning available.


  Vacuum is a virtual analog tube emulation synthesizer featuring monophonic
  vintage synthesizer with vacuum tube synthesis, very easy to use with great
  sound character and tube warmth from soft overdrive to heavy distortion, and
  an age function with drift and dust controls adjusting the age from oscillator
  drift to crackling controls to slightly inaccurate keyboard triggering/pitch
  for the authentic hardware experience.


  Xpand!2 is a multitimbral all-in-one workstation utilizing multiple sound
  generation engines including subtractive synthesis, fm synthesis, tonewheels,
  sample playback, arpeggiator, and phrase player, with more than 50
  high-quality audio effects, up to 4 instrument layers per patch, smart knobs
  for easy sound editing controls, and more than 3000 sounds presets and parts
  covering categories such as soft pads, bright pads, huge pads, action pads,
  ambience and fx, polysynths, synth brass, percussive, simple arpeggios,
  multitrack arpeggios, soft leads, hard leads, acoustic piano, e-pianos and
  clavinet, organs, strings, vocals, brass and woodwinds, mallets, bells,
  guitars, ethnic, hits, synth basses, basses, drums, percussion, loops, and
  multitimbral.
