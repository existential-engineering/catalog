details: |-
  ReDominator is a synthesizer, controller and Sysex librarian inspired by the classic Alpha Juno, a polyphonic DCO (digitally controlled oscillator) based synth from 1986 most famous for the Hoover sound used in Hard Style and Rave. It is also available as a Rack Extension at the Reason Studios shop.

  The AJ-1/2 became popular in the early 90's techno and rave scene particularly by the classic Hoover sound, which ReDominator emulates accurately. But beyond those niche sounds there lays a versatile synthesizer that does bass, pads, leads, organs and a lot of other sounds waiting to be discovered.

  The DCO section features fourteen different harmonically rich waveforms including a unique PWM-sawtooth. Three waveforms can be combined per voice, enabling massive sounds.

  ReDominator features a unique 8 parameter envelope which enables much more complicated and expressive sounds than a standard ADSR. There are four time settings, three levels and a unique keyboard scaling parameter which gives the sound a "sampler" quality.

  The instrument contains a high quality 24dB/octave lowpass filter with a warmth control (VCA level) which, unlike the original JU, causes warm overtones in place of harsh digital distortion when overdriven.
specs: |-
  - Emulation of the Alpha J-2 famous Hoover patch
  - Emulation of the IR3505 chip which drives the filter
  - 14 different low aliasing waveforms including a unique PWM-sawtooth
  - High quality full range 24dB/octave low-pass filter
  - Unique 8 parameter envelope generator which enables much more complicated and expressive sounds than a standard ADSR
  - 200+ bundled patches (of which many are SysEx converted from AudioRealism's own AJ-2)
  - Patch importer which allows importing SysEx patches from your own Alpha Juno and play them in ReDominator
  - Chord Memory function (VST/AU version only)
  - SysEx compatible with the Alpha Juno and MKS-50
  - macOS: Intel and Apple Silicon, requires macOS 10.13 or higher
  - Windows: 64-bit, requires Windows 7 or higher
  - Requires a VST2.4, VST3 or Audio Unit host such as GarageBand, Logic Pro, FL Studio, Ableton Live or Cubase
