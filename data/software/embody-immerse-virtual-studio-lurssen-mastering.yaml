description: A spatial audio plugin and standalone application that lets users
  monitor stereo, surround, or Atmos mixes up to 7.1.4 channels on headphones
  inside a virtualized version of Lurssen Mastering's Immersive Room, with
  personalized HRTF technology and metering.
specs: |-
  - Monitor Stereo, Surround, or Atmos up to 7.1.4 channels on headphones from inside Lurssen Mastering's Immersive Room
  - Personalized HRTF technology for accurate height and depth-of-field
  - Full acoustic and signal chain virtualization
  - Hand-tuned headphone EQ including universal profiles for broad compatibility
  - Robust interface including channel input config, limiter, and RMS/LUFs meters
  - Mix & Master Bundle: Gain access to both Lurssen Mastering and Alan Meyerson signature editions with one purchase.
  - Includes VST3, AU, and AAX plugins and standalone version
  - Compatible with any DAW
