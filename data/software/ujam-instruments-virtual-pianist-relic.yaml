description: Create emotional piano tracks with Virtual Pianist RELIC, inspired by iconic musical eras, from John Lennon's "Imagine" to Rihanna's "Stay."
details: |-
  Create emotional piano tracks with Virtual Pianist RELIC, inspired by iconic musical eras, from John Lennon's "Imagine" to Rihanna's "Stay." If you can't play, use the built-in pianist for real, musical performances. If you do play, the Instrument Mode puts a beautifully imperfect upright at your fingertips.

  Months of tuning, miking, engineering and recording sessions went into the capturing of this wonderfully "just perfectly imperfectly" tuned upright piano. It plays well, sits well in a mix, blends well with voices and other instruments and, using the Characters and other sound design options, offers a world of beautifully emotive pianoscapes.

  Not everyone who often needs a piano can play one. The built-in pianist creates and records musical, well-played and correctly voiced piano performances with just one finger. It never sounds like an accompaniment, it always sounds like a real piano player, and chords and controllers add even more realism and individual articulation.

  Intimate close-up piano or piano in the clouds, grandma's old bar piano or ambient soundscapes: RELIC offers synthesizer-like sound design that you can either play with yourself or enjoy browsing through the extensive collection of presets.
specs: |-
  - Hand-picked upright piano with 5 distinct character models
  - Built-in pianist with hundreds of phrases and intuitive real-time control
  - Finisher and Ambience multi-effects for sound design
  - 150 presets
  - Player mode and Instrument mode
  - Supported standards: MIDI
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 5.68 GB of disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery: automated installation via the UJAM App, which also installs the Virtual Pianist plug-in host
  - Authorization via the UJAM App
  - All MIDI phrases and included sounds are royalty-free
