description: Adjust your phantom center signal without changing the panorama or
  spectral characteristics.
details: |-
  CenterOne lets you adjust your phantom center level of a stereo source and even separate your center and side signals. Whether you need to bring prominence to a lead vocal without changing stereo content, or if you want to isolate centered and panned audio, CenterOne's original approach gives you unparalleled control.

  The unique algorithm adjusts center levels without compromise in sound quality between your new audio signal and the original source, so expect clean audio for each part of your mix, and feel confident to apply the plugin in a variety of contexts.

  Better than mid-side processing: The Center Prominence algorithm analyzes the exact phantom center to transparently adjust stereo audio. This avoids phase shifts or panorama imbalance issues from Mid-Side techniques. You can leave unique left and right signals untouched — changes don't affect timbre or sound quality.

  Extract phantom center and side: Left-Center-Right audio outputs allow independent processing. Signals recombine to be bit identical to the original source.
specs: |-
  - Phantom Center Control — adjust centered content levels without affecting stereo panorama
  - Extract Left-Center-Right — separate stereo into lossless, bit-identical L/C/R stems
  - Center Prominence algorithm avoids phase shifts or panorama imbalance from Mid-Side techniques
  - Retina display design with single-screen workflow
  - Mac OSX 10.13+ required (M1-Native supported)
  - Windows 8 or 10 required (64-bit only)
