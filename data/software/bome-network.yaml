description: Bome Network is a versatile tool for macOS, Windows, Linux, and iOS
  to set up low latency and robust network MIDI connections in your music.
details: |-
  Bome Network is a versatile tool for macOS, Windows, Linux, and iOS to set up
  low latency and robust network MIDI connections in your music studio or on
  stage. It has never been easier to create a cross platform MIDI network using
  Ethernet and wireless lan.

  An integrated MIDI router will let you take full control of your MIDI gear. It
  is similar to apple's network MIDI/rtpmidi, but with a simple user interface
  and additional features like remote direct MIDI ports: directly select and use
  MIDI devices connected to a remote device via the network.

  All bome network MIDI connections are persistent and are re-established after
  a reboot. The basic version only allows network MIDI connections to one or
  more bomeboxes.

  The in-app-purchase bome network pro adds the capability to interconnect any
  number of computers, ios devices and bomeboxes, for a fully connected, cross
  platform MIDI network.

  With the in-app-purchase unlimited named MIDI ports, you can add any number of
  virtual MIDI ports to your computer or ios device. Then, use the MIDI router
  to define virtual MIDI thru, MIDI merge, and MIDI duplication.
