details: |-
  Vocal reverb is the world's first vocal-dedicated reverb plug-in to feature
  powerful ai assist technology, auto EQ, three reverb algorithms, ten
  pre/post-effects, and two delay types. Designed for professional vocal
  production, vocal reverb is perfect for adding ambiance, depth and emotional
  impact to your vocal recordings.

  Vocal reverb is powered by artificial intelligence (ai) that can help dial in
  your perfect sound. Simply tell vocal reverb the vibe you're going for and our
  groundbreaking ai will deliver a uniquely crafted reverb sound that will sit
  great in your mix.

  Utilizing our proprietary auto-tune pitch tracking technology, auto-eq
  monitors the fundamental pitch of your vocals and dynamically attenuates
  frequencies to prevent muddy and overpowering reverb tails.

  Vocal reverb includes three popular reverb styles (hall, plate and room) as
  the foundation for crafting your perfect reverb sound. These styles offer the
  versatility to achieve a range of vibes, from dark and moody halls to tight,
  intimate rooms, and smooth, vintage plates.

  Discover inspiring artist presets spanning a wide spectrum of vocal styles and
  vibes from bainz, ian kirkpatrick, mischke, dyryk and more. These presets will
  jumpstart your creativity and make it fun to explore new ideas.
specs: |-
  - Ai assist
  - Auto-EQ
  - Three reverb algorithms (hall, plate, room)
  - Five pre-verb effects (pitch, throat, tube, de-esser, reverse)
  - Five post-verb effects (tone shaper, compressor, gate, auto-EQ, width)
  - Two delay types (mono and stereo ping pong)
  - Auto-tune pitch tracking technology
