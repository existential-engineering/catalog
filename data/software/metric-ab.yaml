description: Reference plugin for A/B comparisons, allowing you to see and hear
  how your mix compares to commercially released songs. Includes all the
  reference meters needed for mixing and mastering.
id: Vg-0rVTjoAbkwLD9R0rVb
details: >-
  The metric ab plugin enables you to compare your mix to any reference mix with
  a simple click of the a/b button. It is designed to provide you with a clear,
  intuitive workflow and unique analysis tools.


  Just put it on your master channel and switch between your actual mix and cd
  or itunes mixes by your favorite engineers and bands, other versions of your
  mix, etc. Drag and drop up to 16 reference tracks into metric ab and take
  advantage of features such as instant volume matching, cue and loop functions
  and various monitoring modes.


  Playback of your reference mixes can be synced with your DAW to create the
  perfect workflow. Get technical with more advanced features including multiple
  analysis modes (spectrum, correlation, stereo image) and industry compliant
  lufs loudness and dynamics metering.


  With metric ab on your master buss you get all the data you need about your
  mix and reference audio simultaneously. Metric ab will play back various
  formats, like wav, mp3, aiff and flac. All from within your mix session.


  Just put it on your master buss after all the processing plugins you use
  (limiters, eqs, etc.). Metric ab offers professional lufs metering, so it's
  the perfect buddy for bx_masterdesk and other mastering solutions.
