description: "Audio effect plugin featuring a multi-lane sequencer that can play
  multiple effects simultaneously, with the ability to trigger unique scenes
  from every note on your keyboard. Designed to slice, dice, chop, screw, twist,
  turn and mangle sounds into radical new forms. Each program consists of 128
  scenes triggered via MIDI notes, each with its own unique sequencer pattern,
  timing, and effect settings. Includes randomize and mutate functions at almost
  every level for unexpected, chaotic and inspiring results."
details: |-
  2.1.4

  Multi-lane sequencer allows many effects to be played simultaneously

  128 scenes per program, triggered via MIDI notes, each with unique sequencer pattern, timing, and effect settings

  Includes Shuffler, Tape Stop, Reverser, Gater, Stretcher, and more tempo-synced effects with filter, mix, pan and volume controls on each module

  Randomize and Mutate functions at almost every level

  Intuitive pattern editor with drag and drop - draw, erase, resize, split and join blocks
specs: |-
  - windows: Windows 7 or higher, VST 2.4 host, 1024x768 resolution, CPU with SSE2
  - mac: OS X 10.11 or higher, VST 2.4 or AU host, 1024x768 resolution, Intel CPU with SSE2 or Apple Silicon
  - linux: Ubuntu 16 or higher, VST 2.4 host, 1024x768 resolution, CPU with SSE2, real-time kernel recommended
  - notSupported: Pro Tools AAX/RTAS is not supported
