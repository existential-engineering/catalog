details: >-
  Aardvarkkphaser is a classic phaser effect with up to 64 poles of super liquid
  sound. Controlled either by built in, tempo syncable multi-shape lfo, or
  manually, this is the last phaser you'll ever need.


  4 to 64 pole stereo phaser with 0 - 180 adjustable stereo offset. Adjustable
  phase range, feedback and depth. Tempo syncable, multi-shape lfo or manual
  control of phase position. Mix amount and output gain controls.


  Aardvarkkphaser by bom shanka machines is a virtual effect audio plugin for
  macos, windows and linux. It functions as a VST plugin, an audio units plugin
  and a VST 3 plugin.
specs: |-
  - 4 to 64 pole stereo phaser
  - 0 - 180 adjustable stereo offset
  - Adjustable phase range, feedback and depth
  - Tempo syncable multi-shape lfo
  - Manual control of phase position
  - Mix amount and output gain controls
  - VST plugin
  - Audio units plugin
  - VST 3 plugin
  - Windows 7 or greater
  - 32 or 64-bit compatible
  - 3ghz or faster cpu
  - Minimum 4gb ram
  - VST 2 or 3 compatible host
  - Macos 10.11 or greater
  - 64-bit version only
