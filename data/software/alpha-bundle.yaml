details: >-
  The delta sound labs alpha bundle includes the stream and fold audio effects
  plugins.


  Fold is a distortion synthesis audio effect plug-in that uses an assortment of
  modules in an in-series fx chain to imbue input signals with harmonically rich
  overtones and, if pushed to the extremes, completely transforms them with a
  unique form of distortion.


  Stream is a granular sampler audio effects plug-in for sound design, intricate
  delays and live performance. Its clean sound separates it from typical
  spectral or frequency granulators and it's a great way to layer and widen your
  audio source.


  Stream boasts very low latency making it ideal for live performance.


  Calling on their background in modular hardware design, the team has found a
  novel approach to creating warmth and distortion in software.
