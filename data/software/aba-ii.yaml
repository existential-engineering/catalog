details: >-
  Ample bass acoustic is a virtual acoustic bass instrument based on samples of
  a guild b-54 ce acoustic bass.


  Aba has a 4.6 gb sample library which is naturally recorded on every single
  fret. No destructive editing and dynamic processing are applied.


  Aba is designed from the ground up to be the most versatile bass virtual
  instrument available today with a new level of expressiveness. Aba not only
  performs as an extraordinary acoustic instrument by playback partially from
  mic samples, but also as an electric instrument by playback partially from di
  samples, creating a more dynamic and subtle playing experience.


  For mic part, aba provides two stereo and two mono modes. Users can adjust
  volumes of mics and width to get more options in stereo mode, in which aba has
  rich expressiveness even for solo. For mono modes, aba can play an important
  role of middle-low end in a band steadily.


  Redesigned tab player for bass tab. All articulations and notations are
  supported by the tab player. Realistic tab playback can be achieved through
  fine parameter adjustments and humanizations.
specs: >-
  - 4.6 gb sample library


  - 8 articulations (sustain, palm mute, natural harmonic, hammer on & pull off,
  legato slide, slide in & out, pop & slap, dead note)


  - Alternate tuning (to lowest note b0)


  - New sample engine


  - Multiple stereo and mono modes


  - New designed eq


  - Tab player


  - VST plugin


  - Audio units plugin


  - AAX plugin


  - Standalone application


  - Macos and windows compatible
