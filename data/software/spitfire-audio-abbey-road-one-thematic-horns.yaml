details: |-
  From the wistful main theme of Braveheart to the thunderous horn section used in The Batman original theme, as well as countless other themes spanning the entire history of cinema, the horn has proven itself to be the irreplaceable heart of orchestral scoring. Horns play myriad roles, from chorale accompaniment to strings, through to punchy main themes that transcend anything the rest of the orchestra has to offer.

  The first of our Film Scoring Selections to feature two legatos, this library provides an agile section of eight horns, capable of going from speedy playing with fast run articulations across dynamics to slower, stately and more lyrical performances all with the sound of cinema - Abbey Road Studio One and London's A-list players - right out of the box.
specs: |-
  - 8-piece horn section
  - 8 articulations: Performance Legato, Lyrical Legato, Long, Long Sforzando, Staccatissimo, Staccato, Tenuto, Marcato
  - 2 mixes
  - 10 mic signals: Vintage 1, Vintage 2, Pop Close, Pop Room, Close, Tree 1, Tree 2, Ambient, Outriggers, Spill
  - 11.00 GB uncompressed WAV
  - 12.00 GB disk space required during install
  - macOS 11 to OS 26, Intel and Apple Silicon supported
  - Windows 10 or 11 (64-bit)
  - Minimum 8GB RAM, 16GB recommended
  - Spitfire Audio App required for installation
