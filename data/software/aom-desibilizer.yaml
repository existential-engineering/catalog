description: A de-esser plugin that reduces sibilants in vocal and speech by
  detecting long sibilants rather than strong ones, preserving groove while
  maintaining natural sound.
details: |-
  DeSibilizer is a specialized de-esser plugin designed to reduce sibilants in
  vocal and speech recordings. Unlike conventional de-essers that react to
  signal strength, DeSibilizer detects long sibilants, providing more musical
  and natural-sounding results.

  The plugin features intuitive frequency range selection with detection
  sensitivity and threshold controls that can operate in both fixed and adaptive
  modes. It preserves groove by maintaining sibilant heads while reducing the
  sustained portions, resulting in very low sound coloring.

  A lookahead feature (0-60 milliseconds) allows the plugin to capture and
  reduce entire sibilants from their onset. A compensation boost synchronized to
  the reduction amount ensures the overall tonal balance is maintained.

  Two variants are included: the standard DeSibilizer with full lookahead
  capability (60.7ms latency) and DeSibilizer LL, a low-latency variant
  operating at just 0.67ms latency without lookahead functionality.
specs: |-
  - Intuitive frequency range selection
  - Fixed and adaptive detection threshold controls
  - Lookahead feature (0-60ms) for complete sibilant reduction
  - Compensation boost synchronized to reduction
  - Low-latency variant (DeSibilizer LL) included
  - Sample rates: 44.1kHz to 384kHz
  - 64-bit floating-point internal precision
