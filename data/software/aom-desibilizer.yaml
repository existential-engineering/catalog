description: A de-esser plugin that reduces sibilants in vocal and speech by detecting long sibilants rather than strong ones, preserving groove while maintaining natural sound.
details: |-
  DeSibilizer is a de-esser plugin, which reduces sibilants in vocal and speech. Rather than reacting to strong sibilants, its detector targets long sibilants, and the de-essing behaviour is controlled by two factors: detection sensitivity and detection threshold. Sensitivity can be fixed or adaptive, and the frequency range to act on is selected directly.

  By default the plugin preserves groove by keeping the head of sibilants intact, while a lookahead feature can be engaged to reduce whole sibilants instead. A compensation boost applies gain to the total band signal, synchronised to the reduction, and the processing is designed for very low sound coloring.

  DeSibilizer ships alongside DeSibilizer LL (Low Latency), and both can be unlocked with a DeSibilizer license or a Total Bundle license. DeSibilizer offers the lookahead feature (0 to 60 msec) at a plugin latency of 60.7 msec and is recommended for mixing and mastering, while DeSibilizer LL has no lookahead and a plugin latency of 0.67 msec for cases where near-zero latency monitoring is required.

  The plugin runs on Windows 11 (24H2, 25H2) with an x64-compatible CPU as VST2, VST3, AAX-Native and CLAP, and on macOS Monterey 12 through Tahoe 26 on Intel or Apple Silicon as VST2, VST3, Audio Unit, AAX-Native and CLAP. Sample rates from 44.1 kHz to 384 kHz are supported with 64-bit floating-point internal precision.
specs: |-
  - Detects long sibilants rather than strong sibilants
  - Intuitive frequency range selection
  - Control de-essing behavior by two factors: detection sensitivity and detection threshold
  - Fixed and adaptive sensitivity
  - Very low sound coloring
  - Preserve groove by keeping head of sibilants by default
  - Lookahead feature to reduce whole sibilants
  - Compensation boost: gain to total band signal, synchronizing to reduction
  - Lookahead range 0 to 60 msec; plugin latency 60.7 msec
  - Supports 44.1k - 384kHz sample rate
  - 64-bit floating-point internal precision
  - Latency compensation
  - Factory and user presets
  - Snapshot
  - Undo/Redo
  - Reset to default
