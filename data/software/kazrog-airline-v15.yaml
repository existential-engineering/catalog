description: A precise software emulation of the Airline Bass-Guitar Amplifier Model 62 9020A, a 1950s tube combo amp known for its strong mid presence, growl, and note bloom. Developed in collaboration with Airline Guitars.
details: |-
  Airline V15 is an emulation of the Airline Bass-Guitar Amplifier Model 62 9020A, developed in collaboration with Airline Guitars. This 1950s tube combo amp is known for its strong mid presence, growl, and natural note bloom.

  The plugin features 80+ vintage 15" Jensen speaker impulse responses, a classic Tone Bender fuzz pedal circuit, spring reverb, noise gate, and a 4-band EQ with speaker dynamics control. A 2-channel cabinet IR loader with variable blending provides additional flexibility.

  Oversampling is available up to 32x for high-fidelity processing. The GUI is fully resizable. Airline V15 ships as a perpetual license with no iLok, dongle, or subscription required.
specs: |-
  - Emulation of Airline Bass-Guitar Amplifier Model 62 9020A
  - 80+ vintage 15" Jensen speaker impulse responses
  - Classic Tone Bender fuzz pedal circuit
  - Spring reverb and noise gate
  - 4-band EQ with Speaker Dynamics control
  - 2-channel cabinet IR loader with variable blending
  - Oversampling up to 32x
  - Resizable GUI
  - macOS 10.13+; Universal Binary 2 (Apple Silicon & Intel)
  - Windows 10+
  - Linux: VST3, VST2, LV2 compatible hosts
  - Standalone available for Mac and Windows
  - AAX requires Pro Tools 12+
  - Perpetual license; no iLok, no subscription
