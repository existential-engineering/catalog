description: Get authentic 70s rock tones with the Airline V15 guitar amp simulator plugin. Built-in effects, dual IR loader, and studio-grade tone. Try it free.
details: |-
  Famously used as a studio secret weapon on classic rock recordings, Airline V15 is a precise software emulation of the Airline Bass-Guitar Amplifier Model 62 9020A, a 15" tube combo amp known for its strong mid presence, growl and note bloom. The amp was hand-built at the Chicago Valco factory in the late 1950s, and the plugin was developed in direct collaboration with Airline Guitars.

  The plugin bundles the effects the original tone depended on: a circuit based on the classic Tone Bender pedal, an authentic spring reverb available as a quick control on the front panel, and a no-fuss noise gate for tonal control. Oversampling runs up to 32x with separate settings for real-time and offline processing, adjustable on the fly.

  A 2-channel cabinet IR loader sits at the end of the chain, loaded with over 80 impulse responses of the amp's 15" vintage Jensen speaker captured with multiple mics and blends. Those IRs follow the same file naming conventions as Kazrog's Recabinet - Remastered library, and users can load their own. The loader adds a 4-band EQ, a speaker dynamics control, stereo panning when used in a stereo instance, an adjustable short delay for correcting phase discrepancies with third-party IRs, and variable blending that is psychoacoustically level matched in the center position.

  A standalone application for Mac and Windows lets the amp be played without a DAW, and the GUI is resizable. Licensing is a 100% perpetual license for multiple devices, with no iLok authorization and no subscription fees. A time-unlimited free demo is available, restricted by random silent output every so often followed by a gentle fade, and by disabled preset saving.
specs: |-
  - Emulation of the Airline Bass-Guitar Amplifier Model 62 9020A, a late-1950s 15" tube combo built at the Chicago Valco factory
  - Over 80 impulse responses of the amp's 15" vintage Jensen speaker with multiple mics and blends
  - Overdrive based on the classic Tone Bender pedal circuit
  - Authentic spring reverb as a front-panel quick control
  - Noise gate
  - Oversampling up to 32x with separate real-time and offline settings, adjustable on the fly
  - 2-channel cabinet IR loader with 4-band EQ, speaker dynamics control, stereo panning, and adjustable short delay
  - Loads user-supplied third-party IRs
  - Variable IR blending, psychoacoustically level matched in the center position
  - Resizable GUI
  - Standalone application for Mac and Windows
  - Developed in direct collaboration with Airline Guitars
  - Mac: macOS 10.13.x or higher; VST, AU, AAX (64-bit) host required; Universal Binary 2 (Apple Silicon and Intel)
  - Windows: Windows 10 or higher; VST or AAX (64-bit) host required
  - Linux: VST3, VST2, or LV2 host required; tested with Ubuntu, Linux Mint, Debian, and Manjaro
  - Pro Tools 12 or higher required for the AAX version
  - Apple M1 or Intel i5 "Ivy Bridge" CPU or newer strongly recommended
  - 100% perpetual license for multiple devices, no iLok authorization required, no subscription fees
