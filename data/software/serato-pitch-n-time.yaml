details: |-
  Pitch 'n Time is a high quality time-stretching and pitch-shifting technology that premiered in 1998 to revolutionize the way we work with audio in the studio environment.

  Serato Pitch 'n Time is offered in two product variants. Pitch 'n Time Pro is a high quality time-stretching and pitch-shifting AudioSuite software plug-in for the Pro Tools platform.

  Pitch 'n Time LE 3 is available for Pro Tools, as a plug-in, and Logic Pro, as an algorithm within Logic's Time and Pitch Machine.
specs: |-
