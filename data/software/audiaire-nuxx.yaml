description: A sequencer-powered multi-effects processor with dedicated
  parameter sequencing, 30 effect types, and 55 sequencer lanes.
details: |-
  Nuxx is a powerful multi-FX processor with dedicated parameter sequencer and
  30 effects types. It features programmed effects modulations with real-time
  automation capabilities.

  The processor includes 30 effect types spanning compression, chorus, delay,
  distortion, decimator, flanger, phaser, barber-pole phaser, pitch shifter,
  low-pass/band-pass/high-pass filters, and ring modulation.

  Nuxx provides 55 parameter sequencer lanes with global and unipolar options,
  along with 6 assignable, color-coded macros. It operates in two modes: a
  simplified 6-knob multi-FX interface or an advanced sequencer-based automation
  machine.

  The plugin ships with 187 bespoke presets designed by leading patch designers.
  27 sequencer speeds are available with swing and probability controls, along
  with step modifiers, 10 arpeggios, 13 scales, individual lane step mutes, and
  selectable sequence lengths.
specs: |-
  - 30 effect types
  - 187 bespoke presets
  - 55 parameter sequencer lanes
  - 6 assignable color-coded macros
  - 27 sequencer speeds
  - Swing and probability controls
  - Step modifiers
  - 10 arpeggios, 13 scales
  - Individual lane step mutes
  - Selectable sequence lengths
  - Dual mode: simple 6-knob interface or advanced sequencer
