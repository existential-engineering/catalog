description: A powerful multi-FX processor with dedicated parameter sequencer and 30 effects types.
details: |-
  Nuxx is a multi-FX processor with a dedicated parameter sequencer and 30 effects types. Each effect parameter can be modified in its own independent sequencer lane, on one screen, with a choice of filters, delay, reverb, distortion, pitch shift, bit crusher, phaser, chorus, ring mod and more.

  Nuxx can be used in two distinct modes. In its simplest form the sequencer can be hidden allowing use as a simple 6-knob multi-FX unit, or as a powerful glitch machine with real time automation on every FX parameter.

  Nuxx includes 187 bespoke presets, 55 parameter sequencer lanes with complex tools for modifying lane behaviour, including addition of popular scales, arpeggios and patterns. The presets were designed by some of the world's leading patch designers, with DSP by Sinevibes and Moditone.

  The interface is a clearly laid out, scalable GUI designed for ease-of-use with one page editing, and carries numerous lane modification tools including increase/decrease and shift steps modifiers plus 10 popular arpeggios and 13 scales.
specs: |-
  - 30 insert FX types including compression, chorus, delay, distortion, decimator, flanger, phaser and barber-pole phaser, pitch shifter, low-pass, band-pass and high-pass filters, ring modulation and more
  - 187 bespoke presets designed by leading patch designers
  - DSP by Sinevibes and Moditone
  - 55 global and unipolar parameter sequencer lanes
  - 6 fully assignable, colour-coded macros, responsive to real time lane automation
  - 27 lane and global sequencer speeds
  - Individual lane step mutes and independently selectable sequence lengths
  - Sequencer +/- swing and probability controls
  - 10 popular arpeggios and 13 scales
  - Increase/decrease and shift steps lane modifiers
  - Two modes: 6-knob multi-FX with the sequencer hidden, or glitch machine with real time automation on every FX parameter
  - Clearly laid out, scalable GUI with one page editing
  - Requires a 64-bit DAW
  - Minimum OS: macOS 10.9, Windows 7
