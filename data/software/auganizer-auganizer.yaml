details: |-
  Auganizer is the world's first full and proper Audio Unit management app for
  os x. It enables users to rename, reorder, organise and arrange Audio Units
  the way they want, following custom naming and organising conventions such as
  logic's native plugin naming scheme with top folders like "dynamics",
  sub-folders like "compressors", followed by custom plugin identifiers.

  The application includes powerful filtering and search tools to quickly find
  and edit plugins for renaming. Users can select multiple plugins to rename
  them all into the same top or sub group quickly and easily, which is useful
  for organising all eq or compressor plugins in one change.

  Os x's native cover flow is integrated into the app to load up the guis of
  plugins, making it easier to identify more obscure plugins while organising.
  The app works directly with logic (versions 7 to x), garageband, and main
  stage, so users don't need to rescan plugins each time changes are made—simply
  close and reopen the sequencer and changes will be visible.

  Auganizer supports both 32-bit and 64-bit plugins and allows users to disable
  plugins for logic x. Settings can be exported and imported for backup or use
  on other machines.

  The application requires a minimum of os x 10.6 and supports up to and
  including os x 10.9. It functions as a standalone application and requires an
  audio units host such as logic 7, 8, 9 or x, garageband, or ableton live.
