description: Babylon 2 offers all of the single-page simplicity as its
  predecessor, but now with a renewed focus on multi-voice oscillators and
  morphing wavetables. We've added enhanced filters and renewed effects, plus
  unprecedented control over modulation, arpeggiation, tuning and much more.
details: |-
  Babylon 2 offers all of the single-page simplicity as its predecessor, but now
  with a renewed focus on multi-voice oscillators and morphing wavetables. We've
  added enhanced filters and renewed effects, plus unprecedented control over
  modulation, arpeggiation, tuning and much more.

  The multi-voice oscillators of babylon 2 feature not only traditional stereo
  unison and detuning capabilities but also brand-new modes. Dive into the
  depths of sound creation offering seamless waveform blending with multi mode
  and live morphing with quad mode. No longer confined to pre-defined waveforms,
  the new w-lab wavetable editor helps you craft unique tones and mutating
  timbres.

  Expand your sonic palette with babylon 2's extensive range of filter types,
  for the first time including svf, iir, and bi-quad filters, as well as classic
  and more experimental options. Experience the richness of improved reverb,
  delay, distortion, and a newly added effect for brain-scrambling tempo-synced
  phasing.

  Explore out-of-this-world scales and tuning with babylon 2's innovative
  microtonal tuning section. New to version 2, you can now tune every individual
  note of 11 octaves in cents. The scale bank contains 23 standard scales and 34
  additional scales from far-flung places - some using quarter tones for exotic
  musical moments.

  With hundreds of high-resolution waveforms, from formants to digital
  instruments, you're sure to find the perfect starting point for your own
  sounds. Alongside many variants of the classic oscillator shapes, there are a
  host of more unusual waveforms, all fully morphable using the new oscillator
  modes.
