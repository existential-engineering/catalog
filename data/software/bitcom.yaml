description: There are subtle plug-ins you put on the two-buss to give a nice
  gentle vibe to a track. Bitcom is not one of those. There is no analog mod...
details: |-
  Bitcom is a modern bit-shredding digital banshee that beggars description and
  lives on the edge of instability. In a nutshell, a step sequencer drives a
  custom-designed bitcrusher, with a synth sidechain.

  Bitcom's bit engine is unique; each step has eight switches that turn
  individual bits on and off. So all 8 switches on, and the output is pretty
  much like the input. Start turning them off and strange things happen.

  Bitcom includes a simple monophonic synth that can either be always on,
  envelope driven, or controlled via MIDI. This is mixed with the input signal
  to create strange new sounds. Alternatively, bitcom can be used without any
  input at all, as a moderately capable synth.

  Bitcom's step sequencer syncs to the host DAW. The sequence can be of
  arbitrary length from 1 to 16 steps, and the sequencer has internal swing.

  We pulled out every trick in the book to build a modern electronic music
  effect that can turn even the most sedate input in to a swinging, screaming
  pain-monkey, wreaking havoc on lesser sounds.
specs: |-
  - Step sequencer
  - Custom-designed bitcrusher
  - Synth sidechain
  - Bit engine with individual bit switches
  - Monophonic synth
  - MIDI control
  - Envelope-driven synth
  - Host DAW sync
  - Arbitrary length sequencing (1-16 steps)
  - Internal swing
  - 32-bit and 64-bit versions
  - macOS intel 10.6.0 or later
  - Windows xp sp 2 or later
