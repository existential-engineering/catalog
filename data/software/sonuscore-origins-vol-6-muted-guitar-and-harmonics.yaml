description: Build and perform intricate modern guitar arpeggios with these two beautifully recorded electric guitars. With both muted and harmonic styles of playing, the library delivers a modern world of sound ranging from delicate designed to rich and cinematic patches.
details: |-
  Two electric guitars, played and processed in completely different ways, open a modern world of sound spanning delicately designed patches through to rich and cinematic ones, drawing on the sonority and flexibility that made the guitar one of the most formative instruments of its era. For this ORIGINS volume Sonuscore collaborated with composer Mats Lundgren (Just Cause 2, Mad Max, Generation Zero) of Pole Position Production, who recorded the guitars and handled the processing.

  The muted guitar provides a very calm but rich sound, with a warm intonation when used as the base of a harmonic structure, and the Multi-Arpeggio-Designer gives it a characteristic, modern, sometimes futuristic feel. The harmonics add a shimmering, floating sound alongside the palm mutes, suited to lively ambient pads and modern-sounding arpeggios.

  The Multi-Arpeggio-Designer is the centerpiece of every ORIGINS instrument. Two fully customizable arpeggiators create interlocking patterns and broad soundscapes by combining the unique timbres of the two instruments. The engine is designed to convey a musically meaningful, human performance, instead of a computer randomly aligning notes. It ships with 80 presets, and modern guitar arpeggios can also be built from scratch in as much detail as required.

  The 12 individual color presets provide further possibilities for sculpting the sound. All colors are radically different in character and incorporate various effect settings and multiple impulse responses. Each MAD preset has an assigned color preset, but any combination of the two can be used. Arpeggio designs can also be copied and pasted between different instruments of the ORIGINS series.
specs: |-
  - Two individually playable instruments: muted electric guitar and electric guitar harmonics
  - Multi-Arpeggio-Designer (MAD) with two fully customizable arpeggiators
  - 80 rhythm presets
  - 12 unique color settings
  - Full customization of all controls
  - Arpeggio designs can be copied between different ORIGINS instruments
  - Recorded with a 2006 Fender Stratocaster American Deluxe with Samarium Cobalt pickups (muted guitar)
  - Recorded with a 2003 Gibson SG with Seymour Duncan Phat Cat pickups (harmonics)
  - Recorded through a handwired Marshall 1974X 18w class A amp
  - Requires FULL VERSION of Native Instruments' KONTAKT 5.8.1 or higher (the free Kontakt PLAYER only runs the instrument in demo mode)
  - Mac OSX 10.11 or higher, Intel Core 2 Duo
  - Windows 7 or higher, Intel Core 2 Duo or AMD Athlon 64 X2
  - 4 GB RAM
  - At least 164 MB of free hard disc space
  - Available as a download
