details: |-
  Omega Transformer Model N is a warm saturation plugin from Kush Audio, modeled on the transformer character of a coveted vintage Neve preamp. The sound is dark, thick, and round, where just a kiss imparts a dusty patina and pushing it hard gets downright fuzzy and soft.

  It pairs with the Omega Mic Pre, and it sits in the Kush plugin line alongside Omega 2 458a, Omega 2 A and Omega TWK.

  A perpetual licence is sold outright.

  A free 10-day demo is offered via a demo code entered after installing the software, following the maker's activation instructions. Mac and Windows installers are provided.
