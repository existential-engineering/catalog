details: |-
  BaB Drive simulates the sound of analog tape and the classic tubes (triode,
  tetrode) in most of the popular DAWs.

  Drive a changes the signal's fundamental frequencies so when it's on cw the
  signal will be distorted (bias). Drive b will make an equal (operating level)
  and even&odd harmonics.

  Should you want to add more depth, warmth and presence turn cw the drive a.
  The amount switch will attenuate the warmth.
