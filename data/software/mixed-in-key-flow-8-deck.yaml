description: Jump on the decks. Mix 100 tracks per hour. Elevate your mixing
  above Serato, Traktor and Pioneer CDJs.
details: |-
  Flow analyzes your music, and splits every track into 8 perfect loops. When you're playing, you will skip ahead to a great loop and play it right away. You can remix live by playing the exact part of the song that you love. Skip the boring parts. Play the most exciting drop. Sample the bits that sound really good to you.

  Flow was launched by the award-winning team that created Mixed In Key. It analyzes your music collection and finds the most accurate Mixed In Key result for every track, with the stated goal of helping you sound perfect in the DJ booth.

  Flow helps you create playlists for different vibes and moods. You can quickly segment your huge music collection into "Chillout", "Opening DJ Set", "Mid-Set", "Bangers" and other playlists based on the energy level of each track. Flow ranks every track on a scale of 1 to 10 to show you how energetic the track will sound in the club.

  You can MIDI map Flow with any DJ controller in the world. It also comes with built-in mappings for the world's most popular MIDI controllers built by Pioneer, Traktor, Numark and others. The minimum system specs for Flow are very simple: All you need is a laptop (no sound card, or controller needed).

  You can click anywhere in the Audio Wave, and Flow will smoothly cross-fade into that section of the track. Mixed In Key calls this "dimensional mixing", and the feature is exclusive to Flow. Use the 4 deck or 8 deck modes to play Stems.
specs: |-
  - Splits every track into 8 loops for live remixing
  - 4 deck and 8 deck modes
  - Mixed In Key harmonic mixing analysis for every track
  - Energy level ranking on a scale of 1 to 10
  - Playlist creation and music collection organisation
  - Volume controls, EQs, filters and effects
  - "Dimensional mixing": click anywhere in the audio wave to cross-fade into that section
  - MIDI mapping for any DJ controller, with built-in mappings for Pioneer, Traktor and Numark controllers
  - Native Instruments STEMS file format support
  - Analyzes MP3s and other audio files
  - Runs on a laptop with no sound card or controller required
  - Requires macOS 10.10 or newer on Mac
