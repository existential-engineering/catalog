details: |-
  Alien Underwater is a unique plug-in with emulation of aliens under water. It is a technology with experimental algorithms for advanced extraterrestrial sound design.

  Alien underwater is great for example with fx synths to totally transform, mutate and twist them, it's also great with beats, percussion, leads with anything you want to give a bit of nasty or beautiful bubbling alien dna.

  The plugin functions as a VST plugin and a VST 3 plugin for windows.

  Top features include water inflow knob, alien frequency knob, microphone position knob, water flow rate knob, alien telepathy knob, water drain knob, and dry / wet (literally!) knob.

  Preset manager with 11 presets of wet mutaded underwater aliens.
specs: |-
  - Alien frequency knob
  - Microphone position knob
  - Water flow rate knob
  - Alien telepathy knob
  - Water inflow knob
  - Water drain knob
  - Dry / wet knob
  - Preset manager with 11 presets
  - Experimental algorithms for advanced extraterrestrial sound design
