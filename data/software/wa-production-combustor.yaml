description: A compressor with five adaptive saturation models for shaping compressor tone as well as dynamics. It carries the usual threshold, attack, release, ratio and knee controls plus a sidechain mode.
details: |-
  Combustor is a compressor built around adaptive saturation, intended for creating personalised compressor timbres. Every compressor has its own tonality, drawn from real circuitry or from the modelling that stands in for it, and this plugin exposes that character as something to be dialled in.

  Five saturation models run from subtle to extreme. Type A gives a restrained tube effect and type E an overblown circuit sound, with the remaining types in between. Saturation is applied differently depending on the characteristics of the incoming signal and the compressor settings, and a saturation mix dial sets how much of it is heard.

  The compressor section carries the familiar controls: threshold, attack, release, ratio and knee, with a sidechain mode for external triggering. Parameter ranges are wide enough for anything from transient shaping to glueing a group together.

  Input and Output sliders compensate for gain changes caused by the compression settings, with up to 24 dB of attenuation in either direction, which keeps A/B comparisons accurate. A Mix ratio control at the bottom centre of the interface blends between conservative dynamic shaping and a fully processed signal.

  Central stereo meters show the signal as it is processed, so gain reduction is visible as the threshold fader is dragged down, and peak indicators glow red when the signal runs too hot. A large factory preset library is tailored to specific instruments, genres and effects, from subtle dynamic shaping through to fully crushed limiting.
specs: |-
  - Compression with built-in adaptive saturation
  - 5 saturation types
  - RMS and peak ratio
  - Threshold, attack, release, ratio and knee controls
  - Sidechain mode for external triggering
  - Input and output attenuation up to 24 dB either way
  - Mix ratio control for parallel blending
  - Visual feedback with stereo meters and peak indicators
  - Pop and click free bypass
  - Responsive and CPU friendly
  - Factory presets
  - Resizable interface
  - Full PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
