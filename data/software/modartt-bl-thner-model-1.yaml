details: |-
  Authorized by blthner, this is the world's first physical model of blthner's
  finest grand piano, widely celebrated for use on the concert stage.

  The round warm tonal character of the blthner model 1 is accurately rendered
  by pianoteq's physical model, bringing sparkling treble notes and powerful
  bass. The instrument is capable of producing everything from tender
  pianissimos to thunderous persuasiveness, easily matching the orchestra's
  power as well as intimate moments in a performance.

  Thanks to the physical modelling, the blthner model 1 offers unmatched
  playability and versatility, developed to meet the requirements of the most
  demanding musicians. The newly improved physical model in pianoteq 6 benefits
  this instrument even further by bringing more body and soul.

  A unique feature in blthner's grand pianos is the fourth string for each key
  in the treble, called the aliquot system. Its purpose is to create a
  sympathetic vibrating string that enhances the tone. This feature is included
  in the pianoteq model.

  In the standard and pro version it is possible to modify this specific
  parameter in order to decrease or increase the effect.
specs: |-
  - Physical model of blthner grand piano
  - Aliquot system (fourth string for each key in treble)
  - Sparkling treble notes
  - Powerful bass
  - Pianoteq 6 physical model
  - Playability and versatility
  - Sympathetic vibrating string enhancement
  - Modifiable aliquot system parameter in standard and pro versions
