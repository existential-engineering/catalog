description: Emulation of Lindell Audio's one-channel FET feedback compressor/limiter. Offers aggressive transient control and edgy distortion suitable for rap/metal vocals and electric guitars. Includes high-pass sidechain filter, Mix control for parallel compression, and stereo operation.
details: |-
  FET feedback compressor/limiter design
  Fast attack and release for lightning-quick transient response
  Edgy distortion capabilities when driven hard
  High-pass sidechain filter
  Mix control for parallel compression
  Analog button introducing noise, hum, and transformer saturation
  Stereo operation capability
