description: Emulation of Lindell Audio's one-channel FET feedback
  compressor/limiter. Offers aggressive transient control and edgy distortion
  suitable for rap/metal vocals and electric guitars. Includes high-pass
  sidechain filter, Mix control for parallel compression, and stereo operation.
details: |-
  Lindell Audio's 7X-500 is an emulation of Lindell Audio's one-channel compressor/limiter that uses a field-effect transistor (FET) feedback design. This plugin is Lindell Audio's take on the classic ”1176 Sound”. Use the 7X-500 with moderate settings to gently tighten up pads, or crank the ratio to 100:1 and slam it on your drum bus to achieve an iconic rock and roll effect.

  Some compressors struggle to clamp down on aggressive source material like rap and metal vocals, but not the 7X-500. When you use fast attack and release settings, the 7X-500 will respond like lightning to incoming audio information. By pushing this compressor hard, you can introduce edgy distortion to your mixes, a great fit for amped-up electric guitars.

  The 7X-500 delivers the same versatile sound as the original hardware unit, but it includes new and exclusive features. There's a high-pass sidechain filter and Mix control that you can use to apply parallel compression to tracks without creating send effects. Additional plugin-only features include stereo operation, continuously variable attack and release controls, along with an Analog button that introduces noise, hum, and transformer saturation to your signal.

  Legal disclaimer: 1176 is a registered trademark of Universal Audio Inc. The Lindell 7X-500 was developed by Lindell Audio based on its own modeling techniques. Universal Audio has not endorsed or sponsored the 7X-500 in any manner, nor licensed any intellectual property for use in this product.
specs: |-
  - Faithful hardware circuit emulation of the Lindell Audio 7X-500 compressor
  - FET feedback compressor with classic 1176 sound
  - Mix control for parallel compression
  - 3-step or continuous attack time
  - 3-step or continuous release time
  - High-pass sidechain filter
  - 3-step ratio: 4:1, 12:1 or 100:1
  - Transformer balanced output
  - Adjustable stereo link
  - Optional analog warmth and nonlinearities via a switch
  - 20-segment LED gain reduction meter
  - Supported plugin formats: AAX Native, AU, RTAS, VST2, VST3
  - Supported operating systems: macOS 26 down to macOS 13, Windows 11 down to Windows 10
  - Mac: Intel, or Apple Silicon
  - PC: x64-compatible CPU
  - Display resolution: 1440 x 900px or 1280 x 960px or higher
  - Memory: 2 GB RAM
