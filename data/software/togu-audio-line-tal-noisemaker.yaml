description: "TAL-NoiseMaker is a virtual analog synthesizer with a great sound
  and low CPU usage. Features 3 oscillators (including sub osc), pulse
  modulation, FM, oscillator sync, ring modulation, self-resonating 4x
  oversampled filters (7 filter types), 3 envelopes (filter ADSR, volume ADSR,
  routable ADSR), 2 LFOs with multiple running modes, built-in effects (reverb,
  delay, chorus, bitcrusher), velocity control, and up to 6 voices with
  portamento."
