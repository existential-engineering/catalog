description: The plugin delivers classic delay sounds through four combinable
  delay styles — Tape, Bucket Brigade, Digital, and Destruction — plus five
  post-delay effects. Features an interactive visual display, fully parametric
  equalizer, frequency analyzer, drag-and-drop module reordering, and feedback
  up to 150% for self-oscillation.
details: |-
  The HOFA Colour Delay provides you with all the iconic delay sounds for your productions. With four unique delay styles that can be freely combined, there are no limits to the retro feeling and your creative freedom.

  The Colour Delay offers you four styles in the feedback loop: Tape, Bucket Brigade, Digital and Destruction. Activate these sound variants individually or combine them as you wish for completely new and extraordinary delay sounds. You can easily customize the sequence of the individual style modules using drag & drop.

  The Tape style gives you the sound and characteristics of analog tape machines, with warmth, saturation and the characteristic imperfections of old tape recorders. The Bucket Brigade Delay is based on analog circuits in which a bucket brigade and a compander shape the sound, giving a soft, dark tone in which lo-fi artifacts and dynamic noise add a typical character. The Digital style emulates aliasing and quantization distortions caused by low sampling rates and bit depths, while Destruction combines tube and clip controls for a powerful, saturated sound.

  The interactive display gives you control over your delay sounds. The upper display shows the pulses over time and visualizes the modulation, and dry/wet, delay time and feedback can be adjusted directly in this diagram. Underneath, you can adjust the fully parametric equalizer, and there is also a useful frequency analyzer.

  With the post-delay effects for space, modulation and dynamics you can shape your delay sound and add additional colours. Diffusion, phaser, chorus, auto pan and ducker are placed after the feedback loop and are designed to creatively shape the effect signal. Each effect can be used individually or in combination, and thanks to the drag & drop function the processing sequence can be easily modified.
specs: |-
  - Four combinable delay styles in the feedback loop: Tape, Bucket Brigade, Digital, Destruction
  - Style modules can be reordered by drag & drop
  - Tape style with Drive and Wow & Flutter controls
  - Bucket Brigade style available in several versions (Standard, Vintage) with adjustable noise
  - Digital style with adjustable bit depth from 3 to 16 bits
  - Destruction style combining tube distortion and clipping
  - Five post-delay effects: Diffusion, Phaser, Chorus, Auto Pan, Ducker
  - Post-delay effects can be reordered by drag & drop and used individually or in combination
  - Interactive display visualizing pulses over time and modulation, with dry/wet, delay time and feedback adjustable in the diagram
  - Fully parametric equalizer with frequency analyzer
  - Feedback control up to 150% for self-oscillation
  - Formats: VST3, AU, AAX
  - Operating System: macOS 11 or later, Windows 10 or later
  - Continuously tested on Ableton Live, Apple Logic, Avid Pro Tools, Bitwig, Cockos Reaper, Image Line FL Studio, Magix Samplitude/Sequoia, Fender Studio Pro, Steinberg Cubase/Nuendo/Wavelab
  - Two licenses per purchase, managed via the HOFA Plugins Manager, offline activation supported
  - 14 days free trial
