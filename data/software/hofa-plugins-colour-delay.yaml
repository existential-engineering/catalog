description: All the iconic delay sounds
details: |-
  The HOFA Colour Delay provides you with all the iconic delay sounds for your productions. With four unique delay styles that can be freely combined, there are no limits to the retro feeling and your creative freedom. Easy handling with the interactive display 4 combinable styles: Tape | Bucket Brigade | Digital | Destruction Standard delays, exciting echoes & sophisticated soundscapes Post-delay effects: diffusion | phaser | chorus | auto pan | ducker “When developing the Colour Delay, two things were vital for us: we wanted any imaginable sound to be realizable with just a few clicks. And combining the different colours should be really fun!” Fabian Freitag & Jochen Sachse from HOFA-Plugins Tutorial videos Playlist 5 Videos Das neue HOFA Colour Delay vorgestellt 4:48 HOFA Colour Delay Trailer 0:38 DJ Zardonic Reviews HOFA Colour Delay 7:18 Delay auf Leadsounds | HOFA Studio-Workshop “Effekte” Teil 3 14:13 Innovative Synth-Delays | HOFA Studio-Workshop “Effekte” Teil 4 7:21 Sound examples Four delay styles full of character The Colour Delay offers you four styles in the feedback loop: Tape, Bucket Brigade, Digital and Destruction. Activate these sound variants individually or combine them as you wish for completely new and extraordinary delay sounds. You can easily customize the sequence of the individual style modules using drag & drop. This style gives you the sound and characteristics of analog tape machines. Create delay effects with warmth, saturation and the characteristic imperfections of old tape recorders. The Bucket Brigade Delay is based on analog circuits in which a bucket brigade and a compander shape the sound. It has a soft, dark sound in which lo-fi artifacts and dynamic noise add a typical character. Do you want the agreeable shortcomings of the first digital delays for your production? The “Digital” style emulates aliasing and quantization distortions caused by low sampling rates and bit depths. The Destruction style combines tube and clip controls
