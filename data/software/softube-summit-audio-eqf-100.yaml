description: VST passive tube equalizer. Full range, versatile, sweet sounding.
  Solves most tonality issues.
details: |-
  The Summit Audio EQF-100 Full Range Passive Tube Equalizer really sets the standard for all passive equalizer designs. It is a highly versatile and sweet sounding equalizer that will solve most of the tonality issues you may experience in a mix.

  Smooth and versatile tube EQ. Drive into the red for thick saturation. Four fully parametric bands of equalization with fixed frequency bands, with high and low filters that can be switched from bell to shelf, plus three-position low and high cut filters.

  Each and every component is carefully modeled, including the output stage distortion, giving the smooth sound and flexible operation of the original hardware.

  This plug-in can be used within Console 1, Softube's mixing system, and it supports Softube Extended Features: easy-access panels that add modern precision and workflow to the classic control set.
specs: |-
  - Smooth sound and flexible operation
  - Modeled output stage distortion
  - Four fully parametric bands of equalization with fixed frequency bands
  - High and low filters can be switched from bell to shelf
  - Three-position low and high cut filters
  - Each and every component carefully modeled
  - Console 1 Ready
  - Supports Extended Features
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Three activations
