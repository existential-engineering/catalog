details: |-
  Amplitube custom shop is a guitar amp & fx modeling plug-in, complete with custom shop for à la carte model purchases.

  Free version of amplitube 3 with 24 models including 9 stomps, 4 amps, 5 cabs, 3 mics, 2 rack effects + tuner. More models can be added à la carte with the new online custom shop. Models are priced in gear credits ranging from 5 to 20 credits per model. Credit prices drop down to $0.60 / 0.45 per credit when credits are purchased in bulk.

  Fully functional version of amplitube 3 software with complete working feature set. Mac/win standalone and plug-in (rtas, VST and AU) with native compatibility for 64-bit applications and operating systems.

  Ultra-accurate sound emulations with dsm and vrm technologies. 8 double rig configurations with up to 20 chainable effects with 2 amps. Two movable mics. Preset database with online preset sharing. Full integration with ik's hardware (stealthplug, steathpedal, stompio). Speedtrainer to slow-down/speed up backing tracks with no change in pitch. Built-in 4-track recorder in the standalone version.

  The new release includes new gear models from several of the hottest boutique manufacturers on the market today, including dr. Z amplification, fulltone, and z.vex. Effects, which will be available for à la carte purchase from the online store integrated in amplitube custom shop.
