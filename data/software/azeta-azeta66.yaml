details: |-
  The synth has all the warmth and smack expected from an analogue synth with a
  24 db low pass filter. It includes overdrive and chorus effects, though the
  synth invites parameter tweaking especially encouraged by the well-made gui.

  The parameters are limited to what a classic analogue synth really needs. The
  presets are included, and the synth is designed for classic synth basses,
  brasses, fat pads and leads.

  Gui is very well done and very appealing. Flexibility is limited but
  completely sufficient for analogue sound programming.
specs: |-
  - 6 voice polyphonic
  - 3 oscillators (saw, sine, tri, pulse, ramp, white noise, pink noise)
  - Resonant filter
  - 24 dB low pass filter
  - 3 LFOs with various modulation options
  - Chorus
  - Distortion
