description: smart:comp 3 is a spectro-dynamic compressor plug-in that combines
  AI-driven signal analysis with a semantic approach to dynamic control. It maps
  a range of musically viable compression settings for the material at hand,
  alongside all common compression controls, Style options and Spectral
  Compression.
details: |-
  smart:comp 3 is built around the idea that compression should follow creative intention rather than raw numbers. In its dedicated Compression Matrix, AI-powered analysis and automatic parametrization map an entire spectrum of musically viable compression settings derived from the characteristics of the incoming audio. The companion Compression Scope visualizes how far the analyzed signal can be dynamically shaped, so a suitable setting can be found without the usual trial and error.

  Group Mode links up to seven plug-in instances through inter-plugin communication for shared control of threshold, ratio, attack, release and mix. Every grouped instance appears in the Compression Matrix and in the signal history, which allows batch edits from a single window instead of stepping through each channel. That makes tightening a drum bus or aligning the compression of several vocal tracks a single operation.

  The Advanced Tabs add fine detail. Three Style options (Clean, Smooth and Aggressive) give immediate access to calibrated compression engines tuned for different technical and creative contexts, and a fully tweakable Custom style opens up attack and release shapes plus saturation behavior. Spectral Compression and Spectral Ducking apply additional compression or ducking only where the spectrum actually calls for it, preserving natural dynamics and energy across the mix.

  Further additions in this generation include a zero-latency Minimum Phase Mode for tracking and live use, with linear-phase processing still available for mixing and post-production, refined Input Riding to stabilize level variations ahead of the compressor, Mid-Side Mode, and updated compression engines with more defined attack and release behavior.
specs: |-
  - Compression Matrix with AI-powered analysis and automatic parametrization, allowing smooth transitions between compression characters
  - Compression Scope visualizing the viable compression range of the analyzed signal
  - Group Mode linking up to 7 instances for shared control of threshold, ratio, attack, release and mix
  - Three Style options (Clean, Smooth, Aggressive) plus a fully tweakable Custom style for attack and release shapes and saturation
  - Spectral Compression and Spectral Ducking for frequency-aware dynamic control
  - Zero-latency Minimum Phase Mode, with linear-phase mode available for mixing and post-production
  - Refined Input Riding and Mid-Side Mode
  - Plug-in formats (Mac): VST, VST3, AU, AAX
  - Plug-in formats (Windows): VST, VST3, AAX
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok
  - Native Apple Silicon support
  - Windows 10 (64 bit) or macOS 11 and later
  - Intel Core i5 or Apple Silicon processor
  - GPU with OpenGL 3.2 or later
