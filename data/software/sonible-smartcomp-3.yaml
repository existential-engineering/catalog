description: smart:comp 3 is a spectro-dynamic compressor plug-in that combines
  AI-driven signal analysis with a semantic approach to dynamic control. It maps
  a range of musically viable compression settings for the material at hand,
  alongside all common compression controls, Style options and Spectral
  Compression.
details: |-
  smart:comp 3 is designed to support your creative intention. This audio compressor plug-in uses intelligent algorithms to translate your signal into an intuitive map of viable compression characteristics. You achieve transparent, musical results faster while keeping your workflow smooth and focused. For granular dynamics shaping, smart:comp 3 provides all common compression controls, advanced Style options, and Spectral Compression.

  Your track knows the way, smart:comp 3 maps it. Compression is crucial to the vibe of a song, but most plug-ins offer plain numbers and parameters that feel disconnected from real sonic results. smart:comp 3 takes a different approach: in its dedicated Compression Matrix, AI-powered analysis and automatic parametrization map an entire spectrum of musically viable compression settings based on the characteristics of your audio material. By highlighting how far your signal can be dynamically shaped, it lets you explore your track's potential without the usual trial and error.

  Smarter control of complex sessions: accelerate complex mix workflows and ensure consistent compression across multiple tracks with smart:comp 3's Group Mode. Forget about jumping from instance to instance to tighten drum channels or align the compression of different vocal tracks. smart:comp 3 lets you work on up to 7 tracks simultaneously from a single window. All grouped instances appear in the Compression Matrix and the signal history, where you can batch-edit threshold, ratio, attack, release, and mix.

  Shape your compression down to the smallest detail: aside from all common compression controls, smart:comp 3 also comes with the Advanced Tabs that provide you with a range of features for fine-tuning and sonic flexibility. The intelligent compressor offers three Style options (Clean, Smooth and Aggressive) that give immediate access to well-calibrated compression engines tailored to different creative and technical contexts. An additional, fully tweakable Custom style enables complete control over attack and release shapes and saturation behavior. The unique technologies Spectral Compression and Spectral Ducking are staples in the intelligent compressor. They make sure that additional compression or ducking only is applied where it is actually needed to maintain natural dynamics and energy in your mix. smart:comp 3 also offers refined Input Riding, Minimum Phase Mode for zero-latency performance, Mid-Side Mode, and much more.
specs: |-
  - Compression Matrix: displays a range of compressor settings and allows smooth transitions between different compression characters
  - Compression Scope: visualizes the viable compression range of the analyzed signal
  - Group Mode: links multiple plug-in instances for shared control of threshold, ratio, attack, release, and mix, enabling batch adjustments from a single interface, up to 7 tracks
  - Zero-latency Mode: minimum-phase processing for live use and recording with no delay, with linear-phase mode still available for mixing and post-production
  - Refined Input Riding: stabilizes level variations prior to compression
  - Enhanced Style Control: updated compression engines with defined attack and release behavior and refined saturation characteristics
  - Three Style options (Clean, Smooth, Aggressive) plus a fully tweakable Custom style
  - Spectral Compression and Spectral Ducking
  - Mid-Side Mode
  - Plug-in formats (Mac): VST, VST3, AU, AAX
  - Plug-in formats (Windows): VST, VST3, AAX
  - Supported sample rates: 44.1 kHz to 192 kHz
