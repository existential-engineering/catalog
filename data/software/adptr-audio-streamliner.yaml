description: Prepare your masters for streaming with one simple workflow.
  Preview your music as it will be heard on streaming platforms with presets for
  all streaming platforms, codecs and loudness normalisation.
details: |-
  Streamliner prepares masters for streaming with a single workflow: preview how a track will be heard on streaming platforms using presets for the platforms, codecs and loudness normalisation those services apply, then reveal and correct problems before delivery.

  Its Platform Codec Preview auditions audio in real time through the same algorithms used by Spotify, Apple Music, YouTube and other services, so the artefacts introduced by encoding can be isolated and the original compared against the encoded version with a single click. Premade presets cover over 20 platforms, including social media platforms and global TV broadcast and advertising standards.

  Loudness matching applies each platform's loudness normalisation so a mix can be heard as it will sit beside other tracks in a playlist, and a real-time A/B reference feature loads favourite artist tracks for objective comparison, with manual, loop and cue playback modes or synchronisation to the host position for auditioning pre and post mastering versions.

  The metering suite covers loudness (Integrated, Short Term and Momentary), PSR and PLR dynamic range, and true peak, at zero latency. Over 100 target level presets drawn from hit records and from international broadcast levels for TV and film guide those readings, and a Meters Only view reduces the plugin to a small footprint during mix sessions. The UI is otherwise freely resizeable.

  Batch export writes every codec profile in the current platform preset in one click, or a custom set of platforms, covering AAC, MP3, Ogg Vorbis and Opus at bitrates from 320 down to 32 kbps, so the results can be tested on phones, laptops and other playback devices.
specs: |-
  - Premade presets for over 20 streaming platforms, plus social media and global TV broadcast and advertising standards
  - Real-time codec preview through the algorithms used by Spotify, Tidal, Apple Music, YouTube Music, Deezer, Pandora, Soundcloud, Bandcamp, Napster, Beatport Pro, Primephonic, Mixcloud, Facebook Video, Instagram, Twitch and Gaana
  - Artefact auditioning: single-click switching between original and encoded audio
  - Loudness normalisation preview and automatic level matching for all streaming platforms
  - Over 100 target level presets for loudness, dynamics and true peak, drawn from hit mixes and broadcast standards
  - Zero-latency metering: Integrated, Short Term and Momentary loudness, PSR and PLR dynamic range, true peak
  - Meters Only mode with reduced footprint and half the UI space
  - Real-time A/B reference track comparison with manual, loop, cue and host-sync playback modes
  - Sync start offset for reference tracks, with invalid start point detection
  - Batch export of all codec profiles from the current platform preset in one click
  - Export codecs: AAC, MP3, Ogg Vorbis, Opus at 320/256/224/192/160/128/96/64/32 kbps
  - Resizeable user interface
  - Supported plugin formats: AAX Native, AU, VST2, VST3
  - macOS 10.11 El Capitan through macOS 15 Sequoia, Intel or Apple Silicon (native M1 and M2)
  - Windows 7 through Windows 11, x64-compatible CPU
  - Display resolution 1440 x 900px or 1280 x 960px or higher
  - Memory: 4 GB+ RAM (8 GB+ suggested)
