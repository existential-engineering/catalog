description: Prepare your masters for streaming with one simple workflow.
  Preview how your music will be heard on streaming platforms with presets for
  all streaming platforms, codecs and loudness normalisation, plus beautiful
  metering for loudness and dynamics.
details: |-
  Streamliner prepares your masters for streaming with one simple workflow.
  Preview how your music will be heard on streaming platforms with presets for
  all streaming platforms, codecs and loudness normalisation.

  Hear exactly how your mixes will sound to end listeners — each streaming
  service transcodes your music differently, which can lead to clipping and
  other undesirable effects. Streamliner's Codec Auditioning feature allows you
  to preview your audio through the same algorithms used by Spotify, Apple
  Music, YouTube, and many other streaming platforms.

  Discover how loudness normalization will affect your masters and hear how your
  mix stacks up to others in a streaming playlist. Over 100 presets for target
  levels drawn from hit records covering loudness, dynamics and true peak levels
  across all styles of music and all platforms, including global TV Broadcast
  and advertising standards.

  Streamliner simplifies your workflow by offering a batch export feature that
  allows you to export all codec profiles from your current platform preset in a
  single click. Export codecs include Spotify, Tidal, Apple Music, YouTube
  Music, Deezer, Pandora, Soundcloud, Bandcamp, and more, as well as all major
  music formats including MP3, AAC, Opus and OGG Vorbis.
specs: |-
  - Streaming platform codec preview and auditioning
  - Supports Spotify, Apple Music, YouTube, Tidal, Deezer, Pandora, Soundcloud, Bandcamp, and more
  - Codec formats: MP3, AAC, Opus, OGG Vorbis
  - Over 100 target level presets
  - Loudness normalization preview
  - State-of-the-art metering for Loudness, Dynamics, and True Peak
  - Automatic loudness matching for A/B reference comparison
  - Batch export for all codec profiles
  - Global TV Broadcast and advertising standards presets
  - Meters-only view for small footprint during mix sessions
