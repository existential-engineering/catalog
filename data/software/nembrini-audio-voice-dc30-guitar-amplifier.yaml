description: Voice DC30 Custom Valve Guitar Amplifier plugin is modelled after a vintage VOX AC30 Top Boost Reverb, characterized by the "jangly" high-end sound widely recognized by British musicians and others. It is capable of both enchanting clean and raucous overdriven sounds.
details: |-
  Voice DC30 Custom Valve Guitar Amplifier plugin is modelled after a vintage VOX AC30 Top Boost Reverb, characterized by the "jangly" high-end sound that has become widely recognized by British musicians and others. It is capable of both enchanting clean and raucous overdriven sounds, and its signature chime pairs with the intricacies of the player's own style.

  The Voice DC30 has a separate brilliant channel, achieved by adding a gain stage and a cathode follower stage that drops the impedance and brings up the current, plus Bass and Treble controls on that channel. The brilliant channel with optional top boost is placed after the volume control section and before the phase inverter, so the sound can be shaped after the distortion.

  The Vib-Trem channel offers a choice between vibrato, a wavering pitch, and tremolo, a wavering amplitude, with a rotary three-position Speed switch to adjust the modulation rate.

  Three filters are provided: Tight reduces low frequency content to tighten the low range, Rumbling reduces low-frequency content, and Harsh reduces high-frequency content. The noise gate carries a Threshold control that defines the level at which the gate activates, a Range control for the quantity of noise reduction, and a Gate control for gate speed.

  The cabinet section offers a choice of eight different guitar cabinets and four microphone emulations with an on/off axis position switch and continuous position and distance knobs, with a complete mixer section of solos, mutes, pans and faders to blend the two microphones with the ambience. The impulse loader takes up to three third-party impulse responses, blended with volume, pan, phase, solo and mute controls, and adds a browser window for searching third-party IR files.
specs: |-
  - Modelled after a vintage VOX AC30 Top Boost Reverb
  - Separate brilliant channel with added gain stage and cathode follower stage, plus Bass and Treble controls
  - Brilliant channel with optional top boost placed after the volume control section and before the phase inverter
  - Vib-Trem channel selectable between vibrato and tremolo
  - Rotary three-position Speed switch for modulation rate
  - Tight filter reduces low frequency content to tighten the low range
  - Rumbling filter reduces low-frequency content
  - Harsh filter reduces high-frequency content
  - Noise gate with Threshold, Range and Gate speed controls
  - 8 guitar cabinet emulations
  - 4 microphone emulations with on/off axis position switch, continuous position and distance knobs
  - Mixer section with solos, mutes, pans and faders to blend two microphones with ambience
  - Impulse response loader for up to 3 third-party IRs with volume, pan, phase, solo and mute
  - IR browser window for searching third-party IR files
  - iOS version available for iPhone and iPad
  - Plugin formats: VST2, VST3, AAX or AudioUnits compatible host
  - Intel compatible or Apple Silicon CPU
  - 1GB RAM
  - Mac OS 10.13 or newer
  - Windows 7 or newer
  - 64-bit DAW required
