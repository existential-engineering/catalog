description: The Voice DC30 is a plugin emulation of a vintage VOX AC30 Top Boost Reverb, renowned for its signature jangly high-end chime and ability to deliver both enchanting clean tones and raucous overdriven sounds. It features dual channels, built-in cabinet emulations, a noise gate, and an impulse response loader.
details:
  - The Voice DC30 is a faithful plugin emulation of the legendary VOX AC30 Top Boost Reverb, one of the most iconic British valve amplifiers ever made. Known for its signature jangly, chiming high-end character, this amp has defined the sounds of countless classic recordings. The plugin captures both the enchanting clean tones and raucous overdriven sounds that made the original so celebrated.
  - "The plugin features two independent channels: a Brilliant channel with its own gain stage, cathode follower, and Bass/Treble controls; and a Vib-Trem channel offering authentic vibrato (pitch wavering) and tremolo (amplitude wavering) modulation effects. A three-position Speed switch controls the modulation rate across the Vib-Trem channel, replicating the original amplifier's distinctive modulation character."
  - "Three filter options allow players to shape frequency response to taste: Tight reduces low-frequency content for a tighter bottom end, Rumbling further reduces low-frequency response for a controlled feel, and Harsh cuts high-frequency content for a smoother, warmer tone. An integrated noise gate with Threshold, Range, and Gate speed controls silences unwanted hum and noise without affecting natural playing dynamics."
  - The cabinet section offers eight different guitar cabinet emulations, each available with four microphone emulations. Players can switch between on-axis and off-axis microphone positioning and adjust the distance and position of each microphone. A full mixer section with solos, mutes, pans, and faders provides detailed control over the blended cabinet sound.
  - An impulse response loader supports up to three third-party IR files simultaneously, with per-IR volume, pan, and phase controls for blending. This allows players to combine custom IRs with the built-in cabinet emulations for a highly personalized sound. A built-in browser makes it easy to navigate and load IR files from disk.
specs: |-
  - Based on the vintage VOX AC30 Top Boost Reverb
  - Brilliant channel with gain stage, cathode follower, Bass and Treble controls
  - Vib-Trem channel with vibrato and tremolo modulation modes
  - Three-position Speed switch for modulation rate control
  - Filter options: Tight, Rumbling, Harsh
  - Integrated noise gate with Threshold, Range, and Gate speed controls
  - Eight built-in guitar cabinet emulations
  - Four microphone emulations per cabinet with on/off axis and distance controls
  - Cabinet mixer with solos, mutes, pans, and faders
  - Impulse response loader supporting up to three third-party IRs
  - Formats: VST2, VST3, AAX, Audio Units (64-bit only)
  - macOS 10.13 or newer (Intel and Apple Silicon)
  - Windows 7 or newer
  - iOS (iPhone/iPad)
  - Minimum 1GB RAM
