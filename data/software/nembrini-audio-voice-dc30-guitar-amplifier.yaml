description: 'Voice DC30 Custom Valve Guitar Amplifier plugin is modelled after
  a vintage VOX AC30 Top Boost Reverb characterized by its "jangly" high-end
  sound that''s become widely recognized by British musicians and others.'
details: |-
  Voice DC30 Custom Valve is capable of both enchanting clean and raucous overdriven sounds, the signature chime of the Voice DC30 Custom valve pairs seamlessly with the intricacies of your playing style, resulting in a sound that is truly your own. The Voice DC30 has a separate brilliant channel. This has been achieved by adding a gain stage and a "cathode follower" stage, thereby dropping the impedance and bringing up the current and adding Bass/Treble controls to this channel. The Vib-Trem channel offers a choice between vibrato (wavering pitch) and tremolo (wavering amplitude). A rotary, three position Speed switch adjusts modulation rate.
