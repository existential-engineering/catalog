description: Developed in collaboration with engineer Leif Mases, the Maselec MEA-2 Precision Stereo EQ is the officially endorsed plug-in re-creation of the Maselec MEA-2 mastering equalizer, adding Mid/Side processing on every band.
details: |-
  Developed in exclusive collaboration with renowned engineer Leif Mases, the Maselec MEA-2 Precision Stereo EQ is the only officially endorsed plug-in that brings the meticulous craftsmanship and precision of the iconic mastering hardware into the DAW. It combines a hand-tuned asymmetrical Unique Q (Bandwidth) design with broad shelving, plus modern additions such as M/S per band.

  The MEA-2's curves are not derived from common textbook equations. The hand-tuned asymmetrical Unique Q (bandwidth) curves are artistically calibrated, and the broad shelving spans a wider frequency range to eliminate jarring shifts, giving highs that shimmer without being piercing and lows that are deep and rich without muddiness.

  The plug-in offers something the original hardware never did: Mid/Side mode on every band. Rather than locking the user into a broad mid/side approach, the MEA-2 lets each band be fine-tuned individually, pairing the original Maselec curves with modern mid/side control.

  Solo Isolation lets engineers explore a mix and pinpoint elusive frequencies and resonances. The solo function uses a handpicked fixed-gain curve for precise frequency targeting, and combined with the EQ's serial signal flow the interactivity between bands is immediately audible.

  The hardware was not simply emulated but recreated through Relab's machine learning and robotics technology, capturing every nuance from a custom built, one-of-a-kind unit provided by Leif Mases. Over 2.9 million data points were captured, achieving a match with a maximum deviation of just 0.018 dB.
specs: |-
  - Hand-tuned asymmetrical Unique Q (bandwidth) curves
  - Broad shelving spanning a wider frequency range
  - Mid/Side mode on every band (not available on the original hardware)
  - Solo Isolation with handpicked fixed-gain curve
  - Serial signal flow between bands
  - Stereo link per band
  - Balance control
  - Advanced preset management
  - Resizable GUI
  - Hand-crafted factory presets
  - Machine learning and robotics based modelling: over 2.9 million data points captured, maximum deviation 0.018 dB
  - Mac requirements (64-bit only): OS X 10.15 or higher, Intel or M1 processor, 2 GB of RAM
  - Windows requirements (64-bit only): Windows 10 or higher, Core 2 or higher, 2 GB of RAM
  - Compatible hosts: Logic Pro 10.x (Mac), Pro Tools 11.3.2 and up, Cubase 9.5 and up, Nuendo 8 and up, Live 9 and up
  - No hardware dongle required: local computer authorization or iLok USB key (V2 or above), with a free PACE iLok account required at activation
