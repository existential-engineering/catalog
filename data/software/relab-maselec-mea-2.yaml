description: "A mastering-grade precision stereo equalizer plugin developed in
  collaboration with Leif Mases. Captures the sound characteristics of the
  iconic Maselec hardware unit through advanced machine learning technology with
  2.9 million captured data points and maximum deviation of 0.018 dB from
  hardware. Features hand-tuned asymmetrical Unique Q design, broad shelving,
  Mid/Side processing on every band, and solo isolation with fixed-gain curve."
details: |-
  1.1.3

  Hand-tuned asymmetrical Unique Q (Bandwidth) design
  Broad shelving for smooth frequency response
  Mid/Side (M/S) processing on every band
  Solo isolation with fixed-gain curve
  Stereo links per band
  Balance control
  Advanced preset management
  Resizable GUI
  2.9 million machine learning data points captured
  Maximum 0.018 dB deviation from hardware

  PACE iLok account required (dongle optional)
