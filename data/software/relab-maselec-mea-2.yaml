description: Maselec MEA-2 Precision Stereo EQ — the only officially endorsed plug-in developed in exclusive collaboration with renowned engineer Leif Mases, bringing the meticulous craftsmanship and unparalleled precision of the iconic hardware.
details: |-
  Developed in exclusive collaboration with renowned engineer Leif Mases, the Maselec MEA-2 Precision Stereo EQ is the only officially endorsed plug-in that brings the meticulous craftsmanship and unparalleled precision of the iconic hardware to your DAW.

  The MEA-2 features hand-tuned asymmetrical Unique Q (Bandwidth) curves and broad shelving across wider frequency ranges. Relab used machine learning and robotics-based emulation, capturing 2.9 million data points from the original hardware with a maximum deviation of just 0.018 dB.

  The MEA-2 plug-in offers something the original hardware never did: Mid/Side Mode on every band. Where many EQ plug-ins lock you into a broad mid/side approach, the MEA-2 lets you fine-tune each band individually, delivering the legendary Maselec curves with the refinement of modern mid/side control.

  The Solo Isolation feature lets you thoroughly explore your mix, pinpointing elusive frequencies and resonances. The solo function boasts a handpicked fixed-gain curve for precise and efficient frequency targeting, and coupled with the EQ's serial flow, you can immediately hear the interactivity between bands.

  Beyond sonic accuracy, the MEA-2 adds modern workflow features including Stereo Links Per Band, Balance Control, Advanced Preset Management, and a Resizable GUI. Authorization is handled via PACE iLok (account required; no hardware dongle needed — supports local computer or iLok V2+ USB key).
specs: |-
  - Hand-tuned asymmetrical Unique Q (Bandwidth) design
  - Broad shelving across wider frequency ranges
  - Mid/Side processing per individual band
  - Solo Isolation with fixed-gain curve
  - Stereo Links Per Band
  - Balance Control
  - Advanced Preset Management
  - Resizable GUI
  - Machine learning emulation — 2.9 million data points captured
  - Maximum deviation: 0.018 dB accuracy
  - macOS: OS X 10.15 or higher, Intel or M1, 2GB RAM
  - Windows: Windows 10 or higher, Core 2 or higher, 2GB RAM
  - Compatible hosts: Logic Pro 10.x+, Pro Tools 11.3.2+, Cubase 9.5+, Nuendo 8+, Ableton Live 9+
  - Authorization: PACE iLok account required (no hardware dongle); local or iLok V2+ USB supported
  - Formats: VST3/AU/AAX (macOS), VST3/AAX (Windows); legacy VST2 support also available
