description: "Dynamics metering plugin that measures PSR (Peak to Short-Term
  Loudness Ratio) and PLR (Peak to Loudness Ratio) to help optimize audio
  dynamics and punch across streaming platforms. Features multiple view modes
  including Classic, Stereo, Mid/Side, and Multiband, with a 90-minute zoomable
  PSR history and platform-specific PLR presets."
details: |-
  PSR (Peak to Short-Term Loudness Ratio) real-time dynamics tracking
  PLR (Peak to Loudness Ratio) overall dynamic range measurement
  Classic, Stereo, Mid/Side, and Multiband view modes
  Peak-Aware display showing what limits dynamics
  90-minute zoomable PSR history
  PSR Overview histogram
  Numeric PSR and PLR values
  Clip indicators
  Platform PLR presets (Spotify, YouTube, Apple Music, TIDAL)
  Dynamic profile guidelines with presets (Balanced, Wide)
  Resizable UI with scalable vector graphics
specs: |-
  - mac: macOS 10.7 or later (64-bit Intel or Apple Silicon)
  - windows: Windows XP SP3 or later (32/64-bit)
