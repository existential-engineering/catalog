description: Dynameter 2 is a dynamics metering plugin that helps optimize audio impact and punch by visualizing density and dynamics in real-time using PSR (Peak to Short-Term Loudness Ratio), rather than focusing solely on loudness targets.
details: |-
  Dynameter 2 is a dynamics metering plugin that measures PSR (Peak to Short-Term Loudness Ratio), a metric designed to reflect the perceived punch and impact of audio rather than just loudness levels. It provides a 90-minute scrollable history timeline of PSR values, giving mixers and mastering engineers a comprehensive view of how dynamics evolve over the course of a track or session.

  The plugin offers multiple view modes including Classic, Stereo, Mid/Side, and Multiband, allowing engineers to analyze dynamics across different signal paths and frequency bands. The Peak-Aware display highlights where dynamics are being limited, helping identify problem areas in a mix or master.

  Dynameter 2 includes built-in platform PLR presets for streaming services such as Spotify, YouTube, Apple Music, and TIDAL, enabling engineers to check how their material will behave against normalization targets on each platform. Dynamic profile guidelines with presets like 'Balanced' and 'Wide' provide context for evaluating mix dynamics.

  The interface features a PSR Overview histogram alongside real-time numeric PSR and PLR (Program Loudness Range) values, plus clip indicators. The UI is fully resizable with scalable vector graphics. Upgrade pricing is available for existing Dynameter v1 users.
specs: |-
  - PSR (Peak to Short-Term Loudness Ratio) metering
  - PLR (Program Loudness Range) display
  - 90-minute zoomable PSR history timeline
  - View modes: Classic, Stereo, Mid/Side, Multiband
  - Peak-Aware dynamics limitation display
  - PSR Overview histogram
  - Streaming platform PLR presets: Spotify, YouTube, Apple Music, TIDAL
  - Dynamic profile presets: Balanced, Wide
  - Clip indicators
  - Resizable UI with scalable vector graphics
  - macOS 10.7 or later (64-bit Intel or Apple Silicon)
  - Windows XP SP3 or later (32/64-bit)
