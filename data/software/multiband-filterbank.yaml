details:
  - The air music tech multiband filterbank is a creative audio filtering plugin that reimagines legendary hardware multiband filters for modern musicians. It offers a unique approach to sound sculpting across three frequency bands, allowing precise manipulation of audio signals.
  - The plugin provides comprehensive sound shaping capabilities with features like multi-frequency crossfade, flexible mod parameters, and an envelope follower for each band. Users can apply pre-drive, adjust filter types, and create complex sonic transformations across low, mid, and high frequency ranges.
  - Designed for versatility, multiband filterbank works across multiple music genres including rock, pop, electronic, r&b, and trap. It enables users to remove specific drum elements, create rhythmic patterns, and add harmonics to lifeless sounds through its intuitive interface and powerful modulation options.
  - The plugin supports multiple plugin formats including VST 2, vst3, AU, and AAX, and is compatible with mpc standalone systems. It requires minimal system resources, running on windows 10/11 and macos 13-15 with just 4gb ram (8gb recommended).
  - Multiband filterbank offers extensive creative possibilities for producers, sound designers, and engineers, providing a powerful tool for adding movement, texture, and unique character to audio tracks through its sophisticated multi-band filtering approach.
