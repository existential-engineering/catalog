specs: |-
  - 3-band filter bank with adjustable crossover frequencies
  - 5 filter types per band: Low Pass, Band Pass, High Pass, Notch, Peak
  - Per-band cutoff, resonance, and pre-drive controls
  - Envelope follower per band with rise, fall, gain, and modulation amount
  - Multi-frequency crossfade control between bands
  - Live spectrum display
  - Solo function per band
  - Compatible with MPC/Force standalone (firmware 2.15.1+)
  - Windows 10+ (64-bit), macOS 13+ (64-bit)
  - 4 GB RAM minimum (8 GB recommended)
details: |-
  Multiband Filterbank is a creative audio filtering plugin that splits the signal into three frequency bands with adjustable crossover points. Each band features five selectable filter types — Low Pass, Band Pass, High Pass, Notch, and Peak — with independent cutoff, resonance, and pre-drive controls for adding harmonic saturation.

  Each band includes a dedicated envelope follower with adjustable rise, fall, gain, and modulation amount parameters, enabling dynamic, input-responsive filter movement. A multi-frequency crossfade control allows smooth transitions between the three bands, while per-band solo buttons and a live spectrum display aid in precise sound shaping.

  The plugin is also compatible with Akai MPC and Force hardware running firmware 2.15.1 or later, making it available both as a desktop plugin and in standalone production environments.
