details: |-
  Inspired by one of the best-known console bus compressors, the acm520x1 offers a wide range of settings from gentle 2:1 compression, often regarded as the essential 'glue' of a cohesive mix, to more obvious punch at higher compression ratios.

  In addition, a switchable side-chain high-pass filter makes it ideal for bass-heavy mixes, without over compression.

  The acm520x1 plug-in emulates all the desirable qualities of a professional analogue console bus compressor, taming dynamics without restricting the natural character of a mix or performance.

  Presented as a virtual 500-series module with a modern stylized user-interface, the acm520x1 provides soft-knee compression at low ratio settings, coupled with a subtle analogue style overdrive for warmth and character at high signal levels.

  The plug-in can be used in mono or stereo configurations, delivering professional console-grade processing, with efficient use of cpu and system resources.
