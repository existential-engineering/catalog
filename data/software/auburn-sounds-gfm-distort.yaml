details: |-
  GFM Distort is a bread-and-butter saturation and distortion plugin with a
  90s-flavoured character, designed to find itself at home on every track. It
  provides straightforward distortion processing suitable for drums, guitar, and
  acid leads.

  The plugin features 16x oversampling to minimize aliasing artifacts, along
  with built-in instability and a lowpass post-filter for vintage character. Its
  digital design embraces a 90s aesthetic while delivering clean, usable
  distortion.

  GFM Distort is a legacy product from Auburn Sounds, available for free but no
  longer supported with updates or technical assistance.
specs: |-
  - 16x oversampling
