description: PSP ConsoleQ is a British console-style equalizer designed to provide an analog EQ experience in both sound and operation. Features four bands (shelving Low and High filters plus peaking Low Mid and High Mid bands), FAT double sampling, 64-bit double precision processing, an optional saturation output stage, and a 30-band bar analyzer with optional spectrum curve display.
details: |-
  PSP ConsoleQ v2 features smoothly adjustable frequency control for all bands with numerical value displays. Four bands: shelving Low and High filters and peaking Low Mid and High Mid filter bands with adjustable gain-following Q values. LF and HF bands can be switched to act as peaking filters. Includes FAT double sampling (auto-engaged below 50 kHz), optional SAT output stage, and a 30-band bar analyzer. Licensing uses iLok License Manager (no hardware dongle), 3 activation locations.
specs: |-
  - Four bands: Low shelf, High shelf, Low Mid peak, High Mid peak
  - Adjustable gain-following Q values
  - LF and HF bands switchable shelf/peak
  - FAT double sampling: auto-enabled below 50 kHz
  - 64-bit double precision processing
  - Optional SAT (SATuration) output stage
  - 30-band bar analyzer with spectrum curve display
  - iLok License Manager required (no dongle); 3 activations
  - Windows: 7-11 (64-bit)
  - macOS: 10.14-15 Sequoia (Intel and Apple Silicon, 64-bit)
