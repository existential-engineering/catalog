description: PSP ConsoleQ is a tracking processor reminiscent of British console equalizers, designed to provide an analog console experience in both sound and operation. It's perfect for whenever an engineer wants to fix or shape audio, or make tracks stand out in a mix, regardless of the audio source.
details: |-
  PSP ConsoleQ is a British console-style equalizer, designed to provide an analog EQ experience in both sound and operation. It's perfect for whenever an engineer wants to fix or shape audio, or make tracks stand out in a mix, regardless of the source.

  PSP ConsoleQ v. 2 now takes the experience even further, with smoothly adjustable frequency control for all bands. To go with this, the user interface has added numerical value displays for precise settings.

  In addition, there's now a new way to look at and interact with PSP ConsoleQ. The PSP Spector PSPEC-31P pop-up module offers a 31-band realtime analyzer with multiple display options, and has a graphical user interface to control multiple EQ settings at once on any band with just one click.

  PSP ConsoleQ is CPU efficient enough to be used at every stage of the creative process, from composition through tracking to final production/mixing/mastering.
specs: |-
  - Four bands of equalization: shelving Low and High bands, plus peaking Low Mid and High Mid bands, with adjustable gain-following Q values
  - Equalization can be applied to either or both input channels
  - LF and HF can be set to act as peaking filters rather than shelves
  - FAT double sampling: FAT is automatically switched on for low (below 50 kHz) sample rates, and off for higher sample rates, ensuring accurate processing independent of the sample rate
  - 64-bit double precision floating point math for ultra-low cumulative errors in the filters
  - Optional second-generation SAT (SATuration) option in the output of each plug-in, protecting against digital clipping and adding a smooth overdriven sound to hard-driven signals
  - SAT algorithm is located after the output level control in the plug-in's internal chain, with its ceiling reference level set to a fraction of a dB below 0 dBFS
  - All actual parameter values like gain, frequency, or Q may differ from displayed values, a typical feature of analog equalizers
  - A 30-band bar analyzer with optional spectrum curve display mode
  - PSP Spector PSPEC-31P pop-up module: 31-band realtime analyzer with multiple display options and graphical control of multiple EQ settings per band
  - Windows: Windows 7 to Windows 11, 64-bit VST / VST3 compatible host, AAX for Pro Tools
  - macOS Intel or macOS Silicon: macOS 10.14 to macOS 15 Sequoia, 64-bit AudioUnit / VST / VST3 compatible host, AAX for Pro Tools
  - Requires a free iLok user ID and the iLok License Manager application, no hardware dongle required
  - License can be activated in 3 separate locations, each either a computer or an iLok dongle (2nd generation or above)
