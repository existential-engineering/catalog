details: |-
  Valhalla FutureVerb is a reverb and echo plugin featuring 8 reverb modes and 12 echo modes with 4 color modes for tonal shaping.

  The 8 reverb modes include Room, Chamber, Plate, Hall, Cathedral, Space, Frozen, and Nonlin, covering everything from small intimate spaces to infinite frozen textures and nonlinear effects.

  The 12 echo modes include Modern, Tape, Digital, Analog, Detune, Reverse, ReverseOctUp, ReverseOctDown, ReverseOctUpDown, Sparkle, Swarm, and LoFi, providing a wide range of delay and echo character options.

  Four color modes (Bright, Neutral, Dark, Studio) allow users to shape the tonal character of the reverb and echo processing to suit different mixing contexts.
specs: |-
  - 8 reverb modes: Room, Chamber, Plate, Hall, Cathedral, Space, Frozen, Nonlin
  - 12 echo modes: Modern, Tape, Digital, Analog, Detune, Reverse, ReverseOctUp, ReverseOctDown, ReverseOctUpDown, Sparkle, Swarm, LoFi
  - 4 color modes: Bright, Neutral, Dark, Studio
  - 64-bit processing
  - Mac: OSX 10.9+, Intel and Apple Silicon (M1-M5) native
  - Windows: 7, 8, 10, 11
