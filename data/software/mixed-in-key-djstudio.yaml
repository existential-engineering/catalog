details: |-
  DJ.Studio is billed as "The Ultimate DAW for DJs": a timeline-based application for creating mashups, DJ mixes, radio shows, video mixes and prepared live sets from a laptop. Mixed In Key positions it for bedroom DJs, producers and performing artists.

  The page describes it as a friendly DJ companion that transforms time-consuming preparation into creative freedom, where the timeline-based editor works like a DAW but thinks like a DJ. Headline capabilities are one-click stem separation for vocal and instrumental isolation, AI-powered beat detection, DAW-style timeline editing that shows the entire mix at a glance, and automation that can be manual or smart.

  Mixed In Key integration is a central selling point: Camelot Wheel inspired harmonic matching and tempo-based ordering, instant access to the Mixed In Key music library, harmonizing a playlist by key matching, BPM or both, and, with a Mixed In Key VIP Code, visibility of energy segments and cue points inside DJ.Studio.

  The advertised workflow is four steps. Import music by connecting to Mixed In Key, rekordbox, Serato, Traktor or VirtualDJ, or by using local files plus Beatport and Beatsource streaming integration. Let the harmonize algorithm analyse BPM, key and energy levels to order the playlist, or arrange manually. Add creative transitions with the timeline editor using stem separation, effects, samples and automation. Then export.

  Export destinations named on the page are MP3/WAV files, direct upload to Mixcloud, animated video export for YouTube, and sending the mix to Ableton Live as a session for further production. Three one-time licence tiers are sold (Pro, Pro + Stems, Ultimate), with a 7-day free trial of DJ.Studio Pro + Stems, and the page claims a community of over 250,000 users.
specs: |-
  - Timeline-based editor with DAW-style precision and DJ workflow
  - One-click stem separation isolating vocals, drums, bass and melodies
  - AI-powered beat detection
  - Advanced automation, manual or automatic
  - Camelot Wheel inspired harmonic matching and tempo-based ordering via Mixed In Key integration
  - Harmonize playlists by key matching, BPM, or both
  - Energy segments and cue points visible with a Mixed In Key VIP Code
  - Library import from Mixed In Key, rekordbox, Serato, Traktor, VirtualDJ, or local files
  - Beatport and Beatsource streaming integration
  - Mix with WAV files (Pro and above)
  - Manual transitions, custom presets and sample lanes (Pro and above)
  - FX Pack with over 30 effects for vocals, buildups and drops (Pro + Stems and above)
  - Animated video export synced to beats for YouTube (Ultimate)
  - Third-party VST3 and AU effect plugin support (Ultimate)
  - Export to MP3/WAV, Mixcloud upload, YouTube video, or Ableton Live session
  - 7-day free trial of DJ.Studio Pro + Stems
