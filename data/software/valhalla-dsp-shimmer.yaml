description: ValhallaShimmer is an algorithmic reverb designed for BIG sounds,
  from concert halls to the Taj Mahal to the Halls of Valhalla.
details: |-
  At its core, ValhallaShimmer is a high-quality reverberator, designed to produce a smooth decay, that is both dense and colorless. All of the sliders have been designed to be tweaked in real time and have a smoothed response to avoid clicks when changing settings or automating the controls. At the same time, the algorithm has been highly optimized, so you get a huge reverb sound without straining your CPU.

  By setting the Shift amount to +12 semitones, and the Feedback to 0.5 or greater, the classic Eno/Lanois shimmer sound is produced. A wide variety of other sounds can be created by the algorithm, ranging from spring-like reverbs to reverse reverbs, to glistening pitch-shifted pads that are usually associated with high-end hardware processors.

  ValhallaShimmer features four reverb modes: Mono (mono-in, stereo-out), Small Stereo, Medium Stereo, and Big Stereo. It also includes five pitch shift modes: Single, Dual, SingleReverse, DualReverse, and Bypass.
specs: |-
  - 4 reverb modes: Mono, Small Stereo, Medium Stereo, Big Stereo
  - 5 pitch shift modes: Single, Dual, SingleReverse, DualReverse, Bypass
  - Feedback, Diffusion, and Size controls
  - Modulation controls
  - Two tone controls with Color Mode selector (Bright/Dark)
  - High Cut control and Pre-delay
  - Real-time tweakable sliders with smoothed response
  - 64-bit only
  - Mac: Intel and Apple Silicon (M1-M5) native
  - Mac: OSX 10.9+
  - Windows: 7, 8, 10, 11
