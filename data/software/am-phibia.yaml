details: |-
  Am-Phibia is a tube amplifier/channel strip that combines an optical
  compressor with a pre and post filter unit.

  As a result of the various different filter circuits, the device can be varied
  to a large extent and used as a vocal pre-amp, tube guitar amplifier or to
  create "warmer" sound characteristics according to the input signal and audio
  style.

  The plug-ins in the analogue modelling suite recognize the number of incoming
  signals and can function automatically in mono to reduce processor strain by
  preventing the sending of another signal for calculation.

  Audio tools based on replicas of classic circuit designs.
specs: |-
  - Optical compressor
  - Pre filter unit
  - Post filter unit
  - Tube amplifier
  - Channel strip
  - Mono processing mode
  - Automatic signal recognition
