description: ICONS brings Fractal Audio's industry-leading technology to an amp
  modeling plugin, with authentic amp sound and feel for modern recording and
  production workflows.
details: |-
  ICONS brings Fractal Audio's amp modeling to the world of plugins and to the desktop as a standalone app. It is built on the same algorithms as the Axe-Fx, and is designed as a series that expands over time rather than as a single title. The first release is The Fullerton Collection, based on American-style amps from Fullerton, California, from the 1950s, 1960s, 1970s and beyond, featuring 36 classic American-style amps including Deluxes, Bassguys, Double-Verbs, Vibrato Verbs, Supers, Princetones and Champlifiers.

  The amp models are fully adjustable virtual analog amps with authentic, interactive controls, so they behave like the originals rather than acting as static samples of someone else's settings. Behind the scenes, detailed component-level modeling recreates the preamp, tone stack, cathode follower, power supply, power amp, phase inverter and amp/speaker interaction, which means that knowing how to dial in the amp is enough to dial in the model.

  Each ICONS volume includes DynaCab selections chosen to complement its amp types. A virtual mic can be positioned on a virtual speaker with the results audible in real time, and the next-gen DynaCab HD captures add higher spatial density for smoother, more accurate mic positioning. User Cab mode loads the player's own impulse responses in popular file formats up to 8k, across two slots that can be mixed, blended and time-aligned. The Cab block also carries a stereo room simulator, a virtual mic preamp, and master high-cut and low-cut filters.

  ICONS includes premium stompbox and studio effects based on the same algorithms as the flagship Axe-Fx, among them spring reverb and tremolo, more than a dozen drive pedals, delay, compressor, graphic EQ and additional reverbs. Fractal Audio is explicit that ICONS is not an Axe-Fx in software: the effect blocks use streamlined types and controls aimed at building complete tones centred on the amp and cab quickly.

  A preset browser with tags and search tools helps locate tones by character, tone and musical genre, or directly by preset name or author. Built-in input calibration and leveling addresses the arbitrary input levels that amp modeling plugins often rely on, and calibration is not required when using the USB audio interface built into any Fractal Audio hardware product. ICONS runs as a plugin in AU, VST3 and AAX formats, and as a standalone macOS or Windows application for performance without a DAW.
specs: |-
  - First release, The Fullerton Collection, features 36 classic American-style amp models
  - Fully interactive virtual analog amp models with authentic, adjustable controls
  - Component-level modeling of preamp, tone stack, cathode follower, power supply, power amp, phase inverter and amp/speaker interaction
  - Next-gen DynaCab HD speaker simulation with real-time virtual mic positioning at higher spatial density
  - DynaCab selections per volume chosen to complement that volume's amp types
  - User Cab mode loads user impulse responses in popular formats up to 8k, with two slots for mixing, blending and time alignment
  - Cab block includes a stereo room simulator, virtual mic preamp, and master high-cut and low-cut filters
  - Stompbox and studio effects based on Axe-Fx algorithms, including spring reverb, tremolo, more than a dozen drive pedals, delay, compressor, graphic EQ, modulation and additional reverbs
  - Preset browser with tagging and search by character, tone, genre, preset name or author
  - Fullerton Complete ships with over 150 ready-to-play presets from Fractal Audio hardware plus community submissions
  - Built-in input calibration and leveling, not required when using the USB audio interface in Fractal Audio hardware
  - Runs as an AU, VST3 or AAX plugin and as a standalone macOS or Windows application
