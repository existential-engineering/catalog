description: With this software bundle you get two world-class handcrafted bass
  guitars, virtualized as MIDI instrument in one plug-in.
details: |-
  With this software bundle you get two world-class handcrafted bass guitars,
  "virtualized" as MIDI instrument in one plug-in. The first instrument is a
  modern 4-string bass and the second instrument is a very unique-looking and
  unique-sounding 8-string bass (just like the 12-string guitars with string
  pairs).

  Handcrafted custom instruments that's what you can expect from bassline,
  germany. The company from krefeld builds nothing but world-class bass guitars
  from finest woods and premium components. We "virtualized" two of their
  instruments and turned it into a vst3/AU plug-in, so you can use it in your
  production.

  Bassline buster cw 4: this 4-string bass features a beautiful black limba top
  wood and a swamp ash body. The neck and fretboard is actually made of maple,
  turned into black stain. And he sounds just as good as it looks.

  Bassline buster std 8: you maybe know 12-string guitars and the special sound
  of it. But how about an octaved bass? Well, here you have it. Instead of using
  the same virtual bass over and over again, why not try out something new?
  Hint: this sound is perfect for epic productions that require just some
  uniqueness.

  The usage of the plug-in is simple, the basics are just like you know it from
  other MIDI instruments. Requires a DAW with vst3 or AU compatibility such as
  cubase, ableton live, reaper, bitwig, presonus studio, fl studio, mixcraft or
  other. This product is not compatible with AAX / pro tools.
specs: |-
  - 4-string bass (bassline buster cw 4)
  - 8-string bass with octave strings (bassline buster std 8)
  - Audio Units (AU) plugin
  - MIDI instrument
  - Lowest tone: c1 (drop c tuning)
  - Highest tone: g4 (24th fret, regular tuning)
  - Humanize function
  - Finger style playing
  - Pick style playing
  - Automatic alternate picking
  - Slapping
  - Tapping
  - Palm mute
  - Slides and bending
  - Hammer-on
  - Pull-off
  - High-resolution samples with lossless compression
  - Unprocessed clean DI
  - Three pre-amped sounds
  - Key switches
  - Requires DAW with VST3 or AU compatibility
  - Not compatible with AAX / Pro Tools
  - Amd or intel multi-core CPU recommended
  - 8 GB RAM recommended
  - 64-bit Windows 7 or higher
  - macOS 10.11 or higher
  - Intel or apple silicon CPU
  - 2 GB free hdd storage
