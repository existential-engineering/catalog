details: |-
  Dials is a detailed digital translation of a unique combination of 1950s electronic music hardware from composer and YouTuber Hainbach's studio. It is made with the rich sound and experimental spirit of early electronic music studios in mind.

  The basis of Dials is a re-purposed German vacuum tube radio broadcast device paired with a heavy-duty American bandpass filter. They form a channel strip like no other. The scientific and radio background of the equipment provides a tone that sets it apart, whether you are processing vocals, drums, or any other instrument. Due to the built-in compressor, it is perfectly suited to lend your voice-over the larger than life feeling of great recordings of the past.

  The preamp is a 1950s/60s German measurement instrument originally used to send a fixed level and frequency to a radio transmitter, adapted by analog specialist Wojcek Czern of Rogalow Audio into a high-quality mic preamp on par with studio legends like the V72 and V76. One side-effect of this massive steel-tubed amplifier is that it compresses the signal pleasantly, and that effect was analyzed and made adjustable so the overtone-rich gain of the preamp is available separately from the compressor.

  The filter section models Allison Labs filters, common in science labs and early electronic music studios. Unlike their German stepped counterparts they could be swept, allowing much finer filtering of frequencies. To today's ears they do not sound precise at all: they sing beautifully as their peaks ripple across the cutoff frequencies, especially noticeable when playing with the resonance, the only new feature added.

  Dials is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP), and on the App Store for iOS and iPadOS (AUv3 and Standalone). Bonus content includes an 808-style drum device Ableton Live project by Jamie Lidell and a Filterbank A+B Live set by Hainbach.
