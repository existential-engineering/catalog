description: Modulated True-Stereo Convolution Reverb bringing your IR captures to life; use Lexicon, AMS, Bricasti and more reverb legends to life.
details: |-
  Reverberate 3 is a dual-engine modulated true-stereo convolution reverb plugin developed by LiquidSonics. It processes captured impulse responses from legendary studio hardware reverbs through the proprietary Fusion-IR technology, enabling creative modulation and editing capabilities that go far beyond traditional static convolution.

  The plugin features independent early/late reverb adjustment, late pre-delay manipulation without phase disruption, and Re-Decay controls that let users scale reverb times from 0.25x to 1.75x the original duration. Split modulation separates pitch and non-pitching modulation for early and late reverb components independently.

  Each reverb engine includes a full effects chain: double-oversampled EQ with LFO modulation, linear-interpolation chorus, stereo delay with modulation, a ducker with sidechain support, Sheen EQ for synthetic high-frequency enhancement, stereo widener, and an ADSHR envelope with shape control.

  Reverberate 3 ships with several Fusion-IR expansion packs including FS-24x, FS-48, FS-91, Bricasti M7 (44.1 kHz and 96 kHz), and FS-1 (44.1 kHz and 96 kHz). It supports WAV, AIFF, and FLAC impulse response files.

  Licensing is handled via iLok License Manager and supports iLok 2/3 hardware dongle, machine activation, or iLok Cloud. A 14-day fully featured trial is available.
specs: |-
  - Dual convolution reverb engines with Fusion-IR technology
  - True-stereo and simulated true-stereo modes
  - Split modulation: separate early/late pitch and non-pitching modulation
  - Re-Decay: scale reverb times 0.25x–1.75x
  - IR format support: WAV, AIFF, FLAC
  - Effects chain per engine: EQ, chorus, stereo delay, ducker, Sheen EQ, stereo widener, ADSHR envelope
  - Zero latency mode or configurable 8192-sample delay
  - Dispersion modeling for plate reverb simulation
  - Synthetic early reflections and tail generation
  - MIDI tempo sync
  - Scalable high-resolution UI
  - 64-bit only; Intel and Apple Silicon native (M1–M4)
  - macOS 10.13+ and Windows 7+ supported
  - iLok License Manager required (dongle, machine, or Cloud)
  - Formats: VST 2.4, VST 3, AU/AUv2, AAX Native
