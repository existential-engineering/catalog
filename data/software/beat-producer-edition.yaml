details: |-
  Addictive drums 2: Beat Producer Edition is a drum kit plugin designed for
  beat makers who want their productions to stand out with professional sound
  quality. It includes all kinds of great, expensive-sounding electronic and
  acoustic drums that give productions depth and polish.

  The plugin comes with great acoustic and electronic sounds, including both
  programmed and live-played beats, and features the full ad2 engine.

  Included content features adpaks (reel machines, session percussion, vintage
  dry), midipaks (reel machines beats, percussion beats, dry beats & songs), and
  kitpiece paks (sonor latino bongos, valter percussion standard box cajon,
  brazilian pandeiro).

  Beat producer edition functions as a VST plugin, an audio units plugin, an AAX
  plugin and a standalone application for both macos and windows.
