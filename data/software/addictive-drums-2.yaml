  - 64-bit VST, VST3, AU, AAX plugin formats
  - Standalone application for Windows and macOS
  - Multi-sampled drums with vast dynamics
  - Built-in studio-grade mixing tools and effects
  - E-drum kit plug & play compatibility
  - MIDI controller support
  - Mix-and-match kit customization with Kitpiece Paks
  - Expandable with ADpaks, MIDIpaks, and Kitpiece Paks
