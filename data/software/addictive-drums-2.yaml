details: |-
  Addictive Drums 2 is the ultimate drum production studio. It runs standalone or as a plug-in in your music production software. Packed with professionally recorded drums, live rhythm performances and high quality built in effects, Addictive Drums is all you need to create world class drum tracks.

  Addictive Drums 2 gives you amazing-sounding drums, meticulously recorded in legendary studios, played by outstanding session drummers. The vast dynamics of multi-sampled drums paired with built-in studio-grade mixing tools grants you unlimited creative control to tailor every detail of your drums and rhythms.

  Addictive Drums 2 quickly provides the sounds and features you need when creativity strikes, in any workflow. It works with all major DAWs including Ableton Live, Cubase, Logic, ProTools, FL Studio, Studio One, and many more.

  The software supports e-drums plug and play, letting you connect your electronic drum kit and play Addictive Drums 2 sounds directly. It also works seamlessly with MIDI controllers for finger drumming and beat making.

  Addictive Drums 2 features expandable content through ADpaks (drum kits recorded in world-class studios), MIDIpaks (beats and grooves performed by professional session drummers), and Kitpiece Paks (individual drum pieces for mix-and-match kit building).
specs: |-
  - macOS 10.13 or later (64-bit)
