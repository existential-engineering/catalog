details: |-
  The Ampknob BDM Bundle is the new standard for classic and modern british rock and metal tones. Inspired by truly iconic amps known for their gold faceplates, this is the quintessential bundle for nailing the most definitive tones in music.

  In the bdm bundle, you will find three distinct plugins, inspired by three legendary amplifiers. Each plugin in the bundle offers a slice of history, channeling iconic tones from the 1970s to the present day.

  Ampknob bdm '75 carries the raw spirit of punk rock from the '90s and early 2000s. It delivers everything from ballsy crunch to crushing, raw distortion. The plugin includes a second channel that recreates the famous jump cable method. Add two matched cabs, a beautiful comfort reverb and you will get the tone you need in seconds.

  Ampknob bdm 800 badboy emerged from the depths of the 80s with military-grade 6550 tubes and a custom 140-watt transformer from finland. Toggle the effects on and you've got a dialed-in lead tone with delay and reverb perfect for shredding your next solo. The bdm 800 badboy is truly the ultimate all-rounder.

  Ampknob bdm 410 jvh offers four channels, two matched cabs, a pedal boost, and reverb. Inspired by the sound of contemporary gold-plated amps, it encompasses the tone of this iconic british company in the 21st century. Offering pristine cleans to buttery leads and everything in between, bdm 410 jvh is your new go-to for modern british guitar tones.
