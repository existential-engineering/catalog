details: |-
  Analog studio rack brought you a modular rack that provides hot-swappable 500
  series style eq's, compressors, gate, exciter and a tube driven pre-amp; the
  perfect all-in-one channel strip. The rack has now been split into its
  individual modules for separate and bundle purchase.

  As - comp limit, inspired by a classic famous british console brings the
  coloured control to your individual tracks.

  The plug-in comes with an array of presets specifically designed for various
  instruments as your starting point. Utilize them in your mixes, tweak, or
  create your own.
