details: |-
  Aurora is an intelligent and rich reverb with adjustable adaptive unmasking
  technology. Aurora dynamically reacts to incoming audio to carve a custom-fit
  space out of the reverb signal, letting instruments and vocals stay focused
  and clear. No more muddy mixes, no long plugin chains, just effortlessly clean
  reverb.

  Adaptive unmasking: aurora dynamically reacts to incoming audio to carve a
  custom-fit space out of the reverb signal, letting your instruments and vocals
  stay focused and clear. No more muddy mixes, no long plugin chains, just
  effortlessly clean reverb.

  World-class sound: continuing the legacy of exponential audio's
  state-of-the-art reverb algorithms, aurora gives a lush depth to your sound,
  glowing with immersive and rich character.

  Intuitive controls: it's quick and easy to dial in both the reverb signal and
  the unmasking effect with aurora's streamlined control set, giving you an
  effortlessly balanced reverb that sits in the mix in seconds.

  Tons of presets: with over 60 professional presets across six different reverb
  types (hall, room, chamber, plate, ambience, cathedral), aurora offers a range
  of adaptive spaces that can fit into any project.
