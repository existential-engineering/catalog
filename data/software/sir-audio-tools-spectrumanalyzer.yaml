description: "State-of-the-art spectrum analyzer plugin with both FFT and
  analog-style bandpass filter modes. Features auxiliary send system for viewing
  multiple tracks simultaneously, sidechain support, peak and RMS metering,
  stereo correlation meter, customizable interface with adjustable colors, and
  spectral smoothing algorithms. Available in free and full versions."
details: |-
  Free version available with limited features. Full version adds up to 32 bands/octave (vs 4), 4 slots (vs 2), and preset saving. Requires Windows 7 or newer, Mac OS 10.9 or newer. 20 MB hard disk space.
specs: |-
  Plugin formats: VST, VST3, AudioUnit, AAX. Analog style bandpass analyzer. FFT analyzer. Internal auxiliary send system. Sidechain support. Peak & RMS meter. Stereo correlation meter. Resizable and scalable interface. Spectral smoothing (average/max). Mid/Side signal detection.
