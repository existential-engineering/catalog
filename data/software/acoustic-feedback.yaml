details: |-
  Acoustic Feedback is a realistic simulation of guitar feedback. After years of
  hard work spent on perfecting every detail of vintage amp room, the developers
  at Softube felt obliged to create what they felt was the missing link between
  a real amp and an amp plug-in.

  The result is a simple and intuitive plug-in which emulates the feedback
  effect which occurs between the guitar and the amplifier. Bundled with a
  special edition of white amp from vintage amp room, acoustic feedback aims to
  rock your socks off.

  Realistic simulation (physical modeling) of guitar feedback. Fully responsive
  to vibratos, bends, slides, tremolos, etc.

  Simple user interface: control amount of feedback with the feedback knob, and
  the sensitivity with a tolerance knob. Compatible with foot controls via MIDI.

  Includes a stripped, but useful, version of the white amp from vintage amp
  room. Due to some careless handling, only the master volume and mic position
  controls remain intact. All other pots have been broken off.
specs: |-
  - Universal 2 binary
  - Physical modeling
  - MIDI foot control compatibility
  - Feedback knob
  - Tolerance knob
  - Master volume control
  - Mic position control
