description: "Faithful recreation of the Valley People dyna-mite VCA dynamics
  processor — a parallel-compression cheat sheet for shaping the envelope of
  drums, available natively and on Synergy Core."
details: |-
  As all things Valley People, the original dyna-mite is one monstrous dynamics processor. It's capable of absurd amounts of gain reduction while maintaining the signal's integrity with minimal distortion and unwanted artifacts.

  The VP Drum-all-nite is the ultimate parallel-compression cheat sheet for shaping the envelope of drums. Its ability to inject pure energy in percussive waveforms is like no other.

  We found one of these well-preserved analog pieces and carefully emulated every component to create the perfect analog sound and digital functionality synergy — a faithful recreation of this ingenious circuit in a digital form.
