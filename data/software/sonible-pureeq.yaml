description: pure:EQ is an AI-powered equalizer plug-in that analyzes a track
  and derives a filter curve to even out its spectral distribution. It keeps the
  control set small, so tone and character can be reshaped in a couple of
  clicks.
details: |-
  pure:EQ uses neural networks to generate a filter curve that balances a track, aiming for an energy distribution that results in a smooth sound. A learning feature and a broad range of input-specific profiles replace static presets, so selecting a profile and clicking is enough to get a result. It is built for creators who want pro-level sound without a complex interface.

  Analysis takes only a few seconds. The plug-in inspects the incoming signal, locates weak spots and derives an EQ curve that corrects spectral deficiencies, from harsh frequencies that need taming to dull parts that need a serious boost.

  Heterogeneous material is handled by a dynamic adaption feature, which lets the intelligent filter update over time and keep up with a signal that changes across the track. Three Style options (warm, neutral and bright) shift the overall tone with a single click, and Range selectors set the lowest and highest frequency limits for processing so sub bass and airy high frequencies can be left untouched.

  Authorization is machine-based or via iLok, and Apple Silicon is supported natively. Mono and stereo signals are supported at sample rates from 44.1 kHz to 192 kHz.
specs: |-
  - Automatic parametrization for high-quality results
  - Intelligent processing with input-specific profiles
  - Balance control, style selector and dynamic adaption
  - Learning feature that derives a corrective filter curve from the incoming signal
  - Three styles: warm, neutral, bright
  - Range selectors for the lowest and highest processed frequencies
  - Plug-in formats (Mac): VST, VST3, AU, AAX
  - Plug-in formats (Windows): VST, VST3, AAX
  - Supported channel formats: mono, stereo
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok
  - Apple Silicon support: native
  - Windows: Windows 10 (64 bit)
  - macOS: 10.13 or later
  - CPU: Intel Core (i5) or Apple Silicon
  - GPU: OpenGL version 3.2 or later
