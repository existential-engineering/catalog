description: The AI powered plug-in pure:EQ offers control over spectral
  distribution in a simple package and transforms a track's tone and character
  in just a couple of clicks.
details: |-
  pure:EQ offers control over spectral distribution in a simple package, transforming your track's tone and character in just a couple of clicks. It is a compact, AI-powered tool that takes care of your track's spectral balance.

  Intelligent profiles instead of static presets: pure:EQ's neural networks are able to generate a filter curve that balances your track, making sure that the energy distribution of your audio material results in a smooth sound. With its unique learning feature and broad range of profiles, getting the best out of your track is just a matter of selecting and clicking. pure:EQ is a straightforward solution designed for creators who appreciate pro-level sound and a simplified control set.

  Spectral balance for a better sound: in only a few seconds, pure:EQ analyzes your audio signal, finds any weak spots and then enhances your audio's tone by deriving an EQ curve that corrects any spectral deficiencies, from harsh frequencies in need of taming to dull parts requiring serious boosting. pure:EQ knows what's necessary for a well-balanced sound and does the job quickly and precisely.

  Efficiency without complex tweaking: even highly heterogeneous audio material is no big deal for pure:EQ. With its dynamic adaption feature, the intelligent filter updates over time, keeping up with any signal that changes throughout your track. pure:EQ also sports three Style options, warm, neutral and bright, enabling you to achieve that desired tone with one simple click. The overall Range selectors determine the lowest and highest frequency limits for processing, leaving any sub bass and airy high frequencies untouched.
