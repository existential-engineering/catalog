details: |-
  Ampvibe is a virtual rotary speaker effect inspired by the cabinets of vintage
  tonewheel organs, adding motion and grit texture to the sounds.

  Speed: sets the rate of the pitch modulation. Lower values produces a relaxed
  swirling. Higher values produces a stronger warbling. Depth: adjusts the depth
  of the pitch modulation. As this control is increased, the motion transforms
  from subtle vibrato to chorus, creating a spinning rotary motion.

  Vibrato/chorus: switch to select between chorus and vibrato modes. Mic
  distance: controls the distance between the mics and the virtual cabinet. Mic
  spread: controls the stereo channel separation. Useful for widening a flat
  sound to produce more depth and color. When turned on, it creates the illusion
  that the speakers are spread farther apart.

  Preamp drive: overdrives the input feeding the rotary speaker effect. From
  fuzzy to harder overdrives, to add grit to organ and guitar tones. Booster:
  controls the amount of overdrive, simulating the tone of an overdriven rotary
  speaker cabinet tube amplifier. When the knob is set fully counterclockwise,
  the overdrive effect is bypassed. Turn up for a more overdriven cab sound.

  Saturator: adjusts the booster incoming signal by increasing from a subtle
  fattening to drastic saturation. Higher gains will yield clipping distortion.
  Blend (dry/wet): sets the balance between the unprocessed (dry) signal and the
  processed (wet) signal that will be blended. Preset manager: 'browser' to load
  and save presets and banks. 24 presets included.
specs: |-
  - Rotary speaker effect
  - Pitch modulation
  - Vibrato/chorus modes
  - Mic distance control
  - Mic spread control
  - Preamp drive
  - Booster
  - Saturator
  - Dry/wet blend
  - Preset manager
  - 24 presets included
