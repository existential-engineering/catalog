description: Clean. Ambient. Soulful. Made for worship. Amperial – worship is a
  guitar amp simulator plugin (vst3/AU) crafted specifically for worship.
details: |-
  Amperial worship is a guitar amp simulator plugin (vst3/AU) crafted specifically for worship, gospel, hillsong-style, and ambient guitar tones. Designed with a focus on clarity, emotion, and spatial atmosphere, this plugin delivers everything from pristine clean textures to expressive drive tones tailored for modern worship music.

  D.I. Channel strip inspired by high-end console preamps, providing pure, transparent tone ideal for ambient layering and shimmer pads. Clean amp modeled after the legendary roland jazz chorus, offering brilliant clarity and signature sparkle. Hi-gain amp based on a dumble-style amplifier, with two switchable modes: clean and drive, for smooth, soulful leads or rich cleans.

  3 cabinet options with unique tonal characteristics. 6 microphone types with flexible positioning for detailed mic blending. Dual ir loader for loading and blending third-party impulse responses.

  Ultra clean delay transparent, clean echoes ideal for ambient builds. Shimmer space reverb lush, spacious reverb with shimmer tails that elevate atmosphere and emotional depth.

  Whether you're leading sunday worship, recording ambient guitar beds, or playing expressive solos, amperial worship equips you with a full tonal palette to serve both your sound and your spirit.
