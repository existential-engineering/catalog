description: The HoRNet VCA is a dynamics toolkit, from volume automation to custom compression
details: |-
  HoRNet VCA is a toolkit for controlling track level. At its simplest it works as a Voltage Controlled Amplifier driven by a control signal on its sidechain input, and from there functionality can be added such as an envelope follower on the control signal, with attack and release from 1ms to 3000ms, or an RMS module.

  The VCA acts only when the control signal is above the set threshold, which ranges from -80dB to 0dB. Above that threshold a positive or negative gain, scalable with a dedicated control, is applied.

  The plugin can be turned into a complete compressor or expander by using its input or its output as the control signal, giving feedback or feedforward compression and expansion. Summed up, VCA is a volume control tool with optional RMS detection and attack and release settings, a feed forward compressor with optional RMS detection and external sidechain, a feedback compressor with the same options, and an expander with optional RMS detection.

  It allows complex automation of signal level, working similarly to AutoGain but in a more general way: think of it as the VCA element in a console or a synth, changing the gain of tracks using any reference signal such as a kick, a synth or a slow moving LFO. Activating the internal reference and setting the reversed gain turns the scale factor into a ratio control for building RMS, feedback, aggressive or relaxed compressors.

  A visual gain display graph updates over time rather than showing an instantaneous gain reading, giving a visual representation of the gain changes applied by the plugin.
specs: |-
  - Internal (input and output) and external reference
  - Positive and negative gain adjustment with gain scaling
  - Absolute or relative gain detection
  - Optional envelope detector with times ranging from 1ms to 3000ms
  - Optional RMS detection
  - Threshold from -80dB to 0dB
  - Graphical gain adjustment display
  - Mac OS X (10.7 or later) and Windows support
  - 64-bit compatibility both on Mac and Windows
  - Audio Units, VST2.4, VST3 and RTAS format
  - No copy protection
