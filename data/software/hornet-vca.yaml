description: "The HoRNet VCA is a dynamics toolkit, from volume automation to
  custom compression"
details: |-
  The dynamics toolkit HoRNet VCA offer a toolkit for controlling the track level, it can work as a simple Voltage Controlled Amplifier using a control signal in it&#8217;s sidechain input. Starting from there you can add functionality like an envelope follower on the control signal, with attack and release ranging from 1ms to 3000ms or an RMS module. The VCA acts only if the control signal is above the set threshold that goes from -80dB to 0dB, above this threshold positive or negative gain, which can be scaled by a specific control, is applied. You can also transform VCA in a complete compressor or expander using its input or its output as control signal for feedback or feedforward compression/expansion. Summing it up VCA is: A volume control tool with optional RMS detection and attack and release settings. A feed forward compressor with optional RMS detection and external sidechain. A feedback compressor with optional RMS detection and external sidechain. An expander with optional RMS
