description: A digital recreation of the classic 1176 FET limiting amplifier,
  with two units in one plug-in for stereo, dual mono, M/S and serial routing.
details: |-
  This iconic limiter has been an industry mainstay since 1967. You've heard it on almost every record ever recorded. It's fast and responsive, with a unique character caused by its FET solid-state circuitry.

  The KA1776 is a precise emulation of that circuit, with all the controls and sound of the hardware, and then Korneff Audio doubled down: two of them sit in one plug-in to give more routing options. Run the KA1776 in stereo, dual mono or M/S, or set it in serial so one unit feeds into the other, giving all sorts of double compression and compression/saturation options.

  The original topology and all of the original controls are emulated, including Input (which sets the threshold), Output, the meter display and the reversed Attack and Release knobs. Ratios run from 4:1 to 20:1, alongside the iconic "British Mode" with all four ratios selected at once for massive compression full of artifacts and character.

  Switching Attack to OFF turns the KA1776 into a pure FET saturator, with no compression, just gnarly tone and noise, and an extra control makes that mode tweakable.

  A comprehensive, modern analyzer tracks compression, signal levels and routing, to help set the controls precisely and speed up training your ears to hear the nuances of the limiter.
