description: A digital recreation of the classic 1176 FET limiting amplifier,
  with two units in one plug-in for stereo, dual mono, M/S and serial routing.
details: |-
  The 1176 FET limiting amplifier was introduced in 1967. It is a fast, responsive limiter whose character comes from its FET solid-state circuitry.

  The KA1776 is an emulation of that circuit with the controls of the hardware, and puts two units in one plug-in for additional routing options. It can run in stereo, dual mono or M/S, or in serial so one unit feeds into the other, for double compression and compression/saturation combinations.

  The original topology and all of the original controls are emulated, including Input, which drives the signal into the fixed threshold, Output, the meter display and the reversed Attack and Release knobs. Ratios run from 4:1 to 20:1, alongside "British Mode" with all four ratios selected at once.

  Switching Attack to OFF bypasses the compression and leaves the FET saturation, and an additional control adjusts that mode.

  An analyzer displays compression, signal levels and routing to assist in setting the controls.
