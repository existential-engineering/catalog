description: The KA1776 Limiting Amplifier is a digital recreation of the 1176
  FET Limiter, Korniffed by Korneff Audio.
details: |-
  KA1776 Limiting Amplifier: Iconic FET Compression, Limiting and Saturation. This iconic limiter has been an industry mainstay since 1967. You've heard it on almost every record ever recorded. It's fast and responsive, with a unique character caused by its FET solid-state circuitry.

  The KA1776 is a precise emulation of that circuit, with all the controls and sound of the hardware. And then Korneff Audio doubled down.

  Korneff Audio put two of them together in one plug-in, to give you even more routing options. Run the KA1776 in stereo, dual mono, and M/S. You can even set it in serial, one unit feeds into the other, giving you all sorts of double compression and compression/saturation options.

  The KA1776 also includes a comprehensive visual display to help you precisely set your controls and speed up training your ears to hear the nuances of this wonderful limiter, and extract full creative control from it.

  Dan Korneff: "I've hand-built over 100 hardware versions of this thing, I love it and use it that much. This software version is true to the original, but we've made it more flexible and user-friendly."
specs: |-
  - All the original functionality: precisely emulated topology and original controls, Input (sets the threshold), Output, the meter display, and the reversed Attack and Release knobs
  - Selectable ratios from 4:1 to 20:1, plus the iconic British Mode with all four ratios selected for massive compression full of artifacts and character
  - Switching Attack to OFF turns the KA1776 into a pure FET saturator, no compression, with an extra control to tweak it
  - Two units in one plug-in: stereo, dual mono, M/S, or serial with one feeding the other
  - A comprehensive, modern analyzer for compression, signal levels and routing
  - Licensing: software-based licensing with no USB or hardware dongles and no special drivers, up to four (4) simultaneous machine activations, internet connection required for activation and for all demos
  - Minimum system: Intel, AMD or Apple Silicon i5 quad core processor, 4GB of RAM, Mac OS X 10.14 or later, Windows 7 and above, screen resolution 1024 x 768 or higher
  - Linux: minimum Ubuntu 18.04 LTS or equivalent (x86-64), recommended Ubuntu 20.04 LTS or later, Debian 11+, Fedora 36+, or any modern distribution using glibc 2.28 or higher
  - Supported plugin formats: Mac 64bit (VST3, AU, AAX), Windows 64bit (VST3, AAX), Linux 64bit (VST3, LV2)
