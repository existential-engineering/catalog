description: TAL-Dub-X is a new edition of the popular original freeware plug-in TAL-Dub with many additional functions and various echo modes. Create unique delay effects with the included resonance filter and saturation stage. Choose between different delay algorithms with different filters and saturation modes. Features LFO modulation for pitch and filter cutoff, a TAL-Dub-1 RAW mode (1:1 port of original code), and LO-FI settings for bit depth and sample rate reduction.
