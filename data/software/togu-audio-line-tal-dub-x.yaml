description: TAL-Dub-X is a new edition of the popular original freeware plug-in TAL-Dub with many additional functions and various echo modes. Create unique delay effects with the included resonance filter and saturation stage. Choose between different delay algorithms with different filters and saturation modes. Features LFO modulation for pitch and filter cutoff, a TAL-Dub-1 RAW mode (1:1 port of original code), and LO-FI settings for bit depth and sample rate reduction.
specs: |-
  - Delay and echo plug-in with several selectable delay algorithms and echo modes
  - Resonance filter with adjustable cutoff and a saturation stage
  - Different filters and saturation modes per delay algorithm
  - TAL-Dub-1 RAW mode, a 1:1 port of the original TAL-Dub code
  - Modulation section: LFO modulates delay line pitch and filter cutoff
  - LFO waveforms: S&H, saw, sine, triangle, pulse and noise
  - Host sync mode with adjustable phase control
  - Ducking mode
  - Ping pong delay mode
  - LO-FI settings for bit depth and sample rate
  - Low cut control
  - Dry and wet volume sliders (replacing the earlier MIX and VOLUME knobs)
  - Preset browser with factory presets, plus undo and redo
  - Colour dialog for custom colour schemes with import and export
  - Bypass button and custom preset path via config file
  - Windows: Windows 10 or higher (64 bit host)
  - macOS: 10.11 or higher (64 bit host), Universal Binary 2 with native Intel and Apple silicon support (M1, M2, M3...)
  - AAX: Pro Tools 10.3.6 or higher (64 bit)
  - Linux: 64 bit, Ubuntu 18 or similar
  - Demo restriction: the plug-in produces a rising white noise sound every minute
