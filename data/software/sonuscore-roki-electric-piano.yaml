description: Enrich your compositions with the vintage sounds of meticulously recorded mechanics, multiple microphone positions and 20 velocities. Capture the analogue warmth of the great 70s with a Kontakt instrument featuring a Glow slider that transforms simple chords into ethereal soundscapes.
details: |-
  RO•KI - Electric Piano brings the analogue warmth of the great 70s to your tracks. The instrument is built from meticulously recorded mechanics, multiple microphone positions and 20 velocities, capturing the character of a vintage electric piano in detail.

  Beyond straight playing, the Glow slider turns simple chords into mysterious, ethereal soundscapes. The instrument's sound melding capabilities let you switch between the raw DI signal and the warmth of a vintage style amp, change attack, release and dynamic range, and add mechanical noises alongside nine finely tuned effect modules.

  To get started, 15 color presets are included and selectable directly from the streamlined user interface. The library ships as a 2.2 GB download and requires a full version of Native Instruments KONTAKT, as the free Kontakt Player runs the instrument in demo mode only.
specs: |-
  - Requires a FULL version of Native Instruments' KONTAKT version 6.6.0 or higher (the free Kontakt Player only runs the instrument in DEMO mode)
  - 2 recorded signals: DI and reamped
  - 20 velocity layers
  - Multiple microphone positions
  - Glow slider for atmospheric sound design
  - Control over Attack, Release, Mechanics, Saturation, Modulation and Ambience
  - Nine finely tuned effect modules
  - 15 color presets
  - Lightweight, streamlined interface
  - 2.2 GB of sample content
  - Mac OS X 10.13 or higher, Intel Core i5
  - Windows 7 or higher, Intel Core i5
  - 4 GB RAM
  - At least 2.2 GB of free hard disc space
  - Available as a download
