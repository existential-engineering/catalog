details: |-
  Synth Stack 6 assembles 36 of Cherry Audio's award-winning virtual instruments
  at an astoundingly affordable price. From deep modular synthesis to vintage
  analog tone, Synth Stack 6 is a synth player's dream come true.

  Included and new for 2025 are the hit virtual instruments KR-55C Drum Machine,
  Yellowjacket, ODC 2800, Crumar Spirit, Trident Mk III, and the all new
  Mercury-8. The collection encompasses 28 emulations of vintage synthesizers,
  3 original synthesizers, 2 legendary drum machines, an electric piano, a
  tonewheel organ, and a massive modular synthesizer platform.

  The bundle includes over 12,000 professionally designed presets across all
  instruments and comes with GPFree, a lite version of Gig Performer 5 for live
  performance hosting.

  There's never been a better time to dive into Cherry Audio's incredible line
  of virtual instruments. Further price reductions are applied if you've already
  purchased one or more of these products, including any previous version of
  Synth Stack.
specs: |-
  - 36 virtual instruments included
  - 28 emulations of vintage synthesizers
  - 3 original synthesizers
  - 2 legendary drum machines
  - Electric piano and tonewheel organ
  - Massive modular synthesizer platform
  - Over 12,000 professionally designed presets
  - Includes GPFree lite version of Gig Performer 5
  - macOS 10.13 or above with native M1 support
  - Windows 7 or above, 64-bit
  - 1.7 GB hard disk space required
  - Internet connection required for activation
