details: |-
  Adam "nolly" getgood stands out as one of the most accomplished and respected
  figures in modern metal. Whether it's multi-instrumental stints in periphery,
  engineering some of the most breathtaking audio productions, or even capturing
  the perfect drum tone, everything nolly does is executed with absolute
  precision and a seemingly obsessive commitment to excellence.

  There are very few things nolly hasn't experimented with in his quest for the
  perfect guitar tone, even teaching himself electronics to re-engineer his
  favorite amplifiers, modifying them to his exact requirements. After countless
  iterations, thousands of impulse-response files auditioned, we have finally
  distilled adam's sonic vision for the perfect guitar sound into a single
  plugin.

  Four state-of-the-art tube amplifier models of nolly's own modified amplifiers
  are at the core of this plugin. Perfectly captured for an uncannily natural
  feel, covering the vast tonal range the modern guitarist or producer requires
  in its entirety: the result is a crystal-clear clean, a beautifully rich
  crunch, a massive sounding rhythm and a powerful and defined lead.

  This section features a rich collection of effects placed before the amplifier
  section. Two different overdrives/booster pedals, in addition to a solid-state
  compressor, and even a delay provide enough flexibility and potential for fine
  tone sculpting and experimenting. Ideal for detailed spectrum adjustment, the
  onboard 9-band graphic equalizer allows for total control over frequency
  response. Multi-dimensional reverb and a dreamy delay pedal provide all the
  elements required for lush ambient sounds and adding the perfect amount of
  depth for leads.

  Boasting 640 impulse response elements painstakingly captured by nolly using
  his favorite four microphones; the virtual speaker section is this plugin's
  secret weapon. This unique control allows you to use each head with its
  matched cabinet, or experiment by interchanging them. The four amplifiers,
  combined with the 640 irs, provide a virtually endless amount of combinations.
  The standalone feature in archetype: nolly allows you to quickly install, plug
  and play this versatile plugin suite! Standalone is perfect for practice on
  the go and live use.
specs: |-
