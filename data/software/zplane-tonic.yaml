description: AI-powered key detection and music theory plugin to find the scales and chords that work with your music.
details: |-
  TONIC is an AI-powered key detection and music theory plugin designed to identify the scales and chords that work with your music. It performs real-time key and scale detection on audio recordings, suggesting up to three possible keys for analysis.

  The plugin features a fold-out keyboard view that allows users to explore compatible notes and chords based on the detected key. It supports all 24 keys — 12 major and 12 minor — derived from the Circle of Fifths.

  TONIC includes reference tuning detection, making it capable of handling non-A440 recordings. It also offers an offline mode for pre-analysis of audio files, and supports both mono and stereo operation.
specs: |-
  - Supports 24 keys (12 major, 12 minor) from the Circle of Fifths
  - Real-time key and scale detection
  - Suggests up to 3 possible keys per analysis
  - Fold-out keyboard view for compatible notes and chords
  - Reference tuning detection (non-A440 compatible)
  - Offline mode for pre-analysis
  - Mono and stereo operation
  - macOS 13 or later, 64-bit Intel & Apple Silicon
  - Windows 10 & 11, 64-bit
