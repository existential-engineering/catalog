description: Find the key of your loops, remixes, and song ideas with TONIC. Use TONIC, the AI-powered key detection and music theory plugin to find the scales and chords that work with your music.
details: |-
  Find the key of your loops, remixes, and song ideas with TONIC. Use TONIC, the AI-powered key detection and music theory plugin to find the scales and chords that work with your music.

  Put TONIC on any audio track and hit play in your DAW. TONIC will analyze the sound in real time and present you with up to three suggested keys. Fold out the keys panel and try out notes and chords for the suggested keys to find the perfect fit.

  Add bass, melody or harmony to your tracks with ease when knowing the key, scale and chords that work well with your recordings and samples.

  TONIC is a key-detection plugin rather than a scale-detection plugin: it matches the music against the 24 keys of equal-temperament music, 12 major and 12 minor, and for the key you select it shows the pitches of the corresponding scale and the chord triads that fit within it.
specs: |-
  - Detect the key and scale of any audio recording or file
  - Explore compatible notes and chords using the fold-out keyboard view
  - Reference tuning detection: able to detect recordings that deviate from A440
  - Offline mode: detect the key and scale of an audio file before loading into a sampler
  - Up to three suggested keys presented per analysis
  - Mono and stereo operation
  - Available in VST3, AU and AAX plugin formats
  - Native compatibility with both Intel and Apple Silicon Macs
  - Windows 10 & 11, 64-bit
  - macOS 13 or later, 64-bit Intel & Apple Silicon
