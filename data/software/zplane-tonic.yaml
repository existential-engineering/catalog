details: |-
  Key and scale detection plugin with real-time and offline analysis modes. Features fold-out keyboard interface for exploring compatible notes and chords. Includes reference tuning detection to identify recordings that deviate from standard A440 tuning. Supports mono and stereo operation.
specs: |-
  Windows 10 & 11 (64-bit). macOS 13 or later (64-bit Intel & Apple Silicon). Mono and stereo operation.
