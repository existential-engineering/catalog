description: An extremely authentically modelled 303 bassline emulator with
  built-in sequencer, a true studio classic.
details: |-
  The legendary silver box which is hallmark in electronic music has been recreated in AudioRealism Bass Line 2 (ABL2). Analog modeling techniques have been employed to create a DSP-algorithm that accurately emulates every aspect of the original TB-303, from growling basses to hollow middles and beeping highs with metal rattling accents.

  Patterns are composed in a fashion similar to the original using the integrated step sequencer with easy to use manipulation functions such as transpose and randomization. The sequencer offers per pattern shuffle in both 4/4 and triplet modes, sample accurate sync to VST and AU hosts, and two MIDI modes (Pattern or Note).

  Beyond the core emulation the plug-in adds an integrated distortion unit, a high pass filter (low cut), full MIDI CC control with a learning function, Rebirth pattern import, MIDI pattern export, and MIDI output in the stand-alone and VST versions. Two skins are included, yellow and blue/gray.

  The current release, distributed as ABL2x-Redux, is version 2.9.1.0. The macOS build is Intel plus Apple Silicon native and ships as Audio Unit, VST2 and VST3; the Windows build requires Windows 10 or higher and ships as 64-bit VST2 and VST3. Legacy installers remain available for older systems: macOS Intel only 32/64-bit (Audio Unit, VST2) and Windows 7 or higher (VST2 64-bit).

  Owners of ABL2 can upgrade to AudioRealism Bass Line 3 at a reduced price through the ABL3 upgrade request form.
specs: |-
  - Accurate TB-303 emulation
  - Internal step sequencer with per pattern shuffle
  - Full MIDI CC control with learning function
  - Integrated distortion unit
