details: |-
  A psaltered zither is a library consisting of six different zithers, psaltery, and non fretted folk instruments: zither (european folk zither), psaltery (2 octave version), zithereens (features a more dulcimer type sound), african lute (a six string lute, with a metal sound board), kachapi (small two string sumatran guitar), and can bau (modwheel's take on a vietnamese dan bau).

  Each instrument has been plucked, picked, bowed, struck, rattled and extended in whatever ways the modwheel team could come up with, giving each instrument up to six articulations. Each articulation has access to pan, envelope and transpose (up or down one octave) controls. This allows for layering and combining the different sounds giving huge tonal possibilities.

  A psaltered zither features modwheel's newest development 'scatter box' which contains four sections of handcrafted irs (sync'd non sync, reversed and atmospheric). The irs have been specially created to compliment the a psaltered zither. The sync'd section allows for very characterful delay type effects, that will sync to the tempo of your DAW.

  The atmos section features longer events and some tonal elements that work well with pads and longer atmospheric articulations. The non sync and reversed sections give even more access to sound manipulating possibilities.

  A psaltered zither also comes with 127 snapshots of presets, pads, atmospheric, and arpeggiated rhythms. Each patch features access to a full range of effects, via the fx tab including distortion, rotary, tremolo, phaser, chorus, delay and low pass filter.
specs: |-
  - Six articulations per instrument
  - Pan control
  - Envelope control
  - Transpose control (up or down one octave)
  - Cpu usage optimization
  - Scatter box with handcrafted irs
  - Sync'd delay effects
  - DAW tempo sync
  - Atmospheric ir section
  - Non-sync ir section
  - Reversed ir section
  - 127 preset snapshots
  - Distortion effect
  - Rotary effect
  - Tremolo effect
  - Phaser effect
  - Chorus effect
  - Delay effect
  - Low pass filter
  - Arpeggiator controls
