description: A faithful emulation of the silver-face revision of the UREI LA-4 opto leveler (1977–1989 era). The original circuit was rebuilt on stripboard for modeling, replacing original opto-cells with suitable Vactrols, and every part of the circuit — receiver stage, side-chain and Vactrol LED driver circuit, the Vactrol itself, push-pull driver stage, and output transformer — was accurately modeled. Provides unintrusive to extreme program-dependent and musical opto compression with a switchable ratio option.
details: |-
  Emulates the UREI LA-4 opto leveler (silver-face revision, 1977–1989) — the op-amp-based successor to the classic late-1960s LA-3A. The entire original circuit was rebuilt on stripboard for accurate modeling; original opto-cells replaced with Vactrols for modern construction. Program-dependent optical compression from unintrusive glue to extreme limiting. Switchable compression ratio. Fuse Audio Labs describes it obliquely as 'the op-amp based successor of the classic late 60s opto leveler' — multiple independent reviewers confirm UREI LA-4 identity.
specs: |-
  macOS 10.9+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+ (32-bit and 64-bit), 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX. Copy protection: serial number.
