details: |-
  BattleComp Vintage is a punchy yet smooth compressor with an EQ and a
  high-pass filter on its internal sidechain and tube emulation + soft-clipping
  circuit in the output stage to keep peaks under control, all in one VST
  plug-in.

  The high-pass filter on the enveloper follower makes it easy to avoid pumping
  effects when there's a lot of bass - something many compressors struggle with.

  This compressor is suitable for both master signal compression and
  per-instrument compression.
specs: |-
  - Compressor/limiter
  - EQ
  - High-pass filter on internal sidechain
  - Tube emulation
  - Soft-clipping circuit
  - Envelope follower
