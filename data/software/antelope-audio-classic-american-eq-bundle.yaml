description: "Bundle emulation collection of the classic American EQ series from
  the 60's. It features the Antelope Audio VEQ-56, VEQ-55A and VEQ-55B — three
  complementary equalizers designed to work together synergistically and run in
  real time on Synergy Core interfaces."
details: |-
  True

  Synergy Core Effects Bundle

  With the new release of VEQ-56, Antelope Audio's emulation collection of the classic American EQ series from the 60's is complete. The Classic American EQ Bundle gives you three effects that work best in synergy.

  {'name': 'VEQ-56', 'description': 'Graphic equalizer with all the EQ bands needed to put the emphasis on the right frequency during a live tracking or mixing session. Known for high headroom, consistency and ease of use.'}

  {'name': 'VEQ-55A', 'description': 'Three-band EQ designed to add desired colour and emphasize tiny mix details, delivering edge and energy to any instrument tracked live.'}

  {'name': 'VEQ-55B', 'description': 'Four-band EQ with up to 12 dB of boost or cut. High and low bands switch between bell curve or shelving behaviour. Musicality owes in part to proportional Q behaviour per band — from a gently sloping Q at subtle boost/cut levels to a more aggressive slope at higher levels.'}

  Real-time on Synergy Core interface

  Antelope Audio hardware modeling
specs: |-
  - Three EQ emulations of classic 1960s American equalizers (VEQ-56, VEQ-55A, VEQ-55B)
  - Runs in real time on Synergy Core interfaces
  - Graphic and parametric equalizer options
  - High headroom design
  - Up to 12 dB of boost or cut (VEQ-55B)
  - Switchable bell curve or shelving behaviour on high and low bands (VEQ-55B)
  - Proportional Q behaviour per band
