details: >-
  1989verb is an homage to late '80s reverb tones. Warm plates, bright, dark,
  long, short, fast gates, slow gates, reverse reverbs, regens, tap delays,
  flangers, blooms, stereo wideners, you name it, it's there.


  Based on an 1989 digital reverb unit, the 1989verb not only features the
  characteristics of the original unit but it also features a hipass and lopass
  to enhance the experience.


  A simple interface allows you to dial tones quickly. You can choose the patch
  from the dropdown menu or just simply keep clicking the arrows until you reach
  that golden tone.


  Whether your drums need more weight, synths need more air & excitement, vocals
  need that warm space to dwell in; 1989verb is a perfect pair for any retro
  fan.


  Works well with modern production as well.
