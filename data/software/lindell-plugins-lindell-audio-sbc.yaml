description: "Faithful emulation of a classic American analog stereo buss VCA
  compressor (API 2500). Features SMASH hyper-compression mode, sidechain filter
  circuit, feedforward and feedback operation modes, and variable stereo link
  control. Delivers transparent yet assertive compression for mix bus, drums,
  and vocals."
details: |-
  Stereo buss compression with VCA topology
  SMASH hyper-compression mode for aggressive sound
  Sidechain filter circuit with low cut and high boost
  Feedforward and feedback operation modes
  Variable stereo link control
  Multiple knee options
  Built-in filters for tone customization
