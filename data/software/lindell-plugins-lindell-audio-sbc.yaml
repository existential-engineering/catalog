description: Faithful emulation of a classic American analog stereo buss VCA
  compressor (API 2500). Features SMASH hyper-compression mode, sidechain filter
  circuit, feedforward and feedback operation modes, and variable stereo link
  control. Delivers transparent yet assertive compression for mix bus, drums,
  and vocals.
details: |-
  A faithful emulation of the classic analog buss compressor, with added features such as SMASH hyper-compression and THD. The initial release consists of a thorough emulation of the wide and punchy stereo version.

  The original American hardware compressor is one of the most popular stereo buss compressors of all time, and for a good reason. Transparent yet assertive, smooth yet punchy, it is a perennial favorite on drums, mix bus, vocals, and any source that demands aggressive compression without compromises. The SBC plugin from Lindell Audio emulates this legendary classic with masterful precision and clarity, adding new features that can only be found in the digital domain.

  This style of VCA compressor is easily one of the top two choices for analog mix buss compression in modern music production, right alongside the very best buss compressors from SSL. Like the original hardware, Lindell's SBC (Stereo Buss Compressor) plugin offers tremendous tone and flexibility, and includes a series of carefully curated filters and knee options that make it a good choice for adding that last bit of extra glue and polish to the entire mix.

  The SBC shines on more than just mix buss material. This compressor is a staple on live drum busses, particularly in rock and metal genres, where it provides a tight, punchy, warm and in-your-face sound. The added SMASH feature gives extra crush on snare drum and room tracks, and the compressor also suits heavy but clean compression on vocals and more.

  The original compressors included a couple of seemingly subtle features that played an outsized role in their success. A special sidechain filter circuit applies a low cut and a high boost to the compressor's detector circuit, ensuring it responds to the most important parts of the mix. A feedforward and feedback option allow for more modern or vintage style operation, while a variable stereo link control lets mixers decide exactly how much the left and right channels should interact with each other.
specs: |-
  - Inspired by the legendary API 2500 compressor
  - Unique filter section provides the option of low cut and high boost for precisely targeted compression
  - Variable link between left and right channels
  - Select older feed back or more modern feed forward compression
  - Added SMASH option for even more aggressive compression
  - Selectable ratio, attack and release times
  - Soft, medium or hard knee for gentler or sharper compression tones
  - Auto and manual gain make up
  - Supported plugin formats: AAX Native, AU, VST2, VST3
  - Supported operating systems: macOS 26 down to macOS 13, Windows 11 down to Windows 10
  - Mac: Intel or Apple Silicon
  - PC: x64-compatible CPU
  - Display resolution: 1440 x 900px or 1280 x 960px or higher
  - Memory: 2 GB RAM
