details: |-
  Afro Keyz Lite is a synth VST (mac, Windows) designed for making great african
  beats: dancehall, r&b, reggaeton, lo-fi, afrobeats and more.

  Inspired by the best of today's african diaspora hit songs, this synth VST has
  everything you need to get you inspired and quickly produce high-quality
  beats.

  Features include 6 instrument presets, available for mac & windows
  (32-/64-bits), and compatibility with all daws.

  Fx and controls include reverb, adsr, lfo controls with rate and depth, glide,
  pitch, filter high-low, and pan.
specs: |-
  - 32-bit and 64-bit support
  - 6 instrument presets
  - Reverb
  - ADSR
  - LFO controls with rate and depth
  - Glide
  - Pitch
  - Filter high-low
  - Pan
  - Available for all DAWs
