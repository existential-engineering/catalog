description: lo•ki is the perfect virtual piano to round out any composer's piano collection. Its soulful intimacy reaches inside and touches the heart. A virtual piano never felt better.
details: |-
  LO-KI is a sampled felt piano built for soft and intimate writing. Felt pianos are made by adding felt between the hammers and the strings, which produces the more delicate touch this library is recorded around, and the instrument is pitched as a complement to a composer's existing piano collection rather than a replacement for a full grand.

  The dedicated Glow slider dials in ambiance and lets simple chords evolve into larger worlds of sound. Beyond it the interface carries knobs for attack, release and dynamic range, plus tape, ambiance and mechanics, so the mechanical noise of the action can be set to taste.

  The piano was recorded with 5 round robins, 5 velocity layers and 3 different microphone positions, and 9 ambiance presets are supplied as starting points. The library totals 5.7 GB and runs in the full version of Native Instruments Kontakt behind a lightweight, streamlined interface.
specs: |-
  - 5 velocity layers
  - 5 round robins
  - 3 microphone positions
  - Glow slider for atmospheric soundscapes
  - Attack, Release, Dynamic Range, Mechanics, Tape and Ambience controls
  - 9 color presets
  - Lightweight, streamlined interface
  - 5.7 GB sample library
  - Requires the FULL version of Native Instruments KONTAKT 5.8.1 or higher (the free KONTAKT PLAYER only runs the instrument in demo mode)
  - Mac OS X 10.8 or higher, Intel Core 2 Duo
  - Windows 7 or higher, Intel Core 2 Duo or AMD Athlon 64 X2
  - 4 GB RAM
  - At least 2.9 GB of free hard disk space
  - Available as a download only
