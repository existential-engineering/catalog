details: |-
  Biverb is a cutting-edge dual reverb plugin designed to elevate your mixes and
  bring depth to your soundscapes. With two independent reverb units packed into
  one plugin, Biverb offers unparalleled flexibility and creative control,
  making it the ultimate tool for any producer or sound designer.

  Biverb boasts two independent reverb units, each offering a wide range of
  meticulously crafted algorithms, including spring, room, plate, chamber, hall,
  and shimmer. This allows you to blend and layer different reverb textures to
  achieve complex and evolving soundscapes.

  The unique power behind biverb is in the way they split the signals, which can
  then be processed separately or in different combinations. The signal is
  distributed to the two reverb units based on a crossover, which can be set to
  frequency, volume, stereo, or mid/side. This gives you precise control over
  how the reverb interacts with different elements of your mix.

  Each reverb also has its own modulation section, which can make the sound even
  more enjoyable. Both reverbs also have their independent duckers. The ducking
  function is designed to help the clean signal push through and not lose punch
  and attack. When used, it automatically lowers the wet signal level whenever a
  new dry signal comes to the plugin input.

  The plugin provides the maximum audio quality you can get. It uses internal
  64-bit audio processing and can handle any sampling rate. 192 khz or even
  higher. No ilok, no dongle, or internet access is required for activation. Our
  software uses license files to activate your software. You can freely use the
  purchased software on all your computers as long as you are the user.
