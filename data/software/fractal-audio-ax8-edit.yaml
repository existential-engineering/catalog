description: AX8-Edit is a free software editor and librarian for the AX8 Amp
  Modeler and Multi-Fx Pedalboard, available for Mac and Windows.
details: |-
  Unleash your creativity with AX8-Edit, a free software editor/librarian for the AX8 Amp Modeler + Multi-Fx Pedalboard.

  The newly-designed intuitive interface comes in Mac and Windows versions and requires the AX8. You can create or edit sounds right on your AX8 and edit every sound parameter, including modifiers.

  Import and Export files to share with others, Copy and Paste effect blocks between presets, and import Blocks exported from Axe-Edit. Copy, Paste and Swap Scenes within a preset, and save snapshots (undo points) while you edit.

  An on-screen tuner and tempo display, plus on-screen modifier graphs and filter curves, round out the feature set.

  Version 1.10.1 is dated July 21, 2026. The Mac build is Universal and requires MacOS version 10.13 or newer, with a legacy 32-bit build (Version 1.8.7) still offered for OSX 10.6.8 or newer. The Windows build runs on Win 10, 8.x, 7.x or Vista (x86 or x64). Both require AX8 firmware version 6.00 or greater.
