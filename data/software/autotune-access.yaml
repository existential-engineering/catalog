details: |-
  Auto-tune access is the easiest and most affordable way to start using
  auto-tune. It delivers the core auto-tune features with a simple and intuitive
  interface. Its light CPU footprint and professional quality processing also
  make it a convenient option for more advanced users working with larger
  projects.

  Three-position retune speed and humanize knobs allow for a variety of tuning
  applications, from subtle and natural-sounding pitch correction to the most
  extreme auto-tune effect.

  Low latency processing lets you perform through auto-tune access in real time
  on stage or in the studio, without worrying about distracting delay.

  Compatibility with auto-key (sold separately) means never having to worry
  about finding the key of your music before tuning. Auto-key detects the key
  and scale and sends that information to auto-tune access with a single click.

  Auto-tune access now includes a 1 year subscription to auto-tune essentials.
