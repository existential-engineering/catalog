description: DeeFat is a VST2, VST3, AU, and AAX auto compressor plug-in that
  uses a single slider to achieve full, fat-sounding compression. It is designed
  for simplicity and speed, making it suitable for live performance use.
details: |-
  DeeFat is an auto compressor plug-in developed by Dotec-Audio that distills compression down to a single control. The core concept is that one slider governs the entire compression process to produce what the developer describes as "FAT sounds" — a full, enhanced audio character without requiring manual adjustment of attack, release, ratio, or threshold parameters.

  The plug-in is designed to run efficiently and respond gracefully under load, making it practical for live performance situations where low latency and reliable processing are priorities. Its simplified interface removes the need for compression expertise, allowing users to apply effective dynamics processing quickly.

  Version 2.5.0, released in November 2017, added a BASS ENHANCER button that lets users adjust the level of low-frequency enhancement applied alongside the compression. This provides a secondary shaping tool while keeping the overall interface minimal.

  DeeFat supports Apple Silicon natively across all formats (VST, VST3, AU, and AAX on Mac). The Windows build supports 64-bit DAW hosts, and the Mac build requires macOS 10.12 or later. A demo version is available that introduces one second of silence every 30 seconds; a serial key is required to activate the full version.

  The plug-in has been tested with a wide range of DAWs including Ableton Live, Cubase, Logic Pro X, Pro Tools, Studio One, FL Studio, Reason, GarageBand, Audacity, Bitwig Studio, and OBS Studio.
