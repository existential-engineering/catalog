details: |-
  ERA-D from Accusonus is the first restoration plugin that simultaneously
  removes noise and reverberation. ERA-D is based on an advanced technology and
  a simple and straightforward user interface that manages noise and reverb
  problems faster and more effectively than any currently available workflow.

  Era-d's patented technology (us 9,060,052) is also the first to analyze
  information from multiple microphones; when more than one microphone is
  available, the era-d explores the multichannel information to better suppress
  reverb and/or noise.

  Era-d features a flexible signal-processing engine that allows for dramatic
  improvement of sound quality and saves recordings that would have otherwise
  been unsalvageable. And all of this comes with a slick, innovative interface
  that allows you to quickly achieve astonishing results.

  De-noise and de-reverberation knobs function in single or dual mode. Four
  modes of operation: de-noise (signal passes through the de-noise engine only),
  de-reverb (signal passes through the de-reverberation engine only), cascade
  (signal passes through the de-noise and then the de-reverberation engines),
  and parallel (signal passes through the de-noise and de-reverberation engines
  simultaneously). When parallel mode is selected, a fader appears to set the
  balance between noise and reverb suppression.

  Advanced controls for de-noise include a noise time constant, which affects
  the speed at which the algorithm adapts to noise changes, a processing time
  constant, which affects the general adaptation speed of the noise suppression
  engine in dual mode, and three flavors of noise reduction: a, b and c.
  Separate reverb time constant controls for low and high frequencies affect the
  speed at which the algorithm adapts to reverb changes.
specs: |-
  - VST plugin (32/64-bit)
