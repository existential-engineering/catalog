  - Multichannel analysis
  - Patented technology (us 9,060,052)
  - Four modes of operation (de-noise, de-reverb, cascade, parallel)
  - Dual mode processing
  - Noise time constant control
  - Processing time constant control
  - Three noise reduction flavors (a, b, c)
  - Separate reverb time constant controls for low and high frequencies
  - Advanced artifact control
  - Hi-res graphical display
  - Four adjustable frequency bands
  - Link button for frequency bands
  - In/out/diff monitoring buttons
  - St/l/r channel monitoring buttons
  - Flexible signal-processing engine
