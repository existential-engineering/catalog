details: |-
  Punch in/out buttons for ch-2 & 3. Dual bpm counters w/ tap tempo. Cue section
  with selectable cue inputs and crossfader between cue and program monitoring.

  Aux send/return. Master, booth, & record outs. Switchable ch1/2/3 & l/r out
  peakmeters.

  Sampler section with 9 sample slots, forward/reverse play, single shot/loop,
  overwrite/overdub record modes, pitch, volume, & pan control.

  All settings are automatable with MIDI cc.
