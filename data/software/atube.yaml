description: aTube processes a signal like analog valve hardware. This enables
  you to achieve a valve warming effect in your digital audio workstation.
details: |-
  Atube can be applied to a complete mix or to individual tracks and is
  especially good for vocal tracks.

  You have several parameters at your disposal that allow you to control the
  level of input gain, the level and the color of the warming effect and an
  on/off button for the output soft clip limiter.
specs: |-
  - Valve warming effect
  - Input gain control
  - Output soft clip limiter
  - Mix and individual track processing
