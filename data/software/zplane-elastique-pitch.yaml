description: ELASTIQUE PITCH Version 2.5 delivers stunningly clear, real-time pitch and formant shifting for any production need, from precise frame-rate conversion to creative sonic experimentation.
details: |-
  elastique PITCH is a real-time pitch and formant shifting plugin powered by zplane's ELASTIQUEPRO engine, delivering ultra-transparent pitch manipulation across all major DAW formats. The plugin supports independent pitch and formant shifting across a ±1 octave range, preserving phase coherence for stereo and transient information.

  Version 2.5 introduced a completely redesigned and resizable user interface, expanded multi-channel support up to 16 simultaneous channels, and added support for immersive audio configurations including 7.1.2, 7.1.4, 9.1.4, and 9.2.4 surround formats.

  Creative features include Pitch Delay, Grain Freeze, and infiniStretch for experimental sound design textures. MIDI control enables real-time pitch performance with activity and bend indication, making it suitable for live applications and creative studio work.

  VST2 format support was discontinued with version 2.5. The plugin now supports VST3, AU, and AAX formats on macOS 13+ (Intel and Apple Silicon) and Windows 10/11 (64-bit).
specs: |-
  - Independent pitch and formant shifting of polyphonic or monophonic material by up to +/- 1 octave
  - Pitch Delay and Grain Freeze for pitch and formant-shifted repeats or infinite glitch effects
  - MIDI control of transposition in real-time, with pitch bend
  - High-quality pitch shifting for single instruments, entire busses or complex mixes
  - Complete phase stability, preserving stereo and transient information
  - Multi-channel support for up to 16 channels simultaneously
  - Audio format: 1-16 channels (I/O), 44.1-192kHz sample rate
  - Compatible with 7.1.2, 7.1.4, 9.1.4 and 9.2.4 configurations
  - Plugin format: AAX, AU, VST3
  - Parameter ranges: Pitch +/- 12 semitones = 50-200%; Timbre +/- 12 semitones = 50-200%
  - Plugin latency: 163ms @ 44.1kHz, 150ms @ 48kHz/96kHz
  - Minimum system CPU: 2GHz
  - Windows 10 and 11, 64bit
  - macOS 13 or later, 64bit Intel and Silicon
