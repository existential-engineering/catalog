details: |-
  Real-time pitch and formant shifting plugin. Supports 1-16 channels I/O, 44.1-192kHz sample rates, surround configurations (7.1.2, 7.1.4, 9.1.4, 9.2.4). Pitch range +/- 12 semitones (50-200%). Formant/Timbre range +/- 12 semitones (50-200%). Latency: 163ms @ 44.1kHz, 150ms @ 48kHz/96kHz.
specs: |-
  Minimum CPU: 2GHz. Windows 10 & 11 (64-bit). macOS 13 or later (64-bit Intel & Apple Silicon). 1-16 channels I/O. 44.1-192kHz sample rate. Latency: 163ms @ 44.1kHz, 150ms @ 48kHz/96kHz.
