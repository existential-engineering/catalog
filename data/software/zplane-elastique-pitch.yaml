description: Ultra-transparent real-time pitch shifting for all platforms, powered by the latest ELASTIQUEPRO engine. Delivers stunningly clear, real-time pitch and formant shifting for production needs ranging from creative sound design to technical audio conversion.
details: |-
  elastique PITCH is a real-time pitch and formant shifting plugin powered by zplane's ELASTIQUEPRO engine, delivering ultra-transparent pitch manipulation across all major DAW formats. The plugin supports independent pitch and formant shifting across a ±1 octave range, preserving phase coherence for stereo and transient information.

  Version 2.5 introduced a completely redesigned and resizable user interface, expanded multi-channel support up to 16 simultaneous channels, and added support for immersive audio configurations including 7.1.2, 7.1.4, 9.1.4, and 9.2.4 surround formats.

  Creative features include Pitch Delay, Grain Freeze, and infiniStretch for experimental sound design textures. MIDI control enables real-time pitch performance with activity and bend indication, making it suitable for live applications and creative studio work.

  VST2 format support was discontinued with version 2.5. The plugin now supports VST3, AU, and AAX formats on macOS 13+ (Intel and Apple Silicon) and Windows 10/11 (64-bit).
specs: |-
  - Pitch range: ±12 semitones (50–200%)
  - Formant (Timbre) range: ±12 semitones (50–200%)
  - Multi-channel support: up to 16 channels simultaneously
  - Surround configurations: 7.1.2, 7.1.4, 9.1.4, 9.2.4
  - Sample rate support: 44.1–192 kHz
  - Latency: 163 ms @ 44.1 kHz; 150 ms @ 48–96 kHz
  - Minimum CPU: 2 GHz
  - macOS 13+ (64-bit, Intel & Apple Silicon)
  - Windows 10 & 11 (64-bit)
  - VST2 support discontinued as of version 2.5
  - Current version: 2.5.2
