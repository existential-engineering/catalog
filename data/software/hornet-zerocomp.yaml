description: ZeroComp is the intelligent compressor that learns your audio and auto-configures compression with zero effort. Three models for versatility.
details: |-
  ZeroComp is a compressor built on the idea that the compressor should adapt to the audio rather than the other way around. It analyses the material in real time, auto-calibrates all parameters, and offers three parallel models that instantly change character.

  Real-time crest factor analysis automatically sets threshold, ratio, attack, release, knee and makeup gain from the audio's own characteristics. Convergence indicators give visual feedback on the learning progress, showing per-model status so it is clear when ZeroComp has analysed enough material to deliver optimal compression.

  The processing engine is designed to avoid parameter oscillations and pumping artifacts, using anti-oscillation algorithms, stable gain reduction and musical response curves for consistent results across all material types.

  Three models change the character instantly. Smooth is a sweet, musical response for melodic vocals and transparent master bus control, suited to R&B, pop and ballads. Tight is a fast, precise response for drums and acoustic guitars with emphasis on transients, and works on buses with light compression around 3 dB of gain reduction. Fat is a full, decisive tone for bass, aggressive vocals and punchy drums, adding body, density and presence for rock, punk and rap.

  Controls are deliberately few: a single Compression percentage from 0 to 100%, where 100% compresses the full dynamic range detected by the analysis engine, a Distortion control for pre-compression harmonic saturation, a Style switch between the three models, a Reset that re-triggers learning, and a Bypass for instant A/B comparison.
specs: |-
  - Real-time crest factor analysis with automatic parameter calibration
  - Adaptive threshold, ratio, attack, release, knee and makeup gain
  - Convergence indicators with per-model learning status
  - Anti-oscillation engine for stable, pumping-free gain reduction
  - Three models: Smooth, Tight and Fat
  - Single Compression percentage control (0 to 100%)
  - Distortion control for pre-compression harmonic saturation
  - Reset to re-trigger the learning algorithm
  - Bypass for instant A/B comparison
  - Input, output and gain reduction meters
  - Full parameter automation in the DAW
  - Minimal latency, suitable for live tracking
  - Hardware-accelerated, scalable graphics
  - Apple Silicon native support, optimized for M1/M2/M3/M4
  - macOS 10.13+ and Windows 10+
  - Audio Units (AU), VST3 and AAX formats
  - No copy protection, only a watermark carrying the buyer's email
