description: ZeroComp is the intelligent compressor that learns your audio and auto-configures compression with zero effort. Three models for versatility.
details: |-
  ZeroComp is an intelligent compressor built around the idea that the compressor should adapt to the audio rather than the other way around. Instead of setting threshold, ratio, attack and release in the dark for every source, it performs real-time crest factor analysis and auto-calibrates all compression parameters based on the material's own dynamic characteristics.

  Three parallel compression models are always active and can be switched instantly to change character. Smooth gives a sweet, musical response for melodic vocals and transparent master bus control. Tight is a fast, precise response for drums and acoustic guitars with emphasis on transients. Fat delivers a full, decisive tone for bass, aggressive vocals and punchy drums, adding body, density and presence.

  The control set is deliberately minimal. A single Compression percentage from 0 to 100% modulates gain reduction proportionally, where 100% compresses the full dynamic range detected by the analysis engine. A Distortion control adds pre-compression harmonic saturation for presence and density, while Style switches models, Reset re-triggers the learning algorithm for new material, and Bypass gives instant A/B comparison.

  Convergence indicators show the learning progress per model so it is clear when enough material has been analyzed for optimal compression. The processing engine is designed with anti-oscillation algorithms to avoid parameter oscillation and pumping artifacts, aiming for stable gain reduction and musical response curves across tracking, mixing and mastering stages.

  The interface uses minimalist, scalable GPU-accelerated graphics that work on standard and retina displays, with real-time input, output and gain reduction meters. The plugin is Apple Silicon native and optimized for M1/M2/M3/M4 chips, has minimal latency suitable for live tracking, and exposes full parameter automation to the DAW.
specs: |-
  - Real-time crest factor analysis with automatic parameter calibration (threshold, ratio, attack, release, knee, makeup gain)
  - Three parallel compression models: Smooth, Tight, Fat
  - Per-model convergence indicators with learning progress visualization
  - Compression control: single 0-100% percentage for compression amount
  - Distortion control: pre-compression harmonic saturation
  - Reset control to re-trigger the learning algorithm
  - Bypass for instant A/B comparison
  - Anti-oscillation, stable gain-reduction engine
  - Real-time input, output and gain reduction meters
  - Hardware-accelerated, scalable interface for standard and retina displays
  - Apple Silicon native ARM support, optimized for M1/M2/M3/M4
  - Minimal latency, suitable for live tracking
  - Full parameter automation with DAW integration
  - Platforms: macOS 10.13+, Windows 10+
  - Formats: Audio Units (AU), VST3, AAX
  - No copy protection, files watermarked with the purchaser's email address
