details: |-
  300 grand compact is a piano sample library sampled from a yamaha cfx 9 foot performance grand piano in a concert hall. 300 grand compact uses neumann m149 tube microphones placed just outside the lid that pickup the majority of the direct sound from the piano and a hint of the acoustic hall in the piano releases.

  This gives a nice balance of direct piano with a bit of space suitable for most recordings and performances including pop, jazz, classical and sound tracks. The piano is well balanced across the entire range of the instrument. It blends the bright attack of seven-foot yamaha pianos with the balanced rounded tone of larger nine-foot steinway grands.

  300 grand compact uses the free plogue sforzando player. 300 grand compact complements the other assortment of production voices compact series of piano libraries. 300 grand compact works with all styles of music.

  Recorded with neumann m149 tube mics just outside the piano lid. 24-bit 96k source samples reduced to 16-bit 44.1k using goodhertz conversion. Round-robin pedal noise samples with normal and loud settings. Sampled key up mechanical noises from the actual keyboard action.

  Sympathetic resonance with on/off and volume controls. Sostenuto pedaling. Recorded in piano performance hall. Lynx aurora a/d converters used. API microphone preamps used. 12 velocities pedal up (selected from over 36 sampled velocities). 12 velocities pedal down (selected from over 36 sampled velocities). 12 velocities release samples (selected from 32 sampled velocities). Quick loading. Memory efficient thanks to lossless flac compression.
