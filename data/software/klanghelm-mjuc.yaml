description: "Variable-tube compressor plugin featuring three distinct tube
  compression models representing different eras. Mk1 (1950s variable-mu, four
  compression stages, natural thick compression), Mk2 (1960s inspired, four
  ratios, density switch, interstage transformer), and Mk3 (modern hi-fi, dual
  variable-mu stages with feedforward and feedback for punchy compression).
  Includes TIMBRE and DRIVE controls for saturation and transformer load
  characteristics."
details: |-
  Three models: Mk1 (1950s), Mk2 (1960s), Mk3 (modern)
  Mk1: Four compression stages, natural thick compression with minimal distortion
  Mk2: Four ratios, density switch, interstage transformer options
  Mk3: Dual variable-mu stages (feedforward and feedback), punchy and attack-accentuating
  TIMBRE and DRIVE knobs for saturation and transformer load adjustment
  Variable-Mu compression topology
