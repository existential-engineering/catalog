description: MJUC is a variable-mu tube compressor plugin built on almost two years of research into vintage tube compression designs. It offers three distinct models, each with its own dedicated signal path and control set, plus TIMBRE and DRIVE controls for tone shaping and saturation.
details: |-
  MJUC is the most effortful Klanghelm plugin to date. It took almost two years of extensive, even excessive, research and development. Every variable-mu implementation Klanghelm could get hold of was researched and analyzed, to get the best of tube compression into a single processor. In order to do the diversity of this compression topology justice, three different models have been built. These are kind of a time travel though the history of tube compression to capture the essence of each generation. Each model has its own dedicated signal path and dedicated control set. If desired you can tweak the overall tone and saturation of each model with the unique TIMBRE and the DRIVE knob. DRIVE controls the load of the input and output transformers as well as the saturation of the tube gain stages, if applicable. The TIMBRE extends MJUC's use as a tone shaper.

  Model Mk1 is based on the very early variable-mu designs from the 50s. Due to its extremely high control voltage it doesn't impart any audible "thumping", most other variable-mu designs suffer from at high GR and fast timing constants. Also it has a very simple signal path, where the compression happens directly in the audio path. The result is a very natural compression character with very little distortion. The arrangement of four variable-mu stages add to the incredibly dense and thick nature of Mk1. Mk1 is the most colored of MJUC's models.

  Model Mk2 is built upon the more complex designs of the 175 and 176 from the early 1960s, the all-tube-predecessors of the classic 1176 FET compressor. It offers four ratios, a density switch, that enables a second variable-mu stage and reduces the program dependence of the attack and recovery timings to a minimum. Furthermore, it lets you activate the interstage transformer to reduce overall noise and distortion and making the compression more accentuated. Compared to Mk1 the second model is less Jazz and more Rock'n'Roll with enhanced generated harmonics and a more forward sounding character.

  Model Mk3 is the least colored and most Hi-Fi-sounding model in MJUC. It is Klanghelm's modern interpretation of this compression topology. The only design idea derived from another modern famous variable-mu comp is, that it's circuitry is done entirely differential, making the unit very quiet and almost distortion-free. But the real special thing about this model is, that the actual compression is done by two different variable-mu stages, which kind of work against each other, one works feedforward, while the other in a feedback configuration. This results in a attack accentuating, punchy compression, surprisingly closer to a British G type bus comp than to a 670.

  Note from the manufacturer: "variable-mu" is the correct technical term for this compressor topology, but the term is also a registered trademark of Manley Labs. Where Klanghelm uses it, it refers only to the technically correct name for this more than 70 year-old compressor topology and is in no way intended to be confused with the product of the same name.
specs: |-
  - Three variable-mu compressor models (Mk1, Mk2, Mk3), each with its own dedicated signal path and control set
  - TIMBRE control for overall tone shaping
  - DRIVE control for input and output transformer load and tube gain stage saturation
  - Mk1: four variable-mu stages, compression directly in the audio path, very high control voltage to avoid audible thumping
  - Mk2: four ratios, DENSITY switch enabling a second variable-mu stage, switchable interstage transformer
  - Mk3: fully differential circuitry with two variable-mu stages, one feedforward and one feedback
  - HQ mode
  - Automatic gain compensation (AGC)
  - Resizable GUI
  - Preset browser with save, copy, paste and save-as-default
  - A/B comparison
  - Customizable knob behavior
  - Windows 10 or higher (64-bit): VST, VST3, AAX Native for Pro Tools 11 or higher
  - macOS 10.13 or higher: AU, VST, VST3, AAX Native for Pro Tools 11 or higher
  - Native Apple Silicon support
