description: Limitless is a cutting-edge peak limiter designed for professional mastering chains, featuring multi-band dual-stage processing that intelligently separates dynamics and transients while generating smooth gain reduction curves.
details: |-
  Limitless uses a state-of-the-art iterative numerical solver algorithm to deliver transparent limiting with dual-stage dynamic handling that separately addresses transients and dynamics. A 6-band variable-slope linear phase crossover lets you divide the spectrum for per-band release control. A 64x oversampled pre-limiter clipper with multiple algorithms handles intersample true-peak suppression. Full EBU R-128 integrated loudness metering, noise-shaped dither with adjustable intensity, and variable stereo linkage make it a complete mastering-stage solution. Both simple and advanced UI modes are available, along with 8 A/B preset comparison banks and a spectrum analyzer for crossover configuration.
specs: |-
  - State-of-the-art iterative numerical solver for transparent limiting
  - Dual-stage processing: separate transient and dynamic handling
  - 6-band variable-slope linear phase crossover
  - Master and per-band release controls
  - 64x oversampled pre-limiter clipper with multiple algorithms
  - Inter-sample (True-Peak) suppression
  - Full integrated EBU R-128 loudness metering
  - Noise-shaped dither with adjustable intensity
  - Variable stereo linkage
  - Loudness weighting control
  - Spectrum analyzer for crossover configuration
  - Time-plot visualization
  - Configurable PPM and GR meters
  - Full gain staging on input, clipper, limiter threshold, and output ceiling
  - Simple and advanced operation modes
  - 8 A/B preset banks
