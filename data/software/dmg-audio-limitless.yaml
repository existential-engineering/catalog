description: Featuring full loudness metering and DMGAudio's state of the art algorithms this is not your traditional dynamics processor. Limitless implements multi-band dual-stage processing that intelligently separates dynamics and transients, and generates the smoothest possible gain reduction curves.
details: |-
  The New Art of Limiting: Featuring full loudness metering and DMGAudio's state of the art algorithms, Limitless is not a traditional dynamics processor. It implements multi-band dual-stage processing that intelligently separates dynamics and transients, generating the smoothest possible gain reduction curves.

  Sound: 6 band variable-slope Linear Phase crossover, with a state-of-the-art iterative numerical solver for optimally smooth gain reduction. Dual-stage limiting separates dynamics and transients, with a style menu providing quick access to useful limiting characters, variable stereo linkage, full gain staging on input/clipper/threshold/output, master and per-band release controls, and loudness weighting control to optimise for bass or perceptual loudness without EQ.

  Vision: a simple four-control interface plus an advanced section for precision control, a spectrum analyser for crossover configuration, a time-plot to highlight peaks and visualise clipping, Loudness History with EBU R128 compliance, freely-resizable UI, Mac Retina support, 8 A/B banks, gain-lock, and configurable zoomable PPM and GR meters.
specs: |-
  - 6-band variable-slope linear phase crossover
  - Iterative solver algorithm for transparent, smooth gain reduction
  - Dual-stage dynamic handling separates transients and dynamics
  - Bit-transparent linear phase crossover
  - Inter-sample (True-) peak suppression
  - High-pass filter for DC removal
  - Simple and advanced control modes
  - 64x oversampled pre-limiter clipper with multiple clip algorithms
  - Noise-shaped dither with adjustable noise shaping intensity
  - Full integrated EBU R-128 loudness metering
  - Extensive graphing and feedback
  - Variable stereo linkage
  - Master and per-band release controls
  - Loudness weighting control
  - 8 A/B banks
  - Mac Retina support
