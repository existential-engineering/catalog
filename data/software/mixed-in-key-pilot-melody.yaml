description: Make amazing melodies for any music style.
details: |-
  Pilot Melody is one of the Mixed In Key Pilot plugins, built to make amazing melodies for any music style. Create amazing melodies using the styles inside Pilot Melody.

  The plugin is organised around styles. On the left side there is an option to choose the style of music you would like to make. Some styles are meant to be used for pop, some are for melodic techno and other musical genres, and every style has its own unique control knobs. They can also be used against their intent, such as trying a pop melody over a house track or a melodic techno arpeggio over trap drums, so the possibilities are almost endless.

  Seven melody styles are supplied: M1 Loop Master 5000, M2 Star Dust, M3 Pulsar, M4 Andromeda, M5 Future Bounce, M6 Ibiza 7AM and M7 Flyaway.

  A customizable MIDI canvas shows the generated output: each time you rotate a knob you see different MIDI notes generated in the center preview section, and clicking the edit icon expands a more detailed view. That detailed view is fully MIDI editable, so notes can be added, deleted and moved with a mouse or trackpad.

  The plugin comes pre-loaded with custom synthesizers, 250+ cutting-edge sounds for every genre. Named example instruments are Neptune 106Bass, Ultra Arp Pluck, Big Room Lead, Vintage Analog and Alternation Bell, with a link to explore all instruments.
specs: |-
  - MIDI melody generator plugin
  - Style-based composition with unique control knobs per style
  - Seven melody styles listed: M1 Loop Master 5000, M2 Star Dust, M3 Pulsar, M4 Andromeda, M5 Future Bounce, M6 Ibiza 7AM, M7 Flyaway
  - Customizable MIDI canvas with expandable detailed editing view
  - Fully MIDI editable: add, delete and move notes with mouse or trackpad
  - Pre-loaded custom synthesizers with 250+ sounds
