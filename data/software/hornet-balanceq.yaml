description: Achieve perfect mix balance instantly with BalancEQ, the ultimate automatic equalizer. No tweaks just insert and optimize your sound
details: |-
  BalancEQ is designed to provide automatic equalization, ensuring a smooth and natural response that fits seamlessly into any mix. Whether you are working on vocals, instruments, or an entire master track, BalancEQ gives transparent, musical EQ corrections with zero effort. It intelligently analyzes your audio and applies precise adjustments based on scientifically optimized reference curves, for a consistent, well-balanced frequency response that sounds natural and musical without affecting the tonal qualities of your track.

  Unlike traditional EQs that demand constant adjustments, BalancEQ takes the heavy lifting out of equalizing a track. There is no need to manually fine-tune each frequency band, so you can spend less time adjusting frequencies and more time on the creative elements of your production while your tracks maintain a professional, polished tonal balance.

  BalancEQ continuously analyzes your audio in real time, detecting peaks or frequency imbalances as the track plays. It normalizes levels to keep a consistent loudness reference while leaving the dynamic range intact, then applies targeted equalization from a scientifically optimized reference curve to fix spectral inconsistencies. Whether a track has an overly bright high end or a muddy low end, those imbalances are corrected automatically without sacrificing musicality.

  The plugin suits producers, mix engineers and musicians of any skill level, eliminating the guesswork from equalization. It works on individual tracks such as vocals, guitars and drums to bring out their natural character, and on full mixes where it adds a further layer of polish and clarity. The lightweight design keeps CPU load low so large sessions with many instances stay responsive.

  HoRNet suggests pairing BalancEQ with HoRNet HarmoniQ and HoRNet Sleek, placing BalancEQ after them to refine and optimize the mix further. A fully functional demo is available: it silences the output periodically, does not save parameter values with the session, and does not respond to host automation. The plugin ships with no copy protection.
specs: |-
  - Automatic frequency analysis with no manual adjustments required
  - Real-time spectral balancing
  - One-button operation
  - Adaptive EQ correction based on an optimized reference curve
  - Precision gain adjustment for each frequency band
  - High-pass filter adjustment to eliminate unnecessary low-end buildup
  - Compatible with various sources including vocals, instruments and full mixes
  - Supports VST3, Audio Unit and AAX formats
  - Full support for Apple Silicon
  - 64-bit only
  - Compatible with macOS 10.13 or later and Windows 10 or later
  - Lightweight and CPU-efficient
  - No copy protection
