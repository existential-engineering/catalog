description: MONGOLIAN VOICES - ANCIENT PHRASES is the perfect vocal instrument to add a raw, esoteric flavor to your music. Available for KONTAKT & HALion SONIC.
details: |-
  Mongolian Voices - Ancient Phrases is a vocal phrase instrument drawn from the shamanic sounds of traditional Mongolian singing, aimed at composers after a raw, esoteric voice rather than a polished choir. The page pitches it as mysterious, otherworldly calls meant to break a composition free of its inhibitions, at home in sci-fi, fantasy and ancient-religion settings.

  The library is divided into three categories: Female, Male and Male Throat. The Female and Male parts are based on the Urtiin duu, or long song, a roughly 2,000-year-old form sung from mountaintops whose long, drawn-out syllables evoke the open spaces of the Mongolian steppe, and which holds an honoured place at Mongolian festivals and events. The Male Throat category covers the Mongol Khoomei, the guttural throat singing built on circular breathing that can sound two or three notes at once, a skill few singers in the world possess.

  Three artists perform the material. Throat singer Ashit Nergui studied under D. Sundui and D. Ganbold, and holds a Bachelor's degree in Teaching Music from the Cultural Institute of Mongolia and a Master's in Mongolian Music from the National University of Mongolia. Erdenetsetseg Khenmedekh sings the female long song, having taken first prize in a competition in Ulan-Ude at the start of a long career in Mongolian traditional singing. Munkhbaatar Bat-Ulzii, a master of the long song, performs regularly with the Ulan Bator Morin Khuur Ensembles. The recordings use a positional array of Neumann M149, U87 and KM184 microphones plus a Sennheiser MD421.

  In all there are 621 live-recorded phrases across 17 themes, at 51 samples per theme. The vocals sit outside Western musical theory, technically in a major key but not feeling like one, so they work with most modes. The interface offers the choice of phrases, with an FX page carrying a built-in EQ, delay and reverb and all controls fully MIDI mappable. It runs in the full version of Native Instruments KONTAKT or in Steinberg's free HALion Sonic 7.
