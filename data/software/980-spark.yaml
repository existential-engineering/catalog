details: >-
  980 spark is a unit that consists of three modules: compressor, colour and
  saturator. This plugin was especially designed to help enrich and thicken
  audio content with minimum of effort, without compromising quality and
  usability. It is a handy tool for sound design, as well as a sophisticated
  saturation unit.


  All the controls are carefully selected with workflow in mind, enabling the
  user to quickly achieve the desired result, while retaining the versatility of
  the plugin and allowing space for experimentation. 980 spark is mostly suited
  for use during the production process, especially in electronic music but also
  acoustic or live applications.


  Combining compression, eq and saturation, allows control of the dynamic range
  and harmonic content of the sound. The signal first runs through the
  "compressor" module, then through the "colour" module and finally into the
  "saturator". This way, the first two stages ("compressor" and "colour")
  essentially define the dynamic and spectral characteristics of the sound that
  will excite the saturator, creating a unique spectrum of capabilities on the
  saturation effect.


  During saturation the signal is oversampled 8 times, to ensure hq effect.
