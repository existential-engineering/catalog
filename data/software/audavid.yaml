details: |-
  AudaVid is a customised software build of the audacity(r) audio editor. It
  provides synchronised video playback using a modified version of the
  vidplayvst DAW plug-in.

  Audavid is used by media producers composing audio material in sync with
  video. The application runs in microsoft windows and uses ffmpeg, which is an
  open source library of tools for working with video and audio data in multiple
  formats.

  It is able to open and play video files in any format supported by ffmpeg.

  Features include a facility to pick out a specific cue from a longer video
  reel, loop mode which can be useful for live performance or rolling
  presentations, and a resizable viewport window where the video may optionally
  be viewed in a detached window or full screen.

  Video may be viewed at its original aspect ratio or scaled to fit a chosen
  window size, with the option to play the soundtrack if present within the
  video file or have it muted, and the ability to display smpte timecode.
specs: |-
  - Audacity audio editor
  - Synchronised video playback
  - Vidplayvst DAW plug-in
  - Ffmpeg support
  - Microsoft Windows compatible
  - Multiple video format support
  - Loop mode
  - Resizable viewport window
  - Detached window viewing
  - Full screen viewing
  - Original aspect ratio playback
  - Scaled window playback
  - Soundtrack playback
  - Mute option
  - Smpte timecode display
  - Cue selection from video reel
