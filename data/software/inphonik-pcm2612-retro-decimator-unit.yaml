description: A bitcrusher effect plug-in inspired by the PCM playback feature of the RYM2612 Iconic FM Synthesizer, inphonik's tribute emulation of the Sega Genesis sound chip. Delivers 8-bit decimation in a simple, compact, DRM-free effect unit available free of charge.
details: |-
  8-bit decimation derived from the Sega Genesis YM2612 FM chip's PCM playback

  Free of charge with no DRM

  Vertical box and horizontal rack GUI form factors

  1x, 1.5x, 2x GUI scaling

  64-bit
specs: |-
  - 32-step scalable 8-bit decimation
  - Dry/Wet level control
  - Stereo/Mono switching
  - Output filtering: Legacy (Sega Genesis Model 1 circuit) and Crystal Clear modes
  - GUI scaling: 1x, 1.5x, 2x
  - Dual GUI form factors: vertical box and horizontal rack
  - Native Apple Silicon (ARM) support on macOS
  - Native Linux VST support
  - AUv3 and IAA on iOS
  - DRM-free
  - windows: Vista+, 64-bit
  - mac: macOS 10.7+, Intel & Apple Silicon
  - linux: 64-bit, VST
  - ios: iOS 11+, AUv3/IAA
