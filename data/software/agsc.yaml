details: |-
  Ample guitar sc aims to bring a fender stratocaster 50th anniversary guitar
  sound to your studio with four sample libraries covering neck, neck + middle,
  funk (middle + bridge), and bridge positions.

  Sampling includes 10 articulations: sustain, palm mute, natural harmonic,
  hammer on & pull off, legato slide, slide in, slide out, pop, pinch harmonic,
  and slide guitar. The plugin features polyphonic legato and slide smoother for
  realistic legato across any interval and speed, with drop tuning support down
  to d1 and authentic left-hand performance noises.

  Riffer 4 is a MIDI editor tailored for plucked string instruments featuring an
  all-new strumming and chord system where the innovative "strum note" treats
  multiple sub-notes within a chord as a single editable object, allowing
  unified control over strum time, velocity gradient, and legato parameters.
  Dual view modes enable seamless real-time switching between piano roll and
  guitar tab views, while the string visualization system prevents polyphony on
  the same string and intelligently assigns fingering.

  Tab reader 4 supports guitar pro files from gp3 to guitar pro 8 and is capable
  of importing entire bass tracks into riffer with full retention of fingering,
  articulations, and performance data. The strummer includes chord detection
  modes and strum seq for strumming in any rhythm and speed, with an extensive
  rhythm library featuring MIDI drag-and-drop support.

  The amp and fx system includes an amp simulator with 7 classic amp heads
  (metal double, metal treble, lead 800, jazz 120, 65 twang, 65 delight, and 57
  delight) paired with 8 guitar cabinets each captured with 8 microphones, plus
  built-in effects: 8-band eq, compressor, delay, and convolution reverb.
specs: |-





  - Macos and windows

