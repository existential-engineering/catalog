  - 10 gb size

  - Polyphonic legato and slide smoother

  - Drop tuning support (lowest note d1)

  - Authentic left-hand performance noises

  - Riffer 4 MIDI editor

  - Strumming and chord system with strum note

  - Dual view modes (piano roll and guitar tab)

  - String visualization system

  - Full MIDI import/export compatibility

  - Intuitive technique editing

  - MIDI cc and velocity editors

  - Extensive riff library

  - Strummer with chord detection and strum seq

  - Tab reader 4 (gp3 to guitar pro 8 support)

  - Bass track import capability

  - Amp simulator with 7 amp heads (metal double, metal treble, lead 800, jazz
  120, 65 twang, 65 delight, 57 delight)

  - 8 guitar cabinets with 8 microphones each

  - Built-in effects (8-band eq, compressor, delay, convolution reverb)
