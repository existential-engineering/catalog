description: Ample guitar m aim to bring a martin d-41 acoustic guitar sound to
  your studio. Finger, pick and strum three sample libraries.
details: |-
  Ample guitar m aims to bring a martin d-41 acoustic guitar sound to your
  studio. Finger, pick and strum three sample libraries. Sampling: sustain, palm
  mute, natural harmonic, hammer on & pull off, legato slide, slide in, slide
  out, pop, slide guitar 9 articulations. Size: 5.83 GB. Polyphonic legato and
  slide smoother: enables realistic legato across any interval and speed. Drop
  tuning supported, with lowest note down to d1. Authentic left-hand performance
  noises. Adjustable acoustic resonance.

  Riffer 4: a MIDI editor tailored for plucked string instruments: all-new
  strumming and chord system: the innovative "strum note" treats multiple
  sub-notes within a chord as a single editable object, allowing unified control
  over strum time, velocity gradient, and legato parameters. Combined with
  authentic guitar fingering settings, this makes strum creation more intuitive
  and efficient, delivering results that are closer to real performance.

  Dual view modes: seamless real-time switching between piano roll and guitar
  tab views — a first of its kind, offering two perspectives for reviewing and
  editing the compositions. String visualization system: strings are now
  visualized within the piano roll, enabling MIDI writing that adheres to
  authentic plucked instrument techniques — automatically preventing polyphony
  on the same string and intelligently assigning fingering.

  Full MIDI import/export compatibility: whether import external MIDI files or
  export from riffer to DAW's MIDI or instrument track, the playback result
  remains identical and accurate. Intuitive technique editing: easily program
  fingering, articulation, legato, and expression — no need for cumbersome key
  switches or complicated MIDI cc programming. New MIDI cc and velocity editors:
  view and edit multiple MIDI cc lanes simultaneously with different colors and
  transparency. One-click cc curve presets allow fast and expressive automation.

  Tab reader 4: supports guitar pro files from gp3 to guitar pro 8. Capable of
  importing entire bass tracks into riffer with full retention of fingering,
  articulations, and performance data. Amp and fx system: built-in effects:
  8-band eq, compressor, delay, and convolution reverb.
