description: "A classic software limiter redefined: a seamless combination of familiar feel and expanded versatility. Combines familiar controls with expanded options for stereo processing, release settings, waveshapers, tone shaping curves, oversampling, and dithering. Features adjustable release modes (Manual, Auto, Sync), stereo/dual mono processing, input waveshapers (Flat, Round, Punchy), tone control (Flat, Thick, Presence, Bright, Hype), and variable dithering from 24/16-bit down to 4-bit."
details: |-
  The El Juan Limiter brings a wealth of features designed to maximize loudness, shape audio tones and provide creative control over loudness. Drawing inspiration from a pioneering audio plugin that left an indelible mark on the industry, the EJL captures the clarity and ease of the original and then goes beyond it with expanded options for stereo processing, versatile release settings, waveshapers, customizable tone shaping curves, oversampling and dithering.

  The front panel is intuitive and familiar. Set the ceiling, pull the threshold down a little, and you are already adding loudness and body to a mix with minimal effort, with a few extra controls on the front to help reach a particular sound.

  Release offers three modes. MANUAL dials in the release time precisely for exact control over the tail of the compression. AUTO is inspired by the auto-release curve of a legendary British console bus compressor and brings that classic glue. SYNC locks the compression to the track's tempo so the processing pulses and breathes with the rhythm. Stereo linking can be enabled so both channels are processed together, or disabled so the two dual mono channels respond independently, which suits stereo groups with varying content such as toms, overheads and doubled vocals.

  The other side of the plugin adds sonic control that makes El Juan far more than a limiting and mastering tool. Input Section waveshapers shape the character of the audio before it enters the limiter: Flat for a natural what-goes-in-is-what-goes-out sound, Round to add harmonics for warmer and more musical content, and Punchy to increase perceived loudness and punch ahead of the limiter section.

  Tone control sets the tonal balance of the audio going into the limiter, with Flat, Thick for enhanced low-frequency content, Presence for a midrange boost around 2k to 5k, Bright for high-frequency sparkle and air, and Hype for an exaggerated top and bottom. Dithering is treated as a creative tool as well as an artifact reducer, with standard 24 and 16 bit options plus a variable low-resolution slider reaching down to 4 bits for lo-fi colour, vintage sampler tones and bit-crushing grind.
specs: |-
  - Threshold and ceiling controls for straightforward loudness and body
  - Three release modes: MANUAL, AUTO (British console bus compressor style curve) and SYNC (tempo locked)
  - Switchable stereo link or dual mono independent channel processing
  - Input waveshapers: Flat, Round (added harmonics) and Punchy (increased perceived loudness)
  - Tone shaping curves: Flat, Thick, Presence (2k to 5k), Bright and Hype
  - Oversampling
  - Dithering at 24 and 16 bit plus a variable low-resolution slider down to 4 bits
  - Software-based licensing, no USB or hardware dongle and no special drivers
  - Activation on up to four machines at the same time
  - Internet connection required for activation and for all demos
  - Minimum: Intel, AMD or Apple Silicon i5 quad core processor
  - Minimum: 4GB of RAM
  - Minimum: Mac OS X 10.14 or higher
  - Minimum: Windows 7 and above
  - Minimum screen resolution: 1024 x 768
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
