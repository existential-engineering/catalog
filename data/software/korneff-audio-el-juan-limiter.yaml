description: A software limiter combining threshold and ceiling controls with
  options for stereo processing, release settings, waveshapers, tone shaping
  curves, oversampling and dithering. Features adjustable release modes (Manual,
  Auto, Sync), stereo/dual mono processing, input waveshapers (Flat, Round,
  Punchy), tone control (Flat, Thick, Presence, Bright, Hype), and variable
  dithering from 24/16-bit down to 4-bit.
details: |-
  A classic reimagined into a 21st-century platform for "limitless" creativity. The El Juan Limiter brings a wealth of features designed to maximize loudness, shape audio tones and provide creative control over your audio loudness. Drawing inspiration from a pioneering audio plugin that has left an indelible mark on the industry, the EJL pays homage to an iconic plugin by incorporating a range of new features and enhancements. The El Juan captures the clarity and ease of the original, and then goes beyond with expanded options for stereo processing, versatile release settings, waveshapers, customizable tone shaping curves, oversampling, and dithering capabilities.

  Whether you're an expert mastering engineer, a mix engineer ready to give your tracks that last bit of shine, or a producer shaping your sounds, the El Juan Limiter is here for you to dive into some cool new audio adventures. An intuitive, familiar front panel: set the ceiling and pull down the threshold a bit and you're already in business, adding loudness and body to a mix with minimal effort.

  Adjustable Release. MANUAL: sculpt the sound to your exact specifications, precisely dialling in the release time for exact control over the tail of your compression. AUTO: inspired by the Auto-Release curve of "that" legendary British Console bus compressor, this mode brings that classic, time-tested glue to your tracks. SYNC: for processing that pulses and breathes with the rhythm, ensuring the compression dynamically moves in sync with your track.

  Stereo or Dual Mono. When enabled (linked), both channels are processed together. When disabled (unlinked), the two dual mono channels respond to signals independently, which is useful for processing stereo groups with varying audio in them, like toms, overheads and doubled vocals.

  The other side of the EJL gives you additional sonic control. Input Section Waveshapers shape the character of the audio before it enters the limiter (Flat, Round, Punchy), Tone Control sets the tonal balance going into the limiter (Flat, Thick, Presence, Bright, Hype), and dithering becomes a creative tool: standard 24/16bit options plus a variable low resolution slider down to 4 bits, for colours ranging from a touch of lo-fi to vintage samplers to bit-crushing.
specs: |-
  - Threshold and ceiling controls for loudness with minimal effort
  - Release modes: Manual, Auto (inspired by a British console bus compressor auto-release curve) and Sync (tempo synced)
  - Stereo linked or dual mono unlinked processing
  - Input waveshapers: Flat, Round, Punchy
  - Tone control curves: Flat, Thick, Presence, Bright, Hype
  - Dithering: 24/16bit standard, plus a variable low resolution slider down to 4 bits
  - Oversampling
  - Software-based licensing, no USB or hardware dongle, up to four simultaneous machine activations, internet connection required for activation and demos
  - Minimum system: Intel, AMD or Apple Silicon i5 quad core, 4GB RAM, macOS 10.14 or higher, Windows 7 and above, screen resolution 1024 x 768 or higher
