description: "A classic software limiter redefined: a seamless combination of familiar feel and expanded versatility. Combines familiar controls with expanded options for stereo processing, release settings, waveshapers, tone shaping curves, oversampling, and dithering. Features adjustable release modes (Manual, Auto, Sync), stereo/dual mono processing, input waveshapers (Flat, Round, Punchy), tone control (Flat, Thick, Presence, Bright, Hype), and variable dithering from 24/16-bit down to 4-bit."
details: |-
  El Juan Limiter features a front panel with adjustable Release modes including Manual (precise control), Auto (inspired by British console compressors), and Sync (tempo-synchronized), along with Stereo/Dual Mono processing with linked or unlinked channels.

  The rear panel provides expanded creative and tonal options through Input Waveshapers (Flat, Round for warmer harmonics, and Punchy) that shape the signal character going into the limiting stage.

  A Tone Control section offers five modes — Flat, Thick (low-frequency enhancement), Presence (midrange boost), Bright (high-frequency emphasis), and Hype (exaggerated character) — allowing broad tonal shaping without a separate EQ.

  Dithering options go beyond standard 24/16-bit down to variable low-resolution settings as low as 4-bit, enabling both transparent finalization and creative lo-fi effects. M/S processing and a stereo width knob are also included.

  The plugin requires macOS 10.14 or higher (64-bit) or Windows 7 and above (64-bit), with a minimum of an Intel, AMD, or Apple Silicon i5 quad-core processor and 4GB RAM. Licensing is software-based with no USB dongle, supporting up to 4 simultaneous machine activations.
