description: "A classic software limiter redefined: a seamless combination of
  familiar feel and expanded versatility. Combines familiar controls with
  expanded options for stereo processing, release settings, waveshapers, tone
  shaping curves, oversampling, and dithering. Features adjustable release modes
  (Manual, Auto, Sync), stereo/dual mono processing, input waveshapers (Flat,
  Round, Punchy), tone control (Flat, Thick, Presence, Bright, Hype), and
  variable dithering from 24/16-bit down to 4-bit."
