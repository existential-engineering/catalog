description: DirectX/VST plugin that effectively removes clicks, crackles and
  any other transient noises with virtually no artifacts and no degradation of
  the original signal.
details: |-
  The ScratchFree DirectX/VST Plug-In effectively removes clicks and crackles
  from old vinyl and shellac (78 rpm) records and cleans up audio recordings
  tainted by switching noise, static discharge, digital cross-talk, or thyristor
  buzz.

  Unlike other systems, the ScratchFree DirectX/VST Plug-In works virtually
  without artifacts when using correct settings for all parameters. It includes
  an excellent de-crackling algorithm preserving timbre, ambience, and low-level
  details in the original signal.

  ScratchFree is extremely easy to use. With only three sliders and a few preset
  buttons you can get respectable results within minutes. The signal scope helps
  you to find ideal settings for the DeCrackler.

  ScratchFree provides pre-defined application profiles: digital spikes, shellac
  (78 rpm) or vinyl. In addition to its main application, it effectively
  diminishes any kind of distortion caused by signal overload (Clipping).

  Since the CPU requirement for ScratchFree is very low, you can adjust and
  optimize all parameters while listening to the audio in real-time.
specs: |-
  - De-clicking module for severe clicks
  - De-crackling module for small clicks and crackles
  - Unique Differ feature for monitoring removed signal
  - Pre-defined application profiles (digital, shellac, vinyl)
  - Advanced parameters: Width, Smooth, DePlop
  - Signal scope for parameter optimization
  - Real-time processing with low CPU usage
  - Works with Sequoia, Samplitude, Pyramix, WaveLab, Adobe Audition, Nuendo, Cubase
