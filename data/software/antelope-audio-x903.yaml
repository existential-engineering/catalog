details: |-
  The X903 is modeled after a cult compressor module which will add just the right amount of analog punch needed! Equipped with smart RMS detection, the X903 will treat your sound to high-end, authentic analog compression and limiting.

  With the X903's Negative Ratio capabilities, you can even inverse the dynamics of audio material, pulling back the transient peaks for a unique special effect. All in all, the X903 is a natural-sounding compressor capable of managing dynamics in great ways!
