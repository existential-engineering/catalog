description: A couple of weeks ago @trbl.music reached out to me with an idea of
  creating a plugin out of a coca cola bottle. The way he presented the id...
details: |-
  Bottle Pop is a virtual instrument that has that blow airy sound. Have you
  ever blew on the top of en empty glass bottle? Thats what this plugin is! We
  took it a step further and we added some percussions as well from the glass
  soda bottle itself.

  This plugin is definitely unique to its kind and offers it's users the ability
  to use new and unusual sounds, also each sound was recorded in round robins
  style so the user gets a realistic feel and sound.

  Bottle pop by reflekt audio is a virtual instrument audio plugin for macos and
  windows. It functions as a VST plugin, an audio units plugin and a VST 3
  plugin.

  Zipped file size: 14.2 mb. Unzipped file size: 37.9 mb. Windows/mac
  compatible. Compatible in most major daws. (excluding pro tools).
specs: |-
  - macOS compatible
  - Windows compatible
  - Round robin sampling
  - Reverb control
  - Blow sound synthesis
  - Percussion sounds
  - Glass bottle emulation
platforms:
