description: Experimental reverb plugin for creating immersive spatial textures with
  an interactive X/Y morphing control, spectral evolution, and embedded modulation.
details: |-
  SpaceBlender is an experimental reverb designed to produce massive waves of lush, organic, and evolving spatial effects. Inspired by ambient music pioneers using tape loops and delays, it creates unreal and imaginary spaces.

  The interactive X/Y control morphs between reverb shapes including gate, reverse, decay, and bloom. A real-time visualizer displays the effect envelope as it evolves, while spectral evolution controls allow brightness and darkness to change over time.

  Embedded modulation creates evolving textures that shift and breathe. The time range extends from 100ms to 60 seconds, with sync mode available for tempo-locked effects. A Freeze function enables feedback loops for sustained, evolving pads.
specs: |-
  - Interactive X/Y control for morphing between reverb shapes
  - Reverb shapes: gate, reverse, decay, bloom
  - Real-time visualizer displaying effect envelope
  - Spectral evolution (brightness/darkness changes over time)
  - Embedded modulation for evolving textures
  - Time range: 100ms to 60 seconds (Sync mode available)
  - Freeze function for feedback loops
  - 64-bit only, sample rates 44.1 kHz to 192 kHz
  - Apple Silicon compatible
