description: GX-80 is a transformative virtual synthesizer that combines the
  unparalleled sound and features of the fabled GX-1 “Dream Machine” and its
  renowned descendant the CS-80, to create a powerhouse hybrid.
details: |-
  GX-80 is not just another CS-80 emulation. GX-80 adeptly integrates the GX-1's distinctive feature set into the CS-80 architecture; most significantly, the massive dual-layer architecture that effectively made the GX-1 the equivalent of two CS-80s and then some. The GX-1's unique highpassed resonant pulse and bandpassed sawtooth waves, octave-up triangle wave, and filter envelope inversion are incorporated, opening up a new universe of sonic experimentation. Most notably, GX-80 includes an expert reproduction of the legendary GX-1 filter, delivering exquisite timbres that even the mighty CS-80 cannot produce.

  GX-80 boasts an impressive, dual-layer voicing architecture outfitted with 16 polyphonic voices per layer. The instrument is capable of sounding two different CS-80 style sounds simultaneously, while panning each rank independently, to produce exquisitely rich stereo timbres and complex, layered sounds. For ultimate flexibility and expressive performance, GX-80 provides a split keyboard mode and a clever option to simulate polyphonic aftertouch with a monophonic aftertouch controller. The GX-80 comes pre-loaded with over 1,000 expertly designed presets and equipped with studio-grade effects.

  Though their outward appearances were radically different, the GX-1 and the CS-80 instruments were very similar under the hood. Both featured a voicing architecture based on “ranks,” wherein each rank was a complete synthesizer voice consisting of an oscillator, highpass and lowpass filters, a noise generator, a sine wave oscillator, a VCA, and envelope generators for both the filter and VCA. The CS-80 included two of these voice ranks, each capable of playing up to eight independent polyphonic notes, a total of 16 synth voices under the hood. The GX-1 featured four of these eight-note poly voice ranks, assignable across two keyboards, plus a single solo synth voice rank for its three-octave mini keyboard and another synth voice rank for the pedalboard.

  The GX-1 oscillator section featured a pulse wave with an adjustable highpass resonator and a sawtooth wave with a dedicated bandpass resonator, in addition to and in parallel with the standard pulse and sawtooth wave outputs. Additionally, it had an adjustable octave-up triangle wave, a filter envelope inversion option, and a VCF comprised of highpass and lowpass filters with such immense range that they are still considered legendary to this day.

  With its dual-layer interface and multithreaded processing, over 1,000 presets, and integrated studio-quality effects, GX-80 combines the sonic characteristics of the originals with discrete layer volume and panning controls, 16 polyphonic voices per layer, and two different timbres simultaneously playable in a split or stacked layer mode.
specs: |-
  - Virtual instrument based on two analog classics: the GX-1 and CS-80
  - Integrates the extended features of the GX-1 with the functionality of its descendant, the CS-80
  - Dual-layer voicing architecture with 16 polyphonic voices per layer: two different CS-80 style sounds simultaneously playable, in either a keyboard split or stacked layer mode, with discrete controls for layer volume and panning
  - All GX-1 and CS-80 voicing parameters reproduced, including the GX-1's oscillator-level filtered waveforms, octave-up triangle wave, and invert filter envelope control
  - Recreation of both the CS-80 and GX-1 filters
  - Four polyphonic voice ranks, each with a voltage-controlled oscillator, resonant highpass and lowpass filters, noise generator, sine wave, dual envelope generators, and a velocity-sensitive VCA
  - Sub oscillator LFO for each layer with sine, sawtooth, ramp, square, sample and hold, and noise intended for modulation, with tempo sync
  - Recreation of the CS ring modulator that modulates the summed output of each pair of ranks with its own independent oscillator
  - Coarse pitch range setting for each oscillator in traditional organ footage of 16', 8', 5 1/3', 4', 2 2/3' and 2', as well as the 3 1/5' and 2 2/7' footages exclusive to the GX-1
  - Virtual pitch ribbon controller modeled on the behavior of the original
  - GX-1 specific controls clearly distinguished from standard CS-80 control parameters
  - Independent rank panning and independent layer stereo effects chain
  - Tone Selector includes each of the original CS-80 factory presets plus user sound storage
  - Panel Control for selecting layers, with a utility function for exchanging settings between ranks in a layer, the Lower and Upper sound layers, or between presets
  - Over 1,000 presets
  - Integrated effects: chorus/rotary, flange/phaser, digital/tape delay with sync, and reverb, including the Galactic reverb algorithm, with global or dual layer modes
  - Velocity sensitive with support for both polyphonic and monophonic aftertouch, plus a “last-note priority” mode for simulated polyphonic aftertouch response
  - Complete MIDI control and DAW automation for all controls, with MIDI learn and mapping (Preset and Global)
  - Focus zoom-in feature, as well as standard UI zoom and resize with drag
  - Multithreaded processing for presets using Dual and Split Layer modes
  - User-adjustable oversampling control
  - macOS 10.13 or above, 64-bit required, native Apple M1 or greater processor support, 3.4 GHz Quad-Core or M1 CPU with 8GB of RAM recommended
  - Windows 7 or above (including Windows 11), 64-bit required, 3.4 GHz Quad-Core computer with 8GB of RAM recommended
  - Internet connection required for product activation
