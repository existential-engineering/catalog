details: |-
  GX-80 is a transformative virtual synthesizer that combines the unparalleled sound and features of the fabled GX-1 Dream Machine and its renowned descendant the CS-80, to create a powerhouse hybrid. It is not just another CS-80 emulation but incorporates the GX-1's unique highpassed resonant pulse and bandpassed sawtooth waves, octave-up triangle wave, and filter envelope inversion.

  GX-80 boasts an impressive dual-layer voicing architecture outfitted with 16 polyphonic voices per layer, with four polyphonic voice ranks per layer producing exquisitely rich stereo timbres and complex layered sounds. The recreation of both GX-1 and CS-80 filters opens up a new universe of sonic experimentation.

  The instrument features a sub oscillator LFO with sine, sawtooth, ramp, square, sample and hold, and noise waveforms, along with a ring modulator modeled on the CS-80 and a pitch ribbon controller. Studio-quality effects include chorus/rotary, flange/phaser, digital/tape delay with sync, and reverb.

  GX-80 is more than a best-of-both-worlds interpretation of the past. With over 1,000 presets, velocity sensitivity, polyphonic and monophonic aftertouch support, and complete MIDI control, it is an unprecedented gateway to the sounds of these legendary instruments.
specs: |-
  - Dual-layer voicing architecture with 16 polyphonic voices per layer
  - Recreation of GX-1 and CS-80 filters
  - Four polyphonic voice ranks per layer
  - Sub oscillator LFO with sine, sawtooth, ramp, square, S+H, and noise
  - Ring modulator modeled on CS-80
  - Pitch ribbon controller
  - Over 1,000 presets
  - Effects: chorus/rotary, flange/phaser, digital/tape delay with sync, reverb
  - Velocity sensitive with polyphonic and monophonic aftertouch
  - Complete MIDI control and DAW automation
  - macOS 10.13 or above, Windows 7 or above (64-bit)
