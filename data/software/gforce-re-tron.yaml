description: A Mellotron tape replay keyboard emulation for Propellerhead
  Reason, with 40 exclusive tape banks sourced from Streetly Electronics
  including sounds never previously released in digital format.
details: |-
  Re-Tron brings GForce's M-Tron Pro technology to the Reason Rack Extension format, remaining faithful to the original Mellotron's 35-note, 8-second tape limitation. It features 40 premium tape banks from Streetly Electronics (the original British Mellotron manufacturer), including several banks never previously released in any digital format.

  The instrument supports dual-layer operation for mixing sounds, comprehensive synthesis and filtering per layer, tape reverse and half-speed functions, global Delay and Ensemble effects, and Reason's back-panel CV Gate control and Modulation Inputs & Outputs.
