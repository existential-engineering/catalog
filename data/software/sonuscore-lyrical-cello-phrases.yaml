description: If you've ever wanted to utilize the massive emotional force a cello contains, Lyrical Cello Phrases is the right heavy-hitter for you. Take your workflow, your productivity and creativity to the very next level.
details: |-
  Lyrical Cello Phrases is a solo cello phrase instrument built to put the emotional force of the instrument under a composer's fingers. Sonuscore describes it as the answer to a challenge set by a group of composers who wanted a cello tool that leveraged the strengths a real instrumentalist brings, and who named three things they look for in a new instrument: high quality sound, a workflow that keeps pace with their thoughts, and material that inspires new ideas. The result combines the creative freedom of a composer with the expressivity and emotionality of a live player.

  The themes were performed by cellist Mátyás Ölveti, whose playing has been recorded for Wednesday, Star Wars: The Bad Batch and The Elder Scrolls Online among others, and whose improvisatorial talent shaped the library's material. It holds over 70 freely combinable phrases spread across 10 themes throughout all keys, plus 2 additional bonus themes. A software update since release added the ability to change themes by key switch.

  Alongside the hand-crafted themes, a legato instrument is included so melodies can be played freely, with two different note lengths to choose from. That legato instrument is not included in the HALion version of the library.

  Sonuscore lists the library under its PHRASES series. The instrument runs in the full version of Native Instruments KONTAKT or in Steinberg's free HALion Sonic; the free Kontakt Player runs it in demo mode only. The library is available as a download.
specs: |-
  - Over 70 freely combinable, live-performed cello phrases
  - 10 themes throughout all keys, plus 2 bonus themes
  - Legato instrument with two different note lengths (not included in the HALion version)
  - Themes switchable via key switch (added by software update)
  - Performed by cellist Mátyás Ölveti
  - Requires the FULL version of Native Instruments' KONTAKT 5 (version 5.6.8 or higher) or Steinberg's free HALion Sonic
  - The free Kontakt Player is not sufficient: it only runs the instrument in DEMO mode
  - Mac OS X 10.9 or higher, Intel Core 2 Duo
  - Windows 7 or higher, Intel Core 2 Duo or AMD Athlon 64 X2
  - 4 GB RAM
  - At least 3.05 GB of free hard disc space
  - Available as download
