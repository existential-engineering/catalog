details: |-
  After two years of recording, editing, and programming, EastWest/quantum leap
  proudly present the most detailed collection of the world's finest grand
  pianos ever recorded in one of the 'temples of sound', EastWest studios (more
  riaa certified platinum and gold records awarded than any other recording
  studios) with 3 mic positions for each piano. This virtual instrument includes
  a bsendorfer 290 platinum.

  The play interface includes impulses from the same hall the producers used to
  record symphonic orchestra and symphonic choirs so the pianos can blend with
  those collections. Additional close mics version engineered by ken scott
  (elton john, supertramp, david bowie, beatles).

  Load any piano or mic position individually (each piano is approx. 60gbs). 3
  positions are included per piano for maximum flexibility. Repetition samples
  taken from 180 bpm performances for a true repetition sound and not simply an
  alternate take. Software detects true repetitions.

  Articulations on each piano include: a. Sustain. B. Sustain with pedal. C.
  Repetitions. D. Repetitions with pedal. E. Soft pedal. F. Soft pedal with
  sustain pedal. G. Staccato. H. Release trails.

  Recorded in a proper piano environment with vintage neumann microphones,
  meitner ad converters and a vintage 8078 neve console. Stereo swap possible in
  software. Mic position mixing in software. Lid position simulation.
  Articulation matrix for quick and straightforward loading. Most powerful
  streaming engine available with highest polyphony counts.
specs: |-
  - 3 mic positions per piano
  - 10-18 velocities per note sustain
  - 10-18 velocities per note sustain with pedal
  - 8-12 velocities per note repetitions
  - 8-12 velocities per note repetitions with pedal
  - 5-8 velocities soft pedal
  - 5-8 velocities soft pedal with sustain pedal
  - 16 velocity staccato
  - Pedal resonance recording
  - Release samples with software envelope follower
  - Stereo swap in software
  - Mic position mixing in software
  - Lid position simulation
  - Articulation matrix
  - Streaming engine with high polyphony counts
  - Bsendorfer 290 platinum piano
  - Vintage neumann microphones
  - Meitner ad converters
  - Vintage 8078 neve console
