description: >-
  Piano and keyboard virtual instrument built around a Fazioli F212 Grand Piano,
  featuring Bandmate auto-accompaniment, Tap2Find groove matching, AI chord
  suggestions, and a comprehensive MIDI library for songwriting.
details: |-
  EZkeys 2 is a piano and keyboard virtual instrument built around a
  Fazioli F212 Grand Piano recorded at Riksmixningsverket Studio in
  Stockholm, Sweden. It serves as both a high-quality piano plugin and
  a comprehensive songwriting tool.

  Key creative features include Bandmate for auto-accompaniment from
  audio or MIDI input, Tap2Find for groove matching via rhythm and note
  input, and Suggest Chords for AI-powered chord progression generation.
  The Songwriting Scales browser provides access to scales, modes, and
  moods.

  The built-in Grid Editor offers a piano roll MIDI editor with
  humanization and scale matching. Replace MIDI applies different
  playing styles to chord sequences. The Song Track enables direct
  recording and editing within the plugin.

  The core library includes 1,350+ professionally performed MIDI files
  plus 800+ legacy MIDI files. EZkeys 2 is expandable through EKX
  sound expansions (additional keyboard instruments) and EZkeys MIDI
  packs.
specs: |-
  - Core instrument: Fazioli F212 Grand Piano
  - Recorded at Riksmixningsverket Studio, Stockholm
  - 1,350+ core MIDI files plus 800+ legacy MIDI files
  - Bandmate auto-accompaniment from audio/MIDI input
  - Tap2Find groove matching
  - Suggest Chords AI chord progression generation
  - Grid Editor with humanization and scale matching
  - Mix-ready presets with effects
  - Resizable interface
  - Multi-out option for external processing
  - 5 GB free disk space (plus 4 GB for download)
  - 4 GB RAM minimum, 8 GB+ recommended
  - Windows: 64-bit Windows 10 or newer
  - macOS: 10.13 or higher (Intel or Apple Silicon)
