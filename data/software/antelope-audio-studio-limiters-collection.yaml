description: "Bring a unique element to your projects by adding a new layer to
  your mix with OPTO 2A, SMT-100A, Tubechild670, FET-A78 and BAE 10DCF."
details: |-
  The Studio Limiters Collection is a Synergy Core effects bundle pairing five vintage-inspired limiter/compressor plugins. Antelope positions it as a flexible toolbox for giving tracks a vintage feel and shaping drums, guitars, vocals, or anything else with ease.

  The bundle includes the OPTO 2A tube optical compressor/limiter (smooth on vocals), the 1980s-style SMT-100A with fast attack times for vocals, drums, and bass, the BAE 10DCF late-1960s stereo compressor/limiter with separate limiter and compressor controls, the Tubechild670 Vari-Mu tube compressor/limiter modeled after a sought-after 1950s unit, and the FET-A78 FET compressor/stereo peak limiter for instruments and full mixes.

  The plugins run natively in any DAW on macOS or Windows, and can also process audio in real time when used with an Antelope Audio Synergy Core interface.
