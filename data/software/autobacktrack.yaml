details: |-
  AutoBacktrack allows any guitar player to record tracks with their guitar
  using any combination of over 100 effects plugins included, and at the same
  time lets them play a large variety of other musical instruments with their
  guitar.

  The application is also compatible with a wide array of third-party plugins.
  Autobacktrack's note and chord detection system will convert a guitar signal
  into unlimited numbers of instruments simultaneously and in real time, with
  out any special hardware.

  Getting started with autobacktrack is easy. Just connect your guitar to your
  pc through the mic input or by using a USB converter. Configure your audio
  settings. Select your effects and connect those using virtual cables. Select
  your output options such as headphones, speakers and recorder. Select any
  instruments to play through your guitar and you're ready to record your
  backing tracks as simple or complex as you like.
