description: pure:unmask is an AI-powered plug-in that uses spectral unmasking
  to prevent two tracks from interfering with each other in the frequency
  spectrum. It creates space in one track for another with minimal setup.
details: |-
  pure:unmask addresses one of mixing's most vital components, finding space within one track for another, and reduces it to a short setup. The plug-in is loaded on the channel that needs to make space, a sidechain input is routed from the prioritized channel, and a profile matching the sidechain signal is selected.

  AI-powered processing and spectral unmasking are the driving forces behind the plug-in. Together those technologies combine two competing elements of a mix without pumping artifacts, so the result stays clear rather than audibly ducked.

  Four controls refine the processing. Unmasking is the large central knob that increases or decreases the overall effect, Resolution defines the width of the spectral processing bands at work, and Speed shortens or lengthens attack and release times, tailoring the effect either to slower harmonic contexts (piano against guitar) or to faster rhythmic ones (kick against bass). The Range control restricts the unmasking process to a given low-frequency and high-frequency range.

  Authorization is machine-based or via iLok, and Apple Silicon is supported natively. Sample rates from 44.1 kHz to 192 kHz are supported.
specs: |-
  - Automatic parametrization for high-quality results
  - AI-powered processing with sidechain-specific profiles
  - Spectral unmasking between a track and a sidechain source
  - Unmasking knob for the overall amount of the effect
  - Resolution control for the width of the spectral processing bands
  - Speed control for attack and release times
  - Range control to limit processing to a low-frequency and high-frequency range
  - Plug-in formats (Mac): VST, VST3, AU, AAX
  - Plug-in formats (Windows): VST, VST3, AAX
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok
  - Apple Silicon support: native
  - Windows: Windows 10 (64 bit)
  - macOS: 10.14
  - CPU: Intel Core (i5) and Apple Silicon
  - GPU: OpenGL version 3.2 or later
