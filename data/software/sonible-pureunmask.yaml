description: pure:unmask prevents, thanks to spectral unmasking, any audio interference in the frequency spectrum between two tracks.
details: |-
  pure:unmask makes short work of one of mixing's most vital components, finding space within one track for another, and it does so with minimal setup. The plug-in is loaded on the channel that needs to make space, a sidechain input is routed from the prioritized channel, and a profile that fits the sidechain signal is selected.

  AI-powered processing and spectral unmasking are the driving forces behind pure:unmask. Together, these technologies are able to perfectly combine two competing elements of a mix without any pumping artifacts.

  The processing can be refined via four controls. Unmasking is the large central knob that lets you increase or decrease the overall effect. Resolution allows you to define the width of the spectral processing bands at work. The Speed parameter lets you either shorten or lengthen attack and release times, tailoring the unmasking effect to slower, harmonic contexts (piano vs guitar) or to faster, rhythmic contexts (kick vs bass). The Range control restricts the unmasking process to within a given low-frequency and high-frequency range.

  The plug-in runs on macOS and Windows as VST, VST3 and AAX, with AU on the Mac, and Apple Silicon is supported natively. Authorization is machine-based or via iLok, and sample rates from 44.1 kHz to 192 kHz are supported. A fully-functional 30-day demo is available after registration.
specs: |-
  - Automatic parametrization for high-quality results
  - AI-powered processing and sidechain-specific profiles
  - Unmasking and range control, resolution and speed adaptation
  - Unmasking knob sets the overall amount of the effect
  - Resolution control defines the width of the spectral processing bands
  - Speed control shortens or lengthens attack and release times
  - Range control limits processing to a low-frequency and high-frequency range
  - Plug-in formats (Mac): VST, VST3, AU, AAX
  - Plug-in formats (Windows): VST, VST3, AAX
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok
  - Apple Silicon support: native
  - PC: Windows 10 (64 bit)
  - Mac: macOS 10.14
  - CPU: Intel Core (i5) and Apple Silicon
  - GPU: OpenGL version 3.2 or later
