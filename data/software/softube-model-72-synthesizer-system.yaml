details: |-
  Based on a classic analog monophonic synth from the early '70s, with the emphasis on sound quality. Softube's Model 72 Synthesizer System is component modeled down to the smallest details from 1972 hardware in pristine condition with all the quirks and non-linearities intact, hence the name Model 72. The result is incredibly authentic sound, with all the warmth and smoothness heard in countless records.

  Model 72 is based on a fully modeled vintage monophonic synthesizer that has been a true legend in music instrument history since its introduction in 1970. Affordable, easy to use, and small enough to carry around to studios and gigs, it was the first synthesizer designed for and accessible to musicians and became the archetype for all synthesizers that followed. The sounds it produces can be warm, lush, and luxurious or fat, distorted, and gnarly but not at all ear-piercing.

  The software components of Model 72 were measured and matched down to the smallest details from the original hardware, keeping all of its quirks and non-linearities intact. For example, one trick that's commonly used on the hardware version is connecting a cable from the high-gain output to the external input of the unit to create a roaring, raw, and exciting feedback tone heard on countless records. Obviously, Softube had to add this feature to the Model 72 Instrument plug-in.

  The tone generator is the heart of Model 72. This section consists of 3 oscillators, with the top two identical in terms of output waveforms and features and linked to the incoming note information. The third oscillator can be unlinked from the incoming note information and used as a free-running modulation oscillator with extended tuning range on the tune knob, and also features slightly different waveforms. The combined signals from the mixer enter a voltage-controlled 4 pole low-pass filter with resonance control (feedback), shaped by dedicated envelope generators and a separate modulation section.

  An entire system that includes a model of the original instrument, an FX version, an Amp Room module, and seven Modular modules. The Model 72 FX plug-in replicates the external input feature, letting you run an external sound source through the synth's distortions and filter. The Amp Room module is the fat sounding filter from this legendary synthesizer complete with envelope follower, cutoff, resonance, and drive. All the Model 72 Instrument sections are also available as individual modules for Softube Modular.
specs: |-
  - An entire system based on a classic analog monophonic synth from the early 1970s with the emphasis on sound quality
  - Era correct: component-modeled to perfection, with all the quirks and non-linearities intact, it sounds and behaves just like its original hardware counterpart
  - Actual use cases and tricks of the hardware correctly replicated in the software
  - Four versions included: Model 72 Instrument, Model 72 FX, Model 72 module for Softube Amp Room, and seven Model 72 modules for Softube Modular
  - Create combinations in Modular never possible before in real life or in the world of software
  - Software-exclusive features added: doubler, stereo spread effect, and expanded controls
  - Tone generation section with 3 oscillators, the third unlinkable for use as a free-running modulation oscillator with extended tuning range
  - Mixer section with 5 switches for turning the different sound sources on and off into the filter and amp sections
  - Voltage-controlled 4 pole low-pass filter with resonance control (feedback) and cutoff knob
  - Two envelope generators with attack, decay, and sustain knobs, one shaping harmonic content and one shaping amplitude
  - Modulation section with master tune, note glide rate, modulation mix, oscillator 3 or noise as source, plus an added dedicated LFO, routable to oscillator pitch, filter cutoff, or both
  - Output section with master volume, A440 tuning guide tone (440 Hz sine), doubling, and spread knob
  - Feedback loop trick from the hardware, running the high output to the external input for overdriven, distorted tones
  - Amp Room module with envelope follower (fast and smooth modes), cutoff, resonance, drive, and mix
  - Requires a Softube account and an iLok account (no physical iLok required)
  - 20-day trial, 14-day returns, three activations
