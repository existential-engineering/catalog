description: Peacock is a vinyl-emulation plug-in that can be used on a stereo
  bus to recreate the classic vinyl sound, or on individual tracks to add large,
  fat harmonic character and a smooth vintage quality to vocals and other
  instruments.
details: |-
  Peacock can be used on a stereo bus to create the classic vinyl sound. On individual tracks it is also very useful in creating large fat sounds, smoothing of the harmonic content and making a nice smooth vintage sound on vocals and other instruments.

  There are three main controls: Harmonic, Dynamic and Color. The Harmonic and Dynamic controls interact and control the level of the harmonic distortion. The Color switch changes the character/interaction of the controls and sets the maximum amount of midrange/LF color and the HF compression characteristic. The Dynamic control is the tricky one: it time modulates the distortion components, which are very frequency dependent due to the RIAA curve.

  There are two main components that cause time modulation in a vinyl record. The first is due to the cutter and the playback stylus not having the same shape, called tracing distortion; the other is tracking distortion, due to the playback system's mis-alignment and its inability to perfectly follow the groove in the record.

  The Dither control adds noise with the spectrum of record noise. It modulates some of the internal functions and adds dither to the audio path at a level for 16-bit dithering.

  Color = Gold is an extremely close match to the test material, which is a record and the original wave file. It has been optimized at 96K but will work fine at other sample rates. The Silver setting is lighter, and coloring increases in the order Silver, Gold, Rich, Fat, Deep; Silver is also the brightest setting.
specs: |-
  - Controls: Harmonic, Dynamic, Color, Output Trim, Dither
  - Color settings (brightest to darkest): Silver, Gold, Rich, Fat, Deep
  - Dither control adds 16-bit dithering noise shaped like record noise
  - Optimized at 96kHz, works at other sample rates
  - Runs as AAX only
  - Requires iLok2
