details: |-
  The 1970s hayman vibrasonic kit - bfd pack as mixed by stephen street (blur / the smiths) is an expansion pack for bfd3, bfd eco and bfd2. If you own any of these versions of bfd and want a versatile classic british 70s kit as mixed by one of the uk's mix engineers then look no further.

  This hayman kit is a great representation of a classic british 70s kit. Hayman only existed for about 15 years but they built some great kits in that time, mainly to counter the american kits such as ludwig and gretsch that were being imported.

  The particular kit we sampled is from around 1970 and was their standard five piece kit comprising of a 22" x 14" bass drum, 12" x 8" and 13" x 9" toms and a 16" x 16" floor tom. It's in a rather fetching metallic blue finish, though you might not be able to tell this from the samples.

  The snares that we sampled with this kit are two of the best ever produced... The metal shelled ludwig 400 and the wooden slingerland radio king. The cymbals used were all old sixties and seventies models commonly used at the time. The hihats were made by an english company called zyn. The ride we used is an old tosco 20" ride, thin and washy but with just enough ping to let rhythms cut through. The crash we used is made by paiste a swiss company, and this is an 18" medium from their popular 2002 range which was introduced in the 1970s.

  The 1970s hayman vibrasonic kit bfd pack has been designed as a licensed expansion pack for bfd eco, bfd2 or bfd3. The pack includes up to eighty velocities of each articulation totalling 8280 samples. The pack also contains a number of 70s americana MIDI grooves.
specs: |-
  - Expansion pack for bfd3, bfd eco and bfd2
