description: Golden58 is a two-channel tube preamp and saturator plugin built
  with AudioScape Engineering, based on a limited-run hardware unit using the
  5879 tube and four NOS transformers per channel.
details: |-
  Working in collaboration directly with AudioScape Engineering, we're proud to bring you the software version of this legendary tube preamp with the Golden58 Plugin. The limited-edition Golden58 hardware was a six-tube, four-NOS-transformer deep dive into big-tone , reminiscent of late 1950's tube tech. Originally fated to be a limited run, you can now have access to it digitally, forever! Download it today and try it for yourself! Iconic Tube Preamp and Saturation In Your DAW

  The hardware version of the Golden58 was always fated to be a limited run. Using parts like four NOS transformers per channel, and hard to source 5879 tubes ensured that. New enhancements have been added to the plugin like an Auto-Gain control for more consistent output levels as well as Output Trims, which give the user even more control over the saturation!
