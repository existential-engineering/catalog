details: |-
  The Story of the Perfect Piano

  The 1928 Piano began as a dream of finding the perfect grand piano. A piano with a unique voice of its own. A voice that immediately sweetens the ear and grabs the heart. From the softest stroke of silk to the hammering hands of a rockstar. A voice that sounds mature. Like a perfectly aged singer. Easy, right? We traveled to all the major Piano stores in the greater San Francisco Bay Area and audited over 400 grand pianos. We tried them all. The big, modern, opulent grands. Exotic Pianos. Vintage pianos. The small and intimate felt uprights. But it all culminated on the third cellar floor of the San Francisco Steinway store. An old, brown vintage Steinway from 1928 that was protected under a thick dust cover. It was dusty and forgotten, but the piano caretaker had to keep tuning because he loved it so much.
