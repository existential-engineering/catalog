details: |-
  Record your ideas on the go or create entire music productions from scratch.
  This app is a portable multitrack audio and MIDI recording studio featuring
  virtual instruments, pitch and time editing of vocals, unlimited undo/redo,
  mixing, real-time effects, automation and much more.

  Automatically or manually tune your vocals with vocal tune studio: an editor
  to correct pitch and time of vocal recordings and the timing of any audio
  material. It features retune time, retune amount, volume and formant
  correction per note as well as vibrato controls.

  Virtual analog synthesizer 'evolution one' featuring morphing oscillators, fm,
  sub osc, noise, portamento, 2 lfo's that can be routed to 12 targets, moog
  type filtering, effects, arp, sequencer and more.

  Flexible effect routing: an unlimited number of effects can be placed on a
  grid, featuring parallel effect paths. Assign lfo's to effect parameters or
  lock parameters to tempo. Sidechain on the compressor effects.

  In short: a complete portable multitrack music studio that will replace your
  fourtrack recorder or tape machine.
specs: |-
  - Multitrack audio recording/playback

  - MIDI sequencing with piano roll editor and mpe support

  - Drum pattern editor (including triplets)

  - Vocal tune studio with pitch and time correction

  - Retune time, retune amount, volume and formant correction per note

  - Vibrato controls

  - Tempo and time signature changes including gradual tempo change

  - Real-time effects: chorus, compressor, delay, dual delay, reverse delay,
  reverb, flanger, noise gate

  - Flexible effect routing with unlimited effects on grid

  - Parallel effect paths

  - Lfo assignment to effect parameters

  - Parameter locking to tempo

  - Sidechain on compressor effects

  - Inter-app audio effects and instruments

  - Audiobus support (including audiobus remote)

  - Audio unit instruments, effects and AU MIDI

  - Virtual analog synthesizer 'evolution one'

  - Morphing oscillators, fm, sub osc, noise, portamento

  - 2 lfo's routable to 12 targets

  - Moog type filtering

  - Arp and sequencer

  - Soundfont (sf2/sfz) support

  - Free gs/gm soundfont included

  - Non-linear editing: move, trim, split, cut/copy/paste, remove, cross-fade,
  time-stretching

  - Full undo/redo

  - Virtual instruments with free instruments included

  - Track freezing

  - Clip volume and fade points

  - Loop playback

  - Automation of mixer and effect parameters

  - Mix-down to wav, aiff and alac

  - Metronome

  - MIDI clock sync

  - MIDI remote control

  - Punch in/out

  - Unlimited number of tracks and groups

  - Offline effects: fade in/out, normalize, reverse, pitch shift, time
  stretching

  - Grid options for sample alignment

  - Export to other DAW's by rendering stems

  - Media server for desktop file access

  - Audioshare support

  - Cloud sync using google drive and dropbox

  - Unlimited undo/redo
