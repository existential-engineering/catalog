details: |-
  JST Extra Spice: Add Richness and Depth to Your Mixes
  Overview
  Introducing JST Extra Spice, the perfect solution for adding harmonic complexity and analog warmth to your tracks. Derived from the popular JST Heat plugin, JST Extra Spice offers a specialized, easy-to-use tool designed to enhance your mixes with frequency-dependent saturation. Whether you're working on a flat-sounding master or looking to add subtle enhancements to individual tracks, JST Extra Spice delivers the richness and depth your music deserves.
  Hear It In Action
  Check out these audio examples to experience the transformative power of JST Extra Spice on various tracks. From subtle enhancements to full-on transformations, JST Extra Spice provides the versatility you need to take your productions to the next level.
  Features - Inject Your Tracks With Life With JST Extra Spice
  Custom Circuit Design
  JST Extra Spice features a custom circuit that brings a unique flavor to your sound. This circuit is designed to introduce harmonic complexity and movement, giving your mixes a professional and polished finish.
  Frequency-Dependent Saturation
  The frequency-dependent saturation in JST Extra Spice allows you to target specific frequency ranges, adding warmth and depth where it's needed most. This feature ensures that your tracks have the perfect balance and richness across the entire frequency spectrum.
  Global Heat Adjustment
  Dial in the overall effect intensity with a master Heat knob, blending processed and unprocessed signals seamlessly.
  Tone Shaping Controls
  Customize your sound with JST Extra Spice's comprehensive tone shaping controls. Adjust controls such as Heat, Spice, Tone, and filters to create a sound that perfectly fits your track. The tone knob lets you find the right balance between low and high frequencies, while the filters help you sculpt your sound to perfection.
  Easy-to-Use Interface
  The intuitive user interface allows you to effortlessly achieve professional results. The straightforward controls make it easy to dial in the perfect amount of distortion and tone shaping, whether you're a seasoned producer or just starting out.
  Parallel Processing
  JST Extra Spice includes parallel processing, allowing you to blend the processed signal with the original signal. This feature gives you more control over the final sound, enabling you to add subtle enhancements or completely transform your audio.
  Latency-Free and CPU-Efficient
  Designed to integrate seamlessly into your workflow, JST Extra Spice operates with zero latency and minimal CPU usage. This efficiency allows you to use multiple instances of the plugin without compromising performance, making it perfect for complex sessions.
  Professional Quality Sound
  JST Extra Spice brings the analog warmth and digital precision of the original JST Heat plugin into a specialized tool for harmonic enhancement. Inject life and movement into your tracks with analog-modeled saturation that gives your tracks the full-bodied low end and sparkling high end found in professional mixes masters.
  Upgrade Your Tracks With Richness and Depth Today
  Ready to add richness and depth to your mixes? Download JST Extra Spice today and elevate your sound to a new level of professionalism. Whether you're working on individual tracks or mastering a full project, Extra Spice is your secret weapon for achieving a polished, professional sound.
  Saving and Managing Presets
  Explore Factory & Artist Presets: Broken down by category and/or use-case, these pre-made presets can be really helpful for quick results and exploring the plugin.
  Create Custom Presets: Save your finely tuned settings as new presets for future sessions, ensuring quick recall of your signature sounds.
  Share & Download User Presets: Check online for other users’ presets in the Joey Sturgis Tones forum on Facebook!
