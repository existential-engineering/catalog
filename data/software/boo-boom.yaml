description: Boo boom is a slot based drum sampler. It uses 20 wave file sample
  slots to build 20 drum components drum kits.
details: |-
  Boo boom is a slot based drum sampler that uses 20 wave file sample slots to
  build 20 drum components drum kits. According to this approach, every slot can
  be anything, from kick to cymbals. Each slot is triggered by its own unique
  MIDI note which noted on its button (for instance, slot 48 is triggered by
  note number 48 in the MIDI keyboard).

  The samples menu is divided into 14 categories, including a wide range of drum
  kit components types. Each type button (kicks, snares, claps, etc.) is
  directing to its own sample library folder which located at
  "c:\users\yourname\documents\fananteam\boo boom\core". Each folder has a room
  for 150 samples. All the samples are replaceable with the user's ones
  manually.

  Boo boom comes with 30 full drum kits to start with. It has also a built-in
  mixer that allows tweaking any sample separately with an eq, pitch shifter,
  pan and new random pitch based round robin approach that has a wide control
  ability on the final sound. The mixer is also armed with 3 master effects
  (compressor, reverb, delay).

  Boo boom can also be expanded to up to 20 "physical" outputs in the d.a.w
  (20out mode). In this mode, every slot gets its own separated channel in the
  d.a.w mixer and allows manipulating every sample separately (the master
  effects are disabled in this mode).

  Boo boom loads drum kits extremely fast and uses a "one button press" preset
  manager which allows a super-fast presets switch. It also allows tweaking the
  range of keyboard octaves and tweaking or firing up the master effects by
  using macro knobs and buttons. Boo boom uses 24 presets drum kit banks. Each
  preset represents a full drum kit.
specs: |-
  - 20 wave file sample slots
  - 14 sample categories
  - 150 samples per category
  - Built-in mixer with EQ
  - Pitch shifter
  - Pan control
  - Random pitch based round robin
  - 3 master effects (compressor, reverb, delay)
  - Up to 20 physical outputs (20out mode)
  - 24 presets drum kit banks
  - MIDI note triggering
  - Windows compatible
  - Macro knobs and buttons
  - Keyboard octave range adjustment
