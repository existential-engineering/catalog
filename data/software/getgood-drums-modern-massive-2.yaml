description: Modern & Massive 2 is a standalone virtual instrument billed as the
  new standard in rock and metal drum production. It features proprietary
  Fluid+™ technology, a comprehensive mixer with studio effects, 100+ mix
  presets, and 1500+ MIDI grooves for realistic drum production.
details: |-
  Used by top producers on countless hit records and bedroom enthusiasts alike, the original Modern & Massive helped define the sonic landscape of modern rock and metal. Building on its iconic legacy, we are excited to introduce Modern & Massive 2, an all-new virtual instrument and the first to be launched on our native standalone platform.

  Offering modern workflows from installation to mix, Modern & Massive 2 is filled with many new and powerful features to step up your production no matter your experience level. From our proprietary Fluid+ technology, humanization features and robust mixing tools, there is much to experience. Fluid+ is a proprietary feature of our sampler engine that realistically models the way that drums, cymbals and recording spaces react during live drum performance.

  Modern & Massive 2 is bigger than its predecessor, with extra tom and crash positions and a larger selection of instruments: 9 snares, 7 kicks, 4 sets of toms and 21 cymbals. The drums are each chosen for their unique sonic qualities and tuned expertly to not only sound incredible, but to offer differing drumhead-type, pitch and muffling options to suit each production you work on. The cymbals' sonic signature can often define the sound of a library, here you have three distinct, amazing-sounding arrays by multiple brands so that you can radically alter the sound of your setup.

  Modern & Massive 2 was expertly captured by Adam Nolly Getgood, best known for his genre-defining work with bands such as Architects, Sleep Token and Periphery. Meticulously sampled by drummer extraordinaire Mike Malyan at the acclaimed Middle Farm Studios, Modern & Massive 2 has its predecessor's exciting energy and explosive ambience, yet with hugely increased dynamics, it is far more organic and enveloping when required.

  This instrument is a standalone plug-in and no additional software is required. Installation and activation is managed via the Cradle Hub.
