details: >-
  Ams-toolspro is a multi-band "mid-side" tool. Using this tool you can encode
  left-right stereo channels to mid-side, decode mid-side to left-right and
  adjust mid-side balance separately for 4 bands.


  Ams-toolspro will make your sound wider.
specs: |-
