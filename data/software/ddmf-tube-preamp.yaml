description: A free tube preamp emulation plugin with full control over circuit modeling, featuring adjustable capacitors, resistors, and triode-based preamplifier stages. Originally developed by Philipp Bulling.
details: |-
  Triode model based on characteristic curves of real tubes
  Cathode biasing with adjustable RC parameters
  Signal limiting via tube cut-off and grid current modeling
  Drive and gain controls for constant amplification
  User-adjustable circuit component values
  Two cascaded preamp stages
specs: |-
  - Two plate follower stages in series
  - Triode model based on characteristic curves of real tubes (e.g., 12AU7)
  - Tube cut-off clipping modeling
  - Grid current clipping modeling
  - Adjustable capacitors, resistors, and bias point
  - Drive and gain knobs for constant amplification control
  - Cathode biasing with RC low-pass filter modeling
  - 32-bit and 64-bit support
  - Mac Intel and Apple Silicon support
  - Linux ARM (aarch64) and x86_64 support
  - Free under MIT license (personal and commercial use)
