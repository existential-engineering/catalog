details: |-
  Triode model based on characteristic curves of real tubes
  Cathode biasing with adjustable RC parameters
  Signal limiting via tube cut-off and grid current modeling
  Drive and gain controls for constant amplification
  User-adjustable circuit component values
  Two cascaded preamp stages
