description: Opto compressor plugin inspired by the Teletronix LA-2A. Smooth, program-dependent leveling for vocals, bass and bus.
details: |-
  Inspired by the Teletronix LA-2A: the optical leveling amplifier that turned "set it and forget it" into a genre. The VLA-2A is an opto compressor built around a faithfully modelled T4A photo-cell, matched against an original '68 reference unit.

  The VLA-2A is a vintage opto compressor, and it behaves like one, nothing like a modern digital comp with a threshold slider and a stopwatch. There are two knobs that matter and one switch. Peak Reduction decides how hard the T4A cell clamps down, Gain makes up what you lost (and pushes the tube stage into saturation when you want it), and the Ratio switch chooses between Limit and Compress. The optical cell reacts to the program itself rather than to a fixed attack and release you dialled in.

  The LA-2A was born in the early 1960s and never really left the racks of serious studios. Its trick was the T4 electro-optical attenuator: a light source glued to a photoresistor, its glow driving how much the signal gets pulled down. The VLA-2A rebuilds the whole path with real-time, SPICE-style circuit simulation: the input and output transformers, the sidechain and audio-path tube stages, the emphasis filter network and, at the heart of it, the T4A cell.

  On its default Compress setting the ratio is gentle and the knee soft, so vocals sit forward without pumping. Flip to Limit and it grips harder for peaks that refuse to stay put. The Gain knob isn't just make-up: turn it up and the tube amplifier adds a layer of even-order harmonic warmth.

  Lead vocals are where the VLA-2A earns its keep, dialing Peak Reduction until the loudest lines pull back a few dB. On bass it evens out inconsistent playing while the transformers add weight, and it suits a mix bus or stereo submix where cohesion is wanted over squash.
