details: |-
  Controlling the dynamics of your parts and recordings is an essential step
  towards a professional sounding mix. With BLEASS Compressor's powerful
  performance and intuitive user interface, such pro-grade dynamics control has
  never been easier.

  Bleass compressor's flexible dynamics engine makes it an ideal choice in many
  different situations. With compression ratios of up-to 60:1, a variable knee,
  and flexible attack and release stages, bleass compressor can deliver a wide
  range of different response characteristics.

  The plug-in's flexibility is further enhanced by a powerful dual filter that
  operates on the analysed signal, providing both low-pass and high-pass
  filtering. The filters work on both internal and sidechain signals, and are
  resonant too, making it easy to create dynamics effects that are highly
  frequency dependant.

  Despite its versatility and power, bleass compressor is simple to setup and
  work with. Compression and filter curves are set using tactile graphical
  widgets, whilst you receive constant easy-to-read visual feedback about how
  the plugin is operating.

  Bleass compressor is ultra-efficient, so you can include its intuitive
  dynamics control to any-and-every part that needs it.
specs: |-
  - Compression ratios up-to 60:1
  - Variable knee
  - Flexible attack and release stages
  - Dual filter
  - Low-pass filtering
  - High-pass filtering
  - Resonant filters
  - Sidechain signal filtering
  - Internal signal filtering
