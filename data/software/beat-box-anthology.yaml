details: |-
  The first drum machines were manufactured in the 60's, designed to imitate the
  sounds of drums and percussion instruments. These drum machines utilized
  analog synthesis and typically offered few options for customizing their
  sound. In the 80's we began to see drum machines use low resolution digital
  samples - these quickly became popular and were used pervasively throughout
  pop music and the growing hip-hop movement. In the 90's, with the continuing
  development of technology, we saw great improvement in sound quality - where
  machines became much more capable but conversely, as their specifications
  improved, they began to lose some of the character that made their
  predecessors so great.

  With beat box anthology we've set out to capture a full spectrum of these
  machines - allowing you to instantly call up the analog classics or newer
  digital models. Including cult machines to lesser known and rare models that
  saw very small production runs, giving you a huge diversity of sounds and
  character at your disposal.

  Each of the 80 machines we processed was sampled at 24-bit / 96 khz using the
  very best di boxes and adcs. In addition to precise captures of these sounds
  we had the entire library of over 9,000 samples individually mastered by chris
  gerhinger at sterling sound resulting in an immediate, punchy, world-class
  sound you won't find anywhere else.

  Beat box anthology by uvi is a virtual instrument audio plugin and soundware
  (samples or presets that load into other products) for macos and windows. It
  includes, and is therefore "powered by", uvi workstation, which functions as a
  VST plugin, an audio units plugin, a VST 3 plugin and an AAX plugin.
specs: |-
  - 24-bit / 96 kHz sampling
  - 80 drum machines
  - 9,000+ samples
  - macOS compatible
  - Windows compatible
