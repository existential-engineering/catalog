details: |-
  Auricula Ear Training Plug-ins are designed for audio producers & engineers.
  You provide an audio file and the auricula plug-in will manipulate the sound
  automatically in some way - it's then up to you to make a guess and see if you
  heard what changed. Your scores will improve the more you practice and you'll
  become a better listener.

  Helices helps you develop aural skills by using standard filters to effect the
  timbre of a signal. Specifically, you can drill using five filter types over a
  ten octave range. The filters include: boost filter, bandpass filter, notch
  (band reject) filter, high pass filter, and low pass filter.

  Helices pro narrows the affected band of frequencies to 1/3 of an octave,
  picking up where helices leaves off. The filters include: boost filter,
  bandpass filter, notch (band reject) filter, high pass filter, and low pass
  filter.

  Concha challenges you with infinite variability in eq training. Center/cutoff
  frequency, boost/cut, and q can all be under your control. You may even have
  to select one of five filter types. The more choices you give yourself, the
  harder it becomes to match your eq's sound to the target eq's sound.

  Meatus simulates different acoustic environments, such as concert halls, echo
  chambers, rooms and more. Your source material will sound as if it were
  actually recorded in a different space. Meatus also simulates different
  artificial reverbs and is best used on individual tracks, not mixes.
specs: |-
  - Five filter types
  - Ten octave range
  - Boost filter
  - Bandpass filter
  - Notch (band reject) filter
  - High pass filter
  - Low pass filter
  - EQ training with Hz measurement (nearest octave)
  - EQ training with Hz measurement (nearest 1/3 octave)
  - Stereo field analysis
  - Gain changes in dB
  - Time delay in msec
  - EQ with Hz, dB, q parameters
  - Reverberation simulation
  - macOS compatible
