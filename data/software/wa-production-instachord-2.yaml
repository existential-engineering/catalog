description: A MIDI processing plugin that builds chords and chord progressions, pairing a chord creator with a pattern editor and mini-sequencer. Expands the original InstaChord with a pattern editor, generative sequence creation, custom chords and MIDI drag and drop.
details: |-
  InstaChord 2 is a MIDI processing plugin for creating chords and chord progressions. It expands the original InstaChord into a chord creator and mini-sequencer, so a single pattern can play a whole progression in any musical key, note combination and voicing. It is aimed at songwriters and producers looking to speed up the creation process, and at players learning harder chord shapes.

  The Pattern Editor is a dedicated interface window where notes are dragged around in the same way as in a DAW. It covers time signature, play mode and velocity, with editing controls for strum programming, and supports arpeggios, chord parts and riffs. MIDI can be dragged from the Pattern Editor straight into a DAW.

  A generation button, adapted from the maker's InstaComposer plugin, takes the existing scale and produces new riffs using algorithms and a degree of randomization. Generated ideas can be tweaked in the same way as user-created patterns.

  Over 60 chord shapes cover inversions, voicings, augmentations and extensions. Up to 24 chords can be set and switched between using the chord keys, and the current chords can be transposed to another key. Existing chords can be edited, and custom chords can be built by selecting intervals between notes or played in from a MIDI keyboard for the plugin to learn.

  Five hold modes cover different behaviour for holding notes and toggling chords. Action keys integrated into the main playback keys transpose by octave or semitone while playing live. Interface size, playback type, key configuration and key position are all configurable, and the chord and action keys can be locked so they do not change when presets are loaded. Factory presets cover both chord sequences and patterns, suited to keys, guitars and synths, and all InstaChord 1 presets remain compatible.
specs: |-
  - MIDI processor for chords, strums and patterns
  - Connects to any sequencer
  - Pattern editor covering time signature, play mode and velocity
  - Generative chord sequence and pattern creation
  - Five hold and playback modes
  - Editable and custom chords, with MIDI chord learn
  - MIDI drag and drop to the host DAW
  - Over 60 chord shapes with multiple voicings
  - Up to 24 chords assignable to chord keys
  - Action keys for octave and semitone transposition
  - Resizable interface
  - Factory presets for chord sequences and patterns
  - Compatible with InstaChord 1 presets
  - PDF manual and tutorial video
  - Windows 10 or 11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - Requires a host supporting VST or AAX with MIDI routing, or the AU MIDI effect type
  - Not compatible with Maschine 2 or Reason, which provide no MIDI routing
