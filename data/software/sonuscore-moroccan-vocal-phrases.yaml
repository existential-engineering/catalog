description: Discover Moroccan Vocal Phrases featuring Nadia Kaawad, designed to enrich your soundtracks with the rich and powerful vocal traditions of Morocco, bringing a unique human dimension to your music. The library contains 580+ live-performed vocal phrases organized into 9 main themes plus 2 bonus themes, spanning Gnawa, Malhun, Andalusian, Chaabi, Amazigh, and Aita styles.
details: |-
  Moroccan Vocal Phrases is a solo vocal phrase instrument built around the traditional singing of Morocco, aimed at composers who want an authentic human voice at the centre of a cue. Rather than sustained vowels or isolated syllables, the library is made of expressive live-performed phrases, which the page frames as capturing true human musicality in authentic artistic performances, immediate in emotional impact and open to being used well outside a Moroccan setting for cross-cultural fusion.

  All vocals are performed by Nadia Kaawad, a singer from Essaouira on the Moroccan coast, known for her work in Gnawa, Andalusian and Malhun styles. She spent her early years singing in improvisatory and traditional groups before travelling to Yerevan to perform at international music festivals, and now lives in Sao Paulo, Brazil, where she performs regularly at clubs, festivals and other events.

  The library carries over 580 different live-performed phrases organised into 9 main themes and 2 bonus themes, each theme offering a distinct style and a set of powerful, emotional phrases. Stylistically it spans Malhun, Gnawa, Andalusian music (Al-Ala), Chaabi, Amazigh (Berber) music and Aita, from the poetic and classical to the lively and celebratory. Every theme is recorded in 4 different keys, so pitch shifting stays minimal and the same musical material remains playable in all chromatic keys. Each theme includes 15 unique phrases and 2 brief endings, split into 5 separate starting, middle and end phrases that can be recombined freely.

  The instrument is a phrase player with Sonuscore's phrase builder: a main page for choosing phrases and matching them to a track, and an FX page giving complete control over the EQ. It runs in the full version of Native Instruments KONTAKT or in Steinberg's free HALion Sonic.
specs: |-
  - Over 580 different live-performed vocal phrases
  - 9 full themes plus 2 bonus themes
  - 15 unique phrases and 2 brief endings per theme, split into 5 starting, middle and end phrases
  - All themes recorded in 4 different keys, playable in all chromatic keys with minimal pitch shifting
  - Traditional Moroccan styles: Malhun, Gnawa, Andalusian (Al-Ala), Chaabi, Amazigh (Berber) and Aita
  - Solo vocals performed by Nadia Kaawad
  - Phrase builder plus main page and FX page with full EQ control
  - Requires the FULL version of Native Instruments' KONTAKT 6.8.1 or higher, or Steinberg's free HALion Sonic
  - The free Kontakt Player is not sufficient: it only runs the instrument in DEMO mode
  - HALion Sonic is currently not compatible with Notion by PreSonus
  - macOS 10.14 or higher, Intel Core i5
  - Windows 7 or higher, Intel Core i5
  - 4 GB RAM
  - At least 1.2 GB of free hard disc space
