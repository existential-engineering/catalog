description: A zero-latency channel strip drawing on analog circuit design expertise without cloning specific hardware. Combines a triple-topology preamp (DOA discrete op-amp, BJT bipolar transistor, FET field-effect transistor), wide-range high/low-pass filters, a five-band fully parametric EQ, a compressor/limiter with parallel compression, and a gate/expander. Mid/side routing, external sidechain, and global link groups for multi-instance parameter sharing.
details: |-
  Not an emulation of specific hardware — developer explicitly describes it as 'a purely digital concept' inspired by analog circuit experience. Triple-topology preamp: DOA (clean, transparent), BJT (even-order harmonics + coloration), FET (tube-like saturation). Five-band fully parametric EQ: 3 fully parametric mids, semi-parametric high/low shelves, operable in stereo or mid/side mode. Compressor/limiter: Threshold, Ratio, Attack, Release, Knee, Make-Up, Stereo Link, Parallel mix. Gate/expander section. Sidechain from internal filters, EQ, or external signal. Global link groups share parameters across session instances. Individual section bypass. Zero latency. Released November 2021.
specs: |-
  Controls: Preamp (topology select, drive), Filters (HP/LP with wide range), EQ (5-band parametric, stereo/M-S mode), Compressor (Threshold, Ratio, Attack, Release, Knee, Make-Up, Stereo Link, Parallel), Gate/Expander, Sidechain routing, Global link group. Latency: zero. macOS 10.9+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+ (32-bit and 64-bit), 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX. Copy protection: serial number.
