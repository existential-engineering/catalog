details: |-
  BLEASS Arpeggiator takes the inspirationally melodic power of a classic synth
  Arpeggiator and supercharges it with modern features demanded by today's
  musicians. Developed in collaboration with top french producer canblaster,
  BLEASS Arpeggiator's capabilities extend far beyond the clichéd up-and-down
  monophonic patterns of an old-school synth Arpeggiator, with polyrhythms,
  polyphony, and a large collection of highly configurable arpeggio patterns
  built in.

  The focus of bleass arpeggiator is creativity and experimentation. The
  plugin's hands-on user interface is as intuitive and spontaneous to use as a
  classic subtractive synth, so varying and adapting arpeggios on-the-fly is an
  easy, fun and organic experience.

  The plugin recognises incoming performance controllers, and includes a pair of
  xy pads (huge fun on ipad), a pair of advanced lfos and bleass' signature
  motion sequencer. These can modulate the arpeggiator's parameters, unlocking a
  deep level of creativity that's simply not available from modern
  step-sequencer-style arpeggiators.

  Bleass arpeggiator also offers a built-in sound generator. This is a cut-down
  yet great-sounding fm synth that's perfect for creating the kinds of bright,
  sweet and punchy sounds that can work so well with an arpeggio line.

  You can of course use bleass arpeggiator with any other synth too, with each
  instance of the plugin creating its own MIDI source that can be bussed to any
  instrument within your project.
specs: |-
