details: |-
  Original 3 band parametric equalizer. The bt equalizer peq5b delivers the
  controls and the amazing results of a true analog eqs. Based on the peq2b,
  this model provides passive boosting and attenuating shelving eqs, 3
  parametric bands with center frequency, bandwidth-q and amplitude controls.

  Bt equalizer peq5b is more open and musical than other similar equalizers of
  the same type by adding an exceptional tone and character to your music.

  Blue tubes equalizer peq5b by nomad factory / plugivery is a virtual effect
  audio plugin for macos and windows. It functions as a VST plugin, an audio
  units plugin and an AAX plugin.
