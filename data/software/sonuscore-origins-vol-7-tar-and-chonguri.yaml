description: The TAR & CHONGURI are two incredibly beautiful eastern string instruments. United, they form the perfect couple for the ORIGINS VOL. 7 ethnic string plugin.
details: |-
  Tar and Chonguri are two incredibly beautiful eastern string instruments. United, they form the perfect couple for the ORIGINS VOL. 7 ethnic string plugin. Both amazingly complement each other's tonal colors and allow a huge variety of timbres.

  The Tar's steel strings are plucked with a plectrum, resulting in a very pure and definite sound, marvelously reflecting the legendary Persian culture, where the Tar has been in existence for hundreds of years. The Chonguri with its tender silk strings however adds warmth, depth and richness to their joint timbre, an ode to the enchanting Georgian mountain landscapes, where the instrument originates from. Played together they merge into a completely new and powerful instrument.

  The Multi-Arpeggio-Designer is the centerpiece of every ORIGINS instrument. Two fully customizable arpeggiators create interlocking patterns and broad soundscapes by combining the unique timbres of the two ethnic strings instruments. The engine is designed to convey a musically meaningful, human performance, instead of a computer randomly aligning notes. It ships with 80 rhythm presets, and arpeggios can also be built from scratch in as much detail as required.

  The 12 individual color presets provide further possibilities for sculpting the sound. All colors are radically different in character and incorporate various effect settings and multiple impulse responses. Each MAD preset has an assigned color, but any combination of the two can be used, resulting in over 1000 predefined combinations. Arpeggio designs can also be copied and pasted between different instruments of the ORIGINS series.
specs: |-
  - Two individually playable instruments: Tar and Chonguri
  - Multi-Arpeggio-Designer (MAD) with two fully customizable arpeggiators
  - 80 rhythm presets
  - 12 unique color settings, combinable for over 1000 predefined combinations
  - Full customization of all controls
  - Arpeggio designs can be copied between different ORIGINS instruments
  - Requires FULL VERSION of Native Instruments' KONTAKT 5.8.1 or higher (the free Kontakt PLAYER only runs the instrument in demo mode)
  - Mac OSX 10.11 or higher, Intel Core 2 Duo
  - Windows 7 or higher, Intel Core 2 Duo or AMD Athlon 64 X2
  - 4 GB RAM
  - At least 110 MB of free hard disc space
  - Available as a download
