details: |-
  denise wanted to create an adaptable bit-crusher with complete control over
  its sound. On top of that, they wanted an extra layer of surprise, joy and an
  almost instrument-like feeling. The plugin is based on a crazy sounding
  bit-crushing algorithm that they added their push-pull graph technology to,
  which you might know from the dragon fire & god mode, with tailored FX and
  clever smoothing to top things off.

  This plugin enables you to destroy your audio and make extremely rough and
  bold sounds by merging the push-pull technique, as well as classic bit
  reduction and sample reduction functionalities: you don't need anything more
  than this plugin to go from a clean bassline to a distorted, screaming
  monster, or to give your drums the edge they need and create new glitched up
  and futuristic arrangements.

  You decide which frequency ranges to target with the push-pull graph. The
  push-pull graph lets you have complete control over the frequencies that are
  going to be crushed, giving you endless possibilities and new sounds. Automate
  it to create organically changing bit crushed lines and create steep curves
  for screaming resonances.

  The bite harder offers the classic bit crushing features, but adds unique
  controls to refine or destroy your sound even more. With the silky dial, you
  can smooth out the effect of the individual bit and sample controls. Alongside
  this we've added the push-pull graph, a layer of fx and a drive control.
specs: |-
  - Bit crushing
  - Push-pull graph technology
  - Bit reduction
  - Sample reduction
  - Frequency range control
  - Silky dial
  - FX layer
  - Drive control
  - Automation support
