details: >-
  Ambio.one is a highly customizable crosstalk-cancellation plug-in based on the
  race algorithm developed by the ambiophonic institute.


  Ambio.one can process regular 2-channel stereo material to be presented on
  closely spaced speaker pairs. Such setup, even with only two speakers, can
  produce approximately 170 degree wide soundstage with considerably better
  imaging and sound localization than conventional stereophonics.


  A four-speaker setup (two closely spaced speakers at front and back positions)
  provides a full 360 degree soundfield in the horizontal plane.


  Ambio.one can be used for mixing and mastering applications, as well as for
  high fidelity reproduction of music.
specs: |-
  - Crosstalk-cancellation plug-in
  - Race algorithm
  - 2-channel stereo processing
  - Closely spaced speaker pair support
  - 170 degree soundstage capability
  - 4-speaker setup support
  - 360 degree soundfield
  - VST plugin
  - Windows compatible
