details: |-
  Score audio to anything. Movies/videos, animations, 3d, games, apps, dvd
  menus, intermission elements, transitions, long timelines, etc.

  Packs a powerful punch with a variety of cinematic, atmospheric, soundscapes
  and textures of all kinds. Full kits include: sweeps & atmospheres x 10
  octaves. Sci-fi & builders x 10 octaves. Drums (all types) x 10 octaves.

  An abstract array of emotions, moods, suspense, anxiety, swells, risers,
  falls, aliens, quirky static, etc. All amazingly unique and spanned 5 octaves
  deep x 2 sounds per kit.

  An original fresh out of the studio collection of orchestra combo sounds.
  These are typically 3-4 sounds overlapped, panned, and treated differently
  which results in a unique 'combo sample', and a full powerful punchy orchestra
  simulation when playing melodies/patterns/multiple instances.
