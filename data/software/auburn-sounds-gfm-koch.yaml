details: |-
  GFM Koch is a physical synthesizer able to generate the punchiest percussive notes, by construction.

  Thanks to the purity of its integration, its sound is especially crystalline from the lowest to the highest frequencies. Thus it is suitable for sub-bass stabs, percussive basses, emulating electric pianos and tonal percussions.

  To compliment this raw sound, a sub-oscillator and voice-wise distortion is provided. This distortion is devoid of aliasing, again by construction.

  The plug-in is available as a free Audio Unit and VST plug-in for macOS and Windows, distributed as a full-version download from the Auburn Sounds site.

  Auburn Sounds lists it under Legacy Products and warns that the plugin is free but unsupported: it will receive neither support nor updates.
