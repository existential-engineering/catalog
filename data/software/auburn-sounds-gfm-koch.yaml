description: Pitched percussive physical synthesizer that generates the
  punchiest percussive notes, suitable for sub-bass stabs, percussive basses,
  electric piano emulation, and tonal percussions.
details: |-
  GFM Koch is a pitched percussive physical synthesizer designed to generate
  punchy percussive notes by construction. It uses physical synthesis
  architecture to create sounds suited for sub-bass stabs, percussive basses,
  electric piano emulation, and tonal percussions.

  The plugin includes a sub-oscillator and voice-wise distortion that is
  aliasing-free by construction, ensuring clean sound output. It delivers
  crystalline sound quality across the entire frequency range.

  GFM Koch is a legacy product from Auburn Sounds, available for free but no
  longer supported. It will not receive future updates or technical support.
specs: |-
  - Physical synthesis architecture
  - Sub-oscillator
  - Voice-wise aliasing-free distortion
  - Crystalline sound across frequency range
  - Percussive sound generation
