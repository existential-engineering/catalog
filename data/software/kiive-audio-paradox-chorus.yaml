details: |-
  Blend three parallel chorus voices, tape style drive stage, and advanced voicing controls to achieve sounds from barely detuned to full bloom. Run up to three choruses at once, each with its own rate, depth, and delay time, to transform your music. Paradox - Chorus runs three modulated delay lines side by side, brown, purple, and blue, so a track can drift, shimmer, and swell all at once. Bypass a voice for a tighter double, stack all three for wider sounds, or push the drive a little so the wet signal comes back with some weight behind it. Try it free for 14 days
