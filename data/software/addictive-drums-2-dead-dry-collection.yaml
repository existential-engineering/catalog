details: |-
  This is the collection for all your vintage thump needs. Packing two distinct, vintage kits recorded at the legendary ingrid studios in stockholm.

  The vintage dead kit gives packs all the punch you need - it's equally perfect for beats and breaks, psychedelic indie pop in the vein of tame impala, khruangbin, and glass beams, and hard-hitting rock like queens of the stone age, and death from above 1979.

  Vintage dry perfectly captures that authentic '70s vibe of a 1968 ludwig silver sparkle, giving you the sounds brought back into vogue by artists like daft punk and justice.

  All in all, the dead & dry collection has all the dampened mojo you could ever wish for.
