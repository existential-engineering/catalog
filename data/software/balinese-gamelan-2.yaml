details: |-
  Soniccouture balinese gamelan ii is revered among composers. Featuring two
  full ensembles, it is by far the most authentic and complete sampling of
  gamelan available.

  Play individual instruments or the whole ensemble at once - complete control
  over the gamelan for experts & newcomers alike.

  Over 30 different instruments were recorded in great depth to capture the
  living, breathing sound & dynamics of gamelan.

  Balinese gamelan 2 by soniccouture is a virtual instrument audio plugin and a
  software application and soundware (samples or presets that load into other
  products) for macos and windows.

  It includes, and is therefore powered by, kontakt player, which functions as
  an audio units plugin, a VST 3 plugin, an AAX plugin and a standalone
  application.
specs: |-
  - Kontakt player
  - Over 30 instruments
  - Two full ensembles
