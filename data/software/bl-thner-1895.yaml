name: Blüthner 1895
manufacturer: vienna-symphonic-library
primaryCategory: synthesizer
description: The Blüthner 1895 is a virtual representation of a beautifully
  refurbished 193 cm (6-foot-4) grand piano with patented aliquot stringing.
details: |-
  The blthner 1895 is a virtual representation of a beautifully refurbished 193
  cm (6-foot-4) grand piano with patented aliquot stringing. The vintage
  blthner's famous "golden tone" was captured at stage b of synchron stage
  Vienna from eight microphone positions, with all the charm and peculiarities
  that give a seasoned instrument its character.

  The recorded grand piano was built in 1895 by the famous julius blthner
  pianofortefabrik of leipzig. The 6-foot-4 professional scale instrument is
  equipped with blthner's specially developed and patented aliquot system that
  uses additional dampened strings positioned above the conventional strings of
  the treble register, which are not struck by the hammers but resonate
  sympathetically. This fourth set of strings enhances the overtones, providing
  a velvety, organic shimmer and giving the instrument a particularly lyrical
  "singing" quality.

  In combination with its soft hammers the blthner grand produces a clear, yet
  warm and soft timbre that is superior to many modern instruments in its
  variety of tonal colors. All of the strings are unusually long and thin,
  stretched to an enormous string tension of 20 tons, which helps define the
  instrument's specific sound.

  Vienna's blthner 1895 grand piano was recorded at stage b of synchron stage
  vienna using a highly precise motion-control system based on a solenoid
  controlled a noise-free "robot finger". This proprietary technology represents
  the pinnacle of vienna's long-term sampling robotics development, with the
  micro-controller moving the finger with super-human precision and providing
  flexible curvatures for down-strokes and release movements.

  Blthner 1895 comes with the proprietary synchron pianos player software that
  incorporates the most powerful sample playback engine on the market, featuring
  unprecedented streaming performance that guarantees glitch-free playback. Six
  character presets that cover a lot of genres ("concert", "intimate", "player",
  "pop", "ambience", and "vintage") can be accessed instantly from the main
  window, with users having a multitude of options for creating their individual
  timbre by mixing various microphone signals, filtering particular key ranges
  or even single keys, adjusting the instrument's string and body resonances or
  adding a pinch of algorithmic reverb.
specs: |-
  - Patented aliquot stringing system
  - Eight microphone positions
  - Motion-control sampling system
  - Solenoid-controlled robot finger
  - Six character presets
  - Microphone signal mixing
  - Key range filtering
  - String and body resonance adjustment
  - Algorithmic reverb
  - Synchron pianos player software
  - Windows 7/8/10 64-bit compatible
  - macOS 10.10 or higher
  - Intel core 2 duo or amd athlon 64 x2 processor
  - 8 GB RAM minimum (16 GB recommended)
  - SSD storage (m2, sata 6, or usb3/3.1 uasp)
  - AU/VST/AAX native compatible host
  - Pro Tools 10.3.5 or higher for AAX
