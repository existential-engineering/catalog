description: Mercury-4 is a detailed emulation of one of the best-sounding and
  quirkiest polyphonic synthesizers of the late 1970s, the Roland Jupiter-4. It
  is the rarest and most sonically unique of the fabled Jupiter series.
details: |-
  Mercury-4 recreates the Roland Jupiter-4, a polyphonic synthesizer from the late 1970s. It was modelled on a vintage unit originally owned by Greg Hawkes of The Cars, played on the band's double-platinum 1981 album Shake It Up.

  The original Jupiter-4 had limited patch storage, four voices of polyphony, and considerable weight. Mercury-4 extends the design with 16-voice polyphony, unlimited patch storage, velocity sensitivity and MPE support, and it is paired with a model of the tape delay unit of the same era.

  Released in 1978, the Jupiter-4 was one of the earliest instruments to combine voice-assign polyphony with digital patch storage. It became a common polysynth for English and European acts through the 1980s, including Duran Duran, Thomas Dolby, The Human League and Simple Minds, with a raw tone distinct from the other Juno and Jupiter synths: aggressive analog oscillators, a sub oscillator for weight, fast and deep LFO modulation, and Roland's stereo chorus ensemble circuit.

  The emulation covers the Jupiter-4's analog oscillators, dual filters and easily overdriven VCA section, the arpeggiator section, and the original's two unison modes. A Drift control adds vintage character, the stereo BBD ensemble effect is modelled, and a classic tape echo with multiple reverb modes reproduces the warm tonality and subtle speed variations of the original tape units.

  Mercury-4 ships with over 400 presets, including the Jupiter-4's factory front-panel presets and 75 presets from sound designer Huston Singletary.
specs: |-
  - Authentically modeled oscillator with sub oscillator
  - All filter characteristics modeled, including powerful low-frequency resonance
  - Up to 16-voice polyphony
  - Over 400 presets, programmed by industry veterans
  - Exactingly replicated unique arpeggio section with tempo sync
  - Carefully modeled wide-range LFO modulation with inverted mod characteristics
  - Drift control for increased analog realism
  - Precisely replicated stereo ensemble effect
  - Warm and organic tape echo with multiple reverb modes
  - Tempo-syncable LFO
  - Detunable unison mode
  - Single-key chord memory mode
  - Highly optimized coding for low CPU load
  - User-adjustable oversampling control
  - One-click UI magnification
  - Comprehensive MPE support
  - Full MIDI control and DAW automation for all controls
  - macOS requirements: 10.13 or above, 64-bit required, native Apple M1 or greater processor support, 3.4 GHz quad-core or M1 CPU with 8GB of RAM recommended
  - Windows requirements: Windows 7 or above (including Windows 11), 64-bit required, quad-core computer with 8GB of RAM recommended
