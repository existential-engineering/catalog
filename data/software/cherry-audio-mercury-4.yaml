details: |-
  Mercury-4 is a detailed emulation of one of the best-sounding and quirkiest
  polyphonic synthesizers of the late 1970's, the Roland Jupiter-4. Every aspect
  of Mercury-4 has been expertly modeled upon a vintage Jupiter-4 originally
  owned by Greg Hawkes of the legendary 80's new wave band The Cars, and played
  on their double-platinum 1981 album Shake It Up.

  Originally released in 1978, the Roland Jupiter-4 synthesizer was one of the
  earliest instruments to combine voice-assign polyphony with digital patch
  storage. The Jupiter-4 had its share of disadvantages, including limited patch
  storage, just four voices of polyphony, and boat-anchor weight.

  Cherry Audio's Mercury-4 improves upon the original's design by offering
  16-voice polyphony, infinite patch storage, velocity sensitivity, MPE support,
  and much more. With over 400 presets, a precisely replicated stereo ensemble
  effect, warm tape echo with multiple reverb modes, and highly optimized coding
  with ultra-low CPU load, Mercury-4 delivers the iconic Jupiter-4 sound in a
  modern, feature-rich package.
specs: |-
  - Authentically modeled oscillator with sub oscillator
  - All filter characteristics modeled including powerful low-frequency resonance
  - Up to 16-voice polyphony
  - Over 400 presets
  - Exactly replicated unique arpeggio section with tempo sync
  - Carefully modeled wide-range LFO modulation
  - Drift control for analog realism
  - Precisely replicated stereo ensemble effect
  - Warm tape echo with multiple reverb modes
  - Tempo-syncable LFO
  - Detunable unison mode
  - Single-key chord memory mode
  - Highly optimized coding with ultra-low CPU load
  - User-adjustable oversampling control
  - Advanced one-click UI magnification
  - Comprehensive MPE support
  - Full MIDI control and DAW automation
