description: Executes eleven hardware cores at chip level, running original ROM firmware on cycle-accurate emulators. Rather than approximating sounds, it loads actual firmware and sample data from original hardware. Includes emulations of the Yamaha DX7, Roland JP-8000, Access Virus A/B/C/TI, Clavia Nord Lead 2X, Waldorf microQ, Waldorf Microwave XT, Wurlitzer 200A, Yamaha OPL3, Commodore 64 SID, and Akai S1000.
details: |-
  Access Virus A, B & C
  Access Virus TI
  Waldorf microQ
  Waldorf Microwave XT
  Clavia Nord Lead 2X
  Roland JP-8000
  Yamaha DX7
  Akai S1000
  Wurlitzer 200A
  Yamaha OPL3

  Cycle-accurate Motorola DSP 56300 emulation, Hitachi HD6303R sub-CPU emulation, OpenWurli physical modeling, Nuked OPL3 v1.8, SFZero v3.0.0 sample engine, full MIDI and sysex control

  SF2, SFZ, ZBP, ZBB
