description: Multi-core retro hardware emulation of twelve classic synthesizer,
  sampler, and keyboard cores — Access Virus A/B/C, Access Virus TI, General
  Instrument AY-3-8910 / Yamaha YM2149 PSG, Waldorf microQ, Waldorf Microwave
  XT, Clavia Nord Lead 2X, Commodore 64 SID 6581/8580, Roland JP-8000, Yamaha
  DX7, Akai S1000, Wurlitzer 200A, and Yamaha OPL3. Virtual analog synths are
  powered by cycle-accurate Motorola DSP 56300 processor emulation running
  original ROM firmware.
details: |-
