description: "HoRNet Freqs is a free audio spectrum analyzer that provides two kinds of visualisations: analog and digital."
details: |-
  HoRNet Freqs is a free audio spectrum analyzer that provides two different kind of visualization of the audio spectrum, the first one is called “analog” and is inspired to an analog hardware spectrum analyzer that is still found on the master of many recording studios even today. The second one is called “digital” and it’s our own take on the typical spectrum analyzer based on the FFT (the standard math to transform an audio file into its spectrum components).

  Freqs GUI is completely resizable and it’s crisp and smooth on every display thanks to its hardware accelerated drawing.

  The plugin offer different integration times and ranges for the levels shown by the spectrum analyzer, it also provides a peak hold feature that was not available in the original hardware unit. Freqs can display both the “mid” (or sum) part of a stereo signal and the “side” (or difference) to help you isolate problematic frequencies.

  The HoRNet Freqs has no copy protection, we don’t believe in copy protection, they are always cracked and they are annoying for the users, we all know you are not going to give away the plugin on the internet. So simply download the plugin and enjoy your recordings!
specs: |-
  - Two different spectrum views, analog and digital
  - Selectable dBs range
  - Three different integration times
  - Peaks display and reset
  - Preset save and load
  - GUI is scalable and hardware accelerated
  - This plugin is not yet natively compatible with Apple Silicon (M1/M2) processors
  - macOS (>=10.9) and Windows (Windows 7 and later) support
  - 64-bit plugin for Mac and Windows
  - Audio Units, VST2.4, VST3 and AAX format
