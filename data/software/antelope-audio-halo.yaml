description: "Create rich, rhythmic delay textures with Halo – a multitap delay
  plugin featuring up to 16 taps, BPM sync, stereo ping-pong modes, and built-in
  high/low cut filters. Try free for 14 days."
details: |-
  Halo is a versatile multitap delay plugin designed to go beyond conventional echo effects. With up to 16 independent delay taps, advanced stereo manipulation, BPM-locked timing, and precise frequency shaping, Halo gives producers, engineers, and sound designers everything needed for rich, immersive delay textures.

  Generate intricate, layered echoes using up to 16 sequential delay taps. Each tap can be shaped with smooth, slow, or fast decay curves – ideal for building dense rhythmic textures, ambient trails, or percussive delay sequences.

  Set delay times using precise millisecond values or sync them to your DAW's BPM with a wide range of note divisions, from dotted and triplet values to classic quarter or eighth-note delays – perfect for locking effects tightly to your groove.

  Go beyond traditional ping-pong delay with two enhanced stereo swap modes that alternate the signal in creative ways. Control the Depth and L/R Width parameters to create wide, animated delays that bounce dynamically across the stereo field.

  Shape the tone of the delayed signal with onboard high-pass and low-pass filters, and control the intensity of your repeats with dedicated feedback and gain controls. Halo is part of the Antelope Cosmos plugin collection.
specs: |-
  - Up to 16 independent sequential delay taps
  - Per-tap decay curves (smooth, slow, fast)
  - Tempo-sync to DAW BPM with note divisions (dotted, triplet, quarter, eighth)
  - Precise millisecond delay timing
  - Two enhanced stereo ping-pong / swap modes
  - Depth and L/R Width stereo parameters
  - High-pass and low-pass filters on the delayed signal
  - Dedicated feedback and gain shaping controls
  - Runs natively in DAW on macOS or Windows
  - Part of the Antelope Cosmos plugin collection
  - 14-day free trial available
