details: |-
  AudioPort Universal is a stand-alone version of Audio Impressions' proprietary
  system for enabling samplers or computers dedicated to digital audio plug-ins
  to send multi-channel digital audio over gigabit Ethernet.

  Audioport is comprised of two parts, the host and the plug-in. You install
  audioport host on one or more windows pc computers, and you instantiate
  whatever VST based virtual instruments or effects plug-ins you wish inside
  that host. You then install one or more audioport plug-ins on your macintosh
  or windows sequencer or DAW.

  Digital audio flows from host to plug-in via standard gigabit Ethernet so no
  expensive cabling or audio I/o cards/converters are necessary. Each host can
  send out up to 32 channels of digital audio at up to 192 khz/32 bit depth, and
  you instantiate one audioport plug-in for each pair of channels being received
  in the sequencer or DAW.

  Works with musiclab's midioverlan cp for communication with synths and
  samplers instantiated in audioport host. Also supports direct-connected MIDI
  keyboards and hardware devices that have windows drivers or native windows
  support.
specs: |-
  - Cross-platform (Windows pc and macintosh)
  - VST plugin support
  - Audio Units plugin support
  - Multi-channel digital audio over gigabit Ethernet
  - Up to 32 channels of digital audio
  - Up to 192 kHz/32 bit depth
  - Host and plug-in architecture
  - Midioverlan cp compatibility
  - Direct-connected MIDI keyboards support
  - Windows drivers support
  - Native Windows support
