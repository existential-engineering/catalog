details: |-
  Bde is an earth shattering distortion plugin featuring several distortion
  styles, complimentary effects, m/s and frequency control over the distortion
  effect, along with the worlds first user definable dynamic preservation
  control function, allowing you to maintain the dynamic range of any signal
  while still applying a distortion effect.

  Bde features 6 different distortion styles with each getting progressively
  more destructive. From cherry bomb to nuke and everything in between, bde
  offers all the distortion styles you could ever hope for, perfect for hip hop,
  rock, pop, and edm music.

  The worlds first dynamic preservation function in a distortion, allowing up to
  96db of dynamic control. Simply put, if you want your reverb tail to sound
  distorted without raising its volume and altering the dynamics, bde is the
  right plugin for you.

  Bde has an auto leveling function, allowing you to perfectly level out your
  signal in under 2 seconds. Simply click the detect button, press play on the
  desired sound, and click once again to lock in the perfect signal level for
  optimal use.

  Bde features a band pass function allowing you to apply distortion to specific
  sections of frequency, while keeping the rest of your signal clean. In
  addition, there's an m/s function allowing you to apply distortion across any
  aspect of the stereo field.
specs: |-
  - 6 different distortion styles
  - Dynamic preservation control (up to 96db)
  - Auto leveling function
  - Band pass function
  - M/s (mid/side) control
  - Bit crushing
  - Downsampling
  - Compression
  - Color effect
  - Filters
  - Universal 2 binary
