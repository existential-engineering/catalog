details: |-
  This bundle includes three legendary synths: velvet, hybrid 3.0, and mini
  grand.

  Velvet is a virtual electronic piano that combines five legendary electric
  pianos from the 60s and 70s into one versatile instrument. Based on the fender
  rhodes suitcase, fender rhodes mk I and mk ii stage pianos, wurlitzer 200a and
  hohner pianet-t, velvet accurately emulates the sound quality, response, and
  nuances of each original instrument to bring your piano tracks to life.
  Additionally, velvet features a pallet of onboard effects and allows you to
  control every aspect of the sound for unparalleled realism.

  Hybrid 3.0 is the next generation in synthesis. This high-definition virtual
  synthesizer combines the coveted warmth of analog synths with a full range of
  futuristic digital manipulation capabilities. The result is the best of both
  worlds a virtual instrument with a comprehensive set of precisely adjustable
  parameters that can sound like a synth you remember or something no one has
  ever heard before.

  Mini grand is a simple to use yet powerful virtual piano instrument with seven
  different acoustic piano sounds to suit a broad range of musical styles and
  production needs.
