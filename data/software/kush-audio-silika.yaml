description: A straightforward, killer-sounding compressor that completely
  closes the Analog/Digital gap for a particular flavor of beautifully-clipping
  vintage compressor sound.
details: |-
  SILIKA is a dual-diode compressor plugin from Kush Audio. When you drive this plugin's input, everything melts deliciously. In particular, the high frequencies lay back and spread out without getting edgy, or bright, or even the least bit 'zingy'. It may get too grindy, but it won't hurt your ears. Think Led Zeppelin IV's hazy grunge, and you'll start to get the idea.

  SILIKA owes its sound to an extraordinarily complex harmonic distortion generator, but operationally it's a relatively simple compressor with a familiar feature set. All of its distortions are controlled with the Input knob, which can be switched and blended to taste.

  The resulting signal then gets passed to a compressor/limiter with 4 available ratios, standard Attack/Release/Threshold/Mix controls, and sidechain filtering options which, while simple, allow for a dramatic reshaping of the compressor's behavior.

  The plugin is sold as a perpetual licence covering 2 activations, free updates and support, and all available presets, with a free 10-day demo offered via a demo code. Mac and Windows installers and a user manual are available from the maker.
specs: |-
  - Dual-diode compressor
  - Harmonic distortion generator, with all distortion controlled and blended from the Input knob
  - Compressor/limiter section with 4 available ratios
  - Attack, Release, Threshold and Mix controls
  - Sidechain filtering options
  - Perpetual licence includes 2 activations, free updates and support, and all available presets
  - Free 10-day demo available via demo code
