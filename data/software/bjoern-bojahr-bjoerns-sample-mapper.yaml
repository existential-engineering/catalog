name: Bjoerns Sample Mapper
manufacturer: bjoern-bojahr
primaryCategory: sampler
description: With this tool you can easily create sample maps in sfz format for
  dimension le/pro, tal sampler or other samplers that are compatible with the
  sfz format.
details: |-
  With this tool you can easily create sample maps in sfz format for dimension
  le/pro, tal sampler or other samplers that are compatible with the sfz format.

  The data structure (which parameters are processed and offered at which point)
  is based on classic hardware samplers.

  The program can read in an entire folder of wav files and automatically
  arrange the files over the entire keyboard range based on the stored pitch.

  In addition, you can import the mapping (not the sound parameters) from simple
  exs24 instruments.

  There is also an xml export in dspreset format for decent sampler.

  You can open and edit existing sfz files with the program.

  Bjoerns sample mapper is available as an application for macos (os x from
  yosemite 10.10) with support for arm and intel processors.

  There is also a windows version that works with windows 7, 8, 10 and 11.
specs: |-
  - Sfz format support
  - Wav file import
  - Automatic keyboard range arrangement based on stored pitch
  - Exs24 instrument mapping import
  - Xml export in dspreset format for decent sampler
  - Sfz file editing
  - macOS support (os x yosemite 10.10 and later)
  - Arm processor support
  - Intel processor support
  - Windows 7 support
  - Windows 8 support
  - Windows 10 support
  - Windows 11 support
  - Drag and drop import
  - Dimension le/pro compatibility
  - Tal sampler compatibility
