url: https://audiokitpro.com/audiotune/
description: Audiotune is a pitch correction app from audiokit and coda labs. It
  features a brand new pitch correction algorithm by daniel kuntz.
details: |-
  Effortlessly tune audio, automatically. Take it on the go for your iphone or
  ipad. Perfect for live performances, songwriting, music production, vocal
  training, practice, and more. Record your creations and ideas without leaving
  the app.

  Create your own scales. Play the onboard keys to manipulate your voice in
  realtime. Use the app as a plugin in your favorite ios DAW: garageband,
  beatmaker 3, cubasis 3, aum, ns2, and more. Auv3 plugin allows you to MIDI
  manipulate your voice.

  Real time pitch correction for monophonic signals from 60hz to 700hz. Works on
  male and female voices. Control the correction amount and correction speed for
  natural or robotic sounding output. Tune to 144 different scales.

  Use in standalone with wired or wireless headphones. Shortcut to process audio
  files in standalone. Run multiple instances of audiotune in compatible hosts.
specs: |-
  - Pitch correction algorithm
  - Real-time pitch correction
  - Monophonic signal processing (60hz to 700hz)
  - AUv3 plugin
  - MIDI manipulation
  - 144 different scales
  - Correction amount control
  - Correction speed control
  - Nearly zero latency
  - iOS support (iphone and ipad)
  - Wired and wireless headphones support
  - Multiple instance support
