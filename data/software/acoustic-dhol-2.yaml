description: Acoustic dhol 2 is a sample-based acoustic indian dhol instrument
  plugin available in vst3 and audio unit formats for mac and pc.
details: |-
  Acoustic dhol 2 is the new sample based acoustic indian dhol instrument. It has been sampled from real indian metal, wood and fiber dhol instruments. Sampled with condenser mic with various positions. It is velocity sensitive instrument with built in round robin ai triggered samples.

  It comes with win 64-bit vst3, AU and mac vst3 plugins. Acoustic dhol 2 comes with free player, however you will require to purchase the factory expansion to up and run the full instrument.

  20 hq instrument presets with low end sub & 808 generator osc, dhol generator, filter and reverb. Now just play real dhol instrument right inside your host DAW.

  Features include 20 factory expansion presets (purchase separately), new .rdg file format for expansions, over 150 articulations, new low sub osc, new 808 osc, tuning, new low pass and high pass filters, new presets browser, ai powered round robin and velocity sensitive, ar with volume & pan control, algorithmic reverb, and level meter.

  All major daws supported (that supports vst3, AU, mac vst3). System requirements: graphics card 1gb (2 gb recommended), ram 1 gb (2 gb recommended), intel or amd cpu, asio driver and audio interface, vst3 64-bit, AU & mac vst3, windows 7 sp 1, 8, 10 (64-bit), mojave mac os x.
