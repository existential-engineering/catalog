  engineers dreamed it up.
specs: |-
  - Multi-voice delay with independent pitch shifter on each voice
  - 6 total delay voices (3 per input channel)
  - Delay time up to 4.75 seconds per voice
  - Pitch adjustment in semitones and cents
  - Feedback control for arpeggio creation
  - Real-time spectral display
  - iLok2 authorization required
  - Parameter automation support
  - Studio-quality presets
