name: AuraVerb
manufacturer: antelope-audio
primaryCategory: reverb
categories:
  - effect
url: "https://en.antelopeaudio.com/products/auraverb/"
description: AuraVerb is free for all current and future audio interface owners
  and it is fully compatible with other upcoming Antelope Audio products.
details: |-
  Antelope Audio's first reverb, a software-based effect that leverages the company's powerful 64-bit FPGA chip and a unique algorithm designed by Antelope's team of mathematicians, including company founder Igor Levin.

  Runs in real-time on Synergy Core audio interfaces. AuraVerb is free for all current and future Antelope audio interface owners and is fully compatible with other upcoming Antelope Audio products.

  Features eight different controls, including a 'Color' parameter to create everything between darkened textures and a brighter presence, and a 'Richness' parameter that controls the reverb density compared with the source audio.

  Note: AuraVerb is not an effect included in the AFX tab and is accessible via the channel strips only, so it cannot be used as a Hardware Insert in your DAW. It is implemented only in the First Internal mixer (operational via the SEND controls) and is intended for monitoring purposes.
specs: |-
  - Runs in real-time on Synergy Core interfaces
  - Powered by Antelope's 64-bit FPGA chip
  - Eight control parameters
  - Color parameter (darkened textures to brighter presence)
  - Richness parameter (reverb density vs. source audio)
  - Accessible via channel strip SEND controls in the First Internal mixer
  - Intended for monitoring purposes (not a DAW Hardware Insert)
  - Free for all current and future Antelope Audio interface owners
