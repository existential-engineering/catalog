details: |-
  Array is a spectral sequencer effect plugin for mac, Windows and Linux. Using
  multiple crossover filters, it splits audio into 8 frequency bands that are
  separated exactly one octave apart. Each band then runs through a gate
  controlled by an advanced step sequencer allowing you to carve the audio
  spectrum in precise rhythmical fashion.

  The crossover filters themselves have a clean, neutral character and do not
  color the sound in any way however, array also features 8 band-pass filters
  (one for each band) with variable resonance and slope, and those can be
  enabled for more radical spectral effects even up to vocoder-like morphing.

  Additionally, the spread function can gradually pan the frequency bands across
  the stereo field. The sequencer holds a total of 8 different gate patterns
  with up to 32 steps each, and offers a very wide range of timing settings for
  creating polymetric or polyrhythmic motion in any time signature.

  The gate switches on every frequency band are shaped using a two-pole low-pass
  filter for natural yet snappy transitions. Combined with the unique design of
  the filter section, this sophisticated timing engine makes array an extremely
  versatile instrument for complex rhythmical manipulation of the sound spectrum
  going anywhere from surgical precision to filtering beyond recognition.

  One-pole lag filters on all continuous parameters for smooth, click-free
  adjustment. Supports mono mono, mono stereo, and stereo stereo channel
  configurations.
specs: |-
  - 8 frequency bands separated one octave apart
  - Crossover filters (-24 dB/octave)
  - 8 band-pass filters with variable resonance and slope
  - Advanced step sequencer
  - 8 gate patterns with up to 32 steps each
  - Polymetric and polyrhythmic timing settings
  - Two-pole low-pass filter for gate transitions
  - Stereo spread function
  - Mono/stereo channel configurations
  - Color-coded control elements
  - Sequencer pattern macro editing (copy, paste, reset, trim, invert, mirror,
  reverse, evolve, randomize, shift, loop)
  - Built-in preset management
  - Open preset format
  - Window size scaling up to 200%
  - AU/VST3/AAX for macOS 10.13 or newer (64-bit apple silicon and intel)
  - VST3/AAX for Windows 8.1 or newer (64-bit intel and amd)
  - VST3 for Linux 2020 or newer (64-bit intel and amd)
