description: "A breakthrough plug-in and standalone application that brings
  professional voice modeling to your desktop workflow. Vocal recording,
  transformed."
details: |-
  At the core of ReSing is advanced AI technology that captures the unique timbre, tone, and expression of real artists, delivering ultra-natural vocal performances that feel indistinguishable from a live session. The plug-in instantly replaces vocal takes with professional-quality performances and allows users to adjust vocal energy, tone, and style, or even blend and modify voices.

  ReSing works as both a plug-in and a standalone app, performing vocal transformations directly on your computer and eliminating the need to connect to external servers or wait in processing queues. It modifies vocal tracks by replacing their timbre and phonetic features with those of high-quality AI voice models of real artists. This technology demands more intensive processing than other methods, which often struggle to capture complex vocal nuances.

  The software can turn any recording, even from a phone, into a studio-quality vocal. Users can also sing basslines, riffs, and hooks, then convert them into real instruments using the included instrument models spanning saxophones, guitars, bass, flute, trumpet, violin, synths, and percussion.

  ReSing is the first tool to let users create custom voice models locally on their computer, giving complete control over input audio files and the final model. The Modeler feature enables creation of personalized voice models to share or license.

  The software supports ARA2 integration for seamless workflow in major DAWs including Cubase, Logic Pro X, Studio One, Nuendo, and Reaper, and also functions as a standard plug-in in any compatible host.
specs: |-
  - AI voice modeling with real artist timbre capture
  - Local processing (no server connection required)
  - Custom voice model creation via Modeler
  - Instrument conversion (saxophone, guitar, bass, trumpet, etc.)
  - ARA2 integration (Cubase, Logic Pro X, Studio One, Nuendo, Reaper)
  - Vocal energy, tone, and style adjustment
  - macOS 10.15+ / Windows 10+
  - AU, VST3, AAX, Standalone
