description: A quirky, Lo-Fi spatial effects processor that's a secret weapon for huge-sounding guitars. Also great for enhancing the stereo space of mixes and creating warmth and bottom. Based on the original hardware WOW Thing, a $20 device that made speakers sound more spacious through radical equalization and psychoacoustic processing. Features two WOW effect types (original tabletop unit vs SRS Megawide rackmount algorithms), TrueBass low-frequency enhancement with selectable frequencies, and stereo width enhancement for room mics, reverb returns, and pads.
details: |-
  The Wow Thing is a digital model of a quirky consumer device that gained professional recognition when used on influential metal recordings. Originally designed for enhancing speaker output, the hardware unit became a secret weapon for wide-sounding guitars in professional studios.

  The plugin features two WOW effect types: TYPE 1 emulates the original tabletop hardware unit, while TYPE 2 emulates the SRS Megawide rackmount algorithms. Both modes provide psychoacoustic stereo widening that can transform mono or stereo sources into expansive, wide-sounding signals.

  Additional processing includes TrueBass low-frequency enhancement with selectable frequencies and a Mono/Stereo toggle, as well as Static/Dynamic switching for TrueBass dynamics control. A Presence Intensity slider allows adjustment of signal brightness, and a Spectrum Analyzer with Filter Curve Display provides real-time visual feedback.

  The interface features a simple two-knob design with advanced options accessible via the nameplate. A Mix control allows blending of dry and wet signals for parallel processing. The plugin is software-licensed with no USB dongle required, supporting up to 4 simultaneous machine activations.
specs: |-
  - Two WOW effect types: TYPE 1 (original tabletop) and TYPE 2 (SRS Megawide rackmount)
  - TrueBass low-frequency enhancement with selectable frequencies
  - Mono/Stereo toggle for TrueBass low-end processing
  - Static/Dynamic switch for TrueBass dynamics
  - Presence Intensity slider for adjusting signal brightness
  - Spectrum Analyzer for real-time visual feedback
  - Filter Curve Display
  - Mix control for dry/wet blending
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
  - Minimum: Intel, AMD, or Apple Silicon i5 quad-core, 4GB RAM
  - Mac: macOS 10.14 or higher
  - Windows: Windows 7 and above
  - Software licensing, no USB dongle required
  - Up to 4 simultaneous machine activations
