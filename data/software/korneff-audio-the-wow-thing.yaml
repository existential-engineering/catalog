description: "A lo-fi spatial effects processor for stereo width, guitar processing and low-frequency enhancement. Based on the original hardware WOW Thing, an inexpensive consumer device that widened the sound of small speakers through radical equalization and psychoacoustic processing. Features two WOW effect types (original tabletop unit and SRS Megawide rackmount algorithms), TrueBass low-frequency enhancement with selectable frequencies, and stereo width enhancement for room mics, reverb returns and pads."
details: |-
  The Wow Thing is a lo-fi spatial effects processor used on guitars, for widening the stereo image of a mix, and for low-frequency enhancement.

  The original WOW Thing was an inexpensive consumer device that made small speakers sound wider and fuller, using radical equalization and psychoacoustic processing built from delays and phase manipulation. It was later applied to guitars in a professional recording context and used on records afterwards.

  The controls are simple. The WOW knob widens any stereo source fed through it beyond the speakers, and at extreme settings introduces enough psychoacoustic movement to be disorienting. TrueBass is a low-frequency enhancement that adds depth, from mild thickening to pronounced low-end effects at high settings.

  Clicking on the nameplate lifts off the cover to reveal options that were not on the original unit. Two different WOW effects are selectable: TYPE 1 for the sonics of the original tabletop unit, and TYPE 2 for the enhancement algorithms of the SRS Megawide rackmount unit. The TrueBass processor also has selectable frequencies, so the low-end response can be set to the material.

  Documented applications are 1990s guitar tones, width on room mics, reverb returns and pads, kick and bass processing via TrueBass, and adding dimension to loops and keyboard patches.
specs: |-
  - Precise digital model of the hardware WOW Thing spatial processor
  - WOW control for psychoacoustic stereo widening beyond the speakers
  - TrueBass low-frequency enhancement with selectable frequencies
  - Two selectable algorithms: TYPE 1 (original tabletop unit) and TYPE 2 (SRS Megawide rackmount unit)
  - Hidden panel of extra options revealed by clicking the nameplate
  - Software-based licensing, no USB or hardware dongle and no special drivers
  - Activation on up to four machines at the same time
  - Internet connection required for activation and for all demos
  - Minimum: Intel, AMD or Apple Silicon i5 quad core processor
  - Minimum: 4GB of RAM
  - Minimum: Mac OS X 10.14 or higher
  - Minimum: Windows 7 and above
  - Minimum screen resolution: 1024 x 768
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
