description: "A quirky, Lo-Fi spatial effects processor that's a secret weapon
  for huge-sounding guitars. Also great for enhancing the stereo space of mixes
  and creating warmth and bottom. Based on the original hardware WOW Thing, a
  $20 device that made speakers sound more spacious through radical equalization
  and psychoacoustic processing. Features two WOW effect types (original
  tabletop unit vs SRS Megawide rackmount algorithms), TrueBass low-frequency
  enhancement with selectable frequencies, and stereo width enhancement for room
  mics, reverb returns, and pads."
