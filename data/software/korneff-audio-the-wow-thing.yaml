description: A quirky, Lo-Fi spatial effects processor that's a secret weapon for huge-sounding guitars. Also great for enhancing the stereo space of mixes and creating warmth and bottom. Based on the original hardware WOW Thing, a $20 device that made speakers sound more spacious through radical equalization and psychoacoustic processing. Features two WOW effect types (original tabletop unit vs SRS Megawide rackmount algorithms), TrueBass low-frequency enhancement with selectable frequencies, and stereo width enhancement for room mics, reverb returns, and pads.
details: |-
  The Wow Thing is a quirky, lo-fi spatial effects processor that is a secret weapon for huge-sounding guitars. It is also useful for enhancing the stereo space of your mixes and for creating warmth and bottom.

  The original WOW Thing was a $20 plastic box that made cheap speakers sound more spacious and full, achieving the effect with radical equalization and bizarre psychoacoustic processing built from delays and phase. It worked, but it was weird and quirky and definitely not a pro-audio device, until a major rock engineer discovered what it did to guitars while recording one of the most influential and successful metal albums on the planet. The WOW Thing became the secret sauce on many iconic albums.

  The controls are simple: turn up the WOW knob and any stereo source fed through it moves out beyond the speakers. At extreme settings it adds so much psychoacoustic movement and confusion that it can genuinely make a listener feel motion sick. TrueBass is a low-frequency enhancement that adds depth and rumble, from a touch of thickening to unique low-end effects when cranked.

  Clicking on the nameplate lifts off the cover to reveal options that were not on the original unit. Two different WOW effects are selectable: TYPE 1 for the sonics of the original tabletop unit, and TYPE 2 for the enhancement algorithms of the obscure SRS Megawide rackmount unit. The TrueBass processor also has selectable frequencies, so the low-end response can be tailored to the material and the mix.

  Suggested uses are iconic 90s guitar tones from the precise digital model of the hardware, width and space on room mics, reverb returns and pads, kick and bass sounds via TrueBass, and adding flavour and dimension to flat, dull loops or keyboard patches.
specs: |-
  - Precise digital model of the hardware WOW Thing spatial processor
  - WOW control for psychoacoustic stereo widening beyond the speakers
  - TrueBass low-frequency enhancement with selectable frequencies
  - Two selectable algorithms: TYPE 1 (original tabletop unit) and TYPE 2 (SRS Megawide rackmount unit)
  - Hidden panel of extra options revealed by clicking the nameplate
  - Software-based licensing, no USB or hardware dongle and no special drivers
  - Activation on up to four machines at the same time
  - Internet connection required for activation and for all demos
  - Minimum: Intel, AMD or Apple Silicon i5 quad core processor
  - Minimum: 4GB of RAM
  - Minimum: Mac OS X 10.14 or higher
  - Minimum: Windows 7 and above
  - Minimum screen resolution: 1024 x 768
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
