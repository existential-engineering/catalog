description: A lo-fi spatial effects processor for stereo width, guitar
  processing and low-frequency enhancement. Based on the original hardware WOW
  Thing, an inexpensive consumer device that widened the sound of small speakers
  through radical equalization and psychoacoustic processing. Features two WOW
  effect types (original tabletop unit and SRS Megawide rackmount algorithms),
  TrueBass low-frequency enhancement with selectable frequencies, and stereo
  width enhancement for room mics, reverb returns and pads.
details: |-
  A quirky, Lo-Fi spatial effects processor that's a secret weapon for huge-sounding guitars. It's also great for enhancing the stereo space of your mixes and creating warmth and bottom.

  The little plastic box that makes guitars a big thing. The Original WOW Thing was $20 and made cheap speakers sound more spacious and full. It achieved this effect by using radical equalization and some bizarre psychoacoustic processing using delays and phase. It worked, but it was weird and quirky. Definitely NOT a pro-audio device, until a major rock engineer discovered that it did amazing things to guitars when he recorded one of the most influential and successful metal albums on the planet. The WOW Thing became the secret sauce on many iconic albums.

  More than stereo widening. Much more. Simple controls make it easy to add spaciousness to your stereo tracks: just turn up the WOW knob. Any stereo source fed through the WOW Thing moves out beyond the speakers. At extreme settings, the WOW Thing adds so much psychoacoustic movement and confusion that it can actually make you feel motion sick. TrueBass is a low-frequency enhancement that adds depth and rumble to your tracks. Add just a touch to thicken a sound, or crank it up for unique low-end effects.

  Beyond the Original. Click on the nameplate to "lift off" the cover and access options that weren't on the original unit. Choose from two different WOW effects: select TYPE 1 for the sonics of the original tabletop unit, or TYPE 2 for the enhancement algorithms of the obscure SRS Megawide rackmount unit. The Korneff Audio WOW Thing also has selectable frequencies for the TrueBass processor, to tailor the low-end response to suit your material and mix.

  What WOW can do for you. Get iconic 90s guitar tones with a precise digital model of the hardware WOW Thing. Add width and space to room mics, reverb returns and pads. Dial in great kick and bass sounds with TrueBass enhancements. Add flavor and dimension to spice up flat, dull loops or keyboard patches.
specs: |-
  - Digital model of the hardware WOW Thing tabletop unit
  - WOW knob for psychoacoustic stereo widening using equalization, delays and phase
  - TrueBass low-frequency enhancement with selectable frequencies
  - Two WOW effect types: TYPE 1 (original tabletop unit) and TYPE 2 (SRS Megawide rackmount algorithms)
  - Hidden panel of extra options, revealed by clicking the nameplate to lift off the cover
  - Software-based licensing, no USB or hardware dongle, up to four simultaneous machine activations, internet connection required for activation and demos
  - Minimum system: Intel, AMD or Apple Silicon i5 quad core, 4GB RAM, macOS 10.14 or higher, Windows 7 and above, screen resolution 1024 x 768 or higher
