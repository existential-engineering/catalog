description: Obliterate is a free, unhinged distortion plugin for destroyed
  drums, deranged basses, and horror sound design. Use cautiously.
details: |-
  Obliterate doesn't make your audio sound better, it destroys it. Obliterate isn't just angry, it wants to make your song angry. It wants to make your listeners angry. Obliterate wants to make everyone angry.

  Obliterate started life as a filter, but there was a bug in the code. That bug could have been fixed, but it was left to fester. Over time that bug grew and mutated. It gained new powers and its anger warped them to its evil will. Seven years after that initial bug Obliterate can't be described as a filter at all. Obliterate is more like a new form of resonant distortion. Use cautiously. Use sparingly. And always clean up afterward.

  Recontextualize your drums: Obliterate's extreme distortion is perfect for synth drums. Create new timbres with over the top destruction and blend to taste. Not just 808's, but all kinds of drums enjoy a touch of obliteration.

  Obliterate can transform your bass sound into something amazing. Bass Cliffs automates the frequency of the distortion and the filters to create a riser. Obliterate can make horror more horrible.

  Obliterate really did start as a normal filter algorithm but a bug gave it an incredible sounding distortion. So much that it stopped sounding like a filter at all. It sounded insane. That aspect was nurtured rather than fixed, and packaged into this free plug-in.
specs: |-
  - Absurd, over-the-top, digital distortion
  - Perfect for destroyed drums, insane basses, and horror sound design
  - Distortion has built in frequency and resonance control
  - Two destruction algorithms: TOO MUCH, and TOO MOST
  - Two resonant multi-mode filters morphable between Lowpass, Highpass, Bandpass, Allpass, and Notch
  - Click and Drag to control all frequencies and resonances at once
  - macOS 10.14+, 64-bit AAX, AU, VST, VST3
  - All macOS formats are Apple Silicon compatible
  - Windows 10+, 64-bit AAX, VST, VST3
