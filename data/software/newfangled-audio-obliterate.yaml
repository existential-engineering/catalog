description: Obliterate is a free over-the-top resonant distortion filter plugin
  that destroys audio with absurd digital distortion. Originally born from a bug
  in filter code, it features two distortion algorithms and dual morphable
  multi-mode filters.
details: |-
  Obliterate is a free distortion plugin from Newfangled Audio that embraces destruction rather than enhancement. The plugin was born from a bug in filter code that accidentally created a unique resonant distortion effect, which the developers decided to release as its own instrument.

  The plugin features two distinct distortion algorithms — 'TOO MUCH' and 'TOO MOST' — each delivering extreme digital saturation and harmonic destruction on audio signals.

  At the core of Obliterate are two resonant multi-mode filters that can be morphed continuously between Lowpass, Highpass, Bandpass, Allpass, and Notch modes. Frequency and resonance are controlled via click-and-drag interactions.

  Obliterate is well-suited for creative destruction tasks such as designing synth drums and bass sounds, creating horror sound design elements, or any application where radical tonal transformation is desired.

  The plugin is available as a free download for macOS (10.14+, Apple Silicon compatible) and Windows 10+, in 64-bit AAX, AU (macOS only), VST, and VST3 formats.
specs: |-
  - Distortion algorithms: TOO MUCH, TOO MOST
  - Two resonant multi-mode filters
  - Filter modes: Lowpass, Highpass, Bandpass, Allpass, Notch (morphable)
  - Click-and-drag frequency and resonance control
  - macOS 10.14+ (64-bit, Apple Silicon compatible)
  - Windows 10+ (64-bit)
  - Formats: AAX, AU (macOS), VST, VST3
