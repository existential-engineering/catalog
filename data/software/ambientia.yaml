details: >-
  This free pack is an add-on for the pad factory bundle or the golden, silver
  and bronze pad factory kontakt libraries. It contains 50 ambient multi
  patches.


  These patches are made with the ambient and new age music genres in mind but
  can also be used for other genres of music.


  These huge soundscapes will bring your ambient and new age tracks to life.


  50 ambient multi patches (*.nkm) using the patches and samples from the pad
  factory series of kontakt libraries (bundle, golden, silver and bronze), no
  samples included.


  Huge soundscapes that are very suitable for ambient and new age music.
