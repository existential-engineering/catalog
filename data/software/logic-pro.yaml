description: >-
  Logic Pro is Apple's professional digital audio workstation and MIDI
  sequencer for macOS and iPadOS, featuring a complete collection of
  instruments, effects, loops, and tools for music production, mixing,
  and mastering.
details: |-
  Logic Pro provides a complete professional music production environment
  with a vast collection of built-in instruments, effects, and a massive
  sound library — all included with a single purchase.

  The instrument collection includes Alchemy (a powerful hybrid synthesizer),
  ES2, Retro Synth, Vintage B3 organ, Studio Strings, Studio Horns, and
  more. The Drummer feature provides realistic virtual drum performances
  with intelligent pattern generation that responds to other tracks.

  Smart Tempo automatically analyzes and adapts to the tempo of recorded
  audio. Flex Time and Flex Pitch enable nondestructive time and pitch
  manipulation. Quick Sampler and Sampler provide drag-and-drop sampling
  workflows.

  The Step Sequencer offers pattern-based MIDI programming with per-row
  automation. Live Loops provides a nonlinear clip-launching workflow
  similar in concept to session-based production.

  Spatial Audio tools support Dolby Atmos mixing with head tracking.
  AI-powered features include stem separation, session players, and
  intelligent mastering assistance.

  A comprehensive selection of audio effects includes vintage EQs,
  compressors, Space Designer convolution reverb, and ChromaVerb
  algorithmic reverb. The Channel EQ and Channel Strip provide
  efficient mixing tools.
specs: |-
  - Unlimited audio and MIDI tracks
  - 100+ built-in instruments and effects
  - Over 200 GB sound library included
  - Alchemy synthesizer
  - Drummer with intelligent pattern generation
  - Smart Tempo
  - Flex Time and Flex Pitch
  - Live Loops session view
  - Step Sequencer
  - Quick Sampler and Auto Sampler
  - Dolby Atmos and Spatial Audio support
  - Stem separation (AI-powered)
  - Session Player (AI bass, keys, drums)
  - Score editor and notation
  - Comping and take folders
  - Track alternatives
  - Mixer with channel strips
  - AU plugin support
  - 64-bit summing engine
  - Up to 24-bit / 192 kHz audio
  - macOS and iPadOS
