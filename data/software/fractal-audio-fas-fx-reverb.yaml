description: FAS-FX Reverb is a professional-quality AU, VST, and AAX plugin for
  Mac and Windows featuring Fractal Audio's renowned reverb engine in a software
  format. With true stereo processing, seven versatile reverb types, detailed
  control over early reflections and tail behavior, built-in EQ and ducking, and
  intuitive preset management, it delivers exceptional sound quality with
  remarkable CPU efficiency.
details: |-
  FAS-FX Reverb is a reverb plugin for Mac and Windows that carries the Fractal Audio reverb engine into a software format. It is distributed in AU, VST and AAX formats, so it loads in a host rather than running as a standalone application.

  The engine offers true stereo processing and seven reverb types, with detailed control over early reflections and over the behaviour of the tail, plus built-in EQ and ducking and preset management. The page presents the result as high sound quality at low CPU cost, covering natural rooms and plates through to expansive halls and creative effects, bringing the character of the Fractal hardware reverbs into a DAW.

  The page also carries a status callout about availability. FAS-FX Reverb is being re-designed and updated with the changes from the newest Fractal Audio hardware reverb processing algorithms, and it is not currently available for purchase. The final release, version 1.5.1, remains available to existing users through a download link on the page. That build operates on macOS 12 and Windows 11, and the page warns that there may be issues in this legacy version.
