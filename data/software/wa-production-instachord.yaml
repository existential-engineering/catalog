description: A MIDI processing plugin for playing chords and chord progressions from a small number of controller keys. Provides a chord bank in five voicing modes, assignable chord and action keys, and transposition.
details: |-
  InstaChord is a MIDI processing plugin that helps play chords and chord progressions faster, using just a few keys on a controller. It is aimed at songwriters and producers looking to find a progression quickly, at players who want access to difficult chords in any key, and at students and teachers using it as a chord reference.

  Almost all the common chords are included (major, minor, sus2, 6th, 7th and others) in five voicing modes: basic, first inversion, second inversion, guitar and wide. Each voicing mode has its own character because of the order of the notes, so one may suit the other chords in a song better than another.

  Chords can be hit or strummed with different combinations of notes, speeds and directions. One key can be assigned to strum the top three notes of a chord while another hits the two middle notes. Individual notes of a chord can also be played separately, so chords can be arpeggiated or strummed manually.

  Hold mode lets the chord changer keys control sustain, so any note played rings out while a chord key is held down, in the manner of a guitar or a sustain pedal. Up to 24 chords can be set and switched between using the chord keys, and 24 action keys can be assigned to functions such as a full strum, hitting the first two notes, or transposing. Transpose moves the current chords to another key in a few clicks, which is useful when a song changes key during live playing.

  The plugin is customizable in several respects. An action key setup can be locked so it is not replaced when a new preset is loaded, and the two octaves holding the chord and action keys can each be moved up or down the controller to a more comfortable position. 40 factory presets carrying chord progressions are included, and tutorials cover installation and setup across operating systems and DAWs.
specs: |-
  - MIDI processor for chords and chord progressions
  - Common chord types in five voicing modes: basic, first inversion, second inversion, guitar and wide
  - Up to 24 assignable chord keys
  - 24 assignable action keys for strums, hits and transposition
  - Hold mode tying sustain to the chord changer keys
  - Transpose control for the whole chord set
  - Repositionable chord and action key octaves
  - User chords added in version 1.1.0, with a chord learn option in version 1.2.0
  - 40 factory presets
  - UI scaling options
  - VST3 and AAX formats added in version 1.3.0
  - Windows 8 and later (32 or 64 bit)
  - macOS 10.13 and later
  - Requires a host supporting VST or AAX with MIDI routing, or the AU MIDI effect type
  - Not compatible with Maschine 2 or Reason, which provide no MIDI routing
