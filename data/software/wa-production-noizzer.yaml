description: A percussion enhancer that injects shaped noise into drum and percussion signals, adding frequency content that was not in the source. Noise character, decay, transient and filter controls tune the layer to the material.
details: |-
  Noizzer layers noise onto percussion to add frequency content that is not present in the original signal. The manual technique of building white noise profiles and gating them against a drum track is automated here, so snares, hi-hats and other percussion can be sharpened and thickened without hand layering audio.

  A large central control sets how much noise is added to the signal. A Listen mode solos the noise layer for previewing before it is blended in, and Sustain Mode extends hits, which also keeps fast repeated notes tight and consistent. The Decay knob sets how long the noise rings out, from tight clicks to longer sustains, while the Transient control adds front-end attack.

  Tone shaping goes beyond a plain burst of white noise. The Character selector offers a palette of noise profiles from fine hiss to coarse crackle, and high-pass and low-pass filters trim sub-bass rumble or brittle top end, so the layer sits naturally against the source.

  The interface is built on vector graphics and is resizable, with a live spectrum display across the top showing what happens to the signal at each stage of the chain. AB comparison with copy and paste allows different processing chains to be contrasted, and undo and redo revert changes.

  A large factory preset library runs from subtle transient shaping through to fizzy distortion, giving starting points for most kinds of percussion.
specs: |-
  - Percussive enhancement through shaped noise injection
  - Listen mode to solo the noise layer
  - Sustain mode for extended hits
  - Decay and transient envelope shaping
  - Character selector with multiple noise profiles
  - High-pass and low-pass filtering
  - Independent input and output gain
  - Frequency spectrum monitoring
  - AB comparison with undo and redo
  - Resizable interface
  - Responsive and CPU friendly
  - Factory presets
  - Full PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Intel and Apple Silicon CPUs, with native AAX format
