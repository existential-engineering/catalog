description: HORIZON LEADS opens the door to a new sonic dimension for cinematic scoring. It is your gateway to a revolutionary cinematic scoring experience, featuring 80 playable synth lead instruments with synthesizer sounds meticulously sampled and infused with the warmth of acoustic instruments.
specs: |-
  - 80 playable synth lead instruments
  - 150 customizable animated themes across five categories
  - 1.9GB+ of sample content
  - Requires Kontakt 7.5.0 or higher (works with free Kontakt Player)
  - NKS-ready
  - Four-layer sound architecture with onboard compressor, delay, and reverb
  - Modified Ensemble Engine, Motion Engine, Pan Engine
  - MIDI drag-and-drop export
  - macOS 11+ (Intel Core i5 or M1)
  - Windows 10+ (Intel Core i5)
  - 4GB RAM minimum (6GB recommended)
  - 1.9GB+ disk space
  - Direct3D 11.1 graphics support
