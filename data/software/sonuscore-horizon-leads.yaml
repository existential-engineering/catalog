description: HORIZON LEADS opens the door to a new sonic dimension for cinematic scoring. Unleash the power of synthesizer sounds meticulously sampled and infused with the warmth of acoustic instruments.
details: |-
  HORIZON LEADS is a KONTAKT instrument of cinematic synth leads, built from deeply sampled synthesizer sounds treated like acoustic instruments. The page frames it as an answer to the demand for expressive synth tones in the style of productions such as Blade Runner 2049, Dune and Interstellar, usable both as a scoring tool for a musical theme or motif and as a synth for writing melodies.

  It ships with 80 freely playable synth instruments and 150 complex animated, fully customisable themes spread across five categories: Poly Animations, Playable Poly Leads, Playable Poly Shorts, Playable Mono Leads and Playable Mono Shorts. The themes are driven by a modified version of the ELYSION ensemble engine, so playing a simple chord produces pulsating rhythms and animated arrangements from up to four instrument modules at once, each with independent arpeggiator controls and a mod-wheel filter effect.

  Alongside the ensemble engine sit a Motion Engine, which customises the instruments fundamentally by steering parameters such as attack or decay via MIDI CC and includes two pan steppers, and a Pan Engine for controlling and automating panning. Each of the four sound layers has an independent arpeggiator and two pan engines, with an onboard compressor, delay and hall reverb. Performances can be dragged and dropped into a DAW as MIDI.

  The interface is the one used by ELYSION and THE ORCHESTRA, with a main page for selecting instruments and presets, a mix page, a preset browser with filters and categories, and pages for the ensemble, motion and pan engines. The sounds were designed by Tobias Menguser, who previously programmed synths for Waldorf, Ensoniq and Clavia and worked at Native Instruments, and who built the library in his Mallorca studio using analog synths and a rack of effect devices.
specs: |-
  - Works with the FREE KONTAKT PLAYER
  - Requires KONTAKT version 7.5.0 or higher
  - macOS 11 or higher (Intel Core i5 / M1)
  - Windows 10 or higher, Intel Core i5
  - Graphics card with Direct 3D 11.1 support
  - 4 GB RAM (6 GB recommended for large KONTAKT instruments)
  - At least 1.9 GB of free hard disc space
  - Over 1.9 GB of sample content
  - 80 instantly playable lead instruments
  - 150 complex animated and fully customizable themes, featuring up to 4 fully controllable instruments
  - Five theme categories: Poly Animations, Playable Poly Leads, Playable Poly Shorts, Playable Mono Leads, Playable Mono Shorts
  - Modified ELYSION Ensemble Engine, plus Motion Engine and Pan Engine
  - Four sound layers with onboard compressor, delay and hall reverb; each layer has an independent arpeggiator and two pan engines
  - MIDI export via drag and drop into the DAW
  - Designed by sound designer Tobias Menguser
  - NKS ready
