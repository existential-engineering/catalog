description: "A software emulation of the legendary MagicDeathEye hardware tube
  compressor, loosely based on a Fairchild 660, designed to smoothly glue audio
  signals together with warm, elegant compression."
details: |-
  Variable gain compression
  Tube compressor emulation based on Fairchild 660
  Suitable for mastering bus and individual tracks
  Low CPU load
  Mono and stereo operation
  Identical gain reduction across channels
specs: |-
  - Eight tubes simulated in the circuit model
  - Handwound transformer modeling
  - Mono and stereo operation with identical gain reduction for both channels
  - Low CPU load while maintaining circuit accuracy
  - Variable gain compressor design based on Fairchild 660 circuit
  - Available as 32-bit and 64-bit plugin
  - Mac: requires OSX 10.7 or higher; supports Intel and Apple Silicon
  - Linux: available in ARM and x86_64 format as VST3
  - iOS: available in AUv3 format
