description: true:balance is a metering plug-in that offers info for taking the
  right steps towards optimizing the spectral balance of your mix.
details: |-
  true:balance is a metering plug-in that offers all the necessary info and guidance for taking the right steps towards optimizing the spectral balance and mono compatibility of a mix. It combines a real-time spectrum analyzer with an average spectrum, genre-based and custom references, and readouts for stereo width and stereo correlation.

  Advanced spectral balance metering: true:balance makes sure you have all the info you need on the spectral distribution of your mix. The displayed readouts and their visualizations are designed so you do not have to second-guess what you are seeing. Key readouts are supported by target indicators, showing whether your track is close to the values of your chosen reference, and the channel data section displays the stereo width and correlation of the mix, and hence its mono compatibility.

  Genre-based references and custom reference tracks: since the "right" spectral distribution has a lot to do with listening expectations, genre-based references are useful to compare a mix against. true:balance's included references draw from a vast amount of audio data and hands-on mixing experience. For consistency across an entire project, up to 8 reference tracks can be loaded instead.

  Balance Check and Mono Check: true:balance is designed for professionals as well as ambitious bedroom producers, and the latter will appreciate the hints on which modifications a mix requires to approach the reference values. Balance Check analyzes the current spectral distribution of the signal, compares it with the chosen reference and gives text-based suggestions, while Mono Check points out any potential problems concerning the mono compatibility of the mix.
specs: |-
  - Real-time spectrum analyzer and the average spectrum
  - Genre-based references and custom reference option
  - Info on stereo width and stereo correlation values
  - Balance Check with text-based suggestions and Mono Check
  - Up to 8 reference tracks can be loaded
  - Plug-in formats (Mac): VST, VST3, AU, AAX
  - Plug-in formats (Windows): VST, VST3, AAX
  - Supported formats: mono, stereo, Dolby Surround 5.1
  - Supported sample rates: 44.1 kHz to 192 kHz
