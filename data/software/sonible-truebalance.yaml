description: true:balance is a metering plug-in for analyzing and metering
  spectral distribution. It provides the readouts and guidance needed to
  optimize the spectral balance and mono compatibility of a mix.
details: |-
  true:balance shows the spectral distribution of a mix through a real-time spectrum analyzer alongside an average spectrum. Readouts and their visualizations are designed to be unambiguous, and key readouts are supported by target indicators that show how close a track sits to the values of the chosen reference. A channel data section covers stereo width and stereo correlation, which together describe the mono compatibility of the mix.

  Because the right spectral distribution has a lot to do with listening expectations, the plug-in ships with genre-based references drawn from a large body of audio data and hands-on mixing experience. For consistency across an entire project, up to 8 custom reference tracks can be loaded instead.

  Two assistive checks turn the analysis into concrete next steps. Balance Check analyzes the current spectral distribution of the signal, compares it with the selected reference, and returns text-based suggestions. Mono Check points out potential problems with the mono compatibility of the mix.

  The plug-in is aimed at professionals and at ambitious bedroom producers alike, the latter benefiting from the hints on which modifications a mix needs in order to approach the reference values. It runs as VST, VST3, AU and AAX on macOS and as VST, VST3 and AAX on Windows, with native Apple Silicon support.
specs: |-
  - Real-time spectrum analyzer plus average spectrum display
  - Genre-based references, or up to 8 custom reference tracks
  - Target indicators on key readouts for comparison against the chosen reference
  - Channel data section with stereo width and stereo correlation values
  - Balance Check: compares spectral distribution with the reference and gives text-based suggestions
  - Mono Check: flags potential mono compatibility problems
  - Plug-in formats (Mac): VST, VST3, AU, AAX
  - Plug-in formats (Windows): VST, VST3, AAX
  - Supported channel formats: mono, stereo, Dolby Surround 5.1
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based or iLok
  - Apple Silicon support: native
  - Windows: Windows 10 or later (64 bit)
  - Mac: macOS 10.12 or later
  - RAM: 4 GB
  - CPU: Intel Core i5 or Apple Silicon
  - GPU: OpenGL version 3.2 or later
