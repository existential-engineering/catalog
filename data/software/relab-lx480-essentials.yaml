description: LX480 Essentials is a streamlined reverb plugin emulating the classic Lexicon 480L hardware, offering four of the most famous presets from the original hardware with sample-accurate Plate, Hall, Ambience, and Room algorithms.
details: |-
  LX480 Essentials brings four of the most iconic reverb algorithms from the legendary Lexicon 480L hardware unit into a streamlined plugin format. The 480L, introduced in the mid-1980s and refined into the early 1990s (V4.10), became a studio standard for its distinctive reverb character heard on countless hit records.

  The plugin features four reverb algorithms—Fat Plate, Medium Hall, Small Ambience, and Large Wood Room—each with signature presets crafted by renowned engineers Richard Furch and Joe Carrell. These algorithms are sample-accurate matches to those found in the full LX480 Dual-Engine version.

  LX480 Essentials runs natively on Apple Silicon (M1 and later) as well as Intel Macs running macOS 10.12 and above, and on Windows 10 and above. It ships as VST/VST3/AU/AAX (64-bit) and requires an iLok account for license management. Current version is 2.2.3.

  The plugin comes with a lifetime license and a 30-day money-back guarantee, making it an accessible entry point into Relab Development's 480L emulation lineup.
specs: |-
  - Four reverb algorithms: Fat Plate, Medium Hall, Small Ambience, Large Wood Room
  - Sample-accurate algorithms matching the full LX480 Dual-Engine version
  - Formats: VST / VST3 / AU / AAX (64-bit)
  - macOS 10.12 and above, M1 native
  - Windows 10 and above
  - Mac system requirements: Intel or M1 processor, 2 GB RAM
  - Windows system requirements: Core 2 or higher, 2 GB RAM
  - iLok account required (no iLok dongle required)
  - Lifetime license
  - 30-day money-back guarantee
  - Current version: 2.2.3
