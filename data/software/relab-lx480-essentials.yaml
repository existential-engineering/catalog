description: Relab LX480 Essentials not only faithfully captures the sound of the classic reverb hardware, but makes getting that legendary sound faster and easier than ever before. Transform tracks with the rich complex textures, and lush spacious reverb tails that only the Relab LX480 can deliver.
details: |-
  LX480 Essentials uses the exact same sample-accurate algorithms as the LX480 Dual-Engine version, distilled into a single, streamlined and easy to use reverb plug-in built around four of the most famous presets from the original hardware.

  Based on four of Relab's best-in-class reverb algorithm emulations of one of the most widely-used algorithmic reverbs ever built, the plug-in offers the Plate, Ambience, Hall and Room algorithms: Fat Plate for lush, rich, shiny plates without mix clutter, Medium Hall for a smooth and even decay, Small Ambience for adding distance to a very dry sounding track, and Large Wood Room for creating a sense of space without being overtly distinguishable.

  The original 1986 hardware was met with much praise, and many still regard it as one of the finest reverbs ever created. At the time, it cost $20,000. Six more years of development followed, ending with a final software upgrade (V4.10) in the early 90s.

  The plug-in includes signature presets created by mixers such as Richard Furch and Joe Carrell.
specs: |-
  - Four reverb algorithms: Fat Plate, Medium Hall, Small Ambience, Large Wood Room
  - Same sample-accurate algorithms as the LX480 Dual-Engine reverb
  - Signature presets created by mixers including Richard Furch and Joe Carrell
  - Hundreds of hand-crafted premium presets
  - 64-bit only
  - Mac: OS X 10.12 and above, M1 native
  - Windows: Windows 10 and above
  - Authorization via iLok (local computer authorization or iLok USB key, V2 or above); no hardware dongle required
  - Compatible hosts: Logic Pro 10.x (Mac), Pro Tools 11.3.2 and up, Cubase 9.5 and up, Nuendo 8 and up, Live 9 and up
