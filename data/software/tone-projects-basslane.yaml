details: |-
  Basslane is the improved version of the original freeware classic used in
  countless productions to control the stereo width of low frequencies on tracks
  and mixes. It's a handy utility that allows you to narrow the stereo width of
  frequencies below a defined threshold.

  The unique side harmonics feature adopted from basslane pro allows you to
  inject upper bass harmonics to add definition and pseudo bass width without
  problematic stereo content in the subs. The easy-to-use interface combines
  helpful metering and flexible monitoring for precise fine-tuning.

  Key features: easy to use mono-maker with a tailored workflow. Unique side
  harmonics feature to create mono bass that sounds wide. 2 different modes: the
  classic response and a new flat response. 6/12 db/oct filter switch for
  variable filter steepness. Width sweepable from full stereo to full mono.
  Stereo balance and correlation metering of affected frequency range. Flexible
  monitoring modes.
specs: |-
  - Mono-maker utility
  - Side harmonics feature
  - 2 filter response modes (classic and flat)
  - 6/12 dB/oct filter switch
  - Width control (full stereo to full mono)
  - Stereo balance metering
  - Correlation metering
  - Flexible monitoring modes
  - Low CPU usage
