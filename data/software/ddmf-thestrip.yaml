details: |-
  6-band EQ section (based on 6144 EQ model)
  Flexible gate with adjustable attack/release
  Compressor with up to 10:1 ratio
  Phase inversion option
  Interchangeable EQ and compressor order
  Internal oversampling
specs: |-
  - 6-band EQ section (based on the 6144 EQ)
  - Flexible gate with adjustable attack and release time
  - No-nonsense compressor with up to 10:1 ratio
  - Phase inversion option
  - Interchangeable EQ and compressor order
  - Internal oversampling available
  - Low CPU usage
  - Available in 32-bit and 64-bit formats
  - Formats: VST, VST3, AU, AAX (desktop); AUv3 (iOS)
  - Mac: OSX 10.7 or higher required; Intel and Apple Silicon supported
  - Linux: VST3 plugin available in ARM and x86_64 formats
  - Demo versions available for Windows, Mac, Linux ARM, and Linux x86_64
