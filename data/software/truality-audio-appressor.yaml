details: |-
  Appressor (uppressor) is an audio VST-3 plugin that enhances the clarity of an
  audio signal. It works better with a moderate input signal (less than -4
  dbfs). A simplistic gui follows my function-over-form approach.

  The plugin boosts the high end without sounding overly harsh and features a
  minimalist design with only one knob for control.
