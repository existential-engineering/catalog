details: |-
  Aleatoric Orchestra Effects

  CAGE (Custom Aleatoric Group Effects) is the definitive collection of orchestral effects, pushing the boundaries of traditional orchestration. It features an extensive range of string, brass, and woodwind effects that blur the line between tonal and non-tonal soundscapes. From massive glissandi and aggressive tremolos to eerie bends and chaotic textures, this library offers a limitless array of sonic possibilities. Each section—strings, brass, and woodwinds—comes with 3 microphone positions, allowing you to mix, morph, and explore the full depth of these effects in Soundpaint. The Aleatoric String Orchestra includes high and low strings, offering everything from cluster chops to disco drops. The Aleatoric Brass Orchestra is split into three ensembles: horns, trumpets, and trombones, with effects ranging from epic rips to burning marcato. Meanwhile, the Aleatoric Woodwind Orchestra covers high and low woodwinds, delivering pulses, growls, and hauntingly beautiful arcs. Whether you're creating horror, trailer music, or ethereal ambiances, these libraries are designed to adapt to any creative need. Aleatoricism, the art of controlled randomness, is at the core of these libraries, allowing musicians to transcend traditional structures and dive into uncharted sonic territories. With Soundpaint's capabilities, you can stretch, stack, and freeze effects, unearthing new sounds and crafting a unique auditory experience. Each element of the Aleatoric Orchestra is designed to inspire, provoke, and seduce, offering a dynamic and unpredictable musical journey.
