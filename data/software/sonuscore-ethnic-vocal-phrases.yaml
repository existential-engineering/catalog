description: Ethnic Vocal Phrases by Hayat Selim is a vocal solo instrument for soundtrack work, delivering powerful and emotional vocal phrases.
details: |-
  Ethnic Vocal Phrases is a solo vocal phrase instrument aimed at soundtrack work, built from live performances rather than sustained vowels or static samples. Pressing a key returns a complete sung phrase, so the musicality of a real take is preserved instead of being reassembled from syllables, and the library is positioned as a way to put the character of a single human voice over an orchestral or hybrid bed.

  All vocals were performed by Hayat Selim, a film composer and singer-songwriter born in 1990 in Cairo, Egypt, who graduated with a master's in composition for screen from the Royal College of Music in London and is now based in the UK. Her single Mirage, her first in classical Fusha Arabic, was nominated in the Best Song category of the Jerry Goldsmith Awards 2019. She writes for film and games, often merging Western classical orchestration with world music, atmospheric soundscapes and vocals, and sings in English, German, Arabic, Italian, Latin and French.

  The library holds more than 600 live-performed phrases split into 8 main themes and 4 bonus themes, each with its own style. The themes are sung in Classical Arabic (Fusha) and in several imaginary tribal languages influenced by African, Native American and Latin traditions, and the set also includes power vowel phrases and mixed voice vowel phrases with overblowing. A translation document covering the Arabic phrases is provided.

  Every theme is recorded in 4 different keys, so minimal pitch shifting makes the material playable in all twelve chromatic keys with the musical content staying consistent. Each theme carries 15 different phrases and 2 short endings, divided into 5 separate starting, middle and end phrases so that passages can be recombined. The interface is the one used across the Lyrical Series, with a main phrase page and an FX page for EQ, delay and reverb, and it runs in the full version of Native Instruments KONTAKT or in Steinberg's free HALion Sonic.
specs: |-
  - Over 600 different live-performed vocal phrases
  - 8 main themes plus 4 bonus themes
  - 15 different phrases and 2 short endings per theme, divided into 5 starting, middle and end phrases
  - All themes recorded in 4 different keys, playable in all chromatic keys with minimum pitch shifting
  - Themes in Classical Arabic (Fusha) and imaginary tribal languages influenced by African, Native American and Latin traditions
  - Power vowel phrases and mixed voice vowel phrases with overblowing included
  - Arabic to English phrase translation document included
  - Main phrase page plus FX page with EQ, delay and reverb
  - Solo female vocals performed by Hayat Selim
  - Requires the FULL version of Native Instruments' KONTAKT 5 (version 5.8.1 or higher), or Steinberg's free HALion Sonic
  - The free Kontakt Player is not sufficient: it only runs the instrument in DEMO mode
  - HALion Sonic is currently not compatible with Notion by PreSonus
  - Intel Core 2 Duo processor recommended
  - Mac OS X 10.11 or higher
  - Windows 7 or higher
  - 4 GB RAM
  - At least 5 GB of free hard disc space
