description: A streamlined track compressor plugin with five carefully-crafted
  compression modes offering distinct reduction behaviors and customizable time
  settings.
details: |-
  Tau Compressor Plus is a focused track compressor offering five compression
  modes, each with dedicated reduction behaviors designed for different mixing
  scenarios.

  The plugin features essential controls including Threshold, Makeup Gain, and
  Ratio, with a VU reduction meter for clear visual feedback. Wet Mix controls
  enable parallel compression techniques directly within the plugin.

  The streamlined interface prioritizes ease of use while maintaining the
  precision expected of A.O.M. products. Factory and user presets with snapshot
  capability allow quick recall of settings across sessions.

  All processing operates at 64-bit floating-point precision with support for
  sample rates from 44.1kHz to 384kHz and automatic latency compensation.
specs: |-
  - Five compression modes with distinct reduction behaviors
  - Threshold, Makeup Gain, and Ratio controls
  - VU reduction meter
  - Wet Mix for parallel compression
  - Sample rates: 44.1kHz to 384kHz
  - 64-bit floating-point internal precision
  - Latency compensation included
