description: Tau Compressor Plus is a simple track compressor plugin, with carefully-crafted five modes.
details: |-
  Tau Compressor Plus is a simple track compressor plugin, with carefully-crafted five modes. Each mode carries its own reduction behavior and time settings, and the plugin offers Threshold, Makeup Gain and Ratio controls alongside a VU reduction meter.

  A Wet Mix control allows parallel compression. The plugin runs at sample rates from 44.1 kHz to 384 kHz with 64-bit floating-point internal precision, and includes latency compensation, factory and user presets, snapshot, undo/redo and reset to default.
specs: |-
  - Five modes with dedicated reduction behaviors and time settings
  - Threshold, Makeup Gain, Ratio controls
  - VU reduction meter
  - Wet Mix controls for parallel compression
  - Supports 44.1k - 384kHz Sample Rate
  - 64-bit Floating-point Internal Precision
  - Latency Compensation
  - Factory Preset
  - User Preset
  - Snapshot
  - Undo/Redo
  - Reset to Default
  - Windows: x64-compatible CPU, Windows 11 24H2 / 25H2 (VST2, VST3, AAX-Native, CLAP)
  - Mac: Intel / Apple Silicon, macOS Monterey 12 through Tahoe 26 (VST2, VST3, Audio Unit, AAX-Native, CLAP)
