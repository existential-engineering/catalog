details: |-
  Amplitube svx features 18 models including 4 amps, 6 cabinets and 8 stomps, giving you the "greatest hits" amps, from the earth-shattering sound of rock & roll bass from the svt the grandaddy of them all, to the smooth groove-making rolls of the b-15. The scooped edginess of the 4pro. Plus a complete set of bass-specific pedals to give you unprecedented tone shaping options.

  4 amplifiers: svx-500 - based on the ampeg ba-500, a high quality solid-state bass amp with a sonic fingerprint that will deliver a big, detailed sound. Svx-15r - based on the re-issued 1960s ampeg b-15r, enhanced and improved. This all-tube model limited production features the "classic" tube preamp combined with a selectable tube 60w/100w power amplifier for the most sought-after vintage bass sound ever. Svx-cl - based on the ampeg stv-classic, this all-tube bass head delivers a warm, harmonically rich and punchy sound that is a trademark for the rock bass sound both live and in the studio. Svx-pro - based on ampeg svt-4pro, a real all-round high end bass amplifier.

  6 cabinets: svx-500 - based on ampeg ba500 cab model. Svx-15r - based on ampeg b-15r portaflex "flip top" cab model. Svx-410b - based on ampeg bxt 410h cab model. Svx-212 - based on ampeg pb-212h cab model. Svx-410s - based on ampeg svt-410h cab model. Svx-810e - based on ampeg svt-810e cab model.

  8 stompboxes: svx-od - based on the ampeg scp-od overdrive pedal. Svx-oct - based on the ampeg spc-oct octaver pedal. Analog chorus - a model of a classic analog chorus/vibrato. Analog delay - this model is based on a classic analog delay with modulation stomp pedal. Bass wah - modeled after a classic wah pedal used by many top players in the 60's and 70's. Compressor - this effect is modeled after a vintage compression stomp pedal and can deliver a strong sustain and powerful compression with lots of character. Envelope filter - a highly developed filter effect, this uses the envelope of the incoming signal to control a synthesizer-style filter. Volume - a traditional volume pedal.

  Minimal system requirements for windows: intel core 2 duo or amd athlon 64 x2, 2gb of ram (4 gb suggested), windows 7, windows 8 or windows 10. Requires an asio compatible sound card. Supported plug-in formats (64-bit): VST 2, VST 3, AAX. Minimal system requirements for mac: intel core 2 duo, 2 gb of ram (4 gb suggested), mac os x 10.7 or later. Supported plug-in formats (64-bit): audio units, VST 2, VST 3, AAX.
