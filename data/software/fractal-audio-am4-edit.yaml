details: |-
  AM4-Edit is a free editor for the AM4. It lets you edit and manage your AM4 from a connected Mac or PC through an intuitive visual interface.

  Whether you're dialing in amps or effects, building scenes, organizing presets or managing user cabs, AM4-Edit streamlines the process, helping you get the most out of your unit. It even includes bonus features not available on the AM4 itself, such as Block Library, Channel Copy, Scene Swap, and more.

  Enjoy the convenience of editing with your computer keyboard and mouse. Adjust every aspect of the amp or any effect in Basic or Expert edit modes, and set up levels, EQ, routing, and controllers with ease. Speed your workflow with preset Templates, or use the Block Library to access favorite settings in just a few clicks.

  Import, export, copy/paste, and re-order presets or user cabs. Change SETUP options including Audio, Global, MIDI, and more. Use Fractal-Bot built-in to update firmware, back up, and restore.

  You can download AM4-Edit for Mac or Windows below. Version 1.00.09 is dated September 8, 2026, and is offered as a macOS build and a 64-bit Windows build.
specs: |-
  - Enjoy the convenience of editing with your computer keyboard and mouse
  - Adjust every aspect of the amp or any effect in Basic or Expert edit modes
  - Set up levels, EQ, routing, and controllers with ease
  - Speed your workflow with preset Templates
  - Use the Block Library to access favorite settings in just a few clicks
  - Import, export, copy/paste, and re-order presets or user cabs
  - Change SETUP options including Audio, Global, MIDI, and more
  - Use Fractal-Bot built-in to update firmware, back up, and restore
  - Bonus features not available on the AM4 itself, including Block Library, Channel Copy and Scene Swap
  - macOS build requires Mac OS 10.13 or newer
  - Windows build requires Windows 11 or newer (64-bit only); Windows 7 may work but is not officially supported
  - Windows build requires the AM4 USB Driver
