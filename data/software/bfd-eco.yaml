details: |-
  BFD Eco is a streamlined, fun and affordable software instrument for acoustic
  drums, based on the bfd2 engine. Optimized for flexibility and power while
  being easy to use, BFD Eco is provided with an extensive built-in library of
  drum sounds and patterns, and is also compatible with the wide range of
  FXpansion and 3rd-party add-on expansions.

  Bfd eco gives you easy access to the some of the best sounds in the bfd2
  library, recorded at london's air studios. The included sounds are full of
  dramatic levels of detail and mojo - anything but sterile, bfd eco is imbued
  with a musical character.

  The eq and dynamics/effect processing allow you to sculpt the raw sounds and
  lush stereo ambience for any situation. Dcam circuit-modelled compression,
  filtering and drive provide hardware-style tone and grit, while an integrated
  version of overloud's breverb plate algorithm can be used for artificial
  reverb effects.

  Bfd eco also contains a groove section containing over 1500 drum patterns to
  drag into your DAW, to sequence on the built-in drum track or to simply loop
  continuously. Preview patterns in sync with your project and use the
  humanization effects to adjust the feel to your needs. You can even export a
  stereo mixdown from the groove engine - ideal for generating loops and
  breakbeats to use as audio tracks or in any sampler instrument.

  Other advanced features are customizable keymapping, electronic drum support,
  the ability to combine kit-pieces from different expansion libraries, and an
  interface perfectly balanced between ease of use and powerful flexibility.
