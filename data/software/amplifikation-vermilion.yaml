details: |-
  Amplifikation vermilion is a guitar amp plugin inspired by classic guitar combo amps. It offers gorgeous looks and lots of tonality for serious guitarists who demand a guitar amp plugin with versatility. The engine of this guitar amp plugin is carefully tuned to match the tone of authentic classic amps which truly sing to your playing style.

  Amplifikation vermilion packs everything that every guitarists difficult not to love: jangling cleans, raw tube saturation, springy reverb and that trippy tremolo circuit. The chimey and warm character with a bit of grit from the clean channel is great for country, soul, funk, blues, or most older "roots" music style, it even pulls some weight for your indie-pop tracks.

  The lead channel are able to deliver rich and fluid-overdrive leads for more modern style of rock, even heavier stuff to some degrees. Add intensity to your playing using the built-in tremolo unit which gives you pulsating sound that range from subtle & slow to head-spinning fast and add dimension to the whole sound with rich & lush analog-modeled spring reverb.

  Freely adjustable dual-miking with mono/stereo configurations just like a real-life guitar recording session. Built-in impulse loader with resample function. Straightforward and easy to use interface.
specs: |-
  - 3 amp types
  - 2 amp channels: clean and lead
  - Tremolo with bpm sync
  - Spring reverb
  - 5 types of matching cabinets
  - 4 microphone types
  - Dual-miking with mono/stereo configurations
  - Impulse loader with resample function
  - A/b switch
  - Noise gate
  - Limiter
  - Photo-realistic graphics
  - 96000hz sample rate
  - VST plugin
  - Audio units plugin
  - VST 3 plugin
  - AAX plugin
  - Rack extension plugin
  - Standalone application
  - Macos and windows
