details: |-
  Turning drums into crushed gravel, direct guitars into vintage fuzz, and the human voice into an alien specter – Pusher encourages improvisation and rewards exploration with endlessly surprising colors and overtones.

  The classic modeled Diode Limiter has a snap that pops elements to the front of a mix while adding as much fiery sustain as you dare. Much like its cousin the UBK-1, Pusher injects a ton of vibe and personality into otherwise mundane sounds.
