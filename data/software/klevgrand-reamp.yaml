details: |-
  REAMP is a complex spectral saturation processor, simulating a set of different analog gear in a new and unique way. Benefits of this algorithm is that it is highly CPU efficient and adds (almost) no latency.

  The seven models available are based on real analog gear, individually measured in two dimensions: gain responses (-inf dB to +6 dB) at the frequency spectrum 20Hz to 20kHz. This data is used to transform input audio to output audio. A four-band spectral drive allows you to let the unit work even more.

  Reamp's character is very much decided by the amount of audio it is fed with. Put in, mix, bring out. Set the tonality of the chosen model, and lift selected frequency bands even more for character.

  A post-model EQ fine-tunes the outcome, and the model selector offers a collection of carefully selected top models.
specs: |-
  - Seven handpicked profiles based on real analog gear
  - Spectral drive (four bands)
  - Dry / Wet mix
  - Plenty of factory presets
  - Ultra low latency
  - Optional oversampling feature (16x)
  - Requires macOS 10.10 or later (optimized for the M1-processor), Windows 7 (SP1) or later, running an AU, VST or AAX compatible 64-bit host
  - iPad version available as AUv3 and stand-alone
  - 64-bit only
