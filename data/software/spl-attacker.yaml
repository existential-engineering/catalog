details: |-
  The attacker microplug employs the same processing technique like the original
  transient designer. Spl's differential envelope technology has revolutionized
  dynamic processing with a level-independent method. This radically different
  approach allows to forego the setting of a threshold. Other parameters are set
  automatically and in a musical manner as they follow the characteristics of
  the input signal.

  Working with the attacker is simple: all attack events can be amplified
  regardless of their signal level. After all, only one control allows to
  reshape the attack characteristics of a sound. However, the possibilities for
  studio and live applications are seemingly endless.

  Usually equalizers are used to separate instruments in a mix. With eqs the
  tonal aspect of the signal is considered but not the temporal aspect. The
  attacker now opens this new dimension in signal processing. By amplifying the
  attack curves of a sound event, the mix can be made to sound more transparent.
  Instruments can be mixed at lower levels while still maintaining their
  positions in the mix but occupying less space.

  The attacker also offers an output control gain control that allows to
  compensate for level changes after processing the signal. This ensures a
  simple and safe adjustment of levels and helps avoiding internal clipping.
specs: |-
  - Dynamics processor
  - Compressor/limiter
  - Transient designer
  - Differential envelope technology
  - Level-independent processing
  - Attack enhancement
  - Single control attack reshaping
  - Output gain control
