description: PSP N2O is a semi-modular multi-effect plug-in which offers unparalleled flexibility and total sound creation freedom. The high-quality sound processing modules can be routed in any configuration, allowing for endless musical journeys.
details: |-
  PSP N2O is a semi-modular multi-effect plug-in built upon the same basic concept as the much-loved PSP Nitro, bringing new modules and extended modulation features for completely new sonic territories. The plug-in engine has been rewritten and redesigned from scratch to improve sound and take full advantage of modern CPU optimizations.

  Up to four sound processing operators at a time: morphing resonant and formant filters, EQ, delay, reverb, pitch-shifting, compressor/expanders, bitcrushing, distortion, full-wave rectifiers and more. Up to four modulators at a time: LFO, envelope detector, and ADSR step sequencer.

  Eight assignable knobs with quick MIDI learn options for convenient access to essential preset parameters. Built-in limiter using algorithms from PSP Xenon mastering limiter. Three displays, simplified modulation setup, keyboard and mouse wheel support.
specs: |-
  - Up to four sound processing operators simultaneously
  - Up to four modulators: LFO, envelope detector, ADSR step sequencer
  - Eight assignable knobs with MIDI learn
  - Built-in limiter (PSP Xenon algorithms)
  - Sidechain input
  - 192 factory presets
  - Expandable architecture
  - Formats: AU, VST, AAX, RTAS
  - Platforms: Windows (XP SP2/Vista/7 x32/x64), macOS Intel 10.5+
