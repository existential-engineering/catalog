description: PSP N2O is a semi-modular multi-effect plug-in which offers unparalleled flexibility and total sound creation freedom. The high-quality sound processing modules can be routed in any configuration, allowing for endless musical journeys.
details: |-
  PSP N2O is a semi-modular multi-effect plug-in which offers unparalleled flexibility and total sound creation freedom. The high-quality sound processing modules can be routed in any configuration, allowing for endless musical journeys.

  While built upon the same basic concept as the much-loved PSP Nitro, PSP N2O brings new modules and extended modulation features, allowing users to explore completely new sonic territories. The plug-in engine has been rewritten and redesigned from scratch in order to improve the sound and take full advantage of the optimizations offered by modern CPUs.

  The enhanced user interface improves the experience of both sound designers creating their own soundscapes as well as everyday users who aren't as fond of looking under the hood.
specs: |-
  - Up to four sound processing operators at a time: morphing resonant and formant filters, eq, delay, reverb, pitch-shifting, compressor/expanders, bitcrushing, distortion, full-wave rectifiers and more
  - Up to four modulators at a time: LFO, envelope detector, and ADSR step sequencer
  - Eight assignable knobs with quick MIDI learn options for convenient access to the most essential preset parameters
  - Built-in limiter that uses algorithms from the well regarded PSP Xenon hi-definition mastering limiter
  - Three displays, simplified modulation setup, keyboard and mouse wheel support for easy preset creation and tweaking
  - Animated response plots
  - Sidechain input
  - Extensive optimization
  - 192 factory presets
  - Expandable architecture - new operators and modulator types to be added in future versions while preserving backward compatibility
  - Windows: x32 or x64 (XP Service Pack 2, Vista or 7)
  - Mac (Intel): Mac OSX 10.5 or later (Mac OSX 10.8 or later for AAX)
  - VST requires a VST 2.4 compatible host application
  - RTAS requires ProTools LE 8.0.0 or ProTools TDM 8.0.0 (or later)
  - AAX requires Pro Tools 10 or Pro Tools 11 (or later)
