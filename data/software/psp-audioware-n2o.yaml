details: |-
  Up to four sound processing operators (filters, EQ, delay, reverb, pitch-shifting, compressor, distortion). Up to four modulators (LFO, envelope detector, ADSR step sequencer). Eight assignable MIDI-learnable knobs. Built-in limiter based on PSP Xenon algorithms. 192 factory presets. Sidechain input support. Expandable architecture.
