details: >-
  Anacreon is a patch-cable driven synthesizer with the following features:
  lovingly programmed in straight c++ without using flowstone, synthedit, juce,
  etc.


  (qty 3) bandlimited, stereo, non-aliasing oscillators saw and pulse waveforms.
  Hard sync with subsample accuracy. Pwm on pulse waveform. Easy supersaw /
  superpulse up to 64 supervoices per oscillator per voice. Detune and spread
  knob for easy tuning. Phase smear control between supervoices. Extremely small
  minimum detune for analog emulation.


  (qty 4) 4 pole multimode filters lp, bp, and hp. 24db/octave and 12db/octave.
  All available simultaneously w/ independent gains. Built-in soft saturator w/
  drive control. Generally stable, survives weird feedback patching.


  (qty 2) aux envelopes + (qty 1) main envelope true exponential response
  achieved via iterated multiplication. Retrigger and legato modes. Soft and
  hard reset modes. Envelope times go to zero for clickiness when desired.


  (qty 2) free running / tempo sync lfos keytracking and velocity sensitive gain
  / frequency. Triangle, sinusoid, and pulse waveforms. "shape" parameter
  adjusts duty cycle of all lfo waveforms. Audio rate modulation available.
specs: |-
  - Patch-cable driven synthesizer
  - Vst3 plugin
  - Bandlimited stereo non-aliasing oscillators
  - Saw and pulse waveforms
  - Hard sync with subsample accuracy
  - Pwm on pulse waveform
  - Supersaw/superpulse up to 64 supervoices per oscillator per voice
  - Detune and spread knob
  - Phase smear control
  - 4 pole multimode filters
  - Lp, bp, and hp filter modes
  - 24db/octave and 12db/octave filter slopes
  - Built-in soft saturator with drive control
  - 2 aux envelopes plus 1 main envelope
  - True exponential envelope response
  - Retrigger and legato modes
  - Soft and hard reset modes
  - 2 free running/tempo sync lfos
  - Keytracking and velocity sensitive gain/frequency
  - Triangle, sinusoid, and pulse lfo waveforms
  - Shape parameter for lfo duty cycle
  - Audio rate modulation
  - 6 stereo attenuverters
  - Modulation source bank with velocity, keytrack, pitchbend, modwheel
  - Stereo limiter/clipping saturator
  - Per-voice processing
  - Independent glide parameters for keytracking elements
  - Continuous oscillator pitch knob
  - Sample-accurate modulation
  - Built-in preset browser for .vstpreset files
  - Vst3 only - no vst2.4 support
  - Programmed in c++ without flowstone, synthedit, or juce
