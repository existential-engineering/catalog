description: >-
  Professional vocal editing edition of Melodyne with full parameter inspectors
  for pitch, vibrato, formants, and dynamics control.
details: |-
  Melodyne 5 Assistant is designed for professional vocal editing,
  providing the complete toolkit for intonation, timing, vibrato,
  formants, transients, and dynamics adjustments.

  Parameter inspectors give precise numerical control over every
  aspect of each note. All standard Melodyne tools are available
  for detailed manipulation of monophonic audio material.

  Audio-to-MIDI conversion enables repurposing vocal or instrumental
  performances as MIDI data. Available as a plug-in via ARA, VST3,
  AU, and AAX, or as a standalone application.
specs: |-
  - Complete vocal editing toolkit
  - Parameter inspectors for precise control
  - Pitch, vibrato, formant, and dynamics tools
  - Transient and sibilant detection
  - Audio-to-MIDI conversion
  - ARA integration for supported DAWs
  - 64-bit only
  - Intel/AMD Dual Core minimum, Quad Core recommended
  - 4 GB RAM minimum, 8 GB recommended
  - macOS 10.12 or higher with Apple Silicon support
  - Windows 10 or higher
