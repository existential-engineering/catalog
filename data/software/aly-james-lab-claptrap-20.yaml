description: Stereo analog and digital Simmons ClapTrap extended emulation recreating the iconic 1980s clap machine with dual circuit models (Digital MK3 and Analog MK1/2) and humanizer functionality.
details: |-
  ClapTrap 2.0 is a stereo plugin that recreates the iconic 1980s Simmons
  ClapTrap clap machine. It emulates both the digital MK3 version and the newly
  added analog MK1/2 circuit models, offering authentic ensemble handclap
  generation with humanizer functionality for varied, natural-sounding results.

  The plugin features true stereo capability with internal dual operation and
  multi-output routing. A modeled SVF noise filter topology provides authentic
  sound shaping, while digital clap tone EPROM swapping allows tonal variation.
  Analog circuit parameter tweaking includes pulse shape and humanizer
  modulation controls.

  Additional features include trigger thump and filter noise bleed emulation for
  realism, trigger delay up to 100ms, and global circuit saturation control. The
  plugin supports VST3 MIDI 2.0 and provides automation support on most
  parameters.

  ClapTrap 2.0 runs on Windows 10+ (VST3) and macOS 10.14+ (VST3 and AU) with a
  Universal 2 binary providing native Apple Silicon support for M1/M2+
  processors.
specs: |-
  - Circuit MODELS: Digital MK3 or the freshly emulated Analog MK1/2 model
  - Multi Outputs routing capability
  - Single or Dual operation
  - Settings and preset browser pages
  - Modelled SVF Noise Filter topology
  - Option to switch from original hardware noise SVF filter to a custom fixed gain peak filter
  - Digital Clap Tone EPROM swapping
  - Analog Clap Ensemble circuit bending: Pulses shape, Humanizer mod amount, reversed key-tracking
  - Trigger thump and Filter noise bleed emulation
  - Option to delay incoming trigger (max 100ms) on one unit
  - True stereo capability by running 2 modelled ClapTrap internally or 4 in DUAL mode
  - Option to enable global circuit saturation (also reduces dynamic range)
  - Most parameters respond to automation
  - Improved VST3 MIDI support (MIDI 2.0, Ableton Live External Instrument rack inputs detection)
  - Windows: Windows 10 or higher, 64-bit VST3 compatible host
  - macOS: macOS 10.14 or higher (64-bit), VST3 or Audio-Unit compatible host, Universal 2 binary (native Intel and Apple Silicon)
