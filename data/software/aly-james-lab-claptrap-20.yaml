description: Stereo analog and digital Simmons ClapTrap extended emulation
  recreating the iconic 1980s clap machine with dual circuit models (Digital MK3
  and Analog MK1/2) and humanizer functionality.
details: |-
  ClapTrap 2.0 is a stereo plugin that recreates the iconic 1980s Simmons
  ClapTrap clap machine. It emulates both the digital MK3 version and the newly
  added analog MK1/2 circuit models, offering authentic ensemble handclap
  generation with humanizer functionality for varied, natural-sounding results.

  The plugin features true stereo capability with internal dual operation and
  multi-output routing. A modeled SVF noise filter topology provides authentic
  sound shaping, while digital clap tone EPROM swapping allows tonal variation.
  Analog circuit parameter tweaking includes pulse shape and humanizer
  modulation controls.

  Additional features include trigger thump and filter noise bleed emulation for
  realism, trigger delay up to 100ms, and global circuit saturation control. The
  plugin supports VST3 MIDI 2.0 and provides automation support on most
  parameters.

  ClapTrap 2.0 runs on Windows 10+ (VST3) and macOS 10.14+ (VST3 and AU) with a
  Universal 2 binary providing native Apple Silicon support for M1/M2+
  processors.
specs: |-
  - Dual circuit models (Digital MK3 and Analog MK1/2)
  - True stereo capability with internal dual operation
  - Multi-output routing
  - Modeled SVF noise filter topology
  - Digital clap tone EPROM swapping
  - Analog circuit parameter tweaking (pulse shape, humanizer modulation)
  - Trigger thump and filter noise bleed emulation
  - Trigger delay option (up to 100ms)
  - Global circuit saturation control
  - VST3 MIDI 2.0 support
  - Universal 2 binary (native Apple Silicon support)
