details: |-
  Abracompabra is an upwards and downwards compressor plugin from wire grind.

  Two anti-aliasing options dramatically suppress aliasing artifacts by oversampling at 8x and 16x standard audio frequency.

  Two ratio parameters extend below one to allow for expansion.

  Four channel configurations to calculate gain changes. Three channel configurations to which the gain changes can be made.
specs: |-
  - VST 3 plugin
  - Upwards and downwards compression
  - Expansion with ratio parameters extending below one
  - 12 channel configuration modes
  - Four channel configurations to calculate gain changes
  - Three channel configurations for gain changes application
  - Anti-aliasing with 8x oversampling
  - Anti-aliasing with 16x oversampling
  - Look-ahead
  - Integrated dynamic limiter
  - Strong trigger signal filtering
  - Trigger signal scope
  - Gain reduction/gain increase meters
  - Soft knee
  - Mono format support
  - Stereo format support
  - Surround sound format support
