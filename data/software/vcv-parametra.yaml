description: "Stereo parametric EQ with eight CV-controllable filters and a
  spectrum viewer. Features 17 types of biquad filters enabling audio-rate
  modulation for sound design and mixing."
details: |-
  8 configurable filters with CV control for frequency and gain. 17 filter types: Lowpass (12/24/48 dB/oct), Highpass (12/24/48 dB/oct), Lowshelf, Highshelf, Bandpass, Peak (variable Q), and Notch. Spectrum display showing amplitude analysis. Master output gain with soft-clipping protection. L/R VCA for CV-controllable amplification. Dark panel option. Version 2.0.4.
specs: |-
  Requires VCV Rack 2.
