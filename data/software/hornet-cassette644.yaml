description: HoRNet Cassette644 is a cassette emulator that captures the essence of vintage 4 tracks cassette recorders with this plugin
details: |-
  Step into the realm of vintage recording with HoRNet Cassette644. In the ever-evolving world of music production, there's something magical about the analog sound that vintage equipment provides. Many producers and musicians are drawn to the warmth, character, and organic feel of classic recording devices, especially tape recorders. This meticulously crafted cassette emulator plugin faithfully recreates the unmistakable sound and character of a legendary tape recorder, adding vintage warmth, saturation, and nostalgia to modern mixes.

  One of the standout features of Cassette644 is its three-band semi-parametric EQ, which is modeled after vintage tape recorders. The EQ allows you to dial in the perfect balance of highs, mids, and lows to achieve the desired tonal character for your track. Tape recorders from the past often had an inherent EQ curve which contributed to their signature sound, and here you get the ability to finely adjust the tonal character of your recordings rather than a one-size-fits-all emulation.

  The plugin emulates different types of cassette tapes, each with its own sonic characteristics: Type I (Normal), the standard tape type offering a more balanced sound with moderate warmth, Type II (Chrome), known for a cleaner, brighter sound with enhanced high frequencies, and Type IV (Metal), the most advanced tape type, offering a full range of dynamics and a powerful, punchy sound. Selecting the right one can help recreate the sound of a specific era or style of recording.

  Cassette644 brings the magic of analog tape recording with the convenience of a modern plugin. The interface is intuitive and easy to integrate into a digital audio workstation, and advanced controls include linked input and output plus high-quality oversampling for a pristine sound without unwanted artifacts. A "link" switch connects every instance of Cassette644 in a session, letting you recreate a virtual cassette multitrack setup just like the analog days of using multiple tape machines to record different parts of a song.

  HoRNet Cassette644 has no copy protection: the maker states they do not believe in copy protection because it is always cracked and annoying for users, so the plugin simply downloads and runs. A fully functional demo is available, except that it will periodically silence out, parameter values cannot be saved with the session, and the plugin will not respond to automation coming from the host.
specs: |-
  - Precise emulation of a renowned vintage tape recorder
  - Three-band semi-parametric EQ with adjustable gain and frequency controls
  - Enable or disable the EQ or Cassette module to shape your sound
  - Authentic hiss emulation for both the EQ and cassette modules that can be enabled or disabled
  - Three cassette types: Type I (Normal), Type II (Chrome), and Type IV (Metal)
  - Choose between slow or fast tape speeds for different sonic characteristics
  - Flexible routing options: EQ > Cassette or Cassette > EQ
  - Up to 4x oversampling with automatic settings for optimal quality
  - "Link" switch to synchronize multiple instances and maintain consistency
  - Input and output level controls for precise gain adjustment
  - Link of input and output gain to keep overall loudness level constant
  - VU meters for accurate monitoring of input and output levels
  - Seamlessly adapts to light and dark mode interface based on system settings
  - Vector user interface which is sharp on every resolution
  - Apple Silicon native support
  - macOS (10.13 and later) and Windows (Windows 10 and later) support
  - 64-bit on Mac and Windows
  - Audio Units, VST, VST3 and AAX format
