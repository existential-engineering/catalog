details: |-
  HoRNet Cassette644 1.0.3 is available, this update is free for owners of our cassette emulator plugin and includes: Fixed random crash on resize of the UI on Windows Fixed knobs not responding if mouse dragged outside plugin window Added resizable interface to AAX version Fixed plugin stealing spacebar on Windows Fixed random crash when adding the plugin on FL Studio and Cubase on Windows Fixed random crash on Windows when changing light/dark theme Fixed wrong behavior in resizing plugin window on Windows when zoom was set more than 100% Removed VST 2.4 support
