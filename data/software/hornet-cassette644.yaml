description: HoRNet Cassette644 is a cassette emulator that captures the essence of vintage 4 tracks cassette recorders with this plugin
details: |-
  In the ever-evolving world of music production, there’s something magical about the analog sound that vintage equipment provides. Many producers and musicians are drawn to the warmth, character, and organic feel of classic recording devices, especially tape recorders. With the advent of digital technology, the magic of those analog machines can sometimes feel lost. However, thanks to modern innovation, you can now recapture the essence of these vintage machines with the HoRNet Cassette644 plugin.

  This meticulously crafted cassette emulator plugin faithfully recreates the unmistakable sound and character of a legendary tape recorder. Whether you’re working on a modern mix or paying homage to classic music from the past, HoRNet Cassette644 will help you add that vintage warmth, saturation, and nostalgia that made these machines beloved classics.

  The beauty of this plugin lies in its ability to capture the essence of analog tape with precision. If you’ve ever worked with a real cassette deck, you know that there’s a specific magic in how the audio is processed. That richness, that organic warmth, is something that digital equipment often struggles to replicate. With HoRNet Cassette644, you can get a taste of that classic analog sound with all the precision and flexibility of a modern plugin.

  One of the standout features of HoRNet Cassette644 is its three-band semi-parametric EQ, which is modeled after vintage tape recorders. The EQ allows you to dial in the perfect balance of highs, mids, and lows to achieve the desired tonal character for your track. Whether you want to smooth out the high frequencies or boost the low end for added warmth, the EQ offers intuitive control over your sound, allowing you to replicate the feel of an analog tape machine with precision.
specs: |-
  - Precise emulation of a renowned vintage tape recorder
  - Three-band semi-parametric EQ with adjustable gain and frequency controls
  - Enable or disable the EQ or Cassette module to shape your sound
  - Authentic hiss emulation for both the EQ and cassette modules that can be enabled or disabled
  - Three cassette types: Type I (Normal), Type II (Chrome), and Type IV (Metal)
  - Choose between slow or fast tape speeds for different sonic characteristics
  - Flexible routing options: EQ > Cassette or Cassette > EQ
  - Up to 4x oversampling with automatic settings for optimal quality
  - “Link” switch to synchronize multiple instances and maintain consistency
  - Input and output level controls for precise gain adjustment
  - Link of input and output gain to keep overall loudness level constant
  - VU meters for accurate monitoring of input and output levels
  - Seamlessly adapts to light and dark mode interface based on system settings
  - Vector user interface which is sharp on every resolution
  - Apple Silicon native support
  - macOS (10.13 and later) and Windows (Windows 10 and later) support.
  - 64-bit on Mac and Windows.
  - Audio Units, VST3 and AAX format.
