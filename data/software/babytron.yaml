details: |-
  BabyTron is an analog and phase-distortion virtual synthesizer with step
  sequencer. It is the younger brother of supertron, with some important
  differences. It can be used to generate arpeggiated sounds, analog strings,
  bass, leads, pads and some acoustic emulations.

  This vsti has no chorus, no reverb no delay. That's the way to demonstrate how
  to make a variety of sounds without them. Just 1 oscillator, 1 envelope, 1
  filter. The user can add that plugin effects in the host software if wanted.

  The 1 envelope generator features independent modulation of: tone, amplitude,
  filter cut, pulse width, tuning of phase distortion, amount of phase
  distortion.

  The 1 step modulator includes 16 steps with 2 graphic screens and independent
  modulation of tone, amplitude, filter cut, pulse width, tuning of phase
  distortion, amount of phase distortion, with 3 modes of envelope trigger and 4
  scenes for each preset.

  The "auto hide" function makes transparent or invisible the knobs that have no
  result in some given situations. The "age" parameter provides vintage warmth
  and the "boost" parameter manages the dynamics to give loudness.
specs: |-
  - 1 oscillator

  - 1 envelope generator

  - 1 filter

  - 1 lfo

  - Step modulator with 16 steps

  - Phase-distortion synthesis

  - Analog synthesis

  - Step sequencer

  - 2 graphic screens

  - 3 modes of envelope trigger

  - 4 scenes per preset

  - Auto hide function

  - Age parameter for vintage warmth

  - Boost parameter for dynamics management

  - Independent modulation of tone, amplitude, filter cut, pulse width, tuning
  of phase distortion, amount of phase distortion

  - Wide filter control (panoramic frequency distribution)

  - Triangle wave lfo

  - Synchronization pulsator

  - VST plugin format

  - Windows compatible
