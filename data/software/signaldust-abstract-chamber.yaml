details: |-
  Abstract Chamber is a reverb plug-in with a simple, fast to setup interface.
  It is designed for longer modulated reverbs, while trying to maintain a
  natural yet abstract spatial impression.

  The damping and diffusion has received some significant changes in 1.5.2 to
  allow for somewhat more aggressive variation in the decay.

  Abstract chamber does a remarkable job of retaining your texture, and the
  specialized modulation evolves the sound over the course of 8+ second reverb
  tails in a natural, perfect way.

  The plugin functions as a VST plugin for windows.
specs: |-
  - Reverb effect
  - Modulated reverbs
  - Long reverb tails
  - Damping control
  - Diffusion control
  - Modulation
  - Windows compatible
