description: The Sound Master is modeled on a Fender Tone Master Custom Shop 100-watt hand made, point-to-point wired all-tube head. From clean tones to heavily overdriven distortion, the plugin has two separate channels with independent volume and tone controls.
details: |-
  The Sound Master is modeled on a Fender Tone Master Custom Shop 100-watt hand made and point-to-point wired all-tube head.

  From clean tones to heavily overdriven distortion, the Sound Master Custom Tube Guitar Amplifier plugin has two separate channels with independent volume and tone controls. Channel A is pure American tone with sparkling cleans, while Channel B has separate Gain and Master Volume knobs so the preamp can be driven for more aggressive sounds.

  The cabinet section offers a choice of six different guitar cabinets and four microphone emulations, each with an on/off axis position switch and continuous position and distance knobs. A complete mixer section with solos, mutes, pans and faders blends the two microphones together with the ambience.

  The impulse response loader takes up to three third-party impulse responses that can be blended together using volume, pan, phase, solo and mute controls. A browser window makes it straightforward to search through third-party IR files.

  A noise gate section plus a Cleaner circuit to reduce rumbling and harshness is included, and an iOS version for iPhone and iPad is available from the Apple App Store.
specs: |-
  - Modeled on a Fender Tone Master Custom Shop 100-watt point-to-point wired all-tube head
  - Two separate channels with independent volume and tone controls
  - Channel A: American clean voicing
  - Channel B: separate Gain and Master Volume knobs for driving the preamp
  - 6 guitar cabinet emulations
  - 4 microphone emulations with on/off axis position switch, continuous position and distance knobs
  - Mixer section with solos, mutes, pans and faders to blend two microphones with ambience
  - Impulse response loader for up to 3 third-party IRs with volume, pan, phase, solo and mute
  - IR browser window for searching third-party IR files
  - Noise gate section
  - Cleaner circuit to reduce rumbling and harshness
  - iOS version available for iPhone and iPad
  - Plugin formats: VST2, VST3, AAX or AudioUnits compatible host
  - Intel compatible or Apple Silicon CPU
  - 1GB RAM
  - Mac OS 10.13 or newer
  - Windows 7 or newer
  - 64-bit DAW required
