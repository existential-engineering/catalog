description: A plugin modeled on a Fender Tone Master Custom Shop 100-watt hand-made, point-to-point wired all-tube amplifier head, delivering tones ranging from sparkling American cleans to heavily overdriven distortion via two independent channels.
details:
  - "The Sound Master is a faithful plugin model of a Fender Tone Master Custom Shop 100-watt hand-made, point-to-point wired all-tube amplifier head. It features two independent channels: Channel A delivers pure American tone with sparkling cleans, while Channel B adds separate Gain and Master Volume controls for more aggressive, overdriven sounds."
  - The cabinet section offers six different guitar cabinet options paired with four microphone emulations. Each microphone supports on/off-axis positioning with adjustable distance and placement controls. A full mixer section with solos, mutes, pans, and faders allows blending of microphones and ambience to taste.
  - An integrated Impulse Response loader accepts up to three third-party IR files simultaneously, each with independent volume, pan, phase, solo, and mute controls. A built-in browser makes it easy to navigate and audition your IR library.
  - Additional processing includes a noise gate and cleaner circuit designed to reduce rumble and harshness. A collection of free impulse responses is included out of the box, and the plugin supports iOS via iPhone and iPad for mobile recording workflows.
  - Current version 1.0.12 runs on macOS 10.13 or newer (Intel and Apple Silicon), Windows 7 or newer, and iOS. It requires a 64-bit DAW and a minimum of 1 GB RAM.
