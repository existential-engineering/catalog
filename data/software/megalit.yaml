description: BLEASS Megalit packs the stunning depth, power and sound quality of
  modern plugin synthesizers into an instrument that's as satisfying to play.
details: |-
  BLEASS Megalit packs the stunning depth, power and sound quality of modern
  plugin synthesizers into an instrument that's as satisfying to play as it is
  easy to program. With its blend of wavetable and classic subtractive
  oscillators, flexible filtering and post-processing, and an extensive set of
  advanced modulation sources, BLEASS Megalit provides sound designers with a
  vast palette of timbral tints, shades and colours to explore.

  Advanced wavetable oscillators can adjust both wavetable position and fold,
  bringing near-infinite variety to each of the synth's 135 wavetables;
  per-oscillator unison mode allows you to create complex layering that would
  normally require you to load additional synths into your project; noise
  generator with dedicated high- and low-pass filtering for super-flexible
  non-tonal sounds and sound components.

  Resonant high-pass and low-pass filters that can be applied to individual
  oscillators or pairs of oscillators, as can the built-in waveshaper and
  bit-crusher processors; four lfos, each with its own timing curve and output
  smoothing, that allow for the creation of exceptionally complex not to mention
  original modulation patterns; advanced motion sequencer for the creation of
  complex repeating modulation patterns.

  Per-patch storage of performance controller response curves ensure a sound
  will always respond the way you expect it to; patch randomising feature always
  produces useable sounds; built-in multi-band upward/downward compressor
  provides exquisite control over a sound's dynamics and punchiness.

  All of megalit's parameters, settings and controls, no matter how advanced,
  are laid out at your fingertips, with intuitive visual feedback ensuring you
  always know exactly what the synth is doing. And, despite its huge sonic
  power, megalit is super-efficient on your system, leaving you with plenty of
  headroom for running additional instruments and effects.
