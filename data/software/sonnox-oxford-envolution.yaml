description: A frequency-dependent envelope shaper with transient and sustain
  sections. Envolution is a frequency-dependent envelope shaper with separate
  transient and sustain sections to radically re-shape the sonic envelope of
  your instruments or audio.
details: |-
  The Sonnox Oxford Envolution is an envelope shaper that adjusts the attack and sustain characteristics of a sound independently, with frequency-dependent control across the spectrum. It is used on drums, guitars, vocals and other material, and runs at low CPU load.

  Instead of traditional compression, Envolution lets you target specific frequency ranges and adjust their attack or sustain independently. This means you can add punch to transients, reduce reverb tails, or bring out subtle details without squashing the overall dynamic range. You can tighten snares, add body to toms, enhance the pick of a guitar, or control room ambience in overheads. On a mix bus, it can add presence, energy, or focus, making it a powerful tool for both corrective tasks and creative sound design.

  Envolution's Warmth feature adds harmonic richness and depth to both transient and sustained sections, bringing a subtle analogue character to the sound.
specs: |-
  - Transient Control Section: shape the attack of drum hits with frequency-dependent control, adding punch to kicks, snap to snares, or softening harsh transients
  - Attack, hold and release parameters for the transient section
  - Sustain Design Section: tighten room ambience, enhance the natural resonance of toms, or shorten the decay for a cleaner mix
  - Frequency-dependent shaping: control individual frequency ranges within the envelope independently
  - Warmth control adds harmonic saturation to both transient and sustained sections
  - Plugin formats: Audio Unit (AU), VST3, AAX-Native (Pro Tools 11 or later), AAX-DSP (Pro Tools Ultimate, Pro Tools HD, Avid VENUE)
  - AAX-DSP instances per chip, mono: 7 at 44.1/48 kHz, 3 at 88.2/96 kHz, 1 at 176.4/192 kHz
  - AAX-DSP instances per chip, stereo: 6 at 44.1/48 kHz, 2 at 88.2/96 kHz, 1 at 176.4/192 kHz
  - macOS 10.13 High Sierra or later
  - Windows 10 (64-bit) or later
  - Two simultaneous activations per licence, authorised with a free iLok account (Local Machine, iLok2/iLok3 USB device, or iLok Cloud)
  - Free trial available, 14-day money back guarantee, instant digital download
