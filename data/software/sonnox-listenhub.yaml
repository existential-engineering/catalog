description: Ensure your mix stands strong against your favourite productions using ListenHub for macOS. Use it to easily A/B against songs from any streaming source such as Spotify, Apple Music, YouTube or your own media player.
details: |-
  A/B reference your mix against professional tracks from Spotify, Apple Music, YouTube, or local files. Isolate specific frequency bands (low end, mids, highs) for targeted comparison. Built-in loudness matching for fair, consistent comparisons between your mix and references. Stereo width and dynamics monitoring to ensure mix translates across playback systems. iOS and Android remote control app included.
specs: |-
  Formats: AU, VST3, AAX (Pro Tools 11 or later). macOS 10.13 High Sierra or later (macOS only). iOS 9.3 or above (remote app). Android 9 or above (remote app). Two simultaneous activations via iLok.
