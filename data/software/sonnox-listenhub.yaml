description: ListenHub is a monitoring and referencing hub for macOS. It plays reference tracks from streaming services such as Spotify, Apple Music and YouTube or from local files without importing them into the DAW, matches loudness between mix and reference, and adds mono, stereo width, loudness and frequency band checks. A remote app for iOS and Android controls it over the local network.
details: |-
  ListenHub is a monitoring and referencing hub for macOS. Line up a commercial track, match loudness, switch between it and your mix instantly, and check mono, sides and balance without stringing together utility plug-ins. It is built to stop you fooling your ears mid-mix.

  References are taken from streaming platforms such as Spotify, Apple Music and YouTube, or from local files, without importing them into the DAW. Loudness is levelled between the mix and the reference so comparisons stay fair, and the built-in loudness and stereo width monitors show how the mix holds up across playback systems.

  The ListenHub remote app for iOS and Android lets you control essential monitoring and referencing functions directly from your phone or tablet. With wireless integration over your local network, you can adjust levels, switch sources and manage outputs from anywhere in your studio, whether you are at the desk, on the couch, or in another room, delivering the immediacy of a hardware monitor controller with the flexibility of software routing.

  Precision frequency band isolation lets you solo ranges such as low end, mids or highs and compare them directly with your reference tracks, so you can fine-tune the relationship between kick and bass or make sure your highs sparkle without harshness. ListenHub also compares your mix's loudness and dynamic range with reference tracks, helping you keep it engaging without losing dynamics.
specs: |-
  - Instantly A/B your mix against reference tracks streamed from Spotify, Apple Music, YouTube, or played from local files, without importing them into your DAW
  - Compare against streaming-normalised tracks
  - Match Input Loudness automatically levels your mix and the reference track to the same volume to remove loudness bias
  - Precision frequency band isolation: solo low end, mids or highs and compare directly with the reference
  - Loudness and dynamic range comparison between your mix and reference tracks
  - Stereo width monitoring, including mono, sides and balance checks
  - Free ListenHub remote app for iOS and Android turns a phone or tablet into a wireless monitor controller over the local network (adjust levels, switch sources, manage outputs)
  - Plugin formats: Audio Unit (AU), VST3, AAX-Native (Pro Tools 11 or later)
  - macOS 10.13 High Sierra or later; ListenHub is not available for Windows
  - Mobile remote app requires iOS 9.3 or above, iPadOS 13 or above, or Android 9 (Pie) or above
  - Each Sonnox plugin licence includes two simultaneous activations
  - Authorisation via a free iLok account: Local Machine, iLok2/iLok3 USB device, or iLok Cloud (iLok Cloud requires an active internet connection and only one activation may be assigned to it)
  - Free trial available
