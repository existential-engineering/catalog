description: PSP MixPack2 is a collection of six high-resolution, high quality audio processors designed to improve the quality of digital audio tracks and mixes.
details: |-
  PSP MixPack2 is a collection of six high-resolution, high quality audio processors designed to improve the quality of digital audio tracks and mixes.

  These processors were not modeled on specific hardware analog processors, but rather on the sound and features of many analog circuits, with the goal of designing processors that help tame the sterility and harshness that often plagues digitally recorded audio.

  Despite the name, the pack is not limited to mixing: these plug-ins are high enough quality to be at home in mastering or live tracking situations as well.

  All plug-ins utilize 64-bit double precision floating point algorithms throughout their entire signal path and support sample rates of up to 192kHz.

  PSP MixPack2 includes six plug-ins. PSP MixBass2 is a powerful bass harmonic enhancement and control tool for adding and controlling low end in sounds or mixes. PSP MixTreble2 is a high-end processing tool designed to shape the top end of a mix and of individual sounds. PSP MixPressor2 is a flexible and precise dynamics processor for adding subtle glue or extreme compression. PSP MixSaturator2 is a versatile saturation tool with multiple modes ranging from subtle analog "heat" to tape saturation to full audio destruction. PSP MixGate2 is a precise gate tool for taming signals in the mix. PSP MixSync2 is a high-quality time alignment tool useful for post production applications or for aligning multi-track signals in a session.
specs: |-
  - Collection of six audio processors: PSP MixBass2, PSP MixTreble2, PSP MixPressor2, PSP MixSaturator2, PSP MixGate2 and PSP MixSync2
  - 64-bit double precision floating point algorithms throughout the entire signal path
  - Supports sample rates of up to 192kHz
  - PSP MixBass2: low-frequency compression algorithm and low frequency harmonics generator, low-pass filter for the control signal and a low cut filter in the signal path
  - PSP MixBass2: Punch section with a dynamically controlled filter to emphasize or attenuate a chosen mid-range frequency according to the low-frequency material
  - PSP MixTreble2: four processors, hiss remover, stereo enhancer, transient enhancer and harmonics generator
  - PSP MixTreble2: switchable soft-clipping algorithm which prevents the output level from exceeding 0dBFS
  - PSP MixPressor2: emulates classic valve and opto-electronic compressor circuits as well as modern compression solutions
  - PSP MixPressor2: wide range of soft knee characteristics
  - PSP MixPressor2: either peak or RMS level detection
  - PSP MixPressor2: external or internal side chain signal with a smooth bell-type filter, usable as a de-esser
  - PSP MixPressor2: output algorithm operating as either a brick wall limiter or soft saturation algorithm to preserve peaks above 0dBFS
  - PSP MixSaturator2: bass frequency processing algorithm adding low frequency harmonics and the analog tape low frequency bump
  - PSP MixSaturator2: treble frequency processing algorithm simulating tape saturation and high frequency loss at high levels
  - PSP MixSaturator2: overall saturation algorithm with seven distinct non-linearity curves covering valve devices, analog tape machines and digital clipping
  - PSP MixGate2: fully configurable high precision noise gate with high and low pass filters on the control signal
  - PSP MixSync2: time alignment for multi microphone recording, manual plug-in latency compensation and phase related fixes
  - Version 2.1.0 is available in the non-iLok version only
