description: MIDI generation plugin that builds melodies, phrases, riffs, chord progressions and drum parts from configurable rules. Offers six tracks, eight scenes per preset and an onboard piano roll editor with MIDI export.
details: |-
  InstaComposer 2 is a MIDI generation plugin that builds melodies, phrases, riffs, chord progressions and drum parts. It is aimed at getting ideas down quickly rather than auditioning parts by hand, and it covers a range of genres and styles.

  The second version adds eight scenes for storing variations and song parts inside a single preset, along with 22 additional scales covering Spanish, Arabic, Ryukyu and others. A virtual keyboard highlights the notes of the selected scale, and the chord menus highlight the chords that belong to it.

  Two generation modes are new. Drums produces drum lines across a range of styles, time signatures and complexity levels, with sub modes for auto, default, half time, double time, double time with a leading snare and dance. Pad 2 combines pad and chord behaviour, focusing on chords in the lower register while allowing more movement higher up.

  Generation is driven by crafted algorithms and databases rather than random note selection, choosing notes that fit the given scale and context and building phrases that follow the underlying chords. Adjustable controls cover chord complexity, note population, beat and bar structuring, pattern generation, harmonization, velocity randomization and a chaos amount governing how far the output strays from the rules. Sustain sets generated note length, including as a post processing step, and Chord Helper highlights the notes of the selected chord on a virtual keyboard.

  An onboard piano roll editor allows notes to be moved, copied, deleted and re-velocified before the MIDI leaves the plugin. Output can be saved as a MIDI file, dragged into a DAW, or routed to multi channel instruments so all six tracks can be previewed at once. The plugin ships with a large factory preset library, uses slightly less CPU than the first version and can load presets from it.
specs: |-
  - Intelligent MIDI generation plugin
  - Creates melodies, phrases, riffs and chord progressions
  - Six tracks generated simultaneously
  - Eight scenes per preset for variations and song parts
  - 22 additional scales, including Spanish, Arabic, Ryukyu, Hirajoshi and Locrian
  - Drums and Pad 2 generation modes
  - Sustain and Chord Helper parameters
  - Multi track and multi channel MIDI routing
  - Automatic harmony and chord progression generation
  - Piano roll MIDI editing with velocity control
  - MIDI drag and drop export, per track or combined
  - Multiple time signatures
  - Controls for probability, complexity and variation
  - MIDI channel lock when loading new presets
  - Factory presets, with legacy loading of first version presets
  - Full PDF manual and tutorial video
  - Windows 10 or 11 or higher, 64 bit
  - macOS 10.15 or higher, 64 bit
