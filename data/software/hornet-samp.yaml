description: Shape the Sound of Your Dolby Atmos Mixes with SAMP Audio Plugin. A Single Control Point for Mastering Your Mixes.
details: |-
  HoRNet SAMP is a plugin created to solve a unique problem in Dolby Atmos mixing: the lack of a traditional master bus. Developed by the Italian engineer Antonio Porcelli, SAMP offers a solution by providing a virtual master bus that integrates smoothly into the workflow of Atmos mixing.

  SAMP combines four master bus processors into a single plugin. The equalizer is based on HoRNet's TotalEQ and offers up to six bands of parametric EQ, the compressor uses HoRNet's SyncPressor technology for dynamic range control, and the clipper and limiter are taken from Magnus MK2 to manage peak levels and prevent unwanted clipping. All of these processors are interconnected, so adjustments made to one instance are reflected across the others, allowing changes to be made globally across multiple tracks at once.

  The order of the processors within the plugin can be fully customized, allowing users to rearrange them to match their preferred signal flow. The plugin also supports sidechain inputs, which enables dynamic interaction between multiple instances of SAMP for cohesive and controlled mixes in complex Dolby Atmos productions.

  SAMP supports up to 160 individual instances, each with its own peak meter, and the interface displays all active instances for an overview of the entire session. It reads track names directly from the DAW, and track names can be displayed when hovering over a level indicator, which helps avoid confusion in large projects. Attack and release times of the compressor and limiter modules can be synced to the DAW tempo.

  To maintain audio quality, SAMP employs intelligent oversampling up to 4x, reducing aliasing artifacts. The resizable, vector-based GUI is hardware-accelerated and includes native Apple Silicon support. The plugin works on macOS (10.11 and later) and Windows (7 and later, OpenGL 2.1 required), is 64-bit only, and is available in Audio Units, VST, VST3 and AAX formats.
specs: |-
  - Equalizer based on TotalEQ with up to 6 different bands
  - Compressor based on SyncPressor
  - Clipper and Limiter based on Magnus MK2
  - Input and output gain slider
  - Attack and release times can be synced to DAW tempo
  - Module order freely selectable
  - Interprocess communication between plugins
  - Up to 160 different plugin instances supported
  - Track name read directly from DAW (except for VST)
  - Input meter display for each instance
  - Compressor and limiter side chain selectable
  - Bypass button for each module and global bypass button
  - Online help
  - Intelligent oversampling up to 4x
  - Resizable vector GUI
  - Hardware accelerated GUI
  - Apple Silicon native support
  - macOS (10.11 and later) and Windows (7 and later, OpenGL 2.1 required) support
  - 64-bit only plugins for macOS and Windows
  - Audio Units, VST, VST3 and AAX format
