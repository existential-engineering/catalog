details: |-
  HoRNet SAMP: The Virtual Master Bus for Dolby Atmos Mixing HoRNet SAMP is an innovative plugin created to solve a unique problem in Dolby Atmos mixing : the lack of a traditional master bus. Developed by the Italian engineer Antonio Porcelli , SAMP offers a solution by providing a virtual master bus that integrates smoothly into the workflow of Atmos mixing . Unified Processing Chain SAMP combines four crucial master bus processors into a single plugin. These processors work together to provide a seamless mixing experience, allowing for a professional-level Atmos mix. The included processors are: Equalizer : Based on HoRNet’s TotalEQ , the equalizer offers up to six bands of parametric EQ , enabling precise tonal shaping. Compressor : Utilizing HoRNet’s innovative SyncPressor technology, the compressor provides effective dynamic range control , ensuring that the mix maintains clarity without unwanted fluctuations in volume. Clipper and Limiter : Taken from the renowned Magnus MK2 , the
