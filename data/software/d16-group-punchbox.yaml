description: Bass Drum Synthesizer
details: |-
  PunchBox 2 is the next evolution of PunchBox, a full-scale bass drum design engine fusing legendary kick emulations, sampling, and wavetable power into one modern sound-design engine. It was developed in collaboration with D16 Group, Sounds of Revolution, and CFA-Sound, packed with new features and improved performance over the original.

  At its core, four independent sound generators combine layered samples with advanced synthesis models, giving total control over every transient, tone, and tail, from classic analog-inspired engines to modern wavetable shaping. Three flexible sample layers further shape and enhance the character of a kick, and an Advanced Editor built into the workflow lets users see every layer and shape every movement.

  An enormous factory library, including a premium collection of professionally crafted presets and drum sounds from Sounds of Revolution and CFA-Sound, puts a massive range of sounds, presets, and wavetables at a producer's fingertips. A flexible built-in FX rack and Patchbay-powered signal flow let users shape, route, and finish every kick their own way.
specs: |-
  - Four independent sound generators combining sampling and wavetable synthesis
  - Three flexible sample layers per kick
  - Advanced Editor for per-layer, per-transient shaping
  - Built-in FX rack with Patchbay-powered signal routing
  - Premium factory library co-developed with Sounds of Revolution and CFA-Sound
