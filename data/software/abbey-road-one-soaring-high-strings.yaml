details: >-
  Enter the room most composers can only dream of: abbey road's studio one.
  Considered one of the finest acoustical spaces in the world, studio one's
  history has an indelible connection with the scores recorded there, providing
  emotion, mood, and magic for many of the most renowned and successful films
  ever made.


  Offering a harmonious and rich sound, soaring high strings is tailored for
  romantic, lyrical passages without sacrificing high speed runs. 16 1st violins
  and 14 2nd violins play in unison to create a passionate and lush sonic
  tapestry perfect for crafting a resonant composition.


  Add the unmistakable magic of abbey road studio one to your music with 12
  signals, expertly recorded by grammy award winning engineer simon rhodes.
  Featuring an expressive, slurring legato ideal for adding emotion to your
  tracks soaring high strings completes the abbey road one film scoring
  selections.


  Available to purchase as a stand-alone sample library or as a brilliant
  addition to the abbey road one: orchestral foundations VST.


  Articulations include legato with multiple dynamic, molto vibrato, slurred
  notes and alt fast attacks for runs; long with multiple dynamics; and short
  with 5 round robins and multiple dynamics. Microphone options include mix 1
  (full room mix by simon rhodes), mix 2 (tighter full mix), vintage 1 (1940s
  rm1b ribbon microphones), vintage 2 (classic 44bx ribbon microphones), close
  (strings) spot mics, pop close, pop room, tree 1 and tree 2 decca trees,
  outriggers 1, ambients, and spill.
