details: |-
  The kelly industries Auto Surround Panner is a specialized auto panner directx
  plug-in. This plug-in allows you to automatically pan from left to right
  and/or front to surround.

  The surround encoder does not do all the necessary processing for high end
  surround encoding, but should be more than adequate for use as an effect. This
  plug-in really shines on guitars with delays or on any backing instrument or
  vocals.

  Because of the nature of lcrs matrix surround anything sent to exclusively to
  the surrounds will be 180 degrees out of phase. This means if you are using a
  satellite/sub woofer for monitoring you will hear the low end (150hz and
  below) drop out when the sound is coming from the surrounds only.

  You can use the center control which will move the center panning point more
  towards the front speakers. You can also keep the width to 0.75 or below. That
  way the low end won't disappear completely.

  There are controls for speed-frequency, hold time, center, width, and surround
  volume. There are also two panning curves which are sin and triangle,
  selectable starting positions as well as speed multipliers.
