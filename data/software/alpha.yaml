details: |-
  BLEASS Alpha synthesizer is a virtual analog polyphonic stereo synthesizer
  inspired by classic analog synths and enhanced by the BLEASS' very own musical
  and technical approach.

  The alpha is a highly versatile synthesizer that aims at bringing new ways of
  designing and playing an infinite constellation of sounds while sparkling
  creativity.

  Simple & intuitive interface: follow the direction of the audio signal: design
  your own synth sounds by tweaking each panel, from left to right.

  Visualise your sound: thanks to its user-friendly visual filters, sliders,
  lfos and envelopes, quickly understand how to design your own presets.

  A unique motion sequencer inspired by modular synthesizers brings a new
  dimension to your pads, leads and sequences by offering a large amount of
  rhythmic and expressive modulation possibilities, which can be coupled with
  the arpeggiator.
specs: |-
  - Virtual analog polyphonic stereo synthesizer
  - Stereo oscillators
  - 5 built-in effects
  - Motion sequencer
  - Arpeggiator
  - MPE compatibility
  - Low CPU usage
  - 200+ factory presets and templates
