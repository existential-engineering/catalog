description: Davids2Bus captures David Gnozzi's analog 2bus chain as a
  combination of tape saturation, transformers and stereo effects in one
  plug-in. It is designed as the first processor on a mix bus, with input and
  output controls for setting how hard it is hit.
details: |-
  David's 2bus takes inspiration from David Gnozzi's 2bus processing. Over the years he developed a chain of analog pieces that worked best in a specific combination and with specific settings, and the plug-in was built by capturing that chain behind a small set of key controls. The processor was ear-tuned by the Metric Halo and Make Believe team and by Gnozzi himself, and combines tape saturation, transformers and several stereo effects in one plug-in.

  Designed primarily as a 2bus processor, it is meant to be used as the first instance on a mix bus, where hitting it at the right level is key. The two green LEDs in the metering mark that target level.

  Operation is simple. The input and output knobs set the level and with it the amount of tape saturation, bump and transient control. Transformer enhancement is dialed in with the Texture knob and its two flavors, A and B, and the signal is finished off with a little stereo manipulation before a compressor further down the chain.

  While originally conceived as a master-bus processor, the plug-in is also used on single tracks and groups, from vocals to guitars, with more aggressive settings and extreme stereo effects, so it serves as a creative mixing tool as well as subtle processing for a whole mix.
specs: |-
  - Detailed model of David Gnozzi's analog 2Bus chain with tape, transformer and space modeling
  - Add weight and definition
  - Control dynamics with analog saturation
  - Adjust and enhance the spatial aspects of a mix
