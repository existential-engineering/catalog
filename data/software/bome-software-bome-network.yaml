description: Bome Network is a versatile solution for creating reliable and
  low-latency MIDI connections over Ethernet or Wi-Fi. Available for macOS,
  Windows, Linux, Raspberry Pi, and iOS, it makes it easy to connect computers,
  mobile devices, and MIDI hardware across your network.
details: |-
  Bome Network is Bome Software's network-MIDI application, a standalone utility for carrying MIDI over Ethernet or Wi-Fi with low latency. The page positions it as a way to connect computers, mobile devices and MIDI hardware across a local network, and states that all Bome Network connections are persistent and reconnect automatically after a restart.

  An integrated MIDI Router sits at the centre of the application and gives complete control over how MIDI data is routed between devices. Version 1.7.0 adds management of MIDI ports and port aliases, the ability to expose individual MIDI ports on the network as Direct MIDI ports, and export/import of settings.

  The standard application's headline use case is pairing a computer with one or more BomeBoxes over Ethernet or Wi-Fi. Any MIDI application on the computer can send MIDI to a BomeBox and receive MIDI back, and Remote Direct MIDI forwards selected MIDI devices attached to the BomeBox (or all of them) over the network. Clicking the world icon opens the BomeBox web configuration interface for the selected device.

  Three paid add-ons extend the free application rather than replacing it. Bome Network Pro unlocks computer-to-computer network MIDI (Macs, PCs, iPhones and iPads) with automatic discovery and Remote Direct MIDI to remote virtual ports and physical devices. Bome MIDI Translator BN runs Bome MIDI Translator Pro project files inside Bome Network, including on Linux, Raspberry Pi, iPhone and iPad, though creating and editing projects still requires MIDI Translator Pro. Unlimited Named MIDI Ports allows arbitrary custom virtual MIDI ports usable in the Bome Network MIDI Router and in any other MIDI application.

  Builds are published for Windows 10 and 11 (64-bit), macOS 10.13 through 26, iOS and iPadOS 15 through 26 via the App Store, Linux 64-bit, and Raspberry Pi in 32-bit and 64-bit variants. Bome notes that the Windows virtual MIDI ports are not yet compatible with Windows on Arm, and that older machines are served by the download archive.
specs: |-
  - Network MIDI over Ethernet or Wi-Fi, described as reliable and low-latency
  - Integrated MIDI Router for routing MIDI data between local and network devices
  - Persistent connections that automatically reconnect after a restart
  - Remote Direct MIDI: forward selected or all MIDI devices attached to a BomeBox over the network
  - Opens the BomeBox web configuration interface for the selected device from the world icon
  - Network MIDI 2.0 protocol support (using MIDI 1.0), added in 1.7.0
  - Individual MIDI ports can be exposed on the network as Direct MIDI ports (1.7.0)
  - MIDI port and port alias management, plus export/import of settings (1.7.0)
  - In-app alerts and error messages instead of pop-up dialogs, configurable window scaling (text size/zoom), adjustable log text size (1.7.0)
  - Windows build is a native 64-bit application as of 1.7.0
  - Runs as a tray/menu-bar application: B icon in the macOS top menu bar, green B icon in the Windows tray
  - Works over Windows Remote Desktop (MSTSC/RDP) when remote audio is set to Play on Remote Computer
  - Windows virtual MIDI ports are not yet compatible with Windows on Arm
  - System requirements 1.7.0: Windows 10/11 (64-bit), macOS 10.13 - 26, iOS + iPadOS 15 - 26, Linux 64-bit, Raspberry Pi 32-bit and 64-bit
  - Optional add-on Bome Network Pro: computer-to-computer network MIDI between Macs, PCs, iPhones and iPads with automatic discovery
  - Optional add-on Bome MIDI Translator BN: runs MIDI Translator Pro project files inside Bome Network on macOS, Windows, Linux, Raspberry Pi, iPhone and iPad
  - Optional add-on Unlimited Named MIDI Ports: unlimited custom virtual MIDI ports, usable in the MIDI Router and other MIDI applications, and exposable on the network
versions:
  - name: 1.7.0
    releaseDate: 2026-08-01
    description: "New Add-On: MIDI Translator BN. New protocol: Network MIDI 2.0
      (using MIDI 1.0). Expose individual MIDI ports on the network as Direct
      MIDI ports. Improved user interface: new toolbar, in-app alerts and error
      messages instead of pop-up dialogs, configurable window scaling,
      changeable log text size. Manage MIDI ports and port aliases.
      Export/import settings. Windows: now native 64-bit application. Stability
      improvements."
    url: https://www.bome.com/downloads#bomenet
  - name: 1.6.0
    releaseDate: 2023-09-25
    description: Log messages and errors shown in a log section in the main window.
      Integrated MIDI i/o logging. Now available for Raspberry Pi 32-bit and
      64-bit. Option to disable automatic discovery in network settings. More
      robust MIDI route setup and optimized MIDI routing performance. Improved
      recovery on unstable network conditions.
  - name: 1.5.0
    releaseDate: 2022-10-19
    description: Disable device notifications for a specific network device.
      Improved dark mode compatibility. Improved status display when waiting for
      an incoming connection. Sorted MIDI routes and virtual MIDI ports. Bug
      fixes for blocked MIDI IN on Windows and crashes when unplugging devices
      with many MIDI ports.
  - name: 1.4.2
    releaseDate: 2022-01-23
    description: Exclude selected networks from auto-discovery. Windows and macOS
      released 2022-01-23; iOS + iPadOS released 2021-11-04.
  - name: "1.4"
    releaseDate: 2021-05-31
    description: Program window with list of remote MIDI hosts. Remote Direct MIDI
      ports. MIDI Router. Unlimited Named MIDI Ports as a purchasable add-on.
      More robust network MIDI connection re-establishment on restart. Dark mode
      support. Configurable prefix/suffix for virtual port names. Mac universal
      binary running native on Intel and Apple Silicon. Initial iOS/iPadOS
      release (2021-10-20).
