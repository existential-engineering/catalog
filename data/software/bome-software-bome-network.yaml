details: |-
  Bome Network is a versatile solution for creating reliable and low-latency MIDI connections over Ethernet or Wi-Fi. Available for macOS, Windows, Linux, Raspberry Pi, and iOS, it makes it easy to connect computers, mobile devices, and MIDI hardware across your network.

  Its integrated MIDI Router gives you complete control over how MIDI data is routed between devices. All Bome Network connections are persistent, automatically reconnecting after a restart.

  Bome Network makes it easy to connect your computer to one or more BomeBoxes over Ethernet or Wi-Fi. Any MIDI application on your computer can send MIDI data to a BomeBox and receive MIDI from it. You can also access MIDI devices connected to the BomeBox directly using Remote Direct MIDI, forwarding selected devices, or all of them, over the network. For even greater convenience, clicking the world icon opens the BomeBox web configuration interface for the selected device.

  Add-ons extend the base application. Bome MIDI Translator BN runs Bome MIDI Translator Pro project files directly in Bome Network, integrating translations and mappings with both local and network MIDI ports and devices; creating and editing translation projects still requires Bome MIDI Translator Pro. The Unlimited Named MIDI Ports add-on lets you create as many custom virtual MIDI ports as you need, available in both the Bome Network MIDI Router and any other MIDI application on your computer, and exposable on the network as Direct MIDI ports.

  Compatibility: Bome Network runs on all Apple computers running one of the specified versions of macOS, and on all PCs running one of the specified 64-bit versions of Windows. The virtual MIDI ports are not compatible with Windows on Arm (yet). For older computers, Bome provides a download archive with previous versions.
specs: |-
  - Low-latency MIDI over Ethernet or Wi-Fi
  - Network MIDI 2.0 protocol (using MIDI 1.0)
  - Integrated MIDI Router for routing MIDI data between devices
  - Persistent connections that automatically reconnect after a restart
  - Remote Direct MIDI: access MIDI devices connected to a BomeBox over the network
  - Expose individual MIDI ports on the network as Direct MIDI ports
  - Manage MIDI ports and port aliases
  - Export/import settings
  - Configurable window scaling (text size/zoom)
  - Windows 10, 11 (native 64-bit application)
  - macOS 10.13 - 26
  - iOS + iPadOS 15 - 26
  - Raspberry Pi 32-bit and 64-bit
  - Virtual MIDI ports are not compatible with Windows on Arm
