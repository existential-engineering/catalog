  - name: 1.6.0
    releaseDate: 2023-09-25
    description: Log messages and errors shown in a log section in the main window.
      Integrated MIDI i/o logging. Now available for Raspberry Pi 32-bit and
      64-bit. Option to disable automatic discovery in network settings. More
      robust MIDI route setup and optimized MIDI routing performance. Improved
      recovery on unstable network conditions.
