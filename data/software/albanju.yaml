details: >-
  The albanju - middle eastern banjo VST will help you get the ethnic feel
  you're looking for. Albanju is a sampled banjo instrument containing 2
  different middle eastern banjos. Each banjo was recorded twice, once with a
  guitar pick & once with just a finger. This gives us 4 totally different
  tones.


  We then blend the 4 banjo tones together to bring you some unique banjo
  combinations. With albanju's light & easy-to-use interface, you will have no
  problems finding a preset or creating your own sounds altogether.


  With streamlining your productions in mind, we kept everything, well, simple!
  Minimal fx allows you to use the fx you're already familiar with, quickly have
  full control over each banjo & easily browse presets.


  The interface has 3 main sections: top: fx in-depth adjustments + preset
  browser. Here you will find all of your fx parameters + your preset browser.
  Easily browse, adjust & tweak your sounds in this section. Middle: sampler
  adjustments. This section contains the sampler engines for your banjo
  instruments. Quickly edit your samples to create the sound you're looking for.
  Bottom: fx quick adjustments. Linked to the fx with the same name in top
  section, these are an even faster way to add fx & get an idea of your sound.


  Albanju is a lightweight that hits like a heavyweight! What we're trying to
  say is it uses minimal cpu but still packs a big punch. With a quick, easy &
  painless install (thanks to our easy to follow install guide), you will be
  creating something fresh in no time!
