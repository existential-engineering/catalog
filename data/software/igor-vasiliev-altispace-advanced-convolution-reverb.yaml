details: |-
  Altispace is a convolution reverb app with advanced controls that provides
  realistic sounding natural acoustic space or the most famous reverb devices
  for any track or mix. A convolution reverb takes a captured sample (called an
  impulse response) from a real-world space or hardware and uses this to
  digitally simulate the reverberation of that space or device down to the last
  detail and nuance.

  Because it is sampled, not synthesized, convolution reverb is known for its
  stunning realism, and it is widely considered to be the best type of reverb.
  However, unlike the more common algorithmic reverbs, convolution reverbs
  usually does not have much control over the reverberation process. But
  altispace, in addition to the ability to load your own impulse response files
  and a built-in library of real reverb device presets, has advanced settings
  such as eq, gate, ducking, modulation and more.

  This app has an easy-to-use user interface, where all the main controls are
  located on the single screen, and it is ready to use right out of the box,
  even without additional settings. And at the same time, you can easily change
  the parameters of the impulse responses from the built-in library to create
  your own sound.

  Altispace is a universal application for ios and macos. It can work on iphone
  and ipad as well as mac / macbook with m1 chip (and later). Altispace works on
  iphone and ipad standalone, as an audio unit or inter-app audio module, and
  supports audiobus and ableton link.

  On macos, altispace can works both as a standalone application and as an audio
  unit (auv3) with daws and audio unit hosts like ableton live, logic pro,
  garageband, mainstage, cockos reaper, plogue bidule, hosting AU, and other
  hosts that support auv3 plugins.
