details: |-
  Classic rotary swirl meets rich tube warmth with effortless speed control. Modeled after the Hughes & Kettner Rotosphere 2 in detail by Nembrini Audio, this plugin captures the lush movement, musical saturation, and unmistakable character of the original Hughes & Kettner hardware, ready for your DAW.

  Built for guitar, organ, and keyboards including synthesizers and e-pianos such as the legendary Rhodes, the Rotosphere Plugin delivers the sound and dynamics of the real rotary pedal in a compact, easy-to-use processor.

  Independent low- (LF drum) and high-frequency (HF horn) rotor sections let you move from slow, syrupy churn to fast, vocal-like spin, with speeds set in Hz or tempo-synced to your session. Hit Breaker to stop rotor motion while keeping the glowing tube color for dramatic holds and ambient swells. Choose Guitar or Keyboard input voicings for instant, instrument-correct response, then open up a true stereo image that sits beautifully in a mix.

  A classic rotary cab pairs a fast upper horn with a slower bass rotor, spinning in opposite directions. That complex motion creates Doppler shift, phase modulation, room reflections, and alternating frequency damping, the signature Leslie-style sound. Add a tube amp stage, and you get the coveted Hammond drive and compression, soft, musical distortion that blooms with dynamics.

  The Tube Rotosphere honors that recipe with advanced tube-saturation modeling and a Breaker for power-down stops, so Rhodes parts, organ lines, synth pads, and guitar tones all take on that legendary motion.
specs: |-
  - Speed control: independent LF/HF rotor speeds for precise low/upper horn movement, with rotor rates lockable to DAW tempo for instant sync
  - Instrument voicings: dedicated Guitar and Keyboard modes tailored for optimal tone shaping
  - Full stereo path: true stereo processing for a wide, immersive rotary image
  - Real-time visuals: simple, intuitive interface with responsive metering and motion feedback
  - Broad format support: works in all major DAWs and plugin formats for seamless integration
  - System: Intel compatible, Apple Silicon CPU
  - System: 1GB RAM
  - System: Mac OS 10.13 or newer
  - System: Windows 7 or newer
  - System: 64-bit DAW
  - System: VST2, VST3, AAX or Audio Units compatible host
