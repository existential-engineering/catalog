details: >-
  The acm530x1 algorithmically emulates a mechanical plate reverb, still
  regarded as a mainstay of many recording studios, for a diverse range of
  effects including drum enhancement or vocal ambience - while complementing
  more complex or resource intensive convolution models.


  Economical with system resources, the acm530x1 is ideal for classic reverb
  effects while still leaving sufficient processing available for the most
  complex audio workstation projects.


  Sub-sample resolution pre-delay, variable decay time and damping, coupled with
  virtual reverb plate transducer amplifiers for enhanced harmonic drive at high
  levels, and a wet-only switch for use on a dedicated reverb buss, enable a
  wide variety of configuration options.


  Smooth controls with no 'zipper noise' when adjusting the plug-in settings.
  Adjustable pre-delay with sub-sample accuracy. Variable decay time and hf
  damping. 'wet only' mode for use on a dedicated reverb buss. Physically
  modelled rotary control modes. Resizable, modern stylized user interface. Low
  cpu demand.
