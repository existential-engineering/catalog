details: |-
  AUXTURE is a unique exploratory sampler and sequencer (aux-seq) which enables
  the user to manipulate and record single samples or entire folders of samples
  through gesture, randomness and modulation. Unexpected results are achieved
  via the audio exploration of single samples or entire folders through
  gestures, randomness and modulation.

  The software comes bundled with a 'slices' folder containing 115 free to use
  samples. Auxture processes your loaded samples across a myriad of random
  parameters. The results open up a unique portrayal of your sound.

  When auxture receives a note, it applies an exploratory set of processes
  resulting in unique outputs based on unexpected outcomes or happy accidents
  applied to your sample set. It chooses a random sample from its memory
  according to a freely settable probability. It then plays it back with a rate
  proportional to the pitch.

  Some parameters related to sample playback are directly settable, such as loop
  mode, pitch shift and detunes, while others are based on chance, such as
  choosing another sample or reverse playback. A random delay of a few
  milliseconds allows a rapid and unpredictable timbre variation, while
  frequency and ring modulations alter the sample more heavily.

  For a subsequent smoothing of the sound and to ensure complete processing
  there are digital distortion, delay, a weird reverb and two second order
  filters. The default playback mode is looping the sample during sustain phase,
  it's possible disabling this behaviour. It's also possible to set a sample
  change and reverse playback probabilities.
specs: |-
