details: >-
  Aethereal is an ambient vector synth equipped with several atmospheric sounds,
  tones and fx for creating evolving soundscapes and textures. The sounds, which
  are in the form of four wave oscillators can be mixed between using a
  sophisticated 4-way transmixer, either manually, with auto-modulation or in a
  set transition from one sound to the next.


  Other modulation options include a multi-vector, which uses three x/y position
  points to modulate various parameters, a 16-step mod-sequencer, three
  modulation envelopes, plus assignable pitchbend and modwheel, making aethereal
  a flexible and expressive ambient synthesizer with many possibilities.


  Features include over 100 built-in sounds such as synth tones, atmospheres,
  vocal pads and sound fx. Four wave oscillators are divided into two sections
  that can be routed to separate audio output channels. The 4-way transmixer can
  be used for making set transitions from one sound to another or for manual or
  automatic mixing.


  The auto-modulation section provides automatic control of the multi-vector as
  well as the transmixer with modulation equivalent of 8 lfos. Two filter
  sections each have independent envelopes, inverters, gain compensation and
  multiple stages (1-4). A dual stereo delay section is included along with a
  16-step modulation sequencer for sequenced modulation of pitch and filters.


  A fully-functioning freeware version is available, with the limitations of
  only two voices polyphony and one audio output.
specs: >-
  - Four wave oscillators with independent amp envelopes

  - 4-way transmixer

  - Multi-vector with three x/y position points

  - 16-step mod-sequencer

  - Three modulation envelopes

  - Two filter sections with independent envelopes, inverters, gain compensation
  and multiple stages (1-4)

  - Dual stereo delay section

  - Assignable pitchbend and modwheel

  - Over 100 built-in sounds

  - 64 presets

  - VST plugin

  - Windows compatible

  - Freeware version available with two voices polyphony and one audio output
  limitation

  - Auto-modulation section with modulation equivalent of 8 lfos
