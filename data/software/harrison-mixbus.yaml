description: Mixbus is Harrison's digital audio workstation, built around a
  knob-per-function mixer that puts the company's 32C console EQ, dynamics, tape
  saturation and bus processing on every channel.
details: |-
  Mixbus is a multitrack recording, editing and mixing application whose mixer
  is modelled on Harrison's analog consoles. Every track carries the 4-band
  Harrison 32C console EQ with high-pass and low-pass filters, a compressor and
  a gate, and the mixbuses reproduce Harrison's tape saturation, bus compression
  and tone control, so a session can be mixed in context the way it would be on
  a console.

  The transport toolbar splits the application into dedicated Cue, Record, Edit
  and Mix pages, and a collapsible Focus Channel strip exposes the Harrison
  processing and the mixbus sends for the selected track at any screen size. Cue
  clips launch audio or MIDI from up to 16 rows, by button press or from the
  timeline, and both audio and MIDI can be recorded straight into cue slots. A
  dedicated piano roll window handles MIDI sequencing, quantizing and editing.

  Mixbus 12 added a DeEsser and a DeNoiser on every channel strip, saveable
  processing chain templates, a darker interface scheme, and vertical and
  horizontal scroll tools.

  Two tiers are sold. Mixbus includes the 32C processing, the Mixbus Gate and
  the Harrison XT plug-in suite. Mixbus Pro adds a switchable SSL 9000 J EQ and
  dynamics section on every channel, and Dolby Atmos immersive mixing with
  immersive panners, ADM export and a built-in binaural renderer.
specs: |-
  - Knob-per-function mixer modelled on Harrison analog consoles
  - Harrison 32C 4-band EQ with high-pass and low-pass filters on every channel
  - Compressor, gate, DeEsser and DeNoiser on every channel
  - Tape saturation, bus compression and tone control on every mixbus
  - Dedicated Cue, Record, Edit and Mix pages
  - Collapsible Focus Channel strip
  - Up to 16 cue rows for launching audio and MIDI clips
  - Dedicated MIDI piano roll editor
  - Per-region plug-in processing
  - Record window with input level metering before tracks are created
  - Mixer scenes, VCA faders and polarity optimization
  - Loudness analysis
  - Switchable SSL 9000 J EQ and dynamics (Mixbus Pro)
  - Dolby Atmos panners, ADM export and binaural rendering (Mixbus Pro)
