description: Meet Sonnox Voca; the definitive solution for professional-sounding
  vocals, fast. Through Voca’s simple to use interface, you’ll easily be able to
  mix outstanding vocals that blow your listeners away, leaving them craving for
  more.
details: |-
  A complete vocal chain in one window: levelling, de-essing, compression, saturation and tone shaping. Set a balanced vocal in seconds, then refine by hand.

  Voca covers dynamic control, EQ shaping and de-essing in a single window, with controls for compression, presence and harmonics in place of a chain of separate plugins.

  Its compressors are inspired by the likes of the iconic 1176 and LA-2A compressors, delivering a more modern, contemporary take on a timeless, classic sound. Add just the right amount of saturation alongside your vocal compression, bringing extra richness, depth and character to the performance, and combine it with the Focus control to shape the vocal’s presence, placing it further forward in the mix or sitting it back to taste.
specs: |-
  - Complete vocal chain in one window: levelling, de-essing, compression, saturation and tone shaping
  - Compressors inspired by the iconic 1176 and LA-2A, with a modern, contemporary take
  - Saturation control for added richness, depth and character
  - Focus control to shape the vocal’s presence in the mix
  - Soften control to smooth harsh edges and reduce sibilance
  - Auto-Input Volume automatically adjusts vocal level before compression
  - Plugin formats: Audio Unit (AU), VST3, AAX-Native (Pro Tools 11 or later)
  - macOS 10.13 High Sierra or later
  - Windows 10 (64-bit) or later
  - Licence includes two simultaneous activations, authorised with a free iLok account (Local Machine, iLok2/iLok3 USB device, or iLok Cloud)
