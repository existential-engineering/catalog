details: |-
  Attack 3 is the next evolution of one of Waldorf music's most iconic and
  longest-running instruments. A true classic reborn, Attack 3 redefines what a
  modern percussion synthesizer can be. At its heart lies a mighty
  analogue-style synthesis engine, delivering 24 individual sounds per kit, with
  12 sounds playable polyphonically as pitched instruments.

  From punchy kicks to melodic percussion, attack 3 is built for rhythm that
  moves both bodies and speakers. Attack 3 captures the unmistakable spirit of
  legendary 1980s analogue drum machines and the driving electronic club sound
  of the 1990s and propels it boldly into today's productions.

  It's a future-ready instrument designed to shape the drum sounds of the next
  decade.

  Attack 3 can be used as a polyphonic synth, allowing you to play melodies,
  chords, and create bass sounds, pads, bell sounds, and other synth textures
  beyond percussion.

  The plugin features deep programming options with the ability to emulate every
  major classic analog drum synth, offering a clean and concise easy-to-use gui
  with low cpu consumption on modern machines.
specs: |-
  - 24 percussion sounds per kit

  - 64 voice polyphony

  - 2 oscillators with virtual analog synthesis and multi samples

  - Frequency and ring modulation

  - Crack module

  - Filter with 12/24 db high-pass, low-pass, band-pass, shelf, bell, notch,
  comb +/-, and redux modes

  - 2 envelopes with adsr and adbdsr modes

  - 2 lfos with adjustable shapes, phase and speed, delay and fade

  - Eq, compressor and assignable effect slot per sound

  - Delay, drive, phaser, flanger, chorus, reverb effects

  - 6 stereo outputs with individual eq, compressor and 3 assignable effect
  slots per output bus

  - 36 percussion kits with over 850 sounds included

  - Preset browser for drum kits and single sounds

  - Sounds 1-24 playable polyphonically via MIDI channels

  - 12 sounds playable polyphonically as pitched instruments

  - Resizable graphical user interface

  - Global tuning

  - MIDI learn

  - Vst3, audiounit and AAX on macos

  - Vst3 and AAX on windows

  - Windows 10/11 64-bit (intel or amd)

  - Macos 10.14.x or higher (intel or apple silicon)
