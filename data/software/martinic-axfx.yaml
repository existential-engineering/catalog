  - Reverb with delay, time, tone (filter), damping and width
  - EQ with low, middle and high bands; middle band features bandwidth control
  - Distortion with drive, tone and level controls
  - Flexible ordering and mix dials
  - Windows 11 arm64ec / snapdragon version available
  - Universal 2 binary
