details: |-
  Martinic AXFX 8-unit effect rack: the ultimate sound shaper. Features 8
  "external" (post synth) effect units with flexible ordering and mix dials.

  Compressor with attack, release, threshold, ratio and makeup. Chorus with
  rate, depth, width and tempo sync. Flanger with rate, depth, feedback, width
  and tempo sync. Phaser with rate, depth, feedback, width and tempo sync.

  Delay with time, pan (ping-pong), feedback, tone (filter) and tempo sync.
  Reverb with delay, time, tone (filter), damping and width. Eq with low, middle
  and high bands; middle band features bandwidth control. Distortion with drive,
  tone and level controls.

  The axfx includes over 100 presets designed by renowned sound designers such
  as daniel stawczyk, charis linos, and solidtrax.

  Axfx by martinic is a virtual effect audio plugin for macos and windows. It
  functions as a VST plugin, an audio units plugin, a VST 3 plugin, an AAX
  plugin and a clap plugin.
