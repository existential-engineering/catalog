  - Pan modulation with sync/free modes

  - Vintage analog saturation unit

  - Analog lp & hp filters

  - Solid state low shelf & high shelf eq

  - Resizable gui




  - Windows 7 64-bit or above

  - Os x 10.9.5 mavericks and above

