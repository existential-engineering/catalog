details: |-
  Action Phaser is a stereo phase modulation effect processor with an advanced modulation system that pushes your limit to highest possibility levels. Deeply customizable parameters gives you to access the deep in your heart. It has also extra features like pan modulation, analog tape saturation and analog filter / EQ units.

  Give your mono tracks a wide stereo spaceship effect. Use the advanced phase modulation features to automate phasing effect exactly like you want. Guitars, jazzy keys, disco drums, vocals, basses, synthesizers... Feed all of the stuff that needs a phase effect in a creative way with action phaser.

  Noiseash's magical, fast, analog quality dsp engine. Customizable double frequency phase system with stunning sound. Advanced phase modulation engine with 7 modulation wave shapes - including saw, square, triangle, sine, randomizer, custom envelope wave forms and 32 bar step sequencer sync/free modes.

  Pan modulation (including sync/free modes). Simplified controls, lot's of creative possibilities. Vintage analog saturation unit. Analog lp & hp filters. Solid state low shelf & high shelf eq. Resizable gui. Friend of cpu.

  Action phaser by noiseash is a virtual effect audio plugin for macos and windows. It functions as an audio units plugin, a VST 3 plugin and an AAX plugin.
specs: |-
  - Stereo phase modulation effect processor

  - Advanced modulation system

  - 7 modulation wave shapes (saw, square, triangle, sine, randomizer, custom envelope wave forms)

