details: |-
  BASSturbo comes with a diverse setup of modern samples laid out across all 10
  octaves of your keyboard in creative ways from kit to kit, and category of
  kits to category. First octave features a set of drums for the first 30 or so
  kits, then we move into other sounds ranging from ethnic drums, to quirks, to
  effects, to things that compliment the bass tone you're on.

  The last kit features a bonus section of all 10 octaves filled with effects,
  voxes, risers, falls, sweeteners, sirens, and other elements to give your
  tracks some emotion and rise/fall from section to section.

  All in all it started as a bass tool, and grew into a full blown kit
  collection that allows you to romp out pretty much any modern genre fairly
  quickly right out of the box. Perfect for those that don't want to tweak much
  just load a few instances and start creating things fast.

  The bass tones are cherry picked (actually most of the sounds are) from our
  unreleased batch of 4,000 new sounds waiting on the dub4 build to be complete,
  so you're getting a new batch of samples each time we release a new vsti/AU
  from here on out.

  Ui features: vol | pan | mashback | lfo rate & depth | reverb | glide poly |
  mono | legato | adsr | transpose | preview+pads | dubturbo 4 leaked samples.
