description: A single-kit drum library for contemporary progressive fusion
  music, delivering clean and glossy tones with organic character. Features a
  punchy snare and toms, versatile kick options, and shimmery cymbals. Includes
  built-in Master EQ, Parallel Compression, Reverb, an integrated Groove player,
  full NKS integration, and phase-coherent samples.
details: |-
  One Kit Wonder: Modern Fusion is inspired by contemporary progressive fusion artists, where the music demands a clean and glossy drum sound that nevertheless retains an organic timbre and wide dynamic range.

  You'll find the snare and toms are punchy but musical, while the kick can deliver piercing attack or solid thud depending on the dynamic range you utilise. The cymbals are shimmery and hi-fi, but also have an underlying dark complexity and touch-responsiveness.

  The One Kit Wonder series was inspired by the many GGD users who use our libraries for songwriting. We know how crucial it is that there is as little time wasted between the moment inspiration strikes and you being able to capture it, and how important it is that you can hear your ideas sounding polished and professional so you stay excited as you develop them.

  It's our hope that this sample library will remove frustrating barriers in your creative process so that you can enjoy making music to the fullest.
