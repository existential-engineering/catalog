details: |-
  The LANG-PEQ2 is modeled after a vintage solid-state parametric EQ from the 1960's. Featuring controls similar to the VEQ-1A tube EQ, the PEQ2 really stands apart from the pack thanks to its frequency control, allowing users to set different and separate LF boost and LF cut frequencies.

  The PEQ2 provides plenty of width in the midrange while retaining tightness on the high end and low end and its high end bands excel at giving tracks that extra shine, making it an all-star on vocals and drum overheads.

  Runs natively in your DAW on macOS or Windows, or in real-time on a Synergy Core interface.
