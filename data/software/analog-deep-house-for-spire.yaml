details: |-
  Analog deep house for spire is a brand new and exciting spire soundset from spartan sounds. Crafted by sound designers, each preset has been individually tweaked and perfected to give the highest performance and quality.

  Each preset in this pack has pre-assigned modulation wheel functionality to give your track movement and excitement. These sounds have been inspired by the likes of zhu, disclosure, kygo and more.

  Some presets include programmed arp patterns and lfo routing is set to off by default allowing you to turn all sorts of interesting modulations on or off as you need them.
specs: |-
  - Over 65 sounds
  - Pre-assigned modulation wheel functionality
  - Programmed arp patterns
  - Lfo routing
