  mastering. A faithful emulation with the authentic analog sound of the
  original Drawmer 1970s hardware.
details: |-
  For the mastering engineer, a multi-band compressor is a powerful tool. But a multi-band compressor that is not used diligently may create more problems than it solves. This is why Softube created Drawmer S73 Intelligent Master Processor. Use it to shape your mix with clarity and definition that no regular compressor could ever provide.

  A semi-automatic mastering device with a three-band compressor, mid/side capabilities, and transparent filters inside, the S73 makes the choices a mastering engineer would, so it always sounds great. Simply use the Style parameter to switch between ready made mastering processing techniques, quickly finding the sound that suits your mix.

  Under the hood, the S73 is based on technology created by Drawmer for the 1973 Three Band FET Stereo Compressor. This is an award winning multi-band analog compressor design famous for its precision and flexibility. But as with all multi-band compressors it takes care and experience to find the sweetest of sweet spots. With the S73 they have been found for you, and the sound design behind each Style represents an expert mastering engineer's skill and taste.

  Softube has carefully modeled all the characteristics of the original analog hardware at component level, so what you hear in the S73 is truly the real thing in action. The S73 is the way to get top-of-the-line analog hardware on your mastering bus without fear of choice paralysis or losing yourself in the details. It's called the Intelligent Master Processor because it makes the tough decisions for you, leaving you free to listen to the effect.

  Two plugins are included. Drawmer S73 thinks like a mastering engineer and acts accordingly: whatever you want your mixes to be, brighter, louder, wider, it does it all with ease. Drawmer S73 for Amp Room runs inside Softube's pro audio guitar and bass platform, where it can be combined with other studio effects, classic amps, cabs, and pedals.
specs: |-
  - Built-in mastering sound design
  - Two versions included: Drawmer S73 Intelligent Master Processor and Drawmer S73 Intelligent Master Processor for Amp Room
  - Lifts your mixes to the next level
  - The true analog sound of the Drawmer 1973 multi-band compressor
  - Parallel compression possible with wet/dry mix knob
  - 'Air' switch brings added polish and shine to your mix
  - Ten styles to choose from
  - Three-band compressor with mid/side capabilities and transparent filters
  - Component-level modeling of the original analog hardware
  - Console 1 Ready: can be used within the Console 1 mixing system
  - Supports Softube Extended Features
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Three activations
  - 20-day trial, 14-day returns
