details: |-
  Accurately modeled after the original 70s blue-faced version of a classic and
  sought-after VCA compressor the sc-5 opens up a whole world of versatility:
  gentle compression to sweeten the signal on your master buss, distorted
  smashed-up sound on your drum buss, or taming lively and dynamic material. The
  full-blown set of parameters allows you to dial in just the right setting for
  your application while always maintaining its own pleasant and characteristic
  tone.

  The blueash sc-5 is a fixed threshold compressor where more compression can be
  achieved by increasing the input gain. Drag the input gain knob while holding
  the right mouse button and the output gain will be adjusted so the perceived
  output level will remain approximately the same.

  Our real time spice type component based circuit simulation approach allows to
  authentically capture the sound and feel of the analog counterpart in all
  nuances. Every crucial part of the circuit, including the custom vca design,
  the dual time-constant detector circuit, the feedback compressor loop and the
  audio path have been faithfully modeled.

  Dsp operations are pipe-lined using the sse2 instruction set to ensure highest
  possible performance operation despite very complex computations. Aliasing
  artifacts are efficiently attenuated using a low latency linear phase
  dolph-chebyshev poly-phase design with oversampling auto adjusted to your
  session's sample rate to save valuable cpu power while offering the most
  transparent sound possible.

  All plug-ins support high pixel density on mac os x and windows to bring the
  most enjoyable user experience on high dpi displays.
