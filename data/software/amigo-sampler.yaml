details: >-
  Discover new ways to create that authentic commodore amiga crunch in your
  production without having to sacrifice on quality unlike other common
  bitcrushers or post fx using sampler emulations. Added in as well is akai
  style timestretching with the most accurate sound everybody grew to love, you
  can automate this plus many other of the features in realtime so no more
  waiting on rendering the stretches.


  Slicemode lets you as it might suggest: slice your sample into multiple points
  you can trigger with different notes. Perfect for breaks, glitchy vocal chops
  or any other creative ways you can come up with.


  Samplerates range from 22168hz down to 4144hz these frequencies have been
  taken straight from the note tables of protracker on the amiga for the most
  accurate sound.


  Amigo sampler even loads .iff, .8svx .raw format commodore amiga samples so
  for those with a real amiga you finally have a way to use those samples
  directly without having to convert them to .wav or the samples sounding
  different then how they are supposed to sound.
specs: |-
  - VST 3 plugin
  - Audio units plugin
  - Commodore amiga sample format support (.iff, .8svx, .raw)
  - Akai style timestretching
  - Slice mode
  - Sample rate range 22168hz to 4144hz
  - Protracker sample rate compatibility
  - Real-time automation
  - Universal 2 binary
  - Macos and windows compatible
