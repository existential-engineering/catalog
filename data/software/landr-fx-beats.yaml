description: LANDR FX Beats. The Multi-FX plugin for Drums & Percussion. Get the
  perfect shape and tone for your drums. Included in LANDR Studio.
details: |-
  LANDR FX Beats is a multi-FX plugin built for drums and percussion. It gathers EQ, compression and saturation into a single plugin so a kick can be sculpted or a whole kit transformed without chaining several separate processors.

  LANDR describes the plugin as putting a powerhouse of audio processing behind your drums, and positions it as one multi-FX plugin for all your beats regardless of genre or style. The stated goal is to do more with less, using multi-FX expertly tailored for percussion.

  The plugin ships with a preset library covering everything from smooth EQ to tight, punchy compression to explosive saturation. Named presets called out on the product page include 808 Growl, Vintage Smooth and Motown. The hero copy cites 46 presets while the features section cites 49 meticulously crafted presets.

  A blender dial is the plugin's central control. LANDR describes it as an easy-to-use dial that takes the guesswork out of complex mixing techniques, letting the user reach a target sound with one knob rather than adjusting each processor individually.

  The product page features Oscar-winning engineer Daniel Rowland demonstrating FX Beats to add presence and glue to drum kits. The plugin is sold on its own and is also included with the LANDR Studio subscription.
specs: |-
  - Multi-FX processing for drums and percussion combining EQ, compression and saturation
  - Preset library including 808 Growl, Vintage Smooth and Motown (page cites 46 presets in the hero copy and 49 in the features section)
  - Blender dial control for simplified mixing
  - macOS: MacOS X 10.14 or higher
  - macOS: Apple Silicon Native or Intel (VST3, AU, AAX)
  - Windows: Windows 10 (64 bit) or higher (VST3, AAX)
