description: Harpsichord for Kontakt recorded in a studio live room using three mic positions. Includes a full mixer, effects and settings to control every detail of the sound.
details: |-
  The harpsichord was widely used in Renaissance and Baroque music. During the late 18th century, it gradually disappeared from the musical scene with the rise of the piano. In the 20th century, it made a resurgence, being used in historically informed performance of older music, in new (contemporary) compositions, and in popular culture. Demonic Virtuoso is a deep representation of the sound of a baroque harpsichord for Kontakt.

  The instrument was recorded with 3 microphone positions: close, decca and outrigger. It carries 4 round robin, all notes sampled with no pitch shifting, and time based release samples, so behaviour, sound and playability are faithfully replicated. It was sampled using the finest microphones and preamps in a live recording studio room, using a perfectly tuned harpsichord in mint state.

  Demonic Virtuoso features a full mixer with which you can control the three mic positions separately, with a load/purge switch for each channel, pan, width, volume, mute, solo, phase shift and an output selector for mixing the different channels in your DAW.

  In the effects page you can add any effect you want in any order, including EQ, compressors, modulation effects, distortion, saturation, tape machine, reverbs, amp simulators and more. This script boosts the sonic capabilities of the library exponentially in a simple and intuitive design.

  From the settings page you can control round robin, dynamic range, velocity curve, the volume of the release samples and sample start.
specs: |-
  - Baroque harpsichord sampled in a studio live room
  - 3 mic positions: close, decca and outrigger
  - 4x round robin
  - 1 velocity layer
  - 1,524 samples
  - 1.52 GB
  - All notes sampled, no pitch shifting
  - Time based release samples
  - Mixer with load/purge per channel, pan, width, volume, mute, solo, phase shift and output selector
  - Effects page with freely ordered EQ, compressors, modulation, distortion, saturation, tape machine, reverbs and amp simulators
  - Settings page with round robin, dynamic range, velocity curve, release sample volume and sample start
  - Kontakt 5.7.3 and newer versions, full version of Kontakt required (Kontakt Player runs in demo mode)
