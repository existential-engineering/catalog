details: |-
  Amp ONE real-time simulation technology allows the musician to be mobile
  without sacrificing sound quality and feel, allowing the guitarist to
  experience creative inspiration in the moments when there is no access to
  studio equipment for guitar amplification.

  High-quality preamp modeling based on electric circuit simulation and solving
  systems of nonlinear differential equations. Modeling of seven preamp sections
  of famous guitar heads/preamps. All channels included.

  Cabinet simulation with precision mic positioning based on high quality
  convolution. High quality simulation of best stereo choruses.

  Simple preset system allow fast manage presets without loose you settings.
  Snapshot system allow manage all preamp/effects settings entirely to
  save/restore settings of all channels of all preamps and effects
  (cabinet/chorus/delay/reverb).

  Inter-app-audio/audiobus support.
specs: |-
