description: The emulation of the SSL XL 9000 K analog console, in plugin form.
  Developed in close collaboration with Solid State Logic. Softube SSL XL 9000
  K-Series gives you a clean, wide, and smooth sound.
details: |-
  If you're looking to complement the legendary rock 'n' roll sound of the SSL 4000 E, check out the super clean sound of the equally revered XL 9000 K, available exclusively for Console 1.

  Developed in close collaboration with SSL engineers, the unconstrained depth and sonic possibilities make it an indispensable tool for R&B, Hip Hop and Electronica producers, as well as for audiophile Jazz and Classical recordings.

  Ultra clean: When the first 9000 series console was released in the mid-1990s, it represented a breakthrough in analog circuitry design. The sound path is entirely capacitor-free, in order to keep a perfect signal integrity and low distortion.

  Ultra wide: Extreme bandwidth, minimal phase shift and super low distortion make this console perfect for getting the most out of your mixes in terms of width, depth, and all-around hugeness.

  Ultra smooth: To bring creative use of drive and saturation back onto the menu, Softube modeled SSL's Variable Harmonic Drive (VHD) and included it as part of this desk. Tube-ish, transistor-ish, or anything in between.
specs: |-
  - Exclusive for Console 1 Mixing System
  - Wide, large, smooth sound
  - VHD model added
  - Extended gate and compressor features
  - Clean, smooth, natural EQ exclusively for Console 1
  - Capacitor-free modeled signal path for signal integrity and low distortion
  - Extreme bandwidth with minimal phase shift
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26; Windows 10 (64-bit), Windows 11
  - Softube account and iLok account required (no physical iLok required)
  - Three activations
  - 20-day trial
