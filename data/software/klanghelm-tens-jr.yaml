description: TENS jr. is a studio spring reverb plugin and the little brother of TENS, featuring the TENS model 5 - tank A with extended properties including stereo tank configuration and decay times from 0.5 to 20 seconds.
details: |-
  TENS jr. is the little brother of the studio spring reverb TENS. It features TENS model 5 - tank A, with properties extended compared to the original unit from the late 70s/early 80s it was modeled after. A single tank is now stereo, and the range of decay times has been extended to 0.5 to 20 seconds.

  The reverb's character can be altered drastically with the associated horizontal fader. This gives the plugin significant tonal flexibility despite its simple interface.

  In contrast to classic spring reverbs found in guitar amps, organs, or some synths, TENS jr. offers very high reverb density, fast build-up, and very low 'boing' artifacts, making it sound almost plate-like.

  TENS jr. is freeware.
specs: |-
  - Single stereo tank configuration (TENS model 5 - tank A)
  - Decay time range: 0.5 to 20 seconds
  - Horizontal fader for character alteration
  - Very high reverb density and fast build-up
  - Very low 'boing' artifacts — sounds almost plate-like
  - No copy protection
