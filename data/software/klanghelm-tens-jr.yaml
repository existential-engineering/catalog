description: TENS jr. is a freeware studio spring reverb plugin, the little brother of Klanghelm's TENS, featuring the TENS model 5 tank A. It offers high reverb density, fast build-up and very low "boing" artifacts, with decay times from 0.5 to 20 seconds.
details: |-
  TENS jr. is the little brother of the studio spring reverb TENS. It features TENS model 5 - tank A, a single tank drawn from the larger plugin's set of modelled studio spring reverb units.

  The properties of the reverb have been extended compared to the unit from the late 70s/early 80s it has been modeled after. A single tank is stereo now, and the range of decay times has been extended to 0.5 to 20 seconds.

  The reverb's character can be altered drastically with the associated horizontal fader.

  In contrast to classic spring reverbs found in guitar amps, organs or some synths, TENS jr. offers very high reverb density, fast build-up, and very low "boing" artifacts, making it sound almost plate-like.

  TENS jr. is freeware, distributed as a Windows or macOS installer from Klanghelm's site, and like all Klanghelm plugins it uses no copy protection.
specs: |-
  - Studio spring reverb based on TENS model 5 - tank A
  - Modeled after a hardware unit from the late 70s/early 80s
  - Stereo single tank (extended from the original mono unit)
  - Decay time range extended to 0.5 to 20 seconds
  - Horizontal fader for drastic changes to the reverb character
  - Very high reverb density and fast build-up
  - Very low "boing" artifacts, sounding almost plate-like
  - No copy protection
  - Windows 10 or higher, 64bit VST or VST3 host
  - macOS 10.13 or higher, 64bit VST, VST3 or Audio Unit host
  - Intel Mac and Apple Silicon supported natively
  - Pro Tools 11 or higher for AAX versions
