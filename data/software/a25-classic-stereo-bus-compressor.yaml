details: |-
  A25 has been modeled after a beautiful stereo compressor, with a few "modern" add-ons: sample aligned dry-wet control. Mid-side balance control of action of the compressor (sets where the processing is done between mid and side components of the stereo field). True auto-gain, for easy level-matched comparison. Through-clipboard preset management system (copy and paste between instances).

  It is also the first product we designed with a new vectorial interface, first step towards complete resizeability. Comes with a set of presets, useful as a reference for everybody who never used this model.

  We put quite some efforts to accurately model all aspects of the unit, from transformers to compression to filters. Classic, unique features include: variable stereo link, from independent stereo channels to full linking, plus three filtering options fro great control.

  Special loud sidechain filter, for a more transparent and effective compression on mixes and wide frequency range signals, a strong low-range and great control on high frequencies. Multiple knee options for the compression curve.

  Feedback (vintage style) and feed-forward (stronger, modern action) options for circuit topology. Also coming as AAX-dsp.
