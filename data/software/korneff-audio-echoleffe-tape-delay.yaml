description: The Echoleffe Tape Delay is a precise emulation of a vintage tape delay of the 1960s, with an all-tube signal path and three delay lines offering up to 4 seconds of delay each.
details: |-
  The Echoleffe Tape Delay is a plug-in emulation of an all-tube tape delay from 1961. It has three operational modes: delay effects, tape saturation and a tube preamp.

  In Tape Delay mode the ETD offers three delay lines that can be independently panned across the stereo field, EQ'd and adjusted. A bias adjustment adds harmonic distortion and the filters produce lo-fi echo effects. Delays can be tempo synced to the DAW for timing based on musical note values, or set manually for up to 4 seconds per delay line.

  The tape itself is adjustable. The age of the unit, worn motors and tape heads, tape formulation, and wow and flutter can all be set, covering flanging and detune effects and modulated reverb tails.

  Tape Saturation mode switches off the delays and turns the ETD into a dedicated tape saturator, with every parameter adjustable from gain to bias to tape formulation and age, ranging from the response of a vintage analog tape deck through to heavy distortion. It adds the compression and harmonic content associated with tape recording.

  Tube Preamp mode is a recreation of a tube circuit from the late 1950s that was also used in a guitar amplifier. It offers complete control of that circuit, for shaping the delays, processing a track, mix bus use, low-end shaping, or high-gain fuzz tones.
specs: |-
  - Three operational modes: tape delay, tape saturation and tube preamp
  - Three delay lines, each independently panned, EQ'd and tweakable
  - Up to 4 seconds of delay per delay line, manual or tempo synced to the DAW
  - Exaggerated bias adjustment and filters for grit and lo-fi echo effects
  - Adjustable tape age, motor and head wear, and tape formulation
  - Wow and flutter controls for flanging and detune effects
  - Dedicated tape saturation mode with full gain, bias, formulation and age control
  - Tube preamp mode modelled on a late-1950s tube circuit
  - All-tube signal path emulation
  - Requires an iLok account for activation and licensing
  - Activation on up to four machines at the same time
  - Internet connection required for activation and for all demos
  - Minimum: Intel, AMD or Apple Silicon i5 quad core processor
  - Minimum: 4GB of RAM
  - Minimum: Mac OS X 10.14 or higher
  - Minimum: Windows 7 and above
  - Minimum screen resolution: 1024 x 768
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
