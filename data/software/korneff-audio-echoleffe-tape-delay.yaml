description: The Echoleffe Tape Delay is an audio plug-in for your DAW that gives you the sounds and spirit of a fabulous, all-tube tape delay from 1961.
details: |-
  The Echoleffe Tape Delay is a vintage tape delay emulation inspired by 1961 all-tube equipment, offering three distinct operational modes: tape delay, tape saturation, and tube preamp.

  In Tape Delay mode, the plugin features three independently pannable delay lines with EQ controls, bias adjustment, and filtering. Users can sync to DAW tempo or set manual delay times up to 4 seconds per line, with extensive tape emulation parameters including wow and flutter effects.

  Tape Saturation mode disables the delay functionality to function as a dedicated tape saturator, allowing users to add warmth or aggressive saturation while adjusting modulation characteristics for lo-fi and vintage tone shaping.

  Tube Preamp mode provides a tube circuit emulation derived from late-1950s designs, offering complete control of that tube circuit for tone shaping independent of delay or saturation functions.

  The plugin requires an iLOK account for activation, supports up to 4 simultaneous machine activations, and is compatible with macOS 10.14 or higher and Windows 7 and above, both in 64-bit.
specs: |-
  - Three delay lines with independent panning and EQ
  - Tape emulation with adjustable age, motor wear, and tape formulation
  - Wow and flutter controls
  - Bias adjustment for distortion/grit
  - Tempo sync to DAW or manual delay timing (up to 4 seconds per line)
  - Dedicated tape saturation mode
  - Tube preamp simulator mode based on late-1950s designs
  - Filter controls for lo-fi effects
  - Requires macOS 10.14 or higher (64-bit)
  - Requires Windows 7 and above (64-bit)
  - Intel, AMD, or Apple Silicon i5 quad-core processor minimum
  - 4GB RAM minimum
  - Screen resolution 1024x768 or higher
  - iLOK account required, up to 4 simultaneous machine activations
  - Formats: VST3, AU (Mac); VST3, AAX (Windows)
