description: The Echoleffe Tape Delay is a precise emulation of a vintage tape
  delay of the 1960's. The plug-in has an all tube signal path, three delay
  lines with up to 4 seconds of delay each, and the amazing tweak-ability that
  people expect from Korneff Audio software. And it sounds great!
details: |-
  The most accurate and tweakable tape delay out there. With tape emulation, modulation and tube warmth. The Echoleffe Tape Delay is an audio plug-in for your DAW that gives you the sounds and spirit of a fabulous, all-tube tape delay from 1961. It adds effortless character and vintage mojo to your recordings and mixes. But it's TONS more than just a tape delay. Three different operational modes give you delay effects, tape saturation and a tube preamp.

  Tape Delay Mode: The ETD is a fantastic tape delay simulation with unmatched versatility and sonics. From pristine vocal echoes to outer space flange effects, the ETD is a tool that brings out your creativity. The Echoleffe Tape Delay features three delay lines that can be independently panned across the stereo field, EQ'd and tweaked for effects ranging from subtle to massive. Add some grit with the overly exaggerated bias adjustment, or use the filters to created lo-fi echo effects. Tempo sync to your DAW for perfectly timed echoes based on music note values, or set the time manually for up to 4 seconds of delay per delay line.

  Beyond just delay, you have extensive control of all aspects of the tape. Tweak the age of the unit, simulate wearing out motors and tape heads and change tape formulations. Set Wow and Flutter for flanging and detune effects. Create reverbs that shimmer and move. Or nail the guitar sounds of your favorite players.

  Tape Saturation Mode: Tape Saturation mode switches off the delays and turns the ETD into a dedicated tape saturator. Add a gentle warmth or completely overload the signal, and adjust wow and flutter for unique, modulated effects. Adjust all parameters, from gain to bias to tape formulations and age. The ETD can be as gorgeous as a vintage analog tape deck, or as crunched and nasty as you want it to be.

  Tube Preamp Mode: The ETD's tube preamp simulator adds a gorgeous warmth and richness to any signal you pass through it. No delay, no saturation, just pure tube preamp glow, or crank up the gain and make things explode. The ETD's preamp is an enhanced recreation of a tube circuit from the late 1950s that sounded so good it was made into a guitar amp.
specs: |-
  - Emulation of an all-tube tape delay from 1961, with an all tube signal path
  - Three operational modes: tape delay, tape saturation, tube preamp
  - Three delay lines, independently pannable across the stereo field and EQ'd
  - Up to 4 seconds of delay per delay line, manual or tempo synced to the DAW by note value
  - Exaggerated bias adjustment and filters for grit and lo-fi echo effects
  - Tape controls: age of the unit, worn motors and tape heads, tape formulations
  - Wow and flutter for flanging and detune effects
  - Licensing: iLOK account required for activation, up to four simultaneous activations, internet connection required for activation and demos
  - Minimum system: Intel, AMD or Apple Silicon i5 quad core, 4GB RAM, macOS 10.14 or higher, Windows 7 and above, screen resolution 1024 x 768 or higher
