description: The Echoleffe Tape Delay is a precise emulation of a vintage tape delay of the 1960s, with an all-tube signal path and three delay lines offering up to 4 seconds of delay each.
details: |-
  The Echoleffe Tape Delay is an audio plug-in for your DAW that gives you the sounds and spirit of an all-tube tape delay from 1961. It adds character and vintage mojo to recordings and mixes, and it is a good deal more than just a tape delay: three different operational modes provide delay effects, tape saturation and a tube preamp.

  In Tape Delay mode the ETD offers three delay lines that can be independently panned across the stereo field, EQ'd and tweaked for effects ranging from subtle to massive. An exaggerated bias adjustment adds grit and the filters produce lo-fi echo effects. Delays can be tempo synced to the DAW for timing based on musical note values, or set manually for up to 4 seconds per delay line.

  Beyond echoes there is extensive control over the tape itself. Tweak the age of the unit, simulate worn motors and tape heads, change tape formulations, and set wow and flutter for flanging and detune effects, shimmering moving reverbs, or the guitar sounds of particular players.

  Tape Saturation mode switches off the delays and turns the ETD into a dedicated tape saturator, with every parameter adjustable from gain to bias to tape formulation and age. It can be as gentle as a vintage analog tape deck or as crunched and nasty as required, adding the gentle compression and sweet harmonics that make tape-recorded tracks sit better in a mix.

  Tube Preamp mode is an enhanced recreation of a tube circuit from the late 1950s that sounded good enough to be made into a guitar amp. It offers complete control of that circuit, whether to further tailor the sound of the delays, warm up a track, strap across the mix bus, fix a thin bass, or crank the gain for a unique fuzz tone.
specs: |-
  - Three operational modes: tape delay, tape saturation and tube preamp
  - Three delay lines, each independently panned, EQ'd and tweakable
  - Up to 4 seconds of delay per delay line, manual or tempo synced to the DAW
  - Exaggerated bias adjustment and filters for grit and lo-fi echo effects
  - Adjustable tape age, motor and head wear, and tape formulation
  - Wow and flutter controls for flanging and detune effects
  - Dedicated tape saturation mode with full gain, bias, formulation and age control
  - Tube preamp mode modelled on a late-1950s tube circuit
  - All-tube signal path emulation
  - Requires an iLok account for activation and licensing
  - Activation on up to four machines at the same time
  - Internet connection required for activation and for all demos
  - Minimum: Intel, AMD or Apple Silicon i5 quad core processor
  - Minimum: 4GB of RAM
  - Minimum: Mac OS X 10.14 or higher
  - Minimum: Windows 7 and above
  - Minimum screen resolution: 1024 x 768
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
