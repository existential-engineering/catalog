description: Reviver is the ultimate sound enhancement plugin for mixing and mastering engineers. With its versatile features and finely tuned processes, Reviver is the perfect tool to add warmth, punch, and definition to your sound.
details: |-
  Reviver's adaptive processing automatically distinguishes between transient and sustained layers, so it can add extra warmth, punch, definition and clarity to transients while leaving the sustained material in the mix intact.

  The Low module adds punch and thump to kick and bass without introducing muddiness. The Mid module adds attack and tightness to guitars, vocals, and other sources that need to sit forward in the mix, without losing what makes the source sound like itself.

  A separate high-frequency algorithm adds presence, clarity, and detail to the top of the signal, bringing out definition in drum transients, cymbals, and vocals without harshness. Reviver's harmonic enhancement adds tonal richness and warmth without introducing grit or distortion.

  A unified control lets users adjust multiple parameters simultaneously, a bypass button allows instant A/B comparison, and the plugin limits aliasing to maintain signal integrity. The interface offers both light and dark modes.
specs: |-
  - Low module: punch and thump for drums and bass while maintaining source integrity
  - Mid module: attack, punch and tightness without losing original character
  - High-frequency algorithm: adds attack, punch and tightness without losing original character
  - Harmonic enhancement: enhances tonal quality without introducing unwanted distortion or noise
  - Unified control to adjust multiple parameters simultaneously
  - Bypass button for instant processing comparison
  - Aliasing limitation to maintain signal integrity
  - Light and dark UI modes
  - Mac OS X 10.15 or higher
  - Windows 10 or higher
  - 64-bit only
  - 200 MB free drive space
