details: |-
  Clariphonic Mk3 is a high-frequency shelving EQ plugin from Kush Audio. Its sound comes from the very cozy marriage of Magpha EQ's buttery high-end algorithms with Clariphonic's uniquely gain-dependent shelving corners.

  Its buttery-smooth high-frequency filters add presence, clarity, sparkle, and air to any sound, and does it while keeping everything silky smooth and warm, never harsh. It carries 1:1 features with the Clariphonic MS hardware.

  The EQ has two high-shelving bands. Focus is the lower one, with Lift and Open frequency selections plus an Out position that bypasses that band alone. Clarity is the higher one, starting where Focus leaves off, with Presence, Sheen, Shimmer and Silk selections in ascending order. Mk3 adds a Cut mode on the Focus band, modelled on the Clariphonic M/S hardware, which dips between 1k and 3.5k for upper-mid softening. Boost produces 14-16dB of gain while cut maxes out around -7dB.

  An XY control drives both gain knobs at once, with the Y axis on Focus Gain and the X axis on Clarity Gain, and an optional Skew curve for finer resolution at low gains. A dynamic EQ curve display tracks the gain-dependent corner frequencies and can be switched off, and the plugin runs in Stereo, Dual-Mono (L/R) or Mid-Side (M/S) modes, splitting the display and the band selections per channel in the latter two. In/Out trim covers +/- 12dB, a 0VU trim calibrates the meter against a 1k reference tone, and a soft bypass mutes the processing and metering while still passing through the plugin.

  It is sold as a perpetual licence at 199 USD covering 2 activations, free updates and support, and all available presets, with a separate 99 USD upgrade licence and a free 10-day demo offered via a demo code. Mac and Windows installers and a user manual are available from the maker.
specs: |-
  - Two high-shelving bands: Focus (Lift / Open / Out) and Clarity (Presence / Sheen / Shimmer / Silk / Out)
  - New Cut mode on the Focus band, dipping 1k-3.5k for upper-mid softening
  - Asymmetrical band gain: boost 14-16dB, cut approximately -7dB maximum
  - Gain-dependent shelving corner frequencies
  - XY control for simultaneous Focus and Clarity gain, with optional Skew non-linear response
  - Dynamic EQ curve graph display with On/Off switch
  - Stereo, Dual-Mono (L/R) and Mid-Side (M/S) operating modes with per-channel band selection
  - In/Out trim with +/- 12dB range
  - 0VU trim to set the dBFS level corresponding to 0VU, calibrated with a 1k reference tone
  - Dual-needle VU metering for input and output
  - Soft bypass of EQ and metering
  - Perpetual licence includes 2 activations, free updates and support, and all available presets
  - Free 10-day demo available via demo code
