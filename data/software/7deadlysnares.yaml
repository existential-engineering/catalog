description: 7 unique snare engines designed for various genres, each with its
  own distinct sound, 3 different variations, and 4 adjustable macros. Features
  a morph section to blend between altered variations and a huge amount of
  presets.
details: |-
  7DeadlySnares is the first plugin from the musicians and developers based behind the playground and beatsurfing apps. Recognizing the cliched struggle to find the perfect snare, we took a new approach. We curated distinct snare styles for various genres, resulting in 7 unique snare engines.

  Indulge in the ultimate snare generator that comes with 7 unique audio engines and a vast selection of presets. Huge amounts of presets that cover a large scope, ready to be quickly tweaked and tuned to match your song.

  All engine comes with three different variations and 4 macros. In the morph section, drag the pointer to morph between 3 altered versions of the engine.

  Tweak you snare with 4 specialized macros. Individually tailored to complement each of the 7 snare styles to build the perfect snare.

  7deadlysnares by beatsurfing is a virtual instrument audio plugin for macos and windows.
specs: |-
  - 7 unique snare engines
  - Three variations per engine
  - 4 macros per engine
  - Morph section
  - Preset library
