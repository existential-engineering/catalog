details: |-
  Ableton drum racks core bundle for ezdrummer is a collection of ezdrummer rock performance drum racks on ableton push featuring over 100 ableton drum racks and over 30 ableton live routing templates configured for leading toontrack ezdrummer2 core libraries.

  Ableton drum racks for ezdrummer modern kit: 34 ableton drum racks individually mapped to all ezdrummer 2 modern kit factory library content presets, with 17 predesigned ableton live templates to cater for the multi track audio routing of the ezdrummer modern kit presets in ableton live.

  Ableton drum racks for ezdrummer vintage kit: 24 ableton drum racks individually mapped to all ezdrummer 2 vintage kit factory content presets, with 12 predesigned ableton live templates to cater for multi track audio output routing of the ezdrummer vintage kit presets in ableton live.

  Ableton drum racks for ezdrummer cocktail kit: 26 ableton drum racks individually mapped to all ezdrummer cocktail kit ezx factory content presets, with a predesigned ableton live template to cater for multi track audio output routing of the ezdrummer cocktail kit presets in ableton live.

  Audio routing options: singleout presets featuring 42 ableton drum racks for all factory presets single audio output to single ableton track, and multiout presets featuring 42 ableton drum racks for all presets in multiple audio channel output from the plug in to multiple ableton audio tracks using the multi output ableton template also provided.
specs: |-
  - Over 100 ableton drum racks
  - Over 30 ableton live routing templates
  - 34 ableton drum racks for modern kit
  - 17 predesigned ableton live templates for modern kit
  - 24 ableton drum racks for vintage kit
  - 12 predesigned ableton live templates for vintage kit
  - 26 ableton drum racks for cocktail kit
  - Ableton push integration
  - Colour coded pad design
  - Individually labelled drum rack pads
  - Mapped ableton macros
  - Single audio output routing
  - Multiple audio channel output routing
  - Ableton live compatibility
  - Macos and windows support
