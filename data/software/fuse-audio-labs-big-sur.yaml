description: A freeware op-amp diode fuzz pedal emulation inspired by the Electro-Harmonix Big Muff Pi from the late 1970s, delivering wide-spectrum distortion with fuzz and midrange authority. Part of the VPB virtual pedal board collection; available free with no limitations.
details: |-
  Op-amp diode fuzz pedal emulation inspired by the Electro-Harmonix Big Muff Pi (late 1970s op-amp variant). Part of the VPB-Bundle virtual pedal board collection alongside El-Germano, Octafish, Gate-230, and Chorus-65. Available as a free standalone plugin with no registration required. Supports adjustable GUI size (80–125%) and graphics quality settings. Zero-latency mode for live use; optional oversampling (adds 32 samples of latency) to reduce artifacts. Both 32-bit and 64-bit versions included.
specs: |-
  - Controls: Sustain (fuzz amount), Level (output volume), Tone (EQ filter), Tone On/Off, Mix (dry/wet blend), Oversampling On/Off (32 samples latency when enabled)
  - macOS 10.9+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+, Intel-compatible CPU 2 GHz+, 2 GB RAM, 1280×1024 display
  - Formats: VST2, VST3, AU, AAX (32-bit and 64-bit)
  - Bundle version: 2.7
