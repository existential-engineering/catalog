description: The HoRNet AutoGain is a volume leveling and gain automation plugin designed to shorten the time it takes to create volume automations in your tracks
details: |-
  The HoRNet AutoGain has been designed with a specific purpose in mind: drastically shorten the time it takes to create gain automation curves.

  When finishing a mix usually you have some tracks that need some volume adjustment here an there, you could adjust individual clip gain or start writing volume automation, but this is a long and boring task. Here it comes the HoRNet AutoGain to the rescue.

  It has two different inputs, in the main one put the track you want to automate, in the second one your volume reference, it may be a single track, a track group or the whole mix, press play and let the HoRNet AutoGain work its magic. It will try to keep your track level to the same of your reference creating the needed gain automation, you can adjust speed, sensitivity and gain range.

  Try it on a vocal track and when you are done put it into "write mode" to have the gain automation written for you!

  The HoRNet AutoGain has no copy protection, we don't believe in copy protection, they are always cracked and they are annoying for the users. So simply download the plugin and enjoy your recordings!
specs: |-
  - Automatic gain riding
  - Adjustable reaction speed
  - Adjustable reference sensitivity
  - Adjustable gain riding range
  - Apple Silicon native support
  - Mac OS X (10.11 and later) and Windows (7 and later) support
  - 64-bit plugins for macOS and Windows
  - Audio Units, VST, VST3 and AAX format
  - No copy protection
  - Two inputs: main track input plus a volume reference input
