description: 14 AAX/VST/AU reverb and effects plug-ins delivering the
  distinctive Lexicon Sound as native plug-ins, with hundreds of finely-crafted
  studio presets for popular DAWs such as Pro Tools, Logic, and Nuendo.
details: |-
  The PCM Total Bundle combines the PCM Native Reverb Plug-in Bundle and the PCM Native Effects Plug-in Bundle into a single collection of 14 native plug-ins, delivering the same distinctive Lexicon Sound used on countless professional records.

  The reverb side contributes seven algorithm-based reverbs - Chamber, Concert Hall, Hall, Plate, Random Hall, Room, and Vintage Plate - while the effects side adds seven creative processors: Pitch Shift, Multivoice Pitch, Chorus, Resonant Chords, Random Delay, Dual Delay, and Stringbox.

  Each plug-in is built for professional mixing workflows in DAWs such as Pro Tools, Logic, and Nuendo, with real-time graphical displays, stereo and phase meters, input/output/feedback metering, and full parameter automation across a DAW-independent preset format.

  Authorization is handled through iLok Manager, supporting either local machine activation or a USB iLok key. The current release is Apple Silicon native and is distributed via the FLUX::Center application; legacy installers for Intel Mac and 32/64-bit Windows remain available for older systems.
specs: |-
  - 14 native plug-ins: 7 reverbs + 7 effects
  - Reverbs: Chamber, Concert Hall, Hall, Plate, Random Hall, Room, Vintage Plate
  - Effects: Pitch Shift, Multivoice Pitch, Chorus, Resonant Chords, Random Delay, Dual Delay, Stringbox
  - Hundreds of studio presets
  - Real-time graphical display
  - Stereo and phase meters
  - Input, output, and feedback meters
  - Full parameter automation
  - DAW-independent preset format
  - iLok Manager authorization (local machine or USB)
  - Apple Silicon native support
  - 64-bit Windows support (Windows 10/11)
