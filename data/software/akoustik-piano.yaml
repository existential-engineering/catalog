details: |-
  Akoustik Piano includes three famous grand pianos that have been at the heart
  of countless classical concerts and recordings for many decades - the powerful
  and dynamic bsendorfer 290 imperial, the crystal-clear and versatile Steinway
  d, and the gentle bechstein d 280 with its subtle harmonic overtones. Also
  included is the steingraeber model 130, an acclaimed upright piano offering a
  warm, compact tone that can fit perfectly whenever a majestic concert grand
  sound is not the first choice.

  For inclusion into akoustik piano, each of the original instruments was
  carefully set up and recorded using a special recording technique that
  completely minimized room ambience, resulting in pristine and universally pure
  sound quality. All four instruments have been captured in 10 velocity levels,
  and with full sustain phases.

  Akoustik piano puts a strong focus on the accurate recreation of soundboard
  resonance for realistic playing behaviour. Special attention was given to the
  authentic implementation of the sustain, sustenuto and soft pedals, even
  including the effect of pressing the sustain pedal after a note has been
  struck.

  Expert settings allow for individual changes to the soundboard resonance
  characteristics, the key and pedal noise, and the position of the piano lid
  for each of the four instruments.

  Akoustik piano also includes realistic ambience on the basis of an integrated
  state-of-the-art convolution reverb, offering accurate sonic representations
  of a concert hall, recording studio, cathedral, and jazz club. Ambience
  characteristics can be fine-tuned in the expert section of the instrument,
  which also includes various controls for stereo positioning, tuning, and
  velocity response as well as versatile 3-band-equalizer.
specs: |-
  - 10 velocity levels
  - Full sustain phases
  - Soundboard resonance recreation
  - Sustain pedal
  - Sustenuto pedal
  - Soft pedal
  - Convolution reverb
  - 3-band equalizer
  - Stereo positioning controls
  - Tuning controls
  - Velocity response controls
