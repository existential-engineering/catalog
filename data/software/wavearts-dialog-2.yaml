description: Dialog 2 is a post-production plugin designed for speech and voice processing, combining multiple tools to clean up, adjust, and enhance voice recordings for voiceover, film/TV, and broadcast applications.
details: |-
  Dialog 2 provides a comprehensive suite of voice processing tools in a single plugin, including a 10-band parametric EQ with 11 filter types and 64-bit processing, plus low/high pass brickwall filters with variable rolloff slopes. Noise and interference removal tools include broadband noise reduction via the MR Noise algorithm, hum and buzz removal with notch filtering for 50/60 Hz harmonics, and a De-plode function for controlling plosives and wind rumble. Dynamics processing includes a vintage-style compressor (TrackPlug Vintage), a De-ess function for sibilant management, and a peak limiter — all fully automatable within the host DAW. Dialog 2 supports up to 192 kHz sample rates, operates in both mono and stereo, and includes comprehensive metering with latency compensation built in. The plugin is available in AU, VST3, and AAX formats on macOS (with Apple Silicon native support), and VST2, VST3, and AAX on Windows, supporting both 32-bit and 64-bit hosts on Windows.
specs: |-
  - 10-band parametric EQ with 11 filter types
  - 64-bit internal processing
  - Low/high pass brickwall filters with variable rolloff slopes
  - Hum and buzz removal (notch filtering for 50/60 Hz harmonics)
  - MR Noise broadband noise reduction algorithm
  - De-plode function for plosive/wind rumble control
  - De-ess function for sibilant management
  - TrackPlug Vintage compressor
  - Peak limiter
  - Comprehensive metering and latency compensation
  - Fully automatable parameters
  - Up to 192 kHz sample rate support
  - Mono and stereo operation
  - macOS: AU, VST3, AAX; requires macOS 10.13+ (High Sierra); Apple Silicon native
  - Windows: VST2, VST3, AAX; requires Windows 7/8/10/11; 32-bit and 64-bit hosts supported
  - AAX requires Pro Tools 11+ (Mac) or Pro Tools 10.3.5+ (Windows)
