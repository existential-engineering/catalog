description: Dialog combines in one plug-in all the processing needed to clean up, adjust, and sweeten recordings of the spoken voice. It suits voice-over, film/tv recordings on location or sound stage, and broadcast.
details: |-
  Dialog combines in one plug-in all the processing needed to clean up, adjust, and sweeten recordings of the spoken voice. It suits voice-over, film/tv recordings on location or sound stage, and broadcast.

  Dialog includes brickwall filters, de-hum and de-buzz processing, broadband noise reduction, de-ploding, de-essing, 10-band equalization, compression, and limiting. Separate presets for each section make results fast to reach.

  The brickwall filters have variable rolloff slopes and can cut off low or high frequency ranges. The de-hum processor uses notch filters to eliminate 10 harmonics of either 50 Hz or 60 Hz hum, and the de-buzz processor squelches line frequency buzzes. The de-noise processor is the MR Noise algorithm with a simplified interface. De-plode and de-ess are custom processors, de-plode to tame plosive sounds and de-ess to adjust the amount of sibilants.

  The EQ section is the TrackPlug equalizer, with 10 bands of equalization, 11 different filter types to choose from, and a variety of presets. The compressor is the TrackPlug Vintage compressor, with presets tailored to voice processing.
specs: |-
  - 10-band EQ section with 11 different filter types and 64-bit processing
  - Low and high pass brickwall filters with various rolloff slopes
  - Hum and buzz removal
  - Broadband noise reduction
  - De-plode function for plosive or wind rumble attenuation
  - De-ess function for sibilant attenuation
  - Compressor
  - Peak limiter
  - Comprehensive metering
  - Master preset manager and preset manager per section
  - Latency compensation
  - Fully automatable
  - Up to 192K support
  - Mono or stereo
  - Requires a host program that supports audio plug-ins
  - iLok licensing is supported but not required
  - Macintosh formats: AU, VST3, AAX
  - macOS 10.13 (High Sierra) and higher
  - Apple Silicon natively supported (AU, VST3, AAX)
  - AAX on macOS requires Pro Tools 11 and higher
  - macOS: 64-bit hosts only
  - Windows formats: VST2, VST3, AAX
  - Windows 7/8/10/11
  - AAX on Windows requires Pro Tools 10.3.5 and higher
  - Windows: 32-bit and 64-bit hosts supported
