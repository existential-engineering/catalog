description: "All-in-one plug-in for post production of speech and voice,
  combining brickwall filters, de-hum, de-buzz, broadband noise reduction,
  de-ploding, de-essing, 10-band equalization, compression, and limiting."
details: |-
  10-band EQ section with 11 different filter types and 64-bit processing. Low and high pass brickwall filters with various rolloff slopes. Hum and buzz removal. Broadband noise reduction. De-plode function for plosive or wind rumble attenuation. De-ess function for sibilant attenuation. Compressor. Peak limiter. Comprehensive metering. Master preset manager and preset manager per section. Latency compensation. Fully automatable. Up to 192K support. Mono or stereo.
specs: |-
  Mac: AU, VST3, AAX. macOS 10.13+, Apple Silicon native, 64-bit only. Windows: VST2, VST3, AAX. Windows 7/8/10/11, 32-bit and 64-bit. iLok supported but not required.
