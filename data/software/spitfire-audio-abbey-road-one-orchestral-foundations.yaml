details: |-
  Enter the room most composers can only dream of: Studio One at Abbey Road. Unparalleled and exclusive access to the world's most celebrated recording location for movie music — from Star Wars and Lord of the Rings , to Harry Potter and Avengers: Endgame — it doesn't get more iconic.

  In our first collaboration with Abbey Road Studios, we recorded a complete 90–piece symphonic orchestra the same way your favourite composer would: unmistakable acoustics, exceptional players, award-winning sound engineers and priceless microphones. Strings, brass and woodwinds are grouped into ensembles for instant playability, completed by an exciting cinematic percussion section, all housed in our award-winning dedicated plug-in.
specs: |-
  - 90-piece symphonic orchestra: strings, brass, woodwinds and percussion
  - Strings 16, 14, 12, 10, 8
  - Brass: four horns, four trumpets, three trombones, two bass trombones, one contrabass trombone, one tuba, one contrabass tuba
  - Woodwinds: piccolo, two flutes, two oboes, cor anglais, two clarinets, bass clarinet, two bassoons, contrabass bassoon
  - Percussion performed by three players
  - 69 articulations, up to 5 dynamic layers
  - Up to 10 individual mics and 2 mix signals
  - 10 mic signals: Vintage 1, Vintage 2, Pop Close, Pop Room, Close, Tree 1, Tree 2, Ambient, Outriggers, Spill
  - Ensembles: Full Ensemble, Drum Ensemble, Metals Ensemble
  - 69.60 GB disk space required during install
  - macOS 11 to OS 26, Intel and Apple Silicon supported
  - Windows 10 or 11 (64-bit)
  - Minimum 8GB RAM, 16GB recommended
  - Spitfire Audio App required for installation
