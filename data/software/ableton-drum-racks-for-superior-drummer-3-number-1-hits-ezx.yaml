details: >-
  Ableton drum racks for superior drummer 3 number 1 hits ezx features drum
  racks for all factory presets for the number 1 hits ezx expansion hosted in
  superior drummer 3. These racks are the most complete integration between
  ableton live and toontrack superior drummer 3 including a host of features
  ready to use on ableton push.


  8 ableton drum racks to instantly load the factory library "mix ready" presets
  with ableton mappings. 4 ableton live templates designed to host the multi
  channel output routing presets with track level audio routing from superior
  drummer 3 into ableton live.


  Colour coded pad design for visual performance and finger drumming. All racks
  use consistent drum rack colouring so you can visually and immediately spot
  your rides from your hi hat articulations. Vast array of instrument
  articulations ready to go in one massive layout using ableton push 64 pad
  layout mode.


  Singleout presets featuring 4 ableton drum racks for all factory presets
  single audio output to single ableton track. Multiout presets featuring 4
  ableton drum racks for all presets in multiple audio channel output from the
  plug in to multiple ableton audio tracks using the multi output ableton
  template also provided.


  Use the template racks and extend to your own number 1 hits ezx presets,
  swapping out individual sounds or articulations. You are 100% ready to go with
  the factory presets but there is no limitation to creating your own presets
  from these templates.
