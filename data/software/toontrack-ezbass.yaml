description: >-
  Bass software for songwriters featuring two sampled bass guitars, automatic
  bassline creation from drum or keyboard MIDI, a built-in grid editor, and
  audio to MIDI conversion.
details: |-
  EZbass features two carefully sampled bass guitars — one vintage Fender
  Jazz Bass and one modern Alembic — providing a broad tonal palette for
  any style of music.

  The software comes with bass MIDI for a broad range of styles. Users
  can also import drum or keyboard MIDI and have EZbass automatically
  create matching basslines, making it an intelligent composition tool.

  The built-in Grid Editor allows users to alter the performance or the
  subtler details of the MIDI. Audio to MIDI conversion based on the
  same technology found in Superior Drummer 3 enables users to convert
  existing bass recordings into editable MIDI data.

  EZbass includes a built-in effects chain for shaping tone directly
  within the plugin, with separate effect configurations for each bass
  guitar.
specs: |-
  - Two sampled bass guitars: Modern Bass (Alembic) and Vintage Bass (Fender Jazz Bass)
  - Bass MIDI for a broad range of styles
  - Automatic bassline creation from drum or keyboard MIDI
  - Built-in Grid Editor for MIDI editing
  - Audio to MIDI conversion
  - Built-in effects chain
  - 5 GB free hard disk space required
  - 4 GB RAM minimum, 8 GB+ recommended
  - Windows: 64-bit Windows 10 or newer
  - macOS: 10.13 or higher (Intel or Apple Silicon)
