details: |-
  Alpine Volksmusik 2 is the independent sequel to the popular alpine volksmusik
  library offering 42 unique patches for folk and brass music. The library
  covers all the instruments you need for the authentic production of swiss folk
  music, austrian stubenmusik and german marching music.

  All instruments were carefully recorded and offer different articulations that
  can be keyswitched to deliver authentic sounds. The interface of the library
  provides an easy way to customize the sound of the instruments. In addition to
  the standard controls volume, pan, and reverb, each instrument / patch has its
  own parameters.

  The swiss are represented by two schwyzerrgelis, the swiss version of the
  diatonic accordion. A five-course appenzell dulcimer, an alphorn ensemble and
  a bowed double bass complete the typical swiss instrumentation. Included
  instruments: accordion | alphorns | berner oergeli | clarinet swiss |
  contrabass swiss | dulcimer appenzeller | nussbaumer oergeli.

  Austria offers a collection of instruments for stubenmusik, probably the most
  original form of alpine folk music. Instruments like zither, guitar, harp and
  plucked double bass build the foundation. In addition, this group includes
  styrian harmonicas (steirische), an accordion, an ocarina and a recorder.
  Included instruments: accordion austria | alpine plattler | contrabass | harp
  | jew's harp | ocarina | recorder | rhythm guitar | steirische pix |
  steirische vintage | steirische reed 8' | steirische reed 8'8' | steirische
  reed 8'8'+ | steirische reed 8'8'8' | steirische reed 8'8'8'+ | zither.

  Folk music from germany is represented by marching music sounds. Wind and
  brass instruments like clarinet, trumpet, flugelhorn, tenor horn, tuba come as
  solo and ensemble versions. Drum and percussion instruments are available
  offering various articulations. Included instruments: bb tuba | bb tubas |
  clarinet ensemble | clarinet | clarinets | cornet | flugelhorn | flugelhorns |
  flute | flutes | glockenspiel | piccolo flute | percussion | tenorhorn |
  tenorhorns | trombone | trumpet | waldhorn.
