details: >-
  The definitive collection of the world's most famous compressors. The original
  universal audio 1176 was designed by ua founder m.t. "bill" putnam, and
  represented a major breakthrough in limiter technology. The first compressor
  featuring solidstate circuitry and ultra-fast 20 microsecond fet gain
  reduction, the 1176 is an easytouse "desert island" compressor that has lent
  its character and punch to some of the greatest recordings in history.


  Upon its release in 2001, ua's first 1176 plugin singlehandedly launched our
  uad platform. Extensive endtoend circuit modeling in 2013 captured even more
  sonic nuance. Now with updated graphics and additional controls, the 1176
  classic limiter collection continues its legacy of analog modeling excellence.


  Track and mix with painstaking emulations of the legendary 1176, the most
  popular compressor ever made. Choose from three famous versions: rev a, rev e,
  and ae each with their own sonic attributes. Harness the 1176's entire
  electronic path including transformers and fet and transistor amplifiers for
  colorful distortion.


  Access "all-button" or "no ratio" modes for colorful overdriven textures.
  Expanded controls for headroom, mix, and custom sidechain filter for reduced
  lf pumping.


  Mix with presets from legendary 1176 users such as andy johns, andrew scheps,
  ed cherney, and joe chiccarelli.
