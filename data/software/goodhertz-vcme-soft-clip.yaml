description: VCME Soft Clip is the standalone Soft Clip section extracted from
  Goodhertz's VCME compressor — part limiter, part saturator — combining
  analog-modeled saturation with a transient/steady-state-separating limiter to
  add presence and polish while preserving natural dynamics.
details: |-
  During the development of Vulf Compressor Mastering Edition, Goodhertz often found themselves wanting to use VCME's Soft Clipper by itself, or in a different position than the compressor. The Soft Clip was just too good to play second fiddle in VCME, so it got its own plugin: VCME Soft Clip.

  VCME Soft Clip is identical to the Soft Clip section in VCME, but it adds a powerful Saturation Emphasis section for enhanced sculpting and harmonic shaping. Because it is running alone, it also has lower latency and lower CPU usage than the full version of VCME.

  In addition to the Emphasis filter, VCME Soft Clip supports external sidechaining, allowing you to saturate an input signal based on the dynamics of another signal, a very interesting and unusual effect. VCME Soft Clip is included as a free add-on with any purchase of VCME, and is also available as a standalone purchase.

  VCME Soft Clip was created by examining and deconstructing several world-class analog mastering chains. Each of these chains featured different analog hardware, different A-to-D conversion, and different clipping and saturation characteristics. The Soft Clip Saturation module captures the analog part of the chain: tubes, transformers, transistors, etc. all color the signal with subtle saturation, harmonics, and when pushed hard enough, full-on analog clipping and distortion.

  The Soft Clip Limiter module captures the digital part: inspired by soft clipping A-to-D converters, it builds on this legacy but with a fundamentally new approach, separating transient and steady-state material to achieve punchier results with less distortion artifacts. Part limiter, part saturator, it is perfect for increasing loudness and presence while preserving a track's natural character and dynamics.
specs: |-
  - Identical to the Soft Clip section in VCME, available as its own plugin
  - Saturation Emphasis section for enhanced sculpting and harmonic shaping
  - Saturation module modeling the analog part of a mastering chain (tubes, transformers, transistors)
  - Limiter module inspired by soft clipping A-to-D converters, separating transient and steady-state material
  - External sidechain support for saturating one signal based on the dynamics of another
  - Lower latency and lower CPU usage than the full version of VCME
  - 2 pages of advanced controls
  - HQ Mode for a higher precision algorithm with better spectral resolution (adds approximately 50 ms latency)
  - 64-bit only; requires a 64-bit DAW and macOS 10.13+ or Windows 10+
  - Localized in English, Spanish, Portuguese, French, Italian, Korean, Japanese, and Chinese (Simplified and Traditional)
