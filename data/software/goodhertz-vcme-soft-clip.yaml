description: VCME Soft Clip is the standalone Soft Clip section extracted from Goodhertz's VCME compressor — part limiter, part saturator — combining analog-modeled saturation with a transient/steady-state-separating limiter to add presence and polish while preserving natural dynamics.
details: |-
  VCME Soft Clip is a focused plugin that isolates the Soft Clip section from Goodhertz's flagship VCME compressor, adding a dedicated Saturation Emphasis section for deeper harmonic sculpting. It offers lower latency and lower CPU usage than the full VCME, making it practical for use on individual tracks as well as mix buses and mastering chains.

  The saturation module models analog processing chains — tubes, transformers, and transistors — through four distinct character modes: Chino (hi-fi, classic tube), Rødovre (round, smooth), Detroit (grungy, warm, bass-forward), and Melbourn (punchy, British transformer character). Drive, Slew, and Mix controls give fine-grained command over how much and how fast the saturation responds.

  The limiter module draws inspiration from soft-clipping A-to-D converters, separating transient and steady-state material to achieve punchier, more controlled results without squashing transients. A brickwall mode is available alongside a follow-mix option.

  The Saturation Emphasis section provides an advanced internal or external sidechain filter — with tilt, low/high shelf, resonance, and blend controls — allowing precise shaping of which frequencies drive the saturation and by how much.
specs: |-
  - macOS 10.13 or later (AU, VST, VST3, AAX 64-bit)
  - Windows 10 or later (VST, VST3, AAX 64-bit)
  - Saturation modes: Chino, Rodøvre, Detroit, Melbourn
  - Saturation Emphasis section with internal/external sidechain filter
  - Limiter with transient/steady-state separation; brickwall and follow-mix modes
  - HQ Mode: ~50ms added latency, 2-4x CPU increase
  - Supports mono through 9.1.6 surround channel configurations
  - External sidechain support
  - Lower latency and lower CPU than full VCME
