description: A unique multi-band subharmonics generator and shaper that gives
  punch to your low-end.
details: |-
  RootOne is a multi-band subharmonics generator and shaper that allows users to add and shape 3 bands of subharmonic content for the perfect tonal balance. It is designed to help mix engineers match bass levels across tracks or increase overall low-end presence.

  The plugin uses an analysis-synthesis algorithm that generates clean, phase-aligned subharmonics without artifacts. This pitch-detection method offers wider applications than traditional pitch-shifting solutions.

  Each subharmonic band provides controls for dynamics, release, and drive settings, enabling users to add lower midrange harmonics for precise control. The interface features a beautiful Retina design with the most common controls on one screen and additional fine-tuning options accessible with one click.

  RootOne supports Mac OSX 10.13+ with M1-Native support and Windows 8/10 (64-bit only). It is available in AAX-Native, VST3, and AU plugin formats.
specs: |-
  - 3 bands of subharmonic content generation
  - Analysis-synthesis algorithm for clean, phase-aligned subharmonics
  - Pitch-detection technology (not pitch-shifting)
  - Per-band controls: dynamics, release, drive
  - Retina-optimized interface
  - Mac OSX 10.13+ (M1-Native support)
  - Windows 8/10 (64-bit only)
