description: The mother of all distorted sounds. It doesn't get more classic than this.
details: |-
  TUBE Overdrive is Softube's take on the warm drive that shaped classic guitar tone, billed on the product page as the mother of all distorted sounds.

  It delivers a smooth, mid-focused overdrive that cuts through any mix, and is described as a faithful emulation of a legendary analog drive circuit.

  The plug-in can be used inside Flow Mixing Suite, inside Amp Room, or on its own as a standalone plug-in.
