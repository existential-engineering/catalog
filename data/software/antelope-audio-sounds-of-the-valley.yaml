description: Find three analog-modeled plugins in Sounds of the Valley FX Bundle
  – available for Antelope Audio Synergy Core interfaces.
details: |-
  The latest additions to the Synergy Core library are now bundled together in a dynamic trio that will make your hair stand on end. The manufacturer that created the hardware originals these effects were modeled after is said to be "one of the most best kept secrets in the signal processing world". Try the effects out for yourself with the Sounds of the Valley FX bundle.

  VP Gate Keeper II (VCA Gate / Expander) — The VP Gate Keeper II embodies fast response, clean sound & unparalleled musicality. This unique parametric gate will let you synthesize urgency, excitement, and punch from dull and lifeless recordings.

  VP BRAINIAC II (VCA Compressor) — The effect models the original's heavy transient-grabbing abilities of aggressive limiters. It remains musical and undetectable due to its unique proprietary gain reduction element.

  VP Drum-all-nite (VCA Dynamics Processor) — This aggressive drum compressor is capable of absurd amounts of gain reduction while maintaining the signal's integrity with minimal distortion and unwanted artifacts.

  Runs natively in your DAW on macOS or Windows, or in real-time on Antelope Audio Synergy Core interfaces.
specs: |-
  - Synergy Core Effects Bundle
  - Realtime & Native operation
  - Runs natively in DAWs on macOS/Windows
  - Runs in real-time on Antelope Audio Synergy Core interfaces
  - Includes VP Gate Keeper II (VCA Gate / Expander)
  - Includes VP BRAINIAC II (VCA Compressor)
