description: >-
  Valhalla Super Massive is a free reverb and delay plugin offering 21 unique
  modes ranging from short ambiences to massive, evolving soundscapes. Its
  simple interface belies deep sound design potential for creating lush reverbs,
  infinite echoes, and otherworldly feedback effects.
details: |-
  Valhalla Super Massive provides 21 distinct reverb and delay algorithms,
  each with a different character ranging from short, tight spaces to
  massive, sprawling environments that build and evolve over time.

  The algorithms are organized into families: Gemini, Hydra, Centaurus,
  Sagittarius, Great Annihilator, and more — each named after
  astronomical objects reflecting their cosmic scale. Some modes
  emphasize reverb-like behavior, others lean toward delay, and many
  occupy a unique space between the two.

  Despite the depth of its algorithms, the interface remains
  deliberately simple. Mix, Width, Delay, Feedback, Density, and Warp
  controls provide immediate access to the most impactful parameters.
  Modulation Rate and Depth add movement and life to the output.

  The Warp control is particularly powerful — it introduces pitch
  shifting, frequency shifting, or other transformations into the
  feedback path, enabling sounds that build, degrade, and evolve in
  complex ways. Combined with high feedback settings, Warp creates
  self-generating textures ideal for ambient, drone, and experimental
  music.

  Super Massive is entirely free with no limitations, registration
  requirements, or feature restrictions. It represents Valhalla DSP's
  commitment to accessible, high-quality audio tools.
specs: |-
  - 21 reverb and delay modes
  - Mix, Width, Delay, Feedback controls
  - Density and Warp parameters
  - Modulation Rate and Depth
  - Pitch and frequency shifting in feedback path
  - Self-generating ambient textures at high feedback
  - Low CPU usage
  - Resizable interface
  - Free (no registration required)
