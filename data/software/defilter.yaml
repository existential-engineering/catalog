description: DeFilter is an efficient tool to even out tonal imbalances in a mix
  or reduce resonant peaks or dips in the frequency spectrum. Even severe
details: |-
  Defilter can match recordings to target profiles such as music or speech, or
  alternatively extract the overall timbre from the source while evening out
  narrow peaks and dips. The latter removes resonances and comb filter effects
  effectively while preserving the tonal character of the input signal.

  Frequency dependent correction levels can be defined using custom curves, so
  that defilter can focus on problematic frequency ranges while leaving other
  frequency regions untouched. Realtime spectrum analyzers for both the input
  and output signals visualize the effect on the frequency spectrum.

  Acon digital defilter is available for both windows (pc) and os x (macintosh).
  Both 32 and 64-bit versions are available, and the plug-in formats VST, AAX
  and audio units (os x only) are supported.

  Use cases: fix issues in a mix prior to mastering. Reduce resonances caused by
  untreated room acoustics. Matched equalization (automatic equalization based
  on a reference signal). Improve clarity and intelligibility of speech. Instant
  fix for nasty comb filter effects.
