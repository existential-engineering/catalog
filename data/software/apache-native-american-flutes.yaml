details: |-
  Apache is a sampled flute instrument. Each flute is from the chippewa natives
  of central michigan, usa. Containing 4 different native american flutes in
  total, we then get 4 totally different tones. By blending the 4 flute tones
  together, we bring you some unique flute combinations.

  With apache's light & easy-to-use interface, you will have no problems finding
  a preset or creating your own sounds altogether. With streamlining your
  productions in mind, we kept everything, well, simple. Minimal fx allows you
  to use the fx you're already familiar with, quickly have full control over
  each flute & easily browse presets.

  The interface has 3 main sections: top: fx in-depth adjustments + preset
  browser where you will find all of your fx parameters + your preset browser.
  Middle: banjo/sampler adjustments which contains the sampler engines for your
  flute instruments. Bottom: fx quick adjustments linked to the fx with the same
  name in top section, these are an even faster way to add fx & get an idea of
  your sound.

  Apache is a lightweight that hits like a heavyweight. It uses minimal cpu but
  still packs a big punch. With a quick, easy & painless install, you will be
  creating something fresh in no time.

  Download includes: windows 10+ - vst3 (64-bit). Mac mojave 10.14+ - vst3 & AU
  (64-bit). Easy install guide. 10 factory flute presets. Compatible with all
  daws (excluding pro-tools).
