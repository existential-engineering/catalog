description: "The Cali Reverb Modern High Gain Amplifier plugin is modeled on
  Mesa Boogie Rectoverb* 50 watt head. Two completely independent channels with
  separate controls: WATCH VIDEO FILTERS Tight : reduces low frequency content
  tightening the low range Rumbling: reduces the low-frequency content Harsh:
  reduces the high-frequency content NOISE GATE Threshold: defines the level
  where the gate is activated Range: selects the quantity of noise reduction
  Gate : Adjust the gate speed CABINETS With Cali Reverb Modern High Gain
  Amplifier is possible to choose between eight different guitar cabinets, four
  microphone emulations with on/off axis position switch, continuous position
  and distance knobs."
details: |-
  Two completely independent channels with separate controls: WATCH VIDEO FILTERS Tight : reduces low frequency content tightening the low range Rumbling: reduces the low-frequency content Harsh: reduces the high-frequency content NOISE GATE Threshold: defines the level where the gate is activated Range: selects the quantity of noise reduction Gate : Adjust the gate speed CABINETS With Cali Reverb Modern High Gain Amplifier is possible to choose between eight different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs. A complete Mixer section with Solos , Mutes , Pans and Faders allows you to blend together the two microphones with the ambience.
