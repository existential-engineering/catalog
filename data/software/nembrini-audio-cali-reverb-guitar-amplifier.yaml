description: "The Cali Reverb Modern High Gain Amplifier plugin is modeled on Mesa Boogie Rectoverb* 50 watt head. Two completely independent channels with separate controls: WATCH VIDEO FILTERS Tight : reduces low frequency content tightening the low range Rumbling: reduces the low-frequency content Harsh: reduces the high-frequency content NOISE GATE Threshold: defines the level where the gate is activated Range: selects the quantity of noise reduction Gate : Adjust the gate speed CABINETS With Cali Reverb Modern High Gain Amplifier is possible to choose between eight different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs."
details:
  - Cali Reverb models the iconic Mesa Boogie Rectoverb 50-watt head, delivering two completely independent channels with separate controls. Channel 1 offers Clean and Pushed modes for clear tones and mid-gain flavors, while Channel 2 provides Raw (crunch/blues), Vintage (liquid warm high-gain), and Modern (aggressive heavy) modes.
  - The amplifier section includes flexible filtering with Tight, Rumbling, and Harsh options, plus a fully featured Noise Gate with Threshold, Range, and Gate Speed controls for precise noise management in high-gain settings.
  - Eight guitar cabinet simulations are included, each with four microphone emulations, on/off-axis positioning, and adjustable microphone distance for detailed tonal shaping. An Impulse Response Loader supports up to three third-party IR files simultaneously, with a dedicated browser for IR file management.
  - The mixer section offers solo, mute, pan, and fader controls for blending the cabinet and IR signals. Free impulse responses are included via a partnership with Choptones.
  - Available for Mac (10.13+) and Windows 7+ as VST2, VST3, AAX, and Audio Units formats, and on iOS as a standalone app for iPhone and iPad via the Apple App Store. Requires a 64-bit DAW and Intel-compatible or Apple Silicon CPU.
