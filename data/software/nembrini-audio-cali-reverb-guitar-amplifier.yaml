description: The Cali Reverb Modern High Gain Amplifier plugin is modeled on the
  Mesa Boogie Rectoverb 50 watt head, with two completely independent channels,
  Tight, Rumbling and Harsh filters and a noise gate. Eight guitar cabinets and
  four microphone emulations offer on/off axis position switching with
  continuous position and distance knobs.
details: |-
  The Cali Reverb Modern High Gain Amplifier plugin is modeled on Mesa Boogie Rectoverb* 50 watt head.

  Two completely independent channels with separate controls. Channel 1 has 2 modes: Clean for tight and sparkling clear tones and Pushed for spicy mid-gain flavour. Channel 2 has the classic recto modes: Raw for crunch and blues tones, Vintage for liquid and warmth high-gain sounds and Modern for heaviest and super aggressive sounds.

  Filters include Tight, which reduces low frequency content tightening the low range, Rumbling, which reduces the low-frequency content, and Harsh, which reduces the high-frequency content. The Noise Gate offers Threshold to define the level where the gate is activated, Range to select the quantity of noise reduction, and Gate to adjust the gate speed.

  With Cali Reverb Modern High Gain Amplifier it is possible to choose between eight different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs. A complete Mixer section with Solos, Mutes, Pans and Faders allows you to blend together the two microphones with the ambience.

  The Impulse Loader lets you load up to three third-party impulse responses that you can even blend together using volume, pan, phase, solo and mute controls, and a useful browser window has been added so you can easily search through all your third-party IR files.

  Legal Disclaimer: Mesa Boogie Rectoverb is a registered trademark of Gibson Brands Inc. Nembrini Audio Cali Reverb Modern High Gain was developed by Nembrini Audio SRL based on its own modelling techniques. Gibson Brands Inc has not endorsed nor sponsored the Nembrini Audio Cali Reverb Modern High Gain in any manner, nor licensed any intellectual property for use in this product.
specs: |-
  - Modeled on the Mesa Boogie Rectoverb 50 watt head
  - Two completely independent channels with separate controls
  - Channel 1 modes: Clean and Pushed
  - Channel 2 recto modes: Raw, Vintage and Modern
  - Filters: Tight, Rumbling, Harsh
  - Noise gate with Threshold, Range and Gate speed controls
  - Eight guitar cabinets with four microphone emulations, on/off axis switch, position and distance knobs
  - Mixer section with solos, mutes, pans, faders and ambience blending
  - Impulse response loader for up to three third-party IRs, with browser window for IR files
  - Free impulse responses included
  - Requires a VST2, VST3, AAX or AudioUnits compatible host
  - iOS version for iPhone and iPad
  - Intel compatible or Apple Silicon CPU, 1GB RAM
  - Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
