details: |-
  Zoe 2 (successor of zoe) is slot driven drum sampler and drums groove
  arranger. It brings up some of the most desired features that modern
  production technology has to offer. Now, with some brand new features, better
  live control user's both mp3 and wav. Format support, faster workflow.

  Zoe 2 uses 10 (.wav, mp3) file sample slots to build 10 drum components
  drum-kits. According to this approach, every slot can be anything, from kicks
  to snares or cymbals or you name it. Each slot is triggered by its own unique
  MIDI note which noted on its slot button. For instance, slot 48 is triggered
  by note number 48 in the MIDI keyboard (c2). The samples menu is divided into
  13 categories, including a wide range of drum-kit components types.

  Zoe 2 is armed with brand new morphing system which can blend any 2 drum
  elements together (which can create tons of new fresh drum sounds). The morph
  system can also play with the blended element's pitch and increase the
  invention of new drum sounds like never before.

  Zoe has a built-in mixer that allows you to tweak any sample separately. You
  can use the eq, change the pitch, add a random pitch manipulation to every
  sample, pan and or add phase, drift, magnitude control, saturation, phase
  effect, delay or some interesting coloring by using our zelda filer.

  Zoe 2 is not only a great sampler but also an arranger styles MIDI sequencer.
  It uses the arranger keyboards style sequencer method to run 8 simultaneous
  MIDI grooves per style that can be switched instantly with a MIDI keyboard.
  Each variation gets its own MIDI key number and the transitions are synced to
  the determined tempo. Zoe can also add an automatic cymbal crash on end points
  and use self or synced tempo.
specs: |-
  - 10 drum sample slots per kit

  - 10 virtual drum-pads

  - 14 drum element banks with 30 drum-kits

  - Drum elements morphing system

  - Automation file manager

  - 4 additional wav pages for user files

  - MIDI assignable start/end points manager

  - Master effect macro knobs

  - Graphical MIDI keyboard with assignable keyboard starting points

  - Full virtual mixer with gain knobs, master effect send knobs, phase, drift,
  magnitude control, saturation, pitch knobs, random pitch manager knobs, round
  robin and pan knobs

  - Master compressor, delay and reverb effects with f.r. Feature

  - 64 steps arranger style arpeggiator with 8 variations per style

  - Unique time signature per variation

  - MIDI keyboard controllable variation switch

  - Crash every selected end point

  - Cymbal crash manager

  - Unique or synced tempo

  - MIDI route options (internal or sent to DAW through MIDI channels)

  - Stereo or 10 separate outputs to DAW (1 per drum element)

  - Scalable and customizable gui

  - VST plugin format

  - Windows compatible

  - Mp3 and wav format support

  - Phaser effect

  - Delay effect

  - Zelda filter

  - Eq per sample

  - Pitch control per sample

  - Random pitch manipulation

  - Pan control

  - Phase effect

  - Saturation effect
