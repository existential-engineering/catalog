description: A 3-band overdrive and amp simulator inspired by the SansAmp Bass Driver DI, featuring parametric crossovers to sculpt bass guitar tone with cabinet emulations, a graphic equalizer, and a Bass Enhancer circuit.
details: |-
  - Bass Driver is a multiband overdrive and bass amplifier plugin modelled on the classic SansAmp Bass Driver DI, delivering the warmth and character of that iconic circuit inside your DAW.
  - The plugin features a 3-band overdrive engine with parametric crossovers, allowing you to apply overdrive selectively across the frequency spectrum for a modern, balanced bass tone with texture and punch.
  - A 9-band graphic equalizer with proportional Q and parametric tone equalization with Presence control for upper harmonic content give you extensive tonal shaping options beyond the core drive circuit.
  - Four selected bass guitar cabinet emulations paired with four microphone models provide speaker simulation, while an Impulse Response loader lets you load up to two third-party IRs for further customization.
  - A parallel D.I. signal path with a console-style compressor blendable with ambient reverb, a Bass Enhancer circuit inspired by the Little Labs Voice of God, and a noise gate round out the feature set.
specs: |-
  - Overdrive section modelled on SansAmp Bass Driver DI
  - 3-band overdrive featuring parametric crossovers
  - Parametric tone equalization and Presence for upper harmonic content
  - 9-band graphic equalizer with proportional Q
  - 4 selected bass guitar cabinets and 4 microphone emulations, plus a parallel D.I. signal
  - Console-style compressor blendable with ambient reverb
  - Impulse Response loader supports up to two third-party impulse responses
  - Bass Enhancer circuit inspired by Little Labs Voice Of God
  - Noise gate included
  - Intel-compatible or Apple Silicon CPU
  - 1 GB RAM minimum
  - Mac OS 10.13 or newer
  - Windows 7 or newer
  - 64-bit DAW required
