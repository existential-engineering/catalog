description: DF-COMP 2 is a compressor with 10 dedicated modes tuned for specific sources, from Kick, Snare, Toms, Overheads, Rooms, and Drum Bus through Vocals, Guitar, Bass, and Master Bus, each offering Soft, Medium, and Hard compression styles.
details: |-
  DF-COMP 2 expands on its predecessor with dedicated compression modes tailored to specific instruments. The Drums modes cover Kick, Snare, Toms, Overheads, Rooms, and Drum Bus to enhance punch and control transients. Vocals mode provides consistency while keeping natural dynamics and clarity, Guitar mode adds sustain while preserving attack, Bass mode keeps low end intact, and Master Bus mode adds cohesion, glue, and warmth to a whole mix.

  Each mode offers three compression styles. Soft is gentle and transparent with smooth attack and release, Medium balances dynamic shaping against a natural sound, and Hard is aggressive, enhancing punch and tightening transients. This removes the need to tweak attack, release, ratio, and knee by hand.

  Sidechain capability is built in. The sidechain controls shape which frequencies trigger compression, and external sidechain support gives precise control over the relationship between elements, which matters most for creating space and definition in dense arrangements.

  A Mix knob provides parallel compression by blending dry and compressed signals. CPU usage is low enough to run multiple instances with minimal impact on system performance, and the interface presents the essential controls in one clean layout.
specs: |-
  - 10 dedicated compression modes: Kick, Snare, Toms, Overheads, Rooms, Drum Bus, Vocals, Guitar, Bass, Master Bus
  - 3 compression styles per mode: Soft, Medium, Hard
  - Advanced sidechain controls: shape trigger frequencies or use an external source
  - Parallel compression via the Mix knob
  - Low CPU usage for running multiple instances
  - Streamlined user interface
