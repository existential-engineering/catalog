description: A versatile compression plugin with 10 dedicated modes optimized for kick, snare, toms, overheads, rooms, drum bus, vocals, guitar, bass, and master bus — each with Soft, Medium, and Hard compression styles for intuitive dynamic shaping without manual parameter tweaking.
details: |-
  DF-COMP 2 expands beyond its predecessor with ten dedicated compression modes, each tailored for specific instruments. The Drums modes include specialized settings for Kick, Snare, Toms, Overheads, Rooms, and Drum Bus to enhance punch and control transients. The Vocals mode provides consistency while maintaining natural dynamics and clarity. Guitar mode adds sustain while preserving attack, Bass mode keeps low-end intact, and the Master Bus mode adds cohesion, glue, and warmth to your entire mix with subtle but powerful compression.

  DF-COMP 2 simplifies compression by offering three distinct styles for each mode. Soft provides gentle, transparent compression with smooth attack and release settings. Medium offers balanced compression that shapes dynamics while maintaining a natural sound. Hard delivers aggressive compression that enhances punch and tightens transients. This approach eliminates the need for manual tweaking of attack, release, ratio, and knee parameters.

  DF-COMP 2 includes advanced sidechain capabilities that enhance mix balance and clarity. External sidechain support provides precise control over the relationship between different elements in your mix, essential for creating space and definition in dense arrangements.

  With a user interface designed to keep you in your creative flow, DF-COMP 2 improves workflow efficiency, making compression adjustments faster and more accessible. The clean layout presents all essential controls in a logical arrangement.
specs: |-
