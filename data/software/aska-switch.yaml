details: >-
  Aska switch by wantech is a virtual instrument audio plugin for windows. It
  functions as a VST plugin.


  Features 2 oscillators with sine/square/saw/triangle waveforms,
  drag/portamento control, low/high/band pass filter, and adsr envelope.


  Filter section includes cutoff, resonance, and envelope amount controls.
