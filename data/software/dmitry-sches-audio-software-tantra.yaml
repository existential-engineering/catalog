description: "Tantra is a rhythmic multi-effect plug-in with a rich feature set
  and high quality processing modules. With Tantra you can get any kind of sound
  and turn it into a complex rhythmic progression, with lots of movements among
  the deep produced sound space."
details: |-
  2.01

  64-bit

  8 multi-mode modulators generating 32-step multi-stage envelopes

  6 high quality effects: analog filter, distortion, lo-fi, delay, flanger, glitch/stutter

  Two independent effect layers for complex audio rhythms

  Master equalizer and reverb at output

  Rhythmic multi-effect processing
  32-step multi-stage envelopes
  Dual independent layers
  Glitch/stutter effect
