description: A spring reverb plugin modeled after a modified Benson Tall Bird
  unit with a longer three-spring tank, producing a smooth and rich haunting
  reverb. Modeling two separate reverb tanks allows reverb to be applied in
  stereo.
details: |-
  In desperate need of reverb in a mix, Chris connected his personal Tall Bird unit to his console and modified it by adding a longer three spring tank. He then realized while the stock tank sounded great on guitar, the added long tank coupled with the drive circuitry from the Tall Bird was suitable for practically everything else creating a smooth and rich haunting reverb to the source. After many refinements and adding an EQ, the Studio Tall Bird was born. Accurately modeled by using proprietary convolution response techniques to closely match how the two short and long spring tanks respond to a signal, specifically in regards to the clipping and distortion characteristics of the original unit. By modeling two sets of separate reverb tanks, we were able to create a versatile tool for mixing by allowing reverb to be applied in stereo. We present, MixWave: Benson Studio Tall Bird .
