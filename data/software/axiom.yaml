description: Blue cat's Axiom is a powerful and open multi effects processor and
  amp simulation software for guitar and bass.
details: |-
  You can choose your amp models from hundreds of presets or launch the amp
  editor to build your own, with complete control over the tone. Additional
  input and master sections let you adjust the tone at the input and the output
  of axiom, with 4 additional effect slots each and an integrated high precision
  tuner. A brickwall limiter also protects the output from overshoot.

  Axiom includes 40 built-in effects that can be loaded in any of the 32 plug-in
  slots, including a built-in version of late replies for creative delays and
  reverbs, and a built-in version of destructor to add your own distortion
  pedals, cabinets or additional amp simulations.

  Blue cat's axiom is not limited to its built-in effects: these slots can also
  host third party audio unit, VST or vst3 plug-ins: you can use your favorite
  plug-ins anywhere in the signal chain and expand axiom's capabilities. And
  because playing alone is not so much fun, we have added a tools section with 3
  additional slots to load virtual instruments: add a metronome, a drum machine,
  sequencer or your keyboardist's favorite synthesizer there to get it mixed
  with your guitar.

  Axiom is one of those rare tools that presents a great tip of the iceberg, and
  then continues to present greatness as you dive under the surface. To get
  started, there are six slots for pre amp effects, an amp slot with 22 amps to
  choose from, and six slots for post effects, with preset load/save for both
  pre and post choices, as well as a preset selector for axiom itself.
