details: |-
  Aurora Ambient Chords is a groundbreaking virtual instrument meticulously
  designed for drum and bass, jungle, ambient, new age, and liquid drum and bass
  music production.

  With 100 entirely original chords, custom-made chord pads, a precise adsr
  amplitude envelope, and four versatile effects at your fingertips, this plugin
  empowers you to unlock limitless creative possibilities.

  Whether you're crafting heart-pounding anthems, immersive soundscapes, or
  smooth liquid drum and bass tracks, the plugin effortlessly enhances your
  sonic palette.

  Its intuitive interface ensures a seamless integration into your workflow,
  allowing you to focus on making music.

  Each chord pad is labeled for proper musical integration, and the plugin
  features low-cpu usage for efficient performance.
specs: |-
  - 100 ambient chord pads
  - ADSR amplitude envelope
  - Multi-LFO
  - Distortion effect
  - Chorus effect
  - Delay effect
  - Reverb effect
  - Lowpass/highpass filter
  - Low-CPU usage
  - Amplitude range controls
  - 3 voice modes: polyphonic, monophonic, and legato
  - Universal 2 binary
