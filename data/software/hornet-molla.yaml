description: HoRNet Molla is a free spring reverb that emulates the complexity of the physical interactions taking place between the spring and the sound
details: |-
  The HoRNet Molla (/'mɔlːa/, the Italian word for spring) is a free spring reverb plugin designed to offer a unique and vintage reverb character while maintaining simplicity and performance. Though small in footprint and price (it is completely free) it inherits a powerful legacy. Molla uses the same advanced algorithm found in its larger counterpart, the HoRNet SpringVerb, to replicate the complex physical behavior of real spring reverbs. This means that even in a lightweight and minimal interface, you're accessing the depth and nuance of a full spring reverb engine.

  In a spring reverb, reverberation is produced by sending an audio signal through one or more physical springs under tension. The mechanical oscillations of the springs, triggered by the input sound, bounce back and forth, gradually decaying. These oscillations are then picked up by transducers and converted back into an electrical signal. The resulting sound has a distinct metallic, slightly gritty quality that became iconic in vintage guitar amps, organs, and later in psychedelic, dub, surf rock, and even modern indie music.

  With the development of Molla, the goal was to capture this unique sound and present it in a user-friendly, efficient format without losing the authenticity and musicality that define spring reverbs. The approach is inspired by SpringVerb, but adapted for users who need a streamlined, accessible tool for quick creative results. In Molla, you'll find the attitude, color, and behavior of a real spring reverb packed into a compact plugin that's ideal for both beginners and experienced producers.

  Molla includes a carefully selected set of parameters that give you full control over the sound without overcomplicating your workflow. The intrinsic vibration time lets you shape the decay of the spring, going from short, snappy reverbs that add subtle body, to long, cavernous tails. The Density control is one of the plugin's most expressive features: at 100% the reverb mimics a more natural, smooth decay, closer to a traditional room or hall simulation, while reducing it toward 0% takes on a more metallic, brittle and lo-fi character that emphasizes the resonant artifacts of the springs. A wet/dry blend control is also included, allowing you to precisely mix the original signal with the reverberated one for parallel processing or a subtle touch of ambiance.

  From a technical perspective, Molla is light on CPU, easy to install, and compatible with all major DAWs in both Windows and macOS environments. When audio is sent into the plugin, a virtual spring lights up in response, giving a visual cue of when and how the reverb is being triggered. It's a great choice not only for producers and engineers looking for a quick vintage vibe, but also for musicians, beatmakers, or content creators who need reliable and musical reverb without overthinking settings.
specs: |-
  - Physically modeled spring behavior
  - One spring model
  - Lenght of reverb time adjustable
  - Custom reverb density for special reverb sounds
  - Dry / Wet mix knob
  - Resizable interface, hardware accelerated
  - Apple Silicon native support (except for AAX)
  - macOS (10.11 and later) and Windows (Vista and later) support
  - 64-bit on Mac and Windows
  - Audio Units, VST, VST3 and AAX format
  - No copy protection
