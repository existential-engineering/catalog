details: |-
  Krush2 is a bitcrusher plugin combining bit-depth reduction, sample-rate reduction, filtering, and compression. Use it subtly to add texture and density, or push it to extremes for aggressive lo-fi destruction.

  Its bit crushing and downsampling algorithms are complemented by a warm drive stage, analog-modeled resonant filters, and a modulation section with two stereo LFOs.

  The result is a wide sonic palette, from dirty digital effects to crunchy modulated colours, with all the classic and more unusual bitcrusher sounds in between.

  Krush2 is a rebuilt version of the original Krush, with reworked parameter handling, smoother parameter automation, and a range of new features. Krush2 installs as a separate plugin and does not replace the original Krush, and existing projects are fully unaffected. Krush2 automatically detects the original Krush user presets and offers to import them.

  The demo is fully functional, but the audio fades out occasionally. A KrushPro licence unlocks Krush2 automatically, or a Krush2 licence can be purchased separately.
specs: |-
  - Crunchy drive stage
  - Bit depth reduction
  - Sample rate reduction
  - Analog modeled resonant filters
  - Stereo modulation section
  - Built-in compressor
  - Resizable, high-resolution interface
  - Two LFOs instead of one
  - Stereo modulation with adjustable L/R phase offset
  - LFO rate up to 20 Hz
  - New sawtooth LFO waveforms
  - Comb and band-pass filters
  - Filter position switch (pre/post)
  - One-knob compressor with Phat mode
  - Drive character control
  - Downsampling jitter control
  - Bitcrushing dither control
  - Improved drive sound with up to 8x oversampling
  - Animated modulation feedback on knobs
  - Customisable colour theme
  - Imports user presets from the original Krush
  - Windows 10/11, and a VST3 host or Pro Tools
  - macOS 10.15 or later (Intel and ARM), and an Audio Units host, VST3 host, or Pro Tools
