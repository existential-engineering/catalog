details: |-
  Custom Strings. Incredible Sounds

  We partnered with our master luthier and designed an instrument from scratch looking for new sounds, new timbres, new possibilities of sonic fulfillment, and we created Circle Strings. Circle Strings is a peculiar instrument that can produce sound in every possible way – bowing the strings, plucking the strings, hitting the instrument, etc. Anything is possible; the secret is in the resonance of its sympathetic box. Everything started when we decided that looking for new sounds was the way to go. We called our master luthier and designed an instrument with experimentation in mind. After months of tryouts, it was ready – and, since it had never been done before, we decided to capture its sounds from any possible angle and microphone in mind. Contact mics, overheads, close mics, but also shotguns, dynamics, below mics and even inside mics.
