  switched on or off."
details: |-
  The VEQ HA32C was inspired by one of the richest and most characteristic-sounding four-band channel EQ modules. Incredibly versatile, it can treat everything — including vocals, bass & electric guitars, and drums.

  The EQ smooths out the high-end while keeping the mids vivid and the lows thick and solid. It features four parametric bands, each of them coming with a Gain and Frequency control knob. The Low and High bands can be switched to shelving modes, and the EQ features High- and Low-Pass filters that can be switched on or off.
