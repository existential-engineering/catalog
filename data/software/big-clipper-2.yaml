details: |-
  Big clipper gives you the tools to hone in your distortion to give it just the
  right flavor of harmonics. From a soft, warm overdrive to crushing, bitey
  clipping, big clipper does it all and lets you easily dial it in.

  Big clipper gives you two stages of distortion with wildly different flavors
  and lets you mix and match them to get just the right flavor.

  The innovative heft control lets you achieve a much more natural and warm
  distortion, giving gentle distortion with smooth, tight dynamics. It
  essentially makes distortion that sounds good on everything.

  Sometimes you just need a simplified set of controls when you don't need
  anything super fancy. Little clipper is included with you purchase of big
  clipper so you can use whichever tool is right for the job.

  Distortion is one of the most powerful tools in an engineer's toolbox. When
  used subtly, it can enhance even the cleanest acoustic instruments. When used
  with a heavy hand, it can increase aggression and loudness.
