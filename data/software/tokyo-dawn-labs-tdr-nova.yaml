description: "A parallel dynamic equalizer combining parametric EQ layout with
  full dynamics processing on each band. Features WYSIWYG drag-and-drop display
  with classic knob controls, spectrum analyzer, and equal loudness functions."
details: |-
  Version 2.2.2. Four dynamic EQ bands with high-pass and low-pass filters. Parametric equalization, dynamic EQ, frequency-selective compression, multi-band compression, and wideband compression capabilities. Built-in spectrum analyzer. Preset manager, undo/redo, A/B comparison, copy/paste functionality. Band solo feature. Resizable plugin window with three UI scales. External sidechain support.
specs: |-
  Windows 7 or above. Mac OS X 10.9 or above. OpenGL support required. Windows 32-bit and 64-bit: VST2, VST3, AAX. Mac 32-bit and 64-bit: VST2, VST3, AU, AAX.
