description: Give your production the necessary oomph with this bone rattler of a Beatmaker. BERSERK will energize anything from dubstep to movie scores.
details: |-
  BERSERK is built for aggressive beats. Whether it's dubstep, bass music, or cinematic chaos, this plug-in hits hard. Load it up, press a key, and destroy. No digging for samples, no messing with chains, just brutal, ready-to-go grooves.

  BERSERK brings explosive energy across dubstep, trap, and cinematic drops, with distorted drums, glitchy fills, and heavy-hitting loops built to punch through any mix. A Devastate/Squish control shapes the result from tight punch through to outright destruction.

  BERSERK is one of 17 genre-focused drum instruments in the Beatmaker series, all hosted inside a single Beatmaker plug-in that is installed by the UJAM App with your first Beatmaker title.
specs: |-
  - 10 hard-hitting drum kits
  - 20 styles, 460 MIDI loops
  - 50 mix and style presets
  - Devastate/Squish control for punch or destruction
  - MIDI drag and drop
  - Royalty-free MIDI phrases and sounds
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 0.96 GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, 64-bit only
  - Automated installation via the UJAM App, which also installs the Beatmaker plug-in that hosts all titles
  - Authorization via the UJAM App
  - Supported standards: MIDI
