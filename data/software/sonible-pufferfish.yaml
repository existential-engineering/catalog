description: puffer:fish is a free saturation plug-in from sonible that makes a
  track sound richer, fuller or more aggressive. Three pufferfish characters sit
  at the centre of the interface and react visually as the saturation is pushed
  harder.
details: |-
  The plug-in combines serious sound quality with a playful interface that invites experimentation. Rather than a page of parameters, saturation is shaped by choosing one of three fish characters and pushing it, with the on-screen fish responding as the effect intensifies. It is free to download and deliberately easy to use, so tone shaping happens in a couple of moves.

  Tinyfin is the gentle character, for a track that already feels good and needs a little more body. It introduces mild harmonics that thicken the signal and raise perceived loudness while staying musical and controlled, which suits vocals, pads, guitars, keys and buses where the goal is cohesion rather than aggression.

  Spikeskin is the bold one. Harmonics stack quickly, transients sharpen, and the sound turns raw and gritty as saturation crosses into distortion. It is aimed at drums that need to hit harder, basses that need to snarl and synths that need to scream, so it is a tool for expression rather than repair.

  Twitchgill sits between control and chaos. It starts warm and grows less predictable the harder it is driven, adding harmonics that react dynamically to the input signal to create movement, grit and edge. At low settings it lends life and presence, and pushed further the sound begins to twist, buzz and bite back, which makes it a good fit for drums, basses, synths, loops and sound design.
specs: |-
  - Type: plug-in
  - Plug-in formats (Mac): VST, VST3, AU, AAX
  - Plug-in formats (Windows): VST, VST3, AAX
  - Supported sample rates: 44.1 kHz to 192 kHz
  - Authorization: machine-based
  - Apple Silicon support: native
  - Three saturation characters: Tinyfin (smooth and warm), Spikeskin (loud and edgy), Twitchgill (buzzing and unpredictable)
  - Windows system requirements: Windows 10 (64-bit)
  - Mac system requirements: macOS 10.14 or later
  - RAM: 4 GB
  - CPU: Intel Core i5 or Apple Silicon
  - GPU: OpenGL version 3.2 or later
