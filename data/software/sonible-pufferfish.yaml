description: puffer:fish is a free saturation plug-in designed to experiment and have fun. Make any track sound richer, fuller or more aggressive.
details: |-
  This free saturation plug-in combines serious sound quality with a fun interface that invites experimentation. At the center of the plugin are three different sounding pufferfish that react visually as you push the saturation effect harder and harder.

  Tinyfin keeps things together when a track already feels good but needs a little more body. It is all about subtle saturation that adds warmth, depth, and sonic richness without drawing attention to itself. On a technical level, Tinyfin introduces gentle harmonics that thicken the signal and enhance perceived loudness while staying musical and controlled. Tinyfin works beautifully on vocals, pads, guitars, keys, and buses where you want cohesion rather than aggression.

  Spikeskin does not believe in subtlety. It brings bold, edgy energy to your sound. Designed for moments when clean feels a little too polite, Spikeskin pushes saturation into gritty, expressive distortion. Harmonics stack fast, transients get sharper, and the sound becomes raw, gritty, and aggressive. Perfect for drums that need to hit harder, basses that need to snarl, synths that need to scream, or any sound that should feel dangerous.

  Twitchgill lives in the space between control and chaos. It starts warm, but the harder you push it, the more unpredictable things become. Twitchgill adds harmonics that react dynamically to the input signal, creating movement, grit, and edge. At lower settings it can add life and presence. Push it further and the sound begins to twist, buzz, and bite back. This character is made for experimentation across drums, basses, synths, loops, and sound design.
specs: |-
