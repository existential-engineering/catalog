description: puffer:fish is a free saturation plug-in designed to experiment and have fun. Make any track sound richer, fuller or more aggressive.
details: |-
  This free saturation plug-in combines serious sound quality with a fun interface that invites experimentation. At the center of the plugin are three different sounding pufferfish that react visually as the saturation effect is pushed harder and harder.

  Tinyfin keeps things together when a track already feels good but needs a little more body. It is all about subtle saturation that adds warmth, depth and sonic richness without drawing attention to itself. On a technical level, Tinyfin introduces gentle harmonics that thicken the signal and enhance perceived loudness while staying musical and controlled. It works on vocals, pads, guitars, keys and buses where the goal is cohesion rather than aggression.

  Spikeskin does not believe in subtlety. It brings bold, edgy energy to the sound, and is designed for moments when clean feels a little too polite, pushing saturation into gritty, expressive distortion. Harmonics stack fast, transients get sharper, and the sound becomes raw, gritty and aggressive. It suits drums that need to hit harder, basses that need to snarl and synths that need to scream.

  Twitchgill lives in the space between control and chaos. It starts warm, but the harder it is pushed, the more unpredictable things become. Twitchgill adds harmonics that react dynamically to the input signal, creating movement, grit and edge. At lower settings it can add life and presence, and pushed further the sound begins to twist, buzz and bite back, which makes it a fit for drums, basses, synths, loops and sound design.
specs: |-
