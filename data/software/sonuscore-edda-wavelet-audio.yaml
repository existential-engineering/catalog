description: Edda is a library of Nordic tagelharpa strings and epic shamanic percussion that authentically captures the raw, organic atmosphere of Nordic musical traditions. It suits cinematic folk and viking-style pagan compositions while working across genres.
specs: |-
  - Instruments: Scoring Tagelharpa, Big Tagelharpa, Shaman Buben (percussion), Scoring Tagelharpa Phrases, Big Tagelharpa Phrases
  - 4 legato types: Rebow, Portamento, Fast, Trill
  - 8–16 round-robins per articulation, multiple dynamic layers
  - Bourdon string control (Big Tagelharpa)
  - Advanced rhythm sequencer with drag-and-drop MIDI export
  - Multiple microphone configurations with presets
  - Snapshot functionality
  - Audio format: 24-bit / 48 kHz lossless NCW
  - Hard drive space: 10.9 GB (15.1 GB original samples)
  - Requires NI Kontakt 8.1.0+ or free Kontakt Player
