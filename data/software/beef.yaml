details: |-
  Beef is a multi-effect audio plugin with a sole purpose, to make your tracks
  sound powerful. It brings all the effects you need to create powerful sounds
  into one efficient and easy to use window. Beef was originally built to focus
  on creating the fattest basses and drums as possible.

  Features include a multi-stage 4-band eq to sculpt your sound before and after
  saturation, rate modulation using filtered noise to enhance and engrain tracks
  with noisy textures, and the ability to charge sounds with 6 selectable
  saturation algorithms.

  Decimate your audio in a dedicated crush section with further shaping options
  using the transient shaper. Carve transients by using the shaper and blend
  your sound with an all important mix control.

  Beef's built-in preset mode removes everything except the mix control for ease
  of trying presets. When in this mode, the mix control will not change so that
  you can find and compare your perfect sound from a selection of 124 presets,
  with 85 of these being artist presets from content creators including ali
  ahmet from the beat community, ave mcree, gavinski's tutorials, jamie
  mallender, nu-trix the synth guy, the garageband guide, the reaper blog and
  venus theory.

  Beef by caelum audio is a virtual effect audio plugin and a mobile audio app
  for macos, windows and ios. It functions as an audio units plugin, a VST 3
  plugin and an AAX plugin.
specs: |-
