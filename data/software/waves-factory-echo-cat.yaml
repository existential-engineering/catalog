description: "Vintage tape echo audio plugin modeled after the 1958 Copicat
  delay unit. Replicates the original hardware's sound and behavior with
  authentic tape simulation and three playback heads, enhanced with modern
  production features."
details: |-
  Three playback heads with individual control. Tape simulation with wow, flutter, and hiss. Tempo sync delay times. Mid/Side processing. Ducking. Varispeed with LFO modulation. Input drive for tape saturation. Self-oscillation. Stereo widener and filters. No iLok required.
specs: |-
  macOS 10.9+ (Intel and Apple Silicon native). Windows 7/8/10. 64-bit only.
