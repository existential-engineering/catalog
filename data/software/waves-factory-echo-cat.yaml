description: Echo Cat is an audio plugin (AAX, AU, VST, VST3) that emulates the sound of a vintage Copicat Delay from the 1960s, with authentic tape simulation.
details: |-
  Echo Cat brings back the sound and behaviour of the original unit with authentic tape simulation and three playback heads. With added extra features that any modern delay plugin should have. These include M/S processing, tempo sync delay times, filters on the feedback path, varispeed, modulation and ducking.

  Invented in 1958 by Charlie Watkins, the Copicat delay was an instant hit. Featured in countless albums from the 60s and 70s and used by great bands like The Shadows and Pink Floyd. Primarily designed for guitar, it's now a sought after piece of equipment in studios around the world.

  The main section shows a representation of the original Copicat with the record and erase heads, and the three playback heads, plus the tape loop that spins continuously. Each head can be controlled in great detail: time synced to the tempo of the host or set freely in milliseconds, with volume, pan and LP/HP filters per head.

  The Tape section controls the sound of the tape loop, including mono/stereo hiss, artifacts containing wow and flutter for recreating the fluctuations in tape speed, tape age with asperity noise and erasures, and signal loss which is random high frequency compression. The Loop Gap parameter mimics the tape loop joint, where the tape is physically looped.

  The Motor section gives control over HUM and over Varispeed, which can also be modulated with an LFO. In the Master section, ducking lowers the volume of the wet signal when the dry signal is present, filters can be applied outside the feedback loop, mid and side volumes are controlled separately, and Echo Cat can be set to mono, stereo or fake stereo with a 5ms delay only in the right channel.
specs: |-
  - Three playback heads with individual time, volume, pan and LP/HP filters
  - Time synced to host tempo or set freely in milliseconds
  - High-end tape model with mono/stereo hiss, wow and flutter, tape age and signal loss
  - Loop Gap parameter mimicking the physical tape loop joint
  - Motor section with HUM and Varispeed, modulated by an LFO
  - Ducking of the full stereo or only the mid channel
  - M/S processing with separate mid and side volume
  - Filters on the feedback path and outside the feedback loop
  - Stereo widener, plus mono, stereo and fake stereo modes
  - Input drive for a crushed tape sound and sustain up to self-oscillation
  - macOS 10.9 or higher, Intel and Apple Silicon natively supported, 64-bit DAW and OS
  - Windows 7, 8 or 10, 64-bit DAW and OS
  - No iLok or challenge response needed, a serial number is provided at purchase
