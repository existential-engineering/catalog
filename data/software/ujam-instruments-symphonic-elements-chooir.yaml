details: |-
  CHOOIR complements the Symphonic Elements series with a professional Hollywood choir. Male, female, and boys' ensembles, a full range of vowels and consonants, 70 styles and 100 presets, all created from Hans Zimmer's personal library. The plug-in works solo or in tandem with STRIIIINGS, BRAAASS, DRUMS and PERRCS, and adds the choir textures that have defined modern film scoring to your music.

  Blend soaring female voices, powerful male ensembles, and haunting boys choirs to create everything from intimate textures to massive Hollywood climaxes. CHOOIR offers vocal styles ranging from stomping, rhythmic shouts to majestic, cinematic swells to menacing, sound-designed atmospheres.

  CHOOIR comes with 70 styles across categories like Epic, Ethereal and Suspense. Hold a key and it delivers a living, breathing choral arrangement, from majestic resolutions to edge-of-your-chair suspense and mysterious shouts.

  Three master effects, Highlighter, Ambience and Finisher, dial in the sonic character, while UJAM's motion and character FX keep the two vocal textures moving. The choir can move from a magnificent cathedral setting to a menacing, sound-designed, flute-like pad.
