details: |-
  A hybrid of a precision sampler and flexible synthesizer, auto-tune slice is
  more than just a sampler. It's a dimension of infinite musical expression
  where you can play voices like instruments and turn endless samples into
  songs.

  14 onboard effects including vintage analogue tube saturation, lush chorus,
  mutative ring modulation, and vocal doubling enable endless possibilities for
  manipulating samples.

  Explore a comprehensive and constantly updated library of exclusive vocal
  presets and samples from a-list producers and cutting-edge artists like aaron
  dessner and bon iver.

  Optimized for vocals but equally powerful for beats and instruments, turn any
  sample into a playable instrument that automatically maps to your controller.

  Automagically slice up vocals with advanced transient detection that could
  only come from the creators of auto-tune. Play slices in order or rearrange
  them to create new phrases and patterns.
specs: |-
  - 64-bit only
  - Advanced transient detection
  - 14 onboard effects
  - Vintage analogue tube saturation
  - Chorus
  - Ring modulation
  - Vocal doubling
  - Precision vocal sampling
  - Flexible synthesizer hybrid
  - Drag and drop functionality
  - Customizable built-in effects
  - Over 200 exclusive vocal samples and presets
  - Ever-expanding library
  - Windows AAX native
  - Windows VST3
  - Mac AAX native
  - Mac VST3
