description: JULY is a faithful emulation of one of the most iconic polyphonic
  analog synthesizers from the early 1980s.
details: |-
  JULY is a faithful emulation of one of the most iconic polyphonic analog synthesizers from the early 1980s. AudioThing spent months with the original, studying every quirk and charm, from the warm, steady DCO to the silky filter and the unmistakable chorus, then modeled its circuits in detail.

  The original was released in 1982, expanding on earlier designs by introducing patch memory and a DCB interface while preserving its signature analog sound. It featured six voices, each built around a DCO with a suboscillator, a resonant low pass filter, a non resonant high pass filter, and the now iconic stereo chorus. Known for lush pads, rich chorused strings, and tight rhythmic arpeggios, it was embraced by artists such as The Cure, Eurythmics, Enya, and Animal Collective.

  The filter is a 24 dB low pass with a gentle high pass in front, built around the classic IR3109 VCF chip. It is smooth and warm when opened up and can bite when resonance is added. The arpeggiator recreates the original feel and adds new play modes, an adjustable range of up to four octaves, bar reset, and extra control over rate, velocity, and note order.

  The BBD-based stereo chorus has been modelled in detail, including the MN3009 BBD chips with 256 stages each, the surrounding filters, and the LFOs that drive modes I, II, and I+II. A rate multiplier adjusts the internal LFO speed, with the option to switch to the slightly different J6 values.

  JULY includes four effects inspired by classic gear: a Tape Echo based on AudioThing's Space Echo emulation Outer Space, a Spring Reverb, an Overdrive, and a Phaser, all rearrangeable by drag and drop. It is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP, Standalone), and on the App Store for iOS and iPadOS (AUv3 and Standalone).
specs: |-
  - 1 DCO Oscillator (PWM, Saw, Square)
  - Suboscillator (up to -3 octaves)
  - HP and Resonant LP Filters
  - 2 Envelopes
  - 1 LFO with multiple trigger modes
  - Mono/Poly and Unison Mode
  - 4 Effects (echo, spring reverb, overdrive, phaser)
  - Chorus I, II, I+II (J6 and J60)
  - Resizable Window
  - Brightness and Contrast Controls
  - Preset system with randomizer
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP, Standalone 64-bit)
  - macOS 10.13 - macOS 26, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP, Standalone 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP, Standalone 64-bit)
  - 1 license up to 3 computers, no iLok, no internet connection required to activate
