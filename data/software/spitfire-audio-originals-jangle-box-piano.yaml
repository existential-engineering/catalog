details: |-
  Abbey Road's iconic 'studio' piano, expertly recorded at its legendary home, in Studio Two. Famous for its use on countless '60s pop era records, including The Zombies, Pink Floyd and The Beatles — featuring prominently on The Beatles (aka The White Album) and Magical Mystery Tour . The instrument features brass tipped felt strips that can be dropped between the hammers and strings, emulating the sound of a 'tack piano'. The result is an instrument of two distinct characters: one mellow and dark; the second, percussive and bright.
specs: |-
  - File size: ~7.9 GB
  - Challen 'studio' piano recorded at Abbey Road Studio Two
  - 6 presets
  - 3 mic signals: Close / Ribbons, Room, Vintage
  - macOS 11 to OS 26, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
  - Minimum 2.8 GHz quad-core i5 and 8 GB RAM
  - Recommended 2.8 GHz six-core i7 and 16 GB RAM
  - 32-bit systems are not supported
