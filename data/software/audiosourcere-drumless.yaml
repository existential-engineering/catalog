description: AudioSourceRE's advanced DRUMLESS plugin for splitting drum and instrumental tracks within your favourite DAW.
details: |-
  DRUMLESS allows you to rebalance drum and instrumental parts, from small adjustments to fully soloed drums, with true real-time separations and no pre-processing required.

  Processing is fully on-device, so drum removal works without an internet connection. It can also be used to remove instrumental bleed from live drum recordings.

  Key features include an easy-to-use interface to adjust the levels of drums and backing track separately, real-time local processing, and availability in AAX, VST and AU formats.

  DRUMLESS is compatible with any Digital Audio Workstation capable of hosting VSTs, including Pro Tools, Logic Pro X, Cubase, Reaper, FL Studio, GarageBand, Ableton Live, Studio One and Waveform. It is aimed at DJs, mash-up enthusiasts, and mixing and mastering engineers who want to tweak a mix without the original stems.
specs: |-
  - Easy to use interface to adjust the levels of drums and backing track separately
  - Real-time local processing
  - Available in AAX, VST and AU formats
  - Compatible with Pro Tools, Logic Pro X, Cubase, Reaper, FL Studio, GarageBand, Ableton Live, Studio One, Waveform
  - Mac OS 10.13 and up
  - Windows 7 and up
  - Minimum 4GB RAM (8GB+ preferred), 2.6GHz CPU (3GHz+ recommended)
  - Minimum buffer size 2048 (1024 recommended)
  - iLok account required (cloud authorization, no dongle needed)
