description: AudioSourceRE's advanced DRUMLESS plugin for splitting drum and
  instrumental tracks within your favourite DAW.
details: |-
  DRUMLESS is a real-time drum extraction plugin that allows users to rebalance
  drum and instrumental parts, from small adjustments to fully soloed drums. It
  operates with true real-time separation requiring no pre-processing.

  The plugin is ideal for DJs, mash-up enthusiasts, as well as mixing and
  mastering engineers who want to tweak a mix without requiring the original
  stems. It can also remove instrumental bleed from live drum recordings.

  DRUMLESS features an easy-to-use interface for adjusting drum and backing
  track levels separately. All processing happens locally on the device with no
  internet connection required, ensuring low latency and data privacy.

  The plugin is compatible with major DAWs including Pro Tools, Logic Pro X,
  Cubase, Reaper, FL Studio, GarageBand, Ableton Live, Studio One, and Waveform.
  It requires an iLok account for authorization but no physical dongle.
specs: |-
  - Real-time drum and instrumental separation
  - True real-time processing with no pre-processing required
  - On-device local processing (no internet required)
  - Independent drum and backing track level adjustment
  - Remove instrumental bleed from live drum recordings
  - Available in AAX, VST, and AU formats
  - macOS 10.13+, Windows 7+
  - Minimum 4GB RAM (8GB+ preferred), 2.6GHz CPU (3GHz+ recommended)
  - Minimum buffer size 2048 (1024 recommended)
  - iLok account required (cloud authorization, no dongle needed)
  - Compatible with Pro Tools, Logic Pro X, Cubase, Reaper, FL Studio, GarageBand, Ableton Live, Studio One, Waveform
