description: Distinct Pro is a saturation and distortion plugin combining a
  harmonic drive section with a dynamics section for detailed compression
  management, allowing shaping of transients and saturation.
details: |-
  "Distinct Pro!" takes what you know and love from the original Distinct! unit, and allows for complete control of of the ultimate saturation circuit - perfect for any scenario. It may share a name with the original, although this plugin features all-new saturation circuits with unparalleled control. Whether you need subtle harmonics or a distortion that feels aggressive, Distinct Pro can handle your workload. It combines advanced harmonic distortion and saturation controls in the Drive Section with an extensive Dynamic (DYN) section for detailed compression management. Take full control of the way you sculpt your transients, and saturation with all of the new features Distinct Pro offers and take your sound design possibilities above and beyond!
specs: |-
  - Advanced Controls : Our intuitive top bar includes a comprehensive control scheme, including precise preset management for saving and recalling settings. The linked input/output gains allow for balanced volume levels, while oversampling enhances audio quality. The A/B comparison tool is essential for comparing different settings, and the GUI resizing ensures a comfortable user interface.
  - EQ Auto Gain : The EQ Auto Gain feature automatically adjusts the output level to compensate for changes in EQ settings. This intelligent functionality ensures a consistent loudness level, making it easier for users to focus on the tonal balance without worrying about volume disparities.
  - Drive Section : The Drive Section introduces a nuanced approach to harmonic distortion and saturation. With separate controls for different channels, it provides a detailed level of sound manipulation. This feature is ideal for adding warmth and character to audio tracks.
  - Frequency Gain Controls : These controls allow for precise adjustments across different frequency bands. With individual knobs for high, mid, and low frequencies, users can sculpt the audio to achieve the desired tonal quality, enhancing clarity and presence in the mix.
  - Control Panel/Meters : This section offers a selection of saturation algorithms, enabling users to choose the best fit for their audio. The operational modes, including Mono, Stereo, and M/S, provide flexibility in processing the audio signal, catering to a wide range of mixing requirements.
  - Dynamic (DYN) Section : Featuring a robust set of compression tools, this section allows for detailed manipulation of audio dynamics. With controls for threshold, behavior, and transient shaping, it's a powerhouse for managing the dynamic range and adding punch or smoothness to the audio.
