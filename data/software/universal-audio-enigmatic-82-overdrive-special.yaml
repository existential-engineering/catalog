description: Emulation of the Overdrive Special boutique guitar amplifier, with
  four decades of D-style models and nine cabinet and microphone setups.
details: |-
  UAD Enigmatic '82 Overdrive Special Amp models the boutique D-style amplifier associated with players including Stevie Ray Vaughan, Carlos Santana and Joe Bonamassa.

  Amp models span four decades of the circuit, from clean through crunch. Power sections, tone stacks and the HRM modification can be mixed and matched to assemble a configuration that does not correspond to any single production unit.

  Nine curated cabinet and microphone setups provide mix-ready tones without microphone placement, and more than forty artist presets are included. The plug-in runs natively on macOS and Windows without Universal Audio hardware.
specs: |-
  - Overdrive Special amplifier emulation
  - Amp models spanning four decades of the circuit
  - Interchangeable power sections and tone stacks
  - HRM modification option
  - 9 curated cabinet and microphone setups
  - Over 40 artist presets
  - Runs natively without Universal Audio hardware
