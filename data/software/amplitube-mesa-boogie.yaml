details: |-
  Plug into a mesa/boogie amp and it will change your ideas about tone and your playing forever. From the moment you first plug into a mesa, you'll experience new levels of responsiveness, feel, nuance, and sound and you'll quickly understand why mesa has always referred to their amplifiers as "instruments"... Because they are.

  No one speaks high-gain guitar like mesa/boogie. Since the late-'60s, randall smith, and from 1980 on, dan van riezen, doug west and james aschow have been smashing the boundaries of heavy guitar with a myriad of innovative and handcrafted instruments and speaker enclosures.

  Amplitube mesa/boogie gives you convenient access to 5 amps and cabs from their most toneful and popular lines, allowing you tap into the thick, rich sound that so long ago prompted carlos santana to make his "mark" on the brand and famously say, "man, this thing really boogies!"

  Amplitube mesa/boogie includes officially certified models of amplifiers: mark iii combo, mark iv combo, dual rectifier head, triple rectifier head, transatlantic ta-30 combo. Cabinets: 1x12" mark iii combo, 1x12" mark iv combo, 2x12" rectifier horizontal, 4x12" recto traditional slant, 2x12" transatlantic ta-30 combo.

  Amplitube mesa/boogie is a virtual effect audio plugin and a software application for macos and windows. It functions as a VST plugin, an audio units plugin, a VST 3 plugin, an AAX plugin and a standalone application.
