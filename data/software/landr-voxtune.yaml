description: Get real-time pitch correction and vocal tuning with LANDR VoxTune,
  perfect for creating modern vocal effects and polished, professional-sounding
  tracks.
details: |-
  VoxTune is LANDR's real-time vocal tuner, built to correct pitch instantly with zero latency and natural sound. It lets you choose transparent or modern tuning, shape tone with vibrato and formants, and stay in key live or in the studio, with streamlined, plug-and-play tuning.

  The plugin is aimed at keeping a vocal in perfect pitch across every session or stage while leaving the performance intact. LANDR positions it as expressive, natural tuning with zero latency and creative controls so a singer or producer can sound professional without breaking their flow.

  Correction runs in two characters: transparent for natural pitch fixing, or robotic for modern, stylized vocal effects. Both are delivered in real time with no artifacts, and a tune speed control moves between smooth, expressive tuning and fast, stylized transitions.

  Because it is latency free, VoxTune is intended for tracking and live performance as well as mixing, with no setup delay before a take. LANDR describes it as built for speed, stage use and creative momentum.

  Tone shaping is handled by formant and vibrato controls. Formant shaping brightens or deepens the vocal tone without changing pitch, and a built-in vibrato adds expression and emotion in real time for a more personalized vocal character.
specs: |-
  - Real-time pitch correction with zero latency
  - Transparent and modern (robotic) tuning modes
  - Tune speed control for smooth, expressive or fast, stylized transitions
  - Formant shaping to brighten or deepen tone without changing pitch
  - Built-in vibrato control
  - macOS: macOS X 11 or higher
  - macOS: Apple Silicon native or Intel
  - macOS formats: VST3, AU, AAX
  - Windows: Windows 10 (64-bit) or higher
  - Windows formats: VST3, AAX
