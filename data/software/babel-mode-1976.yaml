  Babel Mode 1976 effect was originally designed after vintage flanger, vibrato
  and chorus circuits. It has a few unique features that they were very famous
  during the 70's and 80's.

  Babel mode 1976 is an effective and easy-to-use vintage style module. It
  sounds best on guitar, voice and synth tracks.

  Modulation audio effects are an important part of your mixing tools. They're
  the special way to add creativities and groove to sounds.

  Babel mode 1976 by babelson audio is a virtual effect audio plugin for macos
  and windows.
