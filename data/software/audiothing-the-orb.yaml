description: The Orb is a formant filter plugin which simulates the
  characteristics of the human voice. The Orb can transform any sound into a
  vowel-like filtered sound.
details: |-
  The Orb is a formant filter plugin that simulates the characteristics of the human voice. Featuring a set of three band pass filters, The Orb can transform any sound into a vowel-like formant-filtered sound. With the three LFOs you can modulate the Vowel, the Emphasis/Resonance of the formants, and the Drift, which can shift up or down the frequencies of each formant. You can also create your own set of vowels by changing the name and frequency for each vowel/formant.

  Each sector of the orb represents a Vowel. It's possible to change the vowel for each sector by clicking on the vowel name. The distance from the center of the orb to the dot represents the amount of Emphasis (resonance) for each formant filter. The angle of each sector represents the amount of Drift, which is a value in Hz that will be added or subtracted from each vowel formant.

  By clicking on the Edit button in the Vowels section, you can access the Custom Vowels window. It's possible to change each vowel name and frequency for the three formants. Each custom vowels set will be saved in a preset (or DAW session), so you can create as many as you want by saving to a new preset. The default setting is the same as the Male genre settings.

  The Orb is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP).
specs: |-
  - Three Band Pass Filters (ZDF design)
  - Vowel Sets: Male, Female, Child and Custom
  - 3 LFOs (destinations: Vowel, Emphasis and Drift)
  - Lightweight on CPU
  - Presets system with randomizer
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP 64-bit)
  - OS X 10.9 - macOS 14, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP 64-bit)
  - 1 license up to 3 computers, no iLok, online or offline authorization
