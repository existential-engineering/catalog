details: |-
  With twelve powerful sections of processing, BIG FrEQ offers the ability to
  create modern flat-top parametric shapes with an analog workflow and added
  controls for more tone-shaping possibilities than a typical EQ plug-in.

  Inspired by the precision and warmth of empirical labs lil freq parametric
  equalizer, big freq introduces superior fine tuning controls for surgical tone
  shaping and a unique finisher section for adding organic harmonic distortion.

  Empirical labs brings the soul of analog hardware to the digital realm and
  includes features that can not be replicated in the analog domain.

  The unique finisher section adds organic saturation and it provides for up to
  8x oversampling. Each parametric section has a 4th control called slope for
  creating flat-top eq shapes.

  Switching on the focus mode will center the selected frequency on the freq
  knob and reduce the range for easy fine tuning. Multiple parametric bands can
  be soloed at the same time with the switchable solo buttons. Parametric
  sections can be copy and pasted from one section to the next for faster
  operation. Each section's gain knob can be expanded from 15db to 30db with the
  range button.
specs: |-
  - Twelve parametric EQ sections
  - Flat-top parametric shapes
  - Finisher section with organic harmonic distortion
  - Up to 8x oversampling
  - Slope control for flat-top EQ shapes
  - Focus mode for frequency fine tuning
  - Solo buttons for multiple parametric bands
  - Copy and paste functionality between sections
  - Gain knob expandable from 15db to 30db with range button
