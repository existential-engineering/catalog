details: |-
  Bassknob STD gives you the best bass sound you've ever heard with the turn of
  a knob. Add full-bodied bass to your next recording, capture a quick idea in
  pristine quality, or just enjoy a beautiful tone for your next practice
  session.

  Simple, dynamic, responsive, articulate. It's absolutely everything a bad-ass
  bass plugin should be.

  Everything you need: mix-finished sound by producer jens bogren. Clean and
  dirt channels. Ir loader with irdx technology. Metronome. Riff recorder. Tuner
  optimized for bass guitar. Built-in gate.

  Bassknob std by bogren digital is a virtual effect audio plugin and a software
  application for macos and windows. It functions as an audio units plugin, a
  VST 3 plugin, an AAX plugin and a standalone application.
specs: |-
