description: SYSTEM IR-Verb is a convolution reverb plugin delivering premium reverb sounds through 135 high-quality impulse responses sourced from sought-after vintage outboard units and real acoustic spaces, featuring an interactive 3D visualization, drag-and-drop custom IR support, and compatibility with IQ-Series Reverb V2 expansion packs.
details: |-
  The HOFA SYSTEM IR-Verb gives you 135 high-quality impulse responses from a wide variety of reverb units and real locations.

  The old outboard reverbs from the HOFA-Studios were used, and what we didn't have in the studios was borrowed or bought from somewhere. For the IR library, our sound engineers meticulously captured distinctive rooms, halls, churches, clubs, and even a sauna. They used Genelec speaker systems and a dodecahedron, while Brüel & Kjær and Schoeps microphones ensured precise recording of all spatial details.

  Additionally, you can use all IRs and expansion packs from our reverb flagship, IQ-Series Reverb V2, if you own them. Want to use your own impulse responses? It's easy, just drag and drop!

  Interactive 3D Visualization: the central 3D display shows you in detail the sound of the currently loaded impulse response, and you can see the effect of changing parameters in real time.
specs: |-
  - 135 high-quality impulse responses from sought-after reverbs and real locations
  - Room, Ambience, Chamber, Hall, Church, Plate, Spring
  - Simple and intuitive control with 3D display
  - Interactive 3D visualization of the loaded impulse response and parameter changes in real time
  - Load your own impulse responses via drag and drop
  - Supports all IRs and expansion packs from IQ-Series Reverb V2
  - Can be used as a standalone plugin and in HOFA SYSTEM
  - Two licenses per purchase, managed via the HOFA Plugins Manager; offline activation supported
  - Operating system: macOS 10.13 or later, Windows 10 or later
