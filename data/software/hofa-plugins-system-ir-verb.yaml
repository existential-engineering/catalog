details: |-
  Comes with an abundance of impulse responses from the most sought-after reverbs and real locations Room, Ambience, Chamber, Hall, Church, Plate, Spring Simple and intuitive control with 3D display Can be used as a standalone plugin and in HOFA SYSTEM Overview: SYSTEM IR-Verb Comprehensive Collection of Impulse Responses The HOFA SYSTEM IR-Verb gives you 135 high-quality impulse responses from a wide variety of reverb units and real locations. The old outboard reverbs from the HOFA-Studios were used, and what we didn't have in the studios was borrowed or bought from somewhere. For the IR library, our sound engineers meticulously captured distinctive rooms, halls, churches, clubs, and even a sauna. They used Genelec speaker systems and a dodecahedron, while Brüel & Kjær and Schoeps microphones ensured precise recording of all spatial details. Additionally, you can use all IRs and expansion packs from our reverb flagship, IQ-Series Reverb V2 , if you own them. Want to use your own impulse responses? It’s easy—just drag and drop! Interactive 3D Visualization The central 3D display shows you in detail the sound of the currently loaded impulse response, and you can see the effect of changing parameters in real time. https://vimeo.com/672041665?h=d7cbca1f55
