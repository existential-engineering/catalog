description: Samplitude is a Windows digital audio workstation for recording,
  editing, mixing and mastering, built on an object-based editing model and a
  hybrid audio engine.
details: |-
  Samplitude's object-based workflow treats each clip as an object with its own
  plug-ins, sends and automation, edited in a dedicated Object Editor, so small
  sections of a large project can be worked on precisely and individually.
  Recording runs to 999 tracks, and the Hybrid Audio Engine separates
  short-response track effects for low-latency live monitoring from a high
  latency engine that carries the heavier object, AUX and surround processing.

  The application covers the chain from tracking through mixing to mastering,
  with equalizers, compressors, limiters and other mix tools, comprehensive MIDI
  editing, virtual instruments and plug-in support. Workspace windows can be
  moved, docked and saved to match a given workflow.

  Samplitude Suite adds native Dolby Atmos support with ADM integration,
  spectral editing at track level, an FX Routing Matrix for mapping track
  channels to plug-ins and routing their outputs, Soundly sound library
  integration, and bundled plug-ins including CrumplePop, Celemony Melodyne 5
  Essential, Acon Digital Acoustica 7 Premium, Convology XT Complete and Sound
  Forge.

  Samplitude was developed and sold by MAGIX for most of its history. Boris FX
  acquired it, together with Sequoia and Music Studio, from MAGIX in August
  2025, and it is now published under the Boris FX pro audio range.
specs: |-
  - Object-based editing with a per-object Object Editor
  - Recording on up to 999 tracks
  - Hybrid Audio Engine with separate low-latency and high-latency paths
  - Equalizers, compressors, limiters and mastering tools
  - Comprehensive MIDI editing and virtual instrument support
  - Third-party plug-in support
  - Customizable, dockable and saveable workspaces
  - Native Dolby Atmos with ADM integration (Suite)
  - Track-level spectral editing (Suite)
  - FX Routing Matrix (Suite)
  - Soundly sound library integration (Suite)
