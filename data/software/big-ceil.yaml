details: |-
  Acustica Audio is proud to introduce you to ceil's bigger brother. Give a warm
  welcome to bigceil, your ultimate british channel-strip which includes many
  classic designs in one comprehensive production tool.

  Bigceil is the augmented version of an already versatile processor, which we
  have made even more powerful by adding additional features and flavours.

  An extended, straight-to-the-point eq section, a magic 'air' knob, to add
  sparkle to your tracks, giving the illusion of a natural space 'around' the
  sound, plus independent pan controls for left and right channels.

  Big ceil is a virtual effect audio plugin for macos and windows.
specs: |-
