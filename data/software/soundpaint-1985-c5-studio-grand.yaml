details: |-
  Golden Standard for Studio Grand PIanos

  Whether you're getting up close and personal with the strings or listening from the standard player's position, capturing the darker tones underneath the piano or the more open and ambient perspective of the room microphones, every nuance of this beautiful instrument is ready and available to you. We used only the finest Neumann microphones (U87, Um57) and a wealth of other high-end studio mics to convey every emotion imaginable. Elegant playability is equally important, and the 1985 Passionate Grand C5 performs perfectly across all dynamic ranges thanks to Soundpaint's ability to generate infinite velocities. With this beautiful, warm, and wide sounding mature grand piano, you will not feel that these are samples, but rather a real instrument at your fingertips, full of life, personality, natural resonances and harmonics. The 1985 Passionate Grand C5 contains multiple deep-sampled Parts with Sustains, Una Corda (felt piano), Staccatissimo, Staccato, and Key Noises. Every articulation feels and plays completely realistically, while the Programs cover a wide range of styles, tones, timbres, and effects.
