name: AutoSwell Light
manufacturer: pechenegfx
primaryCategory: effect
url: https://pechenegfx.org/
description: AutoSwell Light - an automatic volume swell effect triggered by the
  input signal.
details: |-
  AutoSwell Light by PechenegFX is an automatic volume swell effect triggered by
  the input signal.

  Time: sets the constant time of swell attack. Sensitivity: defines the
  response to the input signal. Larger value allows you to detect soft and quiet
  notes. Depth: defines an amount of mix of processed signal with initial input.
  0 - clean input, 1 - fully processed. Volume: sets overall volume of plugin.
specs: |-
  - macOS compatibility
  - Windows compatibility
  - Automatic volume swell effect
  - Time control
  - Sensitivity control
  - Depth control
  - Volume control
