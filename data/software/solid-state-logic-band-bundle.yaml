details: |-
  The ssl Band Bundle offers three powerful strips - drumstrip, vocalstrip 2,
  and guitarstrip - featuring all-in-one processing dedicated to the essential
  elements of your mix.

  Ssl guitarstrip is your new go-to processor for electric, acoustic and bass
  guitars. Featuring two classic analogue drive emulations guitar amp and bass
  amp the guitarstrip also includes an easy-to-use compressor with auto gain,
  shaping eq and phase correction module.

  Take your drum sounds from ordinary to exhilarating in a few quick, easy
  steps. Featuring 5 carefully tailored audio processing tools an intuitive
  gate, low and high frequency harmonic enhancers, a transient shaper, listen
  mic compressor (lmc) and fully re-orderable processing path.

  The ssl vocalstrip 2 plug-in combines eq and dynamics modules with essential
  vocal processors to bring you power, character and clarity for your vocals all
  from a single interface. Use the dynamic envelope based de-esser and
  de-ploser, compander and eq alongside informative and intuitive visual
  feedback.
