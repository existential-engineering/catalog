details: |-
  The famous British analog console equalizer. Use in Console 1, Flow Mixing Suite, Amp Room or as standalone plug-in. This plug-in is included in British Class A.

  The EQ is essential to the classic British console sound, and the equalizer in British Class A is component-modeled to absolute perfection after one of the most highly sought-after EQs of its era. With stepped frequency controls, you can tweak the color of your sound and, no matter what you do, always come out with true British console character.

  The British Console Sound is famous. You can hear its sweet and musical quality on hit records spanning more than five decades from artists such as Queen, Nirvana, David Bowie, and the Red Hot Chili Peppers. When mix engineers need this unmistakable body, depth, and silky sweet top-end on individual tracks and busses, Softube's British Class A channel strip is the one to grab.

  Featuring pristine replicas of expensive and highly sought-after console modules from the late '60s and early '70s, British Class A makes it easy to tune in the soulful character of the classic British consoles. The Low Shelf/Low Cut low-end technique couples with the satiny High Shelf and Drive/preamp to give that acclaimed tone that makes everything sound incredible.
specs: |-
  - Authentic, unmistakable British console character
  - A precisely emulated console equalizer
  - Use in Console 1, Flow Mixing Suite, Amp Room or as standalone plug-in
  - Famous 3-band equalizer with two silky smooth shelving filters and a peaking mid-band with high and low Q settings
  - Stepped frequency controls
  - Component-modeled after one of the most highly sought-after EQs of its era
  - Included in the British Class A channel strip
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26
  - System requirements: Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access for downloading installers and managing licenses
  - 14-day returns, 20-day trial, tech support, three activations
