description: FRAGMENTS - MODERN PERCUSSION is an original percussion instrument that takes inspiration from everyday noises and non-traditional percussive sounds. It combines snippets of organic sounds to generate refreshing and complex, low-key rhythms suitable for cinematic, ambient, and experimental contexts.
specs: |-
  - Requires Kontakt Player (free) version 7.10.9 or higher
  - macOS 13, 14, or 15 (latest update)
  - Windows 10 or 11 (latest service pack)
  - 8 GB RAM minimum
  - 100 MB+ free hard disk space
  - Intel i7 processor or higher recommended for complex presets
  - Three independent sequencers (Bass, Snare, Fragments sound slots)
  - 12 round robins and up to 5 velocity layers per sound
  - Deep randomization options for rhythm variation
  - FX engine with master compressor and reverb
  - Drag-and-drop user sound capability
  - 100+ presets
  - 3,500+ organic sound sources
  - NKS (Native Kontrol Standard) compatible
