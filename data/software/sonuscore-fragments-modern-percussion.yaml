description: FRAGMENTS - MODERN PERCUSSION is an original percussion instrument that takes inspiration from everyday noises and non-traditional percussive sounds. It combines snippets of organic sounds to generate refreshing and complex, low-key rhythms suitable for cinematic, ambient, and experimental contexts.
details: |-
  FRAGMENTS - MODERN PERCUSSION is a percussion instrument built from sounds that are not typically found in a standard percussion library, taking its cues from the beat of the city and from everyday noises. Each sound was recorded in twelve round robins and up to five velocity layers, with an FX and randomization engine intended to give the feeling of a truly human touch. The sources are all organic, including parts of the human body, and were captured with an array of high-quality microphones.

  Intricate rhythms come from three sequencers linked to independent sound slots: Bass, Snare and Fragments. Each beat generator carries two randomization features, one that lays out the initial pattern and another that shakes it up with every turn, plus a Density control that fills out the sound by adding hits of varying velocities to every silent step. Density can be tied to the mod wheel, allowing an easy switch between minimal and complex rhythms, and different sequencer time signatures can be used to increase complexity.

  The Bass and Snare slots each feature three organic sounds recorded with twelve round robins, while the Fragments slot contains seventeen sounds. Sounds can be selected by source material, choosing from Wood, Metal, Mechanical, Body, or a user sound dragged and dropped into the User section, with control over which sources are used, the panning, or full randomization of both.

  The interface spans a main page for the three slots, an FX page with a master compressor and reverb alongside independent dynamic and filter controls per slot, a user screen for drag-and-drop of personal samples and MIDI assignment of the Density and Tone controls, and a preset browser holding over 100 cinematic and experimental presets.
specs: |-
  - Works with the FREE KONTAKT PLAYER
  - Requires KONTAKT version 7.10.9 or higher
  - macOS 13, 14 or 15 (latest update)
  - Windows 10 or 11 (latest service pack)
  - 8 GB RAM
  - At least 100 MB of free hard disk space
  - Some presets require a fast CPU, Intel i7 processor or higher
  - All sounds recorded with 12 round robins
  - Up to 5 velocity layers depending on the source
  - More than 3,500 inspired, organic sound sources
  - Over 100 ready-to-go cinematic and experimental presets
  - Three sequencers linked to independent sound slots: Bass, Snare, Fragments
  - 3 organic sounds each in the Bass and Snare slots, 17 sounds in the Fragments slot
  - Sound sources selectable by material: Wood, Metal, Mechanical, Body, or User
  - Drag-and-drop import of your own sounds via the User screen
  - Density and Tone assignable to MIDI, Density tieable to the mod wheel
  - Master compressor and reverb, with per-slot dynamic and filter controls
  - Selectable sequencer time signatures
