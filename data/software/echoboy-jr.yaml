details: |-
  EchoBoy Jr. is a streamlined echo plug-in featuring seven iconic analog echo emulations. Each emulation captures the character of classic hardware units, from vintage tape echoes to modern digital delays.

  The seven echo models include Studio Tape, Plex, Space, Cheap Tape, Memory, Ambient, and Transmitter. Three stereo modes are available: Normal, Wide, and Ping-Pong for flexible spatial effects.

  Control options include pitch glide or time-stretching echo time controls, saturation and EQ controls for low and high frequencies, and musical time units or milliseconds. Self-oscillation enables sci-fi feedback effects.
specs: |-
  - Seven analog echo emulations: Studio Tape, Plex, Space, Cheap Tape, Memory, Ambient, Transmitter
  - Three stereo modes: Normal, Wide, Ping-Pong
  - Pitch glide or time-stretching echo time controls
  - Saturation and EQ controls (low/high frequency)
  - Musical time units or milliseconds
  - Self-oscillation for sci-fi effects
  - 64-bit only, sample rates 44.1 kHz to 192 kHz
  - Apple Silicon compatible
