details: |-
  "FilkChannel might be the best guitar eq of all time! That eq is so bulky and meaty!"

  JESSE RAY ERNSTER (Grammy Award Winning)

  The Filkchannel Strip is an analog modeled plugin & is based on some of the best Danner Cassette Modules from the 70's. The Filkchannel Strip MK2 offers a wide variety of tonal options with it's 7 modules . From light analog warmth on vocals, acoustic guitar & mixbus, to aggressive and gritty tones for in your face drums, bass, and heavy guitars, Filkchannel is your one-stop-shop channel strip! What's New in MK2? System Requirements:

  Supported Formats:

  MacOS | 64bit / M1 Native: VST3, AU, AAX

  Windows | 64bit: VST3, AAX
specs: |-
  - 4 New Modules (two compressors, two preamps, 3 EQs Total)
  - Drag and Drop Signal Chain
  - In and Out meters
  - New GUI
  - Multiple Sat Types Per Preamp
  - New Menu and Top Bar
  - Improved Modeling on Original modules
  - 1 GHz Intel Dual Core Processor or AMD equivalent (PC)
  - 4GB of RAM
  - Mac OS X 10.7 or higher, 10.14 or higher recommended
  - Windows 7 & Above
  - Screen res: 1024 x 768 or higher
  - 64 bit DAW support only
