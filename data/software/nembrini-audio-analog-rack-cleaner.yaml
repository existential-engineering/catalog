description: The Analog Rack Cleaner is a plugin featuring high pass and low pass filters in a single rack Fx plugin to clear up low-end rumble and high-frequency noise, with a tube preamp virtual circuit that gives color to the signal.
details: |-
  The Analog Rack Cleaner combines high-pass and low-pass filtering capabilities in a single rack effects unit. It is designed to eliminate low-end rumble and high-frequency noise from audio signals.

  At its core, the plugin features a tube preamp virtual circuit that adds color and character to the signal in a very special way, going beyond simple filtering to impart analog warmth.

  The plugin is available as a free download and supports all major plugin formats including VST2, VST3, AAX, and AudioUnits. An iOS version is also available for iPhone and iPad via the Apple App Store.
