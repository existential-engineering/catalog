description: "A free equalizer featuring custom 4th order IIR filters with five
  bands of super parametric peaking filters, adjustable GUI colors, and 64-bit
  internal processing."
details: |-
  ColourEQ is a free parametric equalizer plugin from DDMF, distinguished by its
  custom-made 4th order IIR filter design that produces unique curve shapes
  unavailable in standard equalizers. The result is an EQ that sounds unlike any
  other, giving it a characteristic colour to the sound.

  The plugin offers five bands of super parametric peaking filters with adjustable
  GUI colors and a freely resizable window interface. Internal processing runs at
  64-bit precision with low CPU consumption.

  Available for Windows (7+), Mac (10.11+, Intel and Apple Silicon), and Linux
  (ARM aarch64 and x86_64). Formats include VST, VST3, AU, and AAX.
specs: |-
  - Five bands of super parametric peaking filters
  - Custom 4th order IIR filter design with unique curve shapes
  - Internal 64-bit processing
  - Adjustable GUI colors
  - Freely resizable window
  - Low CPU consumption
  - Windows 7+ support
  - Mac 10.11+ support, Intel and Apple Silicon
  - Linux ARM (aarch64) and x86_64 support
