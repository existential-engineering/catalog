description: >
  Discover the freshest, hardest, most inspiring sounds for modern production in seconds, with a streamlined library of essential basses, leads, pads, keys, and more, powered by Arturia’s award-winning plugins. Treat your mixes to perfect pro-grade presets for every style, totally free.
details: |-
  Analog lab play is a free software instrument featuring a library of 100 essential, hard-hitting, mix-ready synths, keys, basses, pads, and more. The sound collection includes pianos, organs, analog and digital synths sourced from arturia's award-winning v collection and pigments. Whether creating trap beats, hyperpop bangers, or seeking authentic retro vibes, users can find the right sonic flavors for their style.

  The instrument provides a streamlined and easy-to-use interface with smart browsing capabilities that allow users to search by instruments, sound banks, and instrument types to quickly locate desired sounds. The main view presents inspiration through a curated selection of sounds from arturia's best virtual instrument collection, making sound exploration intuitive and efficient.

  Analog lab play supports MIDI integration with any controller, including minilab, keylab, keystep, and third-party controllers, enabling immediate playback with devices of choice. Users can expand their sound collection through the sound store, which is updated monthly with exclusive sound expansions, allowing creative direction and sonic exploration.

  The 100 presets encompass diverse sound categories including jazz b-3 organ with leslie and reverb, sustained strings with morphing tremolos, atmospheric keys with extended release, sequences with saw waves and filter sweeps, and various synth and pad textures. Each preset is designed as a mix-ready sound suitable for professional music production across multiple genres and styles.
