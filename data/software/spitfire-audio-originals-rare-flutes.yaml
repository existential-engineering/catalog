details: |-
  Originals Rare Flutes bestows an extraordinary collection of flutes, sourced from all over the globe, performed by world-renowned flautist Andy Findon. This library contains woodwinds, such as the Bansuri and Chinese bamboo flute, to add a unique palette to your compositions.

  Delicate and exquisite, these artisanal instruments were purposefully recorded dry in order to allow more control over the sound. With a central focus on the tone of each woodwind and three distinctive signals (Close, Room and Super Reverb), you have the option to give your sound warmth, sharpness or ambience — or blend all three signals to create something truly exquisite.

  Originals Rare Flutes requires the free Splice INSTRUMENT plugin to run.
specs: |-
  - Download size: 3.94 GB
  - 16 presets
  - 3 mic signals: Close, Room, Super Reverb
  - Controls: Reverb, Release, Tightness, Vibrato
  - Includes Bansuri, Chinese bamboo and membrane flutes, Fujara, ocarinas and contrabass flute
  - macOS 12 or later, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
