details: |-
  With Audiobus, the inter-app audio routing system for iOS, you can connect
  your Audiobus-compatible music apps together, just like virtual cables.

  With a simple and clean interface, easily connect the output of one
  audiobus-compatible app into the input of another.

  Use audiobus to play a synthesizer live into a looper or multi-track recorder,
  or use one app to manipulate the live output of another.
specs: |-
  - Inter-app audio routing system for iOS
  - Virtual cable connections
  - Audiobus-compatible app support
  - Simple and clean interface
  - Audio output to input routing
  - Live audio manipulation
