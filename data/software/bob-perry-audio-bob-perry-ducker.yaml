details: |-
  Introducing the first VST3 ducker with real side chain support. Regain control
  over your signal's gain reduction by ducking like it's meant to be done.

  Perfect for voice-overs, podcasting, bass cleaning (I.e. Bass drum over bass),
  pumping effects and much more.

  Bob perry ducker by bob perry audio is a virtual effect audio plugin for macos
  and windows.
specs: |-
  - Real sidechaining
  - Graphical user interface
  - Switchable response algorithm
  - Input, output and gain reduction metering
  - Numeric data input
  - 32-bit and 64-bit versions
  - Input and output gain from -dB to 0db
  - Attack, hold and release: 1ms to 2000ms
  - Gain reduction from 0db to -dB
