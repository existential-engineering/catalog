description: "The Black Distortion plugin modeled on RAT2* distortion pedal will
  be your go-to distortion plugin for every recording, whether it’s rock, blues,
  punk, or jazz. The beauty of the Black Distortion plugin lies in its
  versatility. Used as a primary distortion, it excels at arena rock rhythm
  tones and soaring leads."
details: |-
  The beauty of the Black Distortion plugin lies in its versatility. Used as a primary distortion, it excels at arena rock rhythm tones and soaring leads. Do you have an amplifier plugin with too much headroom? Let the Black Distortion plugin be your dirty channel. Maybe you already love your amplifier plugin distortion. Use the Black Distortion plugin as a boost for solos and get the extra kick you need. The Black Distortion plugin features the legendary filter control. Turn it to the right to roll off brittle high-end frequencies. Having trouble cutting through the mix? Turn it to the left and allow the natural brightness of your instrument to shine through.
