details: |-
  The Black Distortion plugin modeled on RAT2 distortion pedal will be your go-to distortion plugin for every recording, whether it’s rock, blues, punk, or jazz.

  The beauty of the Black Distortion plugin lies in its versatility. Used as a primary distortion, it excels at arena rock rhythm tones and soaring leads.

  Do you have an amplifier plugin with too much headroom? Let the Black Distortion plugin be your dirty channel. Maybe you already love your amplifier plugin distortion. Use the Black Distortion plugin as a boost for solos and get the extra kick you need.

  The Black Distortion plugin features the legendary filter control. Turn it to the right to roll off brittle high-end frequencies. Having trouble cutting through the mix? Turn it to the left and allow the natural brightness of your instrument to shine through.

  Black Distortion plugin dials in the perfect amount of gain, from mild overdrive to full out fuzzy assault, and the volume control lets you dial it in just perfectly against your bypassed clean tone.
specs: |-
  - Modeled on the RAT2 distortion pedal
  - Filter control to roll off high-end frequencies or let instrument brightness through
  - Gain control from mild overdrive to full fuzzy assault
  - Volume control for level matching against the bypassed clean tone
  - Plugin Formats: a VST2, VST3, AAX or AudioUnits compatible host
  - System: an Intel compatible or Apple Silicon CPU, 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
