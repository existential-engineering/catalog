details: |-
  Endless is a free reverb plugin from DDMF designed to create huge, ethereal sound
  spaces that seemingly extend to infinity. Aimed at film music composers, ambient
  producers, and sound designers seeking expansive, larger-than-life textures.

  Beyond its reverb size controls, Endless adds shimmer and detuning capabilities
  for more experimental and otherworldly results.

  Available for Windows (7+), Mac (10.11+, Intel and Apple Silicon), and Linux
  (ARM aarch64 and x86_64). Formats include VST, VST3, AU, and AAX.
specs: |-
  - Reverb size controls
  - Shimmer effect
  - Detuning capability
  - Windows 7+ support (32 and 64 bit)
  - Mac 10.11+ support, Intel and Apple Silicon
  - Linux ARM (aarch64) and x86_64 support
