description: Iconic Strings Professional offers unlimited control and customisation. 2 modern mixes, 2 vintage mixes, 8 microphone positions and our most expressive legatos.
details: |-
  Abbey Road Two: Iconic Strings represents something truly unique, a landmark, one-off sample library consisting of a signature string sound never before available. Captured at Abbey Road's Studio Two, the most famous recording venue in the world.

  Iconic Strings captures five of the world's best players, recorded by GRAMMY-winning engineer Sam Okell using a mouth-watering array of beautiful microphones and recording equipment from the studio's impressive collection. This is your chance to compose using the illustrious and historic Abbey Road signal path. Stunning mixes give you professional, broadcast-level performances with groundbreaking, instant playability plus creativity and control.

  The Professional edition offers the most control and customisation featuring 12 signals including 2 modern mixes, 2 vintage mixes, and 8 microphone positions and some of our most expressive legatos to date.

  The unique sonic fingerprint of Studio Two cannot be replicated elsewhere due to its combination of controlled acoustics and one-of-a-kind equipment, refined over 90 years of innovation. The Vintage mixes were recorded using the vintage REDD desk, parallel compression from the RS124 and all passed through the J37 tape machine. Reverb options include EMT plate and the famous Studio Two Echo Chamber.

  Abbey Road Two: Iconic Strings captures five of London's top string players (V1, V2, Va, Cello, Bass) in detail. A brand-new feature, the Arranger, offers a curated approach to writing with ensemble techniques, giving composers control of the instrument voices and ranges within the string band. The all-new legato programming includes Slurred legato and a Performance legato (with Slurred, Alt Attacks and Fast Runs), and the Professional edition adds a Portamento legato.
specs: |-
  - 12 signals: 2 modern mixes, 2 vintage mixes and 8 microphone positions
  - String quintet recorded in Abbey Road Studio Two (Violin 1, Violin 2, Viola, Cello, Double Bass)
  - Engineered by GRAMMY-winning engineer Sam Okell
  - Vintage mixes via Abbey Road's REDD desk, RS124 parallel compression and J37 tape machine
  - Vintage Mix 2 adds Automatic Double Tracking
  - Mic positions: LCR 1 (3x M50 omni), LCR 2 (3x Chandler REDD.47 omni), Close Condenser, Close Ribbon, Close Vintage, Stereo Ribbon (XY), Stereo Mid (ORTF), Ambient
  - Reverb options including EMT plate and the Studio Two Echo Chamber
  - Arranger tool for controlling instrument voices and ranges within the string band
  - Legatos: Performance Legato (Slurred, Alt Attacks, Fast Runs), Slurred Legato, Portamento Legato
  - Articulations include Long, Sul Pont, Sul Tasto, Harmonics, Trills (Maj 2nd, Min 2nd), Tremolo (plus measured 150 and 180 BPM), Flautando, Spiccatissimo, Spiccato, Staccato, Marcato, Brushed, Pizzicato
  - Live Patch per voice plus Ensemble patches
  - Runs as a dedicated Spitfire Audio plugin, no Kontakt required
  - Spitfire Audio App required for download and installation
  - No serial number, authorisation happens during download
  - macOS 11 to OS 26, Intel and Apple Silicon, 64-bit only
  - Windows 10 or 11, 64-bit, Intel i5 2.8GHz quad-core or AMD Ryzen 5 minimum
  - Minimum 8GB RAM, 16GB RAM recommended
  - Multi-voice arranger needs Intel Core i7 (mid-2015 or newer) on macOS, Intel Core i7 7th gen or AMD Ryzen 7 2700X on Windows
  - 292.4 GB download size, 292.4 GB disk space required during install
