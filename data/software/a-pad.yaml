description: "An analog pad synth. Features: 2 oscillators (each with its own
  adsr). Detune. Phase mod. Low/band/hi pass filter. Flanger and panner, bpm"
details: >-
  An analog pad synth with 2 oscillators, each with its own adsr envelope,
  detune, phase modulation, and low/band/hi pass filter capabilities.


  Features include flanger and panner effects, bpm delay that can run free, and
  2 filter effects that can be bpm synced or free running, along with glide and
  retrigger mono mode.


  The basic sound engine has a hard sound with a metallic quality, but with
  attention to a-pad's filters the sound can be warmed up considerably.


  There is a 'floaty', 'spacey' sound to a-pad that makes any timbre style
  appealing for ambience, with timbres available through the feature set being
  quite useful for those who know how to program traditional subtractive synths.


  Version 3 adds a fantastic gui and improves the overall sound.
specs: |-
  - 2 oscillators with individual adsr
  - Detune
  - Phase modulation
  - Low/band/hi pass filter
  - Flanger
  - Panner
  - Bpm delay (free-running capable)
  - 2 filter effects (bpm synced or free-running)
  - Glide
  - Retrigger mono mode
  - 83 presets
  - VST plugin
  - Windows compatible
