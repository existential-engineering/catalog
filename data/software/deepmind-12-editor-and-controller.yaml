details: |-
  The deepmind 12 editor / controller is a VST and standalone controller that
  integrates the behringer synthesizer deepmind 12 into your DAW.

  It makes sound design easier by providing direct access to the deepmind 12
  parameters, which can be automated and stored with your DAW project.

  You can save new sounds on the deepmind 12 and editor settings as VST presets
  (.fxp).

  With the x-y-pads, all parameters can be selected and controlled.

  It is available as VST and standalone for pc 32/64-bit and mac (64-bit) as
  VST, AU and standalone, and is compatible with deepmind 6.
specs: |-
  - Pc 32/64-bit
  - X-y-pads
  - Parameter automation
  - VST presets (.fxp)
  - Deepmind 6 compatible
