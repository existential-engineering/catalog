description: Three sophisticated resonator models in one module. This Modular
  expansion, created in collaboration with Mutable Instruments, offers up to
  4-voice polyphony and can create everything from bells to whistles, and more.
details: |-
  Excite a material with some sort of energy input and you'll get a noise. The resonant qualities of that material (be it wood, metal, glass, a drum, a trumpet), and the way in which you excite it, will determine the qualities of that sound; amongst other things, its timbre, frequency, and length in time.

  It is this thrilling world of excitation and resonance that concerns the Rings module, originally from Mutable Instruments, and now available in Softube Modular.

  Three Resonator Models in One: modal resonator, emulating plates, pipes, strings, and membranes. Sympathetic strings model, which couples virtual strings and has them vibrate in sympathy. Inharmonic strings; a tonally versatile Karplus-Strong extension.

  Up to Four-Voice Polyphony: Rings is capable of generating up to four virtual strings at a time, allowing for polyphonic strummed textures in a modular environment.

  Living, Organic Sounds: a physical modeling synthesizer, Rings is capable of creating some startlingly realistic noises and textures, from strings and woodwind to drums and bells.
specs: |-
  - Made for Modular, Softube's Eurorack platform
  - The only software version of Rings officially licensed and endorsed by Mutable Instruments
  - Three sophisticated resonator models in one module
  - 'Modal' synthesis imitates vibrating structures
  - 'Sympathetic strings' offers harmonizing drones and overtones
  - 'Modulated/inharmonic string' model is based on extended Karplus-Strong techniques
  - Up to four voices of polyphony, allowing for strummed chords
  - Create everything from bells to whistles, and more
  - Use in-built noise pulse, or an external audio signal, to excite the resonators
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access for downloading installers and managing licenses
  - Three activations
  - 20-day trial, 14-day returns
