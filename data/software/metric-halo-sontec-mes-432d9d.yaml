details: |-
  The Sontec MES-432 has a near mythical reputation among mastering engineers. Introduced in 1972 and created by Burgess Macneal and George Massenburg, it was the first fully parametric EQ ever available. Beyond its functional utility it is prized for its sound, being one of those devices that makes things sound better even when its controls are set to flat, and the parameter value choices coupled with the EQ band shapes and overall responsiveness give the MES-432 a uniquely musical response.

  This plug-in is the digital version of the Sontec MES-432D9, built by Metric Halo after Make Believe Studios and Sontec approached them to make one, and developed from an MES-432D9 that Sontec provided. The stated goal was not merely an emulation but a new Sontec, one that the creator of the original parametric EQ would be happy to associate his name with.

  The EQ provides three parametric bands and two shelves, with support for stereo or M/S operation, stepped controls, input and output gain, and bypass per band, per channel and overall. Some elements of the box tone are under user control, and over-sampling is user-selectable up to 16x.

  A SpectraFoo analyzer and metering are integrated. Many presets are included, the interface size is adjustable and the MH Preset Manager provides cross-platform presets.

  A +DSP version of the plug-in, running with zero latency on hardware, is included with all Metric Halo 3d audio interfaces. Licensing requires an iLok.com account, each license includes two activations, and the license may be installed on the machine, on an iLok dongle or in the iLok Cloud.
specs: |-
  - User-selectable over-sampling (up to 16x)
  - Faithful recreation of the box tone and filter curves of the MES mastering equalizer
  - EQ features three parametric bands and two shelves, with support for stereo or M/S EQ
  - Bypass per band, per channel, and overall
  - Input and output gain
  - Stepped controls
  - User-control of some elements of box tone
  - Integrated SpectraFoo analyzer and metering
  - Many presets included
  - Adjustable UI size
  - MH Preset Manager provides cross-platform presets
  - macOS 10.10 or newer, Intel processor or Apple Silicon, 64 bit
  - Windows 7 or newer, Intel processor, 64 bit
  - AU, VST 2 and 3 or AAX (Pro Tools 11 and newer Native) host on macOS
  - VST or AAX (Pro Tools 10, 11 and 12 and Native) host on Windows
  - iLok.com account required, license includes two activations
