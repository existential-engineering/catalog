url: https://www.reasonstudios.com/devices/parsec-2
description: >-
  Parsec 2 brings the futuristic sound of additive synthesis to the Reason Rack.
  Using additive synthesis by adding overtones to sine wave signals, it creates
  complex timbres ranging from analog-style sounds to rich, animated textures.
  Features two signal generators producing up to 512 sinewaves each, two
  modifiers per generator, envelopes, partial widening controls, audio input,
  and a modulation matrix.
