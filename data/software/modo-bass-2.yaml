description: "The first physically modeled electric bass goes next level with
  expanded edition featuring 8 new basses, patterns section, and advanced
  performance controls."
details: |-
  MODO Bass 2 features 22 physically modeled electric bass guitars with 4 play styles (Finger, Slap, Pick, Mute) and 4-string, 5-string, and 6-string configurations. 32 pickup models provide extensive tonal variety, while tube and solid-state amp models deliver authentic amplification.

  The expanded edition adds 8 new bass models: Fretless Jazz, Fretless Bass Man, Studio Upright, Rockabilly, Horn Bass, Punk Bass, Fusion J-Bass, and Aluminum. The original collection includes '60s P-Bass, '70s P-Bass, '70s J-Bass, Modern J-Bass, Devil Bass, Bass Man 5, Rick n' Bass, Studio Bass, Violin Bass, Thunder Bass, Japan Bass, Flame Bass, Imperial Bass, and Metal Bass.

  Built-in effects include Octaver, Distortion, Chorus, Compressor, Delay, Envelope Filter, and Graphic EQ. Physical modeling delivers infinite velocity layers and round-robins with no sample repetition.
