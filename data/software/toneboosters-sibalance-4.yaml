description: Spectral de-esser and harshness remover that uses advanced perceptual loudness and timbre models to detect excess sibilance and harshness. Reduction is done by spectral processing, for a cleaner and more transparent result without the artifacts other de-essers generate.
details: |-
  Sibalance uses advanced perceptual loudness and timbre models to detect excess sibilance and harshness. The subsequent reduction is done by spectral processing, resulting in a cleaner and more transparent result without the artifacts that other de-essers generate.

  Multiple modes provide variety for de-essing, and mid/side processing allows de-essing of specific spatial elements. Clear visual feedback guides tuning without guesswork.

  Beyond vocals, Sibalance fixes harshness to improve music, speech and podcast tracks.
specs: |-
  - Spectral processing for a more transparent, cleaner result
  - Multiple de-essing modes
  - Mid/side processing for de-essing specific spatial elements
  - 16-channel immersive audio support
  - Clear visual feedback for tuning
  - Harshness reduction for music, speech and podcast tracks
  - Personal, perpetual desktop licence for use on up to 4 computers
  - Resizable user interface, fits every screen and resolution
  - Dozens of color themes
  - Undo, redo and A/B switching
  - Preset management: organize, import and export presets
  - Easy license activation, no hardware dongle required
  - Sample rates of up to 384kHz
  - Windows 10 or up, 64-bit DAW with VST, VST3 or AAX support, Intel or AMD SSE2 processor
  - macOS 10.13 or up, 64-bit DAW with VST, VST3, AAX or AU support, Intel or Apple Silicon processor
  - Linux, 64-bit DAW with VST or VST3 support, Intel or AMD SSE2 processor, glibc 2.31 or up
  - iPadOS / iOS requires an AUv3-compatible host
