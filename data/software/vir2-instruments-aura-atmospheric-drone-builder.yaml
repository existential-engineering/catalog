description: "Aura: Atmospheric Drone Builder is an inspiring sound design tool
  that eliminates all barriers to your creativity."
details: |-
  With aura's central x/y pad you can score in real-time to create compelling
  movement. Automate this real-time movement by recording the x/y pad movement.
  Use your mouse or any external MIDI controller to control the x/y pad.

  Drag any wav or aiff file to one of the four engines and use the power of aura
  with your own library of sounds. From there, customize the sample start, loop
  points, and keyboard mapping.

  Aura features over one hundred professionally designed presets that serve as
  inspirational starting points so you can spend more time making music and less
  time searching for sounds.

  Aura: atmospheric drone builder has been designed for seamless integration
  with komplete kontrol s-series and maschine, offering you a unique hands-on
  experience. Manipulate aura's interface using the controls of all nks
  compatible hardware.
specs: |-
  - Four separate sound engines
  - Central x/y pad
  - Twenty-four effects
  - Ten modulatable effects
  - LFOs
  - Step sequencers
  - Over 100 professionally designed presets
  - Wav file support
  - Aiff file support
  - Sample start customization
  - Loop points customization
  - Keyboard mapping
  - MIDI controller support
  - Komplete kontrol s-series integration
  - Maschine integration
  - NKS compatible hardware support
  - Kontakt player powered
