details: >-
  Apg composer combines a 3-voice fm synthesizer with an implementation of the
  logique analogique sequencer, which triggers notes when a weighted sum of
  different signals exceeds a threshold.


  The app was created from a simulink model without writing app-specific code,
  using the audio plugin generator source code.


  Apg composer by dlab is a mobile audio app and a software application for ios.
  It functions as a standalone application.
