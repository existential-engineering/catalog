details: |-
  MODWHEEL's latest release is all about the bass banjo. The physical instrument
  was originally hand crafted in the 1980s by MODWHEEL's david donaldson and his
  bandmate at the time, stuart porter, for use in their anarchic marching band
  the outsiders. It was built by combining a marching bass drum and a recycled
  double bass fingerboard strung with roundwound bass strings.

  The instrument has a very individual, loud, resonant sound making it a perfect
  candidate for yet another of modwheel's idiosyncratic virtual instruments.
  With the body made from a bass drum, it can also be a great percussion
  instrument.

  The virtual instrument features the bang-on sidekick drumchum. There are a
  number of patches that make full use of the percussion possibilities of the
  instrument, as well as the drum computer and arpeggiator sections within
  kontakt.

  There are two main banjo patches with numerous articulations and performance
  keyswitches: 01 bass banjo-slap mw and 02 bass banjo soprano-slap mw.
  Keyswitches available are: sustain, staccato, mute, chopstick hit, chopstick
  stutter. In addition there are two performance keyswitches that allow a whole
  tone slide up, or whole tone slide down to the played note. A release slap has
  been assigned to the mod wheel for 'slap bass' type use.

  Bass banjo requires a full version of kontakt 5.6.6 or above. It won't work
  with the free kontakt player. Library format and contents: audio recording
  format: stereo, 48 khz / 24-bit. Size of recorded sample pool: ca. 1.07 gb.
  File format of samples: 2058 samples in .ncw / lossless compression format.
  File format of instruments: .nki (built with kontakt v5.6.6).
specs: |-
  - Kontakt 5.6.6 or above required

  - Stereo, 48 khz / 24-bit audio recording format

  - 2058 samples in .ncw lossless compression format

  - .nki instrument file format

  - Two main banjo patches with articulations

  - Performance keyswitches: sustain, staccato, mute, chopstick hit, chopstick
  stutter

  - Whole tone slide up and down keyswitches

  - Mod wheel assigned release slap

  - Three synth patches

  - Bang-on sidekick drumchum

  - Drum computer and arpeggiator sections

  - Approximately 1.07 gb sample pool
