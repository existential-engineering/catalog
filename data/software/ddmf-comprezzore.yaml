url: https://ddmf.eu/comprezzore/
description: "A feature-rich compression plugin offering full control over
  dynamics with a drawable compression curve, customizable attack/release
  settings, and flexible compression algorithms for transient shaping, track
  gluing, and dynamic control."
details: |-
  Double precision compression algorithm
  Drawable compression curve with generalized ratio/threshold controls
  Attack times: 0.01-1000 ms; Release times: 1-5000 ms
  Flexible attack/release shapes (time or dB-based)
  Feed-forward or feed-backward compression modes
  Sidechain with low/highpass filters
  Optional external sidechain input
  Independent stereo or linked operation
  Hold times up to 500 ms
  2x/4x oversampling options
  Wet/dry mixing
  Input/output gain: -20 to +20 dB
specs: |-
  - Double precision compression algorithm
  - Drawable compression curve interface
  - Attack times: 0.01 ms to 1000 ms
  - Release times: 1 ms to 5000 ms
  - Flexible attack/release shapes (time or dB-based)
  - Feed forward or feed backward detection modes
  - Sidechain with low-pass and high-pass filters
  - Optional external sidechain
  - Independent stereo or linked stereo operation
  - Hold times up to 500 ms
  - 2x and 4x oversampling options
  - Wet/dry mixing for parallel compression
  - Input/output gain: -20 dB to +20 dB
  - Customizable VU metering and color palettes
  - Platforms: Windows 32/64-bit, Mac (Intel + Apple Silicon, macOS 10.7+), Linux (ARM + x86_64)
  - Formats: VST, VST3, AU, AAX
