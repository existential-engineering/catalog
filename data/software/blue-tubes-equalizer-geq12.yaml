details: |-
  Original vintage style 12 band equalizer. The bt equalizer geq12 has been
  created to fit all applications for the professional engineer. The large
  number of available EQ bands make the geq12 an ideal companion to parametric
  EQ, it is ideal for recording and mixing, where a professional result is
  required.

  The geq12 is the perfect tool for sculpting the fine detail out of raw digital
  audio. 12 eq bands, adjustable q and brick-wall limiter circuit at the output.

  Blue tubes equalizer geq12 by nomad factory is a virtual effect audio plugin
  for macos and windows. It functions as a VST plugin, an audio units plugin and
  an AAX plugin.
