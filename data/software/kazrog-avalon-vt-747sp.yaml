description: Unleash the commanding pro sound of one of the most trusted processors in recording history. Packed with a velvety 6-band EQ, smooth opto compressor, and powerful Class A tube circuit, Avalon VT-747SP empowers you to unlock your sonic potential.
details: |-
  Avalon VT-747SP is an emulation of the legendary Avalon VT-747SP hardware unit, featuring a silky 6-band passive EQ and opto bus compressor with switchable Class A tube or transistor circuitry.

  The EQ can be routed pre or post-compressor, and the plugin includes parametric sidechain EQ controls for precise compression shaping. Over 130 professional presets are included.

  Processing is available up to 32 kHz sample rate with mastering-grade quality. The plugin ships as a perpetual license with no iLok, dongle, or subscription required, covering multiple devices.
specs: |-
  - 6-band graphic/passive EQ
  - Opto compression with soft to hard-knee limiting
  - Switchable Class A tube or transistor circuitry
  - EQ routing: pre or post-compressor
  - Parametric sidechain EQ controls
  - 130+ professional presets
  - macOS 10.13+; Universal Binary 2 (Apple Silicon & Intel)
  - Windows 10+
  - Linux: VST3, VST2, LV2 compatible hosts
  - AAX requires Pro Tools 12+
  - Perpetual license; no iLok, no subscription
