description: The official Avalon VT-747SP plugin. Class A tube opto-compressor, 6-band passive EQ, and switchable tube/solid-state circuitry. Try it free.
details: |-
  Avalon VT-747SP is an emulation of the Avalon mix and mastering bus processor, offered as a plugin for the first time. Kazrog describes the hardware as trusted by top mixing and mastering engineers for its silky 6-band EQ, musical bus compression, and switchable Class A tube and transistor circuitry, and positions the plugin as a versatile processor for tracks, busses, and masters.

  The dynamics section spans soft opto compression through hard-knee limiting, with master threshold, ratio, attack, and release controls. Low and high-frequency parametric spectral controls are routed into the internal sidechain for frequency-dependent compression, which the page singles out as particularly useful when mastering.

  The TSP (Tube Signal Path) uses three virtual high-voltage dual triode tubes, or switches to the classic Class A discrete transistor sound, for musical tube saturation on demand. The 6-band graphic EQ models the smooth characteristics of an all-passive design, intended to take hard frequency pushes without digital harshness, and can be placed pre or post-compressor. Top end extends to 32 kHz for mastering-tier air.

  The plugin ships with more than 130 custom professional presets from engineers including Michael Brauer, F. Reid Shippen, Joe Carrell, and Lasse Lammert, with additional presets promised in future free updates. Licensing is a 100% perpetual license for multiple devices, with no iLok authorization and no subscription fees. The free demo is time-unlimited but adds random silent output and disables preset saving.
specs: |-
  - Emulation of the Avalon VT-747SP mix and mastering bus processor
  - 6-band graphic EQ modeling an all-passive design
  - EQ placeable pre or post-compressor
  - Opto compression from soft compression to hard-knee limiting, with master threshold, ratio, attack, and release
  - Low and high-frequency parametric spectral controls routed into the internal sidechain
  - TSP (Tube Signal Path) with 3 virtual high-voltage dual triode tubes or Class A discrete transistor mode
  - Mastering-tier top end up to 32 kHz
  - 130+ custom professional presets from engineers including Michael Brauer, F. Reid Shippen, Joe Carrell, and Lasse Lammert
  - Mac: macOS 10.13.x or higher; VST, AU, AAX (64-bit) host required; Universal Binary 2 (Apple Silicon and Intel)
  - Windows: Windows 10 or higher; VST or AAX (64-bit) host required
  - Linux: VST3, VST2, or LV2 host required; tested with Ubuntu, Linux Mint, Debian, and Manjaro
  - Pro Tools 12 or higher required for the AAX version
  - Apple M1 or Intel i5 "Ivy Bridge" CPU or newer strongly recommended
  - 100% perpetual license for multiple devices, no iLok authorization required, no subscription fees
