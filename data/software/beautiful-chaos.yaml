description: A slightly mad key/scale linked pattern generator.
details: |-
  Beautiful Chaos was created to give the feeling of instantly capturing a tiny
  moment of sound and spraying it into a key and scale friendly, swirling cloud
  of musical bliss. More technically, Beautiful Chaos allows the instant
  generation of key and scale linked, random patterns and soundscapes.

  MIDI out mode lets you control external instruments either in your DAW or via
  MIDI with the beautiful chaos engine. The engine includes 508 complimentary
  voices for you to mix and process.

  Fully programmable scale system allows you to either pick from a long list of
  premade scales or easily program your own. Pattern lock stores the last cycle
  of the pattern sequence allowing you to lessen the chaos with ease.

  Easy rhythmic programming features a table that lets you quickly draw in your
  own patterns in up to 32 divisions making odd time programming simple. Dynamic
  randomisation for maximum chaos constantly switches sound in all banks (with
  user defined time intervals), making for awesome evolving soundscapes.

  Instructions are included for replacing the included sounds with your own
  sounds.
specs: |-
  - MIDI out mode
  - 508 complimentary voices
  - Fully programmable scale system
  - Pattern lock
  - Easy rhythmic programming (up to 32 divisions)
  - Dynamic randomisation
  - Key and scale linked pattern generation
