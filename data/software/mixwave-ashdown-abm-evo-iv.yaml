  for mixing bass tones.
details: |-
  Their focus on tone, power, and versatility led to the creation of the ABM series, setting new standards in the industry. Ashdown bass amps have become iconic on major stages worldwide, endorsed by renowned bands and musicians. By collaborating closely with the Ashdown team and employing our advanced component-level modeling techniques, we accurately replicated every nuance and authentic sound of the Ashdown Bass Magnifier. Presenting, MixWave: Ashdown ABM EVO IV .
