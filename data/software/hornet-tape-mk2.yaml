description: HoRNet Tape MK2 is the second version of our tape saturation simulator. It provides you with the classic vintage tape sound
details: |-
  HoRNet Tape MK2 is a software emulation of the classic tape saturation effect that had a profound impact on music production from the 1960s through the 1990s. The update takes the tape saturation experience further with a range of enhancements that replicate the physical characteristics of real magnetic tape, resulting in a more genuine and versatile audio effect for producing, mixing and mastering.

  For those familiar with the original HoRNet Tape, the MK2 version represents a major transformation, featuring improved mathematical models crafted to capture the details of iconic tape decks. These models do not merely replicate the overall sound of analog tape, they incorporate the idiosyncrasies that made each individual tape deck recognizable, including subtle distortion, harmonic warmth and dynamic saturation, from the warmth of older reel-to-reel recorders to the smooth, consistent sound of more modern tape machines.

  Tape MK2 introduces the “Swiss 2 Deck”, a new deck option that expands the tape emulation capabilities. Each deck brings its own set of characteristics, offering distinct sonic textures suited to everything from subtle warmth to full-on tape saturation, so the effect can be tailored from just a touch of analog flavor to a fully saturated vintage sound.

  Oversampling is another addition, reducing the aliasing artifacts that can cause unwanted distortion in digital audio processing. By employing higher sample rates, Tape MK2 keeps the audio clean without sacrificing the warmth and analog character of traditional tape, giving a more accurate emulation.

  A continuous bias control offers precision in calibrating and fine-tuning the saturation characteristics of the sound, and a pre-emphasis high-shelf filter counteracts the natural loss of high-frequency content that occurs during tape recording, replicating the behavior of the “recording EQ” found in professional tape recorders. All of this sits behind a sleek, modern graphical interface designed to streamline the workflow.
specs: |-
  - Software simulation of the vintage tape saturation effect
  - Improved emulation of the physical behaviour of the real magnetic tape
  - Five of the most iconic tape recorders included in the TapeMK2
  - Two different speed for each deck
  - Continuous bias control
  - Optional analog hiss emulation
  - Pre emphasis filter (recording eq)
  - Auto Gain with seven different target levels
  - Group function to copy settings from instances
  - Input and output and be linked to maintain constant loudness
  - Hiss level settings
  - Bypass button
  - Oversampling up to 4x with “auto” option
  - Optional legacy Tape MK1 mode
  - Light and Dark mode UI supported
  - Vector user interface which is sharp on every resolution
  - Apple Silicon native support
  - macOS (10.13 and later) and Windows (Windows 10 and later) support
  - 64-bit on Mac and Windows
  - Audio Units, VST3 and AAX format
  - No copy protection
