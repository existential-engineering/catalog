description: HoRNet Tape MK2 is the second version of our tape saturation simulator. It provides you with the classic vintage tape sound
details: |-
  HoRNet Tape MK2 is a software emulation of the classic tape saturation effect that had a profound impact on music production from the 1960s through the 1990s. It replicates the physical characteristics of real magnetic tape, offering the warmth, character and depth that analog tape is known for when producing, mixing or mastering.

  For those familiar with the original HoRNet Tape, the MK2 version represents a major transformation, featuring improved mathematical models crafted to capture the details of iconic tape decks. The models do not merely replicate the overall sound of analog tape, they incorporate the idiosyncrasies that made each individual tape deck recognizable, including subtle distortion, harmonic warmth and dynamic saturation.

  Tape MK2 introduces the Swiss 2 Deck, a deck option that expands the tape emulation capabilities. Each deck brings its own set of characteristics, offering distinct sonic textures suited to effects ranging from subtle warmth to full-on tape saturation.

  Oversampling reduces aliasing artifacts, and a continuous bias control allows precise calibration and fine-tuning of the saturation characteristics, from a gentle touch of warmth to full analog distortion. A pre-emphasis filter, specifically a high-shelf filter, counteracts the natural loss of high-frequency content that occurs during the tape recording process, replicating the recording EQ found in professional tape recorders.

  The plugin has a modern graphical vector interface that is sharp at every resolution, supports light and dark modes and runs natively on Apple Silicon.
specs: |-
  - Software simulation of the vintage tape saturation effect
  - Improved emulation of the physical behaviour of the real magnetic tape
  - Five of the most iconic tape recorders included
  - Two different speeds for each deck
  - Continuous bias control
  - Optional analog hiss emulation
  - Pre emphasis filter (recording eq)
  - Auto Gain with seven different target levels
  - Group function to copy settings from instances
  - Input and output can be linked to maintain constant loudness
  - Hiss level settings
  - Bypass button
  - Oversampling up to 4x with "auto" option
  - Optional legacy Tape MK1 mode
  - Light and Dark mode UI supported
  - Vector user interface which is sharp on every resolution
  - Apple Silicon native support
  - macOS (10.13 and later) and Windows (Windows 10 and later) support
  - 64-bit on Mac and Windows
  - Audio Units, VST3 and AAX format
  - No copy protection
