description: A lightweight software manager for downloading, installing and
  updating the Tokyo Dawn Labs plugin library, with access to documentation,
  licences and trial editions.
details: |-
  This lightweight software manager is the smoothest way to update, download and install your Tokyo Dawn Labs library. The application grants comfortable access to the latest product updates, documentation and tutorials. It orchestrates the download and execution of individual installers, making it a great choice for people using more than just a few TDR products.

  Fully optional, Collector helps at keeping an overview of your licenses, registrations and installations, and taking advantage of the latest discounts and personal upgrade offers. Acquiring new licenses, installing older plugin versions, or checking out trial editions is a matter of a few clicks.

  Collector is compatible with all modern 64-bit Windows, MacOS and Linux systems.
specs: |-
  - Free download
  - Compatible with all modern 64-bit Windows, MacOS and Linux systems
  - Windows installer, macOS package, Linux Debian/Ubuntu, RPM and archive packages
