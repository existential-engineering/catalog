description: Seamless isolation of drum transients and cymbal bleed. Once you try it, you'll feel limited without it
details: |-
  Silencer is a drum gate built to eliminate cymbal bleed from snare and tom microphones while preserving the natural tone and attack of the drums. Traditional gates simply turn a signal down; Silencer instead cuts the high-frequency bleed from cymbals bleeding into snare and toms while leaving the attack, body, and tone of the drums untouched.

  The plugin has dedicated modes for Snare Top, Snare Bottom, Kick, and Toms, and intelligently filters out other parts of the kit to avoid mis-triggers. True lookahead technology ensures every wanted transient passes through undamaged.

  A precision waveform visualizer works alongside a simple threshold control, and the plugin includes a debleeding circuit knob to tweak the amount of high-frequency de-bleeding, an attenuation control for the closed-gate state, a sustain/release control, a ghost-note toggle that can be automated, and a sidechain mode to trigger the gate from another bus.
specs: |-
  - Dedicated modes for Snare Top, Snare Bottom, Kick, and Toms
  - True lookahead technology so wanted transients pass through undamaged
  - De-bleeding circuit for tunable high-frequency bleed removal
  - Precision waveform visualizer paired with a simple threshold control
  - Attenuation control for amount of gate reduction when closed
  - Sustain/release control for length of ring on each hit
  - Ghost note toggle, automatable to let ghost notes through
  - Sidechain mode to trigger the gate from another bus
