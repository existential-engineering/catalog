  - 2d and 3d control
  - Photo and video processing
  - Procedural still image generation
  - Motion graphics creation
  - Video special effects
  - Animation generation
  - Sound design capabilities
  - Music generation
  - Audio file control
  - Macos compatibility (appkit 10.15, 11, 12, 13, and later)
  - Backward compatible to 10.12
  - Intel processor support
  - Apple processor support
  - Universal 2 binary
  - 44.1k cd quality audio
  - Standalone application
