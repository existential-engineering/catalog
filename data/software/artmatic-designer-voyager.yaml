name: ArtMatic (Designer+Voyager)
manufacturer: u-i-software
primaryCategory: synthesizer
url: https://uisoftware.com/
description: The artmatic creative toolbox (ctx) is a graphics and sound engine
  plus a unique set of two integrated applications for procedurally creating.
details: >-
  The artmatic creative toolbox (ctx) is a graphics and sound engine plus a
  unique set of two integrated applications for procedurally creating still
  images, motion graphics, video special effects, animation, sound design, and
  music.


  Designer has hundreds of graphics and mathematical modules that you can link
  together in countless ways to generate still images for metasynth, animations
  for music videos, and complex sounds for motion pictures. It can be seen as a
  modular synthesizer capable of almost anything that is algorithmically and
  mathematically possible.


  Use it to create all kinds of graphics: decorative images, background
  textures, video effects, fractals, fine-art, motion graphics, sound effects,
  audio loops, and more. You can even use it to process photos and videos, or
  use audio as a math system, that controls 2d, or 3d.


  Voyager renders artmatic 3d objects and generates landscapes from 2d images.
  It has a built-in environment for controlling clouds, sun position, haze, sea
  level for landscape creation. With the no-planet mode, you can also render
  cosmic scenes, with multiple lights, including multiple suns.


  The voyager camera lets you animate all the environmental parameters within
  keyframes and create fly thoughts of your worlds. Place and animate any
  artmatic 3d objects and use designer to adjust their components parameters.
  The "live link" in designer communicates parameter changes to voyager when
  both are running. This allows for editing complex models in designer while
  watching a preview rendered by voyager. It also allows for audio files or
  artmatic audio to be the master controller of objects, clouds, even trees.
specs: |-
