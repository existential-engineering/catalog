description: Real-time collaboration across any DAW bring your tools,
  instruments, and style and connect with anyone with BeatConnect.
details: |-
  Real-time collaboration across any DAW. Bring your tools, instruments, and
  style and connect with anyone with BeatConnect. We designed it for real
  collaboration, and built it for any musician.

  Realtime remote collaboration across any DAW, up to 5 people at the same time.
  Giving you the ability to use your vsts in a shared sequencer environment.

  Beatconnect lets you share sounds, mix, and create your music with up to four
  people in a real-time shared environment. Everything you need in one app.

  Beatconnect gives users a shared sequencer, cloud storage, video chat and
  more. Spend more time making music and less time juggling apps and services.

  Supported daws: logic pro, ableton live 10 11, fl studio 20, cubase 10 - 12,
  nuendo 11, studio one 5, reaper 6, reason 11, audition cc, premiere pro cc.
specs: |-
  - Real-time remote collaboration
  - Up to 5 people simultaneous collaboration
  - Shared sequencer environment
  - Cloud storage
  - Video chat
  - Text chat
  - Offline project access
  - VST compatibility
