details: |-
  The Cherry Audio CA2600 is a powerful, self-contained duophonic synthesizer
  inspired by the groundbreaking ARP 2600 synthesizer. Every aspect of the
  original, from the quirky oscillator waves, to the powerful ladder filter, to
  the external audio input and preamp section was modeled with tremendous
  precision.

  Though it features similar functionality, it's been thoughtfully updated for
  increased flexibility with semi-normalled patch cabling, integrated effects,
  and no hidden windows or menus in the audio path. CA2600 delivers an
  unprecedented hands-on, everything right in front of you vintage synthesis
  experience like no other.

  Wildly flexible, capable of chunky basses, cutting leads, super-creative
  external audio processing, absolutely insane effects, and so much more, the
  CA2600 is a comprehensive recreation of the iconic ARP 2600 with modern
  enhancements.

  With over 300 presets, monophonic and duophonic voice modes, a vintage-correct
  multi-mode filter with 12dB and 24dB slopes, and selectable color schemes,
  CA2600 includes both virtual instrument and effect plug-in versions for
  maximum versatility.
specs: |-
  - Every aspect precisely modeled in exacting detail
  - Over 300 presets
  - Monophonic and duophonic voice modes
  - Vintage-correct multi-mode filter with 12dB and 24dB slopes
  - Integrated fully CV-controllable distortion, reverb, and delay with sync
  - Sidechain audio input for external signal processing
  - Flexible CV routing
  - Advanced patch cabling with unlimited mults per jack and drag movement
  - Additional LFO with six waveforms and tempo sync
  - Virtual instrument and effect plug-in versions included
  - Voltage processors section with additional VCA and half-step quantizer
  - One-click UI magnification
  - Selectable color schemes (blue, gray, black/orange)
  - Full MIDI control and DAW automation
