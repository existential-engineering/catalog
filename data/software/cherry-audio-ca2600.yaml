details: |-
  The Cherry Audio CA2600 is a powerful, self-contained duophonic synthesizer inspired by the groundbreaking ARP 2600 synthesizer. Every aspect of the original, from the quirky oscillator waves, to the powerful ladder filter, to the external audio input and preamp section was modeled with tremendous precision.

  Though it features similar functionality, it has been updated for increased flexibility, with semi-normalled patch cabling, integrated effects, and no hidden windows or menus in the audio path, for a hands-on vintage synthesis experience.

  The instrument is wildly flexible, capable of chunky basses, cutting leads, external audio processing, and extreme effects.

  CA2600 is available in AU, VST, VST3, AAX, and standalone formats. A free 30-day demo is available, which plays white noise periodically but is otherwise unlimited.
specs: |-
  - Every aspect precisely modeled in exacting detail
  - Over 300 presets
  - Monophonic and duophonic voice modes
  - Vintage-correct multi-mode filter with 12dB and 24dB slope
  - Integrated, fully CV-controllable distortion, reverb, and delay with sync
  - Sidechain audio input for external signal processing
  - Flexible CV routing
  - Advanced, next-generation patch panel cabling system from Voltage Modular
  - Multiple voice assign modes
  - Advanced patch cabling with unlimited mults per jack, quick patch for rapid multiple destination routing, and click and drag movement of multiple connections
  - Additional LFO with six waveforms and tempo sync
  - Virtual instrument and effect plug-in versions included
  - Voltage Processors section with additional VCA and 1/2-step quantizer
  - Advanced one-click UI magnification
  - Selectable blue, gray, or black/orange color schemes
  - Full MIDI control
  - Full DAW automation for all controls
  - Preset level MIDI mapping/automation
  - Preset favoriting from the toolbar
  - macOS 10.13 or above, macOS 13 Ventura supported, 64-bit required, native Apple M1 or greater processor support including Ultra, 3.4 GHz Quad-Core or M1 CPU with 8GB of RAM recommended
  - Windows 7 or above (including Windows 11), 64-bit required, quad-core computer with 8GB of RAM recommended
  - Internet connection required for product activation
