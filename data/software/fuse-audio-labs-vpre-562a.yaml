description: An emulation of a vintage tube-based low-wattage amplifier from the early 1960s (model 562A), originally designed as a PA amplifier before being adopted by UK bands for guitar and bass. The circuit features an EF86 gain stage, an ECC82 phase splitter, and two 6L6 push-pull pentodes driving the output transformer, with a passive tonestack implementing two rolling shelf filters. Ranges from subtle vintage coloration to full-on gritty distortion.
details: |-
  Emulates a vintage 1960s tube amplifier (model 562A, originally PA amp, later adopted as guitar/bass amp by UK bands). Circuit: EF86 gain stage, ECC82 phase splitter, two 6L6 push-pull output pentodes, output transformer, passive tonestack with two rolling shelf filters. Despite being named VPRE-562A (Virtual Preamp), this is technically a tube amp emulation, not a studio mic preamp. Ranges from subtle coloration and gentle EQ to heavy gritty saturation.
specs: |-
  Controls: Drive (input gain), Tone (passive tonestack, two rolling shelves), Level (output). macOS 10.9+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+ (32-bit and 64-bit), 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX. Copy protection: serial number.
