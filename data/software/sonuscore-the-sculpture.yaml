description: A metallic sound design instrument sampled entirely from one
  stainless steel sound sculpture, covering bowed, struck and granular textures.
  Runs in the free Kontakt Player.
details: |-
  The Sculpture is a metallic sound design instrument built entirely from one art object, a multi-cut stainless steel sound sculpture by German sculptor Klaus Gündchen. Nothing is layered from another source or synthesised: the resonant structure was recorded across its entire body, the large upper and lower plates which ring out with a huge, almost synth-like sound when struck, and the thin connecting rods which add granular detail. Only around ten of these hand-built sculptures exist, and each one is different.

  The instrument was captured from four microphone perspectives. Close gives the immediate, intimate detail of the metal as a tight, direct, front-and-centre sound; Far picks up the natural room acoustics for depth, width and spacious ambience; Contact is mounted directly to the metal surface to record raw physical vibrations and attack detail with zero room bleed; and a Blumlein pair is positioned inside the physical structure to capture the instrument's internal resonance from within the body itself. Blending them moves the sound from tight and present to wide and roomy.

  The articulation set covers mallet hits with different beaters and surfaces (soft mallets, hard mallets, metal mallets, fingers, brush), rolls, bowed tones, rubberball techniques and extended FX textures. Drawing a violin bow across the rods produces long sustained tones with a vocal, almost whale-like quality, striking the plates gives weight and impact, and working the rods yields fine granular detail.

  It ships as two instruments. The Single instrument models the experience of playing the original sculpture, direct and responsive, suited to tension cues built from intimate metallic hits or sparse, haunting textures. The Engine layers five voices, two freely playable, two arpeggiators and one granular, with slot and master effects, for evolving sound design aimed at sci-fi and horror layering, driving percussive beds and unsettling granular soundscapes. The whole library runs in the free Kontakt Player with no full Kontakt licence required.
specs: |-
  - Every sound sampled from a single handmade multi-cut metal sound sculpture by German artist Klaus Gündchen, never layered or synthesised
  - Four microphone perspectives: Close, Far, Contact (mounted to the metal surface), and an internal Blumlein pair inside the structure
  - Full articulation set: mallets (soft, hard, metal), fingers, brush, rolls, bowed tones, rubberball techniques and extended FX textures
  - Recorded across the whole body of the sculpture: the large upper and lower plates and the thin connecting rods
  - Two instruments in one: a direct, playable Single instrument and a five-layer Engine instrument
  - Engine layers five voices: two freely playable, two arpeggiators and one granular, with slot and master effects
  - 5-6 GB of sample content
  - Works with the FREE KONTAKT PLAYER, no full Kontakt licence required
  - Requires KONTAKT Version 7.10.9 or higher
  - Loads as a plug-in inside any DAW that supports VST3, AU or AAX
  - Apple Silicon Macs: macOS 13, 14 or 15 (latest update)
  - Intel Macs (i5 or higher): macOS 13, 14 or 15 (latest update)
  - Windows 10 or 11 (latest Service Pack), Intel Core i5 or equivalent CPU
  - Graphics hardware support for OpenGL 2.1 or higher and Direct 3D 11.1
  - 4 GB RAM (more recommended)
