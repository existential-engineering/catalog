description: Track Symbiosis is a precise ducking tool. It reduces signal level of main input according to sidechain input level.
details: |-
  Track Symbiosis is a precise ducking tool. It reduces signal level of main input according to sidechain input level.

  Ducking mixes two signals by reducing the main input signal so that it gives a room to the side-chain signal, in contrast to mixing the two without any level reduction.

  Despite ducking can be done by general purpose sidechain compressor, Track Symbiosis still has quite advantages on preciseness of reduction curve and intuitive user interface.

  Since Track Symbiosis's functionality is based on sidechain function of each plugin format, it is not provided in VST2 plugin format.
specs: |-
  - Precise envelope detection and ducking
  - Insightful composition of three envelope detection algorithms
  - Envelope adjustment by soft clipping
  - Distortion suppression
  - Sidechain channel selection
  - Intuitive user interface
  - Supports 44.1k - 384kHz Sample Rate
  - 64-bit Floating-point Internal Precision
  - Latency Compensation
  - Factory Preset
  - User Preset
  - Snapshot
  - Undo/Redo
  - Reset to Default
  - Windows: x64-compatible CPU, Windows 11 24H2 / 25H2
  - Mac: Intel / Apple Silicon, macOS Monterey 12 through macOS Tahoe 26
  - Windows plugin formats: VST3, AAX-Native, CLAP
  - Mac plugin formats: VST3, Audio Unit, AAX-Native, CLAP
