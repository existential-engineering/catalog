description: A precision ducking tool that reduces signal level according to
  sidechain input, offering precise envelope detection with advantages over
  general-purpose sidechain compressors.
details: |-
  Track Symbiosis is a specialized ducking plugin that reduces the signal level
  of a main input according to sidechain input level. It provides more precise
  envelope detection and ducking behavior compared to general-purpose sidechain
  compressors.

  The plugin features three envelope detection algorithms, each suited for
  different types of source material and ducking scenarios. Envelope adjustment
  via soft clipping provides smooth and musical reduction curves.

  A distortion suppression feature prevents artifacts that can occur during
  rapid level changes. Sidechain channel selection allows precise control over
  which elements trigger the ducking behavior.

  The intuitive user interface makes it easy to set up complex ducking
  relationships between tracks, with advantages in reduction curve accuracy
  compared to using a standard compressor's sidechain input.
specs: |-
  - Three envelope detection algorithms
  - Envelope adjustment via soft clipping
  - Distortion suppression
  - Sidechain channel selection
  - Sample rates: 44.1kHz to 384kHz
  - 64-bit floating-point internal precision
  - Latency compensation included
