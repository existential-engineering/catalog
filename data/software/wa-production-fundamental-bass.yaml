description: Fundamental Bass splits a signal at an adjustable crossover and processes the low and high bands separately, with twin compressors and stereo imaging on the low band and compression plus saturation on the high band. Filters, mix ratio dials and a master clipper shape the result.
details: |-
  Bass lines are difficult to balance at the mixing stage because the dynamic range of low-end material can be very wide. Leaving them untouched risks unbalancing the rest of the mix, while compressing too heavily drains the life out of the sound. Fundamental Bass tightens the dynamics of the low end while keeping the snap and sparkle of the mids and highs.

  The processing runs through an adjustable frequency split that feeds two separate modules. The low band carries twin compressors plus imaging adjustment for clarity and mono compatibility, and the high band compresses and adds grit to enhance natural harmonics while keeping the bounce of the bass. Green marks the low module and yellow the high, and each has its own on and off button, gain slider and mix ratio dial.

  In the low module, the Balance dial sets a compression level with up to 60 dB of attenuation and applies make-up gain automatically, while the Flatten dial is a more aggressive compressor for very bouncy bass lines or acoustic material with a wide dynamic range. In the high module, Balance introduces gentle compression and Drive adds tube-style saturation at low settings, moving into full distortion when pushed harder.

  A high pass filter handle sets a lower frequency limit so a bass line can be moved out of the way of a kick drum, and a low pass filter handle removes high frequencies that conflict with other instruments. Independent stereo imaging sliders for the two modules allow the low band to be collapsed to mono while the high band stays in stereo.

  Independent gain controls and mix ratio dials allow parallel processing for either subtle changes or heavier treatment. A master clipper smooths the outgoing dynamics and an output level slider supports accurate comparison through the pop-free bypass. A live frequency display sits at the top of the interface, with separate green and yellow meters matching the two modules, and factory and artist presets cover full-range bass compression through to frequency-specific transformations.
specs: |-
  - Frequency-split bass processor with an adjustable crossover
  - Low module: Balance compressor with up to 60 dB attenuation and automatic make-up gain
  - Low module: Flatten dial for more aggressive compression
  - High module: Balance compression and Drive for tube-style saturation through to distortion
  - Independent stereo imaging sliders for the low and high modules
  - High pass and low pass filter handles
  - Independent gain sliders and mix ratio dials per module
  - Master clipper and output level slider
  - Pop-free bypass control
  - Live frequency display with separate meters per module
  - Factory and artist presets
  - PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
