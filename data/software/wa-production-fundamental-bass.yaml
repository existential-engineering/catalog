description: "Multiband bass processing plugin with frequency-split compression,
  stereo imaging, and saturation for tightening low-end dynamics while
  preserving mid and high snap."
details: |-
  Frequency-split low/high band processing. Twin compressors in low module with Balance and Flatten dials. High module with gentle compression and Drive saturation. High/low pass filters. Split-stereo imaging. Visual frequency display with real-time monitoring. Master clipper and gain controls. Factory and artist presets.
specs: |-
  Windows 10/11 (64-bit). macOS 10.15+ (64-bit). Apple Silicon native support. ProTools 12+ for AAX.
