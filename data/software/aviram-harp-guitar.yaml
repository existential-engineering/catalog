details: |-
  Aviram Harp Guitar v1.2 includes 8 articulations with multiple guitar
  configurations featuring harplyre, holloway, mandolin, chitarpa, balalaika,
  knutsen harp guitar lyres, zither, and tamburica instruments.

  Guitar 1 features connection between 10 groups of scratch (trigger) and 40
  groups of plucked round robin, with 2-mode modulation that cancels scratch
  sound when modulation goes up, changing to tamburica together with harmonics.

  Guitar 2 provides the main slide sound with various types and velocity speed,
  connected to harplyre harmonics with 15 groups of round robin and 46 groups of
  plucked variable and round robin with legato, featuring 2-mode modulation.

  Guitar 3 includes background strum with 6 groups and connection between 10
  groups of scratch (trigger) and 20 groups of plucked round robin, with 2-mode
  modulation affecting scratch and plucked sounds.

  Guitar 4 features background powered-reverb, vibrato, and pads with 9 groups,
  connected between 15 groups of scratch (trigger) and 47 groups of plucked
  round robin, with 2-mode modulation capabilities.
