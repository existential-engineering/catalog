details: >-
  Abbey road rs56 passive eq by waves is a virtual effect audio plugin for macos
  and windows. It functions as a VST plugin, an audio units plugin, a VST 3
  plugin and an AAX plugin.


  Even the most modern productions revere the classic sounds of the 50s and 60s
  like those from the rs56, the very first parametric eq. A silky smooth,
  powerful and musical stereo eq, rs56 is perfect for loops, drums and synths,
  or the entire mix bus.


  Created in the early 50s for mastering, the rs56 was used extensively in the
  vinyl cutting rooms. But before long, abbey road's recording engineers
  realized it was superior to the basic tone controls found in that era's
  consoles and it quickly became a go-to option, famously heard on the beatles'
  recordings.


  Developed in close collaboration with abbey road studios. Precise modeling of
  the rare gear used on classic recordings. Models the velvety, transparent
  sound of passive equalization.


  37 presets showcase the rs56's classic qualities. Includes helpful, modern
  enhancements to the original.
