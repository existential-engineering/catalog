description: From samples to songs. Atlas 2 is a sample organiser and drum machine combined.
details: |-
  Atlas 2 is a sample organiser and drum machine combined. It has been designed
  with one goal in mind, to bring as much inspiration as possible to writing
  drum beats and rhythm elements.

  The atlas workflow consists of each major stage of beat-making: map - ai scans
  sample folders and finds and categorises samples grouped by their
  characteristics (eg. Deep long kicks, snappy snares). Drum kit - fill in drum
  slots yourself or let atlas suggest a whole kit with one button press. Sample
  - pitch, pan, filter, change the volume envelope, reverse the sample and more.
  Sequencer - feels fast to use like a step sequencer but lets you mix and match
  different timings (eg. Put a hi hat triplet fill at the end of the beat).
  Generate variations of your beat with a button press. Browser - build your own
  library of beats or use the in-app download to get free content packs.

  Features include ai that finds and categorises samples, zoomable 2d maps
  organised by sample characteristics, drum kits with 8, 16, or even 64
  channels, ui that can match hardware controller, multi-channel output, and a
  powerful drum sequencer that combines the speed of a traditional step
  sequencer with the flexibility of a piano roll.

  Mix and match saved drum kits and sequences to quickly create new beats.
  Variation engine for adding humanisation/randomisation to sample parameters.
  In-app free content pack downloads. Embed samples in DAW projects (no more
  missing sample files).

  Available as standalone, vst2, vst3, and AU. 64-bit only. Mac (intel): macos
  high sierra 10.13 and above. Mac (apple silicon: native & rosetta): macos big
  sur 11 and above. Windows: windows 7 and above. Linux (beta): ubuntu 16.04 and
  ubuntu 18.04.
specs: |-
