details: |-
  2 Click 2 Reset will simply reset conveniently your plugins parameters with a
  double click instead of holding ctrl/alt then clicking.

  It was created to reset acustica audio's plugins but will work with many other
  brands like ik multimedia, psp, fabfilter, plugin alliance, ssl, waves, and
  others.

  If you hate using your second hand to reset a parameter after tweaking, you
  will like this.
specs: |-
  - Double-click parameter reset
  - Windows compatible
  - Pro Tools compatible
  - Fl studio compatible
  - Harrison mixbus compatible
  - Ableton live compatible
  - Samplitude compatible
  - Reaper compatible
  - Cubase compatible
  - Studio one compatible
