description: Polygon 2 is a hybrid sampler plugin combining four polyphonic
  sampler modules with granular and classic playback modes, a dual oscillator
  with FM modulation, and an extensive node-based modulation system. It is
  designed for creating experimental composite sound effects and abstract
  instrument patches, and ships with 100 factory presets and a 1.3 GB sample
  bank.
details: |-
  Polygon is a hybrid sampler plugin designed to facilitate the creation of experimental composite sound effects and abstract instrument patches.

  Version 2 features a fully re-designed scalable user interface and we have completely revamped nearly every aspect of the plugin. Polygon's new granular mode will catapult your samples into uncharted realms while its clean and logical interface, extensive modulation options and powerful new dual oscillator make it an invaluable tool for music production and creative sound design.

  With its 4 Granular Samplers, Dual Oscillator with FM, 4 Modulation Sequencers, 8 LFOs, Modulation Utilities, Dual Insert Effects per sampler, Global Filter, Dual Global Effects, Comprehensive Randomizer, Variable Polyphony, specially curated Factory Sample Bank and 100 Factory Presets, Polygon brings sound designers and musicians a powerful new sound sculpting instrument.

  At the heart of Polygon, you will find 4 Sampler modules featuring a new granular mode as well as the classic playback and loop modes found in previous versions of the plugin. Each of these samplers also feature two user-definable insert effects slots. The fully redesigned Dual Oscillator features a modulatable FM section. At Polygon's core, you will find two redesigned Filters and two user definable Global Effects processors at the end of the signal path. Polygon's modulation system has also been fully overhauled. It now features a node-based, drag & drop modulation system similar to our other sampler, Palindrome.

  The modulation section is now accessible via a new tabbed interface with 4 Modulation Sequencers which feature adjustable curves on a per-step basis, as well as 8 LFOs and a number of unconventional Modulation Utilities. We've also implemented a completely redesigned Randomizer panel where you can randomize nearly all of the plugin's parameters in isolation and/or randomize various groups of parameters simultaneously. For Polygon 2.0, we curated a new 1.3 GB sample bank derived from our latest sound effects products. We also included a wide variety of factory presets from some of our best designers.
