description: Polygon 2 is a hybrid sampler plugin combining four polyphonic sampler modules with granular and classic playback modes, a dual oscillator with FM modulation, and an extensive node-based modulation system. It is designed for creating experimental composite sound effects and abstract instrument patches, and ships with 100 factory presets and a 1.3 GB sample bank.
details: |-
  4 Polyphonic Sampler Modules
  Granular & Classic Playback Modes
  Dual Oscillator with FM Modulation
  4 Modulation Sequencers & 8 LFOs
  Modulation Utilities with Node-Based Drag & Drop System
  Dual Insert Effects Per Sampler
  Dual Global Effects
  Variable Polyphony
  Comprehensive Randomizer
  100 Factory Presets
  1.3 GB Sample Bank
