description: MFC-Edit is the official editor for the MFC-101 MIDI Foot
  Controller, a Java application for Mac, Windows and Linux.
details: |-
  MFC-Edit is the official editor for the MFC-101 MIDI Foot Controller, making it easier than ever to edit Instant Access Switches, Presets, Songs and Sets.

  It also covers External Switches and Pedals, Internal CCs, ProgramChange Maps, Axe-Fx Preset Transmit Maps, MIDI channels and settings, Custom Midi Messages, Performance Modes and Banks, and everything else the MFC-101 can do.

  It can also convert between the Mk I, Mk II and Mk III models of the MFC-101.

  MFC-Edit is a java application for Mac, Windows and Linux.
specs: |-
  - Edits Instant Access Switches
  - Edits Presets, Songs and Sets
  - Edits External Switches and Pedals
  - Edits Internal CCs and ProgramChange Maps
  - Edits Axe-Fx Preset Transmit Maps
  - Edits MIDI channels and settings, and Custom Midi Messages
  - Edits Performance Modes and Banks
  - Converts between Mk I, Mk II and Mk III models
  - Java application for Mac, Windows and Linux
