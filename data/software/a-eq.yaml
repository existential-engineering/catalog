details: |-
  A-eq introduces a modular approach with eight interchangeable modules, allowing you to extensively customize your signal path. It includes four bands reminiscent of the famous and powerful american classic eq unit, along with three additional bands offering continuously adjustable parameters.

  The preamp and filters module further refines your audio. Additionally, each band features the hiq mode, which maintains the original hardware's bell-shaped characteristics but with a narrower bandwidth, providing precise and surgical control over your audio.

  A-eq's design prioritizes creative freedom and puts complete control of your audio processing experience in your hands. All-in-all, a-eq combines the most up-to-date modular functionality and ease of use with exciting features that open up a wide variety of new sonic possibilities.

  4 stepped based bands - faithful to the original 550 model. Instantly achieve the classic tones of the original american hardware. 3 free continuous bands - fine and professional curves with freely adjustable values.

  Preamp & filter - 2 saturation options from the 212 preamp model, going from subtle to aggressive with outstanding functionality all across the board. High and low pass filters truthful to the original 215 filter design.
