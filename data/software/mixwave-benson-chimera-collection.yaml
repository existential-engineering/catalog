description: A collection of software emulations modeled on Benson Amps' Chimera
  guitar amplifier and related pedals, including delay, modulation, boost,
  preamp, fuzz and spring reverb effects. Includes a modeled 2x12 cabinet with
  multiple speakers and virtual microphones.
details: |-
  Sought after by guitarists, recordists and engineers all over the world, Benson Amps are some of the most coveted boutique amplifiers and effects in existence. Utilizing component level modeling, and with the aim to create a flawless replica that would satisfy Christopher Benson's discerning ears, we were able to create a virtual model that brings the signature sound of these devices into a digital counterpart for the first time. We proudly present, MixWave: Benson Chimera Collection .
