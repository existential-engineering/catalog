details: |-
  Gaffel ("Fork" in Swedish) is a simple tool that splits audio into different frequency bands. Using it on multiple channels lets you use your favorite plugins as multiband effects. The different crossover frequencies are globally synchronized between grouped instances of the plugin, making it convenient to work with in any DAW.

  The classic Linkwitz-Riley crossover filter algorithm gives the sum of all bands a flat amplitude response and a smooth changing phase response.

  Set up: duplicate the signal to up to four channels, add Gaffel to these channels, then add any effect on only the desired frequency band(s).

  Three crossover frequencies are synchronised among all instances of the plugin that belong to the selected group. Hold down the option key while dragging for finetuning. The four frequency bands can each be toggled on or off by clicking, and frequencies only sync within the selected group.

  None
specs: |-
  - Linkwitz-Riley crossover filter algorithm
  - Frequency parameters are synchronised globally between instances
  - Supports up to 8 different groups
  - Resizable window
  - Up to four frequency bands
  - Three crossover frequencies, with option-key finetuning
  - Individual on/off toggling per frequency band
  - Requires macOS 10.10 or later (optimized for the M1-processor), Windows 7 (SP1) or later
  - Requires an AU, VST or AAX compatible 64-bit host
  - 64-bit only
