name: Arpomaniac
manufacturer: fanan-team
primaryCategory: synthesizer
url: https://fanan-team-com.base44.app/arpomaniac
description: Whether you are warm analog sound addict or cold blood screamers
  fanatic, you'll probably love arpomaniac's tone's philosophy.
details: >-
  Arpomaniac is the first member of our cosmic pack and is basically 3
  oscillators synth with a built in arpeggiator that modeled by using 3
  different synthesis methods: subtractive, physical modeling and ring
  modulation. It armed with 2 totally independent wavetable oscillators and 1
  dedicated pad oscillator that creates many kinds kinds of atmospheric sounds.


  It also armed with 6 built-in effects with separate oscillator connectivity
  and mixing, 3 modulation lfos (1 per osc) 3 modulation envelops (1 per osc),
  modulation matrix, 10 filter types, ring modulator, spread modulator, noise
  generator, random phase generator, full mono mode functionality (per osc), new
  modeled chords arpeggiator with built-in 999 arpeggios seeded, a dominator for
  internal ducking hierarchy and indeed, the icing on the cake, the special
  character feature.


  The special character feature is actually a short-cut which allows the sound
  designer to achieve many types of sounds and tones that need a complex
  programming in most easiest way. Only 3 knobs create everything from screaming
  to glassy, from picky to metallic. From sharpy to heavy and in combination
  with the oscillators, many interesting musical (and well, also non-musical)
  sounds can be explored.


  Arpomaniac's arp is an already programmed machine that shoots out 999 built-in
  arpeggios and shines when it comes to chords. It recognizes all kind of chords
  and follows it's notes perfectly. It can be set to any time signature and
  speed, synced to the DAW's bpm. It can also randomize one of it's 999
  combinations during playing with the "random" knob, switch note lengths and
  speed and even play across few octaves.


  The dominator utilizes the independence of the oscillators to create an
  internal hierarchy between them and by that, to let the user decide which
  oscillator will be the dominant (and a cross what frequency zone) and which
  will remain side-chained slaves. The hierarchy ducking effect is critical
  especially when running complex arpeggios.
