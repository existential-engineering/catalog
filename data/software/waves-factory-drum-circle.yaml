description: 2, 4 and 8 drummers playing together in the same recording studio, creating a powerful rhythm circle that you can't beat. The energy that is created when 8 drummers play together can't be simulated.
details: |-
  Drum Circle is an epic drum ensemble library for Kontakt built around the question of what happens when you put 8 drummers playing together in a recording studio. It was recorded at Sonoteque Studios with session drummers using premium drum kits whose tunings were matched to create the fullest possible sound, and it is inspired by the soundtrack of the movie Man of Steel.

  The library offers not just 8 players but also 2 and 4 player ensembles, so small and intermediate settings can be created, all selectable from the GUI. The energy produced when 8 drummers play together cannot be simulated by layering 8 different drum libraries.

  A full mixer controls the microphone positions separately, with a load/purge switch for each channel, pan, width, volume, mute, solo, phase shift and an output selector for mixing the different channels in your DAW.

  In the effects page any effect can be added in any order, including EQ, compressors, modulation effects, distortion, saturation, tape machine, reverbs and amp simulators. From the settings page you can control round robin, a velocity curve for adjusting the velocity of incoming MIDI notes, remapping of any articulation to any key, and an envelope with attack and decay controls.
specs: |-
  - 2, 4 and 8 player drum ensembles, selectable from the GUI
  - Size: 2.81 GB
  - 6,121 samples
  - 4 mic positions
  - 6 velocity layers
  - 6 round robin
  - Recorded at Sonoteque Studios with premium drum kits and matched tunings
  - Full mixer with load/purge, pan, width, volume, mute, solo, phase shift and output selector per channel
  - Effects page with freely ordered DSP effects: EQ, compressors, modulation, distortion, saturation, tape machine, reverbs and amp simulators
  - Settings page with round robin, velocity curve, articulation remapping and attack/decay envelope controls
  - Works with Kontakt 5.7.3 and newer versions
  - Full version of Kontakt required (Kontakt Player will run in demo mode)
