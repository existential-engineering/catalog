description: The go-to plugin for mix referencing. Instantly hear how your mix
  compares to commercially released tracks, mixes and masters with a click of
  the A/B button, with deep insights into critical metrics like loudness LUFS
  and dynamics PSR and a complete suite of analysers including spectrum, stereo
  and correlation.
details: |-
  ADPTR AUDIO's Metric AB is the go-to reference plugin for seeing and hearing
  how your mix compares to commercially released songs with the click of an A/B
  button. All the reference meters you need for mixing and mastering.

  Drag and drop up to 16 reference tracks into Metric AB. Match the loudness of
  your mix and every reference track at once with four different
  loudness-matching modes. Sync the playback of reference tracks with your DAW
  and set cue markers to play references at the beginning of different song
  sections.

  Metric AB features world-class FFT spectrum analyses with multiple graph
  types, multiband correlation metering showing phase relationships throughout
  the frequency spectrum, a Spectral Pan display for stereo image analysis, PSR
  dynamics measurement, and comprehensive real-time loudness meters including
  Integrated, Short-term and Momentary Loudness alongside Loudness Range, PLR,
  RMS and True-Peak metrics.

  The History graph shows how loudness metrics play out through the entirety of
  a track, enabling identification of problem spots that could be missed when
  using just the real-time meters. Loudness targets help guide you to achieve
  the ideal balance of density and dynamics.
specs: |-
  - Up to 16 reference tracks via drag and drop
  - Loudness matching with 4 modes
  - DAW-synced playback with cue markers
  - FFT spectrum analyser with multiple graph types and zoom link
  - Multiband correlation metering
  - Spectral Pan stereo image display
  - PSR dynamics measurement
  - Real-time meters: Integrated, Short-term, Momentary Loudness
  - Loudness Range, PLR, RMS, True-Peak metrics
  - History graph for loudness over time
  - Loudness targets
