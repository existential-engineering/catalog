description: The go-to plugin for mix referencing. Instantly hear how your mix
  compares to commercially released tracks, mixes and masters with a click of
  the “A/B” button.
details: |-
  ADPTR AUDIO’s Metric AB is the go-to reference plugin for seeing and hearing how your mix compares to commercially released songs with the click of an “A/B” button. Insert Metric AB on your master channel, key bind the “A/B” button, and quickly toggle between mixes using your keyboard.

  Drag and drop up to 16 reference tracks into Metric AB. Match the loudness of your mix and every reference track at once. There are four different loudness-matching modes to choose from. Sync the playback of reference tracks with your DAW, and set cue markers to play references at the beginning of different song sections.

  Metric AB’s FFT spectrum analysis features multiple graph types, with a zoom link feature that enables maximum viewing space on the UI. Going beyond traditional correlation metering, it presents a multiband view of the phase relationship throughout the whole frequency spectrum, showing which parts of the signal are producing the wider stereo information and which parts are in or out of phase.

  The Spectral Pan display checks the comparative left-right gain of the track over the whole frequency spectrum to make sure the mix is balanced. The PSR metric, a measurement of Peak to Short Term Loudness, provides insight into how compressed the audio is: high PSR values represent a wide dynamic range, whereas low PSR values indicate music is squashed.

  Real-time meters compare Integrated, Short-term and Momentary Loudness alongside Loudness Range, PLR, RMS and True-Peak metrics. The History graph shows how the loudness metrics play out through the entirety of a track, and loudness targets help guide the balance of density and dynamics.
specs: |-
  - Colour-coded A-B button, blue for your mix and orange for reference tracks
  - Playlist of 16 reference tracks per preset, with drag and drop loading and re-ordering
  - Four loudness matching modes
  - Four playback modes, including latching to the DAW transport and manual control
  - Monitor section with mono, individual left and right channels, Solo in place and Sides (M/S)
  - Four cue and loop points per track, with scroll-wheel zoom for fine tuning
  - Filter bank with bass, mid and high presets, plus draggable high and low filters
  - Zoom, with optional link to the filter range, on both Hz and dB scales
  - Spectrum, Correlation, Stereo Image (Spectral Pan), Dynamics (PSR) and Loudness analysis pages
  - Single, dual and layered display modes for the A | B visualisers
  - Disk streaming instead of loading audio files into RAM
  - Preset folders, with export to an archive format that includes the reference tracks
  - Compact GUI with track selection, gain meters and faders, monitor section and A-B button
  - Supported plugin formats: AAX Native, AU, VST2, VST3
  - macOS 10.11 El Capitan through macOS 15 Sequoia (Intel, or Apple Silicon, fully compatible with native M1 and M2 chips)
  - Windows 7 through Windows 11 (x64-compatible CPU)
  - Display resolution: 1440 x 900px or 1280 x 960px or higher
  - Memory: 4 GB+ RAM (8 GB+ suggested)
