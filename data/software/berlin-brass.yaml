details: |-
  Flagship brass instruments and ensembles combining a powerful sound with the
  flexibility for intricate arrangements, Berlin Brass has become the gold
  standard sample collection for orchestral brass and is now available for sine.

  Part of the acclaimed berlin series, this collection provides both individual
  instruments and ensemble patches so you can explore a full range of voicings
  and craft the most demanding arrangements.

  The sine edition builds on the extensive articulations and dynamic depth of
  the original collection, adding a triple-forte layer for producing the most
  forceful passages.

  Multiple players per section provide a combination of individual instruments
  and ensembles for detail in creating complex voicings and divisi parts plus
  gravitas for producing powerful passages.

  Adaptive legato reacts to the playing speed to ensure the right sound for fast
  runs as well as for expressive melodies, with multiple attack options
  including soft attack, immediate attack, and accented attack.

  Dynamic articulations feature actual recorded crescendos, swells, and sforzati
  for ultimate realism in dynamic effect.

  All berlin series libraries were recorded with the finest musicians, in situ,
  on the same teldex scoring stage in berlin, designed for complete consistency
  across the series so all berlin series libraries play together perfectly.
