description: "Anaesthesia Distortion: distortion effect with a shapeable filter."
details: |-
  Anaesthesia Distortion is a distortion effect with a shapeable filter.

  Distortion, filter/shaper and limiter with digital and tube distortion modes. Fold digital distortion signal and adjust bias for tube distortion.

  Filter/shaper is a filter/equalizer with offset and resonance controls. Limiter has gain control, output level, and lo and hi limits.

  Bypass switches for all three parts. Dry volume slider.

  Stunning silver frame. Graphic control elements created by vera kinter
specs: |-
  - Digital distortion mode
  - Tube distortion mode
  - Filter/shaper
  - Filter/equalizer
  - Limiter
  - Offset control
  - Resonance control
  - Gain control
  - Output level control
  - Lo limit
  - Hi limit
  - Bypass switches
  - Dry volume slider
