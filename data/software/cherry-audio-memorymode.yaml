details: |-
  Memorymode is based upon one of the very best-sounding polyphonic programmable
  analog synthesizers of the 80s - the legendary Memorymoog synthesizer.
  Memorymode replicates the incredible sound and feel of the original instrument
  at a tiny fraction of the cost of a vintage original, delivering all the power
  and musicality of the Memorymoog at a price anyone can afford.

  Memorymode delivers a one-two punch of huge tonality, with super-accurate
  replications of the original three-oscillator voice architecture and a precise
  implementation of the coveted ladder filter circuit. With up to 16-voice
  polyphony and detunable unison mode with up to 48 oscillators per key,
  Memorymode is capable of truly massive sounds.

  In addition to all of the voicing and modulation that made the original sound
  so great, Cherry Audio has added a number of creative and convenient features
  aimed at modern music makers, including an expanded voice modulation section
  with up to six simultaneous destinations, an improved arpeggio section with
  tempo sync, and studio-quality phaser, ensemble, delay, and reverb effects.

  With over 600 presets programmed by industry veterans, drift control for
  increased analog realism, comprehensive MPE support, and a Modern button for
  beefy lows and crystalline highs, Memorymode sets a new standard for
  Memorymoog emulations.
specs: |-
  - Precisely recreated ladder filter with selectable 12 and 24 dB/octave slopes
  - Authentically modeled three oscillator voice architecture
  - Up to 16-voice polyphony
  - Over 600 presets programmed by industry veterans
  - Expanded voice modulation section with up to six simultaneous destinations
  - Improved arpeggio section with tempo sync
  - Drift control for increased analog realism
  - Tempo-syncable LFO
  - Detunable unison mode with up to 48 oscillators per key
  - Improved single-key chord memory mode
  - Modern button for beefy lows and crystalline highs
  - Highly optimized coding for high performance with ultra-low CPU load
  - Advanced one-click UI magnification
  - Comprehensive MPE support
  - Studio-quality phaser, ensemble, delay with tempo sync, and reverb effects
  - Full MIDI control and DAW automation for all controls
