description: A special modified version of reNOVAtor equipped with well prepared
  preset-like controls, especially suitable for very time-effective workflow in
  audio repair.
details: |-
  easyreNOVAtor removes unwanted audio incidents and replaces the vacancy with
  re-synthesized audio, intelligently created from surrounding context without
  affecting original audio in an audible manner. The whole process is
  high-resolution and linear-phase, thus extremely transparent.

  easyreNOVAtor is intended to rescue high-resolution live or location
  recordings from extraneous sounds and unwanted audio disturbances. Often,
  brilliant live recordings cannot be accepted for CD release because of
  disturbing noises like coughs, squeaky chairs, feedback squeals, or ring tones
  from a cellular phone.

  easyreNOVAtor allows a quicker workflow than reNOVAtor. It allows
  localization, identification and precise removal of unwanted audio events
  mostly without audibly affecting the audio material. Spectral components of
  the disturbing sound in the selected area are lowered below the hearing
  threshold.

  easyreNOVAtor is optimized for very time-effective workflow and therefore
  equipped with well prepared preset-like controls. It is ideal for post-pro
  broadcast, TV and film engineers working under extreme time pressure.
specs: |-
  - High-resolution linear-phase processing
  - Preset-like controls for fast workflow
  - Re-synthesizes audio from surrounding context
  - Spectral component removal below hearing threshold
  - Compatible with Pyramix, ProTools HD/Mix/LE, WaveLab, Soundscape
  - Stand-alone version runs on Windows 9x/NT4/XP/Vista/7
