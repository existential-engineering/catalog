name: AudioKit Synth One
manufacturer: audiokit-pro
primaryCategory: synthesizer
url: https://audiokitpro.com/synth
description: "Synth one is the world's first professional free & open-source ipad synth."
details: |-
  Synth one is the world's first professional free & open-source ipad synth.

  Includes over 300+ presets by sound designers who have worked with m83, tycho,
  rihanna, kanye west, red sky lullaby, brice beasley, dj puzzle,
  electronisounds, james edward cosby.

  Hybrid analog/fm poly synthesizer with over 300+ presets crafted by famous
  sound designers.

  Features audiobus 3 & inter-app audio (iaa) compatibility, and works with aum,
  beatmaker 3, cubasis, garageband.
specs: |-
  - Hybrid analog/FM poly synthesizer
  - Five oscillators (2 dco, FM, sub, noise)
  - 2 assignable LFOs
  - 100+ alternative scales & tunings
  - Vintage-style 16-step sequencer
  - Classic poly arpeggiator
  - MIDI in
  - Touchable ADSR envelopes for amp & filter
  - FM oscillator w/ mod
  - Dedicated sine/square -12/24 sub osc
  - 4-pole vintage low-pass filter
  - High-pass/band pass filters
  - Mono portamento & legato
  - Beautiful sean costello reverb
  - Multi-tap (ping-pong) delay
  - Touchpads
  - Preset import/export
  - MIDI learn on all knobs
  - Compact app size (under 25mb)
  - MIDI bank (msb) /patch change & sustain pedal support
  - Full source code included
  - Audiobus 3 & inter-app audio (iaa)
  - Aum, beatmaker 3, cubasis, GarageBand compatible
