description: The 8180 Monster Tube Guitar Amplifier plugin is modeled after a Peavey 5150 amplifier and is the landmark for heavy and rock guitar sounds. It features two independent channels (Rhythm and Lead), comprehensive EQ controls, selectable power amp tubes, cabinet selection, and an impulse response loader.
details: |-
  The 8180 Monster Tube Guitar Amplifier plugin is based on a Peavey 5150, making it the landmark choice for heavy and rock guitar sounds. If you are looking for a modern and rich high gain tone ideal for the most aggressive rock and metal genres, this plugin delivers.

  The amplifier features two channels with independent controls for volume and gain, shared low, mid, and high equalizer controls, and exclusive power amp resonance and presence controls. The Rhythm channel achieves everything from crystal clean tones to powerful crunch sounds, while the Lead channel delivers harmonic-rich rock tones and super screaming metal drive sounds. The power amp section lets you select between 6L6 or EL34 tubes.

  The Filters section provides three options for tone shaping: Tight (reduces low frequency content, tightening the low range — suitable for 7- and 8-string guitars), Rumbling (reduces low-frequency content), and Harsh (reduces high-frequency content). These controls allow precise sculpting of the amplifier's character.

  The built-in Noise Gate includes Threshold (defines the level where the gate is activated), Range (selects the quantity of noise reduction), and Gate Speed controls. The Cabinet section lets you choose between eight different guitar cabinets with four microphone emulations, on/off axis position switching, and continuous position and distance knobs. A complete mixer section with solos, mutes, pans, and faders allows blending the two microphones with the ambience.

  The Impulse Response Loader lets you load up to three third-party impulse responses that can be blended together using volume, pan, phase, solo, and mute controls. The plugin is also available for iPhone and iPad on the Apple App Store.
specs: |-
  - Two independent channels: Rhythm and Lead
  - Rhythm channel: crystal clean to powerful crunch tones
  - Lead channel: harmonic-rich rock and metal drive sounds
  - Shared low, mid, and high EQ controls
  - Power amp resonance and presence controls
  - Power amp tube selection: 6L6 or EL34
  - Three filters: Tight, Rumbling, and Harsh
  - Noise Gate with Threshold, Range, and Gate Speed controls
  - Eight guitar cabinet selections
  - Four microphone emulations with on/off axis position switch
  - Continuous microphone position and distance knobs
  - Mixer section with Solos, Mutes, Pans, and Faders
  - Impulse Response Loader: up to three third-party IRs with blending controls
  - Plugin formats: VST2, VST3, AAX, AudioUnits
  - Requires Intel-compatible or Apple Silicon CPU
  - 1GB RAM minimum
  - Mac OS 10.13 or newer
  - Windows 7 or newer
  - 64-bit DAW required
  - Version 2.0.7
