details: |-
  Nembrini Audio 8180 Guitar Amplifier plugin is based on a Peavey 5150.

  The 8180 Monster Tube Guitar Amplifier plugin is the landmark for heavy and rock guitar sounds. If you are looking out for a modern and rich high gain tone ideal for the most aggressive rock and metal genre, then your search ends here!

  Two channels with independent controls for volume and gain, low, mid and high shared equalizer controls and exclusive power amp resonance and presence controls. Rhythm channel: you can achieve from crystal clean tones to powerful crunch sounds. Lead channel: ready for harmonic-rich rock tones and super screaming metal drive sounds. Power Amp Tube: select 6L6 or EL34 tube.

  With Nembrini 8180 Guitar Amplifier is possible to choose between eight different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs. A complete Mixer section with Solos, Mutes, Pans and Faders allows you to blend together the two microphones with the ambience.

  Impulse Loader lets you load up to three third-party impulse responses that you can even blend together using volume, pan, phase, solo and mute controls.
specs: |-
  - Two channels with independent volume and gain controls, shared low, mid and high equalizer
  - Power amp resonance and presence controls
  - Power Amp Tube: select 6L6 or EL34 tube
  - Filters: Tight (reduces low frequency content, suitable for 7/8 string guitars), Rumbling (reduces low-frequency content), Harsh (reduces high-frequency content)
  - Noise Gate: Threshold, Range and Gate speed controls
  - Eight guitar cabinets, four microphone emulations with on/off axis switch, continuous position and distance knobs
  - Mixer section with Solos, Mutes, Pans and Faders
  - Impulse response loader for up to three third-party impulse responses with volume, pan, phase, solo and mute
  - Plugin Formats: a VST2, VST3, AAX or AudioUnits compatible host
  - System: an Intel compatible or Apple Silicon CPU, 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
