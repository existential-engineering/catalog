details: |-
  A timely collaboration with innovative producer and composer GAIKA, War Island offers multidimensional, evolving sounds from the beating heart of London's industrial underground. Featuring harsh bassy synth drones, tape-processed drums, pads, leads and warped vocal effects, these expansive sounds are abundantly complex by virtue of GAIKA's unique and sophisticated processing techniques — made accessible, intuitive and interactive through Spitfire Audio's dynamic, award-winning plug-in.

  Inspired by the sounds of GAIKA's youth and developed over a number of years, these visceral, abstract environments are inundated with the distinctive buzz of an ever-changing and perceptibly dystopian London, offering a fresh creative lens not only for experimental producers, but composers looking for cutting edge sounds to enhance their scores.
specs: |-
  - 42 presets in 6 sections: Pads (5), Basses (7), Leads (12), Atmosphere (7), Drums (6), Vocals (5)
  - 8 controls: Expression, Dynamics, Reverb, Attack, Release, Chorus, Flanger, Phaser
  - Seven bespoke IR reverbs
  - Velocity sensitive
  - Processed signal re-recorded through a sound system at Somerset House, London
  - 2.1 GB download size
  - 2.1 GB disk space required during install
  - macOS 11 to OS 26, Intel and Apple Silicon supported
  - Windows 10 or 11 (64-bit)
  - Minimum 8 GB RAM, 16 GB recommended
  - Spitfire Audio App required
