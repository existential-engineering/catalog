description: Blade is a virtual synthesizer that uses a harmolator synthesis to
  generate sound.
details: |-
  Blade is a virtual synthesizer that uses a 'harmolator' synthesis to generate
  sound. The original Blade synthesizer released in 2012 had a unique concept in
  controlling the waveform harmonics (harmolator) by using an xy pad. On top of
  that, the xy pad movement could also be recorded, edited, and played back
  tempo-based.

  With blade-2 rob papen have expanded the features of blade even further again
  making it a dream synthesizer for synth lovers who like to think out of the
  box and love to experiment! Next to the harmolator mode, we have now included
  an additive mode which allows you to morph or mix between 4 additive waveforms
  using the xy pad. Of course, in addition to using these additive waves, you
  can also create and edit your own! Another new addition is a dedicated
  wave-analyze section that allows to analyze of sample data into a waveform,
  which then again can be used in the harmolator or additive section.

  To expand the sound options, even more, blade-2 also includes an additional
  analog-type oscillator plus a noise oscillator. However, it doesn't stop
  there, because it now has 32 different filter types to help shape your sound
  further! The arpeggiator section inside blade-2 has also received a huge
  update with some very cool new features. There are now two additional rows for
  controlling the x and y position of the xy pad. Also new is the 'ratcheting'
  feature including different ratcheting modes. Last but not least, blade-2 has
  3 multi-fx processors with the high-quality top-notch rob papen fx.

  At the heart of blade, ready to twist and transform your musical mind, lies
  the harmolator. An additive synthesis system, which rather than using the
  system of changing additive partials, uses global controls which capture the
  essence of additive synth in an intuitive way making the creation of sounds
  much easier than using other additive synths. The nine harmolator controls
  allow you to create a vast range of sounds so you get all the amazing sounds
  that additive synthesis can generate with the added simplicity of traditional
  subtractive synthesis.

  Blade offers total control of the sound over time using an array of different
  modulation controls. The most significant of these is the central xy screen.
  Here you can either alter things directly by moving the cursor around, or you
  can record paths which can be replayed. The recorded path can be looped,
  bi-directional looped and tempo based as well. Even the speed of the xy
  recording can be modulated for dynamic changes. So the xy pad is also an
  incredibly advanced 'human input' modulation source.
specs: |-
  - Harmolator oscillator with 9 controls
  - 96 partials
  - 21 distortion units per voice
  - 32 filter types (Blade-2)
  - 14 filter types (original)
  - 6/12/18/24 dB low/high pass filters
  - 12/24 dB band pass/notch filters
  - Vocal filter
  - Comb filter
  - Filter separation function
  - 16 voices
  - Poly, mono 1/2, legato 1/2 and arp modes
  - Additive mode with 4 additive waveforms
  - Wave-analyze section
  - Analog-type oscillator
  - Noise oscillator
  - Xy pad with 12 amount controls per x and y
  - Xy pad recording and playback
  - Tempo-synced xy pad playback
  - Loop and bi-directional loop options
  - Xy pad movement speed control
  - Harmolator velocity control
  - LFO and envelope controls
  - Pitch LFO
  - Pitch envelope
  - 2 free harmolator control sources
  - 2 free envelopes
  - 2 free LFOs
  - 4 modulation sources
  - 27 effects
  - 3 multi-FX processors (Blade-2)
  - 2 FX units
  - 16 step arpeggiator
  - Ratcheting feature with different modes (Blade-2)
  - Arpeggiator x and y position control rows (Blade-2)
  - Step sequencer functionality
  - MIDI control over all parameters
  - 32-bit and 64-bit support
  - Windows 7/8/10 compatible
  - macOS compatible
  - Os x 10.5 or higher
  - Serial/license system
  - 2nd serial for 2nd computer available
