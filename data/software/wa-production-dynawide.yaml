description: "Advanced multiband audio sculpting suite combining stereo width
  enhancement with tonal balance controls, harmonic saturation, and depth
  processing for mixing and mastering."
details: |-
  Multiband faders with +/-24dB range. Linear phase and analog minimum phase crossovers. Per-band width controls with Width Limit safety. Heat knobs for harmonic saturation. Depth controls for front-to-back expansion. Pan controls for stereo frequency placement. Live spectrum analyzer. AB comparison and undo/redo. Factory presets. CPU-efficient.
