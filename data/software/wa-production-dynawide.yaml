description: Dynawide is a multiband processor combining tonal balance faders, per-band stereo width, saturation, depth and panning. Crossover frequencies are user-set and the crossover can run in linear phase or analog minimum phase mode.
details: |-
  Dynawide is a multiband sculpting suite intended for individual tracks, the mix bus or the master channel. It aims at stereo width and depth while keeping clarity, and handles material from delicate percussion to bass lines, whether restoring a flat recording or adjusting tonal balance on a finished mix.

  The multiband faders carry a range of plus or minus 24 dB for shaping tonal balance. The crossover controls are fully user-adjustable, with a choice between the transparency of linear phase and the warmth of analog minimum phase, switchable with one button, and the frequency adjustment deciding exactly where the bands cross.

  Per-band width controls widen the stereo image using processing designed to keep the centre image intact and preserve mono compatibility. Width Limit buttons act as safety nets that in most cases prevent the sides from overpowering the mids even at extreme width settings.

  Heat knobs add harmonic richness to specific frequencies without compromising transient response. Depth controls apply boosted convolution taken from a classic analog compressor to create a front-to-back expansion effect, and Pan knobs place individual frequency bands in the stereo field, which allows pre-made loops or complex mixes to be adjusted band by band.

  The interface is built on vector graphics and is resizable, with a live spectrum at the top showing frequency changes in real time. AB comparison, copy and paste, and undo and redo support experimentation, and a categorised factory preset library covers everything from subtle surgical correction to broader transformations.
specs: |-
  - Multiband processor for stereo width, depth and tonal balance
  - Multiband faders with a range of plus or minus 24 dB
  - Linear phase and analog minimum phase crossover modes
  - User-adjustable crossover frequencies
  - Per-band stereo width controls with Width Limit safety buttons
  - Heat knobs add harmonic saturation per band
  - Depth controls apply convolution-based front-to-back expansion
  - Per-band Pan controls
  - Per-band frequency spectrum monitoring
  - AB comparison, copy and paste, undo and redo
  - Resizable vector interface
  - Categorised factory presets
  - PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Intel and Apple Silicon Mac CPUs supported, including native AAX
