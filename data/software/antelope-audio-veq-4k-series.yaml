description: "Modeled after a unit originally appearing in the late 80s, the
  VEQ-4K features proportional gain settings and shelving HF & LF EQs with a
  signature combo of dip and bump right before the shelf boost."
details: |-
  The VEQ-4K Series is a bundle of vintage 4-band EQ emulations from Antelope Audio's Synergy Core FX library. The first model in this legendary line of EQ modules, it remains a classic and still in use by many engineers. It has 4 bands with a sweepable mid Q. The HF and LF can be switched to Bell/Shelf modes with a degree of boost/cut by +/- 15dB.
