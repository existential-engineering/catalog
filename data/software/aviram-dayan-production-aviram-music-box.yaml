  stretching, winding noise (winding, attachments).
details: |-
  Sound from a great tool with different instruments symphonion, cylinder, swiss
  cylinder, mandoline (organocleide), orphenion multi legato, bells in sight,
  different chorus, air breathing, different pads and stretching, winding noise
  (winding, attachments).

  M-box - trigger between 3 groups and changing with multi legato. Modulation-
  (1-modes). M-box2 - trigger between 12 groups (swiss cylinder, orphenion) and
  changing with multi legato and round robin modulation- (1-modes).

  B-chorus - bright choirs, between 5 groups of choirs and trigger between 12
  groups (swiss cylinder, orphenion and bells) modulation- (2-modes) when the
  modulation going up the sound of music box canceled. B-chorus 2 - bright
  choirs, between 7 groups of choirs and trigger between 13 groups (swiss
  cylinder, orphenion and bells, mandoline-organocleide) modulation- (2-modes)
  when the modulation going up the sound of music box canceled.

  B-chorus 3 - different pads and different bright choirs, between 9 groups of
  choirs and multi legato and trigger between 15 groups (swiss cylinder,
  orphenion and bells, mandoline-organocleide) modulation- (2-modes) when the
  modulation going up the sound of music box canceled. B-chorus 4 - air
  breathing and different pads and different bright choirs, between 10 groups of
  choirs and multi legato and trigger between 16 groups (swiss cylinder,
  orphenion and bells, mandoline-organocleide, ) modulation- (2-modes) when the
  modulation going up the sound of music box canceled.

  The multi legato varies between all 64 groups, in a smooth way. Aviram music
  box is soundware (samples or presets that load into other products) for macos
  and windows. 480 mb download size (for each - win / mac). 7800 sounds. For
  kontakt v5.4.1 and up. Support win + mac systems.
specs: |-
  - Symphonion
  - Cylinder
  - Swiss cylinder
  - Mandoline (organocleide)
  - Orphenion multi legato
  - Bells in sight
  - Different chorus
  - Air breathing
  - Different pads
  - Stretching
  - Winding noise
  - M-box with 3 groups and multi legato
  - M-box2 with 12 groups and round robin modulation
  - B-chorus with 5 groups of choirs and 12 trigger groups
  - B-chorus 2 with 7 groups of choirs and 13 trigger groups
  - B-chorus 3 with 9 groups of choirs and 15 trigger groups
  - B-chorus 4 with 10 groups of choirs and 16 trigger groups
  - Music box with 6 articulation
  - Multi legato with 64 groups
  - Modulation (1-2 modes)
  - 480 MB download size (win/mac)
  - 7800 sounds
  - Kontakt v5.4.1 and up
  - Windows and mac systems support
