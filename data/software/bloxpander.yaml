description: BloXpander is a software plug-ins host originally designed to meet
  the requirements of musicians and engineers in live situations.
details: |-
  BloXpander is a software plug-ins host originally designed to meet the
  requirements of musicians and engineers in "live" situations (but it can find
  a place in the studio as well). Its interface is visually attractive and
  clear, the construction of projects and the access to prepared instruments and
  effects is very fast. The plug-ins manipulation is direct (especially when
  BloXpander is coupled to an external MIDI controller).

  Full featured virtual console with 24 channels, 4 auxiliary bus + 1 master
  bus, and 6 inserts per channel (theoretical 174 instruments/fx slots).
  Advanced support for external MIDI controllers lets you control the mixer and
  plug-ins with lightning fast configuration procedure.

  Advanced routing includes global management of MIDI and audio streams with
  MIDI VST fx supported, ability to assign the same MIDI input port to several
  channels (MIDI split), assign the same audio inputs to several channels (audio
  split), and assign any available audio and/or MIDI output or the master bus to
  any channel.

  Full screen friendly and fast interface designed as the panel of a hardware
  unit, touch screen friendly for critical functionality, with no main menu and
  no massive amount of overlapping windows. Supports multi-screens and is
  netbook friendly (accepts a resolution of 1024x600 pixels and makes any
  "large" plug-ins moveable).

  Libraries system allows you to store and callback a plug-in and its state from
  one double-click on a large zone with custom management of your favorite
  plug-ins and presets. Sets and scenes allow you to store and callback the
  complete state of bloxpander (scene) from one double-click and organize your
  scenes as sets for easy and fast access during a show.
specs: |-
  - VST plug-in host

  - 24 channels

  - 4 auxiliary bus + 1 master bus

  - 6 inserts per channel (theoretical 174 instruments/fx slots)

  - External MIDI controller support

  - Control up to 8 plug-ins (8 parameters each) with 8 potentiometers + 8
  buttons

  - Mackie control protocol supported

  - MIDI VST fx supported

  - MIDI split

  - Audio split

  - Pre/post fader selector (aux sends)

  - Multi-out and sidechain capable plug-ins routing

  - Audio inputs monitoring

  - Outputs solo and mute functions

  - Inserts bypass function

  - Touch screen friendly

  - Auto-created visual representation of plug-ins (gui screenshots)

  - Drag 'n drop plug-ins and states

  - Multi-screen support

  - Netbook friendly (1024x600 pixels resolution)

  - Libraries system

  - Sets and scenes

  - Categorized plugins library

  - Plug-ins compatibility analysis tool

  - Tap tempo feature

  - MIDI panic

  - Plugins transparency

  - Shell plug-ins compliance

  - Windows 32-bit and 64-bit

  - Multicore processor support option
