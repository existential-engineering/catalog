description: Vikings Cinematic Toolkit consists of powerful cinematic metal instruments for your compositions. This expansion is inspired by Doom soundtrack written by Mick Gordon and contains strings, percussions, guitars, basses and many more instruments.
details: |-
  Keepforest's VIKINGS CINEMATIC METAL TOOLKIT consists of powerful cinematic metal instruments for your compositions. This expansion is inspired by the Doom soundtrack written by Mick Gordon. With the participation of professional musicians, sound designers, and sound engineers, strings, percussions, guitars, basses and many more instruments were recorded for the library.

  Keepforest could not find a true and complete samples library on the market, dedicated to this genre. Having a clear vision in their minds, they decided to take the opportunity and started the recording process of Vikings in January, 2017.

  The library guarantees to instantly bring the mighty and massive sounds of the Viking Age to your compositions by offering a huge number of organic sound design elements like rolls, hits, braams, benders, punches, trailers hit kits and more to explore.

  The main features of the Vikings library are the ingenious exclusive pulse designer, the great and intuitive GUI, the powerful and versatile effect rack and a massive collection of customizable stems and pulses which will spice up your composition immediately.
specs: |-
  - Requires FULL VERSION of Native Instruments KONTAKT 5.5.1 or higher (NOT compatible with the free KONTAKT Player)
  - 3 Cinematic Metal Guitars
  - 3 Drum Kits
  - 3 Bass Guitars
  - 30 Metal Riffs
  - Synths
  - Beat Machine
  - Mac OS X 10.8 or higher, Intel Core 2 Duo
  - Windows 7 or higher, Intel Core 2 Duo or AMD Athlon 64 X2
  - 4 GB RAM
  - At least 9.8 GB of free hard disc space
