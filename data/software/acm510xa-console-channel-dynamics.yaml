details: |-
  The acm510xa plug-in includes both a versatile compressor, and an expander /
  gate - providing a comprehensive channel dynamics processing solution together
  with a modern stylized user-interface.

  Presented as a virtual 500-series module, the acm510xa features hard or
  soft-knee compression with auto gain-makeup, and gate threshold hysteresis for
  reliable operation.

  Suitable for mono or stereo operation, the acm510xa delivers professional
  digital audio workstation channel dynamics processing, with efficient use of
  cpu and system resources.

  More efficient use of cpu and system resources allows more plug-in instances
  in a typical audio workstation project.

  As intuitive and easy to use as a traditional analogue channel compressor.
