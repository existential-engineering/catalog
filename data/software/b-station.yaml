name: B-Station
manufacturer: odo-synths
primaryCategory: synthesizer
description: "Features 3 oscillators: every oscillator has a fine tune, octave,
  pw, volume and 5 different waveforms. Mod oscillator for pulse width and for
  phase modulation."
details: |-
  Features 3 oscillators: every oscillator has a fine tune, octave, pw, volume
  and 5 different waveforms. Mod oscillator for pulse width and for phase
  modulation.

  4 filters types: low-pass / band-pass / hi-pass / 4-pole. The filter has an
  envelope adsrlt, 12 curves and a bpm lfo.

  Modulation envelope for pitch and pulse width. Vibrato, bitcrusher, drive,
  low- / hi-boost. Arpeggiator. Velocity filter and volume on / off. Glide /
  retrigger and a master volume.

  B-station by odo synths is a virtual instrument audio plugin for windows. It
  functions as a VST plugin.
specs: |-
  - 3 oscillators with fine tune, octave, pulse width, volume and 5 waveforms
  - Mod oscillator for pulse width and phase modulation
  - 4 filter types: low-pass, band-pass, high-pass, 4-pole
  - Filter envelope adsrlt with 12 curves
  - Bpm LFO
  - Modulation envelope for pitch and pulse width
  - Vibrato
  - Bitcrusher
  - Drive
  - Low-boost and hi-boost
  - Arpeggiator
  - Velocity filter and volume on/off
  - Glide/retrigger
  - Master volume
  - Windows compatible
