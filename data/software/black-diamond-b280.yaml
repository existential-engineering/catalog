details: |-
  Black Diamond B280 is based on a bsendorfer 280 Vienna concert, also known as
  the concert grand 280vc. With a timbre all its own, Black Diamond B280 can
  easily convey darker moods while conserving the warm musicality for which the
  austrian capital is celebrated.

  The bsendorfer 280 vienna concert grand piano is a large, 9' concert grand
  piano that was first introduced in 1828 and has been used by many of the
  world's leading pianists, including artur rubinstein, vladimir horowitz and
  martha argerich. Offering a broad tonal spectrum, easier playability and wide
  dynamics, without neglecting the richness of partial notes, it's a truly
  remarkable and desirable instrument.

  Like our concert grand yf3, we used dpa microphones for the close miking and
  schoeps mics for medium-distanced coincident pair to record this spectacular
  piano at the legendary fonoprint studios in bologna, italy, within the walls
  of a 15th century convent.

  Introducing a powerful new performance engine, pianoverse recreates perfectly
  the immersive experience of playing the world's finest pianos, while adding an
  inspiring range of sound-shaping environments, from iconic to exotic.

  Pianoverse begins as a series of 8 remarkable instruments paired with unique
  spaces and loaded with presets. As we seek and gain access to other
  exceptional pianos, we'll expand the series further.
