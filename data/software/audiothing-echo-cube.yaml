description: Echo Cube is a delay plugin emulation of the UREI Cooper Time Cube,
  a rare analog delay system that achieved echo using long coiled tubes.
details: |-
  Echo Cube is a dual delay plugin inspired by the Cooper Time Cube, a rare analog delay system that achieved echo without tape or electronic delay circuits such as BBDs. The original unit created delay by sending audio through long coiled tubes, where time was defined by the physical propagation of sound through air.

  Echo Cube recreates and expands this concept with two independent delay lines, A and B, each offering dedicated time, feedback, and level controls. Three models are available: Time Cube faithfully recreates the original hardware, while Garden Hose and Corrugated are experimental, DIY inspired variations designed for sound design, expanding on the physical principles of the original unit. The delay lines can be combined using multiple routing modes, including serial, parallel, ping pong, mono sum, and mid/side.

  The Cooper Time Cube was developed in 1971 by Duane H. Cooper and Bill Putnam as an alternative to tape and electronic delay systems. Rather than storing audio electronically, it created delay by sending sound through long coiled tubes, using air as the delay medium. This mechanical approach produced very short delays of approximately 14 ms on one line and 16 ms on the other, or a combined cascade total of around 30 ms. With only about 1,000 units ever made, it became a rare studio fixture with a strong following for its unique sound.

  The Time Cube works on a principle similar to a spring reverb, but instead of metal springs it uses coils of hose. The signal is sent into the hose by a microphone capsule working in reverse as a tiny speaker, and the sound physically travels through air inside the tube. At the other end, a second capsule picks up the delayed acoustic signal and converts it back to audio. AudioThing went back to the source and built their own acoustic delay paths using garden hose and plastic corrugated pipe, testing different lengths, diameters, and materials.

  The original unit's preamps and gain staging play a crucial role in shaping its identity, adding subtle saturation, density, and attitude before and after the acoustic delay path. The emulation captures that entire signal journey, from capsule to tube to output stage. Echo Cube is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP), and on the App Store for iOS and iPadOS (AUv3 and Standalone).
