details: |-
  BLEASS Granulizer is a granular texture effect plugin with randomization, 4
  multi-bus audio inputs and a mesmerizing 3d visualizer. BLEASS Granulizer
  generates short samples ('grains') from different input signals by modulating
  different parameters which you can visualize.

  The input stage allows you to choose between a low-shelf or high-pass filter
  (to filter out the bass frequencies from input) as well as a gain adjustment.
  Bleass granulizer takes up to 4 sources from different busses as inputs
  (compatible DAW required). When multiple busses are on, each grain is randomly
  extracted from one of the available sources.

  The granulizer generates short samples ('grains') from different input signals
  by modulating different parameters which you can visualize thanks to the 3d
  visualizer: volume. Pan (represented by width in the visualizer). Size (=
  grain's duration). Density (= frequency of grains generation). Offset (= the
  amount of time between record and play represented by the depth in the 3d
  visualizer). Backward/forward playback direction. Shape (= grain's envelope,
  represented by the height dimension in the visualizer). Warmth (= strength of
  the distortion applied to the grain). Tune (= grains can be pitched up or down
  according to different modes: "fine" / chromatic / major / minor / 5th / major
  7th. / minor 7th / octave and other tuning modes such as dim / dom / maj 7th
  chords).

  The amount of randomization can be set with the "dice" knobs. Density, grain
  size and offset range can be freely synced or beat-synced to the host's tempo.

  Bleass granulizer by bleass is a virtual effect audio plugin and a mobile
  audio app for macos, windows and ios. It functions as an audio units plugin
  and a VST 3 plugin. Macos 10.9 and later (64-bit only) (including macos 11 big
  sur and m1 processors).
