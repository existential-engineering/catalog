details: |-
  Artix enables music producers to map MIDI channels to specific MIDI notes,
  offering a flexible way to trigger up to 16 key switches in another VST
  plugin.

  It includes 39 built-in factory presets, with the option to create and share
  custom presets.

  For more information and documentation, visit artix.spatian.dev.
specs: |-
  - MIDI channel to note mapper
  - Articulation switching
  - Key switches (up to 16)
  - 39 built-in factory presets
  - Custom presets creation and sharing
