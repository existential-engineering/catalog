description: A digital effects rack plugin combining the Overloud VKFX effects
  suite with 15 additional vintage-inspired effects modules, including EQ,
  compression, reverb, delay, and modulation effects.
details: |-
  Anyone who knows effects knows that the Overloud VKFX Effects suite was one of the best created. The developers took pride in modeling every electronic detail to the most iconic vintage gear. Well we licensed this and stacked on 15 more vintage effects for an amazing combination of effects that are warm, phat, and full of life. You get all of the factory presets from the VKFX and previous owners can load in their existing presets.
