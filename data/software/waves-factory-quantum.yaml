description: Quantum is an audio plugin that separates an audio signal into its attack and sustain parts. With 16 built-in high quality effects that you can apply to each path independently.
details: |-
  A transient shaper is an audio processor that can increase or reduce the transients or tonal parts of a signal. It has become an indispensable mixing tool on every studio. Quantum automatically detects and classifies the transients of your signal, separating the sound in two paths: attack and sustain. The level of control you have now is unmatched, giving you the possibility to add effects to each path separately, before joining them back together.

  Quantum is a state of the art transient shaper at its core, and that technology is what automatically detects transients. The results are artifact-less and more natural than other methods that can sound digital and full of artifacts. Quantum takes away the need of a threshold parameter, which you would have to set for each track. That way you can work faster and get pristine results.

  Quantum is not a one-trick-pony, it's quite the opposite. Think about it like a toolbox. It's a comprehensive set of tools that let you control, mangle, manipulate and completely transform your tracks. EQ your transients, re-pitch your drums without losing any of the attack, reduce plosives from vocals, why not EQ plosives only? Add reverb to just the attack of your drums to get a much more focused and clean room feel.

  Using the main volume knob for attack and sustain already makes a big difference in your sound. But Quantum comes with 16 high quality DSP effects that you can add to the attack or sustain part of the signal independently, boosting exponentially the sonic capabilities of the plugin. Quantum effects can be easily added, bypassed, removed and re-arranged in any order you want in the most simple way.
specs: |-
  - Automatic transient detection with no threshold parameter to set
  - Separates the signal into independent attack and sustain paths
  - 16 built-in DSP effects: Chorus, Compressor, Convolution, Delay, Enhancer, EQ, Flanger, Limiter, Lo-Fi, Phaser, Pitch Shifter, Reverb, Saturation, Stereo Tools, Tremolo, Vibrato
  - Effects can be added, bypassed, removed and re-arranged in any order per path
  - Enhancer is a 2-band version of the Spectre plug-in, with low and high shelves
  - Global mix and output volume parameters
  - Resizable interface, vector drawn and retina ready
  - Preset system with factory presets plus save, save as and delete
  - Built-in auto updater
  - No iLok or challenge response, registered with a serial number
  - macOS 10.9 or higher, Intel and Apple M1 natively supported, 64-bit DAW and OS
  - Windows 7, 8 or 10, 64-bit DAW and OS
