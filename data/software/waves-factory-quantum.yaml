  Smart transient detection (artifact-less, no threshold needed). 16 built-in DSP effects: Chorus, Compressor, Convolution, Delay, Enhancer, EQ, Flanger, Limiter, Lo-Fi, Phaser, Pitch Shifter, Reverb, Saturation, Stereo Tools, Tremolo, Vibrato. Resizable window (Retina-ready). Preset system. Auto-updater. Global mix and output volume. No iLok required.
