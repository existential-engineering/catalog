  Floyd's The Dark Side of the Moon."
details: |-
  Frequency shift up to +/-25 Hz with tempo sync options. Drive and Age controls for saturation and character. Feedback, thermal/voltage Drift, Phase, and stereo Spread controls. Adjustable frequency range limits via EQ filters.
