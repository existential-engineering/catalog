details: |-
  PSP Wobbler is a modulation effect plug-in, inspired by and developed in collaboration with the legendary recording engineer, producer, and musician Alan Parsons. PSP Wobbler faithfully recreates the sound of Alan's secret weapon, the Frequency Translator, a handmade experimental device built by Keith Adkins, which created the unique modulation effect heard on "Time" from Pink Floyd's The Dark Side of the Moon.

  PSP Wobbler uses frequency shifting to create non-harmonic phase differences that form a unique "wobble" with elements of phasing, flanging, and even a rotating speaker feel. It takes this sound well beyond the original Frequency Translator's capabilities, adding controllable Drive, Ageing, Drift, and Spread, as well as tempo sync, a pair of EQ filters to control the effect's frequency range, and more.

  Running PSP Wobbler in 30-day trial mode or activating it requires an iLok user ID, which can be created for free at www.ilok.com, and the free iLok License Manager application, but no hardware dongle. The license can be activated in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above), and licenses can be moved at any time using PACE's iLok License Manager software.
specs: |-
  - Frequency shift up to ±25 Hz, manually controlled or set as a clock division of the DAW tempo
  - Frequency shift can be set to follow tempo changes or stay at a fixed amount through a song
  - Wobble amount is controlled via wet/dry mix
  - Drive and Age controls let you dial in saturation and character
  - Ageing modes for adding Drive / Age to wet signal alone or to both wet and dry signals
  - Separate controls for Feedback, thermal and voltage Drift, Phase, and stereo Spread
  - Adjustable lower and upper limits for effect frequency range
  - Windows 7 - Windows 11, 64-bit VST, VST3 and AAX (Pro Tools) compatible hosts
  - macOS 10.14 Mojave - macOS 15 Sequoia, Intel and Apple Silicon, 64-bit AudioUnit, VST, VST3 and AAX (Pro Tools) compatible hosts
  - iLok user ID and iLok License Manager required, no hardware dongle needed, license activatable in 3 locations
