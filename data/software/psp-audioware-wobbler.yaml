description: A modulation effect plug-in inspired by and developed with Alan Parsons, recreating the sound of the Frequency Translator — a handmade experimental device that created the unique modulation effect on Pink Floyd's 'Time' from The Dark Side of the Moon. Features frequency shifting up to ±25 Hz, manually controlled or tempo-synced, with Drive and Age controls for saturation, Feedback, Drift controls, Phase, and stereo Spread adjustment.
details: |-
  Developed in collaboration with Grammy-winning engineer Alan Parsons. Inspired by the Frequency Translator used on Pink Floyd's 'Time'. Licensed via iLok License Manager (no hardware dongle required; activatable in 3 locations). 30-day free trial available.
specs: |-
  - Frequency shifting up to +-25 Hz, manually controlled or tempo-synced
  - Drive control for saturation
  - Age control for analogue-style degradation
  - Feedback control
  - Thermal and voltage Drift controls
  - Phase adjustment
  - Stereo Spread control
  - Adjustable upper and lower frequency range limits
  - Wet/dry mix control
  - Windows: 7-11 (64-bit)
  - macOS: 10.14-15 Sequoia (Intel and Apple Silicon, 64-bit)
  - Formats: AU, VST, VST3, AAX
  - iLok License Manager required (no hardware dongle needed)
