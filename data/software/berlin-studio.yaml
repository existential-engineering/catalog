details: |-
  Berlin Studio is a convolution-based reverb plugin, featuring the rich
  acoustics of the famous teldex studio in berlin, captured with seven of their
  finest microphones.

  This studio is famous for decades of classical recordings (telefunken and
  decca) and is well known to composers being the studio where most orchestral
  tools sample libraries are recorded.

  The signature sound of this recording stage approximately the same size as
  abbey road one has been captured by recording special signals emitted from the
  main orchestral stage positions with the studio's main microphones and
  processing these recordings into acoustical "fingerprints", also known as
  impulse responses (irs).

  Meticulous post-pro editing has resulted in a very consistent and accurate set
  of irs in true-stereo format.

  With its flexible handling of microphone perspectives, time-alignment, early
  reflections and reverb tails berlin studio allows you to seamlessly mix and
  match virtual instruments from different vendors in a unique acoustic
  environment.
specs: |-
  - Convolution-based reverb plugin
  - True-stereo format impulse responses
  - Microphone perspective control
  - Time-alignment
  - Early reflections control
  - Reverb tail control
  - Low signal-to-noise ratio
  - Stereo imaging
