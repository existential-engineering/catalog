description: Monophonic vocal manipulation plugin for real-time pitch and formant
  shifting with hard-tune quantization, tube saturation, and MIDI-controlled
  vocoder effects.
details: |-
  Little AlterBoy is a monophonic voice manipulator designed for dramatic vocal transformations. The plugin enables users to shift both pitch and formant (gender) of vocals in real time, creating a wide spectrum of effects from subtle to extreme modifications within a single interface.

  The tool includes hard-tune quantization effects popular in contemporary hip-hop and pop music production, combined with tube saturation circuitry derived from Soundtoys' Decapitator plugin. Users can lock vocals to specific pitches for robotic effects or leverage MIDI control for vocoder-like capabilities and harmonic arrangements.

  Built on decades of pitch-shifting expertise from the company's founders, who contributed to the iconic Eventide H3000 and developed PurePitch TDM, Little AlterBoy consolidates professional vocal processing knowledge into an accessible creative tool.
specs: |-
  - Real-time pitch and formant shifting
  - Hard-tune quantization effects
  - Tube drive/saturation modeling
  - MIDI-controlled pitch for vocoder effects
  - Vocal harmony creation via mix control
  - Robot/vocoder mode capabilities
  - Monophonic processing
  - 64-bit only, sample rates 44.1 kHz to 192 kHz
  - Apple Silicon compatible
