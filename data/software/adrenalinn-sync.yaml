details: |-
  AdrenaLinn Sync provides a variety of creative beat-synced filter modulation
  and sequencing effects, achieved by routing an LFO and 2-bar looped sequencer
  to control filter frequency, volume and pan.

  Version 2, completely rewritten in collaboration with plug-in developer way
  out ware, greatly enhances filter quality, adds a new 3d-rendered ui, removes
  version 1's dependence on pluggo technology and adds all new presets that
  spotlight the new sounds.

  Adrenalinn sync has many cool features: control, randomness, filter mod, lfo
  amplitude, effects (flanger, phaser, delay, swing, tube distortion, etc.),
  self-gen noise for surprising percussive sounds, stereo signal path, snap to
  scale (chromatic, major, minor, pentatonic, blues, whole tone, etc.).

  Adrenalinn sync has a 32 step sequencer and lfo to drive the 5 excellent
  effect blocks - filter, distortion, limiter, volume, and 32 second delay.

  There are plenty of interesting & varied presets (100 of them), and all are
  usable as the demo video demonstrates. It's v easy to make your own effects
  chains, with room to save 28 user presets.
specs: |-
  - Lowpass filter
  - Bandpass filter
  - Highpass filter
  - Phaser filter
  - Flanger filter
  - Filter frequency calibrated in musical notes
  - Tube-modeled distortion with separate pre & post filtering
  - Peak limiter
  - Beat-synced 8-bar stereo delay
  - Sharp filter modulations without clicks or pops
  - Snap to scale with 14 musical scales
  - LFO
  - 2-bar looped sequencer
  - 32 step sequencer
  - Control of filter frequency, volume and pan
  - 3d-rendered ui
  - Stereo signal path
  - Self-generated noise capability
