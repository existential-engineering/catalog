details: |-
  We built the Matt Halpern library as the tool we wished we had years ago, with all the little details and creature comforts we couldn't find in other libraries.

  The Halpern library is a Player Library (NKS) and can be used with Kontakt's Free Player, so there is no need to buy the full version of Kontakt to use GGD.

  Whether you're sketching out a song idea or working on a final mix, the Matt Halpern library gives you all the tools you need to bring your ideas to life.

  This instrument uses the latest version of Kontakt Player from Native Instruments. Installation and activation is managed via Native Access.
