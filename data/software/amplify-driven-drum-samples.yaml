details: >-
  Amplify - driven drum samples from modeaudio sits before you like a wall of
  blinking guitar amps on stage, cloaked in shadow and waiting for you to plug
  in and send the show roaring into life. A gritty, powerful celebration of the
  noisy joy of amplified sound, this royalty-free collection of 381 thundering
  drum samples is what happens when you plug a set of vintage drum machines into
  a 65w roland amp and let loose with the gain-stage.


  From the classic punch and low-end shake of the legendary 505, 808 and 909, to
  the vibrant acoustic sampling of the alesis hr16 and modern snap of korg's
  volca beats, we've driven our favourite rhythm units hard through pedals and
  amps, recording the results rich in overtones and shrieking with transient
  attack.


  The selection encompasses booming kicks, razor-sharp snares, fizzling cymbals,
  quaking toms, crunchy claps, shimmering hi hats and so much more, representing
  a dazzling array of overwhelmingly punchy drum machine options of both the
  cleaner and noisier varieties.


  We've also crafted 12 drum kit sampler patches for ableton live, logic pro and
  reason to accompany the raw drum sounds themselves, mixing and matching the
  core percussive library into ready-to-go instruments for building dynamic
  beats with straight after download.
