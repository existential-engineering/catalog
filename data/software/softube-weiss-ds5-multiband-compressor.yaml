details: |-
  Softube's Weiss DS5 Multiband Compressor is the highly requested evolution of the industry's top mastering processor: the award-winning Weiss DS1-MK3. Together with Weiss Engineering, Softube brings five full line-by-line code-ported Weiss DS1s, one per band. A feat impossible in hardware form. Modernized and fully loaded with professional presets from Bob Katz, Philippe Weiss, Maor Appelbaum, and Jonathan Wyner, the Weiss DS5 Multiband Compressor gives you complete control over compression across specific frequency ranges, in mastering, and on mix buses, vocals, drums, and more. All with the famous transparency of Weiss.

  Weiss DS1-MK3 to the power of five, plus absolute ease of use. Weiss DS5 gives you the unique ability to control five powerful bands of DS1-MK3 units with one macro. You can quickly get started with professionally designed and fully tweakable presets. While the more advanced controls are set in the preset, you can click the DS1 button and open each band's full and complete DS1-MK3 to see all the options available to you. In most cases, however, it will be the macro controls that help you find the sound you're seeking.

  There are five main macro controls on the front panel of the Weiss DS5. They control all the DS1 units in tandem. To get shorter attack times for the high frequency bands, you can tilt the macro to pivot the attack times around their average value, without the need to go into each DS1 separately.

  Weiss is synonymous with transparency, so that was Softube's goal for the filter design as well. The Weiss DS5's filters and compression are made to be as transparent as possible, and the filters were designed to be fast, with pre- and post-ringing artifacts reduced to a mathematical minimum. The cross-over filters are phase compensated 24 dB/octave filters that can be activated in three different modes: Dynamic Phase, Static Phase, and Linear Phase.

  Static Phase applies a constant phase shift independent of gain changes, Dynamic Phase applies a minimal amount of phase shift only when gain changes occur, and Linear Phase operates with zero phase shift regardless of any gain changes. Static Phase and Dynamic Phase were both designed for low latency use. Linear Phase operates at a higher latency, utilizing the same phase compensation technology as the Weiss EQ1 hardware.
specs: |-
  - Five times the dynamics gold standard
  - A line-by-line code port of the DS1 on every band
  - Macro controls for ease of use
  - In-depth control of each band for maximum tweakability
  - Three filter modes designed for transparency: Static Phase, Dynamic Phase, and Linear Phase
  - Phase compensated 24 dB/octave crossover filters
  - Professional presets by Bob Katz, Philippe Weiss, Maor Appelbaum and Jonathan Wyner
  - Low latency for tracking and more
  - Supports Softube Extended Features
  - Available as a standalone perpetual plug-in and included in Flow Mastering and Complete Suites
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26
  - System requirements: Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access for downloading installers and managing licenses
