description: Ableton drum racks for superior drummer 3 pop! Ezx features
  separate ableton drum racks for superior drummer 3 pop! Ezx.
details: |-
  Ableton drum racks for superior drummer 3 pop! Ezx features separate ableton drum racks for all factory presets for the toontrack superior drummer 3 and pop! Ezx library for toontrack ezdrummer. These racks provide out of the box integration workflow between ableton live and toontrack superior drummer using the toontrack libraries including a host of features ready to use for composition and performance using ableton push or similar controllers.

  Amazing workflow in live and on your push to the full capabilities of the kit library saving setup time and allowing you to focus on music creation. Ease of navigation to load all pop! Ezx factory presets from ableton push controller device browser. 4 ableton drum racks to instantly load the factory library "mix ready" presets with ableton mappings.

  Colour coded pad design for visual performance and finger drumming. Individually labelled drum rack pads for clear visualisation, post performance editing and automation to all drum rack / instrument articulations in the ableton live clip editor.

  Singleout presets featuring 2 ableton drum racks for all factory presets single audio output to single ableton track. Mixing can be further enhanced through superior drummer mixer or additional ableton audio effects to the track for example the new ableton 10 drum buss. Multiout presets featuring 2 ableton drum racks for all presets in multiple audio channel output from the plug in to multiple ableton audio tracks using the multi output ableton template also provided.

  Use the template racks and extend to your own pop! Ezx presets, swapping out individual sounds or articulations. You are 100% ready to go with the factory presets but there is no limitation to creating your own presets from these templates. Simply save a new drum rack based upon the modified timbresandtones template.
specs: |-
  - Ableton drum racks
  - Ableton push controller support
  - Color coded pad design
  - Individually labelled drum rack pads
  - Singleout presets with 2 ableton drum racks
  - Multiout presets with 2 ableton drum racks
  - Multi-track audio routing
  - 10 ableton live templates
  - Ableton live clip editor automation
  - Superior drummer 3 integration
  - Pop! Ezx library integration
  - Toontrack libraries support
  - Macos and windows compatibility
