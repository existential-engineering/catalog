description: Adx trax 3 boasts faster separation processing speeds, new stems
  file format export, a consonants annotation tool, and zoom-to-fit option.
details: >-
  Adx trax 3 boasts faster separation processing speeds, new stems file format
  export, a consonants annotation tool, and zoom-to-fit option.


  The consonants tools has been created to improve consonants extraction.
  Consonant annotations are optional, but help identify and extract sounds such
  as "ch" or "s", which are often missed when annotating the pitch only.


  Adx trax was the world's first non-destructive, automated melodic audio source
  separation software. Using audio analysis and separation techniques, trax will
  automatically create two separated tracks from a mono or stereo file: a vocal
  track and a music track.
specs: |-
  - Non-destructive audio source separation
  - Consonants annotation tool
  - Stems file format export
  - Zoom-to-fit option
  - Import MIDI as a pitch guide
  - Intuitive, user friendly graphical user interface
  - Integrated post-separation enhancement
  - Multiple bit depth and sample rate compatibility
  - Multi-algorithmic processing matrix
  - Secure, powerful, cutting-edge & lightning fast cloud computing
  - Mac os x 10.9
  - Mac os x 10.10
  - Cpu core duo 2.3ghz
  - Ram 2 gb
  - High speed internet connection
