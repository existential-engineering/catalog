description: IconDrum is a virtual drum machine plugin by GForce Software that recreates the iconic sounds of legendary 1980s Linn drum machines. It serves as a bridge connecting the iconic sounds of the early 80s with the creative possibilities offered by modern rhythm creation methods.
details: |-
  IconDrum is a 12-track virtual drum machine inspired by the legendary Linn drum machines that defined the sound of early 1980s productions. It features 100 authentic drum sounds across 12 dedicated tracks, with the ability to load up to 24 sounds in total, giving producers a comprehensive toolkit for classic and modern rhythm creation.

  Each of the 12 tracks includes individual controls for pan, solo, mute, pitch, decay, delay send, and reverb send, offering deep per-voice shaping capabilities. Drum tracks cover the full classic palette: Bass, Snare, Sidekick, Hi-Hat, Toms, Ride, Crash, Cabasa, Tambourine, Conga, Cowbell, and Claps.

  IconDrum includes a 3-slot master effects chain featuring distortion, multi-mode filter, compressor, EQ, bitcrusher, gate, and phaser. Over 70 preset kits span classic, modern, and hybrid variations, and more than 70 MIDI pattern files with classic recreations are included.
specs: |-
  - 12-track drum machine with up to 24 sounds total
  - 100 authentic drum sounds
  - Individual track controls: pan, solo, mute, pitch, decay, delay send, reverb send
  - 3-slot master effects: distortion, multi-mode filter, compressor, EQ, bitcrusher, gate, phaser
  - 70+ preset kits (classic, modern, hybrid)
  - 70+ MIDI pattern files
  - Velocity control and separate outputs
  - GM Map for MIDI controllers
  - Fully scalable UI
  - mac: Intel & Apple Silicon native, macOS 10.13+, 2GB RAM
  - windows: Windows 7+, 2GHz CPU, 2GB RAM
