description: IconDrum is a virtual drum machine plugin by GForce Software that
  recreates the iconic sounds of legendary 1980s Linn drum machines. It serves
  as a bridge connecting the iconic sounds of the early 80s with the creative
  possibilities offered by modern rhythm creation methods.
details: |-
  The GForce IconDrum pays homage to the legendary Linn drum machine revising the concept for today's digital age. The IconDrum provides a bridge connecting the iconic sounds of the early 80s with the creative possibilities offered by modern rhythm creation methods.

  Authentic Sound: immerse yourself in the vibe of old-school drum sounds, recreated and refined for pristine clarity without losing their classic digital warmth. The IconDrum brings you a rich library of 100 authentic sounds, each carrying the soul of the original machine. Limitless Creativity: aligned with its innovative feature set, the IconDrum's sleek and user-friendly interface invites everyone, from beginners to experienced producers, to engage, experiment, and create sounds that are timeless and span a multitude of musical styles.

  Like the Oberheim DMX drum machine, the original Linn hardware has left an indelible mark on the soundscape of popular music, crafting the rhythmic foundation of timeless tracks across a spectrum of genres. We've included all the original sounds, maintaining their unique character that propelled these classic tracks. The IconDrum also offers many alternatives, expanding the classic sound set to inspire both nostalgic recreations and fresh, innovative productions.

  The IconDrum is more than just a drum module; it's a tribute to the machine that defined an era and a gateway to the rhythms of tomorrow. Designed for those who cherish the timeless sounds of the original yet seek to push creative boundaries, the IconDrum invites you to explore the essence of the classic in a modern context. Kickstart your inspiration with an extensive collection of iconic MIDI pattern files, expertly constructed to honour the rhythms that shaped music history.

  Modern Mastery: immerse yourself in the iconic twelve-part sound kit of the IconDrum, now enhanced with full control over pan, solo, mute, pitch, decay, analogue-style delay send, and lush reverb send for each channel. Ultimate Sound Sculpting: take command on the master channel with a multi-mode filter, distortion, EQ, and compressor, delivering the warmth, depth, and punch only found in vintage gear.
specs: |-
  - 12-track drum machine with up to 24 sounds total
  - 100 authentic drum sounds
  - Individual track controls: pan, solo, mute, pitch, decay, delay send, reverb send
  - 3-slot master effects: distortion, multi-mode filter, compressor, EQ, bitcrusher, gate, phaser
  - 70+ preset kits (classic, modern, hybrid)
  - 70+ MIDI pattern files
  - Velocity control and separate outputs
  - GM Map for MIDI controllers
  - Fully scalable UI
  - mac: Intel & Apple Silicon native, macOS 10.13+, 2GB RAM
  - windows: Windows 7+, 2GHz CPU, 2GB RAM
