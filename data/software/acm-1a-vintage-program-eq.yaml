details: >-
  Available as a free addition for existing users of the applied computer music
  technologies acm-2sa plug-in, the acm-1a features an updated dsp model with
  improved hf boost and attenuate control interaction, together with a modified
  transformer saturation model which extends the low-end for greater bass
  response compared to the original plug-in.


  The acm-1a combines high performance processing with an intuitive stylized
  user interface. Perfect for adding that big studio sound to 'in the box'
  mixes.


  Smooth controls with no 'zipper noise' when adjusting the plug-in settings.
  Physically modelled rotary control modes. Resizable graphical user interface.
  Separate low frequency boost and cut to shape the signature sound.


  Transformer-coupled valve / tube amplifier emulation enhances the desirable
  vintage tone. Innovative processing models analogue filter behaviour - without
  additional latency or high cpu demand.


  Valve / tube emulation adds subtle character even with the eq bypassed. Demo
  versions are free to download.
