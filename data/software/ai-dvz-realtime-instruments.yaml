details: >-
  Audio impressions' realtime instruments is a comprehensive package of ten
  sample libraries, which are powered by dvz rt. These libraries include
  orchestral, band, world, keyboards, guitars, drum kits, music effects, harps,
  baroque & antique instruments, les grandes orgues (pipe organs).


  Realtime instruments uses a distributed / clustered computing approach whereby
  you have one "dvz rt control computer", multiple "sampler" computer's, each
  running native instruments' kontakt sampler, and your existing computer
  running your sequencer of choice hosting the ai plug-in - VST on windows, AU
  on mac os x - which communicates with the other computers via gigabit Ethernet
  (rewire and an additional ai panel application are also used).


  The dvz rt control computer provides the main graphical user interface (gui)
  for selecting library instruments, patterns, effects, orchestrations and so
  forth, performs dvz rt voice allocation accomplishing the actual divisi so
  that notes played are allocated to the various sections and players within
  each section, receives audio back from the various samplers via
  audio-over-Ethernet, and processes that audio with audio impressions' "space"
  software to provide placement of each player anywhere one desires within a
  virtual-performance environment with realistic microphone bleed among all
  players.


  Realtime instruments includes over 600 sampled instruments arranged in ten
  libraries, with most being solo players; in the case of the 70 orchestral
  string realtime players, 10 are soloists and thirty are 2-musician desks. The
  most comprehensive set of playing styles and effects for each instrument was
  recorded; all effects and styles appropriate to each instrument, such as
  mutes, bow positions, pizzicato, and flutter tongue are available at start up.


  All realtime instruments samples were captured in "the world's finest
  recording studios" using "first-call players" and "the world's best
  instruments". These were recorded at the highest audio fidelity utilizing
  vintage neumann and telefunken tube condensers and ribbon mics, and
  silver-plated mic cables (completely bypassing studio patch bays); signals
  were recorded directly. No equalization, compression or other processing was
  used, instead sound was optimized through mic selection and placement.
