description: LiquidSonics' Illusion is a flagship hybrid reverb plugin introducing Fusion-IR | Synthesis technology, combining modulated convolution with algorithmic synthesis across halls, chambers, plates, and creative reverb spaces.
details: |-
  Illusion is LiquidSonics' flagship reverb plugin, introducing the proprietary Fusion-IR | Synthesis technology — a hybrid approach combining modulated convolution with algorithmic reverb synthesis. This allows Illusion to deliver the realism of impulse responses with the flexibility and modulation depth of a fully synthetic engine.

  The plugin features three independent reverb engines, each with its own set of controls. Users can dial in early reflections, late reverb, and a master module independently, each equipped with a 5-band parametric EQ, spectrum analyzer, and three-band roll-off filters ranging from 6 to 36 dB/Oct with optional digital brick-wall filtering.

  Illusion supports advanced dynamics processing including compression and ducking with sidechain support, enabling the reverb tail to react to the incoming signal. A 'flux' modulation control adds spatial movement, while true-stereo width control and up to three independent tempo-synchronized echoes provide creative flexibility for any production context.

  Designed for professional workflows, Illusion offers pre-delay up to 500ms and late reverb delay up to 750ms, both optionally synced to host tempo. iLok licensing is required (iLok 2/3 dongle, machine activation, or iLok Cloud). A 14-day free trial is available for both macOS and Windows.
specs: |-
  - Three independent reverb engines with Fusion-IR | Synthesis algorithm
  - Modulated convolution combining IR realism with algorithmic flexibility
  - Up to 3 independent tempo-synchronized echoes
  - Pre-delay: 0–500ms (optionally host-tempo synced)
  - Late reverb delay: 20–750ms (optionally host-tempo synced)
  - 5-band parametric EQ on early, late, and master modules
  - Spectrum analyzer per module
  - Three independent roll-off filters: 6–36 dB/Oct with digital brick-wall option
  - Compression and ducking with sidechain support
  - Flux modulation control for spatial movement
  - True-stereo width control
  - 64-bit only; Windows 7+, macOS 10.13+
  - iLok 2/3, machine activation, or iLok Cloud licensing required
  - 500MB disk space; 8GB RAM recommended
