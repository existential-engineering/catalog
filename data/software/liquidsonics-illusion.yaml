description: LiquidSonics' Illusion is a revolutionary new reverb and introduces
  Fusion-IR | Synthesis. From lush cathedrals and halls to plates and chambers,
  Illusion revolutionises reverb simulation for Mac and PC DAWs.
details: |-
  Illusion is LiquidSonics' reverb plugin built on Fusion-IR | Synthesis, described by the manufacturer as a groundbreaking evolution of the Fusion-IR modulated convolution technology. It goes beyond the abilities of traditional algorithmic reverbs by using a different approach to reverb simulation, bringing rooms, spaces, plates and outdoor environments to life. From simulations of natural environments including halls, chambers and rooms to classic nonlinear and plate reverbs, it synthesises a diverse range of spaces intended to blend with drums, guitars, synthesisers, vocal performances and orchestral ensembles.

  Three independent and bespoke reverb engines drive the synthesis. The algorithms are designed to simulate small environments for tight, dense chambers and rooms, large environments such as churches, cathedrals and halls, classic plates reproducing the dispersive and multi-band decay properties of metallic plate reverbs, and nonlinear reverbs known for 1980s percussion, available as part of the early reflections processor for combination with any of the above. Illusion provides control over a space's perceived size, reflectivity, low-end response and multi-band decay rate.

  Early reflections are synthesised using a technique removed from the usual diffused point-delay approach, giving modulated reflections without colouration, phasing, flanging or chorusing artefacts. The proximity of the receiver to the source can be freely chosen and the reflectivity or absorption of the room controlled, with a selection of reflection patterns for auditioning different acoustic properties. A single modulation control, flux, blends a multitude of motion effects, running from a subtly modulated decorrelated reverb at low settings through noticeable spatial modulation to a fully chorused reverb at maximum, or switched off entirely for a completely still reverb.

  Dynamics processors allow compression and ducking to be applied selectively rather than across the whole reverb. Compression can target the input, reflections, reverb, reverb plus VLF (very low frequency reverb), or the wet signal, and ducking can target reflections, reverb, reverb plus VLF, or wet, with an external sidechain source supported. This lets the late reverb be pushed down during vocal phrases or busy instrumentation while the early reflections, which are crucial for spatialisation, stay at full volume.

  Equalisation covers analogue-style roll-off filtering from 6 to 36 dB/Oct on both the early reflection and late reverb modules, vintage digital brick-wall filtering that reproduces the limited audio bandwidth of 1970s and 1980s digital reverbs, and 5-band oversampled parametric EQ for each of the early and late modules plus a further 5-band master EQ, with a spectrum analyser illustrating the spectral content of each component. Pre-delay runs from 0 to 500 ms with optional host tempo sync, up to three tempo-synchronised late reverb echoes from 20 to 750 ms are available, and a true-stereo width control takes the reverb from mono to a fully decorrelated true stereo image without phase or mono-compatibility artefacts.
specs: |-
  - Three independent and bespoke reverb engines
  - Powerful reverb synthesis algorithms: small and large environments, classic plates, non-linear reverb
  - Advanced early reflection synthesis
  - Revolutionary flux modulation control
  - Independent roll-off (6-36 dB)
  - 2x vintage digital filtering effects
  - Fully decorrelated reverb width control
  - Independent spectrum analysis
  - Pre-delay: select from 0 to 500 ms, optionally sync to host tempo
  - Option to delay the early and late reverbs independently
  - Late reverb delay (x3): select from 20 to 750 ms, optionally sync to host tempo
  - Density and diffusion controls
  - Mix and gain level control
  - Oversampled master equaliser for early/late/master
  - Tool-tip help available on most parameters
  - Advanced metering for in/out/early/low/late reverbs
  - Mono-to-stereo and stereo-to-stereo channel configurations supported
  - Compression applicable to input, reflections, reverb, reverb + VLF, or wet
  - Ducking applicable to reflections, reverb, reverb + VLF, or wet
  - External sidechain dynamics source supported
  - Bit depth (crusher) applicable to input, reflections, reverb pre, reverb post, or output
  - iLok 2/3, iLok machine activation or iLok Cloud required
  - Windows 7 and above
  - OS X / macOS 10.13 and above
  - VST 2.4, VST3, Audio Unit (AUv2) and AAX Native plug-in formats
  - 64-bit DAWs (32-bit is not supported)
  - 500 MB hard disk space is required
  - At least 8 GB of main memory is recommended
  - A dual core i5 processor or above is recommended
  - macOS installer contains 64-bit Universal Binaries (Apple Silicon and Intel x64)
