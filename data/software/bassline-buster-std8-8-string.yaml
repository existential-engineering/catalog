  - Pick style
  - Automatic alternate picking
  - Slapping
  - Tapping
  - Palm mute
  - Slides and bending
  - Hammer-on
  - Pull-off
  - High resolution samples with lossless compression
  - Unprocessed clean DI
  - Clean amp output
  - Dirty rock amp output
  - Overdrive pedal + amp output
  - Amd or intel multi-core CPU
  - 4 GB RAM minimum (8 GB recommended)
  - 2 GB free hdd storage
  - Intel or apple silicon CPU (m1)
  - Requires DAW with VST3 or AU compatibility
  - Not compatible with AAX / Pro Tools
