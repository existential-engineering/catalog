details: |-
  This is the first-ever virtual octave 8-string bass guitar plug-in: the
  handcrafted bassline buster std 8. The original bass was sampled and put into
  VST3/AU plugin format, so you can use it as MIDI instrument in your DAW.

  The original instrument was handcrafted by bassline in krefeld, germany. It
  features active electronics and custom components, like a special ets bridge.
  The plug-in offers you different playing styles inclusive alternate picking
  and many more stuff.

  As a producer you're always keen on the perfect tone and sound to make your
  production unique. We've sampled this special, octaved 8-string high-class
  bass guitar and put it into a plug-in. It's a plug-in that gives you an unique
  and realistic sounding "copy" of the original bass.

  Unique 8-string bass sound with octave strings. Perfect fit for melodic rock
  and epic tracks. Great for other genres, too.

  Requires a DAW with vst3 or AU compatibility such as cubase, ableton live,
  reaper, bitwig, presonus studio, fl studio, mixcraft or other. This product is
  not compatible with AAX / pro tools.
specs: |-
  - Audio Units (AU) plugin
  - MIDI instrument
