details: |-
  Add BigSky to your track and instantly lift your sound into the stratosphere.
  From vast, immersive, nearly infinite decays to responsive plates perfectly
  tuned to organically accentuate vocal performances, BigSky offers the pinnacle
  of premium reverb sounds with unparalleled depth and spaciousness.

  Bigsky is an inspiring sound design tool with a character all its own. Unique
  handcrafted algorithms full of vibe and sonic interest combined with fast,
  intuitive controls allow you to create your own distinctive sound and give
  your project a compelling sonic signature.

  We've handpicked the most essential reverb controls and tailored their range
  and functionality so that sounds can be created effortlessly without extended
  tweaking. The layout naturally and intuitively adjusts to control the feature
  set of each reverb machine.

  Within bigsky, we utilized traditional reverb elements such as feedback-delay
  networks, allpass-delay-filter loops, schroeder reverb sections and
  multi-tapped delay-lines, as well as all-new reverb elements that we developed
  along the way.

  Bringing bigsky into your DAW unlocks a range of new opportunities for
  creativity. The ability to easily use a separate instance of bigsky for each
  individual track allows limitless audio possibilities, and enables you to
  audition and sculpt those reverb sounds in the context of a complete musical
  recording.
specs: |-
  - 12 unique reverb machines
  - Cloud reverb
  - Bloom reverb
  - Swell reverb
  - Spring reverb
  - Plate reverb
  - Hall reverb
  - Room reverb
  - Reflections reverb
  - Nonlinear reverb
  - Magneto reverb
  - Shimmer reverb
  - Chorale reverb
  - Feedback-delay networks
  - Allpass-delay-filter loops
  - Schroeder reverb sections
  - Multi-tapped delay-lines
  - Parameter automation
  - Infinite sustain/freeze
  - Resonant filter
  - Psychoacoustically accurate algorithms
  - 250 reflections calculation
  - Multi-head echo
  - Pitch-shifted tones
  - Modulation controls
