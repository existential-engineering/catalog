name: Bong
manufacturer: xoxos
primaryCategory: drum-machine
categories:
  - synthesizer
description: Bong is a digital classic percussion synthesizer. A selection of 41
  models feature timbres inspired by the golden age of electronic drums.
details: |-
  Bong comes as a zip file (3,28mb ~ 3.444.167 bytes) and contains the dll & a
  PDF. No keyfile, no ilok. Demo is fully functional but contains bird sounds as
  a protection. 32-bit & windows only. After loading an instance of bong into
  your DAW you will be prompted to choose between a simple 2 channel stereo (1 x
  2) or a 12 channel (6 x 2) setup.

  The oscillator section is divided into three parts: pitchandtoneplaceland with
  parameters like pitch, rate, amt, tone; decay land and stuff land with
  envelope controls where the decay parameter works as expected and the release
  parameter functions as a shape option for the decay; and pirate hole treasue
  with osc amp controls. Additional shaping options in land of the second source
  add frequency content like noise or snap. The final areas are stereoland,
  panlandia, and ampia for output gain and stereo positioning.

  The kicks have substantial low-end content, snares include a brush mode, claps
  have wet characteristics, hihats come in three playmodes (two closed and open)
  plus a cymbal with either pure noise or sinewave backup for metallic timbre,
  toms can act as congas or laser, shaker has tambourine mode and can be played
  forward & backward, and rimshot comes with an optional clave model. Most
  modules feature variable noise for organic sound and velocity amount knobs for
  dynamic variations.

  This device performs lightweight on cpu (tested on dualcore 2.5ghz) without
  flaw. The plugin uses pure algorithmic synthesis with no pcm samples, creating
  organic variations through dedicated algorithms rather than post-processed
  samples. 33 patches are included as starting points for custom sound design.
specs: |-

  - 32-bit windows

  - 2 channel stereo output (1 x 2)

  - 12 channel output (6 x 2)

  - 41 drum models

  - Oscillator section with pitch, rate, amt, tone parameters

  - Envelope controls with decay and release parameters

  - Oscillator amplifier controls

  - Noise and snap shaping options

  - Stereo field adjustment

  - Mono/stereo knob

  - Variable noise option

  - Velocity amount knob

  - Dedicated drum modules: kicks, snares, claps, hihats, toms, congas, laser,
  shaker, tambourine, rimshot, clave, brush mode, cymbal

  - Pure algorithmic synthesis (100% synthesis, no pcm samples)

  - 33 presets included
