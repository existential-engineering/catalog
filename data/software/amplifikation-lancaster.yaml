details: |-
  Amplifikation lancaster is the fourth product in kuassa's range of guitar amp simulator products utilizing their 3rd generation modeling technology. Inspired by vox combo amps, it guarantees a satisfying, dynamic, natural sounding, realistic amp recording experience for guitarists.

  The plugin recreates the original tone and feel of vox amplifiers throughout the decades, making distinct sounds from the 70's, 90's and late 2000's accessible for guitarists. A parallel signal path from the normal and top boost channel similar to the jumpered-mod gives the amp more mojo, and a treble booster pedal fx is included giving the plugin a total modern incarnation of the original hardware setup.

  Three amp types are taken from different eras: lancaster a (late 2000's ac30, breaks up and overdrives early with raw and raucous tone), lancaster b (1990s limited edition ac30, fat and slightly compressed with thick overdrive or distortion sound), and lancaster c (modified 1970s ac30, cleaner sound with huge headroom and loud jangly tone).

  The plugin features five types of cabinets with impulse responses taken from genuine vox combo amps, and seven types of workhorse microphones including shure sm57, sennheiser md421, sennheiser md441, c&t naked eye, royer 121, akg c414, and neumann. Freely adjustable dual-miking configurations with mono or stereo configuration are available, just like a real-life guitar recording session with mix option.

  Amplifikation lancaster supports various audio plugin formats (VST/vst3/AU/AAX) compatible with any kind of digital audio workstation software. Standalone and amplifikation 360 modules versions are also available.
