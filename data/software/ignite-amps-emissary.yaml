description: "Digital emulation of a custom dual channel guitar tube amplifier
  built for Ryan Huthnance (The Seer / Gaped / Chrome Bison / Emissary Studios)
  by Ignite Amps in 2014. Features a versatile clean channel ranging from
  pristine cleans to slightly overdriven tones and a lead channel designed for
  bone-crushing distortions, with 3rd generation triode modeling and dynamic
  EL34/6L6GC/KT88 pentode modeling."
details: |-
  2.0.2

  Ignite Amps 3rd generation triode modeling engine
  Dynamic EL34 / 6L6GC / KT88 pentodes/tetrodes analog modeling (push-pull stage)
  Two channels: clean and lead with fully separated controls
  Selectable power tubes with individual bias controls
  Selectable oversampling rate (up to 8x)
  Global input / output level controls
  Double precision (64-bit) floating point mathematical model
  Mono / Stereo processing support
  Fully automatable controls
  Ignite Amps proprietary preset management system with bank file import/export
