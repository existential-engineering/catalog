name: Bassesland Electric, Acoustic and Synth Bass
manufacturer: instru
primaryCategory: synthesizer
url: https://bassesland.syntheway.net
description: Bassesland is a virtual bass that emulates a wide range of sounds
  of electric, acoustic and synthesizer basses.
details: |-
  Bassesland electric, acoustic and synth bass by syntheway virtual musical
  instruments is a virtual instrument audio plugin for macos and windows. It
  functions as a VST plugin, an audio units plugin and a VST 3 plugin.

  These universal 2 binary (arm64) plugins run natively on both apple silicon
  (m1, m2, m3) and intel-based mac computers.

  The plugin includes a tremolo section with low frequency oscillator featuring
  rate, depth, switchable waveform and selectable modulation source to
  modulation destination, adsr envelope generator, filter section, pitch bend,
  amplitude range parameters, and reverb control.

  DAW host applications with audio unit, VST or vst3 support can be used to
  process audio, such as logic pro, garageband, cubase, ableton live, reaper,
  studio one professional, ardour, mainstage and digital performer among others.
specs: |-



  - Windows 11, windows 10, windows 8.1, windows 8, windows 7 (32 or 64-bit)

  - Macos sonoma 14, macos ventura 13, macos monterey 12, big sur 11, catalina
  10.15, mojave 10.14, high sierra 10.13, sierra 10.12

  - Universal 2 binary (arm64) plugins

  - Apple silicon (m1, m2, m3) and intel-based mac computers

  - MIDI keyboard controller support

  - Asio compatible sound card recommended

  - 40 preset sounds

  - Tremolo section with low frequency oscillator

  - Adsr envelope generator

  - Filter section

  - Pitch bend

  - Amplitude range parameters

  - Reverb control

  - Electric bass emulations with harmonics, slides, slaps, muted, wah effect
  and fills

  - Upright acoustic double bass emulation

  - Electro acoustic bass emulation

  - Synth bass emulations based on vintage synthesizers

  - Arp 2600, clavia nord lead, kawai k3, korg 01/w, minilogue, ms2000,
  memorymoog, micromoog 2090, minimoog model d, little phatty, minitaur,
  prodigy, system 55, taurus bass pedal, oberheim ob-xa, osc oscar, roland
  juno-60, juno-106, jx-3p, jx-8p, mc-909, tb-303, yamaha dx7
