description: Free one lane euclidean rhythm sequencer.
details: |-
  RhyGenerator One is the simplified version of RhyGenerator, an Euclidean step sequencer made by HoRNet Plugins together with the electronic music artist HATEFISh. The sequencer is designed to distribute as evenly as possible a certain number of "beats" in a given number of "steps".

  The Euclidean rhythm in music was discovered by Godfried Toussaint in 2004 and is described in a 2005 paper, "The Euclidean Algorithm Generates Traditional Musical Rhythms". The greatest common divisor of two numbers is used rhythmically giving the number of beats and silences, generating almost all of the most important World Music rhythms (except Indian). The beats in the resulting rhythms are as equidistant as possible, and the same results can be obtained from the Bresenham algorithm.

  Simply put, with RhyGenerator One you can create a rhythm consisting of up to 32 steps. It comes in the standard VSTi for VST and VST3, as an instrument for AAX and a MIDI effect for the AU version.

  RhyGenerator One outputs the specified note following the rhythm generated by the Euclidean algorithm and allows you to control the number of steps and beats separately, the velocity and the length of the note. You can also shift the sequence by any number of steps to create upbeats and movement, and every parameter in the sequencer can be automated for a more interesting effect.

  The HATEFISh RhyGenerator One has no copy protection. HoRNet does not believe in copy protection, as it is always cracked and annoying for users, so the plugin can simply be downloaded and used.
specs: |-
  - Euclidean step sequencer
  - Up to 32 steps
  - Shift option
  - Automatic euclidean rhythm generation
  - MIDI effect in Logic Pro X
  - Resizable vector GUI
  - Hardware accelerated user interface
  - Apple silicon M1 native support
  - Mac OS X (>=10.11) and Windows (Vista and later) support
  - 64-bit compatibility both on Mac and Windows
  - Audio Units, VST2.4, VST3 and AAX format
  - No copy protection
