description: Free one lane euclidean rhythm sequencer.
details: |-
  RhyGenerator One is the simplified version of RhyGenerator, a Euclidean step sequencer made by HoRNet Plugins together with the electronic music artist HATEFISh. The sequencer is designed to distribute as evenly as possible a certain number of beats in a given number of steps.

  The Euclidean rhythm in music was described by Godfried Toussaint in a 2005 paper, 'The Euclidean Algorithm Generates Traditional Musical Rhythms'. The greatest common divisor of two numbers is used rhythmically, giving the number of beats and silences, and the beats in the resulting rhythms are as equidistant as possible.

  With RhyGenerator One you can create a rhythm consisting of up to 32 steps. It ships as a standard VSTi for VST and VST3, as an instrument for AAX, and as a MIDI effect for the AU version, so it appears as a MIDI effect in Logic Pro X.

  RhyGenerator One outputs the specified note following the rhythm generated by the Euclidean algorithm and lets you control the number of steps and beats separately, along with the velocity and the length of the note. The sequence can also be shifted by any number of steps to create upbeats and movement, and every parameter in the sequencer can be automated for a more interesting effect.

  The plugin is free: it is downloaded by adding it to the cart at no charge. The user interface is a resizable vector GUI with hardware acceleration.
specs: |-
  - Euclidean step sequencer
  - Up to 32 steps
  - Shift option
  - Automatic euclidean rhythm generation
  - MIDI effect in Logic Pro X
  - Resizable vector GUI
  - Hardware accelerated user interface
  - Apple Silicon M1 native support
  - Mac OS X (>=10.11) and Windows (Vista and later) support
  - 64-bit compatibility both on Mac and Windows
  - Audio Units VST2.4, VST3 and AAX format
  - No copy protection
