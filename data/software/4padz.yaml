details: |-
  4padz is a plugin designed for dark pads creation. This plugin counts with 3 fm mini-synths, 3 waveforms per synth, lfo with envelope, stereo spread, and 5 effects: reverb, equalizer, chorus, phaser, and chorder (play chords instead of notes).

  Design dark pads quickly with 4padz. 4padz is a donationware product (minimum $25) for windows and mac os x vst2/vst3/AU 64-bits.

  4padz by psytrance plugins is a virtual instrument audio plugin for macos and windows. It functions as a VST plugin, an audio units plugin and a VST 3 plugin.
