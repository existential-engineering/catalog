description: "Motor is a plugin that combines signals in new ways: they will
  dance around each other like courting birds drunk on fermented cherries."
details: |-
  Motor is a plugin effect that uses side-chaining to combine signals in new and interesting ways: put in any two signals and they will dance around each other like courting birds drunk on fermented cherries. Use it to gently morph between sounds or rhythmically cut them up, affecting both volume and spatial position. Add life to the plainest signals with vibrato, or destroy them in interesting ways with extreme modulation speeds.

  Motor takes cues from history: 'The Crystal Palace' built by Dave Young for the BBC Radiophonic Workshop. This one-of-a-kind tool allowed speed-dependent switching of up to sixteen audio channels, in an almost steampunk fashion, by employing a big capacitor rotating on a motor. The effects it created reached from sublime to almost granular, a major achievement at the time. You can hear it on the soundtrack to the Doctor Who episode 'The Krotons' by Brian Hodgson and Delia Derbyshire.

  Things Motor focuses and expands on this peculiar tool by allowing the combination of two signals via sidechain, which makes it work easily across platforms. Switching is controlled via a variable waveshape LFO instead of the fixed physical waveform of the original. This allows for smooth morphing or aggressively chopped sounds, and worlds in between. You can even use it for audio rate modulation of signals, which results in ring-modulation-like artifacts.

  To make it a truly versatile tool, AudioThing added a vibrato and a panner synced to the 'motor' LFO, as well as some of their classic analog-like sound shaping. Together with the variable time on the motor start/stop this becomes a sound morphing rotary effect. It was made in collaboration with Hainbach, a Berlin-based electronic music composer and performer.

  Things - Motor is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP). It is also available on the App Store for iOS and iPadOS (AUv3 and Standalone), for iPhone and iPad.
specs: |-
  - Signal chopper
  - Tremolo, Vibrato, Panner
  - Multi-wave LFO (Sine, Triangle, Ramp Up, Ramp Down, Square, Sine Up, Sine Down, Exp Up, Exp Down, S&H)
  - LFO Start/Stop with Speed Control
  - Brightness and Contrast Controls
  - Resizable Window
  - Preset system with randomizer
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP 64-bit)
  - macOS 10.13 - macOS 26, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP 64-bit)
  - 1 license up to 3 computers, no iLok, no internet connection required to activate
