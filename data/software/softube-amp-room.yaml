description: Amp Room is the pro audio bass and guitar plugin platform for the
  producer featuring modeled legendary vintage gear in Amp Room Suites, amp
  sims, Marshall amps.
details: |-
  Imagine a luxury studio full of carefully chosen vintage gear. There are legendary compressors and EQs, classic Marshall amps and cabinets, pedals, mics, and more. Everything is ready and waiting for you to create top-tier guitar and bass tones.

  That's the Amp Room platform. Softube's legacy of modeling analog gear with unmatched accuracy means you can create authentic, mix-ready tones with ease and flexibility. Amp Room and Amp Room Suites are your very own high-end software studio.
specs: |-
  - Create the same authentic, incredibly realistic sounds you would in a high-end studio filled with carefully selected gear
  - Choose from five suites: Amp Room ENGL Savage Mark II Suite, Amp Room Marshall Suite, Amp Room Vintage Suite, Amp Room Bass Suite and Amp Room Metal Suite
  - Load officially licensed studio effects from Tube-Tech, Empirical Labs, Trident, and more
  - Expandable with other Amp Room Suites and Amp Room Ready Softube products
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26
  - System requirements: Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a DAW host compatible with AU, VST, VST3 and/or AAX
