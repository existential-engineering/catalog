description: A preamp plugin, a saturator, and a compressor based on the
  Empirical Labs Distressor—all in one native Empirical Labs plugin. Mike-E Comp
  compressor plugin offers one-of-a-kind saturation and compression, plus NUKE
  mode.
details: |-
  Precisely modeled in close collaboration with Dave Derr, Empirical Labs Mike-E Comp offers high-caliber, one-of-a-kind saturation/compression based on the famous ELI Distressor. A punchy preamp that's available before the CompSat circuitry, and three different emphasis modes—plus NUKE!—enable multi-stage distortion and quick changes to the character of the saturation/compression behavior. Available for the first time as a native plug-in, Mike-E makes it a total blast to go overboard. And when you do, you're rewarded with nary a hint of harshness—no matter how far you push it to the extreme.

  The core of Mike-E is its class-leading CompSat. The bones of the compressor are those of the legendary ELI Distressor, one of the most-beloved contemporary compressors in existence. With its huge control range, novel feature set, and longer attack time, Mike-E employs a custom-designed gain control circuit to give a warm and toasty analog sound. The killer multi-stage soft-clipping circuit saturator is never harsh. And Emphasis—a multi-stage circuit that emphasizes the high-frequencies before the CompSat circuit, and then cuts the frequencies after it—is there to enhance the tone. Plus, NUKE!

  The punchy preamp, with its bold and crunchy distortion, is precisely modeled on the line input section of the original hardware. With a unique stepped gain control, it lets you push the CompSat section harder for increased compression and saturation. It also offers the option of distortion before the CompSat section. Mike-E makes it easy to create tons of different types of sounds on as many different sound sources, and it always sounds analog and musical.

  Included as a module for Softube's pro audio guitar and bass platform, Mike-E blows the lid off sound creation possibilities in Amp Room. It's a completely unconventional character tool that makes it an unusually excellent addition to the Amp Room toolset. Use it on bass sounds where it's especially bomb.

  Empirical Labs Mike-E has sharp elbows. It offers in-your-face analog attitude in a straightforward, modern interface. It boasts a high-performance preamp, a one-of-a-kind compressor/saturator circuit that delivers classic knee compression and varied tonal coloring which replicates the best traits of analog recording gear, Wet/Dry, and added External Sidechain. What it gives you is beefy, punchy drums where you can hear the decay in a dense mix, fat and harmonically sweet-sounding bass, soft-knee compression with warm, triode-type saturation on vocals, and the super steep, limiter-like NUKE mode with its different Attack/Release shapes.
specs: |-
  - A preamp, compressor, and saturator in one
  - Available for the first time in native plug-in form
  - Developed in close collaboration with Dave Derr and Empirical Labs
  - Expertly modeled down to the component level
  - Compressor in the CompSat circuitry functions like the famous Distressor
  - Including NUKE mode
  - With preamp distortion before the CompSat section
  - Featuring three Emphasis Modes and Wet/Dry
  - Added External Sidechain and attack time preset
  - Available as a module in Amp Room
  - Supports Softube Extended Features panels
  - Console 1 Ready: usable within the Console 1 mixing system
  - Requires a Softube account
  - Requires an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access for downloading installers and managing licenses
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Three activations
