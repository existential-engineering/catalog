details: |-
  Completely re-engineered, higher-resolution dsp engine with hundreds of
  improvements delivers the ultimate in responsive, detailed and varied guitar
  tones.

  Featuring the same industry-leading amp engine found in bias amp 2, bias fx
  2's unmatched responsiveness and dynamics faithfully reproduce your unique
  feel and every subtle ghost note and palm mute. The amp engine's
  component-level simulation accurately reproduces the tone and dynamics of the
  most popular amps down to the last glowing tube and precision resistor,
  creating the most authentic, full-bodied and warm guitar tones available.

  With bias fx 2's groundbreaking guitar match technology, you can transform
  your guitar—any guitar—into a hoarder's collection of legendary axes, each
  precisely recreated down to their pickups, body type and body thickness. No
  special pickup is required to make your guitar sound like a classic american
  guitar, a vintage lp and more.

  Bias fx 2's stockpile of foot pedals can be expanded by downloading thousands
  of shared, custom foot pedals from tonecloud, positive grid's worldwide social
  network of players, engineers and producers. With bias fx 2 you can easily hot
  rod your distortion, delay and modulation pedals using the fully integrated
  bias pedal software included with bias fx 2 elite, creating pedalboards and
  sounds nobody else has.

  Each preset in bias fx 2 has four "scenario" settings you can create and save,
  so you can recall multiple distinct but closely related pedalboard scenes.
  With one click, you can simultaneously turn overdrive and delay on for your
  lead solo and turn off the chorus effect you used on the song's verse—all
  while preserving the rest of the preset's settings.
