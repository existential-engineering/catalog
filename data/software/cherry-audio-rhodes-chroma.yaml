details: |-
  The Rhodes Chroma brings back the spirit and sounds of the iconic Rhodes
  Chroma polyphonic analog synthesizer from 1982 with the utmost accuracy.
  Originally released by Cherry Audio and rebranded through collaboration with
  Rhodes Music, it maintains faithful recreation of the original hardware
  enhanced with modern features.

  In 1979, pioneers at ARP Instruments began developing the Chroma, a 16-voice
  polyphonic marvel with microprocessor control, aftertouch, and advanced signal
  routing. The design later moved to CBS and was released under the Rhodes brand
  in 1981. Between 1982 and 1984, approximately 3,000 units were manufactured.
  The synthesizer was famously used by Herbie Hancock, Joe Zawinul, and provided
  the signature chords in Spandau Ballet's 1983 hit "True."

  The virtual instrument meticulously recreates the original's complexity with
  16 oscillators, filters, VCAs, and LFOs, plus 32 envelope generators across
  16 preconfigured signal paths. It features an improved user interface that
  dramatically simplifies programming through intuitive pop-up elements and
  real-time displays, and includes the Chroma Expander emulation for layer and
  split modes.

  The plugin includes the original 250 factory presets plus 450 additional
  custom presets. It features seven studio-quality integrated effects and
  supports direct SysEx import from original hardware and cassette tape data
  from the 1980s.
specs: |-
  - Faithful emulation of the 1982 Rhodes Chroma with 16 voices
  - 16 oscillators, filters, VCAs, LFOs, and 32 envelope generators
  - 16 distinct preconfigured signal paths including oscillator sync, filter FM, ring modulation, and serial filters
  - Includes Rhodes Chroma Expander module with layer/split modes
  - SysEx import capability for MIDI-retrofitted original hardware
  - Cassette tape data import (uncompressed .wav files)
  - Seven onboard effects: distortion, phaser, flange/chorus, delay, reverb, global EQ, and limiter
  - 700 presets across 12+ categories
  - Full MIDI control and DAW automation with MIDI Learn
  - User-adjustable oversampling control
  - Focus zoom feature and standard UI zoom/resize
  - macOS 10.13+ and Windows 7+ (64-bit)
  - 74 MB disk space required
