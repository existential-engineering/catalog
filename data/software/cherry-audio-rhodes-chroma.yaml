details: |-
  Rhodes Chroma is a virtual instrument that brings back the spirit and sounds of the iconic Rhodes Chroma polyphonic analog synthesizer from 1982. Originally released by Cherry Audio in May 2024, the plug-in was later rebranded through a collaboration with Rhodes Music, aligning the product with its historical roots under the Rhodes name. It remains a faithful recreation of the original 1980s Rhodes Chroma, enhanced with modern features.

  In 1979, a group of engineers at ARP Instruments began developing one of the most ambitious synthesizer designs of that time: the Chroma, a 16-voice polyphonic, microprocessor-controlled instrument with aftertouch, advanced signal routing, and modulation. In 1981, the R&D team and the design moved to CBS, where Rhodes pianos were produced, and the Chroma was released under the Rhodes brand. Produced between 1982 and 1984, only around 3,000 were manufactured, along with as few as 150 keyboardless Expanders.

  Rhodes Chroma reproduces the original with high accuracy and allows direct import of SysEx patch data from the original instrument as well as WAV-format cassette tape data. Cherry Audio recreated each component of the original hardware, from its 16 oscillators, filters, VCAs, and LFOs to its 32 envelope generators. These elements can be selected from 16 distinct preconfigured signal paths, ranging from straightforward VCO-VCF-VCA setups to configurations involving oscillator sync, filter FM, ring modulation, and variable or serially connected filters.

  Central to the design is an improved user interface that simplifies programming. Pop-up elements and real-time displays integrated directly into parameter buttons make sound design more approachable, and all of the original Chroma's modulation capabilities have been replicated, with modulation paths configured through comprehensive pop-up menus.

  The original Chroma offered velocity sensitivity and aftertouch, keyboard assignments for six monophonic modes (including unison), four polyphonic modes (including poly unison), and six arpeggiator modes. The virtual version captures these and adds an emulation of the Expander, doubling the possibilities with layers and splits and 16 polyphonic voices across all modes. It ships with the original 250 factory presets plus an additional 450 custom presets, and includes seven onboard effects: distortion, phaser, flange/chorus, delay, and reverb, plus a global EQ and limiter.
specs: |-
  - Virtual analog emulation of the polyphonic synthesizer released by Rhodes in 1982, from its 16 polyphonic voices to its velocity and polyphonic aftertouch capabilities
  - 16 oscillators, filters, VCAs, and LFOs, and 32 envelope generators
  - 16 distinct preconfigured signal paths, ranging from straightforward VCO-VCF-VCA setups to configurations featuring oscillator sync, filter FM, ring modulation, and variable or serial filter paths
  - Menus and real-time displays simplify the programming process
  - Modulation paths are configured using comprehensive modulation pop-up menus
  - Includes the Rhodes Chroma Expander module, which adds an entire second Chroma synthesizer running in layer or split modes
  - SysEx import: owners of MIDI-retrofitted Chroma or Expander hardware can transfer banks and individual patches via SysEx dump, and SysEx files can be imported by drag-and-drop
  - Tape data import: imports 50-program cassette tape data backups made with the original Chroma (uncompressed .wav files, mono or stereo, any sample rate or bit depth)
  - Seven onboard effects, including distortion, phaser, flange/chorus, delay, and reverb, as well as a global EQ and limiter
  - 700 presets in over a dozen categories, including the original 250 Chroma factory presets and 450 additional custom presets
  - Standalone virtual instrument and plug-in versions
  - Complete MIDI control and DAW automation for all controls, with MIDI Learn and mapping
  - Focus zoom-in feature, as well as standard UI zoom and resize via drag
  - Documentation available directly online from the instrument or in downloadable PDF format
  - User-adjustable oversampling control
  - macOS requirements: macOS 10.13 or above, 64-bit required, Intel or Apple Silicon processor, 3.4 GHz quad-core or Apple Silicon CPU with 8 GB of RAM recommended
  - Windows requirements: Windows 7 or above, 64-bit required, 3.4 GHz quad-core computer with 8 GB of RAM recommended
  - Hard disk space: 74 MB
  - Internet connection required for product activation
