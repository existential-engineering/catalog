description: MasterTool is a sound processor designed to give your tracks that final polished touch, essentially functioning as an auto mastering robot
details: |-
  HoRNet MasterTool is a sound processor designed to apply that final touch to your tracks, you can think of it as an auto mastering robot.

  Thanks to our algorithms and some clever intelligence built in the plugin can adapt to almost every music genre, if you are searching for an easy way to fix your tracks and make them sound good MasterTool it's here to help you, and if you are a podcaster or work with voiceovers, we have also added some special algorithm tweaks to make you happy.

  The plugin takes care of fixing frequency spectrum issues in your mix thanks to our frequency unmasking algorithm, then analyzes the dynamic content and using our coherence meter algorithm as feedback it sets a clipper and two different limiters. The first clipper and limiter in the chain work together to effectively trim the peaks of your audio signal, boosting its overall loudness without sacrificing clarity. The second limiter then steps in to fine-tune and ensure that your track reaches the precise level you specify, providing a polished and professional finish.

  The plugin operates by thoroughly analyzing your track's audio characteristics. This analysis is essential for the algorithm to apply its processing accurately. When you first load the plugin, you'll be prompted to initiate this learning process by pressing the "Learn" button. During this phase, the plugin carefully examines the incoming audio to understand its dynamics and frequency content. Once the learning process is complete, pressing the "Learn" button again stops the analysis and allows the plugin to begin processing your track based on the gathered data.

  From this point onward, any changes you make to the plugin's parameters will trigger a re-evaluation of the entire algorithm. The plugin will adapt its processing in real time to align with your new settings, ensuring that your adjustments are consistently applied across the track for optimal results. The HoRNet MasterTool has no copy protection.
specs: |-
  - Automatic EQ analisys and correction
  - Three dynamics stages, a clipper and two limiters
  - Smart logic sets the internal parameters analyzing audio characteristics
  - Special voice mode for podcasts
  - Realtime display of correction and gain reduction applied
  - LUFS target level and amount of EQ correction can be set by the user
  - Resizable interface, hardware accelerated
  - Mac OS X (10.11 and later with Metal support) and Windows (7 and later, OpenGL 2 required) support
  - Apple Silicon native support (except for AAX)
  - 64-bit plugin for Mac and Windows
  - Audio Units VST2.4, VST3 and AAX format
