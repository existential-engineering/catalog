description: Your 'drum sound' provides the heartbeat of a song; it's the
  foundation that every classic mix is built on.
details: |-
  Drum Flow is an all-in-one processing suite designed specifically to improve
  your drum tones. It contains 6 routable processing elements and a master
  section with input, output, and routing controls.

  The drum character is an eq that detects the transients of drum hits and
  allows you to eq their attack and tail ranges separately. The expander/gate is
  a dynamics processor that attenuates signals below a set threshold. This is
  useful for removing unwanted parts of a signal that were picked up due to
  microphone bleed.

  The signal generator offers a convenient way to enhance drum hits with various
  types of synthesized signals, such as white noise on a snare or a
  low-frequency sine wave on a kick. The generated signal is fed through a gate
  which is keyed off of the main input allowing the signal to be triggered on
  drum hits. The generated signal can then be blended with the main input signal
  in parallel using the wet and dry faders.

  The 32c channel eq is modeled after the analog eq found on the harrison 32c
  channel strip. It has four bands with frequency and gain controls, optional
  high & low shelf filters, and an output trim control. The filter module
  contains a low-pass filter (lpf) and a high-pass filter (hpf) with variable
  slopes.

  The processing elements are separated into modules which can each be
  individually bypassed, soloed, and reset using the following controls on each
  module's top bar. The reset button resets all of a module's parameters to
  their default states. The solo button bypasses all processing outside of the
  module being soloed except for master controls (polarity, input and output
  trim).
