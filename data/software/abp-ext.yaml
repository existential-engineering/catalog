details: >-
  Abp extension (pick) aims to bring the fender precision bass sound to your
  studio. The same bass with abp ii, it is played by a pick, sounds bright with
  more versatility for rock, metal and brit-pop.


  Abp-ext by ample sound is a virtual instrument audio plugin and a software
  application for macos and windows. It functions as a VST plugin, an audio
  units plugin, an AAX plugin and a standalone application.


  System requirements: 1.55 gb of free hard disk space. Windows vista or newer,
  pentium 4 or athlon processor with 2 gb ram. Mac os x 10.7 or higher,
  intel-based mac with 2 gb ram. AU, VST, AAX or rtas host application and
  professional sound card recommended.


  Abp extension (pick) require owning and installation of abp ii v2.51 before
  installation.


  Sampling: size: 1.55 gb, 24-bit 44.1khz. Sustain, palm mute, natural harmonic,
  hammer on & pull off, legato slide, slide in & out, accentuated, staccato,
  dead note 11 articulations. Alternate tuner & lowest to b.
