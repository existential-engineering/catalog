description: A standalone desktop application providing comprehensive loudness visualization and preview capabilities for online streaming platforms, allowing users to assess how music will play back across different streaming services before uploading.
details: |-
  Loudness Penalty Studio is a standalone desktop application designed to help producers and mastering engineers understand how their music will be affected by the loudness normalization applied by streaming platforms such as YouTube, Spotify, TIDAL, Deezer, and Apple Music.

  The application features a unique Loudness View visualization that allows users to analyze entire albums or playlists at a glance, providing real-time loudness matching preview so engineers can hear exactly how their tracks will sound after normalization before uploading.

  Version 1.5 introduced significant new features including a short-term loudness profile graph, PDF loudness report export, multiple comparison modes, and LRA (Loudness Range) table support, alongside improved processing speed.

  Loudness Penalty Studio supports batch file analysis and includes Album vs. Track Mode comparison functionality, enabling mastering engineers to make informed decisions about overall album loudness targets and individual track levels.
specs: |-
  - macOS 10.11 or later (64-bit Intel or Apple Silicon)
  - Windows 7 or later (64-bit only)
  - Standalone application (not a plugin)
  - Supports YouTube, Spotify, TIDAL, Deezer, and Apple Music normalization simulation
  - Batch file analysis
  - PDF loudness report export
  - Short-term loudness profile graph
  - Album vs. Track Mode comparison
  - Custom reference playlist creation
  - Patent Pending (US Provisional Patent Application No. 63/567,059)
