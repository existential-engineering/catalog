description: Nine plugins for mixing, mastering and sound design — each built around one specific thing it does that stock plugins and the well-known references don't. Includes a mel-scale analyzer, dub delay, CRT-phosphor oscilloscope, four-band compressor, Alesis 3630 emulation, multiband saturator, parametric EQ, algorithmic reverb, and log-frequency FFT.
details: |-
  Distortion - Multiband distortion with adaptive peak clipping, 16x oversampling
  EQ10 - 10-band parametric equalizer
  FFT Spectral Analyzer - 4096-sample FFT engine
  NightShine 2 - Alesis 3630-inspired compressor
  Samurai Delay - Dub-style delay with feedback filtering
  Schroeder Reverb 2.0 - Digital reverb with 8x oversampling
  Scope Visualizer - GPU-accelerated oscilloscope
  Spectrum FFT Analyzer - High-resolution frequency analysis
  ThrillMe 3 - Four-band multiband compressor with 16x oversampling
