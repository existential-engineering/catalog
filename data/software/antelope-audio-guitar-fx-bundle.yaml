description: Shape your guitar tone with these seven world-class plugins - mix
  between proven classics and exciting new developments by Antelope Audio.
details: |-
  Breathe new life into your guitar tones with these effects that make for a killer combo. An authentic flanger and tremolo, a faithful EQ recreation that packs plenty of character, an AutoWah, delay, and Antelope's new in-house developed distortion - all the tools needed to add new colors to your guitar.

  Space Flanger (Flanger) - produces phases, sweeps, and otherworldly swooshes

  Vari-Speed Tremolo (Tremolo) - versatile vintage tremolo with five-position wave selector (sine, triangle, square, sawtooth, inverted sawtooth)

  HEAT - distortion and saturation plugin with five analog-inspired circuit modes (Native Plugin only)

  Marble White AutoWah - replicates a boutique autowah pedal from Finland based on a vintage rackmount wah circuit

  Memory Cat Brigade - tape and analog delay emulation

  Adaptive Vibrato - bespoke virtual vibrato effect inspired by tried-and-true circuits

  BBD-Chorus - modeled after the Roland CE-1 Chorus Ensemble (Roland JC-120 chorus amplifier circuit)

  Runs natively in your DAW on macOS or Windows, or in real-time on your Synergy Core interface
specs: |-
  - Seven guitar-focused effect plugins
  - Runs natively in DAW (macOS/Windows) or real-time on Synergy Core interface
  - HEAT distortion/saturation available only as a Native Plugin
  - Includes flanger, tremolo, distortion/saturation, autowah, tape/analog delay, vibrato, and chorus
  - Unlock all 75+ Antelope native plugins by joining Antelope Cosmos
