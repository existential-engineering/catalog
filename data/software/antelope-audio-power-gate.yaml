details: |-
  PowerGate is the very first Antelope Audio noise gate tool. Requested by our trusted users, it is available with all our Thunderbolt & USB or HD interfaces for free.

  PowerGate allows you to track audio from sources with unwanted background or ground noise. It will keep your sound free of any artifacts, such as bad resonances, bleeds from other sources, or excessive sustain.

  PowerGate features a standard set of controls, such as Threshold, Attack, Hold, Decay, Range, and Gain. They let you adapt the effect to any kind of sound.

  Runs in real-time on Antelope Synergy Core interfaces.
specs: |-
