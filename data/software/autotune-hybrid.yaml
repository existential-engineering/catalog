details: |-
  Auto-tune hybrid is the ultimate real-time tuning solution for Pro Tools and
  avid dsp hardware, including carbon interfaces and hdx systems. It delivers
  the professional quality of auto-tune pitch correction and vocal effects,
  optimized for lightning-fast, dsp-powered performance, and also works on
  native Pro Tools systems.

  Auto-tune hybrid is specially designed for avid's hybrid engine technology, so
  you can move seamlessly between dsp and native processing in pro tools when
  recording, editing, and mixing. Record with dsp power for near-zero latency
  monitoring, then switch over to native processing and take your sessions on
  the road.

  Auto-tune hybrid also includes classic mode, delivering the iconic "auto-tune
  5 sound" that's essential for modern hip hop production, plus real-time MIDI
  control, and advanced vibrato controls. Flex-tune offers more transparent and
  natural-sounding tuning, and humanize preserves subtle pitch variations on
  sustained notes.

  Basic and advanced views help you find the tools you need, when you need them.
  Stick with basic view for streamlined access to the most commonly used
  controls, or pop over to advanced view to unlock powerful MIDI, vibrato, and
  custom scale features.

  Compatibility with the auto-key plug-in (sold separately) means never having
  to worry about finding the key of your music before tuning. Auto-key detects
  the key and scale and sends that information to auto-tune hybrid with a single
  click, streamlining your workflow and saving valuable time in the studio.
