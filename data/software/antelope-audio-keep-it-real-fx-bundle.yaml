details: |-
  Keep it Real is Antelope Audio's Synergy Core Effects Bundle for hip-hop production. The collection is designed to help producers make their kicks and 808's truly stand out with the tools needed to put together the hottest hip-hop records.

  The bundle runs natively in your DAW on macOS or Windows, or in real-time on your Synergy Core interface. It is also available through the Antelope Cosmos subscription, which unlocks all 75+ Antelope native plugins.
