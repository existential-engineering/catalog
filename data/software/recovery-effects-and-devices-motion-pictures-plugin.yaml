details: |-
  MOTION PICTURES

  ( VST / AU Plugin )

  Bring the signature Motion Pictures sound from our Eurorack module directly into your DAW. This lush delay and reverb plug-in combines large-hall stereo reverb with tempo-synced delay, delivering rich ambient textures that add depth and atmosphere to any production. A single knob controls the delay time and locks seamlessly to your DAW's tempo, ranging from tight rhythmic divisions to sprawling, evolving echoes. Delay and reverb levels can be adjusted independently, letting you sculpt subtle textures or expansive, layered soundscapes. Motion Pictures plug-in captures the vibe of the hardware, giving you instant access to its signature ambient tones, no rack required. System Requirements:

  macOS:
  macOS 10.13 (High Sierra) or later
  AU or VST3 compatible host (Logic Pro, Ableton Live, FL Studio, Cubase, etc.)
  64-bit processor

  Windows:
  Windows 10 or later
  VST3 compatible host (Ableton Live, FL Studio, Cubase, Reaper, etc.)
  64-bit processor

  Your plug-in license and download link will be emailed to you automatically after purchase.
