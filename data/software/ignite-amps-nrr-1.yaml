description: A digital emulation of a three-channel tube preamplifier for guitar, modeled after a custom hardware unit built for Fleshgod Apocalypse guitarist Cristiano Trionfera in 2009. The circuit draws inspiration from a famous boutique preamplifier made in 1988, modded to suit the guitarist's needs. Features Ignite Amps' 3rd generation triode modeling engine with three independent channels (clean, rhythm, and lead), mono and stereo processing, oversampling up to 8x, and 64-bit double precision floating point math.
details: |-
  Ignite Amps 3rd generation triode modeling engine
  Three independent channels: clean, rhythm, and lead with separated controls
  Mono and stereo processing support
  Oversampling up to 8x
  Global input/output level controls
  64-bit double precision floating point mathematical model
  Fully automatable controls
  Proprietary preset management with bank file import/export
