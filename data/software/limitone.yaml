description: Audio limiting is the art of managing and controlling sound energy.
details: |-
  Audio limiting is the art of managing and controlling sound energy. Often the goal is to increase loudness by changing level dynamics in the most transparent way possible. Historically, this was done by using an electric circuit that follows the envelope of an audio signal and steers a variable gain to reduce peaks and boost low levels. These methods were later emulated in the digital domain and many variations and flavors have been created since.

  LimitOne is different. The goal was not to eliminate all other clippers or limiters out there, as they all add their own color, but to develop a novel approach and do things in a different way, allowing you to get results that weren't previously possible.

  Inspired by two-stage limiter methods and multi-band compressor designs, and how clipping adds color and punch, Leapwing Audio imagined what an easy-to-use tool would look like without limiting themselves to existing methods. This led to the idea of a hybrid algorithm that combines the advantages of digital signal processing in the frequency domain and time domain.

  LimitOne consists of two main algorithms, codenamed Pufferfish and Hedgehog. Pufferfish is a frequency domain processor that aims to optimize the energy distribution across the whole frequency spectrum for a given Drive and Ceiling level. Hedgehog is a time domain processor whose main purpose is to shape transients, using an adaptive control system that shares the same Drive and Ceiling level parameters.
specs: |-
  - Unique hybrid algorithm design with adaptive dynamics control in both frequency and time domain
  - Pufferfish: frequency domain processor optimizing energy distribution across the whole frequency spectrum
  - Hedgehog: time domain processor for shaping transients with adaptive control system
  - Variable control over the balance between softer limiting and hard clipping
  - Mac OSX 10.13+ with Apple Silicon M1-Native support
  - Windows 8, 10, 11 (64-bit only)
  - True peak limiting with no overshoot
