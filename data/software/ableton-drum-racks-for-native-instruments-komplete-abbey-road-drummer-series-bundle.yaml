  Ableton drum racks bundle to all the native instruments komplete abbey road drummer series (also part of native instruments komplete ultimate).

  Ableton drum racks for abbey road 50s drummer: 4 presets covering pad level individual mappings to the autumn and spring kit presets of the factory library.

  Ableton drum racks for abbey road 60s drummer: 4 presets covering pad level individual mappings to the early and late kit presets of the factory library.

  Ableton drum racks for abbey road 70s drummer: 4 presets covering pad level individual mappings to the open and tight kit presets of the factory library.

  Ableton drum racks for abbey road 80s drummer: 4 presets covering pad level individual mappings to the black and chrome kit presets of the factory library.
