details: |-
  Azimuth Pad by Rumpelrausch Taips is a virtual effect audio plugin for
  Windows.

  Surround compatible sound positioning. Azimuth pad lets you use a joystick to
  interactively position a monaural sound in a 3.1 surround environment ("dolby
  prologic").
specs: |-
  - Surround compatible sound positioning
  - Joystick control
  - 3.1 surround environment
  - Dolby prologic
