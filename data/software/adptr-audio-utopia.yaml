description: Harness the power of ADPTR Audio Utopia's unique spectral reverb engine and venture beyond real world spaces to explore the outer realms of reverb.
details: |-
  The heart of Utopia is an original spectral reverb algorithm designed by Geraint Luff of Signalsmith Audio. This unique approach to designing a reverb engine unlocks a world of sound simply not available with conventional reverb algorithms based on delay lines or convolution.

  Utopia excels at lush, spatial ambience with exceptional harmonic purity. With the power of spectral re-synthesis, controls like detune, shimmer, shape and spectral colour take on a new life with incredible characteristics.

  With a full complement of mix ready tools at your disposal, Utopia will always sit perfectly in the mix. The magic 'Auto-Clear' control carves out space with its intelligent algorithm that prioritises newer signals and gently removes unwanted harmonic clashes between chord progressions.

  Whether you are an electronic music producer, composer or sound designer, Utopia is the gateway to cutting edge reverb textures and spatial effects. Forward thinking features such as Buffer Reset, Node Based EQs, and inspiring presets, will delight with a universe of new sonic possibilities.

  Both the Decay EQ and Post EQ feature a 5 band Node editor for the ultimate sound shaping experience. Each Node offers fine tuning of the curve shapes ranging from gentle slopes to sharp peaks. You can even set the frequency by MIDI note value. Once you have the EQ locked in, you can dial in the scale to increase or reduce the overall amount of EQ with one easy control.
specs: |-
  - Spectral Colour: adjusts Focus (onset and noise reduction) and Atmosphere (detail or smoothness) for sculpting harmonic richness
  - Spectral Blocks: change the harmonic density and bloom rate of the reverb tail
  - Shape: controls onset and decay curves, offering gentle swells, sharp fades, or delayed spectrum blooms
  - Auto Clear: removes clashing harmonics between the newer input signal and the tail when chords change
  - Decay and Post EQ with 5 band Node editor, full control over curve shapes and scaling
  - Detune for deep, lush, wide textures
  - Shimmer: rich octave harmonics
  - Early Reflections with Detune, Density, Stereo Width and HP/LP filters
  - Spectrum based Stereo Width control with several modes, down to mono fold-down
  - Volume Shaper: Duck, Pump or Gate, triggered by BPM sync, MIDI, audio or side-chain input
  - Buffer Reset: resets the audio buffer on a trigger (BPM sync, Manual or MIDI note)
  - Freeze for infinite sustain
  - BPM Sync for Decay, Pre-Delay and Volume shaping triggers
  - Over 250 presets with mix notes from the author
  - A B C D preset variations, copyable between instances and DAWs
  - Tooltips
  - Supported operating systems: macOS 10.11 El Capitan through macOS 15 Sequoia (native M1 and M2), Windows with x64-compatible CPU
  - Mac: Intel or Apple Silicon
  - Display resolution: 1440 x 900px or 1280 x 960px or higher
  - Memory: 2 GB RAM
