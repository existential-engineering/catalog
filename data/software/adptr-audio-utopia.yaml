description: Harness the power of ADPTR Audio Utopia's unique spectral reverb
  engine and venture beyond real world spaces to explore the outer realms of
  reverb.
details: |-
  Whether you are an electronic music producer, composer or sound designer,
  Utopia is the gateway to cutting edge reverb textures and spatial effects.
  Forward thinking features such as Buffer Reset, Node Based EQs, and inspiring
  presets, will delight with a universe of new sonic possibilities.

  Each preset has been crafted to offer a range of onset control from short,
  sharp decays or sustained envelopes to long, evolving blooms. Shape doesn't
  just control the volume contour — it can also affect the frequency response,
  creating reverbs that bloom with an arc of frequencies arriving in succession
  as they spread across time and space.

  Auto Clear intelligently identifies clashing frequencies between the newer
  input signal and the tail, and prioritises the newer signal by reducing the
  volume of the older competing frequencies to clear space and prevent harmonic
  clashes. Both the Decay EQ and Post EQ feature a 5 band Node editor for
  ultimate sound shaping.

  Utopia sets a new standard for lush, ambient soundscapes with its spectral
  based Detune and Shimmer. Buffer Reset produces clean, repeatable effects with
  BPM sync, Manual and MIDI note input triggering. Volume shaping includes
  classic audio ducking and modern BPM synchronised curves with pump, gate or
  duck via audio input, MIDI note, Side-Chain input or DAW timeline sync.
specs: |-
  - Unique spectral reverb engine
  - Radical Shape control affecting volume contour and frequency response
  - Auto Clear intelligent frequency clash prevention
  - 5-band Node EQ editors for Decay and Post processing
  - Spectral Detune and Shimmer effects
  - Buffer Reset with BPM sync, Manual and MIDI note triggering
  - Volume Shaping: Pump, Gate, Duck via audio, MIDI, Side-Chain or DAW sync
  - Loadable and saveable Volume Shaping presets
  - Mix-ready toolbox with Auto-Clear
  - Designed for electronic music, composition and sound design
