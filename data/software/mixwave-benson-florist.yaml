description: A modulation plugin built on dual delay lines with independent
  detector circuits, moving between slapback, chorus, flanging and tri-chorus.
  Includes a Ghosts latching feedback mode that drives both delay lines toward
  oscillation for unstable, evolving textures.
details: |-
  What started as a conversation between Benson and Non-Human Audio became something far beyond its origins: Florist, a completely new approach to modulation. Every stage has been captured using proprietary component-level modeling, recreating the interaction between its delay lines, detector circuits and signal path. Dual delay lines, each driven by its own detector circuit, shift naturally between slapback, chorus, flanging and tri-chorus without ever feeling static. Independent DRY, WET A and WET B controls with per-path intensity place the effect precisely in the mix, and the Ghosts latching feedback mode drives both delay lines to the edge of oscillation for unstable, evolving textures. Available as a 64-bit VST3, AU or AAX plugin for macOS and Windows. An iLok account and iLok License Manager are required (both free). Includes a 14-day free trial through iLok. We present, MixWave: Benson Florist .
