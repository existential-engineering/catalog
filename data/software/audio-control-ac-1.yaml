details: |-
  When finalizing mixes, users can check the stereo field to ensure there is not
  too much stereo or mono signal, verify that stereo signal contains adequate
  bass frequency, and confirm that mono signal does not have distortion. Users
  can also hear left and right channels separated or phase inverted, and control
  dynamics and transients to ensure adequate dynamic range and proper transient
  handling.

  With audio control console ac1, all mentioned operations can be performed
  within one click. Users can check frequency spectrum on linear fft display,
  set frequency ranges which should be monitored, and set dynamic range spectrum
  of monitored transients. Users can create useful combinations by clicking
  buttons, for example: listen to transients only in treble spectrum, filter
  bass spectrum and analyze if bass is in stereo (side) part, or compare how
  many transients are included in mono and side/stereo part of record.

  Top features include bass, mid, treble filter for analyzing individual
  frequency bands with possibility to set frequency ranges and buttons for fast
  results. Mid (mono) button to hear mono part of mix in both channels, and side
  (stereo) button to hear stereo part of mix in both channels.

  Left and right buttons allow hearing individual left or right channel, while
  left and right phase invert/rotation buttons allow hearing phase rotated left
  or right channel. Transient button allows hearing dynamic range of mix and
  hearing transients/peaks of signal with knob allowing to set controlled
  dynamic range, as well as speed response switch detecting slow or fast
  peaks/transients. All buttons can be used in various combinations to control
  different parts of recording.
