description: Collection of essential synth sounds. From basses to polys, from leads to arpeggios. CORE is the swiss knife for every occasion.
details: |-
  If you could take only one Usynth title to a desert island, this should be the one. A wide collection of essential synth sounds, from basses to polys, from leads to arpeggios. This is the comprehensive swiss knife for every occasion.

  Peter Gorges, chief sound designer behind CORE, is a revered industry veteran. He has worked on several milestones of synthesizer history, bringing more than four decades of experience. This is his collection of must-have synth aesthetics.

  Usynth features a built-in delay unit that is simple to set up, yet super-flexible. Instead of a dozen parameters you have to set, simple and complex delay configurations are already prepared: all you have to do is select a delay preset and adjust Mix and Feedback. Each synthesizer preset has been set up with what the sound designer deemed the most useful modulation, which you can dial in using a modulation controller or wheel on your keyboard.

  Global keyboard settings include Chord, which lets you play "1-finger-chords" where one key creates an entire chord.
specs: |-
  - Fully customizable sequencer
  - 2 individual layers per note
  - Custom Finisher featuring 90 presets
  - Built-in delay unit with prepared presets, adjusted via Mix and Feedback
  - Per-preset modulation assignment, dialled in from a mod wheel or controller
  - Global keyboard settings including 1-finger Chord mode
  - UJAM App integrated
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8GB of RAM
  - 0.45GB of free disk space
  - 1280x768px display, internet connection
  - Moving the .blob sample content file to an external drive is not supported
  - Plug-in formats: AAX, AU 2, VST 2 and VST 3, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Requires the latest version of the UJAM App, which installs the Usynth plug-in that hosts all titles
