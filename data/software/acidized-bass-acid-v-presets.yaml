details: >-
  Acidized bass contains 54 arturia acid v presets also available for analog lab
  v.


  The presets are classic acid style basses that fit for techno and other acid
  electronic styles.


  When we create sequenced presets using the sequencer of the particular synth
  to create melodic lines, the sequences come as a starting point to create your
  new melodic lines.


  All presets designed with acid v 1.1.1.4681 (x64) and run best with this or
  newer edition.


  Analog lab v edition: soundbank needs at least version analog lab v
  5.10.2.4741 (x64) or newer.
