details: |-
  While "saturation" can easily become harsh, excessive, or reduce the perceived
  size of the original signal, this plugin avoids those unwanted side effects.
  It is designed to provide just the right amount of energy and presence without
  introducing haze or musical clutter.

  The silk mode delivers a smooth and cohesive character, refining the top end
  without introducing harshness. It brings clarity and a silky texture to vocals
  and other aggressive or bright tracks, adding presence and polish while
  maintaining natural balance. This mode enhances detail without pushing the
  sound into unwanted sharpness.

  The warm mode provides greater thickness, power, and harmonic breadth.
  Compared to silk, it produces a fuller and more expansive tone, making it
  well-suited for guitars, drums, and powerful vocal styles. It enhances body
  and intensity while preserving natural warmth, resulting in a sound that feels
  both strong and organic.
