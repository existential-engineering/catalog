description: The Martinic AX Chorus plugin includes faithful recreations of the
  unique chorus effect found on both the ax73 and ax60 vintage synthesizers.
details: |-
  Accurate emulation of analog bbd chorus with two different models: ax73 and
  ax60, adjustable chorus rate ranging from 0.01 to 20 hz, optional host tempo
  sync from 16 bars to 1/64 note, and adjustable chorus mix ranging from 0% to
  100%.

  Optional 3-band eq for shaping chorus signal, stereo input and processing,
  stereo width adjustment, and output volume control.

  The plugin includes 16 presets and is part of the ax bundle.

  Ax chorus by martinic is a virtual effect audio plugin for macos and windows,
  functioning as a VST plugin, audio units plugin, VST 3 plugin, AAX plugin and
  clap plugin.
specs: |-
