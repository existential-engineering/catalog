details: >-
  Air the keys collection is a collection of keys instruments including: the
  stage piano, stage piano ep, and organ.


  The stage ep instrument delivers the lush and rich sounds of the most
  desirable electric pianos at your fingertips. Stage ep includes five detailed
  models of the rhodes, rhodes hot, suitcase, wurli, and pianet, as well as the
  acoustic mechanics and an fm tine synth capturing the magic and warm
  smoothness of the originals as well as adding the full spectrum of modern and
  classic ep sounds.


  Stage piano offers elegant and expressive multi-layered piano sounds from
  world-renowned instruments. With its elegant interface, you can control
  everything from the timbre of each "piano model" to the dynamics, age,
  formant, and mechanics of the hammers, release, and sustain resonance. In
  addition, stage piano includes a powerful fx section allowing you to add
  smooth and rich reverb/delay to modern style lo-fi flavor fx to each preset.


  The organ plugin is smooth, polished, and vibrant. With ten drawbars and ten
  incredible tonewheel sets and built-in effects like rotary speakers, cab
  simulators, and drive settings, the organ plugin will have you making music in
  minutes.


  Air the keys collection plugins are available in VST, AU, and AAX format as
  well as offering full support for mpc standalone and desktop systems running
  version 2.11 (or later). Force users will need version 3.2 or later.
