description: >-
  Voltage Module Designer is a development tool for building custom modules for
  Voltage Modular, featuring drag-and-drop controls, an integrated Java code
  editor, and automatic cross-platform code generation.
details: |-
  Build modules lightning fast with drag and drop controls, visual style
  adjustments, and the ability to create custom knobs, sliders, switches,
  buttons, jacks, and more.

  All the monotonous details of coding are minimized, so building a
  module is quick and easy. All resources are automatically embedded into
  your project, so sharing module files with team members is effortless.

  Program your module using Java with the integrated code editor. The
  Module Designer generates much of the code automatically, so you only
  need to fill in a few functions to have a fully-working module. All
  module code is automatically cross-platform.

  Use the integrated debugger to test variables, objects and threads. Set
  breakpoints and easily step through your code. A bundled SDK includes
  audio processing classes for oscillators, filters, and envelope
  generators.
specs: |-
  - Drag and drop interface for control creation
  - Visual style adjustment capabilities
  - Integrated Java code editor
  - Automatic code generation for modules
  - Bundled SDK with audio processing classes
  - Cross-platform code compilation
  - Integrated debugger with breakpoint functionality
  - Automatic resource embedding
  - Personal license: free
  - Commercial license: $99
