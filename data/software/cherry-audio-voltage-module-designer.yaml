description: Development software for creating Voltage Modular modules. Drag and
  drop controls, and program your own modules in Java with an integrated code
  editor.
details: |-
  Build modules lightning fast. Drag and drop controls, adjust visual styles, and create your own custom knobs, sliders, switches, buttons, jacks, and more.

  All the monotonous details of coding are minimized, so building a module is quick and easy. All resources are automatically embedded into your project, so sharing module files with team members is effortless.

  Program your module using Java with the integrated code editor. The Module Designer generates much of the code automatically, so you only need to fill in a few functions to have a fully-working module. All module code is automatically cross-platform.

  The bundled SDK includes a large library of audio processing classes for oscillators, filters, envelope generators, and more. Use the included DSP for rapid prototyping, or write your own DSP to give your module a unique sound.

  Use the integrated debugger to test variables, objects and threads. Set breakpoints and easily step through your code.
specs: |-
  - Drag-and-drop creation of knobs, sliders, switches, buttons and jacks with adjustable visual styles
  - Integrated Java code editor with automatic code generation
  - Bundled SDK with audio processing classes for oscillators, filters and envelope generators
  - Module code is automatically cross-platform
  - Integrated debugger with breakpoints, variable, object and thread inspection
  - Resources automatically embedded into the project for sharing module files
  - Personal license: free
  - Commercial license: $99
  - Commercial license adds submission to the Voltage Module Store, team development and user beta-testing
  - macOS 11 or above, 64-bit required; macOS 11.6 or higher for native M1 support
  - Windows 7 or above, 64-bit required
  - Internet connection required for product activation
