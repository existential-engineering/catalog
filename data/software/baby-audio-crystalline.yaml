description: Crystalline is a modern algorithmic reverb plugin (VST, AU, AAX). It
  gives you unprecedented control over your reflections and offers an updated
  interpretation of the classic digital studio reverbs of the 20th century.
details: |-
  Crystalline is a state-of-the-art algorithmic reverb plugin by Baby Audio that delivers a lush and pristine sound. It brings unprecedented creative control to shape reflections, offering an updated interpretation of the classic digital studio reverbs of the 20th century.

  The plugin is organized into intuitive sections: Reflections (Size, Sparkle, Width), Depth (Resolution, Modulation, Shimmer), Clean-Up (Damping, Sides, Gate), Shape (Tone, Smoothing, Warp), and Output (Ducker, Reverse, Freeze, Dry/Wet). BPM-synced controls allow pre-delay and decay times to synchronize with DAW tempo.

  Crystalline uses an allpass loop algorithm that provides a distinctive sonic character. It can create huge spaces with ultra short tails or tiny spaces with epic decay times. The Resolution parameter allows users to scale the algorithm complexity from basic to pristine for CPU optimization.

  The plugin ships with over 300 curated presets from industry professionals.
specs: |-
  - 15 creative parameters for reverb character manipulation
  - Allpass loop algorithm
  - BPM-synced pre-delay and decay controls
  - Resolution scaling from basic to pristine for CPU optimization
  - Eco Mode for low-CPU operation
  - Over 300 curated presets from industry professionals
  - Native Apple Silicon M-Chip support
  - 64-bit only
