description: BiFilter2 offers dual multi-mode filters with 47 filter types, 8
  additional distortion types, FM, AM, waveshaping and lo-fi effects.
details: |-
  The filter types are extensive and include everything from bread and butter
  lowpass and highpass to more unusual filters such as am, fm, formant/vocal,
  phasing and more. The distortion features are unique and can add character to
  the sound without ruining it, with usability ranging from very subtle to
  extreme.

  Bifilter2 features a straightforward, simple and easy to use interface with
  smooth knob movements and a cool frequency response display that shows the
  shape of the filter and the effect of knob movements. The gui is well designed
  in the usual tone2 style with a classy look and solid construction.

  The plugin demonstrates excellent sound quality with no nasty qualities in the
  sound, even the distortions are pleasant. Cpu usage is extremely low, and the
  plugin performs smoothly without any sluggishness or cpu stress, making it
  suitable for use as a channel insert or multiple instances in series.

  Bifilter2 includes 100 presets that provide an excellent overview of the
  plugin's capabilities, with a neat preset browser for loading and saving banks
  and individual presets. The interface is so intuitive that users can explore
  the plugin almost as easily without presets.
specs: |-
  - 47 filter types
  - 8 distortion types
  - FM
  - AM
  - Waveshaping
  - Bit crushing
  - Resampling
  - Comb filtering
  - Vocal filtering
  - Equalizing
  - Reverberation
  - High precision real-time frequency response display
  - Smooth and click-free knob movements
  - High-end quality filter algorithms
  - Anti-aliasing
  - Oversampling
  - True stereo architecture
  - Works in all sample rates
  - 100 presets
  - MIDI support
  - Automation support
  - Windows compatible
