description: "KICK 2 is a drum synthesizer plugin with a three-layered sound
  design for blending clicks, subs, and tops to create kick drums. Features 3
  customizable click layers with drag-and-drop, graphical pitch envelope, EQ
  display, 3 distortion types, sub-harmonics control, compressor, limiter, and
  230+ factory presets."
