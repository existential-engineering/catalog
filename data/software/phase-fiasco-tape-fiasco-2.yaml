description: "Tape Fiasco 2 is a creative audio effect plugin that combines four
  time-based engines: Stretch (dual-grain, tape-coupled time-stretching),
  Varispeed (tape-machine speed manipulation), Stutter (rhythmic slicing and
  repetition), and BendIt (circuit-bent buffer mangling)."
details: |-
  The plugin that turns a single audio loop into a performance instrument. Most audio plugins process your sound. Tape Fiasco performs it. Four independent time engines run simultaneously: a dual-grain stretcher that slows, freezes and scrubs in real time; a tape machine with wow, flutter, stop and scratch; a rhythmic slicer that repeats at any subdivision; and BendIt, a circuit-bent buffer mangler with a seven-zone pitch macro from subtle wobble to full DJ scratch, quantized to the host grid. Chain them in any order.

  Behind the time engines sits another 30 creative effects, from spectral filtering and modal resonators to distortion, bit destruction, circuit bending and beyond, followed by a master stage with a three-band EQ, compressor, soft limiter and auto gain.

  Routing goes deep. Animate any parameter with multiple modulators: LFOs, random sources, envelope followers, and bezier graph editors. Sequencers stretch, bend and stutter. The Perform section puts four macros and an X/Y pad on the front panel, each routing to up to five destinations with three-point crossfade curves, all recordable as host automation. If it moves on screen, you can automate, sequence, or modulate it.

  STRETCH is not a pitch-shifter (no formant preservation, no granular). Speed and pitch are coupled the way they are on tape: slow the playback, the pitch drops. The character comes from the mechanical modulation, the rebased-read crossfade per tempo window, the saturation/compressor pair, and the per-sample handling of direction and rate. Stretch speed can be sequenced by the 64 step Stretch sequencer. VARISPEED is a tape-machine emulation with continuous capture into a 2-second ring buffer; a single read head plays back at variable rate with mechanical wow/flutter, momentary tape-stop, DJ-style scratch, tanh tape saturation, and a peak-envelope compressor, in three modes: Forward, Forward-Reverse, and Reverse.

  STUTTER is a rhythmic capture-and-repeat slicer. Audio is captured into a slice on the host beat grid, then looped at a rate set by RATE (free ms) or DIVISION (note division), with per-loop pitch shift, optional pitch ramp per repeat, decay across repeats, alternating pan, mid-cycle re-capture probability, and 6 rhythmic patterns. BENDIT is a circuit-bent buffer mangler where the PITCH parameter becomes WARP, with 7 zones that automate pitch and direction per stutter loop (WOBBLE / SLIP / LURCH / STALL / HAVOC / SCRATCH), and the DECAY parameter becomes FRACTURE, with 5 zones for sub-section jumps and silence drops.
specs: |-
  - Four time engines: Stretch, Varispeed, Stutter, BendIt
  - Stretch: dual-grain time-stretching with real-time scrubbing and freeze, tape-coupled speed and pitch, rebased-read crossfade per tempo window, saturation/compressor pair
  - Varispeed: 2-second ring buffer, variable-rate read head, wow and flutter from two recursive sine oscillators (0.5 Hz and 6 Hz), momentary tape-stop, scratch as a plus/minus 100% pitch-bend wheel with zero-crossing direction flips, tanh saturation, peak-envelope compressor
  - Varispeed modes: Forward, Forward-Reverse (bipolar speed knob), Reverse
  - Stutter: beat-grid capture-and-repeat slicer with RATE (free ms) or DIVISION (note division), per-loop pitch shift, pitch ramp per repeat, decay across repeats, alternating pan, mid-cycle re-capture probability
  - Stutter: 6 rhythmic patterns (even, dotted, triplet, swing, ramp up, ramp down) and 14 LINK presets
  - Beat-aligned OFF to ON enabling: the read head rewinds to the start of the current capture cycle
  - BendIt: WARP macro with 7 zones (WOBBLE / SLIP / LURCH / STALL / HAVOC / SCRATCH) and FRACTURE with 5 zones for sub-section jumps and silence drops
  - BendIt SCRATCH zone: host-quantized DJ scratch engine snapping to 8th-note boundaries with coin-flipped rate, shape and depth, plus bandpass filtering
  - Drag-to-reorder FX chain of up to 30 effects
  - Distortion: BITROT (bit crusher), CIRCUIT BEND (memory-chip glitch), DISTORT (12-model waveshaper), EXCITE (aural exciter), PLASMA (hysteretic arc discharge), WAVEFOLDER
  - Filter: EQ (parametric EQ and filter), FORMANT (5-band vowel filter), PRISM (SVF / Moog ladder / 303 diode ladder / broken transistor), SIEVE (Xenakis spectral STFT sieve), TOOTH (3-comb filter)
  - Pitch and granular: PITCH SHIFT (granular pitch shifter), SCATTER (granular FX)
  - Resonate: CRYSTAL (playable scale-tuned bandpass bank, up to 60 voices), FREQ SHIFT (Bode SSB shifter), MODAL (24-mode struck resonator)
  - Modulate: CHORUS (4-voice pitch doubler), CLANG (ring mod), ENSEMBLE (BBD-style, 4 historical modes), FLANGER (with through-zero), PHASER (up to 12 continuous stages), ORBIT (panner), TREMOR (tremolo)
  - Delay: SPIRAL (stereo tape delay with independent L/R rates, ping-pong, wobble, ducking, taps, reverse)
  - Reverb: DATTORRO (plate), DRIP (spring), AETHER (shimmer)
  - Dynamics: SQUASH (OTT-style multiband compressor), GATE (noise gate), MANGLE (multiband compressor)
  - Master chain: gain, mix and pan, 3-band EQ, compressor, soft limiter, auto gain
  - 4 modulator columns, each switchable between LFO / RANDOM / E.FOLLOWER
  - LFO: 19 shapes, 11 host-synced rates (1/64 bar to 16 bars), jitter, smoothing
  - RANDOM: same rate grid, BIN toggle for stepped vs interpolated output, position-keyed reproducible jitter
  - E.FOLLOWER: gain, rise, fall, plus bipolar TONE for lowpass or highpass tracking
  - 3 bezier graph editors, each looped over 1/4 bar to 16 bars
  - 6 target slots per modulator with MIN / MAX clamps; graph slots add START / END / SKEW
  - STUTTER SEQ and STRETCH SEQ: 64-step on/off sequencers with chain 1 to 4
  - Perform: 4 host-automatable macro knobs plus a host-automatable X/Y pad, each routable to up to 5 destinations with per-slot triangular response curves
  - 72 simultaneous modulation destinations total (42 Animate + 30 Perform)
  - Windows: VST3
  - macOS (Apple Silicon and Intel): VST3, AU
  - Linux: VST3
  - Free updates for owners via the original Lemon Squeezy order confirmation download link
