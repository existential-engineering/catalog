details: |-
  Afeq is an eq using and demonstrating the use of the audiofilter library. The plugin is made with juce.

  It features 12 bands, frequency analyser, and routing per band with 2nd order ("normal") peak/shelf/cut filters.

  Butterworth cut, shelf and bandshelf filters with orders between 6 and 48 db/oct, with glitch-free varying of band parameters and minimal frequency cramping towards nyquist (except for bandshelfs).

  Source code is available on github.
specs: |-
  - 12 bands

  - Frequency analyser

  - Routing per band

  - 2nd order peak/shelf/cut filters

  - Butterworth cut, shelf and bandshelf filters with orders between 6 and 48 db/oct

  - Glitch-free varying of band parameters

  - VST plugin

  - VST 3 plugin

  - Juce framework

  - Source code available on github
