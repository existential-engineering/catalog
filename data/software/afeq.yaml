details: |-
  It features 12 bands, frequency analyser, and routing per band with 2nd order
  ("normal") peak/shelf/cut filters.

  Butterworth cut, shelf and bandshelf filters with orders between 6 and 48
  db/oct, with glitch-free varying of band parameters and minimal frequency
  cramping towards nyquist (except for bandshelfs).

  Source code is available on github.
specs: |-
