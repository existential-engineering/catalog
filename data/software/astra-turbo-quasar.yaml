description: Astra Turbo Quasar is a dual phase distortion synthesizer that
  dynamically change the harmonic content of a carrier waveform by influence of
  another modulator waveform. It can be used to create spacey pads, synth keys,
  leads, atmospheric textures and ambient soundscapes.
details: |-
  Astra Turbo Quasar is a dual phase distortion synthesizer that dynamically
  change the harmonic content of a carrier waveform by influence of another
  modulator waveform. It can be used to create spacey pads, synth keys, leads,
  atmospheric textures and ambient soundscapes.

  Two phase distortion oscillators: offers 16 different single-cycle waveforms
  per channel. Modulation depth: controls the wave shape distortion for left and
  right channels. The values can be changed by turning the slider or by entering
  a value from the keypad and pressing enter key.

  Waveshaper section: these combo boxes presents a double selectable wave shapes
  with 5 basic waveforms: sawtooth, square, pulse, double sine and
  sawtooth-pulse plus 3 resonant waveforms: resonance 1 (sawtooth), resonance 2
  (triangle) and resonance 3 (trapezoid). Provides independent controls for the
  left and right channels.

  Filter section: a smooth state variable filter with cutoff frequency,
  resonance and filter mode to switches the filter between lowpass, highpass,
  bandpass, or band-rejection filter types, offering a simple and effective tone
  control to shape and color the sound source. Low-frequency oscillator: the lfo
  rate and depth modulates various aspects of the audio signal, you can apply
  effects such as vibrato or tremolo.

  Dual delay: stores the input signal and plays it back after a certain amount
  of time, creating from a subtle echo to a pronounced blending of previous
  sounds with new sounds. Improves the stereo image by adding a slight delay to
  one of the channels. Parameters includes: amount: controls how much delay is
  applied to the signal, which is to be delayed. Time: modulation to vary the
  delay time dynamically, to control independently the left and right channels.
  Feedback: regeneration of delay, to control independently the left and right
  channels.
specs: |-
  - Dual phase distortion oscillators
  - 16 single-cycle waveforms per channel
  - Modulation depth control
  - Waveshaper section with 5 basic waveforms (sawtooth, square, pulse, double
  sine, sawtooth-pulse)
  - 3 resonant waveforms (resonance 1 sawtooth, resonance 2 triangle, resonance
  3 trapezoid)
  - Independent left and right channel controls
  - ADSR envelope generator
  - State variable filter with cutoff frequency, resonance, and filter modes
  (lowpass, highpass, bandpass, band-rejection)
  - Low-frequency oscillator (LFO) with rate and depth modulation
  - Reverb/ambience effect
  - Loudness/amplitude control
  - Dual delay with amount, time, and feedback parameters
  - Mono mode
  - Glide/portamento control
  - MIDI continuous controller automation
  - Preset manager with browser
  - VST plugin support
  - VST3 plugin support
  - Audio Units plugin support
  - Windows 11, Windows 10, Windows 8.1, Windows 8, Windows 7 (64-bit)
  compatible
  - macOS sonoma 14, macOS ventura 13, macOS monterey 12, big sur 11, catalina
  10.15, mojave 10.14, high sierra 10.13, sierra 10.12 compatible
  - Intel CPU processor support
  - Apple m1/m2/m3 silicon support under rosetta 2 mode
  - DAW host with VST2 support (64-bit) and/or VST3 support (64-bit) required
  - DAW host with Audio Unit (AU) support compatible with Logic Pro, GarageBand,
  Ableton live, reaper, studio one professional, ardour, mainstage, digital
  performer
  - MIDI keyboard controller support
  - Asio compatible sound card recommended
