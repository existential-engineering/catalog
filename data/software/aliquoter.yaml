details: |-
  This is an aliquote simple synth built from 6-aliquote tuned oscillators. It is an additive/subtractive synth, but oscillators are tuned to aliquote intervals.

  If aliquote interval is integer, the oscillator is tuned to standard harmonics.

  Aliquote intervals are typical to natural sound and first instruments (woodwinds, fujara, koncovka, natural drums, ...).
specs: |-
  - 6-aliquote tuned oscillators
  - Additive/subtractive synth
  - Aliquote interval tuning
  - VST plugin
  - Standalone application
  - Windows compatible
