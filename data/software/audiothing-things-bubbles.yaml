description: An unusual filter bank effect plugin aimed at experimental sound
  design, with up to 10 filters and delays. Available for macOS, Windows, and
  Linux.
details: |-
  Things - Bubbles is an unusual filter bank effect plugin aimed at experimental sound design. You can use up to 10 band pass filters, represented by bubbles in the UI, with controllable resonance. Each band can have a dedicated delay with feedback.

  You can spread the cutoff, resonance, delay time, and delay feedback across each band to get very creative effects, from odd sounding echoes/reverbs to impossible sequences.

  Things - Bubbles is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP). It is also available on the App Store for iOS and iPadOS (AUv3 and Standalone), for iPhone and iPad.

  A demo version is available with some limitations: silence for 3 seconds every 45 seconds, and saving disabled.
specs: |-
  - 10-band Filterbank
  - Delay for each band
  - Brightness and Contrast Controls
  - Resizable Window
  - Preset system with randomizer
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP 64-bit)
  - macOS 10.13 - macOS 15, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP 64-bit)
  - 1 license up to 3 computers, no iLok, no internet connection required to activate
