details: |-
  BlueARP is a programmable pattern arpeggiator / step sequencer, it comes as a
  plugin for both Windows and Mac OS X. It's a pure MIDI plugin, so it has to be
  routed to either software or hardware synth in any VST-enabled DAW, such as fl
  studio, Ableton live, Cubase, reaper, etc.), there is also MIDI FX version to
  use in Logic Pro x / mainstage on mac.

  Basically you need to program some pattern in bluearp (it's quite fast with
  its matrix editor), then you play some chords and bluearp will generate
  melodic phrases from this chords, according to the pattern you programmed.

  Bluearp was designed for electronic music genres (like trance, house, etc.),
  but it also may have some unexpected applications like triggering drums (it
  has swing feature).

  The intuitive matrix editor allows for quick pattern programming with support
  for up to 64 steps per pattern and up to 128 programs per bank, enabling
  flexible keyboard-split performances with input range settings and real-time
  input quantization.

  Features include chord recognition with root note functionality, configurable
  color schemes with skinning support, and separate octave and semitone
  transpose settings per step, making it suitable for various musical
  applications from electronic genres to orchestral backing accompaniments.
specs: |-
  - Pattern arpeggiator
  - Step sequencer
  - MIDI plugin
  - Matrix editor
  - Up to 64 steps per pattern
  - Up to 128 programs per bank
  - Up to 5 input keys
  - Real-time input quantization
  - Input quantize setting
  - Pattern restart on beat / key
  - Input range setting for keyboard-split performances
  - Separate settings for octave and semitone per step transpose
  - Chord recognition
  - Root note functionality
  - Configurable color schemes
  - Swing feature
  - MIDI FX version for Logic Pro x / mainstage on mac
  - Windows VST 32-bit - Windows xp or higher
  - Windows VST 64-bit - Windows 7 or higher
  - Universal 2 binary
  - 64-bit compilation
  - Drum mode
  - Guitar mode
  - Latch feature
