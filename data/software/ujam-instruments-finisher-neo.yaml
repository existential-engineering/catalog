description: Finisher NEO stands for forward-thinking and bold exploration of new frontiers, a sheer endless source of inspiration for audio effects.
details: |-
  Finisher is a concept of audio plug-in designed to deliver the power and flexibility of a full rack of audio processors and effects with the instant gratification that UJAM products are known for. With version 1.1.0 of Finisher NEO come 50 new presets and two new variation knobs.

  Finisher NEO ships with 50 carefully sound-designed effect configurations built from 27 different algorithms, from Grain Pitch to Multiband Distortion, from simple Stereo Delays to Convolution. Five macro knobs give full control without the hassle.

  The Effect knob can be tweaked or automated for musically stunning sonic shifts, and Vari 1 to 4 make every effect individual. The Variation knob adjusts musically useful changes to the current Mode, switching delay times, setting EQ characteristics, changing distortion curves and much more, often at the same time.

  Most Finisher NEO effects come with a matching ambience, and a dedicated knob changes its mix, length and character to place a track where it belongs in the mix.
specs: |-
  - 50 Modes, complex multi-effect chains made by pro sound designers
  - 80 presets plus 50 new v1.1.0 presets
  - 27 algorithms from granular pitch to multi-band distortion, stereo delays and convolution
  - Five macro knobs: Effect plus Vari 1 to 4
  - Dedicated ambience control for mix, length and character
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Windows: Windows 10 to Windows 11
  - Mac: macOS Catalina (10.15) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 4 GB of RAM
  - 0.09 GB of disk space
  - 1280x768px display, internet connection
  - Delivery: automated installation via UJAM App, or downloadable installer file
  - Authorization via the UJAM App, or email and password within the plug-in
