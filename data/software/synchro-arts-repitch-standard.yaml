description: Achieve perfect pitch with RePitch Standard by Synchro Arts. Offering advanced pitch correction, formant shifting, and detailed editing tools for professional-grade vocal tuning.
details: |-
  RePitch Standard is an advanced vocal pitch-correction plugin with natural-sounding vocal tuning and precision editing tools for professional audio engineers. Features include SynchroLink, Shaper Tool, SmartAttack, Multi-track Editing, Smooth Join, Draw Tool, Warp Points Tool, and Formant Shifting. Supports ARA2 in compatible DAWs. 2 activations per license.
specs: |-
  macOS 12 or higher, Intel or Apple Silicon (M Series). Windows 10 or higher, 64-bit host. Mac formats: AU, VST3, AAX (64-bit). Windows formats: VST3, AAX (64-bit). Note: Apple Silicon Logic Pro does not support ARA plug-ins.
