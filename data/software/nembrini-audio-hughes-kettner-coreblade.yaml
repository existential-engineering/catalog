details: |-
  The Hughes & Kettner Coreblade plugin by Nembrini Audio uses hybrid modeling technology to deliver aggressive, modern tones with the precision and depth of a high-gain tube amplifier.

  The amplifier section offers four versatile channels with modern high-gain tone shaping, ideal for metal and hard rock, and the plugin includes six carefully selected cabinet emulations plus an impulse loader for your favorite IRs.

  Pre-amplifier stomp effects cover a Noise Gate, Filters, Screamer and Doubler, all draggable for flexible routing. The Screamer adds classic overdrive character for boosting solos or tightening high-gain tones, while the Doubler creates a wide stereo image from a mono signal using dynamic panning, pitch detuning and time offsets.

  Post-amplifier effects include a Graphic Parametric EQ offering detailed tonal sculpting through multiple bands, filter-type selection and precise frequency adjustments, plus a Studio Compressor that controls dynamics for a polished, consistent sound.

  The plugin includes a standalone version, allowing you to use it without a DAW.
specs: |-
  - Amplifier Section: four versatile channels with modern high-gain tone shaping, ideal for metal and hard rock
  - Cabinets & Impulse Loader: six carefully selected cabinet emulations and an impulse loader for third-party IRs
  - Pre-Amplifier Stomp Effects: Noise Gate, Filters, Screamer and Doubler, all draggable for flexible routing
  - Post-Amplifier Effects: Graphic Parametric EQ and Studio Compressor, draggable for flexible routing
  - Microphone Emulations: four premium microphones, each with selectable positions
  - Mixer: volume and pan controls to blend cabinet and microphone sounds
  - IR Loader: up to three simultaneous IRs with a visual graph representation of the loaded waveforms
  - Standalone version included, usable without a DAW
  - Plugin Formats: a VST2, VST3, AAX or AudioUnits compatible host
  - System: an Intel compatible or Apple Silicon CPU, 1GB RAM, Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
