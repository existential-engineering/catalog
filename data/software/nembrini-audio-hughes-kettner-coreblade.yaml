details: |-
  The Hughes & Kettner Coreblade plugin by Nembrini Audio uses hybrid modeling technology to deliver aggressive, modern tones with the precision and depth of a high-gain tube amplifier. The injector works great and sounds great (ideal for home use). However, the download and installation process is very convoluted and confusing. I first downloaded the trial version and thought that once it expired, I'd simply enter my serial number and be good to go. However, getting it to work required quite a bit of effort. Sounds very good! I was able to get a great tone with minimal tweaking. Has become one of my go-to plugins for writing and recording! Would recommend for those seeking a solid high gain tone!
