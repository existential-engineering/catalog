description: A hybrid modeling plugin delivering aggressive, modern tones with
  the precision and depth of a high-gain tube amplifier. Combines tube amp
  characteristics with digital precision, optimized for metal and hard rock
  applications.
details: |-
  The Hughes & Kettner Coreblade plugin is an authentic emulation of the iconic Hughes & Kettner Coreblade guitar amplifier, a high-gain tube amplifier known for its four versatile channels and aggressive modern tone shaping. The plugin faithfully recreates the amplifier's character for metal and hard rock players who demand precision and depth.

  The pre-amplifier effects section includes a Noise Gate, Filters, Screamer overdrive pedal, and a Doubler that creates stereo width through dynamic panning and pitch detuning. These tools allow players to shape their tone before it hits the amplifier stage.

  The cabinet system offers six cabinet emulations combined with four microphone emulations at selectable positions, plus a mixer with volume and pan controls for blending. An IR Loader supports up to three simultaneous impulse responses with waveform visualization for custom cabinet tones.

  Post-amplifier processing includes a Graphic Parametric EQ and a Studio Compressor, providing professional-grade tone shaping and dynamic control after the amplifier stage. A Standalone version is included, allowing use without a DAW.

  System requirements: Mac OS 10.13 or higher, Windows 7 or higher (64-bit), Intel-compatible or Apple Silicon CPU, minimum 1GB RAM, and a 64-bit compatible DAW host.
