details: |-
  Three unique amplifiers meticulously designed from the ground up with tosin to
  cover the entire sonic range his versatile and unique music requires: clean:
  lush, warm and huge clean tube amplifier model. The perfect canvas for defined
  lower gain, or full-blown aggression when boosted by the pathos and logos
  pedals. Rhythm: a unique and extremely versatile amplifier, capable of crunch
  or super high gain sounds. This rhythm amplifier provides attack and
  unprecedented size. Lead: tailor made for the perfect solo tone, featuring
  rich harmonic content and virtually eternal sustain.

  Logos compressor: tosin's secret weapon for adding punch and thump to clean
  and low gain sounds. Pathos distortion: algorithmically perfect model of
  abasi's versatile and powerful distortion pedal.

  Ideal for detailed spectrum adjustment, the onboard 9-band graphic equalizer
  allows for total control over frequency response. Beautiful reverb and delay
  algorithms for immersive atmospheric effects and deep lead tones.

  72 impulse responses captured by adam "nolly" getgood providing
  ultra-realistic depth and detail, with seamless multi-microphone positioning
  that perfectly matches the amplifiers' character.

  Archetype: abasi functions as a VST plugin, an audio units plugin, a VST 3
  plugin, an AAX plugin and a standalone application for macos and windows.
