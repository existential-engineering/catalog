details: |-
  Our core tier offers a comprehensive collection of articulations, 2 technologically advanced and detailed legato techniques, a high level of sampling depth and one signal option curated by GRAMMY -Award-winner Simon Rhodes.

  Working with the Abbey Road team in a globally renowned studio and with the best string players in London gives us the unrivalled ability to deliver the highest quality possible. Designed to help you work efficiently without sacrificing performance and nuance, we've researched and developed the functionality and playability of our library.

  Put simply this library is future-proof.
specs: |-
  - 16 1st Violins
  - 11,000 raw samples
  - 1 Simon Rhodes mic signal (Mix 1)
  - 2 legato techniques: Performance Legato, Lyrical Legato
  - Long techniques: Long, Flautando, Tremolo, Harmonics, Trills (major and minor 2nds and 3rds), Measured Tremolo at 150 and 180 BPM
  - Short techniques: Spiccatissimo, Spiccato, Staccato, Marcato, Pizzicato, Col Legno
  - 3.9 GB file size
  - macOS 11 to OS 26, Intel and Apple Silicon supported
  - Windows 10 or 11 (64-bit)
  - Minimum 8GB RAM, 16GB recommended
  - Spitfire Audio App required for installation
