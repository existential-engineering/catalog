details: |-
  A versatile, up-close-and-personal piano, designed to suit a range of styles — whether for solo composition, accompaniment, or as part of a larger ensemble. A vintage Steinway Model A grand, expertly recorded in the intimate acoustics of Castlesound Studios, Scotland.

  Three bespoke signals capturing the rich timbre, delicate nuance and wide dynamic range of the instrument in pristine detail: Condenser, Ribbon, and Binaural (providing a true-to-life image of the piano in the room). 8 presets — from tight and bright, to profoundly deep, dark and cinematic. 4 controls — Reverb, Tightness, Hammers and Pedal.

  Originals Intimate Grand Piano requires the free Splice INSTRUMENT plugin to run.
specs: |-
  - File size: ~4 GB
  - Vintage Steinway Model A grand recorded at Castlesound Studios, Scotland
  - 8 presets
  - 3 mic signals: Condenser (Neumann M149), Ribbon (Coles 4038), Binaural (Neumann KU100)
  - 4 controls: Reverb, Tightness, Hammers, Pedal
  - macOS 12 or later, Intel and Apple Silicon supported
  - Windows 10 or 11, 64-bit
