description: Speldosa is the result of a unique collaboration between Klevgrand
  and the Swedish artist Wintergatan/Martin Molin. Wintergatan has primarily
  worked in the physical world (the Marble Machine is probably the most
  astonishing example), while Klevgrand has performed its craft within the
  digital sphere.
details: |-
  Speldosa (Swedish for "Music Box") is the essence of the shared beliefs of Klevgrand and Wintergatan, and their fascination with minimalism. A simple melody played on a music box can contain an equal amount of emotional power as any symphonic work. There is something about the music box sound that never ceases to fascinate.

  The instrument itself has been meticulously recorded by Wintergatan and transformed into a playable digital instrument plugin. It features four different models (Modern, Vintage, Antique, and Eternal = Reversed), two different Room models, and an algorithmic reverb.

  Wintergatan about Speldosa: "I created the sound by sampling a music box using an acoustic guitar as resonance box. I chose the best samples and it was instant magic. The Music Box went on to become the sonic signature for my two bands, Detektivbyran and Wintergatan, both recognised for their unique sound. The Speldosa has been the secret sauce in my music career and i hope other musicians finds it as useful as i have."

  "There is a special quality to this exact music box sound that lifts it above the novelty feeling of a toy and turns it into a real music instrument. It just sounds so good, that's really it. And it is a sound that makes you write music instantly, the music comes from the sound itself."

  The four models cover a fresh music box (Modern), one that has lived (Vintage or Antique) and one running backwards (Eternal). Two room simulations place the music box in a spatial context, an algorithmic reverb goes further, a Damper slider controls note damping for tonal variation, and a falling-stars visualisation shows the played notes.
specs: |-
  - Four different instrument models: Modern, Vintage, Antique and Eternal (reversed)
  - Two different room simulations
  - Algorithmic reverb
  - Damper slider for note damping control (added in v1.0.3)
  - Falling stars visualisation of played notes
  - Simple UI
  - Carefully recorded samples by Wintergatan
  - macOS 10.10 or later, optimized for the M1 processor
  - Windows 7 (SP1) or later
  - Requires an AU, VST3 or AAX compatible 64-bit host
  - iPad and iPhone: standalone app and AUv3
  - Demo is the full version with occasional audio dropouts
