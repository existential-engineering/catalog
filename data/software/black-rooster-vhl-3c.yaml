description: A free vintage high/low pass filter plugin inspired by the Pultec HLF-3C. Clean up your mix bus, kill rumble and harshness.
details: |-
  Inspired by the Pultec HLF-3C: a passive high/low pass filter unit from the early 1950s, built around a cascade of two constant-K filter networks, the tool engineers reached for to shape the extremes of a signal without touching the middle. The VHL-3C is a vintage high/low pass filter, and it's free. No trial timer, no account gymnastics, download it and it's yours. What you get is an entirely passive filter design with two controls and one job: cleaning up the top and bottom of a signal the way a classic Pultec-style filter did, with the musical, slightly interactive behaviour that only a constant-K network gives you.

  The hardware behind the VHL-3C was a sought-after passive processor from the early 1950s. Its filters weren't sharp digital brickwalls, they were gentle, resonant slopes built from inductors and capacitors that interact with the circuit's load. Black Rooster Audio modelled that whole passive network, including the filter-stage interaction and the influence of the load resistance, with a real-time SPICE-style circuit simulation, so the filters don't just cut, they colour.

  The layout is deliberately minimal. The Low Cut-Off (high pass) steps through 50, 80, 100, 150, 250, 500, 750, 1000, 1500 and 2000 Hz, or OFF. The High Cut-Off (low pass) runs from 1.5kHz up to 15kHz across stepped positions, or OFF. Set both to their extreme positions and you get a narrow telephone-line bandpass, a classic lo-fi effect on its own. The third control is a Load Z switch between 500 and 600 Ohm: the filter network is designed for a 500 Ohm terminating resistor, so flipping to 600 Ohm gives slightly overdamped filters, a subtly softer, tamer slope.

  Slot it across the mix bus and roll the low cut up to 50 or 80Hz to strip sub-rumble and room mud that eats headroom, then trim a touch of harshness off the top with the high cut before a bus compressor. On individual sources it tames boxy low end on guitars or removes hiss and sibilant fizz from vocals and cymbals. In mastering it's a clean, characterful high-pass and low-pass pair for gently focusing a full mix without a surgical EQ's clinical edge.
