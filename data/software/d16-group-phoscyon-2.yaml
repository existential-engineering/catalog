description: Bass Line
details: |-
  Phoscyon 2 takes emulation of the legendary Roland TB-303 'silver box' to entirely new heights: its signal path was completely re-designed to achieve an unprecedented level of emulation accuracy. A state-of-the-art FX chain includes a whole bunch of algorithms built with acidic squeaks in mind, and a new sequencer and arpeggiator make pattern editing more convenient, playable live in a loop or switched between via mouse, MIDI controller, or DAW MIDI notes.

  Diehard 303 fans know every unit has a distinctive character; Phoscyon 2's Calibration Parameters let users replicate that variation, including a unique vibrato effect achieved by a two-note tremolo smoothed by note sliding, rarely used even by dedicated 303 artists. Beyond the parameters found on the original hardware, there are extra knobs familiar from popular mods and circuit-bent 303 units.

  Distortion is the most important effect in the chain: Phoscyon 2 includes 19 distinctive-sounding models based on famous hardware units favored by well-known 303 artists, with effect order that can be shuffled for extra flavor.
specs: |-
  - Redesigned 303-style acid bassline synthesis engine
  - New sequencer and arpeggiator with mouse, MIDI controller or DAW MIDI control
  - Calibration Parameters replicating unit-to-unit hardware variation
  - Distinctive vibrato effect via smoothed two-note tremolo
  - 19 distortion models based on famous hardware units
  - Reorderable effect chain
  - Light and Dark UI modes with adjustable UI size and HiDPI support
