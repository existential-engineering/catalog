description: A transient shaper with attack and sustain controls for sharpening or softening a sound without over-compressing it. It can process the stereo signal, the mid, the side, the left or the right channel alone.
details: |-
  Helper Transients 2 is a transient shaper from the Helper series, used to control the shape of a sound during mixing. Where compression is the usual tool for controlling dynamics, transient shaping sharpens or softens a signal without over-compressing it, which suits drums that need to cut through a mix while keeping their dynamics.

  Two controls carry the processing. Attack sets the amount of amplification or attenuation applied to the transient, and sustain does the same for the sustained part of the sound.

  Five channel modes select which part of the source is processed: stereo, mid, side, left or right. Shaping can therefore be applied to the centre of a mix, or to one side of the stereo image, rather than to the whole signal.

  Low pass and high pass filter modules cut unwanted frequencies out of the signal, and input and output gain controls allow gain staging either side of the plugin.

  Ten factory presets ship with the plugin, and the interface is resizable and described as CPU friendly.
specs: |-
  - Attack control for amplification or attenuation of the transient
  - Sustain control for amplification or attenuation of the sustained sound
  - Five channel modes (stereo, mid, side, left, right)
  - Low pass and high pass filter modules
  - Input and output gain controls for gain staging
  - 10 factory presets
  - Preset manager
  - Resizable interface
  - Responsive and CPU friendly
  - Version 2.0.0 added a new interface, a preset manager, Catalina compatibility and Pro Tools AAX support
  - Version 2.1.0 added a resizable interface, an updated preset manager and updated license management
  - Version 2.2.0 added native Apple Silicon and arm64 support
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
