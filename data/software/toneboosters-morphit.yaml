description: Headphones correction and personalization plugin that morphs audio for your headphones to sound like neutral studio reference headphones, with support for over 600 measured models.
details: |-
  Headphones frequency responses vary considerably, causing undesirable coloration and making it difficult to create mixes that translate well to other devices. Morphit morphs the audio for your headphones to sound like neutral, studio reference headphones so mixing decisions can be made quickly and confidently.

  The page states support for 666+ headphone models with frequent updates, measured to ISO, IEC and ITU compliant standards. A correction-amount control changes how much correction is applied on the fly.

  Morphit is presented as the only headphones correction tool available today that can switch and personalize or equalize target curves, offering the Harman curve or ToneBoosters' own, and simulate any of its 600+ supported headphones, so checking how a mix sounds on other headphones is a single selection.

  Loudspeaker virtualization dials in natural-sounding cross-feed with a mouse click, or one of the more advanced studio virtualization options, to hear how a mix translates to loudspeaker playback. An integrated equalizer personalizes the sound further, and a pro-quality peak limiter with gain control provides a pristine output.

  Morphit is also available as an AUv3 plugin for iPhone and iPad, and as an in-app purchase for USB Audio Player Pro on Android.
specs: |-
  - 666+ supported headphone models, with frequent updates
  - Correction amount adjustable on the fly
  - Harman target curve or ToneBoosters' own target curve, both personalizable
  - Simulation mode to hear a mix on any of the supported headphone models
  - Integrated equalizer for personalization
  - Loudspeaker virtualization with cross-feed and advanced studio virtualization options
  - Pro-quality peak limiter with gain control
  - ISO/IEC/ITU compliant measurements
  - Resizable user interface that fits every screen and resolution
  - Dozens of colour themes
  - Undo, redo and A/B switching
  - Preset management with import and export
  - Multiple simultaneous instances
  - License activation without a hardware dongle
  - Sample rates up to 384 kHz
  - Personal, perpetual desktop licence for Windows, macOS and Linux, for use on up to 4 computers
