description: "Headphone correction and personalization plugin that morphs audio
  to compensate for individual headphone colorations. Supports 666+ headphone
  models with adjustable correction intensity, multiple target curves, and
  loudspeaker virtualization."
details: |-
  666+ headphone models supported with frequent updates. Adjustable correction intensity in real-time. Harman or proprietary target curves. Simulation mode to preview mix translation across different headphone models. Integrated equalizer for sound customization. ISO/IEC/ITU compliant measurements. Cross-feed and studio virtualization options. Pro-quality peak limiter with gain adjustment.
specs: |-
  Sample rates up to 384kHz. Personal perpetual license for up to 4 computers.
