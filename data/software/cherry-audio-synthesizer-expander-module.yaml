details: |-
  The Synthesizer Expander Module is a free emulation of the classic Oberheim
  self-contained synthesizer module of the same name. Originally released in
  1974, the keyboardless mono module was intended as a companion to one of the
  earliest digital sequencers.

  Soon thereafter, multiple Synthesizer Expander Modules were linked to an
  early digitally scanned keyboard to create some of the first polyphonic
  synthesizers, used by legendary artists including Joe Zawinul, Toto's Steve
  Porcaro, Styx, and Jan Hammer.

  Despite being a simple, barebones monosynth, the Synthesizer Expander Module
  possessed a unique tone quality, courtesy of its 12 dB/oct state-variable
  filter with lowpass, bandpass, highpass, and notch modes. The recreation
  features a filter section and Phasor effect programmed by award-winning synth
  designer Mark Barton.

  Cherry Audio's emulation includes a massive unison mode, 100 presets covering
  basses, leads, and percussion, a studio-quality echo effect with tempo sync,
  and complete MIDI control with DAW automation.
specs: |-
  - Ultra-accurate dual oscillators
  - Multi-mode filter emulation by Mark Barton (12 dB/oct state-variable)
  - Lowpass, bandpass, highpass, and notch filter modes
  - Massive unison mode
  - 100 presets (basses, leads, percussion)
  - Phasor effect section emulating vintage Oberheim stomp box
  - Studio-quality echo effect with tempo sync
  - Complete MIDI control and DAW automation with MIDI learn/mapping
  - Focus zoom-in and standard UI zoom/resize
  - Optimized DSP for high performance
