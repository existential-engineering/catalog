details: |-
  Synthesizer Expander Module is a free emulation of the classic Oberheim self-contained synthesizer module of the same name. Originally released in 1974, the keyboardless, mono module was intended as a companion to one of the earliest digital sequencers, the Oberheim DS-2. Soon thereafter, Oberheim linked multiple Synthesizer Expander Modules to an early digitally scanned keyboard to create some of the first polyphonic synthesizers, used by artists including Joe Zawinul, Toto's Steve Porcaro, Styx, and Jan Hammer.

  Though it was a simple, barebones monosynth, the Synthesizer Expander Module possessed a unique tone quality, courtesy of its 12 dB/oct state-variable filter. With lowpass, bandpass, highpass, and notch modes, this flexible filter was the star of the show. The emulation recreates it with a filter section and Phasor effect programmed by synth designer Mark Barton (MRB).

  Synthesizer Expander Module is a standalone virtual instrument and plugin, not a module for Voltage Modular. A separate Voltage Modular Synthesizer Expander Module Bundle from Cherry Audio/MRB adds extensive patch panels for modular flexibility and includes the Poly Synthesizer Expander Module.

  Oberheim is a registered trademark of Tom Oberheim/Marion Systems. There is no association, affiliation or endorsement of Cherry Audio or its products by Tom Oberheim.
specs: |-
  - Ultra-accurate dual oscillators
  - Multi-mode filter emulation by synth designer Mark Barton (MRB)
  - Massive unison mode
  - 100 presets for Basses, Leads, and Percussion
  - Phasor effect section emulating the vintage Oberheim stomp box, also replicated by Mark Barton
  - Echo effect with tempo sync
  - Complete MIDI control and DAW automation for all controls, with MIDI learn and mapping (Preset and Global)
  - Focus zoom-in feature, as well as standard UI zoom and resize via drag
  - Documentation available directly online from the instrument or in downloadable PDF format
  - Highly optimized DSP for optimal performance
  - macOS requirements: macOS 10.13 or above, 64-bit required, native Apple M1 or greater processor support including Ultra, 106 MB disk space, 3.4 GHz Quad-Core or M1 CPU with 8 GB RAM recommended
  - Windows requirements: Windows 7 or above (including Windows 11), 64-bit required, 3.4 GHz Quad-Core with 8 GB RAM recommended, 106 MB disk space
  - Internet connection required for product activation
