description: Crystal clear multiband compander and spectral dynamics processor
  offering unbelievable punch and clarity with up to 64 companders working
  simultaneously.
details: |-
  LENS is a spectral dynamics processor with unbelievable clarity and control.

  Multi-band compression without cross-over phase shifts. EQ with constant phase without ringing. Up to 64 companders, all working together on a stereo signal. Simultaneous control of sidechain EQ and output EQ. Removing information that is masked by nearby components. Clean "Over The Top" multiband upwards compression.

  LENS gives you complete control over your mix!

  The plug-in is offered as a Free Edition download and as a paid Full Edition.
specs: |-
  - Master Compressor
  - Multi-band Compression
  - Multi-band Expansion
  - Lack of cross-overs
  - Multi-band Compander
  - Sidechain EQ
  - Sidechain Stereo Width
  - Output EQ
  - Linked push-pull EQs
  - Linked spectral bands
  - Masking information
  - Parallel Compression
  - Unique constant-Q spectral transform
  - High-end Preservation
  - Spectral processing without FFT
  - 64-bit double processing
  - Up to 64 companders, all working together on a stereo signal
  - VST / AAX / AU / LV2 plug-in for Windows, macOS, and Linux
