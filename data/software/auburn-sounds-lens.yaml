description: Crystal clear multiband compander and spectral dynamics processor
  offering unbelievable punch and clarity with up to 64 companders working
  simultaneously.
details: |-
  Lens is a spectral dynamics processor described as a crystal clear multiband
  compander, delivering punch and clarity through an innovative approach to
  multiband compression. Unlike traditional multiband compressors, it avoids
  cross-over phase shifts for cleaner processing.

  The plugin features up to 64 companders working together on stereo signals,
  providing extremely fine-grained spectral dynamics control. It offers EQ with
  constant phase without ringing, and simultaneous control of sidechain EQ and
  output EQ for precise shaping.

  Lens can remove masked information from nearby frequency components, improving
  mix clarity by intelligently managing spectral overlap. It also provides clean
  multiband upwards compression for bringing out detail without artifacts.

  Available in Free and Full editions, Lens is suited for mixing and mastering
  applications where transparent dynamics control and spectral clarity are
  essential.
specs: |-
  - Multi-band compression without cross-over phase shifts
  - EQ with constant phase without ringing
  - Up to 64 companders on stereo signals
  - Simultaneous sidechain EQ and output EQ control
  - Removal of masked information from nearby components
  - Clean multiband upwards compression
