details: |-
  Modular Fiasco is a node-based modular DAW that runs both as a standalone and as a plugin inside your existing DAW. Acting as a synth, drum machine, sampler, slicer, sequencer, FX chain, or all of the above at once.

  Modular Fiasco is for producers and sound designers who want total control over signal flow without being locked into a traditional linear DAW. If you're into modular synthesis, node-based workflows, or just want something that breaks the rules, this is it. Route everything, modulate everywhere.

  Sequencing spans three families. Generative sequencers (PATTERN, MOTIF, HARMONY, RHYTHM, ACID, APRIKOS, ATLAS) share genre selection, seed-based randomization, clock sync and swing, so feeding them a clock produces musically coherent content immediately. Step sequencers (PLENUM, MONOTRACK, ANIMATE, SPIKE) give note-by-note manual control, and grid sequencers (KEY GRID, DR GRID, SLICE GRID) provide piano-roll and trigger-grid editing with snap-to-grid and loop regions. All support 16 patterns with CONDUCTOR linking for song arrangement.

  Sound sources cover eight classic analog emulations (AURORA-60 for the Juno-60, SUBRUNNER-101 for the SH-101, SNAKELINE for the TB-303, MINIMONO for the Minimoog, COSMIC-8 for the Jupiter-8, GRINDER-20 for the MS-20, IMPERIUM-80 for the CS-80, VECTOR 2600 for the ARP 2600) alongside modern synthesis (WAVETABLE, ASTRAL BASS, ANNULUS physical-modeling resonator) and samplers (TRUMMIS, FRACTURE, PIZZA, LOOPER, SAMPLE, AM RADIO, COSMIC KICK).

  The effects side runs to 35 modules covering reverb (DATTORRO, ROOM, VELVET, DRIP), delay (SPIRAL, FREQ SHIFT), filters (PRISM, COMB, TOOTH, FORMANT, RESONATE, CHROMA, HARMONIC FIELD, DAMP), distortion and saturation, dynamics, modulation FX, and granular/time processing (PARTICULATE, STRETCH, STUTTER, VARISPEED). Modulation, trigger/gate, audio-routing and utility modules (LFO, ENVELOPE, MOTION LANE, CLOCK, MIXER, CONDUCTOR, SCOPE, RECORDER) tie the patch together.

  Modular Fiasco is under alpha development. Follow me on socials for more information once available.
specs: |-
  - Node-based modular DAW, runs standalone or as a VST / AU plugin inside a host DAW
  - Generative sequencers with genre selection, seed-based randomization, clock sync and swing: PATTERN, MOTIF, HARMONY, RHYTHM, ACID, APRIKOS (34 algorithms), ATLAS
  - Step sequencers: PLENUM (polyphonic chord sequencer, 20 mood palettes), MONOTRACK, ANIMATE (20 waveform shapes), SPIKE (5 edit modes, up to 64 steps)
  - Grid sequencers: KEY GRID (4-octave piano roll with 4 CV automation lanes), DR GRID (5-voice trigger grid), SLICE GRID (per-slice pitch/level/probability/reverse/stutter)
  - 16 patterns per sequencer with CONDUCTOR linking, snap-to-grid and loop regions
  - MIDI tools: ARP (11 modes, strum), MIDI MERGE, MIDI TO MOD, MIDI ENGINE (.mid/.midi playback), MIDI INFO, OCTAVE, TRANSPOSE, QUANTIZE
  - 8 classic synth emulations: AURORA-60, SUBRUNNER-101, SNAKELINE, MINIMONO, COSMIC-8, GRINDER-20, IMPERIUM-80, VECTOR 2600
  - Modern sound sources: WAVETABLE (dual wavetable oscillators, dual filters, 5-slot mod matrix, unison), ASTRAL BASS, ANNULUS physical-modeling resonator
  - Samplers and drums: TRUMMIS (5-voice drum sampler, 6 audio outs), FRACTURE, PIZZA slice chopper, LOOPER (4-voice polyphonic), SAMPLE, AM RADIO, COSMIC KICK
  - 35 audio FX modules across reverb, delay, filters, distortion, dynamics, modulation, granular and texture
  - Modulation modules: LFO (6 waveforms, clock sync, 9 random CV outs), KNOB, SLIDER, RANDOM MOD, STROBE, TRACE envelope follower, ENVELOPE ADSR with per-stage curves, MOTION LANE (32 segments, 16 patterns)
  - CV utilities: SMOOTH, SCALE MOD, OFFSET, TRIM, INVERT, HOLD, MATH, GATE TO MOD
  - Trigger and gate modules: CLOCK (13 rates from 8-bar to 1/16T), BUTTON, TRANSPORT, TRIGGER SPARK, VOLLEY, COIN FLIP, COMPARITOR, IN AND OUT
  - Audio routing: MIXER (6 channels with volume, pan, metering), VOLUME (CV-controllable VCA), BOOST (100-400%), PANNING, DUCK, CARVE
  - Utilities: CONDUCTOR song arranger (16 scenes, links to 11 sequencer tracks), MUTE, MOD ECHO, SCOPE oscilloscope, RECORDER with WAV export (5 min max)
  - Currently under alpha development
