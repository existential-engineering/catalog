description: >-
  The complete Melodyne with multitrack note editing, Sound Editor for
  overtone-based sound design, and all DNA Direct Note Access features.
details: |-
  Melodyne 5 Studio is the complete edition of Melodyne, featuring
  every tool and function available. Multitrack Note Editing enables
  working across multiple tracks in a single window with
  track-transcending macros.

  The Sound Editor provides overtone-based sound design capabilities,
  allowing manipulation at the harmonic partial level. Quantize to
  reference track aligns timing across multiple recordings.

  All features from Essential, Assistant, and Editor editions are
  included, along with DNA Direct Note Access for polyphonic editing.
  Available as a plug-in via ARA, VST3, AU, and AAX, or as a
  standalone application.
specs: |-
  - Multitrack Note Editing in single window
  - Track-transcending macros
  - Quantize to reference track
  - Sound Editor with overtone-based sound design
  - DNA Direct Note Access for polyphonic editing
  - All Editor edition features included
  - ARA integration for supported DAWs
  - 64-bit only
  - Intel/AMD Dual Core minimum, Quad Core recommended
  - 4 GB RAM minimum, 8 GB recommended
  - macOS 10.12 or higher with Apple Silicon support
  - Windows 10 or higher
