description: Mono transformer-coupled passive Pultec-style equalizer with
  all-discrete design. Delivers up to 15 decibels of silky smooth high end and
  punchy low end. Features the classic Pultec low-end trick, Mid/Side matrix,
  and plugin-exclusive additional high boost frequency selections.
details: |-
  Pultec-style passive EQ with all-discrete design
  Up to 15 dB of boost capability
  Pultec Low-End Trick: simultaneous boost and cut on same frequency (30-100 Hz)
  Stereo operation and Mid/Side matrix (plugin-exclusive)
  Additional High Boost frequency selections (plugin-exclusive)
  Analog button introducing noise, hum, and transformer saturation
  Input Pad control for level-matching A/B comparisons
