description: Mono transformer-coupled passive Pultec-style equalizer with all-discrete design. Delivers up to 15 decibels of silky smooth high end and punchy low end. Features the classic Pultec low-end trick, Mid/Side matrix, and plugin-exclusive additional high boost frequency selections.
details: |-
  The PEX-500 is a plugin emulation of Lindell Audio's mono transformer-coupled passive Pultec-style equalizer. Its all-discrete design is based upon Lindell Audio's hybrid amplifier that provides up to 15 decibels of silky smooth high end and punchy low end. The plugin is a tone-shaping tool with musical band interactions, used to add clarity to vocals, bring out the guttural nature of bass growls, and imbue acoustic guitars with vintage sheen.

  One of the most unique features of the PEX-500 is its apparent ability to boost and cut the same frequency. In reality, the filter shape applied looks like a low-shelf boost with a scoop just above it. When attempting to tighten up the low end of a kick drum or bass track, boosting and cutting around 30-100 Hz can work like magic. The plugin does well when pushed to its limits.

  The plugin is a faithful emulation that includes plugin-only features like stereo operation, a Mid/Side matrix, and additional High Boost frequency selections. There's also an Analog button that introduces noise, hum, and transformer saturation to the signal. To level-match the input signal and make accurate A/B processing comparisons, there is a built-in Input Pad control exclusive to the plugin version of the PEX-500.

  The plugin ships in AAX Native, AU, RTAS, VST2 and VST3 formats for macOS and Windows.
specs: |-
  - Classic passive Pultec tone and features
  - Mid/Side matrix
  - Faithful emulation of the original all-discrete Lindell hardware
  - Smooth, musical EQ curves
  - Separate Boost and Attenuate controls for the bass band
  - True analog circuit model, warms up tracks just by instantiating it
  - Supported plugin formats: AAX Native, AU, RTAS, VST2, VST3
  - Supported operating systems: macOS 26 down to macOS 13, Windows 11 down to Windows 10
  - Mac: Intel, or Apple Silicon
  - PC: x64-compatible CPU
  - Display resolution: 1440 x 900px or 1280 x 960px or higher
  - Memory: 2 GB RAM
