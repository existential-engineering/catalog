details: |-
  Engine Player is Best Service's next-generation sample player, built from the ground up by their in-house Engine Audio brand. It replaces the previous Engine 2 platform and features native Apple Silicon support, a modern architecture, and a range of tools for instrument creation, copy protection, and license management.

  Engine Player is not backwards compatible with Engine 2 libraries. Engine 2 libraries are being migrated to the new format over time, with free updates provided to existing library owners.
