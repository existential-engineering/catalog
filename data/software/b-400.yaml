details: |-
  B-400 is a simple synthesizer that provides a myriad of minor tonal variations
  to a core sound that falls somewhere in between an electronic piano and a
  basic poly-synth.

  B-400 utilizes three oscillators (with 32 waveforms each) as well as a leslie
  / vibrato style flutter output plus two other main output channels - one being
  a simple clean out and the other a tube simulator with a 3-band eq.

  Each oscillator is able to be coarse tuned.
specs: |-
  - Three oscillators with 32 waveforms each
  - Leslie / vibrato style flutter output
  - Clean output channel
  - Tube simulator with 3-band EQ
  - Coarse tuning per oscillator
  - Windows compatible
