description: Reverb plugin specifically designed for vocal processing. Enhances vocals with rich, wide, and tailored space while maintaining clarity. Features Body and Air sculpting, pre-delay, and stereo imaging controls.
details: |-
  Vocal-optimized reverb with rich, wide space that retains clarity. Pre-delay for vocal definition, flexible time control, Body and Air sculpting, and Dry/Wet blend. Tailored for vocals with a versatile ambience engine. Part of Vocal Plugin Bundle. Requires macOS 11+ or Windows 10 64-bit+.
