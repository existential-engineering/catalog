description: Reverb plugin specifically designed for vocal processing. Enhances
  vocals with rich, wide, and tailored space while maintaining clarity. Features
  Body and Air sculpting, pre-delay, and stereo imaging controls.
details: |-
  VoxVerb is a reverb plugin from LANDR built specifically for vocals. It is presented as a way to enhance vocals with space that feels rich, wide, and tailored, making it easy to craft clean, immersive reverb that adds depth and dimension while retaining the vocal performance.

  The plugin is aimed at creating depth and space, from subtle shimmer to cinematic reflections, adding ambience without muddying the mix. LANDR positions it for modern, professional vocals, with controlled reverb effects that keep vocals front and centre and the surrounding mix clean and clear.

  Tone shaping is handled by Body and Air controls, which adjust warmth and brightness so vocals sit in the mix, alongside a Dry / Wet blend for balancing ambience against the direct sound. A pre-delay control keeps vocals crisp before the reverb enters, and flexible time control tunes reverb length from tight rooms to long tails.

  The ambience engine covers hall and room reverb presets and stereo image expansion, so the reverb can be widened for immersive space while keeping the vocal in focus.

  VoxVerb runs on macOS 11 or higher (Apple Silicon native or Intel) as VST3, AU and AAX, and on Windows 10 64-bit or higher as VST3 and AAX. It is included with a LANDR Studio subscription and is also available as an individual purchase.
specs: |-
  - Pre-delay for clarity, keeping vocals crisp before reverb kicks in
  - Flexible time control, from tight rooms to lush tails
  - Body and Air sculpting for warmth, brightness and vocal presence
  - Dry / Wet blend for balancing ambience and direct sound
  - Stereo image expansion
  - Hall and room reverb effect presets
  - macOS: macOS 11 or higher, Apple Silicon native or Intel, VST3 / AU / AAX
  - Windows: Windows 10 (64-bit) or higher, VST3 / AAX
