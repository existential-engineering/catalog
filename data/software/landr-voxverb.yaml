description: "Reverb plugin specifically designed for vocal processing. Enhances
  vocals with rich, wide, and tailored space while maintaining clarity. Features
  Body and Air sculpting, pre-delay, and stereo imaging controls."
details: |-
  Vocal-centric reverb design with warmth and brightness controls. Pre-delay for vocal clarity. Flexible reverb duration with various room types. Body and Air sculpting. Stereo width expansion with hall and room presets. Dry/Wet blending. Part of Vocal Plugin Bundle. Requires macOS 11+ or Windows 10 64-bit+.
