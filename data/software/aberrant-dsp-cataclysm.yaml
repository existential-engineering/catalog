description: Cataclysm is a signal destruction machine from a paranoid time.
  Inspired by malfunctioning test equipment, illegal wiretaps, and classic
  analog hardware, Cataclysm brings chaotic circuitry into the digital age.
details: |-
  Cataclysm is a multi-effect signal destruction plugin inspired by
  malfunctioning test equipment, illegal wiretaps, and classic analog hardware.
  It brings chaotic circuitry into the digital age.

  At its core is a central Drive module with in-depth waveshaping, gating, and
  tone controls, paired with a Tone Circuitry module featuring approximations of
  three classic guitar amps.

  The plugin includes a time-domain Pitch Shifter with two independent voices, a
  Lofi Looper with three Recording Mediums (Tape, BBD, Data) and adjustable
  quality, and a Hum low-frequency drone oscillator.

  Additional modules include Stereo Chorus with bass frequency preservation and
  4 waveshapes, Amplitude Modulation with 4 waveshapes for tremolo and ring mod
  effects, an Envelope Follower, a Delay-Based Stereo Resonator, and a Stereo
  Delay module.

  Cataclysm features a global Mix control, instructional computer display, and a
  custom preset system with 92 factory presets. It requires Windows 10 or later
  (VST3, AAX 64-bit) or macOS 10.13+ with Intel or Apple Silicon (AU, VST3, AAX
  64-bit).
specs: |-
  - Central Drive module with waveshaping, gating, and tone controls
  - Tone Circuitry module with three classic guitar amp approximations
  - Time-domain Pitch Shifter with two independent voices
  - Lofi Looper with three Recording Mediums (Tape, BBD, Data)
  - Hum low-frequency drone oscillator
  - Stereo Chorus with bass frequency preservation and 4 waveshapes
  - Amplitude Modulation module with 4 waveshapes
  - Envelope Follower module
  - Delay-Based Stereo Resonator with tunable resonant pitch
