description: Drop a track to discover fresh mashup and DJ transition ideas in
  seconds. Improve your DJ mixing with new Mashup mode and DJ Mix mode.
details: |-
  Mixed In Key 11 Pro adds Mashup mode and DJ Mix mode on top of the standard Mixed In Key feature set. In Mashup mode you load a track in Deck A and the software returns perfectly matched mashup suggestions for Deck B, drawn from your own library. In DJ Mix mode you receive track suggestions intended to help craft smooth transitions and build a set.

  Stem separation splits any song into vocals and instruments with a single click, and stems can be exported for free with no subscription needed. Playback from any cue point is immediate, you can toggle between the full track, vocals or instrumental, export stems with pitch changes applied, and send the files to your DAW or to a folder.

  Pitch shift lets you change the key of any track and get real-time mashup suggestions and exports that match the shift, so you can find combinations nobody else has. Looping lets you lock a section, for example loading an acapella on the first deck and looping it while trying different instrumentals on the right deck. An idea filter limits suggestions by energy level, tempo and playlist, a feature the page credits to a suggestion from David Guetta.

  A Favorite Mashups playlist stores saved mashup ideas for review, rating and export directly to DJ software or a DAW. Cue points can be clicked to play their segment beatmatched with the track on the other deck, and a Test button plays both decks at once in sync.

  The Pro version includes all the main Mixed In Key features: key detection, energy level analysis, cue point creation, tag editing, the mashup idea engine, mashup deck players and the mixout idea engine. Analysed music is designed to work with Serato DJ, Denon, Pioneer Rekordbox, Ableton Live, DJ.Studio, Native Instruments Traktor and Virtual DJ.
specs: |-
  - Mashup mode: load a track in Deck A and get matched mashup suggestions in Deck B
  - DJ Mix mode: track suggestions for smooth transitions and set building
  - Stem separation (highest quality) into vocals and instruments with a single click
  - Stem export with no subscription required
  - Export vocals, instrumentals or the full track in both the original and updated key and tempo
  - Send stems to your DAW or to a folder
  - Instant playback from any cue point for vocals and instrumentals
  - Toggle between full track, vocals or instrumental
  - Pitch shift: change the key of a track and get matching real-time suggestions and exports
  - Looping: create custom loops and lock a section
  - Idea filter by energy level, tempo and playlist
  - Test Mashup / Test DJ Mix: play both decks beatmatched and in sync
  - Favorite Mashups playlist with rating and export
  - Export favorite mashups to DJ.Studio
  - Add to Playlist and Move to Deck A controls
  - Key detection
  - Energy level analysis
  - Cue point creation
  - Tag editing
  - Mashup idea engine and mashup deck players
  - Mixout idea engine
  - Camelot Wheel harmonic mixing
  - Emoji support in playlists
  - Compatible with Serato DJ, Denon, Pioneer Rekordbox, Ableton Live, DJ.Studio, Native Instruments Traktor and Virtual DJ
  - One-time purchase, not a subscription
