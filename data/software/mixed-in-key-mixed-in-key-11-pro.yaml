description: Advanced DJ tool for discovering mashup ideas and smooth DJ transitions. Analyzes tracks by key, BPM, and energy level; features stem separation, real-time dual-deck playback, and export to DJ.Studio.
details: |-
  Mixed In Key Pro is a standalone desktop application that helps DJs discover mashup and transition ideas by analyzing the key, BPM, and energy level of their music library. Its Mashup mode surfaces fresh combination possibilities in seconds.

  Stem Separation isolates individual elements of a track (vocals, drums, bass, etc.) and allows export for use in DJ sets or production. Users can change a track's key to discover additional mashup possibilities.

  DJ Mix mode enables smooth transitions between tracks with deck players, real-time playback from any cue point, and loop fragments for testing combinations before committing.

  Advanced filtering allows browsing by playlist, genre, and other criteria. Integrates with Serato, Rekordbox, Denon, Traktor, Virtual DJ, and Ableton Live using the Camelot Wheel harmonic mixing system.
specs: |-
  - Stem separation and export
  - Mashup idea engine with dual deck players
  - DJ Mix mode for smooth transitions
  - Key detection with Camelot Wheel
  - BPM detection and energy level analysis
  - Pitch shifting and key change
  - Loop fragments for combination testing
  - Advanced filtering by playlist and genre
  - Favorite mashups playlist management
  - Export favorite mashups to DJ.Studio
  - Integrates with Serato, Rekordbox, Denon, Traktor, Virtual DJ, Ableton Live
