details: |-
  Awave Audio is a dedicated audio file format batch converter. Main features:
  supports a wide range of audio file formats reads from ~110 and writes to ~75
  different formats. A simple 3-step interface for quick and easy conversions
  handle a thousand files as easily as one.

  File size is limited only by disk space and the design limits of the file
  formats. Converts anything from low-rate mono speech up to 24/96 multi-channel
  audio.

  Dithering techniques to improve sound quality when reducing the sample
  bit-depth. Extremely high-quality sample rate conversion with up to 144db
  s/n-ratio.

  Optional audio processing using VST plug-ins as well as built-in functions.
  Normalization support including replay gain, itu bs 1770 and ebu r 128
  algorithms for psycho-acoustically adjusted volume.

  Direct stream copy support for data types - providing a speed advantage and
  allowing addition of metadata without recompressing audio. Handles many types
  of text metadata (ape-tags, id3v2 et c.) with full unicode support. Image
  metadata support for embedded album covers.
specs: |-
  - Sample conversion
  - Audio file format batch converter
  - VST plugin host
  - Supports ~110 input formats
  - Supports ~75 output formats
  - Multi-channel audio support
  - 24-bit/96khz audio conversion
  - Dithering techniques
  - Sample rate conversion with up to 144db s/n-ratio
  - VST plug-in audio processing
  - Built-in audio processing functions
  - Normalization support
  - Replay gain algorithm
  - Itu bs 1770 algorithm
  - Ebu r 128 algorithm
  - Direct stream copy support
  - Metadata editing
  - Ape-tags support
  - Id3v2 support
  - Unicode support
  - Image metadata support
  - Album cover embedding
  - Windows compatible
  - Arm64 support
  - Multi-item editing of metadata
