description: EQ your tracks based on thresholds for increased EQ control. The
  highly-tweakable space-carving capabilities of the Dynamic EQ will be a
  welcome addition to your mixing arsenal.
details: |-
  The Sonnox Oxford Dynamic EQ applies equalisation across specific frequency bands in response to the dynamics of the signal, for use in mixing and mastering. Unlike a static EQ it adapts in real time, so excessive sibilance can be managed, harsh frequencies smoothed, or presence added to an element without over-compressing it. It runs at low CPU usage.

  Peak detection covers broad control and onset detection targets fast attacks, so it responds to sharp percussive hits and sustained tones alike, and it can be paired with upward or downward compression. Typical tasks are smoothing vocal peaks, tightening drums, taming a boomy bassline and controlling reverb tails.

  Real-world applications span vocal precision (boosting presence around 2 to 4 kHz when clarity is lacking, or taming harsh sibilance in the 5 to 8 kHz range only when it gets too aggressive), controlling boomy bass by targeting specific low-end resonances with a tight bell-shaped EQ while adding a dynamic low-shelf triggered by the kick drum, and shaping snares using onset detection to rein in sharp transients with upward expansion on a high shelf to eliminate cymbal bleed between hits.

  Each Oxford plugin licence includes two simultaneous activations, authorised with a free iLok account. Activations can be assigned to a local machine install, an iLok2 or iLok3 USB device, or iLok Cloud (only one activation can be assigned to iLok Cloud; the other must be on a local machine or iLok device). A free trial and a 14-day money-back guarantee are offered, with instant digital download.
specs: |-
  - Advanced detection modes: peak detection for broad control, onset detection to target fast attacks and transients
  - Upward and downward compression and expansion
  - Internal and external sidechaining
  - Real-time adaptation to programme dynamics across specific frequency bands
  - Available as 3-band and 5-band variants, mono and stereo
  - Low CPU usage
  - macOS 10.13 High Sierra or later
  - Windows 10 (64-bit) or later
  - AAX-Native requires Pro Tools 11 or later
  - AAX-DSP supports Pro Tools Ultimate, Pro Tools HD, or Avid VENUE systems
  - AAX-DSP instances per chip, 3-Band Mono: 7 at 44.1/48 kHz, 3 at 88.2/96 kHz, 1 at 176.4/192 kHz
  - AAX-DSP instances per chip, 3-Band Stereo: 3 at 44.1/48 kHz, 1 at 88.2/96 kHz
  - AAX-DSP instances per chip, 5-Band Mono: 5 at 44.1/48 kHz, 2 at 88.2/96 kHz, 1 at 176.4/192 kHz
  - Two simultaneous activations per licence, authorised with a free iLok account (local machine, iLok2/iLok3 device, or iLok Cloud)
