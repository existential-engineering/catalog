description: Original signature compressor by Koen Heldens. Hilbert detector, invertible sidechain, zero latency, transparent dynamics.
details: |-
  The KH-COMP1 is a compressor built from a blank sheet rather than a copy of some 50-year-old box. It's the first plugin in the Koen Heldens Signature Series, an original dynamics processor designed with the multi-platinum, award-winning mix engineer to do things his go-to gear couldn't. No vintage lineage, no borrowed schematic. Just a clean-sheet compressor aimed at the way records are actually mixed now, with four selectable envelope detectors, a fully invertible 2-band sidechain filter, an external sidechain input, blended stereo linking and true zero latency.

  When Black Rooster Audio started working with Koen on a signature series, the brief was to give him a compressor that behaves the way he thinks, not the way a 1960s circuit forces him to. His ideas about process timing, channel linking and sidechain filtering pushed the team to build an entirely new tool. At its core it's a clean feed-forward peak compressor: musical gain control that sits under a source without announcing itself, but with a control set that lets you push far past invisible when the track calls for it.

  Four detector modes, Hilbert, Peak, Vintage and RMS, let you shape the envelope that drives the unit, from broad and forgiving to surgically precise. The Hilbert mode derives the analytic signal (a 90-degree phase-shifted pair) and reads a source's true envelope magnitude without the distortion or overshoots that trip up naive peak detection. A 2-band invertible sidechain filter, a low band from 20Hz to 1kHz and a high band from 2.5kHz to 35kHz, each with its own Q, lets you EQ the detector's feed, then invert it to carve out a band for aggressive de-essing, ducking or pumping. A Listen button monitors that filtered sidechain, and an external sidechain input (Ext SC) lets a separate track drive the compression entirely. The whole thing runs at zero latency, with no oversampling, no look-ahead and no sample delay compensation.

  On lead vocals, Hilbert detection with a fast attack (down to 0.5ms) rides a performance level without the pumping artefacts a classic RMS detector introduces, and the invertible sidechain filter doubles as a built-in de-esser. On drums, Peak mode and a short attack nail transients, while Vintage mode, a half-wave detector shape that emphasises even-order, K2-leaning content, grabs a bus with a rounder, more forgiving feel. The Blended Stereo-Link lets you dial the exact relationship between dual-mono and stereo-linked processing. Threshold sweeps from 0 down to -48dBFS, Ratio steps from 2:1 up to a brick-wall infinity, and the stepless Knee plus a full dry/wet Mix control give you everything from soft parallel leveling to hard, edgy limiting.
