description: The definitive 5150 amp sim plugin. Four built-in pedals, dual IR loader, and the crushing high-gain tone that defined modern metal and rock. Try it free.
details: |-
  AmpCraft - 1992 represents the first in a next-gen line of amp modeling plugins from Kazrog. It is focused on being an accurate emulation of the legendary "block letter" 5150 high gain tube amp used on countless albums and tours, and the page describes the amp as known for its crushing lead channel, lush mids, and smooth top end. The clean/crunch channel is given higher headroom than the actual hardware, for true clean and mid-gain tones.

  Four overdrive pedal models are built in. The 808 is based on a limited boutique Japanese "808" pedal with hand-picked vintage ICs, described as a smooth overdrive that sculpts attack from blues to metal. The 66 is based on a modern boutique EQ/boost pedal made famous by a Swedish metal band. Stockholm is based on the Japanese-built pedal known for buzzsaw distortion and its place in the early Swedish death metal scene. Djrive is based on a modern boutique overdrive with selectable voicings aimed at varied tunings.

  A 2-channel cabinet IR loader with speaker dynamics closes the chain, carrying over 200 impulse responses across four cabinet IR packs from the Recabinet - Remastered collection, with eight mic models on each cab: 1960 4x12 (modern British), Green 4x12 (vintage 1970s British), Oversize 4x12 (American oversized Baltic Birch), and Tangerine 4x12 (modern British, classic-style voicing). The loader offers a 4-band EQ, speaker dynamics control, stereo panning in a stereo instance, an adjustable short delay for phase correction with third-party IRs, and variable blending that is psychoacoustically level matched in the center.

  The plugin also includes a noise gate, oversampling up to 32x with separate real-time and offline settings adjustable on the fly, a resizable GUI, and a standalone Mac and Windows application for playing without a DAW. Licensing is a 100% perpetual license for multiple devices with no iLok authorization and no subscription fees. The free demo is time-unlimited but adds random silent output and disables preset saving.
specs: |-
  - Touch-sensitive emulation of the American "block letter" high gain tube amp
  - Higher-headroom clean/crunch channel than the original hardware
  - Four overdrive pedal models: 808, 66, Stockholm, and Djrive
  - Noise gate
  - Over 200 impulse responses from 4 historic cabinets, with 8 mic models per cab
  - Included cabinet IR packs: 1960 4x12, Green 4x12, Oversize 4x12, Tangerine 4x12 (from Recabinet - Remastered)
  - 2-channel cabinet IR loader with speaker dynamics
  - 4-band EQ, stereo panning, and adjustable short delay in the IR loader
  - Loads user-supplied third-party IRs
  - Variable IR blending, psychoacoustically level matched in the center position
  - Oversampling up to 32x with separate real-time and offline settings, adjustable on the fly
  - Resizable GUI
  - Standalone application for Mac and Windows
  - Mac: macOS 10.13.x or higher; VST, AU, AAX (64-bit) host required; Universal Binary 2 (Apple Silicon and Intel)
  - Windows: Windows 10 or higher; VST or AAX (64-bit) host required
  - Linux: VST3, VST2, or LV2 host required; tested with Ubuntu, Linux Mint, Debian, and Manjaro
  - Pro Tools 12 or higher required for the AAX version
  - Apple M1 or Intel i5 "Ivy Bridge" CPU or newer strongly recommended
  - 100% perpetual license for multiple devices, no iLok authorization required, no subscription fees
