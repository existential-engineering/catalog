description: A next-generation amp modeling plugin delivering highly-accurate, touch-sensitive emulation of the legendary "block letter" 5150 high-gain tube amplifier, designed for authentic play-through feel and sound.
details: |-
  AmpCraft - 1992 is a high-gain amp simulator plugin from Kazrog, modeled on the iconic "block letter" 5150 tube amplifier. It is designed to deliver a highly-accurate, touch-sensitive playing experience that captures the feel and tone of the original hardware.

  The plugin includes four overdrive pedal options (808, 66, Stockholm, and Djive) and a built-in noise gate, giving players a versatile front-end signal chain before hitting the amp simulation.

  A dual-channel impulse response loader is included with over 200 IRs sourced from four historically significant cabinets: a 1960 4x12 (modern British), a Green 4x12 (vintage 1970s British), an Oversize 4x12 (American), and a Tangerine 4x12 (modern British).

  Additional features include a 4-band EQ, oversampling up to 32x for enhanced audio fidelity, and a resizable GUI for flexible workflow integration.

  AmpCraft - 1992 uses a 100% perpetual license model with no iLok dongle and no subscription required.
specs: |-
  - 4 overdrive pedals: 808, 66, Stockholm, Djive
  - Built-in noise gate
