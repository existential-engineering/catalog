description: "One Kit Wonder: Nu Metal is a drum library inspired by modern
  metal bands building on the Nu Metal sound. It features gigantic low-tuned
  drums with shimmering cymbals, including a juicy kick, massive snare,
  high-tuned side snare, 3 deep toms, and a balanced cymbal array. Designed to
  deliver mix-ready drum tones straight out of the box."
details: |-
  One Kit Wonder: Nu Metal draws inspiration from the new wave of metal bands building upon the Nu Metal sound. Gigantic low-tuned drums punch through the mix with their massive impact, while shimmering cymbals bring energy and brilliance, adding waves of polish and sheen.

  OKW: Nu Metal comprises of a juicy and aggressive kick drum, massive and low snare, complemented by a firecracker high-tuned side snare and 3 deep, wet sounding toms. A generous and perfectly-balanced array of cymbals chosen for their airy smooth character, give you all you could need for playlist-topping sonic expression.

  The One Kit Wonder series was inspired by the many GGD users who use our libraries for songwriting. We know how crucial it is that there is as little time wasted between the moment inspiration strikes and you being able to capture it, and how important it is that you can hear your ideas sounding polished and professional so you stay excited as you develop them.

  It's our hope that this sample library will remove frustrating barriers in your creative process so that you can enjoy making music to the fullest.
specs: |-
  - Requires Kontakt Player 7 or Kontakt 7 (latest version)
  - Mac: OS X 12+ (64-bit), Intel i5 or higher
  - Windows: Windows 10+ (32/64-bit), Core 2 Duo or Athlon 64 X2 or higher
  - RAM: 4 GB minimum, 6 GB recommended
  - Disk: 3.5 GB for instrument + 1 GB Kontakt Player
  - OpenGL 2.1 or higher
  - Internet connection required for activation
