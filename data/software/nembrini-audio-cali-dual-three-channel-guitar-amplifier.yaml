details: |-
  Cali Dual Three Channels Guitar Amplifier 100 watt head can be driven from the most pristine clean sounds to an incredible crushing wall of gain. It is modeled on a Mesa Boogie Dual Rectifier* . Three completely independent channels with separate controls for gain, tone, presence and volume. Two different power selections in the Cali Dual Three Channel Guitar Amplifier are equally important when looking for a particular sound.
