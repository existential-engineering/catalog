description: A 100-watt guitar amplifier plugin modeled on the Mesa Boogie Dual Rectifier, delivering clean tones through to heavily distorted sounds across three independent channels. Features authentic rectifier voicing modes, built-in cabinet emulations, microphone positioning, and an IR loader for third-party cabinets.
details:
  - The Cali Dual Three Channels Guitar Amplifier is a faithful software emulation of the iconic 100-watt Mesa Boogie Dual Rectifier, one of the most sought-after guitar amplifiers in rock and metal history. It captures the full tonal range of the original hardware, from pristine clean tones to crushing high-gain distortion.
  - The plugin features three fully independent channels, each with dedicated gain, tone stack (bass, mid, treble), presence, and volume controls. Channel 1 offers Clean and Pushed voicing modes, while Channels 2 and 3 provide the signature Raw, Vintage, and Modern rectifier voicing options that define the Dual Rectifier's character.
  - "Power supply behavior is authentically modeled with two modes: Spongy mode reduces internal voltages to recreate the compressed, harmonically rich response of a vintage amp running at lower power, while Bold mode delivers maximum headroom and tighter response for modern high-gain playing."
  - The plugin includes six built-in guitar cabinet emulations and four microphone models (two dynamic, two condenser) with on-axis and off-axis positioning. A full mixer section with solos, mutes, panning, and faders allows blending of multiple microphone positions. An impulse response loader supports up to three third-party IRs for further cabinet customization.
  - A built-in noise gate and cleaner circuit help manage unwanted noise and hum common with high-gain guitar setups, making the plugin suitable for direct recording and live performance applications.
specs: |-
  - Version: 1.0.12
  - Three independent channels with separate gain, tone, presence, and volume controls
  - Channel 1: Clean and Pushed voicing modes
  - Channels 2 & 3: Raw, Vintage, and Modern rectifier voicing modes
  - Spongy and Bold power supply modes
  - Six built-in guitar cabinet emulations
  - Four microphone emulations with on-axis and off-axis positioning
  - Mixer section with solos, mutes, panning, and faders
  - Impulse response loader (supports up to three third-party IRs)
  - Built-in noise gate and cleaner circuit
  - System requirements: Intel or Apple Silicon CPU, 1 GB RAM, 64-bit DAW
  - macOS 10.13 or later
  - Windows 7 or later
