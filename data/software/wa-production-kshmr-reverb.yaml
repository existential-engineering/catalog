description: Reverb plugin with ducking, gating, tonal reset and reverse effects for shaping reverb tails. Adds a six node EQ, a de-esser, modulation and a resizable interface with live visual feedback.
details: |-
  Reverb is an artist collaboration between the producer KSHMR and W. A. Production. It combines conventional reverb controls with ducking, gating and effects aimed at shaping the tail, so the original signal can stay in front while the reverb is controlled behind it.

  The Volume Manager ducks the reverb signal whenever the source passes a set threshold, applies a fade in time for a smooth tail, and gates the reverb into silence when it falls below a second threshold.

  The Tone Manager removes harsh attacks from the reverb signal to improve its tonality, and Tonal Reset restarts the reverb each time a new transient is detected so that chords do not bleed into one another. The Special FX panel adds a reverse mode that ramps the tail up until the next transient arrives, and an octave harmony that thickens the timbre.

  Standard controls cover Diffusion, Width, Length and Size, with modulation for subtle variation in character and a de-esser for removing fizz from the tail. A six node EQ with five shapes tunes the frequencies of the reverb, and the vector based interface is resizable with live displays for the threshold and EQ stages. Presets are named and categorised, covering subtle shaping, large spaces and gated slapbacks.

  Version 1.2 adds a choice of millisecond or tempo synced pre-delay, MIDI triggering for the volume manager and reverse effects, a visualizer for the wet signal, a brighter v2 hall reverb, a more natural de-esser with an adjustable range and an indicator showing when it is active, and light and dark modes.
specs: |-
  - Creative reverb plugin designed with KSHMR
  - Volume Manager with ducking threshold, fade in and gating
  - Tone Manager with attack smoothing and Tonal Reset
  - Special FX with reverse mode and octave harmony
  - Diffusion, Width, Length and Size controls
  - Modulation section
  - De-esser with adjustable range and active indicator
  - Six node EQ with five shapes
  - Millisecond or tempo synced pre-delay
  - MIDI input for triggering volume manager and reverse effects
  - Wet signal visualizer
  - v2 hall reverb algorithm
  - Light and dark modes
  - Resizable vector interface with live threshold and EQ displays
  - Categorised factory presets
  - Full PDF manual and tutorial video
  - Windows 10 or 11 or higher, 64 bit
  - macOS 10.15 or higher, 64 bit
  - AAX requires Pro Tools 12 or higher
  - Online activation required
