description: Noises is an experimental instrument designed by Hainbach to bring
  a vast world of noise into your music and audio production.
details: |-
  Noises is an experimental instrument with a playful and inspiring interface, designed to bring a vast world of noise into your music and audio production. It is the fourth plugin AudioThing developed together with German composer Hainbach, who crafted hundreds of recordings of rare vintage measurement and tape equipment, analog synths, strange field recordings, and electro-acoustic and magnetic field experiments in his lab.

  Used subtly, it adds coherence to your tracks. Used creatively, it can be the basis for whole tracks. It is a quick tool for sound design and for scoring film, games, and podcasts. Noises was used in the soundtrack for Alien: Romulus, composed by Benjamin Wallfisch.

  Noises came from the need to have a solid noise source always at hand for testing plugins. While talking with Hainbach, with whom AudioThing had just made Gong Amp, his wall of rare electronic laboratory equipment and its glowing noise generators turned a simple noise source into an instrument.

  At the heart of Noises is a big knob that acts as a precision crossfader between the eight sounds of each bank, carefully selected and designed by Hainbach. Inspired by the motor controls of test equipment and vintage multiplexers, a sequencer controls the knob: you can mute sounds, play sequences, randomize them, and make the movement jitter with the fuzzy control. Sync can follow the host or run free, with the Trigger button or any MIDI note starting and stopping playback.

  Noises is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP). It is also available on the App Store for iOS and iPadOS (AUv3 and Standalone).
specs: |-
  - 36 Noise Banks
  - 2+ GB of handcrafted samples
  - 159 Presets made by Hainbach
  - Multimode Filter and Bit Crusher
  - Trip Modulation
  - Resizable Window
  - Preset system with randomizer
  - Brightness and Contrast Controls
  - Windows 7 - 11, 2GHz CPU, 4 GB RAM (VST2, VST3, AAX, CLAP 64-bit)
  - macOS 10.13 - macOS 26, 2GHz CPU, 4 GB RAM, Universal 2 Binary (VST2, VST3, AU, AAX, CLAP 64-bit)
  - Ubuntu 20.04 LTS, 2GHz CPU, 4 GB RAM (VST2, VST3, CLAP 64-bit)
  - 1 license up to 3 computers, no iLok, no internet connection required to activate
