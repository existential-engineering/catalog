description: Spectron is a spectral delay made with the producer Curbi that uses spectral diffusion to give each frequency its own delayed path. Shift and Diffuse controls add spectral pitch shifting, frequency shifting, formant manipulation and reverb like spreading.
details: |-
  Spectron is a spectral delay made in collaboration with the electronic producer Curbi. Rather than repeating a signal as a whole, it uses spectral diffusion so that each frequency follows its own delayed path, layering audio across time and producing textures that range from shimmering to dark.

  The plugin is aimed at music production and at sound design equally, covering transitions, risers, ambient atmospheres and evolving soundscapes for film and games. Presets made by Curbi are included, usable as finished settings or as starting points.

  Global controls cover Dry / Wet for the balance between original and effected signal, Feedback for the number of repeats, Time and Type for delay time and sync options, and Spread, which adds width by separating delays spectrally across the left and right channels.

  The SHIFT control moves beyond standard delay processing into spectral pitch shifting, frequency shifting and formant manipulation, with the effect growing on each repeat. The DIFFUSE control spreads sound across time for rich reverb like results, and offers SHIMMER for an octave up sparkle, DOOM for an octave down plunge, and METAL and LUSH for metallic and chorus flavoured character.

  The interface is interactive and resizable, with real time monitoring that shows how sounds are being affected. An A/B option switches between two configurations, and a copy function with undo and redo allows settings to be explored without losing the original.
specs: |-
  - Spectral delay giving each frequency its own delayed path
  - Dry / Wet, Feedback, Time and Type global controls
  - Spread control separating delays across the left and right channels
  - SHIFT control for spectral pitch shifting, frequency shifting and formant manipulation
  - DIFFUSE control for reverb like spreading across time
  - Shimmer, Doom, Metal and Lush diffusion modes
  - Real time frequency spectrum monitoring
  - AB comparison with copy, undo and redo
  - Resizable interactive interface
  - Factory presets made by Curbi
  - PDF manual and tutorial video
  - Windows 10/11 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 12 or higher
  - Runs on both Intel and Apple Silicon CPUs, including native AAX
