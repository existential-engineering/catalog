description: Fosfat will add bite and oomph to your drums or percussion (or any
  percussive sounds). It follows the dynamics of the incoming sound and adds
  tonal and noise textures to it.
details: |-
  No drum deserves to be dull or lame. Fosfat will add bite and oomph to your drums or percussion (or any percussive sounds). It follows the dynamics of the incoming sound and adds tonal and noise textures to it. It works almost like an EQ in the way it shapes the sound, but it adds instead of cutting or boosting. It's perfect for when you have a nutrient deficient recording (lacking bass or attack in a kick drum for example), or if you just want to add some extra sub or pleasant stereo fizz to any percussive sound.

  In addition to the obvious option of using multiple instances of Fosfat across your drum tracks, the possibility to precisely dial in its trigger lets you pinpoint any frequency area or transient of your choice in recordings of whole drum kits or any drum loop sample. This gives you a very efficient and musical way of enhancing specific parts. Together with an oscillator, noise generator, low- and high-cut filters, stereo width, gain and more, you have a beat-fertilizing hothouse letting your percussive sounds really grow and bloom.

  Multiple visualizers makes it a breeze to dial in how the trigger should act. The sub oscillator will bring body to any kick drum, but thanks to the many options you may very well find it useful for all kinds of sounds. Pitch drop included.

  For additional bite, the noise oscillator is your friend, with envelope control, stereo width and filter. While Fosfat is really easy to configure from scratch, a bunch of presets are included to get you up and running in no time.
specs: |-
  - Multiple audio-visualizations makes dialing in accurate settings very easy
  - Controls for trigger frequency and width respectively
  - Sine wave oscillator with optional pitch drop
  - Noise with adjustable stereo width
  - Attack and release controls
  - Low cut and high cut filters
  - Four instances of volume control
  - Wave rendition
  - Preset collection
  - Input mix (v1.1)
  - Requires macOS 10.10 or later (optimized for the M1-processor), Windows 7 (SP1) or later, running a AU, VST or AAX compatible 64-bit host
  - iPad: AUv3 and standalone
