description: SEGA Megadrive/Genesis YM2612 FM chip emulator synthesizer combining authentic chip emulation with extended modern features for chiptune and contemporary music production.
details: |-
  FMDrive is an FM synthesis VST plugin that emulates the legendary YM2612 sound
  chip from the Sega Genesis/Megadrive console. It provides authentic 4-operator
  FM synthesis with parametric envelope generators, SSG-EG, LFO with AM and PM
  modulation, and CSM mode support.

  The plugin features CH3 Special Mode for varied operator frequencies and CH6
  DAC Mode for PCM sample playback at 8-bit or 4-bit depth with selectable
  sample rates of 22kHz, 11kHz, or 8kHz. Circuit bending and overdrive ladder
  effect controls add creative sound design possibilities.

  A software graphic envelope system supports up to 8 stages with custom loop
  points. The plugin offers full MIDI automation with learn functionality,
  polyphonic and monophonic modes with glide control, and VGM file support for
  import, export, and conversion.

  FMDrive is compatible with over 33,000 TFI presets and can control real
  hardware via MIDI through the GENMDM interface. Note that this is currently a
  legacy product available only as a 32-bit Windows VST, with a version 2.0
  update planned for native 64-bit and macOS support.
specs: |-
  - VST synth based on the Sega Genesis/Megadrive YM2612 FM sound chip
  - 4-operator FM synthesis with PCM, SSG-EG, Special & CSM mode
  - Optional Model 1 distortion (ladder effect) and circuit bending options
  - Import/export .tfi presets, emulator dumps and compatible HOOT dumped voices (PC88/X68000)
  - Full MIDI automation with MIDI learn, poly & mono mode with glide
  - Two audio models: HQ and MD1 (emulated distortion/low resolution)
  - Can control real Sega Genesis hardware via MIDI with Little Scale's GENMDM interface
  - Access to over 33,000 instrument presets extracted from game VGMs
  - System requirements: Windows XP/Vista/7 or newer, 32-bit VST host or 64-bit using a DAW bridge/JBridge, VST2.4
