details: |-
  Explore a world of submerged drones, ethereal textures, and ambient bliss with
  Bloom Synth Atmosphere - the first synth in the bloom series. Synth atmosphere
  combines phrases consisting of distant pads, dreamy arpeggios, liminal
  textures, and lush atmospheres for rich, immersive soundscapes.

  Excite audio's team of professional sound designers and producers created over
  250 presets organised into 7 different categories: drones (drn) - long,
  drawn-out, sustained drones; experimental (exp) - abstract, sound
  design-focused, unique creations; full atmospheres (fa) - complex ambient
  sequences consisting of drones, synths, melodic elements and noise; melodic
  (mld) - samples pitched across 2 octaves and are built from melodic elements
  only; rhythmic (rhy) - rhythmic, percussive and chopped ambiences; synths
  (syn) - synth and electronic-focused atmospheres with no organic textures;
  textures (tx) - noise-focused atmospheres to sit in the background of a track.

  Start in your desired tempo, choose a sample bank or preset, and trigger one
  of 14 bpm-synced samples spread across two octaves. White notes set off synth
  samples and loops, while black notes alter properties like playback speed and
  pitch and trigger sequences and effect modulation. Four powerful macros
  control a specialised chain of effects, fine-tuned to the diverse samples that
  form bloom synth atmosphere.

  The edit page is the central hub for refining and making the library of
  samples your own. Adjust start and end points, manipulate playback speed and
  direction, and tweak the timbre with pitch and formant controls. Make the
  bloom instrument your own with the ability to drag and drop audio files into
  it via the waveform view on the edit page or any empty slot on the banks page.

  Unlike traditional sequencers, the bloom sequencer is designed for triggering
  and layering one-shots and looping sequences, allowing for endless rhythmic
  creation. Bloom synth atmosphere offers three powerful effects modules: reverb
  to create space and depth using hall, plate and spring algorithms from the
  lifeline series; delay to create hypnotic patterns and echos; and noise to
  layer textures that react to the volume envelope of your samples.
