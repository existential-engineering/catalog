description: Mixcraft is the renowned digital audio workstation for Windows from
  Acoustica, designed for musicians by musicians. With its unique combination of
  ease of use and professional features at an irresistible price, Mixcraft has
  been a favorite among music enthusiasts and professionals since its
  introduction in 2004.
details: |-
  Mixcraft 10 Pro Studio is the premium edition of Acoustica's DAW, featuring
  all Recording Studio capabilities plus exclusive advanced tools. It includes
  24 virtual instruments and over 50 effects, with premium instruments from
  Cherry Audio including the DCO-106 and Glass Viper.

  Pro Studio's standout feature is AI-powered Stem Separation, which isolates
  vocals, drums, and instruments from mixed audio into separate tracks. Track
  Regions allow selecting, moving, and pasting multiple clips and automation as
  grouped sections. Advanced MIDI and audio output recording and routing enables
  complex signal flow between plugins.

  The edition includes mixdown export to stems, audio-to-MIDI conversion, and
  all the professional features from Recording Studio such as Celemony Melodyne
  5 Essential, ReWire hosting, and comprehensive automation tools.

  Rent-to-own plans are available starting at $8/month, and a loyalty credits
  reward program provides points for Mixcraft Store purchases.
specs: |-
  - Unlimited audio and MIDI tracks
  - 24 virtual instruments including Cherry Audio DCO-106 and Glass Viper
  - 50+ effects
  - AI-powered Stem Separation (requires AVX x86 instruction support)
  - Track Regions for grouped clip management
  - Advanced MIDI/audio routing between plugins
  - Mixdown export to stems
  - Audio-to-MIDI conversion
  - Celemony Melodyne 5 Essential (requires Windows 10+)
  - All Recording Studio features included
  - Per-track parametric EQ and oscilloscope
  - Master Tempo Envelope
  - Custom hotkey assignments
  - ReWire hosting
  - Requires 64-bit Windows 7 SP1, 8, 10, or 11
  - Minimum: 4GB RAM, 1.8 GHz Dual Core CPU
  - Recommended: Windows 10+, 8GB+ RAM, 3.0 GHz Quad Core+ CPU
