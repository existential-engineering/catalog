description: Infuse your music with more passion than ever before with the
  best-sounding, most alive string legato sound available today.
details: |-
  Infuse your music with more passion than ever before with the best-sounding, most alive string legato sound available today. Ushering in the next generation of highly-detailed string legatos, Spitfire Appassionata Strings has been recorded using our new "Impulse Legato" technique – the culmination of years of intensive research and development at Spitfire Audio HQ. Delivering flowing and emotive lines, these new legatos offer perfectly balanced vibrato, enabling composers to intuitively write in a beautiful, soaring melodic style in stunning detail.

  Referencing the aesthetic of classic melodies from the scores of composers like John Williams and Thomas Newman, this medium-sized string band (8,6,6,6,4) delivers a highly sought-after style of performance, with stunningly-realistic rebowing. Crafted from years of sampling experience, Spitfire Appassionata Strings is your ultimate companion for writing with intention, emotion and – most of all – passion.
specs: |-
  - 30 top London string players in an 8,6,6,6,4 string band
  - 5 discrete dynamic levels (pp, mp, mf, f, ff) with 4 round robin Impulse Attacks
  - 11 professional signals: 7 mic positions (Close, Tree, Ambient, Outrigger, Close Ribbons, Stereo Room, Mids) and 4 mixes
  - Recorded at Lyndhurst Hall, AIR Studios, through Neve Montserrat pre-amps into a Neve 88R desk
  - Recorded digitally at 96k via 2" Studer tape
  - 82.4 GB download size
  - 82.40 GB disk space required during install
  - Spitfire Audio App required
