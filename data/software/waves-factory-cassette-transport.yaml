details: |-
  Cassette Transport is a free audio plugin effect that simulates the sound of tape speeding up and slowing down.

  It also includes noises from the physical buttons and rotor of a real cassette unit. It is the free counterpart to Wavesfactory's paid Cassette plugin.
specs: |-
  - Simulates the sound of tape speeding up and slowing down
  - Includes noises from the physical buttons and rotor of a real cassette unit
  - macOS and Windows, 64 bit only
  - Formats: VST, VST3, AAX, Audio Units (AU)
  - Compatible with all major DAWs like Logic, Pro Tools, Ableton Live, Reaper, FL Studio, Cubase, Nuendo, Studio One and Bitwig
  - Free download, delivered by email
