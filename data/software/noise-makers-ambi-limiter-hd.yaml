details: |-
  Ambi Limiter HD is a peak limiter dedicated to ambisonic signals up to order 3
  (16 audio channels). It allows to control precisely the output peak level,
  while always preserving the 3d spatial image.

  The plugin offers release time up to 1000 ms, and look-ahead up to 40 ms, to
  avoid distortion and ensure peak limiting with optimal transparency.

  Providing input gain up to 60db, controllable output level, and
  sample-accurate channel linking, ambi limiter hd is an ideal tool for level
  maximization of ambisonic tracks.

  Peak limiting can be crucial before exporting ambix to samsung vr, youtube
  360, facebook and other 360 video platforms. Ensuring a maximum peak level of
  -6db should save ambisonic mixes from clipping on all target platforms.
specs: |-
  - Peak limiter for ambisonic signals up to order 3 (16 audio channels)
  - Release time up to 1000 ms
  - Look-ahead up to 40 ms
  - Input gain up to 60 dB
  - Controllable output level
  - Sample-accurate channel linking
  - Output max peak level (-10 to +10 dB)
  - Input/output: ambix (order 1, 2 or 3)
