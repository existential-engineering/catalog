description: PSP PianoVerb is a freeware plug-in which reproduces a special kind of reverberation originally provided by piano strings. Generates reverberation using twelve string operators tuned to notes from A (55Hz) to G# (103.8Hz) with adjustable damping and decay time. The string system can be transposed ±24 semitones and tuned within ±100 cents. Lower transpositions produce bigger, less resonant sounds similar to traditional reverbs; higher transpositions produce bright harp-like effects.
details: |-
  PSP PianoVerb is a freeware piano string reverb plugin available with a free PSP Audioware user area account. Twelve string operators each tuned to notes from A (55Hz) to G# (103.8Hz). Adjustable damping and decay time per operator. Transposable +-24 semitones with fine-tuning within +-100 cents and detuning control.
specs: |-
  - 12 string operators tuned A (55Hz) to G# (103.8Hz)
  - Adjustable damping per string operator
  - Adjustable decay time per string operator
  - Transposition range: +-24 semitones
  - Fine-tuning range: +-100 cents
  - Detuning control
  - Windows: 7-11 (64-bit)
  - macOS: 10.12-15 Sequoia (Intel and Apple Silicon)
