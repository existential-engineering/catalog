description: PSP PianoVerb is a freeware plug-in which reproduces a special kind of reverberation originally provided by piano strings. Generates reverberation using twelve string operators tuned to notes from A (55Hz) to G# (103.8Hz) with adjustable damping and decay time. The string system can be transposed ±24 semitones and tuned within ±100 cents. Lower transpositions produce bigger, less resonant sounds similar to traditional reverbs, while higher transpositions produce bright harp-like effects.
details: |-
  PSP PianoVerb is a freeware plug-in which reproduces a special kind of reverberation originally provided by piano strings. It generates reverberation using twelve string operators with adjustable damping and decay time. Each of them is tuned to a particular note starting from A(55Hz) to a G#(103.8Hz). The PSP PianoVerb string system can be transposed in the range of +-24 semitones, tuned within a range of +-100 cents and be detuned as well. Transposing to lower octaves produces a bigger and less resonant sound similar to traditional reverbs, while in turn transposing to higher octaves produces a very bright harp-like effect.

  PSP PianoVerb is available free of charge.
specs: |-
  - Reproduces the reverberation originally provided by piano strings
  - Twelve string operators with adjustable damping and decay time
  - Each string operator tuned to a particular note, from A (55Hz) to G# (103.8Hz)
  - String system transposable in a range of +/-24 semitones
  - Tuning within a range of +/-100 cents, with detuning available
  - Transposing to lower octaves gives a bigger, less resonant sound similar to traditional reverbs
  - Transposing to higher octaves gives a very bright harp-like effect
  - Windows 7 to Windows 11 (VST, VST3, AAX for Pro Tools)
  - macOS 10.12 to macOS 15 Sequoia, Intel and Apple Silicon (AudioUnit, VST, VST3, AAX for Pro Tools)
