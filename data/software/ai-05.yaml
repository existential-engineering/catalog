details: >-
  Ai-05 is a kontakt 5 based sample library inspired by korg 05r/w ai synthesis
  module. The included presets are custom sounds that are mostly ambient,
  new-age and synth pad oriented.


  The gui is based on the new ai-30 v2 engine with some minor aesthetic
  improvements and some advanced features. Up to 4 different elements sounds can
  be layered together to create complex and expressive multisounds.


  Each of the sound elements can be fully edited using the various control
  parameters in a compact user interface.


  The multisampled sounds have been recorded at 96khz 24-bit resolution and
  downgraded to 48khz. Post editing process and looping are done carefully on
  each sample individually.
specs: |-
  - Kontakt 5 based sample library
  - 40 sounds
  - Inspired by ai synthesis module korg 05r/w
  - 4 filter types
  - 4 modulation generators lfo
  - Various editing parameters
  - Chorus, flanger, phaser, reverb & delay effects
  - Mono/poly mode
  - Portamento
  - Multi-sampled sounds at 48khz 24-bit
  - Total size is 1.29 gb (1.88 gb before .ncw compression)
  - 521 wave samples
  - 100 user snapshots
  - Up to 4 different elements sounds can be layered together
  - Compact user interface
