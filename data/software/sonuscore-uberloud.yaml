description: UBERLOUD makes your sounds go loud, insanely loud. This plug-in is a true beast with sharp edges and extraordinary character — a loudness maximizer with dynamic processing, a clipper for harmonics, and an integrated denoiser for floor noise reduction.
details: |-
  UBERLOUD is a loudness plug-in designed to make sounds shine through a mix in the simplest possible way. One to three knobs push the signal, a clipper adds harmonics, and a denoiser removes floor noise that would otherwise be raised along with everything else. That denoiser makes it a useful option for voice overs and guitar solos, where pushing level normally brings the noise floor up with it.

  Rather than relying on layers of heavily compressed and distorted material to make a sound big, BOOM developed a dynamic approach using high-end algorithms behind an easy-to-use interface, aiming for quick and maximum results. With just one knob per band, UBERLOUD pushes a sound to a greater perceived loudness in a few clicks.

  The plug-in is a dynamic single and multi-band processor: up to three bands can be controlled separately, and three different character types tame or sharpen its behaviour. Listed use cases are adding power and volume to a mix, giving specific sounds the space they need, and making material very loud so it cuts through.

  The 1.1 feature update added Wet and Dry gain controls for more precise control over how hard the signal is hit, plus a new button for easy soft bypass. UBERLOUD requires an audio host and does not work as a standalone application.
specs: |-
  - Dynamic single and multi-band processor, controlling up to three bands separately
  - One knob per band to dial in the impact on perceived loudness
  - 3 different character types
  - Clipper adds harmonics
  - Denoiser removes floor noise raised by the loudness processing
  - Version 1.1 update adds Wet and Dry gain controls and a soft bypass button
  - Format: Software Plugin (VST 3, AU, AAX) for Windows and Mac
  - Requires an audio host; does not work as a standalone application
  - Officially works with Logic Pro, Pro Tools (11+), Cubase, Nuendo, Ableton Live and Reaper
  - Required hard disk space: 96 MB
  - Available as: Download
  - Windows 8 (64-bit), 8 GB RAM, Intel Core i5 or similar
  - macOS 10.13 (64-bit), 8 GB RAM, Apple Silicon or Intel Core i5
  - Requires a free iLok account; machine license activation and USB dongle licensing available
  - A 14-day free trial version is offered alongside the full version
