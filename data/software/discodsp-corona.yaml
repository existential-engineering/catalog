description: Hybrid synthesizer combining virtual analog and wavetable synthesis
  with three VA/WAVE oscillators, 16 oscillator combine modes including bitwise
  AND/OR/XOR, Super 7 and Super 7+ unison modeled on the Roland JP-8000/JP-8080,
  dual zero-delay feedback filters with 14 types, MPE support with per-note
  pitch bend, pressure and timbre, an 8x oversampling engine, a 32-step
  arpeggiator with a sequencer mode, an 8-destination modulation matrix, custom
  SF2/WAV oscillator import, Scala tuning and MTS-ESP support, and Synth1 (.sy1)
  and JP-8000/JP-8080 SysEx preset import.
details: |-
  Corona is a hybrid synthesizer combining virtual analog and wavetable synthesis engines. It features three VA/WAVE oscillators with 16 combine modes including additive, subtractive, multiplicative, sync, ring modulation, phase modulation, and bitwise AND/OR/XOR operations.

  The synthesizer includes a Super 7 unison mode modeled on the Roland JP-8080, dual zero-delay feedback (ZDF) filters with 14 filter types available in 2-pole and 4-pole versions. Filter shapes include tanh, poly, asym1/2/3, hardlimit, polywrap, asymwrap, quantize, and asymquantize, with bipolar drive, keytracking, and pre/post volume envelope routing.

  Modulation capabilities include 4 LFOs, 3 ADSR envelopes, and an 8-destination modulation matrix with 30 modulation presets. A 32-step arpeggiator is also included for rhythmic pattern generation.

  Corona supports custom SF2 and WAV oscillator import and ships with a 300+ MB wave expansion library containing hardware waveforms sampled from Minimoog, Prophet 5, Moog, Korg, Roland, Buchla, and ARP synthesizers. It also supports Synth1 and JP-8000/8080 preset import.
specs: |-
  - Three VA/WAVE hybrid oscillators with 16 combine modes
  - Super 7 unison mode modeled on Roland JP-8080
  - Dual zero-delay feedback (ZDF) filters with 14 types in 2-pole and 4-pole versions
  - 4 LFOs and 3 ADSR envelopes
  - 8-destination modulation matrix with 30 modulation presets
  - 32-step arpeggiator
  - Custom SF2/WAV oscillator import
  - 300+ MB wave expansion library with hardware waveforms
  - Synth1 and JP-8000/8080 preset import
  - Windows 10+ (AVX2), macOS 10.14+ (Apple Silicon & Intel), Linux Debian 10+ (AVX2)
  - Minimum 8 GB RAM
