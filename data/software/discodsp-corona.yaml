description: "VA and Wave synthesizer blending Virtual Analog and Wave Synthesis
  with three VA/WAVE oscillators, Roland JP8080 modeled Super 7 unison, 16
  oscillator combine modes, 32-step arpeggiator, and dual zero-delay feedback
  filters."
details: |-
  3 VA/WAVE oscillators with 16 combine modes

  14 filter types (2-pole and 4-pole) with zero-delay feedback

  4 LFOs, 3 ADSR envelopes, 8-destination modulation matrix

  Distortion, chorus, reverb, delay

  300+ MB waveform library

  Synth1 (.sy1) and Roland JP-8000/8080 SysEx
