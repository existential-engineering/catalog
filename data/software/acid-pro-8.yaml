details: |-
  Acid pro 8 is the creative DAW for all music producers. Behind its slick new interface lies a powerful, 64-bit music production powerhouse. It combines acid's famous easy workflow with pro-level features, over $1000 worth of new instruments and effects, and 9 gb of all-new acidized loops.

  Acid has a world-class, 20-year heritage and, with vst3 support coming soon in a free update, acid pro 8 is very much the creative DAW for today's forward-thinking artists.

  Acid pro allows so many aspects of each project to easily and quickly be edited. The controls are so natural to get the hang of, and an interactive tutorial is always available to show how any particular process is completed.

  Acid pro enables MIDI automation editing by activating a specific envelope and adjusting the parameters with a mouse on the soft synth property screen.
specs: |-
  - 64-bit technology
  - VST plugin host
  - Vst3 support coming soon in free update
  - Flexible multitrack recording
  - Advanced MIDI editing
  - Advanced audio editing
  - Loop-based composition
  - MIDI automation
  - Soft synth property screen
