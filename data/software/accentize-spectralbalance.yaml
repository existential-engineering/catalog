description: Dialogue EQ for ADR and Post Production. The plugin's intelligent
  EQ automatically matches speech tone. Ideal for ADR, voice replacement and
  tonal consistency.
details: |-
  SpectralBalance is an intelligent matching EQ plugin designed specifically for
  dialogue recordings. It analyzes the spectral characteristics of a reference
  and automatically shapes the EQ of the input signal to match, making it ideal
  for ADR, voice replacement, and tonal consistency across takes.

  Whether working in real time or in post-production, SpectralBalance adapts its
  EQ curve to correct spectral imbalances and unify the tone of spoken content.
  With its efficient, one-click workflow and support for custom reference
  profiles, it's a powerful time-saving tool for audio professionals dealing
  with diverse dialogue sources.

  Compatible with Pro Tools, Cubase, Reaper, Ableton Live, Logic Pro, Adobe
  Premiere, Final Cut, and DaVinci Resolve.
