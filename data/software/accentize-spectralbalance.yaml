description: SpectralBalance is an intelligent matching EQ plugin for dialogue, automatically shaping a signal's tone to match a reference for ADR, voice replacement, and consistency across takes.
details: |-
  SpectralBalance analyzes the spectral characteristics of a reference recording and automatically shapes the EQ of the input signal to match, correcting spectral imbalances and unifying the tone of spoken content across takes.

  Dynamic Mode continuously re-analyzes and adapts the EQ curve in real time, and custom reference profiles can be saved for recurring ADR and voice-replacement work. The plugin uses optimized neural network models to keep CPU overhead low.

  Compatible with Pro Tools, Cubase, Reaper, Ableton Live, Logic Pro, Adobe Premiere, Final Cut, and DaVinci Resolve.
