details: |-
  BLEASS Chorus is a two-stage Chorus effect that offers full control of the
  stereo image as well as a large range of effects, from subtle stereo wideners
  to crazy texture generators which you can visualize thanks to a dedicated
  oscilloscope with a very low CPU usage.

  Have full control of the stereo image as well as all effect parameters in a
  one-screen, clean and responsive interface that goes beyond traditional
  chorusing, giving more creative freedom to sound designers and music
  producers.

  Inspired by classic chorus pedals and rack effect units, ideal for thickening
  synth and guitar lines, bleass chorus comes packed with a wide range of
  presets.

  Input stage features low-shelf/high-pass input filter and input gain controls.

  Chorus stage includes delay lines, time, rate, left depth, right depth, equal
  depths toggle, offset, width, feedback, and oscilloscope visualization of
  delay lines' lfos.
specs: |-
  - Two-stage Chorus effect
  - Stereo image control
  - Low-shelf/high-pass input filter
  - Input gain
  - Delay lines
  - LFO rate control
  - Left depth control
  - Right depth control
  - Equal depths toggle
  - Offset control
  - Width control
  - Feedback control
  - Oscilloscope visualization
  - Dry/wet mix
  - macOS 10.9 and later (64-bit only)
  - macOS 11 big sur support
  - M1 processor support
  - Low CPU usage
