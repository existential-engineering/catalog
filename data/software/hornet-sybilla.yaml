details: |-
  Sibilance, those sharp, piercing "s", "sh" and "t" sounds, can be one of the most challenging aspects of audio mixing, particularly when it comes to vocals. These frequencies, while important to the clarity of speech and singing, can often become too pronounced in a mix, causing discomfort for the listener. De-essing is a crucial step in addressing this issue, and Sybilla is here to make it effortless and highly musical.

  Sybilla is an intelligent de-esser designed with the sole purpose of reducing sibilance quickly, smoothly, and transparently. Unlike traditional de-essers that rely on broad, static frequency bands, Sybilla employs a unique and intelligent approach to tackle sibilance where it matters most: across multiple frequency ranges.

  At the heart of Sybilla is its sophisticated band-splitting technology, which divides the incoming signal into eight different frequency bands. These bands are specifically tuned to focus on the frequency ranges most associated with sibilance, typically the sharp "s" and "sh" sounds that occur in the 5kHz to 10kHz range. After splitting the signal, Sybilla uses VCA-modelled compression to smooth out any excess sibilant energy, driven by an envelope follower that is particularly well-suited for speech and vocal performance.

  One of the most striking features of Sybilla is its simplicity. The plugin is designed with just two main knobs. The Amount control dials in how much de-essing you want, and the Mix control blends the processed signal with the dry, unprocessed signal, giving full control over how transparent or aggressive the de-essing process is.

  Sybilla is designed to intuitively and dynamically detect the most problematic sibilant frequencies in the signal, so there is no need to manually sweep through frequencies to find the sibilance sweet spot. It excels at reducing sibilance in vocals, but is not limited to that: podcasts, interviews, radio broadcasts, guitar performances with aggressive picking and cymbal-heavy drum tracks can all benefit from its transparent approach to frequency control.
