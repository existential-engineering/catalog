description: HoRNet Sybilla is an "intelligent de-esser" that automatically finds the right sibilant frequencies and reduces them.
details: |-
  Sybilla is an intelligent de-esser designed to reduce sibilance quickly, smoothly and transparently. Rather than relying on broad, static frequency bands, it tackles sibilance across multiple frequency ranges.

  At the heart of Sybilla is its band-splitting technology, which divides the incoming signal into eight different frequency bands tuned to the ranges most associated with sibilance, typically the sharp s and sh sounds in the 5kHz to 10kHz range. Breaking the signal into these distinct bands lets Sybilla target problematic frequencies without affecting the natural tone of the rest of the sound.

  After splitting the signal, Sybilla uses VCA-modelled compression to smooth out excess sibilant energy, driven by an envelope follower well suited to speech and vocal performance so that only the peaks in sibilance are reduced. The result is a reduction of harsh sibilance without distortion or loss of the natural characteristics of the voice.

  The plugin is designed with just two main knobs. The Amount control sets how much de-essing is applied, and the Mix control blends the processed signal with the dry, unprocessed one. Automatic frequency detection targets the most problematic sibilant frequencies dynamically, so there is no need to sweep manually for the sibilance sweet spot.
specs: |-
  - Automatic de-essing
  - Adjustable effect amount
  - 8 different detection filters
  - On/off switches for each of the 8 filters
  - Effective de-essing regardless of signal level
  - Dry/wet knob
  - macOS (10.11 and later) and Windows (Vista and later) support
  - Apple Silicon native support (except for AAX)
  - 64-bit only both on Mac and Windows
  - Audio Units, VST2.4, VST3 and AAX format
  - No copy protection
