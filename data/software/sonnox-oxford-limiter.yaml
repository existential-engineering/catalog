description: Craft stunning masters that deliver maximum loudness, density and presence. The Oxford Limiter has been designed to combat this problem, enabling loud mixes to maintain their punch and clarity.
details: |-
  Enhance function that boosts perceived loudness and detail while preserving clarity. True Peak limiting with inter-sample clipping protection for streaming and broadcast compliance. Enhanced Transient Control maintaining punch and clarity at aggressive limiting levels. Proprietary DSP technology delivering low CPU usage. AAX-DSP support for Pro Tools Ultimate, HD, and Avid VENUE hardware acceleration.
