description: Oxford Limiter controls peak levels while preserving detail and dynamics. It adds an Enhance section for perceived loudness, True Peak limiting to catch inter-sample overs for streaming and broadcast delivery, and Enhanced Transient Control to keep fast attacks intact.
details: |-
  The Oxford Limiter is a mastering limiter built to control peak levels without distortion or artifacts, preserving the detail and dynamics of the material. It is built on Sonnox's proprietary DSP technology and runs at low CPU usage.

  The Enhance section raises the perceived loudness of a track, adding a final polish without dulling the sound.

  The built-in True Peak limiting ensures masters remain safe from inter-sample overs, a must for streaming platforms and broadcast compliance, while Enhanced Transient Control keeps fast attacks tight and impactful, maintaining punch and clarity even at aggressive levels. Oxford Limiter is ideal for mastering but also works on individual tracks or buses, adding punch to drums, bringing vocals forward, or giving an entire mix a polished finish.
specs: |-
  - Enhance section boosts perceived loudness and detail while preserving clarity
  - Inter-sample clipping protection via built-in True Peak limiting
  - Enhanced Transient Control preserves fast attacks, punch and clarity at aggressive levels
  - Proprietary Sonnox DSP technology for low CPU usage
  - Available in Native and AAX-DSP variants
  - AAX-Native supports Pro Tools 11 or later
  - AAX-DSP supports Pro Tools Ultimate, Pro Tools HD, or Avid VENUE systems
  - macOS 10.13 High Sierra or later
  - Windows 10 (64-bit) or later
  - Each licence includes two simultaneous activations
  - Authorisation with a free iLok account: Local Machine, iLok2/iLok3 USB device, or iLok Cloud (one activation max on iLok Cloud)
  - AAX-DSP instances per chip, mono (full): 6 at 44.1/48 kHz, 4 at 88.2/96 kHz, 1 at 176.4/192 kHz
  - AAX-DSP instances per chip, mono (no recon): 15 at 44.1/48 kHz, 7 at 88.2/96 kHz, 3 at 176.4/192 kHz
  - AAX-DSP instances per chip, stereo (full): 5 at 44.1/48 kHz, 2 at 88.2/96 kHz, 1 at 176.4/192 kHz
  - AAX-DSP instances per chip, stereo (no recon): 11 at 44.1/48 kHz, 5 at 88.2/96 kHz, 2 at 176.4/192 kHz
  - Free trial available
  - Instant digital download with 14-day money back guarantee
