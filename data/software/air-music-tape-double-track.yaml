description: A vintage-inspired effect plugin that recreates 1960s automatic
  double tracking techniques using tape delay, varispeed, and modulation for
  authentic doubled performances.
details: |-
  Tape Double Track is a faithful recreation of a classic 1960s automatic double tracking (ADT) effect, designed to create the illusion of double-tracked performances using tape delay, varispeed, and modulation techniques. The plugin combines vintage tape character with modern digital control, offering a flexible production tool that works across multiple genres.

  The plugin provides advanced modulation capabilities, allowing users to sculpt doubled tracks with sine, triangle, or random modulation shapes. Users can adjust warp settings to create everything from smooth vintage wobbles to experimental textures, enabling tracks to breathe and shift naturally with organic variation.

  Tape Double Track offers comprehensive channel control, including independent adjustments for pan, drive, mute, phase, and level for source and double-tracked channels. It features dedicated bass mono and solo bass modes to help maintain mix balance and control low-end frequencies.

  The plugin is versatile and can be used on various audio sources including vocals, guitars, synths, and other instruments. It provides authentic double-tracking effects ranging from gentle chorusing to classic doubling and more experimental sound manipulations.
