description: The HoRNet DeeLay is a digital good-sounding dub delay with a vintage character. Great for classic delay duties and creative tasks.
details: |-
  HoRNet DeeLay is a creative and character-rich vintage digital dub delay plugin designed to go far beyond the ordinary. Whether you’re looking to add a classic echo, build otherworldly textures, or craft intricate rhythmic effects, DeeLay offers the perfect blend of simplicity, musicality, and unpredictability. It’s not just another delay plugin—it’s a creative playground for modern producers who love the raw edge of early digital effects.

  While modern delays strive for precision and transparency, HoRNet DeeLay celebrates the quirky charm of early 90s digital hardware. Those early digital devices were imperfect by today’s standards, but their limitations gave them a sound that producers have grown to love—gritty, glitchy, and full of character. DeeLay captures that spirit and brings it into your DAW with one click.

  Engage the “Vintage” button, and the plugin simulates the 12-bit digital resolution found in early digital delay units. This intentional bit degradation gives your audio a gritty texture and adds subtle distortion artifacts, enhancing the sense of space and depth. But digital gear wasn’t purely digital—most had analog front-ends, so this mode also introduces analog-style saturation for warmth and punch.

  This combination of bit reduction and saturation recreates a sonic palette that’s ideal for dub, techno, lo-fi, or any genre that thrives on color and imperfection.
specs: |-
  - Delay time up to 5000ms
  - Sync mode from 1/16th to 1bar
  - Capable of endless delay generation
  - LFO from 0.1Hz to 10Hz
  - Time modulation
  - Vintage mode with 12bit ADC emulation
  - Feedback panning per channel
  - Output panning per channel
  - 15 factory presets
  - macOS (10.11 and later) and Windows (Vista and later) support
  - 64bit only on both on Mac and Windows
  - Apple Silicon native support (except for AAX)
  - Audio Units VST2.4, VST3 and AAX format
