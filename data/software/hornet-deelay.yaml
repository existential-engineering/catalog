description: The HoRNet DeeLay is a digital good-sounding dub delay with a vintage character. Great for classic delay duties and creative tasks.
details: |-
  HoRNet DeeLay is a creative and character-rich vintage digital dub delay plugin designed to go far beyond the ordinary. Whether you're looking to add a classic echo, build otherworldly textures, or craft intricate rhythmic effects, DeeLay offers a blend of simplicity, musicality, and unpredictability for producers who love the raw edge of early digital effects.

  While modern delays strive for precision and transparency, HoRNet DeeLay celebrates the quirky charm of early 90s digital hardware. Engaging the Vintage button simulates the 12-bit digital resolution found in early digital delay units, giving audio a gritty texture and subtle distortion artifacts. Because most of that gear had analog front-ends, the mode also introduces analog-style saturation for warmth and punch, recreating a palette suited to dub, techno and lo-fi.

  One of DeeLay's most powerful features is its delay time modulation. Unlike analog-style delays that interpolate time changes smoothly, digital delays shift pitch abruptly when delay time changes, producing robotic glitches, pitch jumps and unexpected artifacts. Delay time can be modulated with an internal LFO for wobbling, stuttering and detuned delay effects that add motion and texture.

  Set the feedback to 100% and DeeLay enters endless loop mode, where the delay never fades out, ideal for building textures, layering rhythms or exploring how far a single sound can go. Changing the delay time during these infinite loops also changes the pitch of the loop, a tool for live performance and experimental production. With the LFO modulating time, lower feedback settings still yield organic distortions, shimmering repitches and chaotic evolving effects.

  Despite its sonic possibilities, DeeLay keeps a simple and intuitive interface with clear control over delay time (in milliseconds or synced to DAW tempo), feedback, LFO depth and rate, and vintage mode. It stays automation-friendly with light CPU usage and a high-fidelity signal path when vintage mode is off, so lo-fi grit and hi-fi clarity can be blended as needed.
specs: |-
  - Delay time up to 5000ms
  - Sync mode from 1/16th to 1 bar
  - Capable of endless delay generation
  - LFO from 0.1Hz to 10Hz
  - Time modulation
  - Vintage mode with 12bit ADC emulation
  - Feedback panning per channel
  - Output panning per channel
  - 15 factory presets
  - macOS (10.11 and later) and Windows (Vista and later) support
  - 64bit only on both Mac and Windows
  - Apple Silicon native support (except for AAX)
  - Audio Units, VST2.4, VST3 and AAX format
  - No copy protection
