details: |-
  Acid v channels the cult-classic bass synth that pushed the underground into overdrive. Pump your mixes full of reactive ever-evolving bass grooves, unleash mutated sequences fizzing with distortion, and experiment with extra features for revitalized rave energy.

  Acid v is all about movement; instantly spawn jagged polymetric sequences, hypnotic scale-based patterns, and endless sonic mutations. Steer the 303 sound into experimental territory with upgraded features & effects delivering sounds far darker, deeper, and more impactful than the original.

  Get deeper and more deranged bassline sounds with a 2-octave range sub oscillator and vibrato that goes from slow detune to audio rate. The 303 sound is so synonymous with distortion that you can't have one without the other. We included 14 algorithms to satisfy every crunchy craving.

  Acid v features the fast, musical, advanced sequencer 303 fans have always wanted; you can even bounce its unique patterns to MIDI for use with clips and other instruments. Alter your sequence's dna and create fresh patterns in one click with transmutation, and lock into musical scales specially curated with modern styles in mind.

  Create evolving movements & vivid sonic coloration without leaving acid v's interface; 3 modulators, 4 fx slots, and 17 fx algorithms for next-gen acid sound.
specs: |-
