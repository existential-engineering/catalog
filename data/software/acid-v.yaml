  - 14 distortion algorithms
  - Advanced sequencer with MIDI bounce
  - Transmutation (pattern mutation)
  - Scale-based pattern generation
  - Polymetric controls
  - 3 modulators
  - 4 fx slots
  - 17 fx algorithms
  - Analog fine-tuning
  - Sequencing and arpeggiation
