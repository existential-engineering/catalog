  - Morph pad
  - Polyphonic analog synthesizer
  - Vacuum tube circuit modeling
  - Four analog oscillators
  - Multiple filters and envelopes
  - Built-in audio effects
  - Subtractive synthesis
  - Six virtual vacuum tube circuits
  - 300 pro-grade presets
  - Windows 10, 8, Windows 7 service pack 1
  - Dual core 2ghz processor minimum
  - 4gb RAM minimum
  - 200mb free hard drive space
  - Mac OS X 10.8.5-10.15
  - Core duo processor
  - Logic Pro x compatible
  - Protools 10.3, 11.x, 12, 2020 compatible
