details: |-
  The AIR Essential Synths Pack includes three powerhouse synths in one bundle: loom 2 is an award-winning modular additive synthesizer with a shape-shifting morph pad that makes it easy to create rich, swirling and captivating sounds.

  Loom ii builds on the original loom with unique and powerful new features as requested by loyal users.

  The riser is an instrument for designing musical transitions of epic proportions. A powerful, synth-based instrument, the riser features all of the tools you need to compose heart-stopping transitions in one intuitive user-interface. In seconds, you can construct rises, falls, swells, fades, and more, based on our coveted sound synthesis technology.

  For instant inspiration, the riser includes 300 pro-grade presets that you can edit, deconstruct, copy, mangle, and implement into your tracks.

  Vacuum pro is a polyphonic analog synthesizer with vacuum tube circuit modeling that perfectly captures the crunchy, warm sound of the analog era. With four analog oscillators, multiple filters and envelopes, and built-in audio effects, vacuum pro lets you dive deep into subtractive synthesis to recreate those sought-after analog sounds from the 70s and 80s.
