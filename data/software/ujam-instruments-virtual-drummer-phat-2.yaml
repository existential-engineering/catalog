description: Virtual Drummer PHAT is a slick and funky Hip-hop operator, producing grooves, fills and breaks straight from the street to your DAW.
details: |-
  Virtual Drummer PHAT is a go-to ace for grooving funky and urban drumming. For all genres from Retro Soul to G-Funk, PHAT adds a smooth rhythm fundament to a production with its wide range of drumming styles and sounds.

  PHAT is versatile, coming with 30 musical styles containing a total of 720 different rhythmical phrases that can be woven and stitched together. The sound moves from smooth and soulful to huge and pumping by combining any of the 5 different drum kits with 6 accessible character presets.

  The very gentle learning curve, a trademark of all UJAM Instruments plug-ins, means beginners and professionals can quickly lay down beats with no previous drumming experience. Patterns export to the DAW by dragging them from the on-screen keyboard and dropping them into a track.

  Instruments from up to four different types can be mixed and matched to build a custom kit, with individual volume controls for each element such as kick drum and snare. The performance itself is tweaked with simple controls for swing, feel and how human the final performance sounds.
specs: |-
  - 30 styles with 720 rhythmical phrases in total
  - 5 drum kits and 6 mix/character presets
  - PHAT 2 adds 30 new styles with 650 new grooves plus 100 presets
  - Drag-and-drop phrases to the DAW for detailed note editing
  - Multi-outs for individual mixing in the DAW
  - Advanced kit editing, mixing and master sections
  - Swing, feel and humanize controls
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Windows: Windows 10 to Windows 11
  - Mac: macOS Catalina (10.15) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 4 GB of RAM
  - 0.5 GB of disk space
  - 1280x768px display, internet connection
  - Delivery: automated installation via UJAM App, or downloadable installer file
  - Authorization via the UJAM App, or email and password within the plug-in
  - Supported standards: MIDI
