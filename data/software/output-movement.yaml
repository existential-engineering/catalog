details: |-
  Movement is a powerful rhythm FX engine that transforms any instrument, synth, raw sound or full track in real time. Add extreme effects to any input in real time, in the studio or on the stage.

  With four rhythm engines — Flux, Sidechain, LFO, and Step Sequencer — Movement gives you 76 modulatable parameters to shape your sound. The XY pad provides real-time parameter tweaking for expressive control.

  Built-in effects include reverb, compression, analog-modeled filters, EQ, delay morphing, and tube distortion.
specs: |-
  - 300+ presets
  - 76 modulatable parameters
  - 4 rhythm engines: Flux, Sidechain, LFO, Step Sequencer
  - XY pad for real-time parameter tweaking
  - Reverb, compression, analog-modeled filters
  - EQ, delay morphing, tube distortion
  - Apple Silicon M-series natively supported
  - Intel i5 or AMD equivalent minimum
  - 8GB RAM required, 16GB recommended
