details: |-
  Glory is the virtual beat maker for all kinds of trap and modern hip-hop.
  Where heavy, tuned 808-kick drums meet frantic hi-hats at the top of the
  billboard charts. Create beats that bounce and roll with glory.

  The drum sounds of glory are gritty and heavy. They can cut through a mix and
  provide plenty of bass. However they're carefully sound designed to give you
  that production-value-feel right out of the box.

  Glory is part of UJAM's Beatmaker series, which makes producing outstanding
  beats for your music fast and easy. It instantly syncs to your DAW's tempo,
  and you can play a near-infinite variety of beats.

  Tune the bass drum to match your song's key or melody. Much easier than with
  an actual 808. Select and adjust one out of 12 custom mix templates. Each is a
  complete multi-bus mixing desk under the hood with multiple effect chains per
  channel.

  With beatmaker glory you can use the built in phrases to construct your drum
  parts, design the drum sounds and even send each instrument to its own output
  channel.
specs: |-
  - 10 trap and drill drum kits
  - 20 styles, 460 Patterns
  - MIDI Drag and Drop
  - Special control: Bass Tune
  - Operating systems: Windows 10 to Windows 11, macOS Monterey (12) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8GB of RAM
  - 0.96GB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
  - Supported standards: MIDI
  - Requires the latest version of the UJAM App, which installs the Beatmaker plug-in that hosts all titles
