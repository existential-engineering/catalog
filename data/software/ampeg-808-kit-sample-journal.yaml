description: Processing an 808 through an ampeg bass amp.
details: >-
  We have this sweet, vintage ampeg tube bass amp that adds a lot of character
  to anything you run through it. It's especially great on drums, so we thought
  it'd be cool to run the 808 through it and grab some one-hits.


  We ran the 808 directly into the normal and bright channels, and took the line
  out of the ampeg into a di, and into our API console.


  The output volume of the drum machine determines the overall amount of
  distortion (from subtle to extreme!), and we further processed everything with
  the onboard eqs and normal / bright channels.


  The results ranged from subtle coloration to extreme degradation.


  Contents: 24 x 24-bit wav ampeg 808 drums samples. Wav only. Royalty free. 6
  mb unzipped.
specs: |-
  - 24-bit wav
  - Royalty free
  - Ampeg tube bass amp processing
  - Normal and bright channels
  - Onboard eqs
  - Di processing
  - API console processing
