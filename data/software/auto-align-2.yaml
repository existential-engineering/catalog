details: |-
  Since its original release almost thirteen years ago, auto-align has become an
  indispensable tool for audio engineers and producers around the world. Now,
  with the release of auto-align 2, this modern classic has received a radical
  evolution that promises to transform users' workflows and achieve superior
  results.

  Auto-align 2 eliminates comb-filtering, minimizes transient smearing, and
  spectrally optimizes the phase of each mic to deliver the full and defined
  sound captured by the microphones. Auto-align 2 takes an extensive step
  further by significantly speeding up the alignment workflow, introducing a new
  spectral phase correction module, refined algorithm, an intuitive user
  interface and much more.

  Auto-align 2 introduces a completely new workflow that revolutionizes the way
  you work. With just one click, auto-align 2 can align all of your microphones
  in a single pass, eliminating the need for manual routing and configuration.
  This groundbreaking feature saves you valuable time and ensures that your
  audio is perfectly time and phase aligned, resulting in improved clarity,
  size, and stereo image.

  Incorporating technology from our emmy award-winning plugin, auto-align post,
  auto-align 2 introduces a host of new features, including spectral phase
  optimization and absolute phase optimization, all designed to improve the
  clarity, size, and stereo image of your audio.
specs: |-
  - One-click workflow
  - Spectral phase optimization
  - Absolute phase optimization
  - Automatic reference and grouping detection
  - Alternate optimized correlation editing
  - Surround support
  - Multi-channel support
  - Single unified interconnected multi-channel user interface
  - Ara2 compatibility
  - Time and phase alignment
  - Comb-filtering elimination
  - Transient smearing minimization
