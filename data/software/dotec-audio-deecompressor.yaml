description: DeeCompressor is a flagship compressor plug-in featuring newly developed algorithms for high-quality, powerful, and comfortable compression. It offers zero-latency operation, ratios from 0.5:1 to infinity, M/S mode, HPF/LPF filters, auto release, side-chaining, and a built-in limiter.
details:
  - DeeCompressor is Dotec-Audio's flagship compressor plug-in, built on newly developed algorithms designed to deliver high-quality, powerful, and comfortable compression. It supports zero-latency operation with attack and release times starting at 0ms, giving producers precise transient control without introducing any processing delay.
  - The plug-in supports ratios as low as 0.5:1, allowing for upward compression effects in addition to conventional downward compression. A wide knee range and auto release function give users flexible dynamic shaping suitable for anything from subtle glue compression to heavy limiting.
  - DeeCompressor includes M/S (Mid/Side) mode with channel link adjustment, enabling independent or linked processing of the mid and side signals for stereo mastering and bus compression workflows. Built-in HPF and LPF sidechain filters allow frequency-selective compression triggering.
  - A built-in limiter provides an additional safeguard against clipping at the output stage. The plug-in operates at 64-bit double precision internally, ensuring high-fidelity processing throughout the signal chain.
  - A free demo is available for download; the demo inserts one second of silence every 30 seconds until activated with a purchased serial key. Existing DeeComp users qualify for an upgrade discount, and a bulk discount applies on second purchases.
