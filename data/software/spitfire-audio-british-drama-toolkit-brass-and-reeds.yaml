details: |-
  Immerse yourself in a new world of brass and reeds — a stunning sound palette of 99 patches, brought to life with our unique and intuitive Layers technology. Instantly sparking inspiration on first play, it's every composer's dream — the ability to finish a whole cue within a single patch. Made in collaboration with award-winning composer Samuel Sim, intricately workshopped techniques from a range of solo brass and woodwind instruments (including saxophones, recorders and flugelhorn) are presented in various combinations, each offering a full spectrum of emotion and expression.

  For anyone looking to embrace a new approach to scoring — and a fresh alternative to string instruments — this sophisticated toolkit offers instant creative freedom. Brass & Reeds intuitively matches the intensity at which your fingers hit the keyboard by selecting from three different velocity layers, layering textural beds with characterful, emotive lead lines — unlocking a world of sound in every patch.
specs: |-
  - 99 patches
  - 17 instruments
  - Dedicated plugin
  - Mic positions: Close and Tree
  - Recorded at Castlesound Studios, Edinburgh
  - 8 GB disk space required during install
  - macOS 11 to OS 26, Intel and Apple Silicon supported
  - Windows 10 or 11 (64-bit)
  - Minimum 8 GB RAM, 16 GB recommended
  - Spitfire Audio App required
