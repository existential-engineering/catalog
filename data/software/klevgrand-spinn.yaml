description: Spinn is a four-band rotating modulation effect. It has
  similarities to, but doesn't aim to replicate, a Leslie speaker (call it a
  spin-off if you like).
details: |-
  Spinn is a four-band rotating modulation effect. It has similarities to, but doesn't aim to replicate, a Leslie speaker (call it a spin-off if you like). Four rotors (one per frequency band) with individual speed controls, acceleration and deceleration times, adjustable size and modulation.

  Each band also has a velocity control, which will adjust the speed according to the band's input level. Spinn also features custom amp modeling (clean or hot) and room simulation.

  Each frequency has individual "slow"/"fast" speeds, which doesn't necessarily have to be slow or fast, and three speed modes (fast, slow, off) to switch between. Crossover points between the four bands are adjustable.

  Custom room simulations and an amp simulation with two modes, EQ and drive, sit after the rotors. The plugin comes with a collection of ready-made presets, and the 1.0.1 preset system added support for user presets.
specs: |-
  - Four frequency bands
  - Input-sensitive velocity control for each band
  - Stereo width control
  - Per-band controls for speed (fast / slow), acceleration, deceleration, size & modulation
  - Three speed modes (fast, slow, off)
  - Room simulation
  - Amp simulation
  - Adjustable crossover points
  - Requires macOS 10.10 or later (optimized for the M1-processor), Windows 7 (SP1) or later, running an AU, VST or AAX compatible 64-bit host
  - iPad version available as AUv3
