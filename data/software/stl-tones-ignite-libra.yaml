details: |-
  MAIN FEATURES

  • Zero Latency

  • Low CPU usage

  • Mono and Stereo support

  • Automatic resampling for IRs with different sample rates

  • High-quality analog shaped filters

  • Automatic phase recognition and flipping for negative phase IRs

  • Selectable delay for phase interactions between loaded IRs

  • Continuous graphical morphing control between loaded IRs

  • Global input level and single IR level controls

  • Fully automatable controls

  THE CARTESIAN MIXER

  The most important and unique feature of Libra! The Cartesian Mixer allows you to seamlessly mix up to 8 different IRs in a graphical way, maintaining the output level consistently while allowing you to find the perfect balance between all the loaded IRs.

  MULTIPLE IRS INTO 1

  Intuitively merge and export up to 8 Impulse Responses into 1 with the click of a button. The possibilities are now endless.

  ULTIMATE CONTROL

  Each IR has it's own controllable functions for maximum flexibility.

  • Phase Selection

  • Solo IR

  • Level

  • Resonance

  • Hi Pass

  • Lo Pass

  • Delay

  CAB IRS & PRESETS

  • Included are 8 cab IR's created by STL Studio's which include a Mesa OS, Mesa Std, Engl Pro & Marshall 1960.

  • 10 presets dialed in by STL Tones & Ignite Amps

  LIBRA GETS FREE UPGRADE

  A partnership with Bogren Digital adds 5 free presets and 3 IR's from metal producer Jens Bogren for use within STL Ignite Libra at no cost. The 3 IR's are from Bogren Digital's Jens Bogren Signature IR Pack - Rhythm.
