description: Vintage Modelled Delay
details: |-
  Repeater is a dual delay powerhouse built in collaboration with Slate Digital, featuring 23 unique, authentically modeled delay units ranging from classic oil cans and plates to the most famous vintage digital designs. Rather than a typical stereo delay processor, it behaves more like a flexible double delay line effect, with independent re-panning and dry/wet mixing for each of two stereo channels.

  Each of the two delay lines offers independent control over delay time and feedback, phase invert, an audio clipper module with a Color parameter, a dual (Hi-Pass, Lo-Pass) filter, and channel re-panning. Ping-Pong mode, Feedback Analog mode, and two-stage stereo spread expand the range of possibilities further, while optional tempo synchronization (with a tap function for non-synced use) keeps delay times locked to a DAW's tempo.

  Ultra-low digital aliasing keeps the output warm even at extreme settings, making Repeater equally suited to subtle space-and-depth duties and bold creative delay effects.
specs: |-
  - 23 authentically modeled vintage and modern delay units
  - Two independent delay lines with per-channel re-panning and dry/wet mixing
  - Per-line audio clipper with Color parameter
  - Dual (Hi-Pass, Lo-Pass) filter per delay line
  - Ping-Pong mode, Feedback Analog mode, two-stage stereo spread
  - Optional tempo sync with tap function
  - Ultra-low digital aliasing output
