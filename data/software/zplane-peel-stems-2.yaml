description: Next-generation AI-powered real-time stem separation plugin.
  Instantly split mixed audio into four distinct stems, and go deeper with
  flexible spectral filtering, all without leaving your DAW.
details: |-
  PEEL STEMS 2 is a real-time audio stem separation plugin that splits mixed audio into four stems — Drums, Bass, Vocals, and Other — directly inside the DAW. It is a new plugin rather than an update to PEEL STEMS: instances of the first version in existing projects are not replaced by it, and owners of PEEL STEMS keep that licence alongside it.

  A Stem Isolation control trades separation precision against artefacts, so the split can be tuned to the source material rather than accepted as the algorithm leaves it.

  The Soundfield Display gives visual stem identification with colour coding and frequency/stereo-field visualization, showing the content of each separated stem at a glance.

  The PEEL Focus EQ isolates or extracts a selected frequency range and stereo position out of a stem, and its output can be routed to a secondary output for external processing in Ableton Live, FL Studio, Pro Tools, Reason and Reaper.
specs: |-
  - Real-time audio stem separation into Drums, Bass, Vocals and Other
  - Stem Isolation control to fine-tune separation precision
  - Soundfield display showing frequency content and stereo placement per stem
  - PEEL Focus EQ for isolating or extracting selected frequency ranges and stereo information
  - Dual output: route the PEEL Focus EQ to a secondary output (Ableton Live, FL Studio, Pro Tools, Reason, Reaper)
  - Audio format: 1-2 channels (I/O), 44.1-192kHz sample rate
  - Plugin latency: 245ms @ 44.1kHz, 238ms @ 48/96/192kHz; Intel Macs 385ms @ 44.1kHz or 378ms @ 48/96kHz
  - Plugin formats: AAX, AU, VST3
  - Supported operating systems: Windows 10 & 11 (64bit), macOS 13 or later (64bit Intel & Silicon)
  - Recommended system: Apple Silicon (M1 or higher); Windows Intel Core Ultra 5/7 family or higher
  - Minimum system: Intel Core i7
