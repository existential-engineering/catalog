description: A high quality echo processor with powerful and unusual features suitable for creative uses ranging from simple slap back effects to ping-pong delays and spacious echoes. Features tape echo effects with wow control, a built-in ducker for dynamic control, and ping-pong pre-delay functionality.
details: |-
  PSP Echo is a tape-style echo and delay plugin with an internal architecture of four mono tape delay channels (two for pre-delay, two for main stereo). Features a tape wow control for pitch modulation, a built-in ducker for dynamic delay control, and ping-pong pre-delay. Ships with a factory preset library. Activation requires a free iLok user ID and iLok License Manager, with up to 3 simultaneous activations.
specs: |-
  - Platforms: Windows 7-11 (64-bit), macOS 10.14-15 Sequoia (Intel and Apple Silicon)
  - Formats: AU, VST2, VST3, AAX
  - Internal architecture: 4 mono tape delay channels (2 pre-delay, 2 main stereo)
  - Tape wow control
  - Built-in ducker
  - Ping-pong pre-delay
  - Factory preset library
  - Activation: iLok License Manager required; up to 3 locations
