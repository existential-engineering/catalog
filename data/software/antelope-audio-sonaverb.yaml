details: |-
  SonaVerb is a clean, early-digital-style reverb designed for subtle enhancement and transparent spatial depth. With a refined interface and essential controls, it's ideal for pop, rock, and modern mixes where space is needed - but clarity must come first.

  Early-Digital Reverb Character: Delivers smooth, unobtrusive ambience reminiscent of classic early digital units, ideal for adding polish and cohesion without introducing harsh reflections or metallic tails.

  Simple, Intuitive Controls: Get professional results fast with just a few key parameters: Room Size, Reverb Time, and Color. Whether you're building subtle width or gentle depth, SonaVerb keeps the workflow efficient and focused.

  Clean and Natural Sound: Designed to preserve the clarity of vocals, guitars, keys, and acoustic instruments while gently reinforcing them with space. Adds air and dimension without clouding the mix.

  Control Over Early Reflections: Fine-tune the shape and timing of early reflections to adjust front-to-back positioning in the stereo field. Perfect for making sounds feel natural and placed without exaggeration.

  Mix-Ready Ambience: Tailored for modern pop, indie, and rock productions, SonaVerb helps instruments and vocals 'sit' just right. Use it to glue elements together while maintaining the punch and presence of the original performance.

  SonaVerb is part of the Antelope Cosmos plugin collection (75+ Antelope Native Plugins). Free 14-day trial available.
specs: |-
  - Early-digital-style reverb algorithm
  - Room Size control
  - Reverb Time control
  - Color control
  - Early Reflections control (shape and timing)
  - Runs natively in DAW on macOS or Windows
  - Included in Antelope Cosmos plugin collection
