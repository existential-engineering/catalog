details: |-
  4cler is a synthesizer that can produce a wide range of sounds by combining
  additive and FM synthesis. It can also produce primitive sounds in 8-bit
  style. Its general concept is based on pixel art and chip-tunes musical
  composition.

  Features: 4 oscillators. 7-waveform selector. Adsr for each oscillator. Lfo.
  Pdo. Filter and bitcrusher effect. 2x2 matrix for triggering.
specs: |-
  - 4 oscillators
  - 7-waveform selector
  - ADSR for each oscillator
  - LFO
  - Pdo
  - Filter
  - Bitcrusher effect
  - 2x2 matrix for triggering
  - Additive synthesis
  - FM synthesis
  - 8-bit style sound generation
  - Windows compatible
