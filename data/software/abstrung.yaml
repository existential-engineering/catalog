details: |-
  Abstrung is a double engine themed rompler, geared towards "all things strung"
  type of sounds, therefore it includes a selection of stringed instruments like
  guzheng, mandolin, pipa, american zither, hammered dulcimer, kantele, acoustic
  guitars, acoustic grand, upright and prepared pianos and seagull instrument
  among others. The different categories include organic real instruments
  samples, modeled, synthetised, designed and spacey sounds.

  Abstrung hides a powerful randomiser engine, a twin step sequencer and a
  "trails layer" which adds motion to each patch. Abstrung comes with 155 sound
  sources loadable in 2 different slots, plus 20 trails. Each sound source is
  multisampled and comes with 3 round robins.

  Audiofier's new "intelligent" randomiser feature makes it incredibly easy to
  create new sounds quickly and makes presets redundant. It also possible to
  recall past randomisations and go back and forth in the randomisation history,
  also recalling past randomisation on the fly.

  Abstrung gives the option to reverse sounds on the fly and to adjust the
  length of each reversed sound with the mod wheel. In abstrung you can select
  whether you want to play both sound sources at once (single map mode), one per
  key zone (dual map mode) or let it happen randomly (random map mode), creating
  interesting changing textures.

  Abstrung features not one, but 2 step simultaneous sequencers with 8 memory
  slots. You can change sequence on the fly via keyswitch, and you can record
  your sequences by playing, not by drawing. Add to this permanent random
  generated sequences and temporary random sequence at the tip of a "keyswitch",
  to spice up some stale repetitive phrases.
