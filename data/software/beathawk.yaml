name: BeatHawk
manufacturer: uvi
primaryCategory: drum-machine
categories:
  - sequencer
  - sampler
url: https://www.beathawk.com
description: "BeatHawk - portable music production studio for ipad and iphone:
  create beats, compose whole tracks, sample, record, sequence, perform, mix."
details: |-
  BeatHawk - portable music production studio for ipad and iphone: create beats,
  compose whole tracks, sample, record, sequence, perform, mix and arrange your
  own music. Packed with high-quality UVI sounds, instruments and effects.

  Designed to put professional quality uvi software into a lightweight and fun
  performance-oriented package. Delivers extreme sonic fidelity rivaling desktop
  products. Power, speed and flexibility make for ultimate ease-of-use. Ensures
  fast, intuitive and professional quality music production.

  Including 2 factory sound packs with 2,000+ samples, 290 presets and dozens of
  loops. Import your own sounds (support for mp3, wav, aif, flac, and m4a).
  Record using built-in mic, line-in or external devices. Edit and tweak sounds
  with high-quality effects and adsr envelopes. Integrated sound expansion store
  (acoustic grand, atlanta urban, funk, brass riffs, asia, world percussions,
  vintage blues guitar, electric organs, electro pop, and much more...).

  Ableton link, inter-app audio, audio unit v3 plugin, audiobus and audiocopy
  support. Transfer files via icloud, google drive, dropbox or onedrive. Paste
  audio directly to pads with audiocopy. External keyboard and MIDI-over-lan
  support via coremidi. Jam with multiple devices using wist sync over
  Bluetooth. Export stereo mix, stems, MIDI tracks or ableton live project file
  (file format: 44.1khz 24-bit wav). Share your music on soundcloud and youtube.

  Get your ideas out quickly, efficiently and sounding great no matter where you
  are. Use included uvi sounds, your own samples, or high-quality expansion
  packs. Use with other apps that support ableton link, audiobus, audiocopy and
  audiounits.
specs: |-
  - 16 track sequencer with up to 16 patterns per part
  - Pad, keyboard and pattern performance modes
  - High-quality pitch and time stretching
  - Numerous scales playable in pitch mode
  - Step editor mode with note and cc
  - Record using built-in mic, line-in or external devices
  - Edit and tweak sounds with high-quality effects and ADSR envelopes
  - Choke groups and one-shot sample modes
  - Bind parameters to MIDI cc with MIDI learn
  - Perform and record arrangements in realtime
  - Ableton link support
  - Inter-app audio support
  - Audio Unit v3 plugin support
  - Audiobus support
  - Audiocopy support
  - Coremidi support
  - Wist sync over Bluetooth
  - Export stereo mix, stems, MIDI tracks or Ableton live project file
  - 44.1khz 24-bit wav export
  - Transfer files via icloud, google drive, dropbox or onedrive
  - Share on soundcloud and youtube
  - 2 factory sound packs with 2,000+ samples
  - 290 presets and dozens of loops
  - Support for mp3, wav, aif, flac, and m4a import
  - Integrated sound expansion store
  - iOS 9+
  - Ipad 4 or newer
  - Iphone 5 or newer
  - 950mb of disk space
