description: Phoenix Scream is the deepest sampled ancient Chinese Suona in the world, diversify your ethnic library.
details: |-
  Suona is the Chinese variant of surnay that originates from Central Asia. It has a characteristic reed made of bulrush trunk, resulting in its featured metallic sound, rich in high frequencies. Suona is highly expressive, especially for extreme delight or grief-stricken emotions. Thus, it is commonly used in both weddings and burials in Chinese tradition. Nowadays, it appears more often in maestoso or heroic themes in contemporary works. Also, Suona's expressiveness is reflected in its ability to reproduce real-world sounds with highly flexible performances, such as birdsong, monkey cries, and frog croaks, and these are all included in the virtual instrument.

  Two virtual instruments are provided for Suona: Phoenix Scream with the most commonly used pitch range, and Phoenix Growl, which is a bass Suona. Phoenix Growl was not recorded independently, and it uses repitched samples of Phoenix Scream. Phoenix Growl is included with Phoenix Scream.

  When samples were recorded, 5 different microphones were used with different positions to capture the spatial and reverb characteristics of Suona. All these channels were mixed down to four channels: Yin, Yang and far stereo. The volumes of these four channels are adjustable in software, making it possible to obtain the most various tones. By controlling airflow and fingers, Suona has a very rich set of performances such as mordent, finger pole popping, trill, flutter, vibrato, staccato and gliss, and all of them can be triggered in the Phoenix Scream software.

  Real-recorded expressions are freely controllable through MIDI CC, three different speeds of real-recorded gliss samples combine with a sample synthesis technique for gliss at freely adjustable speed, and a self-developed, real-sample-based LFO engine performs vibrato that is both realistic and adjustable. Legato was recorded between notes at three speeds, along with popping legato and flutter legato specific to Chinese Suona, and a spectrum fusion legato technology uses frequency-domain fusion instead of a time-domain cross-fade to avoid phase-cancellation at sample junctions.

  Convolution reverb samples were recorded at spectacular places and famous natural and historical heritages in China, so Phoenix Scream can be simulated as played at the Great Wall or the Terracotta Army site. The effect rack from Heavier7Strings adds Compressor, EQ, Chorus and Ping-Pong delay, and a complete pattern library with a rich preset of patterns allows user patterns to be created by dragging MIDI clips inside.
specs: |-
  - Samples: 3617
  - Samples parameter: 44100 Hz / 24 bit
  - Sample size: 5.2GB
  - 29 summarized and screened Suona techniques, including traditional performance techniques, film and television soundtrack techniques, and special techniques used in Chinese ancient-style songs
  - Self-developed sampling engine with disk buffer streaming/sampling compression and sound fusion technology
  - Minimum system requirements: Intel or AMD CPU with SSE 4.1 instruction set, or Apple chip
  - Mac OS X 10.9 / Windows 7
  - 4GB RAM and 6GB disk space
  - Plugin formats provided: 64-bit VST2, VST3, AAX and Audio Unit
  - Extra requirements on specific hosts: Logic Pro X or Higher (Logic 9 is not supported)
