details: |-
  Keyscape is an epic virtual instrument featuring the largest selection of collector keyboards in the world. From holy grail pianos to stunning keyboards you didn't even know existed, this virtual instrument brings together the most sought-after keyboard instruments ever made.

  The software team closely modeled the authentic behavior of vintage amplifiers, classic EQs, and iconic effects to bring these sounds to a new level of authentic tone and dynamic expression. Hundreds of included patches showcase effects processing specially crafted for each sound.

  The huge library features over 500 best-in-class sounds across 36 collector keyboard models with over 1,500 creative patches specially designed for sound design. The highly dynamic and expressive instruments have been recorded with meticulous attention to detail.

  Keyscape appears as a library inside Omnisphere, allowing seamless integration between the two instruments. Two installation options are available: Full (80GB) for the complete collection, or Lite (30GB) streamlined for stage use.
specs: |-
  - Largest selection of collector keyboards in the world
  - Over 1,500 creative patches included
  - 36 collector keyboard models recorded
  - Over 500 best-in-class sounds
  - Authentic circuit-modeled amplifiers and effects for each patch
  - Highly dynamic and expressive instrument recordings
  - Integrates as library inside Omnisphere
  - Full installation (80GB) or Lite installation (30GB) for stage use
  - 64-bit native on both Mac and Windows
