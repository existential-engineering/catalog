description: PSP L'otary2 is an ultra high-quality emulation of a rotary speaker. Based on two original and legendary models — the Leslie 122 and Leslie 147 — it is capable of reproducing the classic sounds of those famous rotary speakers as precisely as possible, as well as creative new sounds not possible with the original.
details: |-
  PSP L'otary2 is a rotary speaker cabinet emulator modeled on the Leslie 122 and 147. Features independent control of the rotating high-frequency horn and low-frequency drum, static drum or broken engine emulation, microphone positioning and distance control, ambiance control, ramp up/down speed adjustment, amp type selection, crunch and distortion controls, and mechanical noise simulation.

  iLok License Manager required (no hardware dongle). 30-day trial available.
