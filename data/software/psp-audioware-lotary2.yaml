  - Platforms: Windows 7 - 11 (64-bit), macOS Intel/Silicon 10.14 - 15
  - Independent horn and drum speed control
  - Microphone positioning and distance
  - Static drum / broken engine emulation
  - Amp type, crunch, and distortion controls
