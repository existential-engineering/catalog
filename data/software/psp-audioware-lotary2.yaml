description: "PSP L'otary2 is an ultra high-quality emulation of a rotary speaker. Its algorithm is based upon two original and legendary models, the Leslie 122 and Leslie 147, with hundreds of hours spent perfecting the simulations."
details: |-
  PSP L'otary2 is an ultra high-quality emulation of a rotary speaker. Its algorithm is based upon two original and legendary models, the Leslie 122 and Leslie 147, with hundreds of hours spent perfecting the simulations. PSP L'otary2 reproduces the classic sounds of those famous rotary speakers as precisely as possible.

  PSP L'otary2 is also capable of creative new sounds and tones not possible with the original. The rotating high frequency horn and the rotating low frequency drum can be set up independently from each other, emulating speakers with a static drum or even a broken horn or drum engine.

  Running PSP L'otary2 in 30-day trial mode or activating it requires a free iLok user ID and the free iLok License Manager application. No hardware dongle is needed. The license activates in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above), and the locations can be changed at any time using PACE's iLok License Manager.
