description: "The Quinta Pitch Machine plugin is more than a standard octave effect: it gives you notes an octave up and an octave down, and also a fifth up. Each of the three intervals is dialled in with its own knob, with a mix knob to blend dry and pitch-shifted sound."
details: |-
  The Quinta Pitch Machine plugin is more than your standard octave in that it not only gives you notes an octave up and an octave down, but also gives you a fifth up.

  Each of the three intervals is dialled in proportion with its own knob, and a mix knob blends dry and pitch-shifted sound, running from totally dry to fully pitch-shifted.

  Quinta Pitch Machine comes with 4 knobs, three of which add the extra notes. The +1 OCTAVE knob adds a note one octave higher than the note played on the instrument, the -1 OCTAVE knob adds a note one octave lower, and the +1 FIFTH knob adds a note a fifth higher.

  An iOS version for iPhone and iPad is available from the Apple App Store alongside the desktop plugin.
specs: |-
  - 4 knobs: +1 Octave, -1 Octave, +1 Fifth and mix
  - +1 OCTAVE knob adds a note one octave above the played note
  - -1 OCTAVE knob adds a note one octave below the played note
  - +1 FIFTH knob adds a note a fifth above the played note
  - Mix knob blends from totally dry to fully pitch-shifted
  - Each interval dialled in proportion with its own knob
  - iOS version available for iPhone and iPad
  - Plugin formats: VST2, VST3, AAX or AudioUnits compatible host
  - Intel compatible or Apple Silicon CPU
  - 1GB RAM
  - Mac OS 10.13 or newer
  - Windows 7 or newer
  - 64-bit DAW required
