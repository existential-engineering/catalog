description: Quinta Pitch Machine is a pitch shifter plugin that goes beyond a standard octaver by providing notes an octave up, an octave down, and a fifth up simultaneously. It features four controls including dedicated knobs for each interval and a Mix knob to blend the dry and pitch-shifted signals.
details:
  - Quinta Pitch Machine is more than your standard octave plugin — it not only gives you notes an octave up and an octave down, but also gives you a fifth up, making it a versatile pitch shifting tool for guitarists and producers alike.
  - "The plugin features four dedicated knobs: +1 OCTAVE produces a note one octave higher than the input, -1 OCTAVE produces a note one octave lower, and +1 FIFTH produces a note a fifth higher. The Mix knob blends the dry signal with the pitch-shifted output for precise control over the effect level."
  - Quinta Pitch Machine is compatible with all major plugin formats including VST2, VST3, AAX, and AudioUnits, making it suitable for use in virtually any 64-bit DAW on macOS or Windows. An iOS version is also available via the Apple App Store for mobile use.
  - The plugin supports both Intel and Apple Silicon CPUs natively, requiring macOS 10.13 or newer and Windows 7 or newer. A minimum of 1GB RAM is recommended for smooth operation.
