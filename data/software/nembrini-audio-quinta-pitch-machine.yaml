description: "The Quinta Pitch Machine plugin is more than your standard octave
  in that it not only gives you notes an octave up and an octave down, but also
  gives you a fifth up. Each of the three intervals is dialled in proportion
  with its knob, and you get a mix knob to blend dry and pitch-shifted sound,
  this runs from totally dry to pitch-shifted."
details: |-
  Each of the three intervals is dialled in proportion with its knob, and you get a mix knob to blend dry and pitch-shifted sound, this runs from totally dry to pitch-shifted. Quinta Pitch Machine plugin comes with 4 knobs. Three of these are used to add in the extra notes. I own the physical pedal and this sounds just like it. Great plugin.
