description: "Accurately modeled after the 'black' version of a classic and sought-after VCA compressor the sc-5 opens up a whole world of versatility: you're going for super gentle compression to sweeten up the signal on your masterbuss? You're looking for a colorful or smashed sound on your drum buss? You want to tame lively and dynamic material? The BlackAsh SC-5 handles it all."
details: |-
  Inspired by the Ashly SC-50: the BlackAsh SC-5 recreates the black-frontplate 1980s revision of a classic American VCA compressor, the darker, more aggressive sibling built with an external sidechain input on board. It is a feedback VCA compressor that handles the same wide range of jobs as the blue-faced original, from gentle mix-bus glue to fully smashed drum-bus destruction, but voices things differently: the audio path sits darker, the harmonic structure shifts, and it adds an external sidechain the earlier unit never had.

  A real-time, SPICE-style circuit simulation models every crucial stage as a living circuit: the custom VCA, the dual time-constant detector, the feedback compressor loop and the audio path are rebuilt component by component. The black revision runs a first-order lowpass at 31.2kHz in the audio path that the blue unit never had, quietly rolling the very top and lending the BlackAsh its more closed, aggressive tone. It is a fixed-threshold design: the amount of compression is set by pushing the input Gain, with the makeup trimmed via Output.

  Attack runs from 200µs up to 20ms, release from 100ms to 2s, and Ratio sweeps from a gentle 1:2 all the way to a limiting 1:∞. A dedicated Limit switch bypasses just the compressor path so the output stage and meters stay live while A/B-ing a setting.

  On a drum bus it delivers weight and menace with a fast attack; on vocals its darker path flatters bright or sibilant sources, and the external sidechain (engaged via "Ext SC") allows driving a de-esser or EQ'd feed into the detector for frequency-conscious ducking or de-essing. The external signal is blended into the feedback detector path so the unit keeps its feedback behaviour. On the mix bus it glues, on bass it tightens, and wound to its topmost ratio it clamps like a limiter.
specs: |-
  - External sidechain input on a dedicated bus ("Ext SC") for de-essing, ducking and creative effects, blended into the feedback detector path
  - 31.2kHz first-order lowpass in the audio path (black-revision voicing)
  - Fixed-threshold Gain with auto gain compensation (right-click drag links Gain/Output)
  - Stepped Ratio: 1:2, 1:2.5, 1:3, 1:5.5, 1:7, 1:10, 1:20, 1:30, 1:100, 1:∞ (limiting)
  - Attack 200µs to 20ms, release 100ms to 2 seconds
  - Link switch for stereo-linked or dual-mono operation
  - Limit switch bypasses only the compressor path, output stage and meters stay live
  - Gain-reduction and threshold LEDs, plus host gain-reduction meter
  - Real-time SPICE-type component-based circuit simulation of the custom VCA, dual time-constant detector, feedback compressor loop and audio path
  - SSE2-optimised DSP
  - Low-latency, linear-phase Dolph-Chebyshev polyphase oversampling, auto-adjusted to session sample rate
  - HighDPI / Retina support on macOS and Windows
