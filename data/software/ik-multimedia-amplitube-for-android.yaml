details: |-
  Amplitube turns your Android device that supports samsung professional audio
  technology like the samsung galaxy note 4, galaxy note edge and galaxy s5, and
  soon to be available on the galaxy note 3 and other devices into a mobile
  guitar and bass multi-effects processor, offering up digital versions of some
  of the most coveted amplifiers and stompbox effects of all time.

  Use the irig hd-a, irig or irig stomp audio interface adapters to connect your
  guitar, bass or keyboard to your mobile device and you'll be ready to rock!

  You can also use the irig mic to process vocals and acoustic instruments with
  this powerful mobile suite.

  Amplitube gives you realistic amp tones and effects in a mobile app from ik
  multimedia.
specs: |-
