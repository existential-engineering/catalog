description: "Create ambient soundscapes with Antelope Audio's Shimmer – a
  pitch-shifting reverb plugin with 30-second decay, built-in delay, and lush
  reflections. Perfect for cinematic and atmospheric mixes. Free 14-day trial."
details: |-
  Shimmer is a spacious, ambient reverb plugin designed to elevate your sound with pitch-shifted trails, long evolving decays, and built-in delay and reflection shaping. Inspired by the legendary reverb pioneered by Brian Eno and Daniel Lanois, it's ideal for creating lush textures, dreamy environments, and immersive soundscapes.

  At its core is a pitch-shifting reverb engine that integrates smooth octave-shifted voices into a pristine reverb, allowing you to create lush, harmonic trails that evolve naturally over time. Combined with extended decay times of up to 30 seconds and detailed diffusion, Shimmer can produce vast ambient washes or cinematic swells that remain smooth and cohesive even at extreme settings.

  Built-in delay and early reflection controls shape the sense of space, from tight, reflective rooms to sprawling stereo tails, giving detailed control over depth, placement, and movement. Flexible pitch-shifter routing and reverb tone shaping let you blend high-frequency lift, time-based modulation, and spatial spread to build everything from subtle textures to massive, layered atmospheres.

  Designed for sound designers and artists seeking emotionally rich spatial effects, Shimmer excels at enhancing acoustic instruments, vocals, and synths with otherworldly reverb that feels both expansive and precise in a mix. Shimmer runs natively in your DAW on macOS and Windows and is part of the Antelope Cosmos plugin collection, with a free 14-day trial available.
