description: "Focusrite Control 2 is a powerful app for your Scarlett to make
  session setup painless, so you can focus on what matters — capturing great
  performances."
details: |-
  Focusrite Control 2 is a management application for Scarlett 4th Gen and ISA C8X audio interfaces, available on Windows, macOS, iOS, and Android. It streamlines session setup with multi-channel Auto Gain (up to 8 preamps), latency-free monitoring with customizable headphone mixes, precise metering and peak indicators, presets/session recall, and multi-device control for collaborative sessions.

  The companion mobile app pairs wirelessly with the desktop app, letting users adjust their Scarlett from anywhere in the recording space. Designed with accessibility in mind (screen reader support) and localized into 12 languages.
specs: |-
  - Supports Scarlett 4th Gen and ISA C8X audio interfaces
  - Multi-channel Auto Gain for up to 8 preamps
  - Latency-free monitoring with customizable headphone mixes
  - Precise metering and peak indicators
  - Presets and session recall (save/load settings)
  - Multi-device control for collaborative sessions
  - Wireless pairing between desktop and mobile apps
  - Accessible design with screen reader support
  - 12-language multilingual support
  - Windows 10/11 (64-bit)
  - macOS Sonoma (14), Sequoia (15), Tahoe (26)
  - iOS 17–26
  - Android 15–16
