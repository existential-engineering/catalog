details: |-
  Celebrating the exquisite sound of a world-class Oboes a2 section captured in Studio One at Abbey Road, the Core version of Abbey Road Orchestra: Oboes delivers the essential sound and key expressive articulations of this beautiful woodwind instrument in a streamlined, powerful package. Experience a world-class oboes section recorded in the iconic Abbey Road Studio One, engineered by GRAMMY Award-winner Simon Rhodes, now accessible in a focused library perfect for instant inspiration and rapid scoring.

  Get straight to the heart of the oboe sound that has graced countless iconic scoreswith an authentic and responsive playing experience with sophisticated performance legato for incredibly natural melodic lines. It's the perfect entry point into the Abbey Road Orchestra series or a lightweight addition for composers needing that signature sound without extensive control options.
specs: |-
  - File size 2.3GB
  - 2 legato patches (Performance Legato and Lyrical Legato)
  - One microphone signal (Simon Rhodes' Mix 1)
  - Minimum 8GB RAM, 16GB recommended
  - Mac OS 11 to OS 26, Windows 10 or Windows 11 (64-bit)
