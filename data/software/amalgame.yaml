details: |-
  Amalgame is a multi-effect plugin designed to help you effortlessly craft
  intricate signal processing chains. Its intuitive interface puts every
  function at your fingertips, allowing you to focus on exploring and sculpting
  your sound.

  Choose from a library of 23 effects, spanning from familiar filters and delays
  to experimental, glitchy processors. Drag and drop them onto six xy pads,
  where each axis provides hands-on control over key parameters for real-time
  sound manipulation.

  Independent sequencers for each pad's x and y axes let you create detailed
  modulations synchronized to your rhythms and ideas. Adjustable rates and
  sequence lengths provide precise control over movement and complexity in your
  sound design.

  When creativity stalls, amalgame's versatile randomizer is your go-to
  solution. Instantly shuffle parameters, sequences, or effects—or reimagine the
  entire chain with a single button press—to unlock new possibilities and
  reignite your inspiration.

  Each of the six slots features sequencing of the xy pad. Choose a length,
  host-synced rate, and playback direction, then draw your sequence. Mutate or
  fill the sequences using an extensive set of processing tools.
