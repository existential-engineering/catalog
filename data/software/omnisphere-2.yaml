description: The second generation of Spectrasonics' flagship power synthesizer,
  featuring Audio Import, granular synthesis, over 400 morphing wavetable
  waveforms, and Hardware Synth Integration with 65+ supported synthesizers.
details: |-
  Omnisphere 2 is the second generation of Spectrasonics' flagship synthesizer, combining sample-based and DSP synthesis into a single powerhouse instrument. It introduced Audio Import, allowing users to drag-and-drop their own audio files as sound sources, and added granular synthesis for transforming any sound into new textures and soundscapes.

  The innovative Sound Match feature locates related sounds in the library based on sonic characteristics, while Sound Lock lets users lock specific parameters and browse through variations. Over 400 new DSP waveforms, each a morphing wavetable, provide 100 times the oscillator content of the original Omnisphere.

  Hardware Synth Integration, introduced in version 2.5, transforms over 65 well-known hardware synthesizers into hands-on controllers that unlock Omnisphere's synthesis capabilities. Supported hardware includes models from Moog, Roland, Korg, Sequential, Nord, Novation, and others.

  The enhanced arpeggiator features multiple play modes, a 32-step pattern programmer, step dividers, pitch slides, and per-step chord voicings. Version 2.6 added the ability to capture arpeggiator output as MIDI for further editing in the DAW.
specs: |-
  - Over 14,000 sounds including patches and soundsources
  - Audio Import for user-created soundsources
  - Granular synthesis engine with up to 8 voices per layer
  - Over 400 morphing wavetable DSP waveforms
  - Sound Match for finding related sounds in the library
  - Sound Lock for generating patch variations
  - Hardware Synth Integration with 65+ supported hardware synths
  - 58 FX units including reverbs, delays, modulation, distortion, and dynamics
  - Enhanced arpeggiator with 32-step pattern programmer
  - FM, ring modulation, waveshaping, Harmonia, and unison synthesis modes
  - Four layers per patch with extensive modulation routing
versions:
