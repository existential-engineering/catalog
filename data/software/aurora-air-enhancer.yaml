details: |-
  It has a main "air" knob, which controls the amount of high-end signal to
  boost. Adjust the "freq" knob to change the target frequency to increase.

  The "gain" knob adjusts the output volume, but also affects the amount of
  saturation/distortion added to the high frequency signal.

  Aurora air enhancer by vox samples is a virtual effect audio plugin for macos
  and windows. It functions as an audio units plugin, a VST 3 plugin and an AAX
  plugin.
