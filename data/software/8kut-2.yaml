details: >-
  8kut, an 8-band frequency cutter, is a stripped down version of tek'it audio's
  kutter plug-in, designed with djs and live performance in mind, allowing you
  to cut frequencies on eight bands easily.


  Feature highlights: 8-band frequency cutter. Independent left and right
  channel pass through. Phase inverter, effect bypass, gain boost and dry/wet
  mix. Zdf filter design. 64-bit internal processing. Full MIDI automation
  support. Works in mono or stereo. Undo your changes to initial preset value.
  Integrated preset manager, rename, copy, save, load... Randomize all
  parameters. 40 factory presets. Up to 64 user presets per bank.
specs: |-
  - 8-band frequency cutter
  - Independent left and right channel pass through
  - Phase inverter
  - Effect bypass
  - Gain boost
  - Dry/wet mix
  - Zdf filter design
  - 64-bit internal processing
  - Full MIDI automation support
  - Mono or stereo operation
  - Undo to initial preset value
  - Integrated preset manager
  - Randomize all parameters
  - 40 factory presets
  - Up to 64 user presets per bank
  - VST plugin
  - Audio units plugin
  - VST 3 plugin
  - Macos and windows compatible
