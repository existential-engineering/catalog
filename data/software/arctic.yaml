details: |-
  Arctic is an innovative, intuitive multi-effects acqua plugin
  (VST/VST3/AAX/AU) which combines a compressor (comp), a limiter (lim) and
  distortion (sat) in a single, easy-to-use tool for your DAW.

  Arctic represents a whole new way to process sound, fusing three different
  processes into a powerful all-in-one mix bus plugin that gets you the exact
  sound you're looking for with just a few clicks.

  From smooth compression to hard limiting to extreme overdrive, arctic allows
  you to find the perfect processing for your mix from wherever you are, making
  your work that much easier.

  Arctic by acustica audio is a virtual effect audio plugin for macos and
  windows.
