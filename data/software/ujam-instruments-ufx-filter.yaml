description: "Synthesizer filters re-imagined: three filter modules, a modulator section and two multi effects, organized into 20 modes from classic lowpass to comb, multi-peak and talking formant filters."
details: |-
  UFX FILTER combines three great-sounding synth filters with a modulator section and 2 multi effects, perfect for any track that needs to be unbored: drums, guitars, vocals, synths, anything sounds more interesting with UFX FILTER. Probably the most powerful and creative filter plug-in ever.

  No less than three filter modules and 20 filter modes, many available in 12, 24 and 36 dB, make UFX FILTER a sound shaping swiss knife for any kind of track: drums, instruments, vocals or sound FX. The modes range from classic synthesizer filters like lowpass to the strong jet effect of a Comb filter to the vocoder effects of the Talking modes.

  Animation is an essential ingredient of interesting filtering. UFX FILTER's Modulation section lets you animate the filter using classic synth LFO curves such as sine or saw, stepped modulation, but also simple and complex patterns for rhythmifying and gating your tracks. The built-in envelope follower controls the filter cutoff based on the input level, making the filter follow your signal's amplitude and creating automatic filter sweeps.

  The filter signal as well as your input signal can be sent into the Shaper, which offers additional filters as well as all manner of character shaping, and the Finisher which comes loaded with all kinds of effects from a simple chorus to a cloud of grains and rhythmification. The intelligent randomization provides instant surprises on the press of a button, adjustable using the Small/Big control from subtle variations to totally new filter presets.
specs: |-
  - 3 filter modules under the hood, organized into 20 modes
  - Modes: Lowpass, Highpass, Bandpass, Notch, Vintage LP, Broken LP, Low / High, Dual Peak, Tri Peak, Dual Wide, Dual Contra, Dual Band, Comb +, Comb -, Comb + Low, Comb - Low, Comb Contra, Talking 1, Talking 2, Talking 3
  - Many modes available in 12, 24 and 36 dB
  - Modulator section animates filter cutoff with classic LFO modulations and rhythmic patterns
  - Envelope follower controls cutoff from the input level
  - Built-in multi-effect section with 40 Shaper and 50 Finisher effects
  - 150+ presets plus intelligent variation and randomization
  - Operating systems: Windows 10 to Windows 11, macOS Catalina (10.15) to macOS Sequoia (15)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 8 GB of RAM
  - 300MB of free disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App
  - Authorization: quick authorization via the UJAM App
