description: MR Noise is a broadband noise reduction processor. It distinguishes itself by being both great sounding and incredibly easy to use.
details: |-
  MR Noise is a broadband noise reduction processor. Like most noise reduction systems it works in the frequency domain, and requires that the noise spectrum be learned before noise reduction can commence. If a track starts with a bit of silence then MR Noise works right out of the box, since the Learn parameter is enabled by default, so on playback MR Noise learns the noise profile and starts noise reduction. The default parameters work extremely well for most cases.

  MR Noise combines existing noise reduction algorithms with new innovations, in particular the Auto Dynamics mode. That mode automatically adjusts the attack and release times of the noise reduction processor based upon the amount of transients in the input signal. It minimizes artifacts in the noise reduction processing while maintaining sharp transients that would normally be smeared by other methods.

  The frequency response display shows the spectrum of the input signal, noise floor, and output signal, so the frequencies being reduced are visible at a glance. A monitor feature plays back the noise that is being removed, with separate volume control. For most cases it is enough to select a preset and hit play, then set the Amount control. For fine tweaking, the noise floor and all the reduction parameters can be edited as a function of frequency by dragging control points on the frequency response display.

  MR Noise 6 is included in Master Restoration Suite 6.
specs: |-
  - Frequency spectrum based noise reduction
  - Low latency (under 20 msec), hence can be used in live situations
  - Fast noise floor learning time (down to 50 msec), hence noise looping is not required
  - Auto dynamics mode keeps transients sharp while avoiding squirrelly artifacts
  - Monitor feature to hear removed noise
  - Comprehensive display shows spectrum of input signal, output signal and noise floor
  - Noise floor can be manually edited
  - Parameters can be edited as function of frequency
  - Latency compensation via compatible hosts
  - Up to 192 kHz sampling rate
  - Mono or stereo
  - Requires a host program that supports audio plug-ins
  - iLok licensing is supported but not required
  - Macintosh formats: AU, VST3, AAX
  - macOS 10.13 (High Sierra) and higher
  - Apple Silicon natively supported (AU, VST3, AAX)
  - AAX on macOS requires Pro Tools 11 and higher
  - macOS: 64-bit hosts only
  - Windows formats: VST2, VST3, AAX
  - Windows 7/8/10/11
  - AAX on Windows requires Pro Tools 10.3.5 and higher
  - Windows: 32-bit and 64-bit hosts supported
