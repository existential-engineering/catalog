description: "Broadband noise reduction processor that distinguishes itself by
  being both great sounding and easy to use. Features auto-learning noise
  profile, Auto Dynamics mode for minimizing artifacts, and comprehensive
  frequency response display."
details: |-
  Frequency spectrum based noise reduction. Low latency (under 20 msec) for live use. Fast noise floor learning time (down to 50 msec). Auto dynamics mode keeps transients sharp. Monitor feature to hear removed noise. Comprehensive display of input, output and noise floor spectrums. Manually editable noise floor. Parameters editable as function of frequency. Latency compensation. Up to 192 kHz sampling rate. Mono or stereo.
specs: |-
  Mac: AU, VST3, AAX. macOS 10.13+, Apple Silicon native, 64-bit only. Windows: VST2, VST3, AAX. Windows 7/8/10/11, 32-bit and 64-bit. iLok supported but not required.
