description: MR Noise 6 is a stellar-sounding broadband noise reduction plugin that works in the frequency domain, automatically learning the noise spectrum for fast, transparent noise removal with low latency suitable for live applications.
details: |-
  MR Noise 6 offers frequency spectrum-based noise reduction that automatically learns the noise floor, enabling effective reduction without manual setup required in most cases. The plugin operates with extremely low latency (under 20 milliseconds), making it suitable for live processing as well as post-production work.

  The noise floor learning algorithm works in as little as 50 milliseconds, allowing quick setup even on short noise samples. Auto Dynamics mode intelligently preserves sharp transients while still reducing steady-state noise, helping maintain the natural feel of the audio.

  A Monitor feature lets users audibly isolate the removed noise signal, making it easy to verify that only unwanted noise is being attenuated rather than musical content. The frequency response display shows input, output, and noise floor spectra simultaneously for complete visual feedback.

  Manual noise floor editing is supported for cases where automatic learning needs refinement, and parameters can be adjusted on a per-frequency basis for surgical control. The plugin supports up to 192 kHz sample rates and operates in both mono and stereo configurations.

  On macOS, formats available are AU, VST3, and AAX. On Windows, VST2, VST3, and AAX are provided. Apple Silicon is natively supported on macOS 10.13 (High Sierra) and higher. Windows 7/8/10/11 are supported with both 32-bit and 64-bit hosts.
specs: |-
  - Frequency spectrum-based broadband noise reduction
  - Automatic noise floor learning in as little as 50 ms
  - Ultra-low latency under 20 ms — suitable for live use
  - Auto Dynamics mode preserves sharp transients
  - Monitor mode to audibly isolate removed noise
  - Frequency response display: input, output, and noise floor spectra
  - Manual noise floor editing with per-frequency parameter control
  - Supports up to 192 kHz sample rates
  - Mono and stereo operation
  - Latency compensation compatible with supported hosts
  - iLok licensing supported (optional)
  - macOS: AU, VST3, AAX; requires 10.13+; Apple Silicon native; 64-bit hosts only
  - Windows: VST2, VST3, AAX; supports Windows 7/8/10/11; 32-bit and 64-bit hosts
