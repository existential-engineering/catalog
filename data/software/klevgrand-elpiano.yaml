details: |-
  Elpiano (which simply means "Electric piano" in Swedish) is an electric piano plugin that feels alive under your fingertips. Designed to capture the soul and character of vintage electromechanical pianos, Elpiano delivers an expressive, dynamic playing experience that goes beyond static samples. It's both powerful and lightweight, delivering everything from silky-smooth, dreamy chords to punchy funk grooves with authentic feel and natural playability.

  Ten distinct piano models are included in Elpiano, each with its own sonic identity. From pristine, silky tones to gritty, well-worn textures, every model responds with depth and realism. Explore warm, bell-like chimes, dusty vintage timbres, or raw, overdriven growls, each sound has been carefully crafted with an almost obsessive attention to detail. Built-in effects, cabinets, and tone-shaping tools offer even more ways to sculpt your sound into something personal and unique.

  Every detail of Elpiano's playability has been fine-tuned to ensure a natural, expressive response. Whether you're laying down delicate jazz voicings, digging into funky rhythms, or crafting experimental textures, the instrument reacts with precision and nuance. The intuitive interface keeps everything within reach, letting you focus entirely on your music.

  Elpiano includes five cabinet models in both mono and stereo configurations, a collection of inspiring and diverse presets, and a range of built-in effects like drive, reverb, room simulation, delay, tremolo, vibrato, chorus and phaser. A classic EQ section adds warmth and presence.

  The ten included models are Skyline (clean, responsive with powerful dynamics), Gotown (gritty and hard-hitting), Precious (softer and gentler), Silky Way (smooth and silky, for ballads), Whirl (loads of bark, loads of funk), Unicorny (vintage character with worn charm), Picky (bright, percussive, for indie lo-fi), Arbor (harp-like with short release), Digilog FM (80's FM synth piano sound) and Unsound (raw, broken rock 'n' roll character).
specs: |-
  - 10 different piano models
  - 5 different cabinets, with mono- and stereo configuration
  - 50 various presets
  - Plenty of effects with smart functions (Reverb, Room, Delay, Chorus, Phaser, Tremolo, Vibrato)
  - Traditional vintage EQ
  - Drive control
  - Requires macOS 10.10 or later (optimized for the M1-processor), Windows 7 (SP1) or later, running a AU, VST3 or AAX compatible 64-bit host
  - iPad version available as Standalone and AUv3
