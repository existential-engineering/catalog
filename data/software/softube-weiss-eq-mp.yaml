  production with this mixing plugin.
details: |-
  There are equalizers with beaucoup bands and loads of features to fiddle with, and then there is equalizing so pared-down-precise that it cuts like a scalpel. Paging Weiss EQ MP.

  Developed through the thriving partnership between Softube and Weiss Engineering, the Weiss EQ MP is an equalizer honed for professional-grade use. Built on the minimum phase algorithm of the legendary Weiss EQ1, Softube designed EQ MP for exacting mixing applications that necessitate a surgical EQ and sound quality that's a cut above the rest. With seven bands, just like the acclaimed EQ1, Weiss EQ MP gives you that famous EQ1 transparency coupled with the sharpest accuracy possible. Achieve stunning clarity in your mixes with Weiss EQ MP, the sonic surgeon with the golden bands.

  The Weiss EQ1 is undoubtedly the standard for mastering engineers the world over. And when you can sample from the best, you damn well do so. Weiss EQ MP is based on the minimum phase algorithm of Weiss EQ1 and boasts some of the same features. Both can do it all, but Softube sharpened EQ MP for the mixing specialist.

  As with the chief of mastering, Weiss EQ1, the Weiss EQ MP features double-precision, 64-bit processing with internal oversampling using Weiss low-noise filter algorithms. It has the same seven full-range EQ bands with -39 to +18 dB cut/boost range with their incredible Q-range of 0.2 - 650.

  With the introduction of Weiss EQ MP, Softube presents Dunkel, or Dark Mode. The perfect complement to a dark DAW. To strengthen EQ MP as a professional mixing EQ workhorse, Softube also included the same user interface as the Weiss EQ1 in Large Screen mode and made the window resizable. Need just one or two bands? Resize the window down to only show what those bands are doing, or enlarge it to fit the entire screen.
specs: |-
  - Surgically precise, ultra-transparent, and high fidelity
  - Developed in collaboration with Weiss Engineering
  - Featuring the minimum phase algorithm and dual seven-band setup of Weiss EQ1
  - Seven full-range EQ bands with -39 to +18 dB cut/boost range
  - Q-range of 0.2 - 650
  - Low latency (17 samples at 44.1 kHz) and low CPU load
  - Double-precision 64-bit, low noise processing with internal oversampling
  - Dark Mode (Dunkel) GUI with resizable Large Screen user interface
  - Console 1 Ready: can be used within the Console 1 mixing system
  - Supports Softube Extended Features
  - Easy to use, with no learning curve
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Three activations
