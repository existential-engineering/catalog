description: A modern drum library featuring sharp edges rounded over and a
  beautiful warmth in the midrange. The kit comprises low-tuned, heavily muffled
  drums recorded in a small booth, paired with dark K cymbals offering earthy
  complexity and shimmering detail. Includes a built-in groove player, Master
  EQ, parallel compression, and reverb, with full NKS integration and Kontakt
  Free Player compatibility.
details: |-
  One Kit Wonder: Dry and Funky is one of our most 'analogue' sounding libraries to date, with the sharp edges rounded over and a beautiful warmth in the midrange. The vibe is strong with this one and we think it lends a huge amount of character and fun to any production you throw it into.

  One Kit Wonder: Dry and Funky is a modern take on a classic deep and dry drum sound, kick, snare and toms all low tuned and heavily muffled, and the whole kit recorded in a small booth for the ultimate in tight, short tones.

  The cymbals are a dark set of K's, offering just the right balance of earthy complexity and shimmering detail. With the kit recorded in such an acoustically inert environment, the separation and imaging are spectacular!

  The One Kit Wonder series was inspired by the many GGD users who use our libraries for songwriting. We know how crucial it is that there is as little time wasted between the moment inspiration strikes and you being able to capture it, and how important it is that you can hear your ideas sounding polished and professional so you stay excited as you develop them.

  It's our hope that this sample library will remove frustrating barriers in your creative process so that you can enjoy making music to the fullest.

  This instrument uses the latest version of Kontakt Player from Native Instruments. Installation and activation is managed via Native Access.
specs: |-
  - Requires Kontakt Player 6 or Kontakt 6 (latest version)
  - 2.6 GB disk space required (plus 1 GB for Kontakt Player)
  - 4 GB RAM minimum, 6 GB recommended
  - OpenGL 2.1+ graphics card
  - Mac OS X 10.14+ (64-bit): Standalone, VST, AU, AAX
  - Windows 10+ (32/64-bit): Standalone, VST, AAX
  - Internet connection required for activation; offline use supported after installation
  - Kit: 24x14" Ludwig Maple kick, 13x9", 14x10", 18x16" toms, 14x6.5" Ludwig snare, 14" Zildjian hi-hats, 16" and 18" crashes, 20" ride, shaker, tambourine, sticks
