details: |-
  PSP Twin-L is a dual algorithm classic limiter effect. The aim of this plug-in is to provide a wide variety of shaping options. PSP Twin-L is able to emulate the main features of two types of limiter: VCA-limiters, which is a modern type of analog limiter, and Opto-limiters which are vintage optical limiters.

  PSP Twin-L's limiting algorithms are not intended to emulate any specific hardware, but rather to bring the capabilities of both types into a versatile plug-in.

  PSP Twin-L is part of PSP's Zero Latency Processing plug-in series, making it ideal for situations such as live monitoring, live broadcast production, and managing levels while tracking.

  Running PSP Twin-L in 30-day trial mode or activating it requires a free iLok user ID and the free iLok License Manager application, but no hardware dongle. The license can be activated in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above), and can be moved at any time using the iLok License Manager.
specs: |-
  - Dual algorithm classic limiter
  - Emulates VCA-limiters, a modern type of analog limiter
  - Emulates Opto-limiters, vintage optical limiters
  - Limiting algorithms are not modelled on any specific hardware unit
  - Part of the PSP Zero Latency Processing plug-in series
  - Suited to live monitoring, live broadcast production and managing levels while tracking
  - Windows 7 to Windows 11, 64-bit host application
  - macOS 10.14 to macOS 15 Sequoia, Intel and Apple Silicon
  - AAX version requires Pro Tools
