details: |-
  Aspect 2 is a 32-note polyphonic software instrument. It combines a
  great-sounding subtractive synth engine with a versatile semi-modular
  architecture and simple, clean interface that allows practically anything to
  be used as a modulation source and destination.

  Features include flexible semi-modular architecture, scalable vector interface
  with three colour schemes (dark, light, and classic blue), 2 analogue-style
  oscillators, noise generator, 2 filters, 3 envelopes and mseg contour
  generators, and 3 sync-able lfos per voice.

  Drag and drop modulation with hundreds of modulation sources and destinations.
  Combine modulation sources with processors like mappers, quantizers,
  rectifiers, multipliers, lag generators, sample and holds, and many more.

  Unison mode allows stacking of voices for huge sounds. Intuitive interface
  simplifies building and understanding of complex patches. MIDI learn mode for
  easy integration with any MIDI hardware controller.

  Aspect 2 is a free upgrade for aspect 1 owners. Over 600 presets are included.
specs: |-
  - 32-note polyphonic
  - Subtractive synth engine
  - Semi-modular architecture
  - 2 analogue-style oscillators
  - Noise generator
  - 2 filters
  - 3 envelopes
  - Mseg contour generators
  - 3 sync-able LFOs per voice
  - Drag and drop modulation
  - Unison mode
  - MIDI learn mode
  - Scalable vector interface
  - Three colour schemes (dark, light, classic blue)
  - Over 600 presets
  - Modulation processors (mappers, quantizers, rectifiers, multipliers, lag
  generators, sample and holds)
