details: |-
  Albedo is a granular cloud reverb effect plugin. It constantly records incoming audio into a buffer, and at the same time runs up to 64 individual looping playheads called grains scattered within this buffer. All grains have their own random size and position, and as they are overlaid together, a lush "cloud of sound" effect is produced.

  Thanks to dual envelope generators per grain, playback speed has continuous adjustment with perfectly smooth transitions between forward and reverse directions enabling live audio manipulation much like on a tape machine or a turntable, including a fully stopped state.

  With a flexible multi-mode filter before the buffer recording stage, as well synchronous grain speed and size modulation, albedo is capable of a truly vast variety of effects: from melting pitch shifts and chaotic reversed delays, to chorus atmospheres and dark grimy dissonance.

  Albedo can also "freeze" its buffer and keep playing the granular cloud indefinitely, allowing you to layer the original input signal on top and making this plugin a great performance tool.

  Consistent name, mapping, value, and unit implemented for all parameters in both graphic user interface and host control/automation.
specs: |-
  - Real-time circular recording buffer with freeze and stereo link functions
  - Multi-mode state-variable filter
  - Up to 64 grains with randomized position and size
  - Bi-directional speed with variable detune
  - Dual envelope generators per grain
  - Selectable grain playback interpolation (linear and spline)
  - Sine-wave lfo for synchronous grain speed and size modulation
  - Lag filters on all continuous parameters
  - Mono to mono, mono to stereo, and stereo to stereo channel configurations
  - Color-coded graphic elements
  - Built-in preset management functions
  - Window size scaling up to 200%
  - AAX plugin format
  - Audio units plugin format
  - VST 3 plugin format
  - Macos 10.9 or later (64-bit intel and apple silicon)
  - Windows 8.1 or later (64-bit intel)
  - Linux support
