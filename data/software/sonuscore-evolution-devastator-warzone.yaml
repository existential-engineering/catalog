description: A premium sound effects library by Keepforest designed for professional composers and sound designers, featuring hand-crafted signature sounds including bass and braams, signals, drum loops, pulses, guns, one shots, cinematic loops, and artist stems. Built for film, TV, game design, and trailer composition with a modern, aggressive character.
details: |-
  Evolution: Devastator Warzone is the third chapter of the Evolution Devastator series, following the Action Twisted Industrial Toolkit and Deathmatch. It is a collection of hand-crafted custom signature sound effects, bass and braams, signals and signs, drum loops, pulses, guns and recharges, one shots, cinematic loops and artist stems, with a modern and aggressive character aimed at movie and game sound design as well as trailers and soundtracks.

  The WAV folder covers 17 trailer stems, a 38-piece modern drum kit, and loop banks running to 247 drum loops alongside bass and braams, signals and signs, and four families of pulses. The one-shot banks span bass (808 hybrid and modern, brass and stabs, distortion, fundamental and modern bass), drums (claps, cymbals, fills, guns and recharges, hi hats, kicks, rides, snares and toms), hits (booms, space hits, trailer hits) and tonal FX (downers, reversed FX, rises, signals, signs, wild screams and delayed variants).

  The playable Kontakt side carries trailer drums and hits with a Pulse Designer that accepts user imports, round-robin trailer drums, guns and burial kits, two drum machine instruments for modern and hybrid kits, and playable bass, tonal FX, pulse and lead instruments. A Rhythm sequencer and the Drum Machine are listed among the library's features.

  The library holds 7 GB of compressed samples at 48 kHz / 24 bit, is described as CPU-friendly, and unlike the earlier Devastator libraries it runs in the free Kontakt Player.
specs: |-
  - 7 GB of compressed samples
  - High-quality samples at 48 kHz / 24 bit
  - CPU-friendly for fast performance
  - Drum Machine instrument and a Rhythm (sequencer)
  - Pulse Designer with user sample import
  - WAV stems: 17 trailer stems
  - WAV drum kit: 38-piece modern kit
  - WAV loops: 62 bass & braams, 53 signals & signs, 247 drum loops, 25 distortion reverse pulses, 108 classic pulses, 63 hybrid pulses, 43 modern pulses, 35 low thump pulses
  - Bass one-shots: 20 hybrid 808, 57 modern 808, 36 brass & stabs, 40 distortion bass, 32 fundamental basses, 73 modern bass
  - Drum one-shots: claps and snaps, cymbals, 36 fills, 120 guns & recharges, hi hats, 57 kicks, 29 room kicks, rides, 66 snares, 25 live snares, 36 toms
  - Hit one-shots: 39 booms, 24 space hits, 86 trailer hits
  - Tonal FX one-shots: 19 downers, 35 reversed FX, 46 rises, signals and signs banks, 121 wild screams, 60 delayed wild screams, 28 whoa
  - Playable instruments across trailer drums and hits, drums, bass, tonal FX, pulses and playables
  - Supported host application: Kontakt 6 VST, AU, AAX, standalone
  - Requires Kontakt 6.5.2 or newer, and works with the FREE KONTAKT PLAYER
  - Windows 7, Windows 8 or Windows 10
  - macOS 10.12, 10.13 or 10.14
  - Available as a download only
