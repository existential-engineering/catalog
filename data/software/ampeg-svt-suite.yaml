details: |-
  SVT Suite brings authentic Ampeg SVT tone to your DAW (or runs as a standalone application) with a familiar Ampeg user experience. The plugin centers on three meticulously emulated SVT amp heads: the Heritage 50th Anniversary SVT, the SVT-4PRO, and the Heritage SVT-CL — giving players access to the full lineage of Ampeg's flagship bass tone in software form.

  Eight speaker cabinet emulations cover the entire SVT cabinet range, including the Heritage SVT-810AV, SVT-810 Squareback, SVT-610HLF, Heritage SVT-410HLF, SVT-212AV, SVT-210AV, SVT-112AV, and the SVT-15E. Dual-Cab and Dual-IR modes let you blend two cabinets or load your own impulse responses.

  Nine modeled studio microphones provide professional capture options. Six are moveable around the cabinet: a Neumann U47 model, Sennheiser MD421 model, AKG D112 model, Coles 4038 model, Electro-Voice RE20 model, and Royer R121 model. Three stationary room mics add room depth, and an SVT-DI parallel signal can be blended in alongside the miked cab.

  Five built-in effects pedals expand the tonal palette: the Liquifier analog chorus, Opto Comp optical compressor, Scrambler bass overdrive, Rocktaver octave divider, and Phasifier phase-shifter. Over 50 factory presets — including Artist and Producer presets — provide ready-made starting points, and an integrated tuner is built in.

  SVT Suite runs on Mac (with Apple Silicon support) and Windows in AU, VST, and AAX formats, as well as as a standalone application. A 15-day free trial is available from Ampeg's software downloads page.
specs: |-
  - 3 SVT amp head models (Heritage 50th Anniversary SVT, SVT-4PRO, Heritage SVT-CL)
  - 8 speaker cabinet emulations
  - 9 studio microphones (6 moveable, 3 stationary room mics)
  - 5 effects pedals (Liquifier, Opto Comp, Scrambler, Rocktaver, Phasifier)
  - 50+ factory presets including Artist and Producer presets
  - Dual-Cab and Dual-IR modes with user IR loading
  - SVT-DI parallel signal output
  - Integrated tuner
  - Apple Silicon native support
  - Standalone application and plugin formats
  - 15-day free trial available
