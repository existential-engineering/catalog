description: Acon Digital Multiply is a free chorus and voice doubling plug-in with unique phase randomizing filters. Multiply is available for PC and Macintosh and supports the VST, VST3, AAX and AU plug-in formats.
details: |-
  Our take on the classic chorus effect, Multiply is built to sidestep the thin, watery comb-filtering that plagues conventional plug-ins. Each of its simulated voices runs through a phase-randomizing filter, so you get lush, natural thickening instead of the metallic swirl typical of ordinary chorus plugins.

  Whether you're stacking voices to mimic a room full of performers playing in unison, widening a mono source into a full stereo image, or reaching for something stranger in sound design, Multiply gives you the range to do it. Up to six additional voices, independent pitch and loudness modulation, a built-in five-band equalizer and a modulated pre-delay section put the full character of the effect in your hands.

  Phase-Randomized Voice Engine: Multiply simulates up to six extra voices, each processed with a dedicated phase-randomizing filter that eliminates the harsh comb-filtering artifacts common to conventional chorus effects. The result is a naturally thick, believable sense of multiple performers playing together, rather than the brittle, hollow sound typical of simpler designs.

  Independent Pitch & Loudness Modulation: Separate frequency and amplitude modulation controls, each with its own rate and depth, let you shape exactly how the simulated voices drift and breathe. Push them subtly for gentle, organic movement, or push them hard for wide, unstable textures, giving you precise control over how alive the effect feels.

  Integrated Equalizer & Modulated Pre-Delay: A built-in five-band equalizer (low cut, low shelf, mid bell, high shelf, high cut) with adjustable filter slopes lets you sculpt the effect signal directly within Multiply, no extra plugin needed. Paired with an integrated pre-delay section, it opens the door to modulated, diffuse echo effects alongside classic chorus and widening duties.
specs: |-
  - Chorus effect with up to six separate voices
  - Randomized phase filters in order to avoid comb filtering effects while keeping delay times short
  - Amplitude modulation
  - Frequency modulation
  - Adjustable pre-delay
  - Integrated equalizer for the effect signal
  - Graphical visualization of equalizer frequency response
  - Undo and redo parameter changes
  - A/B comparisons
  - Preset manager
  - Save, load and categorize user presets
  - Supports sampling rates up to 96 kHz
  - Mono and stereo (true stereo processing)
  - Native 32 bit or 64 bit versions of all plug-ins are available
  - Windows: Windows 11, Intel Core i5 or AMD Ryzen 5 (or faster) multi-core processor, 1920 x 1080 display resolution or higher, 4 GB RAM, 1 GB free HD space
  - macOS: macOS 12 (Monterey) or later, runs natively on Apple Silicon (ARM64) and Intel, 4 GB RAM, 1 GB free HD space
  - Host must be compatible with 64 bit VST3, AAX (Pro Tools 2021 or higher) or, on macOS, AU
