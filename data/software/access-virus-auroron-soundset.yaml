details: |-
  Luke terry makes a return with new access virus soundset after the successful hyperboreal bank. This bank contains 123 pristine presets, which continue where the previous bank were left off. This bank is compatible with all virus models from virus hardware to virus powercore and virus ti.

  The soundset is primarily focussed on trance music and a lot of the sounds are lifted straight from the creator's upcoming album. As always, the soundset is all killer, no filler. It is very much a pure soundset designed to help you making music.

  There are quite a few more sounds in this set that have the velocity linked to the filter to help give the human touch for live playing. The sounds are pretty much all ready to be dropped in to your track with minimal fiddling.

  The soundbank has been designed on the access virus kc model and should import perfectly into any c / ti range. There may be some loss of function on the older a / b / classic synths.

  The soundbank has been brought to life on the aura plugins access virus editor. Simply import the .mid or .syx into the VST after hooking it up to your synth and enjoy. Requirements (one of the following models): access virus b, kb, rack, indigo. Access virus c, kc, rack xl, indigo2. Access virus ti desktop, keyboard and polar (series 1 & 2). Tc electronic virus powercore.
