details: |-
  BASS-FACE is a 'one-knob' style multi-effect plug-in designed to add presence
  and distortion to your sound. With 3 modes to select from, each increasing in
  drive and presence, BASS-FACE can add a gentle lift or face-melting heat to
  whatever you feed it.

  A simple interface and huge sound, bass-face is designed as an enhancer /
  drive unit, processing several effects to add character, drive, width,
  modulation and presence to your sounds.

  Type 1 gentle presence, space and subtle modulation. Type 2 saturation,
  presence, space and subtle modulation. Type 3 drive, presence and subtle
  modulation.

  Clip adds a no-frills hard clipper to the end of the signal chain. Xtra boosts
  the spacial and modulation effects.

  Bass-face by dhplugins is a virtual effect audio plugin for macos and windows.
specs: |-
  - One-knob style multi-effect
  - 3 modes
  - Hard clipper
  - Spatial effects
  - Modulation effects
