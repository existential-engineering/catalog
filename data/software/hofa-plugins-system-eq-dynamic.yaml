description: SYSTEM EQ-Dynamic is a dynamic equalizer offering up to 11 EQ bands with intelligent adaptive attack and release times, combining equalization with compressor and limiter gain reduction capabilities for precise, automatic sound shaping.
details: |-
  EQ-Dynamic offers you 9 different filter types. In addition to conventional filters you'll also get resonant shelves for vintage EQing and a flat band. This can be used for compression, limiting and gain adjustments.

  With the threshold control you can adjust the dynamic function for each frequency band. Adaptive attack and release times automatically ensure optimal sound.

  There are two types of dynamic gain reduction available. Comp has a classic compressor characteristic while Lim has a higher ratio that can be used for harder limiting in the selected frequency band.

  The SYSTEM EQ-Dynamic offers a high-resolution real time analyser in addition to the classic frequency band view. You can make all EQ and dynamics adjustments in this window as well.

  All plugins from the HOFA SYSTEM series are also available as freeware with a slightly limited feature set. Simply install HOFA SYSTEM using the HOFA-Plugins Manager. You can then use all freeware features immediately. The freeware version of SYSTEM EQ-Dynamic offers 1 band and a fixed Q factor of 12, while the full version offers 11 bands and a Q factor from 0.1 to 36.
specs: |-
  - Up to 11 dynamic EQ bands
  - Ultra-musical behavior thanks to intelligent algorithms
  - 9 different filter types, 6 of them dynamic
  - Dynamic bell filter
  - Dynamic low shelf & resonant low shelf
  - Dynamic high shelf & resonant high shelf
  - Dynamic flat mode
  - High-pass, low-pass and band-pass
  - Adjustable threshold per band, from -80 to 0 dB
  - Adaptive attack and release times
  - Comp and Lim dynamic gain reduction modes
  - Lookahead can be activated
  - Large EQ curve display with precise real-time analyser
  - Usable as a single plugin or in HOFA SYSTEM
  - Also available in a freeware version with slightly reduced feature set
  - Two licenses, managed via the HOFA Plugins Manager, offline activation possible
  - Operating System: macOS 10.13 or later, Windows 10 or later
  - 14 days free trial
