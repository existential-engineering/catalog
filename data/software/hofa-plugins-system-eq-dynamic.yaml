details: |-
  Adaptive control times for perfect sound shaping Up to 11 dynamic EQ bands Ultra-musical behavior thanks to intelligent algorithms 9 different filter types, 6 of them dynamic Precise Real-Time Analyzer Usable as a single plugin or in HOFA SYSTEM Also available in a freeware version with slightly reduced feature set You are currently viewing a placeholder content from YouTube . To access the actual content, click the button below. Please note that doing so will share data with third-party providers. More Information Unblock content Accept required service and unblock content 9 Different Filter Types EQ-Dynamic offers you 9 different filter types. In addition to conventional filters you’ll also get resonant shelves for vintage EQing and a flat band. This can be used for compression, limiting and gain adjustments. Dynamic bell filter Dynamic low shelf & resonant low shelf Dynamic high shelf & resonant high shelf Dynamic flat mode High-pass Low-pass Band-pass Adjustable Dynamic Function With the threshold control you can adjust the dynamic function for each frequency band. Adaptive attack and release times automatically ensure optimal sound. Compressor and Limiter There are two types of dynamic gain reduction available. Comp has a classic compressor characteristic while Lim has a higher ratio that can be used for harder limiting in the selected frequency band. Large EQ Curve Display with Analyser The SYSTEM EQ-Dynamic offers a high-resolution real time analyser in addition to the classic frequency band view. You can make all EQ and dynamics adjustments in this window as well. Freeware version All plugins from the HOFA SYSTEM series are also available as freeware with a slightly limited feature set. Simply install HOFA SYSTEM using the HOFA-Plugins Manager. You can then use all freeware features immediately. Here is an overview that shows the differences between the SYSTEM EQ-Dynamic freeware and the full version: Feature Available in the freeware Available in the full v
