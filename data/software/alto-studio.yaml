details: |-
  With Alto Studio, make sure that all your localized dialogue files are in the
  right format, at the right level, have the correct duration and that nothing
  is missing, in all languages. Whatever your naming convention or file
  hierarchy is, Alto Studio analyzes your dialogue files and if needed compares
  them with a reference language, reporting any errors it finds and even
  correcting them.

  Alto studio can also import the lines from an excel sheet, or synchronize with
  game audio projects from middleware such as wwise, fmod, adx2 and fabric. Not
  only does alto studio check for missing or misnamed files, but it will also
  make sure that the audio format of each file is correct (sample rate, bit
  depth, number of channels), compare the average and peak loudness, the
  duration, leading or trailing silence of the files, and even the timbre of the
  voices.

  Alto studio generates complete error reports and statistics (in xml, HTML, PDF
  or excel format) that you can then give to your client or manager. Finally,
  alto studio is packed with very useful tools such as an audio batch renamer, a
  loudness equalizer, an interactive dialogue tester, a placeholder speech
  synthesizer and a vocal effect processor (voicefx) to mention just a few.

  It also integrates seamlessly with facefx from oc3 entertainment for lipsync
  and tsugi's own audiobot for audio batch processing. Setup for single language
  analysis or multi-language comparison. Adjust the range of the analyses and
  corrections. Customize your reports.

  Validate your audio files automatically as they are delivered. Highly
  optimized processing (can handle hundreds of thousands of files in minutes).
  Leverage multi-core architectures. Many data acquisition and packaging
  options. Command line interface. Plug-in system (import, processing, export).
  Reports available in various formats.
