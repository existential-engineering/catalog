description: TRANSFORCE is a transient shaper plug-in designed for sound designers and music producers, processing attack and sustain as independent signals with parametric EQ across multiple bands and individual saturation controls. It features a Spectral Slider for tonal-vs-broadband separation, Stylize/Clipper/Limiter modules, up to 4× oversampling, and user-adjustable look-ahead transient detection.
details: |-
  TRANSFORCE is a transient shaper plug-in for designers and producers who want both punch and control without the usual trade-offs. Where most transient tools force the sustain up whenever the attack is pushed, TRANSFORCE splits attack and sustain into two signals that are shaped separately, each with its own parametric EQ across multiple bands and its own saturation. The low end of the attack can be shaped while rumble is removed from the sustain at the same time.

  The Spectral Slider separates the tonal resonances in a signal from its noise content and lets each be processed across attack and sustain independently. On a sci-fi element that means adding tonal character to the attack while leaving the sustain clean; on a guitar, pulling the pick attack off the front of the note without touching the body; on a snare, shaping the ring without touching the crack. A transient section with hold, decay and a sidechain trigger input handles signal interaction, and a Stylize module, a Clipper and a Limiter finish the chain.

  The plug-in is built for the work sound designers actually do: footsteps that land without losing weight, impacts that punch through without burying what surrounds them, dialogue with plosives pulled cleanly off the front of each line, and whooshes and risers whose leading edge stays sharp while the bloom of the sustain is controlled separately. AudioSuite support allows batch processing of SFX libraries in Pro Tools, and the presets are drawn from real production sessions.

  The same processing applies to any material where attack and sustain behave differently, so it works equally in music production on drum busses, guitars, piano and vocals. Transient detection uses look-ahead, so the plug-in always adds some latency; the amount is user-adjustable to balance accuracy against latency but cannot be set to zero, and modern DAWs compensate automatically. A fully functional 14-day trial is offered alongside the full version.
specs: |-
  - Independent parametric EQ on attack and sustain, with multiple bands per module
  - Per-module saturation
  - Spectral Slider for tonal-vs-broadband separation across attack and sustain
  - Transient section with hold, decay and sidechain trigger input
  - Stylize, Clipper and Limiter modules
  - Up to 4x oversampling
  - Look-ahead transient detection (user-adjustable latency, cannot be set to zero)
  - Full parameter automation
  - Presets drawn from real production scenarios
  - VST 3, AU, AAX Native and AudioSuite; AAX DSP is not supported
  - Native Apple Silicon support
  - NKS-ready
  - Required hard disk space: 124 MB
  - Available as: Download
  - Windows: Windows 10 (64-bit), 8 GB RAM, Intel Core i5 (relatively recent)
  - Mac: macOS 10.15, 4 GB RAM, Apple Silicon or Intel Core i5 (relatively recent)
  - Fully functional 14-day trial available
