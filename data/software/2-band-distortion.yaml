details: |-
  2-band distortion is a crossover frequency splitter followed by a distorting waveshaper in each band.

  Features customisable linkwitz-riley crossover filter with up to 192 db/oct capability and smooth harmonic distortion.

  Mathematically optimised using psychoacoustical evaluated approximation functions.

  Open source as part of christian's delphi asio & VST project.
specs: |-
  - Crossover frequency splitter
  - Distorting waveshaper
