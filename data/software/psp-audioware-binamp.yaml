description: A Class A triode preamplifier plugin inspired by the legendary Binson Echorec 2 delay unit. Delivers rich, easily controllable saturation suitable for drums, vocals, electric pianos, synthesizers, and drum loops. Features a high-pass filter, high-frequency rolloff, drive and output level controls, input pad, polarity switching, blend control, and internal quad sampling up to 192 kHz with only 13 samples latency.
details: |-
  PSP BinAmp is a Class A triode preamp emulation inspired by the Binson Echorec 2. Requires a free iLok user ID and iLok License Manager for licensing, with activation available on up to 3 locations. Compatible with Windows 7-11 (64-bit) and macOS 10.14-15 Sequoia (64-bit). Supports Intel and Apple Silicon Macs. A 30-day demo is available.
specs: |-
  - Platforms: macOS (Intel and Apple Silicon), Windows 7-11 (64-bit)
  - Formats: AU, VST2, VST3, AAX
  - Latency: 13 samples
  - Internal oversampling: quad (up to 192 kHz)
  - Supported sample rates: up to 384 kHz
  - Drive range: +-20 dB
  - Output level range: +-20 dB
  - Input pad: -20 dB
  - Licensing: iLok License Manager (3 activations)
