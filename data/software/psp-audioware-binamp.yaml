description: "A Class A triode preamplifier emulation based on the legendary
  Binson Echorec 2 delay, delivering rich, easily controllable saturation."
details: |-
  Internal quad sampling up to 192 kHz. High-pass filter and high-frequency rolloff control. Drive level control +/-20 dB with -20 dB input pad. Output level control up to +/-20 dB. Polarity switching (input/output). Blend control for saturated/unsaturated signals. Variation setting for multiple instances. 13 samples latency. Supports up to 384 kHz sample rates.
