details: |-
  Ample bass upright is based on a upright bass. Commonly used in jazz, blues, funk, and similar styles, the upright bass is considered one of the most iconic and soulful instruments in jazz music.

  Riffer 4: a MIDI editor tailored for plucked string instruments with dual view modes offering seamless real-time switching between piano roll and guitar tab views, a first of its kind, providing two perspectives for reviewing and editing compositions.

  String visualization system enables MIDI writing that adheres to authentic plucked instrument techniques by automatically preventing polyphony on the same string and intelligently assigning fingering, resulting in MIDI that sounds closer to real performance.

  Polyphonic legato and slide smoother enables realistic legato across any interval and speed with a slide system specifically designed for fretless instruments.

  Tab reader 4 supports guitar pro files from gp3 to guitar pro 8 and is capable of importing entire bass tracks into riffer with full retention of fingering, articulations, and performance data.
