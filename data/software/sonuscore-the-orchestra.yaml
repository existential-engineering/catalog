description: THE ORCHESTRA is a revolutionary orchestra library whose heart is our breakthrough Ensemble-Engine that empowers you to convert your ideas into music. It features 80 players recorded in Budapest at Studio 22 with true legato interval sampling and 192 ready-to-go ensemble presets.
details: |-
  THE ORCHESTRA is an all-in-one 80 player orchestra library built around the Ensemble Engine, a system of independent arpeggiators and velocity envelopes heavily inspired by Sonuscore's Origins series. Rather than relying on pre-recorded phrases, it generates pulsating rhythms and full arrangements from any combination of notes played, so it responds to whatever chord or note is used. Up to 5 different instruments can be loaded at once in independent slots, each slot assigned one of five different modules.

  The library ships with 192 presets across three categories. Orchestral Colors are practical instrument combinations that can be played live from the keyboard, Orchestral Rhythms are simple playable patterns for separate sections of the orchestra that use the Ensemble Engine, and Animated Orchestra presets go further and create complex orchestrated rhythms from any played note. Version 1.1 added a way to save, organize and share user presets for the Ensemble Engine. On the Engine page every individual control for each of the five instrument modules is accessible: short notes are arranged with the arpeggiators and its rhythm stepper, while sustained notes are shaped with a velocity envelope whose shape can be drawn freely.

  Aside from the Ensemble Instrument, THE ORCHESTRA contains 88 single instrument patches covering all standard sections and articulations in a symphonic orchestra, including percussion and a bonus choir, so full and detailed orchestrations can be written from scratch. Ensemble-Multi patches load and layer multiple instances of the library: playable full orchestral multis for single articulations suit quick sketching and layering, while Orchestral Rhythm and Animated Orchestra multis combine multiple instances of the Ensemble Engine for more complex patterns.

  The samples were recorded and processed with the intention of sounding rougher and more honest than the common orchestra library's Hollywood sound, aiming for straight and powerful sounds with punch. The instruments were recorded in Budapest at Studio 22 in their traditional seating position and mixed and edited so the different sections blend together in the same room. All essential articulations are present, including playable true legato samples and multiple round robins for short articulations.
specs: |-
  - 80 player orchestra library
  - Breakthrough Ensemble Engine with independent arpeggiators and velocity envelopes
  - Up to 5 instruments loaded at once in independent slots, each assigned one of five modules
  - 192 ready-to-go ensemble presets in three categories: Orchestral Colors, Orchestral Rhythms and Animated Orchestra
  - 75 Multi-Rack Patches
  - 88 single instrument patches covering all standard orchestral sections and articulations, including percussion and bonus choir
  - Complete set of standard articulations for all instruments
  - True Legato Interval Sampling
  - Multiple round robins for short articulations
  - User preset save, organize and share system (introduced in version 1.1)
  - Arpeggiator with rhythm stepper and freely editable parameters
  - Velocity Envelope with freely drawable envelope shape
  - 16500+ individual samples
  - 6.85 GB of data (10 GB uncompressed)
  - Fast loading times
  - Recorded in Budapest at Studio 22 in traditional orchestral seating position
  - Works with the FREE KONTAKT PLAYER
  - Requires KONTAKT 5.7.1 or higher
  - Mac OS X 10.10 or higher, Intel Core 2 Duo
  - Windows 7 or higher, Intel Core 2 Duo or AMD Athlon 64 X2
  - 4 GB RAM
  - At least 7 GB of free hard disc space
