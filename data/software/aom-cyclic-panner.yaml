description: Cyclic Panner is an unique pan/width control tool based on axis transformation. Common panners employs channel gain-based panning, however, it often reduces stereo width at the left/right ends of panning.
details: |-
  Cyclic Panner is a pan and width control tool built on axis transformation rather than the channel gain-based panning most panners use. Gain-based panning often narrows stereo width as a source approaches the left or right end of the image, and the axis transformation approach is what Cyclic Panner uses to avoid that.

  Using Cyclic Panner, the material's sound field is retained even when it is placed at the left or right end of the sound field. A pan-linked low-pass filter makes the "lowpass-ing opposite channel" panning technique dramatically easy, and a visual display of the sound field helps the user understand the current sound field intuitively. The plugin is also stated to have very low CPU load.

  On Windows the plugin runs on an x64-compatible CPU under Windows 11 24H2 and 25H2, in VST2, VST3, AAX-Native and CLAP formats. On Mac it runs on Intel and Apple Silicon under macOS Monterey 12 through macOS Tahoe 26, adding Audio Unit to the same format list.

  Common specifications across A.O.M. plugins apply: sample rates from 44.1 kHz to 384 kHz, 64-bit floating-point internal precision, latency compensation, factory and user presets, snapshots, undo/redo and reset to default. Version 1.7.3 added support for a 1-in/2-out configuration.
specs: |-
  - Unique panning / width control tool based on axis transformation
  - Visual display of sound field
  - Pan-linked low-pass filter
  - Very low CPU load
  - Supports 44.1k - 384kHz sample rate
  - 64-bit floating-point internal precision
  - Latency compensation
  - Factory preset, user preset and snapshot
  - Undo/redo and reset to default
  - 1in/2out configuration supported
  - Windows: x64-compatible CPU, Windows 11 24H2 / 25H2
  - Mac: Intel / Apple Silicon, macOS Monterey 12 to macOS Tahoe 26
