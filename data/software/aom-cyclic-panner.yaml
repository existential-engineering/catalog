description: An innovative pan/width control tool using axis transformation
  technology that maintains stereo width even at extreme panning positions, with
  pan-linked lowpass filtering.
details: |-
  Cyclic Panner is a panning and stereo width control plugin that uses a unique
  axis transformation approach instead of traditional channel gain-based
  panning. This allows it to maintain stereo width even at extreme panning
  positions.

  The plugin includes a visual sound field display for real-time feedback on
  stereo positioning. A pan-linked low-pass filter applies lowpass filtering to
  opposite channels, simulating the natural frequency response differences heard
  when sounds originate from different positions.

  Designed for minimal CPU consumption, Cyclic Panner is efficient enough for
  use across many tracks in a session. The plugin provides an alternative
  approach to stereo placement that goes beyond what conventional pan knobs
  offer.

  All processing operates at 64-bit floating-point precision with support for
  sample rates from 44.1kHz to 384kHz.
specs: |-
  - Axis transformation-based panning (not channel gain)
  - Maintains stereo width at extreme pan positions
  - Visual sound field display
  - Pan-linked low-pass filter
  - Minimal CPU consumption
  - Sample rates: 44.1kHz to 384kHz
  - 64-bit floating-point internal precision
