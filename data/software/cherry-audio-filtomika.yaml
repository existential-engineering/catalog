description: Filtomika is a filter effect plugin that emulates the fiendish
  filter of the Polivoks synthesizer, and based on the advanced multi-mode
  filter from Cherry Audio's award-winning Atomika synthesizer.
details: |-
  Filtomika is an effect plugin that emulates the wild filter section of the 1980s Soviet Polivoks synthesizer and is based on the expanded multi-mode filter introduced in Cherry Audio's award-winning Atomika virtual instrument.

  Featuring circuit-modeled DSP designs by the acclaimed developer Mark Barton, Filtomika also includes other methods from Atomika that go beyond the original hardware. These enhancements include an extended selection of waveforms for its syncable modulator, additional filter response modes, and Atomika's unique Starve, Filter Drive, and Amp Drive controls, further expanding its twisted sound palette.

  With Filtomika, you can process any sound, whether it's drums, guitars, other synthesizers, or even vocals, and achieve the radical, often mysterious sonic results characteristic of Atomika.

  The plugin features a user-friendly preset browser with over 30 production-ready presets and offers comprehensive MIDI control and DAW automation, complete with intuitive MIDI learn and mapping capabilities. It can be used as an insert or bus effect and is fully compatible with mono and stereo sources.
specs: |-
  - Faithful virtual analog emulation of the programmable op-amp filter designed by sound engineer Vladimir Kuzmin, expanded with numerous new features for modern music producers
  - Features the precision-crafted and circuit-modeled DSP designs of award-winning developer Mark Barton
  - Reproduces the Polivoks' distinctive filter and extends it with new controls unavailable in the original hardware: Starve, Filter Drive, and Amp Drive, plus highpass, notch, and peak responses in addition to standard lowpass and bandpass modes
  - Syncable LFO Modulator with ramp, sawtooth, triangle, square, noise, and random (sample & hold) waveforms
  - Envelope Follower allows the relative amplitude of input signals to control cutoff frequency, useful with guitar and bass, and drum loops for autowah-type effects
  - Usable as an insert or bus effect
  - Compatible with mono or stereo input sources
  - Preset browser with over 30 Presets for Drums, Guitars, SoundFX, and Synths, with favoriting and user presets
  - Complete MIDI control and DAW automation for all controls, with per-preset or global MIDI learn and mapping
  - Focus zoom-in feature, as well as standard UI zoom and resize via drag
  - Complete documentation available directly online from the plugin or in downloadable PDF format
  - Highly optimized DSP for optimal performance
  - macOS 10.13 or above, 64-bit required, native Apple M1 or greater processor support
  - Windows 7 or above (including Windows 11), 64-bit required
  - Hard disk space: 25 MB
  - Internet connection required for product activation
