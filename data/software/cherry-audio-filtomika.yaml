details: |-
  Filtomika is an effect plugin that emulates the wild filter section of
  the 1980s Soviet Polivoks synthesizer and is based on the expanded
  multi-mode filter introduced in Cherry Audio's award-winning Atomika
  virtual instrument.

  Featuring circuit-modeled DSP designs by the acclaimed developer Mark
  Barton, Filtomika also includes other methods from Atomika that go
  beyond the original hardware. These enhancements include an extended
  selection of waveforms for its syncable modulator, additional filter
  response modes, and Atomika's unique Starve, Filter Drive, and Amp
  Drive controls.

  With Filtomika, you can process any sound—whether it's drums, guitars,
  other synthesizers, or even vocals—and achieve the radical, often
  mysterious sonic results characteristic of Atomika.
specs: |-
  - Virtual analog emulation of programmable op-amp filter
  - Circuit-modeled DSP by Mark Barton
  - Multiple filter modes: lowpass, bandpass, highpass, notch, peak
  - Syncable LFO Modulator with multiple waveforms
  - Envelope Follower for amplitude-controlled cutoff
  - Starve, Filter Drive, and Amp Drive controls
  - Usable as insert or bus effect
  - Mono and stereo compatible
  - 30+ production-ready presets
  - Complete MIDI control and DAW automation
