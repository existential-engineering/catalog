description: Atlantis consists of Atlantis synthesizer, a VST instrument, and
  Atlantis filter delay, a powerful VST effect plug-in.
details: |-
  3 true stereo morphing oscillators, with independent width, phase, spread,
  chorus, tuning, volume, envelope and panning feed into a pair of filters (with
  standard algorithms and many unique new ones), a shaper (distortions and
  beyond), and a simple room modelling multi-tap filtered delay system with
  another pair of selectable filters.

  The routing of the filters and shaper can also be switched into a variety of
  configurations for further flexibility. All the standard waveforms you would
  expect (sin, square, triangle, saw, noise) - and you can also import any
  waveform you like. Simply add a .wav file with the waveform you want to hear
  to the c:\chips folder - stereo or mono, any samplerate or bitdepth you like,
  and atlantis will let you use it for oscillators and lfos. Samples are
  upsampled into high resolution wavetables.

  Every slider parameter can be controlled by any modulator. Lfos, envelopes,
  MIDI control data, the current note, velocity, or combinations of them can be
  used to modulate your sounds into "expressive organic creations".

  The synth also offers selectable polyphonic, monophonic, portamento and
  arpeggio modes.
specs: |-
  - 3 true stereo morphing oscillators

  - Independent width, phase, spread, chorus, tuning, volume, envelope and
  panning

  - Pair of filters with standard and unique algorithms

  - Shaper with distortions

  - Room modelling multi-tap filtered delay system

  - Selectable filters

  - Configurable filter and shaper routing

  - Standard waveforms: sin, square, triangle, saw, noise

  - Custom waveform import via .wav files

  - High resolution wavetables

  - Lfo modulation

  - Envelope modulation

  - MIDI control data modulation

  - Velocity modulation

  - Polyphonic mode

  - Monophonic mode

  - Portamento mode

  - Arpeggio mode

  - VST plugin format

  - Windows compatible

  - 64-bit support
