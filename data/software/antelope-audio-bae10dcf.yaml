details: |-
  BAE 10DCF originates from the end of the 1960s. Taking the best from a legendary line of broadcasting units, this stereo compressor has been turned into an extremely versatile processor. This official emulation of a classic vintage unit can be used as both a limiter and compressor. It features individual control over both components, with the limiter coming first in the signal chain. With dedicated knobs for Threshold, Ratio, Bypass Filter, Attack, and Recovery for both modules users can achieve enough depth when sculpting the perfect sound.

  BAE 10DCF allows you to keep compression transparent and smooth or completely transform the input signal into the signature vivid sound of the compressor. A Gain Make-up knob allows you to additionally control the signal volume. BAE 10DCF is a multi-purpose unit that can be used both during tracking or in post-production. As you can guess, it does an absolutely great job on an array of instruments like drums and percussion and is suitable for recordists, producers, and mastering engineers but podcasters and vloggers who need their voices polished and neatly produced as well.

  The 10DCF features a fully independent Compressor and a separate Limiter providing maximum flexibility and dynamic control over any source and any type of material. Dynamic processors that offer such a variety of control are often clean and colorless. In contrast, the 10DCF offers that same versatility and control, but also character and color. We have carefully modeled the subtle harmonic distortion of the Carnhill & Jensen transformers that give BAE its iconic sound.

  We also recreated that same Bypass Filter inspired by the B182 card of a 1073. That is essentially an EQ filter using a Carnhill Inductor providing smooth, transparent, and musical filtering. In the case of the 10DCF, that filter acts as a side-chain to the compressor. That feature alone expands the versatility of the 10DCF to not only recording & mixing applications but also mastering.

  Another unique feature of the 10DCF, which can be found on the Recovery switches both for the Compressor and Limiter, are two automatic release times. Recovery A1 (100 mS isolated peaks, 2 sec prolonged levels) and Recovery A2 (50 mS isolated peaks, 5 sec prolonged levels) combined with the Bypass Filter and a variety of Ratio and Attack options make the 10DCF a true 'get out of jail' card for the mix bus. Other popular applications include vocals and guitars: the 10DCF can add urgency to highly dynamic pop and hip-hop vocals while preserving clarity, and similar treatment on rock guitars can make the whole track jump out of the speakers.
specs: |-
  - Stereo Compressor / Limiter plugin emulation of a late-1960s broadcast unit
  - Separate, fully independent Compressor and Limiter modules with the Limiter first in the signal chain
  - Per-module controls: Threshold, Ratio, Bypass Filter, Attack, Recovery
  - Two automatic Recovery settings: A1 (100 mS / 2 sec) and A2 (50 mS / 5 sec)
  - Gain Make-up knob for output level control
  - Modeled harmonic distortion of Carnhill & Jensen transformers
  - Bypass Filter side-chain EQ inspired by the 1073 B182 card with Carnhill Inductor
  - Runs natively in your DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core interfaces
