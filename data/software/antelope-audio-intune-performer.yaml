description: "Tune vocals fast with InTune Performer - a real-time pitch
  correction plugin with scale selection, adjustable strength, and transparent
  delay control."
details: |-
  Fast, transparent pitch correction for natural or stylized vocal results, designed for quick setup with scale-based tuning.

  Scale-Based Real-Time Tuning: choose between chromatic, major, or minor scales to lock vocals to key and maintain musicality. Suited for both corrective tuning and intentional pitch manipulation.

  Adjustable Pitch Correction Strength: use the Strength knob to control how tightly the vocal is tuned, from transparent assistance to fully locked correction, for both subtle enhancement and creative effects.

  Delay Control for Natural Transitions: smooth out pitch shifts and avoid robotic jumps with the Delay knob. Fully clockwise settings offer the most transparent, organic correction, ideal for natural vocals.

  Insert and Go: no need for piano roll or manual note editing. Load the plugin on a vocal track, set the scale, and InTune Performer handles the rest.

  Creative or Invisible Results: clean transparent pitch support or iconic stylized vocal effects, suited for modern pop, hip-hop, EDM, and beyond.

  Runs natively in your DAW on macOS or Windows.

  Included in the Antelope Cosmos plugin collection (75+ Antelope Native Plugins).
specs: |-
  - Scale modes: chromatic, major, minor
  - Strength knob for adjustable pitch correction intensity
  - Delay knob for smoothing pitch transitions
  - Real-time, insert-and-go workflow (no manual note editing)
  - Native plugin formats: VST3, AU, AAX
  - Supported on macOS and Windows
