details: |-
  Apollo Remote Recorder is an innovative iOS app that will change how you make
  music. It can capture sound from other apps using audiobus, or audio from any
  iOS compatible input. Recordings are triggered with MIDI, and can be
  transferred to the desktop using the web server built into the app. The app
  can also stream audio over Wifi to other iOS devices, to pcs, and to macs.

  Apollo remote recorder is designed to bridge the gap between ios and the
  professional desktop DAW world. The app uses audiobus to let you easily record
  synthesizers (with the recording happening on ios, to avoid latency). The app
  features a built-in web server, which lets you transfer recordings to the
  desktop with an ordinary web browser. MIDI sent your DAW toggles on and off
  recording -- so the recordings are perfectly timed, and drop into your desktop
  environment without needing to be trimmed or edited.

  Because the recordings are triggered by MIDI, the jitter in a connection
  should be minimized. Hardware MIDI adapters are recommended for use with
  windows and linux based daws, and either hardware adapters or apollo MIDI over
  Bluetooth with os x. The app will work with MIDI over Wifi, but is not
  recommended because of the potential for jitter.

  The app can also be used to record live instruments and vocals; any ios
  compatible audio interface can be used, with the recording being captured
  either by sending MIDI from a DAW, or by tapping the buttons on the interface.
  Most daws support latency compensation for MIDI, making timing issues easy to
  eliminate.

  If the timing of a recording is not critical, the app can be used as an
  ordinary voice and audiobus recorder, for sketching song ideas or taking
  notes. The built-in web server makes it easy to transfer the recordings to the
  desktop.
specs: |-
  - Audiobus support
  - MIDI triggering
  - iOS compatible audio input
  - Built-in web server
  - Wifi audio streaming
  - MIDI over Bluetooth
  - Hardware MIDI adapter support
  - Windows DAW compatibility
  - Linux DAW compatibility
  - Os x DAW compatibility
  - Live instrument recording
  - Vocal recording
  - Latency compensation support
