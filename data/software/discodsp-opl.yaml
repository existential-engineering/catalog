description: Emulation of the Yamaha OPL chip behind AdLib and Sound Blaster game soundtracks of the late 80s and 90s. Two-operator FM (carrier and modulator) with all eight OPL3 waveforms per operator, percussion mode (bass drum, snare, tom, cymbal, hi-hat), key-tracked stereo panning, up to 16x oversampling of the chip itself, SBI preset import, and 2000+ included presets.
details: |-
  FM and additive synthesis emulation

  Two operators per channel (carrier and modulator)

  8 per oscillator (sine, half sine, absolute sine, quarter sine, alternating sine, camel sine, square, logarithmic sawtooth)

  Bass drum, snare, tom, cymbal, hi-hat

  2,000+

  16x

  SBI file support
