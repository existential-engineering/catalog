description: discoDSP OPL emulates the Yamaha OPL2 (1985) — the FM chip behind AdLib and Sound Blaster game soundtracks of the late 80s and early 90s. Two-operator FM with eight waveforms per operator, OPL2 percussion mode, and partial OPL3 features. 16x oversampling, 2000+ presets, SBI import.
details: |-
  FM and additive synthesis emulation

  Two operators per channel (carrier and modulator)

  8 per oscillator (sine, half sine, absolute sine, quarter sine, alternating sine, camel sine, square, logarithmic sawtooth)

  Bass drum, snare, tom, cymbal, hi-hat

  2,000+

  16x

  SBI file support
