description: "Yamaha OPL2 chip emulator recreating the iconic FM synthesis sound
  of 80s and 90s video game soundtracks with 16x oversampling for alias-free
  sound, FM and additive synthesis, unique percussion mode, and SBI file import
  support."
details: |-
  FM and additive synthesis emulation

  Two operators per channel (carrier and modulator)

  8 per oscillator (sine, half sine, absolute sine, quarter sine, alternating sine, camel sine, square, logarithmic sawtooth)

  Bass drum, snare, tom, cymbal, hi-hat

  2,000+

  16x

  SBI file support
