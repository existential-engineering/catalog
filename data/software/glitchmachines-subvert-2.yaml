description: Subvert 2 is a modular multi-effects processor built to decimate the frequency spectrum through flexible signal routing. It combines distortion, FM ring modulation, digitizer, metalizer, filters, and dynamics into a patchable architecture with LFOs, envelope followers, and macro controllers. Aimed at sound designers and producers who want deep modular-style processing inside a DAW plugin.
details: |-
  Modular patching system with flexible routing
  Multimode distortion, FM ring modulation, digitizer, metalizer
  Multimode filter and dynamics (gate and compressor modes)
  LFOs with 15 wave shapes
  Four audio mixers
  Noise generator and output feedback path
  Envelope followers and macro controllers
  100 factory preset patches
  Scalable user interface
  Full parameter automation support
