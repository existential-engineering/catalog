details: |-
  Atoms is a new kind of synth plugin that uses cutting edge physical modeling
  to generate an endless variety of organic and otherworldly sounds. Use it to
  build rich and alive textures the world hasn't heard before.

  Physical modeling simulates the behavior of real life instruments. But atoms
  takes you beyond what's possible in the natural world. Its features are deep
  enough to explore the outer bounds of sound design, yet so simple that you can
  easily mangle, shape and create. Atoms is powered by a simulation of
  interconnected masses and springs with tweakable properties and dimensions.
  The model is triggered by a virtual bowing action that excites the system and
  makes it vibrate to generate sound.

  Nothing in the natural world is ever truly static. Physical modeling mimics
  this by generating sounds with the same organic fluctuations as acoustic
  instruments. Atoms takes it even further. Its six main parameters can be
  automated with a selection of powerful motion options to add extra life. This
  lets you create soundscapes that are constantly shifting and re-generating,
  like a natural organism.

  Atoms comes equipped with a powerful randomization engine. It's a musically
  calibrated algorithm that selectively adjusts each parameter based on its
  relationship to the others, giving you usable patches with every roll of the
  dice. You can narrow the algorithm further by limiting the random ranges for
  any knob or locking parameters from changing. Finally, the recycle button is a
  second randomizer that will create new patches similar to the current patch.

  The bottom panel gives you a range of creative effects to further sculpt your
  sound. You can also choose between four sonic profiles, each offering a
  different structure of the mass-spring network simulation that powers atoms.
  With the exception of space (reverb), all effects in the bottom panel are
  created inside the physical model itself. This gives you a range of unique
  modulation effects that are an inherent part of the physical model and sound
  more natural than any separate fx chain ever would.
