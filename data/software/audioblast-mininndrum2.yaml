description: Mininn Drum 2 is a Linn-inspired drum machine plugin with a built-in step sequencer, 128 rhythm presets, three vintage drum ROMs.
details: |-
  Mininn Drum 2 is the next evolution of the Audioblast drum machine inspired by the legendary Linn drum computers. This new version expands the original Mininn Drum concept with a powerful built-in step sequencer, 128 rhythm presets, and an improved workflow designed for modern music production.

  Mininn Drum 2 combines the punch and character of classic 80s digital drum machines with modern plugin features, allowing producers to quickly design grooves, build drum patterns, and shape their drum mix directly inside the instrument. Whether you produce house, techno, hip hop, synthwave, electro or retro electronic music, Mininn Drum 2 delivers authentic vintage drum machine sounds with a fast and intuitive workflow.

  The integrated step sequencer lets you program drum patterns directly inside the plugin with a 16-step editor, 32 pattern slots, velocity per step editing and a shuffle control for groove and swing. These additions allow you to sketch drum grooves instantly without creating MIDI clips in your DAW. 128 factory rhythm presets are organised into Break, Disco, Fusion, 60s Grooves, Hip Hop, House, Jazz Rock, Latin Rock, Misc (experimental patterns) and Fills, ready to use instantly or to modify with the sequencer.

  The instrument is built around three carefully designed sound ROMs. ROM 1 is inspired by the legendary LM-1 and LM-2 drum machines, ROM 2 is based on the sound character of the Linn 9000, and ROM 3 is a custom Audioblast selection of iconic 80s drum sounds for retro electronic music. A Custom Pad allows you to load your own drum hits, bass sounds, percussion or any WAV or AIFF sample, and samples can be embedded directly into presets to create fully portable custom kits.

  Each sound can be individually adjusted using the built-in mixer and tuning sections, covering volume, tuning, panorama and velocity sensitivity, so you can quickly balance your drum mix and shape the character of each sound.
specs: |-
  - Linn-inspired drum machine plugin
  - 3 vintage-style drum sound ROMs (LM-1/LM-2 inspired, Linn 9000 based, custom 80s selection)
  - Built-in 16 step sequencer
  - 32 patterns per preset
  - 128 rhythm presets included
  - Velocity per step editing
  - Shuffle groove control
  - Custom sample pad, loads WAV or AIFF samples
  - Samples embeddable into presets for portable custom kits
  - Individual drum tuning
  - Mixer with volume and pan control
  - Velocity sensitivity per sound
  - Preset browser
  - Works in all major DAWs
