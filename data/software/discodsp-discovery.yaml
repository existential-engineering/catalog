description: Virtual analog synthesizer inspired by the Clavia Nord Lead 2, with
  direct Nord Lead 2 and 2X SysEx patch import. Four layers, eight oscillators
  with sync and FM, eight zero-delay feedback filter types, ADSR envelopes,
  unison with stereo spread, gate sequencer with rhythm presets, arpeggiator,
  panning modulation, stereo delay, and 3,500+ presets across 40 banks.
details: |-
  Up to 4 per patch with morphing

  8 total across layers (dual per layer)

  8 filter types with Zero-Delay Feedback

  Stereo delay, gate effects, panning modulation

  3,500+ across 40 banks

  Nord Lead 2/2X SysEx import/export

  2X
