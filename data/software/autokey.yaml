description: Auto-key is an automatic key and scale detection plug-in, designed
  to enhance your auto-tune workflow and save valuable time in the studio.
details: |-
  Place auto-key on a track to analyze your music in real time, or upload an
  audio file for faster than real-time analysis. Auto-key automatically detects
  and displays the key and scale of your music, as well as the tuning reference
  frequency. The onscreen keyboard also lights up to show detected pitches.

  Click the "send to auto-tune" button, and compatible versions of auto-tune are
  automatically updated with the correct key and scale settings. Even if you
  already know the key and scale of your music, auto-key will streamline your
  workflow by allowing you to conveniently set the key and scale for multiple
  instances of auto-tune with a single click.

  Auto-key makes it quick and easy to find the key and scale of your music. Just
  place it on an instrument track or master bus and begin playback. Auto-key
  will analyze the audio in real time and display the key and scale after a few
  seconds of playback analysis. You can also upload an audio file to analyze an
  entire song in seconds.

  In addition to key and scale, auto-key also tells you the reference frequency
  of your music. Most modern music is tuned so that a is equal to 440 hz, but
  this is not always the case. If your music or samples are tuned to a different
  reference frequency, auto-key will show you what it is, so you can make the
  necessary adjustments when applying pitch correction or selecting samples.
specs: |-
  - Key detection
  - Scale detection
  - Real-time audio analysis
  - Reference frequency detection
  - 64-bit
  - macOS 10.13 or later
  - Windows 10
  - Pro Tools 2018.1 or later
  - Onscreen keyboard pitch display
  - Auto-tune integration
