description: A guitar feedback plugin for realistic guitar feedback. Release
  your inner beast with Acoustic Feedback, Softube's stunningly realistic guitar
  feedback simulator plugin. A guitar plugin to create inspiring acoustic sound.
details: |-
  Release your inner beast with Softube's stunningly, brutally realistic guitar feedback simulator plug-in. Go from moderate and subtle to rampant and wild with the twist of a knob (or two).

  One thing that is really hard to achieve with an amp simulation (whether a plug-in or in hardware) is the interaction in a room between the guitar and amplifier when you turn up loud. Enter Acoustic Feedback, which does just that.

  Simple user interface: control the amount of feedback with the Feedback knob, and the sensitivity with the Tolerance switch. The simulation is fully responsive to vibratos, bends, slides, tremolos and similar playing techniques, and is compatible with MIDI foot controls.

  Use it as a creative tool for producing inspiring acoustic landscapes. Acoustic Feedback is also available as a part of Flow Mixing Suite and Flow Complete Suite.
specs: |-
  - Realistic simulation (physical modeling) of guitar feedback
  - Fully responsive to vibratos, bends, slides, tremolos etc
  - Simple user interface, control amount of feedback with the Feedback knob, and the sensitivity with the Tolerance switch
  - Compatible with MIDI foot controls
  - Use it as a creative tool for producing inspiring acoustic landscapes
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26
  - System requirements: Windows 10 (64-bit), Windows 11
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Requires internet access (for downloading installers and managing licenses)
  - Three activations
