description: Access virus editor & librarian. Access virus librarian editor &
  librarian plugin, our answer to your prays. After several years ago...
details: >-
  Edit your access virus hardware synth directly from your DAW without flipping
  thru different applications, organize patches within your plugin window to
  load, edit and save them directly to your hdd.


  You can run our plugin in macos native AAX, audiounit, vst2 & vst3 format and
  pc vst2, vst3 and native AAX format (64-bit). There is also standalone
  application available for mac and pc.


  Our plugin stores all the data within the project and when you reopen the
  project, all of the used data gets sent to your hardware, automatically. No
  more sync issues, saving, loading or transferring patch data. Welcome total
  recall.


  Version 3 brings along a lot new features like onscreen keyboard with qwerty
  input support, realtime resizable user interface with retina graphics and
  more.


  We added a bit more than 5600 parameters to the plugin (16 parts) so the sound
  editing should be painless and quick task. Automate almost every parameter in
  your DAW. Easier to handle automations than trying to remember hundreds of
  #ccs.
