details: |-
  BMIDI is a cross platform SDK for developers or manufacturers who want to add virtual MIDI ports to their application or driver. It is used by many companies, from very small to very large, for quick and easy virtual port support in their software.

  Essentially, BMIDI provides a simple library which allows applications to expose one or more MIDI ports to other MIDI applications. Those other applications use the BMIDI ports as if they were external hardware MIDI ports.

  BMIDI is not a loopback driver: one endpoint is always private, i.e. in your application. This architecture ensures best performance. A BMIDI application uses the BMIDI API to add or remove ports, to query ports, and to send/receive data to/from ports. The same BMIDI API is used on Windows, macOS, iOS/iPadOS, and Linux/RaspberryPi.

  The API is available for C and C++, with wrappers for C# (e.g. for Unity, Mono, .NET), Java and Python, plus RtMidi bindings, and it is compatible with frameworks like Juce and Qt. Other wrappers can be developed on request, and source code integration support is offered.

  The BMIDI Bome Virtual MIDI Port driver works fine with the currently rolled out Windows MIDI Services. The typical licensing model for BMIDI is a one-time fee.
