details: |-
  Amplosion is a guitar amp simulator, designed to be as responsive and easy-to-use as a real tube amp.

  Features simulated amps including leo (60's american amp), jim (70's/80's british amp), and randy (90's american amp), along with speaker cabinet simulation and ir loader capabilities.

  Includes hicut filter with cutoff frequency adjustment, low latency and cpu usage optimization, 3 channels, presets manager, input level control, and output mute control.

  All controls are available as parameters for automation, supporting both mono in/mono out and stereo in/stereo out audio formats with stereo audio processing using the same settings on left and right channels.

  Free fully-functional 15-days trial version available.
specs: |-
  - VST 3 plugin

  - Audio units plugin

  - Guitar amp simulator

  - Simulated amps: leo (60's american amp), jim (70's/80's british amp), randy (90's american amp)

  - Speaker cabinet simulation

  - Ir loader

  - Hicut filter with cutoff frequency adjustment

  - Low latency

  - Low cpu usage

  - 3 channels

  - Presets manager

  - Input level control

  - Output mute control

  - Automation - all controls available as parameters

  - Mono in / mono out audio format

  - Stereo in / stereo out audio format

  - 15-day free trial

  - Intel pentium 4 class processor 2.0ghz minimum

  - 2gb ram minimum

  - 200mb free disk space minimum

  - Windows 10/11 (32/64-bit)

  - Macos 10.12 or later

  - 32/64-bit DAW host required

  - Asio compatible sound card required (windows)
