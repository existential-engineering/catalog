  KClip 3!
details: |-
  KClip 3 is a professional clipper plugin offering eight distinct clipping modes: Smooth, Crisp, Tube, Tape, Germanium, Silicon, Broken Speaker, and Guitar Amp. Each mode imparts a unique character to the signal, from transparent limiting to harmonic saturation, making it suitable for both surgical mastering work and creative sound design.

  The plugin supports multiband processing with up to four independently configurable bands, allowing users to target specific frequency regions for clipping. Combined with Mid/Side processing, KClip 3 provides fine-grained stereo imaging control.

  Oversampling up to 32x is available for mastering-grade transparency. The plugin also features EBU LUFS integrated loudness metering, a color-coded waveform visualizer, and a Delta function for A/B comparison.

  KClip 3 is licensed perpetually with no iLok requirement and no subscription model. The plugin runs as Universal Binary 2 on macOS, supporting both Apple Silicon and Intel architectures.
specs: |-
  - 8 clipping modes: Smooth, Crisp, Tube, Tape, Germanium, Silicon, Broken Speaker, Guitar Amp
  - Multiband processing up to 4 bands
  - Mid/Side stereo processing
  - Oversampling: 2x to 32x
  - EBU LUFS integrated metering
  - Delta function for A/B comparison
  - Color-coded waveform visualizer
  - Resizable interface
  - macOS 10.13+; Universal Binary 2 (Apple Silicon + Intel)
  - Windows 10+
  - Linux: VST3, VST2, LV2 compatible hosts
  - AAX requires Pro Tools 12+
  - Perpetual license; no iLok, no subscription
