description: The industry's most powerful and versatile clipper in your hands. Gain massive transparent loudness and compete with the pros, or tame harsh digital transients in the mix for added warmth and saturation. 8 unique clipping modes, multiband + mid-side processing, mastering-grade oversampling, and much more. Take total control of your tracks, mixes, and masters with KClip 3!
details: |-
  KClip 3 is Kazrog's clipper plugin for mixing and mastering, aimed at transparent competitive loudness. It cleanly saturates transient peaks while leaving the signal underneath unchanged, or changed as much or as little as desired, and can equally be used to tame harsh digital transients in a mix for added warmth and saturation.

  Eight clipping modes are available in one plugin: Smooth, Crisp, Tube, Tape, Germanium, Silicon, Broken Speaker, and Guitar Amp. A multiband mode allows up to four different clipping modes split across four customizable bandwidth regions, and a Mid/Side mode adjusts the proportion of mid and side signal entering the clipper for stereo imaging control.

  Oversampling is mastering-grade and runs up to 32x, with separate online and offline render mode settings in supported hosts. A color-coded visualizer shows clipping amount in real time, and EBU LUFS metering supports targeting a loudness level for streaming delivery. The window is resizable, with the visualizer and metering expanding to fit.

  The page contrasts KClip 3 with the smaller KClip Zero: KClip 3 has adjustable 2x to 32x oversampling against Zero's fixed 2x online and 16x offline, eight clipping modes against one, and adds multiband processing, mid/side processing, LUFS metering, a delta function, variable soft clipping, A/B compare, and a resizable window. Licensing is a 100% perpetual license for multiple devices, with no iLok authorization and no subscription fees. The free demo is time-unlimited but adds random silent output and disables preset saving.
specs: |-
  - 8 clipping modes: Smooth, Crisp, Tube, Tape, Germanium, Silicon, Broken Speaker, and Guitar Amp
  - Multiband mode with up to 4 clipping modes across 4 customizable bandwidth regions
  - Mid/Side mode adjusting the proportion of mid and side signal into the clipper
  - Mastering-grade oversampling adjustable from 2x to 32x, with online and offline render mode settings in supported hosts
  - Color-coded visualizer showing clipping amount in real time
  - EBU LUFS metering for target loudness optimization
  - Delta function
  - Variable soft clipping
  - A/B compare
  - Resizable window with expanding visualizer and metering
  - Mac: macOS 10.13.x or higher; VST, AU, AAX (64-bit) host required; Universal Binary 2 (Apple Silicon and Intel)
  - Windows: Windows 10 or higher strongly recommended; VST or AAX (64-bit) host required
  - Linux: VST3, VST2, or LV2 host required; tested with Ubuntu, Linux Mint, Debian, and Manjaro
  - Pro Tools 12 or higher required for the AAX version
  - Apple M1 or Intel i5 "Ivy Bridge" CPU or newer strongly recommended
  - 100% perpetual license for multiple devices, no iLok authorization required, no subscription fees
