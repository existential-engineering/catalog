description: The industry's most powerful and versatile clipper in your hands.
  Gain massive transparent loudness and compete with the pros, or tame harsh
  digital transients in the mix for added warmth and saturation. 8 unique
  clipping modes, multiband + mid-side processing, mastering-grade oversampling,
