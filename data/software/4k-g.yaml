details: |-
  The ssl 4k g plug-in by solid state logic is the definitive emulation of the ssl 4000 g channel strip, created by its original designers to authentically recreate the sound of a generation. Offering detailed circuit modelling down to the component level of the revered pink '292' and black '242' eq flavours, alongside the tighter and more refined sounding dynamics section, 4k g lets you tap into the iconic sound behind some of the greatest records of all time.

  From olympic studios in london to the record plant in la, ssl 4000 g consoles quickly became the new staple in studios worldwide. Its unparalleled sonic character and incredible versatility transcended genres, shaping countless chart-topping hits across pop, rock, and hip-hop.

  Expanding on the sl 4000 e's legacy, the sl 4000 g console emerged in 1987 as the pinnacle of the 4000 series and the final chapter in the 4000 b, e, and g trilogy. This console brought groundbreaking innovation, including redesigned microphone preamps, the pink knob '292' eq, and refined dynamics section, resulting in the console offering a more 'polished' sound than the previous grit of the e series.

  The 4k g plug-in lives up to the legend of the 4000g, imparting all the vibe and rich non-linear analogue character of the console itself. The plug-in is a precise emulation, with detailed component-level modelling and an intricate capture of the original circuit schematics. Highlights include the hyper-realistic emulation of the revered pink '292' and black '242' eq flavours, alongside the tighter and more refined sounding g series dynamics section.

  Ssl 4k g integrates seamlessly into the 360 plug-in mixer ecosystem and is fully controllable from uc1, uf1 and uf8 hardware.
