details: |-
  Ceilings Of Sound Pro v0.6.4 is Ayaic's, and the world's, first hyper-EQ. It's
  a switchable 50/31 band EQ that's controlled by 15 of Ayaic's unique "ceiling
  bands." a "conform spectrum to ceiling" feature automatically conforms the EQ
  to the created ceiling shape while an "auto generate ceiling" feature allows
  you to create ceiling instantly.

  In addition there are 49 ceiling guides that help you keep your audio in
  perfect tonal balance. Whether you're working with one of the hundreds of
  presets, one of your own created presets, simply manipulating the ceiling
  shape of your raw sound source or working directly within eq edit mode...
  Perfect equalization is easy and fast.

  Ceilings of sound pro is the most versatile equalizer you will ever use and
  probably the most fun you'll ever have using an equalizer. It's important to
  keep in mind that since the eq is adhering to noise ceilings your audio source
  will always remain musical no matter what shape you create. This means that no
  ceiling shape will ever sound "bad" only different which makes cos pro the
  ultimate sound-design tool.

  Ceilings of sound pro is also the ultimate equalization guide when you're
  working with your hardware equalizers. It takes the guesswork out of the
  equalization process allowing you to fully utilize all of your existing
  hardware equalizers... Just follow the ceilings.

  For the first time ever you will be able to work effectively and efficiently
  in any environment... Including silence.
specs: |-
  - Switchable 50/31-band graphic EQ
  - 15 user-definable ceiling bands with 49 noise-slopes each
  - Click-n-drag ergonomics
  - Auto generate ceiling function
  - Selectable universal mixing blocks for auto generate
  - Lockable ceiling elbowpoints
  - Conform spectrum to ceiling feature
  - Low-CPU, hi-precision
  - Reset single EQ band, group of EQ bands or full EQ
  - 49 ceiling guides
  - Tilt EQ by noise slopes
  - Mix % knob
  - Bpm synced morph up to 8-bars
  - Autogain
  - Metering with infinite hold and click-reset
  - Live function with spectrum smoothing and analyzer average options
  - Spectrum analyzer
  - macOS 10.10 through 14
  - Intel core i3/i5/i7/xeon
  - M1/m2 support
  - Minimum 2 GHz recommended
  - Universal 2 binary
