description: Classic guitar amp emulation modeled on the iconic 1959 Fender Bassman — the '58–'60 era tweed tube amp that shaped decades of guitar amplification. Faithfully recreates both preamplifier channels, the famous tone stack network, and the power amplifier including the revision A presence filter feedback network. Features bypassable cabinet simulation and a linear output level control.
details: |-
  Emulates the 1959 Fender Bassman. Two preamplifier channels: Normal and Bright, each switchable between High and Low input modes (Low mode applies 6 dB attenuation) — yielding four distinct tonal configurations. Power amp modeling includes the revision A presence filter feedback network. Cabinet simulation is bypassable for use with external IR loaders. Responds dynamically from clean through smooth crunch to heavy clipping as volume increases. Effective on guitar, synthesizers, and drum tracks. Version 2.7.
specs: |-
  - Controls: Normal Volume, Bright Volume, Bass, Middle, Treble, Presence, Output Level, Cabinet on/off, High/Low input switches
  - macOS 10.12+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+, 2 GHz Intel CPU+, 2 GB RAM, 1280x1024 display
  - Formats: VST2, VST3, AU, AAX
  - Copy protection: Fuse Audio Labs account activation
  - 14-day fully functional trial available
