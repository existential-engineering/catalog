details: |-
  Ampknob bdh bundle includes three amp models: ampknob bdh 5169 based on the original block letter amp head from 1992 with aggressive and punchy high-gain tone; ampknob bdh 66o6+ based on a hot-rodded and modified plus version from around 2000; and ampknob bdh iii, the modern take with full and rich sound and dense distortion for modern riffs and creamy leads.

  Every amp in the bdh collection includes a pedal switch, activated with the push of a button on the plugin's front panel. The pedal tightens up the lowend and drives the input a bit harder, perfect for heavy riffing.

  The standalone version of ampknob includes built-in recording functionality that allows capturing ideas quickly and easily without starting a DAW. The standalone version also comes with a built-in metronome to stay sharp at guitar playing skills, with options to change meter, accent, or set automatic speed increments.

  The excellent built-in tuner means you're always ready to jam. The perfect speaker cabinet, microphones, and recording chain has been expertly chosen and dialed in by producer jens bogren to capture the tone with outstanding detail.

  If you feel like experimenting, you can disable the cab or even load your favorite impulse response right from the plugin.
