description: Softube Modular expansion, a wavefolder which shapes the timbre of
  any audio signal.
details: |-
  Add subtle extra harmonics, or dive headfirst into total folded madness. Intellijel uFold II is a wavefolder which shapes the timbre of an oscillator or any other audio signal you feed it.

  With just a few simple controls the uFold II (pronounced 'microfold') lets you manipulate the harmonic spectrum, going from subtle additional harmonics for air, grit, and flavor, to total folded insanity.

  Available as an officially licensed expansion for Softube Modular, it lets you create a vast range of timbres from any source, but is essentially easy to use and cleanly thought-out.

  Made for Modular, Softube's Eurorack platform.
specs: |-
  - Fold control with a CV input and dedicated attenuator
  - Thru-zero symmetry control with a bipolar CV input and dedicated attenuator
  - Stages switch to select 2, 4 or 6 stages of folding
  - Made for Modular, Softube's Eurorack platform
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Softube account required
  - iLok account required (no physical iLok required)
  - Computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Internet access (for downloading installers and managing licenses)
  - Three activations
