description: Bring your ideas to life with THE PULSE ELEMENTS, a free cinematic
  synth-based instrument designed for professional composers. Add rhythm, motion
  and beats to your cues with a refined engine that makes a single note feel
  alive.
details: |-
  THE PULSE ELEMENTS is the free version of Sonuscore's cinematic synth-based instrument THE PULSE, built on the same engine and refined for speed and clarity. The page describes holding a single note and hearing it begin to breathe: a shimmer becomes a pattern, the pattern becomes rhythm, and the rhythm becomes beats that lock to picture. Sonuscore names Blade Runner, Stranger Things and The Social Network as the synth languages it draws on.

  The download contains the main engine NKI for expressive synth motion and rhythmic design, eight prearranged Sessions (three Cinematic, three Modern Genre and two Ensemble), pre-built Kits matched to each Session for instant results, and a curated sound pool drawn from the full library. Cinematic Sessions cover expansive, emotional textures for tension, build and release; Modern Genre covers contemporary electronic pulses that sit with hybrid scores; Ensemble covers layered tonal and percussive setups that fill a mix quickly.

  The page's FAQ is explicit that this is not a demo instrument but a fully usable one for real scoring work, and that MIDI export and user preset saving belong to THE PULSE full version. It runs in the free Kontakt Player.

  Sonuscore positions it as a standalone scoring tool and a gateway to the full THE PULSE, which the page says adds over forty drum kits with a Drum Browser, full MIDI export, user preset saving, advanced modulation and routing, a larger sound library of 100+ basses, drums, leads and orchestral textures, an External mode for custom performance setups, and 80+ customizable sessions.
specs: |-
  - Free version of Sonuscore's cinematic synth-based instrument THE PULSE, built on the same engine
  - Main engine NKI for expressive synth motion and rhythmic design
  - 8 Sessions: 3 Cinematic, 3 Modern Genre, 2 Ensemble
  - Pre-built Kits matched to each Session
  - Curated sound pool drawn from the full library
  - MIDI export and user preset saving are not included (they are features of THE PULSE full version)
  - Works with the FREE KONTAKT PLAYER
  - Requires KONTAKT version 8.7.1 or higher
  - macOS 13, 14 or 15 (latest update)
  - Windows 10 or 11 (latest Service Pack)
  - Intel Core i5 or equivalent CPU, or Apple Silicon
  - Some sessions need a fast CPU and require an Intel i7 processor or higher
  - Graphics hardware support for Direct 3D 11.1 (Feature Level 11_0) or higher
  - 4 GB RAM (6 GB recommended, as it is a large Kontakt instrument)
  - At least 1.03 GB of free hard disc space
