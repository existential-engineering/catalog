description: Hidden electro-acoustic piano 1959 by sampleson is based on the
  electroacoustic piano patent (lifetime expired)
details: >-
  1959 by sampleson is based on the electroacoustic piano patent (lifetime
  expired) registered in 1959. We brought it to life using spectral modeling.
  Sound can be described as a cp80-like but a bit more tuned regarding the fewer
  number of strings.


  1959 can be described as raw. Despite the reverb included, 1959 is minded to
  be heavily processed with anything you want. It will melt perfectly with
  choruses, flangers, phasers, etc.


  No extra purchases needed (like kontakt, uvi, etc) or any other 3rd. Party
  player. Ready to be loaded into major daws (cubase, logic pro, garageband,
  cakewalk, reaper, bitwig, nuendo, flstudio, etc).
specs: |-
  - 88 notes electro-acoustic piano
  - Spectral modeled
  - Resonance amount control
  - Hammer noise amount control
  - Release sound amount control
  - Static noise emulator
  - Scalable hd interface
  - VST plugin
  - Audio units plugin
  - Standalone application
  - 64-bit VST (windows)
  - 64-bit VST, AU and standalone (macos)
  - Windows 7 or later
  - Os x 10.7 or later
  - Online activation required
  - No AAX version available
  - ~65mb installed
