description: An emulation of the ultra-rare 1960s RCA BA-31A germanium transistor preamplifier — a 4-transistor design with a custom UTC input transformer, fixed 40 dB gain, and a single power switch. Captures the characteristic even-harmonic structure unique to germanium-based designs, with a powerful low-end projection and musical 'grind' when pushed. Extended controls include a compensated drive, impedance selector, VU metering, phase inversion, and noise control.
details: |-
  Emulates the RCA BA-31A (1960s germanium transistor preamp). Original: 4-transistor design, UTC input transformer, fixed 40 dB gain, single power switch only. Plugin adds: fully compensated Drive control, Impedance selector (150/600 ohm — affects frequency response), Phase inversion switch, Trim (±18 dB output), Noise (vintage harmonic noise floor, −140 to −60 dB), VU meter (switchable input/output/post-drive), Link (ganged control across instances). CPU usage: ~0.8%. Universal 2 Binary. Launched at $19 intro (Jan 2021); regular $39.
specs: |-
  Controls: Gain/Drive (compensated), Impedance (150/600 ohm), Phase, Trim (±18 dB), Noise (−140 to −60 dB), VU meter mode, Link. CPU: ~0.8%. macOS 10.9+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+ (32-bit and 64-bit), 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX. Copy protection: serial number. 14-day trial available.
