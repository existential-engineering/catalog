details: |-
  The adx vocal volume control (vvc) 3.0 plug-in allows you extreme volume level and pan position control of the main vocal or lead melody line within a mono or stereo master mix, without requiring the original multitrack stems.

  Vvc is very easy to use. Its elegant interface and simple controls provide access to advanced separation algorithms and standard volume and panning sliders.

  Vvc 3.0 offers volume adjustments of up to +/- 12db, enabling even more powerful volume automation and adjustment.

  Vvc 3.0 offers two new separation modes: vocal and melody. With vocal mode selected, automatic voice activity detection (avad) is activated. Avad uses an advanced algorithm to detect where a singing voice is present and will extract melodic content only during these sections. When no vocal is present, the original mix will remain unaffected.

  With melody mode selected, adx algorithms extract melodic content for the entire duration of the acquired selection. It can be useful when trying to control the volume of a monophonic instrument (guitar, sax, etc.), or when the automatic voice activity detection misses segments of the vocal performance.
