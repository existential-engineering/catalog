details: |-
  This model is where this legendary line of EQ modules started. It's the oldest model and the most classic but still used to great effect by many engineers. The signature sound of the hardware original can be found on hit recordings of generations and generations of artists for almost 50 years now.

  4-Band EQ with HPF and LPF, modeled after a legendary line of equalizer modules.

  Runs natively in your DAW on macOS or Windows, or in real-time on your Synergy Core interface.

  Available individually or as part of the Antelope Cosmos subscription, which unlocks 75+ Antelope Native Plugins.
