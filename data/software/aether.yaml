description: "Aether is an auto randomizing algorithmic reverb software plug-in.
  Features and specification: extreme precision floating-point engine"
details: >-
  Aether is an auto randomizing algorithmic reverb software plug-in. Unlike
  convolution reverbs, aether is not a static process, and no two instances of
  aether are ever exactly the same. The same is true in real world acoustical
  spaces as well: a building's acoustical character may vary slightly depending
  on several factors such as its current occupancy, and even more subtle things
  such as the current temperature and humidity.


  Aether's algorithm is conceptually divided into two parts: early reflections,
  and late reflections. The early reflections stage provides discrete delay
  patterns, which provide spatial cues that identify the nature of the given
  acoustic space. Aether mathematically calculates and subtly randomizes these
  er delay patterns in pure floating point precision based on an incredibly
  complex algorithm that is designed to accurately mimic physical reality. This
  part of the algorithm consists of over 75 variable parameters which control
  the characteristics of the resulting er patterns.


  33 different default space types ship with aether, and the interface provides
  five additional control knobs to customize their most important aspects. These
  controls allow adjustment of the size and geometrical shape of the space type
  default as well the positioning models used to determine where the sound
  source and listener are in the room. Aether offers an intuitive solution by
  providing a link button that allows various parameters to be linked to the
  space type macro control.


  Two simple modulation controls are offered to invoke additional random lfo
  modulations in the late reflections section of the algorithm. The modulation
  rate and period controls create musically-pleasing, randomly shifting
  resonances in the spectrum of the diffuse late reflections. Modulation period
  length extends to over eight minutes to allow for imperceptibly slow shifts in
  the resonance of the reverb tail that guarantee the reverb sound will never be
  exactly the same over the course of an entire song.


  Stereo shaping, eq'ing, and other fundamental sound-shaping tools are inside
  the reverb exactly where they need to be, and the early reflection / late
  reflection split is easy to follow. The preset library is comprehensive in
  that it covers small/large, subtle/dramatic, crisp/diffuse configurations, and
  the early reflection rooms are quite clever and very functional.
