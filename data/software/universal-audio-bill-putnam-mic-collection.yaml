details: |-
  The Bill Putnam Mic Collection provides access to exacting emulations of rare,
  vintage mics which have been used to record countless iconic artists of the
  '50s, '60s, and '70s, including frank sinatra, nat king cole, the beach boys,
  and more.

  These mic emulations not only nail the classic timbres of iconic mics used by
  grammy award-winning engineer bill putnam sr. To track ray charles, frank
  sinatra, and more, they also faithfully model the transient response,
  harmonics, proximity effect and three-dimensional polar response of the
  original mics.

  Record through classic and rare microphones of bill putnam sr.'s legendary
  collection including the telefunken ela m 251e, akg c12a, neumann u47, rca 44,
  and more.

  Change proximity effect in real-time, or after the recording, to match an
  earlier vocal take. Adjust the polar pattern and other parameters to reduce
  bleed, room coloration, and feedback, before or after tracking.

  The bill putnam mic collection plug-in is available exclusively for ua audio
  interfaces and uad hardware combined with the the townsend labs sphere l22,
  the first and only three-dimensional microphone-modeling product on the
  market.
specs: |-
  - Microphone modeler
  - Transient response modeling
  - Harmonics modeling
  - Proximity effect
  - Three-dimensional polar response
  - Real-time proximity effect adjustment
  - Polar pattern adjustment
  - Near-zero latency
  - Uad-2 hardware compatible
  - Ua audio interfaces compatible
  - Townsend labs sphere l22 compatible
