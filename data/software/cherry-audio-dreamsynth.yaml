description: Cherry Audio's Dreamsynth is a tribute to the celebrated hybrid
  analog/digital synthesizers of the mid-to-late 1980s. The innovative design
  blends flexible dual-wave morphing oscillators, stereo filters, fully
  polyphonic analog strings, extensive and easy-to-use modulation,
  studio-quality effects, and polyphonic aftertouch and MPE support, all in an
  elegant vintage-style synth interface.
details: |-
  Dreamsynth draws its inspiration from renowned synths including the Ensoniq ESQ-1, the Kawai “K” series, and the Sequential Prophet VS. In the second half of the '80s, music production was rapidly transitioning from analog to digital. These “hybrid” synthesizers bridged the gap, combining the precision and flexibility of sampled digital oscillators with the warmth of analog filters. The combination of digital and analog sound produced instruments with character and a unique sonic fingerprint that still resonates today.

  Three dual-waveform oscillators amount to six simultaneous virtual analog or PCM sample-based oscillators with up to 16 voices of polyphony. When modulation is applied, the unique A/B wave mix controls can create a myriad of evolving or rhythmic vector tones.

  Combines authentic analog waveforms with sampled PCM waveforms for incredible new timbres. Includes a massive library of 430 looping, one-shot, and single-cycle PCM waveforms.

  Dreamsynth also includes a beautiful-sounding classic string synthesizer that, unlike traditional paraphonic string synths, is fully polyphonic. It operates independently of the oscillator-based synthesizer, and both can be layered and split across the keyboard, with separate assignments for the arpeggiator and effects.

  The OB-style 12 dB/octave multimode stereo filters enable breathtaking timbres from subtle to extreme.
specs: |-
  - Three dual-waveform oscillators, amounting to six simultaneous virtual analog or PCM sample-based oscillators with up to 16 voices of polyphony
  - Authentically modeled virtual analog waveforms, plus 430 looping, one-shot, and single-cycle PCM waveforms
  - Fully polyphonic 16-voice string synthesizer which can be layered and split across the keyboard independent of the primary synth
  - OB-style 12 dB/octave multimode stereo filters
  - Extensive and accessible modulation capabilities, with 20 mod sources and over 40 destinations, including effects
  - Analog drift control for increased authenticity
  - Three tempo-syncable LFOs
  - Arpeggiator with tempo sync, independently assignable to the synth and string sections
  - Fully modulatable effects include multiple distortion and sample-crushing options, a 12-stage phaser, chorus, flanger, rotary speaker effects, delay, and reverb
  - Polyphonic Aftertouch as a polyphonic modulation source
  - Support for MIDI Polyphonic Expression (MPE), covering Pitch, Channel Pressure, and Timbre, when using MPE-compatible controllers
  - Highly optimized coding for optimal performance with ultra-low CPU load
  - User-adjustable oversampling control
  - Advanced one-click UI magnification
  - Complete MIDI control and DAW automation for all controls
  - Preset and Global level MIDI mapping
  - Over 1100 presets created by a talented and diverse group of sound design veterans
  - macOS Requirements: 10.13 or above. macOS 13 Ventura supported. 64-bit required. Native Apple M1 or greater processor support, including Ultra. 3.4 GHz Quad-Core or M1 CPU with 8GB of RAM recommended.
  - Windows Requirements: Windows 7 or above (including Windows 11), 64-bit required. Quad-core computer with 8GB of RAM recommended.
