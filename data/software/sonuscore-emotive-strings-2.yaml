description: Emotive Strings delivers moving, big-screen melodies with authentic legato string phrases and arpeggios. Turn your ideas into scoring gold with 28 GB of live-recorded lines.
details: |-
  Emotive Strings is a phrase-based string library built around soaring legato lines and arpeggios, offering expressive, playable melodic string phrases with 28 GB of live-recorded material. The interface is designed for fast results, letting a whole string section be scored in minutes while keeping control over how the phrases behave.

  The library contains 175 phrases performed live by a full string orchestra and recorded with two microphone settings, Stage and Far. On top of those it carries 64 themes, each a selection of up to five phrases that work well together, so full arrangements can be assembled from time-tested rhythms.

  Playing is split across the keyboard: legato phrases are chosen with the left hand while the musical key is selected with the right. Velocity determines major or minor tonality, so a modulation is a matter of finger pressure, and the mod wheel controls crescendo and decrescendo for flowing dynamics.

  The recordings feature the players of the Budapest Scoring Symphony Orchestra. Over five days of recording, the orchestra played each phrase together rather than layering parts, which is where the library's ensemble precision and realism come from.
specs: |-
  - 28 GB of fully-playable legato string phrases
  - 175 phrases performed live by a full string orchestra
  - 64 themes, each a selection of up to 5 phrases that work well together
  - Two microphone settings: Stage and Far
  - Recorded with the Budapest Scoring Symphony Orchestra over five days
  - Left hand selects legato phrases, right hand selects the musical key
  - Velocity switches between major and minor tonality
  - Mod wheel controls crescendo and decrescendo
