details: |-
  The 409 is a powerful and versatile plugin with highly optimised dynamic response, based on the design and principles of analog opto compressors. Characterised by its natural and musical gain reduction, the 409 provides from gentle, transparent compression to heavy deep-cutting limiting, suitable for a very wide range of applications.

  Like its predecessor, 925 compressor, the 409 opto compressor is developed using physical modelling principles recreating classic optical-element compression characteristics, with a host of extra controls and features.

  The main controls enable easy and precise tuning of compression response, with attack and release ranges up to 200ms and 787ms respectively. In contrast to fixed-value switch 'presets', the ratio is controlled by a continuously adjustable dial allowing accurate and 'tunable' setting of the compression slope.

  Complementing its dynamic process, an additional carefully selected set of features allows the user to unveil this unit's true power. Sidechain filtering & monitor, dry/wet mix, peak/rms detection, stereo link, lookahead, and the specially developed new parameters 'damping' and 'skew' which allow for smoothing and fine-tuning of the detector response, these controls are what make the 409 truly versatile, providing the user with exceptional control and shaping of the signal's envelope.
