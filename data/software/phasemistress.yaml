description: Analog phase shifter plugin with 69 style presets, adjustable 2- to
  24-stage phasing, and six operation modes including LFO, rhythm, envelope, and
  custom waveshape drawing.
details: |-
  PhaseMistress is an analog phase shifter plugin that recreates the sounds of legendary phasers for funk-influenced guitars, disco drums, jazz-fusion keys, and vocal effects.

  The plugin features 69 different style presets that alter the internal phaser structure, with adjustable stages from 2 to 24 for effects ranging from subtle to extreme. Fine-tunable resonance, color, and intensity controls allow precise shaping of the phaser character.

  PhaseMistress offers 6 operation modes: LFO, Rhythm, Step, Random, Envelope, and custom. The custom LFO waveshape drawing capabilities enable creation of unique modulation patterns, while the envelope follower responds to audio dynamics for reactive phasing.
specs: |-
  - 69 different style presets
  - Adjustable stages from 2 to 24
  - Fine-tunable resonance, color, and intensity controls
  - 6 operation modes: LFO, Rhythm, Step, Random, Envelope, custom
  - Custom LFO waveshape drawing
  - Envelope follower for dynamic response
  - 64-bit only, sample rates 44.1 kHz to 192 kHz
  - Apple Silicon compatible
