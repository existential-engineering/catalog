details: >-
  Crafted from iconic analog synths, outboard gear, and organic recordings,
  analog hybrid drums contains over 200 deeply sampled sources and over 575
  loops, all housed in the notorious damage 2 engine.


  Analog hybrid drums delivers a punchy, man-meets-machine made, artistically
  curated sound palette infused with attitude and aggression, making it an
  essential for modern music production.


  Analog hybrid drums by heavyocity is a virtual instrument audio plugin and a
  software application and soundware (samples or presets that load into other
  products) for macos and windows.
specs: |-
  - Kontakt player
  - VST 3 plugin
  - Audio units plugin
  - AAX plugin
  - Standalone application
  - Over 200 deeply sampled sources
  - Over 575 loops
  - Damage 2 engine
