description: A hybrid tube/FET compressor combining compression capabilities with a fully adjustable tube preamp, two-band equalizer, and swappable components. Functions as a versatile channel strip suitable for drums, bass, vocals, keys, guitars, and bus processing. Features threshold from 0dB to -100dB, ratio from 2:1 to 50:1, attack from 0.2ms to 200ms, release from 10ms to 1.2s, auto and manual make-up gain, swappable tubes and transformers, two-band parametric EQ, and wet/dry parallel processing.
details: |-
  The Pawn Shop Comp is a hybrid tube/FET compressor with a tube preamp, a two-band equalizer and swappable components, usable as a channel strip on individual sources or on a bus.

  The hybrid tube/FET circuit covers a range of compression settings, from gentle to heavy and from smooth to transient-forward. Wide range ATTACK, RELEASE and RATIO controls set the compressor to the dynamics of the track, and a preset library is included.

  The tube preamp and two bands of equalization extend the plug-in into a channel strip. Gain and Bias adjustments set the amount of saturation, from mild harmonic content through to distortion, and swapping tubes and transformers changes the preamp saturation characteristics to model circuits from the 1950s onward.

  Different resistors and transistors change compression curves and frequency response, OPERATING LEVEL adds further saturation, and DRY/WET allows parallel processing. A gain reduction meter shows the compression applied, auto makeup gain is available, and the compressor can be bypassed to use the tube preamp alone.
specs: |-
  - Hybrid tube/FET compressor circuit
  - Wide range Attack, Release and Ratio controls
  - Gain reduction meter with auto makeup gain
  - Compressor bypass to use the tube preamp alone
  - Fully adjustable tube preamp with Gain and Bias
  - Two-band equalizer
  - Swappable tubes and transformers
  - Swappable resistors and transistors to change compression curves and frequency response
  - Operating Level control for extra saturation
  - Dry/Wet control for parallel processing
