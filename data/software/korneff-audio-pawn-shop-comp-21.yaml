description: A hybrid tube/FET compressor combining compression capabilities with a fully adjustable tube preamp, two-band equalizer, and swappable components. Functions as a versatile channel strip suitable for drums, bass, vocals, keys, guitars, and bus processing. Features threshold from 0dB to -100dB, ratio from 2:1 to 50:1, attack from 0.2ms to 200ms, release from 10ms to 1.2s, auto and manual make-up gain, swappable tubes and transformers, two-band parametric EQ, and wet/dry parallel processing.
details: |-
  The Pawn Shop Comp is a professional tool that will make a huge difference in the quality and impact of your mixes. It sounds great on any sound source and in virtually any application.

  More than a compressor, the Pawn Shop Comp also has a fully adjustable tube preamp, a two-band equalizer, and swappable components that give you unprecedented control of every parameter of the plugin.

  A unique hybrid tube/FET circuit lets the Pawn Shop Comp handle virtually any compression task you throw at it, from gentle to brutal, smooth to punchy, vocals to drums. Wide range ATTACK, RELEASE and RATIO controls let you precisely craft the compressor to the dynamics of the track, and there are a ton of presets too.

  Tube warmth and saturation plus two bands of equalization turn the PSC into a vintage channel strip. Gain and Bias adjustments let you add color from saturation to full-out distortion, and swapping different tubes and transformers changes the preamp saturation characteristics so the plug-in can emulate circuits from the 1950s to right now.

  Different resistors and transistors change compression curves and frequency response, OPERATING LEVEL adds another bit of saturation, and DRY/WET lets you run the PSC in parallel. A responsive gain reduction meter guides you visually, there is auto makeup gain, and the compressor can be bypassed to use the tube preamp alone.
specs: |-
  - Hybrid tube/FET compressor circuit
  - Wide range Attack, Release and Ratio controls
  - Gain reduction meter with auto makeup gain
  - Compressor bypass to use the tube preamp alone
  - Fully adjustable tube preamp with Gain and Bias
  - Two-band equalizer
  - Swappable tubes and transformers
  - Swappable resistors and transistors to change compression curves and frequency response
  - Operating Level control for extra saturation
  - Dry/Wet control for parallel processing
  - GPU acceleration for faster, smoother performance
  - Aux Panel for presets, level trims and more
