description: A hybrid tube/FET compressor combining compression capabilities
  with a fully adjustable tube preamp, two-band equalizer, and swappable
  components. Functions as a versatile channel strip suitable for drums, bass,
  vocals, keys, guitars, and bus processing. Features threshold from 0dB to
  -100dB, ratio from 2:1 to 50:1, attack from 0.2ms to 200ms, release from 10ms
  to 1.2s, auto and manual make-up gain, swappable tubes and transformers,
  two-band parametric EQ, and wet/dry parallel processing.
details: |-
  Gritty. Punchy. Smooth. Warm. All that. And more! The Pawn Shop Comp is a professional tool that will make a huge difference in the quality and impact of your mixes. It sounds great on any sound source and in virtually any application.

  More than a compressor, the Pawn Shop Comp also has a fully adjustable tube preamp, a two-band equalizer, and swappable components that give you unprecedented control of every parameter of the plugin.

  The 2.1 upgrade adds System/Machine authorization. You can now license your plugin via iLOK dongle, and iLOK cloud account, and via System/Machine authorization.

  The PSC 2.1 upgrade also features faster, smoother performance by utilizing GPU acceleration, and adds a new Aux Panel for easier access to presets, level trims, and more.

  Sound on Sound: "A nice, vibey compressor plug-in that should please those with a penchant for tonal tweakery!" "your ears are greeted with optimum mojo... it never takes long to find something cool"
specs: |-
  - A Killer Compressor: a unique hybrid tube/FET circuit handles virtually any compression task, from gentle to brutal, smooth to punchy, vocals to drums
  - Fully Adjustable: wide range ATTACK, RELEASE and RATIO controls, plus a large preset library
  - Metering and More: response gain reduction meter, auto makeup gain, and the compressor can be bypassed to use the tube preamp alone
  - A Tube Preamp and EQ: tube warmth and saturation with two bands of equalization, with Gain and Bias adjustments from saturation to full-out distortion
  - Swap Tubes and Transformers: change preamp saturation characteristics by swapping tubes and transformers, emulating circuits from the 1950s to right now
  - Still More: swappable resistors and transistors change compression curves and frequency response, OPERATING LEVEL adds saturation, and DRY/WET runs the PSC in parallel
  - 2.1 upgrade: System/Machine authorization, GPU acceleration for faster performance, and a new Aux Panel for presets and level trims
  - Licensing: iLok account required for activation, iLok dongle, iLok Cloud or System/Machine authorization, up to four (4) simultaneous machine activations, internet connection required for activation and for all demos
  - Minimum system: Intel, AMD or Apple Silicon i5 quad core processor, 4GB of RAM, Mac OS X 10.14 or higher, Windows 7 and above, screen resolution 1024 x 768 or higher
  - Supported plugin formats: Mac 64bit (VST3, AU, AAX), Windows 64bit (VST3, AAX)
