description: A hybrid tube/FET compressor combining compression capabilities with a fully adjustable tube preamp, two-band equalizer, and swappable components. Functions as a versatile channel strip suitable for drums, bass, vocals, keys, guitars, and bus processing. Features threshold from 0dB to -100dB, ratio from 2:1 to 50:1, attack from 0.2ms to 200ms, release from 10ms to 1.2s, auto and manual make-up gain, swappable tubes and transformers, two-band parametric EQ, and wet/dry parallel processing.
details: |-
  The Pawn Shop Comp 2.1 is a unique hybrid tube/FET compression plugin that handles virtually any compression task. Complete controls for all compressor parameters let you tailor response from smooth to punchy to total crush, making it equally at home on bass, vocals, drums, keys, or the full mix bus.

  At the heart of the PSC is a fully adjustable tube preamp. Swap between three different sets of tubes and three different transformers to adjust the response from timid to street thug. Combined with the preamp Gain and Bias controls, tubes and transformers let the PSC sound like a classic tube limiter from the early 1960s through to modern, high-end bespoke compressors and all shades in-between.

  The two-band parametric EQ (WEIGHT and FOCUS controls) can compensate for the loss of lows and presence that occurs at high compression settings, or be used for creativity and enhancement. The WEIGHT control targets extreme lows (ideal for kick drums) or slightly higher frequencies for warmth, while the FOCUS control is centered in the midrange and can add presence and width, each with +/- 8dB of gain.

  Want to change the compression curves? Swap in different FETs. Want a vintage sound? Swap in carbon resistors. Need something bright and modern? Switch to metal film resistors. A WET/DRY control, INPUT and OUTPUT trims, adjustable OVERSAMPLING rate, and preset library complete the package.
specs: |-
  - Threshold: 0dB to -100dB
  - Ratio: 2:1 to 50:1
  - Attack: 0.2ms to 200ms
  - Release: 10ms to 1.2s
  - Swappable tubes (3 sets) and transformers (3 sets)
  - Two-band parametric EQ: WEIGHT (lows) and FOCUS (midrange), +/-8dB each
  - Wet/Dry control for parallel processing
  - Adjustable Operating Level and Oversampling rate
  - Swappable FET components and resistors (carbon/metal film)
  - Input and Output trims, preset library, scalable GUI
  - iLOK account required (software-based, no dongle)
  - Up to 4 simultaneous machine activations
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
  - macOS 10.14 or higher
  - Windows 7 and above
  - Minimum: Intel/AMD/Apple Silicon i5 quad-core, 4GB RAM
