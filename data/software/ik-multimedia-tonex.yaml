description: "AmpliTube TONEX for Mac/PC uses breakthrough AI Machine Modeling™
  technology to model the sound of any amp, cabinet, combo and most pedals and
  turn it into a plug-in."
details: |-
  TONEX uses breakthrough AI Machine Modeling technology to capture the sound of real amps, cabinets, combos, and most pedals, turning them into plug-in tone models in approximately 5 minutes. VIR (Volumetric Impulse Response) technology provides accurate cabinet modeling.

  The plug-in includes built-in EQ, compressor, modulation, delay, reverb, and noise gate across 15 FX types in 7 effect slots. Custom impulse response support and ToneNET integration with over 20,000 community tone models expand the available sound palette.

  The TONEX Modeler standalone app supports batch processing for capturing multiple pieces of gear efficiently. The TONEX Editor app provides control over TONEX hardware pedals. Fully compatible with AmpliTube 5.
specs: |-
  - AI Machine Modeling technology
  - VIR (Volumetric Impulse Response) cabinet modeling
