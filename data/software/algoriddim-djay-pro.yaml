description: Cross-platform DJ application with Neural Mix stem separation and
  direct integration with Apple Music, Spotify, TIDAL, SoundCloud and Beatport.
details: |-
  djay Pro is Algoriddim's professional DJ application. One subscription covers macOS, Windows, iPhone, iPad and Android, and the company also ships versions for Apple Vision Pro and Meta Quest.

  Neural Mix is the product's stem separation technology, isolating beats, instruments and vocals from any track in real time so that elements from several songs can be played together.

  Streaming integration gives access to catalogues from Apple Music, Spotify, TIDAL, SoundCloud and Beatport alongside a local music library. Fluid Beatgrid handles beat matching across tempo changes, and Crossfader Fusion morphs between tracks using filtering and effects rather than a plain blend.

  Performance tools include an AI-driven Automix for automatic transitions, a sequencer and looper for building beats live, video mixing with visual effects, and mix recording. Hardware support covers more than 100 DJ controllers out of the box with a MIDI learn system for anything else.

  djay received an Apple Design Award in 2024. The Mac version requires macOS 10.15 or later.
specs: |-
  - Neural Mix real-time stem separation
  - Fluid Beatgrid beat matching engine
  - Crossfader Fusion transitions with filtering and effects
  - AI-driven Automix
  - Sequencer and looper for live production
  - Video mixing with visual effects
  - Mix recording
  - Streaming from Apple Music, Spotify, TIDAL, SoundCloud and Beatport
  - Support for over 100 DJ controllers with MIDI learn
  - Single subscription covering Mac, Windows, iPhone, iPad and Android
