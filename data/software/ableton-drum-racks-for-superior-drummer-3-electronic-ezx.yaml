description: Ableton drum racks for superior drummer 3 electronic ezx features
  separate ableton
details: >-
  Ableton drum racks for superior drummer 3 electronic ezx features separate
  ableton drum racks for all factory presets for the toontrack superior drummer
  3 and electronic ezx library for toontrack ezdrummer. These racks provide out
  of the box integration workflow between ableton live and toontrack superior
  drummer 3 using the toontrack libraries including a host of features ready to
  use for composition and performance using ableton push or similar controllers.


  6 ableton drum racks to instantly load the factory library "mix ready" presets
  with ableton mappings. 3 ableton live templates designed to host the multi
  channel output routing presets with track level audio routing from superior
  drummer 3 into ableton live. Colour coded pad design for visual performance
  and finger drumming.


  Vast array of instrument articulations ready to go in one massive layout using
  ableton push 64 pad layout mode. Individually labelled drum rack pads for
  clear visualisation, post performance editing and automation to all drum rack
  / instrument articulations in ableton.


  Ableton macros mapped to toontrack superior drummer macros with preset values
  for ease of use in push and simple to use automation programming. Singleout
  presets 3 ableton drum racks for all electronic factory presets single audio
  output to a single ableton track.


  Multiout presets featuring 3 ableton drum racks for all electronic ezx presets
  in multiple audio channel output from the plug in to multiple ableton audio
  tracks using the 3 multi output ableton templates also provided designed for
  the kit presets. Track level audio mixing control in ableton.
specs: |-
  - Ableton drum racks
  - Toontrack superior drummer 3 integration
  - Electronic ezx library support
  - Ableton push controller compatibility
  - Factory presets
  - Audio routing
  - Multi-channel output routing
  - Single output presets
  - Multi output presets
  - Colour coded pad design
  - 64 pad layout mode
  - Individually labelled drum rack pads
  - Ableton macros mapped to toontrack superior drummer macros
  - Ableton live templates
  - Track level audio routing
  - Ableton track mixer integration
  - Ableton audio effects support
  - Custom preset creation
  - Macos and windows compatibility
