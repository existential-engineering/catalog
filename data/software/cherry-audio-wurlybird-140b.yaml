details: |-
  Wurlybird 140B is Cherry Audio's first sample-based electro-acoustic virtual instrument, modeled after the 1964 Wurlitzer 140B, considered by many to be the crown jewel of the legendary Wurlitzer electric piano family. Though the 200-series models are more widely known, and often emulated, many devoted Wurly enthusiasts believe the 140B to have superior action and tone quality. Wurlybird 140B has been crafted through deep expert sampling of a professionally restored 140B, along with subtle randomization of key release and pedal sounds, precision modeling of the original preamp, faithfully emulated vibrato/tremolo, and even adjustable background hum. Additionally, Wurlybird 140B includes a broad spectrum of tonal-enhancing stompbox-style effects, ranging from subtle to extreme.

  The Wurlitzer electric piano is unquestionably one of the most classic rock and pop keyboards ever made. Its distinctly rich "bark" and organic timbre have been heard on countless hits over the years, including Ray Charles' "What I'd Say," Queen's "You're My Best Friend," Three Dog Night's "Joy To The World," nearly every hit from Supertramp, and a seriously long list of other rock and pop classics. The resonance of this sound endures today, with contemporary artists like Beck and Billie Eilish ensuring its enduring appeal.

  Over the years, there have been several iterations of the Wurly (or "Wurli"). The model 200 and 200A variants, released in 1968, are the most well known. These models are lighter and more durable than previous versions due to their molded plastic cases, making them more practical for live gigging musicians. Although the 200-series models are the most common, dedicated Wurly fans consider the earlier 140B model the best in the range, with superior action and tone quality. The 140B resulted from Wurlitzer's complete redesign of the keyboard's mechanical action, modified cabinet design, and the introduction of their first solid-state amplifier.

  Wurlybird 140B offers everything a true connoisseur and performer would want from such an instrument. It features carefully modeled built-in vibrato/tremolo, varied release samples, adjustable background hum, and even the "clunk" of the sustain pedal. In addition to the super-accurate sampling and preamp modeling, it includes eight stomp-box style studio-quality effects: Tube Overdrive, Chorus, Rotator, Delay, Reverb, Seven-Band Graphic EQ, and all-new effects algorithms for the 70's Phaser and LoFi with discrete vinyl and noise. Wurlybird also provides over 60 presets that span from classic to modern tones.

  The sampling project was carried out by sound designer and sample programmer Mike Martin, working from keyboardist Tom Hammer's 140B, restored by Vintage Vibe. The preset library was created by sound designers James Terris and James Dyson.
