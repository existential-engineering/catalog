details: |-
  Wurlybird 140B is Cherry Audio's first sample-based electro-acoustic virtual
  instrument, modeled after the 1964 Wurlitzer 140B, considered by many to be
  the crown jewel of the legendary Wurlitzer electric piano family.

  The Wurlitzer electric piano is one of the most classic rock and pop keyboards
  ever made. Its distinctly rich bark and organic timbre have been heard on
  countless hits, including Ray Charles' "What I'd Say," Queen's "You're My
  Best Friend," Three Dog Night's "Joy To The World," and nearly every hit from
  Supertramp.

  Although the 200-series models are the most common, dedicated Wurlitzer fans
  consider the earlier 140B model the best in the range, with superior action
  and tone quality. The 140B resulted from Wurlitzer's complete redesign of the
  keyboard's mechanical action, modified cabinet design, and the introduction of
  their first solid-state amplifier.

  Features include deep multi-sample programming capturing the response of every
  key and reed, recorded from a reference 1964 model. Eight stompbox-style
  effects provide extensive sound shaping including tube overdrive, chorus,
  rotator, delay, reverb, graphic EQ, phaser, and lo-fi.
specs: |-
  - Deep multi-sample programming capturing response of every key and reed
  - Recorded from a reference 1964 Wurlitzer 140B model
  - Subtle randomization of key release and pedal sounds
  - Precise preamp modeling
  - Vibrato/Tremolo, Tune, Hum, and Velocity Curve controls
  - Eight stompbox-style effects: Tube Overdrive, Chorus, Rotator, Delay, Reverb, Seven-Band Graphic EQ, 70s Phaser, LoFi
  - Over 60 presets
  - Resizable UI
  - Complete MIDI control and DAW automation
  - macOS 10.13+ and Windows 7+ (64-bit)
  - 380 MB disk space required
