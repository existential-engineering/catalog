details: |-
  Discover the collection of our most creative effects for producing
  professional quality music from anywhere you are. Turn your home studio into a
  hit factory with many of the same vocal production tools the world's leading
  producers rely on in professional studios.

  Vocal sampling, innovative creative effects, and authentic auto-tune pitch
  correction are all here to help you generate new musical ideas from scratch.
  With access to informative tutorials and free technical support, you'll have
  the knowledge you need to start creating new music quickly and easily.

  Auto-tune efx+ 10 combines the core features of auto-tune with the powerful
  efx modular multi-effects rack. Engineered specifically for vocals, auto-tune
  vocal eq isolates and accentuates precise frequencies to make vocals sound
  smoother and shine in the mix.

  Auto-tune slice is a hybrid of a precision sampler and flexible synthesizer
  where you can play voices like instruments and turn endless samples into
  songs. Auto-key 2 is an automatic key and scale detection plug-in, designed to
  enhance your auto-tune workflow and save valuable time in the studio.

  Choir is a unique vocal processor that turns a single monophonic voice into a
  lush choir of 4, 8, 16, or 32 distinct individual unison voices, each with its
  own pitch, timing, and vibrato variations. Duo is the easiest way to enhance
  vocals with a realistic doubled vocal part automatically generated from an
  existing vocal track.
