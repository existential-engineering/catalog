description: ZeroWidth is the intelligent stereo widener that learns your mix's correlation profile. Auto Side EQ, 7 frequency bands, mono-safe by design.
details: |-
  Traditional wideners force you to guess. Every audio source has its unique correlation characteristics, and you are setting parameters in the dark hoping they will work. Meanwhile the material you are widening keeps changing, and you end up micro-managing every single setting.

  ZeroWidth lets the widener adapt to your audio rather than the other way around. It analyzes your material in real time, auto-calibrates all parameters, and offers seven multi-band bands to instantly change character. Whether you are recording vocals, taming nervous acoustic guitars, or adding controlled width to the mix bus, it adapts with zero setup time.

  Real-time correlation profile analysis automatically sets auto Side EQ, auto Width and per-band correlation learning, with seven manual band overrides. Visual feedback shows the learning progress, so you know when enough material has been analyzed. The zero-latency, per-sample processing engine is designed to avoid parameter oscillations and phase cancellation.

  Controls are deliberately simple. Widening is a single percentage from 0 to 100%, where 100% widens the full correlation profile detected by the analysis engine. Auto EQ scales the per-band Auto Side EQ amount from 0% (disabled) to 200% (intensified). Reset re-triggers the learning algorithm when the material changes, and Bypass gives an instant A/B comparison.

  The interface is minimalist with scalable, GPU-accelerated graphics, and input, output and correlation meters provide instant visual feedback on widening behaviour.
specs: |-
  - Real-time correlation profile analysis with adaptive widening engine
  - Auto Side EQ with per-band targets
  - Seven manual frequency band overrides
  - Widening control, 0 to 100%
  - Auto EQ control, 0 to 200%
  - Reset and Bypass controls
  - Input, output and correlation meters
  - Zero-latency per-sample processing, suitable for live tracking
  - Hardware-accelerated, scalable graphics
  - Formats: Audio Units (AU), VST3, AAX
  - macOS 10.15+ and Windows 10+
  - Apple Silicon native, M1/M2/M3/M4 optimized
