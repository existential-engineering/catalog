description: ZeroWidth is the intelligent stereo widener that learns your mix's
  correlation profile. Auto Side EQ, 7 frequency bands, mono-safe by design.
details: |-
  ZeroWidth is a stereo widener built around real-time correlation profile analysis. Rather than asking the engineer to set auto EQ, side gain and learning parameters by hand, it analyses the incoming material and auto-calibrates its widening parameters to that material's correlation characteristics.

  The analysis is multi-band: ZeroWidth sets auto Side EQ, auto Width and per-band correlation learning across seven bands, each of which can be overridden manually. Visual convergence indicators show the learning progress so the user knows when enough material has been analysed for the plugin to deliver its intended result.

  Three of the band characters are called out explicitly. 10kHz gives a sweet, musical response aimed at melodic vocals and transparent master bus control; 1.25kHz gives a fast, precise response for drums and acoustic guitars with emphasis on transients; 156Hz gives a fuller, denser tone for bass, aggressive vocals and wide drums.

  The control set is deliberately small: a single Widening percentage from 0 to 100%, an Auto EQ control scaling the per-band Auto Side EQ amount from 0% to 200%, a Reset that re-triggers the learning algorithm when the material changes, and a Bypass for instant A/B comparison. All parameters are DAW-automatable.

  The processing engine works per sample and is designed to avoid parameter oscillation and phase cancellation, keeping the result mono-safe. The interface uses hardware-accelerated, scalable graphics with input, output and correlation meters, and the plugin is native on Apple Silicon. HoRNet ships it with no copy protection, watermarking downloaded files with the purchaser's email address instead.
specs: |-
  - Real-time correlation profile analysis with adaptive auto EQ and side gain
  - Multi-band correlation analysis across 7 frequency bands
  - Auto Side EQ with per-band targets and manual band overrides
  - Learning progress visualization with per-model convergence indicators
  - Zero-latency per-sample processing designed to prevent phase cancellation
  - Widening control from 0 to 100% of the detected correlation profile
  - Auto EQ control scaling per-band Auto Side EQ from 0% to 200%
  - Reset control to re-trigger learning on new material
  - Bypass for instant A/B comparison
  - All parameters DAW-automatable
  - Input, output and correlation meters
  - Hardware-accelerated, scalable graphics for standard and retina displays
  - Apple Silicon native, optimized for M1/M2/M3/M4
  - Minimal latency, suitable for live tracking
  - macOS 10.15 or later, Windows 10 or later
