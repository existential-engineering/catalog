details: |-
  Bitcrush can be used to create distorting effects that sound like that of
  scraping analog radio, or inherently lo-fi sound sources, like old video
  games.

  Bitcrush shines on its own, but it was primarily created to power up the
  different "snapin hosts" kilohearts offer. These are bigger effects units that
  utilize all the available snapins and give you a really fun and creative
  workflow for combining them in any way you can think of.

  The rate display allows you to down sample the signal to a minimum of 200 hz.
  The bits knob quantizes the amplitude of each sample of the signal, where a
  lower value will result in a more distorted sound.

  The adc q knob controls the quality of the analog-to-digital conversion, with
  a lower value adding dissonant aliasing in the low frequencies. The dac q knob
  controls the quality of the digital-to-analog conversion, with a lower value
  adding dissonant aliasing in the high frequencies.

  The bottom right corner of all kilohearts plugins features a resize handle for
  scaling the ui to any size, allowing you to get a good view of the controls
  whatever the screen resolution, and also comes in handy if you need big
  controls, e.g. When using bitcrush as a real-time effect on a touchscreen
  monitor during a live set.
specs: |-




  - Rate display - down sample the signal to a minimum of 200 hz

  - Bits knob - quantize the amplitude of each sample of the signal

  - Adc q knob - quality of the analog-to-digital conversion

  - Dac q knob - quality of the digital-to-analog conversion

  - Dither knob - adds noise to the signal to reduce distortion caused by
  quantization

  - Mix knob - dry/wet mix control

  - Settings panel with preset handling

  - Enabled checkbox for effect bypass

  - Resize handle for ui scaling

  - Rack extension for reason
