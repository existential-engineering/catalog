description: "Vocal de-esser plugin for removing harsh sibilance with surgical
  precision and musical transparency. Features real-time visual feedback,
  precise dynamic controls, and auto gain."
details: |-
  Smooth, transparent de-essing that maintains vocal energy. Precise dynamic controls: threshold, speed, ratio. Real-time visual feedback with live metering and solo mode. Pre-delay for accurate sibilance detection. Auto Gain and Monitor Mode. Part of Vocal Plugin Bundle. Requires macOS 11+ or Windows 10 64-bit+.
