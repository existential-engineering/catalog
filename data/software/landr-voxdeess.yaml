description: Tame harsh “S” sounds with VoxDeEss. Get clean and clear vocals
  fast. The perfect de-esser for music, podcasts, and voiceovers.
details: |-
  LANDR VoxDeEss is a vocal de-esser plugin built to clean up harsh sibilance without compromising tone, brightness, or feel. It gives detailed control and instant visual feedback, so every voice, from lead vocals to podcasts, sounds smooth, clear, and confidently polished.

  The plugin tames sibilance with what LANDR describes as surgical precision and musical transparency, preserving energy and tone. Whether the source is a lead vocal, spoken word, or a podcast, the goal is studio-smooth results without artifacts in seconds.

  Dynamic behaviour is shaped with threshold, speed, and ratio controls tailored for voice, so the response can be dialled in quickly for a given performance. A pre-delay control pinpoints sibilance with accuracy before reduction is applied.

  Visual feedback is a core part of the workflow: a real-time visualizer shows exactly what is being reduced, and live metering plus a solo mode let the de-essing be fine-tuned by ear and eye together. Auto Gain and Monitor Mode keep levels balanced while tweaking.

  VoxDeEss runs on macOS 11 or higher (Apple Silicon Native or Intel) in VST3, AU, and AAX formats, and on Windows 10 64-bit or higher in VST3 and AAX. It is also included with LANDR Studio subscription plans.
