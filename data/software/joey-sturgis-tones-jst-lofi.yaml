details: |-
  JST LOFI: Vintage Vibes With A Single Click!
  Overview
  Introducing JST LOFI, the one-stop-shop for adding vintage character to your tracks. Whether you're working on hip-hop beats, electronic music, or any project that needs a touch of retro charm, JST LOFI delivers the warmth, texture, and character that make your tracks stand out. Designed for music creators who crave analog warmth and lo-fi aesthetics, JST LOFI is your go-to plugin for transforming sterile digital recordings into nostalgic masterpieces.
  Hear it In Action
  Check out these audio examples to experience the unique impact of JST LOFI on various tracks. From subtle enhancements to full-on transformations, JST LOFI provides the versatility you need to give your tracks a blast from the past.
  Add authentic crackles, hisses, and hums with precise control over the noise elements. Use the Tone, Vibe, Duck/Follow, and Speed controls to shape the noise to fit your track perfectly. Choose from the following modes:
  Vinyl - Emulates the crackly and wind-like noise floor of a vinyl disc for that retro feel found on classic records
  VHS - Provides the static-like noise floor of a VHS (video home system) associated with media released in the late 70’s, 80’s, 90’s and early 2000’s.
  Cassette - Produces the underwater-sounding noise floor of a cassette tape, very familiar to people growing up between the 60’s and 90’s.
  Tape - Emulates the high-hiss noise floor sound of a tape machine giving you the power to inject a well known sound of the past into your productions.
  Custom - Load additional textures from your computer to create endless tonal options. Choose from a list of factory supplied textures including Damaged VHS, Dusty Tape and many others, or load your own unique texture.
  Choose from the default Impulse Response with adjustable controls, a list of factory impulse response devices such as headphones, speakers and more, or load your own impulse response.  Factory modes include:
  Classic - the default mode, with Range and Amount controls to sculpt the JST Custom Impulse Response to your track.
  Device - Choose from Headphones 1, Headphones 2, Piezo, Phone, Small Speaker, Speaker and Tablet.
  Custom IR - You can load in a custom Impulse Response to customize the sound, making the end result truly yours.
  Use the mix slider to engage parallel processing.
  Provides harmonic saturation and glue or smooth and broken-up overdrive. Use the Drive, Growl and Voicing controls to seamlessly sculpt the perfect analog distortion, giving your tracks a flavor of history. Choose from the available two modes:
  Tape: Provides the well-loved harmonic saturation and glue-like characteristics found on tape. These qualities are sought after by many audio enthusiasts.
  Tube: Emulates the warm and smooth sound of tube distortion. Use Tube to add some extra life and crisp harmonic saturation to your source audio.
  Engage these effects to finalize your sound. Whether you want to bitcrush, comb filter or warp the pitch of your audio. JST LOFI has you covered! These refining effects consist of:
  Tape Stop - Gives you the classic Tape Stop slowing down effect, without having to leave the plugin.
  Erosion - Adds an additional distortion to the audio with crunch and grainy characteristics.
  Warp - Provides pitch variations to your track similar to tape flutter, adding inconsistencies.
  Crush - A bitcrushing effect to change to sample rate and sample depth of your audio.
  Retroverb - A comb filtering effect, perfect for providing movement with automation.
  Global Controls
  Adjust the high-pass and low-pass filters, mix control and mono button to change the sound of the entire audio, without making changes to individual modules for more tone shaping options. You can also press the Randomize Parameters button to generate entirely new settings, whenever you want to spice it up!
  Easy-to-Use Interface
  The intuitive user interface allows you to effortlessly achieve professional results. The straightforward controls make it easy to dial in the perfect amount of vibes and character, whether you're a seasoned producer or just starting out.
  Parallel Processing
  JST LOFI includes parallel processing, allowing you to blend the processed signal with the original signal. This feature gives you more control over the final sound, enabling you to add subtle enhancements or completely transform your audio.
  Latency-Free and CPU-Efficient
  Designed to integrate seamlessly into your workflow, JST LOFI operates with zero latency and minimal CPU usage. This efficiency allows you to use multiple instances of the plugin without compromising performance, making it perfect for complex sessions.
  World Class Sound Quality
  JST LOFI brings the analog warmth and digital precision of classic recording equipment into a versatile and powerful plugin. Experience high-resolution, analog-modeled effects that give your tracks the full-bodied warmth and sparkling detail found in professional productions.
  Now’s the Time to Switch to JST LOFI
  Create smooth and relaxing songs for your audience to chill out to, whether they want to unwind in the evening, or enjoy some background noise while working. JST LOFI provides you with everything you need to create the perfect ‘Lo-Fi’ sound. Unlock the endless chilled vibes and vintage charm with JST LOFI.
  Saving and Managing Presets
  Explore Factory & Artist Presets: Broken down by category and/or use-case, these pre-made presets can be really helpful for quick results and exploring the plugin.
  Create Custom Presets: Save your finely tuned settings as new presets for future sessions, ensuring quick recall of your signature sounds.
  Share & Download User Presets: Check online for other users’ presets in the Joey Sturgis Tones forum on Facebook!
