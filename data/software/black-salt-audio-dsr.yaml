description: DSR is the simplest, fastest, most satisfying way to get transparent & musical de-essing in your mixes.
details: |-
  DSR is a de-esser plugin built to remove harsh sibilance quickly and transparently, without affecting the tone or clarity of a vocal. Instead of complicated multiband controls, it distills the process down to a single dial for reduction amount, aiming to make de-essing disappear as a task rather than something engineers have to fight with.

  The plugin uses an intelligent detection algorithm that targets only harsh sibilance frequencies, leaving the rest of the vocal's character untouched. A Threshold control acts on an internally fine-tuned sidechain signal to pinpoint sibilance, while a Range control sets a ceiling on how much reduction can occur.

  Visual feedback is built in: a sibilance indicator shows when the plugin is active, and a Gain Reduction Meter displays how much de-essing is happening in real time, so users can trust what they're hearing rather than guessing.
specs: |-
  - Intelligent sibilance detection algorithm
  - Single Gain Reduction control dial
  - Threshold control acting on an internally fine-tuned sidechain signal
  - Range control to limit maximum reduction intensity
  - Visual sibilance indicator
  - Real-time Gain Reduction Meter
  - DAW support: Ableton Live 11+, Bitwig 4+, Cakewalk Next by BandLab, Cubase 13+, Digital Performer 11+, FL Studio 23+, Garageband 10+, Logic Pro 10+, Pro Tools 12+, Presonus Studio One 5+, Reaper v6+
