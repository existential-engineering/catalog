description: Doepfer A-188-1 BBD is a delay effect modeled after a rare and
  exciting hardware. Created in collaboration with Doepfer, this Modular
  expansion is great for dirty delays, sharp slapbacks, whooshing swirly
  ambience, or utter craziness.
details: |-
  It's time to take control of time itself, with the Doepfer A-188-1 Bucket Brigade Device for Softube Modular. Softube's officially licensed software version of the BBD module represented a new challenge in terms of component by component analog modeling, and the results were worth the effort.

  By passing your signal along a line of capacitors, the BBD delays your sound in time, but also degrades it with high-frequency loss and additional noise (as well as noticeable sample-rate reduction and aliasing at high delay times). This creates a warm and dirty effect, much sought after in the mid/late '70s, and still loved.

  Made for Modular, Softube's Eurorack platform. The module can be used within synth patches in Modular, or for processing external audio in Modular FX.

  Six different models are available in one module, and the original noise bleed characteristic can be kept or simply switched off. Taking advantage of the disadvantages of this special design, the BBD also works as a bitcrusher or distortion unit, or as the basis of a home-built flanger/chorus for guitars, drums, or any other audio source.

  "There's so much more to this delay than you might imagine, a self oscillating joy that opens up your rack into a spacious bouncing new world of sound, and as crunchy and dirty as you might imagine. Wonderful!" Robin Rimbaud a.k.a. Scanner, producer, DJ, remixer and artist.
specs: |-
  - Unusual '70s-style solid-state delay module
  - Ultra-precise model of a rare and exciting style of analog delay effect
  - Made for Modular, Softube's Eurorack platform
  - Can be used within synth patches in Modular, or for processing external audio in Modular FX
  - Six different models in one module
