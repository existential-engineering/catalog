description: Action Woodwinds provides the lively sound of a full woodwind ensemble, coupled with unparalleled creative flexibility.
details: |-
  Action Woodwinds is a cinematic woodwind engine built around the sound of a 13-piece orchestral woodwind ensemble, from the vibrant tones of clarinets, English horns, oboes and flutes to the deep resonance of bassoons and contrabass clarinets. Two separately configurable ensembles, high and low, are driven by an extensive collection of pre-built orchestral phrases written for drama, tension and impact, so blockbuster cues, fantasy soundtracks and action trailers can be assembled quickly.

  The instrument ships with over 160 themes spanning different moods, styles and characteristics, each built from a bank of over 1000 swappable phrases. Phrases can be used as they are, tailored and blended into custom themes, or built from scratch out of Live Modules and single articulations. Modules can be chopped, duplicated and refined to create trills, crescendos, falls and runs, and the editor page allows any existing phrase to be freely rewritten.

  Melodic mode adjusts note pitches to create custom phrases, while Arpeggio mode turns chords into passages; note sequences can also be played in real time using a range of articulations. The mixer page offers multiple mic positions and individual controls for both the high and low ensembles, and everything performed can be exported as a MIDI file for use with other instruments in the DAW.

  The newest engine additions include a Scaler feature that keeps performances in a chosen key across 20 scale types, a Custom mode for designing each step of a sequence and choosing which notes of the chord play, and an 8va button that doubles a phrase an octave above. The instrument integrates with Komplete Kontrol keyboards, where phrases can be switched via the Light Guide and EQ, reverb and tempo parameters are mapped automatically to the hardware controls.
