description: Cinematic Rooms is a surround reverb processor plugin with full
  Atmos compatibility.
details: |-
  Cinematic Rooms is a reverb dedicated to the intense acoustic demands of surround room simulation. Deep yet accessible, advanced surround workflow tools allow you to design convincing rooms with incredible transparency up to 9.1.6 Atmos.

  Refined, simplified, but never acoustically compromised, the standard edition is ideal for rapid workflows and music mixing projects that need a world-class rooms algorithm without the advanced post and score mixing features of the professional edition.

  Sharing the same reverb and reflection engines as the professional edition, Cinematic Rooms creates a convincing, pure ambience around your sources by simulating sophisticated early and late auditory cues for a wide range of realistic rooms and environments.

  With a wide selection of expertly designed presets and intuitive controls, Cinematic Rooms is designed to help you find a perfect space in no time at all from stereo up to 9.1.6 Atmos.

  LiquidSonics consulted with industry-leading composers, mixers and post-production engineers to create something special for those working in modern surround formats, and designed a reverb from the ground up around three needs: a room reverb with best-in-class sound, innovative creative tools for use in complex surround mixes, and an interface simple and intuitive enough for lightning-fast workflows.
specs: |-
  - Channel formats: Stereo, LCR, Quad, 5.1, 7.1 – 7.1.6, 9.1.6
  - Decay to 45 sec / infinity
  - Reverb and reflection roll-off
  - Reverb decay contouring
  - Pre-delay with sync
  - Level monitoring
  - Surround / True Stereo (optionally +LCR) / Multi-Mono Propagation
  - 80 presets with reverb time based filtering
  - Perpetual license
  - iLok 2/3, iLok machine activation or iLok Cloud required (two activations included with each license, both must be associated with the same iLok account)
  - 64-bit DAW required, not available for 32-bit DAWs
  - Windows 7 and above
  - OS X / macOS 10.13 and above
  - VST 2.4, VST3, Audio Unit (AUv2) and AAX Native plug-in formats
  - macOS installers contain 64-bit Universal Binaries (Apple Silicon and Intel x64)
  - 200 MB hard disk space is required
  - At least 8 GB of main memory is recommended
  - Modern quad-core (or higher) processors are recommended
