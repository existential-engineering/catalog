description: LiquidSonics' Cinematic Rooms is a surround reverb processor plugin with full Atmos compatibility. For AAX, AU and VST.
details: |-
  Cinematic Rooms Standard is a professional surround room reverb plugin designed for music mixing and post-production workflows. It delivers world-class room simulation in a refined, simplified interface suited for rapid workflows where advanced post-production or score features are not required.

  The plugin supports channel formats from stereo through to 9.1.6 Atmos, making it suitable for both traditional stereo music production and immersive audio workflows. Propagation modes include Surround, True Stereo, and Multi-Mono, offering flexible routing across a wide range of DAW configurations.

  Cinematic Rooms Standard ships with 80 presets and provides up to 45 seconds of decay time (with an infinity setting), along with reverb and reflection roll-off, reverb decay contouring, and tempo-synced pre-delay. Built-in level monitoring and a preset browser with reverb time-based filtering round out the feature set.

  Licensing is handled via iLok 2/3, machine activation, or iLok Cloud. Each license includes two activations. A 14-day free trial is available for both macOS and Windows.
specs: |-
  - Supported channel formats: Stereo, LCR, Quad, 5.1, 7.1–7.1.6, 9.1.6 Atmos
  - Plugin formats: VST 2.4, VST3, Audio Unit (AUv2), AAX Native
  - Platforms: macOS 10.13 and above (64-bit), Windows 7 and above (64-bit)
  - Universal Binaries on macOS (Apple Silicon + Intel x64)
  - Decay time: up to 45 seconds or infinity
  - Reverb and reflection roll-off
  - Reverb decay contouring
  - Tempo-synced pre-delay
  - Built-in level monitoring
  - 80 presets with reverb time-based filtering
  - Propagation modes: Surround, True Stereo, Multi-Mono
  - Minimum 8 GB RAM recommended
  - Modern quad-core or higher processor recommended
  - 200 MB hard disk space required
  - iLok 2/3, iLok machine activation, or iLok Cloud required
  - Two activations per license
  - 64-bit only
