details: |-
  Designed for modern surround formats with input from industry-leading composers, mixers and post-production engineers. Features ducking to prevent reverb overwhelming the dry signal while enhancing clarity and intelligibility. Supports up to 9.1.6 Atmos. 64-bit Universal Binaries with Apple Silicon and Intel support. iLok required.
specs: |-
