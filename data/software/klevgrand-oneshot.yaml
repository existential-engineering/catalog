description: OneShot2 is a drum sampler focused on nuance, dynamics and
  realism, pairing a large multi-sampled library of acoustic and electronic
  sounds with a Motion engine for percussive phrases that evolve over time.
details: |-
  OneShot at its core is built around a highly sophisticated drum engine designed for single hits. OneShot2 adds a Motion engine that allows the user to create phrases that breathe and evolve over time. Thanks to this new feature, anyone can craft cymbal swells, shakers, brushed textures, foley elements, and virtually any rhythmic sound that you can think of.

  The first-generation OneShot launched in March 2023 and evolved through regular updates and an expanding sound library. With the release of OneShot2 in March 2026, an all-new Motion Engine and an additional new sound library was introduced, empowering anyone to create timed cymbal swells, shaker patterns, foley textures, and virtually any rhythmic movement imaginable. By adding this dimension of motion to the already powerful OneShot sample playback engine, OneShot2 becomes more than an update, it sets a new standard for what a drum sampler can be.

  OneShot has always been more than just a drum sampler. It is a complete percussive workstation built around a highly sophisticated sample engine designed to add outstanding drums to your projects, where every detail in the workflow and sound design has been carefully considered.

  Developed for playability as much as precision, OneShot delivers superior organic feel through humanize controls, velocity layering, and round robin playback, alongside powerful shaping tools and effects. Even with the addition of the Motion Engine, OneShot2 remains fast, flexible, and intuitive, staying true to Klevgrand's signature workflow.

  The sample engine gives you full control. Each slot has its own mixer channel for effects, levels, and routing. With multi-output support, you can also send sounds to separate tracks in your DAW for further processing. OneShot2 isn't limited to its included multi-sampled sounds: simply drop in your own samples and let OneShot's built-in smartness instantly turn them into playable instruments.
specs: |-
  - A large collection of acoustic and electronic sounds, 780+ unique sounds (20 000+ samples)
  - Over 300 curated presets in many different acoustic and electronic styles
  - Motion Slots (continuous sounds capable of shifting intensity over time)
  - Motion Triggers (intensity controlled by envelope or MIDI CC/Poly aftertouch)
  - Stack Triggers (trigger several sounds with one midi note)
  - Built in effects (EQ, compressor, distortion, several reverbs and room simulator, stereo control, gate, bitcrush, delay, and master finalizer)
  - Reverb2 (algorithm from the Walls-plugin)
  - Transient Adder (add dynamic noise and tone)
  - Unstereo (control stereo width)
  - Workflow improvements (smart preset import/export, effects can be copied/pasted, preview sounds directly in slot browser, custom user folders in Slot File Browser)
  - Regular one shot triggers now has NoteOff functionality when gain envelope is active (optional)
  - Complete mixer with 24 instruments slots loaded at once, two parallel FX busses and master output. (Volume, pan, pitch, two FX inserts, two FX sends and more on each instrument slot)
  - Easy accessible velocity layering, round robin, humanize and choking features
  - Dynamic attack time and filter frequency
  - Multi-out routing (for further processing in the DAW)
  - Requires macOS 10.13 or later (ARM/Intel), Windows 10 (64-bit) or later, running a AU, VST or AAX compatible 64-bit host
  - Optional Motion Controller companion app controls motion sounds from an iPhone accelerometer (iPhone to macOS only, free)
