name: Basscomputer8
manufacturer: synth-kiiwi
primaryCategory: synthesizer
description: Basscomputer8 is a very minimalistic and easy-to-use virtual
  instrument plug-in - yet great and unique sounding!
details: |-
  The plug-in requires an AU- or vst3-compatible DAW and you are all set to
  program or play using the MIDI protocol.

  The usage of 8-string basses is certainly a niche in the music business but we
  at synth kiiwi believe the unique, wide sound of an "eighty" deserves more
  attention. That LED us to sample the instrument "schecter stiletto studio 8"
  as a plug-in.

  The sound is especially suitable for melodic songs. We won't lie: since the
  sound is so unique and the plug-in does not have any humanization feature it
  may not be suitable for every music style, still it will be a great tool to
  spice up your song production.

  8-string bass sound (bass string and octave guitar string). Very basic usage.
  Pickup selection: neck, bridge, or both. Basic technique (finger vs.
  Plectrum). Unprocessed clean instrument output plus five different processed
  output options (amp sounds). Sliding and bending via automation parameter or
  pitch wheel. Three styles via velocity: palm mute (1-10). Regular style
  (11-115). Powerful (116-127).
specs: |-
  - Virtual instrument audio plugin
  - 8-string bass sound
  - Octave guitar string
  - Pickup selection (neck, bridge, or both)
  - Basic technique (finger vs. Plectrum)
  - Unprocessed clean instrument output
  - Five different processed output options (amp sounds)
  - Sliding and bending via automation parameter or pitch wheel
  - Three velocity styles (palm mute, regular style, powerful)
  - MIDI protocol support
  - AU- or VST3-compatible DAW required
  - Multi-core CPU with 64-bit operating system
  - Minimum 2 GB RAM (4 GB recommended)
  - 1 GB free hdd storage or more
  - Compatible with steinberg Cubase, fl studio, reaper
  - Not compatible with AAX / Pro Tools
  - Range from low c tuning (c1) to 24th fret of regular bass tuning (g4)
