details: |-
  606 koncept is a plugin based on a famous analog drum machine from the eighties. Each sound has been meticulously sampled and mapped according to the general MIDI convention.

  Vinyl, tape, and sub sound layers can be triggered on their own to add texture and depth to your drum sequences.

  Each drum sound can be pitch up or down using a unique summing pitch mixer.

  Windows 10/11 or macos 10.14 and up. 9.05 mb of hd space. Quad-core cpu or better with 4 gb of ram or more. 64-bit vsti/aui host.
specs: |-
  - VST plugin
  - Audio units plugin
  - VST 3 plugin
  - 64-bit
  - Multi-lfo
  - Room reverb
  - Highpass/lowpass filter
  - Amplitude range controls
  - 3 voice modes: polyphonic, monophonic, and legato
  - General MIDI convention mapping
  - Vinyl sound layer
  - Tape sound layer
  - Sub sound layer
  - Pitch mixer
