details: |-
  The VEQ-55A is a 3-band EQ with high-pass and low-pass filters designed to emphasize the tiny details a mix has been missing. Whether you need to get a bass guitar to sound edgier, add some meat to your drums, or put more body in the guitars, the VEQ-55A will gently cut what's causing trouble while highlighting what matters.

  The plugin runs natively in your DAW on macOS or Windows, or in real-time on your Antelope Synergy Core interface, making it suitable for both standard mixing workflows and tracking with low-latency hardware acceleration.

  VEQ-55A is also available as part of the Antelope Cosmos subscription, which unlocks 75+ Antelope native plugins.
specs: |-
  - 3-Band EQ
  - High-pass filter (HPF)
  - Low-pass filter (LPF)
  - Runs natively in your DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core interfaces
  - Also included in the Antelope Cosmos subscription (75+ native plugins)
