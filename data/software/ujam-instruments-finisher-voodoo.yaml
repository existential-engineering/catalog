description: Finisher VOODOO combines the power and flexibility of a full rack of audio processors with the instant gratification that UJAM products are famous for.
details: |-
  VOODOO combines the power and flexibility of a full rack of audio processors with the instant gratification that UJAM products are famous for. Its custom-designed effect matrix sounds great on all your guitar tracks. Electric or acoustic, direct or amped, or even virtual instruments, VOODOO delivers the goods. It also works phenomenally well with keyboards, synths, and even vocals.

  VOODOO creates a world of organic, distorted, spicy, colorful, often magical and dark textures. Its expertly crafted effect chains are full of delightful surprises. From high gain lead to strummed acoustic or bluesy crunch tone, there are plenty of options to enhance every style. Make your sound float, rumble, glow and scream.

  Finisher VOODOO features 50 carefully sound-designed effect configurations and more than 150 presets combining 40 distinct algorithms, everything from convolution and modulation to dynamics, distortion and EQs, even multiband, to granular and twisted effects. Five macro knobs give you full sonic control. Play with pedals or knobs and automate to your heart's content.

  If you're already using amp and stomp box emulations, you'll find VOODOO to be a perfect companion. It provides instant inspiration that you can dial in and customize in seconds so you never lose focus on your music.
specs: |-
  - 150 sound designer presets
  - 50 multi-effect chains
  - Combining up to 40 algorithms
  - Including distortion, filters, delays and even granular effects
  - Orange Finisher knob: a macro control multi-wired into all effect algorithms and set up per Mode
  - Vari 1 adjusts the character of the effect, Vari 2 changes modulation settings
  - Vari 3 dials in ambience, Vari 4 is hard-wired to the UJAM Highlighter Filter
  - Highlighter: a combination of low and high pass filters, included in all Modes
  - Operating systems: Windows 10 to Windows 11, macOS Catalina (10.15) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - Minimum 4 GB of RAM
  - 0.07 GB of disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Delivery format: automated installation via the UJAM App, or downloadable installer file
  - Authorization: quick authorization via the UJAM App, or email and password within the plug-in
  - Works on macOS and Windows with all major DAWs, including Ableton Live, Logic Pro, Pro Tools, FL Studio, Cubase, Studio One, Bitwig, Reaper and Reason
