description: Modular audio software for live electronic music performance,
  composition and experimental sound. Now for Mac and PC.
details: |-
  AudioMulch is an interactive musician's environment for PC and Mac used for
  live electronic music performance, composition and sound design. It allows you
  to make music by patching together a range of sound producing and processing
  modules. Unlike some patcher-based programming environments, AudioMulch's
  modules perform high-level musical functions, so you don't have to create
  things from the ground up using individual oscillators and filters.

  AudioMulch uses a non-linear 'signal flow' approach that's more suited to live
  performance than rigid, linear, score-editing style software. This together
  with its intuitive patcher-style user interface makes it a powerful
  performance system. The automation and control features offer a
  fully-configurable control scheme that allows you to be as hands-on or as
  hands-off as you want to be.

  AudioMulch provides users with a unique high-level interface not seen in any
  other music software environment: the Metasurface. The Metasurface is a
  powerful tool for gestural control that turns AudioMulch into an expressive
  musical instrument. Instead of having to turn one knob at a time with the
  mouse, the Metasurface lets you blend smoothly between dozens of parameter
  settings on a two dimensional plane.

  AudioMulch supports VST audio effects and instrument plugins, and Audio Unit
  plugins on Macintosh. It features multichannel input and output with support
  for up to 256 channels, allowing multi-track recording, live mixing, and
  surround sound spatialization. Everything in AudioMulch automatically syncs to
  a global pulse, and it can sync with external devices and other computers over
  a network.

  AudioMulch is designed to be adaptable. It serves as a sound mangling tool
  with granulators, shifters, shapers, delays and filters; a multi-track
  recorder for improvisations and performances; a host for VST and Audio Unit
  software instruments and effects; and a teaching tool for audio processing and
  signal flow concepts.
specs: |-
  - Performance patcher interface for drag-and-drop sonic patching
  - Metasurface: unique 2D control interface for expressive gestural control
  - Built-in signal generators: test tone/noise, drum machine, bassline synthesizer, additive synthesizer, stored sample granulator, loop player, streaming sound file players and recorders (up to 24 channels), Shepard/Risset tone generator, arpeggiator
  - Built-in effects: reverb, flanger, phaser, delay line granulator, ring modulation, stereo delays, dynamic stereo spatialiser, waveshaper, digital grunge inducer, pulsar comb filter, frequency shifter, 16 channel live sampling looper, live sampling canon looper
  - Filters: parametric EQ, resonant comb filter bank, Shepard/Risset filter bank, granular filtering, resonant lowpass with pattern triggering and envelope following control
  - Dynamics processing: compressor, limiter, noise gate
  - Mixers: mono and stereo mixers and gain elements, crossfader, matrix with variable fade times
  - VST and Audio Unit plugin hosting
  - Patchable MIDI routing with third-party MIDI plugin support
  - Quick Mapping MIDI control configuration with hot-plugging during performance
  - Flexible automation system with timeline automation
  - Multichannel I/O supporting up to 256 channels
  - Global pulse synchronization for beats, effects, loops and processes
  - Network synchronization between multiple AudioMulch instances
  - MIDI clock sync (send and receive)
  - Custom rhythmic units and time signatures
  - Multi-track recording and export
  - Extensive built-in help system with contextual help for each contraption
  - Windows: XP, Vista, Windows 7, 8, 8.1, 10 (version 2.2.4)
  - Mac OS X: Leopard through El Capitan (version 2.2.5)
