details: |-
  The 1970 Classic Console Compressor is part of the classic console compressor
  bundle, offering digital recreations of the buss compressor/limiter of two
  famous british mixing consoles.

  The 1970 classic console compressor features digital recreation of transformer
  input and diode bridge gain reduction amplifier characteristics. Smooth and
  warm.

  The compressor and limiter sections are totally independent of each other.
  Both feature separate variable attack, release and threshold controls.

  The internal side chain high and low pass filters fine tune how narrow or
  "broad band" the urs classic console compressor will affect the program
  material. Both filters completely overlap to dial in problem frequencies.

  The listen key allows you to monitor the signal being sent to the gain
  reduction detection circuit. The urs classic console compressor also adds
  other powerful modern features such as totally variable compression ratios,
  attack and release times.
specs: |-
  - Transformer input stage emulation

  - Input level

  - Gain make up output control

  - Separate limiter and compressor threshold controls

  - Variable limiter attack time 1ms - 50ms

  - Variable limiter release time 50ms - 1500ms

  - Brick wall limiter ratio fixed at 1000:1

  - Variable compressor attack time 1ms - 50ms

  - Variable compressor release time 100ms - 1500ms

  - Selectable compressor ratio 1:1, 2:1, 3:1, 4:1, 6:1, 8:1, 10:1, 20:1,
  infinity

  - Variable hi-pass filter side chain @ 12db per octave 20hz to 5k

  - Variable lo-pass filter side chain @ 12db per octave 20khz to 1k

  - Gain reduction meter - selectable limiter, compressor or both

  - In / out bypass switch

  - Line input trim offers -10 to +20 gain variable to .1db

  - Plasma style input and output vu meters

