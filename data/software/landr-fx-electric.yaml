description: LANDR FX Electric guitar effects plugin. Add richness, gloss and
  classic effects to your electric guitar and synth tracks. Included with LANDR
  Studio.
details: |-
  LANDR FX Electric is a multi-effect plugin aimed at electric guitar and synth leads. The page frames it as a way to punch up leads with 50 tailored presets covering everything from crunch and grit to smooth spatial effects, so a lead part stands out without building an effects chain by hand.

  The plugin ships with 49 meticulously crafted presets that deliver a polished sound instantly. LANDR names Auto Wah, Giant and Punky among the creative presets on offer, and positions the collection as a way to find new colour and character for a track in seconds.

  Control is centred on an easy-to-use blender dial that takes the guesswork out of complex mixing techniques, letting the user reach a target sound faster than by tweaking individual parameters.

  Beyond electric guitar, LANDR lists synth leads and bass as intended sources, describing the plugin as a way to take control of guitar, bass, synths and more from a single instance, with presets that add shine and polish to a mix and give a lead the right shape and tone.

  LANDR FX Electric is included with the LANDR Studio subscription, which bundles Plugins, Samples, Mastering and Distribution. The product page also features a demonstration by Oscar-winning engineer Daniel Rowland automating a range of guitar and synth effects with the plugin.
specs: |-
  - 49 presets (page also cites 50 presets)
  - Blender dial for simplified control
  - Creative presets including Auto Wah, Giant and Punky
  - Intended for electric guitar, synth leads and bass
  - macOS: MacOS X 10.14 or higher
  - macOS: Apple Silicon Native or Intel (VST3, AU, AAX)
  - Windows: Windows 10 (64 bit) or higher (VST3, AAX)
