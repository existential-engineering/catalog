description: 360pan suite is a plug-in suite for windows and macos designed to
  deliver up to third order ambisonics mixes for immersive audio
details: >-
  360pan suite is a plug-in suite for windows and macos designed to deliver up
  to third order ambisonics mixes for immersive audio: audio from all
  directions, intended for headphone reproduction, that stays where it is even
  when you turn your head.


  You can do all your panning, distancing and even mixing from within the video
  window of your DAW (reaper or pro tools hd/ultimate). There is no need to have
  any plug-in interfaces open while working.


  360pan enables you to pan mono, stereo or four channel input files into
  ambisonics, using pucks that move on top of the (pro tools hd/ultimate) video
  window. Gain, distance and reverb width, along with the puck itself will show
  up in the (pro tools hd/ultimate) video window when a panner is inserted and
  'show puck' and 'show overlay' are switched on.


  360pan suite currently features the following plug-ins: 360pan - pan your
  audio to ambisonics using the easy video overlay. 360monitor - monitor
  ambisonics audio and preview 360 video. 360reverb - first ambisonics
  convolution reverb. 360limiter - a true ambisonics limiter. 360radar - see
  your ambisonics audio in the video overlay. 360turner - easily fix
  misalignments in ambisonics signals. 360fuma to ambix - convert first order
  fuma ambisonics audio to ambix. 360ambix to fuma - convert first order ambix
  ambisonics audio to fuma.


  The 360pan suite of plug-ins is protected using a single license. An ilok
  (second or third generation) USB key can be used however this is not required:
  the license can also be activated on a machine (computer) using the ilok
  license manager application. A free ilok.com account is required for this.
specs: |-
  - VST 3 plugin
  - AAX plugin
  - Windows and macos
  - First order ambisonics (1oa - 4 channels)
  - Second order ambisonics (2oa - 9 channels)
  - Third order ambisonics (3oa - 16 channels)
  - B-format ambix audio
  - B-format fuma audio
  - Mono input support
  - Stereo input support
  - Four channel input support
  - Video window overlay panning
  - Ilok USB key support (2nd or 3rd generation)
  - Machine-based license activation
  - Ilok.com account required
