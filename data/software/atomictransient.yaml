details: |-
  AtomicTransient is an innovative plugin for polyphonic audio-material
  manipulation and multichannel/polyphonic transient- and envelope shaping.
  AtomicTransient allows appropriate "note-based"/sound-event envelope
  processing in polyphonic audio material. Ideal for mixes, loops, recordings.
  Refined algorithms provide precise and clear transient detection and excellent
  dynamic adjustments.

  It handles up to three channels where each channel processes all parameters
  separately. Use the channels e.g. For guitar, bass-drum and snare-drum and
  adjust the detection to listen only to desired instruments or use
  auto-threshold to automatically detect the basic transients. The included
  effects enable universal, time-based change of the envelope or adjustments by
  lfo filter - in combination with polyphonic mode also for specific drums or
  note-based for polyphonic recording sequences like piano or guitar.

  Polyphonic processing accesses the relevant parts of the sound - all other,
  already audible sounds remain unaffected. This allows, for example, to respond
  only to the bass-instrument, the snare-drum or the hi-hat to remove or
  separate them, add sustain or modify the attack. The overlapping sounds of a
  polyphonic instrument can also be adjusted like separate "notes" in the
  envelope.

  All three channel detections are distributable over frequency ranges to
  separate processing of drums or instruments. The effect-outputs can also be
  mixed to optional variable frequency ranges - parameters are used to modify
  the ratio between effect and source signal. The integrated effects support a
  variety of adjustments to your audio material: they allow to change the
  envelope using the adsr effect not only dynamic in attack and sustain, it can
  even be overwritten with a defined adsr line.

  A detail-context styled spectral meter displays transient events, channels and
  the signal itself. To set the envelope optimal to desired values, the adsr
  effect extracts a visual representation from the real envelope of the current
  signal. Two "listen" functions supports the setting of parameters.
  Atomictransient also supports common parameters like dry/wet, gain, auto-gain
  and features a/b program comparison, preset copy &amp; paste (via clipboard as
  xml), integrated MIDI learn, a scalable/resizable user-interface with two
  different skins and more than 160 factory presets.
specs: |-
