details: |-
  Four oscillators with variable waveshapes, two lowpass-filter and two
  adsr-envelope sections.

  A modulation section with four independent lfos and a variety of modulation
  destinations.

  A simple delay-section to enhance your sound-creations.

  An analyse-section which helps you to keep track of the overall volume and the
  frequencies. Most of the knobs / sliders in the interface are remotely
  controllable by MIDI.
specs: |-
  - Four oscillators with variable waveshapes
  - Two lowpass-filter sections
  - Two ADSR-envelope sections
  - Four independent LFOs
  - Modulation destinations
  - Delay section
  - Analyse section
  - MIDI remote control
  - Windows compatible
