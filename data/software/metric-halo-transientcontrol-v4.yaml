description: TransientControl is a signal processor that modifies dynamics in
  ways that are not possible with traditional compressors, directly changing the
  transient (attack) and sustain of audio. It can make tracks more punchy or
  smooth them out so they sit in a mix.
details: |-
  TransientControl analyzes audio and distinguishes between the onset of sounds (the attack), the sustain of sounds and the decay of sounds (the release). Three gain controls then dial in the relative level of those three elements of the sound.

  It can enhance the attacks of finger-picked guitar or mute the attack of strumming, make an instrument sit in the mix or pop out, control the snap of a snare without affecting the ring, and even change the feel of a percussion pattern.

  The processing happens in real-time with no latency, so the plug-in suits live use as well as mixing.

  Controls cover attack and sustain independently, with advanced controls to modify the attack and release detectors and an Auto Sensitivity mode for processing at any signal level. A detailed display shows the gain applied over time, the UI is adjustable between simple, detailed and advanced layouts and in size, many presets are included, and the MH Preset Manager provides cross-platform presets.

  Version 4 adds a VST3 version on both macOS and Windows, including native Apple Silicon support for VST hosts such as Steinberg's Cubase and Nuendo. All v4 plug-ins add undo and redo, A/B snapshots with snapshot blend, software update tracking, more flexible resizability, common controls in the header bar, improved preset management, settings copy and paste between instances, a plug-in details pane, user configurable themes, selectable knob styles and preferences for band and UI colors.
specs: |-
