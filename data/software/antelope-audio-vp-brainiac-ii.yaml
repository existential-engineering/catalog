details: |-
  Modeled after one of the most unique and complex compressor/limiter designs of the 20th century – the Gain Brain. This original unit has the heavy transient-grabbing abilities of aggressive limiters yet it remains musical and undetectable due to its unique proprietary gain reduction element.

  First introduced in 1971 by Allison Research, the VCA-based design offers attack and release times faster than any tube compressor, making it ideal for dynamic vocals, drums, and other acoustic & percussive instruments. It includes proprietary peak reversion correction circuitry that compensates for low-end loss during heavy compression.

  VP Brainiac II features a Release Mode switch with Linear and Logarithmic options and supports external side-chaining for real-time effects. It can be deployed as a native DAW plugin on macOS or Windows, or run in real time on a Synergy Core interface.
