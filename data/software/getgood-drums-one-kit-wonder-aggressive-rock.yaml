description: A pre-mixed drum library designed for contemporary heavy rock,
  featuring low-tuned drums and cutting cymbals. Delivers blunt force attack and
  shotgun-style room ambience without layered one-shot samples. Comes fully
  engineered and ready to use, with built-in Master EQ, Parallel Compression,
  Reverb, a groove player, and full NKS integration.
details: |-
  One Kit Wonder: Aggressive Rock was conceived with the goal of delivering an extremely beefy sounding kit suitable for contemporary heavy rock.

  Inspired by bands like Beartooth, we chose a small setup of low-tuned drums along with cutting, slightly trashy cymbals. Where these drum tones stand apart from the norm is that there are no layered one-shot samples, this is all one single set of drums tuned, engineered and mixed to deliver the blunt force attack and shotgun-style room ambience that conveys the power and aggression needed for the style.

  Each One Kit Wonder is captured to the same level of detail as our other libraries but comes fully mixed and ready to go so you can dive straight into writing creativity and hear your ideas immediately sound amazing.

  The One Kit Wonder series was inspired by the many GGD users who use our libraries for songwriting. We know how crucial it is that there is as little time wasted between the moment inspiration strikes and you being able to capture it, and how important it is that you can hear your ideas sounding polished and professional so you stay excited as you develop them.

  It's our hope that this sample library will remove frustrating barriers in your creative process so that you can enjoy making music to the fullest.

  This instrument uses the latest version of Kontakt Player from Native Instruments. Installation and activation is managed via Native Access.
