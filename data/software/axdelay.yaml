details: |-
  The aXDelay by SSA Plugins plugin is a delay with feedback and individual
  rotation of delays. It is available in three variations: first-order,
  third-order and seventh-order.

  The axdelay has the following parameters and features for creative control of
  your ambisonic sound field: five individual delay modules - control 5 modules
  each with their own delay, feedback and placement in the sound field. Delay
  time (manual or sync'd to DAW tempo) - control how much delay there is between
  the direct sound and the echo. Delay gain - the level of the delayed signal
  relative to the dry input signal. Feedback gain - the gain applied to the
  feedback signals. Lower gains lead to faster decay.

  Yaw, pitch and roll rotation of delay signal direction - rotate the sound
  field relative to the original so the echoes arrive from a different point on
  the 3d sphere. Individual tap bypass - bypass individual delay modules. Dry
  level - control the level of the dry input signal. Wet level - control the
  level of all delayed signal modules.

  The axdelay is available with 3 levels of spatial resolution, with different
  maximum ambisonic orders: a1delay - delay effect for first-order ambisonic
  signals. A3delay - delay effect for up-to third-order ambisonic signals.
  A7delay - delay effect for up-to seventh-order ambisonic signals.

  Axdelay by ssa plugins is a virtual effect audio plugin for macos and windows.
  It functions as an audio units plugin, a VST 3 plugin and an AAX plugin.
specs: |-
  - Ambix (sn3d/acn) format ambisonics input
  - Ambix (sn3d/acn) format ambisonics output
  - Five individual delay modules
  - Delay time (manual or sync'd to DAW tempo)
  - Delay gain
  - Feedback gain
  - Yaw, pitch and roll rotation of delay signal direction
  - Individual tap bypass
  - Dry level control
  - Wet level control
  - First-order ambisonic support
  - Third-order ambisonic support
  - Seventh-order ambisonic support
  - Universal 2 binary
