details: >-
  Articulate is an integrated AU/VST/AAX plugin and touchscreen app solution
  that gives music composers quick control with minimal user configuration.


  It works with all major third party libraries and players, including kontakt,
  vsl, play, and more.


  With articulate, all of your articulations appear on the ipad as simple
  buttons. Just select the desired articulation and it will be stored as
  automation - not MIDI - in your DAW.


  This allows for much easier editing and for standard automation functions such
  as touch, latch and overwrite to be used. No more cryptic editing on multiple
  MIDI controller channels.


  You can even control the most relevant parameters of the plugin directly from
  articulate, helping to add more expression to your music. These are also
  stored as automation - which again makes performance and editing much easier.
specs: |-
  - AU/VST/AAX plugin
  - Touchscreen app solution
  - Ipad interface
  - Automation storage (not MIDI)
  - Touch automation function
  - Latch automation function
  - Overwrite automation function
  - Parameter control from app
  - Compatible with kontakt
  - Compatible with vsl
  - Compatible with play
  - Standalone application
  - Macos support
  - Windows support
  - Ios support
