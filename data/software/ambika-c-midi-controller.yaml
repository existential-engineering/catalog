details: |-
  The AMBIKA-C MIDI controller is a easy way for sound design with the ambika
  from mutable instruments. A special random function generates sounds in
  seconds.

  The controller comes additional with six step sequencer, each of them had
  parameters like, bpm, sync to host, swing, random velocity, random gate and a
  selectable MIDI in/out.

  Feature list: enhanced MIDI routing, save and load function to the pc /
  transmit to ambika, random function for all selected parameters, ambika
  refresh button.

  Six step sequencer, 16 steps, note, oct, velo, gate. Host to bpm sync. Each
  step sequencer with bpm, timing div/mult, swing, randomize velo and randomize
  gate.

  Sequence transpose in semitones. Multi MIDI channel in/out. Channel 1...16 for
  each step sequencer. Step sequencer also usable with other instruments.
