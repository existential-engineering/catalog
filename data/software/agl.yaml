details: |-
  Ample guitar l aims to bring an alhambra luthier classic guitar sound to your
  studio with finger and pick two sample libraries.

  Sampling includes sustain, palm mute, natural harmonic, hammer on & pull off,
  legato slide, slide in, slide out, and pop articulations with a total size of
  3.97 gb.

  Polyphonic legato and slide smoother enables realistic legato across any
  interval and speed, with drop tuning supported down to d1.

  Riffer 4 is a MIDI editor tailored for plucked string instruments featuring
  the innovative strum note system that treats multiple sub-notes within a chord
  as a single editable object, allowing unified control over strum time,
  velocity gradient, and legato parameters.

  Dual view modes enable seamless real-time switching between piano roll and
  guitar tab views, with a string visualization system that prevents polyphony
  on the same string and intelligently assigns fingering for more authentic
  performance.

  Tab reader 4 supports guitar pro files from gp3 to guitar pro 8 and is capable
  of importing entire bass tracks into riffer with full retention of fingering,
  articulations, and performance data.

  The amp and fx system includes built-in effects: 8-band eq, compressor, delay,
  and convolution reverb.
specs: |-





  - Alhambra luthier classic guitar sound

  - Finger and pick sample libraries

  - 3.97 gb size

  - 8 articulations (sustain, palm mute, natural harmonic, hammer on & pull off,
  legato slide, slide in, slide out, pop)

  - Polyphonic legato and slide smoother

  - Drop tuning support (lowest note d1)

  - Authentic left-hand performance noises

  - Adjustable acoustic resonance

  - Riffer 4 MIDI editor

  - Strum note technology

  - Dual view modes (piano roll and guitar tab)

  - String visualization system

  - Full MIDI import/export compatibility

  - Intuitive technique editing

  - MIDI cc and velocity editors

  - Extensive riff library

  - Strummer with chord detection

  - Strum seq

  - Tab reader 4 (gp3 to guitar pro 8 support)

  - Bass track import capability

  - 8-band eq

  - Compressor

  - Delay

  - Convolution reverb
