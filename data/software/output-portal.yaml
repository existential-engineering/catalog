details: |-
  With Portal, granular synthesis takes your sounds to another dimension. Easily alter any audio input — VSTs, drums, vocals, live guitar, you name it — in a new and musical way.

  Get playable granular effects centered around the music you make to turn one idea into infinitely more. While in the past, granular sounds have been chaotic and abstract, Portal mangles and re-synthesizes your audio into beautiful, useable reconstructions.

  A mesmerizing visual circular XY control is linked to the granular parameters. Dial in the exact sound you want with advanced controls. Use Time Stretch or Pitch Shift to experiment or Humanize for thoughtful envelopes.
specs: |-
  - 250+ presets for instant playability
  - Circular XY Control linked to granular parameters
  - Powerful time manipulation engine
  - Tempo-synced grain delay
  - Scale-based pitch modulation
  - 7 built-in FX with master compressor and filter
  - Native Apple Silicon support (v1.2.0+)
