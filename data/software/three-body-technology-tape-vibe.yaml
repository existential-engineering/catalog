description: A mild-to-moderate saturator designed to add vintage tape character to modern productions, delivering analog-inspired harmonic richness while maintaining transients and mix clarity.
details: |-
  Tape Vibe is a mild-to-moderate saturator built with a simple goal: to add vintage tape character to modern productions. It brings analog-inspired harmonic richness to tracks while preserving transients and maintaining mix clarity.

  Analog soul for digital audio infuses sterile recordings with musical harmonic distortion and vintage warmth, removing digital harshness. Operation is deliberately dead-simple: Drive, Tone and Thick, with no complex parameters, just instant sound.

  An internal level-matching algorithm automatically compensates for gain changes as Drive increases, allowing accurate tonal decisions without loudness bias. Up to 16x oversampling can be engaged to effectively eliminate aliasing distortion.

  Zero latency is available when oversampling is disabled, making the plugin suitable for real-time tracking and live performance. CPU usage is highly optimized, so it can be dropped on every single track in a mix.
specs: |-
  - Three controls: Drive, Tone, Thick
  - Built-in Level Match with automatic gain compensation as Drive increases
  - Up to 16x oversampling
  - Latency: 0 ms when oversampling is disabled
  - Latency: about 0.1 ms in minimum phase mode when oversampling is enabled
  - Latency: about 1 ms to 1.5 ms in linear phase mode from 2x to 16x oversampling
  - Minimum system requirements: Intel or AMD CPU with SSE 4.1 instruction set, or Apple Silicon
  - macOS 11 / Windows 8
  - 4GB RAM and 100MB disk space
  - Supported plugin formats: 64-bit VST2, VST3, AAX and Audio Unit
