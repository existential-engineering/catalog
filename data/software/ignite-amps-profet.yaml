description: A digital emulation of a high-gain distortion preamp/stomp-box for guitar, accurately modeling its real hardware counterpart designed and built by Ignite Amps in 2018. The core circuit delivers tube-like saturation using carefully tuned JFET-based gain stages. Winner of the KVR Developer Challenge 2018.
details: |-
  Ignite Amps proprietary JFET non-linear modeling engine
  4-control tonestack with Shape switch
  Mono/Stereo processing support
  Oversampling up to 8x
  64-bit floating point mathematical model
  Fully automatable controls
  Proprietary preset management with bank import/export
