description: An emulation of the Telefunken V376, a highly sought-after vintage broadcast tube microphone preamp originally designed for broadcasting. Fully emulates the audio transformers, discrete class-A preamp and driver circuitry of the original. The V376 is a rare piece of hardware commanding thousands of dollars for original units. Functions as both a coloring preamp and a saturation tool with different levels of harmonic distortion.
details: |-
  Emulates the Telefunken V376 (vintage broadcast tube mic preamp, rare and expensive on the used market). Full circuit model: audio input/output transformers, discrete class-A preamp and driver stages. Controls added beyond original: continuous Drive (harmonic saturation amount), gain compensation, Phase inversion, linear Trim, High-pass filter, VU meter. Launched at $19 promotional price; regular $39. Free demo available from manufacturer.
specs: |-
  Controls: Drive, Gain compensation, Phase, Trim, High-pass filter, VU meter. macOS 10.9+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+ (32-bit and 64-bit), 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX. Copy protection: serial number. 14-day trial available.
