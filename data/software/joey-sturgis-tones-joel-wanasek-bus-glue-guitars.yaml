details: |-
  Chug Slaying With Joel Wanasek Bus Glue Guitars
  Mixing guitars is always frustrating for most engineers, especially if they are high gain. Good thing Joel Wanasek Bus Glue Guitars simplifies your life immediately by being optimized to give your mix the necessary headroom it needs so you can lock in your guitars. Slay those bass-heavy palm mute low-end swings that plague your mixes with the Chug Slayer circuit. Guitar mixing has never been more fun and easy!
  Joel Wanasek Bus Glue is a series of bus compressor audio plugins created by Joey Sturgis Tones in collaboration with esteemed producer and mixing engineer, Joel Wanasek. The compressors are specifically designed to Joel's exacting standards as unique mixing tools and are intended to be placed on the main instrument bus / track group buses in your mixer.
  Watch the video below to hear exactly what this amazing plugin can do for your mixes.
specs: |-
  Requirements
  A computer with Intel, AMD or Apple M-Series compatible processor, Windows or Mac OSX operating system, and a compatible DAW installed (check which plugin formats your DAW supports). This plugin does NOT operate as a standalone!
  Compatibility
  Windows 8.1+ (64 bit): VST2, VST3, AAX
  macOS 10.14+ (64 bit): VST2, VST3, AU, AAX
