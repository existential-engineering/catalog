description: An iPad app that automatically connects to Max and mirrors your interface.
details: |-
  Mira is an iPad app that automatically connects to Max and mirrors your interface, letting you control any number of Max patches from your device over WiFi or an ad-hoc network.

  It's easy to connect your iPad to Max. Mira takes care of all the network communication under the hood, so you can start controlling your Max patches right away. Just drop a mira.frame object into your patch, and supported UI objects in that region will show up in Mira.

  Control your Max patches: connect Mira to any number of Max patches from a single iPad or create multiple views of a single patch. Mira directly controls your patch without any additional objects. There are no OSC or MIDI messages to wrangle, no external editor, and no extra patching required.

  Build a modular control rig from a single patch. Each mira.frame you add in Max creates a new tabbed view in Mira. Combine multiple mira.frame to create different sets of controls that are available instantly.

  Mira supports gestural control through the mira.multitouch object and accelerometer data through the mira.motion object, and multiple instances of Mira can control a single patch for collaborative performance.
specs: |-
  - Automatically control any number of patches from your device
  - Use mira.frame objects to define viewable regions in your patch, and each frame shows up as a tab in Mira
  - Supports the majority of standard Max UI objects, with more to come
  - mira.multitouch object allows for gestural control
  - mira.motion object sends accelerometer data from your device
  - Multiple instances of Mira can control a single patch for collaborative performance
  - Works over WiFi or an ad-hoc network
  - Supported objects: button, live.button, toggle, live.toggle, dial, live.dial, slider, live.slider, rslider, multislider, kslider, live.tab, live.text, live.grid, comment, panel, fpic, message box, number, flonum, live.numbox, gain~, meter~, mira.multitouch, mira.motion, umenu, swatch
