description: Wave Box is a dynamic waveshaper plugin featuring two separate
  waveshapers that can be mixed together while being modulated by 2 LFOs and 1
  Envelope.
details: |-
  Wave Box is a dynamic dual waveshaper plugin that can be used for both symmetrical and asymmetrical distortion. A waveshaper is a type of distortion in which the input signal is mapped to the output by applying a fixed or variable shaping function.

  Wave Box features two separate waveshapers that can be mixed together while being modulated by 2 LFOs and 1 Envelope Follower. You can design your own waveshaping curves by combining and adjusting 12 pre-defined functions (tanh, erf, sinh, sin, linear, abs, invert, floor, round, ceil, gauss 1, gauss 2). Wave Box can range from mild tube-flavoured overdrive to extreme digital harshness.

  When a shaping function is applied equally to both the positive and negative part of the signal (symmetrical waveshaping), odd harmonics are generated. When a shaping function is applied only to either the positive or the negative part (asymmetrical waveshaping), even harmonics are generated.

  In Asymmetrical Mode the first shaping function is applied to the positive part while the second shaping function is applied to the negative, and the Bias controls an offset added between the positive and negative part of the signal. In Symmetrical Mode both shaping functions are applied to the whole signal, and the Bias controls the mix between the two functions.

  Wave Box is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP, Standalone). It is also available on the App Store for iOS and iPadOS (AUv3 and Standalone).
specs: |-
  - 2 Waveshapers
