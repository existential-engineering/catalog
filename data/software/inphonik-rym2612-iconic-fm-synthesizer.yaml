description: A software FM synthesizer emulating the Yamaha YM2612 sound chip, best known as the voice of the Sega Genesis/Megadrive console. The emulation is cycle-accurate to the original chip, reproducing every unique possibility of the synth, including the amp circuitry of the console.
details: |-
  Cycle-accurate emulation of the Yamaha YM2612 FM sound chip

  Up to 16 voices polyphony (6-voice native mode also available)

  100+ included sorted patches

  Audio input for 8-bit PCM processing

  Switchable output filtering and ladder effect

  64-bit
specs: |-
  - Cycle-accurate Yamaha YM2612 emulation
  - Reproduces digital saturation, feedback, natural distortion
  - Up to 16 voices polyphony (6-voice native hardware mode)
  - 4 FM operators with all controls on-screen
  - Dedicated PCM channel
  - Audio input for 8-bit PCM processing
  - Switchable output filtering and ladder effect
  - 100+ included patches
  - Low CPU usage
  - DRM-free (VST/AU/AAX)
  - windows: Vista+, 64-bit
  - mac: macOS 10.11+, Intel & Apple Silicon
  - linux: 64-bit, VST2/VST3
versions:
