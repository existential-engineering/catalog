description: "Cycle-accurate software emulation of the Yamaha YM2612 FM sound
  chip from the Sega Genesis/Megadrive console. Reproduces the hardware's
  distinctive characteristics including digital saturation, feedback, and
  natural distortion. Features audio input for 8-bit PCM processing, switchable
  output filtering and ladder effect, up to 16 voices of polyphony, and 100+
  pre-designed patches."
