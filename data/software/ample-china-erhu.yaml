details: |-
  Ample China Erhu (aceh) is sampled on 3 erhus in the key of d, c and low g, with 7.6 GB samples, including head, body and legato group articulations, FX sounds, as well as a select collection of improvised licks.

  The artist: ying wang (ph.d. Erhu major, central conservatory of music). The instrument: the aceh is sampled on 3 erhus in the key of d c and low g. Main notes (d3 - g5) are sampled on the erhu in the standard key of d. Lower notes (g2~c#3) are sampled on erhus in the key of c and low g.

  There are 4 articulation groups (head, body, legato and special effects), consisting of 30 articulations in total in the aceh. Bowed articulations: sustain, staccato, ricochet, grace tremolo, expressive tremolo and portato. Expressions: whispering, sighing, crying and hoarse. Fingered articulations: pizzicato, diminuendo, sforzando, expressive, vibrato, uniform trill, variable trill, mordent, inverted mordent, double mordent, full slide up, full slide down, slide in below, slide in above, slide out downward, slide out upward, portamento and virtual portamento. Special effects: lick, mirroring.

  Recorded with 5 mics (mid low, mid high, front, back and far position). Each mic volume is adjustable and equipped with channel eq. Providing 4 mic modes: ab, wide ab, ms and bright ms, capable of colorful sound designs. Features: 3 fingering modes: a string mode, d string mode and position mode, capturing the realistic fingering of the erhu performance. Intelligent legato system that fine tunes to the timing of notes. Endless legato between articulations. Creative mirroring feature. Voice independent sahds modulation system.

  Fx: high order 8-band eq, intuitive control of frequency response, real-time visualization of input and output spectrum, support of soloing single band. 2-line compressor, real-time visualization of input and output signal, two detection modes rms & peak, support of soft knee, auto release and auto makeup. 6-tap echo, real-time visualization of the processing of stereo signal, can tweak the parameters of 6 echo points individually: feedback, pan, volume etc. Ir reverb, providing four types of ir: room, studio, hall, and larger hall. 3d visualization of ir spectrum.
