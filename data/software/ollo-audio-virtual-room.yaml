description: A basic NX room modeling plugin that lets users bypass room
  emulation to hear calibrated stereo headphone playback, customize a virtual
  mix environment, and track head movement for immersive monitoring.
details: |-
  This is the basic NX room with a unique feature of bypassing the room emulation to only listen to traditional headphones mix with calibration enabled or disabled. Further more, you can change the location of speakers and tweek the ambience to match it with whatever room you're used to check your mixes in. A must-have in your toolbox. LISTEN TO USC ONLY

  With the virtual room you can bypass room emulation and only listen to OLLO calibrated stereo playback for your pair. Quickly check translation between speakers and headphones. CUSTOMIZE YOUR MIX ENVIRONMENT

  Monitor stereo, surround, and Ambisonics B-format in your customized virtual mix room by dialing in slightly wetter or drier ambience. For personal adjustment of the 3D effect to your head/ear anatomy, enter your personal head measurements into the plugin's head anatomy calibration section. TRACK YOUR HEAD MOVEMENTS FOR ENHANCED IMMERSION

  For the ultimate in realism, track head motion so that as you move your head, the sound changes as if you were moving your head in the studio. Track with your computer's camera and Head Tracker for full immersion (rotation + moving closer or away from speakers).
