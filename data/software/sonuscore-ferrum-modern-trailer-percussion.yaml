description: Ferrum is a modern trailer percussion powerhouse with a huge variety of cinematic percussion from epic and massive cinematic hits, punches, anvils and door impacts to cymbals, bells, tiny metals and metallic foley. Built on the Keepforest engine, it features a step sequencer with 1000+ factory rhythms and a stage placement module for deep spatial control.
details: |-
  Keepforest's FERRUM, produced by Vladislav Martirosov and Arseni Khodzin, is a modern trailer percussion library covering a wide range of cinematic percussion: epic and massive cinematic hits, punches, anvils and door impacts through to cymbals, bells, tiny metals and metallic foley.

  The instrument carries a built-in step sequencer for building complex rhythms, a quick stage placement module that can work independently for each note, multiple playback modes including doubling and ensemble, an effects rack for processing sound inside the instrument, and dozens of snapshots.

  The Full Edition includes 23 patches with a total of 550 notes, each with up to 16 round-robins, several mic positions and velocity layers, amounting to thousands of hand-crafted samples. Patches run from hybrid and epic trailer percussion, organic massive ensemble and super snare drums through metallic trailer hits, punches, factory hall and anvil ensembles, industrial door impacts, cymbals, bells and shakers, metallic foley and a set of various metals patches.

  A WAV folder of over 1500 files accompanies the Kontakt library, split into trailer elements (one-shots), trailer percussion (round robin), trailer loops and trailer stems. The product is sold by Sonuscore as a download and works with the free Kontakt Player.
specs: |-
  - Requires Native Instruments KONTAKT 6.0.2 or newer
  - Works with the FREE KONTAKT PLAYER
  - Compatible with hardware by Native Instruments
  - KONTAKT LIBRARY: 5.04 GB disk space
  - WAV FOLDER: 3.40 GB disk space
  - Full Edition: 23 patches with a total of 550 notes
  - Up to 16 round-robins per note, with several mic positions and velocity layers
  - WAV folder of over 1500 files across trailer elements, round-robin percussion, loops and stems
  - Built-in Step Sequencer with 1000+ factory rhythms
  - Quick Stage Placement module, able to work independently for each note
  - Multiple Playback Modes: Mono, Stereo, Doubling, Ensemble
  - Built-in Effects Rack for processing inside the instrument
  - Dozens of Snapshots
  - Available as: DOWNLOAD
