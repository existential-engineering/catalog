description: Ferrum is a modern trailer percussion powerhouse with a huge variety of cinematic percussion from epic and massive cinematic hits, punches, anvils and door impacts to cymbals, bells, tiny metals and metallic foley. Built on the Keepforest engine, it features a step sequencer with 1000+ factory rhythms and a stage placement module for deep spatial control.
specs: |-
  - Format: NI Kontakt library (.nki)
  - Requires: NI Kontakt 6.0.2 or newer
  - Compatible with free Kontakt Player
  - Full Edition: 23 patches, 550 notes
  - Up to 16 round-robins per note
  - Multiple mic positions and velocity layers
  - Over 1,500 WAV files across four categories
  - Library size: 5.04 GB (Kontakt) + 3.40 GB (WAV folder)
  - Step Sequencer with 1,000+ factory rhythms
  - Stage Placement Module (independent per note)
  - Playback modes: Mono, Stereo, Doubling, Ensemble
  - Built-in effects rack
  - Dozens of snapshots included
  - Available as digital download
