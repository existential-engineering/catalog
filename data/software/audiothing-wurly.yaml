description: Wurly emulates the iconic 60s-70s reed electric pianos, capturing
  the classic 200 and 200A models
details: |-
  Wurly is a plugin inspired by the famous reed electric pianos from the 60s and 70s, faithfully capturing the distinct, soulful tone and dynamic feel of the original instruments, and covering both the classic 200 and the refined 200A models.

  It provides a comprehensive set of controls for shaping the electric elements of the sound, including pickup emulation, envelope settings, and the iconic built-in tremolo (historically mislabeled as 'Vibrato'). The geometry of the pickup and reed has been precisely modeled, and the electric section uses physical modeling to capture the true behavior of the original instruments. Detailed control over the mechanical aspects covers hammer, key and pedal noises and the clank section, using both physical models and samples, and the speakers on each model were sampled so the direct sound can be blended with the speaker sound.

  Introduced in 1968, the Wurlitzer 200 electric piano marked a design evolution with its sleek contemporary style and built-in chrome legs. The 200 series used an electromechanical method where hammers strike metal reeds and the vibrations are picked up by electrostatic pickups. The upgraded 200A, released in the early 1970s, improved on its predecessor with better electrical noise shielding, enhanced action, and upgraded speakers for a warmer sound.

  The emulation combines physical modeling for both the electric and mechanical sections with high-quality samples for the mechanical components, a hybrid approach intended to capture each nuance of the original instruments' tone and response.

  Wurly features four effects, an Overdrive, a Phaser, a BBD-based Flanger and a Spring Reverb, all rearrangeable by drag and drop, and includes a standalone version so the 200 and 200A sounds can be played without a DAW. It is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP, Standalone), and on the App Store for iOS and iPadOS (AUv3 and Standalone).
