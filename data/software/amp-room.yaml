details: |-
  Amp Room, built on Softube's legacy of modeling analog gear with unmatched accuracy, is the pro audio guitar and bass platform that lets you be the master of puppets. Create the mix-ready tones that come from those high-end studios but with the ease and flexibility of software.

  Softube has a long history of modeling professional gear in collaboration with some brands like marshall, tube-tech, solid state logic, chandler limited, empirical labs, trident, weiss engineering, and others. After two decades, our track record of recreating indisputable classics in software form that sound precisely like their hardware counterparts is solid.

  The amps and cabs included with amp room are precisely emulated, a/b tested, and fine-tuned to sound just like the original. Or, in terms of clarity, even better.

  Five included ir producer packs with no download required: modern metal tones from producer kristian "kohle" kohlmannslehner's bogren digital collection "rainbows & chainsaws"; classic and modern metal tones from producer/mixer tue madsen's upcoming bogren digital ir pack; vintage and classic combo sounds from vilma colling, in-house engineer for studio riksmixningsverket; huge-sounding classic and metal tones from engineer/producer david gnozzi; massive rock tones from guitarist monte pittman (madonna, ministry).

  Automatic phase align ensures imported irs, softube factory irs, and softube cabinets always sound in phase with each other. Two new pedals: bass octave and integrated preamplifier, based on the highly prized originals.
