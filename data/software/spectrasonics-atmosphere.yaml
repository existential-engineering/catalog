description: "Massive 3.6 gb core library of over 1,000 sounds by eric persing.
  Dynamic dual layering for over 1,000,000 mix combinations. Pads, ambiences,
  leads, basses, synths, strings, glass and fx."
details: |-
  Massive 3.6 gb core library of over 1,000 sounds by eric persing. Dynamic dual
  layering for over 1,000,000 mix combinations. Pads, ambiences, leads, basses,
  synths, strings, glass and fx.

  The sounds are really, really, really, good. Although it is a rompler, you do
  get to adjust some basic synth parameters. Also, the ability to combine sounds
  to make your own patches is cool. It covers atmospheric sounds really well but
  surprisingly, it's not a one trick pony. It also features quite a selection of
  synth sounds sampled from your favorite big name hardware synths as well.

  Atmosphere is a collection of wonderful pads created by synthesizers and
  effects. The number of patches is overwhelming but arranged logically into
  subfolders with names that give hint to their sound and source. The variety is
  great but tweaking of patches is limited. The uvi engine cannot perform a
  fraction of the synthesis functions used to create the sounds. Thus,
  atmosphere is more like a simple rompler than a synthesizer. In exchange for
  the limited editing of patches you gain cpu efficiency.

  The strings and the ambience drones are called upon weekly. The string patches
  are simply gorgeous, and they instantly inspire all kinds of melodic/harmonic
  ideas. Unlike most rompler/workstation generic string pads, these strings are
  actually good enough for classical arrangements.
specs: |-
  - Massive 3.6 GB core library of over 1,000 sounds
  - Dynamic dual layering for over 1,000,000 mix combinations
  - Pads, ambiences, leads, basses, synths, strings, glass and FX
  - Easy to use built-in patch management system
  - Solo legato triggering with glide
  - Fully programmable
  - Adjustable sample start for percussive sounds, leads and basses
  - Multimode resonant filters for each layer, plus master filters
  - Three envelopes per layer for pitch, filter and amplitude
  - Matrix-style modulation routing, four LFOs per layer
  - Powered by custom 32-bit uvi engine
