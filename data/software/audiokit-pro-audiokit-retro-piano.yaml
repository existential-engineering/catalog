details: |-
  Create your own signature retro, lo-fi, or vintage piano sound. Simple
  controls allow you to easily create an emotional vibe for your next hit
  record. We stacked the piano with a vintage synth for a perfect pairing of
  piano and synth pads.

  Creates retro feelings, vibes, and sounds. Easily make lo-fi and nostalgic
  sounds. This is a free limited edition app that will only be available in
  june, july, and august this year. Once you get it, it's yours free, forever.

  Works great as an AU plugin in garageband, cubasis 3, bm3, ns2, aum, auria
  pro, and more.

  Big piano sound, small space and cpu footprint. No ads, subscriptions, or
  in-app purchases: includes full app, free.
specs: |-
  - Standalone app & AUv3 plug-in
  - Vinyl record warble speed & depth
  - Multiple velocities
  - External MIDI piano keyboard support
  - 40+ original vinyl noise samples
  - Crush, distortion, and special sauce
  - Tremolo, reverb, and other cool FX
  - AUv3 code
  - 500mb of samples compressed to 50mb
  - Under 70mb on most devices
  - No ads, subscriptions, or in-app purchases
