details: |-
  Caisa Drum

  Made by German instrument maker Bill Brown, the Caisa Drum is a convex steel drum that is designed to be played with hands or short mallets. It sonically resembles a Pantam or Steel Drum, but with a more rounded tone. We recorded the Caisa with three different playing styles: mallets, brushes, and fingers. Imagine playing a unique Caisa, but also being able to combine any of those playing styles together or with any of the other Parts from other Soundpaint libraries. The Caisa Drum is a popular instrument used in Film, TV, and Video Games. You may not recognize the name, but you will recognize the sound of the Caisa Drum. Infinite Velocity Layers from the Soundpaint Engine make you feel like you are really playing a Caisa drum. Explore new sonic possibilities with Morphing. Decide which portion of the sample is played with ADSR. Add Granular Reverb for some interesting textures. The possibilities are endless.
