description: Aura Pro is a virtual guitar amplifier "with classic british roots"
  that offers guitarists complete musical versatility, featuring warm and gutsy
  valve tones as well as crisp solid state sounds.
details: |-
  Aura Pro is a virtual guitar amplifier "with classic british roots" that
  offers guitarists complete musical versatility, featuring warm and gutsy valve
  tones as well as crisp solid state sounds.

  Input: this knob controls the input gain, but, it is not a simple volume
  control - it is the critical control for getting realistic valve overdrive.
  Noise gate: this will attenuate the input signal when you stop playing.

  Valve mode: aura has three amplifier modes, all controlled by the simple valve
  mode section: valve mode off emulates a clean solid-state amplifier with
  distortion-free output. Valve mode on and overdrive knob at minimum emulates a
  classic valve amp where you control the amount of valve overdrive by adjusting
  the input level knob and the compressor. Valve mode on with increased
  overdrive knob emulates a modern high-gain amplifier, capable of creating very
  overdriven sounds.

  Tone: the tone controls operate like a classic hardware guitar amp. You can
  completely change the guitar tone by slightly tweaking these controls.
  Compressor: simple single-control compressor, optimized for guitar. When valve
  mode is on, increasing the compression will also increase the amount of
  overdrive. Reverb: emulation of a classic spring reverb, optimized to sound
  good with guitar signals.

  Cabinet: this switches aura between one of 6 speaker cabinets: 1x8 tweed
  (small speaker for blues practice amps), 1x12 blues (classic sounding speaker
  for blues, jazz & clean sounds), 1x12 twang (excellent for country & blues
  tones), 2x12 vintage (rich, full sounding cabinet for classic rock tones),
  2x12 modern (brighter sounding 2x12 cabinet for clean chorus sound), and 4x12
  rock (cabinet for heavy overdriven sounds with bags of bass and strong
  midtones).
specs: |-
  - Virtual guitar amplifier
  - Valve mode
  - Solid-state mode
  - Input gain control
  - Noise gate
  - Overdrive control
  - Tone controls
  - Compressor
  - Spring reverb emulation
  - Master output level
  - Brickwall limiter
  - Stereo echo
  - Stereo doubler
  - 4-stage phaser
  - Tremolo effect
  - Stereo chorus
  - Auto wah effect
  - 6 speaker cabinets
  - 4 microphone positions
