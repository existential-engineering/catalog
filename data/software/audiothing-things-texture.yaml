details: |-
  Things is a series of smaller plugins covering a wide range of effects, focused on sound design and creativity. The first in the series is Texture, an easy to use granular reverb with pitch shifting and mid/side mode.

  Texture can transform any sound into an ambient soundscape, or add that drone vibe to your tracks. This plugin was inspired by the techniques used in the soundtrack and sound design of the award-winning indie game The Swapper.

  When the Mid and Side mode is engaged, the granular effect is applied only to the Side part of the input signal. The Mid is instead attenuated, creating a special stereo width effect. The reverb is always applied on both Mid and Side parts.

  Things - Texture is available for macOS, Windows, and Linux (VST2, VST3, AU, AAX, CLAP). It is also available on the App Store for iOS and iPadOS (AUv3 and Standalone), for iPhone and iPad.

  A demo version is available with some limitations: silence for 3 seconds every 45 seconds, and saving disabled. If you like it, you can purchase a license and then authorize the demo version.
