details: |-
  A1StereoControl is a plugin to expand or limit the 'stereo width' of your
  tracks. It can be used on single or group tracks and is also usable in final
  mastering situations.

  The integrated 'safe bass' algorithm centers all bass frequencies below an
  adjustable value right back into the middle of the stereo field. This gives
  your tracks the solidity and definition you want while preserving maximum
  transparency and sharpness.

  A1stereocontrol brings you the possibility to place your stereo signal inside
  the stereo field in a very intuitive way. The expert mode features different
  'pan laws' (0db, -3db, -6db), different pan curves (linear, logarithmic,
  sin/cos) as well as classic 'balance' mode or 'dual panning'.

  Similar techniques were used by professional studio producers over ages with
  either expansive hardware devices like elliptical equalizers or even advanced
  m/s-processors. With this plugin you will be able to manage this complicated
  task with a minimum effort.
specs: |-
  - macOS and Windows
  - 64-bit
  - Stereo width expansion (0% to 200%)
  - Safe bass algorithm
  - Linear phase
  - Resizable gui (vector-based)
  - No latency
  - Phase flip
  - Swap l-r
  - Mono mode
  - All parameters automatable
  - All parameters fully undoable (undo/redo)
  - +/- 12 dB input and output gain
  - Pan laws (0db, -3db, -6db)
  - Pan curves (linear, logarithmic, sin/cos)
  - Balance mode
  - Dual panning
