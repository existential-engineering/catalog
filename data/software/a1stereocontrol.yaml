details: |-
  A1stereocontrol is a plugin to expand or limit the 'stereo width' of your tracks. It can be used on single or group tracks and is also usable in final mastering situations.

  The integrated 'safe bass' algorithm centers all bass frequencies below an adjustable value right back into the middle of the stereo field. This gives your tracks the solidity and definition you want while preserving maximum transparency and sharpness.

  A1stereocontrol brings you the possibility to place your stereo signal inside the stereo field in a very intuitive way. The expert mode features different 'pan laws' (0db, -3db, -6db), different pan curves (linear, logarithmic, sin/cos) as well as classic 'balance' mode or 'dual panning'.

  Similar techniques were used by professional studio producers over ages with either expansive hardware devices like elliptical equalizers or even advanced m/s-processors. With this plugin you will be able to manage this complicated task with a minimum effort.
