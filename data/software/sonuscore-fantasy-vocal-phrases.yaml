description: "Buy Fantasy Vocal Phrases: cinematic fantasy vocals performed by a real singer. Expressive female fantasy vocals designed for games, TV, and film composers."
details: |-
  Fantasy Vocal Phrases is a vocal phrase instrument aimed at composers working in games, TV and film who want organic, emotional detail in fantasy scores. Where most vocal libraries offer sustained vowels or static samples, this one is built from complete vocal phrases sung in an improvised fantasy language, sitting somewhere between real speech and pure vocalisation. The result is vocal material that reads as narrative and expressive without ever sounding recognisable or translatable, designed to sit above orchestral, hybrid and ambient beds where a single voice should say more than a full choir.

  All vocals were recorded by professional German singer and flutist Katharina Wirtz, who has worked as a session singer for video games since 2018 with credits including The Elder Scrolls Online: High Isle, Anno 117: Pax Romana and Frosthaven. She holds a Bachelor's degree in Music Therapy, trained classically in her youth and performed as a soloist with orchestras before moving toward singing and touring with bands. The performances were recorded over a long development period, and this is the first time the voice is available as a scoring instrument rather than locked inside a game production. Recordings are presented as produced vocals, with the option to dial back the processing and apply your own effects.

  The library carries over 550 live-performed phrases organized into 8 main themes and 2 bonus themes, each theme offering a distinct style. Every theme is recorded in 4 different keys, which keeps pitch shifting minimal and makes the material playable in all twelve chromatic keys with consistent musical content. Each theme includes 15 unique phrases and 2 brief endings, split into 5 separate starting, middle and end phrases so that beginnings and endings can be combined into new variations. Stylistically the performances lean soft and ethereal, suited to the minor tonal centres common in fantasy scoring.

  The instrument works as a phrase player rather than a traditional sampler, with a phrase builder for combining and shaping material, a main page for choosing phrases and matching them to the key of a track, and an FX page giving control over EQ and processing. It runs in the full version of Native Instruments KONTAKT or in Steinberg's free HALion Sonic.
specs: |-
  - Over 550 different live-performed vocal phrases
  - 8 full themes plus 2 bonus themes
  - 15 unique phrases and 2 brief endings per theme, split into 5 starting, middle and end phrases
  - All themes recorded in 4 different keys, playable in all 12 chromatic keys with minimal pitch shifting
  - Improvised fantasy language built from phonetic elements rather than real words
  - Phrase builder plus main page and FX page with full EQ control
  - Solo female vocals performed by Katharina Wirtz
  - Requires the FULL version of Native Instruments' KONTAKT 6.8.1 or higher, or Steinberg's free HALion Sonic
  - The free Kontakt Player is not sufficient: it only runs the instrument in DEMO mode
  - macOS 10.14 or higher, Intel Core i5
  - Windows 7 or higher, Intel Core i5
  - 4 GB RAM
  - At least 700 MB of free hard disc space
