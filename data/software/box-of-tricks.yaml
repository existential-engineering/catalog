name: Box Of Tricks
manufacturer: soniccouture
primaryCategory: synthesizer
url: https://www.soniccouture.com/en/product/g50-box-of-tricks/
description: Box Of Tricks is a unique collection of 13 instruments created with
  imogen heap, using her own instrument collection and voice.
details: |-
  Instruments: array mbira, boom whackers, cello, cocktail kit, glockenspiel,
  marxophone, shruti box, tongue drum, vibraphone, vocal pad, vocal & percussion
  kit, waterphone, whirly tubes.

  Box of tricks by soniccouture is a virtual instrument audio plugin and a
  software application and soundware (samples or presets that load into other
  products) for macos and windows. It includes, and is therefore "powered by",
  kontakt player, which functions as an audio units plugin, a VST 3 plugin, an
  AAX plugin and a standalone application.
specs: |-
  - Kontakt player 5.5 compatible
  - 30gb core sample library (13gb with Kontakt's compression)
  - 13 Kontakt instruments
  - 24/96 stereo sampling
  - Multiple velocity layers
  - Round robin layers
  - Articulations (varies per instrument)
