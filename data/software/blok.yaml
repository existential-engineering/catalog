details: |-
  [blok] is an easy to use modular synthesis environment. The available
  processing blocks are simple and concise and there are no restrictions on how
  you hook things up.

  [blok] was designed as a platform for teaching audio synthesis to students, so
  even beginners can get started building their own synthesizers and effects
  right away.

  Classic synthesizer modules such as oscillators, filters, envelopes and
  effects. Easy to use interface. Blok was originally created as an educational
  program to teach audio design principles. This means that each module is
  simple to understand.

  Connect everything. There are no limits on connecting blocks together - if a
  block generates a signal, connect it up. Versatile dsp engine. Additive,
  subtractive and fm synthesis are all possible.

  Stand-alone, buzz plug-in and VST instrument plug-in versions are available.
  Low cpu usage. Blok was made to run well even on low-end computers.
specs: |-
  - Oscillators
  - Filters
  - Envelopes
  - Effects
  - Additive synthesis
  - Subtractive synthesis
  - FM synthesis
  - AM synthesis
  - Wave shaping
  - Modal synthesis
  - Karplus-strong synthesis
  - Full undo/redo
  - Low CPU usage
  - Buzz plugin
  - Stand-alone version
