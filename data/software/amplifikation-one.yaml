details: >-
  Amplifikation one is a guitar amplifier in the form of software. This "guitar
  amp on your pc" captures the dynamics and characteristics of "hardware" head
  amplifiers and cabinets, captured by various types of microphones in multiple
  configurations.


  Amplifikation one is not an emulation or modeled after specific amplifier,
  kuassa "tried to capture the best aspect of schematic designs, tubes,
  electronics and computer programming to achieve the supreme tone for your
  guitar through your personal computer while maintaining the user interface as
  easy as possible".


  Users are able to control every aspect of the software just like real
  amplifiers including, but not limited to, gain structure, tone, mic position,
  and distance.


  Amplifikation one is a small, but powerful first-rate custom amp sim software
  package that is capable of a wide range of tones. It is not designed to be a
  modeled version of any one particular amp combo, but shines as a customizable
  array of cool features that users can configure into their own distinct sound.


  The quad impulse loading adds a great deal of flexibility with nice routing
  options. It does come with a built in noise gate, distortion, and limiter,
  which are quite handy.
specs: |-
