details: |-
  Bad Tape 2 is a tape harming effect plugin from denise audio that focuses on
  creating extreme tape artifacts. The plugin was inspired by denise team member
  enrico 'nrec' tiberi's use of an akai 4000 ds mk2 reel to reel tape recorder,
  designed to control how to break the sound without requiring analog hardware.

  The plugin features mix control to smoothly mix in different extreme tape
  artifacts with great precision, detune (tape stop) to slow down the tape in
  real time as if pressing a finger on the tape reel, and wobble & shake to
  randomly detune the pitch of tracks like an inconsistent playback speed.

  Bad tape 2 includes harm to introduce failing tape artifacts with subtle
  bitcrushing, squeal & noize to add old tape machine noises for character and
  vibe, and color & speed controls to adjust the color and speed of the tape for
  a unique flavor while saturating tracks for vintage tape sound.

  The plugin provides warm and smooth character due to hysteresis emulation,
  comes with presets for synth, drums, bass and classic tape style effects,
  features low cpu usage, works offline without dongles or complex license
  managers, and includes a fully resizable gui.

  Bad tape 2 can be used to color and detune an entire track, or applied to just
  one bar at the end of a section to help introduce variation and lead into the
  next section of a song.
