description: Hysteresis is a free glitch delay processor that layers stutter,
  feedback delay, lowpass filtering, and modulation to generate robotic
  artifacts and musical malfunctions. It works across drums, synths, guitars,
  vocals, and sound effects, with 60 factory presets providing a quick starting
  point. Aimed at electronic musicians and sound designers who want expressive
  glitch processing at no cost.
details: |-
  Hysteresis is a versatile effects processor geared toward electronic musicians and sound designers. Process anything from drums to synths, guitars, vocals and sound effects. On top of being able to create contorted signal mutations, it can also be tamed to generate classic delay effects.

  Hysteresis features a delay effect with stutter, lowpass filter and modulation effects thrown into the feedback signal path. The input signal first goes through a delay line on each stereo channel, but instead of sending the output directly back into the delay line, the resulting signal is sent to a stutter processor, then to a lowpass filter and finally to another delay line on the opposite channel which is modulated for creating chorus type effects.

  The output of the second delay line is then routed back to the first one on the original channel. The stutter effect can be used to generate reverse delays, noisy pitch-shifting or raw granulation. The lowpass filter has an internal LFO to make the cutoff frequency oscillate, and the modulation processor can act as a subtle chorus or noisy modulator depending on the range of the modulation rate.

  Our free downloads feature exclusive releases developed with the same uncompromising production values as our paid products. These critically acclaimed free plugins and packs have been featured on countless 'best-of' lists and are favorites among electronic musicians and sound designers.
