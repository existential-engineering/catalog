details: |-
  Lock & Load With Joel Wanasek Bus Glue Bass
  Most engineers salivate over that major label big bottom bass sound. The struggle is over now because JW BG-BASS is a powerful low end bass shaping tool like no other. Easily control the top and bottom bass dynamics independently. Enhance your bass tone with the perfect grit on top to get the bass so it cuts through any wall of sound or position the bass instantly in the mix, relative to the kick drum.
  Bus Glue Joel Wanasek is a series of bus compressor audio plugins created by Joey Sturgis Tones in collaboration with esteemed producer and mixing engineer, Joel Wanasek. The compressors are specifically designed to Joel's exacting standards as unique mixing tools and are intended to be placed on the main instrument bus / track group buses in your mixer.
  Watch the video below to hear exactly what this amazing plugin can do for your mixes.
specs: |-
  Requirements
  A computer with Intel, AMD or Apple M-Series compatible processor, Windows or Mac OSX operating system, and a compatible DAW installed (check which plugin formats your DAW supports). This plugin does NOT operate as a standalone!
  Compatibility
  Windows 8.1+ (64 bit): VST2, VST3, AAX
  macOS 10.14+ (64 bit): VST2, VST3, AU, AAX
