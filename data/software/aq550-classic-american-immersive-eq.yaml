name: AQ550 Classic American Immersive EQ
manufacturer: red-rock-sound
primaryCategory: equalizer
url: https://redrocksound.ru/products/aq550-vst/?from=kvr
description: The aq550 faithfully captures the punch, low-frequency
  transparency, and ultra-tight imaging of iconic american eqs of the late
  1960's.
details: |-
  The aq550 provides reciprocal equalization at 21 points in 5 steps of boost to
  a maximum of 15 db of gain at each point. The 21 equalization points are
  divided into three overlapping ranges. The high and low frequency ranges are
  individually selectable as either peaking or shelving, and a band-pass filter
  may be inserted independently of all other selected equalization settings.

  Frequency ranges and boost/cut are selected by switches, and a pushbutton in
  switch allows the eq to be silently introduced to the signal path. A small
  toggle switch is used to insert the band-pass filter into the aq550.

  The aq550 extends the features of the original hardware and joins the
  flexibility of the digital world to the character of the analog processing.
  Allows you to choose between equalizer modes (stereo, mid, side) and remove
  analogue saturation from the processing circuit to deliver pure digital sound.

  Keys: double click reset to default value; shift reduce knob/fader
  sensitivity.
specs: |-
  - 3 bands of classic american equalization
  - 7 selected frequency centers per band
  - Maximum 15 dB of boost/cut per band
  - Shelf/peak switching on band 1 and 3
  - Proportional q
  - Stereo, mid or side EQ modes
  - Band-pass filter
  - 21 equalization points
  - 5 steps of boost
  - Peaking or shelving selection for high and low frequency ranges
  - Analogue saturation removal option
  - Universal 2 binary
