details: >-
  Turn your ipad/iphone into an expressive synthesizer studio with stunning
  sound quality. Alchemy is perfect whether you're developing song ideas on the
  go or in the studio. Discover an almost limitless palette of musical
  instruments using the unique remix pad to create constantly evolving and
  expressive sounds.


  Play fat basses, evocative soundscapes and pulsing arpeggios thanks to the
  most powerful synthesis engine on ios. This is the mobile version of camel
  audio's award-winning alchemy synth which can be heard on thousands of records
  by world-class musicians.


  Synths, basses, piano, strings, guitar, drum kits and more. Incredibly high
  quality sound - hear it to believe it. Huge variety of sounds thanks to
  sampler, va, granular and additive synthesis.


  Morph between synth variations to create your own sound. Tilt and inertia
  offer a fun physical way to control the synth. 16 performance controls so you
  can easily tweak sounds to fit your music.


  Alchemy mobile can be expanded with a wide range of sound libraries such as
  bigtone, cinematic and arp dimensions from world class sound designers. The
  libraries each contain 50 sounds (400 variations) and are available as in-app
  purchases.
specs: |-
  - 4-track sequencer
  - Mixer with solo/mute
  - Drum pads
  - Sampler synthesis
  - Va (virtual analog) synthesis
  - Granular synthesis
  - Additive synthesis
  - Remix pad
  - Tilt and inertia controls
  - 16 performance controls
  - Velocity sensitivity
  - Per note filter sweeps
  - Keyboard scales
  - One touch chords
  - External MIDI keyboard support
  - Audiobus integration
  - Copy and paste
  - Wav export
  - MIDI export
  - Pitchbend per note
  - Virtual MIDI
  - Save and load individual tracks
  - Record remix pad movements
  - Mark presets as favourites
  - Quantize options with triplets
  - Additional keyboard scales
  - Auto sync to external MIDI tempo
  - Poly control
  - Latency control
  - Remote control of alchemy desktop
  - Load alchemy desktop presets
  - Download mobile version of desktop sound libraries
  - Polyphonic pitchbend and aftertouch
