description: A dynamics processor emulating the dbx 118 Dynamic Range Enhancer — a VCA-based hardware unit from the early 1970s. Combines compression (1:1 to ∞:1) and expansion (1:1 to 1:2) in a single plugin, with a switchable Linear mode that processes the full signal range above and below threshold for extreme dynamic effects. The character draws from the same early VCA lineage as the dbx 160, allowing transients to punch through while compressing the body of the sound.
details: |-
  Emulates the dbx 118 Dynamic Range Enhancer / Compander (early 1970s VCA-based). Central Ratio knob covers both compression (1:1 to ∞:1) and expansion (1:1 to 1:2). Two operating modes: Regular (above-threshold only) and Linear (full signal range — enables extreme dynamic shaping or gate-like behavior). Mix knob for parallel compression or expansion. Hidden HR (headroom) and output Trim controls for additional fine-tuning. Built-in Threshold with Below/Above gain-reduction LED indicators. Released April 2024.
specs: |-
  Controls: Ratio (compressor/expander, 1:1 to ∞:1 compression / 1:2 expansion), Threshold, Mode switch (Regular/Linear), Mix (wet/dry), HR (hidden), Trim (hidden). macOS 10.12+ (Universal 2 Binary, Intel/Apple Silicon), Windows 7+ (32-bit and 64-bit), 2 GB RAM, 1280x1024 display. Formats: VST2, VST3, AU, AAX. Copy protection: serial number.
