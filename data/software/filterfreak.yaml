description: Resonant analog filter plugin with seven saturation styles, available
  as single (FilterFreak 1) or dual (FilterFreak 2) filter configurations.
  Features rhythmic pattern modes, envelope modulation, and custom LFO shapes.
details: |-
  FilterFreak is a resonant analog filter plugin that delivers everything from smooth analog filter sweeps to grimy, resonant squelches. The plugin features analog filter modeling with seven saturation styles and comes in two versions: FilterFreak 1 (single filter) and FilterFreak 2 (dual filters in series/parallel).

  The plugin offers multiple filter modes including highpass, lowpass, bandpass, and band reject with 2-8 pole configurations. Rhythm Mode provides MIDI sync and auto-wah effects, while the Rhythm Editor enables custom rhythmic pattern creation.

  FilterFreak includes a Shape Editor for custom LFO shapes and a Groove control for adding swing and shuffle to filter movements. Envelope and ADSR modulation modes offer dynamic filter movement.
specs: |-
  - Analog filter modeling with seven saturation styles
  - FilterFreak 1 (single filter) and FilterFreak 2 (dual filters)
  - Filter modes: highpass, lowpass, bandpass, band reject (2-8 poles)
  - Rhythm Mode with MIDI sync and auto-wah
  - Rhythm Editor for custom patterns
  - Envelope and ADSR modulation modes
  - Shape Editor for custom LFO shapes
  - Groove control for swing/shuffle
  - 64-bit only, sample rates 44.1 kHz to 192 kHz
  - Apple Silicon compatible
