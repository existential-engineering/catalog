description: Filter plugins can have an enormous impact on how something sounds,
  and Mutronics Mutator is a classic '90s analog filter and envelope follower
  plugin that can create awesome filter sweep effects, give a vintage analog
  sound to an instrument, mix the original sound source with the mutated sound,
  and more.
details: |-
  The original Mutronics Mutator, a super sweet stereo analog filter and envelope follower created in the 90s, was an instant success and quickly became a recognizable feature of the 90s sound. Softube has partnered with Mutronics to bring the Mutator back in plug-in form with the same incredible sound quality as the original hardware plus all the benefits of a modern plug-in.

  The Mutator contains two independent voltage-controlled filters (VCFs) similar to those found in analog synthesizers. It works great with any sound source that's fed into the unit, including guitar, vocals, keyboard, and drums. Use it to give a vintage analog sound to an instrument, create filter sweep effects, mix the original sound source with the mutated sound, and more.

  A Classic Effects Unit, Updated: Softube carefully replicated the features and details of the original hardware version of the Mutator, which created enough source-deforming effects to make an android paranoid, in close collaboration with Mutronics. Designed to give you the same sound quality and features of the hardware, plus a few modern additions that make it even more useful.

  A Versatile Creative Tool: Mutronics Mutator works with any sound source, electric guitar, drum loops, bass guitar, electric piano, synth with sidechain compression, vocals, to create filter sweep effects that you can control by the sound source's amplitude, from the low-frequency oscillations (LFOs), or from an external sound source.

  Add Movement in a Mix: Use the amplitude of your audio signal to directly control the opening and closing filter for living auto-wah effects where the louder parts of the sound source move the cut-off frequency of the filter upwards. Animate the filter with LFOs on each channel for slowly evolving effects or tempo-synced tremolos.
specs: |-
  - Created in collaboration with Mutronics
  - Create a classic 90s sound
  - Every component carefully modeled after the original hardware
  - Amazing filter effects
  - Two independent voltage-controlled filters (VCFs) similar to those found in analog synthesizers
  - Give a vintage analog sound to guitar, keyboard, drums, or vocals
  - Superimpose the envelope characteristics of one sound onto the filtering contour of another
  - Gate a sound from an external control source like hi-hats or a drum loop
  - Use the external sidechain input to have an external sound source control the filter movements
  - Use the Mutator as a stereo panning filter, as the filter cut-off frequency of one channel rises that of the other channel falls and the sound pans from side to side in a frequency-dependent way
  - New features included in the plug-in version are host-based tempo sync, automation, and mix knob capabilities
  - Supports Softube Extended Features panels
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Three activations, 20-day trial, 14-day returns
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Internet access (for downloading installers and managing licenses)
