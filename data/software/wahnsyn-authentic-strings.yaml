description: Authentic-strings provides 8 different string instruments that can
  be played individually or as a complete orchestra.
details: |-
  A violin, viola, cello and a double bass are integrated as solo instruments.
  In addition, 4 combinations are available: combi, pizzicato, staccato and the
  ensemble modes.

  At the same time, all 4 solo instruments are spread sensibly across the
  complete claviature. Multi-functions can be added to the mod-wheel or the
  foot-controller, to create a live concert feeling.
specs: |-
  - 8 different string instruments
  - Multiple velocity-levels sampling
  - Violin
  - Viola
  - Cello
  - Double bass
  - Solo instruments
  - Combi mode
  - Pizzicato mode
  - Staccato mode
  - Ensemble mode
  - Mod-wheel control
  - Foot-controller control
  - Windows compatible
