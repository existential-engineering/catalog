description: DBVerb replicates 12 of producer and engineer David Bendeth's
  favorite reverb patches and implements his workflow for dialing in a reverb by
  running four reverbs in parallel, each with a dedicated blend fader. Each
  strip selects from three patches and carries solo, cut and length controls.
details: |-
  Over a long career, multi-platinum award-winning producer and engineer David Bendeth developed a workflow of blending multiple reverbs on a channel or a bus for a layered and nuanced sound. DBVerb wraps that workflow around a custom reverb engine carrying the key reverb patches he dialed in and used on the recordings he is known for.

  The plug-in replicates 12 of those patches and puts four reverbs in parallel, each with a dedicated fader for blending its contribution into the overall response. Each reverb strip selects from three different patches, and solo and cut controls on each strip allow the individual contributions to be auditioned without changing the balances.

  Post-reverb High Pass Filter and High Shelf EQ are included, along with an overall pre-delay control that increases or decreases the pre-delay of the reverb relative to the original settings. The integrated gain-compensated Wet/Dry control sets the blend of direct and reverb sound, or the plug-in can be set to 100% wet for use on an aux fader.

  Each reverb strip also includes a length control that shortens the tail of its reverb, which can dry the reverb up or dial in a gated reverb sound without chattering or level-dependent effects. The result is fast to use and makes it easy to reach a usable reverb sound without scrolling through patches and parameters.
specs: |-
  - World-class signal processing and workflow
  - 12 key reverb patches in 4 engines with a nearly infinite set of combinations
  - Per-reverb length controls
  - Per-reverb blending faders
  - Per-reverb cut and solo controls for audition and automation
  - Overall integrated reverb EQ
  - Overall pre-delay control
  - Many presets included
  - Adjustable UI size
  - MH Preset Manager provides cross-platform presets
