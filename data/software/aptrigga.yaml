description: Apulsoft aptrigga3 is an audio insert effect plugin to detect
  trigger events on its input signal which are used to add or replace sounds.
details: |-
  Input layers process the input audio using the sampler engine and transform
  aptrigga3 into a precussive sound effects processor. Aptrigga3 features an
  input filter section with a built-in frequency analyzer and an unlimited
  number of configurable filter bands to shape the input signal.

  The plugin has various playback modes to play layers in sequence, selected
  randomly or simultaneously. Basic sample editing can be done right inside
  aptrigga3 and it can record samples from its input to quickly capture
  multi-samples from microphones or synthesizers.

  Use aptrigga3 to replace or mix drum sounds on single-instrument channels. Due
  to its zero sample latency, it is ideal for live drum triggering (using drum
  pads or microphones).

  Presets can include samples and are compatible across hosts and systems.
  Bright & dark color schemes and support for user defined color schemes are
  available.
specs: |-
  - 64-bit intel/apple silicon CPU
  - macOS and Windows
  - Os x 10.11 or newer
  - Zero sample latency
  - Trigger detection on input signal
  - Extensive sample management
  - Flexible synthesizer layers
  - Multiple envelopes
  - Modulation section with per sample modulation
  - Input filter section with built-in frequency analyzer
  - Unlimited configurable filter bands
  - Various playback modes (sequence, random, simultaneous)
  - Basic sample editing
  - Sample recording from input
  - 10-step undo/redo
  - Unlimited samples per preset
  - Drag & drop sample organization and grouping
  - Trigger signal & event graph with dynamics settings
  - Built-in sample player and synth engine
  - User-definable modulation rules
  - One multimode multipole filter per layer
  - Sample accurate envelopes for volume, filter and user-definable parameter
  - Unlimited curved envelope sections
  - Bright & dark color schemes
  - User defined color scheme support
  - Presets compatible across hosts and systems
  - Pro Tools 11 or newer (AAX)
