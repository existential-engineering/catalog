description: 8-voice virtual analog synthesizer based on the Oberheim OB-X and
  OB-Xa, recreating the subtle imperfections and harmonic distortion of vintage
  analog hardware.
details: |-
  OB-Xtreme is a digital emulation of classic Oberheim analog synthesizers,
  combining 8 mono synths to create a massive, authentic analog sound with
  emphasis on recreating the subtle imperfections and harmonic distortion
  characteristic of vintage gear.

  The synthesizer offers 8-voice polyphonic, unison mono, or true mono synthesis
  with configurable voice clones in 2, 4, or 8 configurations. Oscillator
  options include SAW, PULSE, TRI, and SAW+PULSE combination with +1 octave
  harmonic. Two filter modes are available: 2-pole SVF (OB-X based) and 4-pole
  CEM3320 with Moog-like resonance, plus high-pass and band-pass filter outputs.

  The Xtreme Factor feature provides OTA-induced distortion emulation with
  independently bypassable PRE and POST circuits. Seven voltage offset macro
  sliders manage oscillator tuning, filter/amp envelopes, VCF deviation, pulse
  width, portamento, and cross-modulation. Up to 16x oversampling ensures clean
  audio output.

  Version 3.0 introduces Mac VST3 and native Silicon support via Universal 2
  binary, a remade high-resolution DPI-aware GUI with vector controls,
  selectable 4 or 8-voice polyphony, enhanced modulation routing, 2-pole
  high-pass output with filter bleed, and envelope scope visualization.
specs: |-
  - 8-voice polyphonic, unison mono, or true mono synthesis
  - Configurable voice clones (2, 4, or 8)
  - Oscillators: SAW, PULSE, TRI, SAW+PULSE with +1 octave harmonic
  - 2-pole SVF filter (OB-X based) and 4-pole CEM3320 (Moog-like resonance)
  - High-pass and band-pass filter outputs
  - Xtreme Factor: OTA-induced distortion emulation (PRE and POST circuits)
  - 7 voltage offset macro sliders for global parameter control
  - Up to 16x oversampling
  - Multiple LFOs with phase reverse and keytracking inversion
  - Per-voice pan control with stereo widening presets (Wide, Spread, Ping Pong)
  - Velocity modulation of filter/amplitude envelope decay
  - Built-in categorized preset browser
  - Keyboard Scaling (KBS) with configurable voltage tracking
  - Envelope scope visualization
  - Universal 2 binary (native Apple Silicon support)
