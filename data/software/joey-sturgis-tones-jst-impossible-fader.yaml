description: An April Fools joke plugin that is also a real, installable plugin.
  It is a single volume fader that deliberately ignores most of your input,
  drifts back to random values over time, and does not recall its position.
details: |-
  THIS PLUGIN IS AN APRIL FOOLS JOKE (but it's also a real plugin which makes the joke even better).

  Introducing JST Impossible Fader by Joey Sturgis Tones, bringing real analog behaviour, including a lack of reliability, to the digital realm. This is the world's first ever volume control for experts. No beginners allowed.

  Mixing has become too easy these days. Moving a fader up and down takes zero effort, making it possible for mixers with no experience to beat out all the experts. Mixers of the past had to battle consoles that change sound throughout the day, temperamental analog gear, tape hiss and endless hours of recalling sessions. That all changes with the JST Impossible Fader, which is almost impossible to get the hang of.

  As you move the fader, most of your input is practically ignored. The technology works by randomly accepting your desired fader motions whenever it wants to. It also does not always remember its position when you close the plugin, and it randomly resets every few minutes. This is the 0.9% Accuracy DSP technology developed to make the process of using a fader feel like the most painful user experience possible.

  How to use it: load the plugin on every single channel, last in your insert chain. Begin playback and start adjusting the faders instead of your DAW's. Work fast, because the longer you take, the more the faders reset back to a random value. Export before you lose all your work, because there is no recall.
