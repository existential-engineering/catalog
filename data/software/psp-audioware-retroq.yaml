description: PSP RetroQ offers PSP Audioware's unique take on a musical equalizer with unique sonic character and ultra-low phase distortion. This makes RetroQ sound smooth and musically natural.
details: |-
  PSP RetroQ offers PSP Audioware's unique take on a musical equalizer with unique sonic character and ultra-low phase distortion. This makes RetroQ sound smooth and musically natural. It's shelf filters are based on the much lauded VintageWarmer filters, and PSP RetroQ's addition of a mid-range filter is designed using the same internal architecture. An adjustable high pass filter is added to make the plug-in a complete program equalizer. PSP RetroQ was optimized for use on groups and entire mixes, but it is equally at home in any situation in which you desire some gentle sweetening in your overall processing chain.
specs: |-
  - Musical equalizer with unique sonic character and ultra-low phase distortion
  - Shelf filters based on the VintageWarmer filters
  - Mid-range filter designed using the same internal architecture as the shelf filters
  - Adjustable high pass filter, making it a complete program equalizer
  - Optimized for use on groups and entire mixes
  - Windows x32 or x64 (XP Service Pack 2, Vista or 7)
  - Mac OS X 10.5 or later (Intel) for AudioUnit, VST and RTAS
  - Mac OS X 10.8 or later for AAX
  - VST requires a 32 or 64-bit VST 2.4 compatible host application
  - AudioUnit requires a 32 or 64-bit host application capable of running AudioUnit plug-ins with Cocoa view
  - RTAS requires ProTools LE 8.0.0 or ProTools TDM 8.0.0 (or later)
  - AAX requires Pro Tools 10 or Pro Tools 11 (or later) on Windows, Pro Tools 11 or later on Mac
