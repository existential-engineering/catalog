details: |-
  Meet the new Audiolens desktop app which makes track referencing and
  comparison easy by analyzing audio from any streaming platform or audio
  source. Build your personal library of reference tracks that you can access
  anytime to compare against your own mixes or masters.

  The new audiolens desktop app makes track referencing and comparison easy by
  analyzing audio from any streaming platform or audio source. Play your chosen
  audio through the selected output of your device and the application will
  collect data on key sonic characteristics, helping you to visualize, compare,
  and match your favorite reference tracks and sounds.

  Save the tonal data of your references to your audiolens target library to
  build a personal catalog of reference track data that you can access anytime.
  Name your tracks so you can quickly find the sounds you want to match, and
  compare tonal balance profiles with ease. The target library talks to ozone 10
  and neutron 4, automatically populating your references to those plug-ins if
  you have them.

  Audiolens will automatically populate saved referenced targets to your ozone
  10 target library so you can visualize how your master stacks up to your
  chosen reference. Run the ai-powered master assistant to match the tone,
  dynamics, and width profiles of the desired track to your own master, and dial
  in additional adjustments using the assistant view.

  Producers and engineers use track referencing during music production, mixing,
  and mastering. Referencing is the process of comparing the dynamic range and
  character of your song to songs of a similar genre and style to your desired
  sound. A reference track's dynamic range and sonic character can be used to
  communicate the sound you're aiming for in your mix or master.
