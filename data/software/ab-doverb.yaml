details: |-
  Ab doverb is a kind-of-magic reverb aimed to offer users a quick solution whenever they need to add a reverb to their tracks.

  Ab doverb was created with extreme simplicity in mind: few controls, straightforward interface, immediate results to create immersive spaces in a matter of seconds - whether you are on a very tight schedule or don't want to spend too much time designing an immersive space for your sounds, ab doverb works wonders.

  Ab doverb comes with 'aesthetics' on top of 'realism' in mind - meaning that ab doverb's reflections are aimed to fill your acoustic space with a sweet and pleasant way.

  Ab doverb is compatible with mono, stereo, and ambisonics sources (1oa, 2oa, 3oa) and will output stereo and ambisonics signals that can later be decoded to any speaker array possible. From binaural, to surround and even 7.1.2 that can be later routed to your dolby atmos bed.

  With ab doverb you can work completely in stereo whilst taking advantage of the psycho-acoustic characteristics sound takes when it's being manipulated three-dimensionally, blow-up a mono/stereo sound source to ambisonics, work natively with any 1st, 2nd or 3rd order ambisonics signal, and apply reverb and mixdown any 1st, 2nd or 3rd order ambisonics signals down to stereo.
