description: Unmask your low end. The perception of low-frequency sound is
  highly vulnerable to masking, especially from energy nearby on the frequency
  spectrum.
details: |-
  The perception of low-frequency sound is highly vulnerable to masking,
  especially from energy nearby on the frequency spectrum. Baseviper works by
  identifying your peak frequency below 200hz, and de-masking this with sharp,
  dynamic eq cuts at frequencies of +/- 12.2%. The effect can help to open up
  your mix and give your low end a more transparent sound.

  User-adjustable eq cut depth and q factor (I.e. Sharpness). Variable frequency
  detection window from ~90 to ~360ms, with look-ahead function. Fixed effect
  range of 0-200hz. Automatic make-up gain to match perceived loudness.

  Available in vst3 format for pc, and vst3 & AU formats for mac. AAX support
  coming soon. Requires a compatible digital audio workstation or other plugin
  host. ~22ms latency on default settings; adjustable via look-ahead and
  detector window settings.
specs: |-
  - Dynamic EQ
  - User-adjustable EQ cut depth and q factor
  - Variable frequency detection window from ~90 to ~360ms
  - Look-ahead function
  - Fixed effect range of 0-200hz
  - Automatic make-up gain
  - ~22ms latency on default settings
  - AAX support coming soon
