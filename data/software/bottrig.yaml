name: BOTTrig
manufacturer: soniclab
primaryCategory: plugin
url: https://www.sonic-lab.com/
description: sonicLAB has developed the BOTTrig plugin, which can detect all
  other existing sonicLAB bot plugins on the DAW tracks and trigger them.
details: |-
  sonicLAB has developed the BOTTrig plugin, which can detect all other existing
  sonicLAB bot plugins on the DAW tracks and trigger them, while the DAW does
  not know about it.

  Automatically, a layout of switch buttons will be exposed on its ui for each
  found bot plugin on the DAW.

  They are soft-wired to MIDI keys or any other custom MIDI controls you wish.

  All settings are remembered within saved projects of DAW.

  Bottrig by soniclab is a virtual instrument audio plugin for macos and
  windows.
specs: |-
  - MIDI control
  - DAW track detection
  - Custom MIDI controls
