details: >-
  Acoustic reality features 150 presets for spectrasonics omnisphere 2.5. This
  soundset uses omnisphere's unique collection of acoustic samples to create a
  series of presets inspired by traditional instruments from north & south
  america, europe, africa, india and japan.


  Acoustic reality is split into 8 different categories: drums, guitars, keys,
  plucks, metal, strings, wind & fx.


  It features classical guitars, banjos, cuatro guitars, cavahinquos, charangos,
  sitars, hawaiian slide guitars, dulcimers, japanese kotos, kamlimbas, steel
  drums, harps, acoustic basses, pan drums, flutes, glockenspiels, vibraphones,
  rhodes pianos and much more.
