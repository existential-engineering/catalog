description: Batch xFader is designed to automate the tedious work involved
  making sampler instruments out of samples.
details: |-
  Batch xfader can accomplish all of these tasks as a batch process on the
  selected folder of wavs very quickly. It's the perfect companion to an auto
  sampling program such as mpc software or beats that samples instruments. It's
  like a finishing tool.

  It can either use an already existing sustain loop in the file or create a
  new/replace existing. Creating a loop allows visually selecting percentage
  values for the loop start, loop end and the cross fade amount. The cross fade
  uses data from before the loop to mix the cross fade at the end of the loop
  section. Each section has an enable button to use the section. This means you
  can use the application just for specific purposes such as for removing some
  samples at the front or fading in for example.

  V1.1 adds the ability to batch process single sample loops based on
  frequencies derived from embedded note numbers. The note number can either be
  from the smpl header or from the file name, designated by a dash and three
  numbers ie; -036. The loop is created from the middle of the file, a positive
  zero crossing is found for the start and then the sample length based on
  samplerate and note frequency, then the next negative zero crossing is found
  to ensure the loop is seamless. All other data is removed in the export so
  that it only contains the loop section.
specs: |-
  - Sample loop crossfader
  - Batch processing
  - Sustain loop creation
  - Cross fade processing
  - Sample trimming
  - Fade in generation
  - Stereo to mono conversion
  - Format conversion
  - Visual loop editing
  - Zero crossing detection
  - Frequency-based loop processing
  - Note number recognition
  - Smpl header support
  - macOS support
  - Windows support
  - Universal 2 binary
