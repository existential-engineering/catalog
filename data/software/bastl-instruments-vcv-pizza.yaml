description: >-
  VCV Pizza is a free compact FM and wave-shape oscillator module for VCV Rack
  featuring three internal oscillators (Main, Octave, and Ratio) with phase
  modulation and wave folding, plus an assignable CTRL knob with CV input. It is
  a software recreation of the Bastl Instruments Pizza hardware Eurorack
  oscillator module.
specs: |-
  Requires VCV Rack. Part of the BastlPizza plugin pack.
