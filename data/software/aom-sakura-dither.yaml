description: Sakura Dither is a dithering plugin. It works on the final slot of mastering effect chain, converts input floating-point signal to output 8/16/24 bit integer signal.
details: |-
  Nowadays, typical digital audio workstations employ floating-point internal precision. However, for distribution media like CD or streaming, we still need to convert our masters to 16 or 24 bit integer formats. These conversion easily introduces sound degradation caused by re-quantization errors. Dithering is a technique to suppress requantization errors on bit depth reduction by adding slickly crafted random signal.

  Sakura Dither is a dithering plugin. It works on the final slot of mastering effect chain, converts input floating-point signal to output 8/16/24 bit integer signal. With well-tuned four types of dither characters, you can add a final touch to your masters.

  The plugin offers four premium dither types tuned by a master-class audio engineer: Type 1 (Natural / Transparent), Type 2 (Open / Wide), Type 3 (Warm / Slight de-essor feelings) and Type 4 (Electronic / Enhancement). An Auto-Black process mutes the signal when the input signal is low enough, and input and output bit depth meters show the conversion at a glance.

  Common specifications across the A.O.M. plugin range include support for 44.1k to 384kHz sample rates, 64-bit floating-point internal precision, latency compensation, factory and user presets, snapshots, undo/redo and reset to default.
specs: |-
  - Output bit depth: 8bit / 16bit / 24bit
  - Premium four dither types, tuned by master-class audio engineer
  - Type 1: Natural / Transparent
  - Type 2: Open / Wide
  - Type 3: Warm / Slight de-essor feelings
  - Type 4: Electronic / Enhancement
  - Auto-Black process mutes signal when input signal is enough low
  - Input and output bit depth meter
  - Supports 44.1k - 384kHz Sample Rate
  - 64-bit Floating-point Internal Precision
