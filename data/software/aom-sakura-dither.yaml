description: A mastering dither plugin that converts floating-point audio to
  8/16/24-bit integer formats with four dither types and Auto-Black processing
  for low-level signal muting.
details: |-
  Sakura Dither is a dithering plugin designed to be placed in the final slot of
  the mastering effect chain. It converts floating-point audio signals to 8, 16,
  or 24-bit integer formats while reducing quantization errors through carefully
  crafted random signal addition.

  Four dither types are available, each with a distinct sonic character:
  Natural/Transparent for minimal coloration, Open/Wide for a more spacious
  sound, Warm with slight de-essing characteristics, and Electronic/Enhancement
  for a more processed quality.

  The Auto-Black process automatically mutes signals at very low levels,
  preventing dither noise from being audible during silence. Input and output
  bit depth metering provides visual confirmation that the conversion is
  operating correctly.

  All processing operates at 64-bit floating-point precision with support for
  sample rates from 44.1kHz to 384kHz.
specs: |-
  - Output bit depths: 8, 16, and 24-bit
  - Four dither types: Natural/Transparent, Open/Wide, Warm/De-ess, Electronic/Enhancement
  - Auto-Black process for low-level signal muting
  - Input and output bit depth metering
  - Sample rates: 44.1kHz to 384kHz
  - 64-bit floating-point internal precision
  - Latency compensation included
