description: "Melody, harmony, texture, ambience — all fighting for space in the
  midrange, all causing problems. Fixate:Midrange clears the mud, tames the
  harshness, and restores balance to the busiest region of your mix."
details: |-
  Fixate:Midrange is an intelligent midrange correction plugin that targets six of the most common midrange problems in audio mixing and mastering: Mud, Thinness, Honk, Nasalness, Harshness, and Spectral Imbalance. Using a one-button Analyze and Fix workflow, it dynamically processes only when problems are detected.

  The plugin employs critical-band frequency analysis modeled on human hearing perception. It features a real-time resonance meter with HINTMAP display and a 15-band spectral balance correction system. Mid/Side independent channel processing allows for precise stereo control over the midrange.

  Fixate:Midrange includes learnable reference profiles and professional presets for mastering, vocals, guitar, drums, keys, and piano. Per-band enable, solo, and delta listening modes enable detailed surgical correction, while a dedicated midrange focus listening mode helps isolate problem areas.

  The plugin features automatic gain compensation, A/B comparison, a resizable UI with color options, and a full preset librarian. Compatible with macOS 10.14 or later (64-bit, Apple Silicon native) and Windows 10 or later (64-bit).
specs: |-
  - Six intelligent dynamic processors: Mud, Thinness, Honk, Nasalness, Harshness, Spectral Balance
  - One-button Analyze and Fix workflow
  - Critical-band resonance detection
  - Mid/Side independent channel processing
  - Real-time resonance meter with HINTMAP display
  - 15-band spectral balance correction
  - Learnable reference profiles
  - Professional presets for mastering, vocals, guitar, drums, keys, piano
  - Per-band enable, solo, and delta listening
  - Midrange focus listening mode
  - Automatic gain compensation and A/B comparison
  - Resizable UI with color options
  - Full preset librarian
  - 64-bit only (Mac and Windows)
  - Apple Silicon compatible
  - macOS 10.14 or later
