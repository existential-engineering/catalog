description: Midrange is where your mix lives and where most problems hide.
  Fixate:Midrange locks-in on this critical zone, taming harshness, clearing
  mud, and restoring balance in seconds. With intelligent, audio-aware
  processing, Fixate helps your mixes sound clear, controlled, and ready for the
  real world.
details: |-
  Melody, harmony, texture, ambience - all fighting for space in the midrange, all causing problems. Fixate:Midrange clears the mud, tames the harshness, and restores balance to the busiest region of your mix. Just Analyze, Fix... and wonder why midrange was ever hard.

  Six problems. Six knobs. Zero guesswork. Mud. Thinness. Honk. Nasalness. Harshness. Spectral Imbalance. Fixate:Midrange targets the six most common midrange issues, each with a dedicated intelligent processor. Every correction is dynamic and signal-dependent, activating only when a problem is detected.

  Analyze. Fix. Two steps to a polished midrange: Fixate listens to your track, finds the problems, and fixes them with one click. No tweaking, no guessing, no deep menu diving. Just results. Prefer to drive? Visual hints highlight problem areas across the plugin on knobs, meters, and throughout the interface. Use them to guide your ears to the perfect result.

  Find balance. Your mix has a sound. Fixate keeps it. The Balance section preserves character while refining the tone for professional results. The result isn't a different mix, it's your mix, polished.

  Not just for mastering. Fixate:Midrange was built for the master bus, but it doesn't stop there. Apply the same intelligent correction to individual tracks with dedicated profiles for vocals, guitars, and more. Clean up a vocal mix. Tame an unruly guitar bus. Fix dialog.

  Get referential. Need your midrange to match a specific sound? Load a profile to target the spectral balance of a known good reference, or drag in any track and Fixate learns it automatically. Build custom profiles for your genre, your room, or your client's sound, then recall them across sessions and projects. Includes reference profiles for Mixbuss & Mastering, Keys, Drums, Vocals, Guitar and Piano.

  Technology: Fixate:Midrange is built on a model of human hearing. The plug-in divides the midrange into critical bands (frequency regions where your ear groups sound together) and analyzes energy within each band relative to its neighbors. This is how your ears actually detect resonances, and it's why Fixate catches problems that conventional spectrum analyzers miss. The result is processing that feels natural and sounds musical, because it's working the way your hearing does.
specs: |-
  - Six Intelligent Dynamic Processors targeting Mud, Thinness, Honk, Nasalness, Harshness, and Spectral Balance
  - One-button ANALYZE and FIX workflow
  - Critical-band Resonance Detection modeled on human hearing
  - Independent Mid and Side channel processing
  - Real-time Resonance Meter with integrated HINTMAP problem display
  - Spectral Balance Correction across 15 frequency bands with learnable profiles
  - Match Profiles for Mastering, Vocals, Guitar, and more (or learn your own from any reference audio)
  - Per-band Enable, Solo, and Delta listening tools
  - Midrange Focus Listening Mode to audition the midrange in isolation
  - Automatic Gain Compensation and A/B comparison
  - Fully Resizable UI with Color options
  - Full Preset Librarian with Categories, Tags, Descriptions, UNDO, and A/B Comparison
  - Includes Professional Presets for Mastering, Vocals, and more
  - macOS 10.14+, 64-bit AAX, AU, VST, VST3, all formats Apple Silicon compatible
  - Windows 10+, 64-bit AAX, VST, VST3
