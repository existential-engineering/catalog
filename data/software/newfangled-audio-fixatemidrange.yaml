    description: All parameters are properly restored by A/B in AUTOMATIC mode.
      Manual properly describes how to analyze an EQ curve.
  - name: 1.0.5
    releaseDate: 2026-05-25
    description: Added Profiles for Dialogue. Added on/off toggles to each band in
      the Balance section, allowing the user to choose which midrange bands get
      corrected and which don't. Added independent MIX sliders for the resonance
      and balance section, made global mix truly global. Blocked resonance solo
      and delta controls during analysis (they interfere with analysis results).
      Fixed PROFILE LEARN button not latching in AUTOMATIC mode. Input/Output
      meter labels should no longer be fuzzy on Windows.
  - name: 1.0.3
    releaseDate: 2026-05-18
    description: Fixed the host Bypass button. Fixed the value entry font and
      Profile Bar not displaying at the correct size on Windows. Fixed FIX
      latching on when analysis was off. Fixed automation parameters being
      written continuously while analyzing and/or fixing. You can now type
      values into the balance curve. A/B load no longer overwrites the analysis
      data making A/B work correctly. Analysis stops automatically when you load
      a preset or switch A/B slot.
