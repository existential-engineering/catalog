description: A free vintage gold-plate reverb plugin inspired by the EMT 140. Warm, mellow plate tails on vocals and drums.
details: |-
  The RO-GOLD is a free vintage plate reverb built around one idea: give every producer the warm, mellow bloom of a solid gold plate without the seven-figure price tag or the 600-pound crate in the corner. It runs on the same physically modelled plate as its bigger sibling, delivered through efficient real-time convolution, so the tail blooms and settles with the physics of a real plate rather than a generic digital reverb, and it costs you nothing to find out.

  Real reverb chambers were expensive and unpredictable, so from the 1950s engineers hung foil and steel plates to fake them. The EMT 140 made that trick famous, and its dense, silky tail is all over the hit records of that era. But a plate cast from solid gold stayed a fantasy, the raw material alone would run into the millions. The RO-GOLD gives you the tone of that imaginary 24k plate: warmer and mellower than steel, with a smooth top end that flatters vocals instead of hyping them.

  The RO-GOLD keeps it deliberately simple. Bass Cut is a high-pass filter that clears rumble out of the tail anywhere from 10Hz to 1kHz. The Damper sets decay time across ten positions, exactly like the mechanical damper bar on the original hardware. Pre/Delay slides the wet signal behind the dry, 0 to 1ms of fine offset in its first third, then out to 500ms, so you can carve space before the reverb blooms. Dry/Wet blends the whole thing in-plugin, following the classic send-effect approach without forcing you to wire up a return bus. A backlit VU meter watches your levels while you dial it in.

  On vocals, a little pre-delay and moderate damping push the singer into a warm room without washing out the consonants. On snares and drums, a shorter decay adds body and a vintage tail that sits back in the mix. On synths and pads, open the Damper and let it bloom into a mellow wash.
