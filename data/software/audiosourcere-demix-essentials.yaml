description: DeMIX Essentials offers DJs and music fans a way to separate and
  remove vocal and instrumentals with HQ results with our AI algorithms.
details: |-
  DeMIX Essentials is standalone software offering advanced sound isolation
  algorithms combined with an intuitive workflow for vocal and drum removal,
  plus bass and instrument isolation. It targets DJs and music fans who need
  accessible stem separation.

  The software includes vocal, bass, drum, and other instrument separators with
  batch separation of multiple instruments from multiple clips. Users can
  separate, refine, mix, and merge unlimited tracks using the built-in
  multi-channel mixer.

  All separations are non-destructive with customizable separation algorithms.
  The software supports instant playback of separated tracks and interleaved
  separation for faster processing of multiple stems simultaneously.

  DeMIX Essentials supports audio up to 24-bit 192kHz and features GPU/Apple
  Silicon acceleration. It runs on macOS 12.7+ (Intel and Apple Silicon) and
  Windows 10+, requiring a minimum of 4GB RAM (8GB recommended) and a Core Duo
  3GHz CPU.

  Priced at $129 as a one-time purchase, it offers a more affordable entry point
  compared to DeMIX Pro while retaining core separation capabilities.
specs: |-
  - AI-powered vocal, bass, drum, and instrument separators
  - Batch separation of multiple instruments from multiple clips
  - Unlimited non-destructive separations and track merging
  - Built-in multi-channel mixer for remixing
  - Customizable separation algorithms
  - Instant playback of separated tracks
  - Interleaved separation for faster multi-stem processing
  - GPU and Apple Silicon acceleration
  - Supports up to 24-bit 192kHz audio
  - macOS 12.7+ (Intel and Apple Silicon), Windows 10+
  - Minimum 4GB RAM (8GB recommended), Core Duo 3GHz CPU
  - Optional NVIDIA GTX 1070 GPU or better
  - Requires iLok License Manager
