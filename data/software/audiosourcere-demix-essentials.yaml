description: DeMIX Essentials offers DJs and music fans a way to separate and remove vocals and instrumentals with high-quality results using AI algorithms.
details: |-
  DeMIX Essentials is standalone software that brings you our latest most advanced sound isolation algorithms combined with our intuitive workflow.

  Essentials now lets you auto-remove vocals as well as drums, bass, and other instruments easily and quickly delivering new high-quality separations for remixing, sampling, or creating acapella and backing tracks.

  DeMIX Essentials is a must-have for DJs, music producers, remix artists, musicians, and educators looking to isolate vocals and drums, create backing tracks and samples, or making quick remixes from existing audio.

  Mute the vocals, a solo instrument, or drums to play along with your favourite artist.
specs: |-
  - All Vocal, Bass, Drum and Other separators
  - Batch Separation of multiple instruments from multiple clips
  - Separate, refine, mix and merge unlimited tracks
  - Multi-channel mixer for quick and easy remixing
  - Non-destructive separations
  - Customizable separation algorithms
  - Supports up to 24bit 192kHz audio
  - Mac OS 12.7 and up
  - Windows 10 and up
  - Minimum RAM requirements 4 GB (recommended 8 GB)
  - Minimum CPU requirements Core Duo 3GHz
  - Recommended NVIDIA GTX 1070 GPU or better but not necessary
  - Compatible with Intel Macs but Apple Silicon processor recommended for faster separations
  - iLok License Manager must be installed before the software will run
versions:
  - name: "6.0"
    description: Adds instant playback during processing, interleaved separation for faster speeds, GPU/Apple Silicon acceleration, and improved separation models for vocals, drums and bass.
