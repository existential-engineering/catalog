description: A high-quality mastering dithering and noise shaping processor designed to cover a wide range of situations when dithering or noise shaping is the way to maintain the quality of an original mix, group or individual track during various stages of the recording and mastering process.
details: |-
  PSP X-Dither is a high-quality mastering dithering and noise shaping processor. It is designed to handle a wide range of situations where dithering or noise shaping is needed to preserve the quality of an original mix, group, or individual track - at various stages of the recording and mastering process, including final digital mastering.

  While PSP X-Dither is built for transparent, final-stage dithering, it can also be used creatively to add subtle - or not-so-subtle - lo-fi character to your audio. Try it on drums, vocals, or synths to introduce vintage-style texture, controlled digital grit, or gentle noise shaping - perfect for experimental, retro, or indie styles.

  In order to run PSP X-Dither in 30-day trial mode or activate it, you need an iLok user ID which you can create for free at www.ilok.com, and you need to install the free iLok License Manager application but you don't need any hardware dongle. You can activate the license in 3 separate locations, each of which can be either a computer or an iLok dongle (2nd generation or above). You can move these licenses at any time using PACE's iLok License Manager software.
