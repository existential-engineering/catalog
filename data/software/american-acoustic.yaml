details: |-
  American acoustic is the latest audiophile-grade sampletank instruments collection featuring one of the most popular american-made acoustic guitars of all time. The library was created using an exceptionally great sounding vintage martin d28 with its famous spruce top and mahogany neck, recorded in ik studios in modena, italy using the best microphones, preamps and converters available for the project.

  The recording was captured using a schoeps cmc small diaphragm condenser microphone and a prism orpheus preamp / interface pairing. The instrument was recorded many times using different techniques to ensure that when translated to the keyboard or in MIDI patterns, it sounded like an amazing acoustic guitar played by a great guitarist.

  American acoustic is a comprehensive library of acoustic guitar sounds with a huge selection of instruments that cover every method of playing from flatpicking, fingerstyle, strumming and beyond. You can add additional effects like slides and harmonics, and the library includes a generous selection of patterns using different articulations including strumming techniques.

  The instrument is a perfect fit for pop, rock, folk, country, hip-hop, r&b and even edm, providing great sounding acoustic guitars at the touch of a button. It functions as an audio units plugin, a VST 3 plugin, an AAX plugin and a standalone application for macos and windows.

  Windows requires intel core 2 duo or amd athlon 64 x2 (intel core i5 suggested), 4 gb of ram (8 gb suggested), and 40 gb (sampletank 4 se), 128 gb (sampletank 4), or 256 gb (sampletank 4 max) of hard drive space. Mac requires intel core 2 duo (intel core i5 suggested), 4 gb of ram (8 gb suggested), macos 10.10 or later, and the same hard drive space requirements.
