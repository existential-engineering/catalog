description: PSP EasyVerb is a multipurpose algorithmic reverb processor that simulates physical spaces and classic reverb machines including plate and spring reverbs. Offers 10 reverb algorithms (Ambience, Room, Chamber, Club, Hall, Arena, Cathedral, Spring, Plate, and Reverse), each with Legacy, Alt1, and Alt2 variations, plus Small/Medium/Large size options, and a 3-band semi-parametric EQ.
details: |-
  Requires a free iLok user ID for license activation; no hardware dongle needed. License can be activated in up to 3 locations. A 30-day demo is available for both macOS and Windows. Supports macOS 10.14 Mojave through 15 Sequoia (Intel and Apple Silicon) and Windows 7-11 (64-bit).
specs: |-
  - 10 reverb algorithms: Ambience, Room, Chamber, Club, Hall, Arena, Cathedral, Spring, Plate, Reverse
  - Algorithm variations: Legacy, Alt1, Alt2
  - Size options: Small, Medium, Large
  - Parameters: Decay, Damp, Predelay
  - 3-band semi-parametric EQ (upper/lower shelving + peaking mid)
  - Platforms: macOS 10.14-15 (Intel and Apple Silicon), Windows 7-11 (64-bit)
  - Formats: AU, VST2, VST3, AAX
  - License: iLok ID required (no dongle), 3 activations
