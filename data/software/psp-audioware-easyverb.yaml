description: "PSP EasyVerb gives you a choice of ten beautiful reverb algorithms: Ambience, Room, Chamber, Club, Hall, Arena, Cathedral, Spring, Plate and Reverse. Each algorithm interacts differently with the same set of simple controls, so you don't have to re-learn the plug-in every time you change your sound."
details: |-
  PSP EasyVerb is a multipurpose algorithmic reverberation processor that can simulate physical spaces or popular reverb machines such as plate and spring reverbs. It is designed to be simple to use, while offering enough control to quickly customize each effect to specific needs: a reverb that is operationally "easy," but sonically complex.

  PSP EasyVerb gives you a choice of ten beautiful algorithms: Ambience, Room, Chamber, Club, Hall, Arena, Cathedral, Spring, Plate and Reverse. Each algorithm interacts differently with the same set of simple controls, so you don't have to re-learn the plug-in every time you change your sound.

  Each algorithm offers three variations. Legacy is the original sound from PSP EasyVerb version 1, for seamless compatibility with existing projects. Alt1 and Alt2, introduced in version 2, give you expanded creative options with their lush new tonalities. Algorithm size options are Small, Medium and Large, with Medium matching the Room size setting from version 1, so combining Medium size with the Legacy algorithm gives access to the authentic sound of PSP EasyVerb version 1.

  Adjustable parameters are kept deliberately simple: Decay controls the reverb time to shape the overall room character, Damp applies high-frequency damping for darker room simulations, and Predelay adjusts the delay before the reverb starts to help build convincing large spaces.

  A 3-band semi-parametric equalizer offers upper and lower shelving bands (that can also work as highpass and lowpass filters) as well as a peaking mid band, so you can shape the reverb's frequency spectrum for precise tonal adjustments or to create drastic new effects.
specs: |-
  - Ten reverb algorithms: Ambience, Room, Chamber, Club, Hall, Arena, Cathedral, Spring, Plate and Reverse
  - Algorithm variations: Legacy (original PSP EasyVerb version 1 sound), Alt1 and Alt2 (new in version 2)
  - Algorithm size options: Small, Medium and Large (Medium matches the version 1 Room size setting)
  - Decay control sets reverb time to shape the overall room character
  - Damp control applies high-frequency damping for darker room simulations
  - Predelay control adjusts the delay before the reverb starts
  - 3-band semi-parametric equalizer with upper and lower shelving bands (usable as highpass and lowpass filters) and a peaking mid band
  - Windows 7 to Windows 11, 64-bit VST, VST3 and AAX (Pro Tools) hosts
  - macOS Intel or macOS Silicon, macOS X 10.14 Mojave to macOS 15 Sequoia, 64-bit AudioUnit, VST, VST3 and AAX (Pro Tools) hosts
  - Free iLok user ID and iLok License Manager required, no hardware dongle needed
  - License activatable in 3 separate locations (computer or iLok dongle, 2nd generation or above)
