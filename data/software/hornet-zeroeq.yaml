description: Intelligent auto equalizer plugin with dual-engine analysis. Finds harsh frequencies & balances spectrum automatically. VST/AU/AAX.
details: |-
  Every mixing engineer knows that moment when a track sounds "off" but you can't pinpoint exactly where. You spend 30 minutes sweeping through frequencies, making micro-adjustments, second-guessing every move. The mix still isn't quite right.

  The truth is, traditional EQ workflows make you hunt blindly. You're using your ears in isolation, without visual confirmation of what's actually happening in the frequency spectrum. Meanwhile, harmonic resonances and tonal imbalances hide in plain sight, making every decision feel like guesswork.

  That's exactly why we created ZeroEQ. After 15 years of plugin development and thousands of hours analyzing how engineers actually work, we realized something critical: the fastest way to fix frequency problems is to see them automatically. The result? An intelligent equalizer that combines two complementary approaches, corrective EQ that removes resonances, and tonal shaping that balances your spectrum, all guided by automatic analysis.

  Two complementary equalizers work together: HarmoniQ automatically identifies and corrects up to 30 harmonic resonances, while BalanceEQ shapes the overall tonal spectrum. An 8192-point FFT analysis runs in real time, continuously scanning the audio to identify problematic frequencies and tonal imbalances, with no manual sweeping required.

  After the automatic engines do their corrective work, two manual controls shape the creative character: Brightness adds air and sparkle or warmth and body, while V-Shape creates modern scooped sounds or vintage mid-forward tones. An optional constant loudness mode maintains perceived volume during A/B comparisons.
specs: |-
  - Dual EQ engines (HarmoniQ corrective, BalanceEQ tonal)
  - 8192-point FFT analysis
  - Up to 30 harmonic detection
  - 36-band internal EQ precision
  - Brightness control
  - V-Shape tonal adjustment
  - Constant loudness compensation
  - Real-time visual feedback
  - macOS 10.13+, Intel & Apple Silicon native
  - Windows 10/11 (64-bit)
  - CPU: dual-core 2.0 GHz or faster, 4 GB RAM, 10 MB disk space
  - No dongle required; licence valid on up to 2 machines
