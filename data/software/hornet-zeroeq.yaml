description: Intelligent auto equalizer plugin with dual-engine analysis. Finds harsh frequencies & balances spectrum automatically. VST/AU/AAX.
details: |-
  ZeroEQ is an intelligent equalizer built on the idea that the fastest way to fix frequency problems is to see them automatically. Traditional EQ workflows make you hunt blindly, sweeping through bands and second-guessing every move while harmonic resonances and tonal imbalances hide in plain sight. ZeroEQ instead combines two complementary approaches, corrective EQ that removes resonances and tonal shaping that balances the spectrum, both guided by automatic analysis.

  Two equalizers work together inside the plugin. HarmoniQ automatically identifies and corrects up to 30 problematic harmonics, detecting frequencies that stick out, cause harshness or create unwanted resonances, then applying corrective EQ to smooth them out transparently. BalanceEQ analyzes the overall frequency distribution and shapes the tonal spectrum for professional balance, catching low-mid buildup, a lack of air or any other spectral imbalance and correcting it musically.

  An 8192-point FFT analysis runs in real time, continuously scanning the audio to identify problematic frequencies and tonal imbalances with no manual sweeping required, and 36-band internal EQ precision carries out the corrections. Real-time visual feedback shows what the engines detect and how they are fixing it, which makes the plugin a learning tool as much as a mixing one.

  After the automatic engines do their corrective work, two manual controls shape the creative character. Brightness adds air and sparkle or warmth and body, while V-Shape creates modern scooped sounds or vintage mid-forward tones, both with transparent EQ curves. An optional constant loudness mode maintains perceived volume during A/B comparisons so level differences do not bias the judgement.

  HoRNet is explicit about the plugin's scope: ZeroEQ is transparent and surgical rather than an analog-character EQ, it cannot recover information a poor recording never captured, and it is not intended to replace character EQs, filters or specialized processors. It does not offer dynamic EQ, match EQ or linear phase processing. A fully functional demo is available that silences the output every 30 seconds, a license covers up to 2 computers in any combination of Mac and Windows with no dongle, and the purchase carries a 15-day money-back guarantee. ZeroEQ is also sold as part of the ZeroBundle.
specs: |-
