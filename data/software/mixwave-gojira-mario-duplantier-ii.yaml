details: |-
  Elevated, evolved, and entirely new. Featuring more articulations, expanded velocities, and unprecedented nuance, capturing Mario's refined cymbal collection and studio-perfect drum tones, offering an authentic glimpse into his live and studio setups. In pursuit to create a new virtual instrument from the ground up, the result is a bold reimagining of his signature sound, harnessing the next level of Gojira's percussive force. Introducing, MixWave: Gojira - Mario Duplantier II .
