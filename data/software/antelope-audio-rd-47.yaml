details: |-
  RD47 is an authentic recreation of one of Abbey Road Studios' most iconic valve line amps which defined the beautiful sound of the 1960s. It was used to amplify every single stage of the audio signal path, meaning mic pres, line outs, hardware sends and monitor outs were all treated with RD-47's signature analog punch.

  If you love your pres carrying the aggressive touch of vintage analog gear, RD-47 is going to be your new best friend. The plugin brings that distinctive tube preamp character, with the warmth and harmonic richness that defined countless classic recordings made at Abbey Road throughout the 1960s.

  Runs natively in your DAW on macOS or Windows, or in real-time on your Synergy Core interface. RD47 is available as a standalone purchase or as part of the Antelope Cosmos subscription, which unlocks all 75+ Antelope Native Plugins.
specs: |-
  - Tube mic preamp plugin
  - Authentic recreation of an iconic Abbey Road Studios valve line amp from the 1960s
  - Signature analog punch for mic pres, line outs, hardware sends and monitor outs
  - Modeled with proprietary FPGA technology
  - Runs natively in your DAW on macOS or Windows
  - Runs in real-time on Antelope Synergy Core interfaces
