description: VSR REV6000 is Relab's machine-learning-based re-creation of an iconic Danish hardware reverb favored in Hollywood, covering tight, focused rooms through large, warm halls with precise imaging.
details: |-
  VSR REV6000 is built from years of research and precision machine learning to reproduce the character of a Danish hardware reverb that became a Hollywood favorite. It covers everything from a touch of ambience on a vocal to a vast, enveloping hall, including the classic large, warm "Hollywood Hall".

  The plug-in recreates the algorithms of its hardware predecessor, whose ray-traced early reflections were hand-tuned over 30 "working years". Where many reverb plug-ins produce artificial, often metallic-sounding early reflections, the REV6000 keeps the shifting, natural early reflections of the original.

  Its parameters adapt the algorithms in real time. Rather than the one-to-one mapping of typical reverb plug-ins, where one parameter changes one aspect of the sound, the REV6000 uses a one-to-many approach in which one control moves several aspects of the reverb together.
specs: |-
  - Ray-traced early reflections recreating the hardware predecessor's algorithms
  - Dynamic, one-to-many parameter response that adapts algorithms in real time
  - Location types and sizes ranging from tight rooms to large halls
  - Hand-crafted factory presets
  - 64-bit only; macOS 10.15 or higher (Intel or M1), 2 GB RAM
  - Windows 10 or higher, Core 2 or higher, 2 GB RAM
  - No hardware dongle required: local computer authorization or iLok USB key (V2 or above), with a free PACE iLok account required at activation
