description: An ultra-realistic cinematic reverb plugin described as the world's most accurate recreation of an iconic Hollywood favorite hardware reverb. Features ray-traced early reflections modeled after 30 years of hardware refinement, dynamic adaptive algorithms using one-to-many parameter relationships, multiple location presets, and precise imaging for depth and space.
details: |-
  The REV6000 faithfully recreates the groundbreaking algorithms of a peerless Danish hardware reverb, which leveraged advanced ray tracing technology hand-tuned over 30 working years. Thanks to years of research and precision machine learning, Relab has produced what it calls the world's most accurate recreation of an iconic Hollywood-favorite hardware reverb unit.

  Whether you are adding a touch of ambience to a vocal or creating vast, enveloping hall, the REV6000 delivers with unparalleled realism and creativity. While most reverbs excel in specific scenarios but fall short in others, the REV6000 is positioned as a Swiss Army knife of realistic reverbs — one reverb that is right for every job.

  The REV6000 employs dynamic, adaptive algorithms that intelligently respond to every parameter adjustment in real time. Unlike typical reverb plugins that operate on a simplistic one-to-one basis, the REV6000 uses a sophisticated one-to-many approach, where adjusting one parameter affects multiple aspects of the sound simultaneously.

  While many reverb plug-ins produce artificial, often metallic-sounding early reflections, the REV6000 stands apart by preserving the nuanced, ever-changing sonic landscape of its hardware inspiration — ray-traced early reflections that feel completely natural.

  Authorization is handled via PACE iLok, with the option of local computer activation or an iLok USB key (V2 or above). A free iLok account and internet connection are required at the time of activation. No hardware dongle is required.
specs: |-
  - Mac: macOS 10.15 (Catalina) or higher, Apple Silicon M1 native or Intel 64-bit
  - Mac: 2GB RAM minimum
  - Windows: Windows 10 or higher, Core 2 or higher (Intel Core i7 8th-gen+ or AMD Ryzen 5 recommended), 2GB RAM minimum
  - Formats — Mac: VST3, AU, AAX (64-bit)
  - Formats — Windows: VST3, AAX (64-bit)
  - Compatible DAWs — Mac: Logic Pro 10.x+, Pro Tools 11.3.2+, Cubase 9.5+, Nuendo 8+, Ableton Live 9+
  - Compatible DAWs — Windows: Pro Tools 11.3.2+, Cubase 9.5+, Nuendo 8+, Ableton Live 9+
  - Authorization: PACE iLok (local computer or iLok USB V2+); free iLok account required
  - Ray-traced early reflections engine
  - Dynamic, adaptive one-to-many parameter algorithms
  - Machine-learning-based hardware emulation
