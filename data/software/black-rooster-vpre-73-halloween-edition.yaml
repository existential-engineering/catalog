description: "A Neve 1073-style vintage preamp with a Pre Drive multiplier and sweepable high-pass for heavy saturation."
details: |-
  The VPRE-73 Halloween Edition is a vintage preamp plugin and a variant of the VPRE-73, not a separate emulation. It uses the exact same modelled 1073 signal path (input and output transformers, discrete Class-A preamp, HF high-shelf band) as the standard VPRE-73, so it colours a signal the same way, but adds two genuinely new controls: a Pre Drive multiplier that pushes the saturation far harder than the standard VPRE-73 can reach, and a sweepable high-pass where the standard model has a fixed corner.

  Everything that makes the standard VPRE-73 worth patching in carries over: Pre Gain runs a continuous +18 to +78dB, the Trim spans a clean linear +/-30dB output stage, and the two link together with a right-mouse-drag trick so saturation can be added without the track jumping in level. The HF high-shelf gives roughly +/-15dB of 1073-style top end, modelled with a real-time, SPICE-style component-based circuit simulation running at 4x oversampling.

  Pre Drive is a continuous drive multiplier, sweepable from 1.0x up to 5.0x, that multiplies the level feeding the preamp before the gain stage, pushing the modelled Class-A stage far harder into saturation than the standard VPRE-73's Pre Gain range allows. The sweepable high-pass replaces the standard VPRE-73's fixed 80Hz filter with an HP Freq selector offering Off, 40, 80, 160 and 320Hz positions, letting low end be carved before the drive stage rather than after.

  At Pre Drive rolled back to 1.0x it behaves as a straight VPRE-73, suited to fattening a vocal, adding iron to a bass DI, or gluing a drum bus. Turned up, it becomes a distortion tool for chewing up drum room mics, melting a synth into harmonics, or pushing a guitar into a snarl the standard preamp does not reach. Phase invert, Power bypass and metering carry straight over from the standard VPRE-73.
