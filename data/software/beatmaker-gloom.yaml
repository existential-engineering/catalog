details: |-
  UJAM Beatmaker GLOOM is a specialized virtual drum instrument designed for a
  different kind of rhythmic production. Unlike many of its siblings in the
  beatmaker series that focus on high-impact, genre-specific sounds, gloom is
  built for creating subtle, ambient, and textural rhythms. It's the perfect
  tool for producers of minimal, downtempo, and atmospheric music, where space,
  restraint, and mood are as crucial as the groove itself.

  Gloom provides a curated selection of soft, organic, and evolving sounds,
  including clicks, low pulses, and delicate textures that blend seamlessly into
  a mix without overpowering it. The core of gloom's sound palette is built
  around its 10 unique drum kits, each with 16 distinct instruments. These
  sounds are not your typical punchy kicks or snappy snares. Instead, they are
  meticulously crafted to provide low-intensity rhythmic elements that can serve
  as a foundation for cinematic scores, chill-out tracks, and lo-fi beats.

  The included 20 styles and 460 MIDI loops are a testament to this design
  philosophy, offering rhythmic phrases that move the track forward gently,
  allowing other musical elements to breathe and shine.

  Beyond the sound library, gloom features ujam's signature streamlined
  interface. The plugin includes 12 "mix modes" and 17 "ambience modes" that
  allow for extensive sound shaping directly within the instrument. These
  controls enable users to sculpt the tone, dynamics, and motion of their beats,
  transitioning from a snappy, minimal sound to a lush, immersive one with a few
  simple tweaks.

  The drag-and-drop MIDI functionality is a core feature, providing a quick and
  easy way to transfer grooves into your DAW for further editing and
  customization, making it an efficient tool for producers of all skill levels.
specs: |-
  - 10 unique drum kits
  - 160 instrument samples
  - 20 styles
  - 460 MIDI patterns
  - 12 mix modes
  - 17 ambience/reverb modes
  - 75 global presets
