description: A vintage tape delay emulation plugin with deep, three-dimensional sound. Features up to 2 seconds of delay time, Pro Tools tempo map sync, and multiple tonal options including Vintage mode with modeled reduced dynamic range and Retro mode with digital dynamic range.
details: |-
  Delay Time
  Feedback
  Mode (Vintage/Retro)
  Tonal Options

  Vintage tape delay emulation
  Up to 2 seconds of delay time
  Pro Tools tempo map sync
  Vintage mode with modeled tape dynamic range and self-oscillation
  Retro mode with digital dynamic range
  Noise floor over 60dB down
  Vintage mode includes dither to mask quantization noise
  Multiple tonal options

  Session-restore, automation, preset support, multi-mono support
