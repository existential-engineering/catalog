description: "Control software for RedNet systems that provides total management
  of all RedNet devices on a Dante network, with a tabbed browser-like interface
  and customisable display options."
details: |-
  RedNet Control is the utility software at the heart of every RedNet system. Running on Mac or PC, it provides total control over all RedNet devices on a Dante network, with customisable on-screen display. The tabbed, browser-like interface handles up to 600 RedNet devices.

  Configuration pages for each device allow adjustment to sample rate, Grand Master nomination, fan behaviour and other device-specific parameters such as network configuration. A MIDI bridge allows any programmable CC-based or SysEx MIDI controller to control up to 16 mic pre devices on the network. The CC protocol uses the same specification as the Avid Pre, meaning RedNet 4, RedNet MP8R, RedNet X2P and the Focusrite Red range of audio interfaces can be controlled from Pro Tools.
specs: |-
  - Up to 600 devices supported
  - Remote control for mic preamps (RedNet MP8R and RedNet 4)
  - MIDI bridging for up to 16 mic pre devices
  - Tabbed browser-like interface with up to 50 customisable tabs
  - Up to 12 devices displayed per tab
  - Up to 96 channels of mic preamp metering on one page
  - 16 Device and Session snapshots
  - Avid Pre CC protocol compatibility
  - Compatible devices: RedNet 4, RedNet MP8R, RedNet X2P, Focusrite Red range
