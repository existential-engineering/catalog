description: Ableton drum racks for superior drummer 3 latin percussion ezx
  features separate drum racks for ableton live integration with superior
  drummer 3 latin percussion sounds.
details: >-
  Ableton drum racks for superior drummer 3 latin percussion ezx features
  separate ableton drum racks for all factory presets for the toontrack superior
  drummer 3 and latin percussion ezx library for toontrack ezdrummer. These
  racks provide out of the box integration workflow between ableton live and
  toontrack superior drummer using the toontrack libraries including a host of
  features ready to use for composition and performance using ableton push or
  similar controllers.


  Amazing workflow in ableton and on your push to the full capabilities of the
  kit library saving setup time and allowing you to focus on music creation.
  Ease of navigation to load all latin ezx factory presets from ableton push
  controller device browser.


  4 ableton drum racks to instantly load the factory library "mix ready" presets
  with ableton mappings. 2 ableton live templates designed to host the multi
  channel output routing presets with track level audio routing from superior
  drummer 3 into ableton live. Colour coded pad design for visual performance
  and finger drumming.


  Singleout presets 2 ableton drum racks for all latin ezx factory presets
  single audio output to a single ableton track. Mixing can be further enhanced
  through ableton track mixer by expanding out the track for individual pad and
  instrument level articulation, or loading additional ableton audio effects to
  the track. Multiout presets featuring 2 ableton drum racks for all latin ezx
  presets in multiple audio channel output from the plug in to multiple ableton
  audio tracks using the 2 multi output ableton templates also provided designed
  for the kit presets.


  Use the template racks and extend to your own toontrack superior drummer 3
  latin percussion ezx presets, swapping out individual sounds or articulations.
  You are 100% ready to go with the factory presets but there is no limitation
  to creating your own presets from these templates.
specs: |-
