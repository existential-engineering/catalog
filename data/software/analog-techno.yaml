details: >-
  Analog techno is a representation of the purest dutch and berlin scenes that
  extends to other genres such as minimal and tech-house. Dboxsamples muscles up
  the underground scene with an impressive techno collection bursting with deep
  subsonic bass-lines, razor-blade transient drum loops and life time iconic
  synth sequences.


  This fully operative sample pack runs at 24-bits native wav audio that has
  been processed with your favorite state of the art hardware idols like the
  distressor, culture vulture and massive passive. Leaving no room for any
  digital artifact analog techno does exactly what it says on the tin.


  Db06 widens up your personal sound collection to new levels pushing the
  producer's brain into a whole new level of serious programming keeping your
  music ideas focused.


  Each loop is musically labelled with it's own root key and bpm speed for your
  convenience when adding loops from this collection into other "work in
  progress" projects.


  To enhance your music creations match the sounds included in this pak with
  other xpansion::paks to discover a magnitude of unlimited combinations.
specs: |-
  - 24-bit native wav audio
  - 13 basses
  - 60 drums loops
  - 36 efx
  - 60 fills
  - 29 kit elements
  - 22 perc loops
  - 14 synth loops
  - 572mb zipped
  - Musically labelled loops with root key and bpm speed
