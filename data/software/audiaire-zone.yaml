description: A parameter sequencer synthesizer with 151 oscillators sampled from
  50+ vintage synths, 23 insert effects, and unlimited sequencer lanes.
details: |-
  Zone is a feature-rich synthesizer built around a powerful parameter sequencer
  that allows virtually every control to be assigned to and modified by its own
  independent sequencer lane, with unlimited lanes, each running at their own
  unique rate and number of steps.

  At its core, Zone features 151 oscillators with waveforms sampled from over 50
  vintage synthesizers, along with the ability to import user single-cycle
  waveforms. Multiple filter types are available including comb, notch, phaser,
  circuit-bent, and acid filters with up to 48dB/octave roll-off.

  The synthesizer includes 23 insert effects spanning delay, reverb, chorus,
  flanger, phaser, ring modulation, distortion, and more. Oscillator modulation
  options include exponential FM, ring modulation, amplitude modulation, and
  distortion modulation.

  Zone ships with 590 factory presets designed by professional sound designers,
  categorized across pads, arpeggios, leads, bass, drums, FX, and synths.
  Performance features include chord mode, hold note, and unison with up to 7
  voices.

  Three distinct play modes are available: synth mode for traditional playing, a
  32-step note sequencer, and the infinite parameter sequencer lanes that define
  Zone's unique character.
specs: |-
  - 151 oscillators with waveforms from 50+ vintage synths
  - User single-cycle waveform import
  - 23 insert effect types
  - Multiple filter types with up to 48dB/octave roll-off
  - Exponential FM, Ring Mod, AM, and Distortion modulation
  - 590 factory presets
  - Unlimited parameter sequencer lanes
  - 27 sequencer rates from 8/1 to 1/128th of host tempo
  - 100 global sequencer presets
  - 8-slot modulation matrix
  - Chord mode, hold note, unison up to 7 voices
  - 3 play modes: synth, note sequencer, parameter sequencer
