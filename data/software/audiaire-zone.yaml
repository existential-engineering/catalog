description: At the heart of Zone is a powerful parameter sequencer that allows virtually every control to be assigned to and modified by its own independent sequencer lane, with unlimited lanes, each running at their own unique rate and number of steps.
details: |-
  At the heart of Zone is a powerful parameter sequencer that allows virtually every control to be assigned to and modified by its own independent sequencer lane, with unlimited lanes, each running at their own unique rate and number of steps.

  Zone can be played in three distinct modes: as a feature rich synth with a host of filters, 151 wavetable oscillators with user import, 23 insert FX, powerful mod matrix and much more. With a 32 step note sequencer - allowing pitch, velocity, gate, probability and +/- swing at a variety of rates. Or with infinite note and parameter sequencer lanes, with complex tools and presets for modifying lane behaviour. The sound generation possibilities are virtually limitless.

  The parameter sequencer offers unlimited lanes, each running at up to 27 different rates from 8/1 to 1/128th of host tempo, with 100 global, unipolar and bipolar parameter sequencer lane presets. Oscillator modulation modes include Exponential FM (as seen in Roland's Jupiter 8), Ring Modulation, Amplitude Modulation and Distortion Modulation, alongside an extensive modulation matrix with 8 slots and numerous sources.

  High quality analogue modelled oscillators give 151 oscillator types sampled from over 50 uber-rare vintage synths, with sub, noise and the ability to load and save unique single-cycle waveforms. 23 insert FX types are available, including delay, stereo width enhancer, reverb, chorus, flanger, phaser, barber-pole phaser, compression, decimator, ring modulation and distortion, plus multiple filter types (comb, notch, phaser, circuit-bent, 'acid') with up to 48dB/octave roll-off.

  Zone features 590 presets expertly crafted by some of the world's leading patch creators, categorised by pads, arpeggios, leads, bass, drums, FX and synths. Chord, hold note and unison modes give up to 7 voice spread, fully assignable macro controls handle performance duties, and the clearly laid out, scalable GUI is designed for ease-of-use with one page editing.
specs: |-
  - Parameter sequencer with unlimited lanes, each at its own rate and number of steps
  - Up to 27 different lane rates, from 8/1 to 1/128th of host tempo
  - 100 global, unipolar and bipolar parameter sequencer lane presets
  - 32 step note sequencer with pitch, velocity, gate, probability and +/- swing
  - 151 oscillator types sampled from over 50 vintage synths, plus sub and noise
  - Single-cycle waveform import, load and save
  - 23 insert FX types: delay, stereo width enhancer, reverb, chorus, flanger, phaser, barber-pole phaser, compression, decimator, ring modulation, distortion
  - Multiple filter types (comb, notch, phaser, circuit-bent, 'acid') with up to 48dB/octave roll-off
  - Oscillator modulation modes: Exponential FM, Ring Modulation, Amplitude Modulation, Distortion Modulation
  - Modulation matrix with 8 slots and numerous sources
  - 590 presets categorised by pads, arpeggios, leads, bass, drums, FX and synths
  - Chord, hold note and unison modes with up to 7 voice spread
  - Fully assignable macro controls
  - Scalable GUI with one page editing
  - Sequence lane presets for creating arpeggios and scales, with step shift and data flip
