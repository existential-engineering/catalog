details: >-
  Addictive drums is a "complete drum production studio". It includes 3 complete
  kits, and lots of extra drums and cymbals. The samples include every nuance
  from the softest to the hardest hits, many stroke variations (hihat has 12
  variations, snare has 6 for example) with alternating samples through-out. All
  sampled drum/cymbal sounds are recorded with a multi channel mic setup, just
  as you would record a real drum kit.


  Shaping the basic sound is easy within ad's sampler section. Controls for
  volume and pitch (with envelopes), levels (adjust balance of close, overhead
  and room levels of each kit piece), and filter (cut the low end on hihats for
  example) means you can do anything from slight tweaking to major
  reconstruction of the sound. 12 mixer channels, 52 insert effects and 2
  reverbs are at your disposal, with everything quickly accessible, no hidden
  menus get in your way.


  The included presets make it easy to try out different styles for a track, and
  lets you save and re-use complete drum productions in new songs. You can
  create your own folders with your own presets and they immediately appear in
  the preset menu. A vast library of MIDI files in different styles, all easily
  accessible from within ad gives you the building blocks to create drum tracks
  quickly.


  The built in browser lets you search by keyword ("ride", "metal"), or sort by
  category, bpm, time signature. Drag'n'drop files the files you like to ad's
  favourite list, or drag them right into your host's arrangement window. Ad is
  a multi-out plugin; every channel in the ad mixer can be routed to a separate
  output if required.


  Presets: over 100 presets are included, ranging from pure acoustic pop, to
  metal, funk and distorted electronica mayhem. Preset categories include:
  clean, distorted, electronica, lofi, poprock (big), poprock (medium), poprock
  (dry), retro, rock, soft, xperimental. MIDI library: more than 3000 beats and
  fills in various styles such as pop/rock, metal, funk, jazz etc are included.
