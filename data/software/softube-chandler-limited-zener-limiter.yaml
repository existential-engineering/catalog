details: |-
  Descended from the iconic limiters of Abbey Road Studios, the Chandler Limited Zener Limiter is a legend in its own right. With the vibe of the vintage hardware used to capture Pink Floyd and The Beatles running through its veins, the Zener Limiter is a rock and roll blueblood, with an appealingly modern streak.

  In collaboration with Chandler Limited, Softube proudly continues the legacy with the Zener Limiter plug-in. A true emulation of its forebearer, christened by Chandler Limited's Wade Goeke himself, the Zener Limiter plug-in is a versatile, state-of-the-art limiter and compressor that stays true to its illustrious sonic roots.

  Legendary Lineage: Blessed by Chandler Limited founder, Wade Goeke, the Zener Limiter plug-in embodies the heritage of the limiters that recorded Pink Floyd and The Beatles. That's why Softube made sure that its apple fell close to the tree.

  Golden Child: Add understated, vintage vibes to a track or thoroughly transform the tone, character, and transient behavior of a drum bus or room mic channels. The Zener Limiter plug-in is the most versatile member of your studio family.

  Breaking the Mold: Input stage with variable impedance, THD mode, the different comp modes, the rare form of the attack and release, the exclusive features of the Zener Limiter plug-in make it a compressor without a twin.
specs: |-
  - Expertly emulated and fully-endorsed by the creator of the original hardware, Wade Goeke
  - The vintage vibe of the equipment used to record The Beatles and Pink Floyd
  - Console 1 Ready: works as a native plug-in and in Console 1, Softube's mixing ecosystem
  - Superb versatility that makes it the secret weapon of high-level engineers and mixers
  - Essential switches, such as Input Gain, THD, and Comp 1/Comp 2/Limit
  - Plug-in exclusive features, such as Mid/Side Processing, External Sidechain, and Link Channels
  - Supports Softube Extended Features easy-access panels
  - macOS Sonoma 14, Sequoia 15, Tahoe 26
  - Windows 10 (64-bit), Windows 11
  - Softube account and iLok account required (no physical iLok required)
  - Computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Internet access (for downloading installers and managing licenses)
  - Three activations per license
