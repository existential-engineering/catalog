description: AizerX Trailer SFX Designer Toolkit is a versatile tool for creating impressive, Hollywood-level sound effects for your projects without having much experience in sound design. It features a customizable hybrid sound effects engine with smart samples randomization, frequency filters, LFO, ADSR, and an XY pad.
details: |-
  AizerX Trailer SFX Designer Toolkit has a user-friendly, outer-space interface, inspired by the infinity of the universe just like the possibilities of the engine. Its main feature is smart sample randomization for creating unique, custom and authentic sound effects with a single click.

  The engine is built on 6 modules containing a large AizerX library of fully customizable hybrid sound effects in different categories, including braams, whooshes, benders, alarms, signals, downers, risers, motions, noises, booms and hits. The toolkit also offers wide sound customization through frequency filters, LFO, ADSR, sample playback modes and an XY pad, with per-module or global parameters that can be saved as presets.

  With the participation of professional musicians, sound designers and sound engineers, Keepforest recorded strings, percussion, guitars, basses and many other instruments to build the library's source material, giving it its signature character.
specs: |-
  - Requires the FULL VERSION of Native Instruments' KONTAKT version 5.7.3 or higher (not compatible with the free Kontakt Player, which runs the instrument in DEMO mode only)
  - Mac OS X 10.8 or higher, Intel Core 2 Duo
  - Windows 7 or higher, Intel Core 2 Duo or AMD Athlon 64 X2
  - 4 GB RAM
  - At least 2 GB of free hard disc space
  - Brand-new sound design engine with unlimited high-quality sound design randomization
  - 6 sound design modules: 81 braams (low + mid), 43 signals, 65 pre-whooshes + hits, 95 motions, 103 alarms, 221 downers
  - 193 benders, 228 pre-whooshes and transitions, 116 signals, 32 specific layers, 3 bends, 2 noises
  - Alarm layers: 27 high, 35 mid, 26 low, 2 noise, 13 pre-whoosh
  - Downer layers: 21 high, 38 hit, 48 low, 24 mid, 13 noise, 43 pre-whoosh, 2 signal, 32 specific
