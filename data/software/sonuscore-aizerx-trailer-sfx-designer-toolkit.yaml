description: AizerX Trailer SFX Designer Toolkit is a versatile tool for creating impressive, Hollywood-level sound effects for your projects without having much experience in sound design. It features a customizable hybrid sound effects engine with smart samples randomization, frequency filters, LFO, ADSR, and an XY pad.
specs: |-
  - Requires Native Instruments KONTAKT 5.7.3 or higher (full version; free Kontakt Player incompatible)
  - OS: Mac OSX 10.8+ or Windows 7+
  - Processor: Intel Core 2 Duo or AMD Athlon 64 X2
  - RAM: 4 GB minimum
  - Storage: 2 GB free hard disk space
  - 6 modules: 81 Braams, 43 Signals, 65 Pre-Whooshes + Hits, 95 Motions, 103 Alarms, 221 Downers
  - Additional samples: 193 Benders, 228 Pre-whoosh and Transitions, 116 Signals (Designer Layers), 32 Specific Layers, 3 Bends, 2 Noises
  - Smart samples randomization engine
  - XY pad, LFO, ADSR, frequency filters
