description: Get the key and BPM of any audio, instantly. Mixed In Key Live gives you the key, BPM, and specific notes of any audio playing on your Mac or Windows computer.
details: |-
  Mixed In Key Live gives you the key, BPM, and specific notes of any audio playing on your Mac or PC in real time. Works with any audio source — Spotify, YouTube, Ableton Live, Logic Pro, Pro Tools, Splice, and sample libraries — without requiring the audio file itself.

  The graphic note visualizer shows the exact notes and scale being played at any given moment, giving producers instant pitch identification for any sample before committing it to a production.

  A compact mini mode sits in the menu bar or taskbar so the app floats over your DAW or streaming app without consuming workspace. Co-created with DJ/producer KSHMR.

  Uses the same award-winning key-detection algorithm as Mixed In Key 11. Supports up to 3 personal computer installations per license. Standalone desktop application — does not run as a DAW plugin.
specs: |-
  - Real-time key and BPM detection from any system audio
  - Graphic note visualizer showing exact notes and scale
  - Compact mini mode for menu bar / taskbar
  - Compatible with Spotify, YouTube, Ableton, Logic Pro, Pro Tools, Splice
  - Native Apple Silicon support (M1, M2 and later)
  - macOS 11.7.10 (Big Sur) or higher
  - Windows 10 or 11
  - Up to 3 personal computer activations per license
