description: Get the Key and BPM of any audio, instantly. Mixed In Key Live
  gives you the Key, BPM, and specific notes of any audio you play on Win + Mac.
details: |-
  Mixed In Key Live gives you the key, BPM, and specific notes of any audio you play on your Mac or PC, immediately. It analyses whatever is playing through your computer speakers, including Spotify tracks, YouTube videos, Splice, sample libraries, Ableton and Logic.

  Every sample you play is analysed as it plays, so you can confirm that the kick or piano sample you just grabbed is the right pitch for your song before committing to it.

  The interface shows the key, scale and BPM of the audio, and a graphic note visualizer displays the exact notes and key being played at any given moment.

  A collapsed view is available from the Mac or PC menu bar, so the app can float over Spotify, Splice or Ableton without taking up much space.

  The product came out of a request from producer and DJ KSHMR for a tool that removed the time spent pitch and BPM matching. It uses the same key-detection algorithm as Mixed In Key 11.
specs: |-
  - Real-time key, scale, BPM and note detection of any audio playing on the computer
  - Works with any source, including Spotify, YouTube, Splice, sample libraries, Ableton and Logic
  - Graphic note visualizer showing the exact notes and key being played
  - Collapsed mini view available from the Mac or PC menu bar
  - Uses the key detection algorithm from Mixed In Key 11
  - Mac requirement: macOS 11.7.10 or higher
  - Windows requirement: Windows 10 or 11
  - Runs natively on Apple M1 and M2 Macs
  - Install on up to 3 personal computers
