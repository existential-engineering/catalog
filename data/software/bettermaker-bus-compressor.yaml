details: |-
  Tighten your mixes with musical bus compression. Use the bettermaker bus
  compressor to add bus compression to your drum, vocal, guitar, and stereo
  buses. This VCA bus compressor plugin is designed to preserve transient
  material and maintain "punch" while glueing your mixes together. The
  Bettermaker Bus Compressor will add the warmth and vibe that your submixes
  have been missing, especially when applied to raw studio recordings.

  The hardware version of the bettermaker bus compressor uses an entirely analog
  signal path with settings that are saved and recalled digitally; this has LED
  to the unit's widespread popularity amongst professional mixing and mastering
  engineers. While the bettermaker bus compressor plugin sounds very similar to
  the hardware, it's slightly more forgiving and surgical, allowing you to
  de-ess vocals and hi-hats. Furthermore, the vca total harmonic distortion
  (thd) knob generates additional harmonic content, subtly saturating your
  music.

  When processing bass-heavy sounds, many compressors often respond too
  aggressively to low-end transients. As a result, you may end up with
  undesirable pumping effects. The bettermaker bus compressor includes a
  sidechain high-pass filter and midrange boost option. Use these features to
  target the punch of kick drums and the sibilance in vocals.

  The bettermaker bus compressor plugin features both peak and rms detection
  modes, making it an incredibly versatile compressor. Peak mode is intended for
  tight dynamics control and is perfect for taming aggressive drum transients.
  Rms mode provides smoother compression, ideal for sustained sounds like pads,
  basses, and vocal textures.
