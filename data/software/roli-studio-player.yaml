description: ROLI Studio Player is a preset-based instrument plug-in built on
  ROLI's Equator2, Cypher2 and Strobe2 synth engines, with a curated set of
  melodic presets, reorderable effects, Smart Chords and a multi-layered MPE
  arpeggiator.
details: |-
  ROLI Studio Player puts a curated library of melodic presets drawn from ROLI's premium synth engines, Equator2, Cypher2 and Strobe2, behind a single interface where each sound can be twisted and tweaked through macros, effects, harmonies and arpeggios. Many of the presets are designed for MPE controllers such as the Seaboard and Piano M, and they also play from any standard MIDI keyboard.

  Smart Chords turn a single finger into a full chord, and the arpeggiator stacks up to three layers into evolving sequences that respond to MPE gestures. A chain of built-in effects can be reordered and adjusted per preset.

  Studio Player is one of the two plug-ins in ROLI Studio, alongside ROLI Studio Drums. In the VST3 version its audio engine can be disabled so that its arpeggiator and Smart Chords drive other instruments in the DAW; the AU version cannot do this.
specs: |-
  - Melodic presets from the Equator2, Cypher2 and Strobe2 synth engines
  - MPE support, compatible with standard MIDI controllers
  - Multi-layered arpeggiator (up to three layers)
  - Smart Chords
  - Reorderable built-in effects and macros
  - Formats: standalone, AU, VST, VST3
  - macOS 11 or later, Windows 10 (x64) or later
  - Intel Core, AMD Ryzen or Apple M1 processor
  - 4 GB RAM (8 GB recommended), 2 GB disk space
  - Internet connection required for registration and content download
