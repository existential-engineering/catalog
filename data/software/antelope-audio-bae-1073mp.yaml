details: |-
  Mic / Line Preamp emulation modeled after a 'gold-standard' British analog preamp known for its warmth and musicality.

  Its sonic signature is ubiquitous to the point of needing no further introduction, and it's borderline impossible to make it sound bad.

  Runs natively in your DAW on macOS or Windows, or in real-time on your Synergy Core interface.

  Included with an Antelope Cosmos subscription (unlocks all 75+ Antelope Native Plugins).
specs: |-
  - Mic / Line Preamp emulation
  - Realtime & Native operation
  - Runs natively in DAW on macOS or Windows
  - Runs in real-time on Synergy Core interfaces
