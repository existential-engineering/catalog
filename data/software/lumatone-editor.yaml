description: Lumatone Editor creates and modifies mapping files for the Lumatone
  keyboard and saves them as presets on the instrument. Version 1.2 adds colour
  tools, live playing feedback and a built-in host for softsynths.
details: |-
  Lumatone Editor allows you to create and modify mapping files for Lumatone, and save them as presets on your instrument. Version 1.2 is a public beta, described on the page as the new Lumatone Editor with more colour, more feedback, and a built-in host for favourite softsynths.

  The 1.2 colour tools work on a whole layout at once. Global colour adjusts the brightness, hue and temperature of a whole layout, colour replace swaps one colour for another everywhere it appears, and isomorphic mode sets scale size and step directions and assigns colours to scale degrees to build an isomorphic layout. The Lumatone graphic in the editor now shows colours the way the LEDs really look.

  Playing feedback is shown live in the app. Keys light up in the preview as you play, with a live velocity meter and MIDI message readout, and a pop-out MIDI inspector window carries MIDI history with detailed metering for aftertouch, pitch bend and mod wheel.

  Version 1.2 also hosts plugins and exports layouts. A softsynth can be loaded and played right in the app, and layouts can be named and saved as PNG files to share. Screen reader support was improved, an occasional crash when reconnecting a Lumatone was fixed, and the app no longer overwrites preset button light colours.

  The editor is also the route for instrument maintenance tasks. Firmware updates are applied from its Settings window under the Firmware tab, and factory presets are loaded into the editor before being held onto a preset button on the keyboard. Lumatone Editor 1.2 is not available for Linux; the page directs Linux users to Lumatone Editor 1.0.2 under Previous Versions.
specs: |-
  - Global colour: adjust the brightness, hue and temperature of a whole layout at once
  - Colour replace: swap one colour for another everywhere it appears in a layout
  - Isomorphic mode: set scale size and step directions, and assign colours to scale degrees
  - Colour preview that shows colours the way the LEDs really look
  - Live feedback: keys light up in the preview while playing, with a velocity meter and MIDI message readout
  - MIDI inspector: pop-out window with MIDI history and metering for aftertouch, pitch bend and mod wheel
  - Plugin host: load a softsynth and play it in the app
  - Layout titles and image export to PNG
  - Screen reader support
  - Firmware updates from the Settings window Firmware tab
  - Saves mapping files as presets on the instrument
