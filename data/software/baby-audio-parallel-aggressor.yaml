description: Parallel saturation and compression plugin. Combines two dedicated
  engines for aggressive parallel processing without requiring external bus
  routing.
details: |-
  Parallel Aggressor is an internal parallel processing plugin that combines compression and saturation without requiring external bus routing. It streamlines the common studio technique of blending processed and dry signals by providing two dedicated engines and a three-signal mix balance system.

  The Spank Engine delivers aggressive parallel compression with four style injection buttons: Extra Punch, Extra Smack, Sidechain Filter, and Mono. The Heat Engine provides analog-modeled saturation with frequency preservation filters and its own four style buttons.

  Auto Gain maintains consistent output levels while the three-signal mix balance allows precise blending via volume faders. The plugin ships with 25 presets crafted by KurtCurt and Anthony Saffery.
specs: |-
  - Spank Engine: parallel compression with Extra Punch, Extra Smack, Sidechain Filter, Mono
  - Heat Engine: analog-modeled saturation with Extra Hot, Tone, HP Filter, LP Filter
  - Auto Gain for consistent output levels
  - Three-signal mix balance via volume faders
  - Visual meters for compression and saturation intensity
  - Solo monitoring for individual signal isolation
  - 25 presets by KurtCurt and Anthony Saffery
  - Native Apple Silicon M-Chip support
  - 64-bit only
