details: |-
  Ab assist is a tool for quickly comparing multiple pieces of audio. This could be different takes, mix revisions, versions of a master, plug-in options, or something else entirely!

  Blind tests can be conducted in 'test' mode, with the channels labelled randomly in order to remove any subjectivity or biases.

  New! For version 2.: receive and compare two four audio sources. Compare stereo surround mixes in any channel count. Auto-level-match: match short-term loudness (lufs) of sources. Mono-check: compare mono fold-down. Smooth fades between sources. Multiple plug-in instances communicate directly instead of using an external send.
