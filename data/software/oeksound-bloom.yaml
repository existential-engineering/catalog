description: An adaptive tone shaper that analyzes the character of a signal and applies dynamic, context-aware corrections to the perceived tonal balance. Described as what an EQ should do. It controls irregularities in rough sounds, increases warmth, clarity, or brightness safely, and transforms tone with natural-sounding results.
details: |-
  bloom is described by oeksound as an adaptive tone shaper: it analyzes the character of a signal and applies corrections to the perceived tonal balance for a more even and refined sound. It also lets the user shape the tone and character of a track, for example by adding warmth, brightness, or clarity. Tonal adjustments are dynamic and context-aware, which, together with the interface design, is intended to keep material sounding natural even when making radical changes.

  The plug-in boosts and cuts frequencies only when needed, with the stated aim of mitigating energy build-ups and revealing more detail. The page gives the example of boosting the high end on vocals without emphasizing unwanted sibilance, summarising the intent as bright not needing to mean shrill and big not needing to mean boomy.

  bloom is positioned both as a starting point when shaping a sound and as a finishing touch. The page describes it as useful for quickly crafting single tracks towards a cohesive mix, and equally functional as a bus processor for sculpting groups or shaping a master. Four tone controls let the user shape the tonal balance freely, and they change the overall tonal balance bloom is working towards rather than making the absolute cuts or boosts found in an EQ, so bigger moves need less compensation or automation around problems.

  Pushing the amount control engages squash mode, in which bloom applies frequency-dependent upward and downward compression to reduce the dynamic range of the signal and mold it towards the specified shape. The page describes using it either to subtly bring out detail or to dramatically over-emphasize it, adding grit without saturation. A low latency mode allows tracking through the plug-in.

  oeksound frames bloom as a broad-strokes EQ tool and as its take on a color box, able to give character, glue, or grit, and notes it might be used in place of a dynamic EQ, multiband compressor, saturator, or compressor while falling under none of those categories. The page traces the design back to research questions studied since 2018 (what warmth is in audio, what presence is, and how to bring out and balance overtones present in a sound), followed by two years of critical listening, numerous prototypes and interface testing.
specs: |-
  - Adaptive tone shaping: analyzes signal character and corrects perceived tonal balance dynamically and context-aware
  - Four tone controls that shift the overall tonal balance rather than applying absolute EQ cuts or boosts
  - Squash mode, engaged by increasing the amount control, applying frequency-dependent upward and downward compression
  - Low latency mode for tracking through the plug-in
  - Preset menu with search, categories, favourites filter, user preset editing and a pinnable user default
  - Quality mode and Squash Cal can be locked when changing presets
  - A/B state and undo history
  - Windows 10 - 11, 64-bit, no ARM support
  - Windows formats: 64-bit VST3 and AAX (Pro Tools 2018.1 and up)
  - Mac OS X 10.14 (Mojave) - macOS 26 (Tahoe)
  - macOS formats: 64-bit VST3, AU and AAX (Pro Tools 2018.1 and up)
  - Apple Silicon Macs supported, Intel support up to macOS 15 (Sequoia)
  - iLok account and iLok License Manager installation required, iLok dongle is not required
  - Online access required for the initial activation of the product and trial
  - One license allows activation on 3 machines, valid for both Windows and macOS
  - Fully featured 20-day trial
