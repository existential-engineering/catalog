description: "An adaptive tone shaper that analyzes the character of a signal
  and applies dynamic, context-aware corrections to the perceived tonal balance.
  Described as what an EQ should do — controls irregularities in rough sounds,
  increases warmth, clarity, or brightness safely, and transforms tone with
  natural-sounding results."
details: |-
  Control irregularities in rough sounds
  Increase warmth, clarity, or brightness safely
  Transform tone with natural-sounding results
  Low latency mode for tracking
  Four tone control sliders for personalization
  Squash mode for frequency-dependent compression
  Works as starting point or finishing processor
  Broad-strokes EQ with color-box characteristics

  iLok account required. One license activates on 3 machines. Valid for both Windows and macOS. Online activation required.

  20-day fully featured trial
specs: |-
  - mac: OS X 10.14 (Mojave) through macOS 26 (Tahoe). 64-bit only. Apple Silicon supported. Intel support through macOS 15 (Sequoia).
  - windows: Windows 10-11. 64-bit only. No ARM support.
