details: |-
  15E is a member of the "15" family. It features a "sharp and lash sound based
  on crossfaded 4-operatored sync synthesis with subsequent subtractive
  routing". The overall sound spreads from general purpose to acid.

  The letter "e" stands for the enveloping of six core parameters
  simultaneously, this being the main difference of this synth from others of
  the family.

  Designed for any random set of controls to sound good and playable. 3 stereo
  tools (used simultaneously). 2 dedicated operation modes for modwheel.

  Compact gui with tooltips on controls.

  15e by fsynthz is a virtual instrument audio plugin for windows. It functions
  as a VST plugin.
specs: |-
  - Sync modulation
  - 4-operatored sync synthesis
  - Subtractive routing
  - Crossfaded synthesis
  - Enveloping of six core parameters
  - 3 stereo tools
  - 2 dedicated operation modes for modwheel
  - Compact gui with tooltips
