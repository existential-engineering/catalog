description: PSP auralComp is a multi-channel compressor and limiter designed for surround and immersive audio applications. Supports up to 16 channels of compression per input bus and speaker configurations from stereo to 9.1.6. Features four compression types (Opto, FET, VCA, OldTimer), eight individual side chain submixes with advanced filtering, an output brick-wall limiter, and Mid-Side processing for stereo tracks. Designed in partnership with acclaimed immersive audio pioneer Ronald Prent.
details: |-
  Designed in partnership with Ronald Prent and Adam Taborowski. Supports speaker configurations from stereo up to 9.1.6. Licensing requires a free iLok user ID and iLok License Manager; supports activation on up to 3 locations. A 30-day trial is available.
specs: |-
  - Selectable speaker configurations from stereo to 9.1.6
  - Up to 16 channels of compression per input bus
  - Four compression types: Opto, FET, VCA, OldTimer
  - Eight individual side chain submixes with advanced filtering
  - Output brick-wall limiter
  - Mid-Side processing for stereo tracks
  - Advanced channel linking mechanism
  - Formats: AU (macOS only), VST3, AAX
  - Windows: 7-11 (64-bit)
  - macOS: 10.14-15 (Intel and Apple Silicon)
  - Requires free iLok user ID and iLok License Manager; 3 activations
