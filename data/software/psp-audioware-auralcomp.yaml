description: PSP auralComp is a multi-channel compressor and limiter designed for surround and immersive audio applications. Supports up to 16 channels of compression per input bus and speaker configurations from stereo to 9.1.6. Features four compression types (Opto, FET, VCA, OldTimer), eight individual side chain submixes with advanced filtering, an output brick-wall limiter, and Mid-Side processing for stereo tracks. Designed in partnership with acclaimed immersive audio pioneer Ronald Prent.
details: |-
  PSP auralComp is a multi-channel compressor and limiter designed from the ground up to be powerful, simple, and flexible for all kinds of surround and immersive audio applications. PSP auralComp v. 2.0.0 introduces four compression types, Opto (default), FET, VCA, and OldTimer, so users can choose the compression style that best suits the material.

  Powerful: PSP auralComp is the first in a series of plug-ins created in partnership with acclaimed immersive audio pioneer Ronald Prent, whose credits include Depeche Mode, Helloween, Manowar, Iron Maiden, Rammstein, Def Leppard, Richie Hawtin, Celine Dion, Simple Minds, and many others. Ronald has extensive experience designing and tuning analog multi-channel dynamics processors and mixing/mastering consoles, and he has brought this expertise to the development of PSP auralComp.

  Simple: PSP auralComp provides up to 16 channels of compression per multi-channel input bus, each with intuitive controls and clear metering. Channels can be easily grouped, allowing multiple channels to be adjusted simultaneously with minimal effort.

  Flexible: With a wide range of Quick Select configurations, PSP auralComp supports immersive formats from 5.1 up to 9.1.6 with a single click. PSP auralComp also offers Mid-Side processing for stereo tracks and includes an output brick-wall limiter for precise peak control.
specs: |-
  - Selectable speaker configurations, ranging from stereo to M-S to 9.1.6
  - Eight individual side chain submixes with advanced side chain filtering
  - 4 compression types: Opto, FET, VCA, OldTimer
  - Output brick wall limiter
  - Compact yet straightforward graphical user interface
  - Advanced linking mechanism
  - Up to 16 channels of compression per multi-channel input bus
  - Channel grouping for adjusting multiple channels simultaneously
  - Mid-Side processing for stereo tracks
  - Windows 7 - Windows 11 (VST3, AAX)
  - macOS X 10.14 Mojave - macOS Tahoe (macOS 26), Intel or Silicon (AudioUnit, VST3, AAX)
  - AAX runs in Pro Tools
  - VST3 and AudioUnit run in all compatible DAWs
  - Requires a free iLok user ID and the iLok License Manager application, no hardware dongle needed
  - License can be activated in 3 separate locations, each a computer or an iLok dongle (2nd generation or above)
