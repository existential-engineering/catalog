description: A family of automatic loudness controllers for live and offline use.
details: >-
  Jelstudio's al (auto loudness) is a family of automatic loudness controllers
  for live and offline use. The al plugins will automatically and continuously
  adjust volume-gain to maintain a similar overall perceived-loudness of the
  audio going through it.


  It can be used in a live VST-host (for example with live stage-performance
  audio, or with music/tv home-stereo audio), but it can also be used in daws
  and sound/video-editors on windows to render/export soundtracks (podcasts,
  dj-mixes, tv-show soundtracks, etc) with an even loudness across the entire
  program.


  A few ideas of what al can be used for: to balance dialog and sound-effects
  when watching movies, to avoid loud commercials when watching tv-shows, to
  balance loudness between songs when listening to music, to set loudness on
  individual tracks in a mixing-session. It can be used on live broadcasts, or
  for post-processing.


  Zero latency (for live use or for tracking). Inspired by "recommendation itu-r
  bs.1864-0" and "recommendation itu-r bs.1770-4". Gui layout is optimized for
  'peripheral vision overview' (when looking at the center of the gui; all
  important displays can be read at a glance with peripheral vision).


  User can choose between several dynamic-range settings (how wide or narrow it
  should be).
specs: |-
  - 32/64-bit vst2 audio-effect plugin
  - Zero latency
  - Mono and stereo signal support
  - Dynamic-range settings
  - Automatic loudness control
  - Real-time processing
  - Offline rendering capability
