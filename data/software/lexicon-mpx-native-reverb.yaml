description: The legendary Lexicon sound delivered through a single polymorphic
  plug-in featuring seven reverb types and over 100 studio presets.
details: |-
  MPX Native Reverb delivers the legendary Lexicon sound through a single polymorphic plug-in. It offers seven reverb types — Small Plate, Large Plate, Small Hall, Large Hall, Small Chamber, Large Chamber, and Room — along with more than 100 finely-crafted studio presets, including exclusive artist presets.

  The plug-in features a streamlined single-screen interface with real-time spectral visualization, frequency response display, and input/output meters. A DAW-independent preset format allows presets to be transferred across different host applications.

  The current version is Apple Silicon native, runs on macOS 10.14 (Mojave) through the latest macOS, and on Windows 10 and 11 (64-bit only). Plug-in formats supported are AAX, VST, VST3, and Audio Unit (AU). Legacy versions also supported RTAS.

  Authorization uses iLok Manager (local machine or USB iLok) and supports dual simultaneous activation.
specs: |-
  - Seven reverb types: Small Plate, Large Plate, Small Hall, Large Hall, Small Chamber, Large Chamber, Room
  - Over 100 studio presets including exclusive artist presets
  - Real-time spectral visualization with frequency response display
  - Input/output meters
  - Streamlined single-screen interface
  - DAW-independent preset format for cross-DAW transfer
  - Apple Silicon native
  - iLok Manager authorization (local or USB iLok)
  - Dual simultaneous activation
