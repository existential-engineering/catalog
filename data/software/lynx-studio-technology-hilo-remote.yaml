details: |-
  Hilo Remote is a free Windows and Mac application from Lynx that allows extensive control, monitoring and visual reference when using the Lynx Hilo Reference AD/DA Converter System. Hilo Remote on the iPad can operate in "wired" mode to a Hilo USB using the appropriate Apple Camera Kit, or by WiFi to a Hilo USB or Hilo Thunderbolt connected to a computer using LynxRedirector, a free application available from Lynx.

  Hilo Remote is divided into two main pages, the "Monitor" page and the "RTA" page. The Monitor page extends the Hilo's already impressive everything-to-everything routing and extensive metering capabilities to include independent level control for every channel and full panning for each input to output channel. Channel pairs may be linked together to have both the left and the right channels work together, or unlinked to allow independent control over each mono channel. As with Hilo itself, the Headphone output and the ADAT input only show up on the monitor page when the device is actually connected to the Hilo.

  On the left side of the Monitor page, the "Adapter" panel shows Sample Clock information including clock source, current sample rate, and SynchroLock status. Line In and Line Out trim settings can be monitored and changed, as well as selection of Digital In Source, Digital Out Mode and enabling Sample Rate Conversion. The Adapter panel may be hidden any time. The LSlot section allows easy routing, monitoring and metering for up to 16 channels of USB or Thunderbolt I/O.
specs: |-
  - Free Windows and Mac application for the Lynx Hilo Reference AD/DA Converter System
  - iPad version operates in wired mode to a Hilo USB using the appropriate Apple Camera Kit
  - iPad version can also connect by WiFi to a Hilo USB or Hilo Thunderbolt through LynxRedirector, a free Lynx application
  - Two main pages: Monitor and RTA
  - Monitor page adds independent level control for every channel and full panning for each input to output channel
  - Channel pairs may be linked for stereo operation or unlinked for independent mono control
  - Headphone output and ADAT input appear on the Monitor page only when the device is connected to the Hilo
  - Adapter panel shows clock source, current sample rate and SynchroLock status
  - Line In and Line Out trim, Digital In Source, Digital Out Mode and Sample Rate Conversion can be monitored and changed from the Adapter panel
  - LSlot section provides routing, monitoring and metering for up to 16 channels of USB or Thunderbolt I/O
