details: |-
  Amplion free is a great tool for re-amping, recording, practicing, composing,
  and playing live shows. Its advanced track player lets you play along with
  your favorite artists and learn their songs. Or practice with an intelligent
  metronome.

  Speed control allows you to slow down, if you can't make it, or even speed up
  when you get better. The standalone application is available on the mac app
  store.

  Amplion free functions as a VST plugin, an audio units plugin, a VST 3 plugin,
  an AAX plugin and a standalone application for macos and windows.
