description: HoRNet Valvola is an emulation of the electric behaviour of a vacuum tube and its surrounding circuit. It comes with many vacuum tube models.
details: |-
  HoRNet Valvola (the Italian word for "vacuum tube") is a plugin designed to emulate the electric behavior of a vacuum tube and its surrounding circuitry. This plugin offers a unique opportunity to add the warmth, character, and rich distortion that only tube-driven circuits can provide. Whether you are working on a guitar, vocal, or drum track, the HoRNet Valvola will infuse your audio with the organic richness that comes with classic tube circuitry.

  At its core, HoRNet Valvola offers an authentic emulation of the vacuum tube's behavior. The technology behind the plugin models the circuit characteristics with precision, taking into account the tube itself and the biasing circuit that surrounds it. This approach allows Valvola to replicate the behavior of the real thing, offering you a level of detail that is hard to find in other tube emulations. It includes a variety of tube emulations, such as triodes and pentodes, and a selection of iconic tubes like the 12AX7 commonly used in preamplifiers, as well as the EL84 power tube.

  The hallmark of tube distortion is its dynamic nature. Unlike digital distortion, which is often harsh and static, tube distortion responds to the input signal in a way that's nuanced and musical. This effect, known as the "memory effect", occurs because tubes can adjust their bias point when processing higher levels, particularly from sources like bass drums, bass synths, or electric guitars. Vacuum tubes also have a unique, nonlinear frequency response, which HoRNet Valvola captures so that each tube sounds unique and lifelike.

  Despite the technical complexity of simulating vacuum tube behavior, HoRNet Valvola is designed to be user-friendly. The plugin's primary control is the "saturation" knob, which lets you easily dial in the amount of tube distortion you want to apply to your audio. The saturation knob keeps the output level constant, so you can add tube saturation without inadvertently boosting the overall gain. Valvola also includes intelligent oversampling, offering up to 4x oversampling, so aliasing is minimized.

  The plugin uses a hardware-accelerated graphical interface that ensures smooth performance, even when running in complex projects with multiple instances of the plugin. The interface is fully resizable and the vector-based design ensures that it looks crisp and clear on all screen sizes. Valvola also allows you to save and load custom presets, and it ships with no copy protection.
specs: |-
  - Tube circuit emulation using electrical simulation
  - Seven different tube types including triodes and pentodes
  - Intelligent oversampling up to 4x
  - Hardware-accelerated, fully resizable vector-based interface
  - Custom preset load and save
  - No copy protection
  - macOS (10.11 and later) and Windows (Vista and later) support
  - 64-bit only on both Mac and Windows
  - Audio Units, VST 2.4, VST3 and AAX format
  - Apple Silicon native support (except for AAX)
