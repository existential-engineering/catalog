description: HoRNet Valvola -is an emulation of the electric behaviour of a vacuum tube and its surrounding circuit. It comes with many vacuum tube models
details: |-
  HoRNet Valvola, the Italian word for vacuum tube, emulates the electric behaviour of a vacuum tube and its surrounding circuitry, adding the warmth, character and rich distortion that tube-driven circuits provide to guitar, vocal or drum tracks.

  The technology models the circuit characteristics with precision, accounting for both the tube itself and the biasing circuit around it. The plugin simulates the dynamic properties of vacuum tubes, so the effect is not static but alters the sound according to the intensity of the audio passing through it.

  Valvola is not limited to one type of tube. It includes triodes and pentodes, with iconic tubes such as the 12AX7 commonly used in preamplifiers and the EL84 power tube, each captured with its own characteristic sound and non-linear frequency response.

  The plugin models the memory effect, where a tube adjusts its bias point when processing higher levels from sources such as bass drums, bass synths or electric guitars, so the more the signal is driven the more pronounced the distortion becomes. The primary control is a single saturation knob that keeps output level constant, so tube saturation can be added without boosting the overall gain. Intelligent oversampling up to 4x minimises aliasing.

  The hardware-accelerated interface is fully resizable with a vector-based design that stays crisp at any screen size, and custom presets can be saved and loaded.
specs: |-
  - Tube circuit emulation using electrical simulation
  - Seven different tube types including triodes and pentodes
  - Intelligent oversampling up to 4x
  - Single saturation knob with constant output level
  - Resizable, hardware-accelerated, vector-based interface
  - Load and save buttons for custom presets
  - macOS (10.11 and later) and Windows (Vista and later) support
  - 64-bit only on both Mac and Windows
  - Audio Units, VST2.4, VST3 and AAX format
  - Apple Silicon native support (except for AAX)
  - No copy protection
