description: Hybrid virtual synthesizer inspired by the legendary British OSCar
  hardware synth, featuring dual oscillators with wavetable editor, dual filter
  system, and over 1,800 patches.
details: |-
  At the heart of GForce's impOSCar3 lies the design of the legendary British hardware synth OSCar. Like the original, its hybrid architecture combines the precision of digital oscillators with the warmth of analogue filters, providing a wide range of sonic possibilities. Craft expansive, lush, dark or ambient pads, resonant bells, and precise leads with this exceptional recreation. The finely tuned filter, aligned with the new wavetable editor, blends the best digital clarity with an unparalleled analogue richness. If that's not enough, switch to poly-unison for a true wall of sound.

  The one-of-a-kind dual filter resides at the core of impOSCar3 providing its remarkable character and quality. Multiple configurations of LP, HP, BP in 2-pole or 4-pole along with various parallel configurations open the path to formant-like textures, phasing, and resonance effects that enhance tonal control and widen sonic possibilities. The brand new wavetable oscillator (containing over 150 presets) along with the new user LFO open huge tonal and modulation power. Design and save your own custom wavetables or draw the partials in, additive style. Wavetable switching offers a simple yet effective way to explore new tones within a selected patch while retaining the core characteristics of the original sound.

  impOSCar3's oscillators have been augmented with fully editable 256-step wavetables, drawn as shapes or edited as partials. We've added 450+ new factory patches and our powerful browser to allow easy navigation through the vast array of included patches, over 1800 in total. Additionally, 4 new macros, a new reverb, an improved layout, a user designable LFO editor, aftertouch control, undo and redo, a fully scalable UI and more. Finally, we've simplified the operation of the instrument whilst keeping all its depths and compatibility with legacy impOSCar2 patches.

  The instrument that inspired impOSCar3 was designed in the UK in the early 1980s. It was renowned for its pioneering integration of digital and analogue technologies in a synthesiser. Uniquely equipped with digital oscillators, it could generate standard analogue waveforms and up to 24 distinctive user-defined digital waveforms, offering an exceptionally broad sound palette. Additionally, it featured a dual filter, both high-pass and low-pass, that could operate simultaneously for intricate sound sculpting. Its iconic yellow membrane panel set it apart visually and underscored its distinctive design. Only 2,000 units were made.

  impOSCar3 provides a rich trove of inspiration and a deep and unique sound design playground. For patch design, we invited a range of professional sound designers and artists to explore the vast sonic possibilities of impOSCar3. Together they have contributed 450+ new patches to complement the existing 1350+ legacy patches, some of which were designed by legends such as Billy Currie (Ultravox), Darren Price and Rick Smith (Underworld), as well as Paul Wiffen (the original OSCar sound designer and programmer for Stevie Wonder and Jean Michel Jarre).
specs: |-
  - Formats (Mac): Standalone, AU, AAX, VST2, VST3 (Intel & Apple Silicon native)
  - Formats (Windows): Standalone, VST2, VST3, AAX
  - Mac: macOS 10.15 or later
  - Windows: Windows 7 or later, 2 GHz CPU, 2 GB RAM
  - Oscillators: Dual with wavetable editor (up to 256 waveforms, 150+ wavetable presets)
  - Filter modes: 9 (LP, HP, BP in 2-pole and 4-pole configurations)
  - Patches: 1,800+ (including 450+ new)
  - LFO editor: 25+ presets
  - Voice modes: Poly, Mono, Unison with stereo spread
  - Effects: Ring modulator, chorus, delay, matrix reverb
  - Chord mode, arpeggiator, velocity and aftertouch support
  - Fully scalable UI
  - Backward compatible with impOSCar2 patches
