description: Hybrid virtual synthesizer inspired by the legendary British OSCar hardware synth, featuring dual oscillators with wavetable editor, dual filter system, and over 1,800 patches.
details: |-
  impOSCar3 is a hybrid virtual synthesizer inspired by the legendary British OSCar hardware synth from the early 1980s. It combines digital oscillators with the warmth of analogue filters for expansive sound design capabilities.

  The instrument features a dual oscillator architecture with a wavetable editor supporting up to 256 custom waveforms and over 150 presets. A dual filter system offers 9 filter modes including low-pass, high-pass, and band-pass configurations in both 2-pole and 4-pole variants.

  impOSCar3 ships with over 1,800 patches including 450 new patches created by professional sound designers, and maintains full compatibility with legacy impOSCar2 patches. Registered impOSCar2 owners receive an automatic upgrade discount.
specs: |-
  - Formats (Mac): Standalone, AU, AAX, VST2, VST3 (Intel & Apple Silicon native)
  - Formats (Windows): Standalone, VST2, VST3, AAX
  - Mac: macOS 10.15 or later
  - Windows: Windows 7 or later, 2 GHz CPU, 2 GB RAM
  - Oscillators: Dual with wavetable editor (up to 256 waveforms, 150+ wavetable presets)
  - Filter modes: 9 (LP, HP, BP in 2-pole and 4-pole configurations)
  - Patches: 1,800+ (including 450+ new)
  - LFO editor: 25+ presets
  - Voice modes: Poly, Mono, Unison with stereo spread
  - Effects: Ring modulator, chorus, delay, matrix reverb
  - Chord mode, arpeggiator, velocity and aftertouch support
  - Fully scalable UI
  - Backward compatible with impOSCar2 patches
