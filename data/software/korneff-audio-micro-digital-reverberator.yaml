description: The Micro Digital Reverberator is a fast and easy to use digital
  reverb and multi-effects unit that has great sounds courtesy of the late '80s
  and early '90s. You've heard these sounds on your favorite records.
details: |-
  Nerdy. Easy. Super Cool. The Micro Digital Reverberator combines killer reverb and delay effects with a super friendly user interface and controls. Pop it on an insert, pick a preset, and go. Drums? Vocals? Synths? Guitars? This little plugin has you covered.

  The MDR has the sounds of the first generations of budget reverbs that took over project studios in the late 1980s. In a few years, these units were commonplace in major recording studios and all over many of your favorite records.

  Don't let the simple interface fool you: this thing sounds amazing, with tight small rooms, huge plates and halls, gates and reverse reverbs, and some effects that can only be found on the MDR.

  Machine 1 is a simulation of a very popular 16 bit, 1/3 rack size digital reverberator that was introduced in 1986. Although it has a limited amount of sounds, they are carefully designed and sound great. You still see this unit in guitar racks and studios all over the world. Machine 2 is a simulation of the second-generation, full-rack size digital reverberator. This unit has lots of presets, lots of useful sounds, and some one-off special effects which can only be found on this particular unit.

  Nerdy on the Back Side. The Micro Digital Reverberator has a few tweaks on the other side that let you craft frequency response, oversampling and GUI performance. There's also a super effective stereo widener tucked in back there, for those times you want the effect all around the music and the listener.
specs: |-
  - Two machines: a simulation of a 16 bit, 1/3 rack size digital reverberator from 1986, and of a second-generation full-rack size unit
  - Small rooms, plates, halls, gated and reverse reverbs, plus effects unique to the MDR
  - Reverb and delay effects with a preset-driven interface
  - Rear panel controls for frequency response, oversampling and GUI performance
  - Built-in stereo widener on the rear panel
  - Intel, AMD or Apple Silicon i5 quad core processor
  - 4GB of RAM
  - Mac OSX 10.14 or higher
  - Windows 7 & Above
  - Screen res: 1024 x 768 or higher
  - Mac 64bit: VST3, AU, AAX
  - Windows 64bit: VST3, AAX
  - Software-based licensing, no USB or hardware dongles
  - Activation on up to four machines at the same time
  - Internet connection required for activation and for all demos
