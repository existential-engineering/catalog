description: A fast and easy-to-use digital reverb and multi-effects unit featuring authentic sounds from the late 1980s and early 1990s. Includes two distinct reverberator simulations and combines killer reverb and delay effects with a super friendly user interface. Features adjustable frequency response, oversampling, and stereo widening capabilities.
details: |-
  The Micro Digital Reverberator combines killer reverb and delay effects with a super friendly user interface and controls. Pop it on an insert, pick a preset, and go. Drums, vocals, synths or guitars, this little plugin has you covered.

  The MDR has the sounds of the first generations of budget reverbs that took over project studios in the late 1980s. In a few years those units were commonplace in major recording studios and all over many of your favorite records.

  Don't let the simple interface fool you: it sounds amazing, with tight small rooms, huge plates and halls, gates and reverse reverbs, and some effects that can only be found on the MDR.

  Machine 1 is a simulation of a very popular 16 bit, 1/3 rack size digital reverberator introduced in 1986. Although it has a limited amount of sounds, they are carefully designed and sound great, and you still see this unit in guitar racks and studios all over the world. Machine 2 is a simulation of the second-generation, full-rack size digital reverberator, with lots of presets, lots of useful sounds, and some one-off special effects which can only be found on that particular unit.

  The back side of the plug-in holds a few tweaks that let you craft frequency response, oversampling and GUI performance, plus a very effective stereo widener for those times you want the effect all around the music and the listener.
specs: |-
  - Two modelled machines: a 16 bit 1/3 rack unit from 1986 and a second-generation full-rack unit
  - Small rooms, plates, halls, gated and reverse reverbs
  - Delay effects
  - Preset based workflow
  - Rear panel with frequency response, oversampling and GUI performance tweaks
  - Built-in stereo widener
  - Software-based licensing, no USB or hardware dongle and no special drivers
  - Activation on up to four machines at the same time
  - Minimum: Intel, AMD or Apple Silicon i5 quad core processor
  - Minimum: 4GB of RAM
  - Minimum: macOS 10.14 or higher, Windows 7 and above
  - Minimum screen resolution: 1024 x 768
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
  - Internet connection required for activation and for demos
