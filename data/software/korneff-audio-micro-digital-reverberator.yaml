description: A fast and easy-to-use digital reverb and multi-effects unit featuring authentic sounds from the late 1980s and early 1990s. Includes two distinct reverberator simulations and combines killer reverb and delay effects with a super friendly user interface. Features adjustable frequency response, oversampling, and stereo widening capabilities.
details: |-
  The Micro Digital Reverberator (MDR) is a fast and easy-to-use digital reverb and multi-effects unit that captures the unique sounds of late '80s and early '90s hardware units. It simulates two distinct reverb machines: a 1986 16-bit unit and a second-generation full-rack simulation.

  The MDR offers a wide range of reverb types including tight small rooms, huge plates and halls, gates, and reverse reverbs. Its preset-based workflow is designed for rapid integration into music production environments without sacrificing sonic character.

  Beyond reverb, the MDR includes a stereo widener effect and rear-panel adjustments for frequency response shaping, oversampling quality, and GUI performance tuning. These controls allow users to tailor both the sonic output and system resource usage.

  The plugin uses software-based activation with no USB dongles required, supporting up to 4 simultaneous machine activations. An internet connection is required for activation and running demos.

  Version 1.1.0 supports Mac 64-bit (VST3, AU, AAX) and Windows 64-bit (VST3, AAX), and is compatible with major DAWs including Pro Tools, Logic Pro, Cubase, Studio One, Reaper, Ableton Live, FL Studio, Bitwig Studio, and GarageBand.
specs: |-
  - Two reverb machine simulations: 1986 16-bit unit and second-generation full-rack unit
  - Reverb types: rooms, plates, halls, gates, reverse reverbs
