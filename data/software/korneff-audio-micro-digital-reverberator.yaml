description: "A digital reverb and multi-effects plug-in modelled on late-1980s and early-1990s budget reverb units. Includes two distinct reverberator simulations, with adjustable frequency response, oversampling and stereo widening."
details: |-
  The Micro Digital Reverberator provides reverb and delay effects from a preset-based interface: insert the plug-in, select a preset and adjust. It is intended for drums, vocals, synths and guitars.

  The MDR models the first generations of budget reverb units that appeared in project studios in the late 1980s and were subsequently adopted in commercial studios.

  Programs cover small rooms, plates and halls, gated and reverse reverbs, and effects specific to the modelled units.

  Machine 1 is a simulation of a 16 bit, 1/3 rack size digital reverberator introduced in 1986, with a limited program set. Machine 2 is a simulation of the second-generation, full-rack size digital reverberator, with a larger preset set and special effects specific to that unit.

  The back panel holds controls for frequency response, oversampling and GUI performance, plus a stereo widener.
specs: |-
  - Two modelled machines: a 16 bit 1/3 rack unit from 1986 and a second-generation full-rack unit
  - Small rooms, plates, halls, gated and reverse reverbs
  - Delay effects
  - Preset based workflow
  - Rear panel with frequency response, oversampling and GUI performance tweaks
  - Built-in stereo widener
  - Software-based licensing, no USB or hardware dongle and no special drivers
  - Activation on up to four machines at the same time
  - Minimum: Intel, AMD or Apple Silicon i5 quad core processor
  - Minimum: 4GB of RAM
  - Minimum: macOS 10.14 or higher, Windows 7 and above
  - Minimum screen resolution: 1024 x 768
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
  - Internet connection required for activation and for demos
