description: High Quality Bit Crusher
details: |-
  Decimort recreates the coloration and adds the vintage sampler's magic to any sound. Electronic music (especially Hip-Hop) producers have long been aware that classic samplers (such as early Akai and E-MU units) had a character and sound all their own: they added a "grit" and "color" to the samples and loops they played back which made them sound "fat" and sit well in a mix. This sound coloration was due to the encoding techniques, lower sample rate and bit depth, and conversion circuits used by these early samplers. Decimort recreates this coloration and adds that vintage sampler magic back to any loop, any bassline, or any sound played through it for that matter. Beyond vintage sampler emulation, it's also the perfect bit-crusher with filter, capable of extreme settings for dramatic results.

  The advanced signal processing algorithms within Decimort simulate the complex behavior of the entire (re-)sampling path that exists in every AD/DA converter, and with version 2 comes far greater control over the process. Decimort has zero internal aliasing, in fact, the only aliasing present is the emulated aliasing of the classic samplers it models. Unwelcome artefacts are completely absent in the processed signal: only the desirable, modeled ones remain.

  Far more than just a bit-crusher, it includes an approximative anti-alias filter and image filter, adjustable jitter and dithering, and two alternative quantization algorithms (mid-riser and mid-tread, each with a drastically different dynamics response) for total control over the process. A multimode filter works in pre or post, along with the resampler module, to allow further sculpting of the signal.
specs: |-
  - Approximation filter: steep low-pass pre filter coupled with the resampling frequency, removing harmonic content above it to prevent aliasing
  - Images filter: post-resampling filter synchronized with the resampler, controls amount of aliasing images appearing above resampling frequency
  - Adjustable jitter: introduces short-period random fluctuations to the resampling frequency for added harmonic distortion
  - Two quantization methods: mid-riser and mid-tread decimation algorithms
  - Multimode filter, pre or post resampler
