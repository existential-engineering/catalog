description: Arpado is designed to add pure music theory to performances and
  help a user create melodies and rhythms with just a few steps, while setting
  them free to focus on other areas of their production process. It can
  orchestrate many instruments at once from a single interface.
details: |-
  Arpado is designed to add pure music theory to performances and help a user
  create melodies and rhythms with just a few steps, while setting them free to
  focus on other areas of their production process. It can orchestrate many
  instruments at once from a single interface. It features a gate step, with an
  array of chords and scales that can be used with its original progressive
  sequencer. It also adds advanced sequencing capabilities to any software or
  hardware synthesizers; it can work as a central MIDI controller device or be
  used as a MIDI looper with a generative approach.

  Control many instruments and accompaniments from a single keyboard. Device
  chain. Apply conditional barriers to input and output notes. Forward input to
  other instruments. Humanize the velocity levels. Latch mode. Randomize your
  arpeggios. Use a different time signature on each accompaniment. Transpose
  octaves in simple or scattered modes. Plenty of chords and scales to choose
  from.

  Full harmony for all your gear. Record your live performance, export it to
  MIDI and play with your favorite DAW or sequencer.

  Progressive rhythms, melodies and arpeggios. Build melodies and loops that
  change over the cycles. Add progressions (I, ii, iii, iv, etc) and feel the
  harmonies scale. An infinite set of combinations at your disposal.
