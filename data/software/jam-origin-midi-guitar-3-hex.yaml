description: For guitarists who use hexaphonic pickup systems, MIDI Guitar 3 Hex offers performance that is fast, responsive, accurate, dynamic and expressive. It is also a powerful, versatile, modular guitar-effect-designer and a live performance host.
details: |-
  For guitarists who use hexaphonic pickup systems, MIDI Guitar 3 Hex offers performance that is fast, responsive, accurate, dynamic and expressive.

  MIDI Guitar 3 Hex is also a powerful, versatile, modular guitar-effect-designer, and a live performance host. It brings together your third-party plug-in collection of virtual instruments and audio effects (as well as MIDI controllers), in a single package that is easy to use in the studio or on the stage.

  Hardware hex systems are not new but the technology hasn't undergone much development for decades. MIDI Guitar 3 Hex steps in with state-of-the-art audio tracking models and recent advances in machine-learning to address these systems' weaknesses. Call it a software upgrade for your hardware. MIDI Guitar 3 Hex takes over the heavy lifting from the hardware, which is only needed to send the six channels of audio (one channel per string) from the hex pickup to the software.

  As a musician, you want your mind on the music and not the technology that's making it. MIDI Guitar 3 Hex keeps hex simple, unlike most hardware systems that have a variety of hidden parameters that require tweaking and attention. In contrast MIDI Guitar 3 Hex just works without overly complex settings while giving direct visual feedback on realtime performance.

  MIDI Guitar 3 Hex recognizes notes faster and more accurately than the standard version of MIDI Guitar 3 can due to its ability to process each string's signal independently. It is under active development with free lifetime updates, unlike many hardware offerings which rarely get firmware updates and are stuck with their built-in CPU.
specs: |-
  - Requires a hexaphonic pickup/hardware system to function
  - Processes each string's signal independently for faster, more accurate note recognition than standard MIDI Guitar 3
  - Per-string audio effects processing
  - Modular guitar-effect-designer and live performance host for third-party virtual instruments, audio effects and MIDI controllers
  - All Jam Origin plugins integrate with one another as native modules and extensions
  - Free lifetime updates with a lifetime license
