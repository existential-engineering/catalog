description: Loop Engine 3 is a multi-voice MIDI generation plugin that produces chord progressions, riffs, arpeggios, melodies and polyrhythmic sequences from chord shapes and harmonic rules through a circular interface. It adds a three-way view switch, micro-timing offsets, undo and automatic auxiliary passing notes.
details: |-
  Loop Engine 3 is a MIDI generation tool from W. A. Production and Liminal Sphere that generates note progressions based on chord shapes and harmonic rules. Its circular interface produces sequences that can be played inside the plugin or dragged into a DAW, covering chord progressions, riffs, shuffling arpeggios, melodies and polyrhythmic sequences.

  Direct View switches between three views: Chord, Loop and Voice. Chords can be chosen or generated across a range of inversions, lengths, speeds and keys, with granular control over individual chord shapes, inversions and velocity. 21 chord Functions combine with Type and Tension styles in Advanced Mode, and the overhauled Voice View adds micro-timing adjustment, note splitting and extension beyond chord shapes, auxiliary passing notes and an undo option.

  The Note Editor offers precise note placement, a scrollable piano roll and partition-free note length modification. Temporal Offset and Shift fine-tune the micro-timing of notes, and the optimized Poly function builds polyrhythmic patterns whose note-playing segments weave together in syncopation, audible in real time as the polyrhythmic timing is moved around the interface circle.

  MIDI routing runs through a separate Loop Engine Listener plugin loaded onto instrument tracks in the DAW. Loop Engine 3 outputs up to 8 independent colour-coded voices that route to the Listener and can be swapped between tracks in a couple of clicks, and specific voices can be set to receive the auxiliary passing notes.

  Patterns drag and drop from the plugin into a DAW as MIDI for editing, transposing and further tweaking. An updated suite of categorized presets covers chords, riffs and arpeggios, managed through a preset manager with user tagging, and user creations can be saved for later recall. The interface is resizable and ships with a PDF manual and a tutorial video.
specs: |-
  - Multi-voice MIDI generator with complex options
  - Direct View switching between Chord, Loop and Voice views
  - Routes up to 8 colour-coded voices from a single instance
  - Loop Engine Listener plugin for routing voices to multiple tracks
  - 21 chord Functions with Type and Tension styles
  - Partition-free note length modification
  - Note Editor with scrollable piano roll and undo
  - Temporal Offset and Shift for micro-timing
  - Automatic auxiliary passing notes assignable per voice
  - Optimized Poly function for polyrhythmic patterns
  - Creative randomization and intelligent harmonic progressions
  - MIDI export by drag and drop
  - Preset manager with user tagging
  - Resizable interface
  - PDF manual and tutorial video
  - Windows 8 and later (64 bit)
  - macOS 10.13 and later (64 bit)
  - AAX requires Pro Tools 11 or higher
