details: |-
  M-Tron Pro LE is a light edition of GForce Software's acclaimed M-Tron Pro, providing a streamlined Mellotron emulation experience with a curated set of classic tape-based sounds including iconic flute, choir, and string timbres.

  This edition is not available for direct purchase and is distributed exclusively to Audient customers through the Audient ARC platform (audient.com/arc). Registered users receive a 50% discount to upgrade to the full M-Tron Pro.
