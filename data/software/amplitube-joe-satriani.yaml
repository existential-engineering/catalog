details: |-
  For over 30 years, the soaring melodies, amazing soundscapes and soulful technique created by joe satriani have inspired countless musicians and pushed the limits of rock guitar. From his very first solo ep to his work with supergroup chickenfoot, joe somehow keeps one foot in the blues and one in the stars.

  Available in a convenient desktop app and plug-in for your DAW, amplitube joe satriani replicates 3 amps, 3 cabinets, and 5 stompbox effects, all carefully modeled and loaded with presets, all under the supervision of the man himself.

  Ik worked meticulously with joe to capture his go-to gear and favorite settings to get the secrets behind some of his most iconic sounds. From joe's signature marshall amp to his personal stompboxes, this collection includes iconic gear from the '70s, 80's, '90s and beyond.

  Amplitube joe satriani features 11 brand new models including 3 amps, 3 cabinets and 5 stomps. With models based on joe's signature marshall jvm410hjs, a completely re-modeled peavey 5150, a scholz rockman, plus a range of classic pedals from fulltone, boss and more, it's a massive gear collection that's simply not of this earth.

  The 3 amplifiers include: satch vm based on the marshall jvm410hjs offering three modes per channel with independent noise filters and re-biased presence & resonance controls; sj50 based on the peavey 5150, a legendary amp originally a signature model for eddie van halen; boston 100 based on the tom scholz rockman x100 with 4 different amp settings and chorus and echo effects.
