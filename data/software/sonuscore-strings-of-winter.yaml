description: An expansion to THE ORCHESTRA, including 60 articulations performed
  by a 41-piece string orchestra and the unique Mongolian State Morin Khuur
  Ensemble.
details: |-
  Strings Of Winter is Sonuscore's string expansion for THE ORCHESTRA family, written around arctic plains, shimmering glaciers and far-reaching steppes, and aimed at scenes of fragile, cold isolation as much as at icy, unbridled power. It delivers 60 articulations performed by two quite different ensembles, and is included in THE ORCHESTRA COMPLETE 4 as well as working as a stand-alone instrument.

  The first ensemble is the Mongolian State Morin Khuur Ensemble. The morin khuur is Mongolia's national instrument, also called the horse head fiddle, with two strings made of horsehair played with a bow that is also strung with horsehair, which gives it a delicate and airy timbre. Fifteen players were recorded at White Arch Studios in Ulan Bator, split into high and low ensembles. The second is a 41-piece European string orchestra split into 5 sections, recorded in the classic room of Studio 22 in Budapest with all sections in their traditional seating positions, performing detailed and extended techniques. Between them the library carries 60 unique articulations spread over 7 sections, plus 4 instruments of String Ensemble FX.

  The instrument runs the same Ensemble Engine as THE ORCHESTRA, built on independent arpeggiators and velocity envelopes and inspired by the Sonuscore Origins series. Rhythms and full arrangements are generated from any chord or note played rather than from pre-recorded phrases, and a large preset set provides ensemble colours out of the box with short loading times. Up to 5 instruments load into independent slots and play together, each slot assignable to one of five modules. On the Engine page the arpeggiators shape short notes through a rhythm stepper while the velocity envelope, whose shape can be drawn freely, adds recurring dynamic movement to sustained notes.

  Aside from the ensemble instrument there are 64 single instrument patches from the separate sections, with full ensemble risers, crescendos, falls and hits as a bonus, for writing from scratch. Ensemble-multi patches load and layer multiple instances of Strings Of Winter for quick sketching, with Orchestral Rhythm and Animated Orchestra multis combining several engine instances into more complex patterns. A performance can be dragged and dropped out of the instrument into a DAW as MIDI. It runs in the free KONTAKT PLAYER.
specs: |-
  - 60 unique articulations spread over 7 sections, plus 4 instruments with String Ensemble FX
  - 41-piece European string orchestra split into 5 sections, recorded in the classic room of Studio 22 in Budapest in traditional seating positions
  - Mongolian State Morin Khuur Ensemble: 15 players split into high and low ensembles, recorded at White Arch Studios in Ulan Bator
  - 64 single instrument patches from the separate sections, plus bonus full ensemble risers, crescendos, falls and hits
  - 70 ready-to-go ensemble presets
  - 40 multi-rack patches
  - True legato interval sampling
  - Complete set of standard articulations for all instruments
  - Ensemble Engine with independent arpeggiators and freely drawable velocity envelopes
  - Load up to 5 different instruments in independent slots, each slot assignable to 1 of 5 modules
  - Ensemble-multi patches that load and layer multiple instances, including Orchestral Rhythm and Animated Orchestra multis
  - MIDI export by drag and drop of a performance into the DAW
  - 4700+ individual samples
  - 4.74 GB of data (5.65 GB uncompressed)
  - Works with the FREE KONTAKT PLAYER
  - KONTAKT 6.0.4 or higher
  - Mac OS X 10.10 or higher, Intel Core 2 Duo
  - Windows 7 or higher, Intel Core 2 Duo or AMD Athlon 64 X2
  - 4 GB RAM
  - At least 5.7 GB of free hard disc space
