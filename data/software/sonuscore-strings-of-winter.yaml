description: An expansion to THE ORCHESTRA vst, including 60 articulations performed by a 41-piece string orchestra and a unique Morin Khuur ensemble. Captures the spirit of rough, untamed landscapes through orchestral and traditional Mongolian instrumentation.
specs: |-
  - 60 articulations (orchestral strings + Morin Khuur)
  - Breakthrough Ensemble Engine with arpeggiators and velocity envelopes
  - 70 ready-to-go ensemble presets
  - 40 multi-rack patches
  - 4,700+ individual samples
  - 4.74 GB compressed / 5.65 GB uncompressed
  - MIDI export capability
  - True legato interval sampling
  - Mongolian State Morin Khuur Ensemble: 15 players, recorded at White Arch Studios, Ulan Bator
  - European String Orchestra: 41-piece, recorded at Studio 22, Budapest (5 sections)
  - Requires Kontakt Player (free) or Kontakt 6.0.4+
  - Mac: OS X 10.10+, Intel Core 2 Duo, 4 GB RAM
  - Windows: Windows 7+, Intel Core 2 Duo or AMD Athlon 64 X2, 4 GB RAM
  - 5.7 GB free disk space required
