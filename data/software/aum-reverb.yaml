description: AUM Reverb is a reverse-style reverb effect, featuring a unique
  real-time sampling algorithm.
details: |-
  The process generates solid, dynamic results, and the plug-in features many
  tweaks in order to make sure the results fit into your piece both rhythmically
  and sonically.

  Classic sound effects that can be produced include ghostly vocal processing,
  "gated" style reverb on drum hits, and unique ambient effects.

  Create dynamic (pumping) reverb on drum sounds, unique sound effects (e.g.
  Reversed voices, whiplash), and add massive depth and space to synth sounds.

  Includes both input and output stereo filters with modulation for moving
  effects, tempo-synced delay compensation, and threshold triggered-loop mode.
specs: |-
  - Real-time reverse reverb effect
  - Unique concurrent sampling algorithm
  - Real-time simultaneous sampling and playback
  - Audio reversing
  - Reverb processing
  - Filter processes
  - Input stereo filter
  - Output stereo filter
  - Filter modulation
  - Tempo-synced delay compensation
  - Threshold triggered-loop mode
  - MIDI-learn assignable controls
  - Windows compatible
