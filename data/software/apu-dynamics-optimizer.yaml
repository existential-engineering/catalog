details: >-
  The apu dynamics optimizer offers a unique way to shape the loudness of your
  audio. It starts by performing an up-front analysis of the entire file, which
  allows it to understand the full dynamic landscape before making any changes.


  You're presented with a visual representation of your audio's loudness
  distribution, which you can then reshape to a target distribution—either
  uniform or normal. The powerful part is that you can manipulate the target
  range, distribution shape, and even traditional compressor controls like
  attack and release, all in real-time while playing back the audio.


  This lets you hear the effect of your changes instantly and dial in the exact
  dynamic character you're looking for. It supports a wide range of loudness
  measurement modes, including lufs (momentary, short-term, integrated) as well
  as traditional rms and peak/true peak.


  You can also fine-tune the detector's response with various weighting options.
  When you're happy with the result, you simply export the file to pristine
  float 32-bit wav.


  This is a standalone tool, and for a good reason: it needs to see the whole
  picture to work its magic. It's designed for a deliberate and precise
  workflow, giving you a level of control that's simply not possible with a
  traditional real-time compressor.
