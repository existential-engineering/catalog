name: B-Panner - Ambisonic Panner
manufacturer: digenis
primaryCategory: panner
categories:
  - effect
description: B-Panner - Ambisonic Panner allows you to pan audio signals into up
  to 3rd order ambisonics soundfields.
details: |-
  Features include panning of up to 6 individual audio sources into the same
  soundfield with 4 presets (mono, stereo, quad, 5.1).

  Fully adjustable per-source azimuth, elevation, distance, amplitude, and order
  balance with support for 0th, 1st, 2nd, and 3rd order processing.

  64 bit processing capability for high-quality audio manipulation.
specs: |-
  - Ambisonics panning
  - Up to 3rd order ambisonics
  - Panning of up to 6 individual audio sources
  - 4 presets (mono, stereo, quad, 5.1)
  - Adjustable per-source azimuth
  - Adjustable per-source elevation
  - Adjustable per-source distance
  - Adjustable per-source amplitude
  - Adjustable per-source order balance
  - 0th order
  - 1st order
  - 2nd order
  - 3rd order
  - 64 bit processing
  - macOS
