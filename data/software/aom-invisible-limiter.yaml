description: A.O.M. Invisible Limiter is a transparent look-ahead brickwall limiter with automatic attack/release-time optimization.
details: |-
  A.O.M. Invisible Limiter is a transparent look-ahead brickwall limiter with automatic attack/release-time optimization. The Invisible Limiter's limiting algorithm minimizes the difference between the original and the limited signals. This behavior is appropriate to avoid coloration your material through final limiting stage in mastering. Under ordinal amount of reduction, it is hard to distinguish before and after limitation.

  Final limiting in audio mastering is the place of compromise. You should find the best level of your track, but that is not an easy stuff because making tracks louder often breaks its sound. Using Invisible Limiter, you can make your tracks louder with minimum sound degradation. The limiter works to minimize the difference between original and limited sound.

  It's very hard to avoid the affection caused by sound level. Louder sound often brings better sound impression for listeners, but the same effect leads engineers to a wrong sound judgement. The idea of Unity Gain Monitoring is very simple, putting negative gain on output stage. The amount of negative gain is same as makeup gain. Thus, using Unity Gain Monitoring, the makeup gain is cancelled and engineers can concentrate the sound difference through limiting.

  Non-oversampling peak limiters have a problem on detecting peaks. Non-oversampling (1x) samples and oversampling (8x) samples result a same analog waveform. Non-oversampling (1x) limiters can't detect the true peak in resulting analog waveform. In contrast, oversampling (8x) limiters can detect and process the true peaks.

  Both of Invisible Limiter / Invisible Limiter LL can be unlocked with Invisible Limiter license or Total Bundle license. Invisible Limiter has a plugin latency of 50.5 to 52.2msec, while Invisible Limiter LL (Low Latency) has a plugin latency of 5.5 to 7.2msec.
specs: |-
  - Transparent look-ahead brickwall limiting with automatic attack/release-time optimization
  - Unity Gain Monitoring
  - Oversampling for intersample (true) peak detection
  - Plugin latency 50.5 - 52.2msec (Invisible Limiter) / 5.5 - 7.2msec (Invisible Limiter LL)
  - Supports 44.1k - 384kHz Sample Rate
  - 64-bit Floating-point Internal Precision
  - Latency Compensation
  - Factory Preset
  - User Preset
  - Snapshot
  - Undo/Redo
  - Reset to Default
  - Windows: x64-compatible CPU, Windows 11 24H2 / 25H2
  - Mac: Intel / Apple Silicon, macOS Monterey 12 through macOS Tahoe 26
