description: A transparent look-ahead brickwall limiter with automatic
  attack/release-time optimization designed to minimize differences between
  original and limited signals.
details: |-
  Invisible Limiter is a transparent brickwall limiter designed for mastering
  applications. Its core algorithm automatically optimizes attack and release
  times to minimize the audible difference between the original and limited
  signals.

  The plugin features Unity Gain Monitoring, which applies negative makeup gain
  to prevent loudness-based listening bias during critical evaluation.
  Oversampling support ranges from 1x to 16x for accurate intersample peak
  detection.

  Processing modes include both L/R and M/S configurations, with logarithmic and
  linear shape modes available. Three overshoot handling modes (suppression,
  clipping, and thru) provide flexibility for different mastering scenarios.
  Controls offer 0.01dB step precision for exacting adjustments.

  Two latency modes are available: the standard mode at 50.5-52.2ms for maximum
  transparency, and a Low Latency (LL) mode at 5.5-7.2ms for tracking and
  monitoring applications.
specs: |-
  - Automatic attack/release-time optimization
  - Unity Gain Monitoring for unbiased listening
  - Oversampling up to 16x for intersample peak detection
  - L/R and M/S processing modes
  - Logarithmic and linear shape modes
  - Three overshoot modes: suppression, clipping, thru
  - 0.01dB step control precision
  - Normal mode: 50.5-52.2ms latency
  - Low Latency (LL) mode: 5.5-7.2ms latency
  - Sample rates: 44.1kHz to 384kHz
  - 64-bit floating-point internal precision
