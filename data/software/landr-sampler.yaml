description: Unlock endless inspiration from a smart plugin that taps into your
  sample library to help you discover the perfect sounds for your track.
details: |-
  LANDR Sampler is an intelligent sample library manager and sample-editing instrument. It scans your computer's sample folders and processes what it finds, organizing samples by type, BPM or keyword so you can find new inspiration in the library you already own without tedious labeling and searching.

  Once your library is connected, powerful filtering and organization tools make finding and creating new sounds with your samples easier than ever. Smart sample search combines text search with filters such as Loop Type, Category and Length, and the plugin can generate unique sample combinations instantly so you keep creating rather than digging through folders.

  The plugin plays samples like an instrument across four modes: Normal, Chromatic, Slice and Sequence. You can chop samples, play them chromatically across the keyboard, and add texture with Similar Sound Swap. Samples can be transposed to match your project's key and loops sync to your host tempo.

  An advanced FX engine shapes and transforms sounds with six unique effects, real-time XY-pad control and presets designed for effortless sound manipulation. Processed samples, MIDI or rendered audio can be exported directly from the plugin into your DAW.

  LANDR distinguishes Sampler from the LANDR Samples app: the Samples app is the plugin version of the LANDR Samples marketplace and uses credits to purchase and download samples, while Sampler manages and plays the sample library already stored locally on your machine.
specs: |-
  - Sample library manager and sample-editing instrument plugin
  - Scans local sample folders and organizes samples by type, BPM and keyword
  - Playback modes: Normal, Chromatic, Slice and Sequence
  - Advanced FX engine with six effects, real-time XY-pad control and presets
  - Similar Sound Swap for adding texture
  - Transpose samples to project key, loop sync to host tempo
  - Text search plus Loop Type, Category and Length filters
  - Export processed samples, MIDI or rendered audio to the DAW
  - macOS: macOS X 10.15 or higher, Apple Silicon Native or Intel (VST3, AU, AAX and Standalone)
  - Windows: Windows 10 (64-bit) or higher (VST3, AAX)
