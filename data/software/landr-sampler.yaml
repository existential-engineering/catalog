description: Sample manager and instrument plugin that scans, organizes, and surfaces sounds from your library. Search, organize, and play samples like an instrument with chromatic playback, slicing, and built-in effects.
details: |-
  Smart sample manager and instrument plugin that scans, organizes, and surfaces sounds from your sample library. Smart text search and filters by Loop Type, Category, and Length. Transpose sounds to match project key and sync loops with host tempo.

  Advanced FX engine with six unique effects and real-time XY-pad control and presets. Slicing and chromatic playback modes with Similar Sound Swap. Export processed samples, MIDI, or rendered audio directly to your DAW.

  Requires macOS 10.15+ (Apple Silicon native, Intel) or Windows 10 64-bit+.
