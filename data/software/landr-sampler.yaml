description: "Sample manager and instrument plugin that scans, organizes, and
  surfaces sounds from your library. Search, organize, and play samples like an
  instrument with chromatic playback, slicing, and built-in effects."
details: |-
  Smart sample search and filtering by loop type, category, length, BPM. Chromatic and slice playback modes. Advanced FX engine with six effects and XY-pad control. Similar Sound Swap. Direct export of processed samples, MIDI, and rendered audio. Tempo sync and key transposition. Requires macOS 10.15+ (Apple Silicon native, Intel) or Windows 10 64-bit+.
