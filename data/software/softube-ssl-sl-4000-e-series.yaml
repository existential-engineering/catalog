details: |-
  The Solid State Logic SL 4000 E is one of the most famous and coveted mixing consoles in the world. SL 4000 E consoles have been installed in hundreds of the world's leading studios, and it is said that Solid State Logic's 4000 series has been used on more platinum-selling records than all other console models combined. And for good reason.

  The SL 4000 E has a signature sound that works for all music styles, but still adds a touch of luxury. When things are run through the SL 4000 E, they sound like a record. Period.

  Shape: The SL 4000 E channel gives you a very musical gate/expander for your Console 1 unit. A variable release and a switchable hard/soft style gate allow you to shape your source to fit perfectly into your mix whether you pick a gentler style or an aggressive approach.

  Equalizers: With the SL 4000 E plug-in, you get the famous black knob E242 equalizer from the SL 4000 E channel. George Martin helped develop this EQ circuit. It offered up to 18 dB of cut or boost and tighter control over low frequencies than the early SSL EQs.

  Compressors: You can use the classic channel compressor from the SL 4000 E in your Console 1 Mixing System. This flexible VCA compressor allows you to sweep a ratio to find the perfect sweet spot. The variable attack and release knobs assist you in timing your dynamics with complete control.

  Drive: Softube modeled the unique harmonics, distortion, and non-linearities you get from running the SL 4000 E into overdrive. Controlled by Console 1's Drive knob, you can use it subtly on all channels to glue the mix together like a slightly overdriven SL 4000 E does, or not so subtly to add edge and presence to selected sounds.
specs: |-
  - One of the most-used consoles in record-making history
  - Dedicated filter, EQ, and compressor/gate sections handle most audio tasks
  - Modeled exclusively for Console 1 Mk I, Mk II, and Channel Mk III
  - Shape section: gate/expander with variable release and switchable hard/soft style
  - E242 black knob equalizer with up to 18 dB of cut or boost
  - VCA channel compressor with sweepable ratio and variable attack and release
  - Drive control modeling the console's harmonics, distortion and non-linearities
  - Requires a Console 1 control surface to run
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26; Windows 10 (64-bit), Windows 11
  - Softube account and iLok account required (no physical iLok required)
  - Three activations, 20-day trial, 14-day returns
