description: Two-step mix bus processor combining automatic 31-band EQ with intelligent compression. Get professional cohesion in seconds.
details: |-
  ZeroBus is a two-step mix bus processor that combines two essential processes every professional mix needs, spectral balance and bus compression, into a single intelligent plugin that analyzes your audio and adapts automatically.

  Step one is AutoEQ: continuous automatic equalization across 31 bands that balances the spectrum in real time, with a 0-200% control range. There is no frequency hunting and no endless sweeping, just transparent, musical tonal correction.

  Step two is smart compression. Two compression modes learn the material and automatically adapt threshold, makeup and processing. FAT mode is a parallel 1176-style compression aimed at New York style punch, targeting around 19dB of gain reduction on the compressed path during learn. GLUE mode is a serial SSL 4K-style compression aimed at mix cohesion, targeting around 9dB of peak reduction.

  In use, ZeroBus is loaded on a stereo mix bus, drum bus or any stereo subgroup. The AutoEQ works immediately on playback while the compressor learns the material's dynamics in seconds, after which the EQUALIZATION (0-100%) and COMPRESSION (0-100%) amounts are set to taste against a real-time EQ curve display and a segmented gain reduction meter reading 0 to -20dB.

  The plugin applies automatic 2x oversampling below 88.2kHz sample rates, keeps latency near zero with automatic compensation, and offers an adaptive Light/Dark/Auto interface that follows system preferences.
specs: |-
  - 31-band continuous AutoEQ with real-time spectral analysis and correction
  - AutoEQ control range 0-200%
  - Two compression models: FAT (parallel 1176-style) and GLUE (serial SSL 4K-style)
  - Automatic threshold learning from RMS and peak analysis, with adaptive makeup gain
  - Real-time EQ curve display and segmented gain reduction meter (0 to -20dB)
  - Sample rate support: 44.1kHz to 192kHz
  - Automatic 2x oversampling below 88.2kHz
  - Near-zero latency, automatically compensated
  - Adaptive UI with Light, Dark and Auto themes
  - Windows 10 and later, macOS 10.13 and later, Apple Silicon native
