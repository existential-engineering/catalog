description: Two-step mix bus processor combining automatic 31-band EQ with intelligent compression. Get professional cohesion in seconds.
details: |-
  ZeroBus combines the two processes every professional mix bus needs, spectral balance and bus compression, into a single plugin that analyses the audio and adapts automatically.

  The first step is AutoEQ: continuous automatic equalization across 31 bands that balances the spectrum in real time, with a 0 to 200% control range, transparent musical correction and no frequency hunting.

  The second step is smart compression. Two modes learn the material and automatically adapt threshold, makeup and processing. FAT is parallel 1176-style compression for New York punch, targeting about 19dB of gain reduction on the compressed path during learning, with transients preserved from the dry signal. GLUE is serial SSL 4K-style compression for mix cohesion, targeting about 9dB of peak reduction, smooth and transparent.

  In use, ZeroBus is loaded on a stereo mix bus, drum bus or any stereo subgroup. The AutoEQ works immediately while the compressor learns the material's dynamics in seconds, then the mode is chosen and the EQUALIZATION (0 to 200%) and COMPRESSION (0 to 100%) amounts are set to taste, with a segmented gain reduction meter from 0 to -20dB for feedback.

  Auto oversampling applies 2x below 88.2kHz for clean audio with minimal latency, and the adaptive UI follows light, dark or system themes.
specs: |-
  - 31-band continuous AutoEQ with real-time spectral balancing
  - Equalization control range 0 to 200%
  - Two compression modes: FAT (parallel 1176-style) and GLUE (serial SSL 4K-style)
  - Automatic threshold learning and adaptive makeup gain
  - Compression control range 0 to 100%
  - Real-time EQ curve display and segmented gain reduction meter (0 to -20dB)
  - Sample rate support 44.1kHz to 192kHz
  - Automatic 2x oversampling below 88.2kHz
  - Near-zero, auto-compensated latency
  - Light, dark and auto themes
  - VST3, AU and AAX formats
  - Windows 10+ and macOS 10.13+, Apple Silicon native
