description: Atoms is a next-gen synthesizer plugin (VST/AU/AAX) based on
  advanced physical modeling research. Try it today for evolving organic sound.
details: |-
  Atoms uses cutting edge physical modeling technology to generate an endless variety of organic sounds. Meet a different kind of synth, powered by a simulation of interconnected masses and springs.

  The physical model gets triggered by a virtual bowing action that excites the system to generate sound. Think of it as a futuristic string instrument, made in a science lab, put into a plugin. The sound of Atoms is organic, yet otherworldly.

  Real-world instruments are never static. You can't pluck a string and get an identical sound twice. Atoms shares this behavior naturally. And if subtle is not enough, you can always take the concept further.

  Atoms offers a musically calibrated randomization algorithm that selectively adjusts each parameter based on its relationship to the others. The Recycle button creates new patches similar to the current patch.

  The bottom panel gives you a range of physically modeled creative effects to further sculpt your sound. Atoms ships with 250 factory presets and supports MPE.
specs: |-
  - Physical modeling synthesis engine with interconnected masses and springs
  - Virtual bowing excitation system
  - Musically calibrated randomization algorithm
  - Recycle button for similar patch generation
  - Physically modeled creative effects panel
  - 250 factory presets
  - MPE support
  - Native Apple Silicon M-Chip support
  - 64-bit only
