name: Aspire
manufacturer: antares
primaryCategory: effect
website: https://www.antarestech.com/product/aspire/
description: Aspire is the world's first tool for modifying a voice's
  breathiness independently of its harmonic content.
details: >-
  Aspire is the world's first tool for modifying a voice's breathiness
  independently of its harmonic content. With aspire, you can match a vocal
  quality to a performance style by decreasing or increasing a voice's natural
  breathiness.


  Aspire analyzes a vocal in real time and separates the aspiration noise
  (breathiness) from the harmonic content. It then allows you to adjust the
  amount of aspiration noise, and affect its character independently by applying
  a parametric eq to the noise component.


  It also includes a real-time display that lets you visualize the effect of the
  aspiration noise processing. Whether reducing vocal rasp or adding a bit of
  smokiness, aspire allows modification of the amount and quality of a voice's
  breathiness without affecting the vocal's harmonic characteristics.
specs: |-
  - AAX native (64-bit only)
  - Vst3 (64-bit only)
  - Audio units (64-bit only)
  - Vst2 (64-bit only)
  - Real-time vocal analysis
  - Parametric eq
  - Real-time display
  - Universal 2 binary
