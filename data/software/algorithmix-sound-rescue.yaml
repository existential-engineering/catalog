description: Powerful software for the fast and easy transfer of scratchy and
  noisy vinyl records, shellacs, or cassette tapes to CD/DVD.
details: |-
  Sound Rescue 3.0 is an ideal enhancement for audio editing and CD recording
  software, especially for revitalizing and transferring treasures from tape,
  vinyl or shellac records to CD or DVD.

  Sound Rescue 3.0 was developed particularly for the multi-media user who does
  not want to spend hours learning complicated processing procedures. Both main
  signal processing modules, DeScratcher and DeNoiser, require setting up only
  two parameters for the cleaning process, usually done within seconds during
  real-time playback.

  Additional specialized filters allow removal of DC-offset, hum, buzz, rumble
  and hiss. Bass and treble filters and a unique sound Enhancer add proper tonal
  balance and revitalize old recordings.

  Sound Rescue 3.0 also assists in splitting raw audio material into single
  tracks automatically, with one-click cleaning, normalizing, splitting and CD
  application launching with auto-generated track list.
specs: |-
  - Real-time DeScratcher and DeNoiser modules
  - Only two parameters per module for easy setup
  - DC-offset, hum, buzz, rumble and hiss removal filters
  - Bass and treble filters with Enhance function
  - Automatic track splitting and naming
  - One-click filter, normalize and split workflow
  - Digital RIAA-correction for linear phono preamps
  - Unique difference function for monitoring
  - Up to 80-bit floating-point accuracy
  - Requires Windows 2000/XP/Vista/7
