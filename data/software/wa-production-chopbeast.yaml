  shifting."
details: |-
  Up to 32 chops per instance. Per-slice pitch, reversal, and formant shifting. Declick for seamless transitions. Independent chop preview and full sequence preview. Multiple randomization modes. MIDI audition and DAW export. Global transpose. Resizable interface. CPU-friendly. Sample rate matching.
