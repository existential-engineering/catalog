description: ChopBeast is a loop slicing plugin that chops and rearranges dropped audio into up to 32 slices, with per-slice pitch, formant shifting, reverse and declick controls. Results can be auditioned or triggered over MIDI and exported to the host.
details: |-
  ChopBeast is a loop slicer aimed at making order out of chaos, in a tradition of chopped audio that runs from the vocal chops of 90s house through Nightcrawlers and Todd Edwards to the heavily sliced productions of Disclosure and Porter Robinson. It can be applied to percussion loops for intricate rhythmic patterns, to vocals for stuttered hooks, to bass line riffs, or to entire mixes.

  The plugin auto-generates loop iterations and recombines source material into new rhythmic and melodic arrangements. A dragged in audio file is chopped and rearranged instantly, with up to 32 chops available per instance. Chops can be auditioned or triggered over MIDI, and undo, global transposition and multiple randomization modes widen the range of results. The plugin window is resizable.

  Per-slice controls cover pitch manipulation, formant shifting, declicking and reversing individual slices. Multiple randomization options drive the variations, and favoured results can be locked in and exported to the host for further editing.

  ChopBeast was rewritten from the ground up on the concept behind the maker's earlier ChopMonster plugin. Behaviour introduced in the rewrite includes declicking slices for seamless transitions, independent preview of each chop, preview of the full chopped sequence inside the plugin, sample rate matching so a change of host sample rate does not affect playback, and preservation of a loaded sample's original playback speed and sample rate. Holding Shift applies the selected effect to all chops at once.
specs: |-
  - Audio chop and remix plugin with advanced options
  - Up to 32 chops per instance
  - Per-chop reverse and pitch
  - Creative formant shifting
  - Multiple randomization modes
  - MIDI audition and DAW export
  - Global transpose
  - Declick for smooth chops
  - Independent chop preview and full sequence preview
  - Sample rate matching and preserved sample integrity
  - Resizable interface
  - Full PDF manual and tutorial video
  - Windows 8 or higher (64 bit)
  - macOS 10.15 or higher (64 bit)
  - AAX requires Pro Tools 11 or higher
  - Intel and Apple Silicon CPUs, native AAX format
