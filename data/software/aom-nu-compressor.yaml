description: Nu Compressor is a multi-purpose track compressor plugin, with carefully-crafted 52 programs.
details: |-
  Nu Compressor is a multi-purpose track compressor plugin, with carefully-crafted 52 programs. Each program varies the reduction curve shape, the envelope generation algorithm, the knee shape, the static and dynamic control of frequency response and saturation, and the preferred range of attack time and release time.

  Alongside the programs, the plugin offers the common compressor controls such as input gain and threshold, plus internal and external side-chain input with side-chain input filtering, side-chain monitoring and a dedicated side-chain input meter.

  The reduction meter is switchable between VU and Quasi-PPM styles, and the interface offers a compact view in which the right panel can be collapsed.

  The 52 programs are grouped by application: Clear & Smooth, Drive & Saturation, Snare, Vocals, Instruments, Kick, Bass, Special, Bus and Unplugged. Programs include Standard Nu Compressor, Digital RMS Compressor, Ultra Fast Compressor, Transient Crush, Tight Snare, Steady Vocal, Optical LA, Fat Kick, Stable Bass Line, Ducking Compressor, Nu Bus Compressor and Natural Acoustic.

  The plugin supports sample rates from 44.1 kHz to 384 kHz with 64-bit floating-point internal precision, latency compensation, factory and user presets, snapshots, undo/redo, and reset to default.
specs: |-
