description: A multi-purpose track compressor plugin with 52 carefully-crafted
  programs offering varied reduction curves, envelope generation algorithms,
  knee shapes, and frequency response controls.
details: |-
  Nu Compressor is a versatile track compressor featuring 52 specialized
  programs, each with dedicated reduction behaviors tailored for different
  source material and compression styles.

  The plugin provides standard compressor controls including input gain and
  threshold, complemented by switchable VU and QPPM reduction metering for
  visual feedback. Internal and external sidechain inputs with filtering allow
  precise control over the detection signal, with sidechain monitoring
  capability for fine-tuning.

  A compact view with collapsible right panel allows efficient use of screen
  real estate. The programs cover a wide range of compression characteristics
  through varied reduction curves, envelope generation algorithms, knee shapes,
  and frequency response controls.

  All processing operates at 64-bit floating-point precision with support for
  sample rates from 44.1kHz to 384kHz.
specs: |-
  - 52 specialized compression programs
  - Switchable VU/QPPM reduction metering
  - Internal and external sidechain input
  - Sidechain filtering and monitoring
  - Compact view with collapsible panel
  - Sample rates: 44.1kHz to 384kHz
  - 64-bit floating-point internal precision
  - Latency compensation included
