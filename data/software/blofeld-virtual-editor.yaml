name: Blofeld Virtual Editor
manufacturer: softknobs
primaryCategory: controller
description: Blofeld Virtual Editor is virtual instrument that allows you to
  remotely control the parameters of the waldorf blofeld hardware synthesizer.
details: |-
  Blofeld Virtual Editor is a virtual instrument that allows you to remotely
  control the parameters of the waldorf blofeld hardware synthesizer.

  The plugin can synchronize its state with any of the waldorf blofeld patches.
  This allows simplified editing of existing patches.

  Features include control of all waldorf blofeld parameters with total
  integration with DAW. Multi-timbral usage is possible, though multi mode is
  not supported.

  Arpeggiator editing with visual feedback is included.
specs: |-
  - MIDI controller
  - Remote parameter control
  - Waldorf blofeld hardware synthesizer integration
  - Patch synchronization
  - Arpeggiator editing with visual feedback
  - Multi-timbral usage
  - DAW integration
