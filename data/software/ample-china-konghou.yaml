details: |-
  The konghou is an ancient harp-like picked string instrument that was introduced to east asia from persia over 2000 years ago. Unlike a harp, the konghou has 76 strings in two rows. Each pair of strings connected to a bottom lever. Picking a string and pressing the corresponding string can produce articulations such as vibrato and bends. The konghou has a soft tone and a wide range (g0 b5), making it suitable for various musical styles including film scores, game music, easy listening, new age, and pop etc.

  Ample sound has announced the release of the ample china konghou (ackh), based on the new ample sound 4.0 sampling engine, sampled on a peacock type 76-string konghou. Performer: ye lin

  The ackh offers 8 articulations including sustain, nature harmonic, expressive tremolo, straight tremolo, short tremolo, ascending arpeggio, descending arpeggio, and pre-vibrato totaling 7.5 gb of samples. Recorded using 5 microphones positioned left, right, center, and stereo ambience, each with individual channel eq. 4 microphone modes are provided ab1, ab2, ms1 and ms2. Includes various konghou glissando samples.

  Ample sound 4.0 sampling engine developed on the latest juce 7. Featuring a completely redrawn ui, supporting 5k hd resolution. A brand-new version of the riffer editor. New built-in piano roll riffer piano version allows easy marking of articulations and expressions without the keyswitches. Fully compatible with standard MIDI for lossless import and export. Includes MIDI algorithm tools like quantize, velocity rounding, timing rounding, legato, and restrict etc.

  Ackh glissando mode: by pressing the begin and end notes, the system automatically generates a pentatonic, heptatonic, or persian scale sequence in between (according to the key setting); the time interval between the begin and end notes controls the duration of each note in the sequence, thus determines the speed of the glissando. The velocity of begin and end notes controls the variation in intensity, allowing for different variations from soft to hard or vice versa. Voice independent sahds modulation system. Special konghou bend system. Tremolo system: velocity controls the start position of tremolo sample.
