details: |-
  Your entry into the world of Bitwig studio, with the essential tools for music
  creation.

  For macos, windows, and linux. 40 instruments, audio & note fx, and more.
  Includes the devices polymer, sampler, delay+, and arpeggiator.

  Starter modulation system with 10 modulators. Essential library of sounds,
  loops, and presets.

  Unlimited audio, instrument, and hybrid tracks and scenes. Unlimited VST/clap
  plug-ins with side-chain support.

  Professional editing and arranging tools. 3 audio-stretching algorithms.
  Native hardware integration with MIDI/CV compatibility, plus full mpe support
  and multitouch integration. 3 display profiles (single screen only). 4/8 audio
  I/o busses.
