  and Chandler Limited plugin combines the Curve Bender mastering equalizer with
  the punchy Zener Limiter, providing power, punch, clarity, and color.
details: |-
  A powerful and musical modern channel strip with the unique vintage sound of Chandler Limited. The Zener-Bender for Console 1 combines the crisp and colorful character of the Curve Bender mastering equalizer with the big, punchy Zener Limiter to bring class, history, and most crucially of all, a phenomenal sonic impact.

  Component-modeled with Softube's customary care and experience, these units together can take charge of any mix. The Zener-Bender for Console 1 is included in the Zener-Bender channel strip collection.

  The historic EMI/Abbey Road sound from the late 60s realized by Chandler Limited's hardware and reimagined for a modern studio context. Re-imagined by Chandler Limited and expertly modeled by Softube.

  The units the Zener-Bender For Console 1 is based on were used on modern classic records by Beyonce, The White Stripes, and Lady Gaga by some of the world's top engineers.

  Also available as a part of Flow Mixing Suite and Flow Complete Suite.
specs: |-
  - Made for Console 1, Softube's mixing ecosystem
  - The sound of the Chandler Limited Zener Limiter and the Curve Bender Mastering Equalizer combined in one channel strip for Console 1
  - The historic EMI/Abbey Road sound from the late 60s realized by Chandler Limited's hardware and reimagined for a modern studio context
  - Expertly modeled by Softube
  - An entirely new sonic flavor for the Console 1 ecosystem
  - Also available as part of the Zener-Bender collection
  - Requires a Softube account and an iLok account (no physical iLok required)
  - Three activations
  - 20-day trial, 14-day returns
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26; Windows 10 (64-bit), Windows 11
  - Requires a computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Internet access required for downloading installers and managing licenses
