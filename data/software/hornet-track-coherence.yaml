description: HoRNet Track Coherence is a dynamic meter that helps you reach the right dynamic range in each of the track of your mix.
details: |-
  HoRNet Plugins, in collaboration with The Buildzer, presents Track Coherence, a dynamic range meter designed specifically for helping you manage the dynamic range of your tracks. It measures the relationship between the peak and RMS (Root Mean Square) levels of your audio, commonly referred to as the crest factor, and gives you a clear visual representation of how dynamic or compressed a track is.

  In Track Coherence, the term coherence represents the relationship between the peak and RMS levels. When the two levels are too far apart it often indicates that the track has too much dynamic range and that certain peaks may be too prominent or disruptive within the mix. When they sit too close together it can suggest the track has been excessively compressed and is losing its natural dynamic feel.

  To use it you select the desired coherence level on the range scale (for dance, pop or rock you might set 12 for drums and 8 or 6 for bass, synths or guitars), press play, and the coherence indicator shows the dynamic range in real time. When the indicator reaches the 100% mark the track has achieved the dynamic range set by the scale control, giving immediate feedback as you adjust.

  The plugin lets you target either the “max” or the “avg” level of a track. The max level refers to the absolute peak, while the avg level reflects the overall average loudness, so you can emphasise transients and impact or aim for a smoother, more controlled sound with consistent levels throughout. When the peak and RMS levels are too far apart, a clipper, limiter or fast compressor can bring them closer together.

  The demo is fully functional except that it silences out every now and then, does not save parameter values with the session and does not respond to automation from the host. The released plugin has no copy protection.
specs: |-
  - True peak meters
  - Real time dynamic range display
  - Maximum peak and RMS value display
  - Maximum and average dynamic range display
  - Reference range adjustable from 4 to 21 dB
  - Reset button to clear out history and start over
  - macOS (10.13 and later) and Windows support
  - 64-bit compatibility both on Mac and Windows
  - Audio Units, VST 2.4, VST3 and AAX format
  - Apple Silicon native support
  - No copy protection
