description: HoRNet Track Coherence is a dynamic meter that helps you reach the right dynamic range in each of the track of your mix.
details: |-
  HoRNet Plugins, in collaboration with The Buildzer, presents Track Coherence, a dynamic range meter designed specifically for helping you manage the dynamic range of your tracks.

  The dynamic range of a track is one of the most important factors when crafting a well-balanced mix. It is crucial to understand the relationship between the peak and RMS levels of your audio to achieve the desired effect and avoid unwanted distortion or loss of clarity, commonly referred to as the crest factor. By measuring the coherence between the peak and RMS levels, Track Coherence gives a clear visual representation of how dynamic or compressed a track is: the closer the two levels are, the more compressed the track.

  To use it, select the desired coherence level on the range scale. For genres such as dance, pop or rock you may want to set the coherence level to 12 for drums and 8 or 6 for bass, synths or guitars. Press play and the coherence indicator shows the dynamic range in real time; when the indicator reaches the 100% mark, the track has achieved the dynamic range indicated by the scale control.

  Track Coherence allows you to target two types of levels, the max and the avg level of your track. The max level refers to the absolute peak level, while the avg level gives a sense of the track's overall average loudness. Depending on the type of music and the desired sound, you can target either for the best result.

  If the meter shows that the peak and RMS levels are too far apart, you can adjust them with a clipper, limiter or fast compressor to bring them closer together. The plugin has no copy protection.
specs: |-
  - True peak meters
  - Real time dynamic range display
  - Maximum peak and RMS value display
  - Maximum and average dynamic range display
  - Reference range adjustable from 4 to 21 dB
  - Reset button to clear out history and start over
  - macOS (10.13 and later) and Windows support
  - 64-bit compatibility both on Mac and Windows
  - Audio Units, VST2.4, VST3 and AAX format
  - Apple Silicon native support
  - No copy protection
