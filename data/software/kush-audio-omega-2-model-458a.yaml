details: |-
  The embodiment of an old Altec preamp: a growling, dirty low end giving way to a crisp, slurred 3k-8k. The overall effect is gritty warmth and presence, minus the hard edges.

  Pushed harder, 458a will compress and pull the sound together from the ends inward, quickly developing a feeling of firmness and solidity. On an unruly bass, drum bus, or vocal, 458a is often the only thing a sound needs.
specs: |-
  - HPF/LPF Filters attached to a handy XY control for blended tone focusing.
  - Blend and Makeup filters also in an XY control configuration for gestural tweaking of the output mix.
  - Updated Saturation and EQ filters compared to the original.
  - Kush's latest gain-staging metering and controls.
  - Cross-Plugin Copy/Paste - Copy settings from one omega and paste into another.
  - 2 Activations
  - Free Updates & Support
  - All Available Presets
  - 10-day free demo available via demo code
