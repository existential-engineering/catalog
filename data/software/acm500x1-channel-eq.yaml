details: >-
  A natural sounding, versatile, analogue filter modelled eq, economical with
  cpu and system resources. The acm500x1 plug-in emulates all the desirable
  qualities of a professional analogue channel equalizer, while the elegantly
  simple design makes adding texture and colour - or taming problem frequencies
  - both intuitive and instinctive.


  Presented as a virtual 500-series module with a modern stylized
  user-interface, the acm500x1 uses innovative analogue filter modelling to open
  up the frequency response and accurately replicate the more natural sound of
  analogue designs, without additional latency or high cpu demand.


  More efficient use of cpu and system resources allows more plug-in instances
  in a typical audio workstation project. Smooth controls with no 'zipper noise'
  when adjusting the plug-in settings.


  As intuitive and easy to use as a traditional analogue console eq. Innovative
  processing models analogue filter behaviour - without additional latency or
  high cpu demand.


  The acm500x1 is also available as part of the acm500x bundle. Learn more about
  the acm series plug-ins at www.acmt.co.uk
