description: Mastering plugin and mixing plugin to give finished tracks the
  final push they need? Clipper has you covered.
details: |-
  Clipper is a music producer's ace in the hole for giving finished tracks the final push needed to match loudness expectations in the mixing as well as the mastering process. Softube designed Clipper with this in mind, but true to form, added some extra features to this dual-stage clipper to empower you to go beyond that and make creative decisions about the sound and vibe of the clipping. With the dual clipping stages RMS and Peak, an analog color option, and an optimized soft knee function, Clipper is at once analytical and vibey.

  The function of a clipper is to immediately limit peaks without the effects that come from a limiter or a compressor, like pumping or decreasing level over time. It's useful when you have transients that would otherwise make your limiter act to decrease the overall loudness of your track. Clipper lets you manage those peaks while giving you the option to raise the level of your song. You may also find the sound of Clipper helpful to excite single tracks, such as synths.

  Clipping the peaks of a signal produces an audible sound. If it's overdone, it can sound unpleasant. That's because peak clipping is an analytical function rather than a musical one. To combat that, Softube matched the peak limiting stage in Clipper with an RMS stage you can use to gently shape the material before it goes into the peak clipping stage.

  Great for increasing the apparent loudness when mastering, the RMS stage is transparent in lesser amounts and, when pushed hard, breaks into a thick distortion. It gives you the power to go beyond the mathematical and make creative choices about the tonality of your clipping. Clipper accomplishes this by using anti-aliasing techniques to minimize artifacts, such as multiple stages of 4x oversampling. The Peak stage shaves the transients off the remaining audio. You can think of it like a limiter with infinitely fast attack and release. When used gently in the mastering process, the Peak stage gives a more cohesive sound.

  Want to change the tonality of an 808 or a drum bus? You're gonna wanna grab the Analog Color controls for that (plus, tweak the Headroom and set the Low and High Frequencies to home in on a specific frequency area you want to distort). That's because the Analog Color controls let you increase the amount of even-order harmonics (the sweet ones that sound good) generated by the RMS stage.
specs: |-
  - Dual clip sections for shaping the tonality of the clipping
  - RMS and Peak clipping stages
  - Added sonic options that go beyond analytical clipping
  - Analog Color controls increase even-order harmonics generated by the RMS stage
  - Headroom control plus Low and High Frequency controls to target a frequency area
  - Optimized soft knee function
  - Anti-aliasing with multiple stages of 4x oversampling to minimize artifacts
  - Compatible with all generations of Console 1 Mixing System (Console 1 Ready)
  - Supports Softube Extended Features
  - System requirements: macOS Sonoma 14, Sequoia 15, Tahoe 26
  - System requirements: Windows 10 (64-bit), Windows 11
  - Softube account required
  - iLok account required (no physical iLok required)
  - Computer with AU, VST, VST3 and/or AAX compatible DAW host software
  - Internet access (for downloading installers and managing licenses)
  - Three activations
  - 20-day trial
  - 14-day returns
