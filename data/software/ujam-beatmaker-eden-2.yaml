description: Beats will keep you warm this winter – your studio is about to heat
  up with the version 2.0 update of the popular beatmaker series.
details: |-
  Beatmaker eden is a dance music and edm specialist designed for electronic
  dance music tracks with exclusive genre-authentic sounds, patterns, and
  effects. For any genre from small sweaty berlin clubs to ginormous global
  festivals, eden provides the driving beats that keep the party going.

  Eden combines the latest in drum rhythms and sound design for contemporary
  dance music and edm. Savvy to the variations of classic four-to-the-floor
  stompers, eden is your tool for building the right foundation for the next big
  summer anthem. Its beats are just waiting to carry your passionate synthesizer
  pad cascades and forceful off-beat basslines.

  The version 2.0 update doubled the number of kits and more than doubled the
  included styles and presets. All three plug-ins have sizzling-hot new
  interfaces with MIDI drag-and-drop capability, so that you can edit patterns
  in your DAW or trigger other instruments. Adding individual outputs for each
  instrument opens an entirely new world of mixing options, and there are now
  more sound shaping controls per instrument so that you can fine-tune your
  sounds to fit your style perfectly.

  Each plug-in is a specialist for a certain sound and genre designed for
  minimum complexity. Select instruments, add creative automated fx, shape the
  sound in the master section. You have creative control over every aspect of
  your track. Patterns are arranged in preset groups with intros, verse
  patterns, chorus patterns, fills and outros spread over two octaves of keys.

  There are several levels at which you can customise eden to get your own
  unique sound. First up, there are four macro sliders where you can alter the
  balance between the kick and snare and how much the kick pumps (compression),
  and on the right side there are sliders for the effects mix and intensity. At
  the next level down you have individual control of volume, decay, pitch and a
  low-pass filter for each individual drum sample, and you can also swap sounds
  between kits to create your own custom kit.
specs: |-
  - MIDI drag and drop
  - Multiple audio outputs
  - 10 drum kits
  - More than 1000 patterns
  - 45+ styles
  - Kick pump dynamic side-chain compression
  - Custom FX algorithms
  - Ambience effect
  - 12 smart-mix presets
  - Macro sliders
  - Individual drum sample controls
  - Low-pass filter per drum sample
  - Pattern sequencer
  - Keyboard-like pattern arrangement
  - Single output or multi-out selection
  - Windows 7 or later
  - Mac OS X 10.11 or later
  - 4 GB RAM
  - Up to 60 MB disk space
  - 1280x768 px display minimum
  - Internet connection required
  - Logic 10 and newer for AU version
