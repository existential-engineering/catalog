description: BigRock is an authentic, accurately modeled emulation of the
  legendary electro-harmonix small stone, a phase shifting stomp box.
details: |-
  BigRock is an authentic, accurately modeled emulation of the legendary
  electro-harmonix small stone, a phase shifting stomp box, of which its first
  revision was released in 1974.

  Bigrock allows stereo input and processes the signal in stereo, while the
  original small stone was strictly mono. You now have the ability to edit
  bigrock in most of the common phaser parameters such as the dry/wet mix, the
  center frequency, the lfo amount and the stereo phase offset of the lfo.

  You can also sync the lfo frequency to the host, always in phase to the
  sequencer's play position. Artsacoustic also equipped the bigrock with a
  highpass/lowpass filter section, so you can balance out the signal, before it
  enters the phaser stage.

  The two resonance states on the original small stone are actually two
  different designs, it's not just more or less resonance by far. On bigrock
  artsacoustic implemented a continuous parameter, so you can now morph between
  the original high color and low color mode, or adjust anything in between.

  As all parameters in the bigrock are automatable, this opens a tremendous
  amount of creative possibilities, all of which were not possible with the
  original small stone.
specs: |-
  - Stereo input and processing
  - Dry/wet mix
  - Center frequency adjustment
  - LFO amount control
  - Stereo phase offset of the LFO
  - LFO frequency host sync
  - Highpass/lowpass filter section
  - Continuous resonance parameter
  - Fully automatable parameters
