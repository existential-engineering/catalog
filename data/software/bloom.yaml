url: https://www.fxpansion.com/legacyproducts/
description: Bloom is a creative delay effect plugin with additional diffusion
  network, effects, advanced modulation and much more.
details: |-
  At bloom's core is a stereo delay line switchable between analogue bbd, tape
  and digital models, with a lush diffusion reverb algorithm providing
  spaciousness and dimension. With 3 switchable routings for the diffusor and
  the effect section containing filtering, chorus, frequency shifting and more,
  an extremely wide variety of effects are possible.

  Other highlights include reverse, ping-pong and freeze functions. Bloom's
  transmod modulation system lets you modulate almost all its parameters with a
  variety of sources - built-in step-sequencers, lfos, envelope follower and
  more.

  Additional MIDI-derived sources let you change the delay time per note or vary
  the feedback amount with note velocity. The plugin also includes an internal
  MIDI learn system for tweaking parameters live, turning bloom into a versatile
  performance effect.

  2x oversampling with 4x hi def mode for extremely high quality. Transmod
  modulation with step-sequencers, lfos and more. Comprehensive MIDI control.
  32-bit and 64-bit support. VST, AU and rtas plugin formats on windows 7 or
  higher / mac os x 10.6.2 or higher.
