description: TAL-Drum is a powerful audio plug-in that combines the nostalgic charm of vintage drum machines with modern usability. It also offers a unique lo-fi resampler, giving your beats a distinct character that sets them apart from the rest.
details: |-
  TAL-Drum is a powerful audio plug-in that combines the nostalgic charm of vintage drum machines with modern usability. This intuitive tool lets you effortlessly create captivating beats with its meticulously sampled collection of iconic drum machine sounds. But TAL-Drum doesn't stop there. It also offers a unique lo-fi resampler, giving your beats a distinct character that sets them apart from the rest.

  The user interface offers a 16, 32 and 64 pad view for an optimal workflow, and pads can be named and coloured. Drag and drop moves samples, pads and mappings around for a fast workflow: dragging a pad while holding CTRL creates a copy, and multiple pads or pad-mappings can be selected with CTRL click and changed together. Every pad can have up to 8 mappings, either layered or split across velocity ranges.

  There are 64 voice groups available, each with up to 16 voices, and cycle and random round-robin modes can be configured for two or more pads that share a MIDI note or within a pad's mappings. Up to 16 stereo outputs are available. The plug-in only contains a few effects on purpose, the idea being that you mix and add your favourite effects and EQs in your DAW.

  Built-in Lo-Fi effects change the way the plug-in resamples, affecting the internal sample rate and bit depth. Samples can be sliced and applied to pads in a few clicks, with auto-slice and equal slicing from a given sample BPM. Different time-stretch algorithms suit drum loops and other samples, including a vintage Ak4I cycle time stretcher, and samples can be recorded directly from the main or sidechain stereo inputs then truncated and normalised in the plug-in.

  Modulation comes from one LFO, two AHDSR envelopes, a spline-based envelope and other sources, routed to pitch, pan, filter cutoff and other parameters. The plug-in ships with more than 20 factory kits and more than 600 samples by Goldbaby, emptyvessel, Solidtrax and Saif Sameer (the demo has one kit), reads the most common audio formats (wav, aif, flac, ogg, mp3), and installs lightweight since the installer only copies the plug-in to the plug-in location.
specs: |-
  - Superfast workflow with sample, pad, and mapping drag and drop.
  - 64 pads with 8 layers.
  - Up to 16 stereo outputs.
  - One parametric EQ, LFO, spline envelope, amp AHDSR and two modulation AHDSR for every mapping.
  - Different time-stretch modes (high quality Crisp or Smooth, Vintage AK4I Cycle mode).
  - Realtime LO-FI effects.
  - Slice editor with "MIDI to host" ability and BPM detection.
  - Record audio and create samples directly in the plugin.
  - More than 20 Factory kits and more than 600 samples by Goldbaby, emptyvessel, Solidtrax and Saif Sameer (demo has one kit).
  - Most common audio formats supported (wav, aif, flac, ogg, mp3).
  - Super lightweight. The installer only copies the plugin to the plug-in location.
  - 16, 32 and 64 pad views, pads can be named and coloured.
  - 64 voice groups, each with up to 16 voices.
  - Cycle and random round-robin modes.
  - SFZ format support and TAL-Sampler talwav audio format support.
  - Windows: Windows 10 or higher (64 bit host).
  - macOS: 10.11 or higher (64 bit host). Universal Binary 2 with native Intel and Apple silicon support (M1, M2, M3).
  - AAX: Pro Tools 10.3.6 or higher (64 bit).
  - Linux: 64 bit, Ubuntu 18 or similar.
  - Demo restriction: the plug-in produces a rising white noise sound every minute.
