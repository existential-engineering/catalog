description: "TAL-Drum is a powerful drum sampler plug-in that combines the
  nostalgic charm of vintage drum machines with modern usability. Features 64
  pads with 8 layers each, up to 16 stereo outputs, parametric EQ/LFO/spline
  envelope per mapping, different time-stretch modes, real-time lo-fi effects,
  slice editor with MIDI-to-host and BPM detection, audio recording capability,
  and more than 20 factory kits with 600+ samples."
