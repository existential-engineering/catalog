description: TAL-Drum is a powerful audio plug-in that combines the nostalgic charm of vintage drum machines with modern usability, featuring a meticulously sampled collection of iconic drum machine sounds and a unique lo-fi resampler for distinctive character.
details: |-
  TAL-Drum combines the nostalgic charm of vintage drum machines with modern usability. Its superfast workflow features sample, pad, and mapping drag-and-drop, and the plugin includes 64 pads with 8 layers and up to 16 stereo outputs.

  Each mapping has a parametric EQ, LFO, spline envelope, amp AHDSR, and two modulation AHDSRs for precise control. Different time-stretch modes (high quality Crisp or Smooth, Vintage AK4I Cycle mode) allow creative sample manipulation.

  The built-in Lo-Fi effects and slice editor with MIDI-to-host ability and BPM detection make it easy to create authentic vintage beats. Users can also record audio and create samples directly in the plugin. Over 20 factory kits and more than 600 samples are included from Goldbaby, emptyvessel, Solidtrax, and Saif Sameer.
specs: |-
  - 64 pads with 8 layers
  - Up to 16 stereo outputs
  - Parametric EQ, LFO, spline envelope, amp AHDSR per mapping
  - Time-stretch modes: Crisp, Smooth, Vintage AK4I Cycle
  - Realtime Lo-Fi effects
  - Slice editor with MIDI to host and BPM detection
  - In-plugin audio recording
  - 20+ factory kits, 600+ samples
  - Supported formats: wav, aif, flac, ogg, mp3
  - Windows 10 or higher (64-bit host)
  - macOS 10.11 or higher (64-bit host), Universal Binary 2
  - Pro Tools 10.3.6 or higher for AAX (64-bit)
  - Linux 64-bit / Ubuntu 20.04 or similar
