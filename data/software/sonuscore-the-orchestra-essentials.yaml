description: Your fast track to orchestral composing. Use the orchestra plug-in for beginners, take your first orchestral steps and create amazing music in no time!
details: |-
  THE ORCHESTRA ESSENTIALS is the entry point to Sonuscore's THE ORCHESTRA family, built from a curated selection of instruments taken from THE ORCHESTRA, STRINGS OF WINTER and HORNS OF HELL. It is pitched at composers taking their first orchestral steps, and the instruments it carries are included in THE ORCHESTRA and THE ORCHESTRA COMPLETE 4, both of which can be upgraded to at a reduced price.

  It is powered by the same ensemble engine as the rest of the family, working through a number of independent arpeggiators and velocity envelopes. Playing any combination of notes produces pulsating rhythms and full arrangements without relying on pre-recorded phrases, so the result follows whatever chord or note is played.

  Alongside the animated presets are the Orchestral Colors: practical combinations of instruments that can be played live from the keyboard to carry a melody with a whole section rather than a single instrument.

  The library ships with 99 inspirational ensemble presets and a symphonic palette of 38 string, 12 brass and 12 wind articulations, rounded out with playable percussion and choir, across 5.72 GB of data with fast loading times.
specs: |-
  - Works with the free KONTAKT PLAYER version 6.6.0 and higher, or KONTAKT version 6.6.0 and higher
  - See the KONTAKT 6 PLAYER system requirements for host platform details
  - At least 5.27 GB of free hard disc space
  - 5.72 GB of data
  - 99 inspirational ensemble presets
  - 38 string, 12 brass and 12 wind articulations, plus playable percussion and choir
  - Instruments curated from THE ORCHESTRA, STRINGS OF WINTER and HORNS OF HELL
  - Ensemble Engine with independent arpeggiators and velocity envelopes
  - Orchestral Colors presets: instrument combinations playable live from the keyboard
  - Create full arrangements from simple chords, with no pre-recorded phrases
  - Fast loading times
  - NKS ready
