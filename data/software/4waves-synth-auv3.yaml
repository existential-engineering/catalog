details: >-
  4waves synth auv3 is an easy to use synthesizer with a powerful sound. Its
  characteristics make it perfect for learning about oscillators, envelopes,
  filters and effects; for live music and in general if you need a powerful
  sound easily and quickly.


  It can be used as standalone and as auv3 plugin in daws apps.


  The synthesizer features two oscillators with multiple waveforms and detuning
  options, two adsr envelopes, two filters, and a comprehensive effects section
  including tremolo, chorus, phaser, flanger, delay, and reverb.
specs: |-
  - Auv3 plugin
  - Standalone application
  - Oscillator 1 (saw 1, saw 2, detune1, detune2, suboscillator, volume)
  - Oscillator 2 (square, pwm, detune3, detune4, suboscillator, volume)
  - Adsr1 (attack, decay, sustain, release)
  - Adsr2 (attack, decay, sustain, release)
  - Filter1 (frequency, resonance, mix)
  - Filter2 (frequency, resonance, mix)
  - Effects filter (frequency, resonance, mix)
  - Tremolo (depth, rate)
  - Chorus (depth, mix, feedback, frequency)
  - Phaser (depth, lfo bpm, feedback, frequency)
  - Flanger (depth, mix, feedback, frequency)
  - Delay (time, mix, feedback, filter)
  - Reverb (size, mix)
  - Low cpu load
  - MIDI learn
  - Bluetooth le MIDI
  - Keyboard support
  - Mod wheels
  - Panic function
  - Parameters values window
  - 100 factory presets
  - Ipad support
  - Ios compatibility
