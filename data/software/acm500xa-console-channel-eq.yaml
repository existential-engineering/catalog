details: |-
  The acm500xa plug-in emulates all the desirable qualities of a professional
  analogue console channel equalizer. High and low frequency shelving / bell
  filters and two mid-range parametric bands make adding texture and colour - or
  taming problem frequencies - both intuitive and instinctive.

  Presented as a virtual 500-series module, with a stylized modern
  user-interface, the acm500xa uses innovative analogue filter modelling to
  accurately replicate the more natural sound of analogue designs, without
  additional latency or high cpu demand.

  More efficient use of cpu and system resources allows more plug-in instances
  in a typical audio workstation project.

  As intuitive and easy to use as a traditional analogue console eq. Innovative
  processing models analogue filter behaviour - without additional latency or
  high cpu demand.

  Demo versions are free to download. The acm500xa is also available as part of
  the acm500x bundle.
specs: |-
  - High and low frequency shelving / bell filters
  - Two mid-range parametric bands
  - High and low-mid parametric filters with variable frequency, gain and q
  - Physically modelled rotary control modes
  - Resizable, modern user interface
  - Smooth controls with no 'zipper noise' when adjusting the plug-in settings
  - Innovative analogue filter modelling
  - Windows compatible
  - Linux compatible
  - Low CPU demand
  - No additional latency
