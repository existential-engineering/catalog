description: A zero latency, 8 channel Impulse Response (IR) convolver designed as a cabinet simulator for guitar and bass amplifiers. Delivers pristine quality convolution in real time with low CPU usage.
details: |-
  Zero latency operation
  Low CPU consumption
  Mono and stereo support
  Automatic high-quality resampling for different IR sample rates
  High-quality analog-shaped filters
  Selectable delay for phase interactions
  Automatic phase recognition and flipping
  Resonance control for speaker interaction
  Cartesian Mixer enabling graphical morphing between up to 8 IRs
  IR merging and export capability
  Fully automatable controls
