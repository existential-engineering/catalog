description: "Zero latency, 8 channel Impulse Response (IR) convolver designed
  as a cabinet simulator for guitar and bass preamplifiers. Features a unique
  Cartesian Mixer for blending up to 8 IRs graphically with consistent output
  levels, advanced built-in filters and delay controls, automatic phase
  recognition, and IR export capability."
details: |-
  Zero latency
  Low CPU usage
  Mono and stereo support
  Automatic high-quality resampling for IRs with different sampling rates
  High-quality analog shaped filters
  Selectable delay for phase interactions between loaded IRs
  Automatic phase recognition and flipping for negative phase IRs
  Resonance for power-amp/speaker interaction control
  Continuous graphical morphing control between loaded IRs
  Option to merge multiple IRs into one and export as a new IR
  Option to freeze multiple IRs processing to reduce CPU usage
  Global input level and single IR level controls
  Fully automatable controls
  Cartesian Mixer for up to 8 IR blending
