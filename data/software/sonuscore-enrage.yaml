description: Enrage is a highly addictive multi-modular FX processing tool that opens up unlimited possibilities in how you tweak and process your sounds.
details: |-
  EnRage is an FX processing plug-in with more than 50 different devices waiting for you to chain them together and send your audio signal on a thrilling digital journey. It will easily handle everyday FX plug-in needs but also opens the door to more extreme sound processing, and it stays super responsive and extremely precise while doing it. Users remain in full control by modifying a multitude of parameters, or can let go and get inspired by EnRage's more than 250 presets.

  The appeal is the modularity. Any effects can be combined and routing chains built as simple or as complicated as needed: choose from over 50 devices, click and drag them into the rack, and change the parameters. EnRage's modularity allows interacting and interwoven effect structures that cannot be achieved with typical serial effect chains, and the possibilities expand further by dragging and dropping macro assignments to take additional control. Devices are grouped as IN/OUT, DELAY, DISTORTION, MODULATION, GENERATOR, PITCH, FILTER, IMAGING, REVERB, ANALYZER and GAIN & DYNAMICS.

  Ten modulation sources alter the sound by changing values over time. A MOD SOURCE can be connected to DEVICE controls and even to other MOD SOURCE controls, so applied modulation makes controls change value according to the shape of the modulation signal. The supplied mod sources include Curve, ADSR, Envelope Follower, LFO, Mapping, Delay, Transient Follower, Change Analyzer, Pitch Tracker and Formula.

  EnRage ships with over 250 factory presets, ready to twist, mangle and madden sounds. Presets can be loaded, tweaked, saved as user presets and shared with other users. The plug-in requires an audio host application and does not work standalone; it runs in hosts supporting VST 2.4, AU or AAX, such as Logic Pro, Pro Tools (11+), Cubase, Nuendo, Ableton Live and Reaper.
specs: |-
  - Multi-modular FX processing plug-in with modular routing rather than fixed serial chains
  - Over 50 different devices across IN/OUT, delay, distortion, modulation, generator, pitch, filter, imaging, reverb, analyzer and gain & dynamics groups
  - 10 modulation sources: Curve, ADSR, Envelope Follower, LFO, Mapping, Delay, Transient Follower, Change Analyzer, Pitch Tracker, Formula
  - Mod sources can modulate device controls and other mod sources
  - Drag-and-drop macro assignments
  - Over 250 factory presets; save and share user presets
  - Format: software plug-in (VST, AU, AAX) for Windows and Mac
  - Requires an audio host application; does not run standalone
  - Works in hosts supporting VST 2.4, AU or AAX (Logic Pro, Pro Tools 11+, Cubase, Nuendo, Ableton Live, Reaper)
  - Requires a free iLok account; machine license activation or iLok USB dongle (2nd generation or newer)
  - Required hard disk space: 196 MB
  - Available as download
  - Windows: Windows 8 (64-bit), 8 GB RAM, Intel Core i5 or similar
  - Mac: macOS 10.13 (64-bit), 8 GB RAM, Apple Silicon or Intel Core i5, OpenGL 2.1 capable GPU
