description: Designed for your ears, EQuivocate is a flexible mixing and
  mastering EQ with customizable bands and visual feedback to easily sculpt your
  sounds. Model your ear, not your gear!
details: |-
  Perfect for mixing and mastering, EQuivocate's auditory filters and match EQ functionality make it incredibly powerful, simple to use, and natural sounding.

  EQuivocate uses filters which are modeled on the human ear. Each of the 26 critical bands tickles a different part of your inner ear, making any combination of settings sound as natural as possible. Combining this with a linear-phase filter shape that reduces pre-echo makes EQuivocate an EQ with a difference you can hear.

  Use EQuivocate's Match EQ feature to make the sound of your track match or complement the audio signal streamed to its sidechain. You can also use it to make a final master match the tone of a reference track, or help fit a sound into a dense mix. Unlike other match EQ plug-ins, EQuivocate provides a transparent match without trying to model imperceptible differences which can cause a match EQ to sound unnatural. Feed your favorite song or individual track into it and instantly morph your tone to match.

  The 26 filters are distributed along the Mel Spectrum but you can customize the filters and their frequencies. When combined with usability options like Automatic Level Compensation, Draw EQ Curve, and individual solos for each critical band, EQuivocate is as powerful as it is precise.

  Most graphic EQs are IIR (infinite impulse response) or analog-style filters. These have a lot of great properties, but unfortunately the shape of an IIR filter isn't very flexible. EQuivocate uses a linear phase FIR (finite impulse response) filter that doesn't have these problems, so what you hear is true to what you see on the screen. Instead of using what DSP engineers call "ideal" rectangular FIR filters, these are triangularly shaped filters, often used in hearing models as a first approximation to the critical bands in your inner ear.
specs: |-
  - 26 linear phase auditory filters shaped to approximate the critical band filters in your ear
  - Filters distributed along the Mel Spectrum, with customizable filters and frequencies
  - Match EQ matches the tone of one track to another, via sidechain input or a reference track
  - Draw Curve mode: click and swipe across the gain slider field to draw an EQ curve, then toggle off to fine tune
  - Output level Auto button automatically compensates for level changes introduced by the EQ
  - Solo the output of one or more bands to easily find problem frequencies
  - Add or remove filters to customize your sound
  - Compare button toggles between two unique settings
  - 67 professional presets, including artist presets from Richard Devine, Jeremy Lubsey, Alex Saltz, Sebastian Arocha Morton, Richard X and John McCaig
  - macOS 10.9 or later, 64-bit AAX, AU, VST, VST3, all formats Apple Silicon compatible
  - Windows 10 or later, 64-bit AAX, VST, VST3
