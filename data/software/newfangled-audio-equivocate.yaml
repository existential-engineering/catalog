description: "Designed for your ears, EQuivocate is a flexible mixing and
  mastering EQ with customizable bands and visual feedback to easily sculpt your
  sounds. Model your ear, not your gear!"
details: |-
  Powerful and precise human ear EQ. Perfect for mixing and mastering, EQuivocate's auditory filters and match EQ functionality make it incredibly powerful, simple to use, and natural sounding. Features 26 auditory filter bands based on the critical bands of human hearing, match EQ functionality, and 67 professional presets. 64-bit only. Apple Silicon compatible.
specs: |-
  macOS 10.9+: 64-bit AAX, AU, VST, VST3 (Apple Silicon compatible). Windows 10+: 64-bit AAX, VST, VST3.
