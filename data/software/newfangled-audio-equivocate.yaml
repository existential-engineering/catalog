description: EQuivocate is a Human Ear EQ designed for mixing and mastering that uses 26 linear-phase auditory filters modeled on the human ear's critical bands, with Match EQ functionality to blend tracks or match reference tones.
details: |-
  EQuivocate is a graphic equalizer built around 26 linear-phase auditory filters shaped to approximate the critical band filters of the human ear. Unlike traditional equalizers that divide frequency into arbitrary bands, EQuivocate aligns its bands with how humans actually perceive sound, making it an intuitive and musical tool for mixing and mastering.

  The plugin features a Match EQ function that can analyze and blend two tracks or match a reference tone, making it easy to shape one source to match the spectral characteristics of another. The Draw EQ Curve tool allows for freehand visual curve creation directly on the EQ display.

  EQuivocate includes Automatic Level Compensation to maintain consistent perceived loudness while sculpting frequencies, and individual band solo capability for precise surgical editing. Filter frequencies can be customized to fit specific workflow needs.

  The plugin ships with 67 professional presets curated by artists including Richard Devine and Jeremy Lubsey. A 14-day free trial is available before purchase. EQuivocate is also available as part of the Elevate Mastering Bundle alongside Elevate Limiter, Saturate Spectral Clipper, and Punctuate.

  EQuivocate supports macOS 10.9 and later (including Apple Silicon native support) and Windows 10 and later. It is available in AAX, AU, VST, and VST3 formats (all 64-bit).
specs: |-
  - 26 linear-phase auditory filters modeled on critical bands of the human ear
  - Match EQ functionality for track blending and reference matching
  - Draw EQ Curve tool for visual curve creation
  - Automatic Level Compensation output
  - Individual band solo capability
  - Customizable filter frequencies
  - 67 professional presets included
  - Multi-level undo/redo support
  - True A/B comparison mode
  - Delta Listen Mode
  - Resizable UI
