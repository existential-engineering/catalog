details: |-
  Alan Parsons Imperial Grand is a sampletank instrument that puts the authentic acoustic sound of a premier grand piano at your fingertips. It provides over a gigabyte of content with over 650 stereo samples covering 8 velocities per note.

  The samples used for this instrument were recorded by legendary producer-engineer alan parsons at mark knopfler's british grove studios in london. Alan used akg c12 and neumann u67 valve microphones running through a classic emi console to capture the essence of a spectacular bsendorfer model 290 grand piano.

  The piano samples were obsessively voiced specifically for sampletank by ik's international sound design team, finding the perfect velocity split positions combined with carefully dialing in the ideal velocity response from the sampletank engine.

  Sampletank's acoustic resonance convolution effect provides ultra-realistic soundboard resonance so that when you press the sustain pedal, the harp resonates the way it should giving you the real-life experience of playing an acoustic grand piano.

  Each piano note has been meticulously sampled at 8 specific velocities to provide the most realistic playing experience possible, with a few notes omitted where necessary to ensure smooth key transitions and uniform tonality across the keyboard.
