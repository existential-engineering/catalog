details: |-
  AmpliTube 4 is a guitar and bass tone studio for mac/pc that works as a
  standalone application and as a plug-in for your favorite DAW. Amplitube
  recreates the entire guitar/bass signal chain from instrument to recording
  device, and does so in a very realistic and intuitive way.

  Amplitube pioneered and leads the way in guitar amp and effects modeling, and
  amplitube 4 takes it to the outer edges of extreme hyper realism with
  intuitive familiar tools.

  Amps, preamps, stompboxes, speaker cabinets, mics, effects... All modeled on
  famous vintage hardwares used by renowned guitarists and bassists.

  Amplitube 4 by ik multimedia is a virtual effect audio plugin for macos and
  windows. It functions as a VST plugin, an audio units plugin, a VST 3 plugin
  and an AAX plugin.
