details: |-
  8-Bit Wonder from 1982

  The Commodore 64 was the primary choice for gamers in the early 80s. This nicotine-colored plastic wonder created the foundation of gaming as we know it today and still stands as one of the most impactful devices ever made for games. The C64 was blessed with the three-channel SID chip (Sound Interface Device), which was partially analog and digital. The SID chip has several analog anomalies, which is why it still hasn't been fully emulated even today, including natural detuning, noise and imperfect clicks. We Ultra Deep-Sampled three different SID chips over two generations of chipsets from the SID Station and the MOS Sammich, which contains newer generations (less noisy) variations of the infamous chipset. The Commodore 64 is a highly unique machine and we had to cover every possible angle of sampling. Including a massive assortment of classic SID Arp sounds with extensive round-robin, Basses, Leads, Oscillators from each Chipset, Pads and Plucked sounds.
