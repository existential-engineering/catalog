details: |-
  Am-Track is a combination of an analogue compressor and a tape simulator in
  one single device. It is primarily used for so-called "tracking", I.e. Editing
  individual channel strips or subgroup signals.

  Compression can be executed either as modern or "vintage". With emulation of
  the tape machine sound, typical aspects of the large, saturated sound
  characteristics of the magnetic recording for the hard disk studio can be made
  reality at low costs and high quality.

  The plug-ins in the analogue modelling suite recognize the number of incoming
  signals and can function automatically in mono to reduce processor strain by
  preventing the sending of another signal for calculation.

  Audio tools based on replicas of classic circuit designs.
specs: |-
  - Dynamics compressor
  - Limiter
  - Tape simulator
  - Modern compression mode
  - Vintage compression mode
  - Tape machine sound emulation
  - Mono/stereo auto-detection
  - Analogue circuit modelling
