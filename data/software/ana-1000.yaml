details: |-
  Lurker Beats (formerly synthiv) has released the ANA-1000 analog modeling
  synthesizer (v1.0). This simple, but effective instrument plugin allows for a
  variety of sounds, ranging from heavy basses, screaming leads, to warm and
  wavy pads.

  It is available for mac (AU) and windows (vst3) in 64-bit format.
specs: |-
  - 2 oscillators
  - 3 LFOs
  - Distortion
  - Chorus
  - Delay
  - Waveform x-fade
  - Tempo sync
  - VST3
  - Audio Units
  - 64-bit
