description: From tight rooms to chorused ethereal spaces, Tai Chi is the next
  generation ensemble character reverb specialising in luscious chorused reverbs
  that are perfect for synth, guitar, electric piano and vocals.
details: |-
  Tai Chi is a next-generation ensemble reverb specialising in luscious chorused reverbs that are perfect for synth, guitar, electric piano and vocals. Envisioned as the perfect combination of heritage vibe and contemporary class, it is described by LiquidSonics as an unbelievably rich yet pristine algorithmic character reverb, pairing the deep editing potential of the past with the ease of use of the present.

  For reverb decay time shaping, engineers have traditionally had to choose between the rigid but high-precision sculpture of multi-band decays or the smoothly evolving in-loop roll-off of traditional reverb time multiplier contouring filters. The standard edition offers up to four bands of decay time control, spread, shape and profiling for envelope definition, two contouring filters and a low damping filter, which LiquidSonics claims gives it by far the most flexible algorithmic reverb decays in the industry.

  Chorusing is handled by scores of synchronised modulated reads distributed throughout the reverb, thickening synths and guitars while avoiding the characteristic dragging sharp and flat heard in chorused reverbs of old. Unison chorus rapidly builds thickness on reflections without artefacts, and 'wander' type modulations create the thick, gritty character associated with famous hall reverb algorithms of the past.

  Ducking and compression allow the reverb to stay out of the way of vocal phrases when it matters most and flood in to fill the gaps. Dynamics can be applied to the wet mix or to just the reverb itself, so the spatialisation provided by the reflection engine is never compromised even when extreme reverb ducking is called for. The standard edition also adds fidelity controls including shimmer and a bit crusher.

  The standard edition supports mono, stereo, LCR, 4.0, 5.0 to 5.1.4, 7.0 to 7.1.6 and 9.0.4 to 9.1.6 channel configurations and ships with 284 presets, including efficiency and signature presets. A license for the standard edition can also unlock Tai Chi Lite.
specs: |-
  - Perpetual license
  - 64-bit VST, VST3, AU and AAX
  - VST 2.4, VST 3, Audio Unit (AUv2), AAX Native
  - Unison chorus
  - Nonlinear reflections
  - Multi-band decay with contouring (up to four bands)
  - Two contouring filters plus low damping filter
  - Spread / shape / profiling for envelope definition
  - 4-band master EQ
  - Compression and ducking
  - Fidelity controls incl. shimmer and bit crusher
  - Mono, stereo, LCR, 4.0, 5.0 – 5.1.4, 7.0 – 7.1.6, 9.0.4 – 9.1.6
  - 284 presets (including efficiency and signature presets)
  - Windows 7 and above
  - macOS 10.13 and above
  - Intel or Apple Silicon processors (native and Rosetta 2 supported)
  - iLok 2/3, iLok machine activation or iLok Cloud required
  - Recommended: AMD Zen 3 or higher (e.g. 5000 series and up)
  - Recommended: Intel 10th or 11th gen or higher (e.g. 10xxx, 11xxx series and up)
  - Recommended: 6 cores minimum (8+ recommended)
