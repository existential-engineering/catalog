  From tight rooms to chorused ethereal spaces, the next generation ensemble character reverb. Features multi-band, fidelity and dynamics engines along with chorus, reverb and reflections. Includes ducking and compression for improved clarity and intelligibility. 64-bit VST, VST3, AU and AAX. Apple Silicon and Intel support. iLok required.
