description: From tight rooms to chorused ethereal spaces, Tai Chi is the next generation ensemble character reverb specialising in luscious chorused reverbs that are perfect for synth, guitar, electric piano and vocals. AAX, AU, VST
details: |-
  Tai Chi is a next-generation ensemble reverb specializing in luscious chorused reverbs optimized for synths, guitar, electric piano, and vocals. It combines heritage character with contemporary design, offering both deep editing capabilities and ease of use.

  The standard edition features multi-band decay control with up to 4 bands, compression and ducking dynamics, fidelity controls including shimmer (with pitch-up and pitch-down options), and a Very Low Frequency (VLF) processor for full spectral control over the reverb tail.

  Tai Chi Standard supports mono through 9.1.6 surround formats, including LCR, 4.0, 5.0–5.1.4, 7.0–7.1.6, and 9.0.4–9.1.6 channel configurations, making it suitable for immersive audio production workflows.

  The unison chorus engine delivers synchronized modulated reads for ensemble-style reverb character, while nonlinear reflections with pattern modes allow creative shaping of early reflection behavior.

  Tai Chi Standard ships with 284 presets including efficiency and signature banks, and requires an iLok 2/3, iLok machine activation, or iLok Cloud license.
specs: |-
  - Formats: VST 2.4, VST 3, Audio Unit (AUv2), AAX Native
  - 64-bit only; Universal Binary (Apple Silicon + Intel x64)
  - macOS 10.13 and above; Windows 7 and above
  - Surround support: LCR, 4.0, 5.0–5.1.4, 7.0–7.1.6, 9.0.4–9.1.6
  - Multi-band decay control (up to 4 bands)
  - Unison chorus with synchronized modulated reads
  - Nonlinear reflections with pattern modes
  - 4-band master EQ
  - Compression and ducking dynamics
  - Fidelity controls including shimmer (pitch-up and pitch-down)
  - Very Low Frequency (VLF) processor
  - Shape and profiling controls for envelope definition
  - 284 presets (including efficiency and signature banks)
  - iLok 2/3, iLok machine activation, or iLok Cloud required
  - 14-day free trial available
