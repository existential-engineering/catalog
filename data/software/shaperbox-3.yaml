details: |-
  The ultimate plugin for modern mixes and infinite inspiration with 11 powerful shaper effects in one easy modern interface.

  Bring out emotion in songs with drawable lfo waveforms, reactive envelope followers, and new audio triggering.

  Create rhythmic effects that react to music or stamp a whole new groove on it.

  Sculpt sound in incredible detail with 3-band multiband processing for every effect.

  Animate any effect over time with easy waveform-editing tools that create curved, stepped, or ramped fx patterns.

  Trigger all 11 shaperbox effects from any sound's transients to design reactive time-twists, distortion envelopes, filter plucks, and reshaped attacks.
