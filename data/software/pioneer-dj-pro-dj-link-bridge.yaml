details: |-
  Bridge software for PRO DJ LINK system

  PRO DJ LINK Bridge is an application that enables you to synchronize lighting, video displays and pyrotechnics with audio played on our professional DJ set-up when using certified products from licensed companies. PRO DJ LINK Bridge helps the PRO DJ LINK network system to run smoothly and ensures seamless syncing between visual effects and DJ performances. By connecting software and hardware, DJs, event producers, lighting designers, LJs, video creators and VJs can bring shows to life with hypnotic visual effects.
