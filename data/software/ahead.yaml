details: >-
  Ahead by analog obsession is a virtual effect audio plugin for macos and
  windows.


  Little box for big sound. Finally, updated and combined all guitar amp
  plug-ins into one plug-in. One m-type, two f-type and a custom design amps.


  Features: 4 amp models (red button). Volume 1-2: volume(gain/drive) for amp
  models. Only m-jtamp uses both of volume knobs. M-type tonestack. Master
  volume. Main bypass (footswitch or ahead label).
