description: Acoustica 7 is the perfect solution for audio editing, podcast
  creation, mastering and audio restoration on both mac and pc. The application
  is available in a premium edition and a lower cost standard edition. Both
  include a powerful and sample accurate clip editor that lets you navigate and
  edit single track audio with pristine quality.
details: |-
  Acoustica is Acon Digital's complete audio editing, restoration and mastering platform, available both as a standalone application and as a full plugin suite. It targets a fast, intuitive workflow with a full set of high-quality processing tools, whether the work is producing podcasts, cleaning dialogue, or mastering a final mix.

  The editor combines spectral editing with surgical precision, unlimited-track multitrack editing, processing chains and third-party plugin support, and a tabbed MDI interface with unlimited undo/redo. Real-time analysis covers spectrum, loudness (EBU R-128), phase correlation and spectrogram views, plus wavelet (Morlet) analysis, spectral histogram, statistics and automatic track splitting.

  Spectral editing offers up to 8X temporal resolution enhancement, area, brush, freehand and magic wand selection tools, a Retouch tool that attenuates noise inside time-frequency selections, overtone selection with harmonic control, and Mel, logarithmic and linear frequency scales.

  Acoustica ships in three tiers. The Standard Edition covers spectral and stereo clip editing, multitrack editing, and limited restoration tools (DeClick, DeClip, DeHum, DeNoise Light). The Premium Edition adds Extract:Dialogue 2, the full Restoration Suite 2 and Dialogue Cleaning tools (DeWind, DeRustle, DeBuzz, DePlosive, DeClick, DeEss, DeBird), Remix five-stem separation, Denoise 2, the Mix & Mastering Suite, Multiband Dynamics, audit trail export, and immersive audio up to 7.1.2 channels. The Post Production Suite bundles Premium with DeVerberate 3.x and DeFilter 1.x.

  ARA2 support lets Acoustica act as a clip editor inside compatible DAWs, and an AAX Transfer plugin covers Pro Tools. Tested hosts include Logic Pro, Pro Tools, Ableton Live, Cubase, Nuendo, Reaper, FL Studio, UA Luna, Adobe Audition, Adobe Premiere, DaVinci Resolve, Reason and Media Composer.
specs: |-
  - Sample rates up to 384 kHz
  - Bit resolution up to 32-bit PCM or 32-bit floating point
  - Up to 2 audio channels (Standard Edition), up to 10 channels / 7.1.2 immersive audio (Premium Edition)
  - Unlimited multitrack tracks with track inserts, master inserts and send effects
  - Clip loop/time stretch, cross-fades, clip fades, automation curves for volume, pan and send level
  - Spectral editing with up to 8X temporal resolution enhancement
  - Selection tools: area, brush, freehand, magic wand, overtone selection with harmonic control
  - Retouch tool for attenuating noise in time-frequency selections
  - Frequency scales: Mel, logarithmic, linear
  - Time formats: Hour:Min:Sec:MS, SMPTE (23.98, 24, 25, 29.97 drop, 29.97 non-drop, 30 fps), sample index, bar:beat:tick
  - Real-time analysis: spectrum, spectrogram, loudness (EBU R-128), phase correlation
  - Wavelet (Morlet) analysis, spectral histogram, statistics, automatic track splitting
  - Restoration: DeClick, DeClip, DeHum, DeNoise (Light in Standard, Denoise 2 in Premium)
  - Premium dialogue tools: Extract:Dialogue 2, DeWind, DeRustle, DeBuzz, DePlosive, DeClick, DeEss, DeBird
  - Remix stem separation into 5 stems (vocals, piano, bass, drums, other) — Premium
  - Processing: dynamics (compressor, expander, gate), Multiband Dynamics (Premium), Equalize 2, Verberate 2 reverb, dithering and noise shaping, time stretch, pitch transposition, Harmonizer up to 4 voices, channel mixer
  - Batch processing, manual waveform drawing, tab to transients, labels and region markers, workspace files, Edit History pane, auto de-click at splice points
  - Audit trail export (Premium only)
  - File formats: WAV, WAV64, AIFF, MP4 (AAC), MP3, OGG, FLAC, WMA
  - CD project support: integrated burning, Disc At Once gapless recording, CD audio import, buffer underrun protection, CD-RW erasing
  - ARA2 clip editor integration in compatible DAWs; AAX Transfer plugin for Pro Tools
  - Windows: Windows 10/11 64-bit, Intel Core i3 or AMD multi-core (i5+ recommended), 4 GB RAM, 1366x768 minimum display, 10 GB free space, ASIO / Windows Audio / DirectSound
  - macOS: macOS 10.13 or later, 4 GB RAM, 10 GB free space, CoreAudio
  - 30-day free trial, no credit card required
