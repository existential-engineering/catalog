description: Acoustica 7 is the perfect solution for audio editing, podcast
  creation, mastering and audio restoration on both mac and pc. The application
  is available in a premium edition and a lower cost standard edition. Both
  include a powerful and sample accurate clip editor that lets you navigate and
  edit single track audio with pristine quality.
details: |-
  Acoustica is a complete audio editing, restoration and mastering platform. Standalone application. Full plugin suite. Buy it once, keep it forever. Acoustica gives you a fast, intuitive workflow and a full suite of high-quality processing tools, whether you're producing podcasts, cleaning dialogue, or mastering a final mix. Choose the Standard Edition for a powerful entry point, or go Premium for the complete toolkit. The interface fits the way you work. Dock your meters, analyzers, processing chains and media browser exactly where you need them, and get straight to the audio.

  From noise removal and dialogue cleaning to stem separation and mastering, everything in the suite is built to solve the problems you actually face in post-production. Restoration Suite 2 cleans up any recording, whether you're salvaging a noisy location recording or fixing hum, buzz, clicks or clipping in the edit suite. Extract:Dialogue 2 uses AI to automatically separate spoken voice from background noise and reverb. The Mix & Mastering Suite is an integrated collection of EQ, dynamics, multiband compression, limiting and dithering tools. Remix uses AI to split a complete mix into five isolated stems (vocals, piano, bass, drums and other) in realtime. The Dialogue Cleaning Suite is an AI-trained set of tools tackling wind, lavalier rustle, buzz, hum, plosives, mouth clicks and even birdsong.

  Acoustica supports resolutions up to 32-bit and 384 kHz, and the Premium Edition extends this to full Dolby Atmos 7.1.2. The Spectral Editor lets you see and remove unwanted noise, a cough, a creak or a rogue frequency, without affecting the audio around it. Integrated restoration tools recover audio affected by background noise, clicks, crackle, clipping or muddy live acoustics, with the Premium Edition adding the full Restoration Suite and Extract:Dialogue 2 for broadcast-grade results.

  Processing chains let you set up EQ, dynamics, reverb and effects exactly how you like them, save the chain, and apply it in seconds next time. Full VST, VST3 and AU support means an existing plug-in library works straight away. The multitrack editor combines, layers and refines audio from multiple sources in real-time, with automation, cross-fades and clip time-stretching built in. Real-time spectrum, loudness (EBU R-128), phase correlation and spectrogram analysis cover the measurement side.

  The Acoustica ARA2 plug-in, included with the Standard and Premium Editions, offers the complete functionality of Acoustica's clip editor and integrates into digital audio workstations with ARA2 support, removing the need to transfer clips back and forth and keeping DAW sessions up to date automatically. A Transfer plug-in in the AAX format offers a quick way to move audio clips for processing from Pro Tools to Acoustica and back again. The plugin suite has been tested with Apple Logic Pro, Avid Pro Tools, Ableton Live, Steinberg Cubase, Steinberg Nuendo, Fender Studio Pro, Cockos Reaper, FL Studio, UA Luna, Adobe Audition, Adobe Premiere, DaVinci Resolve, Propellerhead Reason and Avid Media Composer.
specs: |-
  - Windows 10 / 11 (64 bit); Intel Core i3 or AMD multi-core processor (Intel Core i5 or faster recommended)
  - macOS 10.13 or later
  - 4 GB RAM, 10 GB free HD space
  - 1366 x 768 display resolution (1920 x 1080 or higher recommended)
  - Audio drivers: ASIO, Windows Audio (exclusive and non-exclusive), DirectSound on Windows; CoreAudio on Mac
  - Maximum sample rate: 384 kHz
  - Supported bit resolutions: up to 32 bit PCM or floating point
  - Maximum audio channels: 2 (stereo) in Standard Edition, 10 (up to 7.1.2 channel surround) in Premium Edition
  - Plug-in hosting: VST, VST3 and AU (Mac only)
  - Acoustica ARA2 plug-in for host applications with ARA2 support
  - Transfer plug-in in AAX format for Pro Tools
  - Unlimited undo and redo levels; unlimited multitrack tracks
  - Non-destructive editing engine with drag and drop editing and optional auto de-click at splice points
  - Spectral editing: waveform and spectrogram views, temporal resolution enhancement up to 8X, area/brush/freehand/magic wand time-frequency selection, Retouch tool, overtone selection, Mel/logarithmic/linear frequency scales
  - Multitrack editing: processing chains (track inserts, master inserts, send effects), loop or time stretch clips, cross-fades, clip fades, automation of volume, left-to-right pan, back-to-front pan and send level
  - Real-time analyzers: level meter (true or sample peak, peak hold, RMS) with K-20, K-14, K-12 and digital full scale modes, EBU R-128 loudness meter, spectrum analyzer, phase correlation meter, time display
  - Analysis tools: spectrum analysis, spectrogram analysis, Morlet wavelet analysis, spectral histogram, statistics, automatic track splitting
  - Restoration Suite 2: DeClick, DeClip, DeNoise, DeHum (Standard Edition ships DeNoise Light with static noise profile only)
  - Dialogue Cleaning Suite (Premium): Extract:Dialogue 2, DeWind:Dialogue, DeRustle:Dialogue, DeBuzz:Dialogue, DeClick:Dialogue, DePlosive:Dialogue, DeBird, DeEss:Dialogue
  - Mix & Mastering Suite: Dynamics (compressor, expander, gate), Limit, Dither and Equalize 2; Premium adds Multiband Dynamics
  - Effects: Verberate 2 reverb (stereo only), convolution reverb, Echo multitap delay, Modulate (flanger and phaser), Chorus based on Acon Digital Multiply, Transpose, Time Stretching, Harmonizer with up to four voices
  - Remix stem separation into vocals, piano, bass, drums and other
  - Batch processing of files and complete folder structures
  - High quality sample format conversion, dithering and noise shaping, channel mixer, test signal generator, Vitalize, DC offset removal, rotate and invert phase
  - Supported audio formats: WAV, WAV64, AIFF, MP4 (AAC), MP3, OGG, FLAC, WMA; ACID information editable in wave files
  - CD projects: integrated audio burning, Disc At Once (DAO) gapless recording, CD track import, buffer underrun protection, CD project save/load, CD-RW erase
  - Cleaning Wizard for LP or tape to CD transfers
  - Time formats: Hour:Min:Sec:MS, SMPTE (23.98, 24, 25, 29.97 drop frame, 29.97 non-drop frame, 30 fps), sample index, bar:beat:tick
  - Support for labels and region markers, workspace files, tabbed MDI user interface, edit history pane, tab to transients, manual waveform drawing
  - Audit trail export (Premium Edition only)
