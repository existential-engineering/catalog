description: Software recreation of the Pearl Syncussion SY-1 drum synthesizer
  from the late 1970s, featuring four independent modules with CMOS-based
  oscillator modeling and 60+ musical scales.
details: |-
  SY-4X Virtual Syncussion is a software recreation of the legendary Pearl
  Syncussion SY-1 drum synthesizer from the late 1970s, offering four
  independent Syncussion SY-1 modules in one package for an 8-voice drum kit
  capability with expanded features beyond the original hardware.

  The plugin features CMOS-based oscillators with authentic circuit modeling
  including voltage-controlled oscillators with TRI core and CMOS 4069 hex
  inverters. A 2-pole spreading VCF (voltage-controlled filter) with adjustable
  pole separation uses state-variable filter design with unequal integrator
  capacitors creating a distinctive pole-spreading effect.

  Eight preset synthesis modes (A-H) provide different sound approaches with
  trigger-controlled mode scanning. Additional features include a CMOS circuit
  defect control for enhanced harmonics, Berserk Mode with optional pre or
  post-filter distortion, and Keyboard Mode with pitch scaling to over 60
  musical scales spanning traditional, modal, microtonal, and world music
  systems.

  The plugin includes dual envelope generators (SWEEP and dynamic), LFO with
  square/triangle waveforms, Sample & Hold circuit, multiple output routing, and
  up to 16x oversampling. It supports Windows 10+ (VST3) and macOS 10.14+ (VST3
  and AU) with Universal 2 binary for native Apple Silicon support.
specs: |-
  - 4 independent Syncussion modules (8-voice drum kit capability)
  - CMOS-based oscillators with authentic circuit modeling
  - 2-pole spreading VCF with adjustable pole separation
  - 8 preset synthesis modes (A-H) with trigger-controlled mode scanning
  - CMOS circuit defect control for enhanced harmonics
  - Berserk Mode with optional distortion (pre or post-filter)
  - Keyboard Mode with pitch scaling to 60+ musical scales
  - LFO with square/triangle waveforms
  - Sample & Hold circuit
  - Multiple output routing
  - Up to 16x oversampling
  - Dual envelope generators (SWEEP and dynamic)
  - Cross-modulation capabilities
  - Universal 2 binary (native Apple Silicon support)
