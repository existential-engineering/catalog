description: With the HOFA SYSTEM DelayPro, you not only get all the standard delay sounds, but also extremely unusual variants. This allows you to quickly realise your creative ideas and explore completely new delay worlds.
details: |-
  With the HOFA SYSTEM DelayPro, you not only get all the standard delay sounds, but also extremely unusual variants. This allows you to quickly realise your creative ideas and explore completely new delay worlds. The open feedback path makes it possible: here you can simply insert plugins as you wish!

  The DelayPro feedback path gives you the freedom to insert other plugins such as EQ, pitch, saturator, reverb, modulation and gate. This allows you to achieve any sound you want with just a few clicks. Your perfect retro tape delay? Just insert a Saturator with the Tape algorithm, add some EQ and modulation if you like, and you're done!

  Sci-fi warp delay? PitchMacro, AlgoVerb and MultiMod in feedback mode will beam you there! The ultimate vocal delay for ballads? Ping-pong with panning, CompSum, chorus and IR-Verb. You can also find inspiration in our presets developed in the HOFA-Studios!

  The bucket/noise function of the HOFA SYSTEM DelayPro allows you to create timeless and characterful delays, perfect for audio engineers looking for something special. DelayPro offers an authentic emulation of this analog delay system, in which the audio signal is progressively passed through a chain of capacitors. You can choose from four different sound variants: Neutral, Modern, Standard and Vintage. You'll love these warm, organic delays with interesting noise and artifacts.

  All plugins from the HOFA SYSTEM series are also available as freeware with a slightly limited feature set. Simply install HOFA SYSTEM using the HOFA-Plugins Manager. You can then use all freeware features immediately. In the freeware version only one plugin can be inserted in the feedback chain, while the full version allows an unlimited number.
specs: |-
  - Adjustable delay time from 1.5 ms to 5000 ms
  - Tempo sync with offset time for driving and sluggish echoes
  - Tap button
  - Feedback from 0 to 150%, up to self-oscillation
  - 5 feedback modes: 1x normal, 4x ping-pong
  - Open feedback path: EQ, pitch, saturator, reverb, modulation and gate plugins can be inserted
  - Unlimited insertable plugins in the feedback chain (freeware version: 1 plugin)
  - Bucket brigade emulation with noise function and 4 styles: Neutral, Modern, Standard, Vintage
  - Hi- and low-cut in the feedback path
  - Delay visualisation
  - Formats: VST3, AU, AAX
  - Operating System: macOS 10.13 or later, Windows 10 or later
  - Continuously tested on Ableton Live, Apple Logic, Avid Pro Tools, Bitwig, Cockos Reaper, Image Line FL Studio, Magix Samplitude/Sequoia, Fender Studio Pro, Steinberg Cubase/Nuendo/Wavelab
  - Two licenses per purchase, managed via the HOFA Plugins Manager, offline activation supported
  - 14 days free trial
