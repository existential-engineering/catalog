description: SYSTEM DelayPro is a delay plugin with an open feedback path into
  which other plugins (EQ, pitch, saturator, reverb, modulation, gate) can be
  inserted. It offers 4 ping-pong modes, feedback up to 150%, tempo-synced delay
  times, and a bucket-brigade mode for vintage noisy delays. Also available as
  freeware with a reduced feature set.
details: |-
  With the HOFA SYSTEM DelayPro, you not only get all the standard delay sounds, but also extremely unusual variants. This allows you to quickly realise your creative ideas and explore completely new delay worlds. The open feedback path makes it possible: here you can simply insert plugins as you wish! Easy-to-use delay plugin with spectacular sound options. Plugins such as EQ, pitch, saturator, reverb, modulation and gate can be used in the feedback path. 4 ping-pong modes, feedback up to 150%, delay time with sync. Bucket brigade mode for great, noisy vintage delays. Also available in a freeware version with slightly reduced feature set SYSTEM DelayPro – feature overview and sound samples Video content: Sound samples Setting the delay time Feedback control Ping-pong styles Bucket & noise function Dry/wet Hi & low-cut Open feedback path Parameter modulation Ultimate flexibility in the feedback path The DelayPro feedback path gives you the freedom to insert other plugins such as EQ, pitch, saturator, reverb, modulation and gate. This allows you to achieve any sound you want with just a few clicks. Your perfect retro tape delay? Just insert a Saturator with the Tape algorithm, add some EQ and modulation if you like, and you're done! Sci-fi warp delay? PitchMacro, AlgoVerb and MultiMod in feedback mode will beam you there! The ultimate vocal delay for ballads? Ping-pong with panning, CompSum, chorus and IR-Verb. You can also find inspiration in our presets developed in the HOFA-Studios! Bucket brigade delay The bucket/noise function of the HOFA SYSTEM DelayPro allows you to create timeless and characterful delays – perfect for audio engineers looking for something special. DelayPro offers an authentic emulation of this analog delay system, in which the audio signal is progressively passed through a chain of capacitors. You can choose from four different sound variants: Neutral, Modern, Standard and Vintage. You'll love these warm, organic delays with interesting noise a
