details: >-
  At its core, 'apm live' is a universal mod wheel using a polished
  time-stretching algorithm for modulating pitch in realtime. Which is useful
  all in itself and would be a powerful and unique plugin even without it's
  magic autopilot feature.


  Sit back and watch as apm live analyzes your sound, automatically moving the
  mod wheel for you. Adjust sensitivity, wheel weight, and use the detection
  filter to tailor autopilot's response.


  Choose when the mod wheel moves, set modulation speed, range, and change the
  modulation shape effortlessly. The modulation is displayed on a simple display
  and can be changed to different ranges to suit your modulation amount.


  Apm live by carp audio is a virtual effect audio plugin for macos and windows.
  It functions as an audio units plugin and a VST 3 plugin.


  Usecases: (live) instruments. Vocals. Synths. Experiment with it on any
  source!
specs: |-
  - Universal mod wheel
  - Time-stretching algorithm
  - Realtime pitch modulation
  - Autopilot feature
  - Mod wheel control
  - Modulation range
  - Modulation rate
  - Modulation speed
  - Sync to project tempo
  - Sync rate
  - Modulation shape (sine, triangle, ramp, saw, square)
  - Wheel weight
  - Sensitivity control
  - Detection filter
  - Bandpass filter
  - Audio units plugin
  - VST 3 plugin
  - Macos support
  - Windows support
  - Universal 2 binary
