  1990 Modern Grand C7 Prepared

  The 1990 Modern Grand C7 Prepared Piano is a masterpiece of deep-sampled Prepared Piano artistry. This prepared piano captures the essence of unconventional piano playing, from guitar picks to ping pong balls and everything else unorthodox. With 19 Parts, it's an extraordinary experience with enormous possibilities. The 1990 Modern Grand C7 Piano was meticulously recorded with top studio microphones, including Neumann u87's, KM 184's, Neve SE Ribbons, and AKG 414's. Soundpaint's magic amplifies the potential, offering dynamic response control, sound morphing, time manipulation, and so much more. From adjusting attacks to shaping tones, it's all at your fingertips for effortless creativity. This piano stands out not just for its remarkable recordings and Programs, but for the features that empower you to sculpt your desired sound with ease. Whether you're shaping resonance, pedal volume, or even the tactile key-touch sounds, the 1990 Prepared Grand Piano transforms complexities into intuitive playing. No engineering degree required. It all just makes sense.
