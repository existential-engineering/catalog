details: >-
  Arpg8r by pentacom is a virtual instrument audio plugin for macos and windows.
  It functions as a VST plugin and an audio units plugin.


  Arpg8r is a MIDI arpeggiator with 32 steps on/off pad and 5+1 arpeggio mode
  options including up, down, up/down, manual, poly and custom modes.


  The custom mode is a programmable arpeggio mode that allows users to create
  custom arpeggio patterns.


  Features include shuffle and gate length control for dynamic arpeggio
  manipulation.


  The plugin includes an insert note function and internal oscillator for
  comprehensive arpeggio generation and sound design.
specs: |-
  - MIDI arpeggiator
  - 32 steps on/off pad
  - 5+1 arpeggio mode (up, down, up/down, manual, poly and custom)
  - Custom programmable arpeggio mode
  - Shuffle control
  - Gate length control
  - Insert note function
  - Internal oscillator
  - VST plugin
  - Audio units plugin
  - Macos compatible
  - Windows compatible
