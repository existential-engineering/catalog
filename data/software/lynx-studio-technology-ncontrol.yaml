details: |-
  NControl is a free Windows and Mac application from Lynx that allows extensive control, monitoring and visual reference when using the Lynx Aurora(n).

  NControl allows per output routing of any available input channel by extending the Aurora(n)'s already impressive everything-to-everything routing and extensive metering capabilities to include independent level control for every channel and full panning for each input to output channel. Channel pairs may be linked together to have both the left and the right channels work together, or unlinked to allow independent control over each mono channel. As with Aurora(n) itself, the Headphone output and any available digital inputs only show up on NControl.

  The preamp input panel allows detailed control of each preamp.
specs: |-
  - Free Windows and Mac application for the Lynx Aurora(n)
  - Per output routing of any available input channel, with independent level control for every channel
  - Full panning for each input to output channel
  - Channel pairs may be linked for stereo operation or unlinked for independent mono control
  - Headphone output and available digital inputs appear only in NControl
  - Preamp input panel control: input gain
  - Preamp input panel control: Mic/Line/Hi-Z selection
  - Preamp input panel control: 20 dB pad
  - Preamp input panel control: 48V phantom power supply
  - Preamp input panel control: phase reverse
  - Preamp input panel control: lo-cut
