details: |-
  BagPipes is a sample based instrument. Its specialized control engine makes it
  easy to play authentic sounding bagpipe styles and techniques on a simple MIDI
  keyboard with just basic modulator input through pitch bend and modulation
  wheel.

  The bagpipes may be used to play authentic parts with convincingly sounding
  ornaments, cuts, taps and staccato runs. A specially designed pipe filter adds
  another layer of realism to vibrato, fades and pitch slides.

  The bagpipes instrument includes six distinctly sounding pipes from different
  european traditions (it is possible to switch instruments while playing):
  galician gaita. Swedish saeckpipa. Bock (germany). Flemish pipe. German
  shepherds pipe. Bohemian dudy.

  True drone instrument behaviour. Attack noise variation for naturally sounding
  trills and ornaments. Vibrato, bag pressure and two user configurable chanter
  modulators are controllable through MIDI.

  Rate and amplitude of the random drift modulator can be fine tuned to simulate
  different stages of the pipers proficiency and drunkenness. All modulators act
  simultaneously on pitch, volume and tone color for increased realism. Very low
  demands on cpu and memory.
specs: |-
  - Sample-based instrument


  - MIDI keyboard compatible

  - Pitch bend modulation

  - Modulation wheel control

  - Six bagpipe types (galician gaita, swedish saeckpipa, bock, flemish pipe,
  german shepherds pipe, bohemian dudy)

  - Drone instrument behaviour

  - Attack noise variation

  - Vibrato control

  - Bag pressure control

  - Chanter modulators

  - Random drift modulator

  - Low cpu and memory demands
