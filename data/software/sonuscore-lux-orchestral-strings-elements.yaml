description: Download LUX Orchestral Strings Elements free. All five string sections, four core articulations, same recordings as the full library. Start writing now.
details: |-
  LUX Orchestral Strings Elements is the free version of Sonuscore's LUX Orchestral Strings, a scoring library that has found its way into the templates of working film and television composers since launch. Elements is positioned as a way in rather than a demo: it carries the core string sections and the same recordings as the flagship, and enough material to start writing real cues in a session.

  All five string sections are included, 1st Violins, 2nd Violins, Violas, Celli and Basses, so a full orchestral string body can be written for rather than a set of isolated patches. Four core articulations cover most common string writing: Sustain, Spiccato, Tremolo and Sul Ponticello Tremolo, which between them handle melodic lines, rhythmic figures and sustained tension textures.

  The sample source and cinematic mix are identical to the full library, so what Elements sounds like is what LUX sounds like. A one-octave 1st Violin legato passage is included to show the phrasing and transitions before the full range is unlocked in the paid version.

  It runs in the free Native Instruments KONTAKT Player from version 7.10.9 upward, is installed through Native Access, and works offline once installed, with an internet connection needed only for the initial download. The full version adds legato across all sections, the complete articulation palette and extended techniques, live-recorded elements, the ensemble instrument and four microphone positions.
specs: |-
  - All five string sections: 1st Violins, 2nd Violins, Violas, Celli and Basses
  - Four core articulations: Sustain, Spiccato, Tremolo and Sul Ponticello Tremolo
  - Same sample source and cinematic mix as the full LUX Orchestral Strings library
  - One-octave 1st Violin legato demo (full legato range is in the full version)
  - Works with the FREE KONTAKT PLAYER
  - Requires KONTAKT Version 7.10.9 or higher
  - Installed via Native Access and runs fully offline once installed
  - Apple Silicon Macs: macOS 13, 14 or 15 (latest update)
  - Intel Macs (i5 or higher): macOS 13, 14 or 15 (latest update)
  - Windows 10 or 11 (latest Service Pack), Intel Core i5 or equivalent CPU
  - Graphics hardware support for OpenGL 2.1 or higher and Direct 3D 11.1
  - 8 GB RAM (more recommended)
