details: |-
  Multi-FX Blaster is a versatile and creative multi-effects plugin built for modern electronic music production. Designed for speed and inspiration, it lets you build complex effect chains using 4 interchangeable FX slots and a collection of 18 professional audio effects.

  From subtle modulation and spatial effects to heavy distortion and rhythmic processors, Multi-FX Blaster is the ultimate tool for transforming sounds, creating transitions, and shaping unique textures in seconds.

  Perfect for Techno, Acid, Trance, EDM, Industrial, Hardcore, Rave, and cinematic sound design, Multi-FX Blaster delivers powerful results with a fast and intuitive workflow. Whether you want to add movement, punch, space, or extreme destruction to your sounds, Multi-FX Blaster gives you total creative control.

  The included effects cover spatial and modulation (Reverb, SynthVerb, ST Chorus, Flanger, Phaser, Vibrato, Auto Pan), distortion and color (DistoFuzz, RageClip, 4Band-Fuzz, Overdrive, Bit Reducer), filters and tone (LP Filter, HP Filter, BP Filter) and creative and rhythmic processors (Delay, Gater, Looper). Each effect comes with dedicated parameters and can be placed freely in any slot of the FX chain for endless combinations.
specs: |-
  - 4 interchangeable FX slots
  - 18 high-quality built-in effects
  - Flexible FX chain routing
  - Instant sound design possibilities
  - Preset system for fast workflow
  - Random function for inspiration
  - Clean and modern interface
  - Lightweight and CPU efficient
  - Spatial and modulation effects: Reverb, SynthVerb, ST Chorus, Flanger, Phaser, Vibrato, Auto Pan
  - Distortion and color effects: DistoFuzz, RageClip, 4Band-Fuzz, Overdrive, Bit Reducer
  - Filter and tone effects: LP Filter, HP Filter, BP Filter
  - Creative and rhythmic effects: Delay, Gater, Looper
  - System requirements: Windows, macOS and Linux, VST/VST2/Audio Unit/AAX/CLAP compatible DAW
