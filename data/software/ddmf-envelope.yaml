description: "A true stereo reverb effect designed to add air and dimension
  without harshness, featuring a zero-latency reverb algorithm with 8 true
  stereo environments."
details: |-
  8 true stereo reverb environments
  Size and Depth controls
  Exponential and linear decay modes
  Low/high-cut EQ
  Stereo width control (mono to full stereo)
  Wet/dry balance
  30 presets included
  Zero-latency algorithm
specs: |-
  - Zero-latency reverb algorithm
  - 8 true stereo environments
  - Size and Depth controls per environment
  - Exponential and linear decay modes
  - Low-cut and high-cut EQ controls
  - Stereo width control (full stereo to full mono)
  - Wet/dry balance control
  - 30 included presets
  - 32-bit and 64-bit support
  - Mac: OSX 10.7+, Intel and Apple Silicon supported
  - Linux: ARM and x86_64 (VST3 only)
  - iOS: AUv3 format
