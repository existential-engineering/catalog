description: An emulation of the warm, clean tones and lush reverb of a classic 1972 Fender Twin Reverb combo guitar amplifier. Features dual channels with individual tone stacks, spring reverb, vibrato/tremolo effects, and an impulse response loader.
details: |-
  - The Double Reverb Guitar Amplifier is a faithful emulation of the iconic 1972 Fender Twin Reverb, one of the most beloved clean amplifiers in guitar history. It captures the warm, crystalline clean tones and lush spring reverb that made the original a staple on stages and in studios for decades.
  - The plugin features dual channels — Normal and Vibrato — each with individual volume and tone stack controls, faithfully reproducing the original amplifier's two distinct voices. The Vibrato channel includes the classic vibrato/tremolo modulation effect with speed and intensity controls.
  - A comprehensive cabinet section offers six guitar cabinet choices paired with four microphone emulations, including axis positioning control for precise tonal shaping. An impulse response loader supports up to three custom IRs, enabling users to blend their own cabinet sounds with the built-in options.
  - Additional signal processing tools include a noise gate with threshold, range, and speed parameters, plus Tight, Rumbling, and Harsh filter options for fine-tuning the low-end and high-end response of the amplifier's character.
  - The plugin is available as a desktop plugin for Mac and Windows in AU, VST2, VST3, and AAX formats, and also as a standalone iOS app for iPhone and iPad on the Apple App Store.
specs: |-
  - Mac: OS 10.13 or newer (64-bit DAW required)
  - Windows: Windows 7 or newer (64-bit DAW required)
  - RAM: 1 GB minimum
  - Formats: AU, VST2, VST3, AAX
  - iOS: Available on Apple App Store
  - Dual channels: Normal and Vibrato
  - Six guitar cabinet emulations
  - Four microphone emulations with axis positioning
  - Impulse response loader (supports 3 custom IRs)
  - Spring reverb emulation
  - Vibrato/tremolo modulation
  - Noise gate with threshold, range, and speed controls
  - Filters: Tight, Rumbling, Harsh
