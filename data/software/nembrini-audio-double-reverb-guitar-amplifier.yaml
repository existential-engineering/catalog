description: Nembrini Audio's Double Reverb Guitar Amplifier is modeled after the vintage Fender Twin Reverb crafted in 1972, with warm clean tones, lush spring reverb and vibrato.
details: |-
  "Warm, clean tones and lush reverb of a classic twin combo guitar amplifier."

  Nembrini Audio's Double Reverb Guitar Amplifier is modeled after the vintage Fender Twin Reverb* crafted in 1972. Double Reverb features two channels, Normal and Vibrato. Each channel has its own volume control and tone stack (Bass, Middle, Treble).

  The built-in spring reverb is one of the standout features of the Double Reverb. It's known for its lush, spacious sound, which can range from a subtle shimmer to a full, surf-style wash. Double Reverb also includes a vibrato (tremolo) effect, which modulates the amplitude of the signal to create a pulsating sound.

  Filters include Tight, which reduces low frequency content tightening the low range, Rumbling, which reduces the low-frequency content, and Harsh, which reduces the high-frequency content. The Noise Gate offers Threshold to define the level where the gate is activated, Range to select the quantity of noise reduction, and Gate to adjust the gate speed.

  With Nembrini Audio Double Reverb Guitar Amplifier it is possible to choose between six different guitar cabinets, four microphone emulations with on/off axis position switch, continuous position and distance knobs. A complete Mixer section with Solos, Mutes, Pans and Faders allows you to blend together the two microphones with the ambience. The Impulse Loader lets you load up to three third-party impulse responses that you can even blend together using volume, pan, phase, solo and mute controls.

  Legal Disclaimer: Fender Twin Reverb is a registered trademark of Fender Musical Instruments Corporation. Double Reverb was developed by Nembrini Audio SRL based on its own modelling techniques. Fender Musical Instruments Corporation has not endorsed nor sponsored the Double Reverb in any manner, nor licensed any intellectual property for use in this product.
specs: |-
  - Modeled after the 1972 Fender Twin Reverb
  - Two channels, Normal and Vibrato, each with its own volume and Bass/Middle/Treble tone stack
  - Built-in spring reverb
  - Vibrato (tremolo) effect
  - Filters: Tight, Rumbling, Harsh
  - Noise gate with Threshold, Range and Gate speed controls
  - Six guitar cabinets with four microphone emulations, on/off axis switch, position and distance knobs
  - Mixer section with solos, mutes, pans, faders and ambience blending
  - Impulse response loader for up to three third-party IRs with volume, pan, phase, solo and mute
  - Free impulse responses included
  - iOS version for iPhone and iPad
  - Requires a VST2, VST3, AAX or AudioUnits compatible host
  - Intel compatible or Apple Silicon CPU, 1GB RAM
  - Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
