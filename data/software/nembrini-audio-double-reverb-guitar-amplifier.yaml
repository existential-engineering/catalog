details: |-
  Nembrini Audio's Double Reverb Guitar Amplifier is modeled after the vintage Fender Twin Reverb* crafted in 1972. Double Reverb features two channels - Normal and Vibrato. Each channel has its own volume control and tone stack (Bass, Middle, Treble). The built-in spring reverb is one of the standout features of the Double Reverb . It's known for its lush, spacious sound, which can range from a subtle shimmer to a full, surf-style wash.
