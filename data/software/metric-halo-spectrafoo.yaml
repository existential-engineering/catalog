details: |-
  SpectraFoo provides standards-based level metering, high-speed and high-resolution spectral analysis, the Phase Torch, correlation metering, a triggerable waveform display, power balancing and a variety of power, envelope and spectral histories, plus phase analysis on any number of input or output channels. It is used around the world for analysis in mixing, mastering, acoustic analysis, live audio and electronics. Windowsets arrange any combination of analysis instruments and recall saved combinations from a menu or key command, link groups selectively link the controls of multiple instruments, and up to 24 independent analysis channels are supported.

  The Standard edition carries more than 15 individual metering tools. The three-in-one digital level meter simultaneously displays Peak, RMS and VU levels, referenced against 0dBFS, with independent resettable peak hold functions and a counter of the largest number of consecutive samples surpassing 0dBFS. The Peak and RMS Power History shows the history of those levels over time, where the ratio between them indicates the perceived volume of the program material.

  The Spectragraph is a realtime spectrum analyzer resolving widths as small as two thirds of a hertz, creating a new analysis up to 84 times per second, and is customizable with Peak, Instantaneous and Average traces. The Spectragram is a realtime spectral power history analyzer using the same FFT resolution and scale to correlate frequency, power and time, which is effective for identifying frequency overlap and masking between tracks. Further instruments include Power Balance History, a triggering oscilloscope with nine trigger modes, the Lissajous Phase Scope, the Phase Torch, which compares phase difference between two channels as a function of frequency independent of power, Correlation Meter and History, Band Power History down to a twelfth of an octave at 6kHz, and Envelope History.

  SpectraFoo Complete adds tools for measuring an acoustic environment or verifying the behaviour of external digital devices. It includes a high-resolution multi-tone, multi-noise, sweepable and burstable signal generator, running in real time or striping signal into a capture or an AIFF or SDII file, with 24-bit generation, up to nine simultaneous sine sweeps, pink and white noise, burst generation and FFT synchronized sine generation.

  Complete also adds a Transfer Function Measurement System showing the relative power and phase response between source and response signals, using Metric Halo's Music Based Measurement so that music acts as the test tone, with a Delay Detection feature that time-aligns the two signals by correlation. A RAM-based capture and static analysis system records audio for detailed non-realtime analysis, referenced to the timecode of the source material, with manual, timecode-based auto-punch and level-based auto-punch modes, plus data slicing that updates the realtime instruments from the cursor position. Code-level metering adds a Bit Range Meter, a Bit Scope and a Bit Matrix Meter with instantaneous and accumulation modes.
