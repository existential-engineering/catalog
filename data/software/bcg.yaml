name: BCG
manufacturer: code-audio
primaryCategory: synthesizer
description: BCG is a single oscillator monosynth with a two stage multimode
  filter (LP, BP, br and HP), semi fixed envelopes and overdrive distortion.
details: |-
  On top of that it has a two voice stereo chorus and delay to give the sound
  more depth.

  Bcg is a windows vsti made with synthedit, featuring dsp design by lee stacey,
  david haupt, chris kerry and jeff mcclintock.
specs: |-
  - Single oscillator monosynth
  - Two stage multimode filter (LP, BP, br, HP)
  - Semi fixed envelopes
  - Overdrive distortion
  - Two voice stereo chorus
  - Delay
  - Windows vsti
  - Synthedit
