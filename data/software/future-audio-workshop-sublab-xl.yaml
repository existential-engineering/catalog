description: SubLab XL is the ultimate all-in-one tool for low-end production, designed to create powerful 808s and unique sub-basses. An expanded version of SubLab featuring three sound engines — an analog-style synth oscillator with supersaw and Super Oscillator for unison layering, a sample engine with automatic pitch detection, and the X-Sub™ psychoacoustic bass oscillator — combined with a mix-and-match FX chain, LFO modulation, an analog-modeled filter, and a customizable macro page. Includes 10 signature Bass Packs and 100+ presets.
details: |-
  Synth Engine: analog-style oscillator with sine, triangle, sawtooth, square, and supersaw; Super Oscillator for unison voices with tuning, detuning, dry/wet mix, and width control

  Sample Engine: automatic pitch detection, root note and fine-tune, X-Fade, reverse, delayed sample start, internal maximizer, loop mode, lo-cut/hi-cut filtering, drag-and-drop sample support

  X-Sub™ Engine: psychoacoustic sub-bass oscillator that always keeps notes in the sub range, with harmonic control

  FX (mix and match up to four, rearrangeable): 6 distortion flavors (TubeA, TubeB, Orange, Darkdrive, Overdrive, Grunge); Waveshaper (sine fold, wavefolder, linear fold); Tape (hiss, wobble); 2x Bitcrusher (hardcore, redux); 10 Noise flavors; Compressor with auto-sidechain; Analog-modeled filter (low pass, band pass, high pass)

  LFO Modulation: modulate up to two parameters at a time, 18 routing options, sine/triangle/saw/square/noise waveforms, rate control and BPM sync

  Macro Page: 2 macros automatically mapped for all presets, drag-and-drop mapping to any parameter, up to 10 parameters per macro

  Meter/Master: low shelf and high shelf EQ, master maximizer, true peak value meter

  10 Bass Packs: Reese Bass, Crushed, This Hits Hard, Sean Divine Signature, Supersaw, Richie Souf, Analog Machines, Pure Subs, Future 808s, Traptendo; 100+ presets

  Samples from: Minimoog, Roland TR-8, Roland TR-808, Roland TR-909, Roland TR-707, Waldorf Blofeld, Jomox MBase 11, MFB 522, Nord Lead, Noise Engineering Basimilus Iteritas, Befaco Kickall, Intellijel Dixie, Hexinverter BD9, Mutable Instruments Plaits, Dave Smith Tempest, Korg Volca Beats, Korg Volca Kick, Vermona Mono Lancet '15

  Fully resizable interface; editable glide curves; BPM-synced glide; global tuning; octave offset; tuning scale settings

  Activation allows use on up to 3 computers simultaneously
