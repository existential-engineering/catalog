description: "The ultimate all-in-one tool for low-end production, designed to
  create powerful 808s and unique sub-basses. An expanded version of SubLab
  featuring an analog-style oscillator with supersaw, Super Oscillator for
  unison layering, automatic pitch detection in the sample engine, X-Sub
  psychoacoustic bass, up to 4 mix-and-match effects including 6 distortion
  flavors plus waveshaper, tape, and bitcrusher, LFO modulation with 18 routing
  options, and a customizable macro page."
details: |-
  Analog-style oscillator with sine, triangle, sawtooth, square, and supersaw; Super Oscillator for unison voices with tuning, detuning, and width

  Automatic pitch detection, root note and fine-tuning, reverse, delay start, loop modes, internal maximizer

  Psychoacoustic sub-bass oscillator maintaining sub-range frequencies

  Up to 4 simultaneous: 6 distortion flavors (TubeA, TubeB, Orange, Darkdrive, Overdrive, Grunge), Waveshaper, Tape, 2 Bitcrusher variants, Noise (10 flavors), Compressor with auto-sidechain, Analog-modeled filter

  LFO with 18 routing options

  2 customizable macros, up to 10 parameters each

  Master EQ and maximizer

  Fully resizable

  10 Bass Packs (Reese Bass, Crushed, This Hits Hard, Sean Divine Signature, Supersaw, Richie Souf, Analog Machines, Pure Subs, Future 808s, Traptendo), 100+ presets, samples from Minimoog, Roland TR-808/TR-909/TR-707, Waldorf Blofeld, Nord Lead, Korg Volca and 10+ additional hardware
