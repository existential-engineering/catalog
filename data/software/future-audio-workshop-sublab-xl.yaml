description: SubLab XL is the ultimate all-in-one tool for low-end production, designed to create powerful 808s and unique sub-basses. An expanded version of SubLab featuring three sound engines — an analog-style synth oscillator with supersaw and Super Oscillator for unison layering, a sample engine with automatic pitch detection, and the X-Sub™ psychoacoustic bass oscillator — combined with a mix-and-match FX chain, LFO modulation, an analog-modeled filter, and a customizable macro page. Includes 10 signature Bass Packs and 100+ presets.
details: |-
  Your new sub superpower. SubLab just got a lot more XL, with new sonic possibilities for creating subs and 808s of the future. Get all the tools you need to sample, stack synth voices, modulate, widen, and layer FX. Stay in the flow on the macro page and tweak over 100 meticulously crafted presets, or sculpt your own uniquely powerful subs in the expanded synth.

  Three sound engines drive it: a Sampler with automatic pitch detection, root note and fine tune, X-Fade, reverse, delayed sample start, an internal maximizer, loop mode and lo/hi-cut filtering; an analog-style Synth engine with sine, triangle, sawtooth, square and supersaw options plus a Super Oscillator for layering unison voices with tuning, detuning, dry/wet mix and widening; and the X-Sub psychoacoustic sub-bass oscillator that always keeps notes in the sub range with control over the exact harmonics.

  FX can be mixed, matched and rearranged, up to four at a time: six distortion flavors (TubeA, TubeB, Orange, Darkdrive, Overdrive, Grunge), a Tape module with hiss and wobble, a Waveshaper with sine fold, wavefolder and linear fold, two bitcrusher flavors (hardcore and redux) with decimation and bit mode, ten noise flavors, and a compressor with auto sidechain and parallel mix. LFO modulation covers up to two parameters at a time with 18 routing options, five waveforms, and rate control with BPM sync.

  It ships with 10 all new signature Bass Packs (Reese Bass, Crushed, This Hits Hard, Sean Divine Signature, Supersaw, Richie Souf, Analog Machines, Pure Subs, Future 808s, Traptendo) and hundreds of exclusive kick drum, kick transient and 808 samples recorded from analog drum machines and modulars including the Minimoog, Roland TR-808, TR-909, TR-707 and TR-8, Waldorf Blofeld, Jomox MBase 11, MFB 522, Nord Lead, Noise Engineering Basimilus Iteritas, Befaco Kickall, Intellijel Dixie, Hexinverter BD9, Mutable Instruments Plaits, Dave Smith Tempest, Korg Volca Beats, Korg Volca Kick and Vermona Mono Lancet '15. SubLab factory packs and expansion packs can be imported into SubLab XL.

  A macro page transforms sounds without interrupting the flow, with 2 macros automatically mapped for every preset, drag-and-drop assignment of up to 10 parameters each, and a musically responsive blob with customizable colors and textures. Rounding it out are an analog-modelled filter with low pass, band pass and high pass shapes, low and high shelf EQ with a frequency and note cursor display overlaying the Synth, Sample and X-Sub engine frequencies across three bands, a master maximizer and a true peak meter. You receive an activation code instantly, good for up to three computers at a time, and a 30-day no-questions-asked refund.
specs: |-
  - Available as VST2, VST3, AU, AAX
  - Tested in FL Studio, Ableton Live, Logic, Studio One, Pro Tools and Cubase
  - Compatible with macOS 10.12 and higher, 64-bit Intel processor or M1
  - Compatible with Windows 8 and higher
  - Can be used offline, but an internet connection is required to activate
  - Activation code covers up to three computers at a time
  - 3 sound engines: Sampler, Synth and X-Sub
  - 10 all new signature Bass Packs with 100+ presets
  - Hundreds of exclusive kick, kick transient and 808 samples recorded from analog drum machines and modulars
  - Mix and match up to four FX, rearrangeable in any order
  - 6 distortion flavors, waveshaper, tape, 2 bitcrusher flavors, 10 noise flavors, compressor with auto sidechain
  - LFO modulation: 2 simultaneous targets, 18 routing options, 5 waveforms, BPM sync
  - Macro page with 2 macros, up to 10 parameters mapped per macro
  - Analog modelled filter with low pass, band pass and high pass shapes
  - Low and high shelf EQ, master maximizer, true peak meter
  - Fully resizable interface, editable glide curves, BPM synced glide times, global and fine tuning, octave offset, tuning scale settings
  - Patch browsing with pack icons, favorites, and user-created patch packs; SubLab factory and expansion packs importable
  - 30 day refund policy
