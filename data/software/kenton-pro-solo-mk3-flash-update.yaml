url: https://kentonuk.com/product/pro-solo-mk3-flash-update/
description: Firmware flash update for the Pro Solo mk3, applying to serial
  numbers P3-9353 upwards only. It can be applied with the browser-based Pro
  Solo mk3 Configuration Manager or from a direct firmware download.
details: |-
  A firmware update for the Pro Solo mk3, offered both through the Pro Solo mk3 Configuration Manager and as a direct firmware download, so the owner installs it themselves rather than returning the unit. The Configuration Manager runs in Chrome, Edge or Firefox.

  The update applies to serial numbers P3-9353 upwards only. There is no firmware update for serial numbers below P3-9353.

  Firmware version 2008 added 1.1, 1.3, 1.4 and 1.5 V/Oct scalings, and Auto Portamento on the Aux Controllers for MC-202 and TB-303 users.

  The same release changed several behaviours around updating and editing. The Pro Solo mk3 now restarts after a successful firmware upgrade, a parameter value changed over SysEx is cleared from the display after five seconds, and the Version Request and Firmware Update SysEx messages support a separate device ID.
specs: |-
  - Applies to Pro Solo mk3 serial numbers P3-9353 upwards only
  - No firmware update exists for serial numbers below P3-9353
  - Latest listed firmware version 2008
  - Adds 1.1, 1.3, 1.4 and 1.5 V/Oct scalings
  - Adds Auto Portamento to the Aux Controllers for MC-202 and TB-303
  - Version Request and Firmware Update SysEx messages support a separate device ID
  - SysEx parameter changes clear from the display after 5 seconds
  - Pro Solo mk3 Configuration Manager requires Chrome, Edge or Firefox
versions:
  - name: "2008"
