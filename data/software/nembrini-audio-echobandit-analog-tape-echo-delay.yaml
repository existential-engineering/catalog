details: |-
  The Echobandit Plug-ins Pedal is modelled after the original Echobandit by F-Pedals, the combination of both Gold and Silver editions with some extra features. The Echobandit original pedal is in the list of "must-have mini pedals" made by sound guru Pete Thorn.

  The pedal version of the Plug-in includes a FILTER knob control that allows a sound range from the Gold to the Silver version of the original pedal and everything in between.

  It will cover an incredibly wide range of sounds from an awesome classic slapback to experimental modern long distorted sounds. It can be warm and smooth or aggressive and punchy to cover all your possible soundscapes needs.

  The Pedal version features MIX, which sets the balance between the dry input signal and the effect, REPEAT, which sets the amount of the echo repetitions, TAPE, which adds tape fluttering and saturation, TIME, where turning the knob clockwise increases and counterclockwise decreases the speed of the modulation, and a footswitch On/Off that switches the effect in and out of the signal path.
specs: |-
  - Modelled after the F-Pedals Echobandit, combining the Gold and Silver editions
  - FILTER knob sweeps from the Gold to the Silver voicing and everything in between
  - MIX: balance between dry input signal and effect
  - REPEAT: amount of echo repetitions
  - TAPE: adds tape fluttering and saturation
  - TIME: sets the speed of the modulation
  - Footswitch On/Off switches the effect in and out of the signal path
  - Requires a VST2, VST3, AAX or AudioUnits compatible host
  - Intel compatible or Apple Silicon CPU, 1GB RAM
  - Mac OS 10.13 or newer, Windows 7 or newer, 64-bit DAW
