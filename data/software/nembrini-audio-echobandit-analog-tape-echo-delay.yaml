description: The Echobandit Plug-ins Pedal is modelled after the original Echobandit by F-Pedals , the combination of both Gold and Silver editions withs some extra features. The Echobandit original pedal is in the list of “must-have mini pedals” made by sound guru Pete Thorn . The pedal version of the Plug-in includes a FILTER knob control that allows a sound range from the Gold to the Silver version of the original pedal and everything in between. It will cover an incredibly wide range of sounds from an awesome classic slapback to experimental modern long distorted sounds. It can be warm and smooth or aggressive and punchy to cover all your possible soundscapes needs.
details: |-
  - Echobandit is modelled after the original Echobandit by F-Pedals, a boutique analog tape echo delay pedal. The plugin faithfully captures the character of both the Gold and Silver hardware editions in a single plugin.
  - A dedicated FILTER knob allows blending between the sonic character of the Gold and Silver versions — from warm and smooth on one end to aggressive and punchy on the other. This gives players a wide tonal range within a single effect.
  - The TAPE knob adds authentic tape fluttering and saturation, bringing the imperfections and warmth that define the analog tape echo sound. Combined with the TIME knob for modulation speed control, the plugin can produce everything from tight slapback to swirling, rhythmic repeats.
  - A FOOTSWITCH control enables bypassing the effect on/off, mirroring typical pedalboard workflow. The MIX knob balances the dry input signal with the wet effect, and REPEAT controls the number of echo repetitions from a single tap to infinite self-oscillation.
  - Echobandit is available in AU, VST2, VST3, and AAX formats for macOS (10.13+) and Windows (7+), requiring a 64-bit DAW and at least 1GB of RAM.
