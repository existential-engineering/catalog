description: "The Echobandit Plug-ins Pedal is modelled after the original
  Echobandit by F-Pedals , the combination of both Gold and Silver editions
  withs some extra features. The Echobandit original pedal is in the list of
  “must-have mini pedals” made by sound guru Pete Thorn . The pedal version of
  the Plug-in includes a FILTER knob control that allows a sound range from the
  Gold to the Silver version of the original pedal and everything in between. It
  will cover an incredibly wide range of sounds from an awesome classic slapback
  to experimental modern long distorted sounds. It can be warm and smooth or
  aggressive and punchy to cover all your possible soundscapes needs."
details: |-
  The Echobandit original pedal is in the list of “must-have mini pedals” made by sound guru Pete Thorn . The pedal version of the Plug-in includes a FILTER knob control that allows a sound range from the Gold to the Silver version of the original pedal and everything in between. It will cover an incredibly wide range of sounds from an awesome classic slapback to experimental modern long distorted sounds. It can be warm and smooth or aggressive and punchy to cover all your possible soundscapes needs. Good little delay to put in an FX chain. I got it in a bundle with it's big sibling. Both useful Oldskool delays 👍 This plug is awesome and I use it a lot .I also have acoustic voice which is also very useful to textures my sounds on the guitar rob ! Canada !
