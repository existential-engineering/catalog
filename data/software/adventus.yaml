details: >-
  Adventus by softplug.com is a virtual instrument audio plugin for windows. It
  functions as a VST plugin.


  The main feature of this synthesizer is its sound: it has a va sound that
  immediately gets your attention. Quality oscillators and filters and
  outstanding on-board effects combine to create a very nice-sounding synth.


  The filters are really high quality as well. These are the kinds of filters
  you want when doing slow filtersweeps, without getting annoying spikes and
  distortion, very impressive for a synth at this price. You can get some cool
  fx with its two lfo's that have complex, assignable source-destination
  mapping.


  One of the more novel things about adventus is that it splits up its effects,
  lfo's and options into different "pages" of the main ui; click the "fx" button
  and you get large displays to tweak the fx, which are very high-quality and
  have lots of parameters.


  The overall tone reminds me of early 80's synths such as roland juno/jupiter
  or ppg wave, with full bottom and bright highs.
specs: >-
  - 6 oscillators with fat options

  - Waveforms: saw, sine, triangle, pulse, ramp, white noise

  - Portamento controls

  - Volume control, fine-tune, semi-tune, pulse width, phase modulation,
  velocity and velo to filter sensitivity, key follow, key-track

  - 6 resonant filters: 12db, 24db, moog filter types: 3 different low pass,
  high pass, band pass, band reject

  - Adsrs with parameter locking facility

  - Amplifiers with controls for attack, decay, sustain, release

  - Modulation with substantial routing options: 2 assignment with 2
  destinations each

  - 2 x lfos with substantial routing options

  - Mode, range, beat step sequencer with control for pitch, filter, and fx
  parameter, phase modulation option

  - Effects: chorus, phaser, twin delay, reverb, phase mod, drive (distortion)

  - 6 note polyphonic

  - Mono/legato/polyphonic control

  - MIDI cc control with learn capability

  - 128 presets

  - VST plugin

  - Windows compatible

  - Virtual instrument audio plugin

  - Arpeggiator
