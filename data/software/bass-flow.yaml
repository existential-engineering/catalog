details: |-
  Bass Flow is a channel strip plug-in designed for mixing bass. It contains 4
  routable processing elements and a master section with input, output, and
  routing controls.

  The bass character is a unique eq that follows the pitch of the note being
  played, allowing you to boost or cut the harmonics within each note and thus
  alter the actual character of the bass sound.

  The spectral bass compressor is a multiband compressor designed especially for
  bass. It allows for applying compression selectively across 6 frequency bands
  focused in the lower end of the spectrum where bass notes mainly reside.

  The equalizer module consists of a 5-band eq with 2 additional filter bands,
  an output trim control, and an optional rta display. Each band has adjustable
  frequency, gain, shape, and q parameters as well as the option to toggle in or
  out.

  The chorus is an effect that can be used to boost overall presence and add
  extra motion to your bass signal. It has detune and delay controls for dialing
  in the effect and a mix control for blending it with the dry signal. The
  chorus effect adds 2 pitch-shifted voices: one above and one below the input
  signal.
