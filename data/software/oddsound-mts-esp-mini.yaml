description: A free DAW plugin that loads .scl, .kbm or .tun files and retunes
  all connected MTS-ESP client plugins, enabling global microtuning across your
  entire session.
details: |-
  MTS-ESP Mini is a free microtuning master plugin that acts as the global tuning source for any MTS-ESP compatible instruments in your DAW session. It loads industry-standard tuning files in .scl (Scala), .kbm (keyboard mapping), .tun, and Anamark TUN .msf formats, then broadcasts the tuning to all connected client plugins in real time.

  The plugin includes a built-in sine/saw synthesizer for auditioning tuning systems directly within the plugin, allowing composers and sound designers to hear their chosen scale or temperament without needing a separate instrument.

  MTS-ESP Mini supports multi-channel mapping, enabling different tunings to be applied across MIDI channels. It also supports MIDI Tuning Standard (MTS) SysEx messages for compatibility with hardware and software that implements the MTS protocol.

  A bypass function is included for instant switching back to standard 12-tone equal temperament (12-TET), and all session state — including loaded tuning files and settings — is stored and recalled with the project. The plugin is designed for minimal CPU overhead and supports Retina/HiDPI displays on both Mac and Windows.
specs: |-
  - Supported tuning file formats: .scl (Scala), .kbm (keyboard mapping), .tun, Anamark TUN .msf
  - Multi-channel KBM mapping support
  - MIDI Tuning Standard (MTS) SysEx transmit and receive
  - Built-in sine/saw synthesizer for tuning audition
  - Bypass function for instant 12-TET return
  - Session state storage and recall
  - Minimal CPU overhead
  - Retina/HiDPI display support (Mac and Windows)
  - Windows: Vista through Windows 11, 32-bit and 64-bit
  - macOS: 10.9 and later, 64-bit only, Intel and Apple Silicon (ARM)
