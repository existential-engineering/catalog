description: VUMT deluxe is an analog style metering and channel tools plugin featuring multiple meter types (VU, RMS, Nordic, DIN, BBC, EBU), frequency weighting, and signal processing tools including filters, dynamic EQ, and mono maker.
details: |-
  VUMT deluxe includes everything from the standard VUMT version plus additional meter types. It offers six metering modes: VU, RMS, Nordic (Type I), DIN (Type I), BBC (Type IIa), and EBU (Type IIb). The standard VUMT features painstakingly modeled behavior and recreation of the general ballistics of classic VU meters.

  In RMS mode, VUMT deluxe adds frequency weighting options including A-, B-, C-, D-, and K-weighting curves. The RMS meter also supports K-12, K-14, and K-20 scales for proper K-metering, with an integrated peak bargraph and selectable +3dB (AES-17) option.

  VUMT deluxe includes channel tools that can be hidden from the GUI when not needed: per-channel Mute and Polarity Reverse buttons, plus a Monitor Section with options to reverse Left and Right channels or monitor only Left, Right, Mid, or Side channels.

  An additional signal processing panel (also hideable) provides HighPass and LowPass filters with variable steepness (6dB, 12dB, 18dB, and 24dB), a single-band Dynamic EQ for removing resonances or de-essing with selectable filter types (HighPass, LowPass, wide or narrow BandPass), and a Mono Maker for narrowing the stereo image below a certain frequency.

  Each of the eight skins in VUMT deluxe offers an additional contrasting meter GUI for the VU display itself. The plugin supports GUI resizing with six size options, a preset browser, editable instance labels, and global settings to customize knob behavior and meter needle refresh rate. A standalone application is included for use with virtual audio cables.
specs: |-
  - Meter types: VU, RMS, Nordic (Type I), DIN (Type I), BBC (Type IIa), EBU (Type IIb)
  - Three different VU implementations to choose from
  - Unique overshoot control and tweakable rise/fallback times for VU mode
  - PPM DIN (Type I) mode with adjustable rise/fallback times
  - RMS meter with selectable +3dB (AES-17) option, adjustable RMS window, integrated peak bargraph
  - K-12, K-14, K-20 scales for K-metering
  - Frequency weighting in RMS mode: A-, B-, C-, D-, and K-weighting curves
  - Fully customizable smart Clip-LED
  - Switchable hold needle showing current max VU value
  - TRIM controls for left, right, mid, and side channels
  - Eight skins each with an additional contrasting meter GUI
  - GUI resizing: 6 different sizes
  - Channel tools: Mute per channel, Polarity Reverse per channel
  - Monitor Section: swap L/R, monitor L only, R only, Mid only, Side only
  - HighPass and LowPass filters with 6dB, 12dB, 18dB, 24dB steepness
  - Single-band Dynamic EQ with HighPass, LowPass, wide or narrow BandPass filter types
  - Mono Maker for narrowing stereo image below a set frequency
  - Preset browser with copy/paste and save as default
  - Standalone application included
