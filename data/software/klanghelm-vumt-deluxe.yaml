description: "Deluxe channel tool plugin expanding on VUMT with comprehensive
  metering types (VU, RMS with K-scales, Nordic, DIN, BBC, EBU), frequency
  weighting curves (A, B, C, D, K), channel tools (mute, polarity reverse,
  monitor section), signal processing (highpass/lowpass filters with variable
  steepness, single-band dynamic EQ, mono maker), eight customizable skins, and
  standalone application."
details: |-
  VU metering with three implementations
  RMS metering with K-12, K-14, K-20 scales and integrated peak bargraph
  Nordic (Type I), DIN (Type I), BBC (Type IIa), EBU (Type IIb) metering
  Frequency weighting: A, B, C, D, K curves
  Per-channel mute and polarity reverse
  Monitor section with L/R reversal and Mid/Side monitoring
  Highpass and lowpass filters (6dB, 12dB, 18dB, 24dB slopes)
  Single-band dynamic EQ for resonance removal and de-essing
  Mono maker for stereo image narrowing below specified frequency
  Eight customizable skins with contrast variants
  Six GUI size options
  Editable instance labels
  Standalone application included
specs: |-
  - windows: Windows 10 or higher (64-bit)
  - mac: macOS 10.13 or higher (Intel and Apple Silicon)
