description: VUMT deluxe is an analog style metering and channel tools plugin that adds BBC, DIN, Nordic and EBU meter types plus channel tools to the standard VUMT. It also includes high-pass and low-pass filters, a single band dynamic EQ and a mono maker.
details: |-
  In addition to all the features of the standard version, VUMT deluxe offers more metering types (BBC, DIN, Nordic and EBU) plus various channel tools, such as Mute and Polarity reverse buttons, a monitor section, and a set of signal processing tools.

  The deluxe meter set covers VU metering, RMS metering, Nordic (Type I), DIN (Type I), BBC (Type IIa) and EBU (Type IIb). Frequency weighting is available in RMS mode with A-, B-, C-, D- and K-weighting curves.

  The channel tools, which can be hidden from the GUI when not needed, add Mute per channel, Polarity Reverse per channel, and a Monitor Section with options to reverse the left and right channels or monitor only the left, right, mid or side channel.

  An additional panel carries the signal processing tools: HighPass and LowPass filters with variable steepness (6dB, 12dB, 18dB and 24dB), a single band dynamic EQ with selectable filter type (HighPass, LowPass, wide or narrow BandPass) that is useful to remove resonances or for de-essing, and a Mono Maker for narrowing the stereo image below a certain frequency.

  On top of that, each skin in the VUMT deluxe version offers an additional contrasting meter GUI for the VU itself.
specs: |-
  - Everything from the standard VUMT version
  - Meter types: VU metering, RMS metering, Nordic (Type I), DIN (Type I), BBC (Type IIa), EBU (Type IIb)
  - Frequency weighting in RMS mode with A-, B-, C-, D- and K-weighting curves
  - Channel tools that can be hidden from the GUI when not needed
  - Mute per channel
  - Polarity Reverse per channel
  - Monitor Section with options to reverse left and right channels and to monitor only left, right, mid or side
  - Additional signal processing panel that can be hidden from the GUI when not needed
  - HighPass and LowPass filters with variable steepness (6dB, 12dB, 18dB, 24dB)
  - Single band Dynamic EQ with selectable filter type (HighPass, LowPass, wide or narrow BandPass) for removing resonances or de-essing
  - Mono Maker for narrowing the stereo image below a certain frequency
  - Each skin offers an additional contrasting meter-GUI
  - Supported formats are 64bit only
  - Windows 10 or higher (64bit): VST, VST3, AAX, Standalone
  - macOS 10.13 or higher: AU, VST, VST3, AAX, Standalone
