details: |-
  M-Tron Pro is GForce Software's acclaimed emulation of the Mellotron M400, the tape-based keyboard made famous by artists such as The Beatles, Led Zeppelin, Radiohead, Oasis, Trent Reznor, Trentemøller, AIR, and Nils Frahm.

  Boasting an extensive 3.5GB+ sound library with nearly 200 tape banks and over 800 presets, M-Tron Pro delivers a wealth of authentic Mellotron textures. It supports dual-layer and split-keyboard operation with an extended keyboard range reaching seven semitones lower than the original hardware.

  The instrument includes classic tape character controls — Wow & Flutter with instability, tape reverse, and half-speed — alongside modern enhancements including amp simulation with warmth, noise, and saturation; a state-variable filter; an ensemble effect; a Matrix reverb; and LFO shaping across pitch, filter, pan, and level destinations.
