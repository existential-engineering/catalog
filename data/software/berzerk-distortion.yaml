details: |-
  The go-to plugin for wild, deranged, creative distortion: 10 all-original
  distortion shapes, advanced feedback, pitch, dynamics, sidechaining and m/s
  options for versatile experimentation plus the 'go berzerk!' button for
  randomized, unpredictable distortion madness.

  Our engineers began by collecting a large array of well-loved distortion units
  of all types: amps, tube devices, stomp boxes and old analog units. They then
  developed original custom wave shapes based on their all-time favorite
  distortion curves. Berzerk includes 10 unique shapes, each with its own
  personality.

  The unique feedback section is like an on-board analog synth. It can either
  run a tunable sine wave through the signal, producing interesting bass lines,
  melodies or rhythms; or it can oscillate while "riding" the input—think crazy
  synthesized vocal fx. It also includes a speed knob to shape the groove, as
  well as octave, pitch, range and blend adjustments—all of which you can
  sidechain.

  The dynamics section sits before the distortion and twists the character of
  the generated harmonics. The "up/down" knob controls a gate/expander which,
  after setting the threshold, will affect the range of sound affected by the
  clipper. The "rider" option rides the amount of gain hitting the distortion,
  giving you full dynamic control. Berzerk also offers unique m/s processing,
  distorting just the mids or just the sides when needed; a master temperature
  knob to control the overall color and feel of the output; and an overall mix
  knob.
specs: |-
  - 10 all-original distortion shapes
