description: Generate is a chaotic polysynth plugin featuring eight unique oscillator types based on chaos theory mathematics, designed to create complex, evolving textures for cinematic pads, leads, basses, and experimental sounds.
details: |-
  Generate is a polysynth built around eight chaotic generator types — Double Pendulum, Vortex, Pulsar, Discharge, Turbine, Helix, Crescent, and Magma — each derived from chaos theory mathematics to produce complex, non-repeating waveforms.

  The synth pairs these generators with five wavefolder algorithms including a Buchla 259-inspired design, a Saturate algorithm-based folder, a Fractal folder, and an Animated Equation folder, giving each patch a rich, organic harmonic character.

  A Low Pass Gate with pole and resonance control, dual envelopes, dual LFOs, Sample & Hold, and a Step Sequencer provide comprehensive modulation tools. The modulation matrix supports over 1,440 simultaneous routings, enabling deeply evolving and generative patches.

  Built-in effects including EQ, Chorus, Delay, Reverb, and a Limiter are fully modulation-capable, and the plugin ships with over 1,000 presets including artist contributions. MPE is fully supported.

  Generate features a resizable, themeable UI with a full preset librarian including tagging and search, and is available as a 14-day fully featured free trial.
specs: |-
  - 8 chaotic oscillator types: Double Pendulum, Vortex, Pulsar, Discharge, Turbine, Helix, Crescent, Magma
  - 5 wavefolder algorithms: Buchla 259-based, Saturate algorithm-based, Fractal, Animated Equation
  - Low Pass Gate with pole and resonance control
  - Dual envelopes and dual LFOs
  - Sample & Hold and Step Sequencer
  - Modulation matrix supporting 1,440+ simultaneous routings
  - Built-in effects: EQ, Chorus, Delay, Reverb, Limiter (all modulation-capable)
  - MPE support
  - 1,000+ factory presets with artist packs
  - Full preset librarian with tagging and search
  - Resizable UI with color scheme options
  - macOS 10.9+, 64-bit, Apple Silicon compatible
  - Windows 10+, 64-bit
  - Formats: AAX, AU, VST, VST3 (AU on Mac only)
