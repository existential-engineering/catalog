description: "A unique synth plugin featuring evolving oscillators based on
  pendulum behavior with options for virtual circuit-bending, plus loads of
  modulation options, support for MPE, and premium effects. Access a world of
  lush and deep cinematic sounds."
details: |-
  Generate is a chaotic polysynth featuring 8 generator types, 5 wavefolder types, best-in-class modulation and effects, MPE support, and over 800 professional and artist presets covering bass, keys, leads, pads, plucks, rhythms, sequences, and textures. Based on novel chaotic synthesis techniques including Model Bending and the Buchla 259 Wavefolder. 64-bit only. Apple Silicon compatible.
specs: |-
  macOS 10.9+: 64-bit AAX, AU, VST, VST3 (Apple Silicon compatible). Windows 10+: 64-bit AAX, VST, VST3.
