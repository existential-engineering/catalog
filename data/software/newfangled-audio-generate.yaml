description: A unique synth plugin featuring evolving oscillators based on
  pendulum behavior with options for virtual circuit-bending, plus loads of
  modulation options, support for MPE, and premium effects. Access a world of
  lush and deep cinematic sounds.
details: |-
  Generate is based on a set of chaotic generators. What looks like randomness contains underlying patterns, interconnectedness, constant feedback loops, repetition, self-similarity, fractals, and self-organization. Each of Generate's 8 chaotic generators bring out these underlying patterns and create an oscillator that can smoothly fade from a sine wave to total chaos, with an expanse of territory to explore in between. The musical textures created include distortion, harmonics, grunge, static, and noise. All of which can be predictably or unpredictably modulated.

  Beautifully complex pads. Warm moving keys. Jittery sequenced basses. Out of control leads. Textures, oh my God textures. Take Chaos to the next level with Generate.

  Generate's Chaotic Generator is unique among synthesizer oscillators and has been in development for 4 years. The initial idea was to find out what a double pendulum would sound like if sped up to audio rate. It sounded great, but not very musical. After a lot of tweaking to the dynamical model (underlying math), a set of Generators emerged that was worth releasing in this plug-in.

  Even after settling on the oscillator building the rest of the voice took several iterations. The best fit ended up being the "west coast" voice originally developed by the genius Don Buchla. However, building those modules led to ideas for other wavefolder equations. These ideas eventually became the Animated and Fractal wavefolder options.

  The reverb in Generate is an incredibly efficient new design inspired by the writings of Michael Gerzon. The limiter is also a new design based on the geometry of signals, rather than on an analog or digital prototype. Generate's Bent 259 Wavefolder is based on a new technique called Model Bending.
specs: |-
  - Novel chaotic oscillator has 8 types: Double Pendulum, Vortex, Pulsar, Discharge, Turbine, Helix, Crescent, and Magma
  - 5 Wavefolders based on the Buchla 259 Complex Waveform Generator, the Saturate plug-in, Fractals, and a special Animated Equation
  - Generate 1.3 adds new wavefolders based on the Saturate algorithm and a model bent version of the Buchla 259
  - Generate 1.3 adds the ability to modulate the effects
  - Generate 1.3 includes an updated Sequencer
  - Low Pass Gate based on the Buchla 292 adds controls for POLES and RESONANCE
  - Modulate all controls with MIDI/MPE, two Loopable Envelopes, two LFOs, Sample and Hold/Random, and a Step Sequencer
  - Innovative modulation UI allows modulation over every control from the main page, including modulating modulators, allowing up to 1440 simultaneous modulation routings
  - Innovative and modulatable EQ, Chorus, Delay, Reverb, and Limiter effects
  - MPE support allows amazing control from expressive controllers
  - All mod sources have multiple outputs generated at once, like a modular synth should
  - Animations: the Double Pendulum, Wavefolder, and Low Pass Gate modules each have animations to show how each module responds to your input, and to modulation
  - Fully resizable UI
  - Intuitive MIDI Learn functionality allows you to assign MIDI CCs to any control with just a click
  - Color Schemes
  - Over 1000 Presets, including many artist presets
  - Full Preset Librarian with Categories, Tags, Descriptions, UNDO, and A/B Comparison
  - macOS 10.9+, 64-bit AAX, AU, VST, VST3, all formats Apple Silicon compatible
  - Windows 10+, 64-bit AAX, VST, VST3
