description: "A painstakingly re-created recreation of classic 1960s German
  broadcast equalizers featuring superb sound and outstanding build quality.
  Includes three distinct modules: the W295 original, W295a tilt EQ variant, and
  W295b sound sculpting version. Features low shelf controls for bass
  enhancement, adjustable midrange EQ, high shelf controls for air and
  definition, tilt EQ functionality, transformer saturation controls, and
  high-quality mode for circuit parameter adjustment."
