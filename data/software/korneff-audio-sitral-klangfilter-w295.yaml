description: "A painstaking recreation of classic 1960s German broadcast
  equalizers featuring superb sound and outstanding build quality. Includes
  three distinct modules: the W295 original, W295a tilt EQ variant, and W295b
  sound sculpting version. Features low shelf controls for bass enhancement,
  adjustable midrange EQ, high shelf controls for air and definition, tilt EQ
  functionality, transformer saturation controls, and high-quality mode for
  circuit parameter adjustment."
details: |-
  SITRAL Klangfilter W295 is a component-level recreation of a legendary 1960s German broadcast-industry equalizer suite. The plugin ships as three distinct module variants — the W295 (original), W295a (tilt EQ), and W295b (sound sculpting) — each capturing different facets of the hardware's character.

  The W295 is designed for aggressive EQing of vocals, guitar, and drums with precision and color. The W295a offers broad, beautiful, effortless tone shaping for mixes and mastering via its tilt EQ circuit. The W295b delivers great control over highs, lows, and smooth midrange.

  Key processing features include low shelves with transformer saturation for bass enhancement, adjustable midrange bands, high shelves for air and definition, and a dedicated Tilt EQ mode. A High Quality mode enables analog-style responsiveness at the cost of additional CPU.

  Licensing is perpetual, software-based (no dongle required), with up to four simultaneous machine activations.
