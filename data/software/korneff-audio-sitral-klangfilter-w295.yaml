description: "A painstaking recreation of classic 1960s German broadcast equalizers featuring superb sound and outstanding build quality. Includes three distinct modules: the W295 original, W295a tilt EQ variant, and W295b sound sculpting version. Features low shelf controls for bass enhancement, adjustable midrange EQ, high shelf controls for air and definition, tilt EQ functionality, transformer saturation controls, and high-quality mode for circuit parameter adjustment."
details: |-
  The SITRAL series was designed in the 1960s for the German broadcast industry. The modules featured superb sound and outstanding build quality, and Korneff Audio component-level modeled three classic ones to bring you what engineers consider the best-sounding equalizers ever made.

  The suite covers three modules. W295 is the original, giving color and precision perfect for aggressive EQing of vocals, guitar and drums. W295a is a tilt EQ for broad, beautiful, effortless tone shaping on mixes and mastering. W295b brings sound sculpting power, with great control over highs, lows, and the ultimate in smooth midrange.

  The W295 was justly famous for its ability to create big yet tight bass sounds, and the secret is musical EQ curves plus transformer saturation. Designed for broadcast, its spectacular midrange can be pushed to extremes or used to subtly sculpt and smooth, while the high shelves give air with definition and musicality and no harshness or breakup.

  Tilt EQ shifts the frequency spectrum using complementary boosts and cuts, which is fast, easy and well suited to mixes and mastering. Transformer saturation can be dialled in precisely, from a subtle warmth and presence to full-on grit and distortion.

  High Quality mode lets you adjust the parameters of the circuit itself for analog responsiveness, and the rear panel gives complete control of EQ, saturation and preamp distortion.
specs: |-
  - Component-level models of three SITRAL modules: W295, W295a and W295b
  - W295: original color and precision equalizer
  - W295a: tilt EQ using complementary boosts and cuts
  - W295b: extended high, low and midrange sculpting
  - Low shelves, midrange and high shelf sections
  - Adjustable transformer saturation from subtle warmth to full grit and distortion
  - Adjustable buffer amp and preamp distortion on the rear panel
  - High Quality mode with adjustable circuit parameters
  - Software-based licensing, no USB or hardware dongle and no special drivers
  - Activation on up to four machines at the same time
  - Minimum: Intel, AMD or Apple Silicon i5 quad core processor
  - Minimum: 4GB of RAM
  - Minimum: macOS 10.14 or later, Windows 7 and above
  - Linux minimum: Ubuntu 18.04 LTS or equivalent (x86-64)
  - Linux recommended: Ubuntu 20.04 LTS or later, Debian 11+, Fedora 36+, or any modern distribution using glibc 2.28 or newer
  - Minimum screen resolution: 1024 x 768
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
  - Linux 64-bit: VST3, LV2
  - Internet connection required for activation and for demos
