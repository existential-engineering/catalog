description: "A recreation of 1960s German broadcast equalizers. Includes three distinct modules: the W295 original, the W295a tilt EQ variant, and the W295b sound sculpting version. Features low shelf controls, adjustable midrange EQ, high shelf controls, tilt EQ functionality, transformer saturation controls, and a high-quality mode for circuit parameter adjustment."
details: |-
  The SITRAL series was designed in the 1960s for the German broadcast industry. Korneff Audio component-level modelled three of the modules.

  The suite covers three modules. W295 is the original, with shelving and midrange sections. W295a is a tilt EQ for broad tone shaping on mixes and mastering. W295b adds extended control over highs, lows and midrange.

  The W295 combines its EQ curves with transformer saturation. Designed for broadcast, its midrange section can be pushed to extremes or used for smaller corrections, and the high shelves add high-frequency content.

  Tilt EQ shifts the frequency spectrum using complementary boosts and cuts, which suits mixes and mastering. Transformer saturation is adjustable from mild harmonic content through to grit and distortion.

  High Quality mode allows the parameters of the circuit itself to be adjusted, and the rear panel gives control of EQ, saturation and preamp distortion.
specs: |-
  - Component-level models of three SITRAL modules: W295, W295a and W295b
  - W295: original color and precision equalizer
  - W295a: tilt EQ using complementary boosts and cuts
  - W295b: extended high, low and midrange sculpting
  - Low shelves, midrange and high shelf sections
  - Adjustable transformer saturation from subtle warmth to full grit and distortion
  - Adjustable buffer amp and preamp distortion on the rear panel
  - High Quality mode with adjustable circuit parameters
  - Software-based licensing, no USB or hardware dongle and no special drivers
  - Activation on up to four machines at the same time
  - Minimum: Intel, AMD or Apple Silicon i5 quad core processor
  - Minimum: 4GB of RAM
  - Minimum: macOS 10.14 or later, Windows 7 and above
  - Linux minimum: Ubuntu 18.04 LTS or equivalent (x86-64)
  - Linux recommended: Ubuntu 20.04 LTS or later, Debian 11+, Fedora 36+, or any modern distribution using glibc 2.28 or newer
  - Minimum screen resolution: 1024 x 768
  - Mac 64-bit: VST3, AU, AAX
  - Windows 64-bit: VST3, AAX
  - Linux 64-bit: VST3, LV2
  - Internet connection required for activation and for demos
