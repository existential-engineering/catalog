description: The SITRAL Klangfilter W295 is an exact digital replica of one of
  the best sounding and best-made analog equalizers. Use it for vocals, guitars,
  brass, bass, drums, the master bus.
details: |-
  SITRAL Klangfilter W295 Vintage German Equalizer Suite. The SITRAL series was designed in the 1960s for the German broadcast industry. They featured superb sound and outstanding build quality. Korneff Audio has component-level modeled three classic modules of what engineers consider the best-sounding equalizers ever made.

  W295, the Original: color and precision, perfect for aggressive EQing of vocals, guitar and drums. W295a, Tilt EQ: broad, beautiful, effortless tone shaping for mixes and mastering. W295b, Sound Sculpting Power: great control over highs, lows, and the ultimate in smooth midrange.

  The W295 was justly famous for its ability to create big yet tight bass sounds. The secret is musical EQ curves and transformer saturation. Designed for broadcast, the W295's spectacular midrange can be pushed to extremes or used to subtly sculpt and smooth. There's air, and then there's SITRAL's air: analog smooth with definition and musicality, with no harshness or breakup.

  Tilt EQ shifts the frequency spectrum using complementary boosts and cuts. Fast, easy, perfect for mixes and mastering. Transformers let you precisely dial in exactly the transformer saturation you need, from a subtle warmth and presence to full-on grit and distortion.

  For the ultimate in digital modeling, HQ mode lets you adjust the parameters of the circuit for analog responsiveness. Add analog warmth and character exactly as you want it with complete control of EQ, saturation and preamp distortion.
specs: |-
  - Three component-level modeled modules: W295 (original), W295a (tilt EQ), W295b (sound sculpting)
  - Low shelves modeled for big, tight bass, with musical EQ curves and transformer saturation
  - Broadcast-designed midrange, usable for subtle sculpting or extreme settings
  - High shelves for air and sheen without harshness or breakup
  - Tilt EQ using complementary boosts and cuts
  - Adjustable input and output transformer saturation, from warmth to grit and distortion
  - High Quality (HQ) mode exposing circuit parameters for analog responsiveness
  - Rear panel control of EQ, saturation and preamp distortion
  - Intel, AMD or Apple Silicon i5 quad core processor
  - 4GB of RAM
  - Mac OSX 10.14 or later
  - Windows 7 & Above
  - Linux minimum: Ubuntu 18.04 LTS or equivalent (x86-64)
  - Linux recommended: Ubuntu 20.04 LTS or later, Debian 11+, Fedora 36+, or any modern distribution using glibc 2.28 or later
  - Screen res: 1024 x 768 or higher
  - Mac 64bit: VST3, AU, AAX
  - Windows 64bit: VST3, AAX
  - Linux 64bit: VST3, LV2
  - Software-based licensing, no USB or hardware dongles
  - Activation on up to four machines at the same time
  - Internet connection required for activation and for all demos
