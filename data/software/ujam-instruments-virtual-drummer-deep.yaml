description: Virtual Drummer DEEP is UJAM's most spirited drummer, standing on the shoulders of traditional genres like Soul and Funk.
details: |-
  DEEP is a contemporary drummer with a 60s and 70s vibe. Deep as in soulful, deep as in complex and intricate, deepness as a measure of emotion: DEEP stands on the shoulders of traditional genres like Soul and Funk with its gaze set on contemporary styles and timeless future classics.

  Soul and funk dominated the music business during the 1960s and 1970s, driven by iconic rhythm sections like the Funk Brothers and Booker T. and the M.G.'s. Soul drumming emphasizes melody and vocals and uses more basic patterns with fewer embellishments, and DEEP covers that ground while feeling at home with pop, rock and alternative vibes too.

  The instrument comes with up to 60 velocity layers per instrument, and a dynamic round-robin algorithm makes the drums sound like the real thing. All sounds were recorded with a selection of both vintage and modern direct microphones, with stereo pairs of overhead and room mics for mix freedom.

  Each of the five drum kits carries a signature retro morph control called Grit, and six Mix Presets each swap an entire multi-bus effect chain for every instrument channel. The Mix section finalizes the drum mix with individual volume for each kit component, separate overhead and room mic controls, and a reverb send.
specs: |-
  - 30 styles with 690 drum patterns and 70 sound designer presets
  - 5 drum kits, 6 mix presets
  - Drag-and-drop phrases to the DAW for detailed note editing
  - Retro morph control called "Grit"
  - Up to 60 velocity layers per instrument with dynamic round-robin
  - Stereo pairs of overhead and room microphones
  - Styles are name-matched to Virtual Bassist DANDY for aligned bass and drum backings
  - Operating systems: Windows 10 to Windows 11, macOS Catalina (10.15) to macOS Tahoe (26)
  - Supported on Intel Macs and Apple silicon Macs (Rosetta and native)
  - 4 GB of RAM
  - 3.7 GB of disk space
  - 1280x768px display, internet connection
  - Plug-in formats: VST 2, VST 3, AAX and AU 2, all 64-bit only
  - Automated installation via the UJAM App or a downloadable installer file
  - Authorization via the UJAM App or by entering email and password in the plug-in
  - Supported standards: MIDI
