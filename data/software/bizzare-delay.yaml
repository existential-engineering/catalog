details: |-
  Users have the ability to switch between each unit for each of the possible
  delay types, including; ping pong & multitap with lp & hp filters, pan,
  wet/dry & lfos.

  The plug-in allows complete fine tuning to get the exact delay desired.

  Developed by 1st creative labs in collaboration with bizzare contact.

  Bizzare delay by 1st creative labs is a virtual effect audio plugin for macos
  and windows.
specs: |-
  - Digital stereo delay unit
  - Saturating tape delay
  - Ping pong delay type
  - Multitap delay type
  - LP filter
  - HP filter
  - Pan control
  - Wet/dry control
  - LFOs
  - macOS compatibility
  - Windows compatibility
