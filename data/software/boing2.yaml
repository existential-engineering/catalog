details: |-
  Boing2 is a physically modeled bowed string synthesizer. Oscillation is
  produced by a friction calculation applied to a dispersive waveguide string
  oversampled at rates of up to 16x.

  The string loop includes a mass-spring modeled bridge. The body resonator
  consists of a mass-spring modeled "air tone" and a 5 band banded waveguide.
specs: |-
  - Physically modeled bowed string synthesizer
  - Friction calculation oscillation
  - Dispersive waveguide string
  - Up to 16x oversampling
  - Mass-spring modeled bridge
  - Mass-spring modeled air tone
  - 5 band banded waveguide body resonator
  - Windows compatible
