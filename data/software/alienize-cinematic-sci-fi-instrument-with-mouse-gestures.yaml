details: |-
  Alienize is a new way to create underscores, melodies, and textures. Create evolving atmospheres for passages or accent moments with your mouse (or your MIDI controller). From exotic atmospheres to rhythmic textures or evolving melodies and arpeggios. You'll be able to play them live and synchronize them with on-screen action on the go.

  Alienize uses the mouse position over the screen to create and modulate sounds on the go, and also to publish it as an automatable parameter in your DAW. You can also choose to assign this parameter to a cc to operate it from your controller. Alienize has 41 sound modules. Everyone of them has his gesture behavior (I.e. Theremin pitch is controlled by left-right cursor position). You will be able to play gestures over a movie to sync on the go.

  Alienize implements granular, subtractive, wavetable and sample playback synthesis to generate sounds.

  Alienize: cinematic sci-fi instrument with mouse gestures by sampleson is a virtual instrument audio plugin and a software application for macos and windows. It functions as an audio units plugin, a VST 3 plugin and a standalone application. Standalone 64-bits app and vst3 included.

  Cinematic instrument for sci-fi music scoring. Ambient, arps, drones, melodic and textures modules. ~200mb. Low cpu usage. 41 sound modules. 120 presets. Automated parameters for daws. Granular, wavetable, oscillator and sampling engines. Scalable hd interface. Controls/fx: ambient reverb. Master gain. Modules gain.
