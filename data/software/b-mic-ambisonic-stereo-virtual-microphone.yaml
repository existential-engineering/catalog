description: B-Mic - Ambisonic-Stereo Virtual Microphone allows you to position
  and direct a microphone pair inside an ambisonic sound field.
details: |-
  Features include 1st order ambisonic processing, the ability to adjust the
  microphone pairs' position within the soundfield, and adjustable angle between
  the microphone pair.

  Control over microphones' polar pattern is provided, with 64 bit processing
  capabilities.
specs: |-
  - 1st order ambisonic processing
  - Microphone pair positioning within soundfield
  - Adjustable angle between microphone pair
  - Polar pattern control
  - 64 bit processing
  - macOS compatible
