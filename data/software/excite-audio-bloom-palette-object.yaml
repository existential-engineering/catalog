details: |-
  Bloom Palette Object merges organic one-shots and loops from household
  objects, machinery, and tuned foley with the rich acoustic character of
  instruments and percussion from around the world - all powered by excite
  audio's new sequencer. This versatile instrument is built to bring real-life
  sounds and textures into your productions.

  Bloom palette object offers a diverse collection of meticulously captured
  sound sources, blending musical instruments such as the taishogoto,
  vibraphone, and upright bass with raw textures of everyday items like velcro,
  glass bottles, and mechanical ratchets. Recorded by professional foley artists
  and sound designers, these sounds are perfect for bringing your projects to
  life with unexpected layers and depth.

  The all-new sequencer enables you to arrange complex patterns, interlocking
  rhythms, chord progressions, and even sequence complete beats. Unlike
  traditional sequencers, bloom has been designed to not only trigger one-shots,
  but also sequence loops. Paired with powerful pitch and effect modulation,
  bloom palette object is the key to giving your music reality.

  The edit page is the central hub for refining and making the library of
  samples your own. Adjust start and end points, manipulate playback speed and
  direction, and tweak the timbre with pitch and formant controls. In the
  modulation section, automate pitch, volume, and filter settings as well as
  three effects to add depth and dimension to your music.

  Bloom palette object offers three bespoke effects modules: noise for adding
  organic texture and atmospheric layers that respond to your audio. Reverb to
  create space and depth using hall, plate and spring algorithms from the
  lifeline series. Speaker simulates different reamping techniques and loud
  speakers, from handheld devices to guitar amps to studio monitors.
