description: Bdm is a plugin instrument designed for the musicians who love
  chaos and usually find the unpredictable behaviour of an uncontrollable sound.
details: |-
  Bdm is a plugin instrument designed for the musicians who love chaos and
  usually find the unpredictable behaviour of an uncontrollable sound machine
  stimulating and inspiring. Bdm basically offers 4 drum pads like an old,
  small, beat box with: bass drum, snare, hi-hat and stick, each of those has
  controls like decay, pitch and filter.

  But the creative power of the bdm is all in the four "broken" sliders, one for
  each pad. With those sliders you can set the amount of wild, weird, chaotic
  and unpredictable variations to the sound, just like the circuits inside go
  crazy producing bleeps and glitches you never thought you'd hear from this
  machine.

  Sound source is double: a "osc.mix.pcm" slider, per pad, allows to choose
  between the internal va oscillator or an external wav sample, or a mix of the
  two. The output is configured as 1 stereo + 4 mono outs.

  The excellent documentation has instructions for creating "modkits", which are
  combinations of skins and samples. It comes with a good assortment of presets
  and one additional modkit right out of the box.

  Another cool feature of this instrument is the ability to alter the pitch of
  drum pads using the keyboard. Rather than being melodic, the pitch change
  really affects the quality of broken-ness, lending an even finer palette to
  the array of glitchitude that can be achieved.
specs: |-
  - 4 drum pads (bass drum, snare, hi-hat, stick)
  - Decay control per pad
  - Pitch control per pad
  - Filter control per pad
  - Four broken sliders (one per pad)
  - Osc.mix.PCM slider per pad
  - Internal va oscillator
  - External wav sample support
  - 1 stereo output + 4 mono outputs
  - macOS support
  - Windows support
  - Keyboard pitch alteration
  - Custom sample support
  - Re-skinnable interface
  - Modkit support
