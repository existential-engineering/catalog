description: Sonsig Rev-A combines traditional true-stereo algorithmic reverb with advanced modern filter and modulation controls in a great-sounding, easy to use, affordable plug-in. After years of R&D, the engineers developed breakthrough algorithm technology that blends the strengths of legendary high-end reverbs with zero-compromise modern filters and digital signal processing.
details: |-
  Sonsig Rev-A is a classic algorithmic reverb plug-in that combines traditional true-stereo algorithmic reverb with advanced modern filter and modulation controls. Relab developed breakthrough algorithm technology after years of R&D and close collaboration with some of the best ears in pro audio, blending the strengths of legendary high-end reverbs with zero-compromise modern filters and digital signal processing.

  The plug-in features a hybrid algorithmic structure that combines the strengths of various legendary high-end reverb units modulated by a complete Solina ensemble, resulting in one of the most complex hybrid structures ever developed. It enables users to dial in small rooms, lush halls, and realistic ambiences with uncompromising and unparalleled sound quality.

  Sonsig Rev-A ships with over 200 presets curated by professional audio engineers, providing a broad palette from intimate room ambiences to long, lush reverb tails. The preset library is designed for fast workflow so users can quickly find and tweak the perfect reverb for any mix.

  The plug-in is licensed via iLok. After purchase, the license is automatically placed inside the buyer's iLok account. Both Mac (10.12+ including M1 native) and Windows 10+ are supported in 64-bit VST, VST3, AAX, and AU (Mac only) formats.
specs: |-
  - Traditional true-stereo algorithmic reverb with advanced modern filter and modulation controls
  - Hybrid structure combining legendary high-end reverb units modulated by a complete Solina ensemble
  - Over 200 presets
  - 64-bit only: VST, VST3, AU and AAX on macOS; VST, VST3 and AAX on Windows
  - Mac requirements: OS X 10.15 or higher, Intel or M1 processor, 2GB of ram
  - Windows requirements: Windows 10 or higher, Core 2 or higher, 2GB of ram
  - Compatible hosts: Logic Pro 10.x (Mac), Pro Tools 11.3.2 and up, Cubase 9.5 and up, Nuendo 8 and up, Live 9 and up
  - No hardware dongle required: local computer authorization or iLok USB key (V2 or above), with a free PACE iLok account
