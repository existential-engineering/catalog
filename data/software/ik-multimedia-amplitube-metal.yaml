details: |-
  Based on ik's amplitube software, AmpliTube Metal is a guitar amp and FX
  modeling plug-in dedicated entirely to heavy metal gear, with an arsenal of 48
  models of modern and vintage amps, cabinets, stomp boxes and rack effects.

  Amplitube metal offers a software recreation of a complete heavy metal arsenal
  of sounds from the late 70's through today and includes models of extremely
  rare and collectible metal stomp boxes, amp heads & cabinets, from the
  legendary, hard-to-find japanese originals to classic british and american
  essentials.

  Amplitube metal includes 14 stomp boxes, 5 amp models, 13 cabinets and 6 mics,
  9 rack fx and a tuner for 48 never-before-reproduced models. Including models
  based on the proco rat, electro-harmonix big muff, digitech whammy, several
  vintage boss effects, randall warhead, peavey 5150, mesa/boogie triple
  rectifier, and other great emulations based on metal gear.

  Amplitube metal also includes amplitube x-gear so it can be integrated with
  all current and future "powered by amplitube" products for full mixing and
  matching of over 150 gear models, including full MIDI and stompio control for
  live usage.

  5 separate modules: tuner, configurable stomp pedal board, amp head, cabinet +
  mic, and rack effects. Powered by amplitube with exclusive dsm (dynamic
  saturation modeling) technology.
specs: |-
  - 14 stomp effects
  - 5 amp models
  - 13 cabinet models
  - 6 microphone models
  - 9 rack effects
  - Digital tuner
  - 2 configurable rigs with up to 32 simultaneous effects
