details: |-
  A high-end, high efficiency audio FX VST3 plugin with low-CPU usage. The
  BeastVerb, ideally designed for drums and melodies, is also packed with unique
  top-notch features that will fit perfectly in your mixes.

  High precision interface characterized by our signature style. Analogue
  modelling inspired drive. Unique cut-off filter for perfect sound shaping.

  Ambient freeze function that allows you to grab any section of your active
  reverb tail in real time.

  Beastverb's simplicity comes in handy even in the most complex inspiration
  process.

  Beastverb by beastsamples is a virtual effect audio plugin for macos and
  windows. It functions as an audio units plugin and a VST 3 plugin.
specs: |-
