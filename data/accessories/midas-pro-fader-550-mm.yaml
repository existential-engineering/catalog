description: Not satisfied with the existing motorised fader choices in the
  marketplace, Midas created the PRO FADER, rated for up to a million cycles –
  three times that of other leading manufacturers - and providing high
  linearity, robustness, and smooth feel during operation. This decision yielded
  many other benefits, including total quality control over the manufacturing
  process and lower costs that could be passed on to customers. As a digital
  console manufacturer, Midas has a perspective on the actual application of
  motor faders that a component manufacturer would not have. The
  multi-disciplinary development project combined mechanical design, electronic
  hardware and software optimisation with a rigorous testing programme and an
  investment in material science to produce the best possible performance in
  actual operation in Midas PRO Series consoles. Semi-precious metals are used
  for the wiper fingers for their hard-wearing properties, and precision
  resistive tracks were created that offer highly linear positional accuracy,
  coupled with long-term durability and even response in use. PRO FADER (550 mm)
  features a high precision 100 mm travel track with a 10 kΩ linear law, ideally
  suited to servo control applications. The integrated touch sensing track and
  conductive T-Bar allow both the implementation of automatic channel selection
  in software, as well as detection of when the fader is being held so that the
  motor is not driven. PRO FADER (550 mm) is designed to be mounted to console
  fascia panels via its two M3 threaded pillars which are on 120 mm mounting
  centres. A 550 mm long cable is provided which includes connections for the 10
  kΩ resistive track, the touch sensing track and the motor. PRO FADER (550 mm)
  is supplied as a set of five faders and is specifically intended for use in
  the centre sections of Midas PRO3, PRO6, PRO9 and PRO X Series control
  centres. PRO FADER (550 mm) is also a replacement for industry standard parts
  such as Penny+Giles PGFM3200, Alps K-Fader and other similar 100 mm motorised
  faders.
details: |-
  Replacement motorised fader for the centre sections of Midas PRO3, PRO6, PRO9 and PRO X Series control centres. Supplied as a set of five faders. The fader uses a high precision 100 mm travel track with a 10 kΩ linear law (± 2% linearity), Palladium Silver-Copper alloy wiper fingers, a Mabuchi FF-050SB-09250 motor, and an integrated touch sensing track with conductive T-Bar that supports automatic channel selection and motor disengagement when the fader is being held. Mounting is via two M3 threaded pillars on 120.0 mm centres. A 550 mm cable terminates in a 6-way Molex 22-01-2065 connector shell with 08-50-0031 crimps, carrying connections for the resistive track, the touch sensing track and the motor. PRO FADER (550 mm) is also a direct replacement for industry standard parts such as Penny+Giles PGFM3200 and Alps K-Fader.
specs: |-
  - Operational Lifetime: Up to 1 million cycles
  - Track Resistance: 10 kΩ ± 20%, linear law
  - Linearity: ± 2%
  - Travel: 100 mm
  - Wiper Material: Palladium Silver-Copper alloy
  - Touch Sensing: Touch sensing track connected to a conductive T-Bar fixing via a set of wiper fingers
  - Motor: Mabuchi FF-050SB-09250
  - Cable Length (nominal): 550 mm
  - Connector: 6-way Molex 22-01-2065 connector shell fitted with 08-50-0031 crimps
  - Dimensions: 150 mm (L) x 13 mm (W) x 47 mm (H) (5.9" x 0.5" x 1.9")
  - Mounting: M3 threaded pillar fixings on 120.0 mm (4.72") mounting centres
  - Supplied Quantity: Set of five faders
  - Compatible Consoles: Midas PRO3, PRO6, PRO9 and PRO X Series control centres
  - Industry Replacement For: Penny+Giles PGFM3200, Alps K-Fader and other similar 100 mm motorised faders
