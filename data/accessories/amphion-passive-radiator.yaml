details: |-
  Aluminum replacement passive radiators for Amphion studio monitors. Available
  in three sizes to match the monitor model: 4.25" for One12, 5.25" for
  One15/Two15, and 6.5" for One18/One18X/Two18/Two18X. Sold per piece as part
  of Amphion's sustainability and repairability program.
specs: |-
  - One12: 4.25" aluminum passive radiator
  - One15 / Two15: 5.25" aluminum passive radiator
  - One18 / One18X / Two18 / Two18X: 6.5" aluminum passive radiator
