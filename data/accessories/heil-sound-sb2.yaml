details: |-
  Product Overview

  The Heil SB-2 is a compact, extendable microphone boom arm specifically engineered for tight spaces, cramped broadcast desks, mobile recording setups, and travel podcasting. Built with rugged durability in mind, the SB-2 provides precise microphone positioning in cramped studio quarters where full-sized articulation arms are too bulky or unwieldy.

  Extending up to a maximum length of 17 inches, the SB-2 includes a brass-lined Heil C-Clamp (supporting openings up to 1.5 inches) for secure desktop mounting. The stem of the SB-2 is completely removable, allowing the boom arm to attach directly to any standard-threaded microphone stand or specialized mounting hardware. Compatible with all Heil brass-lined mounting accessories and standard 5/8″-27 threaded mic clips and shock mounts, the SB-2 offers an ideal short-reach boom solution for podcasts, broadcast desks, and field interviews.
specs: |-
  - Compact & Extendable Design: Short-reach telescoping boom extends up to 17 inches, making it ideal for tight desktop quarters and portable recording rigs.
  - Removable Mounting Stem: Stem easily detaches, enabling direct threading onto standard 5/8″-27 floor stands or desk mounts.
  - Included Heil C-Clamp: Ships complete with a heavy-duty brass-lined C-clamp featuring a 1.5-inch maximum opening capacity for secure table-edge mounting.
  - Full Heil Mounting System Compatibility: Fits seamlessly into all Heil brass-lined mounting hardware, including the DT-1, FL-2, RS-1, and WM-1 mounts.
  - Universal 5/8″-27 Threading: Accepts all industry-standard microphone clips, shock mounts (such as the Heil PRSM and SM-1), and heavy dynamic microphones.
  - Portable & Travel-Ready: Small footprint and lightweight construction make it an ideal accessory for remote podcasting, field broadcast interviews, and mobile audio kits.
  - Maximum Extended Length: 17 inches.
  - Mounting Stem Diameter: 1/2 inch (removable).
  - Thread Size: 5/8″ - 27 industry-standard mic thread.
  - Included Clamp: Heil C-Clamp (1.5″ maximum opening).
  - Cable Management: External clip or cable wrap attachment.
  - Internal Balance Mechanism: Manual locking friction tension knob.
