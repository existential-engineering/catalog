details: |-
  This cable is designed to split a stereo signal. Black- and red-coded mono phone jacks indicate left and right respectively. It may also be used to adapt a stereo cable with mono phone plugs to a stereo phone jack.

  The Stereo Breakout terminates in a 1/4 in TRS plug on one end and dual 1/4 in TSF jacks on the other. It is listed under Hosa's Hosa Breakouts category and carries the Essential Hosa tag.
specs: |-
  - Connectors: 1/4 in TRS to Dual 1/4 in TSF
  - Black- and red-coded mono phone jacks indicate left and right respectively
