details: |-
  The FS-M-1 is a bespoke loudspeaker stand designed by Bowers & Wilkins specifically for the M-1 speaker. By pairing the M-1 with its dedicated stand, owners can position the speaker for ideal acoustic placement in any room.

  Available in matte black or matte white finishes, the FS-M-1 is built to complement the M-1 cabinet styling while providing a stable foundation that facilitates outstanding performance in any environment.

  The stand is sold as part of Bowers & Wilkins' accessories range. The speaker itself is not included.
