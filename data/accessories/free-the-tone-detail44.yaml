description: An instrument cable from Free The Tone's Integrated Series, derived
  from the CU-6550 with revised structural members and a different sound tuning
  for a punchier, lower-weighted tonal balance.
details: |-
  The Integrated Series was started as Free The Tone's 15th anniversary project, and the third release in it is the CUI-6550 instrument cable. It was productized by changing the structural members of the company's existing CU-6550 instrument cable and giving it a different sound tuning.

  The CU-6550 was built around the idea of a sound you do not want to stop playing, soft and natural in character. The CUI-6550 inherits that basic character but shifts its tonal balance lower, to suit the modern music scene and to give a more punchy sound that is not easily masked by other instruments. The tuning was checked at recording studios and concert venues.

  The conductor keeps the same number of core wires as the CU-6550, with the diameter of each wire increased for the punchier sound, and a special double structure is applied to the insulator so that an instrument's harmonic overtones and depth of sound come through.

  Two plug lengths are offered. The standard plug is the all-purpose type, and the long type suits a jack set in a deep or long recess such as on a Stratocaster. Free The Tone's wave pattern is cut into the plug surface for grip when inserting and removing the plug.

  Inside the plug, the tip section on the signal hot side uses a tongue-shaped contact, which gives a wider contact area for the core wires than a conventional contact with a hole and improves both sound quality and physical strength. On the sleeve side, where the shield is connected, pins clamp the cable firmly to reduce the chance of a wire break.
specs: |-
  - Plug types: Straight/Straight (S/S) and Straight/L-angle (S/L)
  - Lengths: 2 m, 3 m, 4 m, 5 m
  - Standard-length plug, the all-purpose type of the two offered
  - Conductor size: 0.5 mm2
  - Construction: 50/0.12A OFC (No/mm)
  - Insulation thickness: 1.55 mm (+/- 0.05)
  - Inner jacket thickness: 0.25 mm
  - Shield diameter: 5.00 mm
  - Jacket thickness: 0.75 mm (+/- 0.10)
  - Overall diameter: 6.50 mm (+/- 0.20)
  - Maximum conductor resistance at 20 C: 32.6 Ohm/km or less
  - Capacitance at 1 kHz: approx. 80 pF/m
  - Double-structure insulator
  - Tongue-shaped tip contact and sleeve-side clamping pins
  - Wave pattern cut into the plug surface for grip
