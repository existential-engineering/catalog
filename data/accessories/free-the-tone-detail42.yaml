name: VT-1H
manufacturer: free-the-tone
primaryCategory: other
url: https://www.freethetone.com/en/products/detail42/
description: A 25.4 mm wide hook-face fastener tape, custom ordered from Velcro
  and the same fastener FREE THE TONE uses to secure effects units on the
  pedalboards it builds for professional musicians.
details: |-
  FREE THE TONE builds custom pedalboards for many professional musicians and always uses the best fasteners available to secure effects units to the board. The fasteners sold here are the company's own, custom ordered from Velcro after testing many of that brand's products, and they are the ones actually used on those professional pedalboards.

  The VT-1H carries the hook face and the VT-1L carries the loop face. Both are 25.4 mm wide, and both faces are highly durable and can be used repeatedly.

  The page carries several application cautions. After application, use in an extremely high temperature or high humidity environment should be avoided. Under a continuous load the adhesive tape may distort and peel off even at normal temperature, and adhesion depends on the material of the surface the tape is applied to. Before applying the tape to an effects unit or a board, all dust and contamination should be cleaned off the surface.

  Velcro is a registered trademark of Velcro USA Inc.
specs: |-
  - Size (width): 25.4 mm (common to VT-1H and VT-1L)
  - Hook face (VT-1H) and loop face (VT-1L) sold separately
  - Custom ordered from Velcro, the same fastener used on FREE THE TONE professional pedalboards
  - Loop and hook faces are highly durable and can be used repeatedly
