details: |-
  This is a premium microphone cable, assembled in our shop using arguably the finest cable and connectors in the world. It is compatible with all Roswell microphones. Features and Benefits

  We use Gotham cable sourced from Switzerland. This is superior in design, materials, and construction to most alternative options, including "Gotham" branded cable made in China and sold for cheap on Amazon. Genuine GAC4/1 cable is a "star quad" design, with four independent signal conductors plus a double layer of woven copper shield. We use Neutrik EMC connectors, which provide a low-pass filter to pass audio signals but block higher-frequency cell, bluetooth, and wifi interference. Each cable is hand-soldered in our shop, then "burned in" for 72 hours on a proprietary voltage fixture to condition the cable dielectric (insulation). The cables are 15' in length. GAC-4/1 Details

  We are using genuine Gotham cable, manufactured in Switzerland. This is the original 11001 formulation, with 96 strands of copper per signal conductor -- not the inferior "v2" cable with 7 strands per conductor. Our cable has two complete (100% coverage) woven copper shields for superior EMI/RFI filtering; the cheap stuff sold elsewhere replaces one of those woven shields with a piece of metallized tape. Our cable has lower capacitance too (42pF/m for a single conductor vs 55pF/m). Lower-cost "GAC/4" cables are made with the "v2" version of GAC-4 cable, which is thicker, less flexible, less resistant to EMI/RFI, and has higher capacitance.
specs: |-
  - Genuine Gotham GAC-4/1 microphone cable
