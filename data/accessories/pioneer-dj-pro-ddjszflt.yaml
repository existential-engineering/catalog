description: Flight case for the DDJ-SZ and DDJ-SZ2
details: |-
  The PRO-DDJSZFLT offers the ultimate protection for your DDJ-SZ or DDJ-SZ2: a 5.5mm thick plywood carcass with vinyl covering held together by high grade aluminium extrusions, zinc-coated case hardware, and 4 rubber feet to offer extra grip in the booth.

  The case opens via 4 recessed butterfly catches; inside you'll find polyethylene foam insert that holds your controller securely. The lid incorporates polyurethane foam to further protect the unit in transit. Inside you'll also find a laptop stand, which folds flat inside the case when in transit. There's extra space behind the unit for mains and audio cables.
  Only available in Europe, the Middle East and Africa
