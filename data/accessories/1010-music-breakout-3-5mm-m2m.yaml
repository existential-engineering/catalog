details: |-
  The 1010music line of stereo breakout cables are designed to connect 2 mono audio signals to a single stereo TRS 3.5 mm minijack plug. The slim caps fit side by side with other cables in compactly spaced input jacks, like those on the 1010music bluebox. These cables may have been designed for the bluebox, but they have a wide variety of uses with other gear as well.

  Each cable connects two 3.5 mm male mono TS minijack plugs (left and right channels) to one 3.5 mm male stereo TRS minijack plug. Red and black end caps on the split end differentiate the left and right channels, and the 1010music logo is printed on all plug caps. Available individually and in 3 packs.
specs: |-
  - Length: 1.4 m/4.5 ft
  - Connector: one 3.5 mm male stereo TRS minijack to two 3.5 mm male mono TS plugs
  - Nickel / 24K Gold plated connectors
  - Highly flexible PVC / TPE jacket material
  - RoHS, UL, CE, and FCC approved
  - Pack sizes: Single, 3 Pack
