details: |-
  Dekoni Audio Ensemble 2.5mm TRRS for grell OAE 1 and OAE 2

  Connect your grell OAE1 or Crosszone OAE2 headphones to balanced portable sources and DAPs with the Dekoni Audio Ensemble 2.5mm TRRS Cable. Engineered to support specialized multi-driver pin configurations, this cable offers a direct, low-noise connection tailored for modern high-resolution audio players. Key Features

  Features a gold-plated 2.5mm TRRS balanced termination plug for maximum channel separation, reduced crosstalk, and improved signal headroom. Custom-wired for grell OAE1 and OAE2 headphone inputs, the low-impedance braided cable construction preserves natural spatial imaging and dynamic range. Built with precision aluminum hardware, flexible sleeving, and reinforced strain relief, it provides a sleek, reliable, and portable solution for discerning listeners on the go.
