details: |-
  Our 'Smoky Glow' Litz cable features Silver Plated Copper Litz wire conductors and our popular tangle-resistant twisted cable weave. We've added new Glow-In-The-Dark over-molds on both the MMCX connectors and the 3.5mm plug to compliment our new line of earphones. Our over-molded ear-hook design result is a lightweight cable that is a pleasure to use every day.
