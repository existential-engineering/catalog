description: Studio-grade power conditioner and surge protector
details: |-
  The PG-2 is a premium 2U rackmount power conditioner and surge protector with expanded outlet count and metering capabilities. It provides clean, stable power through 12 switched, filtered, and surge-protected outlets on the back panel, organized into four groups: Digital Audio (x2), Analog Audio, and High Current. Time-delayed outlets ensure speakers and power amplifiers power on last and off first, preventing audio pops.

  At the heart of the PG-2 is Black Lion Audio's PG-99 Filtering Technology, which achieves 99.7% average noise filtering using premium Panasonic and Wima capacitors — surpassing typical 85% filtering found at similar price points. This ensures that sensitive audio equipment receives the cleanest possible power, free from AC noise that can degrade audio signal quality.

  The PG-2 features a voltage meter and amperage meter for real-time power analysis, along with LED status indicators for grounding, polarity, noise filtering, abnormal voltage, and surge protection. An audio alarm alerts users to unsafe voltage conditions. Two front-panel unswitched convenience outlets, a USB charger, and XLR lamp connectors on both front and back panels round out the feature set.
specs: |-
  - PG-99 Filtering Technology — 99.7% average noise filtering
  - Premium Panasonic and Wima capacitors
  - 12 rear switched, filtered, surge-protected outlets (4 groups: Digital Audio x2, Analog Audio, High Current)
  - 2 front unswitched filtered convenience outlets
  - Front USB charger
  - XLR lamp connectors on front and back panels
  - Time-delayed High Current outlets
  - 2775 joules power absorption (surge protection)
  - Voltage meter and amperage meter
  - LED status indicators: grounding, polarity, noise filtering, abnormal voltage, surge protection
  - Audio alarm for unsafe voltage conditions
  - 2U rackmount form factor
